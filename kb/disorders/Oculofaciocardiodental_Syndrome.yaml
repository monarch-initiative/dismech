name: Oculofaciocardiodental Syndrome
creation_date: "2026-08-01T18:00:00Z"
description: >-
  Oculofaciocardiodental (OFCD) syndrome, also designated microphthalmia,
  syndromic 2 (MCOPS2), is an ultra-rare X-linked dominant, male-lethal
  multiple congenital anomaly syndrome caused by loss-of-function variants in
  BCOR at Xp11.4. BCOR encodes the BCL-6 corepressor, a scaffold subunit of the
  non-canonical Polycomb repressive complex 1.1 (ncPRC1.1). The four cardinal
  domains are ocular (congenital cataract, microphthalmia, microcornea),
  facial (long narrow face, nasal tip anomalies, cleft palate), cardiac
  (atrial and ventricular septal defects), and dental, the last including
  radiculomegaly — gigantism of the tooth roots, particularly the canines —
  which is the syndrome's pathognomonic feature. Because affected individuals
  are heterozygous females in whom X-inactivation produces a mosaic of
  BCOR-deficient and BCOR-competent cells, expressivity is highly variable
  both between and within families.
category: Mendelian
parents:
- hereditary disease
- syndromic microphthalmia
synonyms:
- microphthalmia, syndromic 2
- MCOPS2
- OFCD syndrome
- oculo-facio-cardio-dental syndrome
- cataract-microphthalmia-radiculomegaly-cardiac septal defect syndrome
disease_term:
  preferred_term: oculofaciocardiodental syndrome
  term:
    id: MONDO:0010261
    label: microphthalmia, syndromic 2
notes: >-
  BCOR is the shared cause of two mechanistically distinct X-linked syndromes,
  and the distinction is the principal source of entity confusion in this
  space. OFCD (MCOPS2, MONDO:0010261, OMIM:300166) arises from null/truncating
  BCOR variants in heterozygous females and is presumed lethal in hemizygous
  males. Lenz microphthalmia syndrome (MCOPS1, OMIM:309800) arises from
  hypomorphic BCOR variants — chiefly the recurrent missense c.254C>T,
  p.(Pro85Leu) — and affects hemizygous males in an X-linked recessive
  pattern. The two are allelic but are separate dismech entities; curation
  sourced from literature on one must not be transferred to the other.
  Ragge et al. (PMID:29974297) proposed the unifying term "X-linked
  BCOR-related syndrome" for the combined spectrum. Germline BCOR loss in OFCD
  is also distinct from the recurrent somatic BCOR alterations (internal
  tandem duplications, fusions) that drive clear cell sarcoma of the kidney,
  AML, and other malignancies; those are unrelated cancer biology and are not
  part of this entry. No GeneReviews chapter exists for OFCD syndrome or for
  BCOR-related disorders (PubMed searched 2026-08-01); the
  Microphthalmia/Anophthalmia/Coloboma Spectrum chapter is retired.
inheritance:
- name: X-linked dominant inheritance
  description: >-
    OFCD is inherited as an X-linked dominant trait with presumed lethality in
    hemizygous males, so essentially all reported patients are female. Most
    cases are de novo; mother-to-daughter transmission and parental germline
    mosaicism are both documented. Skewed X-chromosome inactivation in
    affected females and their relatives supports the X-linked dominant model.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oculofaciocardiodental syndrome (OFCD; OMIM 300166) is inherited in an X-linked dominant pattern with presumed male lethality"
    explanation: The gene-discovery study states the X-linked dominant, male-lethal inheritance pattern of OFCD.
  - reference: PMID:29974297
    reference_title: "Expanding the phenotype of the X-linked BCOR microphthalmia syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OFCD is an X-linked dominant syndrome caused by a variety of BCOR null mutations. As it manifests only in females, it is presumed to be lethal in males."
    explanation: A 16-case series confirms X-linked dominance with presumed male lethality and null-variant causation.
  - reference: PMID:14608648
    reference_title: "Oculo-facio-cardio-dental syndrome: skewed X chromosome inactivation in mother and daughter suggest X-linked dominant Inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these cases represent the second documented instance of mother-to-daughter OFCD transmission"
    explanation: Mother-to-daughter transmission with skewed X-inactivation established the X-linked dominant model.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2018 systematic review of the English-language literature identified 92
    published OFCD cases, the best available denominator for this ultra-rare
    syndrome. No population-based prevalence estimate exists; the literature
    consists almost entirely of single case reports and small family series,
    so this count is a lower bound on true occurrence rather than a rate.
  evidence:
  - reference: PMID:29574060
    reference_title: "Radiculomegaly: a case report of this rare dental finding with review of the associated oculo-facio-cardio-dental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-seven cases of radiculomegaly and 92 cases of OFCD syndrome were found in the literature."
    explanation: Systematic literature review quantifying the total number of published OFCD cases.
pathophysiology:
- name: BCOR Loss of Function
  biological_scale: MOLECULAR
  description: >-
    OFCD is caused by heterozygous null variants in BCOR (Xp11.4) — nonsense,
    frameshift, canonical splice-site, and partial or whole-gene deletions —
    which eliminate functional BCL-6 corepressor protein. This truncating
    variant class is what distinguishes OFCD from Lenz microphthalmia
    syndrome, which arises from hypomorphic missense alleles at the same
    locus.
  molecular_functions:
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  genes:
  - preferred_term: BCOR
    term:
      id: hgnc:20893
      label: BCOR
  evidence:
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found different frameshift, deletion and nonsense mutations in BCOR in seven families affected with OFCD"
    explanation: Establishes truncating/null BCOR variants as the cause of OFCD across seven families.
  - reference: PMID:22301464
    reference_title: "A family of oculofaciocardiodental syndrome (OFCD) with a novel BCOR mutation and genomic rearrangements involving NHS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel heterozygous mutation, c.888delG, in the BCOR gene"
    explanation: A frameshift BCOR variant segregating in three affected females of one family.
  downstream:
  - target: ncPRC1.1 Corepressor Deficiency
    description: >-
      Loss of the BCOR scaffold prevents assembly of a functional ncPRC1.1
      complex.
    evidence:
    - reference: PMID:32692983
      reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BCOR associates with Polycomb group proteins to form one subfamily of the diverse Polycomb repressive complex 1 (PRC1) complexes, designated PRC1.1."
      explanation: >-
        Supports the specific edge from BCOR loss to ncPRC1.1 deficiency: BCOR
        is a constituent subunit, so its loss removes the complex's scaffold.
- name: ncPRC1.1 Corepressor Deficiency
  biological_scale: MOLECULAR
  description: >-
    BCOR is a defining scaffold subunit of the non-canonical Polycomb
    repressive complex 1.1 (ncPRC1.1), which also contains RING1/RING1B,
    PCGF1/PCGF3/PCGF5, SKP1, and the CpG-island-binding demethylase KDM2B.
    Loss of BCOR therefore removes a Polycomb-mediated repressive input at
    developmental target genes, making OFCD fundamentally an epigenetic
    corepressor deficiency rather than a structural-protein defect. Notably,
    OFCD-mutant BCOR retains the ability to bind BCL-6 and repress
    transcription in reporter assays, indicating the pathogenic defect lies in
    BCOR functions beyond simple BCL-6 corepression (see
    mechanistic_hypotheses).
  protein_complexes:
  - preferred_term: PRC1 complex
    term:
      id: GO:0035102
      label: PRC1 complex
    modifier: DECREASED
  biological_processes:
  - preferred_term: heterochromatin formation
    term:
      id: GO:0031507
      label: heterochromatin formation
    modifier: DECREASED
  evidence:
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BCOR associates with Polycomb group proteins to form one subfamily of the diverse Polycomb repressive complex 1 (PRC1) complexes, designated PRC1.1."
    explanation: Establishes BCOR as a constituent of the ncPRC1.1 Polycomb complex.
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Like wild-type BCOR, BCOR P85L and an OFCD-mutant form of BCOR can interact with BCL-6 and efficiently repress transcription. This indicates that these syndromes are likely to result from defects in alternative functions of BCOR"
    explanation: >-
      Qualifies the mechanism: OFCD-mutant BCOR retains BCL-6 corepression in
      vitro, so pathogenesis is attributed to other BCOR functions. Marked
      PARTIAL because it constrains rather than confirms the ncPRC1.1 model.
  downstream:
  - target: Mosaic BCOR Deficiency from X-Inactivation
    description: >-
      Because BCOR is X-linked, the corepressor deficiency is distributed
      mosaically across tissues in heterozygous females.
    evidence:
    - reference: PMID:32692983
      reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Females heterozygous for Bcor exhibiting mosaic expression due to the X-linkage of the gene showed reduced postnatal viability and had OFCD-like defects."
      explanation: >-
        Supports the specific edge: X-linkage converts the corepressor
        deficiency into a mosaic tissue distribution that yields OFCD-like
        defects.
- name: Mosaic BCOR Deficiency from X-Inactivation
  biological_scale: CELLULAR
  description: >-
    In heterozygous females, random X-chromosome inactivation produces a
    mosaic of cells expressing either the wild-type or the null BCOR allele.
    Which lineages happen to carry an active mutant allele determines which
    organ systems are affected and how severely, accounting for the marked
    variability in expressivity between and within families. In hemizygous
    males no wild-type allele exists in any lineage, and development fails
    outright.
  evidence:
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Females heterozygous for Bcor exhibiting mosaic expression due to the X-linkage of the gene showed reduced postnatal viability and had OFCD-like defects."
    explanation: Mouse heterozygotes with mosaic Bcor expression reproduce OFCD-like defects, supporting the mosaicism model.
  - reference: PMID:29974297
    reference_title: "Expanding the phenotype of the X-linked BCOR microphthalmia syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that a mosaic carrier mother manifested early cataract and dental anomalies."
    explanation: A mosaic carrier manifesting partial features directly demonstrates dosage/mosaicism-dependent expressivity.
  downstream:
  - target: Neural Crest-Dependent Craniofacial Maldevelopment
    description: >-
      BCOR-deficient cranial neural crest produces the craniofacial domain of
      the syndrome.
    evidence:
    - reference: PMID:32692983
      reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutation of Bcor in neural crest cells caused cleft palate, shortening of the mandible and tympanic bone, ectopic salivary glands and abnormal tongue musculature."
      explanation: >-
        Lineage-restricted deletion supports this specific edge from BCOR
        deficiency to the craniofacial phenotype via neural crest.
  - target: Cardiac Progenitor Lineage Septation Defect
    description: >-
      BCOR-deficient Isl1-lineage cardiac progenitors produce the septal and
      outflow-tract defects.
    evidence:
    - reference: PMID:32692983
      reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutation of Bcor in Isl1-expressing lineages that contribute to the heart caused defects including persistent truncus arteriosus, ventricular septal defect and fetal lethality."
      explanation: >-
        Lineage-restricted deletion supports this specific edge from BCOR
        deficiency to cardiac septation failure.
  - target: Ocular Developmental Defect
    description: >-
      BCOR deficiency in ocular lineages produces cataract, microphthalmia,
      and microcornea.
    evidence:
    - reference: PMID:15004558
      reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "knock-down of this ortholog caused developmental perturbations of the eye"
      explanation: >-
        Supports this specific edge: reducing bcor function perturbs eye
        development in a vertebrate model.
  - target: ZFPM2 Derepression and Hyperactive Tooth Root Formation
    description: >-
      BCOR deficiency in periodontal ligament lineages derepresses ZFPM2 and
      drives excess root formation.
    hypothesis_groups:
    - radiculomegaly_zfpm2_route
    evidence:
    - reference: PMID:35957990
      reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "our findings suggest that BCOR mutation-induced ZFPM2 regulation via BCL6 possibly contributes to hyperactive root formation in OFCD syndrome"
      explanation: >-
        Supports this specific edge from BCOR deficiency to hyperactive root
        formation through ZFPM2.
  - target: AP-2alpha Derepression and MSC Osteo-Dentinogenic Reprogramming
    description: >-
      BCOR deficiency in dental mesenchymal stem cells derepresses AP-2alpha
      and increases osteo-dentinogenic capacity — the alternative molecular
      account of the same radiculomegaly endpoint.
    hypothesis_groups:
    - radiculomegaly_ap2alpha_route
    evidence:
    - reference: PMID:19578371
      reference_title: "BCOR regulates mesenchymal stem cell function by epigenetic mechanisms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "BCOR mutation increased the osteo-dentinogenic potential of mesenchymal stem cells (MSCs) isolated from a patient with OFCD, providing a molecular explanation for abnormal root growth"
      explanation: >-
        Supports this specific edge from BCOR deficiency to increased
        osteo-dentinogenic capacity in patient-derived MSCs.
  - target: Unrestrained Notch Signaling and Pitx2 Suppression
    description: >-
      Loss of BCL6-BCOR restraint on Notch target promoters releases Notch
      output in the left lateral plate mesoderm.
    evidence:
    - reference: PMID:20230751
      reference_title: "BCL6 canalizes Notch-dependent transcription, excluding Mastermind-like1 from selected target genes during left-right patterning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BCL6 also inhibits the transcription of these genes by competing for the Notch1 intracellular domain, preventing the coactivator Mastermind-like1 (MAM1) from binding"
      explanation: >-
        Supports this specific edge: the BCL6-BCOR complex is the restraint on
        Notch target transcription that BCOR loss removes.
  - target: Hemizygous Male Embryonic Lethality
    description: >-
      Where no BCOR-competent lineage exists at all — the hemizygous male —
      development fails outright rather than producing a mosaic phenotype.
    evidence:
    - reference: PMID:32692983
      reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By contrast, Bcor hemizygosity in the entire male embryo resulted in embryonic lethality by E9.5."
      explanation: >-
        Supports this specific edge by contrasting whole-embryo hemizygosity
        (lethal) with the mosaic heterozygous state (viable, OFCD-like).
- name: Neural Crest-Dependent Craniofacial Maldevelopment
  biological_scale: TISSUE
  description: >-
    BCOR is required in cranial neural crest cells for normal craniofacial
    morphogenesis. Conditional deletion of Bcor in neural crest produces cleft
    palate, mandibular and tympanic bone shortening, ectopic salivary glands,
    and abnormal tongue musculature. Importantly, the primary lesion localizes
    to the mandibular region rather than the palatal shelves themselves, so
    cleft palate in OFCD is a secondary consequence of disrupted
    mandibular/pharyngeal-arch development rather than a primary palatal
    fusion defect.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: palate development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutation of Bcor in neural crest cells caused cleft palate, shortening of the mandible and tympanic bone, ectopic salivary glands and abnormal tongue musculature."
    explanation: Lineage-restricted deletion localizes the craniofacial phenotype to neural crest requirement for Bcor.
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that defects in the mandibular region, rather than in the palate itself, led to palatal clefting."
    explanation: Establishes cleft palate as secondary to mandibular maldevelopment rather than a primary palatal defect.
- name: Cardiac Progenitor Lineage Septation Defect
  biological_scale: TISSUE
  description: >-
    BCOR is required in Isl1-expressing cardiac progenitor lineages for normal
    cardiac septation and outflow-tract development. Conditional deletion
    produces persistent truncus arteriosus, ventricular septal defect, and
    fetal lethality, providing a lineage-level mechanism for the atrial and
    ventricular septal defects seen in OFCD patients.
  biological_processes:
  - preferred_term: ventricular septum development
    term:
      id: GO:0003281
      label: ventricular septum development
    modifier: ABNORMAL
  - preferred_term: atrial septum development
    term:
      id: GO:0003283
      label: atrial septum development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutation of Bcor in Isl1-expressing lineages that contribute to the heart caused defects including persistent truncus arteriosus, ventricular septal defect and fetal lethality."
    explanation: Lineage-restricted deletion links BCOR loss in cardiac progenitors to septal and outflow-tract defects.
- name: Ocular Developmental Defect
  biological_scale: TISSUE
  description: >-
    BCOR loss disrupts anterior-segment and globe development, producing
    congenital cataract, microphthalmia, and microcornea, with secondary
    glaucoma in a subset. Cataract is the most consistent ocular finding.
    Zebrafish bcor knockdown perturbs eye development, corroborating a
    conserved developmental requirement, but a BCOR-specific lens or optic-cup
    mechanism has not been elucidated in human tissue.
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  biological_processes:
  - preferred_term: embryonic camera-type eye development
    term:
      id: GO:0031076
      label: embryonic camera-type eye development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29974297
    reference_title: "Expanding the phenotype of the X-linked BCOR microphthalmia syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our female OFCD cases and their affected female relatives showed variable features, but consistently had early onset cataracts."
    explanation: Cataract is the most consistent ocular feature across a 16-case series.
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "knock-down of this ortholog caused developmental perturbations of the eye, skeleton and central nervous system consistent with the human syndromes"
    explanation: Zebrafish bcor knockdown recapitulates ocular developmental perturbation, supporting a conserved requirement.
- name: ZFPM2 Derepression and Hyperactive Tooth Root Formation
  biological_scale: CELLULAR
  description: >-
    Radiculomegaly arises from loss of BCOR-mediated repression at the ZFPM2
    promoter. In periodontal ligament cells from a patient with a BCOR
    frameshift variant (c.3668delC), mutant BCOR fails to be recruited to the
    BCL6-binding region of the ZFPM2 promoter, ZFPM2 is derepressed, and
    alkaline phosphatase — a marker of odontoblast and cementoblast
    differentiation — is upregulated, driving continued root elongation.
    ZFPM2 knockdown normalizes both proliferation and alkaline phosphatase
    expression, closing the causal loop.
  cell_types:
  - preferred_term: periodontal ligament fibroblast
    term:
      id: CL:0002556
      label: fibroblast of periodontium
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  - preferred_term: cementoblast
    term:
      id: CL:0000061
      label: cementoblast
  biological_processes:
  - preferred_term: odontogenesis of dentin-containing tooth
    term:
      id: GO:0042475
      label: odontogenesis of dentin-containing tooth
    modifier: INCREASED
  evidence:
  - reference: PMID:35957990
    reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Promoter binding assays showed that wild-type BCOR was recruited in the BCL6 binding of the ZFPM2 promoter region after immunoprecipitation, while mutant BCOR, which was the same genotype as of our patient, failed to recruit these promoter regions."
    explanation: Demonstrates loss of mutant BCOR recruitment to the ZFPM2 promoter as the proximal molecular defect.
  - reference: PMID:35957990
    reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockdown of ZFPM2 expression in mutant PDL cells significantly reduced cellular proliferation as well as mRNA expression of alkaline phosphatase, an important marker of odontoblasts and cementoblasts."
    explanation: ZFPM2 knockdown rescues the cellular phenotype, establishing ZFPM2 derepression as causal.
- name: AP-2alpha Derepression and MSC Osteo-Dentinogenic Reprogramming
  biological_scale: CELLULAR
  description: >-
    A second, chromatin-level account of radiculomegaly. In mesenchymal stem
    cells isolated from an OFCD patient, BCOR mutation raises histone H3K4 and
    H3K36 methylation and reactivates silenced target genes, derepressing the
    transcription factor AP-2alpha (TFAP2A). AP-2alpha in turn mediates
    increased osteo-dentinogenic capacity, so the root continues to mineralize
    past the point at which it normally stops. This is mechanistically
    distinct from — and not obviously reducible to — the ZFPM2 account, and
    the two are curated as competing hypotheses (see mechanistic_hypotheses).
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: biomineral tissue development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: INCREASED
  evidence:
  - reference: PMID:19578371
    reference_title: "BCOR regulates mesenchymal stem cell function by epigenetic mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BCOR mutation increased the osteo-dentinogenic potential of mesenchymal stem cells (MSCs) isolated from a patient with OFCD, providing a molecular explanation for abnormal root growth"
    explanation: Patient-derived MSCs link BCOR mutation directly to increased osteo-dentinogenic potential and root overgrowth.
  - reference: PMID:19578371
    reference_title: "BCOR regulates mesenchymal stem cell function by epigenetic mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AP-2alpha was identified as a repressive target of BCOR, and BCOR mutation resulted in abnormal activation of AP-2alpha."
    explanation: Identifies AP-2alpha as the derepressed BCOR target mediating the effect.
  - reference: PMID:19578371
    reference_title: "BCOR regulates mesenchymal stem cell function by epigenetic mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BCOR mutation increased histone H3K4 and H3K36 methylation in MSCs, thereby reactivating transcription of silenced target genes."
    explanation: Establishes the chromatin-level mechanism by which BCOR loss reactivates silenced targets.
- name: Unrestrained Notch Signaling and Pitx2 Suppression
  biological_scale: CELLULAR
  description: >-
    A left-right patterning arm accounting for the cardiac and laterality
    features. The BCL6-BCOR complex normally occupies the promoters of
    selected Notch target genes and excludes the coactivator Mastermind-like1,
    restraining Notch output. When BCOR is lost, unrestrained Notch activity in
    the left lateral plate mesoderm drives the Notch effector ESR1 (enhancer of
    split related 1) to bind the left-side-specific ASE enhancer of Pitx2 and
    recruit HDAC1, displacing p300 and silencing Pitx2 — the terminal effector
    of the left-right cascade. This offers a route to septal and laterality
    defects that is separate from the Isl1-lineage septation requirement.
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: INCREASED
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20230751
    reference_title: "BCL6 canalizes Notch-dependent transcription, excluding Mastermind-like1 from selected target genes during left-right patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BCL6 forms a complex with BCL6 corepressor (BCoR) on the promoters of selected Notch target genes"
    explanation: Establishes that BCL6-BCOR occupies Notch target promoters, the restraint that is lost in OFCD.
  - reference: PMID:24440151
    reference_title: "A potential molecular pathogenesis of cardiac/laterality defects in Oculo-Facio-Cardio-Dental syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

discussions:
- discussion_id: ofcd_radiculomegaly_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#ZFPM2 Derepression and Hyperactive Tooth Root Formation"
  prompt: >-
    Can the mechanism of radiculomegaly — the pathognomonic feature of OFCD —
    be validated in any model system, given that mice cannot develop the
    phenotype at all?
  rationale: >-
    Conditional Bcor knockout mice reproduce the craniofacial, cardiac, and
    limb features of OFCD but do not develop radiculomegaly. Mice are
    monophyodont with continuously erupting molars and no diphyodont
    replacement dentition, so the human root-length developmental program that
    fails in OFCD has no murine counterpart. The mechanism is therefore
    supported only by in vitro work on periodontal ligament cells from a
    single patient (PMID:35957990), with no in vivo confirmation available in
    the standard model organism. This matters because radiculomegaly is the
    syndrome's most specific diagnostic feature, so its mechanism is
    disproportionately important relative to the evidence supporting it.
  proposed_experiments:
  - experiment_id: exp_ofcd_zfpm2_multipatient_pdl_replication
    name: Multi-patient replication of ZFPM2 derepression in periodontal ligament cells
    description: >-
      Replicate the ZFPM2 derepression finding in periodontal ligament and
      dental pulp cells from additional, independently ascertained OFCD
      patients carrying different BCOR null alleles. The current result rests
      on cells from a single patient with one frameshift variant
      (c.3668delC), so allele- and patient-independence remain untested.
  - experiment_id: exp_ofcd_diphyodont_in_vivo_root_elongation
    name: BCOR-BCL6-ZFPM2 axis in a diphyodont in vivo model
    description: >-
      Test the BCOR-BCL6-ZFPM2 axis in a model species with a replacement
      dentition (pig or ferret), where root elongation can be assessed in
      vivo. This is the direct route around the murine monophyodont
      limitation that makes mouse models structurally incapable of expressing
      the phenotype.
  - experiment_id: exp_ofcd_ipsc_dental_organoid_sufficiency
    name: iPSC dental organoid test of ZFPM2 sufficiency
    description: >-
      Use patient-derived iPSC dental organoids to determine whether ZFPM2
      derepression is sufficient — not merely necessary — to drive excess
      cementum and dentin deposition, complementing the existing knockdown
      evidence for necessity.
  evidence:
  - reference: PMID:35957990
    reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the molecular mechanism underlying the occurrence of radiculomegaly is still unknown"
    explanation: The primary mechanistic study itself frames radiculomegaly as mechanistically unresolved.
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The defects we have found in Bcor mutants provide insights into the etiology of the OFCD syndrome"
    explanation: >-
      The comprehensive conditional mouse study reports craniofacial, cardiac,
      limb, and extraembryonic phenotypes but no dental root phenotype,
      illustrating the model's blind spot for this feature.

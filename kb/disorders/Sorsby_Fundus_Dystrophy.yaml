notes: >-
  Naming. "Sorsby Fundus Dystrophy" is kept rather than a gene-related dyad: no
  MONDO label or exact synonym, OMIM title, ClinGen-preferred label or
  GeneReviews chapter title uses a TIMP3-related form for this disease, and the
  eponym is specific to the single-gene entity ClinGen curates. The MONDO label,
  the Orphanet synonyms and the historical pseudoinflammatory names are kept in
  synonyms. Note that "TIMP3-related retinopathy" does appear in the literature
  (PMID:35679059) for a phenotype the authors distinguish from classic SFD, so
  adopting it as this entry's name would widen the scope.
  Scope, and why the MONDO descendant is left out. MONDO:0009918 "fundus
  dystrophy, pseudoinflammatory, recessive form" (OMIM 264420) is a descendant
  of this entry's term and is not curated as a has_subtypes entry. That concept
  rests on one consanguineous Finnish family reported as autosomal recessive
  (PMID:7148944). The same family was later found to carry a heterozygous
  Gly166Cys TIMP3 variant segregating with disease, which the authors read as
  autosomal dominant inheritance, and ClinGen's lumping and splitting assessment
  records the proposed recessive mechanism as refuted. MONDO records no causal
  gene for MONDO:0009918 (read from the OLS MONDO record for that term), so
  there is no sourced TIMP3 basis on which to curate it as a distinct subtype;
  both statements are cited in the inheritance block. The entity is left out
  rather than mapped, and the lump follows ClinGen's own decision to treat
  TIMP3-variant cases as one disease.
  Deliberately lumped. Early-onset and late-onset presentations, and the
  N-terminal (exon 1) and C-terminal (exon 5) variant classes, are kept in one
  entry rather than split into subtypes. ClinGen's Retina GCEP found the
  molecular mechanism and the autosomal dominant inheritance pattern consistent
  across unrelated patients and judged the phenotypic variability, early versus
  late onset in particular, to be a spectrum rather than separate entities.
  Signal-peptide variants (L10H, G12R) are the one reported group whose authors
  argue for a distinct entity; they are recorded in the genetic section with
  that caveat rather than as a subtype, because the cited series reports no
  choroidal neovascularization and a different biochemical defect, and no
  separate disease concept for them exists in MONDO.
  No GeneReviews chapter names this disease or TIMP3: PubMed searches
  '"Sorsby"[TI] AND genereviews[book] NOT retired[TI]', 'Sorsby[TIAB] AND
  genereviews[book] NOT retired[TI]' and 'TIMP3[TIAB] AND genereviews[book] NOT
  retired[TI]' each returned zero, and the committed Bookshelf index holds no
  matching chapter. The phenotype baseline here is therefore the Orphanet HPO
  annotation set (ORPHA:59181), the ClinGen evidence summary and the primary
  clinical series.
  Variant numbering in this literature is inconsistent: positions are quoted
  both with and without the 23-residue signal peptide, so the same allele
  appears as S156C or S179C, S181C or S204C, and Y168C or Y191C. The
  conventional numbering of the secreted protein is used in the variant names
  here, with the alternative given in the variant synonyms where a cited source
  uses it.
  Diagnostic imaging modalities are described in the diagnosis entries rather
  than bound in their `measurements` slots, whose range is restricted to LOINC
  codes; the NCIT procedure terms for optical coherence tomography and
  indocyanine green angiography cannot sit there.
pathophysiology:
- name: TIMP3 Cysteine-Altering Variant
  description: >-
    A heterozygous TIMP3 variant, in most reported cases a missense change in
    exon 5 affecting the C-terminal domain of the protein, adds or removes a
    cysteine residue and so disturbs the arrangement of the conserved cysteines
    and disulfide bonds that hold the tertiary structure together. A minority of
    reported alleles do not alter a cysteine (for example His158Arg) or lie
    outside exon 5 (Ser38Cys in exon 1), and one nonsense allele leaves an
    unpaired cysteine. Mutant protein continues to be expressed and to localize
    to the extracellular matrix, so the primary consequence is an altered
    protein rather than its absence.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TIMP3
    term:
      id: hgnc:11822
      label: TIMP3
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  molecular_functions:
  - preferred_term: TIMP-3 metalloendopeptidase inhibitor activity
    term:
      id: GO:0008191
      label: metalloendopeptidase inhibitor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:7894485
    reference_title: Mutations in the tissue inhibitor of metalloproteinases-3 (TIMP3) in patients with Sorsby's fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have now identified point mutations in the TIMP3 gene in affected members of two SFD pedigrees."
    explanation: The gene discovery study identified TIMP3 point mutations in affected members of two SFD families.
  - reference: PMID:7894485
    reference_title: Mutations in the tissue inhibitor of metalloproteinases-3 (TIMP3) in patients with Sorsby's fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations are predicted to disrupt the tertiary structure and thus the functional properties of the mature protein."
    explanation: States the predicted structural consequence of the variants on the mature protein.
  - reference: PMID:28847738
    reference_title: Sorsby fundus dystrophy - A review of pathology and disease mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most SFD-associated TIMP3 variants involve the gain or loss of a cysteine residue."
    explanation: A review of the reported variant set states that most alter a cysteine residue.
  - reference: PMID:37013036
    reference_title: Evidence that all Sorsby's fundus dystrophy mutations cause TIMP3 dimerization resulting in impaired inhibition of VEGFR2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, eleven mutations result in a change to a cysteine residue, while the nonsense mutation (E139X), also gives rise to an unpaired cysteine residue."
    explanation: Counts the cysteine-altering alleles among the fifteen TIMP3 variants known at the time.
  - reference: PMID:16989765
    reference_title: A novel His158Arg mutation in TIMP3 causes a late-onset form of Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His158Arg is the first reported TIMP3 SFD coding sequence mutation that does not create an unpaired cysteine."
    explanation: Documents the exception, a disease-causing allele that does not alter a cysteine.
  downstream:
  - target: Aberrant TIMP-3 Disulfide Bonding and Multimerization
    causal_link_type: DIRECT
    description: >-
      The unpaired cysteine introduced by the variant forms intermolecular or
      aberrant intramolecular disulfide bonds, so the mutant protein dimerizes
      or multimerizes.
    evidence:
    - reference: PMID:10854443
      reference_title: A novel tissue inhibitor of metalloproteinases-3 mutation reveals a common molecular phenotype in Sorsby's fundus dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, unlike wild-type TIMP-3, they all form dimers."
      explanation: Expressing the mutant alleles shows that dimer formation, absent for wild-type protein, is common to them.
    - reference: PMID:30668888
      reference_title: The N-terminal p.(Ser38Cys) TIMP3 mutation underlying Sorsby fundus dystrophy is a founder mutation disrupting an intramolecular disulfide bond.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data provide evidence for disruption of the established Cys36-Cys143 disulfide bond and formation of a novel Cys36-Cys38 bond, possibly associated with increased glycosylation of the protein."
      explanation: For the N-terminal allele the aberrant bonding is intramolecular rather than a dimer, which is why this node is written as aberrant disulfide bonding generally.
  - target: Increased MMP2 Activity and bFGF Release
    causal_link_type: DIRECT
    description: >-
      Mutant TIMP-3 restrains metalloproteinases less well in vivo, raising MMP2
      activity and the level of basic fibroblast growth factor.
    evidence:
    - reference: PMID:31757977
      reference_title: Sorsby Fundus Dystrophy Mutation in Tissue Inhibitor of Metalloproteinase 3 (TIMP3) promotes Choroidal Neovascularization via a Fibroblast Growth Factor-dependent Mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study we demonstrate that mice expressing mutant TIMP3 (Timp3S179C/S179C) showed reduced MMP inhibitory activity with an increase in MMP2 activity and bFGF levels, as well as accentuated CNV leakage when subjected to laser injury."
      explanation: In the knock-in mouse the mutant protein is associated with reduced MMP inhibition, higher MMP2 activity and raised bFGF.
  - target: RPE Glucose and Glutamine Metabolic Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mutant TIMP3 is accompanied by a metabolism-weighted change in the RPE
      proteome and by raised glycolytic flux; how the extracellular protein
      produces the intracellular metabolic change is not established.
    evidence:
    - reference: PMID:39047907
      reference_title: Tissue Inhibitor of Metalloproteinase 3 (TIMP3) mutations increase glycolytic activity and dysregulate glutamine metabolism in RPE cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Quantitative proteomics and enrichment analysis conducted on RPE of mice expressing mutant S179C TIMP3 identified differentially expressed proteins that were enriched for metabolism-related pathways and processes."
      explanation: In mutant mouse RPE the differentially expressed proteins are enriched for metabolic pathways, which is what links the variant to this node.
  - target: Increased RPE Susceptibility to Oxidative Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mutant Timp3 is associated with a pro-oxidant state in the RPE; the steps
      between the altered protein and that state are not established.
    evidence:
    - reference: PMID:32828705
      reference_title: The retinal pigment epithelium in Sorsby Fundus Dystrophy shows increased sensitivity to oxidative stress-induced degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Antioxidant genes are increased at baseline in the RPE in SFD mouse models, but not in the retina."
      explanation: The mutant mouse RPE shows a baseline antioxidant gene response, which the authors read as a pro-oxidant environment.
- name: Aberrant TIMP-3 Disulfide Bonding and Multimerization
  description: >-
    Mutant TIMP-3 forms disulfide-bonded dimers and higher-molecular-weight
    complexes in the extracellular matrix. The complexes retain the protein's
    metalloproteinase-inhibitory activity and its matrix localization in most
    assays, so the molecular lesion is an altered quaternary state rather than a
    dead enzyme inhibitor. Two separable consequences follow: the complexes
    resist turnover, and they inhibit VEGFR2 less well.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: aberrant TIMP-3 protein dimerization
    term:
      id: GO:0046983
      label: protein dimerization activity
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: TIMP-3 multimer formation
    term:
      id: GO:0051260
      label: protein homooligomerization
    modifier: INCREASED
  evidence:
  - reference: PMID:37013036
    reference_title: Evidence that all Sorsby's fundus dystrophy mutations cause TIMP3 dimerization resulting in impaired inhibition of VEGFR2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In summary, our data support the hypothesis that all SFD-mutated forms of TIMP3 result in dimerization/multimerization of the protein which in turn significantly impairs its ability to inhibit the proangiogenic growth factor receptor VEGFR2."
    explanation: Expression of the full reported variant set in RPE-derived cells supports dimerization or multimerization as a common molecular phenotype.
  - reference: PMID:9642234
    reference_title: Localization of the functional domains of human tissue inhibitor of metalloproteinases-3 and the effects of a Sorsby's fundus dystrophy mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This gave rise to an additional 48-kDa species (possibly a TIMP-3 dimer) that retained its ability to inhibit MMPs and localize to the ECM."
    explanation: The Ser181Cys protein forms an extra species of about twice the monomer mass while keeping inhibitory activity and matrix binding.
  - reference: PMID:11827795
    reference_title: "Sorsby's fundus dystrophy tissue inhibitor of metalloproteinases-3 (TIMP-3) mutants have unimpaired matrix metalloproteinase inhibitory activities, but affect cell adhesion to the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two of the mutants (Ser156Cys and Ser181Cys) showed a marked propensity to form multiple higher molecular-weight complexes that retained TIMP activity on reverse zymography."
    explanation: Documents higher-molecular-weight complexes that keep inhibitory activity, for two of the four mutants assayed.
  - reference: PMID:11827795
    reference_title: "Sorsby's fundus dystrophy tissue inhibitor of metalloproteinases-3 (TIMP-3) mutants have unimpaired matrix metalloproteinase inhibitory activities, but affect cell adhesion to the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that the pathogenesis of Sorsby's fundus dystrophy cannot be attributed to a failure to localize SFD TIMP-3 proteins to the ECM or defects in MMP inhibition, but may involve the formation of aberrant TIMP-3-containing protein complexes and altered cell adhesion."
    explanation: Supports writing the node as an altered quaternary state rather than as loss of matrix binding or of inhibitory function.
  - reference: PMID:36430707
    reference_title: "Deglycosylation Increases the Aggregation and Angiogenic Properties of Mutant Tissue Inhibitor of Metalloproteinase 3 Protein: Implications for Sorsby Fundus Dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that even though mutant TIMP3 proteins are more glycosylated, post-translational deglycosylation may play a critical role in the aggregation of mutant TIMP3 and contribute to the pathogenesis of SFD."
    explanation: >-
      Adds a modifier of the aggregation step: mutant protein is more
      glycosylated, and removing that glycosylation drives it to aggregate.
  downstream:
  - target: Resistance of Mutant TIMP-3 to Extracellular Matrix Turnover
    causal_link_type: DIRECT
    description: >-
      Intermolecular disulfide bonding is what makes the mutant proteins
      resistant to turnover from the matrix.
    evidence:
    - reference: PMID:16223891
      reference_title: Sorsby's fundus dystrophy mutations impair turnover of TIMP-3 by retinal pigment epithelial cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This showed that resistance to turnover, resulting from intermolecular disulfide bond formation, was a common property of all the SFD mutants examined, providing a possible explanation for the increased deposition of the protein observed in eyes from SFD patients."
      explanation: Attributes the turnover resistance of every mutant examined to intermolecular disulfide bonding.
  - target: Impaired TIMP-3 Inhibition of VEGFR2
    causal_link_type: DIRECT
    description: >-
      Dimerization about the C-terminal domain, the part of the molecule that is
      necessary and sufficient for receptor inhibition, impairs inhibition of
      VEGFR2.
    evidence:
    - reference: PMID:37013036
      reference_title: Evidence that all Sorsby's fundus dystrophy mutations cause TIMP3 dimerization resulting in impaired inhibition of VEGFR2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This led us to hypothesize that dimerization of TIMP3 about the carboxyl domain may impair the ability of all mutant TIMP3 proteins to inhibit VEGFR2, potentially explaining the CNV which is a hallmark of this disease."
      explanation: States the proposed link from dimerization to loss of VEGFR2 inhibition, which the study then tested.
- name: Resistance of Mutant TIMP-3 to Extracellular Matrix Turnover
  description: >-
    Disulfide-linked mutant TIMP-3 is cleared from the extracellular matrix more
    slowly than wild-type protein by retinal pigment epithelial cells. Transcript
    levels are not raised in affected eyes, so the accumulation is
    post-translational rather than an increase in expression. The process is
    bound as protein catabolism of TIMP-3, decreased, because the defect is the
    clearance of one protein from the matrix, not breakdown of the matrix as a
    whole.

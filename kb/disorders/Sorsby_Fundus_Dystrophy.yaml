      explanation: Ties the TIMP3 lesion to membrane thickening in affected eyes.
- name: Bruch's Membrane Thickening and Sub-RPE Deposit Formation
  description: >-
    Confluent amorphous deposits, about 20 to 30 micrometres thick, lie between
    the RPE basement membrane and the inner collagenous layer of Bruch's
    membrane, and the membrane itself is thickened; the deposits contain
    collagens, elastin, glycosaminoglycans, lipids and calcium, and the elastic
    layer of Bruch's membrane is morphologically altered. Unlike age-related
    macular degeneration the thickening is diffuse rather than confined to the
    macula, and it is detectable by optical coherence tomography in carriers who
    have no symptoms. The deposits are the structural lesion that underlies the
    drusen-like fundus lesions, the transport barrier and the choriocapillaris
    changes.

  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: "CGGV:assertion_8594a02c-c0f3-4542-b6d3-f089ba94417e-2021-07-02T174320.328Z"
    evidence:
    - reference: "CGGV:assertion_8594a02c-c0f3-4542-b6d3-f089ba94417e-2021-07-02T174320.328Z"
      reference_title: TIMP3 / Sorsby fundus dystrophy (Definitive)

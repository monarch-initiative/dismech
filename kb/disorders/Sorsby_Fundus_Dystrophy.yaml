- name: Emphysema
  category: Respiratory
  description: >-
    Severe emphysema without smoking or asthma was present in every affected
    person over 50 in one family carrying p.Tyr191Cys, and the second family of
    the same report had milder lung disease with bronchiectasis. Later reports
    found normal pulmonary function in affected individuals, so penetrance of
    the pulmonary feature appears variable; ClinGen records the recommendation
    that affected people avoid tobacco and have regular pulmonary examination.
    No frequency is recorded here: the feature is reported in two families and
    absent from pulmonary function testing in later reports, and no source gives
    a proportion.

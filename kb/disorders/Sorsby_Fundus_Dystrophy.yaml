genetic:
- name: TIMP3
  gene_term:
    preferred_term: TIMP3
    term:
      id: hgnc:11822
      label: TIMP3
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  features: >-
    Heterozygous TIMP3 variants cause the disease. The locus was mapped to
    22q13-qter by linkage in a single large family, and point mutations were then
    found in two SFD pedigrees. Reported alleles are predominantly missense and
    concentrated in exon 5, which encodes almost all of the C-terminal domain;
    most add or remove a cysteine, and the cysteine-altering alleles disturb the
    arrangement of twelve conserved cysteines and six disulfide bonds. Exceptions
    exist: His158Arg alters no cysteine, Ser38Cys lies in exon 1, one nonsense
    allele and one splice-acceptor allele are known, and variants in the
    N-terminal signal peptide give a phenotype the reporting authors treat as
    distinct. A Ser181Cys founder allele accounts for most British Isles
    families, with carriers in Canada, the United States and South Africa
    descending from the same ancestor, and Ser38Cys is a founder allele in
    Belgian and northern French families. A 2024 mechanistic review counts 21
    associated variants, of which a few have been studied in depth. The
    phenotype attached to the gene is still widening: a p.Tyr137Cys variant was
    found in a father and son first diagnosed with retinitis pigmentosa, so
    TIMP3 is worth considering in atypical pigmentary retinopathy.
  notes: >-
    Variant numbering in the names used here follows the secreted protein,
    excluding the 23-residue signal peptide. The same alleles appear in the
    literature under signal peptide-inclusive numbering: Ser156Cys as S179C,
    Ser181Cys as S204C, Tyr168Cys as Y191C.
  evidence:
  - reference: PMID:7920634
    reference_title: Sorsby's fundus dystrophy is genetically linked to chromosome 22q13-qter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recombinant chromosomes sublocalize the SFD gene to 22q13-qter between D22S275 and D22S274."
    explanation: Linkage analysis placed the locus in the interval that contains TIMP3.
  - reference: PMID:7894485
    reference_title: Mutations in the tissue inhibitor of metalloproteinases-3 (TIMP3) in patients with Sorsby's fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have now identified point mutations in the TIMP3 gene in affected members of two SFD pedigrees."
    explanation: The original gene identification.
  - reference: PMID:10854443
    reference_title: A novel tissue inhibitor of metalloproteinases-3 mutation reveals a common molecular phenotype in Sorsby's fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Five different mutations have previously been identified, all introducing an extra cysteine residue into exon 5 (which forms part of the C-terminal domain) of the TIMP-3 molecule"
    explanation: Gives the exon and domain in which the early alleles sit and their shared cysteine effect.
  - reference: PMID:8919688
    reference_title: "Sorsby's fundus dystrophy in the British Isles: demonstration of a striking founder effect by microsatellite-generated haplotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of the same Ser181Cys mutation cosegregating with disease in each family led us to consider the hypothesis of a founder effect being present."
    explanation: The same allele in 15 apparently unrelated British Isles families indicates a founder effect.
  - reference: PMID:9400791
    reference_title: "Sorsby fundus dystrophy: reevaluation of variable expressivity in patients carrying a TIMP3 founder mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have extended previous findings on a Ser181Cys founder mutation in SFD families from the British Isles and show that carriers of this mutation residing in Canada, the United States, and South Africa likewise are descendants of the British ancestor"
    explanation: Extends the founder allele to families on three further continents.
  - reference: PMID:38601018
    reference_title: "Review: Mechanisms of TIMP-3 accumulation and pathogenesis in Sorsby fundus dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There are 21 mutations currently associated with SFD"
    explanation: Gives the size of the reported variant set as of the review.
  - reference: PMID:32715858
    reference_title: A novel TIMP3 mutation associated with a retinitis pigmentosa-like phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important to consider mutations in TIMP3 in atypical cases of Retinitis Pigmentosa particularly in the absence of known variants."
    explanation: A father and son with a novel TIMP3 variant were first diagnosed with retinitis pigmentosa, which widens the phenotype attached to the gene.

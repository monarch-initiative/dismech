      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TIMP-3 is a component of the increased ECM sequestered in Bruch's membrane in SFD."
      explanation: Immunolocalization in SFD donor eyes places the accumulated protein in Bruch's membrane.
- name: TIMP-3 Accumulation in Bruch's Membrane
  description: >-
    TIMP-3 is made by the retinal pigment epithelium and is normally a component
    of Bruch's membrane, where it regulates the thickness of that matrix by
    inhibiting matrix metalloproteinases. In SFD eyes the thickened membrane and
    the sub-RPE deposits label strongly for TIMP-3, and the protein is increased
    in the extracellular matrix of patient-derived RPE, so the mutant protein
    accumulates in the compartment where the wild-type protein normally works.

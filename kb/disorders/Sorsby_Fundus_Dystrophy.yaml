name: Sorsby Fundus Dystrophy
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
description: >-
  Sorsby fundus dystrophy (SFD) is a rare autosomal dominant macular dystrophy
  caused by heterozygous variants in TIMP3, which encodes tissue inhibitor of
  metalloproteinases-3, an extracellular-matrix-bound inhibitor of matrix
  metalloproteinases that also blocks VEGF binding to VEGF receptor-2. Most
  disease-causing variants lie in exon 5, which encodes almost all of the
  C-terminal domain, and most add or remove a cysteine residue; the mutant
  protein forms aberrant disulfide-bonded dimers and multimers, resists turnover
  from the extracellular matrix and accumulates in Bruch's membrane. TIMP-3 is
  made by the retinal pigment epithelium (RPE) and normally resides in Bruch's
  membrane, so the accumulation thickens that membrane and produces confluent
  sub-RPE deposits and drusen-like lesions across the fundus. Two consequences
  follow. The thickened membrane impairs exchange between the choroid and the
  photoreceptors, giving night blindness and delayed dark adaptation that
  high-dose vitamin A can reverse at early stages; and the dimerized protein no
  longer restrains VEGFR2, while reduced metalloproteinase inhibition raises
  MMP2 activity and basic fibroblast growth factor release, so choroidal
  neovascularization develops and is the main cause of blindness. Symptoms begin
  in the third to sixth decade, typically the fourth to fifth, with sudden
  central vision loss from neovascularization or macular atrophy, progressing to
  widespread chorioretinal atrophy. Penetrance is reported as complete.
  Intravitreal anti-VEGF therapy preserves central vision when started promptly;
  argon laser and photodynamic therapy are not effective. Because SFD reproduces
  the drusen, neovascular and atrophic biology of age-related macular
  degeneration from a single genetic lesion, it is used as a monogenic model of
  that disease.

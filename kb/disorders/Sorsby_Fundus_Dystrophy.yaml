    term:
      id: HP:0011506
      label: Choroidal neovascularization
  evidence:
  - reference: PMID:18501328
    reference_title: Clinical course and treatment outcomes of Sorsby fundus dystrophy.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Argon laser therapy and PDT are not effective in treating CNV of patients with this dystrophy."
    explanation: A 42-patient cohort found neither modality effective, which refutes their use for this indication.
  - reference: PMID:18501328
    reference_title: Clinical course and treatment outcomes of Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antiangiogenic agents may be useful in preventing visual loss as a result of this condition."
    explanation: The same cohort points to antiangiogenic therapy instead, which is the treatment recorded above.
- name: Tobacco avoidance and pulmonary surveillance
  description: >-
    Because TIMP3 variants have been linked to emphysema and bronchiectasis in
    some families, the report of the eye and lung families and ClinGen's
    evidence summary both advise affected people to avoid tobacco and to have
    regular pulmonary examination. This is advice on a non-ocular feature of
    uncertain penetrance, not a treatment for the retinal disease.

  variants:
  - name: p.Ser181Cys
    synonyms:
    - S181C
    - p.Ser204Cys
    description: >-
      The British Isles founder allele, found in 15 genealogically unrelated
      families and in emigrant families in Canada, the United States and South
      Africa. It is the allele of the 42-patient natural-history cohort and of
      the donor eyes used for the histopathology.
    gene:
      preferred_term: TIMP3
      term:
        id: hgnc:11822
        label: TIMP3
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:8919688
      reference_title: "Sorsby's fundus dystrophy in the British Isles: demonstration of a striking founder effect by microsatellite-generated haplotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This haplotype analysis has refined the TIMP3 gene localization to a 1- to 3-cM interval between marker loci D22S273 and D22S281 and provides strong evidence for a single mutational event being responsible for the majority of SFD identified in the British Isles."
      explanation: A single mutational event accounts for most British Isles disease.
    - reference: PMID:18501328
      reference_title: Clinical course and treatment outcomes of Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A cohort of 42 patients with the Ser181 Cys TIMP3 mutation were identified from the electronic database of genetic retinal diseases in Moorfields Eye Hospital."
      explanation: Identifies the cohort whose natural history and treatment outcomes this entry cites as carrying this allele.
  - name: p.Ser156Cys
    synonyms:
    - S156C
    - p.Ser179Cys
    description: >-
      Reported in a family with unusual clinical features, and the allele used
      for the knock-in mouse lines and for the endothelial and RPE cell work on
      VEGFR2 and bFGF. In cell assays it forms higher-molecular-weight complexes
      and shows reduced metalloproteinase inhibition with increased VEGF binding.
    gene:
      preferred_term: TIMP3
      term:
        id: hgnc:11822
        label: TIMP3
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:12147610
      reference_title: A mouse model for Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To facilitate in vivo investigation of mutant TIMP3, the authors generated a knock-in mouse carrying a disease-related Ser156Cys mutation in the orthologous murine Timp3 gene."
      explanation: Names the allele as disease-related and the basis of the knock-in model.
    - reference: PMID:11827795
      reference_title: "Sorsby's fundus dystrophy tissue inhibitor of metalloproteinases-3 (TIMP-3) mutants have unimpaired matrix metalloproteinase inhibitory activities, but affect cell adhesion to the extracellular matrix."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Two of the mutants (Ser156Cys and Ser181Cys) showed a marked propensity to form multiple higher molecular-weight complexes that retained TIMP activity on reverse zymography."
      explanation: Documents the multimerization behaviour of this allele in cell culture.
  - name: p.Ser38Cys
    synonyms:
    - S38C
    - c.113C>G
    description: >-
      An exon 1 founder allele in Belgian and northern French families with
      late-onset disease. It is the clearest exception to the exon 5 rule: the
      reported mechanism is disruption of an established intramolecular
      disulfide bond and formation of a new one, rather than dimerization. The
      same allele was reported in a family with eye and lung disease.
    gene:
      preferred_term: TIMP3
      term:
        id: hgnc:11822
        label: TIMP3
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:30668888
      reference_title: The N-terminal p.(Ser38Cys) TIMP3 mutation underlying Sorsby fundus dystrophy is a founder mutation disrupting an intramolecular disulfide bond.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype reconstruction in three SFD families revealed that the identified c.113C>G, p.(Ser38Cys) mutation is a founder in Belgian and northern French families with a late-onset SFD phenotype."
      explanation: Establishes the allele as a founder mutation with a late-onset phenotype.
    - reference: PMID:30668888
      reference_title: The N-terminal p.(Ser38Cys) TIMP3 mutation underlying Sorsby fundus dystrophy is a founder mutation disrupting an intramolecular disulfide bond.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We could not confirm a previous hypothesis on dimerization of mutant TIMP3 proteins."
      explanation: For this allele the dimerization model was not reproduced, which is why the entry records intramolecular bonding separately.
  - name: p.His158Arg
    synonyms:
    - H158R
    description: >-
      A late-onset allele and the first reported coding variant that does not
      create an unpaired cysteine; the residue is conserved across vertebrate
      TIMP homologs and modeling places it at a protein-protein interaction
      interface.
    gene:
      preferred_term: TIMP3
      term:
        id: hgnc:11822
        label: TIMP3
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:16989765
      reference_title: A novel His158Arg mutation in TIMP3 causes a late-onset form of Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous His158Arg mutation was found in seven affected family members and was absent from an unaffected member and 98 unrelated controls."
      explanation: Segregation in seven affected members with absence from controls supports pathogenicity.
    - reference: PMID:16989765
      reference_title: A novel His158Arg mutation in TIMP3 causes a late-onset form of Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Onset of disease occurred in the fifth to seventh decades of life."
      explanation: Gives the late onset in this family.
  - name: TIMP3 signal peptide variants
    synonyms:
    - L10H
    - G12R
    description: >-
      Variants in the N-terminal signal peptide reported in two families with
      early-onset diffuse maculopathy and no choroidal neovascularization. The
      reporting authors treat this as a phenotype distinct from classic Sorsby
      fundus dystrophy, with impaired signal peptide cleavage and defective
      extracellular deposition rather than accumulation of matrix-bound mutant
      protein. Recorded here as a variant class with that caveat, not as a
      subtype, because no separate disease concept exists for it.
    gene:
      preferred_term: TIMP3
      term:
        id: hgnc:11822
        label: TIMP3
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:35679059
      reference_title: Early-Onset TIMP3-Related Retinopathy Associated With Impaired Signal Peptide.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven individuals from 2 families with early-onset diffuse maculopathy without choroidal neovascularization harbor TIMP3 variants (L10H or G12R) in the N-terminal signaling peptide were analyzed."
      explanation: Identifies the variants and the families, and records the absence of neovascularization.
    - reference: PMID:35679059
      reference_title: Early-Onset TIMP3-Related Retinopathy Associated With Impaired Signal Peptide.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study found that TIMP3 variants altering signal peptide function deviated from classic Sorsby fundus dystrophy both in phenotypic features and underlying mechanism."
      explanation: The authors' own statement that this group deviates from classic SFD, which is the caveat recorded here.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Autosomal dominant with penetrance reported as complete, and variable
    expressivity in age of onset and fundus appearance. A historically proposed
    autosomal recessive form rests on one consanguineous Finnish family; the
    same family was later shown to carry a heterozygous Gly166Cys TIMP3 variant
    in all affected members, which the authors read as dominant inheritance, and
    the ClinGen Retina GCEP records the recessive proposal as refuted. The
    MONDO descendant MONDO:0009918, the recessive pseudoinflammatory form
    (OMIM 264420), is therefore not curated as a subtype of this entry.
  evidence:
  - reference: PMID:36197222
    reference_title: "Sorsby fundus dystrophy (SFD): A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sorsby fundus dystrophy (SFD) is a rare autosomal dominant disorder with complete penetrance affecting the macula."
    explanation: A narrative review states autosomal dominant inheritance with complete penetrance.
  - reference: PMID:8981947
    reference_title: "Autosomal recessive Sorsby fundus dystrophy revisited: molecular evidence for dominant inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous Gly166Cys mutation in TIMP3 in all affected individuals and provide strong evidence for an autosomal dominant inheritance of the SFD phenotype in this family."
    explanation: Reinvestigation of the family that defined the recessive concept found a heterozygous variant segregating with disease.
  - reference: PMID:8981947
    reference_title: "Autosomal recessive Sorsby fundus dystrophy revisited: molecular evidence for dominant inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering all available data, we suggest that SFD is a genetically homogeneous, autosomal dominant condition."
    explanation: The authors' conclusion against a recessive mode of inheritance, which is the basis for leaving the recessive MONDO descendant out.
  - reference: "CGGV:assertion_8594a02c-c0f3-4542-b6d3-f089ba94417e-2021-07-02T174320.328Z"
    reference_title: TIMP3 / Sorsby fundus dystrophy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A proposed alternative mechanism of autosomal recessive inheritance of Sorsby fundus dystrophy that involved a consanguineous family and preceded mapping of the disease locus (PMID:7143944) was refuted by identification of a heterozygous TIMP3 variant specific to the affected family members (PMID:8981947)."
    explanation: ClinGen's own lumping and splitting assessment records the recessive proposal as refuted.
  - reference: PMID:7148944
    reference_title: Pseudoinflammatory fundus dystrophy with autosomal recessive inheritance.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "a mode of inheritance which is probably autosomal recessive"
    explanation: >-
      The original report of the Finnish family proposed recessive inheritance,
      the claim this block records as superseded; cited so that the concept
      behind MONDO:0009918 is traceable.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.45
  rate_denominator: POPULATION
  notes: >-
    From the estimate of 1 in 220,000 given in a review of the disease, which is
    0.45 per 100,000. Orphanet records its own point-prevalence class as unknown.
  evidence:
  - reference: PMID:28847738
    reference_title: Sorsby fundus dystrophy - A review of pathology and disease mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sorsby fundus dystrophy (SFD) is an autosomal dominant macular dystrophy with an estimated prevalence of 1 in 220,000 and an onset of disease around the 4th to 6th decade of life."
    explanation: Gives the prevalence estimate this record normalizes.
  - reference: ORPHA:59181
    reference_title: Sorsby fundus dystrophy
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unknown | Worldwide | Point prevalence | ORPHANET"
    explanation: Orphanet records the worldwide point-prevalence class as unknown.
progression:
- phase: Preclinical carrier stage
  notes: >-
    Variant carriers without symptoms already show thickening of Bruch's
    membrane and choriocapillaris thinning on optical coherence tomography
    angiography, and reduced late-phase indocyanine green fluorescence; rod
    dark adaptation can be slowed before any change is visible on multimodal
    imaging.
  evidence:
  - reference: PMID:35483032
    reference_title: SWEPT-SOURCE OPTICAL COHERENCE TOMOGRAPHY DETECTION OF BRUCH MEMBRANE AND CHORIOCAPILLARIS ABNORMALITIES IN SORSBY MACULAR DYSTROPHY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Swept-source optical coherence tomography angiography imaging can detect BM and CC abnormalities in vivo in subjects unaware of their TIMP3 status in a family with SMD."
    explanation: Structural change is detectable before clinical disease in carriers.
  - reference: PMID:34352251
    reference_title: Visual Dysfunction and Structural Correlates in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas RMDA could be slowed even in the absence of fundus alterations on multimodal imaging"
    explanation: Rod-mediated dark adaptation is abnormal before imaging shows fundus change.
- phase: Early symptomatic stage
  notes: >-
    Night blindness, dark adaptation difficulty and visual field defects appear
    first in some families, while in others metamorphopsia or reduced acuity is
    the presenting complaint. Best-corrected acuity can still be normal while
    scotopic function is already impaired.
  evidence:
  - reference: PMID:34352251
    reference_title: Visual Dysfunction and Structural Correlates in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to BCVA, scotopic visual function tests are suitable to quantify dysfunction in the early stages."
    explanation: Records that rod-driven function, not best-corrected acuity, is what is abnormal early.
- phase: Neovascular stage
  notes: >-
    Sudden central vision loss from a choroidal neovascular membrane, at a
    median of 46 years in the first eye and 50 years in the second in the
    Ser181Cys cohort, with vision falling to 20/200 or below about two years
    later if untreated.
  evidence:
  - reference: PMID:18501328
    reference_title: Clinical course and treatment outcomes of Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset of CNV in the first eye was 46.1 years and in the second eye was 50.3 years."
    explanation: Gives the median ages of neovascular onset in each eye.
- phase: Atrophic end stage
  notes: >-
    Widespread chorioretinal atrophy, fibrosis and choroidal thinning, uniform
    across families in late disease, with loss first of central and then of
    peripheral vision.
  evidence:
  - reference: PMID:25766588
    reference_title: "Sorsby Fundus Dystrophy: Novel Mutations, Novel Phenotypic Characteristics, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late disease manifestations were uniform with widespread chorioretinal atrophy, fibrosis, and choroidal thinning."
    explanation: Describes the end-stage picture.
  - reference: ORPHA:59181
    reference_title: Sorsby fundus dystrophy
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leading to loss of central vision, then peripheral vision, and eventually blindness"
    explanation: Orphanet's definition gives the order in which vision is lost.
diagnosis:
- name: Multimodal retinal imaging
  description: >-
    Optical coherence tomography shows irregular thickening of Bruch's membrane
    and the sub-RPE deposit; optical coherence tomography angiography shows
    choriocapillaris flow deficits and detects neovascular membranes; late-phase
    indocyanine green angiography shows reduced fluorescence, which has been
    proposed for identifying carriers at risk before symptoms; fundus
    autofluorescence is frequently abnormal, and reticular pseudodrusen
    appear on it as hypoautofluorescent lesions. Early neovascularization in a
    patient with no predisposing factor such as high myopia should prompt the
    diagnosis.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:27601084
    reference_title: A new autosomal dominant eye and lung syndrome linked to mutations in TIMP3 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite variable and confounding phenotypes, this dystrophy should be considered in patients with early neovascularization in absence of predisposing factors such as high myopia, or with irregular thickening of the Bruch membrane as shown on SD-OCT."
    explanation: States the two findings that should raise the diagnosis, and names the imaging modality.
  - reference: PMID:25766588
    reference_title: "Sorsby Fundus Dystrophy: Novel Mutations, Novel Phenotypic Characteristics, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging using late-phase ICG-A may be useful for early identification of individuals at risk for developing SFD."
    explanation: Proposes late-phase indocyanine green angiography for early identification.
  - reference: ORPHA:59181
    reference_title: Sorsby fundus dystrophy
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0030602 | Abnormal fundus autofluorescence imaging | Frequent (79-30%)"
    explanation: Orphanet records abnormal fundus autofluorescence as frequent, which is the basis for listing the modality here.
  - reference: PMID:26077580
    reference_title: Reticular Pseudodrusen in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reticular pseudodrusen were hyporeflective on NIR reflectance and hypofluorescent on fundus autofluorescence imaging."
    explanation: Gives the autofluorescence appearance of one of the lesions this entry records.
- name: TIMP3 molecular genetic testing
  description: >-
    Diagnosis is confirmed by finding a heterozygous TIMP3 variant. Testing is
    directed at exon 5 first, since most alleles lie there, but exon 1 and the
    signal peptide sequence carry reported variants too, so a negative exon 5
    result does not exclude the disease.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23099917
    reference_title: Ranibizumab for the management of Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA analysis revealed the presence of mutation c.610A>T (p.Ser204Cys) in exon 5 of the TIMP3 gene and confirmed the diagnosis of Sorsby fundus dystrophy."
    explanation: Molecular testing confirmed the clinical diagnosis in a case.
  - reference: PMID:30668888
    reference_title: The N-terminal p.(Ser38Cys) TIMP3 mutation underlying Sorsby fundus dystrophy is a founder mutation disrupting an intramolecular disulfide bond.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype reconstruction in three SFD families revealed that the identified c.113C>G, p.(Ser38Cys) mutation is a founder in Belgian and northern French families with a late-onset SFD phenotype."
    explanation: An exon 1 founder allele, which is why testing cannot be confined to exon 5.
treatments:
- name: Intravitreal anti-VEGF therapy for choroidal neovascularization
  description: >-
    Intravitreal bevacizumab or ranibizumab is the mainstay for the neovascular
    complication. A systematic review of 31 cases found good responses when
    treatment began immediately after symptom onset, with the delay between
    first symptoms and treatment determining subretinal scar formation and
    functional prognosis; 11 of 20 eyes with acuity reported before and after
    treatment kept driving vision, while 5 worsened. A 12-year two-sister series
    found a treat-and-extend schedule better than pro re nata at preventing
    recurrence. The therapy addresses the neovascular lesion and not the
    underlying dystrophy, so atrophic progression continues.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
    - preferred_term: ranibizumab
      term:
        id: NCIT:C67562
        label: Ranibizumab
  target_phenotypes:
  - preferred_term: Choroidal neovascularization
    term:
      id: HP:0011506
      label: Choroidal neovascularization
  target_mechanisms:
  - target: Choroidal Neovascular Membrane Formation
    treatment_effect: INHIBITS
    description: >-
      The agents neutralize VEGF in the vitreous and so suppress the neovascular
      lesion; they do not restore TIMP-3 function or clear the deposit.
    evidence:
    - reference: PMID:34070857
      reference_title: "Visual Outcome after Intravitreal Anti-VEGF Therapy for Macular Neovascularisation Secondary to Sorsby's Fundus Dystrophy: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In MNV secondary to SFD, the delay between first symptoms and access to anti-VEGF treatment determines subretinal scar formation and thereby, functional prognosis."
      explanation: The effect on the neovascular lesion and its visual consequence depends on how early the agent is given.
  evidence:
  - reference: PMID:34070857
    reference_title: "Visual Outcome after Intravitreal Anti-VEGF Therapy for Macular Neovascularisation Secondary to Sorsby's Fundus Dystrophy: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All papers in common, however, reported satisfied to excellent responses to anti-VEGF therapy if patients were diagnosed and treated immediately after onset of symptoms."
    explanation: Pooled across 14 publications and one further patient, outcomes were good with prompt treatment.
  - reference: PMID:34070857
    reference_title: "Visual Outcome after Intravitreal Anti-VEGF Therapy for Macular Neovascularisation Secondary to Sorsby's Fundus Dystrophy: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 20 eyes, for which visual acuity was reported before and after treatment, five worsened and seven improved by more than 1 line, whereas eight eyes maintained their function by end of the follow up, and 11 eyes (55%) maintained a driving vision (Snellen VA ≥ 0.5)."
    explanation: Gives the per-eye outcome distribution, including the eyes that worsened on treatment.
  - reference: PMID:25766588
    reference_title: "Sorsby Fundus Dystrophy: Novel Mutations, Novel Phenotypic Characteristics, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with CNV or PCV showed a favorable response to therapy with intravitreally injected bevacizumab."
    explanation: Favourable responses to bevacizumab in patients with neovascular and polypoidal lesions.
  - reference: PMID:30421618
    reference_title: Evaluation of Pro-re-Nata (PRN) and Treat and Extend Bevacizumab treatment protocols in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A T&E protocol appears more effective compared to pro re nata protocol in minimizing recurrence of choroidal neovascularization with potential secondary scar formation or atrophy."
    explanation: Compares the two dosing schedules over 12 years in two sisters.
- name: High-dose oral vitamin A for night blindness
  description: >-
    Oral vitamin A at 50,000 IU/day abolished night blindness within a week in
    patients at early stages of disease, and high-dose supplementation markedly
    improved rod-mediated dark adaptation and dark-adapted thresholds in one
    patient followed longitudinally. It addresses the local nutritional
    deficiency produced by the thickened membrane, not the dystrophy, and is
    off-label; the evidence is a small family study and single-patient
    longitudinal data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: vitamin A supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: vitamin A
      term:
        id: CHEBI:12777
        label: vitamin A
  target_phenotypes:
  - preferred_term: Night blindness
    term:
      id: HP:0000662
      label: Nyctalopia
  target_mechanisms:
  - target: Photoreceptor Vitamin A Deprivation
    treatment_effect: BYPASSES
    description: >-
      Raising systemic vitamin A overcomes the local deficiency created by the
      transport barrier, without altering the barrier itself.
    evidence:
    - reference: PMID:7550309
      reference_title: Night blindness in Sorsby's fundus dystrophy reversed by vitamin A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nutritional night blindness is thus part of the pathophysiology of this genetic disease and vitamin A supplementation can lead to dramatic restoration of photoreceptor function."
      explanation: Supplementation restores photoreceptor function, which is the bypass this link records.
  evidence:
  - reference: PMID:7550309
    reference_title: Night blindness in Sorsby's fundus dystrophy reversed by vitamin A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin A at 50,000 IU/d was administered orally. Within a week, the night blindness disappeared in patients at early stages of disease."
    explanation: Gives the dose, the route and the response, and restricts it to early-stage disease.
  - reference: PMID:34352251
    reference_title: Visual Dysfunction and Structural Correlates in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After high-dose vitamin A supplementation, RMDA and DA thresholds improved markedly."
    explanation: Longitudinal data from one patient show improved rod-mediated dark adaptation after supplementation.
  - reference: PMID:34352251
    reference_title: Visual Dysfunction and Structural Correlates in Sorsby Fundus Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Improvement of scotopic dysfunction after (off-label) high-dose vitamin A intake, as observed in one patient in our study, is compatible with the hypothesized local deficiency of vitamin A secondary to Bruch's membrane alterations."
    explanation: Records that the use is off-label and that the observation is from a single patient.
- name: Systemic anti-TNF-alpha therapy (single case report)
  description: >-
    One 35-year-old patient with aggressive bilateral macular neovascularization
    and p.Ser204Cys, who showed disease activity on intravitreal bevacizumab and
    was controlled on repeated intravitreal triamcinolone, had no signs of
    disease activity over 18 months of subcutaneous adalimumab. The authors
    propose that the TIMP3 variant raises local tumour necrosis factor alpha
    because TIMP-3 restrains its shedding by ADAM17. The rationale is untested
    for this patient's allele. The only measurement a 2024 mechanistic review
    reports is for a different allele, Ser179Cys (Ser156Cys in secreted-protein
    numbering), which inhibits ADAM17 as well as wild-type TIMP-3 does; the same
    review states that the other SFD mutants, Ser204Cys (Ser181Cys) among them,
    have not been profiled. Because the case for a TNF arm rests on one patient
    plus TIMP-3 biology measured outside the eye, the entry records the
    treatment and its single-patient evidence without a mechanism node or
    pathophysiology target, and holds the question open in the discussions
    section.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_phenotypes:
  - preferred_term: Choroidal neovascularization
    term:
      id: HP:0011506
      label: Choroidal neovascularization
  evidence:
  - reference: PMID:34376817
    reference_title: Treatment of Sorsby fundus dystrophy with anti-tumor necrosis factor-alpha medication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the high lifetime risk of complication, she was switched to subcutaneous adalimumab and in follow-up over 18 months had no signs of disease activity."
    explanation: The observed result in the single reported patient.
  - reference: PMID:34376817
    reference_title: Treatment of Sorsby fundus dystrophy with anti-tumor necrosis factor-alpha medication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is possible with the mutation in the gene for TIMP-3, abnormally high tissue levels of TNFα are produced in the eye."
    explanation: States the proposed rationale, in the authors' own conditional terms.
  - reference: PMID:38601018
    reference_title: "Review: Mechanisms of TIMP-3 accumulation and pathogenesis in Sorsby fundus dystrophy."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "showed that the Ser179Cys variant retained the ability to inhibit ADAM17, ADAMTS-4, and ADAMTS-5 to the same degree as wild-type TIMP-3."
    explanation: >-
      Bears against the proposed rationale only by inference: the measured
      allele is Ser179Cys (Ser156Cys), not the patient's Ser204Cys (Ser181Cys).
      It shows that at least one SFD allele keeps ADAM17 inhibition, so loss of
      that inhibition cannot be assumed to be common to the disease.
  - reference: PMID:38601018
    reference_title: "Review: Mechanisms of TIMP-3 accumulation and pathogenesis in Sorsby fundus dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The ability of other SFD TIMP-3 mutants to inhibit these and other relevant ADAMs and ADAMTSs has not been profiled, so additional work in this area is needed."
    explanation: >-
      Supports the statement in this record's description that the patient's
      allele has not been tested for ADAM17 inhibition, so the rationale is
      neither confirmed nor excluded for it.
- name: CRISPR base editing (in silico design only)
  description: >-
    A bioinformatic analysis in one patient with p.Ser204Cys identified a
    glycosylase base editor edit that would revert the variant to wild-type at
    the amino acid level, and an adenine base editor alternative predicted to
    introduce a tolerated substitution but also a bystander edit. No editing was
    performed in cells, tissue or animals in that report, so this is a design
    study rather than a preclinical result.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:36421778
    reference_title: Potential CRISPR Base Editing Therapeutic Options in a Sorsby Fundus Dystrophy Patient.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Using a glycosylase base editor (GBE), another DNA-edit could be introduced that would revert the variant back to wild-type on amino acid level."
    explanation: Describes the designed correction, which is a computational prediction.
  - reference: PMID:36421778
    reference_title: Potential CRISPR Base Editing Therapeutic Options in a Sorsby Fundus Dystrophy Patient.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico analyses predicted this variant to be non-pathogenic; however, a bystander edit, p.Ile205Thr, would be introduced."
    explanation: Records the predicted bystander edit, the limitation of the alternative design.
- name: Laser photocoagulation and photodynamic therapy
  description: >-
    Argon laser photocoagulation and photodynamic therapy were used for
    neovascular lesions before anti-VEGF agents. In the 42-patient Ser181Cys
    cohort neither was effective, and individual cases progressed to a disciform
    scar despite photodynamic treatment. Recorded here because it appears
    throughout the older literature and because the negative result is what
    makes anti-VEGF therapy the first choice.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_phenotypes:

animal_models:
- name: Timp3 S156C knock-in mouse
  species: Mouse
  genotype: Timp3 Ser156Cys knock-in (written S179C where the signal peptide is counted)
  description: >-
    A knock-in carrying the disease-associated Ser156Cys substitution in the
    orthologous murine gene. At 8 months it shows abnormalities of the inner
    aspect of Bruch's membrane and of the adjacent RPE basal microvilli, with
    increased Timp3 in Bruch's membrane, while retinal function recorded
    electrodiagnostically stays normal for life. Comparable changes appear in
    normal littermates only at 30 months. The same allele shows reduced MMP
    inhibition with raised MMP2 and bFGF and accentuated laser induced
    choroidal neovascular leakage, more membrane-associated VEGFR-2 in
    endothelium, and RPE and photoreceptor degeneration at sodium iodate doses
    that spare wild-type mice.
  publication: PMID:12147610
  modeled_mechanisms:
  - target: TIMP-3 Accumulation in Bruch's Membrane
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the accumulation of Timp3 in Bruch's membrane and the membrane abnormality.
    limitations: >-
      Mice have no macula, the change is ultrastructural rather than a clinical
      drusen phenotype, and it is an acceleration of a change that wild-type
      mice reach at 30 months.
    evidence:
    - reference: PMID:12147610
      reference_title: A mouse model for Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The localization of the mutant protein in the eye is normal, although there is evidence of increased Timp3 levels in Bruch's membrane of mutant animals."
      explanation: The knock-in shows increased Timp3 in the membrane with normal localization.
    - reference: PMID:12147610
      reference_title: A mouse model for Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At 8 months of age, knock-in mice showed abnormalities in the inner aspect of Bruch's membrane and in the organization of the adjacent basal microvilli of the retinal pigment epithelium (RPE)."
      explanation: Gives the structural phenotype and its age.
  - target: Choroidal Neovascular Membrane Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Neovascular leakage is accentuated in mutant mice, but only after laser
      injury rather than spontaneously.
    limitations: >-
      The neovascular lesion requires laser injury to provoke it, so the model
      reports susceptibility rather than the spontaneous membranes patients
      develop.
    evidence:
    - reference: PMID:31757977
      reference_title: Sorsby Fundus Dystrophy Mutation in Tissue Inhibitor of Metalloproteinase 3 (TIMP3) promotes Choroidal Neovascularization via a Fibroblast Growth Factor-dependent Mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study we demonstrate that mice expressing mutant TIMP3 (Timp3S179C/S179C) showed reduced MMP inhibitory activity with an increase in MMP2 activity and bFGF levels, as well as accentuated CNV leakage when subjected to laser injury."
      explanation: Records the accentuated neovascular leakage and that laser injury was needed.
  - target: Increased RPE Susceptibility to Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mutant RPE carries a baseline antioxidant response and degenerates at
      oxidative doses that spare wild-type tissue.
    readouts:
    - name: RPE and photoreceptor degeneration after low-dose sodium iodate
      target: Increased RPE Susceptibility to Oxidative Stress
      direction: INCREASED
      interpretation: A controlled oxidative challenge separates mutant from wild-type tissue.
      evidence:
      - reference: PMID:32828705
        reference_title: The retinal pigment epithelium in Sorsby Fundus Dystrophy shows increased sensitivity to oxidative stress-induced degeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The RPE and photoreceptors in Timp3 mutant mice degenerated at low doses of sodium iodate, which had no effect in wildtype control mice."
        explanation: Gives the measured difference between mutant and wild-type mice.
    evidence:
    - reference: PMID:32828705
      reference_title: The retinal pigment epithelium in Sorsby Fundus Dystrophy shows increased sensitivity to oxidative stress-induced degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These studies suggest that TIMP3 mutations may result in a dysregulation of pro-oxidant-antioxidant homeostasis in the RPE, leading to RPE degeneration in SFD."
      explanation: The authors' reading of the model as informative for the oxidative mechanism.
  - target: Impaired TIMP-3 Inhibition of VEGFR2
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Mutant mouse endothelium carries more membrane-associated VEGFR-2, the
      same change reported in human SFD eyes.
    evidence:
    - reference: PMID:19478078
      reference_title: S156C mutation in tissue inhibitor of metalloproteinases-3 induces increased angiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Timp-3S156C/S156C mice have reduced TIMP-3 activity and increased expression of VEGFR-2."
      explanation: >-
        The mouse result on its own: reduced inhibitory activity with raised
        VEGFR-2 expression. The paper's summary sentence covering both mouse and
        human eyes is cited on the pathophysiology node instead, so that each
        item here carries one kind of evidence.
  evidence:
  - reference: PMID:12147610
    reference_title: A mouse model for Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The knock-in mice display early features of age-related changes in Bruch's membrane and the RPE that may represent the primary clinical manifestations of SFD."
    explanation: The authors' own statement of what the model represents.
  - reference: PMID:12147610
    reference_title: A mouse model for Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Long-term electrodiagnostic recordings indicated normal retinal function throughout life."
    explanation: Records the limitation that retinal function stays normal in the model.
experimental_models:
- name: Patient-derived SFD iPSC-RPE
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  cell_source: >-
    Retinal pigment epithelium differentiated from induced pluripotent stem
    cells of patients carrying TIMP3 p.Ser204Cys, compared with unaffected
    controls, with isogenic CRISPR-corrected clones in one study
  publication: PMID:32666594
  description: >-
    Patient iPSC-RPE accumulates TIMP3 in its extracellular matrix, forms
    sub-RPE deposits resembling those in affected donor globes, shows
    extracellular matrix and angiogenesis-related protein changes, and is more
    vulnerable to oxidative stress. Correcting the variant reduces the deposits.
    The two main studies disagree on the dimerization question: one found TIMP3
    dimers in both patient and control cultures and no change in VEGF
    secretion, which is the main published challenge to dimerization as the
    driving lesion.
  modeled_mechanisms:
  - target: TIMP-3 Accumulation in Bruch's Membrane
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the accumulation of TIMP3 in the matrix beneath the RPE and the
      sub-RPE deposit.
    limitations: >-
      Cultured RPE has no choroid, no full five-layered Bruch's membrane and no
      photoreceptors, so the deposit is deposit-like rather than the clinical
      lesion.
    evidence:
    - reference: PMID:34929159
      reference_title: Extracellular matrix dysfunction in Sorsby patient-derived retinal pigment epithelium.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that SFD iPSC-RPE formed significantly more sub-RPE deposits (∼6-90 μm in height) compared to control RPE at 8 weeks."
      explanation: Quantifies the deposits formed by patient-derived RPE against controls.
    - reference: PMID:34929159
      reference_title: Extracellular matrix dysfunction in Sorsby patient-derived retinal pigment epithelium.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "S204C TIMP3 correction by CRISPR-Cas9 gene editing in SFD iPSC RPE cells resulted in significantly reduced basal laminar and sub-RPE calcium deposits."
      explanation: Isogenic correction reduces the deposits, which ties them to the variant.
  - target: Resistance of Mutant TIMP-3 to Extracellular Matrix Turnover
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient RPE accumulates TIMP3 basolaterally with no change in gene
      expression, which is the post-translational accumulation this node
      describes. The same study did not find mutant-specific dimerization.
    limitations: >-
      Turnover itself was not measured in this system; the accumulation is
      inferred from protein level against unchanged transcript level.
    evidence:
    - reference: PMID:32666594
      reference_title: In vitro stem cell modelling demonstrates a proof-of-concept for excess functional mutant TIMP3 as the cause of Sorsby fundus dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SFD-hiPSC-RPE exhibited basolateral accumulation of TIMP3 monomers, despite no change in TIMP3 gene expression."
      explanation: Accumulation without transcriptional change in patient-derived RPE.
    - reference: PMID:32666594
      reference_title: In vitro stem cell modelling demonstrates a proof-of-concept for excess functional mutant TIMP3 as the cause of Sorsby fundus dystrophy.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "TIMP3 dimers were observed in both SFD and control hiPSC-RPE, suggesting that mutant TIMP3 dimerisation does not drive SFD pathology."
      explanation: >-
        In this model dimers were not specific to patient cells, which
        contradicts dimerization as the step that produces the accumulation.
  evidence:
  - reference: PMID:32666594
    reference_title: In vitro stem cell modelling demonstrates a proof-of-concept for excess functional mutant TIMP3 as the cause of Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings provide a proof-of-concept that SFD patient-derived hiPSC-RPE mimic mature RPE cells and support the hypothesis that excess accumulation of mutant TIMP3, rather than an absence or deficiency of functional TIMP3, drives ECM and angiogenesis-related changes in SFD."
    explanation: States what the model supports, which is the accumulation mechanism this entry curates.
  - reference: PMID:28878022
    reference_title: Drusen in patient-derived hiPSC-RPE models of macular dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly basal deposits in patient hiPSC-RPE cultures were more abundant and displayed a lipid- and protein-rich \"drusen-like\" composition."
    explanation: Patient RPE from three dominant macular dystrophies, Sorsby among them, forms drusen-like deposits.
discussions:
- discussion_id: sfd_dimerization_vs_monomer_accumulation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is dimerization of mutant TIMP-3 the step that produces its accumulation in
    Bruch's membrane, or is accumulation of monomeric mutant protein sufficient?
  rationale: >-
    Expression studies in RPE-derived and other cell lines report
    disulfide-bonded dimers and multimers for every variant tested and tie
    turnover resistance to intermolecular bonding, which is the model the
    pathograph follows. Patient-derived iPSC-RPE instead accumulated TIMP3
    monomers basolaterally and showed dimers in control cultures too, and for
    the N-terminal Ser38Cys allele the reported defect is intramolecular bonding
    with no confirmed dimerization. The two kinds of system differ in whether
    the protein is overexpressed, so the disagreement bears on whether
    dimerization is mechanism or a consequence of expression level.
  attaches_to:
  - pathophysiology#Aberrant TIMP-3 Disulfide Bonding and Multimerization
  - pathophysiology#Resistance of Mutant TIMP-3 to Extracellular Matrix Turnover
  evidence:
  - reference: PMID:37013036
    reference_title: Evidence that all Sorsby's fundus dystrophy mutations cause TIMP3 dimerization resulting in impaired inhibition of VEGFR2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In summary, our data support the hypothesis that all SFD-mutated forms of TIMP3 result in dimerization/multimerization of the protein which in turn significantly impairs its ability to inhibit the proangiogenic growth factor receptor VEGFR2."
    explanation: One side of the disagreement, from transfected RPE-derived cells expressing each reported variant.
  - reference: PMID:32666594
    reference_title: In vitro stem cell modelling demonstrates a proof-of-concept for excess functional mutant TIMP3 as the cause of Sorsby fundus dystrophy.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "TIMP3 dimers were observed in both SFD and control hiPSC-RPE, suggesting that mutant TIMP3 dimerisation does not drive SFD pathology."
    explanation: The other side, from patient-derived RPE expressing the variant at endogenous level.
- discussion_id: sfd_no_model_reproduces_vision_loss
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any current model reproduce the loss of central vision that defines
    this disease in people?
  rationale: >-
    The Timp3 knock-in mouse reproduces the Bruch's membrane and RPE changes but
    keeps normal retinal function on electrodiagnostic recording throughout
    life, needs laser injury before neovascular leakage appears, and has no
    macula. Patient-derived iPSC-RPE reproduces matrix accumulation and
    deposits but has no choroid, no photoreceptors and no neovascular
    compartment. So the structural half of the disease is modelled and the
    functional endpoint is not, which is what a preventive trial would need.
  attaches_to:
  - animal_models#Mouse
  - experimental_models#Patient-derived SFD iPSC-RPE
  - phenotypes#Progressive central vision loss
  evidence:
  - reference: PMID:12147610
    reference_title: A mouse model for Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Long-term electrodiagnostic recordings indicated normal retinal function throughout life."
    explanation: The knock-in mouse carries the structural lesion without any functional deficit, which is the mismatch this gap records.
  - reference: PMID:34929159
    reference_title: Extracellular matrix dysfunction in Sorsby patient-derived retinal pigment epithelium.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that elements of SFD pathology can be demonstrated in culture which may lead to insights into disease mechanisms."
    explanation: The cell model's own authors claim elements of the pathology, not the clinical endpoint.
- discussion_id: sfd_adam17_tnf_arm
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do SFD TIMP3 alleles other than Ser156Cys lose the ability to inhibit
    ADAM17, and does a resulting rise in tumour necrosis factor alpha signalling
    contribute to the disease, as the response of one patient to adalimumab
    would suggest?
  rationale: >-
    TIMP-3 is the only TIMP that inhibits ADAM17, the sheddase of tumour
    necrosis factor alpha, so a variant that lost that inhibition could raise
    local tumour necrosis factor alpha. One patient with the Ser181Cys allele
    responded to adalimumab, which is the clinical hint. But the one allele
    measured, Ser156Cys, inhibits ADAM17 as well as wild-type TIMP-3 does, and
    the other SFD alleles, including the patient's, have not been profiled. So
    the inflammatory arm is neither supported nor excluded for the disease, and
    no mechanism node is drawn for it until an allele relevant to a patient is
    tested.
  attaches_to:
  - treatments#Systemic anti-TNF-alpha therapy (single case report)
  proposed_experiments:
  - experiment_id: sfd_adam17_inhibition_allele_panel
    name: ADAM17 and TNF-alpha shedding across an SFD TIMP3 allele panel
    description: >-
      Express a panel of SFD TIMP3 alleles, including Ser181Cys and other
      C-terminal cysteine variants, in a cell system and measure ADAM17
      inhibitory activity and ADAM17-mediated shedding of tumour necrosis factor
      alpha, against wild-type TIMP-3 and the already-profiled Ser156Cys as
      references.
    would_support:
    - treatments#Systemic anti-TNF-alpha therapy (single case report)
    supporting_outcome:
    - >-
      One or more patient-relevant SFD alleles show reduced ADAM17 inhibition
      and increased tumour necrosis factor alpha shedding relative to wild-type,
      which would make raised ocular tumour necrosis factor alpha a plausible
      arm and the adalimumab response mechanistically coherent.
    refuting_outcome:
    - >-
      SFD alleles retain wild-type ADAM17 inhibition, which would leave the
      adalimumab response unexplained by this mechanism.
  evidence:
  - reference: PMID:34376817
    reference_title: Treatment of Sorsby fundus dystrophy with anti-tumor necrosis factor-alpha medication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct inhibition of TNFα action by adalimumab offers a molecularly targeted approach to the disease pathophysiology and merits increased study."
    explanation: The single-patient response and the authors' call for further study are the clinical basis of the open question.
  - reference: PMID:38601018
    reference_title: "Review: Mechanisms of TIMP-3 accumulation and pathogenesis in Sorsby fundus dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The ability of other SFD TIMP-3 mutants to inhibit these and other relevant ADAMs and ADAMTSs has not been profiled, so additional work in this area is needed."
    explanation: States that the question is open for the alleles that matter clinically, which is what keeps this a gap rather than a settled negative.

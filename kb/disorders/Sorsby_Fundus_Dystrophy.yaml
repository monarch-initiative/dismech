- name: Genetic counseling and carrier surveillance
  description: >-
    Counseling for autosomal dominant inheritance with reported complete
    penetrance and variable age of onset, and cascade testing of relatives.
    Because structural and scotopic abnormalities precede symptoms, identified
    carriers can be monitored for the neovascular complication, which responds
    best when treated immediately.

    evidence_source: IN_VITRO
    snippet: "These data show that increased deposition of active TIMP-3, rather than dysregulation of metalloproteinase inhibition, is likely to be the primary, initiating event in SFD."
    explanation: The authors' conclusion from expressing the mutants in human RPE cells, that deposition of still-active protein is the initiating event.
  - reference: PMID:14597066
    reference_title: TIMP-3 mRNA is not overexpressed in Sorsby fundus dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a reduction of mRNA expression of MMP-2 and TIMP-3 in the Sorsby retinal pigment epithelium cells."
    explanation: In situ hybridization in an SFD donor eye shows no transcriptional overexpression, so accumulation is not driven by increased synthesis.
  - reference: PMID:9642234
    reference_title: Localization of the functional domains of human tissue inhibitor of metalloproteinases-3 and the effects of a Sorsby's fundus dystrophy mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data favor the hypothesis that the TIMP-3 mutations seen in Sorsby's fundus dystrophy contribute to disease progression by accumulation of mutant protein rather than by the loss of functional TIMP-3."
    explanation: Supports accumulation rather than loss of function as the route from the variant to disease.
  downstream:
  - target: TIMP-3 Accumulation in Bruch's Membrane
    causal_link_type: DIRECT
    description: >-
      Because TIMP-3 is secreted by the RPE into Bruch's membrane, protein that
      is not turned over accumulates there.
    evidence:

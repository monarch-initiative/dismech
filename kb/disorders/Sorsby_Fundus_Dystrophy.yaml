    reference_title: A new autosomal dominant eye and lung syndrome linked to mutations in TIMP3 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, SFD patients should be advised to avoid tobacco consumption, to practice sports, and to undergo regular pulmonary examinations."
    explanation: The authors' recommendation following the eye and lung families.
  - reference: "CGGV:assertion_8594a02c-c0f3-4542-b6d3-f089ba94417e-2021-07-02T174320.328Z"
    reference_title: TIMP3 / Sorsby fundus dystrophy (Definitive)
    supports: SUPPORT

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We believe treatment should begin with maximal safe resection, integrated molecular diagnosis, and a careful assessment of residual non-enhancing disease, growth kinetics, symptoms, seizure burden, neurocognitive priorities, fertility goals, and patient preference."
    explanation: Identifies seizure burden and neurocognitive function as central clinical manifestations requiring assessment and management in IDH-mutant diffuse gliomas.

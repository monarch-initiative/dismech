  evidence:
  - reference: PMID:40916936
    reference_title: "Isocitrate dehydrogenase mutation and microenvironment in gliomas: do immunotherapy approaches matter?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This unique immune microenvironment is shaped by 2-hydroxyglutarate (2-HG), an oncometabolite produced by mutant IDH."
    explanation: Establishes that mutant IDH produces the oncometabolite 2-hydroxyglutarate in gliomas.
  - reference: PMID:36651583
    reference_title: "IDH-mutant diffuse gliomas: tips and tricks in the era of genomic tumor classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In IDH-mutant gliomas, the IDH1 p. R132H is the most frequent IDH mutation. Other mutations in IDH1 are rare and predominantly found in astrocytomas, whereas IDH2 mutations are mostly observed in oligodendrogliomas."
    explanation: Confirms IDH1 p.R132H and rarer non-R132H IDH1/IDH2 mutations as the defining drivers in IDH-mutant astrocytomas.
  downstream:
  - target: 2-HG Accumulation and Epigenetic Dysregulation
    causal_link_type: DIRECT
    description: Neomorphic mutant IDH1/IDH2 catalytic activity generates millimolar intratumoral 2-HG that competitively inhibits 2-oxoglutarate-dependent dioxygenases.
- name: 2-HG Accumulation and Epigenetic Dysregulation
  conforms_to: "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases"
  biological_scale: MOLECULAR
  description: >-
    Intratumoral accumulation of D-2-hydroxyglutarate competitively inhibits
    alpha-ketoglutarate-dependent dioxygenases, including TET-family 5-methylcytosine
    hydroxylases and Jumonji-domain histone demethylases, reducing 5-hydroxymethylcytosine
    and inducing genome-wide CpG island and histone hypermethylation (G-CIMP).
  molecular_functions:

    explanation: Confirms elevated intratumoral D-2-hydroxyglutarate as a biochemical hallmark and diagnostic biomarker of IDH-mutant tumors.
  notes: >-
    D-2-hydroxyglutarate accumulates in IDH-mutant glioma tissue and can be detected

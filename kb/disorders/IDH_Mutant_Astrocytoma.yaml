name: IDH-Mutant Astrocytoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  IDH-mutant astrocytoma is a diffuse glioma defined by somatic mutations in isocitrate
  dehydrogenase 1 or 2 (IDH1 or IDH2), absence of chromosome 1p/19q codeletion, and
  frequent inactivation of TP53 and ATRX. Under the 2021 World Health Organization (WHO
  CNS5) classification, this molecularly defined entity is graded across CNS WHO grades
  2, 3, and 4 based on histopathological features and homozygous CDKN2A/CDKN2B deletion.
  Neomorphic IDH activity produces D-2-hydroxyglutarate (2-HG), competitively inhibiting
  2-oxoglutarate-dependent dioxygenases to drive genome-wide DNA and histone
  hypermethylation and impaired glial differentiation.
synonyms:
- Astrocytoma, IDH-mutant
- Diffuse astrocytoma, IDH-mutant
- IDH-mutant diffuse astrocytoma
categories:
- Central Nervous System Neoplasm
- Adult Brain Tumor
- Molecularly Defined Tumor
parents:
- diffuse glioma
has_subtypes:
- name: IDH-Mutant Astrocytoma Grade 2
  description: >-
    Low-grade diffuse astrocytoma with IDH1 or IDH2 mutation and retained chromosome
    1p/19q, characterized by low-to-moderate cellularity, mild nuclear atypia, and
    absence of significant mitotic activity, microvascular proliferation, necrosis, or
    homozygous CDKN2A/CDKN2B deletion.
- name: IDH-Mutant Astrocytoma Grade 3
  description: >-
    Diffusely infiltrating IDH-mutant astrocytoma showing increased cellularity, nuclear
    atypia, and elevated mitotic activity without microvascular proliferation, necrosis,
    or homozygous CDKN2A/CDKN2B deletion.
- name: IDH-Mutant Astrocytoma Grade 4
  description: >-
    High-grade IDH-mutant astrocytoma defined by microvascular proliferation, necrosis,
    or homozygous CDKN2A/CDKN2B deletion regardless of lower-grade histological
    appearance.
pathophysiology:
- name: IDH1/2 Neomorphic Mutation
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
  description: >-
    Heterozygous somatic missense mutations at active-site arginine residues in IDH1
    (most commonly p.R132H, with rarer non-R132H alleles enriched in astrocytomas) or
    IDH2 (p.R172 variants) occur as an early clonal initiating lesion in glial cells,
    simultaneously reducing normal alpha-ketoglutarate production and conferring
    neomorphic reduction of alpha-ketoglutarate to D-2-hydroxyglutarate (2-HG).

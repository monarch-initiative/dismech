    appearance.
epidemiology:
- name: Registry Incidence and Grade-Stratified Survival
  description: >-
    IDH-mutant astrocytomas account for approximately 13% of adult high-grade and diffuse
    glioma tertiary cohorts and occur at younger adult ages than IDH-wildtype
    glioblastoma, with median overall survival of 38.4 months overall in regional cohort
    data and 3-year survival probabilities of 86.0% (grade 2) and 75.7% (grade 3) versus
    25.9-month median survival in grade 4 disease in nationwide registry data.
  evidence:
  - reference: DOI:10.1093/neuonc/noad158
    reference_title: "Epidemiology and survival of adult-type diffuse glioma in Belgium during the molecular era"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Median overall survival time in IDH-wild-type glioblastoma was 9.3 months, significantly shorter compared to grade 4 IDH-mutant astrocytoma (median survival time: 25.9 months). The 3-year survival probability was 86.0% and 75.7% for grades 2 and 3 IDH-mutated astrocytoma."
    explanation: Nationwide Belgian Cancer Registry cohort establishing grade-stratified survival across CNS WHO grades 2, 3, and 4 IDH-mutant astrocytoma.
  - reference: PMID:41133515
    reference_title: "Incidence and Survival of IDH-Wildtype Glioblastoma and IDH-Mutant Astrocytoma by Treatment and Sex: A Regional Study in Spain (2011-2021)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A total of 1057 patients were included: 530 (50.1%) with IDH-wildtype glioblastoma and 137 (13%) with IDH-mutant astrocytoma. Incidence of both subtypes significantly increased during the study period (p < 0.01). Median overall survival (OS) was 12.3 months for IDH-wildtype glioblastoma and 38.4 months for IDH-mutant astrocytoma."
    explanation: Regional population-based Spanish cohort quantifying the proportion and median overall survival of adult IDH-mutant astrocytoma.
progression:
- phase: Malignant Transformation from Grade 2 to Grades 3-4
  notes: >-
    Lower-grade (CNS WHO grade 2) IDH-mutant astrocytomas grow continuously and carry a
    high lifetime risk of malignant transformation to CNS WHO grades 3 and 4, marked by
    increasing undifferentiated proliferative cell pools, secondary genetic alterations
    (such as homozygous CDKN2A/B deletion), neovascularization, and new MRI contrast
    enhancement.
  evidence:
  - reference: PMID:37272516
    reference_title: "Vorasidenib in IDH1- or IDH2-Mutant Low-Grade Glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "IDH-mutant grade 2 oligodendrogliomas and astrocytomas grow continuously, albeit slowly, infiltrate the normal brain, and eventually become aggressive tumors with accelerated tumor growth and neovascularization, reflected by appearance of contrast enhancement on magnetic resonance imaging (MRI)."
    explanation: Describes continuous infiltrative growth of grade 2 IDH-mutant astrocytomas and eventual transformation to aggressive contrast-enhancing high-grade disease.
  - reference: PMID:28360267
    reference_title: "Decoupling genetics, lineages, and microenvironment in IDH-mutant gliomas by single-cell RNA-seq."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "This provides a molecular fingerprint for tumor progression, because IDH-A tumors are thought to begin as grade II lesions and progress to grade III and IV."
    explanation: Single-cell transcriptomic analysis supporting stepwise progression of IDH-mutant astrocytomas from grade 2 to grades 3 and 4.
  - reference: PMID:38760442
    reference_title: "IDH inhibition in gliomas: from preclinical models to clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lower-grade gliomas are slowly growing grade 2 or 3 tumours with a high risk of malignant transformation, which is characterized by the appearance of or an increase in contrast enhancement on MRI."
    explanation: Summarizes the high risk of malignant transformation and its neuroradiologic hallmark in lower-grade IDH-mutant gliomas.
pathophysiology:
- name: IDH1/2 Neomorphic Mutation
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
  description: >-
    Heterozygous somatic missense mutations at active-site arginine residues in IDH1
    (most commonly p.R132H, with rarer non-R132H alleles enriched in astrocytomas) or
    IDH2 (p.R172 variants) occur as an early clonal initiating lesion in glial cells,
    simultaneously reducing normal alpha-ketoglutarate production and conferring
    neomorphic reduction of alpha-ketoglutarate to D-2-hydroxyglutarate (2-HG).

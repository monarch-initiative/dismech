  presence: PRESENT
  description: >-
    Immunohistochemical staining for mutant IDH1 p.R132H combined with nuclear ATRX loss
    (and strong p53 nuclear accumulation) supports the integrated diagnosis of
    IDH-mutant astrocytoma without requiring 1p/19q testing in typical supratentorial
    cases, or alongside 1p/19q exclusion when ATRX is retained.
  evidence:
  - reference: PMID:36651583
    reference_title: "IDH-mutant diffuse gliomas: tips and tricks in the era of genomic tumor classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Astrocytomas IDH-mutant display frequent immunohistochemical loss of ATRX, which is mutually exclusive with 1p/19q codeletion. They are graded based on histopathological features and the presence of CDKN2A/B homozygous deletion, whereas the criteria for grading oligodendrogliomas are less defined."
    explanation: Supports immunohistochemical ATRX loss and integrated histopathological/molecular grading in the diagnostic workup of IDH-mutant astrocytoma.
- name: DNA Methylation Profiling and CDKN2A/B Copy-Number Grading
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  presence: PRESENT
  description: >-
    Genome-wide DNA methylation profiling and copy-number assessment classify IDH-mutant
    astrocytoma subtypes (including infratentorial and mismatch-repair-deficient forms)
    and detect homozygous CDKN2A/CDKN2B deletion for CNS WHO grade 4 assignment.
  evidence:
  - reference: DOI:10.1093/neuonc/noae009
    reference_title: "Prognostic value of DNA methylation subclassification, aneuploidy, and <i>CDKN2A/B</i> homozygous deletion in predicting clinical outcome of IDH mutant astrocytomas"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We reviewed DNA methylation subclass, CDKN2A/B homozygous deletion, and ploidy and correlated molecular biomarkers with histological grade, progression free (PFS), and overall (OS) survival."
    explanation: Demonstrates integrated DNA methylation subclassification and CDKN2A/B homozygous deletion testing in diagnostic and prognostic stratification of IDH-mutant astrocytomas.
- name: Brain Magnetic Resonance Imaging and T2-FLAIR Mismatch Assessment
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: PRESENT
  description: >-
    Preoperative and surveillance brain MRI evaluates infiltrative parenchymal extent,
    contrast enhancement, the characteristic T2-FLAIR mismatch sign differentiating
    IDH-mutant non-codeleted astrocytoma from 1p/19q-codeleted oligodendroglioma, and
    1H-MR spectroscopy for 2-hydroxyglutarate.
  evidence:
  - reference: PMID:42159911
    reference_title: "Imaging diagnosis of adult-type diffuse gliomas in the era of WHO CNS5 and cIMPACT-NOW updates 8-11: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "First, we review imaging differentiation between AST and ODG, including the T2-fluid-attenuated inversion recovery (FLAIR) mismatch sign and its partial form, classic features supporting ODG such as coarse calcification and cortical-subcortical location, and newer biomarkers including the cortical high-flow sign on arterial spin labeling, subcortical FLAIR signal drop, and 1H-MR spectroscopy findings such as 2-hydroxyglutarate and cystathionine."
    explanation: Confirms MRI T2-FLAIR mismatch and 1H-MR spectroscopy 2-HG detection as key neuroradiologic diagnostic features of IDH-mutant astrocytoma.
treatments:
- name: Maximal Safe Resection
  description: >-
    Neurosurgical resection maximizing tumor cytoreduction (gross total or subtotal as
    dictated by anatomical safety) while preserving eloquent cortical and subcortical
    neurological function, providing tissue for integrated molecular diagnosis and
    improving survival outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: maximal safe resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Diffuse Cerebral Parenchymal Infiltration
    treatment_effect: INHIBITS
    description: Cytoreduces infiltrative hemispheric glioma burden and relieves parenchymal mass effect.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We believe treatment should begin with maximal safe resection, integrated molecular diagnosis, and a careful assessment of residual non-enhancing disease, growth kinetics, symptoms, seizure burden, neurocognitive priorities, fertility goals, and patient preference."
    explanation: Establishes maximal safe surgical resection as the foundational initial intervention for IDH-mutant diffuse gliomas.
  - reference: PMID:41133515
    reference_title: "Incidence and Survival of IDH-Wildtype Glioblastoma and IDH-Mutant Astrocytoma by Treatment and Sex: A Regional Study in Spain (2011-2021)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Multimodal therapy (surgery, radiotherapy, chemotherapy) significantly improved OS and progression-free survival (PFS) in both subgroups (p < 0.001)."
    explanation: Confirms survival benefit of surgical resection integrated into multimodal therapy for IDH-mutant astrocytoma.
- name: Radiation Therapy
  description: >-

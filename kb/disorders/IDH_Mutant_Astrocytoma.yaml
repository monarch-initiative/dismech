datasets:
- accession: ega:EGAS00001007527
  title: Evolutionary trajectories of IDH-mutant astrocytoma identify molecular grading markers related to cell cycling
  description: To study the evolutionary processes that drive malignant transformation in IDH-mutant astrocytomas, we performed multi-omics on a large cohort of matched initial and recurrent tumor samples. We find that genome-wide DNA-methylation levels decreased over time, mainly in patients with high-grade recurrences. DNA-demethylation was lifted from specific loci associated with DNA replication, and was associated with upregulation of cell cycling associated genes. Upregulation of cell cycling genes occurred predominantly in proliferating tumor cells, and was associated with tumor grade.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("IDH-Mutant Astrocytoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000000381
  title: Epigenetic landscape reorganization and reactivation of embryonic development genes are associated with malignancy in IDH-mutant astrocytoma
  description: Accurate grading of IDH-mutant gliomas is crucial for determining patient prognosis and guiding treatment decisions. However, histological grading can be challenging, so we aimed to identify objective molecular markers. To this end, we conducted bulk RNA sequencing on primary IDH-mutant astrocytomas (n=138) from the prospective CATNON trial, which evaluated the prognostic impact of adjuvant and concurrent temozolomide. Using this data, we sought to identify molecular markers linked to increased malignancy in IDH-mutant astrocytomas to establish objective grading criteria.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("IDH-Mutant Astrocytoma"); description-level mentions were not accepted. EGA study_type: RNASeq. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

    snippet: "This is highlighted by the adoption of CDKN2A/B HD as an essential criterion for astrocytoma and IDH-mutant central nervous system (CNS) WHO grade 4 in the fifth edition of the World Health Organisation (WHO) Classification of Central Nervous System Tumours (2021)."
    explanation: Establishes homozygous co-deletion of CDKN2B alongside CDKN2A as an essential molecular criterion for CNS WHO grade 4 IDH-mutant astrocytoma.
  notes: >-
    Co-deleted with adjacent CDKN2A on chromosome 9p21 in high-grade IDH-mutant
    astrocytoma, eliminating p15INK4b cell-cycle inhibition.
biochemical:
- name: 2-Hydroxyglutarate (2-HG)
  presence: ELEVATED
  evidence:
  - reference: DOI:10.3390/cancers16152752
    reference_title: "Targeting Isocitrate Dehydrogenase (IDH) in Solid Tumors: Current Evidence and Future Perspectives"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intratumoral and serum levels of D-2-hydroxyglutarate (D-2-HG) could serve as diagnostic biomarkers for identifying IDH mutant (IDHmut) tumors."
    explanation: Confirms elevated intratumoral D-2-hydroxyglutarate as a biochemical hallmark and diagnostic biomarker of IDH-mutant tumors.
  notes: >-
    D-2-hydroxyglutarate accumulates in IDH-mutant glioma tissue and can be detected
    non-invasively by proton magnetic resonance spectroscopy (1H-MRS).
diagnosis:
- name: IDH1 and IDH2 Mutation Sequencing
  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  presence: PRESENT
  description: >-
    Targeted DNA sequencing of IDH1 codon 132 and IDH2 codon 172 establishes the
    molecular diagnosis, particularly when IDH1 p.R132H immunohistochemistry is negative
    and non-canonical IDH1 or IDH2 mutations must be detected.
  evidence:
  - reference: PMID:36651583
    reference_title: "IDH-mutant diffuse gliomas: tips and tricks in the era of genomic tumor classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infratentorial astrocytoma IDH-mutant is enriched in IDH1 or IDH2 mutations that differ from the IDH1 p.R132H mutation and are detectable only by gene sequencing"
    explanation: Demonstrates the requirement for IDH1/IDH2 gene sequencing to identify non-R132H IDH mutations in IDH-mutant astrocytoma.
- name: IDH1 R132H and ATRX Immunohistochemistry with 1p/19q Exclusion
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  presence: PRESENT
  description: >-
    Immunohistochemical staining for mutant IDH1 p.R132H combined with nuclear ATRX loss
    (and strong p53 nuclear accumulation) supports the integrated diagnosis of
    IDH-mutant astrocytoma without requiring 1p/19q testing in typical supratentorial
    cases, or alongside 1p/19q exclusion when ATRX is retained.
  evidence:
  - reference: PMID:36651583
    reference_title: "IDH-mutant diffuse gliomas: tips and tricks in the era of genomic tumor classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Astrocytomas IDH-mutant display frequent immunohistochemical loss of ATRX, which is mutually exclusive with 1p/19q codeletion. They are graded based on histopathological features and the presence of CDKN2A/B homozygous deletion, whereas the criteria for grading oligodendrogliomas are less defined."
    explanation: Supports immunohistochemical ATRX loss and integrated histopathological/molecular grading in the diagnostic workup of IDH-mutant astrocytoma.
- name: DNA Methylation Profiling and CDKN2A/B Copy-Number Grading
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  presence: PRESENT
  description: >-
    Genome-wide DNA methylation profiling and copy-number assessment classify IDH-mutant
    astrocytoma subtypes (including infratentorial and mismatch-repair-deficient forms)
    and detect homozygous CDKN2A/CDKN2B deletion for CNS WHO grade 4 assignment.
  evidence:
  - reference: DOI:10.1093/neuonc/noae009
    reference_title: "Prognostic value of DNA methylation subclassification, aneuploidy, and <i>CDKN2A/B</i> homozygous deletion in predicting clinical outcome of IDH mutant astrocytomas"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed DNA methylation subclass, CDKN2A/B homozygous deletion, and ploidy and correlated molecular biomarkers with histological grade, progression free (PFS), and overall (OS) survival."
    explanation: Demonstrates integrated DNA methylation subclassification and CDKN2A/B homozygous deletion testing in diagnostic and prognostic stratification of IDH-mutant astrocytomas.
- name: Brain Magnetic Resonance Imaging and T2-FLAIR Mismatch Assessment
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: PRESENT
  description: >-
    Preoperative and surveillance brain MRI evaluates infiltrative parenchymal extent,
    contrast enhancement, the characteristic T2-FLAIR mismatch sign differentiating
    IDH-mutant non-codeleted astrocytoma from 1p/19q-codeleted oligodendroglioma, and
    1H-MR spectroscopy for 2-hydroxyglutarate.
  evidence:
  - reference: PMID:42159911
    reference_title: "Imaging diagnosis of adult-type diffuse gliomas in the era of WHO CNS5 and cIMPACT-NOW updates 8-11: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, we review imaging differentiation between AST and ODG, including the T2-fluid-attenuated inversion recovery (FLAIR) mismatch sign and its partial form, classic features supporting ODG such as coarse calcification and cortical-subcortical location, and newer biomarkers including the cortical high-flow sign on arterial spin labeling, subcortical FLAIR signal drop, and 1H-MR spectroscopy findings such as 2-hydroxyglutarate and cystathionine."
    explanation: Confirms MRI T2-FLAIR mismatch and 1H-MR spectroscopy 2-HG detection as key neuroradiologic diagnostic features of IDH-mutant astrocytoma.
treatments:
- name: Maximal Safe Resection
  description: >-
    Neurosurgical resection maximizing tumor cytoreduction while preserving eloquent
    cortical and subcortical neurological function, providing tissue for integrated
    molecular diagnosis and improving survival outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Gross Total Resection
    term:
      id: NCIT:C131672
      label: Gross Total Resection
  target_mechanisms:
  - target: Blocked Glial Differentiation and Diffuse Cerebral Infiltration
    treatment_effect: INHIBITS
    description: Cytoreduces infiltrative hemispheric glioma burden and relieves parenchymal mass effect.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We believe treatment should begin with maximal safe resection, integrated molecular diagnosis, and a careful assessment of residual non-enhancing disease, growth kinetics, symptoms, seizure burden, neurocognitive priorities, fertility goals, and patient preference."
    explanation: Establishes maximal safe surgical resection as the foundational initial intervention for IDH-mutant diffuse gliomas.
  - reference: PMID:41133515
    reference_title: "Incidence and Survival of IDH-Wildtype Glioblastoma and IDH-Mutant Astrocytoma by Treatment and Sex: A Regional Study in Spain (2011-2021)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multimodal therapy (surgery, radiotherapy, chemotherapy) significantly improved OS and progression-free survival (PFS) in both subgroups (p < 0.001)."
    explanation: Confirms survival benefit of surgical resection integrated into multimodal therapy for IDH-mutant astrocytoma.
- name: Radiation Therapy
  description: >-
    Postoperative external-beam radiotherapy administered in combination with sequential
    or concurrent alkylating chemotherapy for CNS WHO grade 3-4 or high-risk grade 2
    IDH-mutant astrocytoma, or deferred in selected low-risk grade 2 patients.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Blocked Glial Differentiation and Diffuse Cerebral Infiltration
    treatment_effect: INHIBITS
    description: Induces lethal DNA double-strand breaks in proliferating infiltrative astrocytoma cells.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiotherapy followed by PCV, or selected temozolomide-based approaches when PCV is not feasible, remains appropriate for rapid growth, symptomatic mass effect, new or nodular enhancement, neurological decline, uncontrolled seizures, high-risk molecular pathology such as CDKN2A/B homozygous deletion, or suspected grade transformation."
    explanation: Defines clinical and molecular indications for postoperative radiotherapy combined with alkylating chemotherapy in IDH-mutant diffuse gliomas.
  - reference: PMID:41133515
    reference_title: "Incidence and Survival of IDH-Wildtype Glioblastoma and IDH-Mutant Astrocytoma by Treatment and Sex: A Regional Study in Spain (2011-2021)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multimodal therapy (surgery, radiotherapy, chemotherapy) significantly improved OS and progression-free survival (PFS) in both subgroups (p < 0.001)."
    explanation: Confirms overall and progression-free survival benefit of radiotherapy within multimodal management of IDH-mutant astrocytoma.
- name: Temozolomide Chemotherapy
  description: >-
    Oral DNA-alkylating chemotherapy with temozolomide used adjuvantly following
    radiotherapy (as validated in the CATNON regimen for non-codeleted anaplastic
    glioma and as an alternative to PCV in high-risk grade 2 disease) and at progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: temozolomide
      term:
        id: CHEBI:72564
        label: temozolomide
  target_mechanisms:
  - target: Blocked Glial Differentiation and Diffuse Cerebral Infiltration
    treatment_effect: INHIBITS
    description: Methylates tumor DNA purine bases to induce replication arrest and apoptosis in proliferating astrocytoma cells.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiotherapy followed by PCV, or selected temozolomide-based approaches when PCV is not feasible, remains appropriate for rapid growth, symptomatic mass effect, new or nodular enhancement, neurological decline, uncontrolled seizures, high-risk molecular pathology such as CDKN2A/B homozygous deletion, or suspected grade transformation."
    explanation: Supports temozolomide-based alkylating chemotherapy alongside radiotherapy in high-risk or progressive IDH-mutant diffuse glioma.
- name: Vorasidenib (IDH1/2 Inhibitor)
  description: >-
    Oral brain-penetrant dual inhibitor of mutant IDH1 and IDH2 enzymes that suppresses
    intratumoral 2-hydroxyglutarate synthesis, prolongs progression-free survival, and
    delays time to next intervention in residual or recurrent CNS WHO grade 2 IDH-mutant
    astrocytoma without immediate need for chemoradiotherapy (INDIGO phase 3 trial).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: Vorasidenib
      term:
        id: NCIT:C152914
        label: Vorasidenib
  target_mechanisms:
  - target: IDH1/2 Neomorphic Mutation
    treatment_effect: INHIBITS
    description: Directly inhibits mutant IDH1 and IDH2 catalytic production of D-2-hydroxyglutarate across the blood-brain barrier.
  - target: 2-HG Accumulation and Epigenetic Dysregulation
    treatment_effect: INHIBITS
    description: Depletes intratumoral 2-hydroxyglutarate to relieve competitive inhibition of 2-oxoglutarate-dependent dioxygenases.
  evidence:
  - reference: PMID:37272516
    reference_title: "Vorasidenib in IDH1- or IDH2-Mutant Low-Grade Glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with grade 2 IDH-mutant glioma, vorasidenib significantly improved progression-free survival and delayed the time to the next intervention."
    explanation: Phase 3 INDIGO trial result demonstrating significant progression-free survival and time-to-next-intervention benefit with vorasidenib.
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vorasidenib is best framed as an active-delay strategy for patients with measurable, non-enhancing, clinically stable residual or recurrent grade 2 IDH-mutant astrocytoma or oligodendroglioma, particularly when radiotherapy and chemotherapy can reasonably be deferred and preservation of cognition, work capacity, quality of life, or fertility options is a major priority."
    explanation: Defines clinical patient selection for vorasidenib in residual or recurrent grade 2 IDH-mutant astrocytoma.

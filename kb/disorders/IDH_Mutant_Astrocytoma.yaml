genetic:
- name: IDH1
  gene_term:
    preferred_term: IDH1
    term:
      id: hgnc:5382
      label: IDH1
  association: Somatic Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:26061751
    reference_title: "Comprehensive, Integrative Genomic Analysis of Diffuse Lower-Grade Gliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three robust, nonoverlapping, prognostically significant subtypes of lower-grade glioma that were captured more accurately by IDH, 1p/19q, and TP53 status than by histologic class"
    explanation: Establishes somatic IDH mutation status as the primary molecular classifier of diffuse lower-grade gliomas.
  - reference: PMID:36651583
    reference_title: "IDH-mutant diffuse gliomas: tips and tricks in the era of genomic tumor classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In IDH-mutant gliomas, the IDH1 p. R132H is the most frequent IDH mutation. Other mutations in IDH1 are rare and predominantly found in astrocytomas, whereas IDH2 mutations are mostly observed in oligodendrogliomas."
    explanation: Confirms IDH1 p.R132H as the predominant driver mutation and non-canonical IDH1 variants as enriched in IDH-mutant astrocytomas.
  notes: >-
    Heterozygous somatic missense variants at codon R132 (predominantly p.R132H, plus
    non-canonical R132C/S/G/L alleles that require sequencing when R132H
    immunohistochemistry is negative) initiate tumorigenesis.
- name: IDH2
  gene_term:
    preferred_term: IDH2
    term:

  evidence:
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we demonstrate that 2-HG is a competitive inhibitor of multiple α-KG-dependent dioxygenases, including histone demethylases and the TET family of 5-methlycytosine (5mC) hydroxylases."
    explanation: Demonstrates direct competitive inhibition of histone demethylases and TET 5mC hydroxylases by 2-HG.
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In glioma, IDH1 mutations are associated with increased histone methylation and decreased 5-hydroxylmethylcytosine (5hmC). Hence, tumor-derived IDH1 and IDH2 mutations reduce α-KG and accumulate an α-KG antagonist, 2-HG, leading to genome-wide histone and DNA methylation alterations."
    explanation: Links glioma IDH1/IDH2 mutations and 2-HG accumulation directly to increased histone methylation, decreased 5hmC, and genome-wide DNA methylation alterations.
  downstream:
  - target: Blocked Glial Differentiation and Diffuse Cerebral Infiltration
    causal_link_type: DIRECT
    description: Genome-wide DNA and histone hypermethylation silences lineage-differentiation programs and locks astrocytic precursors in an infiltrative proliferative state.
  - target: Seizures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Peritumoral cortical neuronal hyperexcitability promoted by extracellular D-2-hydroxyglutarate structural mimicry of glutamate and infiltrative cortical disruption
    description: Tumoral 2-HG release and peritumoral cortical infiltration lower neuronal seizure thresholds and provoke tumor-related epilepsy.
- name: TP53 and ATRX Inactivation and Alternative Telomere Lengthening
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Cooperating somatic mutations in TP53 and loss-of-function alterations in the
    chromatin remodeler ATRX occur in the vast majority of IDH-mutant non-codeleted
    astrocytomas, abrogate p53-mediated DNA-damage checkpoints, and activate
    recombination-based alternative lengthening of telomeres (ALT) to sustain astrocytic
    lineage immortalization.

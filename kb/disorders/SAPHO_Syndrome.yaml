  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commonly, these bone alterations manifest in the anterior chest wall,
      including the sternum and clavicle, and extend to the cervical vertebrae and
      sacroiliac joints."
    explanation: Establishes sacroiliac joint involvement as part of the skeletal distribution.

- category: Dermatologic
  name: Palmoplantar Pustulosis
  description: >-
    Sterile pustular eruption of the palms and soles, the most characteristic cutaneous
    manifestation and the P of the acronym. In Japanese series it dominates the syndrome:
    more than 80% of reported cases are pustulotic arthro-osteitis.
  phenotype_term:
    preferred_term: Palmoplantar pustulosis
    term:
      id: HP:0100847
      label: Palmoplantar pustulosis
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dermatological manifestations of SAPHO syndrome vary, with the most
      prevalent being severe acne and pustular eczema, especially palmoplantar
      pustulosis."
    explanation: Establishes palmoplantar pustulosis as a leading cutaneous manifestation.
  - reference: PMID:34967407
    reference_title: SAPHO syndrome and pustulotic arthro-osteitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent survey indicated that more than 80% of cases of SAPHO syndrome in
      Japan were PAO, originally proposed by Sonozaki et al. in 1981, whereas severe acne
      was the most commonly reported skin ailment amongst participants with SAPHO
      syndrome in Israel."
    explanation: >-
      Quantifies the population dependence of which cutaneous form predominates, which is
      why no single frequency band is asserted for either.

- category: Dermatologic
  name: Severe Acne
  description: >-
    Severe acneiform eruption, often resistant to conventional treatment, and the A of
    the acronym. It is the predominant cutaneous form in some populations where
    palmoplantar pustulosis is in others.
  phenotype_term:
    preferred_term: Severe acne
    term:
      id: HP:0001061
      label: Acne
    severity: SEVERE
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acne (severe acneiform eruptions, often resistant to conventional
      treatments)"
    explanation: Gives the definitional description of the acne component of the acronym.

- category: Dermatologic
  name: Psoriasiform Skin Disease
  description: >-
    Psoriasis is among the common skin lesions in SAPHO, alongside acne. Curated against
    the HPO psoriasiform dermatitis term, which is the closest available concept - HPO has
    no plain "Psoriasis" class.
  phenotype_term:
    preferred_term: Psoriasis
    term:
      id: HP:0003765
      label: Psoriasiform dermatitis
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common skin lesions include psoriasis and acne, with hidradenitis
      suppurativa and neutrophilic dermatoses being less commonly seen."
    explanation: Names psoriasis among the common cutaneous manifestations.

- category: Dermatologic
  name: Hidradenitis Suppurativa
  description: >-
    A less common cutaneous association, curated because it places SAPHO in the wider
    family of follicular occlusion and neutrophilic skin disease.
  phenotype_term:
    preferred_term: Hidradenitis suppurativa
    term:
      id: HP:0040154
      label: Acne inversa
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common skin lesions include psoriasis and acne, with hidradenitis
      suppurativa and neutrophilic dermatoses being less commonly seen."
    explanation: Names hidradenitis suppurativa as a less common cutaneous manifestation.

- category: Laboratory
  name: Elevated Acute Phase Reactants
  description: >-
    Raised ESR and CRP during active disease. There is no specific laboratory finding for
    SAPHO, so these support activity assessment rather than diagnosis.
  phenotype_term:
    preferred_term: Elevated erythrocyte sedimentation rate
    term:
      id: HP:0003565
      label: Elevated erythrocyte sedimentation rate
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, during active disease, there may be an increase in positive acute
      phase markers, such as erythrocyte sedimentation rate (ESR), C-reactive protein
      (CRP), complement levels, mild leukocytosis, and thrombocytosis."
    explanation: >-
      Documents the acute phase response, and in the same source the absence of any
      SAPHO-specific laboratory marker.

prevalence:
- population: Caucasian populations
  measure_type: UNKNOWN
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  notes: >-
    Reported as "1 in 10,000". The two reviews carrying this figure trace it to the same
    source but label it differently - one calls it a frequency, the other an incidence -
    so measure_type is left UNKNOWN rather than guessed. Both state the true figure is
    unknown and likely higher because the disease is misdiagnosed or misclassified.
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SAPHO syndrome is rare, with a reported frequency of 1 in 10,000 in the
      Caucasian population."
    explanation: Source of the numeric estimate curated here.

- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Estimated at below 1 in 10,000 in the explicit absence of reliable epidemiological
    data. Curated in the qualitative RARE band rather than a numeric Orphanet tier because
    the source gives only an upper bound.
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of reliable epidemiological data, a prevalence of <1/10 000
      has been estimated."
    explanation: Source of the upper-bound estimate and of the caveat about data quality.

animal_models:
- name: PSTPIP2-knockout mouse
  species: Mouse
  genotype: Pstpip2 knockout (Pstpip2-/-)
  publication: PMID:25602062
  description: >-
    Germline Pstpip2 knockout mice develop paw swelling, synovitis, hyperostosis and
    osteitis with multifocal osteomyelitis, marked neutrophil and macrophage infiltration
    of bone, joint and skin, and elevated neutrophil-attracting chemokines and IL-1beta -
    a phenocopy of the human syndrome arising from a single defined gene.
  modeled_mechanisms:
  - target: Sterile Osteitis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces sterile multifocal osteitis with synovitis and hyperostosis, together
      with the neutrophil infiltration and IL-1beta elevation that the human cytokine
      model predicts.
    limitations: >-
      The gene is the problem. A candidate-gene study of 38 human SAPHO patients found no
      association with PSTPIP2, so the mouse establishes that loss of one innate
      regulator can produce a SAPHO-like phenotype, not that this is the human mechanism.
      The bone phenotype also diverges in direction: the mouse develops profound
      osteolytic lesions with decreased bone volume density, whereas proliferative
      hyperostosis and osteosclerosis are the human radiological signature.
    readouts:
    - name: Neutrophil and macrophage infiltration of bone, joint and skin
      target: Sterile Osteitis
      direction: INCREASED
      interpretation: >-
        Cellular correlate of the sterile osteitis node, in the same three compartments
        the human syndrome involves.
      evidence:
      - reference: PMID:25602062
        reference_title: "Increased neutrophil infiltration, IL-1 production and a SAPHO syndrome-like phenotype in PSTPIP2-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Multifocal osteomyelitis was found in inflamed paws, with increased
          macrophage and marked neutrophil infiltrations in the bone, joint and skin."
        explanation: Reports the histological measurement behind this readout.
    - name: Tissue IL-1beta and neutrophil-attracting chemokines
      target: Sterile Osteitis
      direction: INCREASED
      interpretation: >-
        Confirms in a model system the two mediators the human cytokine hub and the
        neutrophil recruitment node depend on.
      evidence:
      - reference: PMID:25602062
        reference_title: "Increased neutrophil infiltration, IL-1 production and a SAPHO syndrome-like phenotype in PSTPIP2-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Neutrophil-attracting chemokines and IL-1β were markedly elevated in
          inflamed tissues."
        explanation: Reports the cytokine and chemokine measurement behind this readout.
    evidence:
    - reference: PMID:25602062
      reference_title: "Increased neutrophil infiltration, IL-1 production and a SAPHO syndrome-like phenotype in PSTPIP2-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All Pstpip2(-/-) mice developed paw swelling, synovitis, hyperostosis and
        osteitis, resembling SAPHO syndrome, an inflammatory disorder of the bone, skin
        and joints."
      explanation: >-
        Supports treating this model as informative for the sterile osteitis node, with
        full penetrance of the SAPHO-like phenotype.
  evidence:
  - reference: PMID:20032092
    reference_title: "Genetic susceptibility factors in a cohort of 38 patients with SAPHO syndrome: a study of PSTPIP2, NOD2, and LPIN2 genes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic studies of HLA genes have shown no role for these class II antigens,
      whereas studies of 2 mouse models (cmo and Lupo) point to a role of the PSTPIP2
      gene."
    explanation: >-
      Records why PSTPIP2 was the candidate worth testing in humans - two independent
      mouse models - which is the same reason this model is curated here.

treatments:
- name: Nonsteroidal Anti-Inflammatory Therapy
  description: >-
    First-line, together with analgesics. As in chronic nonbacterial osteomyelitis, no
    agent is licensed for SAPHO and every treatment below is used off-label; there are no
    prospective randomised controlled trials in this disease at all, because there are no
    externally validated diagnostic criteria or outcome measures to run them against.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nonsteroidal anti-inflammatory drug
      term:
        id: NCIT:C257
        label: Nonsteroidal Antiinflammatory Drug
  target_mechanisms:
  - target: Sterile Osteitis
    treatment_effect: INHIBITS
    description: >-
      Suppresses the inflammatory bone lesion symptomatically without addressing the
      upstream innate dysregulation.
    evidence:
    - reference: PMID:23153960
      reference_title: The SAPHO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They include nonsteroidal anti-inflammatory drugs and analgesics as
        first-line agents."
      explanation: Establishes NSAIDs as the first-line agents this link describes.
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Externally validated and internationally agreed diagnostic criteria or
      outcomes and, as a result, prospective randomised controlled trials in SAPHO are
      absent."
    explanation: >-
      Establishes the evidence-base limitation that qualifies every treatment curated in
      this entry.

- name: TNF-alpha Blockade
  description: >-
    The biologic of first choice in conventional-treatment-refractory disease. In a
    systematic review of 66 biologic-treated cases, anti-TNF agents gave the highest
    response rate in bone and joint manifestations of any class. The caveat is
    compartment-specific and paradoxical: anti-TNF treatment can itself provoke skin
    lesions in some patients.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Pro-Inflammatory Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      Removes TNF-alpha from the self-amplifying cytokine hub, which is where its effect
      on both the bone and the skin arms originates.
    evidence:
    - reference: PMID:29773231
      reference_title: "Biologics in SAPHO syndrome: A systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Data support a positive effect of anti-TNF treatment in SAPHO with a
        response rate in bone and joint manifestations of 93.3%."
      explanation: Quantifies the osteoarticular response rate that grounds this treatment link.
  evidence:
  - reference: PMID:29773231
    reference_title: "Biologics in SAPHO syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In SAPHO patients not responding to conventional treatment, TNF blockers
      appear to be the first choice."
    explanation: Establishes anti-TNF as first-line biologic therapy.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, other research has revealed that anti-TNF-α treatments can
      provoke skin lesions in some patients, highlighting the influential role of TNF-α
      in these dermatological manifestations."
    explanation: >-
      Records the paradoxical cutaneous reaction, which is why the osteoarticular and
      dermatological responses to this agent must be assessed separately.

- name: IL-1 Blockade
  description: >-
    Effective in the musculoskeletal compartment and, on the available data, not in the
    skin. That dissociation is mechanistically informative rather than a limitation of the
    evidence: it argues that the bone and skin arms of the syndrome do not depend on the
    same cytokine to the same degree.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Pro-Inflammatory Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      Blocks IL-1 receptor signalling within the cytokine hub. The response supports
      IL-1 as a load-bearing component of the osteoarticular arm specifically.
    evidence:
    - reference: PMID:29773231
      reference_title: "Biologics in SAPHO syndrome: A systematic review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Data related to IL-1 inhibition in SAPHO are encouraging with most
        patients exhibiting a significant response in musculoskeletal manifestations
        (6/7, 85.7%). However, IL-1 inhibition is not effective in skin manifestations."
      explanation: >-
        Gives both halves of the dissociation - musculoskeletal response and cutaneous
        non-response - from a single systematic review.

- name: IL-17 and IL-23 Blockade
  description: >-
    The mirror image of IL-1 blockade: efficacy concentrated in the skin, with little
    consistent osteoarticular benefit. Two independent sources report the same asymmetry,
    and both note paradoxical psoriasis flares as a class effect.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: secukinumab
      term:
        id: NCIT:C152315
        label: Secukinumab
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
  target_mechanisms:
  - target: Neutrophilic Skin Inflammation
    treatment_effect: INHIBITS
    description: >-
      Interrupts the IL-23/IL-17 arm of the cytokine hub, which is the arm the cutaneous
      manifestations track most closely.
    evidence:
    - reference: PMID:39286247
      reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One particular study on patients with SAPHO syndrome showed that
        treatment with Secukinumab, an IL-17 inhibitor, significantly alleviated skin
        lesions and joint pain, indicating a crucial role of IL-17 in the associated skin
        manifestations."
      explanation: Supports IL-17 blockade acting on the cutaneous node.
  evidence:
  - reference: PMID:29773231
    reference_title: "Biologics in SAPHO syndrome: A systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Data related to IL-17 blockade indicate efficacy in skin disease with 4/7
      patients responding (57.1%). Joint/bone manifestations improved in 3/8 patients
      (37.5%)."
    explanation: Quantifies the skin-versus-bone asymmetry for IL-17 blockade.
  - reference: PMID:28532819
    reference_title: IL-23/Th17 targeted therapies in SAPHO syndrome. A case series.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding the rheumatic symptoms, no major improvement was obvious under
      any of the six treatment courses."
    explanation: >-
      An independent case series reporting no major rheumatic improvement across six
      courses, corroborating the compartment asymmetry.
  - reference: PMID:28532819
    reference_title: IL-23/Th17 targeted therapies in SAPHO syndrome. A case series.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No particular safety concerns were reported, except cases of paradoxical
      psoriasis flare in one under ustekinumab and the other case under secukinumab."
    explanation: Documents paradoxical psoriasis flare with both agents in this class.

- name: Bisphosphonate Therapy
  description: >-
    A treatment chosen for the specific shape of this disease. SAPHO combines increased
    bone remodelling with inflammatory osteitis, and bisphosphonates act on both - an
    antiosteoclastic effect and an anti-inflammatory one - which is why they are used
    here rather than as generic bone-protective agents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Bone Remodeling Imbalance
    treatment_effect: MODULATES
    description: >-
      Acts directly on the remodelling node by suppressing osteoclast activity, while its
      anti-inflammatory action reaches the osteitis.
    evidence:
    - reference: PMID:12184437
      reference_title: Pamidronate treatment in SAPHO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SAPHO syndrome is characterized by both increased bone remodeling and
        inflammatory osteitis, indicating that it may respond favorably to pamidronate's
        dual mechanism of action."
      explanation: States the dual-mechanism rationale that grounds this treatment link.
  evidence:
  - reference: PMID:12184437
    reference_title: Pamidronate treatment in SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the five patients had a response after 1 week."
    explanation: >-
      The observed response, from an uncontrolled series of five refractory patients -
      the scale of evidence available for this indication.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have underscored the effectiveness of bisphosphonates, such
      as zoledronic acid, in alleviating pain and reducing inflammatory lesions in
      patients with SAPHO syndrome."
    explanation: Corroborates the class effect with a second-generation agent.

- name: Corticosteroids and Conventional DMARDs
  description: >-
    Escalation between NSAIDs and biologics. The honest summary of this tier is that it
    helps some patients and not others, which is itself the evidence cited for the
    pathogenesis being multifactorial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  evidence:
  - reference: PMID:23153960
    reference_title: The SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic corticosteroids, disease-modifying anti-rheumatic drugs,
      biologicals targeting tumor necrosis factor alpha and interleukin-1, and
      bisphosphonates have all been beneficial in some patients, but ineffective in
      others."
    explanation: >-
      Documents the inconsistent response across every drug class, which is the
      observation this tier is curated against.

- name: Antibiotic Therapy
  description: >-
    Used on the reasoning that C. acnes drives the disease. It is curated because its
    partial failure is mechanistically informative: benefit is transient and incomplete,
    which is a substantial part of the argument against overt infection as the cause. A
    corollary in the clinical literature runs the other way - recognising SAPHO promptly
    prevents patients being given long-term antibiotics they do not need.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Cutibacterium acnes Intraosseous Persistence
    treatment_effect: INHIBITS
    description: >-
      Targets the hypothesised persistent organism. The incompleteness of the response is
      the informative part, and is one reason the C. acnes model is curated as emerging
      rather than canonical.
    evidence:
    - reference: PMID:28499891
      reference_title: "SAPHO, autophagy, IL-1, FoxO1, and Propionibacterium (Cutibacterium) acnes."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Overt infection by Propionibacterium acnes is lacking in many SAPHO
        syndromes, and antibiotics have only a transient and incomplete effect, either in
        SAPHO syndrome or acne."
      explanation: Records the transient, incomplete antibiotic effect this link is curated around.
  evidence:
  - reference: PMID:23153960
    reference_title: The SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The early recognition, diagnosis, and prompt treatment of SAPHO syndrome
      can prevent the unnecessary use of long-term antibiotics or invasive procedures"
    explanation: >-
      Frames prolonged antibiotic exposure as a harm of delayed diagnosis rather than as
      standard therapy.

differential_diagnoses:
- name: Bacterial osteomyelitis
  description: >-
    The differential the sterile osteitis is defined against, and a formal exclusion in
    every proposed criteria set. Imaging and histology can be indistinguishable, and the
    cost of error runs both ways - antibiotics and surgery for an inflammatory disease,
    or immunosuppression for an untreated infection.
  distinguishing_features:
  - No causative organism accounts for the lesions in SAPHO
  - Antibiotics give only transient and incomplete benefit in SAPHO
  - Anterior chest wall hyperostosis and accompanying neutrophilic skin disease are not features of bacterial osteomyelitis
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosing SAPHO relies on the presence of clinical features (including
      sterile bone inflammation, arthritis, inflammatory skin disease) and the exclusion
      of differential diagnoses (such as infections, tumours, Langerhans cell
      histiocytosis)"
    explanation: Establishes infection as a formal exclusion in the diagnostic approach.

- name: Bone malignancy
  description: >-
    Primary bone tumours and metastatic disease can produce sclerotic or lytic lesions
    with pain in the same distribution. Formally excluded before a SAPHO diagnosis is
    made, and the reason biopsy is often performed.
  distinguishing_features:
  - Formal exclusion in the clinical diagnostic approach
  - SAPHO lesions are typically multifocal with a relapsing rather than progressive course
  - Accompanying neutrophilic skin disease points away from malignancy
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosing SAPHO relies on the presence of clinical features (including
      sterile bone inflammation, arthritis, inflammatory skin disease) and the exclusion
      of differential diagnoses (such as infections, tumours, Langerhans cell
      histiocytosis)"
    explanation: Names tumours as a formal exclusion.

- name: Langerhans cell histiocytosis
  description: >-
    A specific named exclusion rather than a generic one. It produces multifocal bone
    lesions with skin involvement, which is precisely the SAPHO pattern, so it is
    excluded on histology rather than on distribution.
  distinguishing_features:
  - Named explicitly among the differentials to be excluded
  - Distinguished by lesional histology rather than by lesion distribution
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosing SAPHO relies on the presence of clinical features (including
      sterile bone inflammation, arthritis, inflammatory skin disease) and the exclusion
      of differential diagnoses (such as infections, tumours, Langerhans cell
      histiocytosis)"
    explanation: Names Langerhans cell histiocytosis as a specific exclusion.

- name: Chronic nonbacterial osteomyelitis of childhood
  description: >-
    Not straightforwardly a differential. CNO/CRMO shares the sterile multifocal osteitis
    and can share the skin manifestations, and whether it is a distinct condition or the
    paediatric expression of the same disease is actively debated. Kahn's criteria treat
    the presence of CRMO in a child as sufficient for a SAPHO diagnosis, which makes the
    boundary a matter of convention rather than of biology. Curated as a differential
    because dismech holds a separate entry for it.
  distinguishing_features:
  - CNO/CRMO presents in children and adolescents; SAPHO onset is typically the third to fifth decade
  - Anterior chest wall hyperostosis is more characteristic of adult SAPHO
  - Under Kahn's criteria, CRMO in a child is itself sufficient to diagnose SAPHO
  evidence:
  - reference: PMID:40004896
    reference_title: "What Is New and What Is Next for SAPHO Syndrome Management: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there is an ongoing debate about whether SAPHO syndrome and CNO
      are distinct conditions or simply represent different manifestations of the same
      disease depending on the age at onset"
    explanation: >-
      Records the unresolved nosology directly, which is why this is curated as a
      contested boundary rather than a clean differential.

discussions:
- discussion_id: gap_sapho_cutibacterium_acnes_trigger_or_contaminant
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cutibacterium acnes Intraosseous Persistence
  - mechanistic_hypotheses#emerging_cutibacterium_acnes_trigger_model
  prompt: >-
    Is Cutibacterium acnes recovered from SAPHO bone lesions a causal trigger of the
    osteitis, or a commensal contaminant of the biopsy?
  rationale: >-
    Every element of the argument is currently compatible with both answers. C. acnes is
    a potent NLRP3 inflammasome activator and would supply the IL-1beta the rest of the
    mechanism requires, which is the case for causation. Against it: overt infection is
    absent in many patients, antibiotics produce only transient and incomplete benefit,
    and C. acnes is the commonest contaminant of any biopsy taken through skin - so
    recovery from a lesion is weak evidence either way. The question matters beyond
    taxonomy, because the two answers imply different diseases. If the organism is
    causal, SAPHO is a reactive osteitis in a susceptible host and antimicrobial strategy
    is undertreated; if it is a contaminant, the antibiotic exposure many patients
    receive is pure harm, which the clinical literature already flags as a consequence of
    delayed diagnosis.
  proposed_experiments:
  - experiment_id: exp_sapho_acnes_quantitative_culture_versus_controls
    name: Quantify C. acnes in SAPHO bone lesions against contamination-matched controls
    description: >-
      Compare organism burden in SAPHO lesional bone against two control sets that the
      existing literature lacks: unaffected bone from the same patients, and bone from
      non-SAPHO patients biopsied through skin by the same route. Contamination predicts
      similar low-level recovery across all three; a causal role predicts enrichment in
      lesional bone specifically. Pair this with intracellular localisation in bone cells,
      since the hypothesis is persistence rather than infection and a purely extracellular
      or surface-associated organism would not support it.
    would_support:
    - pathophysiology#Cutibacterium acnes Intraosseous Persistence
    supporting_outcome:
    - >-
      Organism burden is significantly enriched in lesional bone relative to both control
      sets, with demonstrable intracellular localisation in bone-resident cells.
    would_refute:
    - pathophysiology#Cutibacterium acnes Intraosseous Persistence
    refuting_outcome:
    - >-
      Recovery rates are indistinguishable across lesional bone, unaffected bone and
      non-SAPHO skin-route biopsies, consistent with contamination during sampling.

- discussion_id: gap_sapho_cno_nosology_one_disease_or_two
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#SAPHO Syndrome
  - differential_diagnoses#Chronic nonbacterial osteomyelitis of childhood
  prompt: >-
    Are SAPHO syndrome and paediatric chronic nonbacterial osteomyelitis two diseases, or
    one disease observed at two ages?
  rationale: >-
    The debate is live in the current literature rather than settled by convention.
    Kahn's criteria already treat CRMO in a child as sufficient to diagnose SAPHO; CNO can
    carry the same skin manifestations and the same IBD association; and adult CNO without
    skin disease is described. What separates them in practice is age at onset and the
    prominence of anterior chest wall hyperostosis, neither of which is obviously a
    difference in mechanism. dismech currently holds two entries, so the answer is not
    merely nosological here - it determines whether this entry and Chronic Recurrent
    Multifocal Osteomyelitis should eventually be one entry with age-stratified subtypes.
  proposed_experiments:
  - experiment_id: exp_sapho_cno_joint_molecular_stratification
    name: Jointly stratify SAPHO and CNO cohorts on innate signalling and treatment response
    description: >-
      Profile monocyte and neutrophil innate signalling, cytokine output and treatment
      response across an age-spanning cohort recruited under both diagnoses, and test
      whether the resulting clusters track diagnosis or track age. If clusters cut across
      both labels, the two are one disease and the diagnostic boundary is an artefact of
      which specialty sees the patient. If they separate cleanly by diagnosis
      independently of age, the entities are distinct and the shared features are
      convergent.
    would_support:
    - disease#SAPHO Syndrome
    supporting_outcome:
    - >-
      Molecular and treatment-response clusters separate SAPHO from CNO independently of
      age at onset, supporting two distinct entities.
    would_refute:
    - disease#SAPHO Syndrome
    refuting_outcome:
    - >-
      Clusters cut across the two diagnostic labels and track age or skin phenotype
      instead, indicating a single disease with age-dependent expression.

- discussion_id: gap_sapho_compartment_specific_cytokine_dependency
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pro-Inflammatory Cytokine Amplification
  prompt: >-
    Why do the bone and skin compartments of SAPHO depend on different cytokines, and can
    that dissociation be used to choose therapy?
  rationale: >-
    The treatment data contain a clean, reproducible asymmetry that no current mechanistic
    account explains. IL-1 blockade produces musculoskeletal responses and is reported
    ineffective in skin; IL-17/IL-23 blockade does the reverse, improving skin while
    leaving rheumatic symptoms largely unchanged; anti-TNF works in bone and joint but can
    paradoxically provoke skin lesions. If SAPHO were a single cytokine-driven process, a
    given blockade should move both arms together. That it does not suggests the syndrome
    is two partially independent inflammatory programmes sharing an upstream innate
    defect - which would also explain why skin disease can be absent entirely, and why
    combination or compartment-directed therapy is not currently rational to prescribe
    because nobody has tested it.
  proposed_experiments:
  - experiment_id: exp_sapho_paired_bone_skin_cytokine_profiling
    name: Paired lesional bone and skin cytokine profiling before and after single-agent blockade
    description: >-
      Sample lesional bone and lesional skin from the same patients before and after a
      defined course of single-agent IL-1, TNF or IL-17 blockade, and measure
      compartment-resolved cytokine and cellular profiles alongside compartment-specific
      clinical response. The discriminating result is whether the non-responding
      compartment shows an unchanged local cytokine profile - true independence - or a
      changed profile without clinical response, which would instead implicate established
      structural damage rather than ongoing cytokine drive.
    would_support:
    - pathophysiology#Pro-Inflammatory Cytokine Amplification
    supporting_outcome:
    - >-
      Blockade suppresses its target cytokine in both compartments but only the responding
      compartment shows resolution, locating the dissociation downstream of the shared hub.
    would_refute:
    - pathophysiology#Pro-Inflammatory Cytokine Amplification
    refuting_outcome:
    - >-
      Each compartment shows an independent cytokine profile unaffected by blockade of the
      other's dominant mediator, indicating two separate programmes rather than one hub.

notes: >-
  Relationship to Chronic Recurrent Multifocal Osteomyelitis. dismech holds a separate
  entry for paediatric CNO/CRMO, and that entry does not mention SAPHO. The two are
  curated separately here because MONDO keeps SAPHO as a sibling under autoinflammatory
  syndrome rather than under CRMO, and because SAPHO adds the cutaneous and anterior
  chest wall axes. That separation is a curation convention, not a settled biological
  claim - the literature actively debates it, and the debate is curated as a knowledge
  gap rather than resolved by the file layout.

  Category is Complex rather than Mendelian or Autoimmune. No causal gene is established:
  the strongest candidates, PSTPIP2, NOD2 and LPIN2, were tested together in a human
  cohort and none was associated. Autoimmune was rejected because current reviews
  explicitly weigh the question and conclude autoinflammatory, on the basis of neutrophil
  hyperactivity, reduced NK cells, high IL-1 and the response to IL-1 blockade. No
  genetic section is curated for this reason - listing PSTPIP2 as a disease gene would
  assert exactly what the cited study refutes. The gene appears instead as the genotype of
  the mouse model, where the human negative result is recorded as that model's limitation.

  Prevalence is curated as two records because the sources are not comparable. One reports
  1 in 10,000 in Caucasian populations - labelled a frequency in one review and an
  incidence in another, hence measure_type UNKNOWN - and the other gives an upper bound of
  below 1 in 10,000 in the explicit absence of reliable epidemiological data. A third
  source states plainly that the prevalence remains unavailable. No figure is treated as
  authoritative.

  No frequency bands are asserted for the cutaneous phenotypes. Which form predominates
  is population-dependent: more than 80% of Japanese cases are pustulotic arthro-osteitis,
  while severe acne is the commonest skin finding in an Israeli series. A single band
  would misrepresent that. Dermatological involvement overall is reported in 60-90% of
  cases, which is recorded in the description rather than attached to any one phenotype.

  No conforms_to is declared. No module in kb/modules/ covers sterile IL-1-driven
  osteitis, and the Chronic Recurrent Multifocal Osteomyelitis entry declares none either.
  If such a module is created later, both entries are candidates to conform to it.

  Antibiotic therapy is curated as a treatment despite working poorly. Its partial failure
  is evidence bearing on the C. acnes hypothesis, and prolonged antibiotic exposure is a
  documented harm of delayed diagnosis - both of which are lost if the entry lists only
  effective therapies.


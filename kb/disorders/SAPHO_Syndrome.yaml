name: SAPHO Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Complex
synonyms:
- Synovitis, acne, pustulosis, hyperostosis, osteitis syndrome
- Synovitis-acne-pustulosis-hyperostosis-osteitis syndrome
- Acquired hyperostosis syndrome
- Pustulo-psoriatic hyperostotic spondyloarthritis
- Pustulotic arthro-osteitis
- PPHS
description: >-
  SAPHO syndrome is an autoinflammatory disorder that couples sterile inflammatory bone
  disease to neutrophilic skin disease. The acronym names its five components -
  synovitis, acne, pustulosis, hyperostosis and osteitis - and the syndrome is defined by
  their co-occurrence rather than by any one of them.

  The central negative feature is the same one that defines its paediatric counterpart:
  the osteitis is sterile. Lesions can look infectious on imaging and on histology, but
  no organism accounts for them and antibiotics do not durably treat them. What
  distinguishes SAPHO from most sterile osteitis is what the bone does next - it
  proliferates. Hyperostosis and osteosclerosis of the anterior chest wall, with marrow
  fibrosis and thickened trabeculae, are the radiological signature, so the bone lesion
  is not simply lytic inflammation but a remodelling failure in which formation and
  resorption are both deranged.

  Mechanistically it is an innate immune disorder. Neutrophil hyperactivity, elevated
  IL-1 and a therapeutic response to IL-1 blockade are the reasons current reviews
  classify it as autoinflammatory rather than autoimmune, and TNF-alpha, IL-1beta, IL-6,
  IL-8 and the IL-23/IL-17 axis are all implicated in both the bone and the skin
  compartments. No causal gene is established. Two mouse models point to PSTPIP2, but a
  human candidate-gene study of 38 patients found no association with PSTPIP2, NOD2 or
  LPIN2, and this entry curates that discordance rather than smoothing it over.

  Two things about this disease are genuinely unsettled and are curated as such: whether
  Cutibacterium (formerly Propionibacterium) acnes recovered from bone lesions is a
  trigger or a contaminant, and whether SAPHO and paediatric chronic nonbacterial
  osteomyelitis are two diseases or one disease seen at two ages.
disease_term:
  preferred_term: SAPHO syndrome
  term:
    id: MONDO:0019266
    label: SAPHO syndrome
parents:
- Autoinflammatory Syndrome

pathophysiology:
- name: Innate Immune Dysregulation
  biological_scale: MOLECULAR
  description: >-
    The upstream lesion, and the least well characterised. What is reproducibly reported
    is a set of innate abnormalities - neutrophil hyperactivity, reduced natural killer
    cell numbers, high IL-1 - together with a therapeutic response to IL-1 blockade. That
    combination is why contemporary reviews classify SAPHO as autoinflammatory rather
    than autoimmune. No causal gene underlies it: this node describes a functional state,
    not a genotype.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  downstream:
  - target: Pro-Inflammatory Cytokine Amplification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It's not clear if SAPHO syndrome is an autoimmune disease or an
      autoinflammatory disease, but current evidence suggests that it's more likely an
      autoinflammatory disease because of things like neutrophil hyperactivity, fewer
      natural killer (NK) cells, high levels of interleukin (IL)-1, and a good response
      to treatments that block IL-1."
    explanation: >-
      Names the four innate observations that ground this node, and the reasoning by
      which the disease is classified as autoinflammatory.
  - reference: PMID:20032092
    reference_title: "Genetic susceptibility factors in a cohort of 38 patients with SAPHO syndrome: a study of PSTPIP2, NOD2, and LPIN2 genes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We found no association between PSTPIP2, NOD2, and LPIN2 variants and the
      SAPHO syndrome."
    explanation: >-
      Refutes a monogenic account of this node in humans. The three genes tested were the
      strongest available candidates - two from mouse models of SAPHO-like disease, one
      from a clinically similar monogenic syndrome - and none was associated.
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Synovitis acne pustulosis hyperostosis osteitis (SAPHO) is a rare
      heterogeneous disease of unknown aetiopathology."
    explanation: >-
      Records that the aetiopathology is unknown, which is the epistemic status this node
      is curated at.

- name: Cutibacterium acnes Intraosseous Persistence
  biological_scale: CELLULAR
  description: >-
    A candidate initiating step, curated as a hypothesis rather than as established
    mechanism. Cutibacterium (formerly Propionibacterium) acnes is recovered from a
    proportion of SAPHO bone biopsies, and it is a potent activator of the NLRP3
    inflammasome, which would supply the IL-1beta the rest of the chain depends on. The
    case against it is equally concrete: overt infection is absent in many patients and
    antibiotics produce only transient, incomplete benefit. The proposal that survives
    both observations is low-grade intracellular persistence rather than infection.
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  downstream:
  - target: Pro-Inflammatory Cytokine Amplification
    causal_link_type: DIRECT
    hypothesis_groups:
    - emerging_cutibacterium_acnes_trigger_model
    description: >-
      Proposed route by which persistent intracellular C. acnes would drive the
      IL-1beta production that sustains the syndrome. Curated as belonging to the
      emerging hypothesis group, not as an established edge.
  evidence:
  - reference: PMID:28499891
    reference_title: "SAPHO, autophagy, IL-1, FoxO1, and Propionibacterium (Cutibacterium) acnes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "P. acnes is indeed a powerful trigger of NLRP3-inflammasome activation and
      IL-1β, leading to osteitis and enhanced mesenchymal cells differentiation in
      osteoblasts."
    explanation: >-
      States the proposed molecular route from the organism to inflammasome activation
      and osteitis. The source is a hypothesis paper, graded OTHER accordingly.
  - reference: PMID:28499891
    reference_title: "SAPHO, autophagy, IL-1, FoxO1, and Propionibacterium (Cutibacterium) acnes."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Overt infection by Propionibacterium acnes is lacking in many SAPHO
      syndromes, and antibiotics have only a transient and incomplete effect, either in
      SAPHO syndrome or acne."
    explanation: >-
      The countervailing observation, from the same source. It is why the node is framed
      as persistence rather than infection, and why the edge is hypothesis-scoped.

- name: Pro-Inflammatory Cytokine Amplification
  biological_scale: MOLECULAR
  description: >-
    The hub of the disease. TNF-alpha, IL-1beta, IL-6, IL-8, IL-18 and the IL-23/IL-17
    axis converge on NF-kappaB and MAPK signalling, each amplifying the others. This is
    a self-sustaining loop rather than a linear cascade, which is the mechanistic reason
    single-cytokine blockade helps many patients without curing any, and the reason
    different agents work in the bone and the skin compartments.
  biological_processes:
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  - preferred_term: interleukin-17 production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: INCREASED
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Neutrophil Recruitment and Activation
    causal_link_type: DIRECT
  - target: Bone Remodeling Imbalance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the signaling pathways involving IL-1 and TNF-α are central to
      the pathophysiology of SAPHO syndrome, supporting the use of biologic treatments
      such as TNF-α inhibitors and IL-1 receptor antagonists"
    explanation: >-
      Establishes IL-1 and TNF-alpha signalling as central, and ties that centrality to
      the therapeutic response that corroborates it.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the pathogenesis of SAPHO syndrome, interleukin-23 (IL-23) and
      interleukin-17 (IL-17) form a critical cytokine axis significantly influencing
      inflammation and bone lesions."
    explanation: Adds the IL-23/IL-17 arm, which is the axis the skin manifestations track most closely.

- name: Neutrophil Recruitment and Activation
  biological_scale: CELLULAR
  description: >-
    IL-8 recruits neutrophils to bone and skin and promotes their adherence and
    transendothelial migration; once there they degranulate and release reactive oxygen
    species. Neutrophils from patients are themselves hyperactive, secreting IL-8 and
    TNF-alpha and so feeding the upstream loop. This node is the reason the cutaneous
    lesions are neutrophilic pseudoabscesses and the bone lesions are neutrophil-rich.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: interleukin-8 production
    term:
      id: GO:0032637
      label: interleukin-8 production
    modifier: INCREASED
  downstream:
  - target: Sterile Osteitis
    causal_link_type: DIRECT
  - target: Neutrophilic Skin Inflammation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In SAPHO syndrome, IL-8 primarily recruits and activates neutrophils at
      inflammation sites."
    explanation: Establishes the chemokine-driven recruitment step this node describes.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once activated, neutrophils release enzymes and reactive oxygen species
      that contribute to inflammatory damage in SAPHO syndrome, evident in bone
      resorption and skin lesions"
    explanation: >-
      Links neutrophil effector function to damage in both compartments, which is why
      this node branches to bone and to skin.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neutrophils in patients with SAPHO syndrome demonstrate excessive
      activation, releasing substantial quantities of pro-inflammatory cytokines like
      IL-8 and TNF-α"
    explanation: Documents the feedback arm by which activated neutrophils re-supply the cytokine hub.

- name: Bone Remodeling Imbalance
  biological_scale: CELLULAR
  description: >-
    The node that makes SAPHO bone disease distinctive. IL-1beta, IL-17, IL-6 and
    TNF-alpha each stimulate osteoclastogenesis while inhibiting osteoblast
    differentiation and function, so both arms of remodelling are deranged at once. The
    clinical consequence is not a single direction of bone change: lytic and sclerotic
    lesions coexist, and the net proliferative outcome at the anterior chest wall is what
    the acronym records as hyperostosis.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  downstream:
  - target: Hyperostosis and Osteosclerosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, in bone cells, IL-1β stimulates osteoclastogenesis, leading
      to increased bone resorption. IL-1β also inhibits osteoblast differentiation and
      function, impairing bone formation and repair."
    explanation: >-
      States the dual, opposite-direction action on the two bone cell types that defines
      this node as an imbalance rather than as resorption alone.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In bone cells, IL-17 directly stimulates osteoclastogenesis, leading to
      increased bone resorption."
    explanation: Adds IL-17 as a second cytokine acting on the same remodelling axis.

- name: Sterile Osteitis
  biological_scale: TISSUE
  description: >-
    Inflammatory bone lesions with no causative organism. As in chronic nonbacterial
    osteomyelitis, this node is established by exclusion - by failing to isolate a
    pathogen, and by lesions that do not behave like infection over time - which is why
    diagnosis of the whole syndrome rests on ruling differentials out rather than on any
    positive test.
  downstream:
  - target: Hyperostosis and Osteosclerosis
    causal_link_type: DIRECT
  - target: Synovitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosing SAPHO relies on the presence of clinical features (including
      sterile bone inflammation, arthritis, inflammatory skin disease) and the exclusion
      of differential diagnoses (such as infections, tumours, Langerhans cell
      histiocytosis)"
    explanation: >-
      Establishes sterile bone inflammation as a defining clinical feature and records
      that it is reached by exclusion.
  - reference: PMID:34967407
    reference_title: SAPHO syndrome and pustulotic arthro-osteitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Musculoskeletal manifestations, including osteitis, synovitis, and
      hyperostosis, are the hallmarks of the SAPHO syndrome and affect a variety of
      regions of the body."
    explanation: Names osteitis as a hallmark manifestation alongside the two nodes it feeds.

- name: Hyperostosis and Osteosclerosis
  biological_scale: TISSUE
  description: >-
    The proliferative bone response, and the feature that separates SAPHO from purely
    lytic sterile osteitis. Histologically the lesion evolves from an acute inflammatory
    infiltrate to marrow fibrosis and sclerosis of the bone trabeculae; radiologically it
    produces bone proliferation and hypertrophy of adjacent soft tissue, with a marked
    predilection for the sternum and clavicle and extension to the cervical spine and
    sacroiliac joints.
  biological_processes:
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: INCREASED
  downstream:
  - target: Chronic Relapsing Osteoarticular and Cutaneous Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologically, bone lesions in SAPHO syndrome may present as acute
      inflammatory responses, and as the condition progresses, bone marrow fibrosis and
      significant sclerosis of bone trabeculae may develop"
    explanation: Gives the histological trajectory from acute inflammation to sclerosis that this node describes.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commonly, these bone alterations manifest in the anterior chest wall,
      including the sternum and clavicle, and extend to the cervical vertebrae and
      sacroiliac joints."
    explanation: Establishes the anatomical distribution that makes anterior chest wall involvement the diagnostic clue.

- name: Synovitis
  biological_scale: TISSUE
  description: >-
    Joint inflammation adjacent to affected bone, the S of the acronym. It is grouped
    with osteitis and hyperostosis as a musculoskeletal hallmark rather than treated as a
    separate arthropathy, and adjacent bone proliferation can itself impair joint
    function.
  downstream:
  - target: Chronic Relapsing Osteoarticular and Cutaneous Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34967407
    reference_title: SAPHO syndrome and pustulotic arthro-osteitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Musculoskeletal manifestations, including osteitis, synovitis, and
      hyperostosis, are the hallmarks of the SAPHO syndrome and affect a variety of
      regions of the body."
    explanation: Establishes synovitis as one of the three musculoskeletal hallmarks.

- name: Neutrophilic Skin Inflammation
  biological_scale: TISSUE
  description: >-
    The cutaneous arm, and the half of the syndrome that is often what brings a patient
    to attention. Lesions are neutrophilic - dermatoses characterised by neutrophilic
    pseudoabscesses - and the dominant forms are palmoplantar pustulosis and severe acne.
    Which of the two predominates is population-dependent rather than intrinsic to the
    disease. Skin lesions may precede, accompany or follow the skeletal ones, and can be
    absent altogether.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Chronic Relapsing Osteoarticular and Cutaneous Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23153960
    reference_title: The SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SAHPO acronym identifies a syndrome encompassing a variety of
      osteoarticular disorders that are frequently accompanied by dermatoses
      characterized by neutrophilic pseudoabscesses, but can also occur in isolation."
    explanation: >-
      Establishes the neutrophilic character of the dermatoses, and records that the
      osteoarticular disease can occur without them.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dermatological manifestations of SAPHO syndrome vary, with the most
      prevalent being severe acne and pustular eczema, especially palmoplantar
      pustulosis."
    explanation: Names the two dominant cutaneous forms.

- name: Chronic Relapsing Osteoarticular and Cutaneous Disease
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. The course is chronic and relapsing rather than monophasic or
    steadily progressive, and both the skeletal and dermatological arms are frequently
    the most debilitating features. Systemic inflammation adds constitutional symptoms -
    fever, weight loss, fatigue - and management is multidisciplinary because no single
    specialty sees the whole syndrome.
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other clinical findings include constitutional symptoms caused by systemic
      inflammation, such as fever, weight loss, and fatigue."
    explanation: Documents the systemic component of the clinical endpoint.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course of SAPHO syndrome is often chronic and relapsing,
      significantly impacting patients"
    explanation: Establishes the chronic relapsing course that names this node.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_autoinflammatory_cytokine_model
  hypothesis_label: Canonical Autoinflammatory Cytokine Model
  status: CANONICAL
  description: >-
    SAPHO arises from dysregulated innate immunity in a genetically predisposed host:
    neutrophil hyperactivity and excess IL-1 drive a self-amplifying TNF-alpha / IL-1beta
    / IL-6 / IL-8 / IL-23-IL-17 network that produces sterile osteitis, disordered bone
    remodelling and neutrophilic skin disease. The model is supported by the cytokine
    profile and by the therapeutic response to IL-1 and TNF blockade; its weakest point
    is that the predisposition itself has no identified genetic basis, so the model
    explains the amplification without explaining the initiation.
  evidence:
  - reference: PMID:37889264
    reference_title: "SAPHO syndrome: current clinical, diagnostic and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current evidence suggests that SAPHO results from a complex interplay
      between immune dysregulation, genetic susceptibility, and environmental factors."
    explanation: States the three-factor model this hypothesis group formalises.
  - reference: PMID:23153960
    reference_title: The SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that the pathogenesis of SAPHO syndrome is multifactorial,
      but this aspect remains poorly explored, although bacteria and immunological
      dysfunction are hypothesized to play a role."
    explanation: >-
      Supports the multifactorial framing while recording that it remains poorly
      explored, which is why the group is curated as canonical rather than established.

- hypothesis_group_id: emerging_cutibacterium_acnes_trigger_model
  hypothesis_label: Emerging Cutibacterium acnes Trigger Model
  status: EMERGING
  description: >-
    Low-grade intracellular persistence of Cutibacterium acnes in bone cells, rather than
    overt infection, supplies the recurrent NLRP3 inflammasome activation and IL-1beta
    release that drive the syndrome. This would make SAPHO a reactive osteitis in a
    susceptible host and would explain why the organism is culturable from lesions while
    antibiotics produce only transient benefit. It remains unproven: no controlled study
    establishes causation, and recovery of a commensal skin organism from a biopsy is
    equally consistent with contamination.
  evidence:
  - reference: PMID:28499891
    reference_title: "SAPHO, autophagy, IL-1, FoxO1, and Propionibacterium (Cutibacterium) acnes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As several auto-inflammatory bone disorders sharing overproduction of IL-1β
      can mimic SAPHO, this syndrome could partly depend on genetically encoded
      overproduction of IL-1β."
    explanation: >-
      Gives the proposal's own framing - a partial, IL-1beta-centred contribution rather
      than a claim that the organism causes the disease.
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, infection with Propionibacterium acnes is believed to potentially
      trigger inflammatory responses by activating the immune system"
    explanation: >-
      A contemporary review carries the proposal forward, but with hedged language
      ("believed to potentially"), which is the level of confidence curated here.

phenotypes:
- category: Musculoskeletal
  name: Hyperostosis
  description: >-
    Excessive bone formation, classically at the sternoclavicular region. The H of the
    acronym and the feature that most distinguishes SAPHO bone disease from other sterile
    osteitis.
  phenotype_term:
    preferred_term: Hyperostosis
    term:
      id: HP:0100774
      label: Hyperostosis
  evidence:
  - reference: PMID:34967407
    reference_title: SAPHO syndrome and pustulotic arthro-osteitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Musculoskeletal manifestations, including osteitis, synovitis, and
      hyperostosis, are the hallmarks of the SAPHO syndrome and affect a variety of
      regions of the body."
    explanation: Establishes hyperostosis as a hallmark manifestation.

- category: Musculoskeletal
  name: Sterile Osteitis
  description: >-
    Inflammatory bone lesions with the imaging and histological appearance of
    osteomyelitis but no causative organism. Curated with the HPO osteomyelitis term
    because that is what the lesion looks like; the sterility that distinguishes it lives
    in this entry's descriptions and differentials, following the same convention used in
    the Chronic Recurrent Multifocal Osteomyelitis entry.
  phenotype_term:
    preferred_term: Sterile osteitis
    term:
      id: HP:0002754
      label: Osteomyelitis
  evidence:
  - reference: PMID:38151265
    reference_title: "Treatment and monitoring of SAPHO syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosing SAPHO relies on the presence of clinical features (including
      sterile bone inflammation, arthritis, inflammatory skin disease) and the exclusion
      of differential diagnoses (such as infections, tumours, Langerhans cell
      histiocytosis)"
    explanation: Names sterile bone inflammation as a defining clinical feature.

- category: Musculoskeletal
  name: Synovitis
  description: >-
    Inflammation of the synovial membrane producing joint pain and swelling, the S of the
    acronym.
  phenotype_term:
    preferred_term: Synovitis
    term:
      id: HP:0100769
      label: Synovitis
  evidence:
  - reference: PMID:34967407
    reference_title: SAPHO syndrome and pustulotic arthro-osteitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Musculoskeletal manifestations, including osteitis, synovitis, and
      hyperostosis, are the hallmarks of the SAPHO syndrome and affect a variety of
      regions of the body."
    explanation: Establishes synovitis as a hallmark manifestation.

- category: Musculoskeletal
  name: Bone Pain
  description: >-
    Chronic pain in the affected bones, most often the anterior chest wall. It is the
    symptom treatment is aimed at, since no therapy is disease-modifying.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
    temporality: CHRONIC
  evidence:
  - reference: PMID:39286247
    reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal symptoms typically include pain and swelling in the anterior chest
      wall and chronic pain, often associated with bone proliferation and inflammation
      near joints."
    explanation: Documents chronic bone pain and its anterior chest wall distribution.

- category: Musculoskeletal
  name: Sacroiliac Arthritis
  description: >-
    Axial involvement extending to the sacroiliac joints, part of the spondyloarthritis-like
    distribution of the skeletal disease.
  phenotype_term:

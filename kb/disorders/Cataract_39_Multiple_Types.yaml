name: Cataract 39, Multiple Types
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT39
- cataract 39, multiple types
- CRYGB-related cataract
- gamma-B crystallin cataract
description: >-
  Non-syndromic congenital cataract attributed to heterozygous variants in
  CRYGB, which encodes gamma-B crystallin, one of the monomeric beta-gamma
  crystallins of lens fiber cells. The human evidence is thin: the entity rests
  on one three-generation Kuwaiti family in which a frameshifting exon 2
  deletion (g.167delC) was found in relatives with anterior polar cataract, an
  intron 1 deletion (g.67delG) in relatives with lamellar cataract, and both
  variants in a compound heterozygote with complete cataract. A curation of
  crystallin genes under ClinGen methods scored CRYGB as having only limited
  support, with the experimental evidence rather than the clinical evidence
  carrying it. That experimental evidence comes from mouse Crygb mutants. A
  truncating allele (Crygb nop) forms intranuclear amyloid-like inclusions in
  primary lens fiber cells; a missense allele (I4F, Clapper) is destabilized
  and binds alpha-crystallin into high-molecular-weight complexes, producing a
  lamellar cataract; and the S11R allele forms disulfide-crosslinked aggregates
  at fiber cell membranes, with loss of F-actin, raised lens calcium,
  crystallin degradation and degeneration of inner fiber cells, producing a
  dense nuclear cataract. Management is surgical lens extraction.

inheritance:
- name: Autosomal Dominant
  description: >-
    In the single reported family, each heterozygous CRYGB variant was passed
    from an affected grandparent through the pedigree with cataract; an infant
    carrying the intronic variant had no cataract at the time of examination.
    One member who inherited both variants had a more severe, complete
    cataract.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CRYGA, CRYGC, and CRYGD genes were mutation free in all of the family members. However, CRYGB revealed two novel mutations in the affected family members, with an autosomal dominant mode of inheritance."
    explanation: Dominant transmission of each CRYGB variant in the Kuwaiti family.
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An infant (III-3) who was found to have the same mutation has not yet shown any characteristic symptoms of cataracts, most likely due to the age factor."
    explanation: One young carrier without cataract, so penetrance in this family is not demonstrably complete.
pathophysiology:
- name: CRYGB Pathogenic Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Reported human alleles are a heterozygous single-base deletion in exon 2
    (g.167delC) that shifts the reading frame and truncates the protein, and a
    heterozygous single-base deletion in intron 1 (g.67delG) whose effect on
    splicing was not tested. Mouse alleles that cause dominant cataract are a
    truncation of the fourth Greek key motif (Crygb nop) and the missense
    changes I4F and S11R.
  genes:
  - preferred_term: CRYGB
    term:
      id: hgnc:2409
      label: CRYGB
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: ABNORMAL
    description: >-
      Mutant gamma-B crystallin is still made in the mouse alleles but
      misfolds or aggregates, so its structural role is altered qualitatively
      rather than simply reduced.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations included a heterozygous g.67delG, intron 1 deletion in four of the affected family members with lamellar cataracts and a heterozygous g.167delC, exon 2 deletion inherited from the Egyptian grandmother by her granddaughter, resulting in anterior polar cataracts."
    explanation: The two human CRYGB alleles and the phenotypes of their carriers.
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant protein is expected to contain the first 24 amino acids of the wild-type protein, and the subsequent deletion results in a frame shift, generating 19 nonconserved amino acids before translation termination"
    explanation: The exon 2 deletion is predicted to truncate gamma-B crystallin after 24 native residues.
  - reference: PMID:9782080
    reference_title: "Three murine cataract mutants (Cat2) are defective in different gamma-crystallin genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant allele Crygbnop (formerly Cat2(nop)) is caused by a replacement of 11 bp by 4 bp in the third exon of Crygb"
    explanation: The mouse nop allele is a Crygb mutation causing cataract.
  downstream:

    member who inherited both CRYGB variants had complete cataract. It is bound
    to the general congenital cataract term because an OLS4 search of HPO for
    "total cataract" returned no terms and "complete cataract" returned no
    cataract term.
  phenotype_term:
    preferred_term: Congenital complete cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another patient with complete cataracts was a compound heterozygote with both of the above-mentioned mutations."
    explanation: Complete cataract in the compound heterozygote.
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is the first to report complex heterogeneous mutations in the CRYGB gene resulting in ADCC with three distinct phenotypes (lamellar, anterior polar, and complete cataracts) in the same family."
    explanation: All three phenotypes were autosomal dominant congenital cataract.

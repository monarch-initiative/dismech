genetic:
- name: CRYGB
  gene_term:
    preferred_term: CRYGB
    term:
      id: hgnc:2409
      label: CRYGB
  association: Reported causative; evidence limited to one family
  notes: >-
    relationship_type is left unset on purpose. CAUSATIVE in this schema means
    a Definitive or Strong gene-disease relationship, and a 2026 curation of
    crystallin genes using ClinGen methods (PMID:42091610) scored CRYGB as
    Limited, noting that the clinical evidence alone did not reach a disease
    relationship. That curation is not a ClinGen expert panel assertion, so no
    gene_disease_validity record is copied. Reported human alleles: g.167delC
    (exon 2, frameshift) and g.67delG (intron 1), numbered from the first ATG
    in the source; no HGVS transcript nomenclature is given there. Two CRYGB
    missense variants (p.I111L, p.R15H) were reported in a whole-exome study of
    adult-onset posterior polar cataract (PMID:41669784) without segregation
    data, and the promoter variant rs2289917 (c.-47T>C) has been reported as
    associated with congenital cataract in Indian cohorts (PMID:41581034);
    neither is treated here as a Mendelian CTRCT39 allele.
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is the first to report a mutation in the human CRYGB gene."
    explanation: Founding report of human CRYGB cataract.
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither of these mutations was detected in 50 healthy subjects, including the unaffected family members."
    explanation: Variants absent from unaffected relatives and 50 controls.
  - reference: PMID:42091610
    reference_title: "Evaluating gene-disease relationship strength in crystallin genes in association with pediatric cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two genes (CRYGA, CRYGS) as Moderate; and four genes have Limited support (CRYBA2, CRYBA4, CRYBB3 and CRYGB)."
    explanation: Gene curation scoring CRYGB as Limited for autosomal dominant pediatric cataract.
  - reference: PMID:41868570
    reference_title: "Candidate Genes for Non-Syndromic Pediatric Cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While two studies report a possible association of heterozygous CRYGB variants with pediatric cataracts, their causal relationship remains inconclusive"
    explanation: Review judging the human CRYGB evidence inconclusive and the mouse evidence supportive.
animal_models:
- name: Crygb nop mouse
  species: Mouse
  genotype: Crygb nop (11-bp to 4-bp replacement in exon 3, truncating the fourth Greek key motif)
  publication: PMID:9782080
  modeled_mechanisms:
  - target: Intranuclear Gamma-B Crystallin Inclusions in Primary Fiber Cells
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Mutant protein forms amyloid-like intranuclear inclusions in primary fiber cells before cataract appears.
    limitations: >-
      The nop allele truncates the fourth Greek key motif, whereas the human
      exon 2 frameshift truncates after 24 native residues; whether the human
      allele forms such inclusions is unknown.
    evidence:
    - reference: PMID:12426373
      reference_title: "Altered aggregation properties of mutant gamma-crystallins cause inherited cataract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In three different inherited murine cataracts involving this type of gamma-crystallin mutation, large inclusions containing the altered gamma-crystallins were found in the nuclei of the primary lens fibre cells."
      explanation: Inclusions documented in nop lenses.
- name: Clapper (Crygb I4F) mouse
  species: Mouse
  genotype: ENU-induced Crygb missense allele replacing isoleucine 4 with phenylalanine (I4F), heterozygous and homozygous
  publication: PMID:15878859
  modeled_mechanisms:
  - target: Lens Fiber Protein Aggregates and Enlarged Interfiber Spaces
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Dominant lamellar cataract with protein aggregates and enlarged interfiber spaces.
    limitations: >-
      The cataract regresses as the mice age, and no human I4F allele has been
      reported.
    evidence:
    - reference: PMID:15878859
      reference_title: "Crystallin {gamma}B-I4F mutant protein binds to {alpha}-crystallin and affects lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The cataractous lens opacity decreases as the mice age."
      explanation: Lamellar opacity that lessens with age in Clapper mice.
- name: Crygb S11R mouse
  species: Mouse
  genotype: Crygb p.S11R point mutation, heterozygous and homozygous
  publication: PMID:18172107
  modeled_mechanisms:
  - target: Membrane-Associated Gamma-Crystallin Aggregates in Inner Fiber Cells
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Gamma-crystallin aggregates at inner fiber boundaries, loss of F-actin, raised calcium and dense nuclear cataract.
    limitations: >-
      Homozygotes have a dense nuclear cataract but heterozygotes only a hazy
      nuclear region, and no human S11R allele or human nuclear CRYGB cataract
      has been reported.
    evidence:
    - reference: PMID:35726360
      reference_title: "Oxidation of active cysteines mediates protein aggregation of S10R, the cataract-associated mutant of mouse GammaB-crystallin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Homozygous lenses showed a dense nuclear opacity while the heterozygous lenses showed only a hazy nuclear region."
      explanation: Dose-dependent severity in S11R mice, as summarized in a later paper.
- name: Crygb S11R mouse with Gja8 Cx46 knock-in
  species: Mouse
  genotype: CrygbS11R/S11R; Gja8 tm1(Gja3)Tww knock-in (alpha3 connexin expressed from the alpha8 locus)
  publication: PMID:20844585
  modeled_mechanisms:
  - target: Raised Lens Fiber Cell Calcium
    relationship: RESCUES
    fidelity: UNKNOWN
    description: >-
      Homozygous knock-in of alpha3 connexin (Cx46) prevents the nuclear
      cataract of S11R mice and keeps lens calcium, F-actin and crystallins
      normal.
    limitations: >-
      A genetic rescue in mice; no pharmacological or human counterpart
      exists.
    evidence:
    - reference: PMID:20844585
      reference_title: "Connexin mediated cataract prevention in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cataract prevention was correlated with the suppression of many pathological processes, including crystallin degradation and fiber cell degeneration, as well as preservation of normal calcium levels and stable actin filaments in the lens."
      explanation: Cx46 knock-in normalizes calcium and downstream changes.
  - target: Lens Light Scattering and Loss of Transparency
    relationship: RESCUES
    fidelity: UNKNOWN
    description: Homozygous Cx46 knock-in fully prevents the S11R nuclear cataract.
    limitations: A genetic rescue in mice only.
    evidence:
    - reference: PMID:20844585
      reference_title: "Connexin mediated cataract prevention in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Remarkably, homozygous knock-in α8(Kiα3/Kiα3) mice fully prevented nuclear cataracts, while single knock-in α8(Kiα3/-) allele mice showed variable suppression of nuclear opacities in CrygbS11R/S11R mutant mice."
      explanation: Prevention of cataract by Cx46 knock-in.
diagnosis:
- name: Molecular genetic testing of CRYGB
  description: >-
    Clinical appearance does not distinguish CRYGB cataract from other
    inherited cataracts. The reported family was identified by genome-wide
    linkage followed by sequencing of the gamma-crystallin gene cluster, and
    CRYGB is included on commercial congenital cataract gene panels.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the CRYGA, B, C, and D genes revealed two novel heterozygous deletions and one trinucleotide polymorphism in the CRYGB gene."
    explanation: >-
      Sequencing of the gamma-crystallin genes is how the CRYGB variants were
      found in the reported family; this supports gene sequencing as the
      diagnostic route, not a clinical diagnostic protocol.
treatments:
- name: Cataract Surgery
  description: >-
    Removal of the opacified lens is the management of visually significant
    congenital cataract; nearly all affected members of the reported family
    had surgery early in life. No CRYGB-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:23288985
    reference_title: "Novel crystallin gamma B mutations in a Kuwaiti family with autosomal dominant congenital cataracts reveal genetic and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, these studies could not be performed in this family because all of the affected family members (except I-1) underwent surgery at an early age, and their lens tissues were not preserved."
    explanation: Affected family members were treated surgically early in life.
discussions:
- discussion_id: crygb_mouse_to_human_allele_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the human CRYGB alleles act through the misfolding and aggregation
    mechanisms shown for the mouse Crygb nop, I4F and S11R alleles?
  attaches_to:
  - pathophysiology#Gamma-B Crystallin Misfolding and Destabilization
  - pathophysiology#Cysteine Oxidation and Disulfide Crosslinking of Gamma-B Crystallin
  rationale: >-
    Every mechanistic step in this entry comes from mouse alleles that truncate
    the fourth Greek key motif or change residues 4 or 11, whereas the only
    human coding allele is a frameshift that leaves 24 native residues and the
    other is intronic. A product that short may be degraded rather than
    aggregate, in which case the human disease would not share the
    aggregation chain, and no human CRYGB variant protein has been expressed
    or tested.
- discussion_id: crygb_intron1_splicing_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the CRYGB intron 1 deletion g.67delG alter splicing, and is it the
    cause of lamellar cataract in the family that carries it?
  attaches_to:
  - genetic#CRYGB
  - phenotypes#Lamellar cataract
  rationale: >-
    The variant lies 27 bp from a splice acceptor and its effect was only
    predicted; lens tissue from operated relatives was not kept, no minigene
    or RNA study was reported, and the linkage evidence for the family reached
    a LOD of about 1.5. The gene-disease relationship rests largely on this
    one family.
notes: >-
  No GeneReviews chapter covers CRYGB-related cataract. Only one family with
  human CRYGB variants has been described, so phenotype frequencies, prevalence
  and genotype-phenotype rules cannot be stated; the intron 1 variant's effect
  on splicing was never tested because operated lens tissue was not kept. The
  mechanistic chain rests on mouse Crygb alleles (nop, I4F, S11R) that differ
  from the human alleles, and its nuclear-cataract branch has no human
  counterpart yet.

progression:
  - phase: Infantile onset and rapid neurodegeneration
    notes: >-
      Reported children are normal at birth and for the first weeks to months, then
      fail to acquire or lose milestones, develop seizures between two and five
      months, and deteriorate progressively with spasticity. Death has been reported
      between eleven months and five years.
    evidence:
    - reference: PMID:28356563

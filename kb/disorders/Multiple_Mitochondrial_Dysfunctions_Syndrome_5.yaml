differential_diagnoses:
- name: Multiple mitochondrial dysfunctions syndrome 4 (ISCA2)
  description: The paralogue ISCA2 causes an overlapping infantile leukoencephalopathy with regression, optic atrophy and nystagmus; the two proteins act in the same assembly complex and are separated only by sequencing.
  disease_term:

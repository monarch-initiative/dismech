pathophysiology:
- name: Biallelic ISCA1 Loss of Function
  description: >
    Pathogenic variants reduce ISCA1 protein through defective mitochondrial import and
    instability (p.Val10Gly) or destabilise its bound [2Fe-2S] cluster (p.Tyr101Cys); the
    founder p.Glu87Lys is predicted to compromise protein stability and function. ISCA1
    interacts with both ISCA2 and NFU1, which do not interact with each other, and promotes a
    transient ISCA1-ISCA2-NFU1 ternary complex.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: iron-sulfur cluster binding and transfer
    term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    modifier: DECREASED
  downstream:
  - target: Failure of ISCA1-ISCA2 4Fe-4S Cluster Assembly and Transfer to NFU1
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, the ISCA1 p.V10G mutant protein only partially complemented the defects, closely resembling the biochemical phenotypes observed for ISCA1 patient fibroblasts."
      explanation: The patient allele fails to support [4Fe-4S] protein biogenesis.
  evidence:
  - reference: PMID:33711344
    reference_title: "ISCA1 Orchestrates ISCA2 and NFU1 in the Maturation of Human Mitochondrial [4Fe-4S] Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that ISCA1 is the key player of the"
    explanation: Establishes ISCA1's central role in the pathway that the variants disrupt.
  - reference: PMID:32092383
    reference_title: "Expanding the phenotype of mitochondrial disease: Novel pathogenic variant in ISCA1 leading to instability of the iron-sulfur cluster in the protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression and purification of the human ISCA1 showed a decreased stability of the"
    explanation: Cluster instability in a patient allele.
- name: Failure of ISCA1-ISCA2 4Fe-4S Cluster Assembly and Transfer to NFU1
  description: >
    [4Fe-4S] clusters are formed on the ISCA1-ISCA2 complex by reductive fusion of two
    GLRX5-donated [2Fe-2S] clusters, with IBA57 and electrons from ferredoxin FDX2; ISCA1
    then drives transfer of the assembled cluster to a site formed with NFU1, making it
    available to NFU1-dependent apoproteins such as lipoic acid synthase. Loss of ISCA1
    blocks this late step while sparing [2Fe-2S] proteins.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  downstream:
  - target: Lipoic Acid Synthase Deficiency and Loss of Protein Lipoylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we describe a patient with a severe early onset leukodystrophy, multiple defects of respiratory complexes and a severe impairment of lipoic acid synthesis."
      explanation: Lipoic acid synthesis fails with ISCA1 loss.
  - target: Respiratory Chain Complex I and II Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32092383
      reference_title: "Expanding the phenotype of mitochondrial disease: Novel pathogenic variant in ISCA1 leading to instability of the iron-sulfur cluster in the protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biochemical analysis of patient fibroblasts revealed impaired lipoic acid synthesis and decreased activities of complex I and II of respiratory chain."
      explanation: Complex I and II deficiency in patient fibroblasts.
  evidence:
  - reference: PMID:32817474
    reference_title: "Mitochondrial [4Fe-4S] protein assembly involves reductive [2Fe-2S] cluster fusion on ISCA1-ISCA2 by electron flow from ferredoxin FDX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The process required all components known from in vivo studies (i.e., ISCA1-ISCA2-IBA57), yet surprisingly also depended on mitochondrial ferredoxin FDX2 and its NADPH-coupled reductase FDXR. Electrons from FDX2 catalyze the reductive"
    explanation: Reconstituted mechanism of the ISCA1-dependent assembly step.
  - reference: PMID:33711344
    reference_title: "ISCA1 Orchestrates ISCA2 and NFU1 in the Maturation of Human Mitochondrial [4Fe-4S] Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ISCA1 works as the promoter of the interaction between ISCA2 and NFU1 being able to determine the formation of a transient ISCA1-ISCA2-NFU1 ternary complex."
    explanation: ISCA1's bridging role to NFU1.
  - reference: PMID:32776106
    reference_title: "Assembly of the [4Fe-4S] cluster of NFU1 requires the coordinated donation of two [2Fe-2S] clusters from the scaffold proteins, ISCU2 and ISCA1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this work, using genetic and biochemical approaches, we identified the initial scaffold protein, mitochondrial ISCU (ISCU2) and the secondary carrier, ISCA1, as the direct donors of Fe-S clusters to mitochondrial NFU1"
    explanation: ISCA1 as a direct cluster donor to NFU1.
- name: Lipoic Acid Synthase Deficiency and Loss of Protein Lipoylation
  description: >
    The [4Fe-4S] radical-SAM enzyme lipoic acid synthase cannot be matured, so the E2
    subunits of the 2-oxoacid dehydrogenases and the glycine cleavage H protein are not
    lipoylated; patient fibroblasts show severely impaired lipoic acid synthesis.
  biological_scale: MOLECULAR
  molecular_functions:

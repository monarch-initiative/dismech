name: Multiple Mitochondrial Dysfunctions Syndrome 5
category: Genetic
creation_date: "2026-09-05T00:00:00Z"
synonyms:
- MMDS5
- ISCA1-related multiple mitochondrial dysfunctions syndrome
- ISCA1-MMDS
- ISCA1 deficiency
description: >-
  Multiple mitochondrial dysfunctions syndrome 5 (MMDS5; OMIM #617613) is an
  autosomal recessive infantile neurodegenerative disorder caused by biallelic
  loss-of-function variants in ISCA1, the A-type carrier protein that mediates the
  late, [4Fe-4S]-generating step of mitochondrial iron-sulfur cluster biogenesis.
  Losing that step does not disable one enzyme but a whole client class: the
  respiratory complexes that carry [4Fe-4S] cofactors (complex I and complex II)
  and lipoic acid synthase, itself a [4Fe-4S] enzyme. The result is a severe
  leukodystrophy with either no attainment of developmental milestones or very
  early loss of them, infantile seizures, spasticity, nystagmus and lactic
  acidosis, with death usually in early childhood.

  MMDS5 sits in a series of disorders that share this final common lesion -
  MMDS1 (NFU1), MMDS2 (BOLA3), MMDS3 (IBA57) and MMDS4 (ISCA2) - and the reported
  phenotype is described by its discoverers as similar to all four. It is
  nevertheless curated as its own entry rather than as a subtype, because the
  molecular lesion is a distinct, non-redundant node of the pathway (ISCA1 is
  required for [4Fe-4S] biogenesis where ISCA2 is not, in the same knockdown
  experiment) and because neuronal migrational abnormality, reported in both
  children of the index family, had not been described in the other MMDS
  subtypes.

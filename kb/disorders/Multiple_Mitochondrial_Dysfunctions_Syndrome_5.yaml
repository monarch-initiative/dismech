    snippet: "Three proteins ISCA1, ISCA2 and NFU1 were shown to be implicated in the assembly of"
    explanation: Shared pathway of the paralogues.
- name: Other multiple mitochondrial dysfunctions syndromes and lipoylation defects
  description: NFU1, BOLA3, IBA57 and LIAS/LIPT deficiencies share lactic acidosis, hyperglycinemia and combined PDH/complex I-II deficiency with early leukoencephalopathy.
  distinguishing_features:
  - Pulmonary hypertension (MMDS1) or cardiomyopathy (MMDS2)
  - Preserved complex I/II in isolated LIAS deficiency
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably the phenotype observed in all affected subjects with the ISCA1 pathogenic variant is similar to that previously described in all four types of MMDS."
    explanation: Phenotypic overlap across the series.
  - reference: PMID:34440194
    reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite certain specific clinical elements such as pulmonary hypertension or dilated cardiomyopathy in MMDS type 1 or 2, respectively, nearly all of the patients with MMDS presented with severe and early onset leukoencephalopathy."
    explanation: Systematic review giving the shared leukoencephalopathy core and the type-specific discriminators.
animal_models:
- name: Neuron-specific Isca1 knockout rat
  species: Rat
  genotype: Isca1 flox/flox; NeuN-Cre (neuron-specific conditional knockout)
  publication: PMID:37140997
  description: >
    Rats lacking neuronal Isca1 show developmental retardation, epilepsy, memory impairment,
    massive neuronal death by oncosis, loss of Nissl bodies and dendritic spines,
    mitochondrial fragmentation with cristae fracture, reduced respiratory chain complex
    protein and ATP; they survive to about 8 weeks, extending the window for treatment studies.
  modeled_mechanisms:
  - target: Bioenergetic Failure and Neuronal Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Neuronal energy failure, neuronal death and neurological phenotypes after neuronal Isca1 loss.
    limitations: >-
      Neuron-restricted deletion spares oligodendrocytes and other tissues, so the human
      leukodystrophy and cortical migration abnormality are only partly represented, and
      survival to 8 weeks exceeds that of the most severe human alleles.
    readouts:
    - name: Neuronal survival, Nissl bodies and dendritic spines
      target: Bioenergetic Failure and Neuronal Death
      direction: DECREASED
      interpretation: Structural readout of neuronal death.
      evidence:
      - reference: PMID:37140997
        reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "massive neuronal death, reduced number of Nissl bodies and dendritic spines, mitochondrial fragmentation, cristae fracture, reduced content of respiratory chain complex protein, and reduced production of ATP. Isca1 knockout caused neuronal oncosis."
        explanation: Reports the histological and biochemical readouts.
    evidence:
    - reference: PMID:37140997
      reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, compared with human MMDS5, the rat model can survive up to 8 weeks of age, effectively extending the window of clinical treatment research"
      explanation: Authors' assessment of the model's relevance and limitations.
- name: Myocardium-specific Isca1 knockout rat
  species: Rat
  genotype: Isca1 flox/flox; alpha-MHC-Cre (homozygous) and heterozygous myocardial knockout
  publication: PMID:35304126
  description: >
    Cardiomyocyte Isca1 loss causes mitochondrial damage, iron metabolism disorder involving
    the ISCA1-interacting protein STEAP3, myocardial oncosis, heart failure and death;
    heterozygous myocardial knockouts develop dilated cardiomyopathy with reduced complex I,
    II and IV activity and impaired ATP production.
  modeled_mechanisms:
  - target: Respiratory Chain Complex I and II Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Respiratory chain complex and ATP deficits in Isca1-deficient myocardium.
    limitations: >-
      Cardiomyopathy is not a described feature of human ISCA1 deficiency, so the cardiac
      model reports the biochemical defect rather than a human organ phenotype.
    readouts:
    - name: Myocardial respiratory chain complex activity and ATP
      target: Respiratory Chain Complex I and II Deficiency
      direction: DECREASED
      interpretation: Enzymatic readout of the Fe-S maturation defect in heart.
      evidence:
      - reference: PMID:34977489
        reference_title: "Novel rat model of multiple mitochondrial dysfunction syndromes (MMDS) complicated with cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Meanwhile, HET rats exhibited typical MMDS characteristics, including damaged mitochondrial morphology and enzyme activity for mitochondrial respiratory chain complexes Ⅰ, Ⅱ and Ⅳ, and impaired ATP production."
        explanation: Reports the enzymatic readout.
    evidence:
    - reference: PMID:35304126
      reference_title: "Myocardium-specific Isca1 knockout causes iron metabolism disorder and myocardial oncosis in rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, forward and reverse validation experiments demonstrated that six-transmembrane epithelial antigen of prostate 3 (STEAP3), a new interacting molecule for ISCA1, plays an important role in iron metabolism and energy generation impairment induced by ISCA1 deficiency."
      explanation: Mechanistic finding from the cardiac model.
- name: Constitutive Isca1 knockout rat
  species: Rat
  genotype: Isca1 exon 1 replaced by mCherry-Cre (constitutive null)
  publication: PMID:31016283
  description: Constitutive deletion causes abnormal development at embryonic day 8.5 with early embryonic death, decreased NDUFA9 and increased ACO2 in embryos.
  modeled_mechanisms:
  - target: Biallelic ISCA1 Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Complete loss is embryonic lethal, unlike the hypomorphic human alleles.
    limitations: >-
      Early embryonic lethality prevents any postnatal phenotype; human patients carry
      missense alleles with residual function, so the null does not model the disease course.
    evidence:
    - reference: PMID:31016283
      reference_title: "Knockout of ISCA1 causes early embryonic death in rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ISCA1 knockout resulted in abnormal development at 8.5 days, with a significant decrease of NDUFA9 protein and an increase of aconitase 2 (ACO2) in rat embryos."
      explanation: Embryonic phenotype of the null.

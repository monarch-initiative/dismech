name: Multiple Mitochondrial Dysfunctions Syndrome 5
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- MMDS5
- ISCA1 deficiency
- ISCA1-related multiple mitochondrial dysfunctions syndrome
- ISCA1-MMDS
description: >
  Multiple mitochondrial dysfunctions syndrome 5 (MMDS5; OMIM #617613) is an autosomal
  recessive disorder of mitochondrial iron-sulfur (Fe-S) cluster biogenesis caused by
  biallelic variants in ISCA1, first described in 2017 in two consanguineous Indian families
  homozygous for p.Glu87Lys. ISCA1 is the key organiser of the late [4Fe-4S] maturation step:
  it forms a complex with ISCA2 on which two GLRX5-derived [2Fe-2S] clusters are reductively
  fused, using electrons from ferredoxin FDX2, and it then bridges ISCA2 to NFU1 so that the
  assembled [4Fe-4S] cluster can be handed to NFU1-dependent apoproteins. Loss of ISCA1
  therefore impairs lipoic acid synthase, respiratory chain complexes I and II and other
  [4Fe-4S] enzymes, producing lactic acidosis and reduced lipoylation. Clinically it is a
  severe early-infantile neurodegenerative leukodystrophy: failure to attain or early loss of
  milestones, seizures in early infancy, spasticity with hyperreflexia, nystagmus, risk of
  sensorineural hearing loss, and an MRI pattern of extensive cerebral and cerebellar white
  matter change with ventricular dilatation, pachygyria or other cortical migration
  abnormality, and a lactate peak on spectroscopy; most children die of intercurrent illness
  in early childhood. A milder p.Tyr101Cys case presented with psychomotor regression and
  spastic tetraparesis. Treatment is supportive. Rat models show that constitutive Isca1
  loss is embryonic lethal, neuron-specific loss reproduces developmental delay, epilepsy and
  neuronal oncosis, and myocardial loss causes iron dyshomeostasis and cardiomyopathy.

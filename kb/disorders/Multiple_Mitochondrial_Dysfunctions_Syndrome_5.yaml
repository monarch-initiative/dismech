notes: >
  Curated as a per-gene Disease entry (stub entry_type decision: DISEASE), sibling to MMDS1
  and MMDS2 in this tranche and to the open MMDS4 (ISCA2) PR. The GeneReviews chapter
  (PMID:31580634) is tagged and its Clinical Characteristics were cross-referenced: milestone
  loss, infantile seizures, spasticity with hyperreflexia, nystagmus, sensorineural hearing
  loss, lactate elevation, white matter hyperintensities, ventricular dilatation and
  pachygyria are all curated. Hyperglycinemia is described for the MMDS group but not
  specifically reported in ISCA1 patients, so it is carried in the pathophysiology node
  rather than as a phenotype. Sources: PMID:28356563, PMID:29767723, PMID:32092383
  (patients and biochemistry), PMID:33711344, PMID:32817474, PMID:32776106 (mechanism),
  PMID:37140997, PMID:35304126, PMID:34977489, PMID:31016283 (rat models), PMID:34440194
  (systematic review of the MMDS series). Snippets with bracketed Fe-S notation were trimmed
  because bracketed spans are stripped before matching. The Edison/falcon deep-research
  report completed after the first draft and passed preflight (its OMIM 611006 mention is
  the ISCA1 gene entry, not a rival disease); its reference list was cross-checked and added
  the Lebigot review, while Torraco 2018 (PMID:30113620) has no quotable cached abstract and
  is not cited.

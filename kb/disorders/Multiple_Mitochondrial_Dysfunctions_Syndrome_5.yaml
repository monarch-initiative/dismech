- name: Bioenergetic Failure and Neuronal Death
  description: >
    Energy failure in neurons and oligodendrocytes produces massive neuronal death by
    oncosis, loss of Nissl bodies and dendritic spines, and extensive cerebral and cerebellar
    white matter disease with ventricular dilatation; the cortical migration abnormalities
    (pachygyria) in patients indicate an additional prenatal developmental component.
    Isca1-deficient cardiomyocytes show iron dyshomeostasis and oncosis, an ISCA1-STEAP3
    axis implicated in the cardiac phenotype of the rat model.
  biological_scale: TISSUE

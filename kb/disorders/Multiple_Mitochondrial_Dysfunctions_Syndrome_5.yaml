genetic:
- name: ISCA1
  gene_term:
    preferred_term: ISCA1
    term:
      id: hgnc:28660
      label: ISCA1
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Biallelic ISCA1 variants are the cause. Two alleles are reported: the Indian
    founder c.259G>A p.(Glu87Lys), homozygous in three families sharing a 3.3 Mb
    region of homozygosity on chromosome 9, and c.29T>G p.(Val10Gly) in an
    unrelated Italian patient.
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two independent families, both with two affected children each, with a severe neurodevelopmental disorder associated with a homozygous c.259G>A variant in ISCA1."
    explanation: Establishes the gene-disease relationship with segregation in two families.
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After examining the homozygous regions around the ISCA1 variant in both the probands, generated by the exome sequencing data, we identified only one overlapping region of homozygosity (ROH) spanning 3.3 Mb in chromosome 9 (Chr9: 85613354-88925774) flanking the variant"
    explanation: Supports the founder-allele interpretation of the recurrent variant.
  - reference: PMID:32092383
    reference_title: "Expanding the phenotype of mitochondrial disease: Novel pathogenic variant in ISCA1 leading to instability of the iron-sulfur cluster in the protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient carrying a novel pathogenic variant p.(Tyr101Cys) in ISCA1 leading to MMDS type 5."
    explanation: >-
      A third independent allele, which is what takes the gene-disease relationship
      beyond the single founder haplotype.

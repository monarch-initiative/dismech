genetic:
- name: ISCA1
  gene_term:
    preferred_term: ISCA1
    term:
      id: hgnc:28660
      label: ISCA1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic ISCA1 (9q21.33) variants cause MMDS5. Three homozygous missense alleles are
    reported: p.Glu87Lys (c.259G>A) in two Indian families sharing a region of homozygosity
    consistent with a founder effect, p.Val10Gly (c.29T>G) in the uncleaved mitochondrial
    presequence, which impairs import and stability and dramatically reduces ISCA1 protein,
    and p.Tyr101Cys, which destabilises the [2Fe-2S] cluster on the protein.
  variants:
  - name: c.259G>A (p.Glu87Lys)
    description: Homozygous founder-type missense in two unrelated consanguineous Indian families; predicted detrimental to protein stability and function.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28356563
      reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "variant in ISCA1 and Mendelian segregation was confirmed in both families. The ISCA1 variant lies in the only shared region of homozygosity between the two families suggesting the possibility of a founder effect."
      explanation: Identification and founder evidence.
  - name: c.29T>G (p.Val10Gly)
    description: Homozygous missense in the mitochondrial targeting presequence; severely affects import and stability, leaving very little ISCA1 protein, and only partially complements ISCA1-depleted cells.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense mutation in ISCA1 (c.29T>G; p.V10G) identified by targeted MitoExome sequencing resulted in dramatic reduction of ISCA1 protein level. The mutation located in the uncleaved presequence severely affected both mitochondrial import and stability of ISCA1."
      explanation: Functional consequence of the presequence variant.
  - name: p.Tyr101Cys
    description: Novel homozygous variant in a patient with psychomotor regression and spastic tetraparesis; the purified mutant protein shows decreased stability of its [2Fe-2S] cluster.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32092383
      reference_title: "Expanding the phenotype of mitochondrial disease: Novel pathogenic variant in ISCA1 leading to instability of the iron-sulfur cluster in the protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression and purification of the human ISCA1 showed a decreased stability of the"
      explanation: Biochemical consequence of the variant.
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest association of a pathogenic variant in ISCA1 with another MMDS."
    explanation: First association of ISCA1 with MMDS.
  - reference: PMID:29767723
    reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, our comprehensive clinical and biochemical investigations show that the ISCA1 p.V10G mutation functionally impaired mitochondrial"
    explanation: Functional confirmation of causality.

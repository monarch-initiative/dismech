    explanation: Neuronal death and neurological phenotypes after neuronal Isca1 loss.
  - reference: PMID:31580634
    reference_title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

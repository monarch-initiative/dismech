      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "P1 and P2 developed seizures at the age of 5 months and 4 months respectively followed by progressive neurological deterioration and spasticity."
      explanation: Documents the onset window and the sequence of seizure then deterioration.
    - reference: PMID:31580634
      reference_title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prognosis is poor and most individuals succumb to an intercurrent illness in early childhood."
      explanation: GeneReviews states the outcome.
pathophysiology:
- name: Biallelic ISCA1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    ISCA1 encodes a 129-amino-acid mitochondrial A-type carrier protein with a
    conserved C-terminal HESB domain. The founder p.(Glu87Lys) substitution sits in
    that domain at a highly conserved residue and abolishes a salt bridge to Lys49,
    destabilizing the protein; the independent p.V10G substitution lies in the
    uncleaved presequence and impairs both mitochondrial import and stability,
    reducing ISCA1 protein to a fraction of normal. Both routes converge on loss of
    functional ISCA1 in the mitochondrial matrix.
  genes:
  - preferred_term: ISCA1
    term:
      id: hgnc:28660
      label: ISCA1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:29767723
    reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation located in the uncleaved presequence severely affected both mitochondrial import and stability of ISCA1."
    explanation: >-
      Identifies the molecular consequence of the p.V10G allele as loss of imported,
      stable ISCA1 protein rather than a catalytic change.
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Analyses of protein stability via I-Mutant (score 7) and Eris web-server (score 0.64 ΔΔG kcal/mol) are also consistent in predicting that this variant leads to destabilization of ISCA1 protein."
    explanation: >-
      Supports destabilization as the mechanism of the founder allele. Graded
      COMPUTATIONAL because the claim rests on in silico stability prediction, not
      on a measurement in patient material.
  downstream:
  - target: Failure of Mitochondrial [4Fe-4S] Cluster Assembly
    causal_link_type: DIRECT
    description: >-
      ISCA1 is one of the two non-redundant A-type proteins that carry out the
      second, [4Fe-4S]-generating step of the pathway.
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, the ISCA1 p.V10G mutant protein only partially complemented the defects, closely resembling the biochemical phenotypes observed for ISCA1 patient fibroblasts."
      explanation: >-
        A complementation experiment: wild-type ISCA1 restores the assembly defect
        and the patient allele does not, which is what makes this an edge rather
        than a correlation between two separately supported nodes.
- name: Failure of Mitochondrial [4Fe-4S] Cluster Assembly
  biological_scale: MOLECULAR
  description: >-
    Mitochondrial Fe-S biogenesis runs in two steps. The core machinery builds a
    [2Fe-2S] cluster and hands it to GRX5; a second, separately staffed step
    converts that into [4Fe-4S] clusters and inserts them into client apoproteins.
    ISCA1 is the organizing node of that second step, interacting with both ISCA2
    and NFU1 (which do not interact with each other) and forming the transient
    ternary complex through which the cluster is handed on. Losing ISCA1 therefore
    stalls maturation of every mitochondrial [4Fe-4S] client at once, which is why
    a single gene defect produces a multi-enzyme phenotype.
  molecular_functions:
  - preferred_term: 4 iron, 4 sulfur cluster binding
    term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:33711344
    reference_title: "ISCA1 Orchestrates ISCA2 and NFU1 in the Maturation of Human Mitochondrial [4Fe-4S] Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ISCA1 works as the promoter of the interaction between ISCA2 and NFU1 being able to determine the formation of a transient ISCA1-ISCA2-NFU1 ternary complex."
    explanation: >-
      NMR structural work establishing why ISCA1 is the non-redundant node of this
      step, which is the reason its loss affects the whole client class.
  - reference: PMID:28492233
    reference_title: "ISCA1 is essential for mitochondrial Fe(4)S(4) biogenesis in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "knockdown experiments in mouse skeletal muscle and in primary cultures of neurons suggest that ISCA1, but not ISCA2, is required for mitochondrial Fe4S4 proteins biogenesis"
    explanation: >-
      Shows the requirement is specific to ISCA1 within the same experiment, which
      is what distinguishes this lesion from the ISCA2 one (MMDS4).
  - reference: PMID:32092383
    reference_title: "Expanding the phenotype of mitochondrial disease: Novel pathogenic variant in ISCA1 leading to instability of the iron-sulfur cluster in the protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analysis of patient fibroblasts revealed impaired lipoic acid synthesis and decreased activities of complex I and II of respiratory chain."
    explanation: >-
      An independent patient, a third allele, and the same paired lesion measured
      in fibroblasts: impaired lipoylation alongside complex I and II deficiency.
      That reproducibility is what makes the two downstream branches a property of
      the gene rather than of one family.
  downstream:
  - target: Respiratory Chain Complex I and II Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we describe a patient with a severe early onset leukodystrophy, multiple defects of respiratory complexes and a severe impairment of lipoic acid synthesis."
      explanation: >-
        Reports the two downstream branches together in the same patient, which is
        what links the assembly failure to the respiratory defect.
  - target: Lipoic Acid Synthase Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29767723
      reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a severe impairment of lipoic acid synthesis"
      explanation: >-
        Names the second client branch in the patient carrying the ISCA1 variant.
- name: Respiratory Chain Complex I and II Deficiency
  biological_scale: CELLULAR
  description: >-
    Complex I carries eight [4Fe-4S] clusters and complex II carries one; both
    therefore fail to mature when the late assembly step is lost. Electron flow
    through the respiratory chain falls, oxidative phosphorylation is impaired, and
    pyruvate is shunted to lactate.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
  - preferred_term: mitochondrial electron transport, succinate to ubiquinone
    term:
      id: GO:0006121
      label: mitochondrial electron transport, succinate to ubiquinone
    modifier: DECREASED
  evidence:
  - reference: PMID:29767723
    reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with a severe early onset leukodystrophy, multiple defects of respiratory complexes and a severe impairment of lipoic acid synthesis."
    explanation: >-
      Reports multiple respiratory complex defects in the patient carrying the
      ISCA1 variant.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: DIRECT
  - target: Leukodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sources assert white matter degeneration as the consequence of the respiratory
      defect without identifying the intervening steps, so the edge is typed as
      indirect rather than direct.
- name: Lipoic Acid Synthase Failure
  biological_scale: MOLECULAR
  description: >-
    Lipoic acid synthase is itself a [4Fe-4S] enzyme, so a defect in the assembly
    machinery also removes the cofactor from the enzyme that makes lipoate. Proteins
    that depend on a lipoyl group - pyruvate dehydrogenase, alpha-ketoglutarate
    dehydrogenase, and the glycine cleavage system - lose activity as a second,
    parallel consequence. This is the branch responsible for the non-ketotic
    hyperglycinemia reported across the MMDS series.
  biological_processes:
  - preferred_term: lipoate biosynthetic process
    term:
      id: GO:0009107
      label: lipoate biosynthetic process
    modifier: DECREASED
  - preferred_term: protein lipoylation
    term:
      id: GO:0009249
      label: protein lipoylation
    modifier: DECREASED
  - preferred_term: glycine catabolic process
    term:
      id: GO:0006546
      label: glycine catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:29767723
    reference_title: "ISCA1 mutation in a patient with infantile-onset leukodystrophy causes defects in mitochondrial [4Fe-4S] proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple mitochondrial dysfunction syndromes (MMDS) comprise a group of severe autosomal recessive diseases characterized by impaired respiration and lipoic acid metabolism, resulting in infantile-onset mitochondrial encephalopathy, non-ketotic hyperglycinemia, myopathy, lactic acidosis and early death."
    explanation: >-
      States that impaired lipoic acid metabolism is one of the two defining lesions
      of the MMDS group and names hyperglycinemia as its consequence.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the pyruvate dehydrogenase lipoyl cofactor contributes to lactate
      accumulation alongside the respiratory chain defect.
- name: Leukodystrophy
  biological_scale: TISSUE
  description: >-
    Extensive cerebral and cerebellar deep white matter disease with ventricular
    dilatation is the imaging hallmark, and in the index family was accompanied by
    pachygyria, a neuronal migration abnormality that had not been reported in the
    other MMDS subtypes.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain imaging of both children showed pachygyria, extensive cerebral and cerebellar white matter disease and dilated cerebral ventricles."
    explanation: Documents the imaging phenotype in the index family.
  downstream:
  - target: Progressive Neurological Deterioration
    causal_link_type: DIRECT
- name: Lactic Acidosis
  biological_scale: ORGANISM
  description: >-
    Blood lactate is elevated and an increased lipid-lactate peak is seen on brain
    MR spectroscopy, reflecting the block in oxidative phosphorylation.
  evidence:
  - reference: PMID:31580634
    reference_title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals may also demonstrate elevated blood lactate levels with an elevated lipid-lactate peak on brain MR spectroscopy."
    explanation: GeneReviews records the biochemical finding and its imaging correlate.
- name: Progressive Neurological Deterioration
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the chain: absent or lost milestones, early infantile
    seizures, spasticity with exaggerated reflexes, nystagmus and hearing loss,
    ending in death in early childhood.
  evidence:
  - reference: PMID:31580634
    reference_title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ISCA1-related multiple mitochondrial dysfunctions syndrome (ISCA1-MMDS) is a severe neurodegenerative condition typically characterized by either no attainment of developmental milestones or very early loss of achieved milestones, seizures in early infancy, development of spasticity with exaggerated deep tendon reflexes, nystagmus, and risk for sensorineural hearing loss."
    explanation: >-
      The GeneReviews Clinical Characteristics sentence, used as the phenotype
      baseline for this entry.
  downstream:

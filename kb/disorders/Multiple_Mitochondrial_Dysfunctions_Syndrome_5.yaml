    term:
      id: MONDO:0014611
      label: multiple mitochondrial dysfunctions syndrome 4
  distinguishing_features:
  - Gene identified by sequencing
  - Pachygyria and cortical migration abnormality reported in ISCA1 deficiency
  evidence:

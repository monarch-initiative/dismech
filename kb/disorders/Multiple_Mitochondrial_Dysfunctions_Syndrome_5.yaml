discussions:
- discussion_id: mmds5_cortical_migration_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Bioenergetic Failure and Neuronal Death
  prompt: >
    How does ISCA1 deficiency produce cortical migration abnormalities such as pachygyria,
    a prenatal developmental lesion not typical of the other MMDS forms whose defects are
    biochemically similar?
  rationale: >
    Pachygyria and cortical migrational abnormalities were reported in the founding ISCA1
    families and in GeneReviews, yet the shared lipoate/OXPHOS biochemistry does not explain
    a neuronal migration defect; the constitutive rat null is embryonic lethal and the
    neuron-specific model does not report cortical malformation.
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extensive white matter abnormalities, cortical migrational abnormalities, lactic acidosis and early demise"
    explanation: The unexplained developmental feature.
- discussion_id: mmds5_rat_cardiac_phenotype_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Respiratory Chain Complex I and II Deficiency
  prompt: >
    Do the Isca1 rat models, which show prominent cardiomyopathy and a sex-dependent
    phenotype, predict human ISCA1 deficiency, in which cardiomyopathy has not been
    reported?
  rationale: >
    Myocardial Isca1 knockout rats develop dilated cardiomyopathy and heart failure, whereas
    the small human series describe a purely neurological disorder; whether this reflects
    the short human survival, allele hypomorphy or a species difference is unresolved.
  evidence:
  - reference: PMID:34977489
    reference_title: "Novel rat model of multiple mitochondrial dysfunction syndromes (MMDS) complicated with cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Isca1 HET rats exhibited dilated cardiomyopathy characteristics, including thin-walled ventricles, larger chambers, cardiac dysfunction and myocardium fibrosis."
    explanation: Cardiac phenotype present in the model but not described in patients.
references:
- reference: PMID:31580634
  title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
  tags:

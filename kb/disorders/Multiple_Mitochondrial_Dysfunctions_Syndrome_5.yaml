    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple mitochondrial dysfunction syndromes (MMDS) comprise a group of severe autosomal recessive diseases characterized by impaired respiration and lipoic acid metabolism, resulting in infantile-onset mitochondrial encephalopathy, non-ketotic hyperglycinemia, myopathy, lactic acidosis and early death."
    explanation: Places the lipoic acid defect at the core of the MMDS phenotype.
- name: Combined 2-Oxoacid Dehydrogenase and Glycine Cleavage System Deficiency
  description: >
    Loss of lipoylation inactivates pyruvate dehydrogenase and the other 2-oxoacid
    dehydrogenases, producing lactic acidosis with a lipid-lactate peak on brain MR
    spectroscopy, and inactivates the glycine cleavage system; hyperglycinemia is part of
    the shared MMDS biochemistry although lactate elevation is the reported marker in
    ISCA1 patients.
  biological_scale: CELLULAR

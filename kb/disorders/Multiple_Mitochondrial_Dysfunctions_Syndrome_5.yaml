animal_models:
- name: Neuron-specific Isca1 knockout rat
  species: Rat
  genotype: Isca1 flox/flox; NeuN-Cre (neuron-specific conditional knockout)
  publication: PMID:37140997
  description: >-
    A CRISPR-Cas9 conditional knockout restricting Isca1 loss to neurons. It is the
    only in vivo model of this disorder, and it was built specifically to model
    MMDS5 rather than repurposed from another question.
  modeled_mechanisms:
  - target: Respiratory Chain Complex I and II Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The knockout reproduces the biochemical lesion: reduced respiratory chain
      complex protein and reduced ATP production, with mitochondrial fragmentation
      and cristae fracture on electron microscopy.
    limitations: >-
      Neuron-restricted rather than constitutive, so it cannot report the systemic
      consequences of the lesion, and it does not distinguish complex I from complex
      II involvement the way the human fibroblast assays do.
    readouts:
    - name: Respiratory chain complex protein content and ATP production
      target: Respiratory Chain Complex I and II Deficiency
      direction: DECREASED
      interpretation: >-
        Establishes that neuronal Isca1 loss alone is sufficient for the
        bioenergetic defect.
      evidence:
      - reference: PMID:37140997
        reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mitochondrial fragmentation, cristae fracture, reduced content of respiratory chain complex protein, and reduced production of ATP"
        explanation: Reports the measured bioenergetic and ultrastructural readouts.
    evidence:
    - reference: PMID:37140997
      reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study established the disease model of MMDS5 in the nervous system for the first time"
      explanation: >-
        Establishes the model as purpose-built for this disorder, which is what makes
        it informative for these nodes rather than incidentally relevant.
  - target: Progressive Neurological Deterioration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Developmental retardation, epilepsy and memory impairment reproduce the
      developmental arrest and seizures of the human disease.
    limitations: >-
      The knockout rats survive to about eight weeks, whereas the human disorder is
      fatal in infancy or early childhood, so the model does not reproduce the
      lethality that dominates the human course. The authors present that longer
      survival as an advantage for testing therapy, which it is, but it means the
      model's natural history is not the disease's. The knockout is also neuronal
      only, so the lactic acidosis and hyperglycinemia of the systemic human disease
      are outside what it can report.
    readouts:
    - name: Neuronal death and dendritic spine density
      target: Progressive Neurological Deterioration
      direction: DECREASED
      interpretation: >-
        Massive neuronal death with reduced Nissl bodies and dendritic spines is the
        histological correlate of the human neurodegeneration.
      evidence:
      - reference: PMID:37140997
        reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "massive neuronal death, reduced number of Nissl bodies and dendritic spines"
        explanation: Reports the histological readout behind this link.
    evidence:
    - reference: PMID:37140997
      reference_title: "A neuron-specific Isca1 knockout rat developments multiple mitochondrial dysfunction syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the rats suffered from developmental retardation, epilepsy, memory impairment"
      explanation: >-
        The behavioural phenotype that maps onto the human developmental arrest and
        infantile seizures.
  notes: >-
    The paper reports that Isca1 knockout causes neuronal oncosis specifically,
    rather than apoptosis. That is a mechanistic claim about the mode of cell death
    with no counterpart in the human literature, so it is recorded here rather than
    curated as a pathophysiology node.
diagnosis:
- name: ISCA1 molecular genetic testing
  description: >-
    Diagnosis rests on biallelic pathogenic ISCA1 variants in a proband with
    suggestive clinical and imaging findings; in every reported case the gene was
    reached by exome rather than targeted testing.
  presence: PRESENT
  evidence:
  - reference: PMID:31580634
    reference_title: "ISCA1-Related Multiple Mitochondrial Dysfunctions Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ISCA1-MMDS is established in a proband with suggestive findings and/or biallelic pathogenic variants in ISCA1 identified by molecular genetic testing."
    explanation: GeneReviews states the diagnostic criterion.
differential_diagnoses:
- name: Multiple mitochondrial dysfunctions syndromes 1-4
  description: >-
    MMDS1 (NFU1), MMDS2 (BOLA3), MMDS3 (IBA57) and MMDS4 (ISCA2) share the same
    final lesion in Fe-S cluster biogenesis and a closely similar clinical picture.
    The reported MMDS5 phenotype is described by its discoverers as similar to all
    four, so the differential is settled by the gene rather than by the phenotype.
  evidence:
  - reference: PMID:28356563
    reference_title: "Homozygous p.(Glu87Lys) variant in ISCA1 is associated with a multiple mitochondrial dysfunctions syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably the phenotype observed in all affected subjects with the ISCA1 pathogenic variant is similar to that previously described in all four types of MMDS."
    explanation: >-
      States directly that the phenotypes overlap, which is why the differential
      cannot be made clinically.
discussions:
- discussion_id: isca1_glycine_branch_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has non-ketotic hyperglycinemia actually been measured in a patient with
    biallelic ISCA1 variants, or is it inferred from the shared lipoylation lesion
    in the other MMDS subtypes?
  attaches_to:
  - pathophysiology#Lipoic Acid Synthase Failure
  rationale: >-
    Hyperglycinemia is a defining feature of the MMDS group and follows mechanically
    from loss of the lipoyl-dependent glycine cleavage system, which the ISCA1
    patient's impaired lipoic acid synthesis would predict. But the sources cited
    here report hyperglycinemia as a property of MMDS in general, not as a
    measurement in an ISCA1 patient, and the index families' biochemical
    investigations are described as normal apart from creatine kinase. Curating the
    glycine branch as an established patient finding would therefore overstate the
    evidence, so it is curated as a mechanism node with a gap attached rather than
    as a phenotype.
  proposed_experiments:
  - experiment_id: isca1_glycine_measurement
    name: Plasma and CSF glycine measurement in ISCA1 patients
    description: >-
      Measure plasma and cerebrospinal fluid glycine, and lipoylation of the
      pyruvate dehydrogenase E2 subunit and the glycine cleavage system H protein by
      immunoblot in fibroblasts, in any newly ascertained ISCA1 patient.
    readouts:
    - name: Plasma glycine concentration
      target: pathophysiology#Lipoic Acid Synthase Failure
      direction: INCREASED
      interpretation: >-
        An elevated glycine would confirm the glycine cleavage branch operates in
        ISCA1 disease as it does in the other MMDS subtypes.
- discussion_id: isca1_pachygyria_subtype_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does an ISCA1 defect produce a neuronal migration abnormality when the
    sibling MMDS subtypes, sharing the same final lesion, do not?
  attaches_to:
  - phenotypes#Pachygyria
  rationale: >-
    Pachygyria was seen in both affected children of the index family and the
    authors state it had not previously been described in other MMDS subtypes. If
    that holds up in a larger series it is a genuine mechanistic divergence, since
    migration is a prenatal event and the shared respiratory lesion is not obviously
    developmental. The alternative is ascertainment: four children in one family
    imaged in one centre is a thin base for a claim of subtype specificity, and no
    later report has replicated it.
notes: >-
  Curation decisions worth recording.

  Entry versus subtype. The stub left entry_type UNDECIDED and flagged that the
  neonatal Fe-S-scaffold forms might belong together as one entry with per-gene
  subtypes. This is curated as its own DISEASE on two grounds: ISCA1 is a
  non-redundant node rather than a redundant paralogue of ISCA2 (the same knockdown
  experiment in PMID:28492233 finds ISCA1 required and ISCA2 not), and the reported
  phenotype carries a migration abnormality the authors say the other subtypes lack.
  The counter-argument is real and is recorded in the differential: the discoverers
  themselves say the phenotype resembles all four sibling syndromes. If the project
  later lumps the series, this entry is the ISCA1 subtype.

  The glycine branch is a mechanism node, not a phenotype. See the knowledge gap.
  No source cited here reports a glycine measurement in an ISCA1 patient.

  Frequency bands. With four children in two families plus one unrelated patient,
  band assignment is division over a handful of cases and is not a penetrance
  estimate. OBLIGATE is used where GeneReviews states the feature as definitional;
  OCCASIONAL where GeneReviews hedges ("risk for") or the feature was present in one
  of four.

  Early death is not curated as a phenotype. HP:0003819 (Death in childhood) sits
  outside the branch the PhenotypeTerm dynamic enum expands from, so there is no
  valid binding; the mortality claim and the reported ages at death are carried in
  the progression record instead.

  Deep research. An OpenScientist report is committed with the entry. It added the
  third allele (p.Tyr101Cys, PMID:32092383) and the neuron-specific Isca1 knockout
  rat (PMID:37140997), which is the only in vivo model of this disorder.

  Two of the report's identifiers were wrong and are not used. It gives HGNC:16947
  for ISCA1 in both its header and its genetics section; that code is ERLIN1, and
  ISCA1 is hgnc:28660. Nothing flagged it, because `just validate-research-terms`
  hardcodes --skip-prefix HGNC, so gene identifiers are the one class the report's
  term validation never examines (#9845). It also reports MMDS5 as OMIM #617613,
  which is correct, alongside ISCA1 as OMIM *611006, which belongs to a different
  gene; neither OMIM number is bound here.

  The report's own quote validation reports 7 of 20 quotes unsupported and sets
  needs_review: true. All seven are verbatim. Six fail on iron-sulfur notation
  ([4Fe-4S], [2Fe-2S]) and one on an HGVS designation, all stripped by the snippet
  matcher before comparison. That is #9364 and #10192, and it is why several
  snippets in this entry quote a bracket-free sentence where the bracketed one
  states the mechanism more directly.

  ISCA1 protein-level rescue data (PMID:29767723) are graded IN_VITRO because the
  complementation was done in HeLa cells, even though the same paper reports patient
  fibroblast findings; the patient-material sentences are graded HUMAN_CLINICAL.

- name: Cranial Neural Crest Cell Migration Deficit
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis"
  biological_scale: CELLULAR
  description: >-
    SF3B4-driven splicing dysregulation impairs migration of cranial neural
    crest cells into the pharyngeal arches, leaving too few competent neural
    crest cells to build the first- and second-arch skeletal derivatives. In the
    frog model neural crest induction at the neural plate border is intact, but
    migratory streams are shortened at the migratory stage, identifying
    migration rather than induction as the affected step.

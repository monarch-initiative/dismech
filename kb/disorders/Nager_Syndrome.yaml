discussions:
- discussion_id: nager_frog_dosage_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Cranial Neural Crest Cell Migration Deficit"
  - "pathophysiology#Cranial Neural Crest Cell Apoptosis"
  prompt: >-
    Does the homozygous-null Xenopus (and mouse) sf3b4 phenotype model human
    SF3B4-haploinsufficient Nager syndrome, given that heterozygous animals —
    the dosage state matching the human disease — are phenotypically
    near-normal?
  rationale: >-
    Human Nager syndrome is caused by heterozygous SF3B4 loss-of-function
    (haploinsufficiency). In X. tropicalis and in mouse, heterozygous sf3b4 loss
    produces essentially no craniofacial phenotype, and the disease-relevant
    neural-crest migration deficit and increased apoptosis appear only in
    homozygous nulls, which are not viable. The model therefore recapitulates
    the mechanism only at a gene dosage that does not match the human condition,
    implying species-specific genetic compensation and limiting direct
    translation of the model's dosage-response to human disease.
  proposed_experiments:
  - experiment_id: nager_sensitized_het_assay
    name: Sensitized heterozygous sf3b4 craniofacial-vulnerability assay
    description: >-
      Test whether a second, mild perturbation (partial knockdown of a candidate
      compensating paralog/modifier, or a developmental stressor) unmasks a
      cranial-neural-crest migration/apoptosis phenotype in heterozygous sf3b4
      animals, probing whether human-equivalent haploinsufficiency can be
      modeled in frog or mouse.
  evidence:
  - reference: PMID:40126363
    reference_title: Deletion of sf3b4 causes splicing defects and gene dysregulation that disrupt craniofacial development and survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Whereas in humans SF3B4 haploinsufficiency causes severe craniofacial abnormalities, the lack of an overt craniofacial phenotype in heterozygous mouse and frog embryos could be explained by the activity of other genes that compensate for the loss of sf3b4.
    explanation: States the core human-versus-model gene-dosage mismatch and the genetic-compensation hypothesis behind it.
notes: >-
  Two clinically recognized features are not curated as separate phenotype
  entries for lack of a phenotype-naming exact-quote source: infants frequently
  have feeding difficulties (related to micrognathia and cleft palate, sometimes
  requiring specialized feeding or gastrostomy support), and a
  Robin-sequence-like presentation (micrognathia + glossoptosis + upper airway
  obstruction). Both are captured mechanistically here via the Micrognathia and
  Upper Airway Obstruction nodes. SF3B4 is also allelic with the more severe
  Rodriguez syndrome (acrofacial dysostosis, Rodriguez type; OMIM 201170),
  generally regarded as the severe end of the SF3B4 phenotypic spectrum.

name: Nager Syndrome
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- Nager acrofacial dysostosis
- NAFD
- Acrofacial dysostosis 1, Nager type
- Preaxial acrofacial dysostosis
- Mandibulofacial dysostosis with preaxial limb anomalies
description: >-
  Nager syndrome (Nager acrofacial dysostosis) is the archetypal preaxial
  acrofacial dysostosis, a rare congenital malformation syndrome combining
  mandibulofacial dysostosis with preaxial (radial) limb defects. The
  craniofacial phenotype comprises malar (zygomatic) hypoplasia, micrognathia,
  downslanting palpebral fissures, external ear anomalies with conductive
  hearing loss, and cleft palate; the defining limb phenotype comprises
  thumb hypoplasia or aplasia, radial ray deficiency, and proximal radioulnar
  synostosis. It is the limb involvement that distinguishes Nager syndrome from
  Treacher Collins syndrome, with which the craniofacial features otherwise
  overlap. Nager syndrome is caused in most cases by heterozygous
  loss-of-function variants in SF3B4 (encoding SAP49, a component of the U2
  small nuclear ribonucleoprotein of the major spliceosome), acting through
  haploinsufficiency, and is one of a growing group of craniofacial
  spliceosomopathies. SF3B4 dysfunction preferentially compromises cranial
  neural crest cells, which build the neural-crest-derived skeleton of the
  first and second pharyngeal arches. Inheritance is autosomal dominant, with
  most cases arising de novo, and intellect is typically normal.
category: Mendelian
parents:
- Acrofacial dysostosis

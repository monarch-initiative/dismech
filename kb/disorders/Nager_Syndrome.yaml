    explanation: Establishes haploinsufficiency as the molecular mechanism of SF3B4-related Nager syndrome.
  - reference: PMID:24003905
    reference_title: "Nager syndrome: confirmation of SF3B4 haploinsufficiency as the major cause."
    supports: SUPPORT

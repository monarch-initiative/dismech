- name: Preaxial and Radial Limb Ray Deficiency
  biological_scale: TISSUE
  description: >-
    The feature that sets Nager syndrome apart from Treacher Collins syndrome
    is its preaxial (radial-side) limb involvement. SF3B4 dysfunction disrupts
    development of the radial ray, producing thumb hypoplasia or aplasia, radial
    hypoplasia/aplasia, and proximal radioulnar synostosis. This limb bundle is
    absent from Treacher Collins syndrome, which involves the craniofacial arch
    derivatives only, and is why Nager is classified as an acrofacial (rather
    than purely mandibulofacial) dysostosis. This node is deliberately not
    mapped to the pharyngeal-arch craniofacial module, whose scope is the head
    skeleton. It is also deliberately not mapped to the
    limb_digit_patterning_serial_homology module: that module captures autopod
    digit-number/identity bundles (polydactyly, syndactyly, brachydactyly,
    ectrodactyly) driven by SHH/GLI3/HOXD/IHH patterning-gradient lesions,
    whereas Nager's radial-ray reduction defect is a spliceosomopathy-driven
    hypoplasia of proximal preaxial elements (radius, thumb, proximal radioulnar
    synostosis), a mechanistically distinct process.
  locations:
  - preferred_term: forelimb bud
    term:
      id: UBERON:0005417
      label: forelimb bud

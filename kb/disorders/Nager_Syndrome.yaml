    snippet: mutations in SF3B4, a component of the U2 pre-mRNA spliceosomal complex, cause Nager syndrome
    explanation: Identifies SF3B4, a U2 spliceosomal component, as the cause of Nager syndrome.
  - reference: PMID:22541558

    snippet: The preaxial limb defects are characterized by radial and thumb hypoplasia or aplasia, duplication of thumbs and proximal radioulnar synostosis.
    explanation: Defines the cardinal preaxial/radial limb bundle that distinguishes Nager syndrome.

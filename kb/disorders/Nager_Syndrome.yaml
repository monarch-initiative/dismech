pathophysiology:
- name: SF3B4 Haploinsufficiency and Spliceosomal mRNA-Splicing Dysfunction
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  biological_scale: MOLECULAR
  description: >-
    Heterozygous SF3B4 loss-of-function variants (predominantly frameshift and
    nonsense null alleles) reduce the dose of SAP49, a component of the U2 small
    nuclear ribonucleoprotein of the major spliceosome, producing
    haploinsufficiency. SAP49 helps tether the U2 complex to the intron branch
    point during pre-mRNA splicing, and its reduction impairs accurate splicing.
    This is the spliceosomopathy counterpart of the ribosome-biogenesis lesion
    that drives Treacher Collins syndrome: although the spliceosome operates in
    all cells, cranial neural crest cells are selectively vulnerable to this
    perturbation during early craniofacial (and preaxial limb) development.
  genetic_context:
    gene:
      preferred_term: SF3B4
      term:
        id: hgnc:10771
        label: SF3B4
    functional_impact_category: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22541558

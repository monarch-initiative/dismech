    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A G to T transversion in codon 740, from CGC to CTC, replacing Arginine
      with Leucine was found in a patient.
    explanation: >-
      The founding CMH9 report describes a heterozygous missense change in a
      single patient. It is consistent with dominant action but provides no
      family segregation data, which is why support is recorded as partial.
mechanistic_hypotheses:
- hypothesis_group_id: ttn_zdisc_actinin_binding
  hypothesis_label: Altered titin Z-disc binding to alpha-actinin
  status: EMERGING
  description: >-
    The original CMH9 proposal: a missense substitution in the titin Z-repeat
    region increases the binding affinity of titin for alpha-actinin, perturbing
    Z-disc assembly or Z-disc mechanical signalling and thereby producing
    hypertrophic remodelling. The supporting data are one proband plus a yeast
    two-hybrid binding assay; no animal model, no segregation, and no
    replication in an independent HCM cohort have been reported for this
    variant.
  evidence:
  - reference: PMID:10462489
    reference_title: "Structural analysis of the titin gene in hypertrophic cardiomyopathy: identification of a novel disease gene."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      This mutation was not found in more than 500 normal chromosomes and
      increased the binding affinity of titin to alpha-actitin in the yeast
      two-hybrid assay.
    explanation: >-
      Provides the in vitro binding result on which the hypothesis rests. It is
      an interaction assay in yeast, not a demonstration of cardiac
      pathogenesis, so it supports the hypothesis only partially. (The abstract
      contains the typographical error "alpha-actitin" for alpha-actinin; the
      snippet is quoted verbatim.)
  notes: >-
    Status is EMERGING rather than CANONICAL or ALTERNATIVE because no
    independent replication has been published in the 25+ years since the
    original report.
- hypothesis_group_id: ttn_murf1_degradation
  hypothesis_label: Perturbed titin/MURF1 interaction with enhanced titin ubiquitination
  status: EMERGING
  description: >-
    A later proposal derived from a medaka fish mutant (non-spring heart) with
    hypertrophic myocardium and diastolic dysfunction caused by a missense
    change in a titin immunoglobulin domain at the M-line/A-band transition.
    Screening 96 familial HCM patients without known sarcomeric mutations
    identified two further M-line-proximal Ig domain variants; in vitro, both
    the fish and human variants increased titin binding to MURF1 and enhanced
    ubiquitin-mediated titin degradation. This remains a model-organism plus
    in vitro hypothesis and has not established clinical validity for TTN as an
    HCM gene.
  evidence:
  - reference: PMID:31628103
    reference_title: "Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic cardiomyopathy in a fish model and in human patients."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings implicate an impaired interaction between titin and MURF1
      as a novel mechanism underlying the pathogenesis of HCM.
    explanation: >-
      States the hypothesis. The primary evidence is a medaka fish mutant, so
      translational validity to human HCM is not established; support is
      partial.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      in a medaka mutagenesis fish model with diastolic dysfunction,
      highlighting this as an important region
    explanation: >-
      ClinGen's expert panel explicitly acknowledges the M-line/A-band
      transition region finding as noteworthy while still holding the overall
      gene-disease relationship at Limited — which is precisely the epistemic
      status this hypothesis is recorded with.
  notes: >-
    Deliberately not merged with the Z-disc/alpha-actinin hypothesis: the two
    implicate different titin regions (Z-repeat versus M-line-proximal Ig
    domains) and different partner proteins.
pathophysiology:
- name: Rare TTN Variants in Sarcomere-Negative Hypertrophic Cardiomyopathy
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proximal node of the claimed CMH9 mechanism: a rare heterozygous TTN
    variant in a patient with hypertrophic cardiomyopathy who has no variant in
    an established sarcomere gene. Both reported series ascertained patients
    this way — by residual, gene-elusive HCM — which is a candidate-gene design
    that cannot by itself establish causality. Titin is the largest human
    protein and carries a high background burden of rare variation, so rare
    TTN variants are expected in any sufficiently large cohort. This node is
    tagged HYPOTHETICAL because its causal link to the downstream hypertrophic
    phenotype is exactly what remains unproven.

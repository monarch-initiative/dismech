genetic:
- name: TTN
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  relationship_type: DISPUTED
  association: >-
    Disputed causal gene. ClinGen classifies TTN-hypertrophic cardiomyopathy as
    Limited. The claimed causal alleles are rare missense substitutions
    (Arg740Leu in the Z-repeat region; two Ig-domain variants near the M-line),
    each reported once in sarcomere-negative HCM cohorts. Titin-truncating
    variants — the mechanism that makes TTN the commonest dilated cardiomyopathy
    gene — are NOT enriched in HCM relative to controls, and a separate line of
    evidence instead suggests TTNtv may act as an outcome modifier in
    established HCM rather than as a cause of it.
  evidence:
  - reference: PMID:39895828
    reference_title: "A Case Study Identified a New Mutation in the TTN Gene for Inherited Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES combined with Sanger sequencing results showed that the other two HCM
      patients in this family carried this TTN mutation, while none of the
      healthy family members carried the mutation except for a 3 years old girl.
    explanation: >-
      The only published segregation evidence for any TTN allele in hypertrophic
      cardiomyopathy: a fourth allele, p.Arg6745Cys, tracking with disease
      across a three-generation Chinese Han family. Curated PARTIAL, and it does
      not overturn the Limited classification - it is one small family, ACMG PP1
      counts only at supporting strength, there is no functional work, and the
      authors themselves note the Ig49 domain has no known protein binding site
      nearby. One unaffected 3-year-old carrier is uninformative given
      age-dependent penetrance rather than evidence against segregation. This
      allele is recorded because omitting it would leave the entry asserting an
      absence a reader could falsify in one search, and because the ClinGen
      assertion post-dates it (2025-10-28 versus February 2025), which makes the
      Limited classification more persuasive rather than less.
  - reference: CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd-2025-10-28T160000.000Z
    reference_title: "TTN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN | HGNC:12403 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      The authoritative gene-disease validity classification: Limited, from
      ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN 1.2 5.5 6.7 Limited"
    explanation: >-
      The expert panel's own scoring row for TTN in the HCM reappraisal: 1.2
      genetic evidence points plus 5.5 experimental evidence points, total 6.7,
      yielding a Limited classification. Note the evidence is weighted toward
      experimental rather than genetic (case/segregation) support — the pattern
      expected of a gene with a plausible biology but no case-level proof.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      No excess TTN variants were noted in cases compared to controls in two
      studies.
    explanation: >-
      The expert panel's summary of the case-control evidence: no enrichment of
      TTN variants in HCM cases over controls, the core reason the relationship
      does not rise above Limited.
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of TTN truncating variants identified by next-generation
      sequencing of samples from subjects with hypertrophic cardiomyopathy and
      controls was similar (1% and 3%, respectively; P = 0.34).
    explanation: >-
      The directly on-point refutation: truncating TTN variants were no more
      common in hypertrophic cardiomyopathy than in controls - numerically
      slightly less common - so a truncating-variant mechanism does not account
      for HCM. This entry previously quoted the study's dilated-cardiomyopathy
      result here, which supported a claim about DCM while the machine-readable
      assertion was about HCM; the HCM comparison is quoted instead.
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      each subject with hypertrophic cardiomyopathy who had a TTN variant also
      had a pathogenic mutation in an established hypertrophic cardiomyopathy
      gene, suggesting that TTN truncations rarely, if ever, cause hypertrophic
      cardiomyopathy.
    explanation: >-
      The strongest single datum against this entity in the literature. Every
      TTN variant found in an HCM subject was accompanied by a pathogenic
      variant in a gene with established HCM validity - so the TTN variants were
      bystanders in genotype-explained patients, not the cause. Its force is
      that it removes the alternative reading in which TTN variants are rare but
      real HCM causes.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of TTNtv in patients with HCM and in healthy controls was
      comparable
    explanation: >-
      In 529 Chinese HCM patients versus 307 controls, TTNtv prevalence was
      indistinguishable (2.5% vs 2.6%), independently refuting TTN truncating
      variants as a cause of HCM.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study suggests that TTNtv might be a genetic modifier of HCM and
      confer an increased risk for cardiovascular death.
    explanation: >-
      Supports the alternative reading of the TTN-HCM relationship — modifier of
      outcome rather than cause of disease. Hedged by the authors and based on 3
      events among 13 TTNtv carriers, so support is partial.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No TTN mutations were detected."
    explanation: >-
      Targeted analysis in 389 unrelated HCM patients yielded no TTN mutations,
      providing negative replication for the founding CMH9 report. The scope
      caveat matters and is stated rather than left implicit: only exons 2, 3, 4
      and 14 were sequenced - the regions previously implicated in HCM or DCM -
      which is four of TTN's 364 exons. This is a negative result over roughly
      1% of the gene, so it refutes recurrence at the known sites rather than
      excluding TTN involvement generally.
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association.
    explanation: >-
      Provides the general context in which the TTN-HCM claim sits: a systematic
      ClinGen-methodology curation found that only 8 of 33 curated HCM genes had
      definitive evidence, with 22 having limited or no evidence. Partial because
      this quoted conclusion is a summary statement rather than the TTN-specific
      row.
  notes: >-
    Practical consequence for variant interpretation: a rare TTN variant found
    on a multigene HCM panel should not be reported as an established cause of
    the patient's hypertrophy.
prevalence:
- population: Published TTN-attributed hypertrophic cardiomyopathy probands worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence can be stated for CMH9, and the reason is the entity's own
    disputed status rather than a gap in ascertainment: counting cases requires
    a rule for deciding which TTN variant carriers have the disease, and that is
    exactly what is unsettled. The published case base is roughly four probands
    - the 1999 Arg740Leu index case, two Ig-domain variants from a 96-patient
    screen, and the 2025 p.Arg6745Cys family - none independently replicated. By
    contrast, TTN variant carriage among HCM patients is well measured and runs
    at control frequency, which is the finding that makes the case count
    uninterpretable rather than merely small.
  evidence:
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of TTN truncating variants identified by next-generation
      sequencing of samples from subjects with hypertrophic cardiomyopathy and
      controls was similar (1% and 3%, respectively; P = 0.34).
    explanation: >-
      Supplies the carriage-versus-control comparison that makes a CMH9 case
      count uninterpretable. PARTIAL because it measures truncating variants
      rather than the missense alleles this entity is built on.
diagnosis:
- name: Multigene HCM panel, with TTN not reportable as an established cause
  diagnosis_term:
    preferred_term: Multigene hypertrophic cardiomyopathy panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    This is the clinically actionable output of the entry, and it is a reporting
    rule rather than a testing indication. TTN is on many cardiomyopathy panels
    because of its Definitive relationship with DILATED cardiomyopathy; a rare
    TTN variant returned in a patient being investigated for hypertrophic
    cardiomyopathy must not be reported as an established cause of that
    phenotype, must not drive predictive cascade testing in relatives, and does
    not end the search for a variant in a gene with adequate validity. The
    empirical basis is that TTN variant carriage in HCM runs at control
    frequency, and that in the one study that checked, every HCM subject with a
    TTN variant also carried a pathogenic variant in an established HCM gene -
    so finding TTN and stopping risks missing the actual cause.
  results: >-
    A rare TTN variant in an HCM workup is an uncertain finding at gene level,
    not a molecular diagnosis. Continue interpreting the panel as though TTN
    were absent from it.
  evidence:
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      each subject with hypertrophic cardiomyopathy who had a TTN variant also
      had a pathogenic mutation in an established hypertrophic cardiomyopathy
      gene, suggesting that TTN truncations rarely, if ever, cause hypertrophic
      cardiomyopathy.
    explanation: >-
      The direct basis for the reporting rule: TTN variants in HCM patients
      co-occurred with a genuine cause every time, so reporting TTN would have
      been wrong in every case examined.
  notes: >-
    This rule previously existed only as free text in the genetic section's
    notes. It is promoted here so it is machine-readable, since it is the single
    most useful output of a disputed-validity entry.
differential_diagnoses:
- name: Sarcomeric hypertrophic cardiomyopathy
  disease_term:
    preferred_term: familial hypertrophic cardiomyopathy
    term:
      id: MONDO:0024573
      label: familial hypertrophic cardiomyopathy
  description: >-
    The differential that matters most for this entity, because it is not merely
    an alternative but the likelier explanation in any patient where a TTN
    variant is found. The definitive HCM genes - MYBPC3, MYH7, TNNT2, TNNI3,
    TPM1, ACTC1, MYL2, MYL3 - account for the great majority of genotype-positive
    HCM, and in the one systematic comparison every HCM patient carrying a TTN
    variant also carried a pathogenic variant in one of them.
  distinguishing_features:
  - 'Sarcomeric HCM: a pathogenic variant in a gene with definitive HCM validity.
    CMH9: a TTN variant whose gene-disease relationship is classified Limited,
    frequently alongside an unrecognised sarcomeric variant.'
  evidence:
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3,
      MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3)
    explanation: >-
      Names the definitive-validity genes that constitute this differential, and
      by omission places TTN outside them.
- name: TTN-related dilated cardiomyopathy
  description: >-
    The most consequential confusion risk for this entity, and the reason the
    entry carries an external_assertions contrast. TTN-dilated cardiomyopathy is
    ClinGen Definitive and titin-truncating variants are its commonest genetic
    cause; TTN-hypertrophic cardiomyopathy is Limited. A curator or clinician
    encountering "TTN cardiomyopathy" in the literature is far more likely to be
    reading about the dilated entity, and that literature is not transferable
    here.
  distinguishing_features:
  - 'TTN-DCM: truncating variants, ClinGen Definitive, ventricular dilation with
    systolic impairment. CMH9: rare missense variants, ClinGen Limited,
    hypertrophy - and truncating variants occur at control frequency.'
  evidence:
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of TTN truncating variants identified by next-generation
      sequencing of samples from subjects with hypertrophic cardiomyopathy and
      controls was similar (1% and 3%, respectively; P = 0.34).
    explanation: >-
      The same study that established the DCM association found no HCM
      association, which is the cleanest single demonstration that the two
      entities must be kept apart.
- name: Non-sarcomeric phenocopies of left ventricular hypertrophy
  description: >-
    Phenocopy exclusion carries extra weight in a sarcomere-negative HCM patient,
    which is by definition the population in which TTN variants were sought - the
    founding CMH9 cohort consisted of probands without mutations in the
    then-known sarcomere genes. Fabry disease, ATTR and AL amyloidosis, Danon
    disease, PRKAG2 glycogen storage cardiomyopathy, and the RASopathies all
    produce unexplained left ventricular hypertrophy, several are treatable, and
    all are better-established explanations than a Limited-validity TTN variant.
    Athlete's heart and hypertensive hypertrophy account for the non-genetic end
    of the differential.
  notes: >-
    Deliberately carries no evidence item. The phenocopy list is standard
    practice for unexplained left ventricular hypertrophy rather than a
    TTN-specific finding, and no cached source for this entity enumerates it;
    stating that is preferable to attaching a citation that does not support it.
experimental_models:
- name: non-spring heart (nsh) medaka fish titin Ig-domain mutant
  description: >-
    The primary experimental support for the titin/MURF1 hypothesis, and the
    only whole-organism model in this entry. A cardiovascular-mutant medaka
    carrying a missense change in an Ig domain at the M-line-A-band transition
    zone of titin shows diastolic dysfunction and hypertrophic myocardium;
    homozygotes have fewer myofibrils, disrupted sarcomeres and stiffer titin
    isoforms, while heterozygotes show M-line disassembly resembling the human
    pathology. Positional cloning of that mutation is what directed the screen of
    96 sarcomere-negative familial HCM patients in which the two human Ig-domain
    alleles curated here were found.
  experimental_model_type: OTHER
  organism:
    preferred_term: Japanese medaka
    term:
      id: NCBITaxon:8090
      label: Oryzias latipes
  publication: PMID:31628103
  modeled_mechanisms:
  - target: Perturbed Titin-MURF1 Interaction and Enhanced Titin Degradation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces a hypertrophic, diastolically impaired myocardium from a titin
      Ig-domain missense change, which is the mechanism this node proposes.
    limitations: >-
      Fidelity is LOW and deliberately so. This is a fish, the causal direction
      in the model runs from a mutation found in fish to a human screen rather
      than from a validated human allele, the human phenotype is dominant while
      the fish structural phenotype is clearest in homozygotes, and no mammalian
      model of any TTN HCM allele exists. The model motivates the hypothesis; it
      does not establish the human mechanism, which is why every node in this
      entry remains HYPOTHETICAL.
    evidence:
    - reference: PMID:31628103
      reference_title: "Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic cardiomyopathy in a fish model and in human patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The nsh homozygotes had fewer myofibrils, disrupted sarcomeres and
        expressed pathologically stiffer titin isoforms.
      explanation: >-
        The structural phenotype of the model, and the observation that ties a
        titin Ig-domain lesion to sarcomeric disruption.
  evidence:
  - reference: PMID:31628103
    reference_title: "Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic cardiomyopathy in a fish model and in human patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated a cardiovascular-mutant medaka fish, non-spring heart (nsh),
      which showed diastolic dysfunction and hypertrophic myocardium.
    explanation: >-
      Describes the model and its cardiac phenotype.
discussions:
- discussion_id: ttn_hcm_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is TTN a genuine hypertrophic cardiomyopathy gene at all, or is CMH9 a
    historical entity that should be retired?
  rationale: >-
    ClinGen classifies TTN-HCM as Limited. The entity rests on one 1999 proband
    plus two variants in a later 96-patient screen, with segregation reported in
    only one small three-generation family (PMID:39895828, p.Arg6745Cys, with
    one unaffected 3-year-old carrier), no independent replication of the index
    variant, a targeted 389-patient study that was negative across the four
    exons it examined, and TTNtv frequencies in HCM that match controls. Note
    that the ClinGen assertion is dated 2025-10-28 and that segregation report
    is from February 2025, so the expert panel plausibly had it available and
    still classified the relationship as Limited - which is a stronger argument
    for the classification than an absence of segregation would have been. What is missing is precisely the evidence class that would settle
    it: large-cohort case-control burden testing of rare TTN MISSENSE variation
    (not truncating variation) in HCM against gnomAD-scale controls, plus
    segregation in multiplex families. Until that exists, dismech records CMH9
    as a disputed entity and declines to assert a mechanism.
  proposed_experiments:
  - experiment_id: ttn_hcm_rare_missense_burden
    name: Region-stratified rare TTN missense burden test in HCM
    description: >-
      Case-control burden analysis of rare TTN missense variation in a large
      sarcomere-negative HCM cohort against population reference data,
      stratified by Z-disc, I-band, A-band, and M-line domains. Truncating
      variation is explicitly not the variable of interest here, since it has
      already been shown not to be enriched in HCM.
    would_support:
    - >-
        Significant excess of rare missense variation in a specific titin region
        in HCM cases would support a genuine, region-restricted TTN-HCM
        relationship and could move the ClinGen classification above Limited.
    would_refute:
    - >-
        No regional excess over population expectation would support retiring
        CMH9 as a distinct disease entity.
  - experiment_id: ttn_hcm_variant_segregation
    name: Segregation analysis of the reported CMH9 variants
    description: >-
      Recontact and genotype extended pedigrees, where available, for the
      Arg740Leu Z-repeat variant and the two M-line-proximal Ig-domain variants,
      testing co-segregation with an HCM phenotype.
    would_support:
    - >-
        Co-segregation with HCM across multiple informative meioses would supply
        the evidence class most conspicuously missing from the current curation.
  - experiment_id: ttn_hcm_ipsc_cardiomyocyte_model
    name: Isogenic iPSC-cardiomyocyte modelling of reported TTN variants
    description: >-
      Introduce the reported TTN variants into isogenic human iPSC-derived
      cardiomyocytes and assess hypertrophic growth, sarcomere organisation,
      titin turnover, and diastolic relaxation against isogenic controls.
    would_support:
    - >-
        A reproducible hypertrophic and diastolic phenotype in human
        cardiomyocytes would provide the human-cell functional evidence that the
        yeast two-hybrid and medaka data currently substitute for.
  evidence:
  - reference: CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd-2025-10-28T160000.000Z
    reference_title: "TTN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN | HGNC:12403 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      The Limited classification is the formal statement of the gap.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, their significance in hypertrophic cardiomyopathy (HCM) is still
      unclear.
    explanation: >-
      Contemporary authors state the uncertainty explicitly.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical laboratories are discouraged from reporting variants in genes
      with disputed HCM-association
    explanation: >-
      Frames the clinical stakes of leaving this gap unresolved. TTN was held at
      Limited rather than downgraded to Disputed, so it sits just above the
      threshold at which the panel advises laboratories not to report variants
      at all.
- discussion_id: ttn_hcm_cause_versus_modifier
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    If TTN variants are not a cause of hypertrophic cardiomyopathy, are
    titin-truncating variants nonetheless a prognostic modifier within
    established HCM?
  rationale: >-
    These are separable claims and the evidence points in opposite directions
    for each. TTNtv prevalence in HCM equals that in controls (arguing against
    causation), yet in the same cohort TTNtv carriers had a markedly higher rate
    of cardiovascular death during follow-up (adjusted hazard ratio 6.88).
    A modifier effect would not make TTN an HCM gene, but would make TTN
    genotype clinically meaningful in HCM. The finding is single-cohort, rests
    on 3 deaths among 13 carriers, and has not been replicated.
  attaches_to:
  - "genetic#TTN"
  proposed_experiments:
  - experiment_id: ttntv_hcm_mortality_replication
    name: Independent replication of the TTNtv-cardiovascular-mortality signal in HCM
    description: >-
      Prospective or retrospective replication of the association between
      titin-truncating variant carrier status and cardiovascular death within an
      independent, ancestrally distinct HCM cohort powered for an adequate
      number of events.
    would_support:
    - >-
        Replication would establish TTN genotype as a prognostic modifier in HCM
        even though TTN is not an HCM disease gene.
    would_refute:
    - >-
        Failure to replicate would leave the single-cohort finding as an
        unconfirmed signal likely inflated by the small number of events.
  evidence:
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study suggests that TTNtv might be a genetic modifier of HCM and
      confer an increased risk for cardiovascular death.
    explanation: >-
      States the modifier hypothesis that this controversy is about.
notes: >-
  Scope decision versus the existing titinopathy entry. MONDO:0013412 has two
  parents: MONDO:0024573 (familial hypertrophic cardiomyopathy, not curated) and
  MONDO:0100494 (autosomal dominant titinopathy, which IS curated as
  kb/disorders/TTN_Related_Myopathy_Dominant_Negative_TTNsv.yaml). A
  parent-term duplicate check was therefore run before creating this file. The
  two entries are distinct sibling entities, not duplicates: the existing entry
  covers a SKELETAL MUSCLE myopathy (distal weakness, contractures) caused by
  heterozygous multi-exon IN-FRAME STRUCTURAL VARIANTS acting by a
  dominant-negative internally-deleted titin protein, and it explicitly states
  that it "does not attempt to cover the full TTN disease spectrum"; it never
  mentions hypertrophic cardiomyopathy. This entry covers a CARDIAC hypertrophic
  phenotype attributed to rare MISSENSE substitutions (Z-repeat Arg740Leu;
  M-line-proximal Ig domains) with entirely different proposed mechanisms
  (alpha-actinin binding, MURF1-mediated titin degradation), a different OMIM
  number (613765), and its own exact MONDO term — which the titinopathy entry
  lacks and only approximates via its parent. Because MONDO:0013412 exists as an
  exact term, no `mappings` block is needed here.

  Curation guard (Named Entity Confusion): TTN's dominant cardiomyopathy
  association is with DILATED cardiomyopathy (MONDO:0005021, ClinGen
  Definitive), where truncating variants explain roughly a quarter of familial
  cases. That literature is far larger than the HCM literature and is easy to
  import by mistake. It is intentionally excluded from this entry; see
  kb/disorders/Dilated_Cardiomyopathy.yaml for the DCM entity. The umbrella
  entry kb/disorders/Hypertrophic_Cardiomyopathy.yaml (MONDO:0005045) already
  lists TTN among HCM panel genes and cites the same ClinGen Limited assertion.

  Reference-mining note, recorded so it is not re-litigated: PMID:20301725
  (GeneReviews Nonsyndromic Hypertrophic Cardiomyopathy Overview) and
  PMID:38718139 (2024 AHA/ACC guideline) are both cached as abstract_only, and
  neither record contains minable content - GeneReviews carries only its
  six-point "purpose of this overview" list, and the guideline abstract carries
  only AIM/METHODS/STRUCTURE sections. No evidence item cites either, and none
  can without fabrication. In particular, the penetrance figures that circulate
  for HCM generally must not be attributed to PMID:20301725 from this entry -
  that text is not in the cached record and would fail reference validation.

  ClinVar caveat for Arg740Leu: the ClinVar record for this allele
  (VCV000012649) is a 0-star, OMIM-derived "Pathogenic" assertion dated
  1999-08-27 with no assertion criteria provided, predating the ACMG/AMP
  framework by 16 years. It is the same 1999 report this entity rests on, not
  independent confirmation of it, and a reader who checks ClinVar and sees
  "Pathogenic" should know that. This is directly relevant to why the
  gene-disease relationship is disputed while a variant-level database still
  reads as settled.

  Treatments are deliberately absent, and this is a scoping decision rather than
  an omission. No TTN-genotype-directed therapy exists, and every management
  option that would appear here - negative inotropes, myosin inhibitors,
  ICD, septal reduction, transplantation - is indicated on the hypertrophic
  cardiomyopathy phenotype irrespective of genotype. Curating them under a
  Limited-validity entity would imply that a TTN variant carries management
  consequences, which is the opposite of this entry's central claim. See
  kb/disorders/Hypertrophic_Cardiomyopathy.yaml for genotype-agnostic
  management.

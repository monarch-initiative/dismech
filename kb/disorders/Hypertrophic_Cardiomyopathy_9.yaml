genetic:
- name: TTN
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  relationship_type: DISPUTED
  association: >-
    Disputed causal gene. ClinGen classifies TTN-hypertrophic cardiomyopathy as
    Limited. The claimed causal alleles are rare missense substitutions
    (Arg740Leu in the Z-repeat region; two Ig-domain variants near the M-line),
    each reported once in sarcomere-negative HCM cohorts. Titin-truncating
    variants — the mechanism that makes TTN the commonest dilated cardiomyopathy
    gene — are NOT enriched in HCM relative to controls, and a separate line of
    evidence instead suggests TTNtv may act as an outcome modifier in
    established HCM rather than as a cause of it.
  evidence:
  - reference: CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd-2025-10-28T160000.000Z
    reference_title: "TTN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN | HGNC:12403 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      The authoritative gene-disease validity classification: Limited, from
      ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN 1.2 5.5 6.7 Limited"
    explanation: >-
      The expert panel's own scoring row for TTN in the HCM reappraisal: 1.2
      genetic evidence points plus 5.5 experimental evidence points, total 6.7,
      yielding a Limited classification. Note the evidence is weighted toward
      experimental rather than genetic (case/segregation) support — the pattern
      expected of a gene with a plausible biology but no case-level proof.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      No excess TTN variants were noted in cases compared to controls in two
      studies.
    explanation: >-
      The expert panel's summary of the case-control evidence: no enrichment of
      TTN variants in HCM cases over controls, the core reason the relationship
      does not rise above Limited.
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the frequency of TTN mutations was significantly higher among subjects
      with dilated cardiomyopathy
    explanation: >-
      In this next-generation-sequencing comparison, TTN truncating mutations
      were found in 54 of 203 dilated cardiomyopathy subjects but only 3 of 231
      hypertrophic cardiomyopathy subjects, below the 7 of 249 seen in the
      study's own controls. (The corresponding 27%, 1%, and 3% figures are given
      in square brackets in the abstract and so are paraphrased here rather than
      quoted, because the reference validator strips bracketed text from
      snippets.) This refutes a truncating-variant mechanism for HCM and is the
      clearest single demonstration that the well-validated TTN cardiomyopathy
      association is with DCM, not HCM.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of TTNtv in patients with HCM and in healthy controls was
      comparable
    explanation: >-
      In 529 Chinese HCM patients versus 307 controls, TTNtv prevalence was
      indistinguishable (2.5% vs 2.6%), independently refuting TTN truncating
      variants as a cause of HCM.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study suggests that TTNtv might be a genetic modifier of HCM and
      confer an increased risk for cardiovascular death.
    explanation: >-
      Supports the alternative reading of the TTN-HCM relationship — modifier of
      outcome rather than cause of disease. Hedged by the authors and based on 3
      events among 13 TTNtv carriers, so support is partial.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No TTN mutations were detected."
    explanation: >-
      Targeted analysis of the HCM-associated TTN exons in 389 unrelated HCM
      patients yielded no TTN mutations, providing negative replication for the
      founding CMH9 report.
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association.
    explanation: >-
      Provides the general context in which the TTN-HCM claim sits: a systematic
      ClinGen-methodology curation found that only 8 of 33 curated HCM genes had
      definitive evidence, with 22 having limited or no evidence. Partial because
      this quoted conclusion is a summary statement rather than the TTN-specific
      row.
  notes: >-
    Practical consequence for variant interpretation: a rare TTN variant found
    on a multigene HCM panel should not be reported as an established cause of
    the patient's hypertrophy.
discussions:
- discussion_id: ttn_hcm_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is TTN a genuine hypertrophic cardiomyopathy gene at all, or is CMH9 a
    historical entity that should be retired?
  rationale: >-
    ClinGen classifies TTN-HCM as Limited. The entity rests on one 1999 proband
    plus two variants in a later 96-patient screen, with no published
    segregation, no independent replication of the index variant, a fully
    negative 389-patient targeted study, and TTNtv frequencies in HCM that match
    controls. What is missing is precisely the evidence class that would settle
    it: large-cohort case-control burden testing of rare TTN MISSENSE variation
    (not truncating variation) in HCM against gnomAD-scale controls, plus
    segregation in multiplex families. Until that exists, dismech records CMH9
    as a disputed entity and declines to assert a mechanism.
  proposed_experiments:
  - experiment_id: ttn_hcm_rare_missense_burden
    name: Region-stratified rare TTN missense burden test in HCM
    description: >-
      Case-control burden analysis of rare TTN missense variation in a large
      sarcomere-negative HCM cohort against population reference data,
      stratified by Z-disc, I-band, A-band, and M-line domains. Truncating
      variation is explicitly not the variable of interest here, since it has
      already been shown not to be enriched in HCM.
    would_support:
    - >-
        Significant excess of rare missense variation in a specific titin region
        in HCM cases would support a genuine, region-restricted TTN-HCM
        relationship and could move the ClinGen classification above Limited.
    would_refute:
    - >-
        No regional excess over population expectation would support retiring
        CMH9 as a distinct disease entity.
  - experiment_id: ttn_hcm_variant_segregation
    name: Segregation analysis of the reported CMH9 variants
    description: >-
      Recontact and genotype extended pedigrees, where available, for the
      Arg740Leu Z-repeat variant and the two M-line-proximal Ig-domain variants,
      testing co-segregation with an HCM phenotype.
    would_support:
    - >-
        Co-segregation with HCM across multiple informative meioses would supply
        the evidence class most conspicuously missing from the current curation.
  - experiment_id: ttn_hcm_ipsc_cardiomyocyte_model
    name: Isogenic iPSC-cardiomyocyte modelling of reported TTN variants
    description: >-
      Introduce the reported TTN variants into isogenic human iPSC-derived
      cardiomyocytes and assess hypertrophic growth, sarcomere organisation,
      titin turnover, and diastolic relaxation against isogenic controls.
    would_support:
    - >-
        A reproducible hypertrophic and diastolic phenotype in human
        cardiomyocytes would provide the human-cell functional evidence that the
        yeast two-hybrid and medaka data currently substitute for.
  evidence:
  - reference: CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd-2025-10-28T160000.000Z
    reference_title: "TTN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTN | HGNC:12403 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      The Limited classification is the formal statement of the gap.
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, their significance in hypertrophic cardiomyopathy (HCM) is still
      unclear.
    explanation: >-
      Contemporary authors state the uncertainty explicitly.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical laboratories are discouraged from reporting variants in genes
      with disputed HCM-association
    explanation: >-
      Frames the clinical stakes of leaving this gap unresolved. TTN was held at
      Limited rather than downgraded to Disputed, so it sits just above the
      threshold at which the panel advises laboratories not to report variants
      at all.
- discussion_id: ttn_hcm_cause_versus_modifier
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    If TTN variants are not a cause of hypertrophic cardiomyopathy, are
    titin-truncating variants nonetheless a prognostic modifier within
    established HCM?
  rationale: >-
    These are separable claims and the evidence points in opposite directions
    for each. TTNtv prevalence in HCM equals that in controls (arguing against
    causation), yet in the same cohort TTNtv carriers had a markedly higher rate
    of cardiovascular death during follow-up (adjusted hazard ratio 6.88).
    A modifier effect would not make TTN an HCM gene, but would make TTN
    genotype clinically meaningful in HCM. The finding is single-cohort, rests
    on 3 deaths among 13 carriers, and has not been replicated.
  attaches_to:
  - "genetic#TTN"
  proposed_experiments:
  - experiment_id: ttntv_hcm_mortality_replication
    name: Independent replication of the TTNtv-cardiovascular-mortality signal in HCM
    description: >-
      Prospective or retrospective replication of the association between
      titin-truncating variant carrier status and cardiovascular death within an
      independent, ancestrally distinct HCM cohort powered for an adequate
      number of events.
    would_support:
    - >-
        Replication would establish TTN genotype as a prognostic modifier in HCM
        even though TTN is not an HCM disease gene.
    would_refute:
    - >-
        Failure to replicate would leave the single-cohort finding as an
        unconfirmed signal likely inflated by the small number of events.
  evidence:
  - reference: PMID:28822653
    reference_title: "Titin-Truncating Variants Increase the Risk of Cardiovascular Death in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study suggests that TTNtv might be a genetic modifier of HCM and
      confer an increased risk for cardiovascular death.
    explanation: >-
      States the modifier hypothesis that this controversy is about.
notes: >-
  Scope decision versus the existing titinopathy entry. MONDO:0013412 has two
  parents: MONDO:0024573 (familial hypertrophic cardiomyopathy, not curated) and
  MONDO:0100494 (autosomal dominant titinopathy, which IS curated as
  kb/disorders/TTN_Related_Myopathy_Dominant_Negative_TTNsv.yaml). A
  parent-term duplicate check was therefore run before creating this file. The
  two entries are distinct sibling entities, not duplicates: the existing entry
  covers a SKELETAL MUSCLE myopathy (distal weakness, contractures) caused by
  heterozygous multi-exon IN-FRAME STRUCTURAL VARIANTS acting by a
  dominant-negative internally-deleted titin protein, and it explicitly states
  that it "does not attempt to cover the full TTN disease spectrum"; it never
  mentions hypertrophic cardiomyopathy. This entry covers a CARDIAC hypertrophic
  phenotype attributed to rare MISSENSE substitutions (Z-repeat Arg740Leu;
  M-line-proximal Ig domains) with entirely different proposed mechanisms
  (alpha-actinin binding, MURF1-mediated titin degradation), a different OMIM
  number (613765), and its own exact MONDO term — which the titinopathy entry
  lacks and only approximates via its parent. Because MONDO:0013412 exists as an
  exact term, no `mappings` block is needed here.

  Curation guard (Named Entity Confusion): TTN's dominant cardiomyopathy
  association is with DILATED cardiomyopathy (MONDO:0005021, ClinGen
  Definitive), where truncating variants explain roughly a quarter of familial
  cases. That literature is far larger than the HCM literature and is easy to
  import by mistake. It is intentionally excluded from this entry; see
  kb/disorders/Dilated_Cardiomyopathy.yaml for the DCM entity. The umbrella
  entry kb/disorders/Hypertrophic_Cardiomyopathy.yaml (MONDO:0005045) already
  lists TTN among HCM panel genes and cites the same ClinGen Limited assertion.

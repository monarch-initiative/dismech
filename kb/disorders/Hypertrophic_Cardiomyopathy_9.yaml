- name: Perturbed Titin-MURF1 Interaction and Enhanced Titin Degradation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Missense substitutions in titin immunoglobulin domains near the M-line
    increase titin binding to muscle-specific RING finger protein 1 (MURF1), an
    E3 ubiquitin ligase, and enhance ubiquitin-mediated titin degradation. In
    the medaka model this was accompanied by fewer myofibrils, disrupted
    sarcomeres, pathologically stiff titin isoforms, and M-line disassembly.
    Human support is limited to two variants found in a 96-patient
    sarcomere-negative familial HCM screen plus in vitro assays.

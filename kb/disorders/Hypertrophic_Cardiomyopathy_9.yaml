  - reference: PMID:31628103
    reference_title: "Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic cardiomyopathy in a fish model and in human patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening of mutations in 96 unrelated patients with familial HCM, who had
      no previously implicated mutations in known sarcomeric gene candidates,
      identified two mutations in Ig domains close to the M-line region of titin.
    explanation: >-
      The only independent human series reporting candidate TTN variants in HCM,
      again using sarcomere-negative ascertainment; two variants in 96 patients.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No TTN mutations were detected."
    explanation: >-
      A targeted resequencing study of HCM-associated TTN exons in 389 unrelated
      HCM patients found no TTN mutations at all, directly weakening the claim
      that TTN is a recurrent HCM disease gene.

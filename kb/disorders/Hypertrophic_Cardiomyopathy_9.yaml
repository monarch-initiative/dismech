    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we searched for a disease-associated mutation in the titin gene in 82 HCM
      patients who had no mutation in the known disease genes
    explanation: >-
      Documents the sarcomere-negative ascertainment design of the founding
      CMH9 study and the single variant it yielded.
  - reference: PMID:31628103
    reference_title: "Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic cardiomyopathy in a fish model and in human patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening of mutations in 96 unrelated patients with familial HCM, who had
      no previously implicated mutations in known sarcomeric gene candidates,
      identified two mutations in Ig domains close to the M-line region of titin.
    explanation: >-
      The only independent human series reporting candidate TTN variants in HCM,
      again using sarcomere-negative ascertainment; two variants in 96 patients.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No TTN mutations were detected."
    explanation: >-
      A targeted resequencing study in 389 unrelated HCM patients found no TTN
      mutations, weakening the claim that TTN is a recurrent HCM disease gene.
      Not "no mutations at all": only exons 2, 3, 4 and 14 were sequenced - the
      regions previously implicated in HCM or DCM - so this is a negative result
      over four of TTN's 364 exons and refutes recurrence at the known sites
      rather than excluding TTN involvement across the gene. The same caveat is
      stated on this study's other use in the genetic section, so the two
      explanations agree.

name: Hypertrophic Cardiomyopathy 9
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Hypertrophic cardiomyopathy 9 (CMH9; OMIM 613765) is the OMIM/MONDO
  designation for hypertrophic cardiomyopathy (HCM) attributed to variants in
  TTN, which encodes titin. The entity originates from a single 1999 report of
  an Arg740Leu substitution identified in one of 82 HCM probands who lacked
  mutations in the then-known sarcomere genes.

  The TTN-HCM gene-disease relationship is disputed. ClinGen's Hereditary
  Cardiovascular Disease Gene Curation Expert Panel classifies
  TTN-hypertrophic cardiomyopathy as Limited (SOP11, 2025-10-28), and cohort
  studies find titin-truncating variants (TTNtv) no more frequently in HCM
  patients than in controls. This contrasts sharply with TTN-dilated
  cardiomyopathy, which ClinGen classifies as Definitive and for which TTNtv
  are the single commonest genetic cause; the large DCM literature is NOT
  transferable to this entity and is deliberately excluded here.

  dismech therefore models CMH9 as a nominal disease entity carrying a disputed
  causal gene rather than an established mechanism. The two proposed molecular
  mechanisms — altered titin Z-disc binding to alpha-actinin, and perturbed
  titin/MURF1 interaction with enhanced titin degradation near the M-line — are
  recorded as explicitly hypothetical mechanistic hypotheses, each anchored to
  a small primary study, and the outstanding validity question is recorded as a
  knowledge gap.
synonyms:
- CMH9
- TTN hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 9
- hypertrophic cardiomyopathy type 9
- hypertrophic cardiomyopathy caused by mutation in TTN
category: Genetic

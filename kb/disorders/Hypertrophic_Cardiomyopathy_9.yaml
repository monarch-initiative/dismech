phenotypes:
- category: Clinical
  name: Left Ventricular Hypertrophy
  description: >-
    Ventricular wall thickening is the defining feature of the HCM phenotype
    that CMH9 is nominally a subtype of. No TTN-variant-specific hypertrophy
    pattern, severity, or distribution has been described. The one measured
    observation available in a TTN-variant carrier comes from the p.Arg6745Cys
    proband, with basal, mid and apical interventricular septal thicknesses of
    approximately 32, 34 and 24 mm - severe asymmetric hypertrophy, but in a
    single individual whose variant is not established as causal.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  evidence:
  - reference: PMID:10462489
    reference_title: "Structural analysis of the titin gene in hypertrophic cardiomyopathy: identification of a novel disease gene."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypertrophic cardiomyopathy (HCM) is characterized by ventricular
      hypertrophy accompanied by myofibrillar disarrays.
    explanation: >-
      Establishes ventricular hypertrophy as the defining phenotype of the
      disease category to which the reported TTN patient belonged.

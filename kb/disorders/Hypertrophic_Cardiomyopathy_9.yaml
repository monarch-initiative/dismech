inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The reported mode of inheritance for the TTN-HCM relationship is autosomal
    dominant, as recorded in the ClinGen curation. Note that this records the
    mode asserted for the claimed relationship; because the relationship itself
    is classified Limited, published segregation evidence supporting dominant
    transmission of an HCM phenotype with a TTN variant is minimal. The index
    CMH9 observation was a single proband, not a segregating pedigree.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:

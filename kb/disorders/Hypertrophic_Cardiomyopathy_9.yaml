- name: Altered Titin Z-Disc Binding to Alpha-Actinin
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Increased affinity of the titin Z-repeat region for alpha-actinin, reported
    in a yeast two-hybrid assay for the Arg740Leu variant. The proposal is that
    abnormally tight Z-disc anchoring perturbs sarcomere assembly or Z-disc
    mechanosensing. No cardiac cell, tissue, or animal data have been published
    for this variant, and the functional direction (gain of binding) has not
    been connected experimentally to a hypertrophic response.

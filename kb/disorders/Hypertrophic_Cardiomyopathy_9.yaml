inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The reported mode of inheritance for the TTN-HCM relationship is autosomal
    dominant, as recorded in the ClinGen curation. Note that this records the
    mode asserted for the claimed relationship; because the relationship itself
    is classified Limited, published segregation evidence supporting dominant
    transmission of an HCM phenotype with a TTN variant is minimal rather than
    absent: the index CMH9 observation was a single proband, not a segregating
    pedigree, and the one published pedigree (PMID:39895828) is a single
    three-generation family in which the variant tracked with three affected
    members and was absent from healthy adults, with one unaffected 3-year-old
    carrier. Under ACMG that is PP1 at supporting strength only.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd-2025-10-28T160000.000Z
    reference_title: "TTN / hypertrophic cardiomyopathy (Limited)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "TTN | HGNC:12403 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-

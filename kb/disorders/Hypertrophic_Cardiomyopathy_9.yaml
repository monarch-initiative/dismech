- name: Hypertrophic Remodeling of the Left Ventricle
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The shared clinical endpoint of all hypertrophic cardiomyopathy: left
    ventricular wall thickening with myocyte disarray and impaired diastolic
    filling. This node is well established as the phenotype of HCM in general;

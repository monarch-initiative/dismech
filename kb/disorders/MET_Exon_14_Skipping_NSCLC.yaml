biochemical:
- name: MET Exon 14 Testing
  notes: >-
    METex14 testing requires RNA-based NGS or comprehensive DNA-based NGS that
    covers flanking intronic splice sites and whole-exon deletions. Standard DNA
    sequencing with limited intronic coverage misses up to a quarter of cases
    detected by RNA-based sequencing, while c-Met IHC overexpression alone is
    not specific for exon 14 skipping.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-4520709/v1
    reference_title: "MET Exon 14 Skipping Mutations in Non–Small-Cell Lung Cancer: Testing Considerations and Clinical Outcomes a 3 years screening experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a multimodal approach may be necessary to detect MET exon 14 mutations as large deletions may not be detected by DNA sequencing
    explanation: Screening experience shows detecting METex14 benefits from multimodal DNA and RNA testing because large deletions can be missed by DNA sequencing alone.
genetic:
- name: MET
  gene_term:
    preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  association: Somatic Splice Site Mutation
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  case_fractions:
  - population: Patients with non-small cell lung cancer
    case_fraction_low: 3.0
    case_fraction_high: 4.0
    evidence:
    - reference: PMID:32877583
      reference_title: "Capmatinib in MET Exon 14-Mutated or MET-Amplified Non-Small-Cell Lung Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Among patients with non-small-cell lung cancer (NSCLC), MET exon 14
        skipping mutations occur in 3 to 4% and MET amplifications occur in 1 to
        6%.
      explanation: Reports the 3% to 4% case fraction of MET exon 14 skipping mutations in NSCLC.
  inheritance:
  - name: Somatic
    evidence:
    - reference: DOI:10.3390/jmp4010006
      reference_title: "MET Exon 14 Variants in Non-Small Cell Lung Carcinoma: Prevalence, Clinicopathologic and Molecular Features"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: Somatic MET exon 14 skipping mutations (MET ex14) are targetable driver mutations for non-small cell lung cancer (NSCLC), responsive to MET inhibitors.
      explanation: METex14 alterations are somatic driver mutations acquired in tumor tissue.
  notes: >-
    MET (7q31.2) encodes the hepatocyte growth factor receptor. Exon 14 skipping
    results from over 120 distinct somatic sequence alterations at splice donor
    (3') or acceptor (5') sites, intronic branch points, or whole-exon
    deletions. Concurrent MET genomic amplification occurs more frequently in
    stage IV disease.
  evidence:
  - reference: PMID:25971938
    reference_title: "Activation of MET via diverse exon 14 splicing alterations occurs in multiple tumor types and confers clinical sensitivity to MET inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report analysis of tumor genomic profiles from 38,028 patients to
      identify 221 cases with METex14 mutations (0.6%), including 126 distinct
      sequence variants.
    explanation: Establishes the broad allelic heterogeneity (126 distinct variants) of somatic MET exon 14 splicing alterations.
  - reference: DOI:10.21203/rs.3.rs-4520709/v1
    reference_title: "MET Exon 14 Skipping Mutations in Non–Small-Cell Lung Cancer: Testing Considerations and Clinical Outcomes a 3 years screening experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MET exon 14 mutations affect splice sites and are highly heterogeneous which makes them difficult to detect.
    explanation: Confirms heterogeneous splice-site alterations in clinical NSCLC screening.
diagnosis:
- name: Comprehensive RNA and DNA Next-Generation Sequencing
  diagnosis_term:
    preferred_term: next generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  description: >-
    RNA-based next-generation sequencing directly detects the spliced MET
    transcript lacking exon 14 and identifies ~27% more METex14 cases than
    DNA-only panels, while complementary hybrid-capture DNA NGS recovers low-RNA
    specimens and characterizes specific splice-site or deletion variants in
    tumor tissue.
  evidence:
  - reference: DOI:10.3390/ijms252413715
    reference_title: "MET Exon 14 Skipping and Novel Actionable Variants: Diagnostic and Therapeutic Implications in Latin American Non-Small-Cell Lung Cancer Patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of MET variants in the South American cohort was 8%, and
      RNA-based diagnosis detected 27% more cases of METex14 than DNA-based
      methods.
    explanation: >-
      Demonstrates higher diagnostic yield of RNA-based NGS over DNA-only
      methods for MET exon 14 skipping detection.
  - reference: PMID:25971938
    reference_title: "Activation of MET via diverse exon 14 splicing alterations occurs in multiple tumor types and confers clinical sensitivity to MET inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diversity of METex14 mutations indicates that diagnostic testing via
      comprehensive genomic profiling is necessary for detection in a clinical
      setting.
    explanation: >-
      Supports comprehensive genomic profiling as necessary to capture diverse
      METex14 sequence variants.

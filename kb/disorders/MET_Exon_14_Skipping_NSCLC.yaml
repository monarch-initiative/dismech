  evidence:
  - reference: PMID:16397241
    reference_title: "Somatic mutations lead to an oncogenic deletion of met in lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the identification of somatic intronic mutations of Met
      kinase that lead to an alternatively spliced transcript in lung cancer,
      which encodes a deletion of the juxtamembrane domain resulting in the loss
      of Cbl E3-ligase binding.
    explanation: >-
      Establishes that somatic MET exon 14-skipping splice alterations delete
      the juxtamembrane domain and abolish CBL E3 ubiquitin ligase binding in
      human lung cancer.
  - reference: PMID:11741535
    reference_title: "Mutation of the c-Cbl TKB domain binding site on the Met receptor tyrosine kinase converts it into a transforming protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This requires the c-Cbl tyrosine kinase binding (TKB) domain and a
      juxtamembrane tyrosine residue on Met. This tyrosine provides a direct
      binding site for the c-Cbl TKB domain, and is absent in the rearranged
      oncogenic Tpr-Met variant.
    explanation: >-
      Identifies the juxtamembrane tyrosine (Y1003) on MET as the direct c-CBL
      TKB domain binding site required for CBL recruitment.
  - reference: PMID:25971938
    reference_title: "Activation of MET via diverse exon 14 splicing alterations occurs in multiple tumor types and confers clinical sensitivity to MET inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report the identification of diverse exon 14 splice site
      alterations in MET that result in constitutive activity of this receptor
      and oncogenic transformation in vitro.
    explanation: >-
      Demonstrates that diverse MET exon 14 splicing alterations confer
      constitutive MET receptor tyrosine kinase activity and oncogenic
      transformation.
  - reference: PMID:26729443
    reference_title: "MET Exon 14 Mutations in Non-Small-Cell Lung Cancer Are Associated With Advanced Age and Stage-Dependent MET Genomic Amplification and c-Met Overexpression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MET exon 14 mutations were identified in 28 of 933 nonsquamous NSCLCs (3.0%) and were not seen in other cancer types in this study.
    explanation: Documents recurrent somatic MET exon 14 mutations in human nonsquamous NSCLC.
  downstream:
  - target: Impaired CBL-Mediated MET Degradation

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant receptor exhibits decreased ubiquitination and delayed
      down-regulation correlating with elevated, distinct Met expression in
      primary tumors harboring the deleted receptor.
    explanation: >-
      Demonstrates decreased ubiquitination, delayed receptor downregulation,

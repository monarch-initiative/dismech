      label: transmembrane receptor protein tyrosine kinase activity
  evidence:
  - reference: PMID:32034073
    reference_title: "Molecular Mechanisms of Acquired Resistance to MET Tyrosine Kinase Inhibitors in Patients with MET Exon 14-Mutant NSCLC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On-target acquired mechanisms of resistance, including single and
      polyclonal MET kinase domain mutations in codons H1094, G1163, L1195,
      D1228, Y1230, and high levels of amplification of the MET exon 14-mutant
      allele, were observed in 7 patients (35%).
    explanation: >-
      Establishes secondary MET kinase domain mutations and amplification of the
      METex14 allele as clinical on-target TKI resistance mechanisms in METex14
      NSCLC.
  - reference: PMID:32034073
    reference_title: "Molecular Mechanisms of Acquired Resistance to MET Tyrosine Kinase Inhibitors in Patients with MET Exon 14-Mutant NSCLC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A number of off-target mechanisms of resistance were detected in 9
      patients (45%), including KRAS mutations and amplifications in KRAS, EGFR,
      HER3, and BRAF; one case displayed both on- and off-target mechanisms of
      resistance.
    explanation: >-
      Establishes KRAS, EGFR, HER3 (ERBB3), and BRAF alterations as clinical
      off-target bypass resistance mechanisms in METex14 NSCLC.
  - reference: DOI:10.3390/ijms252413715
    reference_title: "MET Exon 14 Skipping and Novel Actionable Variants: Diagnostic and Therapeutic Implications in Latin American Non-Small-Cell Lung Cancer Patients"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: Both variants showed sensitivity to crizotinib and savolitinib, but the H1094Y variant exhibited reduced sensitivity to capmatinib.
    explanation: In vitro functional characterization showing that a MET H1094Y kinase-domain substitution confers reduced sensitivity to capmatinib.

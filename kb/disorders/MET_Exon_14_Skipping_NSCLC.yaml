- name: MET Inhibitor Resistance
  biological_scale: MOLECULAR
  description: >-
    Acquired resistance to MET tyrosine kinase inhibitors in MET exon 14-mutant
    NSCLC arises through on-target secondary MET kinase domain mutations
    (codons H1094, G1163, L1195, D1228, and Y1230), amplification of the MET
    exon 14-mutant allele, or off-target bypass signaling via KRAS, EGFR,
    HER3 (ERBB3), or BRAF alterations.
  genes:

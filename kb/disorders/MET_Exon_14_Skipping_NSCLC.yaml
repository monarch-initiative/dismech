progression:
- phase: Older-adult onset
  age_range: Median age ~72.5 years
  evidence:
  - reference: PMID:26729443
    reference_title: "MET Exon 14 Mutations in Non-Small-Cell Lung Cancer Are Associated With Advanced Age and Stage-Dependent MET Genomic Amplification and c-Met Overexpression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with MET exon 14-mutated NSCLC were significantly older (median
      age, 72.5 years) than patients with EGFR-mutant (median age, 61 years; P <
      .001) or KRAS-mutant NSCLC (median age, 65 years; P < .001).
    explanation: >-
      Establishes characteristic older age at presentation compared with EGFR-
      or KRAS-mutant NSCLC.
has_subtypes:
- name: METex14 Splice Site Mutation
  description: >-
    Point mutations or small indels at splice donor or acceptor sites flanking
    exon 14 are the most common mechanism, causing exon 14 exclusion during
    pre-mRNA splicing.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-4520709/v1
    reference_title: "MET Exon 14 Skipping Mutations in Non–Small-Cell Lung Cancer: Testing Considerations and Clinical Outcomes a 3 years screening experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MET exon 14 mutations affect splice sites and are highly heterogeneous which makes them difficult to detect.
    explanation: METex14 alterations predominantly affect splice sites, supporting splice-site mutation as the primary subtype.
- name: METex14 Whole Exon Deletion
  description: >-
    Genomic deletion encompassing the exon 14 region is a recognized mechanism
    of exon 14 loss that can be missed by targeted DNA panels with narrow
    intronic coverage.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-4520709/v1
    reference_title: "MET Exon 14 Skipping Mutations in Non–Small-Cell Lung Cancer: Testing Considerations and Clinical Outcomes a 3 years screening experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a multimodal approach may be necessary to detect MET exon 14 mutations as large deletions may not be detected by DNA sequencing
    explanation: Large deletions are a recognized METex14 mechanism that DNA sequencing may miss, supporting the whole-exon-deletion subtype.
- name: METex14 with MET Amplification
  description: >-
    A stage-dependent subset of METex14-positive tumors also harbor concurrent
    MET genomic amplification and strong c-Met protein overexpression, which can
    increase oncogenic drive.
  evidence:
  - reference: PMID:26729443
    reference_title: "MET Exon 14 Mutations in Non-Small-Cell Lung Cancer Are Associated With Advanced Age and Stage-Dependent MET Genomic Amplification and c-Met Overexpression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stage IV MET exon 14-mutated NSCLCs were significantly more likely to have
      concurrent MET genomic amplification (mean ratio of MET to chromosome 7,
      4.3) and strong c-Met immunohistochemical expression (mean H score, 253)
    explanation: Stage IV METex14 NSCLCs were significantly more likely to harbor concurrent MET genomic amplification, supporting this subtype.
pathophysiology:
- name: MET Exon 14 Splice Mutations
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  description: >-
    Somatic splice site mutations or intronic/exonic deletions flanking MET exon
    14 cause skipping of exon 14 during pre-mRNA splicing. Exon 14 encodes the
    juxtamembrane regulatory domain containing the Y1003 CBL E3 ubiquitin ligase
    tyrosine kinase-binding (TKB) site; loss of this domain eliminates CBL
    recruitment and confers oncogenic MET receptor tyrosine kinase activity.

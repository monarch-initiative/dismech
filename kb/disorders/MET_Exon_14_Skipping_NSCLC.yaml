  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  description: >-
    Real-time reverse transcription-PCR (RT-PCR) on tumor-derived RNA directly
    detects the spliced MET transcript lacking exon 14 in clinical tumor
    specimens where sufficient tissue is available.

  diagnosis_term:
    preferred_term: liquid biopsy
    term:
      id: NCIT:C135727
      label: Liquid Biopsy
  description: >-
    Hybrid-capture circulating tumor DNA (ctDNA) sequencing from fresh peripheral
    blood plasma serves as a minimally invasive companion diagnostic to identify
    MET exon 14 skipping alterations for targeted therapy selection when tumor
    tissue is limited or alongside tissue biopsy.
  evidence:

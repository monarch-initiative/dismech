      explanation: Directly links exon 14 juxtamembrane deletion to loss of CBL E3-ligase binding.
- name: Impaired CBL-Mediated MET Degradation
  biological_scale: MOLECULAR
  description: >-
    Loss of the juxtamembrane Y1003 c-CBL TKB binding site impairs
    ligand-induced MET ubiquitination, endocytic receptor downregulation, and
    proteolytic degradation, resulting in elevated MET receptor accumulation on
    the tumor cell surface.
  genes:

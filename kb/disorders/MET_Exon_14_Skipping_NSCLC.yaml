name: MET Exon 14 Skipping Non-Small Cell Lung Cancer
creation_date: '2026-01-26T02:55:13Z'
synonyms:
- METex14 skipping NSCLC
- MET exon 14-mutated non-small cell lung cancer
- MET exon 14 skipping non-small cell lung carcinoma
- c-MET exon 14 skipping NSCLC
description: >-
  MET exon 14 skipping non-small cell lung cancer (NSCLC) is a molecularly
  defined lung carcinoma subtype driven by somatic splice site mutations or
  deletions that cause exclusion of exon 14 during pre-mRNA splicing of the MET
  receptor tyrosine kinase. MET exon 14 (METex14) alterations occur in
  approximately 3% to 4% of NSCLC, typically in older adults (median age ~72.5
  years) across both never-smokers and smokers, with adenocarcinoma predominance
  and enrichment in pulmonary sarcomatoid carcinoma. Exon 14 encodes the
  juxtamembrane regulatory domain containing the Y1003 CBL E3 ubiquitin ligase
  binding site required for receptor ubiquitination and degradation; loss of
  this domain causes sustained MET signaling and oncogenic proliferation and
  invasion. Selective type Ib MET tyrosine kinase inhibitors including
  capmatinib, tepotinib, and vebreltinib achieve high response rates in this
  molecularly defined population.
categories:
- Molecularly-Defined Cancer
- Lung Cancer Subtype
- Solid Tumor
parents:
- non-small cell lung carcinoma
disease_term:
  preferred_term: non-small cell lung carcinoma
  term:
    id: MONDO:0005233
    label: non-small cell lung carcinoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005233
      label: non-small cell lung carcinoma
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MET exon 14 skipping NSCLC is a molecularly defined stratum of MONDO's
      non-small cell lung carcinoma class, not the class itself: MONDO has no
      term for the stratum, so disease_term anchors to the parent while this
      broadMatch records (subject-to-object) that MONDO:0005233 is broader than
      this entry (design decisions section 3a). The driver also occurs outside
      adenocarcinoma histology, so the anchor is non-small cell lung carcinoma
      rather than lung adenocarcinoma. The parent class itself is claimed as an
      exactMatch by Non-Small_Cell_Lung_Cancer.
classifications:
  icdo_morphology:
    classification_value: Carcinoma
    notes: >-
      MET exon 14 skipping occurs predominantly in lung adenocarcinoma (~75-80%)
      as well as pulmonary sarcomatoid carcinoma (~24% of PSC) and other
      non-small cell lung carcinoma histologies.
    evidence:
    - reference: PMID:25971938
      reference_title: "Activation of MET via diverse exon 14 splicing alterations occurs in multiple tumor types and confers clinical sensitivity to MET inhibitors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        METex14 mutations are detected most frequently in lung adenocarcinoma
        (3%), but also frequently in other lung neoplasms (2.3%), brain glioma
        (0.4%), and tumors of unknown primary origin (0.4%).
      explanation: >-
        Confirms occurrence across lung adenocarcinoma and non-adenocarcinoma
        lung carcinoma histologies.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:32877583
      reference_title: "Capmatinib in MET Exon 14-Mutated or MET-Amplified Non-Small-Cell Lung Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Capmatinib showed substantial antitumor activity in patients with
        advanced NSCLC with a MET exon 14 skipping mutation, particularly in
        those not treated previously.
      explanation: >-
        Establishes MET exon 14 skipping NSCLC as a molecularly targeted solid
        malignancy in medical oncology.
  - classification_value: RESPIRATORY
    evidence:
    - reference: PMID:26729443
      reference_title: "MET Exon 14 Mutations in Non-Small-Cell Lung Cancer Are Associated With Advanced Age and Stage-Dependent MET Genomic Amplification and c-Met Overexpression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MET exon 14 mutations were identified in 28 of 933 nonsquamous NSCLCs
        (3.0%) and were not seen in other cancer types in this study.
      explanation: >-
        Confirms primary pulmonary carcinoma origin within respiratory system
        neoplasms.

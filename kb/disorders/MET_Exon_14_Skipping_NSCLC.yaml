    description: Deletion of the exon 14-encoded juxtamembrane Y1003 motif eliminates CBL E3 ubiquitin ligase recruitment to activated MET.
    evidence:
    - reference: PMID:16397241
      reference_title: "Somatic mutations lead to an oncogenic deletion of met in lung cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

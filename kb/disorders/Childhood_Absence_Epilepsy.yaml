      term:
        id: CHEBI:39867
        label: valproic acid
- name: Lamotrigine
  description: >-
    Lamotrigine is an alternative for absence seizures, though generally less
    effective than ethosuximide or valproate in comparative trials.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

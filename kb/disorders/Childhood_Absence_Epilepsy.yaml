name: Childhood Absence Epilepsy
creation_date: "2026-07-18T00:00:00Z"
category: Complex
description: >-
  Childhood absence epilepsy (CAE) is a common genetic (idiopathic) generalized
  epilepsy of childhood, with onset typically between 4 and 10 years of age. It
  is characterized by very frequent, brief typical absence seizures - sudden
  behavioral arrest with impaired awareness - accompanied on EEG by bilaterally
  synchronous, generalized 3-Hz spike-and-wave discharges. The seizures arise
  from abnormal oscillatory activity in the reciprocal thalamocortical circuit:
  a genetically influenced shift in the balance between low-threshold (T-type)
  calcium currents in thalamic neurons and GABAergic inhibition within the
  thalamus converts normal sleep-spindle-like rhythms into pathological
  hypersynchronous spike-wave oscillations. Most children have normal cognition
  and a good prognosis, with many outgrowing the seizures; a minority have a
  GLUT1 (SLC2A1) transporter defect, which is important to recognize because it
  is treatable with the ketogenic diet.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- CAE
- Pyknolepsy
- Petit mal epilepsy

    description: >-
      Thalamocortical hypersynchrony produces generalized spike-wave discharges.
- name: Bilateral Generalized 3-Hz Spike-Wave Discharges
  description: >-
    The hypersynchronous oscillation manifests on EEG as bilaterally
    synchronous, generalized 3-Hz (approximately 2.5-3.5 Hz) spike-and-wave
    discharges, the electrographic signature of the absence seizure. This node
    captures the single concept of the generalized epileptiform discharge.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:20200383
    reference_title: "Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classic electroencephalogram (EEG) shows generalized spike-wave bursts (of 3 Hz) with normal background activity."
    explanation: >-
      Confirms the electrographic signature of childhood absence epilepsy as
      generalized 3-Hz spike-wave bursts on an otherwise normal background.
  - reference: PMID:36291387
    reference_title: "Clinical and Instrumental Follow-Up of Childhood Absence Epilepsy (CAE): Exploration of Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG showing bilateral, symmetrical spike-waves, usually 3 Hz, on normal background activity"
    explanation: >-
      The ILAE-based diagnostic criteria applied in this CAE cohort specify
      bilateral, symmetrical, usually 3-Hz spike-waves, supporting the bilateral
      and synchronous character of the discharge.
  downstream:
  - target: Absence Seizures
    causal_link_type: DIRECT
    description: >-
      Generalized spike-wave discharges produce the clinical absence seizure.
- name: Absence Seizures
  description: >-
    The clinical seizure is a brief, sudden lapse of awareness (behavioral
    arrest, staring, sometimes with automatisms or eyelid flutter) lasting
    seconds, with abrupt onset and offset and no post-ictal confusion. Seizures
    are typically very frequent (many per day). This node captures the single
    concept of the seizure endpoint and conforms to the shared epilepsy final
    common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:20200383
    reference_title: "Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is characterized by daily frequent but brief staring spells, typically beginning at 4 to 8 years of age, in an otherwise apparently healthy child."
    explanation: >-
      Describes the clinical seizure endpoint of childhood absence epilepsy -
      brief, very frequent staring spells in an otherwise healthy child.
  - reference: PMID:36291387
    reference_title: "Clinical and Instrumental Follow-Up of Childhood Absence Epilepsy (CAE): Exploration of Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "very frequent (several to many per day) absences"
    explanation: >-
      Confirms the very high daily seizure frequency that is diagnostic of the
      absence-seizure endpoint in this syndrome.
phenotypes:
- name: Typical Absence Seizures
  description: >-
    Brief absence seizures with abrupt onset/offset and impaired awareness,
    typically occurring many times per day. Onset clusters between ages 4 and
    10 years, with a female predominance across most series.
  phenotype_term:
    preferred_term: Typical absence seizure
    term:
      id: HP:0011147
      label: Typical absence seizure
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:36291387
    reference_title: "Clinical and Instrumental Follow-Up of Childhood Absence Epilepsy (CAE): Exploration of Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "onset of typical absences (TAs) before puberty in an otherwise normal child"
    explanation: >-
      The diagnostic criteria applied to this 106-child CAE cohort require
      typical absence seizures with pre-pubertal onset, supporting both the
      phenotype and its childhood onset category.
  - reference: PMID:20200383
    reference_title: "Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically beginning at 4 to 8 years of age, in an otherwise apparently healthy child"
    explanation: >-
      Independently supports the 4-to-8-year typical onset window for absence
      seizures in this syndrome.
- name: Generalized 3-Hz Spike-Wave on EEG
  description: >-
    EEG shows bilaterally synchronous generalized spike-and-wave complexes at
    about 3 Hz, often provoked by hyperventilation.
  phenotype_term:
    preferred_term: EEG with spike-wave complexes (2.5-3.5 Hz)
    term:
      id: HP:0010848
      label: EEG with spike-wave complexes (2.5-3.5 Hz)
  evidence:
  - reference: PMID:20200383
    reference_title: "Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had bilateral synchronous, symmetric spike waves (2.7 to 5 Hz) on a normal background with at least one electrographically recorded seizure lasting 3 seconds or more on a 1-hour, awake video EEG"
    explanation: >-
      The enrolment EEG criterion of this 453-child randomized trial required
      bilaterally synchronous, symmetric generalized spike-wave, matching the
      HP:0010848 spike-wave band recorded here.
- name: Generalized-Onset Seizures
  description: >-
    The seizures are generalized in onset, involving both hemispheres from the
    start.
  phenotype_term:
    preferred_term: Generalized-onset seizure
    term:
      id: HP:0002197
      label: Generalized-onset seizure
  evidence:
  - reference: PMID:35503716
    reference_title: "ILAE definition of the Idiopathic Generalized Epilepsy Syndromes: Position statement by the ILAE Task Force on Nosology and Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one, or a combination, of the following generalized seizure types: absence, myoclonic, tonic-clonic and myoclonic-tonic-clonic seizures, with 2.5-5.5 Hz generalized spike-wave"
    explanation: >-
      The ILAE Task Force position statement that delineates childhood absence
      epilepsy places it among the idiopathic generalized epilepsies, whose
      seizures are generalized in onset with generalized spike-wave.
- name: Generalized Tonic-Clonic Seizures
  description: >-
    A minority of children with CAE (roughly 10-15%, usually later or in
    adolescence) develop generalized tonic-clonic seizures; their presence
    favors valproate over ethosuximide, since ethosuximide does not cover
    tonic-clonic seizures. Frequent or early tonic-clonic seizures should
    prompt reconsideration of the diagnosis.
  phenotype_term:
    preferred_term: Bilateral tonic-clonic seizure
    term:
      id: HP:0002069
      label: Bilateral tonic-clonic seizure
  evidence:
  - reference: PMID:36291387
    reference_title: "Clinical and Instrumental Follow-Up of Childhood Absence Epilepsy (CAE): Exploration of Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Headache and generalized tonic-clonic seizures (GTCS) were more frequent in children requiring more than one ASM"
    explanation: >-
      In a 106-child CAE cohort a subset had generalized tonic-clonic seizures,
      and their presence marked a harder-to-treat course requiring more than one
      anti-seizure medication.
  - reference: PMID:36291387
    reference_title: "Clinical and Instrumental Follow-Up of Childhood Absence Epilepsy (CAE): Exploration of Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A history of headache or of GTCS, along with the cumulative number of ASMs utilized, predicted seizure recurrence upon ASM discontinuation."
    explanation: >-
      Quantifies the prognostic weight of coexisting generalized tonic-clonic
      seizures in CAE - they predicted relapse after medication withdrawal.
- name: Hypoglycorrhachia (GLUT1 Subset)
  category: Laboratory
  description: >-
    In the GLUT1 (SLC2A1) deficiency subset that can masquerade as CAE,
    cerebrospinal fluid glucose is low (hypoglycorrhachia), with a reduced
    CSF:serum glucose ratio - the key diagnostic biomarker that distinguishes
    this ketogenic-diet-responsive subgroup.
  phenotype_term:
    preferred_term: Hypoglycorrhachia
    term:
      id: HP:0011972
      label: Hypoglycorrhachia
  evidence:
  - reference: PMID:25870456
    reference_title: "Clinical reasoning: novel GLUT1-DS mutation: refractory seizures and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypoglycorrhachia being highly suggestive of GLUT1-DS"
    explanation: >-
      Low CSF glucose (hypoglycorrhachia) is a highly suggestive diagnostic
      biomarker of GLUT1 deficiency syndrome.
- name: Attention and Behavioral Comorbidity
  category: Behavioral
  description: >-
    Despite the largely benign seizure prognosis, children with CAE frequently
    have attentional, behavioral, cognitive, and linguistic difficulties,
    including attention deficit hyperactivity disorder and anxiety.
  phenotype_term:
    preferred_term: Attention deficit hyperactivity disorder
    term:
      id: HP:0007018
      label: Attention deficit hyperactivity disorder
  evidence:
  - reference: PMID:18557780
    reference_title: "Childhood absence epilepsy: behavioral, cognitive, and linguistic comorbidities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "61% a psychiatric diagnosis, particularly attention deficit hyperactivity disorder (ADHD) and anxiety disorders"
    explanation: >-
      A cross-sectional study of children with CAE found a high burden of
      psychiatric comorbidity, predominantly ADHD and anxiety.
biochemical:
- name: CSF Glucose (Hypoglycorrhachia in GLUT1 Subset)
  presence: DECREASED
  context: >-
    In the GLUT1 (SLC2A1) deficiency subset that can present as absence
    epilepsy, CSF glucose and the CSF:serum glucose ratio are reduced; a ratio
    below approximately 0.5 is the diagnostic hallmark and prompts SLC2A1
    testing and consideration of the ketogenic diet.
  biomarker_term:
    preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  evidence:
  - reference: PMID:25487684
    reference_title: "Nationwide survey of glucose transporter-1 deficiency syndrome (GLUT-1DS) in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean CSF/blood glucose ratio was 0.36 (0.28-0.48)"
    explanation: >-
      In a nationwide GLUT1 deficiency survey the mean CSF:blood glucose ratio
      was 0.36, below the ~0.5 diagnostic threshold, quantifying the
      hypoglycorrhachia biomarker.

treatments:
- name: Ethosuximide
  description: >-
    Ethosuximide, a T-type calcium channel blocker, is a first-line treatment
    for absence seizures in CAE.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethosuximide
      term:
        id: CHEBI:4887
        label: ethosuximide
  evidence:
  - reference: PMID:20200383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ethosuximide and valproic acid are more effective than lamotrigine in the treatment of childhood absence epilepsy"
    explanation: >-
      A randomized comparative trial found ethosuximide and valproic acid more
      effective than lamotrigine, with ethosuximide favored for fewer
      attentional adverse effects.
- name: Valproate
  description: >-
    Valproic acid is effective against absence seizures and is used when
    ethosuximide is inadequate or generalized tonic-clonic seizures coexist.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

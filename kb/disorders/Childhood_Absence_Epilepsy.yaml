classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:35503717
      reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "(2) generalized epilepsies, comprising three syndromes: childhood absence epilepsy, epilepsy with myoclonic absence, and epilepsy with eyelid myoclonia"
      explanation: >-
        The ILAE Task Force on Nosology and Definitions classifies childhood
        absence epilepsy as a childhood-onset generalized epilepsy syndrome, an
        epilepsy nosology whose clinical home is the neurologic Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:35503716
      reference_title: "ILAE definition of the Idiopathic Generalized Epilepsy Syndromes: Position statement by the ILAE Task Force on Nosology and Definitions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In 2017, the International League Against Epilepsy (ILAE) Classification of Epilepsies described the \"genetic generalized epilepsies\" (GGEs), which contained the \"idiopathic generalized epilepsies\" (IGEs). The goal of this paper is to delineate the four syndromes comprising the IGEs, namely childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic seizures alone."
      explanation: >-
        The ILAE classification lists childhood absence epilepsy as one of the
        four IGE syndromes, which it nests inside the genetic generalized
        epilepsies, supporting a secondary genetic-basis Part.
    notes: >-
      Secondary Part only. CAE susceptibility is largely complex/polygenic
      (CACNA1H, GABRG2, GABRB3, GABRA1), so this tags the genetic axis of the
      syndrome rather than a single-gene etiology. The monogenic SLC2A1
      (GLUT1 deficiency) subset is captured in the genetic section.
pathophysiology:
- name: Genetic Susceptibility to Absence Epilepsy
  description: >-
    CAE has a strong genetic basis that is usually complex (polygenic) rather
    than single-gene. Variants affecting thalamic T-type calcium channels
    (e.g., CACNA1H) and GABA-A receptor subunits (e.g., GABRG2, GABRB3) shift
    the excitation-inhibition balance of the thalamocortical circuit toward
    abnormal oscillation. This node captures the single concept of the
    predisposing genetic variation.
  role: trigger
  gene:
    preferred_term: CACNA1H
    term:
      id: hgnc:1395
      label: CACNA1H
  evidence:
  - reference: PMID:17156077
    reference_title: "Common polymorphisms in the CACNA1H gene associated with childhood absence epilepsy in Chinese Han population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our research provides new evidence to further support the hypothesis that CACNA1H may be an important susceptibility gene for CAE in the Chinese Han population"
    explanation: >-
      Genetic-association study supporting CACNA1H (T-type calcium channel) as a
      susceptibility gene for childhood absence epilepsy.
  - reference: PMID:11326275
    reference_title: "Mutant GABA(A) receptor gamma2-subunit in childhood absence epilepsy and febrile seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two main phenotypes were childhood absence epilepsy (CAE) and febrile seizures (FS)"
    explanation: >-
      A GABA-A receptor gamma-2 subunit mutation segregated with childhood
      absence epilepsy in a large family, implicating GABAergic genes in
      susceptibility.
  downstream:
  - target: Enhanced Thalamic T-type Calcium Current
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Susceptibility variants alter thalamic T-type calcium channel behavior.
  - target: Aberrant Thalamic GABAergic Inhibition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Susceptibility variants alter GABA-A receptor-mediated thalamic
      inhibition.
- name: Enhanced Thalamic T-type Calcium Current
  description: >-
    Low-threshold (T-type) calcium currents in thalamic relay and reticular
    neurons promote low-threshold calcium spikes and rebound burst firing. An
    enhanced or dysregulated T-type current lowers the threshold for the
    rhythmic bursting that underlies spike-wave oscillation. This node captures
    the single concept of the pro-oscillatory calcium current.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Thalamic excitatory neuron
    term:
      id: CL:4023068
      label: thalamic excitatory neuron
  biological_processes:
  - preferred_term: Regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: INCREASED
  evidence:
  - reference: PMID:26220996
    reference_title: "CaV3.2 calcium channels control NMDA receptor-mediated transmission: a new mechanism for absence epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CaV3.2 T-type calcium channels, encoded by CACNA1H, are expressed throughout the brain"
    explanation: >-
      Establishes that CACNA1H encodes the CaV3.2 low-threshold T-type calcium
      channel central to the pro-oscillatory thalamic current.
  - reference: PMID:15888660
    reference_title: "Functional characterization and neuronal modeling of the effects of childhood absence epilepsy variants of CACNA1H, a T-type calcium channel."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "would increase firing of neurons, with three of them inducing oscillations at similar frequencies, as observed during absence seizures"
    explanation: >-
      Functional characterization and neuronal modeling of CAE-associated
      CACNA1H variants predicted increased neuronal firing and oscillations at
      absence-seizure frequencies, linking the T-type current to the rhythm.
  downstream:
  - target: Abnormal Thalamocortical Oscillation and Hypersynchrony
    causal_link_type: DIRECT
    description: >-
      Rebound burst firing drives synchronized thalamocortical oscillation.
- name: Aberrant Thalamic GABAergic Inhibition
  description: >-
    GABAergic neurons of the thalamic reticular nucleus provide inhibition onto
    thalamic relay neurons. Excessive or mistimed GABA-mediated inhibition
    (including GABA-B-mediated slow hyperpolarization) de-inactivates T-type
    calcium channels, priming relay neurons for rebound bursts. This node
    captures the single concept of the pro-oscillatory inhibitory input.
  role: mediator
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19966779
    reference_title: "Enhanced tonic GABAA inhibition in typical absence epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "extrasynaptic GABA(A) receptor-dependent 'tonic' inhibition is increased in thalamocortical neurons from diverse genetic and pharmacological models of absence seizures"
    explanation: >-
      Directly supports aberrant (increased, extrasynaptic tonic) GABA-A-mediated
      inhibition of thalamocortical neurons as a shared cellular pathology across
      absence-seizure models, rather than the older impaired-inhibition
      assumption.
  - reference: PMID:19966779
    reference_title: "Enhanced tonic GABAA inhibition in typical absence epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the selective activation of thalamic extrasynaptic GABA(A) receptors is sufficient to elicit both electrographic and behavioral correlates of seizures in normal rats"
    explanation: >-
      Shows the aberrant thalamic GABAergic input is sufficient, not merely
      correlated, to produce absence-seizure correlates.
  downstream:
  - target: Enhanced Thalamic T-type Calcium Current
    causal_link_type: DIRECT
    description: >-
      Slow GABAergic hyperpolarization de-inactivates T-type calcium channels,
      enabling rebound bursting in relay neurons.
- name: Abnormal Thalamocortical Oscillation and Hypersynchrony
  description: >-
    The reciprocal loop between thalamic relay neurons, the thalamic reticular
    nucleus, and cortex enters an abnormal, highly synchronized oscillatory
    mode. This node captures the single concept of network hypersynchrony and
    conforms to the shared epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:11850474
    reference_title: "Cortical focus drives widespread corticothalamic networks during spontaneous absence seizures in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "widespread bilaterally synchronous spike-wave discharges (SWDs), which are the reflections of highly synchronized oscillations in thalamocortical networks"
    explanation: >-
      States that the generalized spike-wave discharge of absence seizures
      reflects highly synchronized oscillation within thalamocortical networks,
      supporting this node's network-hypersynchrony claim.
  - reference: PMID:11850474
    reference_title: "Cortical focus drives widespread corticothalamic networks during spontaneous absence seizures in rats."
    supports: PARTIAL

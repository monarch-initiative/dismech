discussions:
- discussion_id: cae-tcalcium-vs-gaba-primary-driver
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Enhanced Thalamic T-type Calcium Current"
  - "pathophysiology#Aberrant Thalamic GABAergic Inhibition"
  prompt: >-
    Spike-wave generation in the thalamocortical circuit requires both enhanced
    T-type calcium currents and GABAergic inhibition that de-inactivates those
    channels. Which is the primary driver in human childhood absence epilepsy,
    and how do cortical versus thalamic contributions interact to initiate the
    generalized discharge?
  rationale: >-
    Animal models implicate both an intrinsic thalamic T-type calcium
    conductance and enhanced tonic GABA-A inhibition, and there is evidence that
    the cortex, not the thalamus, may initiate the discharge. Resolving the
    relative contributions in humans matters for choosing molecular targets
    (T-type blockers such as ethosuximide versus GABAergic modulators, some of
    which paradoxically worsen absence seizures).
  proposed_experiments:
  - experiment_id: cae-circuit-dissection
    name: Circuit dissection of spike-wave initiation
    description: >-
      Combine cell-type-specific manipulation of thalamic T-type currents and
      reticular-thalamic GABAergic output in genetic absence models with
      simultaneous cortical and thalamic recording to determine the site and
      sequence of discharge initiation, ideally corroborated with human
      stereo-EEG.
    readouts:
    - name: Site and timing of spike-wave initiation
      target: "pathophysiology#Abnormal Thalamocortical Oscillation and Hypersynchrony"
    - name: Effect of T-type versus GABAergic manipulation on discharges
      target: "pathophysiology#Enhanced Thalamic T-type Calcium Current"
    would_support:
    - "pathophysiology#Enhanced Thalamic T-type Calcium Current"
    - "pathophysiology#Aberrant Thalamic GABAergic Inhibition"
- discussion_id: cae-glut1-subset-recognition
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Genetic Susceptibility to Absence Epilepsy"
  prompt: >-
    A minority of children presenting with an absence-epilepsy phenotype have
    GLUT1 (SLC2A1) deficiency, which is treatable with the ketogenic diet rather
    than standard antiseizure medication. What fraction of clinically diagnosed
    childhood absence epilepsy is actually GLUT1 deficiency, and which clinical
    features (very early onset, atypical course, movement disorder, low CSF
    glucose) should trigger SLC2A1 testing?
  rationale: >-
    Because the treatment implication is decisive (ketogenic diet), missing a
    GLUT1 case has real consequences. The prevalence of occult GLUT1 deficiency
    within absence cohorts and the optimal screening threshold are not firmly
    established, especially for onset before age four.
  proposed_experiments:
  - experiment_id: cae-glut1-screening-yield
    name: SLC2A1 screening yield in absence cohorts
    description: >-
      Systematically screen a large, prospectively ascertained cohort of
      children diagnosed with absence epilepsy for SLC2A1 variants and correlate
      positive findings with age at onset, seizure semiology, CSF glucose, and
      movement-disorder features.
    readouts:
    - name: SLC2A1 variant detection rate by clinical subgroup
      target: "pathophysiology#Genetic Susceptibility to Absence Epilepsy"
    decision_criterion: >-
      A clinically meaningful detection rate in an identifiable subgroup would
      support routine SLC2A1 testing for that subgroup.
    would_support:
    - "pathophysiology#Genetic Susceptibility to Absence Epilepsy"
- discussion_id: cae-attention-cognition-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Absence Seizures"
  - "pathophysiology#Abnormal Thalamocortical Oscillation and Hypersynchrony"
  prompt: >-
    Although childhood absence epilepsy is often called benign, many children
    have attentional and subtle cognitive difficulties. Are these caused
    directly by recurrent spike-wave activity disrupting attention networks
    (and therefore potentially reversible with seizure control), or do they
    reflect a shared genetic/developmental substrate independent of the
    seizures themselves?
  rationale: >-
    Attentional dysfunction is prominent in childhood absence epilepsy and is
    also modulated by drug choice, but pre-treatment deficits suggest a
    disease-intrinsic component. Distinguishing a seizure-driven mechanism from
    a shared developmental substrate would change how aggressively seizure
    freedom is pursued for cognitive protection.
  evidence:
  - reference: PMID:20200383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attentional dysfunction was more common with valproic acid than with ethosuximide"
    explanation: >-
      Documents prominent attentional dysfunction in a childhood absence
      epilepsy trial and its sensitivity to drug choice, motivating the
      seizure-driven-versus-shared-substrate question.
  - reference: PMID:18557780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duration of illness, seizure frequency, and antiepileptic drug (AED) treatment were related to the severity of the cognitive, linguistic, and psychiatric comorbidities"
    explanation: >-
      Shows comorbidity severity correlates with seizure frequency and illness
      duration, consistent with a partly seizure-driven contribution to the
      cognitive phenotype.
  proposed_experiments:
  - experiment_id: cae-attention-longitudinal
    name: Longitudinal attention and seizure-burden study
    description: >-
      Follow newly diagnosed, treatment-naive children with absence epilepsy
      with serial neuropsychological testing and EEG spike-wave quantification,
      testing whether attentional performance tracks spike-wave burden and
      improves with seizure control independent of medication effects.
    readouts:
    - name: Attention scores versus spike-wave burden over time
      target: "pathophysiology#Absence Seizures"
    would_support:
    - "pathophysiology#Absence Seizures"

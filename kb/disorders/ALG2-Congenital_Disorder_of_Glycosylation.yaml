  description: >-
    Evaluate ocular abnormalities and visual function and provide indicated optical or surgical care.
    The retired CDG overview recommends early pediatric ophthalmological consultation; the animal retinal
    phenotype does not establish a human retinitis-pigmentosa screening schedule.

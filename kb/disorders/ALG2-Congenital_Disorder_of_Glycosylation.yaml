inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ALG2-CDG requires two defective ALG2 alleles. The index patient was compound heterozygous for a single-nucleotide
    deletion and a single-nucleotide substitution; subsequent families have been homozygous or compound
    heterozygous.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis revealed that the patient was heterozygous for a single nucleotide deletion and
      a single nucleotide substitution in the human ortholog of yeast ALG2.
    explanation: >-
      Compound heterozygosity in the index patient, the founding observation for recessive transmission.
  - reference: PMID:33644825
    reference_title: >-
      Mass spectrometry glycophenotype characterization of ALG2-CDG in Argentinean patients with a new
      genetic variant in homozygosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALG2-CDG is a rare autosomal recessive inherited disorder characterized by neurological involvement,
      convulsive syndrome of unknown origin, axial hypotonia, and mental and motor regression.
    explanation: States the inheritance mode alongside the core clinical picture.
  - reference: url:https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    reference_title: https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      analyses of the patients ’ parents showed that they were heterozygous carriers for the identified
      variant.
    explanation: >-
      Three patients in two families; the Results contradict the table caption calling the variant de
      novo.
prevalence:
- population: Published cases reviewed in 2024
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2024 report identified 14 previously published individuals and added one Mexican child, giving
    15 in its comparative table. This is a historical literature count, not a population rate or a current
    complete count.
  evidence:
  - reference: PMID:38770420
    reference_title: >-
      Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2)
      as a specific diagnostic biomarker.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: To date, fourteen cases of ALG2-CDG have been documented worldwide.
    explanation: The introduction counts prior reports; the new patient is added in Table 2.
progression:
- phase: Variable neonatal or childhood onset
  notes: >-
    The index multisystem patient appeared normal at birth and developed manifestations during the first
    year. Other affected infants had hypotonia, weakness and feeding difficulty immediately after birth;
    one predominantly neuromuscular case became clearly symptomatic at age four.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient presented normal at birth but developed in the 1st year of life a multisystemic disorder
      with mental retardation, seizures, coloboma of the iris, hypomyelination, hepatomegaly, and coagulation
      abnormalities.
    explanation: An individual course, not a universal normal neonatal period.
  - reference: PMID:34980536
    reference_title: 'Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We present the case of a baby who immediately after birth presented with pronounced truncal hypotonia,
      proximal muscle weakness and feeding difficulties.
    explanation: Documents neonatal presentation.
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Symptoms became clearly apparent around the age of 4 years with falls and difficulty rising from
      the floor or climbing stairs.
    explanation: Documents later recognition in ALG2 Case 7.
- phase: Variable long-term disability and treatment response
  notes: >-
    Neuromuscular disease can progress slowly and lead to wheelchair dependence, while other individuals
    retain limited walking into adulthood. The treated Swedish child gained motor abilities during follow-up
    to 34 months. These reports do not establish life expectancy or a uniform progressive course.
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Cases 3, 4 and 5 showed slowly progressive deterioration and are now wheelchair dependent.
    explanation: Longitudinal observation in one family.
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Now at age 60 years, he is able to walk 15–20 m independently.
    explanation: Demonstrates adult survival with residual walking in a different genotype.
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the last clinical follow-up (at 34 months of age), she was able to get up from prone to standing
      position, sit without support, and move around by crawling and using a walker.
    explanation: Documents gains during treatment without implying normal motor development.
pathophysiology:
- name: Biallelic ALG2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous and compound heterozygous ALG2 variants impair function. The index genotype was compound
    heterozygous; homozygous missense and in-frame indel genotypes also occur. Variant-dependent abundance
    changes and deficient enzyme activity are distinct experimental observations.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Genetic analysis revealed that the patient was heterozygous for a single nucleotide deletion and
      a single nucleotide substitution in the human ortholog of yeast ALG2.
    explanation: Index compound heterozygous genotype.
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Expression of wild type but not of mutant hALG2 cDNA restored the mannosyltransferase activity and
      the biosynthesis of dolichol-linked oligosaccharides both in patient fibroblasts and in the alg2-1
      yeast cells.
    explanation: Functional complementation establishes the tested ALG2 defect.

- name: Coagulation assessment before procedures
  description: >-
    Assess coagulation when clinically indicated and before procedures, with hematology input for abnormalities.
    The general CDG guidance considers both procoagulant and anticoagulant factors; normal tests in an
    individual do not exclude ALG2-CDG.
  therapeutic_modality: OTHER

    patient muscle and transfected HEK293 cells, p.Gly80Asp and p.Gly347Valfs*27 in HEK293 cells, and
    p.Arg251Leu in overexpression models. These measurements do not distinguish altered synthesis, transcript
    decay or protein degradation, and do not establish that every allele acts exclusively through abundance.
  evidence:

- name: Abnormal Protein-Linked N-Glycan Structures
  biological_scale: MOLECULAR
  description: >-
    In addition to under-occupied sites, patient glycoproteins can carry abnormal N-glycan structures.
    A linear heptasaccharide NeuAc-Gal-GlcNAc-Man2-GlcNAc2 has been detected on transferrin and other
    plasma glycoproteins. A biosynthetic explanation involving processing of truncated precursors is proposed;
    the clinical mass-spectrometry measurements do not directly track precursor transfer or prove general
    diagnostic specificity.
  evidence:
  - reference: PMID:38770420
    reference_title: >-
      Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2)

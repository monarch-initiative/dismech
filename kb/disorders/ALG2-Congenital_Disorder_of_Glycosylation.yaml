name: ALG2-congenital disorder of glycosylation
creation_date: '2026-09-16T20:30:00Z'
description: >-
  ALG2-CDG is an autosomal recessive disorder of protein N-glycosylation caused by biallelic ALG2 variants.
  ALG2 adds the second and third mannose residues during lipid-linked oligosaccharide assembly on the
  cytosolic face of the endoplasmic reticulum. Deficiency impairs precursor assembly and glycoprotein
  glycosylation. Reported presentations range from multisystem developmental disease with seizures, hypotonia,
  ocular and brain abnormalities, and sometimes hepatic or coagulation involvement, to congenital myasthenic
  syndrome with predominantly proximal weakness. These presentations overlap and can be disabling. Serum
  transferrin screening may be abnormal or normal. Treatment is individualized; neuromuscular responses
  to pyridostigmine, salbutamol and ephedrine vary among reported individuals.

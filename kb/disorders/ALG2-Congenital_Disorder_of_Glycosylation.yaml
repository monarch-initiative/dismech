    This identifies deficient ALG2-dependent precursor elongation. It does not prove total pathway arrest,
    the linkage of every accumulating Man2 species, or obligatory transfer of all truncated precursors
    to protein.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED

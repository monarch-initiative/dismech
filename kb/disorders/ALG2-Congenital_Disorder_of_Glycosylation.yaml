- name: Respiratory assessment and support
  description: >-
    CMS guidance recommends baseline respiratory assessment and surveillance of strength and breathing,
    generally at least every six months in children and yearly in adults. Evaluate possible nocturnal
    hypoventilation and provide ventilatory support when clinically needed; an ALG2-specific interval
    has not been established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ALG2-CDG requires two defective ALG2 alleles. The index patient was compound
    heterozygous for a single-nucleotide deletion and a single-nucleotide
    substitution; subsequent families have been homozygous or compound
    heterozygous.
  evidence:
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis revealed that the patient was heterozygous for a single
      nucleotide deletion and a single nucleotide substitution in the human
      ortholog of yeast ALG2.
    explanation: >-
      Compound heterozygosity in the index patient, the founding observation for
      recessive transmission.
  - reference: PMID:33644825
    reference_title: Mass spectrometry glycophenotype characterization of ALG2-CDG in Argentinean patients with a new genetic variant in homozygosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALG2-CDG is a rare autosomal recessive inherited disorder characterized by
      neurological involvement, convulsive syndrome of unknown origin, axial
      hypotonia, and mental and motor regression.
    explanation: States the inheritance mode alongside the core clinical picture.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fourteen patients had been documented worldwide as of the 2024 Mexican case
    report; a 2021 series put the count at nine. No population prevalence
    estimate exists, and no Orphanet epidemiology class is published for this
    entity, so the case count is the only defensible figure.
  evidence:
  - reference: PMID:38770420
    reference_title: "Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2) as a specific diagnostic biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, fourteen cases of ALG2-CDG have been documented worldwide.
    explanation: Most recent published case count.
  - reference: PMID:33644825
    reference_title: Mass spectrometry glycophenotype characterization of ALG2-CDG in Argentinean patients with a new genetic variant in homozygosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to date, nine ALG2-CDG patients have been reported worldwide.
    explanation: Earlier case count, showing how slowly the cohort grows.
progression:
- phase: Normal at birth
  notes: >-
    Affected infants are not dysmorphic or obviously ill at delivery in the
    classic multisystem form; the index patient was explicitly normal at birth.
    This is not universal — the congenital myasthenic presentations are
    symptomatic from the first hours with hypotonia and feeding failure.
  evidence:
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient presented normal at birth but developed in the 1st year of life
      a multisystemic disorder with mental retardation, seizures, coloboma of the
      iris, hypomyelination, hepatomegaly, and coagulation abnormalities.
    explanation: Establishes the normal-at-birth, first-year-onset course.
- phase: First-year multisystem decompensation
  notes: >-
    Seizures, developmental delay and regression, hypotonia and hepatic and
    coagulation abnormalities emerge over the first year. A model of the index
    patient's allele shows the same late-onset, rapidly progressing pattern,
    which argues the delay is intrinsic to residual enzyme rather than to
    ascertainment.
  evidence:
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed specific, multisystemic, late-onset phenotypes, closely
      resembling the patient's syndrome, prominently in the facial skeleton and
      in neuronal tissue.
    explanation: >-
      An engineered model of the human allele reproduces the late-onset
      multisystem course rather than an embryonic lethal one.
pathophysiology:
- name: ALG2 Alpha-1,3/1,6-Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  description: >-
    Biallelic ALG2 variants reduce the abundance or catalytic activity of the ER
    membrane enzyme that adds both the alpha-1,3- and the alpha-1,6-mannose to
    Man1GlcNAc2-PP-dolichol. Reported alleles act by destabilising the protein
    rather than by abolishing catalysis on an otherwise normal enzyme: both the
    p.Gly80Asp missense and the p.Gly347Valfs*27 frameshift were shown to work
    through markedly reduced ALG2 expression, and the p.Arg251Leu homozygous
    allele likewise lowers protein level in a cell model.
  molecular_functions:
  - preferred_term: ALG2 alpha-1,3-mannosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0000033
      label: "alpha-1,3-mannosyltransferase activity"
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Stalled Dolichol-Linked Oligosaccharide Assembly
    causal_link_type: DIRECT
    description: >-
      Losing the branching mannosyltransferase stops precursor elongation at the
      point where ALG2 acts.
    evidence:
    - reference: PMID:12684507
      reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Incubation of patient fibroblast extracts with Man1GlcNAc2-PP-dolichol and
        GDP-mannose revealed a severely reduced activity of the mannosyltransferase
        elongating Man1GlcNAc2-PP dolichol.
      explanation: >-
        Direct enzymological demonstration in patient cells that the deficient
        step is the elongation of the dolichol-linked precursor.
  evidence:
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      hALG2 was shown to act as an alpha1,3-mannosyltransferase.
    explanation: Establishes the enzymatic identity of the deficient protein.
  - reference: PMID:34980536
    reference_title: "Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blot in whole cell lysates of HEK293 cells transfected with
      p.Gly80Asp, or p.Gly347Valfs*27 expression constructs indicated that
      p.Gly347Valfs*27 is likely a null allele and p.Gly80Asp is pathogenic
      through marked reduction of ALG2 expression.
    explanation: >-
      Shows the mechanism of two alleles is reduced protein abundance, not altered
      kinetics of a normally expressed enzyme.
  - reference: PMID:41190328
    reference_title: "In vitro cell model to dilucidate the underlying molecular mechanism associated with ophthalmic manifestation of congenital disorders of glycosylation: studying an ALG2-CDG patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutant ALG2 consistently shows a reduced Alg2 protein expression and lower
      glycan levels compared to wild-type controls
    explanation: >-
      Independent confirmation of the reduced-abundance mechanism for a third
      allele, p.Arg251Leu.
- name: Stalled Dolichol-Linked Oligosaccharide Assembly
  biological_scale: MOLECULAR
  description: >-
    ALG2 makes the first branch of the lipid-linked oligosaccharide, adding both
    the alpha-1,3- and alpha-1,6-mannose to Man1GlcNAc2-PP-dolichol to give the
    branched Man3GlcNAc2-PP-dolichol. When it is deficient the pathway backs up
    at the immediately preceding species: patient fibroblasts accumulate
    Man1GlcNAc2-PP-dolichol and Man2GlcNAc2-PP-dolichol instead of proceeding to
    the mature Glc3Man9GlcNAc2 donor.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  downstream:
  - target: Protein Hypoglycosylation
    causal_link_type: DIRECT
    description: >-
      A truncated lipid-linked oligosaccharide is a poor donor for the
      oligosaccharyltransferase, so glycosylation sequons go unoccupied.
    evidence:
    - reference: PMID:33644825
      reference_title: Mass spectrometry glycophenotype characterization of ALG2-CDG in Argentinean patients with a new genetic variant in homozygosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Comparing it to control samples, we have observed Tf under-occupancy of
        glycosylation site(s) typical of a defective N-glycan assembly and the
        occurrence of oligomannose and hybrid type N-glycans.
      explanation: >-
        Links the assembly defect to site under-occupancy on a specific serum
        glycoprotein in patients.
  evidence:
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An accumulation of Man1GlcNAc2-PP-dolichol and Man2GlcNAc2-PP-dolichol was
      observed in skin fibroblasts of the patient.
    explanation: >-
      The accumulating intermediates locate the block precisely at the ALG2 step.
  - reference: PMID:35136180
    reference_title: Topological and enzymatic analysis of human Alg2 mannosyltransferase reveals its role in lipid-linked oligosaccharide biosynthetic pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Alg2 mannosyltransferase adds both the α1,3- and α1,6-mannose (Man) onto
      ManGlcNAc2-pyrophosphate-dolichol (M1Gn2-PDol) in either order to generate
      the branched M3Gn2-PDol product.
    explanation: >-
      Defines the reaction whose loss produces the accumulating intermediates,
      and shows the enzyme is bifunctional so one lesion removes two steps.
- name: Protein Hypoglycosylation
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  description: >-
    Sequons on secreted and membrane glycoproteins go unoccupied and the glycans
    that are transferred are immature, giving a type I CDG serum transferrin
    pattern. ALG2-CDG additionally produces a specific abnormal transferrin
    glycoform — a linear heptasaccharide NeuAc-Gal-GlcNAc-Man2-GlcNAc2 — which
    directly reflects transfer of the stalled Man2 precursor and is used as a
    diagnostic biomarker. Reduced overall N-glycan levels are measurable in
    patient fibroblasts.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  downstream:
  - target: Neuromuscular Junction Glycoprotein Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acetylcholine receptor subunits and other endplate proteins are
      N-glycosylated, and glycosylation defects at this step impair neuromuscular
      transmission.
    evidence:
    - reference: PMID:23404334
      reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Identification of DPAGT1, ALG14 and ALG2 mutations as a cause of
        congenital myasthenic syndrome underscores the importance of
        asparagine-linked protein glycosylation for proper functioning of the
        neuromuscular junction.
      explanation: >-
        States the causal relationship between the N-glycosylation defect and
        neuromuscular junction failure.
  - target: Neurodevelopmental and Myelination Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hypoglycosylation of neuronal glycoproteins underlies the encephalopathy,
      hypomyelination and seizures of the multisystem form.
  - target: Hepatic and Coagulation Glycoprotein Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Coagulation factors and their inhibitors are N-glycoproteins, so their
      hypoglycosylation is the proximate cause of the coagulopathy.
  - target: Iris coloboma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Coloboma is a failure of optic fissure closure in the embryo, so it is
      placed on the developmental branch of hypoglycosylation rather than
      downstream of photoreceptor maintenance. Which glycoprotein's
      hypoglycosylation causes the fissure to stay open is not known, hence
      unknown intermediates.
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with coloboma on the developmental branch for the same reason. The
      source that quantifies the eye findings counts coloboma, strabismus and
      nystagmus together as one ocular category, so no route separating them is
      available.
  evidence:
  - reference: PMID:38770420
    reference_title: "Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2) as a specific diagnostic biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional studies, including determination of carbohydrate-deficient
      transferrin (CDT) revealed a mild type I CDG pattern and the presence of an
      abnormal transferrin glycoform containing a linear heptasaccharide
      consisting of one sialic acid, one galactose, one N-acetyl-glucosamine, two
      mannoses and two N-acetylglucosamines (NeuAc-Gal-GlcNAc-Man2-GlcNAc2),
      ALG2-CDG diagnostic biomarker, confirming the pathogenicity of these
      variants.
    explanation: >-
      The heptasaccharide is the direct glycan-level readout of the stalled Man2
      precursor being transferred to protein.
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Molecularly, we detected reduced levels of N-glycans in medaka and in the
      patient's fibroblasts.
    explanation: >-
      The one sentence reports the measurement in both the fish and the index
      patient's own fibroblasts, so it supports hypoglycosylation in human cells
      as well. It is graded MODEL_ORGANISM because that is what the citing
      publication is, and the same sentence is graded identically where it is
      reused on the medaka model's readout.
- name: Neuromuscular Junction Glycoprotein Dysfunction
  biological_scale: TISSUE
  description: >-
    Hypoglycosylation at the motor endplate produces a failure of neuromuscular
    signal transmission. This is the mechanism of the CMS14 presentation, in
    which single-fibre electromyography shows transmission failure and the
    weakness is fatigable and limb-girdle in distribution rather than the
    generalised encephalopathy of the classic form.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: DECREASED
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  cellular_components:

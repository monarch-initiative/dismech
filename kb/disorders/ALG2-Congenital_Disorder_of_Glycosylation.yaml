- name: ALG2 Alpha-1,3/1,6-Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
  description: >-
    ALG2-dependent mannosyltransferase activity is deficient. Normal human ALG2 catalyzes both alpha-1,3
    and alpha-1,6 mannose addition to form branched Man3GlcNAc2-PP-dolichol. Modern topology experiments
    place both termini in the cytosol, revising older transmembrane predictions. Patient enzyme assays
    and recombinant wild-type kinetic experiments answer different questions; no uniform kinetic defect
    is assigned to all variants.
  molecular_functions:
  - preferred_term: ALG2 alpha-1,3-mannosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0000033
      label: alpha-1,3-mannosyltransferase activity
  downstream:
  - target: Stalled Dolichol-Linked Oligosaccharide Assembly
    causal_link_type: DIRECT
    description: Deficient mannosyltransferase activity impairs the ALG2-dependent elongation steps.
    evidence:
    - reference: PMID:12684507
      reference_title: >-
        A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
        steps of dolichol-linked oligosaccharide biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Incubation of patient fibroblast extracts with Man1GlcNAc2-PP-dolichol and GDP-mannose revealed
        a severely reduced activity of the mannosyltransferase elongating Man1GlcNAc2-PP dolichol.
      explanation: Direct activity assay in index fibroblast extracts.
    - reference: PMID:12684507
      reference_title: >-
        A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
        steps of dolichol-linked oligosaccharide biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Expression of wild type but not of mutant hALG2 cDNA restored the mannosyltransferase activity
        and the biosynthesis of dolichol-linked oligosaccharides both in patient fibroblasts and in the
        alg2-1 yeast cells.
      explanation: Functional complementation establishes the tested ALG2 defect.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Incubation of patient fibroblast extracts with Man1GlcNAc2-PP-dolichol and GDP-mannose revealed
      a severely reduced activity of the mannosyltransferase elongating Man1GlcNAc2-PP dolichol.
    explanation: Direct activity assay in index fibroblast extracts.
  - reference: PMID:35136180
    reference_title: >-
      Topological and enzymatic analysis of human Alg2 mannosyltransferase reveals its role in lipid-linked
      oligosaccharide biosynthetic pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Alg2 mannosyltransferase adds both the α1,3- and α1,6-mannose (Man) onto ManGlcNAc2-pyrophosphate-dolichol
      (M1Gn2-PDol) in either order to generate the branched M3Gn2-PDol product.
    explanation: Defines normal catalytic functions tested in a recombinant system.
  - reference: PMID:35136180
    reference_title: >-
      Topological and enzymatic analysis of human Alg2 mannosyltransferase reveals its role in lipid-linked
      oligosaccharide biosynthetic pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: both the N- and C-termini of hAlg2 are oriented toward cytoplasmic side of the ER
    explanation: Topology experiments revise older predictions of an ER-luminal N terminus.
- name: Stalled Dolichol-Linked Oligosaccharide Assembly

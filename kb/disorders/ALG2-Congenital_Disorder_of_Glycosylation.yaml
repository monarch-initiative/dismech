    reference_title: https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Palpebral fissures, broad nasal bridge. Bilateral epicanthus. Bilateral convergent strabismus. Generalized
      hypotonia, joint laxity, and motor delay, Hypermobility.
    explanation: Directly documents strabismus in the specified reported individual or family.
biochemical:
- name: Carbohydrate-deficient transferrin, type I pattern
  notes: >-
    A type I transferrin pattern reflects reduced N-glycan site occupancy. The abnormality may be mild.
    Normal serum transferrin was explicitly reported in the Swedish myasthenic child and in the 2013 CMS
    series, so normal screening does not exclude ALG2-related disease.
  evidence:
  - reference: PMID:38770420
    reference_title: >-
      Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2)
      as a specific diagnostic biomarker.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: determination of carbohydrate-deficient transferrin (CDT) revealed a mild type I CDG pattern
    explanation: The transferrin pattern, explicitly described as mild.
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      analysis of serum transferrin proteoforms was done at Skåne University Hospital, Sweden, but no
      abnormalities were found.
    explanation: Direct normal screening result in the Swedish ALG2 case.
- name: NeuAc-Gal-GlcNAc-Man2-GlcNAc2 heptasaccharide transferrin glycoform
  notes: >-
    A linear heptasaccharide is a proposed diagnostic clue. The Argentinean study found only trace amounts
    and explicitly questioned reliability in its three-patient sample; the later Mexican report supplied
    additional support. These studies do not establish population diagnostic sensitivity or specificity,
    and detection should be interpreted with genetic and other biochemical findings.
  evidence:
  - reference: PMID:38770420
    reference_title: >-
      Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2)
      as a specific diagnostic biomarker.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an abnormal transferrin glycoform containing a linear heptasaccharide consisting of one sialic acid,
      one galactose, one N-acetyl-glucosamine, two mannoses and two N-acetylglucosamines (NeuAc-Gal-GlcNAc-Man2-GlcNAc2),
      ALG2-CDG diagnostic biomarker
    explanation: The biomarker claim, from the paper that proposes it.
  - reference: url:https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    reference_title: https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      due to the very low amount of this specific glycoform and to the small num- ber of recruited patients,
      we are not totally confident that this structure is a reliable biomarker
    explanation: The original glycomic study states its analytical and sample-size limitations.
- name: Cellular ALG2 activity and lipid-linked oligosaccharides
  notes: >-
    Specialized fibroblast assays can demonstrate deficient mannosyltransferase activity and accumulation
    of Man1/Man2-linked precursors; they are mechanistic functional tests rather than a universally available
    first-line screen.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Incubation of patient fibroblast extracts with Man1GlcNAc2-PP-dolichol and GDP-mannose revealed
      a severely reduced activity of the mannosyltransferase elongating Man1GlcNAc2-PP dolichol.
    explanation: Direct activity assay in index fibroblast extracts.
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An accumulation of Man1GlcNAc2-PP-dolichol and Man2GlcNAc2-PP-dolichol was observed in skin fibroblasts
      of the patient.
    explanation: The accumulating intermediates locate the block precisely at the ALG2 step.
genetic:
- name: ALG2
  gene_term:
    preferred_term: ALG2
    term:
      id: hgnc:23159
      label: ALG2
  relationship_type: CAUSATIVE
  notes: >-
    ALG2 encodes an ER-associated bifunctional mannosyltransferase. Both homozygous and compound heterozygous
    pathogenic genotypes occur. Abundance assays support selected variants, whereas the founding fibroblast
    study directly measured deficient enzyme activity and complementation. Clinical severity cannot be
    reliably inferred from missense versus truncating variant class alone.
  variants:
  - name: c.1040delG (p.Gly347Valfs*26), historical index notation
    description: >-
      Maternal index frameshift paired with a paternal substitution; modern reports use p.Gly347Valfs*27
      for c.1040del. The engineered medaka p.G336* is analogous but is not the identical human allele.
  - name: c.203T>G (p.Val68Gly)
    description: >-
      Homozygous in an adult with congenital myasthenic syndrome; ALG2 abundance was markedly reduced
      in muscle and transfected cells.
  - name: p.Gly72_Leu75delinsSerProArg
    description: >-
      Homozygous in Saudi Arabian neuromuscular families; reported nucleotide representations vary with
      normalization.
  - name: c.752G>T (p.Arg251Leu)
    description: >-
      Homozygous in three Argentinean patients, including two siblings. Later overexpression experiments
      found reduced protein abundance; lectin changes were not statistically significant.
  - name: p.Gly80Asp in trans with p.Gly347Valfs*27
    description: >-
      The missense allele was initially a VUS; parental testing established trans phase and allele-specific
      protein-expression studies supported its functional effect in the Swedish infant.
  - name: p.Pro322Thr in trans with p.Ser352Leufs*3
    description: >-
      The Mexican report classified Pro322Thr as a VUS and Ser352Leufs*3 as likely pathogenic. Patient
      glycosylation and protein assays support the combined genotype but do not isolate the effect of
      Pro322Thr.
  evidence:
  - reference: PMID:12684507
    reference_title: >-
      A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early
      steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Expression of wild type but not of mutant hALG2 cDNA restored the mannosyltransferase activity and
      the biosynthesis of dolichol-linked oligosaccharides both in patient fibroblasts and in the alg2-1
      yeast cells.
    explanation: Functional complementation establishes the tested ALG2 defect.
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Variant c.214_226delinsAGTCCCCGGC, p.72_75delinsSPR segregates with disease in the family
    explanation: Family segregation for the in-frame indel.
  - reference: PMID:34980536
    reference_title: 'Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Genetic analysis revealed a likely pathogenic variant c.1040del, p.(Gly347Valfs*27) in exon 2 and
      a variant of uncertain significance, c.239G>A, p.(Gly80Asp) in exon 1 of the ALG2 gene.
    explanation: Preserves the initial variant classifications.
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Through parental testing, the variants were conﬁrmed to be on opposite alleles.
    explanation: Parental segregation establishes trans phase in this family.
  - reference: PMID:24461433
    reference_title: >-
      Clinical and pathological heterogeneity of a congenital disorder of glycosylation manifesting as
      a myasthenic/myopathic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Muscle biopsies showed myopathic features, ragged red fibers and a sub-sarcolemmal accumulation
      of structurally normal mitochondria.
    explanation: Documents concomitant muscle pathology and limits a solely synaptic explanation.
has_subtypes:
- name: CMS14
  display_name: Congenital myasthenic syndrome 14 (ALG2 myasthenic presentation)
  description: >-
    The predominantly neuromuscular presentation of biallelic ALG2 deficiency features proximal or limb-girdle
    weakness and impaired neuromuscular transmission. It overlaps the multisystem spectrum and can be
    severe; absence of encephalopathy, ocular anomalies or coagulation abnormalities is not a defining
    exclusion. The genotype-to-phenotype relationship remains incompletely established.
  subtype_term:
    preferred_term: congenital myasthenic syndrome 14
    term:
      id: MONDO:0014543
      label: congenital myasthenic syndrome 14
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identify ALG14 and ALG2 as novel genes in which mutations cause a congenital myasthenic syndrome.
    explanation: Establishes the allelic myasthenic presentation.
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Mild learning difficulty is apparent.
    explanation: Central developmental involvement was noted even in the neuromuscular kindred.
treatments:
- name: Pyridostigmine
  description: >-
    Response is variable in ALG2-related myasthenia. Pyridostigmine greatly helped the adult Case 7 in
    the 2013 report, whereas the Swedish infant had no clear clinical or electrophysiological benefit.
    Treatment is selected and monitored by the neuromuscular team rather than assumed effective in every
    patient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Impaired Neuromuscular Transmission
    description: >-
      Cholinesterase inhibition prolongs acetylcholine availability and can compensate for impaired transmission
      without correcting glycosylation.
    evidence:
    - reference: PMID:23404334
      reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        He was re-diagnosed with myasthenia in his teens and started taking pyridostigmine, which greatly
        helped him
      explanation: Direct ALG2-specific response in Case 7.
    - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
      reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Neither the parents nor the physiotherapist noted any obvious clinical improvement upon AChEI
        treatment.
      explanation: Direct nonresponse in a different ALG2 patient.
  evidence:

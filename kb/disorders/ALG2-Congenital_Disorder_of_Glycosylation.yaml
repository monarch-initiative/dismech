    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Fatigable muscle weakness
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify ALG14 and ALG2 as novel genes in which mutations cause a
      congenital myasthenic syndrome.
    explanation: Establishes ALG2 as a neuromuscular junction disease gene.
  - reference: PMID:34980536
    reference_title: "Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single fibre electromyography showed neuromuscular transmission failure and
      salbutamol and ephedrine treatment improved both muscle weakness and
      neuromuscular transmission.
    explanation: >-
      Electrophysiological demonstration of transmission failure in an ALG2
      patient, with pharmacological reversal.
- name: Neurodevelopmental and Myelination Failure
  biological_scale: TISSUE
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  description: >-
    The classic multisystem form is dominated by central nervous system disease:
    global developmental delay with regression, intractable seizures including
    infantile spasms, and hypomyelination on imaging. The medaka model of the
    index patient's allele shows reduced white matter in mid- and hindbrain,
    matching the human imaging finding.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Seizures
    causal_link_type: DIRECT
  - target: Cerebral hypomyelination
    causal_link_type: DIRECT
  - target: Axial hypotonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41190328
    reference_title: "In vitro cell model to dilucidate the underlying molecular mechanism associated with ophthalmic manifestation of congenital disorders of glycosylation: studying an ALG2-CDG patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients with ALG2-CDG have a multisystem disorder with mental disability,
      iris coloboma, hepatomegaly, coagulation abnormalities, and defective
      myelination
    explanation: >-
      Summarises the human multisystem picture including the myelination defect.
      The quoted sentence is the paper's framing of the established human
      phenotype, not a result of its own cell-model experiments.
- name: Hepatic and Coagulation Glycoprotein Dysfunction
  biological_scale: ORGANISM
  description: >-
    Hepatomegaly and abnormal coagulation are recurrent extraneurological
    features. Coagulation factors and their regulators are N-glycoproteins
    synthesised in the liver, so their hypoglycosylation is the proximate cause
    of the coagulopathy; the same argument is standard across the type I CDGs.
    The finding is not universal in individual patients — the 2024 Mexican case
    had normal coagulation tests.
  downstream:
  - target: Hepatomegaly
    causal_link_type: DIRECT
  - target: Abnormality of coagulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient presented normal at birth but developed in the 1st year of
      life a multisystemic disorder with mental retardation, seizures, coloboma
      of the iris, hypomyelination, hepatomegaly, and coagulation abnormalities.
    explanation: >-
      The index patient's hepatic and coagulation involvement, quoted in the full
      sentence that lists the founding case's multisystem features.
- name: Photoreceptor Maintenance Failure
  biological_scale: TISSUE
  description: >-
    An engineered model of the index patient's allele loses rod photoreceptors
    progressively, with the phototransduction machinery massively
    under-represented at the protein level, giving retinitis pigmentosa. No human
    ALG2-CDG patient has been reported with retinitis pigmentosa, so this node
    records a model finding whose translational status is open; it is flagged as
    a human/model mismatch rather than asserted as human disease biology. The eye
    features that are established in patients are developmental — iris coloboma
    and nystagmus — not degenerative.

    This node is deliberately model-only: it has no inbound pathophysiology edge
    and no outbound edge to a human phenotype. An earlier version pointed it at
    Iris coloboma, which was wrong in the way this description already says it
    would be — coloboma is a failure of optic fissure closure during development,
    not a consequence of progressive rod loss. Wiring the node into the human
    chain in either direction would assert the translational claim the
    HUMAN_MODEL_MISMATCH discussion exists to hold open.
  evidence:
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These deficiencies relate to a specific failure to maintain rod
      photoreceptors, resulting in retinitis pigmentosa characterized by the
      progressive loss of these photoreceptors.
    explanation: >-
      The model result. It is recorded as model-organism evidence because no
      equivalent human observation exists.
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Proteins of the retinal phototransduction machinery, conversely, were
      massively under-represented in the alg2 model.
    explanation: >-
      The proteomic mechanism proposed for the photoreceptor loss in the model.

animal_models:
- name: Medaka alg2 p.G336* model
  species: Oryzias latipes
  genotype: Homozygous alg2 p.G336*
  publication: PMID:34106226
  description: >-
    CRISPR-engineered medaka carrying a C-terminal truncation near the position of the human index frameshift
    develop late embryonic craniofacial, cardiovascular, glycosylation and retinal abnormalities. The
    fish allele is analogous to, but not identical with, the human compound heterozygous genotype. Unrescued
    homozygotes die shortly after hatching.
  notes: >-
    One-cell mRNA injection is a preventive rescue, not treatment of established symptoms. Medaka mRNA
    restored survival to the experimental endpoint at 18 days post-hatching; human-mRNA snout rescue was
    less complete. Maternal protein persistence and compensatory enzyme changes are interpretations, not
    measured human onset mechanisms. Whole-fish proteomics measures abundance rather than protein degradation
    or secretion.

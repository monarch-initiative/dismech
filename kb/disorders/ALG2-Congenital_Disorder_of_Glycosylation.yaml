name: ALG2-congenital disorder of glycosylation
creation_date: "2026-09-16T20:30:00Z"
description: >-
  ALG2-congenital disorder of glycosylation (ALG2-CDG, formerly CDG-Ii) is an
  autosomal recessive disorder of protein N-linked glycosylation caused by
  biallelic ALG2 variants. ALG2 is the endoplasmic reticulum
  alpha-1,3/1,6-mannosyltransferase that builds the first branch point of the
  dolichol-linked oligosaccharide, adding the second and third mannose residues
  to Man1GlcNAc2-PP-dolichol. Because this is the branching step, its loss stalls
  the precursor at Man1-Man2GlcNAc2-PP-dolichol, and the truncated donor is
  transferred inefficiently, producing hypoglycosylation with a type I serum
  transferrin pattern. Patients appear normal at birth and then develop, in the
  first year, a multisystem disorder with global developmental delay, intractable
  seizures, axial hypotonia, iris coloboma, cerebral hypomyelination,
  hepatomegaly and coagulation abnormalities. A second, milder presentation
  exists: because ALG2 is also required at the neuromuscular junction, some
  biallelic genotypes present as a limb-girdle congenital myasthenic syndrome
  (CMS14) that responds to cholinesterase inhibitors, salbutamol and ephedrine.
  ALG2-CDG is exceptionally rare, with roughly fourteen patients reported
  worldwide as of 2024.
synonyms:
- ALG2-CDG
- CDG-Ii
- CDG1I
- congenital disorder of glycosylation type Ii
- carbohydrate-deficient glycoprotein syndrome type Ii
- alpha-1,3-mannosyltransferase deficiency
- mannosyltransferase 2 deficiency
- ALG2 deficiency

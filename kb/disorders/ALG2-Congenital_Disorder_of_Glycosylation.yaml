- name: Rod Photoreceptor Loss in the Medaka Model
  biological_scale: TISSUE
  description: >-
    Engineered homozygous medaka alg2 p.G336* mutants develop progressive rod-photoreceptor loss and apoptosis.
    Retinal protein abundance also falls, but the study does not resolve whether this causes or follows
    rod loss. This experimental phenotype has no assigned edge to human iris coloboma or nystagmus and
    does not establish human retinitis pigmentosa.
  evidence:
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      These deficiencies relate to a specific failure to maintain rod photoreceptors, resulting in retinitis
      pigmentosa characterized by the progressive loss of these photoreceptors.
    explanation: Whole-organism experimental phenotype.
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Consequently, the under-representation of retinal proteins in the mutant eyes can be interpreted
      as a direct consequence of the loss of cells.
    explanation: The source explicitly considers reverse direction between protein abundance and rod loss.

discussions:
- discussion_id: mismatch_alg2_retinitis_pigmentosa
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the progressive rod photoreceptor loss seen in the medaka alg2 model
    occur in human ALG2-CDG, and if not, why not?
  attaches_to:
  - "pathophysiology#Photoreceptor Maintenance Failure"
  rationale: >-
    The medaka model built from the index patient's allele develops retinitis
    pigmentosa with massively under-represented phototransduction proteins, and
    the authors present it as a central result. Human ALG2-CDG eye disease, by
    contrast, is reported as developmental — iris coloboma, nystagmus — with no
    published case of retinitis pigmentosa. The disagreement has at least three
    possible resolutions and nothing currently separates them: the fish dies 2-3
    days after hatching so the human timescale may simply be longer than anyone
    has looked; teleost and mammalian photoreceptor maintenance differ; or the
    human patients with the most severe alleles die or are too neurologically
    impaired for the retinal examination that would find it. This matters
    clinically, because if the first explanation is right then surviving
    ALG2-CDG patients need retinal surveillance nobody currently performs.
  proposed_experiments:
  - experiment_id: exp_alg2_retinal_surveillance
    name: Systematic retinal phenotyping of surviving ALG2-CDG patients
    description: >-
      Electroretinography and optical coherence tomography in the surviving
      published ALG2-CDG cohort, including those with the myasthenic
      presentation who are neurologically able to cooperate, to test whether
      subclinical rod dysfunction is present.
    would_support:
    - "pathophysiology#Photoreceptor Maintenance Failure"
  - experiment_id: exp_alg2_mouse_retina
    name: Retinal phenotyping of a mammalian hypomorphic Alg2 model
    description: >-
      Generate or characterise a mammalian hypomorphic Alg2 model with a lifespan
      long enough to observe photoreceptor turnover, and measure rod survival and
      phototransduction protein abundance against the medaka result.
- discussion_id: gap_alg2_genotype_presentation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a biallelic ALG2 genotype presents as the
    encephalopathic multisystem disorder or as a limb-girdle congenital
    myasthenic syndrome?
  attaches_to:
  - "pathophysiology#Protein Hypoglycosylation"
  - "has_subtypes#CMS14"
  rationale: >-
    The same gene and the same biochemical lesion give two clinical pictures that
    a clinician would not group together: intractable infantile epilepsy with
    coloboma, hypomyelination and coagulopathy on one side, and fatigable
    limb-girdle weakness responsive to salbutamol on the other. The obvious
    hypothesis is residual enzyme activity — more residual activity spares the
    brain and leaves only the endplate, which has the least safety margin. But
    the characterised alleles on both sides act by reducing protein abundance,
    and nobody has measured residual mannosyltransferase activity across enough
    genotypes to test a dose-response. With fourteen patients worldwide, the
    cohort may never be large enough, which is an argument for a cell-based
    activity assay rather than for waiting.
  proposed_experiments:
  - experiment_id: exp_alg2_allelic_series_activity
    name: Quantitative activity series across reported ALG2 alleles
    description: >-
      Express each published ALG2 allele in an ALG2-null background and measure
      lipid-linked oligosaccharide profiles quantitatively, producing a residual
      activity value per genotype that can be regressed against the reported
      clinical presentation.
notes: >-
  Scope and lump/split. This entry covers biallelic ALG2 deficiency as one
  disease, with the congenital myasthenic syndrome 14 presentation as a
  has_subtypes entry rather than a separate file. MONDO gives CMS14
  (MONDO:0014543) its own term as a child of MONDO:0011933, and the repository
  does carry a Congenital_Myasthenic_Syndrome_15 entry, so a separate file would
  not have been unprecedented. It is not done here because the upstream lesion,
  the enzymology and the transferrin biochemistry are the same, and what differs
  is which tissue's hypoglycosylation dominates — that is a subtype, not a
  second disease. If someone establishes an allele-to-presentation rule, the
  call is worth revisiting.

  Naming. The repository curates CDGs one file per gene with a
  <GENE>-Congenital_Disorder_of_Glycosylation name, and this entry follows that.
  Note that kb/disorders/ALG6-Congenital_Disorder_of_Glycosylation.yaml already
  states in its notes that a sibling ALG2 entry exists; it did not until this
  PR. That sentence is now true rather than aspirational, and was left
  unedited here so this PR stays scoped to one disease.

  What is deliberately absent. No datasets: block — a GEO search on ALG2 returns
  the calcium-binding protein ALG-2 (PDCD6) and ovarian granulosa cell studies
  far more often than the mannosyltransferase, which is the Named Entity
  Confusion trap this gene symbol is built for, and no ALG2-CDG-specific dataset
  was found. No clinical_trials: block — NCT05549219 tests GLM101 in PMM2-CDG,
  not in ALG2-CDG, and listing it here would misattribute a trial. No
  environmental: block. No frequency: values on phenotypes seen in single case
  reports, because with fourteen patients ascertained through three different
  clinical routes a proportion would report the ascertainment rather than the
  disease.

  GeneReviews. There is no ALG2-CDG-specific GeneReviews chapter. The nearest
  chapters are the Congenital Myasthenic Syndromes Overview (PMID:20301347),
  which covers the CMS14 presentation and is tagged, and the retired Congenital
  Disorders of N-Linked Glycosylation and Multiple Pathway Overview, which is
  marked for historical reference only and is not cited here. Verified with a
  direct PubMed genereviews[book] search for an ALG2 chapter, which returns none.

  The retired chapter is named by title with no identifier on purpose.
  check-genereviews matches chapter identifiers anywhere in the file, so writing
  its PMID here made the check report CITED_UNTAGGED against a chapter this very
  sentence says is not cited — the check cannot distinguish a citation from a
  mention that denies citing. With the identifier removed the check reports
  TAGGED. Note this also means the per-entry check never returns a bare
  NO_CHAPTER for this file: the CMS chapter matches by identity and is tagged, so
  the accurate statement is that no ALG2-specific chapter exists, not that the
  checker reports NO_CHAPTER.

  A note on the eye. The ophthalmological literature on this gene splits cleanly
  by species: human reports describe developmental eye malformation, animal and
  cell models describe photoreceptor degeneration. Both are curated, kept in
  separate nodes, and the disagreement is recorded as a HUMAN_MODEL_MISMATCH
  discussion rather than being merged into a single claim about "ocular
  involvement".

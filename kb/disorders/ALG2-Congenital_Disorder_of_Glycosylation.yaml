biochemical:
- name: Carbohydrate-deficient transferrin, type I pattern
  notes: >-
    Serum transferrin isoelectric focusing or mass spectrometry shows a type I
    CDG pattern with under-occupied glycosylation sites, consistent with an
    assembly rather than a processing defect. The pattern can be mild, so a
    normal-looking screen in a suggestive clinical picture does not exclude
    ALG2-CDG.
  evidence:
  - reference: PMID:38770420
    reference_title: "Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2) as a specific diagnostic biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      determination of carbohydrate-deficient transferrin (CDT) revealed a mild
      type I CDG pattern
    explanation: The transferrin pattern, explicitly described as mild.
- name: NeuAc-Gal-GlcNAc-Man2-GlcNAc2 heptasaccharide transferrin glycoform
  notes: >-
    A linear heptasaccharide transferrin glycoform is proposed as an ALG2-CDG
    specific diagnostic biomarker. It is the glycan the stalled Man2 precursor
    produces once it is transferred and processed, so its presence reads out the
    exact enzymatic step that is blocked.
  evidence:
  - reference: PMID:38770420
    reference_title: "Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2) as a specific diagnostic biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an abnormal transferrin glycoform containing a linear heptasaccharide
      consisting of one sialic acid, one galactose, one N-acetyl-glucosamine, two
      mannoses and two N-acetylglucosamines (NeuAc-Gal-GlcNAc-Man2-GlcNAc2),
      ALG2-CDG diagnostic biomarker
    explanation: The biomarker claim, from the paper that proposes it.
genetic:
- name: ALG2
  gene_term:
    preferred_term: ALG2
    term:
      id: hgnc:23159
      label: ALG2
  relationship_type: CAUSATIVE
  notes: >-
    ALG2 (9q31.1) encodes the ER alpha-1,3/1,6-mannosyltransferase. Every
    published ALG2-CDG genotype is biallelic. The functionally characterised
    alleles act by lowering protein abundance rather than by producing a
    normally-expressed but catalytically dead enzyme, which fits the observation
    that complete loss of ALG2 is expected to be lethal and that surviving
    patients carry hypomorphic combinations.
  variants:
  - name: c.1040delG (p.Gly347Valfs*26)
    description: >-
      The maternal allele of the index patient. A frameshift truncating the
      glycosyltransferase domain; used as the template for the medaka model.
  - name: p.Val68Gly
    description: >-
      Identified in one of the two congenital myasthenic syndrome kindreds and
      shown to severely reduce ALG2 expression in patient muscle and in culture.
  - name: c.752G>T (p.Arg251Leu)
    description: >-
      Homozygous in three Argentinean patients; reduces ALG2 protein level and
      glycan content in a photoreceptor cell model.
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were identified in two kinships, with mutation ALG2p.Val68Gly
      found to severely reduce ALG2 expression both in patient muscle, and in cell
      cultures.
    explanation: >-
      Gene-disease evidence for the myasthenic presentation, with the functional
      consequence measured in patient tissue.
  - reference: PMID:12684507
    reference_title: A new type of congenital disorders of glycosylation (CDG-Ii) provides new insights into the early steps of dolichol-linked oligosaccharide biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of wild type but not of mutant hALG2 cDNA restored the
      mannosyltransferase activity and the biosynthesis of dolichol-linked
      oligosaccharides both in patient fibroblasts and in the alg2-1 yeast cells.
    explanation: >-
      Complementation establishing that the ALG2 variants, and not another locus,
      cause the biochemical defect.
has_subtypes:
- name: CMS14
  display_name: Congenital myasthenic syndrome 14 (ALG2 myasthenic presentation)
  description: >-
    The neuromuscular-junction presentation of biallelic ALG2 deficiency:
    limb-girdle fatigable weakness with neuromuscular transmission failure, in
    patients who do not have the encephalopathy, coloboma and coagulopathy of the
    classic multisystem form. MONDO gives it its own identifier as a child of
    ALG2-CDG, and it is curated here as a subtype rather than a separate entry
    because the upstream lesion and the glycosylation biochemistry are identical
    — what differs is which glycoproteins' hypoglycosylation dominates the
    clinical picture. Whether that difference is allele-determined is not
    established.
  subtype_term:
    preferred_term: congenital myasthenic syndrome 14
    term:
      id: MONDO:0014543
      label: congenital myasthenic syndrome 14
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALG2 is an alpha-1,3-mannosyltransferase that also catalyses early steps in
      the asparagine-linked glycosylation pathway.
    explanation: >-
      Identifies the myasthenic syndrome gene as the same glycosylation enzyme,
      which is the argument for subtype rather than separate disease.
treatments:
- name: Cholinesterase inhibitor therapy
  description: >-
    Pyridostigmine and other cholinesterase inhibitors are the first-line
    pharmacological approach in the myasthenic presentation. The evidence is
    class-level rather than ALG2-specific: cholinesterase inhibitors help in most
    congenital myasthenic syndrome groups and are contraindicated in some, so the
    genetic subtype must be known before starting.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Neuromuscular Junction Glycoprotein Dysfunction
    description: >-
      Prolongs acetylcholine dwell time in the synaptic cleft, compensating for a
      reduced safety margin of transmission rather than correcting the
      glycosylation defect.
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Our findings suggest that treatment with cholinesterase inhibitors may
      improve muscle function in many of the congenital disorders of
      glycosylation.
    explanation: >-
      The authors' therapeutic inference from identifying ALG2 as a CMS gene. It
      is a suggestion about a class of disorders, not a trial result in ALG2
      patients, hence INDIRECT.
  - reference: PMID:36835142
    reference_title: Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      From a pharmacological point of view, cholinesterase inhibitors are
      effective in most groups of CMS, but are contraindicated in some groups of
      CMS.
    explanation: >-
      The class-level statement, including the contraindication warning that
      makes genotype-before-treatment the rule here. A review's synthesis across
      35 genes, not an ALG2 result.
- name: Beta-adrenergic agonist and ephedrine therapy
  description: >-
    Salbutamol (albuterol) and ephedrine improved both weakness and measured
    neuromuscular transmission in a genetically confirmed ALG2 infant. This is
    the one treatment claim in this entry supported by an observation in an ALG2
    patient rather than by extrapolation from the congenital myasthenic syndrome
    class.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: salbutamol
      term:
        id: NCIT:C215
        label: Albuterol
    - preferred_term: ephedrine
      term:
        id: NCIT:C472
        label: Ephedrine
  target_mechanisms:
  - target: Neuromuscular Junction Glycoprotein Dysfunction
    description: >-
      Both agents are used in congenital myasthenic syndromes to improve endplate
      function; the mechanism at the endplate is not established for either.
    evidence:
    - reference: PMID:34980536
      reference_title: "Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        salbutamol and ephedrine treatment improved both muscle weakness and
        neuromuscular transmission
      explanation: >-
        Response measured electrophysiologically as well as clinically, which is
        what makes it evidence about the endplate node specifically.
  evidence:
  - reference: PMID:34980536
    reference_title: "Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single fibre electromyography showed neuromuscular transmission failure and
      salbutamol and ephedrine treatment improved both muscle weakness and
      neuromuscular transmission.
    explanation: A single-patient response, the only ALG2-specific treatment datum.
- name: Supportive and multidisciplinary care
  description: >-
    Antiseizure medication for the epilepsy, gastrostomy for feeding failure,
    respiratory surveillance, and monitoring of coagulation and liver function.
    No disease-modifying therapy exists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately uncited at the entry level. No ALG2-specific management
    guideline or cohort description of supportive care has been published, and
    quoting a general CDG management statement would attribute to ALG2-CDG a
    recommendation nobody has made about it.
experimental_models:
- name: Medaka alg2 p.G336* knock-in
  experimental_model_type: OTHER
  description: >-
    A CRISPR knock-in medaka (Oryzias latipes) carrying a premature stop at the
    position orthologous to the index patient's c.1040delG allele. Homozygotes
    are normal through early embryogenesis and then decompensate shortly before
    hatching, dying 2-3 days post-hatch, which reproduces the human
    normal-at-birth, first-year-onset pattern in miniature.
  publication: PMID:34106226
  modeled_mechanisms:
  - target: Protein Hypoglycosylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reduced N-glycan levels were measured in the fish and, in the same study,
      in the patient's fibroblasts, so the molecular phenotype is matched across
      species.
    limitations: >-
      A teleost is not a mammal, and the allele modelled is a premature stop at
      the orthologous position rather than the human frameshift itself. The model
      is homozygous for one engineered allele where the index patient was
      compound heterozygous.
    readouts:
    - name: Total N-glycan level
      target: Protein Hypoglycosylation
      direction: DECREASED
      interpretation: >-
        The core biochemical defect, measured in both the model and human
        patient cells.
      evidence:
      - reference: PMID:34106226
        reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Molecularly, we detected reduced levels of N-glycans in medaka and in
          the patient's fibroblasts.
        explanation: The measurement, reported for model and patient together.
  - target: Photoreceptor Maintenance Failure
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Progressive rod loss with under-representation of phototransduction
      proteins. This is the model's most striking finding and its least
      transferable one.
    limitations: >-
      No human ALG2-CDG patient has been reported with retinitis pigmentosa.
      Teleost and mammalian retinas differ in rod regeneration capacity and in
      photoreceptor turnover, and the fish dies within days of hatching, so the
      timescale has no human counterpart. The node this links to exists only to
      hold the model finding.
    readouts:
    - name: Rod photoreceptor number
      target: Photoreceptor Maintenance Failure
      direction: DECREASED
      interpretation: Progressive elimination of rods over the fish's short lifespan.
      evidence:
      - reference: PMID:34106226
        reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These deficiencies relate to a specific failure to maintain rod
          photoreceptors, resulting in retinitis pigmentosa characterized by the
          progressive loss of these photoreceptors.
        explanation: The rod-loss result.
  evidence:
  - reference: PMID:34106226
    reference_title: A patient-based medaka alg2 mutant as a model for hypo-N-glycosylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We modelled a putative hypomorphic mutation described in an
      alpha-1,3/1,6-mannosyltransferase (ALG2) index patient (ALG2-CDG) to
      address the developmental consequences in the teleost medaka (Oryzias
      latipes).
    explanation: >-
      Establishes that the model was built from a human ALG2-CDG allele, which is
      what makes it informative for this disease.
- name: 661W photoreceptor cell line expressing ALG2 p.Arg251Leu
  experimental_model_type: CELL_LINE
  description: >-
    An immortalised mouse retinal cell line transfected with the homozygous
    p.Arg251Leu allele found in the Argentinean patients, used to test whether
    that allele reduces ALG2 protein and glycan levels in a photoreceptor-like
    context.
  publication: PMID:41190328
  modeled_mechanisms:

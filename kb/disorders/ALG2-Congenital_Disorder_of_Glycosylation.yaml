discussions:
- discussion_id: mismatch_alg2_retinitis_pigmentosa
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the progressive rod photoreceptor loss seen in the medaka alg2 model occur in human ALG2-CDG,
    and if not, why not?
  attaches_to:
  - pathophysiology#Rod Photoreceptor Loss in the Medaka Model
  rationale: >-
    Medaka alg2 mutants develop rod photoreceptor loss. The source proposes that this could be fish-specific
    or an unrecognized human phenotype. Lower retinal protein abundance could cause or follow rod loss.
    The model does not explain congenital coloboma and does not establish a clinical surveillance schedule;
    systematic human retinal data would help resolve translation.
  proposed_experiments:
  - experiment_id: exp_alg2_retinal_surveillance
    name: Systematic retinal phenotyping of surviving ALG2-CDG patients
    description: >-
      Electroretinography and optical coherence tomography in the surviving published ALG2-CDG cohort,
      including those with the myasthenic presentation who are neurologically able to cooperate, to test
      whether subclinical rod dysfunction is present.
    would_support:
    - pathophysiology#Rod Photoreceptor Loss in the Medaka Model
  - experiment_id: exp_alg2_mouse_retina
    name: Retinal phenotyping of a mammalian hypomorphic Alg2 model
    description: >-
      Generate or characterise a mammalian hypomorphic Alg2 model with a lifespan long enough to observe
      photoreceptor turnover, and measure rod survival and phototransduction protein abundance against
      the medaka result.
- discussion_id: gap_alg2_genotype_presentation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which variant, tissue and developmental factors determine the overlapping multisystem and predominantly
    neuromuscular presentations of ALG2 deficiency?
  attaches_to:
  - pathophysiology#Protein Hypoglycosylation
  - has_subtypes#CMS14
  rationale: >-
    Abundance and enzyme activity measurements are available for selected alleles, but there is no sufficiently
    characterized genotype series establishing a quantitative activity-to-clinical-severity relationship.
    Critical neuronal, hepatic and endplate glycoprotein substrates remain unresolved. The observed clinical
    overlap argues against treating the presentations as mutually exclusive or assuming that all missense
    alleles spare the brain.
  proposed_experiments:
  - experiment_id: exp_alg2_allelic_series_activity
    name: Quantitative activity series across reported ALG2 alleles
    description: >-
      Express each published ALG2 allele in an ALG2-null background and measure lipid-linked oligosaccharide
      profiles quantitatively, producing a residual activity value per genotype that can be regressed
      against the reported clinical presentation.
notes: >-
  The evidence base consists mainly of small families and case reports. Published patient counts and feature
  proportions describe selected reports rather than population prevalence. The neuromuscular presentation
  does not establish absence of central nervous system involvement. Actual full-text primary studies and
  the CMS GeneReviews chapter inform the clinical review; the CDG GeneReviews overview, last updated in
  2017 and retired in June 2026, is used only as historical general-CDG context. Experimental retinal
  and liposomal mannose-1-phosphate findings are kept separate from demonstrated human clinical outcomes.

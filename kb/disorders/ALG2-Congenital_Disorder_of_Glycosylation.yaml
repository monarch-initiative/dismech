- name: Beta-adrenergic agonist and ephedrine therapy
  description: >-
    In one Swedish child, salbutamol was started after pyridostigmine failed and was followed by improved
    strength and single-fiber EMG. Ephedrine was added later, with further parent-reported functional
    improvement and less fatigability. These sequential observations do not establish comparative efficacy
    or a uniform treatment response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: salbutamol
      term:
        id: NCIT:C215
        label: Albuterol
    - preferred_term: ephedrine
      term:
        id: NCIT:C472
        label: Ephedrine
  target_mechanisms:
  - target: Impaired Neuromuscular Transmission
    description: >-
      Both agents are used in congenital myasthenic syndromes to improve endplate function; the mechanism
      at the endplate is not established for either.
    evidence:
    - reference: PMID:34980536
      reference_title: 'Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: salbutamol and ephedrine treatment improved both muscle weakness and neuromuscular transmission
      explanation: >-
        Response measured electrophysiologically as well as clinically, which is what makes it evidence
        about the endplate node specifically.
  evidence:
  - reference: PMID:34980536
    reference_title: 'Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single fibre electromyography showed neuromuscular transmission failure and salbutamol and ephedrine
      treatment improved both muscle weakness and neuromuscular transmission.
    explanation: Direct clinical and electrophysiological response in one treated child.
- name: Antiseizure treatment
  description: >-
    Antiseizure treatment is individualized. The Mexican child initially had partial control with valproate
    plus levetiracetam and later better control with valproate plus lacosamide. Argentinean reports include
    other regimens and some seizure-free follow-up; these uncontrolled observations do not identify a
    universally preferred drug.
  therapeutic_modality: SMALL_MOLECULE

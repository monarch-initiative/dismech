diagnosis:
- name: Molecular diagnosis and segregation
  description: >-
    Evaluate biallelic ALG2 variants using a relevant CDG/CMS panel or exome/genome sequencing, with parental
    segregation and functional studies when variant interpretation remains uncertain. A VUS alone does
    not establish the molecular diagnosis.
  evidence:
  - reference: PMID:23404334
    reference_title: Congenital myasthenic syndromes due to mutations in ALG2 and ALG14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We performed linkage analysis, whole-exome and whole-genome sequencing to determine the underlying
      defect in patients with an inherited limb-girdle pattern of myasthenic weakness.
    explanation: Sequencing approaches used to identify the ALG2/ALG14 neuromuscular causes.
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Through parental testing, the variants were conﬁrmed to be on opposite alleles.
    explanation: ALG2-specific segregation example.
- name: Transferrin and plasma glycan analysis
  description: >-
    Transferrin isoelectric focusing or mass spectrometry can identify an assembly defect, while detailed
    glycomics can detect unusual linear glycans. A normal transferrin result does not exclude ALG2-associated
    myasthenia; the proposed heptasaccharide is an adjunctive clue with limited validation.
  evidence:
  - reference: PMID:38770420
    reference_title: >-
      Case report: Novel genotype of ALG2-CDG and confirmation of the heptasaccharide glycan (NeuAc-Gal-GlcNAc-Man2-GlcNAc2)
      as a specific diagnostic biomarker.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: determination of carbohydrate-deficient transferrin (CDT) revealed a mild type I CDG pattern
    explanation: The transferrin pattern, explicitly described as mild.
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      analysis of serum transferrin proteoforms was done at Skåne University Hospital, Sweden, but no
      abnormalities were found.
    explanation: Direct normal screening result in the Swedish ALG2 case.
  - reference: url:https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    reference_title: https://iris.cnr.it/bitstream/20.500.14243/448970/1/ALG2_CDG%20GJ.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      due to the very low amount of this specific glycoform and to the small num- ber of recruited patients,
      we are not totally confident that this structure is a reliable biomarker
    explanation: The original glycomic study states its analytical and sample-size limitations.
- name: Neuromuscular electrophysiology
  description: >-
    Repetitive nerve stimulation and single-fiber EMG assess neuromuscular transmission. Technical limitations
    can obscure a decrement in infants; the Swedish child had nonconclusive initial repetitive stimulation
    but marked jitter and blocking on single-fiber EMG. These tests characterize the neuromuscular phenotype
    and do not by themselves establish the causal gene.
  evidence:
  - reference: url:https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    reference_title: https://uu.diva-portal.org/smash/get/diva2:1642590/FULLTEXT01.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

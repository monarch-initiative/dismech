    explanation: Historical general-CDG procedural guidance.
- name: Genetic counseling and testing of relatives
  description: >-
    Offer segregation testing, counseling about autosomal recessive inheritance and family testing. When
    both parents carry the relevant pathogenic variants, each pregnancy has a 25% affected risk. Prenatal
    and preimplantation testing are possible once familial pathogenic variants are established; reproductive
    choices remain individual.

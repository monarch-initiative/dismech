diagnosis:
- name: Rubella IgM serology
  description: >-
    Detection of rubella-specific IgM antibody in serum, the mainstay of
    laboratory confirmation of rubella. Where rubella circulates little, a
    positive IgM result has low positive predictive value: most pregnant
    women referred to a national reference laboratory for a positive IgM or
    an IgG seroconversion did not have primary infection, so a positive
    result is followed by IgG avidity testing and other complementary
    investigation.
  measurements:
  - preferred_term: Rubella IgM
    term:
      id: LOINC:31616-6
      label: Rubella virus IgM Ab [Presence] in Serum
  notes: >-
    The method-less qualitative serum code is bound rather than an
    immunoassay- or latex-agglutination-specific variant, or one for
    cerebrospinal or other body fluid. The result is qualitative and no
    reference_ranges are recorded.
  evidence:
  - reference: PMID:28412379
    reference_title: "Challenges of measles and rubella laboratory diagnostic in the era of elimination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Laboratory investigation heavily relies on specific IgM serology and
      increasingly on virus detection by reverse transcription (RT)-PCR, but
      other methods such as IgG avidity testing and genetic characterization
      of virus strains have gained in importance.
    explanation: >-
      Review of the WHO European laboratory network naming IgM serology as
      the main confirmatory test for measles and rubella, with IgG avidity as
      a complementary method. Evidence source is OTHER as this is a review
      article.
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPV of seroconversion to assess maternal rubella primary infection is as
      low as 0.2 % (95 % CI: 0 %; 0.5 %) and PPV of positive RV-IgM is only of
      1.4 % (95 % CI: 0.99 %; 1.81 %).
    explanation: >-
      Reference-laboratory series in pregnant women showing the low positive
      predictive value of a positive IgM result and of IgG seroconversion.
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, for 3724/4104 (90.8 %) women, rubella primary-infection during
      pregnancy was formally excluded and maternal rubella primary-infection
      was only confirmed in 46/4104 (1.1 %) cases.
    explanation: >-
      Most pregnant women referred for IgG seroconversion or positive IgM did
      not have primary rubella.
- name: Rubella IgG serology
  description: >-
    Measurement of rubella-specific IgG in serum. IgG is how immunity to
    rubella is usually determined when women of childbearing age are
    screened, and IgG seroconversion during pregnancy is one of the two
    findings (with a positive IgM) that prompts investigation for maternal
    rubella. Seroconversion alone has very low positive predictive value for
    primary infection where rubella circulates little.
  measurements:
  - preferred_term: Rubella IgG
    term:
      id: LOINC:8014-3
      label: Rubella virus IgG Ab [Units/volume] in Serum
  notes: >-
    The method-less quantitative serum code is bound, rather than the
    qualitative presence code, because seroconversion is read across two
    results; LOINC also carries first- and second-specimen variants of this
    code, which name the sample rather than the test. No reference_ranges
    are recorded. Seroconversion is a change between two results rather than
    a band on one, and an IgG concentration taken as evidence of immunity is
    a property of immunity screening, not a diagnostic threshold for
    rubella; the cited sources state neither as a value.
  evidence:
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunity to rubella is usually determined by measuring the rubella
      virus-specific immunoglobulin G (RV-IgG).
    explanation: >-
      States that rubella IgG is the measure of immunity used in screening.
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case of seroconversion for RV-IgG and/or positive RVIgM during
      pregnancy, laboratories usually send serum samples to the French
      National Reference Laboratory (FNRL) for Rubella in order to perform
      complementary investigations and confirm or exclude rubella infection
      during pregnancy.
    explanation: >-
      IgG seroconversion in pregnancy triggers reference-laboratory
      investigation for maternal rubella.
- name: Rubella IgG avidity
  description: >-
    Measurement of the avidity of rubella-specific IgG, used after a
    positive IgM result, particularly in pregnancy, to confirm or exclude
    recent primary infection. IgG avidity is low in acute and recent primary
    rubella and rises over the following months; high avidity indicates
    pre-existing immunity, and rubella reinfections fall in the high-avidity
    group.
  measurements:
  - preferred_term: Rubella IgG avidity
    term:
      id: LOINC:34421-8
      label: Rubella virus IgG Ab avidity [Ratio] in Serum
  notes: >-
    The method-less serum avidity code is bound rather than the
    immunoassay-specific variant (LOINC:52986-7 Rubella virus IgG Ab
    avidity [Ratio] in Serum by Immunoassay). No reference_ranges are
    recorded. The low- and high-avidity cut-offs in the cited studies belong
    to their assays: PMID:9316732 reports a low avidity index (< 40%) up to
    6 weeks after onset of rash and a high index (> 60%) not before 13 weeks
    after infection, for a
    commercial rubella IgG ELISA with 35 mM diethylamine added to the
    washing buffer, and PMID:2723615 classes sera as low, borderline or high
    with its own avidity-ELISA without stating a cut-off in its abstract.
    A PubMed search for rubella IgG avidity with pregnancy, primary
    infection and low avidity returned these single-assay studies and no
    guideline or consensus threshold, so the avidity index is left
    unbanded.
  evidence:
  - reference: PMID:9316732
    reference_title: "Maturation of rubella IgG avidity over time after acute rubella infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurement of rubella IgG avidity is a good supplemental test for cases
      with rubella IgM reactivity to confirm or exclude a recent rubella
      infection.
    explanation: >-
      Serial-sample study establishing avidity as the supplemental test after
      a reactive IgM.
  - reference: PMID:9316732
    reference_title: "Maturation of rubella IgG avidity over time after acute rubella infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A low avidity index (< 40%) was seen up to 6 weeks after onset of rash.
    explanation: >-
      Low avidity marks recent primary rubella in this assay; the index value
      is specific to the diethylamine-eluted ELISA used.
  - reference: PMID:9316732
    reference_title: "Maturation of rubella IgG avidity over time after acute rubella infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The avidity index increased steadily in all patients during the observation time.
    explanation: >-
      Avidity rises over the months after acute rubella, which is what lets a
      low value date the infection.
  - reference: PMID:2723615
    reference_title: "Measurement of avidity of specific IgG for verification of recent primary rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, the measurement of IgG avidity is a powerful tool for the
      distinction of acute or recent primary rubella from pre-existing rubella
      immunity, including rubella reinfections.
    explanation: >-
      Clinical serum study showing avidity separates recent primary rubella
      from prior immunity and reinfection.
  - reference: PMID:2723615
    reference_title: "Measurement of avidity of specific IgG for verification of recent primary rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All sera with high IgG avidity originated from the previously immune
      subjects; the rubella reinfections were confined within this group.
    explanation: >-
      High avidity indicates prior immunity, and reinfections fall within it.
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional serological tests were performed, mainly immunoblot (to look
      for the presence of anti-E1 protective antibody) and RV-IgG avidity (to
      exclude or confirm primary infection).
    explanation: >-
      A national reference laboratory uses IgG avidity in pregnancy to
      exclude or confirm primary infection.

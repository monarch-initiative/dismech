      id: HP:0006536
      label: Airway obstruction
  evidence:
  - reference: PMID:29552057
    reference_title: "Two Lung Cancer Development-Related Genes, Forkhead Box M1 (FOXM1) and Apolipoprotein E (APOE), are overexpressed in Bronchial of Patients after Long-Term Exposure to Sulfur Mustard."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFTs have demonstrated more obstructive and restrictive spirometric patterns among patients compared to the controls."
    explanation: >-
      Direct spirometric comparison of exposed patients against controls. Note
      the patients in this study were selected for FEV1 between 50 and 80%, so
      the magnitude of the difference is partly an inclusion criterion; the
      pattern being mixed rather than purely obstructive is the point taken here.
  - reference: PMID:23735551
    reference_title: "Long-term effects of mustard gas on respiratory system of Iranian veterans after Iraq-Iran war: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spirometry results can reveal restrictive and obstructive pulmonary disease."
    explanation: >-
      Unselected review-level statement of the spirometric picture, cited in
      preference to the small selected series for the general claim.
- name: Asthma
  category: Respiratory
  description: >-
    Asthma is named alongside chronic bronchitis as one of the two most frequent
    delayed lung toxicities of sulfur mustard, and recurs in every review of the
    exposed veteran cohort.
  phenotype_term:
    preferred_term: Asthma
    term:
      id: HP:0002099
      label: Asthma
  evidence:
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients with SM-induced asthma and chronic bronchitis (most frequent delayed lung toxicities)"
    explanation: Names asthma as one of the two most frequent delayed pulmonary toxicities.
  - reference: PMID:23735551
    reference_title: "Long-term effects of mustard gas on respiratory system of Iranian veterans after Iraq-Iran war: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major respiratory complications are chronic obstructive pulmonary disease, bronchiectasis, and asthma."
    explanation: Independent listing of asthma among the major respiratory complications.
- name: Limbal stem cell deficiency
  category: Ocular
  description: >-
    Failure of the corneal stem cell compartment at the limbus. This is the
    lesion the whole delayed ocular arm turns on, and HPO has a term for it, so
    it is curated as a phenotype as well as a mechanism node.
  phenotype_term:
    preferred_term: Limbal stem cell deficiency
    term:
      id: HP:0032107
      label: Limbal stem cell deficiency
  evidence:
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Victims of keratitis problems suffer from impaired corneal sensation, recent and continuous corneal erosion, fatty and amyloid deposition, irregularity, thinning and corneal ulcers, limbal stem cell deficiency"
    explanation: Names limbal stem cell deficiency among the findings in sulfur mustard keratitis victims.
  - reference: PMID:15808253
    reference_title: "Chronic and delayed-onset mustard gas keratitis: report of 48 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular surface changes included chronic blepharitis and decreased tear meniscus in all patients, limbal ischemia (81.3%), and conjunctival vascular abnormalities (50%)."
    explanation: >-
      Limbal ischaemia in 81.3% of the delayed-keratitis series, the structural
      correlate of the stem cell compartment failing.
- name: Lung neoplasm
  category: Neoplastic
  description: >-
    Lung cancer arising decades after exposure, most often adenocarcinoma, and
    concentrated in the fibrotic and bronchiectatic lung.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:36539770
    reference_title: "The predictive association between radiological findings and lung cancer development in patients exposed to sulfur mustard gas: 4 decades follow up of 719 victims."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adenocarcinoma (38.1%) was the most common type of cancer."
    explanation: Histological distribution of the tumours arising in the followed cohort.
environmental:
- name: Battlefield exposure to sulfur mustard vapour and liquid
  exposure_term:
    preferred_term: exposure to sulfur mustard
    term:
      id: ECTO:9001175
      label: exposure to bis(2-chloroethyl) sulfide
  description: >-
    Deliberate military use, overwhelmingly the Iran-Iraq war of 1980-1988, is
    the source of almost all the natural-history data in this entry. Tens of
    thousands of Iranian combatants were exposed; the cohort has been followed for
    four decades and is the reason the delayed arm of this disease is
    characterised at all. Immediate mortality was low, in the range of a few
    percent, because open-air dispersal dilutes the agent - which is precisely why
    so many survivors were available to develop the chronic disease.
  influences_mechanisms:
  - target: Sulfur Mustard Penetration and Episulfonium Ion Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Battlefield vapour and liquid contact is the route by which the agent
      reaches skin, cornea and airway epithelium.
    evidence:
    - reference: PMID:22465472
      reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SM exposure occurs primarily through inhalation and absorption through skin and the anterior surface of the eye, making the lungs, the skin, and the eye as major targets of SM toxicity"
      explanation: >-
        States the exposure routes and the target tissues, which is the link
        between this exposure and the penetration node.
  evidence:
  - reference: PMID:38312548
    reference_title: "A 39 Year mortality study of survivors exposed to sulfur mustard agent: A survival analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary objective of this study was to analyze the long-term survival of 48,067 chemical warfare survivors who suffered from pulmonary, cutaneous, and ocular lesions in the decades following the Iran-Iraq war."
    explanation: Establishes the scale of the exposed cohort and the setting.
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "During the Iran-Iraq war, immediate mortality among the Iranian soldiers exposed to SM was only 3–4%, but decades later nearly half of the victims developed chronic respiratory complications"
    explanation: >-
      Supports the low acute mortality alongside high delayed morbidity, which is
      the epidemiological shape this entry is built around.
- name: Accidental civilian exposure to abandoned chemical munitions
  exposure_term:
    preferred_term: exposure to sulfur mustard
    term:
      id: ECTO:9001175
      label: exposure to bis(2-chloroethyl) sulfide
  description: >-
    Sulfur mustard is chemically stable and persists in buried or dumped
    munitions long after the conflict that produced them. Civilians encountering
    corroded shells or containers are exposed without knowing what the agent is,
    which is one reason biomarker confirmation matters clinically: the four cases
    that established the multi-biomarker time course were an accidental exposure
    to an unknown chemical, identified retrospectively.
  influences_mechanisms:
  - target: Sulfur Mustard Penetration and Episulfonium Ion Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Dermal contact with agent released from a corroded munition delivers the
      same lesion by the same route as a battlefield exposure.
    evidence:
    - reference: PMID:28962267
      reference_title: "Four sulfur mustard exposure cases: Overall analysis of four types of biomarkers in clinical samples provides positive implication for early diagnosis and treatment monitoring."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Chinese male individuals accidentally exposed to unknown chemicals and emerged erythema or blisters on contacted organism derma, then hospitalized."
      explanation: >-
        An accidental civilian dermal exposure producing the characteristic
        lesion, later confirmed as sulfur mustard.
  evidence:
  - reference: PMID:28962267
    reference_title: "Four sulfur mustard exposure cases: Overall analysis of four types of biomarkers in clinical samples provides positive implication for early diagnosis and treatment monitoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The old shells or containers of SM are still a large threat to civilian health."
    explanation: Establishes abandoned munitions as an ongoing civilian exposure source.
treatments:
- name: Immediate Skin Decontamination
  description: >-
    Copious water with neutral soap, and dilute sodium hypochlorite where
    available, removing agent still on the skin. This is the single highest-yield
    intervention and the only one that acts on the lesion before it is fixed:
    alkylation is complete within minutes, so decontamination buys back only the
    dose that has not yet reacted. Its benefit falls off steeply with delay.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: skin decontamination
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Sulfur Mustard Penetration and Episulfonium Ion Formation
    description: Removes unabsorbed agent before it can penetrate and cyclize.
  evidence:
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The best solution for decontamination is large amounts of water, using neutral soap and 0.5% sodium hypochlorite."
    explanation: Names the recommended decontamination method.
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The victims must remove from the contaminated zone immediately."
    explanation: Supports the time-critical framing of this intervention.
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "washing after this time is not beneficial"
    explanation: >-
      States that irrigation past the early window stops helping, which is the
      basis for the claim that this intervention's benefit falls off steeply
      with delay.
- name: Supportive and Intensive Care
  description: >-
    Humidified oxygen, bronchodilators, rehydration, mechanical ventilation where
    needed, antibiotics for secondary infection, respiratory physiotherapy, and
    burn-style wound care. There is no antidote, so this is the substance of acute
    management rather than an adjunct to one.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The important protective and conservative treatment of SM-induced pulmonary injuries include humidified oxygen, bronchodilators, NAC as muculytic, rehydration, mechanical ventilation, appropriate antibiotics and respiratory physiotherapy as clinically indicated."
    explanation: Enumerates the supportive measures that make up standard care.
  - reference: PMID:25055840
    reference_title: "The role of N-acetylcysteine in the management of acute and chronic pulmonary complications of sulfur mustard: a literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, there is no validated antidote, chemoprophylaxis and curative modality for pulmonary toxicities secondary to sulfur mustard exposure."
    explanation: Establishes that supportive care is the whole of management rather than a fallback.
- name: N-Acetylcysteine
  description: >-
    A glutathione precursor and direct radical scavenger, used both acutely and in
    chronic pulmonary management. It is the pharmacological agent that maps most
    directly onto a curated mechanism in this entry - the glutathione depletion
    node - which is the argument for it. A dedicated review reports clinical and
    paraclinical improvement in sulfur mustard bronchiolitis obliterans on oral
    NAC alone or combined with clarithromycin, while the same review and an
    independent one both state there is no validated antidote. Both are recorded
    below, and the entry does not resolve them, because "improves parameters in
    an established chronic complication" and "is not an antidote for the
    poisoning" are compatible claims about different things.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetylcysteine
      term:
        id: CHEBI:22198
        label: acetylcysteine
  target_mechanisms:
  - target: Glutathione Depletion and Oxidative Stress
    description: >-
      Replenishes the cysteine supply for glutathione synthesis, directly opposing
      the depletion this node describes.
  evidence:
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, N-acetyle cysteine (NAC) is recommended, none of them acts as specific or effective antidote."
    explanation: >-
      Records both the recommendation and the explicit caveat that it is not an
      antidote, which is why this treatment is not curated as one.
  - reference: PMID:25055840
    reference_title: "The role of N-acetylcysteine in the management of acute and chronic pulmonary complications of sulfur mustard: a literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "oral NAC alone (1200 or 1800 mg/day for 4 months) or at a dose 600 mg/day for 6 months in combination with clarithromycin (500 mg/day) have led to improvements of clinical and paraclinical pulmonary parameters of patients with bronchiolitis obliterans due to sulfur mustard"
    explanation: >-
      The positive clinical result, with doses and durations, in the chronic
      pulmonary complication rather than in the acute poisoning.
- name: Macrolide and Inhaled Corticosteroid Therapy for Bronchiolitis Obliterans
  description: >-
    Long-term azithromycin combined with an inhaled corticosteroid and long-acting
    beta-2 agonist, plus N-acetylcysteine, is the regimen used for established
    mustard-related bronchiolitis obliterans. Over five years of spirometry the
    rate of FEV1 decline in treated bronchiolitis obliterans patients was not
    significantly different from that in COPD patients treated to guideline, which
    the authors read as evidence the regimen works. Note this is a comparison
    against a different disease's treated course, not against untreated
    bronchiolitis obliterans, so it is suggestive rather than controlled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: fluticasone propionate
      term:
        id: CHEBI:31441
        label: fluticasone propionate
    - preferred_term: salmeterol
      term:
        id: CHEBI:9011
        label: salmeterol
  target_mechanisms:
  - target: Chronic IL-17-Dependent Airway Inflammation
    description: >-
      Macrolides and inhaled corticosteroids are used here for their
      anti-inflammatory rather than antibacterial or bronchodilator action.
  evidence:
  - reference: PMID:27832694
    reference_title: Long Term Follow-Up of Sulfur Mustard Related Bronchiolitis Obliterans Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BO patients were treated with inhaled Seretide 125-250/25 (2 puffs BID), azithromycin (250 mg, three times/week) and N-acetylcysteine (1200-1800/day)."
    explanation: The exact regimen and dosing this treatment entry describes.
  - reference: PMID:27832694
    reference_title: Long Term Follow-Up of Sulfur Mustard Related Bronchiolitis Obliterans Treatment.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The non-significant difference of FEV1 decline in BO compared to COPD patients suggests the effectiveness of azithromycin, inhaled steroid and N-acetyl cysteine in BO patients."
    explanation: >-
      The efficacy claim, marked indirect because it rests on an inference from a
      non-significant difference against a different disease's treated course
      rather than on a controlled comparison.
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, none of them, except macrolide antibiotics have been proved clinically."
    explanation: >-
      Independent statement singling out macrolides as the one class with clinical
      proof among the candidate agents.
- name: Sodium Thiosulfate Infusion
  description: >-
    A sulfur nucleophile intended to scavenge circulating agent, given within
    roughly an hour of exposure. It is not a validated antidote and the window is
    narrow enough that in most real exposures it has closed before the patient is
    identified.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium thiosulfate
      term:
        id: CHEBI:132112
        label: sodium thiosulfate
  evidence:
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sodium thiosulfate infusion (100-500 mg/kg/min) should be started up to 60 min after SM exposure."
    explanation: Dose and time window for this intervention.
- name: Cutaneous Wound Management
  description: >-
    Moist dressing, preferentially with silver sulfadiazine, plus analgesia,
    antipruritics, debridement (physical, enzymatic or laser) and autologous
    split-thickness grafting where indicated. This is the arm that treats the
    vesicant burn once it has formed, as distinct from decontamination, which
    acts before it does.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: burn wound care
    term:
      id: NCIT:C116681
      label: Wound Care Management
  target_mechanisms:
  - target: Skin Ulceration and Impaired Wound Healing
    description: >-
      Manages the denuded, slow-healing ulcer left when the blister roof is lost.
  evidence:
  - reference: PMID:31576778
    reference_title: Advances in treatment of acute sulfur mustard poisoning - a critical review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "moist dressing; preferably with silver sulfadiazine cream, analgesic, anti-pruritic, physically debridement, debridase, Laser debridement, followed by skin autologous split-thickness therapy as clinically indicated"
    explanation: Enumerates the recommended cutaneous wound management for sulfur mustard injury.
- name: Corneal and Limbal Allograft Surgery
  description: >-
    Allograft limbal stem cell transplantation, penetrating keratoplasty and
    lamellar keratoplasty for advanced mustard gas keratopathy. The rationale
    follows directly from the mechanism: if the limbal stem cell pool is gone, the
    cornea cannot resurface itself and the deficit has to be replaced rather than
    treated medically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: corneal and limbal allograft transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  target_mechanisms:
  - target: Limbal Stem Cell Deficiency and Delayed Mustard Gas Keratopathy
    description: Replaces the exhausted limbal stem cell population or the scarred cornea itself.
  evidence:
  - reference: PMID:15808253
    reference_title: "Chronic and delayed-onset mustard gas keratitis: report of 48 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "others underwent allograft stem cell transplantation (20 eyes of 17 patients), penetrating keratoplasty (12 eyes of 12 patients), and lamellar keratoplasty (4 eyes of 3 patients)"
    explanation: Documents the surgical procedures used in this patient population and their frequency.
- name: Investigational Mesenchymal Stromal Cell Therapy for Mustard Keratopathy
  description: >-
    Intrastromal injection of mesenchymal stem/stromal cells, tested in a mouse
    model of mustard keratopathy. It reduced corneal opacity and, notably, cut
    beta-galactosidase staining - a senescence marker - which is the result that
    makes it interesting mechanistically rather than only clinically: it implies
    cellular senescence is part of what sustains the delayed corneal lesion.
    Corneal neovascularization and fibrosis did not improve significantly. This is
    pre-clinical and is curated as investigational, not as available treatment.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: mesenchymal stromal cell therapy
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Limbal Stem Cell Deficiency and Delayed Mustard Gas Keratopathy
    description: >-
      Delivered into the corneal stroma to counter the opacification and, on the
      senescence evidence, possibly the process driving it.
  evidence:
  - reference: PMID:38067171
    reference_title: "The Potential of Mesenchymal Stem/Stromal Cell Therapy in Mustard Keratopathy: Discovering New Roads to Combat Cellular Senescence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The treatment group demonstrated reduced opacity compared to the control group."
    explanation: The primary positive result in the mouse mustard keratopathy model.
  - reference: PMID:38067171
    reference_title: "The Potential of Mesenchymal Stem/Stromal Cell Therapy in Mustard Keratopathy: Discovering New Roads to Combat Cellular Senescence."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "While corneal neovascularization did not display significant variations between the groups, the control group did register higher numerical values."
    explanation: >-
      Recorded as REFUTE against the broader claim that this therapy addresses
      the keratopathy as a whole: neovascularization, one of the two dominant
      corneal signs, did not respond significantly.
progression:
- phase: Latent period
  duration: 1 to 24 hours from exposure
  notes: >-
    Cellular injury begins within minutes but nothing is visible. The victim feels
    little or nothing, which is the tactical point of the agent and the clinical
    trap: people continue to be exposed, and decontamination is deferred past the
    window in which it helps.
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "SM and NM have a latent period after exposure before any symptoms manifest and are inversely proportional to the dose."
    explanation: >-
      States the latent period directly and records that its length varies
      inversely with dose, which is the claim this phase makes.
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "This study also found that vesication sharply increased between 4 and 8 h after exposure, was well established, and remained elevated at 8‐ and 24‐h post‐exposure"
    explanation: >-
      Times the emergence of the lesion after exposure. Indirect because the cited
      experiment used the nitrogen mustard analogue in a mouse ear model.
- phase: Acute injury
  duration: Hours to days
  notes: >-
    Erythema then vesication of contacted skin; keratoconjunctivitis with pain,
    lacrimation and blepharospasm; rhinorrhoea, hoarseness and cough progressing
    in severe inhalational exposure to tracheobronchitis, pseudomembrane formation
    and acute lung injury. Direct mortality is low - a few percent in open-air
    battlefield exposure.
  evidence:
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Feeling severe pain in the eyes, laceration, photophobia, blepharospasm and reduced visual acuity after 2 to 6 hours, also after 12 hours the patient poses with temporary and transient blindness, and spontaneous recovery will occur after 48 hours"
    explanation: Times the acute ocular course from onset through spontaneous recovery.
- phase: Recovery
  duration: Weeks to months
  notes: >-
    Most acute lesions heal. Corneal epithelium regenerates over days, with full
    ocular recovery taking six weeks or more; skin ulcers heal slowly and scar. A
    patient can pass through this phase apparently well and still develop the
    delayed disease.
  evidence:
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "but complete corneal regeneration of the corneal epithelium is seen after 4 to 5 days, although complete recovery requires 6 weeks and even more"
    explanation: The timescale of acute ocular healing.
- phase: Delayed and progressive disease
  duration: Years to decades
  notes: >-
    The phase that defines the disease. Bronchiolitis obliterans, bronchiectasis
    and pulmonary fibrosis emerge and worsen year on year; mustard gas keratopathy
    appears after a silent interval; lung cancer risk rises. This can develop in
    patients whose acute exposure caused no distress at the time, which is why
    exposure history rather than acute severity is the indication for long-term
    surveillance.
  evidence:
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SM is the only warfare agent which has severe delayed effects and causes progressive incapacitation of victims."
    explanation: States that the progressive delayed course is specific to this agent among warfare agents.
  - reference: PMID:15808253
    reference_title: "Chronic and delayed-onset mustard gas keratitis: report of 48 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 48 patients, 31 (64.6%) had chronic symptomatology, whereas 17 (35.4%) experienced delayed-onset lesions."
    explanation: >-
      Splits the ocular cohort into continuously symptomatic and true
      delayed-onset presentations, which is the distinction this phase records.
prevalence:
- population: Iranian chemical-warfare survivors of the Iran-Iraq war
  measure_type: CASES_IN_LITERATURE
  notes: >-
    48,067 registered survivors with pulmonary, cutaneous or ocular lesions were
    followed for 39 years; 4,342 (9.03%) died during the study period. This is a
    count of a registered exposed cohort, not a population prevalence: the disease
    is exposure-defined, so no denominator of the general population applies.
  evidence:
  - reference: PMID:38312548
    reference_title: "A 39 Year mortality study of survivors exposed to sulfur mustard agent: A survival analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study included a total of 48,067 observations, and among them, 4342 (9.03 %) died during the study period."
    explanation: The cohort size and observed mortality over the follow-up period.
diagnosis:
- name: Exposure history plus the delayed vesicant syndrome
  description: >-
    There is no bedside confirmatory test. Diagnosis rests on a known or suspected
    exposure followed, after a latent interval, by the triad of vesicant burn,
    keratoconjunctivitis and airway injury. Because the latent period separates
    cause from effect, the exposure is often not volunteered and has to be asked
    for.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical findings in acute conditions include; sore eyes, lacrimation, burning sensation, edematous, obvious blepharospasm of eyelids, severe conjunctivitis, erosion and opacity of the cornea."
    explanation: The clinical findings that, with an exposure history, constitute the diagnosis.
- name: Biomarker confirmation of exposure
  description: >-
    Four biomarker classes confirm sulfur mustard retrospectively, and they have
    different detection windows: hydrolysis and oxidation products and beta-lyase
    metabolites are short-lived, DNA adducts remain detectable in urine for about
    30 days, and N-terminal valine adducts on haemoglobin persist beyond 90 days.
    Concentrations track clinical severity, so the assay is prognostic as well as
    confirmatory. This is the test that identified an accidental exposure to an
    unknown agent after the fact.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:28962267
    reference_title: "Four sulfur mustard exposure cases: Overall analysis of four types of biomarkers in clinical samples provides positive implication for early diagnosis and treatment monitoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DNA adducts in urine samples still appeared on the 30th day, and the N-terminal valine adducts in hemoglobin could be monitored for over 90 days"
    explanation: The two long-window biomarkers and their detection intervals.
  - reference: PMID:28962267
    reference_title: "Four sulfur mustard exposure cases: Overall analysis of four types of biomarkers in clinical samples provides positive implication for early diagnosis and treatment monitoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The concentrations of the biomarkers in specimens revealed a good correlation with the severity of the patient's symptom."
    explanation: Supports the prognostic as well as confirmatory use of the assay.
- name: High-resolution CT for delayed pulmonary disease
  description: >-
    HRCT is the modality of choice for the delayed pulmonary arm, showing air
    trapping, bronchiectasis, large-airway narrowing and fibrosis. Plain chest
    radiography misses roughly half of the lung disease. HRCT findings are also
    prognostic for lung cancer, which makes serial scanning a surveillance tool
    rather than only a diagnostic one.
  diagnosis_term:
    preferred_term: high resolution computed tomography
    term:
      id: NCIT:C20644
      label: High Resolution Computed Tomography
  evidence:
  - reference: PMID:23735551
    reference_title: "Long-term effects of mustard gas on respiratory system of Iranian veterans after Iraq-Iran war: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plain chest X-ray does not help in about 50% of lung diseases."
    explanation: Quantifies the shortfall of plain radiography that motivates HRCT.
  - reference: PMID:23735551
    reference_title: "Long-term effects of mustard gas on respiratory system of Iranian veterans after Iraq-Iran war: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-resolution CT of the lung is the best modality for diagnostic assessment of parenchymal lung and bronchi."
    explanation: Establishes HRCT as the recommended modality.
biochemical:
  - name: Serum interleukin-6
    presence: INCREASED
    notes: >-
      Serum IL-6 is elevated in sulfur mustard injured patients relative to
      controls and is higher again in those with moderate to severe pulmonary
      symptoms. It is a severity correlate, not a diagnostic test - IL-6 rises in
      many inflammatory lung diseases - but it is the human measurement that
      corresponds to the cytokine burst characterised in the animal models.
    evidence:
    - reference: PMID:25031491
      reference_title: The role of serum level of interleukin-6 in severity of pulmonary complications of sulfur mustard injuries.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The measured IL6 mean level in patients with chemical injuries (0.76±0.3 ng/ml) was significantly higher than the control group's mean level (0.34±0.12 ng/ml)."
      explanation: The case-control difference in serum IL-6.
  - name: Haemoglobin N-terminal valine adduct
    presence: INCREASED
    notes: >-
      The longest-window exposure biomarker, detectable for more than 90 days by
      GC-MS after modified Edman degradation. It is a direct chemical record of
      the alkylation event the pathophysiology begins with.
    evidence:
    - reference: PMID:28962267
      reference_title: "Four sulfur mustard exposure cases: Overall analysis of four types of biomarkers in clinical samples provides positive implication for early diagnosis and treatment monitoring."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the N-terminal valine adducts in hemoglobin could be monitored for over 90 days"
      explanation: Establishes the detection window for this adduct class.
animal_models:
- name: Rat sulfur mustard vapour inhalation model (biphasic lung injury)
  species: Rat
  publication: PMID:33002157
  description: >-
    Rats exposed to sulfur mustard vapour at 0.2 to 0.6 mg/kg. The
    striking finding is that the pathology is biphasic: damage at 3 days,
    apparent improvement at 7 to 16 days, then a second and worse wave at 28 days
    with distal bronchiolar epithelial necrosis and interstitial fibrosis. That
    shape is the animal counterpart of the human latent-then-delayed course, which
    is what makes the model useful for something other than acute toxicity.
  modeled_mechanisms:
  - target: Cellular Energy Collapse and Epithelial Necrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces airway epithelial necrosis after inhalational exposure.
    limitations: >-
      The model reads the lesion histologically and does not measure the NAD+ or
      ATP depletion that this node asserts as its mechanism, so it supports the
      outcome rather than the pathway.
    readouts:
    - name: Distal bronchiolar epithelial necrosis on histopathology
      target: Cellular Energy Collapse and Epithelial Necrosis
      direction: INCREASED
      interpretation: Histological correlate of the epithelial death node.
      evidence:
      - reference: PMID:33002157
        reference_title: "Progressive Lung Injury, Inflammation, and Fibrosis in Rats Following Inhalation of Sulfur Mustard."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "including epithelial necrosis and hyperplasia in the distal bronchioles, thickened alveolar walls, enlarged vacuolated macrophages, and interstitial fibrosis"
        explanation: Reports the histological measurement behind this readout.
  evidence:
  - reference: PMID:33002157
    reference_title: "Progressive Lung Injury, Inflammation, and Fibrosis in Rats Following Inhalation of Sulfur Mustard."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate a similar pathologic response to inhaled SM in rats and humans suggesting that this rodent model can be used for mechanistic studies"
    explanation: The authors' own claim that the model parallels the human respiratory pathology.
  - reference: PMID:33002157
    reference_title: "Progressive Lung Injury, Inflammation, and Fibrosis in Rats Following Inhalation of Sulfur Mustard."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Time course studies revealed that the pathologic response was biphasic."
    explanation: Establishes the biphasic course that makes this model informative for the delayed arm.
- name: Rat sulfur mustard inhalation model of bronchiolitis obliterans and pulmonary fibrosis
  species: Rat
  publication: PMID:29314868
  description: >-
    Sprague-Dawley rats given 1.0 mg/kg sulfur mustard by intubation and followed
    to 28 days, with histopathology, pulmonary function testing and measurement of
    TGF-beta, PDGF and PAI-1. This is the model that ties the profibrotic
    mediators to both lesions at once.
  modeled_mechanisms:
  - target: TGF-beta Driven Myofibroblast Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Measures the profibrotic mediators directly in lung, lavage fluid and
      plasma at 28 days.
    limitations: >-
      Rodent lifespan makes the human multi-decade course unmodellable: 28 days of
      rat follow-up stands in for forty years of human disease, so the model can
      show that the pathway engages but not that it keeps engaging.
    readouts:
    - name: Lung and plasma TGF-beta, PDGF and PAI-1 concentrations
      target: TGF-beta Driven Myofibroblast Activation
      direction: INCREASED
      interpretation: Direct measurement of the profibrotic signalling this node asserts.
      evidence:
      - reference: PMID:29314868
        reference_title: Bronchiolitis Obliterans and Pulmonary Fibrosis after Sulfur Mustard Inhalation in Rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Concentrations of TGF-β, PDGF, and PAI-1 were elevated at 28 days in lung, BAL fluid, and/or plasma."
        explanation: The mediator measurement behind this readout.
  - target: Bronchiolitis Obliterans and Progressive Airflow Obstruction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces both the histological lesion and the physiological deficit.
    limitations: >-
      Whole-organism pulmonary function testing in a rat reports resistance and
      compliance rather than the spirometric indices used clinically, so the
      physiological endpoints are analogous rather than identical.
    readouts:
    - name: Lung resistance and compliance
      target: Bronchiolitis Obliterans and Progressive Airflow Obstruction
      direction: ALTERED
      interpretation: Physiological correlate of obliterated small airways and stiffened parenchyma.
      evidence:
      - reference: PMID:29314868
        reference_title: Bronchiolitis Obliterans and Pulmonary Fibrosis after Sulfur Mustard Inhalation in Rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pulmonary function testing demonstrated a time-dependent increase in lung resistance, as well as a decrease in lung compliance."
        explanation: The functional measurement behind this readout.
  evidence:
  - reference: PMID:29314868
    reference_title: Bronchiolitis Obliterans and Pulmonary Fibrosis after Sulfur Mustard Inhalation in Rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Time-dependent development of BO and PF occurs in lungs of rats exposed to SM inhalation"
    explanation: Establishes that this model develops both named human lesions.
- name: Cynomolgus monkey sulfur mustard inhalation model
  species: Cynomolgus monkey
  publication: PMID:22465472
  description: >-
    Non-human primates exposed to sulfur mustard at 150 mg/m3 by intubation. Its
    contribution is the IL-17 arm: IL-17-positive cells accumulate in inflamed
    lung regions at 30 days and beyond, in a species much closer to human than the
    rat data collected alongside it.
  modeled_mechanisms:
  - target: Chronic IL-17-Dependent Airway Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Demonstrates IL-17-positive cell accumulation in the chronic phase in a primate.
    limitations: >-
      The IL-17 cells are localised in inflamed tissue rather than shown to be
      necessary for the fibrosis, so the model establishes association with the
      chronic phase and not that this arm drives it.
    readouts:
    - name: IL-17-positive cells in inflamed lung regions
      target: Chronic IL-17-Dependent Airway Inflammation
      direction: INCREASED
      interpretation: Cellular correlate of the IL-17 arm of chronic inflammation.
      evidence:
      - reference: PMID:22465472
        reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "At ≥30 days, SM inhalation promoted the accumulation of IL-17(+) cells in the inflamed areas of monkey lungs."
        explanation: The primate measurement behind this readout.
  evidence:
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IL-17(+) cells likely play an important role in the pathogenesis of SM-induced lung injury."

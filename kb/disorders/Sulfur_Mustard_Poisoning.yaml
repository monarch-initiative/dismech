discussions:
- discussion_id: sm_delayed_toxicity_mechanism_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What sustains sulfur mustard disease for decades after a single exposure, when
    the agent and its metabolites have been cleared within weeks?
  rationale: >-
    This is the central unanswered question of the entry. Sulfur mustard
    metabolites are excreted within a few weeks and do not accumulate, so nothing
    of the original insult is still present when the delayed disease emerges. The
    chain curated here carries the mechanism as far as chronic IL-17-dependent
    inflammation and shows that it persists, but it does not explain why it
    persists rather than resolving as inflammation normally does. Epigenetic
    perturbation has been proposed as the missing step and remains a hypothesis.
    Until it is settled, the causal edge from acute injury to chronic inflammation
    in this entry is descriptive rather than mechanistic.
  attaches_to:
  - pathophysiology#Chronic IL-17-Dependent Airway Inflammation
  evidence:
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unfortunately, it is not clear how mustard gas causes severe multi-organ damage years after even a single exposure"
    explanation: States the gap directly.
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A possible explanation of the delayed mechanism would be epigenetic perturbations caused by SM even after single exposure."
    explanation: >-
      The leading proposed explanation, presented by its authors as a proposal
      rather than a finding.
- discussion_id: sm_keratopathy_latency_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does mustard gas keratopathy appear after a silent interval of years to
    decades rather than following on from the acute corneal injury?
  rationale: >-
    The acute corneal lesion re-epithelialises within days, and the delayed
    keratopathy then arrives after an interval during which the eye looks well.
    Limbal stem cell deficiency is the accepted structural explanation for the end
    state, but it does not by itself account for the timing: a stem cell pool
    destroyed at exposure should produce failure of corneal renewal sooner. The
    authors of the largest delayed-keratitis series say outright that the
    pathophysiology of these changes is not clearly identified, and raise a
    possible immune-mediated component from the histology. The edge from limbal
    injury to delayed keratopathy in this entry rests on clinical natural history.
  attaches_to:
  - pathophysiology#Limbal Stem Cell Deficiency and Delayed Mustard Gas Keratopathy
  evidence:
  - reference: PMID:15808253
    reference_title: "Chronic and delayed-onset mustard gas keratitis: report of 48 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiologic features of these changes are not clearly identified."
    explanation: The authors state the gap for the delayed ocular lesion specifically.
  - reference: PMID:15808253
    reference_title: "Chronic and delayed-onset mustard gas keratitis: report of 48 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the clinical appearance of the lesions and the histopathologic findings, an immune-mediated component seems possible."
    explanation: Records the hypothesis the authors offer for the unexplained interval.
- discussion_id: sm_no_animal_model_reproduces_human_blistering
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can any animal model reproduce human sulfur mustard blistering, and what does
    it mean for countermeasure development that none does?
  rationale: >-
    The cutaneous arm of this entry has an evidence problem the pulmonary arm does
    not. Rodent skin models reproduce epidermal cell death and the inflammatory
    response but do not form true human-type blisters, so the vesication node -
    the lesion the agent is named for - is supported in humans by clinical
    description and in animals only by proxies such as ear weight and morphometric
    thickness. This is why the vesication evidence in this entry is thinner than
    the fibrosis evidence, and why a cutaneous countermeasure that works in a
    mouse ear cannot be assumed to work on a human blister.
  attaches_to:
  - pathophysiology#Dermal-Epidermal Separation and Vesication
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "had an increase in ear weights, morphometric thickness, edema, inflammatory cell infiltration, and signs of vesication at all time points"
    explanation: >-
      Shows what the animal vesication endpoint actually measures - ear weight and
      thickness - rather than a blister.
- discussion_id: sm_bone_marrow_suppression_not_curated
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the dose relationship, frequency and time course of haematopoietic
    suppression after sulfur mustard exposure, and is there a primary clinical
    series that reports it?
  rationale: >-
    Haematopoietic suppression is now curated as a node, but on evidence thin
    enough that the gap is worth stating rather than closing. The only quotable
    statement in this entry's cache is a review's secondhand assertion
    (PMID:40034085) that sulfur mustard causes blood cytopenia and bone marrow
    destruction, attributed to another author and carrying no counts, frequency,
    dose relationship or time course. Nothing else reaches it: the
    radiation-comparison workshop report (PMID:37852927) records only that the
    case could have been made to include bone-marrow myelosuppression in that
    meeting's scope, which is a statement about the meeting rather than about the
    toxicity.

    An earlier draft of this discussion, and of the entry's notes, asserted that
    no cached source reported it quotably at all. That was false - the review
    sentence was already in the cache, and this entry already quoted the tail of
    the same sentence elsewhere. Recording the correction here because the
    failure is instructive: a claim about what the cache does not contain is the
    easiest kind of claim to get wrong, and the cheapest to check.

    Closing this properly needs a primary clinical series reporting blood counts
    in exposed patients, with a dose relationship.
  attaches_to:
  - pathophysiology#Haematopoietic Suppression
  evidence:
  - reference: PMID:37852927
    reference_title: "Overlapping Science in Radiation and Sulfur Mustard Exposures of Skin and Lung: Consideration of Models, Mechanisms, Organ Systems, and Medical Countermeasures: Overlapping science in radiation and sulfur mustard injuries to lung and skin."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "the programs elected to focus on similarities between radiation exposure and SM-induced injuries to the lung and skin; although arguably, the case could also have been made to include bone marrow myelosuppression"
    explanation: >-
      Cited to show precisely what this source does and does not say: it records a
      scoping decision about a meeting, and is not evidence that sulfur mustard
      causes myelosuppression.

- name: Melanocyte Injury and Dyspigmentation
  biological_scale: CELLULAR
  description: >-
    Epidermal melanocytes are alkylated alongside keratinocytes, and the effect on
    pigment is dose-dependent in opposite directions. Low sulfur mustard
    concentrations raise melanin synthesis and the expression of tyrosinase, TRP1,
    TRP2 and MITF; high concentrations reduce melanin content and downregulate all
    of them. This is offered as an explanation for the characteristic mixture of
    hyper- and hypopigmented patches in healed skin, but it cannot be the whole
    story: pigmentary change is also reported in areas that were never exposed,
    which no concentration gradient across a contact area accounts for. The
    dose-dependence is measured; the mapping onto the clinical pattern is
    inference.

- name: Malignant Transformation of Chronically Injured Bronchial Epithelium
  biological_scale: CELLULAR
  description: >-
    Bronchial epithelium that has been alkylated, is chronically inflamed and is
    proliferating to repair itself carries an elevated risk of malignant
    transformation. Two lines of evidence support this, and neither is as strong
    as it first looks. In bronchial biopsies, FOXM1 and APOE are overexpressed
    roughly 15-fold and 4-fold - but the study has six exposed patients and five
    controls, excluded anyone with lung cancer, and its authors read APOE the
    other way, as protective against ROS damage in the short term, with the
    cancer link offered as a hypothesis. Clinically, in 719 victims followed for
    a mean of 38 years, lung fibrosis raised tumour risk about 17.75-fold, air
    trapping about 11.73-fold and bronchiectasis about 10.14-fold, and the lobes
    with fibrosis were the lobes tumours appeared in - but that cohort had no
    control group. The spatial concordance makes the association hard to explain
    by shared exposure alone; it is not itself a demonstration of mechanism.
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: DYSREGULATED

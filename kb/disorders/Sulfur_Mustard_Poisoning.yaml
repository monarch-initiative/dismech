name: Sulfur Mustard Poisoning
creation_date: "2026-09-10T19:20:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
- Chemical Vesicant Injury
synonyms:
- mustard gas poisoning
- sulphur mustard poisoning
- yperite poisoning
- HD exposure
description: >-
  Sulfur mustard poisoning is the injury syndrome caused by exposure to
  bis(2-chloroethyl) sulfide, a lipophilic bifunctional alkylating vesicant used
  as a chemical weapon from 1917 onwards and, in the modern era, chiefly during
  the 1980-1988 Iran-Iraq war. The agent penetrates skin, cornea and airway
  epithelium and cyclizes intramolecularly to a reactive episulfonium ion, which
  alkylates the N7 position of guanine and crosslinks DNA. Because the molecule
  carries two chloroethyl arms it can react with two nucleophiles at once, so
  the crosslinks block replication and transcription outright. Unrepaired strand
  breaks drive PARP1 hyperactivation, which consumes NAD+ and collapses cellular
  ATP, switching the death mode from apoptosis to necrosis; in parallel the
  agent depletes glutathione and leaves the cell without its principal
  antioxidant buffer.

  Two features set this entry apart from other acute toxic exposures. The first
  is the latent period - cellular injury begins within minutes, but the burn,
  the keratoconjunctivitis and the airway injury declare themselves hours later.
  The second is the delayed arm: decades after a single exposure, survivors
  develop bronchiolitis obliterans, bronchiectasis and pulmonary fibrosis, a
  mustard keratopathy that emerges after a silent interval of years, and an
  elevated risk of lung cancer. That delayed disease, not the acute burn, is
  what kills people, and it is why this entry carries a `progression:` block
  with a distinct delayed-onset phase.
disease_term:
  preferred_term: sulfur mustard poisoning
  term:
    id: MONDO:0800387
    label: sulfur mustard poisoning
notes: >-
  Scope. This entry curates the human injury syndrome caused by sulfur mustard
  and the mechanism that produces it. It is not an entry about the agent's
  production, dispersal or military use, and the historical context recorded
  under `environmental:` is there because route and setting determine which
  organ is injured and how severely.

  Bone marrow suppression is curated, but read the evidence grade before relying
  on it. An earlier draft of this note claimed no cited source reported it
  quotably. That was false: PMID:40034085, cited seven times in this entry,
  states that sulfur mustard leads to systemic toxicity shown through "blood
  cytopenia, bone marrow destruction". It is a review's secondhand assertion
  attributed to another author rather than a primary clinical series, so the
  node is graded accordingly and the absence of a primary cohort is recorded
  under `discussions:`.

  ECTO binding. The exposure term `ECTO:9001175` is the ontology's term for
  exposure to bis(2-chloroethyl) sulfide, which is sulfur mustard under its
  systematic name; ECTO has no term under any of the agent's common or military
  names. `ECTO:0070054`, "exposure to mustard greens via ingestion", is an
  unrelated dietary term and is not a candidate here.

  NCIT binding for decontamination. `NCIT:C68769` is NCIT's term for
  decontamination and looks like the obvious binding for the acute intervention,
  but it is not reachable from `NCIT:C25218` (Clinical Intervention or
  Procedure), so it cannot be the `term:` of a `TreatmentTerm`. That treatment is
  bound to `NCIT:C49236` (Therapeutic Procedure) with the specificity carried in
  `preferred_term`, which is the same compromise CLAUDE.md records for medical
  devices.

  GeneReviews. Not applicable. This is an acquired toxic exposure with no
  Mendelian form, so there is no GeneReviews chapter to use as a phenotype
  baseline. The host-susceptibility literature concerns glutathione-pathway
  polymorphisms as severity modifiers, and no sulfur-mustard-specific association
  study was found for them, so no `genetic:` records are curated.
pathophysiology:
- name: Sulfur Mustard Penetration and Episulfonium Ion Formation
  biological_scale: MOLECULAR
  description: >-
    Sulfur mustard is lipophilic and crosses skin, corneal and airway epithelium
    within minutes of contact. Inside the cell it cyclizes intramolecularly,
    displacing chloride to form a strained three-membered episulfonium
    (ethylene sulfonium) ring. That cation, not the parent molecule, is the
    alkylating electrophile, and because the parent carries two chloroethyl arms
    the reaction can happen twice on the same molecule. Most of a dermal dose
    stays in the epidermis, which is why the cutaneous lesion is superficial and
    the systemic dose is small relative to the local injury.
  chemical_entities:
  - preferred_term: sulfur mustard
    term:
      id: CHEBI:25434
      label: bis(2-chloroethyl) sulfide
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: DNA N7-Guanine Alkylation and Interstrand Crosslinking
    causal_link_type: DIRECT
    description: The episulfonium ion is the species that alkylates DNA.
  - target: Glutathione Depletion and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      The same electrophile is consumed by conjugation to glutathione, which is
      the cell's first line of defence and the reason the thiol pool falls.
  - target: Melanocyte Injury and Dyspigmentation
    causal_link_type: DIRECT
  - target: Haematopoietic Suppression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Requires systemic absorption, which is why this arm appears only after
      significant exposure while the local lesions appear after any.
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SM and NM are easily absorbed through the skin and can cause immediate cutaneous injury and blistering"
    explanation: Establishes rapid transcutaneous absorption as the first step of the cutaneous lesion.
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "states that 70% of the SM resides in the epidermis and the rest in the basement membrane of the dermis"
    explanation: >-
      Supports the claim that the absorbed dose is retained in the epidermis and
      basement membrane zone rather than distributing systemically, which is why
      the cutaneous injury is local and superficial.
- name: DNA N7-Guanine Alkylation and Interstrand Crosslinking
  biological_scale: MOLECULAR
  description: >-
    The episulfonium ion attacks nucleophilic sites in DNA, predominantly the N7
    position of deoxyguanosine. Because sulfur mustard is bifunctional, a single
    molecule can alkylate two nucleophiles, producing intrastrand and interstrand
    DNA crosslinks as well as DNA-protein crosslinks. An interstrand crosslink
    tethers the two strands together and physically blocks the replication and
    transcription machinery, so the lesion is cytotoxic rather than merely
    mutagenic. Replication forks that collide with an unrepaired crosslink
    generate double-strand breaks.
  biological_processes:
  - preferred_term: interstrand cross-link repair
    term:
      id: GO:0036297
      label: interstrand cross-link repair
    modifier: INCREASED
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  downstream:
  - target: PARP1 Hyperactivation and NAD+ Depletion
    causal_link_type: DIRECT
    description: >-
      Strand breaks arising from blocked and collapsed replication forks are the
      signal PARP1 detects.
    evidence:
    - reference: PMID:21218101
      reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PARP-1 detects and signals DNA strand breaks induced by a variety of genotoxic insults."
      explanation: >-
        States that DNA strand breaks are the signal PARP1 responds to, which is
        this edge rather than either node.
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it causes DNA replication cessation because it alkylates N7 of a deoxyguanosine residue and a cysteine residue"
    explanation: >-
      Names the specific alkylation site for sulfur mustard and states the
      functional consequence, replication arrest.
- name: PARP1 Hyperactivation and NAD+ Depletion
  biological_scale: MOLECULAR
  description: >-
    PARP1 detects DNA strand breaks and responds by transferring ADP-ribose units
    from NAD+ onto nuclear acceptor proteins. At the lesion densities sulfur
    mustard produces, this repair response becomes the injury: PARP1 consumes the
    cellular NAD+ pool, and because NAD+ is an obligate cofactor for glycolysis,
    the TCA cycle and the electron transport chain, ATP synthesis fails with it.
    The consequence is a switch in death mode - a cell with modest damage
    apoptoses or repairs, a cell with severe damage runs out of energy and dies
    by necrosis. Necrosis rather than apoptosis is what makes the lesion
    inflammatory and slow to heal.
  biological_processes:
  - preferred_term: protein poly-ADP-ribosylation
    term:
      id: GO:0070212
      label: protein poly-ADP-ribosylation
    modifier: INCREASED
  - preferred_term: NAD+ consumption by poly-ADP-ribosylation
    term:
      id: GO:0019677
      label: NAD+ catabolic process
    modifier: INCREASED
  downstream:
  - target: Cellular Energy Collapse and Epithelial Necrosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21218101
      reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "the loss of NAD+ leads to a marked reduction in the cellular pools of ATP, resulting in cellular dysfunction and cell death via the necrotic pathway"
      explanation: >-
        States the causal step from NAD+ depletion to ATP loss to necrotic death,
        which is the edge itself rather than either node alone.
  evidence:
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In case of severe DNA injury, overactivation of PARP-1 depletes the cellular stores of NAD+, an essential cofactor in the glycolytic pathway, the tricarboxylic acid cycle, and the mitochondrial electron transport chain."
    explanation: Supports PARP1 overactivation as the mechanism of NAD+ depletion and names the pathways that depend on it.
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Experimental evidence has established that the PARP-1 pathway of cell death plays a pivotal role in tissue injury and organ dysfunction in mustard-induced acute toxicity"
    explanation: Attributes the tissue-level injury specifically to the PARP1 death pathway in mustard toxicity.
- name: Glutathione Depletion and Oxidative Stress
  biological_scale: MOLECULAR
  description: >-
    Sulfur mustard depletes intracellular glutathione by direct conjugation to
    the electrophile and, in chronically exposed human lung, by downregulation of
    glutathione reductase, the enzyme that regenerates reduced glutathione from
    its disulfide. The cell therefore loses its principal antioxidant buffer at
    the moment it most needs it, and reactive oxygen and nitrogen species
    accumulate. This arm is largely independent of the DNA-alkylation arm and
    synergistic with it: both converge on the same dying cell. Human mustard lung
    shows the paradoxical signature of the pathway under strain - glutathione
    peroxidases, transferases and synthetase are all overexpressed while
    glutathione reductase is strongly suppressed and the substrate they need is
    scarce.
  biological_processes:
  - preferred_term: glutathione metabolic process
    term:
      id: GO:0006749
      label: glutathione metabolic process
    modifier: DECREASED
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  molecular_functions:
  - preferred_term: glutathione reductase activity
    term:
      id: GO:0004362
      label: glutathione-disulfide reductase (NADPH) activity
    modifier: DECREASED
  downstream:
  - target: Cellular Energy Collapse and Epithelial Necrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29676192
    reference_title: Sulfur mustard triggers oxidative stress through glutathione depletion and altered expression of glutathione-related enzymes in human airways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glutathione peroxidases (GPXs), glutathione-s-transferases (GSTs), and glutathione synthetase (GSS) enzymes were overexpressed in mustard lung biopsies, while glutathione reductase (GSR) was significantly downregulated (14.95-fold)."
    explanation: >-
      Direct human lung-biopsy evidence for the enzyme pattern described, and the
      source of the specific claim that glutathione reductase is the suppressed
      step.
  - reference: PMID:29676192
    reference_title: Sulfur mustard triggers oxidative stress through glutathione depletion and altered expression of glutathione-related enzymes in human airways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GSH depletion induced by GSR downregulation may be a major mechanism of SM toxicity on human lung."
    explanation: The authors' own statement that glutathione depletion is a major toxicity mechanism, not merely a correlate.
  - reference: PMID:33002157
    reference_title: "Progressive Lung Injury, Inflammation, and Fibrosis in Rats Following Inhalation of Sulfur Mustard."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inflammatory changes in the lung were associated with oxidative stress, as reflected by increased expression of heme oxygenase (HO)-1."
    explanation: Independent in vivo corroboration that the pulmonary injury carries an oxidative-stress signature.
- name: Cellular Energy Collapse and Epithelial Necrosis
  biological_scale: CELLULAR
  description: >-
    Keratinocytes, corneal epithelial cells and airway epithelial cells that have
    lost their NAD+ and ATP pools and their antioxidant buffer die. The death
    mode is dose-dependent rather than uniform: a cell with modest damage
    apoptoses, a cell whose energy has collapsed cannot run the ATP-dependent
    apoptotic programme and dies by necrosis. Both are present in the injured
    airway, and the balance between them is what the PARP1 arm sets. Necrotic
    death spills intracellular contents into the tissue, which is what converts a
    molecular lesion into an inflammatory one. Do not read this node as claiming
    the death is exclusively necrotic - the evidence below includes a direct
    demonstration of early apoptosis in the same inhalation model.
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  downstream:
  - target: Acute Pro-Inflammatory Cytokine Burst and Neutrophil Recruitment
    causal_link_type: DIRECT
  - target: Dermal-Epidermal Separation and Vesication
    causal_link_type: DIRECT
  - target: Corneal and Limbal Epithelial Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21218101
    reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute toxicity of SM is related to reactive oxygen and nitrogen species, DNA damage, poly(ADP-ribose) polymerase activation and energy depletion within the affected cell."
    explanation: Summarises the four converging inputs to the dying cell that this node represents.
  - reference: PMID:33002157
    reference_title: "Progressive Lung Injury, Inflammation, and Fibrosis in Rats Following Inhalation of Sulfur Mustard."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "including epithelial necrosis and hyperplasia in the distal bronchioles, thickened alveolar walls, enlarged vacuolated macrophages, and interstitial fibrosis"
    explanation: Histological confirmation that necrotic epithelial death occurs in an in vivo sulfur mustard model.
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "SM exposure triggers an early apoptotic cell death"
    explanation: >-
      Recorded as REFUTE against any reading of this node as exclusively
      necrotic. TUNEL-positive cells rise early after sulfur mustard inhalation
      in the same model, so apoptosis is a real component of the epithelial
      death and not merely a low-dose special case.
- name: Acute Pro-Inflammatory Cytokine Burst and Neutrophil Recruitment
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  description: >-
    Necrotic epithelium releases a burst of pro-inflammatory cytokines and
    chemokines within the first 72 hours, and neutrophils follow them into the
    tissue. In the rat inhalation model this burst comprises IL-1 beta, TNF-alpha,
    IL-2, IL-6 and the chemokines CCL2, CCL3, CCL11 and CXCL1. In exposed
    patients, serum IL-6 tracks the severity of the pulmonary complication, which
    is the human counterpart of the same signal. This node substitutes the
    chemical vesicant insult for the generic injury the fibrosis module expects at
    this step.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  downstream:
  - target: Chronic IL-17-Dependent Airway Inflammation
    causal_link_type: DIRECT
    description: >-
      The acute cytokine and chemokine response does not terminate; the same
      mediators stay elevated as the infiltrate turns lymphocytic.
    evidence:
    - reference: PMID:22465472
      reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At 2 wks and beyond (chronic phase), lymphocytic infiltration and continued elevated expression of cytokines/chemokines were sustained."
      explanation: >-
        Establishes continuity between the acute burst and the chronic phase in
        one time course, which is what this edge asserts.
  evidence:
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In rats, SM induced a burst of pro-inflammatory cytokines/chemokines within 72 h, including IL-1β, TNF-α, IL-2, IL-6, CCL2, CCL3, CCL11, and CXCL1 that was associated with neutrophilic infiltration into the lung."
    explanation: Names the mediators and the 72-hour window, and links them to neutrophil influx.
  - reference: PMID:25031491
    reference_title: The role of serum level of interleukin-6 in severity of pulmonary complications of sulfur mustard injuries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with moderate to severe symptoms had a serum level of (0.95±0.92 ng/ml) which was significantly higher than mild (0.47±0.54) and control (0.34±0.12) groups"
    explanation: >-
      Human evidence that one of the mediators identified in the animal model
      scales with clinical severity, supporting relevance of this node in people.
- name: Dermal-Epidermal Separation and Vesication
  biological_scale: TISSUE
  description: >-
    Death of basal keratinocytes at the dermal-epidermal junction, together with
    the proteases released from them, separates the epidermis from the dermis and
    produces the blister that gives the agent its name. The lesion is delayed
    relative to the chemistry: alkylation is complete within minutes, while the
    visible lesion takes hours. In the mouse ear vesicant model the equivalent
    lesion rises sharply between 4 and 8 hours after exposure and stays elevated
    at 24 hours. The figures commonly quoted for humans - erythema at 2 to 24
    hours, vesication at 24 to 48 - are not stated in any source cached for this
    entry and are deliberately not asserted here.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  cell_types:
  - preferred_term: basal cell of epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  downstream:
  - target: Skin blistering
    causal_link_type: DIRECT
  - target: Erythema
    causal_link_type: DIRECT
  - target: Skin Ulceration and Impaired Wound Healing
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has been found that SM manifests via vesication of the skin and then later leads to systemic toxicity"
    explanation: Establishes vesication as the defining cutaneous lesion of sulfur mustard.
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "This study also found that vesication sharply increased between 4 and 8 h after exposure, was well established, and remained elevated at 8‐ and 24‐h post‐exposure"
    explanation: >-
      Times the vesication in an animal model, supporting the delayed-onset claim.
      Indirect because the quoted experiment used the nitrogen mustard analogue
      HN2 rather than sulfur mustard itself.
- name: Skin Ulceration and Impaired Wound Healing
  biological_scale: TISSUE
  description: >-
    Once the blister roof is lost the wound behaves unlike a thermal burn of
    comparable depth: healing is slow, the ulcer is prone to secondary infection,
    and scarring follows. Because the underlying keratinocyte population has
    itself been alkylated, the tissue is repairing with cells whose replicative
    capacity has been damaged.
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DECREASED
  evidence:
  - reference: PMID:40034085
    reference_title: Mechanistic Insights and Pharmacological Approaches for Nitrogen and Sulfur Mustards and Their Implications as Therapeutic Agents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "delayed severe skin injury that can last for years after initial exposure"
    explanation: Supports the persistence of the cutaneous lesion well beyond the acute burn.
- name: Corneal and Limbal Epithelial Injury
  biological_scale: TISSUE
  description: >-
    The cornea is the most sensitive tissue to sulfur mustard in the acute
    phase. Acute injury presents after a latent period of hours as
    lacrimation, blepharospasm, severe conjunctivitis and corneal erosion. Most
    acute lesions re-epithelialise within days. The consequential injury is to the
    limbus, the narrow zone at the corneal margin that houses the stem cells
    responsible for renewing corneal epithelium.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  - preferred_term: limbal epithelial stem cell
    term:
      id: CL:4033093
      label: limbal epithelial stem cell of cornea
  downstream:
  - target: Keratoconjunctivitis
    causal_link_type: DIRECT
  - target: Photophobia
    causal_link_type: DIRECT
  - target: Limbal Stem Cell Deficiency and Delayed Mustard Gas Keratopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35974928
      reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Whenever limbal epithelial stem cells are degraded and/or limbal stroma (niche) is ineffective, limbal stem cell deficiency can occur"
      explanation: >-
        States the causal step from limbal stem cell or niche destruction to
        limbal stem cell deficiency, which is this edge rather than either node.
  evidence:
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical findings in acute conditions include; sore eyes, lacrimation, burning sensation, edematous, obvious blepharospasm of eyelids, severe conjunctivitis, erosion and opacity of the cornea."
    explanation: Describes the acute ocular lesion this node represents.
  - reference: PMID:35974928
    reference_title: Ophthalmological aspects of mustard gas poisoning (focus on management).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Limbal epithelial stem cell deficiency and dysfunction of limbic stroma are due to destruction."
    explanation: Attributes the limbal deficiency to destruction of the stem cells and their stromal niche.
- name: Chronic IL-17-Dependent Airway Inflammation
  biological_scale: TISSUE
  description: >-
    The acute neutrophilic burst does not resolve. From about two weeks after a
    single inhalational exposure the infiltrate becomes lymphocytic, cytokine
    expression stays elevated, and IL-17-positive cells accumulate in the inflamed
    regions of the lung. This persistence is the hinge of the whole entry: it is
    the mechanism by which a single exposure produces disease that is still
    progressing decades later, and it is why the chronic pulmonary disease
    develops in patients whose acute exposure was unremarkable.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: IL-17-positive T cell
    term:
      id: CL:0000084
      label: T cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Chronic bronchitis
    causal_link_type: DIRECT
  - target: Asthma
    causal_link_type: DIRECT
  - target: TGF-beta Driven Myofibroblast Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At 2 wks and beyond (chronic phase), lymphocytic infiltration and continued elevated expression of cytokines/chemokines were sustained."
    explanation: Documents the transition from acute neutrophilic to sustained lymphocytic inflammation.
  - reference: PMID:22465472
    reference_title: "Inhalation of sulfur mustard causes long-term T cell-dependent inflammation: possible role of Th17 cells in chronic lung pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At ≥30 days, SM inhalation promoted the accumulation of IL-17(+) cells in the inflamed areas of monkey lungs."
    explanation: >-
      Establishes the IL-17 arm in a non-human primate as well as in rodent,
      which is the basis for naming this node after IL-17 rather than after
      generic chronic inflammation.
- name: TGF-beta Driven Myofibroblast Activation
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    TGF-beta is undetectable during the acute phase and is strongly upregulated in
    the chronic phase, where it drives fibroblast-to-myofibroblast conversion and
    proliferation. PDGF and PAI-1 rise alongside it. The temporal separation
    matters: the profibrotic signal is not part of the initial injury but a
    consequence of inflammation that failed to resolve, which is why the fibrosis
    is delayed rather than immediate.

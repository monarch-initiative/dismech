- name: Haematopoietic Suppression
  biological_scale: ORGANISM
  description: >-
    After significant systemic absorption, sulfur mustard suppresses
    haematopoiesis, producing cytopenias and marrow damage. Mechanistically this
    is unsurprising - the agent is the chemical ancestor of the nitrogen mustard
    cytotoxics, whose dose-limiting toxicity is myelosuppression, and dividing
    marrow progenitors are exactly the population an interstrand crosslink is
    most cytotoxic to. Read the evidence grade before relying on this node: the
    only quotable statement available here is a review's secondhand assertion,
    not a primary clinical series, which is why no frequency or severity is
    curated and why the gap is recorded as a discussion.

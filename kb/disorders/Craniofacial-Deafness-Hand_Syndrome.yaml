  downstream:
  - target: Craniofacial Skeletal Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cochlear Melanocyte Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Craniofacial Skeletal Hypoplasia
  description: >-
    Failure of neural-crest-derived membranous bone formation in the midface
    produces the radiographic hallmark of CDHS — absent or hypoplastic nasal bones
    with a small maxilla over a normal calvarium. The soft-tissue gestalt (flat
    facial profile, depressed nasal bridge with button tip and slit-like nares,
    small pursed mouth) follows from the underlying skeletal deficiency.
  biological_scale: TISSUE
  locations:
  - preferred_term: nasal bone
    term:
      id: UBERON:0001681
      label: nasal bone
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:6859126
    reference_title: Previously undescribed syndrome of craniofacial, hand anomalies, and sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common radiographic manifestations include small maxilla, absent or small
      nasal bones, and ulnar deviation of the hands.
    explanation: >-
      The original description documents the midfacial skeletal hypoplasia that
      defines this node.
- name: Somitic and Limb Musculoskeletal Patterning Disturbance
  description: >-
    The hand arm of the CDHS triad cannot derive from the cranial neural crest
    node: the wrist skeleton and limb musculature are somite and lateral-plate
    derivatives, not cranial neural crest. PAX3 has a separate, well-established
    role in this second lineage — it is expressed in the lateral dermomyotome
    that gives rise to limb muscle progenitors, and murine Pax3 loss produces
    limbs without musculature. The same upper-limb musculoskeletal involvement
    separates Waardenburg syndrome type 3 from type 1, so a shared PAX3-dependent
    limb mechanism is the natural reading of the CDHS hand phenotype.

    This node is HYPOTHETICAL and deliberately broad. No study has examined limb
    or muscle tissue from a CDHS patient, and the myogenic route does not by
    itself account for the skeletal element of the phenotype (the hypoplastic
    ulnar styloid), which is why the accompanying knowledge-gap discussion keeps
    that specific question open rather than treating this node as settled.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: skeletal muscle tissue development
    term:
      id: GO:0007519
      label: skeletal muscle tissue development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:7744814
    reference_title: Pax3 inhibits myogenic differentiation of cultured myoblast cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pax3 is an evolutionarily conserved transcription factor expressed in the
      lateral dermomyotome, a region that gives rise to limb muscle progenitors.
    explanation: >-
      Establishes the somitic/limb lineage in which PAX3 acts, distinct from the
      cranial neural crest lineage of the sibling node. PARTIAL because it is
      murine and general PAX3 biology, not CDHS-specific.
  - reference: PMID:7744814
    reference_title: Pax3 inhibits myogenic differentiation of cultured myoblast cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutations in Pax-3 account for the mouse mutant Splotch which develops
      without limb musculature.
    explanation: >-
      Demonstrates that Pax3 loss produces a limb phenotype in vivo, supplying
      the mechanistic plausibility for this node. PARTIAL: a murine null allele,
      not the human CDHS missense allele class.
  - reference: PMID:29730428
    reference_title: The expression and function of PAX3 in development and disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This protein is expressed during development of skeletal muscle, central
      nervous system and neural crest derivatives, and regulates expression of
      target genes that impact on proliferation, survival, differentiation and
      motility in these lineages.
    explanation: >-
      Names skeletal muscle as a PAX3-dependent lineage alongside neural crest,
      which is the basis for modelling the hand arm as a separate branch rather
      than as a downstream consequence of the cranial neural crest node.
  downstream:
  - target: Ulnar Deviation of the Hand
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Presumed imbalance of limb musculature and periarticular soft tissue;
      never demonstrated in a CDHS patient.
  - target: Flexion Contractures of the Fingers
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Presumed imbalance of limb musculature and periarticular soft tissue;
      never demonstrated in a CDHS patient.
  - target: Limited Wrist Movement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cochlear Melanocyte Deficiency
  description: >-
    Cochlear melanocytes are the intermediate cells of the stria vascularis and
    generate the endocochlear potential on which mechanotransduction depends. They
    derive from neural crest, and in the mouse they arise from Pax3-traced
    melanoblasts and Plp1-traced Schwann cell precursors. Loss of Pax3 in the mouse
    significantly diminishes these cells, providing the leading mechanism for the
    profound sensorineural hearing loss shared by CDHS and the other PAX3-related
    disorders. This node rests on model-organism evidence; the cochlea has not been
    examined in a CDHS patient.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear melanocyte (stria vascularis intermediate cell)
    term:
      id: CL:0000148
      label: melanocyte
  locations:
  - preferred_term: internal ear
    term:
      id: UBERON:0001846
      label: internal ear
  biological_processes:
  - preferred_term: inner ear morphogenesis
    term:
      id: GO:0042472
      label: inner ear morphogenesis
    modifier: ABNORMAL
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:38278860
    reference_title: Loss of Pax3 causes reduction of melanocytes in the developing mouse cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lineage tracing and in situ hybridization show that Pax3+ derivatives
      contribute to S100+, Kir4.1+ and Dct+ melanocytes (intermediate cells) in
      the developing stria vascularis, all of which are significantly diminished
      in Pax3 mutant animals.
    explanation: >-
      Mouse lineage-tracing evidence that Pax3 is required for cochlear
      melanocyte development, the proposed basis of the hearing loss.
  - reference: PMID:38278860
    reference_title: Loss of Pax3 causes reduction of melanocytes in the developing mouse cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cochlear melanocytes are intermediate cells in the stria vascularis that
      generate endocochlear potentials required for auditory function.
    explanation: >-
      Explains why depletion of this cell population causes sensorineural
      hearing loss.
  - reference: PMID:24565836
    reference_title: Pax3 function is required specifically for inner ear structures with melanogenic fates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      suggesting that Pax3 lineage with a melanogenic fate migrated to the inner
      ear, yet failed to differentiate and survive without Pax3 function
    explanation: >-
      Independent murine fate-mapping evidence narrowing the defect to the
      melanogenic lineage: Pax3-lineage cells reach the inner ear but do not
      differentiate or survive, which is more specific than a general
      migration failure.
  downstream:
  - target: Profound Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Reduced endocochlear potential and impaired hair-cell mechanotransduction;
      not measured in CDHS patients.

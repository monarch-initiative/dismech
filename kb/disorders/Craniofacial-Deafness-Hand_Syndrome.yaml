name: Craniofacial-Deafness-Hand Syndrome
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- CDHS
- Sommer-Young-Wee-Frye syndrome
- craniofacial deafness hand syndrome
description: >-
  Craniofacial-deafness-hand syndrome (CDHS) is an ultra-rare autosomal dominant
  multiple congenital anomaly syndrome caused by heterozygous missense variants in
  the paired domain of PAX3, the same neural-crest transcription factor whose
  loss-of-function alleles cause Waardenburg syndrome types 1 and 3. The cardinal
  triad is (1) a distinctive craniofacial gestalt — flat facial profile over a
  normal calvarium, hypertelorism, short downslanting palpebral fissures, a
  depressed nasal bridge with a button tip and slit-like nares, a small "pursed"
  mouth, and radiographically absent or hypoplastic nasal bones with a small
  maxilla; (2) profound sensorineural hearing loss; and (3) ulnar deviation of the
  hands with flexion contractures of the third through fifth digits and limited
  wrist movement. CDHS is allelic to, but clinically distinct from, Waardenburg
  syndrome: the founding family characteristically lacked the classic Waardenburg
  pigmentary stigmata (white forelock, heterochromia iridis), and the imaging
  findings — absent/hypoplastic nasal bones and a hypoplastic ulnar styloid over a
  normal calvarium — were considered the discriminating feature. The evidence base
  is exceptionally small: three affected individuals across two generations of one
  family carrying the PAX3 Asn47Lys allele, plus a handful of later single-case
  reports, giving a reported prevalence below 1 in 1,000,000.

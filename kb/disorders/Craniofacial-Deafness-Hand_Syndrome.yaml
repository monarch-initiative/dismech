inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CDHS segregates as an autosomal dominant trait. In the founding family the
    phenotype was transmitted from an affected mother to two of her children,
    giving three affected individuals across two generations. The two later
    molecularly characterized patients (a PAX3 p.Thr31Pro missense variant and a
    de novo 2q36.1 deletion encompassing PAX3) were simplex cases with unaffected
    parents, so both inherited and de novo dominant mechanisms are documented.
  evidence:
  - reference: PMID:8664898
    reference_title: Missense mutation in the paired domain of PAX3 causes craniofacial-deafness-hand syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Craniofacial-deafness-hand syndrome (MIM 122880) is inherited as an
      autosomal dominant mutation
    explanation: >-
      States the autosomal dominant mode of inheritance for CDHS directly.
  - reference: PMID:14556253
    reference_title: Craniofacial-deafness-hand syndrome revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of three affected family members in two generations and a phenotype
      of midfacial anomalies and dystopia canthorum resembling Waardenburg
      syndrome, a search for mutations in the PAX3 gene was undertaken.
    explanation: >-
      Documents vertical transmission across two generations in the founding
      family, consistent with dominant inheritance.

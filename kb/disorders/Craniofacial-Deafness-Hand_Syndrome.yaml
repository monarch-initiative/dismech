pathophysiology:
- name: PAX3 Paired-Domain Missense Variant
  description: >-
    CDHS is caused by heterozygous missense substitution within the paired domain,
    the N-terminal sequence-specific DNA-binding module of the PAX3 transcription
    factor. The founding family carries Asn47Lys (N47K) in exon 2; a second,
    unrelated patient carries p.Thr31Pro (c.A91C) in the same domain. The identity
    of the substitution matters: a different substitution at the very same codon,
    Asn47His, causes Waardenburg syndrome type 3 rather than CDHS, so CDHS is
    defined by an allele class rather than simply by PAX3 dysfunction.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  molecular_functions:
  - preferred_term: sequence-specific DNA binding
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:8664898
    reference_title: Missense mutation in the paired domain of PAX3 causes craniofacial-deafness-hand syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a family of three affected individuals with this syndrome, a mother and
      two children, a missense mutation (Asn47Lys) in the paired domain of PAX3
      was initially detected by SSCP analysis.
    explanation: >-
      Identifies the causal paired-domain missense allele in the founding CDHS
      family.
  - reference: PMID:8664898
    reference_title: Missense mutation in the paired domain of PAX3 causes craniofacial-deafness-hand syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A previously described missense mutation in this same codon (Asn47His) is
      associated with Waardenburg syndrome type 3 (Hoth et al., 1993).
    explanation: >-
      Establishes that the specific amino-acid substitution at codon 47, not
      merely the affected codon, determines whether the phenotype is CDHS or
      Waardenburg syndrome type 3.
  - reference: PMID:39850491
    reference_title: "Case Report: Craniofacial deafness hand syndrome with unusual cardiovascular symptoms and lack of holistic care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's variant is found within the conserved paired box domain (PB)
    explanation: >-
      Confirms that the second reported CDHS allele also lies in the paired
      domain, supporting a domain-restricted allele class.
  downstream:
  - target: Altered Paired-Domain DNA Recognition
    causal_link_type: DIRECT
- name: Altered Paired-Domain DNA Recognition
  description: >-
    The paired domain comprises two helix-turn-helix subdomains whose C-terminal
    recognition helices make base-specific contacts in the DNA major groove.
    Substitution of a basic residue for the asparagine at position 47 — a residue
    conserved across all known murine Pax and human PAX genes — perturbs this
    base-specific readout. The resulting change in PAX3 transcriptional output is
    proposed to be more damaging than the haploinsufficiency produced by the
    missense, frameshift and deletion alleles that cause Waardenburg syndrome type
    1, which is the mechanistic rationale for the distinct CDHS phenotype.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:8664898
    reference_title: Missense mutation in the paired domain of PAX3 causes craniofacial-deafness-hand syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Substitution of a basic amino acid for asparagine at residue 47, conserved
      in all known murine Pax and human PAX genes, appears to have a more drastic
      effect on the phenotype than missense, frameshift and deletion mutations of
      PAX3 that cause Waardenburg syndrome type 1.
    explanation: >-
      States the proposed allele-severity model linking the specific
      paired-domain substitution to the more severe CDHS phenotype.
  - reference: PMID:20643146
    reference_title: The PAX3 paired domain and homeodomain function as a single binding module in vivo to regulate subnuclear localization and mobility by a mechanism that requires base-specific recognition.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      At the structural level, this reflected an unexpected dependence on
      base-specific contacts in the PD
    explanation: >-
      Cell-based structure-function work showing that paired-domain function
      depends on base-specific DNA contacts, the class of interaction disrupted
      by the CDHS residue-47 substitution. Indirect: the specific CDHS alleles
      were not assayed, so this supports the general mechanism rather than the
      CDHS variant itself.
  downstream:
  - target: Cranial Neural Crest Patterning Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Altered transactivation of PAX3 target genes in premigratory and migratory
      neural crest; the specific dysregulated targets in CDHS have not been
      identified.
  - target: Somitic and Limb Musculoskeletal Patterning Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Altered transactivation of PAX3 target genes in the dermomyotome and in
      the limb muscle precursors that delaminate from it; not demonstrated in
      CDHS patients.
- name: Cranial Neural Crest Patterning Failure
  description: >-
    PAX3 specifies dorsal neural tube progenitors and is required for the
    induction, survival, migration and differentiation of neural crest cells.
    Disrupted PAX3 transcriptional output during the narrow embryonic window of
    neural crest patterning is the proposed common origin of the CDHS triad: the
    craniofacial skeleton, the melanocytic component of the inner ear, and — in
    the one reported case with cardiac involvement — the cardiac outflow tract are
    all neural-crest derivatives. This node is inferred from PAX3 developmental
    biology and model-organism data rather than from tissue studies of CDHS
    patients.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:

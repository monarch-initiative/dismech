differential_diagnoses:
- name: PAX3-Related Waardenburg Syndrome
  disease_term:
    preferred_term: Waardenburg syndrome
    term:
      id: MONDO:0018094
      label: Waardenburg syndrome
  description: >-
    The principal differential, and allelic at the same locus. Waardenburg syndrome
    type 1 shares sensorineural hearing loss, dystopia canthorum and a broad nasal
    bridge; type 3 (Klein-Waardenburg) adds upper-limb musculoskeletal
    abnormalities that can closely mimic the CDHS hand phenotype, and is caused by
    a different substitution at the very codon mutated in CDHS.
  distinguishing_features:
  - >-
    CDHS shows absent or hypoplastic nasal bones and a hypoplastic ulnar styloid
    over a normal calvarium, an imaging combination not seen in Waardenburg
    syndrome.
  - >-
    The founding CDHS family lacked the pigmentary stigmata (white forelock,
    heterochromia iridis, skin depigmentation) that characterize Waardenburg
    syndrome.
  - >-
    CDHS alleles are paired-domain missense substitutions, whereas most
    Waardenburg syndrome type 1 alleles are loss-of-function.
  evidence:
  - reference: PMID:18553554
    reference_title: "Sensorineural deafness, distinctive facial features, and abnormal cranial bones: a new variant of Waardenburg syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The imaging findings and distinct facial features was felt to distinguish
      CDHS from WS type 3.
    explanation: >-
      States the basis on which CDHS is separated from Waardenburg syndrome type
      3.
  - reference: PMID:8447316
    reference_title: "Mutations in the paired domain of the human PAX3 gene cause Klein-Waardenburg syndrome (WS-III) as well as Waardenburg syndrome type I (WS-I)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both mutations were in the highly conserved paired domain of the human PAX3
      gene and are similar to other mutations that cause WS.
    explanation: >-
      Establishes that Waardenburg syndrome types 1 and 3 also arise from
      paired-domain PAX3 mutations, which is why the differential turns on the
      specific substitution and the imaging phenotype rather than on the domain
      alone.
- name: PAX3-negative craniofacial-deafness spectrum
  description: >-
    A 37-year-old woman with congenital sensorineural hearing loss, dystopia
    canthorum, a flat facial profile, ulnar deviation with digit contractures and
    fifth-finger clinodactyly — features overlapping both CDHS and Waardenburg
    syndrome type 3 — had no mutation in any PAX3 coding exon or splice boundary,
    with whole-gene deletion excluded by SNP heterozygosity. Craniofacial CT showed
    markedly hypoplastic-to-aplastic paranasal sinuses, underdeveloped mastoids and
    small cochleae with only 1.5 turns, findings not previously associated with
    Waardenburg syndrome. This case raises the possibility of locus heterogeneity
    within the CDHS-like phenotype.
  distinguishing_features:
  - >-
    Normal hand and wrist radiographs and normal nasal bones on CT — the two
    radiographic features that define CDHS.
  - >-
    Paranasal sinus, mastoid and cochlear anomalies not described in CDHS.
  - >-
    No detectable PAX3 coding or splice-site lesion, with whole-gene deletion
    excluded.
  evidence:
  - reference: PMID:18553554
    reference_title: "Sensorineural deafness, distinctive facial features, and abnormal cranial bones: a new variant of Waardenburg syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a woman who shares some, but not all features of WS type 3
      and CDHS, and who also has abnormal cranial bones. All sinuses were
      hypoplastic, and the cochlea were small. No sequence alteration in PAX3 was
      found.
    explanation: >-
      Documents a CDHS-overlapping phenotype without a PAX3 coding lesion.
  - reference: PMID:18553554
    reference_title: "Sensorineural deafness, distinctive facial features, and abnormal cranial bones: a new variant of Waardenburg syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations broaden the clinical range of WS and suggest there may be
      genetic heterogeneity even within the CDHS subtype.
    explanation: >-
      States the locus-heterogeneity hypothesis for the CDHS-like phenotype.
animal_models:
- species: Mus musculus
  genotype: Pax3 splotch (Sp) mutant
  description: >-
    The splotch mouse carries a spontaneous intron 3 splice-acceptor mutation in
    Pax-3 that generates four aberrantly spliced transcripts, none expected to
    yield functional protein. It is the classic Pax3 loss-of-function model and
    reproduces neural tube closure defects (exencephaly, spina bifida). A separate
    Pax3-Cre knock-in disruption model shows a foreshortened cochlea, malformed
    vestibular apparatus and loss of stria vascularis intermediate cells. Note the
    model-fidelity limits: splotch is a loss-of-function allele, whereas CDHS is
    caused by paired-domain missense substitutions proposed to be more damaging
    than simple loss of function, and no model carries a CDHS allele (N47K or
    T31P) or reproduces the full human triad.
  genes:
  - preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  evidence:
  - reference: PMID:8421686
    reference_title: A mutation within intron 3 of the Pax-3 gene produces aberrantly spliced mRNA transcripts in the splotch (Sp) mouse mutant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These aberrantly spliced mRNA transcripts are not expected to result in
      functional Pax-3 proteins and are thus responsible for the phenotype
      observed in the Sp mouse mutant.
    explanation: >-
      Establishes splotch as a Pax3 loss-of-function model.
  - reference: PMID:38278860
    reference_title: Loss of Pax3 causes reduction of melanocytes in the developing mouse cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that Pax3 deficiency causes foreshortened cochlea, malformed
      vestibular apparatus, and neural tube defects
    explanation: >-
      Documents the inner-ear phenotype of murine Pax3 disruption, the closest
      available model support for the CDHS deafness mechanism.
discussions:
- discussion_id: cdhs_pax3_null_vs_missense_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does murine Pax3 loss of function model the CDHS craniofacial phenotype, given
    that the splotch mouse is dominated by neural tube closure defects while the
    human paired-domain missense phenotype is dominated by midfacial skeletal
    hypoplasia with no reported neural tube defect?
  rationale: >-
    Every mechanistic claim about CDHS craniofacial development is extrapolated
    from Pax3 loss-of-function models, but the direction of the mismatch is
    substantive rather than cosmetic. The murine models are null or
    severely-hypomorphic alleles whose signature phenotype is exencephaly and
    spina bifida; the human CDHS alleles are paired-domain missense substitutions
    that the founding report proposed to be MORE damaging than the
    loss-of-function alleles causing Waardenburg syndrome type 1, and CDHS
    patients have not been reported with neural tube defects. A null-allele model
    therefore cannot test the allele-class hypothesis that defines CDHS, and its
    craniofacial readout cannot be assumed to correspond to the human midfacial
    phenotype. The cochlear melanocyte arm of the mechanism is on firmer ground
    because the murine phenotype (loss of stria vascularis intermediate cells)
    maps directly onto the shared human feature of sensorineural hearing loss.
  attaches_to:
  - pathophysiology#Cranial Neural Crest Patterning Failure
  - pathophysiology#Craniofacial Skeletal Hypoplasia
  evidence:
  - reference: PMID:8421686
    reference_title: A mutation within intron 3 of the Pax-3 gene produces aberrantly spliced mRNA transcripts in the splotch (Sp) mouse mutant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The splotch (Sp) mouse mutant displays defects in neural tube closure in
      the form of exencephaly and spina bifida.
    explanation: >-
      Establishes that the murine model's signature phenotype is a neural tube
      closure defect, which is not a reported feature of human CDHS — the
      observation that motivates this mismatch.
  - reference: PMID:8664898
    reference_title: Missense mutation in the paired domain of PAX3 causes craniofacial-deafness-hand syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      appears to have a more drastic effect on the phenotype than missense,
      frameshift and deletion mutations of PAX3 that cause Waardenburg syndrome
      type 1
    explanation: >-
      States the allele-class hypothesis that a loss-of-function model cannot
      test, since the CDHS allele is proposed to act differently from the
      loss-of-function alleles the murine models carry.
  proposed_experiments:
  - experiment_id: exp_cdhs_pax3_n47k_knockin_vs_null
    name: Pax3 N47K knock-in versus null allele phenotype comparison
    description: >-
      Generate a knock-in mouse carrying the orthologous Pax3 N47K substitution
      and compare its craniofacial, otic and limb phenotypes against a Pax3 null
      allele on the same genetic background, to test directly whether the CDHS
      allele class acts by a mechanism distinct from haploinsufficiency.
  - experiment_id: exp_cdhs_pax3_allele_biochemistry
    name: Comparative DNA-binding and transactivation assay of CDHS versus Waardenburg alleles
    description: >-
      Assay DNA binding, target-gene occupancy and transactivation of PAX3 N47K
      and T31P against wild-type protein and against the Waardenburg-associated
      N47H protein, to determine whether the CDHS alleles are hypomorphic,
      dominant-negative or neomorphic.
- discussion_id: cdhs_hand_phenotype_mechanism_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does a PAX3 paired-domain missense allele produce the hand
    phenotype of CDHS — and specifically, does the somitic/limb-muscle route
    account for the skeletal findings (hypoplastic ulnar styloid) as well as the
    contractural ones (ulnar deviation, digit flexion contractures)?
  rationale: >-
    The hand is one third of the cardinal triad and carries three diagnostic
    phenotypes, yet it is the least mechanistically supported arm of the entry.
    Two things are worth separating. First, the lineage question is settled
    enough to model: the wrist and limb musculature are somite and lateral-plate
    derivatives, so they cannot descend from the cranial neural crest node, and
    PAX3's dermomyotome/limb-muscle role supplies a plausible separate branch —
    which is why the Somitic and Limb Musculoskeletal Patterning Disturbance node
    exists at HYPOTHETICAL confidence. Second, and still open: that myogenic
    route is a natural explanation for deviation and contracture, but not for
    hypoplasia of a bone. The hypoplastic ulnar styloid therefore has no incoming
    causal edge in this entry, deliberately, rather than being attached to a node
    that does not explain it. No limb or muscle tissue from a CDHS patient has
    ever been examined, and no murine model carries a CDHS allele, so both halves
    of the question are open on human evidence.
  attaches_to:
  - pathophysiology#Somitic and Limb Musculoskeletal Patterning Disturbance
  - pathophysiology#Altered Paired-Domain DNA Recognition
  evidence:
  - reference: PMID:7744814
    reference_title: Pax3 inhibits myogenic differentiation of cultured myoblast cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutations in Pax-3 account for the mouse mutant Splotch which develops
      without limb musculature.
    explanation: >-
      The strongest available support for a PAX3-dependent limb mechanism, and
      simultaneously the measure of the gap: it is a murine null allele producing
      absent musculature, not a human missense allele producing deviation,
      contracture and a hypoplastic styloid process.
  proposed_experiments:
  - experiment_id: exp_cdhs_limb_imaging_and_muscle_phenotyping
    name: Systematic upper-limb imaging and muscle phenotyping in ascertained CDHS patients
    description: >-
      Combine hand/wrist radiography with MRI or ultrasound of the forearm and
      intrinsic hand musculature in any ascertained CDHS patient, to establish
      whether the deformity is primarily myogenic (muscle hypoplasia or imbalance
      with secondary joint deformity) or primarily skeletal (a dysplastic ulnar
      styloid and carpus), which the plain radiographs reported to date cannot
      distinguish.
  - experiment_id: exp_cdhs_limb_phenotype_in_n47k_knockin
    name: Limb phenotyping of a Pax3 N47K knock-in allele
    description: >-
      Phenotype forelimb musculature and the distal skeleton in the Pax3 N47K
      knock-in proposed under the model-fidelity discussion, comparing against a
      Pax3 null allele, to test whether the CDHS allele class produces the
      human-like deviation-and-contracture pattern rather than the absent-muscle
      pattern of the null.
- discussion_id: cdhs_cardiovascular_association_single_case
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the cardiovascular involvement reported in one CDHS patient (patent ductus
    arteriosus with secondary pulmonary hypertension) a genuine part of the CDHS
    phenotypic spectrum, or a coincidental finding in a single patient?
  rationale: >-
    The association rests on one 21-year-old patient with a novel PAX3 p.Thr31Pro
    variant. The argument for causality is reasonable — more than 100
    congenital-heart-disease genes were screened without an alternative
    explanation, and PAX3 is expressed in cardiac neural crest, whose derivatives
    build the outflow tract — but it remains a single unreplicated case, and no
    cardiac assessment was reported for the founding family. Resolving this
    matters practically, because it determines whether echocardiography belongs in
    the baseline evaluation of every newly diagnosed patient.
  attaches_to:
  - pathophysiology#Cranial Neural Crest Patterning Failure
  evidence:
  - reference: PMID:39850491
    reference_title: "Case Report: Craniofacial deafness hand syndrome with unusual cardiovascular symptoms and lack of holistic care."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic findings provided a definitive diagnosis of
      Craniofacial-Deafness-Hand Syndrome, an extremely rare autosomal dominant
      condition, but found no variants that explain the patient's cardiac
      phenotype.
    explanation: >-
      The sole source of the cardiovascular association. Marked PARTIAL because
      it establishes only that no alternative genetic explanation was found in
      one patient, which is suggestive rather than confirmatory.
  - reference: PMID:15226254
    reference_title: "Cardiac neural crest of the mouse embryo: axial level of origin, migratory pathway and cell autonomy of the splotch (Sp2H) mutant effect."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Embryos homozygous for the Sp2H mutation show delayed onset of cardiac
      neural crest emigration
    explanation: >-
      Supplies the biological plausibility for the association: murine Pax3 loss
      perturbs cardiac neural crest, whose derivatives build the outflow tract.
      PARTIAL because a mouse null allele cannot establish that a human CDHS
      missense allele causes patent ductus arteriosus.
  proposed_experiments:
  - experiment_id: exp_cdhs_systematic_echocardiography
    name: Systematic echocardiographic screening of ascertained CDHS patients
    description: >-
      Perform echocardiography on surviving members of the founding N47K family
      and on any newly ascertained CDHS patient, and report the result whether
      positive or negative, so that the denominator for the cardiovascular
      association becomes interpretable.
notes: >-
  NEC preflight (Named Entity Confusion): the target entity was confirmed against
  MONDO:0007395 with OAK before curation. The MONDO record gives gene PAX3
  (HGNC:8617), OMIM:122880 and Orphanet:1529; the causal gene named throughout the
  deep-research report and every primary source cited here is PAX3, and the OMIM
  number asserted in the sources (MIM 122880) matches the MONDO xref. The main NEC
  hazard for this disease is its close allelic relative, Waardenburg syndrome
  (MONDO:0018094), which shares the gene; sources were checked individually and
  none described the wrong entity.

  GeneReviews baseline: NO GeneReviews chapter exists for CDHS. A PubMed search
  ("craniofacial-deafness-hand GeneReviews[All Fields]") returns zero records. The
  nearest chapter is Waardenburg Syndrome Type I (PMID:20301703), which covers a
  different, allelic disease and is therefore not cited here as a phenotype
  baseline. The phenotype baseline for this entry is instead the primary
  literature: the original description (PMID:6859126), the molecular
  characterization (PMID:8664898), and the 20-year follow-up (PMID:14556253).

  Relationship to the existing PAX3_Waardenburg_Spectrum entry: that entry
  deliberately records CDHS as an allelic note and a differential diagnosis rather
  than as a Waardenburg subtype, on the grounds that ClinGen scopes CDHS out of
  the PAX3-Waardenburg gene-disease validity assertion. This entry is the
  standalone counterpart that note anticipated. The two should stay reciprocally
  linked and must not be merged.

  Evidence ceiling: this is one of the smallest evidence bases in the knowledge
  base. Nine records match "craniofacial-deafness-hand syndrome" in PubMed, of
  which four concern the disease directly (PMID:6859126, PMID:8664898,
  PMID:14556253, PMID:39850491), one is a Japanese-language review
  (PMID:11462543), and one describes a PAX3-negative overlapping phenotype
  (PMID:18553554). Essentially all clinical detail derives from three affected
  individuals across two generations of one family, plus two later single
  patients. Frequency bands marked VERY_FREQUENT therefore mean "present in every
  affected individual of the only well-characterized family", not a
  cohort-derived percentage, and no penetrance, sex-ratio or survival statistic
  can be responsibly stated.

  Generation count — a discrepancy between two cited sources, resolved in favour
  of the primary one. PMID:18553554 (Gad 2008) describes CDHS as "described in a
  three-generation family that was evaluated several times over a period of 24
  years". That is incorrect. The clinicians who described and followed the family
  report two generations: PMID:6859126 reports "a mother and her infant daughter",
  and PMID:14556253 states "three affected family members in two generations"
  after a son was born two years after the index case. This entry therefore says
  three affected individuals across two generations throughout. The point is
  recorded here because Gad 2008 is cited elsewhere in this entry and a future
  curator reading it could reasonably reintroduce the error.

  Features deliberately NOT curated as CDHS phenotypes: microcephaly, short
  stature, kyphoscoliosis, pectus carinatum, shoulder-girdle hypoplasia, nail
  clubbing, cubitus valgus, an iris hypopigmented lesion and undernutrition are
  all reported in the single p.Thr31Pro patient (PMID:39850491) only, were absent
  from the founding family's description, and several are plausibly secondary to
  that patient's chronic uncorrected cardiopulmonary disease. Paranasal sinus
  hypoplasia, mastoid underdevelopment and a Mondini-type small cochlea are
  reported only in the PAX3-negative patient (PMID:18553554) and are curated under
  differential_diagnoses rather than as CDHS features. Adding any of these as
  disease-level phenotypes would overstate a one-patient observation as a syndrome
  feature.

  Deep research: falcon (Edison) was attempted first per the default provider
  policy but the API returned HTTP 402 Payment Required, so the run could not
  execute. Two providers were used instead: claude_code
  (research/Craniofacial-Deafness-Hand_Syndrome-deep-research-claude_code.md) and
  openscientist
  (research/Craniofacial-Deafness-Hand_Syndrome-deep-research-openscientist.md).
  They agree on the gene, the allele class, the codon-47 N47K/N47H
  genotype-phenotype contrast, the case inventory and the identifier set. Every
  PMID, snippet and ontology term in this entry was independently re-derived from
  the cached primary sources and OAK rather than copied from either report.

  Two provider errors were caught and are recorded so they are not reintroduced.
  (1) The claude_code report gave CHEBI:51068 for bosentan; that ID is actually
  "miotic", and the OAK-verified bosentan term CHEBI:51450 is used instead.
  (2) The openscientist report states that CDHS lacks dystopia canthorum ("without
  the pigmentary anomalies ... or dystopia canthorum that typify Waardenburg").
  That is wrong: PMID:14556253 describes the founding family as having "a
  phenotype of midfacial anomalies and dystopia canthorum resembling Waardenburg
  syndrome", and PMID:18553554 lists "hypertelorism and dystopia canthorum" among
  the CDHS clinical features. Dystopia canthorum is therefore curated here as a
  present phenotype. It is the pigmentary stigmata, not dystopia canthorum, that
  CDHS characteristically lacks.
  (3) The claude_code report gives the N47K allele as "c.141T>A". That is
  incompatible with the source, which reports "the C-to-G transversion in codon
  47" (PMID:8664898). The cDNA-level notation was therefore not curated; the
  variant is recorded at the protein level (p.Asn47Lys), with the transversion
  described in the evidence snippet.
  (4) The claude_code report asserts that Splotch mice have "no facial
  phenotype", attributed loosely to "PMID:8421686 and related literature". That
  PMID reports the splicing mutation and neural tube defects and makes no such
  claim, so the assertion was not curated. The model-fidelity concern it gestures
  at is real, but is stated differently in this entry — as a neural-tube-dominant
  murine phenotype versus a midface-dominant human one, with the allele class as
  the underlying difference — in the
  cdhs_pax3_null_vs_missense_model_fidelity discussion.

  HPO disease-annotation phenotypes NOT curated, and why. The openscientist
  report reproduces the HPO/Monarch disease annotation for MONDO:0007395 (28
  disease-phenotype associations). Four terms it lists as "Very frequent" are
  absent from this entry: Blepharophimosis (HP:0000581), Narrow face
  (HP:0000275), Lacrimal duct atresia (HP:0000564) and Aplasia/Hypoplasia
  involving the nose (HP:0009924). Two are near-duplicates of terms already
  curated at a different level of the HPO hierarchy (blepharophimosis versus the
  curated Short palpebral fissure HP:0012745; the nose term versus the curated
  Short nose and Narrow naris). Lacrimal duct atresia and Narrow face are
  genuinely distinct findings and would be real additions.

  They are omitted for one reason: the strings "lacrimal", "blepharophimosis" and
  "narrow face" appear in NONE of the cached references for this disease. The HPO
  annotation for CDHS derives from the OMIM clinical synopsis of the Sommer 1983
  full text, and PMID:6859126 is abstract-only in references_cache (718
  characters), so there is no cached body to quote. Adding these phenotypes would
  require an evidence item with either no snippet or a fabricated one, both of
  which the project SOP forbids. Resolving this needs either the Sommer 1983 full
  text in the cache, or a project-level decision on whether HPO disease
  annotations (HPOA) may serve as a citable evidence source in their own right —
  a schema/policy question beyond a single-disorder entry.

  Orphanet: ORPHA:1529 exists for this disease but is not in references_cache,
  because `just refresh-orphadata` currently fails on a sha256 mismatch against
  the pinned data/orphadata/MANIFEST.yaml and re-pinning would invalidate all
  existing ORPHA cache files. Once the manifest is refreshed repo-wide, the
  Orphanet HPO frequency table for ORPHA:1529 would be the best available source
  for phenotype frequencies.

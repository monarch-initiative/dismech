    explanation: >-
      Establishes FGF9 as the direct SOX11 target mediating the proliferative
      arm, with rescue on FGF9 replacement.
- name: Mandibular Hypoplasia with Secondary Palatal Shelf Obstruction
  biological_scale: TISSUE
  description: >-
    The cleft palate seen in SOX11 deficiency is mechanistically secondary, not
    a primary palatal-shelf defect. The shelves themselves retain fusion and
    elevation competence; mandibular hypoplasia mispositions the tongue, which
    physically obstructs palatal shelf elevation. The resulting picture
    resembles the Pierre Robin sequence.
  biological_processes:
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26826126
    reference_title: "Ablation of the Sox11 Gene Results in Clefting of the Secondary Palate Resembling the Pierre Robin Sequence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As in the wild type, the palatal shelves in the Sox11 mutant undergo outgrowth in a downward direction and exhibit potential for fusion and elevation. However, mutant palatal shelves encounter clefting, which is associated with a malpositioned tongue that results in physical obstruction of palatal shelf elevation"
    explanation: >-
      Directly demonstrates that the clefting is obstructive and secondary
      rather than a primary defect of the palatal shelves.
- name: Disrupted Nephrogenic Gdnf Domain Restriction
  biological_scale: TISSUE
  description: >-
    SOX11 is expressed in both mesenchymal and epithelial components of the
    early kidney anlagen and restricts the rostral extent of the Gdnf expression
    domain in the nephrogenic cord. Loss of Sox11 extends that domain and
    produces duplex kidney; later, SOX11 is required in the intermediate nephron
    segment for elongation of Henle's loop.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  biological_processes:
  - preferred_term: kidney development
    term:
      id: GO:0001822

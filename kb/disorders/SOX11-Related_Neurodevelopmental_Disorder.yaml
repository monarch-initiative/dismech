    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of Sox11 in mice causes an extension of the domain expressing Gdnf within rostral regions of the nephrogenic cord and results in duplex kidney formation."
    explanation: >-
      Defines the developmental mechanism linking Sox11 loss to a structural
      kidney malformation.

    label: intellectual developmental disorder with microcephaly and with or without ocular malformations or hypogonadotropic hypogonadism
parents:
- Neurodevelopmental disorder
- Autosomal dominant disease
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100626
      label: SOX11-related complex neurodevelopmental disorder with or without congenital anomalies
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0100626 is the newer, ClinGen-grounded term for the same SOX11
      entity and carries the same RO:0004003 relation to HGNC:11191 (SOX11).
      MONDO lists this entry's anchor label ("intellectual developmental
      disorder with microcephaly and with or without ocular malformations or
      hypogonadotropic hypogonadism") as a NARROW synonym of MONDO:0100626,
      hence skos:broadMatch. This entry is deliberately anchored on
      MONDO:0014376 (the OMIM:615866-xrefed term named in the curation
      request); MONDO:0100626 is the term a future re-anchoring should use.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No formal population prevalence or incidence estimate has been published for
    this disorder, and none is asserted here. Roughly 82 individuals with SOX11
    variants had been reported in the literature as of the 2024 review.
    Ascertainment is genotype-first (research exome/genome cohorts and
    GeneMatcher), so case counts are not a population rate. The Orphanet figure
    for Coffin-Siris syndrome as an umbrella (ORPHA:1465) is deliberately NOT
    imported, because it would substantially over-estimate the SOX11 entity.
  evidence:
  - reference: PMID:37558216
    reference_title: "Pathogenic variants in SOX11 mimicking Pitt-Hopkins syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "32 out of 82 subjects reported in the literature with SOX11 variants"
    explanation: >-
      Establishes the cumulative published case count as of 2024. This is a
      literature tally, not a population rate, hence measure_type
      CASES_IN_LITERATURE and prevalence_class NOT_YET_DOCUMENTED.
- population: Coffin-Siris syndrome / BAF-disorder registry cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Denominator anchor rather than a population rate: SOX11 accounts for 10 of
    284 molecularly confirmed individuals in a Coffin-Siris/BAF registry, making
    it one of the rarest causes among the Coffin-Siris-spectrum genes and far
    behind ARID1B. This is the quantitative basis for not importing
    Coffin-Siris cohort statistics into this entry.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX11 mutations appear to be a rare cause of CSS as only 2 out of 92 patients (2.2%) showed SOX11 abnormality"
    explanation: >-
      Independent quantification of the small SOX11 share of Coffin-Siris
      cohorts (2/92) in the original gene-discovery cohort.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A mechanism-defined, multisystem Mendelian disorder of a developmental
      transcription factor. The dominant burden is neurodevelopmental, but the
      entry also spans endocrine (hypogonadotropic hypogonadism, pituitary),
      ocular, auditory, and skeletal manifestations, so the cross-organ
      genetics chapter is a better fit than a single organ-system chapter.
inheritance:
- name: Autosomal dominant SOX11 haploinsufficiency
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: >-
    Most reported pathogenic SOX11 variants are de novo; in a systematic review
    of SOX11-related hypogonadotropic hypogonadism, 15 of 18 variants with
    parental testing were proven de novo. Rare transmission from a mildly
    affected parent has been documented.
  description: >-
    Heterozygous loss of SOX11 function (intragenic point variants or whole-gene
    2p25.2 deletion) is sufficient to cause disease, indicating that the
    paralogous SoxC factors SOX4 and SOX12 cannot compensate for reduced SOX11
    dosage in human neurodevelopment.
  evidence:
  - reference: PMID:42168980
    reference_title: "A de novo SOX11 mutation causing hypogonadotropic hypogonadism: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty unique variants were identified, 17/30 clustering within the HMG domain and 15/18 proven de-novo."
    explanation: >-
      Quantifies the predominance of de novo origin and the clustering of
      pathogenic variants in the HMG DNA-binding domain.
  - reference: PMID:33785884
    reference_title: "Maternal transmission of a mild Coffin-Siris syndrome phenotype caused by a SOX11 missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal transmission of a mild Coffin-Siris syndrome phenotype caused by a SOX11 missense variant."
    explanation: >-
      Documents that a pathogenic SOX11 missense variant can be inherited from a
      mildly affected mother, so de novo occurrence is usual but not obligatory.
pathophysiology:
- name: Heterozygous SOX11 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    De novo missense variants clustering in the high-mobility-group (HMG)
    DNA-binding domain, truncating variants, or 2p25.2 microdeletions remove one
    functional copy of the single-exon SOX11 gene. Missense changes in the HMG
    domain either destabilise domain folding or distort the DNA-recognition
    loops.
  genes:
  - preferred_term: SOX11
    term:
      id: hgnc:11191
      label: SOX11
  molecular_functions:
  - preferred_term: sequence-specific DNA binding by the HMG box
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: DECREASED
  downstream:
  - target: Reduced Functional SOX11 Protein Dosage
    description: >-
      Deletion removes one copy outright; truncating variants remove the
      C-terminal transactivation domain; HMG-domain missense variants leave a
      nuclear-localised but DNA-binding-incompetent protein.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we perform whole-exome sequencing in additional CSS patients, identifying de novo SOX11 mutations in two patients with a mild CSS phenotype."
    explanation: >-
      First identification of de novo SOX11 variants as a cause of this
      neurodevelopmental phenotype.
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The two heterozygous mutations localize to the high-mobility group (HMG) domain."
    explanation: >-
      Localises the causal missense changes to the DNA-binding domain; FoldX
      modelling in the same paper predicts destabilisation (S60P) or altered
      DNA-recognition-loop conformation (Y116C).
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified seven individuals with chromosome 2p25 deletions involving SOX11. Trio exome sequencing identified three de novo SOX11 variants, two missense (p.K50N; p.P120H) and one nonsense (p.C29*)."
    explanation: >-
      Establishes that whole-gene deletion and intragenic loss-of-function
      variants produce the same disorder, supporting haploinsufficiency.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that both heterozygous deletions and mutations of SOX11 are associated with microcephaly suggests that loss of function and haploinsufficiency may be the underlying mechanism."
    explanation: >-
      States the haploinsufficiency mechanism explicitly on the basis of
      convergent deletion and point-variant phenotypes.
- name: Reduced Functional SOX11 Protein Dosage
  biological_scale: MOLECULAR
  description: >-
    Roughly half the normal amount of functional SOX11 activity remains. This is
    a pure dosage lesion, not a dominant-negative one: disease missense proteins
    still localise correctly to the nucleus, and the recurrent Y116C change
    behaves as a recessive loss of function when modelled at the orthologous
    residue in Caenorhabditis elegans. Critically, the paralogous SoxC factors
    SOX4 and SOX12 do not compensate in humans. SOX11 protein abundance is also
    set post-translationally by USP11-mediated deubiquitination, an independent
    route to functional SOX11 insufficiency.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein stabilization
    term:
      id: GO:0050821
      label: protein stabilization
    modifier: DECREASED
  downstream:
  - target: Impaired SOX11 Target Gene Transactivation
    description: >-
      Reduced functional SOX11 dosage lowers transactivation of SOX11 target
      genes at critical developmental windows.
  evidence:
  - reference: PMID:31035284
    reference_title: "A novel human stem cell model for Coffin-Siris syndrome-like syndrome reveals the importance of SOX11 dosage for neuronal differentiation and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrating that in humans SOX11 haploinsufficiency cannot be compensated"
    explanation: >-
      Establishes that the SoxC paralogues SOX4 and SOX12 do not buffer reduced
      SOX11 dosage in humans, which is why heterozygous loss is pathogenic.
  - reference: PMID:40832700
    reference_title: "A Coffin-Siris syndrome-associated mutation modeled in Caenorhabditis elegans affects multiple developmental processes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "is a loss-of-function, recessive mutation that likely causes defects due to haploinsufficiency"
    explanation: >-
      The recurrent SOX11 Y116C change, modelled at the orthologous SEM-2 Y160
      residue, behaves as a recessive loss of function rather than a
      dominant-negative, supporting a pure dosage mechanism.
  - reference: PMID:35938035
    reference_title: "Identification and functional analysis of novel SOX11 variants in Chinese patients with Coffin-Siris syndrome 9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "WT and two missense mutant SOX11 protein localized in the nucleus"
    explanation: >-
      Nuclear localisation is preserved for disease missense proteins, arguing
      against a trafficking defect or a sequestration/dominant-negative model
      and for a DNA-binding/transactivation dosage defect.
  - reference: PMID:33579706
    reference_title: "Usp11 controls cortical neurogenesis and neuronal migration through Sox11 stabilization."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Usp11 ablation compromises Sox11 protein accumulation in the developing cortex, despite the induction of Sox11 mRNA."
    explanation: >-
      Shows that SOX11 protein abundance is controlled post-translationally by
      USP11, an independent route to functional SOX11 insufficiency. Marked
      PARTIAL because this is a separate USP11-related disorder, not a mechanism
      demonstrated in SOX11 variant carriers.
- name: Impaired SOX11 Target Gene Transactivation
  biological_scale: MOLECULAR
  description: >-
    SOX11 acts as a transcriptional activator at target promoters. Disease
    variants reduce SOX11-dependent transactivation in reporter assays, so the
    downstream neurodevelopmental gene programme is under-expressed at critical
    windows of brain development.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Neural Precursor Proliferation-Differentiation Imbalance
    description: >-
      Under-transactivation of neurogenic target genes shifts neural precursors
      away from timely neuronal differentiation.
  - target: Increased Neuronal Apoptosis
    description: >-
      Loss of SOX11-dependent survival signalling increases programmed death of
      newly generated neurons.
  - target: SOX11-Specific DNA Methylation Episignature
    description: >-
      Altered SOX11 transcriptional output is reflected in a reproducible
      genome-wide blood DNA methylation signature.
  - target: Elevated Hedgehog Signalling in the Developing Eye
    description: >-
      SOX11 normally restrains shha transcription; loss of that restraint
      raises Hedgehog pathway output during ocular morphogenesis.
  - target: Reduced FGF9-Driven Mandibular Mesenchyme Proliferation
    description: >-
      FGF9 is a direct SOX11 target driving proliferation in the developing
      mandible and palatal shelf.
  - target: Disrupted Nephrogenic Gdnf Domain Restriction
    description: >-
      SOX11 restricts the rostral extent of the Gdnf expression domain in the
      nephrogenic cord and regulates a protocadherin B cluster locus control
      region.
  - target: Impaired Hypothalamic-Pituitary Gonadotropic Axis Development
    description: >-
      Reduced SOX11 activity impairs development of the GnRH neuroendocrine
      axis and associated olfactory/pituitary structures.
  - target: Impaired Cochlear Nerve Development
    description: >-
      SOX11 is required for cochlear sensory neuron survival and axonal growth,
      so reduced activity can produce cochlear nerve deficiency.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Luciferase assays using the GDF5 promoter in HeLa and ATDC5 cells, showed both mutant proteins had decreased transcriptional activities compared with wild type"
    explanation: >-
      Directly demonstrates that the disease-associated HMG-domain missense
      proteins are transcriptionally hypomorphic.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our luciferase reporter gene assays provide further evidence in support of this as they indicate a reduced ability of mutant SOX11 to induce gene expression."
    explanation: >-
      Independent replication of reduced transactivation for a second set of
      patient variants.
  - reference: PMID:32574812
    reference_title: "Regulatory roles for SOX11 in development, stem cells and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SOX11 regulates progenitor and stem cell behavior, and often acts together with the other two SOXC group members, SOX4 and SOX12, in regulating developmental processes, including neurogenesis and skeletogenesis."
    explanation: >-
      Review context for the developmental gene programme that SOX11 normally
      transactivates.
- name: Neural Precursor Proliferation-Differentiation Imbalance
  biological_scale: CELLULAR
  description: >-
    SOX11 haploinsufficiency shifts the balance between neural precursor
    proliferation and neuronal differentiation, so fewer neurons are generated
    per progenitor pool.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: DECREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DYSREGULATED
  downstream:
  - target: Reduced Cortical Neurogenesis and Brain Growth
    description: >-
      Fewer neurons are produced from the precursor pool, reducing cortical
      neuron output.
  evidence:
  - reference: PMID:31035284
    reference_title: "A novel human stem cell model for Coffin-Siris syndrome-like syndrome reveals the importance of SOX11 dosage for neuronal differentiation and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SOX11 haploinsufficiency impaired the generation of neurons and resulted in a proliferation/differentiation imbalance of neural precursor cells and enhanced neuronal cell death."
    explanation: >-
      Isogenic CRISPR/Cas9 SOX11+/- human embryonic stem cell model shows that
      one-copy loss alone is sufficient to produce this cellular phenotype.
- name: Increased Neuronal Apoptosis
  biological_scale: CELLULAR
  description: >-
    SOX11 also acts as a neuronal survival factor; reduced dosage increases
    apoptotic death of newly born neurons in the developing central nervous
    system.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: positive regulation of neuron apoptotic process
    term:
      id: GO:0043525
      label: positive regulation of neuron apoptotic process
    modifier: INCREASED
  downstream:
  - target: Reduced Cortical Neurogenesis and Brain Growth
    description: >-
      Loss of newly generated neurons compounds the reduced neuronal output and
      limits brain growth.
  evidence:
  - reference: PMID:31035284
    reference_title: "A novel human stem cell model for Coffin-Siris syndrome-like syndrome reveals the importance of SOX11 dosage for neuronal differentiation and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SOX11 haploinsufficiency impaired the generation of neurons and resulted in a proliferation/differentiation imbalance of neural precursor cells and enhanced neuronal cell death."
    explanation: >-
      The same isogenic human stem cell model demonstrates enhanced neuronal
      death on loss of a single SOX11 copy.
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "apoptotic increases exclusively in microcephalic embryos"
    explanation: >-
      Acridine orange and TUNEL staining in sox11a/b zebrafish morphants link
      increased CNS apoptosis to the small-head phenotype.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sox11 knockdown does not alter proliferation but is associated with increased neuronal apoptosis"
    explanation: >-
      Independent amphibian evidence that Sox11 loss acts predominantly through
      neuronal survival rather than proliferation in that context.
- name: Reduced Cortical Neurogenesis and Brain Growth
  biological_scale: TISSUE
  description: >-
    The combination of impaired neuronal generation and increased neuronal death
    reduces the number of cortical neurons produced during fetal development,
    yielding a smaller brain with a thin cerebral cortex.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  biological_processes:
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
    modifier: DECREASED
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: DECREASED
  downstream:
  - target: Microcephaly and Impaired Cognitive Development
    description: >-
      Reduced cortical neuron number manifests postnatally as microcephaly,
      developmental delay, and intellectual disability.
  evidence:
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SOX11 null mice have reduced cortical neurogenesis secondary to reduced proliferation and abnormal differentiation of neuronal progenitor cells.3 This results in SOX11 null mice having reduced brain weights and thin cerebral cortices."
    explanation: >-
      Mouse data establishing the tissue-level consequence of Sox11 loss on
      cortical neurogenesis and brain size.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphants had significant reduction in head size compared with controls. This suggests that SOX11 loss of function can be associated with microcephaly."
    explanation: >-
      Xenopus Sox11 knockdown reproduces reduced head size, linking the
      molecular lesion to the brain-growth phenotype.
- name: Microcephaly and Impaired Cognitive Development
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the neural arm of the cascade: postnatal
    microcephaly with global developmental delay, intellectual disability, and
    a high burden of autistic traits.
  evidence:
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals had microcephaly, developmental delay and shared dysmorphic features compatible with mild Coffin-Siris syndrome."
    explanation: >-
      Human cohort observation of the microcephaly/developmental-delay endpoint
      in SOX11 deletion and point-variant carriers.
  - reference: PMID:37558216
    reference_title: "Pathogenic variants in SOX11 mimicking Pitt-Hopkins syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we made a confirmation that overall SOX11 abnormalities feature a distinctive disorder characterised by severe ID, high incidence of microcephaly and low frequency of congenital malformations"
    explanation: >-
      Literature review of 32 well-characterised individuals confirming that
      severe intellectual disability plus microcephaly dominates the phenotype.
- name: SOX11-Specific DNA Methylation Episignature
  biological_scale: MOLECULAR
  description: >-
    Individuals with pathogenic SOX11 variants carry a reproducible,
    disorder-specific genome-wide blood DNA methylation pattern. This
    episignature is mechanistically informative as well as diagnostically
    useful: it separates SOX11 syndrome from the BAF (SWI/SNF) chromatin
    remodeller disorders with which SOX11 is clinically lumped.
  evidence:
  - reference: PMID:35341651
    reference_title: "SOX11 variants cause a neurodevelopmental disorder with infrequent ocular malformations and hypogonadotropic hypogonadism and with distinct DNA methylation profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinctive pattern of blood DNA methylation was identified in SOX11 syndrome, separating SOX11 syndrome from other BAFopathies."
    explanation: >-
      Direct molecular evidence that the SOX11 entity is separable from the
      BAFopathies, supporting a split rather than a lump against classical
      Coffin-Siris syndrome.
- name: Disrupted Ocular Morphogenesis
  conforms_to: "ocular_morphogenesis_failure#Disrupted Optic Cup and Globe Morphogenesis"
  biological_scale: TISSUE
  description: >-
    SOX11 is required for normal eye development. Reduced SOX11 activity can
    produce structural eye malformations (microphthalmia, iris coloboma) in a
    minority of affected individuals, which is why the OMIM/MONDO disease name
    carries the "with or without ocular malformations" qualifier.
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  biological_processes:
  - preferred_term: eye development
    term:
      id: GO:0001654
      label: eye development
    modifier: DECREASED
  - preferred_term: eye morphogenesis
    term:
      id: GO:0048592
      label: eye morphogenesis
    modifier: ABNORMAL
  - preferred_term: camera-type eye morphogenesis
    term:
      id: GO:0048593
      label: camera-type eye morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There is also evidence that SOX11 plays a role in ocular development. Sox11 knockdown in zebrafish induces microphthalmia with or without iris coloboma."
    explanation: >-
      Model-organism basis for the ocular arm of the SOX11 phenotype.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular abnormalities were present in both deletion and mutation cases; case 1 had right microphthalmia"
    explanation: >-
      Human observation of structural microphthalmia in a SOX11-only deletion
      carrier, matching the animal-model prediction.
  downstream:
  - target: Microphthalmia
    description: Reduced ocular morphogenesis can produce a small globe.
    causal_link_type: DIRECT
  - target: Coloboma
    description: Disrupted ocular morphogenesis can prevent optic-fissure closure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Impaired Hypothalamic-Pituitary Gonadotropic Axis Development
  biological_scale: TISSUE
  description: >-
    A subset of affected individuals have idiopathic hypogonadotropic
    hypogonadism, with anosmic (Kallmann-like) and normosmic forms, plus
    additional anterior pituitary hormone deficiencies and structural
    hypothalamic/pituitary and olfactory-bulb defects. This indicates that
    SOX11 is required for development of the GnRH neuroendocrine axis at both
    hypothalamic and pituitary levels.
  cell_types:
  - preferred_term: hypothalamic gonadotropin-releasing hormone neuron
    term:
      id: CL:0011111
      label: hypothalamic gonadotropin-releasing hormone neuron
  locations:

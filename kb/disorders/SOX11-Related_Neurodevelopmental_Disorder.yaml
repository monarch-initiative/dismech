    snippet: "Homozygous ablation of SOX11 in a mouse model resulted in a reduction in sensory neuron survival and decreased axonal growth. A heterozygous knockout mice model had hearing impairment with grossly normal inner ear structures like the two probands reported."
    explanation: >-
      Mouse data connect SOX11 dosage to sensory neuron survival and hearing
      impairment with structurally normal inner ears.

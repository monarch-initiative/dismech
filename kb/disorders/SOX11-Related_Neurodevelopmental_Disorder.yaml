      SOX11 probands.
- name: Elevated Hedgehog Signalling in the Developing Eye
  conforms_to: "ocular_morphogenesis_failure#Eye Field Specification and Optic Vesicle Patterning Perturbation"
  biological_scale: CELLULAR
  description: >-
    A mechanistically counter-intuitive arm: loss of SOX11 raises rather than
    lowers signalling output downstream, because SOX11 normally acts as a
    negative regulator of shha transcription during ocular morphogenesis. The
    resulting excess Hedgehog signalling causes failure of choroid fissure
    closure. In zebrafish the ocular phenotype is rescued by the Hedgehog
    inhibitor cyclopamine, so the lesion is pathway hyperactivity, not loss.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  - preferred_term: camera-type eye development
    term:
      id: GO:0043010
      label: camera-type eye development
    modifier: ABNORMAL
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  downstream:
  - target: Disrupted Ocular Morphogenesis
    description: >-
      Excess Hedgehog signalling disrupts choroid fissure closure and lens
      development, producing coloboma and microphthalmia.
  evidence:
  - reference: PMID:25010521
    reference_title: "Sox11 is required to maintain proper levels of Hedgehog signaling during vertebrate ocular morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sox11 Negatively Regulates Hedgehog Signaling"
    explanation: >-
      Establishes the direction of the effect: SOX11 restrains Hedgehog
      signalling, so SOX11 loss produces pathway hyperactivity in the eye.
- name: Reduced FGF9-Driven Mandibular Mesenchyme Proliferation
  biological_scale: CELLULAR
  description: >-
    SOX11 directly regulates Fgf9 expression, and Fgf9 in turn drives Cyclin
    D1-dependent proliferation of the developing mandibular mesenchyme. Loss of
    SOX11 reduces this proliferation.

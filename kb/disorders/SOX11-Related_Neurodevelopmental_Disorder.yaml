notes: >-
  GeneReviews baseline. There is no SOX11-specific GeneReviews chapter; the
  Coffin-Siris Syndrome chapter (PMID:23556151) is the applicable expert-curated
  reference and lists SOX11 as one of 14 Coffin-Siris-spectrum genes. Its
  Clinical Characteristics section aggregates all 14 genes and is therefore
  dominated by BAF core-subunit cases, so it is used here for the gene list,
  management, surveillance, and genetic counselling, and is NOT used as the
  source of SOX11 phenotype frequencies.

  Lump-versus-split decision. This entry is curated as a distinct disease rather
  than as a presentation of classical Coffin-Siris syndrome, on three grounds:
  (1) mechanism - SOX11 is a transcription factor acting downstream of the
  PAX6-BAF complex, not a BAF core subunit, and SOX11 and BAF-subunit variants
  are mutually exclusive in Coffin-Siris cohorts (PMID:24886874); (2) molecular
  class separation - SOX11 cases carry a blood DNA methylation episignature that
  separates them from the BAFopathies (PMID:35341651); (3) phenotype -
  SOX11 disease carries a distinctive burden of microcephaly, hypogonadotropic
  hypogonadism, and infrequent congenital malformations relative to classical
  Coffin-Siris syndrome (PMID:37558216, PMID:35341651). MONDO currently places
  MONDO:0014376 as is_a MONDO:0015452 (Coffin-Siris syndrome); that placement is
  retained as the ontology anchor without importing BAF cohort data.

  Frequency-band provenance. Phenotype bands are derived preferentially from the
  pooled literature table in PMID:35938035 (Table 1, n = 58 reported patients)
  and, for the ocular arm, from the pooled 58-case ophthalmological review
  PMID:40933692, in preference to the 7-patient series PMID:39333428. The
  derivation for each band is shown in the corresponding evidence explanation
  and summarised in the sox11_phenotype_frequency_gap discussion.

  Claims deliberately not curated for want of a quotable source. The
  Al-Jawahiri cohort (PMID:35341651) reports its per-phenotype denominators only
  in body text; the cache is content_type abstract_only and a re-fetch on
  2026-07-31 did not obtain full text despite PMCID PMC9245088. Consequently the
  following are NOT asserted anywhere in this entry: hypogonadotropic
  hypogonadism 8/38, developmental delay / intellectual disability 37/38,
  abnormal brain MRI 12/20, agenesis of the corpus callosum, anterior pituitary
  hypoplasia, and the episignature's 224-probe / 10-case-vs-50-control training
  detail. Cerebellar vermis hypoplasia IS curated, unbanded, because a single
  case with an isolated de novo SOX11 nonsense variant and a normal array CGH is
  quotable from the full text of PMID:26543203.

  Impaired Adaptive Behaviour carries no ontology term. The construct measured is
  a Vineland adaptive-behaviour composite; HP:0006889 (Borderline intellectual
  disability) was used as a proxy in the initial version of this entry and has
  been removed, since it names a cognitive band rather than adaptive function
  and would misrepresent the finding. A new HPO term request for an
  adaptive-behaviour impairment concept is the correct resolution.

  GeneReviews cross-check. The Coffin-Siris Syndrome GeneReviews Clinical
  Characteristics items were checked one by one against this entry. Captured
  here with SOX11-specific citations: developmental delay/intellectual
  disability, feeding difficulties, hypotonia, hearing impairment, eye issues,
  congenital heart defects, behavioural issues, and fifth-digit nail/phalanx
  hypoplasia. Deliberately NOT imported because no SOX11-specific source was
  found for them: epilepsy ("about half of affected individuals"), frequent
  infections, joint laxity, scoliosis, ptosis, strabismus, obesity, tics, sleep
  disturbance, genitourinary malformations, and the ARID1A-specific
  hepatoblastoma surveillance. Those figures come from BAF-core-subunit-dominated
  cohorts and importing them would be exactly the named-entity error this entry
  is written to avoid. The GeneReviews "Agents/Circumstances to Avoid" section
  contains no drug-safety warning in the cached abstract, so no treatment carries
  one.

  MONDO anchoring. The deep-research report recommended MONDO:0100626
  ("SOX11-related complex neurodevelopmental disorder with or without congenital
  anomalies", the ClinGen-grounded term) as the disease_term in preference to
  MONDO:0014376. Both terms carry the same RO:0004003 relation to HGNC:11191
  (SOX11), and MONDO lists this entry's anchor label as a NARROW synonym of
  MONDO:0100626. This entry keeps MONDO:0014376 because that is the term the
  curation request and the tracking issue specify, and records MONDO:0100626
  under mappings as a skos:broadMatch so a future re-anchoring is a one-line
  change. This is a deliberate, documented deviation from the report.

  Deep research provenance. One provider was run: claude_code (23 minutes, 8 web
  searches, 53 citations). Its recommendations were treated as leads. Every PMID
  it surfaced that is cited here was fetched with just fetch-reference and every
  snippet was verified as a byte-exact substring of the cached abstract. Content
  the report marked [FULL-TEXT] (body text of the open-access Al-Jawahiri 2022
  paper) was NOT used for snippets, because body text does not validate against
  a PubMed-abstract cache; where those figures were valuable but unquotable
  (per-phenotype denominators from the 38-patient cohort, cerebellar hypoplasia,
  corpus callosum agenesis, pituitary hypoplasia, the 224-probe episignature
  detail, the ~21% hypogonadotropic hypogonadism rate) the claim was either
  dropped or carried in prose without a frequency band. The report also flagged
  an HPO typo in its primary source (HP:0013272 for abnormal eye morphology,
  which should be HP:0012372); neither ID is used here.

  Evidence limitations. No population prevalence estimate was found for this
  disorder and none is asserted. Frequency bands are given only where a
  denominator exists in a cited abstract, and the largest such denominator is
  small (n=7 for the clinical-feature counts, n=21 for the behavioural
  measures); the 38-patient Al-Jawahiri cohort abstract reports the
  episignature and the hypogonadotropic hypogonadism association but no
  per-phenotype denominators, so its numbers could not be used. Cleft palate,
  coarctation of the aorta, cochlear nerve hypoplasia, and olfactory bulb
  hypoplasia rest on single case reports and carry no frequency.

- name: Impaired Cochlear Nerve Development
  biological_scale: TISSUE
  description: >-
    SOX11 is highly expressed in the developing inner ear and is required for
    sensory neuron survival and axonal outgrowth. Reduced dosage can produce
    cochlear nerve hypoplasia or aplasia with sensorineural hearing loss despite
    grossly normal inner ear structures.

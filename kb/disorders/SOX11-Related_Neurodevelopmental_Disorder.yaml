      consequence in the Sox11 mouse mutant.
  - reference: PMID:26826126
    reference_title: "Ablation of the Sox11 Gene Results in Clefting of the Secondary Palate Resembling the Pierre Robin Sequence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

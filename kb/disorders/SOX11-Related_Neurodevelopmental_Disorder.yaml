name: SOX11-Related Neurodevelopmental Disorder
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- Coffin-Siris syndrome 9
- CSS9
- SOX11 syndrome
- IDDMOH
- intellectual developmental disorder, autosomal dominant 27
- MRD27
description: >
  SOX11-related neurodevelopmental disorder is a rare autosomal dominant
  condition caused by heterozygous de novo loss-of-function or missense
  variants in SOX11 (2p25.2), or by microdeletions encompassing the gene.
  SOX11 encodes a single-exon SoxC-group high-mobility-group (HMG) box
  transcription factor that drives neural progenitor proliferation, neuronal
  differentiation, and neuronal survival during fetal brain development.
  Core clinical features are neurodevelopmental delay and intellectual
  disability, microcephaly, hypotonia, short stature, autistic traits, and
  mild distal-limb findings (fifth-finger clinodactyly, hypoplastic fifth
  nails). A subset of individuals have ocular malformations (microphthalmia,
  iris coloboma) or hypogonadotropic hypogonadism, which is why OMIM/MONDO
  name the entity "intellectual developmental disorder with microcephaly and
  with or without ocular malformations or hypogonadotropic hypogonadism".
  The disorder is repeatedly labelled "Coffin-Siris syndrome 9" in the
  literature because the first two probands had a mild Coffin-Siris-like
  presentation, but SOX11 is a transcriptional effector acting DOWNSTREAM of
  the PAX6-BAF (SWI/SNF) complex rather than a BAF core subunit, and SOX11
  cases carry a blood DNA methylation episignature that separates them from
  the BAFopathies.
disease_term:
  preferred_term: intellectual developmental disorder with microcephaly and with or without ocular malformations or hypogonadotropic hypogonadism
  term:

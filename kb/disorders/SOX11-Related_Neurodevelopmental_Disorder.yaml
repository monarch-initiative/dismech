differential_diagnoses:
- name: Coffin-Siris syndrome due to BAF (SWI/SNF) core-subunit variants
  description: >-
    Classical Coffin-Siris syndrome is caused by heterozygous variants in genes
    encoding subunits of the BAF/SWI-SNF chromatin remodelling complex
    (ARID1A, ARID1B, ARID2, DPF2, SMARCA4, SMARCB1, SMARCC2, SMARCD1,
    SMARCE1, BICRA) plus PHF6. SOX11 shares the clinical label
    "Coffin-Siris syndrome 9" but is a transcription factor acting DOWNSTREAM
    of the PAX6-BAF complex, not a component of it. This is the single most
    important named-entity distinction for this entry: BAF core-subunit cohort
    phenotype data must NOT be attributed to SOX11.
  distinguishing_features:
  - Molecular criterion - the causal variant is in SOX11 (2p25.2), not in a BAF subunit gene; SOX11 and BAF-subunit variants are mutually exclusive in Coffin-Siris cohorts.
  - Episignature - blood DNA methylation profiling separates SOX11 syndrome from the BAFopathies.
  - Mechanism - SOX11 is transcriptionally downstream of the PAX6-BAF complex (BRG1/SMARCA4 binds the SOX11 promoter), so SOX11 loss is a narrower lesion than loss of the remodeller itself.
  - Severity - BAF core-subunit disease tends to be more severe; SOX11 accounts for only about 2% of Coffin-Siris cohorts and clusters at the milder dysmorphic end while carrying a heavier microcephaly burden.
  - Epilepsy burden - GeneReviews reports epilepsy in about half of Coffin-Siris syndrome overall, whereas epilepsy is distinctly uncommon in reported SOX11 cohorts. Importing the Coffin-Siris epilepsy frequency into a SOX11 entry would materially misstate the phenotype, so no epilepsy frequency is curated here.
  - Coarse facies - coarse facial features are a hallmark of ARID1B Coffin-Siris syndrome and are characteristically absent in SOX11 disease, making facial gestalt a discriminator in the opposite direction to the historical CSS9 label.
  - Cancer surveillance - the ARID1A-specific AFP/hepatoblastoma surveillance recommendation in the Coffin-Siris GeneReviews chapter is gene-specific and is deliberately NOT applied to SOX11; no cancer predisposition has been reported with germline SOX11 variants.
  - Direction of the SOX11-BAF relationship is not fixed - in germline neurodevelopmental disease SOX11 sits downstream of PAX6-BAF, whereas in adrenergic neuroblastoma SOX11 acts upstream of and regulates SWI/SNF core components including SMARCA4 and ARID1A. The somatic over-expression biology is separate and must not be imported into this germline entry.
  evidence:
  - reference: PMID:35341651
    reference_title: "SOX11 variants cause a neurodevelopmental disorder with infrequent ocular malformations and hypogonadotropic hypogonadism and with distinct DNA methylation profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX11 syndrome is a distinct clinical entity with characteristic clinical features and episignature differentiating it from BAFopathies."
    explanation: >-
      Primary evidence for keeping SOX11 split from the BAFopathies rather than
      lumping it into classical Coffin-Siris syndrome.
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX11 is the downstream transcriptional factor of the PAX6-BAF complex, highlighting the importance of the BAF complex and SOX11 transcriptional network in brain development."
    explanation: >-
      Establishes the downstream (non-core-subunit) position of SOX11 relative
      to the BAF complex.
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations of SOX11 and other BAF subunit genes are mutually exclusive in CSS."
    explanation: >-
      Mutual exclusivity confirms these are separate molecular causes rather
      than co-occurring lesions.
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX11 mutations appear to be a rare cause of CSS as only 2 out of 92 patients (2.2%) showed SOX11 abnormality and to be limited to the mild end of CSS phenotype."
    explanation: >-
      Quantifies the small SOX11 share of Coffin-Siris cohorts, another reason
      not to import BAF-cohort statistics into this entry.
  - reference: PMID:23556151
    reference_title: "Coffin-Siris Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "About half of affected individuals have epilepsy."
    explanation: >-
      The Coffin-Siris epilepsy figure that must NOT be attributed to SOX11;
      quoted here explicitly so the boundary is auditable rather than implicit.
  - reference: PMID:36882421
    reference_title: "SOX11 regulates SWI/SNF complex components as member of the adrenergic neuroblastoma core regulatory circuitry."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Most notably, SOX11 controls chromatin regulatory complexes, including 10 SWI/SNF core components among which SMARCC1, SMARCA4/BRG1 and ARID1A."
    explanation: >-
      Demonstrates that the SOX11-BAF relationship is bidirectional and
      context-dependent. This is somatic neuroblastoma biology and is cited only
      to justify keeping the germline entry mechanistically separate; it is not
      curated as a mechanism of the neurodevelopmental disorder.
  notes: >-
    MONDO:0014376 is currently modelled as is_a MONDO:0015452 (Coffin-Siris
    syndrome). This entry retains MONDO:0014376 as its anchor but curates the
    SOX11 entity in its own right and does not inherit BAF-subunit cohort data.
    For the same reason disease_term is deliberately left UNBOUND on this
    differential: MONDO:0015452 is this entry's own superclass, so binding it
    would make the entry machine-assert its ancestor as a differential
    diagnosis. The prose here concerns the BAF core-subunit SIBLINGS (ARID1B,
    SMARCB1, SMARCA4, ARID1A), which the grouping term does not isolate, and
    binding a single subtype such as MONDO:0007617 would narrow the
    differential to one gene and misstate it in the other direction.
- name: SOX4-related neurodevelopmental disorder (Coffin-Siris syndrome 10)
  disease_term:
    preferred_term: Coffin-Siris syndrome 10
    term:
      id: MONDO:0032791
      label: Coffin-Siris syndrome 10
  description: >-
    SOX4 is the closest SoxC paralogue of SOX11 and is also listed as a
    Coffin-Siris syndrome gene in GeneReviews. The phenotypes overlap
    substantially, so gene identity - not clinical gestalt - is the
    discriminator.
  distinguishing_features:
  - The causal variant is in SOX4, not SOX11; the two are separate MONDO/OMIM entities despite overlapping presentations.
  - SOX11-specific findings such as the SOX11 blood methylation episignature and the documented hypogonadotropic hypogonadism association are not established for SOX4.
  evidence:
  - reference: PMID:23556151
    reference_title: "Coffin-Siris Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ARID1B, ARID2, BICRA, DPF2, PHF6, SMARCA2, SMARCA4, SMARCB1, SMARCC2, SMARCD1, SMARCE1, SOX4, or SOX11."
    explanation: >-
      GeneReviews lists SOX4 and SOX11 as separate Coffin-Siris-spectrum genes,
      confirming they are distinct entities that share a clinical label.
- name: SOX2-related anophthalmia syndrome
  notes: >-
    disease_term left unbound, but NOT because no term exists - an earlier
    version of this rationale said so and was wrong. MONDO:0008799
    (OMIM:206900) carries "SOX2 anophthalmia syndrome" as a RELATED synonym and
    is the canonical SOX2 disorder. It is not bound here because its primary
    label, "anophthalmia/microphthalmia-esophageal atresia syndrome",
    foregrounds a feature (oesophageal atresia) that is not what makes SOX2 a
    differential for this entry; binding it would overstate the resemblance.
    Recorded explicitly so the next curator is not told to stop looking for a
    term that does exist.
  description: >-
    SOX2 haploinsufficiency causes anophthalmia/microphthalmia with
    developmental delay. Because SOX11 loss can also produce microphthalmia and
    developmental delay, SOX2 is a realistic clinical and named-entity
    confusion, but SOX2 belongs to the SoxB1 group and is a different gene at a
    different locus.
  distinguishing_features:
  - Severe bilateral anophthalmia is characteristic of SOX2 and is not a feature of SOX11-related disorder, in which ocular malformation is infrequent and usually milder.
  - Fifth-digit nail/phalanx hypoplasia, hypogonadotropic hypogonadism with olfactory bulb hypoplasia, and the SOX11 episignature point to SOX11.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "of other SOX genes ( SOX2, SOX9 and SOX10) is known to cause human diseases"
    explanation: >-
      Confirms SOX2 as a separate SOX-family disease gene, distinguishing it
      from SOX11.
- name: Pitt-Hopkins syndrome (TCF4)
  disease_term:
    preferred_term: Pitt-Hopkins syndrome
    term:
      id: MONDO:0012589
      label: Pitt-Hopkins syndrome
  description: >-
    A subset of individuals with SOX11 variants present with a clinical gestalt
    indistinguishable from Pitt-Hopkins syndrome, so a negative TCF4 result in a
    clinically diagnosed Pitt-Hopkins patient should prompt SOX11 testing.
  distinguishing_features:
  - Pitt-Hopkins syndrome is caused by TCF4 haploinsufficiency; a normal TCF4 result with a clinical Pitt-Hopkins gestalt should trigger broader sequencing.
  - Approximately 22% of well-characterised published SOX11 cases have a Pitt-Hopkins-overlapping presentation.
  evidence:
  - reference: PMID:37558216
    reference_title: "Pathogenic variants in SOX11 mimicking Pitt-Hopkins syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By reviewing both clinically and genetically 32 out of 82 subjects reported in the literature with SOX11 variants, for whom detailed information are provided, we found that 7/32 (22%) had a clinical presentation overlapping PTHS."
    explanation: >-
      Quantifies the Pitt-Hopkins overlap and establishes SOX11 as a
      differential for TCF4-negative Pitt-Hopkins.
- name: Contiguous-gene 2p25 deletion phenotypes (MYCN, MYT1L)
  description: >-
    Larger 2p25 deletions that remove SOX11 can also remove MYCN (Feingold
    syndrome) or MYT1L, so the phenotype of a deletion carrier may not be
    attributable to SOX11 alone.
  distinguishing_features:
  - Deletion breakpoint mapping determines which additional genes are lost; deletions containing SOX11 alone isolate the SOX11 contribution.
  - MYT1L-only deletions tend to cause macrocephaly, whereas SOX11-containing deletions cause microcephaly.
  evidence:
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several other genes within the deleted 2p25 regions could contribute to the observed phenotypes."
    explanation: >-
      Explicit caution against attributing all deletion-carrier features to
      SOX11 haploinsufficiency.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that SOX11 haploinsufficiency may exert a powerful, negative influence on brain growth."
    explanation: >-
      The opposite head-size direction of MYT1L-only versus SOX11-containing
      deletions is what isolates the SOX11 contribution to microcephaly.
discussions:
- discussion_id: sox11_phenotype_frequency_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true population frequency of each SOX11 phenotype, and in
    particular of hypogonadotropic hypogonadism and ocular malformation?
  attaches_to:
  - pathophysiology#Impaired Hypothalamic-Pituitary Gonadotropic Axis Development
  - pathophysiology#Disrupted Ocular Morphogenesis
  rationale: >-
    The two qualifying features in the OMIM/MONDO disease name are ocular
    malformation and hypogonadotropic hypogonadism, both described as optional.
    The ocular half of that gap is now partly closed: a 2025 systematic
    ophthalmological review (PMID:40933692) pools 58 published single-nucleotide
    variant cases and reports ophthalmological malformation in 26/58 (44.83%),
    with ocular motor disorder the most prevalent subtype at 15/58 (29.31%).
    That pooled figure is what the Ophthalmological Malformation phenotype is
    banded on. It does not resolve the apraxia-specific rate, because "ocular
    motor disorder" is a broader category than Cogan-type oculomotor apraxia,
    and it does not address hypogonadotropic hypogonadism, for which no
    denominator-based frequency has been published in a source obtainable here.
    Elsewhere in the entry, bands are now derived preferentially from the pooled
    literature table in PMID:35938035 (Table 1, "Phenotypic comparison of our
    patient with reported patients", n = 58 reported patients) rather than from
    the 7-patient Sanchez-Martin series: intellectual disability 38/40 (95%,
    VERY_FREQUENT, upgraded from FREQUENT), developmental delay 36/37 (97%),
    microcephaly 11/28 (39%), short stature 10/30 (33%), fifth-finger
    clinodactyly 10/55 (18%, OCCASIONAL - corrected down from FREQUENT, which
    had been derived from the n=7 outlier figure of 5/7), and hypoplastic nails
    6/55 (11%, OCCASIONAL - previously unbanded). Each pooled row has a
    phenotype-specific denominator smaller than 58 because the row reflects only
    those individuals in whom the feature was reported; cryptorchidism 5/6 is
    left unbanded for that reason, since 6 is the reporting-conditional subset
    of 28 reported males. Two denominators remain out of reach: the 38-patient
    Al-Jawahiri cohort (PMID:35341651) reports per-phenotype counts only in body
    text, and a re-fetch on 2026-07-31 still returned an abstract-only cache
    despite the paper carrying PMCID PMC9245088, so its hypogonadotropic
    hypogonadism (8/38) and abnormal brain MRI (12/20) figures are not asserted
    here. Bands continue to be omitted rather than guessed wherever no
    denominator is quotable from a cached source.
  proposed_experiments:
  - experiment_id: sox11_denominator_phenotyping
    name: Denominator-based multisystem phenotyping of the full SOX11 cohort
    description: >-
      Systematic phenotyping of the full published and registry SOX11 cohort
      with mandatory endocrine and ophthalmological evaluation of every
      participant, so that the "with or without" qualifiers in the disease name
      can be replaced with real frequencies rather than ascertainment-biased
      case counts.
    decision_criterion: >-
      Per-phenotype frequencies with explicit denominators for hypogonadotropic
      hypogonadism and ocular malformation across an unselected SOX11 cohort.
- discussion_id: sox11_dosage_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the homozygous-null and morpholino knockdown models used for SOX11
    faithfully represent the human heterozygous loss-of-function state?
  attaches_to:
  - pathophysiology#Reduced Cortical Neurogenesis and Brain Growth
  - pathophysiology#Impaired Cochlear Nerve Development
  - pathophysiology#Disrupted Nephrogenic Gdnf Domain Restriction
  - pathophysiology#Mandibular Hypoplasia with Secondary Palatal Shelf Obstruction
  rationale: >-
    Much of the mechanistic evidence for the microcephaly and cochlear-nerve
    arms comes from homozygous Sox11-null mice, zebrafish sox11a/b double
    morphants, and Xenopus morphants - all effectively complete loss of
    function - whereas human disease is heterozygous. Tsurusaki et al. note that
    physical and functional abnormalities in heterozygous mice have not been
    described. The dosage mismatch is partly mitigated by the isogenic
    SOX11+/- human embryonic stem cell model (PMID:31035284), which is the
    strongest dosage-matched evidence available, but that model is in vitro.
    The same zygosity caveat applies to the organ arms added from the deep
    research: the duplex-kidney and secondary-cleft-palate mechanisms come from
    Sox11 whole-gene-deletion mice, and the corresponding human findings in
    heterozygotes are milder (small or malrotated kidney; cleft palate in a
    single reported individual). The C. elegans model is explicit that the
    orthologous Y116C change is recessive, which is itself a dosage mismatch
    with the dominant human disease even though it supports the loss-of-function
    interpretation.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Physical and functional abnormalities in hetero- zygotes have not been described."
    explanation: >-
      States directly that the heterozygous mouse - the dosage-matched model -
      has not been characterised, which is the substance of the mismatch.
  proposed_experiments:
  - experiment_id: sox11_het_mouse_deep_phenotyping
    name: Deep phenotyping of Sox11 heterozygous mice
    description: >-
      Characterise head size, cortical neuron number, and auditory brainstem
      response in Sox11 heterozygous mice, the dosage-matched in vivo model that
      has not previously been assessed.
    decision_criterion: >-
      Reduced brain size, reduced cortical neuron number, or elevated ABR
      thresholds in heterozygotes relative to littermate controls would confirm
      that single-copy loss is sufficient in vivo.
  - experiment_id: sox11_het_organoid
    name: Isogenic SOX11+/- human cerebral organoids
    description: >-
      Extend the existing two-dimensional isogenic SOX11+/- human embryonic stem
      cell model to three-dimensional cerebral organoids to test whether
      heterozygous dosage alone reduces neuron output in a human cortical
      context that includes outer radial glia.
    decision_criterion: >-
      Reduced organoid size and cortical neuron output in SOX11+/- versus
      isogenic wild-type organoids.
- discussion_id: sox11_noncoding_and_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the adult natural history of SOX11-related neurodevelopmental
    disorder, and do non-coding regulatory variants at the SOX11 locus cause it?
  attaches_to:
  - pathophysiology#Heterozygous SOX11 Loss of Function
  rationale: >-
    Two distinct gaps sit on the same node. First, every reported pathogenic
    lesion to date is coding or whole-gene: no non-coding or regulatory SOX11
    variant has been reported, despite a documented enhancer landscape at the
    locus, so the mutational spectrum in this entry may be incomplete by
    ascertainment rather than by biology. Second, the published cohort is
    paediatric-dominated; there is no natural-history study, no disease-specific
    quality-of-life instrument, no prognostic biomarker, and no clinical trial
    for this disorder, so the progression and outcome sections of this entry are
    intentionally empty rather than inferred.
  proposed_experiments:
  - experiment_id: sox11_regulatory_region_sequencing
    name: Targeted regulatory-region sequencing at the SOX11 locus
    description: >-
      Sequence the SOX11 promoter and annotated enhancer landscape in
      coding-negative individuals with a SOX11-syndrome-like phenotype or a
      SOX11 episignature, to test whether non-coding lesions account for
      unexplained cases.
    decision_criterion: >-
      Identification of a non-coding variant that segregates with phenotype and
      reduces SOX11 expression in a reporter assay.
  - experiment_id: sox11_adult_natural_history
    name: Prospective adult natural-history study
    description: >-
      Longitudinal follow-up of a molecularly confirmed SOX11 cohort into
      adulthood with standardised endocrine, ophthalmological, audiological,
      skeletal, and adaptive-function outcome measures.
    decision_criterion: >-
      Age-stratified outcome data sufficient to populate progression and
      prognosis for the entry.

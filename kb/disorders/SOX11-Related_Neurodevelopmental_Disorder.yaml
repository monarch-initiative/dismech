genetic:
- name: SOX11
  gene_term:
    preferred_term: SOX11
    term:
      id: hgnc:11191
      label: SOX11
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    Heterozygous pathogenic variants in SOX11 are the sole established cause of
    this disorder. The MONDO anchor MONDO:0014376 carries a single
    RO:0004003 (has material basis in germline mutation in) relation to
    HGNC:11191 (SOX11).
  notes: >-
    SOX11 (2p25.2) is a single-exon gene encoding a 441-amino-acid SoxC-group
    transcription factor. Pathogenic variation comprises de novo missense
    variants clustering in the HMG DNA-binding domain, truncating (nonsense and
    frameshift) variants, in-frame deletions, and whole-gene 2p25.2
    microdeletions. Because SOX11 is single-exon, truncating transcripts may
    escape nonsense-mediated decay, but the predicted proteins lack or disrupt
    the HMG domain and cannot bind DNA.

    SOX11 is genomically and functionally adjacent to two entities that must not
    be conflated with it: SOX4 (the closest SoxC paralogue, itself a
    Coffin-Siris-spectrum gene) and SOX2 (anophthalmia syndrome). Every citation
    in this entry was checked to confirm the reported gene is SOX11.
  evidence:
  - reference: PMID:24886874
    reference_title: "De novo SOX11 mutations cause Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we apply whole-exome sequencing (WES) to 92 CSS patients, and identify two de novo SOX11 mutations in two unrelated patients."
    explanation: >-
      Original gene-disease assertion for SOX11 based on trio whole-exome
      sequencing.
  - reference: PMID:42168980
    reference_title: "A de novo SOX11 mutation causing hypogonadotropic hypogonadism: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty unique variants were identified, 17/30 clustering within the HMG domain and 15/18 proven de-novo."
    explanation: >-
      Summarises the variant spectrum across the published SOX11 literature.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX11 is a single exon gene. Nonsense-mediated decay (NMD) may not occur with mutations in the final exon of a gene"
    explanation: >-
      Explains the single-exon architecture and its implication for the fate of
      truncating transcripts.
diagnosis:
- name: Molecular genetic testing for a heterozygous SOX11 variant
  description: >-
    SOX11-related neurodevelopmental disorder is a genotype-first diagnosis.
    There is no biochemical marker and the facial gestalt is explicitly
    non-specific, so identification of a heterozygous pathogenic SOX11 variant
    by multigene panel or exome/genome sequencing is the confirmatory test.
    SOX11 is one of the genes in which a pathogenic variant establishes the
    Coffin-Siris syndrome diagnosis per GeneReviews, although the SOX11 entity
    is now recognised as clinically and epigenetically distinct from the
    BAF core-subunit BAFopathies (see differential_diagnoses).
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23556151
    reference_title: "Coffin-Siris Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of CSS is established in a proband with suggestive findings and a heterozygous pathogenic variant in one of the following 14 known genes identified by molecular genetic testing: ARID1A, ARID1B, ARID2, BICRA, DPF2, PHF6, SMARCA2, SMARCA4, SMARCB1, SMARCC2, SMARCD1, SMARCE1, SOX4, or SOX11."
    explanation: >-
      GeneReviews Diagnosis/Testing section, naming SOX11 explicitly among the
      genes in which a heterozygous pathogenic variant establishes the
      diagnosis by molecular genetic testing.
  - reference: PMID:26543203
    reference_title: "Deletions and de novo mutations of SOX11 are associated with a neurodevelopmental disorder with features of Coffin-Siris syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used array based comparative genomic hybridisation and trio exome sequencing to identify children with intellectual disability who have deletions or de novo point mutations disrupting SOX11."
    explanation: >-
      Documents the two complementary assays that detect the two lesion classes
      in this disorder: chromosomal microarray for whole-gene 2p25 deletions,
      and trio exome sequencing for de novo intragenic point variants.
  notes: >-
    SOX11 is a single-exon gene, so exome-based CNV callers with poor
    single-exon sensitivity may miss an intragenic deletion; the single-exon
    architecture is evidenced in the genetic section. No frequency of diagnostic
    yield is asserted because no SOX11-specific yield study exists.
- name: Blood DNA methylation episignature testing (EpiSign)
  description: >-
    Genome-wide DNA methylation profiling of peripheral blood identifies a
    SOX11-specific episignature that separates SOX11 syndrome from the BAF
    (SWI/SNF) core-subunit BAFopathies with which it is clinically confused.
    It is used both to confirm the diagnosis and to reclassify variants of
    uncertain significance. This assay is the discriminator the entity boundary
    rests on, and is modelled here as a diagnostic in addition to its
    pathophysiology node.
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:35341651
    reference_title: "SOX11 variants cause a neurodevelopmental disorder with infrequent ocular malformations and hypogonadotropic hypogonadism and with distinct DNA methylation profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood DNA methylation was assessed using Infinium MethylationEPIC array."
    explanation: >-
      Names the assay platform: genome-wide methylation array on peripheral
      blood DNA, the specimen and technology used clinically.
  - reference: PMID:35341651
    reference_title: "SOX11 variants cause a neurodevelopmental disorder with infrequent ocular malformations and hypogonadotropic hypogonadism and with distinct DNA methylation profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinctive pattern of blood DNA methylation was identified in SOX11 syndrome, separating SOX11 syndrome from other BAFopathies."
    explanation: >-
      States the discriminating performance that gives the assay its diagnostic
      value: it separates SOX11 syndrome from the BAFopathies, which is exactly
      the differential this entry's lump/split rationale turns on.
  markers: SOX11-specific peripheral-blood DNA methylation episignature
  notes: >-
    The episignature was derived from a small training set and the published
    per-probe detail (224 differentially methylated probes, methylation variant
    pathogenicity score, 10 cases vs 50 matched controls) sits in the paper's
    body text. Only the abstract of PMID:35341651 is obtainable - a re-fetch on
    2026-07-31 returned content_type abstract_only despite PMCID PMC9245088 -
    so those numbers are deliberately not asserted here rather than quoted from
    an unverifiable source. No sensitivity or specificity figure is asserted for
    the same reason.

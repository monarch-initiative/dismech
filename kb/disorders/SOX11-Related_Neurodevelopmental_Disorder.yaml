- name: Oculomotor Apraxia
  category: Ophthalmologic
  description: >-
    Cogan-type oculomotor apraxia (impaired initiation of voluntary horizontal
    saccades) is reported as a distinguishing feature of the SOX11 entity and is
    named in the MONDO definition of the SOX11 disorder. It is likely
    under-ascertained because it requires specialised neuro-ophthalmological
    assessment.

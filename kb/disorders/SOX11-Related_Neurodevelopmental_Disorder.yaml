    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cases 7 and 9 had oculomotor apraxia"
    explanation: >-
      Direct observation of oculomotor apraxia in two individuals in the 2p25
      deletion and de novo variant cohort.
  - reference: PMID:40933692
    reference_title: "Case Report: Observation of early-onset high myopia with fundus tessellation changes in Coffin-Siris syndrome 9 (CSS9) and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the most prevalent phenotype was ocular motor disorder (15/58, 29.31%)"
    explanation: >-
      Systematic pooled review of 58 published SOX11 cases finds ocular motor
      disorder to be the most prevalent ophthalmological phenotype. Marked
      PARTIAL and no band assigned to this node: "ocular motor disorder" is a
      broader category than Cogan-type oculomotor apraxia specifically, so
      15/58 (29.31%) is an upper bound on the apraxia frequency rather than a
      denominator for it. The pooled ophthalmological figure is banded on the
      Ophthalmological Malformation entry instead.

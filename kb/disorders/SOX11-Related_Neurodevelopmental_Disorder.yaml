    reference_title: "Ablation of the Sox11 Gene Results in Clefting of the Secondary Palate Resembling the Pierre Robin Sequence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that loss of Sox11led to reduced cell proliferation in the developing mandibular mesenchyme via Cyclin D1, leading to mandibular hypoplasia, which blocks tongue descent."
    explanation: >-

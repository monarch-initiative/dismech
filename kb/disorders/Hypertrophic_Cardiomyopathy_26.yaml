  - reference: PMID:30411535
    reference_title: Mutation profile of FLNC gene and its prognostic relevance in patients with hypertrophic cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLNC mutations were common in both HCM patients and healthy population. The
      pathogenicity of FLNC mutations detected in HCM patients and its association
      with the clinical outcomes should be cautiously interpreted.
    explanation: >-
      Records the interpretive caveat: FLNC variant carriage alone is not
      sufficient evidence of causation in a hypertrophic cardiomyopathy patient.
  - reference: PMID:32112656
    reference_title: A mutation update for the FLNC gene in myopathies and cardiomyopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Truncating variants with subsequent haploinsufficiency are associated with
      DCM and cardiac arrhythmias.
    explanation: >-
      States the truncating arm of the dichotomy and its haploinsufficiency
      mechanism. Evidence source is OTHER because this is a mutation-update
      review.
  - reference: PMID:32112656
    reference_title: A mutation update for the FLNC gene in myopathies and cardiomyopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants associated with HCM are predominantly missense variants, which
      cluster in the ROD2 domain.
    explanation: >-
      The complementary hypertrophic arm: HCM-associated FLNC variants are
      predominantly missense and cluster in ROD2, which is why this entry treats
      the ROD2 missense class as the core CMH26 genotype.
  - reference: PMID:33557094
    reference_title: "Cardiac Filaminopathies: Illuminating the Divergent Role of Filamin C Mutations in Human Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, the FLNC gene encoding the sarcomeric protein filamin C has gained
      special interest since FLNC mutations were found in several distinct and
      possibly overlapping cardiomyopathy phenotypes.
    explanation: >-
      Frames FLNC as a pleiotropic cardiomyopathy gene whose phenotypes must be
      distinguished rather than merged. Evidence source is OTHER because this is a
      review.
diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging. Establishes the hypertrophic phenotype (wall thickness),
    the characteristically small left ventricular cavity, and the restrictive
    filling pattern with severe diastolic dysfunction that distinguishes FLNC
    hypertrophic disease from hypercontractile sarcomeric HCM. Also the
    surveillance modality for genotype-positive relatives.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLNC variant carriers with the characteristic ECG had smaller left
      ventricular cavity size, lower contractility, and more severe diastolic
      dysfunction and were more likely to have a restrictive phenotype.
    explanation: >-
      These are the echocardiographic parameters (cavity size, contractility,
      diastolic function) that characterize the FLNC phenotype.
- name: Electrocardiography
  description: >-
    A 12-lead ECG is disproportionately informative in this entity: the
    distinctive repolarization pattern is present in about a third of FLNC
    variant carriers with HCM/RCM but in only 1% of non-FLNC HCM patients, and
    the ECG-positive subgroup is the one in which rare FLNC missense variants are
    almost fully explanatory. It therefore functions as a phenotype-first triage
    step for FLNC variant interpretation.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare FLNC missense variant burden indicated a low case excess among all HCM
      cases (etiologic fraction, 0.45; 95% confidence interval, 0.36-0.54), but in
      "ECG-positive" cases the etiologic fraction was substantially higher (0.98;
      95% confidence interval, 0.97-0.99).
    explanation: >-
      Quantifies the diagnostic value of the ECG phenotype for FLNC variant
      interpretation.
- name: Cardiac Magnetic Resonance Imaging
  description: >-
    Advanced imaging is part of the standard workup of FLNC variant carriers,
    characterizing wall thickness, cavity size, trabecular morphology (the
    saw-tooth hypertrabeculation of the ROD2 phenotype), and myocardial tissue
    characterization. No FLNC-specific late-gadolinium-enhancement signature has
    been established for the hypertrophic arm, so this is used as in other
    hypertrophic cardiomyopathies rather than as a gene-specific test.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carriers underwent advanced cardiac imaging and genetic cascade screening.
    explanation: >-
      Documents advanced cardiac imaging as part of the standard evaluation of
      FLNC variant carriers. PARTIAL because the abstract does not name the
      modality or report a gene-specific imaging finding.
- name: Genetic Testing
  description: >-
    Multi-gene cardiomyopathy panel or exome sequencing including FLNC. Three
    interpretive rules are specific to this gene: the variant class must be
    recorded (non-truncating for CMH26, truncating for the dilated/arrhythmogenic
    entity); missense variants require segregation or functional support
    before being called pathogenic, since FLNC missense variation is common in
    unaffected populations; and calls in exons 46-48 must be checked against the
    highly homologous downstream FLNC pseudogene, which is a short-read
    mis-mapping hazard in exactly the ROD2-adjacent region where this entity's
    variants cluster.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28356264
    reference_title: Screening of the Filamin C Gene in a Large Cohort of Hypertrophic Cardiomyopathy Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 448 HCM patients were next generation-sequenced (semiconductor
      chip technology) for the MYH7, MYBPC3, TNNT2, TNNI3, ACTC1, TNNC1, MYL2,
      MYL3, TPM1, and FLNC genes.
    explanation: >-
      Establishes the panel-based testing approach in which FLNC is sequenced
      alongside the classic sarcomere genes.
  - reference: PMID:30411535
    reference_title: Mutation profile of FLNC gene and its prognostic relevance in patients with hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pedigree analysis showed that mutations were not well segregated with HCM.
    explanation: >-
      Supports the requirement for segregation evidence before calling an FLNC
      missense variant causal in a hypertrophic cardiomyopathy patient.
  - reference: PMID:39132495
    reference_title: 'ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNC has a pseudogene located 53.6kb downstream from the functional FLNC
      gene, and exons 46, 47, and 48 are 98% homologous in the functional and
      pseudogene.
    explanation: >-
      Documents the technical hazard specific to sequencing this gene:
      near-identical pseudogene sequence over exons 46-48 makes short-read
      alignment ambiguous there, so variant calls in those exons need
      orthogonal confirmation before being reported. Sourced to the ClinGen HCVD-GCEP
      reappraisal, an expert-panel document rather than a primary study, hence
      OTHER.
- name: Endomyocardial or Explant Histopathology
  description: >-
    Not routine, but mechanistically decisive when tissue is available:
    filamin C-specific cytoplasmic inclusions identify the non-truncating
    aggregation mechanism, whereas their absence is characteristic of truncating
    FLNC disease. ROD2-domain missense carriers may instead show differential
    extracellular matrix remodeling without aggregates.
  evidence:
  - reference: PMID:26666891
    reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathology of heart tissue from patients of both families showed
      cytoplasmic inclusions suggesting protein aggregates, which were filamin-C
      specific for the p.S1624L by immunohistochemistry.
    explanation: >-
      Demonstrates the diagnostic histopathological signature of non-truncating
      FLNC disease.
differential_diagnoses:
- name: Sarcomeric hypertrophic cardiomyopathy (MYH7, MYBPC3 and other thick/thin filament genes)
  description: >-
    The dominant cause of familial HCM and the main alternative when left
    ventricular hypertrophy is found. Sarcomeric HCM arises from hypercontractile
    thick- and thin-filament lesions, whereas CMH26 is a Z-disc/protein-quality
    disease whose ventricle is not hypercontractile.
  distinguishing_features:
  - A pathogenic variant in a definitive sarcomere gene (MYH7, MYBPC3, TNNT2, TNNI3, TPM1, MYL2, MYL3, ACTC1, TNNC1) explains the phenotype.
  - FLNC carriers show smaller cavity size, lower contractility, more severe diastolic dysfunction, and a restrictive tendency rather than hypercontractility.
  - The FLNC-specific repolarization ECG occurs in only about 1% of non-FLNC HCM patients.
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic FLNC variants in patients with HCM/RCM are nontruncating and
      cause a discrete phenotype comprising a characteristic ECG, hypertrophic and
      restrictive features without hypercontractility, and extracardiac
      abnormalities.
    explanation: >-
      States that the FLNC hypertrophic phenotype is discrete from generic HCM,
      including the absence of hypercontractility.
  - reference: PMID:25351925
    reference_title: Mutations in filamin C cause a new form of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in different genes encoding sarcomeric proteins are responsible
      for 50-60% of familial cases of hypertrophic cardiomyopathy (HCM); however,
      the genetic alterations causing the disease in one-third of patients are
      currently unknown.
    explanation: >-
      Situates FLNC among the non-sarcomeric explanations sought for
      genotype-negative HCM.
- name: FLNC truncating dilated and left-dominant arrhythmogenic cardiomyopathy
  description: >-
    The same gene, the opposite variant class and a different disease. Truncating
    FLNC variants cause a high-risk overlapping dilated/left-dominant
    arrhythmogenic phenotype with ventricular dilation, systolic dysfunction,
    myocardial fibrosis, a heavy ventricular-arrhythmia burden and frequent
    premature sudden death — and are absent from hypertrophic cohorts. dismech
    covers the arrhythmogenic and dilated poles of this in
    Arrhythmogenic_Right_Ventricular_Cardiomyopathy, DSP_Cardiomyopathy and
    Dilated_Cardiomyopathy; this entry deliberately does not duplicate them.
  distinguishing_features:
  - The FLNC allele is truncating (nonsense, frameshift, splice-loss) rather than missense.
  - Left ventricular dilation with systolic dysfunction, not a small stiff hypertrophied cavity.
  - Myocardial immunohistochemistry shows no abnormal filamin C aggregates.
  - Inferolateral negative T waves and low QRS voltages, with early prophylactic defibrillator implantation recommended.
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  evidence:
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating mutations in FLNC caused an overlapping phenotype of dilated and
      left-dominant arrhythmogenic cardiomyopathies complicated by frequent
      premature sudden death.
    explanation: >-
      Defines the alternative FLNC entity that must be distinguished from CMH26.
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating FLNC mutations were absent in patients with other phenotypes,
      including 1,078 patients with hypertrophic cardiomyopathy.
    explanation: >-
      The distinguishing genotype fact: truncating alleles do not appear in
      hypertrophic cardiomyopathy.
- name: FLNC myofibrillar myopathy (filaminopathy, MFM5)
  description: >-
    The skeletal-muscle FLNC disease. Adult-onset, slowly progressive muscle
    weakness with intracellular protein aggregates, classically caused by
    variants in the dimerization domain. Cardiac FLNC series repeatedly note the
    absence of clinical skeletal myopathy, so overt limb-girdle weakness points
    away from CMH26. dismech covers this in Myofibrillar_Myopathy.
  distinguishing_features:
  - Progressive proximal skeletal-muscle weakness dominates the presentation.
  - Muscle biopsy shows myofibrillar disorganization with protein aggregates.
  - Cardiac involvement, when present, is secondary rather than the presenting problem.
  disease_term:
    preferred_term: myofibrillar myopathy
    term:
      id: MONDO:0018943
      label: myofibrillar myopathy
  evidence:
  - reference: PMID:37174721
    reference_title: Novel Filamin C Myofibrillar Myopathy Variants Cause Different Pathomechanisms and Alterations in Protein Quality Systems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A subtype of MFM is caused by heterozygous mutations in the filamin C (FLNC)
      gene, exhibiting progressive muscle weakness, muscle structural alterations
      and intracellular protein accumulations.
    explanation: >-
      Defines the skeletal-muscle FLNC phenotype that constitutes this
      differential.
  - reference: PMID:33557094
    reference_title: "Cardiac Filaminopathies: Illuminating the Divergent Role of Filamin C Mutations in Human Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Specifically, mutations in FLNC were initially only linked to myofibrillar
      myopathy (MFM), but are now increasingly found in various forms of human
      cardiomyopathy.
    explanation: >-
      Records the historical relationship between the myopathic and cardiac FLNC
      phenotypes. Evidence source is OTHER because this is a review.
- name: Familial restrictive cardiomyopathy from other causes
  description: >-
    Sarcomere-gene and other familial restrictive cardiomyopathies present with
    the same stiff, non-dilated ventricle and severe diastolic dysfunction.
    Because MONDO records restrictive cardiomyopathy 5 as a synonym of CMH26, the
    boundary between the hypertrophic and restrictive labels for a given FLNC
    family is partly nosological rather than biological.
  distinguishing_features:
  - Restrictive physiology without significant wall thickening favors a non-FLNC restrictive cardiomyopathy.
  - Identification of a non-truncating FLNC variant with filamin C-positive myocardial inclusions favors this entity.
  disease_term:
    preferred_term: restrictive cardiomyopathy
    term:
      id: MONDO:0016340
      label: familial restrictive cardiomyopathy
  evidence:
  - reference: PMID:26666891
    reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial forms are mainly caused by mutations in sarcomere proteins and
      demonstrate a common genetic etiology with other inherited cardiomyopathies.
    explanation: >-
      Names the sarcomeric familial restrictive cardiomyopathies that form this
      differential and notes their shared genetic architecture with FLNC disease.
treatments:
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for primary or secondary prevention of sudden cardiac death.
    The founding CMH26 series reported excess sudden cardiac death among
    FLNC-mutated hypertrophic patients, and cardiac arrest is among the recorded
    hard outcomes in contemporary FLNC hypertrophic/restrictive families, so
    arrhythmic risk stratification is part of routine care. Note that the
    evidence base for arrhythmic risk in the non-truncating hypertrophic class is
    weaker and more contested than for FLNC truncating dilated/arrhythmogenic
    disease, where prompt defibrillator implantation is explicitly recommended;
    one large HCM cohort found no excess mortality in FLNC carriers.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Electrical Instability and Arrhythmogenesis
    treatment_effect: INHIBITS
    description: >-
      A defibrillator does not modify the Z-disc lesion; it terminates the
      malignant ventricular arrhythmia that the remodeled myocardium generates.
  evidence:
  - reference: PMID:25351925
    reference_title: Mutations in filamin C cause a new form of familial hypertrophic cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical studies indicate that FLNC-mutated patients have higher incidence
      of sudden cardiac death.
    explanation: >-
      Establishes the arrhythmic risk that motivates defibrillator consideration.
      PARTIAL because the paper reports risk, not device outcomes.
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prompt implantation of a cardiac defibrillator should be considered in
      affected patients harboring truncating mutations in FLNC.
    explanation: >-
      The explicit device recommendation in the FLNC literature is for the
      truncating class, not this one. Recorded as PARTIAL and cited here
      precisely to mark that the recommendation does not transfer automatically
      to non-truncating hypertrophic carriers.
- name: Heart Transplantation
  description: >-
    Definitive therapy for end-stage disease. Restrictive physiology with severe
    diastolic dysfunction drives young carriers to advanced heart failure, and
    transplantation is a recorded outcome in both the ROD2 missense cohort and
    the original FLNC restrictive families.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Heart Failure and Sudden Cardiac Death
    treatment_effect: INHIBITS
    description: >-
      Replaces the failing organ; it is a rescue rather than a mechanism-directed
      therapy.
  evidence:
  - reference: PMID:26666891
    reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals presented with heart failure due to severe diastolic
      dysfunction requiring heart transplantation in some cases.
    explanation: >-
      Documents transplantation as the treatment reached by patients with
      non-truncating FLNC cardiomyopathy.
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a median follow-up of 6.49 years, they presented with advanced heart
      failure: 16 (80%) diastolic dysfunction, 3 heart transplants, 3 heart
      failure deaths
    explanation: >-
      Three transplants among 20 assessed ROD2 missense carriers over a median
      6.5 years.
- name: Symptom-Directed Heart Failure and Antianginal Pharmacotherapy
  description: >-
    There is no FLNC-specific disease-modifying therapy, so pharmacological
    management is the generic hypertrophic-cardiomyopathy regimen: beta-blockers
    (or non-dihydropyridine calcium channel blockers when beta-blockade is not
    tolerated) to slow the heart rate, lengthen diastolic filling time and relieve
    angina and dyspnoea, with diuresis added cautiously once restrictive
    physiology and congestion dominate. Because the FLNC ventricle is small and
    stiff with impaired filling rather than obstructed by hypercontractility, the
    therapeutic goal here is filling time and congestion control rather than
    relief of outflow obstruction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: non-dihydropyridine calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  target_mechanisms:
  - target: Impaired Diastolic Relaxation and Myocardial Stiffening
    treatment_effect: INHIBITS
    description: >-
      Rate control lengthens diastole and partially offsets impaired filling; it
      does not modify the Z-disc or aggregation lesion upstream.
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLNC variant carriers with the characteristic ECG had smaller left
      ventricular cavity size, lower contractility, and more severe diastolic
      dysfunction and were more likely to have a restrictive phenotype.
    explanation: >-
      Establishes the haemodynamic problem this therapy is aimed at — small
      cavity, impaired filling, reduced contractility. PARTIAL because the paper
      characterizes the phenotype and does not report treatment outcomes; no
      FLNC-specific pharmacotherapy trial exists.
- name: Cardiac Myosin Inhibition (mechanistically questionable in this entity)
  description: >-
    Cardiac myosin inhibitors such as mavacamten are a mechanism-directed therapy
    for hypertrophic cardiomyopathy — they reduce actin-myosin cross-bridge
    formation and so relieve the hypercontractility and outflow obstruction of
    sarcomeric HCM. That rationale does not transfer cleanly to CMH26. The
    FLNC-related hypertrophic/restrictive phenotype is explicitly described as
    occurring without hypercontractility, with lower contractility and a small
    cavity, so reducing contractility further is mechanistically questionable
    here. This entry records the treatment specifically to mark the caveat: no
    trial of a myosin inhibitor in genotyped FLNC carriers has been reported, and
    the phenotype argues against extrapolating the sarcomeric-HCM indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten (cardiac myosin inhibitor)
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic FLNC variants in patients with HCM/RCM are nontruncating and
      cause a discrete phenotype comprising a characteristic ECG, hypertrophic and
      restrictive features without hypercontractility, and extracardiac
      abnormalities.
    explanation: >-
      Recorded as REFUTE because the absence of hypercontractility removes the
      mechanistic premise of cardiac myosin inhibition in this entity; the
      evidence argues against the treatment rather than for it.
  - reference: DOI:10.1161/CIRCRESAHA.120.317076
    reference_title: Filamin C Cardiomyopathy Variants Cause Protein and Lysosome Accumulation
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Although sarcomere formation and function were unaffected in FLNC +/ − and
      FLNC +/Δ7aa hiPSC-CMs, these heterozygous variants caused increases in
      lysosome content
    explanation: >-
      Cell-level corroboration that the heterozygous FLNC lesion is proteostatic
      rather than contractile, which is the same reason a contractility-lowering
      drug is a poor mechanistic fit. PARTIAL because it is an in vitro model, not
      a treatment study.
- name: Cascade Genetic Screening and Longitudinal Surveillance of Relatives
  description: >-
    Because penetrance is reduced and expressivity variable, first-degree
    relatives of a carrier are offered predictive genetic testing followed by
    periodic ECG and echocardiography. The ECG is particularly valuable here
    given the FLNC-specific repolarization pattern. Cascade screening is also the
    means by which segregation data accumulate — the evidence most needed to
    resolve the pathogenicity of individual FLNC missense variants.
  therapeutic_modality: OTHER
  action_category: SCREENING
  treatment_term:
    preferred_term: cascade genetic testing of relatives
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carriers underwent advanced cardiac imaging and genetic cascade screening.
    explanation: >-
      Documents cascade screening plus imaging as the family-management approach
      used in the reference FLNC hypertrophic/restrictive cohort.
  - reference: PMID:28356264
    reference_title: Screening of the Filamin C Gene in a Large Cohort of Hypertrophic Cardiomyopathy Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the FLNC variants were associated with mild forms of HCM and a
      reduced penetrance, with few affected in the families to confirm the
      segregation.
    explanation: >-
      Reduced penetrance and sparse segregation data are exactly why longitudinal
      family surveillance rather than one-off testing is required.
experimental_models:
- name: Transfected cell models expressing mutant filamin C
  description: >-
    Heterologous and myogenic cell lines transfected with plasmids carrying
    individual FLNC missense variants, read out by confocal microscopy for
    filamin C distribution and aggregate formation. This is the workhorse assay
    that separates the two mechanistic arms of this entry: the founding CMH26
    variants and the restrictive p.S1624L allele produce large cytoplasmic
    aggregates, whereas ROD2-domain variants did not. Note the assay is not
    single-species — the ROD2 experiments used human HT1080 fibrosarcoma cells
    alongside the rat H9c2 cardiomyoblast line — so the organism binding below
    reflects only the human component.
  experimental_model_type: CELL_LINE

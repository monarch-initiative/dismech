- name: Mutant Filamin C Aggregation and Proteostatic Burden
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Non-truncating FLNC variants yield a protein that is expressed but
    misfolding-prone. In patient myocardium and in cells transfected with the
    HCM- and RCM-associated variants, mutant filamin C accumulates as large
    cytoplasmic inclusions rather than distributing normally to the Z-disc. The
    aggregate load sequesters filamin C away from its Z-disc function and imposes
    a protein-quality burden on the cardiomyocyte. This node is the mechanistic
    signature that separates the hypertrophic/restrictive FLNC phenotypes from
    the truncating dilated/arrhythmogenic phenotypes, in which myocardial
    immunohistochemistry shows no abnormal filamin C aggregates.

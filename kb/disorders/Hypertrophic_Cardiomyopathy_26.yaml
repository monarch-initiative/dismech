discussions:
- discussion_id: flnc_missense_hcm_pathogenicity_contested
  prompt: >-
    Is FLNC a genuine hypertrophic cardiomyopathy gene, or is the reported
    FLNC-HCM association largely an artefact of rare missense variation being
    common in the general population?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Filamin C Z-Disc Cross-Linking Defect
  - genetic#FLNC Non-Truncating Pathogenic Variants
  rationale: >-
    The evidence is genuinely split. In favour: FLNC missense variants segregate
    with HCM in multiple families, produce filamin C aggregates in patient
    myocardium and in cells, and in a 3,289-case sarcomere-negative HCM cohort
    the etiologic fraction reaches 0.98 within the ECG-defined subgroup. Against:
    a 540-patient HCM cohort found FLNC variants at a rate statistically
    indistinguishable from controls with poor pedigree segregation and no excess
    mortality; even the supportive 448-patient screen downgraded 14 of 20
    candidate variants to uncertain or likely benign; and the burden analysis puts
    the etiologic fraction across all HCM cases at only 0.45. Decisively, the
    ClinGen Hereditary Cardiovascular Disease GCEP did not simply fail to curate
    FLNC-HCM: it re-curated FLNC as one of three genes selected for HCM-like
    phenotypes presenting as isolated left ventricular hypertrophy, restricted the
    curation to non-loss-of-function variants (explicitly separating them from the
    loss-of-function arrhythmogenic entity), retained a Definitive classification
    (8.1 genetic + 6 experimental = 14.1 points) — but assigned it to the disease
    entity myofibrillar myopathy, with left ventricular hypertrophy and
    restrictive cardiomyopathy listed as associated features rather than as a
    standalone hypertrophic entity. So the expert-panel position is that the
    non-truncating FLNC cardiac phenotype is the cardiac expression of
    filaminopathy/MFM, not a separate CMH. The emerging resolution is that
    FLNC-related hypertrophic disease is real but narrower than the raw carrier
    rates imply, is best identified phenotype-first (restrictive features plus the
    characteristic repolarization ECG) rather than genotype-first, and is arguably
    better nosologically placed on the filaminopathy spectrum than in the CMH
    numbered series.
  proposed_experiments:
  - experiment_id: exp_cmh26_rod2_segregation_functional
    name: Prospective ROD2-restricted segregation and functional study
    description: >-
      Recruit families carrying ROD2-domain FLNC missense variants — the subset
      with the strongest clustering signal — and collect prospective cascade
      segregation data alongside a standardized functional battery (aggregation
      assay, filamin C distribution, lysosomal/autophagic readouts) in
      patient-derived cardiomyocytes. Powering segregation and function together
      on one variant class is the most direct route to converting the current
      variants of uncertain significance into interpretable calls.
  - experiment_id: exp_cmh26_clingen_hcm_validity_curation
    name: ClinGen gene-disease validity curation of FLNC for the hypertrophic phenotype
    description: >-
      Formal ClinGen Hereditary Cardiovascular Disease GCEP curation of the
      FLNC-hypertrophic cardiomyopathy relationship, matching the existing
      Definitive assertions for FLNC-myofibrillar myopathy and FLNC-dilated
      cardiomyopathy. An expert-panel classification, restricted to
      non-truncating alleles, would settle whether CMH26 should be reported
      clinically and would give this entry a citable validity anchor.
  evidence:
  - reference: PMID:30411535
    reference_title: Mutation profile of FLNC gene and its prognostic relevance in patients with hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLNC mutations were common in both HCM patients and healthy population. The
      pathogenicity of FLNC mutations detected in HCM patients and its association
      with the clinical outcomes should be cautiously interpreted.
    explanation: >-
      The sceptical position in this controversy, stated by its authors.
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare FLNC missense variant burden indicated a low case excess among all HCM
      cases (etiologic fraction, 0.45; 95% confidence interval, 0.36-0.54), but in
      "ECG-positive" cases the etiologic fraction was substantially higher (0.98;
      95% confidence interval, 0.97-0.99).
    explanation: >-
      The proposed resolution: low explanatory power overall, very high within a
      phenotypically defined subgroup.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNC was curated for non -loss of function variants only, after pre-curation
      supported these variant types as distinct from the arrhythmogenic
      cardiomyopathy disease entity associated with loss of function FLNC
      variants.
    explanation: >-
      The ClinGen expert panel independently adopts the same variant-class split
      this entry is built on, and did so as an explicit pre-curation decision.
      Evidence source is OTHER because this is an expert-panel curation report.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Non- loss of function FLNC variants were definitively associated with
      myofibrillar myopathy, with patients presenting with isolated or combined
      skeletal and/or cardiac features
    explanation: >-
      The sceptical pole of the controversy at expert-panel level: ClinGen assigns
      the non-truncating FLNC allele class Definitive validity for myofibrillar
      myopathy rather than for a standalone hypertrophic entity. PARTIAL because
      it neither affirms nor denies CMH26 directly; it relocates the same allele
      class to a different disease entity.
- discussion_id: cmh26_hypertrophic_vs_restrictive_boundary
  prompt: >-
    Should CMH26 be modelled as a hypertrophic cardiomyopathy, given that MONDO
    lists restrictive cardiomyopathy 5 among its exact synonyms and every large
    series describes a hypertrophic-restrictive overlap rather than pure
    hypertrophy?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Diastolic Relaxation and Myocardial Stiffening
  rationale: >-
    MONDO:0014883 is asserted as a subtype of familial hypertrophic
    cardiomyopathy and carries CMH26 and cardiomyopathy, familial restrictive 5
    as exact synonyms of the same node, reflecting the OMIM 617047 entry. The
    literature supports the merge: the ROD2 series describes an HCM-RCM overlap,
    the 2026 family study describes hypertrophic and restrictive features
    together, and the original FLNC restrictive families carry the same class of
    non-truncating allele. This entry follows MONDO in treating the hypertrophic
    node as primary while curating restrictive physiology as a first-class
    phenotype rather than splitting a second entity. If MONDO later separates the
    restrictive node, this entry should be re-scoped rather than duplicated.
  evidence:
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLNC-mRod2 variants show a high prevalence of an overlapped phenotype
      comprising RCM, HCM and deep hypertrabeculation with saw-tooth appearance
      and distinctive cardiac histopathological remodeling.
    explanation: >-
      Documents the overlap that motivates treating hypertrophic and restrictive
      presentations as one entity here.
- discussion_id: flnc_animal_models_do_not_model_the_hypertrophic_arm
  prompt: >-
    Do the available Flnc animal models say anything about CMH26, given that
    every published mouse model is a loss-of-function model and therefore
    reproduces the truncating dilated arm rather than the non-truncating
    hypertrophic one?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Mutant Filamin C Aggregation and Proteostatic Burden
  - pathophysiology#Filamin C Z-Disc Cross-Linking Defect
  rationale: >-
    Mouse Flnc genetics has been done exclusively by deletion. Global and
    cardiomyocyte-specific Flnc knockouts die in utero from ruptured ventricular
    myocardium, and an inducible adult cardiac-specific knockout produces rapid
    onset dilated cardiomyopathy with reduced systolic force and Z-disk
    misalignment. Both are loss-of-function, i.e. the haploinsufficiency
    mechanism that in humans causes the dilated and arrhythmogenic phenotypes,
    and neither reproduces hypertrophy, restrictive physiology, or filamin C
    aggregation. No knock-in of a human CMH26 missense allele has been reported.
    The consequence is that the aggregation and proteostasis nodes of this entry
    rest on human myocardium, human iPSC-cardiomyocytes and transfected cell
    lines, with no in vivo corroboration at all — and that mouse Flnc data must
    not be imported into this entry as if it modelled the hypertrophic arm.
  proposed_experiments:
  - experiment_id: exp_cmh26_missense_knockin_mouse
    name: Knock-in mouse carrying a human CMH26 ROD2 missense allele
    description: >-
      Generate a knock-in mouse bearing a segregating human ROD2-domain FLNC
      missense allele (rather than a null allele) and phenotype it for wall
      thickness, diastolic function, trabeculation, filamin C aggregation, and
      lysosomal/autophagic markers. This is the missing in vivo test of whether
      the non-truncating allele class is sufficient to produce the hypertrophic
      and restrictive phenotype in a mammal.
  - experiment_id: exp_cmh26_engineered_heart_tissue_diastolic
    name: Engineered heart tissue from CMH26 patient iPSC-cardiomyocytes
    description: >-
      Build three-dimensional engineered heart tissue from patient-derived
      CMH26 iPSC-cardiomyocytes and measure passive tension and relaxation
      kinetics alongside aggregate and lysosomal readouts, to test whether
      aggregation is sufficient to produce the stiffness that defines the
      clinical phenotype without invoking an animal model.
  evidence:
  - reference: PMID:35055055
    reference_title: Subcellular Remodeling in Filamin C Deficient Mouse Hearts Impairs Myocyte Tension Development during Progression of Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To determine how FLNC regulates systolic force transmission and DCM
      remodeling, we used an inducible, cardiac-specific FLNC-knockout (icKO)
      model to produce a rapid onset of DCM in adult mice.
    explanation: >-
      The best-characterized adult mouse Flnc model is a knockout and produces
      dilated, not hypertrophic, cardiomyopathy — establishing the mismatch this
      discussion records.
  - reference: PMID:36706168
    reference_title: Filamin C is Essential for mammalian myocardial integrity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we demonstrated Flnc global (FlncgKO) and cardiomyocyte-specific knockout
      (FlnccKO) mice died in utero from severely ruptured ventricular myocardium
    explanation: >-
      The complete-loss mouse phenotype is embryonic myocardial rupture, a
      developmental structural failure with no counterpart in adult-onset human
      CMH26, reinforcing that mouse Flnc deletion does not model this entity.

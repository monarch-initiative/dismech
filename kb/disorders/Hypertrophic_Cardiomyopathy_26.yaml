prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the FLNC-specific form of
    hypertrophic cardiomyopathy. Occurrence is reported only as the yield of
    FLNC variants within sequenced HCM cohorts, and even that yield is disputed
    (see the case_fractions on the genetic entry and the discussion on contested
    missense pathogenicity). Rare-variant burden analysis in a large
    sarcomere-negative HCM cohort put the etiologic fraction of rare FLNC
    missense variants across all HCM cases at only 0.45, rising to 0.98 in the
    subgroup with the characteristic repolarization ECG.
  evidence:
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare FLNC missense variant burden indicated a low case excess among all HCM
      cases (etiologic fraction, 0.45; 95% confidence interval, 0.36-0.54), but in
      "ECG-positive" cases the etiologic fraction was substantially higher (0.98;
      95% confidence interval, 0.97-0.99).
    explanation: >-
      Quantifies how much of the HCM case load rare FLNC missense variants
      actually explain, and shows the explanatory fraction is concentrated in an
      ECG-defined subgroup. PARTIAL because an etiologic fraction is not a
      population prevalence.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMH26 families transmit a single heterozygous non-truncating FLNC variant in
    an autosomal dominant pattern. Penetrance is reduced and expressivity
    variable: most reported FLNC-HCM variants segregate incompletely, and de novo
    variants account for a meaningful share of probands — in the ROD2 missense
    series only 6 of 21 families showed even moderate genotype-phenotype
    segregation and the remainder were de novo, while 2 of 12 variants in the
    ECG-defined hypertrophic/restrictive cohort were apparently de novo.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:28356264
    reference_title: Screening of the Filamin C Gene in a Large Cohort of Hypertrophic Cardiomyopathy Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the FLNC variants were associated with mild forms of HCM and a
      reduced penetrance, with few affected in the families to confirm the
      segregation.
    explanation: >-
      Establishes dominant transmission with reduced penetrance as the
      inheritance pattern in the largest dedicated FLNC-HCM screening cohort.
  - reference: PMID:26666891
    reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two novel missense variants (p.S1624L; p.I2160F) in filamin-C
      (FLNC), an actin-cross-linking protein mainly expressed in heart and
      skeletal muscle, segregating in two families with autosomal-dominant RCM
    explanation: >-
      Dominant segregation of non-truncating FLNC variants in the restrictive
      pole of the same hypertrophic-restrictive continuum modelled by this entry
      (MONDO records restrictive cardiomyopathy 5 as a synonym of CMH26).
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 6 families had moderate genotype-phenotype segregation, and the
      remaining were de novo variants.
    explanation: >-
      Quantifies both the incomplete segregation and the de novo fraction in the
      ROD2 missense series. PARTIAL because it qualifies rather than establishes
      dominant transmission.
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5 of 12 variants (41.7%) in the "ECG-positive" group cosegregated, and 2
      were apparently de novo.
    explanation: >-
      Independent cohort giving the cosegregation and de novo proportions for the
      ECG-defined hypertrophic/restrictive group.
mechanistic_hypotheses:
- hypothesis_group_id: flnc_nontruncating_aggregation_model
  hypothesis_label: Non-truncating filamin C aggregation / Z-disc proteotoxicity model
  status: CANONICAL
  description: >-
    The default model for the hypertrophic pole of FLNC disease holds that
    missense and other non-truncating variants yield a filamin C protein that is
    still expressed but misfolds, accumulates as large cytoplasmic aggregates,
    and destabilizes the Z-disc. Sarcomeric organization degrades, the myocardium
    becomes stiff and hypertrophies, and the patient develops a
    hypertrophic-restrictive phenotype. This is explicitly the opposite arm of
    the FLNC mechanism dichotomy from the haploinsufficiency that follows
    truncation.
  evidence:
  - reference: PMID:34535832
    reference_title: "Filamin C in cardiomyopathy: from physiological roles to DNA variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two major pathomechanisms in FLNC-related cardiomyopathy have been
      described: protein aggregation resulting from non-truncating mutations and
      haploinsufficiency triggered by filamin C truncation.
    explanation: >-
      States the two-mechanism dichotomy directly and assigns protein
      aggregation to the non-truncating variant class that causes the
      hypertrophic phenotype. Evidence source is OTHER because this is a review.
  - reference: PMID:25351925
    reference_title: Mutations in filamin C cause a new form of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with FLNC mutations show marked sarcomeric abnormalities in
      cardiac muscle
    explanation: >-
      The human arm of the founding CMH26 study: sarcomeric disorganization in the
      myocardium of FLNC-mutated hypertrophic cardiomyopathy patients.
  - reference: PMID:25351925
    reference_title: Mutations in filamin C cause a new form of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functional analysis reveals that expression of these FLNC variants resulted
      in the formation of large filamin C aggregates
    explanation: >-
      The functional arm of the same study: the HCM-associated FLNC variants form
      filamin C aggregates when expressed. Split from the preceding item because
      the two halves of the source sentence report different evidence types.
  - reference: PMID:32112656
    reference_title: A mutation update for the FLNC gene in myopathies and cardiomyopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interference with the dimerization and folding of the protein leads to
      aggregate formation detrimental for muscle function, as found in HCM and
      MFM.
    explanation: >-
      Assigns the misfolding/dimerization-failure to aggregation mechanism
      specifically to the hypertrophic (and myofibrillar-myopathy) arm of FLNC
      disease. Evidence source is OTHER because this is a mutation-update review.
- hypothesis_group_id: flnc_convergent_proteotoxicity
  hypothesis_label: Convergent proteotoxic / lysosomal-autophagic mechanism across FLNC variant classes
  status: ALTERNATIVE
  description: >-
    An isogenic CRISPR hiPSC-cardiomyocyte series complicates the clean
    dichotomy. An in-frame deletion that preserves filamin C expression but
    causes aggregation — the engineered analogue of the hypertrophic variant
    class — and a haploinsufficient line modelling the dilated class both
    converged on increased lysosome content, enhanced autophagic flux, and
    accumulation of filamin C binding partners and Z-disc proteins, while
    sarcomere formation and contractile function were preserved in both
    heterozygous states. This argues that the proximal cardiomyocyte lesion in
    the hypertrophic arm is proteostatic rather than contractile, and that the
    two variant classes may share a downstream degradative bottleneck even
    though their clinical phenotypes diverge.
  evidence:
  - reference: DOI:10.1161/CIRCRESAHA.120.317076
    reference_title: Filamin C Cardiomyopathy Variants Cause Protein and Lysosome Accumulation
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although sarcomere formation and function were unaffected in FLNC +/ − and
      FLNC +/Δ7aa hiPSC-CMs, these heterozygous variants caused increases in
      lysosome content
    explanation: >-
      The load-bearing observation for this hypothesis: in the patient-realistic
      heterozygous states, sarcomere assembly and contractile function were
      preserved while the proteostatic phenotype appeared, in both the
      aggregate-forming and the haploinsufficient line.
  - reference: DOI:10.1161/CIRCRESAHA.120.317076
    reference_title: Filamin C Cardiomyopathy Variants Cause Protein and Lysosome Accumulation
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      these heterozygous variants caused increases in lysosome content,
      enhancement of autophagic flux, and accumulation of FLNC-binding partners
      and Z-disc proteins.
    explanation: >-
      The shared lysosomal/autophagic response of the aggregate-forming and the
      haploinsufficient heterozygous lines is the basis for this convergence
      hypothesis.
  - reference: DOI:10.1161/CIRCRESAHA.120.317076
    reference_title: Filamin C Cardiomyopathy Variants Cause Protein and Lysosome Accumulation
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which did not affect FLNC expression but caused aggregate formation,
      similar to FLNC variants associated with hypertrophic cardiomyopathy.
    explanation: >-
      Establishes that the engineered in-frame deletion is an explicit model of
      the hypertrophic (aggregate-forming) FLNC variant class, which is what
      makes this experiment relevant to CMH26 rather than only to the dilated
      arm.
- hypothesis_group_id: flnc_rod2_nonaggregating_signaling_model
  hypothesis_label: ROD2-domain signaling / matrix-remodeling arm without demonstrable aggregation
  status: EMERGING
  description: >-
    A competing or superimposed arm proposes that at least some non-truncating
    FLNC variants — specifically those clustered in the ROD2 domain, a
    protein-interaction and signaling region — produce the hypertrophic-restrictive
    phenotype without forming detectable cytoplasmic aggregates, acting instead
    through altered filamin C distribution among cardiomyocytes and differential
    extracellular matrix remodeling. In the largest ROD2-specific series the
    transfected cell models failed to show aggregation, which is difficult to
    reconcile with a purely proteotoxic model and leaves the proximal mechanism
    for this variant subset unresolved.
  evidence:
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HT1080 and H9c2 cells did not reveal cytoplasmic aggregation of mutant
      FLNC.
    explanation: >-
      Cell-model result that directly withholds support from the aggregation
      model for ROD2 missense variants, motivating a separate, non-proteotoxic
      hypothesis arm for this subset.
  - reference: PMID:35952944
    reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential extracellular matrix remodeling and FLNC distribution among
      cardiomyocytes were confirmed on histology.
    explanation: >-
      Names the histological correlates — matrix remodeling and altered filamin C
      distribution — that this arm proposes in place of aggregate deposition.
pathophysiology:
- name: Filamin C Z-Disc Cross-Linking Defect
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    FLNC encodes filamin C, the striated-muscle filamin. It is an
    actin-cross-linking dimer built from an N-terminal actin-binding domain plus
    24 immunoglobulin-like repeats, with calpain-sensitive hinges, dimerization
    through repeat 24, and Z-disc targeting via a unique 82-residue insertion in
    repeat 20; at the Z-disc it cross-links thin filaments from adjacent
    sarcomeres and links the sarcomere to the sarcolemma. The primary lesion in
    CMH26 is a qualitative perturbation of this cross-linking protein by a
    non-truncating (usually missense) variant — not a thick- or thin-filament
    contractile lesion, and not simple loss of one allele. Reported
    HCM-associated variants are predominantly missense and cluster in the ROD2
    region.

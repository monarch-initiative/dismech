genetic:
- name: FLNC Non-Truncating Pathogenic Variants
  association: Non-truncating (predominantly missense) pathogenic variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FLNC
    term:
      id: hgnc:3756
      label: FLNC
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:26666891
      reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        segregating in two families with autosomal-dominant RCM
      explanation: >-
        Dominant segregation of non-truncating FLNC alleles in the
        hypertrophic-restrictive continuum covered by this entry.
  features: >-
    The variant class is the single most important genotype-phenotype fact about
    FLNC. Non-truncating variants — almost all missense, and clustered in the
    ROD2 region — are the ones enriched in
    hypertrophic and restrictive cardiomyopathy, and they act by producing a
    misfolded, aggregation-prone filamin C protein. Truncating (protein-losing)
    FLNC variants are enriched instead in dilated and left-dominant
    arrhythmogenic cardiomyopathy, act through haploinsufficiency, do not produce
    myocardial filamin C aggregates, and were completely absent from a screen of
    1,078 hypertrophic cardiomyopathy patients. A CMH26 diagnosis therefore
    requires a non-truncating allele; a truncating FLNC allele in a patient with
    apparent hypertrophy should prompt re-examination of the phenotype rather
    than assignment to this entity. Pathogenicity of individual FLNC missense
    variants remains contested: in the largest dedicated HCM screen only 6 of 20
    candidate variants reached likely-pathogenic, 10 were variants of uncertain
    significance, and a separate 540-patient cohort found FLNC variants at
    similar frequency in patients and controls with poor pedigree segregation.
  case_fractions:
  - population: >-
      448 consecutive hypertrophic cardiomyopathy patients sequenced for FLNC
      plus the main sarcomere genes (Asturias, Spain), 450 population controls.
    case_fraction_percent: 4.9
    cohort_size: 448
    notes: >-
      20 FLNC candidate variants in 22 of 448 patients (4.9%); after segregation
      and functional review only 6 variants in 7 patients (1.6%) were classified
      likely pathogenic, so the pathogenic-variant yield is lower than the
      candidate-variant yield.
    evidence:
    - reference: PMID:28356264
      reference_title: Screening of the Filamin C Gene in a Large Cohort of Hypertrophic Cardiomyopathy Patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified 20 FLNC candidate variants (13 new; 1 nonsense; and 19
        missense) in 22 patients
      explanation: >-
        Gives the numerator (22 patients) for the 448-patient denominator stated
        in the same abstract.
    - reference: PMID:28356264
      reference_title: Screening of the Filamin C Gene in a Large Cohort of Hypertrophic Cardiomyopathy Patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Based on the familial segregation and the reported functional studies, 6
        of the candidate variants (in 7 patients) were finally classified as
        likely pathogenic, 10 as variants of uncertain significance, and 4 as
        likely benign.
      explanation: >-
        Supports the caveat that the likely-pathogenic yield is much lower than
        the candidate-variant yield.
  - population: >-
      540 hypertrophic cardiomyopathy patients and 307 healthy controls (Fuwai
      Hospital, China).
    case_fraction_percent: 7.2
    cohort_size: 540
    notes: >-
      39 of 540 HCM patients (7.2%) carried an FLNC variant, but so did 4.2% of
      controls (p = 0.101), and pedigrees did not segregate — this cohort argues
      that the raw carrier rate substantially overstates the causal fraction.
    evidence:

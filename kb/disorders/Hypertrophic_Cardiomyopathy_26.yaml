name: Hypertrophic Cardiomyopathy 26
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH26
- FLNC hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 26
- hypertrophic cardiomyopathy caused by mutation in FLNC
- cardiomyopathy, familial restrictive 5
description: >-
  Hypertrophic cardiomyopathy 26 (CMH26) is the FLNC-related form of familial
  hypertrophic cardiomyopathy. FLNC encodes filamin C, a large actin
  cross-linking protein of the striated-muscle Z-disc: an N-terminal
  actin-binding domain followed by 24 immunoglobulin-like repeats, dimerizing
  through repeat 24 and targeted to the Z-disc by a unique insertion in repeat
  20, where it also couples the sarcomere to the sarcolemma through integrin
  beta-1 and delta-sarcoglycan. The disease mechanism is therefore a Z-disc /
  protein-quality lesion rather than a thick- or thin-filament contractile
  lesion: non-truncating (predominantly missense) FLNC variants produce
  misfolded filamin C that forms large intracellular aggregates and disorganizes
  the sarcomere, and the resulting myocardium is stiff and hypertrophic with
  impaired relaxation rather than hypercontractile. The clinical picture spans a
  hypertrophic-to-restrictive continuum — left ventricular hypertrophy with a
  small, poorly compliant cavity, severe diastolic dysfunction, deep
  hypertrabeculation with a saw-tooth appearance in ROD2-domain carriers, a
  distinctive repolarization ECG, extracardiac musculoskeletal features, and
  progression to advanced heart failure, transplantation, or sudden cardiac
  death. CMH26 must be kept mechanistically distinct from the other FLNC
  cardiomyopathies: FLNC truncating variants are the ones enriched in dilated
  and left-dominant arrhythmogenic cardiomyopathy and are essentially absent
  from hypertrophic cohorts, and they act through haploinsufficiency without
  filamin C aggregates. Inheritance is autosomal dominant with reduced
  penetrance, and the pathogenicity of individual FLNC missense variants in
  hypertrophic cardiomyopathy remains actively contested.

  - reference: PMID:32295012
    reference_title: Structure and Function of Filamin C in the Muscle Z-Disc.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNC consists of a N-terminal actin-binding domain followed by 24
      immunoglobulin-like repeats with two intervening calpain-sensitive hinges
      separating R15 and R16 (hinge 1) and R23 and R24 (hinge-2).
    explanation: >-
      Gives the domain architecture that determines where HCM-associated missense
      variants fall.
  - reference: PMID:32295012
    reference_title: Structure and Function of Filamin C in the Muscle Z-Disc.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The FLNC subunit is dimerized through R24 and calpain cleaves off the
      dimerization domain to regulate mobility of the FLNC subunit.
    explanation: >-
      Sources the repeat-24 dimerization step whose failure is the proximal
      molecular event in the aggregation arm.
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Filamin C (encoded by the FLNC gene) is essential for sarcomere attachment
      to the plasmatic membrane.
    explanation: >-
      Adds the sarcolemmal-attachment role of filamin C, which is why the lesion
      is one of force coupling and Z-disc integrity rather than of the
      contractile filaments.
  - reference: PMID:36706168
    reference_title: Filamin C is Essential for mammalian myocardial integrity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results demonstrated that filamin C works in concert with β1
      integrin to maintain the structural integrity of myocardium during
      mammalian heart development.
    explanation: >-
      Names the specific sarcolemmal partner (beta-1 integrin) through which
      filamin C couples the sarcomere to the membrane. MODEL_ORGANISM because the
      demonstration is in knockout mice; it supports the molecular partnership,
      not the human hypertrophic phenotype.
  - reference: PMID:25351925
    reference_title: Mutations in filamin C cause a new form of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing reveals a variant in the gene encoding the

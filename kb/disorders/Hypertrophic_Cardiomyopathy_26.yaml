notes: >-
  Scope. This entry models MONDO:0014883 (hypertrophic cardiomyopathy 26,
  OMIM 617047, FLNC, HGNC:3756), the non-truncating FLNC arm of cardiac
  filaminopathy. It is deliberately scoped away from the other FLNC diseases
  already represented in dismech: Myofibrillar_Myopathy (which carries the
  FLNC/MFM5 subtype and the p.Trp2710Ter dimerization-domain allele),
  Dilated_Cardiomyopathy (which carries the FLNC gene node and the ClinGen
  FLNC-DCM Definitive assertion), and Dilated_Cardiomyopathy_1AA. The existing
  Arrhythmogenic_Right_Ventricular_Cardiomyopathy and DSP_Cardiomyopathy entries
  were checked and contain no FLNC content, so the truncating-FLNC arrhythmogenic
  phenotype is referenced here through the differential diagnosis rather than
  duplicated; a dedicated FLNC truncating cardiomyopathy entry remains a
  reasonable future addition.

  Variant class is the organising fact. Non-truncating (missense) FLNC variants
  cause the hypertrophic and restrictive phenotypes through aggregation of
  misfolded filamin C; truncating variants cause dilated and left-dominant
  arrhythmogenic phenotypes through haploinsufficiency, produce no myocardial
  aggregates, and were absent from 1,078 hypertrophic cardiomyopathy patients in
  the largest screen. Every mechanistic and clinical claim in this entry is
  sourced to a study of the hypertrophic or restrictive phenotype, except where a
  truncating-variant study is cited explicitly to draw the contrast.

  Gene-disease validity, and a nosological caveat. The ClinGen gene-validity
  download carries two FLNC assertions - myofibrillar myopathy (CGGV assertion
  d61672a0, 2023-10-26, Definitive) and dilated cardiomyopathy (CGGV assertion
  edb5197f, 2025-05-30, Definitive) - and no FLNC row in the hypertrophic
  cardiomyopathy gene list, so no CGGV evidence row could be cited for the CMH26
  relationship. That absence is not an oversight. The ClinGen Hereditary
  Cardiovascular Disease GCEP reappraisal (PMID:39132495) selected FLNC as one of
  three genes re-curated for HCM-like phenotypes presenting as isolated left
  ventricular hypertrophy, restricted the curation to non-loss-of-function
  variants, retained a Definitive classification, and assigned it to the disease
  entity myofibrillar myopathy, listing left ventricular hypertrophy and
  restrictive cardiomyopathy as associated features. The expert panel therefore
  treats the non-truncating FLNC cardiac phenotype as the cardiac expression of
  filaminopathy rather than as a distinct CMH. dismech keeps this entry because
  MONDO:0014883 exists as a distinct gene-anchored node and because the clinical
  literature curated here is specifically about the hypertrophic and restrictive
  presentation; the disagreement with ClinGen's lumping is recorded explicitly in
  the flnc_missense_hcm_pathogenicity_contested discussion rather than papered
  over. If MONDO later merges CMH26 into a filaminopathy node, this entry should
  be re-scoped accordingly.

  Reference identifier note. Agarwal et al. 2021 (Circ Res) is cited as
  DOI:10.1161/CIRCRESAHA.120.317076 rather than PMID:34405687 because the PubMed
  record for that paper carries only a graphical abstract, so the PMID cache
  contains no quotable abstract text while the DOI cache does. The reference
  validator skips DOI-prefixed snippets, so the three distinct snippets taken
  from it were verified by hand as whitespace-normalized substrings of
  references_cache/DOI_10.1161_CIRCRESAHA.120.317076.md.

  GeneReviews. A PubMed search for a GeneReviews chapter covering FLNC or CMH26
  returned only PMID:20301672, the retired Myofibrillar Myopathy chapter, which
  is not an appropriate phenotype baseline for this entity. No current
  GeneReviews chapter exists for FLNC-related cardiomyopathy, so the Step 3b
  baseline does not apply.

  Provenance. Deep research used the claude_code provider
  (research/Hypertrophic_Cardiomyopathy_26-deep-research-claude_code.md), not
  falcon: no EDISON_API_KEY or FUTUREHOUSE_API_KEY is available in this
  environment and deep-research-client reported falcon as unavailable. The report
  was treated as leads only; it passed the NEC gene/OMIM/synonym preflight, but
  one of its assertions (that ClinGen classifies FLNC as Definitive for
  hypertrophic cardiomyopathy) failed verification against the ClinGen
  gene-validity download and was not used.

  Unsourced or under-sourced. The description states that filamin C couples the
  sarcomere to the sarcolemma through integrin beta-1 and delta-sarcoglycan; the
  quoted evidence supports sarcolemmal attachment generally (PMID:27908349) but
  the beta-1 integrin partnership is sourced to a mouse knockout study
  (PMID:36706168, cited on the trigger node as MODEL_ORGANISM) and the
  delta-sarcoglycan partnership only to the Ripoll-Vera review (PMID:36539187),
  whose cached full text is Spanish-language and therefore not quoted as an
  evidence snippet. The Altered Extracellular Matrix Remodeling node's placement
  upstream of the diastolic node is a curator inference, flagged as such in that
  node's own description: the source reports differential matrix remodeling on
  histology without measuring its direction or mechanical effect. Frequency bands
  are asserted only where the source reports an explicit per-individual
  proportion; the 33 percent musculoskeletal figure is family-level and therefore
  carries no band. No node conforms to
  cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation, because no
  FLNC-specific evidence for a neurohormonal amplifier step was found; the rest
  of the module chain is followed.

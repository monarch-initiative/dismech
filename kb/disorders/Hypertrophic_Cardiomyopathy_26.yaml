        Establishes ROD2-clustered missense variation as the characteristic
        CMH26 genotype class. Evidence source is OTHER because this is a
        mutation-update review.
    - reference: PMID:35952944
      reference_title: ROD2 domain filamin C missense mutations exhibit a distinctive cardiac phenotype with restrictive/hypertrophic cardiomyopathy and saw-tooth myocardium.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We recruited 21 unrelated families genetically evaluated because of
        hypertrophic cardiomyopathy (HCM)/restrictive cardiomyopathy (RCM)
        phenotype carrying rare missense variants in the ROD2 domain of FLNC
        (FLNC-mRod2).
      explanation: >-
        Defines the ROD2 missense cohort whose phenotype this variant class
        entry describes.
  evidence:
  - reference: PMID:34535832
    reference_title: "Filamin C in cardiomyopathy: from physiological roles to DNA variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Truncated FLNC is enriched in dilated cardiomyopathy and arrhythmogenic
      right ventricular cardiomyopathy. Non-truncated FLNC is enriched in
      hypertrophic cardiomyopathy and restrictive cardiomyopathy.
    explanation: >-
      The core genotype-phenotype rule for this entry, stated explicitly:
      non-truncating variants map to the hypertrophic and restrictive phenotypes,
      truncating variants to the dilated and arrhythmogenic ones. Evidence source
      is OTHER because this is a review.
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating FLNC mutations were absent in patients with other phenotypes,
      including 1,078 patients with hypertrophic cardiomyopathy.
    explanation: >-
      The strongest single piece of evidence for the variant-class split: in a
      2,877-patient screen, truncating FLNC variants did not occur at all among
      1,078 hypertrophic cardiomyopathy patients.
  - reference: PMID:27908349
    reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating mutations in FLNC caused an overlapping phenotype of dilated and
      left-dominant arrhythmogenic cardiomyopathies complicated by frequent
      premature sudden death.
    explanation: >-
      Names the phenotype that the truncating class does cause, which is the
      entity this one must not be conflated with.
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic FLNC variants in patients with HCM/RCM are nontruncating and
      cause a discrete phenotype comprising a characteristic ECG, hypertrophic and
      restrictive features without hypercontractility, and extracardiac
      abnormalities.
    explanation: >-
      Contemporary confirmation, from a large sarcomere-negative HCM cohort with
      rare-variant burden testing, that the pathogenic FLNC alleles in
      hypertrophic disease are non-truncating.
  - reference: PMID:41672210
    reference_title: Hypertrophic cardiomyopathy caused by filamin-C variants has restrictive and extracardiac features and a distinctive ECG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family-based studies in 2 specialist services and statistical modeling of
      rare FLNC missense variants were conducted, using a cohort of 3289
      sarcomere-negative HCM cases and 122,348 genome aggregation database
      controls.
    explanation: >-
      Documents the cohort size and design behind the burden estimate, so the
      etiologic-fraction figures quoted elsewhere in this entry are anchored to a

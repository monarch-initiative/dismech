    snippet: "Immunoprecipitation demonstrated that the ΔExon8 mutation disrupts the intramolecular interaction between the ABD1 and ABD2 domains, while immunofluorescence colocalization revealed that the mutation alters the binding pattern of PLS1 to actin bundles and disturbs cytoskeletal organization."
    explanation: >-
      The measured molecular lesion: not absent binding but altered binding, with the
      autoinhibitory contact broken.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ABD2 has a higher affinity for actin than ABD1, but ABD1 imposes an autoinhibitory constraint on ABD2. When ABD1 first engages actin bundles, autoinhibition is relieved, allowing ABD2 to initiate effective cross-linking"
    explanation: >-
      The normal regulatory arrangement, which is what makes disrupting the ABD1-ABD2
      contact a gain of inappropriate activity as easily as a loss of activity.
  - reference: PMID:29874122
    reference_title: "The stable actin core of mechanosensory stereocilia features continuous turnover of actin cross-linkers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Altering the actin cross-linker composition, even as the actin filaments exhibit little to no turnover, provides a mechanism for ongoing remodeling and repair important for stereocilia homeostasis."
    explanation: >-
      Why a cross-linker defect is a lifelong maintenance problem rather than a
      developmental one: the filaments barely turn over but the cross-linkers on them are
      continuously exchanged. Indirect - it is a general property of the stereocilium
      measured with fascin-2, not a PLS1 experiment.
- name: Altered Stereocilia Actin Core Packing and Width
  description: >-
    The structural consequence. Plastin 1 is the most abundant cross-linker in vestibular
    stereocilia by targeted mass spectrometry, and what it does to the actin core is
    counterintuitive: it makes the packing less ordered, not more. Wild-type stereocilia
    have randomly arranged, liquid-packed actin filaments; stereocilia lacking plastin 1
    have orderly hexagonal packing and are shorter and thinner. Liquid packing is what
    permits a stereocilium to reach full diameter, so the cross-linker widens the rod by
    disordering it.

    In the mouse this is a maintenance failure. Bundles develop normally and the defect
    appears in young adults, with inner hair cells affected first and outer hair cells
    degenerating later.

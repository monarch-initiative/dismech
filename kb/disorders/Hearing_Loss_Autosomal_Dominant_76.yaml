inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous PLS1 variants segregating with hearing loss across generations in
    independent families of European, Roma, Turkish and Chinese ancestry. No homozygote or
    compound heterozygote has been reported, and no unaffected carrier has been documented,
    though penetrance has not been formally estimated in any pedigree.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31397523
    reference_title: "Mutations in PLS1, encoding fimbrin, cause autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we report PLS1 as a novel gene for autosomal dominant NSHL, suggesting that this gene is required for normal hearing in humans and mice."
    explanation: >-
      The founding gene-disease conclusion, stating the inheritance mode. Three unrelated
      dominant pedigrees underlie it, which is what took PLS1 past a single-family
      observation.
  - reference: PMID:30872814
    reference_title: "Hearing impairment locus heterogeneity and identification of PLS1 as a new autosomal dominant gene in Hungarian Roma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate a diverse genetic HI etiology in the Hungarian Roma and identify a new gene PLS1, for autosomal dominant human non-syndromic HI."
    explanation: >-
      The independent contemporaneous report in a different population, published within
      months of the founding paper and reaching the same inheritance conclusion.
mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_actin_crosslinking_model
  hypothesis_label: Dominant-negative mutant plastin 1 with partial loss of function
  status: EMERGING
  description: >-
    The mutant protein does something, rather than simply failing to do something. Direct
    comparison in zebrafish separates the two: the exon-8-skipping mutant reduces FM1-43 dye
    uptake through the mechanotransduction channel, while knocking plastin 1 out increases
    it, and neither the knockout nor re-expressed wild-type protein reproduces the mutant's
    reduction. Biochemically the mutant retains actin binding but binds abnormally,
    disrupting the intramolecular ABD1-ABD2 interaction that normally restrains the
    high-affinity domain, and it co-precipitates more ACTG1 than wild-type protein does.

    This is EMERGING rather than CANONICAL for a reason the authors state themselves: they
    did not co-express wild-type and mutant plastin 1, which is the experiment a
    dominant-negative claim requires, so the conclusion is inferred from the functional
    divergence between knockout and mutant rather than demonstrated in the heterozygous
    configuration the patients are actually in. It is also based on one allele. The four
    reported missense alleles have not been through the same analysis, and the modelling
    that predicted them to destabilise the first actin-binding domain is in silico.
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, neither PLS1 deficiency nor re-expression of human wild-type PLS1 in knockout zebrafish reproduces this MET defect. Thus, the mutation not only reduces native PLS1 function but also interferes with normal MET channel activity."
    explanation: >-
      The observation the whole hypothesis rests on: an effect present with the mutant and
      absent both from the null and from wild-type rescue, which is what "not simple loss of
      function" means operationally.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: "We did not directly assess the co-expression of wild-type and mutant PLS1, and future studies are needed to confirm the dominant-negative mechanism under physiologically relevant conditions."
    explanation: >-
      Graded NO_EVIDENCE rather than REFUTE: the sentence reports an experiment that was not
      done. It does not cut against the hypothesis, it is the reason the hypothesis is
      EMERGING.
- hypothesis_group_id: haploinsufficiency_model
  hypothesis_label: Reduced plastin 1 dosage from an unstable mutant protein
  status: ALTERNATIVE
  description: >-
    The simpler reading, and one the same study supports in part. The exon-8-skipping
    protein has a markedly shorter half-life than wild type, is more heavily ubiquitinated,
    and is degraded within twelve hours where the wild-type protein is stable, so cells
    carrying it hold less plastin 1 overall. On this model the disease is a dosage problem
    and the mouse null - moderate, progressive, late-onset loss - is the right model after
    all.

    There is a mouse observation that bears on this model and that the dominant-negative
    framing must not be allowed to obscure - but it is weaker than it first looks, and the
    same paper contains its counterweight.

    What is tested and positive: heterozygous nulls shift with age against *themselves*.
    Wild-type animals show no threshold shift between the youngest and oldest cohorts, and
    heterozygotes show a significant one. What is *not* established: a deficit against
    wild-type controls. On click ABR in animals older than six months there was no
    significant difference between heterozygotes and wild type, and the tone-pip elevation
    described at seven to nine months carries no statistic - the figure legend marks
    significance for knockout versus wild type only. The paper also uses heterozygotes as a
    control genotype throughout its stereocilia morphology, hair cell electrophysiology and
    transduction measurements, where they behave normally.

    So the honest reading is that heterozygous nulls plausibly develop a late, mild
    deterioration, and that halving plastin 1 has never been shown to produce a deficit a
    properly powered comparison would detect. That is suggestive for dosage sufficiency and
    it is not settled.

    Recorded as ALTERNATIVE rather than dismissed because the two are not exclusive and the
    authors present them side by side: reduced stability accounts for the loss-of-function
    component, and the divergent transduction phenotype accounts for the rest. What would
    separate them is a truncating PLS1 allele or a whole-gene deletion in a hearing-impaired
    person; none has been reported.
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHX-chase experiments revealed rapid degradation of ΔExon8-PLS1 within 12 h, whereas WT-PLS1 remained stable, indicating that the mutation substantially reduced protein stability."
    explanation: >-
      The measured instability that gives the dosage model its footing, from a
      cycloheximide-chase experiment in cells.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike the dominant-negative effects described above, this aspect of the phenotype is more consistent with a dosage-insufficient, partial loss-of-function mechanism."
    explanation: >-
      The authors' own separation of the two arms, which is why this entry carries both as
      named hypotheses rather than choosing one.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice aged 7–9 months, hearing thresholds\nwere elevated for het animals for all frequencies tested\nbetween 8 and 32 kHz"
    explanation: >-
      The observation that carries the most weight for this model: a mouse with one
      functional Pls1 copy and no mutant protein develops hearing loss with age. Halving the
      dose is sufficient, which is what haploinsufficiency asserts.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "whereas there was no signiﬁcant\nthreshold shift between the young and oldest wt animals, there\nwas a signiﬁcant (P , 0.01) threshold shift between the young-\nest and oldest het animals."
    explanation: >-
      The within-genotype comparison, which rules out ageing as the explanation: wild-type
      animals do not shift over the same period and heterozygotes do. Quoted verbatim from a
      PDF-derived cache, so the less-than sign renders as a comma and the ligatures and line
      breaks are the cache's.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "In animals older than 6\nmonths, hearing thresholds were signiﬁcantly raised in Pls1\nKO compared with wt (P , 0.001) but there were no signiﬁcant\ndifferences between Pls1 KO and het, or between het and wt."
    explanation: >-
      Graded REFUTE, and it is the counterweight to the two items above. The comparison that
      would show halving the dose is sufficient - heterozygote against wild type - was made
      and was negative. This paper supports one part of the dosage claim and contradicts
      another, so it is split into separate items rather than cited only where it helps.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: "Signiﬁcant differences between Pls1 KO and wt thresholds are indicated on (B–D)."
    explanation: >-
      Graded NO_EVIDENCE: the figure legend marks significance for knockout against wild type
      only, so the tone-pip elevation reported for heterozygotes at seven to nine months is
      descriptive rather than a tested difference. Recorded because without it that sentence
      reads as a positive result.
pathophysiology:
- name: PLS1 Heterozygous Variant
  description: >-
    A single altered PLS1 allele. The reported spectrum falls into two classes and contains
    no truncation. Four missense changes sit in or adjacent to the actin-binding regions -
    p.Phe128Ser, p.Leu238Arg and the recurrent p.Glu269Lys in European and Turkish families,
    and p.Leu363Phe in the calponin-homology 2 domain in a Hungarian Roma family. Two splice
    variants at the same donor site, c.981+1G>A and c.981+5G>A, produce an in-frame internal
    deletion of the region encoded by that exon; the two reports number the skipped exon
    differently, so this entry names the donor site rather than an exon number.

    The absence of truncating alleles is a real feature of the spectrum, not a gap in
    ascertainment yet: every published family carries a variant that leaves a protein
    behind.

    One allele recurs. p.Glu269Lys was reported independently in a European family and a
    Turkish family within months of each other in 2019, each report presenting it as novel.
    Neither addresses whether that is recurrent mutation at a hypermutable site or a shared
    haplotype, and no haplotype analysis has been published, so the entry records the
    recurrence without asserting a founder effect. The same is true of the two splice
    variants: c.981+1G>A and c.981+5G>A are different changes at one donor site in two
    unrelated Chinese families, which is convergence on a splice junction rather than a
    shared allele.

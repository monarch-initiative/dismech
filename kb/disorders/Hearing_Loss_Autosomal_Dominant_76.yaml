    snippet: "In silico protein modeling suggests that all variants destabilize the structure of the actin-binding domain 1, likely reducing the protein's ability to bind F actin."
    explanation: >-
      The predicted consequence shared by the three founding missense alleles, and - in the
      word "suggests" - the fact that it is modelling rather than measurement.
  - reference: PMID:31432506
    reference_title: "Novel variant p.E269K confirms causative role of PLS1 mutations in autosomal dominant hearing loss."

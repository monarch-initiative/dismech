    snippet: "Auditory hair cells developed normally in Pls1 KO, but in young adult animals, the stereocilia of inner hair cells were reduced in width and length."
    explanation: >-
      Normal development followed by adult narrowing and shortening, which is what makes
      this a maintenance node rather than a morphogenesis one.
- name: Impaired Mechanoelectrical Transduction
  description: >-
    Transduction is affected, but the mouse null and the human-type mutant are not affected
    in the same direction and the difference is the most informative measurement in the
    disease. In Pls1 knockout mice the size of the mechanoelectrical transducer current is
    unchanged and bundle stiffness is unaffected; only the adaptation properties differ. In
    zebrafish, FM1-43 uptake through the transduction channel is modestly increased in
    plastin-1 knockouts - consistent with channels sitting abnormally open - and
    significantly reduced in larvae expressing the human exon-skipping mutant, consistent
    with channels that do not open properly.

    Whether that reflects bundle mechanics, tip-link tension or channel gating has not been
    determined, which the authors say explicitly. This node therefore records a transduction
    abnormality whose sign depends on the allele class, and does not assert a mechanism for
    it.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, whether these differences reflect altered bundle mechanics, tip-link tension, or channel gating cannot be determined from the present data and will require direct physiological and ultrastructural analyses."
    explanation: >-
      The authors' statement of what remains unknown, which is why this node stops at
      "transduction is abnormal" rather than naming a mechanism.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The hair bundle stiffness and the acquisition of the electrophysiological properties of hair cells were unaffected by the absence of plastin 1, except for a significant change in the adaptation properties, but not the size of the mechanoelectrical transducer currents."
    explanation: >-
      The mouse null's narrow transduction phenotype - adaptation changed, current size and
      stiffness not - which is the measurement the zebrafish mutant result is contrasted
      against.
phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral or, in one reported family, unilateral or asymmetric sensorineural hearing
    loss that worsens with age. The best-characterised course is the Chinese exon-skipping
    family: moderate-to-severe, high-frequency-weighted, beginning in childhood and
    progressing. The Turkish family with p.Glu269Lys was symmetric, moderate and
    postlingually diagnosed, with absent otoacoustic emissions and preserved acoustic
    reflexes. Severity across all reported individuals spans mild to profound. No frequency
    band is given for progression: the total published cohort is a handful of families and
    no series reports what proportion progressed.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0001730
      label: Progressive hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals exhibit progressive, unilateral or bilateral, moderate-to-severe, high-frequency hearing loss that begins in childhood and worsens with age."
    explanation: >-
      The fullest published description of the audiological course in a single DFNA76
      family.
  - reference: PMID:31432506
    reference_title: "Novel variant p.E269K confirms causative role of PLS1 mutations in autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Out of three major classes of actin-bundling proteins, plastin 1 encoded by PLS1, is highly expressed in stereocilia and is necessary for their regular maintenance."
    explanation: >-
      The maintenance framing the clinical authors themselves apply to the progressive
      course. Indirect with respect to the phenotype record because it states the biology
      rather than reporting these patients' audiograms.
- name: High-Frequency Weighted Hearing Loss
  category: Auditory
  description: >-
    Where the audiometric configuration is described, the loss is worse at high frequencies
    in the Chinese exon-skipping family and in the Hungarian Roma family. The second Chinese
    family is the exception: its proband had severe loss across the medium-to-high range
    from 250 to 8000 Hz, so the high-frequency bias is a tendency rather than a defining
    feature. No frequency value is recorded because no series large enough to compute one
    has been published.
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate-to-severe, high-frequency hearing loss that begins in childhood and worsens with age"
    explanation: The audiometric configuration in the family with the fullest clinical description.
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 6, pure-tone audiometry revealed bilateral symmetric severe hearing loss at medium-to-high frequencies (250-8000 Hz), with abnormal air and bone conduction thresholds"
    explanation: >-
      The counter-example: a proband whose loss spans the medium as well as the high range,
      which is why this record describes a bias rather than a restriction.
- name: Congenital Onset in Some Families
  category: Auditory
  description: >-
    Not every DFNA76 family presents after speech acquisition. In one Chinese family both
    the proband and her mother had congenital hearing loss, the proband failing newborn
    screening on otoacoustic emissions and automatic auditory brainstem response. The
    authors used that prelingual onset to argue against two competing candidate variants in
    the same proband's mother, both in genes causing postlingual progressive loss - which
    makes the onset a load-bearing part of their diagnostic reasoning rather than an
    incidental observation.

    Curated separately from the progressive record because the two cannot be merged into a
    single onset statement without misdescribing one family or the other.

    This record deliberately has no incoming causal edge. Congenital onset is a timing
    qualifier on the same hearing loss the pathograph already ends in, not a separate
    downstream consequence, and drawing an edge into it would assert that a named mechanism
    node causes the loss to be congenital - a claim nothing in the PLS1 literature supports,
    since the same donor-site region produces congenital loss in one family and childhood
    onset in another.
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband (III-1), a 7-year-old girl, was diagnosed with congenital hearing loss, failing newborn hearing screening, which included otoacoustic emissions and automatic auditory brainstem response"
    explanation: The documented congenital onset, established objectively rather than by history.
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, both affected individuals in the present family exhibited prelingual deafness, consistent with other reported NSHL cases caused by PLS1 mutations"
    explanation: >-
      The authors' use of prelingual onset as a discriminating feature. Their claim that it
      is consistent with other PLS1 reports is recorded as their assessment; the Turkish
      family was postlingually diagnosed, which is why this entry does not adopt it.
genetic:
- name: PLS1
  notes: >-
    PLS1 encodes plastin 1, also called fimbrin or I-plastin, one of three plastin isoforms
    in humans. The protein has two N-terminal EF-hand calcium-binding motifs and two tandem
    actin-binding domains, each built from a pair of calponin-homology folds. The second
    domain binds actin with higher affinity and is held under autoinhibitory restraint by
    the first, so cross-linking is a two-step process rather than a simple bivalent grip.
    Outside the ear, plastin 1 is predominantly an intestinal epithelial microvillar
    protein.

    Every reported DFNA76 allele leaves a protein behind - four missense changes clustered
    in or beside the actin-binding regions and two splice variants at one donor site
    producing an in-frame internal deletion. No truncating allele and no whole-gene deletion
    has been reported in a hearing-impaired person, which is why the haploinsufficiency
    model in the hypotheses section remains untested rather than excluded.

    A separate line of work bears on how the mutant behaves in a cell. The exon-skipping
    protein has a ubiquitination site six residues downstream of the deleted region, is more
    heavily ubiquitinated than wild type, and is degraded within twelve hours, so the mutant
    allele contributes both an abnormal protein and less total protein.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PLS1
    term:
      id: hgnc:9090
      label: PLS1
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PLS1 is predominantly expressed in intestinal epithelial microvilli and stereocilia of cochlear and vestibular hair cells"
    explanation: >-
      The expression pattern, including the extra-auditory site. Graded OTHER because the
      sentence is this paper's introductory summary of prior work rather than a measurement
      it made.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "According to UniProt, the ubiquitination site (K333) is located only six amino acids downstream of the ΔExon8 deletion region"
    explanation: >-
      The structural reason the mutant protein is destabilised, which connects the splice
      lesion to the reduced dosage arm of the mechanism.
  - reference: PMID:31397523
    reference_title: "Mutations in PLS1, encoding fimbrin, cause autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLS1 encodes Plastin 1 (also called fimbrin), one of the most abundant actin-bundling proteins of the stereocilia."
    explanation: >-
      What the gene encodes and how much of it there is in a stereocilium, from the paper
      that first tied it to human disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DFNA76 is known from a small number of families - three of European ancestry in the
    founding report, one Hungarian Roma family, one Turkish family and two Chinese families.
    No prevalence or incidence estimate has been published, so no rate_per_100000 is
    recorded and ULTRA_RARE is a qualitative band rather than a converted figure. PLS1 also
    contributes to the residual diagnostic yield in large nonsyndromic hearing loss cohorts,
    which is a different quantity and is not curated here as a prevalence.
  evidence:
  - reference: PMID:31432506
    reference_title: "Novel variant p.E269K confirms causative role of PLS1 mutations in autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense PLS1 variant associated with autosomal dominant hearing loss (HL) in a small family has recently been reported."
    explanation: >-
      The state of the literature when the second family was published: one small family.
      That is the scale the ULTRA_RARE band records.
progression:
- phase: Onset
  age_range: congenital to adult recognition
  notes: >-
    Onset is genuinely heterogeneous rather than uncertain. One Chinese family is congenital
    and failed newborn screening; the other Chinese family's loss begins in childhood; the
    Turkish family was diagnosed postlingually. A normal newborn screen therefore does not
    exclude DFNA76 in a family carrying a PLS1 variant, and a failed one does not contradict
    the diagnosis either.
  evidence:
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probands mother, aged 36 years, also exhibited congenital hearing loss, with pure-tone audiometry demonstrating levels markedly above the normal threshold"
    explanation: The congenital end of the onset range, in two generations of one family.
- phase: Progression
  age_range: childhood onwards
  notes: >-
    Where the loss begins in childhood it worsens with age, weighted towards the high
    frequencies. No rate of decline in decibels per year has been published for any DFNA76
    family, so surveillance intervals cannot be derived from the literature.
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals exhibit progressive, unilateral or bilateral, moderate-to-severe, high-frequency hearing loss that begins in childhood and worsens with age."
    explanation: The reported course, in the only family described in this much detail.
diagnosis:
- name: PLS1 on autosomal dominant nonsyndromic hearing loss panels, with RNA analysis for splice alleles
  description: >-
    DFNA76 is reached by a hearing loss gene panel or exome sequencing containing PLS1, with
    segregation testing across the pedigree. Two of the six reported alleles are splice
    variants at the same donor site, and neither was called pathogenic on sequence alone -
    one required a minigene assay and the other reverse-transcription PCR to show exon
    skipping. A PLS1 splice variant of uncertain significance is therefore a candidate for
    RNA-level testing rather than a reason to stop looking.
  evidence:
  - reference: PMID:36537221
    reference_title: "A novel PLS1 c.981+1G>A variant causes autosomal-dominant hereditary hearing loss in a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A minigene assay was conducted to investigate the effect of the variant on PLS1 mRNA splicing."
    explanation: The assay that established the first splice allele's consequence.
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This functional evidence meets the 'PS3_Moderate' criterion under ACMG guidelines. Therefore, the c.981+5G>A variant was reclassified from a VUS to 'likely pathogenic'."
    explanation: >-
      The concrete consequence of doing the RNA work: a variant of uncertain significance
      became actionable.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids, the first-line intervention, and the one DFNA76 management fact that is
    actually reported: both affected members of one Chinese family require them for daily
    life. What is specific to this disorder is the follow-up rather than the fitting. Onset
    ranges from congenital to adult recognition within the same gene, so a normal audiogram
    in a young carrier settles nothing, and the loss that does appear progresses - so the
    useful commitment is repeated aided testing rather than a single decision.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Impairment
    description: >-
      Compensates for the threshold loss by raising the sound pressure reaching a bundle that
      is narrowing and shortening but still transducing. It does not act on the actin
      cross-linking defect or slow the stereocilia degeneration driving it, which is why no
      treatment_effect value is recorded - every value in that enum asserts a change to the
      mechanism, and amplification makes no such claim.
  evidence:
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, both mother and daughter require hearing aids for daily life."
    explanation: >-
      The only reported description of management in a DFNA76 family. It records use, not
      outcome, and no aided threshold or speech score is published for any PLS1 patient.
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants."
    explanation: >-
      Cited at the class level deliberately. This is a narrative review of autosomal dominant
      nonsyndromic hearing loss as a group, not of DFNA76, so it supports the management
      approach for the class this disease belongs to. Graded INDIRECT for that reason, and
      OTHER because it is a review rather than a study. No DFNA76-specific treatment study
      exists.
- name: Cochlear Implantation
  description: >-
    Implantation as thresholds deteriorate past what amplification can address, which the
    reported severity range - mild to profound - makes a real prospect in this disease.
    Curated separately from amplification because the two differ in what can be said about
    them: implantation is a surgical procedure with a bindable action term, and no
    DFNA76-specific outcome series exists, so this record notes the intervention without
    claiming an outcome for the genotype.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Altered Stereocilia Actin Core Packing and Width
    treatment_effect: BYPASSES
    description: >-
      The DFNA76 lesion is inside the hair cell's actin core. An implant stimulates the
      spiral ganglion electrically and does not need a bundle of normal width, so it operates
      downstream of the node that fails.
  evidence:
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants."
    explanation: >-
      Class-level support for implantation as part of the management pathway for dominant
      nonsyndromic hearing loss. Graded INDIRECT because the review is about the group, not
      this disease; no PLS1 implantation outcome is reported anywhere.
- name: Genetic Counselling
  description: >-
    Counselling for a dominant condition with a 50 percent transmission risk. The
    disease-specific content is what the PLS1 result does not predict: onset spans congenital
    to adult across reported families, so a normal audiogram in a young carrier does not
    establish non-penetrance and a family cannot be told when to expect the loss. Formal
    penetrance has not been estimated in any pedigree.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, both affected individuals in the present family exhibited prelingual deafness, consistent with other reported NSHL cases caused by PLS1 mutations"
    explanation: >-
      The congenital end of the onset range in one family, which is half of what makes onset
      uncounsellable. The authors' claim that it is consistent with other PLS1 reports is
      theirs; the Turkish family was diagnosed postlingually.
  notes: >-
    No target_mechanisms link is recorded on this treatment. Counselling does not act on a
    pathograph node, and no TreatmentEffectEnum value describes it - INHIBITS, ACTIVATES,
    MODULATES, BYPASSES and RESTORES are all claims about changing a mechanism. The two
    device treatments above carry the section's join points into the graph instead.

    No PLS1-directed drug, antisense oligonucleotide, gene replacement or gene editing has
    been reported, and no DFNA76-specific clinical trial was identified. The
    dominant-negative hypothesis, if confirmed, would make simple gene addition the wrong
    modality here - allele-specific silencing rather than augmentation - which is the
    practical reason the mechanism question in the discussions section matters.
animal_models:
- name: Pls1 knockout mouse
  species: Mouse
  genotype: Pls1 -/- (plastin 1 null)
  publication: PMID:25124451
  description: >-
    The principal in vivo model, and a homozygous null standing in for a heterozygous
    missense or in-frame-deletion disease. Knockouts have moderate progressive hearing loss
    across all frequencies. Hair cells develop normally; inner hair cell stereocilia narrow
    and shorten in young adults, outer hair cell stereocilia are less affected initially and
    degenerate with age. Bundle stiffness and the acquisition of hair cell electrophysiology
    are normal, and transducer current size is unchanged, with only adaptation altered. A
    later cryo-electron-tomography study used the same line to show that the actin filaments
    of plastin-1-deficient stereocilia adopt orderly hexagonal packing where wild-type
    filaments are liquid-packed.
  genes:
  - preferred_term: PLS1
    term:
      id: hgnc:9090
      label: PLS1
  modeled_mechanisms:
  - target: Altered Stereocilia Actin Core Packing and Width
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This is where the structural claim comes from. Actin filament packing inside a
      stereocilium cannot be measured in a patient, so the mouse is not corroborating a
      human observation - it is the experiment in which plastin 1's contribution to bundle
      width was defined, and the direction of the effect (loosening the lattice to allow
      widening) was not the expected one.
    limitations: >-
      The packing and width measurements were made in vestibular stereocilia of a homozygous
      null, and the human disease is heterozygous, cochlear and caused by alleles that
      produce protein. Nothing here shows that a human missense or in-frame-deletion allele
      changes actin packing at all.
    readouts:
    - name: Actin filament packing order in stereocilia
      target: Altered Stereocilia Actin Core Packing and Width
      direction: ALTERED
      interpretation: >-
        Packing shifts from liquid to hexagonal without plastin 1, which is the structural
        change that limits how wide a stereocilium can grow.
      evidence:
      - reference: PMID:27811163
        reference_title: "Plastin 1 widens stereocilia by transforming actin filament packing from hexagonal to liquid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Surprisingly, although wild-type stereocilia had random liquid packing of their actin filaments, stereocilia lacking PLS1 had orderly hexagonal packing."
        explanation: The packing measurement behind this readout.
    - name: Stereocilium width and length
      target: Altered Stereocilia Actin Core Packing and Width
      direction: DECREASED
      interpretation: >-
        Inner hair cell stereocilia become narrower and shorter in young adults, after
        developing normally.
      evidence:
      - reference: PMID:25124451
        reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Auditory hair cells developed normally in Pls1 KO, but in young adult animals, the stereocilia of inner hair cells were reduced in width and length."
        explanation: The morphometric measurement behind this readout, and its timing.
    evidence:
    - reference: PMID:27811163
      reference_title: "Plastin 1 widens stereocilia by transforming actin filament packing from hexagonal to liquid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mouse utricle stereocilia lacking PLS1 were shorter and thinner than wild-type stereocilia."
      explanation: The structural phenotype that makes this line informative for the node.
  - target: Impaired Mechanoelectrical Transduction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The null does affect transduction, but narrowly and in the wrong direction to model
      the human allele. Only adaptation changes; current size and bundle stiffness do not.
      In zebrafish the equivalent comparison shows the null and the human-type mutant moving
      transduction-channel dye uptake in opposite directions.
    limitations: >-
      Fidelity is LOW because the discrepancy is directional, not merely quantitative. The
      null's transduction phenotype cannot stand in for the mutant's, and the study that
      established this was done in zebrafish rather than in the mouse line, so no mouse
      carrying a human PLS1 allele has been tested. Curating this link at higher fidelity
      would let a reader infer that anything measured in Pls1 knockout mice applies to
      DFNA76 patients, which is the specific error this entry exists to avoid.
    readouts:
    - name: Mechanoelectrical transducer current and adaptation
      target: Impaired Mechanoelectrical Transduction
      direction: ALTERED
      interpretation: >-
        Adaptation properties change while transducer current amplitude does not, so the
        null perturbs how the channel responds over time rather than how many channels
        there are or how well they open.
      evidence:
      - reference: PMID:25124451
        reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The hair bundle stiffness and the acquisition of the electrophysiological properties of hair cells were unaffected by the absence of plastin 1, except for a significant change in the adaptation properties, but not the size of the mechanoelectrical transducer currents."
        explanation: >-
          The electrophysiological measurement behind this readout, including the three
          things that did not change.
    evidence:
    - reference: PMID:41922548
      reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "FM1-43 uptake was slightly increased in Pls1-knockout larvae but reduced in the ΔExon8-PLS1 group. These contrasting patterns suggest that PLS1 deficiency and ΔExon8-PLS1 expression may perturb MET channel function through different mechanisms."
      explanation: >-
        Why this link is only partial: knocking the gene out and expressing the human mutant
        do different things to transduction. Indirect with respect to the mouse model
        because the comparison was made in zebrafish.
  evidence:
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we found that plastin 1 knock-out (Pls1 KO) mice have a moderate and progressive form of hearing loss across all frequencies."
    explanation: >-
      The auditory phenotype that makes the line informative, and the qualifier - moderate,
      progressive - that the founding human paper cited as its prior.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hence, mutations in the human PLS1 gene may be associated with relatively mild and progressive forms of hearing loss."
    explanation: >-
      The prediction this mouse made four years before PLS1 was found in patients, which is
      the strongest thing that can be said for the model's relevance.
- name: pls1 knockout and human mutant-expressing zebrafish
  species: Zebrafish
  genotype: pls1 -/- knockout, and larvae expressing human PLS1 wild-type or the exon-skipping mutant
  publication: PMID:41922548
  description: >-
    A four-arm comparison - uninjected control, plastin-1 knockout, knockout plus human
    wild-type protein, knockout plus the human exon-skipping mutant - that is the only
    published experiment putting the human allele and simple gene loss side by side in an
    animal. Knockouts have enlarged otic vesicles and altered otolith diameters, both
    rescued by wild-type protein; the mutant fails to rescue them. Both knockout and
    mutant larvae show reduced sound-evoked swimming, but only the mutant reduces FM1-43
    uptake through the transduction channel, which is increased in the knockout.
  genes:
  - preferred_term: PLS1
    term:
      id: hgnc:9090
      label: PLS1
  modeled_mechanisms:
  - target: Impaired Mechanoelectrical Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The experiment that establishes the transduction defect as a property of the mutant
      protein rather than of plastin 1 deficiency. Its design is what gives it force: the
      wild-type rescue arm rules out the injection and the knockout background as
      explanations.
    limitations: >-
      Zebrafish lateral-line neuromast hair cells are not cochlear hair cells, and FM1-43
      uptake is an indirect proxy for channel function that the authors decline to interpret
      mechanistically. The human protein is expressed on a zebrafish null background rather
      than beside an endogenous wild-type allele, so the configuration is not the
      heterozygous one patients are in. Espin and fascin partially compensate for absent
      plastin 1 in zebrafish stereocilia, which the authors offer as the reason the knockout
      phenotype is modest - so the null arm may understate what losing plastin 1 does.
    readouts:
    - name: FM1-43 uptake through the transduction channel in lateral-line neuromasts
      target: Impaired Mechanoelectrical Transduction
      direction: DECREASED
      interpretation: >-
        Dye entry falls in larvae expressing the human mutant, indicating channels that open
        less or are less permeable - the opposite of what happens when plastin 1 is simply
        absent.
      evidence:
      - reference: PMID:41922548
        reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Quantification of FM1-43 fluorescence intensity based on the mean fluorescence intensity of the neuromast region showed that ΔExon8-PLS1 larvae exhibited significantly reduced fluorescence compared with wild-type larvae (Fig. 6D,E), indicating impaired MET channel function."
        explanation: The measurement behind this readout and its direction in the mutant arm.
    - name: Sound-evoked swimming response
      target: Impaired Mechanoelectrical Transduction
      direction: DECREASED
      interpretation: >-
        Both knockout and mutant larvae respond less to sound, so the behavioural readout -
        unlike the dye readout - does not separate the two.
      evidence:
      - reference: PMID:41922548
        reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Behavioral assays further demonstrated that both Pls1-KO and ΔExon8-PLS1 larvae exhibited reduced sound-evoked locomotor responses, whereas WT-PLS1 partially restored auditory sensitivity."
        explanation: >-
          The behavioural measurement, recorded alongside the dye readout precisely because
          it does not distinguish the arms that the dye readout does.
    evidence:
    - reference: PMID:41922548
      reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, ΔExon8-PLS1 failed to rescue these abnormalities and produced phenotypes comparable to those of the knockout, suggesting that the mutation disrupted the essential functions of PLS1 in otolith formation and cytoskeletal homeostasis."
      explanation: >-
        The rescue-failure result establishing that the mutant protein is non-functional for
        plastin 1's normal jobs, which is the loss-of-function half of the mechanism.
discussions:
- discussion_id: pls1_null_mouse_versus_dominant_human_allele
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The main in vivo model of DFNA76 is a homozygous Pls1-null mouse, and the disease is
    dominant in people carrying one missense or in-frame-deletion allele. Zebrafish data say
    the null and the human-type mutant perturb mechanotransduction in opposite directions.
    How much of the mouse phenotype should be read as DFNA76?
  attaches_to:
  - animal_models#Pls1 knockout mouse
  - pathophysiology#Impaired Mechanoelectrical Transduction
  - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
  rationale: >-
    The Pls1-null mouse has earned its place. It predicted, before any patient was found,
    that human PLS1 mutations would cause relatively mild progressive hearing loss; it is
    where the maintenance role of plastin 1 was established; and it is the material in which
    the actin-packing result was obtained. Every structural claim in this entry's
    pathophysiology depends on it.

    But it is a null, and DFNA76 is not a null disease. Six alleles have been reported and
    not one is truncating: four missense changes in or beside the actin-binding domains, and
    two splice variants at a single donor site that remove an internal segment in frame. A
    protein is made in every reported patient. When the two situations were compared
    directly - the only time they have been - they came apart on the measurement that
    matters most for a mechanosensory cell: dye uptake through the transduction channel fell
    with the human mutant and rose in the knockout, and wild-type protein re-expressed in
    the knockout did not reproduce the mutant's defect.

    So the mouse is a good model of losing plastin 1 and an unknown model of having a
    defective one. That distinction is not academic. If the dominant-negative reading is
    right, gene addition - the modality being developed for recessive deafness genes - would
    add wild-type protein alongside a mutant that is actively interfering, and the
    therapeutic strategy would have to be allele-specific silencing instead. If the dosage
    reading is right, augmentation is exactly right. Nothing published distinguishes them,
    and the experiment that would is not hard: no mouse carrying a human PLS1 missense or
    exon-skipping allele has been made.

    A second, quieter mismatch sits underneath. The zebrafish knockout phenotype is modest,
    and the authors attribute that to espin and fascin partially compensating for absent
    plastin 1 - so the null arm of the comparison may understate the consequence of losing
    the protein, which would narrow rather than widen the gap between the two. That
    possibility has not been tested either.
  evidence:
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, neither PLS1 deficiency nor re-expression of human wild-type PLS1 in knockout zebrafish reproduces this MET defect. Thus, the mutation not only reduces native PLS1 function but also interferes with normal MET channel activity."
    explanation: The direct statement of the mismatch, with the wild-type rescue arm as the control.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because Espin and Fascin are also expressed in zebrafish stereocilia and can partially compensate for the absence of PLS1"
    explanation: >-
      The reason the knockout arm may understate plastin 1 loss, which is the second-order
      uncertainty inside the comparison.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, it is essential to define the pathogenic mechanism of each mutation, particularly distinguishing between loss-of-function and dominant-negative mutations."
    explanation: >-
      The authors' framing of why the distinction is a therapeutic question rather than a
      taxonomic one, stated in the context of AAV gene therapy.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "These results show that in contrast to other actin-bundling proteins such as espin, harmonin or Eps8, plastin 1 is dispensable for the initial formation of stereocilia."
    explanation: >-
      What the null model does establish well, recorded so the mismatch is not read as a
      dismissal of the mouse. Indirect with respect to DFNA76 because it describes a
      homozygous null rather than a heterozygous patient allele.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice aged 7–9 months, hearing thresholds\nwere elevated for het animals for all frequencies tested\nbetween 8 and 32 kHz"
    explanation: >-
      The observation that stops this discussion from claiming the mouse cannot model a
      dominant disease at all. Note what it is not: a tested difference against wild type.
      The figure legend marks significance for knockout versus wild type only.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "In animals older than 6\nmonths, hearing thresholds were signiﬁcantly raised in Pls1\nKO compared with wt (P , 0.001) but there were no signiﬁcant\ndifferences between Pls1 KO and het, or between het and wt."
    explanation: >-
      Graded REFUTE against the reading that heterozygous nulls are established as affected.
      The comparison was made on click ABR beyond six months and was negative, which is what
      keeps "heterozygous nulls unaffected, knock-in heterozygotes deaf" alive as a possible
      dominant-negative signature.
  - reference: PMID:25124451
    reference_title: "Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a moderate form of hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Altogether, these results show that the absence of plastin 1\ncauses a moderate form of hearing loss in young adult mice\n(10–20 dB), progressing to a severe loss (40–50 dB) with age."
    explanation: >-
      The magnitude and tempo of the homozygous null phenotype, which is what the human
      course has to be compared against: 10 to 20 dB in young adults reaching 40 to 50 dB
      with age, against patients who fail newborn screening or reach severe loss in
      childhood.
  proposed_experiments:
  - experiment_id: exp_dfna76_knockin_mouse_allele_series
    name: Knock-in mouse allele series for a DFNA76 missense and the exon-skipping allele
    description: >-
      Generate mice carrying the recurrent p.Glu269Lys missense allele and the exon-skipping
      allele in the endogenous Pls1 locus, and phenotype heterozygotes against wild-type,
      Pls1 heterozygous nulls and Pls1 homozygous nulls with auditory brainstem response and
      distortion product otoacoustic emissions across ages, scanning electron microscopy of
      bundle morphology, stereocilium width morphometry, and single-cell transducer current
      and adaptation recordings. The heterozygous-null arm is the critical comparison and it
      is the arm that is currently underpowered: existing data show heterozygotes shifting
      against themselves with age but never reaching a significant deficit against wild type,
      so this experiment has to settle both questions at once - whether heterozygous nulls
      are affected at all on an adequately powered comparison, and, if they are, whether
      knock-in heterozygotes are affected earlier, more severely, or with a transduction
      phenotype of the opposite sign.
    would_support:
    - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
    supporting_outcome:
    - >-
      Knock-in heterozygotes lose hearing while heterozygous nulls do not, or lose it earlier
      and more severely than nulls of the same age, and their transducer phenotype differs in
      direction from the null's - either result would establish the dominant-negative
      mechanism in the heterozygous configuration patients are in and make allele-specific
      silencing the rational therapeutic target.
    would_refute:
    - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
    refuting_outcome:
    - >-
      Knock-in heterozygotes and Pls1 heterozygous nulls are indistinguishable in onset,
      severity and transduction phenotype - both late, mild and progressive - which would
      make DFNA76 a haploinsufficiency disease, would retire the dominant-negative
      hypothesis, and would make gene augmentation the appropriate modality.
- discussion_id: pls1_onset_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    DFNA76 onset spans congenital to adult across a handful of families. Is that
    allele-driven, and can a family carrying a PLS1 variant be told when to expect the loss?
  attaches_to:
  - phenotypes#Congenital Onset in Some Families
  - phenotypes#Progressive Sensorineural Hearing Impairment
  - progression#Onset
  rationale: >-
    The reported families do not agree about when this disease starts. One Chinese family
    failed newborn screening in two generations. The other Chinese family's loss begins in
    childhood and progresses. The Turkish p.Glu269Lys family was diagnosed postlingually.
    That is a wider onset range than most dominant nonsyndromic hearing loss genes show, and
    it is currently unexplained.

    Two readings are available and neither has been tested. The alleles may differ in
    consequence - the splice variants remove an internal segment while the missense changes
    substitute a single residue, and it would not be surprising if those produced different
    ages of onset. Or onset may vary within an allele, as it demonstrably does for the
    unrelated TPRN null in DFNB79, in which case a modifier or an environmental contribution
    is at work and genotype will never answer the question.

    Distinguishing them needs no new technology, only aggregation: the published families
    are individually too small, but pooling their audiograms by allele would show
    immediately whether the two splice families cluster apart from the missense families.
    Nobody has done it, and the reason is prosaic - the reports are scattered across four
    journals in three countries and no DFNA76 registry exists.

    The counselling stake is concrete. A couple whose child carries a PLS1 variant currently
    cannot be told whether to expect a failed newborn screen, a school-age diagnosis, or
    nothing until adulthood, which changes what surveillance to arrange and when.
  evidence:
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband (III-1), a 7-year-old girl, was diagnosed with congenital hearing loss, failing newborn hearing screening, which included otoacoustic emissions and automatic auditory brainstem response"
    explanation: The congenital pole of the onset range, objectively documented.
  - reference: PMID:41922548
    reference_title: "Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation in a zebrafish model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals exhibit progressive, unilateral or bilateral, moderate-to-severe, high-frequency hearing loss that begins in childhood and worsens with age."
    explanation: >-
      A childhood-onset progressive course in a family carrying a splice allele at the same
      donor site as the congenital family's, which is the observation that makes the
      allele-driven explanation hard to sustain on its own.
  - reference: PMID:31432506
    reference_title: "Novel variant p.E269K confirms causative role of PLS1 mutations in autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Here, we present another PLS1 missense variant, c.805G > A (p.E269K), in a Turkish family with autosomal dominant non-syndromic HL confirming the causative role of PLS1 mutations in HL."
    explanation: >-
      The missense family whose postlingual diagnosis is the third point in the onset range.
      Indirect because the abstract establishes the family and the allele without stating
      the age of onset, which is reported in the paper's body.

name: Hearing Loss Autosomal Dominant 76
category: Mendelian
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- DFNA76
- deafness, autosomal dominant 76
- PLS1-related autosomal dominant nonsyndromic hearing loss
- plastin 1 related hearing loss
- fimbrin-related nonsyndromic hearing loss
description: >-
  DFNA76 is autosomal dominant nonsyndromic sensorineural hearing loss caused by
  heterozygous variants in PLS1, which encodes plastin 1 (fimbrin) - one of the three
  actin cross-linkers that build the stereocilium's actin core, and by mass the most
  abundant of them in vestibular bundles. The mechanism is bundle architecture, not
  transduction machinery and not synaptic function.

  Plastin 1 is not needed to build a stereocilium. It is needed to keep one. Knockout mice
  develop normal hair bundles and then lose them: inner hair cell stereocilia narrow and
  shorten in young adults, outer hair cells degenerate later, and hearing declines
  moderately and progressively across all frequencies without early hair cell death. What
  plastin 1 contributes is width. It biases the actin filaments away from tight hexagonal
  packing towards a disordered liquid packing, and it is that looser arrangement that lets a
  stereocilium grow to full diameter.

  The gap between that mouse and the human disease is the central problem of this entry, and
  it is not the usual species caveat. The dose question is partly open rather than untouched:
  Pls1 *heterozygous* nulls shift with age against themselves, hinting at a late and mild
  deterioration, but they never reach a significant deficit against wild-type controls and
  they serve as the paper's normal genotype on every structural and transduction measure. So
  whether one working copy suffices is unsettled in mouse, and whether the human alleles
  behave like a missing copy at all is untested. Every reported human allele is a missense
  change in an actin-binding domain or a splice variant producing an in-frame internal
  deletion - not a truncation, not a whole-gene deletion - so a protein is present in every
  patient. When the two were compared directly in zebrafish,
  they behaved oppositely: dye uptake through the mechanotransduction channel was reduced by
  the mutant protein and increased in the knockout, and neither loss of plastin 1 nor
  re-expression of wild-type protein reproduced the mutant's defect. The authors conclude a
  dominant-negative effect with partial loss of function, and are careful to say that they
  did not co-express wild-type and mutant protein, so the dominant-negative step is inferred
  from the divergence rather than demonstrated.

  Clinically the picture is heterogeneous across a handful of families and should not be
  compressed into one sentence. The Chinese family carrying the exon-skipping allele has
  progressive, unilateral or bilateral, moderate-to-severe high-frequency loss beginning in
  childhood; the Turkish family with p.Glu269Lys had symmetric, moderate, postlingually
  diagnosed progressive loss; a second Chinese family with a nearby splice variant presented
  with congenital loss that failed newborn screening in the proband and in her mother. Onset
  therefore spans congenital to adult, and the only defensible summary is that the loss is
  sensorineural, predominantly high-frequency, and usually progressive once it starts.

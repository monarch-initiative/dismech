    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present another PLS1 missense variant, c.805G > A (p.E269K), in a Turkish family with autosomal dominant non-syndromic HL confirming the causative role of PLS1 mutations in HL."
    explanation: >-
      Independent recurrence of the same missense allele in an unrelated population, which
      is stronger gene-disease evidence than three private variants would be.
  - reference: PMID:36537221
    reference_title: "A novel PLS1 c.981+1G>A variant causes autosomal-dominant hereditary hearing loss in a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel variant, PLS1 c.981+1G>A, in a large Chinese family with hearing loss and showed that the variant is responsible for the occurrence of hearing loss by inducing exon 8 skipping."
    explanation: >-
      The first splice allele, and the minigene result establishing that it removes an
      internal segment rather than truncating the protein.
  - reference: PMID:41822198
    reference_title: "Identification of a novel PLS1 heterozygous variant causing autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel variant was identified, namely plastin-1 (PLS1) c.981+5G>A. Functional analysis by reverse transcription PCR revealed that this variant induces exon skipping, establishing its pathogenic mechanism."
    explanation: >-
      The second allele at the same donor site, from an independent family. This is the
      report that numbers the skipped exon 9 where the first numbers it 8.
- name: Impaired Actin Cross-Linking by Plastin 1
  description: >-
    Plastin 1 has two tandem actin-binding domains built from paired calponin-homology
    folds. The second has the higher affinity for actin and the first holds it under
    autoinhibitory restraint, releasing it only once the first domain has engaged a bundle.
    Removing the segment encoded at the c.981 donor exon breaks the intramolecular contact
    between the two domains, and the mutant protein then binds actin bundles in an abnormal
    pattern and disturbs cytoskeletal organisation rather than simply binding less. The four
    missense alleles are predicted, by modelling, to destabilise the first domain and weaken
    F-actin binding; none has been assayed biochemically.

pathophysiology:
- name: CSGALNACT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic CSGALNACT1 variants remove or reduce CSGalNAcT-1 activity. The
    three missense alleles tested (p.Pro384Arg, p.Asp432Tyr, p.Asn264Ser)
    each show reduced N-acetylgalactosaminyltransferase activity in vitro; the
    frameshift and start-codon-deleting alleles are presumed null. CSGalNAcT-1
    transfers the first GalNAc residue to the glucuronic acid of the
    GlcA-Gal-Gal-Xyl linker tetrasaccharide, the step that commits a
    proteoglycan linker to chondroitin sulfate rather than heparan sulfate.
  genes:
  - preferred_term: CSGALNACT1
    term:
      id: hgnc:24290
      label: CSGALNACT1
  molecular_functions:
  - preferred_term: chondroitin sulfate chain-initiating GalNAc-transferase activity
    term:
      id: GO:0047237
      label: glucuronylgalactosylproteoglycan 4-beta-N-acetylgalactosaminyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27599773
    reference_title: "Chondroitin Sulfate N-acetylgalactosaminyltransferase-1 (CSGalNAcT-1) Deficiency Results in a Mild Skeletal Dysplasia and Joint Laxity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical studies revealed a reduced GalNAc-transferase activity of the
      Arg-384 mutant protein
    explanation: Enzyme assay of the first patient's missense allele shows reduced activity.
  - reference: PMID:31705726
    reference_title: "CSGALNACT1-congenital disorder of glycosylation: A mild skeletal dysplasia with advanced bone age."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical studies demonstrated significantly reduced CSGalNAcT-1
      activity of the novel missense variants
    explanation: Enzyme assays of two further missense alleles show reduced activity.
  - reference: PMID:27599773
    reference_title: "Chondroitin Sulfate N-acetylgalactosaminyltransferase-1 (CSGalNAcT-1) Deficiency Results in a Mild Skeletal Dysplasia and Joint Laxity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      which initiates chondroitin sulfate (CS) chain biosynthesis on the
      so-called GAG-protein linker region tetrasaccharide
    explanation: States the enzyme's role as the CS chain-initiating transferase on the linker.
  downstream:
  - target: Reduced Chondroitin and Dermatan Sulfate Chain Initiation
    causal_link_type: DIRECT
    description: >-
      Loss of the chain-initiating activity reduces the number of CS/DS chains

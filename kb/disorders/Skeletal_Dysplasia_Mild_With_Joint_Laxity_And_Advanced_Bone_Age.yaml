diagnosis:
- name: Exome sequencing
  description: >-
    All four probands were diagnosed by exome sequencing (trio exome in the
    2020 report). Two of the six published alleles are multi-exon intragenic
    deletions, so a copy-number-aware analysis or a deletion assay is needed
    when only one sequence variant is found.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:31705726
    reference_title: "CSGALNACT1-congenital disorder of glycosylation: A mild skeletal dysplasia with advanced bone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in whom trio-exome sequencing identified novel biallelic CSGALNACT1
      variants
    explanation: Diagnostic method in the two 2020 probands.
  - reference: PMID:31325655
    reference_title: "Biallelic CSGALNACT1-mutations cause a mild skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed a biallelic loss of function mutation in
      CSGALNACT1
    explanation: Diagnostic method in the 2019 proband.
- name: Neonatal skeletal radiographs
  description: >-
    Advanced carpotarsal bone age and a monkey wrench femoral neck are the
    radiographic clues, and both fade during early childhood, so neonatal or
    infant films are the most informative. The 2020 authors recommend testing
    for proteoglycan biosynthesis defects when these signs accompany joint
    laxity or neurodevelopmental delay.
  diagnosis_term:
    preferred_term: skeletal survey
    term:
      id: NCIT:C38092
      label: Skeletal Survey X-Ray
  evidence:
  - reference: PMID:31705726
    reference_title: "CSGALNACT1-congenital disorder of glycosylation: A mild skeletal dysplasia with advanced bone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testing for PG biosynthesis defects is recommended in patients with
      skeletal dysplasia and advanced bone age or monkey wrench appearance of
      the femur, especially if further symptoms of PG biosynthesis defects are
      present such as joint laxity, or neurodevelopmental delay.
    explanation: The source authors' diagnostic recommendation.
differential_diagnoses:
- name: Desbuquois dysplasia
  description: >-
    The first proband was ascertained with radiographs typical of Desbuquois
    dysplasia, and CSGALNACT1 was reported as adding to its genetic
    heterogeneity. None of the four probands has the characteristic hand
    anomalies of Desbuquois dysplasia type 1 (CANT1), and the CSGALNACT1
    phenotype is milder. Advanced bone age and the monkey wrench femur are
    shared across glycosaminoglycan-biosynthesis disorders (ACAN, XYLT1,
    CANT1, IMPAD1), so molecular testing is needed to separate them.
  evidence:
  - reference: PMID:27599773
    reference_title: "Chondroitin Sulfate N-acetylgalactosaminyltransferase-1 (CSGalNAcT-1) Deficiency Results in a Mild Skeletal Dysplasia and Joint Laxity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and adds to the genetic heterogeneity of DD
    explanation: The first report frames CSGALNACT1 deficiency within the Desbuquois differential.
  - reference: PMID:31705726
    reference_title: "CSGALNACT1-congenital disorder of glycosylation: A mild skeletal dysplasia with advanced bone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Advanced bone age and monkey wrench appearance of the femur are
      radiographic features which are rare in other skeletal dysplasias but
      common in GAG-biosynthesis disorders due to ACAN, XYLT1, CANT1, and IMPAD1
      variants.
    explanation: Names the overlapping GAG-biosynthesis disorders.
animal_models:
- name: Csgalnact1 knockout mouse (Sato 2011)
  species: Mouse
  genotype: Csgalnact1-/-
  publication: PMID:21148564
  description: >-
    Viable, fertile knockout mice with slight dwarfism, about half the normal
    cartilage CS with normal chain length, shorter and slightly disorganized
    growth-plate chondrocyte columns with reduced proliferative-zone matrix,
    and reduced aggrecan and link protein with increased aggrecan processing.
  evidence:
  - reference: PMID:21148564
    reference_title: "Chondroitin sulfate N-acetylgalactosaminyltransferase 1 is necessary for normal endochondral ossification and aggrecan metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Csgalnact1(-/-) mice were viable and fertile but exhibited slight
      dwarfism.
    explanation: Whole-animal growth phenotype of the knockout.
  modeled_mechanisms:
  - target: Disorganized Growth Plate Cartilage Matrix
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Growth-plate histology shows the column and matrix disorganization the
      entry attributes to CS-initiation deficiency.
    limitations: >-
      Patient cartilage has never been examined, so agreement with human
      growth-plate pathology is assumed rather than shown. The mouse does not
      reproduce the advanced bone age or the facial features reported in

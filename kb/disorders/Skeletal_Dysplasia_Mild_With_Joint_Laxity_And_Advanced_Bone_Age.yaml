name: CSGALNACT1-Congenital Disorder of Glycosylation
creation_date: "2026-11-10T14:11:58Z"
category: Mendelian
description: >-
  CSGALNACT1-congenital disorder of glycosylation (CSGALNACT1-CDG; OMIM 618870,
  catalogued by MONDO and OMIM as skeletal dysplasia, mild, with joint laxity
  and advanced bone age, SDJLABA) is an ultra-rare autosomal recessive skeletal
  dysplasia caused by biallelic loss-of-function variants in CSGALNACT1. The
  gene encodes chondroitin sulfate N-acetylgalactosaminyltransferase-1
  (CSGalNAcT-1, ChGn-1), the Golgi glycosyltransferase that initiates
  chondroitin sulfate chains by adding the first N-acetylgalactosamine to the
  glycosaminoglycan-protein linker tetrasaccharide of proteoglycan core
  proteins such as aggrecan. Four probands are reported (2017-2020). They
  present from the prenatal period (short femurs on ultrasound) with
  non-proportionate short stature, joint laxity, hyperlordosis, pes planus,
  midface hypoplasia and, radiographically, a mild spondyloepiphyseal
  dysplasia with short, plump long bones, flat acetabular roofs, a monkey
  wrench appearance of the femoral neck, and advanced carpotarsal bone age in
  infancy. The advanced bone age and femoral-neck changes fade during
  childhood, so the neonatal radiographs carry most of the diagnostic signal.
  The course is described as mild and non-progressive. Infantile hypotonia,
  mild motor and language delay, ADHD and congenital heart defects were seen
  in two of the four probands, one of whom also carries low-level mosaic
  trisomy 8, so whether these features belong to the disorder is unsettled.
  Mechanistically the entry follows the chain established in patients and in
  Csgalnact1 knockout mice. Reduced CS chain-initiation activity reduces the
  number of chondroitin/dermatan sulfate chains on proteoglycans. In cartilage
  this lowers CS and aggrecan in the growth plate and disorganizes
  proliferative-zone chondrocyte columns and type II collagen fibrils. The
  functionally redundant CSGalNAcT-2 is proposed to explain why the phenotype
  is mild. No disease-specific management has been published.
synonyms:
- skeletal dysplasia, mild, with joint laxity and advanced bone age
- SDJLABA
- CSGALNACT1-CDG
- CSGalNAcT-1 deficiency
- chondroitin sulfate N-acetylgalactosaminyltransferase-1 deficiency
- skeletal dysplasia with joint laxity and advanced bone age, CSGALNACT1-related
disease_term:
  preferred_term: CSGALNACT1-congenital disorder of glycosylation
  term:
    id: MONDO:0030029
    label: skeletal dysplasia, mild, with joint laxity and advanced bone age
parents:
- Congenital Disorder of Glycosylation
- Skeletal Dysplasia
notes: >-
  Naming: the MONDO label describes a phenotype (mild skeletal dysplasia with
  joint laxity and advanced bone age) that other glycosaminoglycan-biosynthesis
  disorders also produce; Mizumoto et al. 2020 note that advanced bone age is
  common in ACAN, XYLT1, CANT1 and IMPAD1 disorders. The entry therefore takes
  the gene-specific name CSGALNACT1-congenital disorder of glycosylation, which
  is the title term of PMID:31705726 and the term the ClinGen Congenital
  Disorders of Glycosylation GCEP record cites; the MONDO label is kept as a
  synonym. No GeneReviews chapter covers CSGALNACT1 in the committed Bookshelf
  index. Only four probands are published, so no phenotype frequency below is
  a population estimate; the frequency fields are omitted and per-proband
  counts are given in descriptions instead. One proband (P3 of PMID:31705726)
  carries 3.5% mosaic trisomy 8 with paternal isodisomy of chromosome 8, and the
  source authors attribute several of her features (limited joint mobility,
  corpus callosum agenesis, camptodactyly) to that second diagnosis; those
  features are not curated here.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic CSGALNACT1 variants are required: compound heterozygosity for a
    missense variant with an intragenic deletion (two probands) or homozygosity
    for a frameshift or missense variant (two probands, one from a
    consanguineous Turkish family). Heterozygous parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31705726
    reference_title: "CSGALNACT1-congenital disorder of glycosylation: A mild skeletal dysplasia with advanced bone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygosity for c.1294G>T (p.Asp432Tyr) and the deletion of
      exon 4 that includes the start codon in one patient, and homozygosity for
      c.791A>G (p.Asn264Ser) in the other patient
    explanation: >-
      Two further probands carry biallelic variants, one compound heterozygous
      and one homozygous, consistent with recessive inheritance.
  - reference: PMID:31325655
    reference_title: "Biallelic CSGALNACT1-mutations cause a mild skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here identify a second case and the first juvenile patient with a
      homozygous frameshift variant in CSGALNACT1
    explanation: Homozygous loss-of-function genotype in an affected child.
  - reference: CGGV:assertion_1ba7e544-2e7d-4314-b011-74210faae113-2025-06-25T160000.000Z
    reference_title: "CSGALNACT1 / skeletal dysplasia, mild, with joint laxity and advanced bone age (Moderate)"
    supports: SUPPORT

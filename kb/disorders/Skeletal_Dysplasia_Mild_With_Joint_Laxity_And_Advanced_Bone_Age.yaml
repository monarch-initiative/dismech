- name: Reduced Chondroitin and Dermatan Sulfate Chain Initiation
  biological_scale: MOLECULAR
  description: >-
    Fewer chondroitin/dermatan sulfate chains are initiated on proteoglycan
    core proteins. In patient fibroblasts the number of CS/DS chains is
    reduced while total CS/DS disaccharide content is, unexpectedly,
    increased, and heparan sulfate is also altered, consistent with fewer but
    longer chains and with linker substrate shifting toward heparan sulfate.
    Csgalnact1-null mouse cartilage has about half the normal CS with normal
    chain length. A 2017 study found no difference in proteoglycan synthesis
    in the first patient's fibroblasts or in urinary GAG content, so the
    fibroblast chain-number finding depends on the assay used. The authors
    propose that the paralogue CSGalNAcT-2 compensates in part, which would
    explain the mild phenotype.
  biological_processes:

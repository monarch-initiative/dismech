    snippet: "CSGALNACT1 | HGNC:24290 | skeletal dysplasia, mild, with joint laxity and advanced bone age | MONDO:0030029 | AR | Moderate"
    explanation: ClinGen records the gene-disease relationship with autosomal recessive inheritance.

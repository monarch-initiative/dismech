  notes: >-
    CSGALNACT1 (8p21) encodes chondroitin sulfate
    N-acetylgalactosaminyltransferase 1. Reported alleles are missense
    (p.Pro384Arg, p.Asp432Tyr, p.Asn264Ser, each with reduced enzyme activity
    in vitro), a homozygous frameshift, a 55-kb deletion of exons 5-8, and an
    exon 4 deletion removing the start codon. ClinGen classifies the
    relationship as Moderate (AR), so `relationship_type: CAUSATIVE`, which
    the schema reserves for Definitive or Strong, overstates the external
    tier; it is kept because the KB has no causative-but-Moderate value and
    the tier is recorded explicitly below.

discussions:
- discussion_id: neurodevelopmental_feature_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are infantile hypotonia, mild language delay, ADHD and congenital heart
    defects part of CSGALNACT1-CDG, or coincidental in the two probands who
    have them?
  attaches_to:
  - phenotypes#Infantile hypotonia
  - phenotypes#Delayed speech and language development
  - phenotypes#Attention deficit hyperactivity disorder
  - phenotypes#Atrial septal defect
  - phenotypes#Ventricular septal defect
  - phenotypes#Patent ductus arteriosus
  rationale: >-
    These features occur only in P2 and P3 of PMID:31705726, and P3 also has
    mosaic trisomy 8 with paternal chromosome 8 isodisomy, which can cause
    several of them. The source authors say attribution is unclear. Mouse
    knockouts show altered perineuronal-net plasticity (PMID:28987564), which
    makes a neural contribution plausible but does not settle it. With four
    probands, more patients are the only route to an answer.
- discussion_id: advanced_bone_age_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of CS chain initiation accelerate carpotarsal ossification
    in infancy, and why does the advance resolve in childhood?
  attaches_to:
  - phenotypes#Advanced carpotarsal bone age
  rationale: >-
    Advanced bone age is the disorder's namesake and is shared with ACAN,
    XYLT1, CANT1 and IMPAD1 disorders, but the only mechanism offered is a
    hypothesis about defective aggrecan glycosylation (PMID:31705726), and the
    knockout mice described do not report bone age.

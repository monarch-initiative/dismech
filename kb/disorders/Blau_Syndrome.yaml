review_notes: >-
  This review treats familial Blau syndrome and sporadic early-onset sarcoidosis
  as one NOD2-associated disease spectrum; the two subtype records describe
  inheritance occurrence rather than distinct clinical entities. The causal
  pathograph no longer assumes that every pathogenic NOD2 variant produces
  universal constitutive NF-kappaB activation. It preserves both the
  IFN-gamma-primed ligand-independent model and the defective
  NOD2-RIPK2-IRF4-cross-regulation model as evidence-backed, unresolved
  branches. Evidence from a different NOD2-associated early-onset inflammatory
  bowel phenotype was removed from the Blau mechanism, and the prior L469F
  variant entry was removed because its cited snippet did not identify that
  allele. Glaucoma was added from direct registry evidence, while the many
  source-comparison phenotype candidates were not bulk imported without
  disease-specific exact evidence. Treatment statements are bounded to small
  cohorts, case-level observations, a systematic review, and ongoing studies;
  no standardized management guideline exists. ClinicalTrials.gov statuses
  were checked on 2026-07-23: NCT06660329 and NCT06688838 were enrolling by
  invitation. The broad CoRDS rare-disease registry was not modeled as a
  Blau-specific trial. GeneReviews coverage was rechecked on 2026-07-24: the
  repository-local GeneReviews detector and a title scan across all locally
  cached GeneReviews records found no chapter for Blau syndrome, early-onset
  sarcoidosis, or NOD2, and the official NCBI GTR Blau condition row exposes no
  GeneReviews link. No GeneReviews reference was therefore tagged or mined.
  For HP:0006530, `term.label` intentionally retains the canonical HPO label
  "Abnormal pulmonary interstitial morphology"; `preferred_term` uses HPO's
  exact synonym "Interstitial lung disease" to match the clinical wording in
  the cited cohort.

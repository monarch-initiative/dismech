has_subtypes:
- name: Familial Blau syndrome
  display_name: Familial Blau Syndrome
  description: >-
    Familial disease results from an inherited heterozygous pathogenic NOD2
    variant. It is not a separate clinical phenotype, and penetrance can vary
    for some alleles.
  evidence:
  - reference: PMID:41678017
    reference_title: "NOD2-Related Multisystem Inflammatory Disorders and Recent Advances."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Blau syndrome is an autosomal dominant disease primarily occurring in children and is caused by highly penetrant NOD2 variants"
    explanation: The review supports the usual autosomal dominant familial presentation.
  - reference: PMID:36192768
    reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We reported a novel C483W NOD2 mutation underlining BS with incomplete penetrance."
    explanation: A family with an asymptomatic variant-bearing parent shows that high penetrance is not universal.
- name: Sporadic Blau syndrome
  display_name: Early-Onset Sarcoidosis (Sporadic)
  description: >-
    Sporadic disease commonly reflects a de novo heterozygous NOD2 variant and
    is clinically indistinguishable from familial Blau syndrome. Early-onset
    sarcoidosis is the historical name for this presentation.
  evidence:
  - reference: PMID:17968944
    reference_title: "NOD2 gene-associated pediatric granulomatous arthritis: clinical diversity, novel and recurrent mutations, and evidence of clinical improvement with interleukin-1 blockade in a Spanish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 12 cases, 58.3% were sporadic, due to de novo mutations"
    explanation: Spanish cohort confirms majority of cases are sporadic with de novo NOD2 mutations.
  - reference: PMID:17009307
    reference_title: "Pediatric granulomatous arthritis: an international registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blau syndrome and its sporadic counterpart, early-onset sarcoidosis, share an identical phenotype featuring the classic triad of arthritis, dermatitis, and uveitis and are associated with mutations of CARD15 in 50-90% of cases"
    explanation: International registry confirms identical phenotype between familial and sporadic forms.
epidemiology:
- name: Rare pediatric autoinflammatory granulomatosis
  description: >-
    Blau syndrome is rare and usually begins in childhood. No robust
    population-based prevalence estimate is established in the cited cohorts.
  evidence:
  - reference: PMID:40456554
    reference_title: "Blau Syndrome (Juvenile Systemic Granulomatosis): State-Of-The-Art Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Blau syndrome (BlauS) is a rare pediatric autoinflammatory disorder due to NOD2 gain-of-function pathogenic variants characterized by a triad of granulomatous dermatitis, arthritis, and uveitis, which can progress to systemic complications if untreated."
    explanation: The review characterizes the disorder as rare and pediatric without supplying a population rate.
progression:
- phase: Early cutaneous and articular disease
  notes: >-
    Dermatitis and joint disease commonly emerge in infancy or early childhood,
    often before ocular disease.
  evidence:
  - reference: PMID:40456554
    reference_title: "Blau Syndrome (Juvenile Systemic Granulomatosis): State-Of-The-Art Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Skin and joint findings typically emerge by age 2 years, with ocular involvement appearing around age 4 years."
    explanation: The review describes the usual temporal sequence of the classic triad.
- phase: Chronic ocular disease
  notes: >-
    Uveitis can evolve into chronic panuveitis with progressive visual loss and
    cataract, glaucoma, or retinal complications despite systemic treatment.
  evidence:
  - reference: PMID:38180755
    reference_title: "Long-Term Visual Outcome of Patients with Blau Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with documented uveitis lasting 10 years or more, all of them developed panuveitis."
    explanation: Longitudinal follow-up documents progression of persistent ocular disease to panuveitis.
- phase: Long-term multisystem morbidity
  notes: >-
    Delayed recognition and incompletely controlled inflammation can lead to
    joint deformity, visual morbidity, and variable systemic organ involvement.
  evidence:
  - reference: PMID:41673771
    reference_title: "Clinical features, treatment strategies, and long-term outcomes of Blau syndrome: a 10-year experience from a Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The substantial diagnostic delay (median: 19 years, range: 7–29 years, IQR: 18.5–21 years) likely contributed to the high prevalence of clinical manifestations, including arthritis (13,100%), ocular involvement (12, 92.3%), joint deformity (10, 76.9%), and the full classical triad (9, 69.2%)."
    explanation: The longitudinal cohort links prolonged diagnostic delay with substantial ocular and articular morbidity.
pathophysiology:
- name: Pathogenic NOD2 NACHT-Domain Variants
  description: >-
    Heterozygous pathogenic NOD2 variants, often clustered in the central
    nucleotide-binding/NACHT domain, are the primary molecular lesion. Their
    clinical classification as gain-of-function alleles does not by itself
    resolve the context-dependent signaling behavior observed in different
    experimental systems.
  gene:

discussions:
- discussion_id: controversy_blau_nod2_signaling_model
  prompt: >-
    How can IFN-gamma-primed ligand-independent NF-kappaB activation be
    reconciled with loss of canonical NOD2-RIPK2-IRF4 cross-regulation in Blau
    syndrome?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#IFN-γ-Primed Mutant NOD2 Inflammatory Signaling
  - pathophysiology#Defective NOD2-RIPK2-IRF4 Cross-Regulation
  rationale: >-
    Both models use disease-relevant variants but differ in cell system,
    stimulation context, and measured pathway output. The entry therefore
    models them as potentially complementary branches rather than collapsing
    genetic gain of function into universal constitutive NF-kappaB activation.
  evidence:
  - reference: PMID:28587749
    reference_title: "Pluripotent stem cell models of Blau syndrome reveal an IFN-γ-dependent inflammatory response in macrophages."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IFN-γ treatment induced ligand-independent nuclear factor κB activation and proinflammatory cytokine production."
    explanation: Isogenic and patient-derived macrophages support a priming-dependent activation model.
  - reference: PMID:36189261
    reference_title: "Blau syndrome NOD2 mutations result in loss of NOD2 cross-regulatory function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NOD2 plasmids expressing various Blau mutations in HEK293 cells result in reduced NOD2 activation of RIPK2 and correspondingly reduced NOD2 activation of NF-κB."
    explanation: HEK293 cell experiments support reduced canonical NOD2-RIPK2 and NF-kappaB signaling.
- discussion_id: gap_blau_comparative_treatment_efficacy
  prompt: >-
    Which steroid-sparing or biologic regimen best prevents irreversible ocular
    and articular damage in Blau syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Methotrexate Steroid-Sparing Therapy
  - treatment#Anti-TNF Biologic Therapy
  - treatment#Salvage IL-1 Receptor Antagonist Therapy
  - treatment#Emerging Tofacitinib Therapy
  rationale: >-
    Published treatment evidence is dominated by case reports and small
    observational cohorts. Even the uveitis meta-analysis could not identify a
    preferred systemic treatment, and long-term TNF-inhibitor responses can be
    lost.
  evidence:
  - reference: PMID:40147219
    reference_title: "Treatment of uveitis in Blau syndrome: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data show that there is not enough evidence to establish a preferred treatment for managing uveitis in BS."
    explanation: The systematic review explicitly identifies comparative uncertainty.
  - reference: PMID:41673771
    reference_title: "Clinical features, treatment strategies, and long-term outcomes of Blau syndrome: a 10-year experience from a Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "relapse or secondary loss of efficacy occurred in 6 (46.2%) patients, necessitating treatment adjustments."
    explanation: Long-term observational data demonstrate that initial biologic response may not persist.
- discussion_id: interpretation_blau_nod2_variant_penetrance
  prompt: >-
    How should a rare NOD2 variant be interpreted when the phenotype or family
    segregation is incomplete?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#NOD2
  rationale: >-
    Although the gene-disease relationship is definitive and many hotspot
    variants are highly penetrant, incomplete penetrance and variants of
    uncertain significance occur. Classification must integrate phenotype,
    segregation, population data, and functional evidence.
  evidence:
  - reference: PMID:36192768
    reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel C483W NOD2 mutation was identify in the proband and her asymptomatic father."
    explanation: The family directly demonstrates incomplete penetrance.
  - reference: PMID:38927735
    reference_title: "Blau Syndrome: Challenging Molecular Genetic Diagnostics of Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants of unknown significance pose a significant challenge regarding their contribution to etiopathogenesis of autoinflammatory diseases."
    explanation: The case series cautions against equating an uncertain variant with a molecular diagnosis.

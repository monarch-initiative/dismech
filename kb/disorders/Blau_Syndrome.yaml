    snippet: "Previously unknown dysplastic bony changes were found in two-thirds of patients"
    explanation: Multicentre study discovers bone dysplastic changes in 66% of patients, a novel finding with potential diagnostic value.
histopathology:
- name: Noncaseating Epithelioid Granulomas
  description: >-
    Skin or synovial tissue can show noncaseating granulomas composed of
    epithelioid histiocytes and multinucleated giant cells. This finding
    supports Blau syndrome in the appropriate early-onset multisystem context
    but is not disease-specific.
  evidence:
  - reference: PMID:17968944
    reference_title: "NOD2 gene-associated pediatric granulomatous arthritis: clinical diversity, novel and recurrent mutations, and evidence of clinical improvement with interleukin-1 blockade in a Spanish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "noncaseating granulomata as their pathologic hallmark"
    explanation: The cohort identifies noncaseating granulomas as the defining histopathologic feature.
  - reference: PMID:36192768
    reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her skin biopsy revealed noncaseating granulomas inflammation with multinucleated giant cells."
    explanation: A genetically confirmed case documents noncaseating granulomas with multinucleated giant cells.
diagnosis:
- name: Early-onset granulomatous triad and multisystem assessment
  description: >-
    Suspect Blau syndrome in a child with papular granulomatous dermatitis,
    boggy arthritis or tenosynovitis, and uveitis, even when the full triad has
    not yet appeared. Assess for vascular, pulmonary, renal, hepatic,
    neurologic, and other systemic manifestations.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:40456554
    reference_title: "Blau Syndrome (Juvenile Systemic Granulomatosis): State-Of-The-Art Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Blau syndrome (BlauS) is a rare pediatric autoinflammatory disorder due to NOD2 gain-of-function pathogenic variants characterized by a triad of granulomatous dermatitis, arthritis, and uveitis, which can progress to systemic complications if untreated."
    explanation: The review defines the clinical pattern that should prompt diagnostic evaluation.
  - reference: PMID:19479837
    reference_title: "NOD2-associated pediatric granulomatous arthritis, an expanding phenotype: study of an international registry and a national cohort in Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NOD2-associated PGA can be a multisystem disorder with significant visceral involvement."
    explanation: The combined cohorts support evaluation beyond the classic triad.
- name: NOD2 molecular genetic testing
  description: >-
    Sequence NOD2, with an autoinflammatory gene panel or broader testing when
    appropriate, to identify a heterozygous pathogenic or likely pathogenic
    variant. Variant interpretation must integrate phenotype, segregation,
    penetrance, and functional data rather than treating every NOD2 variant as
    diagnostic.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:37941393
    reference_title: "Molecular diagnostic yield for Blau syndrome in previously diagnosed juvenile idiopathic arthritis with uveitis or cutaneous lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted NOD2 sequencing established the molecular diagnosis of Blau syndrome in nearly one-fifth of these cases and provided clinically relevant information for patient-care decisions."
    explanation: Targeted sequencing reclassified a substantial selected subgroup previously diagnosed with JIA.
  - reference: PMID:38927735
    reference_title: "Blau Syndrome: Challenging Molecular Genetic Diagnostics of Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probands from families 1 and 2 carried pathogenic variants in NOD2 (NM_022162.3): c.1001G>A p.(Arg334Gln) and c.1000C>T p.(Arg334Trp), respectively."
    explanation: The case series illustrates molecular confirmation and the need to distinguish pathogenic variants from variants of uncertain significance.
- name: Skin biopsy for granulomatous inflammation
  description: >-
    Biopsy of an active skin lesion can demonstrate noncaseating granulomas and
    multinucleated giant cells. Histology is supportive rather than sufficient
    because other inflammatory, infectious, and immunodeficiency disorders can
    also be granulomatous.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:36192768
    reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her skin biopsy revealed noncaseating granulomas inflammation with multinucleated giant cells."
    explanation: The genetically confirmed case demonstrates the supportive biopsy pattern.
- name: Comprehensive ophthalmic examination
  description: >-
    Slit-lamp and posterior-segment assessment are needed at diagnosis because
    ocular disease can be bilateral and may progress despite apparently
    controlled systemic inflammation.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:25416713
    reference_title: "Blau syndrome: cross-sectional data from a multicentre study of clinical, radiological and functional outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular disease was documented in 25 of 31 patients, with vitreous inflammation in 64% and moderate-severe visual loss in 33%"
    explanation: The high ocular burden supports comprehensive eye evaluation at diagnosis.
differential_diagnoses:
- name: Juvenile Idiopathic Arthritis
  disease_term:
    preferred_term: juvenile idiopathic arthritis
    term:
      id: MONDO:0011429
      label: juvenile idiopathic arthritis
  description: >-
    Juvenile idiopathic arthritis can combine childhood arthritis and uveitis,
    but papular granulomatous dermatitis, boggy tenosynovitis, noncaseating
    granulomas, or a familial pattern should prompt reassessment for Blau
    syndrome.
  distinguishing_features:
  - Heterozygous pathogenic NOD2 variant supports Blau syndrome
  - Noncaseating granulomatous dermatitis or synovitis supports Blau syndrome
  - The complete dermatitis-arthritis-uveitis triad is more characteristic of Blau syndrome
  evidence:
  - reference: PMID:37941393
    reference_title: "Molecular diagnostic yield for Blau syndrome in previously diagnosed juvenile idiopathic arthritis with uveitis or cutaneous lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing was conducted on NOD2 gene to detect diagnostic variants classified as pathogenic or likely pathogenic for Blau syndrome."
    explanation: The diagnostic-yield study directly addresses selected patients initially classified as JIA.
genetic:
- name: NOD2
  association: Heterozygous pathogenic variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NOD2
    term:
      id: hgnc:5331
      label: NOD2
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:17968944
      reference_title: "NOD2 gene-associated pediatric granulomatous arthritis: clinical diversity, novel and recurrent mutations, and evidence of clinical improvement with interleukin-1 blockade in a Spanish cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NOD2 analysis revealed 1 heterozygous mutation in each patient, and familial studies confirmed its full penetrance"
      explanation: Familial segregation supports autosomal dominant inheritance.
    - reference: PMID:36192768
      reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel C483W NOD2 mutation was identify in the proband and her asymptomatic father."
      explanation: The asymptomatic variant-bearing father demonstrates that penetrance can be incomplete.
  features: >-
    Blau syndrome is caused by heterozygous pathogenic NOD2 (CARD15) variants,
    usually missense variants in or near the central nucleotide-binding/NACHT
    domain. p.Arg334Trp and p.Arg334Gln are recurrent hotspots. Variants may be
    inherited or de novo, and penetrance and phenotype can vary; a NOD2 variant
    of uncertain significance is not sufficient for diagnosis.
  variants:
  - name: p.Arg334Trp (R334W)
    description: >-
      Recurrent pathogenic missense variant c.1000C>T in the NOD/NACHT domain.
      It was the most frequent single variant in the international prospective
      cohort.
    evidence:
    - reference: PMID:25416713
      reference_title: "Blau syndrome: cross-sectional data from a multicentre study of clinical, radiological and functional outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 31 patients, 11 carried the p.R334W NOD2 mutation, 9 the p.R334Q and 11 various other NOD2 missense mutations"
      explanation: Multicentre cohort confirms p.R334W is the single most common Blau syndrome mutation.
  - name: p.Arg334Gln (R334Q)
    description: >-
      Recurrent pathogenic missense variant c.1001G>A affecting the same
      NACHT-domain residue as p.Arg334Trp.
    evidence:
    - reference: PMID:25416713
      reference_title: "Blau syndrome: cross-sectional data from a multicentre study of clinical, radiological and functional outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 31 patients, 11 carried the p.R334W NOD2 mutation, 9 the p.R334Q and 11 various other NOD2 missense mutations"
      explanation: Multicentre cohort documents p.R334Q in 9 of 31 Blau patients alongside R334W.
  evidence:
  - reference: PMID:11528384
    reference_title: "CARD15 mutations in Blau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified three missense mutations in the nucleotide-binding domain (NBD) of CARD15/NOD2 in four French and German families with Blau syndrome"
    explanation: Landmark paper identifying CARD15/NOD2 as the causative gene with mutations in the NBD.
  - reference: PMID:25416713
    reference_title: "Blau syndrome: cross-sectional data from a multicentre study of clinical, radiological and functional outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 31 patients, 11 carried the p.R334W NOD2 mutation, 9 the p.R334Q and 11 various other NOD2 missense mutations; 20 patients were sporadic and 11 from five BS pedigrees"
    explanation: Multicentre study shows R334W and R334Q are the most common mutations.
  - reference: PMID:17968944
    reference_title: "NOD2 gene-associated pediatric granulomatous arthritis: clinical diversity, novel and recurrent mutations, and evidence of clinical improvement with interleukin-1 blockade in a Spanish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NOD2 analysis revealed 1 heterozygous mutation in each patient, and familial studies confirmed its full penetrance"
    explanation: Confirms heterozygous mutations with full penetrance.
  - reference: PMID:37604356
    reference_title: "Distinct NOD2 mutations reported in three families with Blau syndrome (BS) from a single center in India - Case series and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first family had three affected members where the mother and her two children had skin changes, polyarthritis and a pathogenic mutation in NOD2 gene (exon 4, c.1000C > T, p.Arg334Trp) suggesting BS"
    explanation: Indian case series confirms R334W (Arg334Trp) in a familial Blau syndrome pedigree with classic triad.
  - reference: CGGV:assertion_1fd650d7-6a84-4b33-b86e-d34cab5b7d57-2020-10-07T171807.983Z
    reference_title: "NOD2 / Blau syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NOD2 | HGNC:5331 | Blau syndrome | MONDO:0008523 | AD | Definitive"
    explanation: ClinGen classifies the NOD2-Blau syndrome gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:36192768
    reference_title: "Incomplete penetrance of NOD2 C483W mutation underlining Blau syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We reported a novel C483W NOD2 mutation underlining BS with incomplete penetrance."
    explanation: This family broadens the allelic spectrum and limits claims of universal penetrance.
treatments:
- name: Regular Ophthalmic Monitoring
  description: >-
    Repeated slit-lamp and posterior-segment examinations are essential because
    ocular inflammation can become chronic panuveitis and systemic inflammatory
    markers may not reflect intraocular activity.
  action_category: MONITORING
  treatment_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:38180755
    reference_title: "Long-Term Visual Outcome of Patients with Blau Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uveitis associated with Blau syndrome commonly leads to severe, chronic panuveitis, requiring long-term systemic immunosuppression."
    explanation: Longitudinal ocular outcomes justify sustained specialist monitoring.
- name: Systemic Corticosteroids as Bridging Therapy
  description: >-
    Systemic glucocorticoids can suppress acute inflammatory activity while a
    steroid-sparing regimen is established. Long-term monotherapy is generally
    inadequate and exposes children to cumulative toxicity.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  evidence:
  - reference: PMID:37735224
    reference_title: "Management of Blau syndrome: review and proposal of a treatment algorithm."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "High doses of corticosteroids are considered as a bridging therapy in Blau syndrome."
    explanation: The proposed management algorithm limits high-dose corticosteroids to a bridging role.
  - reference: PMID:40350497
    reference_title: "Long-term prognosis of 47 pediatric patients with Blau syndrome in China."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 95.7% patients (45 patients) were treated with combination of prednisolone and methotrexate"
    explanation: The cohort documents frequent combined use but does not isolate corticosteroid efficacy.
- name: Methotrexate Steroid-Sparing Therapy
  description: >-
    Methotrexate is commonly used for articular or ocular disease as a
    steroid-sparing conventional DMARD. Evidence is observational, and pooled
    uveitis data do not establish it as a preferred agent.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_phenotypes:
  - preferred_term: Polyarticular arthritis
    term:
      id: HP:0005764
      label: Polyarticular arthritis
  - preferred_term: Panuveitis
    term:
      id: HP:0012121
      label: Panuveitis
  evidence:
  - reference: PMID:37735224
    reference_title: "Management of Blau syndrome: review and proposal of a treatment algorithm."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Methotrexate should be initiated if the patient has articular or ocular involvement."
    explanation: The review's proposed algorithm places methotrexate after bridging corticosteroids.
  - reference: PMID:40147219

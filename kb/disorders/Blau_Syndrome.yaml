    explanation: International registry documents cataracts in half of patients with ocular disease.
- name: Glaucoma
  category: Ophthalmologic
  description: >-
    Secondary glaucoma can complicate chronic bilateral uveitis and contributes
    to irreversible visual morbidity.
  frequency: OCCASIONAL
  phenotype_term:

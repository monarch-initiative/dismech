  - target: IFN-γ-Primed Mutant NOD2 Inflammatory Signaling
    description: >-
      IFN-gamma increases NOD2 abundance and permits ligand-independent
      inflammatory signaling in disease-specific macrophage models.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - IFN-gamma-dependent NOD2 upregulation in mutant macrophages
    evidence:
    - reference: PMID:28587749
      reference_title: "Pluripotent stem cell models of Blau syndrome reveal an IFN-γ-dependent inflammatory response in macrophages."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IFN-γ acted as a priming signal through upregulation of NOD2. In iPSC-derived macrophages with mutant NOD2, IFN-γ treatment induced ligand-independent nuclear factor κB activation and proinflammatory cytokine production."
      explanation: Isogenic and patient-derived macrophage models establish the IFN-gamma-dependent branch.
  - target: Defective NOD2-RIPK2-IRF4 Cross-Regulation
    description: >-
      A second mechanistic model links Blau variants to reduced canonical
      NOD2-RIPK2 signaling and loss of IRF4-mediated restraint on parallel
      innate responses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36189261
      reference_title: "Blau syndrome NOD2 mutations result in loss of NOD2 cross-regulatory function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The main finding was that Blau NOD2 mutations precipitate a loss of canonical NOD2 signaling via RIPK2 and that this loss has two consequences: first, it results in defective NOD2 ligand (MDP)-mediated NF-κB activation and second, it disrupts NOD2-mediated cross-regulation whereby NOD2 downregulates concomitant innate (TLR) responses."
      explanation: Cell experiments support loss of canonical signaling and cross-regulation.

description: >-
  Blau syndrome is a rare, usually childhood-onset, autosomal dominant
  autoinflammatory granulomatosis caused by heterozygous pathogenic variants in
  NOD2. Familial Blau syndrome and the sporadic disorder historically called
  early-onset sarcoidosis are the same disease spectrum. Granulomatous
  dermatitis, arthritis or tenosynovitis, and uveitis form the classic triad,
  but vascular, pulmonary, renal, hepatic, neurologic, and other systemic
  involvement can occur. Disease-associated NOD2 variants alter innate immune
  signaling, although the relative contributions of ligand-independent
  signaling and defective cross-regulation remain unresolved.

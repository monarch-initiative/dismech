differential_diagnoses:
- name: Paraganglioma
  description: >-
    Paraganglioma can share nested, highly vascular morphology with ASPS.
  distinguishing_features:
  - Neuroendocrine-marker expression, including NSE, CgA, and synaptophysin, favors paraganglioma over ASPS.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      positivity for neuroendocrine markers such as NSE, CgA and Syn but not
      MyoD1, Des or others
    explanation: >-
      The pathology review provides the neuroendocrine immunophenotypic
      distinction from ASPS.
- name: Alveolar Rhabdomyosarcoma
  description: >-
    Alveolar rhabdomyosarcoma can mimic pseudoalveolar architecture, especially
    in children and adolescents.
  distinguishing_features:
  - Nuclear MyoD1 and other myogenic-marker expression favor alveolar rhabdomyosarcoma over ASPS.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical findings for alveolar rhabdomyosarcoma include the
      following: tumour cells expressing myogenic markers such as Des and
      MyoD1, with MyoD1 observable in the nucleus
    explanation: >-
      Nuclear myogenic-marker expression distinguishes alveolar
      rhabdomyosarcoma from ASPS.
- name: Metastatic Clear Cell Renal Cell Carcinoma
  description: >-
    Metastatic clear cell renal cell carcinoma, including TFE3-rearranged renal
    carcinoma, may resemble ASPS morphologically and immunohistochemically.
  distinguishing_features:
  - A renal primary and expression of epithelial, CD10, and RCC markers favor metastatic renal cell carcinoma.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      renal cell carcinomas with the ASPSCR1::TFE3 fusion also express CK and
      EMA epithelial markers and are positive for CD10 and RCC.
    explanation: >-
      The epithelial and renal-marker profile distinguishes renal carcinoma
      from ASPS.
- name: Perivascular Epithelioid Cell Tumor
  description: >-
    PEComa may have organoid perivascular growth and can itself harbor TFE3
    rearrangements.
  distinguishing_features:
  - A TFE3 rearrangement alone does not exclude PEComa; identification of a non-ASPS fusion partner favors PEComa.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have revealed the presence of TFE3 gene rearrangements in
      23% of PEComas, which involve the formation of gene fusions such as
      SFPQ/PSF::TFE3 and DVL2::TFE3.
    explanation: >-
      The pathology review supplies a clean, complete sentence showing that
      TFE3 rearrangement occurs in PEComa and identifies alternative partners.

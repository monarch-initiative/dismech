      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical symptoms mainly included painless enlarged masses in deep
        soft tissues.
      explanation: >-
        The clinicopathologic cohort supports the deep soft tissue mass as the
        clinical manifestation of proliferative ASPS outgrowth.
- name: Metastatic Progression
  biological_scale: ORGANISM
  description: >-
    Alveolar soft part sarcoma often follows an indolent primary course but can
    metastasize to the lungs, brain, bone, and other sites, sometimes years
    after initial diagnosis.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:35971085
    reference_title: "Alveolar soft part sarcoma: progress toward improvement in survival? A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The national study confirmed a unique feature of ASPS with frequent
      metastasis to the lung and brain but an indolent clinical course.
    explanation: >-
      Population registry data support the combination of indolent course and
      frequent lung/brain metastasis.
  - reference: PMID:40171452
    reference_title: "Real world outcomes in alveolar soft part sarcomas: experience with an ultra-rare sarcoma from a tertiary care centre in North India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alveolar soft part sarcoma (ASPS) is a rare, indolent soft tissue
      sarcoma, with a high predilection for systemic dissemination.
    explanation: >-
      A real-world clinical cohort supports the systemic dissemination
      tendency.
  downstream:
  - target: Pulmonary Metastases
    description: Hematogenous metastatic progression commonly seeds the lungs.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40171452
      reference_title: "Real world outcomes in alveolar soft part sarcomas: experience with an ultra-rare sarcoma from a tertiary care centre in North India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common site of primary was the extremities (73%), and the most
        common sites of metastasis included the lungs (82%) and bones (21%).
      explanation: >-
        The cohort identifies lung metastasis as the dominant metastatic
        manifestation of ASPS progression.
  - target: Brain Metastases
    description: Systemic dissemination can involve the central nervous system.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40171452
      reference_title: "Real world outcomes in alveolar soft part sarcomas: experience with an ultra-rare sarcoma from a tertiary care centre in North India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Brain metastasis was seen in 7 patients at baseline (25.9%).
      explanation: >-
        The cohort supports brain metastasis as a direct clinical manifestation
        of systemic ASPS dissemination.
  - target: Bone Metastases
    description: Systemic dissemination can involve skeletal sites.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40171452
      reference_title: "Real world outcomes in alveolar soft part sarcomas: experience with an ultra-rare sarcoma from a tertiary care centre in North India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common site of primary was the extremities (73%), and the most
        common sites of metastasis included the lungs (82%) and bones (21%).
      explanation: >-
        The cohort identifies bone metastasis as a recurrent skeletal
        manifestation of ASPS progression.
histopathology:
- name: Pseudoalveolar Organoid Architecture
  finding_term:
    preferred_term: pseudoalveolar organoid architecture
  diagnostic: true
  description: >-
    Tumors have nests or organoid groups of polygonal cells separated by
    delicate sinusoidal vasculature, producing the classic pseudoalveolar
    pattern.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumour cells within the nodules were arranged as organoid or
      glandular vesicle-like structures with abundant blood sinuses between
      vesicles
    explanation: >-
      The pathology cohort directly describes the characteristic nested,
      pseudoalveolar architecture and sinusoidal vasculature.
- name: PAS-Positive Diastase-Resistant Cytoplasmic Crystals
  finding_term:
    preferred_term: PAS-positive diastase-resistant cytoplasmic crystals
  diagnostic: true
  description: >-
    Periodic acid-Schiff-positive, diastase-resistant rod- or bar-shaped
    cytoplasmic crystals are characteristic and help distinguish ASPS from
    morphologic mimics, although they are not present in every tumor.
  evidence:
  - reference: PMID:38291475
    reference_title: "Alveolar soft part sarcoma: a clinicopathological and immunohistochemical analysis of 26 cases emphasizing risk factors and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumour cells in 20 patients were PAS positive and contained
      rod-shaped crystals in the cytoplasm
    explanation: >-
      PAS-positive rod-shaped crystals were observed in 20 of 26 tumors in the
      pathology cohort.

name: Alveolar Soft Part Sarcoma
creation_date: "2026-05-09T14:04:43Z"
category: Cancer
categories:
- Sarcoma
- Soft Tissue Sarcoma
- Rare Cancer
parents:
- soft tissue sarcoma
disease_term:
  preferred_term: alveolar soft part sarcoma
  term:
    id: MONDO:0011655
    label: alveolar soft part sarcoma
description: >-
  Alveolar soft part sarcoma is a rare translocation-driven soft tissue sarcoma
  that most often affects adolescents and young adults. It commonly arises as a
  deep soft tissue mass of the extremities and is characterized by an
  ASPSCR1-TFE3 fusion, strong angiogenic biology, and a tendency toward delayed
  pulmonary and brain metastases.
synonyms:
- ASPS
- alveolar soft-part sarcoma
- alveolar soft tissue sarcoma
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.01
  notes: >-
    Review-level epidemiology estimates approximately one new diagnosis per 10
    million people per year and 0.2-0.9% of all soft-tissue sarcomas. This is an
    incidence estimate, not a measured point prevalence.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10632598/fullTextXML
    reference_title: "Advances in treatment of alveolar soft part sarcoma: an updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASPS is an ultra-rare sarcoma with an incidence rate of only one diagnosis
      per 10 million population per year, accounting for 0.2–0.9% of all
      soft-tissue sarcomas
    explanation: >-
      The open-access review directly supplies the annual incidence and
      soft-tissue-sarcoma proportion; 1 per 10 million converts to 0.01 per
      100,000 per year.
pathophysiology:
- name: ASPSCR1-TFE3 Fusion Oncogene
  biological_scale: MOLECULAR
  description: >-
    A characteristic unbalanced der(17)t(X;17)(p11;q25) translocation fuses
    ASPSCR1 to TFE3, creating an aberrant transcription factor that redirects
    gene expression programs in tumor cells.
  genes:
  - preferred_term: ASPSCR1
    term:
      id: hgnc:13825
      label: ASPSCR1
  - preferred_term: TFE3
    term:
      id: hgnc:11752
      label: TFE3
  cell_types:
  - preferred_term: mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:37626447
    reference_title: "Advances in treatment of alveolar soft part sarcoma: an updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The neoplasm is characterized by a specific chromosomal translocation,
      der (17) t(X; 17)(p11.2;q25), that results in ASPSCR1-TFE3 gene fusion.
    explanation: >-
      The review abstract directly supports the recurrent translocation and
      ASPSCR1-TFE3 fusion as defining disease biology.
  - reference: PMID:38657118
    reference_title: "ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Alveolar soft part sarcoma (ASPS) is a rare mesenchymal malignancy driven
      by the ASPSCR1::TFE3 fusion.
    explanation: >-
      The mechanistic study abstract supports ASPSCR1::TFE3 as the oncogenic
      driver fusion.
  downstream:
  - target: Angiogenic Tumor Program
    description: Aberrant transcriptional activity promotes angiogenic tumor biology
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37029109
      reference_title: "ASPSCR1::TFE3 orchestrates the angiogenic program of alveolar soft part sarcoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the expression of ASPSCR1::TFE3, the fusion transcription factor
        causatively associated with ASPS, is dispensable for in vitro tumor
        maintenance; however, it is required for in vivo tumor development via
        angiogenesis.
      explanation: >-
        Genetic loss-of-function experiments directly connect the fusion to
        angiogenesis-dependent in-vivo tumor development.
  - target: Mitochondrial Biology Program
    description: ASPSCR1-TFE3 transcriptional programs include mitochondrial biology.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38657118
      reference_title: "ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The ASPSCR1::TFE3 fusion propels the growth of alveolar soft part
        sarcoma by activating transcriptional programs that regulate
        proliferation, angiogenesis, mitochondrial biogenesis, and
        differentiation
      explanation: >-
        The mechanistic study directly attributes the mitochondrial-biogenesis
        program to the fusion.
  - target: Cyclin D1-CDK4 Cell-Cycle Dependency
    description: ASPSCR1-TFE3 transcriptional programs drive cyclin D1/CDK4-dependent proliferation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38657118
      reference_title: "ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Among the effector programs driven by ASPSCR1::TFE3, cell proliferation
        was driven by high levels of cyclin D1 expression.
      explanation: >-
        The functional study directly links the fusion-driven program to cyclin
        D1-dependent proliferation.
- name: Angiogenic Tumor Program
  biological_scale: CELLULAR
  description: >-
    Alveolar soft part sarcoma is typically highly vascular, with expression of
    angiogenic programs that support tumor growth and provide the rationale for
    antiangiogenic systemic therapies.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:38657118
    reference_title: "ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      identifying the essential role of ASPSCR1::TFE3 in tumor cell viability
      by regulating core transcriptional programs involved in cell
      proliferation, angiogenesis, and mitochondrial biology.
    explanation: >-
      The mechanistic study directly links ASPSCR1::TFE3 to angiogenesis and
      cell-proliferation transcriptional programs.
  - reference: PMID:37029109
    reference_title: "ASPSCR1::TFE3 orchestrates the angiogenic program of alveolar soft part sarcoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ASPSCR1::TFE3 thus orchestrates higher ordered angiogenesis via modulating
      the SE activity.
    explanation: >-
      Epigenomic perturbation and in-vivo experiments establish a direct
      fusion-driven angiogenic program.
  - reference: PMID:37987424
    reference_title: "Imaging Features of Alveolar Soft Part Sarcoma: Single Institution Experience and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large peritumoral feeding vessels were systematically found and identified
      on ultrasonography (7/7), MRI (10/10), and CT (3/3).
    explanation: >-
      The imaging cohort supports the highly vascular tumor phenotype in
      patients.
  downstream:
  - target: Metastatic Progression
    description: Prominent angiogenic activity supports hematogenous metastatic progression.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - vascular-network construction and tumor-cell intravasation
    evidence:
    - reference: PMID:37029109
      reference_title: "ASPSCR1::TFE3 orchestrates the angiogenic program of alveolar soft part sarcoma."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        ASPS is characterized by a highly integrated vascular network, and its
        high metastatic potential indicates the importance of ASPS's prominent
        angiogenic activity.
      explanation: >-
        The mechanistic study supports angiogenesis as an important contributor
        to the tumor's metastatic phenotype, while the edge remains indirect.
- name: Mitochondrial Biology Program
  biological_scale: CELLULAR
  description: >-
    ASPSCR1-TFE3 regulates mitochondrial biology and mitochondrial biogenesis as

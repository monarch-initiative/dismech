  - reference: PMID:38657118
    reference_title: "ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

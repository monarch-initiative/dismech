datasets:
- accession: geo:GSE235739
  title: ASPSCR1::TFE3 Drives Alveolar Soft Part Sarcoma by Inducing Targetable Transcriptional Programs
  description: This SuperSeries is composed of the SubSeries listed below. Alveolar soft part sarcoma (ASPS) is a rare mesenchymal malignancy driven by the ASPSCR1::TFE3 fusion. A better understanding of the mechanisms by which this oncogenic transcriptional regulator drives cancer growth is needed to help identify potential therapeutic targets. Here, we characterized the transcriptional and chromatin landscapes of ASPS tumors and preclinical models, identifying the essential role of ASPSCR1::TFE3 in tumor cell viability by regulating core transcriptional programs involved in cell proliferation, angiogenesis, and mitochondrial biology.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MULTI_OMICS
  sample_count: 62
  publication: PMID:38657118
  notes: Identified by GEO DataSets index search for Alveolar Soft Part Sarcoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE186789
  title: ASPSCR1-TFE3 orchestrates the angiogenic program of alveolar soft part sarcoma I
  description: Alveolar soft part sarcoma (ASPS) is a rare soft part malignancy affecting adolescents and young adult. ASPS is characterized by its alveolar structure consisting of tumor cells and highly integrated vascular network, and its high metastatic potential indicates the importance of the prominent angiogenic activity of ASPS. Here we find that the expression of ASPSCR1-TFE3, the fusion transcription factor causatively associated with ASPS, is dispensable for in vitro tumor maintenance but required for in vivo tumor development via angiogenesis.
  data_type: MICROARRAY
  sample_count: 27
  publication: PMID:37029109
  notes: Identified by GEO DataSets index search for Alveolar Soft Part Sarcoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

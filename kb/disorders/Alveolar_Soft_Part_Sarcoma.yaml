progression:
- phase: Indolent primary growth with persistent metastatic risk
  age_range: Adolescence through adulthood
  notes: >-
    ASPS often progresses slowly, but localized disease retains a substantial
    long-term risk of distant spread. In a national registry cohort, 45% of
    localized cases later developed distant metastases, predominantly in lung.
  evidence:
  - reference: PMID:35971085
    reference_title: "Alveolar soft part sarcoma: progress toward improvement in survival? A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with localized ASPS, adjuvant chemotherapy or radiotherapy did
      not affect survival, and 13 patients (45%) developed distant metastases in
      the lung (n = 12, 92%) and brain (n = 2, 15%).
    explanation: >-
      The population registry directly quantifies later metastatic progression
      after localized presentation.
- phase: Prognostic separation by metastatic status
  notes: >-
    Five-year disease-specific survival is substantially better for localized
    than metastatic disease; the national registry identified metastasis at
    presentation as the only adverse prognostic factor for disease-specific
    survival.
  evidence:
  - reference: PMID:35971085
    reference_title: "Alveolar soft part sarcoma: progress toward improvement in survival? A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year disease-specific survival (DSS) was 68% for all patients and 86%
      and 62% for localized and metastatic disease, respectively (p = 0.019).
    explanation: >-
      The registry directly reports stage-stratified five-year disease-specific
      survival.
  - reference: PMID:35971085
    reference_title: "Alveolar soft part sarcoma: progress toward improvement in survival? A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metastasis at presentation was the only adverse prognostic factor for DSS
    explanation: >-
      The registry identifies metastatic presentation as its only adverse
      disease-specific-survival factor without overextending that result to
      other cohorts.
imaging_findings:
- name: Hypervascular Deep Soft-Tissue Mass
  modality: MRI
  imaging_finding_term:
    preferred_term: hypervascular deep soft-tissue mass with flow voids and feeding vessels
  spatial_extent: FOCAL
  diagnostic: false
  description: >-
    MRI commonly shows a deeply seated mass with high T2 signal, numerous flow
    voids, high internal vascularization, and large peritumoral feeding vessels.
    The finding is characteristic but not disease-specific and can mimic a
    vascular lesion.
  evidence:
  - reference: PMID:37987424
    reference_title: "Imaging Features of Alveolar Soft Part Sarcoma: Single Institution Experience and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the hallmark of ASPS imaging at presentation are the following
      characteristics: deep location, a slight hyperintense MRI SI on T1-WI and
      a hyperintense SI on T2-WI, numerous MRI flow voids, high internal
      vascularization, and large peritumoral feeding vessels.
    explanation: >-
      The imaging cohort and literature review directly define the characteristic
      MRI appearance.

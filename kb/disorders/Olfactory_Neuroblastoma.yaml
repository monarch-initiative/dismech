    explanation: >-
      States the site of origin. The sentence opens the paper's objective
      section and restates the established description rather than reporting
      this study's own finding, so it is graded BACKGROUND.
  - reference: PMID:24083125
    reference_title: "Long-term outcome of esthesioneuroblastoma: hyams grade predicts patient survival."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "ENB has a variable outcome, which is primarily prognosticated by the extent of involvement at presentation (Kadish stage and lymph node metastasis) and higher Hyams pathologic grade."
    explanation: >-
      The conclusion of a 109-patient single-institution series spanning 1962
      to 2009, that local extent at presentation is the primary prognostic
      factor alongside grade. A retrospective series over nearly fifty years,
      so treatment was not uniform across it.
  downstream:

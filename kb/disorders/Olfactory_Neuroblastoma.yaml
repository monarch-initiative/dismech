histopathology:
- name: Hyams Grade and the Loss of Neuronal Morphology
  finding_term:
    preferred_term: lobular architecture with Homer-Wright pseudorosettes and fibrillary matrix in low-grade tumours, lost in high-grade tumours
  description: >-
    The Hyams system grades histoarchitecture, mitoses, nuclear pleomorphism,
    neurofibrillary matrix, rosette formation and necrosis. Grades I and II
    show lobular architecture and neuronal morphology, including Homer-Wright
    pseudorosettes and a fibrillary matrix; grades III and IV generally lack
    neural morphology and show abundant mitoses, pronounced pleomorphism and
    necrosis. The grade predicts survival: in a 109-patient series median
    survival was 9.8 years for grades 1 to 2 against 6.9 years for grades 3 to
    4, and grade remained significant on multivariate analysis.
  notes: >-
    No finding term is bound. A label search of NCIT through the OLS4 API on
    30 Oct 2026 for Small Round Cell, Round Cell Pattern and Myxoid returned
    disease concepts rather than morphology findings, and the composite the
    Hyams system grades is six features rather than one finding. Binding any
    single component, such as necrosis, would misrepresent the item.
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Well-differentiated ONB (grades I and II) display lobular architecture and neuronal morphology (e.g., Homer-Wright pseudorosettes, fibrillary matrix) whereas poorly differentiated ONB (grades III and IV) generally lack neural morphology and display classic features of aggressive neoplasms such as abundant mitoses, pronounced nuclear pleomorphism, and necrosis."
    explanation: >-
      Describes what the grades mean morphologically. The sentence is in the
      paper's introduction and restates the established grading system rather
      than reporting this study's own cases.
  - reference: PMID:24083125
    reference_title: "Long-term outcome of esthesioneuroblastoma: hyams grade predicts patient survival."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 9.8 years compared with 6.9 years with low (grade 1 to 2) versus high (grade 3 to 4) Hyams grade."
    explanation: >-
      The survival difference by grade in a 109-patient retrospective series.
      The same analysis found grade significant on multivariate as well as
      univariate testing, alongside stage, nodal metastasis and age.
diagnosis:
- name: Neuroendocrine Marker Panel with Absent Pan-Cytokeratin
  description: >-
    The classical immunoprofile is neuroendocrine marker positivity in the
    absence of pan-cytokeratin. The cited review is explicit that the panel
    becomes less reliable in poorly differentiated, high-grade tumours, where
    the markers stop being mutually exclusive with those of sinonasal
    undifferentiated carcinoma. That failure at the high-grade end is the
    reason the newer markers below matter.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Classically, the diagnosis is made with immunohistochemical detection of neuroendocrine markers such as CD56/NCAM1, neuron-specific enolase (NSE/ENO4), synaptophysin (SYP), chromogranin A (CHGA), INSM1, and calretinin (CALB2) in the absence of pan-cytokeratin"
    explanation: >-
      Lists the classical panel. The sentence is in the paper's introduction,
      summarising established practice with multiple citations rather than
      reporting the study's own results.
- name: SSTR2 Immunohistochemistry
  description: >-
    Somatostatin receptor 2 staining was present in 77 of 78 tumours and was
    much stronger than in histologic mimics, which makes it a useful
    diagnostic marker and suggests a role for somatostatin-analogue imaging
    and therapy. It carried no prognostic value in that study, and staining
    was slightly stronger in low-grade than high-grade tumours, so it should
    not be read as a grade or outcome marker.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:33929681
    reference_title: "SSTR2 Expression in Olfactory Neuroblastoma: Clinical and Therapeutic Implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSTR2 staining is significantly higher in ONB than its histologic mimics (mean H-score: 189 vs 12.9, p < 0.001) suggesting a potential use of the marker in diagnosis of ONB."
    explanation: >-
      The comparison against 51 histologic mimics that supports the
      diagnostic use. H-score combines intensity and the proportion of cells
      stained, so the contrast is in staining strength rather than in a simple
      positive or negative call.
  - reference: PMID:33929681
    reference_title: "SSTR2 Expression in Olfactory Neuroblastoma: Clinical and Therapeutic Implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSTR2 expression had no prognostic value when considering disease-free or disease-specific survival."
    explanation: >-
      The negative result that bounds the marker's use: it helps with
      diagnosis and not with prognosis. Recorded so the stain is not read as
      an outcome predictor.
differential_diagnoses:
- name: Sinonasal Undifferentiated Carcinoma
  description: >-
    The most important mimic, and the one with a distinctly worse prognosis,
    so getting it wrong matters clinically. The classical neuroendocrine panel
    fails to separate them at the high-grade end, where the markers stop being
    mutually exclusive. NEUROD1 expression separates both low-grade and
    high-grade olfactory neuroblastoma from it.
  distinguishing_features:
  - NEUROD1 expression, which distinguishes both low-grade and high-grade olfactory neuroblastoma from sinonasal undifferentiated carcinoma
  - Strong SSTR2 staining, much higher than in histologic mimics
  - The classical neuroendocrine panel, which separates them only at the lower grades
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of a GBC transcription factor NEUROD1 distinguishes both low- and high-grade ONB from sinonasal undifferentiated carcinoma, a potential histologic mimic with a distinctly unfavorable prognosis."
    explanation: >-
      The marker that separates the two across the grade range, and the reason
      the distinction matters, stated in the same sentence.
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "This combination can be useful for distinguishing it from many other sinonasal cancers, however these markers become far less reliable (i.e., fail to remain mutually exclusive) in the setting of poorly differentiated, high-grade tumors such as sinonasal undifferentiated carcinoma (SNUC)."
    explanation: >-
      States where the classical panel fails, which is what makes this
      differential difficult rather than routine. An introduction sentence
      summarising established practice.
- name: IDH2-Mutant Sinonasal Carcinoma
  description: >-
    In the methylation reclassification cohort, 7 of 66 tumours carrying the
    institutional diagnosis of olfactory neuroblastoma formed a group with a
    CpG island methylator phenotype, strong cytokeratin expression, little or
    no chromogranin A, and an IDH2 hotspot mutation in every case; they
    clustered with sinonasal carcinoma with IDH2 mutation. These are generally
    read as misdiagnoses rather than as a subtype of this tumour, which is why
    no subtype is declared for them here.
  distinguishing_features:
  - IDH2 hotspot mutation, present in all seven cases of that group
  - Strong cytokeratin expression with no or scarce chromogranin A
  - A CpG island methylator phenotype, clustering with IDH2-mutant sinonasal carcinoma rather than with core olfactory neuroblastoma
  evidence:
  - reference: PMID:29730775
    reference_title: "DNA methylation-based reclassification of olfactory neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second DNA methylation group (n = 7, 11%) with CpG island methylator phenotype (CIMP) consisted of cases with strong expression of cytokeratin, no or scarce chromogranin A expression and IDH2 hotspot mutation in all cases."
    explanation: >-
      Describes the group and its three separating features. Seven cases, all

  - reference: PMID:29730775
    reference_title: "DNA methylation-based reclassification of olfactory neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The largest group (n = 42, 64%, Core ONB) presented with classical ONB histology and no overlap with other classes upon methylation profiling-based t-distributed stochastic neighbor embedding (t-SNE) analysis."
    explanation: >-
      Gives the size of the core group against the whole cohort, which is what

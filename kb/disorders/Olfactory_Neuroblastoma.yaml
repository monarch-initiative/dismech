- name: Neuroblastoma
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  description: >-
    Shares the name and nothing else that matters. Neuroblastoma is a tumour
    of the sympathetic nervous system in young children, arising from neural
    crest-derived sympathoadrenal precursors, typically in the adrenal gland
    or paraspinal sympathetic chain. This tumour arises from olfactory
    epithelial globose basal cells in the nasal cavity, in adults. The two are
    confused in the literature and in ontologies rather than at the bedside,
    and this row exists to record the distinction explicitly.
  distinguishing_features:
  - Origin from olfactory epithelial globose basal cells rather than from sympathoadrenal neural crest precursors
  - A sinonasal site at the cribriform plate rather than adrenal or paraspinal
  - Adults rather than young children
  - No recurrent driver mutation, where neuroblastoma has recurrent MYCN amplification and ALK alterations
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results link ONB to a specific cell type for the first time and identify conserved developmental pathways within ONB that inform diagnostic, prognostic, and mechanistic investigation."
    explanation: >-
      The cell-of-origin result, which is the substantive basis for separating
      this tumour from neuroblastoma: a different parent cell in a different
      epithelium. The sentence does not mention neuroblastoma, so the contrast
      itself is drawn by this entry from the two tumours' separate literatures.
treatments:
- name: Surgical Resection
  description: >-
    Surgery is the primary local treatment. Open craniofacial resection was
    historically the standard operation; endoscopic endonasal approaches have
    largely replaced it over the last two decades, with lower complication
    rates and shorter hospital stay and, in the cited review's assessment,
    similar clinical outcome.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Sinonasal Mass Arising at the Cribriform Plate
    description: >-
      Resection removes the mass and, with it, the obstruction, bleeding and
      further local extension.
  evidence:
  - reference: PMID:37909011
    reference_title: "Olfactory neuroblastoma: diagnosis, management, and current treatment options."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Local treatment with surgery is frequently recommended for primary therapy."
    explanation: >-
      The review's statement that surgery is the usual primary treatment. It
      is a synthesis of practice rather than a trial result.
  - reference: PMID:37909011
    reference_title: "Olfactory neuroblastoma: diagnosis, management, and current treatment options."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In the last years, endoscopic endonasal approaches have been largely introduced with lower complication rates, shorter hospital stay, and similar clinical outcome."
    explanation: >-
      Records the shift in surgical approach and the claimed equivalence of
      outcome. The comparison is the review's summary of published series, not
      a randomised comparison, so the equivalence claim is weakly founded.
- name: Postoperative Radiotherapy
  description: >-
    Radiotherapy is combined with surgery for more locally advanced resectable
    disease, and locally advanced disease generally needs a multidisciplinary
    approach with surgery, radiation and systemic therapy. The cited review
    also notes that Hyams grade may bear on decisions about induction
    chemotherapy and adjuvant radiotherapy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:37909011
    reference_title: "Olfactory neuroblastoma: diagnosis, management, and current treatment options."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "While a combination of surgery and postoperative RT is indicated for the management of more local advanced resectable cancers."
    explanation: >-
      States the indication for adding postoperative radiotherapy. A review's
      synthesis of practice, with no comparative data quoted.
  - reference: PMID:37909011
    reference_title: "Olfactory neuroblastoma: diagnosis, management, and current treatment options."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, based on published data, Hyams grading may represent an important factor for decision making in therapeutic strategies such as induction chemotherapy and adjuvant radiotherapy (RT), and may also be considered in surveillance protocols."
    explanation: >-
      Links the histological grade to treatment decisions. The review hedges
      it as what published data may support, so it is graded INDIRECT and the
      entry does not state grade-directed therapy as established practice.

    label: olfactory neuroblastoma
pathophysiology:
- name: Recurrent Chromosomal Loss Without a Recurrent Driver Mutation
  description: >-
    The genomic landscape is one of large-scale copy number change rather than
    point mutation. Panel sequencing of 560 tumour-associated genes in a
    66-tumour cohort found no highly recurrent mutations, the only recurrently
    mutated genes being TP53 and DNMT3A, while copy number analysis of the
    core group showed a high frequency of combined loss of chromosomes 1 to 4,
    8 to 10 and 12. A systematic review of the genomics reached the same
    conclusion, that recurrent mutations are uncommon.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:29730775
    reference_title: "DNA methylation-based reclassification of olfactory neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "NGS sequencing did not reveal highly recurrent mutations in ONB, with the only recurrently mutated genes being TP53 and DNMT3A."
    explanation: >-
      The negative mutational result from a 66-tumour cohort, which is why
      this entry has no driver lesion to build on. Sequencing was of a 560-gene
      panel in a subset of the cohort, so it bounds recurrent mutation within
      those genes rather than genome-wide.
  - reference: PMID:29730775
    reference_title: "DNA methylation-based reclassification of olfactory neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Copy number analysis indicated highly recurrent chromosomal changes among Core ONB with a high frequency of combined loss of chromosome 1-4, 8-10, and 12."
    explanation: >-
      The positive genomic finding that stands in place of a driver mutation:
      highly recurrent combined whole-chromosome losses in the core methylation
      group. It is a description of the landscape, not a demonstration that
      these losses cause the tumour.
  - reference: PMID:34401496
    reference_title: "The genomics and epigenetics of olfactory neuroblastoma: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Although recurrent mutations among ONB tumors are uncommon, alterations in TP53, DMD, PIK3CA, NF1, CDKN2A, CDKN2C, CTNNB1, EGFR, APC, cKIT, cMET, PDGFRA, CDH1, FH, SMAD4, FGFR3 and IDH2 genes have been reported in several recent studies."
    explanation: >-
      A systematic review of 36 studies reaching the same conclusion
      independently, and listing the genes reported as altered in at least one
      study. The review states its own limitation, that the rarity of the
      tumour has limited sample sizes.
  downstream:
  - target: Malignant Transformation of Olfactory Epithelial Globose Basal Cells
    causal_link_type: UNKNOWN
    description: >-
      The chromosomal losses are the most consistent genomic abnormality in
      this tumour, but no source cited here shows that they cause the
      transformation. The link is recorded as UNKNOWN rather than left out,
      because the alternative would be a pathograph in which the tumour's main
      genomic finding appears nowhere.
- name: Malignant Transformation of Olfactory Epithelial Globose Basal Cells
  description: >-
    The tumour is linked by single-cell transcriptomics to globose basal
    cells, the stem and progenitor population of the olfactory epithelium.
    This is the cell-identity claim the rest of the mechanism rests on, and
    the study that made it states it was the first time the tumour had been
    linked to a specific cell type.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: olfactory epithelial globose basal cell
    term:
      id: CL:0002171
      label: globose cell of olfactory epithelium
  locations:
  - preferred_term: olfactory epithelium
    term:
      id: UBERON:0001997
      label: olfactory epithelium
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we utilize an integrated human-mouse single-cell atlas of the nasal mucosa, including the olfactory epithelium, to identify transcriptomic programs that link ONB to a specific population of stem/progenitor cells known as olfactory epithelial globose basal cells (GBCs)."
    explanation: >-
      The study that identifies the cell of origin, by matching tumour
      transcriptomic programmes against a single-cell atlas of normal nasal
      mucosa. The atlas is integrated human and mouse, so the reference map is
      not purely human, and the inference is from transcriptional similarity
      rather than from lineage tracing.
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results link ONB to a specific cell type for the first time and identify conserved developmental pathways within ONB that inform diagnostic, prognostic, and mechanistic investigation."
    explanation: >-
      The authors' own statement of what the work established and that it was
      the first such link, which is why this cell type is bound here and no
      earlier candidate is recorded.
  downstream:
  - target: Retained Globose Basal Cell Transcriptional Programme
    causal_link_type: DIRECT
    description: >-
      The transformed cell keeps the transcriptional identity of its parent
      population, which is what the tumour's markers and its differentiation
      behaviour read out.
- name: Retained Globose Basal Cell Transcriptional Programme
  description: >-
    The tumour expresses the globose basal cell transcription factor NEUROD1,
    whose expression distinguishes both low-grade and high-grade tumours from
    sinonasal undifferentiated carcinoma. The programme is not merely a
    marker: it is the retained developmental circuitry of the parent cell, and
    the two nodes below are its two consequences.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of a GBC transcription factor NEUROD1 distinguishes both low- and high-grade ONB from sinonasal undifferentiated carcinoma, a potential histologic mimic with a distinctly unfavorable prognosis."
    explanation: >-
      Establishes that the globose basal cell transcription factor is
      expressed across the grade range, and that its expression separates this
      tumour from its most important mimic. The claim is about distinguishing
      the two, not about NEUROD1 driving the tumour.
  downstream:
  - target: Proliferative EZH2-High Compartment
    causal_link_type: DIRECT
    description: >-
      The programme includes a stemness marker, and the cells expressing it
      are the proliferative compartment.
  - target: Divergent Neuronal and Sustentacular Differentiation
    causal_link_type: DIRECT
    description: >-
      The same programme preserves the regulatory circuit that decides between
      the two differentiation routes of the normal epithelium.
- name: Proliferative EZH2-High Compartment
  description: >-
    Within the tumour there is a reproducible subpopulation of highly
    proliferative cells expressing EZH2, the globose basal cell stemness
    marker. The authors suggest on that basis that EZH2 inhibition may have a
    role in targeted treatment; that is a proposal from expression data, not a
    tested therapy, and no trial evidence is recorded in this entry.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we identify a reproducible subpopulation of highly proliferative ONB cells expressing the GBC stemness marker EZH2, suggesting that EZH2 inhibition may play a role in the targeted treatment of ONB."
    explanation: >-
      Identifies the proliferative compartment and its marker. The therapeutic
      suggestion in the second half of the sentence is the authors' inference
      from expression, and is recorded in this node's description as a
      proposal rather than as a treatment.
  downstream:
  - target: Sinonasal Mass Arising at the Cribriform Plate
    causal_link_type: DIRECT
    description: >-
      The proliferating compartment produces the mass that presents clinically.
- name: Divergent Neuronal and Sustentacular Differentiation
  description: >-
    Single-cell transcriptomics of tumour parenchyma found a conserved globose
    basal cell regulatory circuit governing divergent neuronal versus
    sustentacular differentiation. This is the mechanistic counterpart of what
    pathologists grade: well-differentiated tumours show lobular architecture
    and neuronal morphology with Homer-Wright pseudorosettes and a fibrillary
    matrix, while poorly differentiated tumours lack neural morphology.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030182
      label: neuron differentiation
  evidence:
  - reference: PMID:36841178
    reference_title: "Molecular Evidence for Olfactory Neuroblastoma as a Tumor of Malignant Globose Basal Cells."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we study the cellular states comprising ONB parenchyma using single-cell transcriptomics and identify evidence of a conserved GBC transcriptional regulatory circuit that governs divergent neuronal-versus-sustentacular differentiation."
    explanation: >-
      The single-cell evidence that the tumour preserves the parent cell's
      differentiation circuitry. It establishes the circuit is present and
      active, not that its output determines Hyams grade, which is a
      connection this entry does not assert.
  downstream:
  - target: Sinonasal Mass Arising at the Cribriform Plate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The degree of differentiation shapes the tumour that forms, and is what
      the Hyams system grades on the resulting tissue.
- name: Sinonasal Mass Arising at the Cribriform Plate
  description: >-
    The tumour forms in the olfactory cleft at the cribriform plate, at the
    roof of the nasal cavity, from where it obstructs the nasal airway, bleeds
    and destroys olfactory epithelium. Extension through the cribriform plate
    into the anterior cranial fossa is what makes local staging the dominant
    prognostic factor.
  biological_scale: TISSUE
  locations:
  - preferred_term: olfactory epithelium
    term:
      id: UBERON:0001997
      label: olfactory epithelium

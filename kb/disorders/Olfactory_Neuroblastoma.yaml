name: Olfactory Neuroblastoma
creation_date: '2026-10-30T16:00:00Z'
description: >-
  Olfactory neuroblastoma, also called esthesioneuroblastoma, is an uncommon
  malignant neuroectodermal tumour of the nasal cavity that arises from the
  olfactory epithelium at the cribriform plate. Despite its name it is not a
  form of neuroblastoma: it is a sinonasal tumour of adults with a different
  cell of origin, a different genomic landscape and a different clinical
  course, and this entry exists partly to keep the two apart.

  Single-cell transcriptomic work links the tumour to olfactory epithelial
  globose basal cells, the stem and progenitor population of the olfactory
  epithelium, and that was the first time the tumour was linked to a specific
  cell type. The tumour retains a globose basal cell programme: it expresses
  the globose basal cell transcription factor NEUROD1, which separates it from
  sinonasal undifferentiated carcinoma, it contains a reproducible
  highly proliferative subpopulation expressing the stemness marker EZH2, and
  it preserves a regulatory circuit that governs divergent neuronal versus
  sustentacular differentiation. That retained differentiation capacity is
  what the Hyams grading system reads off the slide.

  Its genomic landscape is unusual for a malignancy. Panel sequencing of 560
  tumour-associated genes found no highly recurrent mutations, with only TP53
  and DNMT3A recurrently mutated, while copy number analysis showed highly
  recurrent combined loss of whole chromosomes. There is therefore no driver
  lesion to anchor the entry on, and the mechanism recorded below is a
  cell-identity one rather than a mutational one.

  DNA methylation profiling has also shown that the institutional diagnosis is
  not a single thing: in a 66-tumour cohort only 42 (64 per cent) formed a
  core group, while others clustered with IDH2-mutant sinonasal carcinoma or
  with sinonasal carcinomas of other types. Those non-core cases are widely
  read as misdiagnosis rather than as subtypes of this tumour.
categories:
- Head and Neck Cancer
- Neuroendocrine Tumor
parents:
- sinonasal malignancy
synonyms:
- esthesioneuroblastoma
- ONB
- ENB
notes: >-
  This is not neuroblastoma, and the shared name is the whole reason the entry
  is here. Neuroblastoma (MONDO:0005072) is a tumour of the sympathetic
  nervous system arising from neural crest-derived sympathoadrenal precursors,
  predominantly in young children. Olfactory neuroblastoma arises from the
  olfactory epithelium, in adults, and has none of neuroblastoma's defining
  features: no MYCN amplification, no ALK dependency, no catecholamine
  secretion, and no shared genomic landscape. The Neuroblastoma entry's scope
  note points here.

  MONDO currently places this term under MONDO:0002749 extracranial
  neuroblastoma, alongside MONDO:0002433 malignant cranial nerve neoplasm,
  MONDO:0002722 olfactory nerve neoplasm and MONDO:0003142 intracranial
  primitive neuroectodermal tumor (hierarchical parents retrieved through the
  OLS4 API on 30 October 2026). Placing it under extracranial neuroblastoma is
  the classification this entry disagrees with, and a change request has been
  raised with MONDO. The mapping below is still skos:exactMatch, because the
  term denotes the right disease; it is the term's position in the hierarchy
  that is at issue, not its identity.

  No origin node is marked and no somatic lesion is recorded, because none is
  recurrent. The cell of origin is bound on the transformation node instead,
  which is the one thing the molecular work does establish.

  The entry does not cover olfactory carcinoma, a more aggressive sinonasal
  tumour with focal epithelial differentiation that has only recently been
  consolidated under that name and whose relationship to this tumour is
  described in the cited literature as unknown.

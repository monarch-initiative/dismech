differential_diagnoses:
- name: Celiac disease with secondary disaccharidase deficiency
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  description: >-
    Villous injury in untreated celiac disease can reduce trehalase together with the
    other brush-border disaccharidases and therefore mimic primary deficiency
    biochemically and symptomatically.
  distinguishing_features:
  - Villous atrophy rather than normal mucosal architecture
  - Broad reduction of disaccharidases rather than isolated low trehalase
  - Recovery of trehalase activity with a gluten-free diet
  evidence:
  - reference: PMID:10884712
    reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thirty-one patients with villous atrophy had significantly reduced
      disaccharidase activities. With ingestion of a gluten-free diet, maltase, sucrase
      and trehalase activities recovered to normal in most patients
    explanation: Directly documents secondary and reversible reduction with villous injury.
- name: Small-intestinal bacterial overgrowth
  description: >-
    Excess small-intestinal bacteria can ferment multiple test sugars and cause an
    abnormal breath-hydrogen rise, mimicking trehalose malabsorption even when primary
    trehalase deficiency has not been established.
  distinguishing_features:
  - Nonspecific fermentation of multiple sugar substrates
  - Breath-hydrogen positivity does not establish isolated low biopsy trehalase
  evidence:
  - reference: PMID:24443064
    reference_title: "Fructose, trehalose and sorbitol malabsorption."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the large amount of intestinal bacteria may unspecifically ferment sugars, causing
      an abnormal H2 production and consequently a misleading diagnosis of sugar
      malabsorption.
    explanation: Directly supports the breath-test differential.

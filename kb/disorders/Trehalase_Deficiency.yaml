discussions:
- discussion_id: trehalase_inheritance_and_variant_validity_conflict
  prompt: >-
    Is primary TREH-associated trehalase deficiency dominantly or recessively inherited,
    and which variants have sufficient clinical evidence to establish either model?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#TREH-associated primary trehalase deficiency
  rationale: >-
    Current Orphanet-derived structured data report dominant inheritance, whereas a
    later human-knockout paper labels the trait recessive. The one recurrent splice
    deletion has conflicting ClinVar classifications and lacks enzyme- or
    challenge-confirmed phenotyping in its six homozygotes. Recurrence-risk counseling
    and molecular diagnosis should therefore not assume a settled model.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/gtr/conditions/C0268187/
    reference_title: "alpha, alpha-Trehalase deficiency - NIH Genetic Testing Registry (GTR) - NCBI"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      alpha, alpha-Trehalase deficiency ... Modes of inheritance ... Autosomal
      dominant inheritance ... Source: Orphanet
    explanation: Documents the current dominant structured-source assertion.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5600291/fullTextXML
    reference_title: "Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trehalase deficiency, an autosomal recessive trait"
    explanation: Documents the conflicting recessive literature assertion.
  - reference: url:https://www.ncbi.nlm.nih.gov/clinvar/variation/488190/
    reference_title: "VCV000488190.3 - ClinVar - NCBI"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic (1); Uncertain significance (1)"
    explanation: Documents the unresolved variant-classification split.
- discussion_id: treh_genotype_activity_clinical_expression_gap
  prompt: >-
    How often do common activity-lowering TREH genotypes cause enzyme-confirmed,
    trehalose-provoked clinical disease rather than only a lower biochemical activity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TREH activity-modifying common variation
  - biochemical#Reduced small-intestinal trehalase activity
  rationale: >-
    Recent population studies genotype rs2276064 and infer enzymopathy without directly
    measuring intestinal activity or symptoms. Their high genotype frequencies cannot
    be used as prevalence of MONDO:0012803, and the genotype-to-clinical penetrance bridge
    remains unquantified.
  evidence:
  - reference: PMID:36880131
    reference_title: "Prevalence of genetically determined trehalase deficiency in populations of Siberia and Russian Far East."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The question on to what degree the genotype-determined trehalase deficiency comes
      out clinically needs further elaboration.
    explanation: The authors explicitly identify the missing genotype-to-clinical bridge.
  - reference: PMID:39283558
    reference_title: "Prevalence of Trehalase Enzymopathy Genetic Determinants in Siberian and Russian Far East Populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genotyping of 1068 DNA samples was carried out
    explanation: >-
      The current study is a genotype-frequency analysis rather than a clinical
      penetrance study.
- discussion_id: trehalase_mouse_human_gastrointestinal_fidelity
  prompt: >-
    Does a Treh-deficient mouse reproduce the human osmotic and
    microbiota-dependent gastrointestinal phenotype after a controlled trehalose load?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Trehalase-deficient mouse
  - pathophysiology#Microbial fermentation of maldigested trehalose
  - phenotype#Diarrhea after trehalose ingestion
  rationale: >-
    Mouse knockout studies reproduce an absent glycemic response or examine metabolic
    endpoints, but do not establish diarrhea, distention, flatulence, transit, or
    fermentation. Because the human gaseous phenotype is microbiota-dependent, proximal
    biochemical fidelity cannot be generalized to clinical fidelity.
  evidence:
  - reference: PMID:32206077
    reference_title: "Trehalose itself plays a critical role on lipid metabolism: Trehalose increases jejunum cytoplasmic lipid droplets which negatively correlated with mesenteric adipocyte size in both HFD-fed trehalase KO and WT mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      An oral trehalose tolerance test revealed that these trehalase-deficient mice
      exhibited no changes in blood glucose levels.
    explanation: Documents the proximal readout that is established in the model.
  - reference: PMID:40529415
    reference_title: "Assessing the efficacy of the natural disaccharide trehalose in ameliorating diet-induced obesity and metabolic dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Systemic trehalase-deficient mice showed no metabolic changes at baseline.
    explanation: >-
      A current independent knockout study again focuses on metabolic rather than human
      gastrointestinal outcomes.
review_notes: >-
  The 2026 review kept the exact MONDO:0012803 disorder but narrowed it to primary
  isolated trehalase deficiency. Common rs2276064-associated low activity is represented
  only as a biochemical modifier, secondary low activity from celiac villous injury is a
  differential diagnosis, and neither is counted as Mendelian-disease prevalence. The
  former recessive loss-of-function claim was replaced by an explicit
  dominant-versus-recessive controversy because current structured resources and the
  later human-knockout literature disagree. The c.90-9_106del allele remains
  classification-conflicted and clinically underphenotyped. The pathograph separates
  the exposure-gated enzyme defect, luminal substrate, osmotic arm, and conditional
  microbial arm.
  Asymptomatic low activity is no longer misrepresented as a diarrhea phenotype.
  Biopsy and breath testing are evidence-calibrated, dietary reduction is mechanistically
  reasonable but not trial-proven, and the gnomAD prevalence confidence interval is
  flagged as internally impossible rather than silently repaired. No GeneReviews chapter,
  disease-specific clinical trial, controlled treatment study, or natural-history cohort
  was identified. PROMIS is retained only as a direct TREH variant cohort with explicit
  non-disease-specific limitations.

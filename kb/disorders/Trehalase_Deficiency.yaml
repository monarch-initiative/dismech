name: Trehalase Deficiency
creation_date: "2026-07-06T00:00:00Z"
category: Mendelian
synonyms:
- Congenital trehalase deficiency
- Isolated trehalose intolerance
- Trehalose intolerance
- Diarrhea-vomiting due to trehalase deficiency
description: >-
  Trehalase deficiency is a rare, autosomal recessive brush-border
  disaccharidase deficiency caused by loss-of-function variants in TREH,
  the gene encoding intestinal trehalase. Reduced or absent brush-border
  trehalase activity impairs hydrolysis of dietary trehalose (a
  glucose-glucose disaccharide found mainly in mushrooms, and also present
  in young shoots, some insects, algae, and seaweed) into absorbable
  glucose. Unabsorbed trehalose reaching the colon causes osmotic and
  fermentative gastrointestinal symptoms, classically diarrhea and
  vomiting after ingestion of trehalose-containing food (most often
  edible mushrooms). Many individuals with reduced trehalase activity are
  asymptomatic or only mildly affected, and clinical relevance outside of
  mushroom ingestion is limited.
disease_term:
  preferred_term: diarrhea-vomiting due to trehalase deficiency
  term:
    id: MONDO:0012803
    label: diarrhea-vomiting due to trehalase deficiency
parents:
- Gastrointestinal Disease
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Trehalase deficiency is classically described as an autosomal
    recessive trait; homozygosity or compound heterozygosity for
    loss-of-function TREH alleles is associated with clinically
    detectable trehalase deficiency, while heterozygous carriers
    typically have intermediate enzyme activity.
  evidence:
  - reference: PMID:23468175
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that variants in TREH control trehalase activity, and
      although one of these variants is also reproducibly associated
      with T2D, it is likely that the effect of the SNP on risk of T2D
      occurs by a mechanism different than affecting trehalase activity.
    explanation: >-
      Establishes that common TREH genetic variation is the determinant
      of measured plasma trehalase activity in humans, consistent with a
      gene-dosage (recessive) relationship between TREH genotype and
      enzyme activity.
genetic:
- name: TREH loss-of-function variants
  gene_term:
    preferred_term: TREH
    term:
      id: hgnc:12266
      label: TREH
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Genetic variation at the TREH locus determines circulating and
    intestinal trehalase activity; low-activity alleles (including the
    common rs2276064 variant) associate with reduced enzyme activity in a
    dose-dependent manner across genotypes.
  evidence:
  - reference: PMID:23468175
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four tag SNPs in TREH were genotyped in these subjects and plasma
      trehalase activity was highly associated with three SNPs:
      rs2276064, rs117619140 and rs558907 (p = 2.2 × 10(-11)-1.4 ×
      10(-23))
    explanation: >-
      Direct human genetic-association evidence that TREH sequence
      variation determines trehalase enzyme activity.
pathophysiology:
- name: Intestinal Brush-Border Trehalase Deficiency
  description: >-
    Loss-of-function TREH variants reduce or abolish alpha,alpha-trehalase
    activity at the small-intestinal brush border. Dietary trehalose,
    normally hydrolyzed to two glucose molecules for absorption, is not
    digested and passes largely intact into the colon.
  genes:
  - preferred_term: TREH
    term:
      id: hgnc:12266
      label: TREH
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  molecular_functions:
  - preferred_term: alpha,alpha-trehalase activity
    term:
      id: GO:0004555
      label: alpha,alpha-trehalase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:3227291
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small-intestinal surgical biopsy specimens from 97 adult
      Greenlanders showed an incidence of trehalase deficiency in at
      least 8%.
    explanation: >-
      Direct human tissue evidence of a deficient brush-border trehalase
      enzyme activity phenotype, measured on small-intestinal biopsy.
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trehalase activity was determined in serum and on a duodenal
      biopsy specimen obtained by endoscopy.
    explanation: >-
      Confirms that reduced brush-border (duodenal) trehalase activity is
      the enzymatic lesion assessed in symptomatic individuals.
  downstream:
  - target: Trehalose Malabsorption and Osmotic-Fermentative Diarrhea
    description: >-
      Undigested trehalose reaching the colon draws water osmotically
      into the bowel lumen and is fermented by colonic bacteria capable of
      metabolizing trehalose, producing gas (hydrogen and/or methane) and
      loose, watery stools.
    evidence:
    - reference: PMID:10522609
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the maldigested trehalose, which causes osmotic water flow into
        the colon, resulting in loose stools and diarrhea; and 3) most
        importantly, the microflora of the colon, from which symptoms
        will arise if there are bacteria capable of producing gases from
        maldigested trehalose
      explanation: >-
        Directly states the osmotic and fermentative mechanism by which
        malabsorbed trehalose produces diarrhea and gas-related symptoms.
- name: Trehalose Malabsorption and Osmotic-Fermentative Diarrhea
  description: >-
    Unhydrolyzed trehalose passing into the colon causes osmotic water
    flow into the bowel lumen; colonic bacterial fermentation of the
    unabsorbed sugar (when gas-producing microflora are present) adds
    hydrogen/methane gas production, bloating, and flatus to the osmotic
    diarrhea.
  biological_processes:
  - preferred_term: disaccharide catabolic process
    term:
      id: GO:0046352
      label: disaccharide catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the maldigested trehalose, which causes osmotic water flow into the
      colon, resulting in loose stools and diarrhea; and 3) most
      importantly, the microflora of the colon, from which symptoms will
      arise if there are bacteria capable of producing gases from
      maldigested trehalose
    explanation: >-
      Directly states the osmotic and fermentative mechanism by which
      malabsorbed trehalose produces diarrhea and gas-related symptoms.
phenotypes:
- category: Gastrointestinal
  name: Diarrhea After Trehalose-Containing Food Ingestion
  description: >-
    Loose, watery stools occurring after ingestion of trehalose-containing
    foods, most classically edible mushrooms, in individuals with reduced
    intestinal trehalase activity.
  phenotype_term:
    preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  evidence:
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of the study was to evaluate whether maldigestion of
      trehalose causes abdominal symptoms and which available diagnostic
      method best distinguishes intolerant from tolerant subjects.
    explanation: >-
      Establishes that trehalose maldigestion (from low trehalase
      activity) is associated with abdominal/diarrheal symptoms following
      an oral trehalose load.
- category: Gastrointestinal
  name: Vomiting After Trehalose-Containing Food Ingestion
  description: >-
    Vomiting reported in association with trehalase deficiency following
    ingestion of trehalose-containing food.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  notes: >-
    Vomiting is part of the classical "diarrhea-vomiting due to trehalase
    deficiency" clinical description (MONDO:0012803); the sourced
    literature located during this curation directly documents
    diarrhea/abdominal symptoms and gas production more thoroughly than
    vomiting specifically.
- category: Gastrointestinal
  name: Abdominal Distention and Flatulence
  description: >-
    Bloating and excess intestinal gas from colonic bacterial fermentation
    of unabsorbed trehalose.
  phenotype_term:
    preferred_term: Abdominal distention
    term:
      id: HP:0003270
      label: Abdominal distention
  evidence:
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If colonic bacteria cannot produce gases, then distention of the
      abdomen and intestinal gas expulsion as eructations and flatus will
      not occur.
    explanation: >-
      Directly documents abdominal distention and flatus as
      fermentation-dependent symptoms of trehalose malabsorption.
- category: Gastrointestinal
  name: Asymptomatic Trehalase Deficiency
  description: >-
    Many individuals with biochemically reduced or deficient trehalase
    activity have no gastrointestinal symptoms and no recognized
    nutritional consequence, since trehalose is a minor dietary component
    for most people.
  phenotype_term:
    preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  frequency: OCCASIONAL
  notes: >-
    Frequency here qualitatively reflects that most biochemically
    trehalase-deficient individuals are reported as asymptomatic or
    without recognized nutritional significance, rather than a specific
    quantitative literature estimate of symptomatic proportion; see
    evidence.
  evidence:
  - reference: PMID:3227291
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trehalase deficiency is not considered to have any significance
      from a nutritional point of view.
    explanation: >-
      Supports that trehalase deficiency, though biochemically common in
      some populations, is often clinically silent/asymptomatic.
diagnosis:
- name: Oral Trehalose Tolerance Test
  description: >-
    An oral trehalose load test with monitoring of blood glucose, breath
    hydrogen/methane, and symptoms distinguishes trehalose-intolerant from
    tolerant individuals; changes in breath gases and duodenal
    trehalase-to-sucrase ratio best differentiate intolerant subjects.
  diagnosis_term:
    preferred_term: breath hydrogen test
    term:
      id: MAXO:0035096
      label: breath hydrogen test
  evidence:
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 25-g oral trehalose load test was performed in 64 subjects. The
      19 experiencing clear symptoms constituted the trehalose-intolerant
      subjects.
    explanation: >-
      Documents the oral trehalose tolerance/load test used to identify
      trehalose-intolerant individuals.
  - reference: PMID:3227291
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trehalose tolerance tests performed in three individuals with low
      trehalase activity (6 IU/g protein) showed no increase in the blood
      glucose concentration.
    explanation: >-
      Documents the blood-glucose response criterion of the trehalose
      tolerance test in biochemically trehalase-deficient individuals.
- name: Small-Intestinal Biopsy Disaccharidase Assay
  description: >-
    Direct measurement of trehalase (and other disaccharidase) activity
    in duodenal or small-intestinal mucosal biopsy specimens is the
    reference method for diagnosing trehalase deficiency.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:3227291
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small-intestinal surgical biopsy specimens from 97 adult
      Greenlanders showed an incidence of trehalase deficiency in at
      least 8%.
    explanation: >-
      Documents small-intestinal biopsy-based enzyme assay as the method
      used to establish trehalase deficiency status.
treatments:
- name: Dietary Avoidance of Trehalose-Containing Foods
  description: >-
    Avoidance of trehalose-rich foods (notably edible mushrooms) is the
    mainstay management for symptomatic trehalase deficiency, since no
    enzyme replacement is available.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  evidence:
  - reference: PMID:10522609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is obvious that trehalose maldigestion can cause symptoms
      similar to those of lactose maldigestion and intolerance.
    explanation: >-
      Supports that trehalose-maldigestion symptoms parallel other
      disaccharide-intolerance syndromes managed by avoidance of the
      offending dietary sugar, motivating dietary trehalose avoidance as
      the primary management strategy.
prevalence:
- population: Adult Greenlandic Inuit (surgical small-intestinal biopsy cohort)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    8% incidence of trehalase deficiency (at least 8 of 97 biopsied
    adults) reported in a Greenlandic Inuit surgical biopsy series; not a
    general-population birth prevalence estimate.
  evidence:
  - reference: PMID:3227291
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small-intestinal surgical biopsy specimens from 97 adult
      Greenlanders showed an incidence of trehalase deficiency in at
      least 8%.
    explanation: >-
      Source of the Greenlandic biopsy-cohort trehalase-deficiency
      incidence figure.
- population: Worldwide (gnomAD allele-frequency-based estimate)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.92
  notes: >-
    Estimated birth prevalence of 9.2 per 1,000,000 births (95% CI
    2.5-3.7 per 10^6, as reported) for congenital trehalase deficiency,
    modeled from previously reported pathogenic TREH variants plus
    gnomAD-predicted loss-of-function variants.
  evidence:
  - reference: PMID:36167617
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      the overall estimated prevalence was 2.3 per 106 births (95% CI:
      1.9-2.9) for CLD, 57.6 per 106 births (95% CI:52.5-63.2) for CSD,
      and 9.2 per 106 births (95% CI: 2.5-3.7) for CTD.
    explanation: >-
      Source of the gnomAD-variant-based birth-prevalence estimate for
      congenital trehalase deficiency (CTD).
- population: UK gastroenterology referral population (duodenal biopsy cohort)
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Only one of 369 patients with normal duodenal histology had an
    isolated borderline trehalase deficiency, indicating isolated
    trehalase deficiency is rare outside of populations such as
    Greenlandic Inuit.
  evidence:
  - reference: PMID:10884712
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated intestinal trehalase deficiency is found in 8% of
      Greenlanders, but is rare elsewhere.
    explanation: >-
      States that isolated trehalase deficiency, while present in 8% of
      Greenlanders, is rare in other populations such as the UK.

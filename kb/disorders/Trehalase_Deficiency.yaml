treatments:
- name: Reduction or avoidance of symptom-triggering trehalose
  description: >-
    A pragmatic dietary strategy is to reduce or avoid the amount and sources of
    trehalose that reproducibly trigger symptoms. The mechanistic rationale is strong,
    but no controlled treatment study, response rate, or disease-specific guideline was
    found; this should not be represented as trial-proven efficacy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:10522609
    reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is obvious that trehalose maldigestion can cause symptoms similar to those of

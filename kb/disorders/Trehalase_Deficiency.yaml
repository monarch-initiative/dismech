biochemical:
- name: Reduced small-intestinal trehalase activity
  presence: DECREASED
  context: >-
    Quantitative trehalase activity in a duodenal or jejunal mucosal biopsy is the
    defining biochemical readout. Interpretation is assay-, site-, and
    population-dependent and must account for mucosal histology and the other
    disaccharidases.
  readouts:
  - target: Reduced intestinal brush-border trehalase activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low biopsy trehalase activity reports the proximal biochemical lesion, but is not
      specific for a primary genetic defect when villous injury is present.
    evidence:
    - reference: PMID:10884712
      reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The normal range (mean +/- 2 SD) was 4.79-37.12 U/g protein.
      explanation: Establishes quantitative biopsy activity as a biochemical readout.
  reference_ranges:
  - lower_bound: 4.79
    upper_bound: 37.12
    unit: "U/g{protein}"
    population: >-
      UK gastroenterology referral patients with normal distal-duodenal histology
      (n=369); Dahlqvist disaccharidase assay
    evidence:
    - reference: PMID:10884712
      reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The normal range (mean +/- 2 SD) was 4.79-37.12 U/g protein.
      explanation: Source of the assay-specific reference interval.
    notes: >-
      This is a study-specific mean plus or minus two standard deviations, not a
      universal clinical decision limit.
  evidence:
  - reference: PMID:10884712
    reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thirty-one patients with villous atrophy had significantly reduced
      disaccharidase activities.
    explanation: >-
      Shows why low trehalase activity is not specific for primary deficiency without
      histologic and multi-enzyme context.
diagnosis:
- name: Small-intestinal biopsy trehalase assay with histologic context
  description: >-
    Direct activity measurement in a duodenal or jejunal mucosal biopsy can establish
    the biochemical deficiency. Simultaneous histology and a disaccharidase panel are
    needed to separate isolated primary deficiency from global secondary loss due to
    villous injury.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:10884712
    reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endoscopic distal duodenal biopsies were taken for histological assessment and
      maltase, sucrase, lactase and trehalase estimation.
    explanation: Documents coupled biopsy histology and enzyme measurement.
  - reference: PMID:10884712
    reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activity is significantly reduced in untreated coeliac disease and recovers with
      treatment with a gluten-free diet.
    explanation: Establishes the central secondary-deficiency confounder.
- name: Oral trehalose challenge with breath hydrogen and methane
  description: >-
    A 25-g oral trehalose challenge with symptom recording and breath hydrogen/methane
    measurement has discriminated symptom-defined intolerance in a small study. It is
    not a standardized routine diagnostic test: validated doses, concentrations, and
    comparison with a gold standard are unavailable, and small-intestinal bacterial
    overgrowth can produce a misleading hydrogen rise.
  diagnosis_term:
    preferred_term: Breath Test
    term:
      id: NCIT:C116515
      label: Breath Test
  evidence:
  - reference: PMID:10522609
    reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 25-g oral trehalose load test was performed in 64 subjects. The 19 experiencing
      clear symptoms constituted the trehalose-intolerant subjects.
    explanation: Documents the challenge protocol and symptom-defined study group.
  - reference: PMID:24443064
    reference_title: "Fructose, trehalose and sorbitol malabsorption."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      neither studies comparing this test with a gold standard, nor validated doses and
      concentrations to be used, are available.
    explanation: Review evidence for the lack of validated breath-test standards.

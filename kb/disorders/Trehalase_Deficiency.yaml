name: Trehalase Deficiency
creation_date: "2026-07-06T00:00:00Z"
category: Mendelian
synonyms:
- Congenital trehalase deficiency
- Isolated trehalose intolerance
- Trehalose intolerance
- Diarrhea-vomiting due to trehalase deficiency
description: >-
  Primary intestinal trehalase deficiency is an exposure-dependent disorder of
  trehalose digestion. Reduced alpha,alpha-trehalase activity at the small-intestinal
  brush border allows ingested trehalose to reach the colon, where osmotic water
  movement can cause diarrhea and microbial fermentation can cause abdominal pain,
  distention, and flatulence. Symptoms are episodic and require dietary trehalose;
  reduced enzyme activity can therefore be clinically silent. The molecular and
  inheritance evidence is unusually limited and internally conflicting: dominant and
  recessive transmission are both reported, and no TREH variant has an expert-reviewed
  pathogenic classification. This entry is restricted to primary isolated deficiency
  and does not merge common activity-modifying TREH genotypes or secondary reduction of
  trehalase from celiac villous injury into the Mendelian disease entity.
disease_term:
  preferred_term: diarrhea-vomiting due to trehalase deficiency
  term:
    id: MONDO:0012803
    label: diarrhea-vomiting due to trehalase deficiency
parents:
- Gastrointestinal Disease
inheritance:
- name: Reported autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The current Orphanet-derived NCBI GTR record assigns autosomal dominant
    inheritance. Historical father-to-son biochemical deficiency is compatible with
    vertical transmission, but the family was not molecularly resolved; a dominant
    TREH variant mechanism is therefore not established.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/gtr/conditions/C0268187/
    reference_title: "alpha, alpha-Trehalase deficiency - NIH Genetic Testing Registry (GTR) - NCBI"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      alpha, alpha-Trehalase deficiency ... Modes of inheritance ... Autosomal
      dominant inheritance ... Source: Orphanet
    explanation: >-
      The current GTR condition record reports autosomal dominant inheritance from
      Orphanet; this is a structured-source assertion rather than a molecularly solved
      pedigree.
- name: Reported autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Later literature describes trehalase deficiency as recessive and identified six
    adults homozygous for a predicted TREH splice-loss allele. Those participants were
    not tested for intestinal enzyme activity or challenged with trehalose, so the
    observation does not by itself establish clinical recessive penetrance.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5600291/fullTextXML
    reference_title: "Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trehalase deficiency, an autosomal recessive trait, leads to abdominal pain,
      distention, and flatulence after trehalose ingestion. We identified six
      participants homozygous for a deletion of a splice acceptor site
    explanation: >-
      The paper explicitly labels the trait recessive and reports homozygous predicted
      loss of TREH, but it did not establish the trehalase-deficiency phenotype in the
      six carriers.
genetic:
- name: TREH-associated primary trehalase deficiency
  gene_term:
    preferred_term: TREH
    term:
      id: hgnc:12266
      label: TREH
  association: Biologically implicated; clinical gene-disease validity remains limited
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  features: >-
    TREH encodes the brush-border enzyme that hydrolyzes trehalose. Human knockout and
    structured disease resources implicate the gene, but direct cosegregation of a
    classified pathogenic variant with enzyme-confirmed symptomatic disease has not
    been demonstrated.
  variants:
  - name: NM_007180.3:c.90-9_106del
    type: splice acceptor deletion
    description: >-
      Predicted loss-of-function deletion observed homozygously in six PROMIS adults.
      ClinVar currently reports conflicting classifications (one pathogenic and one
      uncertain-significance submission), notes a South Asian gnomAD allele frequency
      of 0.011, and states that no phenotype specific to the homozygotes was provided.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/clinvar/variation/488190/
      reference_title: "VCV000488190.3 - ClinVar - NCBI"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Conflicting classifications of pathogenicity ... Pathogenic (1); Uncertain
        significance (1)
      explanation: >-
        ClinVar's current aggregate classification prevents treating this allele as an
        established pathogenic variant.
    - reference: url:https://www.ncbi.nlm.nih.gov/clinvar/variation/488190/
      reference_title: "VCV000488190.3 - ClinVar - NCBI"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        No phenotypic information specific to the homozygous individuals was provided.
      explanation: >-
        The ClinVar submission summary records the decisive clinical-evidence limitation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/gtr/conditions/C0268187/
    reference_title: "alpha, alpha-Trehalase deficiency - NIH Genetic Testing Registry (GTR) - NCBI"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Isolated trehalose intolerance due to deficiency of trehalase (TREH; 275360)
    explanation: >-
      The structured condition record links the deficient enzyme and TREH, but does not
      provide primary variant-level validity evidence.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5600291/fullTextXML
    reference_title: "Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified six participants homozygous for a deletion of a splice acceptor site
    explanation: >-
      Establishes homozygous predicted TREH loss in humans, but not enzyme-confirmed or
      symptom-confirmed trehalase deficiency.
- name: TREH activity-modifying common variation
  gene_term:
    preferred_term: TREH
    term:
      id: hgnc:12266
      label: TREH
  association: Modifier of measured trehalase activity; clinical penetrance unestablished
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  features: >-
    Common TREH variation, especially rs2276064, is associated with graded trehalase
    activity. Genotype-frequency studies do not demonstrate symptomatic primary
    trehalase deficiency and must not be interpreted as disease prevalence.
  variants:
  - name: rs2276064
    type: single nucleotide variant
    description: >-
      Common activity-associated allele used as a proxy for low trehalase activity in
      population-genetic studies; it is not an established Mendelian pathogenic allele.
    evidence:
    - reference: PMID:23468175
      reference_title: "Identification of genetic variation that determines human trehalase activity and its association with type 2 diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        plasma trehalase activity was highly associated with three SNPs: rs2276064,
        rs117619140 and rs558907
      explanation: Directly supports rs2276064 as an activity-associated variant.
  evidence:
  - reference: PMID:23468175
    reference_title: "Identification of genetic variation that determines human trehalase activity and its association with type 2 diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four tag SNPs in TREH were genotyped in these subjects and plasma trehalase
      activity was highly associated with three SNPs: rs2276064, rs117619140 and rs558907
    explanation: >-
      Demonstrates association with measured activity without demonstrating clinical
      trehalose intolerance.
  - reference: PMID:36880131
    reference_title: "Prevalence of genetically determined trehalase deficiency in populations of Siberia and Russian Far East."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The G→A substitution in the rs2276064 locus was shown to affect trehalase activity,
      which is the highest (29.3 IU/g protein) in the carriers of the GG*TREH genotype,
      the lowest (10.2 IU/g) in the AA homozygotes, and moderate in the AG heterozygotes
      (20.5 IU/g).
    explanation: >-
      Reports the graded genotype-activity relationship while leaving clinical
      expression unresolved.
pathophysiology:
- name: Reduced intestinal brush-border trehalase activity
  description: >-
    The defining biochemical lesion is low alpha,alpha-trehalase activity on the apical
    brush border of small-intestinal enterocytes. Primary isolated deficiency must be
    distinguished from the broad reduction of disaccharidases caused by villous injury.
  genes:
  - preferred_term: TREH
    term:
      id: hgnc:12266
      label: TREH
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: epithelium of small intestine
    term:
      id: UBERON:0001902
      label: epithelium of small intestine
  cellular_components:
  - preferred_term: brush border membrane
    term:
      id: GO:0031526
      label: brush border membrane
  molecular_functions:
  - preferred_term: alpha,alpha-trehalase activity
    term:
      id: GO:0004555
      label: alpha,alpha-trehalase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: disaccharide catabolic process
    term:
      id: GO:0046352
      label: disaccharide catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:3227291
    reference_title: "Trehalase deficiency in Greenland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small-intestinal surgical biopsy specimens from 97 adult Greenlanders showed an
      incidence of trehalase deficiency in at least 8%.
    explanation: >-
      Directly documents low trehalase activity in human small-intestinal biopsy tissue.
  - reference: PMID:10884712
    reference_title: "Intestinal trehalase activity in a UK population: establishing a normal range and the effect of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The normal range (mean +/- 2 SD) was 4.79-37.12 U/g protein.
    explanation: >-
      Defines assay-specific duodenal activity in a normal-histology referral cohort.
  downstream:
  - target: Unhydrolyzed trehalose reaches the colon
    description: >-
      Low small-bowel trehalase leaves more ingested trehalose undigested and permits it
      to pass into the colon.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        if it is low, trehalose is maldigested and more trehalose is passed into the colon
      explanation: >-
        Directly states the proximal enzyme-to-luminal-substrate step.
- name: Unhydrolyzed trehalose reaches the colon
  description: >-
    Trehalose that is not hydrolyzed into absorbable glucose remains luminal and reaches
    the colon. This node is exposure-gated: low activity alone does not produce the
    downstream gastrointestinal mechanisms without dietary trehalose.
  chemical_entities:
  - preferred_term: trehalose
    term:
      id: CHEBI:27082
      label: trehalose
    modifier: INCREASED
  evidence:
  - reference: PMID:10522609
    reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      trehalose is maldigested and more trehalose is passed into the colon
    explanation: >-
      Supports delivery of maldigested trehalose to the colon.
  downstream:
  - target: Osmotic water flow into the colon
    description: Maldigested luminal trehalose creates an osmotic water load.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the maldigested trehalose, which causes osmotic water flow into the colon
      explanation: Directly states the osmotic mechanism.
  - target: Microbial fermentation of maldigested trehalose
    description: >-
      Gas-producing colonic organisms conditionally ferment the delivered trehalose.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        symptoms will arise if there are bacteria capable of producing gases from
        maldigested trehalose
      explanation: Directly supports microbiota-dependent gas production.
- name: Osmotic water flow into the colon
  description: >-
    Osmotically active maldigested trehalose draws water into the colonic lumen,
    increasing stool water and producing loose stools or diarrhea.
  evidence:
  - reference: PMID:10522609
    reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      osmotic water flow into the colon, resulting in loose stools and diarrhea
    explanation: Directly links the osmotic step to diarrhea.
  downstream:
  - target: Diarrhea after trehalose ingestion
    description: Increased colonic water produces loose stools or diarrhea.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        osmotic water flow into the colon, resulting in loose stools and diarrhea
      explanation: Directly supports the mechanism-to-phenotype edge.
- name: Microbial fermentation of maldigested trehalose
  description: >-
    Colonic gas production from trehalose is conditional on the resident microbiota.
    Without gas-producing organisms, the literature predicts that distention and gas
    expulsion will not occur even when trehalose is maldigested.
  evidence:
  - reference: PMID:10522609
    reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If colonic bacteria cannot produce gases, then distention of the abdomen and
      intestinal gas expulsion as eructations and flatus will not occur.
    explanation: Establishes the microbiota-dependent conditionality of gaseous symptoms.
  downstream:
  - target: Abdominal distention after trehalose ingestion
    description: Fermentation-derived gas distends the abdomen.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        distention of the abdomen and intestinal gas expulsion as eructations and flatus
      explanation: Directly supports the gas-to-distention edge.
  - target: Flatulence after trehalose ingestion
    description: Fermentation-derived gas is expelled as flatus.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10522609
      reference_title: "Low trehalase activity is associated with abdominal symptoms caused by edible mushrooms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        distention of the abdomen and intestinal gas expulsion as eructations and flatus
      explanation: Directly supports the gas-to-flatulence phenotype edge.
  - target: Abdominal pain after trehalose ingestion
    description: >-
      Distention and altered luminal water plausibly contribute to abdominal pain, but
      the evidence does not resolve a single direct pain mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5600291/fullTextXML
      reference_title: "Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        leads to abdominal pain, distention, and flatulence after trehalose ingestion
      explanation: >-
        Supports the phenotype association but not a uniquely resolved pain pathway.

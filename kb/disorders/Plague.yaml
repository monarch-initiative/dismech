    explanation: Confirms tetracyclines among the most effective plague treatments.
- name: Supportive Care
  description: >
    Intensive supportive care including fluid resuscitation, vasopressor
    support, and management of DIC complications for severe septicemic
    and pneumonic plague.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:3716968
    reference_title: Plague.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Successful treatment of plaque depends on early diagnosis, institution of
      effective antibiotics (streptomycin, chloramphenicol, tetracycline or
      gentamicin) and adequate supportive care.
    explanation: >-
      Names adequate supportive care as one of the three things successful
      plague treatment depends on, which is what this treatment record asserts.
      Quoted with the source's own "plaque" misspelling, as an exact quote
      requires.
  notes: >-
    No `target_mechanisms` link is recorded. Fluid resuscitation, vasopressors
    and coagulopathy management plainly address the septicemic node, but no
    cited source states which mechanism supportive care acts on, and a
    `target_mechanisms` link is a claim about the mechanism rather than about
    the treatment. PMID:3716968 establishes the treatment itself and is cited
    above. Searched PubMed 2026-11-09 with
    `plague[Title/Abstract] AND ("supportive care"[Title/Abstract] OR "fluid
    resuscitation"[Title/Abstract] OR vasopressor*[Title/Abstract])` (21 hits)
    and `plague[Title/Abstract] AND "shock management"[Title/Abstract]` (0
    hits). Of the 21, PMID:3716968 is the only plague-specific item naming
    supportive care; the rest are COVID-19 and unrelated critical-care papers,
    or use "plague" figuratively. PMID:42842561 says management of inhalational
    threats including pneumonic plague "requires prompt supportive care", but
    covers several pathogens in one sentence and names no mechanism either.
- name: Investigational F1-V Subunit and Attenuated Plague Vaccination
  description: >-
    Recombinant F1-V subunit vaccines (targeting the F1 capsular fraction and
    the LcrV component of the type III secretion system) and live-attenuated EV
    strains induce neutralizing anti-F1 and anti-LcrV immunity that blocks
    Yersinia pestis T3SS translocation and antiphagocytic replication.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Type III Secretion System Deployment
    treatment_effect: INHIBITS
    description: >-
      Anti-LcrV antibodies induced by F1-V vaccination neutralize the needle-tip
      V antigen of the Yersinia pestis type III secretion system, preventing Yop
      effector translocation into host phagocytes.
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The V antigen (LcrV) is an essential part of the T3SS. Two doses of
        these F1/V vaccines provide 100% protection to mice against bubonic and
        pneumonic plague [108–111].
      explanation: >-
        Establishes that LcrV is an essential T3SS component targeted by F1/V
        subunit vaccines that confer complete protection against bubonic and
        pneumonic plague in murine models.
  - target: Phagocytosis Inhibition and Bacterial Replication
    treatment_effect: INHIBITS
    description: >-
      Opsonizing antibodies against the F1 capsular antigen and LcrV overcome
      antiphagocytic resistance and block extracellular bacterial replication.
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The V antigen (LcrV) is an essential part of the T3SS. Two doses of
        these F1/V vaccines provide 100% protection to mice against bubonic and
        pneumonic plague [108–111].
      explanation: >-
        Demonstrates that immunization against the F1 capsule and LcrV T3SS tip
        antigen prevents fatal bacterial replication in bubonic and pneumonic
        plague challenge models.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because rF1-V and SV1 have completed phase I and II trials, WHO recently
      gathered experts to define principles on how to build phase III plague
      vaccine efficacy trials in endemic countries [113].
    explanation: >-
      Documents clinical development of recombinant F1-V plague vaccines through
      Phase I/II trials and WHO Phase III trial planning.
transmission:
- name: Flea-borne Transmission
  description: >
    Primary route of plague transmission. Infected fleas (primarily Xenopsylla
    cheopis, the Oriental rat flea) transmit Y. pestis to humans during blood
    meals. The bacterium forms a biofilm in the flea's proventriculus, which
    is regurgitated during feeding.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas from rodent reservoirs
    explanation: Confirms the flea-borne vector transmission route from rodent reservoirs.
- name: Respiratory Droplet Transmission
  description: >
    Person-to-person transmission occurs via respiratory droplets from
    patients with pneumonic plague. This is the only form of plague that
    can spread directly between humans.
  notes: >
    Person-to-person respiratory droplet transmission is a defining feature
    of pneumonic plague; this is textbook knowledge not directly quoted in
    the abstract cache of cited references.
- name: Direct Contact
  description: >
    Handling infected animals or tissues, particularly during skinning or
    butchering of infected rodents or other mammals.
prevalence:
- population: Global
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    Approximately 2,000 cases reported annually to the WHO worldwide (a global
    annual case count, not a point prevalence; ~0.25 cases per million people).
    Endemic foci in Africa, Asia, and the Americas concentrate the burden well
    above the global rate. Madagascar, Democratic Republic of Congo, and Peru
    report the majority of modern cases.
  evidence:
  - reference: PMID:12951845
    reference_title: "Yersinia pestis and the plague."
    supports: SUPPORT
    snippet: Approximately 2,000 cases of plague are reported each year to the World Health Organization, and concern has been raised about the possible use of Y pestis as an agent of bioterrorism.
    explanation: Confirms approximately 2,000 annual cases reported globally.
progression:
- phase: Onset
  incubation_days: 1-7
  notes: >
    Incubation period is typically 1-7 days for bubonic plague (usually 2-6
    days) and 1-3 days for pneumonic plague. Onset is acute with sudden
    fever, chills, and malaise.
- phase: Acute
  notes: >
    Rapid progression to bubo formation (bubonic), septicemia, or
    pneumonia depending on clinical form. Without treatment, pneumonic
    plague is fatal within 48 hours and bubonic plague within a week.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: the rapid onset of death in the absence of antibiotic treatment (less than a week for bubonic plague and <48 h for pneumonic plague)
    explanation: Confirms the timeline of untreated plague progression.
- phase: Resolution or Death
  notes: >
    With prompt antibiotic treatment, most patients recover. Without
    treatment, case fatality approaches 100% for pneumonic and septicemic
    forms. Even with treatment, overall case fatality is approximately 20%.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    snippet: The case fatality rate was 20% overall.
    explanation: Confirms 20% overall case fatality even with treatment.
notes: >-
  The Black Death pandemic (1346-1353) is the single greatest mortality event
  in recorded history, killing 30-50% of the European population. Ancient DNA
  studies have confirmed Y. pestis as the causative agent and revealed that
  plague lineages were already circulating in Neolithic Europe thousands of
  years before the Black Death. Y. pestis evolved from the enteric pathogen
  Yersinia pseudotuberculosis less than 6,000 years ago through gene gain and
  genome reduction events.

  Three phenotypes are left without an upstream causal edge because no cited
  source states how the disease produces them. Purpura is attributed in this
  entry's own description to the coagulopathy, and PMID:37943880 reports the
  coagulopathy's frequency, but neither it nor any other reference this entry
  cites states the coagulopathy-to-purpura link. Searching the cached text of
  all 15 cited references for purpura, ecchymosis, splenomegaly, dyspnea and
  shortness of breath returns no hit for any of the five terms, so Splenomegaly
  and Dyspnea have no source here either. PMID:37943880 does report
  "respiratory distress, arrest or failure", which is a different finding and a
  different HPO term from dyspnea. The Pneumonia phenotype's own description
  also names dyspnea as part of the pneumonic picture; that mention is
  unsourced here in the same way the purpura one is.

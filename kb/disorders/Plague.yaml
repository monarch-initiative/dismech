    supports: SUPPORT
    snippet: Yersinia pestis is the cause of plague, an illness that may manifest in bubonic, pneumonic, or septicemic form.
    explanation: Establishes Y. pestis as the causative agent of all forms of plague.
agent_life_cycle:
  description: >-
    Yersinia pestis persists in enzootic sylvatic cycles between burrowing
    rodents and their fleas, with mice, rats, prairie dogs and ground squirrels
    among the hosts of established foci. Periodic epizootics kill off rodent
    colonies, which raises human exposure. The flea acquires the bacterium in a
    bloodmeal, a biofilm forms in the proventriculus, and a blocked flea
    regurgitates bacteria into the next bite wound; blockage is most frequent in
    the rat flea Xenopsylla cheopis. Humans are accidental hosts. Which small
    rodents, if any, sustain the agent between epizootics is unsettled.
  hosts:
  - preferred_term: rats
    role: Rodent host of the enzootic cycle in established plague foci
    term:
      id: NCBITaxon:10114
      label: Rattus
  - preferred_term: prairie dogs
    role: >-
      Burrowing rodent host; colonies suffer plague die-offs, the epizootic that
      raises human risk
    term:
      id: NCBITaxon:45478
      label: Cynomys
  - preferred_term: Oriental rat flea
    role: >-
      Flea vector; proventricular blockage and regurgitative transmission are
      most frequent in this species
    term:
      id: NCBITaxon:163159
      label: Xenopsylla cheopis
  - preferred_term: Homo sapiens
    role: >-
      Accidental host, infected by an infected flea; not part of the enzootic
      cycle
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Oriental rat flea (Xenopsylla cheopis)
  - Other rodent fleas of the enzootic sylvatic cycle
  life_cycle_stages:
  - name: Enzootic sylvatic maintenance in burrowing rodents and their fleas
    description: >-
      Worldwide plague foci persist through a rodent-flea-rodent cycle among
      burrowing rodents, which are the natural reservoirs of the agent.
    evidence:
    - reference: PMID:39179552
      reference_title: Transovarial transmission of Yersinia pestis in its flea vector Xenopsylla cheopis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Worldwide plague foci persist due to enzootic sylvatic cycles consisting of burrowing rodents and their respective flea vectors"
      explanation: >-
        States the enzootic cycle as the reason foci persist, naming burrowing
        rodents and their fleas as its two components.
    - reference: PMID:39179552
      reference_title: Transovarial transmission of Yersinia pestis in its flea vector Xenopsylla cheopis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Numerous flea species and primarily rodent hosts are implicated in maintaining the sylvatic plague cycle, with mice, rats, prairie dogs, and ground squirrels commonly found in established plague foci"
      explanation: >-
        Names the rodent hosts of established foci, including the rats and
        prairie dogs bound above.
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Plague is a vector-borne illness transmitted by fleas to a variety of wildlife rodents, which represent natural reservoirs for the disease in a wide range of habitats around the world"
      explanation: >-
        Independently assigns the reservoir role to wildlife rodents and the
        transmitting role to fleas.
  - name: Epizootic amplification and rodent die-off
    description: >-
      Plague periodically sweeps through a rodent colony and kills it off. These
      epizootics are what bring infected fleas into contact with people. Whether
      any small rodent carries the agent between epizootics is disputed.
    evidence:
    - reference: PMID:18689662
      reference_title: Exposure of small rodents to plague during epizootics in black-tailed prairie dogs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Plague, caused by the bacterium Yersinia pestis, causes die-offs of colonies of prairie dogs (Cynomys ludovicianus)."
      explanation: >-
        Establishes the epizootic die-off in prairie dog colonies, the host bound
        above for this stage.
    - reference: PMID:18689662
      reference_title: Exposure of small rodents to plague during epizootics in black-tailed prairie dogs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "It has been argued that other small rodents are reservoirs for plague, spreading disease during epizootics and maintaining the pathogen in the absence of prairie dogs; yet there is little empirical support for distinct enzootic and epizootic cycles."
      explanation: >-
        Records that the interepizootic maintenance host is proposed rather than
        demonstrated, which is why no such host is bound here.
  - name: Flea acquisition, proventricular blockage and transmission to humans
    description: >-
      A flea acquires the bacterium in a bloodmeal; a biofilm occludes the
      proventriculus so that the blocked flea regurgitates bacteria into the
      bite wound. Blockage occurs most often in the rat flea.
    evidence:
    - reference: PMID:39179552
      reference_title: Transovarial transmission of Yersinia pestis in its flea vector Xenopsylla cheopis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Blockage and transmission by blocked fleas was most frequent in the rat flea, Xenopsylla cheopis, with more than 50% occurrence"
      explanation: >-
        Quantifies blockage in the specific flea species bound as the principal
        vector, which is the mechanism of the transmitting step.
  evidence:
  - reference: PMID:39179552
    reference_title: Transovarial transmission of Yersinia pestis in its flea vector Xenopsylla cheopis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Yersinia pestis, the causative agent of plague, is endemic in certain regions due to a stable transmission cycle between rodents and their associated fleas."
    explanation: >-
      Gives the overall two-component framework this block records: a stable
      rodent-flea cycle that keeps the agent endemic.
has_subtypes:
- name: Bubonic
  display_name: Bubonic Plague
  curated_in: Bubonic_Plague
  subtype_term:
    preferred_term: bubonic plague
    term:
      id: MONDO:0001112
      label: bubonic plague
  description: >
    Most common form, resulting from flea bite inoculation. Y. pestis travels
    to regional lymph nodes, causing painful swollen lymph nodes (buboes),
    fever, and prostration. Without treatment, case fatality is approximately
    40-60%. Curated as a standalone entry, Bubonic_Plague (MONDO:0001112),
    which carries the flea-mediated inoculation to lymph-node colonization to
    bubo mechanism.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    snippet: Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%) plague, with associated case fatality rates of 17%, 27%, and 38%, respectively.
    explanation: Confirms bubonic plague as the most common clinical form at 63% of cases.
- name: Septicemic
  display_name: Septicemic Plague
  curated_in: Septicemic_Plague
  subtype_term:
    preferred_term: septicemic plague
    term:
      id: MONDO:0005956
      label: septicemic plague
  description: >
    Bloodstream infection without prominent bubo formation, or secondary to
    bubonic plague. Characterized by disseminated intravascular coagulation,
    purpura, and multi-organ failure. Highest case fatality among treated
    patients. Curated as a standalone entry, Septicemic_Plague (MONDO:0005956),
    which carries the immune-evasion to bloodstream-infection to DIC mechanism.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    snippet: Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%) plague, with associated case fatality rates of 17%, 27%, and 38%, respectively.
    explanation: Septicemic plague accounts for approximately 5% of cases but carries the highest treated case fatality rate at 38%.
- name: Pneumonic
  display_name: Pneumonic Plague
  curated_in: Pneumonic_Plague
  subtype_term:
    preferred_term: pneumonic plague
    term:
      id: MONDO:0001024
      label: pneumonic plague
  description: >
    Infection of the lungs, either primary (from aerosol inhalation) or
    secondary (hematogenous spread from bubo). Transmissible person-to-person
    via respiratory droplets. Rapidly fatal without treatment within 48 hours.
    Curated as a standalone entry, Pneumonic_Plague (MONDO:0001024), which
    carries the inhaled-or-hematogenous lung seeding to exudative
    bronchopneumonia mechanism.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: the rapid onset of death in the absence of antibiotic treatment (less than a week for bubonic plague and <48 h for pneumonic plague)
    explanation: Confirms the extreme lethality and rapid progression of pneumonic plague.
pathophysiology:
- name: Flea-Mediated Transmission
  description: >
    Y. pestis is transmitted to humans through the bite of an infected flea.
    The bacterium colonizes the flea midgut and forms a biofilm that blocks
    the proventriculus, causing the flea to regurgitate bacteria into the
    bite wound during feeding attempts.
  locations:
  - preferred_term: Skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Type III Secretion System Deployment
    description: >
      After inoculation into the dermis, Y. pestis deploys its type III
      secretion system upon contact with host immune cells.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas from rodent reservoirs, Y. pestis emerged <6000 years ago from an enteric bacterial ancestor through events of gene gain and genome reduction.
    explanation: Establishes flea-mediated vector transmission as the primary route of Y. pestis infection.
- name: Type III Secretion System Deployment
  description: >
    Upon contact with host immune cells, Y. pestis deploys a type III
    secretion system (T3SS) encoded on the pYV/pCD1 virulence plasmid. The
    T3SS forms a needle-like injectisome that directly delivers Yop effector
    proteins into the cytoplasm of target immune cells.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Dendritic Cell
    term:
      id: CL:0000451
      label: dendritic cell
  downstream:
  - target: Yop Effector Injection and Immune Subversion
    description: >
      The T3SS injects multiple Yop effector proteins that each target
      distinct immune cell signaling pathways.
  evidence:
  - reference: PMID:24198067
    reference_title: "The Yersinia pestis type III secretion system: expression, assembly and role in the evasion of host defenses."
    supports: SUPPORT
    snippet: Within the host cell, the Yop effector proteins function to inhibit bacterial phagocytosis and to suppress the production of pro-inflammatory cytokines.
    explanation: Describes the T3SS-delivered Yop effectors and their functions within host cells.
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: A complex set of virulence determinants, including the Yersinia outer-membrane proteins (Yops), the broad-range protease Pla, pathogen-associated molecular patterns (PAMPs), and iron capture systems play critical roles in the molecular strategies that Y. pestis employs to subvert the human immune system
    explanation: Confirms the multi-factorial virulence strategy including Yops and Pla protease.
- name: Yop Effector Injection and Immune Subversion
  description: >
    Individual Yop effector proteins target distinct immune cell functions.
    YopH dephosphorylates focal adhesion proteins to block phagocytosis.
    YopE and YopT inactivate Rho GTPases controlling cytoskeleton dynamics.
    YopJ/YopP prevents NF-kappaB activation, suppressing pro-inflammatory
    cytokine production.
  biological_processes:
  - preferred_term: Phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  - preferred_term: Innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: DECREASED
  downstream:
  - target: Phagocytosis Inhibition and Bacterial Replication
    description: >
      Combined Yop-mediated suppression of phagocytosis allows unrestricted
      extracellular bacterial replication.
  evidence:
  - reference: PMID:10922034
    reference_title: "Molecular and cell biology aspects of plague."
    supports: SUPPORT
    snippet: YopH is a powerful phosphotyrosine phosphatase playing an antiphagocytic role by dephosphorylating several focal adhesion proteins. YopE and YopT contribute to antiphagocytic effects by inactivating GTPases controlling cytoskeleton dynamics. YopP/YopJ plays an anti-inflammatory role by preventing the activation of the transcription factor NF-kappaB.
    explanation: Details the specific molecular mechanisms of each Yop effector in immune evasion.
    evidence_source: IN_VITRO
- name: Phagocytosis Inhibition and Bacterial Replication
  description: >
    The combined effect of Yop-mediated immune subversion is that
    macrophages and neutrophils cannot effectively engulf and kill Y. pestis.
    This allows unrestricted extracellular bacterial replication at the
    inoculation site, enabling dissemination to draining lymph nodes.
  biological_processes:
  - preferred_term: Defense response to Gram-negative bacterium
    term:
      id: GO:0050829
      label: defense response to Gram-negative bacterium
    modifier: DECREASED
  downstream:
  - target: Lymph Node Colonization and Bubo Formation
    description: >
      Bacteria disseminate from the inoculation site via lymphatics to
      regional lymph nodes, where they replicate massively.
- name: Lymph Node Colonization and Bubo Formation
  description: >
    After immune evasion at the inoculation site, Y. pestis disseminates to
    draining lymph nodes where it replicates massively, causing the
    characteristic painful swollen lymph nodes (buboes) that define bubonic
    plague.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: Lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  downstream:
  - target: Bubo (Lymphadenopathy)
    causal_link_type: DIRECT
    description: >-
      Massive replication of Y. pestis inside the draining lymph node, with the
      accompanying inflammatory response, is what enlarges the node into the
      painful bubo that patients present with.
    evidence:
    - reference: PMID:33298527
      reference_title: "Yersinia pestis: the Natural History of Plague."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Transmission from one host to another relies mainly on infected flea
        bites, inducing typical painful, enlarged lymph nodes referred to as
        buboes, followed by septicemic dissemination of the pathogen.
      explanation: >-
        States that flea-bite inoculation induces the painful, enlarged lymph
        node that is the bubo, which is the step this edge records.
    - reference: PMID:37943880
      reference_title: A systematic review of the clinical profile of patients with bubonic plague and the outcome measures used in research settings.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The most commonly reported symptom at baseline was the presence of a
        bubo-an enlarged lymph node-which was recorded in 1216/1265 (96%) cases
      explanation: >-
        Defines the bubo as an enlarged lymph node and shows it in 96% of
        confirmed bubonic plague patients, so the lymph-node step reaches the
        clinical feature in nearly every case.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fever is the systemic feature that accompanies the established bubo in
      bubonic plague. The steps between lymph-node replication and the febrile
      response are not stated in the sources cited here.
    evidence:
    - reference: PMID:37943880
      reference_title: A systematic review of the clinical profile of patients with bubonic plague and the outcome measures used in research settings.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Following the presence of a bubo, fever was the most frequently reported
        systemic feature at baseline, present in 1004/1279 (78%) patients
      explanation: >-
        Places fever after the bubo as the commonest systemic feature in
        confirmed bubonic plague, so the bubonic route reaches this phenotype.
        Indirect because the quote reports frequency rather than the mechanism
        producing the fever.
  - target: Systemic Spread and Septicemic Plague
    description: >
      Bacteria can escape from lymph nodes into the bloodstream, causing
      septicemia, disseminated intravascular coagulation, and multi-organ
      failure.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    snippet: allowing unrestricted bacterial replication in lymph nodes (bubonic plague) and in lungs (pneumonic plague)
    explanation: Confirms that lymph nodes are a primary site of Y. pestis replication in bubonic plague.
  - reference: PMID:12951845
    reference_title: "Yersinia pestis and the plague."
    supports: SUPPORT
    snippet: Yersinia pestis is the cause of plague, an illness that may manifest in bubonic, pneumonic, or septicemic form. Plague has killed an estimated 200 million humans throughout history
    explanation: Establishes that bubonic form involves lymph node involvement and that plague has been historically devastating.
- name: Systemic Spread and Septicemic Plague
  description: >
    When Y. pestis enters the bloodstream from infected lymph nodes or
    directly, it causes septicemia with disseminated intravascular
    coagulation, purpura (historically giving the disease its 'Black Death'
    name), and multi-organ failure.
  cell_types:
  - preferred_term: Monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Escape of Y. pestis from the infected lymph node into the bloodstream is
      what produces the clinical sepsis syndrome, including septic shock in the
      most severe cases.
    evidence:
    - reference: PMID:33298527
      reference_title: "Yersinia pestis: the Natural History of Plague."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Transmission from one host to another relies mainly on infected flea
        bites, inducing typical painful, enlarged lymph nodes referred to as
        buboes, followed by septicemic dissemination of the pathogen.
      explanation: >-
        Places septicemic dissemination downstream of the bubo, so it is the
        stage this node describes. Indirect because the quote names the
        dissemination rather than the sepsis syndrome it presents as.
    - reference: PMID:37943880
      reference_title: A systematic review of the clinical profile of patients with bubonic plague and the outcome measures used in research settings.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Fewer patients presented with clinical signs and symptoms indicative of
        severe illness at baseline, such as seizure (4/34, 12%), septic shock
        (5/59, 8%), and respiratory distress, arrest or failure (3/5, 60%).
      explanation: >-
        Documents septic shock in a cohort of bubonic plague patients, which is
        the clinical endpoint of the systemic spread this node describes. It is
        indirect because the quote reports frequency rather than the mechanism.
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Consumptive coagulopathy develops as systemic infection progresses. The
      intermediate steps between bacteremia and the coagulopathy are not
      established in the sources cited here.
    evidence:
    - reference: PMID:37943880
      reference_title: A systematic review of the clinical profile of patients with bubonic plague and the outcome measures used in research settings.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        After the baseline assessment, respiratory distress, arrest or failure,
        for example, was recorded in 8/65 (12%) patients and disseminated
        intravascular coagulation was recorded in 7/41 (17%) patients.
      explanation: >-
        Shows disseminated intravascular coagulation appearing as plague
        progresses beyond presentation, which is the systemic phase this node
        records. Indirect because the quote gives frequency, not mechanism.
  - target: Pneumonic Plague
    description: >
      Hematogenous spread to the lungs can cause secondary pneumonic plague.
  evidence:
  - reference: PMID:10922034
    reference_title: "Molecular and cell biology aspects of plague."
    supports: SUPPORT
    snippet: "YopP/YopJ plays an anti-inflammatory role by preventing the activation of the transcription factor NF-kappaB. It also induces rapid apoptosis of macrophages."
    explanation: Yop-mediated macrophage apoptosis contributes to uncontrolled bacterial dissemination and systemic disease.
    evidence_source: IN_VITRO
  - reference: PMID:15207311
    reference_title: "Plague."
    supports: SUPPORT
    snippet: Bubonic disease, pneumonic plague, and septicemic plague are seen in addition to a number of other less common manifestations.
    explanation: Confirms the clinical spectrum including septicemic plague.
- name: Pneumonic Plague
  description: >
    Lung infection with Y. pestis, arising either from hematogenous spread
    (secondary) or direct inhalation of infectious respiratory droplets
    (primary). Pneumonic plague is characterized by fulminant pneumonia,
    hemoptysis, and respiratory failure. It is the only form transmissible
    person-to-person and is nearly 100% fatal without early antibiotic
    treatment.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: DECREASED
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: Lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Once the pre-inflammatory phase gives way to a pro-inflammatory one, the
      neutrophils recruited into the infected lung are what produce the
      pneumonia and the accompanying tissue necrosis.
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        during the pro-inflammatory stage associated with clinical symptoms,
        neutrophils attracted to lungs are responsible for the pneumonia and
        necrosis destroying the lungs
      explanation: >-
        Names the recruited neutrophils as the cause of the pneumonia itself,
        which is exactly the mechanism-to-feature step this edge asserts. The
        review attributes this to murine pneumonic plague work, so it is graded
        as model-organism evidence.
    - reference: PMID:23041039
      reference_title: "Plague: history and contemporary analysis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        plague must be suspected in all areas where plague is endemic in rodents
        when patients present with adenitis or with pneumonia with a bloody
        expectorate
      explanation: >-
        Establishes that human pneumonic plague presents as pneumonia, so the
        phenotype this edge reaches is a human one and not only a murine
        finding. Indirect because the quote states the presenting picture rather
        than the neutrophil step that produces it.
  - target: Cough
    causal_link_type: DIRECT
    description: >-
      Plague pneumonia produces a cough, characteristically productive with
      blood-stained sputum, which is the finding that prompts the diagnosis in
      an endemic area.
    evidence:
    - reference: PMID:10807389
      reference_title: "Plague as a biological weapon: medical and public health management. Working Group on Civilian Biodefense."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        An aerosolized plague weapon could cause fever, cough, chest pain, and
        hemoptysis with signs consistent with severe pneumonia 1 to 6 days after
        exposure.
      explanation: >-
        Names cough among the features produced by Y. pestis lung infection.
        Graded OTHER and indirect because this is an expert working group's
        projection of an aerosol-release scenario rather than an observed cohort.
    - reference: PMID:23041039
      reference_title: "Plague: history and contemporary analysis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL

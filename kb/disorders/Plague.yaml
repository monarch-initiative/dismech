treatments:
- name: Aminoglycoside Antibiotics
  description: >
    Streptomycin and gentamicin are first-line treatments for plague.
    Aminoglycosides have the longest track record of efficacy against
    Y. pestis infection.
  treatment_term:
    preferred_term: aminoglycoside antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Phagocytosis Inhibition and Bacterial Replication
    treatment_effect: INHIBITS
    description: >-
      Aminoglycosides kill Y. pestis directly, so they act on the step the Yop
      effectors create: unrestricted bacterial replication that host phagocytes
      can no longer contain. Their effect depends on being given before that
      replication has seeded the bloodstream or the lung.
    evidence:
    - reference: PMID:32435802
      reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Treatment with aminoglycosides such as streptomycin or gentamicin is effective when initiated early in illness but can have serious side effects.
      explanation: >-
        The dependence of benefit on early treatment is what identifies the
        bacterial-replication step as the point of action. Indirect because the
        quote reports clinical efficacy rather than the bactericidal mechanism.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    snippet: Treatment with aminoglycosides such as streptomycin or gentamicin is effective when initiated early in illness but can have serious side effects.
    explanation: Confirms aminoglycosides as effective first-line treatment for plague.
  - reference: PMID:32435800
    reference_title: "Treatment of Human Plague: A Systematic Review of Published Aggregate Data on Antimicrobial Efficacy, 1939-2019."
    supports: SUPPORT
    snippet: Tetracyclines, chloramphenicol, and aminoglycosides were associated with the lowest case fatality rates of all antimicrobials used for treatment of plague.
    explanation: Aggregate data confirms aminoglycosides among the most effective treatments for plague.
- name: Tetracycline Antibiotics
  description: >
    Doxycycline and other tetracyclines are effective alternatives for
    plague treatment and prophylaxis. Used when aminoglycosides are
    contraindicated.
  treatment_term:
    preferred_term: tetracycline antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Phagocytosis Inhibition and Bacterial Replication
    treatment_effect: INHIBITS
    description: >-
      Tetracyclines act on the same step as the aminoglycosides, suppressing the
      bacterial replication that Yop-mediated immune subversion permits. They are
      the alternative where an aminoglycoside is contraindicated.
    evidence:
    - reference: PMID:32435800
      reference_title: "Treatment of Human Plague: A Systematic Review of Published Aggregate Data on Antimicrobial Efficacy, 1939-2019."
      supports: SUPPORT
      directness: INDIRECT

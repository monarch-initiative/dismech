- name: ERAP2 Evolutionary Selection
  description: >
    The Black Death pandemic of 1346-1353 exerted powerful selective pressure
    on the human genome, particularly at immune loci. The rs2549794 variant
    in ERAP2 was strongly selected, as the allele producing a full-length
    ERAP2 transcript conferred improved ability to control intracellular
    Y. pestis in macrophages. This same protective allele is now associated
    with increased susceptibility to autoimmune diseases, representing a
    classic case of antagonistic pleiotropy shaped by past pandemic selection.
  biological_processes:
  - preferred_term: Immune response
    term:
      id: GO:0006955
      label: immune response
  - preferred_term: Proteolysis
    term:
      id: GO:0006508
      label: proteolysis
  downstream:
  - target: Phagocytosis Inhibition and Bacterial Replication
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Host ERAP2 genotype sets how well macrophages contain Y. pestis once it
      is taken up, so it modulates this node rather than initiating it: carriers
      of the truncated transcript control intracellular bacteria less well, and
      replication proceeds further. The antigen-processing steps between the
      aminopeptidase and bacterial containment are not resolved in the cited
      work.
    evidence:
    - reference: PMID:36261521
      reference_title: "Evolution of immune genes is associated with the Black Death."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The selected allele for one of these variants, rs2549794, is associated
        with the production of a full-length (versus truncated) ERAP2
        transcript, variation in cytokine response to Y. pestis and increased
        ability to control intracellular Y. pestis in macrophages.
      explanation: >-
        Ties the ERAP2 allele to how well macrophages control intracellular
        Y. pestis, which is the bacterial-replication node this edge points at.
        Indirect because the measurement is macrophage control in vitro rather
        than replication in a patient.
  notes: >
    ERAP2 encodes an endoplasmic reticulum aminopeptidase involved in
    antigen processing for MHC class I presentation. The selected haplotype B
    produces a full-length functional protein, while the alternative produces
    a truncated, non-functional transcript.
  evidence:
  - reference: PMID:36261521
    reference_title: "Evolution of immune genes is associated with the Black Death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The selected allele for one of these variants, rs2549794, is associated with the production of a full-length (versus truncated) ERAP2 transcript, variation in cytokine response to Y. pestis and increased ability to control intracellular Y. pestis in macrophages.
    explanation: Directly demonstrates that ERAP2 rs2549794 was selected during the Black Death and confers functional immune advantage against Y. pestis.
  - reference: PMID:36261521
    reference_title: "Evolution of immune genes is associated with the Black Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that protective variants overlap with alleles that are today associated with increased susceptibility to autoimmune diseases, providing empirical evidence for the role played by past pandemics in shaping present-day susceptibility to disease.
    explanation: Demonstrates antagonistic pleiotropy where plague-protective alleles now increase autoimmune disease risk.
phenotypes:
- name: Bubo (Lymphadenopathy)
  category: Signs and Symptoms
  description: >
    Painful, swollen lymph nodes (buboes) in the inguinal, axillary, or
    cervical region, characteristic of bubonic plague.
  subtype: Bubonic
  notes: >-
    The bubo is now described by cited sources rather than only named: PMID:37943880
    defines it as an enlarged lymph node, present in 1216/1265 (96%) of confirmed
    bubonic plague patients and painful in 230/320 (72%), most often inguinal
    (54%), and PMID:23041039 describes the typical bubo as a painful, red,
    nonfluctuating adenitis. The causal edge from the lymph-node colonization
    node carries that evidence.
  phenotype_term:
    preferred_term: Bubo (swollen lymph node)
    term:
      id: HP:0002716
      label: Lymphadenopathy
- name: Fever
  category: Signs and Symptoms
  description: High fever, often with rigors, accompanying all forms of plague.
  notes: >

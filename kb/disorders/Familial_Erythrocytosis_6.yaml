      The guidance this row records.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result the patient underwent hydroxyurea treatment for several years due to erythrocytosis, a treatment which was not needed after the establishment of the Hb Crete heterozygoty diagnosis."
    explanation: >-
      The documented harm from cytoreduction given on a mistaken diagnosis in a
      carrier of an HBB high-affinity variant.
- name: Smoking cessation, physical activity and avoidance of blood donation
  description: >-
    The non-pharmacological measures are the ones with a mechanistic rationale
    specific to this disease. Smoking adds a carbon monoxide load that shifts the
    dissociation curve further left on top of the variant, so cessation is the
    first recommendation; physical activity is encouraged. Blood donation is
    prohibited rather than merely discouraged: a donation is an uncontrolled
    phlebotomy for the donor, and the unit would carry high-affinity hemoglobin
    to a recipient. There is no contraindication to air travel, altitude or
    pregnancy.

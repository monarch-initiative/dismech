- discussion_id: normal_erythropoietin_in_a_hypoxic_drive
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Increased Erythropoietin Output
  - diagnosis#Serum erythropoietin measurement
  prompt: >-
    Why is serum erythropoietin usually normal in a disease whose mechanism is a
    sustained hypoxic drive to erythropoietin production?
  rationale: >-
    The chain predicts raised erythropoietin, and the measurement usually does
    not show it: the median in the 41-patient single-centre series was 10.4
    mIU/L, within the
    reference interval, and single-kindred reports describe a normal
    concentration. The reconciliation generally offered is that a compensated
    steady state needs only a small sustained excess of drive, so once the red
    cell mass has risen the concentration returns toward normal and what remains
    abnormal is that it is not suppressed. That account is plausible and
    untested here: nobody has measured erythropoietin in these carriers against
    a red-cell-mass-matched comparison group, which is what would show
    inappropriate non-suppression rather than normality. The practical
    consequence is firmer than the physiology: a normal erythropoietin must not
    be used to exclude the diagnosis. A competing reading is on the record and
    cannot be weighed here: a 2019 letter on Hb Coimbra carriers argues that a
    high erythropoietin marks the patients who develop vascular complications
    (PMID:31445464), and the French cohort likewise found higher erythropoietin
    in patients with prior thrombosis. The letter's cached record carries no
    abstract text, so nothing from it is quoted and its argument has not been
    assessed; it is named so the next curator can fetch it.
  proposed_experiments:
  - experiment_id: ecyt6_epo_nonsuppression_test
    name: Erythropoietin against a red-cell-mass-matched comparison
    description: >-
      Measure serum erythropoietin in genotyped carriers against controls
      matched for hemoglobin and hematocrit, and repeat after standardised
      phlebotomy. An appropriate hypoxic drive should show a rise after the red
      cell mass falls, which a primary erythrocytosis would not.
  evidence:
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "serum erythropoietin and p50 were 18 g/dL/52.9% (16-21.9/48-66), 10.4 mIU (4-36.3), and 20 mmHg (12-25), respectively"
    explanation: >-
      The measured erythropoietin concentrations that the mechanism has to
      account for.
  - reference: PMID:26370867
    reference_title: A Japanese Family with Congenital Erythrocytosis Caused by Haemoglobin Bethesda.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's serum erythropoietin level was normal, and the JAK2 V617F mutation was not detected."
    explanation: >-
      An independent kindred in which erythropoietin was frankly normal.
- discussion_id: electrophoretically_silent_variants
  kind: KNOWLEDGE_GAP
  attaches_to:
  - diagnosis#Hemoglobin separation by HPLC or capillary electrophoresis
  - diagnosis#p50 measurement with arterial blood gas
  prompt: >-
    How many high oxygen affinity hemoglobin erythrocytoses are missed because
    the variant is electrophoretically silent and p50 measurement is not
    available?
  rationale: >-
    Two diagnostic weaknesses compound. A charge-neutral substitution runs with
    hemoglobin A on HPLC, so the usual first-line test is normal; and direct p50
    measurement, which would reveal the functional lesion whatever the
    separation shows, exists in only about half of the specialist laboratories
    that were surveyed. Phenotypic assessment found 93 per cent of the variants
    that were diagnosed in those laboratories - but that denominator is the
    diagnosed ones, so it says nothing about the silent variants in patients
    whose workup stopped at a normal separation. Those patients end up labelled
    idiopathic erythrocytosis, or treated for polycythemia vera. The gap is a
    denominator. The nearest thing to it is the series of 75 patients labelled
    idiopathic erythrocytosis whose globin genes were sequenced despite a p50
    reported as normal, which found three variants - but those patients had
    already been through a workup, so the figure is a residual yield rather than
    a miss rate. A 2009 letter reports the same design (PMID:19734427,
    "Identification of high oxygen affinity hemoglobin variants in the
    investigation of patients with erythrocytosis"); its cached record carries
    no abstract text, so nothing from it can be quoted here and its numbers have
    not been read. What is missing is a consecutive unselected series with the
    phenotype-first result reported alongside the sequencing result.
  proposed_experiments:
  - experiment_id: ecyt6_unselected_sequencing_yield
    name: Globin sequencing yield in unselected JAK2-negative erythrocytosis
    description: >-
      Sequence the globin genes in a consecutive, unselected series of
      JAK2-negative erythrocytosis patients irrespective of the hemoglobin
      separation result, and report the yield of high-affinity variants
      stratified by whether the separation had been normal.
  evidence:
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are also some electrophoretically silent variants due to their neutral charge"
    explanation: >-
      Establishes the silent-variant failure mode of the first-line test.
  - reference: PMID:28057606
    reference_title: "Diagnostic approach to hemoglobins with high oxygen affinity: experience from France and Belgium and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A direct measure of the p50 with the Hemox-Analyzer is included in the diagnostic approach of half of the laboratories only, because of the poor availability of this apparatus."
    explanation: >-
      The second half of the gap: the functional test that would catch a silent
      variant is often unavailable.
- discussion_id: pregnancy_and_fetal_oxygen_transfer
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Familial Erythrocytosis 6
  - pathophysiology#Reduced Oxygen Unloading to Tissues
  prompt: >-
    Does a maternal high oxygen affinity hemoglobin compromise oxygen transfer
    across the placenta, and is the reported outcome record large enough to say?
  rationale: >-
    Placental oxygen transfer works on the difference in affinity between
    maternal and fetal hemoglobin: fetal hemoglobin binds oxygen more tightly
    than maternal, and oxygen moves down that gradient. A maternal variant that
    raises maternal affinity narrows the gradient, so the mechanism predicts
    impaired transfer, and a fetus who has not inherited the variant is the one
    at risk. Against that prediction, the reported experience is reassuring: 23
    pregnancies in the single-centre series gave 78 per cent live births with no
    fetal
    loss attributed to the erythrocytosis, and the review literature records no
    increase in morbidity or mortality during pregnancy. But 23 pregnancies
    cannot exclude a modest effect on growth, and nobody has reported birth
    weights or fetal growth trajectories stratified by whether the fetus
    inherited the variant - which is the comparison the mechanism points to.
  proposed_experiments:
  - experiment_id: ecyt6_pregnancy_outcomes_by_fetal_genotype
    name: Pregnancy outcome stratified by fetal genotype
    description: >-
      Collect birth weight, growth centile and pregnancy complications in
      pregnancies of genotyped carriers, stratified by fetal genotype, across
      the specialist laboratories that hold these kindreds. The fetuses who did
      not inherit the allele are the informative group.
  evidence:
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 23 pregnancies recorded, 78% resulted in live births and no fetal loss was attributed to erythrocytosis."
    explanation: >-
      The whole of the reported outcome record, and the reason the concern is
      recorded as a gap rather than as a phenotype.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Increased morbidity or mortality have not been observed during pregnancy"
    explanation: >-
      The review's summary of pregnancy outcome, consistent with the series and
      equally limited by its size.
notes: >-
  NAMING: the entry takes the numbered series name, in the form used by the
  sibling entries Familial Erythrocytosis 4 and Familial Erythrocytosis 5. No
  gene-related dyad is established: MONDO carries only "erythrocytosis 6" and
  "ECYT6" as synonyms, ClinGen's preferred label for the curated relationship is
  the MONDO label, OMIM's title is the numbered one, and there is no GeneReviews
  chapter. The descriptive names used in the literature - "high oxygen affinity
  hemoglobin erythrocytosis", "high-oxygen-affinity hemoglobinopathy" - are
  broader than this entry, because they also cover the alpha-globin variants
  that OMIM and ClinGen separate as ECYT7, so adopting one would break the scope
  rule. Both are kept in synonyms.
  SCOPE: the entry curates the HBB form only. The 41-patient single-centre
  series mixes
  beta-chain (83 per cent) and alpha-chain (17 per cent) patients; its pooled
  figures are cited here because the series is overwhelmingly beta and no
  beta-only breakdown is published, and that composition is stated in the
  evidence explanations rather than hidden.
  BASELINE: no GeneReviews chapter covers this disease. The offline Bookshelf
  check plus a live PubMed title search over the entry's name, disease term and
  synonyms return no chapter naming it, and the check reports CANDIDATE_CHAPTER
  only from the HBB gene search; the two candidates it surfaces,
  "Sickle Cell Disease" and "Beta-Thalassemia", are other HBB diseases and are
  not a baseline for this one, so they are deliberately not cited. The phenotype
  baseline is taken from the reported clinical series and cohorts and from the
  review literature instead.
  WHAT IS DELIBERATELY NOT CURATED: hemolysis is left out as a disease
  phenotype although it appears in carriers of unstable high-affinity variants
  such as Hb Koln, because in those patients it belongs to the instability of
  the variant rather than to the oxygen-affinity mechanism this entry models,
  and the unstable hemoglobin diseases are a separate ClinGen entity.
  Splenomegaly is carried, at 5 per cent in the French cohort, but with the
  same caveat in its description and with no causal edge into it: no node in
  this chain produces a large spleen, and the mechanism that plausibly does -
  variant instability with hemolysis - is the one this entry does not model. It
  is therefore the entry's one deliberately unconnected phenotype. Raised HbA1c
  with normal glucose, an analytical interference caused by some variants, is
  likewise not a phenotype of the disease. No animal model is
  curated. No knock-in mouse carrying a patient high-affinity HBB allele appears
  in any source read for this entry, and the transgenic high-affinity hemoglobin
  lines that exist were built as oxygen-delivery models rather than as models of
  this disease. That is a statement about the sources read, not a verified
  absence: the ClinGen curation cited here says its gene-disease assertion is
  supported in part by animal-model evidence and lists four PMIDs (11747442,
  6644819, 3997804, 22203977) that this entry has not fetched or assessed.
  Whoever next passes over this entry should read them before relying on the
  absence.
  MODULE CONFORMANCE: none. The module directory on origin/main has no module
  for hypoxia sensing, erythropoietin signalling or erythroid expansion, and the
  nodes of this chain are not instances of any existing module node. Two
  candidates were considered and rejected for stated reasons.
  pulmonary_vascular_remodeling is the only module the sibling erythrocytosis
  entries reach, and this disease does not run it: pulmonary hypertension is a
  feature of the oxygen-sensing erythrocytoses (EPAS1, VHL) and is not reported
  in high oxygen affinity hemoglobin carriers. thrombogenesis exists and this
  entry does curate a thrombosis phenotype, but conformance needs a
  pathophysiology node to attach to, and this entry deliberately models no
  thrombogenic mechanism - the link from a raised hematocrit to a thrombotic
  event is exactly what the sources leave unsettled, which is why it is an
  edge with unknown intermediates and a CONTROVERSY discussion rather than a
  mechanism chain.

diagnosis:
- name: p50 measurement with arterial blood gas
  description: >-
    A reduced p50 with a normal arterial oxygen saturation is the diagnostic
    pivot: it demonstrates the functional lesion and excludes the
    cardiopulmonary and methemoglobin causes of erythrocytosis at the same time.
    Direct p50 measurement with a Hemox-Analyzer is available in only about half
    of specialist laboratories, so in practice it is often estimated from a
    blood gas analyser.
  diagnosis_term:
    preferred_term: p50 and blood gas measurement
    term:
      id: NCIT:C217391
      label: Diagnostic Blood Gas Testing
  evidence:
  - reference: PMID:26370867
    reference_title: A Japanese Family with Congenital Erythrocytosis Caused by Haemoglobin Bethesda.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the differential diagnosis, we recommend the estimation of the P50 value as a practical and useful test."
    explanation: >-
      Recommends p50 estimation as the practical discriminating test, which is
      what this row records.
  - reference: PMID:28057606
    reference_title: "Diagnostic approach to hemoglobins with high oxygen affinity: experience from France and Belgium and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A direct measure of the p50 with the Hemox-Analyzer is included in the diagnostic approach of half of the laboratories only, because of the poor availability of this apparatus."
    explanation: >-
      Records the limited availability of direct p50 measurement, the practical
      constraint on this test.
  - reference: PMID:41347984
    reference_title: "JAK2 wild-type erythrocytosis: concept, differential diagnosis, diagnostic steps, and treatment approaches."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "oxygen tension at 50% hemoglobin saturation (p50) discerns between high oxygen-affinity hemoglobin variants, 3-bisphosphoglycerate deficiency, methemoglobinemia, and PIEZO1 mutations (low p50) and germline oxygen-sensing pathway/other rare mutations (normal p50)"
    explanation: >-
      States the discriminating role of the p50 within the hereditary
      erythrocytosis differential, and that it separates this group from the
      oxygen-sensing erythrocytoses rather than identifying the gene.
  - reference: PMID:35052472
    reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study shows that in real life conditions, due to pre-analytical contingencies, a venous P50 value that is classified as being normal may not be sufficient to rule out a diagnosis of HOAH."
    explanation: >-
      Contradicts the use of this test as an exclusion: three of 75 patients
      with a p50 reported as normal in fact carried a high-affinity variant,
      because of pre-analytical errors.
- name: Hemoglobin separation by HPLC or capillary electrophoresis
  description: >-
    Phenotypic hemoglobin separation finds most high-affinity variants, but not
    all: a charge-neutral substitution is electrophoretically silent and runs
    with hemoglobin A. A normal separation therefore does not exclude the
    diagnosis, which is the commonest technical trap in this disease.
  diagnosis_term:
    preferred_term: hemoglobin variant separation by HPLC or capillary electrophoresis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:28057606
    reference_title: "Diagnostic approach to hemoglobins with high oxygen affinity: experience from France and Belgium and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic assessment by laboratory techniques remains a main step in their diagnosis as it enables the finding of 93% of them in the questioned laboratories"
    explanation: >-
      Quantifies how much of the diagnostic work phenotypic separation does, and
      by implication how much it misses.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are also some electrophoretically silent variants due to their neutral charge"
    explanation: >-
      States the silent-variant limitation that makes a normal separation
      uninformative.
  - reference: PMID:35052472
    reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic studies of Hb are also useful, but electrophoretic analysis can be normal in 1/3 of cases."
    explanation: >-
      Quantifies the miss rate of hemoglobin separation, which is why it cannot
      be the last test.
- name: HBB sequencing
  description: >-
    Sequencing the beta-globin gene either identifies the variant or excludes
    the diagnosis, and it is the only step that does so definitively. It is
    needed whatever the hemoglobin separation shows, both because of the silent
    variants and because the alpha-globin genes have to be considered in the
    same workup.
  diagnosis_term:
    preferred_term: germline HBB sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28057606
    reference_title: "Diagnostic approach to hemoglobins with high oxygen affinity: experience from France and Belgium and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beta- and alphaglobin genes analysis by molecular biology techniques is essential as it either allows a quick and definite identification of the variant or definitely excludes the diagnosis."
    explanation: >-
      States the definitive role of globin-gene sequencing in this diagnosis.
  - reference: PMID:35052472
    reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we recommend the systematic sequencing of the HBB, HBA1 and HBA2 genes in the exploration of idiopathic erythrocytosis."
    explanation: >-
      The recommendation this row records, arrived at from the three cases the
      phenotype-first workup had missed.
  - reference: PMID:41978276
    reference_title: "Hemoglobin San Diego: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is confirmed through DNA sequencing of globin genes to identify the specific missense mutation."
    explanation: >-
      Confirms sequencing as the confirmatory test, in a case where it ended
      years of diagnostic uncertainty.
- name: JAK2 screening to exclude polycythemia vera
  description: >-
    The erythrocytosis workup begins by excluding polycythemia vera with JAK2
    screening across exons 12 to 15; a longstanding erythrocytosis with a family
    history is what moves a hereditary cause up the differential. The step
    matters here because patients with a high-affinity hemoglobin have been
    treated for a myeloproliferative neoplasm they did not have.
  diagnosis_term:
    preferred_term: JAK2 mutation screening
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The foremost step is excluding polycythemia vera (PV) with JAK2 mutation screening (exons 12-15)"
    explanation: >-
      Establishes JAK2 screening as the first step of the workup in which this
      diagnosis is made.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hereditary erythrocytosis should be considered in longstanding erythrocytosis with a positive family history; causes include EPOR mutations (subnormal Epo), high oxygen affinity hemoglobin variants, PIEZO1 mutations, 2,3-bisphosphoglycerate deficiency, methemoglobinemia, and germline oxygen sensing pathway mutations (HIF2A-PHD2-VHL)"
    explanation: >-
      Places high oxygen affinity hemoglobin variants in the hereditary
      erythrocytosis differential, with the clinical features that prompt the
      search.
- name: Serum erythropoietin measurement
  description: >-
    Erythropoietin is measured in every erythrocytosis workup but discriminates
    poorly here. It is normal or only modestly raised, because the compensated
    steady state requires only a small sustained excess of drive, so a normal
    result neither supports nor excludes the diagnosis.
  diagnosis_term:
    preferred_term: serum erythropoietin measurement
    term:
      id: NCIT:C74855
      label: Erythropoietin Measurement
  evidence:
  - reference: PMID:26370867
    reference_title: A Japanese Family with Congenital Erythrocytosis Caused by Haemoglobin Bethesda.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's serum erythropoietin level was normal, and the JAK2 V617F mutation was not detected."
    explanation: >-
      A normal erythropoietin in a confirmed HBB high-affinity variant carrier,
      which is why the measurement is a weak discriminator.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Serum erythropoietin (Epo) levels are variably informative."
    explanation: >-
      Current guidance on the limited discriminating value of the measurement in
      JAK2-unmutated erythrocytosis.
environmental:
- name: Tobacco smoking
  description: >-
    Smoking is not a cause of this disease, but it acts on it twice over. It
    adds a carbon monoxide load, and carboxyhemoglobin shifts the oxygen
    dissociation curve further to the left on top of the variant, so the same
    genotype should unload less oxygen in a smoker; and in the pooled cohorts
    smoking is associated with the two things carriers are actually at risk of -
    hyperviscosity symptoms and arterial thrombosis. That is why smoking
    cessation, rather than phlebotomy, is the first management measure in the
    review literature.
  disease_effect: EXACERBATES
  causal_role: MODIFIER
  exposure_term:
    preferred_term: Tobacco smoking exposure
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Abnormal thrombosis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking was independently associated with arterial thrombotic events on
      multivariable analysis of the pooled literature. Recorded as predisposing
      rather than triggering, and with unknown intermediates, because nothing in
      the cited work measures a step between the exposure and the event in these
      patients.
    evidence:
    - reference: PMID:42719225
      reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "smoking (OR = 15.25 ... were independently associated with arterial thromboses"
      explanation: >-
        The multivariable association between smoking and arterial thrombosis in
        carriers of these variants.
  - target: Increased Whole Blood Viscosity
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smokers were over-represented among the patients reporting hyperviscosity
      symptoms. Whether that is a viscosity effect, a carbon monoxide effect on
      oxygen unloading, or confounding by cardiovascular risk is not resolved by
      the cited analysis, which is why the intermediates are left unknown.
    evidence:
    - reference: PMID:42719225
      reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with hyperviscosity‐related symptoms had higher hemoglobin levels (18.9 vs. 17.0 g/dL, P < 0.001) and hematocrit (56% vs. 51%, P < 0.001) and were more likely smokers (31% vs. 17%, P = 0.042"
      explanation: >-
        Smokers are over-represented among symptomatic patients, alongside the
        hemoglobin and hematocrit difference.
  evidence:
  - reference: PMID:27637720
    reference_title: High oxygen affinity hemoglobins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disease management should be personalized, and it should primarily depend on smoking cessation and physical activity."
    explanation: >-
      Smoking cessation is the first management measure recommended for this
      disease, which is the practical consequence of this exposure.
  - reference: PMID:42719225
    reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As in another study, 8 age and cardiovascular risk factors were associated with thrombosis, emphasizing the role of cardiovascular disease prevention in patients with HOAH."
    explanation: >-
      Places smoking within the cardiovascular risk factors that carry the
      demonstrable risk in this disease.
  notes: >-
    The carbon monoxide mechanism is stated here as the physiological reason for
    the recommendation, not as a measured finding in these patients: no study
    has measured carboxyhemoglobin or p50 in smoking versus non-smoking
    carriers of a high-affinity variant.
differential_diagnoses:
- name: Polycythemia vera
  disease_term:
    preferred_term: polycythemia vera
    term:
      id: MONDO:0009891
      label: acquired polycythemia vera
  description: >-
    The misdiagnosis that matters, because it leads to cytoreductive treatment
    that this disease does not need. Polycythemia vera is a clonal
    myeloproliferative neoplasm with a JAK2 mutation and commonly raised white
    cell and platelet counts; high-affinity hemoglobin erythrocytosis is
    lifelong, familial, confined to the erythroid lineage and JAK2 negative. A
    patient in one series was given hydroxyurea for years before the hemoglobin
    variant was found.
  distinguishing_features:
  - JAK2 mutation in exons 12 to 15, absent in high oxygen affinity hemoglobin
  - Normal p50 in polycythemia vera, low in high oxygen affinity hemoglobin
  - Longstanding erythrocytosis with a family history rather than acquired onset
  - A hormonally driven, JAK2-unmutated marrow rather than a clonal neoplasm
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The foremost step is excluding polycythemia vera (PV) with JAK2 mutation screening (exons 12-15)"
    explanation: Establishes exclusion of polycythemia vera as the first diagnostic step.
- name: Primary familial and congenital polycythemia (EPOR)
  disease_term:
    preferred_term: primary familial polycythemia due to EPO receptor mutation
    term:
      id: MONDO:0007572
      label: primary familial polycythemia due to EPO receptor mutation
  description: >-
    The other dominant hereditary erythrocytosis with a normal oxygen
    dissociation curve. EPOR variants make the erythroid progenitor
    hypersensitive to erythropoietin, so the hormone is subnormal rather than
    normal or raised, and the p50 is normal. Curated in
    Primary_Familial_Polycythemia_Due_To_EPO_Receptor_Mutation.
  distinguishing_features:
  - Subnormal serum erythropoietin, against normal or modestly raised here
  - Normal p50, against a low p50 here
  - Lesion intrinsic to the erythroid progenitor rather than to hemoglobin
  evidence:
  - reference: PMID:41347984
    reference_title: "JAK2 wild-type erythrocytosis: concept, differential diagnosis, diagnostic steps, and treatment approaches."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Subnormal serum erythropoietin (EPO) suggests an EPO receptor mutation."
    explanation: The laboratory feature that separates the EPOR disease from this one.
- name: Germline oxygen-sensing pathway erythrocytosis (VHL, EGLN1, EPAS1)
  disease_term:
    preferred_term: Chuvash polycythemia
    term:
      id: MONDO:0009892
      label: Chuvash polycythemia
  description: >-
    Chuvash polycythemia (VHL), EGLN1-related erythrocytosis and ECYT4 (EPAS1)
    reach a raised red cell mass through pseudohypoxic activation of
    erythropoietin transcription with a structurally normal hemoglobin, so the
    p50 is normal. They also carry risks this disease does not: pulmonary
    hypertension and, for EGLN1, chromaffin tumour predisposition. Curated in
    Chuvash_Polycythemia, Familial_Erythrocytosis_4 and the EGLN1 entry.
  distinguishing_features:
  - Normal p50, which is what separates this group from high oxygen affinity hemoglobin
  - Pulmonary hypertension reported, not a feature of high oxygen affinity hemoglobin
  - Causal variant in VHL, EGLN1 or EPAS1 rather than in a globin gene
  evidence:
  - reference: PMID:41347984
    reference_title: "JAK2 wild-type erythrocytosis: concept, differential diagnosis, diagnostic steps, and treatment approaches."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "oxygen tension at 50% hemoglobin saturation (p50) discerns between high oxygen-affinity hemoglobin variants, 3-bisphosphoglycerate deficiency, methemoglobinemia, and PIEZO1 mutations (low p50) and germline oxygen-sensing pathway/other rare mutations (normal p50)"
    explanation: >-
      The p50 is the discriminator between this disease and the oxygen-sensing
      group, and also groups it with the other low-p50 causes below.
- name: Bisphosphoglycerate mutase deficiency and other low-p50 causes
  description: >-
    The other conditions that present with a low p50: bisphosphoglycerate mutase
    deficiency, in which the effector rather than the hemoglobin is at fault,
    the methemoglobinemias - including hemoglobin M disease, the other HBB
    structural hemoglobinopathy, curated in Hemoglobin_M_Disease - and PIEZO1
    variants. The p50 therefore narrows the
    differential to this group but does not identify the disease within it,
    which is what globin sequencing is for. The alpha-globin high-affinity
    variants (ECYT7) sit in the same group and are separated only by which gene
    is sequenced.
  distinguishing_features:
  - Normal globin gene sequence in bisphosphoglycerate mutase deficiency and PIEZO1 disease
  - Raised methemoglobin fraction with a saturation gap in the methemoglobinemias
  - HBA1 or HBA2 rather than HBB variant in the alpha-globin form, ECYT7
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "causes include EPOR mutations (subnormal Epo), high oxygen affinity hemoglobin variants, PIEZO1 mutations, 2,3-bisphosphoglycerate deficiency, methemoglobinemia, and germline oxygen sensing pathway mutations (HIF2A-PHD2-VHL)"
    explanation: The hereditary erythrocytosis differential this row enumerates.
- name: Acquired hypoxic and drug-induced erythrocytosis
  description: >-
    Smoking, chronic cardiopulmonary disease, obstructive sleep apnoea, high
    altitude and renal artery stenosis drive erythropoietin appropriately, and
    testosterone, erythropoiesis-stimulating agents and SGLT2 inhibitors do so
    pharmacologically. These are commoner than this disease by orders of
    magnitude and are excluded on history, arterial saturation and a normal p50
    - and smoking matters twice over here, because in a carrier it adds a carbon
    monoxide load on top of the variant.
  distinguishing_features:
  - Acquired rather than lifelong course, with no family history
  - Normal p50 once the exposure is accounted for
  - An identifiable exposure, drug or cardiopulmonary cause on history
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Acquired erythrocytosis results from central (cardiopulmonary disease) or peripheral (renal artery stenosis) hypoxia, Epo-producing tumors (renal cell carcinoma) or drugs (testosterone, sodium glucose co-transporter-2 inhibitors (SGLT2-i), erythropoiesis stimulating agents)."
    explanation: Enumerates the acquired causes that have to be excluded.
treatments:
- name: Therapeutic phlebotomy for symptom control
  description: >-
    Phlebotomy lowers the hematocrit and with it blood viscosity, and is used
    for relief of headache, dizziness and paresthesia rather than to reach a
    target hematocrit. The case against routine phlebotomy is specific to this
    disease: the red cell mass is the compensation for a left-shifted
    dissociation curve, so removing it removes oxygen-carrying capacity the
    patient is relying on, and the single-centre series found no correlation
    between
    hematocrit or phlebotomy and symptoms and concluded that the therapeutic
    value of phlebotomy is limited.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Increased Red Cell Mass
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy acts on the last node of the chain, leaving the raised oxygen
      affinity that drives it untouched.
  - target: Increased Whole Blood Viscosity
    treatment_effect: INHIBITS
    description: >-
      The intended effect: lowering viscosity to relieve the symptoms
      attributed to it.
  target_phenotypes:
  - preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  - preferred_term: Paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  evidence:
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of phlebotomy should be individualized and only utilized in the case of the presence of hyperviscosity symptoms, since the resulting hematocrit and blood viscosity reduction may relieve headache, dizziness, and paresthesia and improve quality of life"
    explanation: >-
      The symptom-control indication, and the mechanism by which phlebotomy is
      expected to work.
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The current study does not implicate Hgb/Hct level as a major contributor of morbidity in HOA hemoglobinopathy-associated erythrocytosis and suggests limited therapeutic value for phlebotomy."
    explanation: >-
      The largest single-centre series contradicts a general benefit from
      phlebotomy in this disease, which is why the row is scoped to symptom
      control.
  - reference: PMID:42719225
    reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with hyperviscosity‐related symptoms, symptom recurrence during follow‐up was less frequent in those undergoing phlebotomies (20% vs. 50% in those without phlebotomies, P = 0.001)."
    explanation: >-
      The best evidence that phlebotomy does what this row claims for it:
      symptomatic patients who were phlebotomised had fewer recurrences.
  - reference: PMID:42719225
    reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phlebotomies resulted in symptom relief in 34 patients (79%) with symptoms persisting or worsening in 9 patients (21%)"
    explanation: >-
      Quantifies the symptom response, and the fifth of patients in whom it did
      not work.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cytoreductive therapy should be avoided. Phlebotomy should be considered for symptom control."
    explanation: >-
      Current guidance for JAK2-unmutated erythrocytosis, the class this disease
      belongs to: phlebotomy for symptoms, no cytoreduction.
- name: Low-dose aspirin and cardiovascular risk reduction
  description: >-
    Low-dose aspirin is given on an individualised assessment of thrombotic
    risk, and cardiovascular risk-factor optimisation is advised for
    JAK2-unmutated erythrocytosis generally. There is no trial in this disease,
    and the evidence that the erythrocytosis itself drives thrombosis is weak,
    so this row records inherited guidance rather than a result in high-affinity
    hemoglobin carriers.

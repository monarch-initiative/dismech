    description: >-
      Recorded as indirect with unknown intermediates because the two datasets
      disagree. In the pooled systematic review hematocrit was independently
      associated with venous thrombosis, but not with thrombosis overall, where
      age dominated; the 41-patient single-centre series found no association at
      all. Whatever connects a raised hematocrit to a thrombotic event in this
      disease is therefore not established, and it is at most a partial
      contribution alongside conventional risk factors.

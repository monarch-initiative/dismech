    evidence_source: HUMAN_CLINICAL
    snippet: "Median (range) hemoglobin (Hgb)/hematocrit (Hct), serum erythropoietin and p50 were 18 g/dL/52.9% (16-21.9/48-66), 10.4 mIU (4-36.3), and 20 mmHg (12-25), respectively."

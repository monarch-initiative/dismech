      id: MONDO:0054802
      label: erythrocytosis, familial, 7
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      The alpha-globin counterpart: high oxygen affinity hemoglobin
      erythrocytosis caused by HBA1 or HBA2 variants (OMIM 617981). The
      mechanism downstream of the variant is the same left-shifted oxygen
      dissociation curve, but the gene, the number of affected loci and
      therefore the expressed proportion of variant hemoglobin differ, and OMIM
      and ClinGen keep the two as separate concepts. relatedMatch, not
      close/exact, because this entry curates the beta-globin form only.

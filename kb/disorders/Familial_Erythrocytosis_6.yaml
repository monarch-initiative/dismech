- name: Avoidance of cytoreductive therapy
  description: >-
    Hydroxyurea and other cytoreduction have no place here, and the harm is not
    hypothetical: a patient with a high-affinity variant was treated with
    hydroxyurea for years on a mistaken diagnosis of a myeloproliferative
    neoplasm. Recognising the disease is what stops the treatment.

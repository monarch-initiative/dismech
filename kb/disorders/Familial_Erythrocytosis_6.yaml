inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous HBB allele is sufficient: about half the circulating
    beta chains carry the substitution, which is enough to displace the whole
    tetramer population's oxygen dissociation curve. Transmission is vertical
    and the erythrocytosis is usually found in several generations of a kindred -
    a family history was documented in 24 of the 41 patients in the
    41-patient single-centre series. De novo alleles occur, so the absence of a family history does not
    exclude the diagnosis.
  evidence:
  - reference: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
    reference_title: "HBB / erythrocytosis, familial, 6 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, HBB is definitively associated with autosomal dominant erythrocytosis 6."
    explanation: >-
      ClinGen's own summary sentence, which states the autosomal dominant
      inheritance of the HBB-ECYT6 relationship curated against this entry's
      disease_term.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "high-oxygen-affinity hemoglobins are rare and inherited within a dominant autosomal manner, have various clinical presentations, and should always be suspected in patients with erythrocytosis"
    explanation: >-
      States the dominant autosomal transmission of the high-oxygen-affinity
      hemoglobin variants that cause this disease.
  - reference: PMID:35052472
    reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "HOAH shows an autosomal dominant transmission, although the absence of a family history does not rule out the diagnosis since there are de novo forms"
    explanation: >-
      Confirms dominant transmission and records the de novo alleles that make a
      negative family history uninformative.
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family history was documented in 24 patients and history of thrombosis in two (5%)."
    explanation: >-
      How often a family history was documented in the 41-patient
      single-centre series.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate exists. The disease is diagnosed a handful of times a
    year even in the national reference laboratories for hemoglobinopathies, and
    the published experience is case reports and small series. The largest
    single-centre series is 41 patients, of whom 34 carried a beta-globin
    variant; the largest multicentre cohort is 64 patients diagnosed at 16
    French institutions over four decades, and the largest assembled dataset is
    a systematic review pooling 665 individuals from the literature.
    Against that rarity, high oxygen affinity hemoglobin is nonetheless described
    as the leading constitutional cause of erythrocytosis, which says more about
    how rare congenital erythrocytosis is than about how common this disease is.
  evidence:
  - reference: PMID:28057606
    reference_title: "Diagnostic approach to hemoglobins with high oxygen affinity: experience from France and Belgium and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they remain a rare cause of erythrocytosis (1 to 5 positive diagnosis every year in each of the questioned specialized laboratories)"
    explanation: >-
      The only quantitative occurrence figure available: diagnoses per year per
      reference laboratory.
  - reference: PMID:35052472
    reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "High oxygen affinity hemoglobin (HOAH) is the main cause of constitutional erythrocytosis."
    explanation: >-
      Places the disease as the commonest constitutional cause of
      erythrocytosis, the comparative claim the notes qualify.
genetic:
- name: HBB high oxygen affinity missense variants
  gene_term:
    preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous germline missense substitutions in HBB. The alleles are
    numerous and mostly private or family-level: the ClinGen curation of this
    disease counts at least 43 missense, 2 nonsense and 1 indel variants across
    46 probands. Most cluster at three functional sites of the tetramer rather
    than at the heme contacts: the alpha1-beta2 interface across which the
    subunits slide during the T-to-R transition (Hb Malmo beta97, Hb Crete
    beta129), the C-terminal residues whose salt bridges stabilise the deoxy
    state (Hb Bethesda and Hb Rainier at beta145, Hb Hiroshima beta146), and the
    central-cavity 2,3-bisphosphoglycerate binding site. A further group acts
    directly or indirectly on the surroundings of the heme and the oxygen
    binding site; that route is named in the literature but is not modelled as a
    separate branch here, because no beta allele in this entry belongs to it.
    Gene dose matters too: homozygous carriers and compound heterozygotes for a
    high-affinity variant and a thalassemia allele have been described, and in
    them the variant hemoglobin makes up a larger share of the total, which the
    reporting authors link to a more severe erythrocytosis through the formation
    of hybrid tetramers. Hb Malmo, Hb Olympia,
    Hb San Diego and Hb Wood were the beta alleles seen most often in the
    41-patient single-centre series.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
    evidence:
    - reference: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
      reference_title: "HBB / erythrocytosis, familial, 6 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In summary, HBB is definitively associated with autosomal dominant erythrocytosis 6."
      explanation: >-
        ClinGen's Definitive classification of the HBB-ECYT6 relationship,
        curated against MONDO:0054801.
  notes: >-
    Two scoping points. First, ClinGen curates HBB's high-affinity
    erythrocytosis separately from HBB's other disease entities (beta
    thalassemia, sickle cell disease, hemoglobin M disease, unstable hemoglobin
    disease) on the strength of a different molecular mechanism, which is the
    same boundary this entry takes. Second, a high oxygen affinity hemoglobin
    does not always produce erythrocytosis: two thirds of the known high
    affinity variants do not, either because the variant chain is expressed at
    low level or because an unstable variant brings hemolysis that offsets the
    erythroid expansion. The disease concept here is the subset that reaches
    erythrocytosis. The first report of the association, in 1968
    (Stamatoyannopoulos et al., PMID:17795074, Hb Rainier), is named by the
    ClinGen curation and is not cited directly here: the record predates
    structured abstracts and carries no quotable text.
  variants:
  - name: Hb Bethesda
    description: >-
      beta145(HC2) Tyr>His, a C-terminal substitution that removes the tyrosine
      anchoring the deoxy-state salt bridge. Reported in kindreds presenting as
      asymptomatic familial erythrocytosis with a mildly decreased p50.
    evidence:
    - reference: PMID:26370867
      reference_title: A Japanese Family with Congenital Erythrocytosis Caused by Haemoglobin Bethesda.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We herein present a case of congenital erythrocytosis caused by haemoglobin (Hb) Bethesda in a Japanese family."
      explanation: Documents Hb Bethesda as the cause of congenital erythrocytosis in a kindred.
  - name: Hb Malmo
    description: >-
      beta97(FG4) His>Gln, at the alpha1-beta2 sliding interface. The commonest
      beta allele in the 41-patient single-centre series (13 of 41 patients).
    evidence:
    - reference: PMID:34633117
      reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thirty-four (83%) patients carried β-chain (13 Malmo, 4 Olympia, 3 San Diego, 2 Wood)"
      explanation: >-
        Hb Malmo is the most frequent beta-globin allele in the 41-patient
        single-centre series.
  - name: Hb San Diego
    description: >-
      beta109(G11) Val>Met, reported repeatedly as a cause of familial
      erythrocytosis, including as an incidental finding on routine testing.
    evidence:
    - reference: PMID:41978276
      reference_title: "Hemoglobin San Diego: A Case Report and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bidirectional sequencing of the beta-globin gene identified a ß109 (GTG→ATG) valine-to-methionine mutation, consistent with the high-oxygen-affinity hemoglobin variant hemoglobin San Diego."
      explanation: Establishes the HBB genotype of Hb San Diego in a patient with persistent erythrocytosis.
  - name: Hb Olympia
    description: >-
      beta20(B2) Val>Met, the second commonest beta allele in the 41-patient
      single-centre series (4 of 41), and one of the alleles found by sequencing
      in patients who had been labelled idiopathic erythrocytosis.
    evidence:
    - reference: PMID:34633117
      reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thirty-four (83%) patients carried β-chain (13 Malmo, 4 Olympia, 3 San Diego, 2 Wood)"
      explanation: >-
        The allele counts behind the frequency claim: Hb Olympia is second to
        Hb Malmo in this series.
    - reference: PMID:35052472
      reference_title: Importance of Sequencing HBA1, HBA2 and HBB Genes to Confirm the Diagnosis of High Oxygen Affinity Hemoglobin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surprisingly, sequencing detected HOAH in three patients (Hb Olympia in two patients, and Hb St Nazaire in another)."
      explanation: >-
        Hb Olympia detected by globin sequencing in two patients from a series
        of 75 who had been classified as idiopathic erythrocytosis.
    - reference: PMID:15921161
      reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Several examples are provided, specially documented for Hb Olympia [beta20(B2)Val --> Met]"
      explanation: >-
        Independent source for the residue and substitution of this allele.
  - name: Hb Hiroshima
    description: >-
      beta146(HC3) His>Asp, the C-terminal histidine. Removes the residue that
      carries both a deoxy-state salt bridge and the dominant alkaline Bohr
      proton, so carriers have a low p50 with a reduced Bohr effect.
    evidence:
    - reference: PMID:38256595
      reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The DNA analysis identified heterozygosity for Hb Hiroshima CD146 His>Asp (HBB:c.439 C>G), a known high-oxygen-affinity Hb variant."
      explanation: The HBB genotype of Hb Hiroshima in a patient referred for erythrocytosis.
  - name: Hb Crete
    description: >-
      beta129(H7) Ala>Pro. Electrophoretically silent on HPLC because the
      substitution is charge-neutral, which is why the diagnosis can be missed
      on hemoglobin separation alone.
    evidence:
    - reference: PMID:38256595
      reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The subsequent DNA analysis identified heterozygosity for the Hb Crete mutation CD129 G>C (Ala>Pro) (HGVS name: HBB:c.388G>C), a known high-oxygen-affinity Hb variant."
      explanation: >-
        The HBB genotype of Hb Crete, in the patient whose hemoglobin separation
        had shown no variant at all.
  - name: Hb Koln
    description: >-
      beta98(FG5) Val>Met, an unstable high-affinity variant: carriers may have
      splenomegaly and hemolytic features alongside the erythrocytosis.
    evidence:
    - reference: PMID:38256595
      reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The DNA analysis identified heterozygosity for Hb Köln CD98 (G>A) (Val>Met) (HGVS name: HBB:c.295G>A), a known high-oxygen-affinity Hb variant."
      explanation: >-
        The HBB genotype of Hb Koln, in a carrier who had splenomegaly alongside
        the erythrocytosis.
  evidence:
  - reference: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
    reference_title: "HBB / erythrocytosis, familial, 6 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This curation includes at least 43 missense, 2 nonsense, and 1 indel variants reported in 46 probands with AD erythrocytosis in 25 publications"
    explanation: >-
      Source for the size and composition of the reported allelic spectrum.
  - reference: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
    reference_title: "HBB / erythrocytosis, familial, 6 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping & Splitting Working Group, we found differences in molecular mechanisms, inheritance pattern, and phenotypic variability in erythrocytosis 6 relative to other disease entities associated with HBB"
    explanation: >-
      Supports the notes: ClinGen splits HBB high-affinity erythrocytosis from
      the other HBB diseases on mechanism, which is the boundary of this entry.
  - reference: PMID:15921161
    reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A special interest is brought to the dose effect considering the possibility for formation of hybrid tetramers with altered oxygen binding properties."
    explanation: >-
      Source for the gene-dose statement in `features`: how much variant
      hemoglobin is present, and what hybrid tetramers it forms, modifies the
      phenotype.
  - reference: PMID:15921161
    reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Homozygous cases, and patients who are compound heterozygotes for a high oxygen affinity Hb and a thalassemia (thal), are discussed."
    explanation: >-
      Records that homozygous and compound-heterozygous genotypes exist, so the
      HETEROZYGOUS zygosity on the pathophysiology node is the usual case rather
      than the only one.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Concomitant thalassemia may worsen the phenotype, as it decreases the amount of Hb A (cases 2, 3 and 4) and in turn increases the proportion of the high-oxygen-affinity Hb."
    explanation: >-
      The mechanism of the gene-dose effect in compound heterozygotes: less
      normal hemoglobin means a larger share of the variant.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Homozygous patients have rarely been described and represent a more severe form of disease."
    explanation: >-
      Independent statement that the homozygous genotype exists and is more
      severe, which the dose effect predicts.
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-four (83%) patients carried β-chain (13 Malmo, 4 Olympia, 3 San Diego, 2 Wood) and 7 (17%) α-chain (4 Dallas and one each Columbia-Missouri, Jackson, and Wayne) variants."
    explanation: >-
      Names the beta-globin alleles seen most often in the 41-patient
      single-centre series, and records that the same series also contains alpha-chain
      patients, who belong to the separate ECYT7 concept.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "two-thirds of high-oxygen-affinity hemoglobins are not associated with erythrocytosis due to low-level expression of the Hb variant"
    explanation: >-
      Supports the notes: a high-affinity variant does not always reach
      erythrocytosis, so the disease concept is the subset that does.
pathophysiology:
- name: HBB High-Oxygen-Affinity Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline HBB missense variant substitutes a residue of the
    beta-globin chain that, for the alleles modelled here, participates in the
    allosteric transition of the hemoglobin tetramer rather than in heme
    coordination: a contact at the alpha1-beta2 sliding interface, a C-terminal
    residue holding a deoxy-state salt bridge, or a residue of the
    central-cavity 2,3-bisphosphoglycerate pocket. A further reported route, not
    branched here, alters the environment of the heme and the oxygen binding
    site itself. The activity the variant protein loses is the carrier activity
    rather than the binding activity: GO defines oxygen carrier activity as
    binding oxygen and delivering it to an acceptor, and these variants keep -
    indeed strengthen - the binding half while impairing the delivery half,
    which is why the modifier here is ABNORMAL rather than DECREASED. The mutant chain assembles into hemoglobin normally; what changes is
    the energy balance between the two quaternary states.
  genes:
  - preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  molecular_functions:
  - preferred_term: oxygen carrier activity of the variant hemoglobin tetramer
    modifier: ABNORMAL
    term:
      id: GO:0005344
      label: oxygen carrier activity
  genetic_context:
    gene:
      preferred_term: HBB
      term:
        id: hgnc:4827
        label: HBB
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: HYPERMORPHIC
    description: >-
      Recorded as HYPERMORPHIC rather than gain of function: oxygen binding is a
      normal activity of hemoglobin and the variant raises it, with no novel
      activity acquired. This is the opposite direction from the HBB hemoglobin
      M variants, where a heme-pocket substitution confers the novel property of
      a stabilised ferric heme.
  evidence:
  - reference: CGGV:assertion_de05dd1c-d081-40d4-b2e2-47a590915609-2023-09-27T160000.000Z
    reference_title: "HBB / erythrocytosis, familial, 6 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Erythrocytosis 6 is a disorder of the blood characterized by a high concentration of erythrocytes in the blood and an increased oxygen affinity of hemoglobin."
    explanation: >-
      Defines the disease as the conjunction of the molecular lesion curated on
      this node and the hematological endpoint of the chain.
  - reference: PMID:41978276
    reference_title: "Hemoglobin San Diego: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "increase oxygen (O2) affinity through 3 principal mechanisms: alteration of the α1β2 interface, modification of the globin chain carboxyl terminus, or disruption of interactions with allosteric regulators"
    explanation: >-
      Names the three structural routes by which these missense variants act,
      which are the three branches this node forks into.
  - reference: PMID:15921161
    reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most frequently observed structural modifications are localized in the alpha1beta2 interface, or at the C-terminal."
    explanation: >-
      Independent review stating which of the three structural sites the
      reported variants most often sit in, so the first two branches of this
      node carry most of the alleles.
  - reference: PMID:15921161
    reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Others mutations modify directly or indirectly the surrounding of the heme and the site where oxygen binds."
    explanation: >-
      Names a fourth structural route, which is why this node's description says
      most rather than all of these variants spare the heme environment. No beta
      allele curated here belongs to it, so it is not branched.
  downstream:
  - target: Disruption of the Alpha1-Beta2 Subunit Interface
    causal_link_type: DIRECT
    description: >-
      Substitutions at, or transmitted to, the interface across which the
      subunits slide during the quaternary transition.
  - target: Loss of C-Terminal Salt Bridges That Stabilise the T State
    causal_link_type: DIRECT
    description: >-
      Substitutions at the globin carboxyl terminus remove the salt bridges that
      hold the deoxy structure together.
  - target: Impaired Binding of Allosteric Effectors
    causal_link_type: DIRECT
    description: >-
      Substitutions at the central-cavity sites that bind
      2,3-bisphosphoglycerate and Bohr protons.
- name: Disruption of the Alpha1-Beta2 Subunit Interface
  biological_scale: MOLECULAR
  description: >-
    The alpha1-beta2 interface is the sliding contact that reorganises during the
    T-to-R transition and is what makes oxygen binding cooperative. A
    substitution at the interface, or one transmitted to it through the helix
    that forms it - Hb San Diego's beta109(G11) Val>Met acts indirectly by
    distorting the G helix - weakens the interface contacts that normally have to
    be broken for the tetramer to return to the deoxy state.
  evidence:
  - reference: PMID:41978276
    reference_title: "Hemoglobin San Diego: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The α1β2 interface plays a critical role in stabilizing Hb allosteric states, and mutations at this interface frequently disrupt cooperativity"
    explanation: >-

phenotypes:
- category: Laboratory
  name: Increased hemoglobin oxygen affinity
  diagnostic: true
  frequency: OBLIGATE
  description: >-
    A left-shifted oxygen dissociation curve with a reduced p50 is the defining
    functional abnormality and the laboratory finding that distinguishes this
    disease from every other cause of erythrocytosis. Median p50 in the
    41-patient single-centre series was 20 mmHg (range 12 to 25).
  phenotype_term:
    preferred_term: Increased hemoglobin oxygen affinity
    term:

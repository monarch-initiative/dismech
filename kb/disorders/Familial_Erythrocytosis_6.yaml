discussions:
- discussion_id: compensation_versus_disease
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Increased Red Cell Mass
  - pathophysiology#Increased Whole Blood Viscosity
  - treatments#Therapeutic phlebotomy for symptom control
  prompt: >-
    Is the erythrocytosis of a high oxygen affinity hemoglobin a compensation
    that should be left alone, or a hazard that should be reduced - and can
    phlebotomy therefore do net harm?
  rationale: >-
    The mechanism makes the raised red cell mass the body's correction for a
    left-shifted dissociation curve: more hemoglobin at a lower p50 restores
    tissue oxygen delivery. Removing it with phlebotomy lowers viscosity but
    also lowers the oxygen-carrying capacity the patient is compensating with,
    and there is no way to know from the hematocrit alone which effect dominates
    in a given carrier. The empirical evidence is on the conservative side: in
    the 41-patient single-centre series neither hematocrit nor active
    phlebotomy correlated with
    thrombotic or non-thrombotic symptoms, and the authors concluded that
    phlebotomy has limited therapeutic value, while the review literature
    endorses it only for symptom relief and notes that preemptive phlebotomy in
    asymptomatic carriers has no evidence base. What is missing is a direct
    measurement of what phlebotomy does to oxygen delivery in these patients
    rather than to their hematocrit.
  proposed_experiments:
  - experiment_id: ecyt6_phlebotomy_oxygen_delivery_crossover
    name: Oxygen delivery before and after phlebotomy in genotyped carriers
    description: >-
      Measure exercise capacity and tissue oxygenation (near-infrared
      spectroscopy, or peak oxygen uptake) before and after a standardised
      phlebotomy in genotyped carriers, with the p50 known, so that the
      trade-off between viscosity and carrying capacity is measured in the same
      person rather than inferred from population correlations.
  evidence:
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current study does not implicate Hgb/Hct level as a major contributor of morbidity in HOA hemoglobinopathy-associated erythrocytosis and suggests limited therapeutic value for phlebotomy."
    explanation: >-
      The clinical result that makes the conservative reading the better
      supported one.
  - reference: PMID:38256595
    reference_title: High-Oxygen-Affinity Hemoglobins-Case Series and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Regarding asymptomatic individuals, the preemptive phlebotomy practice lacks supportive evidence-based recommendations"
    explanation: >-
      States the absence of an evidence base for phlebotomy in the asymptomatic
      carrier, which is the population this question is about.
  - reference: PMID:42719225
    reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This may be explained by the compensatory mechanism of erythrocytosis in HOAH, while erythrocytosis is due to a clonal myeloproliferative disease in PV."
    explanation: >-
      States the compensation reading explicitly, and uses it to explain why
      phlebotomy should not be expected to do in this disease what it does in
      polycythemia vera.
  - reference: PMID:15921161
    reference_title: Hemoglobins with high oxygen affinity leading to erythrocytosis. New variants and new concepts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A few molecular mechanisms are individualized among the about 100 Hb variants that cause compensatory erythrocytosis."
    explanation: >-
      The compensation reading is not new: this review already describes the
      erythrocytosis these variants cause as compensatory.
  - reference: PMID:42719225
    reference_title: "Thrombosis in individuals with high oxygen affinity hemoglobin-associated erythrocytosis: A systematic review and analysis of a national cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phlebotomies were associated with a reduction in hyperviscosity‐related symptoms and can be used in these patients with individualized hematocrit targets according to symptom resolution and tolerance"
    explanation: >-
      The other side of the same question: phlebotomy does relieve the symptoms
      it is given for, which is why the answer is a symptom-led target rather
      than no phlebotomy at all.
- discussion_id: thrombosis_attribution
  kind: CONTROVERSY
  attaches_to:
  - phenotypes#Abnormal thrombosis
  - pathophysiology#Increased Whole Blood Viscosity
  prompt: >-
    Do the thrombotic events seen in high oxygen affinity hemoglobin carriers
    arise from the erythrocytosis, and should they drive antithrombotic
    prophylaxis?
  rationale: >-
    Thrombosis is recorded in a minority of patients - two of 41 at
    presentation in one single-centre series, ten of 41 over a median decade,
    and 37 of 548 (6.8 per cent) in the pooled literature - which is enough to
    worry about and not enough to attribute. The two datasets point different
    ways. The single-centre series found no association between hematocrit, or
    phlebotomy, and thrombotic events. The pooled systematic review found that
    on multivariable analysis thrombosis overall tracked age, arterial events
    tracked age and smoking, and only venous events were independently
    associated with hematocrit, with an odds ratio of 1.78 whose confidence
    interval touches unity and beside a thrombophilia odds ratio of 61. So the
    viscosity route is not excluded for venous events and is not established for
    thrombosis as a whole.
    Competing explanations are not excluded: an age- and comorbidity-driven
    baseline rate in a referred population, ascertainment through hematology
    clinics, or conventional thrombophilia unrelated to the hemoglobin. Until
    the question is settled, aspirin is given on individual risk assessment
    rather than on the diagnosis, and this entry records the edge from viscosity
    to thrombosis as indirect with unknown intermediates.
  proposed_experiments:
  - experiment_id: ecyt6_thrombosis_matched_cohort
    name: Matched-cohort thrombotic event rates in genotyped carriers
    description: >-
      Follow a genotype-defined cohort of HBB high-affinity carriers against
      matched controls, with event rates adjusted for conventional
      cardiovascular risk and with p50 and hematocrit as covariates, to
      separate a disease effect from a referral-population baseline.
  evidence:
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family history was documented in 24 patients and history of thrombosis in two (5%)."
    explanation: >-
      The low thrombosis prevalence at presentation, one half of the tension
      this controversy is about.
  - reference: PMID:34633117
    reference_title: "High-oxygen-affinity hemoglobinopathy-associated erythrocytosis: Clinical outcomes and impact of therapy in 41 cases."
    supports: REFUTE

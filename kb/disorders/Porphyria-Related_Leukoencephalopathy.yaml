name: Porphyria-Related Leukoencephalopathy
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Porphyria-related leukoencephalopathy (LENCEP), also called HMBS-related
  leukodystrophy, is an autosomal recessive disorder caused by biallelic HMBS
  variants. Although HMBS is the acute intermittent porphyria gene, this is not
  a severe form of AIP: affected individuals do not have the episodic
  neurovisceral attacks that define AIP, and instead show slowly progressive
  spastic paraparesis, cerebellar ataxia, peripheral axonal neuropathy, ocular
  disease, and a recognizable leukoencephalopathy of the periventricular and
  deep cerebral white matter and bilateral thalami. Onset is in childhood or
  adolescence and adults survive to late life, but an infantile-onset severe end
  of the spectrum exists with developmental delay, hypotonia, epilepsy, cystic
  white matter change, and early death. The disease-defining observation is that
  porphyrin precursors are constitutively elevated in cerebrospinal fluid and
  are not lowered by liver transplantation or by haem arginate — so the
  hepatically directed therapies that work in AIP do not work here, and the
  neurotoxic burden appears to be generated within, or sustained independently
  of, the liver. Fewer than fifteen individuals have been reported.
parents:
- hereditary disease
- leukodystrophy
- inborn error of heme biosynthesis
disease_term:
  preferred_term: leukoencephalopathy, porphyria-related
  term:
    id: MONDO:0958226
    label: leukoencephalopathy, porphyria-related

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) HMBS variants, confirmed by
    segregation in an affected sibship. Monoallelic carriers in the same
    families have roughly half-normal enzyme activity and no leukoencephalopathy.
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of 6 healthy siblings confirmed the bi-allelic location of the variants and segregation with the disease."
    explanation: Segregation analysis in the index family establishes biallelic inheritance.

pathophysiology:
- name: Biallelic HMBS Deficiency
  description: >-
    Biallelic HMBS variants reduce hydroxymethylbilane synthase (porphobilinogen
    deaminase) activity far below the roughly 50% seen in heterozygous AIP
    carriers — measured erythrocyte activity of 18% of normal in one adult
    kindred, and markedly reduced in the infantile-onset cases. This is the third
    enzyme of heme biosynthesis, converting porphobilinogen to hydroxymethylbilane.
  biological_scale: MOLECULAR
  downstream:
  - target: Porphyrin Precursor Accumulation
    causal_link_type: DIRECT
    description: >-
      Blocking the PBG-to-hydroxymethylbilane step backs up the pathway,
      accumulating porphobilinogen and, through secondary inhibition of ALAD,
      5-aminolevulinic acid.
    evidence:
    - reference: PMID:42396593
      reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Impaired conversion of PBG to hydroxymethylbilane leads to the accumulation of the precursors, PBG and ALA."
      explanation: States the direct enzymatic consequence linking HMBS deficiency to precursor accumulation.
  molecular_functions:
  - preferred_term: hydroxymethylbilane synthase activity
    term:
      id: GO:0004418
      label: hydroxymethylbilane synthase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: heme biosynthetic process
    term:
      id: GO:0006783
      label: heme biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 50% to 66% decrease in hydroxymethylbilane synthase enzyme activity compared to normal"
    explanation: Quantifies the enzyme deficiency in the index adult kindred.
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocyte HMBS activity was measured at 18% in our patient (and in her brother with the shared genotype and phenotype) and 50% in an asymptomatic sibling carrying a monoallelic variant."
    explanation: Contrasts the profound biallelic enzyme deficit against the half-normal activity of an unaffected heterozygous sibling.

- name: Porphyrin Precursor Accumulation
  description: >-
    5-aminolevulinic acid, porphobilinogen, and uroporphyrin accumulate in
    plasma and urine. Accumulating porphobilinogen secondarily inhibits ALAD,
    which drives ALA higher still. In the adult leukoencephalopathy phenotype
    the peripheral elevation is only slight to moderate, well short of what an
    AIP attack produces — so the disease is not simply "more AIP".
  biological_scale: ORGANISM
  downstream:
  - target: Constitutive CNS Porphyrin Precursor Exposure
    causal_link_type: DIRECT
    description: >-
      Precursors are present in the central compartment, and unlike in AIP their
      concentration there does not track hepatic heme synthesis.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "porphyrin precursor levels are constitutively elevated in the cerebrospinal fluid and are not reduced by haem arginate therapy"
      explanation: Establishes that the CNS precursor burden is constitutive rather than attack-driven or hepatically controlled.
  chemical_entities:
  - preferred_term: porphobilinogen
    term:
      id: CHEBI:17381
      label: porphobilinogen
    modifier: INCREASED
  - preferred_term: 5-aminolevulinic acid
    term:
      id: CHEBI:17549
      label: 5-aminolevulinic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had a slight and moderate increase in urinary and plasma porphobilinogen and 5'-aminolevulinic acid, respectively"
    explanation: Documents the modest peripheral precursor elevation characteristic of the adult leukoencephalopathy phenotype.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma and urine exhibited high concentrations of 5-aminolevulinic acid, porphobilinogen, and uroporphyrin 1."
    explanation: Documents marked precursor accumulation in the severe infantile-onset presentation.

- name: Constitutive CNS Porphyrin Precursor Exposure
  description: >-
    Porphobilinogen and ALA are detectable and constitutively elevated in
    cerebrospinal fluid, and PBG is not detectable in the CSF of individuals
    without the disease. Critically, CSF levels are unchanged by liver
    transplantation, which means the central compartment is not simply
    receiving hepatically produced precursor. Whether the neurotoxic agent is
    the accumulated precursor or, alternatively, an absolute heme deficit in the
    CNS remains unsettled — see the knowledge gaps below.
  biological_scale: TISSUE
  downstream:
  - target: Cerebral White Matter Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained central exposure is the proposed driver of the white matter
      lesion, but the neuropathological mechanism connecting the two has not
      been established.
  - target: Peripheral axonal neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Length-dependent sensorimotor axonal neuropathy accompanies the central
      lesion, paralleling the peripheral neuropathy of AIP.
  chemical_entities:
  - preferred_term: porphobilinogen
    term:
      id: CHEBI:17381
      label: porphobilinogen
    modifier: INCREASED
  evidence:
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were not able to detect PBG in the CSF of patients unaffected by AIP."
    explanation: Establishes that CSF porphobilinogen is a disease-associated finding rather than a normal constituent.
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In his urine, 5-aminolevulinic acid and porphobilinogen were markedly elevated, but in cerebrospinal fluid just porphobilinogen."
    explanation: Reports the CSF precursor profile in an independent severely affected case.

- name: Cerebral White Matter Degeneration
  description: >-
    A recognizable and consistent MRI pattern: confluent symmetrical signal
    abnormality of the periventricular and deep cerebral white matter and the
    bilateral thalami, with the central pons involved, progressing to cerebellar
    atrophy in advanced disease. In the severe infantile form the white matter
    change becomes cystic with progressive volume loss, and autopsy shows patchy
    gliosis and leukodystrophy.
  biological_scale: TISSUE
  downstream:
  - target: Spastic paraparesis
    causal_link_type: DIRECT
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  locations:
  - preferred_term: deep cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  - preferred_term: bilateral thalami
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  evidence:
  - reference: PMID:34089223
    reference_title: "Expanding the clinical and radiological phenotypes of leukoencephalopathy due to biallelic HMBS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their brain MRIs show mainly confluent signal abnormalities in the periventricular and deep white matter and bilateral thalami."
    explanation: Defines the anatomical distribution of the white matter lesion across six affected adults.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings at autopsy of the brain showed patchy gliosis and leukodystrophy."
    explanation: Provides neuropathological confirmation of the leukodystrophy in the severe phenotype.


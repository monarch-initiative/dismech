has_subtypes:
- name: Adult leukoencephalopathy
  display_name: Childhood/adolescent-onset slowly progressive leukoencephalopathy
  description: >-
    Onset in childhood or adolescence with slowly progressive spastic
    paraparesis, cerebellar ataxia, peripheral neuropathy and ocular disease,
    survival into late adulthood, and often preserved independence for decades.
- name: Severe infantile
  display_name: Severe infantile-onset encephalopathy
  description: >-
    Presentation in the first months or years with hypotonia, developmental
    delay, epilepsy and progressive cystic leukoencephalopathy, and early death.
    Severity appears to track the residual enzyme activity conferred by the
    particular genotype.

genetic:
- name: HMBS
  notes: >-
    Biallelic (homozygous or compound heterozygous) variants in HMBS, encoding
    hydroxymethylbilane synthase (porphobilinogen deaminase). The same gene in
    the monoallelic state causes autosomal dominant acute intermittent
    porphyria; several of the alleles found in biallelic leukoencephalopathy are
    themselves known AIP alleles, so the two disorders are allelic and
    distinguished by dose rather than by variant class.
  gene_term:
    preferred_term: HMBS
    term:
      id: hgnc:4982
      label: HMBS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed compound heterozygous missense variants in the HMBS gene, both associated with the autosomal dominant disorder acute intermittent porphyria."
    explanation: Identifies HMBS as the causal gene and notes that the alleles are known AIP alleles.

animal_models:
- name: PBGD-deficient mouse
  species: Mouse
  genotype: Pbgd-deficient (PBGD-/-)
  publication: PMID:10207164
  description: >-
    A partial porphobilinogen deaminase deficiency mouse, generated to study the
    neuropathy of acute porphyria. Its value here is discriminating rather than
    confirmatory: the neuropathy developed chronically and progressively while
    plasma and urinary ALA were normal or only twofold raised, which is the
    opposite of what a precursor-toxicity model predicts, and the authors
    conclude heme deficiency and hemeprotein dysfunction can cause the
    neuropathy.
  modeled_mechanisms:
  - target: Peripheral axonal neuropathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the axonal, non-demyelinating motor neuropathy seen in affected
      human nerves, and does so without a large precursor elevation.
    limitations: >-
      A partial deficiency modelling monoallelic acute porphyria rather than the
      biallelic human genotype, and the phenotype is peripheral. It does not
      reproduce the central leukodystrophy, so it speaks to the neuropathy node
      and to the mechanism question, not to the white matter lesion.
    readouts:
    - name: Large-caliber axon counts in femoral nerve
      target: Peripheral axonal neuropathy
      direction: DECREASED
      interpretation: >-
        A marked decrease in large-caliber axons with ultrastructural features of
        primary motor axon degeneration and no primary demyelination.
      evidence:
      - reference: PMID:10207164
        reference_title: "Motor neuropathy in porphobilinogen deaminase-deficient mice imitates the peripheral neuropathy of human acute porphyria."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histologically femoral nerves of PBGD-/- mice exhibit a marked decrease in large-caliber (>8 microm) axons and ultrastructural changes consistent with primary motor axon degeneration"
        explanation: Reports the histological measurement grounding the neuropathy claim in this model.
    evidence:
    - reference: PMID:10207164
      reference_title: "Motor neuropathy in porphobilinogen deaminase-deficient mice imitates the peripheral neuropathy of human acute porphyria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings resemble those found in studies of affected nerves of patients with acute porphyria and thus provide strong evidence that PBGD deficiency causes degeneration of motor axons without signs of primary demyelination"
      explanation: Establishes the model as informative for the axonal neuropathy of HMBS deficiency.
    - reference: PMID:10207164
      reference_title: "Motor neuropathy in porphobilinogen deaminase-deficient mice imitates the peripheral neuropathy of human acute porphyria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the neuropathy in PBGD-/- mice developed chronically and progressively and in the presence of normal or only slightly (twofold) increased plasma and urinary levels of the putative neurotoxic heme precursor delta-aminolevulinic acid. These data suggest that heme deficiency and consequent dysfunction of hemeproteins can cause porphyric neuropathy."
      explanation: >-
        Carries both claims the model description makes - that the neuropathy
        arose without a large ALA elevation, and that the authors read this as
        implicating heme deficiency rather than precursor toxicity.
    - reference: PMID:8563760
      reference_title: "Porphobilinogen deaminase deficiency in mice causes a neuropathy resembling that of human hepatic porphyria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Behavioural tests reveal decreased motor function and histopathological findings include axonal neuropathy and neurologic muscle atrophy."
      explanation: The original description of this mouse, cited alongside the 1999 follow-up that characterized the neuropathy in detail.

- name: Biallelic R167Q HMBS mouse
  species: Mouse
  genotype: Hmbs R167Q homozygous
  publication: PMID:41377573
  description: >-
    The closest genetic model of the biallelic human disease, and the one that
    matches the therapeutic failure. It carries constitutively high PBG and ALA
    in brain tissue and CSF, has normal ALAS1 transcript before and after
    porphyrinogenic stimuli, and does not respond to haem provision — the same
    three features that make hepatically directed therapy ineffective in
    patients.
  modeled_mechanisms:
  - target: Constitutive CNS Porphyrin Precursor Exposure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces constitutive central precursor elevation that is independent of
      ALAS1 induction and unresponsive to haem, which is the pharmacological
      situation in patients.
    limitations: >-
      This link covers the biochemical compartment only. The same mouse does not
      develop the white matter lesion - CNS histopathology is reported as normal
      - which is curated as a separate FAILS_TO_RECAPITULATE link below.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "R167Q mouse has constitutively high concentrations of PBG and ALA in brain tissue and CSF"
      explanation: Establishes the model as reproducing the constitutive central precursor elevation seen in patients.
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Biallelic R167Q mice have normal levels of ALAS1 mRNA transcript before and after porphyrinogenic stimuli and are non‐responsive to haem provision"
      explanation: >-
        Records the absent ALAS1 induction and the haem non-response, which
        together parallel why hepatically directed therapy fails in patients.
  - target: Cerebral White Matter Degeneration
    relationship: FAILS_TO_RECAPITULATE
    description: >-
      The closest genetic model of the human disease does not reproduce its
      defining lesion. CNS histopathology is normal in the biallelic R167Q
      mouse and brain haem content is about 80% of wild type, despite the
      constitutive central precursor elevation the same animal shows. That is a
      reported negative result rather than absent data, and it cuts against the
      simplest version of both competing hypotheses: neither the precursor
      burden nor a central haem deficit was sufficient to produce white matter
      pathology in this mouse.
    limitations: >-
      A mouse CNS is not a human one and the reported observation is
      histopathology at whatever age it was assessed, not a lifelong
      neuroimaging course; the human disease is slowly progressive over decades.
      So this constrains the mechanism rather than excluding either hypothesis.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "in the biallelic R167Q mouse, brain haem content was ~80% that of the wild‐type mice and CNS histopathology was normal"
      explanation: >-
        Refutes the claim that this model reproduces the leukodystrophy, and
        supplies the brain haem measurement that bears on the CNS-haem-deficit
        hypothesis.

diagnosis:
- name: Sequencing with explicit zygosity determination
  description: >-
    The diagnosis turns on zygosity, not on finding an HMBS variant. A single
    pathogenic HMBS allele is acute intermittent porphyria; two are this
    disease, with a different inheritance pattern, a different clinical
    syndrome and - critically - different treatment expectations. Several of
    the alleles seen in biallelic patients are themselves known AIP alleles, so
    a report naming a familiar AIP variant does not settle which disorder is
    present. Confirming biallelic status, and segregation where family members
    are available, is the diagnostic step.
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed compound heterozygous missense variants in the HMBS gene"
    explanation: Exome sequencing establishing biallelic status is how the index kindred was diagnosed.
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of 6 healthy siblings confirmed the bi-allelic location of the variants and segregation with the disease."
    explanation: Segregation analysis is what confirmed the two variants sit on different alleles.

- name: Erythrocyte hydroxymethylbilane synthase activity
  description: >-
    Supports the molecular result and separates affected individuals from
    carriers. Activity is markedly reduced in patients and roughly half of
    normal in heterozygous parents, so the assay discriminates the biallelic
    state from the AIP carrier state that the same family often contains.
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activity of hydroxymethylbilane synthase in red blood cells of the child was markedly reduced"
    explanation: >-
      Records the erythrocyte enzyme result in the affected child. The same
      sentence gives roughly 50% of normal in the parents, which is what makes
      the assay discriminate the biallelic state from the carrier state; that
      figure sits inside a bracketed reference range and so is not quotable as
      a contiguous snippet.

- name: Cerebrospinal fluid porphyrin precursor measurement
  description: >-
    The measurement that distinguishes this disorder mechanistically and guides
    therapy. Porphobilinogen is detectable in the CSF of affected individuals
    and undetectable in unaffected controls, and CSF concentrations do not fall
    after liver transplantation or haem arginate. A normal peripheral profile
    does not exclude the central abnormality, which matters because peripheral
    elevation in the adult phenotype is only slight to moderate.
  evidence:
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALA and PBG were measured in urine and CSF using the Mauzerell and Granick method"
    explanation: Records the CSF assay used, which is not part of a routine porphyria workup.
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were not able to detect PBG in the CSF of patients unaffected by AIP."
    explanation: Establishes CSF porphobilinogen as a disease-associated finding rather than a normal constituent.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fourteen reported individuals - thirteen previously published plus the index
    case of the most recent report. No population-based estimate exists.
  evidence:
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen patients with leukodystrophy due to biallelic HMBS variants have been previously described."
    explanation: Gives the countable size of the reported literature.

biochemical:
- name: Cerebrospinal fluid porphobilinogen
  biomarker_term:
    preferred_term: cerebrospinal fluid porphobilinogen
    term:
      id: CHEBI:17381
      label: porphobilinogen
  presence: Elevated
  notes: >-
    Porphobilinogen is detectable and constitutively elevated in the CSF of
    affected individuals and undetectable in unaffected controls, and it is not
    lowered by liver transplantation or haem arginate. This is the single most
    important biochemical observation in the disorder, because it is what
    separates it from AIP therapeutically.
  evidence:
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no difference between pre-transplant porphyrin precursor levels and post-transplant levels in either the peripheral or central compartment."
    explanation: Demonstrates that the central and peripheral precursor burden is independent of hepatic HMBS.

treatments:
- name: Liver Transplantation
  description: >-
    Attempted in several patients on the AIP rationale that replacing hepatic
    HMBS removes the precursor source. It does not work here, but the reason is
    sharper than "nothing changed". In one adult, precursor concentrations were
    unchanged in both compartments after transplantation. In an infant, hepatic
    correction was substantial - about a 50% reduction in ALA, PBG and
    uroporphyrin overproduction two years on - and the neurological decline
    continued anyway. Halving the hepatic output without arresting the disease
    is stronger evidence for an extrahepatic or CNS-autonomous precursor source
    than an absent biochemical response would be.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Porphyrin Precursor Accumulation
    description: >-
      Intended to remove the hepatic source of porphyrin precursors; in this
      disorder it demonstrably fails to lower them.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Liver transplantation and hepatically directed therapies are not likely to be effective for leukodystrophy due to biallelic HMBS variants."
      explanation: Explicitly refutes the hepatic-source rationale for treating this disorder.
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthotopic liver transplantation at the age of 15 months led to only mild transient improvement."
    explanation: Reports failure of liver transplantation to alter the disease course in the severe infantile form.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "with only about a 50% reduction in the marked overproduction of ALA, PBG, and uroporphyrin, compared with his pre-transplant status"
    explanation: >-
      Quantifies the hepatic correction that transplantation did achieve in this
      patient. It refutes the therapy because halving precursor overproduction
      still did not arrest the neurological decline, which argues the residual
      source is not hepatic.
  - reference: PMID:34089223
    reference_title: "Expanding the clinical and radiological phenotypes of leukoencephalopathy due to biallelic HMBS mutations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual reported here had improved neurological function for 12 months following liver transplantation followed by decline and progression of disease."
    explanation: Records the transient benefit that motivated further attempts, before decline resumed; supports the intervention only as a temporary effect.

- name: Intravenous Haem Therapy
  description: >-
    Haem arginate or intravenous heme, the standard treatment for acute attacks
    in AIP, does work biochemically in the periphery - roughly 50% transient
    reductions in urinary ALA, PBG and porphyrins - but does not lower CSF
    porphyrin precursors and produces at most transient subjective clinical
    improvement. That dissociation is the point: the peripheral compartment
    responds and the central one does not, because parenterally administered
    heme does not reach the central nervous system. It is the same compartmental
    argument the liver transplantation entry makes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: haem arginate
      term:
        id: CHEBI:30413
        label: heme
  target_mechanisms:
  - target: Constitutive CNS Porphyrin Precursor Exposure
    description: >-
      Intended to suppress ALAS1 by negative feedback and so reduce precursor
      production; it does not reduce the central precursor burden.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "porphyrin precursor levels are constitutively elevated in the cerebrospinal fluid and are not reduced by haem arginate therapy"
      explanation: Directly refutes that haem arginate lowers the central precursor burden.
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A 5-day course of intravenous heme led to no observable clinical improvement."
    explanation: Reports absence of clinical benefit from intravenous heme.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "intravenous hematin, given daily for 5 days, had led to transient ∼50% reductions in urinary ALA, PBG, and porphyrins."
    explanation: >-
      Establishes that haem does work biochemically in the peripheral
      compartment. Recorded as SUPPORT for the peripheral effect, which is what
      makes the absent central and clinical response a dissociation rather than
      simple inactivity.

- name: Antiseizure Therapy with Non-Porphyrinogenic Agents
  description: >-
    Seizures in the infantile-onset form require antiseizure drugs, and the
    choice is constrained by porphyria pharmacology: many older anticonvulsants
    induce hepatic heme synthesis and are avoided in porphyria. Levetiracetam
    does not appear to exacerbate AIP and was used in the reported infant, who
    was also started on phenobarbital and then tapered off it precisely because
    barbiturates induce hepatic ALAS1. Note that the rationale is inherited from
    AIP practice rather than demonstrated in this disorder, where hepatic
    induction is not the driver - which makes the case for avoiding barbiturates
    here weaker in principle than in AIP, though it was acted on.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levetiracetam, which does not appear to exacerbate AIP, has been a welcome recent addition to the pharmacopoeia."
    explanation: Identifies levetiracetam as the non-porphyrinogenic option, which is why it was the drug used.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was treated with levetiracetam and phenobarbital."
    explanation: >-
      Records the antiseizure regimen the infant was started on. Note this
      included phenobarbital, which was subsequently withdrawn - see the next
      item.
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the known risks of barbiturates in AIP, his medication regimen was adjusted, including tapering off phenobarbital, which is well-known to increase hepatic ALA synthase-1 and over-production of ALA and PBG"
    explanation: >-
      The drug-safety reversal. Phenobarbital was tapered off precisely because
      barbiturates induce hepatic ALAS1; without this the entry would appear to
      endorse a barbiturate under a treatment named for non-porphyrinogenic
      agents.

- name: Supportive and Symptomatic Care
  description: >-
    In the absence of disease-modifying therapy, management is symptomatic:
    antiepileptic drugs, spasticity and ataxia management, rehabilitation, and
    visual support.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No effective disease-modifying therapy currently exists for biallelic HMBS deficiency."
    explanation: Establishes that no disease-modifying option is available, leaving supportive care as the standard.

discussions:
- discussion_id: precursor_toxicity_vs_cns_heme_deficit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the white matter injury caused by accumulated porphyrin precursors
    (ALA/PBG) acting in the CNS, or by an absolute deficit of heme within the
    central nervous system?
  attaches_to:
  - pathophysiology#Constitutive CNS Porphyrin Precursor Exposure
  - pathophysiology#Cerebral White Matter Degeneration
  rationale: >-
    These are the two standing hypotheses and they are not equivalent
    therapeutically: precursor toxicity would motivate an agent that lowers
    ALA/PBG inside the CNS, whereas a central heme deficit would require heme or
    a heme surrogate that crosses into the brain, which parenteral heme does
    not. The failure of both liver transplantation and haem arginate to alter
    CSF precursor levels or the clinical course is consistent with either, so
    the therapeutic failures do not discriminate between them. The edge from
    central precursor exposure to white matter degeneration is recorded as
    INDIRECT for this reason.

    Two natural experiments narrow it without closing it. Doss porphyria,
    caused by biallelic ALAD variants, raises ALA but not PBG and produces
    severe peripheral polyneuropathy with no CNS involvement - so ALA elevation
    alone appears insufficient for white matter disease, and PBG becomes the
    likelier candidate of the two precursors. Separately, the PBGD-deficient
    mouse develops a chronic progressive neuropathy while ALA is normal or only
    twofold raised, which its authors read as implicating heme deficiency. The
    two point in different directions, which is why the gap stays open.
  evidence:
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heme precursors 5-aminolevulinic acid or porphobilinogen originating from the liver or central nervous system could be causative, and absolute heme deficiency in the central nervous system is another hypothesis"
    explanation: States both competing hypotheses as unresolved in the current literature.
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with Doss porphyria, caused by biallelic pathogenic ALAD variants, show high elevations of ALA and coproporphyrin but not of PBG and uroporphyrin. They often exhibit severe peripheral polyneuropathy, but they do not develop an affection of the CNS."
    explanation: >-
      The human biallelic natural experiment this rationale argues from. ALA
      elevation without PBG elevation gives peripheral neuropathy and no CNS
      disease, which is what makes PBG the likelier of the two precursors.
  - reference: PMID:11478735
    reference_title: "5-Aminolevulinic acid inhibits [3H]muscimol binding to human and rat brain synaptic membranes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The similarity in the potency and mechanism of the ALA-induced inhibition of muscimol binding in rat and human membranes indicate that rat studies are useful to evaluate the neurotoxic properties of ALA towards the human GABAergic system"
    explanation: >-
      Gives the precursor-toxicity arm of this gap a concrete molecular
      candidate - ALA antagonism of the GABA-A receptor, shown in human as well
      as rat cortical membranes. Indirect for this disorder because the
      experiment used millimolar ALA on synaptic membranes from unaffected
      brain, and was framed around acute intermittent porphyria rather than the
      constitutive, white-matter-predominant biallelic disease; whether the
      concentrations reached in LENCEP cerebrospinal fluid approach this range
      has not been measured.

- discussion_id: no_animal_model_of_the_biallelic_cns_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there an animal model that reproduces the central biallelic HMBS
    leukodystrophy, as opposed to the peripheral neuropathy and the biochemical
    compartment, both of which are already modelled?
  attaches_to:
  - pathophysiology#Cerebral White Matter Degeneration
  - pathophysiology#Constitutive CNS Porphyrin Precursor Exposure
  rationale: >-
    Two mouse models exist and are curated in animal_models, but neither
    reproduces the white matter lesion. The PBGD-deficient mouse models the
    peripheral axonal neuropathy; the biallelic R167Q mouse reproduces the
    constitutive central precursor elevation and the haem non-response but has
    normal CNS histopathology, so it explicitly does not reproduce the white
    matter lesion. So what is missing specifically is a model of the
    leukodystrophy - a system in
    which CNS precursor concentrations can be raised or lowered independently of
    hepatic heme synthesis while the white matter is watched. That is also the
    platform any CNS-penetrant precursor-lowering strategy would need.

- discussion_id: aip_therapies_do_not_transfer
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can any agent lower porphyrin precursors in the central compartment, given
    that hepatically directed therapy demonstrably cannot?
  attaches_to:
  - treatments#Liver Transplantation
  - treatments#Intravenous Haem Therapy
  rationale: >-
    Givosiran, the ALAS1 siRNA that prevents attacks in AIP, is hepatically
    targeted, and access was declined for one post-transplant patient on exactly
    that ground. Since CSF precursors do not fall after liver transplantation,
    there is no reason to expect a liver-directed siRNA to reach the relevant
    compartment either. A CNS-penetrant strategy is what this disorder needs and
    none has been reported.
  evidence:
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, parenterally administered heme, which is effective in acute intermittent porphyria, does not reach the central nervous system."
    explanation: Identifies the pharmacological barrier that makes AIP therapies inapplicable here.

- discussion_id: genotype_severity_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a biallelic HMBS genotype produces the survivable
    adult leukoencephalopathy or the lethal infantile encephalopathy?
  attaches_to:
  - has_subtypes#Adult leukoencephalopathy
  - has_subtypes#Severe infantile
  rationale: >-
    Residual enzyme activity conferred by the specific allele pair is the
    presumed determinant, but with fewer than fifteen reported individuals the
    genotype-phenotype relationship rests on very few observations, and
    intrafamilial variability has been noted even for identical genotypes.

notes: >-
  Distinguish carefully from acute intermittent porphyria. AIP is the autosomal
  dominant, low-penetrance disease of monoallelic HMBS variants, presenting with
  episodic neurovisceral attacks; dismech curates it separately as
  Acute_Intermittent_Porphyria. LENCEP is a different clinical entity produced
  by the same gene in the biallelic state. Most reported individuals have no
  AIP attacks, though a minority do and fleeting neurovisceral pain is
  described; what distinguishes them is that none has been reported to have
  attacks in response to classical porphyrinogenic stimuli. The distinction
  matters
  therapeutically: haem arginate and hepatically directed therapy work in AIP
  and do not work here.

references:
- reference: PMID:27558376
  title: Acute intermittent porphyria-related leukoencephalopathy.
- reference: PMID:34089223
  title: Expanding the clinical and radiological phenotypes of leukoencephalopathy due to biallelic HMBS mutations.

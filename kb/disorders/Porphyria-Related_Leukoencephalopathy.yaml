has_subtypes:
- name: Adult leukoencephalopathy
  display_name: Childhood/adolescent-onset slowly progressive leukoencephalopathy
  description: >-
    Onset in childhood or adolescence with slowly progressive spastic
    paraparesis, cerebellar ataxia, peripheral neuropathy and ocular disease,
    survival into late adulthood, and often preserved independence for decades.
- name: Severe infantile
  display_name: Severe infantile-onset encephalopathy
  description: >-
    Presentation in the first months or years with hypotonia, developmental
    delay, epilepsy and progressive cystic leukoencephalopathy, and early death.
    Severity appears to track the residual enzyme activity conferred by the
    particular genotype.

genetic:
- name: HMBS
  notes: >-
    Biallelic (homozygous or compound heterozygous) variants in HMBS, encoding
    hydroxymethylbilane synthase (porphobilinogen deaminase). The same gene in
    the monoallelic state causes autosomal dominant acute intermittent
    porphyria; several of the alleles found in biallelic leukoencephalopathy are
    themselves known AIP alleles, so the two disorders are allelic and
    distinguished by dose rather than by variant class.
  gene_term:
    preferred_term: HMBS
    term:
      id: hgnc:4982
      label: HMBS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27558376
    reference_title: "Acute intermittent porphyria-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed compound heterozygous missense variants in the HMBS gene, both associated with the autosomal dominant disorder acute intermittent porphyria."
    explanation: Identifies HMBS as the causal gene and notes that the alleles are known AIP alleles.

biochemical:
- name: Cerebrospinal fluid porphobilinogen
  biomarker_term:
    preferred_term: cerebrospinal fluid porphobilinogen
    term:
      id: CHEBI:17381
      label: porphobilinogen
  presence: Elevated
  notes: >-
    Porphobilinogen is detectable and constitutively elevated in the CSF of
    affected individuals and undetectable in unaffected controls, and it is not
    lowered by liver transplantation or haem arginate. This is the single most
    important biochemical observation in the disorder, because it is what
    separates it from AIP therapeutically.
  evidence:
  - reference: PMID:41377573
    reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no difference between pre-transplant porphyrin precursor levels and post-transplant levels in either the peripheral or central compartment."
    explanation: Demonstrates that the central and peripheral precursor burden is independent of hepatic HMBS.

treatments:
- name: Liver Transplantation
  description: >-
    Attempted in several patients on the AIP rationale that replacing hepatic
    HMBS removes the precursor source. It does not work here. Reported outcomes
    are transient or absent improvement followed by continued neurological
    decline, with porphyrin precursor levels unchanged in both the peripheral
    and central compartments afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Porphyrin Precursor Accumulation
    description: >-
      Intended to remove the hepatic source of porphyrin precursors; in this
      disorder it demonstrably fails to lower them.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Liver transplantation and hepatically directed therapies are not likely to be effective for leukodystrophy due to biallelic HMBS variants."
      explanation: Explicitly refutes the hepatic-source rationale for treating this disorder.
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthotopic liver transplantation at the age of 15 months led to only mild transient improvement."
    explanation: Reports failure of liver transplantation to alter the disease course in the severe infantile form.
  - reference: PMID:34089223
    reference_title: "Expanding the clinical and radiological phenotypes of leukoencephalopathy due to biallelic HMBS mutations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual reported here had improved neurological function for 12 months following liver transplantation followed by decline and progression of disease."
    explanation: Records the transient benefit that motivated further attempts, before decline resumed; supports the intervention only as a temporary effect.

- name: Intravenous Haem Therapy
  description: >-
    Haem arginate or intravenous heme, the standard treatment for acute attacks
    in AIP, produces at most transient subjective improvement here and does not
    lower CSF porphyrin precursors. Parenterally administered heme does not
    reach the central nervous system.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: haem arginate
      term:
        id: CHEBI:30413
        label: heme
  target_mechanisms:
  - target: Constitutive CNS Porphyrin Precursor Exposure
    description: >-
      Intended to suppress ALAS1 by negative feedback and so reduce precursor
      production; it does not reduce the central precursor burden.
    evidence:
    - reference: PMID:41377573
      reference_title: "Liver Transplantation and Other Hepatically Directed Therapies Do Not Change the Biochemical Phenotype nor Halt Progression of Leukodystrophy due to Biallelic HMBS Variants: A Case Report."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "porphyrin precursor levels are constitutively elevated in the cerebrospinal fluid and are not reduced by haem arginate therapy"
      explanation: Directly refutes that haem arginate lowers the central precursor burden.
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A 5-day course of intravenous heme led to no observable clinical improvement."
    explanation: Reports absence of clinical benefit from intravenous heme.

- name: Supportive and Symptomatic Care
  description: >-
    In the absence of disease-modifying therapy, management is symptomatic:
    antiepileptic drugs, spasticity and ataxia management, rehabilitation, and
    visual support.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42396593
    reference_title: "Limited benefit of liver transplantation in a boy with biallelic severe deficiency of hydroxymethylbilane synthase and review of prior reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No effective disease-modifying therapy currently exists for biallelic HMBS deficiency."
    explanation: Establishes that no disease-modifying option is available, leaving supportive care as the standard.

discussions:
- discussion_id: precursor_toxicity_vs_cns_heme_deficit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the white matter injury caused by accumulated porphyrin precursors
    (ALA/PBG) acting in the CNS, or by an absolute deficit of heme within the
    central nervous system?
  attaches_to:
  - pathophysiology#Constitutive CNS Porphyrin Precursor Exposure
  - pathophysiology#Cerebral White Matter Degeneration
  rationale: >-
    These are the two standing hypotheses and they are not equivalent
    therapeutically: precursor toxicity would motivate an agent that lowers
    ALA/PBG inside the CNS, whereas a central heme deficit would require heme or
    a heme surrogate that crosses into the brain, which parenteral heme does
    not. The failure of both liver transplantation and haem arginate to alter
    CSF precursor levels or the clinical course is consistent with either, so
    the therapeutic failures do not discriminate between them. The edge from
    central precursor exposure to white matter degeneration is recorded as
    INDIRECT for this reason.
  evidence:
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heme precursors 5-aminolevulinic acid or porphobilinogen originating from the liver or central nervous system could be causative, and absolute heme deficiency in the central nervous system is another hypothesis"
    explanation: States both competing hypotheses as unresolved in the current literature.
  - reference: PMID:11478735
    reference_title: "5-Aminolevulinic acid inhibits [3H]muscimol binding to human and rat brain synaptic membranes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The similarity in the potency and mechanism of the ALA-induced inhibition of muscimol binding in rat and human membranes indicate that rat studies are useful to evaluate the neurotoxic properties of ALA towards the human GABAergic system"
    explanation: >-
      Gives the precursor-toxicity arm of this gap a concrete molecular
      candidate - ALA antagonism of the GABA-A receptor, shown in human as well
      as rat cortical membranes. Indirect for this disorder because the
      experiment used millimolar ALA on synaptic membranes from unaffected
      brain, and was framed around acute intermittent porphyria rather than the
      constitutive, white-matter-predominant biallelic disease; whether the
      concentrations reached in LENCEP cerebrospinal fluid approach this range
      has not been measured.

- discussion_id: no_animal_model_of_the_biallelic_cns_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there an animal model that reproduces the central biallelic HMBS
    leukodystrophy, as opposed to the acute attacks of monoallelic porphyria?
  attaches_to:
  - pathophysiology#Cerebral White Matter Degeneration
  - pathophysiology#Constitutive CNS Porphyrin Precursor Exposure
  rationale: >-
    No animal model of the constitutive CNS leukodystrophy has been reported,
    which is why this entry carries no animal_models block. That absence is the
    reason the two competing pathogenic hypotheses above remain untested: there
    is no system in which to raise or lower CNS precursor concentrations
    independently of hepatic heme synthesis and watch the white matter. A
    neural-restricted or humanized knock-in Hmbs model would be the obvious
    instrument, and would also be the platform for testing any CNS-penetrant
    precursor-lowering strategy.

- discussion_id: aip_therapies_do_not_transfer
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can any agent lower porphyrin precursors in the central compartment, given
    that hepatically directed therapy demonstrably cannot?
  attaches_to:
  - treatments#Liver Transplantation
  - treatments#Intravenous Haem Therapy
  rationale: >-
    Givosiran, the ALAS1 siRNA that prevents attacks in AIP, is hepatically
    targeted, and access was declined for one post-transplant patient on exactly
    that ground. Since CSF precursors do not fall after liver transplantation,
    there is no reason to expect a liver-directed siRNA to reach the relevant
    compartment either. A CNS-penetrant strategy is what this disorder needs and
    none has been reported.
  evidence:
  - reference: PMID:41731635
    reference_title: "Biallelic pathogenic hydroxymethylbilane synthase gene variants of a neurodegenerative disorder with progressive cystic leukoencephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, parenterally administered heme, which is effective in acute intermittent porphyria, does not reach the central nervous system."
    explanation: Identifies the pharmacological barrier that makes AIP therapies inapplicable here.

- discussion_id: genotype_severity_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a biallelic HMBS genotype produces the survivable
    adult leukoencephalopathy or the lethal infantile encephalopathy?
  attaches_to:
  - has_subtypes#Adult leukoencephalopathy
  - has_subtypes#Severe infantile
  rationale: >-
    Residual enzyme activity conferred by the specific allele pair is the
    presumed determinant, but with fewer than fifteen reported individuals the
    genotype-phenotype relationship rests on very few observations, and
    intrafamilial variability has been noted even for identical genotypes.

notes: >-
  Distinguish carefully from acute intermittent porphyria. AIP is the autosomal
  dominant, low-penetrance disease of monoallelic HMBS variants, presenting with
  episodic neurovisceral attacks; dismech curates it separately as
  Acute_Intermittent_Porphyria. LENCEP is a different clinical entity produced
  by the same gene in the biallelic state, and the affected individuals
  reported to date do not have AIP attacks. The distinction matters
  therapeutically: haem arginate and hepatically directed therapy work in AIP
  and do not work here.

references:
- reference: PMID:27558376
  title: Acute intermittent porphyria-related leukoencephalopathy.
- reference: PMID:34089223
  title: Expanding the clinical and radiological phenotypes of leukoencephalopathy due to biallelic HMBS mutations.

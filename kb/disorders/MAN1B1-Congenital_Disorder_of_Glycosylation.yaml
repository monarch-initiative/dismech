- name: Disrupted Cortical Neuron Development
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    MAN1B1 is expressed mainly in dorsal progenitors and intermediate
    excitatory neurons of the developing human cortex. Knocking Man1b1 down in
    cultured mouse excitatory neurons impairs axon growth, dendrite formation
    and spine maturation. Knocking it down in the embryonic mouse cortex by in
    utero electroporation increases the proportion of proliferating progenitors
    while fewer of them exit the cell cycle, and fewer newborn neurons reach the
    cortical plate. The abstract summarises the progenitor result as impaired
    proliferation and differentiation; the results section reports increased
    proliferation with reduced cell-cycle exit, and this node follows the
    results. This is the only experimental
    account of how the deficiency affects the brain; it comes from knockdown in
    mouse rather than from patient tissue, and no patient brain pathology has
    been described.
  cell_types:

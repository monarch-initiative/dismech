- name: Defective Golgi N-Glycan Processing
  biological_scale: MOLECULAR
  description: >-
    Slowed mannose trimming lets incompletely trimmed glycans proceed through
    the Golgi, where they are converted into hybrid-type structures. Sialylated
    and fucosylated hybrid glycans such as NeuAc1Hex6HexNAc3 accumulate on
    serum glycoproteins, including transferrin (at the Asn432 site), IgG and
    alpha-1-antitrypsin, though in total serum they are often present only in
    trace amounts. The missing sialic acid on transferrin glycans is what shows
    as the type 2 isoelectric focusing pattern.
  biological_processes:
  - preferred_term: N-glycan mannose trimming
    modifier: DECREASED
    term:
      id: GO:0006491
      label: N-glycan processing
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  downstream:
  - target: Type II transferrin isoform profile
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24348268
      reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The type 2 sTF-IEF pattern pointed to an N-glycan remodelling defect.
      explanation: >-
        Ties the abnormal transferrin pattern to the N-glycan processing
        defect.
  - target: Multisystem Glycoprotein Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The aberrant glycans are present on many serum glycoproteins, but which
      glycoproteins' altered glycosylation produces which clinical feature has
      not been established.
    evidence:
    - reference: PMID:24566669
      reference_title: Diagnostic serum glycosylation profile in patients with intellectual disability as a result of MAN1B1 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Abnormal hybrid type N-glycans were also observed in the glycoprofiles of total serum proteins, of enriched immunoglobulins and of alpha1-antitrypsin in variable amounts.
      explanation: >-
        Shows the processing defect reaches many unrelated glycoproteins,
        which is the basis for treating it as a systemic defect.
  evidence:
  - reference: PMID:24348268
    reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MAN1B1-deficient individuals (P2, P5), we observed the accumulation of the hybrid-type glycan structure NeuAc1Hex6HexNAc3 (m/z 2,390)
    explanation: >-
      Mass spectrometry of patient serum N-glycans shows the hybrid glycan
      accumulation.
  - reference: PMID:24566669
    reference_title: Diagnostic serum glycosylation profile in patients with intellectual disability as a result of MAN1B1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A highly characteristic glycosylation signature was observed with hybrid type N-glycans, in agreement with deficient mannosidase activity.
    explanation: >-
      Intact transferrin glycoprofiling shows the same hybrid glycan signature.
  - reference: PMID:34141584

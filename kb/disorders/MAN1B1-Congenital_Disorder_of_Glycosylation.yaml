mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013624
      label: Rafiq syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    notes: >-
      MONDO keeps two classes for the patients this entry covers. MONDO:0018349
      derives from Orphanet:397941 (MAN1B1-CDG); MONDO:0013624 derives from
      OMIM:614202, the locus first defined in the MAN1B1 families of
      PMID:21763484 and later renamed Rafiq syndrome, and it carries the CDG2U
      synonym. Both are defined by biallelic MAN1B1 variants, and the patients
      reported under each name have the same transferrin pattern and clinical
      picture, so the two classes describe one disease. The MONDO definition of
      MONDO:0013624 still reads "non-syndromic", which reflects the 2011 report
      rather than the later literature.

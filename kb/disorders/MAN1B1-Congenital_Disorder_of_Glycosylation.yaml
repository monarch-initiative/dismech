pathophysiology:
- name: Biallelic MAN1B1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift, splice and missense variants on both MAN1B1 alleles.
    The two recurrent missense alleles, p.Arg334Cys (an active-site pocket
    residue) and p.Glu397Lys, sit at conserved residues; in recombinant
    expression the founding alleles either reduced catalytic turnover about
    1300-fold or prevented stable protein expression. In patient fibroblasts
    the steady-state MAN1B1 protein is extremely low, including for missense
    alleles with normal or raised mRNA, so most alleles act by destabilising
    the protein as well as or instead of inactivating it.
  genes:
  - preferred_term: MAN1B1
    term:
      id: hgnc:6823
      label: MAN1B1
  molecular_functions:
  - preferred_term: ER alpha-1,2-mannosidase I activity
    modifier: DECREASED
    term:
      id: GO:0004571
      label: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of MAN1B1 Alpha-1,2-Mannosidase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21763484
      reference_title: "Mutations in the alpha 1,2-mannosidase gene, MAN1B1, cause autosomal-recessive intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both missense mutations are at amino acid residues that are conserved across the animal kingdom, and they either reduce k(cat) by ~1300-fold or disrupt stable protein expression in mammalian cells.
      explanation: >-
        Recombinant expression of the two founding missense alleles showed they
        either cut catalytic turnover or prevent stable protein expression,
        which is the step from variant to lost enzyme activity.
  evidence:
  - reference: PMID:21763484
    reference_title: "Mutations in the alpha 1,2-mannosidase gene, MAN1B1, cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a combination of next-generation sequencing and Sanger sequencing, we have identified mutations in the gene MAN1B1, encoding a mannosyl oligosaccharide, alpha 1,2-mannosidase.
    explanation: >-
      Identifies MAN1B1 as the gene mutated in the founding families.
  - reference: PMID:24348268
    reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As shown in Figure 5B, an extremely low level of endogenous MAN1B1 was detected in affected cases.
    explanation: >-
      Immunoblotting of patient fibroblasts shows the variants deplete the
      protein itself, not only its activity.
- name: Loss of MAN1B1 Alpha-1,2-Mannosidase Activity
  biological_scale: MOLECULAR
  description: >-
    MAN1B1 is a type II membrane glycosyl hydrolase family 47 enzyme that
    cleaves a single alpha-1,2-mannose from the middle branch of Man9GlcNAc2 to
    give the Man8GlcNAc2 isomer B. Lymphocyte microsomes from patients show
    negligible activity of this kind, and patient fibroblasts process Man9 to
    Man8 at roughly a third of the control rate. The residual trimming is
    attributed to other ER and Golgi alpha-mannosidases, including the EDEM
    proteins.
  molecular_functions:
  - preferred_term: ER alpha-1,2-mannosidase I activity
    modifier: DECREASED
    term:
      id: GO:0004571
      label: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
  downstream:
  - target: Defective Golgi N-Glycan Processing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24348268
      reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results strongly suggest that in MAN1B1-deficient cells, a delay in the trimming of Man9GlcNAc2 species occurs.
      explanation: >-
        Pulse-chase labelling of patient fibroblasts links the lost enzyme
        activity to slowed N-glycan trimming.
  - target: Impaired Glycoprotein Quality Control
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18003979
      reference_title: Endoplasmic reticulum (ER) mannosidase I is compartmentalized and required for N-glycan trimming to Man5-6GlcNAc2 in glycoprotein ER-associated degradation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using small interfering RNA knockdown of ERManI, we show that this enzyme is required for trimming to Man(5-6)GlcNAc(2) and for ERAD in cells in vivo
      explanation: >-
        Knockdown in cultured cells shows the enzyme is needed for degradation
        of a model ERAD substrate. This is a cell-line result, not a
        measurement in patient cells.
  - target: Disrupted Cortical Neuron Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of MAN1B1 impairs neuronal development in mouse models, but which
      glycoproteins or which function of the enzyme (catalytic trimming or the
      catalysis-independent quality-control role) mediates the effect is not
      known.
    evidence:
    - reference: PMID:40869158
      reference_title: Bi-Allelic Loss-of-Function Variant in MAN1B1 Cause Rafiq Syndrome and Developmental Delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Knockdown of Man1b1 in primarily cultured mouse excitatory neurons disrupted axon growth, dendrite formation, and spine maturation, and could not be rescued by truncated variants identified in the family.
      explanation: >-
        Loss of Man1b1 in cultured neurons disrupts neurite and spine
        development, and truncated patient alleles cannot rescue it.
  evidence:

- name: Impaired Glycoprotein Quality Control
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Mannose trimming by MAN1B1 is the step that marks terminally misfolded
    glycoproteins for ER-associated degradation (ERAD), and the enzyme also
    supports degradation of misfolded alpha-1-antitrypsin through a
    catalysis-independent route that depends on its cytoplasmic tail. The
    ERAD role is well established in cell lines; in patient cells it is
    inferred from the enzyme deficiency rather than measured with a
    degradation assay. Where the enzyme acts is contested: it has been placed
    in the Golgi, where it would retrieve escaped misfolded proteins to the ER,
    and alternatively in ER-derived quality-control vesicles, with the Golgi
    pattern attributed to an immunofluorescence fixation artefact.
  biological_processes:
  - preferred_term: ERAD pathway
    modifier: DECREASED
    term:
      id: GO:0036503
      label: ERAD pathway
  downstream:
  - target: Golgi Dilatation and Fragmentation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than shown: inadequate clearance of misfolded proteins
      is suggested to disturb downstream secretory compartments.
    evidence:
    - reference: PMID:34258140
      reference_title: "Translational balancing questioned: Unaltered glycosylation during disulfiram treatment in mannosyl-oligosaccharide alpha-1,2-mannnosidase-congenital disorders of glycosylation (MAN1B1-CDG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A pre-Golgi located defect at the ERQC might cause alterations of Golgi morphology, since a mutation of MAN1B1 results in an inadequate elimination of misfolded proteins.
      explanation: >-
        The authors' proposed explanation for the Golgi morphology defect,
        stated as a hypothesis in the discussion.
  evidence:
  - reference: PMID:21697506
    reference_title: Golgi localization of ERManI defines spatial separation of the mammalian glycoprotein quality control system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ERManI, a putative ER resident mannosidase, plays a rate-limiting role in generating a signal that targets misfolded N-linked glycoproteins for ER-associated degradation (ERAD).
    explanation: >-
      States the enzyme's role in tagging misfolded glycoproteins for ERAD.
  - reference: PMID:32958677
    reference_title: The cytoplasmic tail of human mannosidase Man1b1 contributes to catalysis-independent quality control of misfolded alpha1-antitrypsin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the unconventional system is under the control of an evolutionarily extended N-terminal cytoplasmic tail.
    explanation: >-
      Man1b1 knockout HEK293T cells show a second, catalysis-independent
      quality-control function, so loss of the protein (as in most patient
      alleles) removes more than the mannosidase activity.
  - reference: PMID:24348268
    reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results strongly suggest that MAN1B1 is widely distributed within the Golgi apparatus and is hardly or not detectable in the ER.
    explanation: >-
      Localisation of the endogenous protein in control fibroblasts, one side
      of the localisation question.
  - reference: PMID:25411339
    reference_title: "Mammalian ER mannosidase I resides in quality control vesicles, where it encounters its glycoprotein substrates."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Of importance, we found that membrane disturbance, as is common in immunofluorescence methods, leads to an artificial appearance of ERManI in a Golgi pattern.
    explanation: >-
      Contradicts the Golgi localisation on which the Golgi retrieval model
      rests, placing the enzyme in ER-derived quality-control vesicles
      instead.

discussions:
- discussion_id: man1b1_localisation_and_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where does MAN1B1 act in human cells, and is the disease caused by loss of
    its mannosidase activity, its catalysis-independent quality-control
    function, or both?
  attaches_to:
  - pathophysiology#Impaired Glycoprotein Quality Control
  - pathophysiology#Loss of MAN1B1 Alpha-1,2-Mannosidase Activity
  rationale: >-
    One group places the endogenous enzyme in the Golgi and proposes it
    retrieves escaped misfolded glycoproteins to the ER; another places it in
    ER-derived quality-control vesicles and attributes the Golgi pattern to a
    fixation artefact. The catalysis-independent quality-control role needs the
    cytoplasmic tail but not the catalytic site. Most patient alleles deplete
    the protein, so they remove both functions at once, while the transferrin
    readout reflects only the catalytic one. Which function drives the
    neurodevelopmental phenotype would decide whether restoring mannosidase
    activity alone could be expected to help.
- discussion_id: obesity_and_overgrowth_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does MAN1B1-CDG cause truncal obesity and macrocephaly with preserved
    growth, when most CDGs cause failure to thrive?
  attaches_to:
  - phenotypes#Truncal obesity
  - pathophysiology#Multisystem Glycoprotein Dysfunction
  rationale: >-
    The obesity is progressive in some patients and absent in others, and no
    study has examined appetite regulation, adipose tissue or endocrine
    glycoproteins in this disorder. The edges to these features are recorded
    with unknown intermediates for that reason.
notes: >-
  No current GeneReviews chapter covers this disease or MAN1B1. The only
  GeneReviews hit for the gene is the retired "Congenital Disorders of N-Linked
  Glycosylation and Multiple Pathway Overview" chapter (PMID:20301507), an
  overview whose PubMed abstract carries no clinical characteristics, so the
  phenotype baseline here comes from the published case series and the
  44-patient literature review (PMID:39840888).

  The localisation of MAN1B1 (Golgi versus ER-derived vesicles) is unresolved
  in the literature and both positions are cited on the quality-control node.

  Frequencies are given only where a source states a proportion. The 44-patient
  review gives per-study counts for hypotonia and joint hypermobility but no
  pooled figure, so those phenotypes carry no frequency.

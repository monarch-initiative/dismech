diagnosis:
- name: Mass spectrometry of intact serum transferrin
  description: >-
    High-resolution mass spectrometry of intact transferrin shows the
    MAN1B1-specific hybrid glycan signature and was used to find eleven
    further patients in a cohort of 100 unsolved CDG type II cases. It also
    serves as functional confirmation of MAN1B1 variants found by sequencing.
  evidence:
  - reference: PMID:24566669
    reference_title: Diagnostic serum glycosylation profile in patients with intellectual disability as a result of MAN1B1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our method for analysis of intact transferrin provides a rapid test to detect MAN1B1-deficient patients within congenital disorder of glycosylation type II cohorts
    explanation: >-
      Establishes intact-transferrin mass spectrometry as a diagnostic test.
- name: Endo H-released serum N-glycan profiling
  description: >-
    Because the abnormal glycans are present only in trace amounts in total
    serum, releasing high-mannose and hybrid glycans with
    endo-beta-N-acetylglucosaminidase H before MALDI-TOF mass spectrometry
    makes them readily detectable.
  evidence:
  - reference: PMID:29947113
    reference_title: Use of Endoglycosidase H as a diagnostic tool for MAN1B1-CDG patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MAN1B1-CDG, the abnormal accumulating N-glycan structures are mostly absent or found in trace amounts in total human serum.
    explanation: >-
      The problem the Endo H method addresses.
  - reference: PMID:29947113
    reference_title: Use of Endoglycosidase H as a diagnostic tool for MAN1B1-CDG patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present a straightforward procedure based on the use of Endo-β-N-acetylglucosaminidase H to easily diagnose MAN1B1-CDG patients and mannosidase defects
    explanation: >-
      The diagnostic procedure.
- name: Exome sequencing
  description: >-
    Most patients have been diagnosed by exome sequencing for intellectual
    disability, often before any glycosylation testing. Serum transferrin
    analysis is recommended in unexplained intellectual disability because the
    clinical picture is not specific enough to suggest the gene.
  evidence:
  - reference: PMID:29908352
    reference_title: "MAN1B-CDG: Novel variants with a distinct phenotype and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In unexplained ID, serum transferrin should be included in the first-line screening.
    explanation: >-
      Recommends transferrin screening in unexplained intellectual disability.

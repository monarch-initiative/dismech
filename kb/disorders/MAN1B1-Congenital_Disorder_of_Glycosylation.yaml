genetic:
- name: MAN1B1
  gene_term:
    preferred_term: MAN1B1
    term:
      id: hgnc:6823
      label: MAN1B1
  relationship_type: CAUSATIVE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e0f50bc5-f7ac-4e0a-9762-d6cad9cc4585-2020-08-04T114702.993Z
    evidence:
    - reference: CGGV:assertion_e0f50bc5-f7ac-4e0a-9762-d6cad9cc4585-2020-08-04T114702.993Z
      reference_title: "MAN1B1 / MAN1B1-congenital disorder of glycosylation (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MAN1B1 | HGNC:6823 | MAN1B1-congenital disorder of glycosylation | MONDO:0018349 | AR | Definitive"
      explanation: >-
        ClinGen Gene-Disease Validity classification (AR, Definitive) copied
        from the Intellectual Disability and Autism GCEP record for this
        gene-disease pair.
  variant_origin: GERMLINE
  notes: >-
    MAN1B1 (9q34.3, NM_016219) encodes a 663-residue type II membrane protein
    with a short cytoplasmic tail, a transmembrane segment and a large luminal
    glycosyl hydrolase family 47 catalytic domain. Reported alleles are
    nonsense, frameshift, splice, missense and an intragenic exon 4 deletion.
    p.Glu397Lys (shared by three families from one Pakistani village) and
    p.Arg334Cys (in Iranian, Turkish, Russian and other families) are the
    recurrent alleles. Two siblings homozygous for p.Arg334Cys who were also
    homozygous for a SEC23A missense variant had tall stature, which their
    authors attribute to a digenic effect; this is not a feature of MAN1B1-CDG
    alone.
  variants:
  - name: "NM_016219.3:c.1189G>A (p.Glu397Lys)"
    description: >-
      Recurrent missense at a conserved residue, segregating with disease in
      three related Pakistani families; the most frequently reported allele.
    type: missense
    clinical_significance: PATHOGENIC
  - name: "NM_016219.3:c.1000C>T (p.Arg334Cys)"
    description: >-
      Recurrent missense at an active-site residue that hydrogen-bonds the
      substrate; reported homozygous and compound heterozygous in families of
      several ancestries.
    type: missense
    clinical_significance: PATHOGENIC
  - name: "NM_016219.3:c.1418G>A (p.Trp473*)"
    description: >-
      Nonsense allele in the founding family with additional dysmorphic
      features.
    type: nonsense
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:21763484
    reference_title: "Mutations in the alpha 1,2-mannosidase gene, MAN1B1, cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified the missense mutation c. 1189G>A (p.Glu397Lys; RefSeq number NM_016219.3), which segregates with NS-ARID in three families who come from the same village and probably have shared inheritance.
    explanation: >-
      The recurrent p.Glu397Lys allele.
  - reference: PMID:39840888
    reference_title: "A Case of Rafiq Syndrome (MAN1B1-CDG) in a Palestinian Child, With Brief Literature Review of 44 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statistical analysis reveals that the c.1189G>A; p.Glu397Lys mutation is the most frequently observed mutation.
    explanation: >-
      p.Glu397Lys is the most frequently reported allele across the reviewed
      patients.
  - reference: PMID:24348268
    reference_title: "MAN1B1 deficiency: an unexpected CDG-II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore it is localized at the active site pocket of the protein, where it interacts with the substrate via hydrogen bonding.
    explanation: >-
      Places Arg334 in the active-site pocket.
  - reference: PMID:27148587
    reference_title: Somatic overgrowth associated with homozygous mutations in both MAN1B1 and SEC23A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing, we identified homozygous mutations in two unlinked genes, SEC23A c.1200G>C (p.M400I) and MAN1B1 c.1000C>T (p.R334C), associated with congenital birth defects in two patients from a consanguineous family.
    explanation: >-
      The family carrying MAN1B1 p.Arg334Cys together with a second
      homozygous SEC23A variant, recorded so that its tall stature is not read
      as a MAN1B1-CDG feature.

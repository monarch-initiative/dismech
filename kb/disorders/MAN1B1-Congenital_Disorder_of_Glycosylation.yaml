name: MAN1B1-Congenital Disorder of Glycosylation
creation_date: "2026-11-12T23:30:00Z"
category: Mendelian
description: >-
  MAN1B1-CDG is an autosomal recessive congenital disorder of glycosylation
  caused by biallelic loss-of-function variants in MAN1B1, which encodes the
  class I alpha-1,2-mannosidase historically called ER mannosidase I (ERManI).
  The enzyme removes the terminal mannose from the middle branch of
  Man9GlcNAc2, a step that both feeds normal N-glycan maturation and marks
  misfolded glycoproteins for ER-associated degradation. Its loss slows that
  trimming step, leaves hybrid-type N-glycans on circulating glycoproteins and
  produces a type 2 serum transferrin pattern with a raised trisialotransferrin
  fraction, so the disorder is classed as a CDG type II.

  Clinically it is a comparatively mild CDG. Intellectual disability with
  delayed motor and speech development is present in essentially every
  reported patient, usually in the mild to moderate range, together with a
  recognisable facial gestalt (hypertelorism, downslanting palpebral fissures,
  large low-set ears, a thin upper lip with an underdeveloped nasolabial fold),
  hypotonia, and in many patients truncal obesity and macrocephaly. Joint
  hypermobility and skin laxity, aggressive behaviour, seizures and isolated
  transaminase elevation occur in a subset. Growth is usually preserved, unlike
  most CDGs. The disorder was first reported as non-syndromic autosomal
  recessive intellectual disability (MRT15, later Rafiq syndrome) before the
  glycosylation defect was recognised, and both names remain in use.
synonyms:
- MAN1B1-CDG
- intellectual disability, autosomal recessive 15
- MRT15
- Rafiq syndrome
- intellectual disability-truncal obesity syndrome
- congenital disorder of glycosylation type II due to MAN1B1 deficiency

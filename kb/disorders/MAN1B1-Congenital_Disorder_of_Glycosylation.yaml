- name: Multisystem Glycoprotein Dysfunction
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The somatic features (the facial gestalt, truncal obesity, macrocephaly,
    joint hypermobility and skin laxity, transaminase elevation and occasional
    coagulation abnormalities) are attributed in the literature to the
    disorder as a whole, and nothing has tied any of them to a specific
    glycoprotein or tissue mechanism. This node records that attribution
    without naming a mechanism the literature does not give. Two features are
    notably unusual for a CDG: obesity rather than failure to thrive, and
    usually normal growth.
  downstream:
  - target: Truncal obesity

has_subtypes:
- name: A4V
  display_name: SOD1 p.Ala4Val (A4V, legacy numbering; p.Ala5Val in HGVS)
  description: >-
    The most common SOD1 allele in North America and the most aggressive. Carriers share
    a stereotyped course with death on average at 1.4 years from onset, against 3-5 years
    for other dominant SOD1 variants. It descends from a single founder chromosome
    estimated at roughly 12,000 years old whose haplotype is closer to Asian than European
    reference populations, consistent with an origin in the ancestral population that
    entered the Americas via the Bering Strait. Sequencing the conserved region around
    SOD1 found no linked modifier accounting for the aggressive phenotype, so the severity
    appears to be a property of the allele itself.
  evidence:
  - reference: PMID:18055113
    reference_title: "SOD1A4V-mediated ALS: absence of a closely linked modifier gene and origination in Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carriers of the SOD1(A4V) mutation share a common phenotype with rapid disease progression and death on average occurring at 1.4 years (versus 3-5 years with other dominant SOD1 mutations)."
    explanation: Quantifies the survival difference that makes this allele a clinically distinct stratum.
  - reference: PMID:18055113
    reference_title: "SOD1A4V-mediated ALS: absence of a closely linked modifier gene and origination in Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It therefore appears likely that the aggressive nature of the SOD1(A4V) mutation is not a result of a modifying factor within the region around the SOD1 gene."
    explanation: Excludes a linked modifier, supporting the severity being intrinsic to the allele.
- name: D90A homozygous
  display_name: SOD1 p.Asp90Ala homozygous (D90A/D91A, recessive Scandinavian form)
  description: >-
    The most frequent SOD1 mutation worldwide and the principal recessive form. Homozygotes
    follow a stereotyped, slowly evolving course beginning in the legs, and the phenotype
    reaches outside the motor system: reported features include sensory, autonomic and
    urinary bladder involvement, and neuropathology in nine homozygotes showed degeneration
    of the dorsal columns alongside the corticospinal tracts, with frontal, temporal and
    insular gliosis. Rare carriers present with progressive gait ataxia years before motor
    neuron signs. The allele is also the cleanest human demonstration of gain of function,
    since the mutant protein has normal content and enzymatic activity in the CNS.
  evidence:
  - reference: PMID:36385230
    reference_title: "Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heredity is usually recessive, the phenotype is stereotypic with slowly evolving motor symptoms beginning in the legs and may also include sensory, autonomic, and urinary bladder involvement"
    explanation: Defines the recessive inheritance and the extra-motor clinical features of this stratum.
  - reference: PMID:36385230
    reference_title: "Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to degeneration of the corticospinal tracts, all patients had degeneration of the dorsal columns."
    explanation: Neuropathological confirmation that the lesion extends beyond motor pathways in D90A homozygotes.

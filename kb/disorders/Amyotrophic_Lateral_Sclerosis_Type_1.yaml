    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Provide coordinated care for people with ALS using a clinic‐based, specialist ALS MDT approach.
    explanation: The guideline supports coordinated ALS care rather than a SOD1-specific intervention trial.
- name: Noninvasive Ventilation
  description: Offer noninvasive ventilation when symptoms, signs or investigations support respiratory insufficiency, with efforts to accommodate bulbar dysfunction. Discuss invasive ventilation in advance according to preferences and clinical circumstances. Diaphragmatic pacing is not recommended.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: NIV should be offered to all patients with ALS with either symptoms, signs, or laboratory investigations supportive of respiratory insufficiency.
    explanation: Ventilatory support compensates for respiratory impairment; it does not reverse motor neuron degeneration.
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Do not use diaphragmatic pacing for the treatment of ALS.
    explanation: The guideline distinguishes ventilatory support from ineffective diaphragm pacing.
  target_mechanisms:
  - target: Respiratory Insufficiency
    treatment_effect: BYPASSES
    description: Ventilatory support compensates for respiratory impairment; it does not reverse motor neuron degeneration.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: NIV should be offered to all patients with ALS with either symptoms, signs, or laboratory investigations supportive of respiratory insufficiency.
      explanation: Ventilatory support compensates for respiratory impairment; it does not reverse motor neuron degeneration.
- name: Nutritional Support and Gastrostomy
  description: Assess swallowing, nutrition and feeding effort and discuss gastrostomy early, revisiting the decision as disease progresses. In respiratory insufficiency, introduce NIV and perform gastrostomy with the patient established on NIV. Tube feeding supports nutritional delivery without restoring bulbar motor function.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Discuss gastrostomy at an early stage, and at regular intervals as ALS progresses, taking into account the person's preferences and issues, such as ability to swallow, weight loss, respiratory function, effort of feeding and drinking, and risk of choking.
    explanation: Gastrostomy can bypass impaired oral swallowing to provide nutrition, with timing individualized.
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If there is respiratory insufficiency, perform the gastrostomy with the patient established on NIV.
    explanation: Respiratory support is part of safe gastrostomy planning in people with respiratory impairment.
  target_mechanisms:
  - target: Dysphagia
    treatment_effect: BYPASSES
    description: Gastrostomy can bypass impaired oral swallowing to provide nutrition, with timing individualized.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Discuss gastrostomy at an early stage, and at regular intervals as ALS progresses, taking into account the person's preferences and issues, such as ability to swallow, weight loss, respiratory function, effort of feeding and drinking, and risk of choking.
      explanation: Gastrostomy can bypass impaired oral swallowing to provide nutrition, with timing individualized.
- name: Cough Augmentation
  description: Manual assisted cough or breath stacking can assist ineffective cough, with mechanical cough assistance considered when needed. This is a general ALS supportive intervention.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Offer cough augmentation techniques, such as manual assisted cough, to people with ALS who cannot cough effectively.
    explanation: The guideline recommends augmenting an ineffective cough.
- name: Communication Support
  description: Speech-language assessment and augmentative or alternative communication equipment should be provided promptly, with adaptation as abilities change. Communication aids compensate for impaired speech rather than restoring the underlying motor neurons.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Provide AAC equipment that meets the needs of the person without delay to maximise participation in activities of daily living and maintain quality of life.
    explanation: Communication equipment bypasses impaired speech production to support communication.
  target_mechanisms:
  - target: Dysarthria
    treatment_effect: BYPASSES
    description: Communication equipment bypasses impaired speech production to support communication.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Provide AAC equipment that meets the needs of the person without delay to maximise participation in activities of daily living and maintain quality of life.
      explanation: Communication equipment bypasses impaired speech production to support communication.
- name: Rehabilitation and Mobility Support
  description: Exercise, positioning and assistive or orthotic support are individualized to function, fatigue and preferences. Goals include joint mobility, comfort and participation; a SOD1-specific disease-modifying effect is not established.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Choose a programme that is appropriate to the person's level of function and tailored to their needs, abilities, and preferences.
    explanation: The guideline supports individualized physical rehabilitation rather than fixed-intensity exercise.
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If a person needs orthoses to help with muscle problems, they should be referred to orthotics services without delay, and the orthoses should be provided without delay.
    explanation: Orthoses support function when muscle weakness causes a need.
- name: Spasticity Management
  description: Physical therapy and, where appropriate, baclofen, tizanidine, gabapentin or other guideline-listed agents can relieve stiffness and spasticity. Choice depends on comorbidity, tolerability and functional consequences.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider cannabinoids, baclofen, tizanidine, or gabapentin to treat muscle stiffness, spasticity, or increased tone.
    explanation: These symptomatic treatments reduce spasticity without reversing the causal motor neuron disease.
  target_mechanisms:
  - target: Spasticity
    treatment_effect: INHIBITS
    description: These symptomatic treatments reduce spasticity without reversing the causal motor neuron disease.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Consider cannabinoids, baclofen, tizanidine, or gabapentin to treat muscle stiffness, spasticity, or increased tone.
      explanation: These symptomatic treatments reduce spasticity without reversing the causal motor neuron disease.
- name: Muscle Cramp Management
  description: Symptomatic treatment of troublesome cramps may include agents such as mexiletine or baclofen, selected with attention to comorbidities and adverse effects. Cardiac risk requires particular consideration for relevant drugs.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider sodium blockers (ranolazine, quinine sulfate, mexiletine, carbamazepine), gabapentine, pregabalin, and baclofen for the management of cramps as symptomatic treatment.
    explanation: The general ALS guideline supports symptomatic cramp treatment.
  target_mechanisms:
  - target: Muscle Cramps
    treatment_effect: INHIBITS
    description: The general ALS guideline supports symptomatic cramp treatment.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Consider sodium blockers (ranolazine, quinine sulfate, mexiletine, carbamazepine), gabapentine, pregabalin, and baclofen for the management of cramps as symptomatic treatment.
      explanation: The general ALS guideline supports symptomatic cramp treatment.
- name: Emotional Lability Management
  description: Emotional lability should be distinguished from depression or frontotemporal cognitive/behavioral symptoms. SSRIs, tricyclic antidepressants or dextromethorphan/quinidine may be considered according to comorbidity and tolerability.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider selective serotonin reuptake inhibitor (SSRI) antidepressants, tricyclic antidepressants, or DMQ for treating emotional lability in people with ALS.
    explanation: General ALS recommendations support symptom reduction for emotional lability.
  target_mechanisms:
  - target: Emotional Lability
    treatment_effect: INHIBITS
    description: General ALS recommendations support symptom reduction for emotional lability.
    evidence:
    - reference: PMID:38470068
      reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Consider selective serotonin reuptake inhibitor (SSRI) antidepressants, tricyclic antidepressants, or DMQ for treating emotional lability in people with ALS.
      explanation: General ALS recommendations support symptom reduction for emotional lability.
- name: Saliva and Secretion Management
  description: If troublesome sialorrhea develops, consider anticholinergic treatment with attention to adverse effects and coexisting bulbar problems; refractory severe symptoms may warrant specialist botulinum toxin. This care indication does not establish a disease-wide frequency of sialorrhea in SOD1 ALS.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider anticholinergics (e.g., amitriptyline, atropine, glycopyrrolate, oxybutynin, scopolamine) as first‐line treatment.
    explanation: The recommendation applies to the guideline section on symptomatic sialorrhea management.
- name: Psychological and Palliative Support
  description: Offer psychological support, caregiver support and individualized advance care planning throughout the disease course. Discuss ventilation, feeding and end-of-life preferences at a time and in a manner appropriate to the individual.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Offer the person and their family/carers information about sources of emotional and psychological support, including support groups and online forums, and respite care.
    explanation: The guideline supports psychosocial care for patients and carers.
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Be prepared to discuss end‐of‐life issues whenever people wish to do so
    explanation: The guideline supports ongoing access to preference-sensitive end-of-life discussion.
- name: Genetic Counseling and Predictive Testing
  therapeutic_modality: BEHAVIORAL
  description: Genetic counseling addresses variant-specific inheritance, age-dependent penetrance, reproductive options, implications for relatives and the psychosocial consequences of predictive testing. Testing an unaffected relative requires informed counseling; a positive result does not predict an individual onset date. ATLAS is evaluating biomarker-triggered presymptomatic therapy in a selected carrier group, rather than establishing routine presymptomatic treatment.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35585374
    reference_title: 'Design of a Randomized, Placebo-Controlled, Phase 3 Trial of Tofersen Initiated in Clinically Presymptomatic SOD1 Variant Carriers: the ATLAS Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: During screening for enrollment in Part A of the study, genetic counseling sessions are required before a DNA sample is collected for testing and at the time that the results are communicated.
    explanation: The ATLAS protocol illustrates pre- and post-test counseling rather than a demonstrated preventive treatment benefit.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1450/
    reference_title: Amyotrophic Lateral Sclerosis Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Potential consequences of such testing (including, but not limited to, socioeconomic changes, the need for long-term follow up and evaluation arrangements for individuals with a positive test result)
    explanation: The counseling section explicitly includes these possible consequences of predictive testing.
animal_models:
- name: SOD1 G93A transgenic mouse
  species: Mouse
  genotype: High-expression human SOD1 G93A transgene
  publication: PMID:8209258
  description: High-level expression of the G93A variant, which has little effect on enzyme activity, causes progressive paralysis and spinal motor neuron loss.
  evidence:
  - &id010
    reference: PMID:8209258
    reference_title: Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The mice became paralyzed in one or more limbs as a result of motor neuron loss from the spinal cord and died by 5 to 6 months of age.
    explanation: The original report documents spinal motor neuron loss and paralysis.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    description: Reproduces progressive motor neuron loss with a defined mutant SOD1 transgene.
    limitations: Supraphysiological transgene dosage differs from endogenous human alleles. Prior poor response of high-copy lines to homogenate seeding has no definitive explanation and does not refute their motor degeneration.
    evidence:
    - *id010
- name: SOD1-null mouse
  species: Mouse
  genotype: Homozygous Sod1 knockout
  publication: PMID:8673102
  description: Complete SOD1 deficiency did not produce overt motor deficits by six months, but increased motor neuron vulnerability after axonal injury. This tests simple absence of the enzyme rather than every possible loss-of-function contribution to ALS.
  evidence:
  - &id011
    reference: PMID:8673102
    reference_title: Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: These animals develop normally and show no overt motor deficits by 6 months in age.
    explanation: The negative result is limited to the described development and observation period.
  - reference: PMID:8673102
    reference_title: Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: These results indicate that Cu/Zn SOD is not necessary for normal motor neuron development and function but is required under physiologically stressful conditions following injury.
    explanation: The injury result demonstrates a physiological protective role.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: FAILS_TO_RECAPITULATE
    model_scale: ORGANISM
    description: Does not reproduce spontaneous ALS-like motor degeneration by the reported six-month assessment.
    limitations: The observation period and injury dependence preclude an absolute lifetime or stress-independent negative claim. ALS1 includes several inheritance contexts, not only heterozygous missense alleles.
    evidence:
    - *id011
- name: Microglial and motor-neuron conditional SOD1 reduction
  species: Mouse
  genotype: Deletable mutant human SOD1 transgene with lineage-restricted excision
  publication: PMID:16741123
  description: Lineage-directed reduction separates motor-neuron contributions to onset/early progression from a microglial contribution to later progression in the tested transgenic model.
  evidence:
  - &id012
    reference: PMID:16741123
    reference_title: Onset and progression in inherited ALS determined by motor neurons and microglia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Diminishing the mutant levels in microglia had little effect on the early disease phase but sharply slowed later disease progression.
    explanation: The conditional model distinguishes the microglial progression contribution.
  modeled_mechanisms:
  - target: Microglial Mutant SOD1 Contribution
    relationship: PERTURBS
    model_scale: ORGANISM
    description: Microglial reduction slows later progression.
    limitations: The cached source is abstract-only; exact Cre specificity and quantitative excision details are not imported. The phase division is not assumed universal in human ALS.
    evidence:
    - *id012
- name: Astrocyte conditional SOD1 reduction
  species: Mouse
  genotype: Deletable mutant human SOD1 transgene with astrocytic reduction
  publication: PMID:18246065
  description: Reduced astrocytic mutant expression delays microglial activation and later disease progression in the reported mouse study.
  evidence:
  - &id013
    reference: PMID:18246065
    reference_title: Astrocytes as determinants of disease progression in inherited amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: diminished mutant expression in astrocytes did not affect onset, but delayed microglial activation and sharply slowed later disease progression
    explanation: Astrocytic reduction modifies the measured progression and activation outcomes.
  modeled_mechanisms:
  - target: Astrocytic Mutant SOD1 Contribution
    relationship: PERTURBS
    model_scale: ORGANISM
    description: Perturbs an astrocytic contribution to disease progression.
    limitations: The cached abstract does not resolve the secreted or contact-dependent mediator. Delayed microglial activation alone does not prove that microglia completely mediate the benefit.
    evidence:
    - *id013
- name: ASK1-deficient SOD1 G93A mice
  species: Mouse
  genotype: SOD1 G93A transgene crossed with Ask1-null mice
  publication: PMID:18519638
  description: In male low-copy G1L mice, ASK1 deletion extends survival and partly preserves spinal motor neurons without delaying motor onset; a high-copy comparison also shows a survival extension without onset change.
  evidence:
  - &id014
    reference: PMID:18519638
    reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: the mean survival of SOD1G93A/ASK1−/− mice was 38.4 ± 2.7 wk (±SEM) and significantly longer than the 34.9 ± 1.6 wk survival of control SOD1G93A mice
    explanation: ASK1 deletion delays the terminal endpoint in the male low-copy model.
  - reference: PMID:18519638
    reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: ASK1 deficiency also extended the survival of SOD1G93A(high) mice but not the time of onset
    explanation: The onset/progression distinction is preserved in the reported additional model.
  modeled_mechanisms:
  - target: ASK1 Kinase Activation
    relationship: PERTURBS
    model_scale: ORGANISM
    description: Genetic removal tests the contribution of ASK1 to model progression.
    limitations: Protection is partial, sex and transgene context are restricted, and a constitutive knockout is not a clinical drug intervention. The study does not establish aggregate-independent protection.
    evidence:
    - *id014
  - target: Motor Neuron Degeneration
    relationship: PERTURBS
    model_scale: ORGANISM
    description: ASK1 deficiency mitigates the loss of spinal motor neurons.
    limitations: The result does not identify every downstream death effector or imply prevention of ALS onset.
    evidence:
    - reference: PMID:18519638
      reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: These findings indicated that the absence of ASK1 mitigates motor neuron death in ALS mice.
      explanation: Direct histology complements the survival endpoint.
- name: Low-copy SOD1 homogenate-seeding recipients
  species: Mouse
  genotype: VLE G93A on B6SJL and homozygous G85R:YFP Line 230 on FVB/NJ
  publication: PMID:41702846
  description: Adult intrathecal inoculation uses 4 microliters containing 2 microliters of 10% spinal-cord homogenate and lidocaine. Donors, recipient genotypes, ages and passage histories vary across comparisons. Paralysis leading to humane euthanasia is the primary endpoint.
  evidence:
  - &id015
    reference: PMID:41702846
    reference_title: Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: injected intrathecally with seeding homogenates containing misfolded G93A or G85R SOD1 developed accelerated motor neuron disease efficiently
    explanation: The study tests disease induction in susceptible transgenic recipients.
  - reference: PMID:41702846
    reference_title: Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The primary humane endpoint for all injections was overt paralysis of at least one hindlimb.
    explanation: Defines the operational endpoint rather than spontaneous death.
  modeled_mechanisms:
  - target: Seeded SOD1 Inclusion Pathology
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    description: Homogenate inoculation accelerates inclusion-associated disease in susceptible hosts.
    limitations: Inocula are not purified or seed-titer normalized. Age, route, batch and passage vary together; long incubation overlaps spontaneous disease in some older animals. Conditional incubation analyses exclude asymptomatic animals. An internal six-versus-five denominator discrepancy prevents a universal seeding-rate estimate.
    evidence:
    - *id015
  - target: Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    description: The inoculated mice reach an accelerated motor disease endpoint.
    limitations: The experiment does not prove necessity of cell-to-cell propagation in human ALS or isolate which aggregate species kills neurons.
    evidence:
    - *id015
- name: SOD1 G85R with wild-type or D90A coexpression
  species: Mouse
  genotype: G85R/WT or G85R/D90A double transgenes on C57BL/6J
  publication: PMID:40450581
  description: Both double-transgenic lines have earlier onset and shorter endpoint survival than G85R alone. Wild-type coexpression aggravates the phenotype more than D90A; D90A also prolongs onset-to-endpoint duration. Insoluble pools contain both expressed proteins and show strain-A epitope profiles.
  evidence:
  - &id016
    reference: PMID:40450581
    reference_title: Diverse effects of coexpression of human SOD1 variants on motor neuron disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: In both cases, the lifespans of the combined Tg mice were shortened, but the effect of coexpression of hSOD1WT was far greater than that of hSOD1D90A
    explanation: Both coexpression combinations aggravate the endpoint relative to G85R alone; D90A is less aggravating, not protective.
  modeled_mechanisms:
  - target: Cytoplasmic SOD1 Aggregate Formation
    relationship: PERTURBS
    model_scale: ORGANISM
    description: Coexpression modifies aggregate accumulation and disease kinetics.
    limitations: WT expression is about 2.5-fold higher than D90A, confounding a purely sequence-based comparison. Coaccumulation does not directly demonstrate hybrid-fibril nucleation. No WT/D90A human heterozygous genotype was tested, so human recessivity remains a proposed explanation.
    evidence:
    - *id016
    - reference: PMID:40450581
      reference_title: Diverse effects of coexpression of human SOD1 variants on motor neuron disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Although not shown here directly, we suggest that the mechanism involves direct combination of hSOD1WT or hSOD1D90A with hSOD1G85R to accelerate the nucleation and growth of aggregate fibrils.
      explanation: The authors explicitly distinguish inferred coassembly from a measured molecular event.
- name: Borsantrazole-treated SOD1 G37R mice
  species: Mouse
  genotype: High-copy SOD1 G37R line 42
  publication: PMID:42503607
  description: Presymptomatic daily intraperitoneal borsantrazole, 10 mg/kg from day 90, was compared with vehicle in 12 mice per group, six of each sex. The study reports delayed onset, less weight loss and a longer humane-endpoint survival. Borsantrazole remains an experimental compound.
  evidence:
  - &id017
    reference: PMID:42503607
    reference_title: 'Introducing Borsantrazole: A Trifunctional Boron-Based Pyrazole That Extends the Lifespan of Amyotrophic Lateral Sclerosis Mice.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: the mean age of survival differed significantly between the vehicle‐treated (177.9 days) and the BSZ‐treated group (193 days).
    explanation: The primary model reports a 15.1-day difference in mean terminal age.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: PERTURBS
    model_scale: ORGANISM
    description: The intervention modifies disease-related motor and terminal outcomes in one transgenic model.
    limitations: There is no human efficacy result or in vivo edaravone comparator. Small sex subgroups do not establish a treatment-by-sex interaction. End-stage male spinal proteomics is exploratory and does not prove antioxidant, NRF2 or autophagy mediation; limited mouse safety assays do not establish clinical safety.
    evidence:
    - *id017
- name: SOD1 G93A motor-neuron multiomic atlas
  species: Mouse
  genotype: High-copy SOD1 G93A transgene
  publication: PMID:42335888
  description: Single-nucleus and spatial analyses identify a disease-associated alpha-motor-neuron transcriptional state across separately sampled disease stages. Human postmortem data include 12 SOD1 ALS donors and support related signature changes.
  evidence:
  - &id018
    reference: PMID:42335888
    reference_title: An emergent disease-associated motor neuron state precedes cell death in ALS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: mid-stage (~P100), end-stage (~P125), and age-matched, non-transgenic control mice
    explanation: Defines a cross-sectional stage series rather than repeated sampling of the same neurons.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    description: Profiles molecular states associated with vulnerable motor neurons during model progression.
    limitations: Pseudotime and cross-stage sampling do not trace individual neurons to death. The DM program includes potentially protective responses and is not an established causal intermediate or survival predictor. Human analysis retains only 150 bona fide alpha nuclei across all conditions, with neuronal fragments as a separate assay.
    evidence:
    - *id018
clinical_trials:
- name: NCT02623699
  phase: PHASE_III
  status: COMPLETED
  description: The phase III VALOR component of a multipart tofersen study randomized 108 symptomatic adults. The primary 28-week clinical endpoint in the 60-participant faster-progression subgroup was not met, while CSF SOD1 and plasma NfL fell. Its linked extension is recorded separately as NCT03070119.
  evidence:
  - reference: clinicaltrials:NCT02623699
    reference_title: A Study to Evaluate the Efficacy, Safety, Tolerability, Pharmacokinetics, and Pharmacodynamics of BIIB067 Administered to Adult Subjects With Amyotrophic Lateral Sclerosis and Confirmed Superoxide Dismutase 1 Mutation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The primary objective of Part C of this study is to evaluate the clinical efficacy of tofersen administered to adults with ALS and a confirmed SOD1 mutation.
    explanation: Registry record establishing the trial that supports SOD1-directed therapy in this entry.
- name: NCT04856982
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: ATLAS evaluates tofersen initiated before clinical onset in selected adult SOD1-variant carriers with elevated neurofilament. The registry remained active, not recruiting, on 2026-09-21. Preventive efficacy is unresolved; the published protocol is not an outcome report.
  evidence:
  - reference: clinicaltrials:NCT04856982
    reference_title: A Phase 3 Randomized, Placebo-Controlled Trial With a Longitudinal Natural History Run-In and Open-Label Extension to Evaluate BIIB067 Initiated in Clinically Presymptomatic Adults With a Confirmed Superoxide Dismutase 1 Mutation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The primary objective of this study is to evaluate the efficacy of tofersen in presymptomatic adult carriers of a superoxide dismutase 1 (SOD1) mutation with elevated neurofilament (NF).
    explanation: Registry record for the presymptomatic-initiation trial referenced in the genetic counseling treatment entry.
- name: NCT03070119
  phase: PHASE_III
  status: COMPLETED
  description: Open-label extension of prior tofersen studies. The long-term VALOR comparison retained initial randomized early/delayed assignment, although both groups could receive active drug after crossover. The registry covers a broader extension population than the 95 VALOR participants entering its extension.
  evidence:
  - reference: clinicaltrials:NCT03070119
    reference_title: An Extension Study to Assess the Long-Term Safety, Tolerability, Pharmacokinetics, and Effect on Disease Progression of BIIB067 Administered to Previously Treated Adults With Amyotrophic Lateral Sclerosis Caused by Superoxide Dismutase 1 Mutation
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: The primary objective of the study is to evaluate the long-term safety and tolerability of BIIB067 (tofersen) in participants with amyotrophic lateral sclerosis (ALS) and confirmed superoxide dismutase 1 (SOD1) mutation.
    explanation: The registry identifies the extension scope.
discussions:
- discussion_id: sod1_model_dose_and_human_response
  kind: HUMAN_MODEL_MISMATCH
  prompt: How does transgene dosage affect translation of SOD1 model interventions to human ALS?
  attaches_to:
  - animal_models#SOD1 G93A transgenic mouse
  - animal_models#Low-copy SOD1 homogenate-seeding recipients
  rationale: Human pathogenic alleles and high-copy transgenic models differ in expression, genotype and disease timing. Seeding susceptibility varies across model and inoculation conditions, but no isolated transgene-dose experiment explains every difference. This uncertainty does not establish why VALOR missed its 28-week clinical endpoint; timing, power, progression heterogeneity and other factors remain possible.
- discussion_id: human_sod1_toxic_mediation
  kind: KNOWLEDGE_GAP
  prompt: Which abnormal SOD1 species and downstream cellular pathways drive progression in patients?
  attaches_to:
  - pathophysiology#Cytoplasmic SOD1 Aggregate Formation
  - pathophysiology#Mutant SOD1 Association with Derlin-1
  - pathophysiology#Microglial Mutant SOD1 Contribution
  - pathophysiology#Astrocytic Mutant SOD1 Contribution
  rationale: Human tissue demonstrates SOD1 pathology, while experimental perturbations support contributions from ER stress/ASK1 and non-neuronal cells. Visible inclusions, soluble species and associated transcriptional states are not interchangeable causal entities. Relative mediation in human genotypes and the effects of lowering protein supply on pre-existing aggregates remain unresolved.
- discussion_id: dm_state_causal_meaning
  kind: KNOWLEDGE_GAP
  prompt: Does the disease-associated motor-neuron signature contribute to injury, reflect compensation, or contain both?
  attaches_to:
  - biochemical#Disease-associated motor neuron transcriptional signature
  - experimental_models#WTC11 motor-neuron transcription-factor perturbation
  rationale: The mouse stage series and human postmortem data establish association. Some signature regulators may be protective, and forced CREB3/ATF3 expression changes only parts of the program without a death or rescue assay. Neither pseudotime, glial proximity nor computational ligand nomination proves a DM-state-to-death mechanism.
datasets:
- accession: geo:GSE271030
  title: RNA Expression Profiling in Lymphoblastoid Cell Lines from Mutated and Non-Mutated Amyotrophic Lateral Sclerosis Patients
  data_type: BULK_RNA_SEQ
  description: RNA-seq of patient-derived lymphoblastoid cell lines in which SOD1-mutated patients are one of four genotype subgroups (alongside FUS, TARDBP and C9ORF72) compared with sporadic ALS and matched controls. Included because the study stratifies by causal gene and so contains an ALS1 arm; it is not a SOD1-only dataset, and the authors report that expression profiles were genotype-specific, which is what makes the SOD1 arm separable rather than pooled.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38967638
  notes: Patient-derived lymphoblastoid lines provide a non-neuronal genotype-stratified transcriptomic resource. Expression differences do not by themselves establish motor-neuron causal pathways.
  evidence:
  - reference: GEO:GSE271030
    reference_title: RNA Expression Profiling in Lymphoblastoid Cell Lines from Mutated and Non-Mutated Amyotrophic Lateral Sclerosis Patients
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a transcriptomic profiling of Sporadic ALS (SALS) and mutated patients (FUS, TARDBP, C9ORF72 and SOD1), and matched controls was realized
    explanation: The repository record states that SOD1-mutated patients are one of the profiled genotype subgroups, which is what makes this dataset relevant to ALS1.
  - reference: GEO:GSE271030
    reference_title: RNA Expression Profiling in Lymphoblastoid Cell Lines from Mutated and Non-Mutated Amyotrophic Lateral Sclerosis Patients
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Gene expression profiles of LCLs were genetic-background specific, indeed only 12 genes were commonly deregulated in all groups.
    explanation: Reports that expression profiles differed by genetic background, with almost no shared deregulated genes. This is what makes the SOD1 arm worth analysing separately rather than pooling it into a generic ALS signature; it is not itself a SOD1-specific result.

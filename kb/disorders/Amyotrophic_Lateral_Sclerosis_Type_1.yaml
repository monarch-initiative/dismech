- name: Progressive Muscle Denervation
  biological_scale: ORGANISM
  description: >-
    Loss of lower motor neurons denervates skeletal muscle. Reinnervation by surviving
    axons is initially compensatory and produces fasciculation, but is progressively
    outstripped, yielding weakness and atrophy. In SOD1-ALS the phenotype is
    predominantly lower motor neuron and predominantly lower limb in onset.

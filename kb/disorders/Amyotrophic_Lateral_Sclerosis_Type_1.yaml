  description: Diagnosis integrates progressive motor impairment, clinical upper/lower motor neuron findings, electromyography when appropriate, and exclusion of alternative causes. Gold Coast criteria permit UMN and LMN involvement in one region or LMN involvement in at least two. In five general suspected-ALS cohorts (3007 participants), pooled sensitivity was 0.96 and specificity 0.68, with very low certainty for specificity; these are not SOD1-specific test characteristics.

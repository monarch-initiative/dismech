      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: In addition to degeneration of the corticospinal tracts, all patients had degeneration of the dorsal columns.
      explanation: Direct pathology establishes involvement outside the motor pathways.
  - target: Functional Abnormality of the Bladder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Urinary manifestations occur in a selected D90A cohort; the causal autonomic pathway is not resolved by the available pathology.

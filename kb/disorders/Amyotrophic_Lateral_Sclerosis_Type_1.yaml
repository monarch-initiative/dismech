inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most ALS1 pedigrees segregate a heterozygous SOD1 missense variant as an autosomal
    dominant trait with age-dependent penetrance. The original linkage study reported
    high penetrance after the sixth decade, but penetrance is strongly allele-dependent
    and incomplete for several variants.
  evidence:
  - reference: PMID:8446170
    reference_title: "Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 10% of cases are inherited as an autosomal dominant trait, with high penetrance after the sixth decade."
    explanation: The founding linkage study states the dominant transmission and age-dependent penetrance of the familial ALS in which SOD1 variants were identified.
- name: Autosomal recessive (Asp90Ala)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The Asp90Ala (D90A, legacy numbering; p.Asp91Ala in current HGVS) allele is the
    principal exception to dominant transmission. In Scandinavian families it behaves
    recessively, with disease requiring homozygosity, and produces a slowly progressive
    phenotype. Homozygous SOD1 genotypes are not confined to Scandinavia: a large Indian
    cohort found homozygosity in 6 of 37 SOD1-ALS probands, associated with earlier onset.
  evidence:
  - reference: PMID:7647793
    reference_title: "Amyotrophic lateral sclerosis associated with homozygosity for an Asp90Ala mutation in CuZn-superoxide dismutase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report homozygosity for an exon 4 mutation, Asp90Ala in fourteen patients among four unrelated ALS families and four apparently sporadic ALS patients from Sweden and Finland."
    explanation: Establishes recessive (homozygous) inheritance for the Asp90Ala allele in Scandinavian ALS families.
  - reference: PMID:41511639
    reference_title: "Clinical trajectories and genetic profiles of SOD1-related amyotrophic lateral sclerosis: insights from a single-center cohort in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, a high frequency of homozygous variants (6 patients) were observed in the cohort, which were associated with earlier disease onset."
    explanation: Shows homozygous SOD1 genotypes occur outside the Scandinavian Asp90Ala founder population and modify age at onset.
genetic:
- name: SOD1
  gene_term:
    preferred_term: SOD1
    term:
      id: hgnc:11179
      label: SOD1
  relationship_type: CAUSATIVE
  notes: >-
    SOD1 encodes the homodimeric cytosolic Cu/Zn superoxide dismutase, which catalyses
    dismutation of superoxide to oxygen and hydrogen peroxide. Over 200 ALS-associated
    variants are known, overwhelmingly missense and distributed across all five exons
    rather than clustered in a single functional domain — consistent with a mechanism
    driven by protein destabilisation rather than by disruption of one active site.
    Allele identity is the dominant determinant of clinical course: Ala4Val (p.Ala5Val)
    predicts markedly shortened survival, whereas Gly37Arg, Gly41Asp, Gly93Cys and
    Asp90Ala predict longer survival.
  frequency: roughly a fifth to a quarter of familial ALS in most series
  case_fractions:
  - population: Familial ALS probands, single-center Indian cohort (NIMHANS)
    case_fraction_percent: 24.2
    notes: >-
      37 SOD1-ALS probands from 33 families among 765 individuals undergoing whole-exome
      sequencing; the 24.2% figure is the share of familial ALS, while SOD1-ALS was 4.8%
      of the whole sequenced cohort.
    evidence:
    - reference: PMID:41511639
      reference_title: "Clinical trajectories and genetic profiles of SOD1-related amyotrophic lateral sclerosis: insights from a single-center cohort in India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among 765 individuals who underwent WES, 37 probands (4.8%) from 33 families were identified with SOD1-ALS, representing a substantial 24.2% of familial ALS (fALS) cases."
      explanation: Quantifies the SOD1 share of familial ALS in a contemporary large cohort.
  - population: All amyotrophic lateral sclerosis
    case_fraction_percent: 2.0
    notes: >-
      Share of all ALS, familial and sporadic combined, attributable to a pathogenic SOD1
      variant. A separate neuropathological series puts the range at 2-6% of ALS patients,
      so treat 2% as the low end of a range rather than a settled point estimate.
    evidence:
    - reference: PMID:41661214
      reference_title: "Long-Term Tofersen in SOD1 Amyotrophic Lateral Sclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Approximately 2% of amyotrophic lateral sclerosis (ALS) cases are attributable to a pathogenic variant in the superoxide dismutase 1 (SOD1) gene."
      explanation: States the SOD1 share of all ALS.
    - reference: PMID:36385230
      reference_title: "Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the gene encoding the ubiquitously expressed free radical scavenging enzyme superoxide dismutase-1 (SOD1) are found in 2-6% of amyotrophic lateral sclerosis patients."
      explanation: Gives the wider reported range, recorded so the 2% figure is not read as more precise than the literature supports.
  - population: Familial ALS, North American series
    case_fraction_percent: 20.0
    notes: Approximately one in five familial ALS cases attributed to SOD1.
    evidence:
    - reference: PMID:18055113
      reference_title: "SOD1A4V-mediated ALS: absence of a closely linked modifier gene and origination in Asia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Approximately 20% of cases are due to mutations in the Cu/Zn superoxide dismutase gene (SOD1)."
      explanation: Independent estimate of the SOD1 share of familial ALS, for comparison with the 24.2% Indian cohort figure.
  evidence:
  - reference: PMID:8446170
    reference_title: "Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 11 different SOD1 missense mutations in 13 different FALS families."
    explanation: The original report establishing SOD1 as the ALS1 disease gene.
  - reference: PMID:9029070
    reference_title: "Epidemiology of mutations in superoxide dismutase in amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of one mutation, A4V, correlated with shorter survival. G37R, G41D, and G93C mutations predicted longer survival."
    explanation: Establishes allele-specific survival differences, the basis for treating variant identity as prognostically material.
pathophysiology:
- name: SOD1 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A missense variant in SOD1 is the initiating lesion of ALS1. Variants are scattered
    across the coding sequence rather than concentrated at the catalytic copper site,
    and the resulting protein commonly retains substantial dismutase activity.
  genes:
  - preferred_term: SOD1
    term:
      id: hgnc:11179
      label: SOD1
  molecular_functions:
  - preferred_term: superoxide dismutase activity
    term:
      id: GO:0004784
      label: superoxide dismutase activity
  downstream:
  - target: Misfolded SOD1 Gain of Toxic Function
    causal_link_type: DIRECT
    description: >-
      The variant destabilises the mature homodimer, producing a protein that misfolds
      rather than one that has simply lost catalytic activity.
    evidence:
    - reference: PMID:8209258
      reference_title: "Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results show that dominant, gain-of-function mutations in SOD contribute to the pathogenesis of familial ALS."
      explanation: States that the pathogenic consequence of the variant is a dominant gain of function, which is the edge from variant to toxic misfolded species.
  evidence:
  - reference: PMID:8446170
    reference_title: "Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report tight genetic linkage between FALS and a gene that encodes a cytosolic, Cu/Zn-binding superoxide dismutase (SOD1), a homodimeric metalloenzyme that catalyzes the dismutation of the toxic superoxide anion O2.- to O2 and H2O2"
    explanation: Establishes the gene, its product, and its normal catalytic function as the starting point of the mechanism.
- name: Misfolded SOD1 Gain of Toxic Function
  biological_scale: MOLECULAR
  description: >-
    The central mechanistic claim of ALS1. Variant SOD1 adopts a non-native
    conformation that is toxic in its own right, and this toxicity is independent of
    the loss of dismutase activity. Three independent lines of evidence converge: mice
    completely lacking SOD1 have normal motor neurons and no motor deficits; the
    Asp90Ala allele causes ALS while leaving erythrocyte dismutase activity essentially
    normal; and a transgene encoding Gly93Ala — a substitution with little effect on
    enzyme activity — is sufficient to paralyse mice. Loss of dismutase function is
    therefore neither necessary nor sufficient for the disease, and SOD1 lowering rather
    than SOD1 replacement is the rational therapeutic direction.
  biological_processes:
  - preferred_term: protein quality control burden imposed by misfolded SOD1
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: INCREASED
  downstream:
  - target: Cytoplasmic SOD1 Aggregate Formation
    causal_link_type: DIRECT
    description: >-
      Misfolded SOD1 self-associates into the aggregates that constitute the visible
      pathology.
    evidence:
    - reference: PMID:41702846
      reference_title: "Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutations in superoxide dismutase 1 (SOD1) cause paralysis in familial amyotrophic lateral sclerosis and promote its misfolding into neurotoxic aggregates."
      explanation: States the step from misfolding to aggregate formation that this edge asserts.
  - target: Derlin-1 Sequestration and ASK1-Dependent ER Stress
    causal_link_type: DIRECT
    description: >-
      Misfolded SOD1 binds Derlin-1 specifically, and this interaction is the proximate
      cause of the downstream ER stress response.
    evidence:
    - reference: PMID:18519638
      reference_title: "ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we show that SOD1(mut) specifically interacted with Derlin-1, a component of endoplasmic reticulum (ER)-associated degradation (ERAD) machinery and triggered ER stress through dysfunction of ERAD."
      explanation: Directly asserts the causal step from the misfolded protein to ERAD dysfunction and ER stress.
  - target: Non-Cell-Autonomous Glial Toxicity
    causal_link_type: DIRECT
  - target: Prion-Like Templated Propagation of Misfolded SOD1
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8673102
    reference_title: "Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that Cu/Zn SOD is not necessary for normal motor neuron development and function but is required under physiologically stressful conditions following injury."
    explanation: SOD1-null mice have normal motor neurons, so simple loss of dismutase activity does not reproduce the disease and cannot be the mechanism.
  - reference: PMID:7647793
    reference_title: "Amyotrophic lateral sclerosis associated with homozygosity for an Asp90Ala mutation in CuZn-superoxide dismutase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The erythrocyte CuZn-SOD activity is essentially normal. Our findings suggest that this CuZn-SOD mutation causes ALS by a gain of function rather than by loss"
    explanation: Human genetic evidence that ALS occurs with preserved dismutase activity, establishing gain of function in patients rather than only in transgenic models.
  - reference: PMID:8209258
    reference_title: "Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of high levels of human SOD containing a substitution of glycine to alanine at position 93--a change that has little effect on enzyme activity--caused motor neuron disease in transgenic mice."
    explanation: A variant with preserved catalytic activity is sufficient to cause motor neuron disease, completing the gain-of-function argument.
- name: Prion-Like Templated Propagation of Misfolded SOD1
  biological_scale: CELLULAR
  description: >-
    Misfolded SOD1 templates the misfolding of native SOD1, and the resulting species
    move between cells, so pathology spreads rather than arising independently at each
    site. This is the mechanistic candidate for the contiguous, focal-to-generalized
    anatomical spread that characterises ALS clinically. Release from motor neurons is at
    least partly active, occurring through P2X7 receptor activation, and material taken up
    by recipient neurons and microglia reproduces disease-relevant responses — ER stress
    in neurons and TNF-alpha release from microglia — which connects this arm to both the
    ER stress and glial arms rather than leaving it as a separate story.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  downstream:
  - target: Cytoplasmic SOD1 Aggregate Formation
    causal_link_type: DIRECT
    description: >-
      Templated conversion of native SOD1 by a misfolded seed is what grows the
      aggregate burden in a recipient cell.
    evidence:
    - reference: PMID:41702846
      reference_title: "Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "established the prionoid templating properties of misfolded mutant SOD1"
      explanation: Templating is by definition the conversion of native protein into the aggregated form, which is this edge.
  - target: Non-Cell-Autonomous Glial Toxicity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Aggregated SOD1 released from motor neurons is taken up by microglia and elicits a
      pro-inflammatory response, one route by which the propagating species engages glia.
    evidence:
    - reference: PMID:35478453
      reference_title: "P2X7 receptor activation mediates superoxide dismutase 1 (SOD1) release from murine NSC-34 motor neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "could be transmitted to naïve NSC-34 cells and murine EOC13 microglia to induce endoplasmic reticulum (ER) stress and tumour necrosis factor-alpha (TNFα) release, respectively"
      explanation: Directly measures transfer of released SOD1 to microglia and the inflammatory response it triggers, which is this edge.
  evidence:
  - reference: PMID:41702846
    reference_title: "Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings, and other studies in cell models, established the prionoid templating properties of misfolded mutant SOD1."
    explanation: States the templating property that defines this node.
  - reference: PMID:41702846
    reference_title: "Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "injected intrathecally with seeding homogenates containing misfolded G93A or G85R SOD1 developed accelerated motor neuron disease efficiently"
    explanation: Transmission experiment showing that introducing misfolded SOD1 accelerates disease, the in vivo demonstration of seeded propagation.
  - reference: PMID:35478453
    reference_title: "P2X7 receptor activation mediates superoxide dismutase 1 (SOD1) release from murine NSC-34 motor neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP induced the rapid release of aggregated SOD1G93A from NSC-34 cells transiently transfected with SOD1G93A, a process blocked by AZ10606120 and revealing a role for P2X7 in this process."
    explanation: Identifies a specific, pharmacologically blockable release mechanism, making the propagation arm mechanistically concrete rather than inferential.
- name: Cytoplasmic SOD1 Aggregate Formation
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  biological_scale: CELLULAR
  description: >-
    Misfolded SOD1 accumulates as ubiquitin-positive cytoplasmic inclusions in motor
    neurons and glia. These inclusions are the pathological signature that separates
    ALS1 from the rest of ALS: they are immunoreactive for ubiquitin but not for TDP-43,
    and biochemically detectable pathological TDP-43 species are absent. Because
    TDP-43 proteinopathy is present in the great majority of sporadic and non-SOD1
    familial ALS, SOD1-mutant cases sit outside that pathological class, and results
    obtained in SOD1 systems cannot be assumed to transfer to TDP-43-driven ALS.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  biological_processes:
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
  downstream:
  - target: Motor Neuron Degeneration
    causal_link_type: DIRECT
  - target: Extra-Motor CNS Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17469116
    reference_title: "Pathological TDP-43 distinguishes sporadic amyotrophic lateral sclerosis from amyotrophic lateral sclerosis with SOD1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases with SOD1 mutations had ubiquitin-positive neuronal inclusions; however, no cases were immunoreactive for TDP-43."
    explanation: Human postmortem series establishing that ALS1 inclusions are ubiquitin-positive and TDP-43-negative.
  - reference: PMID:17469116
    reference_title: "Pathological TDP-43 distinguishes sporadic amyotrophic lateral sclerosis from amyotrophic lateral sclerosis with SOD1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absence of pathological TDP-43 in cases with SOD1 mutations implies that motor neuron degeneration in these cases may result from a different mechanism, and that cases with SOD1 mutations may not be the familial counterpart of sporadic ALS"
    explanation: The authors' own inference that ALS1 is mechanistically distinct from the TDP-43 proteinopathy that defines most ALS — the pathological basis for curating ALS1 as a separate entry.
- name: Derlin-1 Sequestration and ASK1-Dependent ER Stress
  biological_scale: CELLULAR
  description: >-
    Misfolded SOD1 binds the ERAD component Derlin-1, impairing retrotranslocation of
    misfolded substrates out of the endoplasmic reticulum. The resulting chronic ER
    stress activates apoptosis signal-regulating kinase 1 (ASK1) and a death pathway
    downstream of it. This arm is genetically separable from aggregation: deleting ASK1
    extends survival in SOD1-mutant mice without removing the mutant protein.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: ERAD pathway
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: DECREASED
  downstream:
  - target: Motor Neuron Degeneration
    causal_link_type: DIRECT
    description: >-
      ASK1 activation downstream of the ER stress response is required for the full
      extent of motor neuron loss.
    evidence:
    - reference: PMID:18519638
      reference_title: "ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, deletion of ASK1 mitigated the motor neuron loss and extended the life span of SOD1(mut) transgenic mice."
      explanation: Genetic removal of the downstream kinase reduces motor neuron loss, which is interventional evidence for this specific edge.
  evidence:
  - reference: PMID:18519638
    reference_title: "ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SOD1(mut)-induced ER stress activated the apoptosis signal-regulating kinase 1 (ASK1)-dependent cell death pathway."
    explanation: Defines the ER stress to ASK1 to cell death axis that this node represents.
- name: Non-Cell-Autonomous Glial Toxicity
  biological_scale: TISSUE
  description: >-
    ALS1 is not a cell-autonomous motor neuron disease. Using mice in which the mutant
    gene can be excised in selected lineages, mutant SOD1 acting within motor neurons
    was shown to set disease onset and the early phase of progression, while mutant SOD1
    within microglia and astrocytes governs the later, rapid phase. Onset and progression
    are therefore distinct phases driven by different cell types, which is why
    glia-directed therapy is a rational target for slowing established disease even
    though it would not be expected to delay onset.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  downstream:
  - target: Motor Neuron Degeneration
    causal_link_type: DIRECT
    description: >-
      Reducing mutant SOD1 in glia slows motor neuron loss without altering onset,
      establishing a causal contribution of glia to the progression phase specifically.
    evidence:
    - reference: PMID:16741123
      reference_title: "Onset and progression in inherited ALS determined by motor neurons and microglia."

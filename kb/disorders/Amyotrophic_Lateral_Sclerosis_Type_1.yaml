inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Most SOD1-associated ALS is autosomal dominant, with variant-dependent and age-dependent penetrance. An affected heterozygous parent can transmit the variant to half of offspring, but variant transmission is not a prediction of whether or when ALS will develop. Two reported juvenile p.Asp125Gly cases inherited the variant from asymptomatic fathers; those observations do not establish lifetime nonpenetrance.
  evidence:
  - reference: PMID:8446170
    reference_title: Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We identified 11 different SOD1 missense mutations in 13 different FALS families.
    explanation: The original association identifies pathogenic SOD1 variants in familial ALS; it does not provide an allele-specific penetrance estimate.
  - reference: PMID:42265995
    reference_title: Two Patients With Juvenile-Onset, Rapidly Progressive Amyotrophic Lateral Sclerosis Associated With an SOD1 Variant (p.Asp125Gly) With Incomplete Penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole-exome sequencing revealed the pathogenic variant p.Asp125Gly in the SOD1 gene inherited from asymptomatic fathers
    explanation: The fathers were asymptomatic when described; their ages and subsequent lifetime outcomes are not established by the cached abstract.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1450/
    reference_title: Amyotrophic Lateral Sclerosis Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: ALS has a 50% chance of inheriting the ALS-related
    explanation: Within the autosomal dominant offspring subsection, this fragment gives the transmission probability; it does not quantify penetrance.
- name: Autosomal recessive (Asp90Ala)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: The p.Asp91Ala allele (legacy D90A) segregates recessively in described Swedish and Finnish families, although heterozygous disease occurs in other genetic backgrounds. Homozygous SOD1 variants were also found in six of 37 probands in a selected Indian SOD1-ALS cohort; homozygosity alone does not establish the same variant or inheritance mechanism as Scandinavian D90A.
  evidence:
  - reference: PMID:7647793
    reference_title: Amyotrophic lateral sclerosis associated with homozygosity for an Asp90Ala mutation in CuZn-superoxide dismutase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report homozygosity for an exon 4 mutation, Asp90Ala in fourteen patients among four unrelated ALS families and four apparently sporadic ALS patients from Sweden and Finland.
    explanation: Establishes recessive (homozygous) inheritance for the Asp90Ala allele in Scandinavian ALS families.
  - reference: PMID:41511639
    reference_title: 'Clinical trajectories and genetic profiles of SOD1-related amyotrophic lateral sclerosis: insights from a single-center cohort in India.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, a high frequency of homozygous variants (6 patients) were observed in the cohort, which were associated with earlier disease onset.
    explanation: The selected Indian cohort reports six homozygous genotypes and an association with earlier onset, without establishing a general causal effect of homozygosity.
genetic:
- name: SOD1
  gene_term:
    preferred_term: SOD1
    term:
      id: hgnc:11179
      label: SOD1
  relationship_type: CAUSATIVE
  notes: SOD1 encodes Cu/Zn superoxide dismutase. More than 200 ALS-associated variants are reported, with variant-dependent penetrance and progression. A5V (legacy A4V) is associated with rapid progression in described families, whereas some other variants have slower courses. These associations do not determine an individual prognosis. p.Asp91Ala can occur in recessive or dominant contexts; homozygosity for a different allele does not establish the Scandinavian D90A inheritance mechanism.
  frequency: The SOD1 share of ALS varies by ancestry, familial ascertainment and cohort; the selected Indian cohort reported 24.2% of familial ALS and 4.8% of all sequenced ALS.
  case_fractions:
  - population: Familial ALS probands, single-center Indian cohort (NIMHANS)
    case_fraction_percent: 24.2
    notes: 37 SOD1-ALS probands from 33 families among 765 individuals undergoing whole-exome sequencing; the 24.2% figure is the share of familial ALS, while SOD1-ALS was 4.8% of the whole sequenced cohort.
    evidence:
    - reference: PMID:41511639
      reference_title: 'Clinical trajectories and genetic profiles of SOD1-related amyotrophic lateral sclerosis: insights from a single-center cohort in India.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Among 765 individuals who underwent WES, 37 probands (4.8%) from 33 families were identified with SOD1-ALS, representing a substantial 24.2% of familial ALS (fALS) cases.
      explanation: Quantifies the SOD1 share of familial ALS in a contemporary large cohort.
  evidence:
  - reference: PMID:8446170
    reference_title: Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 11 different SOD1 missense mutations in 13 different FALS families.
    explanation: The original report establishing SOD1 as the ALS1 disease gene.
  - reference: PMID:41661214
    reference_title: Long-Term Tofersen in SOD1 Amyotrophic Lateral Sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Over 200 ALS-associated SOD1 variants induce varying disease progression rates
    explanation: Sources the variant count and the fact that allele identity modulates progression rate.
    quote_role: BACKGROUND
  - reference: PMID:9029070
    reference_title: Epidemiology of mutations in superoxide dismutase in amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presence of one mutation, A4V, correlated with shorter survival. G37R, G41D, and G93C mutations predicted longer survival.
    explanation: The historical cohort associates particular variants with survival differences; the result is neither a universal ranking nor an individual prediction.
pathophysiology:
- name: Pathogenic SOD1 Variation
  biological_scale: MOLECULAR
  description: ALS1 is associated with pathogenic SOD1 coding variants, usually heterozygous but sometimes biallelic. Missense and truncating alleles can have toxic properties. Effects on stability, aggregation and dismutase activity differ by allele; normal activity in D90A and disease in high-expressing G93A mice argue against a universal simple enzyme-loss mechanism. Biallelic loss-of-function SOD1 syndromes are a distinct genetic context.
  evidence:
  - reference: PMID:8446170
    reference_title: Mutations in Cu/Zn superoxide dismutase gene are associated with familial amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We identified 11 different SOD1 missense mutations in 13 different FALS families.
    explanation: The initial linkage and mutation study establishes the genetic association.
  - reference: PMID:7647793
    reference_title: Amyotrophic lateral sclerosis associated with homozygosity for an Asp90Ala mutation in CuZn-superoxide dismutase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The erythrocyte CuZn-SOD activity is essentially normal. Our findings suggest that this CuZn-SOD mutation causes ALS by a gain of function rather than by loss
    explanation: Human genetic evidence that ALS occurs with preserved dismutase activity, establishing gain of function in patients rather than only in transgenic models.
    quote_role: PRIMARY_RESULT

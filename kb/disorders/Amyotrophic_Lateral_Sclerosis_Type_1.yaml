discussions:
- discussion_id: sod1_transgene_dose_vs_heterozygous_allele
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the SOD1 G93A transgenic mouse, which depends on supraphysiological transgene
    expression, model the disease process of a heterozygous SOD1 carrier closely enough
    for preclinical rescue results to predict human benefit?
  attaches_to:
  - animal_models#SOD1 G93A transgenic mouse
  - pathophysiology#Misfolded SOD1 Gain of Toxic Function
  - pathophysiology#Prion-Like Templated Propagation of Misfolded SOD1
  rationale: >-
    The mismatch is one of dose and genetic architecture rather than of mechanism. Patients
    carry a single heterozygous missense allele expressed at endogenous levels; the model
    carries many copies of a human transgene expressed at high levels, and the original
    report is explicit that motor neuron disease followed expression of high levels of the
    variant protein. Because expression level sets onset and tempo in the model, a
    manipulation that lowers the mutant protein burden can appear disease-modifying in the
    mouse for reasons that do not transfer. This is a fidelity question, not an evidence
    gap: the model demonstrably develops motor neuron degeneration, and it correctly
    established gain of function. What is unresolved is the quantitative relationship
    between transgene-driven and allele-driven disease. The point is not academic. The one
    therapy built on this axis, tofersen, lowered SOD1 as designed and lowered
    neurofilament light, yet missed its primary clinical endpoint in the randomized phase
    of VALOR — the pattern this mismatch predicts, in which target engagement is
    reproduced faithfully and clinical benefit is not. A second, independent sign that
    transgene dose distorts the model comes from seeding experiments: the widely used
    high-expressing Gur1-G93A line is resistant to prion-like seeding that readily
    accelerates disease in a low-expressing sub-line, so the standard model masks a
    propagation mechanism that lower-expressing animals reveal.
  proposed_experiments:
  - experiment_id: endogenous_knockin_vs_transgenic_sod1_comparison
    name: Compare disease course in endogenous-locus knock-in versus high-copy transgenic SOD1 mice
    description: >-
      Introduce a pathogenic SOD1 missense allele at the endogenous mouse locus in
      heterozygosity and compare onset, tempo, and response to SOD1-lowering against the
      high-copy transgenic model, holding the allele constant.
    would_support:
    - pathophysiology#Misfolded SOD1 Gain of Toxic Function
    supporting_outcome:
    - >-
      A heterozygous knock-in reproduces progressive motor neuron degeneration and shows a
      comparable response to SOD1 lowering, indicating the transgenic result is not an
      artifact of expression level.
    refuting_outcome:
    - >-
      The heterozygous knock-in shows little or no motor neuron degeneration, or responds
      to SOD1 lowering very differently, indicating that transgene dose rather than the
      variant allele drives the modelled disease.
- discussion_id: rate_limiting_toxic_arm_in_human_als1
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the toxic arms downstream of misfolded SOD1 — aggregation, Derlin-1-dependent
    ER stress, or glial toxicity — is rate-limiting in human ALS1?
  attaches_to:
  - pathophysiology#Cytoplasmic SOD1 Aggregate Formation
  - pathophysiology#Derlin-1 Sequestration and ASK1-Dependent ER Stress
  - pathophysiology#Non-Cell-Autonomous Glial Toxicity
  rationale: >-
    Each arm is separately established, and each was established in a mouse or a cell
    system rather than in patients: ASK1 deletion extends survival, lineage-restricted
    excision of mutant SOD1 from microglia and astrocytes slows progression, and
    aggregation is the visible pathology in human tissue. What no experiment addresses is
    their relative contribution in a human carrier, because each was demonstrated by a
    genetic manipulation available only in the mouse. This matters therapeutically: a
    therapy acting on one arm can only be as good as that arm's share of the disease,
    whereas SOD1 lowering acts upstream of all three, which is one reading of why the
    upstream strategy was pursued first. The gap is squarely one of absent human evidence,
    not of a model that disagrees with humans, which is why it is recorded as a knowledge
    gap rather than as a model mismatch.
datasets:
- accession: geo:GSE271030
  title: RNA Expression Profiling in Lymphoblastoid Cell Lines from Mutated and Non-Mutated Amyotrophic Lateral Sclerosis Patients
  data_type: BULK_RNA_SEQ
  description: >-
    RNA-seq of patient-derived lymphoblastoid cell lines in which SOD1-mutated patients
    are one of four genotype subgroups (alongside FUS, TARDBP and C9ORF72) compared with
    sporadic ALS and matched controls. Included because the study stratifies by causal
    gene and so contains an ALS1 arm; it is not a SOD1-only dataset, and the authors
    report that expression profiles were genotype-specific, which is what makes the SOD1
    arm separable rather than pooled.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38967638
  notes: >-
    Relevance triage. Other candidates surfaced by `just discover-datasets` were rejected
    rather than included: GSE260913 (EGLN2/PHD1) matched on the gene index but its own GEO
    record says only "an ALS patient" and never names SOD1, and the remaining hits are
    general ALS or concern other genes (SRRM2, TOP1MT, TDP-43). Resolution is not
    relevance, and a gene-index hit is not a genotype claim.
  evidence:
  - reference: GEO:GSE271030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a transcriptomic profiling of Sporadic ALS (SALS) and mutated patients (FUS, TARDBP, C9ORF72 and SOD1), and matched controls was realized"
    explanation: The repository record states that SOD1-mutated patients are one of the profiled genotype subgroups, which is what makes this dataset relevant to ALS1.
  - reference: GEO:GSE271030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gene expression profiles of LCLs were genetic-background specific, indeed only 12 genes were commonly deregulated in all groups."
    explanation: >-
      Reports that expression profiles differed by genetic background, with almost no shared
      deregulated genes. This is what makes the SOD1 arm worth analysing separately rather
      than pooling it into a generic ALS signature; it is not itself a SOD1-specific result.

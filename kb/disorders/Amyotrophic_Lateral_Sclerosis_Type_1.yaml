name: Amyotrophic Lateral Sclerosis Type 1
creation_date: '2026-09-05T00:00:00Z'
category: Mendelian
description: >-
  Amyotrophic lateral sclerosis type 1 (ALS1) is the SOD1-associated form of motor
  neuron disease and was the first genetically defined form of ALS, identified in
  1993 when missense variants in SOD1 — encoding the homodimeric cytosolic Cu/Zn
  superoxide dismutase — were found to segregate with autosomal dominant familial
  ALS. Over 200 variants are now known, and SOD1 accounts for a substantial minority
  of familial ALS (roughly a fifth to a quarter in most series) plus a small fraction
  of apparently sporadic disease. The defining mechanistic claim of this entry is
  that ALS1 is a gain of toxic function rather than a loss of dismutase activity:
  SOD1-null mice have structurally and functionally normal motor neurons, the
  slowly progressive Asp90Ala allele leaves erythrocyte dismutase activity
  essentially normal, and a transgene encoding a variant with little effect on
  enzyme activity is sufficient to paralyse mice. Destabilised SOD1 misfolds and
  acquires toxicity through several partly independent routes — cytoplasmic
  aggregation, sequestration of the ERAD component Derlin-1 with downstream ASK1
  activation, mitochondrial injury and oxidative stress — and disease is then
  propagated non-cell-autonomously, with mutant protein in motor neurons setting
  onset while mutant protein in microglia and astrocytes governs the later rate of
  progression. ALS1 is kept separate from the broad `Amyotrophic Lateral Sclerosis`
  entry for a specific pathological reason and not merely a genetic one: SOD1-mutant
  cases carry ubiquitin-positive but TDP-43-negative inclusions, so they fall
  outside the TDP-43 proteinopathy that defines the great majority of ALS. ALS1 is
  also the first ALS subtype with a mechanism-directed therapy, the SOD1-lowering
  antisense oligonucleotide tofersen.

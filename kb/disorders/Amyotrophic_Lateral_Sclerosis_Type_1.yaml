    explanation: Establishes the presymptomatic window and the biomarker that makes carrier identification actionable.
animal_models:
- name: SOD1 G93A transgenic mouse
  species: Mouse
  genotype: Transgenic for human SOD1 p.Gly93Ala
  publication: PMID:8209258
  description: >-
    The founding and still dominant ALS animal model. High-level expression of a human
    SOD1 transgene bearing a substitution with little effect on enzyme activity causes
    limb paralysis from spinal motor neuron loss, with death by 5-6 months.
  evidence:
  - reference: PMID:8209258
    reference_title: "Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "caused motor neuron disease in transgenic mice"
    explanation: The report establishing this transgenic line as a model of SOD1-driven motor neuron disease.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces progressive spinal motor neuron loss and limb paralysis on a defined
      genetic cause.
    limitations: >-
      Disease is driven by supraphysiological transgene copy number rather than by a
      single endogenous heterozygous allele, so onset and tempo are set partly by
      expression level. The model captures the SOD1 arm of ALS specifically and does not
      reproduce the TDP-43 proteinopathy that defines most human ALS, which is a fidelity
      limit for ALS generally but is arguably appropriate for ALS1 in particular. The
      expression level is not a neutral scaling factor: the standard high-expressing line
      is resistant to prion-like seeding that readily accelerates disease in a
      low-expressing sub-line, so this model actively conceals the propagation arm.
    readouts:
    - name: Spinal cord motor neuron number
      target: Motor Neuron Degeneration
      direction: DECREASED
      interpretation: Histological correlate of the degeneration node.
      evidence:
      - reference: PMID:8209258
        reference_title: "Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mice became paralyzed in one or more limbs as a result of motor neuron loss from the spinal cord and died by 5 to 6 months of age."
        explanation: Reports the motor neuron loss and the paralysis it produces in this model.
    evidence:
    - reference: PMID:8209258
      reference_title: "Motor neuron degeneration in mice that express a human Cu,Zn superoxide dismutase mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of high levels of human SOD containing a substitution of glycine to alanine at position 93--a change that has little effect on enzyme activity--caused motor neuron disease in transgenic mice."
      explanation: Establishes that this model is informative for SOD1-driven motor neuron degeneration.
    - reference: PMID:41702846
      reference_title: "Efficient induction of motor neuron disease in transgenic G93A SOD1 mice by prion-like seeding."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "the widely used Gur1-G93A SOD1 mice, which express at high levels and develop paralysis by 6 months of age, were resistant to seeding by homogenates from paralysed G93A mice"
      explanation: >-
        Recorded as REFUTE against the claim that this model faithfully represents the
        SOD1 disease process: the standard line fails to show seeded propagation that a
        low-expressing sub-line does, which is a limitation created by transgene dose.
- name: SOD1-null mouse
  species: Mouse
  genotype: Sod1 knockout (homozygous null)
  publication: PMID:8673102
  description: >-
    A deliberately negative model. Complete absence of Cu/Zn superoxide dismutase does
    not produce motor neuron disease, which is the experiment that excludes loss of
    dismutase activity as the ALS1 mechanism. Its value is entirely in what it fails to
    reproduce.
  evidence:
  - reference: PMID:8673102
    reference_title: "Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we describe the creation and characterization of mice completely deficient for this enzyme."
    explanation: The report creating and characterizing the SOD1-null line used here as a negative model.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Loss of SOD1 function does not cause the motor neuron degeneration seen in ALS1,
      constraining the mechanism to a gain of function.
    limitations: >-
      A null allele is not the human genotype: ALS1 patients are heterozygous for a
      missense allele and retain expressed protein, so the model tests only whether
      absence of dismutase activity is sufficient. It cannot address whether a partial
      loss of activity contributes alongside the toxic gain of function, and the
      enhanced vulnerability after axonal injury shows SOD1 is not functionally
      dispensable under stress.
    evidence:
    - reference: PMID:8673102
      reference_title: "Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These animals develop normally and show no overt motor deficits by 6 months in age."
      explanation: The negative result itself — absence of SOD1 does not produce the motor phenotype, so this model informatively fails to recapitulate the node.
- name: Lineage-deletable mutant SOD1 mouse
  species: Mouse
  genotype: Floxed mutant human SOD1 transgene with lineage-restricted Cre excision
  publication: PMID:16741123
  description: >-
    Mice carrying a mutant SOD1 transgene that can be excised in selected cell lineages,
    used to separate the contribution of motor neurons from that of microglia and
    astrocytes. This is the experimental basis for treating onset and progression as
    distinct, differently driven phases.
  evidence:
  - reference: PMID:16741123
    reference_title: "Onset and progression in inherited ALS determined by motor neurons and microglia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "With the use of mice carrying a deletable mutant gene, expression within motor neurons was shown to be a primary determinant of disease onset"
    explanation: Describes the deletable-transgene design that defines this model.
  modeled_mechanisms:
  - target: Non-Cell-Autonomous Glial Toxicity
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Cell-type-restricted removal of the mutant gene isolates the glial contribution to
      the progression phase.
    limitations: >-
      Excision efficiency is incomplete and lineage-specific Cre drivers are not perfectly
      restricted, so residual mutant expression in the targeted lineage limits how
      cleanly the contributions can be attributed. As with all SOD1 transgenics, the
      finding is established for SOD1-driven disease and does not establish the same
      division of labour in TDP-43-driven ALS.
    readouts:
    - name: Rate of disease progression after lineage-restricted mutant SOD1 excision
      target: Non-Cell-Autonomous Glial Toxicity
      direction: DECREASED
      interpretation: >-
        Slowed progression without altered onset is the signature of a glial contribution
        confined to the progression phase.
      evidence:
      - reference: PMID:18246065
        reference_title: "Astrocytes as determinants of disease progression in inherited amyotrophic lateral sclerosis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "diminished mutant expression in astrocytes did not affect onset, but delayed microglial activation and sharply slowed later disease progression"
        explanation: Reports the measured effect of astrocytic excision on onset versus progression.
    evidence:
    - reference: PMID:16741123
      reference_title: "Onset and progression in inherited ALS determined by motor neurons and microglia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Onset and progression thus represent distinct disease phases defined by mutant action within different cell types to generate non-cell-autonomous killing of motor neurons"
      explanation: States the conclusion this model was built to test, establishing it as informative for the glial toxicity node.

treatments:
- name: Tofersen
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  description: Tofersen is an intrathecal antisense oligonucleotide that promotes RNase H-mediated degradation of SOD1 mRNA and reduces SOD1 protein production. EAN guidance recommends it for progressive ALS caused by pathogenic SOD1 variants, with discussion of treatment burden and serious adverse events. US accelerated approval was based on reduced plasma NfL. In the 108-participant randomized VALOR phase, the 28-week primary clinical endpoint in the prespecified faster-progression subgroup (60 of 108 participants) was not met despite reduced CSF SOD1 and plasma NfL. The extension retained the original randomized early/delayed groups, but everyone could receive active drug after week 28; later comparisons therefore lack an untreated control. At week 148, earlier initiation was associated with numerically less decline, with imprecise survival estimates. Four uncontrolled Icelandic p.Gly94Ser cases provide additional clinical observations, not proof of universal stabilization. Myelitis/radiculitis, raised intracranial pressure with papilledema, and aseptic meningitis require specific safety discussion and evaluation.
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: SOD1
      term:
        id: hgnc:11179
        label: SOD1
    target_transcript: SOD1 mRNA
    aso_chemistry: TWO_PRIME_O_METHOXYETHYL
    conjugation: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofersen
      term:
        id: NCIT:C166584
        label: Tofersen
  target_mechanisms:
  - target: SOD1 Protein Supply
    treatment_effect: INHIBITS
    description: Reducing SOD1 mRNA lowers protein supply; this does not directly correct the variant or prove clearance of existing aggregates.
    evidence:
    - reference: PMID:36129998
      reference_title: Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Tofersen led to greater reductions in concentrations of SOD1 in CSF and of neurofilament light chains in plasma than placebo.
      explanation: Demonstrates target engagement via a CSF surrogate, together with a fall in a neuroaxonal injury marker.
    - reference: PMID:42406382
      reference_title: Antisense Oligonucleotide Tofersen Distribution in the Central Nervous System of SOD1-ALS Autopsy Tissue Donors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: reductions in lumbar spinal cord tissue SOD1 mRNA and protein levels ranged from 45% to 84%
      explanation: The abstract reports cross-sectional tissue reductions in three recently treated autopsy donors, not a within-person serial measurement or clearance of inclusions.
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In patients with progressive ALS caused by pathogenic mutations in superoxide dismutase 1 (SOD1), offer tofersen as first‐line treatment.
    explanation: The guideline supports treatment for progressive pathogenic-variant SOD1 ALS.
  - reference: PMID:32640130
    reference_title: Phase 1-2 Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In adults with ALS due to SOD1 mutations, CSF SOD1 concentrations decreased at the highest concentration of tofersen administered intrathecally over a period of 12 weeks.
    explanation: First-in-human demonstration that intrathecal tofersen lowers CSF SOD1 in ALS1.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36129998
    reference_title: Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In persons with SOD1 ALS, tofersen reduced concentrations of SOD1 in CSF and of neurofilament light chains in plasma over 28 weeks but did not improve clinical end points and was associated with adverse events.
    explanation: The randomized phase found biomarker reductions without significant benefit on the primary clinical endpoint at 28 weeks; this limits efficacy claims without refuting target engagement or the treatment indication.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36129998
    reference_title: Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 52 weeks, the change in the ALSFRS-R score was -6.0 in the early-start cohort and -9.5 in the delayed-start cohort
    explanation: The original randomized groups differed by treatment initiation time; after crossover there was no untreated control, and these analyses were not adjusted for multiplicity.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41661214
    reference_title: Long-Term Tofersen in SOD1 Amyotrophic Lateral Sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Over 148 weeks, earlier initiation of tofersen (compared to later initiation) was associated with numerically less decline in measures of clinical function
    explanation: The long-term analysis retains initial randomized assignment but has attrition and no untreated comparator beyond 28 weeks; numerical differences do not establish a precise survival benefit.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Discuss with the patient that this treatment may be associated with serious adverse events.
    explanation: The recommendation explicitly requires discussion of serious adverse events.

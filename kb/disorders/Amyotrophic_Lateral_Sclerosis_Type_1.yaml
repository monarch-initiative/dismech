- name: Extra-Motor CNS Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration outside the motor system, established in the D90A homozygous stratum
    and not asserted for ALS1 generally. In nine D90A homozygotes, misfolded-SOD1
    inclusions were present in spinal cord and brainstem motor neurons and glia, and
    degeneration involved the dorsal columns as well as the corticospinal tracts, with
    gliosis in circumscribed frontal, temporal and insular cortex. The link drawn here is
    anatomical co-occurrence of SOD1 pathology with extra-motor degeneration in the same
    patients; no experiment establishes that the inclusions cause the dorsal column loss,
    so the edge into this node should be read as the weakest in the entry.

  description: Tested SOD1 mutants associate with Derlin-1 in transfected cells and mouse tissue. Recombinant-protein experiments support interaction, but reticulocyte-lysate chaperones could mediate it. This is an association with an ERAD component, without demonstrated sequestration or disassembly of the whole ERAD complex.
  evidence: *id001
  downstream:

  notes: A DM-like molecular state is observed in stage-stratified SOD1 G93A mice and human postmortem ALS including SOD1 donors. Cross-sectional tissue, rare surviving nuclei and inferred pseudotime do not establish a causal state-to-death sequence or a prospective survival prediction. Neuronal fragments provide a distinct assay, not additional independent patients.

treatments:
- name: Tofersen
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  description: >-
    Intrathecally administered antisense oligonucleotide that directs RNase H-mediated
    degradation of SOD1 mRNA, lowering synthesis of both wild-type and variant SOD1
    protein. It is the first therapy directed at the ALS1 mechanism itself rather than
    at downstream neuroprotection. The evidence has a specific shape that should not be
    smoothed over: the pivotal phase 3 VALOR trial met its biomarker endpoints — CSF
    SOD1 and plasma neurofilament light both fell — but missed its primary clinical
    endpoint at 28 weeks, and regulatory approval rested on the neurofilament biomarker
    rather than on a demonstrated functional benefit. Signals favouring earlier over
    delayed initiation emerged in the open-label extension and strengthened with longer
    follow-up: the final integrated VALOR/OLE analysis, with 3.5 years or more of
    follow-up, reported numerically less decline in function, respiratory capacity,
    strength and quality of life in the early-start group, and survival longer than the
    expected natural history. Those comparisons remain non-randomized after week 28, so
    the durable evidence for clinical benefit is a within-trial early-versus-delayed
    contrast rather than a placebo-controlled one. Post-approval case series report
    stabilisation and are uncontrolled.
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: SOD1
      term:
        id: hgnc:11179
        label: SOD1
    target_transcript: SOD1 mRNA
    aso_chemistry: TWO_PRIME_O_METHOXYETHYL
    conjugation: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofersen
      term:
        id: NCIT:C166584
        label: Tofersen
  target_mechanisms:
  - target: Misfolded SOD1 Gain of Toxic Function
    treatment_effect: INHIBITS
    description: >-
      Lowering SOD1 mRNA reduces the supply of the protein that misfolds, acting on the
      node upstream of every toxic arm rather than on any single downstream consequence.
    evidence:
    - reference: PMID:36129998
      reference_title: "Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tofersen led to greater reductions in concentrations of SOD1 in CSF and of neurofilament light chains in plasma than placebo."
      explanation: Demonstrates target engagement — the drug lowers the SOD1 protein this node is built on — together with a fall in a neuroaxonal injury marker.
  evidence:
  - reference: PMID:32640130
    reference_title: "Phase 1-2 Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults with ALS due to SOD1 mutations, CSF SOD1 concentrations decreased at the highest concentration of tofersen administered intrathecally over a period of 12 weeks."
    explanation: First-in-human demonstration that intrathecal tofersen lowers CSF SOD1 in ALS1.
  - reference: PMID:36129998
    reference_title: "Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In persons with SOD1 ALS, tofersen reduced concentrations of SOD1 in CSF and of neurofilament light chains in plasma over 28 weeks but did not improve clinical end points and was associated with adverse events."
    explanation: >-
      The pivotal trial's own conclusion that the randomized phase did not show clinical
      benefit. Recorded as REFUTE against the claim of demonstrated functional efficacy;
      the separate SUPPORT items above cover the biomarker and target-engagement claims,
      which this sentence does not contradict.
  - reference: PMID:36129998
    reference_title: "Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 52 weeks, the change in the ALSFRS-R score was -6.0 in the early-start cohort and -9.5 in the delayed-start cohort"
    explanation: >-
      Open-label extension signal favouring earlier initiation. Cited as supporting the
      timing rationale only; the comparison is non-randomized and the differences were
      not adjusted for multiplicity.
  - reference: PMID:41661214
    reference_title: "Long-Term Tofersen in SOD1 Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tofersen, an intrathecal antisense oligonucleotide designed to reduce SOD1 protein synthesis, is the first and only approved therapy for the treatment of ALS in adults who have a variant in the SOD1 gene."
    explanation: Establishes tofersen's regulatory status as the only ALS1-specific approved therapy.
  - reference: PMID:41661214
    reference_title: "Long-Term Tofersen in SOD1 Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 148 weeks, earlier initiation of tofersen (compared to later initiation) was associated with numerically less decline in measures of clinical function"
    explanation: >-
      Final integrated VALOR/OLE analysis. Cited for the timing effect only; the authors'
      own wording is "numerically less decline", and the comparison is not
      placebo-controlled beyond week 28.
  - reference: PMID:41670738
    reference_title: "Treating SOD1-ALS with tofersen results in nonprogressive chronic ALS-a case series from Iceland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After initiating treatment 15-26 months ago, no significant clinical deterioration was observed, and three patients showed signs of clinical improvement, with some recovery of motor function."
    explanation: >-
      Post-approval real-world case series in Gly94Ser carriers reporting clinical
      stabilisation. Four patients, uncontrolled and unblinded, so it is a supporting
      observation rather than efficacy evidence.
  - reference: PMID:41670738
    reference_title: "Treating SOD1-ALS with tofersen results in nonprogressive chronic ALS-a case series from Iceland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concomitantly, the concentration of neurofilament light chain (Nf-L) in the cerebrospinal fluid decreased to the normal range."
    explanation: Corroborates the neurofilament response seen in VALOR in a routine-care setting.

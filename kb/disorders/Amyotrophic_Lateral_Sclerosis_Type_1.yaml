      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All patients presented with progressive gait ataxia as their initial and predominant symptom, with upper and lower motor neuron signs emerging months to years later and ultimately meeting criteria for ALS.
      explanation: Case series documenting ataxia-onset SOD1-ALS in Asp91Ala carriers.

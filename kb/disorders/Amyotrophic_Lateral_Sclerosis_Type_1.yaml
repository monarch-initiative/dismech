experimental_models:
- name: Mutant SOD1 Derlin-1 and ERAD assays
  experimental_model_type: OTHER
  description: NSC34 and HEK293 systems express tested SOD1 mutants and ERAD components. Interaction assays, NHK/CD3delta turnover, ubiquitination, stress signaling and ASK1 kinase activity interrogate separate steps.
  evidence:
  - &id019
    reference: PMID:18519638
    reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Cycloheximide chase experiments showed that the degradation of CD3δ was also retarded by overexpression of SOD1mut
    explanation: Transfected-cell assays measure slower ERAD substrate turnover.
  modeled_mechanisms:
  - target: Impaired ER-Associated Protein Degradation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    description: Mutant expression retards ERAD reporters.
    limitations: Overexpression and model substrates may not quantify the corresponding endogenous human-neuron burden. Direct binding is not proven in the reticulocyte-lysate assay; measured core-complex associations remain intact.
    evidence:
    - *id019
  - target: ASK1 Kinase Activation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: MOLECULAR
    description: Mutant expression activates an ASK1 kinase readout.
    limitations: NSC34 stress signaling did not itself result in the motor neuron death measured in the separate primary-culture preparation.
    evidence:
    - reference: PMID:18519638
      reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Expression of SOD1mut, but not SOD1wt, activated endogenous ASK1
      explanation: Direct kinase activity is measured.
- name: Embryonic spinal-cord SOD1 toxicity and rescue cultures
  experimental_model_type: OTHER
  description: Mixed E12.5 mouse spinal-cord cultures express G93A or G85R SOD1; the Derlin-1 CT4 peptide or ASK1 deficiency partially preserves SMI32-positive motor neurons.
  evidence:
  - &id020
    reference: PMID:18519638
    reference_title: ALS-linked mutant SOD1 induces ER stress- and ASK1-dependent motor neuron death by targeting Derlin-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: SOD1mut-induced motor neuron death was significantly attenuated by coexpression of Derlin-1(CT4)
    explanation: The competing peptide partly protects neurons in embryonic spinal cultures.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: PERTURBS
    model_scale: CELLULAR
    description: Tests partial rescue of cultured motor neuron loss.
    limitations: Mixed neurons and glia do not isolate a purely neuron-autonomous effect; lentiviral overexpression and embryonic cells differ from adult human ALS. Rescue is incomplete.
    evidence:
    - *id020
- name: ATP-triggered SOD1 donor and recipient cultures
  experimental_model_type: OTHER
  description: Transfected NSC34 cells exposed to 3–5 mM ATP release particulate material. Recipient NSC34 cells and EOC13 microglia show ER stress reporter activity and TNF release respectively.
  evidence:
  - &id021
    reference: PMID:35478453
    reference_title: P2X7 receptor activation mediates superoxide dismutase 1 (SOD1) release from murine NSC-34 motor neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: ATP induced the rapid release of aggregated SOD1G93A from NSC-34 cells transiently transfected with SOD1G93A, a process blocked by AZ10606120 and revealing a role for P2X7 in this process.
    explanation: The donor-cell assay tests release after an acute ATP challenge.
  modeled_mechanisms:
  - target: P2X7-Associated SOD1 Release
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    description: Antagonist-sensitive release occurs after high ATP exposure.
    limitations: NSC34 is a murine hybrid line, not a primary human motor neuron. A single antagonist without receptor knockout supports pharmacological involvement; low LDH only limits overt lysis under the tested conditions.
    evidence:
    - *id021
  notes: Released 20000-g pellets contain mixed material. EGFP control preparations can also provoke responses, so purified SOD1 necessity and recipient death are not demonstrated. Release includes tested wild-type SOD1.
- name: WTC11 motor-neuron transcription-factor perturbation
  experimental_model_type: OTHER
  description: Lentiviral CREB3 or ATF3 overexpression in WTC11 hNIL motor neurons induces portions of the disease-associated transcriptional signature. RNA is assessed 14 days after transduction.
  evidence:
  - reference: PMID:42335888
    reference_title: An emergent disease-associated motor neuron state precedes cell death in ALS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: CREB3 expression was associated with upregulation of approximately 20% of DM-upregulated genes (precision ~15%), while ATF3 expression was associated with downregulation of approximately 5% of DM-downregulated genes (precision ~34%).
    explanation: Forced transcription-factor expression partially reproduces the associated gene-expression program.
  - reference: PMID:42335888
    reference_title: An emergent disease-associated motor neuron state precedes cell death in ALS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: For each condition, three independent wells were transduced and processed as technical replicates.
    explanation: The replicate unit is a technical well, not an independent patient.
  notes: These are engineered non-patient cells. No SOD1 variant, neuron-death endpoint, functional rescue or validated therapeutic mechanism is tested. The model is left without a degeneration join because changing an associated program does not establish that the program causes cell death.
progression:
- phase: Variable onset and progression
  evidence:
  - reference: PMID:36385230
    reference_title: Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Patient age at onset of first symptom ranged from 38 to 60 years (mean 49 years) and duration of symptomatic illness ranged from 5 to 33 years (mean 17 years).
    explanation: The autopsy series defines its own selected genotype-specific course.
  - reference: PMID:42265995
    reference_title: Two Patients With Juvenile-Onset, Rapidly Progressive Amyotrophic Lateral Sclerosis Associated With an SOD1 Variant (p.Asp125Gly) With Incomplete Penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: rapid progression over months to involve all body regions
    explanation: Documents the generalisation this node describes. The cited cases are juvenile p.Asp125Gly, where progression is unusually rapid, so the quote establishes the pattern of spread rather than its typical rate.
  notes: SOD1 ALS ranges from rare juvenile rapidly progressive cases to adult-onset disease lasting decades. In the selected nine-person D90A homozygous autopsy series, onset ranged from 38 to 60 years and symptomatic duration from 5 to 33 years. Variant, family, treatment and ascertainment affect course; these are not universal age or survival bounds.

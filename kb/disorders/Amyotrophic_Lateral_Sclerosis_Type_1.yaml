- name: Edaravone
  therapeutic_modality: SMALL_MOLECULE
  description: Edaravone is an ALS therapy available in intravenous and oral formulations in the US. Its pivotal efficacy trial selected early-stage Japanese patients with preserved function and respiration; these trial criteria are not the full US labeled indication. EAN 2024 guidance recommends against routine use outside clinical trials, so clinical use depends on jurisdiction, evidence assessment and shared decisions. A distinct SOD1-specific benefit has not been established, and its therapeutic mechanism in patients remains unknown despite antioxidant activity.

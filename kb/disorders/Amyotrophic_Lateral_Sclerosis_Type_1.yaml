biochemical:
- name: Neurofilament light chain
  presence: INCREASED
  biomarker_term:
    preferred_term: neurofilament light chain
    term:
      id: hgnc:7739
      label: NEFL
  notes: NfL in blood or CSF is a nonspecific marker of neuroaxonal injury. SOD1-tofersen trials document reduced plasma NfL with treatment. Presymptomatic rises have informed the selected ATLAS trial population, but no universal clinical treatment threshold or guaranteed phenoconversion time follows. General-ALS proteomic associations are not SOD1-specific validation.
  readouts:
  - target: Motor Neuron Degeneration
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Higher NfL can reflect neuroaxonal injury and has prognostic and pharmacodynamic use. It is not disease-specific and does not by itself establish neuronal rescue or determine when an individual carrier will develop ALS.
    evidence:
    - reference: PMID:42698373
      reference_title: Protein Biomarkers in Risk and Prognosis of Amyotrophic Lateral Sclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: NEFL was the most robust biomarker in plasma and CSF
      explanation: Ranks NfL first among 363 profiled proteins across case status, risk, survival and functional decline. The cohort is ALS broadly (198 patients), not SOD1-specific.
    - reference: PMID:36129998
      reference_title: Trial of Antisense Oligonucleotide Tofersen for SOD1 ALS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Tofersen led to greater reductions in concentrations of SOD1 in CSF and of neurofilament light chains in plasma than placebo.
      explanation: The SOD1-specific NfL result, and the biomarker change that carried the accelerated approval.
  evidence:
  - reference: PMID:35585374
    reference_title: 'Design of a Randomized, Placebo-Controlled, Phase 3 Trial of Tofersen Initiated in Clinically Presymptomatic SOD1 Variant Carriers: the ATLAS Study.'
    supports: SUPPORT

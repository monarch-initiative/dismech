    snippet: an elevation in blood neurofilament light chain (NfL) precedes phenoconversion to clinically manifest disease
    explanation: The ATLAS design paper summarizes prior presymptomatic natural-history observations, chiefly in rapidly progressing variants; this is not a universal carrier prediction rule.

has_subtypes:
- name: A4V
  display_name: SOD1 p.Ala4Val (A4V, legacy numbering; p.Ala5Val in HGVS)
  description: The p.Ala5Val allele (legacy A4V) is associated with rapid progression in reported North American families. A historical study reported mean survival of 1.4 years from onset; this is a cohort estimate rather than an individual prognosis. Most carriers studied shared a founder haplotype. The inferred founder origin and failure to identify a nearby modifier do not exclude distant modifiers or prove that every carrier has the same course.
  evidence:
  - reference: PMID:18055113
    reference_title: 'SOD1A4V-mediated ALS: absence of a closely linked modifier gene and origination in Asia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Carriers of the SOD1(A4V) mutation share a common phenotype with rapid disease progression and death on average occurring at 1.4 years (versus 3-5 years with other dominant SOD1 mutations).
    explanation: Quantifies the survival difference that makes this allele a clinically distinct stratum.
  - reference: PMID:18055113
    reference_title: 'SOD1A4V-mediated ALS: absence of a closely linked modifier gene and origination in Asia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It therefore appears likely that the aggressive nature of the SOD1(A4V) mutation is not a result of a modifying factor within the region around the SOD1 gene.
    explanation: The authors considered a closely linked modifier unlikely within the region studied; this does not exclude modifiers elsewhere or establish purely allele-intrinsic severity.
- name: D90A homozygous
  display_name: SOD1 p.Asp90Ala homozygous (D90A/D91A, recessive Scandinavian form)
  description: Homozygosity for p.Asp91Ala (legacy D90A) defines a well-described recessive Scandinavian form, often with slowly progressive leg-onset disease. Sensory and urinary manifestations and widespread pathology were documented in a selected nine-person autopsy series. The same variant can be associated with dominant ALS outside this recessive context, and ataxia-first presentations have occurred in both heterozygous and homozygous carriers. Normal or near-normal dismutase activity in this variant argues against a universal enzymatic-loss explanation. Transgenic coexpression and aggregate-strain experiments are retained as models, not as proof of the human recessive mechanism.
  evidence:
  - reference: PMID:36385230
    reference_title: Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the heredity is usually recessive, the phenotype is stereotypic with slowly evolving motor symptoms beginning in the legs and may also include sensory, autonomic, and urinary bladder involvement
    explanation: Defines the recessive inheritance and the extra-motor clinical features of this stratum.
  - reference: PMID:36385230
    reference_title: Widespread CNS pathology in amyotrophic lateral sclerosis homozygous for the D90A SOD1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition to degeneration of the corticospinal tracts, all patients had degeneration of the dorsal columns.
    explanation: Neuropathological confirmation that the lesion extends beyond motor pathways in D90A homozygotes.
review_notes: 'The full GeneReviews ALS overview was recovered through the NCBI Bookshelf /sites/books/ route and reviewed alongside all cited primary full texts available in the cache. General ALS guidance is explicitly distinguished from SOD1-specific observations. Canonical abstract-only records remain abstract-limited; unsuccessful full-text URL retrievals were excluded. Legacy SOD1 amino-acid numbering omits the initiating methionine: A4V/A5V, D90A/D91A and G93A/G94A refer to the respective same substitutions, whereas p.Gly94Ser is a different allele. Cohort and variant-specific observations are not assigned disease-wide frequency bands. This genetically defined entry does not impose an absolute TDP-43-negative rule: the D90A autopsy series documents rare TDP-43-positive structures. Clinical trial status was checked against ClinicalTrials.gov on 2026-09-21. Mechanistic model and treatment interpretation limits are recorded locally and in discussions.'

name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete IL12RB1 Deficiency
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- IL-12Rbeta1 deficiency
- Complete IL-12R beta 1 deficiency
- IL12RB1 deficiency
- MSMD due to complete IL12RB1 deficiency
- Immunodeficiency 30
- IMD30
description: >
  Mendelian susceptibility to mycobacterial disease (MSMD) due to complete interleukin-12
  receptor beta-1 (IL-12Rbeta1) deficiency is an autosomal recessive inborn error of
  immunity caused by biallelic loss-of-function variants in IL12RB1. It is the most common
  genetic etiology of MSMD. Patients present in childhood with disease caused by weakly
  virulent mycobacteria - above all the Bacille Calmette-Guerin (BCG) vaccine strain and
  environmental non-tuberculous mycobacteria - and with non-typhoidal, extraintestinal
  salmonellosis, while routine immunological testing is unremarkable.

  Every genetic etiology of MSMD converges on interferon gamma (IFN-gamma): each impairs
  either the production of the cytokine or the cellular response to it. IL-12Rbeta1 sits
  in the production arm, and its molecular logic is the shared-chain one. The beta-1 chain
  encoded by IL12RB1 is not specific to the IL-12 receptor: it pairs with IL-12Rbeta2 to
  form the high-affinity IL-12 receptor on T and NK cells, and with IL-23R to form the
  IL-23 receptor. A complete beta-1 defect therefore abolishes cellular responsiveness to
  both cytokines at once. Loss of IL-12 signalling removes the dominant signal driving T
  and NK lymphocytes to secrete IFN-gamma, so IFN-gamma-dependent macrophage activation
  fails and intramacrophagic mycobacteria and Salmonella replicate unchecked. Loss of
  IL-23 signalling additionally depletes IL-17-producing T cells, which is the accepted
  explanation for the mucocutaneous candidiasis seen in roughly a quarter of patients.

  This is the receptor-side counterpart of IL-12p40 (IL12B) deficiency, and the two are
  clinically near-indistinguishable: the same shared-chain logic operates one step apart on
  the same axis, cytokine in one case and receptor in the other. The lesion lies upstream
  of IFN-gamma in both, so recombinant IFN-gamma remains a mechanistically rational adjunct
  to prolonged antimycobacterial chemotherapy - the therapeutic dividing line that
  separates the production-arm etiologies of MSMD from the IFN-gamma receptor defects,
  where the same drug cannot work.

  records. The phenotype baseline here is therefore the 141-patient international survey
  (PMID:21057261) rather than an expert-curated chapter.
classifications:
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS phenotypic classification of inborn errors of immunity, Mendelian
      susceptibility to mycobacterial disease (MSMD) table. This entry is the IL12RB1
      etiology of MSMD, a defect of IL-12/IL-23-dependent IFN-gamma immunity.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Mendelian susceptibility to mycobacterial diseases (MSMD) is the most characterized
        of these IEIs, with 36 different disorders found in 20 distinct genes (IFNGR1,
        IFNGR2, IFNG, IL12RB1, IL12RB2, IL23R, IL12B, ISG15, USP18, ZNFX1, TBX21, STAT1,
        TYK2, IRF8, IRF1, CYBB, JAK1, RORC, NEMO, and SPPL2A)
      explanation: >-
        Places IL12RB1 in the established gene set of Mendelian susceptibility to
        mycobacterial disease, the inborn-error-of-immunity syndrome under which this
        entry is classified.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population rate has been established. The largest series assembled 141 patients from
    102 kindreds in 30 countries, and IL-12Rbeta1 deficiency is the most frequent single
    genetic etiology of MSMD. Reported as a literature case count rather than a rate,
    because ascertainment is driven by BCG vaccination policy and by consanguinity and so
    does not track underlying allele frequency.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interleukin-12 receptor β1 (IL-12Rβ1) deficiency is the most common form of Mendelian
      susceptibility to mycobacterial disease (MSMD). We undertook an international survey
      of 141 patients from 102 kindreds in 30 countries.
    explanation: >-
      Gives both the standing of this etiology within MSMD and the size and spread of the
      largest reported cohort, the basis for recording occurrence as a literature case
      count.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Disease begins in early childhood - mean age at first infection 2.4 years - and 30% of
    patients in the largest survey had died by last follow-up. Survivors require prolonged
    multidrug antimycobacterial chemotherapy, often with adjunctive recombinant IFN-gamma,
    and a minority need surgical resection of affected tissue. Burden is tempered relative
    to the IFN-gamma receptor defects by the incomplete penetrance and the rarity of
    mycobacterial recurrence, but childhood onset combined with 30% mortality places the
    disease-level burden at HIGH.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-nine patients (70%) survived, with a mean age at last follow-up visit of 12.7
      years ± 9.8 years (range, 0.5-46.4 yr).
    explanation: >-
      Establishes the survival figure - and by complement the 30% mortality - behind the
      HIGH burden assessment.
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 102 probands, the first infection occurred at a mean age of 2.4 years.
    explanation: >-
      Establishes early childhood as the age of onset, so the burden is borne across a
      whole life rather than late in one.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: >-
    ~69% among genetically affected siblings of index cases in the 141-patient survey
    (20 of 29 symptomatic); an earlier, smaller series had put asymptomatic carriage as
    high as 45%
  description: >
    Disease requires biallelic loss-of-function IL12RB1 variants. Reported kindreds are
    predominantly consanguineous and probands are usually homozygous; heterozygous
    relatives are healthy. Clinical penetrance is high but incomplete, and the estimate has
    moved with cohort size: the 2003 series reported up to 45% of genetically affected sibs
    remaining asymptomatic, while the larger 2010 survey found 69% of affected sibs
    symptomatic and 27% asymptomatic. The direction of that revision matters - penetrance
    is higher, and outcome worse, than the field first believed.

    The sharpest evidence on penetrance is intrafamilial. Two siblings homozygous for the
    same missense allele, with the same abolished receptor expression and the same abolished
    IL-12 response, diverged completely: one had disseminated BCG disease in early childhood,
    the other resisted three separate live-BCG inoculations and instead presented with
    abdominal tuberculosis at eighteen. Genotype does not determine phenotype here even
    within a sibship, which constrains what any genotype-based counselling can say.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty of the 29 genetically affected sibs displayed clinical signs (69%); however 8
      remained asymptomatic (27%).
    explanation: >-
      Quantifies incomplete penetrance in the largest cohort: roughly a quarter of
      genotype-positive relatives never become symptomatic.
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition has higher clinical penetrance, broader susceptibility to infections,
      and less favorable outcome than previously thought.
    explanation: >-
      Records that the penetrance and outcome estimates were revised upward and downward
      respectively as the cohort grew, which is why this entry cites the larger survey in
      preference to the earlier series.
  - reference: PMID:11424023
    reference_title: "Interleukin-12 receptor beta1 deficiency in a patient with abdominal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had the expected phenotype of disseminated bacille Calmette-Guérin (BCG)
      infection in early childhood, whereas the other did not develop BCG infection, despite
      3 inoculations with live BCG.
    explanation: >-
      Documents complete phenotypic divergence between two siblings carrying the identical
      homozygous allele, which is the strongest available evidence that penetrance is not
      genotype-determined.
  - reference: PMID:11424023
    reference_title: "Interleukin-12 receptor beta1 deficiency in a patient with abdominal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations show unexpected interfamilial and intrafamilial heterogeneity of
      the clinical phenotype associated with IL-12Rbeta1 deficiency.
    explanation: >-
      States the heterogeneity conclusion directly, at both the between-family and
      within-family level.
genetic:
- name: IL12RB1
  gene_term:
    preferred_term: IL12RB1
    term:
      id: hgnc:5971
      label: IL12RB1
  relationship_type: CAUSATIVE
  notes: >-
    IL12RB1 encodes the beta-1 chain shared by the IL-12 and IL-23 receptors. Complete
    deficiency results from biallelic null alleles - premature stop codons, frameshifts and
    large deletions in the extracellular domain predominate - which abolish surface
    expression of IL-12Rbeta1 on T and NK cells. Because the chain is shared, one gene
    defect removes cellular responsiveness to two cytokines.
  evidence:
  - reference: PMID:9603733
    reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL-12Rbeta1 sequence analysis revealed genetic mutations that resulted in premature
      stop codons in the extracellular domain.
    explanation: >-
      Identifies the class of loss-of-function allele underlying complete IL-12Rbeta1
      deficiency in the first patients described.
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the β1 chain shared by the IL-12 and IL-23 receptors (IL12RB1)
    explanation: >-
      States the shared-chain architecture that makes a single IL12RB1 defect abolish
      responsiveness to both IL-12 and IL-23.
  - reference: PMID:11424023
    reference_title: "Interleukin-12 receptor beta1 deficiency in a patient with abdominal tuberculosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of the patients' T cells with wild-type IL12RB1 restored IL-12Rbeta1
      expression and function.
    explanation: >-
      Complementation evidence: restoring the wild-type gene restores both the protein and
      the cellular response, which establishes causality rather than association.
pathophysiology:
- name: IL12RB1 Loss of Function
  description: >
    Biallelic null IL12RB1 alleles abolish expression of the IL-12Rbeta1 chain at the
    surface of T and NK cells. The chain is an obligate component of both the high-affinity
    IL-12 receptor (with IL-12Rbeta2) and the IL-23 receptor (with IL-23R), so its absence
    removes both receptors at once.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: IL12RB1
    term:
      id: hgnc:5971
      label: IL12RB1
  downstream:
  - target: Abolished Cellular Responsiveness to IL-12 and IL-23
    causal_link_type: DIRECT
    description: >-
      Loss of the shared beta-1 chain leaves T and NK cells unable to assemble either
      receptor, so they cannot respond to either cytokine.
    evidence:
    - reference: PMID:9603733
      reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three unrelated individuals with severe, idiopathic mycobacterial and Salmonella
        infections were found to lack IL-12Rbeta1 chain expression. Their cells were
        deficient in IL-12R signaling and IFN-gamma production
      explanation: >-
        Connects absent chain expression directly to failed receptor signalling in patient
        cells, which is the edge rather than either node alone.
  evidence:
  - reference: PMID:9603733
    reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL-12Rbeta1 sequence analysis revealed genetic mutations that resulted in premature
      stop codons in the extracellular domain.
    explanation: >-
      Documents the class of null allele at IL12RB1 that constitutes the initiating
      molecular lesion.
- name: Abolished Cellular Responsiveness to IL-12 and IL-23
  description: >
    Patient T and NK cells fail to signal in response to IL-12 and to IL-23. The defect is
    functional as well as structural: whole blood does not raise IFN-gamma when exogenous
    recombinant IL-12 is added, and T-cell blasts neither produce IFN-gamma nor express
    IL-17 in response to IL-23.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: interleukin-12-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0035722
      label: interleukin-12-mediated signaling pathway
  - preferred_term: interleukin-23-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0038155
      label: interleukin-23-mediated signaling pathway
  downstream:
  - target: Impaired IL-12-Dependent IFN-gamma Production
    causal_link_type: DIRECT
    description: >-
      IL-12 is the dominant signal driving T and NK cells to secrete IFN-gamma; without a
      functional receptor that induction fails.
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients tested had an impaired response to IL-12 in this assay
      explanation: >-
        Establishes across the cohort that the receptor defect translates into failed
        IL-12-driven IFN-gamma induction, which is the step this edge asserts.
  - target: Impaired IL-23-Dependent IL-17 Immunity
    causal_link_type: DIRECT
    description: >-
      The same shared chain is required for IL-23 signalling, so the IL-23-dependent
      IL-17 axis fails in parallel rather than downstream.
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IL-12Rβ1-deficient patients had a smaller proportion of IL-17-producing T cells ex
        vivo, and that their T-cell blasts did not express IL-17 in response to stimulation
        with IL-23 in vitro
      explanation: >-
        Supports the specific link from absent IL-23 responsiveness to a depleted
        IL-17-producing T cell compartment.
  evidence:
  - reference: PMID:9603733
    reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      their remaining T cell responses were independent of endogenous IL-12
    explanation: >-
      Shows that what survives in patient T cells is precisely the IL-12-independent
      repertoire, establishing the selectivity of the signalling block.
- name: Impaired IL-12-Dependent IFN-gamma Production
  description: >
    T and NK cells fail to mount the IFN-gamma response that IL-12 normally drives, so
    circulating and locally available IFN-gamma is inadequate for the control of
    intramacrophagic pathogens.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  biological_processes:
  - preferred_term: type II interferon production
    modifier: DECREASED
    term:
      id: GO:0032609
      label: type II interferon production
  downstream:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    causal_link_type: DIRECT
    description: >-
      Macrophage antimycobacterial activity is IFN-gamma-dependent, so a shortfall in
      IFN-gamma leaves macrophages unactivated.
    evidence:
    - reference: PMID:9603732
      reference_title: "Impairment of mycobacterial immunity in human interleukin-12 receptor deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, IL-12-dependent IFN-gamma secretion in humans seems essential in the control
        of mycobacterial infections, despite the formation of mature granulomas due to
        IL-12-independent IFN-gamma secretion.
      explanation: >-
        States that it is specifically the IL-12-dependent share of IFN-gamma secretion
        that mycobacterial control requires, which is the step this edge asserts.
  evidence:
  - reference: PMID:9603733
    reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their cells were deficient in IL-12R signaling and IFN-gamma production
    explanation: >-
      Directly documents reduced IFN-gamma production in patient cells.
- name: Failed IFN-gamma-Dependent Macrophage Activation
  description: >
    Without adequate IFN-gamma, macrophages do not acquire the activated phenotype needed
    to restrict intracellular bacterial replication in the phagosome. Granuloma architecture
    is preserved - mature granulomas with epithelioid and multinucleated giant cells still
    form on residual IL-12-independent IFN-gamma - so the lesion is in macrophage activation
    rather than in granuloma assembly. That dissociation separates this disease from
    IFN-gamma receptor deficiency, where granuloma formation itself fails.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    modifier: DECREASED
    term:
      id: GO:0042116
      label: macrophage activation
  downstream:
  - target: Uncontrolled Intramacrophage Replication of Weakly Virulent Mycobacteria and Salmonella
    causal_link_type: DIRECT
    description: >-
      Unactivated macrophages are a permissive niche for mycobacteria and non-typhoidal
      Salmonella.
    evidence:
    - reference: PMID:9603733
      reference_title: "Severe mycobacterial and Salmonella infections in interleukin-12 receptor-deficient patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The lack of IL-12Rbeta1 expression results in a human immunodeficiency and shows
        the essential role of IL-12 in resistance to infections due to intracellular
        bacteria.
      explanation: >-
        States the causal conclusion the authors drew from the patients: this axis is what
        confers resistance to intracellular bacteria, so its failure is what permits them.
  evidence:
  - reference: PMID:9603732
    reference_title: "Impairment of mycobacterial immunity in human interleukin-12 receptor deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mature granulomas were seen, surrounded by T cells and centered with epithelioid and
      multinucleated giant cells, yet reduced IFN-gamma concentrations were found to be
      secreted by activated natural killer and T cells.
    explanation: >-
      Shows the defect is a failure of macrophage activation rather than of granuloma
      assembly: residual IL-12-independent IFN-gamma still builds mature granulomas, and
      they are nonetheless not protective.
- name: Uncontrolled Intramacrophage Replication of Weakly Virulent Mycobacteria and Salmonella
  description: >
    Organisms that a competent IFN-gamma axis would clear silently - the BCG vaccine strain,
    environmental mycobacteria, non-typhoidal Salmonella - instead replicate and disseminate.
    Susceptibility is narrow: patients handle most other pathogens normally, which is what
    makes MSMD a selective rather than a combined immunodeficiency.
  biological_scale: ORGANISM
  downstream:
  - target: Disseminated BCG disease
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 78 patients, this infection was caused by Bacille Calmette-Guérin (BCG; n = 65),
        environmental mycobacteria (EM; also known as atypical or nontuberculous
        mycobacteria) (n = 9) or Mycobacterium tuberculosis (n = 4).
      explanation: >-
        Establishes BCG as the dominant presenting organism, the clinical expression of
        this node.
  - target: Non-tuberculous mycobacterial infection
    causal_link_type: DIRECT
  - target: Non-typhoidal salmonellosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Twenty-two of the remaining 24 probands initially presented with nontyphoidal,
        extraintestinal salmonellosis.
      explanation: >-
        Establishes salmonellosis as the second presenting syndrome produced by this node.
  - target: Tuberculosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12591909
    reference_title: "Low penetrance, broad resistance, and favorable outcome of interleukin 12 receptor beta1 deficiency: medical and immunological implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unexpectedly, human IL-12 is redundant in protective immunity against most
      microorganisms other than Mycobacteria and Salmonella.
    explanation: >-
      Documents the narrowness of the susceptibility - IL-12 is dispensable for immunity to
      everything else - which is the defining feature of this node and what distinguishes
      MSMD from a combined immunodeficiency.
- name: Impaired IL-23-Dependent IL-17 Immunity
  description: >
    Loss of IL-23 signalling depletes the IL-17-producing T cell compartment. IL-17 is
    required for mucosal antifungal defence, and this is the accepted explanation for the
    mucocutaneous candidiasis in this disease - a phenotype that the IFN-gamma arm does not
    account for.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: interleukin-17 production
    modifier: DECREASED
    term:
      id: GO:0032620
      label: interleukin-17 production
  downstream:
  - target: Chronic mucocutaneous candidiasis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We recently found that 32 (24%) of the 132 symptomatic patients for whom
        information was available presented mucocutaneous disease caused by Candida
        albicans
      explanation: >-
        Quantifies the candidiasis this arm of the mechanism is invoked to explain.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the blood cells from the patients tested displayed an impaired response to
      both IL-12 and IL-23
    explanation: >-
      Establishes that the IL-23 arm is affected alongside the IL-12 arm, which is what
      makes this a parallel branch rather than a downstream consequence.
phenotypes:
- category: Infectious
  name: Disseminated BCG disease
  description: >
    Disease caused by the live attenuated Bacille Calmette-Guerin vaccine strain, ranging
    from regional lymphadenitis to disseminated infection. It is the commonest presenting
    illness and follows routine neonatal BCG vaccination in countries that practise it.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  frequency: FREQUENT
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall clinical spectrum of infectious diseases in index cases was as follows:
      isolated BCG disease was present in 43 patients, isolated salmonellosis in 15 patients,
      isolated EM disease in 6 patients, and isolated tuberculosis in 2 patients.
    explanation: >-
      Gives the prevalence of BCG disease across index cases, which is what the FREQUENT band
      rests on. Replaces a recurrence count, which spoke to how often the disease returns
      rather than to how often it occurs.
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT

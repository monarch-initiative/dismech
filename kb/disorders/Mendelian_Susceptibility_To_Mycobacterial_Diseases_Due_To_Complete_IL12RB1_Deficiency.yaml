diagnosis:
- name: Absent IL-12Rbeta1 surface expression by flow cytometry
  description: >
    The test that defines this entry's scope. "Complete" deficiency means the receptor chain
    is not detectable at the cell surface, as distinct from partial deficiency where a
    non-functional or reduced-level chain is expressed. It is assessed by flow cytometry with
    specific antibodies on T cell blasts, EBV-transformed B cells, or both.

    Two things make this more than a formality. It is what separates complete from partial
    IL-12Rbeta1 deficiency, which are different entries; and expression alone is not
    sufficient, because a patient carrying a large in-frame deletion expressed the chain
    while remaining functionally deficient. So surface staining and the functional IL-12
    response assay below are complementary rather than redundant, and the defining cohort
    required one, the other, or both.
  evidence:
  - reference: PMID:12591909
    reference_title: "Low penetrance, broad resistance, and favorable outcome of interleukin 12 receptor beta1 deficiency: medical and immunological implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, we have demonstrated complete IL-12Rβ1 deficiency in 29 patients (absence of
      detectable IL-12Rβ1 surface expression, n = 28, absence of response to IL-12, n = 27,
      or both, n = 27).
    explanation: >-
      States the operational definition of complete deficiency, and shows the two criteria
      were applied singly or together rather than as one compound test.
  - reference: PMID:12591909
    reference_title: "Low penetrance, broad resistance, and favorable outcome of interleukin 12 receptor beta1 deficiency: medical and immunological implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed IL-12Rβ1 expression on the surface of T cell blasts (kindreds 9, 14, 15,
      22, 25), EBV-transformed B cells (kindreds 8, 11, 19, 20, 29), or both (kindreds 3, 6,
      10, 12, 16, 17, 23, 24, 26–28), from 21 of the 24 newly diagnosed probands, by flow
      cytometry with specific antibodies.
    explanation: >-
      Describes the method and the cell types it is performed on.
  - reference: PMID:12591909
    reference_title: "Low penetrance, broad resistance, and favorable outcome of interleukin 12 receptor beta1 deficiency: medical and immunological implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 10.II.2, carrying a large in-frame deletion, presented an expression of the β1
      chain, both on T cell blasts and EBV-transformed B c
    explanation: >-
      Records the exception that makes the functional assay necessary alongside the staining:
      a patient can express the chain and still be deficient.
- name: IL-12-stimulated whole-blood IFN-gamma assay
  description: >
    Whole blood is stimulated with BCG alone and with BCG plus exogenous recombinant IL-12,
    and IFN-gamma is measured. A patient with a receptor defect fails to raise IFN-gamma
    even when IL-12 is supplied, which separates IL-12Rbeta1 deficiency from IL-12p40
    deficiency, where adding the cytokine restores the response. Surface IL-12Rbeta1
    staining and IL12RB1 sequencing confirm it.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We measured the production of IFN-γ in whole blood in response to stimulation with
      BCG alone (partly resulting from BCG-dependent, endogenous IL-12 production) and in
      response to BCG plus exogenous recombinant IL-12
    explanation: >-
      Describes the assay and the two stimulation arms whose discordance is what the test
      reads out.
treatments:
- name: Antimycobacterial Therapy
  description: >
    Prolonged multidrug antimycobacterial chemotherapy is the mainstay for BCG and
    environmental mycobacterial disease, with antibiotic courses for salmonellosis. Courses
    are long because host clearance of the organism cannot be relied on.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antitubercular agent
      term:
        id: NCIT:C280
        label: Antitubercular Agent
  target_mechanisms:
  - target: Uncontrolled Intramacrophage Replication of Weakly Virulent Mycobacteria and Salmonella
    description: >-
      Chemotherapy substitutes for the failed host control of the organism; it does not
      correct the immune defect.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL-12Rβ1-deficient individuals were commonly treated with prolonged courses of
      antibiotics and exogenous IFN-γ.
    explanation: >-
      Documents prolonged antibiotic courses as standard management in the reference
      cohort.
- name: Recombinant Interferon Gamma
  description: >
    Adjunctive recombinant IFN-gamma is mechanistically rational here because the lesion
    lies upstream of IFN-gamma: the cytokine itself and its receptor are intact, so
    exogenous IFN-gamma can bypass the block and activate macrophages. This is the line
    that separates the production-arm MSMD etiologies from the IFN-gamma receptor defects.
    Note the evidence base is observational practice rather than a controlled trial - the
    reference cohort explicitly could not evaluate treatment effect.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  target_mechanisms:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    description: >-
      Exogenous IFN-gamma acts downstream of the receptor block, restoring the macrophage
      activation signal that the patient cannot generate.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both curative and preventive treatment of IL-12Rβ1 deficiency, based on prolonged
      courses of antibiotics, exogenous IFN-γ treatment, and, in rare cases, surgical
      resection of affected areas, may influence clinical outcome in these patients.
    explanation: >-
      Documents exogenous IFN-gamma as part of both curative and preventive management, and
      the hedged wording is itself the honest strength of the claim.
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, we were unable to explore the effects of treatment on clinical outcome in
      the present study because the information available was too limited
    explanation: >-
      Records explicitly that the largest cohort could not assess whether treatment changes
      outcome. Cited as NO_EVIDENCE because it bears on the efficacy claim without
      supporting or refuting it.
- name: Avoidance of BCG Vaccination
  description: >
    BCG is a live attenuated vaccine and is the single commonest cause of disease in this
    condition, so it is contraindicated in known patients and in at-risk siblings pending
    genotyping. In vaccinating countries the diagnosis is frequently made only after
    vaccine-strain disease has already occurred.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Uncontrolled Intramacrophage Replication of Weakly Virulent Mycobacteria and Salmonella
    description: >-
      Withholding the live vaccine removes the organism that this node most often acts on.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 78 patients, this infection was caused by Bacille Calmette-Guérin (BCG; n = 65)
    explanation: >-
      Establishes BCG as the dominant cause of first infection, which is what makes
      withholding the live vaccine the primary preventable exposure.
- name: Hematopoietic Cell Transplantation
  description: >
    Transplantation replaces the defective haematopoietic compartment and is the only
    treatment directed at the lesion rather than at its consequences. It is reserved for
    severe or refractory disease. Note the evidence base is cohort management experience -
    a Chinese cohort in which HSCT achieved markedly higher antimycobacterial cure rates -
    rather than a controlled comparison, and the decision is weighed against a disease whose
    overall survival is already around 70% on medical management.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: IL12RB1 Loss of Function
    description: >-
      Donor-derived lymphocytes carry a functional IL12RB1 allele, so the receptor defect is
      corrected at its source rather than bypassed.
  evidence:
  - reference: PMID:31367980
    reference_title: "Current Status of the Management of Mendelian Susceptibility to Mycobacterial Disease in Mainland China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the patients, IL12RB1 mutations were identified in 22, IFNGR1 mutations in 5,
      STAT1 mutations in 2, and IFNGR2 mutation in 1.
    explanation: >-
      Establishes that the management cohort behind this treatment is predominantly
      IL12RB1-deficient patients, so its experience applies to this entry.
environmental:
- name: BCG vaccination
  description: >
    The live attenuated Mycobacterium bovis BCG vaccine is the single commonest cause of
    disease in this disorder and the exposure that most often brings it to diagnosis. The
    genotype alone does not produce illness: an encounter with a weakly virulent
    intracellular organism is required, and in vaccinating countries that encounter is
    usually iatrogenic and scheduled. That makes this one of the few inborn errors of
    immunity whose dominant trigger is a routine public-health intervention, and the reason
    withholding the vaccine in at-risk siblings is the principal preventive measure.
  exposure_term:
    preferred_term: exposure to BCG vaccination
  review_notes: >-
    Exposure term left unbound. ECTO has no class for vaccination exposure in the build the
    term validator resolves against: `runoak -i sqlite:obo:ecto info ECTO:2000129` returns
    no label, and the ECTO term cache contains no vaccination, BCG or Mycobacterium exposure
    class. OLS does return ECTO:2000129 "exposure to vaccination", so the term exists
    upstream and the local build lags; binding it now would fail `just validate-terms`. An
    over-broad binding to a generic chemical or infectious-agent exposure would assert the
    wrong thing about a live attenuated vaccine, so no term is better than a bad one here.
    Another entry in this KB records the same search with the same outcome.
  influences_mechanisms:
  - target: Uncontrolled Intramacrophage Replication of Weakly Virulent Mycobacteria and Salmonella
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Live BCG supplies the organism that the failed IFN-gamma axis cannot contain, which is
      what converts the latent genetic defect into disease.
    evidence:
    - reference: PMID:21057261
      reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 78 patients, this infection was caused by Bacille Calmette-Guérin (BCG; n = 65)
      explanation: >-
        Establishes BCG as the dominant organism of first infection, which is the exposure
        acting on this mechanism.
  evidence:
  - reference: PMID:21057261
    reference_title: "Revisiting human IL-12Rβ1 deficiency: a survey of 141 patients from 30 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We determined the impact of BCG vaccination and BCG disease on the clinical phenotype
      of 129 patients.
    explanation: >-
      Documents that vaccination status was treated as a determinant of phenotype in the
      reference cohort, which is what makes it an environmental factor rather than an
      incidental exposure.
animal_models:
- name: Il12rb1-deficient mouse
  species: Mouse
  genotype: Il12rb1 knockout
  publication: PMID:35891311
  description: >
    The knockout reproduces increased BCG susceptibility, with significantly raised CFU
    counts in spleen and lung. Its interest here is not that it recapitulates the disease
    but that it was built to attack the entry's hardest open question - why penetrance is
    incomplete - by asking what protective immunity survives the lesion.

    The answer complicates the IFN-gamma story. Innate TNF-alpha and IFN-gamma responses
    fell and PPD-specific IFN-gamma release was impaired, as expected; but TNF-alpha release
    was preserved, antibody responses were enhanced, IL-17 responses rose, and both innate
    and PPD-specific IFN-gamma responses correlated *positively* with bacterial burden. The
    authors' own reading is that IFN-gamma alone may not be able to contain BCGitis in this
    setting.
  modeled_mechanisms:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the impaired IFN-gamma response and the resulting failure to control BCG,
      while showing that other arms of antimycobacterial immunity remain intact.
    limitations: >-
      The mouse study measures correlation between response magnitude and bacterial burden,
      not the direction of causation, and a positive correlation between IFN-gamma and CFU
      is as consistent with IFN-gamma rising in response to burden as with IFN-gamma failing
      to control it. Human patients also differ from the model in the one respect the model
      is invoked to explain: mouse penetrance is engineered and uniform, while the human
      incompleteness is what needs explaining.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Inbred knockout mice under controlled BCG challenge, against outbred patients with
        variable exposure history. The human phenomenon the model is cited to explain -
        that some genotype-positive siblings never fall ill - has no counterpart in a
        uniformly challenged isogenic cohort.
    evidence:
    - reference: PMID:35891311
      reference_title: "Immune Correlates of Disseminated BCG Infection in IL12RB1-Deficient Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results manifested that Il12rb1-/- mice had significantly increased CFU counts in
        spleens and lungs, especially when BCG (Danish strain) was inoculated subcutaneously.
      explanation: >-
        Establishes that the model reproduces the failure of BCG control that this node
        describes.
  evidence:
  - reference: PMID:35891311
    reference_title: "Immune Correlates of Disseminated BCG Infection in IL12RB1-Deficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the low clinical penetrance of IL12RB1 deficiency and low recurrence rate of
      mycobacteria infection suggest that protective immunity still exists in this population
    explanation: >-
      States the question the model was built to answer, which is why it is informative for
      this entry beyond simple recapitulation.
discussions:
- discussion_id: ifn_gamma_adjunct_outcome_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does adjunctive recombinant IFN-gamma change clinical outcome in complete IL-12Rbeta1
    deficiency, or is its use inferred from the position of the lesion on the pathway?
  attaches_to:
  - treatments#Recombinant Interferon Gamma
  - animal_models#Mouse
  rationale: >-
    The mechanistic case is strong and uncontested - the defect is upstream of IFN-gamma, so
    the cytokine can in principle bypass it - but the largest cohort ever assembled stated
    plainly that it could not evaluate the effect of treatment on outcome because the
    recorded information was too limited. The entry therefore carries a treatment whose
    rationale rests on pathway position rather than on measured benefit, and the two should
    not be conflated. This distinction matters beyond this disease: it is the same argument
    used to withhold IFN-gamma in IFN-gamma receptor defects, where the pathway position is
    reversed.

    The mouse work adds a second reason for caution that is easy to miss, because it points
    the same way as the clinical uncertainty but for a different reason. In Il12rb1-null
    mice both innate and PPD-specific IFN-gamma responses correlated positively with
    bacterial burden, and the authors concluded that IFN-gamma responses alone might not
    contain BCGitis in this setting. That is a correlation in a model, not a refutation -
    and a positive correlation is equally consistent with IFN-gamma rising in response to
    burden. But it means the mechanistic case for the therapy is not as clean as "the lesion
    is upstream, so the cytokine bypasses it".
  evidence:
  - reference: PMID:35891311
    reference_title: "Immune Correlates of Disseminated BCG Infection in IL12RB1-Deficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      our results imply that IFN-γ responses alone might not be able to contain BCGitis in
      the setting of IL12RB1 deficiency
    explanation: >-
      Bears on the efficacy question from the model side. Graded INDIRECT because it is an
      implication the authors draw from correlations in mice, not a measurement of the
      therapy in patients, and the hedge is theirs.

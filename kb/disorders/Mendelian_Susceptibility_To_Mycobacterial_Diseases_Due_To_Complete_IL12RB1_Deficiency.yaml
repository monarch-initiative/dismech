notes: >-
  No GeneReviews chapter covers MSMD or IL-12Rbeta1 deficiency. Checked with
  `just check-genereviews` against the committed Bookshelf index (snapshot 2026-09-10,
  NO_CHAPTER) and independently against PubMed with
  `"mycobacterial disease"[TI] AND genereviews[book]` and

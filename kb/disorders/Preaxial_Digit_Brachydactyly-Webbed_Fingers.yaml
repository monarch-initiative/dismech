name: Preaxial Digit Brachydactyly-Webbed Fingers
creation_date: "2026-09-21T17:00:00Z"
category: Mendelian
synonyms:
- Preaxial brachydactyly PAX3 type
disease_term:
  preferred_term: Preaxial digit brachydactyly-webbed fingers
  term:
    id: MONDO:0859005
    label: preaxial digit brachydactyly-webbed fingers
parents:
- Congenital Limb Malformation
description: >-
  An autosomal dominant limb malformation associated with deletions spanning
  EPHA4 and the boundary between the EPHA4 and PAX3 regulatory domains.
  The PAX3 coding sequence remains intact. Affected families have predominantly
  preaxial brachydactyly, short thumbs and index fingers, and cutaneous webbing
  between the first two fingers. Patient fibroblasts demonstrate abnormal
  PAX3 contacts with the EPHA4 regulatory domain; engineered mouse deletions
  cause ectopic distal limb Pax3 expression and recapitulate the digit
  malformation. The intervening cellular mechanism linking ectopic PAX3 to
  skeletal morphology remains unresolved.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous deletions segregate with the limb phenotype in three unrelated
    families described by Lupiáñez et al.; this is distinct from coding PAX3
    disorders and IHH-related brachydactyly type A1.
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First, we investigated a dominantly inherited novel type of brachydactyly
      in three unrelated families
    explanation: The original family series establishes dominant inheritance.
pathophysiology:
- name: Deletion of the EPHA4-PAX3 Regulatory Boundary
  biological_scale: MOLECULAR
  role: trigger
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intergenic region
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: deletions spanning EPHA4 and the adjacent boundary with the PAX3 domain
  description: >-
    Heterozygous deletions remove EPHA4 coding sequence and part of its
    surrounding topologically associating domain, extending into noncoding
    sequence of the neighboring PAX3 domain. The PAX3 coding sequence is
    retained. The loss of intervening boundary sequence is a physical event
    distinct from altered enhancer contacts and ectopic target-gene expression.
  genes:
  - preferred_term: EPHA4
    term:
      id: hgnc:3388
      label: EPHA4
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three deletions include the EPHA4 gene along with a large portion of
      its surrounding TAD and extend into the non-coding part of the adjacent
      PAX3 TAD, thereby removing the predicted boundary between the EPHA4 and PAX3 TADs.
    explanation: Defines the removed sequence and distinguishes the intact regulatory target.
  downstream:
  - target: Ectopic PAX3 Contacts with EPHA4 Limb Enhancers
    causal_link_type: DIRECT
    description: Removing the intervening boundary permits contacts across the former domain boundary.
- name: Ectopic PAX3 Contacts with EPHA4 Limb Enhancers
  biological_scale: MOLECULAR
  description: >-
    Circular chromosome-conformation capture (4C-seq) in adult
    fibroblasts from a family B1 patient detects abnormal contact between the
    PAX3 promoter and the centromeric EPHA4 domain. Mouse limb 4C and enhancer
    reporter assays identify limb-active elements in the ectopic interaction
    region. Patient fibroblast contact data establish altered architecture;
    they do not measure embryonic limb expression.
  genes:
  - preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  biological_processes:
  - preferred_term: PAX3 enhancer-promoter contacts
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similar to DelB mice, the human brachydactyly-associated deletion resulted
      in aberrant contact of the PAX3 promoter region with the centromeric part
      of the EPHA4 TAD
    explanation: Human adult fibroblast 4C supports abnormal contacts in the patient allele.
  downstream:
  - target: Ectopic PAX3 Expression in the Distal Anterior Limb
    causal_link_type: DIRECT
    description: >-
      In the corresponding DelB mouse model, contacts with the Epha4 limb
      enhancer region accompany adoption of an Epha4-like Pax3 expression domain.
- name: Ectopic PAX3 Expression in the Distal Anterior Limb
  biological_scale: MOLECULAR
  regulatory_category: GOE
  description: >-
    At mouse embryonic day E11.5, Pax3 is normally restricted to migrating
    muscle cells in the proximal limb and absent from the hand plate. DelB
    heterozygotes instead express Pax3 in distal anterior autopod tissue,
    resembling the Epha4 expression domain. This spatial change supports GOE,
    independently of the accompanying increase in RNA abundance. The evidence
    comes from an engineered mouse deletion; ectopic PAX3 expression was not
    directly measured in the patients' embryonic limbs.
  genes:
  - preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  biological_processes:
  - preferred_term: PAX3 gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DelB/+ (brachydactyly-like deletion) mice showed strong misexpression of
      Pax3 in the distal anterior part of the autopod, in a pattern resembling
      endogenous Epha4 expression
    explanation: In situ hybridization establishes ectopic expression in the model limb.
  downstream:
  - target: Abnormal Preaxial Digit Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The DelB mouse recapitulates the human digit malformation, while
      boundary-preserving controls lack ectopic expression and digit defects.
      How ectopic PAX3 changes skeletal differentiation remains unresolved.
- name: Abnormal Preaxial Digit Morphogenesis
  biological_scale: TISSUE
  role: consequence
  description: >-
    Distal digit development is altered, producing shortened predominantly
    radial digits and first-to-second finger skin webbing in the human
    families. The mouse model has corresponding phalangeal hypoplasia; this
    supports developmental convergence without establishing the precise
    PAX3-dependent cellular pathway or excluding every effect of the multigene
    deletion.
  biological_processes:
  - preferred_term: digit morphogenesis within the developing limb
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, mutant mice with a deletion corresponding to the human disease
      alleles recapitulated the phenotype observed in patients.
    explanation: Supports model-to-human phenotypic correspondence, not a resolved cellular intermediate.
  downstream:
  - target: Brachydactyly
    causal_link_type: DIRECT
  - target: Short Thumb
    causal_link_type: DIRECT
  - target: First-Second Finger Cutaneous Syndactyly
    causal_link_type: DIRECT

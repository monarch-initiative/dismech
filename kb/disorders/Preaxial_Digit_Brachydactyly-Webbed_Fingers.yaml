genetic:
- name: PAX3 regulatory dysregulation
  gene_term:
    preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    PAX3 is the intact regulatory target. The causal deletions physically
    remove EPHA4 and domain-boundary sequence rather than disrupting PAX3
    protein coding sequence. The functional experiments support enhancer
    adoption and ectopic expression in the corresponding mouse limb model.
  variants:
  - name: POSTRE Table 1 Nr4 EPHA4-PAX3 boundary deletion
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intergenic region
    gene:
      preferred_term: EPHA4
      term:
        id: hgnc:3388
        label: EPHA4
    regulatory_target_gene:
      preferred_term: PAX3
      term:
        id: hgnc:8617
        label: PAX3
    regulatory_category: GOE
    description: >-
      POSTRE represents the brachydactyly deletion from Lupiáñez et al. as
      hg19/GRCh37 chr2:221278232-223014332, approximately 1.74 Mb. This is a
      secondary benchmark interval; its precise correspondence to one of
      families B1-B3 has not been independently resolved here. It is not a new
      patient or a second allele in addition to the source family. EPHA4 coding
      sequence and intergenic regulatory-boundary sequence are deleted;
      PAX3 coding sequence is intact. The GOE assignment is supported by the
      corresponding engineered mouse deletion, not a patient limb-expression
      measurement.
    functional_effects:
    - function: PAX3 enhancer adoption
      regulatory_element_type: TAD_BOUNDARY
      regulatory_mechanism: Loss of boundary insulation permits contacts with EPHA4 limb enhancers
      description: >-
        Human fibroblast 4C and mouse limb assays support altered contacts
        across the former domain boundary.
    - function: Ectopic PAX3 expression in the distal limb
      regulatory_element_type: ENHANCER
      regulatory_category: GOE
      affected_developmental_stage: Embryonic limb development; mouse E11.5
      description: >-
        Mouse DelB heterozygotes gain an Epha4-like distal anterior Pax3
        expression domain. The downstream cellular mechanism remains unresolved.
    evidence:
    - reference: PMID:36999617
      reference_title: 'POSTRE: a tool to predict the pathological effects of human structural variants.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The coordinates of the SVs in positive control patients (Table 1 and Table 2)
      explanation: >-
        Table 1 Nr4, Supplementary Data 3 Table1_SVs and the author input TSV
        provide the hg19 interval. This is coordinate provenance, not
        experimental proof of the expression mechanism.
    - reference: PMID:25959774
      reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        DelB/+ (brachydactyly-like deletion) mice showed strong misexpression
        of Pax3 in the distal anterior part of the autopod, in a pattern
        resembling endogenous Epha4 expression
      explanation: The corresponding mouse allele supports regulatory GOE for this deletion class.

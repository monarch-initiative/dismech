- name: Secondary Cellular Stress Response
  description: >-
    Beyond the primary bioenergetic deficit, KSS cells show relatively
    underemphasized secondary responses: reactive oxygen species overproduction,
    mitochondrial protein-synthesis inhibition, dysregulated autophagy, and
    apoptosis, with oligodendrocyte involvement and myelin
    vacuolation/demyelination. This cellular injury drives the downstream CNS
    white-matter pathology (bilateral globus pallidus and white-matter lesions
    on brain imaging).
  role: consequence
  biological_scale: CELLULAR
  cell_types:

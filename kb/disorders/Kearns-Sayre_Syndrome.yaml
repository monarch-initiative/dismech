  - target: Cardiac Conduction System Energy Failure
    causal_link_type: DIRECT
    description: >-
      Energy failure in the cardiac conduction system produces progressive
      conduction block and cardiomyopathy.
  - target: Central Nervous System and Auditory Energy Failure
    causal_link_type: DIRECT
    description: >-
      Energy failure in cerebellar, cortical, and auditory neural structures

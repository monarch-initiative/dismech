histopathology:
- name: Ragged-red and COX-negative muscle fibers
  description: >-
    Skeletal-muscle biopsy in KSS shows the canonical mitochondrial-myopathy
    signature: ragged-red fibers (subsarcolemmal mitochondrial accumulation on
    modified Gomori trichrome), ragged-blue fibers on SDH, and scattered
    cytochrome-c-oxidase (COX)-negative fibers reflecting focal respiratory-chain
    deficiency.
  context: Skeletal muscle biopsy; mitochondrial myopathy.
  evidence:
  - reference: PMID:17541738
    reference_title: Neuropathology of mitochondrial diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ragged red fibers, accumulation of structurally altered mitochondria and
      cytochrome-c-oxidase (COX) negative fibers are the main pathological
      features
    explanation: This neuropathology review names ragged-red and COX-negative fibers as the main muscle-pathology features of mitochondrial myopathy including KSS.
  - reference: PMID:38018320
    reference_title: The clinical, myopathological, and genetic analysis of 155 Chinese mitochondrial ophthalmoplegia patients with mitochondrial DNA single large deletions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proportion of ragged red fibers, ragged blue fibers, and cytochrome c
      negative fibers did not correlate
      significantly with onset ages
    explanation: A KSS-inclusive cohort quantified ragged-red, ragged-blue, and cytochrome-c-negative fibers on muscle biopsy (their proportion did not correlate with onset age).

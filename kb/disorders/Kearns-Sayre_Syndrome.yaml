    snippet: Blood lactate was raised (>2.0
    explanation: This pediatric SLSMD cohort supports lactate elevation as a biochemical readout of respiratory-chain energy failure.
  downstream:
  - target: Ocular and Retinal Energy Failure
    causal_link_type: DIRECT
    description: >-
      Energy failure in extraocular muscle and retina produces CPEO/ptosis and
      pigmentary retinopathy.
  - target: Cardiac Conduction and Neurologic Energy Failure
    causal_link_type: DIRECT
    description: >-
      Energy failure in conduction tissue and neural structures produces heart
      block, ataxia, hearing impairment, and other multisystem KSS features.
  - target: Secondary Cellular Stress and CNS White-Matter Injury
    causal_link_type: DIRECT
    description: >-
      Chronic respiratory-chain failure drives secondary reactive oxygen species
      overproduction, dysregulated autophagy, and apoptosis, with oligodendrocyte
      and myelin injury underlying the CNS white-matter pathology.
- name: Secondary Cellular Stress and CNS White-Matter Injury
  description: >-
    Beyond the primary bioenergetic deficit, KSS tissues show relatively
    underemphasized secondary responses: reactive oxygen species overproduction,
    mitochondrial protein-synthesis inhibition, dysregulated autophagy, and
    apoptosis, with myelin vacuolation/demyelination and oligodendrocyte
    involvement in the central nervous system. These converge on the bilateral
    globus pallidus and white-matter lesions seen on brain imaging.
  role: consequence
  biological_scale: CELLULAR
  cell_types:

name: Congenital Laryngomalacia
creation_date: "2026-09-01T13:39:06Z"
category: Congenital
parents:
- Congenital Laryngeal Anomaly
- Upper Airway Obstruction
disease_term:
  preferred_term: congenital laryngomalacia
  term:
    id: MONDO:0007878
    label: congenital laryngomalacia
synonyms:
- laryngomalacia
- congenital laryngeal stridor
description: >-
  Congenital laryngomalacia is the commonest cause of stridor in infancy, in
  which supraglottic tissue is drawn inward on inspiration and intermittently
  obstructs the airway above the vocal cords. The name says cartilage softening,
  and that is the older account, but the evidence has moved: laryngopharyngeal
  sensory testing shows that the threshold for the laryngeal adductor reflex is
  raised in proportion to disease severity and falls back to normal as symptoms
  resolve, which points at immature sensorimotor integration rather than at a
  structurally defective cartilage. That reframing matters for the whole
  pathograph, because a tone deficit is transient and self-correcting in a way
  that a malformed cartilage would not be - and spontaneous resolution over the
  first year or two is exactly what the disease does. Reflux is common and
  worsens obstruction through supraglottic oedema, but the direction of causation
  is genuinely disputed: laryngomalacia may equally well promote reflux by
  altering the thoraco-abdominal pressure gradient. Most infants need nothing
  more than time; a minority with aspiration, failure to thrive or hypoxia need
  supraglottoplasty.
pathophysiology:
- name: Immature Sensorimotor Integrative Function of the Larynx
  description: >-
    The initiating abnormality is in laryngeal sensorimotor control rather than
    in the cartilage. Laryngopharyngeal sensory testing delivers a calibrated air
    pulse to the aryepiglottic fold to trigger the laryngeal adductor reflex; in
    laryngomalacia the pressure needed to elicit that reflex is raised, and it is
    raised in proportion to disease severity. Two features make this a mechanism
    rather than an association: the threshold tracks severity across mild,
    moderate and severe groups, and it falls back toward normal at nine months in
    step with symptom resolution. A structurally soft cartilage would not behave
    that way.
  role: trigger
  biological_scale: ORGANISM
  locations:
  - preferred_term: aryepiglottic fold
    term:
      id: UBERON:0014385
      label: aryepiglottic fold
  evidence:
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial LPST was higher (P < .001) in infants with moderate (6.8 mm Hg)
      and severe disease (7.4 mm Hg) compared with those with mild disease (4.1
      mm Hg).
    explanation: >-
      Quantifies the sensory threshold across severity groups, which is the
      dose-like relationship this node rests on.
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 9 months, the LPST decreased in all subjects (3.1-3.5 mm Hg, P = .14),
      which also correlated with symptom resolution.
    explanation: >-
      The reflex threshold normalises alongside clinical resolution, which is
      what distinguishes a maturational tone deficit from a fixed structural
      defect.
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngeal tone and sensorimotor integrative function of the larynx is
      altered. The degree of alteration correlated with disease severity,
      indicating that factors that alter the peripheral and central reflexes of
      the LAR have a role in the etiology of signs and symptoms of
      laryngomalacia.
    explanation: >-
      The authors' own causal claim, stated as a role in aetiology rather than as
      a correlate.
  downstream:
  - target: Reduced Supraglottic Tone and Dynamic Tissue Laxity
    causal_link_type: DIRECT
    description: >-
      A blunted laryngeal adductor reflex means less active muscular support
      holding the supraglottic lumen open during inspiration.
- name: Reduced Supraglottic Tone and Dynamic Tissue Laxity
  description: >-
    With reflex support blunted, the supraglottic tissues are no longer actively
    held clear of the lumen. The resulting laxity is dynamic rather than fixed:
    the larynx looks normal at rest and collapses only when airflow demand rises,
    which is why the disease is intermittent and situational and why static
    imaging is useless for it.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  evidence:
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngomalacia is an enigmatic disease in which laryngeal tone is weak,
      resulting in dynamic prolapse of tissue into the larynx.
    explanation: >-
      States the tone-to-prolapse step directly, and names it as dynamic, which
      is the claim of this node.
  downstream:
  - target: Inspiratory Collapse of Supraglottic Structures
    causal_link_type: DIRECT
    description: >-
      Lax, unsupported tissue is available to be drawn inward once negative
      inspiratory pressure is applied to it.
- name: Predisposing Supraglottic Configuration
  description: >-
    A set of anatomical features that make collapse easier: an omega-shaped
    epiglottis that curls and falls posteriorly, short aryepiglottic folds that
    tether the epiglottis inward, redundant arytenoid mucosa that prolapses
    forward, and oedema of the posterior larynx. These are consistently seen on
    dynamic endoscopy and are reproducible between examiners, which is what makes
    them diagnostic criteria. They are modelled here as a parallel predisposing
    factor rather than as the cause: they set how much collapse a given loss of
    tone produces.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: epiglottis
    term:
      id: UBERON:0000388
      label: epiglottis
  - preferred_term: arytenoid cartilage
    term:
      id: UBERON:0001740
      label: arytenoid cartilage
  - preferred_term: aryepiglottic fold
    term:
      id: UBERON:0014385
      label: aryepiglottic fold
  evidence:
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A protocol of videolaryngoscopic evaluation for patients with
      laryngomalacia was created encompassing the following items: anterior
      displacement of the arytenoids; omega-shaped epiglottis; short
      aryepiglottic folds; posterior displacement of epiglottis; vocal folds
      being visible or not; edema of the posterior larynx.
    explanation: >-
      Enumerates the anatomical features this node records, as the items of a
      validated evaluation protocol rather than as an informal description.
  downstream:
  - target: Inspiratory Collapse of Supraglottic Structures
    causal_link_type: DIRECT
    description: >-
      Redundant and inward-tethered tissue is what physically occupies the lumen
      when collapse occurs.
- name: Inspiratory Collapse of Supraglottic Structures
  description: >-
    Inspiration generates negative pressure across the supraglottic airway. Where
    tone is reduced and the configuration is permissive, that pressure draws the
    epiglottis, aryepiglottic folds and arytenoid mucosa inward toward the
    glottis. Because the driving force is the infant's own inspiratory effort,
    anything that increases it - crying, feeding, agitation, intercurrent illness
    - deepens the collapse, which is the positive feedback that makes severe
    episodes self-reinforcing.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  evidence:
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established by associating the clinical manifestations with
      laryngoscopic findings in a dynamic form.
    explanation: >-
      Supports that the defining finding is dynamic collapse observed during
      breathing rather than a static appearance, which is what this node asserts.
  downstream:
  - target: Dynamic Supraglottic Airway Obstruction
    causal_link_type: DIRECT
    description: >-
      Tissue occupying the lumen reduces its cross-sectional area during
      inspiration.
- name: Reflux-Associated Supraglottic Oedema
  description: >-
    Gastric contents reaching the laryngopharynx irritate the supraglottic
    mucosa, and the resulting oedema adds tissue bulk exactly where the lumen is
    already narrowed. Reflux is common in this population and its presence tracks
    with worse outcomes. The causal direction is genuinely unsettled, and this
    entry does not resolve it: laryngomalacia may equally well promote reflux by
    altering the thoraco-abdominal pressure gradient, so the node is modelled as
    an aggravator of an existing obstruction rather than as an upstream cause.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  evidence:
  - reference: PMID:39525522
    reference_title: >-
      Reflux disease and congenital laryngomalacia in neonates: A Kids' Inpatient
      Database analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 2212 neonates identified with CLM, 585 (26.45%) had RD.
    explanation: >-
      Quantifies co-occurrence in a national inpatient cohort, which is the
      frequency claim this node makes.
  - reference: PMID:39525522
    reference_title: >-
      Reflux disease and congenital laryngomalacia in neonates: A Kids' Inpatient
      Database analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon multivariable analysis, patients with RD had greater total charges
      (Mean $457,810.87 vs. $259,020.90, p < .001) and longer length of stay
      (Mean 46.03 vs. 26.44 days, p < .001).
    explanation: >-
      Establishes that reflux marks a worse course rather than merely
      co-occurring, after adjustment for demographics and comorbidities.
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those with gastroesophageal reflux and/or laryngopharyngeal reflux have
      symptom improvement from acid suppression therapy.
    explanation: >-
      Therapeutic response cited as validation of the mechanism it targets, which
      is an inference step rather than a direct measurement of supraglottic
      oedema - hence INDIRECT.
  notes: >-
    The reverse-causation possibility is not a hedge. Modelling reflux as an
    upstream cause would predict that acid suppression should shorten the disease
    course, and the cited evidence supports symptom improvement rather than that.
  downstream:
  - target: Dynamic Supraglottic Airway Obstruction
    causal_link_type: DIRECT
    description: >-
      Oedematous mucosa adds bulk to tissue that is already prolapsing, reducing
      the margin against collapse.
- name: Dynamic Supraglottic Airway Obstruction
  description: >-
    The convergence point of the whole pathograph. A reduction in the calibre of
    an already narrow infant larynx produces a disproportionate rise in
    resistance and turbulent flow, which is heard as inspiratory stridor. Because
    the obstruction is above the vocal cords and appears only on inspiration, the
    stridor is characteristically inspiratory and varies from moment to moment
    with respiratory effort and position.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngomalacia is the most common cause of stridor in newborns, affecting
      45-75% of all infants with congenital stridor.
    explanation: >-
      Ties the obstruction at this node to stridor as its clinical expression,
      and quantifies how much congenital stridor it accounts for.
  downstream:
  - target: Inspiratory stridor
    causal_link_type: DIRECT
    description: >-
      Turbulent flow through the narrowed supraglottis is what is heard.
  - target: Swallow-Breathe Discoordination and Aspiration
    causal_link_type: DIRECT
    description: >-
      Increased inspiratory effort competes with the airway protection needed
      during swallowing.
  - target: Dyspnea
    causal_link_type: DIRECT
    description: >-
      Increased work of breathing against the narrowed supraglottis. The source
      attributes the severe end of this directly to the respiratory obstruction.
    evidence:
    - reference: PMID:18392498
      reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        in 10% of the cases it is necessary to operate, because the respiratory
        obstruction can cause severe dyspnea, dysphagia, growth delay and
        obstructive sleep apnea
      explanation: >-
        Attributes severe dyspnoea to the respiratory obstruction, which is the
        claim this edge makes.
  - target: Intercostal retractions
    causal_link_type: DIRECT
    description: >-
      Chest wall indrawing is the visible mechanical consequence of generating
      large negative pressures against an obstructed supraglottis.
    evidence:
    - reference: PMID:39525522
      reference_title: >-
        Reflux disease and congenital laryngomalacia in neonates: A Kids'
        Inpatient Database analysis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Feeding difficulties and inspiratory retractions are among the early
        presentations, although a flexible laryngoscopy is considered the
        appropriate diagnostic method for CLM.
      explanation: >-
        Places inspiratory retractions among the presenting features of the
        disease. Marked INDIRECT because the sentence names the association
        rather than the mechanical path from obstruction to indrawing.
  - target: Cyanosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Obstruction reduces effective alveolar ventilation, which produces the
      hypoxaemia that is seen as cyanosis. Marked indirect because the
      intervening steps - hypoventilation, desaturation - are omitted here.
    evidence:
    - reference: PMID:22518182
      reference_title: >-
        Laryngomalacia: disease presentation, spectrum, and management.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Those with additional symptoms of aspiration, failure to thrive, and
        consequences of airway obstruction and hypoxia require surgical
        intervention.
      explanation: >-
        Names hypoxia as a consequence of the airway obstruction. Marked INDIRECT
        because cyanosis is the visible sign of that hypoxia rather than the word
        the sentence uses.
  - target: Obstructive sleep apnea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Supraglottic collapse worsens with the reduced pharyngeal tone of sleep,
      producing sustained sleep-state obstruction. Marked indirect because the
      sleep-state modulation is an omitted intermediate.
    evidence:
    - reference: PMID:18392498
      reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        in 10% of the cases it is necessary to operate, because the respiratory
        obstruction can cause severe dyspnea, dysphagia, growth delay and
        obstructive sleep apnea
      explanation: >-
        Attributes obstructive sleep apnoea to the respiratory obstruction, which
        is the claim this edge makes.
  - target: Gastroesophageal reflux
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The obstruction-to-reflux direction: large negative intrathoracic pressures
      during obstructed inspiration alter the thoraco-abdominal pressure gradient
      that normally resists reflux. This is one of two competing directions and
      is not the settled one - the clm_reflux_causal_direction discussion records
      why the entry does not commit to either, and the edge is drawn this way
      round only because reflux is curated here as a phenotype rather than as a
      cause.
    evidence:
    - reference: PMID:39525522
      reference_title: >-
        Reflux disease and congenital laryngomalacia in neonates: A Kids'
        Inpatient Database analysis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        On the other hand, some posit that CLM can lead to RD by affecting the
        normal pressure gradient between the thoracic and abdominal cavities,
        which normally protects against reflux events.
      explanation: >-
        States the mechanism this edge asserts, and states it as a posited
        position rather than an established one - which is why the edge carries

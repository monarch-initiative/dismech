  sequelae:
  - target: Recurrent respiratory infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Repeated aspiration of feeds into the lower airway is the route to
      recurrent chest infection. Marked indirect because the intervening steps -
      bacterial inoculation, impaired clearance, consolidation - are omitted

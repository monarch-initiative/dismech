- name: Swallow-Breathe Discoordination and Aspiration
  description: >-
    Feeding requires breathing and swallowing to be interleaved precisely, and an
    infant working hard to inspire cannot do that reliably. The clinically
    important finding is how often the resulting aspiration is silent: among
    infants with laryngomalacia investigated for recurrent respiratory or feeding
    problems, aspiration was present in 42% and was silent in 98% of those. That
    is the argument for instrumented swallow assessment rather than clinical
    observation, and it is the route from an airway disease to failure to thrive
    and recurrent chest infection.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30589926
    reference_title: >-
      Evaluation of Aspiration in Infants With Laryngomalacia and Recurrent
      Respiratory and Feeding Difficulties.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aspiration was identified in 60 patients (42.3%), and silent aspiration was
      documented in 59 (98.3%) of these 60 patients.
    explanation: >-
      Gives both the frequency of aspiration in the investigated group and the
      proportion that was silent, which is the substance of this node.
  - reference: PMID:30589926
    reference_title: >-
      Evaluation of Aspiration in Infants With Laryngomalacia and Recurrent
      Respiratory and Feeding Difficulties.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these patients, 128 (90.1%) had swallowing dysfunction documented
      during the MBS study.
    explanation: >-
      Establishes swallowing dysfunction as near-universal in this subgroup,
      supporting the discoordination claim rather than aspiration alone.
  notes: >-
    The 42% and 90% figures are denominators of a selected group - infants
    referred for a swallow study because of recurrent respiratory or feeding
    problems, 142 of 395 diagnosed that year. They are not the rate of aspiration
    in all laryngomalacia, and should not be read as such.
  downstream:
  - target: Feeding difficulties
    causal_link_type: DIRECT
    description: >-
      Discoordinated feeding is what parents and clinicians observe first.
  - target: Aspiration
    causal_link_type: DIRECT
    description: >-
      Failure of airway protection during the swallow.
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inefficient feeding combined with the increased work of breathing produces
      a caloric deficit; the intermediate energetics are omitted here.
phenotypes:
- name: Inspiratory stridor
  category: Respiratory
  description: >-
    The defining sign: a harsh inspiratory noise from turbulent flow through the
    collapsing supraglottis. Characteristically worse with crying, feeding,
    agitation and supine positioning, all of which increase inspiratory effort or
    reduce the lumen further.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Inspiratory stridor
    term:
      id: HP:0005348
      label: Inspiratory stridor
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngomalacia is the most common cause of stridor in newborns, affecting
      45-75% of all infants with congenital stridor.
    explanation: >-
      Establishes stridor as the presenting phenotype and the disease's share of
      congenital stridor.
- name: Feeding difficulties
  category: Gastrointestinal
  description: >-
    Feeding-related symptoms are the clinical hinge of this disease. Their
    absence identifies infants who can be watched without intervention; their
    presence moves management to acid suppression, and their escalation to
    aspiration or failure to thrive moves it to surgery.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants with stridor who do not have significant feeding-related symptoms
      can be managed expectantly without intervention.
    explanation: >-
      Shows that feeding symptoms are the variable management is stratified on,
      which is why this phenotype carries the weight the description gives it.
- name: Aspiration
  category: Respiratory
  description: >-
    Usually silent, which is what makes it dangerous: it does not announce itself
    with coughing and is missed on clinical feeding assessment. In infants
    investigated for recurrent respiratory or feeding difficulty, 98% of detected
    aspiration was silent.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Aspiration
    term:
      id: HP:0002835
      label: Aspiration
  evidence:
  - reference: PMID:30589926
    reference_title: >-

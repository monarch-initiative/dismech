    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe laryngomalacia was established if complaints included severe feeding
      difﬁculties, failure to thrive, cyanosis or intercostal and/or xyphoidal
      retractions or endoscopy showed signiﬁcant dynamic airway obstruction.
    explanation: >-
      Names cyanosis among the criteria that define severe disease. The ligature
      in "difﬁculties" and "signiﬁcant" is an artifact of the cached PDF text and
      is preserved so the quote stays exact.
- name: Intercostal retractions
  category: Respiratory
  description: >-
    Indrawing of the chest wall, the visible sign of how hard the infant is
    working against the obstruction. Like cyanosis it is a formal severity
    criterion rather than an incidental observation.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Intercostal retractions
    term:
      id: HP:0030864
      label: Intercostal retractions
  evidence:
  - reference: PMID:26924742
    reference_title: >-
      Treatment outcome of supraglottoplasty vs. wait-and-see policy in patients
      with laryngomalacia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe laryngomalacia was established if complaints included severe feeding
      difﬁculties, failure to thrive, cyanosis or intercostal and/or xyphoidal
      retractions or endoscopy showed signiﬁcant dynamic airway obstruction.
    explanation: >-
      Names intercostal retractions among the criteria that define severe
      disease, in the same sentence that carries the other severity findings.
- name: Dyspnea
  category: Respiratory
  description: >-
    Increased work of breathing. Grouped in the literature with dysphagia,
    growth delay and obstructive sleep apnoea as the obstruction consequences
    that make an operation necessary in roughly one in ten infants.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  evidence:
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 10% of the cases it is necessary to operate, because the respiratory
      obstruction can cause severe dyspnea, dysphagia, growth delay and
      obstructive sleep apnea
    explanation: >-
      Names severe dyspnoea among the obstruction consequences that make surgery
      necessary, with the proportion of cases that reach that point.
- name: Obstructive sleep apnea
  category: Respiratory
  description: >-
    Sleep-related obstruction, grouped in the literature with the severe dyspnoea
    and growth delay that together define the roughly one in ten infants who need
    an operation. Distinct from isolated apnoeic episodes in that it is a
    sustained sleep-state phenomenon rather than an acute event.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  evidence:
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 10% of the cases it is necessary to operate, because the respiratory
      obstruction can cause severe dyspnea, dysphagia, growth delay and
      obstructive sleep apnea
    explanation: >-
      Names obstructive sleep apnoea among the severe consequences that make
      surgery necessary, and gives the proportion of cases that reach that point.
- name: Recurrent respiratory infections
  category: Respiratory
  description: >-
    Follow from repeated aspiration rather than from any immune defect, which is
    why the appropriate investigation is a swallow study rather than an immune
    workup.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:30589926
    reference_title: >-
      Evaluation of Aspiration in Infants With Laryngomalacia and Recurrent
      Respiratory and Feeding Difficulties.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Swallowing dysfunction and aspiration were commonly found in pediatric
      patients with laryngomalacia and recurrent feeding and/or respiratory
      issues; these children should undergo an MBS study for dysphagia and silent
      aspiration.
    explanation: >-
      Links recurrent respiratory problems to aspiration in this population.
      Marked INDIRECT because the study selected on recurrent respiratory issues
      rather than measuring their incidence.
prevalence:
- population: Infants with congenital stridor
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    45-75% of infants presenting with congenital stridor have laryngomalacia.
    This is the share of a symptomatic clinical denominator, not a rate in any
    population over any period. PrevalenceMeasureEnum has no value for a
    proportion-of-cases figure, so measure_type is UNKNOWN rather than
    PERIOD_PREVALENCE, which would assert a population denominator this number
    does not have.
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngomalacia is the most common cause of stridor in newborns, affecting
      45-75% of all infants with congenital stridor.
    explanation: >-
      Source of the proportion recorded here, with its denominator stated.
progression:
- phase: Presentation
  notes: >-
    Stridor appears in the early weeks of life and typically worsens over the
    first months as respiratory demand rises, before plateauing. Severity is
    stratified clinically by feeding symptoms rather than by the loudness of the
    stridor.
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spectrum of disease presentation, progression, and outcomes is varied.
      Identifying symptoms and patient factors that influence disease severity
      helps predict outcomes.
    explanation: >-
      Supports the variability of course and the role of symptom-based
      stratification in predicting it.
- phase: Spontaneous resolution
  notes: >-
    Most infants resolve without intervention. The mechanistic correlate is that
    the laryngeal adductor reflex threshold falls back to normal by around nine
    months, in step with symptoms - so resolution is maturation of the deficient
    function, not compensation for a persistent one.
  evidence:
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most symptoms resolved within 12 months of presentation.
    explanation: >-
      States the resolution timeframe in the cohort that also measured the reflex
      threshold, which is what lets the two be linked.
  - reference: PMID:17513991
    reference_title: >-
      Abnormal sensorimotor integrative function of the larynx in congenital
      laryngomalacia: a new theory of etiology.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensorimotor integrative function improved as symptoms resolved.
    explanation: >-
      Directly couples functional recovery to clinical resolution, which is the
      claim this phase makes.
- phase: Severe or persistent disease
  notes: >-
    A minority follow a different course. A second level of airway obstruction
    raises the risk of needing surgery about 4.5-fold, and synchronous airway
    lesions - present in around 40% in one surgical series - prolong symptoms
    substantially. Multiple medical comorbidities predict worse symptoms and
    worse surgical outcomes.
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of an additional level of airway obstruction worsens symptoms
      and has a 4.5x risk of requiring surgical intervention, usually
      supraglottoplasty.
    explanation: >-
      Quantifies the effect of a second obstruction level on the need for
      surgery.
  - reference: PMID:26924742
    reference_title: >-
      Treatment outcome of supraglottoplasty vs. wait-and-see policy in patients
      with laryngomalacia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Synchronous airway lesions (SALs) were present in 40.4 % of patients and
      were associated with prolonged symptoms of laryngomalacia (38.5 weeks vs.
      14.5, p = 0.043).
    explanation: >-
      Gives both the frequency of synchronous lesions and their effect on symptom
      duration.
treatments:
- name: Expectant Management
  description: >-
    The default, and an active choice rather than an absence of one. Infants with
    stridor but no significant feeding symptoms can be watched, because the
    underlying reflex deficit matures on its own. Choosing it correctly depends
    entirely on having excluded the feeding and aspiration features that identify
    the minority who will not resolve.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: expectant management with clinical observation
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants with stridor who do not have significant feeding-related symptoms
      can be managed expectantly without intervention.
    explanation: >-
      States the indication for expectant management and the feature that
      qualifies an infant for it.
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 10% of the cases it is necessary to operate, because the respiratory
      obstruction can cause severe dyspnea, dysphagia, growth delay and
      obstructive sleep apnea
    explanation: >-
      Quantifies the minority for whom expectant management is not enough, which
      is the number that makes watchful waiting the default rather than a gamble.
      Marked INDIRECT because the sentence states the operative rate and its
      indications rather than endorsing observation for the rest.
  target_mechanisms:
  - target: Immature Sensorimotor Integrative Function of the Larynx
    treatment_effect: MODULATES
    description: >-
      Nothing is done to the mechanism; the strategy relies on it resolving,
      which is the reflex threshold normalising with maturation. It is pointed at
      the trigger node because that is the node whose spontaneous recovery the
      strategy is betting on.
    evidence:
    - reference: PMID:17513991
      reference_title: >-
        Abnormal sensorimotor integrative function of the larynx in congenital
        laryngomalacia: a new theory of etiology.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sensorimotor integrative function improved as symptoms resolved.
      explanation: >-
        Supports that the trigger node resolves on its own. Marked INDIRECT
        because this is an observed natural history, not an effect of the
        management strategy.
  notes: >-
    Deliberately left unbound. NCIT's closest concept, NCIT:C15722 Patient
    Observation, is not reachable from NCIT:C25218 (Clinical Intervention or
    Procedure) and so is rejected by the TreatmentActionTerm enum - correctly,
    since watchful waiting is the decision not to intervene. No NCIT clinical
    action term expresses it, so preferred_term carries the meaning alone.
- name: Acid Suppression Therapy
  description: >-
    Proton pump inhibitors or H2 antagonists for infants with stridor plus
    feeding-related symptoms. It does not treat the tone deficit; it removes the
    oedema that is compounding the obstruction, which is why it improves symptoms
    without shortening the disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: acid suppression therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omeprazole
      term:
        id: CHEBI:7772
        label: omeprazole
    - preferred_term: proton pump inhibitor
      term:
        id: NCIT:C29723
        label: Proton Pump Inhibitor
  evidence:
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants with stridor and feeding-related symptoms benefit from acid
      suppression treatment.
    explanation: >-
      States the indication and the benefit, which is what this treatment
      records.
  target_mechanisms:
  - target: Reflux-Associated Supraglottic Oedema
    treatment_effect: INHIBITS
    description: >-
      Reducing gastric acid removes the chemical insult driving supraglottic
      oedema, so the aggravating arm of the pathograph is suppressed while the
      trigger node is left untouched.
    evidence:
    - reference: PMID:22518182
      reference_title: >-
        Laryngomalacia: disease presentation, spectrum, and management.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Those with gastroesophageal reflux and/or laryngopharyngeal reflux have
        symptom improvement from acid suppression therapy.
      explanation: >-
        Symptom improvement is consistent with reduced supraglottic oedema, but
        the oedema itself was not measured, so the mechanistic attribution is an
        inference.
- name: Tracheostomy
  description: >-
    Bypasses the supraglottis altogether. Rare - two of 89 patients in the cited
    series - and reserved for infants in whom supraglottoplasty is insufficient
    or unsafe. It is included because it marks the ceiling of the severity
    spectrum, not because it is a routine option.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  evidence:
  - reference: PMID:26924742
    reference_title: >-
      Treatment outcome of supraglottoplasty vs. wait-and-see policy in patients
      with laryngomalacia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients received a tracheostomy.
    explanation: >-
      Records that tracheostomy was used, and how rarely, in the same series that
      supplies this entry's supraglottoplasty outcome data.
  target_mechanisms:
  - target: Dynamic Supraglottic Airway Obstruction
    treatment_effect: BYPASSES
    description: >-
      An artificial airway below the collapsing segment. This genuinely is
      BYPASSES: the supraglottic mechanism continues to operate untouched and
      air is routed around it.
    evidence:
    - reference: PMID:26924742
      reference_title: >-
        Treatment outcome of supraglottoplasty vs. wait-and-see policy in
        patients with laryngomalacia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two patients received a tracheostomy.
      explanation: >-
        Supports that tracheostomy was used in this population. Marked INDIRECT
        because the anatomical rationale for the target is inferred from what a
        tracheostomy is, not stated in the source.
- name: Supraglottoplasty
  description: >-
    Endoscopic division of short aryepiglottic folds and trimming of redundant
    arytenoid mucosa. It does not correct the reflex deficit either; it removes
    the tissue that collapse depends on, so the same loss of tone no longer
    obstructs. Reserved for aspiration, failure to thrive, or the consequences of
    obstruction and hypoxia. In a comparative series it produced complete
    improvement in 5 weeks against 29 for watchful waiting.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: supraglottoplasty
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:26924742
    reference_title: >-
      Treatment outcome of supraglottoplasty vs. wait-and-see policy in patients
      with laryngomalacia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supraglottoplasty was found to lead to significantly faster complete
      improvement of laryngomalacia than wait-and-see policy (5 weeks vs. 29, p =
      0.026).
    explanation: >-
      Gives the comparative outcome against the alternative strategy, which is
      what makes this a decision rather than a default.
  - reference: PMID:22518182
    reference_title: >-
      Laryngomalacia: disease presentation, spectrum, and management.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those with severe enough disease to require supraglottoplasty will have
      minimal complications and good outcomes if multiple medical comorbidities
      are not present.
    explanation: >-
      Records the safety profile and the comorbidity caveat that qualifies it.
  target_mechanisms:
  - target: Predisposing Supraglottic Configuration
    treatment_effect: INHIBITS
    description: >-
      Surgery removes the anatomical substrate rather than restoring tone, so it
      acts on the predisposing configuration node and leaves the trigger node
      unchanged. Recorded as INHIBITS rather than BYPASSES: the operation
      abolishes the node it targets, where BYPASSES would imply routing around a
      mechanism that is still running.
    evidence:
    - reference: PMID:26924742
      reference_title: >-
        Treatment outcome of supraglottoplasty vs. wait-and-see policy in
        patients with laryngomalacia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Supraglottoplasty is safe and effective in treatment of severe
        laryngomalacia.
      explanation: >-
        Supports efficacy. Marked INDIRECT because attributing that efficacy to
        removal of the anatomical substrate specifically is an inference from
        what the operation does, not a measured mechanism.
diagnosis:
- name: Flexible nasolaryngoscopy
  description: >-
    The diagnostic test, performed awake so that collapse can be seen happening.
    Assessed against a defined set of features rather than a global impression,
    which is what makes it reproducible between examiners.
  evidence:
  - reference: PMID:18392498
    reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established by associating the clinical manifestations with
      laryngoscopic findings in a dynamic form.
    explanation: >-
      States that the diagnosis requires dynamic endoscopic findings alongside
      the clinical picture.
- name: Modified barium swallow study
  description: >-
    Indicated when there are recurrent respiratory or feeding difficulties.
    Because almost all the aspiration in this group is silent, a clinical feeding
    assessment cannot substitute for it.
  evidence:
  - reference: PMID:30589926
    reference_title: >-
      Evaluation of Aspiration in Infants With Laryngomalacia and Recurrent
      Respiratory and Feeding Difficulties.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these children should undergo an MBS study for dysphagia and silent
      aspiration
    explanation: >-
      The authors' recommendation, which is the indication recorded here.
differential_diagnoses:
- name: Tracheomalacia
  description: >-
    Produces expiratory rather than inspiratory noise, because the collapsing
    segment is intrathoracic. Commonly coexists with laryngomalacia as a
    synchronous airway lesion, which is why finding one does not exclude the
    other.
- name: Vocal cord paralysis
  description: >-
    Also causes inspiratory stridor in infancy, but with a weak or absent cry and
    immobile cords on awake endoscopy rather than supraglottic collapse.
- name: Subglottic stenosis
  description: >-
    Biphasic rather than purely inspiratory stridor, from a fixed narrowing below
    the cords that does not vary with respiratory effort.
- name: Laryngeal cleft
  description: >-
    Presents with aspiration and feeding difficulty and can coexist with
    laryngomalacia; it was independently associated with abnormal swallow studies
    in this population.
discussions:
- discussion_id: clm_reflux_causal_direction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does reflux worsen laryngomalacia, does laryngomalacia cause reflux by
    altering the thoraco-abdominal pressure gradient, or both?
  rationale: >-
    This is not an academic question: it determines whether acid suppression is
    treating a cause or a consequence, and acid suppression is given to a large
    fraction of these infants. The available evidence is co-occurrence, worse
    outcomes in those with reflux, and symptom improvement on treatment - none of
    which separates the directions. The entry models reflux as an aggravator
    rather than an upstream cause for that reason, and this discussion records
    that the choice is provisional.
  attaches_to:
  - pathophysiology#Reflux-Associated Supraglottic Oedema
- discussion_id: clm_anatomic_type_classification
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there a reproducible anatomic classification of laryngomalacia, and does
    the anatomic pattern predict severity, resolution, or surgical benefit?
  rationale: >-
    Numbered Type 1/2/3 schemes are in wide clinical use, but the sources
    consulted for this entry assign the numbers to different anatomy - one making
    Type 1 short aryepiglottic folds and another making it arytenoid prolapse.
    No numbered subtypes are asserted here as a result. The individual
    endoscopic features are reproducible between examiners; what is missing is
    evidence that grouping them into numbered types carries prognostic
    information.
  attaches_to:
  - pathophysiology#Predisposing Supraglottic Configuration
notes: >-
  Curated from a Perplexity deep-research report used as a lead only. The report
  carried reference_validation frontmatter reporting 5 references checked and all
  resolved, but that figure is misleading in isolation: the report cites 22
  sources, so only 5 of 22 were identifiers the validator could check at all.
  Three of the 22 were not citations in any form - entries 20, 21 and 22 of the
  citation list are a fragment of prose, the phrase "Poiseuille's law", and the
  bare string "Landry et al". The rest were web pages (Cleveland Clinic,
  UpToDate, StatPearls, GeekyMedics, teachmepaediatrics). Every claim retained
  here was re-anchored to a PMID, fetched into references_cache, and quoted from
  the fetched text. The report's ontology bindings were not reused; UBERON:0001737
  was offered as epiglottis when it is larynx, and the correct epiglottis term is
  UBERON:0000388.
review_notes: >-
  Two deliberate choices. Reflux is modelled as an aggravating node rather than
  an upstream cause, because the causal direction is disputed in the literature
  and modelling it upstream would predict a treatment effect on disease duration
  that the evidence does not show. And no numbered Type 1/2/3 subtypes are
  asserted, because the sources consulted assign those numbers to different
  anatomy; the individual endoscopic features are recorded as one predisposing
  node instead, with the classification question raised in discussions.

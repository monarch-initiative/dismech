genetic:
- name: RUBCN
  notes: >
    Biallelic loss-of-function variants in RUBCN (formerly KIAA0226; chromosome 3q28-qter)
    cause SCAR15. The recurrent Arab founder allele is a single-base frameshift deletion in
    exon 18/19 (NM_014687 c.2624delC, p.A875fs; originally reported as 2927delC,
    p.Ala943ValfsX146) that deletes the C-terminal diacylglycerol-binding / RH domain. A novel
    homozygous splice variant (c.2126+1G>A) has also been reported. Rubicon negatively
    regulates macroautophagy and localizes to Rab7 late endosomes.
  gene_term:
    preferred_term: RUBCN
    term:
      id: hgnc:28991
      label: RUBCN
  relationship_type: CAUSATIVE
  variants:
  - name: RUBCN c.2624delC (p.Ala875ValfsX146)
    description: >
      Recurrent Arab founder single-base frameshift deletion in RUBCN exon 18/19
      (NM_014687:c.2624delC, p.A875fs; the same allele reported in the original family as
      2927delC / p.Ala943ValfsX146 under earlier transcript/protein numbering). Truncates the
      C-terminal diacylglycerol-binding / RH domain; homozygous in the two reported Saudi families.
    type: frameshift
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:32450808
      reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autozygome and exome analysis showed both affected have previously reported homoallelic mutation in RUBCN (NM_014687:exon18:c.2624delC:p.A875fs), whereas the parents are carriers."
      explanation: Establishes the homozygous founder frameshift allele in a second family.
  - name: RUBCN c.2126+1G>A (splice donor)
    description: >
      Novel homozygous splice-donor variant abolishing the exon 14/intron 14 consensus donor
      site; produces frameshifted alternative transcripts and a truncated protein lacking the RH
      domain. First RUBCN splice variant, reported in a patient with epileptic encephalopathy.
    type: splice site
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:39520129
      reference_title: "A second RUBCN variant associated with epileptic encephalopathy and neurodevelopmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A functional study of the RNA revealed that this variant completely abolishes the consensus donor site at the exon 14/intron 14 junction, resulting in the absence of expression of the reference transcript."
      explanation: Functional RNA study establishes the splice-donor loss-of-function effect.
  evidence:
  - reference: PMID:20826435
    reference_title: "Rundataxin, a novel protein with RUN and diacylglycerol binding domains, is mutant in a new recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening of all coding sequences revealed a single nucleotide deletion, 2927delC, in exon 19 of the KIAA0226 gene, which results in a frame shift of the C-terminal domain (p.Ala943ValfsX146)."
    explanation: Identifies the causative KIAA0226 (RUBCN) truncating frameshift variant.
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autozygome and exome analysis showed both affected have previously reported homoallelic mutation in RUBCN (NM_014687:exon18:c.2624delC:p.A875fs), whereas the parents are carriers."
    explanation: Confirms the recurrent homozygous RUBCN founder mutation in a second family.

diagnosis:
- name: Molecular Genetic Testing
  description: >
    Diagnosis is established by identifying biallelic pathogenic RUBCN variants, typically
    through exome sequencing combined with autozygosity (autozygome) mapping in consanguineous
    families; targeted testing for the recurrent Arab founder allele is informative in that
    population. Nerve conduction studies are normal, helping distinguish SCAR15 from recessive
    ataxias with peripheral neuropathy.
  evidence:
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autozygome and exome analysis showed both affected have previously reported homoallelic mutation in RUBCN (NM_014687:exon18:c.2624delC:p.A875fs), whereas the parents are carriers."
    explanation: Molecular diagnosis is achieved by autozygome/exome analysis identifying biallelic RUBCN variants.
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies were normal in both patients."
    explanation: Normal nerve conduction studies help distinguish SCAR15 from recessive ataxias with peripheral neuropathy.

progression:
- age_range: childhood onset
  notes: >
    Slowly progressive (near-stationary in some) cerebellar course. Onset is in early childhood,
    usually as unsteadiness when learning to walk; independent walking is preserved but limited
    into the teens. Reported disability stage ranges from 0 to 3 of 7 across patients. Early brain
    MRI can be normal, with mild superior vermian / cerebellar atrophy emerging with age.
  evidence:
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings validate the slowly progressive phenotype of Salih ataxia"
    explanation: Confirms the slowly progressive course across two families.

differential_diagnoses:
- name: Autosomal dominant spinocerebellar ataxia 15/16 (ITPR1)
  description: >
    Autosomal dominant, ITPR1-related, predominantly pure cerebellar ataxia. This is the
    recurrent name collision the NEC preflight guards against — distinguished by dominant
    inheritance, the ITPR1 gene, and the absence of the epilepsy / intellectual-disability triad.
  distinguishing_features:
  - Autosomal dominant inheritance (heterozygous ITPR1 loss-of-function / deletion)
  - Predominantly pure cerebellar ataxia without prominent epilepsy or intellectual disability
- name: Autosomal recessive spinocerebellar ataxia 17 (CWF19L1)
  description: >
    CWF19L1-related recessive cerebellar ataxia with intellectual disability. Genomically and
    clinically adjacent to SCAR15; distinguished by the causal gene (CWF19L1 vs RUBCN).
  distinguishing_features:
  - Biallelic CWF19L1 variants rather than RUBCN
- name: Other recessive cerebellar ataxias with epilepsy and intellectual disability
  description: >
    Broad differential of recessive ataxia-epilepsy-ID syndromes (e.g. Friedreich ataxia, ataxia
    with vitamin E deficiency, ataxia-telangiectasia, ARSACS, SCAN1), distinguished by additional
    system involvement.
  evidence:
  - reference: PMID:32450808

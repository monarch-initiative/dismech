name: Autosomal Recessive Spinocerebellar Ataxia 15
creation_date: "2026-08-05T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive spinocerebellar ataxia 15
  term:
    id: MONDO:0014311
    label: autosomal recessive spinocerebellar ataxia 15
description: >
  Autosomal recessive spinocerebellar ataxia 15 (SCAR15; OMIM 615705), also called Salih
  ataxia and, in MONDO, the RUBCN autosomal recessive cerebellar ataxia-epilepsy-intellectual
  disability syndrome, is a rare childhood-onset neurodevelopmental and neurodegenerative
  disorder caused by biallelic loss-of-function variants in RUBCN (formerly KIAA0226), the
  gene encoding Rubicon (originally named "rundataxin"). It was first defined in a large
  consanguineous Saudi Arabian family and subsequently confirmed by an ancient founder
  mutation shared across unrelated Arab families. The core clinical picture is early-onset,
  slowly progressive (or relatively non-progressive) gait and limb ataxia with dysarthria,
  intellectual disability / delayed psychomotor development, and epilepsy; brain MRI shows
  variable, often mild superior vermian / cerebellar atrophy. Rubicon is a negative regulator
  of macroautophagy and of LC3-associated phagocytosis that localizes to Rab7-positive late
  endosomes and lysosomes; disease-causing truncations delete its C-terminal
  diacylglycerol-binding / Rubicon Homology (RH) domain and mislocalize the protein,
  dysregulating autophagic and endolysosomal trafficking in neurons. The phenotypic spectrum
  has since been broadened to include dystonia and a childhood-onset epileptic encephalopathy.

inheritance:
- name: Autosomal recessive inheritance
  description: >
    SCAR15 is inherited in an autosomal recessive manner. It was originally mapped by linkage /
    homozygosity mapping in a consanguineous Saudi Arabian pedigree, with affected individuals
    homozygous for a truncating RUBCN (KIAA0226) frameshift variant that cosegregated with
    disease; unaffected parents are heterozygous carriers. A shared ancient founder haplotype
    underlies the recurrent mutation in the Arabian Peninsula.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20826435
    reference_title: "Rundataxin, a novel protein with RUN and diacylglycerol binding domains, is mutant in a new recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a novel form of recessive ataxia that segregates in three children of a large consanguineous Saudi Arabian family."
    explanation: Establishes autosomal recessive inheritance segregating in a consanguineous pedigree.
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autozygome and exome analysis showed both affected have previously reported homoallelic mutation in RUBCN (NM_014687:exon18:c.2624delC:p.A875fs), whereas the parents are carriers."
    explanation: Affected individuals are homozygous and parents are heterozygous carriers, consistent with autosomal recessive inheritance.

pathophysiology:
- name: RUBCN (Rubicon) Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic truncating variants in RUBCN abolish or truncate Rubicon (rundataxin), a protein
    with an N-terminal RUN domain and a C-terminal diacylglycerol-binding-like / Rubicon
    Homology (RH) domain that assembles with the Beclin-1 / class III PI3K (VPS34) complex.
    Rubicon's principal function is to negatively regulate macroautophagy (and LC3-associated
    phagocytosis). The recurrent founder allele is an exon 18/19 single-base deletion
    (c.2624delC / historically 2927delC; p.Ala875ValfsX146 / p.Ala943ValfsX146) that frameshifts
    and deletes the C-terminal domain.
  biological_processes:
  - preferred_term: negative regulation of macroautophagy
    term:
      id: GO:0010507
      label: negative regulation of autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:20826435
    reference_title: "Rundataxin, a novel protein with RUN and diacylglycerol binding domains, is mutant in a new recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The KIAA0226 gene encodes a protein that we named rundataxin, with two conserved domains: an N-terminal RUN domain and a C-terminal domain containing a diacylglycerol binding-like motif."
    explanation: Identifies the causative gene and the domain architecture of the encoded protein.
  - reference: PMID:39520129
    reference_title: "A second RUBCN variant associated with epileptic encephalopathy and neurodevelopmental delay."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The RUBCN gene encodes a widely expressed protein called Rubicon, the main function of which is to negatively regulate macroautophagy."
    explanation: Background statement of Rubicon's principal molecular function (review/background prose, not a human clinical observation).
  downstream:
  - target: Impaired Rubicon Endolysosomal Localization
    description: >-
      Deletion of the C-terminal diacylglycerol-binding / RH domain mislocalizes Rubicon away
      from Rab7-positive late endosomes.

- name: Impaired Rubicon Endolysosomal Localization
  biological_scale: CELLULAR
  description: >
    Wild-type Rubicon colocalizes with the late-endosome GTPase Rab7 and with the lysosomal
    marker LAMP1. The Salih-ataxia truncation, which removes the diacylglycerol-binding-like /
    RH domain, causes a diffuse cytosolic redistribution and loss of late-endosomal
    localization, establishing pathogenicity and linking the disorder to endosomal/lysosomal
    machinery rather than to the mitochondrial or nuclear pathways of other recessive ataxias.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: late endosome to lysosome transport
    term:
      id: GO:1902774
      label: late endosome to lysosome transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23728897
    reference_title: "The Salih ataxia mutation impairs Rubicon endosomal localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that Rubicon colocalizes with the late endosome marker Rab7 and demonstrate that it also colocalizes with LampI at lysosomes."
    explanation: Localizes Rubicon to Rab7 late endosomes and LAMP1 lysosomes in cultured cells.
  - reference: PMID:23728897
    reference_title: "The Salih ataxia mutation impairs Rubicon endosomal localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Salih ataxia mutation leads to a diffuse cytosolic distribution and mislocalized protein from the late endosomes, indicating that deletion of the diacylglycerol binding-like motif in the mutant protein interferes with normal Rubicon subcellular localization and confirming the pathogenicity of the mutation."
    explanation: The truncating mutation mislocalizes Rubicon from late endosomes, demonstrating the pathogenic cellular mechanism.
  - reference: PMID:39520129
    reference_title: "A second RUBCN variant associated with epileptic encephalopathy and neurodevelopmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This variant is responsible for the deletion of the highly conserved Rubicon Homology (RH) domain, which is important for the colocalization of Rubicon with Rab7 in the late endosome."
    explanation: Independently implicates loss of the RH domain and Rab7 late-endosomal colocalization in a second RUBCN allele.
  downstream:
  - target: Dysregulated Autophagy and Endolysosomal Trafficking
    description: >-
      Mislocalized Rubicon dysregulates autophagosome maturation and endolysosomal trafficking.

- name: Dysregulated Autophagy and Endolysosomal Trafficking
  biological_scale: CELLULAR
  description: >
    Loss of correctly localized Rubicon perturbs the late (maturation) step of autophagy and
    endosome-to-lysosome trafficking, impairing neuronal protein and organelle quality control.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: ABNORMAL
  - preferred_term: autophagosome maturation
    term:
      id: GO:0097352
      label: autophagosome maturation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39520129
    reference_title: "A second RUBCN variant associated with epileptic encephalopathy and neurodevelopmental delay."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The resulting truncated protein lacks the RH domain, which may lead to defective endosomal trafficking as previously described."
    explanation: Mechanistic inference (not a direct observation) that RH-domain loss leads to defective endosomal trafficking; the paper's own functional work is RNA/in-vitro.
  downstream:
  - target: Cerebellar Neurodegeneration
    description: >-
      Chronic autophagic-endolysosomal dysfunction contributes to cerebellar neuronal loss.

- name: Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >
    Cerebellar (predominantly superior vermian) atrophy on MRI underlies the gait/limb ataxia,
    dysarthria, and oculomotor signs. Atrophy is often subtle and may be absent early,
    consistent with the slowly progressive course. Purkinje cells are the presumptively
    vulnerable cerebellar cortical neuron on mechanistic grounds; direct evidence of
    Purkinje-cell loss in SCAR15 tissue has not been reported, so this cell-type attribution
    is an inference from the imaging phenotype rather than a documented histopathological
    finding.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:32450808
    reference_title: "Ancient founder mutation in RUBCN: a second unrelated family confirms Salih ataxia (SCAR15)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed normal cerebellar volume and folia in the older sibling at the age of 6 years, and revealed minimal superior vermian atrophy at the age of 16 years."
    explanation: Documents progressive superior vermian (cerebellar) atrophy on neuroimaging.


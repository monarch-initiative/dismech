- name: Prophylactic Aortic Surgery
  description: >
    Elective replacement of the ascending aorta in individuals reaching an
    indexed size threshold, undertaken before dissection rather than in
    response to it. It is the only intervention that acts on the syndrome's
    leading cause of avoidable sudden death.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:

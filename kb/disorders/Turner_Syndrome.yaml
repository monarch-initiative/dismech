discussions:
- discussion_id: gap_unassigned_escape_genes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Which X-inactivation escape and pseudoautosomal genes, beyond SHOX, account
    for the gonadal, cardiovascular, renal, auditory and autoimmune arms of
    Turner syndrome?
  rationale: >
    This is the central unresolved question of the disease rather than a loose
    end. The canonical model attributes every arm of the syndrome to
    haploinsufficiency of escape genes, but only one gene-to-phenotype
    assignment has been made — SHOX to stature and the mesomelic skeleton — and
    the field states explicitly that SHOX does not explain most Turner
    anomalies. Consequently the edges from the escape-gene node to the ovarian
    and lymphatic arms in this entry are curated as INDIRECT, because naming
    them DIRECT would assert a gene-level mechanism nobody has identified. The
    gap has practical weight: without the responsible genes there is no
    molecular target for the non-growth arms, which is why growth hormone and
    estrogen — one pharmacological, one replacement — remain the only
    mechanism-linked therapies in a multisystem disease.
  attaches_to:
  - pathophysiology#Haploinsufficiency of Pseudoautosomal and X-Inactivation Escape Genes
  evidence:
  - reference: PMID:21925981
    reference_title: "The role of the SHOX gene in the pathophysiology of Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the inheritance of only one copy of the SHOX gene does not explain most of TS anomalies, more studies are needed to explain them."
    explanation: States the gap directly — SHOX dosage leaves most of the syndrome unexplained.
  - reference: PMID:38124119
    reference_title: "Competing endogenous RNA network analysis of Turner syndrome patient-specific iPSC-derived cardiomyocytes reveals dysregulation of autosomal heart development genes by altered dosages of X-inactivation escaping non-coding RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "How loss of one X chromosome drive these conditions remains largely unknown."
    explanation: Independent restatement of the gap from the molecular side.
  proposed_experiments:
  - experiment_id: exp_ts_escape_gene_dosage_mapping
    name: Systematic escape-gene dosage mapping against organ-specific Turner phenotypes
    description: >
      Extend the partial-Xp deletion mapping strategy that localised the
      neurocognitive phenotype to PAR1 across the remaining organ arms, using
      contemporary cohorts of individuals with structurally abnormal X
      chromosomes and defined breakpoints, phenotyped for gonadal reserve,
      cardiac malformation, renal structure and audiometry. The design's
      strength is that it is the same human-genetics logic already shown to work
      here, rather than an animal model whose fidelity to human X-dosage biology
      would itself need establishing.
- discussion_id: gap_lymphatic_versus_dosage_origin_of_cardiac_defect
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Is the left-heart obstructive lesion of Turner syndrome caused by the fetal
    lymphatic defect through a hemodynamic mechanism, or are the two parallel
    consequences of the same gene-dosage lesion?
  rationale: >
    The two accounts predict the same epidemiology — neck web and coarctation
    co-occur — and are therefore not separated by the association data that
    motivated the hemodynamic model. The distinction matters because it decides
    whether the cardiac phenotype is in principle preventable by anything acting
    on lymphatic development, or whether it is an independent dosage effect that
    a lymphatic intervention could never touch. This entry does not resolve it:
    the hemodynamic chain is confined to a named ALTERNATIVE hypothesis group,
    and the corresponding edge is typed INDIRECT so no node asserts it as
    settled mechanism.
  attaches_to:
  - pathophysiology#Fetal Jugular Lymphatic Sac Obstruction and Lymphatic Network Dysplasia
  - pathophysiology#Left-Sided Cardiac Outflow Tract Malformation
  evidence:
  - reference: PMID:6463900
    reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The following hypothesis is proposed to explain the association."
    explanation: >
      The source's own framing — a hypothesis proposed to explain an
      association — which is why the mechanism is not curated as established.
- discussion_id: note_module_conformance_withheld
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Should the Turner aortopathy node conform to aortopathy_tgfbeta_dysregulation,
    and should the osteoporosis phenotype conform to
    osteoporosis_bone_resorption?
  rationale: >
    Both conformances are superficially attractive and are deliberately withheld
    rather than silently omitted. Turner aortopathy is a genuine heritable
    thoracic aortic disease, but the module's defining claim is paradoxically
    increased TGF-beta signalling downstream of an ECM or contractile-apparatus
    lesion, and no evidence curated in this entry establishes that mechanism in
    Turner syndrome — the aortopathy here is documented at the level of valve
    morphology, calibre and dissection risk. Similarly, the osteoporosis module
    turns on RANKL-driven osteoclastogenesis, whereas the evidence available
    here establishes only that bone mineral density is low and improves with
    estrogen replacement, which is consistent with that mechanism but does not
    demonstrate it. Declaring either conformance would import mechanistic claims
    this entry cannot support; a curator with the relevant primary literature
    should revisit both.
  attaches_to:
  - pathophysiology#Turner Aortopathy and Aortic Dissection
notes: >
  Scoping. This entry models Turner syndrome as the union of karyotypes under
  MONDO:0019499 — non-mosaic 45,X, mosaic 45,X/46,XX, and structural X
  abnormalities — rather than splitting them into separate entries. The three
  narrower MONDO terms are carried as narrowMatch mappings so a future split
  remains possible. The lumping decision is defensible because the mechanism is
  shared (dosage loss of escape and pseudoautosomal genes) and karyotype acts as
  a severity modifier rather than a mechanism switch: renal malformation is
  markedly commoner in non-mosaic 45,X than in mosaic or structural forms, and
  the sensorineural hearing loss progresses faster in 45,X, but neither is a
  different process. Where a cited figure is karyotype-specific it is recorded
  as such rather than generalised.

  Evidence discipline. Every snippet in this entry is an exact quote from the
  cited abstract. Three judgement calls are worth flagging for a reviewer.
  First, the two skeletal dysmorphism phenotypes (cubitus valgus, Madelung
  deformity) are marked PARTIAL because the cached sources support "skeletal
  abnormality attributable to SHOX dosage" as a class and support the shared
  aetiology with Léri-Weill dyschondrosteosis, but do not name these deformities
  in Turner syndrome in the quotable text; the alternative was to drop
  well-established clinical features entirely. Second, the autoimmune
  thyroiditis frequency is set to OCCASIONAL from the pooled point estimate of
  21.61%, even though the reported confidence interval crosses into the FREQUENT
  band at 30.37%. Third, no deep-research provider report was generated for this
  entry; the fourteen references were read directly from PubMed abstracts, and
  the entry should be read as a first-pass curation of the well-established
  mechanism rather than an exhaustive synthesis.

  What is deliberately absent. There is no `conforms_to` declaration anywhere in
  this entry. Two candidate module conformances were considered and rejected on
  evidence grounds, and the reasoning is recorded as an open discussion
  (note_module_conformance_withheld) rather than left to be inferred from the
  omission. Type 1 and type 2 diabetes, celiac disease and alopecia areata are
  all documented comorbidities with quantitative pooled prevalences available in
  PMID:41243107, and are not curated as phenotypes here only because the
  mechanism linking X monosomy to autoimmunity is unknown, so they would be
  association without pathway; the autoimmune arm is represented by the single
  best-evidenced member. Fertility preservation by ovarian tissue or oocyte
  cryopreservation is discussed in the cited literature as an emerging option
  but is not curated as a treatment because the cited source is explicitly an
  opinion paper proposing it rather than reporting outcomes.

- name: Progressive Aortic Dilation
  role: effector
  biological_scale: TISSUE
  description: >
    The chronic, silent, measurable state: an ascending aorta enlarging over
    years. It is held separate from the acute dissection event downstream of it
    because the two differ in everything that matters clinically — time course,
    detectability, and above all treatment join point. Dilation is what
    surveillance imaging measures and what antihypertensive therapy and elective
    surgery are aimed at; dissection is the event those measures exist to
    prevent. The decisive feature of the dilation is one of calibration rather
    than biology: it becomes dangerous at absolute diameters that are
    unremarkable in an average-height adult, which is why surveillance is
    indexed to body surface area and why an aortic size index above 2.5 cm/m2
    triggers surgical consideration.
  evidence:
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with Turner syndrome who are >18 years of age with an ascending aortic size index >2.5 cm/m(2) should be considered for an aortic operation to prevent aortic dissection."
    explanation: Gives the indexed threshold that operationalises this node clinically.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dilation of the aorta, brachiocephalic and carotid arteries may be present even in the absence of structural heart disease, consistent with an underlying generalized arteriopathy."
    explanation: >
      Supports dilation as a state of the vessel wall in its own right — present
      even without a structural cardiac lesion — rather than purely as a
      downstream consequence of the malformed outflow tract.
  downstream:
  - target: Aortic Dissection and Rupture
    causal_link_type: DIRECT
    description: >
      A dilated ascending aorta is the substrate on which dissection occurs;
      the dilation is progressive and the dissection is the discrete event that
      terminates it.
    evidence:
    - reference: PMID:23032325
      reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Aortic dissection in Turner syndrome occurs in young individuals at smaller aortic diameters than in the general population or other forms of genetically triggered aortopathy."
      explanation: >
        Establishes that diameter is a risk substrate requiring Turner-specific
        calibration: dissection occurs at smaller calibres than in comparator
        aortopathies, without implying that every dissection requires marked
        antecedent dilation.

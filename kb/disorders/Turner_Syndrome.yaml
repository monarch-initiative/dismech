  description: >
    Selective impairment of visuospatial and perceptual processing with
    preserved verbal ability, mapped to PAR1 haploinsufficiency.
  phenotype_term:
    preferred_term: Impaired visuospatial constructive cognition
    term:
      id: HP:0010794
      label: Impaired visuospatial constructive cognition
  evidence:
  - reference: PMID:10931762
    reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome (TS) is associated with a characteristic neurocognitive profile that includes impaired visuospatial/perceptual abilities."
    explanation: States the cognitive phenotype.
- category: Skeletal
  name: Osteoporosis
  description: >
    Reduced bone mineral density, driven substantially by estrogen deficiency
    from the age at which peak bone mass would normally accrue — hence its
    responsiveness to timely hormone replacement.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is estimated that 23.8% of adults with TS have osteoporosis"
    explanation: >
      Direct adult prevalence support for the HPO Occasional (5-29%) band.
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
    explanation: Lists osteoporosis among the syndrome's associated disorders.
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the improvement of bone mineral density; normal uterine growth"
    explanation: Supports the estrogen-dependence of the bone deficit via its correction.
biochemical:
- name: Elevated follicle-stimulating hormone (FSH)
  presence: INCREASED
  context: >
    FSH is the operative marker of the hypergonadotropic state. Its trajectory
    is biphasic rather than monotonic — high in infancy, normal through
    mid-childhood, rising again peripubertally — which is why the guideline
    specifies an age window (8-9 years, then annually) rather than a single
    measurement, and why a normal value in mid-childhood carries no
    reassurance.
  biomarker_term:
    preferred_term: follicle-stimulating hormone
    term:
      id: NCIT:C181076
      label: Follicle-Stimulating Hormone
  readouts:
  - target: Hypergonadotropic Hypogonadism and Estrogen Deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      A rising FSH without pubertal signs is the biochemical definition of the
      hypergonadotropic state this node represents, and is the trigger for
      hormone replacement.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "If gonadotropins (FSH in particular) in repeated samples (two or more) measured yearly from age 8-9 years are clearly elevated without any pubertal signs on physical exam, the girl with TS will need HRT."
      explanation: Makes the elevated gonadotropin the operational readout of gonadal failure.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Circulating concentrations of both FSH and LH present a biphasic pattern in TS individuals with hypogonadism: elevated after birth, declining to values similar to girls with normal ovarian function during mid-childhood, and rising again in the peripubertal years, or at the time of loss of ovarian function."
    explanation: Documents both the elevation and the biphasic trajectory that shapes when it is measured.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend measuring luteinizing hormone (LH), follicle stimulating hormone (FSH) and anti-Müllerian hormone (AMH) at 8-9 years and yearly until 11-12 years to enable timely referral for fertility preservation if appropriate"
    explanation: Gives the guideline-specified measurement schedule.
- name: Elevated luteinizing hormone (LH)
  presence: INCREASED
  context: >
    LH rises with FSH as pituitary feedback is released, and is measured
    alongside it. FSH is the more informative of the pair in this setting, so LH
    is curated as a co-marker rather than as an independent trigger for
    treatment.
  biomarker_term:
    preferred_term: luteinizing hormone
    term:
      id: NCIT:C190789
      label: Luteinizing Hormone
  readouts:
  - target: Hypergonadotropic Hypogonadism and Estrogen Deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Elevated LH reports the same loss of gonadal negative feedback as FSH.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LH and FSH are basic markers in the assessment of ovarian function."
      explanation: States the role of both gonadotropins as markers of the ovarian state.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Circulating concentrations of both FSH and LH present a biphasic pattern in TS individuals with hypogonadism: elevated after birth, declining to values similar to girls with normal ovarian function during mid-childhood, and rising again in the peripubertal years, or at the time of loss of ovarian function."
    explanation: Documents the LH elevation and its time course.
- name: Low anti-Müllerian hormone (AMH)
  presence: DECREASED
  context: >
    AMH reports the primordial follicle pool, so it measures the upstream
    attrition node rather than the downstream endocrine state — which is what
    makes it the fertility-preservation marker rather than the
    hormone-replacement marker. The guideline is unusually explicit about its
    limits: single values vary within an individual and across assays, and its
    predictive value in younger children is uncertain, so serial rather than
    isolated measurement is recommended.
  biomarker_term:
    preferred_term: anti-Müllerian hormone
    term:
      id: NCIT:C101737
      label: Muellerian-Inhibiting Factor
  readouts:
  - target: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: PROGNOSTIC
    interpretation: >
      A falling AMH tracks depletion of the follicle pool, which is the process
      this node represents; it is used prognostically to time fertility
      preservation before the reserve is gone.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "AMH reflects the primordial follicle pool and predicts the reproductive lifespan of women as a key biomarker of ovarian reserve."
      explanation: Establishes AMH as a readout of the follicular reserve rather than of gonadal endocrine output.
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In individuals with TS, AMH is associated with clinical features of ovarian reserve"
      explanation: Confirms the association holds specifically in Turner syndrome rather than only in the general population.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low AMH and undetectable inhibin B can also be used to predict ovarian insufficiency in TS, and we recommend measuring AMH along with FSH and LH during assessments."
    explanation: States the direction of the abnormality and its predictive use.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated AMH measurements are influenced by several factors, including age and pubertal stage, with known intra-individual variability and variation in test accuracy. The utility of AMH to predict ovarian reserve in younger age groups is uncertain"
    explanation: >
      Marked PARTIAL: the guideline qualifies its own recommendation, and the
      caveat is retained so the marker is not read as a settled quantitative test.
  notes: >
    A measurable AMH is one of the features that distinguishes mosaic from
    non-mosaic karyotypes, consistent with the entry's treatment of karyotype as
    a severity modifier of the ovarian arm.
diagnosis:
- name: Karyotype Analysis
  description: >
    Definitive diagnosis rests on demonstrating complete or partial absence of a
    second sex chromosome. Because mosaicism is common and can be
    tissue-limited, a normal peripheral-blood karyotype does not exclude the
    diagnosis in a clinically suspicious case — which is why the guideline
    specifies a minimum of 30 metaphases rather than a standard count, and why a
    normal blood result in a phenotypically suspicious individual is followed by
    analysis of a second tissue.
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is a rare condition in women that is associated with either complete or partial loss of one X chromosome, often in mosaic karyotypes."
    explanation: >
      Establishes what the test must demonstrate, and that mosaic karyotypes are
      frequent enough to shape the testing strategy.
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite an often conspicuous phenotype, the diagnostic delay can be substantial and the average age at diagnosis is around 15 years of age."
    explanation: >
      Motivates the diagnostic step: the phenotype alone is repeatedly missed
      for a decade and a half on average.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When testing for TS, we recommend that a minimum of 30 metaphases be counted on a chromosome analysis as the first-line test."
    explanation: >
      Gives the metaphase minimum, which exists because low-level mosaicism is
      missed at conventional counts.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if blood karyotype reveals 46,XX, but there is a high clinical suspicion of TS based on the phenotype, karyotyping or FISH analysis of a second tissue (eg, skin, buccal epithelium, urine) is indicated."
    explanation: States the second-tissue strategy that follows from tissue-limited mosaicism.
- name: Y Chromosomal Material Screening
  description: >
    Molecular screening for Y-chromosome material in individuals with a 45,X
    karyotype and signs of virilization. This is a mechanism with a surveillance
    consequence rather than a diagnostic refinement: retained Y material in a
    dysgenetic gonad carries a gonadoblastoma and dysgerminoma risk, and the
    finding opens an individualised discussion about gonadectomy weighed against
    residual gonadal function and fertility.
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend screening for Y chromosomal material by PCR or other molecular method in TS individuals with a 45,X karyotype and signs of virilization"
    explanation: States the screening indication and the methods used.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend individualized decision-making about gonadectomy/salpingo-oophorectomy in girls and women with TS and Y chromosome material identified on standard karyotyping or FISH analysis."
    explanation: >
      Gives the clinical consequence of a positive result, which is what makes
      this screening step worth curating separately from the diagnostic karyotype.
  notes: >
    The diagnosis_term reuses NCIT:C16768 (Karyotyping) because NCIT has no
    distinct clinical-action term for targeted Y-material molecular screening.
    The description carries the specificity the ontology term cannot.
- name: Cardiac Magnetic Resonance Imaging
  description: >
    Cross-sectional imaging of the thoracic aorta and arch, recommended in
    addition to or instead of screening echocardiography in every newly
    diagnosed adolescent or adult. It is curated separately from
    echocardiography because it is the modality that visualises the segments
    echocardiography cannot, and so is the diagnostic join point for the
    aortopathy arm.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMR should be performed, in addition to or instead of initial screening echocardiography, in all adolescents and adults newly diagnosed with TS."
    explanation: States the recommendation and its scope.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that cardiovascular imaging, ideally CMR or CT, should be performed at least once within 2 years before planned pregnancy or assisted reproductive methods"
    explanation: >
      Gives the second, pre-pregnancy indication, which is where the aortopathy
      and reproductive arms of the disease intersect.
- name: Cardiovascular Imaging Surveillance
  description: >
    Echocardiographic and cross-sectional imaging of the valve and thoracic
    aorta, indexed to body surface area rather than read against absolute adult
    diameters. The indexing is the point — an ascending aortic size index above
    2.5 cm/m2 in an adult is the threshold at which surgery is considered,
    a diameter that would be unremarkable if judged in centimetres alone.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with Turner syndrome who are >18 years of age with an ascending aortic size index >2.5 cm/m(2) should be considered for an aortic operation to prevent aortic dissection."
    explanation: Gives the indexed surveillance threshold this diagnostic step exists to detect.
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half (13/19, 68%) came to medical attention >24 hours after the onset of symptoms."
    explanation: >
      Supports surveillance rather than symptom-triggered presentation as the
      viable detection route, given the observed delay once dissection occurs.
- name: Renal Ultrasonography at Diagnosis
  description: >
    Structural renal malformation is present in over a third of cases and is
    largely asymptomatic, so imaging is done at diagnosis rather than in
    response to symptoms.
  diagnosis_term:
    preferred_term: renal ultrasonography
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:11045397
    reference_title: "Frequency of renal malformations in Turner syndrome: analysis of 82 Turkish children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 82 patients, 31 had different renal malformations (37.8%)."
    explanation: Gives the yield that justifies screening every newly diagnosed individual.
  - reference: PMID:11045397
    reference_title: "Frequency of renal malformations in Turner syndrome: analysis of 82 Turkish children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that all forms of TS should have routine nephrological screening on diagnosis"
    explanation: States the screening recommendation directly.
- name: Audiological Surveillance
  description: >
    Repeated audiometry, because the sensorineural loss is progressive with age
    and is not predicted by the childhood history of middle-ear infection. The
    guideline sets an explicit lifelong cadence — every 2-3 years through
    childhood and adolescence, every 5 years in adulthood — which is what
    distinguishes surveillance from symptom-triggered testing here.
  diagnosis_term:
    preferred_term: audiometric evaluation
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend newborn hearing screening be completed, and if this is normal, age-appropriate behavioral audiometric evaluation be conducted every 2-3 years in childhood and adolescence starting as soon as developmentally able (1-2 years of age), every 5 years in adults, and any time decreased hearing is suspected"
    explanation: Gives the surveillance cadence across the lifespan.
  - reference: PMID:17095347
    reference_title: "Hearing loss in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the increase in hearing threshold at high frequencies was shown to depend on karyotype and aging, regular otological examination is important for the determination of proper treatment."
    explanation: States the recommendation and the reason it must be repeated over time.
- name: Thyroid Function Surveillance
  description: >
    Measurement of TSH every 1-2 years from age two through adulthood, with
    additional testing when symptoms arise and thyroid antibodies checked when
    TSH is elevated. This monitors the treatable functional endpoint rather than
    screening asymptomatic individuals for antibodies that do not change care.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend screening for hypothyroidism with measurement of TSH every 1-2 years starting at 2 years of age and continuing through adulthood, and with new symptoms."
    explanation: Gives the lifelong age and interval for thyroid surveillance.
- name: Diabetes Surveillance
  description: >
    Hemoglobin A1c or fasting glucose every 1-2 years beginning at age 10-12,
    earlier if symptoms occur. Diabetes autoantibodies are assessed after a
    diabetes diagnosis because both type 1 and type 2 disease occur and can be
    difficult to distinguish in Turner syndrome.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend screening for diabetes with measurement of hemoglobin A1c or fasting glucose every 1-2 years starting at age 10-12 years or sooner with symptoms of diabetes"
    explanation: Gives the recommended tests, starting age, and interval.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend assessment of diabetes autoantibodies at diagnosis of diabetes in girls and women with TS to determine the type of diabetes as it is not easy to differentiate Type 1 and Type 2 diabetes in this population"
    explanation: Explains the post-diagnosis typing step.
- name: Liver Biochemistry Surveillance
  description: >
    Liver enzymes are measured in childhood and every 1-2 years from age ten
    onward. Persistent abnormalities prompt reassessment and specialist workup;
    they are not, by themselves, a reason to stop hormone replacement.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend measuring liver enzymes (alanine aminotransferase (ALT) at minimum) in childhood and every 1-2 years starting at the age of 10 and continuing throughout the lifespan."
    explanation: Gives the minimum assay and lifelong cadence.
- name: Celiac Disease Serologic Surveillance
  description: >
    Tissue-transglutaminase IgA with total IgA from age two and every 2-5 years
    thereafter, with symptom-triggered testing at any age. The clinical
    association is strong enough to warrant screening even though the
    X-dosage-to-autoimmunity mechanism remains unresolved.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend screening for celiac disease by measuring tissue transglutaminase antibodies (TTG IgA with total IgA) in asymptomatic individuals starting at age 2 years, and subsequently every 2-5 years"
    explanation: Gives the recommended assay, starting age, and interval.
- name: Bone Health Surveillance
  description: >
    Vitamin D testing begins at age 9-11 and repeats every 2-3 years. DXA is
    obtained after linear growth is complete but before age 21 and every 5-10
    years in adulthood, with closer serial assessment when fractures, inadequate
    estrogen replacement, celiac disease, menopause, or other risks are present.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend routine screening for vitamin D deficiency using a serum 25 (OH) vitamin D level concentration between 9 and 11 years of age and every 2-3 years ongoing and treating with inactive vitamin D supplement as necessary"
    explanation: Gives the age and cadence for vitamin-D surveillance.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend obtaining a dual energy X-ray absorptiometry (DXA) scan after completion of growth but prior to 21 years of age and every 5-10 years throughout adulthood"
    explanation: Gives the DXA timing and adult interval.
genetic:
- name: SHOX
  association: >
    SHOX haploinsufficiency is causative for the short-stature and mesomelic
    skeletal arm of Turner syndrome, but SHOX variation is neither necessary nor
    sufficient for Turner syndrome as a whole; the defining lesion is loss of
    all or part of a sex chromosome.
  gene_term:
    preferred_term: SHOX
    term:
      id: hgnc:10853
      label: SHOX
  notes: >
    The one Turner gene assigned to its phenotype with confidence. SHOX lies in
    PAR1, escapes X-inactivation, and is therefore reduced to a single dose
    whenever the second sex chromosome is absent or its short arm deleted.
    Haploinsufficiency — not mutation of the retained copy — is the mechanism,
    which is why the same phenotype arises in Léri-Weill dyschondrosteosis from
    PAR1 deletions in individuals with two intact sex chromosomes. No
    variant_origin is recorded: there is no allele here to assign an origin to.
    The de-novo event is the loss of the chromosome, which is captured on the
    trigger pathophysiology node, not a variant in the retained SHOX copy.
    `relationship_type` is intentionally omitted: the controlled CAUSATIVE value
    means that variants in the gene are sufficient to cause the disease, which
    is false for Turner syndrome even though SHOX dosage causes one phenotype
    arm. The free-text association records the narrower, supported relationship.
  evidence:
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SHOX in the short arm pseudoautosomal region (PAR1) of sex chromosomes is one of the major growth genes in humans."
    explanation: Locates the gene and establishes its role in human growth.
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SHOX haploinsufficiency frequently results from deletions and duplications in PAR1 involving SHOX exons and/or the cis-acting enhancers, while exonic point mutations account for a small percentage of cases."
    explanation: >
      Supports the allele type recorded here — dosage loss through deletion
      rather than point mutation.
  - reference: PMID:21925981
    reference_title: "The role of the SHOX gene in the pathophysiology of Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with deletions of the distal segment of the short arm of X chromosome (Xp-) including haploinsufficiency of the SHOX (short stature homeobox) have, more often, short stature, skeletal abnormalities and hearing impairments."
    explanation: Genotype-phenotype correlation from partial Xp deletions.
inheritance:
- name: Not inherited (sporadic chromosomal aneuploidy)
  description: >
    Turner syndrome arises from a sporadic meiotic or post-zygotic mitotic error
    and is not transmitted in a Mendelian pattern. It is therefore not assigned
    an HPO mode-of-inheritance term: the standard modes describe transmission of
    alleles, and there is no transmission here. Recurrence risk in siblings is
    not appreciably raised, and the practical genetic-counselling content
    concerns the affected individual's own reproductive options rather than
    family segregation.
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is a rare condition in women that is associated with either complete or partial loss of one X chromosome, often in mosaic karyotypes."
    explanation: >
      Supports the chromosomal (aneuploidy/mosaicism) rather than Mendelian
      basis of the condition.
treatments:
- name: Recombinant Growth Hormone
  description: >
    Somatropin given from childhood to increase adult height. Mechanistically it
    is not replacement — growth hormone secretion is not deficient in Turner
    syndrome — but pharmacological stimulation of a growth plate whose SHOX
    dosage deficit has blunted its output. The randomised evidence to adult
    height gives roughly +7 cm, which is the honest size of the effect.
    The PROTEIN_REPLACEMENT modality tag records the therapeutic platform —
    somatropin is a 191-amino-acid recombinant protein — and is not a claim that
    the treatment replaces a deficient hormone, which it does not.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Skeletal Growth Failure and Mesomelic Dysmorphism
    treatment_effect: INHIBITS
    description: >
      Acts on the growth-failure node, increasing attained adult height without
      correcting the underlying SHOX dosage deficit.
    evidence:
    - reference: PMID:15784709
      reference_title: "Impact of growth hormone supplementation on adult height in turner syndrome: results of the Canadian randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is the first evidence from a randomized, controlled trial to adult height that GH supplementation with induction of puberty at a near physiological age increases the adult height of girls with Turner syndrome."
      explanation: Randomised-controlled-trial evidence that the treatment acts on this node.
  evidence:
  - reference: PMID:15784709
    reference_title: "Impact of growth hormone supplementation on adult height in turner syndrome: results of the Canadian randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean height gain due to GH, estimated by analysis of covariance, was +7.2 cm"
    explanation: Quantifies the treatment effect from the randomised trial.
  - reference: PMID:15784709
    reference_title: "Impact of growth hormone supplementation on adult height in turner syndrome: results of the Canadian randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One hundred fifty-four girls with Turner syndrome, aged 7-13 yr, were randomly assigned to one of two groups"
    explanation: Establishes the randomised design and cohort size behind the effect estimate.
- name: Estrogen Replacement Therapy
  description: >
    Estrogen to induce puberty at a physiological age, then continued
    replacement to the age of normal menopause. Unlike growth hormone this is
    true replacement — it substitutes for the hormone the streak gonad cannot
    make — and its end-organ targets are the skeleton and the uterus as well as
    secondary sexual development.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
  target_mechanisms:
  - target: Hypergonadotropic Hypogonadism and Estrogen Deficiency
    treatment_effect: RESTORES
    description: >
      Substitutes the missing gonadal steroid, addressing this node directly
      rather than any upstream dosage lesion.
    evidence:
    - reference: PMID:16641863
      reference_title: "Hormone replacement treatment in Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hormone replacement treatment should be initiated at a physiological age in these patients who do not enter puberty spontaneously and should be continued up to the age of normal menopause."
      explanation: States the indication and duration, both defined by the failed gonad.
  evidence:
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the improvement of bone mineral density; normal uterine growth"
    explanation: Names two of the measurable end-organ benefits.
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is crucial that these women understand that hormone replacement is a long-term treatment."
    explanation: Supports the lifelong rather than pubertal framing of the treatment.
- name: Prophylactic Aortic Surgery
  description: >
    Elective replacement of the ascending aorta in individuals reaching an
    indexed size threshold, undertaken before dissection rather than in
    response to it. It is the only intervention that acts on the syndrome's
    leading cause of avoidable sudden death.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Progressive Aortic Dilation
    treatment_effect: INHIBITS
    description: >
      Removes the dilated segment before it dissects; prophylactic rather than
      mechanism-modifying.
    evidence:
    - reference: PMID:23032325
      reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals with Turner syndrome who are >18 years of age with an ascending aortic size index >2.5 cm/m(2) should be considered for an aortic operation to prevent aortic dissection."
      explanation: States the preventive indication and the threshold that triggers it.
- name: Antihypertensive Therapy
  description: >
    Annual blood-pressure assessment with treatment of confirmed hypertension,
    preferentially with a beta-blocker, an angiotensin receptor blocker, or both
    where aortic dilation is also present. The mechanistic honesty here matters:
    the drug-class preference is imported from other genetically triggered
    aortopathies, and the guideline states plainly that no study has shown
    antihypertensive therapy to slow or prevent aortic dilation in Turner
    syndrome specifically. It is curated because it is a graded recommendation
    acting on a node this entry models, not because the aortic benefit is
    established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antihypertensive Therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: angiotensin receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Hypertension
    treatment_effect: INHIBITS
    description: >
      Treats the hypertension itself, which is the indication the guideline
      states without qualification.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We recommend annual assessment of blood pressure, preferably using ambulatory blood pressure monitoring (ABPM), and initiation of medical therapies if hypertension is confirmed, for all individuals with TS"
      explanation: Graded recommendation to treat confirmed hypertension in every individual with TS.
  - target: Progressive Aortic Dilation
    treatment_effect: INHIBITS
    description: >
      The intended but unproven target. Beta-blockade and angiotensin receptor
      blockade are chosen for their effect on aortic dilation in other
      aortopathies; in Turner syndrome the link between blood-pressure control
      and aortic events is inferential.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Medical therapy of hypertension for individuals with TS and aortic dilation should preferably include a beta-blocker, angiotensin receptor blocker (ARB), or both, which have been shown to prevent aortic dilation and aortic dissections in individuals with other aortopathy conditions."
      explanation: >
        Marked PARTIAL deliberately: the aortic benefit quoted is established in
        other aortopathies, and the sentence extends it to TS by analogy.
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: NO_EVIDENCE
      evidence_source: HUMAN_CLINICAL
      snippet: "While hypertension is correlated with the presence of aortic dilation in TS, no studies have demonstrated that antihypertensive therapies slow or prevent aortic dilation."
      explanation: >
        The guideline's own explicit statement that the TS-specific evidence for
        this edge does not exist. Retained so the link cannot be read as
        established mechanism.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend treatment with a beta-blocker, an angiotensin receptor blocker, or both for individuals with TS who have hypertension and have a dilated aorta"
    explanation: Names the recommended drug classes and the population in which they are indicated.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As hypertension is common, maintenance of normal blood pressure may reduce the risk for aortic events."
    explanation: States the rationale, in the guideline's own hedged wording.
- name: Fertility Preservation by Oocyte Cryopreservation
  description: >
    Controlled ovarian stimulation followed by oocyte cryopreservation, offered
    to post-menarcheal individuals with residual fertility potential. The
    treatment exists because the ovarian lesion is attrition rather than absent
    germ cells: there is a window before the reserve is exhausted, and the
    intervention is an attempt to act inside it. The guideline is explicit that
    it should not be offered to premenarcheal children, which is a limit on the
    window as much as an ethical constraint.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fertility preservation
    term:
      id: NCIT:C71326
      label: Fertility Preservation
  target_mechanisms:
  - target: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
    treatment_effect: BYPASSES
    description: >
      Does not slow the attrition. It removes and stores gametes before the
      reserve is lost, so it bypasses the node rather than modifying it.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We recommend controlled ovarian stimulation and oocyte cryopreservation, in females with a fertility potential, as the primary fertility preservation option in post-menarche individuals of appropriate psychological maturity"
      explanation: >
        The graded recommendation, restricted to individuals who still have
        fertility potential — i.e. in whom this node has not yet run to
        completion.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that controlled ovarian stimulation and oocyte cryopreservation not be offered to premenarcheal children or individuals not mature enough to understand and undergo the procedure"
    explanation: Records the guideline's explicit boundary on who should be offered the procedure.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend offering AMH measurements to all individuals with TS from diagnosis. AMH should be monitored annually if fertility preservation is considered"
    explanation: Ties the intervention to the AMH biochemical marker curated in this entry.
- name: Otologic and Audiologic Management
  description: >
    Tympanostomy tube insertion and hearing aids for the conductive loss of
    middle ear disease in childhood, and hearing aids or cochlear implantation
    for the progressive sensorineural loss. The two arms are separate
    interventions on separate lesions and are curated on one entry only because
    they share a care pathway.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tympanostomy tube insertion
    term:
      id: NCIT:C70906
      label: Myringotomy with Ear Tube Placement
  target_mechanisms:
  - target: Recurrent Otitis Media and Middle Ear Disease
    treatment_effect: INHIBITS
    description: >
      Ventilating the middle ear addresses the effusion that causes the
      conductive loss and the structural sequelae of recurrent infection.
    evidence:
    - reference: PMID:38748847
      reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We suggest placement of tympanostomy tubes at the early stages of chronic or recurrent middle ear disease in childhood (as for a high-risk population)"
      explanation: Graded recommendation targeting this node, explicitly at a lower threshold than in the general population.
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend rapid intervention with tympanostomy tube insertion or hearing aids for conductive hearing loss due to middle ear disease in childhood"
    explanation: Covers the conductive arm of the intervention.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend rehabilitation with hearing aids or cochlear implantation for sensorineural hearing loss"
    explanation: >
      Covers the sensorineural arm, which is a different lesion — the
      progressive high-frequency loss curated as its own phenotype.
- name: Multidisciplinary Lifelong Surveillance
  description: >
    Coordinated follow-up across endocrinology, cardiology, nephrology,
    audiology and psychology. This is listed as a treatment because in Turner
    syndrome the organ complications are mostly silent until they are severe,
    so scheduled surveillance — not symptom response — is what changes outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TS affects multiple organs through all stages of life, necessitating multidisciplinary care."
    explanation: States the rationale for lifelong multidisciplinary management.
- name: Genetic Counseling
  description: >
    Counseling addressed to the affected individual's reproductive options and
    to the interpretation of a mosaic karyotype, rather than to family
    recurrence risk, which is not appreciably raised.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31240242
    reference_title: "Time to consider ovarian tissue cryopreservation for girls with Turner's syndrome: an opinion paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ethical, clinical and psychological dilemmas should be considered, discussed and addressed before considering such a novel approach."
    explanation: >
      Supports the counseling requirement around fertility-preservation
      decisions specifically.
animal_models:
- name: 39,X (XO) mouse ovarian-reserve background series
  species: Mouse
  genotype: >
    39,X (XO) on mixed N2(C3H.B6) and inbred C57BL/6J genetic backgrounds
  background: Mixed N2(C3H.B6) compared with C57BL/6J
  publication: PMID:32634219
  description: >
    A background-comparison series that resolves an important limitation of the
    generic XO mouse. Mixed-background XO females retain fewer neonatal oocytes
    but remain normally fertile, whereas C57BL/6J XO females have much more
    severe early oocyte loss and reduced fertility. The model therefore captures
    a background-modified ovarian-reserve phenotype, not a stable mouse analogue
    of human Turner infertility.
  modeled_mechanisms:
  - target: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      C57BL/6J XO females reproduce early oocyte loss and infertility or
      subfertility, while mixed-background XO females show a milder reserve loss
      without the human fertility endpoint.
    limitations: >
      Fidelity is strongly strain-dependent: mixed-background XO females retain
      normal fertility, and even the C57BL/6J phenotype does not reproduce the
      profound prenatal lethality or near-universal ovarian failure of human
      non-mosaic 45,X. The series can test modifiers of oocyte loss but cannot be
      treated as a generic model of the full Turner ovarian phenotype.
    evidence:
    - reference: PMID:32634219
      reference_title: "Premature ovarian insufficiency in the XO female mouse on the C57BL/6J genetic background."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this article, we report that XO mice on the C57BL/6J (B6) genetic background showed early oocyte loss, infertility or subfertility and high embryonic lethality, suggesting that the effect of monosomy X in the female germline may be shared between mice and humans."
      explanation: Supports the recapitulated ovarian-reserve and fertility components in the B6 strain.
    - reference: PMID:32634219
      reference_title: "Premature ovarian insufficiency in the XO female mouse on the C57BL/6J genetic background."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that the impact of monosomy X on female mouse fertility depends on the genetic background."
      explanation: >
        Establishes the strain dependence that limits generalization and makes
        PARTIALLY_RECAPITULATES the appropriate relationship.
  evidence:
  - reference: PMID:18499648
    reference_title: "Genotype, phenotype, and karyotype correlation in the XO mouse model of Turner Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike their human counterparts, XO mice are typically fertile, and their lack of a second sex chromosome can be transmitted from one generation to the next as an X-linked dominant trait with male lethality."
    explanation: Records the classic translational mismatch that the background series qualifies.

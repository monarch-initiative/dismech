name: Turner Syndrome
creation_date: "2026-08-10T00:00:00Z"
category: Genetic
synonyms:
- TS
- 45,X syndrome
- Monosomy X
- Ullrich-Turner syndrome
- Gonadal dysgenesis, Turner type
description: >
  Turner syndrome is the complete or partial absence of one X chromosome in a
  phenotypic female, and it is the only whole-chromosome haploinsufficiency in
  humans that is compatible with postnatal life. Its mechanistic core is a gene
  dosage problem rather than a mutation: most X-linked genes are already
  silenced on one X by X-inactivation, so losing an X is survivable, but the
  minority of genes that normally escape inactivation — and the pseudoautosomal
  genes that pair with a Y homologue — are expressed from both sex chromosomes
  in a typical karyotype and therefore fall to a single functional copy here.
  The disease is what that dosage shortfall does in each tissue that depends on
  one of those genes.

  Only one of those genes is mapped to its phenotype with confidence. SHOX, in
  the short-arm pseudoautosomal region PAR1, is a major human growth gene, and
  its haploinsufficiency accounts for the growth-plate failure that produces
  short stature and the mesomelic skeletal features. The rest of the syndrome —
  the ovarian, cardiovascular, renal, auditory and autoimmune components — is
  not explained by SHOX, and identifying the responsible escape genes is the
  central open problem of the field rather than a detail.

  Three further mechanisms operate largely independently of each other. Ovarian
  germ cells are laid down but then lost at an accelerated rate, so the gonad
  involutes to a fibrous streak and most affected individuals reach puberty
  already in primary ovarian insufficiency: the defect is attrition, not
  agenesis, which is why mosaic individuals with a slower rate of loss can
  menstruate and occasionally conceive. Fetal jugular lymphatic sacs fail to
  connect properly to the venous system, producing nuchal cystic hygroma whose
  resolution leaves the webbed neck and low posterior hairline as scars of an
  intrauterine event that has already passed. And the left side of the heart is
  malformed — bicuspid aortic valve and coarctation — which in adult life
  becomes the aortopathy that makes aortic dissection the syndrome's leading
  cause of avoidable sudden death, at aortic diameters that would be considered
  unalarming in a person of average height.

  Clinically the syndrome is therefore not a single-organ endocrine disorder but
  a lifelong multisystem surveillance problem, and its two mechanism-matched
  interventions act on different arms: growth hormone addresses the SHOX growth
  deficit, and estrogen replacement substitutes for the failed gonad.

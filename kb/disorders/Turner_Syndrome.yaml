  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis can also improve QoL by allowing for timely screening and intervention for complications such as strabismus, hearing loss, renal and cardiac abnormalities, hypothyroidism, celiac disease and neurodevelopmental disabilities and mental health concerns."
    explanation: Lists hypothyroidism among the syndrome's expected complications.

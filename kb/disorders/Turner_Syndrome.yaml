  description: >
    Germ cells are laid down in the Turner ovary but are then lost at an
    accelerated rate through follicular atresia, so the process is depletion
    rather than failure of germ-cell formation. The distinction is what makes
    the fertility picture graded rather than absolute: the rate of loss varies,
    it is slower in mosaic karyotypes, and it is the reason ovarian tissue or
    oocyte cryopreservation is even discussed — there is a window before the
    reserve is exhausted rather than an ovary that never had one.

      The deletion-mapping result establishing that the phenotype tracks a
      specific interval rather than the whole chromosome.
  downstream:
  - target: Impaired Visuospatial and Perceptual Cognition
    causal_link_type: DIRECT
    description: The mapped PAR1 dosage state produces the characteristic cognitive phenotype.
    evidence:
    - reference: PMID:10931762
      reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Turner syndrome (TS) is associated with a characteristic neurocognitive profile that includes impaired visuospatial/perceptual abilities."
      explanation: Directly names the phenotype endpoint supported by deletion mapping.
mechanistic_hypotheses:
- hypothesis_group_id: escape_gene_haploinsufficiency_model
  hypothesis_label: X-Escape and Pseudoautosomal Gene Haploinsufficiency Model
  status: CANONICAL
  description: >
    The syndrome is caused by reduction to a single functional dose of the genes
    that normally escape X-inactivation, plus the pseudoautosomal genes that
    normally pair with a Y homologue. Human deletion mapping supports the model
    directly for at least two phenotypes: SHOX in PAR1 for short stature and the
    mesomelic skeleton, and a <2 Mb PAR1 interval for the neurocognitive
    profile, the latter shown to be independent of parent of origin and of
    X-inactivation skewing. The model's acknowledged weakness is coverage, not
    principle — the gonadal, cardiovascular, renal, auditory and autoimmune arms
    have no assigned escape gene, and the field states plainly that SHOX does
    not explain most Turner anomalies.
  notes: >
    Curated as CANONICAL because it is the framework in which the field
    operates and is directly evidenced for two phenotypes, not because it is
    complete. The gap is tracked as its own discussion
    (gap_unassigned_escape_genes) rather than being smoothed over here.
- hypothesis_group_id: lymphatic_obstruction_hemodynamic_model
  hypothesis_label: Jugular Lymphatic Obstruction Hemodynamic Model of Left-Heart Obstruction
  status: ALTERNATIVE
  description: >
    Clark's 1984 proposal that the cardiac malformation is not an independent
    dosage effect but a secondary consequence of the lymphatic lesion: obstructed
    jugular lymphatic sacs raise lymphatic pressure, distended thoracic ducts
    compress the ascending aorta, and the redirected intracardiac flow produces
    coarctation and the wider spectrum of left-heart obstruction. It is a
    mechanically explicit account of a robust epidemiological association —
    coarctation prevalence of 25% with neck web versus 3% without in a 45,X
    series — and it makes Turner cardiac disease an example of a teratogenic
    event remote from the heart.
  notes: >
    Held as ALTERNATIVE, not CANONICAL. The association it explains is strong
    and has been reproduced, but the causal chain itself is inferred from
    anatomy and flow reasoning rather than observed, and the competing account —
    that lymphatic and cardiac defects are parallel consequences of the same
    dosage lesion — is not excluded by the data curated here. No node in this
    entry asserts the hemodynamic chain outside this hypothesis group.
- hypothesis_group_id: granulosa_apelin_model
  hypothesis_label: Granulosa-Cell Apelin/APJ Dysfunction Model of Ovarian Attrition
  status: EMERGING
  description: >
    A human 45,X iPSC-derived granulosa-cell study places reduced apelin/APJ
    signaling upstream of abnormal granulosa differentiation and cell-cycle
    progression, then proposes that defective somatic support during ovarian
    development contributes to early oocyte loss. Ligand and Akt-pathway rescue
    provide model-specific causal support for the signaling-to-cellular step;
    the relay from chromosome dosage to apelin signaling and the translation
    from cultured cells to follicular attrition in vivo remain unproven.
  evidence:
  - reference: PMID:39543104
    reference_title: "Identification of apelin/APJ signaling dysregulation in a human iPSC-derived granulosa cell model of Turner syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We hypothesize that during early embryonic development, failures in apelin/APJ signaling in GCs of Turner syndrome patients lead to abnormalities in ovarian development, ultimately resulting in early oocyte loss and infertility."
    explanation: >
      The authors explicitly frame the in-vivo extension as a hypothesis;
      PARTIAL preserves that status despite the in-vitro rescue evidence.
  notes: >
    This model does not replace the established ovarian-attrition path. It
    supplies one candidate somatic-cell relay within an arm whose responsible
    X-dosage-sensitive gene or genes remain unidentified.
- hypothesis_group_id: cardiomyocyte_ceRNA_model
  hypothesis_label: Cardiomyocyte ceRNA and Heart-Development Transcriptome Model
  status: EMERGING
  description: >
    Patient-derived 45,X cardiomyocytes show global coding and non-coding RNA
    dysregulation, enrichment of heart-development genes, lower beating
    frequency, and increased mitochondrial DNA copy number. The authors propose
    dosage-altered X-inactivation-escaping non-coding RNAs as regulators of
    autosomal cardiac genes. The study does not establish that this cultured-cell
    state causes bicuspid valve, coarctation, generalized arteriopathy, or
    dissection, so no edge to those human structural lesions is asserted.
  evidence:
  - reference: PMID:38124119
    reference_title: "Competing endogenous RNA network analysis of Turner syndrome patient-specific iPSC-derived cardiomyocytes reveals dysregulation of autosomal heart development genes by altered dosages of X-inactivation escaping non-coding RNAs."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Further ceRNA network analysis has revealed that dysregulation of genes on autosomes could be possibly mediated by altered dosages of lnc/circRNAs on the X chromosome."
    explanation: >
      The source's conditional wording supports an emerging regulatory model,
      not an established mechanism of congenital or aortic disease.
phenotypes:
- category: Growth
  name: Short Stature
  description: >
    The most consistent feature of the syndrome and usually the one that prompts
    diagnosis. Attributable to SHOX haploinsufficiency acting at the growth plate.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
    explanation: Lists short stature first among the syndrome's defining features.
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SHOX haploinsufficiency results in idiopathic short stature and Léri-Weill dyschondrosteosis and is associated with the short stature of patients with Turner syndrome."
    explanation: Attributes the stature phenotype to SHOX dosage.
- category: Skeletal
  name: Cubitus Valgus
  description: >
    Increased carrying angle at the elbow, part of the mesomelic skeletal
    signature of SHOX haploinsufficiency.
  phenotype_term:
    preferred_term: Cubitus valgus
    term:
      id: HP:0002967
      label: Cubitus valgus
  evidence:
  - reference: PMID:21925981
    reference_title: "The role of the SHOX gene in the pathophysiology of Turner syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with deletions of the distal segment of the short arm of X chromosome (Xp-) including haploinsufficiency of the SHOX (short stature homeobox) have, more often, short stature, skeletal abnormalities and hearing impairments."
    explanation: >
      Marked PARTIAL: the source supports skeletal abnormality as a class
      attributable to SHOX dosage but does not name cubitus valgus specifically.
- category: Skeletal
  name: Madelung Deformity
  description: >
    Dorsal subluxation of the distal ulna from disordered distal radial growth —
    the wrist lesion shared with Léri-Weill dyschondrosteosis, the other SHOX
    haploinsufficiency disorder.
  phenotype_term:
    preferred_term: Madelung deformity
    term:
      id: HP:0003067
      label: Madelung deformity
  evidence:
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SHOX haploinsufficiency results in idiopathic short stature and Léri-Weill dyschondrosteosis and is associated with the short stature of patients with Turner syndrome."
    explanation: >
      Marked PARTIAL: supports the shared SHOX aetiology with Léri-Weill
      dyschondrosteosis, of which Madelung deformity is the defining feature,
      but does not name the deformity in Turner syndrome directly.
- category: Reproductive
  name: Gonadal Dysgenesis with Streak Ovaries
  description: >
    The fibrous streak gonad left after accelerated follicular atresia exhausts
    the ovarian reserve.
  phenotype_term:
    preferred_term: Gonadal dysgenesis
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gonadal dysgenesis in 85-90% of cases"
    explanation: >
      Directly quantifies the frequency band: 85-90% falls in the HPO
      Very frequent (80-99%) range.
- category: Reproductive
  name: Hypergonadotropic Hypogonadism and Delayed Puberty
  description: >
    Absent gonadal steroid and inhibin output releases pituitary feedback,
    raising gonadotropins; spontaneous puberty fails in most individuals.
  phenotype_term:
    preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
    explanation: Names both delayed puberty and hypergonadotropic hypogonadism.
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormone replacement treatment should be initiated at a physiological age in these patients who do not enter puberty spontaneously and should be continued up to the age of normal menopause."
    explanation: States the failure of spontaneous puberty.
- category: Reproductive
  name: Infertility
  description: >
    A consequence of exhausted ovarian reserve. Not absolute — mosaic
    individuals with slower attrition may retain fertility for a period.
  phenotype_term:
    preferred_term: Infertility
    term:
      id: HP:0000789
      label: Infertility
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
    explanation: Lists infertility among the defining features.
  - reference: PMID:31240242
    reference_title: "Time to consider ovarian tissue cryopreservation for girls with Turner's syndrome: an opinion paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of decline in fertility is variable in girls with TS and can be more complex in cases with mosaicism."
    explanation: Supports the qualification that fertility loss is graded rather than uniform.
- category: Lymphatic
  name: Webbed Neck
  description: >
    Residual skin fold from an intrauterine nuchal cystic hygroma; a marker of
    the fetal lymphatic lesion rather than an active abnormality.
  phenotype_term:
    preferred_term: Webbed neck
    term:
      id: HP:0000465
      label: Webbed neck
  frequency: FREQUENT
  evidence:
  - reference: PMID:6463900
    reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 193 cases with documented 45 X-O karyotype, 106 (55%) had a web neck and 87 (45%) had a normal neck."
    explanation: >
      Gives an explicit count (106/193 = 55%) in a 45,X series, which maps to
      the HPO Frequent (30-79%) band.
- category: Lymphatic
  name: Lymphedema
  description: >
    Peripheral lymphedema, classically of the dorsum of the hands and feet in
    the neonate, from the same lymphatic network dysplasia that produces the
    nuchal hygroma. Often present at birth and improving through infancy, but
    with a relapsing course into adult life. Lymphoscintigraphy shows abnormal
    lymphatic vessel development even in individuals with no clinically visible
    swelling, so the curated frequency band understates the underlying lesion.
  phenotype_term:
    preferred_term: Lymphedema
    term:
      id: HP:0001004
      label: Lymphedema
    temporality: RECURRENT
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically apparent lymphedema occurs in 12%-27% of girls and women with TS."
    explanation: >
      Direct quantitative support for the frequency band: 12-27% falls inside
      the HPO Occasional (5-29%) range.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical lymphedema is often present at birth, frequently resolves or at least improves by age 2 years, and may have a relapsing and remitting course throughout life."
    explanation: Supports the recurrent temporality recorded on the descriptor.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphedema is reported more often in association with a 45,X karyotype compared to other karyotypes."
    explanation: >
      Supports karyotype as a severity modifier here, consistent with the
      entry's lumping rationale.
- category: Auditory
  name: Recurrent Otitis Media and Middle Ear Disease
  description: >
    Persistent middle ear effusion and recurrent acute otitis media through
    childhood, with a conductive hearing loss that is mechanistically distinct
    from the progressive high-frequency sensorineural loss curated separately.
    Its consequences are cumulative — tympanic membrane perforation, scarring,
    retraction and cholesteatoma — which is why the guideline treats it as a
    high-risk rather than an ordinary paediatric problem.
  phenotype_term:
    preferred_term: Otitis media
    term:
      id: HP:0000388
      label: Otitis media
    temporality: RECURRENT
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From early childhood through adolescence, persistent middle ear fluid and recurrent acute otitis media are common (24%-48%) in TS."
    explanation: >
      States the phenotype and its childhood time course. No frequency band is
      recorded because the quoted 24-48% range straddles the HPO Occasional
      (5-29%) and Frequent (30-79%) boundaries, and choosing either would assert
      a precision the source does not carry.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent otitis media in early childhood has been shown to be a strong predictor of future middle ear pathologies, including tympanic membrane perforations and scarring, retractions, and cholesteatoma."
    explanation: Supports the cumulative structural consequences that make this more than a nuisance phenotype.
- category: Cardiovascular
  name: Hypertension
  description: >
    Systemic hypertension, present in a substantial minority of children and in
    the majority of adults. It matters here beyond its general cardiovascular
    weight because it is one of the risk factors that compounds aortic dilation
    and dissection — the arm of the disease with the highest avoidable
    mortality — and it is the indication for the antihypertensive therapy
    curated in treatments.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of hypertension is as high as 20%-40% in children"
    explanation: >
      Gives the paediatric prevalence. No single frequency band is recorded
      because the guideline reports markedly different figures for children and
      adults, so one band would misrepresent the age dependence.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TS is often accompanied by hypertension, which has been linked to the development of aortic dilation or dissection, both observed with strikingly increased frequency in TS."
    explanation: Connects the phenotype to the aortopathy arm, which is why it is curated rather than left as a general comorbidity.
- category: Skeletal
  name: Scoliosis
  description: >
    Lateral curvature of the spine, most often of idiopathic type though
    congenital forms attributable to vertebral body anomalies also occur. It is
    the reason the guideline mandates annual spinal examination until skeletal
    maturity, and it is a recognised consideration during growth-hormone-driven
    linear growth.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Idiopathic scoliosis is the most common form of scoliosis noted in individuals with TS though congenital scoliosis, thought to be due to abnormalities of vertebral bodies, also occurs."
    explanation: States the phenotype and distinguishes the two forms seen in the syndrome.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend physical examination to identify scoliosis at diagnosis and then at least annually until skeletal maturation"
    explanation: >
      A graded guideline recommendation for annual screening, which is a
      statement that the phenotype is expected rather than incidental.
- category: Endocrine
  name: Hypothyroidism
  description: >
    Thyroid failure, in most cases the functional endpoint of the autoimmune
    thyroiditis curated separately. It is curated as its own phenotype because
    it is the treatable state that surveillance is aimed at, and because the
    guideline screens for it biochemically from age two through adult life
    rather than screening for the antibodies that precede it.
  phenotype_term:
    preferred_term: Hypothyroidism
    term:
      id: HP:0000821
      label: Hypothyroidism
  evidence:
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend screening for hypothyroidism with measurement of TSH every 1-2 years starting at 2 years of age and continuing through adulthood, and with new symptoms."
    explanation: >
      A graded recommendation for lifelong biochemical screening, which asserts
      hypothyroidism as an expected recurring complication. No frequency band is
      recorded: the guideline gives a pooled figure for autoimmunity overall

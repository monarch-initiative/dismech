  - reference: PMID:11045397
    reference_title: "Frequency of renal malformations in Turner syndrome: analysis of 82 Turkish children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 82 patients, 31 had different renal malformations (37.8%)."
    explanation: Gives the yield that justifies screening every newly diagnosed individual.

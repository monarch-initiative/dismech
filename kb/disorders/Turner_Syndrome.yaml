clinical_burden:
  burden_level: HIGH
  rationale: >
    Morbidity and mortality are raised across the lifespan, and the burden is
    distributed across organ systems rather than concentrated in one. The
    dominant avoidable event is aortic dissection, which in Turner syndrome
    occurs younger and at smaller absolute aortic diameters than in the general
    population — so a diameter that would not trigger intervention in an
    average-height adult can be the one that dissects here. Diagnostic delay is
    itself part of the burden: a mean age at diagnosis around 15 years means
    growth-promoting and cardiac-surveillance interventions are frequently
    started after their window of greatest benefit.
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morbidity and mortality are increased in women with Turner syndrome compared with the general population"
    explanation: States the excess morbidity and mortality.
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the average age at diagnosis is around 15 years of age"
    explanation: Quantifies the diagnostic delay that limits timely intervention.
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aortic dissection in Turner syndrome occurs in young individuals at smaller aortic diameters than in the general population or other forms of genetically triggered aortopathy."
    explanation: Establishes that dissection occurs at younger age and smaller calibre than standard thresholds assume.
  - reference: PMID:38748847
    reference_title: "Clinical practice guidelines for the care of girls and women with Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TS affects multiple organs through all stages of life, necessitating multidisciplinary care."
    explanation: Supports the multisystem, lifelong character of the burden.
pathophysiology:
- name: Complete or Partial Loss of One X Chromosome
  role: trigger
  biological_scale: MOLECULAR
  description: >
    A meiotic or post-zygotic mitotic error leaves a phenotypically female
    individual with one intact X and either no second sex chromosome (45,X),
    a structurally abnormal second X (ring, isochromosome, deletion), or a
    mosaic mixture of cell lines. This is the only whole-chromosome
    haploinsufficiency compatible with postnatal life, which is itself the first
    mechanistic fact about the disease: survival is possible because
    X-inactivation has already reduced most X-linked genes to one functional
    copy in typical cells, so only the genes exempt from that silencing are
    actually rendered haploinsufficient by the loss.
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is a rare condition in women that is associated with either complete or partial loss of one X chromosome, often in mosaic karyotypes."
    explanation: States the defining chromosomal lesion and that it is frequently mosaic.
  - reference: PMID:38124119
    reference_title: "Competing endogenous RNA network analysis of Turner syndrome patient-specific iPSC-derived cardiomyocytes reveals dysregulation of autosomal heart development genes by altered dosages of X-inactivation escaping non-coding RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A 45,X monosomy (Turner syndrome, TS) is the only chromosome haploinsufficiency compatible with life."
    explanation: Supports the claim that this is the uniquely survivable whole-chromosome monosomy.
  downstream:
  - target: Haploinsufficiency of Pseudoautosomal and X-Inactivation Escape Genes
    causal_link_type: DIRECT
    description: >
      Loss of the second sex chromosome halves the dose of exactly those genes
      that are normally expressed from both copies.
    evidence:
    - reference: PMID:38124119
      reference_title: "Competing endogenous RNA network analysis of Turner syndrome patient-specific iPSC-derived cardiomyocytes reveals dysregulation of autosomal heart development genes by altered dosages of X-inactivation escaping non-coding RNAs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our study has revealed a genomewide ripple effect of X chromosome halpoinsufficiency at post-transcriptional level"
      explanation: Links the chromosomal loss to genome-wide dosage consequences.
- name: Haploinsufficiency of Pseudoautosomal and X-Inactivation Escape Genes
  role: central_effector
  biological_scale: MOLECULAR
  description: >
    Genes in the pseudoautosomal regions and the subset of X-linked genes that
    escape X-inactivation are normally transcribed from both sex chromosomes.
    With one sex chromosome absent or truncated they drop to a single functional
    dose. This node is the convergence point of the disease: every downstream
    arm is a tissue-specific consequence of a dosage shortfall in one or more of
    these genes. Only SHOX is confidently assigned to its phenotype; the
    identity of the escape genes responsible for the gonadal, cardiovascular,
    renal, auditory and immune arms is unresolved, and is curated here as an
    explicit knowledge gap rather than as a mechanism.
  biological_processes:
  - preferred_term: dosage compensation by X-inactivation
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
    modifier: DECREASED
  evidence:
  - reference: PMID:10931762
    reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that haploinsufficiency of PAR1 gene(s) is the basis for susceptibility to the TS neurocognitive phenotype."
    explanation: >
      Deletion mapping in 34 females localises a Turner phenotype to
      haploinsufficiency of pseudoautosomal genes, establishing the dosage
      mechanism from human genetics rather than by inference.
  - reference: PMID:10931762
    reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype was seen with either paternally or maternally inherited deletions and with either complete or incomplete skewing of X inactivation."
    explanation: >
      Excludes imprinting and skewed inactivation as explanations, leaving gene
      dosage as the operative variable.
  - reference: PMID:38124119
    reference_title: "Competing endogenous RNA network analysis of Turner syndrome patient-specific iPSC-derived cardiomyocytes reveals dysregulation of autosomal heart development genes by altered dosages of X-inactivation escaping non-coding RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "How loss of one X chromosome drive these conditions remains largely unknown."
    explanation: >
      States that the gene-to-phenotype assignment downstream of this node is
      still open — retained deliberately so the node is not read as settled.
  downstream:
  - target: SHOX Haploinsufficiency and Growth-Plate Chondrocyte Dysregulation
    causal_link_type: DIRECT
    description: >
      SHOX lies in PAR1 and is one of the escape genes rendered haploinsufficient.
    evidence:
    - reference: PMID:27194967
      reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SHOX in the short arm pseudoautosomal region (PAR1) of sex chromosomes is one of the major growth genes in humans."
      explanation: Places SHOX in PAR1 and identifies it as a major growth gene.
  - target: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Gonadal involution is a dosage consequence of the missing X, but the
      specific escape gene(s) responsible have not been identified — hence
      INDIRECT rather than DIRECT.
    evidence:
    - reference: PMID:31213699
      reference_title: "Turner syndrome: mechanisms and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
      explanation: Associates ovarian dysgenesis with the chromosomal lesion at disease level.
  - target: Fetal Jugular Lymphatic Sac Obstruction and Lymphatic Network Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The fetal lymphatic defect is attributed to the chromosomal loss; no
      individual escape gene has been assigned to it.
    evidence:
    - reference: PMID:6463900
      reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 193 cases with documented 45 X-O karyotype, 106 (55%) had a web neck and 87 (45%) had a normal neck."
      explanation: >
        Establishes in a 45,X series that the neck web — the residue of the
        fetal lymphatic lesion — is present in the majority of cases.
  - target: PAR1 Haploinsufficiency and the Turner Neurocognitive Phenotype
    causal_link_type: DIRECT
    description: >
      A <2 Mb PAR1 interval is the mapped critical region for the neurocognitive
      profile.
    evidence:
    - reference: PMID:10931762
      reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fine mapping of informative deletions implicated a critical region of <2 Mb within the pseudoautosomal region (PAR1)."
      explanation: Gives the mapped interval underlying this edge.
- name: SHOX Haploinsufficiency and Growth-Plate Chondrocyte Dysregulation
  role: effector
  biological_scale: CELLULAR
  description: >
    A single functional SHOX copy dysregulates the growth-plate chondrocyte
    programme. SHOX acts on chondrocyte apoptosis through downstream targets
    including BNP, FGFR3, aggrecan and CTGF, so halving its dose alters the
    proliferation-to-hypertrophy-to-apoptosis sequence that converts cartilage
    into bone at the growth plate. This is the one arm of Turner syndrome where
    a named gene, a cell type and a molecular programme are all established.
  cell_types:
  - preferred_term: growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: regulation of growth plate cartilage chondrocyte proliferation
    term:
      id: GO:0003420
      label: regulation of growth plate cartilage chondrocyte proliferation
    modifier: DECREASED
  - preferred_term: chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SHOX protein likely controls chondrocyte apoptosis by regulating multiple target genes including BNP,Fgfr3, Agc1, and Ctgf."
    explanation: Gives the chondrocyte-level molecular programme SHOX acts through.
  - reference: PMID:27194967
    reference_title: "SHOX Haploinsufficiency as a Cause of Syndromic and Nonsyndromic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SHOX haploinsufficiency results in idiopathic short stature and Léri-Weill dyschondrosteosis and is associated with the short stature of patients with Turner syndrome."
    explanation: >
      Connects SHOX dosage to Turner short stature and, via Léri-Weill
      dyschondrosteosis, to the mesomelic skeletal phenotype.
  downstream:
  - target: Skeletal Growth Failure and Mesomelic Dysmorphism
    causal_link_type: DIRECT
    description: >
      Growth-plate dysregulation is expressed at tissue level as reduced
      endochondral bone growth with disproportionate forearm and lower-leg
      involvement.
    evidence:
    - reference: PMID:21925981
      reference_title: "The role of the SHOX gene in the pathophysiology of Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with deletions of the distal segment of the short arm of X chromosome (Xp-) including haploinsufficiency of the SHOX (short stature homeobox) have, more often, short stature, skeletal abnormalities and hearing impairments."
      explanation: >
        Genotype-phenotype correlation from partial Xp deletions tying SHOX
        dosage specifically to stature and skeletal abnormality.
- name: Skeletal Growth Failure and Mesomelic Dysmorphism
  role: consequence
  biological_scale: TISSUE
  description: >
    Reduced endochondral bone growth produces the near-universal short stature
    and the mesomelic skeletal signature — cubitus valgus, short fourth
    metacarpals, Madelung deformity of the wrist, and a broad chest. Because
    the deficit is in the growth plate rather than in growth hormone secretion,
    growth hormone works here pharmacologically, by driving a partially
    responsive plate harder, not by replacing a missing hormone.
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  evidence:
  - reference: PMID:31213699
    reference_title: "Turner syndrome: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome is associated with short stature, delayed puberty, ovarian dysgenesis, hypergonadotropic hypogonadism, infertility, congenital malformations of the heart, endocrine disorders such as type 1 and type 2 diabetes mellitus, osteoporosis and autoimmune disorders."
    explanation: Places short stature among the defining features of the syndrome.
- name: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
  role: effector
  biological_scale: CELLULAR
  description: >
    Germ cells are laid down in the Turner ovary but are then lost at an
    accelerated rate through follicular atresia, so the process is depletion
    rather than failure of germ-cell formation. The distinction is what makes
    the fertility picture graded rather than absolute: the rate of loss varies,
    it is slower in mosaic karyotypes, and it is the reason ovarian tissue or
    oocyte cryopreservation is even discussed — there is a window before the
    reserve is exhausted rather than an ovary that never had one.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: ovarian follicle atresia
    term:
      id: GO:0001552
      label: ovarian follicle atresia
    modifier: INCREASED
  - preferred_term: germ cell development
    term:
      id: GO:0007281
      label: germ cell development
    modifier: DECREASED
  evidence:
  - reference: PMID:31240242
    reference_title: "Time to consider ovarian tissue cryopreservation for girls with Turner's syndrome: an opinion paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to rapid follicular atresia, the majority of women with TS suffer from primary ovarian insufficiency around puberty."
    explanation: >
      Names accelerated follicular atresia as the mechanism and places its
      clinical endpoint at around puberty.
  - reference: PMID:31240242
    reference_title: "Time to consider ovarian tissue cryopreservation for girls with Turner's syndrome: an opinion paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of decline in fertility is variable in girls with TS and can be more complex in cases with mosaicism."
    explanation: >
      Supports attrition rate — not presence or absence of germ cells — as the
      variable that karyotype modifies.
  downstream:
  - target: Ovarian Dysgenesis and Hypergonadotropic Hypogonadism
    causal_link_type: DIRECT
    description: >
      Exhaustion of the follicular reserve leaves a fibrous streak gonad
      incapable of steroidogenesis, releasing the pituitary from feedback.
    evidence:
    - reference: PMID:16641863
      reference_title: "Hormone replacement treatment in Turner syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "gonadal dysgenesis in 85-90% of cases"
      explanation: Quantifies how often the attrition process ends in frank gonadal dysgenesis.
- name: Ovarian Dysgenesis and Hypergonadotropic Hypogonadism
  role: consequence
  biological_scale: ORGANISM
  description: >
    The involuted streak gonad produces neither estrogen nor inhibin, so
    gonadotropins rise and puberty does not start spontaneously in most
    individuals. Estrogen deficiency from an age at which the skeleton, uterus
    and secondary sexual characteristics all depend on it is what converts a
    gonadal lesion into a systemic one, and it is the reason hormone
    replacement is continued to the age of normal menopause rather than being
    used only to induce puberty.
  biological_processes:
  - preferred_term: estrogen biosynthetic process
    term:
      id: GO:0006703
      label: estrogen biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormone replacement treatment should be initiated at a physiological age in these patients who do not enter puberty spontaneously and should be continued up to the age of normal menopause."
    explanation: >
      Establishes both that spontaneous puberty fails and that the deficiency is
      lifelong rather than pubertal.
  - reference: PMID:16641863
    reference_title: "Hormone replacement treatment in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the improvement of bone mineral density; normal uterine growth"
    explanation: >
      Names the two end-organ deficits attributable to the estrogen shortfall,
      each corrected by replacement.
- name: Fetal Jugular Lymphatic Sac Obstruction and Lymphatic Network Dysplasia
  role: effector
  biological_scale: TISSUE
  description: >
    The fetal jugular lymphatic sacs fail to drain properly into the venous
    system, raising lymphatic pressure and distending the posterior nuchal
    region into a cystic hygroma. Most hygromas resolve before birth; what
    survives is their imprint — the webbed neck, low posterior hairline and
    rotated ears are the healed residue of an intrauterine distension that has
    already gone. Peripheral lymphatic dysplasia in the same process gives the
    dorsal hand and foot lymphedema characteristic of the neonate.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: lymph vessel development
    term:
      id: GO:0001945
      label: lymph vessel development
    modifier: DECREASED
  evidence:
  - reference: PMID:6463900
    reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased lymphatic pressure associated with jugular lymphatic sac obstruction distends the thoracic ducts, which compress the ascending aorta altering intracardiac blood flow."
    explanation: >
      States the jugular lymphatic sac obstruction that defines this node.
      Note this snippet also carries the downstream hemodynamic claim, which is
      curated separately as an ALTERNATIVE hypothesis rather than as settled
      mechanism.
  downstream:
  - target: Left-Sided Cardiac Outflow Tract Malformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - lymphatic_obstruction_hemodynamic_model
    description: >
      Clark's hemodynamic hypothesis: distended thoracic ducts compress the
      ascending aorta and redirect intracardiac flow, producing left-heart
      obstructive lesions. This edge is curated as belonging to a named
      hypothesis rather than as established fact — the epidemiological
      association between neck web and coarctation is strong and reproducible,
      but the mechanism connecting them is inferred, not observed.
    evidence:
    - reference: PMID:6463900
      reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The difference was most striking in coarctation of the aorta for which the prevalence was 25% with web neck and 3% with normal neck"
      explanation: >
        The quantitative association on which the hypothesis rests — an
        eight-fold difference in coarctation prevalence stratified by neck web.
    - reference: PMID:6463900
      reference_title: "Neck web and congenital heart defects: a pathogenic association in 45 X-O Turner syndrome?"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The association between web neck and congenital heart disease suggests a pathogenic relationship exists between the two."
      explanation: >
        Marked PARTIAL deliberately: the source states an association and
        proposes a mechanism, and its own wording ("suggests") does not assert
        the causal chain.
- name: Left-Sided Cardiac Outflow Tract Malformation
  role: effector
  biological_scale: TISSUE
  description: >
    Bicuspid aortic valve and coarctation of the aorta dominate the congenital
    cardiac phenotype. Their importance is not primarily neonatal — many are
    haemodynamically tolerated in childhood — but that they define the subgroup
    carrying essentially all of the adult aortic dissection risk.
  evidence:
  - reference: PMID:31240242
    reference_title: "Time to consider ovarian tissue cryopreservation for girls with Turner's syndrome: an opinion paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to short stature and gonadal dysgenesis, it is associated with cardiac and renal anomalies."
    explanation: Places cardiac malformation among the cardinal features.
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of those with spontaneous aortic dissections, 18 of 19 (95%) had an associated cardiac malformation that included a bicuspid aortic valve."
    explanation: >
      Establishes that the malformed left outflow tract is present in almost
      every dissection case.
  downstream:
  - target: Turner Aortopathy and Aortic Dissection
    causal_link_type: DIRECT
    description: >
      A malformed valve and arch predispose to progressive aortic dilation and
      dissection in adult life.
    evidence:
    - reference: PMID:23032325
      reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The absence of aortic valve or other cardiac malformations appears to markedly reduce the risk of aortic dissection"
      explanation: >
        The converse statement — absence of the malformation reduces risk —
        which is what makes this an causal-risk edge rather than a co-occurrence.
- name: Turner Aortopathy and Aortic Dissection
  role: consequence
  biological_scale: ORGANISM
  description: >
    Progressive dilation of the ascending aorta culminating in dissection or
    rupture, and the leading avoidable cause of sudden death in the syndrome.
    The clinically decisive feature is one of calibration rather than biology:
    dissection occurs at absolute diameters that are unremarkable in an
    average-height adult, which is why surveillance in Turner syndrome is
    indexed to body surface area and why an aortic size index above
    2.5 cm/m2 triggers surgical consideration. Dissection is also reported in
    individuals with no cardiac malformation at all, so a structurally normal
    valve reduces but does not abolish the risk.
  evidence:
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Girls and women with Turner syndrome are at risk for aortic dissection and rupture."
    explanation: States the endpoint this node represents.
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with Turner syndrome who are >18 years of age with an ascending aortic size index >2.5 cm/m(2) should be considered for an aortic operation to prevent aortic dissection."
    explanation: Gives the indexed threshold that operationalises this node clinically.
  - reference: PMID:23032325
    reference_title: "Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome: report of the international turner syndrome aortic dissection registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1 individual there was no predisposing finding other than the presence of Turner syndrome."
    explanation: >
      Supports the residual risk in the absence of a cardiac malformation,
      preventing this node from being read as wholly downstream of the previous one.
- name: PAR1 Haploinsufficiency and the Turner Neurocognitive Phenotype
  role: consequence
  biological_scale: ORGANISM
  description: >
    A characteristic cognitive profile with preserved verbal ability and
    selectively impaired visuospatial and perceptual processing. Deletion
    mapping localises it to under 2 Mb of PAR1, independent of parent of origin
    and of X-inactivation skewing — which is what makes it a gene-dosage
    phenotype rather than a consequence of estrogen deficiency or of the
    psychosocial impact of short stature.
  evidence:
  - reference: PMID:10931762
    reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Turner syndrome (TS) is associated with a characteristic neurocognitive profile that includes impaired visuospatial/perceptual abilities."
    explanation: Defines the phenotype this node represents.
  - reference: PMID:10931762
    reference_title: "The Turner syndrome-associated neurocognitive phenotype maps to distal Xp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only subjects missing approximately 10 Mb of distal Xp manifested the specified neurocognitive profile."
    explanation: >
      The deletion-mapping result establishing that the phenotype tracks a
      specific interval rather than the whole chromosome.
mechanistic_hypotheses:
- hypothesis_group_id: escape_gene_haploinsufficiency_model
  hypothesis_label: X-Escape and Pseudoautosomal Gene Haploinsufficiency Model
  status: CANONICAL
  description: >
    The syndrome is caused by reduction to a single functional dose of the genes
    that normally escape X-inactivation, plus the pseudoautosomal genes that
    normally pair with a Y homologue. Human deletion mapping supports the model
    directly for at least two phenotypes: SHOX in PAR1 for short stature and the
    mesomelic skeleton, and a <2 Mb PAR1 interval for the neurocognitive
    profile, the latter shown to be independent of parent of origin and of
    X-inactivation skewing. The model's acknowledged weakness is coverage, not
    principle — the gonadal, cardiovascular, renal, auditory and autoimmune arms
    have no assigned escape gene, and the field states plainly that SHOX does
    not explain most Turner anomalies.
  notes: >
    Curated as CANONICAL because it is the framework in which the field
    operates and is directly evidenced for two phenotypes, not because it is
    complete. The gap is tracked as its own discussion
    (gap_unassigned_escape_genes) rather than being smoothed over here.
- hypothesis_group_id: lymphatic_obstruction_hemodynamic_model
  hypothesis_label: Jugular Lymphatic Obstruction Hemodynamic Model of Left-Heart Obstruction
  status: ALTERNATIVE
  description: >
    Clark's 1984 proposal that the cardiac malformation is not an independent
    dosage effect but a secondary consequence of the lymphatic lesion: obstructed
    jugular lymphatic sacs raise lymphatic pressure, distended thoracic ducts
    compress the ascending aorta, and the redirected intracardiac flow produces
    coarctation and the wider spectrum of left-heart obstruction. It is a
    mechanically explicit account of a robust epidemiological association —
    coarctation prevalence of 25% with neck web versus 3% without in a 45,X
    series — and it makes Turner cardiac disease an example of a teratogenic
    event remote from the heart.
  notes: >
    Held as ALTERNATIVE, not CANONICAL. The association it explains is strong
    and has been reproduced, but the causal chain itself is inferred from
    anatomy and flow reasoning rather than observed, and the competing account —
    that lymphatic and cardiac defects are parallel consequences of the same
    dosage lesion — is not excluded by the data curated here. No node in this
    entry asserts the hemodynamic chain outside this hypothesis group.

  notes: >
    The 2024 international guideline gives 50 per 100 000 females. This is a
    prevalence of diagnosed Turner syndrome and is therefore an undercount: the
    same literature puts mean age at diagnosis at about 15 years, so a
    substantial fraction of mosaic and mildly affected individuals are never
    ascertained.

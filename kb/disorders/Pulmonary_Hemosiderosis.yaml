diagnosis:
- name: Chest radiography and computed tomography
  description: >
    Chest radiographs or CT are used to identify infiltrates, ground-glass
    opacity, nodular changes, cardiomegaly, or reticular interstitial changes
    compatible with alveolar hemorrhage and chronic injury.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the patients showed abnormal chest X-rays or computed tomography scans."
    explanation: The pediatric cohort supports chest imaging as a routine diagnostic component.
- name: Hemosiderin-laden macrophage testing
  description: >
    Sputum, gastric lavage fluid, or bronchoalveolar lavage fluid can be tested
    for hemosiderin-laden macrophages; repeated gastric lavage or BAL can improve
    detection in children who cannot expectorate.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The positive rates of hemosiderin-laden macrophages in sputum, gastric lavage fluid, and bronchoalveolar lavage fluid were 91.66%, 98.21%, and 100%, respectively."
    explanation: The cohort supports cytologic testing for hemosiderin-laden macrophages across respiratory and gastric samples.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chest imaging combined with repeated examinations for hemosiderin-laden macrophages in sputum, gastric lavage fluid, or bronchoalveolar lavage fluid are helpful for diagnosing IPH."
    explanation: The cohort conclusion supports combined imaging and repeated siderophage testing.
- name: Exclusion of secondary diffuse alveolar hemorrhage causes
  description: >
    IPH is diagnosed only after excluding secondary causes such as infection,
    bronchiectasis, interstitial pneumonia, neoplasm, cardiovascular disease,
    coagulation disorders, connective-tissue disease, celiac disease, and
    systemic vasculitis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exclusion of other diseases, which are associated with diffuse alveolar hemorrhage, such as bronchiectasis, interstitial pneumonia, neoplasms, cardiovascular disease, coagulation disorders, infections, connective tissue diseases, celiac disease, and systemic vasculitis."
    explanation: The cohort's case definition supports exclusion of secondary DAH causes.
biochemical:
- name: Hemoglobin
  biomarker_term:
    preferred_term: Hemoglobin Measurement
    term:
      id: NCIT:C64848
      label: Hemoglobin Measurement
  loinc_term:
    id: LOINC:718-7
    label: Hemoglobin [Mass/volume] in Blood
  presence: Decreased (microcytic hypochromic anemia)
  context: >
    Decreased hemoglobin from chronic or recurrent intra-alveolar hemorrhage,
    often presenting as microcytic hypochromic anemia before overt hemoptysis.
  readouts:
  - target: Hemosiderin-laden alveolar macrophage accumulation
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Lower blood hemoglobin reflects cumulative intra-alveolar blood loss and
      functional sequestration of erythrocyte-derived iron inside alveolar
      macrophages.
    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A red blood cell morphology test was performed in 97 of the anemic patients, of whom 57 (58.8%) showed microcytic hypochromic anemia. Reticulocyte counts were recorded in 54 patients, of whom 53 (98.15%) had high reticulocyte counts."
      explanation: Documents microcytic hypochromic anemia with compensatory reticulocytosis in pediatric IPH.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A red blood cell morphology test was performed in 97 of the anemic patients, of whom 57 (58.8%) showed microcytic hypochromic anemia. Reticulocyte counts were recorded in 54 patients, of whom 53 (98.15%) had high reticulocyte counts."
    explanation: Demonstrates that microcytic hypochromic anemia is a predominant hematologic finding in pediatric IPH.
- name: Serum Iron
  loinc_term:
    id: LOINC:2498-4
    label: Iron [Mass/volume] in Serum or Plasma
  presence: Decreased
  context: >
    Systemic iron depletion resulting from intra-alveolar trapping of
    hemoglobin-derived iron within alveolar macrophages.
  readouts:
  - target: Hemosiderin-laden alveolar macrophage accumulation
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Decreased circulating iron reports functional systemic iron deficiency due
      to inability of alveolar macrophages to recycle pulmonary hemosiderin back
      to the bone marrow.
    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A total of 72 patients underwent an iron metabolism test, and 64 (88.9%) showed iron deficiency anemia. Serum iron tests were performed in 72 patients, and a decrease in iron levels was detected in 64 patients."
      explanation: Shows decreased serum iron in 64 of 72 tested pediatric IPH patients.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 72 patients underwent an iron metabolism test, and 64 (88.9%) showed iron deficiency anemia. Serum iron tests were performed in 72 patients, and a decrease in iron levels was detected in 64 patients."
    explanation: Confirms decreased serum iron in 88.9% of tested pediatric IPH patients.
- name: Transferrin Saturation
  biomarker_term:
    preferred_term: Transferrin Saturation Measurement
    term:
      id: NCIT:C98792
      label: Transferrin Saturation Measurement
  loinc_term:
    id: LOINC:2502-3
    label: Iron saturation [Mass Fraction] in Serum or Plasma
  presence: Decreased (accompanied by increased total iron-binding capacity in 45.1% of tested patients)
  context: >
    Reflects iron-restricted erythropoiesis secondary to alveolar hemosiderin
    sequestration.
  readouts:
  - target: Hemosiderin-laden alveolar macrophage accumulation
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Decreased transferrin saturation and elevated total iron-binding capacity
      indicate systemic iron deficiency despite abundant pulmonary hemosiderin
      stores.
    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transferrin saturation was decreased in 62 (91.2%) of 68 patients. Serum ferritin tests were normal in 60 of 62 tested patients. The total iron binding capacity was increased in 32 (45.07%) of 71 tested patients."
      explanation: Documents decreased transferrin saturation in 91.2% and increased TIBC in 45.07% of tested children with IPH.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin saturation was decreased in 62 (91.2%) of 68 patients. Serum ferritin tests were normal in 60 of 62 tested patients. The total iron binding capacity was increased in 32 (45.07%) of 71 tested patients."
    explanation: Establishes decreased transferrin saturation and elevated TIBC as characteristic iron-panel findings in IPH.
- name: Serum Ferritin
  biomarker_term:
    preferred_term: Serum Ferritin
    term:
      id: NCIT:C224202
      label: Serum Ferritin
  loinc_term:
    id: LOINC:2276-4
    label: Ferritin [Mass/volume] in Serum or Plasma
  presence: Normal in isolated IPH (60/62 pediatric patients); decreased when coexisting with celiac disease
  context: >
    Serum ferritin is typically normal in isolated IPH despite microcytic
    hypochromic anemia because of intra-alveolar hemosiderin loading, helping
    distinguish IPH from nutritional iron deficiency anemia; conversely, low
    serum ferritin in an IPH patient suggests coexisting celiac disease
    (Lane-Hamilton syndrome).
  readouts:
  - target: Hemosiderin-laden alveolar macrophage accumulation
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Preserved serum ferritin in the setting of low serum iron and microcytic
      anemia reflects macrophage hemosiderin storage in the lungs, whereas low
      ferritin prompts evaluation for celiac malabsorption.
    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although IPH and nutritional iron deficiency anemia are characterized by microcytic hypochromic anemia, patients with IPH have normal serum ferritin levels."
      explanation: Highlights normal serum ferritin as a key biochemical discriminator between isolated IPH and nutritional iron deficiency anemia.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although IPH and nutritional iron deficiency anemia are characterized by microcytic hypochromic anemia, patients with IPH have normal serum ferritin levels."
    explanation: Shows that isolated pediatric IPH maintains normal serum ferritin despite microcytic hypochromic anemia.
  - reference: PMID:35088581
    reference_title: "Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All pediatric patients with IPH should undergo screening for CD. Low serum ferritin in patients with IPH could be suggestive of coexisting CD. Strict GFD should be tried as the initial therapy."
    explanation: Indicates that low serum ferritin in pediatric IPH serves as a biochemical clue to coexisting celiac disease (Lane-Hamilton syndrome).
- name: Reticulocyte Count
  biomarker_term:
    preferred_term: Reticulocyte Count
    term:
      id: NCIT:C51947
      label: Reticulocyte Count
  presence: Increased (elevated in 98.15% of tested pediatric patients)
  context: >
    Compensatory bone marrow erythroid response to acute or recurrent alveolar

    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A red blood cell morphology test was performed in 97 of the anemic patients, of whom 57 (58.8%) showed microcytic hypochromic anemia. Reticulocyte counts were recorded in 54 patients, of whom 53 (98.15%) had high reticulocyte counts."
      explanation: Documents reticulocytosis in 53 of 54 tested pediatric IPH patients.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A red blood cell morphology test was performed in 97 of the anemic patients, of whom 57 (58.8%) showed microcytic hypochromic anemia. Reticulocyte counts were recorded in 54 patients, of whom 53 (98.15%) had high reticulocyte counts."
    explanation: Confirms high reticulocyte counts in 98.15% of tested patients.
- name: Serum Total Bilirubin
  biomarker_term:
    preferred_term: Serum Total Bilirubin Measurement
    term:
      id: NCIT:C61031
      label: Serum Total Bilirubin Measurement
  presence: Elevated in a subset of patients, particularly those with recurrent alveolar hemorrhage
  context: >
    Reflects catabolism of extravasated hemoglobin within alveolar spaces and
    correlates with recurrent disease course.
  readouts:
  - target: Hemosiderin-laden alveolar macrophage accumulation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >
      Elevated serum bilirubin from intra-alveolar heme degradation is
      significantly more frequent in children with recurrent IPH than in those
      who achieve sustained improvement.
    evidence:
    - reference: PMID:30278795
      reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The rate of elevated bilirubin levels was significantly higher in children who had recurrent IPH than in those who were healed or improved"
      explanation: Associates elevated bilirubin levels with recurrent IPH course in children.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of elevated bilirubin levels was significantly higher in children who had recurrent IPH than in those who were healed or improved"
    explanation: Supports serum bilirubin elevation as a prognostic correlate of recurrent pediatric IPH.
- name: Autoantibody Serology Panel (SMA, ANCA, ANA, Celiac Antibodies)
  biomarker_term:
    preferred_term: Autoantibody Measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  presence: Variable (in the French pediatric cohort, ANCA were positive in 40%, ANA in 45%, and celiac disease antibodies in 28% of screened patients; negative in cohorts strictly excluding seropositive cases)
  context: >
    Performed at presentation and follow-up both to exclude primary systemic
    vasculitis, anti-GBM disease, and connective tissue disease and to detect
    coexisting celiac disease or evolving autoimmune overlap.
  readouts:
  - target: Autoimmune serologic contribution to hemorrhage susceptibility
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Detection of SMA, ANCA, ANA, or celiac disease autoantibodies identifies
      patients with immune dysregulation or Lane-Hamilton syndrome.
    evidence:
    - reference: PMID:24125570
      reference_title: "New insights into pediatric idiopathic pulmonary hemosiderosis: the French RespiRare cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In screened patients, initial auto-immune screening revealed positive antineutrophilic cytoplasmic antibodies (ANCA) (n = 6, 40%), antinuclear antibodies (ANA) (n = 5, 45%) and specific coeliac disease antibodies (n = 4, 28%)."
      explanation: Documents ANCA, ANA, and celiac autoantibody positivity at initial screening in the French pediatric cohort.
  evidence:
  - reference: PMID:24125570
    reference_title: "New insights into pediatric idiopathic pulmonary hemosiderosis: the French RespiRare cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In screened patients, initial auto-immune screening revealed positive antineutrophilic cytoplasmic antibodies (ANCA) (n = 6, 40%), antinuclear antibodies (ANA) (n = 5, 45%) and specific coeliac disease antibodies (n = 4, 28%)."
    explanation: Supports routine autoimmune and celiac serologic screening in pediatric IPH.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations for antinuclear antibodies (ANA), anti-double-stranded DNA, antineutrophil cytoplasmic antibodies, antiglomerular basement membrane antibodies, antiphospholipid antibodies, and rheumatoid factor were negative in all patients."
    explanation: Shows that negative systemic vasculitis and connective tissue autoantibodies help exclude secondary causes of diffuse alveolar hemorrhage.
differential_diagnoses:
- name: Celiac Disease (Lane-Hamilton Syndrome)
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  description: >
    Coexistence of idiopathic pulmonary hemosiderosis and celiac disease, known
    as Lane-Hamilton syndrome (LHS), presents with diffuse alveolar hemorrhage
    and iron-deficiency anemia alongside gluten-sensitive enteropathy (often
    without overt gastrointestinal symptoms).
  distinguishing_features:
  - Positive celiac disease serology (anti-tissue transglutaminase IgA, anti-endomysial, or anti-gliadin antibodies) and duodenal villous atrophy on biopsy
  - Low serum ferritin from intestinal iron malabsorption, contrasting with the normal serum ferritin typical of isolated IPH
  - Clinical remission of alveolar hemorrhage and anemia upon adherence to a strict gluten-free diet in the majority of patients
  evidence:
  - reference: PMID:35088581
    reference_title: "Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nearly one-third of pediatric patients with IPH test positive for Celiac disease (CD) serology. Several hypothetical mechanisms have been proposed to unify the coexistence of these two entities, also referred to as Lane-Hamilton syndrome (LHS)."
    explanation: Establishes the high rate of celiac seropositivity in pediatric IPH and defines Lane-Hamilton syndrome.
  - reference: PMID:35088581
    reference_title: "Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All pediatric patients with IPH should undergo screening for CD. Low serum ferritin in patients with IPH could be suggestive of coexisting CD. Strict GFD should be tried as the initial therapy."
    explanation: Supports universal celiac screening in IPH, low ferritin as a discriminator for coexisting CD, and response to gluten-free diet.
  - reference: PMID:36324124
    reference_title: "Updates in idiopathic pulmonary hemosiderosis in 2022: A state of the art review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A substantial number of patients suffer from coexisting CD, also known as Lane-Hamilton syndrome (LHS), and all patients with IPH need to be evaluated for LHS by serology."
    explanation: Reinforces mandatory serologic evaluation for Lane-Hamilton syndrome in all IPH patients.
- name: Anti-Glomerular Basement Membrane Disease
  disease_term:
    preferred_term: anti-glomerular basement membrane disease
    term:
      id: MONDO:0009303
      label: anti-glomerular basement membrane disease
  description: >
    Autoimmune small-vessel disorder (Goodpasture disease) causing diffuse
    alveolar hemorrhage and iron-deficiency anemia that can clinically mimic IPH.
  distinguishing_features:
  - Presence of circulating anti-glomerular basement membrane (anti-GBM) antibodies
  - Concurrent rapidly progressive glomerulonephritis and linear IgG deposition along alveolar and glomerular basement membranes, which are absent in IPH
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations for antinuclear antibodies (ANA), anti-double-stranded DNA, antineutrophil cytoplasmic antibodies, antiglomerular basement membrane antibodies, antiphospholipid antibodies, and rheumatoid factor were negative in all patients."
    explanation: Demonstrates that anti-GBM antibodies are tested and must be negative to establish a diagnosis of IPH.
- name: Granulomatosis with Polyangiitis
  disease_term:
    preferred_term: granulomatosis with polyangiitis
    term:
      id: MONDO:0012105
      label: granulomatosis with polyangiitis
  description: >
    ANCA-associated systemic necrotizing small-vessel vasculitis that can
    present with acute diffuse alveolar hemorrhage, hemoptysis, and bilateral
    alveolar infiltrates resembling IPH.
  distinguishing_features:
  - Necrotizing pulmonary capillaritis or granulomatous vasculitis on lung biopsy, whereas IPH shows bland alveolar hemorrhage with siderophages and no vasculitis
  - Extrapulmonary vasculitic involvement (upper airway/sinonasal disease, pauci-immune glomerulonephritis, systemic vasculitis)
  evidence:
  - reference: PMID:15293620
    reference_title: "Idiopathic pulmonary haemosiderosis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the lung biopsy shows numerous siderophages in the alveoli, without any evidence of pulmonary vasculitis"
    explanation: Absence of pulmonary vasculitis on biopsy differentiates IPH from systemic necrotizing vasculitides.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exclusion of other diseases, which are associated with diffuse alveolar hemorrhage, such as bronchiectasis, interstitial pneumonia, neoplasms, cardiovascular disease, coagulation disorders, infections, connective tissue diseases, celiac disease, and systemic vasculitis."
    explanation: Identifies systemic vasculitis as a required exclusion in the differential diagnosis of diffuse alveolar hemorrhage.
- name: Systemic Lupus Erythematosus
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  description: >
    Systemic autoimmune connective tissue disease capable of causing secondary
    diffuse alveolar hemorrhage and pulmonary hemosiderosis.
  distinguishing_features:
  - Positive anti-double-stranded DNA (anti-dsDNA) or antiphospholipid antibodies and hypocomplementemia
  - Multiorgan lupus manifestations (nephritis, arthritis, mucocutaneous lesions, serositis) and immune-complex deposition on biopsy
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations for antinuclear antibodies (ANA), anti-double-stranded DNA, antineutrophil cytoplasmic antibodies, antiglomerular basement membrane antibodies, antiphospholipid antibodies, and rheumatoid factor were negative in all patients."
    explanation: Excludes systemic lupus erythematosus and related connective tissue diseases via negative anti-dsDNA, ANA, and antiphospholipid serologies.
- name: Nutritional Iron Deficiency Anemia
  description: >
    The most common initial misdiagnosis of pediatric IPH (accounting for 24/107
    patients in a large pediatric series and 60.0% of misdiagnosed patients in
    an international physician survey), because occult alveolar bleeding often
    presents with isolated microcytic hypochromic anemia, pallor, and fatigue
    before hemoptysis occurs.
  distinguishing_features:
  - Decreased serum ferritin in nutritional iron deficiency anemia versus normal serum ferritin in 60 of 62 tested children with isolated IPH
  - Presence of hemosiderin-laden macrophages in sputum, gastric lavage fluid, or bronchoalveolar lavage fluid, pulmonary infiltrates on chest imaging, and reticulocytosis
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although IPH and nutritional iron deficiency anemia are characterized by microcytic hypochromic anemia, patients with IPH have normal serum ferritin levels."
    explanation: Explains how normal serum ferritin distinguishes IPH from nutritional iron deficiency anemia despite shared microcytic hypochromic morphology.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misdiagnoses included the following: nutritional iron deficiency anemia (n = 24), bronchial pneumonia (n = 21), pulmonary tuberculosis (n = 6), hemolytic anemia (n = 4), upper respiratory tract infection (n = 4), bronchiectasis (n = 3), myocarditis (n = 1), intestinal diseases (n=1), and favism (n = 1)."
    explanation: Documents that nutritional iron deficiency anemia was the most frequent misdiagnosis (24 of 107 pediatric patients).
  - reference: PMID:26289251
    reference_title: "A physician survey reveals differences in management of idiopathic pulmonary hemosiderosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "63.3 % of respondents had patients that were initially misdiagnosed with anemia (60.0 %) or gastrointestinal bleed (18.2 %)."
    explanation: Documents that isolated anemia is the single most frequent initial misdiagnosis of IPH across international centers.
- name: Tuberculosis
  disease_term:
    preferred_term: tuberculosis
    term:
      id: MONDO:0018076
      label: tuberculosis
  description: >
    Pulmonary tuberculosis and bacterial bronchopneumonia are frequent
    infectious misdiagnoses in children presenting with cough, hemoptysis,
    fever, and pulmonary infiltrates prior to siderophage testing.
  distinguishing_features:
  - Microbiological or molecular detection of Mycobacterium tuberculosis and absence of diffuse alveolar siderophages
  - Lack of iron-sequestration microcytic anemia with normal ferritin and response to antituberculous therapy rather than corticosteroids
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exclusion of other diseases, which are associated with diffuse alveolar hemorrhage, such as bronchiectasis, interstitial pneumonia, neoplasms, cardiovascular disease, coagulation disorders, infections, connective tissue diseases, celiac disease, and systemic vasculitis."
    explanation: Confirms that pulmonary infections are major mimics that must be excluded when diagnosing IPH.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misdiagnoses included the following: nutritional iron deficiency anemia (n = 24), bronchial pneumonia (n = 21), pulmonary tuberculosis (n = 6), hemolytic anemia (n = 4), upper respiratory tract infection (n = 4), bronchiectasis (n = 3), myocarditis (n = 1), intestinal diseases (n=1), and favism (n = 1)."
    explanation: Documents that bronchial pneumonia (n = 21) and pulmonary tuberculosis (n = 6) are frequent infectious misdiagnoses of pediatric IPH.
treatments:
- name: Systemic corticosteroid therapy
  description: >
    Systemic corticosteroids are first-line therapy for acute episodes and are
    commonly used for initial control and maintenance, though recurrence during
    tapering is frequent.
  target_mechanisms:
  - target: Recurrent idiopathic diffuse alveolar hemorrhage
    description: Suppresses acute alveolar capillary bleeding and reduces relapse frequency.
  - target: Autoimmune serologic contribution to hemorrhage susceptibility
    description: Attenuates immune-mediated inflammatory contributions to alveolar hemorrhage.
  - target: Recurrent hemorrhage-driven lung injury and remodeling
    description: Limits hemorrhage-driven alveolar inflammation and progression toward pulmonary fibrosis.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucocorticoids and immunosuppressive agents are the first choice for treating IPH."
    explanation: The pediatric cohort review supports glucocorticoids as first-choice treatment.
  - reference: PMID:26289251
    reference_title: "A physician survey reveals differences in management of idiopathic pulmonary hemosiderosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common medications respondents used for treatment at initial presentation and chronic maintenance therapy were corticosteroids (98.7 and 84.0 %, initial and chronic therapy respectively)"
    explanation: The international physician survey supports common corticosteroid use for initial and chronic therapy.
  - reference: PMID:33184706
    reference_title: "Idiopathic pulmonary hemosiderosis: a review of the treatments used during the past 30 years and future directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Corticosteroid therapy represents the first line of treatment"
    explanation: The treatment review supports corticosteroids as first-line therapy.
- name: Steroid-sparing immunosuppressive therapy
  description: >
    Hydroxychloroquine, azathioprine, cyclophosphamide, mycophenolate mofetil,
    and other immunomodulatory agents have been used when disease is severe,
    recurrent, steroid-refractory, or steroid-toxic.
  target_mechanisms:
  - target: Recurrent idiopathic diffuse alveolar hemorrhage
    description: Reduces frequency of alveolar hemorrhage flares during corticosteroid taper or refractory disease.
  - target: Autoimmune serologic contribution to hemorrhage susceptibility
    description: Modulates autoimmune and lymphocyte-mediated contributors to alveolar bleeding.
  - target: Recurrent hemorrhage-driven lung injury and remodeling
    description: Prevents cumulative hemorrhage-induced alveolar remodeling and fibrotic progression.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  evidence:
  - reference: PMID:33184706
    reference_title: "Idiopathic pulmonary hemosiderosis: a review of the treatments used during the past 30 years and future directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additional immunomodulatory/immunosuppressive medications have been used with varying success, especially in the setting of steroid-refractory disease."
    explanation: The treatment review supports steroid-sparing immunosuppression for steroid-refractory IPH.
  - reference: PMID:30806370
    reference_title: "Early Initiation of Steroid-sparing Drugs in Idiopathic Pulmonary Hemosiderosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We initiated hydroxy-chloroquine and azathioprine early in treatment along with steroids in seven children with idiopathic pulmonary hemosiderosis"
    explanation: The pediatric series supports hydroxychloroquine and azathioprine as steroid-sparing options used with corticosteroids.
  - reference: PMID:30806370
    reference_title: "Early Initiation of Steroid-sparing Drugs in Idiopathic Pulmonary Hemosiderosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early introduction of second line immunosuppressants helped in reducing disease flare and steroid toxicity without serious adverse effects."
    explanation: The series supports benefit of early steroid-sparing immunosuppression in seven children.
  - reference: PMID:33184706
    reference_title: "Idiopathic pulmonary hemosiderosis: a review of the treatments used during the past 30 years and future directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cyclophosphamide, azathioprine, hydroxychloroquine, mycophenolate mofetil, and mesenchymal cell transplantation have been attempted to improve outcome and reduce side effects."
    explanation: The treatment review specifically names cyclophosphamide and mycophenolate mofetil among attempted steroid-sparing options.
- name: Supportive care for acute anemia and respiratory compromise
  description: >
    Supportive management includes acute stabilization, oxygen or respiratory
    support when needed, and transfusion for severe anemia while disease-directed
    immunosuppression is initiated.
  target_mechanisms:
  - target: Iron deficiency anemia
    description: Corrects severe acute or chronic anemia via red blood cell transfusion and iron repletion.
  - target: Respiratory failure
    description: Stabilizes gas exchange during acute diffuse alveolar hemorrhage episodes.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the 107 patients were provided symptomatic treatments before diagnosis, and 29 received blood transfusions."
    explanation: The pediatric cohort documents symptomatic care and transfusion in a subset before definitive diagnosis.
notes: >
  Pulmonary hemosiderosis in this entry follows the idiopathic pulmonary
  hemosiderosis concept mapped by ORPHA:99931 and MONDO:0008346. Celiac disease
  with pulmonary hemosiderosis is represented separately as Lane-Hamilton
  syndrome; IPH should be evaluated for that association but is not itself
  defined by gluten sensitivity. Etiologic hypotheses include environmental,
  allergic, autoimmune, and genetic contributors, but none is established enough
  to curate as a single upstream causal node.

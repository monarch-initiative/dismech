name: Pulmonary Hemosiderosis
category: Respiratory Disease
creation_date: "2026-05-09T18:28:00Z"
synonyms:
- Idiopathic pulmonary hemosiderosis
- IPH
- Idiopathic pulmonary haemosiderosis
- Pulmonary haemosiderosis
description: >
  Pulmonary hemosiderosis is a rare respiratory disorder, usually represented
  clinically by idiopathic pulmonary hemosiderosis, in which recurrent diffuse
  alveolar hemorrhage causes blood to enter alveolar spaces. Alveolar
  macrophages ingest erythrocytes and accumulate hemosiderin, producing
  hemosiderin-laden macrophages in sputum, gastric aspirate, bronchoalveolar
  lavage, or lung tissue. Patients commonly present in childhood with iron
  deficiency anemia, cough, hemoptysis, pulmonary infiltrates or ground-glass
  opacities, dyspnea, and relapsing pulmonary hemorrhage. The initiating cause is
  idiopathic after exclusion of infections, cardiac disease, coagulation
  disorders, connective-tissue disease, vasculitis, celiac disease/Lane-Hamilton
  syndrome, and other secondary causes of diffuse alveolar hemorrhage.
disease_term:
  preferred_term: pulmonary hemosiderosis
  term:
    id: MONDO:0008346
    label: pulmonary hemosiderosis
parents:
- Respiratory disease
- Hemosiderosis
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    notes: >
      Diffuse alveolar hemorrhage disorder characterized by recurrent
      intra-alveolar bleeding, alveolar siderophage accumulation, and potential
      progression to interstitial fibrosis and restrictive lung disease.
    evidence:
    - reference: PMID:15293620
      reference_title: "Idiopathic pulmonary haemosiderosis revisited."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Idiopathic pulmonary haemosiderosis is a rare cause of diffuse alveolar haemorrhage of unknown aetiology."
      explanation: Establishes idiopathic pulmonary hemosiderosis as a primary diffuse alveolar hemorrhage disorder of the respiratory system.
      quote_role: REVIEW_SYNTHESIS
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >
      Frequently associated with circulating autoantibodies (SMA, ANCA, ANA, or
      celiac autoantibodies) and managed with systemic corticosteroids and
      steroid-sparing immunosuppressive therapy.
    evidence:
    - reference: PMID:24125570
      reference_title: "New insights into pediatric idiopathic pulmonary hemosiderosis: the French RespiRare cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis of potential contributors supports a role of auto-immunity in disease development and highlights the importance of genetic factors."
      explanation: Supports immune-mediated pathogenesis in a substantial clinical subset of pediatric IPH.
inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >
    Idiopathic pulmonary hemosiderosis occurs sporadically in the vast majority
    of patients, although occasional familial clustering and overrepresentation
    of Down syndrome (trisomy 21) in pediatric cohorts suggest underlying
    genetic or immunogenetic susceptibility factors.
  evidence:
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the patients were sporadic patients, comprising 42 boys and 65 girls."
    explanation: All 107 pediatric IPH cases in the largest single-center cohort were sporadic.
  - reference: PMID:30278795
    reference_title: "Clinical characteristics and prognosis of idiopathic pulmonary hemosiderosis in pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present study, all of our patients were sporadic, with the highest incidence among 3- to 6-year-olds, similar to patients reported in previous studies."
    explanation: Confirms sporadic occurrence across the cohort and consistency with prior pediatric series.

- accession: geo:GSE282042
  title: RNA-seq analysis of human monocytes in patients with and without coronary atherosclerosis
  description: 'We conducted RNA-Seq transcriptome profiling on monocytes isolated from patients undergoing coronary angiography. After the procedure, patients were divided into two groups: those without coronary artery stenosis ("w.o. CA", n=11) and those with coronary artery stenosis ("w. CA", n=9). All patients were men, aged 61±6 years. CD14+ monocytes were isolated, and RNA-seq was performed on the Illumina NextSeq 2000 platform. This data was analyzed to identify changes in gene expression profiles associated with coronary atherosclerosis. Transcriptome analysis revealed an upregulation of numerous inflammatory genes.'

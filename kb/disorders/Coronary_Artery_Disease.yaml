- name: Icosapent Ethyl
  description: >-
    In REDUCE-IT, adjunctive icosapent ethyl 4 g/day reduced composite ischemic
    events versus placebo in selected statin-treated adults with established
    cardiovascular disease or diabetes plus risk factors and persistent
    triglyceride elevation. Hospitalization for atrial fibrillation or flutter
    was more frequent. The trial population was broader than coronary artery
    disease alone, and neither the mediating mechanism nor the benefit magnitude
    versus an inert non-mineral-oil comparator is established.

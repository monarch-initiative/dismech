name: Coronary Artery Disease
creation_date: '2025-12-18T17:01:35Z'
updated_date: '2026-02-17T21:53:14Z'
description: >-
  Coronary artery disease (CAD) is the narrowing or obstruction of the coronary
  arteries by atherosclerotic plaque, driven by endothelial dysfunction, lipid
  accumulation, and chronic vascular inflammation. Progressive luminal stenosis
  produces a mismatch between myocardial oxygen supply and demand, causing
  angina, while plaque rupture with superimposed thrombosis precipitates acute
  coronary syndromes and myocardial infarction.
category: Complex
parents:
- Cardiovascular Disease
- Atherosclerotic Disease

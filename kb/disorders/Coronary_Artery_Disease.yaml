    risk. Low physical activity is associated with metabolic syndrome, but sedentary
    behaviour measured as screen time is not, so the metabolic-syndrome route is not
    a settled mechanism for this exposure.
  review_notes: The prior note read simply that a sedentary lifestyle contributes to
    metabolic syndrome. The cited meta-analysis separates low physical activity from
    sedentary behaviour and finds only the former significantly associated with
    metabolic syndrome, so the note was split accordingly rather than left as a flat
    claim. That meta-analysis is in adolescents and does not settle the question in
    adults; it is enough to show the claim needs qualifying, not enough to refute it.
  evidence:
  - reference: PMID:15364185
    reference_title: "Effect of potentially modifiable risk factors associated with myocardial infarction in 52 countries (the INTERHEART study): case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "regular physical activity (0.86, PAR 12.2%)"
    explanation: "INTERHEART reports regular physical activity as protective against myocardial infarction with a population attributable risk of 12.2 percent for its absence, which is the evidence that inactivity is a risk factor for this disease."
  - reference: PMID:27997601
    reference_title: "Physical Activity, Sedentary Behavior, Cardiorespiratory Fitness and Metabolic Syndrome in Adolescents: Systematic Review and Meta-Analysis of Observational Evidence."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "for sedentary behavior, represented by screen time > 2 hours/day, a significant association was not identified"
    explanation: "Cited as a caveat, not support. This meta-analysis of eighteen studies found low physical activity significantly associated with metabolic syndrome, but sedentary behaviour measured as screen time was NOT significantly associated overall - only on weekends in subgroup analysis. It is an adolescent population, so it does not settle the question in adults, but it is enough to show the metabolic-syndrome mechanism should not be stated flatly."
- name: Obesity

- name: Icosapent Ethyl
  description: >-
    In REDUCE-IT, adjunctive icosapent ethyl 4 g/day reduced composite ischemic
    events versus a mineral-oil comparator in selected statin-treated adults
    with established cardiovascular disease or diabetes plus risk factors and
    persistent triglyceride elevation. Hospitalization for atrial fibrillation
    or flutter was more frequent. The trial population was broader than
    coronary artery disease alone, and neither the mediating mechanism nor the
    benefit magnitude versus an inert non-mineral-oil comparator is established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: icosapent ethyl
      term:
        id: CHEBI:84883
        label: ethyl (5Z,8Z,11Z,14Z,17Z)-icosapentaenoate
  evidence:
  - reference: PMID:30415628
    reference_title: Cardiovascular Risk Reduction with Icosapent Ethyl for Hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A primary end-point event occurred in 17.2% of the patients in the
      icosapent ethyl group, as compared with 22.0% of the patients in the
      placebo group
    explanation: >-
      REDUCE-IT directly establishes the randomized composite-event contrast in
      its selected high-risk, statin-treated population.
  - reference: PMID:35261279
    reference_title: "Treatment With Icosapent Ethyl to Reduce Ischemic Events in Patients With Prior Percutaneous Coronary Intervention: Insights From REDUCE-IT PCI."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients treated with icosapent ethyl versus placebo, there was a
      34% reduction in the primary composite end point
    explanation: >-
      This post hoc analysis of 3408 REDUCE-IT participants with prior PCI
      reported HR 0.66 (95% CI, 0.58-0.76) for this endpoint, supporting
      applicability of the randomized event contrast to a coronary subgroup.
      It does not identify a mediator, was not a separate randomized trial of
      coronary disease, and retains the parent trial's mineral-oil comparison.
  - reference: PMID:30415628
    reference_title: Cardiovascular Risk Reduction with Icosapent Ethyl for Hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A larger percentage of patients in the icosapent ethyl group than in the
      placebo group were hospitalized for atrial fibrillation or flutter (3.1%
      vs. 2.1%, P=0.004).
    explanation: >-
      The randomized safety result bounds an unqualified cardioprotective
      interpretation.
  - reference: PMID:38873793
    reference_title: Randomized Trial for Evaluation in Secondary Prevention Efficacy of Combination Therapy-Statin and Eicosapentaenoic Acid (RESPECT-EPA).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events did not differ between the groups, but the rate of
      new-onset atrial fibrillation was significantly higher in the EPA group
      (3.1% versus 1.6%; P=0.017).
    explanation: >-
      This randomized, open-label Japanese stable-CAD comparison of EPA 1.8
      g/day with control independently supports an atrial-fibrillation safety
      signal without a mineral-oil placebo. Its different dose and design limit
      quantitative transfer to REDUCE-IT.

- accession: geo:GSE310095
  title: Whole Blood Transcriptomics Differentiates Circulating Gene Expression Between Coronary Artery Disease and Peripheral Artery Disease
  description: Coronary artery disease (CAD) and peripheral artery disease (PAD) are prevalent atherosclerotic disorders that exhibit distinct clinical and pathological presentations. We used whole-blood RNA sequencing to investigate circulating transcriptomic differences between PAD and CAD. Whole-blood RNA sequencing was performed in 71 subjects 40-65 years of age with symptomatic PAD (n=20) or CAD (n=51). Patients with concomitant PAD and CAD were excluded. Differential expression analysis was performed to compare circulating gene expression in patients with PAD and patients with CAD. We identified 106 genes differentially expressed between PAD and CAD (p adj. < 0.1).

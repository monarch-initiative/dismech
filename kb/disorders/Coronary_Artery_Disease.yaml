    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants in REDUCE-IT, allocation to icosapent ethyl had minimal
      effects on a series of biomarkers associated with atherosclerotic disease,
      whereas levels increased among those allocated to mineral oil.
    explanation: >-
      Randomized longitudinal biomarker data show that relative inflammatory
      differences cannot be interpreted as direct biomarker lowering by
      icosapent ethyl.

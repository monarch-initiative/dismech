  review_notes: Two separate caveats. First, obesity is a disease entity with its own
    MONDO identity, not an environmental exposure, so this entry is modelling a host
    state in the environmental block - the pattern tracked by issue 8551. It is cited
    here rather than left bare because the evidence is real and moves with the entry
    if it is later re-homed. Second, the prior note asserted association with
    dyslipidemia and inflammation; the cited source establishes the association with
    myocardial infarction, not that mechanism, so the note was narrowed.

  title: TAILS identifies candidate substrates and biomarkers of ADAMTS7, a therapeutic protease target in coronary artery disease
  description: MacDonald BT, Keshishian H, Mundorff CC, Arduini A, Lai D, Bendinelli K, Popp NR, Bhandary B, Clauser KR, Specht H, Elowe NH, Laprise D, Xing Y, Kaushik VK, Carr SA, Ellinor PT. Loss-of-function mutations in the secreted enzyme ADAMTS7 (a disintegrin and metalloproteinase with thrombospondin motifs 7) are associated with protection for coronary artery disease (CAD). ADAMTS7 catalytic inhibition has been proposed as a therapeutic strategy for treating CAD; however, the lack of an endogenous substrate has hindered the development of activity-based biomarkers.

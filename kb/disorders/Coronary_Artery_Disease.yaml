discussions:
- discussion_id: cad_pgsxc_reverse_causation
  prompt: >-
    Are the CAD PGS×context interactions driven by adverse exposures causally
    amplifying genetic risk, or are some "contexts" actually downstream readouts
    of incipient disease (reverse causation)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Endothelial Dysfunction
  - biochemical#LDL Cholesterol
  - biochemical#C-Reactive Protein
  - environmental#Smoking
  rationale: >-
    Population PGS×context analyses (Nagpal & Gibson 2026,
    PMID:42443528) are largely unable to establish the
    causality of specific contexts. dismech separates true environmental
    exposures (smoking, high-fat diet, sedentary lifestyle) from biochemical
    readouts (LDL, HDL, C-reactive protein); the biochemical "contexts" are prime
    reverse-causation suspects, since they may be partly downstream of the
    atherosclerotic process rather than upstream drivers, and behavioural
    contexts such as reduced physical activity may be rapid responses to
    incipient angina rather than causes. Distinguishing genuine amplification of
    genetic effects from reverse causation determines whether the modelled
    interventions (e.g. lowering cholesterol in high-PGS smokers) would actually
    reduce risk.
  proposed_experiments:
  - experiment_id: cad_pgsxc_mr_direction
    name: Mendelian randomization of exposure-to-CAD direction across PGS strata
    description: >-
      Use bidirectional / multivariable Mendelian randomization to test whether
      each candidate context (LDL, HDL, C-reactive protein, smoking) causally
      affects CAD versus being a consequence of subclinical disease, and whether
      the causal effect estimate scales with polygenic liability as the
      amplification model predicts.
    decision_criterion: >-
      A context is retained as a causal amplifier if MR supports
      exposure-to-disease directionality and the exposure-attributable risk
      difference increases across increasing PGS strata; it is flagged as a
      reverse-causation suspect otherwise.
  - experiment_id: cad_pgsxc_prospective_temporal
    name: Prospective incident-CAD analysis restricted to pre-diagnosis exposure
      windows
    description: >-
      Restrict exposures to measurements taken well before diagnosis and repeat
      the PGS×context liability-threshold modelling on incident cases only, to
      reduce the chance that exposure values reflect behavioural responses to
      early disease.
    decision_criterion: >-
      Amplification is supported if the PGS×context deviation from additivity
      persists when only pre-diagnosis exposure windows and incident cases are
      used.
- discussion_id: gap_icosapent_ethyl_event_reduction_mechanism
  prompt: >-
    Which, if any, pathway beyond change in circulating triglyceride
    concentration causally mediates the cardiovascular-event contrast observed
    with high-dose icosapent ethyl: coronary plaque remodeling; altered
    apolipoprotein-B/remnant burden, composition, trafficking, or retention;
    platelet effects; inflammatory resolution; endothelial effects; or membrane
    stabilization and reduced lipid oxidation? How much of the contrast reflects
    the mineral-oil comparator?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Icosapent Ethyl
  - mechanistic_hypothesis#icosapent_ethyl_coronary_plaque_remodeling_model
  - mechanistic_hypothesis#icosapent_ethyl_atherogenic_particle_lowering_model
  - pathophysiology#Atherosclerotic Plaque Formation
  - pathophysiology#Endothelial Dysfunction
  - pathophysiology#Plaque Rupture and Thrombosis
  - biochemical#C-Reactive Protein
  rationale: >-
    REDUCE-IT established an ischemic-event contrast between icosapent ethyl and
    a mineral-oil comparator but did not identify a mediator. The seed review
    explicitly states that triglyceride lowering does not fully explain the
    benefit. The small 80-patient EVAPORATE trial observed differential
    CT-plaque change against mineral oil after adjustment for baseline
    triglyceride, but plaque is a surrogate and the study did not test
    treatment-to-plaque-to-event mediation. In the REDUCE-IT biomarker substudy,
    icosapent ethyl produced minimal change in several inflammatory and
    lipid-oxidation markers while those markers increased among participants
    assigned to mineral oil; without an inert third arm, relative biomarker
    differences do not establish direct icosapent lowering or mineral-oil
    causation. Focused research found a lower-dose EPA plaque-volume signal in
    CHERRY, no overall fibrous-cap-thickness benefit in a separate three-arm
    trial, and short-term IPE-associated atherogenic-particle reductions in
    ANCHOR; none tested clinical mediation. A post hoc REDUCE-IT prior-PCI
    subgroup supports transfer of the event contrast to coronary disease but
    remains a subgroup analysis against mineral oil. RESPECT-EPA, an open-label
    1.8-g/day Japanese stable-CAD trial without an oil placebo, reported a
    nonsignificant primary endpoint, a significant secondary coronary composite,
    and more new-onset atrial fibrillation; it supplies a coronary signal from a
    comparison that did not use mineral oil but does not establish a mechanism.
    STRENGTH found no event benefit for a distinct EPA/DHA carboxylic-acid
    formulation against corn oil intended as an inert comparator. That result
    constrains class-wide omega-3 inference but does not directly test purified
    IPE or distinguish its candidate pathways.
    Plaque remodeling; remnant-particle composition, number, trafficking, and
    arterial retention; platelet biology; specialized inflammatory resolution;
    endothelial function; and membrane or lipid-oxidation effects remain
    candidates rather than established mechanisms. Baseline-subgroup,
    achieved-EPA, and other postrandomization associations cannot substitute
    for randomized temporal mediation.
  proposed_experiments:
  - experiment_id: exp_icosapent_multicomparator_temporal_mediation_trial
    name: >-
      Multi-comparator icosapent trial with prospective temporal mediation
    description: >-
      Embed an independently analyzed mechanistic substudy in an adequately
      powered, double-blind cardiovascular-outcome trial of icosapent ethyl
      4 g/day versus a metabolically inert, non-mineral-oil matched placebo.
      Enroll people with documented coronary atherosclerosis, persistent
      triglyceride elevation, stable lipid-lowering and antiplatelet therapy,
      and prespecified diabetes, sex, renal-function, and baseline-plaque
      strata.
      Add a randomized, chemically distinct triglyceride-lowering comparator
      arm, powered for mechanistic and plaque contrasts and prospectively
      titrated to approximate the icosapent arm's triglyceride trajectory.
      Where ethics and safety oversight permit, include a time-limited
      mineral-oil calibration arm to estimate short-term comparator effects on
      biomarkers. That calibration cannot determine mineral oil's contribution
      to a multi-year clinical-event contrast.
    experiment_type:
      preferred_term: randomized temporal causal-mediation trial
    perturbations:
    - name: Icosapent ethyl 4 g/day
      target: treatment#Icosapent Ethyl
      description: >-
        Randomize purified icosapent ethyl with adherence measured independently
        of achieved eicosapentaenoic-acid concentration.
    readouts:
    - name: Atherogenic-particle and remnant trajectories
      target: mechanistic_hypothesis#icosapent_ethyl_atherogenic_particle_lowering_model
      description: >-
        Measure triglycerides, apolipoprotein B and particle number, remnant
        cholesterol and composition, and proteoglycan binding before plaque or
        event divergence.
      assays:
      - preferred_term: longitudinal lipoprotein particle and remnant profiling
      direction: NEGATIVE
    - name: Prespecified non-particle mediator trajectories
      target: mechanistic_hypothesis#icosapent_ethyl_coronary_plaque_remodeling_model
      description: >-
        Measure EPA/arachidonic-acid lipid mediators, specialized pro-resolving
        mediators, high-sensitivity C-reactive protein, interleukin-6,
        endothelial function, platelet COX-1/thromboxane activity and
        reactivity, membrane lipid order and oxidative susceptibility, oxidized
        LDL, and achieved EPA before plaque or event divergence.
      assays:
      - preferred_term: longitudinal lipidomic, lipoprotein, and membrane-biophysics
          profiling
      - preferred_term: inflammatory-resolution and platelet functional assay
      direction: THRESHOLD_DEPENDENT
    - name: Coronary plaque change
      target: pathophysiology#Atherosclerotic Plaque Formation
      description: >-
        Quantify low-attenuation, noncalcified, and total plaque with a blinded
        central CCTA core and a prespecified OCT or IVUS substudy.
      assays:
      - preferred_term: serial coronary computed tomographic angiography
      - preferred_term: intravascular plaque imaging
      direction: NEGATIVE
    - name: Adjudicated cardiovascular and safety outcomes
      target: treatment#Icosapent Ethyl
      description: >-
        Adjudicate myocardial infarction, stroke, revascularization,
        cardiovascular death, atrial fibrillation or flutter, and serious
        bleeding without using a surrogate as the clinical endpoint.
      assays:
      - preferred_term: blinded cardiovascular event adjudication
      direction: THRESHOLD_DEPENDENT
    controls:
    - name: Inert matched placebo
      description: >-
        Use a sensory-matched comparator shown in a run-in study not to alter
        lipids, inflammatory biomarkers, renal function, or platelet assays.
    - name: Triglyceride-matched active comparator
      description: >-
        Randomize a chemically distinct triglyceride-lowering intervention and
        use blinded dose adaptation to approximate the icosapent arm's
        triglyceride trajectory without matching achieved EPA exposure. Analyze
        apolipoprotein-B and remnant-particle differences explicitly rather than
        assuming that triglyceride matching equalizes them.
    - name: Time-limited mineral-oil calibration control
      description: >-
        If approved, randomize a short mechanistic calibration arm with stopping
        rules. Use it only to estimate short-term biomarker effects, not to
        attribute the long-term clinical-event contrast.
    - name: Background-therapy and implementation controls
      description: >-
        Standardize statin, antiplatelet, diet, and diabetes therapy; monitor
        placebo and active-comparator effects, adherence, renal function, and
        treatment crossover.
    - name: Mediation-analysis controls
      description: >-
        Prespecify temporal ordering, multiplicity correction, missing-data
        handling, exposure-induced mediator-outcome confounding, and sensitivity
        analyses that do not condition only on achieved EPA levels.
    decision_criterion: >-
      A candidate mediator is supported only if randomization changes it versus
      the inert comparator before plaque or clinical divergence and a
      prespecified treatment-to-mediator-to-endpoint indirect effect replicates.
      If mineral oil worsens a marker while icosapent and inert placebo do not
      differ, comparator worsening explains that short-term marker contrast,
      while its contribution to long-term events remains unresolved. A
      lipid-mediated explanation requires prespecified interventional indirect-
      and direct-effect estimands, explicit identification assumptions, and
      sensitivity analyses to be consistent with full mediation and little or
      no residual direct effect; ordinary adjustment for postrandomization
      triglyceride, apolipoprotein-B, remnant, or achieved-EPA measures is
      insufficient. If plaque trajectories are similar to the
      triglyceride-matched active comparator, that weakens evidence for an
      icosapent-specific effect but does not refute icosapent-induced remodeling
      without prespecified equivalence margins, adequate precision, and
      assumptions excluding the comparator's own plaque effects. Refute this
      hypothesis only if the icosapent-versus-inert contrast excludes a
      prespecified clinically meaningful plaque effect or a well-identified
      mediation analysis excludes a clinically meaningful plaque-mediated
      indirect effect. No biomarker or imaging association alone establishes
      mediation.
    would_support:
    - mechanistic_hypothesis#icosapent_ethyl_coronary_plaque_remodeling_model
    - mechanistic_hypothesis#icosapent_ethyl_atherogenic_particle_lowering_model
    would_refute:
    - mechanistic_hypothesis#icosapent_ethyl_coronary_plaque_remodeling_model
    - mechanistic_hypothesis#icosapent_ethyl_atherogenic_particle_lowering_model
  evidence:
  - reference: PMID:42397965
    reference_title: Rethinking triglycerides in the management of ASCVD.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Icosapent ethyl has demonstrated reductions in major adverse cardiovascular
      events, although the mechanism of benefit remains incompletely understood
      and is not explained entirely by triglyceride lowering.
    explanation: >-
      The seed review directly defines the unresolved mechanism but does not
      establish any proposed mediator.
  - reference: PMID:35762321
    reference_title: "Effects of Randomized Treatment With Icosapent Ethyl and a Mineral Oil Comparator on Interleukin-1β, Interleukin-6, C-Reactive Protein, Oxidized Low-Density Lipoprotein Cholesterol, Homocysteine, Lipoprotein(a), and Lipoprotein-Associated Phospholipase A2: A REDUCE-IT Biomarker Substudy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants in REDUCE-IT, allocation to icosapent ethyl had minimal
      effects on a series of biomarkers associated with atherosclerotic disease,
      whereas levels increased among those allocated to mineral oil.
    explanation: >-
      Randomized longitudinal biomarker data show that relative inflammatory
      differences cannot be interpreted as direct biomarker lowering by
      icosapent ethyl.
  - reference: PMID:35762321
    reference_title: "Effects of Randomized Treatment With Icosapent Ethyl and a Mineral Oil Comparator on Interleukin-1β, Interleukin-6, C-Reactive Protein, Oxidized Low-Density Lipoprotein Cholesterol, Homocysteine, Lipoprotein(a), and Lipoprotein-Associated Phospholipase A2: A REDUCE-IT Biomarker Substudy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The effect of these findings on interpretation of the overall risk
      reductions in clinical events observed within REDUCE-IT is uncertain.
    explanation: >-
      The investigators explicitly preserve uncertainty about how mineral-oil
      biomarker changes affect interpretation of the event contrast.
  - reference: PMID:38873793
    reference_title: Randomized Trial for Evaluation in Secondary Prevention Efficacy of Combination Therapy-Statin and Eicosapentaenoic Acid (RESPECT-EPA).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Icosapent ethyl treatment resulted in a numerically lower risk of
      cardiovascular events that did not reach statistical significance in
      patients with chronic coronary artery disease, a low EPA/AA ratio, and
      statin treatment.
    explanation: >-
      This 1.8-g/day, open-label Japanese stable-CAD trial reported a
      nonsignificant primary endpoint. Its direction is compatible with a
      product effect outside the REDUCE-IT comparison, but it neither
      establishes a mechanism nor quantifies any mineral-oil contribution.
  - reference: PMID:38873793
    reference_title: Randomized Trial for Evaluation in Secondary Prevention Efficacy of Combination Therapy-Statin and Eicosapentaenoic Acid (RESPECT-EPA).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meanwhile, the secondary composite end point of coronary events in the EPA
      group was significantly lower
    explanation: >-
      The reported HR was 0.73 (95% CI, 0.55-0.97). This significant secondary
      coronary composite supplies event evidence from a comparison that did not
      use mineral oil in chronic CAD, but it was a secondary endpoint in an
      open-label Japanese trial of EPA 1.8 g/day and did not test mediation.
  - reference: PMID:33190147
    reference_title: "Effect of High-Dose Omega-3 Fatty Acids vs Corn Oil on Major Adverse Cardiovascular Events in Patients at High Cardiovascular Risk: The STRENGTH Randomized Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants were randomized to receive 4 g/d of omega-3 CA (n = 6539) or
      corn oil, which was intended to serve as an inert comparator (n = 6539),
      in addition to usual background therapies, including statins.
    explanation: >-
      STRENGTH supplies a comparison that did not use mineral oil, although corn
      oil was intended rather than independently proven to be inert.
  - reference: PMID:33190147
    reference_title: "Effect of High-Dose Omega-3 Fatty Acids vs Corn Oil on Major Adverse Cardiovascular Events in Patients at High Cardiovascular Risk: The STRENGTH Randomized Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among statin-treated patients at high cardiovascular risk, the addition of
      omega-3 CA, compared with corn oil, to usual background therapies resulted
      in no significant difference in a composite outcome of major adverse
      cardiovascular events.
    explanation: >-
      The neutral event result constrains a formulation-agnostic omega-3
      cardioprotection claim. STRENGTH tested an EPA/DHA carboxylic-acid
      formulation rather than purified IPE, so it does not refute an
      IPE-specific mechanism.

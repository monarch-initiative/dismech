pathophysiology:
- name: Atherosclerotic Plaque Formation
  description: >
    Lipid accumulation in arterial walls triggers inflammatory response,
    leading to foam cell formation and fibrous cap development. Progressive
    plaque growth narrows the coronary arteries.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Foam Cell
    term:
      id: CL:0000891
      label: foam cell
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Arterial Wall Lipid Accumulation
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  evidence:
  - reference: PMID:39518492
    reference_title: "From Cells to Plaques: The Molecular Pathways of Coronary Artery Calcification and Disease."
    supports: SUPPORT
    snippet: "We examine the cellular and molecular processes that drive the formation
      of calcified plaques, highlighting the roles of inflammation, lipid accumulation,
      and smooth muscle cell proliferation."
    explanation: This review directly supports the role of lipid accumulation
      and inflammation in driving plaque formation in coronary artery disease.
  - reference: PMID:38639096
    reference_title: "Single-Cell Gene-Regulatory Networks of Advanced Symptomatic Atherosclerosis."
    supports: SUPPORT
    snippet: "Advanced stages of atherosclerosis progression and symptomatic carotid
      plaques were largely characterized by 3 smooth muscle cells (SMCs), and 3 macrophage
      subtype clusters with extracellular matrix organization/osteogenic (SMC), and
      M1-type proinflammatory/Trem2-high lipid-associated (macrophage) phenotypes."
    explanation: Single-cell analysis confirms the presence of lipid-associated
      macrophages and smooth muscle cells in advanced atherosclerotic plaques,
      supporting foam cell formation and plaque progression.
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    snippet: "Notable increases in VEGFA+ macrophages were discovered in the disturbed
      flow stimulation group, displaying a pronounced M1 pro-inflammatory phenotype
      associated with the severity of atherosclerosis and plaque stability."
    explanation: This study identifies specific macrophage populations with
      pro-inflammatory phenotypes that contribute to atherosclerotic plaque
      formation and progression.
- name: Endothelial Dysfunction
  description: >
    Damage to the endothelial lining promotes lipid deposition, platelet
    adhesion, and inflammatory cell recruitment. Reduced nitric oxide
    production impairs vasodilation.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Nitric Oxide Production
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    snippet: "CD36 + positive ECs exhibited significant senescence phenotypes following
      disturbed flow stimulation."
    explanation: This study demonstrates that endothelial cells undergo
      senescence under disturbed flow conditions, a key mechanism in endothelial
      dysfunction during atherosclerosis.
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    snippet: "Atherosclerosis tends to occur in regions of disturbed blood flow. This
      study explored how disturbed flow aggravates atherosclerosis using single-cell
      RNA-seq (scRNA-seq) datasets from mouse carotid arteries under disturbed flow
      and human carotid artery plaques."
    explanation: Disturbed flow-induced endothelial dysfunction is a primary
      mechanism for atherosclerosis initiation in specific arterial regions.
- name: Plaque Rupture and Thrombosis
  description: >
    Unstable plaques with thin fibrous caps are prone to rupture, exposing
    thrombogenic material and triggering acute coronary events (myocardial
    infarction).
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Thrombosis
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    snippet: "Notable increases in VEGFA+ macrophages were discovered in the disturbed
      flow stimulation group, displaying a pronounced M1 pro-inflammatory phenotype
      associated with the severity of atherosclerosis and plaque stability."
    explanation: Pro-inflammatory macrophages contribute to plaque instability,
      which predisposes to rupture and thrombotic complications.
  - reference: PMID:38639096
    reference_title: "Single-Cell Gene-Regulatory Networks of Advanced Symptomatic Atherosclerosis."
    supports: PARTIAL
    snippet: "By identifying and integrating the most gene-rich single-cell subclusters
      of atherosclerosis to date with a coronary artery disease framework of GRNs,
      GRN39 was identified and independently validated as being critical for the transformation
      of contractile SMCs into an osteogenic phenotype promoting advanced, symptomatic
      atherosclerosis."
    explanation: Smooth muscle cell transformation into osteogenic phenotypes
      contributes to plaque vulnerability and symptomatic disease, increasing
      risk of rupture and thrombotic events.
mechanistic_hypotheses:
- hypothesis_group_id: pgs_context_amplification
  hypothesis_label: Amplification of polygenic CAD risk in adverse contexts via
    shared endothelial-dysfunction convergence
  status: EMERGING
  description: >-
    Polygenic-score-by-context (PGS×C) interactions reported for coronary artery
    disease in the UK Biobank appear to be driven not by different causal
    variants acting in different environments, but by amplification: the same
    susceptibility loci (e.g. the 9p21 locus, APOE, LDLR, PCSK9) exert
    systematically larger effects in disease-promoting contexts. This entry
    proposes that the amplification arises because the polygenic liability and
    adverse exposures such as tobacco smoking converge on a shared upstream
    pathophysiology node — Endothelial Dysfunction — so their joint effect is
    super-additive on the liability-threshold scale rather than additive. Nagpal
    & Gibson (Nat Genet 2026, PMID:42443528) report that in past
    smokers with low omega-6 fatty acid levels the majority of CAD genetic
    effects are nearly perfectly correlated with, but up to twofold larger in
    magnitude than, those in non-smokers with higher omega-6 fatty acids,
    alongside an ~8% higher SNP-heritability — the signature of amplification
    rather than uncorrelated context-specific effects.
  evidence:
  - reference: PMID:42443528
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The predominant mechanism for PGS×C is the amplification of genetic
      effects in adverse contexts, such as low polyunsaturated fatty acids or social
      determinants of ill health
    explanation: >-
      Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and
      75 contexts, amplification of genetic effects in adverse contexts is
      identified as the predominant mechanism of PGS×context interaction — the
      mechanism applied in this hypothesis.
  - reference: PMID:37228747
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: GxSex is pervasive but acts primarily through systematic sex differences
      in the magnitude of many genetic effects
    explanation: >-
      Establishes amplification — systematic differences in the magnitude of
      polygenic effects rather than in the identity of causal variants — as the
      primary mode of gene-by-context interaction. Sex is among the contexts
      showing the strongest PGS×context amplification for CAD, so this supports
      amplification as the mechanism underlying the CAD PGS×C interactions
      modelled here.
  notes: >-
    EMERGING hypothesis motivated by population-scale PGS×context analyses
    (primary source PMID:42443528; general amplification mechanism corroborated
    by PMID:37228747, which also documents testosterone-mediated amplification).
    The convergence claim (genetic liability + smoking → Endothelial Dysfunction)
    is a mechanistic interpretation and is not itself established as causal — see
    the reverse-causation knowledge gap under discussions.
- hypothesis_group_id: icosapent_ethyl_coronary_plaque_remodeling_model
  hypothesis_label: Icosapent Ethyl Coronary Plaque-Remodeling Model
  status: EMERGING
  description: >-
    In statin-treated people with coronary atherosclerosis and persistent
    hypertriglyceridemia, icosapent ethyl may contribute to the observed
    cardiovascular-event contrast by altering coronary plaque composition or
    progression rather than through isolated change in circulating triglyceride
    concentration. EVAPORATE reported a randomized between-arm imaging signal,
    but its cached abstract reports 80 enrolled without the paired-scan analytic
    denominator or baseline plaque balance, and the reported multivariable model
    did not adjust for baseline plaque. Missing-scan and regression-to-the-mean
    sensitivity therefore remain unresolved. The trial also used a mineral-oil
    comparator and a surrogate endpoint and did not test whether plaque change
    mediated clinical events.
  evidence:
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 80 patients were enrolled in this randomized, double-blind,
      placebo-controlled trial.
    explanation: >-
      EVAPORATE enrolled only 80. The cached abstract does not report how many
      participants contributed interpretable paired scans, so the effective
      analysis size and missing-scan sensitivity are not established by this
      exact evidence.
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant reduction in the primary endpoint as IPE reduced
      LAP plaque volume by 17%, while in the placebo group LAP plaque volume more
      than doubled (+109%) (P = 0.0061).
    explanation: >-
      The reported randomized contrast supports differential change in a
      CT-defined coronary plaque surrogate, not mediation of cardiovascular
      events or a specific cellular mechanism.
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When further adjusted for age, sex, diabetes status, hypertension, and
      baseline TG, plaque volume changes between groups remained significantly
      different, P < 0.01.
    explanation: >-
      Persistence after adjustment for baseline triglyceride is compatible with
      more than baseline-risk imbalance, but it is not a randomized mediation
      analysis of triglyceride response. The quoted adjustment list does not
      include baseline plaque, and the cached abstract does not report baseline
      plaque balance, so regression-to-the-mean sensitivity remains unresolved.
  - reference: PMID:28863874
    reference_title: A randomized controlled trial of eicosapentaenoic acid in patients with coronary heart disease on statins.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PTV/EPA group showed a greater reduction in total atheroma volume
      compared to PTV group. IB-IVUS analyses revealed that lipid volume was
      significantly decreased during follow-up period in only PTV/EPA group.
    explanation: >-
      CHERRY supplies an independent randomized coronary-imaging signal without
      the EVAPORATE mineral-oil comparison, but its open-label protocol tested
      EPA 1.8 g/day plus pitavastatin in 193 Japanese post-PCI patients for only
      6–8 months, not IPE 4 g/day or event mediation.
  - reference: PMID:32805184
    reference_title: "Effects of Fatty Acid Therapy in Addition to Strong Statin on Coronary Plaques in Acute Coronary Syndrome: An Optical Coherence Tomography Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no significant differences in the percent change for minimum
      FCT between the EPA or EPA+DHA group and the control group.
    explanation: >-
      This 130-patient, three-arm trial limits the cap-stabilization version of
      the model because neither EPA 1.8 g/day nor mixed EPA/DHA produced a
      significantly greater overall minimum-FCT increase than statin-only
      control. The abstract reports a favorable minimum-FCT change in the
      subgroup below the median baseline FCT, but that subgroup does not
      overturn the null overall comparison. The trial does not refute the
      narrower plaque-volume signal or test IPE 4 g/day.
  notes: >-
    This is a small 80-patient surrogate imaging hypothesis, not a
    treatment-to-pathophysiology edge. REDUCE-IT tested a high-risk
    ASCVD-or-diabetes population broader than coronary artery disease;
    EVAPORATE is the coronary-specific lead and did not test clinical outcomes
    or mediation. Focused research must compare plaque remodeling with:
    remnant- and apolipoprotein-B particle number, composition, trafficking, and
    arterial retention; platelet activation and thromboxane biology;
    specialized inflammatory-resolution lipid mediators rather than generic
    C-reactive-protein lowering; endothelial nitric-oxide and vascular-function
    effects; membrane stabilization, lipid peroxidation, and oxidized-lipid
    effects; and biomarker increases observed in mineral-oil-assigned
    participants. Achieved-EPA
    concentrations and other postrandomization biomarker associations may
    reflect adherence, absorption, or metabolism and cannot identify a mediator
    without prespecified temporal causal-mediation analysis. Distinguish a
    causal mediator from a baseline effect modifier, parallel pharmacodynamic
    marker, surrogate correlate, or comparator artifact.
- hypothesis_group_id: icosapent_ethyl_atherogenic_particle_lowering_model
  hypothesis_label: Icosapent Ethyl Atherogenic Particle-Lowering Model
  status: EMERGING
  description: >-
    In statin-treated people with persistent triglyceride elevation, icosapent
    ethyl may contribute to plaque or event effects by lowering concentrations
    of atherogenic VLDL and LDL particles, thereby reducing arterial exposure or
    retention of apoB-containing particles.
    A short-duration ANCHOR analysis establishes pharmacodynamic change but did
    not measure coronary plaque, clinical events, or
    treatment-to-particle-to-event mediation.
  evidence:
  - reference: PMID:26073397
    reference_title: Effects of icosapent ethyl on lipoprotein particle concentration and size in statin-treated patients with persistent high triglycerides (the ANCHOR Study).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with placebo (n = 211), IPE 4 g/day (n = 216) significantly
      reduced concentrations of: total (12.2%, P = .0002), large (46.4%, P <
      .0001), and medium (12.1%, P = .0068) very-low-density lipoprotein (VLDL)
      particles; total (7.7%, P = .0017) and small (13.5%, P < .0001) LDL
      particles
    explanation: >-
      This prespecified exploratory 12-week NMR analysis supports an
      IPE-versus-placebo contrast in atherogenic particle concentrations, but it
      did not test coronary plaque, clinical events, or mediation. Without an
      inert third arm, it does not separate direct IPE action from comparator
      behavior.
  notes: >-
    The particle-lowering model can be upstream of the plaque-remodeling model
    rather than mutually exclusive. Randomized biomarker change is established;
    the proposed particle-retention and particle-to-plaque-to-event links remain
    unconfirmed.

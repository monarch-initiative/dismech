- accession: geo:GSE289957
  title: Differential Gene Expression related to Telomere Length in Arterial Wall Tissues and Granulocytes of Patients with Coronary Artery Disease
  description: Shortened telomere length (TL) in blood cells is associated with atherosclerotic coronary artery disease (CAD). However, the mechanistic pathways underlying TL attrition in arterial wall tissues for patients with CAD remain unclear. In this study, we evaluated TL in arterial wall tissues and granulocytes and correlated these measurements with data on gene expressions in the arterial wall tissues of patients with CAD.

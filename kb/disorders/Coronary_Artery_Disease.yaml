name: Coronary Artery Disease
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Coronary artery disease (CAD) is the narrowing or obstruction of the coronary
  arteries by atherosclerotic plaque, driven by endothelial dysfunction, lipid
  accumulation, and chronic vascular inflammation. Progressive luminal stenosis
  produces a mismatch between myocardial oxygen supply and demand, causing
  angina, while plaque rupture with superimposed thrombosis precipitates acute
  coronary syndromes and myocardial infarction.
category: Complex
parents:
- Cardiovascular Disease
- Atherosclerotic Disease
disease_term:
  preferred_term: coronary atherosclerosis
  term:
    id: MONDO:0021661
    label: coronary atherosclerosis
pathophysiology:
- name: Endothelial Dysfunction
  description: >-
    At atherosclerosis-prone arterial sites, disturbed flow is associated with
    endothelial stress and senescence, while reduced endothelial nitric-oxide
    biosynthesis represents the vasomotor dysfunction that impairs dilation.
    This nonconforming coronary endothelial-function branch is modeled
    separately from the conserved subendothelial apoB-retention trigger. The
    cited disturbed-flow evidence derives from mouse carotid arteries and human
    carotid plaques, so its transfer to coronary endothelial dysfunction is
    explicitly partial.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Nitric Oxide Production
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "CD36 + positive ECs exhibited significant senescence phenotypes following disturbed flow stimulation."
    explanation: >-
      Supports disturbed-flow-associated endothelial senescence as one component
      of endothelial dysfunction. It does not directly measure nitric-oxide
      biosynthesis and comes from a mouse carotid model, so it is not treated as
      direct coronary or nitric-oxide evidence.
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Atherosclerosis tends to occur in regions of disturbed blood flow. This study explored how disturbed flow aggravates atherosclerosis using single-cell RNA-seq (scRNA-seq) datasets from mouse carotid arteries under disturbed flow and human carotid artery plaques."
    explanation: >-
      Supports disturbed flow as a regional context for atherosclerosis and
      endothelial dysfunction. It does not directly establish reduced
      nitric-oxide biosynthesis or a coronary-specific effect.
  downstream:
  - target: Coronary Endothelial Injury and Subendothelial LDL Retention
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - increased endothelial permeability and apoB-lipoprotein entry
    - subendothelial lipoprotein modification and retention
    description: >-
      Connects the vasomotor and disturbed-flow endothelial branch to the
      conserved retention trigger without asserting that reduced nitric oxide
      alone is sufficient for apoB retention.
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Arterial injury causes endothelial dysfunction promoting modification of
        apoB containing lipoproteins and infiltration of monocytes into the
        subendothelial space.
      explanation: >-
        Links arterial injury and endothelial dysfunction to subendothelial apoB
        modification and monocyte entry, but does not isolate nitric-oxide loss
        or directly establish every intermediate in lipoprotein retention.
- name: Coronary Endothelial Injury and Subendothelial LDL Retention
  conforms_to: "atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention"
  role: trigger
  description: >-
    In the coronary arterial intima, endothelial injury and dysfunction permit
    infiltration and retention of apoB-containing lipoproteins in the
    subendothelial space. Retained and modified lipoproteins initiate local
    inflammation and monocyte recruitment, providing the coronary trigger for
    atheroma formation.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Cholesterol Homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      infiltration and retention of apoB containing lipoproteins in the artery
      wall is a critical initiating event that sparks an inflammatory response
      and promotes the development of atherosclerosis.
    explanation: >-
      Establishes arterial-wall apoB retention as the initiating event; coronary
      arterial intima is the disease-specific location represented here.
  downstream:
  - target: Monocyte Recruitment and Macrophage Foam Cell Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Arterial injury causes endothelial dysfunction promoting modification of
        apoB containing lipoproteins and infiltration of monocytes into the
        subendothelial space.
      explanation: >-
        Directly links endothelial injury and modified apoB lipoproteins to
        monocyte entry into the subendothelial space.
- name: Monocyte Recruitment and Macrophage Foam Cell Formation
  conforms_to: "atherogenesis#Monocyte Recruitment and Macrophage Foam Cell Formation"
  role: amplifier
  description: >-
    In the coronary intima, recruited monocytes become macrophages and internalize
    retained apoB-containing lipoproteins, forming lipid-laden foam cells. Their
    inflammatory feed-forward loop promotes further lipoprotein oxidation,
    endothelial activation, monocyte recruitment, and foam-cell formation.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Foam Cell
    term:
      id: CL:0000891
      label: foam cell
  biological_processes:
  - preferred_term: Foam Cell Differentiation
    term:
      id: GO:0090077
      label: foam cell differentiation
    modifier: INCREASED
  - preferred_term: Arterial Wall Lipid Accumulation
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Internalization of the apoB containing lipoproteins by macrophages promotes
      foam cell formation, which is the hallmark of the fatty streak phase of
      atherosclerosis.
    explanation: >-
      Directly supports macrophage uptake of apoB lipoproteins and foam-cell
      formation in the fatty streak.
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Macrophage inflammation results in enhanced oxidative stress and
      cytokine/chemokine secretion, causing more LDL/remnant oxidation,
      endothelial cell activation, monocyte recruitment, and foam cell formation.
    explanation: >-
      Documents the macrophage inflammatory loop that amplifies foam-cell
      formation.
  downstream:
  - target: Atherosclerotic Plaque Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Macrophage inflammatory chemoattractants stimulate infiltration and
        proliferation of smooth muscle cells. Smooth muscle cells produce the
        extracellular matrix providing a stable fibrous barrier between plaque
        prothrombotic factors and platelets.
      explanation: >-
        Connects macrophage inflammation to smooth-muscle-cell proliferation and
        extracellular-matrix production, the next core stage.
- name: Atherosclerotic Plaque Formation
  conforms_to: "atherogenesis#Smooth Muscle Cell Switching and Fibrofatty Plaque Formation"
  role: central_effector
  description: >-
    In the inflamed coronary intima, vascular smooth muscle cells switch to a
    synthetic, migratory phenotype, proliferate, and organize extracellular
    matrix to build the fibrofatty plaque and its fibrous cap. This is the atomic
    smooth-muscle-cell and matrix assembly step of coronary atheroma formation.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Smooth Muscle Cell Proliferation
    term:
      id: GO:0048661
      label: positive regulation of smooth muscle cell proliferation
    modifier: INCREASED
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:39518492
    reference_title: "From Cells to Plaques: The Molecular Pathways of Coronary Artery Calcification and Disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "We examine the cellular and molecular processes that drive the formation of calcified plaques, highlighting the roles of inflammation, lipid accumulation, and smooth muscle cell proliferation."
    explanation: >-
      Supports lipid accumulation, inflammation, and smooth-muscle-cell
      proliferation as contributors to coronary plaque formation. It does not
      by itself establish the specific phenotypic-switching or matrix-assembly
      sequence represented by this node.
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vascular smooth muscle cell phenotypic switching through
      transdifferentiation and stem/progenitor cell activation resulting in the
      promotion of inflammation, calcification, and secretion of extracellular
      matrix, altering fibrous cap structure, and necrotic core growth.
    explanation: >-
      Directly supports smooth-muscle-cell phenotypic switching and
      extracellular-matrix secretion in plaque assembly.
  downstream:
  - target: Advanced Atheroma with Necrotic Core and Fibrous Cap
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - continued lipid accumulation
    - foam-cell apoptosis/death with defective efferocytosis and necrotic-core growth
    - vascular smooth muscle cell and extracellular-matrix remodeling
    description: >-
      Continued lipid accumulation, foam-cell death, and matrix remodeling
      intervene between initial fibrofatty plaque assembly and advanced atheroma.
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Unresolved inflammation results in formation of vulnerable plaques
        characterized by enhanced macrophage apoptosis and defective efferocytosis
        of apoptotic cells resulting in necrotic cell death leading to increased
        smooth muscle cell death, decreased extracellular matrix production, and
        collagen degradation by macrophage proteases.
      explanation: >-
        Identifies macrophage/foam-cell death and extracellular-matrix remodeling
        as known intermediates in progression toward vulnerable advanced plaque.
- name: Advanced Atheroma with Necrotic Core and Fibrous Cap
  conforms_to: "atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap"
  role: effector
  description: >-
    Continued lipid accumulation, foam-cell death, and matrix remodeling produce
    a mature coronary atheroma with a necrotic lipid core beneath a fibrous cap.
    Expansion of the core and local plaque microenvironment can destabilize the
    cap and create a rupture-prone coronary lesion.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: Coronary Artery
    term:
      id: UBERON:0001621
      label: coronary artery
  biological_processes:
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the local arterial microenvironment of a stable atheroma promotes
      destabilizing conditions that result in the transition to an unstable
      atheroma.
    explanation: >-
      Human histopathology and vascular-imaging evidence supports transition of
      a stable mature atheroma to an unstable lesion; coronary artery is the
      disease-specific location substituted here.
  - reference: PMID:38639096
    reference_title: "Single-Cell Gene-Regulatory Networks of Advanced Symptomatic Atherosclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced stages of atherosclerosis progression and symptomatic carotid plaques were largely characterized by 3 smooth muscle cells (SMCs), and 3 macrophage subtype clusters with extracellular matrix organization/osteogenic (SMC), and M1-type proinflammatory/Trem2-high lipid-associated (macrophage) phenotypes."
    explanation: >-
      Supports the smooth-muscle-cell, extracellular-matrix, and lipid-associated
      macrophage composition of advanced human atherosclerotic plaque. The tissue
      studied was carotid plaque, so this is partial support for conserved
      advanced-atheroma biology rather than direct coronary evidence.
  - reference: PMID:40594772
    reference_title: "Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human carotid plaques identifies key cell populations in atherosclerosis development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Notable increases in VEGFA+ macrophages were discovered in the disturbed flow stimulation group, displaying a pronounced M1 pro-inflammatory phenotype associated with the severity of atherosclerosis and plaque stability."
    explanation: >-
      Supports an inflammatory macrophage phenotype associated with plaque
      severity and stability, not rupture or thrombosis. The disturbed-flow
      comparison is from a mouse carotid model, so support for coronary advanced
      atheroma is partial.
  - reference: PMID:38639096
    reference_title: "Single-Cell Gene-Regulatory Networks of Advanced Symptomatic Atherosclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "By identifying and integrating the most gene-rich single-cell subclusters of atherosclerosis to date with a coronary artery disease framework of GRNs, GRN39 was identified and independently validated as being critical for the transformation of contractile SMCs into an osteogenic phenotype promoting advanced, symptomatic atherosclerosis."
    explanation: >-
      Supports smooth-muscle-cell transformation in advanced symptomatic
      atherosclerosis. It does not directly demonstrate plaque rupture or
      thrombosis, so it is retained here as partial support for the advanced
      plaque stage.
  downstream:
  - target: Plaque Rupture and Thrombosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37595697
      reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        There are several rupture-associated phenotypes causing thrombotic
        vascular occlusion including simple fibrous cap rupture of an atheroma,
        fibrous cap rupture at site of previous rupture-and-repair of an atheroma,
        and nodular calcification with rupture.
      explanation: >-
        Directly supports the causal transition from advanced atheroma rupture to
        thrombotic vascular occlusion.
- name: Plaque Rupture and Thrombosis
  conforms_to: "atherogenesis#Plaque Rupture, Thrombosis, and Ischemic Events"
  role: consequence
  description: >-
    Rupture of an unstable coronary atheroma, or endothelial erosion over it,
    exposes thrombogenic material and triggers platelet activation, coagulation,
    and thrombotic coronary occlusion, causing acute coronary syndrome and
    myocardial infarction.
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Thrombosis
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Destabilization is characterized by several different plaque phenotypes
      that cause major clinical events such as acute coronary syndrome and
      cerebrovascular strokes.
    explanation: >-
      Histopathology and vascular-imaging evidence directly connects unstable
      atheroma phenotypes with acute coronary syndrome, supporting this terminal
      coronary consequence.
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endothelial erosion without rupture has more recently been shown to be a
      common phenotype to promote thrombosis as well.
    explanation: >-
      Directly supports endothelial erosion as a thrombosis-promoting alternative
      to fibrous-cap rupture in the coronary consequence node.
mechanistic_hypotheses:
- hypothesis_group_id: pgs_context_amplification
  hypothesis_label: Amplification of polygenic CAD risk in adverse contexts via shared endothelial-dysfunction convergence
  status: EMERGING
  description: >-
    Polygenic-score-by-context (PGS×C) interactions reported for coronary artery
    disease in the UK Biobank appear to be driven not by different causal
    variants acting in different environments, but by amplification: the same
    susceptibility loci (e.g. the 9p21 locus, APOE, LDLR, PCSK9) exert
    systematically larger effects in disease-promoting contexts. This entry
    proposes that the amplification arises because the polygenic liability and
    adverse exposures such as tobacco smoking converge on a shared upstream
    pathophysiology node — Endothelial Dysfunction — so their joint effect is
    super-additive on the liability-threshold scale rather than additive. Nagpal
    & Gibson (Nat Genet 2026, PMID:42443528) report that in past
    smokers with low omega-6 fatty acid levels the majority of CAD genetic
    effects are nearly perfectly correlated with, but up to twofold larger in
    magnitude than, those in non-smokers with higher omega-6 fatty acids,
    alongside an ~8% higher SNP-heritability — the signature of amplification
    rather than uncorrelated context-specific effects.
  evidence:
  - reference: PMID:42443528
    reference_title: "Pervasive interactions between exposures and polygenic risk can inform more effective clinical and behavioral interventions."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The predominant mechanism for PGS×C is the amplification of genetic effects in adverse contexts, such as low polyunsaturated fatty acids or social determinants of ill health
    explanation: >-
      Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and
      75 contexts, amplification of genetic effects in adverse contexts is
      identified as the predominant mechanism of PGS×context interaction — the
      mechanism applied in this hypothesis.
  - reference: PMID:37228747
    reference_title: "Amplification is the primary mode of gene-by-sex interaction in complex human traits."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: GxSex is pervasive but acts primarily through systematic sex differences in the magnitude of many genetic effects
    explanation: >-
      Establishes amplification — systematic differences in the magnitude of
      polygenic effects rather than in the identity of causal variants — as the
      primary mode of gene-by-context interaction. Sex is among the contexts
      showing the strongest PGS×context amplification for CAD, so this supports
      amplification as the mechanism underlying the CAD PGS×C interactions
      modelled here.
  notes: >-
    EMERGING hypothesis motivated by population-scale PGS×context analyses
    (primary source PMID:42443528; general amplification mechanism corroborated
    by PMID:37228747, which also documents testosterone-mediated amplification).
    The convergence claim (genetic liability + smoking → Endothelial Dysfunction)
    is a mechanistic interpretation and is not itself established as causal — see
    the reverse-causation knowledge gap under discussions.
- hypothesis_group_id: icosapent_ethyl_coronary_plaque_remodeling_model
  hypothesis_label: Icosapent Ethyl Coronary Plaque-Remodeling Model
  status: EMERGING
  description: >-
    In statin-treated people with coronary atherosclerosis and persistent
    hypertriglyceridemia, icosapent ethyl may contribute to the observed
    cardiovascular-event contrast by altering coronary plaque composition or
    progression rather than through isolated change in circulating triglyceride
    concentration. EVAPORATE reported a randomized between-arm imaging signal,
    but its cached abstract reports 80 enrolled without the paired-scan analytic
    denominator or baseline plaque balance, and the reported multivariable model
    did not adjust for baseline plaque. Missing-scan and regression-to-the-mean
    sensitivity therefore remain unresolved. The trial also used a mineral-oil
    comparator and a surrogate endpoint and did not test whether plaque change
    mediated clinical events.
  evidence:
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 80 patients were enrolled in this randomized, double-blind,
      placebo-controlled trial.
    explanation: >-
      EVAPORATE enrolled only 80. The cached abstract does not report how many
      participants contributed interpretable paired scans, so the effective
      analysis size and missing-scan sensitivity are not established by this
      exact evidence.
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant reduction in the primary endpoint as IPE reduced
      LAP plaque volume by 17%, while in the placebo group LAP plaque volume more
      than doubled (+109%) (P = 0.0061).
    explanation: >-
      The reported randomized contrast supports differential change in a
      CT-defined coronary plaque surrogate, not mediation of cardiovascular
      events or a specific cellular mechanism.
  - reference: PMID:32860032
    reference_title: "Effect of icosapent ethyl on progression of coronary atherosclerosis in patients with elevated triglycerides on statin therapy: final results of the EVAPORATE trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When further adjusted for age, sex, diabetes status, hypertension, and
      baseline TG, plaque volume changes between groups remained significantly
      different, P < 0.01.
    explanation: >-
      Persistence after adjustment for baseline triglyceride is compatible with
      more than baseline-risk imbalance, but it is not a randomized mediation
      analysis of triglyceride response. The quoted adjustment list does not
      include baseline plaque, and the cached abstract does not report baseline
      plaque balance, so regression-to-the-mean sensitivity remains unresolved.
  - reference: PMID:28863874
    reference_title: A randomized controlled trial of eicosapentaenoic acid in patients with coronary heart disease on statins.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PTV/EPA group showed a greater reduction in total atheroma volume
      compared to PTV group. IB-IVUS analyses revealed that lipid volume was
      significantly decreased during follow-up period in only PTV/EPA group.
    explanation: >-
      CHERRY supplies an independent randomized coronary-imaging signal without
      the EVAPORATE mineral-oil comparison, but its open-label protocol tested
      EPA 1.8 g/day plus pitavastatin in 193 Japanese post-PCI patients for only
      6–8 months, not IPE 4 g/day or event mediation.
  - reference: PMID:32805184
    reference_title: "Effects of Fatty Acid Therapy in Addition to Strong Statin on Coronary Plaques in Acute Coronary Syndrome: An Optical Coherence Tomography Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no significant differences in the percent change for minimum
      FCT between the EPA or EPA+DHA group and the control group.
    explanation: >-
      This 130-patient, three-arm trial limits the cap-stabilization version of
      the model because neither EPA 1.8 g/day nor mixed EPA/DHA produced a
      significantly greater overall minimum-FCT increase than statin-only
      control. The abstract reports a favorable minimum-FCT change in the
      subgroup below the median baseline FCT, but that subgroup does not
      overturn the null overall comparison. The trial does not refute the
      narrower plaque-volume signal or test IPE 4 g/day.
  notes: >-
    This is a small 80-patient surrogate imaging hypothesis, not a
    treatment-to-pathophysiology edge. REDUCE-IT tested a high-risk
    ASCVD-or-diabetes population broader than coronary artery disease;
    EVAPORATE is the coronary-specific lead and did not test clinical outcomes
    or mediation. Focused research must compare plaque remodeling with:
    remnant- and apolipoprotein-B particle number, composition, trafficking, and
    arterial retention; platelet activation and thromboxane biology;
    specialized inflammatory-resolution lipid mediators rather than generic
    C-reactive-protein lowering; endothelial nitric-oxide and vascular-function
    effects; membrane stabilization, lipid peroxidation, and oxidized-lipid
    effects; and biomarker increases observed in mineral-oil-assigned
    participants. Achieved-EPA
    concentrations and other postrandomization biomarker associations may
    reflect adherence, absorption, or metabolism and cannot identify a mediator
    without prespecified temporal causal-mediation analysis. Distinguish a
    causal mediator from a baseline effect modifier, parallel pharmacodynamic
    marker, surrogate correlate, or comparator artifact.
- hypothesis_group_id: icosapent_ethyl_atherogenic_particle_lowering_model
  hypothesis_label: Icosapent Ethyl Atherogenic Particle-Lowering Model
  status: EMERGING
  description: >-
    In statin-treated people with persistent triglyceride elevation, icosapent
    ethyl may contribute to plaque or event effects by lowering concentrations
    of atherogenic VLDL and LDL particles, thereby reducing arterial exposure or
    retention of apoB-containing particles.
    A short-duration ANCHOR analysis establishes pharmacodynamic change but did
    not measure coronary plaque, clinical events, or
    treatment-to-particle-to-event mediation.
  evidence:
  - reference: PMID:26073397
    reference_title: Effects of icosapent ethyl on lipoprotein particle concentration and size in statin-treated patients with persistent high triglycerides (the ANCHOR Study).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with placebo (n = 211), IPE 4 g/day (n = 216) significantly
      reduced concentrations of: total (12.2%, P = .0002), large (46.4%, P <
      .0001), and medium (12.1%, P = .0068) very-low-density lipoprotein (VLDL)
      particles; total (7.7%, P = .0017) and small (13.5%, P < .0001) LDL
      particles
    explanation: >-
      This prespecified exploratory 12-week NMR analysis supports an
      IPE-versus-placebo contrast in atherogenic particle concentrations, but it
      did not test coronary plaque, clinical events, or mediation. Without an
      inert third arm, it does not separate direct IPE action from comparator
      behavior.
  notes: >-
    The particle-lowering model can be upstream of the plaque-remodeling model
    rather than mutually exclusive. Randomized biomarker change is established;
    the proposed particle-retention and particle-to-plaque-to-event links remain
    unconfirmed.

        to possess enhancer activity that promotes the expression of SOX9.
      explanation: >-
        Supports increased SOX9 expression as the regulatory consequence.
- name: Ectopic SOX3 expression
  description: >-
    SOX3 copy-number or regulatory rearrangements cause inappropriate SOX3
    expression in the developing gonad, where it can substitute for SRY and

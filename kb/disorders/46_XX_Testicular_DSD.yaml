- name: NR5A1 Arg92 regulatory switch
  description: >-
    Specific heterozygous substitutions at NR5A1 Arg92 alter the balance between
    pro-ovary and pro-testis programs. The human association is strong, but the
    precise transcriptional mechanism remains incompletely resolved.
  genes:
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  biological_processes:
  - preferred_term: gonad development
    term:
      id: GO:0008406
      label: gonad development
    modifier: DYSREGULATED
  subtypes:
  - SRXX4
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:27378692
    reference_title: A recurrent p.Arg92Trp variant in steroidogenic factor-1 (NR5A1) can act as a molecular switch in human sex development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These unique findings highlight how a specific variant in a developmental
      transcription factor can switch organ fate from the ovary to testis in
      mammals and represents the first missense mutation causing isolated,
      non-syndromic 46,XX testicular/ovotesticular DSD in humans.
    explanation: >-
      Supports the organ-fate switch associated with the specific variant.
  - reference: PMID:27490115
    reference_title: "NR5A1 is a novel disease gene for 46,XX testicular and ovotesticular disorders of sex development."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      We hypothesize that p.(Arg92Trp) results in decreased inhibition of the
      male developmental pathway through downregulation of female antitestis
      genes, thereby tipping the balance toward testicular differentiation in
      46,XX individuals.
    explanation: >-
      The authors explicitly frame the detailed molecular mechanism as a
      hypothesis, so it is retained with partial support.
  downstream:
  - target: Sustained pro-testis program
    description: The Arg92 variant shifts the gonadal regulatory balance toward testis differentiation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered NR5A1 target regulation reduces restraint on the male developmental pathway.
    evidence:
    - reference: PMID:27490115
      reference_title: "NR5A1 is a novel disease gene for 46,XX testicular and ovotesticular disorders of sex development."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        In conclusion, our study supports a role for NR5A1 in testis
        differentiation in the XX gonad.
      explanation: >-
        Supports pathway direction while preserving uncertainty about the exact
        intermediate mechanism.
- name: WT1 C-terminal regulatory alteration

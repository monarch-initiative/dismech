    explanation: >-
      Directly links a minimal noncoding SOX9 enhancer duplication to familial
      testicular DSD.
  downstream:
  - target: Sustained pro-testis program
    description: Increased SOX9 enhancer dosage activates the testis pathway in an XX gonad.
    causal_link_type: DIRECT
    evidence:

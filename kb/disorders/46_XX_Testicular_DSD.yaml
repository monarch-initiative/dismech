  evidence:
  - reference: PMID:37551848
    reference_title: "The smallest likely pathogenic duplication of a SOX9 enhancer identified to date in a family with 46,XX testicular differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy number variants that duplicate distal upstream enhancer elements of
      the SOX9 gene cause 46,XX testicular differences of sex development (DSD)
      which is characterized by a 46,XX karyotype in an individual presenting
      with either ambiguous genitalia or genitalia with varying degrees of
      virilization, including those resembling typical male genitalia.
    explanation: >-
      Directly establishes pathogenic SOX9 enhancer duplications in pure
      testicular DSD.

  inheritance:
  - name: Autosomal dominant with reduced penetrance and variable expressivity
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    expressivity: VARIABLE
  features: >-
    The phenotypic spectrum includes testicular and ovotesticular development;
    this file models only individuals meeting the testicular-only boundary.
  evidence:
  - reference: PMID:27378692
    reference_title: A recurrent p.Arg92Trp variant in steroidogenic factor-1 (NR5A1) can act as a molecular switch in human sex development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that a specific recurrent heterozygous missense mutation
      (p.Arg92Trp) in the accessory DNA-binding region of NR5A1 is associated
      with variable degree of testis development in 46,XX children and adults
      from four unrelated families.
    explanation: >-
      Supports the specific heterozygous variant and variable expressivity.
  - reference: PMID:27490115
    reference_title: "NR5A1 is a novel disease gene for 46,XX testicular and ovotesticular disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel heterozygous NR5A1 mutation, c.274C>T
      p.(Arg92Trp), in three unrelated patients.
    explanation: >-
      Independently establishes recurrent heterozygous p.Arg92Trp.
- name: WT1 C-terminal variants
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  association: >-
    Specific heterozygous splice or fourth-zinc-finger variants can cause rare
    nonsyndromic SRY-negative testicular DSD.
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  subtype: WT1-related
  features: >-
    Restrict to the nonsyndromic C-terminal/ZF4 branch; broader WT1 syndromes
    with renal, tumor, cardiac, or diaphragmatic manifestations are outside this
    entry.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      specific heterozygous pathogenic variants in NR5A1 or WT1.
    explanation: >-
      GeneReviews recognizes specific heterozygous WT1 variants among the
      nonsyndromic causes.
  - reference: PMID:40089886
    reference_title: "[A case of 46,XX testicular disorders of sex development due to an apparent synonymous variant in the WT1 gene: difficulties of differential diagnosis of intrauterine virililzation syndrome in a girl]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic analysis (whole exome sequencing with Sanger validation)
      revealed a de novo variant in exon 9 of the WT1 gene
    explanation: >-
      Directly documents the de novo WT1 variant in a testicular DSD case.
diagnosis:
- name: Integrated multidisciplinary DSD assessment
  presence: >-
    Clinical anatomy, age-appropriate endocrine results, chromosome complement,
    and molecular findings interpreted together.
  description: >-
    No single phenotype or test establishes the entire diagnosis. Evaluation
    should integrate genital and gonadal anatomy, internal reproductive
    structures, hormone data, cytogenetics, and molecular testing through an
    experienced multidisciplinary DSD team.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:30299888
    reference_title: "GENETICS IN ENDOCRINOLOGY: Approaches to molecular genetic diagnosis in the management of differences/disorders of sex development (DSD): position paper of EU COST Action BM 1303 ‘DSDnet’."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of DSD belongs to the most complex fields in medicine and
      requires an integrated multidisciplinary approach consisting in a
      synoptic view of clinical phenotype, biochemical (hormonal) constellation
      and molecular datasets.
    explanation: >-
      Supports integrated rather than test-isolated diagnosis.
- name: Karyotype confirmation and SRY detection/localization
  presence: >-
    46,XX chromosome complement with testicular tissue; SRY status and genomic
    location reported.
  description: >-
    Karyotyping establishes the 46,XX DSD class. FISH or chromosomal microarray
    can detect SRY and help localize ectopic Yp material; PCR alone establishes
    presence but not chromosomal location.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:30299888
    reference_title: "GENETICS IN ENDOCRINOLOGY: Approaches to molecular genetic diagnosis in the management of differences/disorders of sex development (DSD): position paper of EU COST Action BM 1303 ‘DSDnet’."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ascertainment of the karyotpye defines one of the three major diagnostic
      DSD subclasses and is therefore the mandatory initial step.
    explanation: >-
      Supports chromosome-complement assessment as the initial genetic step.
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 80% of individuals with nonsyndromic 46,XX testicular DSD
      are SRY positive, as shown by use of FISH or chromosomal microarray.
    explanation: >-
      Supports FISH or microarray assessment of SRY status.
- name: Chromosomal microarray and deletion-duplication analysis
  presence: >-
    Detection of pathogenic CNVs involving SRY or regulatory domains around
    SOX9 and SOX3.
  description: >-
    Copy-number testing follows karyotype/SRY assessment, but platform coverage
    must be reviewed because small or noncoding enhancer lesions can be missed.
  diagnosis_term:
    preferred_term: chromosomal microarray testing
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:30299888
    reference_title: "GENETICS IN ENDOCRINOLOGY: Approaches to molecular genetic diagnosis in the management of differences/disorders of sex development (DSD): position paper of EU COST Action BM 1303 ‘DSDnet’."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Higher resolution chromosome analysis through aCGH or SNP array allows
      the detection of microduplications or microdeletions below the threshold
      of a standard karyotype (<5 Mb).
    explanation: >-
      Supports microarray-based detection of pathogenic CNVs.
- name: DSD gene panel and genome sequencing with regulatory coverage
  presence: >-
    Pathogenic coding or noncoding variants in SRY-negative disease, including
    SOX9/SOX3 regulatory CNVs and specific NR5A1 or WT1 variants.
  description: >-
    A well-covered DSD panel can assess coding variants and deletion/duplication
    changes. Genome sequencing or equivalent validated assays should be
    considered when small noncoding SOX9/SOX3 regulatory lesions remain
    suspected; laboratory coverage must be confirmed rather than assumed.
  diagnosis_term:
    preferred_term: gene panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30299888
    reference_title: "GENETICS IN ENDOCRINOLOGY: Approaches to molecular genetic diagnosis in the management of differences/disorders of sex development (DSD): position paper of EU COST Action BM 1303 ‘DSDnet’."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A panel of candidate genes with a robust coverage of all genomic regions
      of interest is increasingly regarded as the first-tier approach.
    explanation: >-
      Supports a coverage-aware panel strategy.
  - reference: PMID:37551848
    reference_title: "The smallest likely pathogenic duplication of a SOX9 enhancer identified to date in a family with 46,XX testicular differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior fluorescence in situ hybridization (FISH) for SRY and a multi-gene
      panel for ambiguous genitalia were non-diagnostic.
    explanation: >-
      Demonstrates that routine SRY FISH and a multigene panel can miss a small
      noncoding SOX9 enhancer duplication later found by genome sequencing.
- name: Age-appropriate endocrine and reproductive assessment
  presence: >-
    FSH, LH, testosterone, and selected Sertoli-cell markers interpreted by age;
    semen analysis after puberty.
  description: >-
    Hormone testing helps document testicular function and primary testicular
    failure. Semen analysis is relevant only after puberty. Pediatric testing
    may include AMH, inhibin B, and selective hCG stimulation when the presence
    or function of testicular tissue is uncertain.
  diagnosis_term:
    preferred_term: circulating hormone measurement
    term:
      id: NCIT:C74742
      label: Hormone Measurement
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of nonsyndromic 46,XX testicular DSD is based on the combination
      of clinical findings, endocrine testing, and cytogenetic testing.
    explanation: >-
      Supports endocrine testing as one component of diagnosis.
  - reference: PMID:30623467
    reference_title: "Clinical and genetic analysis in males with 46,XX disorders of sex development: A reproductive centre experience of 144 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of follicle-stimulating hormone (FSH) were found in 136
      patients (95.10%) and increased luteinising hormone (LH) values were
      detected in 125 patients (92.59%). Eighty subjects (62.99%) had low
      testosterone values.
    explanation: >-
      Provides the expected adult endocrine pattern.
- name: Internal reproductive-structure imaging
  presence: >-
    Usually absent Müllerian structures; a uterus or hemi-uterus prompts
    reconsideration of ovotesticular DSD or another diagnosis.
  description: >-
    Pelvic ultrasound is a reasonable first imaging test, with MRI or surgical
    evaluation reserved for unresolved anatomy. Imaging contributes to the
    disease boundary but cannot prove the absence of microscopic ovarian tissue.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: absence of müllerian structures
    explanation: >-
      Supports absent Müllerian structures as the expected nonsyndromic pattern.
  - reference: PMID:41170606
    reference_title: "46,XX Testicular/Ovotesticular Disorders of Sexual Development: A Single-Center Retrospective Experience."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Müllerian derivatives were identified in 18 patients. In 14 of these, the
      structures were visualized by ultrasound, and in the remaining 4, they
      were identified through laparoscopic evaluation.
    explanation: >-
      Mixed testicular/ovotesticular evidence shows how imaging and laparoscopy
      identify Müllerian structures, but it is not used as root-level phenotype
      evidence.
- name: Selective gonadal histology when the TDSD-OTDSD boundary is unresolved
  presence: >-
    Testicular tissue without ovarian follicles; adequate sampling required to
    exclude an ovotestis.
  description: >-
    Biopsy is not a routine requirement in an otherwise clear nonsyndromic case.
    It may be considered when testicular versus ovotesticular classification
    cannot be resolved, recognizing that a limited biopsy can miss spatially
    separate ovarian tissue.
  diagnosis_term:
    preferred_term: gonadal biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:41170606
    reference_title: "46,XX Testicular/Ovotesticular Disorders of Sexual Development: A Single-Center Retrospective Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4 patients, the first sample obtained from gonadal biopsy failed to
      identify ovarian tissue that was later demonstrated during pubertal
      evaluation.
    explanation: >-
      Directly demonstrates sampling error at the testicular-versus-ovotesticular
      boundary.
differential_diagnoses:
- name: 46,XX ovotesticular disorder of sex development
  description: >-
    The closest boundary differential contains both ovarian follicles and
    testicular tissue. Müllerian structures and estrogen-producing ovarian
    tissue may be present, and a limited biopsy can miss the ovarian component.
  distinguishing_features:
  - Histologic ovarian follicles together with seminiferous tubules define ovotesticular DSD.
  - Testicular-only gonads and absent Müllerian structures favor nonsyndromic testicular DSD.
  disease_term:
    preferred_term: 46,XX ovotesticular disorder of sex development
    term:
      id: MONDO:0016281
      label: 46,XX ovotesticular disorder of sex development
  evidence:
  - reference: PMID:38841305
    reference_title: "46,XX Differences of Sex Development outside congenital adrenal hyperplasia: pathogenesis, clinical aspects, puberty, sex hormone replacement therapy and fertility outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis between ovotesticular and testicular DSD is
      based on histological analysis. It requires the concomitant existence of
      testicular tissue (seminiferous tubules) and ovarian tissue (follicles
      containing oocytes)
    explanation: >-
      States the tissue criterion separating ovotesticular from testicular DSD.
- name: RSPO1 palmoplantar keratoderma-XX sex reversal-SCC predisposition syndrome
  description: >-
    Biallelic RSPO1 disease can include testicular or ovotesticular development
    but is a separate recessive syndrome with palmoplantar hyperkeratosis and
    cutaneous squamous-cell-carcinoma predisposition. Those skin findings do not
    belong to the nonsyndromic root phenotype.
  disease_term:
    preferred_term: palmoplantar keratoderma-XX sex reversal-predisposition to squamous cell carcinoma syndrome
    term:
      id: MONDO:0012530
      label: palmoplantar keratoderma-XX sex reversal-predisposition to squamous cell carcinoma syndrome
  evidence:
  - reference: PMID:17041600
    reference_title: "R-spondin1 is essential in sex determination, skin differentiation and malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that human R-spondin1 (RSPO1) is the gene disrupted in a
      recessive syndrome characterized by XX sex reversal, palmoplantar
      hyperkeratosis and predisposition to squamous cell carcinoma of the skin.
    explanation: >-
      Establishes the RSPO1 syndrome and its extra-gonadal boundary features.
- name: NR2F2-related 46,XX sex reversal 5
  description: >-
    NR2F2 loss-of-function causes a distinct syndromic 46,XX testicular or
    ovotesticular phenotype accompanied by congenital heart disease and
    sometimes diaphragmatic hernia or BPES features.
  disease_term:
    preferred_term: 46,xx sex reversal 5
    term:
      id: MONDO:0030049
      label: 46,xx sex reversal 5
  evidence:
  - reference: PMID:29478779
    reference_title: "Loss of Function of the Nuclear Receptor NR2F2, Encoding COUP-TF2, Causes Testis Development and Cardiac Defects in 46,XX Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three children presented with congenital heart disease (CHD), one
      child with congenital diaphragmatic hernia (CDH), and two children with
      blepharophimosis-ptosis-epicanthus inversus syndrome (BPES).
    explanation: >-
      Supports the defining syndromic features that place NR2F2 disease outside
      the nonsyndromic root.
- name: Congenital adrenal hyperplasia
  description: >-
    Prenatal adrenal androgen excess can virilize a 46,XX fetus but does not
    create testes. Adrenal steroid testing, gonadal assessment, and molecular
    diagnosis distinguish CAH from testicular DSD.
  disease_term:
    preferred_term: congenital adrenal hyperplasia
    term:
      id: MONDO:0018479
      label: congenital adrenal hyperplasia
  evidence:
  - reference: PMID:40089886
    reference_title: "[A case of 46,XX testicular disorders of sex development due to an apparent synonymous variant in the WT1 gene: difficulties of differential diagnosis of intrauterine virililzation syndrome in a girl]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the condition was initially regarded as a virile form of congenital
      adrenal hyperplasia, then as idiopathic intrauterine virilization in a
      girl.
    explanation: >-
      Documents the real diagnostic confusion between adrenal virilization and
      testicular tissue in an SRY-negative case.
- name: Klinefelter syndrome
  description: >-
    Both disorders can cause small testes, azoospermia, gynecomastia, and
    hypergonadotropic hypogonadism after puberty; karyotype distinguishes 47,XXY
    from 46,XX disease.
  disease_term:
    preferred_term: Klinefelter syndrome
    term:
      id: MONDO:0006823
      label: Klinefelter syndrome
  evidence:
  - reference: PMID:36746123
    reference_title: "Testicular Architecture of Men with 46,XX Testicular Disorders of Sex Development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lower number of tubules and severe LC hyperplasia observed in
      46,XX TDSD were similar to KS.
    explanation: >-
      Supports overlapping testicular pathology; cytogenetics supplies the
      decisive distinction.
- name: 46,XX gonadal dysgenesis
  description: >-
    46,XX gonadal dysgenesis causes streak or underdeveloped ovaries, estrogen
    deficiency, absent or delayed female puberty, and a uterus rather than
    testicular-only gonads with usual Müllerian regression.
  disease_term:
    preferred_term: 46,XX gonadal dysgenesis
    term:
      id: MONDO:0009299
      label: 46 XX gonadal dysgenesis
treatments:
- name: Individualized testosterone pubertal induction or replacement
  action_category: THERAPEUTIC
  description: >-
    Testosterone is used when spontaneous puberty is absent or incomplete, or
    when persistent symptomatic biochemical hypogonadism is confirmed. It is
    not automatic therapy for every child or adult; dosing and timing should be
    individualized to age, pubertal stage, growth, symptoms, and patient goals.
  treatment_term:
    preferred_term: hormone modifying therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_phenotypes:
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      After age 14 years, low-dose testosterone therapy is initiated and
      gradually increased to reach adult levels.
    explanation: >-
      Supports gradual pubertal induction in affected adolescents requiring
      treatment.
  - reference: PMID:38841305
    reference_title: "46,XX Differences of Sex Development outside congenital adrenal hyperplasia: pathogenesis, clinical aspects, puberty, sex hormone replacement therapy and fertility outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hormone replacement therapy (HRT), if needed, consists of Testosterone
      treatment, with formulations and therapeutic schemes recommended in
      International clinical practice guidelines
    explanation: >-
      Explicitly makes testosterone conditional on clinical need.
- name: Longitudinal endocrine and testosterone-safety monitoring
  action_category: MONITORING
  description: >-
    Follow growth and pubertal progression, symptoms, FSH/LH/testosterone, mood,
    libido, energy, erectile function, acne, breast symptoms, and gynecomastia.
    During testosterone therapy, monitor dose response, testosterone,
    hematocrit, and age-appropriate metabolic, liver, and prostate safety
    measures.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For those on testosterone replacement therapy: measurement of serum
      testosterone levels every three months (just prior to the next injection)
      until testosterone dose is optimized; then annual measurement of serum
      testosterone levels, lipid profile, and liver function tests.
    explanation: >-
      Supports structured monitoring during testosterone replacement.
- name: Bone-health assessment and management
  action_category: MONITORING
  description: >-
    Assess bone health after puberty and more frequently when osteopenia is
    present; address calcium/vitamin D, weight-bearing activity, androgen
    deficiency, and osteoporosis according to standard care.
  treatment_term:
    preferred_term: Dual-energy X-ray absorptiometry procedure
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dual-energy x-ray absorptiometry scan every three to five years after
      puberty or annually, if osteopenia has been identified.
    explanation: >-
      Supports ongoing bone-density surveillance after puberty.
- name: Donor-sperm assisted reproduction and family-building counseling
  action_category: THERAPEUTIC
  description: >-
    Donor-sperm assisted reproductive technology can achieve parenthood for
    affected couples. The choice among donor insemination, IVF, and other
    family-building options should be individualized. Autologous sperm retrieval
    is generally not expected to succeed in confirmed non-mosaic disease lacking
    AZF regions, but categorical exclusions should be discussed with a
    reproductive-urology specialist because evidence is limited.
  treatment_term:
    preferred_term: assisted reproductive technology
    term:
      id: NCIT:C93282
      label: Assisted Reproductive Technology
  target_phenotypes:
  - preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:30623467
    reference_title: "Clinical and genetic analysis in males with 46,XX disorders of sex development: A reproductive centre experience of 144 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, fertility achieved in 87 patients through ART using donor
      spermatozoa.
    explanation: >-
      Directly documents donor-sperm ART outcomes in the largest cited adult
      cohort.
- name: Etiology-specific genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Explain the molecular diagnosis, recurrence risk, reduced penetrance,
    chromosome-complement dependence, family testing, infertility, and
    reproductive options. Counseling must distinguish usually de novo SRY,
    SOX3, or WT1 events from potentially inherited SOX9 or NR5A1 variants.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mode of inheritance and recurrence risk to sibs of a proband with a
      nonsyndromic 46,XX testicular DSD depend on the molecular diagnosis in the
      proband and the genetic status of the parents.
    explanation: >-
      Directly supports etiology-specific recurrence counseling.
- name: Multidisciplinary psychosocial and anomaly-specific care
  action_category: THERAPEUTIC
  description: >-
    Offer developmentally appropriate psychological and sexual-health support,
    shared decision-making, and standard urologic management of hypospadias or
    cryptorchidism when present. Care should be coordinated across pediatric or
    adult endocrinology, genetics, urology, reproductive medicine, and mental
    health according to age and goals.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Standard treatment for osteopenia, hypospadias, and cryptorchidism.
      Providers are encouraged to anticipate the need for further psychological
      support.
    explanation: >-
      Supports anomaly-specific standard care and anticipatory psychological
      support.
discussions:
- discussion_id: gap_tdsd_otdsd_boundary_sampling
  prompt: >-
    What combination of imaging, endocrine markers, longitudinal observation,
    and adequately sampled histology best distinguishes testicular-only from
    ovotesticular 46,XX DSD without making biopsy routine?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Selective gonadal histology when the TDSD-OTDSD boundary is unresolved
  - differential_diagnoses#46,XX ovotesticular disorder of sex development
  rationale: >-
    Gonadal tissue is spatially heterogeneous, and a limited childhood biopsy
    can miss ovarian follicles later demonstrated during puberty. Misclassification
    changes counseling, fertility considerations, and interpretation of tumor
    evidence.
  evidence:
  - reference: PMID:41170606
    reference_title: "46,XX Testicular/Ovotesticular Disorders of Sexual Development: A Single-Center Retrospective Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4 patients, the first sample obtained from gonadal biopsy failed to
      identify ovarian tissue that was later demonstrated during pubertal
      evaluation.
    explanation: >-
      Directly establishes the sampling problem.
- discussion_id: gap_sry_negative_molecular_diagnosis
  prompt: >-
    Which noncoding, structural, mosaic, or epigenetic mechanisms explain
    SRY-negative testicular-only cases that remain unresolved after current
    panel, CNV, and genome testing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Unknown cause
  - diagnosis#DSD gene panel and genome sequencing with regulatory coverage
  rationale: >-
    Many cases still lack a molecular diagnosis, and very small enhancer
    duplications can evade SRY testing and routine panels. Resolution will
    require validated noncoding coverage, structural-variant analysis, and
    careful phenotype reclassification.
  evidence:
  - reference: PMID:38721146
    reference_title: "Testicular differentiation in 46,XX DSD: an overview of genetic causes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This finding suggests that there are additional genetic pathways or
      epigenetic mechanisms that have yet to be identified.
    explanation: >-
      Supports the unresolved genetic and epigenetic mechanism gap.
  - reference: PMID:37551848
    reference_title: "The smallest likely pathogenic duplication of a SOX9 enhancer identified to date in a family with 46,XX testicular differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding highlights the importance of non-coding variant interrogation
      in suspected genetic disorders.
    explanation: >-
      Demonstrates the diagnostic value of noncoding interrogation.
- discussion_id: gap_autologous_fertility_potential
  prompt: >-
    Are there rigorously confirmed non-mosaic, testicular-only 46,XX cases with
    retrievable autologous sperm, and what evidence threshold should govern
    counseling about TESE or fertility preservation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Germ-cell loss and seminiferous-tubule failure
  - treatments#Donor-sperm assisted reproduction and family-building counseling
  rationale: >-
    AZF regions were absent in all tested members of the largest adult cohort
    and pure testicular biopsies show germ-cell loss, making success biologically
    unlikely. Rare reports may reflect mosaicism or TDSD-OTDSD
    misclassification, so counseling should avoid both false hope and an
    unsupported categorical prohibition.
  evidence:

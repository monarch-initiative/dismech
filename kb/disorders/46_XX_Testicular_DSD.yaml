clinical_trials: []
datasets: []
notes: >-
  Scope is deliberately restricted to nonsyndromic testicular-only
  MONDO:0100249. RSPO1 syndrome (MONDO:0012530), NR2F2-related 46,XX sex
  reversal 5 (MONDO:0030049), and 46,XX ovotesticular DSD (MONDO:0016281) are
  separate diseases and appear only as boundary differentials. Historical
  labels such as “XX male” and “sex reversal” are retained only for literature
  discoverability and MONDO subtype alignment. Mixed testicular/ovotesticular
  cohorts are used solely to expose diagnostic and tumor-risk uncertainty, not
  to assert root phenotypes, histopathology, or surveillance. No validated
  routine gonadal tumor-screening protocol is encoded pending expert review in
  GitHub issue 6584.

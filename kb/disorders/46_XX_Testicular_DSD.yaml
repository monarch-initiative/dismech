- discussion_id: gap_gonadal_tumor_surveillance
  prompt: >-
    Is any routine gonadal tumor surveillance indicated in confirmed
    nonsyndromic 46,XX testicular DSD, and should risk be stratified by gonadal
    location, age, histology, or Y-derived material such as TSPY?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#46,XX testicular disorder of sex development
  rationale: >-
    Published tumor series are dominated by ovotesticular cases and do not
    establish a testicular-only risk estimate or validated screening schedule.
    Until expert review resolves this, the entry should not imply routine
    biopsy, prophylactic gonadectomy, or a tumor-surveillance protocol.
  evidence:
  - reference: PMID:35900314
    reference_title: "Gonadal tumor development in 46,XX disorders of gonadal development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Totally 15 patients were classified as ovotesticular and only 1 as
      testicular DSD.
    explanation: >-
      Shows why the malignancy findings cannot be generalized to the
      testicular-only population.
  - reference: PMID:35900314
    reference_title: "Gonadal tumor development in 46,XX disorders of gonadal development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of early germ cell malignancies in our cohort brings awareness
      and needs further research.
    explanation: >-
      Supports retaining the question as an open research need rather than a
      settled surveillance recommendation.

  evidence:
  - reference: PMID:27378692
    reference_title: A recurrent p.Arg92Trp variant in steroidogenic factor-1 (NR5A1) can act as a molecular switch in human sex development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that a specific recurrent heterozygous missense mutation
      (p.Arg92Trp) in the accessory DNA-binding region of NR5A1 is associated
      with variable degree of testis development in 46,XX children and adults
      from four unrelated families.
    explanation: >-
      Supports the specific heterozygous NR5A1 variant class and variable
      expressivity.
- name: WT1-related
  display_name: WT1-related nonsyndromic 46,XX testicular DSD
  classification: molecular_etiology
  genes:
  - preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  description: >-
    Rare SRY-negative subtype associated with specific heterozygous variants
    affecting the WT1 C-terminal fourth zinc-finger regulatory domain, rather
    than the full syndromic WT1 disease spectrum.
  evidence:
  - reference: PMID:40089886
    reference_title: "[A case of 46,XX testicular disorders of sex development due to an apparent synonymous variant in the WT1 gene: difficulties of differential diagnosis of intrauterine virililzation syndrome in a girl]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic analysis (whole exome sequencing with Sanger validation)
      revealed a de novo variant in exon 9 of the WT1 gene
      (chr11:32413528T&gt;C), which, according to predictions, did not lead to a
      change in the amino acid sequence (p.Thr479=, NM_024426.6), but disrupted
      splicing, resulting in a previously described in 46,XX TDSD a change in
      the C-terminal domain of WT1.
    explanation: >-
      Documents a de novo splice-disrupting WT1 variant in SRY-negative
      testicular DSD.
- name: Unknown cause
  display_name: SRY-negative 46,XX testicular DSD of unknown cause
  classification: molecular_etiology
  description: >-
    Molecularly unresolved testicular-only disease after adequate SRY,
    copy-number, coding, and regulatory-region assessment.
  evidence:
  - reference: PMID:38721146
    reference_title: "Testicular differentiation in 46,XX DSD: an overview of genetic causes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, it is important to note that a significant number of patients
      with these DSD conditions have not yet recognized a genetic diagnosis.
    explanation: >-
      Supports retaining a molecularly unresolved subtype.
prevalence:
- population: Global
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    The condition is repeatedly described as rare, but the commonly quoted
    1-in-20,000-males figure is a secondary estimate rather than a measured
    denominator-based point prevalence; no normalized rate is asserted here.
  evidence:
  - reference: PMID:38721146
    reference_title: "Testicular differentiation in 46,XX DSD: an overview of genetic causes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two rare conditions are associated with disruptions in ovarian
      determination, including 46,XX testicular differences in sex development
      (DSD), in which the 46,XX gonads differentiate into testes, and 46,XX
      ovotesticular DSD, characterized by the coexistence of ovarian and
      testicular tissue in the same individual.
    explanation: >-
      Supports qualitative rare-disease classification without implying a
      measured prevalence.
inheritance:
- name: Usually de novo molecular events
  description: >-
    SRY-positive disease usually arises from a de novo X-Y interchange; known
    SOX3 CNVs and nonsyndromic WT1 variants have also usually been de novo when
    parents were tested. Recurrence risk is therefore molecular-cause specific
    and cannot be summarized by one Mendelian mode.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SRY-positive 46,XX testicular DSD is generally not inherited because it
      results from de novo abnormal interchange between the Y chromosome and
      the X chromosome, resulting in the presence of SRY on the X chromosome
      and infertility.
    explanation: >-
      Supports the usual de novo origin of the common SRY-positive subtype.
- name: Autosomal dominant, sex-limited, with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Familial SOX9 regulatory duplications and heterozygous NR5A1 p.Arg92
    variants can segregate dominantly, but expression is limited by chromosome
    complement and can be incomplete or variable.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in NR5A1 are inherited in an autosomal dominant
      fashion, with reduced penetrance and variable expressivity.
    explanation: >-
      Establishes the dominant, incompletely penetrant NR5A1 branch.
  - reference: PMID:37551848
    reference_title: "The smallest likely pathogenic duplication of a SOX9 enhancer identified to date in a family with 46,XX testicular differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The unaffected mother also carries this duplication, consistent with
      previously described incomplete penetrance.
    explanation: >-
      Directly demonstrates incomplete penetrance of a familial SOX9 enhancer
      duplication.
progression:
- phase: Fetal testis-determination phase
  age_range: fetal development
  notes: >-
    An ectopic pro-testis signal redirects the bipotential 46,XX gonad toward
    Sertoli-cell and testicular differentiation, with fetal AMH and androgen
    output determining internal and external genital anatomy.
  evidence:
  - reference: PMID:21183788
    reference_title: Identification of SOX3 as an XX male sex reversal gene in mice and humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further analysis indicated that Sox3 induced testis differentiation in
      this particular line of mice by upregulating expression of Sox9 via a
      similar mechanism to Sry.
    explanation: >-
      Demonstrates a developmental route by which ectopic SOX3 can activate the
      pro-testis program.
- phase: Birth and childhood presentation
  age_range: birth through childhood
  notes: >-
    A minority present at birth with atypical genital anatomy; others have
    typical male external genitalia and may remain unrecognized through
    childhood.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 15% of individuals with nonsyndromic 46,XX testicular DSD
      present at birth with ambiguous genitalia.
    explanation: >-
      Supports the neonatal presentation branch and its minority frequency.
- phase: Postpubertal recognition
  age_range: adolescence and adulthood
  notes: >-
    Most recognized individuals present after puberty with small testes,
    gynecomastia, azoospermia, and infertility despite otherwise typical male
    pubertal features.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 85% of individuals with nonsyndromic 46,XX testicular DSD
      present after puberty with normal pubic hair and normal penile size but
      small testes, gynecomastia, and sterility resulting from azoospermia.
    explanation: >-
      Defines the dominant postpubertal clinical presentation.
- phase: Potential later primary testicular insufficiency
  age_range: adolescence through adulthood
  notes: >-
    Gonadotropins may rise before testosterone becomes frankly low, but sparse
    longitudinal data do not establish a uniformly progressive endocrine
    course. Germ-cell loss, testicular volume, and adult androgen status should
    therefore be assessed longitudinally rather than presumed from age alone.
  evidence:
  - reference: PMID:38841305
    reference_title: "46,XX Differences of Sex Development outside congenital adrenal hyperplasia: pathogenesis, clinical aspects, puberty, sex hormone replacement therapy and fertility outcomes."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It was suggested that levels of testosterone may be normal during
      adolescence, but decreased in adulthood ( 65), however, few data have been
      published so far.
    explanation: >-
      Supports an age-dependent endocrine course while explicitly preserving
      the limited evidence base.
pathophysiology:
- name: Ectopic SRY after Xp-Yp exchange
  description: >-
    Abnormal X-Y recombination transfers an SRY-containing segment of Yp to an
    X chromosome, allowing SRY expression in a 46,XX bipotential gonad.
  genes:
  - preferred_term: SRY
    term:
      id: hgnc:11311
      label: SRY
  biological_processes:
  - preferred_term: sex determination
    term:
      id: GO:0007530
      label: sex determination
    modifier: ABNORMAL
  subtypes:
  - SRY-positive
  evidence:
  - reference: PMID:25102093
    reference_title: "Clinical and molecular studies in four patients with SRY-positive 46,XX testicular disorders of sex development: implications for variable sex development and genomic rearrangements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four patients with SRY-positive 46,XX testicular disorders of
      sex development (46,XX-TDSD) (cases 1-4).
    explanation: >-
      The primary study maps Xp-Yp rearrangements in four SRY-positive cases.
  downstream:
  - target: Sustained pro-testis program
    description: Ectopic SRY initiates the SOX9-centered testis-determination cascade.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - SRY transcriptional activity increases SOX9 expression in supporting-cell precursors.
    evidence:
    - reference: PMID:21183788
      reference_title: Identification of SOX3 as an XX male sex reversal gene in mice and humans.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The Y chromosome-linked gene sex-determining region Y (SRY) is believed
        to be the master initiator of male sex determination in almost all
        eutherian and metatherian mammals, functioning to upregulate expression
        of its direct target gene Sry-related HMG box-containing gene 9 (SOX9).
      explanation: >-
        Supports the SRY-to-SOX9 intermediate step.
- name: SOX9 enhancer dosage gain
  description: >-
    Duplications or rearrangements of distal upstream SOX9 enhancers raise
    SOX9 activity above the threshold for testis determination without SRY.
  genes:
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  biological_processes:

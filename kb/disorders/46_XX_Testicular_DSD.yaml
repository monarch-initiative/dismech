name: 46,XX testicular disorder of sex development
creation_date: "2026-05-08T12:00:00Z"
category: Mendelian
description: >-
  Nonsyndromic 46,XX testicular disorder of sex development (DSD) is a rare,
  genetically heterogeneous disorder in which a person with a 46,XX karyotype
  develops two testes without ovarian tissue or extra-genitourinary syndromic
  features. Müllerian structures are ordinarily absent, while external genital
  anatomy ranges from typical male to atypical. Most cases result from ectopic
  SRY on an X chromosome; SRY-negative causes include regulatory copy-number or
  structural variants affecting SOX9 or SOX3 and specific heterozygous variants
  in NR5A1 or WT1. The clinical course is age dependent: some children present
  with atypical genitalia, whereas many individuals first present after puberty
  with small testes, azoospermia, infertility, gynecomastia, or progressive
  primary testicular insufficiency. This entry excludes 46,XX ovotesticular DSD
  and the distinct syndromic RSPO1- and NR2F2-related disorders.
disease_term:
  preferred_term: 46,XX testicular disorder of sex development
  term:
    id: MONDO:0100249
    label: 46,XX testicular disorder of sex development
synonyms:
- 46,XX testicular DSD
- 46,XX male syndrome (historical)
- 46,XX sex reversal (historical)
- de la Chapelle syndrome (historical)
parents:
- Disorder of sex development
- Gonadal development disorder
- Male infertility disorder
definitions:
- name: Nonsyndromic 46,XX testicular DSD case definition
  definition_type: CASE_DEFINITION
  description: >-
    The disease boundary requires a 46,XX karyotype and testicular-only gonadal
    differentiation, without ovarian tissue. Typical nonsyndromic disease also
    lacks Müllerian structures and congenital or neurodevelopmental features
    outside the genitourinary system. Histologic ovarian tissue instead defines
    ovotesticular DSD; palmoplantar keratoderma, cutaneous squamous-cell-carcinoma
    predisposition, congenital heart disease, or other syndromic findings should
    trigger evaluation for a separate molecular syndrome.
  scope: >-
    MONDO:0100249 is curated here as the nonsyndromic testicular-only umbrella,
    not as a generic phenotype bucket for every cause of testicular tissue in a
    46,XX individual.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonsyndromic 46,XX testicular disorders/differences of sex development
      (DSD) are characterized by: the presence of a 46,XX karyotype; external
      genitalia ranging from typical male to ambiguous; two testicles;
      azoospermia; absence of müllerian structures; and absence of other
      syndromic features, such as congenital anomalies outside of the
      genitourinary system, learning disorders / cognitive impairment, or
      behavioral issues.
    explanation: >-
      GeneReviews supplies the nonsyndromic clinical boundary used for this
      entry.
  - reference: PMID:38841305
    reference_title: "46,XX Differences of Sex Development outside congenital adrenal hyperplasia: pathogenesis, clinical aspects, puberty, sex hormone replacement therapy and fertility outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is characterized by the presence of testes in 46,XX individuals, with
      concomitant absence of Mullerian derivatives.
    explanation: >-
      This review independently supports testicular gonads and absent Müllerian
      derivatives as the defining anatomic pattern.

  genes:
  - preferred_term: SRY
    term:
      id: hgnc:11311
      label: SRY
  description: >-
    The common molecular subtype, usually caused by a de novo Xp-Yp exchange
    that places SRY on an X chromosome; rare translocations to an autosome are
    also described.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 80% of individuals with nonsyndromic 46,XX testicular DSD
      are SRY positive, as shown by use of FISH or chromosomal microarray.
    explanation: >-
      Supports the frequency and molecular definition of the SRY-positive
      subtype.
- name: SRY-negative
  display_name: SRY-negative 46,XX testicular DSD
  classification: SRY_status
  children:
  - SRXX2
  - SRXX3
  - SRXX4
  - WT1-related
  - Unknown cause
  description: >-
    Testicular differentiation occurs without detectable SRY. Established
    nonsyndromic causes include SOX9 and SOX3 regulatory rearrangements and
    specific heterozygous variants in NR5A1 or WT1; many cases remain
    molecularly unresolved.
  evidence:
  - reference: PMID:20301589
    reference_title: "Nonsyndromic 46,XX Testicular Disorders/Differences of Sex Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other causes in SRY-negative individuals include small copy number
      variants (CNVs) in or around SOX3 or SOX9 and specific heterozygous
      pathogenic variants in NR5A1 or WT1.
    explanation: >-
      Defines the established nonsyndromic SRY-negative etiologies.

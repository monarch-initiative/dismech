name: Pendred Syndrome
creation_date: "2026-08-28T16:30:00Z"
category: Mendelian
description: >-
  Pendred syndrome is one protein failing in two epithelia, and almost everything
  clinically distinctive about it follows from that. Pendrin, encoded by
  SLC26A4, is an apical anion exchanger that moves chloride, bicarbonate and
  iodide. In the inner ear it secretes bicarbonate into endolymph; in the thyroid
  it sits at the apical membrane of the follicular cell facing the lumen, where
  iodide has to cross to be organified. Losing it therefore gives sensorineural
  hearing loss with an enlarged vestibular aqueduct and, separately, a partial
  iodide organification defect with goitre.

  The inner-ear arm is developmental and time-limited, which is the fact that
  organises the rest of the entry. Conditional restoration of Slc26a4 in mice
  showed that pendrin is required across a narrow perinatal interval, and that
  its absence in that interval acidifies endolymph, collapses the endocochlear
  potential and leaves the animal unable to acquire normal hearing. So the injury
  is not a slow degeneration that could be arrested at any point - it is a
  developmental failure with a closing window, and that is what any
  disease-modifying therapy has to reach.

  The second thing worth stating plainly is that this is the syndromic end of a
  spectrum, not a separate disease from DFNB4. The same biallelic SLC26A4
  genotypes produce hearing loss with an organification defect in some people and
  without one in others, and iodine intake modifies which. The thyroid phenotype
  is what names the syndrome; it is not what causes the deafness.
disease_term:
  preferred_term: Pendred syndrome
  term:
    id: MONDO:0010134
    label: Pendred syndrome
synonyms:
- PDS
- goiter-deafness syndrome
- deafness with goitre
- autosomal recessive sensorineural hearing impairment and goiter
parents:
- Hearing loss disorder
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SLC26A4 variants. The allelic accounting is unusually well
    characterised and is curated in the genetic section, because a substantial
    minority of patients with the same inner-ear phenotype carry only one
    detectable coding allele or none.
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SLC26A4-SNHL is established in a proband with suggestive findings
      and biallelic pathogenic variants in SLC26A4 identified by molecular genetic testing.
    explanation: GeneReviews states the biallelic requirement as the diagnostic criterion.
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for an SLC26A4 pathogenic variant,
      each sib of the proband has at conception a 25% chance of having SLC26A4-SNHL, a 50%
      chance of being heterozygous, and a 25% chance of inheriting neither of the pathogenic
      variants.
    explanation: The transmission risk, which is the fact a family actually needs from the
      inheritance mode. Note the conditional the sentence opens with - it holds once both
      parents are established as carriers, which the entry's own account of CEVA and
      deep-intronic alleles shows is not automatic.
has_subtypes:
- name: Pendred syndrome
  display_name: Pendred syndrome, with thyroid involvement
  description: >-
    The syndromic phenotype: SLC26A4 hearing loss plus a demonstrable iodide
    organification defect, usually with goitre. Recognised more often where salt
    is not iodised.
- name: DFNB4
  display_name: DFNB4, nonsyndromic SLC26A4 hearing loss with EVA
  description: >-
    The same inner-ear disease without demonstrable thyroid involvement, also
    called nonsyndromic enlargement of the vestibular aqueduct. Curated as a
    subtype rather than as a separate entry because the gene, the inner-ear
    mechanism and the allelic spectrum are the same; it is the organification
    defect that separates the two labels.
  evidence:
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A thyroid iodine organification defect can lead to multinodular goiter and
      distinguishes Pendred syndrome from DFNB4.
    explanation: States exactly what separates the two labels, and by implication what
      does not.
pathophysiology:
- name: Biallelic SLC26A4 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of functional pendrin. Two distinct routes get there and they matter
    therapeutically rather than only descriptively: variants at the anion-binding
    site or the transport gate abolish exchange in a protein that reaches the
    membrane, whereas variants such as p.His723Arg fold badly and are retained in
    the endoplasmic reticulum, so the protein is competent but absent from the
    surface. Only the second class is addressable by a chaperone.
  genetic_context:
    gene:
      preferred_term: SLC26A4
      term:
        id: hgnc:8818
        label: SLC26A4
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  downstream:
  - target: Loss of Apical Anion Exchange
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9398842
    reference_title: Pendred syndrome is caused by mutations in a putative sulphate transporter
      gene (PDS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using a positional cloning strategy, we have identified the gene (PDS) mutated
      in Pendred syndrome and found three apparently deleterious mutations, each segregating
      with the disease in the respective families in which they occur.
    explanation: The gene identification, resting on cosegregation in three families.
  - reference: PMID:37690388
    reference_title: Novel small molecule-mediated restoration of the surface expression
      and anion exchange activity of mutated pendrin causing Pendred syndrome and DFNB4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed that pendrin corrector (PC2-1) increased the surface expression
      and anion exchange activity of p.H723R pendrin (H723R-PDS), the most prevalent genetic
      variant that causes Pendred syndrome and DFNB4.
    explanation: Establishes the trafficking class by showing that restoring surface
      expression restores exchange activity - which is only possible if the protein itself
      is functional.
  - reference: PMID:22116358
    reference_title: Molecular and functional characterization of human pendrin and its allelic
      variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As a general rule however, we observed a complete loss of function for all truncations
      and amino acid substitutions involving a proline.
    explanation: The transport-dead half of the claim, which the first version of this entry
      asserted without evidence. Systematic functional testing of allelic variants, showing
      classes of variant that abolish activity outright.
- name: Loss of Apical Anion Exchange
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The transport step that both organ phenotypes share. Pendrin exchanges
    chloride for bicarbonate, iodide and other anions across the apical membrane;
    what the loss costs depends entirely on which epithelium is being asked to do
    what.
  molecular_functions:
  - preferred_term: apical chloride/bicarbonate and chloride/iodide exchange
    modifier: ABSENT
    term:
      id: GO:0140829
      label: bicarbonate:monoatomic anion antiporter activity
  biological_processes:
  - preferred_term: bicarbonate secretion into endolymph
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport
  cellular_components:
  - preferred_term: apical plasma membrane
    term:
      id: GO:0016324
      label: apical plasma membrane
  chemical_entities:
  - preferred_term: bicarbonate
    term:
      id: CHEBI:17544
      label: hydrogencarbonate
  - preferred_term: iodide
    term:
      id: CHEBI:16382
      label: iodide
  downstream:
  - target: Endolymphatic Acidification
    causal_link_type: DIRECT
    description: >-
      In the inner ear, where the anion moved is bicarbonate.
  - target: Endolymphatic Compartment Enlargement
    causal_link_type: DIRECT
    description: >-
      The structural consequence of disturbed endolymph handling, giving the
      enlarged vestibular aqueduct.
  - target: Impaired Thyroid Iodide Organification
    causal_link_type: DIRECT
    description: >-
      In the thyrocyte, where the anion moved is iodide.
  evidence:
  - reference: PMID:22116353
    reference_title: Transcriptional regulation of the pendrin gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pendrin (SLC26A4), a Cl(-)/anion exchanger encoded by the gene PDS, is highly
      expressed in the kidney, thyroid and inner ear epithelia and is essential for bicarbonate
      secretion/chloride reabsorption, iodide accumulation and endolymph ion balance, respectively.
    explanation: One sentence mapping the same transport function onto its three
      epithelia, which is the organising claim of this node.
- name: Endolymphatic Acidification
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Without bicarbonate secretion the endolymph becomes acidic. In the
    conditional mouse this is the measured proximate consequence of withdrawing
    pendrin, and it appears within the developmental window rather than
    accumulating over years.
  locations:
  - preferred_term: endolymphatic sac
    term:
      id: UBERON:0002223
      label: endolymphatic sac
  downstream:
  - target: Loss of Endocochlear Potential
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21965328
    reference_title: Mouse model of enlarged vestibular aqueducts defines temporal requirement
      of Slc26a4 expression for hearing acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Lack of pendrin during this period led to endolymphatic acidification, loss
      of the endocochlear potential, and failure to acquire normal hearing.
    explanation: The measured causal chain in the conditional mouse, quoted in full because
      it establishes three consecutive nodes at once.
- name: Loss of Endocochlear Potential
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The endocochlear potential is the battery that drives transduction current
    through the hair cells. It collapses when endolymph composition fails, and
    without it the hair cells cannot do their job however intact they are.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  downstream:
  - target: Failure to Acquire Normal Hearing
    causal_link_type: DIRECT
- name: Endolymphatic Compartment Enlargement
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Dilation of the endolymphatic duct and sac, seen radiologically as the
    enlarged vestibular aqueduct that gives the phenotype its imaging name. It is
    a fixed structural malformation rather than a progressive lesion, which is
    why the imaging is stable while the hearing is not.
  locations:
  - preferred_term: vestibular aqueduct
    term:
      id: UBERON:0002279
      label: vestibular aqueduct
  downstream:
  - target: Failure to Acquire Normal Hearing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The enlargement accompanies the hearing loss and marks the same underlying
      failure, but the step from a dilated compartment to a specific hearing
      deficit is not resolved separately from the endolymph-composition route.
  - target: phenotypes#Enlarged Vestibular Aqueduct
    causal_link_type: DIRECT
  - target: phenotypes#Incomplete Partition of the Cochlea Type II
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cochlear partition anomaly accompanies the aqueduct enlargement in the
      same malformation spectrum; whether it arises from the same endolymph
      disturbance or from an independent developmental effect of pendrin loss is
      not resolved.
  evidence:
  - reference: PMID:41701544
    reference_title: Postnatal Slc26a4 gene therapy improves hearing and structural integrity
      in a hereditary hearing loss model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the therapy preserved hair cells, reduced endolymphatic sac enlargement, partially
      restored the endocochlear potential, and mitigated inner ear structural degeneration
    explanation: Shows the enlargement responding to restoration of the gene, which ties
      it to pendrin loss rather than to a downstream consequence of deafness.
- name: Impaired Thyroid Iodide Organification
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Iodide reaches the follicular lumen less efficiently, so organification onto
    thyroglobulin is partial. The defect is partial rather than complete, and the
    entry does not claim pendrin is the only apical route - other channels can
    carry iodide, which is why the thyroid phenotype is variable where the
    inner-ear phenotype is not.
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  locations:
  - preferred_term: thyroid gland
    term:
      id: UBERON:0002046
      label: thyroid gland
  downstream:
  - target: Compensatory Thyroid Stimulation and Goitre
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced hormone output raises TSH, which drives follicular hyperplasia.
  - target: Reduced Local Thyroid Hormone During Inner Ear Development
    causal_link_type: DIRECT
  - target: phenotypes#Iodide Organification Defect
    causal_link_type: DIRECT
  - target: phenotypes#Hypothyroidism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Only where compensation fails; most patients remain euthyroid at the cost of
      a larger gland.
  evidence:
  - reference: PMID:28648509
    reference_title: Pendred syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Functional studies have demonstrated that pendrin can mediate iodide efflux
      in heterologous cells. This, together with the thyroid phenotype observed in humans
      (goiter, impaired iodine organification) suggests that pendrin could be involved in
      iodide efflux into the lumen, one of the steps required for thyroid hormone synthesis.
    explanation: States the mechanism and, in the review's own hedged wording, its limits -
      which is why this node is worded as a partial defect rather than an absolute block.
  - reference: PMID:28648509
    reference_title: Pendred syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Iodide efflux can, however, also occur in the absence of pendrin suggesting
      that other exchangers or channels are involved.
    explanation: PARTIAL because it qualifies rather than supports the claim - the reason
      this entry does not present pendrin as the sole apical iodide route.
- name: Reduced Local Thyroid Hormone During Inner Ear Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A second, parallel route from the same protein to the same deafness. Thyroid
    hormone is required for cochlear maturation, and a mouse allele with a
    normal-sized thyroid and normal circulating hormone nevertheless showed
    atrophic follicles and inner-ear defects that resemble hypothyroidism - a
    thickened tectorial membrane, absent BK channel expression in inner hair
    cells, reduced inner-ear bone calcification. PROVISIONAL because it rests on
    one mouse allele and is proposed rather than established for human disease,
    and because it is a contributing route rather than a substitute for the
    endolymph mechanism.
  downstream:
  - target: Failure to Acquire Normal Hearing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Through the cochlear maturation defects that thyroid hormone deficiency
      produces.
  evidence:
  - reference: PMID:24760582
    reference_title: Atrophic thyroid follicles and inner ear defects reminiscent of cochlear
      hypothyroidism in Slc26a4-related deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The pathological inner ear hallmarks included thicker tectorial membrane with
      reduced β-tectorin protein expression, the absence of BK channel expression of inner
      hair cells, and reduced inner ear bone calcification.
    explanation: The measured inner-ear phenotype that motivates the cochlear-hypothyroidism
      reading.
  - reference: PMID:24760582
    reference_title: Atrophic thyroid follicles and inner ear defects reminiscent of cochlear
      hypothyroidism in Slc26a4-related deafness.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: We propose that insufficient availability of thyroid hormone during inner ear
      development plays an important role in the mechanism underlying deafness as a result
      of SLC26A4 mutations.
    explanation: PARTIAL because the authors state this as a proposal from a mouse allele,
      which is why the node is graded PROVISIONAL.
- name: Compensatory Thyroid Stimulation and Goitre
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Rising TSH drives glandular enlargement, typically appearing in the second
    decade and typically with preserved or only mildly reduced thyroid function.
    Penetrance depends on iodine intake, so the same genotype gives goitre more
    often in a population without salt iodisation.
  downstream:
  - target: phenotypes#Goitre
    causal_link_type: DIRECT
- name: Failure to Acquire Normal Hearing
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint of both inner-ear routes. Two features distinguish it
    from most congenital hearing loss and both follow from the mechanism: some
    newborns pass screening, because the deficit is not always complete at birth;
    and the loss is characteristically fluctuating and step-wise rather than
    smoothly progressive.
  downstream:
  - target: phenotypes#Sensorineural Hearing Loss
    causal_link_type: DIRECT
  - target: phenotypes#Vertigo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vestibular dysfunction accompanies the cochlear failure and shares the
      endolymph disturbance, but is not caused by the hearing loss itself.
phenotypes:
- category: Auditory
  name: Sensorineural Hearing Loss
  frequency: OBLIGATE
  description: >-
    Bilateral in most, and severe to profound in most children by age three. It
    is progressive and characteristically fluctuating - patients describe
    step-wise drops, sometimes after minor head trauma. A substantial minority
    pass newborn hearing screening, which is a practical reason the diagnosis is
    delayed.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The time of onset and type of presentation of the SNHL vary (such that some
      newborns pass their newborn hearing screening); however, by age three years most children
      have bilateral and severe-to-profound hearing loss.
    explanation: States both the variability at birth and the severity reached in early
      childhood.
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study identified that 124 of 341 patients (36.36%) with EVA received passing
      newborn hearing screening results
    explanation: Quantifies the screening-escape fraction in a 2774-patient cohort, which
      is the number behind the delayed-diagnosis point.
- category: Auditory
  name: Enlarged Vestibular Aqueduct
  frequency: VERY_FREQUENT
  description: >-
    The radiological hallmark, usually bilateral but sometimes unilateral.
    Laterality does not predict hearing severity, which is worth stating because
    the intuition runs the other way.
  phenotype_term:
    preferred_term: Enlarged vestibular aqueduct
    term:
      id: HP:0011387
      label: Enlarged vestibular aqueduct
  evidence:
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mutant SLC26A4 phenotype is characterized by inner ear malformations, including
      an enlarged vestibular aqueduct (EVA), incomplete cochlear partition type II and modiolar
      hypoplasia, progressive and fluctuating hearing loss, and vestibular dysfunction.
    explanation: Places EVA among the inner-ear malformations of the SLC26A4 phenotype and
      names the accompanying cochlear findings.
  - reference: PMID:30634102
    reference_title: Hearing loss in unilateral and bilateral enlarged vestibular aqueduct
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No significant differences across bilateral status were observed in audiological
      measurements.
    explanation: The measured result behind the claim that laterality does not predict
      severity.
- category: Auditory
  name: Incomplete Partition of the Cochlea Type II
  frequency: FREQUENT
  description: >-
    A cochlear malformation with a deficient interscalar septum, accompanying the
    enlarged vestibular aqueduct in the same imaging spectrum. Often reported
    together with modiolar hypoplasia.
  phenotype_term:
    preferred_term: Incomplete partition of the cochlea type II
    term:
      id: HP:0000376
      label: Incomplete partition of the cochlea type II
  evidence:
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mutant SLC26A4 phenotype is characterized by inner ear malformations, including
      an enlarged vestibular aqueduct (EVA), incomplete cochlear partition type II and modiolar
      hypoplasia, progressive and fluctuating hearing loss, and vestibular dysfunction.
    explanation: Names the cochlear partition anomaly as part of the SLC26A4 malformation
      spectrum, alongside EVA rather than instead of it.
- category: Endocrine
  name: Iodide Organification Defect
  frequency: OBLIGATE
  subtype: Pendred syndrome
  description: >-
    Partial failure to incorporate iodide onto thyroglobulin, demonstrated by a
    positive perchlorate discharge test. This is the discriminating feature of the
    syndrome: it is what separates Pendred syndrome from DFNB4 in patients whose
    inner-ear disease is identical, and it is the reason this entry curates the
    two as subtypes of one disease rather than as one disease with an incidental
    thyroid finding.

    Graded OBLIGATE because the subtype is defined by it: a patient without a
    demonstrable defect is DFNB4 by definition. That is a statement about the
    definition, not about test sensitivity - the defect is partial and a
    confirmed patient can discharge normally, which is why the diagnosis entry
    records the perchlorate test's limits separately.
  phenotype_term:
    preferred_term: Thyroid defect in oxidation and organification of iodide
    term:
      id: HP:0008263
      label: Thyroid defect in oxidation and organification of iodide
  evidence:
  - reference: PMID:11919333
    reference_title: 'Differential diagnosis between Pendred and pseudo-Pendred syndromes:
      clinical, radiologic, and molecular studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, all patients had goiter with positive perchlorate test, hypothyroidism,
      and severe or profound sensorineural hearing loss.
    explanation: The organification defect measured by perchlorate test in genetically
      confirmed patients, alongside the other two cardinal features.
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A thyroid iodine organification defect can lead to multinodular goiter and
      distinguishes Pendred syndrome from DFNB4.
    explanation: States that this phenotype is the discriminator between the two subtypes,
      which is what makes it load-bearing for this entry's scope decision.
  - reference: PMID:21274344
    reference_title: 'Congenital goitrous hypothyroidism, deafness and iodide organification
      defect in four siblings: Pendred or pseudo-Pendred?'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report four siblings who have goiter, severe hypothyroidism, a positive
      perchlorate discharge test and sensorineural deafness, but not the inner ear abnormality
      which is diagnostic for PDS.
    explanation: PARTIAL, and deliberately so - these siblings have the organification defect
      and the deafness without the inner-ear malformation, which is the differential the
      perchlorate test alone cannot settle. Cited to bound the phenotype's specificity, not
      to support it.
- category: Endocrine
  name: Goitre
  frequency: FREQUENT
  subtype: Pendred syndrome
  description: >-
    Thyroid enlargement, appearing gradually and typically in the second decade.
    It is the feature that names the syndrome and the one whose frequency depends
    on the population's iodine intake - which is why a cohort frequency for it
    describes a health system as much as a genotype.
  phenotype_term:
    preferred_term: Goiter
    term:
      id: HP:0000853
      label: Goiter
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Thyroid enlargement (goiter) occurs gradually and is typically evident in the
      second decade, especially if iodine is not routinely included in the diet.
    explanation: States the timing and the iodine dependence together.
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Recurrent vertigo (256 of 597 [42.9%]) and goiter (38 of 597 [6.4%]) were common
      comorbidities.
    explanation: PARTIAL because the 6.4% is the goitre frequency in an EVA cohort in a
      salt-iodised population and in a young cohort, so it understates goitre in Pendred
      syndrome specifically rather than measuring it.
- category: Endocrine
  name: Hypothyroidism
  frequency: OCCASIONAL
  subtype: Pendred syndrome
  description: >-
    Most patients are euthyroid; a minority are hypothyroid. The organification
    defect is partial, so thyroid function is often maintained at the cost of a
    larger gland.
  phenotype_term:
    preferred_term: Hypothyroidism
    term:
      id: HP:0000821
      label: Hypothyroidism
  evidence:
  - reference: PMID:28648509
    reference_title: Pendred syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pendred syndrome is an autosomal recessive disorder that is classically defined
      by the combination of sensorineural deafness/hearing impairment, goiter, and an abnormal
      organification of iodide with or without hypothyroidism.
    explanation: The classical definition, which is explicit that hypothyroidism is
      optional within it.
- category: Vestibular
  name: Vertigo
  frequency: FREQUENT
  description: >-
    Vestibular dysfunction is common and under-studied relative to the hearing
    loss. In children it can present as head-tilting, vomiting or new clumsiness
    rather than as reported dizziness, and it may precede the hearing
    fluctuations.
  phenotype_term:
    preferred_term: Vertigo
    term:
      id: HP:0002321
      label: Vertigo
    temporality: RECURRENT
  evidence:
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recurrent vertigo (256 of 597 [42.9%]) and goiter (38 of 597 [6.4%]) were common
      comorbidities.
    explanation: The measured vertigo frequency in a large EVA cohort.
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Manifestations of vestibular dysfunction (such as head-tilting, vomiting, and/or
      delayed ambulation or clumsiness in a child who previously walked well) can precede
      or accompany the fluctuations in hearing typical of this disorder.
    explanation: Describes how the vestibular phenotype actually presents in children,
      which is why it is missed.
prevalence:
- population: Non-African populations
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 7.5
  rate_low: 7.5
  rate_high: 10.0
  notes: >-
    Reported as 7.5-10 per 100,000 in non-African populations. The population
    qualifier is the source's own and is worth keeping: this entry's genetic
    section records that the proportion of EVA attributable to biallelic SLC26A4
    differs markedly between cohorts, so a prevalence figure carries a population
    with it rather than describing the disease in general.
  evidence:
  - reference: PMID:40956475
    reference_title: Prevalence of pendrin defects in sudanese families with congenital hypothyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of PDS in non-African populations is estimated to be between
      7.5 and 10 per 100,000
    explanation: The published estimate with its population restriction stated in the same
      clause.
genetic:
- name: SLC26A4
  gene_term:
    preferred_term: SLC26A4
    term:
      id: hgnc:8818
      label: SLC26A4
  relationship_type: CAUSATIVE
  notes: >-
    The allelic accounting is the part of this gene worth curating carefully,
    because "biallelic SLC26A4" does not describe every patient with the
    phenotype. Patients are classified by how many mutant coding or splice-site
    alleles are detectable: M2 with two, M1 with one, M0 with none. In European
    populations most M1 patients carry CEVA, a haplotype of twelve variants
    upstream of the gene that behaves as a pathogenic recessive allele in trans,
    and M1-plus-CEVA gives a milder phenotype than M2. M0 patients have a very
    low recurrence probability and are probably a different disease.

    Two consequences for how this entry should be read. A negative coding-region
    result does not exclude SLC26A4, because the second hit may be regulatory.
    And cohort ascertainment matters: a Chinese cohort found biallelic variants
    in 95.9% of EVA patients, where roughly half of European EVA is not
    biallelic, so a single figure for "the proportion of EVA that is SLC26A4" is
    a statement about a population rather than about the gene.

    Founder alleles sharpen that further. In Okinawa, IVS15+5G>A and H723R
    together account for roughly two thirds of alleles, and the two act by
    different routes - one abolishes expression, the other misfolds a competent
    protein. Both are curated as structured variants below rather than described
    only here, because which emerging therapy is relevant to a patient turns on
    which class their alleles fall into.
  evidence:
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In most European-Caucasian M1 patients, there is a haplotype that consists
      of 12 variants upstream of SLC26A4, called CEVA (Caucasian EVA), which acts as a pathogenic
      recessive allele in trans to mutations affecting the coding regions or splice sites
      of SLC26A4.
    explanation: Defines CEVA and its mode of action, which is the reason a single coding
      allele can still be a recessive disease.
  - reference: PMID:34345941
    reference_title: Genetic architecture and phenotypic landscape of SLC26A4-related hearing
      loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phenotype in EVA patients with no mutant alleles of SLC26A4 (M0) has a
      very low recurrence probability and is likely to be caused by other factors.
    explanation: The basis for treating M0 as probably a different disease rather than as
      undetected SLC26A4.
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic analysis revealed that 2661 of 2774 patients (95.9%) carried biallelic
      SLC26A4 variants
    explanation: The Chinese-cohort figure, quoted so the contrast with European cohorts
      is on the record rather than asserted.
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with 70 (2.5%) attributable to copy number variants and 13 (0.5%) to a deep-intronic
      variant (c.304 + 941C>T) that affected splicing
    explanation: Quantifies the structural and deep-intronic alleles that a coding-region
      panel misses - the concrete reason a negative sequencing result should not close the
      question.
  - reference: PMID:23705809
    reference_title: Pathogenic substitution of IVS15 + 5G > A in SLC26A4 in patients of
      Okinawa Islands with enlarged vestibular aqueduct syndrome or Pendred syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most prevalent types of SLC26A4 alleles were IVS15 + 5G > A and H723R,
      which both accounted for 15/22 (68%) of the patients.
    explanation: Founder alleles in an Okinawan cohort, and the basis for the two structured
      variant records below.
  variants:
  - name: p.His723Arg
    description: >-
      The trafficking-class allele, and the most prevalent variant causing Pendred
      syndrome and DFNB4 in East Asian populations. The protein folds badly and is
      retained in the endoplasmic reticulum rather than reaching the apical
      membrane, so the transport machinery itself is competent - which is why
      restoring its surface expression restores anion exchange, and why this is
      the one allele class a small-molecule chaperone can address. In an Okinawan
      cohort it accounted, with IVS15+5G>A, for about two thirds of alleles. Which
      emerging therapy is relevant to a patient is therefore partly a question of
      ancestry.
    synonyms:
    - H723R
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37690388
      reference_title: Novel small molecule-mediated restoration of the surface expression
        and anion exchange activity of mutated pendrin causing Pendred syndrome and DFNB4.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We observed that pendrin corrector (PC2-1) increased the surface expression
        and anion exchange activity of p.H723R pendrin (H723R-PDS), the most prevalent genetic
        variant that causes Pendred syndrome and DFNB4.
      explanation: Establishes both the trafficking mechanism and this allele's prevalence,
        in the study that makes it the corrector's target.
    - reference: PMID:23705809
      reference_title: Pathogenic substitution of IVS15 + 5G > A in SLC26A4 in patients of
        Okinawa Islands with enlarged vestibular aqueduct syndrome or Pendred syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We found a compound heterozygous mutation for IVS15 + 5G > A/H723R in nine
        patients (41%), a homozygous substitution of IVS15 + 5G > A in six patients (27%),
        and homozygous mutation for H723R in five patients (23%).
      explanation: The per-genotype breakdown in the founder population, showing this allele
        in both homozygous and compound-heterozygous configurations.
  - name: IVS15+5G>A
    description: >-
      A splice-site variant that abolishes expression rather than producing a
      defective protein. It is the counterpart class to p.His723Arg and the reason
      the two are curated separately: there is nothing for a chaperone to rescue
      here, so a gene-replacement approach is the only one with a target.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23705809
      reference_title: Pathogenic substitution of IVS15 + 5G > A in SLC26A4 in patients of
        Okinawa Islands with enlarged vestibular aqueduct syndrome or Pendred syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The substitution of IVS15 + 5G > A leads to a loss of SLC26A expression and
        results in a phenotype of PS and EVA.
      explanation: The mechanism - loss of expression, not a misfolded product - which is
        what places this allele in a different therapeutic class from H723R.
diagnosis:
- name: Temporal Bone Imaging
  description: >-
    CT or MRI demonstrating the enlarged vestibular aqueduct, and with it the
    incomplete cochlear partition and modiolar hypoplasia that often accompany
    it. In practice the combination of audiology and imaging is what makes the
    diagnosis before genetics is available.
  diagnosis_term:
    preferred_term: temporal bone CT or MRI
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:41066100
    reference_title: Reevaluation of Enlarged Vestibular Aqueduct.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: while 375 of 597 (62.8%) received a diagnosis through combined audiological
      and radiological assessments
    explanation: Quantifies how the diagnosis is actually reached in a large cohort.
- name: SLC26A4 Molecular Testing
  description: >-
    Establishes the diagnosis. A negative coding-region result in a patient with
    the imaging phenotype should raise the CEVA haplotype and structural or
    deep-intronic alleles rather than exclude the gene.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SLC26A4-SNHL is established in a proband with suggestive findings
      and biallelic pathogenic variants in SLC26A4 identified by molecular genetic testing.
    explanation: The diagnostic criterion as GeneReviews states it.
- name: Perchlorate Discharge Test
  description: >-
    Measures whether iodide taken up by the thyroid has been organified:
    perchlorate displaces un-organified iodide, so a discharge above threshold
    reports a defect. It is what makes the syndromic/nonsyndromic distinction
    demonstrable rather than assumed.

    Two limits are worth stating. The defect is partial, so the test can be
    negative in a genetically confirmed patient - which is part of why iodine-replete
    populations report lower goitre and organification frequencies. And it is not
    specific: siblings with goitre, hypothyroidism, deafness and a positive
    discharge test but no inner-ear malformation have been reported as a
    pseudo-Pendred phenotype, so a positive test does not by itself make the
    diagnosis.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:11919333
    reference_title: 'Differential diagnosis between Pendred and pseudo-Pendred syndromes:
      clinical, radiologic, and molecular studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, all patients had goiter with positive perchlorate test, hypothyroidism,
      and severe or profound sensorineural hearing loss.
    explanation: The test used in a genetically characterised series, positive across it.
  - reference: PMID:21274344
    reference_title: 'Congenital goitrous hypothyroidism, deafness and iodide organification
      defect in four siblings: Pendred or pseudo-Pendred?'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report four siblings who have goiter, severe hypothyroidism, a positive
      perchlorate discharge test and sensorineural deafness, but not the inner ear abnormality
      which is diagnostic for PDS.
    explanation: PARTIAL because it bounds the test rather than supporting it - a positive
      discharge test with the full clinical triad and no inner-ear malformation, which is
      the specificity limit this diagnosis entry records.
treatments:
- name: Audiological and Thyroid Surveillance
  therapeutic_modality: OTHER
  description: >-
    Not treatment but the schedule that makes the rest of management possible.
    Audiometry every three to six months until age three and annually thereafter,
    with thyroid ultrasound from age ten. The audiometric interval is the
    mechanism-relevant part: this is a fluctuating, step-wise loss, so a hearing
    level measured once is not a trajectory, and habilitation has to be re-fitted
    against a moving target.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Audiometric testing every three to six months until age three years and annually
      thereafter; baseline ultrasound to assess thyroid size at age ten years, followed by
      repeat ultrasound every five to ten years based on findings on palpation of thyroid
      size.
    explanation: The GeneReviews surveillance schedule, covering both organs this disease
      affects.
- name: Hearing Habilitation
  therapeutic_modality: DEVICE
  description: >-
    Amplification and multidisciplinary hearing habilitation, which is the
    mainstay and is habilitation rather than treatment of the disease. Early
    auditory intervention is what protects speech and language development, and
    the fluctuating course means the fitting has to be revisited rather than set
    once.
  treatment_term:
    preferred_term: hearing habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Failure to Acquire Normal Hearing
    treatment_effect: BYPASSES
    description: >-
      Amplifies the residual signal. It does nothing to the anion-transport
      lesion.
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Habilitation options tailored to the degree and frequency of hearing loss can
      include hearing aids when hearing loss is mild to severe and consideration of cochlear
      implantation (CI) when hearing aids have had limited benefit.
    explanation: The management algorithm as GeneReviews sets it out, including the
      threshold at which implantation is considered.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  description: >-
    Considered where hearing aids have had limited benefit. It carries a
    specific and predictable perioperative issue in this disorder - a perilymph
    gusher - which is a consequence of the inner-ear malformation itself rather
    than of surgical technique, and is the reason the surgeon needs the diagnosis
    beforehand rather than afterwards.
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Failure to Acquire Normal Hearing
    treatment_effect: BYPASSES
    description: >-
      Substitutes for the transduction the cochlea can no longer perform,
      stimulating the auditory nerve directly.
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: it is essential that the treating otolaryngologist be aware of the possible
      perioperative complications (most commonly perilymph gusher/oozing) and postoperative
      complications (most commonly transient vertigo) in individuals with SLC26A4-SNHL
    explanation: The disease-specific surgical risk, which is the claim that makes this a
      separate treatment item rather than a line in the habilitation entry.
- name: Levothyroxine for Thyroid Insufficiency
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Replacement where thyroid function is inadequate or to suppress goitre
    growth. It addresses the thyroid arm only; there is no evidence here that it
    alters the hearing, and the developmental window for the inner ear has closed
    long before the goitre appears.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: NCIT:C62080
        label: Levothyroxine
  target_mechanisms:
  - target: Compensatory Thyroid Stimulation and Goitre
    treatment_effect: MODULATES
    description: >-
      Reduces the TSH drive that produces the enlargement.
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Medical treatment of thyroid enlargement and/or abnormal thyroid function requires
      consultation with
    explanation: PARTIAL because GeneReviews directs the reader to specialist consultation
      rather than specifying an agent - so this item supports that the thyroid arm is
      treated, not that levothyroxine is the specified treatment.
- name: Pendrin Corrector (Investigational)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A small-molecule chaperone that restores surface expression of misfolded
    pendrin. In cells, PC2-1 restored both surface expression and anion-exchange
    activity of p.His723Arg, the most common variant in East Asian patients, and
    reached micromolar concentrations in cochlear perilymph in vivo. Preclinical
    only, and by construction it can only help the trafficking class of variants.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Biallelic SLC26A4 Loss of Function
    treatment_effect: RESTORES
    description: >-
      Restores the protein to the membrane where the defect is folding rather
      than transport. It has no target in an anion-binding-site variant.
  evidence:
  - reference: PMID:37690388
    reference_title: Novel small molecule-mediated restoration of the surface expression
      and anion exchange activity of mutated pendrin causing Pendred syndrome and DFNB4.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: These preclinical data support the hypothesis of the druggability of mutant
      pendrin using the novel corrector molecule PC2-1.
    explanation: PARTIAL because the authors present this as preclinical support for
      druggability, not as demonstrated benefit.
- name: Prenatal SLC26A4 Gene Transfer (Investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Electroporation of SLC26A4 cDNA into the otocyst of Slc26a4-knockout mice
    before birth. It prevented endolymphatic enlargement and rescued both hearing
    and vestibular function - the strongest demonstration that the inner-ear
    lesion is preventable if the protein arrives early enough, and the reason the
    therapeutic window is the question the entry's central discussion turns on.
    Prenatal otocyst electroporation is not a route available in human patients.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic SLC26A4 Loss of Function
    treatment_effect: RESTORES
    description: >-
      Supplies the gene before the critical interval rather than after it.
  evidence:
  - reference: PMID:31784581
    reference_title: Prenatal electroporation-mediated gene transfer restores Slc26a4 knock-out
      mouse hearing and vestibular function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: supplementation of the target gene cDNA into the otocysts of homozygous Slc24a4
      knockout mice significantly prevented enlargement of the endolymphatic space in the
      inner ear areas; moreover, it rescued hearing and vestibular function of mice in vivo
    explanation: Both the structural and the functional rescue. Note the source's own typo,
      "Slc24a4" for Slc26a4, reproduced as published.
- name: CRISPR Exon Skipping (Investigational)
  therapeutic_modality: GENE_EDITING
  description: >-
    Editing to skip a premature termination codon arising from the c.919-2A>G
    splice variant. Recorded here because its result is informative and negative:
    the edit restored the protein and normal vestibular function, and hearing did
    not improve, with hair cell loss and elevated thresholds on pathology. That is
    a direct counterexample to the assumption that restoring pendrin restores
    hearing whenever it is done, and it concerns the same variant as the family in
    this entry's intrafamilial-variability discussion.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic SLC26A4 Loss of Function
    treatment_effect: RESTORES
    description: >-
      Restores expression from the mutant allele. The restoration was achieved and
      did not deliver the hearing outcome, which is the finding worth carrying.
  evidence:
  - reference: PMID:39232211
    reference_title: CRISPR/Cas9-mediated exon skipping to restore premature translation
      termination in a DFNB4 mouse model.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: However, despite these molecular achievements, hearing function did not show
      the expected improvement, consistent with observed pathology, including cochlear hair
      cell loss and elevated hearing thresholds.
    explanation: PARTIAL because the molecular objective was met and the functional one was
      not. Carried as a negative result rather than omitted, since it constrains what
      restoring pendrin can be expected to achieve and when.
- name: AAV SLC26A4 Gene Replacement (Investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Delivery of SLC26A4 to the endolymphatic sac and cochlear lateral wall. The
    result that matters is that it worked postnatally in a mouse whose auditory
    phenotype resembles the human one, with effects persisting into adulthood -
    because the mouse critical-window data had made prenatal delivery look
    necessary. Whether a comparable postnatal window exists in humans is the
    central open question and is recorded as a knowledge gap.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic SLC26A4 Loss of Function
    treatment_effect: RESTORES
    description: >-
      Supplies a functional copy of the gene, acting upstream of every node in
      this entry.
  evidence:
  - reference: PMID:41701544
    reference_title: Postnatal Slc26a4 gene therapy improves hearing and structural integrity
      in a hereditary hearing loss model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Comprehensive phenotypic analyses revealed a critical therapeutic window spanning
      the neonatal and juvenile stages, within which AAV.Anc80L65-mediated SLC26A4 delivery
      significantly improved hearing, as evidenced by lower auditory brainstem response thresholds.
    explanation: The postnatal window and the hearing benefit, measured by ABR threshold.
animal_models:
- name: Doxycycline-inducible Slc26a4 transgenic mouse on the Slc26a4-null background
  species: Mouse
  genotype: Slc26a4-null carrying a doxycycline-inducible Slc26a4 transgene
  publication: PMID:21965328
  description: >-
    The model that turned pendrin's requirement into a time interval. All
    functional pendrin comes from the transgene, so expression can be started and
    stopped, and the hearing outcome read against when it was present.
  modeled_mechanisms:
  - target: Endolymphatic Acidification
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Withdrawing pendrin acidifies endolymph and collapses the endocochlear
      potential, establishing the sequence rather than inferring it from a
      constitutive null.
    limitations: >-
      The developmental timing is mouse timing. Mapping E16.5-P2 onto a human
      gestational interval is exactly the step this model cannot make, and it is
      why the therapeutic window in humans is an open question rather than a
      converted date. The constitutive Slc26a4-null mouse, by contrast, is
      profoundly deaf with malformations more severe than the human phenotype,
      so severity in either mouse should not be read across to patients.
    readouts:
    - name: Endocochlear potential
      target: Endolymphatic Acidification
      direction: DECREASED
      interpretation: >-
        The electrophysiological consequence of failed endolymph handling, and
        the step that links the ionic lesion to the sensory one.
      evidence:
      - reference: PMID:21965328
        reference_title: Mouse model of enlarged vestibular aqueducts defines temporal requirement
          of Slc26a4 expression for hearing acquisition.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Lack of pendrin during this period led to endolymphatic acidification,
          loss of the endocochlear potential, and failure to acquire normal hearing.
        explanation: The measured chain including the endocochlear potential.
  evidence:
  - reference: PMID:21965328
    reference_title: Mouse model of enlarged vestibular aqueducts defines temporal requirement
      of Slc26a4 expression for hearing acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Varying the temporal expression of Slc26a4 revealed that E16.5 to P2 was the
      critical interval in which pendrin was required for acquisition of normal hearing.
    explanation: The result that makes this model informative - a defined interval rather
      than a presence/absence phenotype.
  - reference: PMID:21965328
    reference_title: Mouse model of enlarged vestibular aqueducts defines temporal requirement
      of Slc26a4 expression for hearing acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Doxycycline initiation at E18.5 or discontinuation at E17.5 resulted in partial
      hearing loss approximating the human EVA auditory phenotype.
    explanation: Establishes that partial timing gives the partial human phenotype, which
      is what makes this model closer to patients than the constitutive null.
- name: Slc26a4 loop/loop mouse
  species: Mouse
  genotype: Slc26a4 loop/loop
  publication: PMID:24760582
  description: >-
    A mouse that is profoundly deaf with a normal-sized thyroid gland, modelling
    the nonsyndromic end of the spectrum, and in which the thyroid nevertheless
    turns out to be histologically abnormal.
  modeled_mechanisms:
  - target: Reduced Local Thyroid Hormone During Inner Ear Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows atrophic thyroid follicles with normal circulating hormone alongside
      inner-ear defects characteristic of hypothyroidism - the observation the
      cochlear-hypothyroidism reading rests on.
    limitations: >-
      Circulating thyroid hormone was within the normal range, so the model
      demonstrates a histological thyroid abnormality and an inner-ear phenotype
      resembling hypothyroidism, not a measured local hormone deficit in the
      cochlea. The causal step from one to the other is the authors' proposal.
      The mouse also lacks goitre entirely, so it does not model the syndromic
      thyroid phenotype at all.
    readouts:
    - name: Inner hair cell BK channel expression
      target: Reduced Local Thyroid Hormone During Inner Ear Development
      direction: ABOLISHED
      interpretation: >-
        A maturation marker known to be thyroid-hormone-dependent, absent here -
        which is the specific reason the phenotype is read as cochlear
        hypothyroidism rather than as generic inner-ear damage.
      evidence:
      - reference: PMID:24760582
        reference_title: Atrophic thyroid follicles and inner ear defects reminiscent of
          cochlear hypothyroidism in Slc26a4-related deafness.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: the absence of BK channel expression of inner hair cells
        explanation: The measured absence behind this readout.
  evidence:
  - reference: PMID:24760582
    reference_title: Atrophic thyroid follicles and inner ear defects reminiscent of cochlear
      hypothyroidism in Slc26a4-related deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Histological analysis of the thyroid gland revealed defective morphology, with
      a majority of atrophic microfollicles, while measurable thyroid hormone in blood serum
      was within the normal range.
    explanation: Establishes both what the model shows and the limit of what it shows -
      abnormal histology with normal circulating hormone.
environmental:
- name: Dietary iodine intake
  exposure_term:
    preferred_term: exposure to iodine
    term:
      id: ECTO:9000084
      label: exposure to iodine
  description: >-
    Iodine status modifies the thyroid phenotype without touching the inner-ear
    one. Adequate dietary iodine lets a partially defective organification step
    keep up, so goitre is less frequent and less severe where salt is iodised;
    where it is not, the same genotypes present with the goitre that named the
    syndrome. This is why goitre frequency in a cohort describes a food policy as
    much as a gene, and why the syndromic/nonsyndromic label can differ between
    populations carrying identical variants.
  evidence:
  - reference: PMID:28648509
    reference_title: Pendred syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The thyroid phenotype is variable and may be modified by the nutritional iodine
      intake.
    explanation: The exposure claim at entry level - that nutritional iodine is a modifier
      of the thyroid phenotype in this disease, which is what makes it worth recording as
      an exposure at all.
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Thyroid enlargement (goiter) occurs gradually and is typically evident in the
      second decade, especially if iodine is not routinely included in the diet.
    explanation: The dietary condition stated in the GeneReviews clinical description,
      independent of the mechanism link below.
  influences_mechanisms:
  - target: Compensatory Thyroid Stimulation and Goitre
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sufficient iodide supply raises the substrate available to a partially
      impaired organification step, reducing the TSH drive that produces glandular
      enlargement. Recorded as MODULATES rather than PROTECTS_AGAINST because the
      sources state that the thyroid phenotype is modified by iodine intake, not
      that iodine prevents the goitre.
    evidence:
    - reference: PMID:28648509
      reference_title: Pendred syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The thyroid phenotype is variable and may be modified by the nutritional iodine
        intake.
      explanation: States the modification directly, and in the hedged form the link's
        predicate is chosen to match.
    - reference: PMID:20301640
      reference_title: SLC26A4-Related Sensorineural Hearing Loss.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Thyroid enlargement (goiter) occurs gradually and is typically evident in the
        second decade, especially if iodine is not routinely included in the diet.
      explanation: The dietary condition under which the goitre is expected, from the
        GeneReviews clinical description.
discussions:
- discussion_id: pendred_human_therapeutic_window_unknown
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Doxycycline-inducible Slc26a4 transgenic mouse on the Slc26a4-null background
  - treatments#AAV SLC26A4 Gene Replacement (Investigational)
  prompt: Does the postnatal therapeutic window demonstrated in mice exist in humans, and
    when does it close?
  rationale: >-
    This is the question on which every disease-modifying therapy for Pendred
    syndrome depends, and the mouse data point two ways at once.

    The conditional model established a narrow interval, E16.5 to P2, in which
    pendrin has to be present for hearing to be acquired. In mouse developmental
    terms much of that is prenatal, and read straight across it implies that
    intervention in a human would have to be prenatal too - which would make the
    therapy close to undeliverable. The gene-therapy study then found a
    postnatal-to-juvenile window in which AAV delivery still improved auditory
    brainstem response thresholds, preserved hair cells and partially restored the
    endocochlear potential, with the effect persisting into adulthood.

    Both results are in mice, and mouse and human cochlear maturation are not on
    the same schedule relative to birth: the human cochlea is functionally mature
    considerably earlier in relative terms than the mouse cochlea is. So neither
    result converts into a human date. The specific unknown is not whether
    restoring pendrin helps - that is established in the model - but whether any
    interval after human birth retains the plasticity the mouse experiments
    exploit.

    This is recorded as a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap
    because the evidence is not absent. It exists, it is positive, and its
    translational validity to human disease is precisely what is unresolved.
  evidence:
  - reference: PMID:21965328
    reference_title: Mouse model of enlarged vestibular aqueducts defines temporal requirement
      of Slc26a4 expression for hearing acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Varying the temporal expression of Slc26a4 revealed that E16.5 to P2 was the
      critical interval in which pendrin was required for acquisition of normal hearing.
    explanation: The mouse critical interval, most of which is prenatal.
  - reference: PMID:41701544
    reference_title: Postnatal Slc26a4 gene therapy improves hearing and structural integrity
      in a hereditary hearing loss model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While gene therapy holds great potential, its postnatal application has remained
      unexplored because of the lack of suitable animal models and the challenges of prenatal
      intervention.
    explanation: The authors' own framing of why the postnatal question was open, which is
      the mismatch this discussion records.
  - reference: PMID:31784581
    reference_title: Prenatal electroporation-mediated gene transfer restores Slc26a4 knock-out
      mouse hearing and vestibular function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: it rescued hearing and vestibular function of mice in vivo
    explanation: The prenatal arm of the same question. Delivering the gene before the
      critical interval works; that it works there is what made the postnatal result
      surprising and what makes the human window the open question rather than a settled
      one.
  - reference: PMID:39232211
    reference_title: CRISPR/Cas9-mediated exon skipping to restore premature translation
      termination in a DFNB4 mouse model.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: However, despite these molecular achievements, hearing function did not show
      the expected improvement, consistent with observed pathology, including cochlear hair
      cell loss and elevated hearing thresholds.
    explanation: PARTIAL, and included because it cuts against the optimistic reading -
      restoring the protein is not sufficient once the structural damage is present, which
      is the same window constraint approached from the failure side.
- discussion_id: pendred_variant_class_determines_therapy
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#Biallelic SLC26A4 Loss of Function
  - treatments#Pendrin Corrector (Investigational)
  prompt: Why does it matter whether a SLC26A4 variant abolishes transport or abolishes
    trafficking?
  rationale: >-
    Clinically the two look the same - no pendrin function, same hearing loss.
    Mechanistically they are different lesions, and the difference decides which
    of the emerging therapies could ever work for a given patient.

    A variant at the anion-binding site or in the transport gate produces a
    protein that reaches the apical membrane and cannot move anions. Nothing that
    improves its delivery helps. A variant such as p.His723Arg produces a protein
    that would work if it arrived, and is instead retained in the endoplasmic
    reticulum; restoring its surface expression restored its exchange activity in
    cells, which is the demonstration that the protein itself is competent.

    This is why the entry curates the two routes inside one pathophysiology node
    rather than collapsing them into "loss of function", and why the corrector's
    target_mechanisms link points at that node with an explicit statement that it
    has no target in a transport-dead variant. It also sets the scope of the
    corrector approach: p.His723Arg is the most common variant in East Asian
    populations, so a chaperone strategy is far more relevant to some populations
    than others.
  evidence:
  - reference: PMID:37690388
    reference_title: Novel small molecule-mediated restoration of the surface expression
      and anion exchange activity of mutated pendrin causing Pendred syndrome and DFNB4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed that pendrin corrector (PC2-1) increased the surface expression
      and anion exchange activity of p.H723R pendrin (H723R-PDS), the most prevalent genetic
      variant that causes Pendred syndrome and DFNB4.
    explanation: Shows surface expression and function restored together, which is what
      identifies this variant as a trafficking rather than a transport lesion.
- discussion_id: pendred_intrafamilial_variability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#SLC26A4
  - phenotypes#Enlarged Vestibular Aqueduct
  prompt: Why do relatives with the same SLC26A4 genotype have different inner-ear
    morphology?
  rationale: >-
    Within a single family carrying one SLC26A4 variant, inner-ear morphology can
    differ between affected members. Since genotype, and largely environment, are
    held constant, the variation has to come from somewhere else: unidentified
    modifier loci, or stochastic variation in a developmental process that has
    only a narrow window in which to go right.

    The second possibility is not a fallback explanation. This entry's central
    mechanistic claim is that the inner-ear lesion is developmental and
    window-bounded, and a process constrained to a short interval is exactly the
    kind that produces variable outcomes from identical inputs. If that is what is
    happening, then genotype will never predict inner-ear morphology well, and
    effort spent looking for modifiers would be better spent on the natural
    history.

    Distinguishing the two matters for counselling, since one implies a
    predictable familial pattern and the other does not.
  evidence:
  - reference: PMID:38877731
    reference_title: Variability in Inner Ear Morphology Among a Family With Pendred Syndrome
      Due to a SLC26A4 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present a family of 4, all of whom possess sensorineural hearing loss due
      to the same homozygous SLC26A4 variant c.919-2A>G. Intriguingly, clinical manifestations,
      especially inner ear deformities, displayed variability among family members.
    explanation: The observation itself - one homozygous variant, four affected relatives,
      differing inner-ear morphology - which is what makes the variability a genotype-held-constant
      finding rather than an impression.

notes: >-
  Scope. Pendred syndrome and DFNB4 are curated here as subtypes of one entry
  rather than as two entries. They share the gene, the inner-ear mechanism and the
  allelic spectrum; what separates the labels is whether a thyroid organification
  defect is demonstrable, and that is modified by dietary iodine. Splitting them
  would duplicate the whole pathograph to record one branch.

  Frequencies. The cohort numbers quoted here come from a 2774-patient Chinese
  EVA cohort and are labelled as such in their evidence explanations rather than
  presented as disease frequencies. The 6.4% goitre figure in particular is
  graded PARTIAL: it measures goitre in an EVA cohort in a salt-iodised
  population, which is close to the opposite of the population in which Pendred
  syndrome's thyroid phenotype is most penetrant.

  Ontology terms. GO has no term for the endocochlear potential or for
  endolymph composition, so those nodes carry no descriptor binding and the
  claims live in the node description. The transport node carries the antiporter
  activity as a molecular function (GO:0140829) and the bicarbonate secretion as
  a biological process (GO:0015701); the iodide arm is captured by the
  chemical_entities binding rather than by a second process term.

  Two terms had to be changed because they exist but are not members of the
  schema's dynamic enum for the slot, which is a distinct failure from a term not
  existing. GO:0015701 is a real term and a wrong molecular function, since
  bicarbonate transport is a process; it was moved to biological_processes and
  the molecular function rebound to GO:0140829. NCIT:C157820 (Cochlear Implant)
  is a real term for the device, not for the clinical action, so it is not
  reachable from NCIT:C25218 and fails the TreatmentActionTerm enum; the
  implantation treatment is bound to NCIT:C15329 (Surgical Procedure) with
  preferred_term carrying the specific reading. Both were caught by
  just validate-terms rather than by inspection.

  Deep research. An openscientist run was commissioned and was substantially
  useful: all thirteen PMIDs taken from it resolved to the titles the report gave
  them when fetched with just fetch-reference, and its independently-derived
  causal model matched the one curated here, including the dual inner-ear route
  through cochlear hypothyroidism.

  What the report got wrong, and it is worth recording because these are the
  failure modes a curator has to catch. Its own term-validation section flagged
  one invented CL identifier, CL:1000722 for a beta-intercalated cell, which does
  not exist. It also proposed UBERON:0002518 for the endolymphatic sac; that
  CURIE resolves, but to "otolith organ", so nothing in the validation output
  marked it as wrong. The correct term, UBERON:0002223, was found by searching
  the ontology rather than by trusting the report. That is the more dangerous of
  the two errors: a fabricated identifier fails validation, whereas a real
  identifier for the wrong concept passes every automated check there is.

  Three off-topic caches. references_cache/PMID_11734249.md (the American Red
  Cross), PMID_15347930.md (dental veneering composites) and PMID_17997835.md
  (riboswitches) are committed here and have nothing to do with this disease.
  They came from an early attempt to fetch remembered PMIDs for known Pendred
  papers - the identifiers were wrong, the fetch returned whatever those numbers
  actually point at, and the titles made that obvious immediately. They are
  recorded here so they read as checked and discarded rather than overlooked, and
  as the reason every PMID in this entry was afterwards located by search rather
  than from memory.

  A snippet self-check that the gates caught. The intrafamilial-variability
  evidence item initially quoted only the paper's title phrase, with an
  explanation admitting it was weak. just check-snippet-length and
  just check-title-snippets both rejected it, correctly and without a
  grandfathering escape, and re-reading the cache showed the abstract carries a
  proper sentence stating the finding. The lesson is the reverse of the usual
  one: the defect was not that the source was inadequate but that the cache had
  not been read carefully enough before writing the snippet.

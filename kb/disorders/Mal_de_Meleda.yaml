notes: >-
  No GeneReviews chapter covers Mal de Meleda. Heterozygous SLURP1
  signal-peptide variants at residue A22, one with a dominant-negative effect
  on secretion, cause an autosomal dominant palmoplantar keratoderma and
  progressive symmetric erythrokeratoderma (PMID:39913669, PMID:40023748);
  that dominant allelic disorder is outside the scope of this entry. Mal de
  Meleda is unusual among inherited palmoplantar keratodermas in being caused
  by a secreted signalling protein rather than a structural keratinocyte
  protein. The disease was first described on the Croatian island of Mljet
  (Meleda) by Luko Stulli in 1826, and patients from Mljet share a founder
  haplotype. Phenotype frequencies come from Orphanet or from the Anatolian
  series of 39 patients; the frequency of melanoma and squamous cell carcinoma
  is not established and is omitted.

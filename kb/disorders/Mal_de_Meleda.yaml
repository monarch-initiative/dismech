treatments:
- name: Oral Acitretin
  description: >-
    Systemic retinoid therapy reduces hyperkeratosis and is the mainstay of
    management, usually combined with topical keratolytics. Low doses (about 10
    mg/day) have been effective; mucocutaneous adverse effects such as dry eyes
    and lips can limit use, and acitretin does not always prevent mutilating
    progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_phenotypes:
  - preferred_term: transgredient diffuse palmoplantar keratoderma
    term:
      id: HP:0007447
      label: Diffuse palmoplantar hyperkeratosis
  evidence:
  - reference: PMID:26445964
    reference_title: "Mal de Meleda: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the accepted approach tends to include oral acitretin plus topical keratolytic therapy"
    explanation: The review identifies oral acitretin plus topical keratolytics as the accepted approach.
  - reference: PMID:35506361
    reference_title: "Mal de Meleda: Diagnostic Work-up and Therapy with Low-dose Acitretin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low-dose acitretin was initiated at 10 mg/day. Two months later, the patient showed significantly reduced palmar hyperkeratosis"
    explanation: Low-dose acitretin reduced hyperkeratosis in a genetically confirmed patient.
  - reference: PMID:38903266
    reference_title: "Transgradient Variant of Mal De Meleda Presenting As Palmoplantar Keratoderma: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with oral acitretin and topical moisturizers resulted in significant improvement."
    explanation: Acitretin improved the keratoderma in an affected adolescent.
  - reference: PMID:31582262
    reference_title: "[Acral melanoma in a patient with hereditary keratoderma of the palms and soles (mal de Meleda): A chance association?]."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "After the failure of acitretin, which had not prevented retractile and mutilating progression of the palmoplantar keratoderma, he had undergone surgery with graft excision of both palms."
    explanation: In one patient acitretin did not prevent mutilating progression.
  target_mechanisms:

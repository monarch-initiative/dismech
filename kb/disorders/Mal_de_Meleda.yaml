    snippet: "Mal de Meleda (MDM) is a rare autosomal recessive skin disorder, characterized by transgressive palmoplantar keratoderma (PPK), keratotic skin lesions, perioral erythema, brachydactyly and nail abnormalities."
    explanation: Transgressive palmoplantar keratoderma is the cardinal feature.

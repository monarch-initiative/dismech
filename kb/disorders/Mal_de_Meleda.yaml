name: Mal de Meleda
creation_date: "2026-10-15T01:39:12Z"
category: Mendelian
synonyms:
- Meleda disease
- MDM
- keratosis palmoplantaris transgrediens of Siemens
- keratosis palmoplantaris transgrediens et progrediens
- SLURP1-related palmoplantar keratoderma
description: >-
  Mal de Meleda is a rare autosomal recessive diffuse palmoplantar keratoderma
  caused by biallelic loss-of-function variants in SLURP1, which encodes a small
  secreted Ly6/uPAR-family protein made by differentiating keratinocytes.
  Erythema and yellowish, waxy hyperkeratosis of the palms and soles begin in
  infancy, extend onto the dorsal hands and feet, wrists and ankles in a
  sharply demarcated glove-and-stocking pattern (transgrediens), and worsen with
  age (progrediens). Hyperhidrosis, malodour and microbial superinfection of the
  thickened skin, painful fissures, nail abnormalities, perioral erythema,
  brachydactyly or tapering of the digits, lichenoid plaques, flexion
  contractures and pseudoainhum are recognised features, and melanoma and
  squamous cell carcinoma have been reported within affected skin. Histology
  shows nonepidermolytic hyperkeratosis, acanthosis and hypergranulosis with a
  superficial perivascular lymphocytic infiltrate. SLURP1 is an allosteric
  modulator of keratinocyte alpha7 nicotinic acetylcholine receptors that
  restrains keratinocyte growth, and its loss is linked to keratinocyte
  hyperproliferation, disturbed terminal differentiation and cutaneous
  inflammation. Management is symptomatic, centred on oral acitretin and
  topical keratolytics.

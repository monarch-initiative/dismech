animal_models:
- name: Slurp1 knockout mouse
  species: Mouse
  genotype: Slurp1-/- (exon 2 replacement) and Slurp1X-/- (exon 2 nonsense allele)
  description: >-
    Two independent Slurp1 knockout lines develop palmoplantar keratoderma of
    the paws with increased keratinocyte proliferation, lipid droplets in the
    stratum corneum and a water barrier defect, together with reduced adiposity
    and hind-limb clasping. Slurp1 knockout mice also show mechanical and
    thermal pain hypersensitivity.
  publication: PMID:24499735
  modeled_mechanisms:
  - target: Keratinocyte Hyperproliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Volar paw keratinocytes proliferate excessively, reproducing the human keratoderma.
    evidence:
    - reference: PMID:28418591
      reference_title: "A hypomorphic Egfr allele does not ameliorate the palmoplantar keratoderma caused by SLURP1 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Slurp1 deficiency in mice faithfully recapitulates the human disease, with increased keratinocyte proliferation and thickening of the epidermis on the volar surface of the paws."
      explanation: The knockout reproduces the proliferative keratoderma.
  - target: Stratum Corneum Water Barrier Defect with Lipid Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Knockout paw skin accumulates stratum corneum lipid droplets and loses water barrier function.
    evidence:
    - reference: PMID:24499735
      reference_title: "Palmoplantar keratoderma along with neuromuscular and metabolic phenotypes in Slurp1-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Slurp1(-/-) mice developed severe PPK characterized by increased keratinocyte proliferation, an accumulation of lipid droplets in the stratum corneum, and a water barrier defect."
      explanation: Directly documents the barrier and lipid phenotype.
  - target: Cutaneous Inflammation with TNF-alpha Excess
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Knockout paw skin lacks the dermal inflammatory infiltrate seen in patients.
    limitations: >-
      Inflammatory infiltrates were absent from knockout paw skin, so the model
      does not reproduce the erythematous, inflammatory component of the human
      disease.
    evidence:
    - reference: PMID:24499735
      reference_title: "Palmoplantar keratoderma along with neuromuscular and metabolic phenotypes in Slurp1-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "No inflammatory infiltrates were present."
      explanation: Histology of knockout paw skin showed no inflammatory infiltrate.

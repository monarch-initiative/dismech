diagnosis:
- name: SLURP1 molecular genetic testing
  description: >-
    Identification of biallelic SLURP1 pathogenic variants confirms the
    diagnosis and distinguishes Mal de Meleda from other transgredient
    keratodermas and from psoriasis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28885351
    reference_title: "A Mal De Meleda patient with severe flexion contractures of hands and feet: A case report in West China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reliable method for the diagnosis of MDM is gene test."
    explanation: Genetic testing is the reliable diagnostic method.
- name: Skin biopsy
  description: >-
    Biopsy shows nonepidermolytic hyperkeratosis, acanthosis and hypergranulosis
    with a superficial perivascular lymphocytic infiltrate; absence of
    epidermolysis separates it from epidermolytic palmoplantar keratoderma.
  evidence:
  - reference: PMID:35506361
    reference_title: "Mal de Meleda: Diagnostic Work-up and Therapy with Low-dose Acitretin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A punch biopsy from plantar skin revealed hyperkeratosis, mild hypergranulosis and a discrete perivascular inflammatory infiltrate in the superficial dermis, but no epidermolysis."
    explanation: Characteristic nonepidermolytic biopsy findings.
- name: SLURP1 protein immunodetection
  description: >-
    Because most pathogenic variants leave SLURP1 absent or barely detectable in
    skin and sweat, immunological detection of SLURP1 has been proposed as a
    rapid screening test.
  evidence:
  - reference: PMID:17008884
    reference_title: "SLURP1 is a late marker of epidermal differentiation and is absent in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, most MDM mutations in SLURP1 affect either the expression, integrity, or stability of the protein, suggesting that a simple immunologic test could be used as a rapid screening procedure."
    explanation: Proposes SLURP1 immunodetection as a screening approach.

progression:
- phase: Onset
  age_range: Infancy to early childhood
  notes: >-
    Palmoplantar erythema and hyperkeratosis appear soon after birth or in
    infancy. Orphanet lists infancy and childhood onset.
  evidence:
  - reference: PMID:26445964
    reference_title: "Mal de Meleda: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinically, the onset of the disease is typically soon after birth and features a transgrediens (plantar surface progressing to dorsal surface) and progrediens (worsening with age) pattern of hyperkeratosis of the palms and soles."
    explanation: The review states that onset is typically soon after birth.
- phase: Progressive transgredient keratoderma
  age_range: Childhood through adulthood
  notes: >-
    Keratoderma extends from the palms and soles onto the dorsal hands, feet,
    wrists and ankles and worsens with age; long-standing disease can produce
    flexion contractures and mutilating changes of the digits. Symptoms are
    milder in people who do not do manual work and who apply continuous
    symptomatic treatment.
  evidence:
  - reference: PMID:14674887
    reference_title: "A novel missense mutation in the gene encoding SLURP-1 in patients with Mal de Meleda from northern Tunisia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, MDM is characterized by erythema and hyperkeratosis of the palms and soles with sharp demarcation that appears soon after birth and progressively extends to the dorsal surface of the hands and feet."
    explanation: The Tunisian family study describes progressive extension to the dorsal hands and feet.
  - reference: PMID:28885351
    reference_title: "A Mal De Meleda patient with severe flexion contractures of hands and feet: A case report in West China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MDM can lead to severe flexion contractures in some cases."
    explanation: The case report documents contractures as a late consequence of progressive disease.
  - reference: PMID:12145432
    reference_title: "Mal de Meleda: genetic haplotype analysis and clinicopathological findings in cases originating from the island of Mljet (Meleda), Croatia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms and signs were found to be milder in non-manual workers who had applied continuous symptomatic treatment."
    explanation: In the Mljet series, occupation and continuous treatment modified severity.
genetic:
- name: SLURP1
  association: Causative germline biallelic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SLURP1
    term:
      id: hgnc:18746
      label: SLURP1
  features: >-
    Biallelic SLURP1 (formerly ARS component B) variants, including deletions,
    nonsense, splice-site, start-codon, signal-peptide and missense variants,
    cause Mal de Meleda. Most variants abolish or reduce the amount of SLURP1
    protein in skin and sweat. Recurrent alleles reflect founder effects, for
    example c.82delT in Croatian, Algerian and Tunisian families, R96X in
    Turkish families, W15R in German and Swedish families, and G86R in
    Palestinian, Turkish, Taiwanese and Chinese families.
  evidence:
  - reference: ORPHA:87503
    reference_title: "Mal de Meleda"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLURP1 | secreted LY6/PLAUR domain containing 1 | hgnc:18746 | Disease-causing germline mutation(s) in"
    explanation: Orphanet identifies SLURP1 germline mutations as disease-causing.
  - reference: PMID:11285253
    reference_title: "Mutations in the gene encoding SLURP-1 in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the identification of mutations in affected individuals in the ARS (component B) gene, encoding a protein named SLURP-1, for secreted Ly-6/uPAR related protein 1"
    explanation: Positional cloning identified SLURP1 mutations in affected individuals.
  - reference: PMID:11285253
    reference_title: "Mutations in the gene encoding SLURP-1 in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three different homozygous mutations (a deletion, a nonsense and a splice site mutation) were detected in 19 families of Algerian and Croatian origin, suggesting founder effects."
    explanation: Homozygous loss-of-function SLURP1 variants segregate with disease in 19 families.
  - reference: PMID:12483299
    reference_title: "Mal de Meleda (MDM) caused by mutations in the gene for SLURP-1 in patients from Germany, Turkey, Palestine, and the United Arab Emirates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that the MDM type of transgressive PPK is caused by SLURP-1 mutations in patients from various origins and demonstrate allelic heterogeneity for mutations in SLURP-1."
    explanation: SLURP1 mutations in German, Turkish, Palestinian and Emirati families show allelic heterogeneity.
  variants:
  - name: c.82delT
    description: >-
      Frameshift deletion recurrent in Algerian, Croatian, Tunisian and Middle
      Eastern families with Mal de Meleda.
    evidence:
    - reference: PMID:14674887
      reference_title: "A novel missense mutation in the gene encoding SLURP-1 in patients with Mal de Meleda from northern Tunisia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three different mutations were identified, the 82delT mutation previously described and two novel missense mutations."
      explanation: The 82delT allele recurs in Tunisian families.
    - reference: PMID:29231248
      reference_title: "SLURP-1 is mutated in Mal de Meleda, a potential molecular signature for melanoma and a putative squamous lineage tumor suppressor gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis revealed homozygous SLURP1 mutations (c.82delT) in the affected members."
      explanation: The same allele is homozygous in an affected Palestinian family.
  - name: c.43T>C (p.W15R)
    description: >-
      Signal-peptide missense variant found in German, Scottish and Swedish
      patients, including the Gamborg-Nielsen type; transfected cells do not
      tolerate the mutant protein.
    evidence:
    - reference: PMID:12603845
      reference_title: "Novel mutations in the gene encoding secreted lymphocyte antigen-6/urokinase-type plasminogen activator receptor-related protein-1 (SLURP-1) and description of five ancestral haplotypes in patients with Mal de Meleda."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a signal sequence mutation (W15R), which was homozygous in a German family and heterozygous in a Scottish patient."
      explanation: Reports the W15R signal-sequence variant in European patients.
    - reference: PMID:17008884
      reference_title: "SLURP1 is a late marker of epidermal differentiation and is absent in Mal de Meleda."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "did not tolerate the MDM mutation W15R located in the signal peptide"
      explanation: Transfected cells did not tolerate the W15R signal-peptide mutant.
  - name: c.256G>A (p.G86R)
    description: >-
      Missense variant at a conserved glycine, recurrent in Palestinian,
      Turkish, Taiwanese and Chinese patients, and associated in one family with
      impaired T-cell activation.
    evidence:
    - reference: PMID:12483299
      reference_title: "Mal de Meleda (MDM) caused by mutations in the gene for SLURP-1 in patients from Germany, Turkey, Palestine, and the United Arab Emirates."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a large Palestinian pedigree with multiple consanguinity, patients are homozygous for a new mutation that substitutes an arginine for a conserved glycine residue at position 86."
      explanation: Homozygous G86R in a consanguineous Palestinian pedigree.
    - reference: PMID:15909066
      reference_title: "Mal de Meleda in a taiwanese."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutation analysis revealed a homozygous missense mutation (G86R) in exon 3 of ARS gene of this patient."
      explanation: Homozygous G86R in a Taiwanese patient.
    - reference: PMID:32157724
      reference_title: "Abnormal keratinization and cutaneous inflammation in Mal de Meleda."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous c.256 G>A mutation, predicting a conversion of p.Gly86Arg, in SLURP1gene was detected."
      explanation: Homozygous G86R in a Taiwanese child.
  - name: R96X
    description: Nonsense variant shared on a common ancestral haplotype by Turkish families.
    evidence:
    - reference: PMID:12787122
      reference_title: "A recurrent mutation in the ARS (component B) gene encoding SLURP-1 in Turkish families with mal de Meleda: evidence of a founder effect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a recurrent nonsense mutation, R96X, in four families of Turkish descent."
      explanation: Reports the recurrent Turkish R96X allele.
    - reference: PMID:12787122
      reference_title: "A recurrent mutation in the ARS (component B) gene encoding SLURP-1 in Turkish families with mal de Meleda: evidence of a founder effect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these families share a common ancestral haplotype at the mal de Meleda locus, suggesting a founder effect"
      explanation: Haplotype sharing indicates a founder effect.
pathophysiology:
- name: SLURP1 Biallelic Loss of Function
  description: >-
    Biallelic germline SLURP1 variants abolish or severely reduce the secreted
    SLURP1 protein that differentiating keratinocytes of the granular layer and
    acrosyringium normally release; in patient palmoplantar skin and sweat the
    mutant protein is absent or barely detectable.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLURP1
    term:
      id: hgnc:18746
      label: SLURP1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Germline biallelic, usually homozygous, SLURP1 variants.
  molecular_functions:
  - preferred_term: acetylcholine receptor regulator activity
    term:
      id: GO:0030548
      label: acetylcholine receptor regulator activity
    modifier: DECREASED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:17008884
    reference_title: "SLURP1 is a late marker of epidermal differentiation and is absent in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In palmoplantar sections from MDM patients, as well as in their sweat, mutant SLURP1, including the new variant R71H-SLURP1, was either absent or barely detectable."
    explanation: Patient skin and sweat lack detectable SLURP1, establishing loss of the protein.
  - reference: PMID:17008884
    reference_title: "SLURP1 is a late marker of epidermal differentiation and is absent in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLURP1 was found to be a marker of late differentiation, predominantly expressed in the granular layer of skin, notably the acrosyringium."
    explanation: Places normal SLURP1 production in differentiating granular-layer keratinocytes.
  - reference: PMID:33741389
    reference_title: "Biochemical Basis of Skin Disease Mal de Meleda: SLURP-1 Mutants Differently Affect Keratinocyte Proliferation and Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in loops I and III led to the protein inactivation, whereas most mutations in loop II increased SLURP-1 antiproliferative activity."
    explanation: Recombinant disease-associated mutants show that many variants inactivate SLURP-1, while some alter rather than abolish activity.
  downstream:
  - target: Loss of SLURP1 Modulation of Keratinocyte Alpha7 Nicotinic Acetylcholine Receptors
    causal_link_type: DIRECT
    description: >-
      SLURP1 binds and allosterically modulates the alpha7 nicotinic
      acetylcholine receptor on keratinocytes, so loss of SLURP1 removes this
      cholinergic input.
    evidence:
    - reference: PMID:14506129
      reference_title: "Identification of SLURP-1 as an epidermal neuromodulator explains the clinical phenotype of Mal de Meleda."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that SLURP-1 potentiates the human alpha 7 nicotinic acetylcholine receptors that are present in keratinocytes."
      explanation: Establishes keratinocyte alpha7 receptors as a SLURP-1 target.
    - reference: PMID:26905431
      reference_title: "Human Secreted Ly-6/uPAR Related Protein-1 (SLURP-1) Is a Selective Allosteric Antagonist of α7 Nicotinic Acetylcholine Receptor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using affinity purification from human cortical extracts, we confirmed that rSLURP-1 binds selectively to the α7-nAChRs."
      explanation: Confirms selective binding of SLURP-1 to alpha7 receptors.
  - target: Impaired T-cell Activation
    causal_link_type: DIRECT
    description: >-
      Peripheral blood T cells from a family carrying SLURP1 G86R show defective
      activation that is restored by recombinant SLURP-1.
    evidence:
    - reference: PMID:20854438
      reference_title: "SLURP1 mutation-impaired T-cell activation in a family with mal de Meleda."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PBMCs with the heterozygous and homozygous SLURP-1 G86R mutation had defective T-cell activation."
      explanation: Patient-derived cells carrying the SLURP1 variant, stimulated in culture, show impaired T-cell activation.
  - target: Loss of SLURP1 Epithelial Tumor-Suppressive Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Expression data suggest a putative epithelial tumor-suppressor role for
      SLURP1; this link is a hypothesis.
    evidence:
    - reference: PMID:29231248
      reference_title: "SLURP-1 is mutated in Mal de Meleda, a potential molecular signature for melanoma and a putative squamous lineage tumor suppressor gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "Our findings also highlight a plausible epithelial lineage-specific tumor suppressor role for the SLURP1 gene"
      explanation: Expression-dataset analysis proposes a tumor-suppressor role for SLURP1.
- name: Loss of SLURP1 Modulation of Keratinocyte Alpha7 Nicotinic Acetylcholine Receptors
  description: >-
    SLURP1 is an auto/paracrine cholinergic peptide that binds alpha7 nicotinic
    acetylcholine receptors on keratinocytes. Early studies with fusion
    constructs described it as a potentiator or allosteric agonist of these
    receptors, while a recombinant protein closer to the native sequence acted
    as a non-competitive allosteric antagonist; both lines of work agree that
    SLURP1 signalling through alpha7 receptors restrains keratinocyte growth.
    In Mal de Meleda this receptor-mediated signal is lost.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: acetylcholine receptor signaling pathway
    term:
      id: GO:0095500
      label: acetylcholine receptor signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:14506129
    reference_title: "Identification of SLURP-1 as an epidermal neuromodulator explains the clinical phenotype of Mal de Meleda."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that SLURP-1 potentiates the human alpha 7 nicotinic acetylcholine receptors that are present in keratinocytes."
    explanation: Identifies keratinocyte alpha7 receptors as the SLURP-1 target.
  - reference: PMID:16354194
    reference_title: "Biological effects of SLURP-1 on human keratinocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the presence of the agonist carbachol, the effects of SLURP-1 on gene expression were augmented, which is in keeping with the notion that SLURP-1 acts as an allosteric agonist at the KC nAChR."
    explanation: Recombinant SLURP-1 acts at keratinocyte nicotinic receptors.
  - reference: PMID:26905431
    reference_title: "Human Secreted Ly-6/uPAR Related Protein-1 (SLURP-1) Is a Selective Allosteric Antagonist of α7 Nicotinic Acetylcholine Receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings imply an allosteric antagonist-like mode of SLURP-1 interaction with α7-nAChRs outside the classical ligand-binding site."
    explanation: A recombinant SLURP-1 closer to the native protein behaves as an allosteric antagonist, so the sign of the modulation is disputed while the receptor target is not.
  downstream:
  - target: Keratinocyte Hyperproliferation
    causal_link_type: DIRECT
    description: SLURP-1 restrains keratinocyte growth through alpha7 receptors, so its loss releases proliferation.
    evidence:
    - reference: PMID:26905431
      reference_title: "Human Secreted Ly-6/uPAR Related Protein-1 (SLURP-1) Is a Selective Allosteric Antagonist of α7 Nicotinic Acetylcholine Receptor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "rSLURP-1 significantly inhibited proliferation (up to ~ 40%, EC50 ~ 4 nM) of human oral keratinocytes (Het-1A cells)."
      explanation: Shows the antiproliferative effect of SLURP-1 on keratinocytes, which is lost in the disease.
    - reference: PMID:14506129
      reference_title: "Identification of SLURP-1 as an epidermal neuromodulator explains the clinical phenotype of Mal de Meleda."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "This explains both the hyperproliferative as well as the inflammatory clinical phenotype of Mal de Meleda."
      explanation: The authors link loss of SLURP-1 receptor modulation to the hyperproliferative phenotype.
  - target: Disturbed Keratinocyte Terminal Differentiation
    causal_link_type: DIRECT
    description: >-
      SLURP-1 signalling induces differentiation and apoptosis genes in
      keratinocytes; without it these programmes are under-stimulated.
    evidence:
    - reference: PMID:16354194
      reference_title: "Biological effects of SLURP-1 on human keratinocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SLURP-1 significantly (p<0.05) upregulated expression of transglutaminase type I cytokeratin 10, p21, and caspase-3."
      explanation: SLURP-1 drives keratinocyte differentiation and cell-cycle-exit genes.
    - reference: PMID:16354194
      reference_title: "Biological effects of SLURP-1 on human keratinocytes."
      supports: SUPPORT

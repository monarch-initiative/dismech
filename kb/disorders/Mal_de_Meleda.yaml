definitions:
- name: Orphanet Mal de Meleda definition
  definition_type: OTHER
  description: >-
    A rare diffuse palmoplantar keratoderma with symmetric palmoplantar
    hyperkeratosis that progressively extends to the dorsal hands and feet
    (transgrediens), with possible hyperhidrosis, lichenoid plaques and perioral
    erythema.
  evidence:
  - reference: ORPHA:87503
    reference_title: "Mal de Meleda"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare diffuse palmoplantar keratoderma characterized by symmetric palmoplantar hyperkeratosis that progressively extends to the dorsal surfaces of hands and feet (transgrediens)."
    explanation: Orphanet defines the disorder as a transgredient diffuse palmoplantar keratoderma.
has_subtypes:
- name: Gamborg-Nielsen type
  display_name: Palmoplantar keratoderma, Gamborg-Nielsen (Norrbotten) type
  subtype_term:
    preferred_term: hereditary palmoplantar keratoderma, Gamborg-Nielsen type
    term:
      id: MONDO:0009489
      label: hereditary palmoplantar keratoderma, Gamborg-Nielsen type
  description: >-
    Autosomal recessive palmoplantar keratoderma described in families from
    northern Sweden that overlaps phenotypically with Mal de Meleda. Affected
    individuals are homozygous for the SLURP1 signal-peptide variant c.43T>C
    (p.W15R) or compound heterozygous for it, so the form is an allelic variant
    of Mal de Meleda rather than a separate disease.
  evidence:
  - reference: PMID:24604124
    reference_title: "Palmoplantar keratoderma of the Gamborg-Nielsen type is caused by mutations in the SLURP1 gene and represents a variant of Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereby we confirm that PPK-GN is an allelic variant of MDM."
    explanation: SLURP1 sequencing in Swedish families shows the Gamborg-Nielsen type is allelic with Mal de Meleda.
  - reference: PMID:24604124
    reference_title: "Palmoplantar keratoderma of the Gamborg-Nielsen type is caused by mutations in the SLURP1 gene and represents a variant of Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen Swedish patients were homozygous for a previously described mutation, c.43T>C, while one individual was a compound heterozygote with one copy of a novel mutation, c.280T>A, in addition to one copy of the c.43T>C mutation."
    explanation: Identifies the SLURP1 genotypes underlying the Gamborg-Nielsen type.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Mal de Meleda is inherited in an autosomal recessive pattern; affected
    individuals carry biallelic SLURP1 variants, frequently homozygous in
    consanguineous families and founder populations. Pseudodominant
    transmission occurs when an affected parent has a carrier partner.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11285253
    reference_title: "Mutations in the gene encoding SLURP-1 in Mal de Meleda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mal de Meleda (MDM) is a rare autosomal recessive skin disorder, characterized by transgressive palmoplantar keratoderma (PPK), keratotic skin lesions, perioral erythema, brachydactyly and nail abnormalities."
    explanation: The gene-discovery study describes Mal de Meleda as an autosomal recessive disorder.
  - reference: PMID:12483299
    reference_title: "Mal de Meleda (MDM) caused by mutations in the gene for SLURP-1 in patients from Germany, Turkey, Palestine, and the United Arab Emirates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a German family with no known consanguinity, we have shown pseudodominant inheritance. Three affected children and their affected mother are homozygous for the missense mutation W15R."
    explanation: Apparent vertical transmission in this family reflects homozygosity in mother and children, consistent with recessive inheritance.

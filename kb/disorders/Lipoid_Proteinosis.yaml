treatments:
- name: Acitretin
  description: >
    Low-dose oral acitretin (a systemic retinoid, ~0.5 mg/kg/day) is the
    best-evidenced pharmacologic option, used off-label; benefit is more
    consistent for mucosal/laryngeal symptoms (voice) than for established
    cutaneous lesions, with variable individual response. Historically reported
    skin-directed agents (oral dimethyl sulfoxide, D-penicillamine) have only
    limited/anecdotal evidence.

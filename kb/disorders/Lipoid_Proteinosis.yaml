discussions:
- discussion_id: gap_lp_calcification_to_neuropsychiatric_mechanism
  prompt: >-
    Does the bilateral amygdala/medial-temporal-lobe calcification of lipoid
    proteinosis fully account for its neuropsychiatric and epileptic phenotype,
    or do additional, calcification-independent consequences of ECM1 loss (e.g.,
    perivascular matrix and basement-membrane dysfunction, microvascular changes,
    or direct effects on neuronal/glial extracellular matrix) contribute?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Bilateral Amygdala and Medial Temporal Lobe Calcification
  - pathophysiology#Impaired Fear Processing
  rationale: >-
    The causal edge from amygdala calcification to the neurobehavioral phenotype
    is modeled as INDIRECT_UNKNOWN_INTERMEDIATES because the mechanism is not
    established. Authoritative review explicitly states that, beyond the foci of
    calcification, the cause of the neurologic abnormalities in lipoid proteinosis
    is unknown. Resolving whether calcification is the proximate cause or a marker
    of a broader ECM1-dependent CNS process would sharpen the mechanism model and
    determine whether the neuropsychiatric burden is potentially modifiable.
  evidence:
  - reference: PMID:26564090
    reference_title: "Lipoid proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beyond the foci of calcification, the cause of the neurologic abnormalities in lipoid proteinosis is unknown"
    explanation: >-
      Directly states that the cause of the neurologic abnormalities beyond the
      calcification foci is unknown, defining the knowledge gap.
- discussion_id: openq_lp_genotype_phenotype_modifiers
  prompt: >-
    What determines the marked intrafamilial and interindividual variability in
    skin and neuropsychiatric severity among lipoid-proteinosis patients who
    share an identical ECM1 genotype (e.g., the Q276X founder homozygotes)?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#ECM1 Loss of Function
  rationale: >-
    In the Namaqualand founder population all patients are homozygous for the same
    ECM1 Q276X allele, yet they show considerable clinical variability in skin
    presentation and psychiatric involvement. This uniform genotype with
    phenotype-variable expression implicates unmapped genetic modifiers,
    epigenetic, or stochastic factors that are not yet identified.
  evidence:
  - reference: PMID:15327549
    reference_title: "Clinical and molecular characterization of lipoid proteinosis in Namaqualand, South Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this genetic homogeneity, considerable clinical variability in skin presentation and psychiatric involvement was observed."
    explanation: >-
      Documents phenotypic variability despite a shared founder genotype,
      motivating the search for modifiers.

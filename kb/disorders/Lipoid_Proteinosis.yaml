- name: Bilateral Amygdala and Medial Temporal Lobe Calcification
  biological_scale: TISSUE
  description: >
    Many patients develop bean- or comma-shaped intracranial calcifications that
    selectively involve the amygdalae and medial temporal lobes, typically
    bilateral and symmetric and more prominent with longer disease duration. The
    calcification is considered a near-pathognomonic radiologic finding.
  locations:
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  downstream:
  - target: Intracranial Calcification
    description: Radiologic manifestation of the medial-temporal-lobe calcification.
    causal_link_type: DIRECT
  - target: Impaired Fear Processing
    description: >
      Bilateral amygdala damage impairs the induction and experience of fear.
      The extent to which calcification alone accounts for the neuropsychiatric
      phenotype is unresolved (see discussion).
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    description: Medial temporal lobe involvement predisposes to epilepsy.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Memory Impairment
    description: >
      Medial temporal lobe involvement contributes to memory and other
      neuropsychological deficits.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26564090
    reference_title: "Lipoid proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There may be bean- or comma-shaped intracranial calcifications, often selectively affecting the amygdala."
    explanation: >-
      Documents the characteristic amygdala-selective intracranial calcification.
  - reference: PMID:27091312
    reference_title: "Translational neuroscience of basolateral amygdala lesions: Studies of Urbach-Wiethe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging studies have revealed a pattern of brain calcification often but not exclusively leading to selective bilateral amygdala damage."
    explanation: >-
      Links the intracranial calcification pattern to selective bilateral
      amygdala damage in Urbach-Wiethe disease.
- name: Impaired Fear Processing
  biological_scale: ORGANISM
  description: >
    Bilateral amygdala damage in lipoid proteinosis produces a distinctive
    neurobehavioral phenotype in which affected individuals fail to induce or
    experience fear in response to normally frightening stimuli, while other
    basic emotions are preserved. Lipoid-proteinosis patients with bilateral
    amygdala calcification have served as key human models of amygdala function
    in fear processing.
  downstream:
  - target: Abnormal Fear-Induced Behavior
    description: Loss of amygdala-dependent fear induction and experience.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21167712
    reference_title: "The human amygdala and the induction and experience of fear."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On no occasion did SM exhibit fear, and she never endorsed feeling more than minimal levels of fear."
    explanation: >-
      Patient SM, a bilateral-amygdala-lesion case, shows an absence of fear
      induction and experience, demonstrating the amygdala's pivotal role. (SM's
      bilateral amygdala damage results from lipoid proteinosis; the disease link
      is established in the amygdala-calcification node.)
  - reference: PMID:26564090
    reference_title: "Lipoid proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with lipoid proteinosis therefore have been used as models for demonstrating physiologic and pathologic abnormalities of the amygdala with respect to fear processing, affect and cognition, anxiety and memory."
    explanation: >-
      Establishes that lipoid-proteinosis patients are models for amygdala
      abnormalities in fear processing, affect, and cognition.

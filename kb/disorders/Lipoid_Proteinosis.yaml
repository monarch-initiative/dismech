name: Lipoid Proteinosis
creation_date: "2026-07-29T16:40:00Z"
category: Mendelian
disease_term:
  preferred_term: lipoid proteinosis
  term:
    id: MONDO:0009530
    label: lipoid proteinosis
description: >
  Lipoid proteinosis (Urbach-Wiethe disease, hyalinosis cutis et mucosae) is a
  rare autosomal recessive genodermatosis caused by biallelic loss-of-function
  mutations in ECM1 (extracellular matrix protein 1). Loss of ECM1 disrupts its
  interactions with dermal matrix components and leads to widespread deposition
  of PAS-positive hyaline (glycoprotein) material and reduplication of basement
  membranes in the skin, mucosae, and viscera. The clinical hallmark is a hoarse
  voice from early infancy (laryngeal/vocal-fold infiltration); other features
  include beaded eyelid-margin papules (moniliform blepharosis), waxy and
  verrucous skin lesions with acneiform scarring, a thickened sublingual frenulum
  with restricted tongue movement, and, in many patients, bean/comma-shaped
  bilateral calcification of the amygdalae and medial temporal lobes associated
  with epilepsy and neuropsychiatric features including impaired fear processing.
  The course is chronic and fluctuating, with a generally normal lifespan unless
  laryngeal obstruction supervenes.

pathophysiology:
- name: ECM1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Lipoid proteinosis is caused by biallelic (homozygous or compound
    heterozygous) loss-of-function mutations in ECM1, which encodes the secreted
    glycoprotein extracellular matrix protein 1. The gene was mapped to 1q21 and
    identified as causal by genome-wide linkage and candidate-gene sequencing in
    consanguineous families, with recurrent founder alleles in some populations
    (e.g., the Q276X nonsense allele in Namaqualand, South Africa).
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Loss of ECM1-Mediated Matrix Interactions
    description: >
      Absence of functional ECM1 removes a key organizer of dermal
      extracellular-matrix and basement-membrane architecture.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11929856
    reference_title: "Lipoid proteinosis maps to 1q21 and is caused by mutations in the extracellular matrix protein 1 gene (ECM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified six different homozygous loss-of-function mutations in the extracellular matrix protein 1 gene (ECM1)"
    explanation: >-
      Establishes that biallelic loss-of-function mutations in ECM1 are the
      molecular cause of lipoid proteinosis.
- name: Loss of ECM1-Mediated Matrix Interactions
  biological_scale: MOLECULAR
  description: >
    ECM1 normally participates in the structural organization of the dermis
    through protein-protein interactions with perlecan, fibulin, and matrix
    metalloproteinase-9, and it binds glycosaminoglycans. Loss of these
    interactions disrupts extracellular-matrix and basement-membrane physiology,
    the proposed proximate basis of the tissue pathology.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DECREASED
  downstream:
  - target: Hyaline Material Deposition
    description: >
      Disrupted matrix organization leads to accumulation of abnormal
      hyaline material and reduplicated basement membrane.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17927570
    reference_title: "The molecular basis of lipoid proteinosis: mutations in extracellular matrix protein 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has a role in the structural organization of the dermis (binding to perlecan, matrix metalloproteinase-9 and fibulin)"
    explanation: >-
      Identifies the ECM1 protein-protein interactions (perlecan, MMP-9,
      fibulin) whose loss is proposed to disrupt dermal matrix organization.
  - reference: PMID:26564090
    reference_title: "Lipoid proteinosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the ECM1 protein can normally bind to various extracellular matrix proteins and glycosaminoglycans as well as certain enzymes, including matrix metalloproteinase 9. Loss of key protein-protein interactions may underscore some of the disease pathophysiology"
    explanation: >-
      States that loss of ECM1's matrix and enzyme interactions is thought to
      underlie the disease pathophysiology.
- name: Hyaline Material Deposition
  biological_scale: TISSUE
  description: >
    Widespread deposition of amorphous, PAS-positive hyaline (glycoprotein)
    material in the dermis and around blood vessels and appendages, accompanied
    by disruption and reduplication of basement membranes. This histopathologic
    hallmark occurs across skin, mucosae, and internal organs and is the tissue
    substrate for the organ-specific manifestations.
  biological_processes:
  - preferred_term: extracellular matrix assembly
    term:
      id: GO:0085029
      label: extracellular matrix assembly
    modifier: ABNORMAL
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Laryngeal and Vocal Fold Infiltration
    description: Hyaline deposition thickens the vocal folds and larynx.
    causal_link_type: DIRECT
  - target: Cutaneous and Mucosal Infiltration
    description: Hyaline deposition thickens and scars the skin and mucosae.
    causal_link_type: DIRECT
  - target: Bilateral Amygdala and Medial Temporal Lobe Calcification
    description: >
      Perivascular hyaline deposition in the medial temporal lobe is the
      presumed antecedent of the characteristic calcification, though the
      deposition-to-calcification mechanism is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intracranial Hemorrhage
    description: >
      Perivascular hyaline deposition and vessel-wall fragility are the presumed
      substrate for spontaneous intracranial hemorrhage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Gastrointestinal Mucosal Nodules
    description: >
      Visceral hyaline deposition produces asymptomatic nodules throughout the
      gastrointestinal tract.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11929856
    reference_title: "Lipoid proteinosis maps to 1q21 and is caused by mutations in the extracellular matrix protein 1 gene (ECM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is widespread deposition of hyaline (glycoprotein) material and disruption/reduplication of basement membrane"
    explanation: >-

  - reference: PMID:38308656
    reference_title: "Advances in treatment for lipoid proteinosis (Urbach-Wiethe disease): a case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This results in the deposition of periodic acid-Schiff (PAS)-positive, hyaline-like material on the skin, mucosae and internal organs."
    explanation: >-
      Confirms the PAS-positive hyaline material deposits in skin, mucosae, and
      internal organs.
- name: Laryngeal and Vocal Fold Infiltration
  biological_scale: TISSUE
  description: >
    Infiltration of the vocal folds and larynx by hyaline material thickens the
    tissue and impairs phonation, producing a weak or hoarse cry from early
    infancy — typically the earliest and most consistent sign of the disease and
    a potential cause of airway compromise.
  locations:
  - preferred_term: laryngeal vocal fold
    term:
      id: UBERON:0003706
      label: laryngeal vocal fold
  downstream:
  - target: Hoarse Voice
    description: Vocal-fold infiltration impairs phonation.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11929856
    reference_title: "Lipoid proteinosis maps to 1q21 and is caused by mutations in the extracellular matrix protein 1 gene (ECM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classical features include beaded eyelid papules and laryngeal infiltration leading to hoarseness."
    explanation: >-
      Identifies laryngeal infiltration as the cause of the characteristic
      hoarseness.
- name: Cutaneous and Mucosal Infiltration
  biological_scale: TISSUE
  description: >
    Hyaline deposition in the skin and mucosae produces waxy and verrucous
    papules and plaques (favoring extensor surfaces and the face), beaded
    papules along the eyelid margins (moniliform blepharosis), acneiform/pock-like
    scarring, and a thickened sublingual frenulum that restricts tongue movement.
  cell_types:

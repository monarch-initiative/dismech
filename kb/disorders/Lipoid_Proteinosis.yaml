genetic:
- name: ECM1
  gene_term:
    preferred_term: ECM1
    term:
      id: hgnc:3153
      label: ECM1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic loss-of-function variants in ECM1 (extracellular matrix protein 1)
    cause lipoid proteinosis. Reported variants include nonsense, frameshift,
    and splice-site alleles distributed across the gene, with exon 6 and exon 7
    frequently involved. Recurrent founder alleles include Q276X (Namaqualand,
    South Africa), p.Glu248Ter (Pakistani), and p.Cys220Gly (Chinese) populations.
  evidence:
  - reference: PMID:15327549
    reference_title: "Clinical and molecular characterization of lipoid proteinosis in Namaqualand, South Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for a nonsense mutation in exon 7 of the ECM1 gene, Q276X, was identified in all patients"
    explanation: >-
      Documents the Q276X ECM1 founder nonsense allele in the South African
      cohort.

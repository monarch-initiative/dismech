- name: Biallelic SLC34A3 Pathogenic Variants
  gene_term:
    preferred_term: SLC34A3
    term:
      id: hgnc:20305
      label: SLC34A3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:16358214
      reference_title: SLC34A3 mutations in patients with hereditary hypophosphatemic rickets with hypercalciuria predict a key role for the sodium-phosphate cotransporter NaPi-IIc in maintaining phosphate homeostasis.

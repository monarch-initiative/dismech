  description: >-
    Elevated calcitriol increases intestinal calcium absorption, raising the filtered calcium load. The
    calcium load also suppresses parathyroid hormone, which acts on the kidney in the next node. This is
    an absorptive hypercalciuria with normal serum calcium. GO has no calcium-specific child of
    intestinal absorption (GO:0050892), so the calcium specificity is carried in preferred_term.
  biological_processes:
  - preferred_term: intestinal calcium absorption
    term:

- name: SLC34A1 Heterozygous Variant in Digenic Inheritance
  gene_term:
    preferred_term: SLC34A1
    term:
      id: hgnc:11019
      label: SLC34A1
  association: Modifier
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    In one four-generation kindred with apparently dominant HHRH, the more severely affected members
    carried heterozygous variants in both SLC34A3 (c.1561dupC) and SLC34A1 (encoding NPT2A, p.R512H);
    relatives with the SLC34A3 variant alone were less affected. Single-family evidence, so SLC34A1 is

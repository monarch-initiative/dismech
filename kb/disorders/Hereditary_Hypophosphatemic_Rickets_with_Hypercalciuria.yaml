    explanation: Digenic SLC34A1/SLC34A3 heterozygosity producing an HHRH-like phenotype.
    quote_role: PRIMARY_RESULT
  - reference: DOI:10.1210/clinem/dgaa217
    reference_title: Digenic Heterozygous Mutations in SLC34A3 and SLC34A1 Cause Dominant Hypophosphatemic Rickets with Hypercalciuria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects with both mutations were more severely affected than subjects carrying only one mutation."

pathophysiology:
- name: Biallelic SLC34A3 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous or compound heterozygous SLC34A3 variants remove or reduce NaPi-IIc sodium-phosphate
    cotransport at the proximal-tubule brush border. Alleles include truncating frameshifts such as the
    founder c.228delC, splice-site and intronic deletions causing aberrant splicing, and missense variants.
    Missense alleles act by different routes: some are retained in the endoplasmic reticulum, while others
    reach the cell surface but are degraded faster or transport phosphate with reduced maximal velocity.
  molecular_functions:
  - preferred_term: NaPi-IIc sodium-phosphate cotransport
    term:
      id: GO:0005436
      label: sodium:phosphate symporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC34A3
    term:
      id: hgnc:20305
      label: SLC34A3
  genetic_context:
    gene:
      preferred_term: SLC34A3
      term:
        id: hgnc:20305
        label: SLC34A3
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: Biallelic germline loss of function; homozygous or compound heterozygous.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:16358214
    reference_title: SLC34A3 mutations in patients with hereditary hypophosphatemic rickets with hypercalciuria predict a key role for the sodium-phosphate cotransporter NaPi-IIc in maintaining phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is predicted to truncate the NaP(i)-IIc protein in the first membrane-spanning domain and thus likely results in a complete loss of function of this protein in individuals homozygous for c.228delC."
    explanation: The founder allele in the original kindred is a truncating loss-of-function variant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16358215
    reference_title: Hereditary hypophosphatemic rickets with hypercalciuria is caused by mutations in the sodium-phosphate cotransporter gene SLC34A3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of this gene revealed disease-associated mutations in five families, including two frameshift and one splice-site mutation."
    explanation: Independent simultaneous identification of SLC34A3 variants in HHRH families.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22159077
    reference_title: Processing and stability of type IIc sodium-dependent phosphate cotransporter mutations in patients with hereditary hypophosphatemic rickets with hypercalciuria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations S138F, G196R, R468W, R564C, and c.228delC in human NaPi-IIc significantly decreased the levels of NaPi cotransport activities in Xenopus oocytes."
    explanation: Direct functional demonstration that HHRH alleles reduce sodium-phosphate cotransport.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22159077
    reference_title: Processing and stability of type IIc sodium-dependent phosphate cotransporter mutations in patients with hereditary hypophosphatemic rickets with hypercalciuria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, G196R and R468W mutations cause ER retention, while S138F and R564C mutations stimulate degradation of human NaPi-IIc in renal epithelial cells."
    explanation: Distinguishes trafficking and stability mechanisms among missense alleles.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16849419
    reference_title: Intronic deletions in the SLC34A3 gene cause hereditary hypophosphatemic rickets with hypercalciuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intron 9 deletion (and likely the other two mutations) identified in this study causes aberrant RNA splicing."
    explanation: Intronic deletions are a further loss-of-function allele class.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Renal Phosphate Wasting
    description: Loss of NaPi-IIc reduces proximal-tubule phosphate reabsorption.
    evidence:
    - reference: PMID:16358215
      reference_title: Hereditary hypophosphatemic rickets with hypercalciuria is caused by mutations in the sodium-phosphate cotransporter gene SLC34A3.
      supports: SUPPORT

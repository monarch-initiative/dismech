- name: FGF23-Independent Calcitriol Elevation
  biological_scale: ORGANISM
  description: >-
    FGF23 is normal or low-normal in HHRH, so it does not restrain the renal calcitriol response to
    hypophosphatemia. Serum 1,25-dihydroxyvitamin D is therefore raised, which distinguishes HHRH from
    FGF23-mediated hypophosphatemias where calcitriol is low or inappropriately normal.
  evidence:
  - reference: PMID:16358215
    reference_title: Hereditary hypophosphatemic rickets with hypercalciuria is caused by mutations in the sodium-phosphate cotransporter gene SLC34A3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is at normal or low-normal serum levels in the patients with HHRH, further supporting a primary renal defect"
    explanation: FGF23 is not elevated in HHRH.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30109410
    reference_title: "Hereditary hypophosphatemic rickets with hypercalciuria: pathophysiology, clinical presentation, diagnosis and therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "appropriately elevated 1,25(OH)2D levels, which sets this fibroblast growth factor 23 (FGF23)-independent disorder apart from the more common X-linked hypophosphatemia"
    explanation: Contrasts the calcitriol response with X-linked hypophosphatemia.
    quote_role: REVIEW_SYNTHESIS

  - reference: PMID:16358214
    reference_title: SLC34A3 mutations in patients with hereditary hypophosphatemic rickets with hypercalciuria predict a key role for the sodium-phosphate cotransporter NaPi-IIc in maintaining phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary hypophosphatemic rickets with hypercalciuria (HHRH) is a rare disorder of autosomal recessive inheritance that was first described in a large consanguineous Bedouin kindred."
    explanation: States the recessive inheritance of HHRH.
    quote_role: BACKGROUND
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    One kindred shows apparently dominant transmission through heterozygous variants in SLC34A3 and
    SLC34A1 together; carriers of both were more severely affected than carriers of either alone.
  evidence:
  - reference: DOI:10.1210/clinem/dgaa217
    reference_title: Digenic Heterozygous Mutations in SLC34A3 and SLC34A1 Cause Dominant Hypophosphatemic Rickets with Hypercalciuria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband and her affected sister inherited both gene mutations from their mother, while their clinically less affected brother, father, and paternal grandmother carried only the SLC34A3 mutation."
    explanation: Joint transmission of the two heterozygous variants segregates with the more severe phenotype.
    quote_role: PRIMARY_RESULT

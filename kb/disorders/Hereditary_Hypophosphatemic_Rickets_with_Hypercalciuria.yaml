diagnosis:
- name: Clinical and Biochemical Evaluation for FGF23-Independent Phosphate Wasting
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Evaluate rickets, osteomalacia, low bone density, fractures, nephrocalcinosis or kidney stones with
    fasting serum phosphate, calcium, alkaline phosphatase, intact PTH, 25-hydroxyvitamin D,
    1,25-dihydroxyvitamin D and FGF23, paired fasting spot urine for TRP and TmP/GFR (Walton-Bijvoet
    nomogram), and urinary calcium/creatinine ratio. The HHRH pattern is low phosphate and TmP/GFR with
    normal or low FGF23, high-normal or raised calcitriol, low PTH, hypercalciuria and normal serum
    calcium. This separates it from FGF23-mediated hypophosphatemias (X-linked, ADHR, ARHR, tumor-induced
    osteomalacia), where calcitriol is low or inappropriately normal and calciuria is not raised.
    Incidentally detected nephrocalcinosis should prompt assessment of renal phosphate handling once
    primary hyperparathyroidism is excluded. C-terminal FGF23 can be raised by unrelated causes such as
    iron deficiency, which has led to misdiagnosis as tumor-induced osteomalacia. The high-calcitriol,
    low-PTH, hypercalciuric pattern overlaps with CYP24A1- and SLC34A1-related infantile hypercalcemia,
    so patients investigated for vitamin D hypersensitivity should also have SLC34A3 analysed.
  results: >-
    Hypophosphatemia with reduced TmP/GFR, non-elevated FGF23, raised calcitriol and hypercalciuria
    suggests HHRH or the heterozygous SLC34A3 trait; molecular testing confirms it.
  evidence:
  - reference: PMID:35689455
    reference_title: Clinical Spectrum of Hereditary Hypophosphatemic Rickets With Hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced to low-normal phosphate levels, decreased tubular reabsorption of phosphate (TRP), and high-normal to elevated values of 1,25-OH2 -D3 accompanied by normal cFGF23 levels were revealed independently of mutational status."
    explanation: The biochemical profile that identifies SLC34A3-related phosphate wasting.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38364990
    reference_title: An update on clinical presentation and responses to therapy of patients with hereditary hypophosphatemic rickets with hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine phosphate excretion (TmP/GFR or TRP (%)) and urinary calcium/creatinine ratio (U-Ca/Crea) were determined in fasting spot urines."
    explanation: The urine measurements used to establish renal phosphate wasting and hypercalciuria.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38364990
    reference_title: An update on clinical presentation and responses to therapy of patients with hereditary hypophosphatemic rickets with hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its incidental detection should prompt an evaluation of renal phosphate handling once more common causes such as primary hyperparathyroidism are excluded"
    explanation: Nephrocalcinosis as an entry point to the diagnostic work-up.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37981601
    reference_title: "Hereditary Hypophosphatemic Rickets with Hypercalciuria Presenting with Enthesopathy, Renal Cysts, and High Serum c-Terminal FGF23: Single-Center Experience and Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated FGF23 in another patient with hypophosphatemia, iron deficiency anemia, and noncirrhotic periportal fibrosis led to initial misdiagnosis as tumoral osteomalacia."
    explanation: A raised FGF23 does not exclude HHRH when another cause is present.
    quote_role: PRIMARY_RESULT
  - reference: DOI:10.3389/fendo.2021.736240
    reference_title: "Overlapping Phenotypes Associated With CYP24A1, SLC34A1, and SLC34A3 Mutations: A Cohort Study of Patients With Hypersensitivity to Vitamin D"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with medical history suggestive of CYP24A1 mutation should benefit from SLC34A1 and SLC34A3 analysis"
    explanation: Overlapping vitamin D hypersensitivity phenotypes put SLC34A3 in the differential of CYP24A1 disease.
    quote_role: PRIMARY_RESULT
- name: SLC34A3 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequence SLC34A3 within a hereditary hypophosphatemia panel or exome, which also covers PHEX, FGF23,
    DMP1, ENPP1 and the other phosphate-transporter genes. Intronic deletions causing aberrant splicing
    are a known allele class and need methods that detect them. Monoallelic pathogenic variants are
    clinically relevant (isolated hypercalciuria, renal calcification and low bone density) and should
    be considered in patients with fractures or low bone density.
  results: >-
    Homozygous or compound heterozygous pathogenic SLC34A3 variants confirm HHRH; a single pathogenic
    variant indicates the heterozygous trait.
  evidence:
  - reference: PMID:35689455
    reference_title: Clinical Spectrum of Hereditary Hypophosphatemic Rickets With Hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 8 index patients and 5 family members, genetic analysis was performed using a custom gene panel."
    explanation: Panel-based genetic testing in a clinical series.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16849419

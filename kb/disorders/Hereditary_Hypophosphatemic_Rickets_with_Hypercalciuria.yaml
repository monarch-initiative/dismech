      explanation: Links SLC34A3 loss to the primary renal tubular phosphate defect.
      quote_role: PRIMARY_RESULT
- name: Renal Phosphate Wasting
  biological_scale: TISSUE
  description: >-
    Proximal-tubule phosphate reabsorption is reduced, so the ratio of maximal tubular phosphate reabsorption
    to glomerular filtration rate (TmP/GFR) falls. This primary renal leak persists under phosphate
    supplementation, which corrects the other abnormalities without restoring TmP/GFR.
  biological_processes:
  - preferred_term: renal phosphate reabsorption
    term:
      id: GO:0097291
      label: renal phosphate ion absorption
    modifier: DECREASED
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:2983203
    reference_title: Hereditary hypophosphatemic rickets with hypercalciuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic features are rickets, short stature, increased renal phosphate clearance"
    explanation: Increased renal phosphate clearance (TmP/GFR 2 to 4 SD below the age-related mean) in the original kindred.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Systemic Phosphate Depletion
    description: Urinary phosphate loss lowers serum phosphate.
    evidence:
    - reference: PMID:2983203
      reference_title: Hereditary hypophosphatemic rickets with hypercalciuria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that the pivotal defect in this syndrome is a renal phosphate leak resulting in hypophosphatemia"
      explanation: States the renal leak as the cause of hypophosphatemia.
      quote_role: PRIMARY_RESULT
  - target: Hyperphosphaturia
    description: The reabsorption defect appears as inappropriately high urinary phosphate excretion.
    evidence:
    - reference: PMID:30109410
      reference_title: "Hereditary hypophosphatemic rickets with hypercalciuria: pathophysiology, clinical presentation, diagnosis and therapy."
      supports: SUPPORT
      evidence_source: OTHER

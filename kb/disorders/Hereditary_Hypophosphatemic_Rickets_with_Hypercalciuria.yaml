name: Hereditary Hypophosphatemic Rickets with Hypercalciuria
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
description: >-
  Hereditary hypophosphatemic rickets with hypercalciuria (HHRH) is an autosomal recessive renal
  phosphate-wasting disorder caused by biallelic loss-of-function variants in SLC34A3, which encodes the
  proximal-tubule sodium-phosphate cotransporter NaPi-IIc (NPT2c). Reduced tubular phosphate reabsorption
  causes hypophosphatemia, rickets or osteomalacia, limb bowing, short stature, bone pain and muscle weakness.
  Unlike X-linked and other FGF23-mediated hypophosphatemias, FGF23 is normal or low, so hypophosphatemia
  raises calcitriol appropriately. The elevated calcitriol increases intestinal calcium absorption and suppresses
  parathyroid hormone, producing hypercalciuria, nephrocalcinosis and kidney stones. Kidney and bone
  phenotypes do not always coexist, and heterozygous carriers frequently show an intermediate biochemical
  phenotype with isolated hypercalciuria. Oral phosphate monotherapy is standard care; active vitamin D
  analogues, the mainstay in FGF23-mediated disease, are avoided because they worsen hypercalciuria.
disease_term:
  preferred_term: Hereditary Hypophosphatemic Rickets with Hypercalciuria
  term:
    id: MONDO:0009431
    label: hereditary hypophosphatemic rickets with hypercalciuria
synonyms:
- HHRH
- SLC34A3-related hypophosphatemic rickets
- NPT2c-related hypophosphatemic rickets
parents:
- Hereditary Hypophosphatemic Rickets
- Metabolic Bone Disorders
notes: >-
  This entry covers biallelic SLC34A3-related HHRH (MONDO:0009431; OMIM 241530). It is the FGF23-independent
  member of the hereditary hypophosphatemic rickets, distinguished from X-linked hypophosphatemia, ARHR1
  and autosomal dominant hypophosphatemic rickets by normal or low FGF23 and elevated calcitriol. Heterozygous
  SLC34A3 carriers with isolated hypercalciuria are described in the genetic notes and are not a subtype of
  this disease. No GeneReviews chapter exists for HHRH (cache/bookshelf/genereviews.csv lists chapters for
  X-Linked Hypophosphatemia and Hypophosphatasia only), so the 2019 review and the 2024 pooled analysis are
  the phenotype baseline.

treatments:
- name: Oral Phosphate Monotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral phosphate supplementation alone is standard care and typically normalizes serum phosphate. In the
    original kindred it reversed the clinical and biochemical abnormalities except the renal phosphate leak
    itself. In a pooled analysis it corrected hypophosphatemia in more than half of individuals but often
    did not resolve kidney or bone outcomes, and response depended on genotype and baseline TRP. Active
    vitamin D analogues are contraindicated, because calcitriol is already raised and they would worsen the
    hypercalciuria. Phosphate supplementation can raise PTH, and secondary hyperparathyroidism has
    developed on treatment, so PTH is monitored. Long-term data on preventing renal calcification are
    lacking.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: oral phosphate
      term:
        id: CHEBI:26020
        label: phosphate
  target_mechanisms:
  - target: Systemic Phosphate Depletion
    treatment_effect: RESTORES
    description: Replaces the phosphate lost in urine, restoring serum phosphate without correcting the tubular leak.
    evidence:
    - reference: PMID:2983203
      reference_title: Hereditary hypophosphatemic rickets with hypercalciuria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-term phosphate supplementation as the sole therapy resulted in reversal of all clinical and biochemical abnormalities except the decreased TmP/GFR."
      explanation: Phosphate repletion corrects the downstream abnormalities but not the renal defect.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:30109410
    reference_title: "Hereditary hypophosphatemic rickets with hypercalciuria: pathophysiology, clinical presentation, diagnosis and therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment of HHRH and IH consists of monotherapy with oral Pi supplements, while active vitamin D analogs are contraindicated, mainly because the endogenous 1,25(OH)2D levels are already elevated but also to prevent further worsening of the hypercalciuria."
    explanation: Standard of care and the contraindication to active vitamin D.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38364990
    reference_title: An update on clinical presentation and responses to therapy of patients with hereditary hypophosphatemic rickets with hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, although in more than half of individuals this therapy achieves correction of hypophosphatemia it fails to resolve the other outcomes."
    explanation: Limits of phosphate monotherapy in the pooled cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38364990
    reference_title: An update on clinical presentation and responses to therapy of patients with hereditary hypophosphatemic rickets with hypercalciuria (HHRH).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phosphate supplementation increases iPTH in 22 individuals, and frank secondary hyperparathyroidism developed in three comp/hom and one het individual"
    explanation: Basis for monitoring PTH during phosphate therapy.
    quote_role: PRIMARY_RESULT
animal_models:
- name: Npt2c-null mouse
  species: Mouse
  genotype: Slc34a3 (Npt2c) homozygous null
  publication: PMID:19570882
  genes:
  - preferred_term: Slc34a3
    term:
      id: hgnc:20305
      label: SLC34A3
  description: >-
    Mice lacking Npt2c alone do not waste phosphate on a normal-phosphate diet, unlike human HHRH.
  modeled_mechanisms:
  - target: Renal Phosphate Wasting
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: Single Npt2c knockout shows no renal phosphate wasting.
    limitations: >-
      In mice Npt2a carries most proximal-tubule phosphate reabsorption, so Npt2c loss alone is compensated;
      in humans NPT2c loss is sufficient to cause phosphate wasting. The species difference in transporter
      dependence limits the single knockout as an HHRH model.
    evidence:
    - reference: PMID:19570882
      reference_title: Npt2a and Npt2c in mice play distinct and synergistic roles in inorganic phosphate metabolism and skeletal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mice that are null for Npt2c (Npt2c(-/-)) show no evidence for renal phosphate wasting when maintained on a diet with a normal phosphate content"
      explanation: The negative result defining the mismatch.
      quote_role: PRIMARY_RESULT
- name: Npt2a/Npt2c double-knockout mouse
  species: Mouse
  genotype: Slc34a1 (Npt2a) and Slc34a3 (Npt2c) homozygous null
  publication: PMID:19570882
  genes:
  - preferred_term: Slc34a3
    term:
      id: hgnc:20305
      label: SLC34A3
  - preferred_term: Slc34a1
    term:
      id: hgnc:11019
      label: SLC34A1
  description: >-
    Combined loss of Npt2a and Npt2c reproduces severe hypophosphatemia, hypercalciuria and rickets, and a
    high-phosphate diet rescues phosphate and bone.
  modeled_mechanisms:
  - target: Impaired Skeletal Mineralization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Double knockout develops hypophosphatemic rickets rescued by dietary phosphate.
    limitations: >-
      Requires loss of a second transporter (Npt2a) that is intact in human HHRH, so the model reflects
      the combined deficit rather than the human single-gene lesion.
    evidence:
    - reference: PMID:19570882
      reference_title: Npt2a and Npt2c in mice play distinct and synergistic roles in inorganic phosphate metabolism and skeletal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "DKO mice exhibited severe hypophosphatemia, hypercalciuria, and rickets."
      explanation: The double knockout reproduces the human triad.
      quote_role: PRIMARY_RESULT

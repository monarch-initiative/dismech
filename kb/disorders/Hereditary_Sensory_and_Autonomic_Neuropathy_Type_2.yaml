  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      impairment of pain, temperature, and touch sensation owing to reduction or
      absence of peripheral sensory neurons
    explanation: >-
      States the loss of sensory neurons as the direct cause of the multimodal
      sensory impairment.
  - reference: PMID:19838196
    reference_title: "Mutations in FAM134B, encoding a newly identified Golgi protein, cause severe sensory and autonomic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This implicates FAM134B as critical in long-term survival of nociceptive
      and autonomic ganglion neurons.
    explanation: >-
      Identifies long-term ganglion neuron survival, rather than development, as
      the process that fails at this node.
  downstream:
  - target: Universal Multimodal Sensory Loss
  - target: Autonomic Dysfunction

- name: Universal Multimodal Sensory Loss
  description: >-
    Severe impairment of pain, temperature, touch and vibration perception
    involving both large and small fibres, present from infancy and universal
    rather than length-dependent. Sensory nerve conduction is highly abnormal
    while motor conduction studies are almost normal — the electrophysiological
    dissociation that identifies the disorder as a pure sensory neuronopathy.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sensory perception of pain
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: DECREASED
  evidence:
  - reference: PMID:12102461
    reference_title: "Assessment and evaluation of hereditary sensory and autonomic neuropathies with autonomic and neurophysiological examinations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensory perception is severely impaired and accounts for elevated vibratory
      but also thermal perception thresholds. Sensory nerve conduction is highly
      abnormal while motor nerve conduction studies are almost normal.
    explanation: >-
      Documents both the multimodal breadth of the sensory loss and the
      sensory-motor dissociation on nerve conduction studies.
  downstream:
  - target: Painless Injury and Acral Mutilation
  - target: Impaired pain sensation
  - target: Impaired temperature sensation
  - target: Impaired vibratory sensation

- name: Autonomic Dysfunction
  description: >-
    Autonomic involvement that is real but milder and more variable than in
    familial dysautonomia: acral anhidrosis, tonic pupils, eating and swallowing
    difficulty, constipation, episodic fever, hypotonia and episodes of apnoea.
    The autonomic ganglion neurons are lost by the same mechanism as the sensory
    ones, which is why the autonomic features track the sensory ones rather than
    forming a separate disease axis.
  role: effector
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  evidence:
  - reference: PMID:12102461
    reference_title: "Assessment and evaluation of hereditary sensory and autonomic neuropathies with autonomic and neurophysiological examinations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are acral anhidrosis and various autonomic dysfunctions such as tonic
      pupils, eating and swallowing difficulties, constipation, episodic fever,
      profound hypotonia and episodes of apnea.
    explanation: >-
      Enumerates the autonomic manifestations of HSAN2 in a comparative
      assessment of the HSAN types.
  downstream:
  - target: Tonic pupil
  - target: Anhidrosis

- name: Painless Injury and Acral Mutilation
  description: >-
    The destructive clinical terminus. Because injury is not felt, repeated
    unrecognized trauma to fingers and toes produces trophic ulcers,
    osteomyelitis, painless fractures, neuropathic joints and progressive
    acro-osteolysis, ending in autoamputation of digits. The mutilation is
    mechanically driven and preventable in principle by protection and
    surveillance, which is what makes the absence of disease-modifying therapy
    less absolute than it appears.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19838196
    reference_title: "Mutations in FAM134B, encoding a newly identified Golgi protein, cause severe sensory and autonomic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary sensory and autonomic neuropathy type II (HSAN II) leads to
      severe mutilations because of impaired nociception and autonomic
      dysfunction.
    explanation: >-
      States the causal chain from impaired nociception to severe mutilation.
  - reference: PMID:23831200
    reference_title: "[Hereditary sensory and autonomic neuropathy type II A: early neurological and skeletal findings]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with different types of complications of trauma to the extremities such as
      ulcers, mutilations and acral amputations
    explanation: >-
      Documents the specific trauma complications that constitute this node.
  downstream:
  - target: Skin ulcer
  - target: Self-mutilation


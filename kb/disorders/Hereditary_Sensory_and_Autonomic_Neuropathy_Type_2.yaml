    label: hereditary sensory and autonomic neuropathy type 2
has_subtypes:
- name: HSAN2A
  display_name: HSAN2A (WNK1/HSN2)
  description: >-
    Caused by truncating variants in HSN2, a single-exon open reading frame that
    is a nervous-system-specific alternatively spliced exon of WNK1. The
    restriction of pathogenic variants to this exon is why HSAN2A is
    neurological while other WNK1 variants cause pseudohypoaldosteronism type II
    with no neuropathy. Originally defined in Canadian genetic isolates
    (Newfoundland, rural Quebec, Nova Scotia).
  subtype_term:
    preferred_term: neuropathy, hereditary sensory and autonomic, type 2A
    term:
      id: MONDO:0024309
      label: neuropathy, hereditary sensory and autonomic, type 2A
- name: HSAN2B
  display_name: HSAN2B (RETREG1/FAM134B)
  description: >-
    Caused by loss-of-function variants in FAM134B (now RETREG1), which encodes a
    cis-Golgi protein. Knockdown alters cis-Golgi structure and induces apoptosis
    in primary dorsal root ganglion neurons, implicating the gene in the
    long-term survival of nociceptive and autonomic ganglion neurons.
  subtype_term:
    preferred_term: neuropathy, hereditary sensory and autonomic, type 2B
    term:
      id: MONDO:0013142
      label: neuropathy, hereditary sensory and autonomic, type 2B
- name: HSAN2C
  display_name: HSAN2C (KIF1A)
  description: >-
    A rare cause, from truncating variants in KIF1A, the kinesin that transports
    synaptic vesicle precursors along axons. As in HSAN2A, the pathogenic
    variants are almost exclusively restricted to an alternatively spliced exon.
    KIF1A was found by a yeast two-hybrid screen to interact with the domain
    encoded by the HSN2 exon, tying HSAN2A and HSAN2C to a shared axonal-transport
    mechanism.
  subtype_term:
    preferred_term: neuropathy, hereditary sensory, type 2C
    term:
      id: MONDO:0013634
      label: neuropathy, hereditary sensory, type 2C
inheritance:
- name: Autosomal recessive
  description: >-
    HSAN2 is inherited in an autosomal recessive manner. Affected individuals are
    homozygous or compound heterozygous for truncating variants, and the disorder
    was originally mapped through homozygosity in consanguineous and
    genetically isolated populations.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary sensory and autonomic neuropathy (HSAN) type II is an autosomal
      recessive disorder characterized by impairment of pain, temperature, and
      touch sensation owing to reduction or absence of peripheral sensory
      neurons.
    explanation: >-
      States the recessive inheritance mode alongside the defining sensory
      phenotype and its neuronal basis.
pathophysiology:
- name: Loss-of-Function Variant in a Sensory Neuron Maintenance Gene
  description: >-
    A biallelic truncating or loss-of-function variant in one of three genes
    required for the long-term maintenance of dorsal root ganglion sensory
    neurons: the nervous-system-specific HSN2 exon of WNK1, RETREG1/FAM134B, or
    KIF1A. Two of the three are restricted to alternatively spliced,
    nervous-system-specific exons, which is what makes the resulting disease a
    pure sensory neuronopathy rather than part of the multisystem phenotype those
    genes' other isoforms produce.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  evidence:
  - reference: PMID:18521183
    reference_title: "Mutations in the nervous system--specific HSN2 exon of WNK1 cause hereditary sensory neuropathy type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that HSN2 is a nervous system-specific exon of the
      with-no-lysine(K)-1 (WNK1) gene.
    explanation: >-
      Establishes the tissue-restricted nature of the HSAN2A lesion, which
      explains the sensory selectivity of the disease.
  - reference: PMID:21820098
    reference_title: "KIF1A, an axonal transporter of synaptic vesicles, is mutated in hereditary sensory and autonomic neuropathy type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly to WNK1 mutations, pathogenic mutations in KIF1A were almost
      exclusively restricted to an alternatively spliced exon.
    explanation: >-
      Confirms the same alternatively-spliced-exon restriction in the second
      gene, supporting this as a shared property of the trigger node.
  downstream:
  - target: Impaired Axonal Transport and Golgi Homeostasis in Sensory Neurons
    description: >-
      The affected proteins converge on vesicle transport and secretory-pathway
      organization within the sensory neuron.

- name: Impaired Axonal Transport and Golgi Homeostasis in Sensory Neurons
  description: >-
    The three HSAN2 gene products converge on the intracellular logistics of the
    sensory neuron. KIF1A transports synaptic vesicle precursors down the axon
    and physically interacts with the domain encoded by the HSN2 exon of WNK1;
    RETREG1/FAM134B maintains cis-Golgi structure. The convergence, rather than
    any one gene's individual function, is the argument that HSAN2 is one
    mechanistic entity: the sensory neuron has an exceptionally long axon and is
    correspondingly intolerant of defects in cargo transport and secretory-pathway
    organization.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: axonal transport
    term:
      id: GO:0098930
      label: axonal transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: cis-Golgi network
    term:
      id: GO:0005801
      label: cis-Golgi network
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21820098
    reference_title: "KIF1A, an axonal transporter of synaptic vesicles, is mutated in hereditary sensory and autonomic neuropathy type 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a yeast two-hybrid screen, we found that KIF1A, an axonal transporter
      of synaptic vesicles, interacts with the domain encoded by the HSN2 exon.
    explanation: >-
      Establishes a direct physical link between two of the three HSAN2 gene
      products, supporting a shared axonal-transport mechanism.
  - reference: PMID:19838196
    reference_title: "Mutations in FAM134B, encoding a newly identified Golgi protein, cause severe sensory and autonomic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fam134b knockdown results in structural alterations of the cis-Golgi
      compartment and induces apoptosis in some primary dorsal root ganglion
      neurons.
    explanation: >-
      Establishes the Golgi-homeostasis arm of this node and links it directly to
      sensory neuron death.
  downstream:
  - target: Loss of Peripheral Sensory Neurons
    description: >-
      Sensory neurons unable to maintain their axons and secretory pathway
      undergo apoptosis.

- name: Loss of Peripheral Sensory Neurons
  description: >-
    The rate-limiting lesion of the disorder: reduction or absence of peripheral
    sensory neurons. This is a neuronopathy — the cell bodies in the dorsal root
    ganglion are lost — not a length-dependent dying-back axonopathy, which is why
    the sensory deficit is universal rather than distally graded and why it
    affects large and small fibres alike.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  locations:
  - preferred_term: dorsal root ganglion
    term:
      id: UBERON:0000044
      label: dorsal root ganglion

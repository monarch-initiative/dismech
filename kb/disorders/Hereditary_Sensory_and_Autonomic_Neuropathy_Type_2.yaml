genetic:
- name: WNK1
  gene_term:
    preferred_term: WNK1
    term:
      id: hgnc:14540
      label: WNK1
  relationship_type: CAUSATIVE
  association: >-
    Truncating variants in the HSN2 exon — a single-exon open reading frame lying
    within intron 8 of WNK1 and transcribed from the same strand — cause HSAN2A.
    The exon is nervous-system-specific and its protein product is more abundant
    in sensory than in motor neurons, which is why these variants cause a sensory
    neuropathy while other WNK1 variants cause pseudohypoaldosteronism type II.
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gene, termed "HSN2," consists of a single exon located within intron 8
      of the PRKWNK1 gene and is transcribed from the same strand.
    explanation: >-
      Establishes the genomic relationship between HSN2 and WNK1 that underlies
      the isoform-specific disease mechanism.
  - reference: PMID:18521183
    reference_title: "Mutations in the nervous system--specific HSN2 exon of WNK1 cause hereditary sensory neuropathy type II."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also demonstrate that the novel protein product of Wnk1/Hsn2 was more
      abundant in sensory neurons than motor neurons.
    explanation: >-
      Supplies the expression-level basis for the sensory selectivity. Evidence
      source is MODEL_ORGANISM because the immunodetection was performed in mice.
- name: RETREG1
  gene_term:
    preferred_term: RETREG1
    term:
      id: hgnc:25964
      label: RETREG1
  relationship_type: CAUSATIVE
  association: >-
    Loss-of-function variants in RETREG1 (formerly FAM134B), encoding a cis-Golgi
    protein, cause HSAN2B. The mechanism is failure of long-term survival of
    nociceptive and autonomic ganglion neurons rather than a developmental
    failure to form them.
  evidence:
  - reference: PMID:19838196
    reference_title: "Mutations in FAM134B, encoding a newly identified Golgi protein, cause severe sensory and autonomic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that loss-of-function mutations in FAM134B, encoding a newly
      identified cis-Golgi protein, cause HSAN II.
    explanation: >-
      Establishes causation and the gene product's subcellular identity.
- name: KIF1A
  gene_term:
    preferred_term: KIF1A
    term:
      id: hgnc:888
      label: KIF1A
  relationship_type: CAUSATIVE
  association: >-
    Truncating variants in KIF1A are a rare cause of HSAN2 (HSAN2C), found in
    four families out of 113 screened. As with WNK1, the pathogenic variants are
    almost exclusively restricted to an alternatively spliced exon.
  evidence:
  - reference: PMID:21820098
    reference_title: "KIF1A, an axonal transporter of synaptic vesicles, is mutated in hereditary sensory and autonomic neuropathy type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent sequencing of KIF1A in a series of 112 unrelated patients with
      features belonging to the clinical spectrum of ulcero-mutilating sensory
      neuropathies revealed truncating mutations in three additional families,
      thus indicating that mutations in KIF1A are a rare cause of HSANII.
    explanation: >-
      Quantifies the rarity of the KIF1A contribution in a screened cohort.

diagnosis:
- name: Nerve conduction studies and quantitative sensory testing
  description: >-
    The diagnostic signature is a sensory-motor dissociation: sensory nerve
    conduction is highly abnormal while motor conduction is almost normal.
    Quantitative sensory testing shows elevated thermal and vibratory thresholds,
    and sudomotor testing (sympathetic skin response, QSART) documents the acral
    anhidrosis.
  evidence:
  - reference: PMID:12102461
    reference_title: "Assessment and evaluation of hereditary sensory and autonomic neuropathies with autonomic and neurophysiological examinations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensory nerve conduction is highly abnormal while motor nerve conduction
      studies are almost normal.
    explanation: >-
      States the electrophysiological dissociation that identifies HSAN2 as a
      pure sensory neuronopathy.
- name: Molecular genetic testing
  description: >-
    Sequencing of the HSN2 exon of WNK1, RETREG1 and KIF1A. Because two of the
    three loci are alternatively spliced exons that standard transcript-based
    analysis may not cover, coverage of those specific exons should be confirmed
    before a negative result is accepted.
  evidence:
  - reference: PMID:21820098
    reference_title: "KIF1A, an axonal transporter of synaptic vesicles, is mutated in hereditary sensory and autonomic neuropathy type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly to WNK1 mutations, pathogenic mutations in KIF1A were almost
      exclusively restricted to an alternatively spliced exon.
    explanation: >-
      Supports the practical warning that the causative exons are the
      alternatively spliced ones.

treatments:
- name: Wound care and injury prevention
  description: >-
    There is no disease-modifying therapy. Management is protective: surveillance
    and care of the extremities, protective footwear and orthoses, prompt
    treatment of ulcers and osteomyelitis, and dental measures where tongue and
    lip biting occurs. Because the mutilation is mechanically driven rather than
    intrinsic to the neuronal loss, this is the intervention that most changes
    outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23831200
    reference_title: "[Hereditary sensory and autonomic neuropathy type II A: early neurological and skeletal findings]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with different types of complications of trauma to the extremities such as
      ulcers, mutilations and acral amputations
    explanation: >-
      Establishes that the morbidity is trauma-driven, which is the rationale for
      a protective management strategy.

differential_diagnoses:
- name: Congenital Insensitivity to Pain
  description: >-
    HSAN4/5 (NTRK1, NGF) and the SCN9A-related pain insensitivities also present
    with painless mutilation, but the sensory loss there is selective for pain
    (and, in HSAN4, accompanied by anhidrosis and intellectual disability) with
    preserved touch and vibration. HSAN2 involves all sensory modalities
    including large-fibre function.
  evidence:
  - reference: PMID:12102461
    reference_title: "Assessment and evaluation of hereditary sensory and autonomic neuropathies with autonomic and neurophysiological examinations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with the very rare HSAN type V respond normally to tactile,
      vibratory or thermal stimuli, but have a selective loss of pain perception
      with otherwise normal neurological examination.
    explanation: >-
      Contrasts the selective pain loss of HSAN5 with the multimodal loss of
      HSAN2, which is the discriminating feature.
- name: Hereditary Sensory and Autonomic Neuropathy
  description: >-
    HSAN1 (autosomal dominant, SPTLC1) presents between the second and fourth
    decades with ulcers and mutilation of the lower limbs, and HSAN3 (familial
    dysautonomia) with pronounced sympathetic dysregulation in children of
    Ashkenazi Jewish ancestry. HSAN2 is distinguished from both by its infantile
    onset, recessive inheritance, and universal rather than distally graded
    sensory loss.
  evidence:
  - reference: PMID:12102461
    reference_title: "Assessment and evaluation of hereditary sensory and autonomic neuropathies with autonomic and neurophysiological examinations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The slowly progressive, symmetrical HSAN type I manifests between the
      second and fourth decade with ulcers or mutilations of the lower
      extremities
    explanation: >-
      Gives the onset and distribution contrast used to separate HSAN1 from
      HSAN2.

notes: >-
  Deliberately NOT declared as conforming to
  `peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination`.
  That module node is defined by distal, length-dependent dying-back degeneration
  of the axon; HSAN2 is a neuronopathy in which the dorsal root ganglion cell
  bodies are lost, which is why the sensory deficit is universal rather than
  distally graded and why it spares neither large nor small fibres. Asserting the
  conformance would have contradicted this entry's own central claim.

  Frequency bands are confined to the two sensory modalities that the cited
  sources state as definitional (pain, temperature). The destructive
  complications are reported as a qualitative list of what can happen, with no
  proportions, so they carry no band.

  The three causative genes are curated as one entry rather than three because
  their products physically and functionally converge (KIF1A binds the HSN2
  domain of WNK1; RETREG1 maintains the secretory pathway those cargoes traverse)
  and produce a clinically indistinguishable phenotype. This is a lump decision
  supported by mechanism, not merely by shared nosology.

  A note on the gene symbol used for the HSAN2A locus: HGNC records the causative
  gene as WNK1, and the disease-causing element is the HSN2 exon within it. The
  founding paper refers to the locus as PRKWNK1, the previous approved symbol,
  which is why that string appears in the quoted evidence.

  No frequency bands are asserted for the autonomic phenotypes: the comparative
  assessment cited enumerates them qualitatively across the HSAN types without
  per-feature counts in HSAN2.

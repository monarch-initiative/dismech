name: Hereditary Sensory and Autonomic Neuropathy Type 2
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Hereditary sensory and autonomic neuropathy type 2 (HSAN2, hereditary sensory
  neuropathy type II, neurogenic acro-osteolysis) is an early-onset autosomal
  recessive sensory neuronopathy in which peripheral sensory neurons are reduced
  or absent, producing a profound and universal loss of pain, temperature and
  touch perception across both large and small fibres. Symptoms begin in infancy
  or early childhood. Because the loss covers all modalities, the destructive
  complications are mechanical as well as nociceptive: painless acral ulcers,
  osteomyelitis, unnoticed fractures, neuropathic (Charcot) joints and progressive
  acro-osteolysis with autoamputation of fingers and toes. Autonomic involvement
  is present but milder and more variable than in familial dysautonomia (HSAN3),
  and includes acral anhidrosis, tonic pupils, and feeding and swallowing
  difficulty. Sensory nerve conduction is highly abnormal while motor conduction
  is almost normal, the electrophysiological signature of a pure sensory
  neuronopathy. Three genes are known, and their convergence is mechanistically
  informative: WNK1/HSN2 (HSAN2A), RETREG1/FAM134B (HSAN2B) and KIF1A (HSAN2C)
  all act on the long-term survival and axonal maintenance of dorsal root
  ganglion sensory neurons, and the HSN2 domain and KIF1A physically interact.
category: Mendelian
parents:
- Peripheral Neuropathy
- hereditary disease
disease_term:
  preferred_term: hereditary sensory and autonomic neuropathy type 2
  term:

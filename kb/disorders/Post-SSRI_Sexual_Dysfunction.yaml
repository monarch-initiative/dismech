notes: >-
  Scope: this entry models the ENDURING syndrome — sexual dysfunction that
  persists or first appears after a serotonin reuptake inhibiting antidepressant
  has been discontinued and then fails to remit. Treatment-emergent sexual side
  effects that resolve on stopping the drug are a different (and far more
  common) phenomenon and are out of scope, as is persistent genital arousal
  disorder following SSRIs, which the 2022 consensus criteria treat as a
  separate condition with an almost mirror-image presentation.

  Related conditions are curated as differentials rather than subtypes:
  post-finasteride syndrome and post-retinoid sexual dysfunction. They share the
  symptom core and possibly the neuroactive-steroid mechanism, and a Grouping
  over the three enduring post-drug sexual syndromes would be a reasonable
  addition once at least one of the siblings is curated.

  Ontology gaps encountered. (1) HPO has no genital-specific hypoesthesia term,
  so the cardinal phenotype is bound to the generic HP:0033748 Hypoesthesia with
  a site-specific preferred_term. (2) HPO has no term for orgasmic or
  ejaculatory anhedonia specifically, so HP:0012154 Anhedonia is used. (3) There
  is no NCIT clinical-action term for extracorporeal shock wave or peripheral
  nerve stimulation of the genitalia, so the neuromodulation treatment is bound
  to the generic NCIT:C49236 Therapeutic Procedure. (4) The Suppression of
  Central Sexual Arousal and Reward Signaling node carries no biological_process
  binding: GO's sexual-response classes are organ-level and male-specific
  (GO:0043084 penile erection), which would both mis-scale a CNS node and
  duplicate the HP:0100639 phenotype, and GO has no molecular or cellular class
  for central sexual arousal or reward-signalling capacity. The node is left
  with its cell-type binding only rather than annotated with an inaccurate term.

  Sex scope: the cited human evidence is overwhelmingly male, and the rodent
  mechanism work is male-only. Read every quantitative and mechanistic claim
  here as established for men and unverified for women — the male-skewed
  evidence base and its ascertainment cause are recorded as the
  pssd_male_skewed_evidence_base knowledge gap.

  A peripheral_axonal_degeneration module conformance was considered for the
  Genital Sensory Nerve Dysfunction node and deliberately NOT declared: the only
  objective peripheral-nerve evidence is corneal confocal microscopy in two
  patients, which does not establish distal axonal degeneration or demyelination
  as the module requires. Revisit if a small-fibre study in a PSSD cohort is
  published.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSSD symptoms include genital anesthesia, erectile dysfunction and
      orgasmic/ejaculatory anhedonia, and should be differentiated from
      depression-related sexual-dysfunction.
    explanation: >-
      Defines the composite output — sensory, erectile and hedonic — that the
      central arms converge on.
  downstream:
  - target: Enduring Post-Discontinuation Sexual Dysfunction
    causal_link_type: DIRECT
    description: >-
      Failure of the central deficit to reverse on drug clearance is what
      converts a treatment-emergent side effect into the enduring syndrome.
  - target: Emotional Blunting and Anhedonia

name: Post-SSRI Sexual Dysfunction
creation_date: '2026-08-05T00:00:00Z'
category: Environmental
categories:
- Iatrogenic Drug-Induced Disorder
- Enduring Post-Drug Syndrome
- Sexual Dysfunction
synonyms:
- PSSD
- post-SSRI sexual dysfunction
- persistent sexual dysfunction after SSRI withdrawal
- enduring sexual dysfunction following serotonin reuptake inhibitors
- post-selective serotonin reuptake inhibitor sexual dysfunction
description: >-
  Post-SSRI sexual dysfunction (PSSD) is an iatrogenic syndrome in which sexual
  dysfunction that began during treatment with a serotonin reuptake inhibiting
  antidepressant persists — or first emerges — after the drug has been stopped,
  and then fails to resolve. Its most characteristic feature is genital
  hypoesthesia or frank genital anesthesia, accompanied by loss of libido,
  pleasureless or absent orgasm, and erectile dysfunction; non-sexual ancillary
  features such as emotional blunting and cognitive impairment are common. The
  syndrome is recognised by the European Medicines Agency as a condition that
  can outlast discontinuation of SSRIs and SNRIs, has published consensus
  diagnostic criteria (2022) and a MedDRA code, and is grouped with
  post-finasteride syndrome and post-retinoid sexual dysfunction as one of a
  family of enduring post-drug sexual syndromes sharing a symptom profile.

  Mechanistically PSSD is unsettled, and this entry deliberately models it as a
  set of competing arms rather than a single settled chain. Four candidate
  routes downstream of serotonin reuptake inhibition are curated as separate
  mechanistic hypotheses: 5-HT1A receptor desensitization with disturbed
  serotonergic tone (the most widely invoked account), suppression of brain
  neurosteroidogenesis with allopregnanolone depletion, persistent
  transcriptional/epigenetic reprogramming of dopaminergic reward circuitry,
  and a peripheral genital small-fibre/TRP-channel neuropathy. Critically, the
  neurosteroid and transcriptomic evidence is entirely from paroxetine-treated
  male rats and has never been measured in patients with PSSD, and there are no
  prospective randomised trials of any proposed treatment — both are recorded
  as explicit discussions rather than smoothed over. No treatment is
  FDA-approved; the reported options (vortioxetine/bupropion, low-power laser
  irradiation, peripheral genital neuromodulation) rest on small open-label
  cohorts and case reports.

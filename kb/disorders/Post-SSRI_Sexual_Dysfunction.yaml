name: Post-SSRI Sexual Dysfunction
creation_date: '2026-07-12T23:30:00Z'
category: Iatrogenic
description: >-
  Post-SSRI sexual dysfunction (PSSD) is a persistent iatrogenic syndrome of
  sexual dysfunction that continues or emerges after discontinuation of a
  selective serotonin reuptake inhibitor (SSRI) or related serotonergic
  antidepressant. Characteristic features include genital anesthesia/numbness,
  sexual anhedonia, decreased libido, erectile dysfunction, and anorgasmia,
  distinguished from a depressive relapse by specific somatic symptoms such as
  genital numbness. The pathophysiology is multifactorial and incompletely
  understood, with leading hypotheses implicating 5-HT1A receptor
  desensitization, neurosteroid (allopregnanolone) depletion via 5-alpha-reductase
  inhibition, and epigenetic silencing of dopaminergic reward circuits. Despite
  recent warnings from regulatory bodies such as the EMA, PSSD remains
  under-recognized; there is no MONDO term for the condition, so this entry is
  curated without a disease_term mapping.
parents:
- Sexual Dysfunction
- Drug Adverse Reaction
synonyms:
- PSSD
- Post-SSRI sexual dysfunction syndrome
prevalence:
- population: Affected cohorts (post-SSRI, followed beyond 6 months)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Prevalence estimates suggest persistent symptoms in up to 74% of affected
    cohorts beyond 6 months. Population-level occurrence is not established
    because PSSD remains under-recognized and lacks a standardized case
    ascertainment framework.
  evidence:
  - reference: PMID:42430418
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevalence estimates suggest persistent symptoms in up to 74% of affected cohorts beyond 6 months."
    explanation: >-
      Comprehensive review reports persistence of symptoms in up to 74% of
      affected cohorts beyond 6 months, quantifying the persistent nature of the
      syndrome.
pathophysiology:
- name: 5-HT1A Receptor Desensitization
  description: >-
    Chronic SSRI exposure is proposed to produce lasting desensitization of
    5-HT1A serotonin receptor signaling that persists after drug cessation,
    contributing to the persistent sexual dysfunction of PSSD.
  cell_types:
  - preferred_term: Serotonergic neuron
    term:
      id: CL:0000850
      label: serotonergic neuron
  biological_processes:
  - preferred_term: Serotonin receptor signaling
    term:
      id: GO:0007210
      label: serotonin receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: Genital Anesthesia
    description: >-
      Persistent serotonergic desensitization is hypothesized to contribute to
      impaired genital sensation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:42430418
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology is multifactorial, involving 5-HT1A receptor desensitization"
    explanation: >-
      Review identifies 5-HT1A receptor desensitization as one of the three
      leading mechanistic components of PSSD pathophysiology.
- name: Neurosteroid (Allopregnanolone) Depletion
  description: >-
    Inhibition of 5-alpha-reductase is proposed to deplete the neurosteroid
    allopregnanolone, reducing GABAergic neurosteroid tone and contributing to
    persistent sexual and affective dysfunction in PSSD.
  biological_processes:
  - preferred_term: Neurosteroid biosynthesis
    term:
      id: GO:0006694
      label: steroid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:42430418
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurosteroid (allopregnanolone) depletion via 5α-reductase inhibition"
    explanation: >-
      Review identifies neurosteroid (allopregnanolone) depletion secondary to
      5-alpha-reductase inhibition as a leading mechanistic component of PSSD.
- name: Epigenetic Silencing of Dopaminergic Reward Circuits
  description: >-
    Epigenetic silencing of gene expression within dopaminergic reward circuitry
    is proposed to blunt reward signaling, contributing to sexual anhedonia in
    PSSD.
  cell_types:
  - preferred_term: Dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: Epigenetic gene silencing
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
    modifier: INCREASED
  downstream:
  - target: Sexual Anhedonia
    description: >-
      Epigenetic blunting of dopaminergic reward signaling is hypothesized to
      drive the anhedonic component of PSSD.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:42430418
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "epigenetic silencing of dopaminergic reward circuits"
    explanation: >-
      Review identifies epigenetic silencing of dopaminergic reward circuits as
      a leading mechanistic component of PSSD.

  - target: Suppression of Central Sexual Arousal and Reward Signaling
    causal_link_type: DIRECT
    hypothesis_groups:
    - serotonergic_receptor_model
    description: >-
      Maladapted serotonergic tone shifts the serotonin-dopamine balance that
      governs desire, arousal and orgasm.
- name: Suppression of Brain Neurosteroidogenesis
  biological_scale: MOLECULAR
  description: >-
    Suppression of steroidogenic enzyme expression in brain — including the
    5-alpha-reductase step that generates allopregnanolone from progesterone —
    reduces local neuroactive steroid availability. The evidence is from male
    rats treated subchronically with paroxetine, in which brain but not plasma
    neuroactive steroid levels changed, and in which the negative effect on
    steroidogenic enzyme expression was seen specifically at withdrawal rather
    than during treatment. That withdrawal-specific timing is why this node is
    mechanistically attractive for a syndrome defined by onset or persistence
    after the drug is stopped.

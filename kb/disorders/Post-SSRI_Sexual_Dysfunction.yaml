mechanistic_hypotheses:
- hypothesis_group_id: serotonergic_receptor_model
  hypothesis_label: 5-HT1A receptor desensitization and enduring serotonergic tone dysregulation
  status: CANONICAL
  description: >-
    The most frequently invoked account holds that prolonged reuptake blockade
    desensitizes/downregulates 5-HT1A receptors and leaves serotonergic
    signalling persistently maladapted after the drug is withdrawn, with
    downstream consequences for neurosteroid and oxytocin systems and for the
    serotonin-dopamine balance that governs sexual arousal. It is canonical in
    the sense of being the dominant published narrative, not in the sense of
    being demonstrated in patients — the supporting human material is a single
    detailed case analysis plus review synthesis, and no receptor-level
    measurement has been made in people with PSSD.
  evidence:
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathophysiology is multifactorial, involving 5-HT1A receptor
      desensitization, neurosteroid (allopregnanolone) depletion via
      5α-reductase inhibition, and epigenetic silencing of dopaminergic reward
      circuits.
    explanation: >-
      Names 5-HT1A desensitization first among the three mechanisms proposed by
      the most recent systematic review, alongside the neurosteroid and
      epigenetic arms curated as separate hypotheses here.
  - reference: PMID:36898260
    reference_title: The pathophysiology of Post SSRI Sexual Dysfunction - Lessons from a case study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In many of these symptoms a dysregulation in serotonergic activity has
      been implicated, with an important role of 5-HT1A receptor downregulation
      and possible downstream effects on neurosteroid and oxytocin systems.
    explanation: >-
      Case-derived mechanistic analysis placing 5-HT1A downregulation upstream
      of the neurosteroid arm, which is why this entry draws an edge from the
      receptor node to the neurosteroid node rather than treating them as
      independent.
- hypothesis_group_id: neurosteroid_model
  hypothesis_label: Suppressed brain neurosteroidogenesis and allopregnanolone depletion
  status: ALTERNATIVE
  description: >-
    A second arm attributes the enduring phenotype to a lasting suppression of
    brain steroidogenic enzyme expression — including the 5-alpha-reductase
    step that produces allopregnanolone — established during treatment and
    persisting or deepening after withdrawal. The distinguishing prediction is
    that the deficit is central rather than systemic: in the rat model plasma
    neuroactive steroid levels were unaffected while brain levels changed,
    which is what makes the effect attributable to local neurosteroidogenesis.
    This is the arm that generates a concrete therapeutic proposal (neurosteroid
    replacement), and it is the shared mechanistic bridge to post-finasteride
    syndrome, where the same 5-alpha-reductase step is the drug target.
  evidence:
  - reference: PMID:34325207
    reference_title: Effects of paroxetine treatment and its withdrawal on neurosteroidogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, it is possible to hypothesize that altered neurosteroidogenesis
      may also occur in PSSD and consequently it may represent a possible
      pharmacological target for this disorder.
    explanation: >-
      The authors' own framing marks this as a hypothesis extrapolated from the
      rat to PSSD, not an observation in patients.
  - reference: PMID:37993021
    reference_title: "Post-Finasteride Syndrome And Post-Ssri Sexual Dysfunction: Two Clinical Conditions Apparently Distant, But Very Close."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indeed, as discussed, clinical studies and preclinical data obtained so
      far suggest an important role for brain modulators (i.e., neuroactive
      steroids), neurotransmitters (i.e., serotonin, and cathecolamines), and
      gut microbiota in the context of the gut-brain axis.
    explanation: >-
      Positions neuroactive steroids as a mechanism shared between PSSD and
      post-finasteride syndrome, the argument for curating this as a distinct
      mechanistic arm rather than a detail of the serotonergic model.
- hypothesis_group_id: epigenetic_reward_circuit_model
  hypothesis_label: Persistent transcriptional and epigenetic reprogramming of dopaminergic reward circuitry
  status: ALTERNATIVE
  description: >-
    A third arm proposes that the drug leaves a durable transcriptional
    signature in the reward circuitry — chiefly the nucleus accumbens — that
    outlasts clearance of the drug itself and explains why the syndrome does
    not remit on discontinuation. Rat RNA-sequencing after paroxetine
    withdrawal shows a large accumbal transcriptional response during treatment
    that only partially normalises a month later, involving dopaminergic,
    glutamatergic and GABAergic genes plus neurexin/neuroligin and BDNF
    signalling. This arm predicts persistence as its central feature and is the
    one most directly aligned with the anhedonia/emotional-blunting side of the
    phenotype rather than the genital-sensory side.
  evidence:
  - reference: PMID:39495228
    reference_title: "Transcriptomic Profile of the Male Rat Hypothalamus and Nucleus Accumbens After Paroxetine Treatment and Withdrawal: Possible Causes of Sexual Dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, the analysis of DEGs altered at T1 in the NAc confirms the
      persistence of some of these side effects providing further information
      for post-SSRI sexual dysfunction (PSSD) etiopathogenesis.
    explanation: >-
      Demonstrates that a subset of drug-induced accumbal transcriptional
      changes persists a month after withdrawal, which is the specific claim
      this hypothesis rests on.
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different theories have been proposed to explain the pathophysiology of
      PSSD: epigenetic gene expression, dopamine-serotonin interactions,
      serotonin neurotoxicity and hormonal changes.
    explanation: >-
      Enumerates epigenetic gene expression among the competing theories,
      justifying its curation as a parallel hypothesis rather than a
      sub-mechanism of the serotonergic model.
- hypothesis_group_id: peripheral_neuropathy_model
  hypothesis_label: Peripheral genital small-fibre / TRP-channel sensory neuropathy
  status: EMERGING
  description: >-
    A fourth arm locates at least part of the pathology outside the brain, in
    the sensory innervation of the genitalia. Two independent observations
    support it: a paroxetine-exposed patient with persistent penile anesthesia
    regained touch and temperature sensation after low-power laser irradiation,
    prompting the proposal that SSRIs disturb transient receptor potential (TRP)
    ion channels of mechano-, thermo- and chemosensitive nerve endings; and a
    urology series in which peripheral neuropathy was documented by corneal
    confocal microscopy and genital-directed neuromodulation produced partial
    improvement while central symptoms did not change. The dissociation between
    the peripheral and central response is the strongest argument that PSSD is
    not a single-compartment disorder.
  evidence:
  - reference: PMID:25483212
    reference_title: "Penile anesthesia in Post SSRI Sexual Dysfunction (PSSD) responds to low-power laser irradiation: a case study and hypothesis about the role of transient receptor potential (TRP) ion channels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is hypothesized that SSRI treatment induces disturbances of transient
      receptor potential (TRP) ion channels of mechano-, thermo- and
      chemosensitive nerve endings and receptors resulting in the penile
      anesthesia in PSSD.
    explanation: >-
      States the peripheral TRP-channel hypothesis for the genital-anesthesia
      component of PSSD.
  - reference: PMID:39934554
    reference_title: "Insights into the peripheral nature of persistent sexual dysfunction associated with post-finasteride, post-SSRI and post-accutane syndromes: lessons learned from a case study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral neuropathy was noted in two patients via corneal confocal
      microscopy, however central symptoms remain.
    explanation: >-
      Objective peripheral-nerve findings in two of three patients, with the
      explicit caveat that central symptoms were unaffected — hence PARTIAL
      support and EMERGING rather than established status.
- hypothesis_group_id: depressive_relapse_model
  hypothesis_label: Residual or relapsing depression rather than a drug-induced syndrome
  status: DEPRECATED
  description: >-
    Historically the persistent complaints were attributed to the underlying
    depressive illness rather than to the drug. This entry retains the model as
    DEPRECATED because it is still the default clinical reading in practice and
    because misclassification is actively harmful — it leads to reinstatement of
    the very agent implicated. The 2022 consensus criteria discriminate the two
    on somatic grounds (genital numbness, which is not a feature of depression),
    and one treatment cohort excluded patients with major depressive disorder
    a priori for exactly this reason. Deprecated, not refuted: the discriminating
    studies are consensus criteria and small selected cohorts, not a controlled
    comparison.
  evidence:
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is clinical, based on 2022 standardized criteria, distinguishing
      PSSD from depressive relapse by specific somatic symptoms like genital
      numbness.
    explanation: >-
      The existence of a somatic discriminator against depressive relapse is the
      basis for deprecating the residual-depression explanation.
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Misdiagnosing this syndrome might lead to harmful treatments including
      reinstatement of medications which generated PSSD.
    explanation: >-
      States the clinical harm of attributing PSSD to depressive relapse, the
      practical reason this deprecated model is retained explicitly rather than
      dropped.
pathophysiology:
- name: Serotonin Reuptake Inhibition During Antidepressant Treatment
  biological_scale: MOLECULAR
  description: >-
    The initiating exposure is blockade of the serotonin transporter by an SSRI,
    SNRI or tricyclic antidepressant, raising extracellular serotonin over weeks
    to years of treatment. This node is the shared trigger of every downstream
    arm; nothing about it is itself pathological, and the great majority of
    treated patients never develop the enduring syndrome. What distinguishes
    PSSD is that some consequence of this exposure fails to reverse when the
    drug is withdrawn.
  biological_processes:
  - preferred_term: serotonin uptake
    term:
      id: GO:0051610
      label: serotonin uptake
    modifier: DECREASED
  cell_types:
  - preferred_term: serotonergic neuron
    term:
      id: CL:0000850
      label: serotonergic neuron
  evidence:
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptom onset follows cessation of serotonergic antidepressants i.e.
      Selective Serotonin and Norepinephrine Reuptake Inhibitors (SSRI's,
      SNRI's), and Tricyclic antidepressants (TCA's).
    explanation: >-
      Establishes the exposure class that triggers the syndrome and fixes the
      temporal anchor at cessation rather than initiation.
  downstream:
  - target: 5-HT1A Receptor Desensitization and Serotonergic Tone Dysregulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - serotonergic_receptor_model
    description: >-
      Sustained reuptake blockade is the stimulus proposed to desensitize and
      downregulate 5-HT1A receptors.
  - target: Suppression of Brain Neurosteroidogenesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - neurosteroid_model
    description: >-
      Subchronic paroxetine alters brain neuroactive steroid levels and the
      expression of steroidogenic enzymes, with the negative effect on enzyme
      expression emerging at withdrawal.
  - target: Persistent Transcriptional Reprogramming of Reward Circuitry
    causal_link_type: DIRECT
    hypothesis_groups:
    - epigenetic_reward_circuit_model
    description: >-
      Treatment produces a large differential-expression response in the nucleus
      accumbens, a fraction of which is still detectable a month after the drug
      is stopped.
  - target: Genital Sensory Nerve Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Proposed disturbance of TRP ion channels on mechano-, thermo- and chemosensitive
      peripheral nerve endings; the route from transporter blockade to the peripheral
      nerve is not established.
    hypothesis_groups:
    - peripheral_neuropathy_model
    description: >-
      A peripheral arm in which the exposure damages or dysregulates genital
      sensory innervation directly, independently of central serotonergic
      adaptation.
- name: 5-HT1A Receptor Desensitization and Serotonergic Tone Dysregulation
  biological_scale: CELLULAR
  description: >-
    Prolonged reuptake blockade is proposed to desensitize and downregulate
    5-HT1A receptors, leaving serotonergic signalling maladapted once the drug
    is cleared. Because 5-HT1A activation is inhibitory to sexual function and
    interacts reciprocally with dopaminergic drive, an enduring shift in this
    receptor system provides a route from the exposure to loss of arousal and
    orgasmic capacity. No receptor-level measurement has been made in patients
    with PSSD; the node is inferred from symptom analysis and from the
    pharmacology of the drug class.
  biological_processes:

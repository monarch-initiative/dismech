    discriminating feature of the syndrome — it is the somatic sign used by the
    2022 criteria to separate PSSD from a depressive relapse, and it is not
    explained by mood. In the index laser-treated case, sensation was measurably
    recoverable, showing the deficit is not simply a report of altered
    subjective interest.

- name: Suppression of Central Sexual Arousal and Reward Signaling
  biological_scale: ORGANISM
  description: >-
    The convergence point of the three central arms. Whatever the upstream
    lesion — receptor desensitization, neurosteroid depletion, or persisting
    transcriptional reprogramming — the shared output is loss of sexual desire,
    arousal and orgasmic pleasure, together with the non-sexual reward deficits
    (anhedonia, emotional blunting) that accompany them. Modelling this as one
    node rather than three parallel outputs reflects that the clinical
    presentation does not discriminate between the arms, which is precisely why
    the mechanism remains unresolved.
  cell_types:

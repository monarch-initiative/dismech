- name: Pre-natal or pre-teen exposure
  influences_mechanisms:
  - target: Enduring Post-Discontinuation Sexual Dysfunction
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as modulating rather than triggering because this exposure is
      not a separate cause of the syndrome; it is the same drug exposure
      occurring in a developmental window, and what it changes is the form the
      enduring state takes. The consensus criteria give that form its own
      name, which is why the link points at the enduring-dysfunction node
      rather than at the molecular one. The rodent item is carried alongside
      the human one rather than alone, since a model-organism result should
      not stand by itself behind a human claim.
    evidence:
    - reference: PMID:34719438
      reference_title: "Diagnostic criteria for enduring sexual dysfunction after treatment with antidepressants, finasteride and isotretinoin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A new term, post-SSRI asexuality, is introduced to describe a dampening of sexual interest and pleasure resulting from a pre-natal or pre-teen exposure to a serotonin reuptake inhibitor."
      explanation: >-
        Introduces a separate term for the presentation following exposure
        before or around puberty, which is the modification of the enduring
        state this link records.
    - reference: PMID:29463440
      reference_title: "Post-SSRI Sexual Dysfunction: Preclinical to Clinical. Is It Fact or Fiction?"
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Although the persistent effects of SSRIs on sexuality have been little studied in humans, animal studies suggest that SSRIs might cause permanent sexual dysfunction after ending SSRI exposure at a young age but not in adulthood in rats."
      explanation: >-
        Rat work reporting permanent dysfunction after exposure at a young age
        but not in adulthood. Converges on the same age-of-exposure window
        from an animal model, so it supports the claim without establishing it
        in humans.
  description: >-
    Exposure before or around puberty is proposed to produce a distinct
    presentation — a dampening of sexual interest and pleasure without a
    remembered pre-drug baseline — for which the consensus criteria introduce
    the separate term post-SSRI asexuality. Rodent work independently reports
    that enduring dysfunction follows exposure at a young age but not in
    adulthood.

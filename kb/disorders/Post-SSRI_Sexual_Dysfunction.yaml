- name: Enduring Post-Discontinuation Sexual Dysfunction
  biological_scale: ORGANISM
  description: >-
    The defining clinical state: sexual dysfunction that continues, or first
    appears, after the serotonergic antidepressant has been stopped, and does
    not resolve with time. Duration is open-ended — the longest case in the
    Netherlands pharmacovigilance series had lasted 23 years — and roughly a
    third of surveyed patients report no improvement or worsening after
    discontinuation. Secondary consequences include relationship breakdown and
    a severely impaired quality of life.
  evidence:
  - reference: PMID:34791958
    reference_title: "Persistent sexual dysfunction after SSRI withdrawal: a scoping review and presentation of 86 cases from the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The longest case being a patient with PSSD for 23 years.
    explanation: >-
      Documents the open-ended duration that distinguishes the enduring syndrome
      from a transient discontinuation effect.
  - reference: PMID:29733030
    reference_title: "Enduring sexual dysfunction after treatment with antidepressants, 5α-reductase inhibitors and isotretinoin: 300 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Secondary consequences included relationship breakdown and impaired
      quality of life.
    explanation: >-
      Records the downstream personal and functional consequences of the
      enduring state.
- name: Emotional Blunting and Anhedonia
  biological_scale: ORGANISM
  description: >-
    Non-sexual ancillary features — emotional blunting, anhedonia, apathy and
    cognitive impairment — accompany the sexual phenotype in a substantial share
    of cases and are part of the consensus criteria. They are mechanistically
    informative because they point at the reward circuitry rather than at the
    genital periphery, and they are the component least likely to respond to
    peripheral-directed treatment.

epidemiology:
- name: Occurrence estimates are structurally hard to obtain
  description: >-
    The order-of-magnitude disagreement between the estimates above is itself the
    epidemiological finding. Ascertainment is obstructed by patient embarrassment,
    clinician response, inability to stop the antidepressant because of withdrawal
    effects, and patient unawareness that the symptoms are drug-related; there is
    no agreed study design. A MedDRA code now exists but has not been adopted by
    regulators, so routine pharmacovigilance does not count the condition.
  evidence:
  - reference: PMID:39289881
    reference_title: "Post-SSRI sexual dysfunction: barriers to quantifying incidence and prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A number of obstacles to quantifying the occurrence of PSSD are outlined
      including difficulty in designing a suitable study method.
    explanation: >-
      States the methodological barrier underlying the divergent prevalence
      estimates curated above.
  - reference: PMID:39289881
    reference_title: "Post-SSRI sexual dysfunction: barriers to quantifying incidence and prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A MedDRA code for PSSD has also been introduced, but this is yet to be
      adopted by regulators.
    explanation: >-
      Explains why routine pharmacovigilance data cannot yet supply an incidence
      denominator.
- name: Course after discontinuation
  description: >-
    Symptoms do not reliably remit when the drug is stopped: in an international
    survey of 239 affected respondents, 45% improved but 37% were unchanged or
    worse. Review-level synthesis reports persistence beyond six months in up to
    74% of affected cohorts. Quality-of-life impact is severe.
  evidence:
  - reference: PMID:34366299
    reference_title: Characterizing post-SSRI sexual dysfunction and its impact on quality of life through an international online survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall severity of symptoms improved for 45% and worsened or remained
      the same for 37% of respondents after discontinuing treatment with
      serotonin reuptake inhibitors.
    explanation: >-
      Quantifies the proportion with no improvement after discontinuation, the
      feature that defines the enduring syndrome.
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalence estimates suggest persistent symptoms in up to 74% of affected
      cohorts beyond 6 months.
    explanation: >-
      Review-level estimate of symptom persistence beyond six months within
      affected cohorts (a persistence figure, not a population prevalence).
  - reference: PMID:34366299
    reference_title: Characterizing post-SSRI sexual dysfunction and its impact on quality of life through an international online survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority rated the effect of PSSD on their quality of life as
      extremely negative (59%) or very negative (23%).
    explanation: >-
      Documents the severity of functional impact.
- name: Under-recognition and absent pre-treatment counselling
  description: >-
    Only 12% of affected survey respondents recalled being counselled about
    potential sexual side effects while taking antidepressants, and the condition
    remains under-recognised despite EMA acknowledgement — a gap that bears
    directly on informed consent.
  evidence:
  - reference: PMID:34366299
    reference_title: Characterizing post-SSRI sexual dysfunction and its impact on quality of life through an international online survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 12% of respondents reported being counseled regarding potential
      sexual dysfunction while taking antidepressants.
    explanation: >-
      Quantifies the pre-treatment counselling gap.
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite recent warnings from regulatory bodies like the EMA, PSSD remains
      under-recognized.
    explanation: >-
      States persistent under-recognition despite regulatory acknowledgement.
diagnosis:
- name: Consensus diagnostic criteria for enduring sexual dysfunction (2022)
  description: >-
    PSSD is a clinical diagnosis. Multidisciplinary consensus criteria published
    in 2022 cover PSSD alongside its siblings — persistent genital arousal
    disorder following serotonin reuptake inhibitors, post-finasteride syndrome
    and post-retinoid sexual dysfunction — and were built on the two largest
    published case series. The shared core is decreased genital and orgasmic
    sensation, decreased sexual desire and erectile dysfunction, with emotional
    blunting and cognitive impairment as ancillary features. Genital numbness is
    the somatic discriminator against depressive relapse. In practice the
    diagnosis is one of exclusion of other causes of sexual dysfunction.
  diagnosis_term:
    preferred_term: clinical diagnostic assessment against consensus criteria
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:34719438
    reference_title: Diagnostic criteria for enduring sexual dysfunction after treatment with antidepressants, finasteride and isotretinoin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of PSSD, PFS and PRSD commonly include decreased genital and
      orgasmic sensation, decreased sexual desire and erectile dysfunction.
    explanation: >-
      States the shared diagnostic core of the enduring post-drug sexual
      syndromes.
  - reference: PMID:34719438
    reference_title: Diagnostic criteria for enduring sexual dysfunction after treatment with antidepressants, finasteride and isotretinoin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To develop diagnostic criteria for post-SSRI sexual dysfunction (PSSD),
      persistent genital arousal disorder (PGAD) following serotonin reuptake
      inhibitors, post-finasteride syndrome (PFS) and post-retinoid sexual
      dysfunction (PRSD).
    explanation: >-
      Defines the scope of the criteria set and the family of conditions it
      covers.
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PSSD is achieved by excluding all other etiologies of
      sexual-dysfunction.
    explanation: >-
      Records that the diagnosis is one of exclusion, with no confirmatory test.
differential_diagnoses:
- name: Depressive relapse or residual depression
  description: >-
    The principal differential, and the one with the greatest potential for
    harm if mistaken, because it leads to reinstatement of the implicated drug.
  distinguishing_features:
  - Genital numbness and other somatic sensory changes are not features of depression
    and are used by the 2022 criteria to discriminate the two.
  - Symptoms in PSSD persist after the antidepressant has been stopped rather than
    tracking mood.
  evidence:
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is clinical, based on 2022 standardized criteria, distinguishing
      PSSD from depressive relapse by specific somatic symptoms like genital
      numbness.
    explanation: >-
      States the discriminating feature between PSSD and depressive relapse.
- name: Post-finasteride syndrome
  description: >-
    Enduring sexual dysfunction after 5-alpha-reductase inhibitor exposure,
    which shares much of the PSSD symptom profile and is proposed to share
    neuroactive-steroid mechanisms.
  distinguishing_features:
  - Distinguished by drug exposure history (finasteride or dutasteride rather than
    a serotonergic antidepressant).
  - Premature ejaculation and persistent genital arousal disorder are reported as
    specific to the antidepressant-exposed group.
  evidence:
  - reference: PMID:29733030
    reference_title: "Enduring sexual dysfunction after treatment with antidepressants, 5α-reductase inhibitors and isotretinoin: 300 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While reports of certain issues were unique to the antidepressants, such
      as the onset of premature ejaculation and persistent genital arousal
      disorder (PGAD), there was also a significant overlap in symptom profile
      between the drug groups
    explanation: >-
      Establishes both the overlap that makes these a differential and the
      features that separate them.
- name: Post-retinoid sexual dysfunction
  description: >-
    Enduring sexual dysfunction following isotretinoin, the third member of the
    enduring post-drug sexual syndrome family covered by the same 2022 criteria.
  distinguishing_features:
  - Distinguished by isotretinoin exposure history.
  - The consensus criteria treat it as a separate condition with its own criteria
    set despite the overlapping core features.
  evidence:
  - reference: PMID:34719438
    reference_title: Diagnostic criteria for enduring sexual dysfunction after treatment with antidepressants, finasteride and isotretinoin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To develop diagnostic criteria for post-SSRI sexual dysfunction (PSSD),
      persistent genital arousal disorder (PGAD) following serotonin reuptake
      inhibitors, post-finasteride syndrome (PFS) and post-retinoid sexual
      dysfunction (PRSD).
    explanation: >-
      Enumerates the related conditions from which PSSD must be separated by
      exposure history.
treatments:
- name: Vortioxetine
  description: >-
    A multimodal antidepressant used off-label on the rationale of shifting the
    central serotonin/dopamine ratio without itself causing sexual dysfunction.
    In a 13-patient retrospective open-label series that excluded patients with
    major depressive disorder or psychotic symptoms a priori, most patients
    treated with vortioxetine and/or nutraceuticals improved across all IIEF-5
    domains at 12 months. This is the strongest treatment signal available and
    it is still an uncontrolled cohort of thirteen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vortioxetine
      term:
        id: CHEBI:76016
        label: vortioxetine
  target_mechanisms:
  - target: Suppression of Central Sexual Arousal and Reward Signaling
    treatment_effect: INHIBITS
    description: >-
      Intended to restore the serotonin/dopamine balance at the central
      convergence node rather than to act on the genital periphery.
  evidence:
  - reference: PMID:36135826
    reference_title: "Cutting the First Turf to Heal Post-SSRI Sexual Dysfunction: A Male Retrospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients, after treatment with vortioxetine and/or nutraceuticals,
      reported a significant improvement in all International Index of Erectile
      Function-(IIEF-5) domains (p < 0.05) from baseline (T0) to 12-month
      follow-up (T1).
    explanation: >-
      The primary efficacy observation, from a small retrospective open-label
      cohort.
  - reference: PMID:36135826
    reference_title: "Cutting the First Turf to Heal Post-SSRI Sexual Dysfunction: A Male Retrospective Cohort Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although our data come from a retrospective open-label study with a small
      sample size, drugs positively modulating the central nervous system
      serotonin/dopamine ratio, such as vortioxetine, could be used to
      potentially improve PSSD.
    explanation: >-
      The authors' own limitation statement; recorded as PARTIAL so the entry
      does not overstate an uncontrolled result.
- name: Bupropion
  description: >-
    A norepinephrine-dopamine reuptake inhibitor used off-label on the same
    dopamine/serotonin-ratio rationale as vortioxetine. Reported as a strategy
    rather than as a drug with its own efficacy data in PSSD.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bupropion
      term:
        id: CHEBI:3219
        label: bupropion
  target_mechanisms:
  - target: Suppression of Central Sexual Arousal and Reward Signaling
    treatment_effect: INHIBITS
    description: >-
      Increases central dopaminergic tone at the convergence node, the
      pharmacological counterpart of the reward-circuit arm of the mechanism.
  evidence:
  - reference: PMID:36135826
    reference_title: "Cutting the First Turf to Heal Post-SSRI Sexual Dysfunction: A Male Retrospective Cohort Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To treat PSSD, we decided to use drugs positively affecting the brain
      dopamine/serotonin ratio, such as bupropion and vortioxetine, as well as
      other compounds.
    explanation: >-
      Documents bupropion as one of the agents chosen on mechanistic grounds;
      PARTIAL because the reported outcome data attach to vortioxetine and
      nutraceuticals rather than to bupropion specifically.
- name: Low-power laser irradiation of the genitalia
  description: >-
    Photobiomodulation applied to the penis, reported in a single case of
    paroxetine-induced persistent penile anesthesia. After 20 sessions the
    patient regained partial touch and temperature sensation, while
    anejaculation and erectile difficulty were unchanged — a within-patient
    dissociation that maps onto the peripheral versus central split in the
    mechanism model.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: low-power laser irradiation
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Genital Sensory Nerve Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Directed at the peripheral sensory arm; the proposed substrate is TRP ion
      channels on genital mechano- and thermosensitive nerve endings.
  evidence:
  - reference: PMID:25483212
    reference_title: "Penile anesthesia in Post SSRI Sexual Dysfunction (PSSD) responds to low-power laser irradiation: a case study and hypothesis about the role of transient receptor potential (TRP) ion channels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 20 LPLI-treatment sessions of 15min each, patient reported partial
      return of penile touch and temperature sensation.
    explanation: >-
      Single-case efficacy observation for the sensory component.
  - reference: PMID:25483212
    reference_title: "Penile anesthesia in Post SSRI Sexual Dysfunction (PSSD) responds to low-power laser irradiation: a case study and hypothesis about the role of transient receptor potential (TRP) ion channels."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, anejaculation and erectile difficulties remained unchanged.
    explanation: >-
      Explicit non-response of the non-sensory components, which is why this is
      curated as a partial, peripherally targeted intervention.
- name: Peripheral genital neuromodulation
  description: >-
    High-frequency electrical stimulation combined with low-intensity
    extracorporeal shock wave therapy directed at the peripheral nerves of the
    genitalia, given over 16 weeks in three men with post-drug syndrome. All
    three showed mild to moderate improvement in erectile function, penile
    sensitivity and nocturnal erections; central symptoms did not change and
    patients remained profoundly affected.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: peripheral nerve neuromodulation of the genitalia
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Genital Sensory Nerve Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Targets the peripheral arm directly; the persistence of central symptoms
      under this treatment is the main clinical evidence that the two arms are
      separable.
  evidence:
  - reference: PMID:39934554
    reference_title: "Insights into the peripheral nature of persistent sexual dysfunction associated with post-finasteride, post-SSRI and post-accutane syndromes: lessons learned from a case study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild-moderate erectile function improvement, mild penile sensitivity
      improvement, and mild nocturnal erection improvement were seen across all
      three patients.
    explanation: >-
      Outcome of the 16-week peripheral neuromodulation protocol in all three
      treated patients.
  - reference: PMID:39934554
    reference_title: "Insights into the peripheral nature of persistent sexual dysfunction associated with post-finasteride, post-SSRI and post-accutane syndromes: lessons learned from a case study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, patients were still profoundly affected by their symptoms
      post-treatment and thus there is an urgent need for additional research on
      this syndrome.
    explanation: >-
      Records the limited magnitude of benefit alongside the positive signal.
- name: Prescribing counselling and pharmacovigilance
  description: >-
    In the absence of any approved treatment, the actionable interventions are
    pre-treatment counselling about the risk of persistent sexual dysfunction —
    recalled by only 12% of affected patients — accurate recognition so that the
    implicated agent is not reinstated, and adverse-event reporting. Recognition
    matters therapeutically as well as epidemiologically: misdiagnosis as
    depressive relapse leads to re-exposure to the drug class that caused the
    syndrome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: patient counselling and supportive management
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Misdiagnosing this syndrome might lead to harmful treatments including
      reinstatement of medications which generated PSSD.
    explanation: >-
      States the specific harm avoided by correct recognition.
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSSD is a severe iatrogenic condition requiring heightened
      pharmacovigilance.
    explanation: >-
      Review-level conclusion that pharmacovigilance is the principal
      system-level response.
  - reference: PMID:34791958
    reference_title: "Persistent sexual dysfunction after SSRI withdrawal: a scoping review and presentation of 86 cases from the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Little is known about the mechanisms underlying PSSD and no effective
      treatment exists.
    explanation: >-
      Establishes the therapeutic vacuum that makes counselling and recognition
      the primary interventions.
discussions:
- discussion_id: pssd_mechanism_evidence_is_rodent_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Suppression of Brain Neurosteroidogenesis
  - pathophysiology#Persistent Transcriptional Reprogramming of Reward Circuitry
  prompt: >-
    Do the neurosteroidogenic and accumbal transcriptional changes seen after
    paroxetine withdrawal in male rats occur in people with PSSD?
  rationale: >-
    Both the neurosteroid arm and the epigenetic/transcriptional arm rest
    entirely on one laboratory's male-rat paroxetine model. The rats were not
    selected for, and cannot be shown to have, the human syndrome — no rodent
    readout of genital hypoesthesia or orgasmic anhedonia exists — so the model
    demonstrates that the drug leaves persistent central changes, not that those
    changes are what patients have. The authors themselves frame the extension
    to PSSD as a hypothesis. No neuroactive steroid measurement has been
    published in a PSSD patient cohort, and the paroxetine-specific, male-only,
    single-schedule design leaves open whether the finding generalises across
    the SSRI class or to women. Until a human measurement exists, the two arms
    should be read as mechanistically plausible rather than demonstrated.
  proposed_experiments:
  - experiment_id: exp_pssd_human_neurosteroid_profile
    name: Central versus systemic neuroactive steroid profiling in PSSD patients
    description: >-
      Measure cerebrospinal fluid and plasma neuroactive steroid profiles
      (allopregnanolone, pregnenolone, progesterone, dihydroprogesterone) in
      criteria-confirmed PSSD patients versus antidepressant-exposed recovered
      controls and never-exposed controls. The neurosteroid model predicts a
      central deficit with preserved plasma levels, which is the pattern seen in
      the rat; a matched CSF-plasma dissociation in patients would move the arm
      from plausible to demonstrated.
    supporting_outcome:
    - Reduced CSF but preserved plasma neuroactive steroid levels in PSSD cases relative
      to both control groups.
    refuting_outcome:
    - No CSF difference between PSSD cases and exposed-recovered controls.
  - experiment_id: exp_pssd_cross_ssri_withdrawal_transcriptomics
    name: Cross-SSRI and female replication of the withdrawal transcriptomic signature
    description: >-
      Replicate the nucleus accumbens withdrawal RNA-sequencing across several
      SSRIs and in female animals, to establish whether the persisting accumbal
      signature is class-wide or specific to paroxetine in males.
    supporting_outcome:
    - A shared persisting accumbal signature across agents and both sexes.
    refuting_outcome:
    - A signature confined to paroxetine-treated males.
  - experiment_id: exp_pssd_neurosteroid_therapeutic_trial
    name: Neurosteroid-directed therapeutic probe in PSSD
    description: >-
      Test whether a 5-alpha-reduced neurosteroid or neurosteroid-based agent
      changes symptoms in criteria-confirmed PSSD, converting the mechanistic
      hypothesis into a falsifiable therapeutic prediction.
    supporting_outcome:
    - Symptom improvement exceeding placebo on genital sensory and desire measures.
    refuting_outcome:
    - No separation from placebo.
  evidence:
  - reference: PMID:34325207
    reference_title: Effects of paroxetine treatment and its withdrawal on neurosteroidogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, it is possible to hypothesize that altered neurosteroidogenesis
      may also occur in PSSD and consequently it may represent a possible
      pharmacological target for this disorder.
    explanation: >-
      The extension from rat to human is stated by the authors as a hypothesis,
      which is exactly the mismatch recorded here.
  - reference: PMID:42430418
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): A comprehensive review of epidemiology, pathophysiology, and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future research must prioritize biomarker identification and prospective
      trials for targeted neurosteroid therapies.
    explanation: >-
      The review's own research agenda names biomarker identification and
      prospective neurosteroid trials, the two steps that would close this gap.
- discussion_id: pssd_causal_attribution_controversy
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Enduring Post-Discontinuation Sexual Dysfunction
  prompt: >-
    Is PSSD an established drug-induced disease entity, given that no prospective
    randomised evidence exists and the clinical literature is built on case
    reports, spontaneous reports and online-community surveys?
  rationale: >-
    The evidential asymmetry is unusual and worth stating plainly. On one side,
    a 2018 review concluded the available clinical information could not settle
    whether PSSD exists; the human literature is dominated by self-selected
    online cohorts and spontaneous pharmacovigilance reports, both susceptible
    to selection and recall bias, and no prospective randomised study has ever
    been done. On the other, the European Medicines Agency has concluded that
    the condition persists after discontinuation, consensus diagnostic criteria
    and a MedDRA code exist, and a retrospective cohort with an internal control
    group found the erectile-dysfunction association survives adjustment for
    depression and anxiety — the most direct available test of the
    confounding-by-indication objection. This entry curates PSSD as a disease on
    the strength of the latter while recording that the effect size and its
    determinants are not established.
  evidence:
  - reference: PMID:29463440
    reference_title: "Post-SSRI Sexual Dysfunction: Preclinical to Clinical. Is It Fact or Fiction?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are no prospective randomized controlled trials in humans and the
      present evidence is derived from case reports, incidental research
      findings, and experiences of some internet communities.
    explanation: >-
      States the evidential weakness on the skeptical side of the controversy.
  - reference: PMID:34627736
    reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSSD gained official recognition after the European medical agency
      concluded that PSSD is a medical condition that persists after
      discontinuation of SSRI's and SNRI's.
    explanation: >-
      Records the regulatory recognition on the affirmative side.
  - reference: PMID:37085865
    reference_title: Estimating the risk of irreversible post-SSRI sexual dysfunction (PSSD) due to serotonergic antidepressants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which remained significant after adjusting for age, SES, BMI, depression
      and anxiety
    explanation: >-
      The cohort-level test of confounding by indication, the strongest
      non-anecdotal support for a drug-attributable effect.
- discussion_id: pssd_no_biomarker_or_case_definition_denominator
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Enduring Post-Discontinuation Sexual Dysfunction
  prompt: >-
    What is the true incidence of PSSD, and is there any objective marker that
    could identify cases without relying on self-report?
  rationale: >-
    Published occurrence estimates span three orders of magnitude — 4.3 per
    100,000 in the general population of an Israeli HMO cohort, 0.46% among
    treated males in the same cohort, and 13.2% self-reported genital
    hypoesthesia among past antidepressant users in a North American survey —
    because they measure different things with different ascertainment. Closing
    the gap requires both an objective marker (none exists; corneal confocal
    microscopy is the only objective abnormality so far reported, in two
    patients) and regulator adoption of the existing MedDRA code so routine
    pharmacovigilance can produce a denominator.
  proposed_experiments:
  - experiment_id: exp_pssd_prospective_incidence_cohort
    name: Prospective pre-post antidepressant sensory and sexual-function cohort
    description: >-
      Measure genital sensory thresholds by quantitative sensory testing and
      validated sexual-function instruments before antidepressant initiation,
      during treatment, and at fixed intervals after discontinuation. This is
      the design that would supply an incidence estimate immune to the recall
      and selection biases that dominate the current literature.
    supporting_outcome:
    - A measurable subgroup with sensory thresholds that fail to return to pre-treatment
      baseline after discontinuation.
    refuting_outcome:
    - Return of thresholds to baseline in all participants after discontinuation.
  - experiment_id: exp_pssd_small_fibre_biomarker
    name: Small-fibre and corneal confocal biomarker evaluation in a PSSD cohort
    description: >-
      Evaluate corneal confocal microscopy and other small-fibre measures in a
      criteria-confirmed PSSD cohort versus antidepressant-exposed recovered
      and never-exposed controls, to test whether the peripheral abnormality
      reported in two patients is reproducible and case-defining.
    supporting_outcome:
    - Reduced corneal nerve fibre density in PSSD cases versus both control groups.
    refuting_outcome:
    - No difference between PSSD cases and exposed-recovered controls.
  evidence:
  - reference: PMID:39289881
    reference_title: "Post-SSRI sexual dysfunction: barriers to quantifying incidence and prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A MedDRA code for PSSD has also been introduced, but this is yet to be
      adopted by regulators.
    explanation: >-
      Identifies the specific administrative step blocking a routine
      pharmacovigilance denominator.
  - reference: PMID:39934554
    reference_title: "Insights into the peripheral nature of persistent sexual dysfunction associated with post-finasteride, post-SSRI and post-accutane syndromes: lessons learned from a case study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral neuropathy was noted in two patients via corneal confocal
      microscopy, however central symptoms remain.
    explanation: >-
      The only objective abnormality so far reported, in two patients — the
      starting point for, not the answer to, a biomarker programme.
- discussion_id: pssd_male_skewed_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Enduring Post-Discontinuation Sexual Dysfunction
  - pathophysiology#Genital Hypoesthesia
  prompt: >-
    Does PSSD present, and does it arise at the same rate, in women — and are
    the mechanisms curated here, derived almost entirely from male cohorts and
    male rats, the mechanisms of the female syndrome?
  rationale: >-
    The condition is described as affecting both sexes, but almost the entire
    evidence base cited in this entry is male. The largest cohort estimate of
    irreversible dysfunction (Ben-Sheetrit et al.) was built from
    phosphodiesterase-5-inhibitor prescriptions and explicitly excluded females;
    the peripheral-nerve, penile-sensitivity and shock-wave/neuromodulation
    reports are male case material; and the neurosteroid and accumbal
    transcriptomic work is male-rat only (see
    pssd_mechanism_evidence_is_rodent_only). Ascertainment compounds this: the
    presenting complaint differs by sex — men frame it as erectile dysfunction,
    women as loss of libido — so a case definition and an outcome measure built
    around erectile and penile-sensory endpoints will systematically
    under-detect affected women. Every quantitative and mechanistic claim in
    this entry should therefore be read as established for men and unverified
    for women, and the sex breakdown of any cohort should be stated when this
    entry is updated.
  proposed_experiments:
  - experiment_id: exp_pssd_sex_stratified_cohort
    name: Sex-stratified PSSD cohort with sex-neutral outcome measures
    description: >-
      Ascertain criteria-confirmed PSSD cases prospectively using
      genital-sensory and orgasm-quality endpoints applicable to both sexes
      (rather than erectile function or PDE5-inhibitor prescribing), and report
      incidence, symptom profile and any biomarker result stratified by sex.
    supporting_outcome:
    - Comparable incidence and symptom profile in women once sex-neutral endpoints
      are used, indicating the male skew is an ascertainment artefact.
    refuting_outcome:
    - A genuinely lower incidence or a materially different symptom profile in women
      under sex-neutral ascertainment.
  evidence:
  - reference: PMID:39289881
    reference_title: "Post-SSRI sexual dysfunction: barriers to quantifying incidence and prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It affects all ages, both sexes and all ethnic groups
    explanation: >-
      States that the condition is not male-specific, which is what makes the
      male skew of the cited evidence a gap rather than a scope boundary.
  - reference: PMID:39289881

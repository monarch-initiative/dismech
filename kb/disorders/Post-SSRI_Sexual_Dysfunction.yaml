  influences_mechanisms:
  - target: Serotonin Reuptake Inhibition During Antidepressant Treatment
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure and the node are the same event described from two sides:
      this node is transporter blockade during treatment, and the exposure is
      the drug that produces it. There is nothing between them, which makes
      this the clearest direct link in the tranche. Note that the disorder is
      anchored to cessation rather than to initiation, so this node is the
      antecedent state and not the disease.
    evidence:
    - reference: PMID:34627736
      reference_title: "Post-SSRI Sexual Dysfunction (PSSD): Biological Plausibility, Symptoms, Diagnosis, and Presumed Risk Factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Symptom onset follows cessation of serotonergic antidepressants i.e. Selective Serotonin and Norepinephrine Reuptake Inhibitors (SSRI's, SNRI's), and Tricyclic antidepressants (TCA's)."
      explanation: >-
        Names the three drug classes and states that symptom onset follows
        their cessation, which fixes both the exposure at this node and the
        temporal anchor of the syndrome downstream.

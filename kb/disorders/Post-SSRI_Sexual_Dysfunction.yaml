- name: Persistent Transcriptional Reprogramming of Reward Circuitry
  biological_scale: CELLULAR
  description: >-
    Paroxetine produces a large transcriptional response in the nucleus
    accumbens (245 differentially expressed genes during treatment), involving
    dopaminergic, glutamatergic and GABAergic genes together with
    neurexin/neuroligin and BDNF signalling, plus an inflammatory and
    immune-activation signature. A residue of that response — six genes at one
    month of withdrawal — is still present after the drug is gone. The
    persistence, not the magnitude, is the mechanistically relevant observation:
    it supplies a substrate by which a finite exposure could leave an open-ended
    deficit in reward processing.

discussions:
- discussion_id: gap_pssd_mechanism_and_biomarkers
  prompt: >
    What is the primary molecular driver of persistent PSSD after SSRI
    cessation, and which biomarkers can objectively distinguish it from
    depressive relapse and predict response to candidate therapies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#5-HT1A Receptor Desensitization
  - pathophysiology#Neurosteroid (Allopregnanolone) Depletion
  - pathophysiology#Epigenetic Silencing of Dopaminergic Reward Circuits
  rationale: >
    The review states that the pathophysiology of PSSD is multifactorial and
    incompletely understood, invoking 5-HT1A receptor desensitization,
    allopregnanolone depletion via 5-alpha-reductase inhibition, and epigenetic
    silencing of dopaminergic reward circuits without establishing which is the
    dominant driver or how they interact. Diagnosis remains clinical, there are
    no validated biomarkers, and no FDA-approved treatment exists, so the causal
    ordering and objective diagnostic markers are the key open questions.
  proposed_experiments:
  - experiment_id: exp_pssd_prospective_multiomic_biomarker_cohort
    name: Prospective multi-omic biomarker cohort of post-SSRI patients
    description: >
      Enroll patients discontinuing SSRIs, stratify by emergence and persistence
      of sexual dysfunction using the 2022 standardized criteria, and
      longitudinally profile neurosteroid levels (including allopregnanolone),
      serotonergic and dopaminergic signaling markers, DNA methylation of
      reward-circuit genes, and quantitative genital sensory testing, alongside
      matched controls with depressive relapse, to identify markers that
      separate PSSD from relapse and order the candidate mechanisms.
    experiment_type:
      preferred_term: prospective biomarker cohort study
    model_systems:
    - name: Human post-SSRI discontinuation cohort
      description: >
        Patient cohort designed to temporally relate neurosteroid,
        serotonergic, dopaminergic, and epigenetic readouts to persistent PSSD
        symptoms and to depressive relapse controls.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    decision_criterion: >
      A mechanism is supported if its molecular readout is specifically altered
      in persistent-PSSD patients relative to both recovered and depressive-relapse
      controls and quantitatively tracks symptom severity over time.
    would_support:
    - pathophysiology#5-HT1A Receptor Desensitization
    - pathophysiology#Neurosteroid (Allopregnanolone) Depletion
    - pathophysiology#Epigenetic Silencing of Dopaminergic Reward Circuits
  evidence:
  - reference: PMID:42430418
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Future research must prioritize biomarker identification and prospective trials for targeted neurosteroid therapies."
    explanation: >-
      Review explicitly identifies biomarker identification and prospective
      therapeutic trials as the priority research gaps for PSSD.

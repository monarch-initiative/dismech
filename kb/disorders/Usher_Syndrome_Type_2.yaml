  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in one of three genes – ADGRV1, USH2A, or WHRN – establishes the diagnosis if clinical features are inconclusive."
    explanation: Confirms WHRN as one of the three established type-2 genes.
pathophysiology:
- name: Ankle-Link Complex Assembly Failure
  description: >-
    Biallelic loss of usherin, ADGRV1 or whirlin prevents assembly of the
    ankle-link complex at the ankle region of developing stereocilia. Whirlin and
    PDZD7 heterodimerize and orchestrate usherin and ADGRV1 into the complex
    through liquid-liquid phase separation; both scaffolds are required, and the
    whirlin-PDZD7 interaction is the bridge between usherin and ADGRV1.

    This is a transient developmental assembly, not the mature tension-bearing
    complex that carries the type-1 mechanism.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Developing Hair Bundle Ankle-Link Loss
    description: >-
      Without the quaternary complex, ankle links do not form at the ankle region
      of developing stereocilia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36964137
      reference_title: Temporal and spatial assembly of inner ear hair cell ankle link condensate through phase separation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Disruption of the ALC multivalency for LLPS largely abolishes the distribution of WHRN at the ankle region of stereocilia."
      explanation: Shows that disrupting complex assembly removes the scaffold from the ankle region.
  - target: Photoreceptor Periciliary Membrane Complex Disruption
    description: >-
      The same proteins form the periciliary membrane complex in photoreceptors,
      so the retinal branch is a parallel consequence of the same lesion rather
      than a sequel to the cochlear one.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24239741
      reference_title: "Usher protein functions in hair cells and photoreceptors."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Recent evidence linking photoreceptor cell dysfunction in the shaker 1 mouse model for Usher syndrome to light-induced protein translocation defects, combined with localization of an Usher protein interactome at the periciliary region of the photoreceptors suggests Usher proteins might regulate protein trafficking between the inner and outer segments of photoreceptors."
      explanation: Locates an Usher protein interactome at the photoreceptor periciliary region.
  evidence:
  - reference: PMID:36964137
    reference_title: Temporal and spatial assembly of inner ear hair cell ankle link condensate through phase separation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that WHRN and PDZD7 orchestrate ADGRV1 and USH2A to assemble the ALC through liquid-liquid phase separation (LLPS)."
    explanation: Establishes the composition and assembly mechanism of the ankle-link complex that defines this entity.
  - reference: PMID:25406310
    reference_title: Whirlin and PDZ domain-containing 7 (PDZD7) proteins are both required to form the quaternary protein complex associated with Usher syndrome type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, both WHRN and PDZD7 are required for the complex formation with USH2A and GPR98."
    explanation: Establishes that both scaffolds are required for the quaternary complex.
- name: Developing Hair Bundle Ankle-Link Loss
  description: >-
    Ankle links interconnect the ankle region of developing stereocilia and are
    essential for stereocilia development. Their absence disturbs bundle
    development, but because the complex is transient and is not the mature
    tension-bearing element, the resulting transduction deficit is partial rather
    than complete - the clinical correlate being a sloping loss that is worse at
    high frequencies, with vestibular function usually preserved.
  biological_scale: TISSUE
  locations:
  - preferred_term: spiral organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  biological_processes:
  - preferred_term: mechanoreceptor differentiation
    term:
      id: GO:0042490
      label: mechanoreceptor differentiation
    modifier: ABNORMAL
  downstream:
  - target: Hair Cell Mechanotransduction Failure
    description: >-
      Disturbed bundle development impairs mechanotransduction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33193648
      reference_title: "Usher Syndrome: Genetics and Molecular Links of Hearing Loss and Directions for Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Disease-causing mutations in USH genes can destabilize the tip links that bind the stereocilia to each other, and cause defects in protein trafficking and stereocilia bundle morphology, thereby inhibiting mechanosensory transduction."
      explanation: >-
        Links stereocilia bundle morphology defects to inhibited mechanosensory
        transduction. Quoted for the bundle-morphology clause; the tip-link clause
        in the same sentence describes the type-1 mechanism, not this one.
  evidence:
  - reference: PMID:36964137
    reference_title: Temporal and spatial assembly of inner ear hair cell ankle link condensate through phase separation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ankle links connect the ankle region of developing stereocilia, playing an essential role in stereocilia development."
    explanation: States the developmental role and transient location of the structure lost in this entity.
- name: Hair Cell Mechanotransduction Failure

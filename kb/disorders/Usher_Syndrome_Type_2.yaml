- name: Photoreceptor Periciliary Membrane Complex Disruption
  description: >-
    Usherin, ADGRV1 and whirlin localize to the photoreceptor periciliary
    membrane compartment, a ciliary trafficking site at the base of the
    connecting cilium, where the interactome is implicated in protein trafficking
    between the inner and outer segments.

    This is the compartment the lumped entry's single "Photoreceptor Connecting
    Cilium Dysfunction" node described. It is correct for this entity and was not
    correct for types 1 and 3, which is one of the reasons the split was made.
  biological_scale: CELLULAR

name: Usher Syndrome Type 2
creation_date: "2026-09-24T00:00:00Z"
category: Mendelian
synonyms:
- USH2
- Usher syndrome type II
- Usher syndrome type 2
description: >
  Usher syndrome type 2 is the mechanism entity in which biallelic loss of a
  component of the ankle-link complex - usherin (USH2A), ADGRV1/VLGR1, and
  whirlin (WHRN), with PDZD7 as a modifier - produces sloping congenital
  sensorineural hearing loss, generally intact vestibular function, and
  later-onset retinitis pigmentosa.

  Two things separate this from Usher syndrome type 1, and both are structural
  rather than a matter of severity. First, the ankle-link complex is a TRANSIENT
  assembly of the DEVELOPING hair bundle - whirlin and PDZD7 orchestrate ADGRV1
  and usherin into a condensate by liquid-liquid phase separation, and ankle
  links are not present in mature stereocilia. The type-1 upper tip-link density
  is by contrast a tension-bearing complex of the mature bundle. The two are
  different assemblies acting in different developmental windows, which is why
  the auditory phenotype here is a sloping loss rather than the profound
  congenital loss of type 1, and why vestibular function is usually spared.

  Second, in the retina the type-2 proteins sit at the periciliary membrane
  compartment, a photoreceptor ciliary trafficking site. That is a different
  subcellular compartment from the calyceal-process adhesion belt that carries
  the type-1 retinal mechanism.

  Harmonin (USH1C) is annotated to both complexes. That is not an artifact:
  harmonin PDZ1 binds the C-terminal PDZ-binding motifs of both usherin and
  ADGRV1, so it is a deliberate physical bridge between the type-1 and type-2
  networks. It is curated as a type-1 gene because the tension-bearing tip-link
  role is the one whose loss gives the type-1 presentation.

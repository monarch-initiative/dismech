    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2 is inherited in an autosomal recessive manner. Each subsequent pregnancy of a couple who have had a child with Usher syndrome type II has a 25% chance of resulting in an affected child"
    explanation: Confirms the autosomal recessive inheritance and recurrence risk of type 2.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    A subset of type-2 disease shows digenic inheritance, in which a heterozygous
    PDZD7 variant contributes together with a variant in a second type-2 gene.
    PDZD7 also acts as a retinal disease modifier. This is curated on the type-2
    entity specifically because PDZD7 is a member of the ankle-link complex, and
    the reported digenic partners are ADGRV1 and USH2A.
  evidence:
  - reference: PMID:20440071
    reference_title: "PDZD7 is a modifier of retinal disease and a contributor to digenic Usher syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, heterozygous PDZD7 mutations were present in patients with
      truncating mutations in USH2A, G protein-coupled receptor 98 (GPR98; also
      known as USH2C), and an unidentified locus.
    explanation: >-
      A heterozygous truncating PDZD7 variant was found in patients who also
      carried mutations in a second type-2 gene, supporting a digenic contribution.

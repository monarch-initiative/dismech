      label: protein localization to cilium
    modifier: ABNORMAL
  downstream:
  - target: Photoreceptor Degeneration
    description: >-
      Impaired intersegmental trafficking and outer-segment maintenance are
      followed by progressive photoreceptor loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

diagnosis:
- name: Audiologic and retinal functional evaluation
  description: >-
    Establish the clinical phenotype with subjective and electrophysiologic
    hearing and retinal testing. A sloping congenital loss with intact vestibular
    responses is the type-2 pattern.
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of USH2 is established in a proband using electrophysiologic and subjective tests of hearing and retinal function."
    explanation: Establishes the clinical diagnostic route for type 2.
- name: Molecular genetic confirmation
  description: >-
    Identify biallelic pathogenic variants in one of the three type-2 genes.
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in one of three genes – ADGRV1, USH2A, or WHRN – establishes the diagnosis if clinical features are inconclusive."
    explanation: Establishes molecular confirmation for the three type-2 genes.
treatments:
- name: Hearing Aids
  description: >-
    Early hearing-aid fitting with speech training. Amplification rather than
    implantation is the usual first step here, because the type-2 loss is sloping
    and leaves useful low-frequency hearing.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid usage
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Early fitting of hearing aids and speech training."
    explanation: GeneReviews recommends early hearing-aid fitting and speech training for type 2.
- name: Low-Vision Rehabilitation and Psychosocial Support
  description: >-
    Orientation and adaptive-skills training as vision declines, with vocational
    rehabilitation and mental-health support.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinitis pigmentosa (RP); progressive, bilateral, symmetric retinal degeneration that begins with night blindness and constricted visual fields (tunnel vision) and eventually includes decreased central visual acuity"
    explanation: >-
      Establishes the progressive vision loss that low-vision rehabilitation
      addresses. The cited GeneReviews abstract does not itself state a low-vision
      rehabilitation recommendation for type 2, so this treatment is recorded on
      the disease course rather than on a quoted recommendation.
- name: Audiologic and Ophthalmologic Surveillance
  description: >-
    Annual multimodal retinal surveillance from age ten years, with audiologic
    follow-up for device users.
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual fundus photography, visual acuity, visual field, electroretinography, optical coherence tomography, and fundus autofluorescence from age ten years."
    explanation: Supports annual retinal surveillance from age ten in type 2.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal recessive recurrence risk, and in
    this entity also the possibility of a digenic PDZD7 contribution.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2 is inherited in an autosomal recessive manner. Each subsequent pregnancy of a couple who have had a child with Usher syndrome type II has a 25% chance of resulting in an affected child"
    explanation: Supports counseling for the autosomal recessive recurrence risk.
- name: Ultevursen (QR-421a)
  description: >-
    Investigational antisense oligonucleotide inducing skipping of USH2A exon 13,
    which carries the two recurrent pathogenic variants c.2299delG and c.2276G>T.
    Exon skipping is intended to produce a shortened usherin protein. Evaluated by
    intravitreal injection in the Phase 2b LUNA trial.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: USH2A
      term:
        id: hgnc:12601
        label: USH2A
    target_transcript: USH2A pre-mRNA
    target_exon: exon 13
  delivery_system:
    delivery_platform: UNFORMULATED
    targeting_ligand: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Ankle-Link Complex Assembly Failure
    treatment_effect: MODULATES
    description: >-
      In the USH2A exon-13 molecular subgroup, QR-421a induces exon 13 skipping
      upstream of the complex-assembly defect. This does not assert restored human
      complex function or clinical efficacy.
    evidence:
    - reference: PMID:33895329
      reference_title: Antisense oligonucleotide-based treatment of retinitis pigmentosa caused by USH2A exon 13 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lead candidate QR-421a induced a concentration-dependent exon 13 skipping in
        induced pluripotent stem cell (iPSC)-derived photoreceptor precursors from an
        Usher syndrome patient homozygous for the c.2299delG mutation.
      explanation: Supports splice modulation in patient-derived photoreceptor precursors, scoped to USH2A exon 13.
  evidence:
  - reference: PMID:33895329
    reference_title: Antisense oligonucleotide-based treatment of retinitis pigmentosa caused by USH2A exon 13 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lead candidate QR-421a induced a concentration-dependent exon 13 skipping in
      induced pluripotent stem cell (iPSC)-derived photoreceptor precursors from an
      Usher syndrome patient homozygous for the c.2299delG mutation.
    explanation: >-
      Patient-derived photoreceptor-precursor evidence supports QR-421a-mediated
      exon 13 skipping; it does not establish clinical efficacy.
  - reference: clinicaltrials:NCT06627179
    reference_title: A Two-Year Double-masked, Randomized, Sham-Controlled Study to Evaluate the Efficacy, Safety and Tolerability of Ultevursen in Subjects With Retinitis Pigmentosa (RP) Due to Mutations in Exon 13 of the USH2A Gene
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this Phase 2b study is to evaluate the safety and tolerability of ultevursen administered via intravitreal injection (IVT) in subjects with Retinitis Pigmentosa (RP) due to mutations in exon 13 of the USH2A gene.
    explanation: Registry record confirming Phase 2b evaluation, route, and molecular scope.

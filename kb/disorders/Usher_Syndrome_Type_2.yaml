animal_models:
- name: Pdzd7 interaction zebrafish model
  species: Zebrafish (Danio rerio)
  genotype: Pdzd7 knockdown alone and in combination with ush2a or gpr98 perturbation
  category: Knockdown interaction model
  description: >-
    Pdzd7 knockdown produces an Usher-like phenotype and worsens retinal cell
    death when combined with ush2a or gpr98 perturbation. It supports genetic
    interaction and retinal-modifier biology within the type-2 complex and does
    not reproduce the full human auditory-retinal disease.
  associated_phenotypes:
  - Retinal cell death
  modeled_mechanisms:
  - target: Photoreceptor Periciliary Membrane Complex Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      Knockdown in zebrafish is a developmental perturbation and does not
      establish the magnitude or clinical course of PDZD7 modification in humans.
    description: >-
      Combined perturbation changes retinal cell survival and Gpr98 localization
      near the photoreceptor connecting cilium.
    evidence:
    - reference: PMID:20440071
      reference_title: "PDZD7 is a modifier of retinal disease and a contributor to digenic Usher syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pdzd7 knockdown produced an Usher-like phenotype in zebrafish, exacerbated retinal cell death in combination with ush2a or gpr98, and reduced Gpr98 localization in the region of the photoreceptor connecting cilium."
      explanation: Supports the model's genetic-interaction and connecting-cilium readouts.
  evidence:
  - reference: PMID:20440071
    reference_title: "PDZD7 is a modifier of retinal disease and a contributor to digenic Usher syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We validated the human genotypes using zebrafish, and our findings were consistent with digenic inheritance of PDZD7 and GPR98, and with PDZD7 as a retinal disease modifier in patients with USH2A."
    explanation: Supports use of the zebrafish experiment to test digenic and modifier hypotheses.
review_notes: >-
  Created 2026-09-24 by splitting kb/disorders/Usher_Syndrome.yaml into four
  mechanism entities plus a grouping, per the decision recorded on issue #10822.

  The entity is defined by the ankle-link complex. The two facts that make it a
  distinct mechanism rather than a milder type 1 are that the complex is
  transient and developmental where the type-1 complex is mature and
  tension-bearing, and that its retinal counterpart is the periciliary membrane
  compartment rather than the calyceal-process adhesion belt.

  WHRN is held as a USH2D subtype rather than promoted, and the subtype
  description records that ClinGen curates it against a distinct MONDO term
  (MONDO:0012662) so that the decision is visible rather than flattened.

  PDZD7 is curated as a modifier in `genetic:` rather than as a fourth causative
  locus, which matches how the cited primary study frames it, even though it is a
  required structural member of the complex.

  The "Low-Vision Rehabilitation and Psychosocial Support" treatment carries
  evidence for the progressive vision loss it addresses rather than for the
  recommendation itself: the type-2 GeneReviews abstract does not state that
  recommendation, and the type-1 abstract that does cannot be quoted here without
  asserting it was said about type 2. The explanation says so rather than leaving
  the reader to assume a stronger source.

  Not curated here: the USH2A isolated-retinopathy branch (retinitis pigmentosa
  39). It is defined by ABSENT hearing loss, and FrequencyEnum has no excluded
  value until issue #10190 lands, so the subtype cannot state the thing that
  defines it. No per-entity prevalence is asserted: the 4-17 per 100,000 figure
  the lumped entry carried is for Usher syndrome as a whole, and the `Grouping`
  class has no prevalence slot, so that figure is carried in the grouping's prose.

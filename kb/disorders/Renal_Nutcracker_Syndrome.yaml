imaging_findings:
- name: Left renal vein stenosis exceeding 80% on CT or ultrasound
  modality: CT
  diagnostic: true
  description: >-
    Across the published literature the single most frequently used diagnostic
    parameter is a left renal vein stenosis of more than 80%, assessed by CT or
    duplex ultrasound. It is important that this is a most-frequently-used
    threshold rather than a validated one: the systematic review that identified
    it did so by counting practice across 14 studies, not by testing the
    threshold against an outcome.
  located_in:
    preferred_term: Left renal vein
    term:
      id: UBERON:0001142
      label: left renal vein
  evidence:
  - reference: PMID:36007798
    reference_title: "A systematic review on nutcracker syndrome and proposed diagnostic algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Computed tomography and ultrasound were the most commonly used imaging
      modalities, with a threshold for left renal vein stenosis of >80% the most
      frequently used diagnostic parameter.
    explanation: >-
      Establishes both the modality and the threshold, and - by the wording
      "most frequently used" - that this reflects prevailing practice rather
      than a validated cut-off.
- name: Renocaval pressure gradient at venography
  modality: OTHER
  diagnostic: true
  description: >-
    Direct venographic measurement of the pressure gradient between the left
    renal vein and the inferior vena cava. Position in the workup matters: the
    systematic review places this not as a first-line diagnostic test but as a
    requirement for any patient being considered for therapeutic intervention.
  located_in:
    preferred_term: Left renal vein
    term:
      id: UBERON:0001142
      label: left renal vein
  evidence:
  - reference: PMID:36007798
    reference_title: "A systematic review on nutcracker syndrome and proposed diagnostic algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Any patient considered for therapeutic intervention should also undergo
      diagnostic venography with measurement of the renocaval pressure gradient
    explanation: >-
      Places the renocaval gradient at the intervention-selection step rather
      than at initial diagnosis.
diagnosis:
- name: Stepwise diagnostic workup for nutcracker syndrome
  description: >-
    The recommended sequence is clinical assessment and exclusion of alternative
    causes, then duplex ultrasound in all patients with or without CT or MRI,
    then venography with renocaval pressure gradient and, where available,
    intravascular ultrasound in anyone being considered for intervention.
    Exclusion of alternative diagnoses is a named step, not an implied one -
    which reflects that the imaging finding is not specific.
  evidence:
  - reference: PMID:36007798
    reference_title: "A systematic review on nutcracker syndrome and proposed diagnostic algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a thorough clinical workup of NCS should include critical evaluation of
      the presenting clinical features and exclusion of alternative diagnoses.
      All patients should undergo duplex ultrasound with or without the addition
      of computed tomography or magnetic resonance imaging.
    explanation: >-
      States the first two steps of the proposed diagnostic framework.
  - reference: PMID:28356209
    reference_title: "Nutcracker Syndrome: An Update on Current Diagnostic Criteria and Management Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of this condition is based on a stepwise work-up with
      history and clinical examination, followed by Doppler ultrasonography,
      computed tomography, magnetic resonance imaging, intravascular ultrasound
      IVUS and phlebography with measurement of the renocaval pressure gradient.
    explanation: >-
      Independent review describing the same stepwise escalation of imaging.
  - reference: PMID:39362632
    reference_title: "Nutcracker syndrome (a Delphi consensus)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our panel agreed that symptoms of NCS should last ≥6 months and that
      compression should be demonstrated.
    explanation: >-
      A rare point of agreement in a field with no validated criteria: symptoms
      must persist at least six months and compression must be demonstrated.
      Both halves matter - the duration filters transient findings, and the
      conjunction is what separates syndrome from phenomenon.
treatments:
- name: Conservative management
  therapeutic_modality: BEHAVIORAL
  description: >-
    Management is determined by symptom severity, and symptoms often resolve
    without intervention. Conservative management is therefore the default,
    particularly in adolescents, where growth and the accumulation of
    retroperitoneal fat can relieve the compression.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  target_mechanisms:
  - target: Mesoaortic compression of the left renal vein
    treatment_effect: INHIBITS
    description: >-
      Weight gain restores the retroperitoneal and perivascular fat pad that
      holds the aortomesenteric angle open, acting on the initiating lesion
      itself. This is the only treatment in the entry that reverses the cause
      rather than bypassing or resisting it.
    evidence:
    - reference: PMID:39362632
      reference_title: "Nutcracker syndrome (a Delphi consensus)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        conservative treatment with an emphasis of weight gain should be the
        first step in treating all NCS patients with a low body weight
      explanation: >-
        International consensus that weight gain is the first step in low-BMI
        patients, which is the therapeutic counterpart of the fat-pad mechanism
        curated in the environmental section.
  evidence:
  - reference: PMID:28356209
    reference_title: "Nutcracker Syndrome: An Update on Current Diagnostic Criteria and Management Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management is determined by symptom severity; often symptom resolution
      occurs following a conservative approach.
    explanation: >-
      Directly supports conservative management as the default and reports that
      symptoms frequently resolve without intervention.
  - reference: PMID:41985840
    reference_title: "Open surgery appears to be the preferred treatment in patients with nutcracker syndrome: A vascular low frequency disease consortium analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      successful in 90 patients (78%) with a mean follow-up of 328 days
    explanation: >-
      Quantifies conservative success in the largest cohort - 78% at a mean of
      328 days - which is what justifies it as the default rather than a holding
      position.
- name: Left renal vein transposition
  therapeutic_modality: SURGERY
  description: >-
    Open surgical relocation of the left renal vein to a lower, uncompressed
    point on the inferior vena cava. It addresses the geometry directly rather
    than holding the vein open from within, and remains the reference operation.
  treatment_term:
    preferred_term: Vascular Surgical Procedure
    term:
      id: NCIT:C157725
      label: Vascular Surgical Procedure
  target_mechanisms:
  - target: Mesoaortic compression of the left renal vein
    treatment_effect: INHIBITS
    description: >-
      Moving the vein out of the aortomesenteric corridor removes the
      compression itself, which is the initiating node of the pathograph.
    evidence:
    - reference: PMID:38296038
      reference_title: "Treatment of Nutcracker Syndrome with Left Renal Vein Transposition and Endovascular Stenting."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After both procedures, the classical symptoms, including left flank
        pain, proteinuria, and hematuria, resolved in 89.5% (n = 17), 57.8% (n =
        11), and 82.3% (n = 15) of the cases, respectively.
      explanation: >-
        Symptom resolution after relieving the compression is the outcome
        evidence that the mechanism node is the operative target. The figures
        are per symptom in the order listed - flank pain 89.5%, proteinuria
        57.8%, haematuria 82.3% - so relief is least reliable for proteinuria,
        which matters when counselling a patient whose main complaint is that.
  evidence:
  - reference: PMID:28356209
    reference_title: "Nutcracker Syndrome: An Update on Current Diagnostic Criteria and Management Guidelines."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When it comes to the surgical management of NCS three main pathways exist:
      open surgery, laparoscopic surgery and endovascular approaches
    explanation: >-
      Establishes open surgery as one of three recognised operative pathways.
      Graded PARTIAL because it names the categories without reporting
      comparative efficacy - which reflects the state of the evidence, since no
      randomised comparison of these approaches exists.
  - reference: PMID:38296038
    reference_title: "Treatment of Nutcracker Syndrome with Left Renal Vein Transposition and Endovascular Stenting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 1-year and 3-year primary patency for the surgical group was 91% and
      81%, respectively
    explanation: >-
      Reports durability of left renal vein transposition in a 14-patient
      surgical series, which is the strongest outcome evidence available for
      this procedure.
- name: Endovascular stenting of the left renal vein
  therapeutic_modality: DEVICE
  description: >-
    Percutaneous stent placement holds the compressed segment open. It is
    attractive for its minimal invasiveness, but the field has formally
    converged against it as initial therapy. In the largest contemporary cohort
    endovascular therapy was worse than open surgery on every outcome measured,
    and a 2024 international Delphi panel put left renal vein transposition
    first, judging that the risk of stent migration outweighs the advantages of
    a percutaneous procedure. Stenting also leaves the external compression in
    place - it resists the geometry rather than removing it - which is the
    mechanistic reason migration into the inferior vena cava is the
    characteristic failure mode.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Left renal vein hypertension
    treatment_effect: INHIBITS
    description: >-
      Maintaining luminal patency restores outflow and lowers the renocaval
      pressure gradient, without altering the aortomesenteric geometry that
      caused it.
    evidence:
    - reference: PMID:28356209
      reference_title: "Nutcracker Syndrome: An Update on Current Diagnostic Criteria and Management Guidelines."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        endovascular approaches, with the latter 2 becoming increasingly popular
        due to their minimal invasiveness
      explanation: >-
        Establishes that stenting lowers the pressure gradient and is widely
        used. Graded PARTIAL because popularity is not efficacy, and the two
        sources below show the field has since moved against it as first-line.
  evidence:
  - reference: PMID:41985840
    reference_title: "Open surgery appears to be the preferred treatment in patients with nutcracker syndrome: A vascular low frequency disease consortium analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endovascular therapy was associated with significantly worse results for
      all outcomes and, therefore, is not appropriate as initial treatment.
    explanation: >-
      The largest contemporary cohort, 250 patients across 17 institutions,
      refutes stenting as initial therapy. Graded REFUTE against the proposition
      that stenting is an appropriate first-line option, which is what an
      earlier version of this entry implied.
  - reference: PMID:39362632
    reference_title: "Nutcracker syndrome (a Delphi consensus)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the first choice of operative treatment is left renal vein transposition
      and that the risk of stent migration outweighs the advantages of a
      percutaneous procedure
    explanation: >-
      International expert consensus placing transposition first and naming
      stent migration as the reason. Evidence source is OTHER because a Delphi
      exercise reports expert agreement rather than study data.
  - reference: PMID:38296038
    reference_title: "Treatment of Nutcracker Syndrome with Left Renal Vein Transposition and Endovascular Stenting."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the 1-year and 3-year primary patency for the stenting group was 75%
    explanation: >-
      Reports stent patency in a small series. Graded PARTIAL because the
      stenting arm was only 5 patients, was offered to those who declined
      surgery rather than randomised, and 75% is below the surgical arm's 81% at
      the same time point - consistent with the consortium result above.
  - reference: PMID:38617183
    reference_title: "Case presentation and review of renal autotransplantation for nutcracker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      stent migration occurring in approximately 6.6%.
    explanation: >-
      Quantifies the failure mode the description names, which the entry
      previously asserted without a source.
- name: ACE inhibition for orthostatic proteinuria
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Angiotensin-converting enzyme inhibition reduces intraglomerular pressure by
    dilating the efferent arteriole, and has been reported to abolish the
    orthostatic proteinuria of nutcracker syndrome. This is the one
    pharmacological option that acts on the disease's own haemodynamics rather
    than on symptoms, and it matters because sustained venous congestion can
    induce mesangial changes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  target_mechanisms:
  - target: Glomerular capillary hypertension and orthostatic proteinuria
    treatment_effect: INHIBITS
    description: >-
      ACE inhibition dilates the efferent arteriole, lowering intraglomerular
      pressure and so reducing filtration of protein. It does not touch the
      venous compression upstream - it acts on the glomerular limb only.
    evidence:
    - reference: PMID:16902785
      reference_title: "ACE inhibition can improve orthostatic proteinuria associated with nutcracker syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Her overt orthostatic proteinuria disappeared after a treatment of
        angiotensin-converting enzyme ACE inhibition.
      explanation: >-
        Resolution on treatment in a single patient. Graded PARTIAL because one
        uncontrolled case cannot separate drug effect from spontaneous remission.
  evidence:
  - reference: PMID:16902785
    reference_title: "ACE inhibition can improve orthostatic proteinuria associated with nutcracker syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her overt orthostatic proteinuria disappeared after a treatment of
      angiotensin-converting enzyme ACE inhibition.
    explanation: >-
      Reports complete resolution of orthostatic proteinuria on ACE inhibition.
      Graded PARTIAL because this is a single adolescent patient with no control
      or comparison arm, and orthostatic proteinuria can remit spontaneously.
  - reference: PMID:16902785
    reference_title: "ACE inhibition can improve orthostatic proteinuria associated with nutcracker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which can induce mesangial changes and be improved by ACE inhibitor
      treatment
    explanation: >-
      Establishes that the proteinuria is not merely a marker - sustained
      congestion produces histological mesangial change - which is the rationale
      for treating it rather than observing it.
- name: Gonadal or ovarian vein transposition
  therapeutic_modality: SURGERY
  description: >-
    Rerouting the gonadal vein to drain elsewhere decompresses the collateral
    territory rather than the renal vein itself. It was the second commonest
    operation in the largest cohort - 43 of 134 procedures, ahead of both
    autotransplantation and endovascular therapy - and consensus supports it as
    an alternative to renal vein transposition in selected patients. It is the
    only intervention here that targets the pelvic and gonadal congestion limb,
    which is where the varicocele and pelvic pain come from.
  treatment_term:
    preferred_term: Vascular Surgical Procedure
    term:
      id: NCIT:C157725
      label: Vascular Surgical Procedure
  target_phenotypes:
  - preferred_term: Varicocele
    term:
      id: HP:0012871
      label: Varicocele
  - preferred_term: Pelvic pain
    term:
      id: HP:0034267
      label: Pelvic pain
  target_mechanisms:
  - target: Pelvic and gonadal venous congestion
    treatment_effect: INHIBITS
    description: >-
      Transposing the gonadal vein relieves the congested collateral territory
      directly, without altering the aortomesenteric compression that drives
      flow into it.
    evidence:
    - reference: PMID:41985840
      reference_title: "Open surgery appears to be the preferred treatment in patients with nutcracker syndrome: A vascular low frequency disease consortium analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        43 (31%) underwent a gonadal/ovarian vein transposition, 18 (12%)
        underwent renal autotransplantation, and 19 (13%) underwent endovascular
        therapy.
      explanation: >-
        Establishes gonadal vein transposition as the second commonest operation
        in contemporary practice, which is not how the earlier version of this
        entry represented the treatment landscape.
  evidence:
  - reference: PMID:41985840
    reference_title: "Open surgery appears to be the preferred treatment in patients with nutcracker syndrome: A vascular low frequency disease consortium analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      43 (31%) underwent a gonadal/ovarian vein transposition, 18 (12%)
      underwent renal autotransplantation, and 19 (13%) underwent endovascular
      therapy.
    explanation: >-
      Frequency of the procedure in the 250-patient consortium cohort.
- name: Renal autotransplantation
  therapeutic_modality: SURGERY
  description: >-
    The left kidney is removed and reimplanted in the iliac fossa, out of the
    aortomesenteric corridor entirely. It is the most invasive option and is
    reserved for refractory disease or for patients in whom transposition or
    stenting has failed.
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Mesoaortic compression of the left renal vein
    treatment_effect: BYPASSES
    description: >-
      Relocating the kidney removes it from the compressing anatomy altogether,
      rather than widening or stenting the corridor.
    evidence:
    - reference: PMID:38617183
      reference_title: "Case presentation and review of renal autotransplantation for nutcracker syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        55 patients from 18 studies were analyzed, with a combined 91% success
        rate of symptom resolution or improvement post-autotransplantation.
      explanation: >-
        Pooled outcome across 18 studies supporting autotransplantation as
        effective for the compression node.
  evidence:
  - reference: PMID:38617183
    reference_title: "Case presentation and review of renal autotransplantation for nutcracker syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further research should confirm these findings and refine patient
      selection criteria and surgical techniques.
    explanation: >-
      The reviewing authors' own caveat. Graded PARTIAL because the 91% figure
      pools 55 patients across 18 heterogeneous studies with no common selection
      criteria, which the authors identify as the limitation.

differential_diagnoses:
- name: Superior Mesenteric Artery Syndrome
  description: >-
    The other clinical consequence of a narrowed aortomesenteric angle. The same
    geometry that traps the left renal vein traps the third part of the duodenum,
    so the two share an anatomic substrate and can coexist in one patient. They
    are distinct diseases with distinct compressed structures and distinct
    presentations.
  distinguishing_features:
  - Nutcracker syndrome compresses the LEFT RENAL VEIN and presents with haematuria, orthostatic proteinuria, left flank pain, pelvic congestion and left varicocele.
  - SMA syndrome compresses the THIRD PART OF THE DUODENUM and presents with postprandial pain, vomiting and weight loss.
  evidence:
  - reference: PMID:29376066
    reference_title: "What Each Clinical Anatomist Has to Know about Left Renal Vein Entrapment Syndrome (Nutcracker Syndrome): A Review of the Most Important Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutcracker syndrome NCS is the most common term for compression of the
      left renal vein between the superior mesenteric artery and the abdominal
      aorta.
    explanation: >-
      Establishes the compressed structure in nutcracker syndrome, which is what
      separates it from SMA syndrome despite the shared aortomesenteric
      geometry.
- name: Glomerular haematuria
  description: >-
    The commonest and most consequential differential. Nutcracker syndrome is a
    non-glomerular cause of haematuria and is a recognised consideration in
    haematuria of unknown origin, so patients are frequently investigated for
    glomerulonephritis, and some undergo renal biopsy, before the vein is looked
    at.
  distinguishing_features:
  - Nutcracker haematuria is left-sided and non-glomerular, with normal red cell morphology and no casts.
  - Glomerular haematuria shows dysmorphic red cells and red cell casts, and is not lateralised.
  evidence:
  - reference: PMID:29376066
    reference_title: "What Each Clinical Anatomist Has to Know about Left Renal Vein Entrapment Syndrome (Nutcracker Syndrome): A Review of the Most Important Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutcracker syndrome is worth considering especially in differential
      diagnosis of haematuria of unknown origin.
    explanation: >-
      Directly supports nutcracker syndrome's place in the haematuria
      differential.
discussions:
- discussion_id: ncs_diagnostic_threshold_unvalidated
  kind: KNOWLEDGE_GAP
  attaches_to:
  - imaging_findings#Left renal vein stenosis exceeding 80% on CT or ultrasound
  - diagnosis#Stepwise diagnostic workup for nutcracker syndrome
  prompt: >-
    What renocaval pressure gradient or degree of left renal vein stenosis
    actually discriminates symptomatic nutcracker syndrome from the asymptomatic
    nutcracker phenomenon?
  rationale: >-
    This is the central unresolved problem of the disease and it is a
    measurement-validity problem, not a mechanistic one. Left renal vein
    compression is common and usually asymptomatic, so no imaging threshold can
    be diagnostic on its own. The thresholds in use were identified by counting
    what published studies did, across 14 studies and 384 patients, rather than
    by testing any threshold against a clinical outcome; the systematic review
    that assembled them describes the broad spectrum of clinical presentations
    and radiologic findings as the reason diagnosis is challenging. Until a
    threshold is validated prospectively against symptom resolution after
    intervention, the diagnosis rests on a clinical judgement that the imaging
    is being used to support rather than to make.
  evidence:
  - reference: PMID:38296038
    reference_title: "Treatment of Nutcracker Syndrome with Left Renal Vein Transposition and Endovascular Stenting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic evidence must be accompanied by serious symptoms to initiate
      the treatment of nutcracker syndrome
    explanation: >-
      A surgical series stating explicitly that imaging alone is insufficient to
      act on, which is the clinical form of this knowledge gap.
  - reference: PMID:38296038
    reference_title: "Treatment of Nutcracker Syndrome with Left Renal Vein Transposition and Endovascular Stenting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Venous pressure measurements were only used to confirm the diagnosis in 5
      patients in the stenting group.
    explanation: >-
      Shows that even in a series performing intervention, the renocaval
      gradient was measured in a minority of patients - so the parameter the
      literature calls its most objective is not applied consistently.
  - reference: PMID:39362632
    reference_title: "Nutcracker syndrome (a Delphi consensus)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are no specific diagnostic criteria and interventions include a
      range of open surgical and endovascular procedures.
    explanation: >-
      A 2024 international Delphi exercise of 20 venous-disease experts states
      plainly that no specific diagnostic criteria exist. That the field
      convened a formal consensus process at all, and needed three voting rounds
      plus 14 extra statements to clarify diagnostic values, is itself the
      measure of the gap.
  - reference: PMID:38617183
    reference_title: "Case presentation and review of renal autotransplantation for nutcracker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with diagnostic thresholds ranging from >50 to 80% stenosis of the LRV
      accompanied by symptoms typical of this syndrome
    explanation: >-
      Documents the spread of stenosis thresholds actually in use, which is wide
      enough that the same patient can be diagnostic at one centre and not at
      another.
- discussion_id: ncs_symptom_mechanisms_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Renal fornix varices and haematuria
  - pathophysiology#Glomerular capillary hypertension and orthostatic proteinuria
  prompt: >-
    By what mechanism does left renal vein hypertension actually produce
    haematuria and proteinuria?
  rationale: >-
    This entry describes the fornix-varix rupture route for haematuria and the
    glomerular-pressure route for proteinuria as though they were settled. They
    are not, and it is worth being explicit that this is the least secure part
    of the pathograph rather than the most. The 2024 Delphi panel put both
    propositions to 20 international experts and neither reached the 70%
    threshold: haematuria via rupture of the thin-walled septum reached 60%, and
    proteinuria via renal vein pressure acting through angiotensin II and
    norepinephrine reached 45%. The panel's own summary of the mechanistic
    literature is blunt. Note the shape of what the field agrees on: consensus
    was reached on imaging and on transposition as first-line treatment, and
    withheld on both mechanisms - the reverse of what a reader might assume from
    how confidently the mechanisms are usually stated.
  evidence:
  - reference: PMID:39362632
    reference_title: "Nutcracker syndrome (a Delphi consensus)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      No consensus was reached on the pathological cause of hematuria and
      proteinuria in NCS, despite supplying the panel with known theories. The
      mechanism is unknown.
    explanation: >-
      The consensus document's own account: the panel was given the existing
      mechanistic theories, could not agree on any of them, and states flatly
      that the mechanism is unknown. The two statements were withdrawn from the
      survey after the first round.
- discussion_id: ncs_intervention_comparative_efficacy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Left renal vein transposition
  - treatments#Endovascular stenting of the left renal vein
  prompt: >-
    Given that open transposition outperforms stenting overall, is there a
    patient subgroup for whom an endovascular approach is nonetheless the right
    choice, and how durable is it in them?
  rationale: >-
    The first-line question is settled and this entry previously got it wrong.
    A 250-patient multi-institutional comparison found endovascular therapy
    worse on all outcomes and not appropriate as initial treatment, and a Delphi
    panel of 20 international experts reached consensus for transposition first;
    the statement that endovascular stenting is preferred over open procedures
    was rejected at 80% consensus. What remains genuinely open is narrower and
    more useful: no randomised comparison exists, the endovascular arms in the
    published series are small and non-randomised - typically offered to
    patients who declined surgery, which selects for a different population -
    and nobody has characterised which patients, if any, do well with a stent.
    Durability is the second half of the question, since a stent leaves the
    aortomesenteric geometry unchanged and migration is its characteristic
    failure mode.
notes: >-
  Evidence grading. There is no randomised trial of any intervention in this
  disease. That does not mean there is no comparative evidence: a 250-patient
  multi-institutional cohort and a 20-expert Delphi consensus both bear directly
  on treatment choice, and both are cited here. Where a treatment claim is graded
  PARTIAL, the explanation says which specific limitation earned that grade - an
  outcome from a five-patient non-randomised arm, a single uncontrolled case -
  rather than leaving PARTIAL to mean "weak" in general. One item is graded
  REFUTE: the consortium finding that endovascular therapy is not appropriate as
  initial treatment refutes the first-line role an earlier draft of this entry
  implied for it.

  What the field agrees and disagrees on. This is worth stating plainly because
  it runs opposite to intuition. The Delphi panel reached consensus on the
  practical questions - imaging is obligatory, symptoms must persist at least six
  months, transposition is the first-choice operation - and failed to reach
  consensus on both mechanistic ones, withdrawing the haematuria and proteinuria
  statements after the first round. The mechanism sections of this entry are
  therefore the least secure part of it, not the most, and the
  ncs_symptom_mechanisms_unresolved discussion records that.

  Phenomenon versus syndrome. The distinction is load-bearing throughout, and
  the numbers show why: roughly 23% of the population has imaging evidence of
  left renal vein compression, essentially all of it asymptomatic. The
  anatomical compression is the nutcracker phenomenon; the syndrome is the
  phenomenon plus attributable symptoms after alternatives are excluded. The
  single prevalence record in this entry is deliberately the phenomenon, marked
  as such - no reliable prevalence exists for the syndrome. Phenotype
  frequencies here are proportions among diagnosed patients, so they describe
  the case mix of the syndrome and say nothing about how often the phenomenon
  becomes it.

  Anatomy bindings. The gonadal congestion node is bound to UBERON:0003848
  gonadal vein, verified by OLS lookup. A review suggestion proposed
  UBERON:0001152 for this concept; that identifier does not resolve to gonadal
  vein, so the verified term was used instead.

  Named Entity Confusion preflight. just preflight-dr returned SKIP for this
  entry's deep-research report, because MONDO records no causal gene for
  MONDO:0019105 and the check is gene-identity based. The report was therefore
  checked manually against title, summary and section content, all of which are
  unambiguously about left renal vein entrapment. Note the tool's top-gene list
  was led by "ACE" at 11 mentions, which is the drug class rather than the
  gene - a reminder that this check does not degrade gracefully on
  non-Mendelian disease.

  Subtypes. Anterior and posterior forms are curated as has_subtypes because
  they share one pathograph and differ only in the compression site. Neither
  carries a distinct MONDO term.

animal_models:
- name: Emc10 (Mirta22) homozygous knockout mouse
  species: Mouse
  genotype: Emc10 homozygous loss-of-function
  publication: PMID:28696314
  description: >-
    Homozygous Emc10 knockout mice phenotyped by the International Mouse
    Phenotyping Consortium show changes in vocalization, gait, activity and
    open-field behaviour. A separate Mirta22/Emc10 loss-of-function line showed
    no change in prepulse inhibition, working memory or social memory, and
    reducing Emc10 rescued those deficits in a 22q11.2 deletion model, where
    Emc10 is upregulated. Neither line has been assessed for the cognitive and
    seizure phenotypes of the human disorder.
  evidence:
  - reference: PMID:33531666
    reference_title: A recurrent, homozygous EMC10 frameshift variant is associated with a syndrome of developmental delay with variable seizures and dysmorphic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Differences include abnormal vocalization, gait, activity, and behavior
      during open field testing, which measures motor activity and
      anxiety-related behaviors in rodents
    explanation: Behavioural changes in IMPC homozygous Emc10 knockout mice, as summarized by the discovery-cohort authors.
  - reference: PMID:28696314
    reference_title: Loss-of-function mutation in Mirta22/Emc10 rescues specific schizophrenia-related phenotypes in a mouse model of the 22q11.2 deletion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additional analysis of homozygous Mirta22 knockout mice, in which no
      alteration is observed in the above-mentioned SCZ-related phenotypes,
      highlights the deleterious effects of Mirta22 up-regulation.
    explanation: Emc10 knockout mice lack the schizophrenia-related cognitive deficits tested.
  modeled_mechanisms:
  - target: Biallelic EMC10 Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the genetic lesion, loss of Emc10, and shows
      mild behavioural and motor changes, but not the cognitive phenotypes
      tested.
    limitations: >-
      Homozygous Mirta22/Emc10 knockout mice showed no change in prepulse
      inhibition, working memory or social memory, and neither line has been
      assessed for intellectual disability-like or seizure phenotypes. In
      mouse, Emc10 is characterized mainly as an inhibitor of neuronal
      maturation whose excess, not loss, produces deficits, which does not
      match the human recessive loss-of-function disorder.
    evidence:
    - reference: PMID:33531666
      reference_title: A recurrent, homozygous EMC10 frameshift variant is associated with a syndrome of developmental delay with variable seizures and dysmorphic features.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Differences include abnormal vocalization, gait, activity, and behavior
        during open field testing, which measures motor activity and
        anxiety-related behaviors in rodents
      explanation: Emc10 loss in mouse produces organism-level behavioural and motor changes.
    - reference: PMID:28696314
      reference_title: Loss-of-function mutation in Mirta22/Emc10 rescues specific schizophrenia-related phenotypes in a mouse model of the 22q11.2 deletion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additional analysis of homozygous Mirta22 knockout mice, in which no
        alteration is observed in the above-mentioned SCZ-related phenotypes,
        highlights the deleterious effects of Mirta22 up-regulation.
      explanation: Records the cognitive phenotypes the knockout does not reproduce.
discussions:
- discussion_id: emc10_insertase_direction
  prompt: >-
    Does loss of EMC10 reduce or increase insertion of EMC client membrane
    proteins in human neurons, and which clients mediate the
    neurodevelopmental phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic EMC10 Loss of Function
  - pathophysiology#Altered EMC-Dependent Membrane Protein Insertion
  rationale: >-
    The disease-gene reports assume reduced EMC insertase function, but the
    only direct test of EMC10 depletion in human cells found increased
    insertion of a tail-anchored client, opposite to depletion of core
    subunits. No client protein has been measured in patient-derived cells or
    neurons, so the mechanistic link from EMC10 loss to the phenotype is
    unsupported in either direction.
  evidence:
  - reference: PMID:34414886

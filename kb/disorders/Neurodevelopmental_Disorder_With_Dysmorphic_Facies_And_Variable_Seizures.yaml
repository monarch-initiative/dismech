- name: Altered EMC-Dependent Membrane Protein Insertion
  description: >-
    The EMC inserts transmembrane domains of tail-anchored and multipass
    membrane proteins into the ER membrane. EMC10 sits on the lumenal side of
    the complex. Whether EMC10 deficiency lowers or raises insertion of EMC
    clients in neurons is unknown: the disease-gene reports propose reduced
    insertion, while knockdown in human cell lines increased insertion of
    tail-anchored clients. The node is stated as altered insertion for that
    reason, and the process term carries no direction.
  biological_scale: CELLULAR

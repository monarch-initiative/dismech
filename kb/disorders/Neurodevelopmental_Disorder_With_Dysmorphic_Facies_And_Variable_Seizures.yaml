    label: neurodevelopmental disorder with dysmorphic facies and variable seizures
parents:
- Neurodevelopmental Disorder
notes: >-
  The GeneReviews chapter EMC10-Related Neurodevelopmental Disorder
  (PMID:37319253) is the phenotype baseline; it is cached as its PubMed abstract
  only. Phenotype frequencies are taken from single cohorts as stated in each
  description: the 13-individual, seven-family discovery cohort (PMID:33531666)
  and the 10-individual, six-family follow-up cohort (PMID:35684946). Where the
  two cohorts disagree (arachnodactyly 3/13 versus 8/10) or a count pools
  findings, no frequency is assigned. The discovery cohort also reported
  cerebellar tonsillar ectopia or Chiari I malformation (4/12), pooled in one
  count; it is not recorded as a phenotype because no single HPO term covers
  both findings without overstating one of them. The authors of the discovery
  cohort considered the renal findings difficult to attribute to EMC10.

      suggesting that these two shorter truncated fragments are unstable.
    explanation: The truncated product of the recurrent frameshift is unstable in transfected HeLa cells.
  - reference: PMID:32869858
    reference_title: EMC10 homozygous variant identified in a family with global developmental delay, mild intellectual disability, and speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RT-qPCR showed a substantial decrease in the relative EMC10 gene
      expression in the patients
    explanation: The splice-acceptor variant also reduces EMC10 expression in patient cells.
  - reference: PMID:33531666
    reference_title: A recurrent, homozygous EMC10 frameshift variant is associated with a syndrome of developmental delay with variable seizures and dysmorphic features.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Changes in EMC function are likely to decrease, but not abolish, the
      insertion and proper function of multiple transmembrane proteins.
    explanation: >-
      The discovery-cohort authors propose reduced EMC insertion activity as
      the consequence of EMC10 loss. This is their inference, not a
      measurement.
  - reference: PMID:34414886
    reference_title: An engineered transcriptional reporter of protein localization identifies regulators of mitochondrial and ER membrane protein trafficking in high-throughput CRISPRi screens.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, we found that knockdown of the EMC10 subunit of the ER
      membrane complex (EMC) increases insertion of specific TA proteins into
      the ERM, in opposition to the function of other EMC components.
    explanation: >-
      CRISPRi knockdown of EMC10 in human cell lines increased rather than
      decreased insertion of an EMC client, which contradicts reading EMC10
      loss as reduced insertase activity.

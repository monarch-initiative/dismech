  - reference: PMID:32869858
    reference_title: EMC10 homozygous variant identified in a family with global developmental delay, mild intellectual disability, and speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES revealed a homozygous splice acceptor site variant (c.679-1G>A) in
      EMC10 (chromosome 19q13.33) that segregated perfectly within the family.
    explanation: An independent homozygous splice-site variant in a Saudi family.
  - reference: PMID:35684946
    reference_title: Biallelic loss of EMC10 leads to mild to severe intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Utilizing exome sequencing and international data sharing we have
      identified 10 affected individuals from six independent families with
      five new biallelic loss-of-function and one previously reported
      recurrent EMC10 variants.
    explanation: Replication with five further loss-of-function alleles in six families.
  - reference: PMID:33531666
    reference_title: A recurrent, homozygous EMC10 frameshift variant is associated with a syndrome of developmental delay with variable seizures and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The single-nucleotide deletion occurs in a homopolymeric repeat sequence
      (CGGGGC) that predisposes to DNA replication errors and represents a
      potential hotspot for genetic variation.
    explanation: >-
      Explains why the same frameshift recurs on two distinct founder
      haplotypes.
pathophysiology:
- name: Biallelic EMC10 Loss of Function
  description: >-
    Biallelic truncating or splice-site EMC10 variants reduce EMC10 transcript
    levels in patient blood, and the recurrent frameshift encodes a truncated
    protein that is degraded by the proteasome in transfected cells. The
    truncation removes the C-terminal region through which EMC10 contacts the
    core EMC. The molecular function lost is assumed to be EMC10's contribution
    to EMC membrane insertase activity; this assumption is contested (see the
    REFUTE evidence and the knowledge-gap discussion).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EMC10
    term:
      id: hgnc:27609
      label: EMC10
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:

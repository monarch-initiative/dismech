name: Neurodevelopmental Disorder With Dysmorphic Facies And Variable Seizures
creation_date: '2026-10-25T00:00:00Z'
category: Mendelian
synonyms:
- NEDDFAS
- EMC10-related neurodevelopmental disorder
- EMC10-NDD
description: >-
  Autosomal recessive neurodevelopmental disorder caused by biallelic
  loss-of-function variants in EMC10, which encodes a lumenal subunit of the
  endoplasmic reticulum membrane protein complex (EMC). Affected children have
  global developmental delay and intellectual disability ranging from mild to
  severe, with marked impairment of speech and language. Seizures occur in
  about half of reported individuals, and dysmorphic features (long face,
  pointed chin, curly hair) and limb findings (cubitus valgus, arachnodactyly,
  fifth-finger clinodactyly) are variable. Failure to thrive, abdominal wall
  hernias, renal findings (nephrocalcinosis, renal cysts, hydronephrosis),
  microcephaly, behavioural problems, motor regression, hypotonia, dysarthria and ataxia are reported in subsets. Most reported
  families are consanguineous and of Middle Eastern origin, and a recurrent
  frameshift (c.287delG, p.Gly96Alafs*9) arose independently on two founder
  haplotypes at a homopolymeric G run. The variants reduce EMC10 transcript
  levels and yield unstable truncated protein. How EMC10 loss produces the
  neurodevelopmental phenotype is not established: the EMC is a
  transmembrane-domain insertase, but EMC10 knockdown in human cell lines
  increases rather than decreases insertion of an EMC client, so the direction
  of the cellular defect is an open question.

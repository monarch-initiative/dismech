- discussion_id: emc10_mouse_human_mismatch
  prompt: >-
    Why do Emc10 knockout mice show only mild behavioural changes, without the
    cognitive deficits tested, when biallelic EMC10 loss causes intellectual
    disability in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  rationale: >-
    Mouse Emc10 is best studied as an inhibitor of neuronal maturation whose
    upregulation drives deficits in a 22q11.2 deletion model, and its loss in
    otherwise normal mice spared the cognitive phenotypes tested. That
    contrasts with the human recessive loss-of-function disorder, so the mouse
    knockout may not model the human disease mechanism.
  evidence:
  - reference: PMID:28696314
    reference_title: Loss-of-function mutation in Mirta22/Emc10 rescues specific schizophrenia-related phenotypes in a mouse model of the 22q11.2 deletion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Postnatal brain up-regulation of Mirta22/Emc10, an inhibitor of
      neuronal maturation, represents the major transcriptional effect of the
      22q11.2-associated microRNA dysregulation.
    explanation: In mice, Emc10 excess rather than loss is linked to neuronal immaturity.

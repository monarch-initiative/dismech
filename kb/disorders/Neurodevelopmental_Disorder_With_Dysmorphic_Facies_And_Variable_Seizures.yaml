      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Indeed, a survey of 61 proteins dependent upon the EMC in proteomic
        studies (Tian et al.20 and Shurtleff et al.21) revealed that many have
        been independently implicated in human neurodevelopmental diseases
      explanation: >-
        EMC-dependent clients include many neurodevelopmental disease proteins,
        which makes altered client biogenesis a plausible route to the
        neurodevelopmental phenotype. No client has been shown to be affected
        in patient neurons.

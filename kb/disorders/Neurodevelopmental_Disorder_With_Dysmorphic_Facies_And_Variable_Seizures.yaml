  - preferred_term: tail-anchored membrane protein insertion into ER membrane
    term:
      id: GO:0071816
      label: tail-anchored membrane protein insertion into ER membrane
  evidence:
  - reference: PMID:29242231
    reference_title: The ER membrane protein complex is a transmembrane domain insertase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Purified EMC in synthetic liposomes catalyzed the insertion of its
      substrates in a reconstituted system.
    explanation: Establishes the EMC as a transmembrane-domain insertase for tail-anchored proteins.
  - reference: PMID:34414886
    reference_title: An engineered transcriptional reporter of protein localization identifies regulators of mitochondrial and ER membrane protein trafficking in high-throughput CRISPRi screens.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While loss of other EMC subunits decreased the ER localization of our
      mutant TA protease, EMC10 knockdown produced the opposite effect, which
      we confirmed by immunofluorescence and FACS.
    explanation: EMC10 knockdown alters tail-anchored protein insertion, in the opposite direction to other subunits.

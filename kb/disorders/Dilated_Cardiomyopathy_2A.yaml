name: Dilated Cardiomyopathy 2A
creation_date: "2026-08-02T00:00:00Z"
synonyms:
- CMD2A
- DCM2A
- cardiomyopathy, dilated, 2A
- dilated cardiomyopathy type 2A
- TNNI3-related autosomal recessive dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 2A (CMD2A) is the autosomal recessive, TNNI3-related
  form of familial isolated dilated cardiomyopathy. TNNI3 encodes cardiac
  troponin I (cTnI), the inhibitory subunit of the sarcomeric troponin complex
  that holds the actin-tropomyosin thin filament in its "off" state until
  calcium binding to troponin C releases the inhibition and permits
  cross-bridge cycling. CMD2A is caused by biallelic loss-of-function (mainly
  protein-truncating, and rarely splice-disrupting or whole-gene-deletion)
  TNNI3 genotypes, and it is mechanistically distinct from the far more common
  heterozygous TNNI3 missense disease that produces autosomal dominant
  hypertrophic (CMH7) and restrictive (RCM1) cardiomyopathy. Its most
  characteristic feature is a developmentally timed onset: the fetal and
  neonatal heart expresses slow skeletal troponin I (ssTnI, TNNI1) instead of
  cTnI, so a cTnI-null heart is protected until the perinatal TnI isoform
  switch withdraws that substitute. Affected children are therefore typically
  well at birth and then decompensate in the neonatal period or first months of
  life with severe left ventricular dilation, profoundly reduced ejection
  fraction, and refractory heart failure; one reported consanguineous kindred
  lost three infant siblings, and the natural history without transplantation
  is frequently lethal in the first year or two. Heterozygous carriers, including
  the parents in consanguineous kindreds, are typically unaffected or show only
  low-penetrance disease. ClinGen's Dilated Cardiomyopathy Gene Curation Expert
  Panel classifies the autosomal recessive TNNI3-DCM relationship as Strong,
  separately from its Strong autosomal dominant TNNI3-DCM classification. The
  degree of residual cTnI appears to set the phenotype within the recessive
  allelic series: complete absence gives dilated cardiomyopathy, whereas a more
  distal truncation retaining partial function has been reported to give
  pediatric restrictive cardiomyopathy instead.
category: Genetic

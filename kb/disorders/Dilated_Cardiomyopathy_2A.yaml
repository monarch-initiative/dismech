discussions:
- discussion_id: cmd2a_mondo_node_versus_clingen_lumped_dcm
  prompt: >-
    Should CMD2A be curated as its own dismech entity, given that ClinGen curates
    the TNNI3 relationship against the generic "dilated cardiomyopathy" entity
    (MONDO:0005021) and splits it only by mode of inheritance, while MONDO
    maintains a distinct CMD2A node (MONDO:0012746)?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic TNNI3 Loss of Function
  rationale: >-
    ClinGen's Dilated Cardiomyopathy GCEP issued two separate TNNI3-DCM
    assertions on the same day, differing only in mode of inheritance (AD Strong,
    AR Strong), both against MONDO:0005021 — it treats the recessive relationship
    as a distinct curatable claim but not as a distinct disease entity. MONDO
    instead assigns CMD2A its own node with its own OMIM anchor. dismech follows
    MONDO here, and the substantive justification is mechanistic rather than
    nomenclatural: the recessive entity has a different molecular lesion
    (complete loss of function versus dominant-negative/altered-function
    missense), a different age of onset governed by a developmental isoform
    switch, and a different natural history. If ClinGen or MONDO later converges
    on a single lumped TNNI3-cardiomyopathy entity, this entry should be revisited
    rather than duplicated against its dominant siblings.
  evidence:
  - reference: CGGV:assertion_b89182f6-1574-48c6-832f-add41ffbaa4c-2025-04-18T160000.000Z
    reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AR | Strong
    explanation: >-
      Shows that ClinGen curates the recessive relationship against the generic
      DCM entity rather than against the CMD2A node, which is the tension this
      discussion records.
- discussion_id: cmd2a_truncation_position_phenotype_boundary
  prompt: >-
    Does truncation position within TNNI3 determine whether a biallelic
    loss-of-function genotype produces dilated or restrictive cardiomyopathy, and
    if so where is the boundary?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
  rationale: >-
    The recessive TNNI3 series is currently modeled as producing dilated
    cardiomyopathy, but a homozygous distal nonsense allele (p.Arg136*) with
    diminished-but-detectable myocardial protein has been reported to produce
    restrictive cardiomyopathy instead. That single observation implies a graded
    residual-function relationship rather than a binary null state, but it is one
    patient, the protein-abundance measurement is semiquantitative, and no
    systematic genotype-to-phenotype series across truncation positions exists.
    Until it does, dismech should not assert a positional rule.
  proposed_experiments:
  - experiment_id: exp_cmd2a_truncation_position_genotype_series
    name: Multi-center biallelic TNNI3 truncation-position genotype-phenotype series
    description: >-
      Assemble a multi-center series of biallelic TNNI3 loss-of-function patients
      annotated by truncation position, cardiomyopathy subtype, and age of onset,
      to test whether phenotype tracks predicted residual protein length.
  - experiment_id: exp_cmd2a_residual_ctni_quantification
    name: Quantification of residual cTnI across recessive truncating alleles
    description: >-
      Quantify cTnI protein abundance and thin-filament incorporation in
      myocardial tissue or patient-derived iPSC-cardiomyocytes across the reported
      truncating alleles, to establish whether residual function is measurable
      rather than inferred.
  evidence:
  - reference: PMID:41918167
    reference_title: A homozygous variant in cardiac troponin I3, TNNI3, causes severe pediatric restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, recessive TNNI3 protein truncation causes severe pediatric RCM,
      suggesting that the allelic status, type of genetic alteration, and length
      of TNNI3 protein truncation determine cardiomyopathy onset and subtype
      manifestation.
    explanation: >-
      States the proposed positional rule as a suggestion drawn from a single
      patient — the open question this discussion records.
- discussion_id: cmd2a_sstni_compensation_human_fidelity
  prompt: >-
    Does the murine slow-skeletal-troponin-I compensation-then-withdrawal
    mechanism, which supplies the timing explanation for CMD2A, actually operate
    on the same schedule in the human heart?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Perinatal Troponin I Isoform Switch and Loss of ssTnI Compensation
  rationale: >-
    The isoform-switch explanation for why a cTnI-null child is well at birth and
    fails weeks later rests almost entirely on the Tnni3-null mouse, where the
    schedule is sharp and well characterized (ssTnI decline from day 15, death on
    day 18). The human TnI isoform switch is known to occur perinatally, but no
    direct measurement of ssTnI persistence in the myocardium of a CMD2A patient
    has been reported, and the human presentation window is broader — neonatal in
    some reports, later in the first year in others. Whether that variability
    reflects individual differences in the timing of ssTnI withdrawal, residual
    cTnI from hypomorphic alleles, or unrelated modifiers is unresolved. This is a
    model-fidelity question, not an absence of evidence: the mouse result is
    strong, its human transferability is the open item.
  proposed_experiments:
  - experiment_id: exp_cmd2a_human_myocardial_sstni_timing
    name: Myocardial ssTnI/cTnI abundance across CMD2A patient ages
    description: >-
      Measure ssTnI and cTnI protein abundance in myocardial tissue obtained at
      transplantation or autopsy from CMD2A patients of differing ages, to test
      whether clinical decompensation coincides with ssTnI withdrawal.
  - experiment_id: exp_cmd2a_ipsc_tni_isoform_schedule
    name: TnI isoform schedule in TNNI3-null human iPSC-cardiomyocytes
    description: >-
      Track TnI isoform composition during maturation of TNNI3-null
      iPSC-cardiomyocytes or engineered heart tissue against isogenic controls,
      to establish the human schedule in a controlled system.
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compensation was only temporary, however, as 15 days after birth slow
      skeletal troponin I expression began a steady decline, giving rise to a
      troponin I deficiency.
    explanation: >-
      Supplies the precise murine schedule whose human counterpart has not been
      directly measured.
  - reference: PMID:26526134
    reference_title: "TNNI1, TNNI2 and TNNI3: Evolution, regulation, and protein structure-function relationships."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      which are expressed under muscle type-specific and developmental
      regulations
    explanation: >-
      Confirms that TnI isoform expression is developmentally regulated in
      vertebrates generally. PARTIAL because it does not supply a human
      myocardial timing measurement.

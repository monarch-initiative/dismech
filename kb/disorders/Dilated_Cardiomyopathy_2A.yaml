diagnosis:
- name: Echocardiography
  description: >-
    First-line and usually diagnostic: left ventricular internal dimensions and
    ejection fraction establish the dilated, hypocontractile phenotype and detect
    the accompanying functional mitral regurgitation. In an infant presenting
    with tachypnea and poor feeding, echocardiography is what converts a
    presumed respiratory illness into a cardiomyopathy diagnosis.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling
    explanation: >-
      Establishes echocardiography as the required modality for assessing the
      ventricular dysfunction that defines DCM, of which CMD2A is a genetic form.
      Evidence source is OTHER because this is a Nature Reviews Disease Primers
      review.
  - reference: PMID:38089682
    reference_title: "Case Report: Mutation in TNNI3(c. 544G>A): a novel likely pathogenic mechanism of neonatal dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doppler echocardiography showed refractory low ejection fraction, cardiac
      enlargement, cardiac insufficiency, mild pulmonary hypertension, and mitral
      and tricuspid insufficiency with mild valve regurgitation.
    explanation: >-
      Shows the echocardiographic findings that establish the diagnosis in a
      neonate with a TNNI3 variant. PARTIAL because this patient's variant was
      de novo heterozygous rather than biallelic, so the citation supports the
      imaging workup rather than the recessive genotype.
- name: Molecular Genetic Testing
  description: >-
    Exome or targeted cardiomyopathy-panel sequencing establishes the diagnosis
    and, critically, its recessive mode. Trio analysis is the informative design:
    it demonstrates that each unaffected parent carries one allele and that the
    proband carries two, distinguishing CMD2A from a de novo dominant TNNI3
    variant. Copy-number analysis must be included, since a whole-gene deletion
    can be the second allele and would be missed by sequence analysis alone.
  diagnosis_term:
    preferred_term: trio exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38924380
    reference_title: Homozygous TNNI3 frameshift variant in a consanguineous family with lethal infantile dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed for the trio (the second deceased infant
      and her parents). Data analysis following the autosomal dominant and
      recessive patterns of inheritance was carried out
    explanation: >-
      Documents trio exome sequencing with explicit dominant-versus-recessive
      analysis as the diagnostic route to a CMD2A genotype.
  - reference: PMID:36565796
    reference_title: Identification of a novel TNNI3 synonymous variant causing intron retention in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing and real-time quantitative PCR were used to confirm the
      variants identified.
    explanation: >-
      Documents the confirmatory workflow including quantitative PCR, the method
      that detects the whole-gene deletion allele that sequencing alone would
      miss.
- name: Splicing Functional Assay
  description: >-
    A minigene splicing assay is required to interpret candidate synonymous or
    near-splice TNNI3 variants, which are otherwise easy to dismiss as benign.
    This is not routine diagnostics but is decisive when standard variant
    annotation leaves a recessive genotype only half explained.
  diagnosis_term:
    preferred_term: minigene splicing functional assay
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36565796
    reference_title: Identification of a novel TNNI3 synonymous variant causing intron retention in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Minigene splicing analyses showed it led to an intron retention (c.24 +
      1_24 + 45ins) by intron 2 cryptic splicing.
    explanation: >-
      Demonstrates the assay establishing that a synonymous TNNI3 variant is in
      fact a loss-of-function allele.
differential_diagnoses:
- name: TNNI3-related hypertrophic and restrictive cardiomyopathy (CMH7, RCM1)
  description: >-
    The same gene, but the dominant, heterozygous, missense form. These are the
    long-established and far more common TNNI3 diseases; distinguishing them from
    CMD2A is a matter of zygosity, variant class, and phenotype rather than gene
    identity. A heterozygous TNNI3 missense variant in a child with a dilated
    ventricle should not be reported as CMD2A.
  evidence:
  - reference: PMID:36981019
    reference_title: "Homozygous TNNI3 Mutations and Severe Early Onset Dilated Cardiomyopathy: Patient Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While heterozygous TNNI3 missense mutations have long been associated with
      autosomal dominant hypertrophic and restrictive cardiomyopathies, the role
      of TNNI3 null mutations has been more debated
    explanation: >-
      States the contrast between the dominant missense TNNI3 diseases and the
      recessive null disease curated here.
- name: Recessive TNNI3 restrictive cardiomyopathy
  description: >-
    A biallelic TNNI3 genotype does not guarantee a dilated phenotype: a distal
    homozygous nonsense allele has been reported to cause severe pediatric
    restrictive cardiomyopathy with diastolic rather than systolic failure. This
    is the closest differential within the recessive series itself and is
    distinguished echocardiographically.
  evidence:
  - reference: PMID:41918167
    reference_title: A homozygous variant in cardiac troponin I3, TNNI3, causes severe pediatric restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dilated cardiomyopathy (DCM) results from systolic dysfunction, while
      restrictive cardiomyopathy (RCM) is due to diastolic dysfunction.
    explanation: >-
      States the physiological distinction on which this differential turns, in
      the paper that reports a homozygous TNNI3 nonsense genotype presenting as
      restrictive rather than dilated cardiomyopathy.
- name: Other genetic and acquired causes of infantile dilated cardiomyopathy
  description: >-
    Neonatal and infantile DCM has many causes besides TNNI3 — other sarcomeric
    and cytoskeletal genes, inborn errors of metabolism and mitochondrial
    disease, and acquired myocarditis, most often viral. Roughly half of DCM
    overall is monogenic, so a genetic diagnosis is not assumed and myocarditis
    must be excluded before a familial label is applied.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nongenetic forms of DCM can result from different aetiologies, including
      inflammation of the myocardium due to an infection (mostly viral); exposure
      to drugs, toxins or allergens; and systemic endocrine or autoimmune
      diseases.
    explanation: >-
      Enumerates the acquired differential that must be excluded before a
      familial DCM diagnosis. Evidence source is OTHER because this is a review.
  - reference: PMID:38924380
    reference_title: Homozygous TNNI3 frameshift variant in a consanguineous family with lethal infantile dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A monogenic molecular etiology accounts for nearly half of cases.
    explanation: >-
      Quantifies the monogenic fraction of DCM, framing why the non-genetic
      differential remains substantial.
progression:
- phase: Prenatal and neonatal latency
  notes: >-
    A cTnI-null fetus develops normally and is born with normal heart and body
    weight, because slow skeletal troponin I occupies the troponin complex in
    place of the missing cardiac isoform. This is a true latent phase, not merely
    a presymptomatic one — the substituting protein is genuinely doing the
    regulatory job. It is also why prenatal imaging is not expected to identify
    affected pregnancies, and why families at 25% recurrence risk are counselled
    toward molecular prenatal diagnosis rather than fetal echocardiography.
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking cardiac troponin I were born healthy, with normal heart and
      body weight, because a fetal troponin I isoform (identical to slow skeletal
      troponin I) compensated for the absence of cardiac troponin I.
    explanation: >-
      Establishes the mechanism of the latent phase. Model organism evidence; the
      human correlate is that affected infants are described as presenting after
      birth rather than with prenatal or immediately postnatal cardiac failure.
- phase: Decompensation as ssTnI is withdrawn
  notes: >-
    Loss of the fetal isoform converts a compensated null heart into a troponin
    I-deficient one, and clinical failure follows. In the mouse this is a sharp
    event — ssTnI decline from day 15, death on day 18. In children the
    equivalent window is the neonatal period to the first months of life, with
    presentation as tachypnea, feeding difficulty, and refractory low ejection
    fraction.
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice died of acute heart failure on day 18, demonstrating that some form of
      troponin I is required for normal cardiac function and survival.
    explanation: >-
      Times decompensation to the completion of ssTnI withdrawal.
  - reference: PMID:36981019
    reference_title: "Homozygous TNNI3 Mutations and Severe Early Onset Dilated Cardiomyopathy: Patient Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic TNNI3 null mutations cause a severe form of neonatal dilated
      cardiomyopathy
    explanation: >-
      Places the human decompensation window in the neonatal period.
- phase: Refractory heart failure and death or transplantation
  notes: >-
    Once established, the cardiomyopathy is severe and typically progressive
    despite medical therapy. Reported outcomes include death within the first
    year in multiple siblings of one kindred and death shortly after diagnosis in
    another patient; in the restrictive variant of the recessive series, treatment
    refractoriness led to transplantation at 28 months. Transplantation is the
    only definitive option because the underlying lesion is a permanently absent
    regulatory protein.
  evidence:
  - reference: PMID:38924380
    reference_title: Homozygous TNNI3 frameshift variant in a consanguineous family with lethal infantile dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a family with three deceased offspring at the age of 1 year
      old.
    explanation: >-
      Documents the lethal natural history in an untransplanted kindred.
  - reference: PMID:41918167
    reference_title: A homozygous variant in cardiac troponin I3, TNNI3, causes severe pediatric restrictive cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RCM in this patient was treatment refractory and resulted in a heart
      transplant at the age of 28 months.
    explanation: >-
      Documents treatment refractoriness and transplantation in the recessive
      TNNI3 series. PARTIAL because this patient's phenotype was restrictive
      rather than dilated.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard anti-remodeling heart-failure therapy — renin-angiotensin system
    blockade, a beta-blocker, and a mineralocorticoid receptor antagonist,
    dosed for age — targeting the neurohormonal amplifier between the
    myofilament lesion and adverse ventricular remodeling. There is no
    TNNI3-specific or troponin-replacing therapy, so management is the generic
    dilated-cardiomyopathy regimen, and in this entity it is frequently
    insufficient: reported infants have had refractory low ejection fraction
    despite treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: mineralocorticoid receptor antagonist (spironolactone as the class exemplar)
      term:
        id: NCIT:C840
        label: Spironolactone
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Failure
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade slows adverse remodeling downstream of the
      myofilament defect; it does not address the absent troponin I.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients
      with DCM.
    explanation: >-
      Establishes standard heart-failure therapy as first-line management for
      dilated cardiomyopathy, of which CMD2A is a genetic form. Evidence source
      is OTHER because this is a Nature Reviews Disease Primers review.
  - reference: PMID:38089682
    reference_title: "Case Report: Mutation in TNNI3(c. 544G>A): a novel likely pathogenic mechanism of neonatal dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He presented repeated weaning difficulties during hospitalization with
      intractable low EF heart insufficiency.
    explanation: >-
      Illustrates the refractoriness of neonatal TNNI3-associated dilated
      cardiomyopathy to supportive and medical management. PARTIAL because this
      patient carried a de novo heterozygous variant rather than a biallelic
      CMD2A genotype.
- name: Mechanical Circulatory Support (ECMO and Ventricular Assist Device)
  description: >-
    The bridge between failing medical therapy and transplantation. When an
    infant with CMD2A decompensates into low-output failure or cardiogenic
    shock, veno-arterial extracorporeal membrane oxygenation provides emergency
    rescue and a ventricular assist device provides durable support until a
    donor organ is available. This step sits between guideline-directed
    pharmacotherapy and heart transplantation in the care pathway, and matters
    disproportionately in this entity because the disease presents in infancy
    with severe, refractory systolic failure and because transplantation is the
    only definitive option.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical circulatory support as a bridge to transplantation
    term:
      id: NCIT:C80452
      label: Ventricular Assist Device Placement
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Failure
    treatment_effect: INHIBITS
    description: >-
      Mechanical support substitutes for the failing ventricle's pump function.
      It does not touch the myofilament lesion; it buys time to transplant.
  notes: >-
    No CMD2A-specific mechanical-support series exists. The evidence below is
    from pediatric dilated cardiomyopathy as a class and is marked PARTIAL
    accordingly. The Sorrentino 2023 CMD2A patients are reported to have
    required ECMO and ventricular assistance before transplantation, but that
    detail is in the paper's full text and is absent from the cached abstract,
    so it is deliberately not quoted here.
  evidence:
  - reference: PMID:42334151
    reference_title: Comparing Outcomes of Heartmate 3 and Heart Transplantation in Older Children With Dilated Cardiomyopathy-Can Transplantation be Delayed or Avoided?
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with end-stage dilated cardiomyopathy (DCM) usually undergo heart
      transplantation or a short-term bridge with a ventricular assist device.
    explanation: >-
      Establishes ventricular assist device support as the standard bridge step
      preceding transplantation in end-stage pediatric dilated cardiomyopathy.
      PARTIAL because the registry cohort is children aged 10-18 with DCM of any
      cause, not the infantile recessive TNNI3 subset.
  - reference: PMID:42249650
    reference_title: "Against all odds: Mechanical circulatory support as a bridge to pediatric heart transplant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 12-year-old girl with recurrent cardiac arrests underwent emergency LVAD
      implantation (EXCOR® Active) for 6 h for bridging to HTx.
    explanation: >-
      Documents emergency device implantation as a bridge to transplantation in
      a child with dilated cardiomyopathy and end-stage heart failure. PARTIAL
      because the reported patients are older children with DCM of unstated
      genetic cause rather than confirmed CMD2A.
- name: Heart Transplantation
  description: >-
    The only definitive therapy. Because the lesion is the permanent absence of a
    structural regulatory protein rather than a reversible insult, recovery of
    ventricular function is not expected, and transplantation is the endpoint for
    children who survive to reach it. In the recessive TNNI3 series,
    transplantation has been performed at 28 months for treatment-refractory

notes: >-
  GeneReviews baseline: no CMD2A- or TNNI3-specific GeneReviews chapter exists.
  The applicable chapter is the generic "Dilated Cardiomyopathy Overview"
  (PMID:20301486, Hershberger & Jordan, updated 2024), tagged above. Its PubMed
  record contains only the chapter's stated purpose and no Clinical
  Characteristics text, so it could not be used as a phenotype baseline; the
  phenotype set here is built from the primary CMD2A case literature and the
  Sorrentino review of biallelic TNNI3 loss-of-function patients instead.

  Scope note: this entry is deliberately restricted to the recessive,
  loss-of-function TNNI3 entity. The dominant TNNI3 missense diseases
  (hypertrophic CMH7, restrictive RCM1) are recorded here only as differential
  diagnoses and spectrum context, and belong to the Hypertrophic_Cardiomyopathy
  and restrictive entries respectively. PMID:38089682 is cited twice, for
  imaging findings and for treatment refractoriness in neonatal
  TNNI3-associated DCM, but that patient carried a de novo heterozygous variant
  with no variant in either parent, so it is not a CMD2A genotype; both
  citations are marked PARTIAL and the limitation is stated in each
  explanation.

  Curation caution — TNNI3 is not TNNI3K. TNNI3K (troponin I-interacting
  kinase, HGNC:19661) is a separate gene with its own, independently curated
  ClinGen DCM gene-disease relationship. TNNI3K knockout and cardiac-remodeling
  literature must not be used as evidence for this entry; it surfaced as a
  near-miss during the deep-research pass for this disorder.

  Deep-research provenance: Edison/FutureHouse Falcon
  (research/Dilated_Cardiomyopathy_2A-deep-research-falcon.md, 17 citations).
  The report was used as a lead-generation source only; every PMID, snippet, and
  ontology term in this entry was independently verified against the cached
  abstract or against OAK. Two Falcon claims were checked and NOT carried over:
  its assertion that both Sorrentino 2023 patients carried homozygous p.Arg98*
  (the abstract states one carried p.Arg98* and the other p.Arg69Alafs*8), and
  its report of compensatory TNNI1 upregulation in affected human myocardium,
  which is not stated in any abstract available in the reference cache. Falcon
  also failed to recover a MONDO identifier; MONDO:0012746 was resolved directly
  with OAK and matches the OMIM:611880 and TNNI3 anchors in the MONDO record.

- name: Left Ventricular Dilation and Systolic Failure
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The failing myofilament produces the defining organ-level phenotype:
    progressive left ventricular chamber enlargement with severely depressed
    ejection fraction, functional mitral regurgitation from annular dilation,
    and congestive heart failure. Reported infants have presented with left
    ventricular ejection fractions as low as 10%, and the resulting circulatory
    failure is what kills — one reported kindred lost three siblings in the
    first year of life. Because the primary lesion is a permanent absence of a
    structural regulatory protein rather than a modifiable stress, this node
    does not remit; neurohormonal therapy slows it but transplantation is the
    only definitive intervention.

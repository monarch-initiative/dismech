- category: Cardiovascular
  name: Dilated cardiomyopathy
  description: >-
    The defining phenotype: a dilated, poorly contracting left ventricle in the
    absence of abnormal loading conditions or coronary disease. In CMD2A it is
    typically severe and of neonatal or early infantile onset — the signature
    timing explained by the perinatal troponin I isoform switch, which leaves
    the ssTnI-supported fetal heart normal at birth and unmasks the cTnI-null
    state only as ssTnI is withdrawn.

experimental_models:
- name: Tnni3-null (cardiac troponin I knockout) mouse
  description: >-
    Germline deletion of the cardiac troponin I isoform by gene targeting in
    murine embryonic stem cells. The reference model for CMD2A, and unusually
    faithful to it: the mice are born healthy under slow skeletal troponin I
    cover, ssTnI declines from day 15, and the animals die of acute heart failure
    on day 18, reproducing the human pattern of a well neonate who decompensates
    once the isoform switch completes. Isolated ventricular myocytes provide the
    myofilament-level readouts (sarcomere length, resting tension, calcium
    sensitivity) that are not obtainable from patients.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  publication: PMID:9915769
  modeled_mechanisms:
  - target: Perinatal Troponin I Isoform Switch and Loss of ssTnI Compensation
    description: >-
      The model's central result is the timing of ssTnI withdrawal in a
      cTnI-null background and the consequent onset of failure.
    evidence:
    - reference: PMID:9915769
      reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        15 days after birth slow skeletal troponin I expression began a steady
        decline, giving rise to a troponin I deficiency
      explanation: >-
        The model's measurement of the ssTnI withdrawal schedule that this
        pathophysiology node describes.
  - target: Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
    description: >-
      Isolated ventricular myocytes supply the sarcomere-length, resting-tension,
      and calcium-sensitivity measurements of troponin I depletion.
    evidence:

    description: >-
      Recurrent frameshift allele. Reported homozygous in a consanguineous
      Tunisian family with three infants who died at about one year of age, and
      independently in the review series of biallelic TNNI3 loss-of-function
      patients. Classified pathogenic by ACMG criteria.

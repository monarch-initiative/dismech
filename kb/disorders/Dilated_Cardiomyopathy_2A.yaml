prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the recessive TNNI3 form
    of dilated cardiomyopathy. The entity is known from a small number of
    families, many of them consanguineous, and the literature is still at the
    case-series-plus-review stage: reports describe the biallelic TNNI3
    genotype as a rare cause of neonatal-onset DCM rather than assigning it a
    population frequency. In the ClinGen curation of 51 DCM genes, TNNI3 sat in
    the moderate-evidence tier for DCM overall in 2021 and was subsequently
    upgraded to Strong for both the dominant and the recessive relationship.
  evidence:
  - reference: PMID:36981019
    reference_title: "Homozygous TNNI3 Mutations and Severe Early Onset Dilated Cardiomyopathy: Patient Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the role of TNNI3 null mutations has been more debated due to the paucity
      and weak characterization of reported cases and the low penetrance of
      heterozygous genotypes
    explanation: >-
      Documents that the recessive TNNI3 entity rests on a small number of
      reported cases, which is why no population prevalence is available.
      PARTIAL because it characterizes the evidence base rather than measuring
      occurrence.
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven genes (14%; ACTC1, ACTN2, JPH2, NEXN, TNNI3, TPM1, VCL) including 2
      additional ontologies were classified as moderate evidence; these genes are
      likely to emerge as strong or definitive with additional evidence.
    explanation: >-
      Places TNNI3 among the minority (non-definitive at the time of curation)
      DCM genes, supporting the rarity statement. PARTIAL because it is a
      gene-evidence tier rather than a prevalence measurement, and it addresses
      TNNI3-DCM as a whole rather than the recessive subset.
inheritance:
- name: Autosomal Recessive
  description: >-
    CMD2A is transmitted as an autosomal recessive trait: affected individuals
    carry two loss-of-function TNNI3 alleles (homozygous in consanguineous
    families, compound heterozygous otherwise), while heterozygous parents and
    relatives are typically unaffected or show only low-penetrance disease. This
    recessive mode is what distinguishes CMD2A from the dominant TNNI3
    cardiomyopathies, and TNNI3 was the first gene shown to cause dilated
    cardiomyopathy in this manner.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15070570
    reference_title: Novel mutation in cardiac troponin I in recessive idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TNNI3 is the first recessive gene identified for this condition, and we
      suggest that other such genes could be pinpointed by mutation analyses
      designed to identify homozygous mutations.
    explanation: >-
      The founding CMD2A report explicitly establishes TNNI3 as a recessive
      dilated cardiomyopathy gene.
  - reference: CGGV:assertion_b89182f6-1574-48c6-832f-add41ffbaa4c-2025-04-18T160000.000Z
    reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AR | Strong
    explanation: >-
      ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel records an
      autosomal recessive TNNI3-DCM gene-disease relationship with Strong
      clinical validity, curated separately from the dominant relationship.
  - reference: PMID:38924380
    reference_title: Homozygous TNNI3 frameshift variant in a consanguineous family with lethal infantile dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous frameshift variant in the TNNI3 gene
      (c.204delG; p.(Arg69AlafsTer8)).
    explanation: >-
      Homozygosity for a truncating TNNI3 allele in a consanguineous family with
      three affected infant siblings and unaffected parents — the canonical
      recessive pedigree structure.
mechanistic_hypotheses:
- hypothesis_group_id: tnni3_null_isoform_switch_model
  hypothesis_label: cTnI-null / perinatal TnI isoform-switch model
  status: CANONICAL
  description: >-
    The canonical model holds that biallelic TNNI3 loss-of-function abolishes
    cardiac troponin I, and that the resulting disease is timed by the
    developmental troponin I isoform switch. In fetal and neonatal myocardium
    the slow skeletal isoform (ssTnI, TNNI1) occupies the troponin complex and
    substitutes functionally for cTnI, so a cTnI-null heart develops and is born
    structurally normal. ssTnI is then downregulated on its own developmental
    schedule regardless of whether cTnI is available to replace it, and the
    heart is left globally troponin I-deficient. Thin-filament regulation
    fails — sarcomeres shorten, resting (diastolic) tension rises, and
    myofilament calcium sensitivity under activating conditions falls — giving
    an abrupt, severe, and frequently lethal heart failure in the neonatal
    period or first months of life. The Tnni3-null mouse reproduces exactly this
    time course.
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking cardiac troponin I were born healthy, with normal heart and
      body weight, because a fetal troponin I isoform (identical to slow skeletal
      troponin I) compensated for the absence of cardiac troponin I. Compensation
      was only temporary, however, as 15 days after birth slow skeletal troponin
      I expression began a steady decline, giving rise to a troponin I
      deficiency.
    explanation: >-
      Directly demonstrates the isoform-switch timing that is the core of this
      model: normal birth under ssTnI cover, then decompensation when ssTnI is
      withdrawn.
- hypothesis_group_id: tnni3_residual_function_phenotype_model
  hypothesis_label: Residual-cTnI-dose model of dilated versus restrictive phenotype
  status: EMERGING
  description: >-
    An emerging refinement proposes that within the recessive TNNI3 allelic
    series it is the amount of residual cTnI function, not simply the presence of
    biallelic truncation, that determines whether the child develops dilated or
    restrictive cardiomyopathy. Complete absence of cTnI produces the systolic,
    dilated phenotype of CMD2A; a more distal nonsense allele that leaves a
    partially functional (though reduced-abundance) protein has been reported to
    produce severe pediatric restrictive cardiomyopathy instead. If correct, the
    recessive TNNI3 phenotype is a graded function of residual protein rather
    than a binary null state, and the CMD2A/RCM boundary is set by truncation
    position.
  evidence:
  - reference: PMID:41918167
    reference_title: A homozygous variant in cardiac troponin I3, TNNI3, causes severe pediatric restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In myocardial biopsies of the patient, TNNI3 protein abundance was
      diminished, suggesting that residual TNNI3 function may underlie RCM, while
      TNNI3 absence causes DCM.
    explanation: >-
      States the residual-function hypothesis explicitly and supplies the
      myocardial-biopsy protein-abundance observation it rests on. Marked
      EMERGING because it currently rests on a single reported patient.
pathophysiology:
- name: Biallelic TNNI3 Loss of Function
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TNNI3 encodes cardiac troponin I, the inhibitory subunit of the troponin
    complex and one of the three regulatory proteins (with troponin C and
    troponin T) that confer calcium sensitivity on the sarcomeric thin filament.
    CMD2A arises when both TNNI3 alleles are inactivated — most often by
    nonsense or frameshift variants (p.Arg69Alafs*8, p.Arg98*), but also by a
    synonymous variant creating a cryptic splice site with intron retention in
    trans with a whole-gene deletion. The lesion is a true loss of function
    rather than the dominant-negative or altered-function mechanism that
    characterizes the heterozygous TNNI3 missense variants responsible for
    hypertrophic and restrictive cardiomyopathy, which is why the disease is
    recessive and heterozygous carriers are largely spared.

- name: Perinatal Troponin I Isoform Switch and Loss of ssTnI Compensation
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    The heart expresses two troponin I isoforms under developmental control: the
    slow skeletal isoform (ssTnI, TNNI1) in fetal and early postnatal
    myocardium, replaced by cardiac troponin I (cTnI, TNNI3) as the heart
    matures. In a cTnI-null heart, ssTnI initially occupies the troponin complex
    and supports normal development, normal birth weight, and normal cardiac
    structure at birth. Critically, ssTnI downregulation proceeds on its own
    developmental schedule and is not held back by the absence of cTnI, so the
    myocardium passes from ssTnI-supported regulation to no troponin I at all.
    This node explains the entity's most distinctive clinical feature — a well
    child who decompensates abruptly in the neonatal period or first months —
    and is why CMD2A is a disease of infancy rather than of adulthood like most
    sarcomeric cardiomyopathy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of striated muscle contraction
    term:
      id: GO:0006942
      label: regulation of striated muscle contraction
    modifier: ABSENT
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results show that (1) developmental downregulation of slow skeletal
      troponin I occurs even in the absence of cardiac troponin I and (2) the
      resultant troponin I depletion alters specific mechanical properties of
      myocardium and can lead to a lethal form of acute heart failure.
    explanation: >-
      Establishes both halves of this node: ssTnI is withdrawn regardless of
      cTnI status, and the resulting global troponin I depletion is what causes
      lethal heart failure. Model organism evidence; the corresponding human
      claim is the neonatal-onset timing documented in the patient reports.
  - reference: PMID:26526134
    reference_title: "TNNI1, TNNI2 and TNNI3: Evolution, regulation, and protein structure-function relationships."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vertebrate TnI has evolved into three isoforms encoded by three homologous
      genes: TNNI1 for slow skeletal muscle TnI, TNNI2 for fast skeletal muscle
      TnI and TNNI3 for cardiac TnI, which are expressed under muscle
      type-specific and developmental regulations.
    explanation: >-
      Documents the developmentally regulated TnI isoform system on which the
      ssTnI-compensation mechanism depends. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
    causal_link_type: DIRECT
    hypothesis_groups:
    - tnni3_null_isoform_switch_model

- name: Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Without any troponin I, the thin filament loses the inhibitory element that
    normally keeps tropomyosin over the myosin-binding sites at low calcium and
    that transduces calcium binding at troponin C into cooperative filament
    activation. The measured consequence in troponin I-depleted ventricular
    myocytes is a combined systolic and diastolic defect: sarcomeres are
    shortened and resting tension is elevated under relaxing conditions, while
    myofilament calcium sensitivity is reduced under activating conditions.
    Contraction is therefore both incompletely switched off between beats and
    inefficiently switched on during systole, degrading net pump performance.
    In the recessive human allelic series the severity of this regulatory
    failure appears to track residual cTnI abundance.
  cell_types:
  - preferred_term: Cardiac ventricular myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac muscle contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: DECREASED
  - preferred_term: Regulation of cardiac muscle cell contraction
    term:
      id: GO:0086004
      label: regulation of cardiac muscle cell contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9915769
    reference_title: "Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ventricular myocytes isolated from these troponin I-depleted hearts
      displayed shortened sarcomeres and elevated resting tension measured under
      relaxing conditions and had a reduced myofilament Ca sensitivity under
      activating conditions.
    explanation: >-
      Supplies the specific myofilament mechanics of troponin I depletion —
      elevated diastolic tension plus reduced calcium sensitivity — that this
      node asserts.
  - reference: PMID:15070570
    reference_title: Novel mutation in cardiac troponin I in recessive idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed impairment of troponin interactions that could
      lead to diminished myocardial contractility.
    explanation: >-
      Human-variant functional data linking the recessive TNNI3 lesion to
      impaired troponin interactions and reduced contractility. Classified
      IN_VITRO because the functional studies were biochemical assays of
      troponin interaction rather than patient observations.
  downstream:

diagnosis:
- name: SETD2 molecular genetic testing
  description: >-
    Diagnosis rests on identifying a heterozygous SETD2 variant, usually by
    exome sequencing in a child with overgrowth and developmental delay.
    Interpretation must place the variant within the SETD2 allelic series, since
    codon-1740 missense variants indicate RAPAS or MRD70 rather than LLS.
  evidence:
  - reference: PMID:37025455
    reference_title: "A novel SETD2 variant causing global development delay without overgrowth in a Chinese 3-year-old boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood samples of the proband and his parents were collected for
      next-generation sequencing including whole-exome sequencing (WES), copy
      number variation (CNV) detection and mitochondrial DNA sequencing.
    explanation: >-
      Illustrates the trio exome-sequencing route by which SETD2 variants are
      identified in practice.
treatments:
- name: Nutritional Management of Obesity
  description: >-
    Diet and exercise directed at the obesity that accompanies the overgrowth
    phenotype, with weight monitoring beginning in the second year of life. This
    is the one disorder-specific management priority in Luscan-Lumish syndrome
    rather than generic supportive care: obesity is an expected part of the
    phenotype, and two independent sources single out its prevention.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:34978780
    reference_title: "SETD2 Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutritional management of obesity to include diet/exercise
    explanation: >-
      States the recommended management of the obesity component in GeneReviews.
  - reference: PMID:29681085
    reference_title: Two novel cases expanding the phenotype of SETD2-related overgrowth syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, prevention of obesity should be an important point of
      attention for patients diagnosed with a SETD2-related overgrowth syndrome.
    explanation: >-
      Independent report reaching the same management recommendation, which is
      why this is curated as a named treatment rather than folded into generic
      supportive care.
- name: Developmental and Rehabilitative Therapy
  description: >-
    Standard treatment for developmental delay and autistic features, alongside
    management of hypotonia and hypermobility.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34978780
    reference_title: "SETD2 Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      standard treatment for developmental delay / autistic features, seizures,
      hypothyroidism, precocious puberty, hypotonia/hypermobility, scoliosis,
      refractive error / strabismus, hearing loss, congenital heart defects, and
      cryptorchidism
    explanation: >-
      GeneReviews prescribes standard-of-care management across the
      neurodevelopmental and systemic manifestations; no SETD2-directed therapy
      exists.
- name: Surveillance for Treatable Comorbidity
  description: >-
    Structured monitoring rather than treatment: annual thyroid function, and
    clinical evaluation for precocious puberty and scoliosis at each childhood
    visit. Curated because these are the manifestations that are silent until
    screened for and are treatable once found.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34978780
    reference_title: "SETD2 Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      annual thyroid-stimulating hormone and free T4; clinical evaluation for
      precocious puberty and scoliosis at each visit during childhood
    explanation: >-
      States the specific surveillance schedule recommended for this disorder.
- name: Genetic Counseling
  description: >-
    Autosomal dominant inheritance with most affected individuals representing
    simplex cases; 50% transmission risk from an affected parent, and prenatal
    and preimplantation testing available once the familial variant is known.

name: Luscan-Lumish Syndrome
creation_date: "2026-08-22T19:05:00Z"
category: Genetic
synonyms:
- LLS
- SETD2-related overgrowth syndrome
- Sotos-like syndrome due to SETD2 variants
description: >
  Luscan-Lumish syndrome is a Mendelian disorder of the epigenetic machinery
  caused by heterozygous loss-of-function variants in SETD2, the enzyme
  non-redundantly responsible for trimethylation of histone H3 at lysine 36
  (H3K36me3). It sits in the **writer** class, and it was found by looking for
  it: reasoning that Sotos syndrome (NSD1, H3K36) and Weaver syndrome (EZH2,
  H3K27) are both caused by writers of those two chromatin marks, Luscan and
  colleagues sequenced the other H3K36- and H3K27-methylation genes in
  "Sotos-like" patients without NSD1 or EZH2 lesions and recovered SETD2. The
  phenotype is postnatal overgrowth with macrocephaly, tall stature, intellectual
  disability, speech and motor delay, and autism spectrum disorder.

  **SETD2 is one gene with three nosologically distinct disorders, and this entry
  is only one of them.** Luscan-Lumish syndrome follows loss of function.
  A recurrent de novo missense at codon 1740, p.Arg1740Trp, instead causes
  Rabin-Pappas syndrome (RAPAS) - severely impaired development with
  **microcephaly**, hypotonia, feeding difficulty and failure to thrive, i.e.
  growth failure in the *opposite* direction from LLS. A different substitution
  at the same residue, p.Arg1740Gln, causes a third and milder entity,
  intellectual developmental disorder autosomal dominant 70 (MRD70). The
  proposed explanation for the divergence is a gain-of-function or altered
  epigenetic-regulatory effect of the codon-1740 missense variants rather than
  simple dosage loss - which is why this entry is curated at
  loss-of-function LLS and does not absorb the other two. See the discussion
  block: this allelic series is an argument against reading "SETD2 variant" as a
  single diagnosis.

    **The nosology is genuinely unsettled, and this entry follows MONDO rather
    than GeneReviews.** OMIM and MONDO split these as three entities, and this
    entry exists under the MONDO term for one of them. GeneReviews instead
    describes a single spectrum, "SETD2 neurodevelopmental disorders", within
    which the p.Arg1740Trp phenotype is a named sub-form (SETD2-NDD with
    multiple congenital anomalies) rather than a separate disease. Both readings
    agree on the biology - that codon-1740 substitutions behave differently from
    truncating loss of function - and disagree only on whether that difference
    warrants separate disease identity. Curators arriving from the GeneReviews
    framing should expect this entry to be narrower in scope than that chapter.

  Overgrowth is characteristic but not obligate. Frameshift and nonsense variants
  account for about two thirds of reported SETD2 lesions, and cases with
  loss-of-function variants and developmental delay *without* overgrowth are
  reported, so absence of overgrowth does not exclude the diagnosis.

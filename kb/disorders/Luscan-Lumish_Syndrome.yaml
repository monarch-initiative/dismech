notes: >-
  Curated as part of a review of Mendelian intellectual disability coverage; the
  disorder was absent from kb/disorders and open in stubs/. Conforms to the
  `epigenetic_machinery_neurodevelopmental_dysregulation` module as a
  **writer-class** conformer, complementing Beck-Fahrner syndrome (eraser class,
  DNA arm) and the histone-acetylation and remodeler conformers already wired.

  Prevalence is not curated: the incidence is explicitly reported as unclear.

  The SETD2 allelic series (LLS / RAPAS / MRD70) is recorded as a discussion
  rather than as `has_subtypes`, because RAPAS and MRD70 are described in the
  source as nosologically distinct entities with their own OMIM numbers and a
  probably different (gain-of-function) mechanism, not as severity grades of
  this entry. If they are curated later they should be separate entries.

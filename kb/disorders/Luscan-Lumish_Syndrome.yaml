genetic:
- name: SETD2
  gene_term:
    preferred_term: SETD2
    term:
      id: hgnc:18420
      label: SETD2
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous loss-of-function SETD2 variants cause Luscan-Lumish syndrome.
    Frameshift and nonsense variants predominate among reported SETD2 lesions.
  evidence:
  - reference: PMID:24852293
    reference_title: "Mutations in SETD2 cause a novel overgrowth condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two heterozygous mutations in the SETD2 gene in two patients
      with 'Sotos-like' syndrome: one missense p.Leu1815Trp de novo mutation in a
      boy and one nonsense p.Gln274* mutation in an adopted girl.
    explanation: >-
      The original gene-discovery observation establishing SETD2 as causal in
      this overgrowth phenotype.
  - reference: PMID:37025455
    reference_title: "A novel SETD2 variant causing global development delay without overgrowth in a Chinese 3-year-old boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Frameshift mutations and non-sense mutations account for 68.5% of the total
      51 SETD2 point mutations, suggesting that Luscan-Lumish syndrome is likely
      due to loss of function of SETD2.
    explanation: >-
      Quantifies the predominance of truncating variants in the reported SETD2
      mutation spectrum, and states the loss-of-function conclusion the authors
      draw from it - which is the mechanism this entry curates.
pathophysiology:
- name: SETD2 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variation halves the dosage of SETD2, a SET
    domain histone methyltransferase. This places Luscan-Lumish syndrome in the
    writer class of the epigenetic machinery, alongside NSD1 in Sotos syndrome
    and EZH2 in Weaver syndrome.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  molecular_functions:
  - preferred_term: histone H3K36 methyltransferase activity (SETD2)
    term:
      id: GO:0046975
      label: histone H3K36 methyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24852293
    reference_title: "Mutations in SETD2 cause a novel overgrowth condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NSD1 and EZH2 are both histone-modifying enzymes. These two epigenetic
      writers catalyse two specific post-translational modifications of histones:
      methylation of histone 3 lysine 36 (H3K36) and lysine 27 (H3K27).
    explanation: >-
      Context, not direct evidence for this node: the quoted sentence is about
      NSD1 and EZH2 and does not mention SETD2. It is cited because it
      establishes the writer-class framing that motivated the search for SETD2
      and situates this disorder among the overgrowth chromatinopathies. The
      SETD2 loss-of-function claim itself rests on the next evidence item.
  - reference: PMID:37025455
    reference_title: "A novel SETD2 variant causing global development delay without overgrowth in a Chinese 3-year-old boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conservative analysis and structural analysis showed that the novel
      pathogenic variant would loss the conserved domains in the C-terminal
      region and result in loss of function of SETD2 protein.
    explanation: >-
      Direct evidence that a disease-causing SETD2 variant acts by loss of
      function, which is the mechanism this trigger node models.
  downstream:
  - target: Deficient Histone H3K36 Trimethylation
    causal_link_type: DIRECT

- name: Deficient Histone H3K36 Trimethylation
  description: >-
    SETD2 is non-redundantly responsible for H3K36 trimethylation, so reduced
    SETD2 dosage cannot be compensated by another methyltransferase and H3K36me3
    falls. H3K36me3 is a permissive, transcription-coupled mark, so its loss
    shifts the balance of chromatin states at SETD2 target loci - the same
    permissive-repressive imbalance the module models, reached here through a
    histone rather than a DNA mark.
  role: amplifier
  biological_scale: MOLECULAR
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: chromatin
    term:
      id: GO:0000785
      label: chromatin
  evidence:
  - reference: PMID:24852293
    reference_title: "Mutations in SETD2 cause a novel overgrowth condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SETD2 is non-redundantly responsible for H3K36 trimethylation.
    explanation: >-
      Establishes non-redundancy, which is what makes halved SETD2 dosage
      translate into an uncompensated loss of the H3K36me3 mark.
  - reference: PMID:28202515
    reference_title: Systematic In Vivo Inactivation of Chromatin-Regulating Enzymes Identifies Setd2 as a Potent Tumor Suppressor in Lung Adenocarcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Setd2 inactivation and subsequent loss of H3K36me3
    explanation: >-
      Independent in vivo confirmation that inactivating Setd2 causes loss of
      H3K36me3. Cited only for the enzyme-to-mark link; the tumour-suppressor
      context of this paper is a somatic-cancer mechanism and is NOT part of the
      Luscan-Lumish chain.
  downstream:
  - target: Dysregulated Developmental Gene Expression
    causal_link_type: DIRECT

- name: Dysregulated Developmental Gene Expression
  description: >-
    Loss of the permissive H3K36me3 mark dysregulates the developmental
    transcriptional programs at SETD2 target loci. This is the shared, rate-limiting
    step across the chromatinopathies and the point at which Luscan-Lumish
    syndrome converges with Sotos and Weaver syndromes despite acting on
    different marks.
  role: central_effector
  biological_scale: MOLECULAR
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: LOSS_OF_FUNCTION
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: DECREASED
  evidence:
  - reference: PMID:28202515
    reference_title: Systematic In Vivo Inactivation of Chromatin-Regulating Enzymes Identifies Setd2 as a Potent Tumor Suppressor in Lung Adenocarcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      H3K36me3 marks nucleosomes positioned along actively transcribed gene
      bodies, and its loss has been found to disrupt diverse chromatin-related
      activities such as gene splicing, DNA repair, transcriptional elongation,
      DNA methylation, and maintenance of genome integrity
    explanation: >-
      Supplies the missing mechanistic link into this node: H3K36me3 is a mark of
      actively transcribed gene bodies, and losing it disrupts transcriptional
      elongation among other chromatin-dependent processes. Evidence source is
      OTHER because this is a background statement summarising established
      H3K36me3 biology in the introduction of the cited paper, not that paper's
      own experimental result; its lung-adenocarcinoma findings are a
      somatic-cancer mechanism and are not part of this chain.
  - reference: PMID:29681085
    reference_title: Two novel cases expanding the phenotype of SETD2-related overgrowth syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SETD2-related overgrowth syndrome is also called "Luscan-Lumish
      syndrome" (OMIM 616831) with the clinical characteristics of intellectual
      disability, speech delay, macrocephaly, facial dysmorphism, and autism
      spectrum disorders.
    explanation: >-
      Independent report tying the SETD2 lesion to the same composite
      developmental output, supporting this node as the shared step between the
      chromatin defect and the clinical phenotype.
  downstream:
  - target: Overgrowth and Neurodevelopmental Phenotype
    causal_link_type: DIRECT

- name: Overgrowth and Neurodevelopmental Phenotype
  description: >-
    The clinical output: postnatal overgrowth with macrocephaly and tall stature,
    intellectual disability, speech and motor delay, and autism spectrum disorder.
    The growth direction is the reverse of most chromatinopathies and the reverse
    of the RAPAS entity caused by codon-1740 missense variants in the same gene.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Intellectual Disability with Growth and Craniofacial Dysmorphism"
  biological_processes:
  - preferred_term: learning or memory
    term:
      id: GO:0007611
      label: learning or memory
    modifier: DECREASED
  evidence:
  - reference: PMID:37372360
    reference_title: "Clinical Heterogeneity and Different Phenotypes in Patients with SETD2 Variants: 18 New Patients and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an overgrowth disorder with multisystem involvement including intellectual
      disability, speech delay, autism spectrum disorder (ASD), macrocephaly,
      tall stature, and motor delay.
    explanation: >-
      States the composite clinical output of the chain in a review of 18 new
      plus 33 previously reported patients.

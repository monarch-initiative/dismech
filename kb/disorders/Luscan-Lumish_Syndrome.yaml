diagnosis:
- name: SETD2 molecular genetic testing
  description: >-
    Diagnosis rests on identifying a heterozygous SETD2 variant, usually by
    exome sequencing in a child with overgrowth and developmental delay.
    Interpretation must place the variant within the SETD2 allelic series, since
    codon-1740 missense variants indicate RAPAS or MRD70 rather than LLS.
  evidence:
  - reference: PMID:37025455
    reference_title: "A novel SETD2 variant causing global development delay without overgrowth in a Chinese 3-year-old boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood samples of the proband and his parents were collected for
      next-generation sequencing including whole-exome sequencing (WES), copy
      number variation (CNV) detection and mitochondrial DNA sequencing.
    explanation: >-
      Illustrates the trio exome-sequencing route by which SETD2 variants are
      identified in practice.
differential_diagnoses:
- name: Sotos syndrome
  description: >-
    The archetypal overgrowth chromatinopathy, caused by NSD1 variants. SETD2 was
    identified precisely by sequencing H3K36-methylation genes in "Sotos-like"
    patients who had no NSD1 abnormality.
  evidence:
  - reference: PMID:24852293
    reference_title: "Mutations in SETD2 cause a novel overgrowth condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two heterozygous mutations in the SETD2 gene in two patients
      with 'Sotos-like' syndrome
    explanation: >-
      The original probands were ascertained as Sotos-like, establishing Sotos
      syndrome as the primary differential.
- name: Weaver syndrome
  description: >-
    Overgrowth condition caused by EZH2, the H3K27 methyltransferase; the other
    arm of the writer-disorder pair that motivated the search for SETD2.
  evidence:
  - reference: PMID:24852293
    reference_title: "Mutations in SETD2 cause a novel overgrowth condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, Sotos and Weaver syndromes are clinically well defined and due
      to heterozygous mutations in NSD1 and EZH2, respectively.
    explanation: >-
      Establishes Weaver syndrome and its gene as the co-differential within the
      overgrowth chromatinopathies.
discussions:
- discussion_id: setd2_allelic_series_lls_rapas_mrd70
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do loss-of-function SETD2 variants cause overgrowth with macrocephaly
    (Luscan-Lumish syndrome) while recurrent missense variants at codon 1740 of
    the same gene cause microcephaly and growth failure (Rabin-Pappas syndrome)
    or a milder isolated intellectual disability (MRD70)?
  attaches_to:
  - "pathophysiology#SETD2 Haploinsufficiency"
  rationale: >-
    This is a genuine and unresolved mechanistic problem, not a severity
    gradient. Three nosologically distinct entities with separate OMIM numbers
    arise from one gene, and two of them run in opposite growth directions. The
    p.Arg1740Trp substitution produces RAPAS with microcephaly, hypotonia,
    feeding difficulty and failure to thrive; a different substitution at the
    very same residue, p.Arg1740Gln, produces the milder MRD70; and truncating
    variants across the gene produce the overgrowth phenotype curated in this
    entry. A simple dosage model cannot accommodate this, and the authors who
    delineated the series propose gain of function or an altered
    epigenetic-regulatory effect for the codon-1740 variants without
    demonstrating either. Until that is resolved, the practical consequence for
    curation is concrete: a SETD2 variant is not by itself a Luscan-Lumish
    diagnosis, and the entity must be assigned from the variant class.
  proposed_experiments:
  - experiment_id: setd2_r1740_functional_dissection
    name: Functional dissection of the codon-1740 substitutions
    description: >-
      Compare H3K36me3 levels, SETD2 chromatin occupancy and transcriptomes in
      isogenic cells carrying SETD2 p.Arg1740Trp, p.Arg1740Gln, a truncating
      allele, and a full knockout, to establish whether the codon-1740 variants
      act as gain-of-function or dominant-negative alleles rather than by dosage
      loss, and whether the growth-direction reversal tracks a distinct
      transcriptional signature.

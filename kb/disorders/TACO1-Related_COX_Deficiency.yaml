      Mendelian autosomal recessive nuclear-encoded mitochondrial disorder;
      Harrison's covers primary mitochondrial diseases under the
      genetics/environment Part.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of mitochondrial oxidative phosphorylation (isolated
      Complex IV deficiency) impairing cellular bioenergetics.
  - classification_value: NEUROLOGIC
    notes: >-
      Presents as a late-onset, slowly progressive Leigh syndrome with bilateral
      basal ganglia lesions, dystonia, cognitive decline, and visual impairment.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Nuclear-encoded defect of mitochondrial COX I translation and Complex IV
      biogenesis; a primary mitochondrial disease.
  icimd_category:
  - classification_value: complex_iv_subunits_and_assembly_factors
    notes: >-
      ICIMD category 7, group "Nuclear-encoded complex IV subunit and assembly
      factor defects" under "Disorders of nuclear-encoded oxidative
      phosphorylation"; TACO1 encodes a specific translational activator of
      mtDNA-encoded COX I required for Complex IV assembly.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    TACO1-related COX deficiency is inherited in an autosomal recessive manner
    and caused by biallelic pathogenic variants in TACO1.
  evidence:
  - reference: PMID:20727754
    reference_title: "Clinical and neuropathological findings in patients with TACO1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the clinical and neuroimaging findings of five members of a big consanguinous family homozygous for c.472insC in TACO1."
    explanation: >-
      Homozygosity for c.472insC in five affected members of a consanguineous
      pedigree establishes autosomal recessive inheritance.
prevalence:
- population: Worldwide (literature case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultrarare cause of Leigh syndrome; five affected members of a consanguineous
    family were reported in the founding kindred, and a subsequent screen of 17
    patients with juvenile-onset Leigh syndrome and isolated COX or combined
    respiratory chain deficiency detected no TACO1 mutations.
  evidence:
  - reference: PMID:20727754
    reference_title: "Clinical and neuropathological findings in patients with TACO1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TACO1 analysis showed no mutations in 17 patients with juvenile-onset Leigh syndrome and isolated COX or combined respiratory chain deficiency, indicating that TACO1 mutations are a rare cause of Leigh syndrome."
    explanation: >-
      Establishes that TACO1 mutations are a rare cause of juvenile-onset Leigh
      syndrome.
progression:
- phase: Childhood- to Adolescent-Onset Slowly Progressive Leigh Syndrome
  age_range: 4 to 16 years at onset, progressing into adulthood
  notes: >-
    Patients have an uneventful early childhood followed by subtle onset of
    slowly progressive cognitive dysfunction, dystonia, or visual impairment
    between ages 4 and 16 years, with milder progression and preserved
    ambulation into the late twenties in affected females.
  evidence:
  - reference: PMID:20727754
    reference_title: "Clinical and neuropathological findings in patients with TACO1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 5 patients had an uneventful early childhood and a subtle onset, slowly progressive cognitive dysfunction, dystonia or visual impairment between ages 4 and 16years. Affected girls had a milder phenotype and preserved ambulation into the late twenties."
    explanation: >-
      Documents the childhood-to-adolescent onset (4-16 years) and slowly
      progressive course into adulthood.

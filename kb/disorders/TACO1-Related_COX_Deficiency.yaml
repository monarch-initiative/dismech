diagnosis:
- name: TACO1 molecular genetic testing
  description: >
    Targeted gene sequencing or exome sequencing identifies homozygous pathogenic
    variants in TACO1 (CCDC44), establishing the definitive molecular diagnosis.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic TACO1 variants; all reported patients to date are homozygous (consanguineous families).
  evidence:
  - reference: PMID:19503089
    reference_title: "Mutation in TACO1, encoding a translational activator of COX I, results in cytochrome c oxidase deficiency and late-onset Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped the defect to chromosome 17q by functional complementation and identified a homozygous single-base-pair insertion in CCDC44, encoding a member of a large family of hypothetical proteins containing a conserved DUF28 domain."
    explanation: Establishes molecular identification of biallelic TACO1 (CCDC44) mutations as diagnostic.

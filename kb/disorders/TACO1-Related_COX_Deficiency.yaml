differential_diagnoses:
- name: Other genetic causes of juvenile-onset Leigh syndrome
  description: >
    Other nuclear- or mtDNA-encoded causes of juvenile-onset Leigh syndrome
    present with overlapping basal ganglia lesions and cytochrome c oxidase or
    combined respiratory chain deficiency and require molecular genetic testing
    to distinguish from TACO1 deficiency.
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  distinguishing_features:
  - Identification of biallelic pathogenic TACO1 variants and selective defect in mtDNA-encoded COX I synthesis
  evidence:
  - reference: PMID:20727754
    reference_title: "Clinical and neuropathological findings in patients with TACO1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TACO1 analysis showed no mutations in 17 patients with juvenile-onset Leigh syndrome and isolated COX or combined respiratory chain deficiency, indicating that TACO1 mutations are a rare cause of Leigh syndrome."
    explanation: Distinguishes TACO1 deficiency from other genetic causes of juvenile-onset Leigh syndrome with isolated COX or combined respiratory chain deficiency.
- name: Other nuclear-encoded mitochondrial complex IV deficiencies
  description: >
    Nuclear-encoded COX structural-subunit or assembly-factor deficiencies
    (such as SURF1, SCO1, SCO2, COX10, or COX15) also cause isolated Complex IV
    deficiency, with distinct assembly defects rather than a selective COX I
    translational defect.
  disease_term:
    preferred_term: mitochondrial complex IV deficiency, nuclear-type
    term:
      id: MONDO:0033885
      label: mitochondrial complex IV deficiency, nuclear-type
  distinguishing_features:
  - Specific translational defect in synthesis of the mtDNA-encoded COX I subunit caused by biallelic TACO1 variants
  evidence:
  - reference: PMID:19503089
    reference_title: "Mutation in TACO1, encoding a translational activator of COX I, results in cytochrome c oxidase deficiency and late-onset Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a specific defect in the synthesis of the mitochondrial DNA (mtDNA)-encoded COX I subunit in a pedigree segregating late-onset Leigh syndrome and cytochrome c oxidase (COX) deficiency."
    explanation: Distinguishes TACO1 deficiency from other COX deficiencies by its specific defect in synthesis of the mtDNA-encoded COX I subunit and late-onset Leigh presentation.
treatments:
- name: Supportive and Metabolic Care
  description: >
    No curative therapy; supportive management of the encephalopathy, dystonia,
    visual impairment, and lactic acidosis, with surveillance for metabolic
    decompensation.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  TACO1 (CCDC44) is mechanistically distinct from the other curated nuclear
  Complex IV assembly factors: rather than a structural subunit, copper
  metallochaperone (SCO1/SCO2), or heme A biosynthesis enzyme (COX10/COX15), it
  is a mitochondrial mRNA translational activator specific for the mtDNA-encoded
  COX I (MT-CO1) core subunit. The original kindred showed a notably mild, late
  course with milder disease in affected girls (sex-modifying effect). TACO1
  mutations are a rare cause of Leigh syndrome.

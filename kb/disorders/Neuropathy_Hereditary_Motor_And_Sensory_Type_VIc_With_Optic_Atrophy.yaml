      id: HP:0002460
      label: Distal muscle weakness
  notes: >-
    No evidence block. No PDXK-specific trial or cohort evidence exists, and
    citing a general Charcot-Marie-Tooth source would misrepresent it as being
    about this entity.
- name: Ankle-Foot Orthoses
  description: >-
    External bracing for foot drop and the steppage gait it produces. A device,
    not a behavioural intervention, and separated from physical therapy here so

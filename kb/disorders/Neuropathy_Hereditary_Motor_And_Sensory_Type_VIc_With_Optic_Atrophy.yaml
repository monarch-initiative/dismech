    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vision was reduced (including color vision) and fundoscopy confirmed
      bilateral optic atrophy in both cases (see Fig 1C).
    explanation: >-
      Documents the optic atrophy and its functional consequence in the
      founding family.
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients developed optic nerve atrophy between 29 and 50 years, while
      only two Iranian patients had optic nerve atrophy manifestation at age 10.
    explanation: >-
      Establishes the wide and typically late age range of the optic arm.
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only a slight thinning of the retinal nerve fiber layer in the

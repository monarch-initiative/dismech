prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Thirteen patients from six families had been reported worldwide as of the
    most recent review. No prevalence, incidence, penetrance or carrier
    frequency estimate exists, and none should be inferred from the wider
    Charcot-Marie-Tooth population figures, which describe a group of more than
    a hundred genes of which this is one of the rarest.
  evidence:
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only four missense variants have been reported in 13 patients
      from six families.
    explanation: >-
      Gives the total number of reported patients and families, which is the
      only defensible occurrence statement for this entity.
diagnosis:
- name: Plasma B6 Vitamer Profile
  description: >-
    Measuring the full B6 vitamer panel rather than PLP alone is what localizes
    the lesion: PLP is selectively low while pyridoxal, pyridoxine, pyridoxamine
    and 4-pyridoxic acid are not. A PLP within the reference range does not
    exclude the diagnosis, since one reported patient's value was normal but
    about 2.5-fold below her parents'.
  evidence:
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although our patient's plasma PLP level was within the reference range, it
      was approximately 2.5-fold lower than that observed in her parents.
    explanation: >-
      Documents the false-negative risk of relying on the reference range alone.
- name: Erythrocyte Pyridoxal Kinase Activity
  description: >-
    Enzyme activity can be assayed directly in dried blood spots, which supports
    a functional call on a variant of uncertain significance. One caveat is
    documented: an insertion in the erythroid-specific promoter of the gene can
    itself lower erythrocyte activity, so a low result is not automatically
    attributable to the coding variant under investigation.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An insertion located in the erythroid-specific promoter region of PL
      kinase has been associated with reduced erythrocyte PDXK activity.
    explanation: >-
      Records the confounder that limits interpretation of a low erythrocyte
      activity result.
- name: PDXK Molecular Genetic Testing
  description: >-
    Sequencing PDXK is the definitive test, and the founding study recommends
    screening for it in any early-onset autosomal recessive polyneuropathy
    precisely because a treatment exists. A missense variant should additionally
    be assessed for splice disruption, since one reported allele acts that way.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, we recommend that PDXK mutations should be screened for in
      patients with autosomal recessive early onset polyneuropathy, and
      supplementation with PLP should be started promptly with long-term
      monitoring of clinical outcomes.
    explanation: >-
      The authors' explicit testing and treatment recommendation.
differential_diagnoses:
- name: Pyridoxine-Induced Sensory Neuropathy
  description: >-
    The most specific differential, and the one that turns on the same axis as
    the disease itself. Excessive pyridoxine intake causes a sensory peripheral
    neuropathy, and the proposed mechanism is inhibition of pyridoxal kinase,
    so high-dose vitamin B6 produces pharmacologically what PDXK variants
    produce genetically. It is not rare: reported prevalence in two neuropathy
    cohorts was between 2.5% and 12.4%, and cases have occurred at doses near
    or below the European tolerable upper intake level.
  distinguishing_features:
  - Acquired, with an exposure history and no family history.
  - Predominantly or purely sensory and often small-fibre, whereas the genetic
    disease is sensorimotor with distal wasting and areflexia.
  - No optic atrophy.
  - Circulating B6 vitamers are high rather than low. This is the decisive
    laboratory discriminator, since plasma PLP is reduced in the genetic
    disease.
  - Improves on stopping the supplement.
  evidence:
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent reports on hereditary neuropathy due to pyridoxal kinase (PDXK)
      mutations may provide some insight into the mechanism, as genetic
      deficiencies in PDXK lead to the development of axonal sensory neuropathy.
      High circulating concentrations of PN may lead to a similar condition via
      the inhibition of PDXK.
    explanation: >-
      States the mechanistic convergence explicitly: pyridoxine toxicity is
      proposed to act by inhibiting the same enzyme this disease disables
      genetically, which is why the two phenocopy each other.
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While the incidence of PN-induced neuropathy in humans is likely low,
      reports by neuropathic centers indicate that it may be more widespread
      than previously thought, with a prevalence in 2 cohorts of neuropathy
      patients between 2.5% and 12.4%.
    explanation: >-
      Establishes that this differential is common enough in neuropathy clinics
      to matter, unlike the genetic disease.
- name: UCHL1-Related Spastic Paraplegia Type 79
  description: >-
    An autosomal recessive disorder combining early-onset cerebellar ataxia,
    spastic paraplegia and optic atrophy. It shares the recessive inheritance,
    the childhood onset and the optic atrophy, which is the combination that
    makes PDXK neuropathy recognizable in the first place.
  distinguishing_features:
  - Spasticity and cerebellar ataxia dominate, neither of which belongs to PDXK
    neuropathy.
  - Motor signs are upper-motor-neuron rather than the lower-motor-neuron,
    length-dependent, areflexic pattern of PDXK neuropathy.
  - Plasma PLP is normal and there is no response to PLP replacement.
  evidence:
  - reference: PMID:39083076
    reference_title: The evolving spectrum of complex inherited neuropathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal recessive missense variants in Ubiquitin C-terminal hydrolase L1
      (UCHL1) are a recognised cause of autosomal recessive spastic paraplegia
      type 79 (SPG79) which is characterised by early onset cerebellar ataxia,
      spastic paraplegia and optic atrophy
    explanation: >-
      Names a recessive childhood-onset disorder combining neuropathy-adjacent
      features with optic atrophy, the overlap this differential turns on.
discussions:
- discussion_id: pdxk_cns_sparing_versus_neonatal_seizures
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is pyridoxal kinase activity really preserved in the brain in PDXK
    deficiency, given that two reported patients had vitamin-B6-dependent
    neonatal seizures?
  attaches_to:
  - pathophysiology#Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
  rationale: >-
    A tissue-sparing account was offered to explain why a disease of a
    ubiquitous cofactor-producing enzyme presents as a peripheral neuropathy
    with no central features. Rat data show that in B6 deficiency pyridoxal
    kinase activity falls in liver, muscle and plasma while brain activity and
    B6 supply are maintained, and reviews have generalized this to state that in
    PDXK-related Charcot-Marie-Tooth disease the impairment is limited to
    peripheral signalling. Two 2026 patients contradict that generalization:
    both had neonatal seizures that responded to pyridoxine, years before any
    neuropathy, and their older sibling died at six months of drug-resistant
    epilepsy without ever having had a pyridoxine trial. Either the sparing is
    partial and allele-dependent, or it holds in the mature brain but not the
    neonatal one, or it does not hold at all and earlier cohorts simply did not
    include neonates. The distinction is not academic: if central involvement is
    real, a neonate with B6-responsive seizures and no ALDH7A1 variant should be
    tested for PDXK, and the two 2026 patients waited years for that test.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In rats, B6 deficiency leads to rapid decreases in PDXK activity in the
      peripheries (liver, muscle, and plasma), with maintained PDXK activity and
      B6 supply in the brain.
    explanation: >-
      The animal observation on which the tissue-sparing account rests.
  - reference: PMID:37508330
    reference_title: "The Therapeutic Potential of Vitamins B1, B3 and B6 in Charcot-Marie-Tooth Disease with the Compromised Status of Vitamin-Dependent Processes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, with the PDXK mutations leading to CMT disease, B6-dependent
      impairments are limited to peripheral signaling.
    explanation: >-
      A 2023 review stating the tissue-sparing claim in its strongest form.
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The absence of central nervous system-related symptoms in PDXK deficiency
      could be due to differences in the regulation of PDXK, where PDXK activity
      is preserved in the brain but not in peripheral tissues.
    explanation: >-
      States the tissue-sparing hypothesis explicitly as the explanation for the
      absence of central symptoms, which is precisely the claim the 2026
      neonatal-seizure report contradicts.
  - reference: PMID:41483399
    reference_title: "PDXK Mutation Causes a Late-Onset Pyridoxal 5'-Phosphate-Responsive Peripheral Neuropathy Preceded by Neonatal Seizures."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The female child had early neonatal seizures, which had only responded to
      intravenous pyridoxine. At 13 y, she remains seizure-free on a small dose
      of pyridoxine (50 mg twice a day).
    explanation: >-
      A PDXK patient with a central, B6-dependent phenotype, which the
      tissue-sparing claim does not accommodate.
- discussion_id: pdxk_which_plp_enzyme_fails_first
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which PLP-dependent enzyme, among the hundred or more that exist, actually
    fails first in the axon and causes it to degenerate?
  attaches_to:
  - pathophysiology#Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
  - pathophysiology#Length-Dependent Axonal Degeneration of Peripheral Nerve
  rationale: >-
    The chain from PDXK variant to low PLP is measured in patients at every
    step. The chain from low PLP to a dying axon is not. The founding study
    said plainly that it could not fully explain the mechanism of clinical
    improvement, and a subsequent review said the mechanism behind
    PDXK-associated neuropathy is unknown. The leading candidate is GABA,
    because glutamate decarboxylase requires PLP and because pyridoxal kinase
    inhibitors cause convulsions and lower GABA, with excitotoxic injury to
    sensory neurons proposed as the route; but that is an inference from
    pharmacological inhibition, not a measurement in this disease. The gap
    matters practically, because it is why nobody can yet say whether the
    sensory and visual arms that failed to improve on PLP replacement were
    irreversibly lost or merely undertreated.
  proposed_experiments:
  - experiment_id: pdxk_plp_enzyme_flux_in_patient_neurons
    name: Identify the rate-limiting PLP-dependent reaction in patient-derived sensory neurons
    description: >-
      Differentiate sensory neurons from patient induced pluripotent stem cells
      carrying the founding alleles and profile PLP-dependent metabolic fluxes,
      including GABA and other transaminase and decarboxylase products, against
      isogenic corrected controls, with and without PLP supplementation, to find
      which reaction falls first and whether restoring it rescues axonal
      integrity.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, although we are limited in our ability to fully explain the
      mechanism of clinical improvement, the supplementation with PLP was
      associated with normalization of the biochemical profile and improved
      clinical outcomes in individuals F1-II-5 and F1-II-6.
    explanation: >-
      The founding authors state the limit of their own mechanistic account.
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism behind PDXK-induced neuropathy is unknown; however, there is
      reason to believe that it may be related to gamma-aminobutyric acid (GABA)
      neurotransmission.
    explanation: >-
      Confirms the gap and names the leading candidate hypothesis.
notes: >-
  Entry-type decision: DISEASE. MONDO:0032792 is a leaf with no descendants and
  a single causal gene (hgnc:8819 PDXK), and it maps to OMIM 618511. The parent
  MONDO:0019551 (hereditary motor and sensory neuropathy type 6) is
  cross-referenced under `mappings.mondo_mappings` with `skos:broadMatch` rather
  than curated here.


  Named-entity check: `just preflight-dr` on the falcon report returned PASS,
  with PDXK mentioned 40 times and the report's OMIM (618511) matching the MONDO
  xref. Two genes that appear in the report (SLC25A46, SLC52A2) are differential
  diagnoses rather than rival identities.


  Three claims from the deep-research report were deliberately NOT curated. The
  report asserted that isoniazid, levodopa, gentamicin and D-penicillamine can
  reduce functional PLP and that antiepileptic drugs enhance PLP catabolism,
  attributing this to the founding paper; that paper's cached full text does not
  contain those statements, and the report itself labelled them mechanistic
  analogies rather than established modifiers, so no `environmental:` entry was
  created. Separately, a 2023 review gives the PLP dose as 50 mg/kg, which
  disagrees with the 50 mg/day actually reported by the treating authors; the
  primary source is cited for the dose. Third, the report's model-organism
  section describes a dietary PLP-deficient mouse with abnormal walking and
  axonal peripheral neuropathy with preserved myelin, reversed by PLP, and
  attributes it to PMID:31187503. That paper's cached full text does not
  contain it, and a PubMed search for such a model returned nothing matching,
  so no animal model was created for it. The `animal_models:` section here
  contains only the two systems whose findings are quotable from a fetched
  cache.


  Frequency bands are asserted only where the literature gives a number. The
  review that pooled all reported families gives axonal neuropathy in 100% and
  optic involvement in approximately 80%, both of which fall in VERY_FREQUENT;
  areflexia and the neonatal seizure presentation carry no frequency because
  none is published.


  No ontology term is bound to the plasma neurofilament light chain biomarker;
  the reason is recorded on that entry. Orphanet and GeneReviews have no entry
  for this concept, so neither an ORPHA reference nor a GeneReviews baseline is
  cited. `just refresh-orphadata` is currently failing on a checksum mismatch in
  this repository and was not run.

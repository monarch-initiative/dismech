histopathology:
- name: Chronic Axonopathy Without Demyelination
  description: >-
    Sural nerve biopsy shows diffuse and severe depletion of myelinated axons of
    all calibres, with the surviving fibres small and regenerating clusters
    present, and no demyelinating change. This is the tissue-level confirmation
    that the disease is an axonopathy rather than a myelinopathy, which is what
    separates it from the demyelinating Charcot-Marie-Tooth neuropathies it
    resembles clinically.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is diffuse and severe depletion of both small and large myelinated
      axons with most of the surviving axons being <5μm in diameter. There were
      no axonal ovoids, but there were regenerating clusters (arrows) consistent
      with longstanding indolent axonopathy. There was no demyelination process.
    explanation: >-
      Nerve biopsy description establishing a chronic axonopathy with no
      demyelination.
animal_models:
- name: dPdxk mutant Drosophila with human PDXK rescue
  species: Fruit fly
  genotype: dPdxk1 homozygous mutant, with transgenic expression of wild-type or variant human PDXK
  publication: PMID:31578392
  description: >-
    The only whole-organism system in which human PDXK has been assayed by
    complementation. Loss of the fly pyridoxal kinase ortholog produces
    chromosome aberrations and raised larval haemolymph glucose, and expressing
    wild-type human PDXK rescues both, which makes the fly a functional assay
    for whether a given human PDXK allele retains activity.
  modeled_mechanisms:
  - target: Biallelic PDXK Variants Impair Pyridoxal Kinase Catalysis
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Reads out residual human pyridoxal kinase activity by complementation:
      an allele that fails to rescue the fly phenotype has lost function.
    limitations: >-
      Two limitations matter and neither is small. The readouts are chromosome
      aberrations and haemolymph glucose, not neuropathy, so the system reports
      on enzyme competence rather than on disease mechanism. And the four human
      alleles actually tested in this study (D87H, V128I, H246Q, A243G) are
      population variants and a gestational-diabetes variant, NOT the
      p.Ala228Thr, p.Arg220Gln, p.Asn75Lys or p.Thr148Met alleles that cause
      this disease. The model therefore establishes that the assay works and
      that reduced-activity PDXK alleles exist in the population; it says
      nothing directly about the disease alleles.
    evidence:
    - reference: PMID:31578392
      reference_title: The expression of four pyridoxal kinase (PDXK) human variants in Drosophila impacts on genome integrity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In Drosophila, mutations in the dPdxk gene cause chromosome aberrations
        (CABs) and increase glucose content in larval hemolymph. Both phenotypes
        are rescued by the expression of the wild type human PDXK counterpart.
      explanation: >-
        Establishes the complementation assay: the fly phenotype depends on
        pyridoxal kinase activity and is rescued by the human enzyme.
    - reference: PMID:31578392
      reference_title: The expression of four pyridoxal kinase (PDXK) human variants in Drosophila impacts on genome integrity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Differently from human wild type PDXK, none of the variants was able to
        completely rescue CABs and glucose content elicited by dPdxk1 mutation.
        Biochemical analysis of D87H, V128I, H246Q and A243G proteins revealed
        reduced catalytic activity and/or reduced affinity for PLP precursors
        which justify this behavior.
      explanation: >-
        Names the four variants actually tested, which is what limits the
        model's relevance to this disease, and shows the assay detects reduced
        catalytic activity.
- name: Vitamin B6-deficient rat
  species: Rat
  genotype: Wild-type on a vitamin B6-deficient diet
  publication: PMID:31187503
  description: >-
    A dietary rather than genetic model. It is the only experimental evidence
    bearing on the tissue selectivity that makes this a peripheral-nerve disease
    rather than an encephalopathy: on B6 deprivation, pyridoxal kinase activity
    falls quickly in liver, muscle and plasma while brain activity and B6 supply
    are maintained.
  modeled_mechanisms:
  - target: Systemic Pyridoxal 5'-Phosphate Depletion
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Measures how pyridoxal kinase activity and B6 supply respond to depletion
      across tissues, which is the observation behind the argument that the
      periphery is affected while the brain is spared.
    limitations: >-
      Dietary deprivation in a wild-type animal is not the human lesion, which
      is a constitutive enzyme defect with normal dietary intake. It also does
      not settle the tissue-selectivity question: two 2026 patients had
      B6-dependent neonatal seizures, a central phenotype the sparing account
      does not accommodate. That conflict is recorded as a CONTROVERSY
      discussion on this entry.
    evidence:
    - reference: PMID:31187503
      reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In rats, B6 deficiency leads to rapid decreases in PDXK activity in the
        peripheries (liver, muscle, and plasma), with maintained PDXK activity
        and B6 supply in the brain.
      explanation: >-
        The tissue-selective response to B6 depletion that this model reports.
treatments:
- name: Pyridoxal 5'-Phosphate Replacement
  description: >-
    The disease-directed treatment, and the reason this entity matters
    disproportionately to its rarity. The logic is kinetic rather than a simple
    bypass: the mutant enzyme has roughly twice the normal Km for pyridoxal, so
    giving oral PLP, which is hydrolysed to pyridoxal before cellular uptake,
    raises the substrate concentration the residual enzyme sees and forces flux
    through it. Fifty milligrams a day was enough to bring plasma PLP above the
    normal range within two weeks. Over 18 to 24 months the treated siblings
    gained 8 and 6 points on the MRC sum score, regained independent walking,
    reported less pain and fatigue, showed no further electrophysiological
    progression, and had plasma neurofilament light chain fall to the normal
    range. Sensory examination and vision did not improve, so this is arrested
    and partially reversed motor decline rather than cure, and the evidence is
    an uncontrolled observation in two patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pyridoxal 5'-phosphate replacement
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pyridoxal 5'-phosphate
      term:
        id: CHEBI:18405
        label: pyridoxal 5'-phosphate
  target_mechanisms:
  - target: Systemic Pyridoxal 5'-Phosphate Depletion
    treatment_effect: RESTORES
    description: >-
      Oral PLP restores the depleted circulating cofactor pool directly, and is
      titrated against plasma PLP.
    evidence:
    - reference: PMID:31187503
      reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We aimed to achieve plasma PLP concentration above the normal range by
        PLP replacement, and this was achieved with 50mg/day.
      explanation: >-
        Documents restoration of the circulating cofactor and the dose that
        achieved it.
  - target: Biallelic PDXK Variants Impair Pyridoxal Kinase Catalysis
    treatment_effect: MODULATES
    description: >-
      PLP is hydrolysed to pyridoxal, raising substrate concentration at an
      enzyme whose defect is a raised Km. The treatment therefore works through
      the mutant enzyme rather than around it, which is why residual activity
      matters.
    evidence:
    - reference: PMID:31187503
      reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        therefore, we used PLP, which is hydrolyzed to PL, to increase the
        upstream PL and force the flux with an enzyme with a high Km
      explanation: >-
        States the kinetic rationale for choosing PLP: raise substrate to drive
        a high-Km enzyme.
  - target: Length-Dependent Axonal Degeneration of Peripheral Nerve
    treatment_effect: MODULATES
    description: >-
      Treatment slows the axonal degeneration itself, evidenced by stable
      electrophysiology and by normalization of plasma neurofilament light
      chain rather than by symptom report alone.
    evidence:
    - reference: PMID:31187503
      reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Electrophysiological studies performed 18 months after PLP
        supplementation have demonstrated no disease progression, with no
        significant changes in the motor and sensory responses.
      explanation: >-
        Objective electrophysiological evidence that progression halted on
        treatment.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We rescued the clinical and biochemical profile with PLP supplementation
      in 1 family, improvement in power, pain, and fatigue contributing to
      patients regaining their ability to walk independently during the first
      year of PLP normalization.
    explanation: >-
      The primary clinical result: measurable functional recovery on PLP
      replacement.
  - reference: PMID:32522499
    reference_title: Hereditary polyneuropathy with optic atrophy due to PDXK variant leading to impaired Vitamin B6 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients' early diagnosis and prompt PLP replacement restored the PLP
      plasma levels, enabling long-term monitoring of clinical outcomes.
    explanation: >-
      Independent family in which PLP replacement restored plasma levels.
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After one year of treatment with 48 mg of PLP once daily, the patient
      demonstrated reduced fatigue, improved motor function, and increased
      muscle strength.
    explanation: >-
      A third independent patient with a documented functional response to PLP.
  notes: >-
    Ontology note: `NCIT:C15433 Nutritional Support` is generic for what is in
    practice a pharmacological dose of a specific compound. NCIT was searched
    for a vitamin-therapy clinical-action term and none exists; the candidates
    returned (`NCIT:C210732` Vitamin Supplement, `NCIT:C1505` Dietary
    Supplement) are substance concepts, not procedures, and are not reachable
    from the Clinical Intervention or Procedure root the treatment enum
    requires. The specific agent is carried by `therapeutic_agent`
    (CHEBI:18405) and the platform by `therapeutic_modality: SMALL_MOLECULE`.


    Do not substitute pyridoxine. Pyridoxine is a substrate of the enzyme that
    is deficient, and high-dose pyridoxine independently causes a sensory
    peripheral neuropathy, so it carries a specific risk of worsening the
    presenting problem. The one situation in which pyridoxine has been reported
    to work is the neonatal seizure presentation, where it controlled seizures
    before the PDXK diagnosis was made and was then switched to PLP.
- name: Physical Therapy
  description: >-
    Strengthening, gait training and stretching for a length-dependent axonal
    neuropathy. It does not act on the metabolic defect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Distal muscle weakness

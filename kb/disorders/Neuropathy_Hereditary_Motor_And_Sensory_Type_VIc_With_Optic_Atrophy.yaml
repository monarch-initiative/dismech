      The substituted amino acids Ala228 and Arg220 are evolutionary conserved
      residues participating in PDXK interaction with its substrate ATP.
    explanation: >-
      Explains why the two founding alleles converge on the same functional
      defect: both sit at conserved ATP-contacting residues.
  variants:
  - name: PDXK c.682G>A p.Ala228Thr
    description: >-
      The founding allele, homozygous in a Cypriot family. The best
      characterized biophysically: normal protein expression in patient

    missense and cluster in or near residues that contact the ATP cosubstrate;
    one splice-altering missense allele acts instead by reducing transcript
    abundance. As of the most recent review, thirteen patients from six families
    had been reported worldwide, carrying four recurrent pathogenic missense
    variants, so the mutational spectrum should be read as provisional.

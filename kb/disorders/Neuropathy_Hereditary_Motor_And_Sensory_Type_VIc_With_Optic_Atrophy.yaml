    is what localizes the block to the kinase step. It is also the treatment
    target: dosing is titrated to bring plasma PLP to or above the normal range.
  evidence:
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin B6 vitamers have been assessed in most reported patients, with
      plasma PLP being the most consistently measured and most frequently
      reduced metabolite
    explanation: >-
      Establishes plasma PLP as the consistently abnormal biochemical marker.
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We aimed to achieve plasma PLP concentration above the normal range by PLP
      replacement, and this was achieved with 50mg/day.
    explanation: >-
      Shows plasma PLP used as the titration target for replacement therapy.
- name: Plasma Neurofilament Light Chain
  biomarker_term:
    preferred_term: Elevated plasma neurofilament light chain
  notes: >-
    No ontology term is bound here. HPO has only a cerebrospinal-fluid-specific
    neurofilament term (HP:0032928, Elevated CSF neurofilament light chain
    concentration) and no plasma equivalent, and the measurements in this
    disease were made in plasma; the available broader alternative
    (HP:0010876, Abnormal circulating protein concentration) would carry no
    information about which protein. Not diagnostic, but the most informative treatment-response marker reported
    for this disease. NfL is released from breaking-down axons, so it reports on
    the mechanism node directly rather than on symptoms. It is elevated before
    treatment into the range seen in other axonal Charcot-Marie-Tooth
    neuropathies, and falls to the normal control range on PLP replacement,
    reaching about 2.5-fold below the pretreatment value at 24 months.
  readouts:
  - target: Length-Dependent Axonal Degeneration of Peripheral Nerve
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Falling NfL on treatment is evidence that PLP replacement slows the
      ongoing axonal breakdown, not merely that patients feel better.
    evidence:
    - reference: PMID:31187503
      reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A reduction of NFL levels to the normal control range44 (median = 13pg/ml,
        range = 11-18pg/ml; see Fig 4C) occurred upon restoration of PLP levels
        and continued to improve with PLP supplementation.
      explanation: >-
        Records the measured fall in NfL to the normal range following PLP
        replacement.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NFL, a major axonal cytoskeletal protein, is released into cerebrospinal
      fluid and blood during axonal breakdown,43 providing a dynamic biomarker of
      axonal damage in neurodegenerative disorders, including inherited
      neuropathies.
    explanation: >-
      Establishes what NfL measures and why it is informative about the axonal
      degeneration node.

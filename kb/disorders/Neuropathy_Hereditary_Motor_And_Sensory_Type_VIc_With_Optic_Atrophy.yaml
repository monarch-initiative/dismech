      label: GABA biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31578392
    reference_title: The expression of four pyridoxal kinase (PDXK) human variants in Drosophila impacts on genome integrity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PLP performs many functions by working as coenzyme for a wide number of
      enzymes which control amino acid, lipid and carbohydrate metabolism.
    explanation: >-
      States the breadth of PLP-dependent metabolism that this node claims is
      compromised.
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The mechanism behind PDXK-induced neuropathy is unknown; however, there is
      reason to believe that it may be related to gamma-aminobutyric acid (GABA)
      neurotransmission. Compounds that inhibit PDXK lead to convulsions and
      reductions in GABA biosynthesis.
    explanation: >-
      States both that the mechanism is unknown and what the leading GABA
      hypothesis is. Cited as PARTIAL because it argues for a candidate rather
      than establishing it.
  - reference: PMID:33912895
    reference_title: "Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Perturbed GABA signaling within sensory neurons may lead to excitotoxicity,
      neurodegeneration, and ultimately, the development of peripheral
      neuropathy.
    explanation: >-
      The proposed route from cofactor insufficiency to neuronal injury. Stated
      by the authors as a hypothesis, hence PARTIAL.
  downstream:
  - target: Length-Dependent Axonal Degeneration of Peripheral Nerve
    description: >-
      The longest peripheral axons fail first, producing a distal and
      length-dependent axonal neuropathy.
  - target: Retinal Ganglion Cell Axon Loss and Optic Atrophy
    description: >-
      The same cofactor insufficiency reaches the retinal ganglion cell axons
      that make up the optic nerve, but years later.
- name: Length-Dependent Axonal Degeneration of Peripheral Nerve
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Nerve conduction studies show a primarily axonal, length-dependent
    sensorimotor neuropathy rather than demyelination. That the axons are
    actively breaking down, rather than merely having failed to develop, is
    shown directly by plasma neurofilament light chain, which is elevated before
    treatment into the range seen in other axonal Charcot-Marie-Tooth
    neuropathies and falls to normal on PLP replacement. This is the node the
    treatment acts on.

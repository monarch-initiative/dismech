- CMT6C
- CMT 6C
- Charcot-Marie-Tooth disease, type 6C
- PDXK-related neuropathy
- pyridoxal kinase deficiency
disease_term:
  preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
  term:
    id: MONDO:0032792
    label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
description: >-
  HMSN VIc is an autosomal recessive axonal Charcot-Marie-Tooth neuropathy with
  optic atrophy caused by biallelic variants in PDXK, and it is one of the very
  few inherited neuropathies for which a targeted treatment exists. PDXK encodes
  pyridoxal kinase, the salvage-pathway enzyme that phosphorylates dietary
  vitamin B6 vitamers into pyridoxal 5'-phosphate (PLP), the cofactor for more
  than a hundred enzymes spanning amino-acid, neurotransmitter and one-carbon
  metabolism. The disease alleles reduce that enzyme's catalytic output, PLP
  falls, and the long axons of the peripheral nerve and the optic nerve
  degenerate.


  The mechanism was worked out in unusual detail for the founding allele,
  p.Ala228Thr. It does not destroy the protein: expression in patient
  fibroblasts is normal. What changes is the shape of the catalytic pocket.
  Circular dichroism showed a conformational rearrangement of aromatic
  side-chains around that pocket, isothermal titration calorimetry showed the
  mutant no longer binds ATP, and enzyme kinetics showed roughly a doubling of
  the Km for pyridoxal with a fall in Vmax. The consequences are measurable in
  patients: erythrocyte pyridoxal kinase activity is reduced and plasma PLP is
  low, while the other B6 vitamers are not.


  That kinetic detail is what makes the treatment rational rather than empirical,
  and it also explains why the obvious drug is the wrong one. Pyridoxine is the
  vitamin's inactive form and requires the very enzyme that is deficient; worse,
  high-dose pyridoxine is itself neurotoxic and causes a sensory neuropathy,
  so giving it to a patient with an axonal neuropathy risks making things worse.
  The founding study instead used PLP, which is hydrolysed to pyridoxal and so
  raises the substrate concentration seen by an enzyme with a raised Km, forcing
  flux through the residual activity. In the treated family, plasma PLP
  normalized within two weeks, MRC sum scores rose by 8 and 6 points over 18
  months, electrophysiology stopped progressing, patients regained independent
  walking, and plasma neurofilament light chain, a direct marker of ongoing
  axonal breakdown, fell to the normal range.


  The entity is very rare and the phenotype is drawn from a small number of
  families, so its boundaries are still moving. Optic atrophy is present in
  roughly 80% of reported patients but is strongly age-dependent, appearing
  between 29 and 50 years in the founding family and at age 10 in another, and
  it can be absent in an adolescent who already has an established neuropathy.
  Two 2026 reports have extended the spectrum at both ends: neonatal
  vitamin-B6-dependent seizures preceding the neuropathy by years, and a
  splice-altering variant that lowers transcript abundance rather than changing
  enzyme kinetics.

- name: Retinal Ganglion Cell Axon Loss and Optic Atrophy
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of retinal ganglion cell axons produces optic atrophy on fundoscopy
    with reduced visual acuity and colour vision. Its timing is the striking
    feature: in the founding family it appeared between 29 and 50 years of age,
    decades after the neuropathy, and in an adolescent with established
    neuropathy the only finding was mild thinning of the peripapillary retinal
    nerve fibre layer on optical coherence tomography, with normal visual evoked
    potentials. Absence of optic atrophy in a young patient therefore does not
    exclude the diagnosis, and OCT may detect the arm before fundoscopy does.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:

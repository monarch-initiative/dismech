pathophysiology:
- name: Biallelic PDXK Variants Impair Pyridoxal Kinase Catalysis
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Pyridoxal kinase phosphorylates the dietary B6 vitamers pyridoxal,
    pyridoxine and pyridoxamine, and is the rate-limiting step of the vitamin B6
    salvage pathway in humans, who cannot synthesize the vitamin de novo. Two
    routes to reduced catalysis are documented. In the missense alleles the
    protein is made in normal amounts but its catalytic pocket is misshapen:
    circular dichroism showed rearranged aromatic side-chains around the pocket,
    isothermal titration calorimetry showed the p.Ala228Thr mutant no longer
    binds ATP, and kinetics showed a roughly doubled Km for pyridoxal together
    with a fall in Vmax. In the more recently described splice-altering allele
    the enzyme is not misfolded at all; the transcript is aberrantly spliced and
    degraded, so less enzyme is made.
  molecular_functions:
  - preferred_term: pyridoxal kinase activity
    term:
      id: GO:0008478
      label: pyridoxal kinase activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: PDXK
      term:
        id: hgnc:8819
        label: PDXK
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic germline PDXK variants, homozygous in most reported families and
      compound heterozygous in one. Residual enzyme activity is reduced rather
      than abolished, which is why raising substrate concentration is
      therapeutically useful.
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic mutations in PDXK in 5 individuals from 2
      unrelated families with primary axonal polyneuropathy and optic atrophy.
    explanation: >-
      Establishes biallelic PDXK variants as the cause of this entity.
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, near-UV CD analysis revealed distinctive CD fingerprints for
      WT and p.Ala228Thr proteins, indicating conformational rearrangements of
      aromatic side-chains41 around the catalytic pocket, most likely hindering
      the enzyme's ability to bind ATP.
    explanation: >-
      Biophysical demonstration that the founding missense allele deforms the
      catalytic pocket rather than destabilizing the whole protein.
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We performed ITC confirming that p.Ala228Thr affected the ATP-binding
      ability of PDXK.
    explanation: >-
      Calorimetric confirmation that the mutant enzyme fails to bind its ATP
      cosubstrate.
  - reference: PMID:32522499
    reference_title: Hereditary polyneuropathy with optic atrophy due to PDXK variant leading to impaired Vitamin B6 metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that the variant leads to almost complete loss of PDXK
      enzymatic activity and low PLP levels.
    explanation: >-
      Independent family with a different variant showing the same loss of
      enzyme activity.
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report a novel splice-altering missense variant in PDXK that
      induces aberrant transcript degradation, revealing a new disease mechanism
      for PDXK-related neuropathy.
    explanation: >-
      Documents the second route to reduced catalysis, loss of transcript rather
      than loss of catalytic competence.
  downstream:
  - target: Systemic Pyridoxal 5'-Phosphate Depletion
    description: >-
      Reduced kinase throughput lowers the amount of active cofactor the body
      can generate from dietary B6.
- name: Systemic Pyridoxal 5'-Phosphate Depletion
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The biochemical signature of the disease, and the one that makes it
    treatable and monitorable. Plasma PLP falls while the other B6 vitamers
    (pyridoxal, pyridoxine, pyridoxamine and the excretion product 4-pyridoxic
    acid) do not, which is what localizes the block to the kinase step rather
    than to intake or absorption. Erythrocyte pyridoxal kinase activity measured
    directly in dried blood spots is correspondingly reduced. The depletion is
    not invariable: one adolescent had a plasma PLP within the reference range
    that was nonetheless about 2.5-fold below her parents' levels.
  biological_processes:
  - preferred_term: pyridoxal 5'-phosphate biosynthetic process
    term:
      id: GO:0042823
      label: pyridoxal 5'-phosphate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31187503
    reference_title: "PDXK mutations cause polyneuropathy responsive to pyridoxal 5'-phosphate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low PDXK ATP binding resulted in decreased erythrocyte PDXK activity and
      low pyridoxal 5'-phosphate (PLP) concentrations.
    explanation: >-
      Connects the enzyme defect to the measurable depletion of PLP in patients.
  - reference: PMID:41888341
    reference_title: "PDXK-Related Neuropathy: A Case With a Novel Splice-Altering Missense Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the initial report by Chelban et al., plasma concentrations of multiple
      vitamin B6 vitamers (PLP, pyridoxal, pyridoxine, pyridoxamine, and
      4-pyridoxic acid) were assessed, and only PLP levels were consistently
      reduced
    explanation: >-
      Shows the depletion is specific to the phosphorylated cofactor, which is
      what places the lesion at the kinase step.
  downstream:
  - target: Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
    description: >-
      Falling cofactor availability limits the many enzymes that require PLP to
      function.
- name: Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PLP is the cofactor for well over a hundred enzymes covering amino-acid,
    lipid and carbohydrate metabolism, neurotransmitter synthesis and catabolism,
    and one-carbon metabolism, and it also acts as an antioxidant. Which of those
    dependencies actually fails first in a neuron is not established, and this
    node is deliberately marked provisional for that reason. The leading
    candidate is GABA synthesis, because glutamate decarboxylase is PLP-dependent
    and because compounds that inhibit pyridoxal kinase cause convulsions and
    lower GABA; the proposed consequence is excitotoxic injury to sensory
    neurons. The founding study was explicit that it could not fully explain the
    mechanism linking low PLP to the clinical picture.

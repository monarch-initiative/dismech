biochemical:
- name: Plasma Pyridoxal 5'-Phosphate
  biomarker_term:
    preferred_term: Reduced circulating vitamin B6
    term:
      id: HP:0008326
      label: Reduced circulating vitamin B6 circulating
  cell_types: []
  notes: >-
    The diagnostic and monitoring analyte. Reduced in more than 80% of reported

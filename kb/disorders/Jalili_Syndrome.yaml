discussions:
- discussion_id: jalili_retinal_mechanism_mouse_mismatch
  prompt: >-
    Why does CNNM4 loss cause cone-rod degeneration in humans when Cnnm4
    knockout mice keep a normal retina, and does the retinal disease depend on
    Mg2+ extrusion at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cone-Predominant Photoreceptor Degeneration
  - animal_models#Cnnm4 knockout mouse
  rationale: >-
    The same knockout that reproduces the enamel defect shows normal retinal
    histology and ERGs at 6 months, and retinal Cnnm4 protein is concentrated
    in plexiform and ganglion cell layers rather than photoreceptors. The
    enamel branch therefore has a tested Mg2+ extrusion mechanism while the
    retinal branch rests on genetics alone. Proposed links, including
    disturbed retinal ion homeostasis and an interaction with the Leber
    congenital amaurosis protein IQCB1 seen in overexpression experiments,
    have not been tested in retina.
  evidence:
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our CNNM4−/− mice showed no signs of abnormalities in the retinal tissue architecture and function (Figure S5)."
    explanation: The knockout mouse does not model the human retinal disease.
  - reference: PMID:29322253
    reference_title: Identification of a mutation in CNNM4 by whole exome sequencing in an Amish family and functional link between CNNM4 and IQCB1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A truncated CNNM4 protein starting at R605 significantly increased the rate of apoptosis, and significantly increased the interaction between CNNM4 and IQCB1."
    explanation: An untested alternative retinal mechanism from cultured cells.
notes: >-
  No GeneReviews chapter covers Jalili syndrome. Cnnm4 knockout mice are
  hypomagnesemic from intestinal Mg2+ malabsorption, but the human reports
  cited here do not describe hypomagnesemia, and the clinical consequences of
  CNNM4 loss in patients appear limited to retina and teeth despite wide
  tissue expression. A report from Gaza attributed 83% of local cone-rod
  dystrophy cases to Jalili syndrome (PMID:20706282).

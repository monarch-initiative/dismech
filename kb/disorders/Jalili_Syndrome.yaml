genetic:
- name: CNNM4
  gene_term:
    preferred_term: CNNM4
    term:
      id: hgnc:105
      label: CNNM4
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants across all CNNM4 domains have been reported, including
    nonsense (p.Arg605Ter, a probable Amish founder allele), frameshift
    (c.1312dup, recurrent in Kosovan families; c.1091del), splice-site, large
    deletions and missense (p.Leu161Pro, p.Ser200Pro, p.Arg236Trp, p.Leu324Pro,
    p.Gly492Cys, p.Gly492Asp). A pooled analysis of 53 patients found no
    association between visual acuity and the domain carrying the variant.
  evidence:
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional-candidate approach, we have identified mutations in the CNNM4 gene, encoding a putative metal transporter, accounting for the condition in all seven families."
    explanation: CNNM4 mutations in all seven linked families.
  - reference: PMID:19200527
    reference_title: Mutations in CNNM4 cause recessive cone-rod dystrophy with amelogenesis imperfecta.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a genome-wide single-nucleotide polymorphism (SNP) haplotype analysis to fine map the locus and a gene-candidate approach, we identified homozygous mutations in the ancient conserved domain protein 4 gene (CNNM4) that either generate a truncated protein or occur in highly conserved regions of the protein."
    explanation: Independent simultaneous identification of CNNM4 as the causal gene.
  - reference: PMID:29322253
    reference_title: Identification of a mutation in CNNM4 by whole exome sequencing in an Amish family and functional link between CNNM4 and IQCB1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing was then performed for the three affected individuals and identified a homozygous nonsense mutation (c.C1813T, p.R605X) in the cyclin and CBS domain divalent metal cation transport mediator 4 (CNNM4) gene located within the 2p14-2q14 Jalili syndrome locus."
    explanation: Additional homozygous truncating allele in an Amish family.
  - reference: PMID:41280631
    reference_title: Novel mutation in CNNM4 gene in a Chinese family with Jalili syndrome and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No association was found between logMAR visual acuity and mutation domain (P=0.748)."
    explanation: Pooled literature analysis finding no domain-severity correlation.
animal_models:
- name: Cnnm4 knockout mouse
  species: Mouse
  genotype: Cnnm4-/- (neomycin cassette inserted between exons 1 and 2)
  publication: PMID:24339795
  modeled_mechanisms:
  - target: Enamel Hypomineralization with Magnesium and Organic Matrix Retention
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockout incisor enamel is hypomineralized with immature rods and raised
      magnesium, matching the human enamel chemistry.
    limitations: >-
      Enamel thickness is near normal in the mouse, whereas patients often have
      thin or hypoplastic enamel; findings are from continuously erupting mouse
      incisors rather than primary and permanent human teeth.
    evidence:
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the high-magnification images showed that the enamel rods were immature and the inter-rod area was increased in CNNM4−/− mice (Figure 5C)."
      explanation: Knockout enamel microstructure is abnormal.
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The low-magnification images showed that the thickness of the enamel layer in CNNM4−/− mice was not so different from that in CNNM4+/+ mice (Figure 5B)."
      explanation: Supports the limitation that enamel thickness is preserved in the mouse.
  - target: Cone-Predominant Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Knockout mice have normal retinal histology, normal photoreceptor and
      synaptic markers, and normal scotopic and photopic ERGs at 2 and 6 months.
    limitations: >-
      Retinal assessment stopped at 6 months, and the knockout cannot be used
      to study the human retinal mechanism. Why the mouse retina is spared is
      not known.
    evidence:
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also recorded ERGs from 6-month-old CNNM4−/− mice and again observed normal ERGs under both scotopic and photopic conditions (Figure S5C)."
      explanation: Normal retinal function in knockout mice.
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that the retinal layers were normal and no symptom of retinal degeneration was observed in the retina of CNNM4−/− mice (Figure S5A)."
      explanation: Normal retinal histology in knockout mice.

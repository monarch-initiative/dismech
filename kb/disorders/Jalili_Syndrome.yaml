name: Jalili Syndrome
creation_date: "2026-10-28T22:34:33Z"
category: Mendelian
synonyms:
- cone-rod dystrophy with amelogenesis imperfecta
- cone rod dystrophy-amelogenesis imperfecta syndrome
- CNNM4-related cone-rod dystrophy and amelogenesis imperfecta
description: >-
  Autosomal recessive oculo-dental syndrome caused by biallelic loss-of-function
  variants in CNNM4, which encodes a basolateral plasma membrane Mg2+ extrusion
  protein that exchanges intracellular Mg2+ for extracellular Na+. Affected
  individuals have infancy- or childhood-onset cone-rod dystrophy with reduced
  visual acuity, nystagmus, photophobia, loss of color vision and later
  nyctalopia, and amelogenesis imperfecta of both dentitions in which the enamel
  is hypomineralized, variably hypoplastic, and fails soon after eruption.
  First described in a large consanguineous kindred in the Gaza Strip and
  linked to chromosome 2q11, it has since been reported worldwide. The enamel
  defect is explained by loss of Mg2+ removal from maturing enamel by
  maturation-stage ameloblasts, which Cnnm4 knockout mice reproduce. How CNNM4
  loss causes photoreceptor degeneration is unknown: the same knockout mice
  have a structurally and functionally normal retina.
disease_term:
  preferred_term: Jalili syndrome
  term:
    id: MONDO:0009007
    label: Jalili syndrome
parents:
- Cone-rod dystrophy
- Amelogenesis imperfecta
- Inherited retinal dystrophy
inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals are homozygous or compound heterozygous for CNNM4
    variants, often in consanguineous families; heterozygous carriers are
    unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27419834
    reference_title: A novel mutation and variable phenotypic expression in a large consanguineous pedigree with Jalili syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed a novel mutation (c.1091delG) in homozygous form in the patients and as a heterozygous form in the normal carrier subjects."
    explanation: Seven-generation pedigree with homozygous affected individuals and unaffected heterozygous carriers.
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a further five ethnically diverse unrelated families sharing the distinctive combination of recessively inherited infancy-onset CRD and dental biomineralization defects with grossly abnormal enamel."
    explanation: Recessive inheritance across the seven families used for gene discovery.
pathophysiology:
- name: CNNM4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Disease alleles include nonsense, frameshift, splice-site, large deletion
    and missense variants. Missense variants in the CBS domain reduce protein
    and mRNA stability and lower Mg2+ extrusion activity without mislocalizing
    the protein; other disease missense variants abolish Mg2+ extrusion in
    cultured cells.
  genes:
  - preferred_term: CNNM4
    term:
      id: hgnc:105
      label: CNNM4
  molecular_functions:
  - preferred_term: Na+/Mg2+ exchange (Mg2+ extrusion)
    term:
      id: GO:0061768
      label: magnesium:sodium antiporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine mutations are described in all, three missense, three terminations, two large deletions, and a single base insertion."
    explanation: Allelic spectrum in the original families is dominated by truncating and deletion alleles.
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Imaging analyses revealed that CNNM4 can extrude Mg(2+) by exchanging intracellular Mg(2+) with extracellular Na(+)."
    explanation: Establishes the molecular function lost in the disease.
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Missense point mutations associated with the disease abolish the Mg(2+) extrusion activity."
    explanation: Jalili syndrome missense variants lose Mg2+ extrusion activity in cultured cells.
  - reference: PMID:39580587
    reference_title: Functional and pathogenic insights into CNNM4 variants in Jalili syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings demonstrated that these variants exhibit significantly reduced protein stability and increased mRNA decay rates compared with wild type."
    explanation: p.Gly492Cys and p.Gly492Asp reduce CNNM4 abundance rather than its localization.
  downstream:
  - target: Impaired Mg2+ Extrusion by Maturation-Stage Ameloblasts
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CNNM4-knockout mice showed defective amelogenesis, and CNNM4 again localizes to the basolateral membrane of ameloblasts, the enamel-forming epithelial cells."
      explanation: Places the extrusion protein at the ameloblast basolateral membrane and links its loss to the enamel defect.
  - target: Cone-Predominant Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The link from CNNM4 loss to photoreceptor death is inferred from the
      genetics alone. Cnnm4 protein is detected mainly in the plexiform and
      ganglion cell layers rather than in photoreceptors, and knockout mice do
      not degenerate, so the retinal intermediates are unknown.
    evidence:
    - reference: PMID:19200527
      reference_title: Mutations in CNNM4 cause recessive cone-rod dystrophy with amelogenesis imperfecta.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Given that CNNM4 is implicated in metal ion transport, cone-rod dystrophy and amelogenesis imperfecta may originate from abnormal ion homeostasis."
      explanation: The gene-discovery report proposes, without testing, that disturbed ion homeostasis underlies the retinal disease.
      directness: INDIRECT
- name: Impaired Mg2+ Extrusion by Maturation-Stage Ameloblasts
  biological_scale: CELLULAR
  description: >-
    CNNM4 is absent from secretory-stage ameloblasts and strongly expressed at
    the basolateral membrane of ruffle-ended maturation-stage ameloblasts, the
    same polarized position it occupies in intestinal epithelium, where it
    carries out transcellular Mg2+ transport. Its loss is proposed to prevent
    removal of Mg2+ from the maturing enamel compartment.
  cell_types:
  - preferred_term: maturation-stage ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: magnesium ion transmembrane transport
    term:
      id: GO:1903830
      label: magnesium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It should be noted that this basolateral localization pattern of CNNM4 in RA-type ameloblasts is quite similar to that observed in intestinal epithelia (Figure 2D), suggesting that CNNM4 promotes Mg2+ removal from the maturing enamel."
    explanation: Mouse ameloblast localization implies a role in removing Mg2+ from maturing enamel.
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ameloblasts were heavily labeled during the transition and maturation phases of amelogenesis, but labeling was absent from ameloblasts during the secretion phase."
    explanation: Independent rat incisor immunohistochemistry confirming maturation-stage expression.
  downstream:
  - target: Enamel Hypomineralization with Magnesium and Organic Matrix Retention
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24339795
      reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The precise role of Mg2+ in the enamel-forming process remains unknown, but the striking expression of CNNM4 in RA-type mature ameloblasts suggests that Mg2+ needs to be removed from the enamel tissue to promote mineralization of enamel."
      explanation: Proposes Mg2+ removal by maturation-stage ameloblasts as a requirement for enamel mineralization.
      directness: INDIRECT
- name: Enamel Hypomineralization with Magnesium and Organic Matrix Retention
  biological_scale: TISSUE
  description: >-
    Affected human enamel reaches about half the mineral density of normal
    enamel, retains amorphous organic matrix, and carries elevated magnesium
    with reduced calcium. Cnnm4 knockout mouse enamel has immature rods with
    raised magnesium and reduced calcium and phosphorus. The retained matrix
    may hinder the crystal growth of enamel maturation. Dentine is also
    undermineralized in human teeth.
  biological_processes:
  - preferred_term: enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  evidence:
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis demonstrated that affected enamel was mineralized only to approximately 50% of the value for normal enamel and was similar to that for dentine."
    explanation: Transverse microradiography of patient teeth.
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the microstructure of the enamel prisms in the Jalili syndrome teeth was obscured by an amorphous organic material."
    explanation: Retained organic matrix in patient enamel.
  - reference: PMID:24194943
    reference_title: Dental phenotype in Jalili syndrome due to a c.1312 dupC homozygous mutation in the CNNM4 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reduced mineral density of enamel was accompanied by decreased amounts of calcium, but significantly elevated levels of magnesium."
    explanation: Elemental analysis of patient primary teeth shows magnesium retention in enamel.
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As shown in Figure 5D, the levels of both calcium and phosphorus were significantly decreased in CNNM4−/− mice, confirming the occurrence of hypomineralization."
    explanation: Knockout mouse enamel is hypomineralized.
  - reference: PMID:24339795
    reference_title: "Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport across epithelia: a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Indeed, the elemental analyses of the mature enamel with EDX indicated that the magnesium levels were significantly increased in CNNM4−/− mice (Figure 5D)."
    explanation: Magnesium retention in knockout mouse enamel, matching the human finding.
  downstream:
  - target: Amelogenesis imperfecta
    causal_link_type: DIRECT
  - target: Enamel hypomineralization
    causal_link_type: DIRECT
  - target: Enamel hypoplasia
    causal_link_type: DIRECT
- name: Cone-Predominant Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive loss of cone and then rod photoreceptor function and structure,
    with cones more severely affected. Outer retinal layers thin on OCT. The
    only reported histopathology, from an enucleated eye of a 63-year-old
    woman, showed loss of photoreceptors, subretinal autofluorescent material,
    partly preserved inner retinal lamination, Muller glial disorganization and
    increased microglia. How CNNM4 deficiency injures photoreceptors is unknown.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroretinography (ERG) was characterized by early loss of cone and rod function, with cones being more severely affected."
    explanation: Cone-predominant photoreceptor dysfunction in the gene-discovery families.
  - reference: PMID:29421294
    reference_title: "Jalili Syndrome: Cross-sectional and Longitudinal Features of Seven Patients With Cone-Rod Dystrophy and Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multimodal imaging demonstrated disease progression in all 7 patients over time."
    explanation: Progressive structural degeneration.
  - reference: PMID:39522753
    reference_title: Clinical and Histopathologic Findings in Jalili Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histopathologic analyses revealed loss of photoreceptor cells, accumulation of autofluorescent material in the subretinal space, partial preservation of the inner retinal lamination, Müller glial cell disorganization, and increased number of microglial cells in the nuclear layers."
    explanation: Direct histological evidence of photoreceptor loss in an advanced-stage eye.
  - reference: PMID:19200525
    reference_title: "Mutations in CNNM4 cause Jalili syndrome, consisting of autosomal-recessive cone-rod dystrophy and amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cnnm4 immunoreactivity is observed in the neural retina, with highest expression in the outer plexiform layer (OPL), inner plexiform layer (IPL), and ganglion cell layer (GCL), with nucleus position identified by DAPI counterstain."
    explanation: >-

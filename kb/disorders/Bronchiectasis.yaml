biochemical:
- name: Bronchiectasis Biomarker Profiles
  presence: Variable
  context: >-
    Inflammatory, microbiome, radiologic, mucus, and epithelial measurements
    define heterogeneous profiles being investigated for prognosis and
    treatment selection; no single profile is universally diagnostic.
  evidence:
  - reference: DOI:10.1183/16000617.0234-2023
    reference_title: Biomarkers in bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Increasingly there are available methods to measure each of these
      components of the disease, revealing heterogeneous inflammatory profiles,
      microbiota, radiology and mucus and epithelial biology in patients with
      bronchiectasis.
    explanation: >-
      The biomarker review supports heterogeneous measurable disease profiles
      rather than a single universal biomarker.
- name: C-Reactive Protein (CRP)
  presence: Elevated
  context: >-
    Serum CRP can be elevated in infection-associated bronchiectasis,
    including Haemophilus influenzae-dominant disease; it is nonspecific.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an increase in serum CRP
    explanation: >-
      The cited association supports elevated CRP in an infection-defined
      subgroup, not as a specific or universal bronchiectasis marker.
- name: Sputum Culture
  presence: Positive
  context: >-
    Identifies clinically actionable airway organisms, although conventional
    culture is insensitive and a negative result does not exclude infection.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      sputum culture is a critical component
    explanation: >-
      The review directly supports sputum culture as an actionable assessment
      biomarker while noting its limited sensitivity.
- name: Neutrophil Elastase (NE)
  presence: Elevated
  context: High sputum NE activity associates with severe bronchiectasis, exacerbation risk, airway bacterial load, and disease progression; mechanistic biomarker of neutrophil-driven inflammation
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: 'Pathophysiology of Bronchiectasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neutrophilic inflammation is characteristic of the disease, with elevated levels of harmful proteases such as neutrophil elastase associated with worse outcomes.
    explanation: Supports elevated neutrophil elastase as a biomarker linked to worse outcomes in bronchiectasis.
- name: Interleukin-1 beta (IL-1beta)
  presence: Elevated
  context: Subset of patients with high airway IL-1beta show severe disease, mucus hyperconcentration, impaired ciliary function, and Proteobacteria-enriched microbiome
  evidence:
  - reference: DOI:10.1183/13993003.01966-2023
    reference_title: 'Airway IL-1β is related to disease severity and mucociliary function in bronchiectasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with high sputum IL-1β had more severe disease, increased caspase-1 activity and an increased T-helper type 1, T-helper type 2 and neutrophil inflammatory response compared with patients with low IL-1β.
    explanation: Cohort study links elevated airway IL-1beta to greater severity and amplified inflammatory response.
- name: Neutrophil Extracellular Traps (NETs)
  presence: Elevated
  context: NET complexes in sputum associate with higher disease severity, exacerbations, and mortality; include MPO, NE, resistin, and azurocidin
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study found that NETs were present in sputum of patients with
      bronchiectasis and correlated with increasing severity, mortality, severe
      exacerbation, and a reduction in time to next exacerbation.
    explanation: >-
      The review reports multicohort sputum evidence linking NET abundance to
      severity, exacerbations, and mortality.

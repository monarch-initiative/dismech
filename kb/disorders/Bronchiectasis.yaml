- accession: dbgap:phs000518
  title: 'NHLBI GO-ESP Family Studies: Idiopathic Bronchiectasis'
  description:  The NHLBI "Grand Opportunity" Exome Sequencing Project (GO-ESP), a signature project of the NHLBI Recovery Act investment, was designed to identify genetic variants in coding regions (exons) of the human genome (the "exome") that are associated with heart, lung and blood diseases. These and related diseases that are of high impact to public health and individuals from diverse racial and ethnic groups will be studied.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Bronchiectasis"). Retrieved 2026-08-02.
- accession: dbgap:phs001279
  title: Cross-Sectional Characterization of Idiopathic Bronchiectasis
  description:  This GDMCC protocol will study adult patients with non-CF, idiopathic bronchiectasis, whose genetic etiologies are not known. Idiopathic bronchiectasis is reportedly more common in females with certain tall, thin body types and associated with environmental organisms, such as nontuberculous mycobacterium (NTM). The other susceptibility factors predisposing to bronchiectasis or acquisition of NTM are unclear. The study will attempt to broaden the understanding of this disease by comparing gender-associated factors and NTM status.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Bronchiectasis"). Retrieved 2026-08-02.

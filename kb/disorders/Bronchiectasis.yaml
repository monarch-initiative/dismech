environmental:
- name: Pollution
  notes: >-
    Short-term sulfur-dioxide exposure was associated with emergency visits for
    bronchiectasis exacerbations in one retrospective study.
  exposure_term:
    preferred_term: Air pollution exposure
    term:
      id: ECTO:8000036
      label: exposure to air pollution
  evidence:
  - reference: PMID:29772571
    reference_title: Effect of Air Pollution on Exacerbations of Bronchiectasis in Badalona, Spain, 2008-2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The number of emergency room visits for exacerbation of bronchiectasis is
      associated with higher levels of SO2.
    explanation: >-
      This retrospective observational study supports an association between
      sulfur-dioxide exposure and bronchiectasis exacerbation visits.
- name: Smoking
  notes: >-
    In one clinical cohort, patients who had smoked showed greater airway
    obstruction than nonsmokers, while otherwise having a similar clinical
    picture.
  exposure_term:
    preferred_term: Tobacco smoking exposure
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:7555168
    reference_title: Clinical, pathophysiologic, and microbiologic characterization of bronchiectasis in an aging cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who had smoked had much the same picture as nonsmokers, although
      they had a greater degree of airway obstruction.
    explanation: >-
      The cohort directly associates prior smoking with greater airway
      obstruction without implying broad causation of bronchiectasis.
  - reference: PMID:38888096
    reference_title: "The impact of smoking on bronchiectasis and its comorbidities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review emphasizes the role of smoking in bronchiectasis development and exacerbation by compromising airways and immune function."
    explanation: Review of the clinical literature supporting smoking as a driver of bronchiectasis development and exacerbation.
notes: Bronchiectasis is characterized by a self-sustaining "vicious vortex" of mucociliary dysfunction, persistent infection with Proteobacteria-dominant dysbiosis (notably Pseudomonas aeruginosa), and chronic neutrophil-driven inflammation. Neutrophils release proteases (NE, PR3, CatG) and form NETs that degrade extracellular matrix, impair ciliary function, and damage epithelial barriers. Inflammasome activation with airway IL-1beta is associated with severe disease, mucus hyperconcentration, and epithelial dysfunction. The disease leads to irreversible bronchial dilation and progressive airflow limitation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recent data show that neutrophil extracellular trap formation may be the key mechanism leading to protease release and severe bronchiectasis.
    explanation: Supports NET formation as a key mechanism for protease release and disease severity.

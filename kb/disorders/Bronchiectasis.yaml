datasets:
- accession: geo:GSE217516
  title: Single-cell RNA-sequencing of bronchoalveolar lavage cells from humans with bronchiectasis
  description: Bronchiectasis is a lung disease characterized by irreversible dilation of the large airways (bronchodilatation), which often causes recurrent airway infection and non-resolving inflammation. In this study, we performed single-cell RNA-sequencing (scRNA-seq) to determine the heterogeneity of immune cells in the airways of bronchiectasis patients.

- name: Inflammasome Activation and IL-1beta Signaling
  description: NLRP3 inflammasome activation drives IL-1beta production, which directly impairs ciliary function, disrupts tight junctions, promotes mucus hyperconcentration, and is associated with severe disease and Proteobacteria enrichment.
  downstream:
  - target: Impaired Mucociliary Clearance
    description: >-
      Chronic IL-1beta exposure compromises epithelial cilia and tight-junction
      function, weakening mucociliary clearance.
    evidence:
    - reference: DOI:10.1183/13993003.01966-2023
      reference_title: Airway IL-1β is related to disease severity and mucociliary function in bronchiectasis
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Chronic IL-1β treatment reduced the functionality of cilia and tight junctions of epithelial cells
      explanation: >-
        Airway epithelial-cell experiments directly support the causal edge
        from chronic IL-1beta signaling to impaired clearance.
  evidence:

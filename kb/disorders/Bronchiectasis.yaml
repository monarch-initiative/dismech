- name: Microbiome Dysbiosis
  description: Reduced microbial diversity with Proteobacteria dominance, particularly Pseudomonas aeruginosa and Haemophilus influenzae, drives chronic infection, exacerbations, and disease progression.
  downstream:
  - target: Recurrent Respiratory Infections
    description: Proteobacteria-dominant dysbiosis with persistent pathogen colonization drives chronic and recurrent airway infection.
  - target: Pulmonary Exacerbations
    description: >-
      Airway resistance-gene profiles and adverse resistotypes identify patients
      with more frequent exacerbations and poorer outcomes.
    evidence:
    - reference: DOI:10.1164/rccm.202306-1059oc
      reference_title: Airway “Resistotypes” and Clinical Outcomes in Bronchiectasis
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Proportional differences in baseline resistome profiles, including
        increased macrolide and multidrug resistance genes, associate with
        shorter intervals to the next exacerbation, whereas distinct resistome
        archetypes associate with frequent exacerbations, poorer lung function,
        geographic origin, and the host microbiome.
      explanation: >-
        Longitudinal human metagenomic data associate airway resistome states
        with time to and frequency of exacerbations.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: 'Pathophysiology of Bronchiectasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Loss of diversity of the normal lung microbiota and dominance of proteobacteria such as Pseudomonas and Haemophilus are features of severe bronchiectasis and link to poor outcomes.
    explanation: Direct support for Proteobacteria dominance as a feature of severe disease.
  - reference: DOI:10.1186/s12931-024-02931-x
    reference_title: 'The clinical impacts of lung microbiome in bronchiectasis with fixed airflow obstruction: a prospective cohort study'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with bronchiectasis, with or without FAO, had similar microbiome profiles characterized by reduced alpha diversity and a predominance of Proteobacteria
    explanation: Confirms reduced alpha diversity and Proteobacteria predominance via 16S rRNA sequencing of BAL samples.
  - reference: DOI:10.1183/16000617.0038-2024
    reference_title: Infection and the microbiome in bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bronchiectasis is marked by bronchial dilatation, recurrent infections and
      significant morbidity, underpinned by a complex interplay between
      microbial dysbiosis and immune dysregulation.
    explanation: >-
      This review directly supports microbiome–immune interplay as a central
      bronchiectasis mechanism.

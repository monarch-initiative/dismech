progression:
- phase: Variable onset and progressive structural lung damage
  age_range: Childhood through adulthood
  notes: >-
    Bronchiectasis can arise in children or adults from heterogeneous causes.
    Chronic inflammation, infection, and mucus obstruction can drive
    progressive structural injury after disease begins.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The contribution of chronic inflammation, infection, and mucus
      obstruction leads to progressive structural lung damage.
    explanation: >-
      The review supports progressive structural damage but does not define a
      uniform age-specific natural history.
pathophysiology:
- name: Chronic Infection and Inflammation
  description: Persistent microbial infections and inflammation damage airway walls, leading to dilation and thickening.
  evidence:
  - reference: DOI:10.1183/16000617.0055-2024
    reference_title: 'Pathophysiology and genomics of bronchiectasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presence of airway infection together with chronic inflammation, airway mucociliary dysfunction and lung damage are key components of the vicious vortex model that better describes its pathophysiology.
    explanation: Vicious vortex model centers on chronic infection plus inflammation as the core pathophysiology of bronchiectasis.
  downstream:
  - target: Neutrophil-Driven Inflammation
    description: >-
      Persistent airway infection and higher bacterial burden sustain the
      characteristic neutrophilic inflammatory response.
    evidence:
    - reference: DOI:10.1055/s-0041-1730891
      reference_title: Pathophysiology of Bronchiectasis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Neutrophilic inflammation is associated with elevated bacterial loads
        and chronic infection with organisms such as Pseudomonas aeruginosa.
      explanation: >-
        The review directly associates chronic airway infection and bacterial
        burden with neutrophilic inflammation.
  - target: Airway Dilation
    description: >-
      Persistent infection, inflammation, and mucus obstruction cause
      progressive structural airway damage that culminates in irreversible
      bronchial dilation.
    evidence:
    - reference: DOI:10.1055/s-0041-1730891
      reference_title: Pathophysiology of Bronchiectasis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The contribution of chronic inflammation, infection, and mucus
        obstruction leads to progressive structural lung damage.
      explanation: >-
        The review directly links the interacting inflammatory, infectious, and
        mucus-obstruction components to progressive structural damage.
  - target: Pulmonary Exacerbations
    description: >-
      Recurrent increases in infection and inflammation manifest clinically as
      pulmonary exacerbations.
    evidence:
    - reference: PMID:40293759
      reference_title: 'Non-Cystic Fibrosis Bronchiectasis in Adults: A Review.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Exacerbations of bronchiectasis, which typically present with increased
        cough and sputum and worsened fatigue, are associated with progressive
        decline in lung function and decreased quality of life.
      explanation: >-
        The review defines the clinical exacerbation outcome and its sequelae;
        the infection-to-exacerbation transition is not isolated experimentally.
  - target: Fatigue
    description: >-
      The chronic disease burden and exacerbation episodes contribute to
      clinically important fatigue.
    evidence:
    - reference: PMID:40293759
      reference_title: 'Non-Cystic Fibrosis Bronchiectasis in Adults: A Review.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Exacerbations of bronchiectasis, which typically present with increased
        cough and sputum and worsened fatigue, are associated with progressive
        decline in lung function and decreased quality of life.
      explanation: >-
        The review identifies worsened fatigue during exacerbations; this edge
        represents a clinical output rather than an isolated causal experiment.
- name: Airway Dilation
  description: Destruction of elastin and cartilage in the bronchial walls causes irreversible dilation of bronchi.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bronchiectasis is a complex, heterogeneous disorder defined by both a
      radiological abnormality of permanent bronchial dilatation and a clinical
      syndrome.
    explanation: >-
      The review identifies permanent bronchial dilation as the defining
      structural abnormality.
  downstream:
  - target: Impaired Mucociliary Clearance
  - target: Fixed Airflow Obstruction
    description: Irreversible structural destruction and dilation of the bronchial walls produces the progressive, fixed airflow limitation seen in bronchiectasis.
  - target: Dyspnea
    description: Airway structural damage and airflow limitation manifest clinically as breathlessness.
  - target: Wheezing
    description: Distorted, dilated airways and luminal narrowing during airflow produce wheeze.
  - target: Hemoptysis
    description: Bronchial wall destruction with hypertrophied, fragile bronchial
      arteries predisposes to airway bleeding.
  - target: Crackles
    description: >-
      Distorted, secretion-filled airways generate discontinuous adventitious
      sounds on auscultation.
    evidence:
    - reference: PMID:7555168
      reference_title: Clinical, pathophysiologic, and microbiologic characterization of bronchiectasis in an aging cohort.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The finding of crackles on chest examination was the rule (70%) with
        wheezing present in 34% of the group.
      explanation: >-
        The cohort establishes crackles as a frequent clinical output; the
        structural airway-to-sound mechanism is not isolated experimentally.
- name: Airway Surface Liquid Dehydration
  description: >-
    An epithelial ion-transport route into the vicious vortex, separate from the
    infection-driven route. Hyperactive epithelial sodium channel (ENaC) function
    increases sodium absorption across the airway epithelium and draws water out
    of the airway surface liquid; reduced CFTR-mediated chloride and fluid
    secretion acts in the same direction. The resulting dehydrated, viscous
    surface liquid impairs mucus transport, which is why variants in the ENaC
    subunit genes are found in idiopathic bronchiectasis and why the effect is
    clearest in patients who also carry a CFTR variant.
  cell_types:
  - preferred_term: airway epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  genes:
  - preferred_term: SCNN1A
    term:
      id: hgnc:10599
      label: SCNN1A
  - preferred_term: SCNN1G
    term:
      id: hgnc:10602
      label: SCNN1G
  - preferred_term: CFTR
    term:
      id: hgnc:1884
      label: CFTR
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that several variants in ENaCbeta and gamma genes might be deleterious for ENaC function and lead to bronchiectasis, especially in patients who are trans-heterozygotes for ENaCbeta/CFTR mutations or variants."
    explanation: >-
      The authors' own hedged conclusion: ENaC-subunit variants may impair
      channel function and lead to bronchiectasis, most clearly alongside a CFTR
      variant. It supports this node as a route into the disease and is also the
      basis for typing these genes as susceptibility rather than causative.
  - reference: PMID:19462466
    reference_title: "Mutations in the amiloride-sensitive epithelial sodium channel in patients with cystic fibrosis-like disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.W493R-SCNN1A polymorphism was even found to result in a four-fold more active ENaC channel when heterologously expressed in Xenopus laevis oocytes."
    explanation: >-
      A heterologous-expression measurement showing that an SCNN1A variant found
      enriched in these patients makes the channel more active, which is the
      direction of effect this node asserts.
  downstream:
  - target: Impaired Mucociliary Clearance
    causal_link_type: DIRECT
    description: >-
      A dehydrated, hyperconcentrated periciliary layer prevents effective
      ciliary mucus transport, feeding the same clearance failure that airway
      dilation produces by a structural route.
- name: Impaired Mucociliary Clearance
  description: Damage and dilation of airways hinder effective clearance of mucus, allowing for accumulation and further infection.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ciliary dysfunction is also a key feature, exemplified by the rare genetic
      syndrome of primary ciliary dyskinesia.
    explanation: >-
      The review identifies ciliary dysfunction as a core bronchiectasis
      mechanism.
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who carry the p.W493R-SCNN1A, a variant that encodes for a
      hyperactive ENaC channel, have been identified as being at a higher risk
      of developing bronchiectasis.
    explanation: >-
      This human association wires hyperactive epithelial sodium-channel
      function to the impaired-clearance mechanism, while remaining cautious
      about causality and other SCNN1A variants.
  downstream:
  - target: Chronic Infection and Inflammation
    description: >-
      Retained sputum creates a reservoir for persistent infection and
      inflammation, completing the vicious-vortex feedback loop.
    evidence:
    - reference: DOI:10.1055/s-0041-1730891
      reference_title: Pathophysiology of Bronchiectasis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dysfunctional mucociliary clearance can lead to sputum retention in the
        airways, creating a harbor for infection
      explanation: >-
        The review directly links failed clearance to retained sputum and a
        permissive environment for infection. The quote stops before the
        source's next word, which the PDF text renders with an fl ligature.
  - target: Recurrent Respiratory Infections
    description: Failure to clear mucus and trapped microbes permits persistent and recurrent airway infection.
    evidence:
    - reference: DOI:10.1055/s-0041-1730891
      reference_title: Pathophysiology of Bronchiectasis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathophysiology of disease is understood in terms of interdependent
        concepts of chronic infection, inflammation, impaired mucociliary
        clearance, and structural lung damage.
      explanation: >-
        The review supports the interdependence of impaired clearance and
        chronic infection; it does not isolate this edge experimentally.
  - target: Chronic Cough
    description: Retained, hyperconcentrated airway secretions stimulate the cough reflex.

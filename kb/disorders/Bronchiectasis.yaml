  evidence:
  - reference: PMID:42480819
    reference_title: 'Management of Adult Bronchiectasis: An American College of Chest Physicians Clinical Practice Guideline.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bronchiectasis is a chronic respiratory condition involving a cycle of
      impaired mucociliary clearance, chronic infections, inflammation, and
      progressive airway destruction, leading to persistent cough with sputum
      production, dyspnea, and fatigue.
    explanation: >-
      The CHEST guideline explicitly includes fatigue among the clinical
      consequences of bronchiectasis.
- category: Respiratory

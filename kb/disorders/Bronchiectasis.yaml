- name: Neutrophil-Driven Inflammation
  description: Excessive neutrophil recruitment, degranulation, and NET formation release proteases (neutrophil elastase, proteinase 3, cathepsin G) that degrade extracellular matrix, impair ciliary function, and damage epithelial barriers.
  downstream:
  - target: Protease-Antiprotease Imbalance
    description: Excessive neutrophil serine protease release overwhelms airway antiproteases, establishing the protease-antiprotease imbalance.
    evidence:
    - reference: DOI:10.1183/16000617.0179-2024
      reference_title: Neutrophilic inflammation in bronchiectasis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The excessive release of neutrophil serine proteases, such as
        neutrophil elastase, cathepsin G and proteinase 3, promotes a
        protease–antiprotease imbalance that correlates with increased
        inflammation in bronchiectasis and contributes to disease progression.
      explanation: >-
        The review directly links neutrophil serine-protease release to the
        protease-antiprotease imbalance.
  evidence:
  - reference: DOI:10.1183/16000617.0179-2024
    reference_title: 'Neutrophilic inflammation in bronchiectasis'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The excessive release of neutrophil serine proteases, such as neutrophil elastase, cathepsin G and proteinase 3, promotes a protease–antiprotease imbalance that correlates with increased inflammation in bronchiectasis and contributes to disease progression.
    explanation: Direct evidence that neutrophil serine proteases drive inflammation and disease progression in bronchiectasis.
  - reference: DOI:10.1055/s-0041-1730891

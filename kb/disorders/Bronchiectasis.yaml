- accession: ega:EGAS50000001808
  title: Integrated Single-Cell and Microbiome Profiling of Stable Bronchiectasis Across Disease Severity
  description: Bronchiectasis is a chronic respiratory disease characterized by persistent airway inflammation and recurrent infections. In this study, sputum samples from patients with mild, moderate, and severe bronchiectasis, collected during clinically stable disease, were analyzed using flow cytometry, single-cell RNA sequencing, and 16S rRNA gene sequencing. The resulting datasets enable characterization of neutrophil populations, transcriptional states, and airway microbial communities across disease severity stages.

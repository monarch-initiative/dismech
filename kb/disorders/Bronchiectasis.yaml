- accession: geo:GSE261102
  title: 'Autologous transplantation of P63+ lung progenitor cells in patients with bronchiectasis: a randomized, single-blind, controlled trial'
  description: Non-cystic fibrosis bronchiectasis is a severe respiratory disease characterized by progressive loss of lung function, resulting in high morbidity and even early mortality. Current treatments cannot repair progressive lung damage, which encouraged the exploration of stem and progenitor cell-based regenerative therapies. In current study, we found that the P63+ progenitor cells normally located in airway basal layer could appear in the alveolar spaces of bronchiectasis patients. We successfully cloned and expanded the progenitor cells from the airway brushing tissues of patients.

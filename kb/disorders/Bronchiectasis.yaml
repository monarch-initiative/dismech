    term:
      id: hgnc:1884
      label: CFTR
  association: Modifier gene
  notes: CFTR ion channel dysfunction contributes to airway surface liquid dehydration and mucus abnormalities in non-CF bronchiectasis, though the role is debated.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These studies highlight that the role of CFTR in bronchiectasis remains
      contentious and that further multicenter studies on larger cohorts of
      patients are needed to resolve this debate.
    explanation: >-
      The review explicitly characterizes the human CFTR association as
      unresolved, so this is retained only as a proposed modifier.
- name: SCNN1A
  gene_term:
    preferred_term: SCNN1A
    term:
      id: hgnc:10599
      label: SCNN1A
  association: Susceptibility gene
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ENaC (epithelial sodium channel) alpha subunit; hyperactivity causes airway
    surface dehydration and increased mucus viscosity, impairing mucociliary
    clearance. MONDO:0013087 "bronchiectasis with or without elevated sweat
    chloride 2" is the class for this gene's contribution and is recorded as a
    narrowMatch on this entry. Typed SUSCEPTIBILITY rather than CAUSATIVE: the
    cohort report attributes only a small fraction of patients to a Mendelian
    ENaC mechanism and rests the rest of its case on a case-control excess of
    rare polymorphisms.
  evidence:
  - reference: PMID:19462466
    reference_title: "Mutations in the amiloride-sensitive epithelial sodium channel in patients with cystic fibrosis-like disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a small fraction of the patients, the disease could be potentially explained by an ENaC mutation by a Mendelian mechanism, such as p.V114I and p.F61L in SCNN1A."
    explanation: >-
      Names the two SCNN1A alleles the authors consider potentially Mendelian,
      and the hedging plus "small fraction" is why this record is typed
      SUSCEPTIBILITY.
  - reference: PMID:19462466
    reference_title: "Mutations in the amiloride-sensitive epithelial sodium channel in patients with cystic fibrosis-like disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, a significantly higher number of patients carried c.-55+5G>C or p.W493R in SCNN1A in the heterozygous state, with odds ratios (ORs) of 13.5 and 2.7, respectively."
    explanation: >-
      The case-control association for two heterozygous SCNN1A variants, which is
      a susceptibility observation rather than evidence of segregation.
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who carry the p.W493R-SCNN1A, a variant that encodes for a
      hyperactive ENaC channel, have been identified as being at a higher risk
      of developing bronchiectasis.
    explanation: >-
      The review reports human susceptibility evidence for one SCNN1A variant;
      this does not establish broad causality for all SCNN1A variation.
- name: SCNN1G
  gene_term:
    preferred_term: SCNN1G
    term:
      id: hgnc:10602
      label: SCNN1G
  association: Susceptibility gene
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ENaC gamma subunit. Two heterozygous amino-acid changes were found in
    patients with idiopathic bronchiectasis who carried no two CFTR coding
    mutations. MONDO:0013112 "bronchiectasis with or without elevated sweat
    chloride 3" is the class for this gene's contribution and is recorded as a
    narrowMatch on this entry. The same cohort's beta-subunit gene SCNN1B carried
    three of the five reported variants (p.Ser82Cys, p.Pro369Thr, p.Asn288Ser),
    and is deliberately not curated as a separate record: an OLS4 MONDO search
    for "SCNN1B" returns only MONDO:0020607 Liddle syndrome 1, and the three
    children of MONDO:0018956 idiopathic bronchiectasis are BESC1
    (MONDO:0008887, no causal gene asserted), BESC2 and BESC3, so the
    sweat-chloride series has no beta-subunit class to bind.
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the exons and flanking introns of the ENaCbeta and gamma gene identified five different amino-acid changes"
    explanation: >-
      The variant discovery this record rests on, in a cohort selected for
      idiopathic bronchiectasis without two CFTR coding mutations.
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that several variants in ENaCbeta and gamma genes might be deleterious for ENaC function and lead to bronchiectasis, especially in patients who are trans-heterozygotes for ENaCbeta/CFTR mutations or variants."
    explanation: >-
      The authors' conclusion, which is hedged and conditions the effect on a
      concurrent CFTR variant; this is the basis for the SUSCEPTIBILITY typing.

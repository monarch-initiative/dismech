mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013087
      label: bronchiectasis with or without elevated sweat chloride 2
    mapping_predicate: skos:narrowMatch
    mapping_source: dismech
    mapping_justification: >
      The ENaC-subunit branch of this disease. MONDO:0013087 (BESC2) and
      MONDO:0013112 (BESC3) are grandchildren of this entry's MONDO:0004822
      anchor, through MONDO:0018956 idiopathic bronchiectasis, and their OWL
      axioms assert SCNN1A (hgnc:10599) and SCNN1G (hgnc:10602) respectively as
      causal genes. Both genes are curated on this entry as `genetic:` records
      wired to the Airway Surface Liquid Dehydration node. They are typed
      `SUSCEPTIBILITY` rather than `CAUSATIVE`, and no gene-defined
      `has_subtypes` row is created, because the primary reports describe
      heterozygous variants and case-control enrichment rather than Mendelian
      segregation of a clinically separable entity. The report behind
      MONDO:0013112 found five beta- and gamma-subunit amino-acid changes, two of
      them in SCNN1G, in the heterozygous state in 8 of its 55 patients, and
      concluded that they "might be deleterious", with the effect clearest in
      trans-heterozygotes who also carry a CFTR variant. The report behind
      MONDO:0013087 attributes only "a small fraction" of its cohort to a
      Mendelian mechanism and otherwise reports a more than three-fold excess of
      rare ENaC polymorphisms over controls. This is a considered disagreement with MONDO's `RO:0004003`
      typing, not an omission.
  - term:
      id: MONDO:0013112
      label: bronchiectasis with or without elevated sweat chloride 3
    mapping_predicate: skos:narrowMatch
    mapping_source: dismech
    mapping_justification: >
      The SCNN1G half of the same ENaC branch; see the justification on
      MONDO:0013087 above, which covers both terms.

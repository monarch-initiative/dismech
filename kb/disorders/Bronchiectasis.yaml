- accession: geo:GSE302095
  title: Validation of bronchial airway gene expression associated with bronchiectasis in nasal epithelium
  description: 'Objectives: Examination of bronchial epithelium-derived gene expression signature of bronchiectasis (BE) in nasal epithelium. Methods: We studied 220 participants from the Detection of Early Lung Cancer Among Military Personnel study with bulk RNA-seq of nasal epithelium brushings. Gene set enrichment analysis (GSEA) was used to examine whether genes previously identified as increased or decreased in the bronchial epithelium of individuals with radiologic BE are significantly enriched among the genes most significantly altered in the nasal epithelium.'

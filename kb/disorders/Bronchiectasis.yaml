    review, not a single worldwide point estimate. Rates vary substantially by
    population, age, ascertainment, and calendar period.
  evidence:
  - reference: DOI:10.1055/s-0041-1730891
    reference_title: Pathophysiology of Bronchiectasis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

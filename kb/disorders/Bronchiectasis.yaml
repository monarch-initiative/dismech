      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        NE can damage the extracellular matrix
      explanation: >-
        The review directly supports extracellular-matrix damage by neutrophil
        elastase; the final transition to macroscopic dilation remains an
        inferred structural consequence.
  - target: Impaired Mucociliary Clearance
    description: >-
      Excess neutrophil elastase reduces ciliary beating and thereby weakens

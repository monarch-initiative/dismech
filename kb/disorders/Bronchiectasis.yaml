    snippet: >-
      Based on 47 studies, the panel developed 13 evidence-based
      recommendations addressing key management domains, including antibiotic
      treatment for acute exacerbations, duration and route of antibiotic
      therapy, long-term suppressive antibiotic and anti-inflammatory
      therapies, airway clearance strategies, management of hemoptysis and
      consideration of surgical resection in selected patients.
    explanation: >-
      The abstract establishes that selected-patient resection is addressed,
      but does not expose the direction or certainty of the recommendation.
    directness: INDIRECT

- phase: Outcome
  description: >-
    Often indolent, but not uniformly. In the 2020 series, after a median 48 months, three
    patients were alive with stable disease, one had progressed and three had died; over the first
    ten published cases the same three died (the 2022 letter's table lists all three deaths among
    the 2020 cases), at a stated median follow-up of 29.5 months that its table's follow-up times
    do not reproduce, and the letter says the remainder are alive with stable disease or no signs
    of recurrence; a 2024 count over eleven cases keeps apart one patient who had progressed after
    subtotal resection. Dissemination through the cerebrospinal fluid is reported in one 2021
    patient, on cytology that could not confirm the cells as tumour cells, and two 2026 reports
    each present radiologically documented spread as a first: focal leptomeningeal dissemination
    after a ventriculoperitoneal shunt and radiosurgery, and spread in a patient followed for more
    than ten years. One case report says the tumour seems relatively benign while warning that
    SMARCB1 deficiency calls for care, another says that management and prognosis are still
    unclear, and no grade has been established.

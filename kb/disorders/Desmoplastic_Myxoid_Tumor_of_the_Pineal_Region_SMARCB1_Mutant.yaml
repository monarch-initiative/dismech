  description: >-
    All of the first ten published patients had surgery, six a gross total and four a subtotal
    resection. After gross total resection of a tumour with a Ki-67 index below 1%, one 2024
    patient had no further treatment.
    Single case reports add detail: in the 24-year-old woman (2021), one of the four subtotal
    resections among the first ten, the tumour could not be completely resected where it adhered to
    the vein of Galen, the basal vein of Rosenthal and the pulvinar; in the same 2024 patient, after

progression:
- phase: Onset
  description: >-
    Adolescence and adulthood. The seven patients of the 2020 series were four women and three men
    with a median age of 40 years (range 15-61). Pooled reviews of the published cases give a mean
    age at onset of 36.6 years over the first ten cases (six women, four men) and of 39 years over
    eleven (seven women, four men; a stated mean that the report's own table does not reproduce
    exactly), both with the same range, and a 2026 letter gives, with a citation and a pointer to
    its literature table, a median of 33 years and a female-to-male ratio of 2; no case in an
    infant or young child had been found by 2024. These reviews count the same patients again as
    cases are added.
    Another 2024 case report, pooling the same ten earlier cases with its own 18-year-old patient,
    gives a mean of 34.9 years over eleven (seven women, four men; range 15 to 61).

notes: >-
  Every figure in the entry comes from a handful of patients. The tumour was proposed in 2020 from
  seven cases; about 15 had been reported by 2026, and the pooled reviews count the same patients
  again: the first ten cases of the 2022 letter include the seven of the 2020 series, and later
  reviews add later cases to them. The 2021 case report of a 24-year-old woman reported as having
  cerebrospinal fluid spread and the 2022 clinical-management letter describe the same patient. No
  cell of origin has been identified, so no pathophysiology node binds a cell type. The 2020 series
  found the tumour's DNA methylation profile similar to that of ATRT-MYC, while a 2026 review
  describes a cluster of its own; the differential diagnoses section records atypical
  teratoid/rhabdoid tumour, poorly differentiated chordoma and seven other tumours, each with a
  stated feature on which the cited sources tell it apart from DMT. The cited sources also name
  other tumours beside DMT that are not rows, among them meningioma, since a 2026 letter
  (PMID:42445896) suggests, from their similar morphology and immunophenotype, that DMT and
  metaplastic, myxoid or chordoid meningioma of the pineal region may be the same entity rather than
  two tumours to tell apart; lymphoma, which a 2022 review (PMID:35954310) lists among uncommon
  pineal region tumours and one report names in its statement that a patient's first biopsy found
  neither a germ cell tumour nor a lymphoma, with no feature in the cited sources, beyond that same
  negative first biopsy, telling it apart from DMT; and SMARCB1-deficient tumours as a class beyond
  atypical teratoid/rhabdoid tumour and poorly differentiated chordoma. Also left out are presenting
  features reported in one or two cases (dizziness, in two, which HPO has only as a synonym of
  HP:0002321 Vertigo in an OLS search of HPO for "dizziness"; drowsiness; diplopia; papilloedema;
  sudden loss of vision; tonsillar herniation; haemorrhage or calcification on imaging), haemorrhage
  and necrosis in the tissue of one 2024 tumour, radiosurgery, the epigenetic imbalance (PRC2
  dependency and H3K27 trimethylation) that a 2026 review states in general terms for SMARCB1 loss,
  and the EZH2-targeted therapy it extrapolates from other SMARCB1-deficient tumours.

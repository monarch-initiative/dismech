- name: Low proliferation index
  finding_term:
    preferred_term: low Ki-67 (MIB-1) proliferation index
  description: >-
    The Ki-67 (MIB-1) proliferation index is low in most tumours (median 3% in the 2020 series),
    and mitotic activity is low; the WHO criteria include a lack of histological signs of
    malignancy. Some tumours have a higher index: two of eleven cases in a 2024 pooled review had
    more than 10% (15%, and 15.4% in the 2021 tumour that its own report calls slightly elevated),
    and the two tumours of a 2026 report had an increased index. One 2024 tumour, low overall
    (1-2%), was focally about 10%.

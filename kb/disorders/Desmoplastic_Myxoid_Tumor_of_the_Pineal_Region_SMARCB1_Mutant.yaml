notes: >-
  Every figure in the entry comes from a handful of patients. The tumour was proposed in 2020 from
  seven cases; about 15 had been reported by 2026, and the pooled reviews count the same patients
  again: the first ten cases of the 2022 letter include the seven of the 2020 series, and later
  reviews add later cases to them. The 2021 case report of a 24-year-old woman reported as having
  cerebrospinal fluid spread and the 2022 clinical-management letter describe the same patient. No
  cell of origin has been identified, so no pathophysiology node binds a cell type. The 2020
  series found the tumour's DNA methylation profile similar to that of ATRT-MYC, while a 2026
  review describes a cluster of its own; the differential diagnosis against atypical
  teratoid/rhabdoid tumour, poorly differentiated chordoma, meningioma and the other pineal region
  tumours is not curated here. Also left out are presenting features reported in one or two cases
  (dizziness, in two, which HPO has only as a synonym of HP:0002321 Vertigo in an OLS search of
  HPO for "dizziness"; drowsiness; diplopia; papilloedema; sudden loss of vision; tonsillar
  herniation; haemorrhage or calcification on imaging), haemorrhage and necrosis in the tissue of
  one 2024 tumour, radiosurgery, and the SWI/SNF and PRC2 (EZH2) imbalance and EZH2-targeted
  therapy that a 2026 review extrapolates from other SMARCB1-deficient tumours.

name: Desmoplastic Myxoid Tumor of the Pineal Region, SMARCB1-Mutant
creation_date: '2026-11-23T17:31:56Z'
category: Cancer
synonyms:
- Desmoplastic Myxoid Tumor, SMARCB1-Mutant
- DMT-SMARCB1
description: >-
  Desmoplastic myxoid tumour of the pineal region, SMARCB1-mutant (DMT) is a rare tumour of the
  pineal region of adolescents and adults that has lost the SMARCB1 (INI1) protein. It was
  proposed in 2020 from seven tumours, with a median patient age of 40 years (range 15-61), that
  shared spindled and epithelioid cells in a desmoplastic stroma alternating with a loose myxoid
  matrix, loss of nuclear SMARCB1, a low proliferation index in most, and a DNA methylation
  profile that grouped the seven together and resembled that of the MYC group of atypical
  teratoid/rhabdoid tumour (ATRT-MYC). The 2021 WHO classification of central nervous system
  tumours added it as a SMARCB1-mutant tumour lacking histological signs of malignancy. Reported
  presenting features include a pineal mass, with obstructive hydrocephalus in several reported
  cases, and headache, nausea and vomiting or an upgaze palsy (Parinaud syndrome). About 15 cases
  had been reported by 2026, seven of them in the 2020 series. Many patients are alive with stable
  disease or without recurrence after resection, with or without radiotherapy, but three of the
  first ten died. One patient had cells resembling the tumour's in the cerebrospinal fluid, which
  the authors judged to be tumour cells but could not confirm, and two 2026 reports describe
  spread seen on imaging, one in a patient followed for more than ten years. Grading criteria and
  the role of adjuvant therapy are not defined, and no cell of origin has been identified.
categories:
- Central Nervous System Neoplasm
- Pineal Region Tumor
- SWI/SNF-Deficient Tumor
- Rare Cancer
parents:
- pineal body neoplasm

genetic:
- name: SMARCB1
  gene_term:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  relationship_type: SOMATIC_DRIVER
  notes: >-
    SMARCB1 alteration defines the tumour type. The 2020 series found heterozygous or homozygous
    SMARCB1 deletions in five of seven tumours and frameshift mutations in two; a 2021 case had a
    SMARCB1 deletion; in a 2024 case a tumour panel found no pathogenic mutation but a missense
    variant of unknown significance. No variant origin is recorded, because no cited source
    reports germline testing. The gene is graded a somatic driver because the alterations define
    the tumour type and a 2026 review files them under somatic alterations.
  evidence:
  - reference: PMID:42058762
    reference_title: 'Genetic landscape and molecular targets in pediatric pineal tumors.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic alterations. Molecular genetic examinations revealed recurrent SMARCB1 alterations in desmoplastic myxoid tumor of the pineal region."
    explanation: >-
      A 2026 review files the recurrent SMARCB1 alterations under the heading somatic alterations.
  - reference: PMID:31732806
    reference_title: 'Desmoplastic myxoid tumor, SMARCB1-mutant: clinical, histopathological and molecular characterization of a pineal region tumor encountered in adolescents and adults.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three cases displayed heterozygous SMARCB1 deletions and two cases a homozygous SMARCB1 deletion."
    explanation: SMARCB1 deletions in five of the seven tumours of the 2020 series.
  - reference: PMID:31732806
    reference_title: 'Desmoplastic myxoid tumor, SMARCB1-mutant: clinical, histopathological and molecular characterization of a pineal region tumor encountered in adolescents and adults.'

    A tumour of spindled and epithelioid cells in a desmoplastic and myxoid stroma, found in the
    pineal region in every reported case, although, as a 2026 letter notes, the WHO essential
    criteria do not include the location. Growing there it can block the flow of cerebrospinal
    fluid and press on the dorsal midbrain. No cell of origin has been identified.
  notes: >-
    Bound to UBERON:0001905 pineal body, following MONDO's classification of the tumour under
    pineal body neoplasm; the term is narrower than the pineal region the sources name. An OLS
    search of UBERON for "pineal region" returned only UBERON:0001942 medial habenular nucleus,
    and a search for "pineal" returned pineal body and nearby structures, among them
    UBERON:0015238 pineal complex, which was not used so that the binding follows MONDO.

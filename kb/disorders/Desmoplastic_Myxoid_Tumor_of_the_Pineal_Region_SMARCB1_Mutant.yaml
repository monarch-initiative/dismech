differential_diagnoses:
- name: Atypical teratoid/rhabdoid tumour
  disease_term:
    preferred_term: atypical teratoid rhabdoid tumor
    term:
      id: MONDO:0020560
      label: atypical teratoid rhabdoid tumor
  description: >-
    Atypical teratoid/rhabdoid tumour (AT/RT) shares the loss of SMARCB1 but is a highly malignant
    tumour, more common in infants and young children, and most high-grade central nervous system
    tumours with loss of nuclear SMARCB1 (or SMARCA4) can be categorised as AT/RT. DMT has not been
    reported in infants or young children, can present as a low-grade lesion, and appears to follow
    a less aggressive course, though its behaviour is variable and no grade has been assigned; 3 of
    the 7 patients of the 2020 series died of the disease, and a 2026 letter counts the same three
    deaths among 12 patients (its table lists all three among the 2020 cases) and suggests that the
    tumour's location, rather than an intrinsic malignancy, may explain them. DMT is defined by,
    among other criteria, the absence of histological signs of malignancy. On DNA methylation DMT
    forms its own group, close to but distinct from AT/RT: in the 2020 series the tumours grouped
    closely together and showed similarities with the MYC subgroup of AT/RT, a 2021 case grouped
    with DMT, close to but distinct from three AT/RT groupings, and two reviews that generated no
    methylation data of their own differ in emphasis, a 2022 review calling DMT's profile close to
    the MYC subgroup and a 2026 review reading the published profiles as a cluster apart from the
    major AT/RT subgroups. Atypical teratoid/rhabdoid tumour is curated separately as
    Atypical_Teratoid_Rhabdoid_Tumor.
  distinguishing_features:
  - AT/RT is more common in infants and young children; DMT has not been reported in them
  - AT/RT is highly malignant; DMT appears less aggressive, though deaths from the disease have been
    reported
  - By definition DMT lacks histological signs of malignancy, one of its essential diagnostic
    criteria
  - Most high-grade central nervous system tumours with SMARCB1 (or SMARCA4) loss can be categorised
    as AT/RT; DMT may present as a low-grade lesion
  - DMTs form their own DNA methylation group, with similarities to the MYC subgroup of AT/RT in the
    2020 series; a 2026 review places them apart from the three major AT/RT subgroups
  evidence:
  - reference: PMID:39586083
    reference_title: 'Desmoplastic myxoid tumor of the pineal region, SMARCB1 mutant: illustrative case.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In the CNS, loss of SMARCB1 can be seen in atypical teratoid/rhabdoid tumor (AT/RT) and poorly differentiated chordoma (PDC). Compared with other subtypes of tumors, these have a poorer prognosis. Between the two, AT/RT is more common in infants and young children and is defined as a highly malignant CNS tumor."
    explanation: >-
      Background in a 2024 case report: AT/RT, like DMT, loses SMARCB1, and is a highly malignant
      tumour more common in infants and young children.
  - reference: PMID:39586083
    reference_title: 'Desmoplastic myxoid tumor of the pineal region, SMARCB1 mutant: illustrative case.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical statistics of all cases show that DMT tends to occur more frequently in women (females: 7, males: 4). The average age at onset is 39 years, with the youngest being 15 years and the oldest being 61 years. No cases of the disease in infants and young children have been found so far."
    explanation: >-
      Pooled across 11 published cases: DMT has not been reported in infants or young children.
  - reference: PMID:37969088

- name: DNA methylation profiling
  diagnosis_term:
    preferred_term: DNA methylation profiling
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  description: >-
    Confirms unresolved cases. In the 2020 series most profiles were not classifiable with the
    Heidelberg Brain Tumor Classifier of the time (v11b4), but on unsupervised analysis the seven
    grouped together and resembled ATRT-MYC; later tumours have grouped with them or close to
    other SMARCB1-deficient CNS tumours, and one 2024 tumour was classified as this tumour with a
    confidence score of 0.99. A 2021 case report also names poorly differentiated chordoma in its
    background. A 2026 review, summarising methylation classifications reported in previously
    published studies without generating data of its own, describes a compact cluster separate
    from all three AT/RT groups, from poorly differentiated chordoma and from neural malignant
    rhabdoid tumour, so the cited sources describe the profile's closeness to ATRT-MYC
    differently. A review names the tumour among the WHO CNS5 types that are offshoots of DNA
    methylation profiling.
  evidence:
  - reference: PMID:31732806
    reference_title: 'Desmoplastic myxoid tumor, SMARCB1-mutant: clinical, histopathological and molecular characterization of a pineal region tumor encountered in adolescents and adults.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most DNA methylation profiles were not classifiable using the Heidelberg Brain Tumor Classifier (version v11b4). By unsupervised t-SNE analysis and hierarchical clustering analysis, however, all tumors grouped closely together and showed similarities with ATRT-MYC."
    explanation: The methylation results of the 2020 series.
  - reference: PMID:42445896
    reference_title: 'Desmoplastic myxoid tumor, SMARCB1-mutant: a case with late recurrence after long-term follow-up.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "For unresolved cases, confirmation using methylation profiling analysis is required."
    explanation: The WHO criteria's use of methylation profiling, restated in a 2026 letter.
  - reference: PMID:37284622
    reference_title: 'Desmoplastic myxoid tumor of pineal region, SMARCB1-mutant, in young adult.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA methylation studies showed that this tumor grouped together with the recently described DMT-SMARCB1."
    explanation: A 2021 tumour grouped with the published ones.
  - reference: PMID:38527786
    reference_title: 'A mass in the pineal region of a young woman.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The composite NIH/NCI methylation profile classified the tumor with a high confidence score (0.99) as a desmoplastic myxoid tumor, SMARCB1‐altered."
    explanation: A 2024 tumour classified as this type with a high confidence score.
  - reference: PMID:42058762
    reference_title: 'Genetic landscape and molecular targets in pediatric pineal tumors.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "desmoplastic myxoid tumor of the pineal region, SMARCB1-mutant forms a distinct and compact methylation cluster, clearly separated from established CNS tumor entities (Figure 2). In particular, these tumors segregate away from the major AT/RT methylation subgroups (ATRT-MYC, ATRT-SHH, and ATRT-TYR), as well as from poorly differentiated chordoma and neural malignant rhabdoid tumor (MRT)."
    explanation: >-
      A 2026 review's summary of published methylation analyses describes a cluster of its own,
      away from the AT/RT groups, ATRT-MYC included.
  - reference: PMID:42058762
    reference_title: 'Genetic landscape and molecular targets in pediatric pineal tumors.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "No primary methylation data were generated for this review."
    explanation: The review generated no methylation data of its own.
  - reference: PMID:42467229
    reference_title: 'Aggressive clinical behavior of desmoplastic myxoid tumor of the pineal region, SMARCB1-mutant: expanding the biological spectrum of a rare central nervous system neoplasm.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA methylation profiling, interpreted in conjunction with histopathological and immunohistochemical findings, supported the diagnosis of DMT-SMARCB1 and demonstrated molecular proximity to other SMARCB1-deficient central nervous system neoplasms."
    explanation: Methylation profiling, read with the histology, supported the diagnosis in a 2026 case.
  - reference: PMID:32901946
    reference_title: 'A case of desmoplastic myxoid tumor, SMARCB1 mutant, in the pineal region.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmoplastic myxoid tumor (DMT), SMARCB1 mutant is a recently proposed new entity that mainly occurs in the pineal region and has epigenetic features similar to those of atypical teratoid/rhabdoid tumors (AT/RT)-MYC and poorly differentiated chordomas."
    explanation: A 2021 case report's background names poorly differentiated chordoma as well as ATRT-MYC.
  - reference: PMID:35562139
    reference_title: 'Miscellaneous newly recognized types of CNS tumors in the WHO CNS5 classification (other than gliomas, glioneuronal and embryonal tumors).'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL

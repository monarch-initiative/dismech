- name: Dissemination Beyond the Pineal Region
  description: >-
    Uncommon. One 2021 patient was reported as having dissemination through the cerebrospinal
    fluid: cells resembling the tumour's were seen in her cerebrospinal fluid, which the authors
    judged to be tumour cells but could not confirm from the scant material, while spinal MRI
    showed no visible leptomeningeal disease. She was treated with craniospinal irradiation (the
    2021 case report and the 2022 management letter describe the same patient). Two 2026 reports
    each present spread documented on imaging as a first: focal leptomeningeal dissemination in a
    woman whose tumour recurred after a ventriculoperitoneal shunt and Gamma Knife radiosurgery,
    and spread in a patient followed for more than ten years.
  notes: >-
    The ventricular-system location records subependymal nodules away from the pineal region, at
    the fourth ventricle and at what the figure legend calls the right ventricle in the 2026
    letter's patient; the term also covers the third ventricle, into which primary tumours
    themselves extend.

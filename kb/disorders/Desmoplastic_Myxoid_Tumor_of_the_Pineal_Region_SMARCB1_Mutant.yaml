pathophysiology:
- name: SMARCB1 Inactivation
  description: >-
    Nuclear SMARCB1 (INI1) protein is lost in every tumour whose cited report gives the stain (in
    one 2024 tumour, in many of the tumour cells), and loss of tumoral SMARCB1 expression is one
    of the essential diagnostic criteria. In the 2020 series three tumours had a heterozygous and
    two a homozygous SMARCB1 deletion, and sequencing found a frameshift mutation in two, which a
    2026 review reads as hits on the remaining allele, consistent with biallelic inactivation in
    those tumours; a 2021 case had a SMARCB1 deletion. Earlier tumours were mainly inactivated by
    deletions or small insertions and deletions rather than point mutations, and in a 2024 case a
    tumour panel found no pathogenic mutation but a SMARCB1 missense variant of unknown
    significance (c.91G>A, p.Glu31Lys), which lies in the protein's DNA-binding region. SMARCB1
    encodes a core subunit of the SWI/SNF chromatin-remodelling complex.
  notes: >-
    No variant origin is recorded, because no cited text reports testing of germline DNA (a 2026
    review files these alterations under somatic alterations without reporting such testing). No
    cell type is bound: no cell of origin has been identified. The biallelic reading covers
    individual tumours only, so no allelic hit role is set, and the 2024 missense variant is of
    unknown significance, so it is not recorded as an allelic event. The molecular function
    recorded as absent is DNA binding, a modelling choice: the protein is lost, and a cited text
    locates a DNA-binding region in it.

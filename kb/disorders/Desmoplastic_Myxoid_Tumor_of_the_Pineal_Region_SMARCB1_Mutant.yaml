      label: Neuroimaging
  description: >-
    CT and MRI show a pineal region mass, with obstructive hydrocephalus in several reported
    cases. The appearance varies between reports; the cited quotes give examples: hypodense on CT,
    T2- and FLAIR-hyperintense with gadolinium enhancement in a 2021 tumour, heterogeneously
    enhancing in the two tumours of a 2026 report, and without obvious enhancement in a 2024
    tumour. One tumour was first read on imaging as a possible germinoma.
    In three case reports that give a size, sizes range from about 2 cm (21 x 17 mm in a 2024
    tumour) to 6.6 cm in another 2024 tumour that extended into the third and right lateral
    ventricles, and the 3.0 x 3.4 x 2.6 cm tumour of a 24-year-old woman (2021) lay close to the
    deep cerebral veins, including the vein of Galen. CT density differs between reports: hypodense
    in the 24-year-old woman's tumour (the 2021 tumour above) and, with a pseudo-cystic appearance,
    in the 2026 letter's tumour, while a 2024 report describes hyperdense matter in the pineal
    region. Diffusion was not restricted in the 24-year-old woman's tumour and the 2026 letter's
    tumour, and spinal MRI showed no leptomeningeal disease or drop metastases in the 24-year-old
    woman, though her CSF cytology had atypical cells (see the Dissemination Beyond the Pineal
    Region node).

- phase: Outcome
  description: >-
    Often indolent, but not uniformly. In the 2020 series, after a median 48 months, three
    patients were alive with stable disease, one had progressed and three had died; over the first
    ten published cases the same three died (the 2022 letter's table lists all three deaths among
    the 2020 cases), at a stated median follow-up of 29.5 months that its table's follow-up times
    do not reproduce, and the letter says the remainder are alive with stable disease or no signs
    of recurrence; a 2024 count over eleven cases keeps apart one patient who had progressed after
    subtotal resection. Dissemination through the cerebrospinal fluid is reported in one 2021
    patient, on cytology that could not confirm the cells as tumour cells, and two 2026 reports
    each present radiologically documented spread as a first: focal leptomeningeal dissemination
    after a ventriculoperitoneal shunt and radiosurgery, and spread in a patient followed for more
    than ten years. One case report says the tumour seems relatively benign while warning that
    SMARCB1 deficiency calls for care, another says that management and prognosis are still
    unclear, and no grade has been established.
    A 2026 letter's table gives follow-up for four of its seven cases published after the 2020
    series, all alive at 3 to 22 months, three listed as gross total resection without residual
    disease and one with stable disease after subtotal resection and radiotherapy (the 2022 letter
    by her treating team reports a significant reduction in tumour size; see the Craniospinal
    irradiation row), and none for a 2024 case or two further cases; the letter's own case, followed
    for more than ten years, showed spread on imaging (above). Four of these seven are in the pooled
    outcome figures above, and five of them in the 2022 and two 2024 pooled onset figures (the 2026
    letter does not state which cases its own onset figures cover; its table lists all seven). One
    of the four, a 33-year-old man, is listed with 3 months and gross total resection alone in the
    2026 table. The 2022 letter's text reports more recent follow-up for a previously reported
    patient, cited only by reference number, disease-free at 12 months after gross total resection
    and radiotherapy; its table's only 12-month patient is this man, listed there with gross total
    resection alone, and a 2024 table lists him with radiotherapy and 12 months. So the 3 months is
    likely the earlier figure, and the 2022 table and text disagree on radiotherapy. A 2026 review
    states that no metastatic dissemination has been documented among the seven cases it describes,
    by its figures those of the 2020 series; the reports of spread above concern later cases. A 2024
    case report says that prognostic and predictive outcomes are still uncertain.

name: Cervical Dystonia
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Cervical dystonia is the commonest focal dystonia: sustained or intermittent
  involuntary contraction of neck muscles pulling the head into abnormal
  postures, typically beginning in the fifth decade and usually painful. It is
  disabling out of proportion to how localised it looks, because the neck cannot
  be rested and the posture cannot be hidden.

  The honest mechanistic statement is that this is a network disorder rather than
  a lesion. No single structure is damaged. Dysfunction is distributed across
  basal ganglia, thalamus, sensorimotor cortex and cerebellum, and the entry
  models it that way rather than assigning a locus the evidence does not support.
  The cerebellar contribution in particular is real but contested: it has been
  repeatedly implicated and studies testing cerebellar function in patients have
  given equivocal results, which is curated as an open question rather than
  resolved in either direction.

  Two features distinguish it clinically and both are mechanistically
  informative. The sensory trick, or geste antagoniste, is the phenomenon in
  which lightly touching the chin or cheek transiently abolishes the posture,
  which is difficult to reconcile with a purely motor efferent fault and points
  toward disordered sensorimotor integration. And the non-motor burden, in
  particular pain, anxiety and depression, is substantial and not simply
  secondary to the posture, being reported at rates that track body image and
  attitude rather than objective motor severity.

  Botulinum toxin injected into the overactive muscles is first-line treatment
  and works far downstream of the actual problem, at the neuromuscular junction,
  which is why it is effective, temporary, and not disease-modifying.
category: Complex
disease_term:
  preferred_term: Cervical Dystonia
  term:
    id: MONDO:0000481
    label: cervical dystonia
synonyms:
- Spasmodic torticollis
- Idiopathic cervical dystonia
- Adult-onset focal cervical dystonia
notes: >-
  Scope. This entry covers idiopathic adult-onset focal cervical dystonia, the
  common sporadic form. It is deliberately distinct from the monogenic dystonias
  already curated in this knowledge base, including the dopa-responsive
  dystonias, myoclonus-dystonia, and the dystonia-parkinsonism syndromes, in
  which cervical involvement may occur as one feature of a defined genetic
  disease. Cervical dystonia appearing as a feature of those disorders is not
  this entry.

  Mechanism deliberately under-localised. Dystonia is curated here as a network
  disorder because that is what the evidence supports; no single node claims a
  causal lesion in a specific structure. The cerebellar arm is recorded as an
  open question rather than asserted, because the same source that names the
  network describes cerebellar findings in patients as equivocal.

  Genetics deliberately under-asserted. Most adult-onset isolated cervical
  dystonia is sporadic and multifactorial. Sequencing panels of the associated
  genes return a low diagnostic yield in unselected focal-dystonia cohorts, and
  the entry records that yield rather than implying that these genes explain the
  common disease.

  Provider note. Built from an Edison Falcon deep-research report, which cites by
  DOI and internal corpus keys rather than PMIDs, so all cited DOIs were resolved
  to PubMed records and evidence verified against those. Three of the report's
  suggested HPO identifiers were wrong and were corrected against the ontology:
  it gave HP:0002418 for torticollis (that identifier is Abnormal midbrain
  morphology; correct is HP:0000473), HP:0001336 for tremor (that is Myoclonus;
  correct is HP:0001337), and HP:0003577 for adult onset (that is Congenital
  onset; correct is HP:0003581). Every ontology term in this entry was verified
  independently rather than taken from the report.
pathophysiology:
- name: Sensorimotor Network Dysfunction
  biological_scale: ORGANISM
  description: >-
    The primary abnormality, and it is distributed rather than focal. Dystonia is
    understood as a disorder of a network spanning basal ganglia, thalamus,
    sensorimotor cortex and cerebellum, in which no single structure is lesioned
    and the pathology lies in how they operate together. This node is stated at
    network scale deliberately: assigning the fault to one structure would claim
    more than the evidence supports, and decades of attempts to localise it are
    why the network formulation exists.
  evidence:
  - reference: PMID:33795752
    reference_title: "Motor learning deficits in cervical dystonia point to defective basal ganglia circuitry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia is conceptualized as a network disorder involving basal ganglia, thalamus, sensorimotor cortex and the cerebellum."
    explanation: >-
      States the network formulation and names its four components, which is
      exactly the scope at which this node is pitched.
  - reference: PMID:37738511
    reference_title: "Genetics and Pathogenesis of Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia is a clinically and genetically highly heterogeneous neurological disorder characterized by abnormal movements and postures caused by involuntary sustained or intermittent muscle contractions."
    explanation: >-
      Defines the disorder at the level of the movement abnormality and records
      that it is heterogeneous both clinically and genetically, which is the
      reason a single mechanism is not asserted.
  downstream:
  - target: Disordered Sensorimotor Integration
    causal_link_type: DIRECT
    description: >-
      The specific functional consequence for which there is direct clinical
      evidence at the bedside.
  - target: Involuntary Sustained Neck Muscle Contraction
    causal_link_type: DIRECT
    description: >-
      The motor output of the disordered network.
  - target: Anxiety
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn from the network node rather than from the motor node deliberately.
      The cited source states that the non-motor symptoms cannot be attributed to
      the motor symptoms as a secondary consequence, which rules out the obvious
      route, distress at a visible posture, and leaves the shared network as the
      candidate origin. The intermediates are unknown and the edge says so.
  - target: Depression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Same reasoning as the anxiety edge, and resting on the same statement that
      the non-motor burden is not secondary to the movement disorder.
- name: Disordered Sensorimotor Integration
  biological_scale: ORGANISM
  description: >-
    Abnormal processing of sensory information in the service of movement, rather
    than a purely efferent motor fault. The clinical evidence for this is
    unusually direct and unusually strange: a light touch to the chin or cheek
    can transiently abolish the dystonic posture. A sensory input that switches
    off an involuntary motor output is difficult to explain if the lesion is
    downstream of the motor command, and it is the single most informative sign
    in the disease.
  evidence:
  - reference: PMID:37738511
    reference_title: "Genetics and Pathogenesis of Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The geste antagoniste (also known as the sensory trick) describes a voluntary action by the patient that can reduce or even completely suppress abnormal postures or dystonic movements, for example, touching the chin in cervical dystonia."
    explanation: >-
      The direct evidence for this node. A voluntary sensory action that
      completely suppresses an involuntary motor output is the phenomenon that
      makes sensorimotor integration, rather than motor execution, the right
      framing, and the source names cervical dystonia specifically.
  - reference: PMID:33795752
    reference_title: "Motor learning deficits in cervical dystonia point to defective basal ganglia circuitry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia is conceptualized as a network disorder involving basal ganglia, thalamus, sensorimotor cortex and the cerebellum."
    explanation: >-
      Places sensorimotor cortex and cerebellum in the network whose dysfunction
      this node describes.
  downstream:
  - target: Involuntary Sustained Neck Muscle Contraction
    causal_link_type: DIRECT
    description: >-
      Faulty integration produces the abnormal sustained motor output.
- name: Involuntary Sustained Neck Muscle Contraction
  biological_scale: TISSUE
  description: >-
    Sustained or intermittent co-contraction of cervical muscles, including
    inappropriate activation of antagonists, producing abnormal head posture and
    frequently a dystonic tremor. The muscles themselves are normal, which is why
    treatment aimed at them is symptomatic: the fault is in the command, not the
    effector.
  evidence:
  - reference: PMID:33180963
    reference_title: "Botulinum toxin type A therapy for cervical dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cervical dystonia is the most common form of focal dystonia, and is a highly disabling movement disorder, characterised by involuntary, usually painful, head posturing."
    explanation: >-
      States the motor phenomenon, that it is involuntary, that it is usually
      painful, and that the resulting disability is substantial.
  downstream:
  - target: Torticollis
    causal_link_type: DIRECT
    description: >-
      The abnormal head posture itself.
  - target: Neck pain
    causal_link_type: DIRECT
    description: >-
      Sustained contraction against antagonists is painful in the majority of
      patients.
  - target: Tremor
    causal_link_type: DIRECT
    description: >-
      Dystonic tremor accompanies the posture in a substantial minority.
phenotypes:
- name: Torticollis
  category: Neurological
  description: >-
    Abnormal head and neck posture from involuntary muscle contraction, the
    defining feature. Direction varies between patients and may combine rotation,
    tilt, flexion and extension.
  phenotype_term:
    preferred_term: Torticollis
    term:
      id: HP:0000473
      label: Torticollis
    onset:
      onset_category: ADULT
      notes: >-
        Onset is characteristically in adulthood, typically the fifth decade,
        which is part of what distinguishes idiopathic focal cervical dystonia
        from the childhood-onset monogenic dystonias.
  evidence:
  - reference: PMID:33180963
    reference_title: "Botulinum toxin type A therapy for cervical dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cervical dystonia is the most common form of focal dystonia, and is a highly disabling movement disorder, characterised by involuntary, usually painful, head posturing."
    explanation: >-
      Names the head posturing that defines this phenotype and records its
      involuntary character.
- name: Neck pain
  category: Neurological
  description: >-
    Pain in the affected muscles, present in the majority and a major contributor
    to disability. It is described in the defining literature as a usual rather
    than occasional accompaniment, which is worth noting because pain is
    sometimes treated as a secondary complaint in movement disorders.
  phenotype_term:
    preferred_term: Neck pain
    term:
      id: HP:0030833
      label: Neck pain
  frequency: FREQUENT
  evidence:
  - reference: PMID:33180963
    reference_title: "Botulinum toxin type A therapy for cervical dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cervical dystonia is the most common form of focal dystonia, and is a highly disabling movement disorder, characterised by involuntary, usually painful, head posturing."
    explanation: >-
      The word "usually" in a definitional sentence supports the FREQUENT band of
      30 to 79 per cent for pain in this disease.
  - reference: PMID:38429083
    reference_title: "Does sex influence the natural history of idiopathic adult-onset dystonia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neck pain in cervical dystonia 488/848 (57.5%)"
    explanation: >-
      Quantifies the band: 488 of 848 patients with cervical dystonia in the
      registry, 57.5 per cent, which sits squarely in FREQUENT.
- name: Tremor
  category: Neurological
  description: >-
    Dystonic head tremor accompanying the posture in a substantial minority. It
    is distinguished from essential tremor by its association with the dystonic
    posture and by its tendency to worsen when the head is moved away from the
    direction of pull.
  phenotype_term:
    preferred_term: Tremor
    term:
      id: HP:0001337
      label: Tremor
  notes: >-
    No frequency band is asserted, and the reason is worth stating because the
    number is tempting. The registry table reports tremor in 516 of 1701, which
    is 30.3 per cent, but that denominator is every patient with idiopathic
    adult-onset dystonia of any distribution. The same table gives CD-specific
    rows where it means CD, quoting neck pain in cervical dystonia against a
    denominator of 848, so the absence of a CD row for tremor is informative
    rather than accidental. A band derived from the all-dystonia figure would
    be a claim about cervical dystonia that this source does not make.
  evidence:
  - reference: PMID:38429083
    reference_title: "Does sex influence the natural history of idiopathic adult-onset dystonia?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Women and men were characterised by a similar proportion of sensory trick, eye symptoms in blepharospasm (BSP), neck pain in cervical dystonia (CD) and family history of dystonia or tremor; tremors in the neck and/or in the upper limb tended to be more frequent in women than in men"
    explanation: >-
      PARTIAL. It establishes that tremor of the neck is a recorded feature in
      this dystonia cohort, which supports the phenotype existing, but the
      sentence is about a sex comparison and the study's tremor denominator is
      all adult-onset dystonia rather than cervical dystonia. No frequency is
      derived from it.
- name: Anxiety
  category: Psychiatric
  description: >-
    Anxiety and social phobia occur at rates that are not explained by motor
    severity alone. The non-motor burden of this disease is substantial and is
    explicitly described as not reducible to a secondary consequence of the
    movement disorder, which matters because it is easy to assume that a visible
    postural disorder causes distress purely by being visible.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:21484874
    reference_title: "Nonmotor manifestations of dystonia: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-motor symptoms include alterations of mood, cognition, sleep, autonomic function and/or pain which cannot be directly attributed as a secondary consequence of motor symptoms."
    explanation: >-
      States both the range of non-motor symptoms and, decisively, that they
      cannot be attributed simply to the motor disorder.
- name: Depression
  category: Psychiatric
  description: >-
    Depressed mood, part of the same non-motor burden and likewise not simply a
    reaction to disability.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:21484874
    reference_title: "Nonmotor manifestations of dystonia: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-motor symptoms include alterations of mood, cognition, sleep, autonomic function and/or pain which cannot be directly attributed as a secondary consequence of motor symptoms."
    explanation: >-
      Includes alterations of mood among the non-motor symptoms that are not
      secondary to motor disability.
genetic:
- name: THAP1
  gene_term:
    preferred_term: THAP1
    term:
      id: hgnc:20856
      label: THAP1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Recurrently implicated in focal dystonia screening cohorts. Bound so it is
    queryable, and typed SUSCEPTIBILITY rather than CAUSATIVE because in the
    common adult-onset sporadic disease these genes explain a small minority; see
    the yield figures on the susceptibility record below.
- name: GNAL
  gene_term:
    preferred_term: GNAL
    term:
      id: hgnc:4388
      label: GNAL
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Implicated in adult-onset focal and segmental dystonia, with craniocervical
    predominance. Typed SUSCEPTIBILITY for the same reason as THAP1.
- name: ANO3
  gene_term:
    preferred_term: ANO3
    term:
      id: hgnc:14004
      label: ANO3
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Implicated in craniocervical dystonia. Typed SUSCEPTIBILITY for the same
    reason as the others.
- name: Polygenic and multifactorial susceptibility
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Most adult-onset isolated cervical dystonia is sporadic and multifactorial. A
    set of genes recurs in screening studies of focal dystonia cohorts, including
    THAP1, GNAL and ANO3, but they explain a small minority of unselected cases.
    A 30-gene panel applied to a focal dystonia cohort found many heterozygous
    variants and very few that were clinically and genetically relevant, which is
    the honest summary of where genetic testing currently stands in the common
    disease. No causal gene is bound at the disease level for that reason.
  evidence:
  - reference: PMID:37445923
    reference_title: "Genetic Screening of a Hungarian Cohort with Focal Dystonia Identified Several Novel Putative Pathogenic Gene Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assessment of 30 CD- and BSP-associated genes from 121 patients revealed a total of 209 different heterozygous variants in 24 genes."
    explanation: >-
      Establishes the scale of variation found by panel sequencing, which is the
      denominator against which the relevant findings must be read.
  - reference: PMID:37445923
    reference_title: "Genetic Screening of a Hungarian Cohort with Focal Dystonia Identified Several Novel Putative Pathogenic Gene Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Established clinical and genetic validity was determined for nine heterozygous variations (three likely pathogenic and six variants of uncertain significance)."
    explanation: >-
      Nine relevant variants from 209, of which only three were likely
      pathogenic, is the quantitative basis for treating these genes as
      contributors in a minority rather than as causes of the common disease.
treatments:
- name: Botulinum Toxin Type A
  description: >-
    First-line treatment, and mechanistically instructive for where it acts.
    Injected into the overactive muscles, it cleaves the SNARE machinery required
    for acetylcholine release at the neuromuscular junction, weakening the muscle
    that the disordered network is commanding. It therefore works at the far end
    of the chain, downstream of everything this entry models as the actual
    pathophysiology, which is precisely why it is effective, why it must be
    repeated as terminals recover, and why it modifies nothing.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  target_mechanisms:
  - target: Involuntary Sustained Neck Muscle Contraction
    treatment_effect: INHIBITS
    description: >-
      Blocks neuromuscular transmission in the injected muscles, preventing the
      contraction from being executed without addressing the command that
      produces it.
    evidence:
    - reference: PMID:33180963
      reference_title: "Botulinum toxin type A therapy for cervical dystonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Currently, botulinum toxin type A (BtA) is considered the first line therapy for this condition."
      explanation: >-
        Establishes the agent's first-line position for this specific condition.
  evidence:
  - reference: PMID:33180963
    reference_title: "Botulinum toxin type A therapy for cervical dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, both participants and clinicians reported an improvement of subjective clinical status."
    explanation: >-
      The efficacy finding from a Cochrane review, reported as improvement in
      subjective clinical status by both patients and clinicians.
  - reference: PMID:33180963
    reference_title: "Botulinum toxin type A therapy for cervical dystonia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We found no evidence supporting the existence of a clear dose-response relationship between BtA and improvement in cervical dystonia-specific impairment"
    explanation: >-
      PARTIAL and included deliberately as a limit on the treatment rather than
      support for it. A first-line therapy without a demonstrable dose-response
      relationship is one whose optimal dosing cannot be derived from the
      evidence, which is a real constraint on practice.
  notes: >-
    The same review found no evidence distinguishing between formulations, and
    none that electromyographic guidance improved efficacy outcomes. Both are
    recorded here because they are frequently assumed in practice.

    A correction to an earlier revision of this note, which stated two things
    that are false. It claimed the ChemicalEntityTerm enum is CHEBI-rooted; it is
    not, it also roots at NCIT:C1909, and hundreds of NCIT terms are already
    members. It also claimed CHEBI has no botulinum toxin entry; CHEBI:3160
    Botulinum toxin type A exists. The conclusion happened to be right for the
    wrong reasons, since NCIT:C82623 does genuinely fail the enum, but the reason
    given was invented rather than checked, and a plausible-sounding reason is
    worse than no reason because nobody re-tests it. The agent is now bound to
    CHEBI:3160.
- name: Deep Brain Stimulation
  description: >-
    Pallidal stimulation for disease refractory to botulinum toxin. Unlike
    injection it acts within the dysfunctional network rather than at its output,
    which is what makes it interesting mechanistically as well as clinically.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Deep Brain Stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Sensorimotor Network Dysfunction
    treatment_effect: MODULATES
    description: >-
      Modulates activity within the basal ganglia component of the network rather
      than blocking its output, which is the mechanistic distinction from
      botulinum toxin.
    evidence:
    - reference: PMID:33795752
      reference_title: "Motor learning deficits in cervical dystonia point to defective basal ganglia circuitry."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Dystonia is conceptualized as a network disorder involving basal ganglia, thalamus, sensorimotor cortex and the cerebellum."
      explanation: >-
        PARTIAL: establishes that the basal ganglia are part of the network this
        treatment targets, which is the rationale, but this source is not a trial
        of stimulation and does not evidence efficacy.
  evidence:
  - reference: PMID:38823054
    reference_title: "Long-term follow-up of pallidal deep brain stimulation for craniocervical dystonia: is the globus pallidus internus the best target?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean total BFMDRS motor scores at the 3 different time points were 13.3 ± 9.4 preoperatively, 5.0 ± 4.7 (55.3% improvement, p < 0.001) at 6 months, and 4.5 ± 3.6 (56.6% improvement, p < 0.001) at last follow-up."
    explanation: >-
      Quantifies the effect on a validated dystonia rating scale and, more
      usefully, shows the six-month improvement is essentially held at a mean
      follow-up of three years. Durability is the question that matters for an
      implanted device.
  - reference: PMID:38823054
    reference_title: "Long-term follow-up of pallidal deep brain stimulation for craniocervical dystonia: is the globus pallidus internus the best target?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The outcomes were deemed poor in 6 individuals."
    explanation: >-
      PARTIAL and carried as a limit rather than as support. Six of 24 patients
      did poorly, which is a quarter of an already refractory cohort, and the
      paper's own title asks whether the pallidum is the right target at all.
  notes: >-
    The efficacy evidence here is a single-centre series of 24 patients with
    refractory craniocervical dystonia, which is not cervical dystonia alone and
    not a controlled trial, so the improvement figures describe this cohort
    rather than establishing an effect size.
discussions:
- discussion_id: cd_cerebellar_contribution
  prompt: >-
    Does the cerebellum play a causal role in cervical dystonia, or is its
    involvement a downstream consequence of network dysfunction elsewhere?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Sensorimotor Network Dysfunction
  rationale: >-
    The cerebellum is named as a component of the dystonia network and has been
    repeatedly implicated, but studies testing cerebellar function directly in
    patients are described as giving equivocal results. That is an unusual
    position for a structure to occupy: implicated enough to be in every
    formulation of the network, but not demonstrated well enough for its role to
    be stated. The question matters because the answer changes what a therapeutic
    target looks like. If cerebellar dysfunction is causal, it is a target; if it
    is a downstream consequence of abnormal basal ganglia output, modulating it
    would be treating a symptom of a symptom.
  proposed_experiments:
  - experiment_id: cd_cerebellar_function_stratified
    name: Cerebellar function testing stratified by phenotype and disease duration
    description: >-
      Test cerebellar function in cervical dystonia patients stratified by
      duration, presence of dystonic tremor, and sensory-trick responsiveness,
      rather than as one group. Equivocal group-level results are what you expect
      if a real effect is present in a subgroup, so the stratification is the
      experiment.
- discussion_id: cd_sensory_trick_mechanism
  prompt: >-
    How does a light sensory stimulus transiently abolish an involuntary motor
    output in cervical dystonia?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Disordered Sensorimotor Integration
  rationale: >-
    The sensory trick is the most mechanistically informative phenomenon in the
    disease and the least explained. Touching the chin or cheek can abolish the
    dystonic posture within moments, and the effect is often lost as the disease
    progresses. Any complete account of cervical dystonia has to explain why an
    afferent signal that carries no mechanical force can switch off a sustained
    motor output, and why that capacity decays. The phenomenon is the strongest
    bedside argument that the fault lies in sensorimotor integration rather than
    in motor execution, which is why it is curated as a question attached to that
    node rather than merely listed as a clinical sign.
differential_diagnoses:
- name: Monogenic and syndromic dystonias
  description: >-
    Cervical involvement occurs within defined genetic disorders, including
    dopa-responsive dystonia, myoclonus-dystonia, and the dystonia-parkinsonism
    syndromes, all separately curated in this knowledge base. The distinction
    matters practically: dopa-responsive dystonia in particular is treatable in a
    way this disease is not, so it must be excluded rather than assumed absent.
- name: Secondary and acquired torticollis
  description: >-
    Abnormal head posture from structural, ocular, vestibular, infectious or
    drug-induced causes, including tardive dystonia after dopamine receptor
    blockade. Distinguished by history, by the absence of a sensory trick, and by
    the presence of an identifiable cause.
- name: Essential tremor with head involvement
  description: >-
    Head tremor without sustained abnormal posture. The distinction can be
    genuinely difficult when dystonic tremor is prominent and the posture is
    subtle, and it turns on whether a sustained directional pull is present
    between tremor beats.
prevalence:
- population: Adults, idiopathic adult-onset isolated dystonia
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 30.9
  notes: >-
    Reported prevalence estimates for isolated dystonia of around 30.9 and 52.7
    per 100,000, recorded here at the lower figure. Both are widely regarded as
    underestimates because the disorder is frequently undiagnosed or
    misdiagnosed, often for years, and because ascertainment depends on referral
    to a movement disorder service. Cervical dystonia is the commonest focal
    form, so it accounts for a substantial share of this total rather than being
    additional to it.
  evidence:
  - reference: PMID:37738511
    reference_title: "Genetics and Pathogenesis of Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was estimated as 52.7/100,000 ( 7) or 30.9/100,000 (8)"
    explanation: >-
      The source of the recorded rate. Note carefully what it measures: this is
      the prevalence of ISOLATED DYSTONIA as a whole, not of cervical dystonia
      specifically, and the same sentence offers a second estimate of 30.9 per
      100,000. The lower figure is recorded in this entry as the conservative
      choice.

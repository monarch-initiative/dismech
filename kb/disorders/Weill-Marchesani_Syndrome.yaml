    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disease is a neurodegenerative disorder characterized by high intraocular pressure, loss of retinal ganglion cells (apoptosis)."
    explanation: >-
      Supplies general-glaucoma evidence for the conserved retinal-ganglion-cell
      apoptosis step; WMS-specific evidence establishes the upstream glaucoma,
      not this cellular event.
  downstream:
  - target: Optic Nerve Degeneration and Neuroinflammation
    description: >-
      Ganglion-cell and axonal loss is accompanied by optic-nerve degeneration

      label: ADAMTS10
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Secreted metalloprotease that binds fibrillin-1 at two sites and promotes
    microfibril deposition. Expressed in skin, fetal chondrocytes, and fetal and
    adult heart, matching the tissue distribution of the phenotype. Its zymogen
    resists furin activation, so it acts as an assembly factor rather than an
    efficient fibrillinase.

diagnosis:
- name: Clinical diagnosis
  description: >-
    The diagnosis is established clinically in a proband with the characteristic
    combination of ocular, skeletal and joint findings. The ophthalmological
    findings are mandatory for the diagnosis; the systemic phenotype is more
    variable than originally described.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989

    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in ADAMTS10, ADAMTS17, or LTBP2 or of a heterozygous pathogenic variant in FBN1 by molecular genetic testing can confirm the diagnosis if clinical features are inconclusive."
    explanation: >-
      Specifies the four-gene molecular testing strategy and its role relative to
      clinical diagnosis.
treatments:
- name: Early lens extraction
  description: >-
    Early detection and removal of an ectopic lens is the central preventive
    intervention, taken to reduce the chance of pupillary block and consequent
    glaucoma. Because the lens is the upstream cause of the pressure rise, lens
    surgery is mechanistically prior to any pressure-lowering measure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pupillary Block and Angle Closure
    treatment_effect: INHIBITS
    description: >-
      Removing the microspherophakic or subluxated lens eliminates the anatomical
      cause of pupillary block before pressure rises.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early detection and removal of an ectopic lens to decrease the possibility of pupillary block and glaucoma."
    explanation: >-
      GeneReviews names early lens removal as the treatment directed at the
      pupillary block mechanism.
- name: Peripheral iridectomy
  description: >-
    Peripheral iridectomy can prevent or relieve pupillary block by creating an
    alternative route for aqueous humor around the obstructed pupil.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pupillary Block and Angle Closure
    treatment_effect: INHIBITS
    description: >-
      Iridectomy bypasses the blocked pupil and directly addresses the
      lens-driven initiating lesion.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical management of glaucoma can include peripheral iridectomy to prevent or relieve pupillary block and trabeculectomy in advanced chronic angle closure glaucoma"
    explanation: >-
      Specifically supports peripheral iridectomy for prevention or relief of
      pupillary block.
- name: Trabeculectomy for advanced chronic angle-closure glaucoma
  description: >-
    Trabeculectomy is considered when chronic angle closure is advanced and
    pressure remains inadequately controlled, creating a new aqueous outflow
    pathway downstream of the lens-driven block.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Elevated Intraocular Pressure
    treatment_effect: INHIBITS
    description: >-
      The filtering procedure lowers pressure after chronic angle closure has
      established persistent outflow impairment.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical management of glaucoma can include peripheral iridectomy to prevent or relieve pupillary block and trabeculectomy in advanced chronic angle closure glaucoma"
    explanation: >-
      Specifically supports trabeculectomy in advanced chronic angle-closure
      glaucoma.
- name: Avoidance of ophthalmic miotics and mydriatics
  description: >-
    A drug-safety measure rather than a therapy. Ophthalmic miotics and
    mydriatics must be avoided because they can induce pupillary block: this is
    the paradoxical response that makes medical glaucoma management difficult in
    WMS, and it inverts the usual pharmacological reflex for angle closure.
    Activities carrying a risk of eye injury should also be avoided.

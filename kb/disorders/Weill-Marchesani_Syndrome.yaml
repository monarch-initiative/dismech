name: Weill-Marchesani syndrome
creation_date: "2026-08-01T04:23:04Z"
description: >-
  Weill-Marchesani syndrome (WMS) is a rare heritable disorder of the fibrillin
  microfibril and one of the acromelic dysplasias, defined by short stature,
  brachydactyly and joint stiffness together with characteristic ocular
  abnormalities that can include microspherophakia, lenticular myopia, ectopia
  lentis and secondary glaucoma. WMS contrasts with Marfan syndrome in habitus:
  disruption of the same FBN1-microfibril system can instead produce a short,
  stiff, thick-skinned, muscular build with a small round lens. Four genes, all
  encoding secreted extracellular-matrix proteins that form or regulate fibrillin
  microfibrils, cause dominant or recessive forms of the disorder.
category: Mendelian
parents:
- syndromic disease
- connective tissue disease
synonyms:
- WMS
- spherophakia-brachymorphia syndrome
- GEMSS syndrome
disease_term:
  preferred_term: Weill-Marchesani syndrome
  term:
    id: MONDO:0018096
    label: Weill-Marchesani syndrome
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  percentage: 1 in 100,000
  notes: >-
    A contemporary WMS family study reports a prevalence estimate of one per
    100,000; because ascertainment for this rare, genetically heterogeneous
    disorder is incomplete, this should be treated as an approximate estimate.
  evidence:
  - reference: PMID:32616716
    reference_title: "A novel pathogenic missense ADAMTS17 variant that impairs secretion causes Weill-Marchesani Syndrome with variably dysmorphic hand features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Weill-Marchesani syndrome (WMS) is a rare heritable connective tissue disorder (prevalence 1 in 100,000)"
    explanation: >-
      Provides the published worldwide prevalence estimate; evidence source is
      OTHER because the value is background synthesis rather than a new
      population ascertainment study.
progression:
- phase: Childhood ocular recognition
  age_range: Childhood
  notes: >-
    Lens-shape and lens-position abnormalities, lenticular myopia and glaucoma
    are typically recognized in childhood, although the exact combination and
    timing vary between individuals.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular problems, typically recognized in childhood, include microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens, ectopia lentis (abnormal position of the lens), and glaucoma, which can lead to blindness."
    explanation: >-
      Establishes childhood as the typical recognition period for the ocular
      phenotype without implying that every listed abnormality is present.
- phase: Progressive lens-related and glaucomatous complications
  age_range: Childhood onward
  notes: >-
    Lens thickening and lenticular myopia can progress during childhood in WMS4;
    ectopic or microspherophakic lenses can later produce pupillary block,
    chronic angle closure and sight-threatening glaucoma. The longitudinal lens
    trajectory is documented in a single child and may not generalize to every
    genotype.
  evidence:
  - reference: PMID:36698805
    reference_title: "Abnormal lens thickening in a child with Weill-Marchesani syndrome 4: A 3-year follow-up case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the 3 years of follow-up, the thickness of lenses increased significantly (right 4.49 mm, left 4.48 mm), but the equatorial diameter of the lenses had no significant change (right 7.32 mm, left 7.21 mm). As the equivalent lens power increased, the patient's myopia spherical refractive error rose accordingly."
    explanation: >-
      Provides longitudinal evidence for progressive childhood lens thickening
      and lenticular myopia in one molecularly diagnosed WMS4 patient.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and glaucoma, which can lead to blindness"
    explanation: >-
      Establishes the sight-threatening endpoint of the ocular course.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The recessive form, the more common of the two, is caused by biallelic
    variants in ADAMTS10 (WMS1), LTBP2 (WMS3) or ADAMTS17 (WMS4).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADAMTS10-, ADAMTS17-, and LTPBP2-related WMS are inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews assigns the three protease and binding-protein genes to
      autosomal recessive inheritance.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: >-
      Gives the sibling recurrence risks used in counselling families with a
      recessive form.
- name: Autosomal dominant inheritance
  description: >-
    The dominant form (WMS2) is caused by heterozygous FBN1 variants, most
    clustering in the TB5 domain. Inheritance mode cannot be inferred from the
    clinical picture, only from the genotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBN1-related WMS is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews assigns FBN1-related WMS to autosomal dominant inheritance.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with autosomal dominant WMS has a 50% chance of inheriting the pathogenic variant."
    explanation: >-
      Gives the transmission risk used in counselling families with the dominant
      form.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive WMS cannot be distinguished from autosomal dominant WMS by clinical findings alone."
    explanation: >-
      Establishes that the two inheritance modes are clinically indistinguishable,
      which is why molecular testing rather than pedigree drives classification.
has_subtypes:
- name: WMS1
  display_name: Weill-Marchesani syndrome 1 (ADAMTS10-related, recessive)
  subtype_term:
    preferred_term: Weill-Marchesani syndrome 1
    term:
      id: MONDO:0010194
      label: Weill-Marchesani syndrome 1
  description: >-
    The prototypic recessive form, caused by biallelic pathogenic ADAMTS10
    variants. ADAMTS10 is a secreted metalloprotease that binds fibrillin-1 and
    accelerates microfibril biogenesis; patient fibroblasts deposit microfibrils
    sparsely. Cardiac anomalies are more frequent in the recessive forms.
  genes:
  - preferred_term: ADAMTS10
    term:
      id: hgnc:13201
      label: ADAMTS10
  evidence:
  - reference: PMID:15368195
    reference_title: "ADAMTS10 mutations in autosomal recessive Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report null mutations in a member of the extracellular matrix protease family, the gene encoding ADAMTS10, a disintegrin and metalloprotease with thrombospondin motifs."
    explanation: >-
      Original identification of ADAMTS10 as the recessive WMS gene.
- name: WMS2
  display_name: Weill-Marchesani syndrome 2 (FBN1-related, dominant)
  subtype_term:
    preferred_term: Weill-Marchesani syndrome 2, dominant
    term:
      id: MONDO:0012013
      label: Weill-Marchesani syndrome 2, dominant
  description: >-
    The dominant form, caused by heterozygous FBN1 variants. Variants in the TB5
    domain are associated with significantly shorter stature than variants
    elsewhere in the gene. The acronym GEMSS (glaucoma, ectopia,
    microspherophakia, stiff joints, short stature) was proposed for this form.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  evidence:
  - reference: PMID:37734846
    reference_title: "Weill-Marchesani syndrome: natural history and genotype-phenotype correlations from 18 news cases and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding FBN1 variants, patients with a variant located in transforming growth factor (TGF)-β-binding protein-like domain 5 (TB5) domain were significantly smaller than patients with FBN1 variant outside TB5 domain"
    explanation: >-
      Establishes the intragenic TB5 genotype-phenotype correlation within the
      dominant FBN1 arm.
- name: WMS3
  display_name: Weill-Marchesani syndrome 3 (LTBP2-related, recessive)
  subtype_term:
    preferred_term: Weill-Marchesani syndrome 3
    term:
      id: MONDO:0013899
      label: Weill-Marchesani syndrome 3
  description: >-
    A rare recessive form caused by biallelic LTBP2 variants. LTBP2 is a
    latent-TGF-beta-binding-protein-family member that associates with
    fibrillin-1 microfibrils; patient skin shows a disrupted microfibrillar
    network. Only two individuals were identified in a 61-patient series.
  genes:
  - preferred_term: LTBP2
    term:
      id: hgnc:6715
      label: LTBP2
  evidence:
  - reference: PMID:22539340
    reference_title: "LTBP2 mutations cause Weill-Marchesani and Weill-Marchesani-like syndrome and affect disruptions in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous c.3529G>A (p.Val1177Met) was shown to cause autosomal recessive WMS or WM-like syndrome by several approaches, including homozygosity mapping."
    explanation: >-
      Identifies the biallelic LTBP2 allele causing recessive WMS.
- name: WMS4
  display_name: Weill-Marchesani syndrome 4 (ADAMTS17-related, recessive)
  subtype_term:
    preferred_term: Weill-Marchesani 4 syndrome, recessive
    term:
      id: MONDO:0013176
      label: Weill-Marchesani 4 syndrome, recessive
  description: >-
    A recessive form caused by biallelic ADAMTS17 variants, and the most
    frequently identified genotype in a contemporary combined series. Classically
    described as having less severe cardiac involvement, presenting predominantly
    with musculoskeletal and ocular features, although valvular disease has since
    been reported.
  genes:
  - preferred_term: ADAMTS17
    term:
      id: hgnc:17109
      label: ADAMTS17
  evidence:
  - reference: PMID:31726086
    reference_title: "A novel ADAMTS17 variant that causes Weill-Marchesani syndrome 4 alters fibrillin-1 and collagen type I deposition in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with WMS 4 due to ADAMTS17 mutations appear to have less severe cardiac involvement and present predominantly with the musculoskeletal and ocular features of WMS."
    explanation: >-
      Characterizes the comparatively cardiac-sparing phenotype classically
      attributed to the ADAMTS17 arm.
  - reference: PMID:37506754
    reference_title: "Characteristics and genotype-phenotype correlations in ADAMTS17 mutation-related Weill-Marchesani syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, one child was detected with valvular heart disease, which has not previously been reported in patients with ADAMTS17 mutations."
    explanation: >-
      Qualifies the cardiac-sparing characterization by documenting valvular
      disease in an ADAMTS17 patient.
classifications:
  isds_skeletal_category:
  - classification_value: acromelic_dysplasias
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 15 "Acromelic
      dysplasias"; listed as "Weill-Marchesani syndrome".
pathophysiology:
- name: ADAMTS10-Dependent Microfibril Assembly and Fibrillin-2 Remodeling
  biological_scale: MOLECULAR
  description: >-
    ADAMTS10 binds fibrillin-1 and accelerates fibrillin-1 microfibril biogenesis;
    WMS patient fibroblasts with ADAMTS10 variants deposit fibrillin-1
    microfibrils sparsely. ADAMTS10 also cleaves fibrillin-2 in vitro, and its
    absence in mice prevents the normal postnatal shift toward a
    fibrillin-1-predominant ocular zonule. These assembly and remodeling
    activities are distinct from the secretion-loss mechanism demonstrated for
    ADAMTS17 variants.
  genes:
  - preferred_term: ADAMTS10
    term:
      id: hgnc:13201
      label: ADAMTS10
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:21402694
    reference_title: "ADAMTS10 protein interacts with fibrillin-1 and promotes its deposition in extracellular matrix of cultured fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, these findings suggest that ADAMTS10 participates in microfibril biogenesis rather than in fibrillin-1 turnover."
    explanation: >-
      Establishes ADAMTS10 as a microfibril assembly factor rather than a
      degradative protease, which sets the direction of the disease mechanism.
  - reference: PMID:21402694
    reference_title: "ADAMTS10 protein interacts with fibrillin-1 and promotes its deposition in extracellular matrix of cultured fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "fibroblasts obtained from a Weill-Marchesani syndrome patient with ADAMTS10 mutations deposited fibrillin-1 microfibrils sparsely compared with unaffected control cells"
    explanation: >-
      Direct patient-cell evidence that the ADAMTS10 lesion reduces fibrillin-1
      microfibril deposition.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ADAMTS10 was found to cleave fibrillin-2, providing an explanation for persistence of fibrillin-2 at these sites."
    explanation: >-
      Identifies fibrillin-2 as an ADAMTS10 substrate; the cleavage assignment is
      IN_VITRO, while its ocular consequence is assessed separately in the mouse.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      Loss of the assembly-promoting protease leaves fibrillin-1 poorly deposited
      into microfibrils.
  - target: Reduced BMP-SMAD1/5/8 Signaling and Delayed Chondrocyte Differentiation
    description: >-
      The ADAMTS10 WMS knock-in mouse shows decreased SMAD1/5/8 signaling,
      restricting this experimentally observed signaling route to the ADAMTS10
      arm rather than to every WMS genotype.
  - target: Altered Skeletal Myogenesis and Hypermuscularity
    description: >-
      Increased muscle mass, increased myofiber number and altered skeletal
      myogenesis were observed in the ADAMTS10 WMS knock-in mouse; this route is
      not generalized to the other genetic forms.
  - target: Zonular Insufficiency
    description: >-
      Failure of postnatal fibrillin-2 clearance perturbs maturation of the
      ADAMTS10-deficient ocular zonule.
- name: ADAMTS17 Secretion Loss and Microfibril Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Pathogenic ADAMTS17 missense variants can markedly reduce secretion of the
    protein into the extracellular medium. Patient fibroblasts additionally show
    intracellular accumulation of fibrillin-1 and type I collagen with abnormal
    dermal extracellular matrix, consistent with loss of extracellular ADAMTS17
    and disruption of early matrix-protein secretion or assembly.
  genes:
  - preferred_term: ADAMTS17
    term:
      id: hgnc:17109
      label: ADAMTS17
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:32616716
    reference_title: "A novel pathogenic missense ADAMTS17 variant that impairs secretion causes Weill-Marchesani Syndrome with variably dysmorphic hand features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This variant caused severely reduced secretion of ADAMTS17 into the extracellular medium, suggesting functional loss of ADAMTS17 rather than impairment of a domain-specific function or interaction."
    explanation: >-
      Functional expression data establish secretion loss as the effect of the
      p.Cys1023Tyr WMS4 allele.
  - reference: PMID:31726086
    reference_title: "A novel ADAMTS17 variant that causes Weill-Marchesani syndrome 4 alters fibrillin-1 and collagen type I deposition in the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the variant in ADAMTS17 prevents its secretion and we found intracellular accumulation of fibrillin-1 and collagen type I in patient-derived skin fibroblasts."
    explanation: >-
      Patient-derived fibroblasts link impaired ADAMTS17 secretion to abnormal
      handling of two extracellular-matrix proteins.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      Loss of extracellular ADAMTS17 perturbs fibrillin microfibril biogenesis or
      maturation.
  - target: Reduced BMP-SMAD1/5/8 Signaling and Delayed Chondrocyte Differentiation
    description: >-
      Adamts17 loss alters fibrillin-2 incorporation and reduces growth-plate
      BMP-SMAD signaling in vivo.
- name: FBN1 WMS Microfibril-Scaffold Disruption
  biological_scale: MOLECULAR
  description: >-
    Heterozygous FBN1 WMS variants alter the fibrillin-1 scaffold itself. A
    replicated human WMS deletion removes three fibrillin-1 domains and an
    ADAMTS-like-protein binding site; human and mouse ultrastructure shows altered
    microfibrils and a tissue-local microenvironmental response that differs from
    the broad TGF-beta activation associated with Marfan syndrome.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  evidence:
  - reference: PMID:22242013
    reference_title: "Microenvironmental regulation by fibrillin-1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutation deletes three domains in fibrillin-1, abolishing a binding site utilized by ADAMTSLIKE-2, -3, -6, and papilin."
    explanation: >-
      Identifies the structural deletion and lost binding interface in a human
      family whose allele was replicated in mice; OTHER reflects the combined
      human and model evidence in the same report.
  - reference: PMID:22242013
    reference_title: "Microenvironmental regulation by fibrillin-1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Investigations of microfibril ultrastructure in WMS humans and mice demonstrate that modulation of the fibrillin microfibril scaffold can influence local tissue microenvironments and link fibrillin-1 function to skin homeostasis and the regulation of dermal collagen production."
    explanation: >-
      Directly supports the altered-scaffold and tissue-microenvironment claim
      using human tissue and the allele-matched mouse.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      Altering fibrillin-1 changes the structure and local organization of the
      microfibril scaffold.
  - target: Dermal Matrix Remodeling and Skin Thickening
    description: >-
      The allele-matched model links the altered scaffold to dermal collagen
      production and the thick-skin phenotype.
- name: LTBP2-Dependent Microfibril-Bundle Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    LTBP2 binds fibrillin-1 and is required for stable microfibril-bundle
    assembly, particularly in the ciliary zonule. WMS-associated mutant proteins
    can be retained intracellularly rather than secreted. Unlike other LTBPs,
    LTBP2 does not covalently bind latent TGF-beta; any effect on TGF-beta storage
    is therefore indirect, potentially through competition with LTBP1 for
    fibrillin-1 binding.
  genes:
  - preferred_term: LTBP2
    term:
      id: hgnc:6715
      label: LTBP2
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24908666
    reference_title: "Latent TGF-β binding protein-2 is essential for the development of ciliary zonule microfibrils."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The findings of this study suggest that LTBP-2 is an essential component for the formation of microfibril bundles in ciliary zonules."
    explanation: >-
      Human ciliary-cell perturbation, rescue experiments and an Ltbp2-null mouse
      jointly establish the bundle-assembly role.
  - reference: PMID:17293099
    reference_title: "LTBP-2 specifically interacts with the amino-terminal region of fibrillin-1 and competes with LTBP-1 for binding to this microfibrillar protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LTBP-2 is a matrix protein of unknown function since, unlike other LTBPs, it does not form covalent complexes with latent TGF-beta."
    explanation: >-
      Prevents conflation of LTBP2 with latent-TGF-beta-binding LTBPs and limits
      any signaling claim to an indirect mechanism.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      Loss of secreted LTBP2 disrupts formation of stable fibrillin-containing
      microfibril bundles.
  - target: Zonular Insufficiency
    description: >-
      The ciliary zonule is the tissue in which LTBP2-dependent bundle failure is
      directly demonstrated.
- name: Deficient Fibrillin Microfibril Network
  biological_scale: TISSUE
  description: >-
    The four genetic arms converge on abnormal assembly, composition or
    organization of fibrillin-containing extracellular microfibrils. Human
    ADAMTS10-mutant fibroblasts deposit fibrillin-1 sparsely, LTBP2-mutant skin
    has a disrupted microfibrillar network, and ADAMTS17-mutant cells mishandle
    matrix proteins. Microfibrils provide both structural support and local
    control of TGF-beta-superfamily growth-factor bioavailability, but the
    direction and ligand specificity of signaling changes are not uniform across
    WMS genotypes. The downstream edges from this shared node therefore capture
    only structural or phenotypic convergence, while experimentally resolved
    signaling and myogenesis routes remain attached to their specific gene arms.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibrillin microfibrils are extracellular matrix assemblies that form the template for elastic fibres, endow blood vessels, skin and other elastic tissues with extensible properties. They also regulate the bioavailability of potent growth factors of the TGF-β superfamily."
    explanation: >-
      Establishes the dual structural and growth-factor-regulatory role of the
      microfibril that explains the breadth of the phenotype.
  - reference: PMID:22539340
    reference_title: "LTBP2 mutations cause Weill-Marchesani and Weill-Marchesani-like syndrome and affect disruptions in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light, fluorescent, and electron microscopy evidenced disruptions of the microfibrillar network in the ECM of the proband's skin."
    explanation: >-
      Direct patient-tissue demonstration of the disrupted microfibrillar network.
  - reference: PMID:25957949
    reference_title: "ADAMTS proteins as modulators of microfibril formation and function."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Together, this strongly suggests that ADAMTS proteins are involved either in microfibril assembly, stability, and anchorage, or the formation of function-specific supramolecular networks having microfibrils as their foundation."
    explanation: >-
      Review-level synthesis supports convergence of ADAMTS10 and ADAMTS17 on
      microfibril assembly, stability or function-specific matrix networks while
      leaving their gene-specific mechanisms distinct.
  downstream:
  - target: Zonular Insufficiency
    description: >-
      The ciliary zonule is a specialized fibrillin microfibril structure, so
      microfibril deficiency directly weakens lens suspension.
  - target: Acromelic Long-Bone Growth Restriction
    description: >-
      Abnormal growth-plate microfibrils and signaling restrict longitudinal bone
      growth.
  - target: Joint Limitation
    description: >-
      Matrix dysfunction in periarticular connective tissues is a plausible
      upstream contributor to the stiff-joint phenotype, although this edge has
      not been resolved experimentally in human tissue.
  - target: Dermal Matrix Remodeling and Skin Thickening
    description: >-
      Genotype-specific human and mouse studies connect altered microfibrils to
      dermal collagen or elastic-fiber abnormalities.
- name: Reduced BMP-SMAD1/5/8 Signaling and Delayed Chondrocyte Differentiation
  biological_scale: MOLECULAR
  description: >-
    Adamts17-null growth plates show increased fibrillin-2 incorporation,
    reduced phospho-Smad1 and delayed terminal chondrocyte differentiation; BMP
    treatment prevents the differentiation delay. An independent ADAMTS10 WMS
    mouse also shows reduced SMAD1/5/8 signaling. These data support a reduced
    BMP-SMAD branch for the skeletal phenotype, not a generic claim that all WMS
    tissues have direct TGF-beta overactivation.
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:31201465
    reference_title: "Adamts17 is involved in skeletogenesis through modulation of BMP-Smad1/5/8 pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Delayed terminal differentiation of Adamts17-/- chondrocytes, observed both in primary chondrocyte and primordial metatarsal cultures, and was prevented by BMP treatment."
    explanation: >-
      The delayed differentiation and its BMP rescue provide functional evidence
      for reduced BMP signaling downstream of Adamts17 loss.
  - reference: PMID:31201465
    reference_title: "Adamts17 is involved in skeletogenesis through modulation of BMP-Smad1/5/8 pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with this, phospho-Smad1 levels were downregulated in the hypertrophic zone of the growth plate and in Adamts17-/- primary chondrocytes."
    explanation: >-
      Directly localizes reduced BMP-SMAD output to the affected growth plate and
      Adamts17-null chondrocytes.
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data indicate that decreased SMAD1/5/8 and increased p38/MAPK signalling are associated with ADAMTS10-induced WMS."
    explanation: >-
      Identifies the specific signalling shift downstream of the ADAMTS10 lesion
      in a CRISPR knock-in mouse model of the human truncation.
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results correlated with expression data showing down regulation of Growth differentiation factor (GDF8) and Bone Morphogenetic Protein (BMP) growth factor genes."
    explanation: >-
      Links the growth and skeletal muscle phenotypes to reduced GDF8 and BMP
      family expression.
  downstream:
  - target: Acromelic Long-Bone Growth Restriction
    description: >-
      Reduced BMP-SMAD output delays chondrocyte maturation and restricts long-bone
      growth in the mouse models.
- name: Zonular Insufficiency
  biological_scale: TISSUE
  description: >-
    The ciliary zonule that suspends and tensions the lens is itself built from
    fibrillin-containing microfibril bundles. LTBP2 loss directly compromises
    zonule formation, while Adamts10-null mice retain fibrillin-2-rich, thick
    zonular fibers with reduced fibrillin-1. Failure of normal bundle assembly or
    maturation reduces zonular support and links the matrix lesion to both lens
    shape and position abnormalities.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular problems, typically recognized in childhood, include microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens, ectopia lentis (abnormal position of the lens), and glaucoma, which can lead to blindness."
    explanation: >-
      Establishes that lens-shape and lens-position abnormalities coexist in the
      characteristic childhood ocular presentation; it directly supports only
      the lens-shape-to-myopia relation.
  - reference: PMID:24908666
    reference_title: "Latent TGF-β binding protein-2 is essential for the development of ciliary zonule microfibrils."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ltbp2(-/-) mice survived to adulthood but developed lens luxation caused by compromised ciliary zonule formation"
    explanation: >-
      Directly links LTBP2 deficiency to compromised zonule formation and lens
      luxation in the knockout mouse.
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, there are abnormalities in the ciliary apparatus of the eye with decreased ciliary processes and abundant fibrillin-2 microfibrils suggesting perturbation of a developmental expression switch."
    explanation: >-
      Model-organism evidence of ciliary apparatus abnormality with a
      fibrillin-2-to-fibrillin-1 switch failure.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in contrast to wild-type eyes, Adamts10-/- zonule fibers were thicker and immunostained strongly with fibrillin-2 antibodies into adulthood, whereas fibrillin-1 staining was reduced"
    explanation: >-
      Shows the zonule retains immature fibrillin-2 composition when ADAMTS10 is
      absent, a compositional rather than purely quantitative defect.
  downstream:
  - target: Microspherophakia and Lenticular Myopia
    description: >-
      Without zonular tension the lens relaxes into a small spherical shape.
  - target: Ectopia Lentis
    description: >-
      A deficient zonule also fails to anchor the lens, allowing it to displace.
- name: Microspherophakia and Lenticular Myopia
  biological_scale: TISSUE
  description: >-
    Reduced zonular tension is the proposed mechanical basis for the small,
    steeply curved lens. The abnormal lens shape increases refractive power and
    produces lenticular rather than axial myopia. A longitudinal WMS4 case showed
    progressive childhood lens thickening with increasing lens power and myopic
    refractive error, but that single-patient observation should not be treated as
    a population-level trajectory.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens"
    explanation: >-
      States that the myopia follows from the abnormal lens shape, establishing
      the lenticular mechanism.
  - reference: PMID:36698805
    reference_title: "Abnormal lens thickening in a child with Weill-Marchesani syndrome 4: A 3-year follow-up case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the 3 years of follow-up, the thickness of lenses increased significantly (right 4.49 mm, left 4.48 mm), but the equatorial diameter of the lenses had no significant change (right 7.32 mm, left 7.21 mm). As the equivalent lens power increased, the patient's myopia spherical refractive error rose accordingly."
    explanation: >-
      Longitudinal biometric evidence in one child links progressive lens
      thickening and power to worsening lenticular myopia.
  downstream:
  - target: Pupillary Block and Angle Closure
    description: >-
      A small, thick, forward-sitting lens crowds the anterior chamber and
      obstructs aqueous flow through the pupil.
- name: Ectopia Lentis
  biological_scale: TISSUE
  description: >-
    Failure of zonular anchorage allows the lens to subluxate or dislocate. A
    displaced lens is itself a mechanical cause of pupillary block, and it is the
    finding whose early detection and removal drives the whole management
    strategy.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ectopia lentis (abnormal position of the lens)"
    explanation: >-
      Defines ectopia lentis as the lens-position abnormality of WMS.
  downstream:
  - target: Pupillary Block and Angle Closure
    description: >-
      An anteriorly displaced lens obstructs the pupil directly.
- name: Pupillary Block and Angle Closure
  biological_scale: TISSUE
  description: >-
    In WMS the initiating glaucoma lesion is anatomical: a microspherophakic or
    displaced lens can block aqueous passage at the pupil and promote chronic
    angle closure. This is not equivalent to the trabecular-meshwork initiating
    lesion in the conserved glaucoma module, so conformance begins only at the
    downstream elevated-pressure node. The lens-driven anatomy also explains why
    GeneReviews warns that miotics and mydriatics can have paradoxical effects or
    induce pupillary block.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical management of glaucoma can include peripheral iridectomy to prevent or relieve pupillary block and trabeculectomy in advanced chronic angle closure glaucoma"
    explanation: >-
      Identifies pupillary block and chronic angle closure as the operative
      mechanism of glaucoma in WMS.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "medical treatment of glaucoma is difficult because of paradoxic response to miotics and mydriatics"
    explanation: >-
      Documents the paradoxical drug response that follows from the lens-driven
      rather than outflow-driven mechanism.
  downstream:
  - target: Elevated Intraocular Pressure
    description: >-
      Obstructed aqueous egress raises intraocular pressure.
- name: Elevated Intraocular Pressure
  biological_scale: ORGANISM
  conforms_to: "glaucoma_optic_neuropathy#Elevated Intraocular Pressure"
  description: >-
    Aqueous outflow obstruction raises intraocular pressure. From this point
    onward WMS runs along the conserved glaucoma pathway, which is why the
    downstream nodes conform to the module without substitution.
  evidence:
  - reference: PMID:32561029
    reference_title: "The trabecular meshwork: Structure, function and clinical implications. A review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glaucoma is a blinding optic neuropathy, the main risk factor for which is increased intraocular pressure (IOP)."
    explanation: >-
      Establishes increased IOP as the principal pressure-mediated risk factor in
      the conserved glaucoma pathway; this is general glaucoma review evidence.
  - reference: PMID:25397784
    reference_title: "Visual outcome and incidence of glaucoma in patients with microspherophakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glaucoma developed in 16 eyes (44.4%). Half of them had high IOP at presentation."
    explanation: >-
      A microspherophakia cohort directly documents high IOP in affected eyes,
      although the cohort was not restricted to molecularly confirmed WMS.
  downstream:
  - target: Retinal Ganglion Cell Apoptosis
    description: >-
      Sustained pressure elevation drives retinal ganglion cell death.
- name: Retinal Ganglion Cell Apoptosis
  biological_scale: CELLULAR
  conforms_to: "glaucoma_optic_neuropathy#Retinal Ganglion Cell Apoptosis"
  description: >-
    Pressure-driven apoptotic loss of retinal ganglion cells, the cellular event
    that makes glaucomatous damage irreversible and therefore the reason WMS
    management is pre-emptive rather than reactive.
  cell_types:

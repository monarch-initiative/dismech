    snippet: "Weill-Marchesani syndrome (WMS) belongs to the group of acromelic dysplasias, defined by short stature, brachydactyly and joint limitations."
    explanation: >-
      Places WMS nosologically among the acromelic dysplasias by its systemic
      triad.

    snippet: "Significant results were found for microspherophakia (94% in AR, 74% in AD, Fischer 0.007)"
    explanation: >-
      Quantifies microspherophakia at 94% in recessive and 74% in dominant WMS;
      the dominant estimate and the 42/61 contemporary combined-cohort count

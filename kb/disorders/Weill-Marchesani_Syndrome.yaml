differential_diagnoses:
- name: Marfan syndrome
  description: >-
    The instructive contrast rather than a close mimic. Both are FBN1 microfibril
    disorders with ectopia lentis, but the habitus is inverted: Marfan syndrome
    gives tall stature, arachnodactyly, joint laxity and aortic root dilation,
    while WMS gives short stature, brachydactyly, joint stiffness and thickened
    skin. Lens shape separates them, since microspherophakia is characteristic of
    WMS.
  distinguishing_features:
  - Tall stature with arachnodactyly and joint laxity, versus short stature with brachydactyly and joint stiffness
  - Aortic root dilation and dissection risk, versus valvular disease without characteristic aortopathy
  - Microspherophakia strongly favors WMS in an ectopia-lentis presentation
  evidence:
  - reference: PMID:22242013
    reference_title: "Microenvironmental regulation by fibrillin-1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in FBN1 are mainly responsible for the Marfan syndrome (MFS), recognized by its pleiotropic clinical features including tall stature and arachnodactyly, aortic dilatation and dissection, and ectopia lentis."
    explanation: >-
      Directly supports the Marfan side of the phenotypic contrast from a
      fibrillin-1 mechanistic study.
  - reference: PMID:22242013
    reference_title: "Microenvironmental regulation by fibrillin-1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Here we show that a novel FBN1 mutation in a family with Weill-Marchesani syndrome (WMS) causes thick skin, short stature, and brachydactyly when replicated in mice."
    explanation: >-
      Supports the contrasting WMS habitus in a human-family/allele-matched-mouse
      study.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unlike MFS, WMS does not typically predispose to aortic aneurysm."
    explanation: >-
      Supports the cardiovascular discriminator while appropriately retaining
      "typically" rather than treating aortopathy as impossible in WMS.
- name: Isolated ectopia lentis, especially ADAMTSL4-related disease
  description: >-
    An ocular-first presentation with progressive lens dislocation can be a
    nonsyndromic zonular disorder rather than WMS. Familial isolated ectopia
    lentis can have dominant or recessive inheritance, and biallelic ADAMTSL4
    variants are an established cause of the autosomal recessive form. Absence
    of the characteristic WMS combination of short stature, brachydactyly, joint
    stiffness and cardiovascular findings favors the isolated diagnosis, while
    molecular testing distinguishes ADAMTSL4-related disease from the four WMS
    gene forms. The word "isolated" should be applied only after a systemic
    assessment rather than inferred from an ocular presentation alone.
  distinguishing_features:
  - Ectopia lentis is the principal finding without the characteristic multisystem WMS habitus
  - Biallelic ADAMTSL4 variants support autosomal recessive isolated ectopia lentis rather than WMS
  - Progressive lens dislocation can occur in isolated disease, so progression alone does not establish WMS
  evidence:
  - reference: PMID:20141359
    reference_title: "Confirmation of ADAMTSL4 mutations for autosomal recessive isolated bilateral ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ectopia lentis (EL) is a zonular disease where alteration of the zonular fibers leads progressively to lens dislocation."
    explanation: >-
      Defines the shared ocular presentation and cautions that progressive lens
      dislocation is not by itself specific for WMS.
  - reference: PMID:20141359
    reference_title: "Confirmation of ADAMTSL4 mutations for autosomal recessive isolated bilateral ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated non syndromic ectopia lentis (IEL) is reported in families with autosomal inheritance, with dominant forms being more common than recessive."
    explanation: >-
      Keeps the differential broader than ADAMTSL4 by documenting both dominant
      and recessive familial isolated ectopia lentis.
  - reference: PMID:20141359
    reference_title: "Confirmation of ADAMTSL4 mutations for autosomal recessive isolated bilateral ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we show a consanguineous family that carries a novel homozygous splice mutation IVS4-1G>A/IVS4-1G>A in ADAMTSL4 responsible for isolated autosomal recessive EL, thus confirming the involvement of this gene in this condition and underlining the major role of ADAMTS proteases in zonular fibers homeostasis."
    explanation: >-
      Provides family-based molecular evidence for ADAMTSL4-related isolated
      autosomal recessive ectopia lentis.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Weill-Marchesani syndrome (WMS) is a connective tissue disorder characterized by abnormalities of the lens of the eye, short stature, brachydactyly, joint stiffness, and cardiovascular defects."
    explanation: >-
      Supplies the multisystem WMS features whose presence argues against a
      genuinely isolated ectopia-lentis diagnosis.
- name: Isolated microspherophakia
  description: >-
    A small spherical lens can occur as a familial isolated ocular disorder, so
    microspherophakia alone does not establish WMS. A reported consanguineous
    family had bilateral isolated microspherophakia with likely recessive
    inheritance, and linkage to ADAMTS10 was excluded in that family. That
    family-specific genetic result is not evidence that every isolated case has
    the same cause. Lenticular myopia, lens subluxation and glaucoma can follow
    microspherophakia in either setting; systemic examination and WMS molecular
    testing are therefore the useful separators when the presentation is
    ocular-first.
  distinguishing_features:
  - Bilateral microspherophakia without short stature, brachydactyly, joint stiffness or cardiovascular disease favors an isolated ocular diagnosis
  - Lenticular myopia, lens subluxation and glaucoma are complications of lens shape and do not by themselves distinguish isolated disease from WMS
  - Exclusion of ADAMTS10 linkage was specific to the cited family; inconclusive patients still warrant testing of the established WMS genes
  evidence:
  - reference: PMID:19696795
    reference_title: "Clinical and genetic investigation of isolated microspherophakia in a consanguineous Tunisian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A consanguineous family (MSP-M), including six family members and two patients, presented with decreased vision secondary to bilateral isolated microspherophakia."
    explanation: >-
      Establishes that bilateral microspherophakia can present as a familial
      isolated ocular phenotype.
  - reference: PMID:19696795
    reference_title: "Clinical and genetic investigation of isolated microspherophakia in a consanguineous Tunisian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a homozygosity-mapping strategy, haplotypic analysis using four STRs showed an exclusion of linkage between the ADAMTS10 gene and the disease locus in this family."
    explanation: >-
      Supports a genetic distinction from ADAMTS10-related WMS only for the
      family studied, without extrapolating an unknown universal cause.
  - reference: PMID:25397784
    reference_title: "Visual outcome and incidence of glaucoma in patients with microspherophakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microspherophakia is associated with a high incidence of lenticular myopia, subluxation of the crystalline lens and glaucoma."
    explanation: >-
      Shows why common ocular complications reflect microspherophakia itself and
      cannot serve as reliable WMS-specific discriminators.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in ADAMTS10, ADAMTS17, or LTBP2 or of a heterozygous pathogenic variant in FBN1 by molecular genetic testing can confirm the diagnosis if clinical features are inconclusive."
    explanation: >-
      Supports WMS-gene testing when an ocular-first presentation remains
      clinically ambiguous after systemic assessment.
- name: Geleophysic dysplasia and acromicric dysplasia
  description: >-
    These other acromelic dysplasias share short stature, small hands and feet,
    thick skin and stiff joints. Microspherophakia and ectopia lentis favor WMS.
    Progressive cardiac-valve thickening, tracheal stenosis and
    bronchopulmonary insufficiency strongly favor geleophysic dysplasia; ocular
    findings can occasionally overlap, so molecular testing may be necessary.
  distinguishing_features:
  - Microspherophakia and ectopia lentis are characteristic diagnostic anchors for WMS
  - Progressive valvular thickening, tracheal stenosis or bronchopulmonary insufficiency favor geleophysic dysplasia
  - Molecular testing separates overlapping FBN1-associated acromelic phenotypes and identifies ADAMTSL2-related geleophysic dysplasia
  evidence:
  - reference: PMID:24214363
    reference_title: "Similarity of geleophysic dysplasia and Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Weill-Marchesani syndrome, on the basis of microspherophakia and ectopia lentis; geleophysic dysplasia by progressive cardiac valvular thickening, tracheal stenosis, and/or bronchopulmonary insufficiency, often leading to early death."
    explanation: >-
      Gives the principal clinical discriminators within the acromelic-dysplasia
      differential while the reported overlapping case cautions that they are not
      absolute.
- name: Homocystinuria due to cystathionine beta-synthase deficiency
  description: >-
    Homocystinuria can present with severe myopia and ectopia lentis and should be
    excluded when the ocular phenotype is prominent. Excessive height, long
    limbs, osteoporosis, arachnodactyly, thromboembolism and neurodevelopmental
    manifestations contrast with the short, brachydactylous WMS habitus; plasma
    total homocysteine and amino-acid testing provides a rapid biochemical
    discriminator.
  distinguishing_features:
  - Excessive height and arachnodactyly rather than short stature and brachydactyly
  - Thromboembolic risk and possible neurodevelopmental manifestations
  - Markedly elevated plasma total homocysteine and characteristic amino-acid abnormalities
  evidence:
  - reference: PMID:20301697
    reference_title: "Homocystinuria due to Cystathionine Beta-Synthase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homocystinuria (HCU) due to cystathionine beta-synthase (CBS) deficiency (HCU-CBS deficiency) is characterized by involvement of four major systems: the eye (ectopia lentis and/or severe myopia), skeletal system (excessive height, long limbs, osteoporosis, scoliosis, arachnodactyly, pes cavus, pectus excavatum or carinatum, and genu valgum), vascular system (thromboembolism), and central nervous system (developmental delay, intellectual disability, seizures, psychiatric and behavioral manifestations, and dystonia)."
    explanation: >-
      Supports both the ocular overlap and the systemic findings that distinguish
      homocystinuria from WMS.
  - reference: PMID:20301697
    reference_title: "Homocystinuria due to Cystathionine Beta-Synthase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma concentrations of total homocysteine and amino acids should be measured in at-risk sibs as soon as possible after birth so that morbidity and mortality can be reduced by early diagnosis and treatment."
    explanation: >-
      Supports plasma total-homocysteine and amino-acid analysis as the
      biochemical route to early recognition.

name: Weill-Marchesani syndrome
creation_date: "2026-08-01T04:23:04Z"
description: >-
  Weill-Marchesani syndrome (WMS) is a rare heritable disorder of the fibrillin
  microfibril and one of the acromelic dysplasias, defined by short stature,
  brachydactyly and joint stiffness together with a mandatory ocular phenotype of
  microspherophakia, ectopia lentis, high myopia and glaucoma. It is the
  phenotypic mirror image of Marfan syndrome: the same FBN1 microfibril system is
  disrupted, but the result is a short, stiff, thick-skinned, muscular build with
  a small round lens rather than a tall, lax, arachnodactylous one. Four genes,
  all encoding secreted extracellular matrix proteins that build or regulate
  fibrillin microfibrils, cause the disorder.
category: Mendelian
parents:
- syndromic disease
- connective tissue disease
synonyms:
- WMS
- spherophakia-brachymorphia syndrome
- GEMSS syndrome
disease_term:
  preferred_term: Weill-Marchesani syndrome
  term:
    id: MONDO:0018096
    label: Weill-Marchesani syndrome
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The recessive form, the more common of the two, is caused by biallelic
    variants in ADAMTS10 (WMS1), LTBP2 (WMS3) or ADAMTS17 (WMS4).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADAMTS10-, ADAMTS17-, and LTPBP2-related WMS are inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews assigns the three protease and binding-protein genes to
      autosomal recessive inheritance.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: >-
      Gives the sibling recurrence risks used in counselling families with a
      recessive form.
- name: Autosomal dominant inheritance
  description: >-
    The dominant form (WMS2) is caused by heterozygous FBN1 variants, most
    clustering in the TB5 domain. Inheritance mode cannot be inferred from the
    clinical picture, only from the genotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBN1-related WMS is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews assigns FBN1-related WMS to autosomal dominant inheritance.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with autosomal dominant WMS has a 50% chance of inheriting the pathogenic variant."
    explanation: >-
      Gives the transmission risk used in counselling families with the dominant
      form.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive WMS cannot be distinguished from autosomal dominant WMS by clinical findings alone."
    explanation: >-
      Establishes that the two inheritance modes are clinically indistinguishable,
      which is why molecular testing rather than pedigree drives classification.

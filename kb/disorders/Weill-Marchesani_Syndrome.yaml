discussions:
- discussion_id: gap_wms_fbn1_phenotypic_inversion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do FBN1 variants produce the short, stiff, thick-skinned Weill-Marchesani
    phenotype in some individuals and the tall, lax Marfan phenotype in others,
    when the same gene and the same microfibril system are involved?
  attaches_to:
  - pathophysiology#FBN1 WMS Microfibril-Scaffold Disruption
  - pathophysiology#Reduced BMP-SMAD1/5/8 Signaling and Delayed Chondrocyte Differentiation
  rationale: >-
    WMS2 and Marfan syndrome are allelic yet phenotypically opposite along nearly
    every systemic axis. Domain location clearly matters, since TB5 variants give
    the shortest stature within WMS, but domain location alone does not explain
    the sign reversal in growth, skin thickness and joint mobility. The mouse
    data point to reduced SMAD1/5/8 with increased p38 MAPK in the ADAMTS10 arm,
    which is not simply the inverse of the TGF-beta overactivation invoked for
    Marfan syndrome, so the two diseases may differ in which sequestered ligand
    class is released rather than in the direction of a single pathway. The
    inversion framing should not be over-tightened: domain location is associated
    with phenotype but is not established as a clean molecular switch between
    WMS and Marfan syndrome.
  proposed_experiments:
  - experiment_id: exp_wms_fbn1_domain_swap_signalling
    name: Domain-controlled FBN1 allelic series comparing WMS and Marfan signaling
    description: >-
      Build an isogenic FBN1 allelic series carrying WMS-associated and
      Marfan-associated variants, including same-domain pairs where available and
      variants inside and outside TB5, and measure microfibril architecture,
      BMP-family versus TGF-beta-family ligand activation, SMAD1/5/8, SMAD2/3 and
      p38 MAPK output in the same fibroblast and chondrocyte backgrounds.
    decision_criterion: >-
      A consistent difference in which ligand class is liberated by WMS versus
      Marfan alleles, rather than a difference in overall signalling magnitude,
      would explain the phenotypic inversion.
  evidence:
  - reference: PMID:22242013
    reference_title: "Microenvironmental regulation by fibrillin-1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hence, pathogenetic mechanisms caused by dysregulated WMS microenvironments diverge from Marfan pathogenetic mechanisms, which lead to broad activation of TGFβ signaling in multiple tissues."
    explanation: >-
      Establishes the mechanistic divergence while leaving the causal basis of
      the allelic phenotypic inversion unresolved.
- discussion_id: gap_wms_lens_shape_versus_position
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is microspherophakia significantly more frequent in recessive WMS while
    ectopia lentis is significantly more frequent in dominant WMS, if both follow
    from the same zonular insufficiency?
  attaches_to:
  - pathophysiology#Zonular Insufficiency
  - pathophysiology#Microspherophakia and Lenticular Myopia
  - pathophysiology#Ectopia Lentis
  rationale: >-
    Across 128 reviewed patients the two lens phenotypes dissociate in opposite
    directions by inheritance mode, with both differences statistically
    significant. That pattern is hard to reconcile with a single graded zonular
    defect, and suggests that shaping the lens during development and anchoring it
    thereafter may be separable functions of the zonule, differently sensitive to
    losing an assembly protease versus altering the fibrillin monomer itself.
  proposed_experiments:
  - experiment_id: exp_wms_zonule_development_vs_maintenance
    name: Temporally resolved zonule phenotyping in ADAMTS10 versus Fbn1 WMS models
    description: >-
      Compare zonular fibre architecture, tension and lens curvature at
      developmental and adult time points in the ADAMTS10 knock-in mouse against
      an Fbn1 WMS-allele model, testing whether the protease-loss model
      preferentially fails the developmental lens-shaping step while the
      fibrillin-variant model preferentially fails long-term anchorage.
    decision_criterion: >-
      A temporal dissociation, with shape set early and anchorage failing late in
      the respective models, would account for the epidemiological pattern.
  evidence:
  - reference: PMID:14598350
    reference_title: "Clinical homogeneity and genetic heterogeneity in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant results were found for microspherophakia (94% in AR, 74% in AD, Fischer 0.007), ectopia lentis (64% in AR, 84% in AD, Fischer 0.016)"
    explanation: >-
      Documents the statistically significant opposite-direction dissociation of
      the two lens phenotypes by inheritance mode.
- discussion_id: mismatch_wms_adamts10_null_mouse
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can the Adamts10-null mouse be used to study the ocular and skeletal
    phenotype of Weill-Marchesani syndrome, when it fails to reproduce ectopia
    lentis, brachydactyly and cardiovascular defects?
  attaches_to:
  - pathophysiology#Zonular Insufficiency
  - pathophysiology#Microspherophakia and Lenticular Myopia
  - pathophysiology#Ectopia Lentis
  - pathophysiology#Acromelic Long-Bone Growth Restriction
  - pathophysiology#Joint Limitation
  rationale: >-
    Adamts10-null mice are slightly smaller with stiff skin but show no ectopia
    lentis, no brachydactyly and no cardiovascular defects, so three of the
    cardinal human features are simply absent. The authors attribute the ocular
    discrepancy to a species difference in zonular composition: the mouse zonule
    contains fibrillin-2 as well as fibrillin-1, so it can compensate where the
    human zonule cannot. This is a genuine translational limit rather than a
    weak model, and it means murine zonule findings cannot be read directly onto
    the human lens phenotype. Notably the separate CRISPR knock-in of a human
    truncation does reproduce growth and muscle changes, so the two ADAMTS10
    mouse models are not interchangeable.
  proposed_experiments:
  - experiment_id: exp_wms_fbn2_humanized_zonule
    name: Fibrillin-2-depleted Adamts10-null zonule to test the compensation hypothesis
    description: >-
      Cross Adamts10-null mice onto a background with reduced ocular fibrillin-2
      so that the zonule must rely on fibrillin-1, and test whether ectopia
      lentis and microspherophakia then appear. Compare zonular composition,
      lens shape and lens position against human WMS ocular tissue where
      available.
    decision_criterion: >-
      Emergence of ectopia lentis and microspherophakia on the
      fibrillin-2-reduced background would confirm that species-specific zonular
      composition, not a different disease mechanism, explains the mismatch.
  evidence:
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ectopia lentis was not observed in Adamts10-/- mice, similar to Fbn1-/- mice, most likely because the mouse zonule contains fibrillin-2 in addition to fibrillin-1."
    explanation: >-
      States the mismatch and the authors' species-composition explanation for
      it.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "although surviving mice were slightly smaller and had stiff skin, they lacked brachydactyly and cardiovascular defects"
    explanation: >-
      Documents the additional skeletal and cardiac features that the null mouse
      fails to reproduce.

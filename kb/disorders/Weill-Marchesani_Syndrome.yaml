- name: Optic Nerve Degeneration and Neuroinflammation
  biological_scale: TISSUE
  conforms_to: "glaucoma_optic_neuropathy#Optic Nerve Degeneration and Neuroinflammation"
  description: >-
    Progressive retinal-ganglion-cell loss is accompanied by optic-nerve axon
    degeneration and neuroinflammation. This intermediate is conserved across

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report null mutations in a member of the extracellular matrix protease family, the gene encoding ADAMTS10, a disintegrin and metalloprotease with thrombospondin motifs."
    explanation: >-
      Original identification of ADAMTS10 as the recessive WMS gene.

      label: Weill-Marchesani syndrome 1
  description: >-
    The prototypic recessive form, caused by biallelic ADAMTS10 null and splice
    variants. ADAMTS10 is a secreted metalloprotease that binds fibrillin-1 and
    accelerates microfibril biogenesis; patient fibroblasts deposit microfibrils
    sparsely. Cardiac anomalies are more frequent in the recessive forms.
  genes:

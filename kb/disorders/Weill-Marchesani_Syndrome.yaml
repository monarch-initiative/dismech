pathophysiology:
- name: Loss of ADAMTS-Family Microfibril Assembly Function
  biological_scale: MOLECULAR
  description: >-
    ADAMTS10 and ADAMTS17 are secreted metalloproteases that bind fibrillin-1
    directly and promote its deposition. ADAMTS10 accelerates microfibril
    biogenesis when supplied exogenously, and is a poor fibrillinase because its
    zymogen resists furin activation, so its role is assembly rather than
    turnover. Loss-of-function variants therefore subtract a microfibril builder
    rather than releasing a protease brake.
  genes:
  - preferred_term: ADAMTS10
    term:
      id: hgnc:13201
      label: ADAMTS10
  - preferred_term: ADAMTS17
    term:
      id: hgnc:17109
      label: ADAMTS17
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:21402694
    reference_title: "ADAMTS10 protein interacts with fibrillin-1 and promotes its deposition in extracellular matrix of cultured fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, these findings suggest that ADAMTS10 participates in microfibril biogenesis rather than in fibrillin-1 turnover."
    explanation: >-
      Establishes ADAMTS10 as a microfibril assembly factor rather than a
      degradative protease, which sets the direction of the disease mechanism.
  - reference: PMID:21402694
    reference_title: "ADAMTS10 protein interacts with fibrillin-1 and promotes its deposition in extracellular matrix of cultured fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "fibroblasts obtained from a Weill-Marchesani syndrome patient with ADAMTS10 mutations deposited fibrillin-1 microfibrils sparsely compared with unaffected control cells"
    explanation: >-
      Direct patient-cell evidence that the ADAMTS10 lesion reduces fibrillin-1
      microfibril deposition.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      Loss of the assembly-promoting protease leaves fibrillin-1 poorly deposited
      into microfibrils.
- name: FBN1 and LTBP2 Microfibril Component Defects
  biological_scale: MOLECULAR
  description: >-
    The dominant arm acts on fibrillin-1 itself, and LTBP2 acts as a
    microfibril-associated binding protein. Because all four WMS genes encode
    secreted extracellular matrix proteins that build or decorate the same
    fibrillin microfibril, the four genotypes are clinically indistinguishable
    despite differing inheritance.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  - preferred_term: LTBP2
    term:
      id: hgnc:6715
      label: LTBP2
  evidence:
  - reference: PMID:31726086
    reference_title: "A novel ADAMTS17 variant that causes Weill-Marchesani syndrome 4 alters fibrillin-1 and collagen type I deposition in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WMS can be caused by recessive mutations in ADAMTS10 (WMS 1), ADAMTS17 (WMS 4), or LTBP2 (WMS 3), or by dominant mutations in fibrillin-1 (FBN1) (WMS 2); all genes encode secreted extracellular matrix (ECM) proteins."
    explanation: >-
      Establishes that all four causal genes converge on secreted extracellular
      matrix proteins of the same system.
  - reference: PMID:21402694
    reference_title: "ADAMTS10 protein interacts with fibrillin-1 and promotes its deposition in extracellular matrix of cultured fibroblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive and autosomal dominant forms of Weill-Marchesani syndrome, an inherited connective tissue disorder, are caused by mutations in ADAMTS10 (encoding a secreted metalloprotease) and FBN1 (encoding fibrillin-1, which forms tissue microfibrils), respectively, yet they are clinically indistinguishable."
    explanation: >-
      States the clinical indistinguishability that motivates modeling the two
      genetic arms as converging on one microfibril lesion.
  downstream:
  - target: Deficient Fibrillin Microfibril Network
    description: >-
      A defective structural component or associated binding protein yields the
      same deficient microfibril network as loss of the assembly protease.
- name: Deficient Fibrillin Microfibril Network
  biological_scale: TISSUE
  description: >-
    The convergent lesion is a sparse and disorganized fibrillin microfibril
    network in the extracellular matrix. Because fibrillin microfibrils are both
    a structural template for elastic fibres and a reservoir controlling
    TGF-beta-superfamily growth factor bioavailability, the consequences are
    simultaneously mechanical and signalling.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibrillin microfibrils are extracellular matrix assemblies that form the template for elastic fibres, endow blood vessels, skin and other elastic tissues with extensible properties. They also regulate the bioavailability of potent growth factors of the TGF-β superfamily."
    explanation: >-
      Establishes the dual structural and growth-factor-regulatory role of the
      microfibril that explains the breadth of the phenotype.
  - reference: PMID:22539340
    reference_title: "LTBP2 mutations cause Weill-Marchesani and Weill-Marchesani-like syndrome and affect disruptions in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light, fluorescent, and electron microscopy evidenced disruptions of the microfibrillar network in the ECM of the proband's skin."
    explanation: >-
      Direct patient-tissue demonstration of the disrupted microfibrillar network.
  downstream:
  - target: Dysregulated BMP and TGF-beta Growth Factor Signaling
    description: >-
      A deficient microfibril reservoir alters the bioavailability and signalling
      output of sequestered TGF-beta-superfamily ligands.
  - target: Zonular Insufficiency
    description: >-
      The ciliary zonule is a specialized fibrillin microfibril structure, so
      microfibril deficiency directly weakens lens suspension.
  - target: Acromelic Growth Restriction and Joint Stiffness
    description: >-
      The same matrix deficiency in the growth plate and periarticular connective
      tissue produces short stature, brachydactyly and joint limitation.
- name: Dysregulated BMP and TGF-beta Growth Factor Signaling
  biological_scale: MOLECULAR
  description: >-
    In the ADAMTS10 mouse model, growth plate zones are perturbed with altered
    cell proliferation, GDF8 and BMP growth factor genes are downregulated, and
    SMAD1/5/8 signalling falls while p38 MAPK signalling rises. This is the
    signalling arm through which a structural matrix defect becomes a growth and
    muscle phenotype, and it is the point at which WMS diverges from the
    TGF-beta-overactivation logic of Marfan syndrome.
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data indicate that decreased SMAD1/5/8 and increased p38/MAPK signalling are associated with ADAMTS10-induced WMS."
    explanation: >-
      Identifies the specific signalling shift downstream of the ADAMTS10 lesion
      in a CRISPR knock-in mouse model of the human truncation.
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results correlated with expression data showing down regulation of Growth differentiation factor (GDF8) and Bone Morphogenetic Protein (BMP) growth factor genes."
    explanation: >-
      Links the growth and skeletal muscle phenotypes to reduced GDF8 and BMP
      family expression.
  downstream:
  - target: Acromelic Growth Restriction and Joint Stiffness
    description: >-
      Reduced BMP and SMAD1/5/8 signalling with growth plate disorganization
      underlies the short stature and brachydactyly.
- name: Zonular Insufficiency
  biological_scale: TISSUE
  description: >-
    The ciliary zonule that suspends and tensions the lens is itself built from
    fibrillin microfibrils, so microfibril deficiency weakens lens suspension
    directly. This is the single atomic lesion from which both the shape and the
    position abnormalities of the lens follow.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular problems, typically recognized in childhood, include microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens, ectopia lentis (abnormal position of the lens), and glaucoma, which can lead to blindness."
    explanation: >-
      Establishes the causal ordering within the eye: lens shape drives the
      myopia, and the lens abnormality drives the glaucoma risk.
  - reference: PMID:30060141
    reference_title: "ADAMTS10-mediated tissue disruption in Weill-Marchesani syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, there are abnormalities in the ciliary apparatus of the eye with decreased ciliary processes and abundant fibrillin-2 microfibrils suggesting perturbation of a developmental expression switch."
    explanation: >-
      Model-organism evidence of ciliary apparatus abnormality with a
      fibrillin-2-to-fibrillin-1 switch failure.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ADAMTS10 was found to cleave fibrillin-2, providing an explanation for persistence of fibrillin-2 at these sites."
    explanation: >-
      Identifies a second, proteolytic arm of ADAMTS10 function in the zonule:
      clearing fibrillin-2 so that the mature fibrillin-1 zonule can take over.
  - reference: PMID:30201140
    reference_title: "Adamts10 inactivation in mice leads to persistence of ocular microfibrils subsequent to reduced fibrillin-2 cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in contrast to wild-type eyes, Adamts10-/- zonule fibers were thicker and immunostained strongly with fibrillin-2 antibodies into adulthood, whereas fibrillin-1 staining was reduced"
    explanation: >-
      Shows the zonule retains immature fibrillin-2 composition when ADAMTS10 is
      absent, a compositional rather than purely quantitative defect.
  downstream:
  - target: Microspherophakia and Lenticular Myopia
    description: >-
      Without zonular tension the lens relaxes into a small spherical shape.
  - target: Ectopia Lentis
    description: >-
      A deficient zonule also fails to anchor the lens, allowing it to displace.
- name: Microspherophakia and Lenticular Myopia
  biological_scale: TISSUE
  description: >-
    Released from zonular tension, the lens assumes a small, steeply curved
    spherical shape. The excess refractive power of that shape produces high
    myopia of lenticular rather than axial origin, which is why the myopia is not
    accompanied by the long globe of ordinary high myopia.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens"
    explanation: >-
      States that the myopia follows from the abnormal lens shape, establishing
      the lenticular mechanism.
  downstream:
  - target: Pupillary Block and Angle Closure
    description: >-
      A small, thick, forward-sitting lens crowds the anterior chamber and
      obstructs aqueous flow through the pupil.
- name: Ectopia Lentis
  biological_scale: TISSUE
  description: >-
    Failure of zonular anchorage allows the lens to subluxate or dislocate. A
    displaced lens is itself a mechanical cause of pupillary block, and it is the
    finding whose early detection and removal drives the whole management
    strategy.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ectopia lentis (abnormal position of the lens)"
    explanation: >-
      Defines ectopia lentis as the lens-position abnormality of WMS.
  downstream:
  - target: Pupillary Block and Angle Closure
    description: >-
      An anteriorly displaced lens obstructs the pupil directly.
- name: Pupillary Block and Angle Closure
  biological_scale: TISSUE
  conforms_to: "glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction"
  description: >-
    This node makes the organ-specific substitution explicit. The conserved
    glaucoma module places trabecular meshwork extracellular matrix dysfunction
    at this position; in WMS the obstruction to aqueous outflow is instead purely
    anatomical, a microspherophakic or subluxated lens blocking the pupil and
    closing the angle, with a structurally normal trabecular meshwork. It also
    explains the paradoxical pharmacology, since miotics thicken the lens and
    worsen block while mydriatics can dislocate the lens forward.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical management of glaucoma can include peripheral iridectomy to prevent or relieve pupillary block and trabeculectomy in advanced chronic angle closure glaucoma"
    explanation: >-
      Identifies pupillary block and chronic angle closure as the operative
      mechanism of glaucoma in WMS.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "medical treatment of glaucoma is difficult because of paradoxic response to miotics and mydriatics"
    explanation: >-
      Documents the paradoxical drug response that follows from the lens-driven
      rather than outflow-driven mechanism.
  downstream:
  - target: Elevated Intraocular Pressure
    description: >-
      Obstructed aqueous egress raises intraocular pressure.
- name: Elevated Intraocular Pressure
  biological_scale: ORGANISM
  conforms_to: "glaucoma_optic_neuropathy#Elevated Intraocular Pressure"
  description: >-
    Aqueous outflow obstruction raises intraocular pressure. From this point
    onward WMS runs along the conserved glaucoma pathway, which is why the
    downstream nodes conform to the module without substitution.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical management of glaucoma can include peripheral iridectomy to prevent or relieve pupillary block and trabeculectomy in advanced chronic angle closure glaucoma"
    explanation: >-
      Both listed procedures are pressure-directed, confirming raised pressure as
      the operative target in WMS glaucoma.
  downstream:
  - target: Retinal Ganglion Cell Apoptosis
    description: >-
      Sustained pressure elevation drives retinal ganglion cell death.
- name: Retinal Ganglion Cell Apoptosis
  biological_scale: CELLULAR
  conforms_to: "glaucoma_optic_neuropathy#Retinal Ganglion Cell Apoptosis"
  description: >-
    Pressure-driven apoptotic loss of retinal ganglion cells, the cellular event
    that makes glaucomatous damage irreversible and therefore the reason WMS
    management is pre-emptive rather than reactive.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "glaucoma, which can lead to blindness"
    explanation: >-
      GeneReviews documents progression to blindness; the retinal ganglion cell
      apoptosis step itself is supplied by the conserved glaucoma module rather
      than by WMS-specific data, hence PARTIAL.
  downstream:
  - target: Progressive Glaucomatous Optic Neuropathy and Vision Loss
    description: >-
      Ganglion cell loss manifests as optic nerve degeneration and progressive
      visual field loss.
- name: Progressive Glaucomatous Optic Neuropathy and Vision Loss
  biological_scale: ORGANISM
  conforms_to: "glaucoma_optic_neuropathy#Progressive Glaucomatous Optic Neuropathy"
  description: >-
    Optic nerve degeneration progressing to blindness if the lens problem is not
    corrected early. This endpoint is why the management priority is early lens
    removal rather than pressure-lowering drops.
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "glaucoma, which can lead to blindness"
    explanation: >-
      Establishes progression to blindness as the ocular endpoint of untreated
      WMS glaucoma.
- name: Acromelic Growth Restriction and Joint Stiffness
  biological_scale: ORGANISM
  description: >-
    The systemic arm of the phenotype: proportionate short stature, brachydactyly
    and progressive joint limitation, placing WMS among the acromelic dysplasias.
    In the ADAMTS10 mouse this maps onto shorter long bones with disorganized

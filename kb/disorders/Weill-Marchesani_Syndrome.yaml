- name: Acromelic Long-Bone Growth Restriction
  biological_scale: ORGANISM
  description: >-
    Proportionate short stature and brachydactyly place WMS among the acromelic
    dysplasias. Adamts10 and Adamts17 mouse models map this outcome to shorter

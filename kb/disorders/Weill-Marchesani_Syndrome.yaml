    snippet: "The diagnosis WMS is established in a proband with characteristic clinical features."
    explanation: >-
      GeneReviews states that the diagnosis rests on characteristic clinical
      features.
  - reference: PMID:37734846
    reference_title: "Weill-Marchesani syndrome: natural history and genotype-phenotype correlations from 18 news cases and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apart from the ophthalmological findings, which are mandatory for the diagnosis, the phenotype of WMS seems to be more variable than initially described"
    explanation: >-
      Establishes the ocular findings as the obligate diagnostic anchor and warns
      that the systemic phenotype is variable.
- name: Anterior-segment eye examination and ocular biometry
  description: >-
    Detailed ophthalmic assessment should evaluate lens shape and thickness,
    refraction, axial length, lens position, anterior-chamber angle and
    intraocular pressure. In children, progressive lens-induced myopia with a
    normal axial length can be an early clue before the full systemic phenotype
    is recognized.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: >-
    Microspherophakia or progressive lens thickening, lenticular myopia, ectopia
    lentis or iridodonesis, angle narrowing and/or elevated intraocular pressure.
  evidence:
  - reference: PMID:36698805
    reference_title: "Abnormal lens thickening in a child with Weill-Marchesani syndrome 4: A 3-year follow-up case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive clinical examinations and genetic testing may improve diagnosis, which allows early therapeutic interventions for complications and better visual outcomes for the patient."
    explanation: >-
      The longitudinal WMS4 report demonstrates how multimodal ocular biometry
      can distinguish progressive lens-induced myopia from ordinary axial myopia.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular problems, typically recognized in childhood, include microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens, ectopia lentis (abnormal position of the lens), and glaucoma, which can lead to blindness."
    explanation: >-
      Defines the childhood ocular abnormalities the examination is intended to
      detect.
- name: Molecular genetic testing
  description: >-
    Molecular testing confirms the diagnosis when clinical features are
    inconclusive, and is the only way to assign inheritance mode, since the
    recessive and dominant forms cannot be told apart clinically.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:

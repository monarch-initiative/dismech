phenotypes:
- category: Cardiovascular
  name: Prolonged QTc Interval
  diagnostic: true
  description: >-
    QTc prolongation is the defining ECG sign, but penetrance is incomplete: a
    substantial share of LQT1 carriers have a QTc in the normal range. In a
    French referral cohort, the mean QTc in heterozygous LQT1 carriers of
    non-JLNS variants was 467 ms.
  phenotype_term:
    preferred_term: prolonged QTc interval
    term:
      id: HP:0005184
      label: Prolonged QTc interval
  evidence:
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mean QTc was 551 ± 54 ms for JLNS, 441 ± 32 ms for HTZ-JLNS, and 467
      ± 36 ms for HTZ-Non-JLNS
    explanation: Mean QTc values in heterozygous KCNQ1 carriers versus JLNS.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      among LQT1 carriers many (37%) are silent mutation carriers and that the
      majority of LQT1 patients goes through life without ever suffering
      cardiac events
    explanation: >-
      Records incomplete penetrance, which is why no frequency is assigned to
      QTc prolongation.
- category: Cardiovascular
  name: Abnormal T-Wave
  diagnostic: true
  description: >-
    T-wave morphology is abnormal and differs characteristically between LQTS
    genotypes.
  phenotype_term:
    preferred_term: abnormal T-wave
    term:
      id: HP:0005135
      label: Abnormal T-wave
  evidence:
  - reference: PMID:9272508
    reference_title: "Clinical management of patients with the long QT syndrome: drugs, devices, and gene-specific therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Distinctive ECG-T wave phenotypes are associated with each of the three genotypes.
    explanation: LQT1 is one of the three genotypes with a distinctive T-wave phenotype.
- category: Cardiovascular
  name: Abnormal Cardiac Exercise Stress Test
  diagnostic: true
  description: >-
    The QTc fails to shorten appropriately during exercise, an LQT1-specific
    finding used in diagnosis.
  phenotype_term:
    preferred_term: failure of QTc shortening on exercise testing
    term:
      id: HP:0500018
      label: Abnormal cardiac exercise stress test
  evidence:
  - reference: PMID:39027806
    reference_title: "Management of Long QT Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In LQT1, the loss-of-function mutation in KCNQ1 affects the slowly
      activating delayed rectifier potassium current (IKs current), preventing
      the corrected QT interval from appropriately shortening during exercise,
      aiding in the diagnosis.
    explanation: The exercise QTc response is abnormal in LQT1 and aids diagnosis.
- category: Cardiovascular
  name: Torsade de Pointes
  description: >-
    Polymorphic ventricular tachycardia, the arrhythmia behind syncope and
    sudden death in LQT1.
  phenotype_term:
    preferred_term: torsade de pointes
    term:
      id: HP:0001664
      label: Torsade de pointes
  evidence:
  - reference: PMID:10348966
    reference_title: "The inherited long QT syndrome: from ion channel to bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The delayed recovery predisposes individuals to the development of early
      afterdepolarizations and initiation of torsade de pointes arrhythmias.
    explanation: Torsade de pointes is the arrhythmia of inherited LQTS.
- category: Cardiovascular
  name: Ventricular Fibrillation
  description: >-
    Torsade de pointes that does not self-terminate can degenerate into
    ventricular fibrillation.
  phenotype_term:
    preferred_term: ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:10348966
    reference_title: "The inherited long QT syndrome: from ion channel to bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with self-terminating torsade have syncope, whereas those whose
      torsade degenerates to ventricular fibrillation experience sudden death.
    explanation: Ventricular fibrillation as the degeneration of torsade.
- category: Cardiovascular
  name: Syncope
  description: >-
    Syncope from self-terminating torsade, in LQT1 typically during exercise or
    other sympathetic activation.
  phenotype_term:
    preferred_term: syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:11136691
    reference_title: "Genotype-phenotype correlation in the long-QT syndrome: gene-specific triggers for life-threatening arrhythmias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 670 LQTS patients of known genotype (LQT1, n=371; LQT2,
      n=234; LQT3, n=65) who had symptoms (syncope, cardiac arrest, sudden
      death)
    explanation: Syncope is among the symptomatic events recorded in 371 LQT1 patients.
- category: Cardiovascular
  name: Cardiac Arrest
  description: >-
    Resuscitated or fatal cardiac arrest from sustained polymorphic ventricular
    arrhythmia.
  phenotype_term:
    preferred_term: cardiac arrest
    term:
      id: HP:0001695
      label: Cardiac arrest
  evidence:
  - reference: PMID:24552659
    reference_title: "Phenotype, origin and estimated prevalence of a common long QT syndrome mutation: a clinical, genealogical and molecular genetics study including Swedish R518X/KCNQ1 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical phenotype ranged from expectedly severe in JLNS to surprisingly
      benign in LQTS (QTc 576 ± 61 ms vs. 462 ± 34 ms, cumulative incidence of
      (aborted) cardiac arrest 47% vs. 1%, annual non-medicated incidence rate
      (aborted) cardiac arrest 4% vs. 0.04%).
    explanation: >-
      Records cardiac arrest in heterozygous KCNQ1 R518X carriers, at a much
      lower rate than in JLNS.
- category: Cardiovascular
  name: Sudden Cardiac Death
  description: >-
    Sudden cardiac death from torsade degenerating to ventricular fibrillation.
    Annual risk in LQT1 is low compared with JLNS.
  phenotype_term:
    preferred_term: sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The risk of sudden cardiac death is much lower, ranging from 1.3 to 0.05% per year.
    explanation: Annual sudden cardiac death risk in LQT1 relative to JLNS.
genetic:
- name: KCNQ1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  association: Causative
  notes: >-
    Encodes the Kv7.1 alpha subunit of the IKs channel. The cached ClinGen
    gene-disease validity assertion (Definitive, AD) is for MONDO:0002442 long
    QT syndrome, not for this entry's MONDO:0100316, so it is cited as evidence
    and not recorded in gene_disease_validity.
  evidence:
  - reference: PMID:20660394
    reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In long-QT syndrome type 1, mutations occur in the KCNQ1 gene, which
      encodes the repolarizing potassium channel mediating the delayed rectifier
      I(Ks) current.
    explanation: Names KCNQ1 as the LQT1 gene and IKs as its current.
  - reference: CGGV:assertion_dff8874e-98a1-472b-9cc2-3f441b1c1064-2018-09-25T040000.000Z
    reference_title: "KCNQ1 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KCNQ1 | HGNC:6294 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      ClinGen grades KCNQ1 definitive for autosomal dominant long QT syndrome
      (the broader MONDO:0002442 concept).
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Only 3 of 17 genes, KCNQ1, KCNH2, and SCN5A, were classified as having
      definitive evidence as a genetic cause for typical LQTS.
    explanation: The ClinGen reappraisal grades KCNQ1 definitive for typical LQTS.
  - reference: ORPHA:101016
    reference_title: "Romano-Ward syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KCNQ1 | potassium voltage-gated channel subfamily Q member 1 | hgnc:6294 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet records KCNQ1 loss-of-function germline variants as causal for Romano-Ward syndrome.
  variants:
  - name: KCNQ1 A341V
    type: missense
    description: >-
      Recurrent transmembrane missense founder allele, prominent in South
      African families. Its mild dominant-negative effect does not explain its
      unusually severe clinical phenotype, an example of mutation-specific risk.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        KCNQ1-A341V has a mild dominant-negative effect (the current loss barely
        exceeds 50%) its striking clinically severe phenotype is explained
        neither by the location (transmembrane) nor by the functionally
        consequence of the mutation (dominant-negative).
      explanation: Mutation-specific severity of A341V.
  - name: KCNQ1 R518X
    type: nonsense
    description: >-
      Swedish founder allele that causes recessive JLNS when biallelic and
      dominant LQTS with a mild phenotype when heterozygous.
    evidence:
    - reference: PMID:24552659
      reference_title: "Phenotype, origin and estimated prevalence of a common long QT syndrome mutation: a clinical, genealogical and molecular genetics study including Swedish R518X/KCNQ1 families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        R518X/KCNQ1 occurs as a common founder mutation in Sweden and is
        associated with an unexpectedly benign phenotype in heterozygous
        carriers.
      explanation: Heterozygous R518X causes a mild LQT1 phenotype.
  - name: KCNQ1 R190Q
    type: missense
    description: >-
      Missense allele with a dominant-negative trafficking defect, modelled in
      patient-derived cardiomyocytes.
    evidence:
    - reference: PMID:20660394
      reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Further characterization of the role of the R190Q-KCNQ1 mutation in the
        pathogenesis of long-QT syndrome type 1 revealed a dominant negative
        trafficking defect associated with a 70 to 80% reduction in I(Ks) current
        and altered channel activation and deactivation properties.
      explanation: Dominant-negative trafficking defect of R190Q.
- name: NOS1AP
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NOS1AP
    term:
      id: hgnc:16859
      label: NOS1AP
  notes: >-
    Common NOS1AP variants first found to affect QTc in the general population.
    The modifier effect was shown in one South African population carrying the
    KCNQ1 A341V founder allele (205 mutation carriers); the authors call for
    validation in other LQTS populations. No external gene-disease validity
    classification exists for this pair.
  evidence:
  - reference: PMID:19822806
    reference_title: NOS1AP is a genetic modifier of the long-QT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NOS1AP variants were significantly associated with the occurrence of
      symptoms (rs4657139, P=0.019; rs16847548, P=0.003), with clinical
      severity, as manifested by a greater probability for cardiac arrest and
      sudden death (rs4657139, P=0.028; rs16847548, P=0.014)
    explanation: >-
      In a family-based association study of an LQT1 founder population
      (KCNQ1 A341V), NOS1AP variants modified symptom occurrence and the risk
      of cardiac arrest and sudden death.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    The usual mode: a single heterozygous KCNQ1 loss-of-function variant.
    Penetrance is incomplete, with many carriers having a normal QTc and no
    events.
  evidence:
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type 1 1ong QT syndrome represents the most common form (45%) of
      genotyped long QT syndrome (LQTS) cases, following an autosomal dominant
      transmission pattern.
    explanation: LQT1 follows autosomal dominant transmission.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      among LQT1 carriers many (37%) are silent mutation carriers and that the
      majority of LQT1 patients goes through life without ever suffering
      cardiac events
    explanation: Supports incomplete penetrance.
- name: Autosomal recessive (without deafness)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Rare. Some biallelic KCNQ1 genotypes retain enough function for the inner
    ear and cause isolated recessive LQT1 without hearing loss, with
    heterozygous relatives unaffected. Biallelic loss with deafness is JLNS1,
    curated separately.
  evidence:
  - reference: PMID:33498651
    reference_title: "Molecular Mechanism of Autosomal Recessive Long QT-Syndrome 1 without Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified a homozygous KCNQ1 mutation, c.1892_1893insC
      (p.P631fs*20), in a patient with an isolated LQT syndrome (LQTS) without
      hearing loss. Nevertheless, the inheritance trait is autosomal recessive,
      with heterozygous family members being asymptomatic.
    explanation: Documents recessive LQT1 without deafness.
environmental:
- name: Physical exercise
  description: >-
    Exertion is the main trigger of arrhythmic events in LQT1, acting through
    the sympathetic activation that unmasks the IKs deficit.
  exposure_term:
    preferred_term: physical exercise
    term:
      id: ECTO:6000002
      label: exposure to exercise
  evidence:
  - reference: PMID:11136691
    reference_title: "Genotype-phenotype correlation in the long-QT syndrome: gene-specific triggers for life-threatening arrhythmias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LQT1 patients experienced the majority of their events (62%) during
      exercise, and only 3% occurred during rest/sleep.
    explanation: Most LQT1 events occur during exercise.
  influences_mechanisms:
  - target: Sympathetic Activation Trigger
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exercise raises sympathetic tone and heart rate, the setting in which
      LQT1 events cluster.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        LQT1 patients are at higher risk during sympathetic activation, such as
        during exercise and emotions.
      explanation: Places exercise among the sympathetic triggers of LQT1 events.
treatments:
- name: Beta-Blocker Therapy
  description: >-
    First-line therapy. Non-selective beta-blockers (nadolol, propranolol) are
    preferred. LQT1 has the best response of the common genotypes, consistent
    with its adrenergic trigger profile.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nadolol
      term:
        id: CHEBI:7444
        label: nadolol
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
  target_mechanisms:
  - target: Sympathetic Activation Trigger
    treatment_effect: INHIBITS
    description: >-
      Beta-blockade blunts the adrenergic trigger that unmasks the IKs deficit.
    evidence:
    - reference: PMID:38790576
      reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Among different LQTS subtypes, LQTS1 patients showed the highest
        response rate, with the lowest rate of cardiac events, probably related
        to the antiadrenergic effect of β-blockers on trigger stimuli
      explanation: Attributes the strong LQT1 response to blockade of adrenergic triggers.
  - target: Early Afterdepolarizations
    treatment_effect: INHIBITS
    description: >-
      In LQT1 patient cardiomyocytes, beta-blockade reduced catecholamine-induced
      arrhythmia.
    evidence:
    - reference: PMID:20660394
      reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        myocytes derived from patients with long-QT syndrome type 1 had an
        increased susceptibility to catecholamine-induced tachyarrhythmia and
        that beta-blockade attenuated this phenotype
      explanation: >-
        Beta-blockade attenuated catecholamine-induced tachyarrhythmia in LQT1
        cardiomyocytes.
  evidence:
  - reference: PMID:11136691
    reference_title: "Genotype-phenotype correlation in the long-QT syndrome: gene-specific triggers for life-threatening arrhythmias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percent of patients who were free of recurrence with ss-blocker
      therapy was higher and the death rate was lower among LQT1 patients (81%
      and 4%, respectively) than among LQT2 (59% and 4%, respectively) and LQT3
      (50% and 17%, respectively) patients.
    explanation: LQT1 patients respond better to beta-blockers than LQT2 or LQT3.
  - reference: PMID:15367556
    reference_title: "Association of long QT syndrome loci and cardiac events among patients treated with beta-blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac events among patients receiving beta-blocker therapy occurred in
      19 of 187 (10%) LQT1 patients, 27 of 120 (23%) LQT2 patients, and 9 of 28
      (32%) LQT3 patients (P<.001).
    explanation: >-
      In a genotyped Italian cohort treated for about 5 years, LQT1 patients had
      the lowest breakthrough event rate on beta-blockers, though 10% still had
      events.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is clear evidence that β-blockers are extremely effective in LQT1
      patients.
    explanation: Review statement of beta-blocker efficacy in LQT1.
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Non-selective ß-blockers, such as nadolol and propranolol, represent the
      most effective drugs (class IB recommendation)
    explanation: Supports nadolol and propranolol as the preferred agents.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical anti-adrenergic therapy for patients with recurrent syncope despite
    full-dose beta-blockade, or with ICD shocks; recommended as a
    genotype-tailored option for LQT1.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Sympathetic Activation Trigger
    treatment_effect: INHIBITS
    description: >-
      Removing left cardiac sympathetic input reduces the adrenergic trigger;
      in an LQTS-wide series it also shortened the QTc.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        LCSD was associated with a mean QTc shortening of 39 ms, pointing to an
        action on the substrate as well as on the trigger.
      explanation: >-
        LQTS-wide series (not LQT1-specific) showing LCSD acts on the
        adrenergic trigger and the substrate.
  evidence:
  - reference: PMID:39027806
    reference_title: "Management of Long QT Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment strategies tailored to specific genotypes, such as adding
      mexiletine for LQT3 and left cardiac sympathetic denervation (LCSD) for
      LQT1, are advised to align with genotype-phenotype correlations
    explanation: LCSD is the genotype-tailored escalation for LQT1.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the patient has one more syncope despite a full dose β-blockade, left
      cardiac sympathetic denervation (LCSD) should be performed without
      hesitation
    explanation: Indication for LCSD after breakthrough syncope on beta-blockers.
- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Secondary prevention after cardiac arrest, and for patients who remain
    symptomatic despite beta-blockers and genotype-specific therapy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Sudden Cardiac Death
    treatment_effect: INHIBITS
    description: >-
      The device terminates ventricular fibrillation before it becomes fatal.
  evidence:
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ICD implantation is recommended as secondary prophylaxis, in addition to
      β-blockers, in patients with a diagnosis of LQTS who have experienced a
      cardiac arrest (class IB recommendation)
    explanation: LQTS-wide indication for ICD, applicable to LQT1.
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ICD implantation is also recommended in patients with LQTS who are
      symptomatic despite receiving β-blockers and genotype-specific therapies
    explanation: ICD for patients refractory to medical therapy.
- name: QT-Prolonging Drug and Trigger Avoidance
  description: >-
    Avoid QT-prolonging drugs, correct electrolyte disturbances, and avoid
    strenuous exercise and genotype-specific triggers, which in LQT1 means
    exertion and swimming. A 2025 AHA/ACC scientific statement allows
    competitive swimming and diving with precautions in athletes with LQT1.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: risk-factor and trigger-avoidance counseling
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Sympathetic Activation Trigger
    treatment_effect: INHIBITS
    description: >-
      Avoiding strenuous exercise and genotype-specific triggers reduces
      exposure to the adrenergic trigger.
    evidence:
    - reference: PMID:38790576
      reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To avoid strenuous exercise and genotype-specific triggers for
        arrhythmias
      explanation: Recommendation to avoid genotype-specific triggers.
  evidence:
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To avoid QT-prolonging drugs (a list is available on www.qtdrugs.org or
      www.crediblemeds.org, accessed on 1 March 2024) (class IC recommendation)
    explanation: QT-prolonging drug avoidance in all LQTS, including LQT1.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Swimming is particularly dangerous, as 99% of the arrhythmic episodes
      associated with swimming occur in LQT1 patients
    explanation: The basis for counselling LQT1 patients specifically about swimming.
  - reference: PMID:39976316
    reference_title: "Clinical Considerations for Competitive Sports Participation for Athletes With Cardiovascular Abnormalities: A Scientific Statement From the American Heart Association and American College of Cardiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In competitive athletes with LQTS (including LQT1), competitive swimming
      and diving can be considered with appropriate precautions.
    explanation: >-
      The current statement relaxes the blanket restriction to participation
      with precautions.
- name: KCNQ1 Suppression-and-Replacement Gene Therapy
  description: >-
    Investigational, preclinical. A single construct carries a KCNQ1 short
    hairpin RNA that suppresses both endogenous alleles regardless of variant,
    and an shRNA-immune wild-type KCNQ1 cDNA that replaces them. Tested in LQT1
    patient iPSC-derived cardiomyocytes, not in patients.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Reduced Cardiac IKs Repolarization Reserve
    treatment_effect: RESTORES
    description: >-
      Replacing mutant with wild-type KCNQ1 restores the channel and shortens
      the action potential to control values.
    evidence:
    - reference: PMID:33504163
      reference_title: "Suppression-Replacement KCNQ1 Gene Therapy for Type 1 Long QT Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        treatment with KCNQ1-SupRep resulted in shortening of the pathologically
        prolonged APD at both 90% and 50% repolarization, resulting in APD values
        similar to those of the 2 isogenic controls
      explanation: Restores action potential duration in LQT1 cardiomyocytes.
  evidence:
  - reference: PMID:33504163
    reference_title: "Suppression-Replacement KCNQ1 Gene Therapy for Type 1 Long QT Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In LQT1 iPSC-CMs, KCNQ1-SupRep gene therapy shortened the APD, thereby
      eliminating the pathognomonic feature of LQT1.
    explanation: Proof-of-principle gene therapy in LQT1 patient cells.
diagnosis:
- name: Exercise Cardiac Stress Testing
  description: >-
    Exercise testing shows failure of the QTc to shorten during exercise, which
    supports an LQT1 diagnosis.
  diagnosis_term:
    preferred_term: Exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: PMID:39027806
    reference_title: "Management of Long QT Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In LQT1, the loss-of-function mutation in KCNQ1 affects the slowly
      activating delayed rectifier potassium current (IKs current), preventing
      the corrected QT interval from appropriately shortening during exercise,
      aiding in the diagnosis.
    explanation: Exercise QTc response aids LQT1 diagnosis.
- name: KCNQ1 Molecular Genetic Testing
  description: >-
    Identification of a heterozygous pathogenic KCNQ1 variant confirms LQT1 and
    enables cascade testing of relatives. Variant class and location also inform
    risk.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: molecular screening is now part of the diagnostic process.
    explanation: Genetic testing is part of LQTS diagnosis.
experimental_models:
- name: LQT1 patient-derived hiPSC cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cell lines from LQT1 patients carrying
    heterozygous KCNQ1 variants (including R190Q and M437V), differentiated to
    cardiomyocytes and studied by patch clamp. They reproduce the reduced IKs,
    prolonged action potential, and catecholamine sensitivity of LQT1.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: hiPSC-derived cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  publication: PMID:20660394
  modeled_mechanisms:
  - target: Reduced Cardiac IKs Repolarization Reserve
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient cardiomyocytes show the reduced IKs and the resulting prolonged
      action potential.
    evidence:
    - reference: PMID:20660394
      reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The patient-derived cells recapitulated the electrophysiological
        features of the disorder.
      explanation: The model recapitulates LQT1 electrophysiology.
  - target: Inadequate Action Potential Shortening Under Beta-Adrenergic Stimulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Under isoproterenol, LQT1 cardiomyocytes lengthen rather than shorten
      their action potentials.
    evidence:
    - reference: PMID:31245483
      reference_title: "Electrophysiological properties of iPS cell-derived cardiomyocytes from a patient with long QT syndrome type 1 harboring the novel mutation M437V of KCNQ1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Isoproterenol significantly prolonged APDs of LQT1 cardiomyocytes, while
        shortening those of healthy ones.
      explanation: The model reproduces the abnormal adrenergic response.
animal_models:
- name: Transgenic LQT1 rabbit (KCNQ1 Y315S pore mutant)
  species: Rabbit
  genotype: Transgenic expression of human KCNQ1 (KvLQT1) Y315S pore mutant in the heart
  publication: PMID:18464931
  description: >-
    Rabbits expressing a dominant-negative human KCNQ1 pore mutant in the heart
    lack IKs in ventricular cardiomyocytes and have prolonged QT intervals and
    action potentials.
  evidence:
  - reference: PMID:18464931
    reference_title: Mechanisms of cardiac arrhythmias and sudden death in transgenic rabbits with long QT syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of pore mutants of the human genes KCNQ1 (KvLQT1-Y315S) and
      KCNH2 (HERG-G628S) in the rabbit heart produced transgenic rabbits with a
      long QT phenotype.
    explanation: The KCNQ1 Y315S transgene produces a long QT phenotype in rabbits.
  modeled_mechanisms:
  - target: Reduced Cardiac IKs Repolarization Reserve
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      IKs is eliminated in cardiomyocytes of the LQT1 rabbit.
    limitations: >-
      A transgenic dominant-negative pore mutant overexpressed in the heart,
      not a heterozygous germline allele at the native locus. The transgene
      also downregulated the remaining IKr current, which is not a recognized
      feature of human LQT1.
    evidence:
    - reference: PMID:18464931
      reference_title: Mechanisms of cardiac arrhythmias and sudden death in transgenic rabbits with long QT syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Prolongations of QT intervals and action potential durations were due
        to the elimination of IKs and IKr currents in cardiomyocytes.
      explanation: The LQT1 rabbit loses IKs in cardiomyocytes.
  - target: Prolonged Ventricular Action Potential Duration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Action potentials and QT intervals are prolonged.
    limitations: >-
      The abstract reports spontaneous sudden death from polymorphic
      ventricular tachycardia only for the LQT2 rabbit, so the model is not
      linked here to the torsade or sudden-death nodes.
    evidence:
    - reference: PMID:18464931
      reference_title: Mechanisms of cardiac arrhythmias and sudden death in transgenic rabbits with long QT syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Prolongations of QT intervals and action potential durations were due
        to the elimination of IKs and IKr currents in cardiomyocytes.
      explanation: Prolonged action potentials and QT intervals in the transgenic rabbits.

notes: >-
  Scope. This entry covers KCNQ1-caused long QT syndrome, MONDO:0100316. It is
  the LQT1 row ("Type 1") of the familial long QT syndrome umbrella entry
  (Familial Long QT Syndrome, MONDO:0019171), which keeps the cross-genotype
  material. Biallelic KCNQ1 disease with congenital deafness is Jervell and
  Lange-Nielsen syndrome 1 (MONDO:0024540), curated separately.

  Allelic relationship with JLNS1. The two disorders share one gene and one
  current. Heterozygous KCNQ1 pathogenic variants cause LQT1, while homozygous
  or compound heterozygous variants cause JLNS1 (PMID:38825991,
  PMID:18606002). Some alleles cause both: R518X is a recessive JLNS allele and
  a dominant LQTS allele with a mild heterozygous phenotype in Swedish founder
  families (PMID:24552659). In a French referral cohort of 789 KCNQ1 carriers,
  heterozygous carriers of JLNS-associated variants made up 22% of
  heterozygous carriers and had a lower risk of cardiac events than other LQT1
  patients (hazard ratio 0.34; PMID:38825991). A rare autosomal recessive LQT1
  without deafness also exists, where heterozygous relatives are unaffected
  (PMID:33498651); it is recorded below as a second inheritance block.

  Gene-disease validity. The cached ClinGen record for KCNQ1
  (CGGV:assertion_dff8874e-98a1-472b-9cc2-3f441b1c1064-2018-09-25T040000.000Z,
  Definitive, autosomal dominant) is curated against MONDO:0002442 "long QT
  syndrome", not against MONDO:0100316. It is therefore cited as evidence on
  the KCNQ1 genetic record but not copied into `gene_disease_validity`, which
  requires an assertion for this entry's own disease term. The 2020 ClinGen
  reappraisal of LQTS genes (PMID:31983240) likewise grades KCNQ1 definitive
  for typical LQTS.

  Orphanet. Orphanet has no LQT1-specific record; ORPHA:101016 (Romano-Ward
  syndrome) lists KCNQ1 with a loss-of-function association and cross-references
  OMIM:192500 (LQT1) as an exact match. The Orphanet phenotype frequency table is
  for Romano-Ward syndrome across all genes, so it is not used for LQT1
  frequencies here.

  T-wave morphology. Genotype-characteristic T-wave patterns are recorded from
  sources that state they exist for each genotype (PMID:10348966,
  PMID:9272508). The cached literature does not describe the LQT1-specific
  broad-based T wave, so that pattern is not asserted.

  GeneReviews. The relevant chapter is the Long QT Syndrome Overview
  (PMID:20301308). Its cached record is an abstract that lists the chapter's
  aims only, so it is tagged in `references:` but not quoted.

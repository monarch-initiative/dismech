pathophysiology:
- name: Heterozygous KCNQ1 Loss-of-Function Variant
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
  description: >-
    A heterozygous germline loss-of-function variant in KCNQ1 reduces the
    function of the Kv7.1 channel, the alpha subunit of the IKs channel complex.
    Two broad mechanisms are recognized. Truncating, frameshift, and splice
    variants are generally modelled as haploinsufficient, with at most about
    half the channel function lost. Missense variants and in-frame deletions
    are generally modelled as dominant negative, where the mutant subunit
    co-assembles with and impairs wild-type subunits, for example by a
    trafficking defect. Variant class and location (pore, transmembrane,
    C-terminal) modify arrhythmic risk.
  genes:
  - preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  molecular_functions:
  - preferred_term: delayed rectifier potassium channel activity
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: >-
      missense or in-frame (often dominant negative); nonsense, frameshift, or
      splice-site (often haploinsufficient)
  evidence:
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous KCNQ1 pathogenic variants are instead associated to type 1
      long QT syndrome (LQT1).
    explanation: Places the heterozygous KCNQ1 variant at the origin of LQT1.
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LQTS1: loss-of-function variants in the potassium channel gene KCNQ1
      (encoding for the α-subunit of the K+ channel Kv7.1, conducting the
      depolarizing IKs current), leading to a reduction in the amplitude of the
      slow delayed rectifier current IKs
    explanation: >-
      Review statement that LQT1 variants are loss of function in the Kv7.1
      alpha subunit and reduce IKs.
  - reference: PMID:20660394
    reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further characterization of the role of the R190Q-KCNQ1 mutation in the
      pathogenesis of long-QT syndrome type 1 revealed a dominant negative
      trafficking defect associated with a 70 to 80% reduction in I(Ks) current
      and altered channel activation and deactivation properties.
    explanation: >-
      Patient-derived cardiomyocytes show the dominant-negative trafficking
      mechanism for an LQT1 missense allele.
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we assumed haploinsufficiency (HI), with a ≤50% impairment of the channel
      function, for non-missense mutations including truncating mutations,
      frameshift mutations, and splicing mutations. Conversely, missense
      mutations and in-frame deletions were a priori considered as inducing a
      dominant negative (DN) effect characterized by a >50% impairment of the
      channel function.
    explanation: >-
      The working split between haploinsufficient and dominant-negative KCNQ1
      variant classes used in this LQT1 cohort.
  - reference: PMID:38825991
    reference_title: "Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four genetic parameters were independently associated with events: QTc,
      Jervell and Lange-Nielsen syndrome-related variants, haploinsufficiency,
      and pore/C-terminal localization.
    explanation: >-
      Variant mechanism (haploinsufficiency) and location independently modify
      arrhythmic risk among KCNQ1 carriers.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations located in the pore region of the protein are usually
      associated with a more severe clinical phenotype compared to mutation in
      the C-terminal region
    explanation: Gives the direction of the location effect, with pore variants more severe than C-terminal ones.
  - reference: PMID:17470695
    reference_title: "Clinical aspects of type-1 long-QT syndrome by location, coding type, and biophysical function of mutations involving the KCNQ1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with transmembrane versus C-terminus mutations (hazard ratio,
      2.06; P<0.001) and those with mutations having dominant-negative versus
      haploinsufficiency ion channel effects (hazard ratio, 2.26; P<0.001) were
      at increased risk for cardiac events
    explanation: >-
      In 600 LQT1 registry patients, transmembrane location and a
      dominant-negative effect each independently raised the risk of cardiac
      events.
  downstream:
  - target: Reduced Cardiac IKs Repolarization Reserve
    causal_link_type: DIRECT
    description: >-
      Loss of functional Kv7.1 subunits reduces the IKs current in ventricular
      cardiomyocytes.
    evidence:
    - reference: PMID:31245483
      reference_title: "Electrophysiological properties of iPS cell-derived cardiomyocytes from a patient with long QT syndrome type 1 harboring the novel mutation M437V of KCNQ1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When expressed in HEK293 and COS7 cells, the mutant KCNQ1 was normally
        expressed in the plasma membrane but generated smaller currents than the
        wild type.
      explanation: >-
        An LQT1 missense allele that traffics normally still reduces channel
        current, so the variant-to-current step does not require a trafficking
        defect.
- name: Reduced Cardiac IKs Repolarization Reserve
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling
  description: >-
    IKs, conducted by KCNQ1-KCNE1 channels at the ventricular cardiomyocyte
    surface membrane, acts as a repolarization reserve. Reduced IKs leaves less
    outward current to complete phase-3 repolarization, and in particular less
    extra current to call on when beta-adrenergic stimulation and faster heart
    rates demand a shorter action potential.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  - preferred_term: membrane repolarization during ventricular cardiac muscle cell action potential
    term:
      id: GO:0098915
      label: membrane repolarization during ventricular cardiac muscle cell action potential
    modifier: DECREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:35138621
    reference_title: "Physiological Functions, Biophysical Properties, and Regulation of KCNQ1 (K(V)7.1) Potassium Channels."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the heart, KCNQ1 α-subunits coassemble with KCNE1 β-subunits to form
      channels that conduct IKs, a very slowly activating delayed rectifier K+
      current.
    explanation: Identifies IKs as the KCNQ1-KCNE1 current that this node describes.
  - reference: PMID:8900283
    reference_title: "Coassembly of K(V)LQT1 and minK (IsK) proteins to form cardiac I(Ks) potassium channel."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, K(V)LQT1 is the subunit that coassembles with minK to form
      I(Ks) channels and I(Ks) dysfunction is a cause of cardiac arrhythmia.
    explanation: >-
      The heterologous-expression study that identified the KCNQ1 (KvLQT1)
      product as the IKs alpha subunit, together with minK (KCNE1).
  - reference: PMID:33963564
    reference_title: "Delayed KCNQ1/KCNE1 assembly on the cell surface helps I(Ks) fulfil its function as a repolarization reserve in the heart."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IKs functions as a 'repolarization reserve' in the heart by providing
      extra current for ventricular action potential shortening during
      β-adrenergic stimulation.
    explanation: Defines the repolarization-reserve role that is lost in LQT1.
  - reference: PMID:16001794
    reference_title: "[The genetic disorders responsible for sudden cardiac death]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Loss of function in the slow component of the delayed rectifier potassium
      current (I(Ks)) channels (KCNQ1, KCNE1)
    explanation: Review statement that inherited LQTS of this type is loss of IKs function.
  downstream:
  - target: Prolonged Ventricular Action Potential Duration
    causal_link_type: DIRECT
    description: >-
      Less IKs prolongs the ventricular action potential at baseline.
    evidence:
    - reference: PMID:31245483
      reference_title: "Electrophysiological properties of iPS cell-derived cardiomyocytes from a patient with long QT syndrome type 1 harboring the novel mutation M437V of KCNQ1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        LQT1 iPSC-derived cardiomyocytes exhibited prolongation of action
        potential duration (APD), which was due to a reduction of the
        KCNQ1-mediated current IKs
      explanation: >-
        Patient-derived cardiomyocytes attribute the prolonged action potential
        to reduced IKs, with other currents unchanged.
  - target: Inadequate Action Potential Shortening Under Beta-Adrenergic Stimulation
    causal_link_type: DIRECT
    description: >-
      Without enough IKs, the action potential and the QT interval cannot
      shorten appropriately when heart rate and sympathetic tone rise.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        LQT1 patients have an impaired ability to shorten their QT interval
        during heart rate increases because of the mutation-dependent
        impairment in IKs, the current essential for QT adaptation.
      explanation: Directly links impaired IKs to failed QT adaptation in LQT1.
    - reference: PMID:38790576
      reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        as a consequence, the QT interval does not shorten appropriately during
        tachycardia
      explanation: Review statement of the same consequence of reduced IKs in LQT1.
- name: Sympathetic Activation Trigger
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: cardiac_ion_channel_repolarization#Adrenergic and cAMP-Dependent Triggering
  description: >-
    In LQT1, arrhythmic events are provoked mostly by sympathetic activation,
    above all physical exercise and swimming, and also emotion. Events at rest
    or during sleep are uncommon, the reverse of the pattern in LQT2 and LQT3.
    The swimming association rests mostly on cases that were undiagnosed and
    untreated at the time; a 2025 AHA/ACC statement judges the evidence for
    swimming as a genotype-specific trigger limited.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: adenylate cyclase-activating adrenergic receptor signaling pathway
    term:
      id: GO:0071880
      label: adenylate cyclase-activating adrenergic receptor signaling pathway
    modifier: INCREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:11136691
    reference_title: "Genotype-phenotype correlation in the long-QT syndrome: gene-specific triggers for life-threatening arrhythmias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LQT1 patients experienced the majority of their events (62%) during
      exercise, and only 3% occurred during rest/sleep.
    explanation: >-
      In 371 genotyped symptomatic LQT1 patients, most events occurred during
      exercise and almost none at rest.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LQT1 patients are at higher risk during sympathetic activation, such as
      during exercise and emotions.
    explanation: Review statement of the LQT1 trigger profile.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Swimming is particularly dangerous, as 99% of the arrhythmic episodes
      associated with swimming occur in LQT1 patients
    explanation: Swimming-associated arrhythmic episodes are almost all in LQT1.
  - reference: PMID:39976316
    reference_title: "Clinical Considerations for Competitive Sports Participation for Athletes With Cardiovascular Abnormalities: A Scientific Statement From the American Heart Association and American College of Cardiology."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      There is limited evidence that swimming is a genotype-specific trigger
      for VA in patients with LQT1. Previous reported cases were mostly among
      those previously undiagnosed and untreated.
    explanation: >-
      A later scientific statement weighs the swimming association as weak and
      confounded by untreated disease. It cuts against the strength of the
      swimming-specific part of this node, not against the exercise trigger.
  downstream:
  - target: Inadequate Action Potential Shortening Under Beta-Adrenergic Stimulation
    causal_link_type: DIRECT
    description: >-
      Beta-adrenergic stimulation unmasks the IKs deficit: LQT1 cardiomyocytes
      fail to shorten, or even lengthen, their action potentials under
      catecholamines.
    evidence:
    - reference: PMID:31245483
      reference_title: "Electrophysiological properties of iPS cell-derived cardiomyocytes from a patient with long QT syndrome type 1 harboring the novel mutation M437V of KCNQ1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Isoproterenol significantly prolonged APDs of LQT1 cardiomyocytes, while
        shortening those of healthy ones.
      explanation: >-
        A beta-agonist lengthens rather than shortens the action potential in
        LQT1 cardiomyocytes.
- name: Inadequate Action Potential Shortening Under Beta-Adrenergic Stimulation
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    When sympathetic tone and heart rate rise, the normal response is a larger,
    faster-activating IKs that shortens the ventricular action potential. With
    reduced IKs the action potential and QT interval fail to shorten, which is
    why LQT1 events cluster during exertion and why the QT response to exercise
    is diagnostically informative.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: membrane repolarization during ventricular cardiac muscle cell action potential
    term:
      id: GO:0098915
      label: membrane repolarization during ventricular cardiac muscle cell action potential
    modifier: ABNORMAL
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:33963564
    reference_title: "Delayed KCNQ1/KCNE1 assembly on the cell surface helps I(Ks) fulfil its function as a repolarization reserve in the heart."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IKs responds to β-adrenergic stimulation by becoming larger (amplitude
      response) and activating faster (gating response)
    explanation: The adrenergic response of IKs that LQT1 lacks.
  downstream:
  - target: Early Afterdepolarizations
    causal_link_type: DIRECT
    description: >-
      Under beta-adrenergic stimulation, the IKs-deficient action potential is
      prone to early afterdepolarizations.
    evidence:
    - reference: PMID:31245483
      reference_title: "Electrophysiological properties of iPS cell-derived cardiomyocytes from a patient with long QT syndrome type 1 harboring the novel mutation M437V of KCNQ1."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        A mathematical model for IKs-reduced human ventricular myocytes
        reproduced APD prolongation and generation of early afterdepolarizations
        (EADs) under β-adrenergic stimulation.
      explanation: >-
        A ventricular myocyte model with reduced IKs generates EADs specifically
        under beta-adrenergic stimulation.
    - reference: PMID:20660394
      reference_title: "Patient-specific induced pluripotent stem-cell models for long-QT syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        myocytes derived from patients with long-QT syndrome type 1 had an
        increased susceptibility to catecholamine-induced tachyarrhythmia
      explanation: >-
        LQT1 patient cardiomyocytes become arrhythmic under catecholamines.
  - target: Abnormal Cardiac Exercise Stress Test
    causal_link_type: DIRECT
    description: >-
      Failure of the QTc to shorten during exercise is observable on exercise
      testing.
    evidence:
    - reference: PMID:39027806
      reference_title: "Management of Long QT Syndrome: A Systematic Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In LQT1, the loss-of-function mutation in KCNQ1 affects the slowly
        activating delayed rectifier potassium current (IKs current), preventing
        the corrected QT interval from appropriately shortening during exercise,
        aiding in the diagnosis.
      explanation: Links the IKs deficit to the abnormal QTc response on exercise.

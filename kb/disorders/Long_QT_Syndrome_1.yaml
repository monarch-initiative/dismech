name: Long QT Syndrome 1
creation_date: "2026-10-14T16:49:35Z"
category: Mendelian
description: >-
  Long QT syndrome 1 (LQT1) is the KCNQ1-related form of congenital long QT
  syndrome and the most common genotype among genotyped LQTS patients. KCNQ1
  encodes the pore-forming alpha subunit of the Kv7.1 potassium channel, which
  co-assembles with the KCNE1 beta subunit to conduct the slow delayed
  rectifier current (IKs). Heterozygous loss-of-function KCNQ1 variants, acting
  either by haploinsufficiency or by dominant-negative trafficking and gating
  defects, reduce IKs and with it the repolarization reserve that normally
  shortens the ventricular action potential when beta-adrenergic tone and heart
  rate rise. The result is QT prolongation that fails to adapt during exertion,
  early afterdepolarizations, and torsades de pointes that cause syncope,
  cardiac arrest, or sudden cardiac death. Arrhythmic events in LQT1 cluster
  during exercise and other sympathetic activation (swimming in particular),
  and LQT1 responds better to beta-blockade than the other common genotypes;
  left cardiac sympathetic denervation and implantable cardioverter-defibrillator
  therapy are reserved for breakthrough or high-risk cases. Penetrance is
  incomplete: a substantial share of carriers have a normal QTc and never have
  an event. Biallelic KCNQ1 loss of function instead causes the allelic,
  recessive cardioauditory Jervell and Lange-Nielsen syndrome 1, curated
  separately.
disease_term:
  preferred_term: long QT syndrome 1
  term:
    id: MONDO:0100316
    label: long QT syndrome 1
synonyms:

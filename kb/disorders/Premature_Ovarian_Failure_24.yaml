      We used whole exome sequencing (WES) in four Iranian families, validated
      variants via Sanger sequencing
    explanation: >-
      The Iranian family carrying a homozygous SYCP2L nonsense variant was
      likewise solved by whole-exome sequencing.
- name: Serum Follicle-Stimulating Hormone Measurement
  diagnosis_term:
    preferred_term: Follicle Stimulating Hormone Measurement
    term:
      id: NCIT:C74783
      label: Follicle Stimulating Hormone Measurement
  results: >-
    Elevated circulating FSH (>25 IU/L) in the hypergonadotropic range in the
    setting of >=4 months of amenorrhea or oligomenorrhea before age 40.
  description: >-
    Establishes hypergonadotropic hypogonadism and meets clinical diagnostic
    criteria for premature ovarian insufficiency.
  evidence:
  - reference: PMID:32303603
    reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were diagnosed with POI according to previously described
      criteria: oligomenorrhoea/amenorrhoea for at least 4 months, and an
      elevated FSH level >25 IU/L on two occasions >4 weeks apart.
    explanation: >-
      Defines the hypergonadotropic FSH threshold (>25 IU/L) used to diagnose
      POI in the SYCP2L discovery cohort.
  - reference: PMID:39652037
    reference_title: "Evidence-based guideline: Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Significant changes from the previous 2015 guideline include the
      recommendations that only one elevated FSH >25 IU is required for
      diagnosis of POI and guidance that AMH testing, repeat FSH measurement
      and/or AMH may be required where there is diagnostic uncertainty.
    explanation: >-
      Updated ESHRE/ASRM/IMS POI guideline diagnostic criterion for elevated
      FSH (>25 IU/L).

  variants:
  - name: p.Ser52Profs*7
    description: >-
      c.150_151del, homozygous in the proband of Chinese family P0001, born to
      first-cousin parents. The truncated protein was not detectable by
      western blot in transfected cells. The authors expect the transcript to
      undergo nonsense-mediated decay, and classify the variant as a complete
      loss of function.
    evidence:
    - reference: PMID:32303603
      reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        western blot analysis showed that expected size of the truncated
        protein (p.Ser52Profs*7; 57 amino acids) was not observed
      explanation: >-
        The frameshift product is unstable in transfected CHO cells.
  - name: p.Ile333Met
    description: >-
      c.999A>G, homozygous in the proband of Chinese family P0005, born to
      first-cousin parents. Isoleucine 333 is conserved from Xenopus to human.
      The mutant protein is stable but does not localize specifically to
      centromeres in transfected cells. MutationTaster called it a
      polymorphism, although the other prediction tools called it
      deleterious. The authors regard it as a partial loss of function.
    evidence:
    - reference: PMID:32303603
      reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        cells transfected with the frameshift variant construct displayed
        cytoplasmic mislocalisation, and those transfected with the missense
        variant construct were not specifically localised to the centromeres
      explanation: >-
        Both patient alleles lose centromere localization in transfected
        cells.
pathophysiology:
- name: SYCP2L Loss of Function
  description: >-
    The disease alleles remove SYCP2L or stop it reaching the centromere. In
    mouse oocytes, wild-type SYCP2L localizes to synaptonemal-complex lateral
    elements in late diplotene oocytes and binds centromeres in
    dictyate-arrested oocytes, and human SYCP2L likewise localizes to
    centromeres when expressed in somatic cells. Centromere association
    requires the C-terminal part of the protein, which truncating alleles lack,
    while the p.Ile333Met missense variant similarly fails to localize
    specifically to centromeres.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: oocyte
    term:

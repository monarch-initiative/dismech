  notes: >-
    Three affected probands from three unrelated families have been reported:
    two Chinese women from consanguineous families among 110 POI probands
    (PMID:32303603) and one Iranian proband among four amenorrhea families
    (PMID:38521400).
  evidence:
  - reference: PMID:32303603
    reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Herein, we performed whole-exome sequencing (WES) using samples from 110
      patients with POI and identified two SYCP2L variants in two individuals
      from two unrelated consanguineous families.
    explanation: >-
      Establishes the first two unrelated affected families out of a 110-woman
      POI exome cohort.
  - reference: PMID:38521400
    reference_title: "Diverse genetic causes of amenorrhea in an ethnically homogeneous cohort and an evolving approach to diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Despite ethnic homogeneity, WES revealed diverse genetic causes, including
      a novel homozygous nonsense variant in SYCP2L, impacting synaptonemal
      complex (SC) assembly, in the first family.
    explanation: >-
      Documents a third affected family carrying an independent homozygous
      nonsense SYCP2L allele.
notes: >-
  Scope: this entry covers the 46,XX ovarian phenotype of biallelic SYCP2L
  variants, matching MONDO:0970995 (OMIM:620840). Human evidence comes from
  three families: two in PMID:32303603, and one in PMID:38521400, whose
  abstract gives no variant nomenclature or individual clinical detail. SYCP2L
  is expressed in human testis as well as ovary, but no man homozygous for a
  disease allele has been studied. In mice, a full Sycp2l knockout reduces
  female fertility without causing sterility (PMID:26362258), so the mouse is
  milder than the human disease. A common intronic SNP in SYCP2L, rs2153157, is
  associated with age at natural menopause (PMID:19448621, PMID:26362258) and
  with AMH levels in IVF patients (PMID:37417852). That is a population-level
  trait association, separate from this recessive disease, and it is not
  recorded as a causal genetic record here. The P0005 proband had one pregnancy
  that ended at 39 days. With a single event, this is not recorded as a disease
  feature.

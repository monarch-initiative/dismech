name: Premature Ovarian Failure 24
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
synonyms:
- POF24
- SYCP2L-related primary ovarian insufficiency
- SYCP2L-related premature ovarian insufficiency
description: >-
  Premature ovarian failure 24 (POF24) is an autosomal recessive form of
  primary ovarian insufficiency caused by biallelic variants in SYCP2L
  (synaptonemal complex protein 2-like). SYCP2L is an oocyte-specific paralog
  of the synaptonemal-complex lateral-element protein SYCP2. It sits on the
  synaptonemal complex in late diplotene and stays at the centromeres of
  dictyate-arrested oocytes, the primordial-follicle reserve that persists
  until ovulation. Two homozygous alleles were reported in Chinese women from
  consanguineous families: the frameshift p.Ser52Profs*7 and the missense
  p.Ile333Met. A third family, from Iran, carried a homozygous nonsense
  variant. The frameshift carrier had small ovaries with no antral follicles
  and secondary amenorrhea at 30. The missense carrier had oligomenorrhea from
  her mid-twenties with some ovarian function left, which the authors
  attribute to partial loss of function. Both had high FSH and low AMH. In
  mice, loss of Sycp2l does not stop oocytes forming, but the primordial
  oocyte pool runs down faster with age, causing early reproductive aging and
  subfertility. No affected men have been reported.
disease_term:
  preferred_term: premature ovarian failure 24
  term:
    id: MONDO:0970995
    label: premature ovarian failure 24
parents:
- Primary Ovarian Insufficiency
- Meiotic Disorder
notes: >-
  Scope: this entry covers the 46,XX ovarian phenotype of biallelic SYCP2L
  variants, matching MONDO:0970995 (OMIM:620840). Human evidence comes from
  three families: two in PMID:32303603, and one in PMID:38521400, whose
  abstract gives no variant name or clinical detail (its full text is not
  cached). SYCP2L is expressed in human testis as well as ovary, but no man
  homozygous for a disease allele has been studied. In mice, a full Sycp2l
  knockout reduces female fertility without causing sterility
  (PMID:26362258), so the mouse is milder than the human disease. A common
  intronic SNP in SYCP2L, rs2153157, is associated with age at natural
  menopause (PMID:19448621, PMID:26362258) and with AMH levels in IVF patients
  (PMID:37417852). That is a population-level trait association, separate
  from this recessive disease, and it is not recorded as a causal genetic
  record here. The P0005 proband had one pregnancy that ended at 39 days. With
  a single event, this is not recorded as a disease feature. No GeneReviews
  chapter and no POF24-specific prevalence figure were found.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both probands are homozygous, and were born to first-cousin parents. Their
    parents and unaffected sisters are heterozygous carriers.
  evidence:
  - reference: PMID:32303603
    reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their parents and mothered sisters were carriers
    explanation: >-
      Heterozygous relatives are unaffected and homozygous probands are
      affected, in two consanguineous families.
genetic:
- name: SYCP2L
  gene_term:
    preferred_term: SYCP2L
    term:
      id: hgnc:21537
      label: SYCP2L
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Two homozygous variants are reported on NM_001040274: c.150_151del
    p.Ser52Profs*7 and c.999A>G p.Ile333Met (PMID:32303603). A third homozygous
    nonsense variant was found in an Iranian family (PMID:38521400). Its
    nomenclature is not in the cached abstract and is not recorded here. No
    other rare SYCP2L variant was found in the remaining 108 patients of the
    110-woman Chinese cohort.
  evidence:
  - reference: PMID:32303603
    reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two homozygous variants (NM_001040274: c.150_151del
      (p.Ser52Profs*7), c.999A>G (p.Ile333Met)) in SYCP2L in two patients,
      which had co-segregated with POI in these families.
    explanation: >-
      First report linking SYCP2L to POI, in two unrelated families.
  - reference: PMID:38521400
    reference_title: "Diverse genetic causes of amenorrhea in an ethnically homogeneous cohort and an evolving approach to diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES revealed diverse genetic causes, including a novel homozygous
      nonsense variant in SYCP2L, impacting synaptonemal complex (SC) assembly,
      in the first family.
    explanation: >-
      An independent family with a different homozygous SYCP2L allele. The
      clause about synaptonemal complex assembly is the authors' description
      of the gene's role. The abstract reports no assay of it, so it is not
      used as mechanism evidence.
  variants:
  - name: p.Ser52Profs*7
    description: >-
      c.150_151del, homozygous in the proband of Chinese family P0001, born to
      first-cousin parents. The truncated protein was not detectable by
      western blot in transfected cells. The authors expect the transcript to
      undergo nonsense-mediated decay, and classify the variant as a complete
      loss of function.
    evidence:
    - reference: PMID:32303603
      reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        western blot analysis showed that expected size of the truncated
        protein (p.Ser52Profs*7; 57 amino acids) was not observed
      explanation: >-
        The frameshift product is unstable in transfected CHO cells.
  - name: p.Ile333Met
    description: >-
      c.999A>G, homozygous in the proband of Chinese family P0005, born to
      first-cousin parents. Isoleucine 333 is conserved from Xenopus to human.
      The mutant protein is stable but does not localize specifically to
      centromeres in transfected cells. MutationTaster called it a
      polymorphism, although the other prediction tools called it
      deleterious. The authors regard it as a partial loss of function.
    evidence:
    - reference: PMID:32303603
      reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        cells transfected with the frameshift variant construct displayed
        cytoplasmic mislocalisation, and those transfected with the missense
        variant construct were not specifically localised to the centromeres
      explanation: >-
        Both patient alleles lose centromere localization in transfected
        cells.
pathophysiology:
- name: SYCP2L Loss of Function
  description: >-
    The disease alleles remove SYCP2L or stop it reaching the centromere.
    Wild-type SYCP2L localizes to centromeres, both in dictyate oocytes and
    when expressed in somatic cells. This localization needs the C-terminal
    part of the protein, which the truncating alleles lack.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SYCP2L
    term:
      id: hgnc:21537
      label: SYCP2L
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  notes: >-
    GO records only cellular-component annotations for SYCP2L (centromeric
    region of a condensed chromosome, lateral element), and no molecular
    function, so none is bound here. The frameshift allele is a complete loss
    of function. The authors call the missense allele partial, which is
    recorded on the variant rather than here.
  evidence:
  - reference: PMID:32303603
    reference_title: "Homozygous variants in SYCP2L cause premature ovarian insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in vitro functional analysis showed that mutant SYCP2L proteins
      exhibited mislocalisation and loss of function
    explanation: >-
      Both patient alleles impair SYCP2L in transfected cells.
  - reference: PMID:26362258
    reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Centromere localization of SYCP2L requires its C-terminal portion, which
      is missing in truncated variants resulting from low-frequency nonsense
      mutations identified in humans.
    explanation: >-
      Normal function: the C-terminus targets SYCP2L to centromeres, and
      truncating alleles lose it. Graded IN_VITRO because PMID:32303603
      summarizes this result as coming from SYCP2L constructs expressed in
      transfected somatic cells.
  downstream:
  - target: Reduced Primordial Oocyte Survival
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26362258
      reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results suggest that SYCP2L promotes the survival of primordial
        oocytes
      explanation: >-
        In knockout mice, loss of SYCP2L shortens the survival of dictyate
        oocytes.
- name: Reduced Primordial Oocyte Survival
  description: >-
    Without SYCP2L, oocytes still form and enter the primordial pool, but the
    arrested dictyate oocytes are lost faster than normal as the female ages.
    SYCP2L acts late in prophase I: it joins the synaptonemal complex in late
    diplotene and stays on the centromeres of dictyate oocytes. No synapsis or
    recombination defect has been reported in Sycp2l-null oocytes. What the
    knockout shows is faster loss of the arrested pool, not the early prophase
    arrest seen with most meiotic POI genes. The cause of the faster loss is
    not known.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: primordial oocyte
    term:
      id: CL:0000023
      label: oocyte
  notes: >-
    No apoptosis or checkpoint assay has been reported in Sycp2l-deficient
    oocytes. The node records the loss of oocytes, so no cell-death term is
    bound, and the node does not conform to the meiotic_prophase_failure
    checkpoint node. PMID:38521400 describes its Iranian SYCP2L nonsense
    variant as impacting synaptonemal complex assembly. Its abstract reports
    no synapsis assay, so this reads as a statement of the gene's general
    role, not a measured defect, and it is not recorded as a mechanism here.
  evidence:
  - reference: PMID:26362258
    reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Female mice lacking SYCP2L undergo a significantly higher progressive
      loss of oocytes with age compared with wild-type females and are less
      fertile.
    explanation: >-
      Progressive, age-dependent oocyte loss in knockout females.
  downstream:
  - target: Ovarian Follicle Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26362258
      reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the pool of primordial oocytes becomes more rapidly depleted in
        SYCP2L-deficient than in wild-type females, such that with aging, fewer
        oocytes undergo maturation in developing follicles
      explanation: >-
        Faster depletion of the primordial pool leaves fewer growing
        follicles.
- name: Ovarian Follicle Depletion
  conforms_to: "meiotic_prophase_failure#Ovarian Follicle Depletion and Primary Ovarian Insufficiency"
  description: >-
    The follicle reserve runs out early. The frameshift carrier had small
    ovaries with no antral follicles on ultrasound. The missense carrier had
    normal-sized ovaries with three small follicles in total, consistent with
    her milder course.
  biological_scale: TISSUE
  cell_types:

treatments:
- name: Hormone replacement therapy
  description: >-
    There is no SYCP2L-directed therapy. As for other causes of POI, estrogen
    with progestogen replaces ovarian hormones to limit the bone,
    cardiovascular and other consequences of early estrogen loss. It does not
    restore fertility, for which donor oocytes are the usual option. The
    progestogen is bound as progesterone because the ChEBI progestogen class
    is a role term that the agent slot does not admit. Other progestogens are
    used equally.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
    - preferred_term: progesterone
      term:
        id: CHEBI:17026
        label: progesterone
  target_mechanisms:
  - target: Ovarian Follicle Depletion
    treatment_effect: BYPASSES
    description: >-
      Exogenous estradiol and progesterone replace physiological ovarian sex
      steroid output lost downstream of ovarian follicle depletion without
      restoring the primordial oocyte reserve.
    evidence:
    - reference: PMID:39652037
      reference_title: "Evidence-based guideline: Premature Ovarian Insufficiency."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      directness: INDIRECT
      snippet: >-
        The potential implications include adverse effects on quality of life;
        fertility; and bone, cardiovascular and cognitive health. Although
        hormone therapy (HT) can mitigate some of these effects, many questions
        still remain regarding the optimal management of POI.
      explanation: >-
        Hormone therapy mitigates downstream consequences of ovarian follicle
        depletion and estrogen loss across POI etiologies without restoring
        ovarian follicle reserve.
  target_phenotypes:
  - preferred_term: Premature ovarian insufficiency
    term:
      id: HP:0008209
      label: Premature ovarian insufficiency
  - preferred_term: Decreased serum estradiol
    term:
      id: HP:0008214
      label: Decreased serum estradiol
  evidence:
  - reference: PMID:39652037
    reference_title: "Evidence-based guideline: Premature Ovarian Insufficiency."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      The potential implications include adverse effects on quality of life;
      fertility; and bone, cardiovascular and cognitive health. Although
      hormone therapy (HT) can mitigate some of these effects, many questions
      still remain regarding the optimal management of POI.
    explanation: >-
      The 2024 ESHRE POI guideline. It applies to POI of any cause and was not
      tested specifically in SYCP2L-related disease.
animal_models:
- name: Sycp2l knockout mouse
  species: Mouse
  genotype: Sycp2l-/-
  publication: PMID:26362258
  description: >-
    Knockout females form a primordial oocyte pool that is depleted faster
    with age than in wild-type females. They are less fertile, but not
    sterile.
  modeled_mechanisms:
  - target: Reduced Primordial Oocyte Survival
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout loses oocytes progressively with age.
    evidence:
    - reference: PMID:26362258
      reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Female mice lacking SYCP2L undergo a significantly higher progressive
        loss of oocytes with age compared with wild-type females
      explanation: >-
        The defining cellular phenotype, shown in mice.
  - target: Ovarian Follicle Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Fewer oocytes reach growing follicles with age, and female fertility is
      reduced.
    limitations: >-
      Knockout females stay fertile, with accelerated reproductive aging,
      while homozygous women lose ovarian function by about 30. Whether
      aged knockout females eventually reach complete ovarian failure was not
      reported.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        A full null in mice gives subfertility and early reproductive aging,
        not the ovarian insufficiency seen in women with the frameshift
        allele. So the mouse shows the direction of the follicle loss but not
        its clinical severity.
    evidence:
    - reference: PMID:26362258
      reference_title: "Accelerated reproductive aging in females lacking a novel centromere protein SYCP2L."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        with aging, fewer oocytes undergo maturation in developing follicles
      explanation: >-
        Reduced follicle recruitment with age in knockout females.

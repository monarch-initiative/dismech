  - target: Oligomenorrhea
    causal_link_type: DIRECT
  - target: Female infertility
    causal_link_type: DIRECT
  - target: Elevated circulating follicle stimulating hormone level
    causal_link_type: DIRECT
    description: >-
      Loss of follicles removes ovarian negative feedback on the pituitary.
  - target: Elevated circulating luteinizing hormone level
    causal_link_type: DIRECT
    description: >-
      Loss of follicles removes ovarian negative feedback on the pituitary.
  - target: Decreased circulating anti-Mullerian hormone

treatments:
- name: Early Rehabilitative and Educational Intervention
  description: >-
    No disease-specific therapy exists. Early rehabilitative and educational
    intervention is the mainstay and measurably improves prognosis and social
    adjustment, which makes prompt diagnosis worthwhile even though the underlying
    lesion is not correctable.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no specific therapy for CdCS but early rehabilitative and
      educational interventions improve the prognosis and considerable progress has
      been made in the social adjustment of CdCS patients.
    explanation: >-
      States both the absence of specific therapy and the benefit of early
      intervention.
- name: Speech and Language Therapy
  description: >-
    Speech therapy alongside physical therapy and psychomotricity. Expressive
    language is impaired out of proportion to comprehension, which is the specific
    rationale for prioritising expressive-language and augmentative communication
    work rather than general developmental support.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early rehabilitation (physical therapy, psychomotricity, speech therapy) is
      recommended for the neurological problems
    explanation: >-
      Names speech therapy explicitly among the recommended early rehabilitative
      modalities.
- name: Genetic Counseling
  description: >-
    Counselling turns on which mechanism produced the deletion. A de novo deletion
    carries negligible recurrence risk; a parental balanced translocation carries a
    risk of unbalanced offspring roughly an order of magnitude higher, and makes
    prenatal diagnosis appropriate. Parental karyotyping after a new diagnosis is
    what separates the two, and residual gonadal mosaicism qualifies even the
    negligible figure.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of recurrence is practically negligible for the cases of a de novo
      deletion, which are the most frequent.
    explanation: >-
      The counselling figure for the majority mechanism. Paired with the
      translocation-carrier risk recorded under inheritance, this is what the
      counselling session actually conveys.
- name: Physical and Occupational Therapy
  description: For hypotonia and psychomotor delay.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

notes: >-
  Diagnosis is clinical in the first instance, resting on the facial gestalt,
  transverse flexion creases, hypotonia and the characteristic cry; karyotype is
  the confirmatory test, with FISH reserved for cases where clinical suspicion
  conflicts with an apparently normal karyotype. Not every 5p deletion produces
  the syndrome: individuals whose deletions spare the critical regions may have a
  mild phenotype or none at all, which is why deletion coordinates rather than
  deletion presence should drive interpretation.

  Perioperative care deserves specific mention: laryngeal and epiglottic
  hypoplasia can make intubation difficult, so the mechanism node underlying the
  cry has direct anaesthetic consequences.

  Several evidence snippets drawn from PMID:16953888 begin or end mid-sentence.
  That reference is cached as extracted PDF text in which words are hyphenated
  across line breaks; snippets are trimmed to avoid those breaks so they remain
  exact substrings of the cache. The affected explanations note this explicitly.

discussions:
- discussion_id: cdcs_cry_gene_unidentified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which gene or genes in the distal 5p15.31 cry critical region are responsible
    for the laryngeal maldevelopment that produces the cat-like cry?
  attaches_to:
  - "pathophysiology#Cry-Region Haploinsufficiency at 5p15.31"
  rationale: >-
    The cry is the syndrome's defining feature and its determining interval has
    been narrowed to roughly 640 kb by phenotype dissection, yet no responsible
    gene has been established. The interval is gene-rich, and the candidates
    characterised so far are either ubiquitously expressed or have no known role
    in laryngeal development, so none offers a satisfying mechanistic account.
    This leaves the best-mapped genotype-phenotype relationship in the syndrome
    without a molecular explanation.
  evidence:
  - reference: PMID:15657623
    reference_title: "Determination of the 'critical region' for cat-like cry of Cri-du-chat syndrome and analysis of candidate genes by quantitative PCR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that one candidate gene, FLJ25076, encodes a
      ubiquitin-conjugated enzyme E2 type, which is locally expressed in thoracic
      and scalp tissues.
    explanation: >-
      Documents the state of the art on the cry interval: the leading candidate is
      offered only as a suggestion, with tissue expression that does not obviously
      implicate the larynx. This is the evidence that the gap remains open.
  proposed_experiments:
  - experiment_id: cdcs_cry_region_larynx_expression
    name: Laryngeal expression screen of the 640 kb cry interval
    description: >-
      Determine which genes in the 640 kb interval are expressed in developing
      laryngeal cartilage and the epiglottic primordium, using developmental
      single-cell transcriptomics of human and model-organism larynx, then test
      dosage reduction of the strongest candidates for laryngeal structural
      phenotypes.
    decision_criterion: >-
      A candidate expressed in laryngeal cartilage whose heterozygous reduction
      reproduces a narrowed or hypoplastic larynx would identify the cry gene;
      absence of any laryngeally expressed candidate would argue the cry arises
      from the central rather than the structural arm.
- discussion_id: cdcs_rat_model_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the neuroinflammatory signature seen in the rat model of the syntenic 5p
    deletion, including complement activation in reactive astrocytes, occur in
    human patients?
  attaches_to:
  - "pathophysiology#Impaired Dendritic Arborization and Spine Maturation"
  rationale: >-
    The engineered rat model reproduces cognitive and social deficits and shows
    immune dysregulation in hippocampus and prefrontal cortex, and AAV-Ctnnd2
    rescue makes the CTNND2 dosage link causal in that system. But the immune and
    synaptic-pruning arm has no human counterpart evidence: no patient
    neuropathology series has looked for astrocyte reactivity or complement
    activation. The gap matters therapeutically, because a neuroinflammatory
    component would suggest targets entirely different from gene replacement, and
    it would be easy to over-read the rodent result as established human
    mechanism.
  evidence:
  - reference: PMID:39965128
    reference_title: "Behavioral Abnormalities, Cognitive Impairments, Synaptic Deficits, and Gene Replacement Therapy in a CRISPR Engineered Rat Model of 5p15.2 Deletion Associated With Cri du Chat Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The immunostaining and RNA-seq analyses provide new insights into CdCS
      pathogenesis, revealing inflammatory and immune processes.
    explanation: >-
      Source of the inflammatory and immune findings whose human validity is the
      subject of this mismatch. Rodent evidence, which is precisely why the human
      counterpart is an open question rather than settled mechanism.
  proposed_experiments:
  - experiment_id: cdcs_human_neuropathology_complement
    name: Human neuropathology survey for astrocyte reactivity and complement
    description: >-
      Examine available post-mortem brain tissue from individuals with 5p deletion
      for astrocyte reactivity and complement deposition, comparing regional
      distribution with the model. Where tissue is unavailable, test CSF or blood
      complement markers against deletion size and cognitive severity.
    decision_criterion: >-
      Regionally concordant astrocyte reactivity with complement deposition in
      patient tissue would promote the neuroinflammatory arm to human mechanism;
      its absence would confine that arm to the model and caution against
      inflammation-directed therapeutic inference.
- discussion_id: cdcs_methylation_causal_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the deletion-independent DNA methylation changes in patients a cause of
    phenotypic variability or a consequence of the disease state?
  attaches_to:
  - "pathophysiology#Deletion-Independent DNA Methylation Dysregulation"
  rationale: >-
    Methylation changes enriched at developmental-delay and microcephaly genes,
    demonstrably not driven by chromosome 5, are an attractive explanation for why
    patients with similar deletions differ clinically. But the study design is
    cross-sectional and measured in blood, so it cannot distinguish a modifier
    that shapes the phenotype from a signature that reflects it. Resolving the
    direction determines whether this is a therapeutic target or merely a
    biomarker.
  evidence:
  - reference: PMID:36242045
    reference_title: Cri du chat syndrome patients have DNA methylation changes in genes linked to symptoms of the disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with the present data we cannot conclude about the sequence of events
      between DNA methylation changes and other cellular functions
    explanation: >-
      The authors state the causal-direction gap themselves, so this discussion
      records an acknowledged limitation of the primary study rather than a
      curator-invented doubt.
  proposed_experiments:
  - experiment_id: cdcs_methylation_longitudinal_tissue
    name: Cross-tissue and longitudinal methylation comparison
    description: >-
      Compare methylation in blood against a developmentally relevant tissue in
      the same individuals, and test whether methylation state at the implicated
      CpG sites measured early predicts later developmental trajectory
      independently of deletion size.
    decision_criterion: >-
      Early methylation state predicting later trajectory after adjustment for
      deletion size would support a modifier role; concordance only with
      concurrent severity would favour a downstream signature.
- discussion_id: cdcs_tert_functional_consequence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does hemizygous loss of TERT produce any measurable consequence in cri-du-chat
    syndrome, or is it a passenger deletion with no phenotypic contribution?
  attaches_to:
  - "pathophysiology#TERT Haploinsufficiency"
  rationale: >-
    TERT sits at 5p15.33 and is removed by essentially every terminal deletion, so
    it is routinely listed among the syndrome's candidate genes. But unlike CTNND2
    it has no correlative human evidence and no rescue experiment, and no telomere
    phenotype has been demonstrated in patients. This node is deliberately left
    without a downstream edge for that reason: asserting one would manufacture a
    mechanism the literature does not support. The question matters because
    proximity to the telomere makes TERT loss near-universal, so if it were
    contributing it would be contributing in almost every patient.
  evidence:
  - reference: PMID:40343585
    reference_title: "Establishment and characterization of Cri Du Chat neuronal stem cells: a novel promising resource to study the syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mapped in chromosome 5 short arm, are known to be expressed in the brain, and
      to play a role in the development of the nervous system
    explanation: >-
      Groups TERT with SEMA5A and CTNND2 as brain-expressed 5p genes whose
      haploinsufficiency is proposed but not resolved, which is precisely the open
      question.
  - reference: PMID:40343585
    reference_title: "Establishment and characterization of Cri Du Chat neuronal stem cells: a novel promising resource to study the syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the mechanism of which has remained unexplained
    explanation: >-
      States that the mechanism linking 5p gene dosage to developmental impairment
      is unexplained, supporting the gap rather than any particular resolution.
  proposed_experiments:
  - experiment_id: cdcs_tert_telomere_phenotype
    name: Telomere-length and TERT-dosage phenotyping in patient cells
    description: >-
      Measure telomerase activity and telomere length in patient-derived neuronal
      stem cells and fibroblasts stratified by whether the deletion includes TERT,
      and test whether either measure correlates with cognitive severity
      independently of overall deletion size.
    decision_criterion: >-
      A telomere or telomerase deficit tracking TERT inclusion, and correlating with
      severity after adjusting for deletion size, would promote TERT from candidate
      to contributor; absence of any measurable deficit would support treating it as
      a passenger and removing it from the candidate list.


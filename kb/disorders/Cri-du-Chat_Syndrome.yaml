diagnosis:
- name: Karyotype Analysis
  description: >-
    Conventional karyotyping of peripheral blood is the first confirmatory test,
    with FISH reserved for cases where clinical suspicion conflicts with an
    apparently normal karyotype.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Karyotype analysis and, in doubtful cases, FISH analysis will confirm the
      diagnosis.
    explanation: >-
      Establishes karyotype as the confirmatory test and FISH as the fallback.
- name: Chromosomal Microarray
  description: >-
    Microarray combined with karyotyping is recommended as the definitive
    approach, because it resolves the deletion breakpoints. That matters here more
    than in most syndromes: the phenotype tracks deletion extent, so coordinates
    rather than a yes/no deletion call are what inform prognosis and counselling.
  diagnosis_term:
    preferred_term: chromosomal microarray testing
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:34394178
    reference_title: Deep Phenotyping and Genetic Characterization of a Cohort of 70 Individuals With 5p Minus Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recommend combining typical karyotyping with CMA as the definitive method
      for a precise diagnosis
    explanation: >-
      Cohort recommendation for combined karyotype plus microarray as the
      definitive diagnostic method.
- name: Audiometric Examination
  description: >-
    Audiometry is recommended for every child with the syndrome rather than only
    those with suspected hearing loss, because sensorineural deafness compounds the
    expressive-speech impairment and is easy to miss behind it.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      audiometric examination should be carried out on all CdCS children
    explanation: >-
      Supports universal audiometric screening rather than targeted testing.

differential_diagnoses:
- name: Other contiguous-gene deletion syndromes with microcephaly and severe developmental delay
  description: >-
    Individually, the features of this syndrome are not discriminating; the
    diagnosis rests on the gestalt plus the cry. In older patients the cry
    diminishes, so the persistently abnormal voice together with psychomotor
    retardation is what prompts cytogenetic testing. Other terminal-deletion
    syndromes considered in the differential include Wolf-Hirschhorn (4p-) and 1p36
    deletion syndrome.
  distinguishing_features:
  - >-
    The high-pitched monochromatic cat-like cry in infancy is the discriminating
    feature; no other deletion syndrome in the differential produces it.
  - >-
    In older patients the cry diminishes, so the persistently abnormal voice
    combined with psychomotor retardation is what prompts cytogenetic testing.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of CdCS patients are not specific if considered
      separately but, if valued as a whole, they result in a distinct phenotype
    explanation: >-
      States that individual features are non-specific and the gestalt carries the
      diagnosis.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the voice that remains abnormal
    explanation: >-
      Supports the persistently abnormal voice as the feature that leads to testing
      in older patients whose cry has diminished.

pathophysiology:
- name: Chromosome 5p Deletion
  biological_scale: MOLECULAR
  description: >-
    A heterozygous deletion of the short arm of chromosome 5, ranging from well
    under 1 Mb to essentially the whole short arm. Terminal deletions predominate;
    interstitial deletions, unbalanced translocation products, ring chromosome 5
    and mosaicism account for the remainder. This is a copy-number loss, not a
    point variant, so the pathogenic unit is an interval rather than a gene.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Cri du Chat syndrome (CdCS) is a genetic disease resulting from a
      deletion of variable size occurring on the short arm of chromosome 5
    explanation: >-
      States the causal lesion and its variable size.
  - reference: PMID:34394178
    reference_title: Deep Phenotyping and Genetic Characterization of a Cohort of 70 Individuals With 5p Minus Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      results from the loss of genetic material at the distal region of the short
      arm of chromosome 5
    explanation: >-
      Independent cohort confirmation of the causal lesion and its distal
      localisation.
  downstream:
  - target: Contiguous-Gene Haploinsufficiency Across 5p15
    description: >-
      Loss of one copy of the interval reduces dosage of every gene it contains.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16953888
      reference_title: Cri du Chat syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        partial aneusomy syndromes like CdCS result from abnormal gene dosage
      explanation: >-
        States that the deletion acts through abnormal gene dosage.

- name: Contiguous-Gene Haploinsufficiency Across 5p15
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of a large number of contiguous genes across the deleted
    interval. Because separable sub-intervals map to separable phenotypic
    components, this node fans out to region-specific consequences rather than
    acting as a single undifferentiated insult. Cognitive severity in particular
    scales with how much of the 5p interval is lost: three distinct regions
    contribute additively, so severity increases as the deletion extends across
    them.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      partial aneusomy syndromes like CdCS result from abnormal gene dosage
      (haploinsufficiency)
    explanation: >-
      States the core dosage mechanism. The source continues "involving a large
      number of contiguous genes", but that phrase is hyphenated across a line
      break in the cached PDF text, so the quote stops at the preceding word.
  - reference: PMID:15635506
    reference_title: High-resolution mapping of genotype-phenotype relationships in cri du chat syndrome using array comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MR increased as deletions that included MRI extended progressively into MRII
      and MRIII, and MR became profound when all three regions were deleted.
    explanation: >-
      Establishes that cognitive severity is dose-additive across three separable
      intervals, which is the basis for the deletion-extent claim in this node.
  downstream:
  - target: Cry-Region Haploinsufficiency at 5p15.31
    description: >-
      Deletions extending into the distal cry interval remove its dosage-sensitive
      content; deletions sparing it generally spare the cry.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15635506
      reference_title: High-resolution mapping of genotype-phenotype relationships in cri du chat syndrome using array comparative genomic hybridization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genotype-phenotype correlations localized the region associated with the
        cry to 1.5 Mb in distal 5p15.31
      explanation: >-
        Localises the cry determinant to a specific sub-interval of the deletion.
  - target: CTNND2 Delta-Catenin Haploinsufficiency
    description: >-
      CTNND2 lies at 5p15.2 and is removed by essentially all deletions large
      enough to produce the syndrome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10673328
      reference_title: Hemizygosity of delta-catenin (CTNND2) is associated with severe mental retardation in cri-du-chat syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The genomic structure of the human delta-catenin gene (Human Gene
        Nomenclature Committee-approved symbol CTNND2) was determined and mapped
        to 5p15.2.
      explanation: >-
        Places CTNND2 inside the deleted interval.
  - target: SEMA5A Axon-Guidance Haploinsufficiency
    description: >-
      SEMA5A maps to the 5p15 critical region and is co-deleted.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16953888
      reference_title: Cri du Chat syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        covering at least 10% of this region has been cloned
      explanation: >-
        The sentence this clause completes is "The human Semaphorin F gene (SEMAF)
        covering at least 10% of this region has been cloned", placing SEMA5A/SEMAF
        inside the 5p15.2 critical region. The quote starts mid-sentence because
        "Semaphorin" is hyphenated across a line break in the cached PDF text.
  - target: TERT Haploinsufficiency
    description: >-
      TERT lies at 5p15.33 and is removed by terminal deletions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16953888
      reference_title: Cri du Chat syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        haploinsufficiency of the telomerase reverse transcriptase (hTERT) gene,
        localised to 5p15.33
      explanation: >-
        Places TERT inside the deleted interval and frames its loss as
        haploinsufficiency.
  - target: Hindbrain Hypoplasia
    description: >-
      Deletion of 5p is associated with structural hindbrain anomalies, of which
      pontine hypoplasia is the most frequent on neuroimaging. The intermediate
      genes and developmental steps are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32800423
      reference_title: "Structural brain anomalies in Cri-du-Chat syndrome: MRI findings in 14 patients and possible genotype-phenotype correlations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MRI analyses showed that isolated pontine hypoplasia is the most common
        finding, followed by vermian hypoplasia
      explanation: >-
        Establishes hindbrain hypoplasia as a consistent structural consequence in
        patients with 5p deletions.

- name: Cry-Region Haploinsufficiency at 5p15.31
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of the small distal interval whose loss determines the cat-like
    cry. Phenotype-dissection studies comparing patients with and without the cry
    narrowed this interval to roughly 640 kb, and array-based mapping placed the
    cry determinant in 1.5 Mb of distal 5p15.31. The responsible gene or genes are
    not established; several candidates lie in the interval but none is proven.
  evidence:
  - reference: PMID:15657623
    reference_title: "Determination of the 'critical region' for cat-like cry of Cri-du-chat syndrome and analysis of candidate genes by quantitative PCR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the critical region for the cat-like cry is mapped to a short 640 kbp region
      on chromosome 5p
    explanation: >-
      Fine-maps the cry determinant using patients who differ in the presence of
      the cry.
  - reference: PMID:34394178
    reference_title: Deep Phenotyping and Genetic Characterization of a Cohort of 70 Individuals With 5p Minus Syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high-pitched cry seemed to map at p14.3–p13.2 bands versus bands
      p15.33–p15.31
    explanation: >-
      Recorded as REFUTE because it directly contradicts the distal localisation
      this node asserts. The largest contemporary cohort mapped the cry to a much
      more proximal interval than every earlier study. The distal mapping is
      retained as the node's primary claim because it rests on phenotype
      dissection in patients who differ in the presence of the cry, which is the
      stronger design, but the disagreement is real and is flagged rather than
      suppressed.
  downstream:
  - target: Laryngeal and Epiglottic Hypoplasia
    description: >-
      Loss of the interval is associated with maldevelopment of the larynx and
      epiglottis. The molecular route from dosage loss to laryngeal structure is
      not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16953888
      reference_title: Cri du Chat syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The characteristic cat-like cry is probably due to anomalies
      explanation: >-
        The source attributes the cry to laryngeal and epiglottic anomalies but
        hedges the attribution ("probably"), so the edge is marked PARTIAL.

- name: CTNND2 Delta-Catenin Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of delta-catenin, a neuronal adherens-junction protein
    expressed early in neuronal development and involved in cell motility. This is
    the best-supported single-gene contributor in the syndrome: hemizygous loss
    correlates with cognitive severity in patients, and restoring the gene product
    rescues cognition in an engineered rodent model of the syntenic deletion.
  genes:
  - preferred_term: CTNND2
    term:
      id: hgnc:2516
      label: CTNND2
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  - preferred_term: dendritic spine development
    term:
      id: GO:0060996
      label: dendritic spine development
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:10673328
    reference_title: Hemizygosity of delta-catenin (CTNND2) is associated with severe mental retardation in cri-du-chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delta-catenin is an adherens junction protein involved in cell motility and
      expressed early in neuronal development.
    explanation: >-
      Establishes the molecular identity and neurodevelopmental role of the gene
      product whose dosage is reduced.
  downstream:
  - target: Impaired Dendritic Arborization and Spine Maturation
    description: >-
      Reduced delta-catenin dosage impairs dendritic arbor complexity and the
      maturation of dendritic spines. Causality is supported by rescue:
      AAV-mediated Ctnnd2 replacement alleviates the cognitive phenotype in the rat
      model, which is an interventional test rather than a correlation. The source
      states the limits directly: the benefit is confined to early developmental
      stages and does not fully restore the phenotype, so this edge should not be
      read as establishing that restoring one co-deleted gene corrects the
      syndrome.

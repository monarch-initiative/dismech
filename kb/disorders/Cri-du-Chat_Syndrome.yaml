- name: Impaired Forebrain Development and Cortical Dysfunction
  biological_scale: TISSUE
  description: >-
    Reduced brain growth and impaired cortical function, manifesting as
    microcephaly with severe psychomotor and intellectual disability. Severity
    tracks deletion extent, but with an important caveat: a substantial share of
    the most severely affected patients carry additional copy-number changes
    outside 5p, so unusually severe impairment should prompt a search for a second
    lesion rather than being attributed to 5p deletion size alone.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:15635506
    reference_title: High-resolution mapping of genotype-phenotype relationships in cri du chat syndrome using array comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MR depended approximately on the 5p deletion size and location, but there
      were many cases in which the retardation was disproportionately severe, given
      the 5p deletion. All 15 of these cases, approximately two-thirds of the
      severely retarded patients, were found to have copy-number aberrations in
      addition to the 5p deletion.
    explanation: >-
      Supports both the deletion-size dependence and the second-lesion caveat that
      qualifies it.

- name: Deletion-Independent DNA Methylation Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Genome-wide DNA methylation differences in patients relative to matched
    controls, including at promoters of genes controlling embryonic development and
    at CpG sites linked to developmental delay and microcephaly. Critically, this
    enrichment is not driven by methylation changes on chromosome 5, so it is a
    candidate modifier layer acting outside the deleted interval that may help
    explain why patients with similar deletions differ clinically. Direction of
    causality is not established: the changes could contribute to phenotype or
    reflect it.
  evidence:
  - reference: PMID:36242045
    reference_title: Cri du chat syndrome patients have DNA methylation changes in genes linked to symptoms of the disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, this relative enrichment is not driven by changes in the
      methylation of genes on chromosome 5.
    explanation: >-
      Establishes that the methylation signal is independent of the deleted
      interval, which is what makes it a candidate modifier rather than a
      downstream readout of gene dosage.
  - reference: PMID:36242045
    reference_title: Cri du chat syndrome patients have DNA methylation changes in genes linked to symptoms of the disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      revealed enrichment of genes controlling embryonic development and genes
      linked to symptoms which are among the most common symptoms of Cri du chat
      syndrome: developmental delay and microcephaly
    explanation: >-
      Ties the methylation changes specifically to the developmental-delay and
      microcephaly phenotypes.
  downstream:
  - target: Impaired Forebrain Development and Cortical Dysfunction
    description: >-
      The methylation changes may contribute to the neurodevelopmental phenotype,
      but the direction of the relationship is explicitly unresolved by the source
      study: the differences could be driving the phenotype, result from other
      epigenetic changes, or merely reflect altered gene expression. The edge is
      therefore typed UNKNOWN rather than asserted as causal, and it is retained
      because the modifier hypothesis is the leading explanation on offer for why
      patients with comparable deletions differ clinically.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:36242045
      reference_title: Cri du chat syndrome patients have DNA methylation changes in genes linked to symptoms of the disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is suggestive of epigenetic changes early in embryonic development that may
        be contributing to the development of symptoms
      explanation: >-
        The authors' own framing of the possible contribution, stated as suggestive
        rather than demonstrated, which is why this is PARTIAL.
    - reference: PMID:36242045
      reference_title: Cri du chat syndrome patients have DNA methylation changes in genes linked to symptoms of the disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with the present data we cannot conclude about the sequence of events
        between DNA methylation changes and other cellular functions
      explanation: >-
        The source explicitly disclaims knowledge of causal ordering. Recorded here
        so the UNKNOWN edge typing is justified from the literature rather than
        being a curator hedge.


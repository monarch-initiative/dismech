  preferred_term: Cri-du-chat syndrome
  term:
    id: MONDO:0007404
    label: Cri-du-chat syndrome
parents:
- Chromosomal deletion syndrome
- Contiguous gene deletion syndrome

has_subtypes:
- name: Terminal deletion
  display_name: 5p terminal deletion
  description: >-
    The most common form — a terminal deletion of 5p, of variable breakpoint and
    size. Clinical severity and psychomotor retardation increase progressively
    with the size of the deletion.
  evidence:
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation in 62 patients with terminal deletions highlighted a progressive severity of clinical manifestation and psychomotor retardation related to the size of the deletion."
    explanation: Establishes terminal deletions as the predominant class and links deletion size to clinical severity.
- name: Interstitial deletion
  display_name: 5p interstitial deletion
  description: >-
    A less common interstitial deletion of 5p. Analysis of interstitial deletions
    helped define the two separate critical regions (dysmorphism/intellectual
    disability at 5p15.2 and the cat cry at 5p15.3).
  evidence:
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the existence of two critical regions, one for dysmorphism and mental retardation in p15.2 and the other for the cat cry in p15.3."
    explanation: Interstitial-deletion patients delineated the two distinct 5p15 critical regions.

inheritance:
- name: Contiguous gene deletion
  inheritance_term:
    preferred_term: Contiguous gene syndrome
    term:
      id: HP:0001466
      label: Contiguous gene syndrome
  expressivity: VARIABLE
  description: >-
    The lesion removes one copy of many neighbouring dosage-sensitive genes, so
    the phenotype is the joint consequence of several haploinsufficiencies rather
    than of a single gene defect.
  evidence:
  - reference: PMID:30985858
    reference_title: Integrated analysis of the critical region 5p15.3-p15.2 associated with cri-du-chat syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Cri-du-chat syndrome (CdCs) is one of the most common contiguous gene
      syndromes
    explanation: >-
      States explicitly that the disorder is a contiguous gene syndrome.
- name: Sporadic de novo deletion
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most deletions arise de novo, and the deleted chromosome is predominantly of
    paternal origin. A minority arise from unbalanced segregation of a parental
    balanced translocation, which carries a substantial recurrence risk and makes
    parental karyotyping essential after a new diagnosis.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deleted chromosome was mainly of paternal origin"
    explanation: >-
      Establishes the predominant parental origin of the de novo deletion.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (62 patients: 77.5%), an interstitial deletion (seven patients: 8.75%)
    explanation: >-
      Italian Registry proportions for terminal versus interstitial deletions. The
      sentence opens "a 5p terminal deletion"; "deletion" is hyphenated across a
      line break in the cached PDF text, so the quote starts at the parenthesis.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a de novo translocation (four patients: 5%), a familial translocation (three
      patients: 3.75%)
    explanation: >-
      Registry proportions for translocation-derived deletions, which is the subset
      that carries a materially different recurrence risk.
- name: Recurrence risk
  description: >-
    Recurrence risk is the counselling number that actually changes management, and
    it depends entirely on which mechanism produced the deletion. For a de novo
    deletion it is negligible; for a parental balanced translocation the risk of
    unbalanced offspring is an order of magnitude higher. This is why parental
    karyotyping is not optional after a new diagnosis. Gonadal mosaicism in a parent
    cannot be excluded even when no recurrence has been reported.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of recurrence is practically negligible for the cases of a de novo
      deletion, which are the most frequent.
    explanation: >-
      Establishes the negligible recurrence risk for the majority de novo mechanism.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the risk of unbalanced offspring (according to the pachytene configuration and
      5p breakpoint localisation) ranged from 8.7% to 18.8%
    explanation: >-
      Quantifies the recurrence risk for carriers of a balanced translocation
      involving 5p, the figure that drives prenatal-diagnosis counselling.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the possibility of gonadal mosaicism in one of the parents cannot be excluded
    explanation: >-
      Records the residual risk that qualifies the "negligible" de novo figure.

genetic:
- name: CTNND2
  gene_term:
    preferred_term: CTNND2
    term:
      id: hgnc:2516
      label: CTNND2
  relationship_type: COOPERATING
  notes: >-
    Delta-catenin, a neuronal adherens-junction protein at 5p15.2 involved in cell
    motility and expressed early in neuronal development. Hemizygous loss
    correlates with severe intellectual disability in patients, and AAV-mediated
    Ctnnd2 replacement rescues cognitive deficits in a rat model of the syntenic
    deletion. Typed COOPERATING rather than CAUSATIVE because it is one of several
    co-deleted contributors, not sufficient on its own for the syndrome.
  evidence:
  - reference: PMID:10673328
    reference_title: Hemizygosity of delta-catenin (CTNND2) is associated with severe mental retardation in cri-du-chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A strong correlation was found between the hemizygous loss of delta-catenin
      and severe mental retardation.
    explanation: >-
      Directly links CTNND2 hemizygosity to cognitive severity in patients with 5p
      terminal deletions.
- name: SEMA5A
  gene_term:
    preferred_term: SEMA5A
    term:
      id: hgnc:10736
      label: SEMA5A
  relationship_type: COOPERATING
  notes: >-
    Semaphorin 5A (historically SEMAF), an axon-guidance molecule mapping to the
    5p15 critical region and implicated in guiding axons and migrating neuronal
    precursors during cortical development. Candidate-gene status: the source
    attribution is explicitly probabilistic.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two genes, Semaphorin F (SEMAF) and delta-catenin (CTNND2), which have been
      mapped to the "critical regions", are potentially involved in cerebral
      development and their deletion may be associated with mental retardation in
      CdCS patients.
    explanation: >-
      Names SEMA5A/SEMAF as a critical-region gene implicated in the cognitive
      phenotype. The hedged wording ("potentially", "may be") supports a candidate
      role only, so this is marked PARTIAL.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  relationship_type: UNKNOWN
  notes: >-
    Telomerase reverse transcriptase at 5p15.33, the rate-limiting component of
    telomerase. Included in the deletion in most patients, but its contribution to
    the clinical phenotype remains proposed rather than established, hence the
    UNKNOWN typing.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletion of the telomerase reverse transcriptase (hTERT) gene, localised to
      5p15.33, could contribute to the phenotypic changes in CdCS.
    explanation: >-
      Supports TERT as a candidate contributor only; the source states this as a
      possibility ("could contribute"), so the evidence is marked PARTIAL.
- name: 5p terminal deletion
  association: Causal
  notes: >-
    Partial deletion of the short arm of chromosome 5 (copy-number loss), of
    variable size; severity correlates with deletion size. About 85% are de novo;
    10-15% are familial, most often from a parental balanced translocation (and ~5%
    a parental inversion). The deleted chromosome is of paternal origin in ~90% of
    de novo cases. No coordinate slot exists in the schema; the structural event is
    recorded here in prose (copy-number loss, 5p15).
  evidence:
  - reference: PMID:10678657
    reference_title: "Cri du chat syndrome: changing phenotype in older patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo deletion is present in 85% of the patients. Ten to 15% are familial cases with more than 90% due to a parental translocation and 5% due to an inversion of chromosome 5."
    explanation: Gives the de novo vs familial breakdown and the mechanisms of familial cases.
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin of the deleted chromosome 5 was paternal in 55 out of 61 patients (90.2%)."
    explanation: Documents the predominantly paternal origin of the deleted chromosome.


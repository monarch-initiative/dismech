name: Cri-du-Chat Syndrome
creation_date: '2026-07-30T00:00:00Z'
category: Genetic
synonyms:
- 5p deletion syndrome
- 5p- syndrome
- 5p minus syndrome
- Monosomy 5p
- Cat cry syndrome
- Chromosome 5p deletion syndrome
- Lejeune syndrome
description: >-
  Cri-du-chat syndrome is a contiguous-gene deletion disorder caused by a
  heterozygous deletion of the short arm of chromosome 5. Deletions range from
  well under 1 Mb to essentially the whole short arm, and the phenotype reflects
  haploinsufficiency of many dosage-sensitive genes across 5p15 rather than loss
  of any single gene. The eponymous feature is a high-pitched, monochromatic
  cat-like cry in infancy, attributed to a small, narrow, diamond-shaped larynx
  and a floppy epiglottis together with a central contribution. Other cardinal
  features are microcephaly, a round face with hypertelorism, epicanthal folds
  and micrognathia, marked neonatal hypotonia with impaired suck, and severe
  psychomotor and intellectual disability with disproportionate expressive-speech
  impairment.

  The distinguishing mechanistic feature of this entry is that separable critical
  regions of 5p map to separable components of the phenotype: the cat-like cry to
  a small interval in distal 5p15.31, speech delay to 5p15.32-15.33, and facial
  dysmorphology to 5p15.2-15.31, while cognitive severity behaves dose-additively
  across three distinct intervals. Deletion extent, rather than a single gene
  lesion, is therefore the proximate determinant of which features appear and how
  severe they are.

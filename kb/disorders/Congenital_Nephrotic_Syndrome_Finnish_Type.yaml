genetic:
- name: NPHS1
  gene_term:
    preferred_term: NPHS1
    term:
      id: hgnc:7908
      label: NPHS1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline NPHS1 variants cause the disease. In Finland two founder alleles account for over 94% of
    mutations; elsewhere the allelic spectrum is wide and mostly missense, and in some clinically typical patients no
    coding variant is found. Compound heterozygotes carrying at least one "mild" allele, typically a missense variant
    whose nephrin still reaches the plasma membrane, can instead present after 3 months of age with a later-onset,
    milder steroid-resistant nephrotic syndrome; this entry treats that as the mild end of the same allelic series.
  evidence:
  - reference: PMID:18614772
    reference_title: Nephrin mutations can cause childhood-onset steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of at least one "mild" mutation in these patients likely explains the later onset and milder course
      of disease. These results broaden the spectrum of renal disease related to nephrin mutations.
    explanation: Ten families with compound heterozygous NPHS1 variants and onset after 3 months.
  - reference: PMID:9660941
    reference_title: Positionally cloned gene for a novel glomerular protein--nephrin--is mutated in congenital nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four different mutations segregating with the disease were found in one of the genes in NPHS1 patients.
    explanation: Gene identification.
  - reference: PMID:11317351
    reference_title: Mutation spectrum in the nephrin gene (NPHS1) in congenital nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the Finnish population, two main mutations have been found. These two nonsense mutations account for over 94%
      of all mutations in Finland. Most mutations found in non-Finnish patients are missense mutations
    explanation: Allelic spectrum in and outside Finland.
  variants:
  - name: Fin-major
    description: >-
      A 2-bp deletion in exon 2 of NPHS1, the commoner Finnish founder allele. It abolishes nephrin; homozygotes are the
      recipients at risk of anti-nephrin-associated graft recurrence.
    population_effects:
    - population: Finnish patients with congenital nephrotic syndrome
      ancestry_terms:
      - preferred_term: Finnish
        term:
          id: HANCESTRO:0321
          label: Finnish
      ancestry_basis: NOT_STATED
      comparator_stratum: non-Finnish patients with congenital nephrotic syndrome
      effect_differences:
      - ALLELE_FREQUENCY
      evidence:
      - reference: PMID:11317351
        reference_title: Mutation spectrum in the nephrin gene (NPHS1) in congenital nephrotic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In the Finnish population, two main mutations have been found. These two nonsense mutations account for over
          94% of all mutations in Finland. Most mutations found in non-Finnish patients are missense mutations
        explanation: The founder alleles dominate in Finland and are uncommon in patients elsewhere.
    evidence:
    - reference: PMID:9915943
      reference_title: Structure of the gene for congenital nephrotic syndrome of the finnish type (NPHS1) and characterization of mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a 2-bp deletion in exon 2 (Finmajor) or a nonsense mutation in exon 26 (Finminor)
      explanation: Defines the two Finnish founder alleles.
  - name: Fin-minor
    description: A nonsense variant in exon 26 of NPHS1, the second Finnish founder allele; it also abolishes nephrin.
    evidence:

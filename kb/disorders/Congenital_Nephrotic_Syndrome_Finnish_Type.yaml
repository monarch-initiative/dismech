      explanation: Background statement of a cell-based trafficking study, summarising earlier trafficking work.
- name: Endoplasmic Reticulum Retention of Missense Nephrin
  biological_scale: CELLULAR
  description: >-
    Missense nephrin is retained in the endoplasmic reticulum, probably because it misfolds, so it is absent from the
    podocyte surface. In HEK293 cells the chemical chaperone sodium 4-phenylbutyrate moved several mutants to the cell
    surface, where they bound Neph1 and were phosphorylated on clustering; this has not been tested in patients.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  evidence:
  - reference: PMID:15213260
    reference_title: Defective trafficking of nephrin missense mutants rescued by a chemical chaperone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence microscopy and cell surface biotinylation showed that treatment with sodium 4-phenylbutyrate
      rescued several of the missense mutants from the ER to the cell surface.
    explanation: Shows the mutants are ER-retained and that the retention is correctable in cultured cells.
  downstream:
  - target: Absence of the Podocyte Slit Diaphragm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Nephrin that does not reach the plasma membrane cannot assemble the slit diaphragm.
    evidence:
    - reference: PMID:10972661
      reference_title: "Congenital nephrotic syndrome (NPHS1): features resulting from different mutations in Finnish patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        a nephrotic infant with Fin-major/R743C genotype expressed nephrin in kidney had normal slit diaphragms and
        responded to therapy with an angiotensin-converting enzyme inhibitor and indomethacin.
      explanation: >-
        The converse case: a missense allele whose nephrin is expressed preserved slit diaphragms and a milder course,
        so slit-diaphragm loss tracks the absence of nephrin at the surface rather than the genotype class.
- name: Absence of the Podocyte Slit Diaphragm
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Foot Process Effacement and Slit Diaphragm Disruption"
  description: >-
    Nephrin is located at the slit between podocyte foot processes and is the first protein identified there. In kidneys
    lacking nephrin, filtration slits of various sizes remain but carry no slit diaphragm, and foot processes are fused.
    The same picture appears in Nphs1-null mice and nphs1-mutant zebrafish. Engagement of the nephrin ectodomain
    activates Fyn, phosphorylates the nephrin tail and recruits Nck to polymerise actin, so nephrin also couples the
    junction to the foot-process cytoskeleton.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: slit diaphragm assembly
    modifier: ABSENT
    term:
      id: GO:0036060
      label: slit diaphragm assembly
  evidence:
  - reference: PMID:10393930
    reference_title: Nephrin is specifically located at the slit diaphragm of glomerular podocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In immunogold-stained thin sections, nephrin label was found at the slit between podocyte foot processes.
    explanation: Places nephrin at the slit diaphragm in human glomeruli.
  - reference: PMID:10972661
    reference_title: "Congenital nephrotic syndrome (NPHS1): features resulting from different mutations in Finnish patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In electron microscopy, podocyte fusion and podocyte filtration slits of various sizes were detected. The slit
      diaphragms, however, were missing.
    explanation: Ultrastructure of patient kidneys.
  - reference: PMID:11136707
    reference_title: "The murine nephrin gene is specifically expressed in kidney, brain and pancreas: inactivation of the gene leads to massive proteinuria and neonatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The kidneys of null mice exhibited enlarged Bowman's spaces, dilated tubuli, effacement of podocyte foot
      processes and absence of the slit diaphragm, essentially as found in human NPHS1 patients.
    explanation: Nephrin knockout reproduces the lesion.
  - reference: PMID:16543952
    reference_title: "Nephrin ectodomain engagement results in Src kinase activation, nephrin phosphorylation, Nck recruitment, and actin polymerization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      engagement of the nephrin ectodomain induces transient Fyn catalytic activity that results in nephrin
      phosphorylation on specific nephrin cytoplasmic domain tyrosine residues.
    explanation: Signalling role of nephrin linking the junction to actin dynamics.
  downstream:
  - target: Glomerular Filtration Barrier Failure
    causal_link_type: DIRECT
    description: Without slit diaphragms the glomerular filter no longer retains plasma proteins.

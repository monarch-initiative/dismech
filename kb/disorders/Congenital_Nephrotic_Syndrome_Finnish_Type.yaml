- name: Post-Transplant Anti-Nephrin Immunity
  biological_scale: ORGANISM
  description: >-
    Fin-major homozygotes have never expressed nephrin, so a transplanted kidney presents it as a foreign antigen. In a
    Finnish series nephrotic syndrome recurred in 25% of grafts, all in Fin-major/Fin-major recipients, and high
    anti-nephrin antibody levels were found in four of the nine patients with recurrence. This is an immune response
    to the graft, not recurrence of the primary podocyte defect.
  evidence:
  - reference: PMID:11884936
    reference_title: "Recurrence of nephrotic syndrome in kidney grafts of patients with congenital nephrotic syndrome of the Finnish type: role of nephrin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating anti-nephrin antibodies seem to have a pathogenic role in the development of heavy proteinuria in
      kidney grafts of NPHS1 patients with Fin-major/Fin-major genotype.
    explanation: Associates graft proteinuria with anti-nephrin antibodies in nephrin-null recipients.
  downstream:
  - target: Recurrent Nephrotic Syndrome in the Kidney Graft
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11884936
      reference_title: "Recurrence of nephrotic syndrome in kidney grafts of patients with congenital nephrotic syndrome of the Finnish type: role of nephrin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All nine patients with recurrence had a Fin-major/Fin-major genotype, which leads to absence of nephrin in the
        native kidney.
      explanation: Recurrence was confined to recipients who had never expressed nephrin.

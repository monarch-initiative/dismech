animal_models:
- name: Nphs1 null mouse
  species: Mouse
  genotype: Nphs1(-/-)
  publication: PMID:11136707
  description: >-
    Constitutive nephrin knockout. Homozygotes look normal at birth, then develop massive proteinuria and oedema and die
    within 24 hours, with absent slit diaphragms and foot-process effacement.
  modeled_mechanisms:
  - target: Absence of the Podocyte Slit Diaphragm
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    limitations: >-
      Death within a day of birth leaves no window for the protein-losing complications, and the mouse shows no
      neurological abnormality despite nephrin expression in the brain.
    evidence:
    - reference: PMID:11136707
      reference_title: "The murine nephrin gene is specifically expressed in kidney, brain and pancreas: inactivation of the gene leads to massive proteinuria and neonatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The kidneys of null mice exhibited enlarged Bowman's spaces, dilated tubuli, effacement of podocyte foot
        processes and absence of the slit diaphragm, essentially as found in human NPHS1 patients.
      explanation: Reproduces the human ultrastructural lesion.
- name: nphs1 mutant zebrafish
  species: Zebrafish
  genotype: nphs1 CRISPR/Cas9 null mutant
  publication: PMID:36187478
  description: >-
    Mutants lack nephrin in podocytes and develop oedema from 5 days post-fertilisation, with absent slit diaphragms,
    foot-process effacement and loss of a plasma reporter protein into the urine; some survive to adulthood.
  modeled_mechanisms:
  - target: Absence of the Podocyte Slit Diaphragm
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Pronephric glomeruli of the larva differ in scale and structure from the mammalian metanephric kidney, and
      survival to adulthood in some mutants departs from the human course.
    evidence:
    - reference: PMID:36187478
      reference_title: A zebrafish model of congenital nephrotic syndrome of the Finnish type.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        loss of nephrin results in absence of slit-diaphragms and progressive foot process effacement in zebrafish
        pronephric glomeruli, similar to the pathological changes in human CNF patients.
      explanation: Reproduces slit-diaphragm loss in a second species.
discussions:
- discussion_id: cnf_dyskinetic_neurological_syndrome
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some children with this disease develop a dyskinetic, dystonic-athetoid syndrome with pallidal MRI changes and
    hearing loss, and is it a consequence of nephrin loss in the brain or of the complications of the protein-losing
    state?
  rationale: >-
    The syndrome was seen in 6 of 70 patients at one centre, with no explanatory mitochondrial variant and no
    difference in external complications from controls. Nephrin is expressed in the developing mouse brain, but the
    knockout mouse shows no brain abnormality and dies within a day, so it cannot test a later-onset effect.
  attaches_to:
  - phenotypes#Dystonia
  - phenotypes#Athetosis
references:
- reference: PMID:9660941
  title: Positionally cloned gene for a novel glomerular protein--nephrin--is mutated in congenital nephrotic syndrome.

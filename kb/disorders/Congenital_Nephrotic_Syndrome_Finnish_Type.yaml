      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a 2-bp deletion in exon 2 (Finmajor) or a nonsense mutation in exon 26 (Finminor)
      explanation: Defines the two Finnish founder alleles.

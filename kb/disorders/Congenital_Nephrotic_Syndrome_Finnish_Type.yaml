notes: >-
  There is no GeneReviews chapter for this disease (checked against the Bookshelf index with
  `just check-genereviews --online`). The Finnish incidence figure comes from a 1965-1973 national ascertainment that
  predates gene discovery; the abstract prints it as "12-2/10(5)", read here as 12.2 per 100,000. A French nationwide
  series (PMID:29474669) gives a cumulative incidence of 0.5 per 100,000 live births for congenital nephrotic syndrome
  of all causes, of which biallelic NPHS1 variants were 65%; that is not an NPHS1-specific figure and is not recorded
  as a prevalence row.

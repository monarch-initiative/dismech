pathophysiology:
- name: Biallelic NPHS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NPHS1 variants segregate with the disease. NPHS1 encodes nephrin, a 1241-residue transmembrane protein of
    the immunoglobulin family of cell adhesion molecules expressed in renal glomeruli. In Finland two founder alleles,
    a 2-bp deletion in exon 2 (Fin-major) and a nonsense variant in exon 26 (Fin-minor), account for over 90% of
    disease alleles; both abolish nephrin expression in the kidney. Outside Finland most alleles are missense.
    Nephrin's molecular activity is cell-cell adhesion across the filtration slit: it is an immunoglobulin-superfamily
    adhesion molecule that binds Neph1, and the slit diaphragm is proposed to be a zipper of nephrin molecules from
    neighbouring foot processes. The DECREASED modifier records the loss of nephrin protein, not a measured activity.
  molecular_functions:
  - preferred_term: nephrin cell-cell adhesion activity
    modifier: DECREASED
    term:
      id: GO:0098632
      label: cell-cell adhesion mediator activity

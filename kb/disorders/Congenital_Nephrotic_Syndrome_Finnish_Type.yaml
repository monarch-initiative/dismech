    snippet: >-
      Four different mutations segregating with the disease were found in one of the genes in NPHS1 patients. The NPHS1
      gene product, termed nephrin, is a 1241-residue putative transmembrane protein of the immunoglobulin family of
      cell adhesion molecules
    explanation: Positional cloning of NPHS1 and identification of segregating mutations.
  - reference: PMID:10972661
    reference_title: "Congenital nephrotic syndrome (NPHS1): features resulting from different mutations in Finnish patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nephrin was not expressed in kidneys with Fin-major or Fin-minor mutations
    explanation: The two Finnish founder alleles are null at the protein level in patient kidneys.
  - reference: PMID:10393930
    reference_title: Nephrin is specifically located at the slit diaphragm of glomerular podocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A zipper-like model for nephrin assembly in the slit diaphragm is discussed, based on the present and previous
      data.
    explanation: Proposes that nephrin molecules from adjacent foot processes interlock to form the slit diaphragm.
  - reference: PMID:15213260
    reference_title: Defective trafficking of nephrin missense mutants rescued by a chemical chaperone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All of the rescued mutants were found to be able to interact with Neph1.
    explanation: Nephrin binds its slit-diaphragm partner Neph1.
  downstream:

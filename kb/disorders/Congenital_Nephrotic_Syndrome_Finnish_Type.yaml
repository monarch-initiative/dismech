name: Congenital Nephrotic Syndrome, Finnish Type
description: >-
  Autosomal recessive nephrotic syndrome caused by biallelic pathogenic variants in NPHS1, which encodes nephrin, an
  immunoglobulin-superfamily transmembrane protein of the glomerular podocyte that is the first identified structural
  component of the slit diaphragm between podocyte foot processes. The two Finnish founder alleles, Fin-major and
  Fin-minor, are truncating and abolish nephrin; most alleles found outside Finland are missense variants whose protein
  is retained in the endoplasmic reticulum. Without nephrin the slit diaphragm does not form, foot processes efface and
  the glomerular filter leaks plasma proteins massively from fetal life. Proteinuria begins in utero, raising
  alpha-fetoprotein in amniotic fluid and maternal serum and accompanying a large placenta, and full nephrotic syndrome
  is present at or within weeks of birth. The ensuing protein loss drives hypoalbuminaemia and oedema, loss of
  thyroxine-binding proteins with secondary hypothyroidism, infections and thrombosis. The disease does not respond to
  immunosuppression; management is supportive (albumin infusion, thyroxine, renin-angiotensin inhibition with
  indomethacin, nephrectomy and dialysis) until kidney transplantation. About a quarter of grafts in Fin-major
  homozygotes, who have never expressed nephrin, develop recurrent nephrotic syndrome associated with anti-nephrin
  antibodies.

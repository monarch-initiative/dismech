- name: Massive Urinary Protein Loss
  biological_scale: ORGANISM
  description: >-
    Continuous loss of plasma proteins into the urine depletes albumin and other carrier proteins, including those that
    bind thyroxine. The resulting hypoalbuminaemia, oedema, infections and thrombosis dominate the first months of life.
    Hypothyroidism is secondary: it reverses after bilateral nephrectomy stops the protein loss.
  evidence:
  - reference: PMID:34983935
    reference_title: Congenital nephrotic syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

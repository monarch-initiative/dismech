  description: >-
    Biallelic CCDC115 variants. The defining study found the disease in
    homozygotes for c.92T>C p.(Leu31Ser) in four unrelated families, as a
    compound heterozygote of that allele with a CCDC115 deletion in a fifth, and
    as homozygous c.31G>T p.(Asp11Tyr) in a sixth. Two affected siblings were
    later identified as compound heterozygotes while being investigated for
    Wilson disease.

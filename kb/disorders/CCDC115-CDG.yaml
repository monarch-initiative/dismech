- name: Lysosomal Lipid Accumulation and Hepatic Steatosis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Silencing CCDC115 in HepG2 hepatocytes increases the number and size of
    lipid droplets, including abnormally large ones that colocalise with
    lysosomes, without excessive de novo lipogenesis, failing oxidative capacity
    or elevated lipid uptake. The proposed mechanism is therefore a failure of
    lipophagy - lipid that reaches the lysosome and is not degraded - rather
    than lipid overproduction.

    The hypercholesterolemia follows from this rather than being a separate
    lesion: apolipoprotein B secretion is markedly increased in the silenced
    cells, and the patients' hyperlipidemia is in the very-low-density
    lipoprotein range, with no mutation in any familial-hypercholesterolemia
    gene or in LIPA.
  biological_processes:
  - preferred_term: lipophagy
    term:
      id: GO:0061724
      label: lipophagy
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the siTMEM199 and siCCDC115 HepG2 hepatocyte models, increased numbers
      and size of lipid droplets were observed, including abnormally large lipid
      droplets, which colocalized with lysosomes.
    explanation: >-
      The lipid-droplet phenotype and its lysosomal localisation.
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Excessive de novo lipogenesis, failing oxidative capacity, and elevated
      lipid uptake were not observed.
    explanation: >-
      The three alternative explanations that were excluded, which is what leaves
      failed lipophagy as the mechanism.
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest that the hypercholesterolemia in TMEM199 and CCDC115
      deficiency is due to increased secretion of apoB-containing particles.
    explanation: >-
      Links the lipid handling defect to the observed hypercholesterolemia.
  downstream:
  - target: phenotypes#Hypercholesterolemia
    causal_link_type: DIRECT
  - target: pathophysiology#Hepatic Injury and Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Hepatic Injury and Fibrosis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinical endpoint is a spectrum from steatohepatitis with fibrosis
    through cirrhosis to liver failure. What is not established is which of the
    upstream defects drives it. The glycosylation defect and the lipophagy
    defect are both present, both plausible, and have not been separated
    experimentally; the 2018 case series explicitly offers hypotheses about the
    pathogenesis of the liver disease rather than a demonstration. This node is
    graded PROVISIONAL for that reason, and the two incoming edges are marked as
    having unknown intermediates.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, while two individuals clinically presented with early and severe
      liver fibrosis and cirrhosis associated with neurological symptoms, the
      other one "only" showed isolated and late severe liver involvement.
    explanation: >-
      The range of hepatic severity within three unrelated patients.
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, hypothesis concerning the pathogenesis of the liver disease
      and of major biological abnormalities are proposed.
    explanation: >-
      Cited to mark the state of the evidence rather than to assert a mechanism:
      the source frames its account of the liver pathogenesis as hypothesis.
      Graded INDIRECT for the same reason.
  downstream:
  - target: phenotypes#Cirrhosis
    causal_link_type: DIRECT
  - target: phenotypes#Hepatic Failure
    causal_link_type: DIRECT

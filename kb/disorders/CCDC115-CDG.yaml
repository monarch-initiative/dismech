    evidence_source: OTHER
    snippet: >-
      The multi-subunit vacuolar-type H+-ATPase (V-ATPase) is responsible for
      acidification of intracellular organelles, thereby controlling several
      pH-sensitive intracellular processes such as protein glycosylation,
      lysosomal lipase (LAL) activity, and autophagy.
    explanation: >-
      The general principle linking one assembly factor to three separate
      downstream defects. Graded INDIRECT because it is background framing in
      that paper rather than a result it measures.

name: CCDC115-CDG
creation_date: "2026-08-29T20:40:00Z"
category: Mendelian
disease_term:
  preferred_term: CCDC115-CDG
  term:
    id: MONDO:0014789
    label: CCDC115-CDG
description: >-
  CCDC115-CDG (congenital disorder of glycosylation type IIo) is an ultra-rare
  autosomal recessive disorder of Golgi homeostasis. Biallelic variants in
  CCDC115 - the human homolog of the yeast V-ATPase assembly factor Vma22p -
  produce a combined defect of N-linked and mucin-type O-linked protein
  glycosylation, and a phenotype that is dominated by the liver rather than by
  the multisystem features usual in congenital disorders of glycosylation.

  Children present in the first years of life with a storage-disease-like
  picture: hepatosplenomegaly that often regresses with age, markedly raised
  bone-derived alkaline phosphatase, raised aminotransferases,
  hypercholesterolemia, and abnormal copper metabolism with low serum
  ceruloplasmin. Psychomotor delay and hypotonia are common but not universal.
  Outcome is heterogeneous in a way that matters clinically: some children
  stabilise, while others progress to fibrosis, cirrhosis and liver failure -
  two of the first eight reported individuals died of liver failure and one was
  transplanted.

  The diagnostic problem this entry exists to record is that the biochemistry
  points at Wilson disease. Low ceruloplasmin and abnormal copper handling in a
  child with liver disease is a Wilson presentation, and CCDC115-CDG has been
  found precisely by sequencing beyond ATP7B in Wilson-phenotype patients in
  whom biallelic ATP7B variants could not be demonstrated. Niemann-Pick disease
  type C and mitochondrial hepatopathies are the other mimics named in the
  literature. Serum transferrin glycosylation screening is what separates them.

  Two things are worth stating once. The gene symbol is in flux: the live HGNC
  registry has renamed HGNC:28178 to VMA22 (vacuolar ATPase assembly factor
  VMA22), keeping CCDC115 as a previous symbol, while the OBO HGNC build this
  repository validates against still calls it CCDC115. The disease name, every
  paper, and the MONDO label all say CCDC115, and that is what this entry binds
  - but a reader matching against current HGNC will not find that symbol. And
  the mechanism is shared with a small family of neighbours - TMEM199-CDG,
  ATP6AP1-CDG, ATP6AP2-CDG and VMA21-related disease - which all disturb
  V-ATPase assembly and all produce overlapping liver and lipid phenotypes.

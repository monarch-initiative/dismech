      associated with higher serum transaminase levels.
    explanation: >-
      The only proposed genotype-phenotype correlation, derived from a review of
      all thirteen reported patients.
  downstream:
  - target: pathophysiology#Impaired V-ATPase Assembly and Organelle Acidification
    causal_link_type: DIRECT
- name: Impaired V-ATPase Assembly and Organelle Acidification
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The V-ATPase acidifies intracellular organelles, and that pH sets several
    downstream processes - glycosyltransferase activity in the Golgi, lysosomal
    acid lipase activity, and autophagy. Losing an assembly factor therefore
    produces a defect that is not confined to one enzyme.

    The evidence that the acidification step is genuinely impaired, rather than
    inferred from the yeast homology, comes from hepatocyte models: silencing
    CCDC115 in HepG2 cells produces impaired lysosomal acidification together
    with impaired autophagic capacity. That is a lysosomal readout rather than a
    Golgi one, which is worth noting - the Golgi pH defect itself has been
    argued from the glycosylation phenotype rather than measured directly in
    these patients' cells.

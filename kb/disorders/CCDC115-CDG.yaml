- name: Combined N- and O-Glycosylation Defect
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Serum proteins show abnormal N-glycosylation and abnormal mucin-type
    O-glycosylation - the combined pattern that distinguishes Golgi-homeostasis
    defects from the earlier, ER-based congenital disorders of glycosylation.
    Fibroblasts show reduced metabolic labelling of sialic acids.

    The complementation result is what makes this causal rather than
    correlative: restoring wild-type CCDC115 in patient fibroblasts restores
    sialic acid labelling. It is also, in practice, the diagnostic handle -
    the disease is identifiable by screening plasma for abnormal glycosylation,
    which is why it turns up in patients being investigated for something else.

genetic:
- name: CCDC115
  gene_term:
    preferred_term: CCDC115
    term:
      id: hgnc:28178
      label: CCDC115
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    A naming point that will confuse anyone matching gene symbols, and a
    provenance disagreement worth recording rather than smoothing over. The live
    HGNC REST API returns VMA22, "vacuolar ATPase assembly factor VMA22", for
    HGNC:28178, with CCDC115 as a previous symbol. The OBO HGNC build that this
    repository's term validator resolves against still returns CCDC115, and
    binding VMA22 fails validation here. The disease name, every paper, and the
    MONDO label say CCDC115.

    This entry binds CCDC115 because that is what the configured authority says
    and what the literature uses. The consequence to be aware of is that a query
    matching this entry against a current HGNC download will not match on symbol
    - it will need the HGNC ID. The right fix is a refresh of the OBO HGNC
    build, not a per-entry workaround, so nothing is worked around here.

    Two recurrent alleles carry most of the reported caseload: c.92T>C
    p.(Leu31Ser), homozygous in several unrelated families and also seen in
    trans with a whole-gene deletion, and c.31G>T p.(Asp11Tyr). Only thirteen
    patients had been reported as of the 2025 review, so any statement about
    allele frequency or genotype-phenotype correlation in this disease rests on
    a denominator small enough to name.
  evidence:
  - reference: PMID:26833332
    reference_title: "CCDC115 Deficiency Causes a Disorder of Golgi Homeostasis with Abnormal Protein Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An additional homozygous missense mutation, c.31G>T (p.Asp11Tyr), was found
      in a family with two affected siblings.
    explanation: >-
      The second recurrent allele.
prevalence:
- population: Reported patients worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirteen patients reported in total as of the 2025 review, which is the
    entire evidence base for the clinical phenotype. The disease was found in
    two ways that both bear on how many more there may be: by screening plasma
    glycosylation in unexplained liver disease, and by sequencing beyond ATP7B
    in patients with a Wilson-disease phenotype. Both are routes that would
    only be taken in a specialist setting, so under-ascertainment is likely and
    unquantified.
  evidence:
  - reference: PMID:41037859
    reference_title: "Defining the clinical spectrum and genotype-phenotype correlations for CCDC115-CDG: A patient report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only thirteen patients have been reported with this condition.
    explanation: >-
      The total reported caseload, and the denominator for every frequency
      statement in this entry.
diagnosis:
- name: Plasma glycosylation screening in unexplained liver disease
  description: >-
    The diagnostic route is transferrin glycosylation screening, which shows a
    type II (Golgi) pattern, followed by molecular confirmation. The practical
    recommendation from the case literature is to screen for CDG in any patient
    with unexplained and severe liver disease, because the presentation is
    otherwise indistinguishable from commoner diagnoses.

    A second route exists and has already yielded patients: exome sequencing in
    people with a Wilson-disease phenotype in whom biallelic ATP7B variants
    cannot be found. Two affected siblings were identified that way.
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides pointing to the importance of CDG screening in patients with
      unexplained and severe liver disease, these reports expand the clinical and
      molecular phenotypes of CCDC115-CDG.
    explanation: >-
      The authors' own screening recommendation.
  - reference: PMID:32043565
    reference_title: "Genetics of Wilson disease and Wilson-like phenotype in a clinical series from eastern Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two affected siblings resulted to be compound heterozygous for mutations in
      CCDC115, which is involved in a form of congenital disorder of
      glycosylation.
    explanation: >-
      The Wilson-workup route, demonstrated rather than proposed: these patients
      reached the diagnosis through an ATP7B-negative Wilson series.
treatments:
- name: Supportive Care and Hepatic Surveillance
  description: >-
    There is no disease-specific pharmacological therapy. Management is
    supportive, with monitoring of liver function and synthetic capacity, lipid
    monitoring, and developmental support where neurological features are
    present.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41037859
    reference_title: "Defining the clinical spectrum and genotype-phenotype correlations for CCDC115-CDG: A patient report and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, our report provides new insights into the natural history and
      genotype-phenotype correlation of CCDC115-CDG, key elements to focus on in
      ultra-rare conditions.
    explanation: >-
      Cited for what it does not contain as much as what it does: the most recent
      review of the whole caseload reports natural history and genotype
      correlation and offers no disease-specific therapy. Graded INDIRECT
      because absence of a treatment section is not a positive statement that
      none exists.
- name: Liver Transplantation
  description: >-
    Performed successfully in at least one individual with liver failure. It is
    the only intervention with a reported disease-altering outcome, and it
    treats the organ rather than the glycosylation defect - whether the
    extrahepatic glycosylation abnormality persists after transplantation is not
    reported.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: PMID:26833332
    reference_title: "CCDC115 Deficiency Causes a Disorder of Golgi Homeostasis with Abnormal Protein Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two individuals died of liver failure, and one individual was successfully
      treated by liver transplantation.
    explanation: >-
      The single reported successful transplant, alongside the two deaths that
      frame the indication.
differential_diagnoses:
- name: Wilson disease
  description: >-
    The mimic that matters. Low ceruloplasmin, abnormal copper handling and
    childhood liver disease is a Wilson presentation, and CCDC115-CDG has been
    diagnosed inside an ATP7B-negative Wilson series. The separator is plasma
    transferrin glycosylation, not the copper studies.
  evidence:
  - reference: PMID:41037859
    reference_title: "Defining the clinical spectrum and genotype-phenotype correlations for CCDC115-CDG: A patient report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypercholesterolemia and copper metabolism anomalies, features that can
      mimic Wilson disease
    explanation: >-
      States the mimicry directly.
  - reference: PMID:32043565
    reference_title: "Genetics of Wilson disease and Wilson-like phenotype in a clinical series from eastern Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, if genetic diagnosis is not achieved, additional genes should be
      considered because other disorders may mimic WD.
    explanation: >-
      The practical rule from the series in which CCDC115 patients were found
      inside a Wilson cohort.
- name: TMEM199-CDG and the other V-ATPase assembly disorders
  description: >-
    TMEM199-CDG is the closest neighbour: the same class of defect, in the yeast
    Vma12p homolog rather than Vma22p, with the same laboratory signature -
    elevated aminotransferases and alkaline phosphatase, hypercholesterolemia,
    low ceruloplasmin, combined N- and O-glycosylation abnormality. Reported
    TMEM199 patients have a milder, adolescent-onset phenotype. ATP6AP1-CDG,
    ATP6AP2-CDG and VMA21-related disease belong to the same group and span
    mild steatohepatitis to early cirrhosis. Sequencing separates them;
    biochemistry does not.
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified uncharacterized transmembrane protein 199 (TMEM199,
      previously called C17orf32) as a human homolog of yeast V-ATPase assembly
      factor Vph2p (also known as Vma12p).
    explanation: >-
      The paralogous mechanism: a different yeast V-ATPase assembly factor
      homolog with the same class of defect.
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Notably, overlapping liver and lipid phenotypes have been described in
      patients with mutations in other assembly factors of the V-ATPase as well,
      ie, ATP6AP1,4
      ATP6AP2,5 and VMA21.6
    explanation: >-
      Extends the differential to the rest of the V-ATPase assembly group.
- name: Other congenital disorders of glycosylation with predominant liver involvement
  description: >-
    Liver involvement occurs in only about a fifth of CDG types, and a small
    number have it as the predominant or isolated feature - MPI-CDG,
    TMEM199-CDG, CCDC115-CDG and ATP6AP1-CDG. MPI-CDG is the one worth
    identifying first because it is treatable with oral mannose. The larger
    group, including PMM2-CDG, has liver disease as one feature among many.
  evidence:
  - reference: PMID:28108845
    reference_title: "Liver involvement in congenital disorders of glycosylation (CDG). A systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We distinguish two main groups: on the one hand, the CDG types with
      predominant or isolated liver involvement including MPI-CDG, TMEM199-CDG,
      CCDC115-CDG, and ATP6AP1-CDG
    explanation: >-
      Places this disease in the liver-predominant CDG subgroup and names the
      others.
- name: Niemann-Pick disease type C and mitochondrial hepatopathies
  description: >-
    Both named in the case literature as diagnoses that CCDC115-CDG was
    mistaken for. The storage-disease-like hepatosplenomegaly with neurological
    involvement is what drives the resemblance.
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 3 new unrelated cases of CCDC115-CDG with emphasis on
      diagnosis difficulties related to strong phenotypic similarities with
      mitochondriopathies, Niemann-Pick disease C and Wilson Disease.
    explanation: >-
      Names the three diagnoses this disease was confused with in practice.
discussions:
- discussion_id: ccdc115_which_defect_drives_the_liver_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the liver disease in CCDC115-CDG driven by the glycosylation defect, by
    the lipophagy defect, or by both independently?
  attaches_to:
  - "pathophysiology#Hepatic Injury and Fibrosis"
  - "pathophysiology#Combined N- and O-Glycosylation Defect"
  - "pathophysiology#Lysosomal Lipid Accumulation and Hepatic Steatosis"
  rationale: >-
    Both defects are present, both are downstream of the same acidification
    failure, and nothing published separates them.

    The glycosylation account is the older one and explains the diagnostic
    findings well. The lipophagy account is newer, is the better-controlled work
    - de novo lipogenesis, oxidative capacity and lipid uptake were each
    measured and excluded - and explains the steatosis and the
    hypercholesterolemia, but it was done by silencing the gene in HepG2 cells
    rather than in patient hepatocytes carrying the actual alleles.

    The question is not academic. If the liver injury is lipophagic, therapies
    aimed at lysosomal lipid handling are on the table and the glycosylation
    abnormality is a biomarker; if it is glycosylation-driven, the reverse. The
    2018 series is explicit that its account of the hepatic pathogenesis is
    hypothesis rather than demonstration, and nothing since has settled it.
  proposed_experiments:
  - experiment_id: exp_ccdc115_patient_ipsc_hepatocyte
    name: Patient-derived iPSC hepatocytes carrying p.Leu31Ser
    description: >-
      Differentiate hepatocyte-like cells from a p.(Leu31Ser) homozygote and
      measure lipid droplet-lysosome colocalisation, autophagic flux, apoB
      secretion and N-/O-glycan profiles side by side, against an isogenic
      corrected control. The companion TMEM199 work already did this for that
      gene, so the method exists; it has not been applied to a CCDC115 patient
      line.
- discussion_id: ccdc115_golgi_ph_not_directly_measured
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has Golgi luminal pH actually been measured in CCDC115-deficient human
    cells, or is the Golgi acidification defect inferred?
  attaches_to:
  - "pathophysiology#Impaired V-ATPase Assembly and Organelle Acidification"
  rationale: >-
    The disease is described everywhere as a Golgi acidification defect, and the
    inference is a good one - the protein is a V-ATPase assembly factor homolog,
    it sits in the ERGIC and COPI vesicles, and the glycosylation abnormality is
    the type II pattern expected from a Golgi pH problem.

    But the acidification measurement that exists is lysosomal, from
    CCDC115-silenced HepG2 cells. The Golgi pH itself has been argued from the
    glycosylation phenotype rather than measured in patient cells. That is a
    circular step worth flagging in an entry whose whole mechanism rests on it:
    the glycosylation defect is the evidence for the pH defect, and the pH
    defect is the explanation for the glycosylation defect.

    Note also that the defining study specifically observed that the phenotypic
    spectrum here is distinct from that of defects in V-ATPase core subunits,
    and suggested a more general role in Golgi trafficking rather than
    acidification alone. That is an argument for measuring rather than assuming.
notes: >-
  Curation inputs. One Perplexity deep-research run, committed alongside, plus
  independent PubMed searching. The report was accurate in outline and useful for
  orientation, and its own validation panel is the reason it was not used
  further: it contains no PMID or DOI anywhere in its body, and its term
  validation reported eight of thirteen checked labels naming a different term -
  including NCIT:C15273 offered as "Liver Transplantation" when NCIT calls it
  Longitudinal Study. This entry uses NCIT:C15271. Every CURIE here was verified
  independently.

  Gene symbol. The live HGNC registry has renamed HGNC:28178 to VMA22; the OBO
  HGNC build this repository validates against still says CCDC115, which is what
  this entry binds. See the genetic notes - the disagreement is real and is
  recorded rather than resolved locally.

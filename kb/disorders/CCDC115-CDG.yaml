    explanation: >-
      The mortality and the transplant outcome in the defining series.
- category: Hepatic
  name: Hepatic Steatosis
  phenotype_term:
    preferred_term: Hepatic steatosis
    term:
      id: HP:0001397
      label: Hepatic steatosis
  frequency: FREQUENT
  evidence:
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

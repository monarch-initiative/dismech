inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic PARK7 loss-of-function variants - homozygous
    (frequently in the setting of parental consanguinity or a founder
    haplotype) or compound heterozygous. Heterozygous carriers are generally
    unaffected, although heterozygous variants in the recessive PD genes have
    been reported in association with increased late-onset PD risk. The
    autosomal recessive mode is asserted independently by ClinGen's gene
    curation expert panel and by the founding genetic report.
  evidence:
  - reference: PMID:12446870
    reference_title: Mutations in the DJ-1 gene associated with autosomal recessive early-onset parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the DJ-1 gene associated with autosomal recessive
      early-onset parkinsonism.
    explanation: >-
      The founding report titles the entity as autosomal recessive
      early-onset parkinsonism.
  - reference: CGGV:assertion_d79439d2-844b-4ba6-aceb-e6b179eaaa01-2022-06-27T160000.000Z
    reference_title: "PARK7 / Parkinson disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER

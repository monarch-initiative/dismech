mechanistic_hypotheses:
- hypothesis_group_id: dj1_oxidative_stress_cytoprotection_model
  hypothesis_label: Canonical DJ-1 Redox-Sensor and Cytoprotection Model
  status: CANONICAL
  description: >-
    The widely accepted model: DJ-1 is an oxidative-stress sensor whose
    conserved Cys106 is oxidized to cysteine-sulfinic acid under oxidant
    stress, which signals mitochondrial relocalization and cytoprotection;
    DJ-1 additionally stabilizes NRF2 (blocking KEAP1-mediated
    ubiquitination) to sustain antioxidant transcription, and acts as a
    redox-dependent chaperone limiting alpha-synuclein aggregation. Biallelic
    loss of DJ-1 removes this buffer, producing oxidative stress and
    mitochondrial dysfunction in nigral dopaminergic neurons. This model is
    the basis for the trigger-to-effector chain curated in this entry and is
    not seriously disputed at the level of "DJ-1 is cytoprotective under
    oxidative stress" - the disputes concern the biochemical mechanism (see
    the two dicarbonyl hypotheses below).
  evidence:
  - reference: PMID:15181200
    reference_title: "The Parkinson's disease protein DJ-1 is neuroprotective due to cysteine-sulfinic acid-driven mitochondrial localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We suggest that DJ-1 protects against neuronal death, and that this is
      signaled by acidification of the key cysteine residue, C106.
    explanation: >-
      Establishes the Cys106-oxidation-signalled cytoprotection that anchors
      the canonical model.
- hypothesis_group_id: dj1_glyoxalase_dicarbonyl_detoxification
  hypothesis_label: DJ-1 as a Glutathione-Independent Glyoxalase (Dicarbonyl Detoxification)
  status: ALTERNATIVE
  description: >-
    A competing biochemical account of DJ-1's catalytic activity: DJ-1 and
    its orthologs act as glutathione-independent glyoxalases that convert
    free glyoxal and methylglyoxal directly to glycolate and lactate, so that
    DJ-1 loss causes accumulation of reactive dicarbonyls and downstream
    glycation damage in dopaminergic neurons. This is supported by
    Michaelis-Menten kinetics on purified DJ-1, by protection of SH-SY5Y
    cells and C. elegans from glyoxal challenge, and by the observation that
    dopaminergic neurons degenerate in DJ-1-homolog-null worms exposed to
    sublethal glyoxal. Kinetic work reconciling the two dicarbonyl accounts
    (PMID:31653696) favours THIS activity as the real one and attributes the
    apparent deglycase activity to a rapid equilibrium artifact - but even
    that study found that DJ-1 loss did not protect human cells from acute
    methylglyoxal toxicity, and a Drosophila in vivo study found no
    contribution of DJ-1 to methylglyoxal detoxification at all. The relative
    contribution of dicarbonyl stress to human PARK-DJ1 neurodegeneration is
    therefore NOT settled.
  evidence:
  - reference: PMID:22523093
    reference_title: Human DJ-1 and its homologs are novel glyoxalases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      human DJ-1 and its homologs of the mouse and Caenorhabditis elegans are
      novel types of glyoxalase, converting glyoxal or methylglyoxal to
      glycolic or lactic acid, respectively, in the absence of glutathione
    explanation: >-
      The originating biochemical claim for the glutathione-independent
      glyoxalase hypothesis.
  - reference: PMID:31653696
    reference_title: The apparent deglycase activity of DJ-1 results from the conversion of free methylglyoxal present in fast equilibrium with hemithioacetals and hemiaminals.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that removal of free MGO by DJ-1's glyoxalase activity forces
      immediate spontaneous decomposition of hemithioacetals due to the shift
      in equilibrium position.
    explanation: >-
      Kinetic analysis that adjudicates between the two dicarbonyl hypotheses
      in favour of glyoxalase activity, while explaining the deglycase
      observations as an equilibrium artifact. Marked PARTIAL because the
      same paper reports that DJ-1 knockout did not protect human cells from
      acute methylglyoxal toxicity, so it supports the enzymology without
      supporting a cellular protective role.
- hypothesis_group_id: dj1_protein_deglycase_repair
  hypothesis_label: DJ-1 as a Protein Deglycase Repairing Glycated Residues (Contested)
  status: ALTERNATIVE
  description: >-
    The rival biochemical account: rather than scavenging free dicarbonyls,
    DJ-1 acts on early glycation intermediates already formed on proteins,
    deglycating cysteine, arginine and lysine residues and thereby
    reactivating damaged proteins, so that PARK-DJ1 parkinsonism would result
    from excessive protein glycation. This hypothesis has been directly and
    repeatedly challenged: a Drosophila in vivo study detected no
    contribution of DJ-1 to methylglyoxal-adduct accumulation or survival and
    attributed the reported deglycation activity to a TRIS buffer artifact,
    and an independent kinetic study concluded that DJ-1 does not possess
    protein deglycase activity, with the apparent activity arising from the
    fast equilibrium between free methylglyoxal and hemithioacetals. It is
    retained here as an explicitly contested ALTERNATIVE rather than removed,
    because it remains a live disagreement in the literature and because the
    deglycase framing continues to be cited in reviews.
  evidence:
  - reference: PMID:25416785
    reference_title: "Parkinsonism-associated protein DJ-1/Park7 is a major protein deglycase that repairs methylglyoxal- and glyoxal-glycated cysteine, arginine, and lysine residues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that human DJ-1 is a protein deglycase that repairs
      methylglyoxal- and glyoxal-glycated amino acids and proteins by acting
      on early glycation intermediates
    explanation: The originating claim for the protein-deglycase hypothesis.
  - reference: PMID:27903648
    reference_title: Evidence Against a Role for the Parkinsonism-associated Protein DJ-1 in Methylglyoxal Detoxification.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using both DJ-1 knockdown in Drosophila cells in culture, and DJ-1β
      knock-out flies, we could detect no contribution of DJ-1 to survival to
      MG challenge or to accumulation of MG protein adducts.
    explanation: >-
      In vivo Drosophila refutation of the deglycase/detoxification role,
      including attribution of the reported activity to a buffer artifact.
  - reference: PMID:31653696
    reference_title: The apparent deglycase activity of DJ-1 results from the conversion of free methylglyoxal present in fast equilibrium with hemithioacetals and hemiaminals.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Combined, our results suggest that DJ-1 does not possess protein
      deglycase activity.
    explanation: Independent kinetic refutation of the deglycase hypothesis.

pathophysiology:
- name: Biallelic PARK7 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is complete or near-complete loss of functional
    DJ-1 protein from biallelic PARK7 variants. Two mechanistic classes were
    identified in the founding families and remain representative: large
    genomic deletions removing the 5' portion of the gene (a 14,082 bp
    deletion segregating in a Dutch kindred), which abolish transcript
    production outright; and destabilising missense substitutions, prototyped
    by the homozygous L166P change in an Italian family. L166P sits in a
    C-terminal helix-kink-helix motif; helix-breaking substitutions there
    dramatically lower steady-state DJ-1 levels through accelerated
    degradation involving in part the proteasome, and abolish DJ-1
    homodimerisation. Because DJ-1 is obligately dimeric for function, both
    classes converge on functional nullity.
  gene:
    preferred_term: PARK7
    term:
      id: hgnc:16369
      label: PARK7
  molecular_functions:
  - preferred_term: DJ-1 protein homodimerization
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: DECREASED
  evidence:
  - reference: PMID:12446870
    reference_title: Mutations in the DJ-1 gene associated with autosomal recessive early-onset parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that DJ-1 mutations are associated with PARK7, a monogenic form
      of human parkinsonism.
    explanation: >-
      The founding human genetic evidence establishing PARK7/DJ-1 as the
      causal gene of this entity.
  - reference: PMID:12446870
    reference_title: Mutations in the DJ-1 gene associated with autosomal recessive early-onset parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that loss of DJ-1 function leads to
      neurodegeneration.
    explanation: >-
      States the loss-of-function direction of effect that makes this a
      trigger node rather than a gain-of-function lesion.
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      due to a deletion of 14,082 bp in a Dutch family or a homozygous point
      mutation (L166P) in an Italian family
    explanation: >-
      Documents the two representative variant classes (large deletion and
      destabilising missense) in the founding families.
  - reference: PMID:17331951
    reference_title: Structural determinants of the C-terminal helix-kink-helix motif essential for protein stability and survival promoting activity of DJ-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The decreased steady-state levels were due to accelerated protein
      degradation involving in part the proteasome. G-helix breaking DJ-1
      mutations abolished dimer formation.
    explanation: >-
      Mechanistic account of how destabilising C-terminal missense variants
      such as L166P produce functional nullity through degradation and loss
      of dimerisation.
  downstream:
  - target: Loss of DJ-1 Cys106 Redox Sensing and Cytoprotection
    causal_link_type: DIRECT
    description: >-
      Absence of functional DJ-1 protein directly removes the Cys106
      redox-sensing, mitochondrial-relocalisation, and chaperone functions.
  - target: Loss of DJ-1 Dicarbonyl Detoxification Capacity
    causal_link_type: DIRECT
    hypothesis_groups:
    - dj1_glyoxalase_dicarbonyl_detoxification
    - dj1_protein_deglycase_repair
    description: >-
      Under either dicarbonyl hypothesis, absence of DJ-1 removes its
      catalytic activity toward methylglyoxal and glyoxal. This edge is
      deliberately assigned to BOTH contested dicarbonyl hypothesis groups
      rather than asserted as an established part of the canonical chain.

- name: Loss of DJ-1 Cys106 Redox Sensing and Cytoprotection
  biological_scale: MOLECULAR
  role: amplifier
  conforms_to: "parkinsonism_dopaminergic_degeneration#Dopaminergic Neuronal Vulnerability and Toxic Insult"
  description: >-
    In wild-type cells the conserved Cys106 of DJ-1 is the preferential
    target of oxidative modification, stepping through sulfenic (Cys-SOH),
    sulfinic (Cys-SO2H) and sulfonic (Cys-SO3H) states. Formation of
    cysteine-sulfinic acid at Cys106 is the switch that drives DJ-1 to the
    outer mitochondrial membrane and confers protection against the complex I
    inhibitor MPP+; an artificial C106A substitution abolishes both the pI
    shift and the protection, and behaves as a partial dominant negative.
    DJ-1 also functions as a redox-sensitive molecular chaperone activated in
    an oxidising cytoplasmic environment, with chaperone activity extending to
    alpha-synuclein. Loss of DJ-1 therefore removes an oxidant-triggered,
    self-amplifying cytoprotective response precisely when the cell most
    needs it. This node substitutes the module's generic toxic insult with a
    cell-intrinsic genetic one: the same dopaminergic vulnerability is
    reached by removing endogenous defence rather than by adding a poison.
  cell_types:
  - preferred_term: Dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: DECREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:15181200
    reference_title: "The Parkinson's disease protein DJ-1 is neuroprotective due to cysteine-sulfinic acid-driven mitochondrial localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      oxidation-induced mitochondrial relocalization of DJ-1 and protection
      against cell death were abrogated in C106A but not C53A or C46A.
    explanation: >-
      Demonstrates that Cys106 specifically is required for the
      oxidation-triggered mitochondrial relocalisation and cytoprotection
      lost in DJ-1 deficiency.
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cys106 is the preferential target for oxidative protein modification
      and is required for DJ-1 mediated protection from oxidative stress
    explanation: >-
      Review-level confirmation that Cys106 is the redox-sensing residue
      required for DJ-1's protective function.
  - reference: PMID:15502874
    reference_title: DJ-1 is a redox-dependent molecular chaperone that inhibits alpha-synuclein aggregate formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that DJ-1 functions as a redox-sensitive molecular
      chaperone that is activated in an oxidative cytoplasmic environment.
    explanation: >-
      Establishes the redox-dependent chaperone arm of DJ-1 function, whose
      loss is part of this node.
  - reference: PMID:40159591
    reference_title: Redox modulatory role of DJ-1 in Parkinson's disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mutations like L166P cause loss of antioxidant activity and increased
      Reactive Oxygen Species (ROS) accumulation with subsequent
      mitochondrial dysfunction in dopaminergic neurons
    explanation: >-
      Directly links the prototypical destabilising PARK7 variant to loss of
      antioxidant capacity, ROS accumulation and mitochondrial dysfunction in
      dopaminergic neurons.
  downstream:
  - target: Impaired NRF2 Antioxidant Transcriptional Response
    causal_link_type: DIRECT
    description: >-
      Without DJ-1, NRF2 is not shielded from KEAP1 and the antioxidant
      transcriptional programme it drives collapses.
  - target: Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
    causal_link_type: DIRECT
    description: >-
      Loss of the Cys106-triggered mitochondrial cytoprotective response
      leaves dopaminergic neurons exposed to oxidant and bioenergetic injury.

- name: Loss of DJ-1 Dicarbonyl Detoxification Capacity
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    DJ-1 carries a glutathione-independent catalytic activity toward the
    reactive dicarbonyls methylglyoxal and glyoxal, byproducts of glycolysis
    that non-enzymatically glycate cysteine, arginine and lysine residues.
    The nature of that activity is genuinely disputed: one account has DJ-1
    scavenging free dicarbonyl (glyoxalase III activity, converting
    methylglyoxal to lactate), while the other has it repairing already-formed
    glycation adducts on proteins (protein deglycase activity). Kinetic work
    favours the glyoxalase account and explains the deglycase observations as
    an artifact of the fast equilibrium between free methylglyoxal and
    hemithioacetals; in vivo Drosophila data question whether either activity
    matters for dicarbonyl handling at all. This node is therefore modelled
    as a hypothesis-scoped amplifier rather than an established step: it is
    included because the biochemistry is real and disease-relevant, and it is
    tagged to its competing hypothesis groups so downstream tooling does not
    read it as settled.
  cell_types:
  - preferred_term: Dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  molecular_functions:
  - preferred_term: glyoxalase III activity (glutathione-independent)
    term:
      id: GO:0019172
      label: glyoxalase III activity
    modifier: DECREASED
  - preferred_term: protein deglycase activity (contested)
    term:
      id: GO:0036524
      label: protein deglycase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: methylglyoxal catabolic process
    term:
      id: GO:0051596
      label: methylglyoxal catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: methylglyoxal
    term:
      id: CHEBI:17158
      label: methylglyoxal
    modifier: INCREASED
  evidence:
  - reference: PMID:22523093
    reference_title: Human DJ-1 and its homologs are novel glyoxalases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sub-lethal doses of glyoxals caused significant degeneration of the
      dopaminergic neurons in C. elegans lacking cDJR-1.2, another DJ-1
      homolog expressed primarily in the head region, including neurons.
    explanation: >-
      Model-organism evidence tying loss of a DJ-1 homolog plus dicarbonyl
      exposure specifically to dopaminergic neuron degeneration. Kept as
      supporting evidence for the hypothesis-scoped node, not for the
      canonical human chain.
  - reference: PMID:27903648
    reference_title: Evidence Against a Role for the Parkinsonism-associated Protein DJ-1 in Methylglyoxal Detoxification.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we provide data suggesting that the previously reported
      deglycation activity of DJ-1 can be ascribed to a TRIS buffer artifact.
    explanation: >-
      Explicit refutation retained on the node so the controversy is visible
      in the pathograph rather than buried in prose.
  downstream:
  - target: Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dj1_glyoxalase_dicarbonyl_detoxification
    - dj1_protein_deglycase_repair
    description: >-
      Under either dicarbonyl hypothesis, accumulating methylglyoxal and
      protein glycation would add to the carbonyl and oxidant burden on
      nigral dopaminergic neurons. Modelled as indirect and hypothesis-scoped
      because the in vivo contribution in human PARK-DJ1 is unestablished.

- name: Impaired NRF2 Antioxidant Transcriptional Response
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    DJ-1 stabilises NFE2L2 (NRF2), the master transcriptional regulator of
    the cellular antioxidant response, by preventing its association with the
    inhibitor KEAP1 and its subsequent ubiquitination. In the absence of
    intact DJ-1, NRF2 protein is unstable and antioxidant transcriptional
    responses fall both basally and after induction, with measurable deficits
    in the detoxification enzyme NQO1 and, in the wider DJ-1/NRF2 literature,
    in glutathione peroxidase, superoxide dismutase and heme oxygenase-1.
    This converts an acute, recoverable oxidant insult into a chronic
    inability to mount an antioxidant defence.
  cell_types:
  - preferred_term: Dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: NRF2 protein stabilization by DJ-1
    term:
      id: GO:0050821
      label: protein stabilization
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17015834
    reference_title: "DJ-1, a cancer- and Parkinson's disease-associated protein, stabilizes the antioxidant transcriptional master regulator Nrf2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DJ-1 stabilizes Nrf2 by preventing association with its inhibitor
      protein, Keap1, and Nrf2's subsequent ubiquitination.
    explanation: >-
      Defines the molecular mechanism of the DJ-1/NRF2 axis lost in DJ-1
      deficiency.
  - reference: PMID:17015834
    reference_title: "DJ-1, a cancer- and Parkinson's disease-associated protein, stabilizes the antioxidant transcriptional master regulator Nrf2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Without intact DJ-1, Nrf2 protein is unstable, and transcriptional
      responses are thereby decreased both basally and after induction.
    explanation: States the loss-of-function consequence that this node models.
  - reference: PMID:40159591
    reference_title: Redox modulatory role of DJ-1 in Parkinson's disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the DJ-1 or Nrf2 axis, expression of key antioxidant enzymes
      (glutathione peroxidase (GPx), superoxide dismutase (SOD), and heme
      oxygenase-1 (HO-1) in response to oxidative stress is increased, and
      decreased neuronal damage resulting from oxidative stress is achieved.
    explanation: >-
      Identifies the downstream antioxidant enzymes whose induction depends
      on an intact DJ-1/NRF2 axis.
  downstream:
  - target: Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
    causal_link_type: DIRECT
    description: >-
      Failure of NRF2-driven antioxidant transcription leaves reactive oxygen
      species unbuffered in dopaminergic neurons.

- name: Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "parkinsonism_dopaminergic_degeneration#Mitochondrial Complex I Inhibition and Oxidative Stress"
  description: >-
    The convergent cellular lesion is unbuffered oxidative stress with
    mitochondrial dysfunction in substantia nigra pars compacta dopaminergic
    neurons. This is the same convergence node the shared
    parkinsonism_dopaminergic_degeneration module places downstream of
    environmental complex I toxins (MPTP, rotenone, paraquat) - PARK7 loss
    reaches it from the opposite direction, by removing endogenous
    antioxidant defence rather than by adding an exogenous poison. Substantia
    nigra dopaminergic neurons are selectively vulnerable because of their
    high bioenergetic demand and high basal reactive oxygen species load;
    DJ-1 is normally most highly expressed exactly in such
    high-energy-demand, high-ROS cells. Consistent with the human relevance
    of this node, oxidised DJ-1 accumulates in the substantia nigra of ageing
    and idiopathic Parkinson disease brains.
  cell_types:
  - preferred_term: Dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: substantia nigra pars compacta
    term:
      id: UBERON:0002038
      label: substantia nigra
  biological_processes:

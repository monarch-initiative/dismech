notes: >-
  Lump-vs-split rationale. This entry is deliberately kept SEPARATE from the
  existing `Parkinson's Disease` entry (MONDO:0005180), which curates the
  common, largely sporadic, late-onset alpha-synucleinopathy at the broad
  MONDO level and lists PARK7 only as one genetic axis among SNCA, LRRK2,
  PRKN, PINK1, VPS35 and GBA1. The two entries are complementary rather than
  duplicative: (1) MONDO models PARK-DJ1 as a distinct entity
  (MONDO:0011658, a child of MONDO:0017279 young-onset Parkinson disease)
  defined by its causal gene; (2) the primary lesion here is a defined
  molecular loss of function in a redox-sensing cytoprotective protein, not
  the multifactorial exposome-plus-polygenic-risk architecture of common PD;
  (3) the phenotype differs in onset age (median ~30 years), inheritance
  (autosomal recessive rather than sporadic/dominant), and non-motor burden;
  and (4) the alpha-synuclein/Lewy-body arm that defines common PD is
  essentially unverified in PARK-DJ1 - only a single DJ-1 mutation brain
  (L172Q) has ever been examined neuropathologically. This entry therefore
  curates the DJ-1 biochemistry and its causal chain in depth and conforms to
  the shared `parkinsonism_dopaminergic_degeneration` module for the
  nigrostriatal-to-parkinsonism final common pathway, rather than restating
  the synucleinopathy content of the `Parkinson's Disease` entry.

  NEC preflight (the PARK numbered series is a high named-entity-confusion
  risk class): MONDO:0011658 was verified with OAK to carry
  `relationship: RO:0004003 HGNC:16369 ! PARK7`, `xref: OMIM:606324`, and the
  synonyms "PARK7 Parkinson disease" / "PARK7". All curated evidence was
  screened to be about PARK7/DJ-1 and not the locus-adjacent PARK2/PRKN or
  PARK6/PINK1 entities; where a source covers all three recessive genes
  (PMID:22166450, PMID:22956510, PMID:29644727, PMID:19694908) that
  multi-gene scope is stated explicitly in the evidence `explanation`.

  Sourcing provenance (recorded decisions, not omissions). (a) NO
  deep-research artifact was generated for this entry: it was curated
  directly from primary literature located by targeted PubMed
  title/keyword search, with every PMID fetched via `just fetch-reference`
  and every snippet verified against the cached abstract. This was
  deliberate given the high named-entity-confusion risk of the PARK
  numbered series - DR tools resolving "PARK7" or "early-onset
  parkinsonism" are exactly the failure mode #3889 describes, and several
  PMIDs recalled from memory during curation turned out on verification to
  point at unrelated papers and were discarded and re-resolved by title
  search. (b) The GeneReviews chapter PMID:20301402 (Monogenic Parkinson
  Disease Overview) is tagged in `references:` but deliberately cited by no
  evidence item: there is no PARK7-specific GeneReviews chapter, and the
  cached abstract for the monogenic overview is a bare statement of the
  chapter's purpose with no quotable Clinical Characteristics, Diagnosis,
  Management or Genetic Counseling content. Quoting a purpose statement
  would add noise rather than evidence, so it is retained as a tagged
  baseline reference only.


prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate for PARK7-related early-onset Parkinson
    disease exists. The qualitative ULTRA_RARE band is assigned from the size
    of the reported patient corpus - 30 individuals with 20 unique causative
    variants described worldwide as of 2019 - rather than from a measured
    rate. No numeric rate_per_100000 is asserted, deliberately: converting a
    case count into a population rate would be fabrication. The gene-level
    share of early-onset Parkinson disease cases is curated as structured
    `case_fractions` on the PARK7 `genetic` record instead, which is the
    appropriate slot for a genetic-spectrum denominator. For the two-step
    rarity: early-onset Parkinson disease itself accounts for approximately
    3.6% of all Parkinson disease (PMID:22956510, "Approximately 3.6% of
    patients with Parkinson's disease develop symptoms before age 45"), and
    PARK7 explains only ~0.4% of that early-onset group. That 3.6% figure is
    a proportion of PD cases describing the PARENT population, not an
    occurrence measure for this disease, so it is recorded here as a note
    rather than as a second Prevalence record.
  evidence:
  - reference: PMID:30928208
    reference_title: "Familial early onset Parkinson's disease caused by a homozygous frameshift variant in PARK7: Clinical features and literature update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic mutations in PARK7 are a rare cause of autosomal recessive
      early onset Parkinson's disease (EO-PD). To date, 30 individuals
      harbouring 20 unique causative variants have been described.
    explanation: >-
      Establishes rarity and gives the reported-case count that grounds the
      ULTRA_RARE qualitative band.

treatments:
- name: Levodopa-Carbidopa
  description: >-
    Dopamine replacement with levodopa combined with the peripheral
    decarboxylase inhibitor carbidopa is the mainstay of treatment and works
    by restoring striatal dopaminergic transmission downstream of the lost
    nigrostriatal projection. PARK-DJ1 parkinsonism is characteristically and
    durably levodopa-responsive, documented over follow-up periods of six and
    fifteen years in a genetically confirmed family. Because onset is early
    and the disease course long, levodopa-induced dyskinesia is a common
    management problem in this population and argues for careful dose
    titration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: MODULATES
    description: >-
      Exogenous levodopa is decarboxylated to dopamine in surviving terminals
      and other striatal cells, restoring dopaminergic tone to the basal
      ganglia motor circuit. It is purely symptomatic: it does not address the
      upstream DJ-1 loss, the oxidative stress, or the ongoing nigrostriatal
      degeneration.
  target_phenotypes:
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:30928208
    reference_title: "Familial early onset Parkinson's disease caused by a homozygous frameshift variant in PARK7: Clinical features and literature update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brothers were followed over a six and fifteen-year period and
      displayed typical levodopa responsive slowly-progressive Parkinsonism.
    explanation: >-
      Longitudinal human evidence for sustained levodopa responsiveness in
      genetically confirmed PARK7 disease.
  - reference: PMID:22166450
    reference_title: Autosomal recessive parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype is usually characterized by levodopa-responsive
      parkinsonism without atypical features
    explanation: >-
      Establishes levodopa responsiveness as the expected treatment response
      across the recessive early-onset forms including DJ-1 (PARK7).
  notes: >-
    Motor-complication caveat: dyskinesia is relatively common in the
    recessive early-onset parkinsonisms (see the Levodopa-Induced Dyskinesia
    phenotype), so levodopa dosing strategy matters more than in typical
    late-onset disease.

- name: Dopamine Agonist Therapy
  description: >-
    Non-ergot dopamine agonists such as pramipexole act directly on
    postsynaptic striatal dopamine receptors and are commonly used in
    early-onset Parkinson disease, often as initial therapy or as a
    levodopa-sparing adjunct intended to delay motor complications in patients
    facing decades of treatment. The mechanistic rationale is identical to
    levodopa's - replacing dopaminergic tone at the striatal node - but
    without requiring presynaptic conversion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pramipexole
      term:
        id: CHEBI:8356
        label: pramipexole
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: MODULATES
    description: >-
      Direct postsynaptic dopamine receptor agonism restores basal ganglia
      circuit signalling without depending on residual presynaptic dopamine
      synthesis capacity.
  evidence:
  - reference: PMID:22166450
    reference_title: Autosomal recessive parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype is usually characterized by levodopa-responsive
      parkinsonism without atypical features
    explanation: >-
      Indirect support only: the source establishes that the underlying
      deficit is a dopaminergic one that responds to dopamine replacement,
      which is the rationale for dopamine agonists, but it does not evaluate
      agonists specifically in PARK7 disease. Marked PARTIAL accordingly.
  notes: >-
    No PARK7-specific trial or cohort evidence for dopamine agonists exists;
    use here is extrapolated from general early-onset Parkinson disease
    management. Deliberately not asserted as PARK7-validated.

- name: Genetic Counseling
  description: >-
    Counselling for an autosomal recessive condition: recurrence risk for
    siblings of an affected proband is 25%, both parents are obligate
    carriers, and consanguinity is a common context. Counselling also covers
    the implications of the small and incompletely characterised PARK7
    patient corpus for prognostic advice, and carrier testing for at-risk
    relatives. The molecular testing strategy that establishes the diagnosis
    is curated separately under `diagnosis:`.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30928208
    reference_title: "Familial early onset Parkinson's disease caused by a homozygous frameshift variant in PARK7: Clinical features and literature update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic mutations in PARK7 are a rare cause of autosomal recessive
      early onset Parkinson's disease (EO-PD). To date, 30 individuals
      harbouring 20 unique causative variants have been described.
    explanation: >-
      Establishes the biallelic (autosomal recessive) transmission that
      determines the 25% sibling recurrence risk counselled here, and the
      small size of the reported corpus that limits prognostic counselling.

diagnosis:
- name: Molecular Genetic Testing (Sequencing plus Exon Dosage)
  description: >-
    Establishing a PARK7 diagnosis requires demonstrating biallelic
    pathogenic variants, and requires BOTH sequencing and exon-dosage
    (copy-number) analysis: the mutational spectrum includes large genomic
    rearrangements - the founding Dutch family carried a 14,082 bp deletion -
    that sequencing alone will miss, so a sequencing-only panel can return a
    false negative or report an apparently heterozygous carrier when the
    second allele is a deletion.
  evidence:
  - reference: PMID:22166450
    reference_title: Autosomal recessive parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since point mutations and genomic rearrangements can be present,
      sequencing and exon dosage are both required for accurate mutational
      screening of these genes.
    explanation: >-
      Directly specifies the two-pronged molecular testing strategy needed to
      make the diagnosis. Scope note: the source covers all three recessive
      genes (PARK2/PRKN, PINK1, PARK7) together.
- name: Clinical Selection of Patients for Recessive-Gene Testing
  description: >-
    Because PARK7 explains well under 1% of early-onset Parkinson disease,
    the clinical features that raise the pretest probability of a recessive
    monogenic cause matter more than for commoner genes: age at onset under
    40, an affected first-degree relative or sibling, and above all parental
    consanguinity, which raises the mutation yield to 50%. Mutation carriers
    are also more likely to present with rigidity and dystonia.
  evidence:
  - reference: PMID:22956510
    reference_title: "Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were more common in patients with age at onset (AAO) < 40
      (9.5%), an affected first-degree relative (6.9%), an affected sibling
      (28.6%), or parental consanguinity (50%).
    explanation: >-
      Quantifies the clinical features that should raise the pretest
      probability of a recessive monogenic cause and prompt testing. Scope
      note: the cohort covers PARK2/PRKN, PINK1, PARK7 and LRRK2 together.
- name: Documentation of Levodopa Responsiveness
  description: >-
    A sustained, unambiguous response to levodopa is a practical diagnostic
    discriminator that separates PARK-DJ1 from the atypical parkinsonian
    syndromes in the differential of a young patient with parkinsonism, and
    has been documented over six- and fifteen-year follow-up in a
    genetically confirmed PARK7 family.
  evidence:
  - reference: PMID:30928208
    reference_title: "Familial early onset Parkinson's disease caused by a homozygous frameshift variant in PARK7: Clinical features and literature update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brothers were followed over a six and fifteen-year period and
      displayed typical levodopa responsive slowly-progressive Parkinsonism.
    explanation: >-
      Longitudinal documentation of the levodopa response that supports the
      clinical diagnosis in genetically confirmed PARK7 disease.
  - reference: PMID:22166450
    reference_title: Autosomal recessive parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype is usually characterized by levodopa-responsive
      parkinsonism without atypical features
    explanation: >-
      Establishes absence of atypical features plus levodopa responsiveness
      as the expected diagnostic picture across the recessive early-onset
      forms including DJ-1 (PARK7).
  notes: >-
    Dopamine-transporter imaging (DaT SPECT) is the standard workup step that
    would confirm the presynaptic nigrostriatal deficit this entry's
    `Nigrostriatal Dopaminergic Neurodegeneration` node infers, but no
    PARK7-specific imaging series with a quotable result was found; it is
    deliberately not asserted here and is instead listed as a proposed
    experiment under the human/model-mismatch discussion.

discussions:
- discussion_id: park7_dj1_knockout_no_nigral_degeneration
  prompt: >-
    Why do DJ-1 knockout mice - and even parkin/DJ-1/PINK1 triple knockout
    mice aged to 24 months - fail to lose nigral dopaminergic neurons, when
    biallelic PARK7 loss reliably causes nigrostriatal degeneration in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
  - pathophysiology#Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
  rationale: >-
    This is the textbook translational mismatch of the recessive Parkinson
    disease genes. DJ-1 null mice reproduce dopaminergic FUNCTIONAL deficits -
    markedly reduced evoked striatal dopamine overflow, loss of corticostriatal
    long-term depression, open-field hypoactivity - but the substantia nigra
    dopaminergic neuron count is normal. Removing all three recessive PD gene
    products together does not rescue the model: triple knockouts still have
    normal nigral and locus coeruleus neuron numbers at 3, 16 and 24 months.
    The mismatch is mechanistically meaningful because it means that no
    existing rodent genetic model tests the step this entry most needs - the
    transition from cellular oxidative/bioenergetic stress to actual
    dopaminergic neuron death - and because it admits at least three distinct
    interpretations that current data do not separate: (a) mouse lifespan is
    simply too short for a slowly cumulative oxidative injury to reach the
    degeneration threshold; (b) DJ-1 is protective/modulatory rather than
    strictly required for nigral neuron survival, with the human phenotype
    requiring an additional insult or cumulative exposome that mice do not
    experience; or (c) species differences in dopaminergic neuron oxidant
    burden, neuromelanin (absent in mouse nigra), and antioxidant redundancy
    mean the mouse nigra is simply not the vulnerable cell population the
    human nigra is. Compounding this, the human end of the comparison is
    almost unconstrained: only ONE PARK7 patient brain has ever been examined
    neuropathologically. Any conclusion drawn from a negative mouse result
    should therefore be treated as uninformative about human PARK-DJ1 rather
    than as evidence against the mechanism.
  proposed_experiments:
  - experiment_id: exp_park7_multibrain_neuropathology
    name: Multi-brain neuropathological characterisation of PARK7 mutation carriers
    description: >-
      Coordinate international brain banks to obtain and systematically
      examine every available brain from a confirmed biallelic PARK7 carrier:
      stereological nigral dopaminergic cell counts, alpha-synuclein and Lewy
      body staging, and oxidative/carbonyl damage markers, benchmarked against
      age-matched idiopathic Parkinson disease and control brains. This is the
      only way to constrain the human end of the comparison, which currently
      rests on a single L172Q case.
    experiment_type:
      preferred_term: human post-mortem neuropathological case series
    readouts:
    - name: Nigral dopaminergic neuron loss
      target: pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
      direction: POSITIVE
    decision_criterion: >-
      Consistent stereological nigral dopaminergic cell loss across multiple
      PARK7 brains would confirm the human effector node and establish that
      the negative mouse result is a model limitation rather than evidence
      against the mechanism.
    would_support:
    - pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
  - experiment_id: exp_park7_ipsc_dopaminergic_ageing
    name: Aged patient-derived iPSC midbrain dopaminergic neurons and organoids
    description: >-
      Differentiate midbrain dopaminergic neurons and midbrain organoids from
      PARK7 null and L166P patient iPSCs alongside isogenic corrected
      controls, age them in culture, and challenge with sub-threshold
      oxidative and dicarbonyl stressors. Measure survival, mitochondrial
      function, and reactive oxygen species to test whether HUMAN dopaminergic
      neurons - unlike mouse - degenerate on DJ-1 loss.
    experiment_type:
      preferred_term: patient-derived iPSC neuronal model experiment
    perturbations:
    - name: Oxidative and dicarbonyl challenge of DJ-1-null human dopaminergic neurons
      target: pathophysiology#Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
      description: >-
        Sub-threshold paraquat/hydrogen peroxide and methylglyoxal exposure of
        PARK7-null versus isogenic-corrected human midbrain dopaminergic
        neurons.
    readouts:
    - name: Dopaminergic neuron survival
      target: pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
      direction: POSITIVE
    decision_criterion: >-
      Selective death of PARK7-null human dopaminergic neurons under stress,
      rescued by isogenic correction, would show the stress-to-death step is
      human-permissive and mouse-refractory.
    would_support:
    - pathophysiology#Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
  - experiment_id: exp_park7_longitudinal_dat_neuromelanin_imaging
    name: Longitudinal dopaminergic imaging in PARK7 biallelic carriers
    description: >-
      Serial dopamine-transporter SPECT/PET and neuromelanin-sensitive MRI in
      biallelic PARK7 carriers versus matched idiopathic early-onset Parkinson
      disease, to quantify the in vivo human rate of nigrostriatal loss - the
      benchmark any animal or cellular model must reproduce.
    experiment_type:
      preferred_term: longitudinal neuroimaging cohort study
    readouts:
    - name: Rate of striatal dopamine transporter signal decline
      target: pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
      direction: NEGATIVE
    decision_criterion: >-
      A measurable, progressive decline in nigrostriatal imaging markers in
      PARK7 carriers establishes the in vivo human degeneration rate against
      which the null mouse phenotype can be judged.
  - experiment_id: exp_park7_second_hit_dj1_null_mice
    name: Second-hit and long-lived-model designs in DJ-1 null animals
    description: >-
      Challenge DJ-1 null mice with sub-threshold oxidative or dicarbonyl
      stressors that do not cause degeneration in wild-type animals, and in
      parallel generate DJ-1 loss-of-function in a longer-lived or
      neuromelanin-bearing species, to discriminate the "mouse lifespan too
      short" interpretation from the "DJ-1 is protective but not required"
      interpretation.
    experiment_type:
      preferred_term: gene-environment interaction animal model experiment
    perturbations:
    - name: Sub-threshold oxidative or dicarbonyl second hit
      target: pathophysiology#Oxidative Stress and Mitochondrial Dysfunction in Nigral Dopaminergic Neurons
      description: >-
        Chronic low-dose paraquat, rotenone, or methylglyoxal exposure in DJ-1
        null versus wild-type animals.
    decision_criterion: >-
      Nigral degeneration emerging in DJ-1 null but not wild-type animals
      under a second hit would support the protective-not-required reading;
      degeneration emerging only with extended lifespan would support the
      lifespan reading.
  evidence:
  - reference: PMID:15721235
    reference_title: Nigrostriatal dopaminergic deficits and hypokinesia caused by inactivation of the familial Parkinsonism-linked gene DJ-1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although DJ-1(-/-) mice had normal numbers of dopaminergic neurons in
      the substantia nigra, evoked dopamine overflow in the striatum was
      markedly reduced, primarily as a result of increased reuptake.
    explanation: >-
      The canonical demonstration that DJ-1 null mice reproduce dopaminergic
      dysfunction without nigral cell loss.
  - reference: PMID:19694908
    reference_title: Absence of nigral degeneration in aged parkin/DJ-1/PINK1 triple knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that triple knockout mice lacking Parkin, DJ-1, and PINK1 have
      normal morphology and numbers of dopaminergic and noradrenergic neurons
      in the substantia nigra and locus coeruleus, respectively, at the ages
      of 3, 16, and 24 months.
    explanation: >-
      Shows that combined inactivation of all three recessive PD genes still
      fails to produce nigral degeneration within the mouse lifespan.
  - reference: PMID:19694908
    reference_title: Absence of nigral degeneration in aged parkin/DJ-1/PINK1 triple knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      suggesting that these genes may be protective rather than essential for
      the survival of dopaminergic neurons during the aging process
    explanation: >-
      The authors' own preferred interpretation, curated here as one of the
      competing readings of the mismatch.
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DJ-1 gene knockout mice, despite exhibiting a normal number of
      dopaminergic neurons in the substantia nigra, show subtle neurochemical
      and behavioral abnormalities
    explanation: >-
      Review-level confirmation that the mouse model captures neurochemistry
      and behaviour but not neurodegeneration.

- discussion_id: park7_glyoxalase_versus_deglycase_controversy
  prompt: >-
    Is DJ-1's catalytic activity toward reactive dicarbonyls a
    glutathione-independent glyoxalase activity on free methylglyoxal, a
    protein deglycase activity repairing already-formed glycation adducts, or
    neither in vivo - and does dicarbonyl stress contribute materially to
    human PARK-DJ1 neurodegeneration?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of DJ-1 Dicarbonyl Detoxification Capacity
  rationale: >-
    This is a genuine, unresolved scientific disagreement, not a curation
    ambiguity, and it is curated as a controversy rather than asserted in
    either direction. The glyoxalase claim (DJ-1 converts free glyoxal and
    methylglyoxal to glycolate and lactate without glutathione) and the
    deglycase claim (DJ-1 repairs methylglyoxal- and glyoxal-glycated
    cysteine, arginine and lysine residues on proteins) were published as
    competing biochemical accounts of the same protein. The deglycase claim
    was then directly challenged twice: a Drosophila study detected no
    contribution of DJ-1 to methylglyoxal survival or adduct accumulation in
    vivo and ascribed the reported deglycation to a TRIS buffer artifact,
    prompting published rebuttal correspondence in the same journal; and an
    independent kinetic analysis showed that the fast equilibrium between
    free methylglyoxal and hemithioacetals (equilibrium constant ~500 per
    molar, hemithioacetal half-life 12 s) means that glyoxalase-mediated
    removal of free methylglyoxal forces spontaneous hemithioacetal
    decomposition that can be mistaken for deglycase activity. That second
    study concluded that DJ-1 does not possess protein deglycase activity -
    but ALSO found that DJ-1-knockout human cells were not sensitised to
    acute methylglyoxal toxicity, so it does not rescue the glyoxalase arm as
    a disease-relevant protective mechanism either. The practical consequence
    for this entry is that the dicarbonyl node and its downstream edge are
    scoped to hypothesis groups rather than folded into the canonical chain,
    and no PARK-DJ1 clinical or therapeutic claim is made on the basis of
    dicarbonyl biology.
  proposed_experiments:
  - experiment_id: exp_park7_human_age_quantification
    name: Quantification of methylglyoxal-derived AGEs in PARK7 patient tissue
    description: >-
      Measure methylglyoxal-derived advanced glycation end-products (MG-H1,
      argpyrimidine, carboxyethyl-lysine) by mass spectrometry in substantia
      nigra tissue and CSF from biallelic PARK7 carriers versus idiopathic
      Parkinson disease and controls, to test whether dicarbonyl stress is
      actually elevated in the human disease rather than only in reconstituted
      systems.
    experiment_type:
      preferred_term: targeted mass spectrometry biomarker study
    readouts:
    - name: Methylglyoxal-derived advanced glycation end-product burden
      target: pathophysiology#Loss of DJ-1 Dicarbonyl Detoxification Capacity
      direction: POSITIVE
    decision_criterion: >-
      Elevated MG-derived AGEs in PARK7 nigra/CSF relative to controls would
      promote the dicarbonyl node from hypothesis-scoped to canonical; no
      elevation would justify demoting it.
    would_support:
    - pathophysiology#Loss of DJ-1 Dicarbonyl Detoxification Capacity
  - experiment_id: exp_park7_separation_of_function_alleles
    name: Separation-of-function DJ-1 alleles in human dopaminergic neurons
    description: >-
      Design structure-guided DJ-1 alleles that ablate glyoxalase activity
      while preserving Cys106 redox sensing and NRF2 stabilisation, and
      conversely, and express each in PARK7-null patient-derived iPSC
      dopaminergic neurons to determine which activity is required for
      dopaminergic neuron survival under stress.
    experiment_type:
      preferred_term: structure-guided separation-of-function rescue experiment
    perturbations:
    - name: Activity-selective DJ-1 rescue alleles
      target: pathophysiology#Loss of DJ-1 Dicarbonyl Detoxification Capacity
      description: >-
        Re-expression of glyoxalase-dead but redox-competent DJ-1, and
        redox-dead but glyoxalase-competent DJ-1, in PARK7-null human
        dopaminergic neurons.
    decision_criterion: >-
      If only the redox-competent allele rescues survival, the dicarbonyl arm
      is dispensable for the disease mechanism; if the glyoxalase-competent
      allele also rescues, dicarbonyl detoxification is disease-relevant.
    would_refute:
    - pathophysiology#Loss of DJ-1 Dicarbonyl Detoxification Capacity
  - experiment_id: exp_park7_buffer_controlled_kinetics_replication
    name: Multi-laboratory buffer-controlled replication of DJ-1 enzyme kinetics
    description: >-
      Standardised, TRIS-free, buffer-controlled re-measurement of DJ-1
      glyoxalase and deglycase kinetics across independent laboratories using
      shared protein preparations and substrates, since a buffer artifact is
      one of the explicit competing explanations for the discrepant results.
    experiment_type:
      preferred_term: multi-laboratory enzyme kinetics replication study
    decision_criterion: >-
      Reproducible deglycase activity under TRIS-free conditions across
      laboratories would restore the deglycase hypothesis; its absence would
      settle the controversy in favour of glyoxalase-only activity.
  evidence:
  - reference: PMID:22523093
    reference_title: Human DJ-1 and its homologs are novel glyoxalases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Purified DJ-1 proteins exhibit typical Michaelis-Menten kinetics, which
      were abolished completely in the mutants of essential catalytic
      residues, consisting of cysteine and glutamic acid.
    explanation: Enzymological support for the glyoxalase side of the controversy.
  - reference: PMID:25416785
    reference_title: "Parkinsonism-associated protein DJ-1/Park7 is a major protein deglycase that repairs methylglyoxal- and glyoxal-glycated cysteine, arginine, and lysine residues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that DJ-1-associated Parkinsonism results from
      excessive protein glycation and establishes DJ-1 as a major
      anti-glycation and anti-aging protein.
    explanation: >-
      The deglycase side of the controversy, stated as an explicit pathogenic
      model for PARK-DJ1.
  - reference: PMID:27903648
    reference_title: Evidence Against a Role for the Parkinsonism-associated Protein DJ-1 in Methylglyoxal Detoxification.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we could detect no contribution of DJ-1 to survival to MG challenge or
      to accumulation of MG protein adducts
    explanation: >-
      In vivo refutation of any DJ-1 contribution to methylglyoxal handling.
  - reference: PMID:31653696
    reference_title: The apparent deglycase activity of DJ-1 results from the conversion of free methylglyoxal present in fast equilibrium with hemithioacetals and hemiaminals.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Experiments with CRISPR/Cas-generated DJ-1-knockout HEK293 cells
      revealed that DJ-1 does not protect against acute MGO toxicity or
      carboxymethylation of lysine residues in cells.
    explanation: >-
      Human-cell knockout data arguing against a protective dicarbonyl role
      for DJ-1 under either enzymological account.

- discussion_id: park7_synucleinopathy_status_unknown
  prompt: >-
    Is PARK7-related early-onset Parkinson disease a synucleinopathy? Only a
    single mutation-carrier brain has been examined, and it showed Lewy body
    pathology.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
  rationale: >-
    The `Parkinson's Disease` entry models alpha-synuclein aggregation and
    Lewy pathology as a central mechanism, and the shared
    parkinsonism_dopaminergic_degeneration module carries an alpha-synuclein
    arm that conforming disorders may include or omit. This entry deliberately
    OMITS that arm, because the evidence to include it does not exist: exactly
    one DJ-1-mutation brain (L172Q) has been analysed neuropathologically. It
    did show Lewy bodies, which is suggestive but is a single observation.
    Cell-biological work independently shows that DJ-1 acts as a
    redox-dependent chaperone whose activity extends to alpha-synuclein,
    giving a plausible mechanistic route from DJ-1 loss to alpha-synuclein
    aggregation - but plausibility from in vitro chaperone assays plus one
    autopsy is not a basis for asserting a synucleinopathy node in the
    pathograph. Resolving this determines whether PARK-DJ1 should declare
    conformance to the module's alpha-synuclein node and whether
    synuclein-directed therapies are mechanistically rational here.
  proposed_experiments:
  - experiment_id: exp_park7_synuclein_neuropathology_survey
    name: Systematic alpha-synuclein neuropathology survey of PARK7 brains
    description: >-
      Via international brain-bank coordination, apply alpha-synuclein
      immunohistochemistry, Lewy body staging, and oxidised-DJ-1 staining to
      every obtainable brain from a biallelic PARK7 carrier, to determine
      whether Lewy pathology is a consistent feature or an isolated finding in
      the single reported L172Q case.
    experiment_type:
      preferred_term: human post-mortem immunohistochemistry survey
    readouts:
    - name: Alpha-synuclein Lewy pathology burden
      target: pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
      direction: POSITIVE
    decision_criterion: >-
      Consistent Lewy pathology across multiple PARK7 brains would justify
      adding an alpha-synuclein node and declaring conformance to the module's
      alpha-synuclein arm; its absence would confirm the current omission.
  - experiment_id: exp_park7_synuclein_seed_amplification
    name: Alpha-synuclein seed amplification assay in living PARK7 carriers
    description: >-
      Perform alpha-synuclein seed amplification (RT-QuIC) on CSF and skin
      biopsy from living biallelic PARK7 carriers, which can establish
      synucleinopathy status in vivo without waiting for autopsy material and
      can be repeated longitudinally.
    experiment_type:
      preferred_term: seed amplification assay biomarker study
    readouts:
    - name: CSF and skin alpha-synuclein seeding activity
      target: pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
      direction: POSITIVE
    decision_criterion: >-
      Positive seeding activity in a majority of PARK7 carriers would classify
      PARK-DJ1 as a synucleinopathy in vivo; consistently negative assays
      would establish it as a non-synuclein dopaminergic degeneration.
  evidence:
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      very little is known regarding the neuropathology in brains from
      patients carrying DJ-1 mutations
    explanation: >-
      States the gap directly: the neuropathology of PARK-DJ1 is essentially
      uncharacterised.
  - reference: PMID:15502874
    reference_title: DJ-1 is a redox-dependent molecular chaperone that inhibits alpha-synuclein aggregate formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further demonstrate that DJ-1 chaperone activity in vivo extends to
      alpha-synuclein, a protein implicated in PD pathogenesis.
    explanation: >-
      Provides the mechanistic plausibility for a synuclein link. Marked
      PARTIAL because chaperone activity in a cellular system does not
      establish that human PARK-DJ1 brains accumulate alpha-synuclein.

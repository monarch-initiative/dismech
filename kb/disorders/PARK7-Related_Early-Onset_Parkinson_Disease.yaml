name: PARK7-Related Early-Onset Parkinson Disease
creation_date: "2026-07-31T00:00:00Z"
description: >-
  PARK7-related early-onset Parkinson disease (PARK-DJ1, autosomal recessive
  early-onset Parkinson disease 7) is a rare monogenic parkinsonism caused by
  biallelic loss-of-function variants in PARK7, which encodes DJ-1. DJ-1 is a
  small, ubiquitously expressed, homodimeric protein whose conserved cysteine
  at position 106 (Cys106) is progressively oxidized (Cys-SOH to Cys-SO2H to
  Cys-SO3H), making it a redox sensor and cytoprotective effector: oxidized
  DJ-1 relocalizes to the outer mitochondrial membrane, stabilizes the
  antioxidant master regulator NRF2 by preventing KEAP1-mediated
  ubiquitination, and acts as a redox-dependent molecular chaperone that
  inhibits alpha-synuclein aggregation. DJ-1 also carries a
  glutathione-independent catalytic activity toward the reactive dicarbonyl
  methylglyoxal, though whether this constitutes a glyoxalase (free
  methylglyoxal to lactate) or a protein deglycase (repair of glycated
  residues) activity remains an active and unresolved controversy. Biallelic
  loss of DJ-1 removes this multi-pronged cytoprotective buffer, leaving
  substantia nigra pars compacta dopaminergic neurons - already burdened by
  high bioenergetic demand and dopamine-derived oxidant load - vulnerable to
  oxidative and dicarbonyl stress and mitochondrial dysfunction. The result is
  nigrostriatal dopaminergic degeneration, striatal dopamine deficiency, and
  levodopa-responsive parkinsonism with onset typically in the third decade,
  often accompanied by dystonia, early dyskinesia, and a high burden of
  psychiatric and cognitive non-motor features. PARK7 is the rarest of the
  three classic autosomal recessive early-onset Parkinson disease genes,
  accounting for roughly 0.4% of early-onset cases in a systematic review.
category: Mendelian
parents:
- Neurodegenerative Disease
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism

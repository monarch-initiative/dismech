    explanation: >-
      ClinGen records the mode of inheritance for the PARK7-Parkinson disease
      relationship as AR (autosomal recessive).
  - reference: PMID:19694908
    reference_title: Absence of nigral degeneration in aged parkin/DJ-1/PINK1 triple knockout mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recessively inherited loss-of-function mutations in the parkin, DJ-1, or
      PINK1 gene are linked to familial cases of early-onset Parkinson's
      diseases (PD), and heterozygous mutations are associated with increased
      incidence of late-onset PD.
    explanation: >-
      Supports both the recessive mode and the reported heterozygote
      late-onset risk association. Marked PARTIAL because the heterozygote
      claim is a background statement, not a result of the cited study, and it

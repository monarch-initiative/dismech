genetic:
- name: PARK7
  gene_term:
    preferred_term: PARK7
    term:
      id: hgnc:16369
      label: PARK7
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PARK7 encodes DJ-1. Pathogenic variants act through loss of function and
    must be biallelic. The mutational spectrum spans large exonic deletions
    (requiring exon-dosage analysis in addition to sequencing), frameshift and
    nonsense variants, and destabilising missense substitutions such as L166P
    that lower steady-state protein levels and abolish homodimerisation.
    Because both point mutations and genomic rearrangements occur, sequencing
    alone is an inadequate screen. ClinGen's Parkinson's Disease Gene Curation
    Expert Panel classifies the PARK7-Parkinson disease relationship as
    Definitive with autosomal recessive inheritance.
  case_fractions:
  - population: Early-onset Parkinson disease, systematic review of published cohorts (>5800 unique cases)
    case_fraction_percent: 0.4
    notes: >-
      Weighted mean proportion of early-onset Parkinson disease cases carrying
      PARK7 (DJ-1) mutations, versus 8.6% for PARK2 (parkin) and 3.7% for
      PINK1 in the same analysis - PARK7 is by a wide margin the rarest of the
      three classic recessive EOPD genes.
    evidence:
    - reference: PMID:22956510
      reference_title: "Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the weighted mean proportion of cases with PARK2 (parkin), PINK1, and
        PARK7 (DJ-1) mutations was 8.6%, 3.7%, and 0.4%, respectively
      explanation: >-
        Directly quantifies the PARK7 share of early-onset Parkinson disease
        cases in a systematic review of >5800 unique cases.
  - population: Sporadic early-onset Parkinson disease
    case_fraction_low: 1.0
    case_fraction_high: 2.0
    notes: >-
      Expert-review estimate for DJ-1 among sporadic early-onset cases,
      alongside 1-8% for PINK1; higher than the pooled systematic-review

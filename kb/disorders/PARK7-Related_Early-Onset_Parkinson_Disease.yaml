    reference_title: Absence of nigral degeneration in aged parkin/DJ-1/PINK1 triple knockout mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each of which was required for nigral neuron survival in the aging
      human brain
    explanation: >-
      States the premise underlying this node: DJ-1 (alongside parkin and
      PINK1) is required for nigral neuron survival in the ageing human
      brain. Tagged OTHER because the quoted clause is the authors' framing
      of the human genetics, not a result of their mouse experiment.
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has been analyzed thus far, which notably exhibited Lewy body (LB)
      pathology
    explanation: >-
      The only direct human neuropathological observation in PARK-DJ1 (the
      quoted clause refers to the single analysed DJ-1 L172Q brain). Marked
      PARTIAL because a single autopsy cannot establish the general
      neuropathology of the entity.
  downstream:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    causal_link_type: DIRECT
    description: >-
      Loss of the nigrostriatal projection depletes striatal dopamine.

- name: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
  biological_scale: TISSUE
  role: effector
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  description: >-
    Depletion of striatal dopamine unbalances the basal ganglia
    thalamocortical motor circuit and produces the cardinal parkinsonian
    signs - bradykinesia, rigidity, and tremor - with prominent dystonia in
    this early-onset recessive form. Because the deficit is a dopamine
    deficiency in an otherwise responsive circuit, PARK-DJ1 parkinsonism is
    characteristically and durably levodopa-responsive, which is also the
    mechanistic rationale for dopamine replacement therapy. The same circuit
    deficit, chronically over-stimulated by pulsatile levodopa, underlies the
    relatively early motor complications (dyskinesia) reported in this and
    the other recessive early-onset forms. Scale note: tagged TISSUE because
    the node's substrate is the striatum and the basal ganglia
    thalamocortical circuit; the organism-level motor syndrome it produces
    is captured in `phenotypes` rather than bundled into this node.
  cell_types:
  - preferred_term: Striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  biological_processes:
  - preferred_term: dopamine biosynthetic process
    term:
      id: GO:0042416
      label: dopamine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22166450
    reference_title: Autosomal recessive parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      caused by mutations in parkin (PARK2), PINK1 (PARK6), or DJ-1 (PARK7),
      the phenotype is usually characterized by levodopa-responsive
      parkinsonism without atypical features
    explanation: >-
      Establishes the levodopa-responsive parkinsonian endpoint. The source
      covers all three recessive genes together and explicitly includes DJ-1
      (PARK7).
  - reference: PMID:29644727
    reference_title: "Genotype-Phenotype Relations for the Parkinson's Disease Genes Parkin, PINK1, DJ1: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an overall clinically typical form of PD with excellent treatment
      response, dystonia and dyskinesia being relatively common and cognitive
      decline relatively uncommon
    explanation: >-
      Systematic-review confirmation of the levodopa-responsive circuit
      phenotype with common dystonia and dyskinesia. Scope note: the review
      pools PARK-Parkin, PARK-PINK1 and PARK-DJ1.


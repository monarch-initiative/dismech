    reference_title: Redox modulatory role of DJ-1 in Parkinson's disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Oxidized DJ-1 (OxiDJ-1) is generated in aging brains, particularly in
      the substantia nigra (SN), and is correlated with PD progression
    explanation: >-
      Anchors the oxidative-stress node to the human substantia nigra rather
      than to cell culture alone.
  - reference: PMID:31484320
    reference_title: "DJ-1 in Parkinson's Disease: Clinical Insights and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DJ-1 is highly expressed in cells with high energy demands, hence cells
      with higher levels of reactive oxygen species.
    explanation: >-
      Explains why loss of DJ-1 preferentially unmasks injury in
      high-bioenergetic-demand, high-ROS cells such as nigral dopaminergic
      neurons.
  - reference: PMID:12446870
    reference_title: Mutations in the DJ-1 gene associated with autosomal recessive early-onset parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The function of the DJ-1 protein remains unknown, but evidence suggests
      its involvement in the oxidative stress response.
    explanation: >-
      The founding report already placed DJ-1 in the oxidative stress
      response. Marked PARTIAL because it flags the function as then-unknown
      and does not itself demonstrate nigral oxidative injury.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic oxidative and bioenergetic stress in a selectively vulnerable
      neuronal population drives its progressive degeneration. Marked
      indirect because the proximate death mechanism in human PARK-DJ1 nigral
      neurons has not been established (see the human/model mismatch
      discussion).

- name: Nigrostriatal Dopaminergic Neurodegeneration
  biological_scale: TISSUE
  role: effector
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  description: >-
    Progressive loss of substantia nigra pars compacta dopaminergic neurons
    and their nigrostriatal projection - the shared effector lesion of all
    dopaminergic parkinsonisms. In PARK-DJ1 this is inferred clinically and
    from dopaminergic imaging rather than from neuropathology: only a single
    brain from a patient with a DJ-1 mutation (L172Q) has ever been analysed,
    and it showed Lewy body pathology, so whether PARK-DJ1 is routinely a
    synucleinopathy is unknown. Rodent models are explicitly discordant here:
    DJ-1 knockout mice, and even parkin/DJ-1/PINK1 triple knockout mice up to
    24 months, retain normal numbers of nigral dopaminergic neurons while
    showing dopaminergic functional deficits - a human/model mismatch curated
    as a discussion below.

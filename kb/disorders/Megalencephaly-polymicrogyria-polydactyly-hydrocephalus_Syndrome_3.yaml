name: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus Syndrome 3
creation_date: "2026-11-02T23:55:00Z"
category: Mendelian
description: >-
  Megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3 (MPPH3) is
  the CCND2 form of MPPH syndrome, a congenital brain overgrowth disorder. It is
  caused by heterozygous, usually de novo, variants in the last exon of CCND2
  that alter residues around the GSK-3beta phosphorylation site Thr280 or
  truncate the protein before it. The variant cyclin D2 escapes
  phosphorylation-dependent proteasomal degradation and accumulates, keeping
  cortical progenitors cycling. Affected children have megalencephaly with
  bilateral perisylvian polymicrogyria, ventriculomegaly or hydrocephalus,
  oromotor dysfunction, intellectual disability and, frequently, epilepsy and
  postaxial polydactyly. Cyclin D2 stabilization is also the proposed point of
  convergence with the PIK3R2 (MPPH1) and AKT3 (MPPH2) forms, where upstream
  PI3K-AKT activation inhibits GSK-3beta.
disease_term:
  preferred_term: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3
  term:
    id: MONDO:0014408

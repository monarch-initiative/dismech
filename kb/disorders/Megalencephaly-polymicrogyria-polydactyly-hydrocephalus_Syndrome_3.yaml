    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We note that CCND2-mutated MPPH patients have polydactyly more frequently
      than those with PI3K-AKT pathway mutations (Supplementary Table 1), but the
      mechanism underlying this phenotypic difference remains to be explored.
    explanation: >-
      Polydactyly is relatively enriched in the CCND2 form; the mechanism is not
      known, so no causal edge is drawn to this phenotype.

genetic:
- name: CCND2
  gene_term:
    preferred_term: CCND2
    term:
      id: hgnc:1583
      label: CCND2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    Heterozygous, usually de novo, variants in the last exon of CCND2 that
    alter residues around Thr280 (recurrently p.Thr280Asn, p.Thr280Ala and
    p.Pro281Arg) or truncate the protein before it (p.Lys270*).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_8657a0bf-65fa-4413-b4e8-e64193c2731e-2025-05-27T170000.000Z
    evidence:

    snippet: >-
      MPPH syndrome is an autosomal dominant disorder typically caused by a de
      novo pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance for MPPH syndrome as a whole,
      which includes the CCND2 form.
  - reference: CGGV:assertion_8657a0bf-65fa-4413-b4e8-e64193c2731e-2025-05-27T170000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CCND2 | HGNC:1583 | megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3 | MONDO:0014408 | AD | Definitive"

  description: >-
    MPPH syndrome is autosomal dominant. Almost all affected individuals carry a
    de novo germline variant; ClinGen curates CCND2 for this disease under an
    autosomal dominant mode of inheritance.
  evidence:
  - reference: PMID:27854409
    reference_title: MPPH Syndrome.
    supports: SUPPORT

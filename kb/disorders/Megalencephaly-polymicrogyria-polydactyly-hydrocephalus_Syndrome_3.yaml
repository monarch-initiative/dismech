    Caused by postzygotic PIK3CA variants; shares megalencephaly and
    polymicrogyria but adds capillary malformations and segmental overgrowth.
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      postzygotic mutations of PIK3CA cause megalencephaly-capillary
      malformation syndrome (MCAP)3
    explanation: Places MCAP in the same PI3K-AKT megalencephaly family.
- name: Megalencephaly-polydactyly syndrome
  disease_term:
    preferred_term: megalencephaly-polydactyly syndrome
    term:
      id: MONDO:0958279
      label: megalencephaly-polydactyly syndrome
  description: >-
    Caused by stabilizing MYCN variants; shares megalencephaly, ventriculomegaly

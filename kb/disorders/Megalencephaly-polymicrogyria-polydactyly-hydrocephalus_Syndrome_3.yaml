    explanation: A further de novo truncating variant before Thr280 in an MPPH patient.
diagnosis:
- name: Brain MRI
  description: >-
    Establishes the clinical diagnosis from the two core features,
    megalencephaly and polymicrogyria, and is repeated for surveillance of
    hydrocephalus and cerebellar tonsillar ectopia: every six months from birth
    to two years, then yearly to six years.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:27854409
    reference_title: MPPH Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical diagnosis of MPPH syndrome can be established in individuals
      with the two core features: megalencephaly and polymicrogyria (PMG).
    explanation: Both core features are imaging findings.
  - reference: PMID:27854409
    reference_title: MPPH Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain MRI to detect hydrocephalus and/or cerebellar tonsillar ectopia is
      provisionally recommended every six months from birth to age two years,
      and yearly from age two to six years.
    explanation: GeneReviews surveillance schedule.
- name: Molecular genetic testing
  description: >-
    Confirms the diagnosis by finding a heterozygous pathogenic variant in
    CCND2; AKT3 and PIK3R2 are tested alongside it because the three forms
    overlap clinically.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27854409
    reference_title: MPPH Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The molecular diagnosis of MPPH syndrome is established in a proband with
      some of the suggestive clinical and imaging features by identification of
      a heterozygous pathogenic variant in one of three genes: AKT3, CCND2, or
      PIK3R2.
    explanation: GeneReviews molecular diagnostic criterion.

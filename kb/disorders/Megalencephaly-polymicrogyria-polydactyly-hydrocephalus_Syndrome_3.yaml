pathophysiology:
- name: Distal CCND2 Variant Disrupting the Thr280 Phosphodegron
  description: >-
    Heterozygous germline variants in the final exon of CCND2 alter conserved
    residues around Thr280, the residue GSK-3beta phosphorylates to mark cyclin
    D2 for degradation, or truncate the protein before it. The truncating
    variants lie in the last exon and are not expected to trigger
    nonsense-mediated decay, so a stable, shortened protein is made.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CCND2
    term:
      id: hgnc:1583
      label: CCND2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, all mutations in our MPPH cohort either alter highly
      conserved residues surrounding p.Thr280, or truncate the protein prior to
      this phosphorylation site (p.Lys270X).
    explanation: >-
      The discovery cohort's variants all fall around, or truncate before, the
      Thr280 phosphorylation site.
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the latter mutation lies in the final exon, it is predicted not to
      induce nonsense-mediated mRNA decay.
    explanation: >-
      Explains why the truncating variant yields a protein rather than a null
      allele.
  downstream:
  - target: Resistance of Cyclin D2 to Proteasomal Degradation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24705253
      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutant CCND2 was resistant to proteasomal degradation in vitro compared
        to wild-type CCND2.
      explanation: >-
        Patient variant cyclin D2 is degraded more slowly than wild type in
        cultured cells.
- name: Resistance of Cyclin D2 to Proteasomal Degradation
  description: >-
    Without Thr280 phosphorylation, cyclin D2 is not polyubiquitinated and
    escapes proteasomal degradation, so the protein accumulates. Upstream
    PI3K-AKT activation, which inhibits GSK-3beta, produces the same
    accumulation, making cyclin D2 stabilization the proposed shared step across
    the MPPH genes.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CCND2
    term:
      id: hgnc:1583
      label: CCND2
  biological_processes:
  - preferred_term: proteasomal degradation of cyclin D2
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: cyclin D2 regulation of CDK4/6
    term:
      id: GO:0016538
      label: cyclin-dependent protein serine/threonine kinase regulator activity
    modifier: INCREASED
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The p.Thr280Ala mutant cyclin D2 cannot be phosphorylated, does not become
      polyubiquitinated, and thus is resistant to degradation
    explanation: >-
      States the biochemical basis of the stabilization for a recurrent patient
      variant.
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The PI3K-AKT pathway modulates GSK-3β activity, and cells from individuals
      with PIK3CA, PIK3R2 or AKT3 mutations showed similar CCND2 accumulation.
    explanation: >-
      Shows the same cyclin D2 accumulation in cells carrying upstream pathway
      variants, the basis for treating it as a convergence point.
  downstream:
  - target: Expansion of Proliferating Cortical Progenitors
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24705253
      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In utero electroporation of mutant CCND2 into embryonic mouse brains
        produced more proliferating transfected progenitors and a smaller
        fraction of progenitors exiting the cell cycle compared to cells
        electroporated with wild-type CCND2.
      explanation: >-
        Expressing the stabilized variant in the developing mouse cortex keeps
        more progenitors in the cell cycle than wild-type cyclin D2.
- name: Expansion of Proliferating Cortical Progenitors
  description: >-
    Stabilized cyclin D2 keeps cortical progenitors cycling and reduces the
    fraction that exits the cell cycle. In the embryonic mouse cortex cyclin D2
    is expressed mainly in Tbr2-positive intermediate progenitors of the
    subventricular zone and in some radial glia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neural progenitor proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: INCREASED
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, expression of phosphodeficient forms of CCND2 increases progenitor
      proliferation and the proportion of cells undergoing mitosis, with a
      concomitant decrease in the exit fraction.
    explanation: >-
      Summarizes the in utero electroporation result in embryonic mouse cortex.
  downstream:
  - target: Megalencephaly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24705253
      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These observations suggest that cyclin D2 stabilization, caused by CCND2
        mutation or PI3K-AKT activation, is a unifying mechanism in
        PI3K-AKT-related megalencephaly syndromes.
      explanation: >-
        The authors' conclusion links progenitor expansion by stabilized cyclin
        D2 to brain overgrowth. It is an inference from the mouse and cell
        data, not a measurement of brain size.
  - target: Bilateral Perisylvian Polymicrogyria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not shown: polymicrogyria may follow from a disturbed balance
      between basal (intermediate) progenitors and radial glia.
    evidence:
    - reference: PMID:24705253
      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Polymicrogyria in MPPH patients may be related to an altered relationship
        between basal progenitors and radial glia.
      explanation: >-
        A hypothesis offered by the authors, so the edge is marked indirect.
phenotypes:
- name: Megalencephaly
  category: Nervous System
  description: >-
    Brain overgrowth present from birth, with head circumference from normal to
    6 SD above the mean at birth and 3 to 10 SD above the mean in older
    individuals (MPPH-wide figures).
  phenotype_term:
    preferred_term: Megalencephaly
    term:
      id: HP:0001355
      label: Megalencephaly
  diagnostic: true
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:27854409
    reference_title: MPPH Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MPPH (megalencephaly-postaxial polydactyly-polymicrogyria-hydrocephalus)
      syndrome is a developmental brain disorder characterized by megalencephaly
      (brain overgrowth) with the cortical malformation bilateral perisylvian
      polymicrogyria (BPP).
    explanation: >-
      GeneReviews names megalencephaly as a defining feature of MPPH syndrome.
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that individuals with MPPH lacking upstream PI3K-AKT
      pathway mutations carry de novo mutations in CCND2
    explanation: >-
      The CCND2 discovery cohort was ascertained for MPPH, which requires
      megalencephaly.
- name: Bilateral Perisylvian Polymicrogyria
  category: Nervous System
  description: >-
    The cortical malformation of MPPH syndrome; with megalencephaly it is one of

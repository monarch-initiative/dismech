animal_models:
- name: In utero electroporation of degradation-resistant CCND2 into embryonic mouse cortex
  species: Mouse
  genotype: >-
    Wild-type embryos electroporated in utero with phosphodeficient human CCND2
    (p.Thr280Ala, an MPPH patient variant) or wild-type CCND2
  publication: PMID:24705253
  description: >-
    Transient expression of the stabilized cyclin D2 variant in progenitors of
    the developing mouse cortex, compared with wild-type cyclin D2 and GFP alone.
  modeled_mechanisms:
  - target: Expansion of Proliferating Cortical Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The stabilized variant keeps more electroporated progenitors in the cell
      cycle and reduces the fraction exiting it, compared with wild-type cyclin
      D2.
    limitations: >-
      Electroporation overexpresses the construct in a subset of progenitors
      rather than modelling a heterozygous germline allele, and the readouts
      are cellular: brain size, gyral pattern, ventricular size and limb
      development were not assessed.
    evidence:
    - reference: PMID:24705253
      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, expression of phosphodeficient forms of CCND2 increases progenitor
        proliferation and the proportion of cells undergoing mitosis, with a
        concomitant decrease in the exit fraction.
      explanation: >-
        Supports treating the electroporation model as informative for the
        progenitor-expansion node.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population birth-prevalence estimate has been published for MPPH3. The
    founding molecular cohort reported 12 unrelated affected individuals with
    pathogenic distal CCND2 variants, with subsequent literature consisting of
    small series and single-patient reports.
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we have identified a highly specific pattern of de novo mutations in
      CCND2 in 12 subjects with MPPH.
    explanation: Founding cohort size of 12 affected individuals supports ultra-rare prevalence.
notes: >-
  Scope. This entry covers the megalencephaly disorder caused by distal,
  stabilizing CCND2 variants. Variants in the proximal part of CCND2 have been
  reported with the opposite phenotype (microcephaly, short stature and mild
  developmental delay) and are out of scope here; they are listed as a
  differential diagnosis. The GeneReviews chapter MPPH Syndrome (PMID:27854409)
  is the phenotype baseline. Its frequencies are pooled across AKT3, CCND2 and
  PIK3R2, so they are cited as MPPH-wide figures and not as CCND2-specific ones.
  The chapter's management section also names medulloblastoma and vision,
  cardiac, thyroid and renal anomalies, and its surveillance section names
  cerebellar tonsillar ectopia, without frequencies or attribution to a gene.
  They are not entered as phenotypes because the abstract gives no evidence
  that they occur in the CCND2 form; cerebellar tonsillar ectopia appears only
  in the MRI surveillance item. The causal chain goes directly from cyclin D2
  accumulation to progenitor expansion, without a separate CDK4/6, Rb and E2F
  step: that step is general cyclin D biology, and no cited source measures it
  in MPPH or in neural progenitors carrying a CCND2 variant.

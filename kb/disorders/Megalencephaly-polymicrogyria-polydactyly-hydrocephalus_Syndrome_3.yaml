- megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome type 3
- megalencephaly-polymicrogyria-postaxial polydactyly-hydrocephalus syndrome caused by mutation in CCND2
references:
- reference: PMID:27854409
  title: MPPH Syndrome.
  tags:
  - GeneReviews
notes: >-
  Scope. This entry covers the megalencephaly disorder caused by distal,
  stabilizing CCND2 variants. Variants in the proximal part of CCND2 have been
  reported with the opposite phenotype (microcephaly, short stature and mild
  developmental delay) and are out of scope here; they are listed as a
  differential diagnosis. The GeneReviews chapter MPPH Syndrome (PMID:27854409)
  is the phenotype baseline. Its frequencies are pooled across AKT3, CCND2 and
  PIK3R2, so they are cited as MPPH-wide figures and not as CCND2-specific ones.

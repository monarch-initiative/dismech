- name: Microcephaly with proximal CCND2 variants
  description: >-
    Variants in the proximal part of CCND2 have been reported with microcephaly,
    a mildly simplified gyral pattern, short stature and mild developmental
    delay: the opposite brain-growth phenotype, attributed to possible loss of
    function.
  evidence:
  - reference: PMID:34087052
    reference_title: "Proximal variants in CCND2 associated with microcephaly, short stature, and developmental delay: A case series and review of inverse brain growth phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified five individuals from three unrelated families with novel
      variants in the proximal region of CCND2 associated with microcephaly,
      mildly simplified cortical gyral pattern, symmetric short stature, and mild
      developmental delay.
    explanation: Defines the allelic inverse phenotype that this entry excludes.

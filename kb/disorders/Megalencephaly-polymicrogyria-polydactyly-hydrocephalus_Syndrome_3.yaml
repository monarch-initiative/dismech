      reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In utero electroporation of mutant CCND2 into embryonic mouse brains
        produced more proliferating transfected progenitors and a smaller
        fraction of progenitors exiting the cell cycle compared to cells
        electroporated with wild-type CCND2.
      explanation: >-
        Expressing the stabilized variant in the developing mouse cortex keeps
        more progenitors in the cell cycle than wild-type cyclin D2.

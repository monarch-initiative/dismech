      reference_title: "CCND2 / megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CCND2 | HGNC:1583 | megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3 | MONDO:0014408 | AD | Definitive"
      explanation: ClinGen Brain Malformations GCEP classification.
  evidence:
  - reference: PMID:24705253
    reference_title: De novo CCND2 mutations leading to stabilization of cyclin D2 cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Thr280Asn mutation occurred in 3 subjects while p.Lys270*,
      p.Thr280Ala, and p.Pro281Arg were found in 2 subjects each.
    explanation: Recurrent CCND2 variants in the discovery cohort.
  - reference: PMID:38700464
    reference_title: A de novo Mutation (p.Gln277X) of Cyclin D2 is Responsible for a Child with Megalencephaly-Polymicrogyria-Polydactyly-Hydrocephalus Syndrome.

  - reference: PMID:30860637
    reference_title: European Academy of Neurology guideline on trigeminal neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lamotrigine, gabapentin, botulinum toxin type A, pregabalin, baclofen and phenytoin may be used either alone or as add-on therapy."
    explanation: Guideline placement of botulinum toxin among add-on options.
- name: Occipital Nerve Block
  description: >-
    Local anaesthetic with or without corticosteroid injected at the greater
    occipital nerve. First-line minimally invasive intervention for occipital
    neuralgia and used diagnostically, though relief is often short-lived and
    blocks also relieve migraine, so a response is not specific.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Occipital Nerve Block
    term:
      id: NCIT:C157940
      label: Occipital Nerve Block
  target_mechanisms:
  - target: Extracranial Entrapment of the Occipital Nerves
    treatment_effect: INHIBITS
    description: >-
      The block is delivered at the anatomical entrapment points along the
      nerve's extracranial course, which is why the procedure targets this node
      rather than the root-entry-zone node.
    evidence:
    - reference: PMID:39217283
      reference_title: "An anatomical analysis of the occipital nerve complex: an essential tool for the application of occipital nerve blocks."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "we aimed to investigate the potential compression points of the greater occipital nerve (GON), third occipital nerve (TON), and lesser occipital nerve (LON) which are targeted to block in occipital nerve blocks"
      explanation: >-
        Establishes that the compression points are the anatomical targets of the
        block. Graded PARTIAL because it is a cadaveric dissection study and
        reports no clinical outcomes.
  evidence:
  - reference: PMID:34287719
    reference_title: Occipital Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occipital nerve block is considered the first line in a minimally invasive intervention, but the duration of relief may be short term."
    explanation: Supports both the first-line placement and the durability caveat.
  - reference: PMID:24737457
    reference_title: Occipital neuralgia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, nerve blocks are also effective in migraine headache and misdiagnosis can result in a false positive."
    explanation: Records the limit on using a block response as a diagnostic test.
- name: Psychological and Nursing Support
  description: >-
    Guideline-recommended alongside medical and surgical management. The
    recurrent excruciating pain, impaired eating and speech, and medication
    burden carry a substantial psychiatric and functional cost that drug and
    procedural treatment do not address on their own.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30860637
    reference_title: European Academy of Neurology guideline on trigeminal neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to medical and surgical management, it is recommended that patients are offered psychological and nursing support."
    explanation: Direct guideline recommendation for this component of care.
genetic:
- name: C8B
  gene_term:
    preferred_term: C8B
    term:
      id: hgnc:1353
      label: C8B
  relationship_type: SUSCEPTIBILITY
  association: Candidate-gene susceptibility association; not causative
  subtype: Trigeminal
  notes: >-
    Included as a susceptibility signal, not a disease gene. Three caveats
    travel with it and should not be dropped if this record is reused. First,
    this is a targeted candidate-gene analysis of 175 SNPs in 17 genes chosen
    from the same group's earlier proteomic work, not a genome-wide scan, so
    p = 0.00016 is nowhere near the 5e-8 threshold a GWAS hit would need and the
    result is not corrected for genome-wide multiple testing. Second, the effect
    is small (OR 1.357) -- population-level risk modification, not anything that
    would explain an individual case. Third, it is a single cohort and has not
    been replicated. Nothing here displaces neurovascular compression as the
    mechanism; C8B is a complement component and the proposed link is to
    neuroinflammation, which this entry's pathograph does not currently model.
  evidence:
  - reference: DOI:10.1007/s12031-024-02263-x
    reference_title: Genomic Validation in the UK Biobank Cohort Suggests a Role of C8B and MFG-E8 in the Pathogenesis of Trigeminal Neuralgia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Two SNPs corresponding to C8B rs706484 [odds ratio (OR) (95% confidence interval (CI)): 1.357 (1.158–1.590); p: 0.00016] and MFG-E8 rs2015495 [OR (95% CI): 1.313 (1.134–1.521); p: 0.00028] showed significant positive association with TN"
    explanation: >-
      UK Biobank case-control association giving the effect size for this gene.
      Graded PARTIAL because it establishes a statistical association in one
      cohort, not a causal role.
  - reference: DOI:10.1007/s12031-024-02263-x
    reference_title: Genomic Validation in the UK Biobank Cohort Suggests a Role of C8B and MFG-E8 in the Pathogenesis of Trigeminal Neuralgia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified genetic variations may help explain why some individuals develop TN while others do not, indicating a potential genetic predisposition to the condition."
    explanation: >-
      The authors' own framing, which is predisposition rather than causation --
      the reason `relationship_type` here is SUSCEPTIBILITY.
- name: MFGE8
  gene_term:
    preferred_term: MFGE8
    term:
      id: hgnc:7036
      label: MFGE8
  relationship_type: SUSCEPTIBILITY
  association: Candidate-gene susceptibility association; not causative
  subtype: Trigeminal
  notes: >-
    Same study, same caveats as the C8B record above: candidate-gene design, no
    genome-wide correction, OR 1.313, single unreplicated cohort. MFG-E8 is
    proposed to act through regulation of neuroinflammation.
  evidence:
  - reference: DOI:10.1007/s12031-024-02263-x
    reference_title: Genomic Validation in the UK Biobank Cohort Suggests a Role of C8B and MFG-E8 in the Pathogenesis of Trigeminal Neuralgia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest novel genetic associations between C8B, a key component of the complement system, and MFG-E8, which plays a role in regulating neuroinflammation, in relation to TN."
    explanation: >-
      Names both genes and the proposed biology. Graded PARTIAL because the
      authors state a suggestion of association, not an established mechanism.
  - reference: DOI:10.1007/s12031-024-02263-x
    reference_title: Genomic Validation in the UK Biobank Cohort Suggests a Role of C8B and MFG-E8 in the Pathogenesis of Trigeminal Neuralgia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The study sample comprised of diagnosed TN cases (N = 555) and randomly matched controls (N = 6245) based on specific criteria."
    explanation: The cohort size behind the association, recorded so the strength of the claim can be judged from the entry.
environmental:
- name: Chronic arterial hypertension
  description: >-
    Hypertension is associated with an increased subsequent risk of trigeminal
    neuralgia in population data. The proposed link is through arterial
    elongation, tortuosity, and stiffening, which make a compressive vascular
    loop at the root entry zone more likely — an association, not a demonstrated
    causal pathway.
  effect: Increases risk of subsequent trigeminal neuralgia
  notes: >-
    Deliberately left without an `exposure_term`. ECTO was searched and carries
    only exposure-to-antihypertensive-agent concepts (ECTO:2000001,
    ECTO:9001744), which describe treatment rather than the hypertensive state
    itself; XCO likewise offers only `antihypertensive agent`. Binding either
    would assert the opposite of the claim made here. Note also that
    hypertension is a host physiological state rather than an external
    exposure, and is placed in `environmental:` because that is where this
    schema carries modifiable, non-genetic risk factors.
  influences_mechanisms:
  - target: Neurovascular Compression at the Nerve Root Entry Zone
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypertensive vascular remodelling is the proposed route by which
      hypertension raises the probability of a compressive arterial loop
      contacting the nerve root. The intervening steps have not been
      demonstrated.
    evidence:
    - reference: PMID:21998318
      reference_title: "Increased risk of trigeminal neuralgia after hypertension: a population-based study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "This study shows a significantly increased risk of developing TN after hypertension. Further studies are needed to elucidate the underlying mechanism of the association between hypertension and TN."
      explanation: >-
        Population cohort of 138,492 hypertensive persons establishing the
        temporal association. Graded PARTIAL because the authors state
        explicitly that the underlying mechanism is not established, so this
        supports the risk relationship but not the vascular-remodelling route
        this link proposes.
  evidence:
  - reference: PMID:2301931
    reference_title: "Incidence and clinical features of trigeminal neuralgia, Rochester, Minnesota, 1945-1984."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study indicates an elevated relative risk associated with hypertension (both overall and among women in the cohort)."
    explanation: Independent population-based cohort reporting the same association.
animal_models:
- name: Rat infraorbital nerve chronic constriction injury
  species: Rat
  genotype: Wild-type Sprague-Dawley
  publication: PMID:27327156
  description: >-
    A ligature is placed around the infraorbital branch of the trigeminal nerve,
    producing a sustained drop in facial mechanical threshold and a measurable
    change in trigeminal ganglion sodium-channel expression. It is the source of
    the subunit-level detail in this entry's channel node, and it is included
    here explicitly so that the model's limits are attached to the graph rather
    than left in prose.
  evidence:
  - reference: PMID:27327156
    reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used the infraorbital nerve-chronic constriction injury model of TN in the rat."
    explanation: Establishes the model preparation this entry describes.
  modeled_mechanisms:
  - target: Dysregulated Voltage-Gated Sodium Channel Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model does reproduce injury-driven remodelling of voltage-gated sodium
      channel expression in trigeminal ganglion neurons, which is the claim this
      node makes.
    limitations: >-
      It injures a distal peripheral branch, whereas the human lesion is focal
      demyelination of the central, oligodendrocyte-myelinated segment of the
      root -- a different site and a different myelinating cell. The subunit
      pattern it reports has not been confirmed in human trigeminal ganglion.
    readouts:
    - name: Nav1.3 transcript and protein in trigeminal ganglion
      target: Dysregulated Voltage-Gated Sodium Channel Expression
      direction: INCREASED
      interpretation: Upregulation of a channel subunit associated with neuronal hyperexcitability after injury.
      evidence:
      - reference: PMID:27327156
        reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "trigeminal ganglion in rats subjected to an infraorbital nerve-chronic constriction injury showed upregulation of Nav1.3 and downregulation of Nav1.7, Nav1.8, and Nav1.9 messenger RNA and protein levels"
        explanation: Reports the measured direction of change for each subunit, including the Nav1.3 increase this readout records.
    evidence:
    - reference: PMID:27327156
      reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings suggest that VGSC may participate in the regulation of TN."
      explanation: >-
        The authors' own claim for the model is a suggestion that these channels
        participate, which is the strength this link is graded at.
  - target: Paroxysmal Neuralgiform Pain
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not reproduce the defining clinical phenotype. Human
      cranial neuralgia is brief, trigger-evoked, and remitting; the model
      produces a sustained lowering of mechanical threshold over weeks.
    limitations: >-
      There is no trigger zone, no paroxysm, no refractory period, and no
      remission in this preparation, so it cannot be used to test claims about
      the paroxysmal character of the disease. Devor and colleagues state
      outright that no satisfactory animal model of trigeminal neuralgia exists.
    readouts:
    - name: Facial mechanical pain threshold
      target: Paroxysmal Neuralgiform Pain
      direction: DECREASED
      interpretation: >-
        A sustained threshold drop lasting weeks, which is a different
        behavioural pattern from the brief evoked paroxysms it is meant to model.
      evidence:
      - reference: PMID:27327156
        reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Behavioral tests showed that the mechanical pain threshold decreased significantly 4-42 days after surgery and reached the lowest observed value by day 12."
        explanation: The measured time course, which is sustained over weeks rather than paroxysmal.
    evidence:
    - reference: PMID:11803297
      reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "There are no satisfactory animal models of trigeminal neuralgia, and it is difficult to obtain essential data from patients."
      explanation: Substantiates the negative claim that no available animal model reproduces the human disease phenotype.
clinical_trials:
- name: NCT06620172
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Randomized comparison of CT-guided versus fluoroscopy-guided trigeminal
    ganglion radiofrequency thermocoagulation in idiopathic trigeminal
    neuralgia, with pain relief, medication consumption, and adverse events
    followed to six months.
  evidence:
  - reference: clinicaltrials:NCT06620172
    reference_title: "CT-guided vs Fluoroscopy-guided Trigeminal Ganglion Radiofrequency Thermocoagulation for Idiopathic Trigeminal Neuralgia: A Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Does CT-guided TG-RFT provide better pain relief compared to fluoroscopy-guided TG-RFT?"
    explanation: The trial's primary question, which concerns how the ablative procedure curated here is targeted.
- name: NCT05491915
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Multicenter case series of 60-day percutaneous peripheral nerve stimulation
    for occipital neuralgia and cervicogenic headache, relevant to the occipital
    subtype where refractory disease has few durable options.
  evidence:
  - reference: clinicaltrials:NCT05491915
    reference_title: "The MONARCH (Multicenter Occipital Neuralgia and Cervicogenic Headache) Case Series Study: Treatment of Head Pain With the SPRINT® Peripheral Nerve Stimulation (PNS) System"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to learn if pain can be relieved by delivering small amounts of electricity (called \"electrical stimulation\") to the nerves at the top of the neck."
    explanation: >-
      Describes stimulation of the upper cervical nerves, which are the nerves
      the occipital subtype involves. The registry title names occipital
      neuralgia as the study population.
discussions:
- discussion_id: gap_cn_ephaptic_mechanism_beyond_trigeminal
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the demyelination-and-ephaptic-cross-excitation mechanism, established for
    the trigeminal root, actually the mechanism in glossopharyngeal and nervus
    intermedius neuralgia, or is it assumed by analogy?
  attaches_to:
  - pathophysiology#Ectopic Discharge and Ephaptic Cross-Excitation
  rationale: >-
    The histopathology that grounds this entry's central mechanism comes from
    trigeminal nerve roots obtained at decompression surgery. Glossopharyngeal
    and nervus intermedius neuralgia are supported by operative observation of
    rootlet compression and by the fact that decompression relieves them, which
    is consistent with the same mechanism but does not demonstrate it — no
    comparable histological series of demyelination and axonal juxtaposition in
    those roots is available, and the operations are far rarer. Love and Coakham
    argue the generalisation explicitly, but on clinical and electrophysiological
    grounds rather than pathological ones. This matters for the concept decision
    recorded in this entry's notes: the case for one disease rather than a
    grouping rests on the generalisation holding.
  evidence:
  - reference: PMID:11701590
    reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical observations and electrophysiological studies support the concept that demyelination and ephaptic spread of excitation underlie most, if not all, of these conditions."
    explanation: >-
      The generalisation this gap questions, in the authors' own words. Note
      what it rests on -- clinical observation and electrophysiology, not the
      histology that grounds the trigeminal case.
  - reference: PMID:28263933
    reference_title: "Microvascular Decompression for Glossopharyngeal Neuralgia: Long-Term Follow-Up."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic GPN is usually caused by pulsatile neurovascular compression of the glossopharyngeal and vagus rootlets."
    explanation: >-
      Operative observation of compression in the glossopharyngeal subtype,
      which is consistent with the shared mechanism but establishes the
      compression rather than the demyelination or the ephaptic step.
- discussion_id: gap_cn_compression_insufficient
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do most people with severe neurovascular contact never develop a
    neuralgia, and what determines which compressed nerves become symptomatic?
  attaches_to:
  - pathophysiology#Neurovascular Compression at the Nerve Root Entry Zone
  rationale: >-
    Neurovascular contact is present on 36% of asymptomatic nerves, and even
    severe contact appears on 13% of asymptomatic sides. Compression is
    therefore necessary-ish but plainly not sufficient, and the sex difference in
    how often severe contact explains the pain — 75% of men versus 38% of women
    — implies that a substantial fraction of disease, particularly in women, is
    driven by something this graph does not represent. Candidates have been
    proposed rather than the field being empty: a 2022 systematic review of the
    neurovascular compression syndromes lists demyelination, root-entry-zone
    remodelling, vasculature pathology, nucleus hyperexcitability, white- and
    grey-matter change, and ion-channel disturbance as changes that must coexist
    with the compression, and this entry's own STIM1/SOCE discussion and its C8B
    and MFGE8 susceptibility records point at an inflammatory background from a
    different direction. What is missing is not candidates but demonstration:
    none is established as the necessary second hit, and none has been shown to
    account for the sex difference specifically.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurovascular contact was found in 471 out of 531 symptomatic nerves (89%) and 244 of 681 asymptomatic nerves (36%), indicating high sensitivity but poor specificity."
    explanation: Meta-analytic figures establishing that contact is common on asymptomatic nerves, which is the gap.
  - reference: PMID:25616608
    reference_title: "Association between neurovascular contact and clinical characteristics in classical trigeminal neuralgia: A prospective clinical study using 3.0 Tesla MRI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe NVC was much more prevalent in men than in women, who may more often have other disease etiologies causing or contributing to TN."
    explanation: >-
      The authors themselves infer from the sex difference that a substantial
      share of disease in women has a different aetiology, which is the
      unrepresented factor this gap names.
  - reference: PMID:35860499
    reference_title: "The Underlying Pathogenesis of Neurovascular Compression Syndromes: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The systematic review suggests that the anatomical and/or hemodynamical changes described are insufficient to account for NVC-related symptoms by themselves. They must coexist with additional changes such as factors associated with the affected nerve (e.g., demyelination, REZ modeling, vasculature pathology), nucleus hyperexcitability, white and/or gray matter changes in the brain, or disturbances in ion channels."
    explanation: >-
      Systematic review of 63 papers stating both halves of this gap: that
      compression alone is insufficient, and which co-factors have been
      proposed. It is the source for rewording this rationale, which previously
      claimed no candidate had been proposed at all.
- discussion_id: gap_cn_stim1_soce_neuroinflammation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does STIM1/ORAI1 store-operated calcium entry and T-cell cytokine release
    contribute causally to human cranial neuralgia, or is the neuroinflammatory
    signal a consequence of nerve injury rather than a driver of it?
  attaches_to:
  - pathophysiology#Focal Demyelination and Axonal Juxtaposition
  rationale: >-
    A 2024 study reports STIM1 overexpression in trigeminal neuralgia patients
    by microarray reanalysis, and links STIM1-dependent store-operated calcium
    entry to TNF-alpha, IL-1beta, and IL-6 release from T lymphocytes in rat
    models. It is deliberately not modelled as a pathophysiology node here: the
    human component is bioinformatic reanalysis of deposited expression data
    rather than a measurement in patient tissue, the causal work is in the same
    rat constriction model this entry already flags as a poor human proxy, and
    nothing establishes direction -- immune activation around an injured nerve
    is expected downstream of demyelination, so finding it does not show it
    drives the disease. The complement and neuroinflammation genes in this
    entry's `genetic:` section point at the same unresolved question from a
    different direction, which is the reason to record it rather than drop it.
  evidence:
  - reference: DOI:10.3389/fnmol.2024.1391189
    reference_title: "Novel insights into STIM1's role in store-operated calcium entry and its implications for T-cell mediated inflammation in trigeminal neuralgia"
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Our bioinformatic approach highlighted STIM1's significant overexpression in TN patients, underscoring its pivotal role in TN's etiology and progression."
    explanation: >-
      The human-facing claim, which rests on reanalysis of deposited expression
      data rather than a measurement made in patients. Graded PARTIAL and
      COMPUTATIONAL for that reason, against the paper's own stronger wording.
  - reference: DOI:10.3389/fnmol.2024.1391189
    reference_title: "Novel insights into STIM1's role in store-operated calcium entry and its implications for T-cell mediated inflammation in trigeminal neuralgia"
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, STIM1 was shown to mediate SOCE-induced inflammatory cytokine release in T lymphocytes, a critical factor in TN development."
    explanation: >-
      The mechanistic claim, made in rat models and in vitro. Graded PARTIAL
      because it does not establish that the pathway operates, or operates
      causally, in human disease.
- discussion_id: gap_cn_rodent_constriction_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do rodent nerve-constriction models reproduce the mechanism of human cranial
    neuralgia well enough for their sodium-channel findings to be transferred to
    it?
  attaches_to:
  - pathophysiology#Dysregulated Voltage-Gated Sodium Channel Expression
  rationale: >-
    The subunit-level detail in this entry's channel node comes from
    infraorbital-nerve chronic constriction injury in rats. That model injures a
    distal peripheral branch, whereas the human lesion is focal demyelination of
    the central, oligodendrocyte-myelinated segment of the root, and it produces
    sustained mechanical hypersensitivity rather than the triggered, paroxysmal,
    remitting pattern that defines the human disease. Devor and colleagues state
    plainly that there are no satisfactory animal models of trigeminal neuralgia
    and that the mechanistic account is a deduction awaiting patient data. The
    direction of change for individual channels should therefore be read as
    model-derived and not as a human finding.
  evidence:
  - reference: PMID:11803297
    reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no satisfactory animal models of trigeminal neuralgia, and it is difficult to obtain essential data from patients."
    explanation: States the model gap directly, and is why the mechanistic account in this entry is a deduction rather than a demonstration.
  - reference: PMID:27327156
    reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Behavioral tests showed that the mechanical pain threshold decreased significantly 4-42 days after surgery and reached the lowest observed value by day 12."
    explanation: >-
      The model's readout is a sustained drop in mechanical threshold over
      weeks, not the triggered, brief, remitting paroxysms that define the human
      disease -- the specific behavioural mismatch this gap is about.

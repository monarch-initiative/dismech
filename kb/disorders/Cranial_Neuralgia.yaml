name: Cranial Neuralgia
creation_date: '2026-08-28T00:00:00Z'
category: Complex
categories:
- Neurological
- Neuropathic Pain
parents:
- neuralgia
- cranial nerve neuropathy
synonyms:
- cranial nerve neuralgia
- craniofacial neuralgia
disease_term:
  preferred_term: cranial neuralgia
  term:
    id: MONDO:0016374
    label: cranial neuralgia
description: >-
  Cranial neuralgia is paroxysmal, severe, lancinating pain confined to the
  sensory territory of a cranial (or, by clinical convention, an upper cervical)
  nerve, characteristically provoked by innocuous stimulation of a trigger zone.
  In the nerve-defined forms that dominate the category — trigeminal neuralgia
  by a wide margin, then glossopharyngeal and nervus intermedius neuralgia — the
  best-supported mechanism is chronic pulsatile compression of the nerve root by
  an overlying artery close to its entry into the brainstem. That compression
  produces focal demyelination and juxtaposition of bare axons, which favours
  ectopic impulse generation and ephaptic cross-talk between large tactile
  afferents and nociceptive fibres; synchronized high-frequency afterdischarge
  is then experienced as an abrupt shock-like paroxysm. The same demyelinating
  lesion is reached by other routes in secondary disease, most often a
  pontine multiple sclerosis plaque or a posterior fossa tumour compressing the
  root. Sodium-channel-blocking anticonvulsants (carbamazepine, oxcarbazepine)
  suppress the high-frequency firing and are first-line; microvascular
  decompression removes the compressive lesion itself and gives the most durable
  medication-free relief.
notes: >-
  Concept decision (issue #9605). This is curated as a single Disease entry with
  nerve-defined `has_subtypes` rather than as a `kb/groupings/` union, because
  the classical forms share one mechanistic spine node-for-node: neurovascular
  compression at the root entry zone -> focal demyelination -> ectopic discharge
  and ephaptic cross-excitation -> paroxysmal lancinating pain, with the same
  first-line drug class and the same cause-directed operation. Love and Coakham
  (PMID:11701590) make that argument explicitly, concluding that demyelination
  and ephaptic spread underlie most or all of the vascular-compression cranial
  nerve hyperactivity syndromes. What varies between subtypes is which nerve
  carries the lesion, and therefore the pain territory, the offending vessel,
  and the trigger manoeuvre — anatomical substitution on a conserved graph,
  which is the same pattern the mechanism-module convention treats as
  conformance rather than as a union of distinct diseases. Szmyd and colleagues
  (PMID:35860499), a 2022 systematic review of 63 papers on the neurovascular
  compression syndromes, reach the same grouping two decades after Love and
  Coakham and explicitly include geniculate (nervus intermedius) neuralgia in
  it, which matters because that is the thinnest subtype curated here.
  .
  Occipital neuralgia is the deliberate exception and is curated as a subtype
  with a stated caveat rather than silently folded in. It is grouped here by
  ICHD-3 clinical convention and by the MONDO/HPO neuralgia hierarchy, but the
  greater and lesser occipital nerves are branches of the C2-C3 dorsal rami, not
  cranial nerves, and the compression points described anatomically are
  extracranial sites along the nerve's course through muscle and beside the
  occipital artery (PMID:39217283) rather than a brainstem root entry zone. Its
  pathophysiology node is therefore kept separate from the root-entry-zone node
  and does not claim the ephaptic mechanism. Note also that MONDO:0016374 does
  not itself have occipital neuralgia among its descendants.
  .
  The falcon deep-research report generated for this entry argued the opposite
  case — that cranial neuralgia is "an umbrella clinical category, not one
  etiologically uniform disease" and that the entities should be represented
  separately. That reading is recorded here rather than discarded: it is correct
  about epidemiology and about procedure selection, which genuinely do not
  transfer between subtypes. That is why every `prevalence` record here carries
  an explicit `subtype:` rather than being stated at the root, and why the
  treatment entries name which subtype each option applies to in their own
  prose -- `Treatment` has no `subtype` slot, so that distinction cannot be
  made structurally the way it can for prevalence and phenotypes. It is the
  mechanism, not the clinical management, that is shared. If a future
  curator finds the per-subtype pathographs diverging further, splitting
  trigeminal neuralgia (MONDO:0008599) into its own entry and converting this
  one to a grouping would be the right move. The `stubs/Trigeminal_Neuralgia.yaml`
  queue entry is closed by this PR because MONDO:0008599 is now covered as a
  `has_subtypes` entry here; re-nominating it is the route if that split is
  later wanted.
  .
  On genetics: there is no Mendelian basis here and no gene is necessary or
  sufficient, so the `genetic:` section carries susceptibility signals only. The
  two entries there (C8B, MFGE8) come from a single unreplicated candidate-gene
  analysis in UK Biobank with small effect sizes and no genome-wide correction.
  They are recorded because they are the best available human genetic evidence
  and because a reader should be able to see the question was considered rather
  than skipped -- not because they carry mechanistic weight. Neither is wired
  into the pathograph: the proposed biology is complement activation and
  neuroinflammation, which this entry does not model, and whether that
  neuroinflammatory signal drives the disease or simply follows nerve injury is
  recorded as an open discussion rather than assumed either way.
definitions:
- name: Paroxysmal cranial neuralgia pain phenotype
  definition_type: OTHER
  description: >-
    Recurrent brief shock-like pain restricted to the distribution of a single
    cranial nerve, of abrupt onset and termination, usually unilateral.
  scope: Applies across the nerve-defined subtypes; does not by itself distinguish classical from secondary aetiology.
  evidence:
  - reference: PMID:38575268
    reference_title: Trigeminal and Glossopharyngeal Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trigeminal neuralgia and glossopharyngeal neuralgia are craniofacial pain syndromes characterized by recurrent brief shock-like pains in the distributions of their respective cranial nerves."
    explanation: States the shared paroxysmal, nerve-territory-confined pain phenotype that defines the category.
- name: Aetiological classification of trigeminal neuralgia
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Three-category aetiological grading: classical (imaging shows vascular
    compression with morphological change of the nerve root), secondary (an
    identifiable underlying neurological disease), and idiopathic (no cause
    found).
  scope: >-
    Developed for trigeminal neuralgia and extended by analogy to the other
    cranial neuralgias, where it has not been separately validated.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classical TN requires demonstration of morphologic changes in the trigeminal nerve root from vascular compression. Secondary TN is due to an identifiable underlying neurologic disease. TN of unknown etiology is labeled idiopathic."
    explanation: Gives the three aetiological categories verbatim as proposed by the classification working group.
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Like trigeminal neuralgia, NIN can be divided into classic, idiopathic, secondary, or painful neuropathy."
    explanation: Supports extension of the same scheme to nervus intermedius neuralgia, though this review notes the evidence base for that subtype is thin.
has_subtypes:
- name: Trigeminal
  display_name: Trigeminal Neuralgia (CN V)
  classification: affected_nerve
  description: >-
    By far the commonest cranial neuralgia. Pain is confined to one or more
    divisions of the trigeminal nerve, most often the maxillary and mandibular
    divisions, and is almost always unilateral. Severe neurovascular contact at
    the trigeminal root entry zone, usually arterial, is the dominant classical
    aetiology.
  subtype_term:
    preferred_term: trigeminal neuralgia
    term:
      id: MONDO:0008599
      label: trigeminal neuralgia
  locations:
  - preferred_term: trigeminal nerve root
    term:
      id: UBERON:0004673
      label: trigeminal nerve root
  evidence:
  - reference: PMID:25231219
    reference_title: Trigeminal neuralgia--a prospective systematic study of clinical characteristics in 158 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It affected solely the second and/or third trigeminal branch in 109 (69%) while the first branch alone was affected in only 7 (4%)."
    explanation: Prospective series quantifies the divisional distribution that characterises this subtype.
- name: Glossopharyngeal
  display_name: Glossopharyngeal Neuralgia (CN IX)
  classification: affected_nerve
  description: >-
    Paroxysmal pain in the posterior tongue, tonsillar fossa, pharynx, and deep
    ear, triggered by swallowing, talking, or coughing. Compression of the
    glossopharyngeal and vagal rootlets near the medulla is the usual classical
    cause. Because the glossopharyngeal nerve carries the carotid-sinus afferent
    limb, attacks can recruit vagal reflex arcs and produce bradycardia,
    hypotension, and cardiac syncope -- rare, but the one way a cranial
    neuralgia becomes immediately dangerous.
  subtype_term:
    preferred_term: glossopharyngeal neuralgia
    term:
      id: MONDO:0016372
      label: glossopharyngeal neuralgia
  locations:
  - preferred_term: glossopharyngeal nerve
    term:
      id: UBERON:0001649
      label: glossopharyngeal nerve
  evidence:
  - reference: PMID:28263933
    reference_title: "Microvascular Decompression for Glossopharyngeal Neuralgia: Long-Term Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic GPN is usually caused by pulsatile neurovascular compression of the glossopharyngeal and vagus rootlets."
    explanation: Operative series identifies rootlet compression as the usual classical aetiology of this subtype.
- name: Nervus Intermedius
  display_name: Nervus Intermedius (Geniculate) Neuralgia (CN VII sensory root)
  classification: affected_nerve
  description: >-
    A rare neuralgia of the sensory branch of the facial nerve, producing deep
    ear pain that may radiate to the auditory canal, auricle, mastoid, soft
    palate, temple, and angle of the jaw. Compression by the anterior inferior
    cerebellar artery is the most commonly described cause. Diagnosis is
    confounded by overlap with trigeminal and glossopharyngeal territory.
  locations:
  - preferred_term: sensory root of facial nerve
    term:
      id: UBERON:0001699
      label: sensory root of facial nerve
  evidence:
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NIN presents as a rare neuralgia of this nerve, causing deep ear pain, which may radiate to the auditory canal, auricle, mastoid, soft palate, temple, and angle of the jaw."
    explanation: Defines the pain territory of this subtype.
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurovascular compression involving the anterior inferior cerebellar artery is the most common etiology described"
    explanation: Identifies the offending vessel for the classical form of this subtype.
  - reference: PMID:30095334
    reference_title: Nervus intermedius and the surgical management of geniculate neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Geniculate neuralgia (GN) is an uncommon craniofacial pain syndrome attributable to nervus intermedius (NI) dysfunction."
    explanation: Surgical series defining the subtype by the nerve involved, which is the axis this entry's subtypes are cut along.
  - reference: PMID:30095334
    reference_title: Nervus intermedius and the surgical management of geniculate neuralgia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis and treatment can be challenging, due to the complex nature of ear sensory innervation, resulting in clinical overlap with trigeminal neuralgia (TN) and glossopharyngeal neuralgia (GPN)."
    explanation: >-
      Substantiates the diagnostic-overlap caveat in this subtype's description.
      Graded PARTIAL because it reports the overlap as a clinical difficulty
      rather than quantifying misdiagnosis.
  review_notes: >-
    No `subtype_term`. MONDO was searched for "nervus intermedius", "geniculate
    neuralgia", and the descendants of MONDO:0016374 (cranial neuralgia), which
    are facial neuralgia, trigeminal neuralgia, glossopharyngeal neuralgia, and
    combined hyperactive dysfunction syndrome of the cranial nerves. No term for
    this concept exists, so the subtype is left unbound rather than bound to a
    broader parent that would not identify it.
- name: Occipital
  display_name: Occipital Neuralgia (greater, lesser, and third occipital nerves)
  classification: affected_nerve
  description: >-
    Paroxysmal lancinating pain in the distribution of the greater, lesser, or
    third occipital nerves over the posterior scalp. Included here by ICHD-3
    clinical convention and by the HPO neuralgia hierarchy, but mechanistically
    the outlier of this entry: these are branches of the C2-C3 dorsal rami
    rather than cranial nerves, and the described compression points lie
    extracranially along the nerve's course, not at a brainstem root entry
    zone. See the entry-level notes.
  review_notes: >-
    No `subtype_term`. MONDO has no occipital neuralgia term and, consistent
    with the anatomical point above, occipital neuralgia is not among the
    descendants of MONDO:0016374. HP:0012318 Occipital neuralgia exists and is
    used on this subtype's phenotype record, but `subtype_term` is bound to the
    DiseaseOrSubtypeTerm enum, which an HP term is not a member of, so it cannot
    be used here.
  evidence:
  - reference: PMID:24737457
    reference_title: Occipital neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occipital neuralgia is an uncommon cause of occipital pain characterized by paroxysmal lancinating pain in the distribution of the greater, lesser or third occipital nerves."
    explanation: Establishes the pain character and nerve territory that place this alongside the cranial neuralgias.
prevalence:
- subtype: Trigeminal
  population: Rochester, Minnesota residents, 1945-1984
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.3
  notes: Crude annual incidence, both sexes combined; age-adjusted rate higher in women (5.9) than men (3.4).
  evidence:
  - reference: PMID:2301931
    reference_title: "Incidence and clinical features of trigeminal neuralgia, Rochester, Minnesota, 1945-1984."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall crude incidence rate of trigeminal neuralgia per 100,000 population in Rochester, Minnesota, for 1945 through 1984 was 4.3 for both sexes combined."
    explanation: Population-based record-linkage cohort giving the classic annual incidence figure.
- subtype: Trigeminal
  population: Women in three observational population-based adult samples
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 3.0
  rate_high: 30.0
  notes: >-
    Systematic review of population-based prevalence studies; reported as 0.03%
    to 0.3%, converted here to 3-30 per 100,000. The wide band reflects only
    three includable studies. Note that the reported range straddles a class
    boundary -- the low end falls in BAND_1_9_PER_100000 and the high end in
    BAND_1_5_PER_10000; the class recorded here is the one the repository's
    midpoint rule (scripts/migrate_prevalence.py) yields for 3-30.
  evidence:
  - reference: PMID:27017183
    reference_title: "Prevalence of trigeminal neuralgia: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review identified a higher prevalence of TN in women, ranging from 0.03% (95% confidence interval [CI], 0.01-0.08) to 0.3% (95% CI, 0.16-0.55)."
    explanation: Supplies the population prevalence range and the female preponderance.
- subtype: Glossopharyngeal
  population: Rochester, Minnesota residents, 1945-1984
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.7
  notes: Crude annual incidence, both sexes combined; roughly one sixth the trigeminal rate in the same cohort.
  evidence:
  - reference: PMID:1798429
    reference_title: "Incidence and clinical features of glossopharyngeal neuralgia, Rochester, Minnesota, 1945-1984."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The annual crude incidence rate of glossopharyngeal neuralgia per 100,000 population in Rochester, Minn., for 1945 through 1984, was 0.7 for both sexes combined, suggesting that glossopharyngeal neuralgia is a rare disease."
    explanation: Population-based incidence for the glossopharyngeal subtype from the same cohort as the trigeminal figure.
- subtype: Trigeminal
  population: Patients with multiple sclerosis (19 studies, 30,348 patients)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3400.0
  notes: >-
    Prevalence of trigeminal neuralgia within an MS population, not a general
    population estimate; quantifies the secondary-aetiology burden.
  evidence:
  - reference: PMID:34986455
    reference_title: "Prevalence of trigeminal neuralgia in multiple sclerosis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled overall TN prevalence among 19 studies and 30,348 MS patients was estimated as 3.4% (95% CI: 1.5%-5.9%)"
    explanation: Meta-analytic estimate of trigeminal neuralgia frequency among people with multiple sclerosis.
progression:
- phase: Recurrent active periods separated by complete remissions
  subtype: Trigeminal
  notes: >-
    The course is remitting rather than steadily progressive, which sets this
    disease apart from most neuropathic pain and matters for judging whether a
    treatment worked. Remissions lasting weeks to years occur in a majority of
    patients, so spontaneous improvement is a live confounder in any
    uncontrolled treatment series.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike other forms of neuropathic pain, TN enters into periods of complete remission in up to 63% of patients."
    explanation: Quantifies the remitting course this phase describes.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These periods may last from weeks to years."
    explanation: Gives the duration range of the remissions.
- phase: Attack frequency and duration over the course of illness
  subtype: Trigeminal
  notes: >-
    Recorded because the intuitive model is wrong. Attacks were long assumed to
    grow more frequent and longer as the disease went on; a 200-patient study of
    classical disease found no such relationship with disease duration. This
    entry therefore does not model a severity-escalation edge, and a curator
    should not add one without evidence.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Refuting earlier assumptions,7 a recent study in 200 patients with classical TN did not find evidence supporting an increase in frequency or duration of the pain paroxysms with the disease duration."
    explanation: Directly refutes progressive escalation of attack frequency or duration, which is what this phase records.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Life expectancy is not reduced, but morbidity is severe and largely
    psychiatric and functional rather than structural. Pain that is provoked by
    eating, speaking, and washing attacks the activities that make ordinary life
    possible, and the downstream psychiatric risk is large and measurable rather
    than impressionistic: roughly a threefold increase in newly diagnosed
    depressive, anxiety, and sleep disorders in a nationwide cohort. The
    glossopharyngeal subtype adds a small but real risk of cardiac syncope.
  evidence:
  - reference: PMID:26174508
    reference_title: "Risk of psychiatric disorders following trigeminal neuralgia: a nationwide population-based retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The adjusted hazard ratio (aHR) of depressive disorder, anxiety disorder and sleep disorder in subjects with TN was higher than that of the controls during the follow-up [aHR: 2.85 (95% confidence interval: 2.11-3.85), aHR: 2.98 (95% confidence interval: 2.12-4.18) and aHR: 2.17 (95% confidence interval: 1.48-3.19), respectively]."
    explanation: Nationwide cohort of 3273 patients quantifying the psychiatric burden that drives the HIGH assessment.
  - reference: PMID:26174508
    reference_title: "Risk of psychiatric disorders following trigeminal neuralgia: a nationwide population-based retrospective cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "TN might increase the risk of subsequent newly diagnosed depressive disorder, anxiety disorder, and sleep disorder, but not schizophrenia or bipolar disorder."
    explanation: >-
      The authors' own hedged conclusion, kept rather than trimmed. It also
      records the negative result for schizophrenia and bipolar disorder, so the
      burden claim is not read more broadly than the data support.
pathophysiology:
- name: Neurovascular Compression at the Nerve Root Entry Zone
  role: trigger
  biological_scale: TISSUE
  description: >-
    An arterial loop, less often a vein, contacts the sensory nerve root close
    to its entry into the brainstem and indents, displaces, or flattens it.
    Contact alone is common on asymptomatic nerves and is not sufficient; it is
    the morphological change — displacement or atrophy — that is specific to the
    symptomatic side, and its location at the root entry zone that carries the
    diagnostic weight. The compression is pulsatile, so the mechanical insult is
    delivered with every arterial cycle over years.
  locations:
  - preferred_term: trigeminal nerve root
    term:
      id: UBERON:0004673
      label: trigeminal nerve root
  - preferred_term: superior cerebellar artery
    term:
      id: UBERON:0001635
      label: superior cerebellar artery
  notes: >-
    No `biological_processes` binding. GO:0009612 response to mechanical
    stimulus was tried here and removed: it names a cell-level response, whereas
    this node is the tissue-scale mechanical insult itself -- the vessel
    indenting the root -- and not the nerve's response to it. The anatomy is
    carried by `locations`.
  evidence:
  - reference: PMID:25541189
    reference_title: Significance of neurovascular contact in classical trigeminal neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe neurovascular contact was highly prevalent on the symptomatic compared to the asymptomatic side [53% versus 13%, P < 0.001, odds ratio = 11.6 (4.7-28.9), P < 0.001]. Severe neurovascular contact was caused by arteries in 98%."
    explanation: Blinded 3T MRI study establishing that it is severe contact, arterial in almost all cases, that associates with the painful side.
  - reference: PMID:25541189
    reference_title: Significance of neurovascular contact in classical trigeminal neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe neurovascular contact is involved in the aetiology of classical trigeminal neuralgia and that it is caused by arteries located in the root entry zone"
    explanation: Localises the aetiologically relevant compression to the root entry zone specifically.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "neurovascular contact was found in 471 out of 531 symptomatic nerves (89%) and 244 of 681 asymptomatic nerves (36%), indicating high sensitivity but poor specificity."
    explanation: Meta-analytic figures showing why mere contact is insufficient, which is why this node is framed as morphological compression rather than contact.
  downstream:
  - target: Focal Demyelination and Axonal Juxtaposition
    causal_link_type: DIRECT
    description: >-
      Chronic compression at the root strips myelin over a short segment and
      brings bare axons into direct apposition without intervening glial
      processes.
    evidence:
    - reference: PMID:11701590
      reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Examination of trigeminal nerve roots from patients with compression of the nerve root by an overlying blood vessel has revealed focal demyelination in the region of compression, with close apposition of demyelinated axons and an absence of intervening glial processes."
      explanation: Direct histopathology of surgically obtained human nerve roots links the compression to the demyelinating lesion.
- name: Focal Demyelination and Axonal Juxtaposition
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The compressed segment of the root loses myelin and demyelinated axons come
    to lie against one another with no glial process between them. Because the
    proximal root is a central-nervous-system segment, the myelinating cell
    involved there is the oligodendrocyte rather than the Schwann cell. This is
    the lesion that the two aetiological routes of this disease converge on:
    vascular compression reaches it mechanically, multiple sclerosis reaches it
    immunologically, and a posterior fossa tumour reaches it by mass effect.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelin maintenance
    modifier: DECREASED
    term:
      id: GO:0043217
      label: myelin maintenance
  locations:
  - preferred_term: trigeminal nerve root
    term:
      id: UBERON:0004673
      label: trigeminal nerve root
  evidence:
  - reference: PMID:11701590
    reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is now persuasive evidence that trigeminal neuralgia is usually caused by demyelination of trigeminal sensory fibres within either the nerve root or, less commonly, the brainstem."
    explanation: States demyelination of the sensory fibres as the usual proximate cause, the claim this node represents.
  - reference: PMID:11701590
    reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases, the trigeminal nerve root demyelination involves the proximal, CNS part of the root and results from compression by an overlying artery or vein."
    explanation: Establishes that the demyelinated segment is the central (oligodendrocyte-myelinated) part of the root.
  downstream:
  - target: Ectopic Discharge and Ephaptic Cross-Excitation
    causal_link_type: DIRECT
    description: >-
      Bare, closely apposed axons permit spontaneous impulse generation and
      direct electrical spread from one fibre to its neighbours.
    evidence:
    - reference: PMID:11701590
      reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Experimental studies indicate that this anatomical arrangement favours the ectopic generation of spontaneous nerve impulses and their ephaptic conduction to adjacent fibres, and that spontaneous nerve activity is likely to be increased by the deformity associated with pulsatile vascular indentation."
      explanation: Ties the histological arrangement directly to ectopic generation and ephaptic conduction.
  - target: Dysregulated Voltage-Gated Sodium Channel Expression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - injury-induced transcriptional remodelling in trigeminal ganglion neurons
    description: >-
      Demyelinating injury of the root is followed by a change in which
      sodium-channel subunits the affected sensory neurons express and where
      those channels sit in the membrane.
    evidence:
    - reference: PMID:31908187
      reference_title: "Trigeminal neuralgia: An overview from pathophysiology to pharmacological treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Classic trigeminal neuralgia is associated with neurovascular compression in the trigeminal root entry zone, which can lead to demyelination and a dysregulation of voltage-gated sodium channel expression in the membrane."
      explanation: States the demyelination-to-channel-dysregulation step this edge represents.
- name: Dysregulated Voltage-Gated Sodium Channel Expression
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Injured trigeminal sensory neurons remodel their voltage-gated sodium
    channel complement, lowering the threshold for impulse initiation and
    supporting repetitive high-frequency firing. This is the node that the
    first-line drugs act on: carbamazepine and oxcarbazepine stabilize the
    inactivated state of these channels. The specific subunit pattern is
    characterised mainly in rodent nerve-injury models rather than in human
    tissue, so the identity of the individual channels is held less firmly than
    the fact of the dysregulation.
  cell_types:
  - preferred_term: trigeminal ganglion sensory neuron
    term:
      id: CL:4023169
      label: trigeminal neuron
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    modifier: DYSREGULATED
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  biological_processes:
  - preferred_term: regulation of membrane potential
    modifier: ABNORMAL
    term:
      id: GO:0042391
      label: regulation of membrane potential
  locations:
  - preferred_term: trigeminal ganglion
    term:
      id: UBERON:0001675
      label: trigeminal ganglion
  evidence:
  - reference: PMID:31908187
    reference_title: "Trigeminal neuralgia: An overview from pathophysiology to pharmacological treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic trigeminal neuralgia is associated with neurovascular compression in the trigeminal root entry zone, which can lead to demyelination and a dysregulation of voltage-gated sodium channel expression in the membrane. These alterations may be responsible for pain attacks in trigeminal neuralgia patients."
    explanation: >-
      Quoted as a contiguous pair so the referent of the pronoun sits inside the
      quote rather than outside it -- the alterations named are the
      channel dysregulation this node represents.
  - reference: PMID:27327156
    reference_title: "Changes in the expression of voltage-gated sodium channels Nav1.3, Nav1.7, Nav1.8, and Nav1.9 in rat trigeminal ganglia following chronic constriction injury."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "trigeminal ganglion in rats subjected to an infraorbital nerve-chronic constriction injury showed upregulation of Nav1.3 and downregulation of Nav1.7, Nav1.8, and Nav1.9 messenger RNA and protein levels"
    explanation: >-
      Rodent constriction-injury data give the direction of change for individual
      subunits. Graded PARTIAL because the model injures a peripheral trigeminal
      branch rather than reproducing root-entry-zone demyelination, and the
      subunit pattern has not been confirmed in human trigeminal ganglion.
  downstream:
  - target: Ectopic Discharge and Ephaptic Cross-Excitation
    causal_link_type: DIRECT
    description: >-
      A lowered firing threshold and altered channel kinetics make the injured
      afferents hyperexcitable, which is the precondition for the synchronized
      afterdischarge that generates a paroxysm.
    evidence:
    - reference: PMID:11803297
      reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Injury renders axons and axotomized somata hyperexcitable. The hyperexcitable afferents, in turn, give rise to pain paroxysms as a result of synchronized afterdischarge activity."
      explanation: States the hyperexcitability-to-synchronized-afterdischarge step that this edge asserts.
- name: Ectopic Discharge and Ephaptic Cross-Excitation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    At the demyelinated segment, impulses arise where they should not and spread
    laterally between apposed bare axons. A light touch carried by large tactile
    afferents can therefore ignite activity in nociceptive fibres, and the
    resulting cross-excitation is amplified into a synchronized high-frequency
    burst. This is the step that explains the two features nothing else in the
    disease accounts for: that an innocuous stimulus in a small trigger zone
    provokes severe pain, and that the paroxysm builds, peaks, and stops
    abruptly with a refractory period afterwards.
  cell_types:
  - preferred_term: trigeminal ganglion sensory neuron
    term:
      id: CL:4023169
      label: trigeminal neuron
  biological_processes:
  - preferred_term: neuronal action potential
    modifier: INCREASED
    term:
      id: GO:0019228
      label: neuronal action potential
  - preferred_term: action potential propagation
    modifier: ABNORMAL
    term:
      id: GO:0098870
      label: action potential propagation
  evidence:
  - reference: PMID:11701590
    reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical observations and electrophysiological studies support the concept that demyelination and ephaptic spread of excitation underlie most, if not all, of these conditions."
    explanation: >-
      Explicitly generalises the demyelination-plus-ephaptic-spread mechanism
      across the vascular-compression cranial nerve hyperactivity syndromes,
      which is the basis for curating these subtypes on one pathograph.
  - reference: PMID:35860499
    reference_title: "The Underlying Pathogenesis of Neurovascular Compression Syndromes: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, we can distinguish the following NVC conditions: trigeminal neuralgia, hemifacial spasm, and glossopharyngeal neuralgia. Also, rare cases of geniculate neuralgia and superior laryngeal neuralgia are reported."
    explanation: >-
      Independent corroboration of the lump/split decision from a 2022
      systematic review of 63 papers, two decades after Love and Coakham. It
      places trigeminal, glossopharyngeal, and geniculate (nervus intermedius)
      neuralgia on the same neurovascular-compression mechanism, which is the
      generalisation this entry's one-disease structure depends on.
  - reference: PMID:11803297
    reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ignition hypothesis accounts for the major positive and negative signs and symptoms of trigeminal neuralgia, for its pathogenesis, and for the efficacy of treatment modalities."
    explanation: The ignition formulation is the mechanistic account this node encodes.
  - reference: PMID:11803297
    reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Proof, however, awaits the availability of key experimental data that can only be obtained from patients with trigeminal neuralgia."
    explanation: >-
      Recorded deliberately as a limit on the node: the authors state the
      mechanism is deduced rather than directly demonstrated in patients.
  downstream:
  - target: Paroxysmal Neuralgiform Pain
    causal_link_type: DIRECT
    description: >-
      The synchronized burst reaching central trigeminal pathways is experienced
      as a brief, abrupt, electric-shock-like paroxysm in the nerve's territory.
    evidence:
    - reference: PMID:11803297
      reference_title: "Pathophysiology of trigeminal neuralgia: the ignition hypothesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The hyperexcitable afferents, in turn, give rise to pain paroxysms as a result of synchronized afterdischarge activity."
      explanation: Directly states that synchronized afterdischarge produces the pain paroxysms.
- name: Paroxysmal Neuralgiform Pain
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the graph: abrupt, severe, stabbing or
    electric-shock-like pain lasting seconds to two minutes, confined to the
    territory of the affected nerve, recurring in volleys and typically evoked
    by an innocuous trigger. Complete remissions lasting weeks to years are
    characteristic and distinguish it from most other neuropathic pain.
  biological_processes:
  - preferred_term: sensory perception of pain
    modifier: INCREASED
    term:
      id: GO:0019233
      label: sensory perception of pain
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical characterizations include notions of brief, sudden, stabbing, electric shock–like, and severe pain attacks."
    explanation: Describes the pain quality this outcome node represents.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike other forms of neuropathic pain, TN enters into periods of complete remission in up to 63% of patients."
    explanation: Supports the remitting-relapsing course stated in this node's description.
- name: Trigger Zone Mechanical Provocation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Innocuous mechanical stimulation of a confined cutaneous or intraoral
    trigger zone — chewing, talking, shaving, a breath of cold air, or, for
    glossopharyngeal neuralgia, swallowing — sets off a paroxysm. Evoked attacks
    are so nearly universal in classical trigeminal neuralgia that their
    presence is a diagnostic criterion. Triggerability has been interpreted as a
    sign of cross-excitation between tactile and nociceptive fibres, which is
    the reading this graph follows, but it is an interpretation rather than a
    directly demonstrated coupling.
  biological_processes:
  - preferred_term: detection of mechanical stimulus involved in sensory perception
    term:
      id: GO:0050974
      label: detection of mechanical stimulus involved in sensory perception
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the few studies that examined trigger stimuli or maneuvers in classical TN, evoked pain was reported in 99% of the patients."
    explanation: Quantifies how nearly universal trigger-evoked pain is, supporting this as a mechanism node rather than an incidental feature.
  downstream:
  - target: Ectopic Discharge and Ephaptic Cross-Excitation
    causal_link_type: DIRECT
    description: >-
      Afferent traffic from the trigger zone enters the demyelinated segment and
      ignites cross-excitation into nociceptive fibres.
    evidence:
    - reference: PMID:11701590
      reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Experimental studies indicate that this anatomical arrangement favours the ectopic generation of spontaneous nerve impulses and their ephaptic conduction to adjacent fibres"
      explanation: >-
        Supports ephaptic conduction to adjacent fibres as the substrate for
        trigger-evoked attacks. Graded PARTIAL because this sentence concerns
        spontaneous impulses; it does not itself demonstrate that trigger-zone
        afferent traffic is the igniting input.
- name: Central Demyelinating Plaque in Multiple Sclerosis
  role: trigger
  biological_scale: TISSUE
  description: >-
    In secondary disease due to multiple sclerosis, an inflammatory
    demyelinating plaque involving the pontine trigeminal pathways or the root
    entry zone produces the same demyelinated, bare-axon segment that vascular
    compression produces mechanically. Increased susceptibility of the root to
    coexisting neurovascular contact has also been proposed. Bilateral disease,
    which is otherwise almost unknown, should raise suspicion of this route.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:11701590
    reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar foci of nerve root demyelination and juxtaposition of axons have been demonstrated in multiple sclerosis patients with trigeminal neuralgia."
    explanation: Human pathology showing that the MS route converges on the same histological lesion.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The development of pain paroxysms has variably been explained with the presence of demyelinating plaques in the pons or increased susceptibility of the trigeminal nerve root to neurovascular compression."
    explanation: Records that both explanations for MS-associated disease remain on the table, which is why this node is not asserted as a single settled route.
  downstream:
  - target: Focal Demyelination and Axonal Juxtaposition
    causal_link_type: DIRECT
    description: >-
      The plaque is itself the demyelinating lesion, so this route enters the
      shared graph at the demyelination node rather than upstream of it.
    evidence:
    - reference: PMID:11701590
      reference_title: "Trigeminal neuralgia: pathology and pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Other causes of trigeminal neuralgia in which demyelination is involved or implicated include multiple sclerosis and, probably, compressive space-occupying masses in the posterior fossa."
      explanation: Names multiple sclerosis as a demyelination-mediated cause, placing this node upstream of the shared demyelination node.
- name: Posterior Fossa Mass Compressing the Nerve Root
  role: trigger
  biological_scale: TISSUE
  description: >-
    A cerebellopontine-angle tumour, most often benign, compresses the root near
    its entry into the pons and induces focal demyelination in the same way an
    artery does. Malignant tumours behave differently: they tend to infiltrate
    the nerve and cause axonal degeneration, which produces a sensory deficit
    and a pain phenotype that does not resemble neuralgia. Tumour and multiple
    sclerosis together account for roughly 15% of trigeminal neuralgia, which is
    why imaging is required rather than optional.
  locations:
  - preferred_term: trigeminal nerve root
    term:
      id: UBERON:0004673
      label: trigeminal nerve root
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumors leading to TN are mostly benign and typically compress the root near its entry into the pons. The compression induces focal demyelination and is thought to trigger paroxysmal ectopic discharges."
    explanation: States the tumour-compression-to-demyelination-to-ectopic-discharge route this node represents.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A tumor at the cerebellopontine angle or MS causes TN in 15% of patients."
    explanation: Quantifies the combined secondary-aetiology fraction cited in this node's description.
  downstream:
  - target: Focal Demyelination and Axonal Juxtaposition
    causal_link_type: DIRECT
    description: >-
      Mass effect at the root entry zone produces the same focal demyelinating
      lesion as arterial compression.
    evidence:
    - reference: PMID:27306631
      reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The compression induces focal demyelination and is thought to trigger paroxysmal ectopic discharges."
      explanation: Directly asserts the compression-to-demyelination link for the tumour route.
- name: Extracranial Entrapment of the Occipital Nerves
  role: trigger
  biological_scale: TISSUE
  description: >-
    The mechanism proposed for occipital neuralgia, and the reason that subtype
    sits apart from the rest of this entry. The greater, lesser, and third
    occipital nerves are compressed at defined points along their extracranial
    course — where the greater occipital nerve curves around the obliquus capitis
    inferior, pierces the semispinalis capitis and trapezius, and crosses the
    occipital artery. There is no brainstem root entry zone involved, and this
    node is deliberately not connected to the demyelination-and-ephaptic chain,
    because the evidence for that chain comes from cranial nerve roots and has
    not been shown for these nerves.
  evidence:
  - reference: PMID:39217283
    reference_title: "An anatomical analysis of the occipital nerve complex: an essential tool for the application of occipital nerve blocks."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Six, four, and one potential entrapment points were detected for the GON, TON, and LON, respectively."
    explanation: >-
      Cadaveric dissection study establishing that the compression points
      relevant to these nerves are extracranial sites along their course rather
      than a root entry zone. Graded PARTIAL because it maps anatomy and does
      not show that entrapment at those points causes occipital neuralgia, and
      OTHER because it is a dissection study with no patients or cohort.
  downstream:
  - target: Paroxysmal Neuralgiform Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Entrapment of the occipital nerves is followed by lancinating pain in
      their territory. The intervening steps are not established for these
      nerves, and are deliberately not assumed to be the ephaptic mechanism
      demonstrated for cranial nerve roots.
    evidence:
    - reference: PMID:24737457
      reference_title: Occipital neuralgia.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Occipital neuralgia is an uncommon cause of occipital pain characterized by paroxysmal lancinating pain in the distribution of the greater, lesser or third occipital nerves."
      explanation: >-
        Establishes the pain endpoint in the occipital nerve territory. Graded
        PARTIAL because it describes the phenotype and does not itself
        demonstrate the entrapment-to-pain causal step.
phenotypes:
- category: Neurological
  name: Paroxysmal Lancinating Facial Pain
  description: >-
    Brief, abrupt, severe electric-shock-like pain attacks confined to the
    trigeminal territory, lasting seconds to two minutes and recurring from once
    to over fifty times a day.
  frequency: OBLIGATE
  subtype: Trigeminal
  phenotype_term:
    preferred_term: Trigeminal neuralgia
    term:
      id: HP:0100661
      label: Trigeminal neuralgia
    temporality: RECURRENT
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The paroxysms may last up to 2 minutes, but their duration is usually limited to a few seconds. Frequency of the pain attacks may range from 1 to over 50 a day."
    explanation: Quantifies attack duration and frequency for this phenotype.
- category: Neurological
  name: Unilateral Pain Distribution
  description: >-
    Pain is virtually always confined to one side. Truly simultaneous bilateral
    pain is essentially unreported in classical disease and, where bilateral
    involvement occurs over the course of illness, points towards multiple
    sclerosis.
  frequency: VERY_FREQUENT
  subtype: Trigeminal
  phenotype_term:
    preferred_term: Strictly unilateral pain distribution
  notes: >-
    Left unbound on purpose. This record is a laterality claim, and HPO has no
    term for it; the schema's `LateralityEnum` has no UNILATERAL value either.
    Binding HP:0033345 Neuralgia here would restate the pain concept already
    bound on the first phenotype without expressing the laterality, so the
    free-text `preferred_term` is kept instead.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Painful symptoms associated with TN are virtually always unilateral. Bilateral TN is very rare except for TN caused by multiple sclerosis (MS)."
    explanation: Supports both the unilaterality and its exception in multiple sclerosis.
- category: Neurological
  name: Concomitant Persistent Background Pain
  description: >-
    Roughly half of patients have continuous aching or burning pain in the same
    territory in addition to the paroxysms. It occurs across all three
    aetiological categories, and evidence that it improves independently of the
    paroxysms after decompression suggests the two components have distinct
    mechanisms.
  frequency: FREQUENT
  subtype: Trigeminal
  phenotype_term:
    preferred_term: Chronic pain
    term:
      id: HP:0012532
      label: Chronic pain
    temporality: CHRONIC
  evidence:
  - reference: PMID:25231219
    reference_title: Trigeminal neuralgia--a prospective systematic study of clinical characteristics in 158 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 78 (49%) had concomitant persistent pain in addition to paroxysmal stabbing pain."
    explanation: Prospective series quantifying the fraction with a persistent pain component.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is, however, compelling evidence that continuous and paroxysmal pain may improve independently after microvascular decompression, suggesting that the mechanisms responsible for the 2 pain components are distinct"
    explanation: Supports the claim that the persistent component is mechanistically separate from the paroxysms.
- category: Neurological
  name: Trigger-Evoked Attacks
  description: >-
    Attacks provoked by innocuous mechanical stimulation of a confined trigger
    zone — light touch, chewing, talking, shaving, cold air. Purely spontaneous
    disease is essentially unknown, and triggerability is used as a positive
    diagnostic criterion.
  frequency: VERY_FREQUENT
  subtype: Trigeminal
  phenotype_term:
    preferred_term: Trigger-zone-evoked pain paroxysm
  notes: >-
    Deliberately left unbound. HP:0012533 Allodynia is the obvious candidate and
    is wrong: the source cited here separates the two explicitly, noting that
    confined trigger zones and the refractory period after an attack distinguish
    triggered neuralgia from mechanical allodynia. No HPO term expresses
    trigger-zone-evoked paroxysm, so a free-text `preferred_term` is kept rather
    than asserting allodynia.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore we propose that triggered pain qualifies as criterion supporting the diagnosis of clinically established TN"
    explanation: Supports triggerability as a defining, diagnostically used feature.
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confined trigger zones and a common combination with brisk muscle contractions (tics) help distinguish triggered TN from allodynia in other conditions of neuropathic pain."
    explanation: The source separating triggered neuralgia from allodynia, which is why no HPO term is bound here.
- category: Neurological
  name: Sensory Deficit in the Affected Territory
  description: >-
    Clinically detectable loss of sensation is uncommon in classical disease but
    is found in about a third of patients with disease secondary to a tumour or
    multiple sclerosis, so its presence should prompt investigation. Subtle
    abnormalities are common on quantitative sensory testing even in classical
    disease, and their absence does not rule out a secondary cause.
  frequency: OCCASIONAL
  subtype: Trigeminal
  diagnostic: true
  phenotype_term:
    preferred_term: Hypoesthesia
    term:
      id: HP:0033748
      label: Hypoesthesia
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical deficits of discriminatory sensory functions are highly suspicious of TN caused by a major underlying disease. They occurred in 25 out of 67 patients (37%) with TN secondary to tumors or MS."
    explanation: >-
      Quoted as a contiguous pair so the referent of the pronoun sits inside the
      quote. Quantifies sensory deficit frequency in secondary disease, which is
      what makes it diagnostically useful.
  - reference: PMID:25231219
    reference_title: Trigeminal neuralgia--a prospective systematic study of clinical characteristics in 158 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who had not undergone surgery for TN had sensory abnormalities in 35 (29%)."
    explanation: Shows sensory abnormalities are not confined to secondary disease or to post-surgical patients.
- category: Neurological
  name: Cranial Autonomic Features
  description: >-
    Lacrimation, conjunctival injection, nasal congestion, rhinorrhoea, or
    flushing accompanying the pain. Their presence does not by itself reclassify
    the condition as a trigeminal autonomic cephalalgia, which is a common
    diagnostic trap.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Ictal lacrimation
    term:
      id: HP:0031731
      label: Increased tear production
  evidence:
  - reference: DOI:10.22514/jofph.2024.023
    reference_title: "Autonomic features of craniofacial neuralgias: a systematic review with meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "40% of all patients with craniofacial neuralgias had at least one autonomic feature."
    explanation: Meta-analytic estimate of how often autonomic features accompany craniofacial neuralgia.
  - reference: DOI:10.22514/jofph.2024.023
    reference_title: "Autonomic features of craniofacial neuralgias: a systematic review with meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With trigeminal neuralgia, the most common autonomic feature was lacrimation, and the least common was nasal congestion."
    explanation: Identifies lacrimation as the commonest autonomic accompaniment in trigeminal neuralgia, which is the phenotype term bound here.
  - reference: PMID:25231219
    reference_title: Trigeminal neuralgia--a prospective systematic study of clinical characteristics in 158 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic symptoms were present in 48 (31%)."
    explanation: Independent prospective series giving a concordant frequency.
- category: Neurological
  name: Deep Ear Pain
  description: >-
    Paroxysmal pain felt deep in the ear, radiating to the auditory canal,
    auricle, mastoid, soft palate, temple, or angle of the jaw. Characteristic of
    nervus intermedius neuralgia, and a major source of diagnostic overlap with
    glossopharyngeal neuralgia.
  subtype: Nervus Intermedius
  phenotype_term:
    preferred_term: Ear pain
    term:
      id: HP:0030766
      label: Ear pain
  evidence:
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NIN presents as a rare neuralgia of this nerve, causing deep ear pain, which may radiate to the auditory canal, auricle, mastoid, soft palate, temple, and angle of the jaw."
    explanation: Defines the pain territory of this phenotype.
- category: Neurological
  name: Occipital Scalp Pain
  description: >-
    Paroxysmal lancinating pain over the posterior scalp in the greater, lesser,
    or third occipital nerve distribution, frequently mistaken for cervicogenic

name: Cranial Neuralgia
creation_date: '2026-08-28T00:00:00Z'
category: Complex
categories:
- Neurological
- Neuropathic Pain
parents:
- neuralgia
- cranial nerve neuropathy
synonyms:
- cranial nerve neuralgia
- craniofacial neuralgia
disease_term:
  preferred_term: cranial neuralgia
  term:
    id: MONDO:0016374
    label: cranial neuralgia
description: >-
  Cranial neuralgia is paroxysmal, severe, lancinating pain confined to the
  sensory territory of a cranial (or, by clinical convention, an upper cervical)
  nerve, characteristically provoked by innocuous stimulation of a trigger zone.
  In the nerve-defined forms that dominate the category — trigeminal neuralgia
  by a wide margin, then glossopharyngeal and nervus intermedius neuralgia — the
  best-supported mechanism is chronic pulsatile compression of the nerve root by
  an overlying artery close to its entry into the brainstem. That compression
  produces focal demyelination and juxtaposition of bare axons, which favours
  ectopic impulse generation and ephaptic cross-talk between large tactile
  afferents and nociceptive fibres; synchronized high-frequency afterdischarge
  is then experienced as an abrupt shock-like paroxysm. The same demyelinating
  lesion is reached by other routes in secondary disease, most often a
  pontine multiple sclerosis plaque or a posterior fossa tumour compressing the
  root. Sodium-channel-blocking anticonvulsants (carbamazepine, oxcarbazepine)
  suppress the high-frequency firing and are first-line; microvascular
  decompression removes the compressive lesion itself and gives the most durable
  medication-free relief.
notes: >-
  Concept decision (issue #9605). This is curated as a single Disease entry with
  nerve-defined `has_subtypes` rather than as a `kb/groupings/` union, because
  the classical forms share one mechanistic spine node-for-node: neurovascular
  compression at the root entry zone -> focal demyelination -> ectopic discharge
  and ephaptic cross-excitation -> paroxysmal lancinating pain, with the same
  first-line drug class and the same cause-directed operation. Love and Coakham
  (PMID:11701590) make that argument explicitly, concluding that demyelination
  and ephaptic spread underlie most or all of the vascular-compression cranial
  nerve hyperactivity syndromes. What varies between subtypes is which nerve
  carries the lesion, and therefore the pain territory, the offending vessel,
  and the trigger manoeuvre — anatomical substitution on a conserved graph,
  which is the same pattern the mechanism-module convention treats as
  conformance rather than as a union of distinct diseases.
  .
  Occipital neuralgia is the deliberate exception and is curated as a subtype
  with a stated caveat rather than silently folded in. It is grouped here by
  ICHD-3 clinical convention and by the MONDO/HPO neuralgia hierarchy, but the
  greater and lesser occipital nerves are branches of the C2-C3 dorsal rami, not
  cranial nerves, and the compression points described anatomically are
  extracranial sites along the nerve's course through muscle and beside the
  occipital artery (PMID:39217283) rather than a brainstem root entry zone. Its
  pathophysiology node is therefore kept separate from the root-entry-zone node
  and does not claim the ephaptic mechanism. Note also that MONDO:0016374 does
  not itself have occipital neuralgia among its descendants.
  .
  The falcon deep-research report generated for this entry argued the opposite
  case — that cranial neuralgia is "an umbrella clinical category, not one
  etiologically uniform disease" and that the entities should be represented
  separately. That reading is recorded here rather than discarded: it is correct
  about epidemiology and about procedure selection, which genuinely do not
  transfer between subtypes, and it is the reason prevalence and treatment
  records in this entry are subtype-scoped instead of stated at the root. It is
  the mechanism, not the clinical management, that is shared. If a future
  curator finds the per-subtype pathographs diverging further, splitting
  trigeminal neuralgia (MONDO:0008599) into its own entry and converting this
  one to a grouping would be the right move. The `stubs/Trigeminal_Neuralgia.yaml`
  queue entry is closed by this PR because MONDO:0008599 is now covered as a
  `has_subtypes` entry here; re-nominating it is the route if that split is
  later wanted.
definitions:
- name: Paroxysmal cranial neuralgia pain phenotype
  definition_type: OTHER
  description: >-
    Recurrent brief shock-like pain restricted to the distribution of a single
    cranial nerve, of abrupt onset and termination, usually unilateral.
  scope: Applies across the nerve-defined subtypes; does not by itself distinguish classical from secondary aetiology.
  evidence:
  - reference: PMID:38575268
    reference_title: Trigeminal and Glossopharyngeal Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trigeminal neuralgia and glossopharyngeal neuralgia are craniofacial pain syndromes characterized by recurrent brief shock-like pains in the distributions of their respective cranial nerves."
    explanation: States the shared paroxysmal, nerve-territory-confined pain phenotype that defines the category.
- name: Aetiological classification of trigeminal neuralgia
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Three-category aetiological grading: classical (imaging shows vascular
    compression with morphological change of the nerve root), secondary (an
    identifiable underlying neurological disease), and idiopathic (no cause
    found).
  scope: >-
    Developed for trigeminal neuralgia and extended by analogy to the other
    cranial neuralgias, where it has not been separately validated.
  evidence:
  - reference: PMID:27306631
    reference_title: "Trigeminal neuralgia: New classification and diagnostic grading for practice and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classical TN requires demonstration of morphologic changes in the trigeminal nerve root from vascular compression. Secondary TN is due to an identifiable underlying neurologic disease. TN of unknown etiology is labeled idiopathic."
    explanation: Gives the three aetiological categories verbatim as proposed by the classification working group.
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Like trigeminal neuralgia, NIN can be divided into classic, idiopathic, secondary, or painful neuropathy."
    explanation: Supports extension of the same scheme to nervus intermedius neuralgia, though this review notes the evidence base for that subtype is thin.
has_subtypes:
- name: Trigeminal
  display_name: Trigeminal Neuralgia (CN V)
  classification: affected_nerve
  description: >-
    By far the commonest cranial neuralgia. Pain is confined to one or more
    divisions of the trigeminal nerve, most often the maxillary and mandibular
    divisions, and is almost always unilateral. Severe neurovascular contact at
    the trigeminal root entry zone, usually arterial, is the dominant classical
    aetiology.
  subtype_term:
    preferred_term: trigeminal neuralgia
    term:
      id: MONDO:0008599
      label: trigeminal neuralgia
  locations:
  - preferred_term: trigeminal nerve root
    term:
      id: UBERON:0004673
      label: trigeminal nerve root
  evidence:
  - reference: PMID:25231219
    reference_title: Trigeminal neuralgia--a prospective systematic study of clinical characteristics in 158 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It affected solely the second and/or third trigeminal branch in 109 (69%) while the first branch alone was affected in only 7 (4%)."
    explanation: Prospective series quantifies the divisional distribution that characterises this subtype.
- name: Glossopharyngeal
  display_name: Glossopharyngeal Neuralgia (CN IX)
  classification: affected_nerve
  description: >-
    Paroxysmal pain in the posterior tongue, tonsillar fossa, pharynx, and deep
    ear, triggered by swallowing, talking, or coughing. Compression of the
    glossopharyngeal and vagal rootlets near the medulla is the usual classical
    cause; recruitment of vagal reflex arcs can produce bradycardia and syncope.
  subtype_term:
    preferred_term: glossopharyngeal neuralgia
    term:
      id: MONDO:0016372
      label: glossopharyngeal neuralgia
  locations:
  - preferred_term: glossopharyngeal nerve
    term:
      id: UBERON:0001649
      label: glossopharyngeal nerve
  evidence:
  - reference: PMID:28263933
    reference_title: "Microvascular Decompression for Glossopharyngeal Neuralgia: Long-Term Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic GPN is usually caused by pulsatile neurovascular compression of the glossopharyngeal and vagus rootlets."
    explanation: Operative series identifies rootlet compression as the usual classical aetiology of this subtype.
- name: Nervus Intermedius
  display_name: Nervus Intermedius (Geniculate) Neuralgia (CN VII sensory root)
  classification: affected_nerve
  description: >-
    A rare neuralgia of the sensory branch of the facial nerve, producing deep
    ear pain that may radiate to the auditory canal, auricle, mastoid, soft
    palate, temple, and angle of the jaw. Compression by the anterior inferior
    cerebellar artery is the most commonly described cause. Diagnosis is
    confounded by overlap with trigeminal and glossopharyngeal territory.
  locations:
  - preferred_term: sensory root of facial nerve
    term:
      id: UBERON:0001699
      label: sensory root of facial nerve
  evidence:
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NIN presents as a rare neuralgia of this nerve, causing deep ear pain, which may radiate to the auditory canal, auricle, mastoid, soft palate, temple, and angle of the jaw."
    explanation: Defines the pain territory of this subtype.
  - reference: PMID:39847207
    reference_title: Nervus Intermedius Neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurovascular compression involving the anterior inferior cerebellar artery is the most common etiology described"
    explanation: Identifies the offending vessel for the classical form of this subtype.
- name: Occipital
  display_name: Occipital Neuralgia (greater, lesser, and third occipital nerves)
  classification: affected_nerve
  description: >-
    Paroxysmal lancinating pain in the distribution of the greater, lesser, or
    third occipital nerves over the posterior scalp. Included here by ICHD-3
    clinical convention and by the HPO neuralgia hierarchy, but mechanistically
    the outlier of this entry: these are branches of the C2-C3 dorsal rami
    rather than cranial nerves, and the described compression points lie
    extracranially along the nerve's course, not at a brainstem root entry
    zone. See the entry-level notes.
  evidence:
  - reference: PMID:24737457
    reference_title: Occipital neuralgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occipital neuralgia is an uncommon cause of occipital pain characterized by paroxysmal lancinating pain in the distribution of the greater, lesser or third occipital nerves."
    explanation: Establishes the pain character and nerve territory that place this alongside the cranial neuralgias.

name: Melanoma and Neural System Tumor Syndrome
creation_date: "2026-10-21T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: melanoma and neural system tumor syndrome
  term:
    id: MONDO:0007967
    label: melanoma and neural system tumor syndrome
description: >
  Melanoma and neural system tumor syndrome (melanoma-astrocytoma syndrome, MAS) is a rare
  autosomal dominant hereditary cancer predisposition caused by germline loss-of-function
  variants at the CDKN2A locus on chromosome 9p21, characterized by a dual predisposition to
  cutaneous melanoma and nervous system tumors, most commonly astrocytoma. The CDKN2A locus
  encodes two distinct tumor suppressors from overlapping reading frames: p16INK4A, an
  inhibitor of CDK4/CDK6 that maintains RB-mediated cell-cycle control, and p14ARF, which
  stabilizes p53 by antagonizing MDM2. Loss of p16INK4A function underlies the melanoma
  predisposition shared with familial melanoma, whereas the nervous system tumor component
  that defines this syndrome is specifically associated with variants that disrupt the
  p14ARF isoform. Affected individuals also frequently have a high total nevus count with
  atypical (dysplastic) nevi, elevated pancreatic cancer risk, and a peripheral nerve sheath
  tumor spectrum (neurofibroma, schwannoma, malignant peripheral nerve sheath tumor) that can
  mimic neurofibromatosis type 1.

inheritance:
- name: Autosomal dominant inheritance
  description: >
    MAS is inherited in an autosomal dominant manner; most affected individuals inherit the
    CDKN2A pathogenic variant from a parent, who may or may not have had a cancer diagnosis,
    and each child of a carrier has a 50% chance of inheriting it.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:40674536
    reference_title: "CDKN2A Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CDKN2A cancer predisposition is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the autosomal dominant inheritance of CDKN2A cancer predisposition.

pathophysiology:
- name: Germline CDKN2A First-Hit Inactivation
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >
    A constitutional (germline) loss-of-function lesion at the 9p21 CDKN2A locus is present in
    every cell as the inherited first hit. In MAS the lesion characteristically affects the
    p14ARF-specific exon 1 beta, alone or as part of a contiguous deletion that also removes
    p16INK4A (and sometimes CDKN2B/p15), establishing predisposition to both melanoma and
    nervous system tumors.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  downstream:
  - target: Somatic Second-Hit Biallelic Inactivation
    description: >-
      The inherited heterozygous lesion predisposes susceptible cells to tumor-initiating
      biallelic inactivation once the wild-type allele is lost.
  evidence:
  - reference: PMID:9622062
    reference_title: "Germ-line deletion involving the INK4 locus in familial proneness to melanoma and nervous system tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a more circumscribed molecular lesion disrupting p16 and p19 but leaving p15 unaltered segregated with the melanoma-astrocytoma syndrome (MIM 155755)"
    explanation: Identifies a germline 9p21/INK4-locus lesion cosegregating with the melanoma-astrocytoma syndrome.
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family characterized by multiple melanoma and neural cell tumours segregating with a germline deletion of the p14(ARF)-specific exon 1beta of the CDKN2A gene."
    explanation: Documents a germline p14ARF-specific deletion cosegregating with the syndrome.

- name: Somatic Second-Hit Biallelic Inactivation
  biological_scale: CELLULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >
    Following the Knudson two-hit model, a somatic event inactivates the remaining wild-type
    CDKN2A allele in a susceptible melanocyte or neural cell, producing biallelic loss of the
    encoded tumor suppressors and releasing the brakes on proliferation.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: p16INK4A-CDK4/6-RB Axis Disruption
    description: Biallelic loss of p16INK4A removes inhibition of the CDK4/6-RB cell-cycle axis.
  - target: p14ARF-MDM2-p53 Axis Disruption
    description: Biallelic loss of p14ARF removes stabilization of p53 via MDM2 antagonism.
  evidence:
  - reference: PMID:9622062
    reference_title: "Germ-line deletion involving the INK4 locus in familial proneness to melanoma and nervous system tumors."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple cancer susceptibility in these two families ensues from contiguous tumor suppressor gene deletion"
    explanation: >-
      Establishes the CDKN2A-locus genes as tumor suppressors whose loss drives cancer
      susceptibility; tumor initiation follows biallelic (two-hit) inactivation of these suppressors.

- name: p16INK4A-CDK4/6-RB Axis Disruption
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >
    p16INK4A normally inhibits CDK4 and CDK6, keeping RB hypophosphorylated and enforcing the
    G1/S cell-cycle checkpoint. Loss of p16INK4A permits unopposed CDK4/6 activity, RB
    phosphorylation, and loss of checkpoint control, driving the melanocytic (melanoma)
    component of the syndrome.
  molecular_functions:
  - preferred_term: cyclin-dependent protein serine/threonine kinase activity
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: negative regulation of mitotic cell cycle phase transition
    term:
      id: GO:1901991
      label: negative regulation of mitotic cell cycle phase transition
    modifier: DECREASED
  downstream:
  - target: Clonal Expansion and Tumor Initiation
    description: Loss of cell-cycle checkpoint control permits clonal outgrowth of the affected cell.
  evidence:
  - reference: PMID:9622062
    reference_title: "Germ-line deletion involving the INK4 locus in familial proneness to melanoma and nervous system tumors."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several melanoma susceptibility genes have been identified, including p16, a clustered tumor suppressor."
    explanation: Identifies p16INK4A as the melanoma susceptibility gene whose loss drives the melanoma component.

- name: p14ARF-MDM2-p53 Axis Disruption
  biological_scale: MOLECULAR
  description: >
    p14ARF (CDKN2A exon 1 beta) stabilizes p53 by sequestering and inhibiting MDM2. Loss of
    p14ARF leaves MDM2 unopposed, accelerating p53 degradation and blunting p53-dependent
    tumor suppression. Disruption of this axis is the abnormality specifically linked to the
    nervous system tumor (astrocytoma) component that defines MAS.
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: DECREASED
  downstream:
  - target: Clonal Expansion and Tumor Initiation
    description: Loss of p53-dependent tumor suppression permits clonal outgrowth, notably in astrocytes.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss of p14(ARF) function being the critical abnormality associated with this syndrome"
    explanation: Identifies loss of p14ARF function as the critical abnormality of the syndrome, upstream of its p53-axis consequences.

- name: Clonal Expansion and Tumor Initiation
  biological_scale: CELLULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >
    A cell that has sustained biallelic CDKN2A inactivation, with both the RB and p53 tumor
    suppressor circuits disabled, escapes antiproliferative control and expands clonally.
    Melanocytes give rise to cutaneous melanoma and astrocytes to astrocytoma and other
    nervous system tumors, accounting for the dual-tumor spectrum of the syndrome.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  downstream:
  - target: Cutaneous melanoma
    description: Clonal expansion of transformed melanocytes produces cutaneous melanoma.
  - target: Astrocytoma
    description: Clonal expansion of transformed astrocytes produces astrocytoma and related nervous system tumors.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The melanoma-astrocytoma syndrome is characterized by a dual predisposition to melanoma and neural system tumours, commonly astrocytoma."
    explanation: States the dual melanoma and nervous system tumor outcome of the syndrome.


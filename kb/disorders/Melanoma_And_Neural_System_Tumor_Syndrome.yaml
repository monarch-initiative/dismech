genetic:
- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  association: CDKN2A Germline Loss-of-Function Variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:40674536
      reference_title: "CDKN2A Cancer Predisposition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "CDKN2A cancer predisposition is inherited in an autosomal dominant manner."
      explanation: GeneReviews states autosomal dominant inheritance.
  notes: >
    CDKN2A encodes two tumor suppressors from overlapping reading frames: p16INK4A (a
    CDK4/CDK6 inhibitor) and p14ARF (an MDM2 antagonist that stabilizes p53). Germline
    CDKN2A loss-of-function causes CDKN2A cancer predisposition broadly; the nervous system
    tumor component that defines melanoma-astrocytoma syndrome is specifically associated with
    variants that disrupt the p14ARF isoform (exon 1 beta), whether as an isolated p14ARF
    lesion or as part of a contiguous 9p21 deletion.
  evidence:
  - reference: PMID:40674536
    reference_title: "CDKN2A Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of CDKN2A cancer predisposition is established in a proband by identification of a heterozygous germline pathogenic variant in CDKN2A by molecular genetic testing."
    explanation: Establishes heterozygous germline CDKN2A variants as causative.
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a germline deletion of the p14(ARF)-specific exon 1beta of the CDKN2A gene"
    explanation: Documents a p14ARF-specific germline CDKN2A lesion in a syndrome family.


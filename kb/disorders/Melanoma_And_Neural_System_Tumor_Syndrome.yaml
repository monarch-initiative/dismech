genetic:
- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Germline alterations of the CDKN2A locus (encoding p16INK4A and p14ARF) cause melanoma
    and neural system tumor syndrome; the neural tumor component has been associated
    particularly with lesions affecting p14ARF.
  notes: >-
    Reported lesions range from large contiguous deletions of the whole INK4 gene cluster
    (p16INK4A/p15INK4B/p14ARF) to lesions restricted to the p14ARF-specific exon 1beta,
    including deletions and a G16D missense, that spare the CDKN2A and CDKN2B coding
    sequences. The latter is the basis for treating loss of p14ARF, rather than contiguous
    loss of multiple genes, as sufficient for the neural-tumor phenotype.
  evidence:
  - reference: PMID:9622062
    reference_title: "Germ-line deletion involving the INK4 locus in familial proneness to melanoma and nervous system tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that multiple cancer susceptibility in these two families ensues from contiguous tumor suppressor gene deletion."
    explanation: The contiguous-gene-deletion model of the syndrome at the CDKN2A/INK4 locus.
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family characterized by multiple melanoma and neural cell tumours segregating with a germline deletion of the p14(ARF)-specific exon 1beta of the CDKN2A gene."
    explanation: Documents the p14ARF-restricted germline deletion in an affected family.
  - reference: PMID:15937071
    reference_title: "Comprehensive analysis of CDKN2A (p16INK4A/p14ARF) and CDKN2B genes in 53 melanoma index cases considered to be at heightened risk of melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a p14ARF exon 1beta missense germline mutation (G16D) in a melanoma-neural system tumour syndrome (CMM+NST) family"
    explanation: Documents a p14ARF exon 1beta missense (G16D) germline allele in a melanoma-neural system tumour family.

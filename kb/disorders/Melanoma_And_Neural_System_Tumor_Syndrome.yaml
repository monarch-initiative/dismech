      label: Genetic Testing
  description: >-
    The diagnosis rests on identifying a germline CDKN2A pathogenic variant (including a
    p14ARF-affecting deletion) in a person with a suggestive personal or family history of
    melanoma and nervous-system tumors.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDKN2A cancer predisposition is established in a proband by identification of a heterozygous germline pathogenic variant in CDKN2A by molecular genetic testing."
    explanation: GeneReviews statement of how the molecular diagnosis is established.
treatments:
- name: Melanoma Surveillance
  description: >-
    Full-skin dermatologic examination for melanoma every six months with monthly
    self-skin examinations, as for other CDKN2A melanoma-prone families.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Cutaneous Melanoma
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologic examination for melanoma every six months; monthly self-skin examinations"
    explanation: The GeneReviews dermatologic surveillance recommendation.
- name: Brain Imaging Surveillance for p14ARF Carriers
  description: >-
    Full-body and brain MRI is recommended specifically for carriers of a CDKN2A variant
    affecting the p14ARF isoform who have a family history of nervous-system tumors, which is
    the surveillance arm that distinguishes this syndrome from melanoma-only CDKN2A families.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Astrocytoma
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "full-body and brain MRI in those with a CDKN2A pathogenic variant affecting the p14ARF isoform in the setting of a family history of nervous system tumors."
    explanation: The GeneReviews surveillance recommendation tied specifically to p14ARF carriers, matching this syndrome's neural-tumor risk.
- name: Avoidance of Ultraviolet Exposure
  description: >-
    Avoidance of ultraviolet light, particularly sunburns and tanning booths, to reduce the
    environmental contribution to melanoma risk in genetically susceptible skin. Tobacco use
    is also to be avoided.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Cutaneous Melanoma
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Ultraviolet light exposure, particularly sunburns and tanning booths; tobacco use."
    explanation: The GeneReviews agents-and-circumstances-to-avoid recommendation.
differential_diagnoses:
- name: CDKN2A-related familial melanoma without neural tumors
  disease_term:
    preferred_term: familial melanoma
    term:
      id: MONDO:0018961
      label: familial melanoma
  description: >-
    The much more common presentation of germline CDKN2A alteration is melanoma (often with
    pancreatic cancer) without nervous-system tumors. The neural-tumor component, associated
    with p14ARF-affecting lesions, is what defines this syndrome against that background.
  distinguishing_features:
  - Co-segregating astrocytoma or other nervous-system tumors favors melanoma and neural system tumor syndrome.
  - A CDKN2A variant affecting the p14ARF isoform, particularly with a family history of nervous-system tumors, favors the neural-tumor syndrome.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The melanoma-astrocytoma syndrome is characterized by a dual predisposition to melanoma and neural system tumours, commonly astrocytoma."
    explanation: Establishes the dual predisposition that separates this syndrome from melanoma-only familial melanoma.
discussions:
- discussion_id: mast_p14arf_versus_contiguous_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neural-tumor component of melanoma and neural system tumor syndrome driven
    specifically by loss of p14ARF, or by contiguous loss of multiple INK4-locus tumor
    suppressors?
  attaches_to:
  - pathophysiology#Loss of p14ARF Function
  - pathophysiology#Germline CDKN2A Locus Alteration
  rationale: >-
    The syndrome was first explained by contiguous germline deletion of the whole INK4 gene
    cluster, so that the tumor spectrum reflected which neighbouring tumor suppressors were
    co-deleted. A later family carried a deletion restricted to the p14ARF-specific exon
    1beta, sparing the CDKN2A and CDKN2B coding sequences, which is consistent with loss of
    p14ARF alone being sufficient for the neural-tumor phenotype. The two models are not
    mutually exclusive across families, and the question bears on which carriers warrant
    brain-tumor surveillance.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results are consistent with either: (i) loss of p14(ARF) function being the critical abnormality associated with this syndrome, rather than contiguous loss of both the CDKN2A and CDKN2B genes as suggested previously; or (ii) disruption of expression of p16 by mechanisms as yet unknown."
    explanation: The authors state the open question directly, which is what this discussion records rather than resolves.
references:

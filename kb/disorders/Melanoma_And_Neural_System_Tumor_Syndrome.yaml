name: Melanoma and Neural System Tumor Syndrome
creation_date: "2026-10-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: melanoma-astrocytoma syndrome
  term:
    id: MONDO:0007967
    label: melanoma and neural system tumor syndrome
synonyms:
- melanoma-astrocytoma syndrome
- melanoma and nervous system tumor syndrome
- melanoma/NST syndrome
description: >-
  Melanoma and neural system tumor syndrome (melanoma-astrocytoma syndrome) is a rare
  autosomal dominant hereditary cancer predisposition syndrome in which affected
  individuals and families develop both cutaneous malignant melanoma and tumors of the
  nervous system. The neural tumors span astrocytic tumors (astrocytoma, glioblastoma) and
  nerve-sheath/peripheral tumors (schwannoma, malignant peripheral nerve sheath tumor,
  cutaneous neurofibroma, meningioma). It is caused by germline alteration of the CDKN2A
  locus on chromosome 9p21, which encodes two physically overlapping tumor-suppressor
  products: p16INK4A, which restrains the CDK4/6-cyclin D kinases that inactivate RB and
  drive the G1/S transition, and p14ARF, which stabilizes p53 by antagonizing MDM2.
  Tumorigenesis follows the two-hit model: the germline first hit is completed by a somatic
  second hit (loss of the wild-type 9p allele) in the tumor. The syndrome was originally
  attributed to contiguous germline deletion of the whole INK4 gene cluster, but a family
  with a deletion restricted to the p14ARF-specific exon 1beta showed that loss of p14ARF
  can be the critical lesion for the neural-tumor component. The melanoma arm overlaps the
  broader CDKN2A cancer predisposition / familial melanoma spectrum; what distinguishes this
  entry is the co-segregating nervous-system tumor component. Pancreatic cancer, also part
  of the CDKN2A spectrum, is modeled under the separate melanoma-pancreatic cancer syndrome
  (MONDO:0011713) rather than here (see differential diagnoses).
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Germline CDKN2A alterations segregate as an autosomal dominant trait; melanoma and
    nervous-system tumors co-occur within pedigrees, with incomplete and
    tumor-type-dependent penetrance.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A cancer predisposition is inherited in an autosomal dominant manner."
    explanation: GeneReviews statement of the inheritance pattern for CDKN2A-related predisposition.
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with CDKN2A cancer predisposition has a 50% chance of inheriting the pathogenic variant."
    explanation: The per-child transmission risk that genetic counselling turns on.
pathophysiology:
- name: Germline CDKN2A Locus Alteration
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    The constitutional first hit: a germline alteration of the CDKN2A locus at 9p21,
    classically a deletion spanning the INK4 gene cluster, or a lesion restricted to the
    p14ARF-specific exon 1beta. Because the locus's tumor-suppressor products are encoded in
    overlapping reading frames, a single structural lesion can inactivate more than one.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline deletions at CDKN2A; the neural-tumor component is associated
      particularly with lesions that remove or disrupt p14ARF.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  downstream:
  - target: Somatic Second-Hit Inactivation of CDKN2A
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9622062
    reference_title: "Germ-line deletion involving the INK4 locus in familial proneness to melanoma and nervous system tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the family segregating the melanoma/NST syndrome, a large germ-line deletion ablated the whole p16, p19, and p15 gene cluster (or INK4 locus)"
    explanation: Establishes a germline INK4-locus deletion segregating with the melanoma/nervous-system tumor syndrome.
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family characterized by multiple melanoma and neural cell tumours segregating with a germline deletion of the p14(ARF)-specific exon 1beta of the CDKN2A gene."
    explanation: Documents a germline lesion restricted to p14ARF in a melanoma-neural system tumour family.
- name: Somatic Second-Hit Inactivation of CDKN2A
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    In the tumor, the remaining wild-type 9p allele is lost somatically, producing biallelic
    CDKN2A inactivation. In melanoma-astrocytoma tumors this is seen as homozygous deletion
    of CDKN2A/B through loss of the other copy of chromosome 9p, completing the two-hit
    inactivation of both the p16INK4A and p14ARF arms.
  genetic_context:
    variant_origin: SOMATIC
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic loss of the wild-type CDKN2A/B allele (loss of heterozygosity or homozygous
      deletion) on top of the germline lesion.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  downstream:
  - target: Loss of p16INK4A Function
    causal_link_type: DIRECT
  - target: Loss of p14ARF Function
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28699883
    reference_title: "Familial melanoma-astrocytoma syndrome: synchronous diffuse astrocytoma and pleomorphic xanthoastrocytoma in a patient with germline CDKN2A/B deletion and a significant family history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the pleomorphic xanthoastrocytoma and diffuse astrocytoma were found to have homozygous deletion of <italic>CDKN2A/B</italic> due to somatic loss of the other copy of chromosome 9p containing the remaining intact alleles."
    explanation: Documents the somatic second hit (loss of the wild-type 9p allele) completing biallelic CDKN2A inactivation in the tumors.
  - reference: PMID:12019208
    reference_title: "Germline mutation of ARF in a melanoma kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the melanoma from one individual revealed a 62 bp deletion in exon 3 of the wildtype allele and loss of the mutant allele; these somatic changes would affect both CDKN2A and ARF."
    explanation: Independent documentation of somatic loss of the wild-type allele in a melanoma from a germline-ARF kindred.
- name: Loss of p16INK4A Function
  biological_scale: MOLECULAR
  description: >-
    p16INK4A is a cyclin-dependent kinase inhibitor that binds CDK4 and CDK6 and blocks
    their association with cyclin D. Loss of p16INK4A removes this inhibition and
    de-represses the RB pathway.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  molecular_functions:
  - preferred_term: cyclin-dependent protein kinase inhibitor activity
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Unrestrained CDK4/6-Cyclin D Kinase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The p16INK4a tumor suppressor protein functions as an inhibitor of CDK4 and CDK6, the D-type cyclin-dependent kinases that initiate the phosphorylation of the retinoblastoma tumor suppressor protein, RB."
    explanation: States the p16INK4A to CDK4/6 inhibitory function whose loss this node describes.
  - reference: PMID:15878778
    reference_title: "INK4a/ARF: a multifunctional tumor suppressor locus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The INK4a/ARF locus encodes two physically linked tumor suppressor proteins, p16(INK4a) and ARF, which regulate the RB and p53 pathways, respectively."
    explanation: Identifies p16INK4A as the RB-pathway arm of the locus whose loss this node describes.
- name: Unrestrained CDK4/6-Cyclin D Kinase Activity
  biological_scale: MOLECULAR
  description: >-
    Without p16INK4A, CDK4/6-cyclin D complexes are constitutively active and phosphorylate
    the retinoblastoma protein.
  molecular_functions:
  - preferred_term: cyclin-dependent protein kinase activity
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
    modifier: INCREASED
  downstream:
  - target: RB Inactivation and Unchecked G1/S Transition
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The p16INK4a tumor suppressor protein functions as an inhibitor of CDK4 and CDK6, the D-type cyclin-dependent kinases that initiate the phosphorylation of the retinoblastoma tumor suppressor protein, RB."
    explanation: Describes the CDK4/6 kinase activity that p16 normally restrains; its loss leaves that activity unrestrained.
- name: RB Inactivation and Unchecked G1/S Transition
  biological_scale: CELLULAR
  description: >-
    Hyperphosphorylated RB releases E2F, driving the G1-to-S transition and cell-cycle entry
    independent of normal mitogenic control.
  biological_processes:
  - preferred_term: negative regulation of G1/S transition of mitotic cell cycle
    term:
      id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
    modifier: DECREASED
  downstream:
  - target: Escape from Cellular Senescence and Clonal Expansion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Thus, p16INK4a has the capacity to arrest cells in the G1-phase of the cell cycle and its probable physiological role is in the implementation of irreversible growth arrest termed cellular senescence."
    explanation: The G1 arrest p16 normally imposes; loss of that brake is the unchecked G1/S transition this node describes.
- name: Loss of p14ARF Function
  biological_scale: MOLECULAR
  description: >-
    p14ARF (the alternate reading frame product of the CDKN2A locus) sequesters and inhibits
    MDM2. A germline lesion restricted to p14ARF (including exon 1beta deletions and the G16D
    missense) can be the critical abnormality for the neural-tumor component of this syndrome.
  downstream:
  - target: Enhanced MDM2-Mediated p53 Degradation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results are consistent with either: (i) loss of p14(ARF) function being the critical abnormality associated with this syndrome, rather than contiguous loss of both the CDKN2A and CDKN2B genes as suggested previously"
    explanation: Supports loss of p14ARF as a sufficient lesion for the syndrome, the claim this node makes.
  - reference: PMID:35904890
    reference_title: "CDKN2A exon 1B deletion predisposing to melanoma and neural system tumour syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "families with mutations involving the p14ARF-specific exon 1B may be predisposed to central nervous system tumours."
    explanation: Ties p14ARF-specific (exon 1B) lesions to the nervous-system tumor component.
  - reference: PMID:15878778
    reference_title: "INK4a/ARF: a multifunctional tumor suppressor locus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The INK4a/ARF locus encodes two physically linked tumor suppressor proteins, p16(INK4a) and ARF, which regulate the RB and p53 pathways, respectively."
    explanation: Identifies ARF as the p53-pathway arm of the locus whose loss this node describes.
- name: Enhanced MDM2-Mediated p53 Degradation
  biological_scale: MOLECULAR
  description: >-
    Unopposed MDM2 ubiquitinates p53 and targets it for proteasomal degradation, lowering
    p53 levels and activity.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: INCREASED
  downstream:
  - target: Impaired p53-Dependent Tumor Suppression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29665672
    reference_title: "Regulatory Network of ARF in Cancer Development."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "As a factor that induces senescence, the role of ARF as a tumor suppressor is closely linked to the p53-MDM2 axis, which is a key process that restrains tumor formation."
    explanation: Establishes the ARF-MDM2-p53 axis; loss of ARF releases MDM2 onto p53, which this node describes.
- name: Impaired p53-Dependent Tumor Suppression
  biological_scale: CELLULAR
  description: >-
    Reduced p53 activity blunts the apoptotic and senescence responses to oncogenic and
    genotoxic stress, a defect thought to underlie the nervous-system (astrocytic/glioma)
    tumor component of the syndrome.
  biological_processes:
  - preferred_term: signal transduction in response to DNA damage
    term:
      id: GO:0042770
      label: signal transduction in response to DNA damage
    modifier: DECREASED
  downstream:
  - target: Escape from Cellular Senescence and Clonal Expansion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21200141
    reference_title: "Beyond effector caspase inhibition: Bcl2L12 neutralizes p53 signaling in glioblastoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The prime importance of p53 signaling for gliomapathogenesis is further evidenced by epistatic genetic events targeting additional pathway components including deletion of p14 (Arf) (CDKN2A) and amplification of the p53-degrading ubiquitin ligases MDM2 and MDM4."
    explanation: Links p14ARF loss and the p53-MDM2 axis to glioma pathogenesis, the neural-tumor arm of this syndrome.
- name: Escape from Cellular Senescence and Clonal Expansion
  biological_scale: CELLULAR
  description: >-
    With the RB and p53 brakes disabled, melanocytes and glial/astrocytic cells bypass
    cellular senescence and expand clonally, accumulating further somatic hits toward
    malignancy.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: DECREASED
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  downstream:
  - target: Cutaneous Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Astrocytoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Glioblastoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Schwannoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Malignant Peripheral Nerve Sheath Tumor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cutaneous Neurofibroma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nervous System Neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27872202
    reference_title: "Genome-Wide Overexpression Screen Identifies Genes Able to Bypass p16-Mediated Senescence in Melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Malignant melanomas often arise from nevi, which result from initial oncogene-induced hyperproliferation of melanocytes that are maintained in a CDKN2A/p16-mediated senescent state."
    explanation: States the CDKN2A/p16-mediated senescent barrier in melanocytes whose bypass this node describes.
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "In contrast to normal cells, the function of the p16INK4a gene or its downstream mediators is frequently deregulated in many types of human cancers, illustrating the importance of cellular senescence in tumor suppression."
    explanation: Connects loss of the p16 senescence program to tumorigenesis, the step this node represents.
phenotypes:
- category: Neoplastic
  name: Cutaneous Melanoma
  description: >-
    Cutaneous malignant melanoma, often as multiple primaries, as in CDKN2A-related familial
    melanoma. In genomic-ascertained melanoma-astrocytoma cohorts it was seen in roughly
    17-29% of cases.
  phenotype_term:
    preferred_term: Cutaneous melanoma
    term:
      id: HP:0012056
      label: Cutaneous melanoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:8414022
    reference_title: "A familial syndrome with cutaneous malignant melanoma and cerebral astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family in which cutaneous malignant melanoma or cerebral astrocytoma, or both, developed in eight members over three generations."
    explanation: The original family description establishing melanoma as a core component of the syndrome.
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while cutaneous melanoma (2 of 12, 17%) and head and neck squamous cell carcinoma (2 of 12, 17%) were the most common nonneural malignant neoplasms"
    explanation: Gives the frequency of cutaneous melanoma in a genomic-ascertained MAS cohort, supporting the OCCASIONAL band.
- category: Neoplastic
  name: Astrocytoma
  description: >-
    Astrocytic nervous-system tumors are the characteristic neural component that defines this
    syndrome relative to CDKN2A familial melanoma without neural tumors. Brain neoplasms as a
    group occurred in roughly 29-33% of ascertained cases.
  phenotype_term:
    preferred_term: Astrocytoma
    term:
      id: HP:0009592
      label: Astrocytoma
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The melanoma-astrocytoma syndrome is characterized by a dual predisposition to melanoma and neural system tumours, commonly astrocytoma."
    explanation: Defines astrocytoma as the characteristic neural tumor of the syndrome.
  - reference: PMID:8414022
    reference_title: "A familial syndrome with cutaneous malignant melanoma and cerebral astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two patients with both malignant melanoma and astrocytoma, the brain tumor followed the diagnosis of melanoma by a period of 2 and 10 years and was the primary cause of morbidity and mortality."
    explanation: Documents astrocytoma co-occurring with melanoma in the index family.
- category: Neoplastic
  name: Glioblastoma
  description: >-
    High-grade astrocytic tumors, including glioblastoma, are among the brain neoplasms seen
    in affected individuals.
  phenotype_term:
    preferred_term: Glioblastoma multiforme
    term:
      id: HP:0012174
      label: Glioblastoma multiforme
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brain neoplasms (4 of 12, 33%; 1 glioblastoma, 1 gliosarcoma, 1 astrocytoma, 1 unspecified type) and schwannomas (3 of 12, 25%) were the most common malignant and benign neural tumors"
    explanation: Names glioblastoma among the brain neoplasms in a genomic-ascertained MAS cohort.
- category: Neoplastic
  name: Schwannoma
  description: >-
    Schwannomas are among the most common benign neural tumors in ascertained cases.
  phenotype_term:
    preferred_term: Schwannoma
    term:
      id: HP:0100008
      label: Schwannoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brain neoplasms (4 of 12, 33%; 1 glioblastoma, 1 gliosarcoma, 1 astrocytoma, 1 unspecified type) and schwannomas (3 of 12, 25%) were the most common malignant and benign neural tumors"
    explanation: Reports schwannoma frequency (25%) in a genomic-ascertained MAS cohort.
- category: Neoplastic
  name: Malignant Peripheral Nerve Sheath Tumor
  description: >-
    Malignant peripheral nerve sheath tumor is among the neural cancers reported in MAS case
    series.
  phenotype_term:
    preferred_term: Malignant peripheral nerve sheath tumor
    term:
      id: HP:0100697
      label: Neurofibrosarcoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "malignant peripheral nerve sheath tumor (2 of 14, 14%) were the most common neural cancers"
    explanation: Reports MPNST among the neural cancers (14%) in a MAS case series.
- category: Neoplastic
  name: Cutaneous Neurofibroma
  description: >-
    Cutaneous neurofibromas are common in MAS case series and can lead to a clinical
    misdiagnosis of neurofibromatosis type 1.
  phenotype_term:
    preferred_term: Cutaneous neurofibroma
    term:
      id: HP:0001067
      label: Neurofibroma
  frequency: FREQUENT
  evidence:
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous neurofibromas (7 of 14, 50%) and schwannomas (2 of 14, 14%) were also common."
    explanation: Reports cutaneous neurofibroma frequency (50%) in a MAS case series.
- category: Neoplastic
  name: Nervous System Neoplasm
  description: >-
    Beyond astrocytic tumors, other nervous-system neoplasms including peripheral nerve
    sheath tumors and meningiomas occur in some families, consistent with the "neural system
    tumor" component of the syndrome name.
  phenotype_term:
    preferred_term: Neoplasm of the nervous system
    term:
      id: HP:0004375
      label: Neoplasm of the nervous system
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:28699883
    reference_title: "Familial melanoma-astrocytoma syndrome: synchronous diffuse astrocytoma and pleomorphic xanthoastrocytoma in a patient with germline CDKN2A/B deletion and a significant family history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "other families develop both melanomas, astrocytomas, and occasionally other nervous-system neoplasms including peripheral nerve sheath tumors and meningiomas."
    explanation: Documents nervous-system neoplasms beyond astrocytoma (peripheral nerve sheath tumors, meningiomas) in the syndrome.
- category: Neoplastic
  name: Atypical Melanocytic Nevi
  description: >-
    A high total nevus count and atypical (dysplastic) melanocytic nevi are part of the
    melanoma-prone phenotype associated with CDKN2A, though their extent varies.
  phenotype_term:
    preferred_term: Atypical nevus
    term:
      id: HP:0001062
      label: Atypical nevus
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some affected individuals have a high total nevus count (often >50 nevi) and atypical-appearing nevi, although the number and extent of atypical nevi can vary significantly."
    explanation: GeneReviews statement on the nevus phenotype and its variability.

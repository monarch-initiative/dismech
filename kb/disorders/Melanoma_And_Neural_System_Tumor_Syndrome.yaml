differential_diagnoses:
- name: CDKN2A-related familial melanoma without neural tumors
  disease_term:
    preferred_term: familial melanoma
    term:
      id: MONDO:0018961
      label: familial melanoma
  description: >-
    The much more common presentation of germline CDKN2A alteration is melanoma (often with
    pancreatic cancer) without nervous-system tumors. The neural-tumor component, associated
    with p14ARF-affecting lesions, is what defines this syndrome against that background.
  distinguishing_features:
  - Co-segregating astrocytoma or other nervous-system tumors favors melanoma and neural system tumor syndrome.
  - A CDKN2A variant affecting the p14ARF isoform, particularly with a family history of nervous-system tumors, favors the neural-tumor syndrome.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The melanoma-astrocytoma syndrome is characterized by a dual predisposition to melanoma and neural system tumours, commonly astrocytoma."
    explanation: Establishes the dual predisposition that separates this syndrome from melanoma-only familial melanoma.
- name: Melanoma-pancreatic cancer syndrome
  disease_term:
    preferred_term: melanoma-pancreatic cancer syndrome
    term:
      id: MONDO:0011713
      label: melanoma-pancreatic cancer syndrome
  description: >-
    Pancreatic cancer is part of the broader CDKN2A tumor spectrum and GeneReviews recommends
    pancreatic surveillance for carriers, but the melanoma-pancreatic cancer combination is
    modeled as its own MONDO entity. Pancreatic cancer is therefore recorded there rather
    than as a core phenotype here; this entry is scoped to the melanoma plus nervous-system
    tumor combination.
  distinguishing_features:
  - A family history of pancreatic cancer with melanoma, without nervous-system tumors, points to melanoma-pancreatic cancer syndrome.
  - Co-segregating astrocytoma or other neural tumors points to melanoma and neural system tumor syndrome.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A cancer predisposition is characterized by an increased risk of developing multiple cutaneous melanomas, pancreatic cancer, and other tumors including gliomas and astrocytomas."
    explanation: Places pancreatic cancer in the CDKN2A spectrum, which this entry defers to the separate melanoma-pancreatic cancer syndrome entity.
- name: Neurofibromatosis type 1
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  description: >-
    Because cutaneous neurofibromas and nerve-sheath tumors are common in MAS, affected
    individuals can be clinically diagnosed with NF1; molecular testing distinguishes them, as
    a CDKN2A variant with no NF1 alteration was found in such a family.
  distinguishing_features:
  - An NF1 pathogenic variant, with cafe-au-lait macules and Lisch nodules, favors neurofibromatosis type 1.
  - A germline CDKN2A variant with melanoma and astrocytic tumors, and no NF1 variant, favors melanoma and neural system tumor syndrome.
  evidence:
  - reference: PMID:37585199
    reference_title: "Estimated Prevalence, Tumor Spectrum, and Neurofibromatosis Type 1-Like Phenotype of CDKN2A-Related Melanoma-Astrocytoma Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1 US family, a father and son with MAS had clinical diagnoses of neurofibromatosis type 1 (NF1)."
    explanation: Documents MAS being clinically misdiagnosed as NF1, which is why NF1 is a differential.
discussions:
- discussion_id: mast_p14arf_versus_contiguous_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neural-tumor component of melanoma and neural system tumor syndrome driven
    specifically by loss of p14ARF, or by contiguous loss of multiple INK4-locus tumor
    suppressors?
  attaches_to:
  - pathophysiology#Loss of p14ARF Function
  - pathophysiology#Germline CDKN2A Locus Alteration
  rationale: >-
    The syndrome was first explained by contiguous germline deletion of the whole INK4 gene
    cluster, so that the tumor spectrum reflected which neighbouring tumor suppressors were
    co-deleted. Later families carried lesions restricted to the p14ARF-specific exon 1beta,
    sparing the CDKN2A and CDKN2B coding sequences, which is consistent with loss of p14ARF
    alone being sufficient for the neural-tumor phenotype. The two models are not mutually
    exclusive across families, and the question bears on which carriers warrant brain-tumor
    surveillance.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results are consistent with either: (i) loss of p14(ARF) function being the critical abnormality associated with this syndrome, rather than contiguous loss of both the CDKN2A and CDKN2B genes as suggested previously; or (ii) disruption of expression of p16 by mechanisms as yet unknown."
    explanation: The authors state the open question directly, which is what this discussion records rather than resolves.
  - reference: PMID:35904890
    reference_title: "CDKN2A exon 1B deletion predisposing to melanoma and neural system tumour syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "families with mutations involving the p14ARF-specific exon 1B may be predisposed to central nervous system tumours."
    explanation: Supports the p14ARF-specific side of the open question with an additional exon 1B family.

discussions:
- discussion_id: mas_p14arf_nst_determinant
  prompt: >-
    Is loss of p14ARF function, rather than contiguous loss of p16INK4A and CDKN2B, the
    specific determinant of the nervous system tumor component that distinguishes
    melanoma-astrocytoma syndrome from CDKN2A-related familial melanoma?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#p14ARF-MDM2-p53 Axis Disruption
  rationale: >-
    The original contiguous-deletion families implicated loss of multiple adjacent tumor
    suppressors, but a family with an isolated germline deletion of the p14ARF-specific exon 1
    beta, sparing the CDKN2A and CDKN2B coding and promoter sequences, still manifested the
    melanoma-neural system tumor phenotype. This supports p14ARF loss as the critical
    abnormality, though disruption of p16 expression by other mechanisms was not excluded.
  evidence:
  - reference: PMID:11136714
    reference_title: "A germline deletion of p14(ARF) but not CDKN2A in a melanoma-neural system tumour syndrome family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results are consistent with either: (i) loss of p14(ARF) function being the critical abnormality associated with this syndrome, rather than contiguous loss of both the CDKN2A and CDKN2B genes as suggested previously; or (ii) disruption of expression of p16 by mechanisms as yet unknown."
    explanation: States the unresolved question of whether p14ARF loss alone determines the nervous system tumor component.


name: Melanoma and Neural System Tumor Syndrome
creation_date: "2026-10-13T19:38:43Z"
category: Mendelian
disease_term:
  preferred_term: melanoma-astrocytoma syndrome
  term:
    id: MONDO:0007967
    label: melanoma and neural system tumor syndrome
description: >-
  Rare autosomal dominant predisposition to cutaneous melanoma and nervous system
  tumors (typically astrocytoma) associated with germline deletions of the 9p21
  CDKN2A/CDKN2B locus.

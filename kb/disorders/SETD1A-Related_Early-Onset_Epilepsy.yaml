mechanistic_hypotheses:
- hypothesis_group_id: h3k4_transcriptional_dysregulation_model
  hypothesis_label: H3K4-Methylation-Dependent Transcriptional Dysregulation Model
  status: CANONICAL
  description: >-
    The disorder results from SETD1A haploinsufficiency: reduced Set1/COMPASS
    H3K4 methyltransferase dosage lowers activating promoter methylation,
    dysregulating synaptic and neurodevelopmental transcriptional programs in
    cortical neurons, whose disturbed development and function produce
    early-onset seizures with variable developmental impact. This is the
    model advanced by the defining report and supported by mouse, fly, and
    human iPSC work across the allelic SETD1A disorders. Notably, the
    chromatin lesion appears pharmacologically reversible in mice:
    antagonizing LSD1, the demethylase that counteracts Setd1a, fully rescues
    the behavioral and morphological deficits of Setd1a-deficient animals,
    and reinstating Setd1a expression in adulthood rescues cognitive
    deficits -- implying a postnatal therapeutic window rather than fixed
    structural damage.
  evidence:
  - reference: PMID:31606247
    reference_title: Recapitulation and Reversal of Schizophrenia-Related Phenotypes in Setd1a-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identify LSD1 as a major counteracting demethylase for Setd1a and
      show that its pharmacological antagonism results in a full rescue of the
      behavioral and morphological deficits in Setd1a-deficient mice.
    explanation: >-
      Demonstrates in mice that the consequences of the H3K4-methylation
      lesion are reversible by targeting the counteracting demethylase,
      supporting the causal centrality of the H3K4 axis in this model.
  - reference: PMID:26974950
    reference_title: Rare loss-of-function variants in SETD1A are associated with schizophrenia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that epigenetic dysregulation, specifically in the histone
      H3K4 methylation pathway, is an important mechanism in the pathogenesis
      of schizophrenia.
    explanation: >-
      Human genetic evidence for the H3K4-pathway mechanism shared across the
      SETD1A allelic series.
- hypothesis_group_id: camp_pka_network_hyperactivity_model
  hypothesis_label: cAMP/PKA-Driven Network Hyperactivity Model
  status: EMERGING
  description: >-
    In human SETD1A+/- iPSC-derived excitatory/inhibitory networks, SETD1A
    haploinsufficiency produces a hyperactive cAMP/PKA pathway, increased
    dendritic complexity, and increased network bursting, and pharmacological
    targeting of the cAMP pathway rescues the network phenotype. This offers
    a candidate molecular route from chromatin lesion to the network
    hyperexcitability presumed to underlie seizures -- and a candidate
    therapeutic axis -- but it has not been tested in patients or in an
    epilepsy-specific model.
  evidence:
  - reference: PMID:35508131
    reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, by pharmacologically targeting the cAMP pathway, we are able to
      rescue the network deficits in SETD1A+/- cultures.
    explanation: >-
      The rescue experiment that motivates the cAMP/PKA model and its
      therapeutic implication.

discussions:
- discussion_id: setd1a_epedd_model_directionality_mismatch
  prompt: >-
    Do existing SETD1A model systems capture the epileptogenic mechanism of
    EPEDD, given that Setd1a+/- mice show attenuated excitatory synaptic
    function while human SETD1A+/- iPSC networks are hyperactive and patients
    have early-onset epilepsy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Excitatory Synapse Development and Function
  - pathophysiology#Cortical Network Hyperexcitability
  rationale: >-
    Nearly all functional SETD1A work was designed to model schizophrenia.
    Setd1a+/- mice show reduced excitatory synaptic transmission in medial
    prefrontal cortex and behavioral abnormalities, without reported
    spontaneous seizures, whereas human SETD1A+/- iPSC-derived networks show
    increased bursting driven by glutamatergic neurons -- the direction
    expected for an epilepsy. Whether this reflects a genuine species
    difference, a developmental-stage difference (immature iPSC networks
    versus adult mouse cortex), or circuit-level compensation is unresolved,
    and no model has been assessed for seizure phenotypes or EEG. Translational
    validity of the mouse synaptic findings to the human epilepsy is therefore
    the open question, not the existence of a synaptic lesion.
  evidence:
  - reference: PMID:32937141
    reference_title: Setd1a Insufficiency in Mice Attenuates Excitatory Synaptic Function and Recapitulates Schizophrenia-Related Behavioral Abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings suggest that reduced SETD1A may attenuate excitatory
      synaptic function and contribute to the pathophysiology of SCZ.
    explanation: >-
      The mouse arm of the mismatch: attenuated excitatory function, framed
      as schizophrenia pathophysiology.
  - reference: PMID:35508131
    reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data show that SETD1A haploinsufficiency results in morphologically
      increased dendritic complexity and functionally increased bursting
      activity.
    explanation: >-
      The human-cell arm of the mismatch: increased network activity.
  proposed_experiments:
  - experiment_id: setd1a_mouse_eeg_seizure_threshold
    name: EEG and seizure-threshold phenotyping of Setd1a haploinsufficient mice
    description: >-
      Chronic video-EEG and chemoconvulsant seizure-threshold testing in
      existing Setd1a+/- lines, across developmental stages, to determine
      whether the models express a hyperexcitability phenotype relevant to
      EPEDD at any age.
    would_support:
    - pathophysiology#Cortical Network Hyperexcitability
    supporting_outcome:
    - >-
      Spontaneous epileptiform discharges or lowered seizure threshold in
      Setd1a+/- mice, particularly in early postnatal life.
    refuting_outcome:
    - >-
      Normal EEG and seizure thresholds at all ages despite confirmed
      haploinsufficiency, which would localize the epileptogenic mechanism to
      human-specific or developmental-stage-specific biology.


inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous SETD1A variants act dominantly. Most reported epilepsy-causing
    variants arose de novo, but dominance is not exclusively de novo: the
    defining report includes a missense variant transmitted with seizures
    through a four-generation family, so cascade testing of parents and
    relatives is warranted even when the proband appears sporadic.
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified four missense mutations in the SETD1A gene (SET
      domain-containing 1A, histone lysine methyltransferase): three de novo
      mutations in three individuals and one inherited mutation in a
      four-generation family.
    explanation: >-
      Documents both de novo occurrence and multigenerational autosomal
      dominant transmission of SETD1A variants with early-onset epilepsy.
  - reference: PMID:42495272
    reference_title: A novel mutation in SETD1A is associated with early-onset epilepsy-a rare case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel de novo heterozygous variant in SETD1A (NM_014712.3: c.1067C >
      T/p.Ser356Phe) was identified in a patient presenting with
      focal-to-bilateral tonic-clonic seizures, beginning at 3 months of age.
    explanation: >-
      A further de novo heterozygous variant in an epilepsy-predominant case
      supports the dominant, frequently de novo genotype.

genetic:
- name: SETD1A
  gene_term:
    preferred_term: SETD1A
    term:
      id: hgnc:29010
      label: SETD1A
  relationship_type: CAUSATIVE
  notes: >-
    SETD1A (16p11.2) encodes the catalytic subunit of a Set1/COMPASS complex
    that methylates histone H3 lysine 4. The epilepsy-associated variants
    reported to date include missense changes both inside and outside the
    catalytic SET domain (p.Gln269Arg, p.Ser356Phe, p.Arg913Cys, p.Gly1369Arg,
    p.Arg1392His) and truncating alleles (p.Glu1002Glyfs*20 in an infantile
    epileptic spasms syndrome case). SETD1A is substantially depleted of
    loss-of-function variants in the general population, consistent with
    dosage sensitivity. No clean genotype-phenotype rule separating
    epilepsy-predominant from developmental-delay-predominant presentations
    has been established.
  variants:
  - name: p.Gln269Arg
    description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
    type: missense
  - name: p.Arg913Cys
    description: >-
      Missense variant segregating with seizures in a four-generation family
      (Yu et al. 2019); its expression also perturbed cortical neuron migration
      in the mouse brain.
    type: missense
  - name: p.Gly1369Arg
    description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
    type: missense
  - name: p.Arg1392His
    description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
    type: missense
  - name: p.Ser356Phe (c.1067C>T)
    description: >-
      De novo missense variant outside the SET domain in a girl with
      focal-to-bilateral tonic-clonic seizures from 3 months, normal MRI, and
      preserved cognition; classified likely pathogenic (ACMG PS2+PM2+PP3).
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Glu1002Glyfs*20 (c.3005_3006delAG)
    description: >-
      De novo frameshift variant in exon 12 in a child with infantile epileptic
      spasms syndrome and hypsarrhythmia.
    type: frameshift
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing indicated that all four of these mutations were
      responsible for the seizures.
    explanation: >-
      Establishes the causal relationship between the identified SETD1A
      variants and early-onset epilepsy in the defining cohort.
  - reference: PMID:37928142
    reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing revealed that the child had a variant
      (NM_014712.3:c.3005_3,006 delAG, p.Glu1002Glyfs*20) in exon 12 of the
      SETD1A gene, representing a de novo mutation.
    explanation: >-
      Extends the epilepsy-causing allelic series to a de novo truncating
      variant.
  - reference: PMID:26974950
    reference_title: Rare loss-of-function variants in SETD1A are associated with schizophrenia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      indicating that SETD1A is substantially depleted of LoF variants in the
      general population.
    explanation: >-
      Population-level constraint against SETD1A loss-of-function variants
      supports dosage sensitivity of the gene, the substrate of the dominant
      disease mechanism.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; the defining report described three sporadic individuals plus
    one four-generation family, and only a handful of additional
    epilepsy-predominant cases (infantile epileptic spasms syndrome, isolated
    focal epilepsy with preserved cognition) have been published since. No
    population-based prevalence estimate exists.
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified four missense mutations in the SETD1A gene (SET
      domain-containing 1A, histone lysine methyltransferase): three de novo
      mutations in three individuals and one inherited mutation in a
      four-generation family.
    explanation: >-
      The defining cohort comprises three individuals and one family,
      establishing the case-report scale of the entity.

pathophysiology:
- name: SETD1A Haploinsufficiency
  description: >-
    Heterozygous SETD1A variants -- truncating alleles and damaging missense
    changes within and outside the catalytic SET domain -- reduce the dosage of
    functional SETD1A, the catalytic subunit of a Set1/COMPASS histone
    methyltransferase complex. Functional characterization of patient variants
    (including a SET-domain missense allele) shows behavior comparable to
    loss-of-function alleles, and the gene is strongly depleted of
    loss-of-function variants in the general population, consistent with
    dosage sensitivity.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: SETD1A
    term:
      id: hgnc:29010
      label: SETD1A
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous SETD1A alleles: truncating (frameshift, nonsense,
      splice-site) changes and damaging missense substitutions both inside and
      outside the catalytic SET domain. Patient-derived cell lines show that
      even a SET-domain missense allele behaves as loss of function, and the
      gene is strongly depleted of loss-of-function variants in the general
      population. Most reported epilepsy variants arose de novo, but the
      defining report includes one missense allele inherited through four
      generations, so DE_NOVO records the predominant rather than exclusive
      origin.
  molecular_functions:
  - preferred_term: histone H3K4 methyltransferase activity
    term:
      id: GO:0042800
      label: histone H3K4 methyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing indicated that all four of these mutations were
      responsible for the seizures.
    explanation: >-
      Establishes heterozygous SETD1A variants as the initiating lesion in
      early-onset epilepsy.
  - reference: PMID:32346159
    reference_title: Characterization of SETD1A haploinsufficiency in humans and Drosophila defines a novel neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggested that these variants, including the p.Tyr1499Asp in the
      catalytic SET domain, behave as loss-of-function (LoF) alleles.
    explanation: >-
      Patient-derived cell lines show that pathogenic SETD1A variants behave as
      loss-of-function alleles, supporting haploinsufficiency as the molecular
      lesion across the allelic SETD1A disorders.
  - reference: PMID:26974950
    reference_title: Rare loss-of-function variants in SETD1A are associated with schizophrenia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      indicating that SETD1A is substantially depleted of LoF variants in the
      general population.
    explanation: >-
      Population constraint against SETD1A loss of function supports dosage
      sensitivity.
  downstream:
  - target: Reduced Promoter H3K4 Methylation
    causal_link_type: DIRECT
    description: >-
      Loss of catalytic SETD1A dosage directly reduces deposition of H3K4
      methylation marks by the Set1/COMPASS complex.

- name: Reduced Promoter H3K4 Methylation
  description: >-
    SETD1A deposits mono-, di-, and trimethylation on histone H3 lysine 4;
    H3K4me3 is a hallmark of transcriptionally active promoters. Reduced
    SETD1A dosage lowers this activating chromatin mark at Set1/COMPASS target
    loci. Note that this histone-methylation lesion has no detectable
    correlate in blood DNA methylation: profiling of six SETD1A patients found
    no strong CpG methylation episignature (PMID:37166351).
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34803610
    reference_title: SETD1A Mediated H3K4 Methylation and Its Role in Neurodevelopmental and Neuropsychiatric Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SETD1A is a chromatin remodeler that influences gene expression through
      the modulation of mono- di- and trimethylation marks on
      Histone-H3-Lysine-4 (H3K4me1/2/3).
    explanation: >-
      Review statement of the normal molecular function whose loss defines
      this node; a review is not primary data, hence evidence_source OTHER.
  - reference: PMID:26974950
    reference_title: Rare loss-of-function variants in SETD1A are associated with schizophrenia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that epigenetic dysregulation, specifically in the histone
      H3K4 methylation pathway, is an important mechanism in the pathogenesis
      of schizophrenia.
    explanation: >-
      Human genetic evidence that the H3K4 methylation pathway is the operative
      epigenetic mechanism disrupted by SETD1A loss-of-function variants; drawn
      from the schizophrenia arm of the allelic series, so it supports the
      shared molecular step rather than the epilepsy phenotype specifically.
  downstream:
  - target: Transcriptional Dysregulation of Synaptic and Neurodevelopmental Genes
    causal_link_type: DIRECT
    description: >-
      Loss of an activating promoter mark alters transcription of
      Set1/COMPASS target genes.

- name: Transcriptional Dysregulation of Synaptic and Neurodevelopmental Genes
  description: >-
    Reduced H3K4 methylation at SETD1A-bound promoters and enhancers
    dysregulates transcriptional programs in neurons. In Setd1a-deficient
    mice, Setd1a binds both promoters and enhancers (overlapping Mef2 on
    enhancers), and its targets -- highly expressed in pyramidal neurons --
    show complex up- and downregulation, including genes related to
    neurodevelopmental disorders and synaptic function in the medial
    prefrontal cortex. In human SETD1A+/- iPSC-derived neuronal networks,
    transcriptomic profiling shows perturbation of glutamatergic synaptic gene
    sets. In patient-variant overexpression experiments, two common
    downstream genes (Neurl4 and Usp39) were affected by SETD1A mutations.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31606247
    reference_title: Recapitulation and Reversal of Schizophrenia-Related Phenotypes in Setd1a-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Setd1a targets are highly expressed in pyramidal neurons and display a
      complex pattern of transcriptional up- and downregulations shaped by
      presumed opposing functions of Setd1a on promoters and Mef2-bound
      enhancers.
    explanation: >-
      Mouse evidence that Setd1a deficiency dysregulates its direct
      transcriptional targets in cortical pyramidal neurons.
  - reference: PMID:35508131
    reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      transcriptomic profiling reveals perturbations in gene sets associated
      with glutamatergic synaptic function.
    explanation: >-
      Human iPSC-derived SETD1A+/- neuronal networks show dysregulation of
      glutamatergic synaptic gene expression.
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further identified two common genes (Neurl4 and Usp39) affected by
      mutations of SETD1A.
    explanation: >-
      The epilepsy-associated patient variants converge on shared downstream
      gene targets in neuronal cells.
  downstream:
  - target: Abnormal Excitatory Synapse Development and Function
    causal_link_type: DIRECT
    description: >-
      Dysregulated synaptic gene programs impair the development and function
      of excitatory synapses.
  - target: Impaired Cortical Neuron Migration
    causal_link_type: DIRECT
    description: >-
      Dysregulated neurodevelopmental transcription perturbs cortical neuron
      migration, demonstrated for the familial R913C variant.

- name: Abnormal Excitatory Synapse Development and Function
  description: >-
    Epilepsy-associated SETD1A variants expressed in mouse primary cortical
    neurons impair excitatory synapse development. Consistently, Setd1a+/-
    mice show altered axonal branching, cortical synaptic dynamics, and
    impaired excitatory synaptic transmission in layer 2/3 pyramidal neurons
    of the medial prefrontal cortex, with postsynaptic Setd1a required for
    normal excitatory transmission. Human SETD1A+/- iPSC-derived neurons show
    increased dendritic complexity. The mouse work is schizophrenia-focused
    and reports attenuated excitatory function, whereas human iPSC networks
    are hyperactive -- a directionality discrepancy recorded in the
    HUMAN_MODEL_MISMATCH discussion on this entry.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: ABNORMAL
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that their expression in mouse primary cortical neurons
      affected excitatory synapse development.
    explanation: >-
      Direct functional evidence that the epilepsy-associated patient variants
      perturb excitatory synapse development in cultured cortical neurons.
  - reference: PMID:32937141
    reference_title: Setd1a Insufficiency in Mice Attenuates Excitatory Synaptic Function and Recapitulates Schizophrenia-Related Behavioral Abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our Setd1a (+/-) mice display various behavioral abnormalities relevant
      to features of SCZ, impaired excitatory synaptic transmission in layer
      2/3 (L2/3) pyramidal neurons of the medial prefrontal cortex (mPFC), and
      altered expression of diverse genes related to neurodevelopmental
      disorders and synaptic functions in the mPFC.
    explanation: >-
      In vivo mouse evidence that Setd1a insufficiency impairs excitatory
      synaptic transmission in cortical pyramidal neurons; the model was built
      for schizophrenia, not epilepsy.
  - reference: PMID:31606247
    reference_title: Recapitulation and Reversal of Schizophrenia-Related Phenotypes in Setd1a-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice carrying a heterozygous loss-of-function mutation of the orthologous
      gene exhibit alterations in axonal branching and cortical synaptic
      dynamics accompanied by working memory deficits.
    explanation: >-
      Independent mouse model confirming structural and functional cortical
      synaptic abnormalities from Setd1a haploinsufficiency.
  downstream:
  - target: Cortical Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - camp_pka_network_hyperactivity_model
    description: >-
      In human SETD1A+/- neuronal networks, synaptic and cAMP/PKA-pathway
      changes culminate in network hyperactivity; the intermediate steps
      operating in the patient brain are not established.
    evidence:
    - reference: PMID:35508131
      reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        At the molecular level, we identify specific changes in the cyclic AMP
        (cAMP)/Protein Kinase A pathway pointing toward a hyperactive cAMP
        pathway in SETD1A+/- neurons.
      explanation: >-
        Identifies the cAMP/PKA pathway as the molecular route from SETD1A
        haploinsufficiency to network hyperactivity in human neurons,
        supporting this edge specifically.
  - target: Variable Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cortical synaptic dysfunction is the presumed substrate of the variable
      developmental impairment; the determinants of who develops delay are
      unknown.

- name: Impaired Cortical Neuron Migration
  description: >-
    Expression of the familial R913C epilepsy variant perturbed migration of
    cortical neurons in the developing mouse brain, indicating that some
    SETD1A variants additionally disturb neuronal positioning during
    corticogenesis. Notably, affected individuals -- across the allelic SETD1A
    disorders -- do not show major structural brain malformations, so any
    migration contribution must be subtle.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

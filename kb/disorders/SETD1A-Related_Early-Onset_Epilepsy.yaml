treatments:
- name: Antiseizure Medication
  description: >-
    No disorder-specific therapy exists; management is conventional
    antiseizure treatment chosen by semiology and syndrome. Across the three
    treated cases with reported outcomes, phenobarbital significantly reduced
    seizure frequency in the focal-epilepsy case, levetiracetam achieved
    seizure freedom in a further case with recurrence four years later, and
    valproic acid was added as adjunct after the epileptic spasms had already
    responded to ACTH. Pyridoxine (vitamin B6) was given empirically on
    admission in the spasms case, but the authors explicitly discounted a
    pyridoxine-responsive mechanism, so it is not listed here as an active
    agent -- ACTH is curated as its own treatment. These are single-case
    observations, not comparative evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  target_mechanisms:
  - target: Early-Onset Seizures
    description: >-
      Symptomatic antiseizure treatment acting on the seizure endpoint rather
      than the upstream chromatin mechanism.
    evidence:
    - reference: PMID:42495272
      reference_title: A novel mutation in SETD1A is associated with early-onset epilepsy-a rare case report.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Following initiation of phenobarbital therapy, seizure frequency
        decreased significantly.
      explanation: >-
        Documents a symptomatic antiseizure response acting on the seizure
        endpoint in the focal-epilepsy case.
  evidence:
  - reference: PMID:42495272
    reference_title: A novel mutation in SETD1A is associated with early-onset epilepsy-a rare case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following initiation of phenobarbital therapy, seizure frequency
      decreased significantly.
    explanation: >-
      The evidence behind the phenobarbital claim: seizure frequency fell
      significantly after phenobarbital was started in the focal-epilepsy
      case.
  - reference: PMID:37928142
    reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient was treated with phenobarbital and seizure frequency was
      reduced; however, no information was provided regarding subsequent
      episodes. Another patient achieved seizure-free status after receiving
      levetiracetam.
    explanation: >-
      The authors' literature review of SETD1A-related epilepsy records the
      phenobarbital and levetiracetam responses that justify listing both as
      agents; it also records that the reduction was not followed up in one
      case.
  - reference: PMID:37928142
    reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since most patients do not become seizure-free with ACTH alone, we also
      added valproic acid after 2 weeks of ACTH treatment.
    explanation: >-
      Establishes valproic acid as adjunctive therapy added after the ACTH
      response, not as the agent that produced remission.

- name: Adrenocorticotropic Hormone Therapy
  description: >-
    ACTH is the guideline-standard therapy for infantile epileptic spasms
    syndrome and is the agent that produced remission in the one reported
    SETD1A-related IESS case: spasms stopped within three days of starting
    ACTH (2 U/kg/day), treatment continued for four weeks and was then
    switched to oral prednisone, with valproic acid added as adjunct. The
    child remained seizure-free at follow-up. Pyridoxine had been given
    empirically alongside ACTH from admission, but the authors concluded that
    a pyridoxine-dependent mechanism was not involved -- spasms persisted on
    pyridoxine alone and no ALDH7A1 alteration was found -- so the response is
    attributed to ACTH. This is a single case, not evidence of a
    SETD1A-specific ACTH effect.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adrenocorticotropic hormone
      term:
        id: CHEBI:3892
        label: corticotropin
  target_phenotypes:
  - preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
  target_mechanisms:
  - target: Early-Onset Seizures
    description: >-
      Hormonal therapy acting on the seizure endpoint; the mechanism by which
      ACTH suppresses epileptic spasms is not SETD1A-specific and is not
      established at the level of this pathograph.
    evidence:
    - reference: PMID:37928142
      reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The epileptic spasms disappeared after 3 days of ACTH administration.
      explanation: >-
        Documents that ACTH, not the co-administered pyridoxine, produced
        seizure remission at the clinical endpoint.
  evidence:
  - reference: PMID:37928142
    reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The epileptic spasms disappeared after 3 days of ACTH administration.
    explanation: >-
      The primary observation: spasms remitted within three days of starting
      ACTH.
  - reference: PMID:37928142
    reference_title: "Case report: De novo variant of SETD1A causes infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since vitamin B6 had been used for several days, but spasms persisted
      until ACTH was added and genetic testing did not suggest alterations in
      a vitamin B6-related gene (e.g., ALDH7A1), we do not believe that
      vitamin B6 deficiency was involved.
    explanation: >-
      The authors' own reasoning for attributing the response to ACTH rather
      than pyridoxine, which is why pyridoxine is not curated as an active
      agent in this entry.

- name: Genetic Counseling
  description: >-
    Counseling in this disorder has to cover two genuinely different
    recurrence scenarios, because SETD1A epilepsy is dominant but not
    exclusively de novo. Most reported probands carry de novo variants, where
    sibling recurrence risk is low but non-zero because parental gonadal
    mosaicism cannot be excluded by negative parental testing; but the
    defining report also describes a missense variant transmitted with
    seizures through four generations, where a carrier parent has a 50%
    transmission risk per pregnancy. Parental testing therefore changes the
    counseling substantially and should be offered rather than assumed
    negative. Expressivity is markedly variable even within the allelic
    spectrum -- from isolated epilepsy with normal cognition to global
    developmental delay -- so a carrier relative's phenotype does not predict
    a future child's.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified four missense mutations in the SETD1A gene (SET
      domain-containing 1A, histone lysine methyltransferase): three de novo
      mutations in three individuals and one inherited mutation in a
      four-generation family.
    explanation: >-
      Establishes the two recurrence scenarios counseling has to cover: de
      novo occurrence in most probands, and multigenerational dominant
      transmission in at least one family.
  - reference: PMID:42495272
    reference_title: A novel mutation in SETD1A is associated with early-onset epilepsy-a rare case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing further confirmed that this variant was a de novo
      mutation, which only exists in the proband and absence in both parents
    explanation: >-
      Illustrates the parental-testing step that distinguishes the de novo
      from the inherited counseling scenario.

animal_models:
- name: Setd1a haploinsufficient mouse
  species: Mouse
  genotype: Setd1a+/- (heterozygous loss-of-function / frameshift)
  publication: PMID:32937141
  description: >-
    Two independently generated heterozygous Setd1a mouse lines. Mukai et al.
    (PMID:31606247) report altered axonal branching, cortical synaptic
    dynamics and working-memory deficits, plus reversibility on adult Setd1a
    reinstatement or LSD1 antagonism; Nagahama et al. (PMID:32937141) carry a
    frameshift mimicking a human loss-of-function allele and show impaired
    excitatory synaptic transmission in layer 2/3 medial prefrontal cortex
    pyramidal neurons. Both were built to model schizophrenia, and both are
    curated here as one model record because they share the genotype and the
    same relationship to this entry's pathograph.
  modeled_mechanisms:
  - target: Abnormal Excitatory Synapse Development and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mice reproduce the existence of a cortical excitatory synaptic
      lesion downstream of Setd1a haploinsufficiency, together with the
      transcriptional dysregulation of synaptic genes that this entry places
      upstream of it.
    limitations: >-
      The synaptic deficit is characterized in adult medial prefrontal cortex
      in the context of schizophrenia-related behavior, not in the developing
      cortex at the ages when human seizures begin, and its direction
      (attenuated excitatory transmission) is opposite to that seen in human
      SETD1A+/- neuronal networks.
    evidence:
    - reference: PMID:32937141
      reference_title: Setd1a Insufficiency in Mice Attenuates Excitatory Synaptic Function and Recapitulates Schizophrenia-Related Behavioral Abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our Setd1a (+/-) mice display various behavioral abnormalities
        relevant to features of SCZ, impaired excitatory synaptic transmission
        in layer 2/3 (L2/3) pyramidal neurons of the medial prefrontal cortex
        (mPFC), and altered expression of diverse genes related to
        neurodevelopmental disorders and synaptic functions in the mPFC.
      explanation: >-
        Establishes that the model reproduces a cortical excitatory synaptic
        lesion and the accompanying synaptic-gene dysregulation.
    readouts:
    - name: Excitatory synaptic transmission in layer 2/3 mPFC pyramidal neurons
      target: Abnormal Excitatory Synapse Development and Function
      direction: DECREASED
      interpretation: >-
        Electrophysiological measure of the excitatory synaptic lesion in this
        model; note the direction is opposite to the human iPSC network
        finding.
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: DECREASED
      evidence:
      - reference: PMID:32937141
        reference_title: Setd1a Insufficiency in Mice Attenuates Excitatory Synaptic Function and Recapitulates Schizophrenia-Related Behavioral Abnormalities.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Optogenetics-assisted selective stimulation of presynaptic neurons
          combined with Setd1a KD reveals that Setd1a at postsynaptic site is
          essential for excitatory synaptic transmission.
        explanation: >-
          Reports the measurement behind this readout and localizes the
          requirement to the postsynaptic side.
  - target: Cortical Network Hyperexcitability
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No Setd1a+/- mouse study reports spontaneous seizures, epileptiform
      EEG, or a lowered seizure threshold, and the measured direction of
      change in excitatory synaptic function is the opposite of a
      hyperexcitable state. The mouse therefore does not model the
      epileptogenic step of this entry's pathograph, which is the substance
      of the HUMAN_MODEL_MISMATCH discussion.
    limitations: >-
      Two limitations, and they are different. First, the phenotype: these
      lines show attenuated -- not increased -- excitatory synaptic
      transmission, so on the one relevant measure they run against the human
      epilepsy. Second, ascertainment: they were built and phenotyped for
      schizophrenia-related behavior and cognition, so no chronic video-EEG
      or chemoconvulsant seizure-threshold testing has been published at any
      age. A negative on an assay that was never run is weaker than a
      demonstrated absence of seizures, and this link should be revisited if
      such phenotyping is reported.
    evidence:
    - reference: PMID:32937141
      reference_title: Setd1a Insufficiency in Mice Attenuates Excitatory Synaptic Function and Recapitulates Schizophrenia-Related Behavioral Abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings suggest that reduced SETD1A may attenuate excitatory
        synaptic function and contribute to the pathophysiology of SCZ.
      explanation: >-
        The authors' own summary: the model's excitatory phenotype is
        attenuation framed as schizophrenia pathophysiology, not the network
        hyperexcitability this node asserts.
    - reference: PMID:31606247
      reference_title: Recapitulation and Reversal of Schizophrenia-Related Phenotypes in Setd1a-Deficient Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice carrying a heterozygous loss-of-function mutation of the
        orthologous gene exhibit alterations in axonal branching and cortical
        synaptic dynamics accompanied by working memory deficits.
      explanation: >-
        The second line's reported phenotype is likewise synaptic and
        cognitive, with no seizure or epileptiform finding, supporting the
        failure-to-recapitulate claim for the hyperexcitability node.
  evidence:
  - reference: PMID:31606247
    reference_title: Recapitulation and Reversal of Schizophrenia-Related Phenotypes in Setd1a-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reinstating Setd1a expression in adulthood rescues cognitive deficits.
    explanation: >-
      Supports treating the mouse as informative for SETD1A biology in this
      entry: the phenotype is Setd1a-dose-dependent and reversible, so it is
      attributable to the gene rather than to a developmental artifact of the
      line.

experimental_models:
- name: SETD1A+/- human iPSC-derived excitatory/inhibitory neuronal network
  description: >-
    CRISPR-Cas9-engineered human induced pluripotent stem cells carrying a
    heterozygous SETD1A loss-of-function mutation, differentiated into mixed
    excitatory/inhibitory neuronal networks and recorded on multi-electrode
    arrays. This is the only model system in which SETD1A haploinsufficiency
    has been shown to produce a hyperactive network state, and the effect is
    reversible by cAMP/PKA-pathway inhibition.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: iPSC-derived
  culture_system: Multi-electrode-array neuronal network culture
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  publication: PMID:35508131
  modeled_mechanisms:
  - target: Cortical Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      SETD1A haploinsufficiency in a human neuronal network produces increased
      bursting driven by glutamatergic neurons -- the in vitro counterpart of
      the hyperexcitable, hypersynchronous state this node asserts.
    limitations: >-
      An in vitro network of immature iPSC-derived neurons is not cortical
      tissue: it lacks laminar architecture, long-range connectivity, and the
      developmental age at which human seizures begin, and network bursting on
      a multi-electrode array is not a seizure. The donor lines carry
      engineered rather than patient EPEDD variants, and the parent study was
      designed around schizophrenia risk, not epilepsy.
    evidence:
    - reference: PMID:35508131
      reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This network phenotype is primarily driven by SETD1A
        haploinsufficiency in glutamatergic neurons.
      explanation: >-
        Establishes that the model's network phenotype arises from the
        excitatory arm, matching the excitation/inhibition-imbalance framing
        of this node.
    readouts:
    - name: Neuronal network bursting activity
      target: Cortical Network Hyperexcitability
      direction: INCREASED
      interpretation: >-
        Multi-electrode-array measure of network-level hypersynchrony, the
        outcome measure grounding the RECAPITULATES claim.
      biological_processes:
      - preferred_term: action potential
        term:
          id: GO:0001508
          label: action potential
        modifier: INCREASED
      evidence:
      - reference: PMID:35508131
        reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Our data show that SETD1A haploinsufficiency results in
          morphologically increased dendritic complexity and functionally
          increased bursting activity.
        explanation: >-
          Reports the bursting measurement and its direction in the SETD1A+/-
          networks.
    - name: Network deficit rescue by cAMP/PKA pathway inhibition
      target: Cortical Network Hyperexcitability
      direction: RESTORED
      interpretation: >-
        Pharmacological reversal of the hyperactive network state, which is
        what makes the cAMP/PKA route a candidate therapeutic axis rather than
        a correlate.
      evidence:
      - reference: PMID:35508131
        reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Finally, by pharmacologically targeting the cAMP pathway, we are
          able to rescue the network deficits in SETD1A+/- cultures.
        explanation: >-
          Reports the rescue arm of this model.
  evidence:
  - reference: PMID:35508131
    reference_title: Loss-of-function variants in the schizophrenia risk gene SETD1A alter neuronal network activity in human neurons through the cAMP/PKA pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using CRISPR-Cas9, we generate excitatory/inhibitory neuronal networks
      from human induced pluripotent stem cells with a SETD1A heterozygous LoF
      mutation (SETD1A+/-).
    explanation: >-
      Describes the construction of the model system and establishes that it
      carries the disease-relevant heterozygous SETD1A lesion in human
      neurons.

diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Molecular diagnosis rests on identifying a heterozygous pathogenic or
    likely pathogenic SETD1A variant. Trio whole-exome or whole-genome
    sequencing is the modality used in essentially every reported case,
    because parental sequencing is what establishes de novo status -- which
    is both a major ACMG pathogenicity criterion (PS2) for these variants and
    the fact that separates the two recurrence-risk scenarios. Sanger
    sequencing is used to confirm the variant and its segregation.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:42495272
    reference_title: A novel mutation in SETD1A is associated with early-onset epilepsy-a rare case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, whole-exome sequencing and Sanger sequencing were performed on a
      4-year-old Chinese girl with early-onset epilepsy and her unaffected
      parents.
    explanation: >-
      Documents the trio exome-plus-Sanger workflow as the diagnostic route in
      a reported case.
  - reference: PMID:31197650
    reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing indicated that all four of these mutations were
      responsible for the seizures.
    explanation: >-
      Exome sequencing is the modality through which the defining cohort's
      variants were identified.

- name: DNA Methylation Episignature Testing
  presence: ABSENT
  description: >-
    Not diagnostically informative for SETD1A, which is the point worth
    recording. Many chromatinopathies have a reproducible peripheral-blood
    DNA-methylation episignature that resolves variants of uncertain
    significance, and SETD1A's paralog SETD2 does. Targeted profiling of more
    than two million CpGs in six SETD1A patients found no strong episignature,
    so a negative methylation test does not argue against a SETD1A diagnosis
    and this assay should not be used for variant interpretation here. Note
    this concerns CpG DNA methylation and is not evidence against the histone
    H3K4 methylation lesion, which is a different mark measured by different
    assays.
  evidence:
  - reference: PMID:37166351
    reference_title: Epigenotype-genotype-phenotype correlations in SETD1A and SETD2 chromatin disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comparison of methylation profiles in patients with SETD1A variants (n
      = 6) did not reveal evidence of a strong methylation episignature.
    explanation: >-
      The negative result establishing that episignature testing is not a
      usable diagnostic aid in this disorder.
  - reference: PMID:37166351
    reference_title: Epigenotype-genotype-phenotype correlations in SETD1A and SETD2 chromatin disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific methylation episignatures have been detected for a range of
      chromatin gene-related NDDs and have impacted clinical practice by
      improving the interpretation of variant pathogenicity.
    explanation: >-
      Establishes the expectation this disorder departs from: episignatures
      are clinically useful across chromatin-gene NDDs generally, which is why
      their absence in SETD1A is a substantive test-selection point.

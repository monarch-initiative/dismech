name: SETD1A-Related Early-Onset Epilepsy
creation_date: "2026-09-02T13:16:57Z"
category: Mendelian
description: >-
  SETD1A-related early-onset epilepsy (OMIM 618832; "epilepsy, early-onset,
  with or without developmental delay", EPEDD) is an autosomal dominant,
  epilepsy-predominant disorder caused by heterozygous variants in SETD1A,
  which encodes the catalytic subunit of a Set1/COMPASS complex that deposits
  mono-, di-, and trimethylation marks on histone H3 lysine 4 (H3K4) at
  actively transcribed promoters. Seizures begin early -- typically in infancy,
  within the first two years and in some individuals in the first months of
  life -- and the seizure repertoire reported to date spans focal-to-bilateral
  tonic-clonic seizures, focal impaired-awareness seizures, and infantile
  epileptic spasms syndrome with hypsarrhythmia. Developmental impact is
  strikingly variable: some individuals have global developmental delay, while
  others have entirely preserved cognition and normal brain MRI, which is the
  "with or without developmental delay" of the disease name. The entity was
  defined by Yu et al. (2019), who reported three de novo SETD1A missense
  variants and one missense variant segregating with seizures in a
  four-generation family, and it has been extended by subsequent case reports.
  EPEDD is one of three allelic SETD1A phenotype groups, alongside the
  developmental-delay-predominant neurodevelopmental disorder with speech
  impairment and dysmorphic facies (NEDSID) and large-effect risk for
  schizophrenia conferred by SETD1A loss-of-function variants; the primary
  diagnosis in SETD1A carriers is strongly age-dependent. Seizures have
  responded to conventional antiseizure regimens in the reported cases, but no
  systematic treatment data exist.
disease_term:
  preferred_term: epilepsy, early-onset, with or without developmental delay
  term:
    id: MONDO:0030005
    label: epilepsy, early-onset, with or without developmental delay
synonyms:
- EPEDD
- SETD1A-related early-onset epilepsy
parents:
- Genetic epilepsy
- Chromatinopathy

notes: >-
  Scope, identity and provenance notes for this entry.


  (1) NAMED-ENTITY-CONFUSION PREFLIGHT. SETD1A is associated with several
  distinct clinical entities, so identity was anchored before curation via
  `runoak -i sqlite:obo:mondo info MONDO:0030005 -O obo`: the record carries
  `xref: OMIM:618832`, the exact synonym `EPEDD`, and the causal-gene axiom
  `relationship: RO:0004003 HGNC:29010 ! SETD1A`, all matching the curation
  target. This entry is restricted to the epilepsy-predominant allelic entity
  defined by Yu et al. 2019 (PMID:31197650) and subsequent epilepsy-first case
  reports (PMID:37928142, PMID:42495272).


  (2) ALLELIC BUT DISTINCT SETD1A ENTITIES. Two other SETD1A phenotype groups
  must not be conflated with this one. (a) Neurodevelopmental disorder with
  speech impairment and dysmorphic facies (NEDSID; MONDO:0033630, OMIM 619056),
  defined by Kummeling et al. 2021 (PMID:32346159) in 15 individuals with de
  novo loss-of-function variants, is developmental-delay-predominant: the core
  is global developmental delay and/or intellectual disability, subtle facial
  dysmorphism, and behavioral/psychiatric problems, with seizures in only a
  subset. NEDSID is not yet curated in this KB (it remains an open stub); when
  it is, the lump/split question of whether EPEDD and NEDSID are one
  variable-expressivity spectrum or two entries should be revisited -- OMIM and
  MONDO currently keep them separate, and the epilepsy-first cases with fully
  preserved cognition (PMID:42495272) support a separable epilepsy-predominant
  presentation. (b) SETD1A loss-of-function variants also confer large-effect
  risk for schizophrenia (PMID:26974950); that association is curated as a
  genetic risk factor in the Schizophrenia entry of this KB, not here. The
  age-dependence of the primary diagnosis across these groups is explicitly
  noted in the literature (PMID:34803610). Note also that the KB entry
  "Neurodevelopmental Disorder With Dysmorphic Facies, Sleep Disturbance, and
  Brain Abnormalities" (NEDFASB, MONDO:0030852) is a KAT5/TIP60 disorder --
  a different chromatin-modifier gene -- despite the similar descriptive name.


  (3) LUMP/SPLIT DECISION. The stub for MONDO:0030005 was resolved as
  entry_type DISEASE: EPEDD has its own OMIM number (618832), its own MONDO
  term with SETD1A as causal gene, a defining cohort publication, and
  subsequent epilepsy-predominant case reports including one with preserved
  cognition and normal imaging, so it is curated as a standalone entry rather
  than a subtype of an (uncurated) SETD1A parent concept.


  (4) MECHANISM EVIDENCE IS LARGELY BORROWED FROM SCHIZOPHRENIA-FOCUSED MODELS.
  Most functional SETD1A work (Setd1a+/- mice, hiPSC-derived neuronal
  networks) was performed to model schizophrenia, not epilepsy, and is tagged
  MODEL_ORGANISM or IN_VITRO accordingly. The direction-of-excitability
  discrepancy between mouse (attenuated excitatory synaptic transmission) and
  human iPSC networks (increased bursting) is recorded as a
  HUMAN_MODEL_MISMATCH discussion rather than resolved silently. The
  epileptogenic mechanism in patients is not directly established; the
  network-hyperexcitability node is marked PROVISIONAL.


  (5) NO GENEREVIEWS CHAPTER. A PubMed search for "SETD1A GeneReviews[All
  Fields]" on 2026-09-02 returned no results, so there is no GeneReviews
  phenotype baseline to cross-reference.


  (6) EPISIGNATURE NEGATIVE. Targeted genome-wide DNA-methylation profiling of
  six SETD1A patients did not reveal a strong methylation episignature
  (PMID:37166351), so -- unlike many chromatinopathies -- a blood episignature
  cannot currently support variant interpretation in this disorder. This
  concerns CpG DNA methylation, not the histone H3K4 methylation lesion
  itself. The finding is curated structurally as a `diagnosis` entry with
  `presence: ABSENT` rather than left as prose here.


  (7) MODEL SYSTEMS AND THE NEGATIVE LINK. The Setd1a+/- mouse is curated with
  a `FAILS_TO_RECAPITULATE` link to Cortical Network Hyperexcitability. That
  claim rests on two different things and the distinction matters: the
  published excitatory phenotype runs in the opposite direction to the human
  epilepsy (attenuated transmission), and no chronic video-EEG or
  seizure-threshold phenotyping has been published at any age because the
  lines were built for schizophrenia. The second is an absence of testing, not
  a demonstrated absence of seizures; the link should be revisited if such
  phenotyping appears, which is what the proposed experiment on the
  HUMAN_MODEL_MISMATCH discussion asks for.


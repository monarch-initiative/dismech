diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of RLBP1 confirms the diagnosis and classifies the allele as
    null, partial-function missense, or hypomorphic -- a classification that is
    prognostically important and, per current natural-history cohorts, the
    first step in gene-therapy eligibility assessment.
  results: >-
    Identification of biallelic pathogenic RLBP1 variants confirms the
    diagnosis. Null alleles (splice-junction, truncating, or the recurrent
    exon 7-9 deletion) predict the most severe (Newfoundland rod-cone
    dystrophy) course; the p.Arg234Trp founder allele predicts the
    intermediate Bothnia dystrophy course; other missense/nonsense
    combinations predict a variable retinitis-punctata-albescens course.
  evidence:
  - reference: PMID:36247817
    reference_title: "Retinitis Punctata Albescens and RLBP1-Allied Phenotypes: Phenotype-Genotype Correlation and Natural History in the Aim of Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The eligibility for RLBP1 gene therapy first should be determined according to the biallelic variant combination using a robust classification as proposed herein."
    explanation: >-
      This natural-history cohort establishes molecular allele classification
      as the primary determinant of gene-therapy eligibility.
- name: Prolonged dark-adaptation electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Dark-adapted and light-adapted ERG testing characterizes the rod-then-cone
    functional deficit and is a primary efficacy endpoint in the AAV8-RLBP1
    gene therapy trial.
  results: >-
    Scotopic ERG responses are typically non-detectable or severely reduced,
    with a progressive additional decline in photopic (cone) responses with
    age; unlike RDH5-related retinopathy, recovery to normal amplitudes after
    prolonged dark adaptation is not consistently described in the RLBP1
    literature.
  evidence:
  - reference: PMID:21447491
    reference_title: Mutations in RLBP1 associated with fundus albipunctatus in consanguineous Pakistani families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the scotopic ERG responses were non-detectable, whereas the photopic response was severely reduced in affected individuals"
    explanation: >-
      This documents the severe scotopic/photopic ERG deficit pattern typical
      of RLBP1-related retinopathy.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Optical coherence tomography (OCT) quantifies central retinal thinning,
    ellipsoid-zone/interdigitation-zone integrity, and macular volume, and is
    used both diagnostically and to establish gene-therapy eligibility
    thresholds.
  results: >-
    OCT shows generalized retinal thinning of the central fovea and inner ring
    even in young patients, with retinitis-punctata-albescens spots visualized
    near the RPE-choriocapillaris complex; natural-history cohorts have
    proposed minimum ellipsoid-zone width and central retinal thickness
    thresholds, with detectable ellipsoid and interdigitation lines, as
    prerequisites for gene therapy candidacy.
  evidence:
  - reference: PMID:20696998
    reference_title: Central retinal findings in Bothnia dystrophy caused by RLBP1 sequence variation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homogeneous retinitis punctata albescence changes were visualized in and/or adjacent to the retinal pigment epithelium-choriocapillaris complex with high reflectance."
    explanation: >-
      This documents the multimodal localization of retinitis-punctata-albescens
      spots to the RPE-choriocapillaris complex on imaging.
epidemiology:
- name: Founder-population prevalence
  description: >-
    RLBP1-related retinopathy is rare overall but shows unusually high
    regional prevalence in specific founder populations due to recurrent
    alleles: approximately 1 in 4500 in Vasterbotten, northern Sweden
    (p.Arg234Trp, Bothnia dystrophy), and a distinct founder history in
    Newfoundland, Canada (null alleles, Newfoundland rod-cone dystrophy).
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-seven cases of Bothnia dystrophy have been diagnosed, indicating a prevalence as high as 1 per 4500 population in the geographic area studied."
    explanation: >-
      This is the primary quantitative regional-prevalence estimate for
      RLBP1-related retinopathy, reflecting the founder effect in northern
      Sweden.
  - reference: PMID:11868161
    reference_title: "Newfoundland rod-cone dystrophy, an early-onset retinal dystrophy, is caused by splice-junction mutations in RLBP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The island of Newfoundland is a characteristic geographic isolate, settled by a small number of families primarily during the late 1700s and early 1800s."
    explanation: >-
      This describes the founder-population context underlying the distinct
      Newfoundland rod-cone dystrophy presentation.
progression:
- phase: Childhood-onset night blindness
  age_range: Early childhood
  notes: >-
    Night blindness from early childhood is the presenting feature across all
    RLBP1 allele classes.
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically show night blindness from early childhood."
    explanation: >-
      Establishes the earliest clinical phase common to RLBP1-related
      retinopathy.
- phase: Retinitis punctata albescens with early macular thinning
  age_range: Young adulthood
  notes: >-
    Retinitis punctata albescens (aggregated white flecks) develops in young
    adults, with central retinal/macular thinning already detectable on OCT in
    patients as young as 9-34 years old in the intermediate/severe alleles.
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In young adults, retinitis punctata albescens was observed, followed by macular degeneration and a decrease in visual acuity that led to legal blindness in early adulthood."
    explanation: >-
      Documents the transition from night blindness to retinitis punctata
      albescens in young adulthood.
- phase: Macular degeneration and legal blindness
  age_range: Early adulthood
  notes: >-
    Progressive macular degeneration and declining visual acuity culminate in
    legal blindness in early adulthood for the majority of disease alleles
    (null and founder-missense classes); rare hypomorphic alleles can show
    minimal or no progression to this endpoint.
  evidence:
  - reference: PMID:38945349
    reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a significant annual rate of macular volume loss, estimated at -0.007 mm3/y (95% CI, -0.012 to -0.001; P = .02), without any significant difference between the two genotypes"
    explanation: >-
      This quantifies the annual rate of macular volume loss in RLBP1-associated
      retinopathy (measured in the same cohort study alongside RDH5).

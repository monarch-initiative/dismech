pathophysiology:
- name: CRALBP Retinoid-Binding Chaperone Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic RLBP1 variants reduce or abolish the function of
    cellular retinaldehyde-binding protein (CRALBP), a cytosolic retinoid
    carrier (not an enzyme) expressed in both the RPE and Muller glial cells,
    which selects and protects 11-cis-retinaldehyde/11-cis-retinol from
    photoisomerization within the visual cycle.
  gene:
    preferred_term: RLBP1
    modifier: DECREASED
    term:
      id: hgnc:10024
      label: RLBP1
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: Muller cell
    term:
      id: CL:0000636
      label: Mueller cell
  molecular_functions:
  - preferred_term: retinol binding
    modifier: DECREASED
    term:
      id: GO:0019841
      label: retinol binding
  - preferred_term: retinoid binding
    modifier: DECREASED
    term:
      id: GO:0005501
      label: retinoid binding
  downstream:
  - target: Impaired Visual Cycle Flux in RPE and Muller Glia
    description: >-
      Loss of CRALBP's retinoid-carrier function impairs 11-cis-retinal
      regeneration in both the RPE and Muller glia, the latter supplying a
      distinct, cone-dedicated arm of the visual cycle not present in
      RDH5-related retinopathy's RPE-only enzymatic block.
    evidence:
    - reference: PMID:11301032
      reference_title: Visual cycle impairment in cellular retinaldehyde binding protein (CRALBP) knockout mice results in delayed dark adaptation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings support a role for CRALBP as an acceptor of 11-cis-retinol in the isomerization reaction of the visual cycle."
      explanation: >-
        This Rlbp1-knockout mouse study establishes CRALBP's proposed
        biochemical role in the isomerization step of the visual cycle.
  evidence:
  - reference: PMID:21447491
    reference_title: Mutations in RLBP1 associated with fundus albipunctatus in consanguineous Pakistani families.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CRALBP has been localised in adult species to the retinal pigment epithelium, Müller cells of neural retina and ocular ciliary epithelium."
    explanation: >-
      This confirms CRALBP's expression in both the RPE and Muller cells, the
      structural basis for the disease's dual-cell mechanism.
- name: Impaired Visual Cycle Flux in RPE and Muller Glia
  biological_scale: MOLECULAR
  description: >-
    Loss of CRALBP delays rhodopsin regeneration, 11-cis-retinal production, and
    dark adaptation by more than 10-fold in a knockout mouse model, with
    accumulation of all-trans-retinyl esters indicating impaired isomerization.
    Muller-cell CRALBP specifically is required for M-opsin localization,
    M-cone survival, and cone dark adaptation, independent of RPE CRALBP.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: Muller cell
    term:
      id: CL:0000636
      label: Mueller cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Prolonged Rod and Cone Dark Adaptation
    description: >-
      In milder or hypomorphic alleles, and in the early years of intermediate
      alleles, the primary consequence is a delayed but retained rod and cone
      dark-adaptation response rather than outright photoreceptor loss.
    evidence:
    - reference: PMID:11301032
      reference_title: Visual cycle impairment in cellular retinaldehyde binding protein (CRALBP) knockout mice results in delayed dark adaptation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The photosensitivity of Rlbp1(-/-) mice is normal but rhodopsin regeneration, 11-cis-retinal production, and dark adaptation after illumination are delayed by >10-fold."
      explanation: >-
        This quantifies the delayed-regeneration mechanism directly in a
        CRALBP-null mouse model.
  - target: Progressive Rod-Then-Cone Photoreceptor Stress and Macular Degeneration
    description: >-
      In most disease alleles, chronic impairment of visual-cycle flux in both
      the RPE and Muller glia produces cumulative photoreceptor stress that
      progresses from early rod dysfunction to cone dysfunction and macular
      degeneration, more consistently than in RDH5-related retinopathy.
    evidence:
    - reference: PMID:25607845
      reference_title: CRALBP supports the mammalian retinal visual cycle and cone vision.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "M-cone loss, and impaired cone-driven visual behavior and light responses."
      explanation: >-
        This mouse study directly links loss of Muller-cell CRALBP to
        progressive cone-specific pathology, distinct from the rod-first
        stationary presentation.
  evidence:
  - reference: PMID:25607845
    reference_title: CRALBP supports the mammalian retinal visual cycle and cone vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "identify Müller cell CRALBP as a key component of the retinal visual cycle"
    explanation: >-
      This rescue experiment (AAV-mediated restoration specifically in Müller
      cells, not RPE) isolates Müller-cell CRALBP as necessary and sufficient
      for cone-specific visual cycle function, the key mechanistic distinction
      from the RPE-only RDH5 pathway.
- name: Prolonged Rod and Cone Dark Adaptation
  biological_scale: TISSUE
  description: >-
    In hypomorphic alleles and in the early years of some intermediate alleles,
    delayed but ultimately functional rod and cone photopigment regeneration
    produces an apparently stationary, fundus-albipunctatus-like presentation.
    This can convert with age, in the same genotype, to the progressive
    phenotype below.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Progressive Rod-Then-Cone Photoreceptor Stress and Macular Degeneration
    description: >-
      A subset of patients who present in childhood with an apparently
      stationary phenotype develop, in the same genotype, unmistakable signs
      of the progressive phenotype by the fourth or fifth decade of life.
    evidence:
    - reference: PMID:11453974
      reference_title: Fundus albipunctatus and retinitis punctata albescens in a pedigree with an R150Q mutation in RLBP1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "younger individuals diagnosed with the milder disorder FA thought to be stationary may evolve to a more devastating and progressive phenotype"
      explanation: >-
        This directly documents age-dependent conversion from the apparently
        stationary presentation to the progressive phenotype within a single
        RLBP1 genotype.
  evidence:
  - reference: PMID:21447491
    reference_title: Mutations in RLBP1 associated with fundus albipunctatus in consanguineous Pakistani families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the scotopic ERG responses were non-detectable, whereas the photopic response was severely reduced in affected individuals"
    explanation: >-
      This documents the electrophysiological pattern in the stationary
      fundus-albipunctatus-like presentation of RLBP1 disease.
- name: Progressive Rod-Then-Cone Photoreceptor Stress and Macular Degeneration
  biological_scale: TISSUE
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    In the majority of disease alleles, sustained visual-cycle impairment
    produces an initial loss of rod function followed by progressive reduction
    of cone responses in older patients, with early central macular thinning
    detectable even in young patients and progressing to generalized macular
    degeneration. Severity is graded by allele class: null alleles (Newfoundland
    rod-cone dystrophy) produce the most severe, earliest course; the
    p.Arg234Trp founder allele (Bothnia dystrophy) produces an intermediate,
    well-documented course; and rare hypomorphic alleles can show minimal or no
    measurable rod/cone impairment and no macular atrophy.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  downstream:
  - target: Legal Blindness in Early Adulthood
    description: >-
      Progressive macular degeneration and declining visual acuity culminate
      in legal blindness in early adulthood for most disease alleles.
    evidence:
    - reference: PMID:11176989
      reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "macular degeneration and a decrease in visual acuity that led to legal blindness in early adulthood"
      explanation: >-
        This documents the natural-history endpoint of the progressive
        phenotype in the well-characterized Bothnia dystrophy cohort.
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dark adaptometry and electrophysiologic testing showed an initial loss of rod function followed by a progressive reduction of the cone responses in older ages."
    explanation: >-
      This directly establishes the rod-then-cone progression sequence in the
      Bothnia dystrophy cohort.
  - reference: PMID:20696998
    reference_title: Central retinal findings in Bothnia dystrophy caused by RLBP1 sequence variation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a loss of function and thinning of the central macula are found, indicating early damage of the cone photoreceptors in this disease of the visual cycle"
    explanation: >-
      This study of young patients (ages 9-34) documents early central macular
      thinning, showing cone-region damage begins well before the classic
      late-stage macular atrophy.
  - reference: PMID:38945349
    reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RLBP1 genotype was associated with a lower macular volume by 0.28 mm3 (95% CI, -0.46 to -0.11; P = .005) compared to the RDH5 genotype."
    explanation: >-
      This head-to-head cohort comparison quantifies RLBP1-associated
      retinopathy as more severe (lower macular volume) than RDH5-related
      retinopathy at a comparable disease stage.
  - reference: PMID:38945349
    reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three unrelated patients homozygous for the c.361C>T p.(Arg121Trp) RLBP1 variant showed minimal impairment of both the rod and cone systems function on ffERG and absence of MA."
    explanation: >-
      This documents the mild end of the allelic severity gradient: a
      hypomorphic RLBP1 variant producing near-normal function, in contrast to
      the null and founder-missense alleles.
- name: Legal Blindness in Early Adulthood
  biological_scale: ORGANISM
  description: >-
    The endpoint of the progressive disease course for most RLBP1 alleles is
    legal blindness reached in early adulthood, driven by combined rod-cone
    loss and macular degeneration.
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "macular degeneration and a decrease in visual acuity that led to legal blindness in early adulthood"
    explanation: >-
      This documents the natural-history endpoint — progression to legal blindness in
      early adulthood — in the well-characterized Bothnia dystrophy cohort.

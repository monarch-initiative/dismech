name: RLBP1-Related Retinopathy
creation_date: "2026-07-22T05:00:00Z"
category: Mendelian
description: >-
  RLBP1-related retinopathy is an autosomal recessive inherited retinal disease
  caused by biallelic pathogenic variants in RLBP1, encoding cellular
  retinaldehyde-binding protein (CRALBP), a retinoid-carrier chaperone (not an
  enzyme) expressed in both the retinal pigment epithelium (RPE) and Muller glial
  cells of the neuroretina. CRALBP binds and shuttles 11-cis-retinol and
  11-cis-retinal within the visual (retinoid) cycle; its loss slows regeneration of
  the chromophore for rod and cone opsins in both cell compartments. This dual-cell
  involvement -- Muller-cell CRALBP is specifically required for cone dark
  adaptation -- distinguishes RLBP1 disease mechanistically from RDH5-related
  retinopathy, an RPE-only enzymatic block in the same pathway. Disease severity
  forms an allelic continuum: null (splice-junction or truncating) alleles produce
  the most severe, earliest-onset course (historically termed Newfoundland
  rod-cone dystrophy), the recurrent missense founder variant p.Arg234Trp produces
  a well-characterized intermediate course in Scandinavian populations (Bothnia
  dystrophy), and rare hypomorphic missense alleles can produce near-normal
  function. Most patients progress from childhood night blindness through
  retinitis punctata albescens to macular degeneration and legal blindness in
  early adulthood, materially more consistently progressive than RDH5-related
  disease. An active AAV8-RLBP1 (CPK850) gene therapy program has reported
  favorable phase 1/2 interim safety and efficacy data.
disease_term:
  preferred_term: RLBP1-related retinopathy
  term:
    id: MONDO:0100444
    label: RLBP1-related retinopathy
synonyms:
- Bothnia retinal dystrophy
- Newfoundland rod-cone dystrophy
- Retinitis punctata albescens
- Fundus albipunctatus
- RLBP1 retinopathy
- Pigmentary retinal dystrophy
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  "Fundus albipunctatus" and "retinitis punctata albescens" are included as
  historical synonyms because MONDO lists both as narrow synonyms of
  MONDO:0100444, but both terms are genetically heterogeneous: RPA and FA have
  each been separately associated with RLBP1, RHO, PRPH2 (RDS), and RDH5 --
  mutations in RLBP1 and RDH5 are the two most common causes but neither term is
  RLBP1-specific. "Newfoundland rod-cone dystrophy" is likewise not a strictly
  geography-locked label: it originated as the name for the disease in a
  Newfoundland founder population with RLBP1 null alleles, but a later French
  cohort applied the same NFRCD label (and found the same recurrent
  exons-7-to-9 deletion producing an equally severe early-onset course) in
  patients with no Newfoundland ancestry -- the term now functions as much as a
  genotype-severity class as a population-specific entity. A companion dismech
  entry, RDH5-Related_Retinopathy (MONDO:0100443), covers the mechanistically
  distinct RPE-only enzymatic form of the same clinical phenotype spectrum; the
  two genes are directly compared in a shared cohort study cited throughout this
  entry.
has_subtypes:
- name: Bothnia Dystrophy
  display_name: Bothnia Retinal Dystrophy
  description: >-
    A founder-population phenotype in Vasterbotten, northern Sweden, caused by
    the homozygous missense variant p.Arg234Trp. Night blindness from early
    childhood is followed in young adulthood by retinitis punctata albescens,
    then macular degeneration and a decline in visual acuity leading to legal
    blindness in early adulthood. Regional prevalence is unusually high for an
    inherited retinal disease (approximately 1 in 4500).
  evidence:
  - reference: PMID:11176989
    reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically show night blindness from early childhood. In young adults, retinitis punctata albescens was observed, followed by macular degeneration and a decrease in visual acuity that led to legal blindness in early adulthood."
    explanation: >-
      This study of 24 individuals homozygous for the R234W founder variant
      establishes the characteristic clinical course of Bothnia dystrophy.
- name: Newfoundland Rod-Cone Dystrophy
  display_name: Newfoundland Rod-Cone Dystrophy (NFRCD)
  description: >-
    An early-onset, more rapidly and distinctively progressive retinal
    dystrophy first described in a Newfoundland founder population, caused by
    RLBP1 null alleles (splice-junction mutations disrupting mRNA splicing, or
    an exon 7-9 deletion reported in an unrelated French cohort) that are
    predicted to produce no residual CRALBP activity, unlike the partial-function
    missense alleles underlying Bothnia dystrophy and retinitis punctata
    albescens.
  evidence:
  - reference: PMID:11868161
    reference_title: "Newfoundland rod-cone dystrophy, an early-onset retinal dystrophy, is caused by splice-junction mutations in RLBP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a group of families exhibiting a retinal dystrophy reminiscent of retinitis punctata albescens but with a substantially lower age at onset and more-rapid and distinctive progression, a disorder that we termed \"Newfoundland rod-cone dystrophy\" (NFRCD)."
    explanation: >-
      This is the original description of NFRCD as a distinctly more severe,
      earlier-onset entity than retinitis punctata albescens.
  - reference: PMID:11868161
    reference_title: "Newfoundland rod-cone dystrophy, an early-onset retinal dystrophy, is caused by splice-junction mutations in RLBP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to some previously reported RLBP1 mutations, which yield a protein that may retain some residual activity, each NFRCD mutation is likely to give rise to a null allele. This difference may account for the severe phenotype in these families and exemplifies the molecular continuum that underlies clinically distinct but genetically related entities."
    explanation: >-
      This directly establishes the null-allele mechanism underlying the more
      severe NFRCD phenotype relative to partial-function missense alleles.
  - reference: PMID:36247817
    reference_title: "Retinitis Punctata Albescens and RLBP1-Allied Phenotypes: Phenotype-Genotype Correlation and Natural History in the Aim of Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent form was NFRCD with 12 patients (8 families) homozygous for the recurrent deletion of exons 7 through 9 in RLBP1"
    explanation: >-
      This French reference-center cohort applies the NFRCD label to patients
      with a distinct recurrent deletion, demonstrating the term now functions
      as a genotype-severity class beyond the original Newfoundland population.
- name: Retinitis Punctata Albescens
  display_name: Retinitis Punctata Albescens / Fundus-Albipunctatus-like Presentation
  description: >-
    Missense or nonsense RLBP1 alleles of intermediate severity (e.g., p.Arg150Gln,
    p.Arg156Ter combined with p.Gly116Arg) can present in childhood and
    adolescence as an apparently stationary, fundus-albipunctatus-like flecked
    retina, then evolve over decades in the same individuals into progressive
    retinitis punctata albescens with generalized retinal atrophy -- direct
    evidence that the "stationary" and "progressive" clinical labels can reflect
    different life stages of a single genotype rather than fixed, distinct
    disease entities.
  evidence:
  - reference: PMID:11453974
    reference_title: Fundus albipunctatus and retinitis punctata albescens in a pedigree with an R150Q mutation in RLBP1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of several patients aged 3-20 years over a 9-year period presented no evidence for either RP or RPA. In contrast, clinical examination of individuals with the same mutation in their fourth and fifth decade revealed signs consistent with RPA."
    explanation: >-
      This directly demonstrates age-dependent phenotype conversion within a
      single RLBP1 genotype (R150Q), from an apparently stationary childhood
      presentation to progressive RPA in adulthood.
  - reference: PMID:21447491
    reference_title: Mutations in RLBP1 associated with fundus albipunctatus in consanguineous Pakistani families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RPA and FA are genetically heterogeneous disorders: mutations in RLBP1 and occasionally in RHO, RDS and RDH5 have been causally associated with RPA, whereas mutations in RLBP1 and RDH5 have been identified with patients diagnosed with FA."
    explanation: >-
      This confirms the genetic heterogeneity of the RPA/FA clinical labels
      across multiple visual-cycle genes, of which RLBP1 and RDH5 are the two
      most frequently implicated.

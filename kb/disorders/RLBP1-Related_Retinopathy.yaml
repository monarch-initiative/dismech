genetic:
- name: RLBP1 pathogenic variants
  gene_term:
    preferred_term: RLBP1
    term:
      id: hgnc:10024
      label: RLBP1
  association: Causative
  features: >-
    Biallelic RLBP1 variants form an allelic severity continuum. Null alleles
    (splice-junction mutations, truncating variants, or a recurrent exon 7-9
    deletion) predicted to abolish CRALBP function entirely produce the most
    severe, earliest-onset course (Newfoundland rod-cone dystrophy). The
    recurrent missense founder variant p.Arg234Trp, which retains partial
    function, produces the intermediate, well-characterized Bothnia dystrophy
    course. A rare hypomorphic missense variant, p.Arg121Trp, has been reported
    with minimal or no measurable rod/cone impairment and no macular atrophy.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:11176989
      reference_title: "Ocular phenotype of bothnia dystrophy, an autosomal recessive retinitis pigmentosa associated with an R234W mutation in the RLBP1 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an autosomal recessive retinal dystrophy with an R234W mutation in the RLBP1 gene"
      explanation: >-
        Confirms autosomal recessive inheritance for the RLBP1 R234W founder
        variant.
  evidence:
  - reference: PMID:11868161
    reference_title: "Newfoundland rod-cone dystrophy, an early-onset retinal dystrophy, is caused by splice-junction mutations in RLBP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each NFRCD mutation is likely to give rise to a null allele. This difference may account for the severe phenotype in these families and exemplifies the molecular continuum that underlies clinically distinct but genetically related entities."
    explanation: >-
      This establishes the null-vs-partial-function allelic mechanism
      underlying the phenotypic continuum across RLBP1-related disease
      presentations.
  - reference: PMID:38945349
    reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypomorphic RLBP1 variants may cause milder retinal phenotypes rather than the typical severe rod-cone dystrophy with MA"
    explanation: >-
      This confirms that hypomorphic RLBP1 alleles can produce a materially
      milder phenotype than the typical severe rod-cone dystrophy course.
treatments:
- name: AAV8-RLBP1 (CPK850) Gene Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal delivery of an adeno-associated viral vector expressing RLBP1
    cDNA (AAV8-RLBP1, development code CPK850). An open-label, first-in-human,
    dose-escalation phase 1/2 trial in 12 patients with biallelic RLBP1
    mutations reported up to 3-year interim safety and efficacy data:
    dose-dependent intraocular inflammation (responsive to corticosteroids) and
    focal RPE atrophy as the dose-limiting toxicity, with significant
    improvement in dark adaptation kinetics (the primary efficacy endpoint) in
    all dose cohorts and resolution of disease-related retinal deposits. This
    is a materially different treatment landscape than RDH5-related
    retinopathy, which has no active gene therapy program.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CRALBP Retinoid-Binding Chaperone Deficiency
    treatment_effect: RESTORES
    description: >-
      Subretinal AAV8-mediated delivery of wild-type RLBP1 cDNA restores CRALBP
      expression in RPE and Muller cells, directly addressing the proximal
      chaperone deficiency rather than a downstream consequence of it.
    evidence:
    - reference: PMID:39256350
      reference_title: "Interim safety and efficacy of gene therapy for RLBP1-associated retinal dystrophy: a phase 1/2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with AAV8-RLBP1 resulted in the resolution of disease-related retinal deposits, suggestive of successful restoration of the visual cycle."
      explanation: >-
        The resolution of retinal deposits and improved dark adaptation
        kinetics are consistent with restored CRALBP function upstream in
        the visual cycle.
  evidence:
  - reference: PMID:39256350
    reference_title: "Interim safety and efficacy of gene therapy for RLBP1-associated retinal dystrophy: a phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subretinal delivery of an adeno-associated viral vector (AAV8-RLBP1) was well tolerated with dose-dependent intraocular inflammation which responded to corticosteroid treatment, and focal atrophy of the retinal pigment epithelium as the dose limiting toxicity. Dark adaptation kinetics, the primary efficacy endpoint, improved significantly in all dose-cohorts."
    explanation: >-
      This phase 1/2 interim analysis (12 patients, up to 3-year follow-up)
      is the primary evidence for the safety and efficacy of AAV8-RLBP1 gene
      therapy.
  - reference: PMID:39256350
    reference_title: "Interim safety and efficacy of gene therapy for RLBP1-associated retinal dystrophy: a phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with AAV8-RLBP1 resulted in the resolution of disease-related retinal deposits, suggestive of successful restoration of the visual cycle."
    explanation: >-
      This documents an imaging-based biomarker of visual-cycle restoration
      following gene therapy.

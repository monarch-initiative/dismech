  frequency: FREQUENT
  description: >-
    Null RLBP1 alleles produce a substantially more rapid and distinctive
    progression than the missense alleles underlying Bothnia dystrophy or
    retinitis punctata albescens.
  phenotype_term:
    preferred_term: Progressive visual loss
    term:
      id: HP:0000529
      label: Progressive visual loss
  evidence:
  - reference: PMID:11868161
    reference_title: "Newfoundland rod-cone dystrophy, an early-onset retinal dystrophy, is caused by splice-junction mutations in RLBP1."
    supports: SUPPORT

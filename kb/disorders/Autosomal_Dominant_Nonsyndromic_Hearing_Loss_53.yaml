    explanation: The linkage evidence that defines the locus.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of the COCH gene (DFNA9), BOCT, EFS, and HSPC156 within the DFNA53 interval did not identify the cause for deafness in this family."
    explanation: The four candidate genes that were sequenced and excluded.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."

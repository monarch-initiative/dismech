differential_diagnoses:
- name: DFNA9, COCH-related hearing loss
  description: DFNA9 overlaps the mapped interval and can produce a similar progressive audiogram. The original DFNA53 family had no reported vestibular dysfunction and normal caloric responses in six tested relatives. However, vestibular involvement in DFNA9 is variable, so its absence alone is not a definitive exclusion. The original COCH screen assessed coding regions and splice boundaries, not all structural or regulatory variants.
  evidence:
  - reference: PMID:15958501
    reference_title: A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although, there is some similarity in the audiograms of DFNA53 patients in comparison with those of patients with DFNA9, none of the affected members (14 to 67 years of age) in the DFNA53 family showed vestibular dysfunction.
    explanation: The clinical feature that separates the two, across the full age range of the family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37371710
    reference_title: 'Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review.'
    supports: SUPPORT

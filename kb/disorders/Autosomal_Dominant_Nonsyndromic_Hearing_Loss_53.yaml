diagnosis:
- name: Audiometric and pedigree diagnosis
  description: >-
    There is no molecular test for DFNA53. Diagnosis in the original family
    rested on pure-tone audiometry with air and bone conduction at 250 Hz to 8
    kHz, oto-immittance, DPOAE, Romberg testing and caloric testing in selected
    members, together with a history and examination directed at excluding
    acquired causes and syndromic forms. Outside that pedigree the designation
    cannot be applied: a person with postlingual progressive high-frequency
    sensorineural hearing loss and a dominant family history has, on current
    knowledge, an unsolved ADNSHL, and gene panels and exome sequencing will not
    return DFNA53 because there is no gene to report.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otoscopic examination was done, and air conduction threshold measurements made at 250 Hz, 500 Hz, 1 kHz, 2 kHz, 4 kHz, 6 kHz, and 8 kHz."
    explanation: The audiometric protocol used to classify affected status in the family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical history was taken and a physical examination carried out on the family members by one of the investigators, with special emphasis on identifying potential environmental causes of hearing loss such as infections, trauma, and exposure to ototoxic drugs including aminoglycoside and noise, or for evidence of syndromic forms of deafness."
    explanation: The exclusions that make the entity nonsyndromic and non-acquired.
    quote_role: PRIMARY_RESULT

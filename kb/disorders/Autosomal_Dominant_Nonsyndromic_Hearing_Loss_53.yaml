prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One family, reported once. There is no prevalence estimate of any kind and no
    denominator: the family was ascertained for a genome-wide linkage study, not
    from a screened cohort, and no second DFNA53 family has been published. A
    PubMed search for DFNA53 on 2026-09-26 returned this single paper.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a six generation family from the northern part of China with autosomal dominant sensorineural hearing impairment."
    explanation: The single family that constitutes the entire reported experience of this entity.
    quote_role: PRIMARY_RESULT
progression:
- phase: Onset in the second decade
  notes: >-
    Hearing is normal in early childhood - the loss is explicitly postlingual -
    and becomes apparent in the second decade. At-risk family members under 15
    without hearing loss were treated as phenotype-unknown in the linkage
    analysis, which is the authors' own acknowledgement that the phenotype is not
    yet expressed at that age. This is what makes the entity a paediatric
    surveillance problem rather than a neonatal one.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At‐risk individuals without hearing loss who were under the age of 15 were considered to have an unknown phenotype with respect to the trait."
    explanation: The age below which absence of hearing loss carries no information in this family.
    quote_role: PRIMARY_RESULT
- phase: Gradual progression to profound loss involving all frequencies
  notes: >-
    Progression is gradual rather than stepwise or sudden, from mild
    high-frequency loss to profound loss across the range. Severity at any given
    age varied substantially within the family, so an individual course cannot be
    predicted from a relative's. No serial audiometry over time is published;
    the progression is inferred from a cross-sectional comparison of affected
    members of different ages, from 14 to 67 years.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss was variable, not only between generations but also within generations, demonstrating the substantial variation in phenotypic expressivity of DFNA53."
    explanation: The variability that limits what can be said about an individual's course.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HL is initially mild and limited to high frequencies but gradually involves all frequencies and progresses to a profound degree by the 4th/5th decade of life"
    explanation: A 2023 review's summary of the DFNA53 time course, which puts a decade range on the endpoint that the primary report does not state.
    quote_role: REVIEW_SYNTHESIS

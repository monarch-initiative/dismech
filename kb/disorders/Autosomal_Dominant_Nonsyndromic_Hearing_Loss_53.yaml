- name: Age-related hearing loss (presbycusis)
  description: Progressive high-frequency loss extending to all frequencies is also the pattern of presbycusis, which is common enough that a dominant pedigree can be mistaken for coincidental aggregation in an older family. The distinguishing features are the age at onset - second decade rather than later adult life - and the clear vertical transmission through several generations.
  evidence:

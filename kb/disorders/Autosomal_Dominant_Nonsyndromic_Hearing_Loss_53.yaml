  description: The loss begins at the high frequencies and extends to involve all frequencies as it progresses. Audiogram configurations across the family were sloping, flat or residual. The authors note that this pattern is shared with several other ADNSHL loci and with presbycusis, which is part of why the entity is hard to recognise outside a large pedigree.

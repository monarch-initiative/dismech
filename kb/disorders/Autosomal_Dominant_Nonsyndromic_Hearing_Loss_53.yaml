- name: DFNA53 locus at 14q11.2-q12
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Mapped by linkage only. A maximum two point LOD score of 3.8 at theta = 0
    was obtained for D14S608 and a maximum multipoint LOD score of 5.4 for
    D14S1280, with exclusion of the rest of the genome. The causal gene and
    variant are unidentified.
  affected_regions:
  - name: DFNA53 critical interval
    chromosomal_region: 14q11.2-q12
    description: >-
      A 9.6 cM interval bounded by the recombinant markers D14S581 and D14S1021,
      spanning about 6.4 Mb and roughly 60 known genes. The interval contains the
      DFNA9 critical region but does not overlap the DFNA23, DFNB5 or DFNB35
      regions.
  notes: >-
    No gene_term is bound because no gene is known. MONDO, MedGen and the HPO
    disease record all carry DFNA53 with no associated gene, and ClinGen's
    Hearing Loss Gene Curation Expert Panel has made no gene-disease validity
    assertion against MONDO:0012380 (checked against the committed ClinGen
    gene-disease validity table on 2026-09-26; the panel's nonsyndromic hearing
    loss assertions are made against MONDO:0019497 and against gene-defined
    entities). Four candidate genes in the interval were sequenced and excluded
    by the mapping study: COCH, SLC22A17, EFS and HSPC156.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

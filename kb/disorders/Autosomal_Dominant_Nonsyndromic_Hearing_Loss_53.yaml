    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with autosomal dominant hearing loss have a 50% chance of transmitting the pathogenic variant to each child."
    explanation: The recurrence risk counselling rests on.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: DFNA9, COCH-related hearing loss with vestibular dysfunction
  description: >-
    The single most important differential, because the DFNA9 critical region
    lies inside the DFNA53 interval and the audiograms are similar. DFNA9 is
    distinguished by vestibular involvement, which every DFNA9 series reports and
    which no DFNA53 family member showed: six affected DFNA53 individuals had
    normal caloric responses, and Romberg testing was done in all family members.
    COCH coding regions and intron-exon boundaries were also sequenced in
    affected DFNA53 individuals without finding a disease causing variant.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although, there is some similarity in the audiograms of DFNA53 patients in comparison with those of patients with DFNA9, none of the affected members (14 to 67 years of age) in the DFNA53 family showed vestibular dysfunction."
    explanation: The clinical feature that separates the two, across the full age range of the family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the clinical features of DFNA53 patients, mutation type in DFNA9, and our mutation screening data, we exclude COCH as the DFNA53 causative gene."
    explanation: The authors' explicit exclusion of the gene that the overlapping interval would otherwise implicate.
    quote_role: PRIMARY_RESULT
- name: Age-related hearing loss (presbycusis)
  description: >-
    Progressive high-frequency loss extending to all frequencies is also the
    pattern of presbycusis, which is common enough that a dominant pedigree can
    be mistaken for coincidental aggregation in an older family. The
    distinguishing features are the age at onset - second decade rather than
    later adult life - and the clear vertical transmission through several
    generations.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High frequency hearing loss that progresses to involve all frequencies is characteristic of age related hearing loss, also known as presbycusis."
    explanation: The overlap the authors themselves name.
    quote_role: PRIMARY_RESULT
- name: Other autosomal dominant nonsyndromic hearing loss loci with the same audiometric pattern
  description: >-
    The authors note that the DFNA53 audiometric pattern is shared with DFNA2,
    DFNA5, DFNA7 and DFNA9. Since several of those are gene-defined, an
    apparently DFNA53-like family should be tested on a comprehensive hearing
    loss panel or by exome sequencing first; DFNA53 is what remains when those
    return nothing, and only in a pedigree large enough to map.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This hearing phenotype is also observed in other previously identified ADNSSHL loci, including DFNA2, DFNA5, DFNA7, and DFNA9."
    explanation: Names the loci sharing the audiometric pattern.
    quote_role: PRIMARY_RESULT
discussions:
- discussion_id: dfna53_causal_gene_unidentified
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Unidentified Dominant Allele in the 14q11.2-q12 Interval"
  - "genetic#DFNA53 locus at 14q11.2-q12"
  prompt: >-
    Which gene in the 14q11.2-q12 interval carries the DFNA53 allele, and is
    DFNA53 a distinct entity at all or an unreplicated mapping in one family?
  rationale: >-
    Everything known about DFNA53 comes from one 2006 report of one family. The
    linkage itself is solid - a maximum multipoint LOD of 5.4 with the rest of
    the genome excluded - so the interval is not in doubt. What is missing is the
    gene: four candidates were sequenced and excluded, about 60 known genes
    remain in the 6.4 Mb interval, and no gene has been reported in the twenty
    years since. No second family has been published, so there is no independent
    replication of the locus either.

    The gap is now tractable in a way it was not in 2006. The mapping predates
    routine exome and genome sequencing, and the authors' own list of what direct
    sequencing could not see - large deletions and duplications, promoter and
    untranslated region changes - is exactly what short-read genome sequencing
    with structural variant calling would now cover. The stored DNA from a
    six-generation pedigree with 48 genotyped members is an unusually strong
    resource for this.

    It matters for what a family is told. A young person from an ADNSHL pedigree
    with this audiometric pattern currently comes back unsolved on every clinical
    test, and DFNA53 is a name for the unsolved state rather than a diagnosis
    that can be made.
  proposed_experiments:
  - experiment_id: dfna53_genome_sequencing_of_the_original_pedigree
    name: Genome sequencing of the original DFNA53 pedigree
    description: >-
      Short-read or long-read genome sequencing of affected and unaffected
      haplotype-informative members of the Chinese family, filtered to the
      D14S581-D14S1021 interval, with structural variant, copy number and
      noncoding variant calling rather than coding-only analysis.
    would_support:
    - "pathophysiology#Unidentified Dominant Allele in the 14q11.2-q12 Interval"
    supporting_outcome:
    - >-
      A single variant within the interval segregating with affected status
      across the pedigree and absent from population databases would identify the
      DFNA53 gene and convert this entry from a locus to a disease.
    refuting_outcome:
    - >-
      No segregating variant anywhere in the interval, after coding, noncoding
      and structural variant analysis, would reopen the question of whether the
      original linkage signal reflects a single Mendelian allele at all.
external_assertions:
- name: MedGen concept for autosomal dominant nonsyndromic hearing loss 53
  source: MedGen
  assertion_type: disease_record
  external_id: MEDGEN:355336
  url: https://www.ncbi.nlm.nih.gov/medgen/355336
  description: >-
    The MedGen concept record, which carries OMIM:609965 and MONDO:0012380 for
    the same entity. It is recorded here because its definition is the clearest
    external statement that DFNA53 is defined by a chromosomal region rather than
    by a gene, and because the DiseaseMappings class carries only ICD-10-CM,
    ICD-11, MONDO and NCIT slots.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/medgen/355336
    reference_title: "Autosomal dominant nonsyndromic hearing loss 53 (Concept Id: C1864957) - MedGen - NCBI"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An autosomal dominant nonsyndromic deafness that has material basis in variation in the chromosome region 14q11.2-q12."
    explanation: The definition, which names a chromosome region and no gene.
notes: >-
  Scope decision: curated as a deliberately thin DISEASE entry rather than
  recorded as OUT_OF_SCOPE on the stub. The two precedents in this repository
  point in opposite directions and were both weighed. DFNB46 was ruled
  OUT_OF_SCOPE on the stub on the ground that a 5.8 Mb interval from one family
  is an identity claim about a chromosomal segment rather than about a disease
  mechanism. DFNA47 - one Italian family, mapped in 2003, no gene since - was
  curated as a thin entry whose single pathophysiology node is an explicitly
  HYPOTHETICAL inference of cochlear injury drawn from the audioprofile alone.
  DFNA53 is better evidenced than the case that was accepted: its cochlear
  localisation is a direct measurement in every affected member rather than a
  pattern match, and its natural history is characterised by age at onset,
  audiogram configuration, expressivity and an explicit negative vestibular
  result. DFNA53 is not an abstract category or a
  susceptibility term - it is a specific clinical entity with a defined
  audiometric phenotype, a defined age at onset, a defined interval and a
  statistically strong linkage result, and MONDO keeps it as a live, non-obsolete
  term with no replacement. Marking it out of scope would assert that it should
  never be curated, when what is true is that its mechanism is not yet knowable.
  What the entry omits is a molecular pathophysiology, because there is no gene;
  the pathograph runs from an explicitly unidentified allele to a cochlear lesion
  to the audiometric phenotype, and stops there.

  Everything disease-specific in this entry derives from one publication,
  PMID:15958501. The two other sources are secondary and are used as such: the
  2023 DFNA review PMID:37371710 for its locus-table row, which is an
  independent statement that the gene was still unknown in 2023 and which puts a
  decade range on the progression that the primary report does not state, and
  the GeneReviews Genetic Hearing Loss Overview for class-level care. That is not a citation gap that further searching would close. A
  PubMed search for DFNA53 on 2026-09-26 returned exactly one record, this one;
  a search for 14q11.2 together with deafness or hearing loss returned three, of
  which one is the DFNA9 mapping and one concerns specific language impairment.
  The ClinGen gene-disease validity table committed in this repository carries no
  assertion against MONDO:0012380, and the HPO disease record for OMIM:609965
  lists no gene.

  Two negative findings are worth keeping visible rather than leaving as absent
  fields. Vestibular function was normal in the six affected members tested by
  ice water calorics, which is what separates DFNA53 from DFNA9; HPO records this
  as abnormal vestibular function at 0/6. And no candidate gene from the interval
  has ever been adopted here as the cause - COCH, SLC22A17, EFS and HSPC156 were
  each sequenced and excluded by the mapping study, and none of them is a DFNA53
  gene.

  There is no Orphanet entry for DFNA53, so no ORPHA record is cited; MONDO
  carries cross-references to DOID, GARD, MedGen, MeSH, OMIM and UMLS but not to
  Orphanet.

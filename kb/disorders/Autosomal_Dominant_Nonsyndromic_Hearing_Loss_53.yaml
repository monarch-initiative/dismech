phenotypes:
- name: Postlingual Progressive Sensorineural Hearing Loss
  category: Ear
  description: Postlingual bilateral sensorineural hearing loss was reported in the 16 affected relatives selected for linkage analysis. Most reported onset in the second decade; the earliest clinical evidence was at age 14 in two relatives. Severity ranged from mild to profound, with variable expressivity within and between generations. These selected affected cases do not estimate penetrance or population frequency.
  phenotype_term:
    preferred_term: Postlingual progressive sensorineural hearing impairment
    term:

- name: Audiological Surveillance
  description: Serial audiologic assessment can document progression and guide hearing support. Relatives at increased familial risk should receive periodic testing even when the molecular cause remains unresolved; the interval is individualized rather than inferred from the age cutoff used in the original linkage model.

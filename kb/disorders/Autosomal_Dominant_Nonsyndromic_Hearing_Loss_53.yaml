discussions:
- discussion_id: dfna53_causal_gene_unidentified
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified Dominant Allele in the 14q11.2-q12 Interval
  - genetic#DFNA53 locus at 14q11.2-q12
  prompt: Which causal variant and gene account for the hearing-loss linkage at 14q11.2-q12, and can independent families replicate the association?
  rationale: The mapping study provides strong linkage evidence within one pedigree but does not resolve a gene or molecular mechanism. Its coding-region candidate screen left structural and regulatory variation incompletely assessed. Genome analysis could revisit these possibilities if appropriate samples are available, but sample availability is not established by the historical report.
  proposed_experiments:
  - experiment_id: dfna53_genome_sequencing_of_the_original_pedigree
    name: Genome sequencing of the original DFNA53 pedigree
    description: If samples and consent are available, sequence affected and informative unaffected relatives using genome methods that assess sequence and structural variation, then evaluate candidates within a remapped D14S581–D14S1021 interval. Account for age-dependent phenotype classification and assay coverage, and seek independent genetic and functional evidence.
    would_support:
    - pathophysiology#Unidentified Dominant Allele in the 14q11.2-q12 Interval
    supporting_outcome:
    - A rare segregating variant would nominate a candidate; replication and functional evidence consistent with the clinical phenotype would strengthen causal attribution.
    refuting_outcome:
    - Reliable segregation incompatible with the interval or stronger evidence for a different cause would weaken the original locus assignment. Failure to detect a variant alone would remain inconclusive because of assay and interpretation limits.

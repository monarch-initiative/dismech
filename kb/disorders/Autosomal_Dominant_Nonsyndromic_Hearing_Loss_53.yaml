diagnosis:
- name: Audiometric and pedigree diagnosis
  description: Clinical assessment in the original pedigree combined otoscopy, pure-tone air- and bone-conduction audiometry, oto-immittance, DPOAE and pedigree analysis. History and examination assessed acquired causes and syndromic features. DFNA53 attribution requires evidence connecting the family to the mapped locus; a similar audiogram or a negative gene panel alone does not establish this diagnosis.
  evidence:
  - reference: PMID:15958501
    reference_title: A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Otoscopic examination was done, and air conduction threshold measurements made at 250 Hz, 500 Hz, 1 kHz, 2 kHz, 4 kHz, 6 kHz, and 8 kHz.
    explanation: The audiometric protocol used to classify affected status in the family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical history was taken and a physical examination carried out on the family members by one of the investigators, with special emphasis on identifying potential environmental causes of hearing loss such as infections, trauma, and exposure to ototoxic drugs including aminoglycoside and noise, or for evidence of syndromic forms of deafness.
    explanation: History and examination screened for acquired causes and syndromic features; this is not proof that every possible alternative was excluded.
    quote_role: PRIMARY_RESULT
- name: Genetic evaluation of an unresolved hearing-loss pedigree
  description: General genetic hearing-loss evaluation can use a multigene panel and/or genomic testing to identify established causes with overlapping phenotypes. DFNA53 currently lacks an identified causal variant for a gene-specific diagnostic assay. A negative result leaves the etiology unresolved rather than proving DFNA53.

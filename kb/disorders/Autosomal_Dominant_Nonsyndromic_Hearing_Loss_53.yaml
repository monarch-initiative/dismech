inheritance:
- name: Autosomal dominant
  description: >-
    The hearing loss segregated as an autosomal dominant trait through three
    testable generations of a six-generation pedigree. Linkage was analysed
    under a dominant model with 90 percent assumed penetrance in the
    heterozygote; that figure is a model parameter, not a measured penetrance.
    Each child of an affected parent has a 50 percent chance of inheriting the
    allele. Because the gene is unknown, no predictive molecular test exists
    outside haplotype tracking within this one family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical history and audiological finding of the hearing loss in family members clearly revealed an autosomal dominant form of post‐lingual, bilateral sensorineural hearing loss."
    explanation: States the mode of inheritance and the character of the hearing loss in the only reported family.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with autosomal dominant hearing loss have a 50% chance of transmitting the pathogenic variant to each child."
    explanation: The recurrence risk figure quoted in the description, from the GeneReviews hearing loss overview rather than from the DFNA53 report, which does not state it.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Unidentified Dominant Allele in the 14q11.2-q12 Interval
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Linkage and recombinant haplotype analysis place the disease allele between
    D14S581 and D14S1021, a 9.6 cM interval at 14q11.2-q12 containing about 6.4
    Mb and roughly 60 known genes. The statistical evidence for the interval is
    strong - a maximum multipoint LOD score of 5.4 - but the gene, the variant
    and the gene product are all unknown, so nothing downstream of this node can
    be stated at the molecular level. The node is marked PROVISIONAL for that
    reason: the locus is established, the mechanism is not.
  notes: >-
    Four candidate genes within the interval were sequenced across coding
    regions and intron-exon boundaries and excluded: COCH, the DFNA9 gene, whose
    critical interval lies inside the DFNA53 interval; SLC22A17, also called
    BOCT, a brain-type organic cation transporter; EFS, encoding a cell-adhesion
    docking protein; and HSPC156, also called STXBP6, encoding a syntaxin
    binding protein. The authors note that direct sequencing would not detect
    large deletions or duplications, or changes in the COCH promoter or
    untranslated regions, which they did not screen.
  downstream:
  - target: Cochlear Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The only link the literature supports between the locus and the phenotype.
      Nothing is known about how the allele acts, so this edge asserts
      co-segregation with a cochlear lesion and nothing more.
    evidence:
    - reference: PMID:15958501
      reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Distortion product otoacoustic emission (DPOAE) testing in all the affected individuals, using the IL096 DP analyser (Otodynamics UK 1996), showed cochlear dysfunction."
      explanation: The cochlear localisation observed in the same affected individuals whose haplotypes define the locus.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis placed the DFNA53 locus between the proximal marker D14S581 and the distal marker D14S1021, which defines a critical interval of 9.6 cM"
    explanation: Defines the interval that this node names.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This interval spans a physical distance of about 6.4 Mb, and includes ∼60 known genes and a series of predicted or poorly characterised genes"
    explanation: The size of the interval, which is why the gene remains unidentified.
    quote_role: PRIMARY_RESULT
- name: Cochlear Dysfunction
  biological_scale: TISSUE
  description: >-
    Distortion product otoacoustic emission testing was abnormal in every
    affected member of the family, which places the lesion in the cochlea rather
    than in the middle ear or in the retrocochlear auditory pathway. Bone
    conduction thresholds and oto-immittance measurements were obtained in order
    to exclude a conductive component. No cell type, molecular function or
    biological process is bound to this node, because the source establishes
    cochlear dysfunction and no more: no temporal bone, imaging or
    electrophysiological study beyond DPOAE has been published for this family.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  downstream:
  - target: Postlingual Progressive Sensorineural Hearing Loss
    description: The cochlear lesion is what the audiometric phenotype measures.
    evidence:
    - reference: PMID:15958501
      reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical history and audiological finding of the hearing loss in family members clearly revealed an autosomal dominant form of post‐lingual, bilateral sensorineural hearing loss."
      explanation: The sensorineural, postlingual character of the loss that the cochlear finding accounts for.
      quote_role: PRIMARY_RESULT
  - target: High-Frequency Hearing Loss Progressing to All Frequencies
    description: >-
      The frequency pattern of a progressive cochlear lesion, beginning at the
      high frequencies and extending downward.
    evidence:
    - reference: PMID:15958501
      reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DFNA53 is characterised by hearing loss affecting high frequencies that begins in the second decade of life and progresses to severe deafness involving all frequencies."
      explanation: The frequency pattern and its progression, stated by the authors as the defining feature.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distortion product otoacoustic emission (DPOAE) testing in all the affected individuals, using the IL096 DP analyser (Otodynamics UK 1996), showed cochlear dysfunction."
    explanation: The direct observation this node records.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone conduction thresholds were determined to exclude a conductive component in patients with hearing loss."
    explanation: The step that excludes a conductive contribution and leaves the lesion sensorineural.
    quote_role: PRIMARY_RESULT
phenotypes:
- name: Postlingual Progressive Sensorineural Hearing Loss
  category: Ear
  frequency: OBLIGATE
  description: >-
    Bilateral, sensorineural and postlingual in every affected member. Onset was
    in the second decade of life in most cases; the earliest clinical evidence in
    the family was at age 14, in two individuals. Severity ranged from mild to
    profound and varied within as well as between generations, and there was no
    apparent effect of sex on progression. Sixteen of the 48 genotyped family
    members were classified as affected for linkage. HPO annotates
    OMIM:609965 with sensorineural hearing impairment at 16/16 and juvenile
    onset, both from this one report.
  phenotype_term:
    preferred_term: Postlingual progressive sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  notes: >-
    OBLIGATE because the family was ascertained through its hearing loss, so the
    band says nothing about penetrance. The binding takes the onset axis, which
    is the feature the source states consistently; the progression and the
    severity range are carried in the description and in a separate progressive
    high-frequency phenotype rather than by manufacturing a compound term.
  evidence:
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reported onset of hearing problems in most cases was in the second decade of life with subsequent gradual progression from mild to profound hearing loss involving the high frequencies in the majority of patients."
    explanation: Onset, severity range and progression in the only reported family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The earliest clinical evidence of hearing loss in the family was obtained from individuals V‐82 and V‐91 at the age of 14 years."
    explanation: The youngest documented age at onset, which is what a paediatric assessment turns on.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15958501
    reference_title: "A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 48 individuals in whom DNA was obtained, 16 were classified as affected for the purposes of linkage analysis."
    explanation: The denominator behind every frequency statement about this entity.
    quote_role: PRIMARY_RESULT
- name: High-Frequency Hearing Loss Progressing to All Frequencies
  category: Ear
  frequency: VERY_FREQUENT
  description: >-
    The loss begins at the high frequencies and extends to involve all
    frequencies as it progresses. Audiogram configurations across the family were
    sloping, flat or residual. The authors note that this pattern is shared with
    several other ADNSHL loci and with presbycusis, which is part of why the
    entity is hard to recognise outside a large pedigree.

pathophysiology:
- name: Unidentified Dominant Allele in the 14q11.2-q12 Interval
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: Linkage and recombinant haplotype analysis mapped DFNA53 between D14S581 and D14S1021, a 9.6 cM interval at 14q11.2-q12. The original assembly placed approximately 6.4 Mb and 60 known genes in this interval. A maximum multipoint LOD score of 5.4 supports linkage in the reported pedigree, but the causal gene, variant and molecular mechanism remain unresolved.
  notes: The original study sequenced coding regions and adjacent splice boundaries of COCH, SLC22A17 (BOCT), EFS and HSPC156 (STXBP6) without identifying a segregating cause. This screen did not comprehensively assess structural or noncoding variation; the authors explicitly noted unscreened COCH promoter and untranslated regions and the limitations for large deletions or duplications.
  downstream:
  - target: Cochlear Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Linkage to the interval and cochlear dysfunction were observed in the same family; the intervening molecular and cellular events are unknown.
    evidence:
    - reference: PMID:15958501
      reference_title: A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Distortion product otoacoustic emission (DPOAE) testing in all the affected individuals, using the IL096 DP analyser (Otodynamics UK 1996), showed cochlear dysfunction.
      explanation: The cochlear localisation observed in the same affected individuals whose haplotypes define the locus.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:15958501
    reference_title: A novel locus for autosomal dominant non-syndromic deafness, DFNA53, maps to chromosome 14q11.2-q12.
    supports: SUPPORT

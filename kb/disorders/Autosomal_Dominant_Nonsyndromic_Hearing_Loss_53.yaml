notes: Disease-specific clinical and linkage evidence comes from the original family report; the 2023 review supplies secondary context and GeneReviews supplies general care. No causal gene, validated variant-specific model or disease-specific treatment is established by these sources. Candidate-screening negatives are limited to the regions and methods tested. Normal caloric responses in six relatives should not be converted into a positive vestibular phenotype from an aggregated database tag.

name: Autosomal Dominant Nonsyndromic Hearing Loss 53
category: Mendelian
creation_date: "2026-09-26T00:00:00Z"
synonyms:
- DFNA53
- autosomal dominant deafness 53
- autosomal dominant nonsyndromic deafness 53
- autosomal dominant nonsyndromic deafness type 53
- deafness, autosomal dominant 53
- deafness, autosomal dominant nonsyndromic sensorineural 53
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 53
  term:
    id: MONDO:0012380
    label: autosomal dominant nonsyndromic hearing loss 53
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
description: >-
  DFNA53 is a mapped linkage locus, not a gene-defined disease. It rests
  entirely on one report: a six-generation family from northern China in which
  16 of 48 genotyped members had postlingual, bilateral sensorineural hearing
  loss, and in which genome-wide linkage placed the disease allele in a 9.6 cM
  interval at 14q11.2-q12 with a maximum multipoint LOD score of 5.4. No gene
  has been identified in the twenty years since, and no second family has been
  published. A 2023 narrative review tabulating every DFNA locus still lists the
  DFNA53 gene and its protein function as unknown. MONDO defines the entity by
  the chromosomal region rather than by a gene, and MedGen, HPO and ClinGen all
  record no associated gene for it.

  The clinical picture, as observed in that one family, is specific enough to be
  worth recording. Hearing loss began in the second decade in most affected
  members, with the earliest documented onset at age 14, and progressed
  gradually from mild high-frequency loss to profound loss involving all
  frequencies; audiograms were sloping, flat or residual. Severity varied
  markedly within as well as between generations. Six affected members had
  caloric testing with normal results, so vestibular function was spared - the
  feature that separates DFNA53 from DFNA9, whose critical interval it contains
  and whose gene, COCH, was sequenced and excluded. Distortion product
  otoacoustic emission testing showed cochlear dysfunction in all affected
  individuals, which localises the lesion to the cochlea and is the only
  mechanistic statement the literature supports.

  Four candidate genes in the interval - COCH, SLC22A17 (BOCT), EFS and
  HSPC156 (STXBP6) - were sequenced and none carried a segregating disease
  causing change. The interval spans about 6.4 Mb and roughly 60 known genes, so
  the causal gene remains unidentified. This entry is therefore deliberately
  thin: it carries the inheritance, the audiometric phenotype, the onset and
  progression, and the cochlear localisation, and it carries no molecular
  mechanism, because none has been established.

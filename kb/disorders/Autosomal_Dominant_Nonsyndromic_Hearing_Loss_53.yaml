- name: Genetic Counselling and Audiological Surveillance from Childhood
  therapeutic_modality: BEHAVIORAL
  description: >-
    Counselling for a dominant trait with a 50 percent transmission risk per
    child, and serial audiometry in at-risk children and adolescents. The
    surveillance point is paediatric and specific: hearing was normal in early
    childhood in this family and the earliest documented loss was at 14, and the
    linkage analysis itself treated unaffected at-risk individuals under 15 as
    uninformative. A normal audiogram in a young child therefore does not
    reassure, and the useful interval for detection is adolescence. Because the
    gene is unknown, counselling cannot be supported by predictive molecular
    testing.

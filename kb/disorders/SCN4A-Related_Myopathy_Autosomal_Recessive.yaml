      label: congenital myopathy 22B, severe fetal
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  description: >-
    The lethal end of the spectrum: marked fetal hypokinesia from the second or
    third trimester with maternal polyhydramnios, fetal hydrops, in utero limb
    contractures and talipes, a small thorax and pulmonary hypoplasia, with
    death in utero or within hours of birth. Homozygous complete loss-of-function
    alleles (p.P382T in the original cohort) were uniformly lethal; some
    compound heterozygotes for a null and a partial loss-of-function allele were
    also lethal, while siblings with the same genotype could survive.
  review_notes: >-
    MONDO files MONDO:0957265 under congenital myopathy and hereditary skeletal
    muscle disorder but not under MONDO:0100121, even though the ClinGen-sourced
    definition of MONDO:0100121 names fetal hypokinesia as part of its spectrum
    and ClinGen lumped all recessive SCN4A disease into it. Recorded here as a
    subtype on that basis.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inheritance of full loss-of-function mutations on both alleles appears to cause a particularly severe phenotype resulting in early lethality, evidenced by the homozygous p.P382T mutation detected in the three affected individuals from Family 5."
    explanation: Ties the lethal fetal presentation to biallelic complete loss of Nav1.4 function.
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In seven cases, severe muscle weakness resulted in death during the third trimester or shortly after birth."
    explanation: Seven of 11 in the original cohort died in utero or shortly after birth.
  - reference: PMID:38255008
    reference_title: "Sodium Channel Gene Variants in Fetuses with Abnormal Sonographic Findings: Expanding the Prenatal Phenotypic Spectrum of Sodium Channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented a severe prenatal phenotype including talipes, fetal hypokinesia, hypoplastic lungs, polyhydramnios, ear abnormalities and others"
    explanation: An independent compound heterozygous SCN4A fetus with the same severe prenatal phenotype, which died soon after birth.
- name: CM22A
  display_name: Congenital myopathy 22A, classic
  subtype_term:
    preferred_term: congenital myopathy 22A, classic
    term:
      id: MONDO:0957247
      label: congenital myopathy 22A, classic
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  description: >-
    Survivors with a "classical" congenital myopathy: congenital or neonatal
    hypotonia, mild-to-moderate facial weakness with an elongated face and high
    arched palate, prominent neck and axial weakness, neonatal respiratory and
    swallowing insufficiency, delayed motor milestones and later spinal
    deformity, with improvement in strength through the first decade. Muscle
    biopsy is myopathic without specific structural abnormalities in most cases.
    Each reported survivor carried at least one complete loss-of-function
    allele.
  review_notes: >-
    MONDO files MONDO:0957247 under congenital myopathy and hereditary skeletal
    muscle disorder but not under MONDO:0100121; see the CM22B row.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all cohort members who survived infancy experienced improvement in their strength and motor skills over time, and concomitant resolution of early respiratory and feeding difficulties"
    explanation: Defines the surviving, improving congenital myopathy presentation.
- name: CMS16
  display_name: Congenital myasthenic syndrome 16
  subtype_term:
    preferred_term: congenital myasthenic syndrome 16
    term:
      id: MONDO:0013620
      label: congenital myasthenic syndrome 16
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  description: >-
    The myasthenic presentation: fatigable weakness with ptosis or
    ophthalmoparesis, bulbar and respiratory weakness, and in some patients
    recurrent attacks of severe weakness resembling periodic paralysis, with a
    decremental compound muscle action potential at higher stimulation rates.
    Reported alleles are missense variants (V1442E, R1454W, R1457H, R1460Q/W,
    P1650L) that reduce channel availability by enhancing fast inactivation,
    slowing recovery from it, or enhancing use-dependent inactivation, rather
    than null alleles. Presentations overlap with the congenital myopathy rows:
    myopathic patients can be fatigable and myasthenic patients can have
    myopathic features.
  review_notes: >-
    MONDO:0013620 is a MONDO child of both MONDO:0100121 and the postsynaptic
    congenital myasthenic syndrome class. kb/disorders/Congenital_Myasthenic_Syndrome.yaml
    names CMS16 in its notes and in the review_notes of its postsynaptic row but
    carries no subtype row, gene record or pathophysiology for it, so this row
    and this entry's pathophysiology are the KB's only structured model of
    SCN4A-CMS. The term is recorded here as a subtype_term only; no entry uses
    it as a disease_term, so there is no shared-anchor question.
  evidence:
  - reference: PMID:12766226
    reference_title: Myasthenic syndrome caused by mutation of the SCN4A sodium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a myasthenic syndrome associated with fatigable generalized weakness and recurrent attacks of respiratory and bulbar paralysis since birth, nerve stimulation at physiologic rates rapidly decremented the compound muscle action potential."
    explanation: The index CMS16 patient, with fatigable weakness, bulbar and respiratory attacks, and a decremental response.
  - reference: PMID:26659129
    reference_title: A recessive Nav1.4 mutation underlies congenital myasthenic syndrome with periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel loss-of-function mutation of Nav1.4 that leads to a recessive phenotype combining clinical symptoms and signs of congenital myasthenic syndrome and periodic paralysis"
    explanation: A homozygous R1454W patient combining myasthenic and periodic-paralysis features.
  - reference: PMID:32487525
    reference_title: Homozygous C-terminal loss-of-function Na(V)1.4 variant in a patient with congenital myasthenic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic loss-of-function (LOF) genetic mutations in SCN4A encoding skeletal muscle sodium channel NaV1.4 are a rare cause of CMS."
    explanation: States that biallelic SCN4A loss of function causes CMS.
inheritance:
- name: Autosomal Recessive
  description: >-
    Disease requires biallelic SCN4A loss-of-function variants (homozygous or
    compound heterozygous). Parents and siblings carrying a single variant,
    including a single null allele, are clinically unaffected, although carriers
    of the mixed-effect p.R1460Q allele had myotonia.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of clinical findings in confirmed carriers suggests that the loss of function in only one allele is insufficient to cause a clinical phenotype, and further suggest an autosomal recessive mechanism of inheritance."
    explanation: Unaffected heterozygous parents and sibling establish recessive inheritance.
  - reference: PMID:30824560
    reference_title: Myasthenic congenital myopathy from recessive mutations at a single residue in Na(V)1.4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital hypotonia, breathing difficulties, bulbar weakness, and fatigability had recessive inheritance (homozygous p.R1460W or compound heterozygous p.R1460Q and p.R1059X), whereas carriers were either asymptomatic (p.R1460W) or had myotonia (p.R1460Q)."
    explanation: Recessive inheritance in two further families, and the myotonia exception in p.R1460Q carriers.

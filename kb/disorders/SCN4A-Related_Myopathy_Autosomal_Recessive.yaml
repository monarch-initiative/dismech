    syndrome or myopathy. ClinGen counted at least 11 probands by 2021.
  evidence:
  - reference: PMID:38187266
    reference_title: "SCN4A-related congenital myopathy in a Han Chinese patient: A case report and literature review."
    supports: SUPPORT

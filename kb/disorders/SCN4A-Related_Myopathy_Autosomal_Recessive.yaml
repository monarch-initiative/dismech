diagnosis:
- name: Exome or Neuromuscular Gene Panel Sequencing
  description: >-
    Diagnosis rests on finding biallelic SCN4A variants by exome sequencing or a
    myopathy panel, with segregation in the parents. Because the clinical and
    histological findings are nonspecific, and missense variants need functional
    characterization to establish loss of function, patch-clamp study of novel
    variants supports interpretation.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome sequencing, we identified homozygous or compound heterozygous SCN4A mutations in a cohort of 11 individuals from six unrelated kindreds with congenital myopathy."
    explanation: Exome sequencing identified the disease.
  - reference: PMID:38187266
    reference_title: "SCN4A-related congenital myopathy in a Han Chinese patient: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is challenging as the initial clinical presentation and histological features on muscle biopsies are non-specific."
    explanation: Nonspecific presentation makes molecular testing the route to diagnosis.
- name: Electrodiagnostic Testing
  description: >-
    Needle EMG shows no myotonia and is normal or mildly myopathic; repetitive
    nerve stimulation may show a decrement, typically at 10 Hz or higher rather
    than at 3 Hz. Absence of myotonia and of dyskalemia helps separate the
    recessive disease from the dominant SCN4A channelopathies.
  diagnosis_term:
    preferred_term: electromyography and repetitive nerve stimulation
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiology suggested a myopathic process, without myotonia."
    explanation: EMG pattern in the congenital myopathy presentation.

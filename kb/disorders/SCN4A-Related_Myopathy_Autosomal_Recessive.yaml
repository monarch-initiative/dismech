    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  molecular_functions:
  - preferred_term: Nav1.4 voltage-gated sodium channel activity
    modifier: DECREASED
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  conforms_to: "neuromuscular_transmission_failure#Endplate Component Lesion"
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional assessment in HEK293 cells of the impact of the identified SCN4A mutations showed loss-of-function of the mutant Nav1.4 channels."
    explanation: Heterologous expression shows the patient alleles are loss of function.
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three of the variants (p.R104H, p.P382T and p.C1209F) did not display any detectable sodium currents when expressed in HEK293 cells"
    explanation: Some missense alleles are functionally null.
  - reference: PMID:12766226
    reference_title: Myasthenic syndrome caused by mutation of the SCN4A sodium channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The genetically engineered V1442E-Na channel expressed in HEK cells shows marked enhancement of fast inactivation close to the resting potential, and enhanced use-dependent inactivation on high-frequency stimulation"
    explanation: The myasthenic allele reduces availability through enhanced fast and use-dependent inactivation.
  - reference: PMID:28262468
    reference_title: "Congenital myopathy with \"corona\" fibres, selective muscle atrophy, and craniosynostosis associated with novel recessive mutations in SCN4A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Electrophysiological characterization of the mutations revealed the Cys375Arg confers full and Arg1142Gln mild partial loss-of-function."
    explanation: A further family with the null-plus-partial allele combination.
  - reference: PMID:27048647
    reference_title: "Mice with an NaV1.4 sodium channel null allele have latent myasthenia, without susceptibility to periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sodium current density was half that of wild-type muscle and no compensation by retained expression of the foetal NaV1.5 isoform was detected."
    explanation: In the null mouse, current density tracks Nav1.4 gene dosage and Nav1.5 does not compensate.
  downstream:
  - target: Attenuated Muscle Fiber Action Potential
    causal_link_type: DIRECT
    description: Fewer available sodium channels lower the amplitude of the regenerative sarcolemmal action potential.
    evidence:
    - reference: PMID:26700687
      reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "suggest that different degrees of loss-of-function in mutant Nav1.4 channels are associated with attenuation of the skeletal muscle action potential amplitude to a level insufficient to support normal muscle function"
      explanation: Links graded channel loss to attenuated action potential amplitude.
  - target: Loss of Endplate Safety Factor for Action Potential Initiation
    causal_link_type: DIRECT
    description: Nav1.4 at the endplate converts the endplate potential into a propagated action potential; fewer available channels raise the depolarization the endplate potential must reach.
    evidence:
    - reference: PMID:42793010
      reference_title: "SCN4A Channelopathies: From Disease Mechanisms to Variant Interpretation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It is distributed throughout the sarcolemma and transverse-tubule system and is enriched at the neuromuscular junction, where it contributes to the safety margin that converts endplate depolarization into a propagating muscle action potential."
      explanation: Places Nav1.4 in the safety margin of neuromuscular transmission.
- name: Attenuated Muscle Fiber Action Potential
  biological_scale: CELLULAR
  description: >-
    With reduced sodium current the muscle action potential is smaller and
    propagates less reliably along the sarcolemma, so contraction is driven less
    effectively and fiber force falls. This is a permanent deficit, unlike the
    episodic depolarization block of the dominant periodic paralyses.

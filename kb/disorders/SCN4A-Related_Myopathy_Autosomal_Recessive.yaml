name: SCN4A-Related Myopathy, Autosomal Recessive
creation_date: "2026-11-13T04:30:00Z"
category: Mendelian
synonyms:
- SCN4A-related myopathy, autosomal recessive
- SCN4A-related congenital myopathy
- recessive SCN4A-related congenital myopathy
- congenital myopathy with severe fetal hypokinesia
- congenital myopathy with severe foetal hypokinesia
- congenital myopathy with "corona" fibers, selective muscle atrophy, and craniosynostosis
- myopathy with ptosis and mild dystrophic pattern
description: >-
  Autosomal recessive skeletal muscle disorder caused by biallelic
  loss-of-function variants in SCN4A, which encodes Nav1.4, the voltage-gated
  sodium channel that generates and propagates the skeletal muscle action
  potential. Reduced sodium current attenuates the muscle fiber action potential
  below the level needed for normal force generation, and at the endplate it
  erodes the safety margin of neuromuscular transmission. The clinical spectrum
  runs from severe fetal hypokinesia with polyhydramnios, hydrops, contractures,
  pulmonary hypoplasia and death in utero or in the neonatal period (usually two
  null alleles, or a null allele with a partial loss-of-function allele), through
  a "classical" congenital myopathy with neonatal hypotonia, facial, neck and
  axial weakness, respiratory and swallowing insufficiency that tends to improve
  in childhood, to a congenital myasthenic syndrome (CMS16) with fatigable and
  episodic weakness caused by missense variants that enhance channel
  inactivation. Heterozygous carriers are unaffected. ClinGen lumps all of these
  recessive presentations into one disease entity. The recessive loss-of-function
  disease is distinct from the dominant gain-of-function SCN4A channelopathies
  (sodium channel myotonia, paramyotonia congenita, hyperkalemic and hypokalemic
  periodic paralysis), which present later with episodic stiffness or paralysis
  rather than congenital permanent weakness.

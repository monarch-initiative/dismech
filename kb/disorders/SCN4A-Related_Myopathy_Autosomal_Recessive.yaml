pathophysiology:
- name: Nav1.4 Sodium Channel Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SCN4A variants reduce the sodium current carried by Nav1.4. Null
    alleles (nonsense, frameshift, essential splice and some missense, such as
    p.R104H, p.P382T and p.C1209F) abolish current; partial alleles reduce current
    amplitude or shift activation to more depolarized voltages; myasthenic
    alleles enhance fast inactivation or slow recovery from it, so fewer
    channels are available, especially during repetitive firing. In the null
    mouse the fetal isoform Nav1.5 does not compensate.
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:

    snippet: "Including our proband, a total of 27 individuals from 18 families with SCN4A-associated myasthenic syndrome and myopathy have been reported as of February 2023"
    explanation: Literature case count.
animal_models:
- name: Scn4a exon 12 null mouse
  species: Mouse
  genotype: Scn4a exon 12 deletion (null allele), heterozygous and homozygous
  description: >-
    Homozygous null mice die by the second postnatal day, paralleling perinatal
    lethality of human biallelic null alleles. Heterozygotes have half the
    sodium current, a right-shifted force-stimulus relation and latent myasthenia
    under high-frequency stimulation, but no periodic paralysis.
  publication: PMID:27048647
  evidence:
  - reference: PMID:27048647
    reference_title: "Mice with an NaV1.4 sodium channel null allele have latent myasthenia, without susceptibility to periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To better define the functional consequences for a loss-of-function, we generated NaV1.4 null mice by deletion of exon 12."
    explanation: Establishes the Nav1.4 null mouse.
  modeled_mechanisms:
  - target: Reduced Skeletal Muscle Force Generation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Homozygous null mice die within two days of birth.
    limitations: >-
      Only the complete null genotype is modelled; the null-plus-partial
      genotypes that allow human survival, and fetal features such as hydrops
      and contractures, were not reported.
    evidence:
    - reference: PMID:27048647
      reference_title: "Mice with an NaV1.4 sodium channel null allele have latent myasthenia, without susceptibility to periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice null for NaV1.4 did not survive beyond the second postnatal day."
      explanation: Early postnatal lethality of the null genotype.
  - target: Loss of Endplate Safety Factor for Action Potential Initiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygous mice show myasthenia-like failure only under high-frequency stimulation.
    limitations: >-
      The phenotype is in heterozygotes, which in humans are unaffected, so it
      shows how sensitive the safety factor is to Nav1.4 dosage rather than
      reproducing the human recessive disease.
    evidence:
    - reference: PMID:27048647
      reference_title: "Mice with an NaV1.4 sodium channel null allele have latent myasthenia, without susceptibility to periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous null mice have latent myasthenia and a right shift of the force-stimulus relation, without evidence of periodic paralysis."
      explanation: Latent myasthenia with halved Nav1.4.
differential_diagnoses:
- name: Hyperkalemic periodic paralysis
  disease_term:
    preferred_term: hyperkalemic periodic paralysis
    term:
      id: MONDO:0008224
      label: hyperkalemic periodic paralysis
  description: >-
    Allelic dominant SCN4A disorder caused by gain-of-function variants, with
    episodic weakness and often myotonia; curated in
    kb/disorders/Hyperkalemic_Periodic_Paralysis.yaml.
  distinguishing_features:
  - Dominant inheritance and gain of function rather than biallelic loss of function.
  - Episodic weakness of later onset, with myotonia, rather than congenital permanent weakness.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In stark contrast to other sodium channelopathies, the congenital myopathy cohort members had in utero - or neonatal-onset permanent muscle weakness, rather than later-onset episodic muscle weakness."
    explanation: Contrasts the recessive disease with the dominant channelopathies.
- name: Hypokalemic periodic paralysis
  disease_term:
    preferred_term: hypokalemic periodic paralysis
    term:
      id: MONDO:0008223
      label: hypokalemic periodic paralysis
  description: >-
    Dominant CACNA1S or SCN4A (type 2) disease caused by gating-pore currents,
    with hypokalemic attacks; curated in
    kb/disorders/Hypokalemic_Periodic_Paralysis.yaml. A homozygous SCN4A
    p.R1135C form of hypokalemic periodic paralysis is described, and the same
    allele occurred in trans to a null allele in a congenital myopathy patient.
  distinguishing_features:
  - Attacks accompany low serum potassium.
  - Onset in childhood or adolescence, without congenital weakness.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dominant SCN4A gain-of-function mutations are a well-established cause of myotonia and periodic paralysis."
    explanation: Places periodic paralysis among the dominant gain-of-function SCN4A diseases.
- name: Paramyotonia congenita
  disease_term:
    preferred_term: paramyotonia congenita of Von Eulenburg
    term:
      id: MONDO:0008195
      label: paramyotonia congenita of Von Eulenburg
  description: Dominant gain-of-function SCN4A disorder with cold- and exercise-induced myotonia and weakness.
  distinguishing_features:
  - Clinical and electrical myotonia, absent in the recessive disease.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiology suggested a myopathic process, without myotonia."
    explanation: Absence of myotonia separates the recessive disease from the myotonic SCN4A disorders.
- name: Other congenital myasthenic syndromes
  disease_term:
    preferred_term: congenital myasthenic syndrome
    term:
      id: MONDO:0018940
      label: congenital myasthenic syndrome
  description: >-
    Endplate disorders of acetylcholine release, acetylcholinesterase or receptor
    function, curated in kb/disorders/Congenital_Myasthenic_Syndrome.yaml. In
    SCN4A-CMS endplate potentials are normal and fail only to trigger the muscle
    action potential, and pyridostigmine has not helped.
  distinguishing_features:
  - Normal quantal release, receptor kinetics and endplate ultrastructure on in vitro endplate studies.
  - Poor response to pyridostigmine.
  evidence:
  - reference: PMID:12766226
    reference_title: Myasthenic syndrome caused by mutation of the SCN4A sodium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intercostal muscle studies revealed no abnormality of the resting membrane potential, evoked quantal release, synaptic potentials, acetylcholine receptor channel kinetics, or endplate ultrastructure, but endplate potentials depolarizing the resting potential to -40 mV failed to excite action potentials."
    explanation: Distinguishes the SCN4A mechanism from presynaptic, synaptic and acetylcholine receptor CMS.
discussions:
- discussion_id: childhood_improvement_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#CM22A
  - pathophysiology#Reduced Skeletal Muscle Force Generation
  prompt: >-
    Why do survivors of recessive SCN4A myopathy improve through childhood, and
    why do some later deteriorate in adolescence or adulthood?
  rationale: >-
    The channel defect is constitutive, yet strength, feeding and breathing
    improve in early childhood, and at least three patients then worsened
    stepwise in adolescence or adulthood. Candidate explanations named in the
    literature (residual allele function, compensation by other ion channels,
    developmental change in channel expression, epigenetic or environmental
    factors) have not been tested, and no animal model with a survivable
    genotype exists in which to test them.
  evidence:
  - reference: PMID:38187266
    reference_title: "SCN4A-related congenital myopathy in a Han Chinese patient: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is uncertain the exact mechanism underlying this pattern of disease progression, and whether the residual function in the mutant SCN4A alleles, other genetic factors e.g. compensatory mechanisms from other ion channels, epigenetic mechanisms or environmental factors play a role."
    explanation: States that the mechanism of the improving and later progressive course is unknown.
- discussion_id: genotype_severity_correlation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#SCN4A
  - has_subtypes#CM22B
  prompt: >-
    How well does residual Nav1.4 current predict whether a genotype is lethal,
    myopathic or myasthenic?
  rationale: >-
    Two complete null alleles were lethal, but some null plus partial
    loss-of-function genotypes were also lethal while a sibling with the same
    genotype survived, and one allele (p.H1782Qfs65) showed no loss of function
    in HEK293 cells. Severity tracks residual current only loosely, which matters
    for prenatal counseling and for interpreting new missense variants.
  evidence:
  - reference: PMID:26700687
    reference_title: "Loss-of-function mutations in SCN4A cause severe foetal hypokinesia or 'classical' congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further studies in a large cohort of patients are required to delineate more precise correlation of functional and clinical expression of SCN4A mutations."
    explanation: The defining cohort states that genotype-function-severity correlation is unresolved.
notes: >-
  Scope follows ClinGen, which lumped every autosomal recessive SCN4A
  presentation (congenital myasthenic syndrome, fetal hypokinesia and congenital
  myopathy) into this one entity because molecular mechanism, inheritance and
  phenotypic variability did not differ. The three OMIM/MONDO presentations are
  therefore has_subtypes rows: CMS16 (MONDO:0013620, a MONDO child of this term),
  and CM22A and CM22B (MONDO:0957247, MONDO:0957265), which MONDO currently files
  under congenital myopathy but not under MONDO:0100121. The name keeps the MONDO
  and ClinGen label rather than "SCN4A-Related Congenital Myopathy", which is
  used in the literature but would read as excluding the myasthenic
  presentation. No GeneReviews chapter is specific to the recessive disease.
  The GeneReviews hyperkalemic and hypokalemic periodic paralysis chapters
  (PMID:20301669, PMID:20301512) cover only the dominant SCN4A disorders, and the
  Congenital Myasthenic Syndromes Overview (PMID:20301347) names SCN4A but is an
  Overview-format chapter whose abstract has no clinical characteristics to use
  as a baseline, so the phenotype baseline here is the Zaharieva 2016 cohort
  (PMID:26700687) and the 2023 literature review in PMID:38187266. Treatment evidence is limited to single-patient reports and none of
  the agents tried is consistently effective. Severity appears to track residual
  channel function (two null alleles lethal; a null allele with a partial allele
  survivable), but siblings with the same genotype have differed in outcome, so
  genotype does not fully predict severity. The dominant SCN4A gain-of-function
  diseases are separate entries: Hyperkalemic_Periodic_Paralysis,
  Hypokalemic_Periodic_Paralysis, and the sodium channel myotonias described
  within Thomsen_and_Becker_disease. Perinatal death is described on the
  CM22B subtype and the pulmonary hypoplasia phenotype rather than as its own
  phenotype, because HP:0003811 (Neonatal death) is outside the HPO
  phenotypic-abnormality branch that the phenotype term enum admits.

- name: Loss of Endplate Safety Factor for Action Potential Initiation
  biological_scale: CELLULAR
  description: >-
    Endplate potentials of normal size fail to trigger muscle action potentials
    because too few Nav1.4 channels are available at the endplate, a postsynaptic
    defect that leaves quantal release, acetylcholine receptor function and
    endplate structure intact. Enhanced use-dependent inactivation makes the
    failure worse during repetitive firing, which gives activity-dependent
    fatigability and a decremental response at higher stimulation rates. This is
    the main mechanism of the CMS16 presentation but is also seen in some
    myopathic patients.
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: DECREASED
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  evidence:
  - reference: PMID:12766226
    reference_title: Myasthenic syndrome caused by mutation of the SCN4A sodium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intercostal muscle studies revealed no abnormality of the resting membrane potential, evoked quantal release, synaptic potentials, acetylcholine receptor channel kinetics, or endplate ultrastructure, but endplate potentials depolarizing the resting potential to -40 mV failed to excite action potentials."
    explanation: Microelectrode studies of patient muscle show the endplate potential fails to trigger an action potential while the other endplate components are normal.
  - reference: PMID:25707578
    reference_title: Defective fast inactivation recovery of Nav 1.4 in congenital myasthenic syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The resulting enhancement in its use dependence reduces channel availability, which explains the patient's muscle fatigability."
    explanation: Channel recordings of R1457H explain fatigability through use-dependent loss of availability.
  - reference: PMID:27048647
    reference_title: "Mice with an NaV1.4 sodium channel null allele have latent myasthenia, without susceptibility to periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with a propensity for pseudo-myasthenia caused by a marginal Na(+) current density to support sustained high-frequency action potentials in muscle"
    explanation: Halved sodium current produces a myasthenia-like failure at high firing rates in mice.
  downstream:
  - target: Fatigable Weakness
    causal_link_type: DIRECT
    description: Transmission fails at a growing fraction of endplates during sustained activity.
  - target: Decremental Response on Repetitive Nerve Stimulation
    causal_link_type: DIRECT
    description: Failure at individual endplates during a train reduces the compound muscle action potential.
  - target: Episodic Severe Weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attacks of severe weakness resembling periodic paralysis occur in some
      patients; the triggers and why channel availability falls further during
      attacks are not established.

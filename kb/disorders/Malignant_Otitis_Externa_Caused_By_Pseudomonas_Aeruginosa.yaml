    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although elderly patients with diabetes remain the population most
      commonly affected, immunosuppressed individuals (eg, from HIV infection,
      chemotherapy, etc) are also susceptible to malignant external otitis.
    explanation: >-
      Identifies the main diabetic and immunosuppressed host groups predisposed
      to malignant external otitis.
  influences_mechanisms:

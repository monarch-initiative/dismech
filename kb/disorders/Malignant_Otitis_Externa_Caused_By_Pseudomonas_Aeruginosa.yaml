prevalence:
- population: Hospital-admitted malignant external otitis cases in Spain, 2008-2013
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.13
  rate_low: 0.117
  rate_high: 0.144
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Spain's minimum basic data set identified 355 malignant external otitis cases
    in 2008-2013 and estimated incidence at 1.30 cases per million inhabitants
    per year, with male predominance, diabetes in 74.6% of patients, and 3.7%
    gross in-hospital mortality.
  evidence:
  - reference: PMID:27241559
    reference_title: Malignant external otitis in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The incidence rate was 1.30 (95% CI, 1.17 to 1.44) per 106 inhabitants and
      year, although there were variations among geographical areas.
    explanation: >-
      Reports the annual incidence estimate from a national Spanish hospital
      dataset.
- population: Necrotizing otitis externa Hospital Episode Statistics in England, 2002-2017
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    England's Hospital Episode Statistics recorded 7,327 necrotizing otitis
    externa cases over 16 years; annual recorded cases increased by 1,142% from
    123 in 2002 to 1,405 in 2017, reflecting a marked coded-incidence rise rather
    than a denominator-based disease rate.
  evidence:
  - reference: PMID:35000633
    reference_title: >-
      Exploring theories for the exponential 16-year rise in incidence of
      necrotising otitis externa in England.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Annual necrotising otitis externa incidence increased 1142 per cent within
      the 16-year period, from 123 recorded cases in 2002 to 1405 cases in 2017.
    explanation: >-
      Quantifies the increase in annual English Hospital Episode Statistics
      records.

progression:
- phase: Skull-base extension and cranial neuropathy
  notes: >-
    Delayed treatment, visible clinical bone lysis, poorly controlled diabetes,
    skull-base extension, and cranial nerve involvement separate extensive or
    poor-outcome disease from localized external-canal infection.
  evidence:
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Delayed treatment of OEN, identification of clinical bone lysis, especially
      when the tympanic membrane is easily visualized, and the presence of
      unbalanced diabetes are potential risk factors for extension of OEN.
    explanation: >-
      Identifies risk factors for the extensive phase of necrotizing otitis
      externa.
  - reference: PMID:23558287
    reference_title: "Malignant otitis externa: an Asian perspective on treatment outcomes and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Clival involvement was associated with persistent disease (P = .002).
    explanation: >-
      Links clival skull-base extension to persistent disease after antimicrobial
      treatment.
- phase: Mortality risk in extensive or delayed disease
  notes: >-
    Modern antipseudomonal therapy lowered mortality from historical 50% rates to
    roughly 10-20%, but prognosis remains worse in older diabetic patients with
    facial palsy, a positive CT scan, extensive skull-base disease, or multiple
    poor-outcome predictors.
  evidence:
  - reference: PMID:27311346
    reference_title: "Malignant external otitis: Factors predicting patient outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall survival rate was 38% in 5years, with disease specific mortality
      14%. DM, facial nerve palsy, positive CT scan and age above 70 were found
      to correlate and predict disease-specific mortality.
    explanation: >-
      Reports disease-specific mortality and identifies independent poor-outcome
      predictors.
  - reference: PMID:12737420
    reference_title: "Malignant otitis externa: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      With aggressive treatment the mortality rate from this disease, which used
      to be 50% in the past has now been reduced to 10-20%.
    explanation: >-
      Summarizes the historical improvement in malignant otitis externa
      mortality with aggressive antipseudomonal treatment.
diagnosis:
- name: Clinical, inflammatory-marker, and cross-sectional imaging diagnosis
  description: >-
    Malignant external otitis is diagnosed from severe external-canal symptoms in
    a susceptible host together with inflammatory markers and CT, MRI, or nuclear
    imaging evidence of soft-tissue and bony extension.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of malignant external otitis is based on a combination of
      clinical findings, an increased erythrocyte sedimentation rate, and
      radiographic evidence of soft tissue with or without bone erosion in the
      external canal and infratemporal fossa.
    explanation: >-
      Describes the combined clinical, inflammatory-marker and radiographic basis
      for diagnosis.
- name: CT/MRI with SPECT and gallium follow-up
  description: >-
    CT and MRI define bony and soft-tissue extension; SPECT bone imaging supports
    initial diagnosis, while gallium scintigraphy can track therapeutic response
    and recurrence when structural abnormalities lag behind clinical cure.
  evidence:
  - reference: PMID:15807974
    reference_title: Radiological and radionuclide investigation of malignant otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It is concluded that CT and/or MRI should be supported by routine SPECT
      bone imaging for initial diagnosis of malignant otitis externa. Routine
      SPECT bone imaging further supplemented by gallium scintigraphy should be
      the investigation of choice in the follow up of these cases for assessing
      response to treatment and disease recurrence.
    explanation: >-
      Supports CT/MRI plus SPECT for initial imaging and SPECT plus gallium
      scintigraphy for follow-up assessment.
- name: FDG PET-CT response monitoring
  description: >-
    FDG PET-CT can monitor treatment response and support antibiotic stop
    decisions when CT or MRI abnormalities lag behind infection control.
  evidence:
  - reference: PMID:41287134
    reference_title: >-
      Optimizing Necrotizing Otitis Externa Management: The Role of PET-CT in
      Antibiotic Stewardship.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients in the PET-CT cohort received significantly shorter oral
      ciprofloxacin courses (median: 8 vs. 40 wk, P <0.001) without increased
      relapse rates.
    explanation: >-
      Supports FDG PET-CT response assessment as an antibiotic-stewardship tool
      in necrotizing otitis externa and skull-base osteomyelitis.
treatments:
- name: Prolonged antipseudomonal pharmacotherapy
  description: >-
    Systemic antipseudomonal antibiotics suppress invasive P. aeruginosa in the
    canal, temporal bone, and skull base; regimens are prolonged and should be
    adjusted to culture results and resistance where available; ciprofloxacin
    resistance in skull-base osteomyelitis cohorts reinforces the need for
    culture-directed therapy rather than empiric quinolone monotherapy when
    resistant organisms are plausible.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
  target_mechanisms:
  - target: External auditory canal Pseudomonas invasion
    treatment_effect: INHIBITS

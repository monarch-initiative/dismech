- name: Aural water exposure and cerumen irrigation
  description: >-
    Water exposure in the external auditory canal, including irrigation for
    cerumen impaction, can introduce P. aeruginosa or disrupt local canal
    defenses and has been reported as an iatrogenic trigger for malignant
    external otitis.
  presence: PRESENT
  effect: HARMFUL
  influences_mechanisms:
  - target: External auditory canal Pseudomonas invasion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Aural water exposure acts at the initial external-canal invasion step by
      delivering a moist inoculation context to susceptible canal epithelium.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathophysiology is incompletely understood although aural water
      exposure (eg, irrigation for cerumen impaction) has been reported as a
      potential iatrogenic factor.
    explanation: >-
      Supports aural water exposure and ear-canal irrigation as reported local
      exposure factors for malignant external otitis.

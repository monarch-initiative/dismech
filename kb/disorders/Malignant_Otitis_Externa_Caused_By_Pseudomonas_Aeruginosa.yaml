name: Malignant otitis externa caused by Pseudomonas aeruginosa
creation_date: "2026-11-03T00:00:00Z"
description: >-
  Malignant otitis externa caused by Pseudomonas aeruginosa is an invasive
  infection in which P. aeruginosa colonizes the external acoustic meatus,
  breaches local epithelial defenses in an older or immunocompromised host,
  spreads through adjacent soft tissue and temporal-bone compartments, and can
  progress to skull-base osteomyelitis with facial or lower cranial nerve
  palsies.
category: Infectious Disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:14720566
      reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Malignant (necrotising) external otitis is an invasive infection of the
        external auditory canal.
      explanation: >-
        Places malignant external otitis in the infectious-disease class and
        locates the initial infection in the external auditory canal.
disease_term:
  preferred_term: malignant otitis externa caused by Pseudomonas aeruginosa
  term:
    id: MONDO:0041095
    label: malignant otitis externa caused by Pseudomonas aeruginosa
parents:
- Malignant otitis externa
- Pseudomonas aeruginosa infectious disease
synonyms:
- Pseudomonas aeruginosa malignant otitis externa
- Pseudomonas aeruginosa caused malignant otitis externa
- Pseudomonal malignant otitis externa
- Necrotizing otitis externa caused by Pseudomonas aeruginosa
notes: >-
  This entry is scoped to the MONDO child defined by Pseudomonas aeruginosa
  etiology. Fungal malignant otitis externa and necrotizing external otitis
  caused by Staphylococcus aureus or other bacteria should stay outside this
  pathogen-specific child unless a cited cohort explicitly reports P. aeruginosa.
infectious_agent:
- name: Pseudomonas aeruginosa
  description: >-
    Pseudomonas aeruginosa is the Gram-negative opportunist that defines this
    pathogen-specific subtype and is the dominant organism recovered from
    malignant external otitis aural drainage and culture-positive cohorts.
  infectious_agent_term:
    preferred_term: Pseudomonas aeruginosa
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Pseudomonas aeruginosa is isolated from the aural drainage in more than 90%
      of cases.
    explanation: >-
      Review-level summary identifying P. aeruginosa as the overwhelmingly
      common isolate in malignant external otitis.
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our population (n = 39) was male (74%), type 2 diabetic (72%), aged
      75.2 years and pseudomonas aeruginosa was found in 88% of cases.
    explanation: >-
      A French necrotizing otitis externa cohort recovered P. aeruginosa in most
      cases, supporting the organism as a common clinical agent.
agent_life_cycle:
  description: >-
    P. aeruginosa is an environmental and health-care-associated opportunist; in
    malignant otitis externa, human disease occurs when the organism reaches the
    external acoustic meatus and invades local tissue. No arthropod vector or
    obligate nonhuman host is required.
  hosts:
  - preferred_term: Homo sapiens
    role: clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The pathophysiology is incompletely understood although aural water
      exposure (eg, irrigation for cerumen impaction) has been reported as a
      potential iatrogenic factor.
    explanation: >-
      Supports local external-canal exposure rather than a vector-borne or
      zoonotic life cycle for this opportunistic P. aeruginosa infection.
transmission:
- name: Opportunistic external-canal invasion
  description: >-
    P. aeruginosa is not transmitted by a stereotyped person-to-person cycle in
    this disease. Susceptible people acquire malignant external otitis when the
    organism is introduced into the external auditory canal, after which it
    invades locally instead of remaining a superficial otitis externa.
  evidence:
  - reference: PMID:36897495
    reference_title: "Malignant External Otitis: What the Diabetes Specialist Should Know-A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      It is believed to originate from the external auditory meatus and advance
      regionally to the soft tissues and the bone, eventually involving the skull
      base.
    explanation: >-
      Describes the external-meatus origin and contiguous regional spread that
      define the acquisition route curated here.
environmental:
- name: Diabetes mellitus and immunocompromise
  description: >-
    Diabetes mellitus, older age, HIV infection, chemotherapy, and other
    immunocompromising states increase susceptibility to invasive external-canal
    P. aeruginosa infection.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Although elderly patients with diabetes remain the population most
      commonly affected, immunosuppressed individuals (eg, from HIV infection,
      chemotherapy, etc) are also susceptible to malignant external otitis.
    explanation: >-
      Identifies the main diabetic and immunosuppressed host groups predisposed
      to malignant external otitis.
  influences_mechanisms:
  - target: External auditory canal Pseudomonas invasion
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Diabetic or immunocompromised host tissue permits P. aeruginosa introduced
      into the external acoustic meatus to invade rather than stay confined to
      superficial canal inflammation.
    evidence:
    - reference: PMID:14720566
      reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Although elderly patients with diabetes remain the population most
        commonly affected, immunosuppressed individuals (eg, from HIV infection,
        chemotherapy, etc) are also susceptible to malignant external otitis.
      explanation: >-
        Identifies the main diabetic and immunosuppressed host groups
        predisposed to malignant external otitis.
    - reference: PMID:36897495
      reference_title: "Malignant External Otitis: What the Diabetes Specialist Should Know-A Narrative Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Pseudomonas aeruginosa and diabetes mellitus are factors commonly
        involved in the pathogenesis of MEO.
      explanation: >-
        Supports diabetes mellitus as a common host-pathogenesis factor in
        malignant external otitis.
pathophysiology:
- name: External auditory canal Pseudomonas invasion
  role: trigger
  biological_scale: TISSUE
  description: >-
    P. aeruginosa reaches the external acoustic meatus and establishes an
    invasive infection of the canal epithelium and adjacent soft tissue instead
    of a self-limited superficial otitis externa.
  locations:
  - preferred_term: external acoustic meatus
    term:
      id: UBERON:0001352
      label: external acoustic meatus
  downstream:
  - target: Regional skull-base soft-tissue and bone extension
    causal_link_type: DIRECT
    description: >-
      The external-canal infection advances regionally into adjacent soft tissue
      and skull-base bone.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Malignant (necrotising) external otitis is an invasive infection of the
      external auditory canal.
    explanation: >-
      Defines the disease as an invasive infection of the external auditory
      canal.
- name: Regional skull-base soft-tissue and bone extension
  role: process
  biological_scale: TISSUE
  description: >-
    Local infection extends from the canal to adjacent soft tissue and bone,
    producing skull-base osteomyelitis when it passes beyond the tympanic bone.
  locations:
  - preferred_term: basicranium
    term:
      id: UBERON:0002517
      label: basicranium
  downstream:
  - target: Cranial nerve foraminal involvement
    causal_link_type: DIRECT
    description: >-
      Subtemporal skull-base spread brings inflammation and osteomyelitis to the
      facial and lower cranial nerve foramina.
  evidence:
  - reference: PMID:36897495
    reference_title: "Malignant External Otitis: What the Diabetes Specialist Should Know-A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      It is believed to originate from the external auditory meatus and advance
      regionally to the soft tissues and the bone, eventually involving the skull
      base.
    explanation: >-
      Supports contiguous extension from the external auditory meatus into soft
      tissues, bone and skull base.
- name: Cranial nerve foraminal involvement
  role: outcome
  biological_scale: TISSUE
  description: >-
    Subtemporal skull-base infection can involve cranial nerves, most often the
    facial nerve, and marks a complicated extensive form of disease.
  downstream:
  - target: Facial palsy
    causal_link_type: DIRECT
    description: >-
      Facial-nerve involvement produces the facial palsy that predicts more
      complicated disease and worse outcomes in several cohorts.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      If untreated, cranial neuropathies (most commonly of the facial nerve) can
      develop due to subtemporal extension of the infection.
    explanation: >-
      Links subtemporal extension of malignant external otitis to cranial
      neuropathy and identifies the facial nerve as the commonest involved nerve.
phenotypes:
- name: Ear pain
  phenotype_term:
    preferred_term: Ear pain
    term:
      id: HP:0030766
      label: Ear pain
  frequency: VERY_FREQUENT
  description: >-
    Severe otalgia is the dominant presenting symptom and reflects inflammatory
    invasion of the external canal and adjacent tissues.
  evidence:
  - reference: PMID:27311346
    reference_title: "Malignant external otitis: Factors predicting patient outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common presenting symptoms were otalgia (89%), external ear canal
      edema (86%) and otorrhea (84%).
    explanation: >-
      A tertiary-care malignant external otitis cohort found otalgia in 89% of
      patients, the most common presenting symptom.
- name: Skull-base osteomyelitis
  phenotype_term:
    preferred_term: Osteomyelitis
    term:
      id: HP:0002754
      label: Osteomyelitis
  description: >-
    Infection can spread from the external canal into the temporal bone and skull
    base, producing osteomyelitis that drives extensive disease.
  evidence:
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      OEN was extensive if it was associated with vascular or neurological
      deficits, if nuclear imaging fixation and/or bone lysis extended beyond
      the tympanic bone.
    explanation: >-
      Defines extensive necrotizing otitis externa by neurological or vascular
      deficits and imaging evidence of fixation or bone lysis beyond the
      tympanic bone.
- name: Facial palsy
  phenotype_term:
    preferred_term: Facial palsy
    term:
      id: HP:0010628
      label: Facial palsy
  frequency: FREQUENT
  description: >-
    Facial nerve palsy develops when subtemporal or skull-base spread reaches the
    facial nerve and is a marker of complicated disease.
  evidence:
  - reference: PMID:32852248
    reference_title: "Facial nerve paralysis in malignant otitis externa: comparison of the clinical and paraclinical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 45 patients (32.4%) had facial paralysis.
    explanation: >-
      Quantifies facial paralysis at 32.4% in a 139-patient malignant otitis
      externa case-control study, supporting a frequent qualifier.
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      If untreated, cranial neuropathies (most commonly of the facial nerve) can
      develop due to subtemporal extension of the infection.
    explanation: >-
      Supports facial palsy as the commonest cranial neuropathy caused by
      subtemporal extension.
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Complications for 43% of patients were extensive fixation on nuclear
      imaging, for 21% of them the presence of extensive bone lysis, for 13% the
      appearance of facial palsy, for 5.3% the presence hypoglossal nerve palsy
      and for 2.5% the presence of thrombophlebitis or other nerves palsies.
    explanation: >-
      Quantifies facial palsy and lower-cranial-nerve complications in a
      necrotizing otitis externa cohort.
- name: Cranial nerve paralysis
  phenotype_term:
    preferred_term: Cranial nerve paralysis
    term:
      id: HP:0006824
      label: Cranial nerve paralysis
  description: >-
    Extensive skull-base disease can involve the facial, hypoglossal, or other
    cranial nerves.
  evidence:
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Complications for 43% of patients were extensive fixation on nuclear
      imaging, for 21% of them the presence of extensive bone lysis, for 13% the
      appearance of facial palsy, for 5.3% the presence hypoglossal nerve palsy
      and for 2.5% the presence of thrombophlebitis or other nerves palsies.
    explanation: >-
      Reports facial, hypoglossal, and other cranial nerve palsies among
      complications of necrotizing otitis externa.
progression:
- phase: Skull-base extension and cranial neuropathy
  notes: >-
    Delayed treatment, visible clinical bone lysis, poorly controlled diabetes,
    skull-base extension, and cranial nerve involvement separate extensive or
    poor-outcome disease from localized external-canal infection.
  evidence:
  - reference: PMID:38499694
    reference_title: Epidemiology and risk factors for extension of necrotizing otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Delayed treatment of OEN, identification of clinical bone lysis, especially
      when the tympanic membrane is easily visualized, and the presence of
      unbalanced diabetes are potential risk factors for extension of OEN.
    explanation: >-
      Identifies risk factors for the extensive phase of necrotizing otitis
      externa.
  - reference: PMID:23558287
    reference_title: "Malignant otitis externa: an Asian perspective on treatment outcomes and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Clival involvement was associated with persistent disease (P = .002).
    explanation: >-
      Links clival skull-base extension to persistent disease after antimicrobial
      treatment.
diagnosis:
- name: Clinical, inflammatory-marker, and cross-sectional imaging diagnosis
  description: >-
    Malignant external otitis is diagnosed from severe external-canal symptoms in
    a susceptible host together with inflammatory markers and CT, MRI, or nuclear
    imaging evidence of soft-tissue and bony extension.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The diagnosis of malignant external otitis is based on a combination of
      clinical findings, an increased erythrocyte sedimentation rate, and
      radiographic evidence of soft tissue with or without bone erosion in the
      external canal and infratemporal fossa.
    explanation: >-
      Describes the combined clinical, inflammatory-marker and radiographic basis
      for diagnosis.
- name: CT/MRI with SPECT and gallium follow-up
  description: >-
    CT and MRI define bony and soft-tissue extension; SPECT bone imaging supports
    initial diagnosis, while gallium scintigraphy can track therapeutic response
    and recurrence when structural abnormalities lag behind clinical cure.
  evidence:
  - reference: PMID:15807974
    reference_title: Radiological and radionuclide investigation of malignant otitis externa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It is concluded that CT and/or MRI should be supported by routine SPECT
      bone imaging for initial diagnosis of malignant otitis externa. Routine
      SPECT bone imaging further supplemented by gallium scintigraphy should be
      the investigation of choice in the follow up of these cases for assessing
      response to treatment and disease recurrence.
    explanation: >-
      Supports CT/MRI plus SPECT for initial imaging and SPECT plus gallium
      scintigraphy for follow-up assessment.
treatments:
- name: Prolonged antipseudomonal pharmacotherapy
  description: >-
    Systemic antipseudomonal antibiotics suppress invasive P. aeruginosa in the
    canal, temporal bone, and skull base; regimens are prolonged and should be
    adjusted to culture results and resistance where available.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: External auditory canal Pseudomonas invasion
    treatment_effect: INHIBITS
    description: >-
      Antipseudomonal agents inhibit viable P. aeruginosa in the invasive
      external-canal focus and contiguous skull-base infection.
  evidence:
  - reference: PMID:14720566
    reference_title: "The changing face of malignant (necrotising) external otitis: clinical, radiological, and anatomic correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Treatment consists of prolonged administration (6-8 weeks) of an
      antipseudomonal agent (typically an orally administered quinolone).
    explanation: >-
      Describes prolonged antipseudomonal therapy as the core treatment for
      malignant external otitis.
  - reference: PMID:23558287
    reference_title: "Malignant otitis externa: an Asian perspective on treatment outcomes and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combination therapy with intravenous ceftazidime and oral fluoroquinolone
      remains relevant despite concerns of culture-negative cases and
      multidrug-resistant Pseudomonas.
    explanation: >-
      Human malignant otitis externa outcomes data support combined intravenous
      ceftazidime and oral fluoroquinolone therapy as still relevant.
- name: Surgical debridement or mastoidectomy
  description: >-
    Surgical source control is reserved for people with failed conservative
    therapy, skull-base osteomyelitis complications, or disease progression
    despite medical management.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Regional skull-base soft-tissue and bone extension
    treatment_effect: INHIBITS
    description: >-
      Debridement or mastoidectomy removes infected and necrotic tissue when
      antimicrobial treatment alone has failed or complications have developed.
  evidence:
  - reference: PMID:39828789
    reference_title: "Surgical consideration and practical difficulty in malignant otitis externa: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Surgery was primarily performed due to failed conservative treatments,
      complications like skull base osteomyelitis, and disease progression.
    explanation: >-
      Systematic review of surgical malignant otitis externa literature
      identifies refractory therapy, skull-base osteomyelitis complications, and
      disease progression as the main indications for surgery.

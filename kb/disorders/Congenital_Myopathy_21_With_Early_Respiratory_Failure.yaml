notes: >-
  No prevalence estimate exists; about a dozen affected individuals from
  roughly ten families were reported through 2025. MONDO places this term
  among the congenital myopathies although onset extends into the fifth
  decade. The dominant DNAJB4 p.(Phe90Leu) distal myopathy (PMID:36512060) is
  a distinct allelic disorder. Frontal atrophy and a thin corpus callosum were
  each seen in one patient and are not annotated because their relation to
  DNAJB4 is uncertain. Death in childhood is recorded in the respiratory
  failure phenotype description because HP:0003819 lies outside the
  phenotypic-abnormality branch that the phenotype slot accepts.

      reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "DNAJB4 knockout mice had muscle weakness and fiber atrophy with prominent diaphragm involvement and kyphosis."
      explanation: Phenotype of the knockout.
  - target: Z-Disc Protein and Chaperone Accumulation

name: Congenital Myopathy 21 With Early Respiratory Failure
creation_date: "2026-10-15T12:30:00Z"
category: Mendelian
synonyms:
- CMYO21
- recessive DNAJB4 myopathy
- DNAJB4-related myopathy with early respiratory failure
description: >-
  Autosomal recessive protein-aggregate myopathy caused by biallelic
  loss-of-function variants in DNAJB4, which encodes an HSP40 (J-domain)
  co-chaperone that localizes to the sarcomeric Z-disc and recruits client
  proteins to HSP70. The defining picture is disproportionate diaphragmatic
  weakness with hypercapnic respiratory failure requiring ventilation, together
  with axial involvement (rigid spine, neck stiffness), often with little limb
  weakness. Onset ranges from infancy to the fifth decade. An infantile form,
  enriched for J-domain missense alleles, begins with neck stiffness and
  progresses to rigid spine, scoliosis, contractures, dysphagia and often death
  before adulthood; an adult form presents with abrupt respiratory failure.
  Muscle biopsy shows a myopathy with fiber size variation, angular fibers,
  protein inclusions and occasional rimmed vacuoles, and thigh MRI shows
  selective involvement of the semitendinosus and biceps femoris. Hypertrophic
  cardiomyopathy or mitral insufficiency occurs in a minority.

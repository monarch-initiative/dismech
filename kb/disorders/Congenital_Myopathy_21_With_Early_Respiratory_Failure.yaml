genetic:
- name: DNAJB4
  gene_term:
    preferred_term: DNAJB4
    term:
      id: hgnc:14886
      label: DNAJB4
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported biallelic alleles (NM_007034.5), all homozygous: J-domain
    missense c.74G>A p.(Arg25Gln), c.105G>C p.(Lys35Asn), c.181A>G
    p.(Arg61Gly); C-terminal missense c.785T>C p.(Leu262Ser); nonsense
    c.547C>T p.(Arg183*), c.775C>T p.(Arg259*), c.856A>T p.(Lys286*);
    frameshift c.308del p.(Gly103Glufs*25); an exon 2 deletion; and a
    whole-gene deletion. In a small cohort, J-domain missense alleles were
    associated with earlier onset (median 0.5 vs 28 years) and higher
    mortality (75% vs 14%). The heterozygous c.270T>A p.(Phe90Leu) variant in
    the G/F-rich domain causes a separate autosomal dominant distal myopathy
    with a proposed gain-of-function mechanism and is not part of this entry.
    The homozygous p.(Arg61Gly) family was first reported in an intellectual
    disability cohort (PMID:36344539); cognition was normal in the 2024
    cohort. No ClinGen gene-disease validity record for this pair was found in
    the local cache.
  evidence:
  - reference: PMID:36264506
    reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate a novel chaperonopathy associated with DNAJB4 causing a myopathy with early respiratory failure."
    explanation: Gene discovery report.
  - reference: PMID:39468638
    reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with other variants, the J-domain variants were associated with an earlier age of onset (0.5 vs. 28 years, P = 0.035) and a higher mortality rate (75% vs. 14%, P = 0.046)."
    explanation: Genotype-phenotype correlation in a small cohort.
  - reference: PMID:38127101
    reference_title: "Next-generation sequencing and comprehensive data reassessment in 263 adult patients with neuromuscular disorders: insights into the gray zone of molecular diagnoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, our case represents the first independent replication of autosomal recessive DNAJB4-related myopathy."
    explanation: Independent replication with homozygous c.308del.

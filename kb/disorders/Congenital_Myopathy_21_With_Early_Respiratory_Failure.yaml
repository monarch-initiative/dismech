- name: Dnajb4 knockout mouse
  species: Mus musculus
  genotype: Dnajb4-/-
  publication: PMID:36264506
  modeled_mechanisms:
  - target: Skeletal Muscle Fiber Atrophy and Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE

inheritance:
- name: Autosomal Recessive
  description: >-
    All reported affected individuals are homozygous for DNAJB4 variants; most
    families are consanguineous, and parents tested are unaffected
    heterozygotes.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36264506
    reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified four individuals from three unrelated families carrying an unreported homozygous stop gain (c.856A > T; p.Lys286Ter), or homozygous missense variants (c.74G > A; p.Arg25Gln and c.785 T > C; p.Leu262Ser) in DNAJB4."
    explanation: Homozygous variants in three unrelated families define the recessive disease.
  - reference: PMID:39468638
    reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five distinct pathogenic variants in DNAJB4 in five unrelated families of diverse ethnic backgrounds"
    explanation: Five further families; the abstract states that all patients were homozygous.
  - reference: PMID:39468638
    reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six of the patients were male, and one was female, with onset during the neonatal period and infancy. All the families were consanguineous"
    explanation: Consanguinity in all five families is consistent with recessive inheritance.
  - reference: PMID:40769870
    reference_title: "Homozygous DNAJB4 deletion revealing myopathy with acute respiratory failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both healthy parents exhibited the variant at the heterozygous state."
    explanation: Unaffected heterozygous parents of a homozygous whole-gene deletion case.
pathophysiology:
- name: DNAJB4 Protein Instability and Absence
  biological_scale: MOLECULAR
  description: >-
    Nonsense (p.Lys286Ter, p.Arg183Ter, p.Arg259Ter), frameshift
    (p.Gly103GlufsTer25), exon 2 and whole-gene deletion alleles, and the
    C-terminal missense p.Leu262Ser, produce DNAJB4 protein that is rapidly
    degraded or absent. DNAJB4 was absent from patient muscle and fibroblasts.
  genes:
  - preferred_term: DNAJB4
    term:
      id: hgnc:14886
      label: DNAJB4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:36264506
    reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAJB4 normally localizes to the Z-disc and was absent from muscle and fibroblasts of affected patients supporting a loss of function."
    explanation: Absence of DNAJB4 protein in patient tissue.
  - reference: PMID:36264506
    reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies confirmed that the p.Lys286Ter and p.Leu262Ser mutant proteins are rapidly degraded in cells."
    explanation: Cell-based stability assays for the truncating and C-terminal missense alleles.
  - reference: PMID:39468638
    reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with a loss of function, the nonsense variants presented decreased stability."
    explanation: Extends the instability finding to p.Arg183Ter and p.Arg259Ter.
  downstream:
  - target: Loss of DNAJB4 Co-chaperone Function
    causal_link_type: DIRECT
    description: No DNAJB4 protein remains to engage clients and HSP70.
    evidence:
    - reference: PMID:40696134
      reference_title: "Molecular genetics of J-domain protein-related chaperonopathies in skeletal muscle."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "These typically lead to diminished protein stability or the absence of functional DNAJB4 protein."
      explanation: Review synthesis of the recessive alleles as loss of functional protein.
- name: Dysfunctional J-Domain DNAJB4 Missense Proteins
  biological_scale: MOLECULAR
  description: >-
    The J-domain missense alleles p.Arg25Gln, p.Lys35Asn and p.Arg61Gly yield
    protein of normal or increased stability that still localizes to the
    Z-disc but fails yeast Sis1 complementation, TDP-43 disaggregation and
    protection from heat shock. The authors raise a possible toxic
    gain-of-function through altered HSP70 interaction for these alleles, which
    associate with earlier onset and higher mortality; this is not demonstrated.
  genes:
  - preferred_term: DNAJB4
    term:
      id: hgnc:14886
      label: DNAJB4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:36264506
    reference_title: "Loss of function variants in DNAJB4 cause a myopathy with early respiratory failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the p.Arg25Gln mutant protein is stable but failed to complement for DNAJB function in yeast, disaggregate client proteins or protect from heat shock-induced cell death consistent with its loss of function."
    explanation: Stable but nonfunctional J-domain allele.
  - reference: PMID:39468638
    reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the missense variants exhibited normal or increased stability but behaved as loss-of-function variants in yeast complementation and TDP-43 disaggregation assays."
    explanation: Same behaviour for p.Lys35Asn and p.Arg61Gly.
  downstream:
  - target: Loss of DNAJB4 Co-chaperone Function
    causal_link_type: DIRECT
    description: The J-domain is the HSP70-interacting module, so these proteins cannot drive client handling.
    evidence:
    - reference: PMID:39468638
      reference_title: "Genotype‒phenotype correlation in recessive DNAJB4 myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While loss-of-function variants presented decreased protein stability, J-domain variants maintained normal stability but were dysfunctional in TDP-43 disaggregation and yeast viability assays."
      explanation: Both allele classes converge on loss of chaperone activity.
- name: Loss of DNAJB4 Co-chaperone Function
  biological_scale: MOLECULAR
  description: >-
    DNAJB4 is a class B J-domain protein that binds client proteins at the
    Z-disc and recruits them to HSP70, stimulating its ATPase activity for
    folding, disaggregation or triage. Loss of DNAJB4 activity reduces this
    client handling; TDP-43 is the experimental client used in assays, and the
    disease-relevant muscle clients are not fully defined.

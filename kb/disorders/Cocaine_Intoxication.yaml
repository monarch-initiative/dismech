discussions:
- discussion_id: cocaine_beta_blocker_outcome_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the haemodynamic potentiation of cocaine-induced coronary vasoconstriction by
    beta blockade translate into worse clinical outcomes?
  attaches_to:
  - treatments#Beta-Adrenergic Blockade
  - pathophysiology#Alpha-Adrenergic Coronary Vasoconstriction
  rationale: >-
    The mechanism has been measured directly in humans and the outcome studies find no
    difference, but every outcome study is retrospective and the meta-analysis found no
    randomised trial meeting its criteria. Until one exists the contraindication rests on
    a physiological endpoint and the permission rests on observational data, which is why
    guidelines and practice have diverged.
- discussion_id: cocaine_seizure_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the molecular mechanism of cocaine-induced seizures, and does it differ from
    the mechanism of cocaine-induced hyperthermia?
  attaches_to:
  - pathophysiology#Central Neuronal Hyperexcitability
  rationale: >-
    The cited source states plainly that the aetiology of cocaine-associated seizures is
    unclear, which is why the edge into this node is typed UNKNOWN and the node asserts no
    molecular claim. A GABAergic or glutamatergic account is routinely offered for
    stimulant seizures but nothing cited here demonstrates one at the concentrations
    reached in human intoxication.
- discussion_id: cocaine_bche_severity_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does butyrylcholinesterase activity modify the severity of acute cocaine toxicity in
    humans?
  attaches_to:
  - pathophysiology#Systemic Cocaine Exposure
  rationale: >-
    Plasma butyrylcholinesterase hydrolyses most of a cocaine dose, so variation in its
    activity is a plausible determinant of how much drug reaches its targets. No genetic
    section is curated here because no source establishing that link in human intoxication
    was found during this curation; the gap is recorded rather than filled by inference.


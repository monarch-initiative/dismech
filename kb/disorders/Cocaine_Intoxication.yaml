treatments:
- name: Benzodiazepine Sedation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    First-line treatment, and the one that addresses the most upstream node the clinician
    can reach. Sedation damps the central stimulation arm, and by lowering blood pressure
    and cardiac output it reduces myocardial oxygen demand at the same time. One drug,
    both arms of the toxidrome.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Central Nervous System Stimulation
    treatment_effect: INHIBITS
  - target: Increased Myocardial Oxygen Demand
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:35448887
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Not only do benzodiazepines exert anxiolytic action, but they also attenuate toxic effects at the cardiovascular and cerebral level, by reducing both blood pressure and cardiac output, which makes them a key first approach in treating cocaine acute intoxications"
    explanation: >-
      States both target mechanisms this treatment is linked to and its first-line status.

- name: Sodium Bicarbonate for Sodium-Channel Blockade
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Given for a widened QRS. It works against the channel arm specifically, and it is the
    reason the QRS is diagnostically useful: a complex that narrows after bicarbonate was
    widened by sodium-channel blockade.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  target_mechanisms:
  - target: Slowed Ventricular Conduction
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:14677787
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immediately after administering NaHCO3, QRS duration decreased by 30% (p < 0.001), returning to baseline more quickly than in the control group."
      explanation: Direct measurement of the reversal of conduction slowing in a canine intoxication model.
  evidence:
  - reference: PMID:14677787
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NaHCO3 improved ECG changes secondary to cocaine toxicity and improved myocardial function."
    explanation: >-
      The study's overall conclusion. Note this is animal evidence: no randomised human
      trial of bicarbonate in cocaine toxicity exists.

- name: Phentolamine
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Alpha-adrenergic blockade, aimed squarely at the coronary vasoconstriction node. In the
    human catheterisation study it returned coronary flow, calibre and haemodynamics to
    baseline, which is both the therapeutic rationale and the proof that the constriction
    was alpha-mediated.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phentolamine
      term:
        id: CHEBI:8081
        label: phentolamine
  target_mechanisms:
  - target: Alpha-Adrenergic Coronary Vasoconstriction
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:2573838
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the administration of the alpha-adrenergic blocking agent phentolamine caused all these values to return to base-line levels"
      explanation: >-
        Reversal of every measured variable by alpha blockade, in humans, establishes both
        the target and the mechanism.

- name: Nitroglycerin
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Nitrovasodilation, acting downstream of the adrenergic receptor rather than at it. It
    abolished cocaine-induced constriction in both diseased and non-diseased coronary
    segments.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nitroglycerin
      term:
        id: CHEBI:28787
        label: nitroglycerin
  target_mechanisms:
  - target: Alpha-Adrenergic Coronary Vasoconstriction
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:1906905
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sublingual nitroglycerin abolished the vasoconstriction in both non-diseased and diseased segments."
      explanation: Quantitative arteriographic demonstration of reversal in humans.

- name: Beta-Adrenergic Blockade
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Curated as a contested treatment, not a recommended one. The mechanistic case against
    it is that blocking beta receptors leaves alpha-mediated vasoconstriction unopposed,
    and this has been measured directly in humans: intracoronary propranolol after cocaine
    further reduced coronary flow and further raised coronary vascular resistance. The
    outcome case for it is that a meta-analysis of five studies and 1794 patients found no
    difference in infarction or mortality. Both are curated here, the first as SUPPORT for
    the mechanism and the second as REFUTE against the claim that the mechanism translates
    into harm. See the mechanistic_hypotheses block.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Alpha-Adrenergic Coronary Vasoconstriction
    treatment_effect: ACTIVATES
    description: >-
      Beta blockade increases, rather than reduces, this mechanism. ACTIVATES is the
      TreatmentEffectEnum value meaning "promotes or increases the mechanism"; the enum has
      no value for a treatment that worsens a lesion, and this is the accurate one.
    evidence:
    - reference: PMID:1971166
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cocaine-induced coronary vasoconstriction is potentiated by beta-adrenergic blockade."
      explanation: >-
        Randomised, double-blind, placebo-controlled catheterisation study measuring the
        potentiation directly, which is the edge this link asserts.
  evidence:
  - reference: PMID:1971166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beta-adrenergic blocking agents probably should be avoided in patients with cocaine-associated myocardial ischemia or infarction."
    explanation: The authors' own recommendation, which became the basis of guideline advice.
  - reference: PMID:4051280
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IV propranolol was used as the initial treatment for his hyperadrenergic state, resulting in a decrease in heart rate but a paroxsymal increase in blood pressure."
    explanation: >-
      The case report that first proposed unopposed alpha stimulation. The spelling
      "paroxsymal" is the source's own and is quoted unaltered.
  - reference: PMID:29921621
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "there was no significant difference in the rate of non-fatal myocardial infarction or all-cause mortality"
    explanation: >-
      Meta-analysis of five studies finding no outcome difference, which refutes the
      stronger claim that beta blockade causes clinical harm here.
  - reference: PMID:29921621
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the evidence supporting these recommendations are largely from animal studies, expert opinion and theoretical observations"
    explanation: >-
      The review's assessment of the evidence base behind the guideline prohibition, which
      bounds how strongly the contraindication can be stated.

- name: Antipsychotic Agents
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Recorded as a treatment that is described and not recommended. Antipsychotics are
    sometimes reached for in an agitated cocaine patient; they lower the seizure threshold
    and add to the arrhythmic burden of a drug already blocking two cardiac channels.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:35448887
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of antipsychotics to manage cocaine intoxications is questionable and potentially dangerous, as they may intensify the risk of cardiac dysrhythmias."
    explanation: >-
      Graded REFUTE because it argues against the intervention. The stated reason is the
      arrhythmia risk this entry models on the channel and arrhythmogenesis nodes.
mechanistic_hypotheses:
- hypothesis_group_id: unopposed_alpha_stimulation
  hypothesis_label: Beta blockade worsens cocaine cardiotoxicity through unopposed alpha stimulation
  status: ALTERNATIVE
  description: >-
    The proposition that giving a beta blocker during cocaine intoxication removes
    beta-mediated vasodilation and leaves alpha-mediated coronary vasoconstriction
    unopposed, worsening ischaemia. It is recorded as a hypothesis rather than as fact
    because the mechanistic and the outcome evidence point different ways and both are
    good.

    For: intracoronary propranolol given after cocaine in a randomised, double-blind,
    placebo-controlled catheterisation study further reduced coronary sinus blood flow and
    further raised coronary vascular resistance, in humans, measured directly
    (PMID:1971166). The effect is real and it is not small.

    Against: a meta-analysis of five studies and 1794 patients with cocaine-associated
    chest pain found no significant difference in non-fatal myocardial infarction or
    all-cause mortality between those who received a beta blocker and those who did not
    (PMID:29921621).

    These are not actually contradictory. One measures a physiological variable minutes
    after an intracoronary drug in a catheterisation laboratory; the other measures
    clinical outcomes in patients who mostly received oral beta blockers hours later. The
    open question is whether the measured haemodynamic effect is large enough, and
    sustained enough, to change outcomes. Note the outcome studies are all retrospective
    and none is randomised, which the meta-analysis itself lists first among its
    limitations.
  notes: >-
    Resolving this needs a randomised trial of beta blockade in cocaine-associated chest
    pain, which does not exist; the meta-analysis states it found none meeting its criteria.

environmental:
- name: Concurrent ethanol ingestion
  description: >-
    Taking cocaine with alcohol is not simply taking two drugs. Hepatic transesterification
    produces cocaethylene, a pharmacologically active metabolite with a longer half-life
    than cocaine, which is itself a slightly more potent hERG blocker than cocaine. So the
    combination changes what is in the blood, not just how much.
  exposure_term:
    preferred_term: exposure to ethanol
    term:
      id: ECTO:9000027
      label: exposure to ethanol
  influences_mechanisms:
  - target: hERG Potassium Channel Blockade
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Cocaethylene, formed only when ethanol is present, blocks hERG more potently than
      cocaine does.
    evidence:
    - reference: PMID:11561083
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we conclude that cocaethylene is slightly more potent than cocaine as a blocker of HERG"
      explanation: >-
        Direct comparison of cocaine and cocaethylene IC50 at the same channel in the same
        expression system.
  - target: Sympathetic Cardiovascular Stimulation
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21463066
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Within each route, the cocaine-ethanol combination produced greater increases in heart rate and rate-pressure product than cocaine alone."
      explanation: >-
        Measured in humans across three routes of administration, so the potentiation is
        not an artefact of one route.
  evidence:
  - reference: PMID:21463066
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ethanol alters the hepatic biotransformation of cocaine, resulting in transesterification to a novel active metabolite, cocaethylene."
    explanation: States the metabolic basis of the interaction.
  - reference: PMID:21463066
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The oral route (34% ± 20) was significantly greater than from the smoked route (18% ± 11)"
    explanation: >-
      Quantifies how much of a cocaine dose becomes cocaethylene and shows it depends on
      route, which bounds how strongly the interaction applies to any given exposure.

- name: Cocaine exposure
  description: >-
    The exposure itself. Route matters for onset and for the fraction converted to
    cocaethylene when ethanol is present, but all routes converge on the same systemic node.
  exposure_term:
    preferred_term: exposure to cocaine
    term:
      id: ECTO:9000265
      label: exposure to cocaine
  influences_mechanisms:
  - target: Systemic Cocaine Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10351966
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The elevated risk rapidly decreased thereafter."
      explanation: >-
        The rapid decay of risk after exposure establishes that the systemic drug burden,
        not a persistent state, is what initiates the acute syndrome.

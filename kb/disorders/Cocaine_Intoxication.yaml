    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results demonstrate gene-gene-drug interaction affecting risk of fatal cocaine intoxication."
    explanation: >-
      Same analysis, cited for the DRD2 side of the interaction.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Cocaine is involved in roughly a fifth of US drug overdose deaths, and acute
    intoxication kills through mechanisms that act within minutes to an hour of exposure:
    ventricular arrhythmia, myocardial infarction, aortic dissection. The figure that
    matters mechanistically is the second one below. Nearly three quarters of
    cocaine-involved deaths also involve an opioid, so most fatal cocaine exposures are
    not pure cocaine toxicity, and cocaine-attributable mortality cannot be read off these
    totals.
  evidence:
  - reference: PMID:31048676
    reference_title: Drug Overdose Deaths Involving Cocaine and Psychostimulants with Abuse Potential - United States, 2003-2017.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among all 2017 drug overdose deaths, 13,942 (19.8%) involved cocaine"
    explanation: National vital statistics surveillance of cocaine-involved overdose deaths.
  - reference: PMID:31048676
    reference_title: Drug Overdose Deaths Involving Cocaine and Psychostimulants with Abuse Potential - United States, 2003-2017.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly three fourths (72.7%) of cocaine-involved deaths in 2017 also involved opioids."
    explanation: >-
      Bounds every mortality claim in this entry: most cocaine-involved deaths are
      polysubstance.

discussions:
- discussion_id: cocaine_beta_blocker_outcome_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the haemodynamic potentiation of cocaine-induced coronary vasoconstriction by
    beta blockade translate into worse clinical outcomes?
  attaches_to:
  - treatments#Beta-Adrenergic Blockade
  - pathophysiology#Alpha-Adrenergic Coronary Vasoconstriction
  rationale: >-
    The mechanism has been measured directly in humans and the outcome studies find no
    difference, but every outcome study is retrospective and the meta-analysis found no
    randomised trial meeting its criteria. Until one exists the contraindication rests on
    a physiological endpoint and the permission rests on observational data, which is why
    guidelines and practice have diverged.
- discussion_id: cocaine_seizure_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the molecular mechanism of cocaine-induced seizures, and does it differ from
    the mechanism of cocaine-induced hyperthermia?
  attaches_to:
  - pathophysiology#Central Neuronal Hyperexcitability
  rationale: >-
    The cited source states plainly that the aetiology of cocaine-associated seizures is
    unclear, which is why the edge into this node is typed UNKNOWN and the node asserts no
    molecular claim. A GABAergic or glutamatergic account is routinely offered for
    stimulant seizures but nothing cited here demonstrates one at the concentrations
    reached in human intoxication.
- discussion_id: cocaine_bche_severity_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does butyrylcholinesterase activity modify the severity of acute cocaine toxicity in
    humans?
  attaches_to:
  - pathophysiology#Systemic Cocaine Exposure
  rationale: >-
    Plasma butyrylcholinesterase hydrolyses most of a cocaine dose, so variation in its
    activity is a plausible determinant of how much drug reaches its targets. This gap is
    specifically about BCHE: no source establishing a BCHE-severity link in human
    intoxication was found during this curation. It is not a claim that cocaine toxicity
    has no genetic modifiers - the genetic section curates a DAT-DRD2 interaction affecting
    risk of fatal intoxication (PMID:23340505), and PMID:24312228 on BCHE variants, which is
    cached here, is about dependence rather than acute toxicity.


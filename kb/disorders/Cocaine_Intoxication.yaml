name: Cocaine Intoxication
creation_date: "2026-09-21T01:30:00Z"
category: Toxic Exposure Disorder
description: >-
  Acute systemic toxicity following cocaine exposure. Cocaine is pharmacologically two
  drugs in one molecule, and acute intoxication is what happens when both act at once. It
  is a monoamine reuptake inhibitor, blocking the dopamine, noradrenaline and serotonin
  transporters and flooding synapses with catecholamines; and it is a local anaesthetic,
  blocking the cardiac fast sodium channel in the same way a class I antiarrhythmic does.
  That combination is what distinguishes it from the stimulants and the local anaesthetics
  the KB curates alongside it.
  The two arms collide in the heart: sympathetic drive raises myocardial oxygen demand
  while alpha-adrenergic coronary vasoconstriction and platelet activation cut supply,
  and the channel arm independently slows conduction and delays repolarisation, so the
  ischaemic myocardium is also electrically unstable. Outside the heart the catecholamine
  arm produces agitation, seizures, hyperthermia through impaired heat dissipation,
  rhabdomyolysis, and cerebral and aortic vascular injury.
disease_term:
  preferred_term: cocaine intoxication
  term:
    id: MONDO:0019544
    label: cocaine intoxication
synonyms:
- Acute cocaine toxicity
- Cocaine overdose
- Cocaine poisoning
parents:
- Toxic Exposure Disorder
categories:
- Toxic Exposure Disorder
- Cardiovascular Disorder
notes: >-
  Scope. This entry covers acute systemic toxicity from cocaine itself. Three things are
  deliberately outside it, each for a stated reason rather than by omission.

  (1) Cocaine use disorder. The KB already curates Opioid_Use_Disorder and
  Alcohol_Use_Disorder as chronic substance use disorders distinct from the acute and
  organ-specific consequences of the same substance, which are separate entries
  (Alcoholic_Liver_Disease, Fetal_Alcohol_Spectrum_Disorder, Acute_Alcohol_Sensitivity).
  Acute cocaine intoxication is the analogous split: it occurs in people with no use
  disorder, and MONDO codes it separately, under poisoning (MONDO:0019544) rather than
  under substance dependence. No cocaine use disorder entry exists yet; this entry does
  not attempt to be one and models no dependence, tolerance or withdrawal mechanism.

  (2) Levamisole-adulterated cocaine. Levamisole is a common cocaine adulterant that
  causes a p-ANCA-positive small-vessel vasculopathy with neutropenia (PMID:23269350,
  cited in references below). It is excluded here because it is a different molecule
  acting by a different, immune-mediated mechanism over days to weeks, not an effect of
  cocaine and not an acute intoxication syndrome. Bundling it would put two unrelated
  mechanistic claims in one entry. It is a candidate for its own entry.

  (3) Cocaine-associated cardiomyopathy and accelerated atherosclerosis are chronic
  structural sequelae of repeated intoxication rather than features of a single acute
  episode, and are not modelled.

  Hyperthermia binding. The Hyperthermia phenotype is bound to HP:0004370 Abnormality of
  temperature regulation rather than to HP:0001945 Fever, even though HPO lists
  "Hyperthermia" among Fever's other names and the deep-research report suggested
  HP:0001945. HP:0001945's own definition rejects that reading: it states that "The rise
  in temperature during fever is to be distinguished from that occurring during episodes
  of hyperthermia. Unlike fever, hyperthermia involves an unregulated rise in body
  temperature in which pyrogenic cytokines are not directly involved... It represents a
  failure of thermoregulatory homeostasis, in which there is uncontrolled heat
  production, inadequate heat dissipation, or defective hypothalamic thermoregulation."
  Inadequate heat dissipation is precisely what the cited human trial (PMID:12044126)
  demonstrates for cocaine, so binding Fever would assert the mechanism that source
  excludes. HP:0004370 is the parent of Fever and is not in the schema's 56-term coarse
  phenotype set, so no coarse_binding_basis applies. HPO has no term for non-febrile
  hyperthermia; preferred_term carries the specificity the binding loses.

  Crack lung and mesenteric ischaemia are absent. Inhalational alveolar injury ("crack
  lung", PMID:2382909, listed under references) is specific to the smoked freebase route
  and is a direct local injury at the alveolar surface rather than a consequence of the
  systemic exposure node every other branch descends from; modelling it would need a second
  root with a different exposure route. Mesenteric ischaemia is the same adrenergic
  vasoconstriction mechanism already modelled for the coronary and cerebral beds, applied
  to a third bed, and was left out only because no quotable source for it was verified
  during this curation. Both are candidates for a follow-up pass rather than scope
  exclusions.

  No diagnosis, prevalence, biochemical, datasets or animal_models sections are curated.
  The canine sodium-bicarbonate study (PMID:14677787) is cited as evidence but not curated
  as an AnimalModel with modeled_mechanisms, which would make its fidelity and limitations
  explicit; that is the most worthwhile of these to add next.

  GeneReviews. `just check-genereviews` returns NO_CHAPTER: no GeneReviews chapter names
  this disease, which is expected for a poisoning rather than a Mendelian disorder, so no
  chapter baseline applies. The StatPearls line also returns NO_CHAPTER against this
  entry's name; StatPearls is never a phenotype baseline in any case.

  Evidence not used. PMID:18347214, the American Heart Association scientific statement
  on cocaine-associated chest pain, is the authoritative management source and is listed
  under references, but its cached record carries no abstract body, so no snippet can be
  taken from it and no claim here rests on it.
pathophysiology:
- name: Systemic Cocaine Exposure
  biological_scale: ORGANISM
  description: >-
    Absorbed cocaine distributes systemically and reaches concentrations at which it
    engages two independent pharmacological targets simultaneously: the presynaptic
    monoamine transporters and the voltage-gated ion channels of the cardiac myocyte
    membrane. Every downstream branch of this entry originates here.
  chemical_entities:
  - preferred_term: cocaine
    term:
      id: CHEBI:27958
      label: cocaine
  downstream:
  - target: Monoamine Transporter Blockade
    causal_link_type: DIRECT
    description: Cocaine binds the presynaptic monoamine transporters directly.
    evidence:
    - reference: PMID:18568020
      reference_title: The binding sites for cocaine and dopamine in the dopamine transporter overlap.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data demonstrate the molecular basis for the competitive inhibition of dopamine transport by cocaine."
      explanation: >-
        Establishes that cocaine itself occupies the transporter's substrate site, so the
        blockade is a direct action of the drug rather than a downstream consequence.
  - target: Cardiac Fast Sodium Channel Blockade
    causal_link_type: DIRECT
    description: >-
      The same molecule acts on the cardiac myocyte membrane as a local anaesthetic.
    evidence:
    - reference: PMID:18815938
      reference_title: Management of cocaine-induced cardiac arrhythmias due to cardiac ion channel dysfunction.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cocaine can produce arrhythmias either through the production of myocardial ischemia or as a direct result of ion channel alterations."
      explanation: >-
        Names the channel route as separate from the ischaemic route, which is the reason
        this entry models two arms off the exposure node rather than one chain.
  - target: hERG Potassium Channel Blockade
    causal_link_type: DIRECT
    description: Cocaine blocks the hERG-encoded repolarising potassium current.
    evidence:
    - reference: PMID:11561083
      reference_title: Effects of cocaine and its major metabolites on the HERG-encoded potassium channel.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cocaine blocked HERG-encoded potassium channels with an IC50 of 4.4 +/- 1.1 microM"
      explanation: >-
        Measures direct block of the hERG channel by cocaine in a heterologous expression
        system, establishing the potassium arm as a drug-channel interaction.

- name: Monoamine Transporter Blockade
  biological_scale: MOLECULAR
  description: >-
    Cocaine occupies a binding site deep within the dopamine transporter that overlaps the
    site used by dopamine itself, competitively inhibiting reuptake; the noradrenaline and
    serotonin transporters are blocked in parallel. This is the sympathomimetic arm.
  genes:
  - preferred_term: SLC6A3
    term:
      id: hgnc:11049
      label: SLC6A3
  - preferred_term: SLC6A2
    term:
      id: hgnc:11048
      label: SLC6A2
  - preferred_term: SLC6A4
    term:
      id: hgnc:11050
      label: SLC6A4
  molecular_functions:
  - preferred_term: dopamine transporter activity
    modifier: DECREASED
    term:
      id: GO:0005330
      label: dopamine:sodium symporter activity
  biological_processes:
  - preferred_term: presynaptic dopamine reuptake
    modifier: DECREASED
    term:
      id: GO:0051583
      label: dopamine uptake involved in synaptic transmission
  evidence:
  - reference: PMID:18568020
    reference_title: The binding sites for cocaine and dopamine in the dopamine transporter overlap.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Our models suggest that the binding site for cocaine and cocaine analogs is deeply buried between transmembrane segments 1, 3, 6 and 8, and overlaps with the binding sites for the substrates dopamine and amphetamine"
    explanation: >-
      Locates the cocaine site as overlapping the substrate site, which is what makes the
      inhibition competitive and dose-dependent.
  - reference: PMID:10485970
    reference_title: Dopamine-transporter occupancy after intravenous doses of cocaine and methylphenidate in mice and humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Recent studies using positron emission tomography (PET) have established the relationship between an intravenous dose of cocaine and the percentage occupancy of the dopamine transporter in humans, and have documented the requirement of more than 50% occupancy for perception of the \"high\""
    explanation: >-
      Records that transporter occupancy by cocaine has been measured directly in humans
      and is dose-related. The quoted sentence is the citing paper's background statement
      of human PET work, not a result of its own mouse experiments, which is why
      quote_role is BACKGROUND while evidence_source grades the human studies it describes.
  downstream:
  - target: Synaptic Catecholamine Excess
    causal_link_type: DIRECT
    description: >-
      Blocking reuptake leaves released catecholamines in the synaptic cleft and at
      peripheral sympathetic junctions.

- name: Synaptic Catecholamine Excess
  biological_scale: CELLULAR
  description: >-
    With reuptake blocked, dopamine, noradrenaline and serotonin accumulate at central and
    peripheral synapses. This single node is the origin of every non-cardiac-channel
    manifestation in the entry: the cardiovascular, neurological, thermoregulatory,
    muscular and cerebrovascular branches all descend from it.
  downstream:
  - target: Sympathetic Cardiovascular Stimulation
    causal_link_type: DIRECT
  - target: Alpha-Adrenergic Coronary Vasoconstriction
    causal_link_type: DIRECT
    description: >-
      Excess noradrenaline at vascular alpha-adrenergic receptors constricts the epicardial
      coronary arteries.
    evidence:
    - reference: PMID:2573838
      reference_title: Cocaine-induced coronary-artery vasoconstriction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these effects are mediated by alpha-adrenergic stimulation"
      explanation: >-
        The authors attribute the observed coronary vasoconstriction specifically to
        alpha-adrenergic stimulation, which is the adrenergic step this edge asserts.
  - target: Platelet Activation
    causal_link_type: DIRECT
  - target: Central Nervous System Stimulation
    causal_link_type: DIRECT
  - target: Impaired Thermoregulatory Heat Dissipation
    causal_link_type: DIRECT
  - target: Cerebral Vasoconstriction and Vascular Injury
    causal_link_type: DIRECT

- name: Sympathetic Cardiovascular Stimulation
  biological_scale: ORGANISM
  description: >-
    Catecholamine excess at cardiac and vascular adrenergic receptors raises heart rate,
    contractility and arterial pressure. The rate-pressure product rises, and with it
    myocardial oxygen consumption.
  evidence:
  - reference: PMID:2573838
    reference_title: Cocaine-induced coronary-artery vasoconstriction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After cocaine was administered, the heart rate and arterial pressure rose"
    explanation: >-
      Direct human measurement of the chronotropic and pressor response to a dose of
      cocaine at the low end of the range seen clinically.
  downstream:
  - target: Tachycardia
    causal_link_type: DIRECT
  - target: Hypertension
    causal_link_type: DIRECT
  - target: Increased Myocardial Oxygen Demand
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2573838
      reference_title: Cocaine-induced coronary-artery vasoconstriction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "despite an increase in myocardial oxygen demand"
      explanation: >-
        The same study measured the rise in myocardial oxygen demand alongside the fall in
        supply, which is the step this edge asserts.
  - target: Acute Aortic Wall Stress
    causal_link_type: DIRECT

- name: Alpha-Adrenergic Coronary Vasoconstriction
  biological_scale: TISSUE
  description: >-
    Cocaine narrows the epicardial coronary arteries and raises coronary vascular
    resistance through alpha-adrenergic stimulation. The effect is reversed by
    phentolamine and abolished by nitroglycerin, and it is markedly greater in segments
    already narrowed by atherosclerosis.
  cell_types:
  - preferred_term: smooth muscle cell of the coronary artery
    term:
      id: CL:0002592
      label: smooth muscle cell of the coronary artery
  biological_processes:
  - preferred_term: coronary vasoconstriction
    modifier: INCREASED
    term:
      id: GO:0042310
      label: vasoconstriction
  evidence:
  - reference: PMID:2573838
    reference_title: Cocaine-induced coronary-artery vasoconstriction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the intranasal administration of cocaine near the dose used for topical anesthesia causes vasoconstriction of the coronary arteries, with a decrease in the coronary blood flow"
    explanation: >-
      Quantitative arteriography and coronary sinus thermodilution in 29 patients given
      cocaine establish the vasoconstriction and the fall in flow.
  - reference: PMID:1906905
    reference_title: Alleviation of cocaine-induced coronary vasoconstriction by nitroglycerin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The magnitude of vasoconstriction was greater (p = 0.01) in the diseased segments."
    explanation: >-
      Shows the constriction is amplified where atherosclerosis is already present, which
      is why pre-existing coronary disease worsens the ischaemic consequence.
  downstream:
  - target: Reduced Myocardial Oxygen Supply
    causal_link_type: DIRECT

- name: Platelet Activation
  biological_scale: CELLULAR
  description: >-
    Cocaine activates platelets in vivo in humans, releasing alpha-granule contents and
    generating circulating platelet-containing microaggregates. The node is named for what
    was measured. Thrombus formation on a vasoconstricted segment is the plausible route
    from here to reduced flow, but the cited study states it only as a possibility, so the
    downstream edge is typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT and no
    thrombus node is asserted.
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  evidence:
  - reference: PMID:10814631
    reference_title: Cocaine activates platelets and increases the formation of circulating platelet containing microaggregates in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cocaine exposure causes platelet activation, alpha granule release, and platelet containing microaggregate formation."
    explanation: >-
      Randomised double-blind crossover study in 14 healthy volunteers, so the platelet
      effect is attributable to cocaine rather than to the clinical context of an ischaemic
      presentation.
  - reference: PMID:10814631
    reference_title: Cocaine activates platelets and increases the formation of circulating platelet containing microaggregates in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cocaine, even at the relatively low doses commonly self administered by occasional abusers, may promote thrombosis and predispose healthy individuals to ischaemic events"
    explanation: >-
      The authors' own statement of the dose range and the population at risk, which bounds
      how far this mechanism can be extrapolated.
  downstream:
  - target: Reduced Myocardial Oxygen Supply
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Platelet activation is measured; thrombotic occlusion of a coronary segment is the
      unestablished intermediate.

- name: Reduced Myocardial Oxygen Supply
  biological_scale: TISSUE
  description: >-
    Coronary flow falls. Both the vasoconstrictive and the thrombotic branch converge here.
  evidence:
  - reference: PMID:2573838
    reference_title: Cocaine-induced coronary-artery vasoconstriction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the coronary-sinus blood flow fell"
    explanation: Direct thermodilution measurement of the fall in coronary flow after cocaine.
  downstream:
  - target: Myocardial Oxygen Supply-Demand Mismatch
    causal_link_type: DIRECT

- name: Increased Myocardial Oxygen Demand
  biological_scale: ORGANISM
  description: >-
    Tachycardia, hypertension and increased contractility raise myocardial oxygen
    consumption at the same moment supply is falling.
  downstream:
  - target: Myocardial Oxygen Supply-Demand Mismatch
    causal_link_type: DIRECT

- name: Myocardial Oxygen Supply-Demand Mismatch
  biological_scale: TISSUE
  description: >-
    The defining cardiac lesion of cocaine intoxication: demand rises while supply falls,
    in the same patient at the same time, from one drug. The risk is concentrated in the
    first hour after use, and in the cited catheterisation study the constriction occurred
    in patients with and without angiographic coronary disease alike.
  cell_types:
  - preferred_term: cardiac myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:10351966
    reference_title: Triggering of myocardial infarction by cocaine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of myocardial infarction onset was elevated 23.7 times over baseline"
    explanation: >-
      Case-crossover analysis within the Determinants of Myocardial Infarction Onset Study
      quantifying the transient excess risk in the hour after cocaine use.
  - reference: PMID:10351966
    reference_title: Triggering of myocardial infarction by cocaine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cocaine use is associated with a large abrupt and transient increase in the risk of acute myocardial infarction in patients who are otherwise at relatively low risk."
    explanation: >-
      States both the magnitude and the transience, which is what distinguishes this
      mechanism from chronic atherosclerotic risk.
  downstream:
  - target: Ventricular Arrhythmogenesis
    causal_link_type: DIRECT
    description: Ischaemic myocardium is arrhythmogenic.
    evidence:
    - reference: PMID:18815938
      reference_title: Management of cocaine-induced cardiac arrhythmias due to cardiac ion channel dysfunction.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cocaine can produce arrhythmias either through the production of myocardial ischemia or as a direct result of ion channel alterations."
      explanation: >-
        Names myocardial ischaemia as one of the two routes to cocaine-associated
        arrhythmia, which is the edge asserted here.
  - target: Myocardial infarction
    causal_link_type: DIRECT
  - target: Chest pain
    causal_link_type: DIRECT

- name: Cardiac Fast Sodium Channel Blockade
  biological_scale: MOLECULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation"
  description: >-
    Cocaine blocks the cardiac fast sodium channel in the manner of a class I
    antiarrhythmic. This is its local-anaesthetic action applied to myocardium, and it is
    the arm that a purely sympathomimetic account of cocaine toxicity leaves out.
  genes:
  - preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  cell_types:
  - preferred_term: cardiac myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: cardiac fast sodium channel activity
    modifier: DECREASED
    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
  evidence:
  - reference: PMID:14677787
    reference_title: Electrophysiologic and hemodynamic effects of sodium bicarbonate in a canine model of severe cocaine intoxication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Cocaine toxicity causes myocardial depression, malignant dysrhythmias, and sudden death, partially due to cocaine-related myocardial sodium channel blockade."
    explanation: >-
      The human cocaine-toxicity picture and its attribution to sodium-channel blockade,
      quoted from the first sentence of this paper's OBJECTIVE section. No dog measured
      this, so evidence_source grades the human observations the sentence describes and
      quote_role records that the citing paper is a canine study restating them.
  downstream:
  - target: Altered Cardiac Action Potential
    causal_link_type: DIRECT

- name: hERG Potassium Channel Blockade
  biological_scale: MOLECULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation"
  description: >-
    Cocaine also blocks the hERG-encoded rapid delayed-rectifier potassium channel, in the
    open state, at low micromolar concentrations. Cocaethylene, the metabolite formed when
    cocaine and ethanol are taken together, is a slightly more potent blocker than cocaine
    itself.
  genes:
  - preferred_term: KCNH2
    term:
      id: hgnc:6251
      label: KCNH2
  cell_types:
  - preferred_term: cardiac myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: rapid delayed rectifier potassium channel activity
    modifier: DECREASED
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
  evidence:
  - reference: PMID:11561083
    reference_title: Effects of cocaine and its major metabolites on the HERG-encoded potassium channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Blockade of HERG by cocaine, cocaethylene, and methylecgonidine increased significantly over the voltage range where HERG activates"
    explanation: >-
      Characterises the block as open-channel and voltage-dependent in HEK293 cells stably
      expressing HERG.
  - reference: PMID:11561083
    reference_title: Effects of cocaine and its major metabolites on the HERG-encoded potassium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Cocaine abuse has been reported to result in QT prolongation in humans"
    explanation: >-
      Records the human clinical observation the in-vitro work was undertaken to explain.
      The quoted sentence is the citing paper's opening statement of prior human findings,
      not a result of its own cell experiments, hence quote_role BACKGROUND.
  downstream:
  - target: Altered Cardiac Action Potential
    causal_link_type: DIRECT

- name: Altered Cardiac Action Potential
  biological_scale: CELLULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Altered Cardiac Action Potential"
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    modifier: ABNORMAL
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
  description: >-
    Loss of fast inward sodium current slows phase 0 upstroke; loss of the rapid delayed
    rectifier prolongs phase 3. Both currents are perturbed by the same drug, so
    depolarisation and repolarisation are affected together.
  cell_types:
  - preferred_term: cardiac myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:18815938
    reference_title: Management of cocaine-induced cardiac arrhythmias due to cardiac ion channel dysfunction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Excessive catecholamines, combined with sodium and potassium channel blockades, give rise to a wide variety of supra-ventricular and ventricular rhythms."
    explanation: >-
      States that sodium- and potassium-channel blockade together produce the arrhythmia
      spectrum, which is the claim this node carries as the convergence of both channel
      arms.
  downstream:
  - target: Slowed Ventricular Conduction
    causal_link_type: DIRECT
  - target: Delayed Ventricular Repolarization
    causal_link_type: DIRECT

- name: Slowed Ventricular Conduction
  biological_scale: TISSUE
  description: >-
    Reduced sodium current slows impulse propagation through the ventricular myocardium,
    widening the QRS complex. Because the QRS narrows promptly when extracellular sodium
    is raised and pH shifted with sodium bicarbonate, the widening is a reversible
    consequence of channel blockade rather than structural damage.
  evidence:
  - reference: PMID:14677787
    reference_title: Electrophysiologic and hemodynamic effects of sodium bicarbonate in a canine model of severe cocaine intoxication.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immediately after administering NaHCO3, QRS duration decreased by 30% (p < 0.001), returning to baseline more quickly than in the control group."
    explanation: >-
      The reversal of QRS widening by sodium bicarbonate in cocaine-poisoned dogs is direct
      evidence that the widening reflects sodium-channel blockade.
  downstream:
  - target: Ventricular Arrhythmogenesis
    causal_link_type: DIRECT
  - target: Prolonged QRS complex
    causal_link_type: DIRECT

- name: Delayed Ventricular Repolarization
  biological_scale: CELLULAR
  description: >-
    hERG blockade prolongs the action potential plateau and lengthens the QT interval,
    creating the substrate for afterdepolarisation-driven triggered activity.
  evidence:
  - reference: PMID:11561083
    reference_title: Effects of cocaine and its major metabolites on the HERG-encoded potassium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Cocaine abuse has been reported to result in QT prolongation in humans"
    explanation: >-
      QT prolongation is the clinical readout of delayed ventricular repolarisation, and
      this is the human observation of it. Quoted from the citing paper's background rather
      than from its cell experiments, hence quote_role BACKGROUND.
  downstream:
  - target: Ventricular Arrhythmogenesis
    causal_link_type: DIRECT
  - target: Prolonged QT interval
    causal_link_type: DIRECT

- name: Ventricular Arrhythmogenesis
  biological_scale: TISSUE
  description: >-
    Three substrates converge: slowed conduction supporting reentry, delayed repolarisation
    supporting triggered activity, and ischaemic myocardium. Catecholamine excess is
    superimposed on all three, which is why the arrhythmia burden of cocaine cannot be
    attributed to any single one of its actions.

    This node deliberately declares no conforms_to. The obvious target,
    xenobiotic_cardiac_channel_perturbation#Xenobiotic-Induced Cardiac Arrhythmia, is
    excluded by that module's own scope note: "the xenobiotic must act on the channel
    itself. A drug that causes arrhythmia through electrolyte disturbance, ischaemia, or
    structural injury belongs elsewhere, even when the endpoint looks the same." This node
    is a mixed channel, ischaemia and catecholamine endpoint and takes an inbound edge from
    the supply-demand node, so conforming it would assert a channel attribution the entry
    itself contradicts. The three upstream nodes that do act on the channel carry the
    conformance instead.
  evidence:
  - reference: PMID:18815938
    reference_title: Management of cocaine-induced cardiac arrhythmias due to cardiac ion channel dysfunction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Excessive catecholamines, combined with sodium and potassium channel blockades, give rise to a wide variety of supra-ventricular and ventricular rhythms."
    explanation: >-
      States the convergence of the catecholamine arm and both channel arms on the
      arrhythmia endpoint, which is exactly the structure this node encodes.
  downstream:
  - target: Ventricular tachycardia
    causal_link_type: DIRECT
  - target: Sudden cardiac death
    causal_link_type: DIRECT

- name: Central Nervous System Stimulation
  biological_scale: ORGANISM
  description: >-
    Central monoamine excess produces the psychomotor arm of the toxidrome: agitation,
    hypervigilance, diaphoresis and, at higher exposures, disorientation.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:9725976
    reference_title: Multiple cocaine-induced seizures and corresponding cocaine and metabolite concentrations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other clinical findings included tachycardia, hypertension, diaphoresis, and disorientation."
    explanation: >-
      Documents the sympathomimetic and central features occurring together in a patient
      with measured very high blood cocaine concentrations.
  downstream:
  - target: Central Neuronal Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from central stimulation to seizure is not established. Typed
      INDIRECT_UNKNOWN_INTERMEDIATES, which the schema defines as a relationship where at
      least one required intermediate mechanism is currently unknown. UNKNOWN would be
      wrong: that value means directness has not yet been assessed, whereas the cited
      source has been read and states the mechanism is unclear.
    evidence:
    - reference: PMID:9725976
      reference_title: Multiple cocaine-induced seizures and corresponding cocaine and metabolite concentrations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The etiology of seizures associated with cocaine use is unclear."
      explanation: >-
        The source's own statement that the seizure mechanism is not established, which is
        why this edge is typed UNKNOWN and carries no molecular claim.
  - target: Agitation
    causal_link_type: DIRECT
  - target: Hyperhidrosis
    causal_link_type: DIRECT
  - target: Confusion
    causal_link_type: DIRECT

- name: Central Neuronal Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    A state of lowered seizure threshold occurring at high cocaine concentrations. It is
    named as a node because seizures are a real and sometimes fatal feature, but no
    molecular mechanism is asserted here: the cited source describes generalized seizures
    at measured peak concentrations with a negative workup for structural causes, and
    states that the aetiology is unclear.
  evidence:
  - reference: PMID:9725976
    reference_title: Multiple cocaine-induced seizures and corresponding cocaine and metabolite concentrations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 1 hour after the ingestion incidents, the patient had multiple, generalized seizures that abated spontaneously. His workup for CNS bleeding, infection, and trauma was negative."
    explanation: >-
      Establishes seizures temporally related to cocaine with structural causes excluded,
      supporting a drug-attributable lowering of seizure threshold without specifying one.
  downstream:
  - target: Seizure
    causal_link_type: DIRECT

- name: Impaired Thermoregulatory Heat Dissipation
  biological_scale: ORGANISM
  description: >-
    Cocaine raises the core temperature threshold at which cutaneous vasodilation and
    sweating begin, and blunts the perception of heating that would normally drive a person
    to seek shade or remove clothing. Heat production rising is the familiar half of the
    story; the losing half is that the body stops getting rid of it, and stops noticing.
    The clustering of cocaine-associated hyperthermia in hot weather is what prompted
    this hypothesis, rather than something the finding explains.
  biological_processes:
  - preferred_term: core body temperature homeostasis
    modifier: DECREASED
    term:
      id: GO:0001659
      label: temperature homeostasis
  evidence:
  - reference: PMID:12044126
    reference_title: Mechanism of cocaine-induced hyperthermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, impaired heat dissipation is a major mechanism by which cocaine elevates body temperature."
    explanation: >-
      Randomised double-blind placebo-controlled crossover trial of passive heat stress in
      cocaine-naive volunteers, establishing impaired dissipation rather than increased
      production as a mechanism in humans.
  - reference: PMID:12044126
    reference_title: Mechanism of cocaine-induced hyperthermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cocaine paradoxically impaired the perception of heating by attenuating the progressive increase in thermal discomfort associated with heat stress"
    explanation: >-
      Documents the behavioural limb of the impairment, which removes the compensation a
      person would otherwise make.
  - reference: PMID:12044126
    reference_title: Mechanism of cocaine-induced hyperthermia in humans.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The traditional view is that cocaine causes a hypermetabolic state with increased heat production."
    explanation: >-
      Graded NO_EVIDENCE deliberately. This sentence asserts increased heat PRODUCTION,
      which is the account this node displaces, not the impaired DISSIPATION the node
      claims. It is kept because it names the prior view the trial was designed to test,
      so a reader sees the correction; it does not support the node.
  downstream:
  - target: Hyperthermia
    causal_link_type: DIRECT
  - target: Skeletal Myocyte Necrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hyperthermia is one of four candidate contributors the cited source names, none
      established. Typed for an unknown required intermediate rather than UNKNOWN, which
      would wrongly say directness has not been assessed.

- name: Skeletal Myocyte Necrosis
  biological_scale: CELLULAR
  description: >-
    Skeletal muscle breaks down, releasing myoglobin and intracellular contents. Several
    contributors are plausible and none is established as dominant: increased muscular
    activity from agitation, direct muscle compression in an obtunded patient,
    hyperthermia, and alpha-adrenergic vasoconstriction producing muscle ischaemia.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:2913784
    reference_title: Cocaine-associated acute myoglobinuric renal failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe herein four patients with rhabdomyolysis and acute myoglobinuric renal failure temporally related to cocaine use."
    explanation: >-
      Case series establishing rhabdomyolysis with renal failure as a complication of acute
      cocaine intoxication.
  - reference: PMID:2913784
    reference_title: Cocaine-associated acute myoglobinuric renal failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanism of cocaine injury is unclear; possibilities include increased muscle activity, muscle compression, hyperthermia, and vasospasm with muscle ischemia."
    explanation: >-
      The authors' explicit statement that the mechanism is unsettled and multifactorial,
      which is why the incoming hyperthermia edge is typed for unknown intermediates rather
      than DIRECT.
  - reference: PMID:10414649
    reference_title: "Cocaine-associated rhabdomyolysis and excited delirium: different stages of the same syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "It appears that this syndrome is caused by changes in dopamine processing induced by chronic and intense use of cocaine rather than by the acute toxic effects of the drug."
    explanation: >-
      A direct argument against placing this node in an acute-intoxication entry at all.
      Recorded as REFUTE rather than omitted: if the rhabdomyolysis and excited-delirium
      syndrome is a chronic-use phenomenon, this arm may belong to a cocaine use disorder
      entry instead. The node is kept because rhabdomyolysis is reported in acute
      presentations, but the challenge is on the record.
  downstream:
  - target: Rhabdomyolysis
    causal_link_type: DIRECT
  - target: Myoglobinuria
    causal_link_type: DIRECT
  - target: Acute kidney injury
    causal_link_type: DIRECT

- name: Cerebral Vasoconstriction and Vascular Injury
  biological_scale: TISSUE
  description: >-
    The same adrenergic vasoconstriction applied to the cerebral circulation, together with
    hypertensive surges and vessel-wall injury, raises the risk of both ischaemic and
    haemorrhagic stroke. The epidemiological evidence is consistent in direction but
    heterogeneous: several studies in the cited systematic review found no association.
  cell_types:
  - preferred_term: smooth muscle cell of the brain vasculature
    term:
      id: CL:0002590
      label: smooth muscle cell of the brain vasculature
  evidence:
  - reference: PMID:25066468
    reference_title: 'Cocaine use and risk of stroke: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Epidemiological evidence suggests that cocaine use increases the risk of stroke."
    explanation: >-
      Systematic review of nine epidemiological studies concluding an increased stroke risk.
  - reference: PMID:25066468
    reference_title: 'Cocaine use and risk of stroke: a systematic review.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Three CCS and one CSS did not find any relationship between cocaine and strokes."
    explanation: >-
      Four of the nine included studies found no association, so the same review that
      supports this node also bounds it. Recorded as a separate REFUTE item rather than
      folded into the supporting explanation.
  downstream:
  - target: Stroke
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Acute Aortic Wall Stress
  biological_scale: TISSUE
  description: >-
    Abrupt catecholamine-driven rises in arterial pressure and shear stress on the aortic
    wall can initiate dissection, characteristically within about an hour of use and in
    patients much younger than typical dissection cohorts.
  evidence:
  - reference: PMID:33118742
    reference_title: 'Cocaine-Related Aortic Dissection: what do we know?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median time from last cocaine use to onset of symptoms was one hour."
    explanation: >-
      The short median interval between exposure and symptom onset across 45 cases is
      consistent with an acute haemodynamic trigger. It does not exclude a chronic
      contribution: the same paper records that most of these patients had used cocaine for
      more than a year.
  - reference: PMID:33118742
    reference_title: 'Cocaine-Related Aortic Dissection: what do we know?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute aortic dissection related to cocaine use occurs in predominantly young male patients and has a dismal outcome when compared to all comer series."
    explanation: >-
      Characterises the affected population and outcome, distinguishing this entity from
      age-related aortic disease.
  downstream:
  - target: Aortic dissection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Cocaine is involved in roughly a fifth of US drug overdose deaths, and acute
    intoxication kills through mechanisms that act within minutes to an hour of exposure:
    ventricular arrhythmia, myocardial infarction, aortic dissection. The figure that
    matters mechanistically is the second one below. Nearly three quarters of
    cocaine-involved deaths also involve an opioid, so most fatal cocaine exposures are
    not pure cocaine toxicity, and cocaine-attributable mortality cannot be read off these
    totals.

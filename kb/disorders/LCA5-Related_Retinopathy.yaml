animal_models:
- name: Lca5 gene-trap (Lca5gt/gt) mouse
  species: Mouse
  genotype: Lca5 gene-trap homozygous (Lca5gt/gt); Lca5+/gt heterozygous littermates used as comparator
  genes:
  - preferred_term: LCA5
    term:
      id: hgnc:31923
      label: LCA5
  publication: PMID:37071472
  description: >-
    A lebercilin-deficient mouse produced by gene-trap disruption of Lca5.
    Homozygous (HOM) mice show early-onset, progressive retinal degeneration
    with axonemal defects at the photoreceptor bulge region, while
    heterozygous (HET) littermates serve as unaffected comparators.
  evidence:
  - reference: PMID:37071472
    reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that mutant mice deficient in lebercilin exhibited early axonemal defects at the bulge region and the distal OS, accompanied by reduced levels of RP1 and IFT proteins, affecting membrane disc formation and presumably leading to photoreceptor death."
    explanation: >-
      Establishes the lebercilin-deficient mouse as informative for the
      LCA5 disease mechanism, directly linking loss of lebercilin to
      bulge-region axonemal defects, reduced RP1/IFT levels, and
      photoreceptor death.
  modeled_mechanisms:
  - target: Photoreceptor Outer Segment Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The Lca5gt/gt mouse fully recapitulates the early-onset, progressive
      photoreceptor degeneration of human LCA5-related retinopathy.
    readouts:
    - name: Outer nuclear layer thickness
      target: Photoreceptor Outer Segment Degeneration
      description: >-
        Photoreceptor nuclear-layer content assessed histologically in HOM
        mice over postnatal development.
      direction: DECREASED
      interpretation: >-
        Progressive loss of the outer nuclear layer is the structural
        correlate of photoreceptor degeneration in this model.
      evidence:
      - reference: PMID:37071472
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "with only a few layers of photoreceptor nuclei left in the outer nuclear layer (ONL) at P28"
        explanation: >-
          Reports the near-complete loss of the outer nuclear layer by P28
          in the HOM mouse model.
    evidence:
    - reference: PMID:37071472
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Phenotypically, this mouse model fully recapitulates LCA in humans, showing an early-onset, progressive retinal degeneration, with only a few layers of photoreceptor nuclei left in the outer nuclear layer (ONL) at P28"
      explanation: >-
        The authors explicitly state that this mouse model fully
        recapitulates human LCA, supporting its use as informative for the
        photoreceptor degeneration node.
  - target: Lebercilin Loss and Bulge Region Ciliary Axoneme Disruption
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      AAV-mediated LCA5 gene augmentation in HOM mice partially rescues the
      bulge-region axonemal defect caused by lebercilin loss.
    limitations: >-
      Rescue was partial and heterogeneous: ectopic lebercilin localization
      along the entire distal axoneme and at the centrioles (rather than
      restricted to the bulge region) was observed, and the degree of
      restoration varied between replicates.
    readouts:
    - name: Bulge-region axoneme structure and OS membrane disc formation
      target: Lebercilin Loss and Bulge Region Ciliary Axoneme Disruption
      description: >-
        Bulge-region structure, axoneme integrity, and membrane disc
        formation assessed by ultrastructure expansion microscopy after
        AAV-LCA5 gene augmentation in HOM mice.
      direction: RESTORED
      interpretation: >-
        Gene augmentation restores the molecular/structural lesion at its
        source, the mechanistic basis for the human gene-therapy trial.
      evidence:
      - reference: PMID:37071472
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "adeno-associated virus–based LCA5 gene augmentation partially restored the bulge region, preserved OS axoneme structure and membrane disc formation, and resulted in photoreceptor cell survival."
        explanation: >-
          Directly reports partial restoration of the bulge region, OS
          axoneme structure, and membrane disc formation following gene
          augmentation.
    evidence:
    - reference: PMID:37071472
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we show that exogenous lebercilin expression in photoreceptors partially rescues axoneme defects, RP1 and IFT protein localization, and CC length and is associated with improved photoreceptor survival."
      explanation: >-
        Confirms that restoring lebercilin expression rescues the
        bulge-region axonemal defect and its downstream consequences (RP1
        and IFT mislocalization, CC length), supporting this model as
        informative for the rescue arm of the mechanism.

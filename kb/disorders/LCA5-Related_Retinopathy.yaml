inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    LCA5-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic LCA5 variants.
  evidence:
  - reference: PMID:17546029
    reference_title: "Mutations in LCA5, encoding the ciliary protein lebercilin, cause Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected homozygous nonsense and frameshift mutations in LCA5 in five families affected with LCA."
    explanation: >-
      Homozygous LCA5 genotypes identified by homozygosity mapping across
      five independent families establish autosomal recessive inheritance.
  - reference: PMID:18334959
    reference_title: "Identification of a novel splice-site mutation in the Lebercilin (LCA5) gene causing Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a homozygosity mapping analysis in a consanguineous sibship that led to the identification of a mutation in the recently discovered LCA5 gene."
    explanation: >-
      Independent confirmation via homozygosity mapping in a consanguineous
      sibship with two affected siblings, the classic pedigree pattern of
      autosomal recessive inheritance.

pathophysiology:
- name: Lebercilin Loss and Bulge Region Ciliary Axoneme Disruption
  biological_scale: MOLECULAR
  description: >-
    LCA5 encodes lebercilin, a ciliary protein that localizes, together with
    retinitis pigmentosa 1 protein (RP1) and the intraflagellar transport
    (IFT) proteins IFT81 and IFT88, to the "bulge region" of the
    photoreceptor outer-segment connecting-cilium axoneme -- a site distal to
    the CEP290 transition zone that is required for outer-segment membrane
    disc formation. Biallelic loss-of-function LCA5 variants (nonsense,
    frameshift, or splicing-disrupting) abolish lebercilin function and
    destabilize this bulge region.
  gene:
    preferred_term: LCA5
    modifier: DECREASED
    term:
      id: hgnc:31923
      label: LCA5
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:17546029
    reference_title: "Mutations in LCA5, encoding the ciliary protein lebercilin, cause Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lebercilin localizes to the connecting cilia of photoreceptors and to the microtubules, centrioles and primary cilia of cultured mammalian cells."
    explanation: >-
      Establishes lebercilin as a ciliary protein localizing to the
      photoreceptor connecting cilium, the structural basis for its role in
      ciliary axoneme organization.
  - reference: PMID:37071472
    reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that LCA5-encoded lebercilin, together with retinitis pigmentosa 1 protein (RP1) and the intraflagellar transport (IFT) proteins IFT81 and IFT88, localized at the bulge region of the photoreceptor outer segment (OS), a region crucial for OS membrane disc formation."
    explanation: >-
      Precisely localizes lebercilin, RP1, and IFT81/IFT88 to the bulge
      region of the photoreceptor outer-segment axoneme, the structural node
      required for outer-segment disc formation.
  downstream:
  - target: Impaired IFT Cargo Delivery and Outer Segment Disc Formation Failure
    description: >-
      Loss of lebercilin destabilizes the bulge region, reducing RP1 and IFT
      protein levels and disrupting delivery of outer-segment-building cargo
      along the distal axoneme.
    evidence:
    - reference: PMID:37071472
      reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we demonstrate that mutant mice deficient in lebercilin exhibited early axonemal defects at the bulge region and the distal OS, accompanied by reduced levels of RP1 and IFT proteins, affecting membrane disc formation and presumably leading to photoreceptor death."
      explanation: >-
        Directly demonstrates that lebercilin loss in mice causes bulge-region
        and distal-axoneme defects with reduced RP1/IFT protein levels,
        mechanistically linking the molecular lesion to impaired disc
        formation and photoreceptor death.

- name: Impaired IFT Cargo Delivery and Outer Segment Disc Formation Failure
  biological_scale: CELLULAR
  description: >-
    With the bulge region destabilized, intraflagellar transport of
    outer-segment membrane and phototransduction cargo along the distal
    connecting-cilium axoneme fails, preventing normal outer-segment disc
    morphogenesis and renewal.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: intraciliary transport
    term:
      id: GO:0042073
      label: intraciliary transport
    modifier: DECREASED
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: DECREASED
  evidence:
  - reference: PMID:37071472
    reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "adeno-associated virus–based LCA5 gene augmentation partially restored the bulge region, preserved OS axoneme structure and membrane disc formation, and resulted in photoreceptor cell survival."
    explanation: >-
      Restoring lebercilin via gene augmentation rescues bulge-region
      structure, axoneme integrity, and disc formation, confirming that
      disc-formation failure is the mechanistic consequence of impaired IFT
      cargo delivery when lebercilin is absent.
  downstream:
  - target: Photoreceptor Outer Segment Degeneration
    description: >-
      Failure of outer-segment disc formation and maintenance leads to
      progressive photoreceptor degeneration.
    evidence:
    - reference: PMID:37071472
      reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we demonstrate that mutant mice deficient in lebercilin exhibited early axonemal defects at the bulge region and the distal OS, accompanied by reduced levels of RP1 and IFT proteins, affecting membrane disc formation and presumably leading to photoreceptor death."
      explanation: >-
        Links disc-formation failure directly to downstream photoreceptor
        cell death in the lebercilin-deficient mouse model.

- name: Photoreceptor Outer Segment Degeneration

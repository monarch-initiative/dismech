  findings:
  - statement: >-
      This GeneReviews entry is a multi-gene nonsyndromic LCA/EOSRD overview
      rather than an LCA5-specific chapter; per its gene-by-gene table LCA5
      accounts for 1%-2% of LCA/EOSRD cases, is inherited in an autosomal
      recessive manner, and is distinguished by "dissociation of retinal
      structure & function w/preservation of outer nuclear layer." The cached
      record does not provide further quotable, LCA5-specific text, so
      disease-specific claims in this entry are sourced from primary
      literature (den Hollander 2007, Ramprasad 2008, Jacobson 2009, Faber
      2023, the 2025 gene-therapy trial) rather than from GeneReviews
      snippets; the overview is retained as the tagged clinical baseline
      reference.

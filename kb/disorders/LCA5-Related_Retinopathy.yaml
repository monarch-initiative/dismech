genetic:
- name: LCA5
  gene_term:
    preferred_term: LCA5
    term:
      id: hgnc:31923
      label: LCA5
  association: Causative
  features: >-
    Homozygous or compound-heterozygous loss-of-function LCA5 variants
    (nonsense, frameshift, and splicing-disrupting) have been identified
    across multiple independent families. To date, isolated LCA is the only
    phenotype unambiguously established for LCA5 pathogenic variants.
  evidence:
  - reference: PMID:17546029
    reference_title: "Mutations in LCA5, encoding the ciliary protein lebercilin, cause Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a sixth family, the LCA5 transcript was completely absent."
    explanation: >-
      Documents a complete loss-of-transcript LCA5 genotype as an additional
      independent disease-causing mechanism beyond point mutations.
  - reference: PMID:18334959
    reference_title: "Identification of a novel splice-site mutation in the Lebercilin (LCA5) gene causing Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A c.955G>A missense mutation in the last base of exon 6 causing disruption of the splice donor site was identified in both the affected sibs."
    explanation: >-
      Documents a splice-disrupting LCA5 variant as an independent
      disease-causing mechanism, illustrating the allelic spectrum beyond
      nonsense/frameshift variants.

treatments:
- name: OPGx-001 / OPGx-LCA5 AAV8 Gene Augmentation Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    A recombinant adeno-associated virus serotype 8 (AAV8) vector carrying
    native human LCA5 cDNA (OPGx-001, now advancing as OPGx-LCA5),
    administered by subretinal injection. In an ongoing phase 1b/2a/3
    dose-escalation trial (NCT05616793), the first three treated adults with
    LCA5-associated LCA had no serious treatment-related adverse events and
    showed improvements in cone-mediated vision detectable at 1 month and
    sustained for at least 12 months, with visual acuity returning to
    baseline or improving in all treated eyes. Mouse preclinical data show
    that gene augmentation restores bulge-region axoneme structure and
    outer-segment disc formation.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Lebercilin Loss and Bulge Region Ciliary Axoneme Disruption
    treatment_effect: RESTORES
    description: >-
      AAV8-delivered LCA5 cDNA restores lebercilin expression, repairing the
      bulge-region axoneme defect at its molecular source.
    evidence:
    - reference: PMID:37071472
      reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "adeno-associated virus–based LCA5 gene augmentation partially restored the bulge region, preserved OS axoneme structure and membrane disc formation, and resulted in photoreceptor cell survival."
      explanation: >-
        Mouse preclinical data directly demonstrate that LCA5 gene
        augmentation restores the bulge-region axoneme defect, the molecular
        mechanism target of this treatment.
  evidence:
  - reference: PMID:40598770
    reference_title: "Recovery of cone-mediated vision in Lebercilin associated retinal ciliopathy after gene therapy: one-year results of a phase I/II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assessed the preliminary safety of a recombinant adeno-associated virus serotype 8 vector carrying the native human LCA5 cDNA (OPGx-001) in LCA5-associated Leber congenital amaurosis (LCA5-LCA), a congenital blindness."
    explanation: >-
      Defines the therapy (AAV8-delivered LCA5 cDNA) and its target
      population.
  - reference: PMID:40598770
    reference_title: "Recovery of cone-mediated vision in Lebercilin associated retinal ciliopathy after gene therapy: one-year results of a phase I/II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no serious adverse events related to OPGx-001 or the procedure."
    explanation: >-
      Establishes the favorable safety profile in the first-in-human trial.
  - reference: PMID:40598770
    reference_title: "Recovery of cone-mediated vision in Lebercilin associated retinal ciliopathy after gene therapy: one-year results of a phase I/II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromatic full-field stimulus testing showed improvements in cone-mediated vision averaging ∼1 log10 unit."
    explanation: >-
      Quantifies the cone-mediated visual function improvement, the trial's
      key efficacy signal.
  - reference: PMID:40598770
    reference_title: "Recovery of cone-mediated vision in Lebercilin associated retinal ciliopathy after gene therapy: one-year results of a phase I/II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual acuity returned to baseline or improved in the treated eyes of all participants."
    explanation: >-
      Documents visual acuity outcomes across all three treated participants.
  - reference: PMID:37071472
    reference_title: "Gene augmentation of LCA5-associated Leber congenital amaurosis ameliorates bulge region defects of the photoreceptor ciliary axoneme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "adeno-associated virus–based LCA5 gene augmentation partially restored the bulge region, preserved OS axoneme structure and membrane disc formation, and resulted in photoreceptor cell survival."
    explanation: >-
      Mouse preclinical data establish the mechanistic proof-of-concept
      underlying the human gene-therapy trial.

notes: >-
  OMIM phenotype entry #604537 "LEBER CONGENITAL AMAUROSIS 5; LCA5" (gene
  *611408 LCA5/lebercilin, chromosome 6q14). LCA5 mRNA is also expressed in
  ciliated respiratory epithelium (nasopharynx, trachea, lung) and lebercilin
  was originally identified in the bronchial-epithelium ciliary axoneme
  proteome; one reported LCA5-null infant died at 11 months of age from
  asphyxia during sleep, raising the possibility of a wider ciliopathy
  phenotype spectrum, but to date isolated LCA remains the only phenotype
  unambiguously established for LCA5 pathogenic variants (PMID:18334959).


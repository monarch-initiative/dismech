    congenital visual impairment with a paradoxical dissociation of retinal
    structure and function: central (foveal) photoreceptors and retinal
    pigment epithelium can remain relatively retained on imaging despite
    profound visual loss, while more peripheral retina shows laminar
    disorganization -- a structural window that gene-augmentation therapy
    has targeted.

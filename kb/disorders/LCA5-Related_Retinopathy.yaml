    variants, which is required to establish eligibility for AAV8 lebercilin
    gene-augmentation clinical trials.
  results: >-
    Homozygous or compound-heterozygous nonsense, frameshift, or
    splice-disrupting LCA5 variants confirm the diagnosis.
  evidence:
  - reference: PMID:17546029
    reference_title: "Mutations in LCA5, encoding the ciliary protein lebercilin, cause Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected homozygous nonsense and frameshift mutations in LCA5 in five families affected with LCA."
    explanation: >-
      Homozygosity mapping across five independent families establishes the
      molecular genotype-confirmation approach used to diagnose LCA5-related
      retinopathy.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Optical coherence tomography and other multimodal retinal imaging assess
    the distinctive dissociation of retinal structure and function in LCA5,

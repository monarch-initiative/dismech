    vision loss -- a structural window relevant to gene-therapy candidacy.
  results: >-
    LCA5 patients show retained photoreceptors mainly in the central retina,
    with retinal laminar disorganization increasing toward the periphery.
  evidence:
  - reference: PMID:19503738
    reference_title: "Leber congenital amaurosis caused by Lebercilin (LCA5) mutation: retained photoreceptors adjacent to retinal disorganization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCA5 patients had evidence of retained photoreceptors mainly in the central retina. Retinal remodeling was present in pericentral regions in both patients."
    explanation: >-
      Establishes the central-preservation-with-peripheral-remodeling
      imaging pattern used to characterize disease structure and identify
      the therapeutic window in LCA5.


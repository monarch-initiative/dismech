diagnosis:
- name: Electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Full-field ERG is the defining electrophysiological test for LCA5-related
    retinopathy: it is abnormal or non-recordable (flat) in essentially all
    affected individuals from birth or the first few months of life, directly
    measuring the near-total loss of functional rod and cone photoreceptor
    signaling.
  results: >-
    An abnormal or flat ERG is present alongside severely impaired vision or
    blindness and nystagmus from early infancy.
  evidence:
  - reference: PMID:10615133
    reference_title: "Mutations in a new photoreceptor-pineal gene on 17p cause Leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with LCA are diagnosed at birth or in the first few months of life with severely impaired vision or blindness, nystagmus and an abnormal or flat electroretinogram (ERG)."
    explanation: >-
      This original LCA gene-discovery paper establishes the abnormal or
      flat ERG as a defining diagnostic feature of LCA, of which LCA5 is a
      genetic subtype.
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure

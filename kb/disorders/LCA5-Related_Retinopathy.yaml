name: LCA5-Related Retinopathy
creation_date: "2026-08-13T21:00:00Z"
category: Mendelian
description: >-
  LCA5-related retinopathy (Leber congenital amaurosis 5, LCA5) is a severe,
  early-onset autosomal recessive inherited retinal ciliopathy caused by
  biallelic loss-of-function variants in LCA5, which encodes the ciliary
  protein lebercilin. Lebercilin localizes, together with retinitis pigmentosa
  1 protein (RP1) and the intraflagellar transport (IFT) proteins IFT81 and
  IFT88, to the "bulge region" of the photoreceptor connecting-cilium
  axoneme -- a site distal to the CEP290 transition zone that is required for
  outer-segment membrane disc formation. Loss of lebercilin destabilizes this
  region, reduces RP1 and IFT protein levels, and disrupts intraflagellar
  cargo delivery, impairing outer-segment disc formation and causing
  progressive photoreceptor degeneration. LCA5-related retinopathy presents
  in infancy with severe visual impairment, nystagmus, and hyperopia.
  Natural-history imaging shows a distinctive dissociation of
  retinal structure and function: central photoreceptors and retinal pigment
  epithelium can remain relatively preserved despite profound vision loss,
  while more peripheral retina shows laminar disorganization -- a structural
  window that AAV8-based lebercilin gene-augmentation therapy (OPGx-001 /
  OPGx-LCA5) has targeted, with an ongoing phase 1b/2a/3 trial reporting
  sustained cone-mediated vision gains without serious adverse events.

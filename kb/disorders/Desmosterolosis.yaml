- name: Impaired Cholesterol Synthesis
  biological_scale: MOLECULAR
  description: >-
    De novo cholesterol synthesis by the Bloch pathway is blocked. Cellular
    cholesterol is moderately reduced in patient lymphoblasts, but plasma cholesterol
    is often normal, so the deficit is thought to matter where tissues depend on their
    own synthesis, above all the developing brain.

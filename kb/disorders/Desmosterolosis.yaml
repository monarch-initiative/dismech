biochemical:
- name: Plasma desmosterol
  presence: Increased
  context: >-
    The diagnostic analyte, raised 50-fold or more in plasma in reported patients and
    mildly raised in heterozygous parents.
  biomarker_term:
    preferred_term: desmosterol
    term:
      id: CHEBI:17737
      label: desmosterol
  readouts:
  - target: Desmosterol Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Plasma desmosterol reports the enzymatic block directly, as the substrate
      immediately upstream of it.
    evidence:
    - reference: PMID:29175559
      reference_title: "Desmosterolosis presenting with multiple congenital anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Initial evaluation can be performed using sterol quantitation, followed by genetic testing."
      explanation: Sterol quantitation is the first diagnostic step.
  evidence:
  - reference: PMID:12457401
    reference_title: "Desmosterolosis presenting with multiple congenital anomalies and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma sterol quantification in the patient at age 2 years demonstrated a normal cholesterol level, but a 100-fold increased level of desmosterol (60 mcg/ml; nl 0.5 +/- 0.3 mcg/ml (SD)) suggesting deficient activity of 24-dehydrocholesterol (desmosterol) reductase (DHCR24)."
    explanation: Magnitude of the plasma elevation.
  - reference: PMID:21559050
    reference_title: "The desmosterolosis phenotype: spasticity, microcephaly and micrognathia with agenesis of corpus callosum and loss of white matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide linkage analysis and fine mapping defined a 6.75 cM disease-associated locus in chromosome 1 (maximum multipoint LOD score of six), and sequencing of candidate genes within this locus identified in the affected individuals a homozygous missense mutation in DHCR24 leading to dramatically augmented plasma desmosterol levels."
    explanation: Markedly raised plasma desmosterol in the Bedouin kindred.
  - reference: PMID:41500862
    reference_title: "DHCR24-related desmosterolosis in the first reported Turkish patient: Expanding the genotypic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma desmosterol levels were elevated >50-fold (134 ng/L; reference ≤2.5 ng/L), supporting the diagnosis."
    explanation: More than 50-fold elevation in a recent patient.
- name: Plasma cholesterol
  presence: Normal
  context: >-
    Often normal despite the block, so a normal plasma cholesterol does not exclude
    the disease; the cholesterol deficit is cellular and developmental.
  evidence:
  - reference: PMID:12457401
    reference_title: "Desmosterolosis presenting with multiple congenital anomalies and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma sterol quantification in the patient at age 2 years demonstrated a normal cholesterol level, but a 100-fold increased level of desmosterol (60 mcg/ml; nl 0.5 +/- 0.3 mcg/ml (SD)) suggesting deficient activity of 24-dehydrocholesterol (desmosterol) reductase (DHCR24)."
    explanation: Normal plasma cholesterol in a patient with grossly raised desmosterol.
  - reference: PMID:24961299
    reference_title: "Desmosterolosis: an illustration of diagnostic ambiguity of cholesterol synthesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All other sterols measured (Supplementary methods) including cholesterol and 7-dehydrocholesterol were within normal range compared to healthy controls."
    explanation: Normal cholesterol and 7-dehydrocholesterol in two affected sisters.

pathophysiology:
- name: DHCR24 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic DHCR24 variants reduce or abolish 3beta-hydroxysterol
    Delta24-reductase activity. Most reported alleles are missense, several within or
    near the FAD-binding pocket; nonsense, frameshift and splice alleles occur in
    compound heterozygosity. Patient alleles expressed in yeast have reduced enzyme
    activity.
  genes:
  - preferred_term: DHCR24
    term:
      id: hgnc:2859
      label: DHCR24
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic (homozygous or compound heterozygous) germline DHCR24 variants.
  molecular_functions:
  - preferred_term: 3beta-hydroxysterol Delta24-reductase activity
    term:
      id: GO:0050614
      label: Delta24-sterol reductase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11519011
    reference_title: "Mutations in the 3beta-hydroxysterol Delta24-reductase gene cause desmosterolosis, an autosomal recessive disorder of cholesterol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversion of desmosterol to cholesterol by DHCR24 in vitro is strictly dependent on reduced nicotinamide adenine dinucleotide phosphate and is increased twofold by the addition of FAD to the assay."
    explanation: Establishes the enzyme's activity and cofactor requirements.
  - reference: PMID:11519011
    reference_title: "Mutations in the 3beta-hydroxysterol Delta24-reductase gene cause desmosterolosis, an autosomal recessive disorder of cholesterol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sequence analysis of DHCR24 in two patients with desmosterolosis revealed four different missense mutations, which were shown, by functional expression, in yeast, of the patient alleles, to be disease causing."
    explanation: Patient alleles lose enzyme function in a heterologous system.
  - reference: PMID:42454491

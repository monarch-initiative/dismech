    classified_by: CLINGEN
    external_id: CGGV:assertion_c0bfe726-6062-406f-bbcf-ccd1f21ba987-2025-06-25T160000.000Z
    evidence:
    - reference: CGGV:assertion_c0bfe726-6062-406f-bbcf-ccd1f21ba987-2025-06-25T160000.000Z
      reference_title: "DHCR24 / desmosterolosis (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DHCR24 | HGNC:2859 | desmosterolosis | MONDO:0011217 | AR | Definitive"
      explanation: >-
        ClinGen's Prenatal Gene Curation Expert Panel classifies the
        DHCR24-desmosterolosis relationship (autosomal recessive) as Definitive
        (2025).
  notes: >-
    About 16 patients from 15 families are reported with 15 DHCR24 variants, mostly
    missense, with nonsense, frameshift and splice alleles in compound heterozygosity.
    Missense variants in or near the FAD-binding pocket (for example p.Arg94His,
    p.Met169Thr) are predicted to be structurally most severe and are associated with
    the highest desmosterol levels; macrocephaly was reported with these and
    microcephaly with p.Glu191Lys and p.Arg103Cys, but overall genotype-phenotype
    correlation is weak.

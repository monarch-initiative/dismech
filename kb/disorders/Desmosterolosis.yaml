    reference_title: "Mutations in the 3beta-hydroxysterol Delta24-reductase gene cause desmosterolosis, an autosomal recessive disorder of cholesterol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sequence analysis of DHCR24 in two patients with desmosterolosis revealed four different missense mutations, which were shown, by functional expression, in yeast, of the patient alleles, to be disease causing."
    explanation: Gene discovery with functional confirmation of patient alleles.

name: Desmosterolosis
creation_date: "2026-11-27T14:08:09Z"
category: Mendelian
disease_term:
  preferred_term: desmosterolosis
  term:
    id: MONDO:0011217
    label: desmosterolosis
synonyms:
- DHCR24-related desmosterolosis
- DHCR24 deficiency
- 24-dehydrocholesterol reductase deficiency
- 3beta-hydroxysterol delta24-reductase deficiency
- DHCR24-related sterol biosynthesis disorder
description: >-
  Autosomal recessive disorder of the final step of cholesterol biosynthesis caused
  by biallelic DHCR24 variants. DHCR24 encodes 3beta-hydroxysterol Delta24-reductase,
  the FAD-dependent, NADPH-requiring enzyme that reduces the Delta24 double bond of
  sterol intermediates and converts desmosterol to cholesterol. Its loss raises
  desmosterol in plasma, tissues and cultured cells, in plasma by 50-fold or more
  in reported patients, while plasma cholesterol is often normal. About 16 patients
  had been described by 2023, with single cases reported since.
  The consistent core is developmental delay with intellectual disability, failure
  to thrive, spasticity, and dysgenesis of the corpus callosum with cerebral white
  matter loss; microcephaly or macrocephaly, micrognathia, cleft palate, joint
  contractures, seizures and eye-movement abnormalities are frequent. The first,
  lethal case also had short limbs, generalised osteosclerosis, total anomalous
  pulmonary venous drainage and ambiguous genitalia, and heart defects occur in
  some other patients. Genotype-phenotype correlation is weak. No
  disease-specific treatment is established.
parents:
- cholesterol biosynthetic process disease
- neonatal osteosclerotic dysplasia
notes: >-
  Lump/split: desmosterolosis (MONDO:0011217, with OMIM 602398 and ORPHA:35107 as
  MONDO cross-references) is defined by DHCR24 deficiency, so the name is already
  gene-specific and is kept. MONDO places it under neonatal osteosclerotic dysplasia
  (MONDO:0019702) because the first reported infant had generalised osteosclerosis;
  most later patients have no skeletal sclerosis. No GeneReviews chapter covers
  desmosterolosis (the Bookshelf index lists none), so the phenotype baseline comes
  from the published case series and their reviews, chiefly the 2011 Bedouin kindred
  (PMID:21559050), the 2014 minimal-phenotype comparison (PMID:24961299) and the 2023
  pooled analysis of 13 patients with clinical data (PMID:38239854). Elevated plasma
  desmosterol also occurs with amiodarone and other drugs that inhibit DHCR24
  (PMID:32415867); that acquired state is not this disease. ClinGen classifies DHCR24-desmosterolosis as
  Definitive (2025), recorded in gene_disease_validity.

diagnosis:
- name: Plasma sterol analysis
  description: >-
    Sterol quantitation (gas chromatography-mass spectrometry or LC-MS/MS) showing
    markedly raised desmosterol is the first step. Because the clinical features are
    nonspecific, sterol screening is recommended early in the evaluation of a child
    with corpus callosum dysgenesis, white matter loss, micrognathia and
    developmental delay.
  evidence:
  - reference: PMID:29175559
    reference_title: "Desmosterolosis presenting with multiple congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial evaluation can be performed using sterol quantitation, followed by genetic testing."
    explanation: Recommended diagnostic sequence.
  - reference: PMID:24961299
    reference_title: "Desmosterolosis: an illustration of diagnostic ambiguity of cholesterol synthesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonspecific features of desmosterolosis make it difficult to suspect clinically and therefore screening for it should be entertained early in the diagnostic evaluation."
    explanation: Early sterol screening recommended.
- name: DHCR24 molecular testing
  description: >-
    Biallelic DHCR24 pathogenic variants confirm the diagnosis; exome sequencing has
    made the diagnosis prenatally and in trios.
  evidence:
  - reference: PMID:29175559
    reference_title: "Desmosterolosis presenting with multiple congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing confirmed the diagnosis with a homozygous likely pathogenic mutation (p.Glu191Lys) in the DHCR24 gene."
    explanation: Genetic confirmation after sterol analysis.
  - reference: PMID:36538928
    reference_title: "First case of desmosterolosis diagnosed by prenatal whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis was made on whole exome sequencing after amniocentesis due to complex antenatal abnormalities including cerebellar hypoplasia, microgyria, aortic stenosis, and renal tract abnormalities."
    explanation: Prenatal diagnosis by exome sequencing.
differential_diagnoses:
- name: Smith-Lemli-Opitz syndrome
  disease_term:
    preferred_term: Smith-Lemli-Opitz syndrome
    term:
      id: MONDO:0010035
      label: Smith-Lemli-Opitz syndrome
  description: >-
    DHCR7 deficiency, the step that converts 7-dehydrocholesterol to cholesterol.
    The malformation patterns overlap; the sterol profile separates them
    (7-dehydrocholesterol raised in SLOS, desmosterol in desmosterolosis).
  evidence:
  - reference: PMID:33524375
    reference_title: "Generation and validation of a conditional knockout mouse model for desmosterolosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Genetic loss of this enzyme results in desmosterolosis (MIM #602398), a rare disease that presents with multiple congenital anomalies, features of which overlap with subjects with the Smith-Lemli-Opitz syndrome (another post-squalene cholesterol disorder)."
    explanation: Clinical overlap with SLOS.
  - reference: PMID:24961299
    reference_title: "Desmosterolosis: an illustration of diagnostic ambiguity of cholesterol synthesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All other sterols measured (Supplementary methods) including cholesterol and 7-dehydrocholesterol were within normal range compared to healthy controls."
    explanation: Normal 7-dehydrocholesterol distinguishes desmosterolosis from SLOS.
- name: Raine syndrome
  disease_term:
    preferred_term: lethal osteosclerotic bone dysplasia
    term:
      id: MONDO:0009821
      label: lethal osteosclerotic bone dysplasia
  description: >-
    Lethal osteosclerotic dysplasia (FAM20C) that resembles the first, lethal
    desmosterolosis case; desmosterol is not raised.
  evidence:
  - reference: PMID:9450875
    reference_title: "Clinical phenotype of desmosterolosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A phenotypic overlap of this case with Raine syndrome was noted; however, desmosterol accumulation was not found on postmortem tissue samples from a previously reported case of this disorder."
    explanation: Overlap with Raine syndrome, separated by sterol analysis.
treatments:
- name: Antiseizure Medication
  description: >-
    Standard antiseizure medication for seizures; in one patient phenobarbital lost
    effect by two months of age and was replaced by levetiracetam. No
    desmosterolosis-specific seizure regimen has been studied.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38239854
    reference_title: "Exploiting in silico structural analysis to introduce emerging genotype-phenotype correlations in DHCR24-related sterol biosynthesis disorder: a case study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An antiepileptic therapy with phenobarbital was established, becoming ineffective at the age of 2 months when it was replaced with levetiracetam."
    explanation: Antiseizure treatment in one patient.
- name: Cofactor Supplementation
  description: >-
    Riboflavin, nicotinamide and thiamine were given to one patient to try to augment
    residual DHCR24 activity through its FAD and NADPH cofactors. Desmosterol did not
    fall at 13 months, though adherence was uncertain. Experimental; no disease-specific
    treatment is established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: nicotinamide
      term:
        id: CHEBI:17154
        label: nicotinamide
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
  target_mechanisms:
  - target: DHCR24 Loss of Function
    description: Intended to raise residual enzyme activity by supplying cofactor precursors.
  evidence:
  - reference: PMID:21671375
    reference_title: "Desmosterolosis-phenotypic and molecular characterization of a third case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, we hypothesized that treatment of desmosterolosis with riboflavin, nicotinamide, and thiamine might augment DHCR24 activity in patients with desmosterolosis."
    explanation: Rationale for the trial.
  - reference: PMID:21671375
    reference_title: "Desmosterolosis-phenotypic and molecular characterization of a third case and review of the literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "While treatment in our patient was initiated with riboflavin 15, nicotinamide 100, and thiamine 15 mg/kg/day, there were major concerns regarding non-compliance and a follow-up sterol analysis by GC/MS at 13 months of life showed no significant decrease in desmosterol levels and the cholesterol level stayed close to the normal range."
    explanation: No biochemical response in the one treated patient.
  - reference: PMID:21671375
    reference_title: "Desmosterolosis-phenotypic and molecular characterization of a third case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No definitive treatment for disorders of cholesterol biosynthesis is available to date."
    explanation: No established disease-modifying therapy.
animal_models:
- name: Dhcr24 knockout mouse
  species: Mouse
  genotype: Dhcr24 -/-
  publication: PMID:16410790
  description: >-
    Global knockout. Desmosterol replaces cholesterol in tissues including the brain,
    neurons show increased arborization and cultured bones grow poorly, but pups die
    within hours to a day of birth from a lethal dermopathy.
  modeled_mechanisms:
  - target: Desmosterol Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Reproduces the biochemical phenotype.
    evidence:
    - reference: PMID:16410790
      reference_title: "DHCR24 gene knockout mice demonstrate lethal dermopathy with differentiation and maturation defects in the epidermis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Accordingly, cholesterol was not detected whereas desmosterol was abundant in the epidermis of DHCR24-/- mice."
      explanation: Desmosterol replaces cholesterol in knockout tissue.
    - reference: PMID:30891795
      reference_title: "Desmosterolosis and desmosterol homeostasis in the developing mouse brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our HPLC-MS/MS studies revealed that by P0 desmosterol almost entirely replaced cholesterol in the Dhcr24-KO brain."
      explanation: Desmosterol replaces cholesterol in the newborn brain.
  - target: Aberrant Neuronal Arborization
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Source of the neuronal morphology finding.
    limitations: >-
      No neuronal morphology data exist from patients, so whether the human brain
      shows the same change is unknown.
    evidence:
    - reference: PMID:30891795
      reference_title: "Desmosterolosis and desmosterol homeostasis in the developing mouse brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cultured Dhcr24-KO neurons showed increased arborization, which was also present in the Dhcr24-KO mouse brains."
      explanation: Neuronal arborization phenotype in the knockout.
  - target: Growth Plate Chondrocyte Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cultured knockout metatarsal bones show retarded growth and chondrocyte defects.
    limitations: >-
      Studied in bone explants cultured from newborns, because the mice die soon after
      birth.
    evidence:
    - reference: PMID:21845517
      reference_title: "3β-Hydroxysterol-Delta24 reductase plays an important role in long bone growth by protecting chondrocytes from reactive oxygen species."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The growth of bones from KO mice was significantly retarded after 1 week of culture."
      explanation: Retarded growth of cultured knockout bones.
- name: Liver-specific Dhcr24 conditional knockout mouse
  species: Mouse
  genotype: Dhcr24 flx/flx; Alb-Cre
  publication: PMID:33524375
  description: >-
    Hepatocyte-specific deletion. Mice grow and breed normally while accumulating
    desmosterol in plasma and liver; the floxed allele allows tissue- and
    stage-specific deletion.
  modeled_mechanisms:
  - target: Desmosterol Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces plasma and hepatic desmosterol accumulation.
    limitations: >-
      Liver-only deletion after the developmental window, so it does not model the
      brain or malformation phenotype.
    evidence:
    - reference: PMID:33524375
      reference_title: "Generation and validation of a conditional knockout mouse model for desmosterolosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Dhcr24flx/flx,Alb-Cre mice showed normal growth and fertility, while accumulating significantly elevated levels of desmosterol in plasma and liver."
      explanation: Biochemical phenotype in the conditional model.
discussions:
- discussion_id: desmosterolosis-mouse-dermopathy-mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does global Dhcr24 loss kill mice within a day from a skin barrier defect,
    when patients survive and have no comparable skin disease?
  attaches_to:
  - pathophysiology#Desmosterol Accumulation
  rationale: >-
    The global knockout reproduces the human sterol profile but dies of a lethal
    dermopathy with abnormal epidermal differentiation, which is not described in
    patients. Its early death has limited the study of the postnatal brain and
    skeletal disease, the reason a conditional allele was made. Whether residual
    enzyme activity from human missense alleles, maternal cholesterol supply or a
    species difference in epidermal sterol requirements explains the gap is not
    known.
- discussion_id: desmosterolosis-cholesterol-versus-desmosterol
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the brain and malformation phenotypes caused by cholesterol shortage, by
    excess desmosterol, or by both?
  attaches_to:
  - pathophysiology#Impaired Cholesterol Synthesis
  - pathophysiology#Desmosterol Accumulation
  rationale: >-
    Plasma cholesterol is often normal in patients while desmosterol is raised 50-fold
    or more, and in knockout brains desmosterol largely replaces cholesterol, so
    the two cannot be separated in existing data. Desmosterol is a liver X receptor
    ligand with its own signalling activity.

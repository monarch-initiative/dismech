    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pathogenic variants lead to markedly reduced enzyme activity and consequent accumulation of desmosterol in plasma and tissues."
    explanation: Review synthesis of the disease mechanism.

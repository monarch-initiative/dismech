    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POI is a common cause of infertility, characterised by elevated follicle-stimulating hormone and amenorrhea in women under the age of 40."
    explanation: >-
      The definition of the ovarian phenotype, which is what makes it unascertainable before
      reproductive age.
genetic:
- name: MRPS7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MRPS7
    term:
      id: hgnc:14499
      label: MRPS7
  notes: >-
    MRPS7 encodes mitochondrial ribosomal protein S7, a 12S rRNA-binding protein of the small
    subunit of the mitoribosome, designated uS7m in the standardised mitoribosome nomenclature -
    the "u" prefix marking it as one of the subunits conserved from the bacterial ribosome rather
    than a mitochondria-specific addition.

    Gene identity, and how it was established. Neither MONDO nor the curation stub for this
    disease records a causal gene. The gene was resolved from the OMIM identifier: MONDO:0054741
    carries skos:exactMatch to OMIM:617872, and NCBI's mim2gene_medgen table maps MIM 617872 to
    Gene ID 51081, which is MRPS7 (hgnc:14499). The literature is consistent with that mapping -
    the 2015 report's title names MRPS7 and describes exactly the phenotype OMIM 617872 carries.

    How strong the relationship is. ClinGen's Mitochondrial Diseases Gene Curation Expert Panel
    classified MRPS7 against mitochondrial disease as **Limited** on 17 June 2024, and NCBI's
    mim2gene_medgen record for MIM 617872 carries the comment `question`, OMIM's marker for a
    provisional gene-phenotype relationship. Two independent resources therefore agree that this
    is a weakly established entity. Neither is cited as an evidence item: the ClinGen assertion is
    absent from the ClinGen snapshot this repository has pinned, and repinning that snapshot is a
    separate change from curating a disease. Both facts were read directly from the respective
    downloads, and the ClinGen row can be cited here once the pin is refreshed.

    Two traps for anyone extending this entry from the gene rather than from the disease. First,
    MRPS7 has a large and entirely unrelated cancer literature - it appears in prognostic gene
    signatures and, most substantially, as a driver of cisplatin resistance in nasopharyngeal
    carcinoma through beta-catenin stabilisation. None of that concerns this disease. Second, the
    gene is genuinely pleiotropic in dismech's own terms: the same biallelic variants underlie
    both this entity and the Perrault-syndrome presentation curated in `Perrault_Syndrome`, and
    the two entries deliberately overlap on the gene while differing on the phenotype they model.
  evidence:
  - reference: PMID:25556185
    reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data demonstrate the pathogenicity of the identified MRPS7 mutation as a novel cause of mitochondrial RC dysfunction, congenital sensorineural deafness and progressive hepatic and renal failure."
    explanation: The gene-disease relationship as claimed by the report that established it.
  - reference: PMID:25556185
    reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exogenous expression of wild-type MRPS7 in patient fibroblasts rescued complexes I and IV activities, demonstrating the deleterious effect of the mutation on RC function."
    explanation: >-
      The complementation result that converts a variant association into a causal claim, and the
      only functional evidence in the entity.
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This second independent report validates that variants in MRPS7 are a cause of syndromic POI/Perrault syndrome."
    explanation: >-
      The second family, and the second identity it gave the gene. Cited here because independent
      replication is what the gene-disease relationship most needed, even though the disease label
      the authors use is not this entry's.
  - reference: PMID:38855161
    reference_title: Molecular pathways in mitochondrial disorders due to a defective mitochondrial protein synthesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, mutations in genes MRPS2, MRPS7, MRPS9, MRPS14, MRPS16, MRPS22, MRPS23, MRPS25, MRPS28, MRPS34 and MRPS39, which encode mt-SSU subunits, and genes MRPL3, MRPL12, MRPL24, MRPL44 and MRPL50 which encode mt-LSU subunits have been linked to mitochondrial disorders"
    explanation: >-
      MRPS7 placed within the set of mitoribosomal-protein disease genes. Quoted as the flattened
      gene list because that is where the statement sits in the source. Graded OTHER because a
      review's enumeration is an expert synthesis rather than a study.
diagnosis:
- name: Combined respiratory-chain deficiency followed by exome sequencing
  description: >-
    The diagnostic logic in the founding family runs from the biochemistry to the gene. A
    *combined* deficiency of complexes I, III and IV - sparing complex II, the one complex with no
    mtDNA-encoded subunit - localises the lesion to mitochondrial gene expression, which narrows
    an otherwise unmanageable candidate list to the mitoribosome, the mitochondrial
    aminoacyl-tRNA synthetases, the translation factors and mtDNA maintenance. Whole-exome
    sequencing then names the gene. There is no MRPS7-specific biomarker and nothing that
    distinguishes this entity from any other mitochondrial translation defect short of sequencing.

    The second family reached the same gene from the opposite direction, through an exome
    performed for premature ovarian insufficiency. That is worth recording as a diagnostic route
    in its own right: a patient can arrive at this gene through a reproductive-endocrine
    presentation with no mitochondrial-disease workup at all.
  evidence:
  - reference: PMID:25556185
    reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional defects of the mitochondrial translation machinery, as a result of mutations in nuclear-encoded genes, have been associated with combined oxidative phosphorylation (OXPHOS) deficiencies."
    explanation: The inference from a combined OXPHOS deficiency to the translation machinery, which is the diagnostic step.
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The co-occurrence of POI with sensorineural hearing loss indicates Perrault syndrome."
    explanation: >-
      The clinical rule that took the second family to a genetic workup, and the reason that
      workup was framed as Perrault syndrome rather than as mitochondrial disease.
experimental_models:
- name: Lentiviral wild-type MRPS7 complementation of patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Patient fibroblasts from the 2015 family were complemented with wild-type MRPS7. Two
    independent readouts recovered: complex I and complex IV enzyme activities, and 12S rRNA
    transcript level. This is the only functional experiment in the entity, and it does two things
    at once - it establishes causation, and it orders the molecular events, since the rRNA deficit
    is corrected by supplying the protein.
  modeled_mechanisms:
  - target: Combined Deficiency of Respiratory Chain Complexes I, III and IV
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type MRPS7 to the patients' own cells restores respiratory-chain activity,
      which demonstrates that the MRPS7 variant rather than something else in that genome causes
      the combined deficiency.
    limitations: >-
      A cultured fibroblast, so it says nothing about liver, kidney, cochlea or ovary - the four
      tissues that carry the clinical phenotype. The rescue is reported for complexes I and IV;
      complex III, although deficient, is not named among the rescued activities, and the source
      does not say whether it was assayed. Only the 2015 family was tested; the 2022 alleles have
      no functional data at all. Lentiviral overexpression is non-physiological in level and
      timing.
    readouts:
    - name: Complex I and complex IV enzyme activities after wild-type MRPS7 expression
      target: Combined Deficiency of Respiratory Chain Complexes I, III and IV
      direction: RESTORED
      interpretation: >-
        Both activities recover in complemented patient fibroblasts. The magnitude of recovery is
        not given in the source available here.
      evidence:
      - reference: PMID:25556185
        reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Exogenous expression of wild-type MRPS7 in patient fibroblasts rescued complexes I and IV activities, demonstrating the deleterious effect of the mutation on RC function."
        explanation: The enzymatic readout of the rescue, naming the two complexes measured.
    evidence:
    - reference: PMID:25556185
      reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Exogenous expression of wild-type MRPS7 in patient fibroblasts rescued complexes I and IV activities, demonstrating the deleterious effect of the mutation on RC function."
      explanation: Establishes that this cell system is informative for the enzyme-deficiency node it is linked to.
  - target: Reduced 12S rRNA and Impaired Small Subunit Assembly
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      The same complementation restores 12S rRNA to normal levels, which is what establishes the
      direction of the relationship between the protein defect and the rRNA loss.
    limitations: >-
      Transcript level is a proxy for subunit assembly rather than a measurement of it; no
      sucrose-gradient, blue-native or complexome profile of the mitoribosome in patient cells is
      reported, so the assembly claim in the node this links to is inferred from rRNA abundance
      and translation output rather than observed directly.
    readouts:
    - name: 12S rRNA transcript level after wild-type MRPS7 expression
      target: Reduced 12S rRNA and Impaired Small Subunit Assembly
      direction: RESTORED
      interpretation: >-
        12S rRNA returns to normal levels when wild-type MRPS7 is supplied, placing the rRNA
        deficit downstream of the protein defect.
      evidence:
      - reference: PMID:25556185
        reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Moreover, reduced 12S rRNA transcript levels observed in the patient's fibroblasts were also restored to normal levels by exogenous expression of wild-type MRPS7."
        explanation: The rRNA readout of the rescue.
    evidence:
    - reference: PMID:25556185
      reference_title: "Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, reduced 12S rRNA transcript levels observed in the patient's fibroblasts were also restored to normal levels by exogenous expression of wild-type MRPS7."
      explanation: Establishes that this cell system is informative for the rRNA and assembly node.
treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists for COXPD34 and none has been trialled; the literature is
    three case descriptions with no treatment arm. Management is the supportive care used across
    mitochondrial disease and directed at the organs that fail - hearing rehabilitation, hepatic
    and renal support, and hormone replacement where premature ovarian insufficiency is present.
    None of that is specific to MRPS7, and none of it is reported for these patients in the
    sources cited here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded with no evidence block and no target_mechanisms link, deliberately. There is no
    MRPS7-specific treatment publication to cite, an evidence item requires an exact quote
    supporting the specific claim, and asserting a mechanism link would claim an effect on the
    pathograph that nothing demonstrates.
discussions:
- discussion_id: coxpd34_two_entities_one_gene
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - disease#Combined Oxidative Phosphorylation Deficiency 34
  - phenotypes#Premature Ovarian Insufficiency
  prompt: >-
    Is COXPD34 a separate entity from MRPS7-related Perrault syndrome, or are they one disease
    ascertained at two ages?
  rationale: >-
    The three published MRPS7 patients are all female, all have sensorineural hearing loss, and
    the two who reached reproductive age both have premature ovarian insufficiency. That is
    Perrault syndrome in two of three. What separates the OMIM 617872 phenotype is the hepatorenal
    failure of the severely affected sister - and she died before her reproductive phenotype could
    be known, so nobody can say whether she would also have had POI.

    Read one way, MRPS7 causes a single disease whose severe end kills in adolescence and whose
    mild end presents to a fertility clinic, and the two names are an artefact of which specialist
    saw the patient. Read the other way, the hepatorenal course is a genuinely distinct
    presentation deserving its own entity. dismech currently curates both readings - this entry
    and the MRPS7 gene record in `Perrault_Syndrome` - which is honest about the uncertainty but
    means the same three patients appear in two places. Three patients is not enough to settle it;
    a fourth family, particularly one with a male sibling or with a liver phenotype ascertained
    after puberty, would be.
- discussion_id: coxpd34_limited_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic MRPS7 Variants
  prompt: >-
    Do the 2022 MRPS7 alleles cause a mitoribosomal defect, or are they only predicted to?
  rationale: >-
    ClinGen classifies MRPS7 against mitochondrial disease as Limited, and OMIM flags the
    gene-phenotype mapping as provisional. The reason is visible in the two reports: all of the
    functional evidence - impaired translation, reduced 12S rRNA, complementation rescue - comes
    from a single family homozygous for one missense allele. The second family's nonsense and
    missense alleles were called pathogenic on in-silico prediction alone, with no protein,
    transcript, assembly or respiratory-chain measurement. A single functional study of the
    p.(Lys125*) and p.(Arg179His) alleles would move this relationship materially, and is the
    cheapest available way to do so.
  proposed_experiments:
  - experiment_id: exp_coxpd34_second_family_function
    name: Functional characterisation of the 2022 MRPS7 alleles
    description: >-
      Measure MRPS7 protein and transcript abundance, mitoribosomal small-subunit assembly by
      sucrose-gradient or complexome profiling, mitochondrial translation by pulse labelling, and
      respiratory-chain enzyme activities in fibroblasts from the compound-heterozygous 2022
      patient, with wild-type MRPS7 complementation as the control - reproducing in that family
      the experiment already done in the first.
    would_support:
    - pathophysiology#Reduced 12S rRNA and Impaired Small Subunit Assembly
    - pathophysiology#Impaired Mitochondrial Protein Synthesis
    supporting_outcome:
    - >-
      The compound-heterozygous cells show reduced MRPS7, a small-subunit assembly defect, reduced
      mitochondrial translation and a combined respiratory-chain deficiency, all corrected by
      wild-type MRPS7.
    refuting_outcome:
    - >-
      Mitoribosome assembly, translation and respiratory-chain activity are normal in the
      compound-heterozygous cells, which would leave the ovarian phenotype in that family
      unexplained by a mitoribosomal mechanism.
    readouts:
    - name: Mitochondrial translation output in the 2022 patient's fibroblasts
      target: pathophysiology#Impaired Mitochondrial Protein Synthesis
      direction: DECREASED
      interpretation: >-
        Reduced incorporation into the thirteen mtDNA-encoded products would replicate the founding
        family's central finding in an independent genotype.
notes: >-
  Scope and shape. entry_type DISEASE, standalone, consistent with how dismech curates the rest of
  the numbered COXPD series (defects 4, 7, 13, 21, 23, 26, 30 and deficiencies 42, 48, 51 are all
  separate files). The stub is deleted because MONDO:0054741 is now bound by this entry's
  disease_term.

  Relationship with Perrault_Syndrome. This is the one thing a reviewer should look at hardest.
  MRPS7 is already curated as a causative gene in `Perrault_Syndrome`, on the strength of the same
  two publications, and that entry's own notes describe exactly this pattern - a pleiotropic gene
  whose other phenotype is curated separately and cross-referenced rather than imported. This entry
  follows the same convention in the opposite direction: it models the hepatorenal, lactic-acidemic
  presentation that OMIM 617872 names, records the ovarian phenotype because two of the three
  published patients have it, and points at `Perrault_Syndrome` rather than re-curating the
  Perrault phenotype. An OPEN_QUESTION discussion records that the two may be one disease seen at
  two ages, which three patients cannot settle.

  Gene identity. Neither MONDO nor the stub records a causal gene for MONDO:0054741. MRPS7
  (hgnc:14499) was resolved through the OMIM exact match - MONDO:0054741 to OMIM:617872 to NCBI
  Gene 51081 in mim2gene_medgen - and is corroborated by the founding paper's own title. Note
  hgnc:14499 and not hgnc:14508, which is MRPS22, a different mitoribosomal small-subunit gene
  curated elsewhere in this repository.

  ClinGen and OMIM are not cited as evidence items, and that is deliberate. ClinGen's June 2024
  MRPS7 assertion (Limited) is absent from the ClinGen gene-validity snapshot pinned in
  `data/clingen/MANIFEST.yaml`, and building a cache file from a newer, unpinned download would
  commit an artifact that cannot be reproduced from the pin - a manifest repin is its own change,
  not part of a curation PR. Both the ClinGen classification and the OMIM provisional flag are
  recorded in the `genetic` notes with their sources named, and both were read directly from the
  respective downloads rather than inferred.

  Module conformance and node naming. The Impaired Oxidative Phosphorylation node declares
  `conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress`, following
  the sibling entry COXPD48, which conforms its equivalent node to the same target. Only the
  oxidative-phosphorylation half of that module node's effector state is claimed: the module also
  pairs it with rising reactive oxygen species, and no ROS measurement has been reported in an
  MRPS7 patient.

  One node name still reads as a bundle and is kept deliberately: "Reduced 12S rRNA and Impaired
  Small Subunit Assembly". The two are one claim rather than two - 12S rRNA transcript level is
  the measurement that was made, and small-subunit assembly is what it stands for - and the node
  and the model link both say so, including that no gradient or complexome profile of the
  mitoribosome in patient cells exists. Naming it for the assembly alone would assert a
  measurement that was not made; naming it for the rRNA alone would lose the mechanism.

  Two corrections this entry took from its deep-research report. The report is on the right
  disease - MRPS7 is mentioned 45 times and dominates its gene counts - and it independently
  resolved the same gene and OMIM numbers this entry did. It corrected the standardised
  mitoribosome name for the protein, which is uS7m rather than mS7, and it reports from the 2022
  paper's full text an additional similarly affected sister whose genotype was not given. The
  first correction is applied; the second is recorded in the prevalence notes as an unverifiable
  count caveat rather than folded into the denominators, because the abstract available in the
  reference cache does not mention her.

  What is not here. No animal model of MRPS7 deficiency was found. No dataset accession is
  recorded, because no MRPS7 patient omics deposit was identified. No prevalence rate, no
  natural-history series, no treatment evidence, and no residual-activity percentages exist for
  this entity; the numbers behind the "combined deficiency of complexes I, III and IV" statement
  are not in the abstract, which is all that was retrievable for the 2015 paper.

  The gene-symbol trap. MRPS7 carries a substantial oncology literature - prognostic gene
  signatures, and a mechanistic role in cisplatin resistance in nasopharyngeal carcinoma via
  beta-catenin stabilisation. A search on the symbol returns those in preponderance over the two
  patient reports.

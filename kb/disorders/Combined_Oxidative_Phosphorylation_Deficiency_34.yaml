    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Zygosity differs between the two families - homozygous in the 2015 siblings, compound
      heterozygous in the 2022 patient - so no single zygosity value describes the entity and the
      slot is left unset rather than asserting one family's configuration for both.
    notes: >-
      LOSS_OF_FUNCTION rests on the 2015 family alone, where wild-type MRPS7 complementation
      restored respiratory-chain activity and 12S rRNA levels in patient fibroblasts. The 2022
      alleles were not functionally tested; a nonsense allele at codon 125 of a 242-residue
      protein is a plausible null, but that is an inference and no protein or transcript
      measurement was reported for it.

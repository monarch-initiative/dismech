prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Three patients in two families, reported in 2015 and 2022, and no further case found in a
    September 2026 PubMed and Europe PMC search on the gene symbol. No population estimate exists
    and none could be made: both families were ascertained through diagnostic exome sequencing,
    the first from a mitochondrial-disease phenotype and the second from a premature ovarian
    insufficiency phenotype. The prevalence_class is the numeric floor tier; no rate_per_100000 is
    given because none has been reported.

    One caveat on the count of three. The falcon deep-research report committed alongside this
    entry states, from the full text of the 2022 paper, that the second family also included a
    similarly affected sister whose genotype was not reported. The abstract - which is all that
    was retrievable into the reference cache - does not mention her, so that fourth individual
    could not be verified against a quotable source and is not counted in the denominators used
    throughout this entry. If she is real, every "of 3" figure below is a "of 4" with an
    ungenotyped member, which would not change any band.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in MRPS7 have been described only once in the literature and were identified in sisters, one of whom presented with congenital sensorineural hearing loss and POI, consistent with our patient phenotype."
    explanation: >-
      The size of the literature as of the second report - one prior publication, in one sibship.
progression:
- phase: Congenital and infantile presentation in the hepatorenal form
  notes: >-
    In the 2015 family the deafness is congenital and the lactic acidemia was present at
    presentation. The severe sister's hepatic and renal failure was progressive and ended in death
    in early adolescence; her sister survived to reproductive age. Fatal-outcome content is
    recorded here rather than as a phenotype, since the relevant HPO mortality terms sit outside
    the phenotype enum.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other affected sister had a more severe disease course and died in early adolescence due to liver and renal failure before the reproductive phenotype was known."
    explanation: The age and cause of death in the severe sibling.
- phase: Reproductive-age presentation in the ovarian form
  notes: >-
    The ovarian phenotype cannot appear until reproductive age, which is why it was absent from the
    2015 report and only recognised in the surviving sister later. This is a genuine natural-history
    feature of the entity rather than an artefact of reporting, and it means that any patient
    diagnosed in infancy has an unascertained reproductive phenotype - the reason the ovarian
    frequency band in this entry carries an explicit denominator caveat.
  evidence:
  - reference: PMID:36421788

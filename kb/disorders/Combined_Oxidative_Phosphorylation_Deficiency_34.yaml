    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a homozygous mutation in the gene encoding mitochondrial ribosomal protein S7 (MRPS7), a c.550A>G transition that encodes a substitution of valine for a highly conserved methionine (p.Met184Val) in both affected siblings."
    explanation: Homozygosity for one allele in both affected siblings, which is the recessive segregation in the first family.
  - reference: PMID:36421788

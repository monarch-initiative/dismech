- name: Impaired Oxidative Phosphorylation
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    With three of the four electron-transport complexes deficient, oxidative ATP synthesis falls.
    This is the bioenergetic endpoint that disease-specific mitochondrial lesions converge on,
    and the node conforms to the shared mitochondrial_dysfunction module at that point, as the
    sibling entry COXPD48 does.

    The module's central effector state pairs falling oxidative phosphorylation with rising
    reactive oxygen species. Only the first half is claimed here: no ROS measurement has been
    reported in an MRPS7 patient, and asserting the second half would import a claim from the
    module rather than from this disease.

    The consequence of the failing chain that these patients actually show is downstream - the
    cytosolic redox shift and the lactic acidemia, which are their own node.

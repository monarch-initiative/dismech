name: Combined Oxidative Phosphorylation Deficiency 34
category: Mendelian
creation_date: "2026-09-09T00:00:00Z"
synonyms:
- COXPD34
- combined oxidative phosphorylation deficiency type 34
- syndromic sensorineural deafness due to combined oxidative phosphorylation defect
- syndromic sensorineural hearing loss due to COXPD
- MRPS7-related combined oxidative phosphorylation deficiency
- MRPS7 deficiency
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 34
  term:
    id: MONDO:0054741
    label: combined oxidative phosphorylation deficiency 34
description: >-
  COXPD34 is the combined oxidative phosphorylation deficiency caused by biallelic variants in
  MRPS7. It is one of the smallest entities in the numbered COXPD series: three patients in
  two families, reported in 2015 and 2022, and nothing since.

  MRPS7 encodes a protein of the small (28S) subunit of the mitochondrial ribosome, where it
  binds the 12S ribosomal RNA and is required for assembly of that subunit. The mitoribosome
  translates the thirteen mtDNA-encoded proteins, all of which are subunits of complexes I,
  III, IV and V, so a defect in it produces a *combined* respiratory-chain deficiency rather
  than the isolated single-complex defect seen when a nuclear subunit gene fails. That is what
  places this entity in the COXPD series rather than among the complex I deficiencies.

  The lesion was defined in two sisters homozygous for c.550A>G, p.Met184Val, a substitution
  at a highly conserved methionine. Their fibroblasts and liver showed combined deficiency of
  complexes I, III and IV; pulse labelling showed impaired mitochondrial protein synthesis; and
  12S rRNA transcript levels were reduced. Expressing wild-type MRPS7 in the patients'
  fibroblasts restored both complex I and complex IV activity and the 12S rRNA level - the
  complementation that establishes causation and, incidentally, shows that the 12S rRNA loss is
  downstream of the protein defect rather than a separate lesion.

  Clinically the two sisters shared congenital sensorineural deafness and lactic acidemia and
  then diverged sharply: one developed progressive hepatic and renal failure and died in early
  adolescence, while the other survived to be recognised, years later, as having premature
  ovarian insufficiency. That second phenotype is why the entity has a second identity. When a
  third patient was reported in 2022 - compound heterozygous for p.(Lys125*) and p.(Arg179His),
  with POI, sensorineural hearing loss and Hashimoto's disease - the authors framed the gene as
  a cause of syndromic POI and Perrault syndrome, not as a cause of COXPD34. dismech curates
  both readings: this entry covers the hepatorenal, lactic-acidemic presentation that OMIM
  617872 names, and `Perrault_Syndrome` carries MRPS7 as one of its causative genes. Neither is
  the whole gene, and the entry says so rather than annexing the other phenotype.

  The evidence base is thin and the entry is written to that. ClinGen's Mitochondrial Diseases
  expert panel classifies the MRPS7 gene-disease relationship as Limited, and OMIM's own
  gene-phenotype mapping for 617872 is flagged provisional. There is no animal model, no
  natural-history series, no prevalence estimate and no treatment evidence.

    explanation: >-
      The second family's biallelic configuration, which is compound heterozygous rather than
      homozygous - so the recessive claim does not rest on consanguinity alone.
pathophysiology:
- name: Biallelic MRPS7 Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of MRPS7. Three alleles are known across the two published families. The
    2015 sisters are homozygous for c.550A>G, p.Met184Val, replacing a highly conserved
    methionine. The 2022 patient carries c.373A>T, p.(Lys125*), a nonsense allele, in trans with
    c.536G>A, p.(Arg179His); both were novel at the time of report and were called pathogenic on
    in-silico prediction rather than on a functional assay, which is a real limit on that
    family's molecular evidence.

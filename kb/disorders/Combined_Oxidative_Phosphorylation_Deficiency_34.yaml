inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Both families are biallelic. The 2015 sisters are homozygous for a single missense allele;
    the 2022 patient is compound heterozygous for a nonsense and a missense allele. MRPS7 is
    nuclear-encoded and autosomal, so despite the mitochondrial phenotype this is a nuclear
    recessive disease with a 25 percent sibling recurrence risk and no maternal transmission.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

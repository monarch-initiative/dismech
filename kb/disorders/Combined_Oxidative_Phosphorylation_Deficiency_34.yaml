  downstream:
  - target: Destabilization of the uS7m Protein of the Mitoribosomal Small Subunit
    causal_link_type: DIRECT
- name: Destabilization of the uS7m Protein of the Mitoribosomal Small Subunit
  biological_scale: MOLECULAR
  description: >-
    MRPS7 is a 12S ribosomal-RNA-binding protein of the small subunit of the mitochondrial
    ribosome and is required for that subunit's assembly. The mammalian mitoribosome is a 55S
    particle built from a 28S small subunit - 12S rRNA plus about thirty nuclear-encoded
    proteins - and a 39S large subunit, with the proteins arranged largely on the periphery
    around the catalytic RNA core. A missense change at a conserved residue in one of those
    thirty proteins is therefore a defect in the scaffold that holds the rRNA in place, not in
    a catalytic site.

    The general rule established across mitoribosomal-protein disease is that such variants
    reduce the steady-state level of the affected protein, and this entry follows that reading.
    No direct measurement of MRPS7 protein abundance in patient cells is reported in the sources
    cited here, so this node is an inference from the assembly and rRNA phenotypes below rather
    than a measured quantity.

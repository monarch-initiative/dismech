animal_models:
- name: Ano6-deficient mouse
  species: Mouse
  genotype: Ano6 knockout (homozygous and heterozygous deficiency)
  publication: PMID:26481309
  description: >-
    The model that established the disorder's platelet phenotype as
    ANO6-specific. Ano6-deficient mice reproduce the full complex of patient
    platelet changes - normal aggregation with markedly reduced
    phosphatidylserine exposure, reduced calcium-dependent swelling and membrane
    blebbing, and reduced calpain-dependent protein cleavage - while mice
    deficient in ANO1 or the Gardos channel do not. It also reveals that ANO6
    does more than scramble lipids, which is why the disorder's phenotype may be
    broader than the scramblase account alone predicts.
  modeled_mechanisms:
  - target: Loss of Calcium-Dependent Phospholipid Scrambling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the reduced phosphatidylserine exposure of patient platelets,
      with the ANO1 and Gardos-channel knockouts serving as specificity controls.
    limitations: >-
      Ano6 deficiency also reduces murine viability, which has no counterpart in
      the surviving patients, so the mouse is more severely affected than the
      human disorder. The additional murine phenotypes (swelling, blebbing,
      calpain-dependent cleavage) are reported as phenocopying the patient
      platelets but are not separately established as clinical features.
    readouts:
    - name: Calcium-induced platelet phosphatidylserine exposure
      target: Loss of Calcium-Dependent Phospholipid Scrambling
      direction: DECREASED
      interpretation: >-
        Direct functional correlate of the human scramblase deficiency.
      evidence:
      - reference: PMID:26481309
        reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "1) normal collagen-induced aggregate formation (P > 0.05) with reduced PS exposure (-65 to 90%); 2) lowered Ca(2+)-dependent swelling (-80%) and membrane blebbing (-90%); 3) reduced calpain-dependent protein cleavage (-60%)"
        explanation: >-
          Reports the quantified reduction in phosphatidylserine exposure
          together with the accompanying membrane responses.
    evidence:
    - reference: PMID:26481309
      reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Platelets from these mice were extensively analyzed on molecular functions and compared with platelets from a patient with Scott syndrome."
      explanation: >-
        The direct patient-versus-model comparison that makes this model
        informative for the human node.
diagnosis:
- name: Flow Cytometry for Platelet Phosphatidylserine Exposure and Microparticle Release
  description: >-
    The disorder cannot be diagnosed by the tests usually ordered for a bleeding
    patient. Platelet count, morphology, aggregometry and plasma coagulation
    screens are all normal or near-normal; elevated residual serum prothrombin
    provides a clue, and full diagnosis requires flow-cytometric measurement of
    activation-dependent platelet phosphatidylserine exposure (annexin V binding)
    and microparticle release upon dual thrombin-plus-collagen or calcium
    ionophore A23187 stimulation.
  diagnosis_term:
    preferred_term: platelet annexin V flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The major diagnostic clues are elevated residual levels of prothrombin in sera and a marked defect of platelet procoagulant activity. Full diagnosis requires flow cytometry measurements of platelet phosphatidylserine exposure (annexin V-binding) and microparticle release upon activation by thrombin in combination with collagen or by the ionophore"
    explanation: >-
      Specifies the diagnostic flow-cytometric annexin V binding and microparticle
      release assays after strong agonist or ionophore stimulation.
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scott syndrome is a rare bleeding disorder, characterized by altered Ca(2+)-dependent platelet signaling with defective phosphatidylserine (PS) exposure and microparticle formation"
    explanation: >-
      Names the two functional abnormalities on which laboratory diagnosis rests.
- name: ANO6 Molecular Genetic Testing
  description: >-
    Definitive molecular confirmation by sequencing and copy-number / deletion
    analysis of ANO6, as pathogenic genotypes include splice-site, nonsense, and
    multi-exon deletion alleles.
  diagnosis_term:
    preferred_term: ANO6 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For the original patient a homozygous variant at a splice acceptor site in intron 12 resulted in a premature stop codon.36 Two French siblings showed compound heterozygosity for a large deletion of exons 1-10 in one allele and a premature stop codon on the other."
    explanation: >-
      Demonstrates that molecular confirmation of ANO6 requires detecting both
      sequence variants and multi-exon deletions.
treatments:
- name: Perioperative and Acute Hemorrhage Prophylaxis with Platelet Transfusion
  description: >-
    No ANO6-specific targeted therapy exists. For major bleeding or prophylaxis
    prior to surgery or childbirth in inherited platelet function disorders with
    severe procoagulant defects, transfusion of normal donor platelets supplies
    phosphatidylserine-competent platelet membranes to restore local thrombin
    generation, alongside local hemostatic measures and antifibrinolytic agents.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Failure of Platelet Procoagulant Surface Formation
    treatment_effect: BYPASSES
    description: >-
      Transfused donor platelets provide normal calcium-activated phosphatidylserine
      surface exposure at sites of vascular injury.
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Procedures range from local measures to the use of platelet transfusions or recombinant activated FVII to stop major bleeding as well as the establishment of and adherence to standardized protocols for prophylaxis prior to surgery or childbirth."
    explanation: >-
      Describes standard hemostatic management across inherited platelet function
      disorders covered in the review (including Scott syndrome); graded INDIRECT
      because the management statement addresses the disorder class as a whole.
differential_diagnoses:
- name: Coagulation Factor Deficiencies
  description: >-
    The historical confusion, and still the natural first thought: the
    phenotype is one of impaired thrombin generation with a normal platelet
    count and normal aggregation, which is what a factor deficiency looks like.
    Excluded by normal plasma factor assays - the defect is in the surface, not
    in the factors.
  evidence:
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scramblase activity, biochemically characterized in the 1980s, is deficient in patients with Scott syndrome, a rare inherited bleeding disorder with defective platelet procoagulant activity."
    explanation: >-
      Locates the defect in platelet procoagulant activity rather than in the
      plasma coagulation factors, which is the discriminator.
- name: Other Inherited Platelet Function Disorders
  description: >-
    Bernard-Soulier syndrome, Glanzmann thrombasthenia, the storage pool
    diseases and the agonist-receptor defects all produce abnormal aggregometry.
    This disorder does not - preserved aggregation with a genuine bleeding
    tendency is the discriminating combination.
  evidence:
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "normal collagen-induced aggregate formation (P > 0.05) with reduced PS exposure"
    explanation: >-
      Documents the preserved-aggregation/reduced-exposure combination that
      distinguishes this disorder from the rest of the family.
discussions:
- discussion_id: gap_ano6_beyond_scrambling
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the bleeding phenotype of ANO6 deficiency fully explained by loss of
    phosphatidylserine scrambling, or do the other ANO6-dependent platelet
    responses contribute?
  attaches_to:
  - pathophysiology#Loss of Calcium-Dependent Phospholipid Scrambling
  - pathophysiology#Failure of Platelet Procoagulant Surface Formation
  rationale: >-
    The disorder is conventionally described, and is curated here, as a
    scramblase deficiency. But ANO6-deficient platelets also show markedly
    reduced calcium-dependent swelling and membrane blebbing and reduced
    calpain-dependent protein cleavage, and these are not obviously downstream of
    scrambling - the source frames ANO6 as controlling multiple platelet
    responses, plural. Since membrane blebbing is how procoagulant
    microparticles are shed, at least one of these could contribute
    independently to the haemostatic defect. Resolving this matters for whether
    a therapy aimed at restoring phosphatidylserine exposure alone would be
    sufficient.
  proposed_experiments:
  - experiment_id: exp_ano6_separation_of_function
    name: Separation-of-function ANO6 variants in patient-derived megakaryocytes
    description: >-
      Express ANO6 variants that dissociate scrambling from ion-channel and
      blebbing activity in ANO6-null iPSC-derived megakaryocytes, and measure
      phosphatidylserine exposure, microparticle release and thrombin generation
      independently. Rescue of thrombin generation by a scrambling-only variant
      would settle the question in favour of the conventional account.
  evidence:
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We investigated how the complex platelet phenotype of this syndrome is linked to defective expression of Anos or other ion channels."
    explanation: >-
      The source frames the platelet phenotype as complex and its attribution as
      an open investigation, which is the basis of this gap.
notes: >-
  Conformance: this entry is the worked conformer for the PROCOAGULANT arm of
  `primary_hemostatic_plug_failure` - `#Impaired Platelet Procoagulant Membrane
  Response` - which the module describes as its narrowest arm and gates on
  phosphatidylserine-exposure or procoagulant-activity evidence rather than on a
  clotting abnormality. That gate is met here directly. The entry does NOT
  conform to the adhesion, secretion or aggregation arms: aggregation is
  explicitly preserved, and curating it at any of those would be false.

  Rarity and its consequences for this entry. Only six detailed patients had been
  reported as of 2021, so prevalence is recorded qualitatively as
  `CASES_IN_LITERATURE` (`ULTRA_RARE`) with no population denominator. The
  consequence node is named `Bleeding Diathesis` rather than `Mucocutaneous
  Bleeding Diathesis`, because bleeding in Scott syndrome predominantly follows
  surgery, trauma, menstruation or childbirth rather than spontaneous
  mucocutaneous hemorrhage. Several quantified statements about platelet
  behaviour come from the Ano6-deficient mouse and are marked MODEL_ORGANISM
  even where the source presents them as phenocopying the patient, so the model
  dependency is visible rather than buried.

  Historical naming. The synonyms preserve the coagulation-era names
  ("prothrombin consumption deficiency", "platelet factor X receptor
  deficiency") because they are how the disorder appears in older literature and
  in some registries, and because they record something true about the
  mechanism - the phenotype really is one of defective thrombin generation,
  arrived at through a platelet membrane defect.

  GeneReviews note. No GeneReviews chapter covers ANO6-related Scott syndrome;
  the chapter on FGD1-related faciogenital dysplasia (Aarskog-Scott syndrome)
  covers an unrelated X-linked developmental syndrome sharing only the eponym.

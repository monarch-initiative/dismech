description: >-
  Scott syndrome is an extremely rare autosomal recessive bleeding disorder
  caused by loss of ANO6 (anoctamin-6/TMEM16F), the calcium-dependent
  phospholipid scramblase of the platelet plasma membrane. It occupies a unique
  position among the inherited platelet disorders: the platelets adhere,
  activate, secrete and aggregate normally, so every routine platelet test can
  be unremarkable, and what fails is the last step before primary hemostasis
  hands off to coagulation. A strongly activated platelet normally scrambles its
  membrane phospholipids and externalizes phosphatidylserine, and the resulting
  negatively charged surface is where the tenase and prothrombinase complexes
  assemble and accelerate; without it, thrombin generation at the site of injury
  collapses even though the plasma coagulation factors are all present and
  normal.

  That is why the disorder was originally described in the language of
  coagulation - "prothrombin consumption deficiency", a defect of prothrombin
  conversion - decades before anyone knew a platelet membrane protein was
  responsible. It is also why the disorder is a genuine diagnostic trap: an
  isolated defect of platelet procoagulant activity is invisible to
  aggregometry, invisible to platelet counts and morphology, and invisible to
  standard clotting screens performed on plasma. Only a handful of patients have
  ever been described.
pathophysiology:
- name: Biallelic Loss of Function in ANO6
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Loss-of-function variants in ANO6, encoding TMEM16F/anoctamin-6, cause the
    disease. The index patient carried a splice-acceptor-site variant causing
    premature termination of the protein. TMEM16F is a plasma-membrane protein
    with eight transmembrane segments; its identification in 2010 by expression
    cloning ended a search for the platelet scramblase that had run since the
    activity was biochemically characterized in the 1980s.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

phenotypes:
- category: Hematologic
  name: Defective Platelet Phosphatidylserine Exposure
  description: >-
    The defining laboratory abnormality, and the only one that reliably
    identifies the disorder: on strong activation, patient platelets fail to
    externalize phosphatidylserine and fail to shed procoagulant microparticles.
    Routine aggregometry does not detect it.
  phenotype_term:
    preferred_term: Defective platelet phosphatidylserine exposure
    term:
      id: HP:0011869
      label: Abnormal platelet function
  frequency: OBLIGATE
  evidence:
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scott syndrome is a rare bleeding disorder, characterized by altered Ca(2+)-dependent platelet signaling with defective phosphatidylserine (PS) exposure and microparticle formation, and is linked to mutations in the ANO6 gene, encoding anoctamin (Ano)6."
    explanation: >-
      States the defining defect - phosphatidylserine exposure and microparticle
      formation - supporting the OBLIGATE frequency, since it is what defines the
      diagnosis. The bound HP term is the generic parent because the HPO has no
      term for platelet procoagulant/phosphatidylserine-exposure defects.
- category: Hematologic
  name: Preserved Platelet Aggregation
  description: >-
    A negative finding curated deliberately, because it is diagnostically
    decisive: platelet numbers, morphology, adhesion, secretion and aggregation
    are normal in patients. This is the feature that separates the disorder from
    every other member of the family and the reason it is missed by a standard
    platelet function workup.
  phenotype_term:
    preferred_term: Preserved collagen-induced platelet aggregation
  notes: >-
    Deliberately carries NO `term:`. The HPO has no class for a preserved or
    normal platelet function finding, and the nearest candidate
    (`HP:0011869 Abnormal platelet function`) asserts the exact opposite of what
    is curated here - a downstream consumer reading only the bound term would
    get the reverse claim about the one feature that distinguishes this disorder
    from every other member of its family. Per the ontology contract, no term
    beats a misleading one. A new-term request for a normal/preserved platelet
    aggregation finding would be the durable fix.
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Platelet numbers, morphology, adhesion, secretion and aggregation are largely unaffected."
    explanation: >-
      Directly confirms in human Scott syndrome that platelet count, morphology,
      adhesion, secretion, and aggregation remain normal.
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "1) normal collagen-induced aggregate formation (P > 0.05) with reduced PS exposure (-65 to 90%)"
    explanation: >-
      Reports normal collagen-induced aggregation alongside reduced
      phosphatidylserine exposure. MODEL_ORGANISM because the quantified figures
      are from Ano6-deficient mice, presented in the source as phenocopying the
      patient platelets studied alongside them.
- category: Hematologic
  name: Prolonged Bleeding After Surgery or Trauma
  description: >-
    Clinical hemorrhage in Scott syndrome predominantly follows surgery, dental
    extraction, trauma, or childbirth (postpartum hemorrhage), reflecting initial
    formation of an unconsolidated platelet plug that subsequently fails without
    fibrin stabilization.
  phenotype_term:
    preferred_term: Prolonged bleeding after surgery or trauma
    term:
      id: HP:0004846
      label: Prolonged bleeding after surgery
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bleeding is predominant after surgery or trauma; menorrhagia and post-partum hemorrhage are marked."
    explanation: >-
      Documents post-surgical and trauma-induced hemorrhage as the predominant
      clinical bleeding pattern in reported Scott syndrome patients.
- category: Genitourinary
  name: Menorrhagia
  description: >-
    Marked heavy menstrual bleeding (menorrhagia) and postpartum hemorrhage are
    prominent clinical manifestations among reported female patients with Scott
    syndrome.
  phenotype_term:
    preferred_term: Menorrhagia
    term:
      id: HP:0000132
      label: Menorrhagia
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bleeding is predominant after surgery or trauma; menorrhagia and post-partum hemorrhage are marked."
    explanation: >-
      Documents marked menorrhagia in women with Scott syndrome.
- category: Hematologic
  name: Prolonged Bleeding Time
  description: >-
    Impaired hemostatic plug consolidation leads to prolonged bleeding duration,

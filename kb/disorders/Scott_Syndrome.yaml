    snippet: "A patient with Scott syndrome, which results from a defect in phospholipid scrambling activity, was found to carry a mutation at a splice-acceptor site of the gene encoding TMEM16F, causing the premature termination of the protein."
    explanation: >-
      Establishes the causal gene and the specific allele class of the index
      patient.
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a significant advance has recently been made with the identification of TMEM16F, a membrane protein essential for calcium-dependent PS exposure whose loss of function mutations are found in Scott syndrome"
    explanation: >-
      Independent confirmation that loss-of-function variants in this gene are
      the cause, and places the discovery in its historical context.
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For the original patient a homozygous variant at a splice acceptor site in intron 12 resulted in a premature stop codon.36 Two French siblings showed compound heterozygosity for a large deletion of exons 1-10 in one allele and a premature stop codon on the other.41 Compound heterozygosity with premature termination was also seen in a Welsh family.42 All mutations result in abrogated TMEM16F expression."
    explanation: >-
      Summarizes biallelic homozygous and compound-heterozygous truncating and
      deletion ANO6 alleles across reported pedigrees, all abrogating TMEM16F expression.
  downstream:
  - target: Loss of Calcium-Dependent Phospholipid Scrambling
    causal_link_type: DIRECT
    description: >-
      TMEM16F is the essential component of the calcium-dependent scrambling
      activity, so losing it removes the activity.
- name: Loss of Calcium-Dependent Phospholipid Scrambling
  role: central_effector
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Procoagulant Membrane Response"
  description: >-
    The rate-limiting lesion. Resting cells maintain phospholipid asymmetry
    using ATP-dependent translocases (flippases and floppases) that move
    phospholipids unidirectionally against a gradient; on activation an
    energy-independent, calcium-dependent scramblase instead exchanges
    phospholipids bidirectionally between the two leaflets, collapsing the
    asymmetry and exposing phosphatidylserine. It is this second, scramblase
    activity that is lost here - the translocases are unaffected - so the defect
    is specific to the activated state, which is why resting platelets are
    entirely normal.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  molecular_functions:
  - preferred_term: phospholipid scramblase activity
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: calcium-dependent phosphatidylserine externalization
    term:
      id: GO:0017121
      label: plasma membrane phospholipid scrambling
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They also use an energy-independent, calcium-dependent scramblase activity to govern the bidirectional exchange of phospholipids between the two leaflets of the bilayer; this activity is essential for PS exposure during platelet activation. Scramblase activity, biochemically characterized in the 1980s, is deficient in patients with Scott syndrome, a rare inherited bleeding disorder with defective platelet procoagulant activity."
    explanation: >-
      Distinguishes the scramblase activity from the ATP-dependent translocases
      and states that it is the one deficient in this disorder - the exact
      claim this node makes.
  - reference: PMID:21107324
    reference_title: Calcium-dependent phospholipid scrambling by TMEM16F.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type TMEM16F was localized on the plasma membrane and conferred Ca(2+)-dependent scrambling of phospholipids."
    explanation: >-
      Direct demonstration that the protein confers the activity this node
      describes as lost.
  downstream:
  - target: Failure of Platelet Procoagulant Surface Formation
    causal_link_type: DIRECT
    description: >-
      No scrambling means no phosphatidylserine on the outer leaflet.
- name: Failure of Platelet Procoagulant Surface Formation
  role: effector
  biological_scale: CELLULAR
  description: >-
    The activated platelet fails to present the anionic surface that
    coagulation depends on, and fails to shed the phosphatidylserine-bearing
    microparticles that extend that surface into the surrounding plasma. Binding
    of the clotting enzyme complexes to a negatively charged membrane surface is
    what allows the dramatic acceleration of zymogen-to-protease conversion, so
    the loss is quantitative in the most consequential sense: the reactions
    still occur, but far too slowly.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet procoagulant activity
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This newly-exposed PS surface is a major component of normal hemostasis because it supports platelet procoagulant function."
    explanation: >-
      States that the exposed surface is what supports procoagulant function,
      which is what this node records as failing.
  downstream:
  - target: Impaired Local Thrombin Burst
    causal_link_type: DIRECT
    description: >-
      The tenase and prothrombinase complexes lose the surface on which they
      assemble and accelerate.
  - target: Defective Platelet Phosphatidylserine Exposure
    causal_link_type: DIRECT
    description: >-
      Loss of activated-platelet phosphatidylserine externalization and procoagulant
      microparticle shedding manifests directly on flow-cytometric platelet testing.
- name: Impaired Local Thrombin Burst
  role: effector
  biological_scale: TISSUE
  description: >-
    Without surface-accelerated assembly of the clotting enzyme complexes there
    is no burst of thrombin at the site of injury, so fibrin formation and the
    further platelet activation that thrombin drives both fail. Plasma
    coagulation factor levels are normal throughout - the defect is in where the
    reactions happen, not in what is available to run them - which is why
    standard plasma-based clotting assays are normal and why the historical name
    for the disorder was framed as defective prothrombin consumption.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Binding of blood clotting enzyme complexes to this negatively-charged membrane surface allows a dramatic increase in the rate of conversion of zymogens to active serine proteases, which in turn produce a burst of thrombin leading to the formation of a fibrin clot and further platelet activation."
    explanation: >-
      Sets out the surface-dependent acceleration and the thrombin burst whose
      loss this node represents, including the downstream fibrin and
      platelet-activation consequences.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      The platelet plug is not consolidated by fibrin and remains mechanically
      inadequate.
- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    Reached by an unusual route - not by failing to build the platelet mass, but
    by failing to consolidate it. The distinctive clinical consequence is that
    bleeding tends to be delayed and to follow trauma or surgery rather than
    arising spontaneously, since the initial platelet plug forms normally and
    then fails to hold.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in transmembrane protein 16F (TMEM16F) has been linked to a defective procoagulant activity and phosphatidylserine expression in the Scott syndrome."
    explanation: >-
      Places this disorder within the family of platelet function defects that
      converge on failure of the platelet's haemostatic role.
  downstream:
  - target: Bleeding Diathesis
    causal_link_type: DIRECT
    description: Failure of platelet-supported haemostasis at the site of injury.
- name: Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >-
    A haemostatically significant bleeding tendency, established in patients by
    prolonged bleeding time. The phenotype is deliberately named "bleeding
    diathesis" rather than "mucocutaneous bleeding" here: with only a handful of
    patients ever described, the site distribution characteristic of the wider
    family is not independently established for this disorder, and asserting it
    would be extrapolation from the module rather than a curated observation.
  biological_processes:

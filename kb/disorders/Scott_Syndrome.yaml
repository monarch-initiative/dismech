  phenotype_term:
    preferred_term: Prolonged bleeding time
    term:
      id: HP:0003010
      label: Prolonged bleeding time
  evidence:
  - reference: PMID:21958383
    reference_title: "Platelet membrane phospholipid asymmetry: from the characterization of a scramblase activity to the identification of an essential protein mutated in Scott syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scramblase activity, biochemically characterized in the 1980s, is deficient in patients with Scott syndrome, a rare inherited bleeding disorder with defective platelet procoagulant activity."
    explanation: >-
      Establishes human clinical hemostatic bleeding impairment in Scott syndrome;
      graded INDIRECT for the specific bleeding-time test parameter.
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In 2 mouse strains, deficiency in Ano6 resulted in reduced viability with increased bleeding time to 28.6 min (control 6.4 min, P < 0.05)."
    explanation: >-
      Quantifies prolonged bleeding time in Ano6-deficient mice phenocopying
      patient platelets; graded INDIRECT because the numerical bleeding time is
      measured in the mouse rather than in human patients.
genetic:
- name: ANO6
  gene_term:
    preferred_term: ANO6
    term:
      id: hgnc:25240
      label: ANO6
  relationship_type: CAUSATIVE
  notes: >-
    Encodes TMEM16F/anoctamin-6. Loss-of-function variants cause the disorder;
    the index patient's allele was a splice-acceptor-site variant producing
    premature termination. The specificity of the gene assignment is unusually
    well controlled: mice deficient in the related anoctamin ANO1, or in the
    calcium-dependent KCa3.1 Gardos channel, showed no reduction in platelet
    responses, so the phenotype is attributable to ANO6 rather than to the
    anoctamin family or to calcium-activated channels generally.
  evidence:
  - reference: PMID:26481309
    reference_title: "Survival protein anoctamin-6 controls multiple platelet responses including phospholipid scrambling, swelling, and protein cleavage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deficiency in Ano1 or Gardos channel did not reduce platelet responses compared with control mice (P > 0.1)."
    explanation: >-
      The negative controls that establish the specificity of the ANO6
      assignment asserted in this gene block.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance caused by homozygous or compound-heterozygous
    loss-of-function variants in ANO6. Both homozygous splice-site truncation and
    compound-heterozygous multi-exon deletion/nonsense alleles have been
    documented in affected pedigrees; the number of reported patients remains too
    small to establish subtle carrier phenotypes.
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Scott syndrome is characterized by autosomal recessive transmission, a lack of phosphatidylserine exposure and phosphatidylserine-bearing microparticle production from platelets and red blood cells."
    explanation: >-
      Directly establishes autosomal recessive transmission of Scott syndrome.
  - reference: PMID:21107324
    reference_title: Calcium-dependent phospholipid scrambling by TMEM16F.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "A patient with Scott syndrome, which results from a defect in phospholipid scrambling activity, was found to carry a mutation at a splice-acceptor site of the gene encoding TMEM16F"
    explanation: >-
      Documents a truncating splice-acceptor-site TMEM16F allele in the index
      patient; graded INDIRECT for inheritance mode because the abstract alone
      does not state homozygosity or familial segregation.

genetic:
- name: KIT
  notes: >-
    KIT encodes the receptor tyrosine kinase for KIT ligand (stem cell factor).
    Loss-of-function alleles cause piebaldism, and genotype-phenotype
    correlation is broadly consistent, with more severe alleles producing more
    extensive depigmentation.
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:22670867
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by a loss-of-function mutation in the KIT gene.
    explanation: >-
      Establishes KIT as the causal gene.
  - reference: PMID:22670867
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analyses reveal a consistent genotype-phenotype relationship in piebaldism.
    explanation: >-
      Supports a broadly consistent genotype-phenotype correlation.
- name: MC1R
  notes: >-
    MC1R is reported as a modifier rather than a cause. Cases milder or more
    severe than the KIT genotype predicts point to modifier effects on
    pigmentation, of which MC1R is the named candidate.
  gene_term:
    preferred_term: MC1R
    term:
      id: hgnc:6929
      label: MC1R
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:22670867
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, recently reported cases of piebaldism that are milder or severer than genetically expected indicate that other factors, such as a modifier gene of MC1R, influence skin and hair color.
    explanation: >-
      Supports MC1R as a proposed modifier of expressivity. Note this is a
      candidate-level claim in the cited review, not a demonstrated modifier
      effect, and it is curated as MODIFIER rather than CAUSATIVE on that basis.
treatments:
- name: Photoprotection and Camouflage
  description: >-
    Depigmented skin has no melanin photoprotection, so sun protection is
    advised, and cosmetic camouflage is used where the distribution is
    conspicuous. There is no therapy that restores melanocytes to the affected
    regions, which is why management is protective and cosmetic rather than
    curative.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26919497
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the case of a 14-year-old adolescent girl with piebaldism, along with a review of the pathogenesis, diagnosis, and management of this disease entity.
    explanation: >-
      Cited as the management source for this entry. Note plainly what this
      supports: that the reference reviews management, not a measured efficacy
      for photoprotection or camouflage, for which no trial evidence exists in a
      disorder this rare.
- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant inheritance, and for the differential
    diagnosis, since congenital leukoderma may be the presenting sign of a
    syndrome rather than of isolated piebaldism.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26919497
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, these clinical features may be the presenting signs of various syndromes or associated diseases, which should be considered in the differential diagnosis.
    explanation: >-
      Supports the need for diagnostic evaluation rather than assuming isolated
      piebaldism.
notes: >-
  Piebaldism is the KIT conformer of `neural_crest_melanocyte_deficiency`. That
  module was built around the Waardenburg spectrum, where the trigger
  substitutions are PAX3, SOX10, MITF and the EDN3/EDNRB endothelin axis;
  piebaldism reaches the same melanoblast migration and survival defect through
  KIT ligand-KIT receptor signalling instead, which is what makes it a useful
  independent test of the module's claim that the convergence is genuine.

  The entry deliberately does NOT conform to the module's
  `#Stria Vascularis Melanocyte Deficiency` node. That node carries the
  auditory arm of the Waardenburg spectrum, and isolated piebaldism is not a
  deafness syndrome - conflating the two is precisely the error the module's
  node separation exists to prevent.

  The main clinical distinction to preserve is from vitiligo: piebaldism is
  congenital, stable and regionally fixed because melanocytes never arrived,
  whereas vitiligo is acquired and progressive because melanocytes present in
  the skin are destroyed.

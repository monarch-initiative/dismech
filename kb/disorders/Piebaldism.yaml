- name: Failure of Melanoblast Migration, Proliferation and Survival
  conforms_to: "neural_crest_melanocyte_deficiency#Melanoblast Migration and Survival Defect"
  biological_scale: CELLULAR
  description: >-
    Melanoblasts derived from the neural crest fail to migrate into, proliferate
    within, or survive in the affected skin regions during development. The
    result is a permanent regional absence of melanocytes rather than a defect
    in melanin synthesis by melanocytes that are present - which is the reason
    the depigmentation is congenital, stable, and sharply demarcated rather than
    progressive.

    the KIT ligand-KIT receptor tyrosine kinase axis, which acts via the
    RAS/MAPK pathway. This is the piebaldism-specific substitution at the
    module's trigger node, where Waardenburg-spectrum disorders instead
    substitute PAX3, SOX10, MITF or the endothelin axis.

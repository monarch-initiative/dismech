name: Piebaldism
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Piebaldism is an uncommon autosomal dominant disorder of melanocyte
  development caused by loss-of-function variants in KIT, the receptor tyrosine
  kinase for KIT ligand (stem cell factor). KIT ligand-KIT signalling, acting
  through the RAS/MAPK pathway, is required for the migration, proliferation and
  survival of melanoblasts as they populate the skin from the neural crest.
  Reduced KIT dosage leaves defined skin regions permanently without
  melanocytes, producing a congenital, stable, sharply demarcated leukoderma
  with a characteristic distribution - a white forelock with a triangular
  depigmented patch on the central forehead, and depigmented patches on the
  ventral trunk and the mid-limbs - typically containing islands of
  hyperpigmented normal skin. Unlike vitiligo, the lesions are present at birth
  and do not progress. Genotype-phenotype correlation is broadly consistent,
  though modifier effects are recognized.
category: Genetic

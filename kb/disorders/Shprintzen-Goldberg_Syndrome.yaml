  - reference: PMID:23103230
    reference_title: "In-frame mutations in exon 1 of SKI cause dominant Shprintzen-Goldberg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were located in a restricted area of exon 1, within the R-SMAD binding domain of SKI."
    explanation: Localizes pathogenic SGS variants to the R-SMAD-binding domain of SKI.
  - reference: PMID:23023332
    reference_title: "Mutations in the TGF-β repressor SKI cause Shprintzen-Goldberg syndrome with aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified causative variation in ten individuals with SGS in the proto-oncogene SKI, a known repressor of TGF-β activity."
    explanation: Identifies SKI, a negative regulator of TGF-beta signaling, as the molecular target mutated in SGS.
  - reference: PMID:33416497
    reference_title: "Mutations in SKI in Shprintzen-Goldberg syndrome lead to attenuated TGF-β responses through SKI stabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we use a combination of structural biology, genome editing, and biochemistry to show that SGS mutations in SKI abolish its binding to phosphorylated SMAD2 and SMAD3."
    explanation: Structural and biochemical assays show directly that SGS-associated SKI variants abolish binding to phosphorylated SMAD2 and SMAD3.
  downstream:
  - target: Enhanced TGF-beta Signaling
    causal_link_type: DIRECT
    description: >-
      Disrupted SKI-R-SMAD interaction is associated with increased canonical and
      non-canonical TGF-beta signaling and H3K27ac-marked target-gene expression
      in steady-state patient fibroblasts and Ski-mutant mice, although acute
      ligand-stimulation and CRISPR knock-in studies report SKI protein
      stabilization and attenuated TGF-beta transcriptional responses.
    evidence:
    - reference: PMID:23023332
      reference_title: "Mutations in the TGF-β repressor SKI cause Shprintzen-Goldberg syndrome with aortic aneurysm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cultured dermal fibroblasts from affected individuals showed enhanced activation of TGF-β signaling cascades and higher expression of TGF-β-responsive genes relative to control cells."
      explanation: Patient fibroblasts carrying SKI variants exhibit elevated TGF-beta cascade activation and target-gene expression.
    - reference: PMID:33416497
      reference_title: "Mutations in SKI in Shprintzen-Goldberg syndrome lead to attenuated TGF-β responses through SKI stabilization."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "This results in stabilization of SKI and consequently attenuation of TGF-β responses, both in knockin cells expressing an SGS mutation and in fibroblasts from SGS patients."
      explanation: Counter-evidence showing that loss of phosphorylated SMAD2/3 binding prevents ligand-induced SKI degradation and attenuates acute TGF-beta transcriptional responses.
- name: Enhanced TGF-beta Signaling
  biological_scale: CELLULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >
    Dysregulated SKI function in dermal fibroblasts and vascular smooth muscle
    cells is associated with enhanced activation of SMAD2/3 and ERK TGF-beta
    signaling cascades, elevated H3K27 acetylation, and increased expression of
    TGF-beta-responsive genes in patient fibroblasts and orthologous Ski-mutant
    mice, paralleling the TGF-beta paradox observed in Marfan and Loeys-Dietz
    syndromes. Competing biochemical and CRISPR knock-in studies instead report
    that SGS variants stabilize SKI and attenuate acute ligand-induced TGF-beta
    transcription (recorded in discussions).
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: fibroblast

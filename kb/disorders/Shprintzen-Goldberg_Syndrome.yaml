discussions:
- discussion_id: tgf_beta_enhancement_vs_ski_stabilization
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SKI-SMAD Transcriptional Repression
  - pathophysiology#Enhanced TGF-beta Signaling
  prompt: >-
    Do pathogenic SKI variants in Shprintzen-Goldberg syndrome cause pathology
    through excessive TGF-beta signaling or through SKI protein stabilization
    and attenuated acute TGF-beta transcriptional responses?
  rationale: >-
    Initial patient-fibroblast studies (Doyle et al., 2012, PMID:23023332) and
    orthologous Ski knock-in mouse models (Kang et al., 2021,
    DOI:10.1101/2021.02.12.431010) report increased canonical SMAD2/3 and ERK
    signaling, elevated H3K27 acetylation, and higher steady-state expression of
    TGF-beta target genes, with aortic root aneurysm ameliorated by CBP/P300
    inhibition. Conversely, structural and CRISPR knock-in studies (Gori et al.,
    2021, PMID:33416497; RNA-seq in ega:EGAS00001004908) demonstrate that SGS
    variants in SKI abolish binding to phosphorylated SMAD2/3, blocking
    RNF111-dependent ligand-induced SKI degradation, stabilizing SKI on
    SMAD4-bound chromatin, and attenuating acute TGF-beta/Activin transcriptional
    responses in knock-in cells and patient fibroblasts. This unresolved
    mechanistic discrepancy parallels the broader "TGF-beta paradox" across
    Marfan and Loeys-Dietz syndromes.
  evidence:
  - reference: PMID:23023332
    reference_title: "Mutations in the TGF-β repressor SKI cause Shprintzen-Goldberg syndrome with aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cultured dermal fibroblasts from affected individuals showed enhanced activation of TGF-β signaling cascades and higher expression of TGF-β-responsive genes relative to control cells."
    explanation: Supports the enhanced-signaling arm of the controversy in primary dermal fibroblasts from SGS patients.
  - reference: DOI:10.1101/2021.02.12.431010
    reference_title: "Epigenetic modulation in the pathogenesis and treatment of inherited aortic aneurysm conditions"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, aortic root aneurysm in SGS mice is associated with both increased acetylation of histone H3 at lysine-27 (H3K27) and TGFβ target gene expression, all of which can be ameliorated by pharmacological CBP/P300 inhibition in vivo; similar findings were seen in cultured dermal fibroblast from SGS patients."
    explanation: Supports elevated H3K27ac and TGF-beta target-gene expression in orthologous Ski knock-in mice and patient fibroblasts, rescued by CBP/P300 inhibition.
  - reference: PMID:33416497
    reference_title: "Mutations in SKI in Shprintzen-Goldberg syndrome lead to attenuated TGF-β responses through SKI stabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we use a combination of structural biology, genome editing, and biochemistry to show that SGS mutations in SKI abolish its binding to phosphorylated SMAD2 and SMAD3. This results in stabilization of SKI and consequently attenuation of TGF-β responses, both in knockin cells expressing an SGS mutation and in fibroblasts from SGS patients."
    explanation: Supports the competing SKI-stabilization and attenuated-acute-TGF-beta-response model in CRISPR knock-in cells and SGS patient fibroblasts.

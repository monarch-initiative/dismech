    reference_title: "In-frame mutations in exon 1 of SKI cause dominant Shprintzen-Goldberg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using family-based exome sequencing, we identified a dominantly inherited
      heterozygous in-frame deletion in exon 1 of SKI.
    explanation: >-
      Demonstrates dominant inheritance of SKI mutations in SGS.
  - reference: PMID:20301454
    reference_title: "Shprintzen-Goldberg Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SGS, caused by a heterozygous pathogenic variant in SKI, is an autosomal dominant disorder."
    explanation: GeneReviews confirms autosomal dominant inheritance of SKI-related SGS.
  - reference: PMID:20301454
    reference_title: "Shprintzen-Goldberg Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most individuals with SGS have unaffected parents, suggesting that the causative variant has occurred either as a de novo event in the affected individual or as a result of germline mosaicism in one of the parents. Affected sibs born to unaffected parents support the occurrence of germline mosaicism in some families with SGS."
    explanation: GeneReviews supports predominant de novo occurrence of pathogenic SKI variants and documented parental germline mosaicism in sibling recurrence.

genetic:
- name: SKI
  gene_term:
    preferred_term: SKI
    term:
      id: hgnc:10896
      label: SKI
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Heterozygous missense or in-frame deletion variants in SKI, encoding the SKI
    proto-oncoprotein transcriptional co-repressor of TGF-beta/SMAD signaling.
    Variants cluster in the exon 1 R-SMAD-binding domain (with 73% affecting
    residues p.Ser31 to p.Pro35) and the Dachshund homology domain (DHD),
    disrupting SKI-SMAD interactions.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_019ffb7a-be5f-482d-9adf-e28d5aadaede-2024-07-23T160000.000Z
    evidence:
    - reference: CGGV:assertion_019ffb7a-be5f-482d-9adf-e28d5aadaede-2024-07-23T160000.000Z
      reference_title: "SKI / Shprintzen-Goldberg syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SKI | HGNC:10896 | Shprintzen-Goldberg syndrome | MONDO:0008426 | AD | Definitive"
      explanation: ClinGen Craniofacial Malformations GCEP classifies the SKI-Shprintzen-Goldberg syndrome relationship as Definitive (AD).
  evidence:
  - reference: PMID:23023332
    reference_title: "Mutations in the TGF-β repressor SKI cause Shprintzen-Goldberg syndrome with aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified causative variation in ten individuals with SGS in the
      proto-oncogene SKI, a known repressor of TGF-β activity.
    explanation: >-
      Landmark paper identifying SKI as the causative gene for SGS
      in 10 patients.
  - reference: PMID:23103230
    reference_title: "In-frame mutations in exon 1 of SKI cause dominant Shprintzen-Goldberg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations were located in a restricted area of exon 1, within
      the R-SMAD binding domain of SKI.
    explanation: >-
      Confirms that SGS mutations cluster in the R-SMAD binding domain
      of SKI exon 1.
  - reference: PMID:24736733
    reference_title: "The SMAD-binding domain of SKI: a hotspot for de novo mutations causing Shprintzen-Goldberg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adding our new findings to the existing data clearly reveals a mutational
      hotspot, with 73% (24 out of 33) of the hitherto described unrelated
      patients having mutations in a stretch of five SKI residues (from
      p.(Ser31) to p.(Pro35)).
    explanation: >-
      Identifies a mutational hotspot in 5 SKI residues accounting
      for 73% of patients.

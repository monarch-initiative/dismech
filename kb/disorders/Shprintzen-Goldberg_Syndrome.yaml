name: Shprintzen-Goldberg Syndrome
synonyms:
- Shprintzen-Goldberg syndrome, SKI-related
- Shprintzen-Goldberg craniosynostosis syndrome
- Marfanoid craniosynostosis syndrome
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >
  Shprintzen-Goldberg syndrome (SGS) is a rare autosomal dominant connective tissue
  disorder caused by heterozygous pathogenic variants in SKI, encoding the SKI
  proto-oncoprotein, a transcriptional co-repressor of TGF-beta/SMAD signaling.
  It shares phenotypic overlap with Marfan and Loeys-Dietz syndromes but is
  distinguished by craniosynostosis, developmental delay or intellectual
  disability, and C1-C2 cervical spine malformations. Features include marfanoid
  habitus, arachnodactyly, camptodactyly, scoliosis, pectus deformity, minimal
  subcutaneous fat, myopia, and aortic root dilatation, typically with milder
  vascular progression than Loeys-Dietz syndrome.

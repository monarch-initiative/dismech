  - target: Aortic Root Dilatation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dysregulated TGF-beta signaling and excessive H3K27ac-driven target-gene
      expression in the aortic wall drive aortic root dilatation and aneurysm,
      placing SGS in the spectrum of heritable TGF-beta aortopathies alongside
      Marfan and Loeys-Dietz syndromes.
    evidence:
    - reference: PMID:23023332
      reference_title: "Mutations in the TGF-β repressor SKI cause Shprintzen-Goldberg syndrome with aortic aneurysm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data support the conclusions that increased TGF-β signaling is the mechanism underlying SGS and that high signaling contributes to multiple syndromic presentations of aortic aneurysm."
      explanation: Links elevated TGF-beta signaling in SKI-mutant SGS directly to syndromic aortic aneurysm pathogenesis.
    - reference: DOI:10.1101/2021.02.12.431010
      reference_title: "Epigenetic modulation in the pathogenesis and treatment of inherited aortic aneurysm conditions"
      supports: SUPPORT

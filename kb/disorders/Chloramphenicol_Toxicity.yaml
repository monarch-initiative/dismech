environmental:
- name: Systemic chloramphenicol administration
  exposure_term:
    preferred_term: exposure to chloramphenicol
    term:
      id: ECTO:9000360
      label: exposure to chloramphenicol
  description: >-
    The exposure is iatrogenic: chloramphenicol given as antibiotic therapy, by
    intravenous or oral route. Toxicity follows when a neonate cannot clear a
    standard dose, at higher exposures in any patient, or idiosyncratically.
  evidence:
  - reference: PMID:28846297
    reference_title: "Gray Baby Syndrome (Archived)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neonates born at less than 37 weeks gestation were given chloramphenicol in an intravenous or oral formulation within two days of birth"
    explanation: Establishes the iatrogenic systemic administration that is the exposure.
  influences_mechanisms:
  - target: Systemic Chloramphenicol Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administered chloramphenicol is the source of the circulating drug that
      drives host toxicity.
diagnosis:
- name: Clinical recognition and serum concentration
  description: >-
    Diagnosis rests on a temporal link to chloramphenicol exposure with a
    compatible toxidrome, supported by a serum chloramphenicol concentration;
    high levels predict severe toxicity and death, which is also the basis for
    therapeutic monitoring in neonates.
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "fatal cases consistently showing serum chloramphenicol levels exceeding 50"
    explanation: Supports serum concentration as a diagnostic and prognostic measurement.
  - reference: PMID:42073156
    reference_title: "Potentially Hazardous Drugs in the Paediatric ICU: A Narrative Review on the Exemplary Cases of Propofol, Chloramphenicol, and Acetylsalicylic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The occurrence of grey baby syndrome is generally associated with serum levels exceeding 50 mg/L, so levels should generally be maintained between 15 and 25 mg/L"
    explanation: >-
      Gives the toxic threshold and therapeutic target range (in mg/L) that make
      serum monitoring actionable.
- name: Blood count monitoring during therapy
  description: >-
    Serial complete blood counts during treatment detect the dose-dependent
    marrow suppression early, before it is severe.
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The guidelines emphasize the necessity of regular blood-count monitoring during treatment."
    explanation: Directly supports regular blood-count monitoring during chloramphenicol therapy.
  - reference: PMID:42073156
    reference_title: "Potentially Hazardous Drugs in the Paediatric ICU: A Narrative Review on the Exemplary Cases of Propofol, Chloramphenicol, and Acetylsalicylic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Monitoring should be performed before starting therapy with this drug and then every 3 to 4 days"
    explanation: Gives the monitoring cadence (baseline then every 3-4 days).
- name: Metabolic acidosis as an early indicator
  description: >-
    An early metabolic acidosis in an exposed neonate is a practical early warning
    of chloramphenicol toxicity, often preceding overt collapse.
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, metabolic acidosis is regarded as an early indicator of chloramphenicol toxicity"
    explanation: Names metabolic acidosis as the stated early indicator used in diagnosis.
differential_diagnoses:
- name: Other causes of aplastic anemia
  description: >-
    Aplastic anaemia has many drug, toxic, viral and idiopathic causes that
    overlap with the idiosyncratic chloramphenicol form.
  distinguishing_features:
  - A documented chloramphenicol exposure within the aetiological window points to the drug, though the attributable risk per course is very low.
  evidence:
  - reference: PMID:9723830
    reference_title: "Possible association between ocular chloramphenicol and aplastic anaemia--the absolute risk is very low."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An association between ocular chloramphenicol and aplastic anaemia cannot be excluded. However, the risk is less than one per million treatment courses."
    explanation: The low attributable risk is why exposure history, not the finding alone, distinguishes the drug cause.
- name: Neonatal sepsis and septic shock
  description: >-
    The gray baby toxidrome - hypotension, poor perfusion, hypothermia, metabolic
    acidosis and feeding intolerance in a neonate - closely mimics neonatal sepsis
    with septic shock, the first diagnosis most such infants receive.
  distinguishing_features:
  - A temporal link to chloramphenicol administration and an elevated serum chloramphenicol concentration point to toxicity; sepsis is supported by a positive culture or an identified infective focus.
  - Gray baby syndrome improves on stopping and clearing the drug, whereas septic shock requires source control and antimicrobials.
treatments:
- name: Drug discontinuation and supportive care
  description: >-
    Stopping chloramphenicol and supporting circulation, ventilation and
    temperature; the mainstay for gray baby syndrome and dose-dependent marrow
    suppression.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggressive management included mechanical ventilation, inotropic support (dopamine/milrinone), norepinephrine infusion"
    explanation: Documents the intensive supportive care used for severe gray baby syndrome.
- name: Extracorporeal drug removal
  description: >-
    Continuous renal replacement therapy (the intervention used in the cited
    case), with exchange transfusion or charcoal haemoperfusion as alternatives,
    to clear massively accumulated chloramphenicol in severe toxicity. Bound to
    the renal-replacement action; NCIT exchange-transfusion (NCIT:C173284) is not
    reachable from the TreatmentTerm root (NCIT:C25218), so it is named in prose
    only.
  treatment_term:
    preferred_term: continuous renal replacement therapy
    term:
      id: NCIT:C126400
      label: Renal Replacement Therapy
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "delayed CRRT proved pivotal in reversing toxicity in our patient"
    explanation: Reports extracorporeal removal (CRRT) reversing severe accumulation.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hemodialysis was initiated for severe metabolic acidosis"
    explanation: A further case of extracorporeal removal (haemodialysis) for severe chloramphenicol toxicity.
- name: Vitamin B12 and B6 supplementation
  description: >-
    Large doses of vitamin B12 and B6 are given for chloramphenicol optic
    neuritis on the vitamin-deficiency hypothesis of the neurotoxicity. The
    benefit is unproven: in the cited case, hydroxocobalamin and pyridoxine
    did not recover the patient's vision. Recorded as a documented therapeutic
    approach with its outcome, not as an established treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin (vitamin B12)
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
    - preferred_term: pyridoxine (vitamin B6)
      term:
        id: CHEBI:16709
        label: pyridoxine
  evidence:
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment involves discontinuing chloramphenicol and the consideration of large doses of vitamin B12 and B6."
    explanation: States the B12/B6 approach to chloramphenicol neurotoxicity.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this therapy was not successful in improving his vision"
    explanation: Documents the failure of B12/B6 therapy to recover vision in the cited case.

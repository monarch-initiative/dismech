pathophysiology:
- name: Systemic Chloramphenicol Exposure
  description: >-
    Chloramphenicol given systemically (intravenous or oral) reaches host tissues.
    This circulating drug is the common initiator of toxicity; the dose at which
    it harms depends on how well the patient clears it.
  biological_scale: ORGANISM
  downstream:
  - target: Mitochondrial Ribosomal Protein-Synthesis Inhibition
    causal_link_type: DIRECT
  - target: Chronic Chloramphenicol Neurotoxicity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A toxicity of prolonged exposure whose mechanism is not established, so it
      is placed off the exposure node rather than the mitochondrial chain.
  - target: Idiosyncratic Bone Marrow Aplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A rare, dose-independent arm that can follow any route of exposure; the
      mechanism linking exposure to stem-cell injury is not established.
    evidence:
    - reference: PMID:9723830
      reference_title: "Possible association between ocular chloramphenicol and aplastic anaemia--the absolute risk is very low."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An association between ocular chloramphenicol and aplastic anaemia cannot be excluded. However, the risk is less than one per million treatment courses."
      explanation: >-
        Shows aplastic anaemia can follow even topical/ocular exposure and is very
        rare, consistent with a dose-independent idiosyncratic arm.
- name: Impaired Neonatal Hepatic Glucuronidation
  description: >-
    Neonates, especially premature infants, have immature hepatic
    UDP-glucuronosyltransferase activity and immature renal excretion, so they
    cannot conjugate and clear chloramphenicol. A standard weight-based dose
    therefore accumulates to toxic serum concentrations - the basis of neonatal
    susceptibility to gray baby syndrome.
  biological_scale: MOLECULAR
  downstream:
  - target: Systemic Chloramphenicol Exposure
    causal_link_type: DIRECT
    description: >-
      Deficient clearance raises and prolongs circulating drug in the neonate, so
      a normal dose behaves as an overdose.
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Newborns, particularly preterm infants, have underdeveloped livers and relatively low glucuronidation capacity, making them highly susceptible to chloramphenicol toxicity and the highest-risk group for gray baby syndrome"
    explanation: >-
      States the immature-glucuronidation susceptibility that is this node's claim.
- name: Mitochondrial Ribosomal Protein-Synthesis Inhibition
  description: >-
    Chloramphenicol inhibits the peptidyl-transferase of the bacterial 50S
    ribosomal subunit; the mitochondrial ribosome is bacterial-like, so the drug
    also blocks mitochondrial protein synthesis in host cells, injuring
    mitochondria and impairing synthesis of respiratory-chain subunits.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Oxidative Phosphorylation Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The common, dose-dependent, reversible bone marrow suppression from chloramphenicol is a consequence of mitochondrial injury."
    explanation: >-
      Attributes the dose-dependent marrow toxicity to mitochondrial injury, the
      lesion this node represents.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This binding inhibits the mitochondrial enzyme peptidyl transferase, which is necessary for peptide bond formation."
    explanation: >-
      Names the molecular target - inhibition of mitochondrial peptidyl
      transferase - underlying this node.
- name: Oxidative Phosphorylation Failure
  description: >-
    Depressed synthesis of mitochondrially encoded respiratory-chain subunits
    lowers oxidative phosphorylation and causes cellular necrosis, the shared
    cellular lesion behind both the dose-dependent marrow suppression and the
    gray baby toxidrome.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Dose-Dependent Bone Marrow Suppression
    causal_link_type: DIRECT
  - target: Gray Baby Toxidrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Myocardial Dysfunction and Microcirculatory Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Chloramphenicol overdose inhibits mitochondrial protein synthesis, which disrupts oxidative phosphorylation and causes cellular necrosis."
    explanation: >-
      Names the mitochondrial-translation to oxidative-phosphorylation to necrosis
      step this node represents.
- name: Dose-Dependent Bone Marrow Suppression
  description: >-
    The mitochondrial lesion depresses erythropoiesis in a dose-dependent,
    reversible way; the erythroid lineage is most susceptible, reflecting its
    reliance on mitochondrial amino-acid pools. Anaemia resolves on stopping the
    drug.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
  - target: Reticulocytopenia
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The greater erythroid susceptibility to chloramphenicol appears to be a function of the endogenous mitochondrial amino acid pools."
    explanation: >-
      Explains the erythroid predominance of the dose-dependent suppression this
      node describes.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "a predictable dose-dependent toxicity resulting in anemia that was reversible upon drug withdrawal"
    explanation: >-
      Second source for the dose-dependent, reversible nature of this marrow arm.
- name: Gray Baby Toxidrome
  description: >-
    In the accumulating neonate, mitochondrial energetic failure manifests as the
    gray baby toxidrome - vomiting, abdominal distension, hypothermia, an
    ashen-gray colour, cyanosis and metabolic acidosis - which, together with the
    circulatory collapse driven by the myocardial/microcirculatory arm, carries a
    high mortality. The features appear together; this node fans out to them
    rather than one causing the next.
  biological_scale: ORGANISM
  downstream:
  - target: Ashen-gray discoloration
    causal_link_type: DIRECT
  - target: Cyanosis
    causal_link_type: DIRECT
  - target: Hypothermia
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Abdominal distension
    causal_link_type: DIRECT
  - target: Metabolic acidosis
    causal_link_type: DIRECT
  - target: Respiratory distress
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Gray baby syndrome is a severe adverse reaction to chloramphenicol, with a mortality rate up to 40%."
    explanation: Quantifies the high mortality of the syndrome this node represents.
  - reference: PMID:42073156
    reference_title: "Potentially Hazardous Drugs in the Paediatric ICU: A Narrative Review on the Exemplary Cases of Propofol, Chloramphenicol, and Acetylsalicylic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "characterised by abdominal distension, vomiting, respiratory distress, hypothermia, hypotension, progressive cyanosis, and ash-grey skin discolouration"
    explanation: Peer-reviewed enumeration of the toxidrome features this node fans out to.
- name: Myocardial Dysfunction and Microcirculatory Failure
  description: >-
    At high exposure the drug and the resulting cellular necrosis release
    vasoactive substances and cause myocardial damage, reducing cardiac output and
    peripheral perfusion - the proposed hemodynamic bridge from the cellular lesion
    to overt circulatory collapse. In the cited case this limb was documented
    (reduced ejection fraction recovering with treatment).
  biological_scale: ORGANISM
  downstream:
  - target: Circulatory collapse
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "At high doses, the drug also induces myocardial damage and dysfunction"
    explanation: >-
      Names the myocardial-dysfunction intermediate between the cellular lesion and
      circulatory collapse.
- name: Chronic Chloramphenicol Neurotoxicity
  description: >-
    Prolonged chloramphenicol exposure produces a neurotoxicity - optic neuritis,
    often with peripheral neuropathy - separate from the acute neonatal syndrome.
    Across the reported cases it follows prolonged, high-cumulative-dose therapy
    (mean ~229 days and ~255 g at the time of neurologic findings), which is the
    discriminator that sets this chronic arm apart from the acute toxidrome.
    Its mechanism is not established; direct neurotoxicity, hypersensitivity and
    vitamin B deficiency have all been proposed, and the vitamin-deficiency
    hypothesis underlies the B12/B6 treatment sometimes used. It is therefore
    placed off the exposure node rather than the mitochondrial chain.
  biological_scale: ORGANISM
  downstream:
  - target: Optic neuritis
    causal_link_type: DIRECT
  - target: Peripheral neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optic neuritis is the most common neurotoxicity and can often be accompanied by peripheral neuropathy"
    explanation: >-
      Documents the optic neuritis and accompanying peripheral neuropathy of
      prolonged chloramphenicol exposure.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism(s) of neurotoxicity is unknown. Direct neurotoxicity, hypersensitivity, and vitamin B deficiency have been speculated."
    explanation: >-
      Source states the mechanism is unresolved, which is why this node is not
      attributed to the mitochondrial lesion.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the mean duration of chloramphenicol therapy at the time of neurologic findings was 229 days (range, 10-1513 days), with a mean total exposure dose of 255 grams"
    explanation: >-
      Quantifies the prolonged, high-cumulative-dose exposure that distinguishes
      the chronic neurotoxicity arm, pooled across 54 reported patients.
- name: Idiosyncratic Bone Marrow Aplasia
  description: >-
    A rare, dose-independent, often fatal aplastic anaemia that is not explained by
    the mitochondrial mechanism. The pathogenesis is uncertain; the leading
    hypothesis is metabolic transformation of the drug's p-NO2 (nitro) group into
    a toxic intermediate that damages haematopoietic stem cells in susceptible
    people, and it can appear after exposure has ended.
  biological_scale: TISSUE
  downstream:
  - target: Aplastic anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pathogenesis of aplastic anemia from chloramphenicol treatment remains uncertain."
    explanation: Supports treating the aplastic-anaemia arm as mechanistically unresolved.
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A large body of indirect evidence favors a complex mechanism involving metabolic transformation of the p-NO2 group of chloramphenicol by the predisposed subject, leading to the production of a toxic intermediate causing stem cell damage."
    explanation: Gives the leading nitro-metabolite hypothesis for stem-cell injury in this arm.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "an idiosyncratic reaction resulting in aplastic anemia that was unpredictable, irreversible, and frequently fatal, occurring with an incidence of 1 case in 24,000 to 40,000 courses of therapy"
    explanation: >-
      Gives the dose-independent, irreversible character and the incidence of this arm.
  - reference: PMID:42073156
    reference_title: "Potentially Hazardous Drugs in the Paediatric ICU: A Narrative Review on the Exemplary Cases of Propofol, Chloramphenicol, and Acetylsalicylic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Historically, this adverse event came with a high mortality rate of around 50%"
    explanation: Quantifies the historical mortality of the idiosyncratic aplastic anaemia.

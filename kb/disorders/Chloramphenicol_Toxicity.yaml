name: Chloramphenicol Toxicity
creation_date: "2026-10-06T00:00:00Z"
category: Complex
categories:
- Treatment Toxicity
- Toxic Exposure Disorder
parents:
- Drug Toxicity
- Poisoning
synonyms:
- chloramphenicol poisoning
- gray baby syndrome
- grey baby syndrome
- chloramphenicol-induced bone marrow suppression
description: >-
  Chloramphenicol toxicity is the systemic toxicity syndrome of the broad-spectrum
  antibiotic chloramphenicol, which inhibits the peptidyl-transferase of the
  bacterial 50S ribosomal subunit and, because the mitochondrial ribosome is
  structurally bacterial-like, also inhibits mitochondrial protein synthesis in
  host cells. Two largely distinct toxicities result. The first is dose-dependent
  and mitochondrial: impaired synthesis of respiratory-chain subunits depresses
  oxidative phosphorylation, producing a reversible bone-marrow suppression
  (anaemia, reticulocytopenia) and, in neonates whose hepatic UDP-glucuronosyl-
  transferase and renal excretion are immature, drug accumulation to toxic
  concentrations and the "gray baby syndrome" - vomiting, hypothermia, abdominal
  distension, an ashen-gray colour, hypotension and circulatory collapse. The
  second is idiosyncratic: a rare, dose-independent and often fatal aplastic
  anaemia that is not explained by the mitochondrial mechanism and is thought to
  involve a toxic nitroso metabolite in genetically susceptible people. Management
  is stopping the drug and supportive care, with drug-concentration monitoring,
  and for massive accumulation, exchange transfusion or charcoal haemoperfusion.
disease_term:
  preferred_term: chloramphenicol toxicity
  term:
    id: MONDO:0010784
    label: chloramphenicol toxicity
pathophysiology:
- name: Impaired Neonatal Hepatic Glucuronidation
  description: >-
    Neonates, and especially premature infants, have immature hepatic
    UDP-glucuronosyltransferase (UGT1A1) activity and immature renal excretion, so
    they cannot conjugate and clear chloramphenicol. At standard weight-based
    doses the drug therefore accumulates to toxic plasma concentrations - the
    basis of neonatal susceptibility to gray baby syndrome.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  downstream:
  - target: Systemic Chloramphenicol Accumulation
    causal_link_type: DIRECT
- name: Systemic Chloramphenicol Accumulation
  description: >-
    High circulating chloramphenicol, from impaired neonatal clearance or from
    overdose, is the exposure that drives host toxicity.
  biological_scale: ORGANISM
  downstream:
  - target: Mitochondrial Ribosomal Protein-Synthesis Inhibition
    causal_link_type: DIRECT
  - target: Idiosyncratic Bone Marrow Aplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mitochondrial Ribosomal Protein-Synthesis Inhibition
  description: >-
    Chloramphenicol inhibits the peptidyl-transferase of the bacterial 50S
    ribosomal subunit; the mitochondrial ribosome is bacterial-like, so the drug
    also blocks mitochondrial protein synthesis in host cells, impairing synthesis
    of respiratory-chain subunits.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Oxidative Phosphorylation Failure
    causal_link_type: DIRECT
- name: Oxidative Phosphorylation Failure
  description: >-
    Depressed synthesis of mitochondrially encoded respiratory-chain subunits
    lowers oxidative phosphorylation, the common cellular lesion behind both the
    circulatory failure of gray baby syndrome and the dose-dependent marrow
    suppression.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Gray Baby Circulatory Collapse
    causal_link_type: DIRECT
  - target: Dose-Dependent Bone Marrow Suppression
    causal_link_type: DIRECT
- name: Gray Baby Circulatory Collapse
  description: >-
    In the accumulating neonate, mitochondrial energetic failure produces the gray
    baby syndrome: vomiting, hypothermia, an ashen-gray colour, hypotension and
    cardiovascular collapse.
  biological_scale: ORGANISM
  downstream:
  - target: Ashen-gray discoloration
  - target: Hypothermia
  - target: Vomiting
  - target: Circulatory collapse
- name: Dose-Dependent Bone Marrow Suppression
  description: >-
    The same mitochondrial mechanism depresses erythroid maturation in a
    dose-dependent, reversible way, producing anaemia and reticulocytopenia that
    resolve on stopping the drug.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  downstream:
  - target: Anemia
  - target: Reticulocytopenia
- name: Idiosyncratic Bone Marrow Aplasia
  description: >-
    A rare, dose-independent, often fatal aplastic anaemia that is not explained by
    the mitochondrial mechanism; it is thought to involve a toxic nitroso/nitro
    reduction metabolite of chloramphenicol in genetically susceptible people and
    can appear weeks after exposure.
  biological_scale: TISSUE
  downstream:
  - target: Aplastic anemia
phenotypes:
- name: Ashen-gray discoloration
  description: Characteristic ashen-gray skin colour of gray baby syndrome, reflecting circulatory failure and cyanosis.
  phenotype_term:
    preferred_term: Ashen-gray cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
- name: Hypothermia
  description: Low body temperature in gray baby syndrome.
  phenotype_term:
    preferred_term: Hypothermia
    term:
      id: HP:0002045
      label: Hypothermia
- name: Vomiting
  description: Vomiting and feeding intolerance, an early sign of neonatal toxicity.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
- name: Circulatory collapse
  description: Hypotension progressing to cardiovascular collapse, the lethal event of gray baby syndrome.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
- name: Anemia
  description: Dose-dependent, reversible anaemia from marrow suppression.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
- name: Reticulocytopenia
  description: Reduced reticulocyte count, reflecting suppressed erythropoiesis.
  phenotype_term:
    preferred_term: Reticulocytopenia
    term:
      id: HP:0001896
      label: Reticulocytopenia
- name: Aplastic anemia
  description: Idiosyncratic, dose-independent aplastic anaemia, often fatal.
  phenotype_term:
    preferred_term: Aplastic anemia
    term:
      id: HP:0001915
      label: Aplastic anemia
environmental:
- name: Systemic chloramphenicol administration
  exposure_term:
    preferred_term: exposure to chloramphenicol
    term:
      id: ECTO:9000360
      label: exposure to chloramphenicol
  description: >-
    The exposure is iatrogenic: systemic chloramphenicol given as antibiotic
    therapy. Toxicity follows when a neonate cannot clear a standard dose, or at
    higher exposures in any patient.
  influences_mechanisms:
  - target: Systemic Chloramphenicol Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administered chloramphenicol is the source of the circulating drug that, in
      the immature or overexposed patient, accumulates to toxic levels.
treatments:
- name: Drug discontinuation and supportive care
  description: >-
    Stopping chloramphenicol and supporting circulation and temperature; the
    mainstay for gray baby syndrome and dose-dependent marrow suppression.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Extracorporeal drug removal
  description: >-
    Exchange transfusion or charcoal haemoperfusion to clear massively accumulated
    chloramphenicol in severe neonatal toxicity.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure

environmental:
- name: Systemic chloramphenicol administration
  exposure_term:
    preferred_term: exposure to chloramphenicol
    term:
      id: ECTO:9000360
      label: exposure to chloramphenicol
  description: >-
    The exposure is iatrogenic: chloramphenicol given as antibiotic therapy, by
    intravenous or oral route. Toxicity follows when a neonate cannot clear a
    standard dose, at higher exposures in any patient, or idiosyncratically.
  evidence:
  - reference: PMID:28846297
    reference_title: "Gray Baby Syndrome (Archived)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neonates born at less than 37 weeks gestation were given chloramphenicol in an intravenous or oral formulation within two days of birth"
    explanation: Establishes the iatrogenic systemic administration that is the exposure.
  influences_mechanisms:
  - target: Systemic Chloramphenicol Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administered chloramphenicol is the source of the circulating drug that
      drives host toxicity.
diagnosis:
- name: Clinical recognition and serum concentration
  description: >-
    Diagnosis rests on a temporal link to chloramphenicol exposure with a
    compatible toxidrome, supported by a serum chloramphenicol concentration;
    high levels predict severe toxicity and death, which is also the basis for
    therapeutic monitoring in neonates.
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "fatal cases consistently showing serum chloramphenicol levels exceeding 50"
    explanation: Supports serum concentration as a diagnostic and prognostic measurement.
- name: Blood count monitoring during therapy
  description: >-
    Serial complete blood counts with reticulocytes detect the dose-dependent
    marrow suppression early, before it is severe.
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The common, dose-dependent, reversible bone marrow suppression from chloramphenicol is a consequence of mitochondrial injury."
    explanation: The dose-dependent, reversible suppression is what blood-count monitoring is for.
differential_diagnoses:
- name: Other causes of aplastic anemia
  description: >-
    Aplastic anaemia has many drug, toxic, viral and idiopathic causes that
    overlap with the idiosyncratic chloramphenicol form.
  distinguishing_features:
  - A documented chloramphenicol exposure within the aetiological window points to the drug, though the attributable risk per course is very low.
  evidence:
  - reference: PMID:9723830
    reference_title: "Possible association between ocular chloramphenicol and aplastic anaemia--the absolute risk is very low."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An association between ocular chloramphenicol and aplastic anaemia cannot be excluded. However, the risk is less than one per million treatment courses."
    explanation: The low attributable risk is why exposure history, not the finding alone, distinguishes the drug cause.
treatments:
- name: Drug discontinuation and supportive care
  description: >-
    Stopping chloramphenicol and supporting circulation, ventilation and
    temperature; the mainstay for gray baby syndrome and dose-dependent marrow
    suppression.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggressive management included mechanical ventilation, inotropic support (dopamine/milrinone), norepinephrine infusion"
    explanation: Documents the intensive supportive care used for severe gray baby syndrome.
- name: Extracorporeal drug removal
  description: >-
    Continuous renal replacement therapy, exchange transfusion or charcoal
    haemoperfusion to clear massively accumulated chloramphenicol in severe
    toxicity.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "delayed CRRT proved pivotal in reversing toxicity in our patient"
    explanation: Reports extracorporeal removal (CRRT) reversing severe accumulation.

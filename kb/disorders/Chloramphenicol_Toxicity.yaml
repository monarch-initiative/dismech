name: Chloramphenicol Toxicity
creation_date: "2026-10-06T00:00:00Z"
category: Complex
categories:
- Treatment Toxicity
- Toxic Exposure Disorder
parents:
- Drug Toxicity
- Poisoning
synonyms:
- chloramphenicol poisoning
- gray baby syndrome
- grey baby syndrome
- chloramphenicol-induced bone marrow suppression
- chloramphenicol-induced aplastic anemia
description: >-
  Chloramphenicol toxicity is the systemic toxicity syndrome of the broad-spectrum
  antibiotic chloramphenicol, which inhibits the peptidyl-transferase of the
  bacterial 50S ribosomal subunit and, because the mitochondrial ribosome is
  bacterial-like, also inhibits mitochondrial protein synthesis in host cells.
  Three largely distinct clinical forms are recognised. A dose-dependent,
  reversible bone-marrow suppression (predominantly erythroid, with anaemia) is a
  direct consequence of mitochondrial injury and resolves on withdrawal. In
  neonates - whose hepatic glucuronidation and renal excretion are immature - the
  drug accumulates to toxic serum concentrations and produces the "gray baby
  syndrome": vomiting, abdominal distension, hypothermia, an ashen-gray colour,
  hypotension and cardiovascular collapse. A third form, idiosyncratic aplastic
  anaemia, is rare, dose-independent, can follow any route of exposure (including
  topical/ocular), is often fatal, and has an uncertain mechanism thought to
  involve a toxic nitro-reduction metabolite in susceptible people - it is not
  explained by the mitochondrial mechanism and is modelled here as a separate arm.
  Management is stopping the drug and supportive care, with serum-concentration
  monitoring and, for massive accumulation, extracorporeal drug removal.
disease_term:
  preferred_term: chloramphenicol toxicity
  term:
    id: MONDO:0010784
    label: chloramphenicol toxicity
notes: >-
  Deliberately curated as one entry spanning the three forms. The dose-dependent
  marrow suppression and the gray baby syndrome share the mitochondrial-injury
  mechanism and are wired through it; idiosyncratic aplastic anaemia is kept as a
  separate, mechanistically distinct arm off the exposure node rather than
  downstream of the mitochondrial lesion (Yunis PMID:2486534 frames them as
  separate). The neonatal glucuronidation defect is developmental immaturity of
  UDP-glucuronosyltransferase; the isoform usually named for chloramphenicol
  glucuronidation is UGT2B7 (not the bilirubin enzyme UGT1A1), but no gene is
  bound on the glucuronidation node because no primary source naming the isoform
  was verified in this curation.
pathophysiology:
- name: Systemic Chloramphenicol Exposure
  description: >-
    Chloramphenicol given systemically (intravenous or oral) reaches host tissues.
    This circulating drug is the common initiator of toxicity; the dose at which
    it harms depends on how well the patient clears it.
  biological_scale: ORGANISM
  downstream:
  - target: Mitochondrial Ribosomal Protein-Synthesis Inhibition
    causal_link_type: DIRECT
  - target: Idiosyncratic Bone Marrow Aplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A rare, dose-independent arm that can follow any route of exposure; the
      mechanism linking exposure to stem-cell injury is not established.
    evidence:
    - reference: PMID:9723830
      reference_title: "Possible association between ocular chloramphenicol and aplastic anaemia--the absolute risk is very low."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An association between ocular chloramphenicol and aplastic anaemia cannot be excluded. However, the risk is less than one per million treatment courses."
      explanation: >-
        Shows aplastic anaemia can follow even topical/ocular exposure and is very
        rare, consistent with a dose-independent idiosyncratic arm.
- name: Impaired Neonatal Hepatic Glucuronidation
  description: >-
    Neonates, especially premature infants, have immature hepatic
    UDP-glucuronosyltransferase activity and immature renal excretion, so they
    cannot conjugate and clear chloramphenicol. A standard weight-based dose
    therefore accumulates to toxic serum concentrations - the basis of neonatal
    susceptibility to gray baby syndrome.
  biological_scale: MOLECULAR
  downstream:
  - target: Systemic Chloramphenicol Exposure
    causal_link_type: DIRECT
    description: >-
      Deficient clearance raises and prolongs circulating drug in the neonate, so
      a normal dose behaves as an overdose.
- name: Mitochondrial Ribosomal Protein-Synthesis Inhibition
  description: >-
    Chloramphenicol inhibits the peptidyl-transferase of the bacterial 50S
    ribosomal subunit; the mitochondrial ribosome is bacterial-like, so the drug
    also blocks mitochondrial protein synthesis in host cells, injuring
    mitochondria and impairing synthesis of respiratory-chain subunits.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Oxidative Phosphorylation Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The common, dose-dependent, reversible bone marrow suppression from chloramphenicol is a consequence of mitochondrial injury."
    explanation: >-
      Attributes the dose-dependent marrow toxicity to mitochondrial injury, the
      lesion this node represents.
- name: Oxidative Phosphorylation Failure
  description: >-
    Depressed synthesis of mitochondrially encoded respiratory-chain subunits
    lowers oxidative phosphorylation, the shared cellular lesion behind both the
    dose-dependent marrow suppression and, as the proposed mechanism, the
    circulatory failure of gray baby syndrome.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Dose-Dependent Bone Marrow Suppression
    causal_link_type: DIRECT
  - target: Gray Baby Circulatory Collapse
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from mitochondrial energetic failure in cardiac and other tissues
      to neonatal circulatory collapse is the commonly proposed link, not directly
      demonstrated.
- name: Dose-Dependent Bone Marrow Suppression
  description: >-
    The mitochondrial lesion depresses erythropoiesis in a dose-dependent,
    reversible way; the erythroid lineage is most susceptible, reflecting its
    reliance on mitochondrial amino-acid pools. Anaemia resolves on stopping the
    drug.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The greater erythroid susceptibility to chloramphenicol appears to be a function of the endogenous mitochondrial amino acid pools."
    explanation: >-
      Explains the erythroid predominance of the dose-dependent suppression this
      node describes.
- name: Gray Baby Circulatory Collapse
  description: >-
    In the accumulating neonate, toxicity produces the gray baby syndrome:
    vomiting, abdominal distension, hypothermia, an ashen-gray colour, hypotension
    and cardiovascular collapse, with a high mortality.
  biological_scale: ORGANISM
  downstream:
  - target: Ashen-gray discoloration
    causal_link_type: DIRECT
  - target: Hypothermia
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Circulatory collapse
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infants receiving excessive doses of chloramphenicol are at risk of fatal cardiovascular collapse, a condition known as gray baby syndrome"
    explanation: >-
      States the overexposure-to-cardiovascular-collapse relationship that defines
      this node.
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gray baby syndrome is a severe adverse reaction to chloramphenicol, with a mortality rate up to 40%."
    explanation: Quantifies the high mortality of the syndrome.
- name: Idiosyncratic Bone Marrow Aplasia
  description: >-
    A rare, dose-independent, often fatal aplastic anaemia that is not explained by
    the mitochondrial mechanism. The pathogenesis is uncertain; the leading
    hypothesis is metabolic transformation of the drug's p-NO2 (nitro) group into
    a toxic intermediate that damages haematopoietic stem cells in susceptible
    people, and it can appear after exposure has ended.
  biological_scale: TISSUE
  downstream:
  - target: Aplastic anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pathogenesis of aplastic anemia from chloramphenicol treatment remains uncertain."
    explanation: Supports treating the aplastic-anaemia arm as mechanistically unresolved.
  - reference: PMID:2486534
    reference_title: "Chloramphenicol toxicity: 25 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A large body of indirect evidence favors a complex mechanism involving metabolic transformation of the p-NO2 group of chloramphenicol by the predisposed subject, leading to the production of a toxic intermediate causing stem cell damage."
    explanation: Gives the leading nitro-metabolite hypothesis for stem-cell injury in this arm.

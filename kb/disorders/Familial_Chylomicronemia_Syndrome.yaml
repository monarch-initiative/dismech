  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >
    APOA5 encodes apolipoprotein A-V, which promotes LPL-mediated lipolysis of
    triglyceride-rich lipoproteins. Biallelic pathogenic variants are a rarer
    cause of FCS.
  review_notes: >-
    APOA5 is the one of the five FCS genes carried without a matching
    `has_subtypes` row, because no MONDO class denotes an FCS-scoped APOA5
    disease. `runoak -i ols:mondo search "APOA5"` returns exactly one term,
    MONDO:0007762 hyperlipoproteinemia type V, and `runoak -i ols:mondo search
    "apolipoprotein A-V"` returns that same term plus two unrelated
    amyloidoses. MONDO:0007762 does carry "familial APOA5 deficiency" and
    "familial apolipoprotein A-V deficiency" as exact synonyms, but its own
    definition reads "Type V hyperlipoproteinemia is often associated with
    diabetes mellitus and is not caused by reduced lipoprotein lipase activity
    as in hyperlipoproteinemia type I", so binding it here would assert a
    non-LPL-dependent entity that this entry does not model. `runoak -i
    ols:mondo search "l~hyperlipoproteinemia, type 1"` returns only
    MONDO:0014412 type 1D, the GPIHBP1 class, so MONDO has no numbered
    type 1 sibling for APOA5 either. The gene reaches the pathograph through
    the "Defective LPL Maturation, Trafficking, and Activation" node instead.
  evidence:
  - reference: PMID:40023655
    reference_title: "Comprehensive analysis of Chinese patients with non-LPL familial chylomicronemia syndrome: Genetic variants, dietary interventions, and clinical insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Familial chylomicronemia syndrome (FCS) comprises a group of ultrarare disorders caused by biallelic variants in LPL or, less frequently, by GPIHBP1, APOC2, APOA5, or LMF1."
    explanation: >-
      Places APOA5 among the five FCS genes. In this cohort the single APOA5
      patient carried composite heterozygous APOA5 and LPL variants rather
      than biallelic APOA5 variants alone.
  - reference: PMID:40500638
    reference_title: "Characterization of familial chylomicronemia syndrome in a compound heterozygote for 2 APOA5 nonsense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's plasma also demonstrated reduced LPL activity and elevated apo C-II and C-III compared to other family members."
    explanation: >-
      An FCS patient compound heterozygous for two APOA5 nonsense variants with
      reduced plasma LPL activity, which is the clearest single-gene APOA5 case
      in the literature reviewed for this entry.

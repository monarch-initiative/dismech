    explanation: Comparative review documents favorable tolerability of olezarsen with need for liver enzyme, glycemic, and platelet monitoring.
- name: Plozasiran
  therapeutic_modality: SIRNA
  oligonucleotide_details:
    oligonucleotide_mechanism: RNAI_KNOCKDOWN
    target_gene:
      preferred_term: APOC3
      term:
        id: hgnc:610
        label: APOC3
    target_transcript: APOC3 mRNA
    conjugation: GALNAC
    delivery_platform: CONJUGATE
  description: >
    GalNAc-conjugated small interfering RNA (siRNA) directed against APOC3
    mRNA, mediating RNA interference to reduce hepatic synthesis of
    apolipoprotein C-III. Like the APOC3 antisense oligonucleotides, lowering
    apoC-III restores triglyceride clearance independently of residual LPL
    activity. In the placebo-controlled phase 3 PALISADE trial in FCS,
    plozasiran lowered triglycerides and reduced acute pancreatitis events and
    has recently been approved as an adjunct to diet for adults with FCS.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

pathophysiology:
- name: Defective LPL Maturation, Trafficking, and Activation
  description: >-
    Four of the five FCS genes act on lipoprotein lipase rather than encoding
    it. LMF1 is an endoplasmic reticulum chaperone involved in the
    post-translational activation of LPL; GPIHBP1 is the capillary endothelial
    protein that attaches to LPL and carries it to the capillary lumen; apoC-II
    is one of the cofactors that regulate LPL activity; and apoA-V binding to
    the lipoprotein particle is required for normal hydrolysis of
    triglyceride-rich lipoproteins. Biallelic loss of function leaves the LPL
    gene intact, and measured LPL activity is nonetheless reduced in GPIHBP1,
    LMF1 and APOA5 genotypes, which is the readout that ties these genes to the
    lipase deficiency node downstream. Two processes are bound here because the
    four genes do not share one: positive regulation of lipoprotein lipase
    activity covers the APOC2 and APOA5 cofactor step and, more loosely, the
    LMF1 maturation step, whereas GPIHBP1 transports and anchors the enzyme
    rather than regulating its activity, which is protein localization to the
    cell surface.
  biological_scale: MOLECULAR

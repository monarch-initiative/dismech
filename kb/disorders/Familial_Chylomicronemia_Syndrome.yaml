- name: Evinacumab (ANGPTL3 Inhibition)
  description: >-
    Evinacumab is an anti-ANGPTL3 monoclonal antibody that de-represses
    lipoprotein lipase activity. Its triglyceride-lowering effect is
    mechanistically LPL-dependent, so it can benefit chylomicronemia patients
    with residual LPL activity but is largely ineffective in true biallelic
    LPL-null FCS - a genotype-dependent limitation that distinguishes it from
    apoC-III-lowering ASO/siRNA therapies, which act partly via LPL-independent
    clearance.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Evinacumab
      term:
        id: NCIT:C169973
        label: Evinacumab
  target_mechanisms:
  - target: Chylomicronemia and Severe Hypertriglyceridemia
    treatment_effect: INHIBITS
    description: >-
      ANGPTL3 inhibition de-represses residual LPL activity; efficacy is
      contingent on the patient retaining some functional lipoprotein lipase.
  evidence:
  - reference: PMID:41208140
    reference_title: "Lessons from recent clinical trials for the prevention of acute pancreatitis in chylomicronemia syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ANGPTL3 inhibition via evinacumab may benefit patients with residual lipoprotein lipase activity, including polygenic or mixed chylomicronemia, and could be used during acute sHTG episodes."
    explanation: Review documents that evinacumab's benefit is restricted to patients with residual LPL activity, informing genotype-guided use.
  - reference: PMID:40046103

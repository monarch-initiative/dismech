discussions:
- discussion_id: hyp_tent5a_smad_bmp_signaling
  prompt: >-
    Does impaired TENT5A (FAM46A) physical stabilization of SMAD1/SMAD4 and
    resulting attenuation of BMP/TGF-beta target transcription contribute to
    the skeletal dysplasia of OI type XVIII alongside defective cytoplasmic
    polyadenylation of osteoblast ECM transcripts?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#TENT5A (FAM46A) Loss Eliminates Cytoplasmic Polyadenylation of Osteoblast ECM mRNAs
  rationale: >-
    Beyond its canonical role as a cytoplasmic poly(A) polymerase for Col1a1,
    Col1a2, and osteoblast secretome mRNAs, FAM46A/TENT5A physically interacts
    with SMAD1 and SMAD4 in the TGF-beta/BMP pathway to stabilize them and
    promote BMP target gene expression; the relative contribution of reduced
    BMP signaling versus secretome mRNA destabilization to the human bone
    phenotype has not yet been dissected experimentally.
  evidence:
  - reference: DOI:10.1007/s00223-024-01266-5
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Yet another function of FAM46A which may contribute to the bone dysplasia
      of type XIX OI is its role as a binding partner for SMADs in the TGF-β
      pathway, physically interacting with Smad1 and Smad4 to stabilize them
    explanation: >-
      Highlights SMAD1/SMAD4 stabilization in the BMP/TGF-beta pathway as a
      candidate secondary mechanism in TENT5A-related OI.
  - reference: DOI:10.1007/s00223-024-01266-5
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The relative contribution of significantly reduced collagen, reduction of
      other bone matrix proteins which are related to OI types ... reduction in
      BMP signaling has not been investigated.
    explanation: >-
      Confirms that the relative contribution of presumptive BMP signaling
      reduction versus ECM polyadenylation loss remains an open mechanistic
      question.
  - reference: PMID:31220415
    reference_title: "Bone biology: insights from osteogenesis imperfecta and related rare fragility syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this regard, FAM46A has been recently demonstrated to function as a
      modulator of BMP signaling, via its binding to Smad1 and Smad4 during
      early differentiation of Xenopus (Figure 4) [ 183 ].
    explanation: >-
      Documents experimental evidence for FAM46A/TENT5A modulation of BMP
      signaling through SMAD1/SMAD4 binding in Xenopus development.

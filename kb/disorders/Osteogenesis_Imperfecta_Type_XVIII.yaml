diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XVIII is suspected in an infant with severe recessive OI (congenital
    long-bone bowing, recurrent fractures, vertebral collapse, blue sclerae,
    wormian bones) when COL1A1/COL1A2 and other known OI genes are negative.
    Diagnosis is confirmed by identifying a biallelic TENT5A (FAM46A)
    loss-of-function variant by gene-panel or exome sequencing; screening of
    FAM46A/TENT5A is recommended in unexplained OI forms.
  diagnosis_term:

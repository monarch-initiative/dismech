name: Sideroblastic Anemia 4
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- SIDBA4
- autosomal dominant sideroblastic anemia
- HSPA9-related congenital sideroblastic anemia
- sideroblastic anemia, autosomal dominant
description: >
  Sideroblastic anemia 4 is a congenital sideroblastic anemia caused by germline partial
  loss-of-function variants in HSPA9, the mitochondrial HSP70 chaperone also called
  mortalin. With its co-chaperone HSCB it carries the nascent [2Fe-2S] cluster from the
  ISCU scaffold to glutaredoxin 5, so the lesion sits at the transfer step of
  mitochondrial cluster assembly rather than at synthesis or export. Cluster deficiency
  leaves iron regulatory protein 1 in its RNA-binding form, which represses translation
  of erythroid ALAS2 and so blocks heme synthesis while iron continues to arrive at the
  erythroblast mitochondrion, producing the ring sideroblast. The anemia runs from mild
  to transfusion-dependent and is microcytic or normocytic with a raised red-cell
  distribution width. Inheritance is recessive, but a severe allele in trans with a
  common low-expression variant produces an apparently dominant pedigree, which is why
  the disease carries a dominant name.
disease_term:
  preferred_term: autosomal dominant sideroblastic anemia
  term:
    id: MONDO:0008422
    label: autosomal dominant sideroblastic anemia
parents:
- Inherited Sideroblastic Anemia
- Mitochondrial iron-sulfur cluster assembly disorder
notes: >-
  The entry is named Sideroblastic Anemia 4, the OMIM 182170 serial name, rather than
  the MONDO label `autosomal dominant sideroblastic anemia`, because the founding study
  states the disease is inherited as an autosomal recessive trait and that the apparently
  dominant pedigrees are pseudodominant. By the entry-naming rule the name must not
  assert more than the entry supports, and a dominant name asserts an inheritance mode
  the evidence contradicts. The MONDO label is kept in `synonyms` and the mismatch is a
  candidate MONDO label correction to report upstream; it has not been reported yet.
  No GeneReviews chapter covers HSPA9 (PubMed search `HSPA9[TIAB] AND genereviews[book]
  NOT retired[TI]` returned 0 on 2026-11-19), so the phenotype baseline is the founding
  cohort (PMID:26491070) and the congenital sideroblastic anemia review
  (PMID:30401706), both cached as abstracts only. Per-patient haematology values,
  per-family variant phasing and the retinitis pigmentosa and cytopenia observations
  appear in the founding paper's tables rather than its abstract, so they are not
  curated here as evidence-backed claims; the phenotypes recorded are those the cached
  abstracts support.
  ClinGen has no gene-disease validity record for HSPA9.
  EVEN-PLUS syndrome (MONDO:0014801) is a separate, biallelic HSPA9 disorder dominated by
  skeletal and other malformations and is not merged into this entry. Somatic HSPA9
  haploinsufficiency in del(5q) myelodysplastic syndrome is likewise a different entity.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic HSPA9 variants, typically a severe loss-of-function allele in trans with a
    hypomorphic one. Homozygous null patients have not been described.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "result in CSA inherited as an autosomal recessive trait"
    explanation: The founding study establishes recessive inheritance.
- name: Pseudodominant inheritance
  inheritance_term:
    preferred_term: Pseudoautosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >
    Where one severe loss-of-function allele is in trans with a common coding variant
    that lowers HSPA9 expression, disease appears in successive generations and the
    pedigree looks dominant. The low-expression allele is frequent enough in the
    population that this pattern is not rare, and some carriers of the same combination
    are unaffected.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expression of the clinical phenotype is associated with a common coding single nucleotide polymorphism in trans that correlates with reduced messenger RNA expression and results in a pseudodominant pattern of inheritance"
    explanation: Explains the apparently dominant pedigrees and the disease's dominant name.
prevalence:
- population: Global reported families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    HSPA9 is the most common of the iron-sulfur-related congenital sideroblastic anemia
    genes, with about a dozen families described. Nine of 88 probands with otherwise
    unexplained congenital sideroblastic anemia carried rare HSPA9 variants in the
    founding screen.
  evidence:
  - reference: PMID:30401706
    reference_title: "The molecular genetics of sideroblastic anemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "more than two-thirds of congenital SA cases, and an even greater proportion of cases of acquired clonal disease, can be attributed to mutations in a specific gene or genes"
    explanation: Places this gene within the proportion of congenital sideroblastic anemia that is now molecularly explained; the review is the source for the gene's relative frequency.
progression:
- phase: Childhood-onset chronic anemia
  age_range: Childhood onward
  notes: >-
    The anemia presents in childhood and is lifelong, ranging from a mild
    transfusion-independent picture to transfusion dependence. No natural-history study
    exists, and the founding cohort spans ages 1 to 77 years without stating age at onset.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The congenital sideroblastic anemias (CSAs) are relatively uncommon diseases characterized by defects in mitochondrial heme synthesis, iron-sulfur (Fe-S) cluster biogenesis, or protein synthesis."
    explanation: Places the disease in the congenital, lifelong sideroblastic anemia group.
pathophysiology:
- name: Severe HSPA9 Loss-of-Function Allele
  description: >
    A germline HSPA9 allele that abolishes or nearly abolishes function: nonsense,
    frameshift, an in-frame deletion that behaves as a null in yeast complementation, or
    a splice-region change. One de novo missense allele in the nucleotide-binding region
    has also been reported. No patient is homozygous for two such alleles.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: HSPA9
    term:
      id: hgnc:5244
      label: HSPA9
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate that mutations in HSPA9, a mitochondrial HSP70 homolog located in the chromosome 5q deletion syndrome 5q33 critical deletion interval and involved in mitochondrial Fe-S biogenesis, result in CSA"
    explanation: Establishes HSPA9 variants as the cause.
  downstream:
  - target: Reduced Mitochondrial HSPA9 Chaperone Dosage
    causal_link_type: DIRECT
- name: Low-Expression HSPA9 Allele in Trans
  description: >
    A common coding single nucleotide polymorphism that lowers HSPA9 messenger RNA
    expression. On its own it causes no disease, and it is frequent in the population; in
    trans with a severe allele it lowers total chaperone dosage below the threshold at
    which erythropoiesis fails. It is the second hit that makes an otherwise recessive
    disease look dominant. Whether the polymorphism itself lowers expression or merely
    marks a linked causal variant is unsettled.
  biological_scale: MOLECULAR
  node_class: TRANSCRIPT_LEVEL
  genetic_context:
    variant_origin: GERMLINE
  genes:
  - preferred_term: HSPA9
    term:
      id: hgnc:5244
      label: HSPA9
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a common coding single nucleotide polymorphism in trans that correlates with reduced messenger RNA expression"
    explanation: Identifies the low-expression allele and its correlation with reduced message.
  downstream:
  - target: Reduced Mitochondrial HSPA9 Chaperone Dosage
    causal_link_type: DIRECT
- name: Reduced Mitochondrial HSPA9 Chaperone Dosage
  description: >
    Total functional HSPA9 falls below the level erythropoiesis requires. Dosage, rather
    than any single allele, sets severity: a severe allele with a hypomorph gives the
    clinical phenotype while a severe allele with a normally expressed one often does
    not. Complete absence is not survivable, as homozygous knockout is embryonic lethal
    in the mouse.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: protein folding chaperone
    modifier: DECREASED
    term:
      id: GO:0044183
      label: protein folding chaperone
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:25550197
    reference_title: "Reduced levels of Hspa9 attenuate Stat5 activation in mouse B cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although homozygous knockout of Hspa9 is embryonically lethal, mice with heterozygous deletion of Hspa9 (Hspa9(+/-)) are viable and have a 50% reduction in Hspa9 expression."
    explanation: Establishes that complete loss is lethal and that the disease is a dosage problem.
  downstream:
  - target: Impaired Transfer of Nascent [2Fe-2S] Clusters to Glutaredoxin 5
    causal_link_type: DIRECT
- name: Impaired Transfer of Nascent [2Fe-2S] Clusters to Glutaredoxin 5
  conforms_to: "mitochondrial_iron_sulfur_cluster_assembly_failure#Reduced Cluster Delivery to Client Apoproteins"
  description: >
    HSPA9 works with the co-chaperone HSCB to move the newly built [2Fe-2S] cluster off
    the ISCU scaffold and onto glutaredoxin 5, which then distributes it to recipient
    proteins. This is the rate-limiting step of the disease, and it is distinct from the
    assembly step of the MMDS genes and from the export step of ABCB7: synthesis on the
    scaffold still happens, but the cluster cannot be handed on. Disease variants in
    HSPA9, HSCB and GLRX5 all converge on it, which is why the three genes cause the same
    anemia.
  biological_scale: MOLECULAR
  role: central_effector
  genes:
  - preferred_term: HSCB
    term:
      id: hgnc:28913
      label: HSCB
  - preferred_term: GLRX5
    term:
      id: hgnc:20134
      label: GLRX5
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  evidence:
  - reference: PMID:32634119
    reference_title: "Mutations in the iron-sulfur cluster biogenesis protein HSCB cause congenital sideroblastic anemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Together with glutaredoxin 5 (GLRX5), HSCB and HSPA9 facilitate the transfer of nascent 2-iron, 2-sulfur clusters to recipient mitochondrial proteins."
    explanation: States the transfer step HSPA9 performs and names its partners.
  - reference: PMID:32634119
    reference_title: "Mutations in the iron-sulfur cluster biogenesis protein HSCB cause congenital sideroblastic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in both HSPA9 and GLRX5 have previously been associated with CSA."
    explanation: Variants in the partners of the same transfer step cause the same disease, which supports the step being the shared lesion.
  downstream:
  - target: Deficiency of Cluster-Dependent Erythroid Iron Sensing and Enzymes
    causal_link_type: DIRECT
- name: Deficiency of Cluster-Dependent Erythroid Iron Sensing and Enzymes
  description: >
    Recipient proteins do not receive their clusters. Two consequences matter in the
    erythroblast: iron regulatory protein 1 stays in its cluster-free RNA-binding form,
    and ferrochelatase, itself a cluster enzyme, loses activity. Both were established
    for this pathway rather than specifically in HSPA9 patient erythroblasts.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  evidence:
  - reference: PMID:32634119
    reference_title: "Mutations in the iron-sulfur cluster biogenesis protein HSCB cause congenital sideroblastic anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "gene knockdown and deletion experiments performed in K562 cells, zebrafish, and mice demonstrate that loss of HSCB results in impaired Fe-S cluster biogenesis, a defect in RBC hemoglobinization, and the development of siderocytes"
    explanation: Loss of the transfer step impairs cluster biogenesis and haemoglobinization, shown for the co-chaperone rather than for HSPA9 itself.
  downstream:
  - target: Translational Repression of Erythroid ALAS2
    causal_link_type: DIRECT
- name: Translational Repression of Erythroid ALAS2
  conforms_to: "mitochondrial_iron_sulfur_cluster_assembly_failure#Erythroid Heme Synthesis Block"
  description: >
    Cluster-free iron regulatory protein 1 binds the iron-responsive element in the
    5-prime untranslated region of the erythroid ALAS2 message and blocks its
    translation. ALAS2 catalyses the first and rate-limiting step of heme synthesis, so
    the cell behaves as though iron-starved while iron is in fact plentiful. This step is
    carried over from the glutaredoxin 5 model of the same pathway and has not been shown
    in HSPA9 patient cells.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ALAS2
    term:
      id: hgnc:397
      label: ALAS2
  evidence:
  - reference: PMID:30401706
    reference_title: "The molecular genetics of sideroblastic anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This review focuses on an analysis of the genetics of these diseases and how understanding these defects may contribute to the design and implementation of rational therapies."
    explanation: The review is the source for the iron-sulfur to IRP1 to ALAS2 account of this disease group; the detailed account is in its body rather than its abstract, so this edge is recorded as a review synthesis and as an inferred step.
  downstream:
  - target: Blocked Erythroid Heme Synthesis
    causal_link_type: DIRECT
- name: Blocked Erythroid Heme Synthesis
  description: >
    Heme output falls, so haemoglobinization fails and the red cells are hypochromic and
    often microcytic. Ferrochelatase deficiency adds a second block at the final step of
    the same pathway.
  biological_scale: CELLULAR
  genes:

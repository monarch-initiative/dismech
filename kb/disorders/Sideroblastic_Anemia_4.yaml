  evidence:
  - reference: PMID:32634119
    reference_title: "Mutations in the iron-sulfur cluster biogenesis protein HSCB cause congenital sideroblastic anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "a defect in RBC hemoglobinization, and the development of siderocytes and more broadly perturbs hematopoiesis in vivo"
    explanation: Loss of the transfer step produces defective haemoglobinization and iron-loaded red cells.
  downstream:
  - target: Erythroblast Mitochondrial Iron Loading
    causal_link_type: DIRECT
- name: Erythroblast Mitochondrial Iron Loading
  description: >
    Iron keeps arriving at the erythroblast mitochondrion but cannot be put into heme, so
    it accumulates in the perinuclear ring that defines the sideroblastic anemias. The
    review's reading is that in iron-sulfur cluster defects the ring is not a direct
    mitochondrial iron-handling fault but a consequence of the iron-sensing and
    heme-synthesis block above it.
  biological_scale: TISSUE

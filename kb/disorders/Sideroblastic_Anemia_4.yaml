discussions:
- discussion_id: sidba4_common_allele_causality
  prompt: >-
    Is the common low-expression HSPA9 allele itself the second hit, or a marker for a
    linked causal variant?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Low-Expression HSPA9 Allele in Trans
  rationale: >-
    The founding study's case rests on the association of a common coding polymorphism in
    trans with clinical expression, and that association was marginal rather than
    decisive. The polymorphism is synonymous, so a direct protein effect is not available
    as an explanation, and the proposal is that it lies in an exonic splice enhancer. The
    review of this disease group raises the alternative that it is in linkage
    disequilibrium with the true causative variant. Expression differences between
    genotype groups overlap substantially, which fits a marker as well as a cause. This
    matters directly for reporting: if the common allele is causal, it must be phased and
    reported in every suspected patient, and if it is a marker, laboratories are
    reporting the wrong variant.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expression of the clinical phenotype is associated with a common coding single nucleotide polymorphism in trans that correlates with reduced messenger RNA expression"
    explanation: The claim is an association with reduced expression, not a demonstrated causal effect of the variant itself.
  - reference: PMID:30401706
    reference_title: "The molecular genetics of sideroblastic anemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Within the last 30 years, with the advent of positional cloning, the human genome project, solid-state genotyping technologies, and next-generation sequencing have evolved to the point where"
    explanation: The review that raises the linkage-disequilibrium alternative; the specific caution is in its body rather than its abstract, so this item records the source and not the claim.
  proposed_experiments:
  - experiment_id: sidba4_allele_editing
    name: Base editing of the candidate allele on a fixed haplotype
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In an erythroid cell line, convert the candidate allele to the ancestral base and
      back on an otherwise unchanged haplotype, then measure HSPA9 messenger RNA, splice
      isoform usage, protein level and haemoglobinization. Repeat on two or more distinct
      haplotype backgrounds to separate the allele's own effect from anything linked to
      it.
    would_support:
    - pathophysiology#Low-Expression HSPA9 Allele in Trans
    supporting_outcome:
    - Editing the single base changes HSPA9 expression in the predicted direction on every haplotype background, which would make the common allele causal
    refuting_outcome:
    - No expression change from the edit while the expression difference tracks the surrounding haplotype, which would make it a marker and send the search to the linked variant
- discussion_id: sidba4_alas2_step_unverified_in_patients
  prompt: >-
    Does the iron regulatory protein 1 to ALAS2 route actually operate in HSPA9-deficient
    human erythroblasts, or is it carried over from the glutaredoxin 5 model?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Translational Repression of Erythroid ALAS2
  - pathophysiology#Deficiency of Cluster-Dependent Erythroid Iron Sensing and Enzymes
  rationale: >-
    The chain from cluster deficiency through iron regulatory protein 1 to repressed
    ALAS2 translation and the ring sideroblast is the accepted account for this disease
    group, but the experimental support comes from glutaredoxin 5 and co-chaperone
    models, not from HSPA9 patient erythroblasts. The entry marks those edges as
    inferred for that reason. The distinction is not merely bookkeeping: HSPA9 is a
    general mitochondrial import and folding chaperone as well as a cluster-transfer
    component, so some of the erythroid failure may come from impaired import of
    mitochondrial proteins rather than from cluster transfer at all, and no study has
    separated the two contributions.
  evidence:
  - reference: PMID:32634119
    reference_title: "Mutations in the iron-sulfur cluster biogenesis protein HSCB cause congenital sideroblastic anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "loss of HSCB results in impaired Fe-S cluster biogenesis, a defect in RBC hemoglobinization, and the development of siderocytes"
    explanation: The erythroid consequence of losing the transfer step is demonstrated for the co-chaperone, which is why the HSPA9 steps downstream of it are recorded as inferred.
  proposed_experiments:
  - experiment_id: sidba4_patient_erythroblast_chain
    name: HSPA9 patient erythroblast test of the IRP1-ALAS2 route
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      Differentiate erythroblasts from patient-derived CD34-positive cells or
      genotype-matched edited lines, and measure iron regulatory protein 1 RNA-binding
      activity, ALAS2 messenger RNA and protein, protoporphyrin, heme and ring
      sideroblast formation, with and without an ALAS2 construct lacking its
      iron-responsive element. Compare against an import-reporter readout to test the
      competing mitochondrial-import explanation in the same cells.
    would_support:
    - pathophysiology#Translational Repression of Erythroid ALAS2
    supporting_outcome:
    - Raised iron regulatory protein 1 binding with low ALAS2 protein, both corrected by the element-free ALAS2 construct, which would confirm the route in HSPA9 disease
    refuting_outcome:
    - Normal iron regulatory protein 1 binding and ALAS2 with an isolated mitochondrial import defect, which would reassign the mechanism away from cluster transfer
- discussion_id: sidba4_one_gene_two_diseases
  prompt: >-
    What distinguishes the HSPA9 genotypes that cause an isolated sideroblastic anemia
    from those that cause the malformation syndrome EVEN-PLUS?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Severe HSPA9 Loss-of-Function Allele
  - disease#
  rationale: >-
    Biallelic HSPA9 variants cause either a blood disease with no malformation or a
    skeletal and craniofacial malformation syndrome, and no rule separates them. A
    dosage model does not obviously work, since the anemia genotypes include outright
    null alleles. A plausible alternative is that the two diseases draw on different
    HSPA9 functions, with the anemia from the cluster-transfer role and the malformation
    syndrome from the chaperone's folding and import role, which would predict that the
    EVEN-PLUS alleles are specifically folding-incompetent while retaining
    cluster-transfer capacity. The published biochemistry is one-sided: the EVEN-PLUS
    alleles have been characterised for ATP hydrolysis, thermostability and aggregation,
    and the anemia alleles have only been tested by yeast complementation, so the two
    sets have never been compared on one assay.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in HSPA9, a mitochondrial HSP70 homolog located in the chromosome 5q deletion syndrome 5q33 critical deletion interval and involved in mitochondrial Fe-S biogenesis, result in CSA"
    explanation: Establishes the cluster-biogenesis role behind the anemia, the function the comparison would test against the malformation alleles.
  notes: >-
    EVEN-PLUS syndrome is curated separately under MONDO:0014801 and its features are
    deliberately not merged into this entry.

genetic:
- name: HSPA9
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: HSPA9
    term:
      id: hgnc:5244
      label: HSPA9
  variant_origin: GERMLINE
  notes: >
    Reported genotypes combine a severe allele (nonsense, frameshift, an in-frame
    deletion that behaves as a null in yeast complementation, or a splice-region change)
    with a hypomorphic missense or low-expression allele; one de novo missense allele has
    been reported. No homozygous-null patient is described. In yeast complementation the
    patient missense alleles ranged from near-normal to temperature-sensitive, and none
    was dominant-negative in a diploid, so the mechanism is loss of function or
    hypomorphism rather than a dominant-negative effect. Per-family variant phasing is in
    the founding paper's tables and is not reproduced here. HSPA9 lies in the 5q33
    critical deletion interval of del(5q) myelodysplastic syndrome, where somatic
    haploinsufficiency is a separate matter. ClinGen has no gene-disease validity record
    for HSPA9.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that mutations in HSPA9, a mitochondrial HSP70 homolog located in the chromosome 5q deletion syndrome 5q33 critical deletion interval and involved in mitochondrial Fe-S biogenesis, result in CSA inherited as an autosomal recessive trait."
    explanation: Founding gene-disease report, which also places the gene in the del(5q) interval.
animal_models:
- name: Hspa9 heterozygous knockout mouse
  species: Mouse
  genotype: Hspa9 heterozygous deletion
  publication: PMID:25550197
  description: >
    Heterozygotes are viable with half-normal Hspa9 expression, have normal basal
    haematopoiesis and do not develop myelodysplastic syndrome, but show a cell-intrinsic
    B-progenitor colony defect. Homozygotes die as embryos.
  modeled_mechanisms:
  - target: Reduced Mitochondrial HSPA9 Chaperone Dosage
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model establishes the dosage principle, that half-normal expression is tolerated
      and complete loss is not, which is the basis of the human two-allele mechanism.
    limitations: >-
      Half-normal expression produces no anemia and no ring sideroblasts in the mouse,
      while the human disease needs a dosage below that, so the model does not reproduce
      the erythroid phenotype. The reported defect is in B lymphopoiesis, which is not a
      feature of the human disease.
    evidence:
    - reference: PMID:25550197
      reference_title: "Reduced levels of Hspa9 attenuate Stat5 activation in mouse B cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hspa9(+/-) mice have normal basal hematopoiesis and do not develop MDS."
      explanation: Half-normal dosage is tolerated, which bounds where the human threshold must lie.
    - reference: PMID:25550197
      reference_title: "Reduced levels of Hspa9 attenuate Stat5 activation in mouse B cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "appropriate levels (≥50%) of Hspa9 are required for normal B lymphopoiesis in vivo"
      explanation: Pushing expression below half reveals a haematopoietic requirement, supporting the dosage model.
diagnosis:
- name: Bone marrow examination with iron staining
  description: >
    Ring sideroblasts on an iron-stained marrow aspirate establish a sideroblastic
    anemia; sequencing then assigns the gene. A single heterozygous HSPA9 variant is not
    sufficient for the diagnosis, since the disease needs a second, often common,
    low-expression allele in trans, so both alleles should be sought and phased.
  evidence:
  - reference: PMID:26491070
    reference_title: "Congenital sideroblastic anemia due to mutations in the mitochondrial HSP70 homologue HSPA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a fraction of patients with just 1 severe loss-of-function allele, expression of the clinical phenotype is associated with a common coding single nucleotide polymorphism in trans"
    explanation: Why a single heterozygous severe allele does not by itself explain the phenotype.

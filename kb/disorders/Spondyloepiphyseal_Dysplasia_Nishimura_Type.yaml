name: Spondyloepiphyseal Dysplasia, Nishimura Type
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- SEDN
- SED MIR140 type Nishimura
- spondyloepiphyseal dysplasia, MIR140 type
- MIR140-related skeletal dysplasia
description: >-
  Spondyloepiphyseal dysplasia, Nishimura type is an autosomal dominant skeletal dysplasia
  caused by a single heterozygous nucleotide substitution in MIR140, the gene encoding the
  chondrocyte-specific microRNA miR-140. It is the second miRNA-caused disease in this
  knowledge base, after DFNA50 (MIR96), and the first in which a mutant microRNA was shown
  to acquire a new function rather than merely lose its old one.

  MIR140 does not encode a protein. Its mature product miR-140-5p is expressed almost
  exclusively in chondrocytes and is transcribed from a chondrocyte-specific
  super-enhancer, so the gene is both cartilage-restricted and highly expressed there. The
  disease allele, NR_029681.1:n.24A>G, changes one nucleotide at the start of the miR-140-5p
  seed - the six-nucleotide stretch that selects which transcripts a microRNA silences. All
  three reported patients, in two unrelated families, carry that same substitution.

  What the seed change does is the point of the entry. It abandons the transcripts miR-140-5p
  normally represses, which rise; and it acquires transcripts complementary to the new seed,
  which are repressed for the first time. Both signatures are present in the same knock-in
  mouse chondrocyte transcriptome, and the paper's own summary is that the mutation "produces
  both loss-of-function and gain-of-function effects". Two independent results show that the
  acquired half is not incidental. A knock-in mouse carrying the human substitution has
  delayed secondary ossification, a widened basal skull growth plate and an expanded resting
  zone, none of which the miR-140-null mouse has; and heterozygous MIR140 deletions in humans
  are not associated with skeletal disease, so halving the wild-type dose is not what causes
  this disorder.

  The acquired targets are unusually potently repressed for a seed that has no evolutionary
  history with them, and the founding study offers a mechanism for that too: the new seed
  match, ACCACC, overlaps the binding motif of YBX1, an RNA-binding protein that stabilises
  transcripts. The mutant microRNA and YBX1 compete for the same 3-prime UTR sites, so
  binding by one displaces the stabilising effect of the other.

  Downstream, one acquired target has been followed further than the rest. HIF1A carries a
  conserved match to the mutant seed in its coding sequence; HIF1A protein falls, the hypoxia
  programme is blunted, lysyl oxidases fall and collagen cross-linking in cartilage decreases.
  A later preprint from the same group traces a second arm from the same node: glycolysis
  falls with a compensatory rise in mitochondrial metabolism, cytoplasmic acetyl-CoA and
  histone acetylation fall, and resting-zone chondrocytes proliferate and accumulate. That
  arm is curated as provisional, because its middle steps were established in Ldha and Acly
  conditional knockouts rather than in the miR-140 mutant itself.

  What reaches the clinic is disproportionate short-limb short stature with small hands and
  feet, severe brachydactyly with cone-shaped phalangeal epiphyses, delayed epiphyseal
  ossification of hip and knee, mild spondylar dysplasia and midface hypoplasia, evolving in
  adulthood into premature spondylosis and degenerative joint disease. Intelligence, hearing,
  vision and dentition are normal. There is no disease-modifying treatment and none has been
  proposed.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. Three affected individuals in two unrelated families have
    been reported, in a single 2019 paper, and no further patient has appeared in the
    literature since. The families were ascertained through a project specifically directed at
    ultra-rare congenital skeletal disorders, which is a selected denominator rather than a
    population one. prevalence_class is the qualitative ULTRA_RARE tier and no
    rate_per_100000 is given, because none has been reported and a numeric band beside this
    note would be an invention.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel skeletal dysplasia was identified in two unrelated families in a project for molecular diagnosis of ultra-rare congenital skeletal disorders"
    explanation: The number of families and the ascertainment route that found them.
  - reference: PMID:36711926
    reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We previously reported that a single nucleotide substitution of the MIR140 in humans caused ultra-rare skeletal dysplasia, spondyloepiphyseal dysplasia, Nishimura type"
    explanation: >-
      The same group calling the disorder ultra-rare four years later, which is the closest
      thing to a rarity statement that exists. Graded OTHER because it is a preprint's
      introduction restating its own earlier human genetics rather than reporting patients.
progression:
- phase: Childhood skeletal dysplasia
  notes: >-
    Disproportionate short stature, brachydactyly with cone-shaped epiphyses, delayed
    epiphyseal ossification and mild spondylar dysplasia are the childhood picture. In Family
    1 the airway symptoms - prolonged cough and inspiratory stridor - are also present in this
    phase. No age at onset, growth velocity or bone-age series is quotable: auxology data are
    in a supplementary table that the cached record does not carry.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The radiological hallmarks were mild spondylar dysplasia, delayed epiphyseal ossification of the hip and knee, and severe brachydactyly with cone shaped phalangeal epiphyses"
    explanation: The radiographic features that define the childhood phase.
- phase: Adult degenerative phase
  notes: >-
    The skeletal abnormalities do not remain static after growth ends. Spondylar dysplasia
    progresses to premature spondylosis and the epiphyseal abnormalities to degenerative joint
    disease. Bone density was normal for age in the proband at 43, so this is a structural and
    degenerative course rather than a bone-mass disorder. Survival to at least the mid-forties
    is documented, and there is no report of a lethal outcome.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spondylar and epiphyseal abnormalities evolved into premature spondylosis and degenerative joint disease in adulthood, respectively."
    explanation: The adult course, stated for the reported patients.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had normal bone density for the age, which suggests that the heterozygous MIR140 mutation in humans does not lead to bone mass abnormalities."
    explanation: >-
      The one quantitative adult measurement published, and the negative it establishes: this
      is not a bone-fragility disorder.
genetic:
- name: MIR140
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MIR140
    term:
      id: hgnc:31527
      label: MIR140
  notes: >-
    MIR140 is a microRNA gene, HGNC locus type "RNA, micro", at 16q22.1 within an intron of
    WWP2 and associated with a chondrocyte-specific super-enhancer. It has no protein product,
    so the vocabulary usually attached to a Mendelian gene - missense, nonsense, truncating,
    dominant negative, a PDB structure, a molecular function term for a gene product - does
    not apply. The unit of pathogenicity is one nucleotide of a 22-nucleotide mature RNA.

    Only one pathogenic allele is known, n.24A>G, and it is the same in both families. Unlike
    MIR96, where three alleles at three positions define two mechanistically distinct classes,
    there is no allelic series here to reason from.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the phenotype has not been reported previously and these patients were found to have the same variant in the MIR140 gene, we propose the eponym of spondyloepiphyseal dysplasia (SED) MIR140 type Nishimura."
    explanation: >-
      The gene-disease relationship as established, and the origin of the disorder's name.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening P1, P2, and P3 for possible disease causing variants in 378 known skeletal dysplasia genes using WGS data, and screening P2 for gene dose abnormalities of the above mentioned skeletal dysplasia genes using custom-designed comparative genome hybridization analysis was all negative"
    explanation: >-
      The exclusion work behind the gene assignment: 378 known skeletal dysplasia genes and a
      dosage screen, all negative, before MIR140 was implicated.
diagnosis:
- name: MIR140 sequencing in an unexplained spondyloepiphyseal dysplasia with brachydactyly
  description: >-
    The route to this diagnosis is radiographic recognition followed by sequencing that
    actually covers MIR140. The practical trap is structural: MIR140 is a short non-coding
    gene, so an exome pipeline built around coding exons will not find the variant. In both
    families exome sequencing was performed first and returned nothing in the protein-coding
    genes; whole genome sequencing, searching non-coding as well as coding genes, found the
    substitution. A panel of 378 known skeletal dysplasia genes and a dosage array were also
    negative. Once the entity was recognised in the second family, Sanger sequencing of MIR140
    was sufficient.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No potential disease causing variants were found in the protein coding genes."
    explanation: >-
      The exome result in both families, and the reason a coding-only analysis will miss this
      diagnosis.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing (WGS) identified the same heterozygous nucleotide substitution (chr16:g.69967007A>G (hg19), MIR140:NR_029681.1:n.24A>G) in P1 and P2"
    explanation: The test that made the diagnosis, and the variant nomenclature to report.
differential_diagnoses:
- name: Acrodysostosis
  description: >-
    The differential the authors single out. Both disorders combine midface hypoplasia with
    brachydactyly and cone-shaped epiphyses, so the hands and face look similar. Two things
    separate them. Epiphyseal maturation is delayed in SED Nishimura type and advanced,
    particularly in the carpus, in acrodysostosis - the ossification clock runs the opposite
    way. And epiphyseal dysplasia, which is a hallmark here, is not a feature of
    acrodysostosis. The reported patients also had none of the endocrine abnormalities of
    acrodysostosis and no PDE4D or PRKAR1A variant.
  distinguishing_features:
  - Delayed rather than advanced epiphyseal and carpal ossification
  - Epiphyseal dysplasia, which acrodysostosis does not have
  - No hypocalcaemia, hyperphosphataemia, raised PTH or TSH, or low IGF-1
  - No PDE4D or PRKAR1A variant
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present disorder should be differentiated from acrodysostosis."
    explanation: The authors naming the differential.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, epiphyseal maturation is delayed in SED MIR140 type Nishimura, whereas epiphyseal ossification, particularly carpal ossification, is advanced in acrodysostosis."
    explanation: The single most useful discriminator, and the direction it runs in.
animal_models:
- name: Mir140 n.24A>G knock-in mouse
  species: Mouse
  genotype: Mir140 A>G knock-in (the human n.24A>G substitution), heterozygous and homozygous
  background: C57BL/6, two independent CRISPR-Cas9 founder lines
  publication: PMID:30804514
  genes:
  - preferred_term: MIR140
    term:
      id: hgnc:31527
      label: MIR140
  description: >-
    The model that carries the argument. CRISPR-Cas9 was used to introduce the patients' exact
    substitution into the mouse genome, and two independent founder lines gave the same
    phenotype. Heterozygotes, the genotype a patient has, show delayed secondary ossification,
    a widened basal skull growth plate, an expanded resting zone and mildly flattened
    vertebral bodies; homozygotes are more severely affected. The whole force of the model is
    the side-by-side comparison with miR-140-null mice, which do not have these features.
  modeled_mechanisms:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The chondrocyte transcriptome of this line is where the acquired target set was
      demonstrated, and where it was shown to be absent from the null.
    limitations: >-
      The acquired target set is defined in mouse chondrocytes and predicted by TargetScan; no
      human chondrocyte or patient cartilage has been profiled, so the specific transcripts
      repressed in a patient are inferred from orthology rather than measured. Repression of
      the acquired set was strongest for 8mer sites, so the reported effect is weighted
      towards the best-predicted subset.
    readouts:
    - name: Expression of predicted mutant-seed target genes
      target: Repression of Novel Targets Acquired by the Mutant Seed
      direction: DECREASED
      interpretation: >-
        Transcripts carrying a match to the mutant seed fall, and do so only in genotypes
        carrying the substitution.
      evidence:
      - reference: PMID:30804514
        reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Importantly, the widespread suppression of predicted miR-140-5p-G targets is only observed in miR-140G/G and miR-140G/+ chondrocytes"
        explanation: The measurement and the genotype restriction that makes it informative.
    evidence:
    - reference: PMID:30804514
      reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In chondrocytes, the mutation causes widespread derepression of wild-type miR-140-5p targets and repression of mutant miR-140-5p targets, indicating that the mutation produces both loss-of-function and gain-of-function effects."
      explanation: >-
        Establishes that this model is the system in which both arms of the mechanism were
        shown, which is what makes it informative for this node.
  - target: Delayed Endochondral Ossification of Epiphyses and Tubular Bones
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Heterozygous knock-in mice have delayed secondary ossification of tubular and carpal
      bones and severely reduced epiphyseal mineralization, which the authors map directly onto
      the patients' delayed secondary ossification and small epiphyses.
    limitations: >-
      The correspondence between mouse and human is asserted by inspection of radiographs and
      histology rather than by a quantified morphometric comparison. Homozygous mice, in which
      the lesion is most severe, have no human counterpart - no homozygous patient has been
      reported. The mouse work was done on a single background, C57BL/6, and the timing of the
      mouse lesion is postnatal weeks against a human course measured in years.
    readouts:
    - name: Secondary ossification of tubular and carpal bones
      target: Delayed Endochondral Ossification of Epiphyses and Tubular Bones
      direction: DECREASED
      interpretation: >-
        Ossification centres appear late, in heterozygotes as well as homozygotes, and not in
        null mice.
      evidence:
      - reference: PMID:30804514
        reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "only miR-140G/G and miR-140G/+ mice showed delayed secondary ossification of tubular and carpal bones"
        explanation: The readout and the genotypes in which it is seen.
    - name: Epiphyseal mineralization by micro-computed tomography
      target: Delayed Endochondral Ossification of Epiphyses and Tubular Bones
      direction: DECREASED
      interpretation: Mineral content of the epiphysis is severely reduced in homozygotes.
      evidence:
      - reference: PMID:30804514
        reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Micro-CT analysis showed severely decreased epiphyseal mineralization in miR-140G/G mice"
        explanation: The quantitative imaging readout.
    evidence:
    - reference: PMID:30804514
      reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These bone abnormalities of miR-140G/G and miR-140G/+ mice are consistent at all analyzed ages from P7 to P56 when compared to wild-type mice"
      explanation: >-
        The mouse side of the model-to-patient correspondence: the lesion is stable across
        every age examined rather than a transient developmental lag.
    - reference: PMID:30804514
      reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "highly consistent with the skeletal dysplasia features of the patients, presenting with delayed secondary ossification, mild platyspondyly, small epiphyses, and scaphocephaly"
      explanation: >-
        The human side of the same sentence, and what makes this model informative for the
        node: the patient features the mouse lesion is said to correspond to. Graded
        HUMAN_CLINICAL because the clause reports the authors' own patients.
  - target: Resting-Zone Chondrocyte Expansion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The proximal tibial growth plate and the basal skull growth plate are both expanded, and
      the expansion is in the resting zone. This is the lesion the later metabolic work was
      built to explain.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because no human growth plate has ever been
      examined in this disease: the resting-zone lesion is a mouse finding whose human
      counterpart is inferred from the radiographic delay in ossification. The follow-up work
      also had to build an enhanced-expression line, with additional nucleotide changes that
      no patient carries, to make the phenotype robust in heterozygotes.
    readouts:
    - name: Resting zone width of the proximal tibial growth plate
      target: Resting-Zone Chondrocyte Expansion
      direction: INCREASED
      interpretation: The resting zone is expanded in heterozygotes and homozygotes.
      evidence:
      - reference: PMID:30804514
        reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The proximal tibial growth plate also showed an expansion of the resting zone in miR-140G/G and miR-140G/+ mice"
        explanation: The readout and its direction.
    evidence:
    - reference: PMID:36711926
      reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the mouse model carrying the identical substitution as in patients, the resting zone of the growth plate was expanded, causing a delay in ossification and development of the epiphysis."
      explanation: >-
        The later paper stating what this model established and why the resting-zone lesion is
        taken to explain the ossification delay.
- name: miR-140-null mouse
  species: Mouse
  genotype: Mir140 targeted deletion, heterozygous and homozygous
  publication: PMID:21576357
  genes:
  - preferred_term: MIR140
    term:
      id: hgnc:31527
      label: MIR140
  description: >-
    Not a model of this disease but the control that defines it. Deleting the microRNA gives
    dwarfism and craniofacial deformity with mildly accelerated hypertrophic differentiation -
    a phenotype that overlaps the knock-in in stature and face but is opposite in the growth
    plate, where maturation is advanced rather than delayed. Null mice also develop
    age-related osteoarthritis-like change. Heterozygous nulls are normal.
  modeled_mechanisms:
  - target: Loss of Repression of Wild-Type miR-140-5p Targets
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A deletion reproduces the abandoned half of the mechanism exactly, since removing the
      microRNA is the cleanest possible way to de-repress its normal targets. It is the
      reference against which the knock-in transcriptome was read.
    limitations: >-
      It reproduces only that half. A null allele cannot acquire targets, so nothing measured
      in this line speaks to the neomorphic arm, and features shared between null and knock-in
      cannot be attributed to either arm on the strength of this model alone.
    readouts:
    - name: Expression of conserved wild-type miR-140-5p 8mer target genes
      target: Loss of Repression of Wild-Type miR-140-5p Targets
      direction: INCREASED
      interpretation: >-
        Normal targets rise in the deletion just as they do in the knock-in, which is what
        makes this arm the shared one.
      evidence:
      - reference: PMID:30804514
        reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Both the miR-140 A>G mutation and miR-140 deletion caused derepression of conserved 8mer target genes for wild-type miR-140-5p and to a lesser extent for miR-140-3p species"
        explanation: The direct comparison of the two genotypes on the same target set.
    evidence:
    - reference: PMID:21576357
      reference_title: "Chondrocyte-specific microRNA-140 regulates endochondral bone development and targets Dnpep to modulate bone morphogenetic protein signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this paper, we show that loss of Mir140 in mice causes growth defects of endochondral bones, resulting in dwarfism and craniofacial deformities."
      explanation: >-
        Establishes what losing the microRNA does on its own, which is the baseline the
        knock-in is compared against.
  - target: Delayed Endochondral Ossification of Epiphyses and Tubular Bones
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The null mouse does not reproduce the disease's defining skeletal lesion. It does not
      have the delayed secondary ossification, and its growth plate runs the other way:
      endochondral bone development is mildly advanced, with accelerated hypertrophic
      differentiation. This negative is the load-bearing result of the entry - it is why the
      substitution is read as neomorphic rather than as a loss of function.
    limitations: >-
      The failure is specific and not total: the null does reproduce the short stature and
      craniofacial abnormality, so it is informative for those features and for the abandoned
      target set. The comparison also has a confound worth stating - the null was made by
      targeted deletion in an earlier study and the knock-in by CRISPR-Cas9 in this one, so
      the two lines differ in provenance as well as in allele, and the phenotypes were scored
      across studies as well as within one.
    readouts:
    - name: Timing of hypertrophic chondrocyte differentiation
      target: Delayed Endochondral Ossification of Epiphyses and Tubular Bones
      direction: INCREASED
      interpretation: >-
        Terminal differentiation is mildly advanced in the null, the opposite direction to the
        delay seen in the knock-in and in patients.
      evidence:
      - reference: PMID:21576357
        reference_title: "Chondrocyte-specific microRNA-140 regulates endochondral bone development and targets Dnpep to modulate bone morphogenetic protein signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Endochondral bone development is mildly advanced due to accelerated hypertrophic differentiation of chondrocytes in Mir140-null mice."
        explanation: The direction of the null's growth plate phenotype, in the null paper's own words.
    evidence:
    - reference: PMID:30804514
      reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these differences in phenotype between miR-140G/G and miR-140−/− mice, and delayed epiphyseal maturation in humans, indicate that this single-base substitution causes a neomorphic, and not just loss-of-function, effect."
      explanation: >-
        The inference the failure supports, stated by the authors: a null and this allele are
        not the same lesion.

- name: Reduced Lysyl Oxidase Expression and Collagen Cross-Linking
  biological_scale: MOLECULAR
  description: >-
    Lysyl oxidases are HIF1A-regulated and are the enzymes that cross-link collagen. Their
    transcripts fall in knock-in chondrocytes and mass spectrometry of rib cartilage from the
    same mice shows the cross-links themselves reduced. LOXL3 is separately one of the
    acquired targets of the mutant seed, so this node is reached both directly and through

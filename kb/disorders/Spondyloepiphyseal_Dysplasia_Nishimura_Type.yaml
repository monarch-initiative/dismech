    snippet: "The miR-140-5p-G targets include many genes important for skeletal development and homeostasis, including Loxl3, Btg1, and Trps1, and genes associated with various metabolic pathways"
    explanation: >-
      Names the acquired targets and states why they matter here: they are cartilage genes,
      which is what makes an evolutionarily naive seed pathogenic in this tissue.
  downstream:
  - target: Suppression of YBX1-Dependent Transcript Stabilization
  - target: Repression of HIF1A and Blunted Chondrocyte Hypoxia Response
  - target: Dysregulation of the Chondrocyte Maturation Programme
- name: Suppression of YBX1-Dependent Transcript Stabilization
  biological_scale: MOLECULAR
  description: >-
    The explanation the founding study offers for why a seed with no evolutionary history with
    its targets nonetheless represses them hard. The hexamer complementary to the mutant seed,
    ACCACC, is one of the motifs bound by YBX1, an RNA-binding protein that stabilises
    transcripts, so the mutant microRNA in the Ago2 complex and YBX1 compete for the same
    3-prime UTR sites. Ago2 and Ybx1 seCLIP in knock-in chondrocytes show both sides of that
    competition, acquired targets that also carry YBX1 binding are repressed more strongly
    than those that do not, and previously reported YBX1-stabilised transcripts fall
    preferentially in mutant rather than null chondrocytes.
  genes:
  - preferred_term: YBX1
    term:
      id: hgnc:8014
      label: YBX1
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  mechanism_confidence: PROVISIONAL
  notes: >-
    Confidence is PROVISIONAL rather than ESTABLISHED because the competition is inferred from
    motif overlap plus crosslinking and reporter experiments in mouse chondrocytes and HEK293T
    cells, and the authors themselves phrase the conclusion as a partial attribution. No
    experiment has removed YBX1 from a knock-in animal, and nothing has been measured in human
    cartilage.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational analysis suggested that the miR-140-5p-G seed in the Ago2 complex and the RBP, Ybx1 (also known as YB-1), potentially compete for the same RNA binding sites"
    explanation: >-
      The hypothesis and its origin. Graded COMPUTATIONAL because this sentence reports a
      motif-overlap prediction; the experimental tests are quoted separately.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Importantly, miR-140-5p-G Ago2 seCLIP target genes with Ybx1 binding in the 3′ UTR showed stronger repression in mutant chondrocytes than those without Ybx1 binding"
    explanation: >-
      The measurement that converts the motif overlap into a functional claim: YBX1 occupancy
      predicts how hard the acquired target is repressed.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These observations collectively suggest that the potent suppressive effect of miR-140-5p-G is partly attributable to the competition against Ybx1, especially in 3′ UTRs, and subsequent suppression of Ybx1 activity."
    explanation: >-
      The authors' own weighting, and the reason this node is PROVISIONAL: they claim a
      partial attribution, not the whole effect.
  downstream:

  downstream:
  - target: Reduced Acetyl-CoA Availability and Histone Acetylation
- name: Reduced Acetyl-CoA Availability and Histone Acetylation
  biological_scale: MOLECULAR
  description: >-
    Less glycolytic flux means less mitochondria-derived citrate and so less cytoplasmic
    acetyl-CoA, the acetyl donor for histone acetylation. Histone acetylation is reduced both
    in the miR-140 mutant and in Ldha-deficient chondrocytes. Deleting Acly, which converts
    citrate to acetyl-CoA, reproduces the growth plate phenotype without producing an energy
    deficit, which is the experiment that separates the acetyl-CoA explanation from a simple
    ATP shortage.

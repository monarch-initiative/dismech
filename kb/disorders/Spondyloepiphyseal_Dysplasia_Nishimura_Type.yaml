- name: Repression of HIF1A and Blunted Chondrocyte Hypoxia Response
  biological_scale: MOLECULAR
  description: >-
    The best-followed of the acquired targets. The coding region of Hif1a carries a conserved
    match to the mutant seed, Hif1a protein falls in knock-in chondrocytes, and gene set
    enrichment shows the hypoxia programme impaired in the knock-in but not in the null - so
    this is an acquired-target effect and not a consequence of losing the microRNA. The growth
    plate is avascular and hypoxic, which is why a transcription factor for hypoxic adaptation
    is load-bearing in this tissue.
  genes:

  downstream:
  - target: Abundant Production of the Mutant miR-140-5p
  - target: Loss of Repression of Wild-Type miR-140-5p Targets
  - target: Repression of Novel Targets Acquired by the Mutant Seed
- name: Abundant Production of the Mutant miR-140-5p
  biological_scale: MOLECULAR
  description: >-
    The mutant strand is made in quantity. Small RNA sequencing of knock-in mouse chondrocytes
    finds slightly more mutant miR-140-5p than wild-type miR-140-5p, with only minor shifts in
    Dicer processing and strand choice, so the substitution does not act by crippling
    biogenesis. Because MIR140 sits in a chondrocyte-specific super-enhancer, the mutant
    product is delivered at high level precisely in the cells the disease affects. This is the
    node that separates the lesion from the MIR96 Italian allele, which is a processing defect
    and reduces mature microRNA yield without changing what it targets.
  genes:
  - preferred_term: MIR140
    term:
      id: hgnc:31527
      label: MIR140
  notes: >-
    No biological_processes descriptor is attached. The claim this node makes is that microRNA
    processing is unaffected, and ModifierEnum has no value for "unchanged" - INCREASED,
    DECREASED, ABNORMAL and DYSREGULATED would each assert a change that the cited measurement
    specifically did not find. The negative is the point, so it is carried by the description
    and the evidence rather than by a modifier.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Small RNA sequencing analysis in mouse chondrocytes revealed that the miR-140 A>G mutation yields slightly greater amounts of the mutant miR-140-5p (miR-140-5p-G) than wild-type miR-140-5p, while decreasing two miR-140-3p species (3p.1 and 3p.2)"
    explanation: >-
      The quantitative measurement behind the node, including the incidental fall in the two
      3p species. Indirect because it is primary mouse chondrocytes rather than human
      cartilage.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These data indicate that the A>G mutation did not compromise miRNA processing and yielded abundant expression of miR-140-5p-G from primary miR-140 transcripts of which transcription is strongly activated by a super-enhancer in chondrocytes."
    explanation: >-
      The authors' own reading: processing is intact and the super-enhancer supplies the
      mutant product at high level in chondrocytes.
  downstream:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
- name: Loss of Repression of Wild-Type miR-140-5p Targets
  biological_scale: MOLECULAR
  description: >-
    Transcripts carrying a wild-type miR-140-5p site are no longer repressed and rise. This
    half of the mechanism is shared with a plain deletion of the microRNA: conserved 8mer
    targets of wild-type miR-140-5p are de-repressed both in the knock-in and in the null. The
    reading is quantitative - silencing of this particular target set falls - which is why the
    modifier is DECREASED.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing of the wild-type miR-140-5p target set
    modifier: DECREASED
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Both the miR-140 A>G mutation and miR-140 deletion caused derepression of conserved 8mer target genes for wild-type miR-140-5p and to a lesser extent for miR-140-3p species"
    explanation: >-
      The de-repression itself, and the comparison that makes it the shared half of the
      mechanism: the deletion does the same thing.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In chondrocytes, the mutation causes widespread derepression of wild-type miR-140-5p targets and repression of mutant miR-140-5p targets, indicating that the mutation produces both loss-of-function and gain-of-function effects."
    explanation: >-
      The authors' summary of the two arms. It is the sentence that justifies splitting the
      target repertoire into two nodes instead of one dysregulation node.
  downstream:
  - target: Dysregulation of the Chondrocyte Maturation Programme
- name: Repression of Novel Targets Acquired by the Mutant Seed
  biological_scale: MOLECULAR
  description: >-
    The mutant seed is complementary to a different heptamer, so transcripts carrying that
    match - which wild-type miR-140-5p ignored - are repressed for the first time. The
    signature is specific to the substitution: widespread suppression of predicted mutant-seed
    targets is seen in knock-in chondrocytes and not in the null. The acquired set includes
    genes central to cartilage, among them Loxl3, Btg1 and Trps1, and Hif1a through a
    conserved match in its coding sequence.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing of transcripts complementary to the mutant seed
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  genes:
  - preferred_term: LOXL3
    term:
      id: hgnc:13869
      label: LOXL3
  - preferred_term: BTG1
    term:
      id: hgnc:1130
      label: BTG1
  - preferred_term: TRPS1
    term:
      id: hgnc:12340
      label: TRPS1
  - preferred_term: HIF1A
    term:
      id: hgnc:4910
      label: HIF1A
  notes: >-
    modifier is deliberately left absent on this descriptor, for the same reason it is left
    absent on the corresponding node of the MIR96 entry. What changed is the specificity of
    the silencing, not its level. INCREASED and DECREASED are the PATO-bound quantitative pair
    and would assert that an existing activity moved, which is not the claim - these
    transcripts had no miR-140-mediated silencing to increase. GAIN_OF_FUNCTION in ModifierEnum
    describes a process driven outside its normal regulatory constraints, which is activation
    of the same process rather than its redirection onto a different substrate set.
    DYSREGULATED still reads as a statement about level. The genes listed are the acquired
    targets named in the source; they are bound to human HGNC identifiers, but the
    measurements are in mouse chondrocytes.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Importantly, the widespread suppression of predicted miR-140-5p-G targets is only observed in miR-140G/G and miR-140G/+ chondrocytes"
    explanation: >-
      The result that isolates the acquired arm: only genotypes carrying the substitution show
      it, so a null allele cannot reproduce it.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO

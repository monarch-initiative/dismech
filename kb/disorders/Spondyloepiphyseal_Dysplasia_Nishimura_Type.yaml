inheritance:
- name: Autosomal dominant
  description: >-
    Three affected individuals in two unrelated families all carry the same heterozygous
    MIR140 substitution. It arose de novo in the two probands and was transmitted from an
    affected mother to her affected son. Dominance here is not haploinsufficiency: a
    heterozygous MIR140 deletion has not been associated with skeletal disease in humans and
    heterozygous miR-140 knockout mice are normal, so it is the presence of the mutant
    microRNA product, not the absence of half the wild-type dose, that produces the
    phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same single nucleotide substitution occurred de novo in P1 and P3, and co-segregated with the skeletal dysplasia phenotype in Family 1"
    explanation: >-
      Both halves of the dominant argument in one sentence: two independent de novo events on
      the same nucleotide, and vertical segregation in the family that has two affected
      members.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This result suggests that haploinsufficiency of MIR140 does not lead to skeletal abnormalities in humans, consistent with the normal phenotype previously reported in heterozygous miR-140 knockout mice6, supporting the hypothesis that the heterozygous nucleotide substitution (chr16:g.69967007A>G (hg19), MIR140:NR_029681.1:n.24A>G) is a neomorphic mutation."
    explanation: >-
      The CNV-database search that rules out simple haploinsufficiency as the basis of the
      dominance, and the mouse result that agrees with it.
pathophysiology:
- name: MIR140 Seed-Region Point Mutation
  biological_scale: MOLECULAR
  description: >-
    A single-nucleotide substitution, NR_029681.1:n.24A>G (chr16:g.69967007A>G, hg19), at the
    first nucleotide of the seed of mature miR-140-5p. The seed is what selects a microRNA's
    target set, so a substitution there changes which transcripts miR-140-5p recognises. The
    same substitution is present in all three reported patients from two unrelated families,
    is absent from gnomAD, and the affected nucleotide is conserved from human to Australian
    ghostshark.
  genes:
  - preferred_term: MIR140
    term:
      id: hgnc:31527
      label: MIR140
  genetic_context:
    genes:
    - preferred_term: MIR140
      term:
        id: hgnc:31527
        label: MIR140
    allele_type: single-nucleotide substitution at the first seed nucleotide of the mature miR-140-5p strand
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: NEOMORPHIC
    description: >-
      Carriers are heterozygous. The variant arose de novo in the probands of both families
      and was transmitted once, mother to son.
    notes: >-
      On the choice of NEOMORPHIC, and how it differs from the sibling miRNA entry. The other
      microRNA disease in this knowledge base, Autosomal_Dominant_Nonsyndromic_Hearing_Loss_50
      (MIR96), deliberately leaves functional_impact_category absent, on the ground that a
      seed mutation is simultaneously hypomorphic for the wild-type target set and neomorphic
      for an acquired one and that no single-valued category says both. The biology is the
      same here. The reason the value is set anyway is that the mouse genetics assigns the
      disease-defining features to the acquired half in a way the MIR96 work does not. The
      miR-140-null mouse is not phenotypically silent - it is smaller with a shorter nose -
      but it does not have the delayed secondary ossification, the widened basal skull growth
      plate or the expanded resting zone that the knock-in mouse and the patients have, and
      the founding authors state in those words that the substitution is "neomorphic, and not
      just loss-of-function". NEOMORPHIC in Muller's sense names an allele with a new
      activity and does not deny that the old one is also impaired; the impaired half is
      curated as its own node, "Loss of Repression of Wild-Type miR-140-5p Targets", with its
      own evidence. What the single value cannot record is that the shared short stature and
      craniofacial features track the abandoned half while the epiphyseal features track the
      acquired one, and that is stated here rather than left to be inferred.

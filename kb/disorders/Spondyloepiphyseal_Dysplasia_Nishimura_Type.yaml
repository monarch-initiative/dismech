- name: Reduced Chondrocyte Glycolysis with Compensatory Mitochondrial Metabolism
  biological_scale: CELLULAR
  description: >-
    HIF1A stimulates glycolysis and restrains mitochondrial metabolism, so its repression
    reverses both. In knock-in chondrocytes glycolytic genes fall while mitochondrial genes
    rise in a dose-dependent way, and Seahorse measurement of extracellular acidification and
    oxygen consumption confirms the reciprocal shift.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  mechanism_confidence: PROVISIONAL
  notes: >-
    This node and the two below it come from a bioRxiv preprint that has not, as of curation,
    appeared in a peer-reviewed journal. The measurements quoted here were made in the miR-140
    mutant itself; the steps below it were established largely in Ldha and Acly conditional
    knockouts used as surrogates, which is recorded on those nodes.
  evidence:
  - reference: PMID:36711926
    reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT

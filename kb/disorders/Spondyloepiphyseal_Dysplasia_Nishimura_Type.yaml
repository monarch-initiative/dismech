    explanation: >-
      Places the substitution in the seed, which is what makes the lesion a change of target
      specificity rather than a change of dose.
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a neomorphic seed region mutation in the chondrocyte-specific, super-enhancer-associated MIR140 gene encoding microRNA-140 (miR-140) in a novel autosomal dominant human skeletal dysplasia."
    explanation: >-

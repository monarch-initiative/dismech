- name: Premature Degeneration of Spine and Joints
  biological_scale: ORGANISM
  description: >-
    The adult phase. The spondylar and epiphyseal abnormalities of childhood do not stabilise:
    they progress to premature spondylosis and degenerative joint disease. Reduced collagen
    cross-linking in cartilage is a plausible contributor, and independently miR-140-null mice
    develop age-related osteoarthritis-like change, but no joint tissue from a patient has been
    examined and the molecular bridge is not established.
  mechanism_confidence: PROVISIONAL
  notes: >-
    The clinical outcome is reported; the mechanism connecting it to the upstream nodes is
    not. The cross-linking deficit and the null mouse osteoarthritis are both suggestive and
    neither was measured in this disease, which is what PROVISIONAL records here.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spondylar and epiphyseal abnormalities evolved into premature spondylosis and degenerative joint disease in adulthood, respectively."
    explanation: The observed adult course in the reported patients.
  - reference: PMID:20466812
    reference_title: "MicroRNA-140 plays dual roles in both cartilage development and homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Interestingly, miR-140(-/-) mice showed age-related OA-like changes characterized by proteoglycan loss and fibrillation of articular cartilage."
    explanation: >-
      Establishes that miR-140 has a joint-maintenance role independent of development.
      Indirect for this node because the genotype is a null, not the seed substitution, so it
      shows that the pathway matters for joints without showing that this allele acts through
      it.
  downstream:
  - target: Premature Osteoarthritis

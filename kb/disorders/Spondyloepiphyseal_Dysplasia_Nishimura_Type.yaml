discussions:
- discussion_id: sedn_no_human_tissue
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Repression of Novel Targets Acquired by the Mutant Seed"
  - "pathophysiology#Resting-Zone Chondrocyte Expansion"
  prompt: >-
    Does the mutant seed repress the same transcripts in a human chondrocyte that it represses
    in a mouse one, and does a patient growth plate have the expanded resting zone?
  rationale: >-
    Every mechanistic measurement in this entry was made in mouse cells or mouse bone. That is
    not a criticism of the work - the knock-in carries the patients' exact substitution and
    the mature miR-140-5p sequence is conserved - but it leaves two specific things unmeasured
    in humans, and they are not the same kind of gap.

    The acquired target set is the first. It was predicted by TargetScan and confirmed against
    the mouse transcriptome. Because the seed is newly created, its targets have no
    evolutionary history with it, so there is no reason to expect the 3-prime UTR matches to
    be conserved between mouse and human the way the wild-type target set is - the founding
    study itself reports that mutant-seed target sites are less conserved than wild-type ones.
    A human chondrocyte could therefore carry a materially different acquired target set from
    the mouse. Nothing about that has been tested.

    The resting-zone expansion is the second, and it is a gap of a different kind: no human
    growth plate from a patient has been examined at all. The human evidence is radiographic
    delay in ossification, which is compatible with the mouse lesion but does not demonstrate
    it. Since the resting-zone phenotype is what the entire metabolic branch was built to
    explain, its human status matters more than its position in the entry suggests.

    Neither gap can be closed with the existing patients without cartilage, which is not
    ordinarily biopsied. Patient-derived induced pluripotent stem cells differentiated to
    chondrocytes would answer the first question and are within reach; the second may not be
    answerable at all outside an incidental surgical specimen.
  evidence:
  - reference: PMID:30804514
    reference_title: "Gain-of-function mutation of microRNA-140 in human skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Target sites of miR-140-5p-G seldom overlapped with those of wild-type miR-140 species (wild-type 5p, 3p.1, and 3p.2) and were less conserved than those of wild-type miR-140 species"
    explanation: >-
      The specific reason the mouse acquired target set may not transfer: those sites are the
      less conserved ones, so cross-species inference is weaker here than for the wild-type
      set.
- discussion_id: sedn_metabolic_branch_is_provisional
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Reduced Acetyl-CoA Availability and Histone Acetylation"
  - "pathophysiology#Resting-Zone Chondrocyte Expansion"
  prompt: >-
    Does reduced acetyl-CoA in miR-140 mutant chondrocytes cause the resting-zone expansion,
    and does it do so by raising FGFR3?
  rationale: >-
    The metabolic branch of this entry is attractive and incompletely demonstrated, and it is
    worth being exact about which links are which.

    Measured in the miR-140 mutant itself: HIF1A falls, glycolytic gene expression falls,
    mitochondrial gene expression rises, the Seahorse assay confirms the reciprocal shift, and
    histone acetylation falls. Measured in surrogates: that suppressing glycolysis by deleting
    Ldha, or blocking acetyl-CoA synthesis by deleting Acly, expands the resting zone and
    increases resting chondrocyte proliferation. The Acly result is the good control, because
    it separates acetyl-CoA from ATP supply, which a glycolysis block alone would not.

    What has not been done is the experiment in the middle: nobody has restored acetyl-CoA in a
    miR-140 mutant and asked whether the resting zone normalises. Until that is done, the
    identity of the mechanism in the mutant with the mechanism in the knockouts is an
    inference from phenotypic similarity.

    The onward step to FGFR3 is weaker again and is deliberately not curated as a causal edge.
    Fgfr3 is upregulated in both knockouts and a constitutively active FGFR3 expands the
    resting zone, which makes it a good candidate, but the authors write that the mechanism by
    which acetyl-CoA deficiency would raise Fgfr3 is not clear, and no chromatin measurement at
    the Fgfr3 locus has been reported. A causal edge here would assert more than the source
    does. It is also worth noting the irony that would follow if it held: an FGFR3 gain of
    signalling is the mechanism of achondroplasia, reached in this disease by an entirely
    different route.

    A further caveat applies to the whole branch. Its source is a bioRxiv preprint that had not
    appeared in a peer-reviewed journal as of curation, and it has not been independently
    replicated.
  evidence:
  - reference: PMID:36711926
    reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the mechanism by which Ac-CoA deficiency can lead to the Fgfr3 upregulation and these phenotypic changes is not clear at the moment."
    explanation: >-
      The authors declining to claim the step this entry declines to curate. It is why the
      FGFR3 arm is a discussion rather than an edge.
  - reference: PMID:36711926
    reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate the association between reduced glycolysis and an expansion of the resting zone and suggest that it is caused by acetyl-CoA deficiency, but not energy deficiency, possibly through epigenetic upregulation of FGFR3 signaling."
    explanation: >-
      The strength of claim the paper itself makes, with its two hedges - "suggest" and
      "possibly" - which the curation follows.
  proposed_experiments:
  - experiment_id: exp_sedn_acetyl_coa_rescue
    name: Restore acetyl-CoA in miR-140 knock-in chondrocytes and rescore the growth plate
    description: >-
      Supply acetate or citrate, or overexpress Acly, in Mir140 knock-in mice or their primary
      chondrocytes and measure histone acetylation, Fgfr3 expression, resting-zone width and
      resting chondrocyte proliferation against untreated mutants. A rescue would convert the
      acetyl-CoA account of this disease from a phenotypic parallel between three mouse lines
      into a demonstrated mechanism.
- discussion_id: sedn_no_treatment
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there any treatment to curate for this disorder?
  rationale: >-
    No, and this entry deliberately has no treatments block. No disease-modifying therapy
    exists, none has been proposed in the literature, and no clinical trial keyed to MIR140 or
    to this disorder was found. Nor has any intervention been tested in the mouse models: the
    knock-in line has been used for mechanism and never as a therapeutic testbed, which is a
    difference from the MIR96 entry, where preclinical gene editing and a repurposed drug are
    curated as rescue links on a mouse model.

    General management of a skeletal dysplasia - orthopaedic and spinal surveillance, pain and
    joint management, physiotherapy, airway assessment where there is stridor, genetic
    counselling - is what these patients will receive in practice, and none of it is reported
    for these three individuals. Importing it would attribute to them an experience recorded
    only of other people with other skeletal dysplasias, and in the exported graph a borrowed
    management statement is indistinguishable from an observed one.

    Closing this gap needs no new science, only a follow-up report on the patients already
    identified.
notes: >-
  Scope decision: curated as a DISEASE. One gene, one recurrent allele, one conserved
  pathograph running from a MIR140 seed substitution to a spondyloepiphyseal dysplasia, and no
  member diseases to unite - so neither a grouping nor a subtype of anything curated here. Its
  MONDO parent, MONDO:0016761 spondyloepiphyseal dysplasia, is an ontology grouping of dozens
  of unrelated SED loci and is not a dismech entry. The stub is deleted by this change, which
  is how a DISEASE decision is recorded.

  On the relationship to the MIR96 entry. Autosomal_Dominant_Nonsyndromic_Hearing_Loss_50 is
  the knowledge base's other microRNA disease and settled several modelling questions this
  entry inherits. Two are followed and one is not. Followed: the miRNA GeneDescriptor needs no
  special shape, since GeneTerm carries no reachable_from constraint; and modifier is left
  absent on the acquired-target node, because what changed is the specificity of the silencing
  and not its level. Not followed: functional_impact_category is set to NEOMORPHIC here rather
  than left absent, and the reason is set out in full on the genetic_context of the first
  pathophysiology node. In short, the MIR140 mouse comparison assigns the disease-defining
  features to the acquired arm in a way the MIR96 work does not, and the founding authors use
  the word "neomorphic" of this allele in a sentence quoted in the entry. The two entries
  should be read as disagreeing deliberately rather than inconsistently.

  What is deliberately not curated. There is no treatments block; the reasoning is in the
  discussion sedn_no_treatment. There is no biochemical, histopathology, imaging or
  clinical_trials content, because no human material or trial of that kind exists for these
  three patients. There is no environmental block: this is a de novo germline substitution and
  no exposure has been proposed. Detailed auxology - birth and follow-up z-scores, age at
  onset, growth velocity - is in Supplementary Table 1 of the founding paper, which the
  reference cache does not carry, so no numeric growth data is quoted rather than taken
  second-hand.

  On the ISDS nosology. Every other skeletal dysplasia entry in this knowledge base carries an
  isds_skeletal_category classification with a "listed as" note naming the nosology table row.
  This entry carries none. The cached record of the 2023 nosology, PMID:36779427, is the
  abstract and reference list only - it contains no occurrence of MIR140 and none of the
  disease tables - and the 2019 revision is cached as an abstract too. Group 13,
  spondyloepi(meta)physeal dysplasias, is where the disorder would plausibly sit, but placing
  it there without seeing the table would be a guess dressed as a classification, and the
  other entries' notes make a claim about a specific table row that could not be honoured here.

  On identifiers. MONDO:0032835 cross-references OMIM 618618, MedGen 930816, DOID 0112288, GARD
  0025756 and UMLS C4305147. It has no Orphanet cross-reference, and the Orphanet API returns
  no record for this disorder. Two identifier errors in the sources are worth recording so they
  are not propagated. The deep-research report committed with this entry gives ORPHA:163649 for
  this disease; that code is Spondyloepiphyseal dysplasia-craniosynostosis-cleft
  palate-cataracts-intellectual disability syndrome, a different disorder, and it is not used
  here. Separately, PMID:36711926 gives the OMIM number as 611894 in both its abstract and its
  introduction, where the MONDO cross-reference and the founding paper give 618618; only the
  latter is used.

  On the deep-research report. research/Spondyloepiphyseal_Dysplasia_Nishimura_Type-deep-research-falcon.md
  is committed with this entry. Its Named Entity Confusion preflight passes: MIR140 is
  mentioned 54 times against 10 for the next gene, and the OMIM number it reports matches the
  one MONDO cross-references. Its main contribution was to surface PMID:36711926, the metabolic
  follow-up, which a search on the disease name alone does not return. Its identifier error is
  described above; the obsolete GO:0016573 it suggested for histone acetylation is not used,
  and every ontology term in this entry was resolved through OLS and checked against the label
  the service returned rather than against the label the report wrote.

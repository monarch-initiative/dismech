  - reference: PMID:36711926
    reference_title: "Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "In this study, we show that the disease-causing GOF mutant miR-140 decreases glycolysis and increases OXPHOS in growth plate chondrocytes, that reduced glycolysis via Ldh ablation increases resting chondrocyte proliferation and reduces histone acetylation, and that Acly disruption causes cellular and molecular abnormalities similar to those of Ldh ablation in chondrocytes."
    explanation: >-

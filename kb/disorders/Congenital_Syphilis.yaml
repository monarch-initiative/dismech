  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    T. pallidum maintains its peptidoglycan cell wall by penicillin-binding
    protein cross-linking, the target of penicillin G. Penicillin G is the only
    agent known to treat fetal infection and prevent congenital syphilis, and
    it is the basis of every maternal and neonatal regimen.

name: Congenital Syphilis
creation_date: "2026-11-26T18:22:44Z"
category: Infectious Disease
description: >-
  Congenital syphilis is infection of the fetus or newborn with Treponema
  pallidum subsp. pallidum acquired from an infected mother, almost always
  across the placenta during maternal spirochetemia. Transmission can happen
  at any stage of maternal infection and in any trimester, and its risk is
  highest when the mother has primary or secondary syphilis. Untreated
  maternal syphilis causes early fetal loss, stillbirth, hydrops, preterm
  birth, and neonatal death. Live-born infants are often asymptomatic at
  birth. Early congenital syphilis (presenting before age 2 years) resembles
  disseminated secondary syphilis, with rash, rhinitis (snuffles),
  hepatosplenomegaly with hepatitis and cholestasis, anemia and
  thrombocytopenia, and osteochondritis and periostitis of the long bones that
  cause pseudoparalysis. Late congenital syphilis (age 2 years or older)
  comprises interstitial keratitis, eighth nerve deafness, and Hutchinson
  teeth (the Hutchinson triad), together with stigmata of disturbed
  development such as saddle nose, saber shins, and palatal perforation. The
  disease is prevented by syphilis screening early in pregnancy, repeated
  in the third trimester and at delivery where risk is high, and by treating
  the mother with a stage-appropriate benzathine penicillin G regimen at least
  30 days before delivery. Infected or at-risk newborns are classified by the
  CDC risk scenarios and treated with a 10-day course of aqueous crystalline
  or procaine penicillin G, or a single dose of benzathine penicillin G when
  infection is less likely.
synonyms:
- syphilis congenita
- congenital lues
- connatal syphilis
disease_term:
  preferred_term: congenital syphilis
  term:
    id: MONDO:0005714
    label: congenital syphilis
parents:
- Syphilis
- Congenital infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:34292926
      reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Penicillin G is the only known effective antimicrobial for treating fetal infection and preventing congenital syphilis"
      explanation: >-
        Congenital syphilis is a bacterial infection treated with antimicrobial
        therapy, placing it in Harrison's Infectious Diseases Part.
notes: >-
  This entry is promoted out of Syphilis, which described congenital syphilis
  inline as a vertical-transmission stage. It differs from the parent on three
  of the five promotion axes, each cited in this entry. Transmission: it is
  acquired vertically, across the placenta, rather than by sexual lesion
  contact. Organ systems: it is a fetal and neonatal multisystem disease of the
  placenta and umbilical cord, fetal liver, bone, skin, blood, and central
  nervous system, with stillbirth and hydrops as outcomes that have no adult
  counterpart. First-line therapy: newborns receive weight-based aqueous
  crystalline or procaine penicillin G for 10 days, chosen by the CDC neonatal
  risk scenarios, and prevention rests on maternal screening and maternal
  benzathine penicillin treatment. Syphilis keeps a pointer subtype with
  curated_in: Congenital_Syphilis.

  Early congenital syphilis (MONDO:0000333) and late congenital syphilis
  (MONDO:0005821) are age-defined phases of one infection, the boundary being
  age 2 years. They are modelled in progression, not as subtypes or separate
  entries, as the infectious-disease granularity ladder requires for phases.

  The literature is thin on mechanism. The pathogenesis of placental crossing
  is acknowledged in the cited review to be poorly understood, the only animal
  models are rabbit models of limited fidelity for vertical transmission, and
  T. pallidum could not be stably cultured until 2017. The causal chain here
  is therefore built from human pathology (placental and umbilical cord
  histology, autopsy) and clinical series rather than from experimental work.
  The neonatal penicillin regimens rest mostly on expert opinion and
  nonrandomized studies; a 2026 evidence review found no randomized trial
  behind the standard 10-day course.

  HIV: no cited source supports maternal HIV infection as a risk factor for
  vertical syphilis transmission. The sources record two other HIV
  relationships instead. CDC states that placental inflammation from
  congenital syphilis might increase perinatal HIV transmission, and a large
  placental series found that HIV co-infection reduced the frequency of
  inflammatory placental lesions, which can hide the diagnosis. Both are
  recorded where they apply (the histopathology rows and the neonatal
  evaluation row) rather than as an environmental risk factor.

  Frequencies come from hospital series of infected infants (China, Italy,
  South Africa) and are proportions within those series, not population
  rates. They differ between series because case definitions and referral
  patterns differ.

  Deep research: two claude_code deep-research runs on 2026-11-26 were both
  unsuccessful (exit 4). The first was stopped partway by a safety classifier,
  and in the second the agent could not reach PubMed. Both reports were
  discarded, and every source here was found by direct PubMed search.
review_notes: >-
  Deliberately lumped. This entry keeps fetal infection, stillbirth, early
  congenital syphilis and late congenital syphilis together as phases of one
  vertically acquired T. pallidum subsp. pallidum infection, recorded in
  progression. A PubMed search on 2026-11-26 found no source treating early
  and late congenital syphilis as different diseases rather than as
  age-defined presentations of one infection with a shared treatment. There is
  no organism stratum to split: the endemic treponemes are not a recognized
  cause of congenital infection in the cited sources, and only the venereal
  subspecies is bound here.
infectious_agent:
- name: Treponema pallidum subsp. pallidum
  description: >-
    The venereal subspecies of T. pallidum, a spirochete that disseminates
    widely, lacks lipopolysaccharide, and is one of only two bacteria commonly
    transmitted across the human placenta.
  infectious_agent_term:
    preferred_term: Treponema pallidum subsp. pallidum
    term:
      id: NCBITaxon:161
      label: Treponema pallidum subsp. pallidum
  evidence:
  - reference: PMID:38201292
    reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of all the bacteria capable of causing human disease, only two are commonly transmitted transplacentally: Treponema pallidum subspecies pallidum and Listeria monocytogenes."
    explanation: >-
      Identifies T. pallidum subsp. pallidum as the transplacentally
      transmitted agent of congenital syphilis.
agent_life_cycle:
  description: >-
    T. pallidum subsp. pallidum is an obligate human pathogen with no animal
    reservoir. It is maintained in adults by sexual transmission and reaches
    the fetus when an infected mother becomes spirochetemic during pregnancy.
  hosts:
  - preferred_term: Homo sapiens
    role: sole natural host and reservoir
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:38201292
    reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "T. pallidum is a sexually transmitted spirochete that causes a chronic infection exclusively in humans."
    explanation: >-
      Establishes humans as the only host, so no non-human reservoir is
      recorded.
transmission:
- name: Vertical transplacental transmission
  description: >-
    T. pallidum crosses the placenta during maternal spirochetemia and spreads
    hematogenously to the fetus. Transmission can occur at any point in
    pregnancy or at delivery, at every stage of maternal syphilis, and is most
    likely when the mother has primary or secondary syphilis, when treponemal
    burden is greatest. Risk remains substantial in late latent infection with
    low titers.
  evidence:
  - reference: PMID:40977496
    reference_title: "Syphilis in pregnancy: A practical guide for prenatal care providers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vertical transmission can occur at any point during pregnancy or delivery, with the highest risk observed during primary and secondary stages of infection compared to latent phases."
    explanation: >-
      States the timing and maternal-stage dependence of vertical
      transmission.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "risk for fetal infection is still substantial among pregnant women with late latent syphilis and low titers"
    explanation: >-
      Records that late latent maternal infection still carries a substantial
      transmission risk.
  - reference: PMID:27956203
    reference_title: "Syphilis during pregnancy: a preventable threat to maternal-fetal health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Syphilis can infect the fetus in all stages of the disease regardless of trimester"
    explanation: >-
      Supports transmission at every maternal stage and in every trimester.

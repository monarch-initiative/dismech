discussions:
- discussion_id: congenital_syphilis_neonatal_regimen_evidence_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is a 10-day hospital course of intravenous penicillin G necessary for every
    neonate with proven or possible congenital syphilis, or would shorter or
    intramuscular regimens be as effective?
  rationale: >-
    The standard 10-day intravenous course is costly and separates infants
    from families, and a 2026 review found its evidence base to be expert
    opinion, consensus, and nonrandomized studies, with inconsistent regimens
    that could not be pooled. No randomized trial compares regimens.
  attaches_to:
  - treatments#Aqueous crystalline penicillin G, 10-day neonatal course
  proposed_experiments:
  - experiment_id: exp_congenital_syphilis_regimen_rct
    name: Randomized trial of neonatal penicillin regimens
    description: >-
      A randomized noninferiority trial of the 10-day intravenous aqueous
      penicillin G course against intramuscular or shortened regimens in
      neonates with scenario 1 or 2 congenital syphilis, with serologic cure
      and neurodevelopmental outcome as endpoints.
- discussion_id: congenital_syphilis_placental_crossing_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does T. pallidum cross the human placenta, and which treponemal
    adhesins and placental cells are involved?
  rationale: >-
    The mechanism is acknowledged to be poorly understood. T. pallidum could
    not be stably cultured until 2017 and animal models of vertical
    transmission are limited, so the only candidate placental adhesin (Tp0954)
    has been shown only in placental cell lines.
  attaches_to:
  - pathophysiology#Transplacental Treponemal Invasion
references:
- reference: PMID:34292926
  title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
  findings:
  - statement: >-
      CDC classifies neonates into four risk scenarios and treats proven or
      possible congenital syphilis with a 10-day course of aqueous or procaine
      penicillin G.
    supporting_text: "Penicillin G is the only known effective antimicrobial for treating fetal infection and preventing congenital syphilis"

- name: Central Nervous System Invasion
  biological_scale: TISSUE
  description: >-
    Treponemes reach the cerebrospinal fluid in a large share of infected
    infants, detected as a reactive CSF nontreponemal test, raised CSF protein,
    or pleocytosis. Neurosyphilis is treated for 14 rather than 10 days in some
    centres. Developmental delay and microcephaly are more common in infected
    than in exposed but uninfected infants.

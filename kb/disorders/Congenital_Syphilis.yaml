progression:
- phase: Fetal infection in utero
  description: >-
    Fetal infection can occur at any gestational age once the mother is
    spirochetemic. Fetal signs can sometimes be seen on ultrasound after 20
    weeks, most often hepatomegaly and placentomegaly, then signs of fetal
    anemia, ascites, and hydrops. Severe fetal infection ends in early fetal
    death or stillbirth.
  evidence:
  - reference: PMID:27956203
    reference_title: "Syphilis during pregnancy: a preventable threat to maternal-fetal health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Syphilis can infect the fetus in all stages of the disease regardless of trimester and can sometimes be detected with ultrasound >20 weeks."
    explanation: >-
      Defines the in-utero phase and when it becomes detectable on
      ultrasound.
- phase: Early congenital syphilis
  age_range: birth to 2 years
  description: >-
    Disease presenting in the first 2 years of life (MONDO:0000333). The
    lesions are infectious and resemble those of secondary acquired syphilis.
    Most infected infants are asymptomatic at birth and, if untreated, develop
    signs over the following months.
  evidence:
  - reference: PMID:23919053
    reference_title: "Observance of Kassowitz law-late congenital syphilis: Palatal perforation and saddle nose deformity as presenting features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Early congenital syphilis refers to individuals with syphilis from the first 2 years of life. The lesions of early congenital syphilis are infectious and it could be compared to the secondary stage of acquired syphilis."
    explanation: >-
      Gives the age boundary of the early phase and its resemblance to
      secondary syphilis.
  - reference: PMID:36376519
    reference_title: "Congenital syphilis in the twenty-first century: an area-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Two-thirds of infected children are asymptomatic at birth although, if left untreated, they can develop symptoms of disease months to years later"
    explanation: >-
      Records that most infected newborns have no signs at birth.
- phase: Late congenital syphilis
  age_range: 2 years and older
  description: >-
    Disease recognized at age 2 years or older (MONDO:0005821), often
    serologically detected and otherwise asymptomatic, or presenting with
    interstitial keratitis, eighth nerve deafness, Hutchinson teeth, and
    Clutton joints. These features usually become apparent after age 5.
  evidence:
  - reference: PMID:22670010
    reference_title: "Clinical aspects of congenital syphilis with Hutchinson's triad."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Late congenital syphilis is recognised with 2 or more years after birth."
    explanation: >-
      Gives the age boundary of the late phase.
  - reference: PMID:22670010
    reference_title: "Clinical aspects of congenital syphilis with Hutchinson's triad."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These clinical features are related to syphilis present during pregnancy and at birth, however they commonly become apparent after 5-years of age."
    explanation: >-
      Places the onset of the Hutchinson triad features after age 5.
- phase: Stigmata
  description: >-
    Permanent scars and deformities left by early or late lesions, such as
    saddle nose, Hutchinson teeth, rhagades, and periosteal changes of the
    tibia. They persist after microbiological cure.
  evidence:
  - reference: PMID:23919053
    reference_title: "Observance of Kassowitz law-late congenital syphilis: Palatal perforation and saddle nose deformity as presenting features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Stigmata are scars or deformities resulting from either early or late lesions."
    explanation: >-
      Defines stigmata as residual deformity rather than active infection.
pathophysiology:
- name: Maternal Treponemal Spirochetemia
  biological_scale: ORGANISM
  description: >-
    An untreated or inadequately treated pregnant woman with syphilis has
    treponemes in her bloodstream. The risk that the fetus is infected tracks
    maternal treponemal burden, which is highest in primary and secondary
    syphilis and is marked by a high nontreponemal titer. This is the trigger
    node of the pathograph.
  downstream:
  - target: Transplacental Treponemal Invasion
    description: >-
      Circulating treponemes reach the placenta, where they invade and cross
      the maternal-fetal barrier.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38201292
      reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Vertical transmission is associated with maternal early-stage infection and high antitreponemal antibody titer, which both correlate with high bacterial load"
      explanation: >-
        Links maternal bacterial load to the likelihood of vertical
        transmission.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative maternal nontreponemal titer, especially if >1:8, might be a marker of early infection and bacteremia."
    explanation: >-
      Identifies a high maternal titer as a marker of the bacteremia that
      drives fetal infection.
- name: Transplacental Treponemal Invasion
  biological_scale: TISSUE
  description: >-
    T. pallidum attaches to and crosses the placenta. The organism lacks
    toxins but binds fibronectin and laminin, which helps it attach to
    endothelium and leave blood vessels, and a surface lipoprotein (Tp0954)
    mediates attachment to placental cell lines. Treponemes are visible in the
    placenta in many cases, with increased numbers of Hofbauer cells, the
    placental macrophages.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  - preferred_term: Hofbauer cell
    term:
      id: CL:3000001
      label: Hofbauer cell
  biological_processes:
  - preferred_term: adhesion of symbiont to host cell
    term:
      id: GO:0044650
      label: adhesion of symbiont to host cell
  downstream:
  - target: Placental and Umbilical Cord Inflammation
    description: >-
      Placental infection provokes villitis and, in the cord, necrotizing
      funisitis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38201292
      reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Bacteria are visible in the placenta in a substantial percentage of congenital syphilis cases"
      explanation: >-
        Places treponemes in the placenta, the tissue whose inflammation
        follows.
  - target: Fetal Hematogenous Dissemination
    description: >-
      Treponemes pass from the placenta through the umbilical cord into the
      fetal circulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38201292
      reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "It is believed that the bacteria then spread hematogenously to the developing fetus since necrotizing funisitis and spirochetes in the umbilical cord are both common findings"
      explanation: >-
        Supports hematogenous spread from the placenta to the fetus, inferred
        from cord pathology.
  evidence:
  - reference: PMID:38201292
    reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The study of human clinical data has shown that T. pallidum can invade and cross the placenta."
    explanation: >-
      States that T. pallidum invades and crosses the human placenta.
  - reference: PMID:38201292
    reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Primus and coauthors were able to identify a T. pallidum surface lipoprotein Tp0954 that mediates attachment to placental cell lines, which suggests that there are virulence factors that specifically contribute to congenital syphilis"
    explanation: >-
      Cell-line evidence for a placenta-binding adhesin, the basis for the
      adhesion process bound here. Indirect because it was shown in cultured
      placental cells, not in human placenta.
  - reference: PMID:39670453
    reference_title: "Stillbirth and Congenital Syphilis: Autopsy and Placental Findings of 11 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a spirochete capable of traversing the placental barrier, with a high rate of fetal and placental infection"
    explanation: >-
      Autopsy and placental series supporting placental crossing.
- name: Placental and Umbilical Cord Inflammation
  biological_scale: TISSUE
  description: >-
    The infected placenta shows chronic villitis, acute chorioamnionitis,
    villous enlargement and immaturity, and, in the cord, necrotizing
    funisitis associated with spirochetes in the umbilical artery wall. This
    placental damage is thought to cause fetal hypoxemia and death. HIV
    co-infection and maternal penicillin treatment reduce the frequency of
    these inflammatory lesions.
  cell_types:
  - preferred_term: Hofbauer cell
    term:
      id: CL:3000001
      label: Hofbauer cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Stillbirth
    description: >-
      Placental damage leading to fetal hypoxemia is the proposed cause of
      fetal death.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38201292
      reference_title: "Crossing the Barrier: A Comparative Study of Listeria monocytogenes and Treponema pallidum in Placental Invasion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Fetal demise is thought to be caused by placental damage leading to hypoxemia, as stillborn fetuses often show hepatosplenomegaly and are more likely to exhibit erythroblastosis compared to live-born congenital syphilis infants"
      explanation: >-
        States the proposed placental-hypoxemia mechanism of stillbirth.
  - target: Large placenta
    description: >-
      Villous enlargement and placental edema produce placentomegaly.
    causal_link_type: DIRECT
  - target: Miscarriage
    description: >-
      Placental and fetal infection early in pregnancy ends in early fetal
      death.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12100814
    reference_title: "Placental histopathology of congenital syphilis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Controlling for gestational age, histopathology revealed necrotizing funisitis, villous enlargement, and acute villitis associated with congenital syphilis."
    explanation: >-
      Identifies the placental and cord lesions associated with congenital
      syphilis in a controlled series.
  - reference: PMID:7628852
    reference_title: "Pathology of the umbilical cord in congenital syphilis: analysis of 25 specimens using histochemistry and immunofluorescent antibody to Treponema pallidum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Necrotizing funisitis was strongly associated with umbilical artery infection by spirochetes (P = .008)."
    explanation: >-
      Links the cord lesion to direct spirochetal infection of the umbilical
      artery.
- name: Fetal Hematogenous Dissemination
  biological_scale: ORGANISM
  description: >-
    Once in the fetal circulation, T. pallidum spreads to all tissues and
    provokes a lymphocyte and plasma cell inflammatory response, much as in
    disseminated secondary syphilis of adults. Overwhelming infection kills the
    fetus; less severe infection disturbs development before and after birth.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Syphilitic Hepatitis
    description: Hematogenous seeding of the fetal liver causes hepatitis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39302442
      reference_title: "Syphilitic hepatitis in infants, the forgotten disease that hepatologists have to brush up on: from a case series to a revision of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical manifestations of congenital syphilis (CS) include liver disease with/without impaired liver function, identified as syphilitic hepatitis."
      explanation: >-
        Identifies liver disease as a manifestation of disseminated
        congenital infection.
  - target: Osteochondritis and Periostitis of Long Bones
    description: >-
      Treponemes seed the growing ends and periosteum of the long bones.
    causal_link_type: DIRECT
  - target: Mucocutaneous Treponemal Infection
    description: >-
      Dissemination to skin and nasal mucosa produces the infectious rash and
      rhinitis of early congenital syphilis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23919053
      reference_title: "Observance of Kassowitz law-late congenital syphilis: Palatal perforation and saddle nose deformity as presenting features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Common manifestations are skin rashes, mucous patches, lymphadenitis"
      explanation: >-
        Names skin and mucous lesions among the common early manifestations.
  - target: Fetal Anemia and Hydrops
    description: >-
      Disseminated infection causes fetal anemia, which progresses to ascites
      and hydrops.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Central Nervous System Invasion
    description: Treponemes reach the cerebrospinal fluid and brain.
    causal_link_type: DIRECT
  - target: Developmental Disruption of Bone and Dentition
    description: >-
      Infection that does not kill the fetus interferes with development of
      bones and teeth.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23919053
      reference_title: "Observance of Kassowitz law-late congenital syphilis: Palatal perforation and saddle nose deformity as presenting features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "If the infection is not severe, it may interfere with normal development at various stages of intra- uterine and extra- uterine life."
      explanation: >-
        Links nonlethal fetal infection to disturbed development.
  - target: Late Immune-Mediated Inflammation
    description: >-
      Persisting untreated infection is followed in later childhood by
      inflammatory lesions of the cornea and joints.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing impairment
    description: >-
      Eighth nerve deafness is a late manifestation. The cited sources do not
      establish whether it reflects otic infection, eighth nerve involvement,
      or a hypersensitivity process.
    causal_link_type: UNKNOWN
  - target: Premature birth
    description: Fetal infection is associated with preterm delivery.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12100814
      reference_title: "Placental histopathology of congenital syphilis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

- name: Mucocutaneous Treponemal Infection
  biological_scale: TISSUE
  description: >-
    Infection of the skin and nasal mucosa produces a maculopapular rash that
    can become bullous, especially on the palms and soles, and rhinitis
    (snuffles). The lesions and nasal discharge contain treponemes and are
    infectious, so they are sampled for darkfield microscopy or PCR.
  downstream:
  - target: Maculopapular exanthema

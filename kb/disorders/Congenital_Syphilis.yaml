    explanation: Gives the frequency of necrotizing funisitis.
  - reference: PMID:7628852
    reference_title: "Pathology of the umbilical cord in congenital syphilis: analysis of 25 specimens using histochemistry and immunofluorescent antibody to Treponema pallidum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is significant for the pathologist that spirochetes may often be detected in the absence of overt tissue inflammation or necrosis"
    explanation: Records that infection can be present without cord inflammation.
diagnosis:
- name: Maternal syphilis screening in pregnancy
  description: >-
    Prevention and detection depend on serologic screening of every pregnant
    woman at the first prenatal visit, repeated at 28 weeks and at delivery for
    women in high-prevalence communities, women with HIV, and those at
    increased risk. Some US states require screening three times in pregnancy.
    No mother or newborn should leave hospital without maternal serologic
    status having been documented at least once in pregnancy. Routine screening
    of neonatal serum or cord blood instead of maternal serum is not
    recommended. Where prenatal care is poor, a stat RPR card test and
    same-visit treatment are recommended when pregnancy is confirmed.
  diagnosis_term:
    preferred_term: prenatal syphilis screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Effective prevention and detection of congenital syphilis depend on identifying syphilis among pregnant women and, therefore, on the routine serologic screening of pregnant women during the first prenatal visit and at 28 weeks’ gestation and at delivery for women who live in communities with high rates of syphilis, women with HIV infection, or those who are at increased risk for syphilis acquisition."
    explanation: States the recommended maternal screening schedule.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine screening of neonatal sera or umbilical cord blood is not recommended because diagnosis at that time does not prevent congenital syphilis in certain newborns."
    explanation: Records why screening is maternal rather than neonatal.
  - reference: PMID:30811406
    reference_title: "Global burden of maternal and congenital syphilis and associated adverse birth outcomes-Estimates for 2016 and progress since 2012."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Of these ABOs- 203,000 (57%) occurred in pregnant women attending ANC but not screened for syphilis; 74,000 (21%) in mothers not enrolled in ANC, 55,000 (16%) in mothers screened but not treated, and 23,000 (6%) in mothers enrolled, screened and treated."
    explanation: >-
      Attributes most global adverse birth outcomes to missed screening,
      quantifying the value of screening.
- name: CDC neonatal risk scenario classification
  description: >-
    A neonate born to a mother with reactive nontreponemal and treponemal
    tests is classified into one of four CDC scenarios, from the neonate's
    examination, a comparison of neonatal and maternal nontreponemal titers by
    the same test, and the adequacy and timing of maternal treatment.
    Scenario 1, proven or highly probable: an abnormal examination consistent
    with congenital syphilis, a neonatal titer at least fourfold the maternal
    titer, or a positive darkfield, PCR, or silver stain of placenta, cord,
    lesions, or body fluids. Scenario 2, possible: a normal examination and a
    titer no more than fourfold the maternal titer, with a mother untreated,
    inadequately or undocumentedly treated, treated with a nonpenicillin
    regimen, or treated less than 30 days before delivery. Scenario 3, less
    likely: as scenario 2 but with appropriate maternal treatment begun at
    least 30 days before delivery and no evidence of reinfection or relapse.
    Scenario 4, unlikely: adequate maternal treatment before pregnancy and a
    low, stable maternal titer throughout. The absence of a fourfold titer
    difference does not exclude congenital syphilis. Any neonate at risk
    should be tested for HIV.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment decisions frequently must be made on the basis of identification of syphilis in the mother; adequacy of maternal treatment; presence of clinical, laboratory, or radiographic evidence of syphilis in the neonate; and comparison of maternal (at delivery) and neonatal nontreponemal serologic titers"
    explanation: Gives the inputs used to classify the neonate.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a positive darkfield test or PCR of placenta, cord, lesions, or body fluids or a positive silver stain of the placenta or cord"
    explanation: Gives the direct-detection criterion of scenario 1.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother received the recommended regimen but treatment was initiated <30 days before delivery."
    explanation: Gives the timing criterion that places a neonate in scenario 2.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother’s nontreponemal serologic titer remained low and stable (i.e., serofast) before and during pregnancy and at delivery (e.g., VDRL ≤1:2 or RPR ≤1:4)."
    explanation: Gives the serofast criterion of scenario 4.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Any neonate at risk for congenital syphilis should receive a full evaluation and testing for HIV ."
    explanation: Records the HIV testing recommendation.
- name: Neonatal quantitative nontreponemal serology and serologic follow-up
  description: >-
    The neonate's serum, not cord blood, is tested with the same quantitative
    nontreponemal test used for the mother. Treponemal tests and commercial IgM
    tests on neonatal serum are not recommended, because passively transferred
    maternal IgG can persist beyond 15 months. Reactive infants are retested
    every 2-3 months until nonreactive. In an uninfected infant the titer
    falls by 3 months and is nonreactive by 6 months; a test still reactive at
    6 months indicates infection.
  diagnosis_term:
    preferred_term: nontreponemal serologic testing
    term:
      id: NCIT:C74716
      label: Rapid Plasma Reagin Measurement
  measurements:
  - preferred_term: Nontreponemal (reagin) antibody titer
    term:
      id: LOINC:11084-1
      label: Reagin Ab [Titer] in Serum
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "umbilical cord blood can become contaminated with maternal blood and yield a false-positive result"
    explanation: Gives the reason neonatal serum rather than cord blood is tested.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nontreponemal antibody titers should decrease by age 3 months and be nonreactive by age 6 months, indicating that the reactive test result was caused by passive transfer of maternal IgG antibody"
    explanation: Gives the follow-up criterion separating passive antibody from infection.
- name: Cerebrospinal fluid examination
  description: >-
    CSF VDRL, cell count, and protein are part of the evaluation in scenarios
    1 and 2 and in older infants and children. Neonatal CSF values are hard to
    interpret, differ by gestational age, and require an uncontaminated tap.
  diagnosis_term:
    preferred_term: cerebrospinal fluid examination by lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  measurements:
  - preferred_term: CSF-VDRL
    term:
      id: LOINC:5290-2
      label: Reagin Ab [Presence] in Cerebral spinal fluid by VDRL
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF test results obtained during the neonatal period can be difficult to interpret; normal values differ by gestational age and are higher among preterm infants."
    explanation: Records the interpretive limits of neonatal CSF.
  - reference: PMID:22089362
    reference_title: "Neonates at risk for congenital syphilis: radiographic and cerebrospinal fluid evaluations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 1 (1.35%) of the 74 infants had a positive CSF-VDRL."
    explanation: >-
      Shows the low yield of CSF-VDRL in largely asymptomatic at-risk
      neonates.
- name: Long-bone radiographs
  description: >-
    Long-bone radiographs show osteochondritis, metaphyseal lucencies, and
    periostitis, and are part of the evaluation in scenarios 1 and 2. In
    stillborn infants a skeletal survey can show typical osseous lesions that
    fetal ultrasound misses. Yield is low in asymptomatic at-risk neonates.
  diagnosis_term:
    preferred_term: long-bone radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for stillborn infants, skeletal survey demonstrating typical osseous lesions might aid in the diagnosis of congenital syphilis because these abnormalities are not detected on fetal ultrasound"
    explanation: Supports radiographic diagnosis in stillbirth.
  - reference: PMID:22089362
    reference_title: "Neonates at risk for congenital syphilis: radiographic and cerebrospinal fluid evaluations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three infants had radiographic changes that were consistent with CS."
    explanation: >-
      Shows the low yield of radiographs among 92 presumptive cases, mostly
      asymptomatic.
- name: Placental and umbilical cord pathology
  description: >-
    Histologic examination of the placenta and cord, with silver stain,
    immunohistochemistry, or a validated T. pallidum PCR, adds to
    conventional evaluation, especially in stillbirth. Immunohistochemistry
    is more sensitive than qPCR on placental tissue.
  diagnosis_term:
    preferred_term: placental histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:12100814
    reference_title: "Placental histopathology of congenital syphilis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The addition of histologic evaluation to conventional diagnostic evaluations improved the detection rate for congenital syphilis from 67% to 89% in live-born infants, and 91% to 97% in stillborn infants."
    explanation: Quantifies the diagnostic gain from placental histology.
  - reference: PMID:37668986
    reference_title: "Placental Syphilis: A Comprehensive Review of Routine Histomorphology, HIV Co-infection, Penicillin Treatment, Immunohistochemistry, and Polymerase Chain Reaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IHC and qPCR exhibited sensitivities of 74.4 and 25.8%, respectively, confirming the diagnosis in 42 cases with negative or unknown serology."
    explanation: Gives the sensitivity of ancillary placental tests.
  - reference: PMID:7628852
    reference_title: "Pathology of the umbilical cord in congenital syphilis: analysis of 25 specimens using histochemistry and immunofluorescent antibody to Treponema pallidum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spirochetes were detected using silver and immunofluorescent staining in 89% of cords"
    explanation: Shows the sensitivity of umbilical cord staining.
- name: Prenatal fetal ultrasound
  description: >-
    When syphilis is diagnosed in the second half of pregnancy, a fetal
    ultrasound for hepatomegaly, ascites, hydrops, fetal anemia, or a thickened
    placenta should accompany treatment without delaying it. These signs mean
    a greater risk of fetal treatment failure and of complications during
    treatment.
  diagnosis_term:
    preferred_term: obstetric ultrasound
    term:
      id: NCIT:C217447
      label: Diagnostic Obstetric Ultrasound
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sonographic signs of fetal or placental syphilis (e.g., hepatomegaly, ascites, hydrops, fetal anemia, or a thickened placenta) indicate a greater risk for fetal treatment failure"
    explanation: Gives the sonographic signs and their prognostic meaning.
treatments:
- name: Aqueous crystalline penicillin G, 10-day neonatal course
  description: >-
    For proven, highly probable, or possible congenital syphilis (scenarios 1
    and 2): aqueous crystalline penicillin G 50,000 units/kg IV every 12 hours
    in the first 7 days of life and every 8 hours thereafter, for 10 days. If
    more than one day is missed, the whole course is restarted. Infants and
    children aged 1 month or more receive 50,000 units/kg IV every 4-6 hours
    for 10 days. A full penicillin course is preferred even when ampicillin was
    started for possible sepsis. The evidence base is mostly expert opinion and
    nonrandomized studies.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aqueous crystalline penicillin G
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Penicillin G inhibits treponemal peptidoglycan cross-linking.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aqueous crystalline penicillin G 100,000–150,000 units/kg body weight/day, administered as 50,000 units/kg body weight/dose IV every 12 hours during the first 7 days of life and every 8 hours thereafter for a total of 10 days"
    explanation: Gives the recommended neonatal regimen.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If >1 day of therapy is missed, the entire course should be restarted."
    explanation: Records the restart rule.
  - reference: PMID:42236154
    reference_title: "Comprehensive review of the evidence informing the standard of care penicillin treatment of congenital syphilis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The results affirmed a gap in high-quality primary evidence behind the treatment of CS. Supporting literature is based on expert opinion, consensus and non-randomised studies."
    explanation: Records the weak evidence base for the standard regimen.
- name: Procaine penicillin G, 10-day neonatal course
  description: >-
    The alternative regimen for scenarios 1 and 2: procaine penicillin G
    50,000 units/kg IM once daily for 10 days. It also substitutes for some or
    all IV doses when aqueous penicillin is in short supply.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: procaine penicillin G
      term:
        id: NCIT:C87370
        label: Penicillin G Procaine
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Penicillin G inhibits treponemal peptidoglycan cross-linking.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Procaine penicillin G 50,000 units/kg body weight/dose IM in a single daily dose for 10 days"
    explanation: Gives the alternative neonatal regimen.
- name: Single-dose benzathine penicillin G for the neonate
  description: >-
    Benzathine penicillin G 50,000 units/kg IM once is recommended in scenario
    3, can replace the 10-day course in scenario 2 only when the full
    evaluation is normal and follow-up is certain, and might be considered in
    scenario 4 when follow-up is uncertain. A neonate born to a mother with
    untreated early syphilis should receive the 10-day course even if the
    evaluation is normal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: penicillin G benzathine
      term:
        id: NCIT:C47657
        label: Penicillin G Benzathine
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Penicillin G inhibits treponemal peptidoglycan cross-linking.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before using the single-dose benzathine penicillin G regimen, the recommended evaluation (i.e., CSF examination, long-bone radiographs, and CBC with platelets) should be normal, and follow-up should be certain."
    explanation: Gives the precondition for single-dose therapy in scenario 2.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonates born to mothers with untreated early syphilis at the time of delivery are at increased risk for congenital syphilis, and the 10-day course of penicillin G should be considered even if the neonate’s nontreponemal test is nonreactive, the complete evaluation is normal, and follow-up is certain."
    explanation: Records the exception where single-dose therapy is not enough.
- name: Maternal benzathine penicillin G treatment in pregnancy
  description: >-
    The pregnant woman receives the benzathine penicillin G regimen for her
    stage of syphilis, which prevents congenital syphilis in about 98% of
    treated pregnancies. Treatment adequate to prevent congenital syphilis
    must begin at least 30 days before delivery. Failure is most likely with
    maternal secondary syphilis and with sonographic signs of fetal infection.
    For primary, secondary, or early latent syphilis a second dose a week
    after the first can be given. Missed doses more than 9 days apart are not
    acceptable for late latent syphilis. No alternative to penicillin is
    proven in pregnancy: a penicillin-allergic woman is desensitized.
    Erythromycin and azithromycin do not reliably cure the mother or treat
    the fetus, tetracycline and doxycycline are avoided in the second and third
    trimesters, and data are insufficient for ceftriaxone. Treatment in the
    second half of pregnancy can precipitate a Jarisch-Herxheimer reaction,
    with preterm labor, fetal distress, and rarely stillbirth, which should not
    delay treatment.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
    therapeutic_agent:
    - preferred_term: penicillin G benzathine
      term:
        id: NCIT:C47657
        label: Penicillin G Benzathine
  target_mechanisms:
  - target: Maternal Treponemal Spirochetemia
    treatment_effect: INHIBITS
    description: >-
      Treating the mother clears the spirochetemia that seeds the fetus, and
      treats fetal infection already established.
  evidence:
  - reference: PMID:9916946
    reference_title: "Efficacy of treatment for syphilis in pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The success rate for all stages of syphilis was 334 of 340 (98.2%)."
    explanation: Prospective efficacy of the CDC maternal regimens.
  - reference: PMID:9916946
    reference_title: "Efficacy of treatment for syphilis in pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the highest risk of fetal treatment failure exists with maternal secondary syphilis"
    explanation: Identifies the maternal stage with the highest failure risk.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythromycin and azithromycin should not be used because neither reliably cures maternal infection nor treats an infected fetus"
    explanation: Records the contraindicated alternatives.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stillbirth is a rare complication of treatment; however, concern for this complication should not delay necessary treatment."
    explanation: Records the Jarisch-Herxheimer caveat.
  - reference: PMID:27956203
    reference_title: "Syphilis during pregnancy: a preventable threat to maternal-fetal health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Jarisch-Herxheimer reaction occurs in up to 44% of gravidas and can cause contractions, fetal heart rate abnormalities, and even stillbirth in the most severely affected pregnancies."
    explanation: Quantifies the Jarisch-Herxheimer reaction in pregnancy.
  - reference: PMID:36376519
    reference_title: "Congenital syphilis in the twenty-first century: an area-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Appropriate maternal therapy was protective against vertical transmission"
    explanation: Shows maternal therapy protects against transmission.
- name: Penicillin desensitization
  description: >-
    Pregnant women and neonates who need treatment but have a penicillin
    allergy are desensitized and then given penicillin G, because no
    alternative is proven. Skin testing is not standardized for neonates.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: penicillin desensitization
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnant women who have a history of penicillin allergy should be desensitized and treated with penicillin G."
    explanation: Gives the desensitization recommendation in pregnancy.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin testing remains unavailable for neonates because the procedure has not been standardized for this age group."
    explanation: Records the neonatal limitation.
- name: Ceftriaxone during penicillin shortage
  description: >-
    If aqueous and procaine penicillin G are unavailable, ceftriaxone 50-75
    mg/kg IV daily can be considered with close clinical and serologic
    follow-up and expert consultation, because evidence for it is insufficient.
    It is used with caution in jaundiced neonates, and a single dose is
    inadequate therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Ceftriaxone is a beta-lactam acting on the same target.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ceftriaxone should be used with caution in neonates with jaundice."
    explanation: Records the jaundice caution.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single dose of ceftriaxone is inadequate therapy."
    explanation: Records that single-dose ceftriaxone is inadequate.
environmental:
- name: Absent or late prenatal care
  description: >-
    No prenatal care, or a first visit in the second trimester or later,
    removes the screening and treatment window. No prenatal care was
    documented in 37.9% of US congenital syphilis cases in 2022, and lack of
    timely testing and adequate treatment contributed to 88% of cases.
  effect: >-
    Removes the opportunity to detect and treat maternal syphilis before the
    fetus is infected.
  influences_mechanisms:
  - target: Maternal Treponemal Spirochetemia
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Without timely testing and treatment, maternal spirochetemia continues
      through pregnancy. The effect is through a missed intervention, not a
      biological cause.
    evidence:
    - reference: PMID:37971936
      reference_title: "Vital Signs: Missed Opportunities for Preventing Congenital Syphilis - United States, 2022."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lack of timely testing and adequate treatment during pregnancy contributed to 88% of cases of congenital syphilis."
      explanation: >-
        Shows that missed testing and treatment underlie most cases.
  evidence:
  - reference: PMID:37971936
    reference_title: "Vital Signs: Missed Opportunities for Preventing Congenital Syphilis - United States, 2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among pregnancies resulting in a congenital syphilis outcome, no prenatal care was documented in 1,426 cases (37.9%)."
    explanation: Quantifies absent prenatal care among cases.
  - reference: PMID:31635589
    reference_title: "Symptomatic congenital syphilis in a tertiary neonatal unit in Cape Town, South Africa: High morbidity and mortality in a preventable disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-eight mothers (56%) were unbooked and therefore received no antenatal care."
    explanation: Shows the same pattern in a South African series.
- name: Maternal methamphetamine or heroin use
  description: >-
    Maternal methamphetamine or heroin use, and sex in conjunction with drug
    use, are CDC-listed risk factors for syphilis in pregnancy.
  influences_mechanisms:
  - target: Maternal Treponemal Spirochetemia
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drug use is associated with syphilis acquisition in pregnancy and with
      later diagnosis.
    evidence:
    - reference: PMID:34292926
      reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Maternal risk factors for syphilis during pregnancy include sex with multiple partners, sex in conjunction with drug use or transactional sex, late entry to prenatal care (i.e., first visit during the second trimester or later) or no prenatal care, methamphetamine or heroin use, incarceration of the woman or her partner, and unstable housing or homelessness"
      explanation: Lists drug use among maternal risk factors.

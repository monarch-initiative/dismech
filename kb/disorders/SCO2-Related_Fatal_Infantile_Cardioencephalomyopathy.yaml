genetic:
- name: SCO2 pathogenic variants causing cardioencephalomyopathy
  gene_term:
    preferred_term: SCO2
    term:
      id: hgnc:10604
      label: SCO2
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:10749987
      reference_title: "Mutations in SCO2 are associated with a distinct form of hypertrophic cardiomyopathy and cytochrome c oxidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: compound heterozygotes for the G1541A mutation
      explanation: Patients are compound heterozygous for SCO2 variants, indicating autosomal recessive inheritance.
    - reference: PMID:11673586
      reference_title: "Homozygosity (E140K) in SCO2 causes delayed infantile onset of cardiomyopathy and neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients all had a homozygous missense mutation in SCO2."
      explanation: Homozygous SCO2 missense variants in affected infants confirm autosomal recessive inheritance.
  features: >
    Biallelic SCO2 variants impair copper delivery to the COX CuA center,
    causing fatal infantile cardioencephalomyopathy. The clinical phenotype
    differs from that caused by SURF1. The recurrent p.E140K (c.1541G>A /
    G1541A) missense allele, adjacent to the CxxxC copper-binding motif, is
    present on at least one allele in nearly all reported patients and behaves
    as a founder/hotspot allele in Central European (notably Polish and other
    Slavic) populations; the single reported homozygous p.G193S patient is the
    documented exception. Genotype predicts course: E140K in trans with a null
    or truncating allele gives the severe neonatal cardioencephalomyopathic
    form, E140K homozygosity gives delayed onset with a Leigh-like,
    SMA-like-atrophy course, and E140K/p.M177T gives the mildest reported
    phenotype (onset after one year, nonspecific encephalomyopathy, 2-4 year
    survival).
  evidence:
  - reference: PMID:10545952
    reference_title: "Fatal infantile cardioencephalomyopathy with COX deficiency and mutations in SCO2, a COX assembly gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical phenotype caused by mutations in human SCO2 differs from that caused by mutations in SURF1, the only other known COX assembly gene associated with a human disease, Leigh syndrome.
    explanation: Establishes SCO2 as a distinct COX assembly gene with a cardioencephalomyopathy phenotype distinct from SURF1.
  - reference: PMID:19353847
    reference_title: "A novel homozygous SCO2 mutation, p.G193S, causing fatal infantile cardioencephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients reported to date with SCO2 deficiency share a common p.E140K mutation in at least 1 allele."
    explanation: Documents p.E140K as the near-universal recurrent SCO2 allele, against which the homozygous p.G193S case is the reported exception.
  - reference: PMID:23719228
    reference_title: "The natural history of SCO2 deficiency in 36 Polish children confirmed the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel, milder phenotype (disease onset delayed until one year after birth, nonspecific encephalomyopathy, and 2-4 year survival period) associated with compound heterozygosity of the common p.E140K and a novel p.M177T mutations extends the range of symptoms of the SCO2 deficiency."
    explanation: Establishes the SCO2 genotype-phenotype correlation and the mildest reported E140K/M177T combination.
  - reference: PMID:23719228
    reference_title: "The natural history of SCO2 deficiency in 36 Polish children confirmed the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of SCO2 deficiency in Poland is relatively high."
    explanation: Supports the founder-allele enrichment of SCO2 deficiency in a Central European population.
experimental_models:
- name: SCO2-mutant patient iPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >
    Cardiomyocytes differentiated via embryoid bodies from induced pluripotent
    stem cells reprogrammed from skin fibroblasts of two SCO2 patients (one
    compound heterozygous for p.E140K, one homozygous for p.G193S) and healthy
    controls. The model captures the human cardiac arm of the disease that
    viable Sco2 mouse models do not reproduce.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  publication: PMID:29193756
  modeled_mechanisms:
  - target: Impaired Terminal Electron Transfer and ATP Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      SCO2-mutant iPSC-derived cardiomyocytes show ultrastructural
      mitochondrial abnormalities and blunted inotropic responsiveness, with
      delayed afterdepolarizations and increased beat-rate variability
      attributed to impaired sarcoplasmic-reticulum calcium handling secondary
      to ATP shortage.
    limitations: >
      iPSC-derived cardiomyocytes are immature relative to adult myocardium and
      are studied in isolation from the hemodynamic load and neurohormonal
      context that shape hypertrophic remodeling in vivo; only two patient
      genotypes were assayed.
    evidence:
    - reference: PMID:29193756
      reference_title: "Investigating the cardiac pathology of SCO2-mediated hypertrophic cardiomyopathy using patients induced pluripotent stem cell-derived cardiomyocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found in the mutated iPSC-CMs major ultrastructural abnormalities and markedly attenuated response to the inotropic interventions and caffeine, as well as delayed afterdepolarizations (DADs) and increased BRV, suggesting impaired SR Ca2+ handling due to attenuated SERCA activity caused by ATP shortage."
      explanation: Establishes that the patient-derived cardiomyocyte model reproduces the bioenergetic-failure node with a measurable cardiac functional readout.
  evidence:
  - reference: PMID:29193756
    reference_title: "Investigating the cardiac pathology of SCO2-mediated hypertrophic cardiomyopathy using patients induced pluripotent stem cell-derived cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our novel results show that iPSC-CMs are useful for investigating the pathophysiological mechanisms underlying the SCO2 mutation syndrome."
    explanation: The authors' own assessment that this model is informative for SCO2 disease mechanism.
animal_models:
- name: Sco2 E129K knock-in and knock-in/knock-out mouse
  species: Mouse
  genotype: >
    Sco2 knock-out (KO) allele and Sco2 E129K knock-in (KI) allele (orthologous
    to the human p.E140K); homozygous KI and compound heterozygous KI/KO animals
  publication: PMID:19837698
  description: >
    Allele-matched mouse models of the recurrent human SCO2 variant. Homozygous
    KO animals are embryonic lethal; homozygous KI and KI/KO animals are viable
    with muscle weakness, respiratory chain deficiency, Complex IV assembly
    defects across tissues, and reduced mitochondrial copper content.
  modeled_mechanisms:
  - target: SCO2 Loss and Defective Copper Delivery to COX
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      The viable KI and KI/KO genotypes reproduce the molecular lesion —
      Complex IV assembly failure with a selective reduction in mitochondrial
      copper content — in an allele-matched genetic background.
    limitations: >
      The null allele is embryonic lethal, so the human genotype range cannot be
      modeled across its full severity, and the viable allele-matched genotypes
      develop muscle weakness without the hypertrophic cardiomyopathy and fatal
      infantile course that define the human disease. See the
      HUMAN_MODEL_MISMATCH discussion.
    readouts:
    - name: Mitochondrial copper content
      target: SCO2 Loss and Defective Copper Delivery to COX
      direction: DECREASED
      interpretation: >
        Selective mitochondrial copper depletion without a fall in total tissue
        copper is the direct correlate of failed Sco2-mediated copper delivery.
      evidence:
      - reference: PMID:19837698
        reference_title: "Analysis of mouse models of cytochrome c oxidase deficiency owing to mutations in Sco2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "There was a concomitant reduction in mitochondrial copper content, but the total amount of copper in examined tissues was not reduced."
        explanation: Reports the mitochondrial-copper measurement behind this readout.
    evidence:
    - reference: PMID:19837698
      reference_title: "Analysis of mouse models of cytochrome c oxidase deficiency owing to mutations in Sco2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Whereas homozygous KO mice were embryonic lethals, homozygous KI and compound heterozygous KI/KO mice were viable, but had muscle weakness; biochemically, they had respiratory chain deficiencies as well as complex IV assembly defects in multiple tissues."
      explanation: Establishes that the allele-matched mouse reproduces the Complex IV assembly defect while diverging from the human phenotype.
treatments:
- name: Supportive and Metabolic Care
  description: >
    No curative therapy; supportive management of cardiomyopathy, lactic
    acidosis, and metabolic decompensation, including ventilatory and
    nutritional support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Copper-Histidine Supplementation
  description: >
    Mechanism-based copper-histidine (Cu-his) supplementation, rationalized by
    the SCO2 copper-delivery defect. Addition of copper-histidine to the culture
    medium fully rescued COX activity in SCO2-deficient patient myoblasts, and
    subcutaneous Cu-his was the most likely explanation for resolution of severe
    hypertrophic cardiomyopathy in a single reported patient. Evidence remains
    in vitro plus a single case; benefit is presumed to require treatment before
    irreversible injury in post-mitotic tissue.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: copper-histidine
      term:
        id: CHEBI:29036
        label: copper(2+)
  target_mechanisms:
  - target: SCO2 Loss and Defective Copper Delivery to COX
    treatment_effect: BYPASSES
    description: >
      Exogenous copper-histidine bypasses or supplements the failing
      Sco2-dependent copper-delivery step, restoring COX activity in patient
      cells.
    evidence:
    - reference: PMID:11751685
      reference_title: "Cytochrome c oxidase deficiency due to mutations in SCO2, encoding a mitochondrial copper-binding protein, is rescued by copper in human myoblasts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "COX activity in patient myoblasts was completely rescued by transduction with a retroviral vector expressing the human SCO2 coding sequence, and more interestingly by addition of copper-histidine (300 microM) to the culture medium."
      explanation: Direct in vitro demonstration that copper-histidine acts on the SCO2 copper-delivery lesion.
  evidence:
  - reference: PMID:11751685
    reference_title: "Cytochrome c oxidase deficiency due to mutations in SCO2, encoding a mitochondrial copper-binding protein, is rescued by copper in human myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whatever the mechanism, this result suggests a possible therapy for the early treatment of this fatal infantile disease."
    explanation: The authors propose early copper supplementation as a candidate therapy on the strength of the myoblast rescue.
  - reference: PMID:14970747
    reference_title: "Reversion of hypertrophic cardiomyopathy in a patient with deficiency of the mitochondrial copper binding protein Sco2: is there a potential effect of copper?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a patient with SCO 2 mutations and with resolution of severe hypertrophic cardiomyopathy."
    explanation: Single-patient report of cardiomyopathy resolution attributed to subcutaneous copper-histidine; anecdotal, hence PARTIAL.

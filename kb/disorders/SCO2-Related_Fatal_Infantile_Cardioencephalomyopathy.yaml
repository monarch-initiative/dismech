pathophysiology:
- name: SCO2 Loss and Defective Copper Delivery to COX
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  description: >
    Biallelic SCO2 variants impair copper delivery to the CuA center of COX2,
    preventing assembly of a catalytically competent Complex IV holoenzyme.
    Sco2 is a mitochondrial inner-membrane copper metallochaperone bearing a
    CxxxC metal-binding motif; loss of its chaperone function leaves the
    catalytic-core subunits unmetallated and destabilized, producing isolated
    COX deficiency that is most severe in striated muscle.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: SCO2 copper metallochaperone activity
    term:
      id: GO:0016531
      label: copper chaperone activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: copper ion transport
    term:
      id: GO:0006825
      label: copper ion transport
    modifier: DECREASED
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:10545952
    reference_title: "Fatal infantile cardioencephalomyopathy with COX deficiency and mutations in SCO2, a COX assembly gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we have identified mutations in the human homologue, SCO2, in three unrelated infants with a newly recognized fatal cardioencephalomyopathy and COX deficiency.
    explanation: Original identification of SCO2 mutations as the cause of fatal infantile cardioencephalomyopathy with COX deficiency.
  - reference: PMID:11751685
    reference_title: "Cytochrome c oxidase deficiency due to mutations in SCO2, encoding a mitochondrial copper-binding protein, is rescued by copper in human myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies on a yeast homolog have suggested that human Sco2 acts as a copper chaperone, transporting copper to the Cu(A) site on the Cox II subunit"
    explanation: Localizes the SCO2 lesion to the copper-delivery sub-step of Complex IV assembly (metallation of the CuA site on COX2).
  - reference: PMID:11751685
    reference_title: "Cytochrome c oxidase deficiency due to mutations in SCO2, encoding a mitochondrial copper-binding protein, is rescued by copper in human myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sco2 was severely reduced in patient fibroblasts and myoblasts by immunoblot analysis."
    explanation: Documents loss of Sco2 protein in patient cells as the proximal molecular defect.
  downstream:
  - target: Impaired Terminal Electron Transfer and ATP Synthesis
    causal_link_type: DIRECT
    description: Failure of CuA assembly yields a catalytically inactive enzyme.
- name: Impaired Terminal Electron Transfer and ATP Synthesis
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  biological_scale: CELLULAR
  description: >
    Loss of functional COX blocks electron transfer from cytochrome c to oxygen
    and proton pumping, collapsing oxidative ATP synthesis, with greatest impact
    on cardiac and skeletal muscle.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  - preferred_term: ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:10545952
    reference_title: "Fatal infantile cardioencephalomyopathy with COX deficiency and mutations in SCO2, a COX assembly gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mammalian cytochrome c oxidase (COX) catalyses the transfer of reducing equivalents from cytochrome c to molecular oxygen and pumps protons across the inner mitochondrial membrane.
    explanation: Defines the terminal electron-transfer and proton-pumping function lost in SCO2-related COX deficiency.
  - reference: PMID:29193756
    reference_title: "Investigating the cardiac pathology of SCO2-mediated hypertrophic cardiomyopathy using patients induced pluripotent stem cell-derived cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in SCO2 are among the most common causes of COX deficiency, resulting in reduced mitochondrial oxidative ATP production capacity, often leading to hypertrophic cardiomyopathy (HCM)."
    explanation: Patient iPSC-derived cardiomyocyte work links the SCO2 COX defect to reduced oxidative ATP production capacity and to the cardiac phenotype.
  downstream:
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy failure in cardiomyocytes drives hypertrophic cardiomyopathy.
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy deficit in the CNS produces the encephalopathy component of SCO2 cardioencephalomyopathy.
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: Impaired oxidative phosphorylation shifts pyruvate metabolism toward lactate accumulation, producing lactic acidosis.
  - target: Muscular hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Combined central and neuromuscular energy failure produces progressive muscular hypotonia.
  - target: Neurogenic muscular atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Anterior horn cell and motor neuron vulnerability produces a neurogenic, spinal-muscular-atrophy-like muscular atrophy.
  - target: Respiratory insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Respiratory muscle involvement and brainstem dysfunction lead to ventilatory failure, the most common terminal event.

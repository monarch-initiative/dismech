name: SCO2-Related Fatal Infantile Cardioencephalomyopathy
category: Mendelian
creation_date: "2026-05-30T00:00:00Z"
synonyms:
- SCO2 deficiency
- Fatal infantile cardioencephalomyopathy due to cytochrome c oxidase deficiency 1
- Cardioencephalomyopathy, fatal infantile, due to COX deficiency, SCO2-related
description: >
  SCO2-related fatal infantile cardioencephalomyopathy is a nuclear form of
  isolated cytochrome c oxidase (COX, Complex IV) deficiency caused by biallelic
  variants in SCO2, a copper-delivery metallochaperone required to assemble the
  CuA center of COX. Affected infants present with hypertrophic cardiomyopathy,
  encephalopathy, hypotonia, and lactic acidosis, and typically die in infancy.
  The recurrent p.E140K (c.1541G>A) allele is carried on at least one allele by
  nearly all reported patients, and genotype predicts course: compound
  heterozygosity for E140K with a null or truncating allele gives the severe
  neonatal cardioencephalomyopathic form, E140K homozygosity gives a
  delayed-onset Leigh-like course with prominent neurogenic (SMA-like) muscular
  atrophy, and E140K/p.M177T gives the mildest reported phenotype with survival
  to 2-4 years. The disorder conforms to the conserved Complex IV assembly
  deficiency mechanism, with the assembly defect localized to copper delivery
  and the dominant tissue involvement being cardiac.
disease_term:
  preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
  term:

- name: Sick Sinus Syndrome
  category: Cardiovascular
  description: >-
    The composite clinical syndrome of sinoatrial node dysfunction —
    inappropriate bradycardia, pauses, chronotropic incompetence and
    bradycardia-tachycardia alternation — which in SSS2 is the direct
    consequence of the pacemaker-current defect rather than of age-related
    nodal fibrosis.
  phenotype_term:
    preferred_term: Sick sinus syndrome
    term:
      id: HP:0011704
      label: Sick sinus syndrome
  evidence:

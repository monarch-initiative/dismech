    term:
      id: UBERON:0002351
      label: sinoatrial node
  evidence:
  - reference: PMID:16407510
    reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that sinus bradycardia in members of a large family was
      associated with a mutation in the gene coding for the pacemaker HCN4 ion
      channel.
    explanation: >-
      The founding family study links a heterozygous HCN4 variant to inherited
      sinus bradycardia.
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Synthesis and expression of the wild-type and mutant HCN4 channel on the
      plasma membrane tested in human embryonic kidney 293 cells using
      biotinylation and Western blot analysis demonstrated a reduction in
      synthesis and a trafficking defect in mutant compared with wild-type
      channels.
    explanation: >-
      Documents the synthesis/trafficking route to reduced channel availability
      for the pore-domain class of HCN4 alleles.
  - reference: PMID:26835093
    reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All mutations described so far are loss-of-function and in agreement with
      the role of funny channels, the predominant type of arrhythmia found is
      bradycardia.
    explanation: >-
      Confirms that the HCN4 disease alleles reported to date are uniformly
      loss-of-function.
  downstream:
  - target: Reduced Funny Current and Slowed Diastolic Depolarization
    causal_link_type: DIRECT
    description: >-
      Reduced channel availability, a hyperpolarizing shift of the activation
      curve, or dominant-negative suppression of wild-type subunits lowers the
      inward diastolic current carried by I_f.
    evidence:
    - reference: PMID:16407510
      reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutation associated with bradycardia is located near the cAMP-binding
        site; functional analysis found that mutant channels respond normally to
        cAMP but are activated at more negative voltages than are wild-type
        channels.
      explanation: >-
        Traces the step itself: the disease allele is shown by patch clamp to
        shift activation to more negative voltages, which is what reduces the
        current available during diastole.
    hypothesis_groups:
    - sinoatrial_automaticity_failure_model
  - target: Loss of cAMP-Dependent Rate Modulation
    causal_link_type: DIRECT
    description: >-
      Truncations that remove the cyclic-nucleotide-binding domain, and
      C-linker changes that alter its coupling to the gate, uncouple the
      pacemaker current from cAMP.
    evidence:
    - reference: PMID:12750403
      reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutant HCN4 protein (HCN4-573X) had a truncated C-terminus and lacked
        the cyclic nucleotide-binding domain.
      explanation: >-
        Establishes the structural half of the step, that the disease allele
        removes the domain through which cAMP acts.
    - reference: PMID:12750403
      reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Patch-clamp experiments showed that HCN4-573X channels mediated
        I(f)-like currents that were insensitive to increased cellular cAMP
        levels.
      explanation: >-
        Establishes the functional half: the truncated channel still carries
        current but no longer responds to cAMP, which is the loss this edge
        asserts.
  - target: Impaired Ventricular Trabecular Compaction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In several pedigrees the same HCN4 allele co-segregates with left
      ventricular noncompaction, implicating the channel in myocardial
      development; the intermediate steps are not established.
    evidence:
    - reference: PMID:25145517
      reference_title: "HCN4 mutations in multiple families with bradycardia and left ventricular noncompaction cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        our study provides the first evidence to our knowledge that mutations in
        this ion channel gene also may be associated with structural
        abnormalities of the myocardium
      explanation: >-
        The authors draw the link from the HCN4 allele to structural myocardial
        abnormality. The claim is co-segregation across pedigrees rather than a
        demonstrated developmental mechanism, which is why the edge is typed
        with unknown intermediates.
    - reference: PMID:25145518
      reference_title: "The symptom complex of familial sinus node dysfunction and myocardial noncompaction is associated with mutations in the HCN4 channel."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The symptom complex of SND and NCCM is associated with heritable HCN4
        defects.
      explanation: >-
        Independent replication of the same link in a separate German family
        series published alongside the first, which is what raises this from a
        single-pedigree observation to a reproducible association.
- name: Reduced Funny Current and Slowed Diastolic Depolarization
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The funny current I_f is the hyperpolarization-activated inward cation
    current that drives the early phase of spontaneous diastolic depolarization
    in sinoatrial node pacemaker cells. Mutant HCN4 channels activate at more
    negative voltages than wild-type channels, so at the diastolic potentials
    actually reached by a pacemaker cell less inward current flows. The
    diastolic depolarization slope falls, the interval to threshold lengthens,
    and the intrinsic firing rate of the node drops. The biophysical change has
    been described as mimicking mild vagal stimulation — a permanent,
    genetically imposed version of a physiological brake.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:

    explanation: >-
      Replication across three additional families establishes noncompaction as
      part of the HCN4 phenotype rather than a chance co-occurrence.
- name: Biventricular Noncompaction with Preserved Systolic Function
  category: Cardiovascular
  description: >-
    In noncompaction cohorts stratified by genotype, carriers of ion-channel
    gene mutations, HCN4 among them, have noncompaction of both ventricles and
    a preserved left ventricular ejection fraction, whereas noncompaction
    driven by sarcomeric and cytoskeletal genes is more often left-sided with
    depressed systolic function. The HCN4 arm is additionally distinguished
    within the ion-channel group by the accompanying low heart rate. This makes
    the combination of biventricular involvement, preserved ejection fraction
    and bradycardia a genotype-suggestive pattern rather than an incidental
    imaging description.
  phenotype_term:
    preferred_term: Biventricular noncompaction cardiomyopathy
    term:
      id: HP:0012818
      label: Biventricular noncompaction cardiomyopathy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34088380
    reference_title: "Phenotype/Genotype Relationship in Left Ventricular Noncompaction: Ion Channel Gene Mutations Are Associated With Preserved Left Ventricular Systolic Function and Biventricular Noncompaction: Phenotype/Genotype of Noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      we found that those patients had higher median LV ejection fraction (60%
      vs 40%; P < .001) and more biventricular noncompaction (53.1% vs 18.5%; P
      < .001) than the 81 other patients with LVNC
    explanation: >-
      Quantifies the preserved ejection fraction and the biventricular
      distribution. The 53.1% is the share among ion-channel-mutation
      noncompaction patients, that is, conditioned on already having
      noncompaction, not the share among SSS2 carriers. Since noncompaction
      itself is banded FREQUENT at 50% of HCN4 carriers, the implied share of
      all carriers is roughly a quarter, which is why this phenotype is banded
      OCCASIONAL.
  - reference: PMID:34088380
    reference_title: "Phenotype/Genotype Relationship in Left Ventricular Noncompaction: Ion Channel Gene Mutations Are Associated With Preserved Left Ventricular Systolic Function and Biventricular Noncompaction: Phenotype/Genotype of Noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      both the 19 patients with an HCN4 mutation and the 11 patients with an
      RYR2 mutation presented with a higher LV ejection fraction and more
      frequent biventricular noncompaction than the 81 patients with LVNC but
      with no mutation in the ion channel gene, but only patients with HCN4
      mutation presented with a lower heart rate
    explanation: >-
      Confirms the direction of the effect in the 19 HCN4 carriers taken on
      their own, and adds the bradycardia that separates HCN4 from RYR2 within
      the ion-channel group. It gives a direction rather than an
      HCN4-specific percentage, so the band above is not derived from it.
- name: Mitral Valve Prolapse
  category: Cardiovascular
  description: >-
    Billowing of one or both mitral leaflets into the left atrium, reported
    within the extended HCN4 phenotype alongside the aortic and valvular
    findings. Like the aortic dilatation, it sits in the structural rather than
    the electrical arm of the disease and has no established mechanistic link
    to the pacemaker current. Like the prolonged QT interval, it is left
    unconnected in the causal graph rather than attached to the trabecular
    compaction node, since valve and trabecular development are separate
    programmes and nothing reported here links them.
  phenotype_term:
    preferred_term: Mitral valve prolapse
    term:
      id: HP:0001634
      label: Mitral valve prolapse
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more recently, a more complex phenotype has emerged, including primarily
      noncompaction cardiomyopathy (NCC), aortic dilatation but also mitral
      valve defects, early-onset atrial fibrillation, atrioventricular block,
      and ventricular tachycardia
    explanation: >-
      Places mitral valve disease in the extended HCN4 phenotype spectrum
      alongside the noncompaction and aortic findings already curated here.
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a mildly dysplastic aortic valve with mild central regurgitation and no
      stenosis and mild mitral valve prolapse
    explanation: >-
      Documents mitral valve prolapse directly in a p.Gly482Arg carrier, giving
      an individual observation behind the spectrum statement above. The
      frequency is banded OCCASIONAL because it is reported in individual
      carriers rather than counted in any cohort.
- name: Dilatation of the Ascending Aorta
  category: Cardiovascular
  description: >-
    Enlargement of the ascending aorta beyond a body-surface-area-indexed
    z-score of 2, reported alongside noncompaction and bradycardia in HCN4
    families. The mechanism connecting the pacemaker channel to the aortic wall
    is unknown, and this feature is not part of the classical SSS2 description.
  phenotype_term:
    preferred_term: Dilatation of the ascending aorta
    term:
      id: HP:0004970
      label: Ascending tubular aorta aneurysm
  evidence:
  - reference: PMID:35328031
    reference_title: "Clinical Presentation of Left Ventricular Noncompaction Cardiomyopathy and Bradycardia in Three Families Carrying HCN4 Pathogenic Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The HCN4 molecular variants influence the presence of a complex LVNC
      phenotype, sinus bradycardia and dilation of the ascending aorta.
    explanation: >-
      Reports ascending aortic dilation in HCN4 families. The HPO binding is
      exact rather than approximate — "Dilatation of ascending aorta" is an
      EXACT synonym of HP:0004970, and the source measured the ascending aorta
      in the parasternal long-axis view indexed to body surface area, the same
      segment the term names. The series is small (six patients, four
      families) and the mechanism linking the pacemaker channel to the aortic
      wall is unknown, so the association is better established than its
      explanation.
- name: Syncope
  category: Neurologic
  description: >-
    Transient loss of consciousness from abrupt cerebral hypoperfusion during a
    prolonged sinus pause or severe bradycardia. Syncope is the usual
    symptomatic presentation that leads to device therapy in SSS2, but many
    carriers ascertained through family screening never have an episode.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 50% of patients present with cerebral hypoperfusion (e.g., syncope,
      presyncope, lightheadedness, cerebrovascular accident).
    explanation: >-
      Syncope is a direct manifestation of the cerebral hypoperfusion caused by
      sinus node dysfunction.
- name: Atrioventricular Block
  category: Cardiovascular
  description: >-
    Impaired conduction from atria to ventricles. HCN4 is expressed throughout
    the cardiac conduction system, not only in the sinoatrial node, and AV block
    is part of the reported funny-channel arrhythmia spectrum, though it is much
    less consistent than the sinus-node phenotype.
  phenotype_term:
    preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  evidence:
  - reference: PMID:26835093
    reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Funny channel-linked arrhythmias, however, also include atrioventricular
      (AV) block and atrial fibrillation, in agreement with an emerging new
      concept according to which defective funny channels have a still
      unexplored role in impairing AV conduction and triggering atrial
      fibrillation.
    explanation: >-
      A review places AV block in the HCN4 arrhythmia spectrum. The review
      itself describes the AV-conduction role as an emerging and still
      unexplored concept, so this is the weakest arm of the phenotype.
genetic:
- name: HCN4 loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: HCN4
    term:
      id: hgnc:16882
      label: HCN4
  features: >-
    Heterozygous loss-of-function variants in HCN4 are the sole established
    cause of SSS2. Reported alleles include pore-domain missense changes (G480R,
    G482R), C-linker and cyclic-nucleotide-binding-domain changes (K530N, S672R,
    D553N), C-terminal truncations (573X, 695X), and canonical splice-donor
    changes (c.1737+1 G>T). Loss of function is achieved by a hyperpolarizing
    shift in the voltage dependence of activation, by reduced channel synthesis
    and defective trafficking, or by loss of cAMP responsiveness; most alleles
    additionally suppress wild-type subunits within the heterotetramer. P883R is
    the one curated allele that does not follow this pattern: it shifts
    activation in the opposite direction and raises current density, and whether
    it causes SSS2 at all is disputed, so it is not counted among the
    established causes above.
  case_fractions:
  - population: 38 unrelated familial sick sinus syndrome families, genetic screening cohort
    case_fraction_percent: 5.3
    cohort_size: 38
    notes: >-
      Two of 38 unrelated familial SSS families carried an HCN4
      loss-of-function variant (three carried SCN5A), so HCN4 accounts for a
      minority of familial sick sinus syndrome overall even though it defines
      SSS2.
    evidence:
    - reference: PMID:28104484
      reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We genetically screened 38 unrelated SSS families and functionally
        analyzed the mutant SCN5A and HCN4 channels by patch clamping.
      explanation: >-
        Gives the denominator (38 unrelated familial SSS families) for the HCN4
        case fraction.
    - reference: PMID:28104484
      reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified two HCN4 and three SCN5A loss-of-function mutations in our
        familial SSS cohort.
      explanation: >-
        Gives the numerator (two HCN4 families) for the HCN4 case fraction.
  - population: Mutation-positive familial sick sinus syndrome probands
    case_fraction_percent: 33.3
    cohort_size: 48
    notes: >-
      HCN4 accounted for 16 of the 48 gene-positive familial sick sinus
      syndrome probands pooled in this meta-analysis, with SCN5A accounting for
      the other 32. Study design: meta-analysis pooling the authors' own cohort
      with previously reported probands. The denominator differs from the 5.3%
      record above and the two are not alternative estimates of the same
      quantity: that record counts HCN4 among all screened familial SSS
      families, whether or not a causal variant was found, while this one
      counts HCN4 only among families in which one was.
    evidence:
    - reference: PMID:28104484
      reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also evaluated the clinical features of familial SSS by a
        meta-analysis of 48 SSS probands with mutations in HCN4 (n = 16) and
        SCN5A (n = 32), including previously reported cases, and 538 sporadic
        SSS cases.
      explanation: >-
        Gives both the numerator (16 HCN4 probands) and the denominator (48
        mutation-positive familial probands) behind the recorded share.
  - population: Children with isolated left ventricular noncompaction
    case_fraction_percent: 12.9
    cohort_size: 31
    notes: >-
      HCN4 was the single most frequent causal gene in this paediatric
      noncompaction cohort, 4 of 31 patients. Study design: prospective
      recruitment at a single paediatric reference centre with panel or exome
      sequencing. The cohort is ascertained through the structural phenotype
      rather than through bradycardia, and the report does not state whether
      the four HCN4-positive children had sinus node dysfunction, so this
      measures how often an HCN4 variant underlies childhood noncompaction
      rather than how often SSS2 does.
    evidence:
    - reference: PMID:35893073
      reference_title: "Genetic Profile of Left Ventricular Noncompaction Cardiomyopathy in Children-A Single Reference Center Experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Thirty-one paediatric patients prospectively diagnosed with LVNC by
        echocardiography and cardiovascular magnetic resonance examination were
        recruited into the study group.
      explanation: >-
        Establishes the denominator of 31 prospectively recruited paediatric
        noncompaction patients. The step to SSS2 is an inference because the
        cohort is defined by noncompaction rather than by sinus node
        dysfunction.
    - reference: PMID:35893073
      reference_title: "Genetic Profile of Left Ventricular Noncompaction Cardiomyopathy in Children-A Single Reference Center Experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The most frequent defects in our cohort were found in the genes HCN4 (n
        = 4), MYH7 (n = 2) and PRDM16 (n = 2).
      explanation: >-
        Gives the numerator of 4 HCN4-positive children and establishes HCN4 as
        the leading gene in this cohort, again through the noncompaction
        ascertainment rather than a bradycardia one.
  - population: Adults with isolated left ventricular noncompaction
    cohort_size: 95
    notes: >-
      No percentage is recorded because the source ranks genes without giving a
      per-patient count for HCN4: it reports 52 pathogenic or probably
      pathogenic variants in 40 of 95 patients and then ranks the genes, without
      stating which denominator the ranking uses. Study design: prospective
      cohort of 95 unrelated adults screened across 107 cardiomyopathy and
      arrhythmia genes. The ordinal result is still informative, and it is
      recorded because it replicates the paediatric finding in adults: HCN4
      ranked second only to TTN among the causal genes of adult isolated
      noncompaction.
    evidence:
    - reference: PMID:30471092
      reference_title: "Targeted panel sequencing in adult patients with left ventricular non-compaction reveals a large genetic heterogeneity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The most prevalent genes were TTN, then HCN4, MYH7, and RYR2.
      explanation: >-
        Ranks HCN4 second among causal genes in a 95-patient adult noncompaction
        cohort. As with the paediatric record, the ascertainment is structural
        rather than electrical, so the step to SSS2 is an inference.
  variants:
  - name: HCN4 p.Ser672Arg
    description: >-
      Missense change near the cyclic-nucleotide-binding site, identified in a
      large familial sinus bradycardia pedigree. Mutant channels retain a normal
      response to cAMP but activate at more negative voltages than wild-type,
      reducing the inward diastolic current.
    functional_effects:
    - function: hyperpolarizing shift of activation voltage
      description: >-
        Activation is displaced to more negative potentials while cAMP
        responsiveness is retained, so less current flows during diastole at any
        given membrane potential.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:16407510
      reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutation associated with bradycardia is located near the
        cAMP-binding site; functional analysis found that mutant channels
        respond normally to cAMP but are activated at more negative voltages
        than are wild-type channels.
      explanation: >-
        Characterizes the gating-shift mechanism of this allele.
  - name: HCN4 573X (c.1631delC)
    description: >-
      Heterozygous single-base deletion in exon 5 producing a C-terminally
      truncated subunit that lacks the cyclic-nucleotide-binding domain.
      Trafficking is normal, but the resulting current is cAMP-insensitive and
      the subunit exerts a dominant-negative effect on wild-type channels.
    functional_effects:
    - function: loss of cAMP-dependent gating
      description: >-
        Truncation removes the cyclic-nucleotide-binding domain, so the channel
        still reaches the membrane and conducts but no longer responds to cAMP. The
        subunit also suppresses wild-type current in co-expression.
      type: dominant-negative
    - function: loss of cAMP-dependent acceleration of the pacemaker current
      description: >-
        The direction of effect, recorded alongside the dominant-negative
        mechanism above: the net result is less cAMP-responsive I_f than a
        wild-type heterotetramer would carry.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:12750403
      reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a candidate gene approach, a heterozygous 1-bp deletion (1631delC) in
        exon 5 of the human HCN4 gene was detected in a patient with idiopathic
        SND.
      explanation: >-
        Identifies the truncating allele in the index patient with idiopathic
        sinus node dysfunction.
    - reference: PMID:12750403
      reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutant HCN4 protein (HCN4-573X) had a truncated C-terminus and
        lacked the cyclic nucleotide-binding domain.
      explanation: >-
        Establishes the structural basis for the loss of cAMP responsiveness.
  - name: HCN4 695X
    description: >-
      C-terminal truncating allele reported in a family with the combined sinus
      node dysfunction and noncompaction phenotype, in the same series that
      described G482R and P883R. It is grouped with 573X as a truncation, but
      unlike 573X it has not been characterised electrophysiologically in the
      cited work, so its consequence is inferred from the variant class and the
      family phenotype rather than measured.
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    functional_effects:
    - function: reduced pacemaker current
      description: >-
        Inferred from the C-terminal truncating class and from the segregating
        phenotype, not from a functional assay: no patch-clamp characterisation
        of this allele is presented in the cited report.
      type: loss-of-function
    evidence:
    - reference: PMID:25145518
      reference_title: "The symptom complex of familial sinus node dysfunction and myocardial noncompaction is associated with mutations in the HCN4 channel."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, different truncation (695X) and missense (P883R) HCN4
        mutations segregated with a similar combined phenotype in an
        additional, unrelated family and a single unrelated proband
        respectively, which both lacked CSRP3-W4R.
      explanation: >-
        Establishes the allele, its truncating class, and its co-segregation
        with the combined sinus node dysfunction and noncompaction phenotype in
        an unrelated family.
  - name: HCN4 p.Gly480Arg
    description: >-
      Pore-domain missense change segregating with autosomal dominant isolated
      sinus node dysfunction in a 16-member family. Reduces channel synthesis
      and membrane trafficking and shifts activation to more negative voltages,
      yet carries a benign long-term course.
    functional_effects:
    - function: reduced channel synthesis and membrane trafficking
      description: >-
        Less channel protein is made and reaches the surface, and what does
        activate does so at more negative potentials.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:17646576
      reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Direct sequencing of the exons encoding HCN4 revealed a missense
        mutation, G480R, in the ion channel pore domain in all affected family
        members.
      explanation: >-
        Establishes complete co-segregation of the pore-domain allele with the
        affected status.
  - name: HCN4 p.Gly482Arg
    description: >-
      Pore-domain missense change segregating with the combined sinus node
      dysfunction and biventricular noncompaction phenotype. Mutant subunits are
      nonfunctional and dominant-negative on wild-type current.
    functional_effects:
    - function: nonfunctional pore with suppression of wild-type current
      description: >-
        Homomeric mutant channels carry no current, and the subunit suppresses
        wild-type current when the two are co-expressed.
      type: dominant-negative
    - function: reduced pacemaker current
      description: >-
        The direction of effect, recorded alongside the dominant-negative
        mechanism above: nonfunctional subunits assembling into the
        heterotetramer leave less current than a wild-type channel carries.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:25145518
      reference_title: "The symptom complex of familial sinus node dysfunction and myocardial noncompaction is associated with mutations in the HCN4 channel."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        HCN4-G482R is located in the highly conserved channel pore domain.
        Mutant subunits were nonfunctional and exerted dominant-negative effects
        on wild-type current.
      explanation: >-
        Characterizes the dominant-negative loss-of-function mechanism of this
        allele.
  - name: HCN4 p.Lys530Asn
    description: >-
      C-linker missense change identified by screening 422 patients with
      tachyarrhythmias. Homomeric mutant channels behave almost like wild-type;
      the loss of function appears only in heteromeric mutant/wild-type
      channels, which show a hyperpolarizing shift of half-maximal activation —
      the biophysical situation of a heterozygous carrier.
    functional_effects:
    - function: heteromer-restricted hyperpolarizing shift of activation
      description: >-
        Homomeric mutant channels are close to wild-type; the shift in half-maximal
        activation appears only in mutant/wild-type heteromers, which is the
        configuration a heterozygous carrier actually has.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:23178648
      reference_title: "Altered HCN4 channel C-linker interaction is associated with familial tachycardia-bradycardia syndrome and atrial fibrillation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In a candidate gene approach, we screened 422 patients with atrial
        and/or ventricular tachyarrhythmias and detected a novel HCN4 gene
        mutation that replaced the positively charged lysine 530 with an
        asparagine (HCN4-K530N) in a highly conserved region of the C-linker.
      explanation: >-
        Identifies the C-linker allele and the screening context in which it was
        found.
  - name: HCN4 p.Asp553Asn
    description: >-
      Missense change in the C-linker region that reduces the amount of channel
      reaching the membrane. It is the worked example of the trafficking class
      of HCN4 allele, and it acts dominant-negatively on the wild-type subunit
      rather than by simple loss of one copy. The index carrier had recurrent
      syncope with a prolonged QT interval and torsade de pointes as well as
      sinus node dysfunction, so this allele's reported phenotype reaches
      repolarisation and ventricular arrhythmia as well as impulse generation.
    functional_effects:
    - function: trafficking defect reducing surface channel
      description: >-
        Less channel reaches the membrane, lowering I_f, and the mutant subunit acts
        dominant-negatively rather than by simple loss of one copy.
      type: dominant-negative
    - function: reduced surface pacemaker current
      description: >-
        The direction of effect, recorded alongside the dominant-negative
        mechanism above: less channel at the membrane means less I_f.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:15123648
      reference_title: "Functional characterization of a trafficking-defective HCN4 mutation, D553N, associated with cardiac arrhythmia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro functional study of the D553N mutation showed a reduced
        membranous expression associated with decreased If currents because of a
        trafficking defect of the HCN4 channel in a dominant-negative manner.
      explanation: >-
        Establishes both the mechanism class, defective trafficking, and the
        dominant-negative mode of action of this allele.
    - reference: PMID:15123648
      reference_title: "Functional characterization of a trafficking-defective HCN4 mutation, D553N, associated with cardiac arrhythmia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A missense mutation, D553N, was found in a patient with sinus node
        dysfunction who showed recurrent syncope, QT prolongation in
        electrocardiogram, and polymorphic ventricular tachycardia, torsade de
        pointes.
      explanation: >-
        Gives the carrier phenotype, which extends beyond the sinus node to
        repolarization and ventricular arrhythmia.
  - name: HCN4 p.Pro883Arg
    description: >-
      C-terminal missense change that does not fit the loss-of-function pattern
      the rest of these alleles follow. It segregated with the combined sinus
      node dysfunction and noncompaction phenotype in one proband, but when
      characterised functionally it shifted activation to more depolarised
      potentials and, co-expressed with wild-type subunits as in a
      heterozygote, produced higher rather than lower current density. It is
      also common enough (minor allele frequency around 0.9%) that it cannot
      be a fully penetrant cause on its own. The authors of the functional
      study read it as a modifier acting with a common KCNE1 variant to favour
      atrial fibrillation and tachycardia-induced cardiomyopathy, rather than
      as an SSS2 allele. Both readings stand in the literature and neither has
      been withdrawn.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    functional_effects:
    - function: depolarizing shift of activation with increased current density
      description: >-
        The opposite direction from every other allele in this entry. Activation
        moves to more depolarised potentials and deactivation is faster; in the
        heterozygous configuration, co-expressed with wild type, current density is
        higher than wild type rather than lower. This is why the statement that
        every reported HCN4 disease allele is loss-of-function does not hold for
        this one.
      type: gain-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:25145518
      reference_title: "The symptom complex of familial sinus node dysfunction and myocardial noncompaction is associated with mutations in the HCN4 channel."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, different truncation (695X) and missense (P883R) HCN4
        mutations segregated with a similar combined phenotype in an
        additional, unrelated family and a single unrelated proband
        respectively, which both lacked CSRP3-W4R.
      explanation: >-
        The observation that puts P883R in this entry at all: it segregated
        with the combined sinus node dysfunction and noncompaction phenotype in
        an unrelated proband.
    - reference: PMID:31481236
      reference_title: "The C-terminal HCN4 variant P883R alters channel properties and acts as genetic modifier of atrial fibrillation and structural heart disease."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: >-
        Co-transfection of WT and mutant subunits, resembling the heterozygous
        cellular situation of our patients, revealed significantly higher
        current densities compared to WT.
      explanation: >-
        Contradicts the loss-of-function reading for this particular allele.
        Reconstructed in the heterozygous configuration, P883R raises rather
        than lowers current density, which is the opposite of the mechanism
        every other allele in this entry works by.
    - reference: PMID:31481236
      reference_title: "The C-terminal HCN4 variant P883R alters channel properties and acts as genetic modifier of atrial fibrillation and structural heart disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together with the common KCNE1 variant S38G, previously proposed as a
        genetic modifier of AF, HCN4-P883R may provide a substrate for the
        development of AF and TIC.
      explanation: >-
        States the modifier reading the functional study reaches, which is the
        alternative to treating this as an SSS2 allele.
  - name: HCN4 c.1737+1 G>T (splice site)
    description: >-
      Canonical splice-donor variant segregating in a large bradycardia family
      with a two-point LOD score of 4.87. Its interest is that the family was
      characterised by Holter and exercise testing rather than by patch clamp,
      so it supplies the quantitative human chronotropic phenotype: carriers
      reach lower peak heart rates, have a reduced heart rate reserve, and show
      increased short-term heart rate variability even after normalisation for
      rate.
    functional_effects:
    - function: canonical splice-donor disruption
      description: >-
        A canonical +1 splice-donor change, so the functional consequence is inferred
        from the variant class and the family's bradycardia phenotype rather than
        measured: this allele was characterised clinically, not by patch clamp.
      type: loss-of-function
    gene:
      preferred_term: HCN4
      term:
        id: hgnc:16882
        label: HCN4
    evidence:
    - reference: PMID:28465117
      reference_title: "A novel 'splice site' HCN4 Gene mutation, c.1737+1 G>T, causes familial bradycardia, reduced heart rate response, impaired chronotropic competence and increased short-term heart rate variability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A novel c.1737+1 G>T 'splice-site' HCN4 mutation was identified in a
        large family with familial bradycardia which co-segregated with the
        disease providing a two-point LOD score of 4.87.
      explanation: >-
        Establishes the allele and the strength of its co-segregation with
        bradycardia in the family.
  evidence:
  - reference: PMID:26835093
    reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All mutations described so far are loss-of-function and in agreement with
      the role of funny channels, the predominant type of arrhythmia found is
      bradycardia.
    explanation: >-
      Confirms the uniform loss-of-function direction of HCN4 disease alleles,
      which holds for every allele curated here except P883R.
  - reference: PMID:31481236
    reference_title: "The C-terminal HCN4 variant P883R alters channel properties and acts as genetic modifier of atrial fibrillation and structural heart disease."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Patch-clamp recordings of HCN4-P883R channels expressed in HEK293 cells
      showed remarkable alterations of channel properties shifting the
      half-maximal activation voltage to more depolarized potentials, while
      channel deactivation was faster compared to wild-type (WT).
    explanation: >-
      The counterexample to the uniform loss-of-function statement above. A
      depolarising shift of the activation curve increases channel availability
      at diastolic potentials, the opposite of the hyperpolarising shift the
      loss-of-function alleles produce.
  - reference: PMID:16407510
    reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, diminished function of pacemaker channels is linked to familial
      bradycardia.
    explanation: >-
      States the gene-disease relationship established by the founding pedigree.
animal_models:
- name: hHCN4-573X inducible cardiac transgenic mouse
  species: Mouse
  genotype: heart-specific, inducible expression of the human HCN4-573X allele
  description: >-
    Mice engineered for heart-specific, inducible expression of the human
    truncating HCN4-573X allele found in the index SSS2 patient. The model
    isolates the cAMP-insensitivity arm of the human mechanism.
  publication: PMID:19570998
  modeled_mechanisms:
  - target: Loss of cAMP-Dependent Rate Modulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Expression of the human disease allele eliminates cAMP sensitivity of I_f
      in sinoatrial node cells and lowers resting and maximal heart rate, the
      mechanism proposed for the human carrier.
    limitations: >-
      The transgene is expressed heart-wide and inducibly rather than as a
      germline heterozygous allele, and murine sinoatrial physiology operates at
      a resting rate roughly an order of magnitude faster than human. The model
      also shows that relative rate adaptation during exercise is preserved, so
      it does not reproduce chronotropic incompetence as completely as the human
      case report implies.
    readouts:
    - name: cAMP sensitivity of I_f in sinoatrial node pacemaker cells
      target: Loss of cAMP-Dependent Rate Modulation
      direction: ABOLISHED
      interpretation: >-
        Direct molecular readout of the proposed human mechanism.
      evidence:
      - reference: PMID:19570998
        reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that hHCN4-573X expression causes elimination of the cAMP
          sensitivity of I(f) and decreases the maximum firing rates of SAN
          pacemaker cells.
        explanation: >-
          Reports elimination of cAMP sensitivity and reduced maximal pacemaker
          firing rate.
    - name: Heart rate in conscious mice at rest and during exercise
      target: Loss of cAMP-Dependent Rate Modulation
      direction: DECREASED
      interpretation: >-
        Whole-animal correlate of the human resting bradycardia and blunted
        maximal rate.
      evidence:
      - reference: PMID:19570998
        reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In conscious mice, hHCN4-573X expression leads to a marked reduction
          in heart rate at rest and during exercise.
        explanation: >-
          Direct in vivo measurement of the bradycardic phenotype.
    evidence:
    - reference: PMID:19570998
      reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data also reveal the pathophysiologic mechanism of hHCN4-573X-linked
        SAN dysfunction in humans.
      explanation: >-
        The authors state explicitly that the model is informative for the human
        HCN4-573X sinoatrial node dysfunction mechanism.
  evidence:
  - reference: PMID:19570998
    reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated mice with heart-specific and inducible expression of a human
      HCN4 mutation (573X) that abolishes the cAMP-dependent regulation of HCN
      channels
    explanation: >-
      Establishes that the model carries the human SSS2 allele itself rather
      than a species-matched surrogate, which is what makes it informative for
      this entry.
- name: Inducible cardiac-specific HCN4 knockout mouse (ciHCN4-KO)
  species: Mouse
  genotype: inducible, cardiac-specific Hcn4 ablation in the adult
  description: >-
    Adult-onset, cardiac-specific ablation of Hcn4, which removes rather than
    alters the pacemaker channel. Establishes that HCN4 is required for normal
    impulse generation in the adult heart.
  publication: PMID:21220308
  modeled_mechanisms:
  - target: Sinoatrial Node Automaticity Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ablation reduces I_f and the spontaneous rate of isolated sinoatrial node
      myocytes and produces severe bradycardia in vivo, confirming that loss of
      HCN4 function is sufficient to depress nodal automaticity.
    limitations: >-
      Complete ablation of both alleles in the adult heart is a far more severe
      lesion than the heterozygous, partially functional channels of human SSS2:
      the mice progress to atrioventricular block, cardiac arrest and death
      within days, an outcome not seen in HCN4 carriers, so the model overstates
      severity and adds an AV-conduction phenotype not characteristic of the
      human disease.
    readouts:
    - name: HCN4 protein expression in sinoatrial node tissue and cells
      target: Sinoatrial Node Automaticity Failure
      direction: DECREASED
      interpretation: >-
        Confirms the molecular lesion underlying the depressed nodal
        automaticity measured in the same animals.
      evidence:
      - reference: PMID:21220308
        reference_title: "Deep bradycardia and heart block caused by inducible cardiac-specific knockout of the pacemaker channel gene Hcn4."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In agreement with functional results, immunofluorescence and Western
          blot analysis showed reduced expression of HCN4 protein in SAN tissue
          and cells.
        explanation: >-
          Confirms loss of HCN4 protein in sinoatrial node tissue accompanying
          the functional deficit.
    evidence:
    - reference: PMID:21220308
      reference_title: "Deep bradycardia and heart block caused by inducible cardiac-specific knockout of the pacemaker channel gene Hcn4."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data show that cardiac HCN4 channels are essential for normal heart
        impulse generation and conduction in adult mice and support the notion
        that dysfunctional HCN4 channels can be a direct cause of rhythm
        disorders.
      explanation: >-
        States that the model supports dysfunctional HCN4 channels as a direct
        cause of rhythm disorders, the claim this entry makes for SSS2.
  evidence:
  - reference: PMID:21220308
    reference_title: "Deep bradycardia and heart block caused by inducible cardiac-specific knockout of the pacemaker channel gene Hcn4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ablation of HCN4 consistently leads to progressive development of severe
      bradycardia
    explanation: >-
      Establishes the model's core phenotype, progressive severe bradycardia on
      loss of HCN4, which is the reason it is used here as the loss-of-function
      reference point.
experimental_models:
- name: Patient-derived hiPSC lines carrying a heterozygous and a homozygous HCN4 variant (UKMi009-A, UKMi011-A)
  description: >-
    Two human induced pluripotent stem cell lines reprogrammed from members of
    a consanguineous family with sinus node dysfunction, one carrying the
    familial HCN4 variant heterozygously and the other homozygously. The pair
    is a gene-dose series in the patients' own genetic background and at the
    native locus, which is the closest available human substrate for the SSS2
    lesion. As published, the lines are characterised only for pluripotency
    (karyotype, marker expression, three-germ-layer differentiation); no
    cardiomyocyte electrophysiology is reported, so nothing yet establishes
    that they reproduce the funny-current deficit.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: >-
    Reprogrammed somatic cells from two members of a consanguineous family with
    inherited sinus node dysfunction.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:40414080
  modeled_mechanisms:
  - target: HCN4 Loss-of-Function Variant
    relationship: PERTURBS
    fidelity: UNKNOWN
    description: >-
      The lines carry the family's own HCN4 variant at the endogenous locus in
      one and two copies, instantiating the genetic lesion of this node as a
      dose series rather than as an overexpressed construct.
    limitations: >-
      The family is consanguineous and the report does not say which members
      are affected, so it is not established that the heterozygous carrier has
      the disease; in a consanguineous pedigree segregating a homozygous allele
      the heterozygote may well be an unaffected carrier. Neither line is
      therefore known to instantiate the dominant heterozygous genotype of
      SSS2, and the homozygous state has no counterpart in it at all. The
      report also does not characterise the variant as loss-of-function: the
      link to this node rests on the gene, not on a demonstrated functional
      consequence. The publication reports pluripotency characterisation alone,
      with no cardiomyocyte differentiation, no I_f recording and no beating
      rate, so the functional fidelity of the model is untested rather than
      moderate or high.
    evidence:
    - reference: PMID:40414080
      reference_title: "Generation of human induced pluripotent stem cell (hiPSC) lines (UKMi009-A and UKMi011-A) harboring a homozygous and heterozygous HCN4 variant from a family with inherited sinus node dysfunction (SND)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we generated two hiPSC lines from a consanguineous family with SND
        where the HCN4 variant was either present in heterozygous or homozygous
        state.
      explanation: >-
        Establishes that the lines carry the patient HCN4 variant in a
        gene-dose series, which is the perturbation this link records.
    - reference: PMID:40414080
      reference_title: "Generation of human induced pluripotent stem cell (hiPSC) lines (UKMi009-A and UKMi011-A) harboring a homozygous and heterozygous HCN4 variant from a family with inherited sinus node dysfunction (SND)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both cell lines exhibited normal karyotype, cell morphology, hiPSC
        marker expression, and differentiation into all three germ layers,
        confirmed by immunofluorescence staining.
      explanation: >-
        The reported characterisation stops at pluripotency, which is why the
        fidelity of this link is recorded as UNKNOWN rather than asserted.
  evidence:
  - reference: PMID:40414080
    reference_title: "Generation of human induced pluripotent stem cell (hiPSC) lines (UKMi009-A and UKMi011-A) harboring a homozygous and heterozygous HCN4 variant from a family with inherited sinus node dysfunction (SND)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Generated hiPSCs enable further cardiomyocyte cell differentiation to
      provide unique patient-derived SND in-vitro disease models in a gene-dose
      dependent manner.
    explanation: >-
      The authors state the intended use of the lines as patient-derived sinus
      node dysfunction disease models, which is the basis for listing them here.
- name: hiPSC-derived pacemaker cardiomyocytes as a human I_f measurement platform
  description: >-
    Human induced pluripotent stem cell-derived cardiomyocytes differentiated
    toward a pacemaker phenotype and characterised by patch clamp across
    differentiation time. The cells express HCN4 as the dominant HCN isoform
    together with the accessory subunits that shape I_f in situ, and their
    diastolic depolarisation responds to adrenergic and muscarinic agonists.
    This is a wild-type platform rather than an SSS2 model: it supplies the
    human measurement context against which a variant line's funny current
    would be interpreted.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: hiPSC-derived sinoatrial-node-like pacemaker cardiomyocyte
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  publication: PMID:33934225
  modeled_mechanisms:
  - target: Reduced Funny Current and Slowed Diastolic Depolarization
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides direct patch-clamp measurement of I_f and of its autonomic
      modulation in human pacemaker-like cardiomyocytes, the quantity whose
      reduction defines this node.
    limitations: >-
      The cells are wild type, so they establish the measurement context rather
      than the disease state. Their I_f properties drift with differentiation
      time, activating at more negative potentials after day 30, and basal cAMP
      is low enough that the muscarinic response is small unless the cells are
      pre-stimulated, so absolute values are not directly comparable with adult
      human sinoatrial node myocytes.
    readouts:
    - name: Funny current density and voltage dependence of activation
      target: Reduced Funny Current and Slowed Diastolic Depolarization
      direction: ALTERED
      interpretation: >-
        The measurement that a variant line would be compared against; in
        wild-type cells it shifts negative and slows with time in culture.
      evidence:
      - reference: PMID:33934225
        reference_title: "A detailed characterization of the hyperpolarization-activated \"funny\" current (I(f)) in human-induced pluripotent stem cell (iPSC)-derived cardiomyocytes with pacemaker activity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Patch-clamp analysis showed that If density did not change during
          differentiation; however, after day 30, it activates at more negative
          potential and with slower time constants.
        explanation: >-
          Reports the direct I_f measurement and its time dependence in the
          platform.
    - name: Beating rate response to adrenergic and muscarinic agonists
      target: Reduced Funny Current and Slowed Diastolic Depolarization
      direction: INCREASED
      interpretation: >-
        Confirms that the autonomic arm of pacemaking, the arm lost in
        cAMP-insensitive HCN4 alleles, is measurable in this platform.
      evidence:
      - reference: PMID:33934225
        reference_title: "A detailed characterization of the hyperpolarization-activated \"funny\" current (I(f)) in human-induced pluripotent stem cell (iPSC)-derived cardiomyocytes with pacemaker activity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The adrenergic agonist isoproterenol induced rate acceleration and a
          positive shift of If voltage-dependence (EC50 73.4 nM).
        explanation: >-
          Demonstrates that adrenergic modulation of I_f voltage dependence and
          of rate can be resolved in these cells.
    evidence:
    - reference: PMID:33934225
      reference_title: "A detailed characterization of the hyperpolarization-activated \"funny\" current (I(f)) in human-induced pluripotent stem cell (iPSC)-derived cardiomyocytes with pacemaker activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        pCMs express mainly HCN4 and HCN1 together with the accessory subunits
        CAV3, KCR1, MiRP1, and SAP97 that contribute to the context-dependence
        of If.
      explanation: >-
        Establishes that the current being measured is carried predominantly by
        the gene this disease affects, which is what makes the platform
        informative for this node.
  evidence:
  - reference: PMID:33934225
    reference_title: "A detailed characterization of the hyperpolarization-activated \"funny\" current (I(f)) in human-induced pluripotent stem cell (iPSC)-derived cardiomyocytes with pacemaker activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that pCMs display an If with the physiological properties
      expected by pacemaker cells and may thus represent a suitable model for
      studying human If-related sinus arrhythmias.
    explanation: >-
      The authors propose the platform for studying human I_f-related sinus
      arrhythmias, the class this disease belongs to.

computational_models:
- name: Fabbri-Severi human sinoatrial node cell model with HCN4 mutation-induced I_f changes
  model_type: PHYSIOLOGICAL
  description: >-
    A published in-silico risk-stratification study of SSS2. In-vitro biophysical
    data for HCN4 loss-of-function alleles were used to compute the charge
    carried by I_f during diastolic depolarization of a prerecorded human
    sinoatrial node action potential, and that quantity was used to drive the
    Fabbri-Severi model of a human sinoatrial node pacemaker cell. It is the
    computational counterpart of the funny-current node in this entry: it makes
    the qualitative claim (less diastolic I_f, slower firing) quantitative and
    allele-specific.
  publication: PMID:37760888
  modeled_mechanisms:
  - target: Reduced Funny Current and Slowed Diastolic Depolarization
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The simulated beating rate of the human sinoatrial node cell model tracks
      the computed diastolic I_f charge very closely, and the same quantity
      correlates strongly with the resting and minimum heart rates observed in
      carriers of the corresponding HCN4 mutations.
    limitations: >-
      The correlation with clinical heart rate is strong but not deterministic,
      the analysis is restricted to the subset of HCN4 alleles with both
      quantitative clinical and in-vitro data, and the authors state that a
      translational perspective remains to be established.
    evidence:
    - reference: PMID:37760888
      reference_title: "The Action Potential Clamp Technique as a Tool for Risk Stratification of Sinus Bradycardia Due to Loss-of-Function Mutations in HCN4: An In Silico Exploration Based on In Vitro and In Vivo Data."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The clinically observed minimum or resting heart rates showed a strong
        correlation with Qf
      explanation: >-
        Links the simulated diastolic funny-current charge to the heart rate
        actually measured in HCN4 mutation carriers.
  findings:
  - statement: >-
      The diastolic funny-current charge computed by action-potential clamp
      predicts both the simulated pacemaker rate of a human sinoatrial node cell
      model and the resting or minimum heart rate of HCN4 mutation carriers,
      making it a candidate risk-stratification measure for HCN4
      loss-of-function sinus bradycardia.
    evidence:
    - reference: PMID:37760888
      reference_title: "The Action Potential Clamp Technique as a Tool for Risk Stratification of Sinus Bradycardia Due to Loss-of-Function Mutations in HCN4: An In Silico Exploration Based on In Vitro and In Vivo Data."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The beating rate of the model cell showed a very strong correlation with
        Qf from the simulated action potential clamp experiments
      explanation: >-
        Reports the correlation between simulated pacemaker rate and diastolic
        funny-current charge that this finding states.
  evidence:
  - reference: PMID:37760888
    reference_title: "The Action Potential Clamp Technique as a Tool for Risk Stratification of Sinus Bradycardia Due to Loss-of-Function Mutations in HCN4: An In Silico Exploration Based on In Vitro and In Vivo Data."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      HCN4 is the gene responsible for the hyperpolarization-activated 'funny'
      current If, which is an important modulator of the spontaneous diastolic
      depolarization underlying the sinus node pacemaker activity.
    explanation: >-
      States the mechanistic premise the simulation encodes, matching this
      entry's funny-current pathophysiology node.
datasets:
- accession: geo:GSE279632
  title: Single-cell transcriptome analysis reveals CD34 as a marker of human sinoatrial node pacemaker cardiomyocytes [CITE-seq]
  description: >-
    The two-sample CITE-seq component of a study that resolved the human
    sinoatrial node into Core Pacemaker, Sinus Venosus and Transitional
    pacemaker subtypes and identified CD34 as a surface marker enriching
    functional pacemaker cells. This accession holds only that component; the
    single-nuclei and single-cell RNA sequencing of fetal and stem
    cell-derived sinoatrial node cells that the quoted sentence describes sits
    in sibling accessions of the same series. This is a reference dataset for
    the cell type whose failure defines SSS2, not an SSS2 patient cohort, and
    it contains no HCN4 variant carriers. Its value here is that it makes the
    affected compartment addressable: a CD34 sort yields the pacemaker cells in
    which an HCN4 allele would have to be assayed.
  data_type: SINGLE_CELL_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:39604360
  notes: >-
    Relevance is at the level of cell type rather than genotype. Verified with
    just verify-datasets.
  evidence:
  - reference: PMID:39604360
    reference_title: "Single-cell transcriptome analysis reveals CD34 as a marker of human sinoatrial node pacemaker cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we use single-nuclei/cell RNA sequencing of fetal and human
      pluripotent stem cell-derived sinoatrial node cells to reveal that they
      consist of three subtypes of pacemaker cells: Core Pacemaker, Sinus
      Venosus, and Transitional Cells.
    explanation: >-
      Describes the study this accession belongs to and the material it
      profiles, human sinoatrial node pacemaker cells at single-cell
      resolution. The sentence covers the whole series rather than this
      CITE-seq component alone, which the description states.
- accession: geo:GSE189782
  title: A single cell transcriptional roadmap of human pacemaker cell differentiation
  description: >-
    Single-cell RNA sequencing and trajectory inference over human induced
    pluripotent stem cells differentiating into sinoatrial-node-like
    cardiomyocytes, resolving the head, tail and transitional subtypes and the
    WNT and TGF-beta signalling decisions that separate them. It is the
    developmental counterpart of the atlas above and the transcriptional map of
    the platform used by the hiPSC pacemaker-cardiomyocyte model in this entry.
  data_type: SINGLE_CELL_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:36217819
  notes: >-
    Wild-type differentiation series, no disease genotypes. Verified with just
    verify-datasets.
  evidence:
  - reference: PMID:36217819
    reference_title: "A single cell transcriptional roadmap of human pacemaker cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we performed single cell RNA sequencing (scRNA-seq) and trajectory
      inference on human induced pluripotent stem cells (hiPSCs)
      differentiating to SAN-like cardiomyocytes (SANCMs) to construct a roadmap
      of transcriptional changes and lineage decisions.
    explanation: >-
      Describes the assay and material behind this accession and ties it to the
      hiPSC pacemaker-cardiomyocyte platform recorded under experimental_models.
- accession: geo:GSE329403
  title: HCN4 gain-of-function mutation increases intrinsic heart rate and limits maladaptive remodeling under pressure overload
  description: >-
    Cardiac RNA sequencing from HCN4(Y527F) knock-in mice, which carry a
    gain-of-function C-linker mutation that shifts channel activation to more
    positive potentials. The allele is the mirror image of the SSS2 lesion, and
    the mice have a higher intrinsic heart rate with no structural cardiomyopathy
    up to twelve months. It is included here as the opposite-direction control
    on the same gene: it is the closest available transcriptional readout of
    altered HCN4 channel availability in myocardium, and it bears on whether the
    structural arm of SSS2 can be a consequence of the rate change alone.
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:42358349
  notes: >-
    Triage note: this is a gain-of-function allele in mouse, not the human
    loss-of-function lesion of SSS2, and it must not be read as an SSS2
    expression dataset. Verified with just verify-datasets.
  evidence:
  - reference: PMID:42358349
    reference_title: "HCN4 gain-of-function mutation increases intrinsic heart rate and limits maladaptive remodeling under pressure overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated HCN4(Y527F) knock-in mice (HCN4F) carrying a GOF mutation in
      the C-linker of HCN4 channels, which shifts their activation curves to
      more positive potentials.
    explanation: >-
      Describes the genotype behind this accession and makes explicit that the
      direction of effect is opposite to the SSS2 lesion.

diagnosis:
- name: Electrocardiography and ambulatory rhythm monitoring
  description: >-
    Resting ECG and 24-hour Holter monitoring document the sinus bradycardia,
    sinus pauses, and bradycardia-tachycardia alternation, and correlate them
    with symptoms. Exercise testing assesses chronotropic response.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart rate monitoring using electrocardiography or ambulatory cardiac
      event monitoring is performed based on the frequency of symptoms.
    explanation: >-
      Establishes ECG and ambulatory monitoring as the diagnostic modality for
      sinus node dysfunction.
- name: Cardiac imaging for noncompaction and aortic dimensions
  description: >-
    Because the HCN4 form uniquely carries a structural arm, echocardiography
    and cardiac magnetic resonance are needed to look for left ventricular
    noncompaction, late gadolinium enhancement, and dilation of the ascending
    aorta in a carrier who presents only with bradycardia.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:35328031
    reference_title: "Clinical Presentation of Left Ventricular Noncompaction Cardiomyopathy and Bradycardia in Three Families Carrying HCN4 Pathogenic Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients were diagnosed with LVNC by echocardiography, and five
      participants additionally by CMR.
    explanation: >-
      Documents echocardiography and cardiac MRI as the modalities that detect
      the structural arm in HCN4 families.
- name: Genetic testing of HCN4
  description: >-
    Targeted or panel sequencing of HCN4 confirms the diagnosis in a proband
    with familial or early-onset sinus node dysfunction, particularly when
    bradycardia is accompanied by noncompaction, and enables cascade screening
    of relatives, many of whom are asymptomatic.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25145518
    reference_title: "The symptom complex of familial sinus node dysfunction and myocardial noncompaction is associated with mutations in the HCN4 channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted next-generation and direct sequencing were used for candidate
      gene analysis and mutation scanning.
    explanation: >-
      Describes the sequencing approach used to establish the HCN4 diagnosis in
      families with the combined phenotype.
treatments:
- name: Permanent Pacemaker Implantation
  description: >-
    Pacing is the definitive therapy for symptomatic bradycardia or symptomatic
    pauses; it does not correct the channel defect. In HCN4 carriers the age at
    implantation is later than in SCN5A-related familial sick sinus syndrome,
    and some HCN4 alleles never require a device. Chronotropic pharmacotherapy
    may defer but does not replace it.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: pacemaker implantation
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Sinoatrial Node Automaticity Failure
    treatment_effect: BYPASSES
    description: >-
      An implanted pacemaker substitutes an artificial impulse source for the
      failing sinoatrial node, bypassing rather than repairing the pacemaker
      current defect.
    evidence:
    - reference: PMID:34383451
      reference_title: "Sinus Node Dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        First-line treatment for patients with confirmed sinus node dysfunction
        is permanent pacemaker placement with atrial-based pacing and limited
        ventricular pacing when necessary.
      explanation: >-
        Establishes pacing as the first-line intervention against the failing
        sinoatrial node.
  evidence:
  - reference: PMID:28104484
    reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, HCN4 mutation carriers were more frequently associated with AF
      (43.8%) and LVNC (50%) and with older age at pacemaker implantation
    explanation: >-
      Reports age at pacemaker implantation specifically in HCN4 carriers,
      contrasted with the SCN5A form.
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite its critical location, this mutation carries a favorable prognosis
      without the need for pacemaker implantation during long-term follow-up.
    explanation: >-
      Supports the statement in this treatment's description that some HCN4
      alleles never require a device: the G480R pore mutation carried a
      favorable prognosis without pacemaker implantation over long-term
      follow-up.
- name: Chronotropic Pharmacotherapy (Cilostazol)
  description: >-
    Cilostazol, a phosphodiesterase-3 inhibitor, raises heart rate in sinus node
    dysfunction and has been used to defer or avoid permanent pacing in
    symptomatic sick sinus syndrome. It is a rate-raising palliative acting
    downstream of the pacemaker-current defect rather than a correction of it,
    and the supporting evidence comes from unselected sick sinus syndrome
    cohorts, not from genotyped HCN4 carriers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cilostazol
      term:
        id: CHEBI:31401
        label: cilostazol
  target_mechanisms:
  - target: Sinoatrial Node Automaticity Failure
    treatment_effect: MODULATES
    description: >-
      Cilostazol raises the sinus rate, partially offsetting the depressed
      nodal automaticity without restoring the funny current.
    evidence:
    - reference: PMID:30982679
      reference_title: "Efficacy of cilostazol for sick sinus syndrome to avoid permanent pacemaker implantation: A retrospective case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Cilostazol was effective for symptomatic SSS to avoid PM implantation by
        increasing HR.
      explanation: >-
        Shows a rate-raising effect on the failing sinoatrial node. The cohort
        is unselected sick sinus syndrome rather than genotyped HCN4 carriers,
        so the step to SSS2 is an inference from the shared nodal lesion.
  evidence:
  - reference: PMID:30982679
    reference_title: "Efficacy of cilostazol for sick sinus syndrome to avoid permanent pacemaker implantation: A retrospective case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The 6-month PM implantation rate was lower in the cilostazol than the
      control group (20.4% vs. 55.8%, respectively; p<0.001).
    explanation: >-
      Quantifies the pacemaker-deferring effect. It is a single-centre
      retrospective case-control study in unselected sick sinus syndrome, not a
      randomized trial and not HCN4-genotyped, so the SSS2-specific effect size
      is unknown.
  - reference: PMID:33017571
    reference_title: "Pharmacologic Approach to Sinoatrial Node Dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      This review summarizes the current knowledge about SND mechanisms and
      discusses the possibility of introducing new pharmacologic therapies for
      treating SND.
    explanation: >-
      Frames pharmacologic management of sinoatrial node dysfunction as an area
      of active development rather than established practice. It supports the
      existence of the therapeutic avenue, not the efficacy of any particular
      agent in SSS2.
- name: Avoidance of Bradycardia-Inducing Medications
  description: >-
    Because SSS2 carriers already run a reduced pacemaker current, drugs that
    further depress sinoatrial automaticity or conduction (beta-blockers,
    non-dihydropyridine calcium channel blockers, digoxin, and the selective
    I_f blocker ivabradine, whose molecular target is HCN4 itself) can unmask
    or worsen symptomatic bradycardia. Extrinsic contributors to sinus node
    dysfunction are frequently reversible, so medication review is part of
    management as well as of diagnosis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The causes of sinus node dysfunction are intrinsic (e.g., degenerative
      idiopathic fibrosis, cardiac remodeling) or extrinsic (e.g., medications,
      metabolic abnormalities) to the sinoatrial node.
    explanation: >-
      Establishes medications as an extrinsic cause of sinus node dysfunction,
      which is the rationale for avoiding rate-slowing drugs in a carrier. The
      source addresses sinus node dysfunction generally and names no specific
      agent to avoid in HCN4 carriers, so the carrier-specific application is
      an inference.
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A diagnosis is made by directly correlating symptoms with a bradyarrhythmia
      and eliminating potentially reversible extrinsic causes.
    explanation: >-
      Supports elimination of reversible extrinsic causes, of which drug therapy
      is the main modifiable one. The statement is framed as a diagnostic rather
      than a therapeutic step, so its use here as a management rationale is an
      inference.
- name: Stroke Prevention in Atrial Fibrillation
  description: >-
    Atrial fibrillation occurs in roughly 44% of HCN4 carriers, so thromboembolic
    prophylaxis is part of routine management once it is documented, prescribed
    on the same risk-score basis as in any other atrial fibrillation rather than
    on the genotype. What is genuinely unsettled is the carrier without
    documented atrial fibrillation: sinus node dysfunction carries an
    independently raised ischaemic stroke risk even in its absence, and the
    yearly stroke incidence in sinus node dysfunction with and without atrial
    fibrillation is indistinguishable, which has been read as evidence of an
    underlying atrial myopathy rather than of arrhythmia-driven stasis. No trial
    has tested anticoagulation in that group, and none of this evidence is
    HCN4-genotyped.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  evidence:
  - reference: PMID:37977871
    reference_title: "Sinus node dysfunction and stroke risk: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The average yearly stroke incidence in patients with SND was 1.542% (95%
      CI: 1.334% to 1.749%). The stroke incidence was similar between the
      isolated SND (1.587%; 95% CI: 1.510% to 1.664%) and non-isolated (SND+AF)
      (1.660%; 95% CI: 0.705% to 2.615%) groups.
    explanation: >-
      Quantifies the stroke burden that makes thromboembolic prophylaxis a
      management question here at all, and shows it does not depend on
      documented atrial fibrillation. The pooled population is unselected sinus
      node dysfunction, not HCN4 carriers.
  - reference: PMID:37977871
    reference_title: "Sinus node dysfunction and stroke risk: a systematic review and meta-analysis."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future studies are needed to investigate whether interventions targeting
      stroke prevention, such as anticoagulation therapy, can help to prevent
      stroke in patients with SND.
    explanation: >-
      The authors state explicitly that whether anticoagulation prevents stroke
      in sinus node dysfunction has not been established, so this item is
      recorded as bearing on the burden rather than on the intervention. It is
      the reason this treatment is scoped to documented atrial fibrillation.
  - reference: PMID:40315941
    reference_title: "Risk of ischemic stroke in sinus node dysfunction with and without atrial fibrillation: Evidence for the presence of a left atrial myopathy in patients with isolated sinus node dysfunction-an analysis of the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      In multivariable competing-risk regression modeling accounting for death,
      isolated SND conferred a significantly increased risk of IS compared to
      controls (subdistribution hazard ratio 2.28; 95% confidence interval,
      1.57-3.31; P < .001).
    explanation: >-
      A prospective population cohort finding the same excess risk in sinus node
      dysfunction without atrial fibrillation, which is what makes the untested
      group a real clinical question rather than a theoretical one. Again the
      cohort is not genotyped.
- name: Genetic Counseling and Cascade Family Screening
  description: >-
    SSS2 is autosomal dominant with variable penetrance, so first-degree
    relatives of a proband carry a 50% prior risk and may be affected while
    entirely asymptomatic. Counselling plus cascade ECG, Holter, echocardiographic
    and HCN4 sequencing of relatives identifies those carriers, which matters
    here because the HCN4 phenotype includes a structural (noncompaction) arm
    that is not detected by rhythm assessment alone.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen members of a family with sinus bradycardia were evaluated.
      Evaluation included a clinical questionnaire, 12-lead ECGs, Holter
      monitoring, echocardiography, and treadmill exercise testing.
    explanation: >-
      Documents the family-wide evaluation protocol by which HCN4 relatives are
      screened, including the echocardiography needed to catch the structural
      arm.
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight family members (5 males) were classified as affected. All affected
      family members were asymptomatic with normal exercise capacity during
      long-term follow-up.
    explanation: >-
      Demonstrates the yield of cascade screening in SSS2: half the evaluated
      family was affected and every affected member was asymptomatic, so
      relatives would not have been identified without screening.
differential_diagnoses:
- name: Familial Sick Sinus Syndrome
  description: >-
    The dismech umbrella entry for inherited sinoatrial node dysfunction, which
    spans several causal genes (HCN4, SCN5A, ANK2, LMNA) and both dominant and
    recessive transmission. SSS2 is the HCN4-specific, autosomal dominant member
    of that set and is curated separately because MONDO models it as a distinct
    disease-series-by-gene entity with its own OMIM record.
  disease_term:
    preferred_term: familial sick sinus syndrome
    term:
      id: MONDO:0012061
      label: familial sick sinus syndrome
  distinguishing_features:
  - The umbrella entry is gene-heterogeneous and also spans the autosomal recessive SCN5A form, LMNA and ANK2.
  - SSS2 is defined by a heterozygous HCN4 loss-of-function variant acting on the funny current.
  - Left ventricular noncompaction is a characteristic co-segregating feature of the HCN4 form specifically.
  evidence:
  - reference: PMID:28104484
    reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial sick sinus syndrome (SSS) is often attributable to mutations in
      genes encoding the cardiac Na channel SCN5A and pacemaker channel HCN4.
    explanation: >-
      States the gene heterogeneity of the umbrella entity, which is what makes
      the HCN4 form a member of it rather than a synonym for it.
- name: Sick sinus syndrome 1
  description: >-
    The SCN5A-related form of familial sick sinus syndrome, in which
    compound-heterozygous loss-of-function alleles of the cardiac sodium channel
    reduce myocardial excitability.
  disease_term:
    preferred_term: sick sinus syndrome 1
    term:
      id: MONDO:0024562
      label: sick sinus syndrome 1
  distinguishing_features:
  - Recessive rather than dominant transmission.
  - Markedly younger age at diagnosis and at pacemaker implantation than the HCN4 form.
  - Lacks the atrial fibrillation and left ventricular noncompaction burden characteristic of SSS2.
  evidence:
  - reference: PMID:28104484
    reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis of HCN4 mutation carriers showed a significantly younger age
      at diagnosis
    explanation: >-
      Establishes the age-at-diagnosis separation between HCN4 (SSS2), sporadic
      sick sinus syndrome, and SCN5A (SSS1) carriers.
- name: Sinoatrial Block
  description: >-
    Failure of conduction of the sinoatrial impulse out of the node into atrial
    myocardium, producing pauses that on the surface ECG can look like sinus
    arrest.
  disease_term:
    preferred_term: sinoatrial block
    term:
      id: MONDO:0020806
      label: sinoatrial block
  distinguishing_features:
  - Sinoatrial block is a disorder of impulse exit (conduction); SSS2 is a disorder of impulse generation (automaticity).
  - Sinoatrial exit block may also occur within the SSS2 phenotype, so the distinction is mechanistic rather than mutually exclusive.
  evidence:
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Electrocardiography findings include sinus bradycardia, sinus pauses or
      arrest, sinoatrial exit block, chronotropic incompetence, or alternating
      bradycardia and tachycardia
    explanation: >-
      Lists sinoatrial exit block among the electrocardiographic findings of
      sinus node dysfunction itself, which is why this differential is a
      mechanistic distinction rather than a mutually exclusive alternative
      diagnosis.
- name: Sinoatrial Node Dysfunction and Deafness
  description: >-
    An autosomal recessive channelopathy caused by biallelic CACNA1D
    loss-of-function, in which loss of the Cav1.3 L-type calcium current
    produces both sinoatrial node dysfunction and congenital deafness.
  disease_term:
    preferred_term: sinoatrial node dysfunction and deafness
    term:
      id: MONDO:0013960
      label: sinoatrial node dysfunction and deafness
  distinguishing_features:
  - Recessive CACNA1D rather than dominant HCN4.
  - The calcium-current lesion is shared with the cochlear inner hair cell ribbon synapse, so congenital sensorineural deafness accompanies the bradycardia.
  - No left ventricular noncompaction.
  evidence:
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a human channelopathy (termed SANDD syndrome, sinoatrial node
      dysfunction and deafness) with a cardiac and auditory phenotype that
      closely resembles that of Cacna1d(-/-) mice.
    explanation: >-
      Names the entity and its combined cardiac and auditory phenotype, the
      feature that separates it from SSS2 at the bedside.
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used positional cloning to identify a mutation in CACNA1D, which
      encodes the pore-forming α1 subunit of Ca(v)1.3 LTCCs, in two
      consanguineous families with deafness.
    explanation: >-
      Establishes the causal gene and the consanguineous, recessive
      transmission that contrasts with dominant HCN4.
- name: Sick sinus syndrome 4
  description: >-
    Familial sinus node and atrioventricular conduction dysfunction caused by
    variation in the G-protein subunit gene GNB2.
  disease_term:
    preferred_term: sick sinus syndrome 4
    term:
      id: MONDO:0859173
      label: sick sinus syndrome 4
  distinguishing_features:
  - The lesion is in G-protein signalling upstream of the pacemaker channels rather than in the channel itself.
  - Atrioventricular conduction disease is a defining rather than incidental component.
  evidence:
  - reference: PMID:30645171
    reference_title: "Familial Sinus Node Disease Caused by a Gain of GIRK (G-Protein Activated Inwardly Rectifying K(+) Channel) Channel Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, a gain-of-function mutation in the G-protein gene GNB2 led to
      enhanced activation of the GIRK (G-protein activated inwardly rectifying
      K+ channel).
    explanation: >-
      Places the SSS4 lesion in G-protein signalling acting on a potassium
      channel, upstream of and distinct from the HCN4 pacemaker channel defect
      of SSS2. The quoted sentence is this paper's background summarising the
      primary GNB2 report rather than its own result, which is a KCNJ5 variant
      in a separate family, so it is cited here for the mechanism class it
      states and not as the primary source for SSS4.
discussions:
- discussion_id: q_sss2_aortic_wall_mechanism
  prompt: >-
    By what route does a loss-of-function variant in the sinoatrial pacemaker
    channel produce dilatation of the ascending aorta?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Dilatation of the Ascending Aorta
  - pathophysiology#Impaired Ventricular Trabecular Compaction
  rationale: >-
    Aortic root and ascending aortic dilatation has now been reported in
    several independent HCN4 families and in a majority of carriers in the
    largest series, so the association is replicated. What is missing is any
    mechanism. HCN4 has no described role in the aortic wall, no HCN4 animal
    model has been reported with an aortic phenotype, and neither of the two
    candidate routes has been tested: a direct requirement for HCN4 in
    neural-crest-derived or second-heart-field-derived outflow tract
    mesenchyme, or a haemodynamic consequence of lifelong bradycardia acting on
    the wall through increased stroke volume. The distinction is not academic,
    because it decides whether pacing a carrier would be expected to slow the
    aortic course. Until it is resolved, imaging surveillance in carriers rests
    on the observed association alone.
  evidence:
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Earliest expression of HCN4 has been reported to be a potential marker for
      the first heart field.
    explanation: >-
      The one developmental fact that makes a direct route plausible: HCN4 marks
      an early cardiac progenitor population, so a developmental role in outflow
      structures is not excluded. It is a marker claim rather than a functional
      one, which is exactly the gap.
- discussion_id: q_sss2_noncompaction_developmental_or_rate_driven
  prompt: >-
    Is the ventricular noncompaction of SSS2 a developmental consequence of
    HCN4 loss in the early myocardium, or a secondary remodelling response to
    lifelong bradycardia?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Ventricular Trabecular Compaction
  - phenotypes#Left Ventricular Noncompaction
  rationale: >-
    Both readings fit the human data. The developmental reading is supported by
    HCN4 expression in early cardiac progenitors, by noncompaction being
    present already in fetal and adolescent carriers, and by Hcn4 sitting
    downstream of a transcriptional cascade rather than being an isolated
    channel gene: in mouse, loss of Shox2 abolishes Tbx3 and Hcn4 expression
    and leaves a hypoplastic sinoatrial node. That cascade is characterised for
    the sinoatrial node and not for ventricular trabeculation, so it shows that
    HCN4 has a developmental context without showing that it has one in the
    compacting ventricle. The haemodynamic reading
    is supported by the observation that HCN4 carriers with noncompaction have
    preserved ejection fraction and mild ventricular dilatation, a picture that
    could equally reflect volume loading at a low heart rate. One experiment on
    the same gene bears on the haemodynamic reading, though only on part of it:
    a knock-in mouse with a gain-of-function HCN4 allele runs chronically
    faster and develops no structural cardiomyopathy over twelve months. That
    speaks to adult remodelling under a sustained rate change, in the opposite
    direction from the bradycardia at issue and in a species whose baseline
    rate is an order of magnitude higher; it says nothing about whether
    lifelong bradycardia perturbs trabecular compaction during development,
    which is the reading actually in dispute. Settling that needs a
    loss-of-function HCN4 model examined for trabecular architecture, and a
    comparison of noncompaction burden between paced and unpaced carriers.
  evidence:
  - reference: PMID:42358349
    reference_title: "HCN4 gain-of-function mutation increases intrinsic heart rate and limits maladaptive remodeling under pressure overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Histological analysis did not reveal structural changes consistent with
      tachycardia-induced cardiomyopathy. Cardiac morphology, fibrosis, and
      contractility were indistinguishable between genotypes up to 12 months of
      age.
    explanation: >-
      A sustained HCN4-driven change in heart rate produced no structural
      cardiomyopathy in the adult mouse heart. It bears on the adult-remodelling
      reading only, and in the opposite direction from the bradycardia at issue,
      so it constrains the question rather than answering it.
  - reference: PMID:19166829
    reference_title: "Shox2 is essential for the differentiation of cardiac pacemaker cells by repressing Nkx2-5."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Genetically, the lack of Tbx3 and Hcn4 expression, along with ectopic
      activation of Nppa, Cx40, and Nkx2-5 in the Shox2(-/-) SAN region,
      indicates a failure in SAN differentiation.
    explanation: >-
      Places Hcn4 inside a developmental transcriptional programme rather than
      treating it as a channel gene expressed only in the mature node, which is
      what makes a developmental reading of the structural phenotype coherent
      at all. Two inference steps separate it from the question: it is mouse,
      and the programme it describes builds the sinoatrial node, not the
      compacted ventricular wall.
  - reference: PMID:34088380
    reference_title: "Phenotype/Genotype Relationship in Left Ventricular Noncompaction: Ion Channel Gene Mutations Are Associated With Preserved Left Ventricular Systolic Function and Biventricular Noncompaction: Phenotype/Genotype of Noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Ion channel gene mutations should be searched systematically in patients
      with LVNC associated with either bradycardia or biventricular
      noncompaction, particularly when LV systolic function is preserved.
    explanation: >-
      The preserved-function, biventricular pattern is the observation both
      readings have to explain, and it is compatible with either a developmental
      or a volume-loading origin, which is why the question stays open.
- discussion_id: q_sss2_variant_causality_threshold
  prompt: >-
    What functional evidence should be required before an HCN4 variant found in
    a bradycardic patient is called causal for SSS2?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#HCN4 loss-of-function variants
  - pathophysiology#HCN4 Loss-of-Function Variant
  rationale: >-
    SSS2 is defined by an HCN4 variant, so the entry's causal claim is only as
    good as the variant calls behind it. HCN4 variant discovery has outrun
    functional characterisation: most reported variants have never been
    patch-clamped, and at least one variant that had been treated as
    pathogenic, and linked in the literature to sudden infant death and
    malignant epilepsy, was found on characterisation to be
    indistinguishable from wild type in voltage dependence, kinetics,
    cAMP-gating and surface expression, and not to segregate with disease in
    the proband's own family. The alleles curated in this entry all carry
    electrophysiological or segregation evidence, which is the standard this
    discussion argues for, but the boundary is not settled and the field has no
    agreed threshold. Practically, this bears on cascade screening: a carrier
    identified on a panel without functional or segregation support has not
    been shown to have SSS2.
  evidence:
  - reference: PMID:33095298
    reference_title: "Disease-associated HCN4 V759I variant is not sufficient to impair cardiac pacemaking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, detailed electrophysiological and cell biological
      characterization of HCN4 V759I in Xenopus laevis oocytes and embryonic rat
      cardiomyocytes, respectively, did not reveal any obvious abnormality.
    explanation: >-
      A variant treated as pathogenic behaves as wild type on functional
      testing, which is the concrete case the controversy rests on.
  - reference: PMID:33095298
    reference_title: "Disease-associated HCN4 V759I variant is not sufficient to impair cardiac pacemaking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In good agreement, the clinically likewise affected mother of the patient
      does not exhibit the reported HCN4 variance.
    explanation: >-
      Adds the segregation half of the argument: the affected relative does not
      carry the variant, so the family data contradict causality independently
      of the electrophysiology.
- discussion_id: q_sss2_anticoagulation_without_documented_af
  prompt: >-
    Should an HCN4 carrier with sinus node dysfunction but no documented atrial
    fibrillation receive anticoagulation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Stroke Prevention in Atrial Fibrillation
  - phenotypes#Atrial Fibrillation
  rationale: >-
    Two independent lines of evidence say sinus node dysfunction raises
    ischaemic stroke risk whether or not atrial fibrillation has been
    documented, which has been read as an atrial myopathy underlying both. If
    that is right, the risk-score logic that gates anticoagulation on a
    documented arrhythmia is the wrong gate. Nothing resolves this for SSS2 in
    particular: no cohort in either source was genotyped, no trial has tested
    anticoagulation in sinus node dysfunction without atrial fibrillation, and
    HCN4 carriers are a young population in whom the bleeding side of the
    trade-off runs for decades. The practical question is whether prolonged
    rhythm monitoring in carriers, which they often already have through an
    implanted device or loop recorder, converts the question into an ordinary
    documented-atrial-fibrillation decision often enough to make the untested
    group small.
  evidence:
  - reference: PMID:40315941
    reference_title: "Risk of ischemic stroke in sinus node dysfunction with and without atrial fibrillation: Evidence for the presence of a left atrial myopathy in patients with isolated sinus node dysfunction-an analysis of the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      SND is an independent risk marker for the development of IS in individuals
      without AF.
    explanation: >-
      States the finding the gap turns on, that the excess stroke risk does not
      require documented atrial fibrillation. The cohort is unselected sinus
      node dysfunction rather than HCN4 carriers.
  - reference: PMID:37977871
    reference_title: "Sinus node dysfunction and stroke risk: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future studies are needed to investigate whether interventions targeting
      stroke prevention, such as anticoagulation therapy, can help to prevent
      stroke in patients with SND.
    explanation: >-
      The authors name the same gap and state that it is untested, which is why
      this is recorded as an open question rather than as a treatment
      recommendation.
- discussion_id: q_sss2_chronotropic_incompetence_model_mismatch
  prompt: >-
    Does the mouse carrying the human cAMP-insensitive HCN4-573X allele
    reproduce human chronotropic incompetence, given that its relative rate
    adaptation to exercise is preserved?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of cAMP-Dependent Rate Modulation
  - phenotypes#Chronotropic Incompetence
  rationale: >-
    The hHCN4-573X mouse carries the human disease allele and loses cAMP
    sensitivity of I_f completely, yet the relative extent of its heart rate
    regulation during physical activity is preserved: basal and maximal rates
    fall, but the animal still scales its rate with demand. The human index
    patient was described with chronotropic incompetence. Both can be true if
    human chronotropic incompetence is a consequence of the depressed maximal
    rate rather than of a lost ability to modulate, and this entry's
    pathophysiology is written that way. The mismatch is nonetheless real and
    unresolved: it is not established that cAMP insensitivity is what produces
    the clinical exercise limitation, and the mouse is the only experiment that
    separates the two. Deciding it needs formal chronotropic-index testing in
    genotyped carriers of cyclic-nucleotide-binding-domain truncations,
    compared against carriers of pore and trafficking alleles that retain cAMP
    sensitivity.
  evidence:
  - reference: PMID:19570998
    reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite the complete loss of cAMP sensitivity of I(f), the relative extent
      of SAN cell frequency and heart rate regulation are preserved.
    explanation: >-
      States the mismatch directly: the model loses the molecular property
      proposed to underlie chronotropic incompetence without losing rate
      regulation.

notes: >-
  LUMP-VS-SPLIT DECISION. kb/disorders/Familial_Sick_Sinus_Syndrome.yaml
  (MONDO:0012061) already carried an HCN4 pathophysiology node, an HCN4 genetic
  entry, and left ventricular noncompaction as a phenotype. This entry was
  nevertheless curated separately because MONDO:0008102 is a distinct
  disease-series-by-gene entity (is_a MONDO:0012061, RO:0004003 to HGNC:16882,
  xref OMIM:163800) and because the umbrella is deliberately gene-heterogeneous:
  it also spans the autosomal recessive SCN5A form, LMNA, ANK2, and GWAS-level
  susceptibility loci, so its HCN4 content is necessarily a summary. This entry
  adds what the umbrella cannot: the funny-current mechanism at pacemaker-cell
  resolution, the three structural classes of HCN4 allele and their distinct
  biophysical consequences, the separable cAMP-modulation arm that produces
  chronotropic incompetence, two HCN4 mouse models, an in-silico human
  sinoatrial node model, and the quantitative HCN4-specific phenotype
  frequencies (atrial fibrillation 43.8%, noncompaction 50%). The umbrella
  should retain its HCN4 content as the summary view; a follow-up may add
  MONDO:0008102 to it as a has_subtypes term.

  NEC PREFLIGHT. "Sick sinus syndrome 2" sits in a numbered series whose members
  have different causal genes (SSS1 SCN5A, SSS2 HCN4, SSS3 MYH6, SSS4 GNB2),
  a high named-entity-confusion risk class. The MONDO record for MONDO:0008102
  was read directly (runoak -i sqlite:obo:mondo info MONDO:0008102 -O obo) and
  asserts RO:0004003 HGNC:16882 (HCN4) with xref OMIM:163800. `just preflight-dr`
  on the falcon report returned PASS (HCN4 mentioned 91 times, SCN5A 3), and
  every citation used here was independently confirmed to concern HCN4 rather
  than SCN5A, MYH6 or GNB2.

  DEEP RESEARCH. A falcon (Edison) deep-research run was performed
  (research/Sick_Sinus_Syndrome_2_Autosomal_Dominant-deep-research-falcon.md;
  reference_validation reports 8/8 references verified, confabulation_rate 0.0).
  Its narrative was used as a lead only. It cited reviews rather than the
  primary SSS2 literature and its suggested ontology identifiers were largely
  wrong when checked with OAK (for example HP:0005209 and HP:0030247 offered for
  chronotropic incompetence and sinus pause, HP:0012810 for left ventricular
  noncompaction, and NCIT:C15632 offered as "Pacemaker Implantation" when that
  identifier is Chemotherapy). Every ontology term in this entry was therefore
  looked up independently with OAK, and the evidence base was rebuilt from the
  primary pedigree, electrophysiology, and cohort papers.

  GENEREVIEWS. PubMed was searched for a GeneReviews chapter covering sick sinus
  syndrome, sinus node dysfunction, or HCN4 (queries "sick sinus syndrome[TI]
  GeneReviews[TI]", "sinus node dysfunction GeneReviews[All Fields]", "HCN4
  GeneReviews[All Fields]"). No GeneReviews chapter exists for this disorder;
  the hits returned were unrelated chapters (Brugada Syndrome, Heritable
  Thoracic Aortic Disease, Hereditary Transthyretin Amyloidosis), so no
  GeneReviews baseline could be applied.

  TREATMENTS SCOPE. Four treatment entries are curated: pacing (definitive),
  chronotropic pharmacotherapy with cilostazol (pacemaker-deferring), avoidance
  of bradycardia-inducing medications, and genetic counselling with cascade
  family screening. Two management topics raised by the deep-research artifact
  are deliberately NOT curated. (1) Theophylline: the DR describes it as the
  most widely used outpatient drug for sinus node dysfunction, but the claim
  traces to a review rather than to a citable primary study with a quotable
  abstract, and no theophylline trial in sick sinus syndrome could be sourced
  with an exact-quote snippet — per the evidence SOP the claim is dropped rather
  than supported by a manufactured quote. (2) Anticoagulation for the atrial
  fibrillation curated here at FREQUENT: stroke-prevention anticoagulation is
  driven by CHA2DS2-VASc risk and is not specific to, or modified by, the HCN4
  lesion, so it belongs to atrial fibrillation management rather than to the
  SSS2 mechanism graph. Acute in-hospital chronotropes (atropine,
  isoproterenol) are likewise generic bradycardia rescue rather than
  SSS2-specific and are omitted for the same reason.

  IVABRADINE. Ivabradine is a selective I_f (HCN4) blocker used to slow heart
  rate in angina and heart failure. On mechanistic grounds it would be expected
  to aggravate the pacemaker-current deficit in an SSS2 carrier, but no cited
  publication states this for HCN4 carriers specifically, so it is named in the
  "Avoidance of Bradycardia-Inducing Medications" treatment description as a
  mechanistic inference and is not asserted there as an evidenced claim: the
  evidence attached to that entry supports drug-induced sinus node dysfunction
  in general, not ivabradine harm in HCN4 carriers.

  SINOATRIAL EXIT BLOCK. HP:0012723 (Sinoatrial block) exists and is a
  descendant of the HP:0011702 term used for the pause/arrest phenotype, and
  exit block appears in the general sick-sinus-syndrome ECG criteria quoted
  here. It is not curated as a separate phenotype because no HCN4-specific
  source in the cached references reports it in genotyped carriers; adding it
  would assert a genotype-phenotype link the evidence does not carry.

  UNCITED REFERENCE CACHES. Two cached references are deliberately not cited.
  PMID:27173043 (Vermeer et al 2016) is the primary report of ascending aortic
  dilatation in HCN4 families and would be the better citation for that
  phenotype, but it is a JACC letter with no abstract retrievable through the
  reference cache, so the frequency is cited through the case report
  PMID:35257104 with directness INDIRECT instead. PMID:33185997 has the same
  problem. Neither is a defective source; there is simply no quotable text to
  attach a snippet to. The remaining uncited caches back the openscientist
  deep-research report rather than this entry.

  PREVALENCE. There is still no general-population prevalence estimate
  specific to SSS2, and none is asserted. What the prevalence records hold
  instead are four conditioned occurrence figures, each labelled with the
  ascertainment that produced it: the HCN4 share of mutation-positive familial
  sick sinus syndrome probands, the HCN4 share of paediatric and of adult
  isolated left ventricular noncompaction cohorts, and the Danish nationwide
  cumulative incidence of pacemaker-treated sinus node dysfunction in
  first-degree relatives, which is heritable sinus node dysfunction at
  population scale rather than genotyped SSS2. The per-gene case fraction
  (2 of 38 familial SSS families) remains under genetic.case_fractions, which
  is the correct slot for a genetic-spectrum share rather than a population
  rate.

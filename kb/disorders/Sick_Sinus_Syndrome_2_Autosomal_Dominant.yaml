    reference_title: "HCN4 mutations in multiple families with bradycardia and left ventricular noncompaction cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of these, p.Gly482Arg in HCN4, segregated with the combined
      bradycardia and LVNC phenotype in the entire family.
    explanation: >-
      Establishes co-segregation of a single HCN4 allele with both the
      electrical and the structural phenotype.
  - reference: PMID:25145517
    reference_title: "HCN4 mutations in multiple families with bradycardia and left ventricular noncompaction cardiomyopathy."

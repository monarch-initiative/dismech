  downstream:
  - target: Sinoatrial Node Automaticity Failure
    causal_link_type: DIRECT
    description: >-
      A slower diastolic depolarization slope lengthens the pacemaker cycle and
      depresses automaticity of the node as a whole.
    hypothesis_groups:
    - sinoatrial_automaticity_failure_model
- name: Loss of cAMP-Dependent Rate Modulation
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Beta-adrenergic stimulation raises intracellular cAMP, which binds the
    cyclic-nucleotide-binding domain of HCN4 and shifts activation to more
    positive voltages, accelerating diastolic depolarization; vagal tone does
    the reverse. Truncating HCN4 alleles such as 573X delete this domain
    entirely, so the residual current is insensitive to cAMP. This is the
    proposed mechanistic basis of chronotropic incompetence in SSS2 — a failure
    of rate adaptation that is separable from the resting bradycardia. The
    corresponding mouse model shows that cAMP sensitivity of I_f sets basal and
    maximal heart rate while relative rate regulation during exercise is
    partially preserved by other mechanisms.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: regulation of heart rate
    term:
      id: GO:0002027
      label: regulation of heart rate
    modifier: DECREASED
  - preferred_term: regulation of SA node cell action potential
    term:
      id: GO:0098907
      label: regulation of SA node cell action potential
    modifier: DECREASED
  evidence:
  - reference: PMID:12750403
    reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patch-clamp experiments showed that HCN4-573X channels mediated I(f)-like
      currents that were insensitive to increased cellular cAMP levels.
    explanation: >-
      Direct demonstration that a truncating HCN4 allele abolishes cAMP
      responsiveness of the pacemaker current.
  - reference: PMID:12750403
    reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the clinical, genetic, and in vitro data provide a likely
      explanation for the patient's sinus bradycardia and the chronotropic
      incompetence.
    explanation: >-
      Links the cAMP-insensitive channel phenotype to the patient's chronotropic
      incompetence.
  - reference: PMID:19570998
    reference_title: "Control of heart rate by cAMP sensitivity of HCN channels."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data demonstrate that cAMP-mediated regulation of I(f) determines
      basal and maximal heart rates but does not play an indispensable role in
      heart rate adaptation during physical activity.
    explanation: >-
      A mouse model of the human 573X allele shows cAMP sensitivity of I_f sets
      basal and maximal rate; graded PARTIAL because it also shows relative
      exercise rate adaptation is preserved, qualifying the chronotropic claim.
  downstream:
  - target: Chronotropic Incompetence
    causal_link_type: DIRECT
    description: >-
      Without cAMP-dependent acceleration of the pacemaker current, heart rate
      fails to rise appropriately with sympathetic drive.
  - target: Sinoatrial Node Automaticity Failure
    causal_link_type: DIRECT
    description: >-
      Loss of the cAMP-dependent positive shift lowers the operating range of
      pacemaker firing, compounding the resting depression of automaticity.
- name: Sinoatrial Node Automaticity Failure
  conforms_to: "cardiac_ion_channel_repolarization#Sinoatrial Node Pacemaker Dysfunction"
  role: effector
  biological_scale: TISSUE
  description: >-
    Depressed pacemaker-cell firing translates into failure of the sinoatrial
    node to generate and deliver impulses at an appropriate rate: sinus
    bradycardia at rest, intermittent sinus pauses or arrest, and an inadequate
    rate response to demand. Because the node also anchors atrial activation,
    chronic bradycardia and the associated atrial electrical and structural
    remodeling raise susceptibility to atrial fibrillation, giving the
    tachycardia-bradycardia pattern that is unusually common in HCN4 carriers.

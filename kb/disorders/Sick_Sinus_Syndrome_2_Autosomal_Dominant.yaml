- name: Prolonged QT Interval
  category: Cardiovascular
  description: >-
    Lengthening of ventricular repolarisation on the surface electrocardiogram,
    reported in individual HCN4 carriers in two independent settings: a
    trafficking-defective D553N carrier who also had torsade de pointes, and a
    neonate with an in-frame HCN4 deletion whose QTc of 500 ms normalised over
    the first months of life. HCN4 is not a repolarising channel, so this is
    not an expected consequence of the funny-current lesion, and whether it is
    a real part of the SSS2 phenotype or a rate-related artefact of severe
    bradycardia is unsettled. Both reports are in genotyped carriers, and the
    distinction matters for drug avoidance. No pathophysiology node in this
    entry produces it, so it stands outside the causal graph rather than being
    given a parent the evidence does not support.
  phenotype_term:
    preferred_term: Prolonged QT interval
    term:
      id: HP:0001657
      label: Prolonged QT interval
  frequency: VERY_RARE
  evidence:
  - reference: PMID:15123648
    reference_title: "Functional characterization of a trafficking-defective HCN4 mutation, D553N, associated with cardiac arrhythmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense mutation, D553N, was found in a patient with sinus node
      dysfunction who showed recurrent syncope, QT prolongation in
      electrocardiogram, and polymorphic ventricular tachycardia, torsade de
      pointes.
    explanation: >-
      Records QT prolongation, with torsade de pointes, in a genotyped HCN4
      carrier.
  - reference: PMID:39698436
    reference_title: "Fetal bradycardia associated with left ventricle noncompaction diagnosed as HCN4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrocardiography (ECG) after birth revealed sinus bradycardia with a
      heart rate of 70–80 bpm, associated with a slightly prolonged QTc of 500.
    explanation: >-
      An independent HCN4 carrier with QT prolongation. The value normalised on
      follow-up, which is part of why the phenotype is banded VERY_RARE and
      described as unsettled rather than asserted as a core feature.
- name: Atrial Fibrillation
  category: Cardiovascular
  description: >-
    Disorganized atrial electrical activity with an irregularly irregular
    ventricular response. Atrial fibrillation is strikingly common in HCN4
    carriers — reported in 43.8% in a meta-analysis of HCN4 probands — and
    frequently alternates with the bradycardia as tachycardia-bradycardia
    syndrome.
  phenotype_term:

- name: Impaired Ventricular Trabecular Compaction
  role: effector
  biological_scale: TISSUE
  description: >-
    HCN4 is expressed during cardiac development, and in several independent
    pedigrees the same segregating HCN4 allele produces both bradycardia and
    left ventricular noncompaction — a myocardium with a persistently
    trabeculated, poorly compacted layer and deep intertrabecular recesses.
    This developmental arm is what distinguishes the HCN4 form of familial sick
    sinus syndrome from the sodium-channel forms, in which no structural
    abnormality is found. It is curated here as a parallel branch of the same
    genetic lesion rather than as maladaptive remodeling secondary to the
    arrhythmia: the noncompaction is present from childhood and does not follow
    a preceding phase of cardiomyocyte injury and neurohormonal activation.
    Some pedigrees additionally show dilation of the ascending aorta.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: ventricular trabecula myocardium morphogenesis
    term:
      id: GO:0003222
      label: ventricular trabecula myocardium morphogenesis
    modifier: ABNORMAL

    explanation: >-
      A quantified heart-rate-reserve comparison between genotyped carriers and
      non-carrier relatives in the same family, which is the comparison the two
      case reports above cannot make.
  - reference: PMID:28465117
    reference_title: "A novel 'splice site' HCN4 Gene mutation, c.1737+1 G>T, causes familial bradycardia, reduced heart rate response, impaired chronotropic competence and increased short-term heart rate variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

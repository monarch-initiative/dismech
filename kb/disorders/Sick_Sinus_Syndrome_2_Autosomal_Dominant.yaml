- name: Chronotropic Incompetence
  category: Cardiovascular
  description: >-
    Failure of the heart rate to rise appropriately with metabolic demand. In
    SSS2 this is mechanistically distinct from the resting bradycardia: it
    follows from loss of cAMP-dependent modulation of the pacemaker current, so
    it is most pronounced for alleles that delete or uncouple the
    cyclic-nucleotide-binding domain. It is not universal — the G480R pore
    family had normal exercise capacity.
  phenotype_term:
    preferred_term: Chronotropic incompetence
    term:
      id: HP:0033992
      label: Chronotropic incompetence
  evidence:
  - reference: PMID:12750403
    reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the clinical, genetic, and in vitro data provide a likely
      explanation for the patient's sinus bradycardia and the chronotropic
      incompetence.
    explanation: >-
      Documents chronotropic incompetence in the index HCN4-573X patient and
      attributes it to the cAMP-insensitive pacemaker channel.
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."

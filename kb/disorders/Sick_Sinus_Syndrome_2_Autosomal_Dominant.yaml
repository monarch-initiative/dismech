    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected family members were asymptomatic with normal exercise
      capacity during long-term follow-up.
    explanation: >-
      Counter-evidence that chronotropic incompetence is not obligate in SSS2:
      the HCN4-G480R family retained normal exercise capacity.

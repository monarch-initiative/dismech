    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The cardiac pacemaker current I(f) is a major determinant of diastolic
      depolarization in sinus nodal cells and has a key role in heartbeat
      generation.
    explanation: >-
      Establishes the normal role of I_f in diastolic depolarization that is
      lost in SSS2.
  - reference: PMID:16407510
    reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes, which mimic those of mild vagal stimulation, slow the heart
      rate by decreasing the inward diastolic current.
    explanation: >-
      States the biophysical mechanism directly: less inward diastolic current
      slows the heart rate.
  - reference: PMID:23178648
    reference_title: "Altered HCN4 channel C-linker interaction is associated with familial tachycardia-bradycardia syndrome and atrial fibrillation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, heteromeric channels composed of mutant and wild-type
      subunits displayed a significant hyperpolarizing shift in the half-maximal

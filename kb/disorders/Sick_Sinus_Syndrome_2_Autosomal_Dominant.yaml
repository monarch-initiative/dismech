name: Sick Sinus Syndrome 2, Autosomal Dominant
creation_date: "2026-08-17T00:00:00Z"
category: Mendelian
description: >-
  Sick sinus syndrome 2 (SSS2) is the autosomal dominant, HCN4-related form of
  familial sinus node dysfunction. HCN4 encodes the pore-forming subunit of the
  hyperpolarization-activated, cyclic-nucleotide-gated pacemaker channel that
  carries the funny current (I_f), the inward current responsible for the early
  phase of diastolic depolarization in sinoatrial node pacemaker cells and for
  the cAMP-dependent autonomic modulation of heart rate. Heterozygous
  loss-of-function variants act either by shifting the voltage dependence of
  activation to more negative potentials, by dominant-negative suppression of
  wild-type subunits, by defective channel synthesis and trafficking, or by
  truncating the cyclic-nucleotide-binding domain so that the channel becomes
  cAMP-insensitive. The result is a smaller inward diastolic current, a slower
  rate of diastolic depolarization, and depressed sinoatrial automaticity —
  clinically, sinus bradycardia, sinus pauses, chronotropic incompetence,
  syncope, and a high burden of atrial fibrillation. A distinctive feature of
  the HCN4 form, not shared with the sodium-channel forms of familial sick
  sinus syndrome, is co-segregation of left ventricular noncompaction
  cardiomyopathy (and, in some pedigrees, dilation of the ascending aorta) with
  the bradycardia, indicating that the same channel lesion also perturbs
  myocardial development.

        found is bradycardia.
      explanation: >-
        A dedicated review of HCN4 channel mutations frames the disorder as a
        loss-of-function funny-channel channelopathy producing bradycardia.
inheritance:
- name: Autosomal dominant
  description: >-
    SSS2 segregates as an autosomal dominant trait. All reported disease
    variants are heterozygous, and the dominant mechanism is usually
    dominant-negative suppression of wild-type HCN4 subunits within the
    heterotetrameric channel rather than simple haploinsufficiency. Penetrance
    and expressivity vary widely, from asymptomatic sinus bradycardia detected
    only on screening to syncope requiring pacemaker implantation.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological testing performed on 2 affected family members
      confirmed significant isolated sinus node dysfunction. Segregation
      analysis suggested autosomal-dominant inheritance.
    explanation: >-
      Formal segregation analysis in a 16-member HCN4-G480R family established
      autosomal dominant transmission of isolated sinus node dysfunction.
  - reference: PMID:12750403
    reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coexpression experiments showed a dominant-negative effect of HCN4-573X
      subunits on wild-type subunits.
    explanation: >-
      Co-expression of mutant with wild-type subunits demonstrates the
      dominant-negative mechanism underlying dominant transmission.
mechanistic_hypotheses:
- hypothesis_group_id: sinoatrial_automaticity_failure_model
  hypothesis_label: Sinoatrial Pacemaker Automaticity Failure Model (HCN4 specialization)
  status: CANONICAL
  description: >-
    The disease-specific specialization of the module-level
    cardiac_ion_channel_repolarization group of the same name. In SSS2 the
    depressed current is specifically the hyperpolarization-activated funny
    current I_f carried by HCN4, so the bradyarrhythmia arises from a slowed
    diastolic depolarization slope in sinoatrial pacemaker cells rather than
    from depressed sodium-dependent conduction, and syncope follows from
    hypoperfusion during pauses rather than from ventricular tachyarrhythmia.
  evidence:
  - reference: PMID:16407510
    reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes, which mimic those of mild vagal stimulation, slow the heart
      rate by decreasing the inward diastolic current.
    explanation: >-
      Names the funny-current-specific route to bradycardia that distinguishes
      this specialization from the sodium-channel arm of the module group.
  - reference: PMID:26835093
    reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All mutations described so far are loss-of-function and in agreement with
      the role of funny channels, the predominant type of arrhythmia found is
      bradycardia.
    explanation: >-
      Confirms that the HCN4 arm of the model consistently yields bradyarrhythmia
      rather than tachyarrhythmia.
pathophysiology:
- name: HCN4 Loss-of-Function Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function variant in HCN4 alters the pore-forming
    subunit of the cardiac pacemaker channel. Reported disease alleles cluster
    in three structural regions with three corresponding biophysical
    consequences: pore-domain missense changes (G480R, G482R) that impair
    channel synthesis, trafficking, and gating; C-linker and
    cyclic-nucleotide-binding-domain changes (S672R, K530N) that shift
    activation gating; and C-terminal truncations (573X, 695X) that delete the
    cyclic-nucleotide-binding domain. All are heterozygous, and most act
    dominant-negatively on wild-type subunits within the heterotetramer.

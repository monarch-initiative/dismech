    term:
      id: GO:0005222
      label: intracellularly cAMP-activated cation channel activity
    modifier: DECREASED
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  locations:

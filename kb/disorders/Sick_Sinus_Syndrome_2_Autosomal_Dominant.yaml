prevalence:
- population: >-
    First-degree relatives of individuals with pacemaker-treated sinus node
    dysfunction, Denmark
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 790.0
  notes: >-
    Cumulative incidence of pacemaker-treated sinus node dysfunction by age 68
    was 0.79% in first-degree relatives against 0.27% in the general
    population, a rate ratio of 2.9 that rose to 5.5 when the index case was
    implanted at or before 60 years. Study design: nationwide register-based
    cohort, 6,027,090 individuals followed 1982 to 2022. This is heritable
    sinus node dysfunction at population scale and is not genotyped, so SSS2 is
    one of several contributing causes rather than the measured entity, and the
    recorded rate is the rate for that relative population, not a prevalence
    for SSS2. It is recorded because it is the only population-scale occurrence
    figure available for the familial form, and because the inverse
    relationship with onset age is the epidemiological shadow of exactly the
    early-onset Mendelian subgroup this entry describes. No general-population
    prevalence has been reported for SSS2 itself; the HCN4 shares of
    ascertained cohorts are recorded under genetic.case_fractions, which is the
    slot for a genetic-spectrum share.
  evidence:
  - reference: PMID:39535890
    reference_title: "Familial risk of sinus node dysfunction indicating pacemaker implantation: a nationwide cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The adjusted rate ratio (RR) of pacemaker-treated SND was 2.9 (2.4-3.6)
      for individuals having any father, mother, or sibling with a pacemaker
      implanted on this indication compared with the general population (derived
      cumulative incidence at the age of 68 years: 0.79 and 0.27%,
      respectively).
    explanation: >-
      Gives both the recorded cumulative incidence and its general-population
      comparator. The cohort is not genotyped, so the step from familial sinus
      node dysfunction to SSS2 specifically is an inference.
progression:
- phase: Prenatal and neonatal sinus bradycardia
  age_range: Second trimester through the neonatal period
  notes: >-
    The earliest detectable manifestation is a fetal heart rate below the
    gestational-age norm, which can be accompanied in utero by prominent left
    ventricular trabeculation. Neither the bradycardia nor the noncompaction is
    necessarily symptomatic at this stage, and de novo variants occur, so an
    unremarkable family history does not exclude SSS2 in a bradycardic fetus.
  evidence:
  - reference: PMID:39698436
    reference_title: "Fetal bradycardia associated with left ventricle noncompaction diagnosed as HCN4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal echocardiography revealed a normal fetal heart except for slightly
      prominent trabeculae in the left ventricle, normal cardiac function, and
      fetal sinus bradycardia with a heart rate of 100 bpm.
    explanation: >-
      Documents both arms of the SSS2 phenotype, bradycardia and trabecular
      noncompaction, at the fetal stage in a carrier later shown to have a
      heterozygous HCN4 in-frame deletion.
- phase: Asymptomatic childhood and adolescent bradycardia
  age_range: Childhood through adolescence
  notes: >-
    Carriers ascertained through family screening or through an incidental
    finding are often asymptomatic in this window, with resting bradycardia and
    noncompaction already present on imaging and no indication for a device.
    Being asymptomatic is not the same as being low risk: in the same family
    the adolescent proband was asymptomatic yet had 66 sinus pauses of three
    seconds or longer, the longest 10.5 seconds, and received a
    primary-prevention device. This is the phase in which cascade screening is
    most useful, since the structural findings are established well before
    symptoms.
  evidence:
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her cardiac investigations showed sinus bradycardia, borderline aortic
      dilatation on echocardiogram and mild biventricular dilatation, NNC, and
      normal systolic function on cardiac MRI
    explanation: >-
      A 13-year-old carrier identified by predictive family testing already has
      bradycardia, noncompaction and borderline aortic dilatation while
      remaining asymptomatic and device-free.
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His ambulatory electrocardiographic (ECG) monitoring revealed 66
      significant asymptomatic sinus pauses (≥3 seconds, the longest lasting
      10.5 seconds), mainly nocturnal
    explanation: >-
      Her 15-year-old brother, in the same family and the same age window, was
      equally asymptomatic yet carried a heavy pause burden and was implanted,
      which is why this phase is described as often rather than uniformly
      device-free.
- phase: Symptomatic sinus node dysfunction and device therapy
  age_range: Late adolescence through mid-adulthood
  notes: >-
    Clinical manifestation follows adolescence, with a mean age at diagnosis
    near 40 years and pacemaker implantation on average in the fifth decade.
    Both are decades earlier than sporadic sick sinus syndrome and roughly two
    decades later than the SCN5A form, which is what makes age at presentation
    a usable discriminator between the familial subtypes.
  evidence:
  - reference: PMID:28104484
    reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SSS with HCN4 mutations may form a distinct SSS subgroup characterized by
      early clinical manifestation after adolescence and frequent association
      with AF and LVNC.
    explanation: >-
      States the post-adolescent onset window and the accompanying atrial
      fibrillation and noncompaction burden that define this phase.
  - reference: PMID:28104484
    reference_title: "Sick sinus syndrome with HCN4 mutations shows early onset and frequent association with atrial fibrillation and left ventricular noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis of HCN4 mutation carriers showed a significantly younger age
      at diagnosis (39.1 ± 21.7 years) than in sporadic SSS (74.3 ± 0.4 years; P
      <.001), but a significantly older age than in SCN5A mutation carriers
      (20.0 ± 17.6 years; P = .003).
    explanation: >-
      Quantifies the age at diagnosis for this phase against both sporadic sick
      sinus syndrome and the SCN5A form.
- phase: Aortic dilatation, onset not reliably age-ordered
  age_range: Adolescence through adulthood; onset not reliably age-ordered
  notes: >-
    Ascending aortic and aortic root dilatation has been described as
    age-dependent in penetrance across HCN4 families, but it has also been
    found in a 15-year-old and a 13-year-old carrier while absent in their
    50-year-old mother, so it is not reliably ordered by age within a family.
    The practical consequence is that imaging surveillance cannot be deferred
    in a young carrier on the strength of the age-dependence claim.
  evidence:
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      20 of 26 patients (77%) and 6/9 (66.6%) patients with the p.Gly482Arg
      variant had aortic dilatation
    explanation: >-
      Reports how often aortic dilatation accompanies the HCN4 phenotype. The
      counts are this paper's summary of an earlier eight-family series rather
      than its own measurements, so the figure reaches this record through the
      review step.
  - reference: PMID:35257104
    reference_title: "Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much for a Single Diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we could not demonstrate the age-dependent penetrance of the aortic
      dilatation as it was already present in the younger members of this family
      and absent in the mother
    explanation: >-
      The same report's own family contradicts a strict age dependence, which is
      the reason this phase is recorded with a caveat rather than as a staged
      expectation.

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:17646576
      reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe an inherited, autosomal-dominant form of sinus node
        dysfunction caused by a missense mutation in the HCN4 ion channel pore.
      explanation: >-
        SSS2 is a disorder of cardiac impulse generation and belongs with the
        cardiovascular disorders.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:17646576
      reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Direct sequencing of the exons encoding HCN4 revealed a missense
        mutation, G480R, in the ion channel pore domain in all affected family
        members.
      explanation: >-
        SSS2 is a Mendelian single-gene disorder defined by a segregating HCN4
        variant, so it also belongs to the genetics Part.
  channelopathy_category:
    classification_value: cardiac channelopathy
    notes: >-
      SSS2 is a cardiac channelopathy of the pacemaker (funny) current rather
      than of a repolarizing current: the lesion depresses impulse generation in
      the sinoatrial node instead of destabilizing ventricular repolarization.
    evidence:
    - reference: PMID:26835093
      reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        All mutations described so far are loss-of-function and in agreement
        with the role of funny channels, the predominant type of arrhythmia
        found is bradycardia.
      explanation: >-
        A dedicated review of HCN4 channel mutations frames the disorder as a
        loss-of-function funny-channel channelopathy producing bradycardia.
inheritance:
- name: Autosomal dominant
  description: >-
    SSS2 segregates as an autosomal dominant trait. All reported disease
    variants are heterozygous, and the dominant mechanism is usually
    dominant-negative suppression of wild-type HCN4 subunits within the
    heterotetrameric channel rather than simple haploinsufficiency. Penetrance
    and expressivity vary widely, from asymptomatic sinus bradycardia detected
    only on screening to syncope requiring pacemaker implantation.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological testing performed on 2 affected family members
      confirmed significant isolated sinus node dysfunction. Segregation
      analysis suggested autosomal-dominant inheritance.
    explanation: >-
      Formal segregation analysis in a 16-member HCN4-G480R family established
      autosomal dominant transmission of isolated sinus node dysfunction.
  - reference: PMID:12750403
    reference_title: "Pacemaker channel dysfunction in a patient with sinus node disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coexpression experiments showed a dominant-negative effect of HCN4-573X
      subunits on wild-type subunits.
    explanation: >-
      Co-expression of mutant with wild-type subunits demonstrates the
      dominant-negative mechanism underlying dominant transmission.
mechanistic_hypotheses:
- hypothesis_group_id: sinoatrial_automaticity_failure_model
  hypothesis_label: Sinoatrial Pacemaker Automaticity Failure Model (HCN4 specialization)
  status: CANONICAL
  description: >-
    The disease-specific specialization of the module-level
    cardiac_ion_channel_repolarization group of the same name. In SSS2 the
    depressed current is specifically the hyperpolarization-activated funny
    current I_f carried by HCN4, so the bradyarrhythmia arises from a slowed
    diastolic depolarization slope in sinoatrial pacemaker cells rather than
    from depressed sodium-dependent conduction, and syncope follows from
    hypoperfusion during pauses rather than from ventricular tachyarrhythmia.
  evidence:
  - reference: PMID:16407510
    reference_title: "Familial sinus bradycardia associated with a mutation in the cardiac pacemaker channel."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes, which mimic those of mild vagal stimulation, slow the heart
      rate by decreasing the inward diastolic current.
    explanation: >-
      Names the funny-current-specific route to bradycardia that distinguishes
      this specialization from the sodium-channel arm of the module group.
  - reference: PMID:26835093
    reference_title: "HCN4, Sinus Bradycardia and Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All mutations described so far are loss-of-function and in agreement with
      the role of funny channels, the predominant type of arrhythmia found is
      bradycardia.
    explanation: >-
      Confirms that the HCN4 arm of the model consistently yields bradyarrhythmia
      rather than tachyarrhythmia.
pathophysiology:
- name: HCN4 Loss-of-Function Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function variant in HCN4 alters the pore-forming
    subunit of the cardiac pacemaker channel. Reported disease alleles cluster
    in three structural regions with three corresponding biophysical
    consequences: pore-domain missense changes (G480R, G482R) that impair
    channel synthesis, trafficking, and gating; C-linker and
    cyclic-nucleotide-binding-domain changes (S672R, K530N) that shift
    activation gating; and C-terminal truncations (573X, 695X) that delete the
    cyclic-nucleotide-binding domain. All are heterozygous, and most act
    dominant-negatively on wild-type subunits within the heterotetramer.
  genes:
  - preferred_term: HCN4
    term:
      id: hgnc:16882
      label: HCN4
  molecular_functions:

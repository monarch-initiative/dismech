  - reference: PMID:24607718
    reference_title: "A novel trafficking-defective HCN4 mutation is associated with early-onset atrial fibrillation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Our findings are consistent with HCN4 haploinsufficiency as the likely
      mechanism for early-onset AF in the p.Pro257Ser carrier.
    explanation: >-
      Adds a second route to the atrial fibrillation arm. This carrier's allele
      fails to reach the membrane and does not co-localise with wild-type
      channel, so the atrial phenotype here follows from simple
      haploinsufficiency rather than from the dominant-negative suppression
      that predominates elsewhere in SSS2. The carrier was ascertained from an
      early-onset atrial fibrillation cohort rather than a sinus node
      dysfunction one, so reading the finding into SSS2 takes an inference

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that sinus bradycardia in members of a large family was
      associated with a mutation in the gene coding for the pacemaker HCN4 ion
      channel.
    explanation: >-
      Sinus bradycardia is the defining familial phenotype in the founding HCN4
      pedigree.
  - reference: PMID:35328031
    reference_title: "Clinical Presentation of Left Ventricular Noncompaction Cardiomyopathy and Bradycardia in Three Families Carrying HCN4 Pathogenic Variants."

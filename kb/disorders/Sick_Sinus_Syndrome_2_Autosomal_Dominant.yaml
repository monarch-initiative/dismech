- name: Syncope and Sudden Cardiac Death
  conforms_to: "cardiac_ion_channel_repolarization#Syncope and Sudden Cardiac Death"
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Severe bradycardia or a prolonged sinus pause transiently abolishes
    effective cardiac output, producing presyncope and syncope from cerebral
    hypoperfusion; an unterminated pause carries a risk of asystolic sudden
    death. This is the shared clinical endpoint with the other inherited
    arrhythmia syndromes, reached in SSS2 through bradyarrhythmia rather than
    ventricular tachyarrhythmia. Prognosis is variable and allele-dependent:
    the G480R pore-domain family remained asymptomatic with normal exercise
    capacity throughout long-term follow-up and required no pacemaker.
  evidence:
  - reference: PMID:34383451
    reference_title: "Sinus Node Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 50% of patients present with cerebral hypoperfusion (e.g., syncope,
      presyncope, lightheadedness, cerebrovascular accident).
    explanation: >-
      Supports cerebral hypoperfusion (syncope/presyncope) as the clinical
      endpoint of symptomatic sinus node dysfunction.
  - reference: PMID:17646576
    reference_title: "Point mutation in the HCN4 cardiac ion channel pore affecting synthesis, trafficking, and functional expression is associated with familial asymptomatic sinus bradycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite its critical location, this mutation carries a favorable prognosis
      without the need for pacemaker implantation during long-term follow-up.
    explanation: >-
      Qualifies the outcome node: at least one HCN4 pore-domain allele carries a
      benign long-term course, so the outcome is allele- and family-dependent.

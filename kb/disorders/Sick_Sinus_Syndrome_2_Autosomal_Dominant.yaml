    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, HCN4 mutation carriers were more frequently associated with AF
      (43.8%) and LVNC (50%) and with older age at pacemaker implantation
    explanation: >-
      Quantifies atrial fibrillation at 43.8% of HCN4 mutation carriers,
      supporting the FREQUENT band (30-79%).
  - reference: PMID:23178648
    reference_title: "Altered HCN4 channel C-linker interaction is associated with familial tachycardia-bradycardia syndrome and atrial fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index patient developed tachycardia-bradycardia syndrome and
      persistent atrial fibrillation (AF) in an age-dependent fashion. Pedigree

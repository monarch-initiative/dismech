diagnosis:
- name: Brain Magnetic Resonance Imaging
  description: >-
    Contrast-enhanced brain MRI (including T2-weighted, FLAIR, and pre/post-gadolinium
    3D T1-weighted sequences) is the primary neuroimaging modality for detecting
    cortical-subcortical diffuse glioma lesions, Surgical planning, and RANO
    surveillance.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33293629
    reference_title: "EANO guidelines on the diagnosis and treatment of diffuse gliomas of adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Brain MRI, including T2-weighted, T2-weighted fluid-attenuated inversion recovery (FLAIR) sequences and 3D T1-weighted sequences before and after application of a gadolinium-based contrast agent, is the diagnostic gold standard to detect a brain tumour 17 ."
    explanation: EANO guidelines establish multiparametric brain MRI as the diagnostic gold standard for detecting diffuse brain tumors.
- name: IDH1 R132H and ATRX Immunohistochemistry
  description: >-
    Routine immunohistochemistry for mutant IDH1 R132H and nuclear ATRX
    retention screens diffuse gliomas and prompts 1p/19q codeletion testing when
    nuclear ATRX expression is preserved.
  diagnosis_term:
    preferred_term: Immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:33293629
    reference_title: "EANO guidelines on the diagnosis and treatment of diffuse gliomas of adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immunohistochemistry for mutant IDH1 R132H protein and nuclear expression of ATRX should be performed routinely in the diagnostic assessment of diffuse gliomas."
    explanation: EANO guidelines recommend routine IDH1 R132H and ATRX immunohistochemistry as the initial tissue diagnostic step.
- name: IDH1 Codon 132 and IDH2 Codon 172 DNA Sequencing
  description: >-
    Targeted DNA sequencing of IDH1 codon 132 and IDH2 codon 172 identifies
    non-canonical IDH1 variants and IDH2 R172 mutations (which are enriched in
    oligodendrogliomas) whenever IDH1 R132H immunohistochemistry is negative.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33293629
    reference_title: "EANO guidelines on the diagnosis and treatment of diffuse gliomas of adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "If immunohistochemistry for IDH1 R132H is negative, sequencing of IDH1 codon 132 and IDH2 codon 172 should be conducted in all WHO grade 2 and 3 diffuse astrocytic and oligodendroglial gliomas as well as in all glioblastomas of patients aged <55 years to enable integrated diagnoses according to the WHO classification and to guide treatment decisions."
    explanation: EANO guidelines mandate IDH1 codon 132 and IDH2 codon 172 sequencing in R132H-immunonegative oligodendroglial gliomas.
- name: 1p/19q Codeletion Testing (FISH or Molecular Copy-Number Analysis)
  description: >-
    Demonstration of whole-arm chromosome 1p and 19q codeletion—assessed by
    fluorescence in situ hybridization, microsatellite loss-of-heterozygosity
    analysis, or NGS/methylation copy-number profiling—is required alongside IDH
    mutation to establish the integrated WHO diagnosis.
  diagnosis_term:
    preferred_term: Fluorescence In Situ Hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:33293629
    reference_title: "EANO guidelines on the diagnosis and treatment of diffuse gliomas of adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "1p/19q codeletion status should be determined in all IDH-mutant gliomas with retained nuclear expression of ATRX."
    explanation: EANO guidelines require 1p/19q codeletion determination in ATRX-retained IDH-mutant gliomas to establish the diagnosis of oligodendroglioma.
  - reference: PMID:17021403
    reference_title: "Identification of der(1;19)(q10;p10) in five oligodendrogliomas suggests mechanism of concurrent 1p and 19q loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, interphase FISH showed net loss of 1p and 19q in 77% to 92% of cells, and microsatellite studies were consistent with 1p and 19q loss."
    explanation: Demonstrates diagnostic detection of concurrent 1p and 19q loss in oligodendrogliomas using interphase fluorescence in situ hybridization.
- name: Proton Magnetic Resonance Spectroscopy for 2-Hydroxyglutarate
  description: >-
    Non-invasive proton MR spectroscopy detects intratumoral D-2-hydroxyglutarate
    accumulation in IDH-mutant diffuse gliomas preoperatively.
  diagnosis_term:
    preferred_term: Magnetic Resonance Spectroscopy
    term:
      id: NCIT:C16810
      label: Magnetic Resonance Spectroscopy
  evidence:
  - reference: PMID:42133138
    reference_title: "Diagnostic accuracy of 1H-MRS in detecting the oncometabolite 2-hydroxyglutarate (2HG) in adult-type diffuse gliomas."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "When combined, the spectroscopy methods achieved 100% sensitivity, 85.7% specificity, and 93.7% overall accuracy in detecting 2HG."
    explanation: >-
      Demonstrates high diagnostic accuracy of proton MR spectroscopy for
      non-invasive detection of intratumoral 2-HG; marked INDIRECT because the
      cohort evaluated adult-type diffuse gliomas broadly rather than
      1p/19q-codeleted oligodendroglioma in isolation.
has_subtypes:
- name: Oligodendroglioma Grade 2
  description: >-
    Low-grade oligodendroglioma with IDH mutation and 1p/19q codeletion. Characterized
    by uniform round nuclei, perinuclear halos (fried egg appearance), delicate
    branching capillaries (chicken-wire vasculature), and low mitotic activity.
    Median survival exceeds 15 years with appropriate treatment.
- name: Oligodendroglioma Grade 3 (Anaplastic)
  description: >-
    Anaplastic oligodendroglioma with IDH mutation and 1p/19q codeletion. Shows
    increased cellularity, mitotic activity, microvascular proliferation, and/or
    necrosis. Despite high-grade features, chemosensitivity is retained and
    median survival is 10-15 years with combined chemoradiation.
pathophysiology:
- name: IDH1/2 Neomorphic Mutation
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Heterozygous IDH1 R132 or IDH2 R172 mutations produce D-2-hydroxyglutarate (2-HG),
    an oncometabolite causing epigenetic dysregulation through inhibition of
    alpha-ketoglutarate-dependent dioxygenases. This is an early clonal event shared
    with IDH-mutant astrocytomas.
  genes:
  - preferred_term: IDH1
    description: >-
      Heterozygous neomorphic missense mutation at codon R132 (most commonly
      R132H) converts alpha-ketoglutarate to D-2-hydroxyglutarate.
    term:
      id: hgnc:5382
      label: IDH1
  - preferred_term: IDH2
    description: >-
      Heterozygous neomorphic missense mutation at codon R172 generates
      D-2-hydroxyglutarate in mitochondrial isocitrate dehydrogenase 2.
    term:
      id: hgnc:5383
      label: IDH2
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NADP+) activity
    modifier: ABNORMAL
    term:
      id: GO:0004450
      label: isocitrate dehydrogenase (NADP+) activity
  evidence:
  - reference: PMID:40916936
    reference_title: "Isocitrate dehydrogenase mutation and microenvironment in gliomas: do immunotherapy approaches matter?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This unique immune microenvironment is shaped by 2-hydroxyglutarate (2-HG), an oncometabolite produced by mutant IDH."
    explanation: This abstract explicitly links mutant IDH to 2-HG production, supporting the neomorphic IDH mechanism.
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In glioma, IDH1 mutations are associated with increased histone methylation and decreased 5-hydroxylmethylcytosine (5hmC). Hence, tumor-derived IDH1 and IDH2 mutations reduce α-KG and accumulate an α-KG antagonist, 2-HG, leading to genome-wide histone and DNA methylation alterations."
    explanation: Links glioma IDH1 and IDH2 mutations directly to alpha-KG reduction and 2-HG accumulation driving epigenomic dysregulation.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    modifier: ABNORMAL
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: G-CIMP Hypermethylation Phenotype
    description: 2-HG accumulation causes global DNA hypermethylation
- name: 1p/19q Codeletion
  biological_scale: CELLULAR
  description: >-
    The 1p/19q codeletion results from an unbalanced translocation t(1;19)(q10;p10)
    occurring early in tumorigenesis. This leads to loss of tumor suppressor genes
    including CIC on 19q and FUBP1 on 1p. The codeletion is associated with
    oligodendroglial differentiation and exceptional chemosensitivity.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:37743332
    reference_title: "[Oligodendroglioma, IDH Mutation and 1p/19q Codeletion]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oligodendrogliomas were clearly defined as tumors with IDH mutations and 1p/19q codeletion by the World Health Organization(WHO)in 2016."
    explanation: "Abstract defines oligodendrogliomas by IDH mutation and 1p/19q codeletion."
  - reference: PMID:17021403
    reference_title: "Identification of der(1;19)(q10;p10) in five oligodendrogliomas suggests mechanism of concurrent 1p and 19q loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent loss of the der(1;19)(p10;q10) then results in the simultaneous 1p and 19q loss observed in oligodendroglioma with retention of the der(1;19)(q10;p10) seen in these cases."
    explanation: Establishes the unbalanced whole-arm t(1;19)(q10;p10) translocation and derivative loss as the cytogenetic mechanism of concurrent 1p and 19q codeletion.
  - reference: PMID:21817013
    reference_title: "Mutations in CIC and FUBP1 contribute to human oligodendroglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that the basis for the t(1;19) translocation is the unmasking of a tumor suppressor gene(s) on either chromosome 1p or 19q ( 2– 4 , 7 , 8 )."
    explanation: Explains how whole-arm 1p/19q loss unmasks somatically mutated tumor suppressor alleles on chromosomes 1p and 19q.
  biological_processes:
  - preferred_term: chromosome organization
    modifier: ABNORMAL
    term:
      id: GO:0051276
      label: chromosome organization
  downstream:
  - target: CIC/FUBP1 Tumor Suppressor Loss
    description: Codeletion removes key tumor suppressors on 1p and 19q
- name: G-CIMP Hypermethylation Phenotype
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation"
  description: >-
    Glioma CpG island methylator phenotype (G-CIMP) results from 2-HG-mediated
    inhibition of TET enzymes and histone demethylases. This leads to widespread
    promoter hypermethylation, altered gene expression, and blocked differentiation.
    G-CIMP is associated with favorable prognosis.
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
  biological_processes:
  - preferred_term: DNA methylation
    modifier: INCREASED
    term:
      id: GO:0006304
      label: DNA modification
  evidence:
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Here we demonstrate that 2-HG is a competitive inhibitor of multiple α-KG-dependent dioxygenases, including histone demethylases and the TET family of 5-methlycytosine (5mC) hydroxylases."
    explanation: Demonstrates direct competitive inhibition of histone demethylases and TET 5mC hydroxylases by D-2-hydroxyglutarate.
  downstream:
  - target: Oligodendroglial Tumorigenesis
    description: >-
      Genome-wide CpG island hypermethylation and histone hypermethylation
      block glial differentiation and promote oligodendroglial tumorigenesis.
- name: CIC/FUBP1 Tumor Suppressor Loss
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    CIC (Capicua) on 19q13 is mutated in approximately 70% of oligodendrogliomas,
    FUBP1 on 1p31 is mutated in approximately 15-30%, and inactivating NOTCH1
    mutations recur in a subset. Unmasked by 1p/19q loss of heterozygosity,
    these tumor suppressor mutations cooperate with IDH mutation to drive
    oligodendroglioma formation.
  genes:

      the sustained proliferation that produces a macroscopic tumor.
- name: Oligodendroglial Tumorigenesis
  biological_scale: TISSUE
  conforms_to: "oncometabolite_dioxygenase_inhibition#Oncometabolite-Driven Tumorigenesis with Differentiation Block"
  description: >-
    The combination of IDH mutation, 1p/19q codeletion, TERT promoter mutation,
    and CIC/FUBP1 mutations drives infiltrative oligodendroglioma formation.
    These tumors retain oligodendroglial lineage markers and maintain high
    sensitivity to alkylating DNA-damaging agents.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:37272516
    reference_title: "Vorasidenib in IDH1- or IDH2-Mutant Low-Grade Glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "IDH-mutant grade 2 oligodendrogliomas and astrocytomas grow continuously, albeit slowly, infiltrate the normal brain, and eventually become aggressive tumors with accelerated tumor growth and neovascularization, reflected by appearance of contrast enhancement on magnetic resonance imaging (MRI)."
    explanation: Documents continuous infiltrative parenchymal growth and eventual malignant progression of IDH-mutant oligodendrogliomas.
  downstream:

      label: negative regulation of cell population proliferation
  evidence:
  - reference: PMID:21817013
    reference_title: "Mutations in CIC and FUBP1 contribute to human oligodendroglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among other changes, we found that the CIC gene (homolog of the Drosophila gene capicua) on chromosome 19q was somatically mutated in six cases and that the FUBP1 gene ... on chromosome 1p was somatically mutated in two tumors. Examination of 27 additional oligodendrogliomas revealed 12 and 3 more tumors with mutations of CIC and FUBP1, respectively, 58% of which were predicted to result in truncations of the encoded proteins."
    explanation: Exome and validation sequencing of human oligodendrogliomas identifies recurrent truncating and inactivating somatic mutations in CIC on 19q and FUBP1 on 1p.
  - reference: PMID:22072542
    reference_title: "Concurrent CIC mutations, IDH mutations, and 1p/19q loss distinguish oligodendrogliomas from other cancers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIC mutations were highly associated with oligodendroglioma histology, 1p/19q co-deletion, and IDH1/2 mutation (p < 0.001)"
    explanation: Confirms tight co-occurrence of CIC tumor suppressor inactivation with IDH1/2 mutation and 1p/19q codeletion.
  downstream:
  - target: Oligodendroglial Tumorigenesis
    description: Loss of tumor suppressors promotes oligodendroglioma formation
- name: TERT Promoter Mutation and Telomerase Reactivation
  biological_scale: MOLECULAR
  conforms_to: "enabling_replicative_immortality#Telomere Maintenance Reactivation"
  description: >-
    Mutually exclusive hotspot mutations at C228T or C250T in the TERT promoter create
    de novo ETS transcription factor binding sites, upregulating TERT expression and
    reactivating telomerase. This is the disorder-specific telomere-maintenance lesion
    that lets the tumor clone escape replicative senescence. TERT promoter mutation is
    near-universal in tumors carrying both 1p/19q codeletion and IDH1/2 mutation, and
    is therefore effectively part of the molecular signature of this entity rather than
    a late progression event.
  genes:
  - preferred_term: TERT
    modifier: INCREASED
    term:
      id: hgnc:11730
      label: TERT
  molecular_functions:
  - preferred_term: telomerase activity
    modifier: INCREASED
    term:
      id: GO:0003720
      label: telomerase activity
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:23764841
    reference_title: "Upregulating mutations in the TERT promoter commonly occur in adult malignant gliomas and are strongly associated with total 1p19q loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TERT promoter mutations were observed in almost all tumors harboring concurrent total 1p19q loss and IDH1/2 mutations (98 %)."
    explanation: >-
      Establishes that TERT promoter mutation co-occurs with the defining 1p/19q-codeleted,
      IDH-mutant genotype in essentially every case, supporting its inclusion as a core
      node of this entity's pathograph rather than an incidental finding.
  - reference: PMID:23764841
    reference_title: "Upregulating mutations in the TERT promoter commonly occur in adult malignant gliomas and are strongly associated with total 1p19q loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression level of TERT in tumors carrying those mutations was on average 6.1 times higher than that of wild-type tumors, indicating that the mutated promoter leads to upregulation of TERT."
    explanation: >-
      Provides the mechanistic link from promoter mutation to TERT upregulation, which is
      the step this node asserts.
  - reference: PMID:23764841
    reference_title: "Upregulating mutations in the TERT promoter commonly occur in adult malignant gliomas and are strongly associated with total 1p19q loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that mutation of the TERT promoter is one of the major mechanisms of telomerase activation in gliomas."
    explanation: >-
      Supports telomerase reactivation as the functional consequence, the conserved endpoint
      this node conforms to in the enabling_replicative_immortality module.
  biological_processes:
  - preferred_term: telomere maintenance via telomerase

      term:
        id: NCIT:C152914
        label: Vorasidenib
  target_mechanisms:
  - target: IDH1/2 Neomorphic Mutation
    treatment_effect: INHIBITS
    description: >-
      Vorasidenib inhibits the mutant IDH1 and IDH2 enzymes directly, suppressing
      production of the D-2-hydroxyglutarate oncometabolite that drives the downstream
      epigenetic cascade. This is the drug-target edge for the entry: the therapy acts
      at the most upstream node of the pathograph.
    evidence:
    - reference: PMID:37272516
      reference_title: "Vorasidenib in IDH1- or IDH2-Mutant Low-Grade Glioma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Vorasidenib, an oral brain-penetrant inhibitor of mutant IDH1 and IDH2 enzymes, showed preliminary activity in IDH-mutant gliomas."
      explanation: >-

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0016695
      label: oligodendroglioma
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0859592 is a direct descendant of MONDO:0016695. Under the 2021 WHO CNS5
      classification the clinical name "oligodendroglioma" is reserved for tumors that
      are IDH-mutant and 1p/19q-codeleted, so in current practice the two labels pick
      out the same patients. The mapping is nonetheless recorded as broadMatch rather
      than exactMatch because MONDO:0016695 is defined morphologically and by grade
      ("A well-differentiated (WHO grade II), diffusely infiltrating neuroglial tumor...
      cells which morphologically resemble oligodendroglia"), which admits the retired
      pre-2016 histology-only concept and excludes grade 3 disease. Treating that as an
      exact match would assert an equivalence MONDO's own definition does not carry.


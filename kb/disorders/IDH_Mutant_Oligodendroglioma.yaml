- name: Vorasidenib
  description: >-
    Oral, brain-penetrant dual inhibitor of the mutant IDH1 and IDH2 enzymes,
    FDA-approved in August 2024 for grade 2 astrocytoma or oligodendroglioma with a
    susceptible IDH1/IDH2 mutation following surgery. It is the first therapy directed
    at the founding molecular lesion of this disease rather than at tumor bulk, and it
    is positioned in the post-surgical setting where radiotherapy and chemotherapy are
    being deferred. Transaminase elevation is the characteristic dose-limiting toxicity
    and requires liver function monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:

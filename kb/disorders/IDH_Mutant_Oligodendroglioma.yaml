      label: CIC
  - preferred_term: FUBP1
    modifier: DECREASED
    term:
      id: hgnc:4004
      label: FUBP1
  - preferred_term: NOTCH1
    modifier: DECREASED
    term:
      id: hgnc:7881
      label: NOTCH1
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  - preferred_term: single-stranded DNA binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003697
      label: single-stranded DNA binding
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:

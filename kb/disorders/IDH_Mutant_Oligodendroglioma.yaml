  description: >-
    Temozolomide is used as a more tolerable alkylating alternative to PCV, often
    concurrently with radiation followed by adjuvant cycles. Its role as a
    substitute for radiotherapy is not supported: in the initial CODEL design,
    grade 3 codeleted patients randomized to temozolomide alone had significantly
    shorter progression-free survival than those on the radiotherapy arms, and the
    trial was redesigned to compare radiotherapy plus PCV against radiotherapy plus
    temozolomide rather than temozolomide alone. Temozolomide monotherapy in place
    of radiotherapy should therefore not be inferred from this entry.

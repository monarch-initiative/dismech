    vesicles and their steady-state levels fall, separating them from the anterograde
    cargo they should modify. In COG3-CDG patient fibroblasts, a panel of Golgi and
    endolysosomal resident proteins showed perturbations in selected glycoproteins and
    Golgi enzymes; the individual enzymes are reported only in supplementary data, so
    the named examples here come from COG3 knockdown cells.
  biological_processes:

  downstream:
  - target: Golgi Glycosylation Enzyme Mislocalization
    causal_link_type: DIRECT
    description: >
      Retrograde recycling is how medial- and trans-Golgi enzymes are kept in place;
      without it they are separated from the cargo they should modify.
    evidence:

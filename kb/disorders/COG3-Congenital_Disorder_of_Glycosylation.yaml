inheritance:
- name: Autosomal Recessive
  description: >
    Homozygous COG3 missense variants in two consanguineous families, each segregating
    with disease and each lying within a large region of absence of heterozygosity.
    No biallelic truncating COG3 genotype has been reported; null alleles in lobe A
    genes are proposed to be embryonic lethal.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37711075
    reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we report two COG3 homozygous missense variants in four individuals
      from two unrelated consanguineous families that co-segregated with COG3-CDG
      presentations.
    explanation: >-
      Homozygous variants co-segregating with disease in two consanguineous families
      establish the recessive mode.
  - reference: PMID:37711075
    reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, biallelic complete LoF variants in any of four Lobe-A genes have never
      been reported; we speculate that null alleles may not have been observed
      potentially due to the lethality of losing both diploid genome copies of the
      Lobe-A gene during early embryonic stages of development.
    explanation: >-
      Explains why the recessive genotypes seen are missense rather than null.
  - reference: PMID:28848061
    reference_title: "Hypothesis: lobe A (COG1-4)-CDG causes a more severe phenotype than lobe B (COG5-8)-CDG."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This represents a frequency gap which suggests that bi-allelic truncating
      mutations in COG lobe A genes might be non-viable.
    explanation: >-
      Made about lobe A COG-CDG before any COG3 patient was known, so it bears on
      COG3 only by lobe membership; graded INDIRECT for that reason.

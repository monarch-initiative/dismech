    snippet: >-
      Biochemical analysis of serum transferrin from two affected individuals in
      family 1 showed aberrant sialyation with a higher ratio of "tri-sialo" via Mayo
      Clinic electrospray ionization mass spectrometry (Figure 2A).
    explanation: The assay and its result in COG3-CDG.
- name: Exome sequencing
  description: >
    Both families were diagnosed by family-based exome sequencing with Sanger
    confirmation; the variants lie in large runs of homozygosity, as expected in
    consanguineous families.
  evidence:
  - reference: PMID:37711075
    reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family-based ES analysis and Sanger dideoxy DNA sequencing in these two families
      identified two different rare, homozygous COG3 missense variant alleles
    explanation: The diagnostic route used in both families.
discussions:
- discussion_id: cog3cdg_trafficking_to_neurology_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which glycoproteins, in which neural cell types, link the COG3 trafficking and
    sialylation defect to microcephaly and epilepsy?
  attaches_to:
  - pathophysiology#Deficient Protein Sialylation
  - pathophysiology#Severe Neurodevelopmental Disorder with Epilepsy and Microcephaly
  rationale: >
    The only patient material studied is skin fibroblasts, and serum glycans were
    measured in one family. The steps between enzyme mislocalisation and
    hyposialylation are supported by COG3 knockdown and knockout cells rather than
    patient cells. No neuronal model of COG3 deficiency is reported.
- discussion_id: cog3cdg_heterozygote_and_second_locus
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do heterozygous COG3 variants have any phenotype, and how much of the Pakistani
    family's neuromuscular picture is due to the homozygous SCN4A variant?
  attaches_to:
  - genetic#COG3
  - phenotypes#Skeletal muscle atrophy
  rationale: >
    In the Pakistani family a heterozygous 33-year-old brother had mild intellectual
    disability and seizures, and the proband is homozygous for an SCN4A variant of
    uncertain significance. With two families known, neither observation can be
    resolved.

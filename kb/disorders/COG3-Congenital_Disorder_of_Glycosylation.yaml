notes: >
  Only one publication describes patients (PMID:37711075, four patients, two families,
  two alleles), so every clinical count here comes from that series and fibroblast
  data exist for one allele. Steps between trafficking failure and hyposialylation
  rely on COG3 siRNA knockdown (HeLa) and CRISPR knockout (HEK293T) studies, graded
  INDIRECT. Lobe A COG-CDG is proposed to be more severe than lobe B COG-CDG, with
  biallelic truncating lobe A genotypes possibly non-viable (PMID:28848061); COG3-CDG
  fits that pattern but was described afterwards. No GeneReviews or StatPearls
  chapter covers COG3-CDG (checked against the 2026-09-10 Bookshelf index and a live
  PubMed title search on the entry name and synonyms). MONDO records no Orphanet
  cross-reference for MONDO:0957820. Phenotype frequency bands are omitted because
  the only denominators are four patients. The craniofacial features, raised lactate,
  poor weight gain, muscle wasting, gait disturbance, spasticity and contractures
  have no causal edge: no source connects them to the Golgi trafficking defect, and
  the neuromuscular findings in the Pakistani family may reflect a second (SCN4A)
  locus.

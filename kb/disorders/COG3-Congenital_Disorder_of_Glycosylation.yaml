- name: Impaired Golgi Retrograde Vesicular Transport
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >
    COG-dependent vesicle tethering drives intra-Golgi and Golgi-to-ER retrograde
    transport, the route by which resident glycosylation enzymes are recycled to their
    cisternae. In COG3-CDG fibroblasts, Brefeldin A-induced Golgi-to-ER retrograde
    transport is slower than in control and heterozygous parental cells, the shared
    cellular signature of COG deficiencies.

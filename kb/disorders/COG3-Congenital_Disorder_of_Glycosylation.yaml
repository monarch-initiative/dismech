experimental_models:
- name: COG3-CDG patient-derived skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >
    Fibroblasts from the Egyptian proband (homozygous p.Ser42Pro) and her heterozygous
    father, compared with three unrelated control lines. The only patient material in
    which the COG3-CDG cellular mechanism has been measured.
  modeled_mechanisms:
  - target: Reduced COG3 and COG4 Lobe A Subunit Levels
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    limitations: >-
      One patient line carrying one of the two known alleles; the p.Asp37His family
      had no biosamples available.
    readouts:
    - name: COG3 and COG4 protein by western blot
      target: Reduced COG3 and COG4 Lobe A Subunit Levels
      direction: DECREASED
      evidence:
      - reference: PMID:37711075
        reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Western blotting on patient-derived fibroblasts revealed reduced COG3 and
          COG4.
        explanation: The subunit measurement in patient fibroblasts.
  - target: Impaired Golgi Retrograde Vesicular Transport
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    limitations: >-
      Fibroblasts are not a neural cell type; the transport defect is measured in a
      tissue unrelated to the neurological phenotype.
    readouts:
    - name: Brefeldin A-induced retrograde transport kinetics
      target: Impaired Golgi Retrograde Vesicular Transport
      direction: DECREASED
      evidence:
      - reference: PMID:37711075
        reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Further experiments showed delayed retrograde vesicular recycling in patient
          cells.
        explanation: The retrograde transport readout in patient fibroblasts.
- name: COG3 knockout HEK293T cells
  experimental_model_type: CELL_LINE
  description: >
    CRISPR knockout of COG3 in HEK293T cells, part of a complete set of single-subunit
    COG knockouts. Models complete loss of COG3, which is more severe than the
    hypomorphic patient alleles and has never been observed in a patient.
  modeled_mechanisms:
  - target: Reduced COG3 and COG4 Lobe A Subunit Levels
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Complete knockout in an immortalised kidney-derived line rather than the
      patients' homozygous missense alleles.
    evidence:
    - reference: PMID:27066481
      reference_title: "COG Complex Complexities: Detailed Characterization of a Complete Set of HEK293T Cells Lacking Individual COG Subunits."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We have found that Cog3 and 4 protein levels were drastically impacted in
        Cog2, 3, and 4 KO cells indicating that these subunits are only stable in the
        context of lobe A subcomplex.
      explanation: Reproduces the COG3-COG4 co-dependence seen in patient cells.
  - target: Reduced Proteoglycan Glycosaminoglycan Chain Synthesis
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      No proteoglycan measurement exists in COG3-CDG patient material, so the
      model's fidelity for this node cannot be judged.
    evidence:
    - reference: PMID:34053170
      reference_title: "Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        COG3 knock out (KO) cells had particularly reduced ability to polymerize GAG
        chains.
      explanation: The proteoglycan readout in COG3 knockout cells.

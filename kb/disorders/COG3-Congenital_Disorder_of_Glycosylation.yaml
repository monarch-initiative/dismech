genetic:
- name: COG3
  notes: >
    COG3 (13q14) encodes a lobe A subunit of the conserved oligomeric Golgi complex.
    Two homozygous missense alleles are reported, NM_031431.4 c.109G>C p.(Asp37His)
    (Pakistani family) and c.124T>C p.(Ser42Pro) (Egyptian family), adjacent residues
    in a conserved N-terminal alpha-helix that mediates lobe A subunit assembly.
    Fibroblast studies were possible only for p.Ser42Pro. In the Pakistani family a
    33-year-old heterozygous brother had mild intellectual disability and seizures,
    and the proband was also homozygous for an SCN4A variant of uncertain
    significance; both observations are unexplained.
  gene_term:
    preferred_term: COG3
    term:
      id: hgnc:18619
      label: COG3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:37711075
    reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family-based ES analysis and Sanger dideoxy DNA sequencing in these two families
      identified two different rare, homozygous COG3 missense variant alleles,
      NM_031431.4: c.124T>C, p.(Ser42Pro) and NM_031431.4: c.109G>C, p.(Asp37His),
      that co-segregated with the disease phenotypes in each family
    explanation: >-
      The founding gene-disease report naming both alleles and their segregation.
  - reference: PMID:37711075
    reference_title: "Biallelic missense variants in COG3 cause a congenital disorder of glycosylation with impairment of retrograde vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These two COG3 missense variants are adjacent to each other and are predicted by
      conceptual translation to result in the alteration of amino acid residues in one
      highly conserved alpha-helix structure, conserved from humans to fish (Figure
      1J), located adjacent to the N-terminus of COG3.
    explanation: Locates both alleles in the same conserved N-terminal helix.
pathophysiology:
- name: Reduced COG3 and COG4 Lobe A Subunit Levels
  biological_scale: MOLECULAR
  description: >
    The homozygous N-terminal missense alleles lower COG3 protein, and COG4 falls with
    it while COG1 and COG2 are preserved. The variants sit in the region COG3 uses to
    assemble with the other lobe A subunits, so the proposed lesion is destabilisation
    of lobe A. Remaining COG3 retains partial function: the allele is hypomorphic, not
    null. COG3 knockout cells show the same COG3-COG4 co-dependence, supporting it as a
    general property of lobe A rather than an allele-specific finding.

name: COG3-Congenital Disorder of Glycosylation
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >
  COG3-CDG (CDG-IIbb) is an autosomal recessive type II congenital disorder of
  glycosylation caused by biallelic missense variants in COG3, a subunit of lobe A
  of the conserved oligomeric Golgi (COG) complex. It was delineated in 2023 in four
  affected individuals from two unrelated consanguineous families, from Egypt and
  Pakistan, each homozygous for a different missense variant (p.Asp37His and
  p.Ser42Pro) in a conserved alpha-helix near the COG3 N-terminus, a region that
  mediates assembly with the other lobe A subunits.

  The clinical picture is a severe neurodevelopmental disorder: global developmental
  delay, severe intellectual disability, absent speech, early-onset and often
  drug-resistant epilepsy (myoclonic and tonic seizures from 8 months to 2 years),
  severe microcephaly (-4 to -6 SD), facial dysmorphism, hypotonia and nystagmus.
  Brain MRI in the Egyptian sibship showed cerebral volume loss, delayed myelination,
  a thin corpus callosum and a small cerebellar vermis. Three of the five affected
  members of the two families died in childhood or adolescence.

  Mechanistically, patient fibroblasts show reduced COG3 and COG4 (lobe A) protein
  with COG1 and COG2 preserved, slowed Brefeldin A-induced Golgi-to-ER retrograde
  transport, and perturbed Golgi enzymes and glycoproteins; serum transferrin shows
  loss of a single sialic acid, a type II pattern. The p.Ser42Pro allele behaves as a
  hypomorph. Because only four patients and two alleles are known, the mechanism
  chain below leans on COG3 knockdown and knockout cell studies for the steps
  between trafficking failure and hyposialylation; those items are graded INDIRECT.

description: Congenital nongoitrous hypothyroidism 3 (CHNG3) is an autosomal dominant form of resistance to thyrotropin caused by noncoding variants in a short tandem repeat on chromosome 15q. The repeat lies between DET1 and MIR7-2; it is not a coding MIR7-2 lesion. Mutant repeat alleles activate thyroid-specific regulatory chromatin and increase expression of the downstream MIR7-2/MIR1179 locus. Persistent hyperthyrotropinemia can coexist with normal free thyroxine and clinical euthyroidism, although some patients require replacement therapy. A normal or small thyroid is typical, but adult multinodular enlargement has been reported, so lifelong absence of goiter is not a defining requirement.

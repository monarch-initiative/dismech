name: Congenital Nongoitrous Hypothyroidism 3
creation_date: '2026-11-20T22:11:06Z'
category: Genetic
synonyms:
- CHNG3
- Hypothyroidism, congenital, nongoitrous, 3
- Autosomal dominant resistance to thyrotropin linked to chromosome 15q25.3-q26.1
disease_term:
  preferred_term: congenital nongoitrous hypothyroidism 3
  term:
    id: MONDO:0012360
    label: congenital nongoitrous hypothyroidism 3
parents:
- Congenital Hypothyroidism
description: Congenital nongoitrous hypothyroidism 3 (CHNG3) is a dominant thyroid disorder caused by noncoding variants in a short tandem repeat between DET1 and MIR7-2 on chromosome 15q. It includes newborn-screen-detected congenital hypothyroidism and familial hyperthyrotropinemia; free thyroxine is commonly normal in both reported cohorts, although patients in the Japanese series usually required ongoing levothyroxine. Mutant repeat alleles alter thyroid-specific regulatory chromatin and increase MIR7-2/MIR1179 expression. The traditional thyrotropin-resistance interpretation and the downstream signaling model remain under investigation. Normal or small thyroid glands in childhood can progress to multinodular enlargement, so lifelong absence of goiter is not a defining requirement.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Heterozygous regulatory repeat variants segregate with thyrotropin resistance.
  evidence:
  - &id001
    reference: PMID:38714869
    reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we show that non-coding mutations in a (TTTG)4 short tandem repeat (STR) underlie dominantly inherited RTSH in all 82 affected participants from 12 unrelated families.
    explanation: Family sequencing links the repeat lesions to dominantly inherited thyrotropin resistance.
  - reference: PMID:15870119
    reference_title: 'Autosomal dominant resistance to thyrotropin as a distinct entity in five multigenerational kindreds: clinical characterization and exclusion of candidate loci.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Inheritance of RTSH in these families followed an autosomal dominant pattern without evidence for incomplete penetrance, yet expressivity was variable.
    explanation: The original clinical family study established the dominant inheritance pattern before identification of the repeat lesion.
genetic:
- name: Chromosome 15q regulatory short tandem repeat
  association: Causative noncoding regulatory variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: The physical lesion is in the intergenic repeat between DET1 and MIR7-2. MIR7-2 and MIR1179 are downstream expression targets; the adjacent DET1 gene is a positional landmark, not an established causal coding gene.
  variants:
  - name: (TTTG)4 to (TTTG)3 repeat contraction
    variant_type: deletion
    genomic_contexts:
    - intergenic region
    description: Deletion of one four-base repeat unit in the intergenic Alu-associated repeat. The Japanese study also documented a de novo contraction in family 67; most genotyped families showed parental transmission.
    regulatory_target_gene:
      preferred_term: MIR7-2
      term:
        id: hgnc:31639
        label: MIR7-2
    functional_effects:
    - function: Increased thyroid-specific MIR7-2/MIR1179 expression
      regulatory_element_type: ENHANCER
      description: Activation of an enhancer cluster and increased expression of the bicistronic microRNA locus; increased expression in its normal cell type does not by itself establish ectopic gain of expression.
    evidence:
    - reference: PMID:38714869
      reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The unaffected individuals in each family were homozygous for four repeats (STR 4/4), whereas all affected individuals were heterozygous for a deletion of one repeat (STR 4/3; Fig. 1b).
      explanation: The contraction segregated with disease in the reported families.
    - &id002
      reference: PMID:38714869
      reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Fiber-seq and RNA-seq studies revealed that the mutant STR activates a thyroid-specific enhancer cluster, leading to haplotype-specific upregulation of the bicistronic MIR7-2/MIR1179 locus 35 kb downstream and overexpression of its microRNA products in the participants' thyrocytes.
      explanation: Allele-resolved chromatin and RNA measurements in participant thyrocytes connect the repeat to enhancer activation and increased microRNA expression.
    - reference: PMID:38714868
      reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: De novo acquisition of (TTTG)3 was observed in one family (family 67; Supplementary Fig. 1).
      explanation: A de novo constitutional repeat contraction was observed, alongside predominantly inherited variants.
  - name: T-to-G substitution within the third TTTG repeat
    variant_type: single nucleotide variant
    genomic_contexts:
    - intergenic region
    description: A repeat-disrupting substitution changes the third repeat to TTGG; it is a distinct physical variant from the four-base contraction.
    regulatory_target_gene:
      preferred_term: MIR7-2
      term:
        id: hgnc:31639
        label: MIR7-2
    evidence:
    - reference: PMID:38714869
      reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RTSH segregated with a T > G substitution (absent in gnomAD; Extended Data Table 1) in the third repeat; TTGG instead of TTTG (further referred to as STR 4/4*; Fig. 1b and Table 1).
      explanation: Identifies the second lesion class within the same regulatory repeat.
  - name: GRCh38 chr15:88,569,448T>C repeat-disrupting substitution
    variant_type: single nucleotide variant
    genomic_contexts:
    - intergenic region
    description: The Japanese congenital hypothyroidism screen identified this T-to-C substitution in two patients. It is distinct from the T-to-G repeat lesion reported by Grasberger et al.
    evidence:
    - reference: PMID:38714868
      reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Further, 121 patients (73 families) with (TTTG)3 and two patients with a previously unreported single-nucleotide variant (SNV; GRCh38 chr15: 88,569,448T>C, designated as SNV) affecting the TTTG microsatellite were identified (Fig. 1d and Supplementary Fig. 1).'
      explanation: Specifies the repeat-disrupting SNV and its observation in two screened patients.
  evidence:
  - *id001
  - *id002
  - reference: PMID:16189712
    reference_title: Identification of a locus for nongoitrous congenital hypothyroidism on chromosome 15q25.3-26.1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genome wide scans conducted in two of the remaining five families revealed independently significant linkage to chromosome 15q25.3-26.1, with maximum multipoint LOD scores of 8.51 and 4.31.
    explanation: Historical family linkage establishes the chromosome interval behind the disease synonym; it did not yet identify the causal repeat.
  case_fractions:
  - population: Japanese congenital hypothyroidism cohort (Narumi et al.; positive newborn screen and elevated serum TSH by 2 months)
    case_fraction_percent: 13.9
    cohort_size: 989
    notes: 137 variant carriers among 989 patients collected across 119 Japanese institutions; a cohort-specific etiologic fraction, not population prevalence or penetrance. The separate MNG cohort had 3 carriers among 33 patients.
    evidence:
    - &id004
      reference: PMID:38714868
      reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Follow-up analyses with whole-genome sequencing and genetic screening in congenital hypothyroidism and MNG cohorts showed that changes in a noncoding TTTG microsatellite on 15q26.1 were frequently observed in congenital hypothyroidism (137 in 989) and MNG (3 in 33) compared with controls (3 in 38,722).
      explanation: Records variant enrichment in the separately ascertained Japanese congenital hypothyroidism and multinodular-goiter cohorts; these are not population penetrance estimates.
    - reference: PMID:38714868
      reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In the whole congenital hypothyroidism patient cohort (n = 989), (TTTG)3 and SNV accounted for 13.9% of cases
      explanation: Directly reports the rounded fraction of the full 989-patient cohort.

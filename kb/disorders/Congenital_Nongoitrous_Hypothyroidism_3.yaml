- name: Thyroid Regulatory Chromatin Activation
  description: Variant-associated enhancer activation and reduced local repressor activity are complementary regulatory observations from two studies; they do not establish every intervening molecular step.
  evidence:
  - *id002
  - reference: PMID:38714868
    reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Characterization of the noncoding variants with epigenomic data and in vitro experiments suggested that the microsatellite is located in a thyroid-specific transcriptional repressor, and its activity is disrupted by the variants.
    explanation: Epigenomic analysis and reporter experiments support disruption of thyroid-specific repressor activity.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  downstream:
  - target: MIR7-2 and MIR1179 Overexpression
    description: The activated regulatory region is associated with increased transcription of the downstream microRNA locus.
    evidence:
    - *id002
- name: MIR7-2 and MIR1179 Overexpression
  description: Participant thyrocytes show haplotype-specific upregulation of the bicistronic locus and increased microRNA products.
  evidence:
  - *id002
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MIR7-2
    term:
      id: hgnc:31639
      label: MIR7-2
  - preferred_term: MIR1179
    term:
      id: hgnc:35260
      label: MIR1179
  downstream:
  - target: Thyrocyte Signaling Imbalance
    description: Proposed microRNA-mediated disturbance of signaling; the particular downstream targets responsible for resistance remain incompletely resolved.
    evidence:
    - &id003
      reference: PMID:38714869
      reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Based on our transcriptome analysis, we propose a working model for STRmut pathophysiology consisting of an antiproliferative effect of MIR7–5P overexpression in thyrocytes 29 accompanied by increased activation of EGF(-like) downstream signaling
      explanation: Transcriptomic interpretation proposes a signaling model; this is not direct proof of all causal microRNA targets.
- name: Thyrocyte Signaling Imbalance
  description: A proposed downstream model connects excess microRNAs with altered signaling and reduced thyroid responsiveness. Direct repression of TSHR is not asserted.
  evidence:
  - *id003
  biological_scale: CELLULAR
  downstream:
  - target: Resistance to Thyrotropin
    description: The authors propose that altered signaling explains the observed thyrotropin resistance.
    evidence:
    - *id003
  mechanism_confidence: HYPOTHETICAL
- name: Resistance to Thyrotropin
  description: The historical thyrotropin-resistance model describes elevated TSH with frequently preserved free T4. Both cohorts commonly had compensated biochemistry. The Japanese authors questioned defective TSH signaling and considered overcompensation; a single proximal signaling lesion is not established.
  evidence:
  - reference: PMID:38714869
    reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All participants with STRmut had serum TSH values above the upper limit of the reference range indicating complete penetrance
    explanation: Elevated TSH was observed across the phenotyped mutant carriers.
  - reference: PMID:38714869
    reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Average serum free thyroxine (FT4) was slightly lower in participants with STRmut but, except for one individual, still within the population reference range
    explanation: The cohort commonly retained free thyroxine within the reference range.
  - &id005
    reference: PMID:38714868
    reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Serum TSH levels were moderately elevated, but free T4 levels were usually within the reference interval
    explanation: The Japanese cohort also commonly had compensated hypothyroidism, despite frequent ongoing replacement requirements.
  - reference: PMID:38714868
    reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: However, we observed no clinical evidence of defective TSH signaling in variant carriers, but rather overcompensation of the signal was presumed—goiter, increased blood flow and increased thyroidal iodine uptake.
    explanation: 'Qualifies the historical resistance model: the second cohort proposed overcompensation, so defective signaling is not established for all carriers.'
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL

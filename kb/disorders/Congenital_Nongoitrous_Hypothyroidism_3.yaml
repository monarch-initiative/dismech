  evidence:
  - reference: PMID:38714869
    reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Second, a subset of STRmut carriers appeared to be paradoxically prone to develop symptomatic proliferative thyroid disease later in life.
    explanation: The study reports later-life proliferative thyroid disease in a subset.
  - reference: PMID:38714869
    reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific enhancer of MIR7-2/MIR1179.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In fact, 3 of 82 STRmut heterozygous individuals (3.66%) required surgery because of enlarged nodular glands.
    explanation: Reports nodular enlargement requiring surgery in a subset.
  - reference: PMID:38714868
    reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By sequencing 33 patients with MNG followed at Kuma Hospital, Kobe, we identified two patients with (TTTG)3 and one with SNV (Supplementary Fig. 1). This frequency (3 in 33) was significantly higher than the general Japanese population (P < 1.2 × 10−8).
    explanation: An independent MNG cohort supports the association; its small sample is not a generalizable population frequency.
  - reference: PMID:38714868
    reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune thyroid abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The untreated or treatment-discontinued cases showed a characteristic transition of the clinical manifestation from nongoitrous congenital hypothyroidism to MNG, linking the two thyroid abnormalities that had been thought to be distinct.
    explanation: The study observed transition from childhood hypothyroidism to multinodular goiter.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "and c.458C>T;p.(Pro153Leu) mutations in this Irish population with severe TMAU"
      explanation: Reports recurrent severe FMO3 alleles including p.Pro153Leu.
    - reference: PMID:31240165
      reference_title: The genetic and biochemical basis of trimethylaminuria in an Irish cohort.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for the common variant haplotype"
      explanation: Documents common hypomorphic FMO3 haplotypes underlying milder presentations.

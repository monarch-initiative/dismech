- name: Genetic Counseling
  description: 'Genetic counseling for autosomal recessive inheritance: parents of an affected individual
    are obligate heterozygotes, and each sibling has at conception a 25% chance of being affected, a 50%
    chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier. Biochemical
    testing of at-risk siblings and prenatal or preimplantation genetic testing are available once familial
    FMO3 pathogenic variants are identified.'
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:

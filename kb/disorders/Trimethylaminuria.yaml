notes: >-
  This entry models the primary, FMO3-related form of trimethylaminuria
  (MONDO:0018767; OMIM:602079; Orphanet:468726). Secondary/acquired
  trimethylaminuria (from hepatic disease, precursor overload, or transient
  states such as menstruation) shares the biochemical and odour phenotype but is
  not caused by FMO3 variants and is out of scope here. Low-dose riboflavin
  (an FAD precursor) is sometimes used to maximise residual FMO3 activity, and
  acidic soaps/lotions can reduce cutaneous odour, but these adjuncts are not
  captured as evidence-backed treatments in this increment. Curated as the first
  methylamine-metabolism new-entry increment for IEMbase WP-006 (issue #5561).

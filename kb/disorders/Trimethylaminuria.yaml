treatments:
- name: Dietary precursor restriction
  description: First-line management is dietary restriction of trimethylamine and its precursors—including
    choline (eggs, liver, kidney, peas, beans, peanuts, soya products, brassicas), lecithin and lecithin-containing
    fish oil supplements, and trimethylamine N-oxide (marine fish, cephalopods, crustaceans)—as well as
    FMO3 inhibitors such as indoles (in brassicas) and circumstances that promote sweating. Diet must
    be monitored to meet daily choline and folate requirements, with no restriction of dietary choline
    during pregnancy and lactation.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Trimethylamine accumulation and excretion
    treatment_effect: INHIBITS
    description: Restricting dietary TMAO and choline reduces gut microbial TMA production and systemic
      TMA accumulation.
    evidence:
    - reference: PMID:21451776
      reference_title: 'Trimethylaminuria: causes and diagnosis of a socially distressing condition.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The symptoms of trimethylaminuria can be improved by changes in the diet to avoid precursors,
        in particular TMAO which is found in high concentrations in marine fish.
      explanation: Dietary avoidance of TMA precursors lowers TMA accumulation and improves malodour symptoms.

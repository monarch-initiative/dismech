  prevalence_class: RARE
  notes: 'A rare, almost certainly under-diagnosed disorder known predominantly from case reports and
    small cohorts; population-based rates are not established. Mild and transient presentations linked
    to common hypomorphic FMO3 haplotypes are more frequent than the severe primary form.

    '
  evidence:
  - reference: PMID:31240165
    reference_title: The genetic and biochemical basis of trimethylaminuria in an Irish cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Inherited trimethylaminuria (TMAU), a rare genetic disorder of hepatic metabolism of trimethylamine

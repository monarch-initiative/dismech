  variants:
  - name: Biallelic inactivating FMO3 variants
    description: >
      Severe primary TMAU results from homozygous or compound-heterozygous
      inactivating FMO3 variants. Recurrent severe alleles include the
      catalytically inactivating p.Pro153Leu missense variant and the
      p.Glu305* nonsense variant; milder/intermittent disease is associated with
      common hypomorphic haplotypes (e.g., p.Glu158Lys;p.Glu308Gly).
    evidence:

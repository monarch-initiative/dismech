      disorder.
    explanation: Characterises inherited TMAU as a rare genetic disorder.
progression:
- phase: Severity spectrum (mild/transient to severe primary)
  notes: 'Clinical severity ranges from mild or intermittent odour (unmasked by hormonal changes, menstruation,
    or a high substrate/precursor load, often on a background of common hypomorphic FMO3 haplotypes) to
    severe, constant malodour in individuals homozygous or compound heterozygous for inactivating FMO3
    variants. In milder or intermittent cases the biochemical abnormality may only be demonstrable after
    a high-substrate (marine-fish) challenge meal.

    '
  evidence:
  - reference: PMID:21451776
    reference_title: 'Trimethylaminuria: causes and diagnosis of a socially distressing condition.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis of trimethylaminuria requires the measurement of TMA and TMAO in urine, which should
      be collected after a high substrate meal in milder or intermittent cases, most simply, a marine-fish
      meal.
    explanation: Notes intermittent/milder cases requiring a high-substrate challenge for detection.
pathophysiology:
- name: Impaired hepatic trimethylamine N-oxidation (FMO3 deficiency)
  description: 'Biallelic loss-of-function FMO3 variants reduce or abolish hepatic flavin-containing monooxygenase
    3 activity, the enzyme that catalyses the NADPH- and FAD-dependent N-oxidation of trimethylamine to
    trimethylamine N-oxide. This is the rate-limiting detoxication step for gut-derived TMA in the liver.

    '

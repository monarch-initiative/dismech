name: Trimethylaminuria
category: Mendelian
creation_date: '2026-07-08T00:00:00Z'
synonyms:
- TMAU
- Primary trimethylaminuria
- Fish odor syndrome
- Fish-odour syndrome
- Fish malodor syndrome
- FMO3 deficiency
- Flavin-containing monooxygenase 3 deficiency
description: >
  Trimethylaminuria (TMAU, "fish-odour syndrome") is an autosomal recessive
  inborn error of methylamine metabolism caused by biallelic loss-of-function
  variants in FMO3, which encodes hepatic flavin-containing monooxygenase 3.
  FMO3 normally N-oxidises the volatile, fishy-smelling amine trimethylamine
  (TMA) — produced by gut bacteria from dietary precursors such as choline and
  trimethylamine-N-oxide (TMAO) — to the odourless, water-soluble TMAO, which is
  excreted in urine. When FMO3 activity is deficient, unoxidised TMA accumulates
  and is excreted in the urine, sweat, saliva, and breath, producing a
  characteristic body odour reminiscent of rotting fish. The condition is
  biochemically benign but frequently causes serious psychosocial harm (social
  isolation, depression). Disease severity spans a spectrum from mild/transient
  forms (often associated with common hypomorphic FMO3 haplotypes, hormonal
  state, or high substrate load) to severe primary TMAU caused by two
  inactivating FMO3 alleles; secondary/acquired forms (e.g., hepatic disease,
  substrate overload) also occur and are not caused by FMO3 variants. This
  entry models the primary, FMO3-related disorder (OMIM:602079,
  Orphanet:468726).

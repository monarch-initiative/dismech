- name: Fishy body odour and psychosocial impact
  description: >
    The excreted volatile trimethylamine gives affected individuals a body odour
    reminiscent of rotting fish. Although the disorder is otherwise benign, the
    stigmatising odour commonly causes profound psychosocial harm, including
    social isolation, clinical depression, and, rarely, suicidality.
  evidence:

notes: This entry models the primary, FMO3-related form of trimethylaminuria (MONDO:0018767; OMIM:602079;
  Orphanet:468726), incorporating the GeneReviews baseline (PMID:20301282). Secondary/acquired trimethylaminuria
  (from hepatic disease, precursor overload, or transient states) shares the biochemical and odour phenotype
  but is not caused by FMO3 variants and is out of scope here.
references:
- reference: PMID:20301282
  title: Primary Trimethylaminuria.
  tags:
  - GeneReviews
  findings:
  - statement: Clinical characteristics, diagnosis, dietary/pharmacologic management (including riboflavin,
      activated charcoal, copper chlorophyllin, gut antibiotics, and acid soaps), and autosomal recessive
      genetic counseling baseline for primary FMO3-related trimethylaminuria.
    supporting_text: Primary trimethylaminuria is characterized by a fishy odor resembling that of rotten
      or decaying fish that results from excess excretion of trimethylamine in the urine, breath, sweat,
      and reproductive fluids.

  evidence:
  - reference: PMID:9398858
    reference_title: Missense mutation in flavin-containing mono-oxygenase 3 gene, FMO3, underlies fish-odour
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder, colloquially known as fish-odour syndrome, is inherited recessively as a defect
      in hepatic N-oxidation of dietary-derived TMA and cannot be considered benign, as sufferers may
      display a variety of psychosocial reactions, ranging from social isolation of clinical depression
      and attempted suicide.
    explanation: Establishes recessive inheritance of the primary disorder.

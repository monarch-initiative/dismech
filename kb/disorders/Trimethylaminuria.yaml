    explanation: Notes intermittent/milder cases requiring a high-substrate challenge for detection.
pathophysiology:
- name: Impaired hepatic trimethylamine N-oxidation (FMO3 deficiency)
  description: >
    Biallelic loss-of-function FMO3 variants reduce or abolish hepatic
    flavin-containing monooxygenase 3 activity, the enzyme that catalyses the
    NADPH- and FAD-dependent N-oxidation of trimethylamine to trimethylamine
    N-oxide. This is the rate-limiting detoxication step for gut-derived TMA in
    the liver.

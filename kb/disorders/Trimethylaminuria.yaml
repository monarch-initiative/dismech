- name: Trimethylamine accumulation and excretion
  description: >
    Trimethylamine is generated by the gut microbiota from reduction of dietary
    precursors including trimethylamine-N-oxide (abundant in marine fish),
    choline, and carnitine. With hepatic N-oxidation impaired, the free amine
    accumulates and is excreted unchanged in urine, sweat, saliva, and expired
    air.

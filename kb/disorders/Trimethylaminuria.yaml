progression:
- phase: Severity spectrum (mild/transient to severe primary)
  notes: >
    Clinical severity ranges from mild or intermittent odour (unmasked by
    hormonal changes, menstruation, or a high substrate/precursor load, often on
    a background of common hypomorphic FMO3 haplotypes) to severe, constant
    malodour in individuals homozygous or compound heterozygous for inactivating
    FMO3 variants. In milder or intermittent cases the biochemical abnormality
    may only be demonstrable after a high-substrate (marine-fish) challenge meal.
  evidence:
  - reference: PMID:21451776

name: Porokeratosis
creation_date: "2026-08-01T05:30:00Z"
category: Mendelian
description: >-
  Porokeratosis is a heterogeneous group of disorders of keratinization defined
  histologically by the cornoid lamella, a vertical column of parakeratotic cells
  overlying a diminished granular layer that marks the advancing edge of an
  expanding clone of mutant keratinocytes. Most familial and many sporadic forms
  arise from loss-of-function variants in mevalonate-pathway genes (MVK, PMVK,
  MVD, FDPS). In these hereditary forms a lesion appears only when the germline
  heterozygous variant is joined by a second somatic hit in the wild-type allele
  within lesional epidermis - the classic Knudson two-hit clonal model. A
  non-hereditary localized form reaches the same biallelic state by a different
  route, somatic promoter hypermethylation of FDFT1, with no germline variant at
  all. Because the second hit
  in linear porokeratosis occurs prenatally in a single keratinocyte clone, that
  variant follows the lines of Blaschko as post-zygotic mosaicism, whereas
  disseminated superficial actinic porokeratosis (DSAP) reflects many
  independent, often UV-signature, postnatal second hits. Reduced mevalonate
  flux depletes cholesterol and the non-sterol isoprenoids farnesyl- and
  geranylgeranyl-pyrophosphate while allowing upstream intermediates to
  accumulate, impairing keratinocyte differentiation and protein prenylation and
  increasing apoptosis. This directly motivates topical cholesterol plus
  lovastatin as pathogenesis-directed therapy. Long-standing lesions carry a real
  risk of squamous cell carcinoma, highest in the linear form.

diagnosis:
- name: Skin biopsy of the raised lesional border
  description: >-
    The confirmatory test. The biopsy must sample the raised keratotic rim, not the
    atrophic centre, because the cornoid lamella - the diagnostic structure - sits
    within the rim; a punch taken from the centre will show only atrophic epidermis
    and miss the diagnosis. Histology should demonstrate a vertical column of
    parakeratosis over a diminished or absent granular layer with dyskeratotic
    keratinocytes beneath. Biopsy is mandatory whenever a lesion becomes nodular,
    indurated, ulcerated, bleeding or painful, in order to exclude keratinocyte
    carcinoma arising within it.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  results: >-
    A cornoid lamella establishes the diagnosis of porokeratosis; the clinical variant
    is then assigned on lesion morphology and distribution.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Porokeratosis is a phenotypically heterogeneous disorder characterized by the
      histopathological feature cornoid lamella, which is a vertical column of parakeratosis
      situated above dyskeratotic cells within the granular layer
    explanation: >-
      Defines the histological finding that the biopsy is performed to demonstrate.
  - reference: PMID:29722423
    reference_title: "Mutations in mevalonate pathway genes in patients with familial or sporadic porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis comprises heterogeneous keratinization disorders that are characterized
      by one or more atrophic patches surrounded by a ridge-like cornoid lamella.
    explanation: >-
      Locates the cornoid lamella in the raised rim rather than the atrophic centre, which
      is why the rim must be sampled.

- name: Dermoscopy of the lesion border
  description: >-
    Non-invasive first-line assessment. Dermoscopy of a porokeratotic lesion shows a
    sharply defined peripheral white-to-yellow keratotic track running around the
    lesion, the dermoscopic correlate of the cornoid lamella and often called the
    "Great Wall" sign. It is the feature that separates porokeratosis from actinic
    keratosis and other annular dermatoses at the bedside and guides where to place a
    confirmatory biopsy. Reflectance confocal microscopy and line-field confocal
    optical coherence tomography can add further non-invasive discrimination, but
    histopathology remains necessary whenever transformation is suspected.
  diagnosis_term:
    preferred_term: dermoscopy
    term:
      id: NCIT:C116478
      label: Dermoscopy
  results: >-
    A peripheral keratotic track corresponding to the cornoid lamella supports the
    diagnosis and identifies the correct biopsy site.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      introduces imaging methods facilitating the diagnosis (conventional and
      ultraviolet-induced fluorescence dermatoscopy, reflectance confocal microscopy and
      pathology)
    explanation: >-
      Establishes dermatoscopy and reflectance confocal microscopy as diagnostic imaging
      methods for porokeratosis; the abstract does not describe the specific dermoscopic
      pattern, hence PARTIAL.

- name: Mevalonate pathway gene panel
  description: >-
    Sequencing of MVK, PMVK, MVD and FDPS, with FDFT1 considered, on peripheral blood.
    Highest yield in familial, early-onset, disseminated, linear/segmental, mixed or
    atypical disease. Sequence plus copy-number analysis is preferable, and
    exome/genome sequencing can be used for panel-negative pedigrees. A negative blood
    panel does not exclude the diagnosis, because the non-hereditary FDFT1 form and
    some mosaic presentations carry no germline lesion.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous loss-of-function variant in MVK, PMVK, MVD or FDPS supports the
    diagnosis and enables cascade testing of relatives.
  evidence:
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 69 Chinese patients with porokeratosis, 22 pathogenic variants were detected in
      MVK, PMVK, MVD and FDPS, including 7 novel variants, 4 of which were validated via the
      'second-hit' mechanism.
    explanation: >-
      Establishes the four-gene panel and its diagnostic yield in a contemporary cohort.
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings enable porokeratosis subtyping guided by genetic testing and provide a
      foundation for developing molecularly integrated scoring systems to refine
      risk-stratified management.
    explanation: >-
      Supports the use of the panel for subtyping and risk stratification.

- name: Paired lesional and blood sequencing for the somatic second hit
  description: >-
    A research-grade but diagnostically decisive test in mosaic and non-hereditary
    disease: whole-exome sequencing of microdissected lesional epidermis alongside
    blood or saliva. It demonstrates the second hit - a copy-neutral loss of
    heterozygosity, a point mutation in trans, or, for FDFT1, promoter
    hypermethylation - that is confined to lesional skin. This is the only test that
    can confirm the two-hit mechanism in an individual patient and the only route to
    a molecular diagnosis in the germline-negative localized form.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A lesion-restricted somatic event on the allele opposite the germline variant, or
    biallelic somatic FDFT1 promoter hypermethylation in the absence of any germline
    variant.
  evidence:
  - reference: PMID:30942823
    reference_title: "Second-Hit, Postzygotic PMVK and MVD Mutations in Linear Porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paired whole-exome sequencing of affected skin and blood/saliva samples from 3
      participants from 3 academic medical centers with clinical and histologic diagnoses
      of linear porokeratosis.
    explanation: >-
      Describes exactly the paired lesional/blood design this test entry records.
  - reference: PMID:31207227
    reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we showed that each skin lesion of DSAP exhibited an individual second hit genetic
      change in the wild-type allele of the corresponding gene specifically in the
      epidermis
    explanation: >-
      Confirms that the somatic event is detectable specifically in lesional epidermis.

differential_diagnoses:
- name: Actinic keratosis
  disease_term:
    preferred_term: actinic keratosis
    term:
      id: MONDO:0005173
      label: actinic keratosis
  description: >-
    The single most frequent clinical mimic of DSAP: both present as multiple
    scaly, erythematous macules on chronically sun-exposed extensor limbs and face of
    older, fair-skinned adults, and both are UV-driven keratinocyte lesions.
  distinguishing_features:
  - Porokeratosis has a sharply demarcated, raised, ridge-like peripheral rim enclosing an atrophic centre; actinic keratosis has adherent rough scale without a discrete annular border.
  - Histology is decisive - the cornoid lamella (vertical parakeratotic column over a diminished granular layer) is present in porokeratosis and absent in actinic keratosis, which instead shows basal keratinocyte atypia.
  - Dermoscopy of porokeratosis shows a peripheral white-yellow keratotic track corresponding to the cornoid lamella.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Porokeratosis is a phenotypically heterogeneous disorder characterized by the
      histopathological feature cornoid lamella, which is a vertical column of parakeratosis
      situated above dyskeratotic cells within the granular layer
    explanation: >-
      Supplies the histological discriminator that separates porokeratosis from actinic
      keratosis.

- name: Seborrheic keratosis
  disease_term:
    preferred_term: seborrheic keratosis
    term:
      id: MONDO:0008420
      label: seborrheic keratosis
  description: >-
    Common benign pigmented keratotic papules and plaques that can be confused with
    porokeratosis of Mibelli, especially when brown and hyperkeratotic.
  distinguishing_features:
  - Seborrheic keratosis is a stuck-on, waxy, well-demarcated plaque with keratin-filled pseudocysts and comedo-like openings on dermoscopy; it lacks an annular rim and an atrophic centre.
  - Histology shows acanthosis with horn pseudocysts and no cornoid lamella.
  - Seborrheic keratoses have no association with the mevalonate pathway and no premalignant potential.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a heterogeneous group of keratinising disorders characterised by the
      presence of particular microscopic structural changes, namely the presence of the
      cornoid lamella.
    explanation: >-
      Establishes the required-for-diagnosis microscopic criterion that seborrheic keratosis
      does not meet; the snippet does not itself discuss seborrheic keratosis, hence PARTIAL.

- name: Bowen disease
  disease_term:
    preferred_term: Bowen disease of the skin
    term:
      id: MONDO:0020761
      label: Bowen disease of the skin
  description: >-
    Squamous cell carcinoma in situ. A well-demarcated erythematous scaly plaque that
    overlaps clinically with a solitary porokeratosis of Mibelli plaque. The
    relationship is not purely one of mimicry: SCC in situ can also arise within a
    long-standing porokeratotic lesion, so the two can coexist.
  distinguishing_features:
  - Bowen disease shows full-thickness keratinocyte atypia on histology, whereas uncomplicated porokeratosis shows a cornoid lamella without full-thickness atypia.
  - A porokeratotic plaque that becomes nodular, indurated, ulcerated, bleeding or painful should be biopsied to exclude transformation rather than assumed to be simple mimicry.
  evidence:
  - reference: PMID:8624658
    reference_title: "Porokeratosis and cutaneous malignancy. A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a premalignant condition, with certain groups of patients at
      greatest risk for malignant transformation.
    explanation: >-
      Supports the coexistence caveat that distinguishes this differential from simple
      look-alikes.

- name: Lichen planus
  disease_term:
    preferred_term: lichen planus
    term:
      id: MONDO:0006572
      label: lichen planus
  description: >-
    An inflammatory, intensely pruritic papulosquamous dermatosis that can resemble
    the annular or verrucous/ptychotropic porokeratosis variants, particularly in
    genital and intertriginous sites where annular lichen planus is common.
  distinguishing_features:
  - Lichen planus papules are violaceous, flat-topped and polygonal with Wickham striae; they lack a cornoid lamella.
  - Histology shows a lichenoid interface dermatitis with basal vacuolar degeneration, hypergranulosis and Civatte bodies - notably hypergranulosis, the opposite of the diminished granular layer beneath a cornoid lamella.
  - Lichen planus typically responds to topical corticosteroids, which give only transient antipruritic benefit in porokeratosis.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      which is a vertical column of parakeratosis situated above dyskeratotic cells within
      the granular layer
    explanation: >-
      Provides the granular-layer histological contrast used to separate porokeratosis from
      the hypergranulosis of lichen planus; the snippet does not discuss lichen planus,
      hence PARTIAL.

- name: Granuloma annulare
  disease_term:
    preferred_term: granuloma annulare
    term:
      id: MONDO:0006554
      label: granuloma annulare
  description: >-
    Annular skin lesions with a raised border and central clearing, the classic
    clinical differential for any annular dermatosis and a frequent misdiagnosis of
    porokeratosis of Mibelli.
  distinguishing_features:
  - The border of granuloma annulare is smooth, firm and dermal (non-scaly); the border of porokeratosis is keratotic and scaly with a palpable ridge and often a visible furrow.
  - Granuloma annulare is a dermal palisaded granulomatous process with mucin; the epidermis is normal and there is no cornoid lamella.
  - Granuloma annulare frequently resolves spontaneously, whereas porokeratosis shows no spontaneous resolution.
  evidence:
  - reference: PMID:41606785
    reference_title: "Topical statins in the treatment of porokeratosis: a systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a chronic disorder of keratinization associated with significant
      morbidity and no spontaneous resolution.
    explanation: >-
      Supports the no-spontaneous-resolution discriminator against granuloma annulare;
      the snippet does not itself discuss granuloma annulare, hence PARTIAL.

- name: Mevalonate kinase deficiency
  disease_term:
    preferred_term: mevalonate kinase deficiency
    term:
      id: MONDO:0017708
      label: mevalonate kinase deficiency
  description: >-
    The critical genetic - not clinical - differential, including its mild end,
    hyperimmunoglobulinemia D with periodic fever syndrome (HIDS). MVK variants cause
    both conditions, but the diseases are unrelated in presentation and must not be
    conflated. Mevalonate kinase deficiency is a systemic autoinflammatory disorder
    caused by germline biallelic (homozygous or compound heterozygous) MVK
    loss-of-function, spanning mevalonic aciduria at the severe end and HIDS at the
    mild end. Porokeratosis instead requires a germline monoallelic variant plus a
    somatic second hit restricted to epidermal keratinocytes. A striking and
    unresolved observation anchors the separation: patients with HIDS carry biallelic
    MVK loss of function in every cell, including keratinocytes, yet no porokeratosis
    lesions have been described in them. On a naive two-hit reading they should be the
    group most at risk, so this is a genuine paradox rather than a demonstration. The
    usual explanation is that the MVK alleles seen in HIDS are hypomorphic and retain
    residual enzyme activity, whereas the lesional second hit in porokeratosis produces
    a true clonal null, but this has not been formally tested.
  distinguishing_features:
  - Mevalonate kinase deficiency presents with recurrent febrile attacks, hepatosplenomegaly, lymphadenopathy, arthralgia, gastrointestinal symptoms and (in mevalonic aciduria) dysmorphism, failure to thrive, visual impairment and psychomotor retardation - none of which occur in porokeratosis.
  - The rash of mevalonate kinase deficiency is erythematous maculopapular or urticarial, not annular with a cornoid lamella.
  - Inheritance differs - biallelic germline (autosomal recessive) in mevalonate kinase deficiency versus monoallelic germline plus somatic second hit in porokeratosis.
  - Mevalonic aciduria shows markedly elevated urinary mevalonic acid; porokeratosis has no systemic biochemical abnormality.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      with mevalonic aciduria and hyperimmunoglobulinemia D with periodic fever syndrome
      (HIDS) representing the severe and mild ends of the clinical and biochemical spectrum
      of MKD, respectively
    explanation: >-
      Defines the mevalonate kinase deficiency spectrum that shares MVK with porokeratosis
      but is a different disease.
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      no porokeratosis lesions were described in patients with HIDS
    explanation: >-
      The decisive observation that biallelic germline MVK loss does not produce
      porokeratosis, keeping the two entities separate.
  notes: >-
    This differential is recorded because MVK, MVD, PMVK and FDPS are shared between
    the two disease groups and literature searches for these genes readily retrieve
    mevalonate kinase deficiency material. Nothing from the mevalonate kinase
    deficiency / HIDS autoinflammatory literature should be imported into this entry.

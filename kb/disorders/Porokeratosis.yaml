    reference_title: "Disseminated Superficial Actinic Porokeratosis: A Systematic Treatment Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple management options are available for DSAP, including topical and systemic
      agents, photodynamic therapy and laser treatments. However, these approaches vary
      in their balance between efficacy and toxicity.
    explanation: >-
      Systematic review supporting the availability but variable efficacy/toxicity of
      destructive and physical modalities; cryosurgery is not named in the abstract,
      hence PARTIAL.
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, long-term follow-up is a key component of treatment, which is usually
      complex and often unsatisfactory.
    explanation: >-
      Supports the requirement for continued follow-up after destructive treatment;
      the snippet does not name cryosurgery, hence PARTIAL.

- name: Photodynamic Therapy
  description: >-
    Topical photosensitizer plus light activation has been used for disseminated
    disease not amenable to individual lesion destruction. Reported response rates are
    modest and the procedure can be painful; it is a second-line option now largely
    superseded by pathway-directed topical statins.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:

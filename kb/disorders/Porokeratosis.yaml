  - reference: PMID:39485670
    reference_title: "Disseminated Superficial Actinic Porokeratosis: A Systematic Treatment Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, there is a paucity of high-quality clinical trial data to guide treatment

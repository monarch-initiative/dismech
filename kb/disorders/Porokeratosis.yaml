- name: Cholesterol and Non-Sterol Isoprenoid Depletion
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    The end-product arm of the metabolic lesion. Flux through the pathway falls, so
    the clone is starved of cholesterol - an essential membrane constituent and a
    major component of the extracellular lipid matrix of the stratum corneum - and,
    for blocks proximal to the prenyl-donor branch point, of the non-sterol
    isoprenoids farnesyl pyrophosphate (FPP) and geranylgeranyl pyrophosphate (GGPP).
    Which species are depleted depends on where the block sits: an MVK, PMVK or MVD
    block starves both the sterol and non-sterol branches, whereas an FDFT1 (squalene
    synthase) block lies below the branch point and depletes cholesterol only, with
    FPP spared or increased. Ultrastructurally the cholesterol deficit shows up as a
    reduced number of lamellar bodies and disrupted lamellar bilayer architecture in
    keratinocytes beneath the cornoid lamella. This is the arm that topical
    cholesterol replacement addresses.

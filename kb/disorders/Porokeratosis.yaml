        since an inflammatory infiltrate was located beneath the cornoid lamella, they
        suggested that the cornoid lamella might induce the inflammatory reaction
      explanation: >-
        The commentary states this as a suggestion requiring validation, hence PARTIAL.

- name: Perilesional Inflammatory Infiltrate
  biological_scale: TISSUE
  role: consequence
  description: >-
    A band-like lymphocytic infiltrate sits in the papillary dermis beneath the
    cornoid lamella and throughout lesional skin. It has been proposed both as a
    reaction induced by the cornoid lamella and as a constraint limiting further
    lateral expansion of the mutant clone; the mechanism is not settled. Accumulated
    mevalonate can activate innate immune responses and increase cytokine production,
    which is one proposed link between the metabolic block and the inflammatory
    component, and one reason topical statins may act as anti-inflammatory agents.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      since an inflammatory infiltrate was located beneath the cornoid lamella, they
      suggested that the cornoid lamella might induce the inflammatory reaction
    explanation: >-
      Documents the infiltrate and marks its causal relationship to the cornoid lamella
      as hypothesized rather than established.
  - reference: PMID:33005717
    reference_title: "Two percent lovastatin ointment as a pathogenesis-directed monotherapy for porokeratosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evidence has demonstrated that mevalonate accumulation can result in the activation
      of the innate immune response and increased cytokine production.
    explanation: >-
      Supplies the proposed metabolic-to-inflammatory link; the authors present it as a
      suggested rather than demonstrated mechanism in porokeratosis.
  downstream:
  - target: Pruritus
    causal_link_type: DIRECT
    description: >-
      The lesional inflammatory infiltrate underlies the itch reported by a substantial
      minority of patients, and is most prominent in the eruptive and
      verrucous/ptychotropic variants where pruritus dominates.
    evidence:
    - reference: PMID:41606785
      reference_title: "Topical statins in the treatment of porokeratosis: a systematic review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Porokeratosis is a chronic disorder of keratinization associated with significant
        morbidity and no spontaneous resolution.
      explanation: >-
        Supports persistent symptomatic morbidity; the inflammatory origin of pruritus is
        inferred rather than directly quoted, hence PARTIAL.

- name: Malignant Transformation to Keratinocyte Carcinoma
  biological_scale: TISSUE
  role: outcome
  description: >-
    Porokeratosis is a premalignant condition. In a review of 281 reported cases,
    7.5% harboured a malignancy arising within a porokeratotic lesion, most commonly
    cutaneous squamous cell carcinoma, with basal cell carcinoma next. Large lesions,
    lesions of long standing and the linear variant carry the greatest risk; in a
    contemporary genotype-phenotype cohort every patient with porokeratosis plus
    non-melanoma skin cancer carried an MVD variant. Because transformation can occur
    decades after onset, long-term surveillance rather than short-term clearance is
    the central management principle.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:8624658
    reference_title: "Porokeratosis and cutaneous malignancy. A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-one (7.5%) of 281 cases reported revealed a malignancy arising within
      porokeratosis. Large lesions, those of long-standing duration, and the linear type
      were at greatest risk.
    explanation: >-
      Quantifies the malignant risk and identifies the linear variant as highest risk.
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Porokeratosis is considered a premalignant condition, and higher rates of skin cancer
      have been described in linear and large plaques, with the most common malignancy being
      squamous cell carcinoma
    explanation: >-
      Independent confirmation that SCC is the dominant malignancy and linear disease the
      highest-risk variant.
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      100% (n = 6/6) of patients with porokeratosis plus nonmelanoma skin cancer and 71%
      (n = 17/24) of those with linear porokeratosis (LP) harboured MVD variants
    explanation: >-
      Supports the MVD genotype association with skin cancer and with linear disease.
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many authors consider it to be a premalignant condition because of the potential
      for malignant transformation to squamous cell or basal cell carcinoma.
    explanation: >-
      Sources both tumour types named in this node, including basal cell carcinoma.
  downstream:
  - target: Basal Cell Carcinoma Arising in a Lesion
    causal_link_type: DIRECT
    description: >-
      Basal cell carcinoma is the second-commonest malignancy arising within a
      porokeratotic lesion.
    evidence:
    - reference: PMID:32401728
      reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the potential for malignant transformation to squamous cell or basal cell
        carcinoma
      explanation: >-
        Names basal cell carcinoma as a transformation outcome.
  - target: Cutaneous Squamous Cell Carcinoma Arising in a Lesion
    causal_link_type: DIRECT
    description: >-
      Squamous cell carcinoma is the commonest malignancy arising by this route.
    evidence:
    - reference: PMID:31753123
      reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        with the most common malignancy being squamous cell carcinoma
      explanation: >-
        Names SCC as the dominant transformation outcome.

phenotypes:
- category: Cutaneous
  name: Porokeratotic Annular Plaque with Raised Keratotic Border
  description: >-
    The defining clinical lesion: one or more atrophic patches surrounded by a
    sharply demarcated, ridge-like hyperkeratotic border that corresponds to the
    cornoid lamella. Lesions expand centrifugally over years.
  phenotype_term:
    preferred_term: Porokeratosis
    term:
      id: HP:0200044
      label: Porokeratosis
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:29722423
    reference_title: "Mutations in mevalonate pathway genes in patients with familial or sporadic porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis comprises heterogeneous keratinization disorders that are characterized
      by one or more atrophic patches surrounded by a ridge-like cornoid lamella.
    explanation: >-
      The lesion is definitional for the disease, supporting VERY_FREQUENT and the
      diagnostic flag.

- category: Cutaneous
  name: Hyperkeratosis of the Lesional Rim
  description: >-
    Thickening of the stratum corneum forming the palpable keratotic ridge at the
    advancing lesion edge; parakeratotic within the cornoid lamella itself.
  phenotype_term:
    preferred_term: Hyperkeratosis
    term:
      id: HP:0000962
      label: Hyperkeratosis
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a heterogeneous group of keratinising disorders characterised by the
      presence of particular microscopic structural changes, namely the presence of the
      cornoid lamella.
    explanation: >-
      Supports the keratinizing/hyperkeratotic nature of the lesion border.

- category: Cutaneous
  name: Central Cutaneous Atrophy
  description: >-
    The skin enclosed by the advancing keratotic ring is thinned and atrophic,
    sometimes anhidrotic and hairless, reflecting the abnormal epidermis of the
    expanded mutant clone.
  phenotype_term:
    preferred_term: Thin skin
    term:
      id: HP:0000963
      label: Thin skin
  evidence:
  - reference: PMID:29722423
    reference_title: "Mutations in mevalonate pathway genes in patients with familial or sporadic porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by one or more atrophic patches surrounded by a ridge-like cornoid
      lamella
    explanation: >-
      Names the atrophic centre of the lesion.

- category: Cutaneous
  name: Photodistribution of Lesions on Sun-Exposed Skin
  description: >-
    In DSAP, lesions are concentrated on sun-exposed extensor surfaces of the arms
    and legs and often flare in summer, reflecting UV-signature second hits and the
    loss of MVK-mediated protection from UVA-induced keratinocyte apoptosis.
  subtype: DSAP
  notes: >-
    Deliberately left without an HPO binding. HP:0000992 Cutaneous photosensitivity was
    considered and rejected: its definition is an increased sensitivity of the skin to
    light diagnosable by phototesting, whereas what is observed in DSAP is a
    UV-mutagenesis-driven lesion distribution in patients who are not phototest-abnormal.
    Binding HP:0000992 would incorrectly cluster porokeratosis with xeroderma
    pigmentosum, the porphyrias and lupus in HPO-similarity searches.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the authors show that DSAP lesions result from second-hit somatic mitotic
      recombination or point mutations with a UV signature, validating the clinical
      observation that DSAP lesions arise upon sun exposed skin
    explanation: >-
      Ties the sun-exposed distribution to UV-induced second hits.

- category: Cutaneous
  name: Pruritus
  description: >-
    Itch affects a substantial minority of patients, particularly in DSAP and in the
    verrucous/ptychotropic and eruptive variants, where it can be the dominant
    symptom.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:41606785
    reference_title: "Topical statins in the treatment of porokeratosis: a systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a chronic disorder of keratinization associated with significant
      morbidity and no spontaneous resolution.
    explanation: >-
      Supports symptomatic morbidity in porokeratosis; the snippet does not itself name
      pruritus, so this evidence is PARTIAL.

- category: Cutaneous
  name: Palmoplantar Keratotic Papules
  description: >-
    Small keratotic papules on the palms and soles, each representing a minute
    cornoid lamella. Characteristic of the palmoplantar variants (PPPD and punctate
    porokeratosis), which typically begin in adolescence and may later generalize.
  phenotype_term:
    preferred_term: Palmoplantar keratoderma
    term:
      id: HP:0000982
      label: Palmoplantar keratoderma
  subtype: PPPD
  evidence:
  - reference: PMID:31449901
    reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled a series of 5 porokeratosis patients,1 with disseminated superficial
      actinic porokeratosis, 2 with porokeratosis palmaris et plantaris disseminata, and 2
      with linear porokeratosis.
    explanation: >-
      Documents palmoplantar disseminated porokeratosis as a recognized clinical
      presentation in a genotyped patient series.

- category: Neoplastic
  name: Cutaneous Squamous Cell Carcinoma Arising in a Lesion
  description: >-
    Invasive squamous cell carcinoma developing within a long-standing porokeratotic
    plaque. It is the commonest malignancy complicating porokeratosis and is most
    frequent in large, long-standing and linear lesions. The most-cited figure - 21 of
    281 (7.5%) - comes from a narrative review of published cases, so the denominator
    is reported cases rather than a defined cohort and the estimate is subject to
    ascertainment and publication bias; the source itself states that the true risk
    remains unknown.
  phenotype_term:
    preferred_term: Squamous cell carcinoma
    term:
      id: HP:0002860
      label: Squamous cell carcinoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:8624658
    reference_title: "Porokeratosis and cutaneous malignancy. A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-one (7.5%) of 281 cases reported revealed a malignancy arising within
      porokeratosis.
    explanation: >-
      The 7.5% pooled figure falls in the OCCASIONAL band (5-29%); the band is used with
      the caveat that the denominator is published cases, not a defined cohort.
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      with the most common malignancy being squamous cell carcinoma
    explanation: >-
      Identifies SCC as the dominant malignancy.

- category: Neoplastic
  name: Basal Cell Carcinoma Arising in a Lesion
  description: >-
    Basal cell carcinoma developing within a porokeratotic lesion. It is the
    second-commonest malignancy complicating porokeratosis, after squamous cell
    carcinoma.
  phenotype_term:
    preferred_term: Basal cell carcinoma
    term:
      id: HP:0002671
      label: Basal cell carcinoma
  frequency: VERY_RARE
  evidence:
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many authors consider it to be a premalignant condition because of the potential
      for malignant transformation to squamous cell or basal cell carcinoma.
    explanation: >-
      Establishes basal cell carcinoma as a recognized transformation outcome; it is
      reported less often than SCC, supporting the VERY_RARE band.

histopathology:
- name: Cornoid Lamella
  finding_term:
    preferred_term: Cornoid lamella (vertical parakeratotic column)
    term:
      id: NCIT:C34892
      label: Parakeratosis
  description: >-
    The pathognomonic finding. A tightly stacked, vertically oriented column of
    parakeratotic corneocytes traverses the stratum corneum, angled outward from the
    lesion centre. It sits in a small epidermal invagination and corresponds exactly
    to the raised clinical rim. Biopsy must therefore sample the raised border, not
    the atrophic centre.
  diagnostic: true
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Porokeratosis is a phenotypically heterogeneous disorder characterized by the
      histopathological feature cornoid lamella, which is a vertical column of parakeratosis
      situated above dyskeratotic cells within the granular layer
    explanation: >-
      Defines the cornoid lamella as a vertical parakeratotic column, the finding coded
      here.
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a heterogeneous group of keratinising disorders characterised by the
      presence of particular microscopic structural changes, namely the presence of the
      cornoid lamella.
    explanation: >-
      Establishes the cornoid lamella as the defining microscopic criterion for the whole
      disease group.
  notes: >-
    NCIT has no dedicated cornoid-lamella class; the closest reachable
    histopathology-branch term is Parakeratosis (NCIT:C34892), the specific keratinizing
    abnormality the lamella is composed of, so preferred_term carries the more specific
    clinical name. Multiple cornoid lamellae in a single specimen are common in linear
    and verrucous porokeratosis, and the number varies between samples even within one
    variant.

- name: Dyskeratotic Keratinocytes with Diminished Granular Layer
  finding_term:
    preferred_term: Dyskeratosis
    term:
      id: NCIT:C62570
      label: Dyskeratosis
  description: >-
    Directly under the cornoid lamella the stratum granulosum is thinned or lost and
    the underlying keratinocytes are dyskeratotic and vacuolated - the cellular
    correlate of failed terminal differentiation in the mutant clone. The epidermis
    of the lesion centre is atrophic.
  diagnostic: true
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which is a vertical column of parakeratosis situated above dyskeratotic cells within
      the granular layer
    explanation: >-
      Documents the dyskeratotic granular-layer cells that underlie the lamella.

- name: Subjacent Lymphocytic Inflammatory Infiltrate
  finding_term:
    preferred_term: Lymphocytic infiltrate
    term:
      id: NCIT:C35983
      label: Lymphocytic Infiltrate
  description: >-
    A lymphocytic infiltrate is present beneath the cornoid lamella and may extend
    throughout lesional skin. Its intensity is variable and it is prominent in
    eruptive and inflammatory variants.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inflammatory infiltrates, in DSAP as well as in other variants, can be visualized not
      only beneath the cornoid lamella
    explanation: >-
      Documents the infiltrate and its distribution beyond the lamella.

genetic:
- name: MVK
  gene_term:
    preferred_term: MVK
    term:
      id: hgnc:7530
      label: MVK
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Mevalonate kinase, the first enzyme after HMG-CoA reductase, phosphorylating
    mevalonate to 5-phosphomevalonate. The founding porokeratosis gene, identified by
    exome sequencing in DSAP families. Germline heterozygous loss-of-function
    variants were found in 33% of familial and 16% of sporadic DSAP cases. MVK
    lesional second hits characteristically take the form of chromosome 12-wide
    copy-neutral loss of heterozygosity. Note that biallelic germline MVK loss causes
    mevalonate kinase deficiency, a different disease (see differential_diagnoses).
  evidence:
  - reference: PMID:22983302
    reference_title: "Exome sequencing identifies MVK mutations in disseminated superficial actinic porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing in 57 individuals with familial DSAP and 25 individuals with
      sporadic DSAP identified MVK mutations in 33% and 16% of these individuals (cases),
      respectively.
    explanation: >-
      Establishes MVK as a causal DSAP gene and quantifies its contribution.
  case_fractions:
  - population: Chinese familial DSAP cohort
    case_fraction_percent: 33.0
    cohort_size: 57
    notes: Familial DSAP index cases with an identified MVK variant.
    evidence:
    - reference: PMID:22983302
      reference_title: "Exome sequencing identifies MVK mutations in disseminated superficial actinic porokeratosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing in 57 individuals with familial DSAP and 25 individuals with
        sporadic DSAP identified MVK mutations in 33% and 16% of these individuals (cases),
        respectively.
      explanation: Direct quantification of the familial MVK case fraction.
  - population: Chinese sporadic DSAP cohort
    case_fraction_percent: 16.0
    cohort_size: 25
    notes: Sporadic DSAP index cases with an identified MVK variant.
    evidence:
    - reference: PMID:22983302
      reference_title: "Exome sequencing identifies MVK mutations in disseminated superficial actinic porokeratosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing in 57 individuals with familial DSAP and 25 individuals with
        sporadic DSAP identified MVK mutations in 33% and 16% of these individuals (cases),
        respectively.
      explanation: Direct quantification of the sporadic MVK case fraction.

- name: PMVK
  gene_term:
    preferred_term: PMVK
    term:
      id: hgnc:9141
      label: PMVK
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Phosphomevalonate kinase. Germline heterozygous loss-of-function variants cause
    disseminated superficial and linear porokeratosis. PMVK was one of the three
    genes added to MVK by targeted sequencing of the isoprenoid pathway, and paired
    lesional/blood exome sequencing in linear porokeratosis demonstrated germline
    PMVK variants with a second somatic PMVK event (or copy-neutral LOH) confined to
    lesional skin.
  evidence:
  - reference: PMID:30942823
    reference_title: "Second-Hit, Postzygotic PMVK and MVD Mutations in Linear Porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One participant had a germline heterozygous PMVK c.329G>A mutation and a somatic
      copy-neutral loss of heterozygosity confined to the lesional skin, while a second had
      a germline heterozygous PMVK c.79G>T mutation and an additional PMVK c.379C>T mutation
      in the lesional skin.
    explanation: >-
      Variant-level demonstration of germline-plus-somatic PMVK involvement in linear
      porokeratosis.

- name: MVD
  gene_term:
    preferred_term: MVD
    term:
      id: hgnc:7529
      label: MVD
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Mevalonate diphosphate decarboxylase. Causal in DSAP, linear porokeratosis and
    PPPD. MVD carries the strongest genotype-phenotype signal in the group: it was
    found in every patient with porokeratosis plus non-melanoma skin cancer and in
    71% of linear porokeratosis cases in a large genotype-phenotype analysis, and its
    lesional second hit is characteristically 16q copy-neutral loss of heterozygosity.
  evidence:
  - reference: PMID:30942823
    reference_title: "Second-Hit, Postzygotic PMVK and MVD Mutations in Linear Porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a third participant, there was a germline splice-site mutation in MVD (c.70 + 5G>A)
      and a somatic deletion in MVD causing frameshift and premature codon termination
      within the lesional skin (c.811_815del, p.F271Afs*33 frameshift).
    explanation: >-
      Variant-level demonstration of the MVD germline-plus-somatic two-hit configuration.
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      100% (n = 6/6) of patients with porokeratosis plus nonmelanoma skin cancer and 71%
      (n = 17/24) of those with linear porokeratosis (LP) harboured MVD variants
    explanation: >-
      Supports the MVD genotype-phenotype correlation with skin cancer and linear disease.

- name: FDPS
  gene_term:
    preferred_term: FDPS
    term:
      id: hgnc:3631
      label: FDPS
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Farnesyl diphosphate synthase, which condenses isopentenyl pyrophosphate to
    farnesyl pyrophosphate at the branch point supplying both cholesterol and the
    non-sterol prenyl donors. Loss-of-function variants are the least common of the
    four canonical porokeratosis genes but follow the same germline-plus-somatic
    logic.
  evidence:
  - reference: PMID:26202976
    reference_title: "Genomic variations of the mevalonate pathway in porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified causal mutations in three novel genes (PMVK, MVD, and FDPS) in addition
      to MVK in the mevalonate pathway
    explanation: >-
      Establishes FDPS as a causal porokeratosis gene.

- name: FDFT1
  gene_term:
    preferred_term: FDFT1
    term:
      id: hgnc:3629
      label: FDFT1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    Squalene synthase, the first committed step of sterol-specific cholesterol
    synthesis downstream of FDPS. A fifth mevalonate-pathway gene, added in 2024,
    that reaches biallelic inactivation by a distinct route: somatic promoter
    hypermethylation. Localized, non-hereditary porokeratosis can be caused by
    somatic biallelic FDFT1 promoter hypermethylation, or mono-allelic
    hypermethylation plus a somatic variant in trans, with no germline lesion.
    Gene-specific hypermethylation detectable in adjacent normal-appearing epidermis
    suggests an asymptomatic epigenetically mosaic field that predisposes to lesions.
    A germline-plus-somatic FDFT1 hereditary form was also identified.
  evidence:
  - reference: PMID:38653249
    reference_title: "Gene-specific somatic epigenetic mosaicism of FDFT1 underlies a non-hereditary localized form of porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified non-hereditary porokeratosis associated with epigenetic silencing
      of FDFT1, another gene in the mevalonate pathway.
    explanation: >-
      Establishes FDFT1 as a causal gene acting through somatic epigenetic silencing.
  - reference: PMID:38653249
    reference_title: "Gene-specific somatic epigenetic mosaicism of FDFT1 underlies a non-hereditary localized form of porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some individuals with the localized form, gene-specific promoter hypermethylation
      of FDFT1 was detected in morphologically normal epidermis adjacent to
      methylation-related lesions but not distal to these lesions, suggesting that
      asymptomatic somatic epigenetic mosaicism of FDFT1 predisposes certain skin areas to
      the disease.
    explanation: >-
      Supports the predisposed epigenetic field described in this gene entry.

environmental:
- name: Ultraviolet radiation exposure
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  influences_mechanisms:
  - target: Somatic Second Hit in Lesional Keratinocytes
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The strongest exposure link in this tranche, and unusual in the backfill
      generally: ultraviolet light is not merely associated with the disease,
      it is the mutagen that writes the somatic second hit this node holds,
      and the second hits carry its signature. That makes sun protection a
      mechanistically justified preventive measure rather than generic advice.
    evidence:
    - reference: PMID:31753123
      reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The finding that some of the second-hit mutations have UV signatures proves the importance of sun protection as a preventive measure in DSAP."
      explanation: >-
        States that some second-hit mutations carry ultraviolet signatures and
        draws the sun-protection conclusion from it. The exposure is
        identified in the mutation itself, which is this node.
    - reference: PMID:32401728
      reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Porokeratosis has been associated with immunosuppression, ultraviolet radiation, and systemic, infectious, and neoplastic diseases."
      explanation: >-
        Review-level confirmation that the disease is associated with
        ultraviolet radiation. Association only, carried to show the link does
        not rest on a single study.
  description: >-
    UV is the clearest environmental modifier. DSAP lesions arise preferentially on
    sun-exposed extensor limbs and often flare in summer; second hits in DSAP lesions
    carry a UV mutational signature (C>T transitions), so UV is not merely an
    aggravating factor but a mutagenic cause of the somatic event that creates the
    lesion. This makes sun protection a mechanistically justified preventive measure.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The finding that some of the second-hit mutations have UV signatures proves the
      importance of sun protection as a preventive measure in DSAP.
    explanation: >-
      Directly links UV mutagenesis to lesion formation and to the preventive
      recommendation.
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis has been associated with immunosuppression, ultraviolet radiation, and
      systemic, infectious, and neoplastic diseases.
    explanation: >-
      Independent review-level confirmation of the UV association.

- name: Immunosuppression
  notes: >-
    Left ontologically unbound deliberately. ECTO's only immunosuppression
    term, ECTO:9001747, is defined as exposure to an immunosuppressive
    agent (RO:0002309 some CHEBI:35705) -- a drug exposure. This entry
    describes immunosuppression as a host state with non-drug causes, so
    that term would assert something the entry's own description rules
    out. No host-immunosuppression-state exposure term exists.
  influences_mechanisms:
  - target: Clonal Expansion of Second-Hit Keratinocytes
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded well below the ultraviolet link into this entry, and the
      difference is real rather than presentational: ultraviolet light creates
      the mutant clone, whereas immunosuppression appears to let an existing
      clone expand, which is why this points at the expansion node and not at
      the second hit. No cited sentence supplies the route, so the
      intermediates stay unknown.
    evidence:
    - reference: PMID:34418147
      reference_title: "Localized eruptive porokeratosis in pediatric patients following treatment of acute leukemia."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Porokeratosis is a rare diagnosis in the pediatric population, and eruptive disease has been documented prior in patients with history of stem cell transplantation."
      explanation: >-
        Documents eruptive disease in children after treatment for leukaemia
        and in prior stem-cell transplant recipients. A clinical association
        in a small paediatric series.
    - reference: PMID:32401728
      reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Porokeratosis has been associated with immunosuppression, ultraviolet radiation, and systemic, infectious, and neoplastic diseases."
      explanation: >-
        Review listing immunosuppression among the associations of this
        disease. The same sentence that supports the ultraviolet link, and
        equally general.
  description: >-
    Iatrogenic or disease-related immunosuppression - solid-organ or haematopoietic
    stem cell transplantation, HIV infection, haematologic malignancy, immunosuppressive
    drug therapy - can precipitate eruptive or disseminated porokeratosis and is
    thought to raise the risk of malignant transformation. Lesions may improve when
    immunosuppression is reduced.
  evidence:
  - reference: PMID:34418147
    reference_title: "Localized eruptive porokeratosis in pediatric patients following treatment of acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a rare diagnosis in the pediatric population, and eruptive disease
      has been documented prior in patients with history of stem cell transplantation.
    explanation: >-
      Documents the association between eruptive porokeratosis and post-transplant
      immunosuppression.
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis has been associated with immunosuppression, ultraviolet radiation, and
      systemic, infectious, and neoplastic diseases.
    explanation: >-
      Review-level confirmation of the immunosuppression association.

treatments:
- name: Topical Cholesterol Plus Lovastatin
  description: >-
    The pathogenesis-directed therapy for porokeratosis, and a direct read-out of the
    mechanism. Compounded 2% cholesterol plus 2% lovastatin cream applied twice daily
    simultaneously addresses both arms of the metabolic lesion: lovastatin inhibits
    HMG-CoA reductase upstream of the enzymatic block, preventing accumulation of
    potentially toxic mevalonate-pathway intermediates, while cholesterol replaces the
    missing pathway end-product. In the original case series, cholesterol/lovastatin
    but not cholesterol alone produced near-complete clearance of DSAP lesions within
    four weeks, with moderate improvement in PPPD and linear porokeratosis. The
    strategy is borrowed from CHILD syndrome, another disorder of distal cholesterol
    metabolism.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lovastatin
      term:
        id: CHEBI:40303
        label: lovastatin
    - preferred_term: cholesterol
      term:
        id: CHEBI:16113
        label: cholesterol
  target_mechanisms:
  - target: Mevalonate Pathway Intermediate Accumulation
    treatment_effect: INHIBITS
    description: >-
      The lovastatin component blocks HMG-CoA reductase upstream of the deficient
      enzyme, shutting off the supply of the intermediates that would otherwise build
      up behind the block.
    evidence:
    - reference: PMID:31449901
      reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        block the accumulation of mevalonate pathway toxic metabolites could alleviate
        porokeratosis
      explanation: >-
        States the statin arm of the dual mechanism.
  - target: Cholesterol and Non-Sterol Isoprenoid Depletion
    treatment_effect: INHIBITS
    description: >-
      The cholesterol component supplies the missing end-product directly to lesional
      keratinocytes, correcting the depletion arm; topical delivery bypasses hepatic
      first-pass metabolism and gives keratinocytes direct access to cholesterol.
    evidence:
    - reference: PMID:31449901
      reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesized that topical therapy that aims to replenish cholesterol, an
        essential mevalonate pathway end-product, and block the accumulation of mevalonate
        pathway toxic metabolites could alleviate porokeratosis.
      explanation: >-
        States the end-product replacement arm of the dual mechanism.
  evidence:
  - reference: PMID:31449901
    reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with topical cholesterol/lovastatin (but not cholesterol alone) resulted in
      near complete clearance of disseminated superficial actinic porokeratosis lesions
      after 4 weeks of therapy and moderate improvement of porokeratosis palmaris et
      plantaris disseminata lesions and linear porokeratosis lesions.
    explanation: >-
      Reports the clinical efficacy of the combination and the negative cholesterol-only
      control.
  - reference: PMID:31449901
    reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical cholesterol/lovastatin is an effective and well-tolerated therapy for
      porokeratosis that underscores the utility of a pathogenesis-based therapy that
      replaces deficient end products and prevents accumulation of potentially toxic
      precursors.
    explanation: >-
      The authors' own statement of the pathogenesis-directed rationale.
  - reference: PMID:41606785
    reference_title: "Topical statins in the treatment of porokeratosis: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients (79%) received compounded topical lovastatin 2% or
      simvastatin 2%, typically in combination with cholesterol 2%.
    explanation: >-
      Confirms the regimen and concentrations described here across the pooled literature.
  - reference: PMID:31449901
    reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A therapeutic approach preventing the accumulation of toxic metabolites while
      replenishing essential end-products has been successfully utilized in CHILD
      syndrome, an X-linked dominant disorder of distal cholesterol metabolism.
    explanation: >-
      Sources the CHILD syndrome precedent named in this treatment description.
  notes: >-
    There is no FDA-approved therapy for porokeratosis; these are off-label compounded
    formulations with attendant variability in quality and potency.

- name: Topical Statin Monotherapy
  description: >-
    Topical lovastatin 2% or simvastatin 2% without added cholesterol. A randomized
    clinical trial in DSAP found improvement in both the lovastatin-cholesterol and
    lovastatin-alone arms with only limited additional benefit from cholesterol,
    implying that blocking accumulation of upstream intermediates, rather than
    replacing cholesterol, is the dominant mechanism. A pooled systematic review of 95
    patients reported clinical improvement in 92%, with response as early as four
    weeks and mostly mild local adverse events.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lovastatin
      term:
        id: CHEBI:40303
        label: lovastatin
  target_mechanisms:
  - target: Mevalonate Pathway Intermediate Accumulation
    treatment_effect: INHIBITS
    description: >-
      Statin inhibition of HMG-CoA reductase prevents build-up of mevalonate and other
      intermediates upstream of the deficient enzyme, without replacing any
      end-product - which is why its efficacy argues that this arm dominates.
    evidence:
    - reference: PMID:33005717
      reference_title: "Two percent lovastatin ointment as a pathogenesis-directed monotherapy for porokeratosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesized that blocking the mevalonate synthesis pathway upstream of the MVD
        enzyme would be sufficient to alleviate his symptoms by preventing the accumulation
        of mevalonate pathway metabolites.
      explanation: >-
        States the single-arm mechanism targeted by statin monotherapy.
  evidence:
  - reference: PMID:36947042
    reference_title: "Safety and Efficacy of Topical Lovastatin Plus Cholesterol Cream vs Topical Lovastatin Cream Alone for the Treatment of Disseminated Superficial Actinic Porokeratosis: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This randomized clinical trial found improvements in DSAP severity in both treatment
      groups, without serious AEs, indicating a limited benefit with the addition of
      cholesterol.
    explanation: >-
      Randomized-trial evidence that statin monotherapy performs comparably to the
      cholesterol combination.
  - reference: PMID:36947042
    reference_title: "Safety and Efficacy of Topical Lovastatin Plus Cholesterol Cream vs Topical Lovastatin Cream Alone for the Treatment of Disseminated Superficial Actinic Porokeratosis: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that lovastatin cream may be a new primary treatment option for
      patients diagnosed with DSAP.
    explanation: >-
      The trialists' conclusion supporting statin monotherapy as a primary option.
  - reference: PMID:41606785
    reference_title: "Topical statins in the treatment of porokeratosis: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was observed in 92% of patients (87 of 95), with onset of response reported as early
      as 4 weeks.
    explanation: >-
      Pooled response rate and time to response across the topical-statin literature.
  notes: >-
    The systematic review notes that off-label compounded formulations introduce
    variability in efficacy and safety, and that adverse events occurred in 15% of
    patients, mostly mild localized dermatological reactions.

- name: Photoprotection and Sun Avoidance
  description: >-
    Because DSAP lesions arise from UV-signature somatic second hits, rigorous
    photoprotection - sun avoidance, protective clothing and broad-spectrum sunscreen -
    is a mechanistically grounded preventive measure rather than merely symptomatic
    advice. Unnecessary phototherapy should be avoided in affected individuals.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: photoprotection and sunlight avoidance
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Somatic Second Hit in Lesional Keratinocytes
    treatment_effect: INHIBITS
    description: >-
      Reducing UV exposure reduces the rate of UV-signature C>T second hits that create
      new lesions.
    evidence:
    - reference: PMID:31753123
      reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The finding that some of the second-hit mutations have UV signatures proves the
        importance of sun protection as a preventive measure in DSAP.
      explanation: >-
        Directly links photoprotection to prevention of the targeted second-hit node.
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The finding that some of the second-hit mutations have UV signatures proves the
      importance of sun protection as a preventive measure in DSAP.
    explanation: >-
      Direct statement of the mechanistic rationale for photoprotection.

- name: Surgical Excision of Suspicious or Localized Lesions
  description: >-
    Complete excision provides both definitive local control and histopathology, and
    is the appropriate response to a lesion showing rapid growth, nodularity,
    ulceration, bleeding, pain or induration. It is also reasonable for solitary
    porokeratosis of Mibelli plaques. Destructive alternatives include shave excision,
    curettage, electrosurgery, cryosurgery and ablative laser.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Malignant Transformation to Keratinocyte Carcinoma
    treatment_effect: INHIBITS
    description: >-
      Excising a transformed or suspicious lesion both treats and definitively excludes
      keratinocyte carcinoma.
    evidence:
    - reference: PMID:8624658
      reference_title: "Porokeratosis and cutaneous malignancy. A review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Porokeratosis is a premalignant condition, with certain groups of patients at
        greatest risk for malignant transformation.
      explanation: >-
        Establishes the premalignant risk that excision of suspicious lesions addresses;
        the snippet does not report excision outcomes, hence PARTIAL.
  evidence:
  - reference: PMID:8624658
    reference_title: "Porokeratosis and cutaneous malignancy. A review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis is a premalignant condition, with certain groups of patients at

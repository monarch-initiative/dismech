  - reference: PMID:39485670
    reference_title: "Disseminated Superficial Actinic Porokeratosis: A Systematic Treatment Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these approaches vary in their balance between efficacy and toxicity
    explanation: >-
      Supports the efficacy-toxicity caveat stated in this description.
  notes: >-
    The individual agent names (5-fluorouracil, imiquimod, acitretin, diclofenac,
    vitamin D analogues) are drawn from the deep-research synthesis and standard
    dermatologic practice; the cited systematic review abstract groups them as
    "topical and systemic agents" without naming each, so no agent-level
    therapeutic_agent bindings are asserted here.

- name: Genetic Counseling
  description: >-
    Counseling should explain autosomal dominant transmission of the germline variant,
    the requirement for a somatic second hit (and therefore the incomplete,
    age-dependent penetrance and variable expressivity), the mosaic basis of linear
    disease, and the lifelong but generally non-life-limiting course. Molecular
    diagnosis by an MVK/PMVK/MVD/FDPS panel, with FDFT1 considered, enables cascade
    testing of relatives.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 69 Chinese patients with porokeratosis, 22 pathogenic variants were detected in
      MVK, PMVK, MVD and FDPS, including 7 novel variants, 4 of which were validated via the
      'second-hit' mechanism.
    explanation: >-
      Supports the four-gene diagnostic panel and the second-hit validation step that
      genetic counseling rests on; the snippet does not itself address counseling
      practice, cascade testing or penetrance, hence PARTIAL.


- name: Conventional Topical and Systemic Agents
  description: >-
    The pre-statin therapeutic repertoire, still widely used and still supported only
    by case reports and small series. Topical options include 5-fluorouracil,
    imiquimod, retinoids, vitamin D analogues, diclofenac and corticosteroids;
    systemic acitretin is used for extensive or hyperkeratotic disease but relapses
    after withdrawal and carries mucocutaneous and metabolic toxicity. A 2025
    systematic review of 61 DSAP studies concluded that these options vary widely in
    their efficacy-toxicity balance and that high-quality trial data are lacking.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:39485670
    reference_title: "Disseminated Superficial Actinic Porokeratosis: A Systematic Treatment Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 923 citations, 61 studies were included, predominantly comprising case reports
      and retrospective case series.
    explanation: >-
      Characterizes the weak evidence base underlying the conventional agents.
  - reference: PMID:39485670
    reference_title: "Disseminated Superficial Actinic Porokeratosis: A Systematic Treatment Review."

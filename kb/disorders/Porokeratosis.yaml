inheritance:
- name: Autosomal dominant inheritance of the germline mevalonate pathway variant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Familial porokeratosis segregates as an autosomal dominant trait, with affected
    individuals carrying a monoallelic germline loss-of-function variant in MVK,
    PMVK, MVD or FDPS. The germline variant alone is not sufficient: clinically
    apparent lesions require an additional somatic event, which explains the
    incomplete, age-dependent penetrance. Expressivity is highly variable even
    within families, and several clinical variants can coexist in one individual.
  evidence:
  - reference: PMID:22983302
    reference_title: "Exome sequencing identifies MVK mutations in disseminated superficial actinic porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disseminated superficial actinic porokeratosis (DSAP) is an autosomal dominantly
      inherited epidermal keratinization disorder whose etiology remains unclear.
    explanation: >-
      Establishes the autosomal dominant transmission of the commonest porokeratosis
      variant.
  - reference: PMID:31207227
    reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with disseminated superficial actinic porokeratosis (DSAP) and linear
      porokeratosis (LP) exhibit monoallelic germline mutations in genes encoding
      mevalonate pathway enzymes, such as MVD or MVK.
    explanation: >-
      Confirms the monoallelic germline state that underlies dominant transmission.
- name: Somatic mosaicism of the second hit
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    Lesional skin is genetically mosaic. In linear porokeratosis a single
    post-zygotic second hit occurring in the embryonic period produces a
    Blaschko-linear clone; in DSAP each lesion carries its own independent
    postnatal second hit. Non-hereditary localized porokeratosis can arise from
    purely somatic biallelic FDFT1 promoter hypermethylation with no germline
    variant at all.
  evidence:
  - reference: PMID:30942823
    reference_title: "Second-Hit, Postzygotic PMVK and MVD Mutations in Linear Porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because linear porokeratosis manifests in the lines of Blaschko representing the
      dorsoventral migration patterns of keratinocyte precursors, it has been suggested
      that postzygotic somatic mutation underlies the disease.
    explanation: >-
      States the mosaic basis of the Blaschko-linear distribution that this inheritance
      block records.
  - reference: PMID:31207227
    reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second hits differed among DSAP lesions but were identical in those of
      congenital LP, suggesting that DSAP is attributable to sporadic postnatal second
      hits and congenital LP to a single second hit in the embryonic period.
    explanation: >-
      Directly distinguishes the mosaic (prenatal, single-clone) mechanism of linear
      porokeratosis from the multi-clone postnatal mechanism of DSAP.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Robust population prevalence estimates per 100,000 are not available. Reviews
    consistently characterize porokeratosis as an uncommon group of dermatoses;
    DSAP is the commonest variant and is enriched in fair-skinned populations
    living in high-ultraviolet settings.
  evidence:
  - reference: PMID:32401728
    reference_title: "Porokeratosis: A Review of Its Pathophysiology, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Porokeratosis comprises a group of heterogeneous and uncommon acquired or
      congenital skin diseases of unknown origin characterized by a keratinization
      disorder resulting from abnormal clonal expansion of keratinocytes.
    explanation: >-
      Supports the qualitative rare/uncommon occurrence class in the absence of a
      quantified population rate.

has_subtypes:
- name: DSAP
  display_name: Disseminated superficial actinic porokeratosis
  subtype_term:
    preferred_term: disseminated superficial actinic porokeratosis
    term:
      id: MONDO:0019212
      label: disseminated superficial actinic porokeratosis
  description: >-
    The commonest variant. Multiple small annular macules and papules with a fine
    keratotic rim, distributed symmetrically on sun-exposed extensor limbs, usually
    appearing in the third to fifth decades and often worsening in summer. Each
    lesion carries its own independent postnatal second hit, frequently bearing a
    UV mutational signature, which is why sun protection is a preventive measure.
  genes:
  - preferred_term: MVK
    term:
      id: hgnc:7530
      label: MVK
  - preferred_term: MVD
    term:
      id: hgnc:7529
      label: MVD
  evidence:
  - reference: PMID:31753123
    reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the authors show that DSAP lesions result from second-hit somatic mitotic
      recombination or point mutations with a UV signature, validating the clinical
      observation that DSAP lesions arise upon sun exposed skin
    explanation: >-
      Supports both the actinic distribution and the independent-second-hit basis of
      the DSAP subtype.
- name: Mibelli
  display_name: Porokeratosis of Mibelli
  subtype_term:
    preferred_term: porokeratosis of Mibelli
    term:
      id: MONDO:0019141
      label: porokeratosis of Mibelli
  description: >-
    One or a few slowly enlarging brown annular plaques with a sharply defined,
    prominent keratotic border, often beginning in childhood in hereditary disease.
    Limbs and trunk predominate, but palms, soles, scalp, face, mucosa and genital
    skin can be involved. Because Mibelli plaques are typically large and of long
    standing, they fall into the higher-risk group for malignant transformation
    identified in the pooled case literature.
  evidence:
  - reference: PMID:8624658
    reference_title: "Porokeratosis and cutaneous malignancy. A review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large lesions, those of long-standing duration, and the linear type were at
      greatest risk.
    explanation: >-
      Supports placing large, long-standing Mibelli plaques in the higher-risk group;
      the source does not report a Mibelli-specific rate, hence PARTIAL.
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disseminated superficial porokeratosis, porokeratosis of Mibelli, palmoplantar
      porokeratosis
    explanation: >-
      Confirms porokeratosis of Mibelli as one of the commonly recognised clinical
      variants of the porokeratosis group.
- name: Linear
  display_name: Linear porokeratosis
  subtype_term:
    preferred_term: linear porokeratosis
    term:
      id: MONDO:0023246
      label: linear porokeratosis
  description: >-
    Congenital or early-onset unilateral streaks of keratotic papules and plaques
    following the lines of Blaschko. It is the mosaic form: a single second hit in
    the embryonic period produces one keratinocyte clone whose descendants trace
    the dorsoventral migration pattern of keratinocyte precursors. Linear
    porokeratosis carries the highest reported risk of malignant transformation.
  genes:
  - preferred_term: PMVK
    term:
      id: hgnc:9141
      label: PMVK
  - preferred_term: MVD
    term:
      id: hgnc:7529
      label: MVD
  evidence:
  - reference: PMID:30942823
    reference_title: "Second-Hit, Postzygotic PMVK and MVD Mutations in Linear Porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that linear porokeratosis is associated with the presence of
      second-hit postzygotic mutations in the genes that encode enzymes within the
      mevalonate biosynthesis pathway
    explanation: >-
      Establishes the mosaic, second-hit genetic basis of the linear subtype and its
      PMVK/MVD gene assignment.
- name: PPPD
  display_name: Porokeratosis palmaris et plantaris disseminata
  subtype_term:
    preferred_term: porokeratosis plantaris palmaris et disseminata
    term:
      id: MONDO:0008291
      label: porokeratosis plantaris palmaris et disseminata
  description: >-
    Small keratotic papules that begin on the palms and soles, typically in
    adolescence or early adult life, and later become generalized to involve
    non-sun-exposed skin. Lesions may be pruritic or painful; nail dystrophy is an
    uncommon complication.
  evidence:
  - reference: PMID:31449901
    reference_title: "Topical cholesterol/lovastatin for the treatment of porokeratosis: A pathogenesis-directed therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      2 with porokeratosis palmaris et plantaris disseminata
    explanation: >-
      Documents PPPD as a distinct, genotyped clinical variant in a porokeratosis
      patient series.
- name: Punctate
  display_name: Punctate porokeratosis (punctate palmoplantar porokeratosis)
  description: >-
    A palmoplantar variant consisting of numerous tiny, seed-like keratotic plugs
    confined to the palms and soles, each of which is a minute cornoid lamella. It
    is grouped with PPPD under palmoplantar porokeratosis. No distinct non-obsolete
    MONDO class was identified for the punctate variant at curation time, so no
    subtype_term is bound.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      palmoplantar porokeratosis (including porokeratosis palmaris et plantaris
      disseminata and punctate porokeratosis)
    explanation: >-
      Confirms punctate porokeratosis as a recognized palmoplantar variant of the
      porokeratosis group.
- name: DSP
  display_name: Disseminated superficial porokeratosis
  description: >-
    The non-actinic counterpart of DSAP: disseminated lesions involving both
    sun-exposed and covered skin, typically with earlier (often childhood) onset.
    Distinguished from DSAP by distribution rather than by a different mechanism.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disseminated superficial actinic porokeratosis, disseminated superficial
      porokeratosis, porokeratosis of Mibelli
    explanation: >-
      Lists disseminated superficial porokeratosis as a recognised variant distinct from
      DSAP.
- name: Verrucous
  display_name: Verrucous porokeratosis (porokeratosis ptychotropica / genitogluteal)
  description: >-
    Verrucous, often intensely pruritic or burning plaques of the genitogluteal,
    perianal and intertriginous skin, expanding centrifugally over years. Histology
    typically shows multiple cornoid lamellae with papillomatosis and psoriasiform
    hyperplasia. It is notably treatment-resistant.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      verrucous porokeratosis (also known as genitogluteal porokeratosis)
    explanation: >-
      Establishes verrucous/genitogluteal porokeratosis as a recognised clinical variant.
- name: Follicular
  display_name: Follicular porokeratosis
  description: >-
    A rare folliculocentric variant in which the cornoid lamella forms within hair
    follicle infundibula, producing keratotic follicular plugs. Its genetic basis is
    less well characterised than that of the classical variants.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Commonly recognised variants include disseminated superficial actinic porokeratosis,
      disseminated superficial porokeratosis, porokeratosis of Mibelli, palmoplantar
      porokeratosis (including porokeratosis palmaris et plantaris disseminata and
      punctate porokeratosis), linear porokeratosis, verrucous porokeratosis (also
      known as genitogluteal porokeratosis), follicular porokeratosis and porokeratoma.
    explanation: >-
      Lists follicular porokeratosis among the recognised variants.
- name: Porokeratoma
  display_name: Porokeratoma
  description: >-
    A usually solitary keratotic plaque or nodule that lacks the classic annular rim
    but shows cornoid lamellae histologically, typically presenting in later adult
    life. It is the variant most easily mistaken for a keratinocyte carcinoma
    clinically.
  evidence:
  - reference: PMID:38132857
    reference_title: "Porokeratoses-A Comprehensive Review on the Genetics and Metabolomics, Imaging Methods and Management of Common Clinical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Commonly recognised variants include disseminated superficial actinic porokeratosis,
      disseminated superficial porokeratosis, porokeratosis of Mibelli, palmoplantar
      porokeratosis (including porokeratosis palmaris et plantaris disseminata and
      punctate porokeratosis), linear porokeratosis, verrucous porokeratosis (also
      known as genitogluteal porokeratosis), follicular porokeratosis and porokeratoma.
    explanation: >-
      Lists porokeratoma among the recognised variants of the porokeratosis group.
- name: Eruptive
  display_name: Eruptive / immunosuppression-associated porokeratosis
  description: >-
    Sudden appearance of numerous inflammatory, often pruritic porokeratotic
    lesions in the setting of iatrogenic or disease-related immunosuppression -
    solid-organ or haematopoietic stem cell transplantation, HIV infection,
    haematologic malignancy, or immunosuppressive drug therapy. Lesions may
    partially regress when the immunosuppressive state is corrected. This is an
    acquired, immunologically gated presentation rather than a distinct genetic
    entity.
  evidence:
  - reference: PMID:34418147
    reference_title: "Localized eruptive porokeratosis in pediatric patients following treatment of acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we discuss a single-institution case series of three children who developed
      porokeratosis following hematopoietic stem cell transplantation for acute leukemia,
      and we propose that this presentation be termed localized eruptive porokeratosis (LEP).
    explanation: >-
      Documents eruptive porokeratosis arising after transplant-associated
      immunosuppression.

pathophysiology:
- name: Germline Heterozygous Mevalonate Pathway Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Affected individuals carry a monoallelic germline loss-of-function variant in
    one of four mevalonate-pathway genes - MVK (mevalonate kinase), PMVK
    (phosphomevalonate kinase), MVD (mevalonate diphosphate decarboxylase) or FDPS
    (farnesyl diphosphate synthase). Heterozygosity alone leaves roughly half-normal
    enzyme activity in the epidermis and does not by itself produce a lesion; it
    establishes a field of keratinocytes primed for a second hit. At least one such
    variant was found in 98% of familial and 73% of sporadic index patients in the
    defining cohort.
  genes:
  - preferred_term: MVK
    term:
      id: hgnc:7530
      label: MVK
  - preferred_term: PMVK
    term:
      id: hgnc:9141
      label: PMVK
  - preferred_term: MVD
    term:
      id: hgnc:7529
      label: MVD
  - preferred_term: FDPS
    term:
      id: hgnc:3631
      label: FDPS
  molecular_functions:
  - preferred_term: mevalonate kinase activity
    term:
      id: GO:0004496
      label: mevalonate kinase activity
    modifier: DECREASED
  - preferred_term: phosphomevalonate kinase activity
    term:
      id: GO:0004631
      label: phosphomevalonate kinase activity
    modifier: DECREASED
  - preferred_term: diphosphomevalonate decarboxylase activity
    term:
      id: GO:0004163
      label: diphosphomevalonate decarboxylase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:26202976
    reference_title: "Genomic variations of the mevalonate pathway in porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we performed massively parallel sequencing and exonic CNV screening of 12
      isoprenoid genes in 134 index PK patients (61 familial and 73 sporadic) and
      identified causal mutations in three novel genes (PMVK, MVD, and FDPS) in addition
      to MVK in the mevalonate pathway
    explanation: >-
      Establishes the four canonical causal genes named in this node.
  - reference: PMID:26202976
    reference_title: "Genomic variations of the mevalonate pathway in porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least one mutation in one of the four genes in the mevalonate pathway was found
      in 60 (98%) familial and 53 (73%) sporadic patients
    explanation: >-
      Quantifies the diagnostic yield of the four-gene germline lesion.
  downstream:
  - target: Somatic Second Hit in Lesional Keratinocytes
    causal_link_type: DIRECT
    description: >-
      The germline heterozygous allele is the necessary substrate on which a somatic
      event in the remaining wild-type allele produces biallelic deficiency.
    evidence:
    - reference: PMID:31207227
      reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with disseminated superficial actinic porokeratosis (DSAP) and linear
        porokeratosis (LP) exhibit monoallelic germline mutations in genes encoding
        mevalonate pathway enzymes, such as MVD or MVK.
      explanation: >-
        Places the monoallelic germline lesion upstream of the somatic second hit.

- name: Somatic Second Hit in Lesional Keratinocytes
  biological_scale: MOLECULAR
  role: driver
  description: >-
    A somatic event inactivates the remaining wild-type allele within a single
    epidermal keratinocyte, converting the heterozygous state to biallelic
    deficiency. The two dominant mechanisms are copy-neutral loss of heterozygosity
    from somatic mitotic (homologous) recombination and C>T transition point
    mutations bearing a UV signature. Somatic second hits were detected in 81% of
    patients in a large contemporary cohort, with gene-specific patterns
    (chromosome 12-wide copy-neutral LOH in MVK disease, 16q in MVD disease). Timing
    determines the clinical variant: an embryonic second hit gives a single
    Blaschko-linear clone (linear porokeratosis) whereas many independent postnatal
    second hits give the disseminated lesions of DSAP.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: keratinocyte stem cell
    term:
      id: CL:0002337
      label: keratinocyte stem cell
  biological_processes:
  - preferred_term: response to UV
    term:
      id: GO:0009411
      label: response to UV
  evidence:
  - reference: PMID:31207227
    reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we showed that each skin lesion of DSAP exhibited an individual second hit genetic
      change in the wild-type allele of the corresponding gene specifically in the
      epidermis, indicating that a postnatal second hit triggering biallelic deficiency
      of the gene is required for porokeratosis to develop
    explanation: >-
      The primary evidence that a somatic second hit is required, not merely associated.
  - reference: PMID:31207227
    reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most skin lesions exhibited one of two principal second hits, either somatic
      homologous recombinations rendering the monoallelic mutation biallelic or C>T
      transition mutations in the wild-type allele.
    explanation: >-
      Documents the two mechanisms of the second hit described in this node.
  - reference: PMID:41240373
    reference_title: "Germline and somatic second-hit changes in porokeratosis: comprehensive variant spectrum and genotype-phenotype correlation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Somatic second-hit changes were identified in 81% (n = 55/68) of patients, mostly
      copy-neutral loss of heterozygosity (CN-LOH) with gene subtype specificity: most
      MVK-related porokeratosis showed chromosome 12-wide CN-LOH, while most MVD-related
      porokeratosis had 16q CN-LOH.
    explanation: >-
      Quantifies second-hit frequency and the gene-specific CN-LOH patterns.
  downstream:
  - target: Biallelic Mevalonate Pathway Enzyme Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of the wild-type allele leaves the keratinocyte with no functional copy of
      the affected mevalonate-pathway enzyme.
    evidence:
    - reference: PMID:31207227
      reference_title: "Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions Form Porokeratosis in MVD or MVK Mutant Heterozygotes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a postnatal second hit triggering biallelic deficiency of the gene is required for
        porokeratosis to develop
      explanation: >-
        Names biallelic deficiency as the direct consequence of the second hit.
  - target: Photodistribution of Lesions on Sun-Exposed Skin
    causal_link_type: DIRECT
    description: >-
      Because the second hit in DSAP is frequently a UV-signature C>T transition, new
      lesions appear preferentially where UV exposure is greatest.
    evidence:
    - reference: PMID:31753123
      reference_title: "Second-Hit Somatic Mutations in Mevalonate Pathway Genes Underlie Porokeratosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the authors show that DSAP lesions result from second-hit somatic mitotic
        recombination or point mutations with a UV signature, validating the clinical
        observation that DSAP lesions arise upon sun exposed skin
      explanation: >-
        Directly ties the UV-signature second hit to the sun-exposed lesion distribution.

- name: Somatic FDFT1 Promoter Hypermethylation
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The alternative, non-hereditary entry point into the same pathway lesion. In
    solitary or linearly arranged localized porokeratosis, FDFT1 (squalene synthase)
    is silenced epigenetically rather than mutationally: lesions carry somatic
    biallelic promoter hypermethylation, or mono-allelic hypermethylation together
    with a somatic genetic alteration on the opposite allele. Gene-specific
    hypermethylation is detectable in morphologically normal epidermis immediately
    adjacent to lesions but not distal to them, indicating an asymptomatic
    epigenetically mosaic field that predisposes particular skin areas.
  genes:
  - preferred_term: FDFT1
    term:
      id: hgnc:3629
      label: FDFT1
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:38653249
    reference_title: "Gene-specific somatic epigenetic mosaicism of FDFT1 underlies a non-hereditary localized form of porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified non-hereditary porokeratosis associated with epigenetic
      silencing of FDFT1, another gene in the mevalonate pathway.
    explanation: >-
      Establishes epigenetic silencing of FDFT1 as an independent, non-germline cause.
  - reference: PMID:38653249
    reference_title: "Gene-specific somatic epigenetic mosaicism of FDFT1 underlies a non-hereditary localized form of porokeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some individuals with the localized form, gene-specific promoter
      hypermethylation of FDFT1 was detected in morphologically normal epidermis adjacent
      to methylation-related lesions but not distal to these lesions, suggesting that
      asymptomatic somatic epigenetic mosaicism of FDFT1 predisposes certain skin areas to
      the disease.
    explanation: >-
      Supports the predisposed epigenetically mosaic field described in this node.
  downstream:
  - target: Biallelic Mevalonate Pathway Enzyme Deficiency

- name: Cryosurgery
  description: >-
    Cryosurgery with liquid nitrogen is a widely used destructive option for a limited
    number of accessible lesions, particularly porokeratosis of Mibelli. Recurrence is
    common and dyspigmentation or scarring may follow, so it does not remove the need
    for long-term surveillance.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cryosurgery
    term:
      id: NCIT:C15215
      label: Cryosurgery
  evidence:

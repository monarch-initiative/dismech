prevalence:
- population: Published individuals worldwide (all CASK-related disorders)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Over 175 individuals with pathogenic CASK variants across the whole
    CASK-related spectrum had been reported by 2022; a systematic review in 2025
    identified 151 published individuals. No population prevalence estimate has
    been established for MICPCH.
  evidence:
  - reference: PMID:35670295
    reference_title: "Pathogenic variants in CASK: Expanding the genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, over 175 patients have been reported in the literature."
    explanation: Quantifies the total published CASK-variant caseload, supporting an ultra-rare classification in the absence of a population prevalence estimate.
  - reference: PMID:41039189
    reference_title: "The neurodevelopmental spectrum of CASK-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One hundred and fifty-one individuals with CASK variants were identified in published literature."
    explanation: A 2025 systematic review independently counts the published CASK caseload.
inheritance:
- name: X-linked inheritance, typically de novo
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  description: >-
    MICPCH is inherited in an X-linked manner. Almost all affected individuals
    are simplex cases resulting from a de novo CASK loss-of-function variant.
    Because heterozygous females manifest the phenotype, an asymptomatic mother
    is unlikely to be a heterozygote, which is the key counselling point.
    Hemizygous males with a true loss-of-function allele have a
    severe-to-profound phenotype with early, often intractable epilepsy; the
    small number of more mildly affected males carry the variant in the mosaic
    state or carry a hypomorphic allele.
  evidence:
  - reference: PMID:24278995
    reference_title: "CASK Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CASK disorders are inherited in an X-linked manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:24278995
    reference_title: "CASK Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected females and males represent simplex cases (i.e., the only affected family member) and have the disorder as the result of a de novo CASK pathogenic variant. Because heterozygous females manifest the phenotype, an asymptomatic mother is unlikely to be heterozygous for the CASK pathogenic variant."
    explanation: Establishes the predominance of de novo variants and the counselling implication that asymptomatic mothers are unlikely to be carriers.
  - reference: PMID:22452838
    reference_title: "Spectrum of pontocerebellar hypoplasia in 13 girls and boys with CASK mutations: confirmation of a recognizable phenotype and first description of a male mosaic patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected in an X-linked disease manifesting mainly in females, the boy hemizygous for a splice mutation had a very severe phenotype with nearly no development and refractory epilepsy. We described a mild phenotype in a boy with a mosaic truncating mutation."
    explanation: Demonstrates the sex-dependent severity gradient and the ameliorating effect of somatic mosaicism in males.
pathophysiology:
- name: CASK Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous (female) or hemizygous (male) null alleles of CASK at Xp11.4 -
    whole- and partial-gene deletions, intragenic duplications, nonsense,
    frameshift and splice variants - abolish CASK protein. In fibroblasts from
    individuals with a CASK loss-of-function variant no CASK protein is
    detectable, whereas mosaic or hypomorphic alleles leave residual protein,
    which is the molecular basis of the MICPCH-versus-XLID split. A minority of
    MICPCH-causing alleles are missense variants that destroy a specific
    protein-protein interface rather than the whole protein.
  genes:
  - preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  molecular_functions:
  - preferred_term: protein-macromolecule adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  downstream:
  - target: Disrupted CASK-Neurexin Presynaptic Scaffold Interaction
    causal_link_type: DIRECT
    description: >-
      Loss of CASK removes the PDZ-domain-mediated link to presynaptic neurexins.
  - target: Disrupted CASK-Liprin-alpha2 Interaction via the CaMK Domain
    causal_link_type: DIRECT
    description: >-
      Loss of CASK removes the CaMK-domain-mediated link to Liprin-alpha2 that
      cerebellar granule cell survival depends on.
  - target: X-Linked Mosaicism and Competitive Cerebellar Cell Loss
    causal_link_type: DIRECT
    description: >-
      In heterozygous females, random X-inactivation creates a mosaic of
      CASK-positive and CASK-negative neurons that then compete.
  - target: Splice-Dependent Regional Specialisation of CASK Function
    causal_link_type: DIRECT
    description: >-
      Which CASK functions are lost depends on which alternatively spliced exons
      the variant affects, which is why the cerebellar and forebrain phenotypes
      can be genetically separated.
  - target: Excitatory-Inhibitory Synaptic Imbalance via GluN2B Downregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of CASK downregulates the NMDA receptor subunit GluN2B and shifts the
      excitatory/inhibitory balance. This edge is deliberately parented on the
      gene-level lesion rather than on the neurexin interface: the GluN2B effect
      has been attributed to CASK's nuclear/TBR1-cooperative role, which is a
      different interface from the presynaptic neurexin one, and the responsible
      interface is an open question recorded in `discussions`.
  evidence:
  - reference: PMID:21954287
    reference_title: "Phenotypic spectrum associated with CASK loss-of-function mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "11 submicroscopic copy number alterations, including nine deletions of ~11 kb to 4.5 Mb and two duplications, all covering (part of) CASK, four splice, four nonsense, and one 1 bp deletion are reported. These heterozygous CASK mutations most likely lead to a null allele."
    explanation: Documents the loss-of-function variant spectrum and establishes that these alleles are functionally null.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In fibroblasts from patients with a CASK loss-of-function mutation, no CASK protein could be detected. Individuals who are mosaic for a severe CASK mutation or carry a hypomorphic mutation still showed detectable amount of protein."
    explanation: Direct protein-level demonstration that MICPCH alleles are null while mosaic/hypomorphic alleles retain protein, explaining the phenotypic split.
- name: Disrupted CASK-Neurexin Presynaptic Scaffold Interaction
  biological_scale: MOLECULAR
  description: >-
    CASK binds the cytoplasmic tail of presynaptic neurexins through its PDZ
    domain, coupling the presynaptic adhesion machinery to the intracellular
    scaffold. Two MICPCH-causing missense variants in heterozygous girls
    (p.Met519Thr in the PDZ domain, p.Gly659Asp in the SH3 domain) each abolish
    neurexin binding while other aggregation-inducing CASK variants that leave
    the interaction intact do not cause MICPCH. This dissociates the neurexin
    interface from the previously assumed CASK-TBR1 transcriptional interface as
    the critical one for microcephaly and cerebellar hypoplasia.
  biological_processes:
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: DECREASED
  downstream:
  - target: Impaired Cortical Excitatory Synaptic Maturation and Network Activity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the presynaptic CASK-neurexin scaffold degrades synaptic
      transmission in cortical excitatory neurons.
  - target: Postnatal Brain Growth Failure and Progressive Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Variants that specifically disrupt the CASK-neurexin interface are
      sufficient to produce microcephaly and hindbrain hypoplasia in humans.
  evidence:
  - reference: PMID:29426960
    reference_title: "Two microcephaly-associated novel missense mutations in CASK specifically disrupt the CASK-neurexin interaction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation M519T results in the replacement of an evolutionarily invariant methionine located in the PDZ signaling domain known to be critical for the CASK-neurexin interaction. CASKM519T is incapable of binding to neurexin, suggesting a critically important role for the CASK-neurexin interaction."
    explanation: Direct biochemical demonstration that a MICPCH-causing missense variant abolishes neurexin binding.
  - reference: PMID:29426960
    reference_title: "Two microcephaly-associated novel missense mutations in CASK specifically disrupt the CASK-neurexin interaction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that disruption of the CASK-neurexin interaction, not the CASK-Tbr-1 interaction, produces microcephaly and cerebellar hypoplasia."
    explanation: Identifies the neurexin interface rather than the TBR1 interface as the critical one for the MICPCH brain phenotype.
- name: Disrupted CASK-Liprin-alpha2 Interaction via the CaMK Domain
  biological_scale: MOLECULAR
  description: >-
    Rescue mapping in CASK-knockout cerebellar granule cells shows that the CaMK,
    PDZ and SH3 domains - but not the L27 or guanylate kinase domains - are
    required for granule cell survival. Patient-derived missense variants in the
    CaMK domain fail to rescue granule cell death, and structural prediction
    places them at the Liprin-alpha2 binding interface, implicating loss of the
    CASK-Liprin-alpha2 interaction as the proximate cause of granule cell death.
  molecular_functions:
  - preferred_term: protein-macromolecule adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  downstream:
  - target: Cerebellar Granule Cell Apoptosis via JNK/ROS Signalling
    causal_link_type: DIRECT
    description: >-
      Loss of the CaMK-domain-mediated Liprin-alpha2 interaction removes the
      survival signal for cerebellar granule cells.
  evidence:
  - reference: PMID:37190086
    reference_title: "Structural Analysis Implicates CASK-Liprin-α2 Interaction in Cerebellar Granular Cell Death in MICPCH Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rescue experiments with CASK deletion mutants identify that the CaMK, PDZ, and SH3, but not L27 and guanylate kinase domains of CASK are required for the survival of CG cells."
    explanation: Domain-mapping rescue experiments localise the granule-cell survival function to specific CASK domains.
  - reference: PMID:37190086
    reference_title: "Structural Analysis Implicates CASK-Liprin-α2 Interaction in Cerebellar Granular Cell Death in MICPCH Syndrome."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Machine learning-based structural analysis using AlphaFold 2.2 predicts that these mutations disrupt the structure of the binding interface with Liprin-α2."
    explanation: The Liprin-alpha2 interface assignment rests on AlphaFold structural prediction rather than direct structure determination, so this is curated as partial computational support.
- name: Cerebellar Granule Cell Apoptosis via JNK/ROS Signalling
  biological_scale: CELLULAR
  description: >-
    CASK-knockout cerebellar granule cells undergo progressive apoptosis with
    activation of intracellular Jun N-terminal kinase signalling and upregulation
    of reactive-oxygen-species-related gene expression. Pharmacological JNK
    inhibition with JNK-IN-8 increases granule cell survival in vitro by reducing
    ROS generation, and intracerebellar injection suppresses granule cell death
    and alleviates ataxic behaviour in heterozygous CASK-knockout mice, making
    this the first tractable therapeutic node in the disorder. This granule-cell
    death mechanism is the reason the entry does not conform to the
    Purkinje-centred cerebellar degeneration module.
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: cerebellar granular layer morphogenesis
    term:
      id: GO:0021683
      label: cerebellar granular layer morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Progressive Pontine and Cerebellar Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Cumulative granule cell loss produces the progressive cerebellar hypoplasia
      seen on serial imaging.
  evidence:
  - reference: PMID:40422253
    reference_title: "Jun N-Terminal Kinase Inhibitor Suppresses CASK Deficiency-Induced Cerebellar Granular Cell Death in MICPCH Syndrome Model Mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We performed RNA-sequencing (RNA-seq) on these cells and found that CASK-KO CG cells underwent apoptosis by activating intracellular Jun N-terminal kinase (JNK) signaling and upregulating reactive oxygen species (ROS)-related gene expression."
    explanation: Identifies JNK activation and ROS upregulation as the apoptotic pathway in CASK-deficient cerebellar granule cells.
  - reference: PMID:40422253
    reference_title: "Jun N-Terminal Kinase Inhibitor Suppresses CASK Deficiency-Induced Cerebellar Granular Cell Death in MICPCH Syndrome Model Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "injection of JNK-IN-8 into the cerebellum of CASK+/- HprteGFP/+ mice suppressed CG cell death and alleviated cerebellar ataxic phenotypes in vivo"
    explanation: In vivo rescue of granule cell death and ataxia by JNK inhibition, establishing this node as causally upstream of the cerebellar phenotype and as a therapeutic target.
  - reference: PMID:37190086
    reference_title: "Structural Analysis Implicates CASK-Liprin-α2 Interaction in Cerebellar Granular Cell Death in MICPCH Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CASK KO cultured cerebellar granule (CG) cells show progressive cell death that can be rescued by co-infection with lentivirus expressing wild-type CASK."
    explanation: Establishes that granule cell death is cell-autonomously caused by CASK loss and is reversible by CASK restoration.
- name: X-Linked Mosaicism and Competitive Cerebellar Cell Loss
  biological_scale: CELLULAR
  description: >-
    Because CASK is subject to X-chromosome inactivation, heterozygous females
    carry a mosaic of CASK-expressing and CASK-deficient neurons. In the female
    heterozygous knockout mouse, roughly half of cerebellar granule cells are
    CASK-negative during early postnatal development, yet almost all surviving
    granule and Purkinje cells are CASK-positive in adulthood - the CASK-negative
    population is selectively eliminated. Comparison with hypomorphic mice
    indicates the survival of granule cells is set by a combination of
    cell-autonomous and cell-competitive mechanisms. This explains why the female
    phenotype is severe rather than mitigated by mosaicism, and why total cell
    number, not just cell function, is reduced.
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Progressive Pontine and Cerebellar Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Selective elimination of the CASK-deficient neuronal population reduces
      cerebellar cell number and cortical thickness.
  evidence:
  - reference: PMID:40422238
    reference_title: "The Competitive Loss of Cerebellar Granule and Purkinje Cells Driven by X-Linked Mosaicism in a Female Mouse Model of CASK-Related Disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "although half of the cerebellar granule cells were CASK-negative during early postnatal development, almost all Purkinje cells and cerebellar granule cells were CASK-positive in adulthood, suggesting that CASK expression may determine the survival of cerebellar granule cells during postnatal development"
    explanation: Demonstrates selective postnatal elimination of the CASK-negative neuronal population in the mosaic female brain.
  - reference: PMID:40422238
    reference_title: "The Competitive Loss of Cerebellar Granule and Purkinje Cells Driven by X-Linked Mosaicism in a Female Mouse Model of CASK-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CASK gene is regulated by X-chromosome inactivation, which results in a mosaic distribution of CASK-expressing and CASK-deficient neurons in the female brain."
    explanation: Background statement of the X-inactivation mosaicism premise (about the human female brain, not the mouse result); tagged OTHER because it is framing rather than data. The experimental finding is carried by the preceding item.
- name: Impaired Cortical Excitatory Synaptic Maturation and Network Activity
  biological_scale: CELLULAR
  description: >-
    In isogenic human embryonic stem cell-derived cortical excitatory induced
    neurons, CASK knockout leaves immature neuronal outgrowth, synapse number and
    neuronal morphology intact but produces severe defects in synaptic
    transmission and in synchronised network activity as the neurons mature.
    CASK therefore acts on the functional maturation of cortical excitatory
    networks rather than on their gross structural assembly, which is consistent
    with the clinical picture of profound cognitive and language impairment out
    of proportion to any cortical malformation.
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
    modifier: ABNORMAL
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Degraded excitatory network function underlies the cognitive impairment.
  - target: Absent or Severely Limited Speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same cortical network deficit underlies the near-absent expressive
      language.
  evidence:
  - reference: PMID:36262316
    reference_title: "CASK loss of function differentially regulates neuronal maturation and synaptic function in human induced cortical excitatory neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While immature CASK KO iNs show robust neuronal outgrowth, mature CASK KO iNs display severe defects in synaptic transmission and synchronized network activity without compromising neuronal morphology and synapse numbers."
    explanation: Isogenic human neuron model shows the deficit is in synaptic function and network synchrony rather than in neuronal morphology or synapse number.
  - reference: PMID:36262316
    reference_title: "CASK loss of function differentially regulates neuronal maturation and synaptic function in human induced cortical excitatory neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the developing human cortical excitatory neurons, CASK functions to promote both structural integrity and establishment of cortical excitatory neuronal networks."
    explanation: Summarises CASK's role in establishing human cortical excitatory networks. The wording about structural integrity refers to CASK's role across development generally; in this specific isogenic assay the mature-neuron deficit was functional (transmission and network synchrony) with morphology and synapse number preserved, as stated in the node description.
- name: Excitatory-Inhibitory Synaptic Imbalance via GluN2B Downregulation
  biological_scale: CELLULAR
  description: >-
    Exploiting X-chromosome inactivation in heterozygous female CASK-knockout
    mice, CASK-deficient and CASK-expressing neurons can be compared side by side
    in the same slice. Both CASK-knockout and CASK-knockdown neurons show a
    disrupted excitatory/inhibitory balance, the NMDA receptor subunit GluN2B is
    downregulated, and overexpressing GluN2B rescues the imbalance - identifying
    GluN2B loss as a mediator. This is a distinct, postsynaptic-facing arm of the
    mechanism from the presynaptic CASK-neurexin scaffold arm, and it provides a
    plausible substrate for the epilepsy seen in roughly half of individuals.
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: ABNORMAL
  downstream:
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A shifted excitatory/inhibitory balance is a plausible substrate for the
      epilepsy, though this link has been demonstrated in mouse rather than human
      tissue.
  evidence:
  - reference: PMID:30610199
    reference_title: "Deficiency of calcium/calmodulin-dependent serine protein kinase disrupts the excitatory-inhibitory balance of synapses by down-regulating GluN2B."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both CASK-KO and CASK-KD neurons showed a disruption of the excitatory and inhibitory (E/I) balance."
    explanation: Establishes disrupted excitatory/inhibitory balance as a direct consequence of CASK loss in mouse cortical neurons.
  - reference: PMID:30610199
    reference_title: "Deficiency of calcium/calmodulin-dependent serine protein kinase disrupts the excitatory-inhibitory balance of synapses by down-regulating GluN2B."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further found that the expression level of the N-methyl-D-aspartate receptor subunit GluN2B was decreased in CASK-KD neurons and that overexpressing GluN2B rescued the disrupted E/I balance in CASK-KD neurons."
    explanation: Identifies GluN2B downregulation as the mediator, with rescue by GluN2B overexpression establishing causality within the model.
- name: Splice-Dependent Regional Specialisation of CASK Function
  biological_scale: MOLECULAR
  description: >-
    Two vertebrate-specific CASK exons in the central part of the protein are
    alternatively spliced differently in forebrain and hindbrain, and their
    inclusion alters the structure of the CASK C-terminus. Damaging hemizygous
    variants clustered in exactly these exons produce boys with microcephaly and
    cerebral dysfunction but WITHOUT pontocerebellar hypoplasia. This is a third
    genotype class alongside the null (MICPCH) and hypomorphic (XLID) alleles,
    and it explains how the cerebellar and forebrain consequences of CASK loss
    can be genetically separated. It also implies an ongoing, non-developmental
    cerebellar requirement, since deleting Cask in adult mice causes cerebellar
    degeneration.
  genes:
  - preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  downstream:
  - target: Cerebellar Granule Cell Apoptosis via JNK/ROS Signalling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of CASK function disproportionately affects the cerebellum, and the
      granule cell population is the demonstrated site of that vulnerability.
  evidence:
  - reference: PMID:38670634
    reference_title: "Genetic evidence for splicing-dependent structural and functional plasticity in CASK protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intriguingly, damaging hemizygous CASK mutations in boys who display microcephaly and cerebral dysfunction but without PCH are known. These mutations are present in two vertebrate-specific CASK exons."
    explanation: Human genetic evidence that variants in two specific vertebrate-specific exons uncouple microcephaly from pontocerebellar hypoplasia.
  - reference: PMID:38670634
    reference_title: "Genetic evidence for splicing-dependent structural and functional plasticity in CASK protein."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These exons are subject to alternative splicing both in forebrain and hindbrain. Inclusion of these exons differentially affects the molecular structure and hence possibly the function/s of the CASK C-terminus."
    explanation: RT-PCR and in silico structural analysis showing region-differential splicing of these exons and its structural consequence; tagged OTHER because it combines molecular-biology and computational structural evidence.
  - reference: PMID:38670634
    reference_title: "Genetic evidence for splicing-dependent structural and functional plasticity in CASK protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of CASK function disproportionately affects the cerebellum."
    explanation: States the regional selectivity of CASK loss that this node captures.
- name: Progressive Pontine and Cerebellar Hypoplasia
  biological_scale: TISSUE
  description: >-
    The neuroimaging hallmark is diffuse brainstem and cerebellar hypoplasia with
    a dilated fourth ventricle, of markedly varying degree. Quantitative
    morphometry distinguishes it from other pontocerebellar hypoplasias: the pons,
    midbrain, cerebellar vermis and hemispheres and the cerebrum are all reduced,
    but the corpus callosum is of normal size, giving a low cerebrum/corpus
    callosum ratio - the opposite of the pattern in other causes of pontine
    hypoplasia. Vermis hypoplasia severity correlates with clinical severity.
    Whether the cerebellar hypoplasia is truly progressive in humans is unsettled:
    the female heterozygous mouse shows progressive cerebellar hypoplasia and
    post-adult conditional deletion causes cerebellar degeneration and ataxia over
    time, but the human microcephaly with PCH has also been characterised as
    self-limiting, so this entry does not assert human progression.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  biological_processes:
  - preferred_term: cerebellum development
    term:
      id: GO:0021549
      label: cerebellum development
    modifier: ABNORMAL
  downstream:
  - target: Pontocerebellar Hypoplasia
    causal_link_type: DIRECT
    description: The tissue-level lesion is the imaging phenotype.
  - target: Postnatal Brain Growth Failure and Progressive Microcephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hindbrain volume loss contributes to the overall reduction in brain growth.
  evidence:
  - reference: PMID:21954287
    reference_title: "Phenotypic spectrum associated with CASK loss-of-function mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain imaging consistently showed diffuse brainstem and cerebellar hypoplasia with a dilated fourth ventricle, but of remarkably varying degrees."
    explanation: Establishes the consistent but variable brainstem-cerebellar imaging phenotype across a 25-patient series.
  - reference: PMID:20595373
    reference_title: "Neuroradiologic features of CASK mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR imaging in patients with CASK mutations revealed a normal size of the corpus callosum and a low ratio of the cerebrum/corpus callosum with a reduced area of the cerebrum, pons, midbrain, and cerebellar vermis and hemispheres."
    explanation: Quantitative morphometry defining the CASK-specific imaging signature and distinguishing it from other pontine hypoplasias.
  - reference: PMID:22452838
    reference_title: "Spectrum of pontocerebellar hypoplasia in 13 girls and boys with CASK mutations: confirmation of a recognizable phenotype and first description of a male mosaic patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found some degree of correlation between severity of the vermis hypoplasia and clinical phenotype."
    explanation: Links the degree of vermis hypoplasia to clinical severity.
- name: Postnatal Brain Growth Failure and Progressive Microcephaly
  biological_scale: ORGANISM
  description: >-
    Head growth decelerates rather than being congenitally arrested, producing
    progressive postnatal microcephaly. Prenatal imaging shows this process can
    begin in utero: progressive deceleration of fetal head circumference growth
    rate was seen in 15 of 19 fetuses with available data, with a subset already
    below -2 SD and some with a small transcerebellar diameter, although most
    cases would not be picked up by current routine fetal CNS assessment.
  downstream:
  - target: Progressive Microcephaly
    causal_link_type: DIRECT
    description: The organism-level growth failure is the clinical microcephaly.
  - target: Growth Retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Somatic growth restriction frequently accompanies the head-growth failure.
  evidence:
  - reference: PMID:21954287
    reference_title: "Phenotypic spectrum associated with CASK loss-of-function mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe developmental delay/intellectual disability, severe postnatal microcephaly, often associated with growth retardation"
    explanation: Establishes microcephaly as postnatal in onset and frequently accompanied by somatic growth retardation.
  - reference: PMID:36175354
    reference_title: "Expanding the natural history of CASK-related disorders to the prenatal period."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive prenatal deceleration of head circumference growth rate was observed in 15 out of 19."
    explanation: Shows that the head-growth deceleration begins prenatally in most fetuses in whom serial measurements were available.

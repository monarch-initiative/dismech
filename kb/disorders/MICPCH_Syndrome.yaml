- name: JNK Inhibition (Preclinical)
  description: >-
    JNK-IN-8, a Jun N-terminal kinase inhibitor, suppresses CASK-deficiency-induced
    cerebellar granule cell death in vitro by reducing reactive oxygen species,
    and intracerebellar injection suppresses granule cell death and alleviates
    ataxic phenotypes in heterozygous CASK-knockout mice. This is the only
    mechanism-directed therapeutic lead in the disorder. It is entirely
    preclinical - there are no human data, and intracerebellar delivery is not
    clinically translatable as tested.

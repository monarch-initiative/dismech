genetic:
- name: CASK
  gene_term:
    preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  association: Causal - X-linked loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: Positive
  notes: >-
    CASK is at Xp11.4. MICPCH is caused by loss-of-function alleles: whole- and
    partial-gene deletions, intragenic duplications that disrupt gene integrity,
    nonsense, frameshift and splice variants. A minority of MICPCH cases are
    caused by missense variants that specifically destroy the CASK-neurexin or
    CASK-Liprin-alpha2 interface. Hypomorphic missense and splice variants
    instead cause the milder XLID-with-or-without-nystagmus arm of the spectrum,
    which is out of scope for this entry. In males, hemizygous null alleles cause
    a severe MICPCH-plus-epileptic-encephalopathy phenotype, while mosaic or
    partly penetrant alleles give a milder picture. In a comprehensive series of
    41 individuals with a MICPCH phenotype, CASK aberrations accounted for 32
    cases, so a minority of clinically defined MICPCH is caused by other genes
    (e.g. ITPR1).
  evidence:
  - reference: PMID:24278995
    reference_title: "CASK Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly with pontine and cerebellar hypoplasia (MICPCH), generally associated with pathogenic loss-of-function variants in CASK. X-linked intellectual disability (XLID) with or without nystagmus, generally associated with hypomorphic CASK pathogenic variants."
    explanation: GeneReviews states the genotype-phenotype split that defines the scope of this entry - null alleles give MICPCH, hypomorphic alleles give XLID.
  - reference: PMID:28783747
    reference_title: "Comprehensive investigation of CASK mutations and other genetic etiologies in 41 patients with intellectual disability and microcephaly with pontine and cerebellar hypoplasia (MICPCH)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CASK aberrations including a rare mosaic mutation in a male patient, were found in 32 cases, and a mutation in ITPR1, another known gene"
    explanation: Quantifies the CASK contribution to a clinically ascertained MICPCH series and documents locus heterogeneity.
  - reference: PMID:37628707
    reference_title: "Diverse Clinical Phenotypes of CASK-Related Disorders and Multiple Functional Domains of CASK Protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "missense mutations associated with epilepsy and intellectual disability were found throughout the whole region of the CASK protein, while missense mutations related to microcephaly and MICPCH were restricted in certain domains"
    explanation: Establishes a domain-level genotype-phenotype correlation - MICPCH-causing missense variants cluster in particular domains, whereas epilepsy/ID missense variants are distributed throughout the protein.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three phenotypic groups can be distinguished that represent a clinical continuum: (i) MICPCH with severe epileptic encephalopathy caused by hemizygous loss-of-function mutations, (ii) MICPCH associated with inactivating alterations in the mosaic state or a partly penetrant mutation, and (iii) syndromic/nonsyndromic mild to severe ID with or without nystagmus caused by CASK missense and splice mutations"
    explanation: Defines the three-group male genotype-phenotype continuum and confirms that hypomorphic missense/splice alleles map to the out-of-scope XLID arm.
diagnosis:
- name: Molecular Genetic Testing for CASK
  description: >-
    The diagnosis is established by identifying a heterozygous (female) or
    hemizygous (male) pathogenic CASK variant. Because a large fraction of
    pathogenic alleles are copy-number changes, testing must combine sequencing
    with deletion/duplication analysis (chromosomal microarray, MLPA or
    array-CGH); sequencing alone will miss them. Rarely, affected males carry the
    variant in a mosaic state, which requires appropriately sensitive testing.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:24278995
    reference_title: "CASK Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a CASK disorder is established in a female who is heterozygous for a CASK pathogenic variant and in a male who is hemizygous for a CASK pathogenic variant on molecular genetic testing. Rarely, affected males have a mosaic pathogenic variant."
    explanation: GeneReviews states the molecular diagnostic criterion and flags male mosaicism.
  - reference: PMID:23901204
    reference_title: "MICrocephaly, disproportionate pontine and cerebellar hypoplasia syndrome: A clinico-radiologic phenotype linked to calcium/calmodulin-dependent serine protein kinase gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an array-comparative genomic hybridization (a-CGH) analysis showed CASK gene duplication at Xp11.4"
    explanation: Illustrates that copy-number analysis is required, since conventional cytogenetics was normal in this case.
- name: Brain MRI with Posterior Fossa Morphometry
  description: >-
    MRI showing disproportionate pontine and cerebellar hypoplasia with a dilated
    fourth ventricle, combined with a normal-sized corpus callosum and a low
    cerebrum/corpus callosum area ratio, is highly suggestive and distinguishes
    CASK-related pontocerebellar hypoplasia from other pontocerebellar
    hypoplasias, in which the corpus callosum is thinned.
  presence: Abnormal in essentially all affected individuals
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:20595373
    reference_title: "Neuroradiologic features of CASK mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5 patients with pontine hypoplasia showed thinning of the corpus callosum and a high ratio of the cerebrum/corpus callosum, irrespective of the size of the cerebrum."
    explanation: Establishes the contrast with non-CASK pontine hypoplasia, in which the corpus callosum is thinned and the ratio is high.
  - reference: PMID:20595373
    reference_title: "Neuroradiologic features of CASK mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The normal size of the corpus callosum, which gives an impression of callosal thickening at first glance, may be an imaging clue to detect patients with CASK mutations."
    explanation: Identifies the specific imaging clue that should prompt CASK testing.
  - reference: PMID:21954287
    reference_title: "Phenotypic spectrum associated with CASK loss-of-function mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of developmental and brain imaging features together with mild facial dysmorphism is highly suggestive of this disorder and should prompt subsequent testing of the CASK gene."
    explanation: States that the combined clinical-radiological gestalt should prompt CASK testing.
- name: Electroencephalography
  description: >-
    EEG is indicated whenever seizures, epileptic spasms, developmental
    regression or suspicious paroxysmal events occur, and it characterizes the
    epilepsy rather than merely confirming it: in a genetically confirmed CASK
    cohort the EEG showed poorly organized background activity with diffuse or
    multifocal epileptiform abnormalities and sleep activation, and in the
    majority of children with spasms the EEG features and course supported a
    diagnosis of developmental and epileptic encephalopathy. Because epilepsy
    onset is frequently in childhood and the abnormalities may appear only over
    the follow-up period, a single normal study does not exclude later epilepsy
    and serial systematic monitoring is required.
  presence: Abnormal in individuals with epilepsy, which affects roughly 40-50% of individuals
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:33640666
    reference_title: "CASK related disorder: Epilepsy and developmental outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG abnormalities included poorly organized background activity with diffuse or multifocal epileptiform abnormalities and sleep-activation, with possible appearance over the follow-up period."
    explanation: Describes the characteristic EEG findings in a CASK cohort and notes that they may emerge only on follow-up, which is why the study is repeated rather than performed once.
  - reference: PMID:33640666
    reference_title: "CASK related disorder: Epilepsy and developmental outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven (3 males) out of the 11 children with spasms showed EEG features and a course supporting the diagnosis of a developmental and epileptic encephalopathy (DEE)."
    explanation: Shows that the EEG is what distinguishes developmental and epileptic encephalopathy from spasms alone in this disorder.
differential_diagnoses:
- name: Pontocerebellar Hypoplasia Type 2 (TSEN54)
  description: >-
    The commonest form of pontocerebellar hypoplasia and the main radiological
    differential; it is autosomal recessive and shows a thinned corpus callosum,
    whereas the corpus callosum is of normal size in CASK-related MICPCH. In one
    reference centre CASK-related PCH was the second most frequent cause of PCH.
- name: CASK-Related X-Linked Intellectual Disability With or Without Nystagmus
  description: >-
    The allelic milder arm of the CASK spectrum (FGS4/MRXSNA), caused by
    hypomorphic missense and splice variants. It typically affects males with mild
    to severe intellectual disability and nystagmus, with carrier females normal
    or mildly affected, and lacks the pontocerebellar hypoplasia. Deliberately
    curated as a distinct entity from MICPCH.
- name: Rett Syndrome (MECP2)
  description: >-
    Shares severe intellectual disability in females, acquired microcephaly, hand
    stereotypies and absent speech; distinguished by the CASK imaging signature
    and by molecular testing.
- name: ITPR1-Related Cerebellar Disorder
  description: >-
    ITPR1 variants were identified in a clinically ascertained MICPCH series and
    are part of the differential for the imaging phenotype.
- name: Congenital Disorders of Glycosylation
  description: >-
    A recognised cause of cerebellar hypoplasia with developmental delay that
    should be excluded biochemically.

discussions:
- discussion_id: micpch_cask_molecular_function_mapping
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which of CASK's several molecular functions actually accounts for the MICPCH
    brain phenotype, and does the relationship between CASK molecular function and
    tissue pathology in model organisms translate to human disease?
  attaches_to:
  - pathophysiology#Disrupted CASK-Neurexin Presynaptic Scaffold Interaction
  - pathophysiology#Disrupted CASK-Liprin-alpha2 Interaction via the CaMK Domain
  rationale: >-
    CASK is a multidomain scaffold with many binding partners, and the literature
    has successively implicated the CASK-TBR1 transcriptional interface, the
    CASK-neurexin presynaptic interface and the CASK-Liprin-alpha2 interface. The
    investigators who built and characterised the MICPCH mouse models explicitly
    warn that the relationship between CASK molecular function and the phenotypes
    observed in model organisms and humans is highly complex and should not be
    oversimplified. The two molecular nodes curated here are therefore both
    retained rather than collapsed, and neither is asserted as the sole mechanism.
    Resolving this matters because a mechanism-directed therapy has to target the
    right interface.
  proposed_experiments:
  - experiment_id: micpch_interface_specific_knockin
    name: Interface-specific Cask knock-in mouse allelic series
    description: >-
      Generate mice carrying separation-of-function Cask alleles that
      independently disrupt the neurexin, Liprin-alpha2 and TBR1 interfaces, and
      compare cerebellar granule cell survival, cerebellar volume and behaviour.
    decision_criterion: >-
      If only one interface allele reproduces cerebellar hypoplasia, that
      interface is the causal one; if several do, the mechanism is combinatorial.
  - experiment_id: micpch_patient_organoid_interface
    name: Patient-derived cerebellar organoid interface rescue
    description: >-
      Rescue CASK-null human cerebellar organoids with CASK constructs selectively
      defective for each interface and measure granule cell survival.
    decision_criterion: >-
      Failure of a given construct to rescue identifies its interface as required
      in human tissue, addressing the model-to-human translation gap directly.
  evidence:
  - reference: PMID:35406695
    reference_title: "The Non-Linear Path from Gene Dysfunction to Genetic Disease: Lessons from the MICPCH Mouse Model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Our studies point to a highly complex relationship between the potential molecular function/s of CASK and the phenotypes observed in model organisms and humans."
    explanation: Expert perspective from the authors of the MICPCH mouse work, explicitly cautioning against a simple molecular-function-to-phenotype mapping; this is the substance of the open question, and is tagged OTHER because the source is a review rather than primary data.
  - reference: PMID:35406695
    reference_title: "The Non-Linear Path from Gene Dysfunction to Genetic Disease: Lessons from the MICPCH Mouse Model."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Here we discuss the implications of our observations from the pathogenesis of MICPCH as a cautionary narrative against oversimplifying molecular interpretations of data obtained from genetically modified animal models of human diseases."

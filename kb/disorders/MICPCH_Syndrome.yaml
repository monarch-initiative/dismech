name: MICPCH Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >-
  MICPCH (microcephaly with pontine and cerebellar hypoplasia; syndromic X-linked
  intellectual disability, Najm type; OMIM 300749) is an X-linked
  neurodevelopmental disorder caused by loss-of-function variants in CASK
  (Xp11.4), which encodes calcium/calmodulin-dependent serine protein kinase, a
  MAGUK-family presynaptic scaffold protein. It is the severe end of the
  CASK-related disorder spectrum and is seen predominantly in heterozygous
  females, in whom random X-chromosome inactivation produces a mosaic of
  CASK-expressing and CASK-deficient neurons. The core phenotype is
  moderate-to-severe intellectual disability with severe motor delay, progressive
  postnatal microcephaly, and a characteristic neuroimaging picture of
  disproportionate pontine and cerebellar hypoplasia with a relatively preserved
  corpus callosum. Additional features include axial hypotonia with limb
  hypertonia/spasticity, dystonia and other movement disorders, epilepsy in
  roughly 40-50%, optic nerve hypoplasia and other ophthalmological anomalies,
  sensorineural hearing loss, feeding difficulties, growth retardation, scoliosis,
  sleep disturbance, hand stereotypies and self-biting, and a mild recognisable
  facial gestalt. Affected males are far rarer and usually have a
  severe-to-profound phenotype with early intractable epilepsy, unless the variant
  is mosaic or hypomorphic.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
- Pontocerebellar Hypoplasia
notes: >-
  Scope and disambiguation. CASK causes a clinical continuum, and this entry is
  scoped to the MICPCH end of it (MONDO:0010417 / OMIM 300749), i.e. the
  loss-of-function phenotype with pontocerebellar hypoplasia. Two other CASK
  phenotypes are deliberately NOT curated here: (i) X-linked intellectual
  disability with or without nystagmus (FGS4/MRXSNA, OMIM 300422), which is
  caused by hypomorphic missense and splice variants and typically affects males
  with unaffected or mildly affected carrier females, and (ii) X-linked optic
  atrophy (OMIM 300711). Where the MICPCH literature necessarily discusses the
  full CASK spectrum, the distinction is made explicit in the relevant
  description or explanation so that the two arms are not conflated. The
  parent MONDO class MONDO:1060192 "CASK-related intellectual disability"
  explicitly spans both arms and is intentionally not used as the `disease_term`.
  MONDO:0010417 is used because its OMIM xref is 300749 (the MICPCH entry), even
  though its Orphanet-derived textual definition is itself broad enough to
  mention nystagmus; the OMIM anchor, not the prose, fixes the identity.
  Module conformance. `cerebellar_purkinje_degeneration` was evaluated and
  rejected: its trigger node is Purkinje-cell calcium/proteostasis dysregulation
  driving Purkinje neuron degeneration and cerebellar ataxia, and MICPCH does not
  instantiate that trigger. The MICPCH lesion is developmental loss of a
  MAGUK scaffold, with the demonstrated proximate mechanism being JNK/ROS-driven
  apoptosis of cerebellar GRANULE cells (the cell type used in every rescue and
  drug experiment in this disorder). CASK-negative Purkinje cells are also
  eliminated in the mosaic female mouse, so this is not a claim that Purkinje
  cells are spared - it is that the module's calcium/proteostasis trigger and
  Purkinje-primary framing are not what the CASK evidence shows. `epilepsy_excitation_inhibition_imbalance` was also evaluated; the
  epilepsy here is a frequent comorbidity of the developmental lesion rather than
  a curated excitation/inhibition-imbalance chain, so no conformance is declared.

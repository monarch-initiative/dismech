pathophysiology:
- name: VAX1 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A homozygous missense change at an invariant residue of the VAX1 homeodomain
    (p.Arg152Ser) is the initiating lesion. VAX1 is a homeodomain transcription
    factor that binds DNA sequence-specifically; the lesion is predicted to
    reduce its DNA-binding transcription-factor activity. Loss of function is
    the authors' interpretation, inferred from the human phenotype resembling the
    Vax1 homozygous null mouse rather than from an assay of this allele.
  gene:
    preferred_term: VAX1
    term:
      id: hgnc:12660
      label: VAX1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: VAX1 DNA-binding transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:22095910
    reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that the mutation results in a loss of function, as the mutation results in a phenotype similar to the Vax1 homozygous null mouse."
    explanation: States the loss-of-function interpretation of the causal missense allele.
  - reference: PMID:27013679
    reference_title: "Deletion of Vax1 from Gonadotropin-Releasing Hormone (GnRH) Neurons Abolishes GnRH Expression and Leads to Hypogonadism and Infertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found VAX1 to be a direct activator of the GnRH promoter through binding to four ATTA sites in the GnRH enhancer (E1) and proximal promoter (P)"
    explanation: >-
      Demonstrates in cell lines that VAX1 is a sequence-specific DNA-binding
      transcriptional regulator, grounding the molecular-function annotation.
  downstream:
  - target: Disrupted Ventral Forebrain and Optic Stalk Patterning
    description: >-
      Loss of VAX1 transcriptional activity disrupts patterning of the ventral
      forebrain and optic stalk, the domains where Vax1 is normally expressed.
    causal_link_type: DIRECT
  - target: Commissural Axon Guidance Failure
    description: >-
      VAX1 is required in anterior midline cells to guide commissural axons;
      its loss removes attractive guidance cues from those cells.
    causal_link_type: DIRECT
  - target: Failure of Craniofacial Fusion
    description: >-
      Biallelic VAX1 loss is associated with orofacial clefting in the human
      proband. The intervening craniofacial developmental mechanism is not
      demonstrated in the cached literature and the link is therefore inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disrupted Ventral Forebrain and Optic Stalk Patterning
  role: intermediate
  biological_scale: TISSUE
  description: >-
    In the Vax1 null mouse, loss of Vax1 causes a proximal expansion of Pax6 and
    Rx activity in the developing visual system and defects in the basal
    telencephalon, indicating that Vax1 normally restrains dorsal eye-field
    programs and specifies ventral forebrain/optic-stalk identity. This is mouse
    evidence applied to the human disorder by phenocopy.
  biological_processes:
  - preferred_term: forebrain development
    term:
      id: GO:0030900
      label: forebrain development
    modifier: ABNORMAL
  - preferred_term: optic nerve development
    term:
      id: GO:0021554
      label: optic nerve development
    modifier: ABNORMAL
  locations:
  - preferred_term: optic stalk
    term:
      id: UBERON:0003098
      label: optic stalk
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:10601036
    reference_title: "Vax1, a novel homeobox-containing gene, directs development of the basal forebrain and visual system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the absence of Vax1 results in a proximal expansion of the activity of Pax6 and Rx"
    explanation: >-
      Shows that loss of Vax1 derepresses dorsal eye-field transcription factors,
      the molecular signature of disrupted ventral patterning.
  - reference: PMID:10601036
    reference_title: "Vax1, a novel homeobox-containing gene, directs development of the basal forebrain and visual system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice carrying a targeted mutation of Vax1 show dysgenesis of the optic nerve, coloboma, defects in the basal telencephalon, and lobar holoprosencephaly."
    explanation: Reports the forebrain and visual-system defects of the Vax1 null mouse.
  downstream:
  - target: Optic Fissure Closure Failure and Optic Nerve Dysgenesis
    description: >-
      Disrupted ventral patterning leads to failure of the optic fissure to
      close and to dysgenesis of the optic nerve.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10601036
      reference_title: "Vax1, a novel homeobox-containing gene, directs development of the basal forebrain and visual system."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice carrying a targeted mutation of Vax1 show dysgenesis of the optic nerve, coloboma, defects in the basal telencephalon, and lobar holoprosencephaly."
      explanation: Links Vax1 loss to optic nerve dysgenesis and coloboma.
- name: Optic Fissure Closure Failure and Optic Nerve Dysgenesis
  role: intermediate
  biological_scale: TISSUE
  description: >-
    In the Vax1 null mouse the optic disks fail to close, producing coloboma and
    loss of the eye-nerve boundary, with dysgenesis of the optic nerve. In the
    human proband these correspond to microphthalmia and small optic nerves.
  biological_processes:
  - preferred_term: optic nerve morphogenesis
    term:
      id: GO:0021631
      label: optic nerve morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: optic fissure
    term:
      id: UBERON:0005412
      label: optic fissure
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:10601035
    reference_title: "The homeodomain protein vax1 is required for axon guidance and major tract formation in the developing forebrain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the optic disks fail to close, leading to coloboma and loss of the eye-nerve boundary"
    explanation: Reports the optic fissure/disc closure failure underlying the ocular phenotype.
  downstream:
  - target: Microphthalmia
    description: >-
      Failed optic fissure closure and optic nerve dysgenesis underlie the small,
      malformed eye in the proband.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic nerve hypoplasia
    description: Optic nerve dysgenesis corresponds to the small optic nerves reported in the proband.
    causal_link_type: DIRECT
- name: Commissural Axon Guidance Failure
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    VAX1 is expressed in anterior midline cells that orchestrate axon
    trajectories. In the Vax1 null mouse, axons of the corpus callosum and the
    hippocampal and anterior commissures fail to cross the midline, because the
    normally Vax1-positive midline cells show markedly diminished expression of
    attractive guidance cues (the cells survive; the defect is in their guidance
    function).
  biological_processes:
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
    modifier: ABNORMAL
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:10601035
    reference_title: "The homeodomain protein vax1 is required for axon guidance and major tract formation in the developing forebrain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "axons in multiple commissural tracts of the anterior CNS, including the corpus callosum and the hippocampal and anterior commissures, fail to cross the midline"
    explanation: Reports the midline commissural axon guidance failure behind callosal agenesis.
  - reference: PMID:10601035
    reference_title: "The homeodomain protein vax1 is required for axon guidance and major tract formation in the developing forebrain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These axon guidance defects do not result from the death of normally Vax1(+) midline cells but, instead, correlate with markedly diminished expression of attractive guidance cues in these cells."
    explanation: Localizes the defect to loss of guidance-cue expression rather than cell death.
  downstream:
  - target: Agenesis of corpus callosum
    description: >-
      Failure of callosal axons to cross the midline produces agenesis of the
      corpus callosum, reported in the human proband.
    causal_link_type: DIRECT
- name: Failure of Craniofacial Fusion
  role: intermediate
  biological_scale: TISSUE
  description: >-
    The human proband has cleft lip/palate. A craniofacial developmental failure
    is inferred as the proximate cause, but the cached literature does not
    demonstrate a VAX1-dependent palatal/lip fusion mechanism, so this node links
    the lesion to the orofacial phenotype rather than asserting a mechanism.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:22095910
    reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a proband of Egyptian origin with microphthalmia, small optic nerves, cleft lip/palate, and corpus callosum agenesis"
    explanation: Documents the orofacial clefting in the single proband.
  downstream:
  - target: Cleft lip
    description: Orofacial clefting in the proband includes cleft lip.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cleft palate
    description: Orofacial clefting in the proband includes cleft palate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

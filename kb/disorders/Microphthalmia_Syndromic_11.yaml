inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The single reported proband is homozygous for the causal VAX1 allele, which
    was absent from 96 ethnically matched controls — a biallelic genotype
    consistent with the autosomal recessive classification of MCOPS11
    (OMIM:614402). No heterozygous carrier has been reported with the full
    phenotype.
  evidence:
  - reference: PMID:22095910
    reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed homozygosity for two successive nucleotide substitutions c.453G>A and c.454C>A, predicting p.Arg152Ser, in a proband of Egyptian origin"
    explanation: >-
      A homozygous causal genotype in the single proband, absent from controls,
      is the basis for recessive inheritance; the abstract states the genotype
      rather than the inheritance mode itself, hence INDIRECT.
genetic:
- name: VAX1
  gene_term:
    preferred_term: VAX1
    term:
      id: hgnc:12660
      label: VAX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  association: >-
    Biallelic VAX1 variants cause MCOPS11. The reported allele is a homozygous
    dinucleotide substitution (c.453G>A and c.454C>A) predicting the missense
    change p.Arg152Ser at an invariant residue of the VAX1 homeodomain. The
    authors favour loss of function because the human phenotype resembles the
    Vax1 homozygous null mouse. VAX1 is one of the established genes of the
    microphthalmia-anophthalmia-coloboma (MAC) spectrum.
  notes: >-
    No ClinGen Gene-Disease Validity (CGGV:) record is cached for VAX1 with this
    disease, so no gene_disease_validity assertion is recorded (verified with
    `just list-gene-validity`). The causal relationship rests on the single
    Slavotinek 2012 family plus phenocopy by the Vax1 null mouse. A separate,
    non-causal common-variant association between the 10q25.3 VAX1 region and
    nonsyndromic cleft lip/palate exists in the GWAS literature but is a
    susceptibility signal, not MCOPS11 causation, and is not cited here because
    no primary GWAS source was verified in this curation.
  evidence:
  - reference: PMID:22095910
    reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first description of a phenotype associated with a VAX1 mutation in humans and establishes VAX1 as a new causative gene for A/M."
    explanation: Establishes VAX1 as the causative gene for this anophthalmia/microphthalmia phenotype.
  - reference: PMID:24859618
    reference_title: "The genetic architecture of microphthalmia, anophthalmia and coloboma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "This review will focus on MAC phenotypes that are associated with mutation of the genes SOX2, OTX2, PAX6, STRA6, ALDH1A3, RARB, VSX2, RAX, FOXE3, BMP4, BMP7, GDF3, GDF6, ABCB6, ATOH7, C12orf57, TENM3 (ODZ3), and VAX1."
    explanation: A review places VAX1 among the established genes of the MAC spectrum.
  variants:
  - name: "c.453G>A; c.454C>A (p.Arg152Ser)"
    description: >-
      Homozygous pair of successive nucleotide substitutions within one codon,
      predicting the missense change p.Arg152Ser. The residue is invariant in
      the VAX1 homeodomain, the DNA-binding module of the protein, and the allele
      was absent from 96 Egyptian controls.
    gene:
      preferred_term: VAX1
      term:
        id: hgnc:12660
        label: VAX1
    type: missense
    functional_effects:
    - function: LOSS_OF_FUNCTION
      description: >-
        A missense change at an invariant homeodomain residue is predicted to
        impair sequence-specific DNA binding by VAX1. Loss of function is
        inferred from phenotypic similarity to the Vax1 null mouse; no functional
        assay of this allele is reported.
    evidence:
    - reference: PMID:22095910
      reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation affects an invariant residue in the homeodomain of VAX1 and was absent from 96 Egyptian controls."
      explanation: Reports the variant location at an invariant homeodomain residue and its absence from controls.
    - reference: PMID:22095910
      reference_title: "VAX1 mutation associated with microphthalmia, corpus callosum agenesis, and orofacial clefting: the first description of a VAX1 phenotype in humans."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is likely that the mutation results in a loss of function, as the mutation results in a phenotype similar to the Vax1 homozygous null mouse."
      explanation: The loss-of-function interpretation is inferred from phenocopy of the null mouse, not from a direct assay.

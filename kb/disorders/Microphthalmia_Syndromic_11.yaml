name: microphthalmia, syndromic 11
creation_date: "2026-10-12T15:45:00Z"
category: Mendelian
description: >-
  An ultra-rare autosomal recessive syndromic microphthalmia/anophthalmia
  (MCOPS11; MONDO:0013734, OMIM:614402) caused by biallelic loss of function of
  VAX1 (ventral anterior homeobox 1), a homeodomain transcription factor
  essential for ventral forebrain, optic stalk and optic nerve development. The
  human entity rests on a single reported proband: Slavotinek et al. (2012)
  sequenced VAX1 and VAX2 in 70 anophthalmia/microphthalmia patients and found,
  in one Egyptian proband, homozygosity for two successive substitutions
  (c.453G>A and c.454C>A, p.Arg152Ser) affecting an invariant homeodomain
  residue, with microphthalmia, small optic nerves, cleft lip/palate and corpus
  callosum agenesis. Loss of function is inferred from the phenotypic similarity
  to the Vax1 homozygous null mouse, in which optic nerve dysgenesis, coloboma,
  basal telencephalon defects and failure of commissural axons (corpus callosum,
  hippocampal and anterior commissures) to cross the midline have been
  demonstrated. The craniofacial (cleft) mechanism in humans is inferred rather
  than demonstrated — the cached mouse abstracts do not report cleft palate — so
  that branch is grounded in the human proband and left mechanistically open.
synonyms:
- MCOPS11
- VAX1 syndromic microphthalmia
- microphthalmia, syndromic type 11
parents:
- hereditary disease
- developmental eye disorder
- syndromic microphthalmia

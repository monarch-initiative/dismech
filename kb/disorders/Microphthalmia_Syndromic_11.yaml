differential_diagnoses:
- name: SOX2-Related Anophthalmia/Microphthalmia Syndrome
  description: >-
    SOX2 is the most common cause of severe bilateral anophthalmia/microphthalmia,
    typically from de novo heterozygous loss-of-function variants (autosomal
    dominant), whereas MCOPS11 is autosomal recessive. SOX2 syndrome features
    anophthalmia/microphthalmia with brain, oesophageal and genital anomalies;
    the combination with corpus callosum agenesis and orofacial clefting on a
    recessive background favours VAX1.
- name: OTX2-Related Anophthalmia/Microphthalmia Syndrome
  description: >-
    OTX2, like SOX2, is a leading cause of severe bilateral anophthalmia/
    microphthalmia from de novo heterozygous loss-of-function variants and is a
    principal differential. Mode of inheritance (dominant de novo versus the
    recessive VAX1 genotype) and the specific extraocular profile distinguish the
    two; molecular testing is definitive.
treatments:
- name: Orofacial cleft surgical repair
  description: >-
    Staged surgical repair of the cleft lip and palate, as for orofacial
    clefting of any cause. This is symptomatic management of a structural
    malformation, not a disease-modifying therapy, and no VAX1-specific
    intervention exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orofacial cleft repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Genetic counseling
  description: >-
    Counseling for the affected family, including the 25% recurrence risk that
    follows from autosomal recessive inheritance once the biallelic VAX1 genotype
    is known, and the option of carrier and prenatal testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
discussions:
- discussion_id: vax1-reproductive-axis-human
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: >-
    Do humans with biallelic VAX1 loss of function have hypothalamic-pituitary-
    gonadal (reproductive/endocrine) involvement, as predicted by the mouse Vax1
    requirement in GnRH neurons?
  rationale: >-
    In mouse, Vax1 is required for GnRH neuron maturation and Gnrh1 expression,
    and its deletion from GnRH neurons causes hypogonadism and infertility; Vax1
    haploinsufficiency causes subfertility and has been proposed as a candidate
    in polygenic idiopathic hypogonadotropic hypogonadism. The single reported
    human MCOPS11 proband is a young child, so reproductive-axis involvement in
    humans has neither been assessed nor excluded. This is a genuine open
    question rather than an established human phenotype, so it is recorded as a
    gap rather than as a phenotype.
  evidence:
  - reference: PMID:27013679
    reference_title: "Deletion of Vax1 from Gonadotropin-Releasing Hormone (GnRH) Neurons Abolishes GnRH Expression and Leads to Hypogonadism and Infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vax1 deletion from GnRH neurons leads to complete infertility in males and females"
    explanation: >-
      Establishes the mouse basis for the open question about reproductive-axis
      involvement in human VAX1 loss of function.
- discussion_id: vax1-holoprosencephaly-human-mouse
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disrupted Ventral Forebrain and Optic Stalk Patterning
  prompt: >-
    Does human biallelic VAX1 loss produce lobar holoprosencephaly, as the Vax1
    null mouse does, or is the human forebrain phenotype restricted to corpus
    callosum agenesis?
  rationale: >-
    The Vax1 null mouse shows lobar holoprosencephaly, a severe ventral forebrain
    malformation, whereas the single human proband is reported with corpus
    callosum agenesis but not holoprosencephaly. Whether this is a true species
    difference in VAX1 forebrain requirement or an artefact of n=1 human
    phenotyping is unresolved and bears on how far the mouse patterning model can
    be read across to human disease.
  evidence:
  - reference: PMID:10601036
    reference_title: "Vax1, a novel homeobox-containing gene, directs development of the basal forebrain and visual system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice carrying a targeted mutation of Vax1 show dysgenesis of the optic nerve, coloboma, defects in the basal telencephalon, and lobar holoprosencephaly."
    explanation: Reports the mouse holoprosencephaly that is not documented in the human proband.
notes: >-
  Single-family entity: the entire human evidence base is one Egyptian proband
  (Slavotinek et al. 2012). Lump/split: curated as a single-gene leaf DISEASE
  with one conserved pathograph; other syndromic-microphthalmia genes (SOX2,
  OTX2) are related as differentials, not grouped. The craniofacial/cleft branch
  is grounded in the human proband only — the cached mouse abstracts
  (Hallonet 1999, Bertuzzi 1999) do not report cleft palate, so the VAX1-to-cleft
  mechanism is left inferred. The hippocampal and pineal findings mentioned in
  aggregator summaries were not quotable from any verified primary source and
  were deliberately omitted. Mouse GnRH/infertility findings are recorded as a
  KNOWLEDGE_GAP about human reproductive-axis involvement rather than as human
  phenotypes.

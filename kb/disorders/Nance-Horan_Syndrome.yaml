    snippet: "NHS mutations in the NHS-affected individuals typically result in premature truncation of the protein."
    explanation: Literature review within a family report summarising protein truncation as the usual allele class.
  variants:
  - name: NHS c.115C>T p.(Gln39Ter)
    type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Exon 1 nonsense variant segregating in a four-generation Asian Indian
      family with eight affected males, who had severe ocular but mild to
      moderate non-ocular features.
    evidence:
    - reference: PMID:15623749
      reference_title: "Truncating mutation in the NHS gene: phenotypic heterogeneity of Nance-Horan syndrome in an asian Indian family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a truncating mutation 115C-->T in exon 1, resulting in conversion of glutamine to stop codon (Q39X), but was not observed in unaffected individuals and control subjects"
      explanation: Segregation of the Q39X nonsense allele with disease in affected males and carrier females.
  - name: NHS p.(Arg373Ter)
    type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Recurrent nonsense variant reported in unrelated families from different
      countries.
    evidence:
    - reference: PMID:18949062
      reference_title: "Novel causative mutations in patients with Nance-Horan syndrome and altered localization of the mutant NHS-A protein isoform."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "each of the two other patients carried two previously reported mutations (R373X and R879X)"
      explanation: R373X recurs as a previously reported truncating allele in a new patient series.
    - reference: PMID:31755796
      reference_title: "Great clinical variability of Nance Horan syndrome due to deleterious NHS mutations in two unrelated Spanish families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two pathogenic variants were found in the NHS gene: a nonsense mutation (p.Arg373X) and a frameshift mutation (p.His669ProfsX5)."
      explanation: The same nonsense allele in an unrelated Spanish family.
  - name: Xp22.13 microdeletions including NHS
    type: copy number variation
    clinical_significance: PATHOGENIC
    description: >-
      Contiguous deletions removing NHS together with neighbouring genes such
      as REPS2, SCML1 and RAI2 cause the classical syndrome, and larger
      deletions can add features attributable to the co-deleted genes.
    evidence:
    - reference: PMID:35122698
      reference_title: "Identification of a novel microdeletion causative of Nance-Horan syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With the evolution of array-CGH technology, a total of five kindreds with NHS have been reported in the medical literature with microdeletions encompassing the NHS gene rather than sequencing variants."
      explanation: Summarises microdeletions as a recurrent class of Nance-Horan syndrome alleles.
    - reference: PMID:36370055
      reference_title: "Nance-Horan syndrome pedigree due to a novel microdeletion and skewed X chromosome inactivation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The microdeletion contains the REPS2 and NHS genes and was inherited from a phenotypically normal mother."
      explanation: A heterozygous Xp22.13 microdeletion removing NHS in an affected female.
    - reference: PMID:20882036
      reference_title: "Identification of a microdeletion at Xp22.13 in a Taiwanese family presenting with Nance-Horan syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The deleted region encompasses the REPS2, NHS, SCML1 and RAI2 genes, and was transmitted from their carrier mother who presented only mild cataract."
      explanation: A familial Xp22.13 microdeletion including NHS in two affected brothers, with mild expression in the carrier mother.
pathophysiology:
- name: NHS Loss of Function
  description: >-
    Truncating variants, deletions and gene-disrupting rearrangements leave no
    functional NHS protein. NHS is expressed in a temporally and spatially
    regulated pattern in the developing eye, teeth, brain and craniofacial
    region, which is where its loss produces the syndrome. NHS has no enzymatic
    activity and no GO molecular function annotation; its known activity is
    binding, through its WAVE homology domain, the WAVE regulatory complex
    subunits that it assembles into a WAVE shell complex (evidence on the
    downstream node Loss of NHS WAVE Shell Complex), which is the function bound
    here as decreased.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NHS
    term:
      id: hgnc:7820
      label: NHS
  molecular_functions:
  - preferred_term: WAVE regulatory complex subunit binding
    term:
      id: GO:0044877
      label: protein-containing complex binding
    modifier: DECREASED
  evidence:
  - reference: CGGV:assertion_a7f57ca3-efb2-4333-9ae1-732aa429f37a-2017-10-20T100000.000Z
    reference_title: "NHS / Nance-Horan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is loss of function."
    explanation: ClinGen curation states loss of function as the disease mechanism.
  - reference: PMID:41236159
    reference_title: "Nance-Horan Syndrome: Further Delineation of the Affected Male and the Female Carrier Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by deleterious loss of function variants or deletions involving the NHS gene at Xp22.13."
    explanation: Recent cohort study summarising the allelic basis as loss of function.
  downstream:
  - target: Loss of NHS-A at Epithelial Tight Junctions
    causal_link_type: DIRECT
    description: >-
      Truncated NHS-A protein fails to reach the cell periphery where the
      wild-type isoform associates with ZO-1.
    evidence:
    - reference: PMID:18949062
      reference_title: "Novel causative mutations in patients with Nance-Horan syndrome and altered localization of the mutant NHS-A protein isoform."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All three mutant proteins failed to localize to the cellular periphery in epithelial cells and instead were found in the cytoplasm."
      explanation: Patient-derived truncating mutations expressed in epithelial cells mislocalize NHS-A away from the junctional periphery.
  - target: Loss of NHS WAVE Shell Complex
    causal_link_type: DIRECT
    description: >-
      Without NHS, its N-terminal WAVE homology domain no longer assembles the
      WAVE shell complex, and C-terminal truncations reduce NHS function in
      the same assay.
    evidence:
    - reference: PMID:42595116
      reference_title: "The Nance-Horan syndrome protein NHS regulates cell migration persistence by organizing WAVE and N-WASP nucleation-promoting factor complexes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient mutations resulting in NHS proteins truncated at their C-terminus also reduced the ability of NHS i1 to rescue migration persistence."
      explanation: Patient truncations impair the WHD-containing isoform's cellular function.
  - target: Mosaic NHS Expression in Heterozygous Females
    causal_link_type: DIRECT
    description: >-
      In heterozygous females, X-inactivation leaves a mixture of cells
      expressing the normal or the mutant allele, and skewing sets how much
      functional NHS remains.
    evidence:
    - reference: PMID:28922055
      reference_title: "Nance-Horan syndrome in females due to a balanced X;1 translocation that disrupts the NHS gene: Familial case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mother had a preferential inactivation of the normal X chromosome; expression analysis did not detect any mRNA isoform of NHS."
      explanation: Skewed inactivation of the normal X abolished NHS expression in an affected heterozygous female.
  - target: Abnormal Ocular Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:14564667
      reference_title: "Mutations in a novel gene, NHS, cause the pleiotropic effects of Nance-Horan syndrome, including severe congenital cataract, dental anomalies, and mental retardation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found a complex pattern of temporally and spatially regulated expression, which, together with the pleiotropic features of NHS, suggests that this gene has key functions in the regulation of eye, tooth, brain, and craniofacial development."
      explanation: Developmental expression in the mouse eye, together with the human phenotype, places NHS in eye development.
  - target: Abnormal Odontogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:14564667
      reference_title: "Mutations in a novel gene, NHS, cause the pleiotropic effects of Nance-Horan syndrome, including severe congenital cataract, dental anomalies, and mental retardation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found a complex pattern of temporally and spatially regulated expression, which, together with the pleiotropic features of NHS, suggests that this gene has key functions in the regulation of eye, tooth, brain, and craniofacial development."
      explanation: Developmental expression places NHS in tooth development; the cellular intermediates are not established.
  - target: Craniofacial Dysmorphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

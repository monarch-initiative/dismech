    explanation: A balanced X;1 translocation with its breakpoint at Xp22.13 disrupting NHS, showing gene disruption by structural rearrangement as an allelic mechanism.
  - reference: PMID:30642278
    reference_title: "Whole exome sequencing identified a novel truncation mutation in the NHS gene associated with Nance-Horan syndrome."

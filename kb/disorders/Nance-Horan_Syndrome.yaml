- name: Mosaic NHS Expression in Heterozygous Females
  description: >-
    In a heterozygous female each cell expresses either the normal or the
    mutant NHS allele according to which X is active. Random inactivation
    usually yields a mild phenotype, classically posterior Y-sutural lens
    opacities; skewed inactivation of the normal X, or of the normal X in a
    balanced X-autosome translocation carrier, produces a male-like
    presentation. This is X-inactivation mosaicism of a germline allele, not
    post-zygotic somatic mosaicism.
  biological_scale: CELLULAR

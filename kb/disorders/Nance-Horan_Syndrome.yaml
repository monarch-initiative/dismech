      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunolabelling of developing mouse with the anti-NHS antibody that detects both isoforms revealed the protein in the developing head including the eye and brain."
      explanation: NHS protein is present in the developing brain, consistent with a neurodevelopmental role.
  - target: Short metacarpal
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Brachymetacarpalia is part of the classical description; no skeletal
      mechanism for NHS has been studied.
- name: Loss of NHS-A at Epithelial Tight Junctions
  description: >-
    The NHS-A isoform associates with the apical membrane of epithelial cells,
    co-localises and co-immunoprecipitates with the tight junction protein
    ZO-1, and in the developing lens is restricted to the lens epithelium.
    Loss or mislocalisation of NHS-A removes it from these junctions.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  cellular_components:
  - preferred_term: tight junction
    term:
      id: GO:0070160
      label: tight junction
  evidence:
  - reference: PMID:16675532
    reference_title: "Nance-Horan syndrome protein, NHS, associates with epithelial cell junctions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the endogenous and exogenous NHS-A isoform localizes to the cell membrane of mammalian cells in a cell-type-dependent manner and that it co-localizes with the tight junction (TJ) protein ZO-1 in the apical aspect of cell membrane in epithelial cells."
    explanation: Establishes the junctional localisation of NHS-A that is lost in disease.
  - reference: PMID:19447104
    reference_title: "NHS-A isoform of the NHS gene is a novel interactor of ZO-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it immunoprecipitates with the tight junction protein ZO-1 in MDCK (Madin Darby Canine Kidney) epithelial cells and in neonatal rat lens"
    explanation: NHS-A physically associates with ZO-1 in epithelial cells and lens.
  - reference: PMID:16675532
    reference_title: "Nance-Horan syndrome protein, NHS, associates with epithelial cell junctions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the developing mammalian lens, we found continuous expression of NHS that became restricted to the lens epithelium in pre- and postnatal lens."
    explanation: Places NHS in the lens epithelium, the cell population relevant to cataract.
  downstream:
  - target: Lens Epithelial Intercellular Contact Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not demonstrated in lens tissue: loss of junctional NHS-A is
      expected to weaken cell-cell contacts in the lens epithelium.
    evidence:
    - reference: PMID:18949062
      reference_title: "Novel causative mutations in patients with Nance-Horan syndrome and altered localization of the mutant NHS-A protein isoform."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "The mislocalization of the mutant NHS-A protein, revealed by mutation analysis, is expected to adversely affect cell-cell junctions in epithelial cells such as the lens epithelium, which may explain cataractogenesis in Nance-Horan syndrome patients."
      explanation: The authors infer junctional disruption in the lens epithelium from mislocalisation in cultured cells.
- name: Loss of NHS WAVE Shell Complex
  description: >-
    The N-terminus of the long NHS isoforms is a functional WAVE homology
    domain that binds ABI, HSPC300 (BRK1), NCKAP1 (Nap1) and CYFIP (Sra1), the
    WAVE regulatory complex subunits other than WAVE itself, forming a WAVE
    shell complex. Without NHS, ABI1 no longer associates with the WIPF2/N-WASP
    complex.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: SCAR complex
    term:
      id: GO:0031209
      label: SCAR complex
  evidence:
  - reference: PMID:20332100
    reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N-terminus of isoforms NHS-A and NHS-1A, implicated in the pathogenesis of NHS, have a functional WAVE homology domain that interacts with the Abi protein family, haematopoietic stem/progenitor cell protein 300 (HSPC300), Nap1 and Sra1."
    explanation: Defines the WAVE homology domain and its WAVE regulatory complex partners.
  - reference: PMID:42595116
    reference_title: "The Nance-Horan syndrome protein NHS regulates cell migration persistence by organizing WAVE and N-WASP nucleation-promoting factor complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified as major NHS partners all subunits of the WAVE Regulatory Complex (WRC) except WAVE subunits themselves, indicating that the WHD of NHS assembles a WAVE Shell Complex (WSC)."
    explanation: Proteomics of NHS isoform 1 identifies the WAVE shell complex.
  downstream:
  - target: Disorganised Actin Cytoskeleton and Lamellipodial Dynamics
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The NHS WAVE shell complex remodels nucleation-promoting factor
      complexes that feed Arp2/3-dependent branched actin assembly.
    evidence:
    - reference: PMID:42595116
      reference_title: "The Nance-Horan syndrome protein NHS regulates cell migration persistence by organizing WAVE and N-WASP nucleation-promoting factor complexes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that NHS controls cell migration by remodeling NPF complexes and their higher order assembly."
      explanation: Links the NHS-organised complexes to the cellular actin and migration phenotype.
- name: Disorganised Actin Cytoskeleton and Lamellipodial Dynamics
  description: >-
    NHS knockdown disrupts the actin cytoskeleton and the circumferential actin
    ring, increases cell spreading and lamellipod formation, and NHS knockout
    reduces the persistence of cell migration. These are cultured-cell
    phenotypes; the corresponding defect in developing lens, tooth or brain
    tissue has not been shown.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  - preferred_term: regulation of lamellipodium assembly
    term:
      id: GO:0010591
      label: regulation of lamellipodium assembly
    modifier: ABNORMAL
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: DECREASED
  evidence:
  - reference: PMID:20332100
    reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NHS knockdown resulted in the disruption of the actin cytoskeleton."
    explanation: Direct cellular consequence of NHS depletion.
  - reference: PMID:20332100
    reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that NHS controls cell morphology by maintaining the integrity of the circumferential actin ring and controlling lamellipod formation."
    explanation: NHS is required to maintain cortical actin organisation and restrain lamellipodia.
  - reference: PMID:42595116
    reference_title: "The Nance-Horan syndrome protein NHS regulates cell migration persistence by organizing WAVE and N-WASP nucleation-promoting factor complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NHS KO cells displayed reduced migration persistence, a phenotype that was fully rescued by the long isoform 1 (i1) that contains an N-terminal WAVE Homology Domain (WHD), but only partially rescued by the short isoform two (i2), which does not."
    explanation: Knockout reduces migration persistence, rescued by the WHD-containing isoform.
  downstream:
  - target: Abnormal Ocular Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link from defective actin remodelling to developmental
      morphogenesis; not demonstrated in vivo.
    evidence:
    - reference: PMID:20332100
      reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "We suggest that NHS orchestrates actin regulatory protein function in response to signalling events during development."
      explanation: Authors' proposal that the actin-regulatory function operates during development.
- name: Lens Epithelial Intercellular Contact Disruption
  description: >-
    Weakened intercellular contacts in the lens epithelium are the proposed
    tissue-level basis of the dense congenital cataract. The mouse Xcat model
    shows that the defect acts within lens cells.
  biological_scale: TISSUE
  locations:
  - preferred_term: epithelium of lens
    term:
      id: UBERON:0001803
      label: epithelium of lens
  evidence:
  - reference: PMID:16675532
    reference_title: "Nance-Horan syndrome protein, NHS, associates with epithelial cell junctions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT

  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:9268101
    reference_title: "Mental retardation in Nance-Horan syndrome: clinical and neuropsychological assessment in four families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combining our data with those from the literature leads to a frequency of MR in NHS of around 30%. In most cases, MR is mild or moderate (80%) and not associated with motor delay."
    explanation: Pooled frequency of about 30% supports the FREQUENT band (30-79%) at its lower edge, and the severity distribution.
  - reference: PMID:9268101
    reference_title: "Mental retardation in Nance-Horan syndrome: clinical and neuropsychological assessment in four families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR has intra- and inter-familial variability but does not appear to be expressed in carriers."
    explanation: Variability between and within families, and absence in carrier females.
  - reference: PMID:25091991
    reference_title: "Identification of a novel mutation in a Chinese family with Nance-Horan syndrome by whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mental retardation was present in about 30% of the reported cases."
    explanation: Independent restatement of the roughly 30% frequency in the literature.
- name: Autistic behavior
  category: Neurodevelopmental
  phenotype_term:
    preferred_term: Autistic traits
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:9268101
    reference_title: "Mental retardation in Nance-Horan syndrome: clinical and neuropsychological assessment in four families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, a profound mental handicap associated with autistic traits may be observed."
    explanation: Autistic traits accompany profound intellectual disability in some patients.
  - reference: PMID:37221585
    reference_title: "Nance-Horan Syndrome: characterization of dental, clinical and molecular features in three new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P3 also had autistic and psychobehavioral features."
    explanation: Autistic features in a molecularly confirmed patient.
- name: Congenital heart defect
  category: Cardiovascular
  description: >-
    Congenital heart defects, including a ventricular septal defect, are
    reported in a minority of patients. No mechanism has been studied, so no
    causal edge is drawn to this phenotype.
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:34573171
    reference_title: "Prominent and Regressive Brain Developmental Disorders Associated with Nance-Horan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NHS is characterized by congenital cataracts, dental anomalies, and distinctive facial features, and a proportion of the affected individuals also present intellectual disability and congenital cardiopathies."
    explanation: Congenital cardiopathies are reported in a proportion of patients.
  - reference: PMID:37221585
    reference_title: "Nance-Horan Syndrome: characterization of dental, clinical and molecular features in three new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "index (P2) presenting with global developmental delay, microphthalmia, cataracts, and ventricular septal defect"
    explanation: A ventricular septal defect in a patient with a deletion including NHS and 21 other genes, so attribution to NHS alone is uncertain.
diagnosis:
- name: Molecular genetic testing of NHS
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of NHS (as a gene panel or exome) confirms the diagnosis. It is
    recommended for familial bilateral pediatric cataract, because dental and
    neurodevelopmental features can take years to appear and families are
    otherwise counselled as having isolated cataract.
  evidence:
  - reference: PMID:39858638
    reference_title: "Genotype-Phenotype Correlations of Nance-Horan Syndrome in Male and Female Carriers of a Novel Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This reinforces the importance of genetic testing of bilateral familial pediatric cataracts, especially since systemic features such as dental anomalies and intellectual disability may take years before they develop."
    explanation: A family first diagnosed with isolated cataract was recognised as Nance-Horan syndrome only after sequencing.
  - reference: PMID:40868138
    reference_title: "Genetic Landscape of Congenital Cataracts in a Swiss Cohort: Addressing Diagnostic Oversights in Nance-Horan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NHS remains underdiagnosed due to its variable expressivity and the late manifestation of systemic features, often leading to misclassification as isolated CC."
    explanation: Exome sequencing of a congenital cataract cohort identified NHS cases misclassified as isolated cataract.
- name: Copy number and cytogenetic analysis
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  description: >-
    When NHS sequencing is negative, chromosomal microarray detects
    microdeletions including NHS, and karyotype or FISH detects balanced
    X-autosome translocations that disrupt NHS, particularly in affected
    females.
  evidence:
  - reference: PMID:35122698
    reference_title: "Identification of a novel microdeletion causative of Nance-Horan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A chromosomal microarray (CMA) was performed and revealed a 1.83-Mb interstitial microdeletion at Xp22.2p22.13"
    explanation: Chromosomal microarray identified the causal NHS-containing deletion.
  - reference: PMID:34620209
    reference_title: "Allelic and dosage effects of NHS in X-linked cataract and Nance-Horan syndrome: a family study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "justifies consideration of karyotype and fluorescence in situ hybridization (FISH) analysis for female patients with familial NHS if single-gene analysis of NHS is negative"
    explanation: Recommends cytogenetic analysis for sequence-negative affected females.
- name: Dental examination
  diagnosis_term:
    preferred_term: dental examination
    term:
      id: NCIT:C158323
      label: Dental Examination
  description: >-
    The combination of screwdriver-shaped incisors and bud molars is
    distinctive, so a dental examination can point to the diagnosis in a child
    with congenital cataract, and dentists may be the first to suspect it.
  evidence:
  - reference: PMID:27616609
    reference_title: "Nance-Horan syndrome-The oral perspective on a rare disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a dental examination as a part of the diagnostic process may reveal distinct characteristics of the dental morphology, which could be of diagnostic value and facilitate an early diagnosis"
    explanation: Recommends dental examination as part of diagnosis.
- name: Ophthalmic examination of at-risk females
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: >-
    Slit-lamp examination of female relatives for posterior Y-sutural lens
    opacities identifies likely carriers; opacities of other morphology are not
    a carrier sign.
  evidence:
  - reference: PMID:22229851
    reference_title: "Phenotype-genotype correlation in potential female carriers of X-linked developmental cataract (Nance-Horan syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lens opacities that did not have this characteristic morphology in a suspected female carrier were not a carrier sign, even in the context of her affected family members."
    explanation: Defines the specificity of the Y-sutural opacity for carrier detection.
treatments:
- name: Congenital cataract surgery
  description: >-
    Surgical removal of the dense congenital cataracts in infancy, followed by
    optical correction and amblyopia therapy, following the general management
    of infantile cataract. No Nance-Horan-specific surgical outcome study was
    found. Glaucoma after infant cataract surgery is common in general, so the
    glaucoma seen in this syndrome needs follow-up whether developmental or
    postoperative.
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:31317088
    reference_title: "Updates on managements of pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "For significant lens opacity that leads to a considerable risk of amblyopia, cataract surgery is recommended at 6 weeks of age for unilateral cataract and between 6 and 8 weeks of age for bilateral cases."
    explanation: General pediatric cataract guidance on surgical timing, applied to the bilateral congenital cataract of this syndrome; not a Nance-Horan-specific study.
  - reference: PMID:35307324
    reference_title: "Current management of infantile cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Better visual outcomes in operated eyes, however, are achieved in the setting of early presentation, bilateral infantile cataracts, absence of nystagmus or strabismus, and consistent amblyopia therapy."
    explanation: General infantile cataract review on the determinants of visual outcome after surgery.
  - reference: PMID:35307324
    reference_title: "Current management of infantile cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The most common complications of cataract surgery performed in infancy are visual axis opacification and, in about a third of patients, the long-term development of glaucoma."
    explanation: Supports postoperative glaucoma surveillance; a general infantile cataract figure, not measured in this syndrome.
- name: Dental management
  description: >-
    Dental care addresses supernumerary and malformed teeth, including
    extraction of supernumerary incisors.
  treatment_term:
    preferred_term: dental procedure
    term:
      id: NCIT:C38052
      label: Dental Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Supernumerary teeth
    term:
      id: HP:0011069
      label: Supernumerary tooth
  evidence:
  - reference: PMID:15660094
    reference_title: "A previously unreported association between Nance-Horan syndrome and spontaneous dental abscesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case describes the management of a 9-year-old girl referred for the routine management of supernumerary teeth."
    explanation: Case report of dental management of supernumerary teeth in Nance-Horan syndrome.
- name: Educational support
  description: Awareness of intellectual disability guides educational planning for affected boys.
  treatment_term:
    preferred_term: educational intervention
    term:
      id: NCIT:C17874
      label: Educational Intervention
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:9268101
    reference_title: "Mental retardation in Nance-Horan syndrome: clinical and neuropsychological assessment in four families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Awareness of MR in NHS may be of importance in the management of the patients, especially in terms of education."
    explanation: Recommends educational management for the intellectual disability component.
animal_models:
- name: Xcat mouse
  species: Mouse
  genotype: Xcat, a large insertion between exons 1 and 2 of Nhs
  publication: PMID:16357105
  description: >-
    The spontaneous X-linked cataract (Xcat) mouse carries an insertion
    between exons 1 and 2 of Nhs that abolishes the exon 1-containing isoform,
    leaving only the alternative exon 1A isoform, and reduces Nhs protein in
    lens fiber cells. Hemizygous males and homozygous females have fully
    penetrant cataract; heterozygous females show variegated lens opacity.
  modeled_mechanisms:
  - target: NHS Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Isoform-selective loss of the exon 1 Nhs isoform causing congenital cataract.
    limitations: >-
      The allele removes one isoform rather than the whole protein, and the
      cited abstracts report only the lens phenotype; dental, craniofacial and
      neurodevelopmental features are not described.
    evidence:
    - reference: PMID:16357105
      reference_title: "Xcat, a novel mouse model for Nance-Horan syndrome inhibits expression of the cytoplasmic-targeted Nhs1 isoform."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The insertion inhibits the expression of the Nhs1 isoform containing exon 1 and results in exclusive expression of the alternative isoform containing exon 1A."
      explanation: Defines the isoform-selective loss of function in the model.
    - reference: PMID:16357105
      reference_title: "Xcat, a novel mouse model for Nance-Horan syndrome inhibits expression of the cytoplasmic-targeted Nhs1 isoform."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inhibition of expression of the exon 1 containing isoform results in the abnormal phenotype of Xcat."
      explanation: Links the Nhs isoform loss to the cataract phenotype.
  - target: Mosaic NHS Expression in Heterozygous Females
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygous females show variegated lens opacity, the mouse counterpart of variable carrier expression.
    limitations: Mouse X-inactivation and lens growth differ from human, and Y-sutural localisation is not described.
    evidence:
    - reference: PMID:2272505
      reference_title: "Genetic localization and phenotypic expression of X-linked cataract (Xcat) in Mus musculus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Phenotypic expression in Xcat heterozygous females ranges from totally clear to totally opaque lenses."
      explanation: Variable heterozygous expression in the mouse model.
  evidence:
  - reference: PMID:2272505
    reference_title: "Genetic localization and phenotypic expression of X-linked cataract (Xcat) in Mus musculus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In hemizygous males and homozygous females penetrance is complete with only slight variation in the degree of expression."
    explanation: Fully penetrant cataract in hemizygous Xcat males.

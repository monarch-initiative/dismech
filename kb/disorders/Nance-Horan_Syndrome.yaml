name: Nance-Horan Syndrome
creation_date: "2026-10-14T20:49:40Z"
category: Mendelian
synonyms:
- Nance-Horan syndrome
- NHS
- cataract-dental syndrome
- X-linked cataract-dental syndrome
- cataract-oto-dental syndrome
- mesiodens-cataract syndrome
- cataract X-linked with Hutchinsonian teeth
disease_term:
  preferred_term: Nance-Horan syndrome
  term:
    id: MONDO:0010545
    label: Nance-Horan syndrome
parents:
- X-linked genetic disorders
- Syndromic congenital cataract
- Disorders of tooth development
description: >-
  Nance-Horan syndrome is a rare X-linked developmental disorder caused by
  loss of function of NHS, a gene at Xp22.13 encoding a regulator of actin
  remodelling and of epithelial cell junctions. Hemizygous males have dense
  bilateral congenital cataracts with microcornea, distinctive dental anomalies
  (screwdriver-shaped incisors, bud-shaped molars and supernumerary teeth), a
  long face with a prominent or bulbous nose and anteverted ears, and in about
  a third of cases intellectual disability. Heterozygous females usually show a
  milder phenotype, most characteristically lens opacities centred on the
  posterior Y-suture, with expressivity that varies with the pattern of
  X-chromosome inactivation. Copy number changes that alter NHS transcription
  without abolishing the protein cause isolated X-linked congenital cataract
  (cataract 40), which is an allelic but separately classified disease.
notes: >-
  Scope and lump/split. Isolated X-linked congenital cataract (CXN; cataract
  40, MONDO:0010544, OMIM 302200) is allelic at NHS but is not lumped here,
  either as a subtype or as part of this entry. MONDO classifies it separately,
  under early-onset non-syndromic cataract, and the published mechanism
  differs: the two CXN families characterised in PMID:19414485 carried a
  complex duplication-triplication rearrangement and an intragenic deletion
  predicted to alter NHS transcriptional regulation, whereas the Nance-Horan
  syndrome alleles in the same study were truncations or deletions leaving no
  functional protein. A separate stub (stubs/Cataract_40.yaml) remains in the
  curation queue for it. The boundary is not absolute: truncating NHS variants
  are sometimes first diagnosed as isolated familial cataract because the
  dental and systemic features emerge later or are subtle (PMID:39858638,
  PMID:40868138), so a clinically isolated cataract with an NHS truncating
  allele belongs in this entry. A single missense allele (p.P551S) has been
  reported to segregate with the syndrome, including a cardiac anomaly, in one
  Tunisian family (PMID:21559051); it is not listed as a variant here because
  it is a single-family report against a loss-of-function mechanism otherwise
  carried by truncations and deletions. No GeneReviews chapter exists for this
  disease (PubMed query "Nance-Horan syndrome[TI] AND genereviews[book]"
  returned 0 records on 2026-10-14). No population prevalence figure was found
  in a quotable source; a 2017 case report states that the incidence has not
  been established (PMID:29042737). Hearing loss, axial hypotonia and foot
  contractures reported with a 1.83-Mb contiguous deletion (PMID:35122698) are
  not listed as phenotypes, because that deletion removes eight other genes.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  description: >-
    NHS lies on Xp22.13. Hemizygous males carry the full phenotype, while
    heterozygous females range from unaffected to a near-complete male-like
    presentation, most often showing posterior Y-sutural lens opacities with or
    without mild dental and facial features. Because heterozygotes commonly
    express the trait, the condition is described as X-linked dominant in some
    reports and X-linked recessive in others; the generic X-linked term is bound
    here for that reason, matching ClinGen's XL designation. Female expressivity
    tracks X-inactivation, which is recorded as a pathophysiology node rather
    than as somatic mosaicism.
  evidence:
  - reference: PMID:14564667
    reference_title: "Mutations in a novel gene, NHS, cause the pleiotropic effects of Nance-Horan syndrome, including severe congenital cataract, dental anomalies, and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nance-Horan syndrome (NHS) is an X-linked disorder characterized by congenital cataracts, dental anomalies, dysmorphic features, and, in some cases, mental retardation."
    explanation: Gene-discovery study describing the X-linked inheritance of the syndrome.
  - reference: PMID:6467651
    reference_title: "The Nance-Horan syndrome: a rare X-linked ocular-dental trait with expression in heterozygous females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous reports have described blindness in affected males but posterior sutural cataracts with normal vision as the primary ocular expression in heterozygous females."
    explanation: Family study documenting full expression in hemizygous males and milder expression in heterozygous females.
  - reference: CGGV:assertion_a7f57ca3-efb2-4333-9ae1-732aa429f37a-2017-10-20T100000.000Z
    reference_title: "NHS / Nance-Horan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NHS | HGNC:7820 | Nance-Horan syndrome | MONDO:0010545 | XL | Definitive"
    explanation: ClinGen records the mode of inheritance for the NHS gene-disease pair as X-linked.
genetic:
- name: NHS
  gene_term:
    preferred_term: NHS
    term:
      id: hgnc:7820
      label: NHS
  relationship_type: CAUSATIVE
  association: Loss-of-function
  notes: >-
    Pathogenic alleles are mostly nonsense and frameshift variants, with
    partial or whole-gene deletions, an intragenic inversion and balanced
    X-autosome translocations that disrupt the gene. All are expected to leave
    no functional NHS protein.

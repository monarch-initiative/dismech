    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Nance-Horan syndrome (NHS) is an infrequent X-linked disorder typified by dense congenital central cataracts, microcornea, anteverted and simplex pinnae, brachymetacarpalia, and numerous dental anomalies."

    evidence_source: MODEL_ORGANISM
    snippet: "A variegated pattern of lens opacity was evident in female heterozygotes."
    explanation: Variegated lens opacity in heterozygous Xcat mice reflects X-inactivation mosaicism within the lens.
  downstream:

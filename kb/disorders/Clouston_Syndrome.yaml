diagnosis:
- name: Clinical Diagnosis
  description: >
    Clinical recognition is based on the classic triad of nail dystrophy,
    hypotrichosis/alopecia, and palmoplantar keratoderma with preserved
    sweating and normal dentition. Phenotypic overlap with other
    genodermatoses and intrafamilial variability can confound diagnosis.
  evidence:
  - reference: PMID:20301379
    reference_title: "Hidrotic Ectodermal Dysplasia 2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of HED2 is established in a proband with suggestive findings
      and a heterozygous pathogenic variant in GJB6 identified by molecular
      genetic testing.
    explanation: >-
      Establishes that clinical recognition of suggestive findings is paired with
      molecular genetic confirmation.
- name: Molecular Genetic Testing
  description: >
    Sanger sequencing or whole-exome sequencing of GJB6 to identify
    pathogenic missense variants. Molecular confirmation is strongly
    recommended due to phenotypic overlap with other ectodermal
    dysplasias and connexin disorders.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:36645631
    reference_title: "A novel variant in the GJB6 gene in a large Chinese family with a unique phenotype of Clouston syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic testing is necessary for the diagnosis of Clouston syndrome
    explanation: >-
      Concludes that molecular genetic testing is essential for definitive
      diagnosis.
differential_diagnoses:
- name: Keratitis-Ichthyosis-Deafness Syndrome
  description: >-
    Allelic and non-allelic connexin genodermatosis (most often GJB2, rarely GJB6)
    with overlapping nail dystrophy, alopecia, and palmoplantar keratoderma.
  disease_term:
    preferred_term: keratitis-ichthyosis-deafness syndrome
    term:
      id: MONDO:0007850
      label: autosomal dominant keratitis-ichthyosis-hearing loss syndrome
  distinguishing_features:
  - Progressive vascularizing keratitis and profound congenital sensorineural hearing loss are hallmark features of KID syndrome
  - Ichthyosiform erythrokeratoderma rather than isolated palmoplantar keratoderma and nail/hair dysplasia
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, mutations in other connexins, such as Cx26 (encoded by GJB2), can cause some overlapping features of HED including nail dystrophy, hair loss, and palmoplantar keratoderma"
    explanation: Highlights overlapping cutaneous features between GJB2-related connexin disorders (including KID syndrome) and Clouston syndrome.
  - reference: PMID:25575739
    reference_title: "Phenotypic variability in gap junction syndromic skin disorders: experience from KID and Clouston syndromes' clinical diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Last but not least, KID syndrome diagnosis should also be excluded (van Steensel et al. 2004)."
    explanation: Explicitly identifies KID syndrome as a key differential diagnosis to exclude when evaluating suspected Clouston syndrome.
- name: Pachyonychia Congenita
  description: Autosomal dominant keratin disorder presenting with hypertrophic nail dystrophy and palmoplantar keratoderma that can lead to misdiagnosis of Clouston syndrome.
  disease_term:
    preferred_term: pachyonychia congenita
    term:
      id: MONDO:0016471
      label: pachyonychia congenita
  distinguishing_features:
  - Historically misdiagnosed in families with Clouston syndrome when nail dystrophy and palmoplantar hyperkeratosis are prominent
  - Pathogenic variants in keratin genes rather than GJB6
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In previous reports carrying p. A88V mutation, nail abnormalities in HED usually presented with short, thickened and brittle nail plates mimic pachyonychia congenita"
    explanation: Demonstrates that nail abnormalities in Clouston syndrome mimic pachyonychia congenita.
  - reference: PMID:25575739
    reference_title: "Phenotypic variability in gap junction syndromic skin disorders: experience from KID and Clouston syndromes' clinical diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter has recently been shown to be falsely recognized in seven patients instead of Clouston syndrome (Hale et al. 2014)."
    explanation: Documents frequent clinical misdiagnosis of Clouston syndrome as pachyonychia congenita.
- name: Ectodermal Dysplasia Syndromes with Sweating or Dental Abnormalities
  description: Other hereditary ectodermal dysplasias presenting with hypotrichosis and nail dystrophy but accompanied by abnormal sweat glands or abnormal dentition.
  distinguishing_features:
  - Presence of sweat gland dysfunction or dental anomalies, whereas Clouston syndrome features normal sweat glands and normal teeth
  - Absence of pathogenic GJB6 variants on molecular genetic testing
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The main clinical manifestations of HED are nail dystrophy, alopecia and palmoplantar hyperkeratosis with normal sweat glands and teeth.
    explanation: Highlights that Clouston syndrome is distinguished within the ectodermal dysplasia spectrum by normal sweat glands and normal teeth.
histopathology:
- name: Absence of Hair Follicles with Preserved Eccrine Glands
  description: >
    Skin biopsy shows hyperkeratosis with absence of hair follicles but
    normal distribution of eccrine and sebaceous glands. This pattern
    distinguishes Clouston syndrome from anhidrotic ectodermal dysplasias.
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin biopsy of trunk showed hyperkeratosis with normal distribution
      of eccrine and sebaceous gland, but absence of hair follicles
    explanation: >-
      Histopathological finding in an affected patient confirming the
      characteristic pattern of absent hair follicles with preserved glands.
treatments:
- name: Symptomatic Nail Care
  description: >
    Regular trimming, filing, and protective measures for dystrophic nails.
    No disease-modifying treatment is currently available for HED.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, there are no effective treatments for HED, and gene therapy
      is just a concept
    explanation: >-
      Confirms the absence of effective treatments, supporting symptomatic
      management as the current standard.
- name: Dermatologic Management of Keratoderma
  description: >
    Topical keratolytics (urea, salicylic acid) and emollients for
    palmoplantar hyperkeratosis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: urea
      term:
        id: CHEBI:16199
        label: urea
    - preferred_term: salicylic acid
      term:
        id: CHEBI:16914
        label: salicylic acid
  evidence:
  - reference: PMID:20301379
    reference_title: "Hidrotic Ectodermal Dysplasia 2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of manifestations: Special hair care products to help manage dry
      and sparse hair; wigs; artificial nails; emollients and keratolytics to
      relieve palmoplantar hyperkeratosis.
    explanation: >-
      GeneReviews recommends emollients and keratolytics to relieve palmoplantar
      hyperkeratosis.
- name: Hemichannel-Blocking Antibody Therapy (Preclinical)
  description: >
    The monoclonal antibody abEC1.1, which blocks connexin hemichannels, has shown
    preclinical promise in a Cx30-A88V mouse model of Clouston syndrome. Topical
    and systemic administration reduced skin cell proliferation and sebaceous gland
    size, supporting hemichannel blockade as a candidate therapeutic strategy.
  evidence:
  - reference: PMID:38827992
    reference_title: "Connexins in epidermal health and diseases: insights into their mutations, implications, and therapeutic solutions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several therapeutics, including non-peptide chemicals, antibodies, mimetic
      peptides and allele-specific small interfering RNAs are promising in treating
      connexin-related skin disorders
    explanation: >-
      Reviews preclinical therapeutic approaches including hemichannel-blocking
      antibodies for connexin-related skin disorders including Clouston syndrome.
- name: Wig Use for Alopecia
  description: >
    Wigs or hairpieces for cosmetic management of alopecia.
  evidence:
  - reference: PMID:20301379
    reference_title: "Hidrotic Ectodermal Dysplasia 2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of manifestations: Special hair care products to help manage dry
      and sparse hair; wigs; artificial nails; emollients and keratolytics to
      relieve palmoplantar hyperkeratosis.
    explanation: >-
      GeneReviews lists wigs and special hair care products for managing
      alopecia and sparse hair.
- name: Genetic Counseling
  description: >
    Counseling regarding autosomal dominant inheritance pattern and recurrence
    risk. Prenatal diagnosis is possible through identification of known
    family mutations in GJB6.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32843087
    reference_title: "A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fetus carrying the mutation can be identified by prenatal diagnosis,
      which showed prenatal diagnosis supplies a method to prevent the mutated
      genes from transmitting to next generation
    explanation: >-
      Supports the role of genetic counseling and prenatal diagnosis for
      families with known GJB6 mutations.

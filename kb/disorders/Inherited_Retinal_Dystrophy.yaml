    snippet: Presenting symptoms included nyctalopia (85.4%) photosensitivity/hemeralopia (60.5%), and decreased color vision (55.8%).
    explanation: In a cohort of 199 retinitis pigmentosa patients, decreased color vision was a presenting symptom in 55.8%, supporting color vision impairment as a frequent IRD phenotype.

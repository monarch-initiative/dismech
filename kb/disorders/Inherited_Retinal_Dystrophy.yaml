      label: Nyctalopia
  evidence:
  - reference: PMID:17113430
    reference_title: Retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients typically lose night vision in adolescence
    explanation: Night blindness (nyctalopia) is the characteristic earliest symptom of rod-predominant inherited retinal dystrophy.
- category: Clinical
  name: Progressive Visual Field Constriction
  description: Progressive loss of peripheral visual field ("tunnel vision") from mid-peripheral rod degeneration, characteristic of retinitis pigmentosa.
  phenotype_term:

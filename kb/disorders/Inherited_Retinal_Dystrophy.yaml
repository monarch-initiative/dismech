    snippet: Presenting symptoms included nyctalopia (85.4%) photosensitivity/hemeralopia (60.5%), and decreased color vision (55.8%).
    explanation: Photosensitivity/hemeralopia was a presenting symptom in 60.5% of a retinitis pigmentosa cohort, supporting photophobia as a common IRD feature.

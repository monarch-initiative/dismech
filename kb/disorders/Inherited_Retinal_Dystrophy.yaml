    explanation: GeneReviews documents reduced visual acuity as a presenting feature of RPE65-related early-onset severe retinal dystrophy.
- category: Clinical
  name: Color Vision Impairment
  description: Impaired color discrimination (dyschromatopsia), a prominent feature of cone-predominant and mixed IRDs and a frequent presenting symptom in retinitis pigmentosa cohorts.
  phenotype_term:

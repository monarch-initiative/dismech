    snippet: Inherited retinal diseases (IRDs) are a leading cause of blindness worldwide.
    explanation: Confirms IRDs collectively as a leading worldwide cause of blindness.
- name: Childhood-to-adolescence onset and marked heterogeneity
  description: Non-syndromic IRDs such as retinitis pigmentosa and Leber congenital amaurosis typically present between early childhood and late adolescence and are highly genetically and phenotypically heterogeneous.
  evidence:

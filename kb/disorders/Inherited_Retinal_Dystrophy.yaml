    snippet: Leber congenital amaurosis (LCA) and early-onset severe retinal dystrophy (EOSRD) are both genetically and phenotypically heterogeneous, and characterised clinically by severe congenital/early infancy visual loss, nystagmus, amaurotic pupils and markedly reduced/absent full-field electroretinograms.
    explanation: Establishes nystagmus as a hallmark clinical feature of Leber congenital amaurosis and early-onset severe retinal dystrophy.
genetic:
- name: RPE65
  features: RPE65 encodes the retinoid isomerohydrolase of the visual cycle; biallelic loss-of-function variants cause early-onset severe IRD / Leber congenital amaurosis, treatable with voretigene neparvovec gene therapy.
  gene_term:
    preferred_term: RPE65
    term:
      id: hgnc:10294
      label: RPE65
  association: Causative
  evidence:
  - reference: PMID:31725251
    reference_title: Autosomal Recessive RPE65-Related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The three phenotypes of autosomal recessive RPE65-related retinal degeneration, from most severe to mildest, are Leber congenital amaurosis (LCA), early-onset severe retinal dystrophy (EOSRD), and juvenile retinitis pigmentosa (RP).
    explanation: Confirms biallelic RPE65 variants cause a spectrum of inherited retinal degeneration spanning LCA, EOSRD, and juvenile RP.
- name: RHO
  features: RHO encodes rhodopsin, the rod visual pigment; variants are a common cause of autosomal dominant retinitis pigmentosa (and a recessive form).
  gene_term:
    preferred_term: RHO
    term:
      id: hgnc:10012
      label: RHO
  association: Causative
  evidence:
  - reference: PMID:29042326
    reference_title: The molecular and cellular basis of rhodopsin retinitis pigmentosa reveals potential strategies for therapy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Inherited mutations in the rod visual pigment, rhodopsin, cause the degenerative blinding condition, retinitis pigmentosa (RP). Over 150 different mutations in rhodopsin have been identified and, collectively, they are the most common cause of autosomal dominant RP (adRP).
    explanation: Confirms that mutations in rhodopsin (RHO) cause retinitis pigmentosa and are collectively the most common cause of autosomal dominant retinitis pigmentosa.
- name: ABCA4
  features: ABCA4 encodes the photoreceptor flippase that clears retinoid by-products; biallelic variants cause Stargardt disease and a spectrum of cone-rod and rod-cone dystrophies.
  gene_term:
    preferred_term: ABCA4
    term:
      id: hgnc:34
      label: ABCA4
  association: Causative
  evidence:
  - reference: PMID:21296825
    reference_title: Cone photoreceptor abnormalities correlate with vision loss in patients with Stargardt disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At least one disease-causing mutation in the ABCA4 gene was identified in 11 of 12 patients studied; 1 of 12 patients showed no disease-causing ABCA4 mutations.
    explanation: Confirms disease-causing ABCA4 mutations in patients with Stargardt macular dystrophy.
  - reference: PMID:30679166
    reference_title: 'Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'We discuss the genetics, and clinical, psychophysical, electrophysiological and retinal imaging characteristics of cone and cone-rod dystrophies, focusing particularly on four of the most common disease-associated genes: GUCA1A, PRPH2, ABCA4 and RPGR'
    explanation: Identifies ABCA4 among the most common causative genes in progressive cone and cone-rod dystrophies.
- name: RPGR
  features: RPGR encodes the retinitis pigmentosa GTPase regulator at the connecting cilium; variants cause the most common form of X-linked retinitis pigmentosa as well as X-linked cone and cone-rod dystrophy.
  gene_term:
    preferred_term: RPGR
    term:
      id: hgnc:10295
      label: RPGR
  association: Causative
  evidence:
  - reference: PMID:29528978
    reference_title: 'CLINICAL AND GENETIC CHARACTERISTICS OF MALE PATIENTS WITH RPGR-ASSOCIATED RETINAL DYSTROPHIES: A Long-Term Follow-up Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RPGR-ORF15 mutations were associated with COD/CORD and with a more severe phenotype in RP.
    explanation: Long-term clinical cohort study confirms that RPGR mutations cause X-linked retinitis pigmentosa as well as cone and cone-rod dystrophy.
- name: USH2A
  features: USH2A encodes usherin; variants cause autosomal recessive retinitis pigmentosa (non-syndromic) and Usher syndrome type 2 (with hearing loss).
  gene_term:
    preferred_term: USH2A
    term:
      id: hgnc:12601
      label: USH2A
  association: Causative
  evidence:
  - reference: PMID:20301515
    reference_title: Usher Syndrome Type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of biallelic pathogenic variants in one of three genes – ADGRV1, USH2A, or WHRN – establishes the diagnosis if clinical features are inconclusive.
    explanation: GeneReviews confirms that biallelic pathogenic variants in USH2A establish the diagnosis of Usher syndrome type II (retinitis pigmentosa with congenital sensorineural hearing loss).
- name: CHM
  features: CHM encodes Rab escort protein 1 (REP-1); loss-of-function variants cause X-linked choroideremia.
  gene_term:
    preferred_term: CHM
    term:
      id: hgnc:1940
      label: CHM
  association: Causative
  evidence:
  - reference: PMID:20301511
    reference_title: Choroideremia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of choroideremia is established in a male proband with suggestive findings and a hemizygous pathogenic variant in CHM identified by molecular genetic testing.
    explanation: Confirms hemizygous pathogenic variants in CHM as causative of choroideremia.
diagnosis:
- name: Multimodal retinal imaging and electroretinography
  diagnosis_term:
    preferred_term: retinal examination
    term:
      id: NCIT:C101217
      label: Retinal Examination
  description: Clinical diagnosis combines visual acuity, visual fields, dilated fundus examination, multimodal retinal imaging (OCT, fundus autofluorescence), and full-field electroretinography to characterize rod and cone photoreceptor and RPE involvement.
  results: Diminished or non-recordable rod and/or cone ERG responses, outer retinal layer loss on OCT, and pigmentary or autofluorescence abnormalities establish clinical retinal dystrophy.
  evidence:
  - reference: PMID:17113430
    reference_title: Retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Measures of retinal function, such as the electroretinogram, show that photoreceptor function is diminished generally many years before
    explanation: Establishes electroretinography as a core functional diagnostic test for photoreceptor dysfunction in IRDs.
  - reference: PMID:37446072
    reference_title: Clinical Characteristics and Genetic Variants of a Large Cohort of Patients with Retinitis Pigmentosa Using Multimodal Imaging and Next Generation Sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A database was curated to record history and examination, genetic findings, and ocular imaging. Causative pathogenic and likely pathogenic variants were recorded. Disease status was further characterized by ocular coherence tomography (OCT) and fundus autofluorescence (AF).
    explanation: Documents the standard diagnostic combination of clinical examination, ocular coherence tomography (OCT), and fundus autofluorescence (AF).
- name: Next-generation sequencing molecular genetic testing
  diagnosis_term:
    preferred_term: next generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  description: Targeted IRD multigene panels, exome sequencing, or genome sequencing identify the causative pathogenic variant(s) across the >280 IRD genes, confirming the molecular subtype and determining gene-therapy eligibility.
  results: Identification of pathogenic autosomal recessive, autosomal dominant, or X-linked variants in an IRD gene confirms the molecular diagnosis.
  evidence:
  - reference: PMID:37525225
    reference_title: 'A multidisciplinary approach to inherited retinal dystrophies from diagnosis to initial care: a narrative review with inputs from clinical practice.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Improvements in genome sequencing techniques, such as next-generation sequencing, have greatly facilitated the complex process of determining IRD-causing gene variants and establishing a molecular diagnosis.
    explanation: Confirms next-generation sequencing molecular genetic testing as the diagnostic standard for establishing a specific IRD diagnosis.
differential_diagnoses:
- name: Usher syndrome
  description: Syndromic retinal dystrophy combining retinitis pigmentosa with congenital or progressive sensorineural hearing impairment and variable vestibular dysfunction (e.g., USH2A, MYO7A); distinguished from non-syndromic IRD by audiovestibular involvement.
  disease_term:
    preferred_term: Usher syndrome
    term:
      id: MONDO:0019501
      label: Usher syndrome
  distinguishing_features:
  - Congenital bilateral sensorineural hearing loss and variable vestibular dysfunction accompanying retinitis pigmentosa.
  evidence:
  - reference: PMID:20301515
    reference_title: Usher Syndrome Type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Usher syndrome type II (USH2) is characterized by the following: Congenital, bilateral sensorineural hearing loss that is mild to moderate in the low frequencies and severe to profound in the higher frequencies. Intact or variable vestibular responses. Retinitis pigmentosa (RP); progressive, bilateral, symmetric retinal degeneration that begins with night blindness and constricted visual fields (tunnel vision) and eventually includes decreased central visual acuity'
    explanation: GeneReviews establishes that Usher syndrome combines retinitis pigmentosa with congenital bilateral sensorineural hearing loss, distinguishing syndromic Usher syndrome from non-syndromic inherited retinal dystrophy.
- name: Stargardt disease
  description: Juvenile- or young-adult-onset macular dystrophy caused by biallelic ABCA4 variants, presenting with central scotomas (sometimes with foveal sparing), macular cone spacing abnormalities, and lipofuscin-driven fundus autofluorescence changes rather than primary pan-retinal rod-cone degeneration, though severe biallelic ABCA4 alleles overlap with cone-rod and rod-cone IRD.
  disease_term:
    preferred_term: Stargardt disease
    term:
      id: MONDO:0019353
      label: Stargardt disease
  distinguishing_features:
  - Central scotomas (with occasional foveal sparing), early macular cone spacing abnormalities, and lipofuscin-driven macular autofluorescence changes caused by ABCA4 mutations.
  evidence:
  - reference: PMID:21296825
    reference_title: Cone photoreceptor abnormalities correlate with vision loss in patients with Stargardt disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Central scotomas were present in all patients, although the fovea was spared in three patients. The earliest cone spacing abnormalities were observed in regions of homogeneous AF, normal visual function, and normal outer retinal structure.
    explanation: Demonstrates that Stargardt disease presents with central scotomas (with foveal sparing in a subset) and macular cone spacing abnormalities on high-resolution imaging.
  - reference: PMID:21296825
    reference_title: Cone photoreceptor abnormalities correlate with vision loss in patients with Stargardt disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings provide support for a model of disease progression in which lipofuscin accumulation results in homogeneously increased AF with cone spacing abnormalities, followed by heterogeneously increased AF with cone loss, then reduced AF with cone and RPE cell death.
    explanation: Establishes lipofuscin accumulation driving macular fundus autofluorescence abnormalities and sequential macular cone and RPE cell death in ABCA4-associated Stargardt disease.
treatments:
- name: Voretigene Neparvovec Gene Therapy
  therapeutic_modality: GENE_THERAPY
  description: Subretinal AAV2-mediated gene-augmentation therapy delivering a functional RPE65 cDNA, approved for biallelic RPE65-mutation-associated retinal dystrophy. Improves functional vision and light sensitivity.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:28712537
    reference_title: 'Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 1 year, mean bilateral MLMT change score was 1·8 (SD 1·1) light levels in the intervention group versus 0·2 (1·0) in the control group
    explanation: The pivotal phase 3 randomised controlled trial demonstrated that voretigene neparvovec improved functional vision (multi-luminance mobility testing) in RPE65-mediated inherited retinal dystrophy.
  - reference: PMID:42425207
    reference_title: 'Post-approval outcomes of voretigene neparvovec (Luxturna®) retinal gene therapy: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: improvements in full-field stimulus threshold testing of 2.2 log10cd.s.m-2 (95% CI -2.87 to -1.53; P < 0.001) and in visual acuity of 0.08 logMAR (95% CI -0.16-0; P = 0.040)
    explanation: Systematic review and meta-analysis of post-approval real-world data confirms clinically meaningful improvements in full-field stimulus threshold and visual acuity with voretigene neparvovec in RPE65-mediated disease.
  - reference: PMID:42425207
    reference_title: 'Post-approval outcomes of voretigene neparvovec (Luxturna®) retinal gene therapy: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chorioretinal atrophy, a complication not observed in clinical trials, was reported in a subset of studies
    explanation: Real-world post-approval data reveal an emerging safety signal of chorioretinal atrophy in voretigene neparvovec-treated patients, a complication not observed in the pivotal clinical trials, indicating need for long-term monitoring.
- name: Vitamin A Supplementation
  description: Historically used dietary intervention proposed to slow electroretinographic decline in some forms of retinitis pigmentosa; benefit is modest and contraindicated in ABCA4-related (Stargardt) disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:17113430
    reference_title: Retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nutritional interventions, including vitamin A palmitate and omega-3-rich fish, slow progression of disease in many patients
    explanation: Controlled-trial data cited in this Seminar indicate vitamin A palmitate and omega-3 supplementation modestly slow disease progression in retinitis pigmentosa, though benefit is limited and not applicable to all IRD subtypes (e.g., ABCA4-related disease).
- name: Low Vision Rehabilitation
  description: Supportive care including low-vision aids, orientation and mobility training, and visual rehabilitation to maximize residual function.
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:37525225
    reference_title: 'A multidisciplinary approach to inherited retinal dystrophies from diagnosis to initial care: a narrative review with inputs from clinical practice.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As IRDs can present at an early age, clinicians need to be aware of the clinical signs suggesting visual impairment and follow up with multidisciplinary support for timely diagnoses to facilitate appropriate therapeutic or rehabilitation intervention to minimize vision loss.
    explanation: Supports low-vision rehabilitation as a core pillar of multidisciplinary patient care in inherited retinal dystrophies.
- name: Genetic Counseling
  description: Genetic counseling and molecular diagnosis are core components of IRD management, informing prognosis, inheritance-based recurrence risk, family planning, and eligibility for gene-specific therapies and trials.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31725251
    reference_title: Autosomal Recessive RPE65-Related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'GENETIC COUNSELING: RPE65-related retinal degeneration is inherited in an autosomal recessive manner.'
    explanation: GeneReviews includes a dedicated genetic counseling section for RPE65-related retinal degeneration, reflecting genetic counseling as a core component of inherited retinal dystrophy management.

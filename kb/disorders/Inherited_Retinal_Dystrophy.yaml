- name: Photoreceptor Cell Death
  description: The convergent endpoint of all IRD mechanisms is progressive, irreversible apoptotic (and non-apoptotic) death of rod and/or cone photoreceptors, producing the corresponding visual phenotype. Rod loss tends to occur first in rod-cone dystrophies (night blindness, peripheral field loss), while cone loss dominates in cone-rod dystrophies (central acuity and color vision loss).

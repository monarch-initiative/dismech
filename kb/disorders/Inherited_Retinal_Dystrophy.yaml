progression:
- phase: Infantile-to-adolescent symptom onset
  age_range: Infancy through late adolescence
  notes: Early-onset severe forms such as Leber congenital amaurosis manifest in the first year of life, whereas rod-cone and cone-rod dystrophies generally manifest between early childhood and late adolescence.
  evidence:
  - reference: PMID:37525225
    reference_title: 'A multidisciplinary approach to inherited retinal dystrophies from diagnosis to initial care: a narrative review with inputs from clinical practice.'

- name: Visual Cycle and Phototransduction Disruption
  description: A second major class of IRD genes encodes components of the retinoid (visual) cycle and the phototransduction cascade. Defects in RPE65, LRAT, RDH genes, RPE-photoreceptor retinoid recycling, or in phototransduction proteins (RHO, GUCY2D, PDE6, CNGA1) impair regeneration of 11-cis-retinal or the conversion of light into a neural signal, causing photoreceptor dysfunction and, when chronic, degeneration.

- name: RPE Dysfunction and Toxic Metabolite Accumulation
  description: The RPE supports photoreceptors via the visual cycle, daily phagocytosis of shed outer-segment discs, and metabolic and barrier functions. In IRDs such as ABCA4-related disease (Stargardt) and choroideremia, defective clearance of retinoid by-products leads to accumulation of toxic bisretinoids (lipofuscin/A2E) in the RPE, RPE cell death, and secondary photoreceptor and choriocapillaris degeneration.

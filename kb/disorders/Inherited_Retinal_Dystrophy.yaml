    snippet: Non-syndromic inherited retinal dystrophies (IRDs) such as retinitis pigmentosa or Leber congenital amaurosis generally manifest between early childhood and late adolescence
    explanation: Supports the childhood-to-late-adolescence onset window for non-syndromic inherited retinal dystrophies.
  - reference: PMID:31725251
    reference_title: Autosomal Recessive RPE65-Related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In RPE65-related LCA, onset of visual manifestations frequently occurs in infancy during the first year of life.
    explanation: Supports first-year-of-life onset at the severe congenital/infantile end of the IRD spectrum.
- phase: Progressive rod-to-cone or cone-to-rod visual decline
  age_range: Adolescence through adulthood
  notes: Progressive photoreceptor loss typically produces night blindness in adolescence, peripheral visual field constriction in young adulthood, and central vision loss in later life.
  evidence:
  - reference: PMID:17113430
    reference_title: Retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients typically lose night vision in adolescence, side vision in young adulthood, and central vision in later life because of progressive loss of rod and cone photoreceptor cells
    explanation: Documents the natural history of progressive visual decline across adolescence, young adulthood, and later life.
has_subtypes:
- name: RP
  display_name: Retinitis Pigmentosa
  subtype_term:
    preferred_term: retinitis pigmentosa
    term:
      id: MONDO:0019200
      label: retinitis pigmentosa
  description: The most common IRD; a rod-cone dystrophy beginning with rod photoreceptor degeneration producing night blindness and progressive peripheral (mid-peripheral) visual field constriction, followed by cone involvement and eventual central vision loss. Hallmark fundus findings are bone-spicule pigmentation, attenuated retinal vessels, and waxy disc pallor. Inherited as autosomal recessive, autosomal dominant, or X-linked, and caused by variants in dozens of genes (e.g., RHO, USH2A, RPGR).
  evidence:
  - reference: PMID:17113430
    reference_title: Retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients typically lose night vision in adolescence, side vision in young adulthood, and central vision in later life because of progressive loss of rod and cone photoreceptor cells
    explanation: Defines retinitis pigmentosa as a rod-cone dystrophy with the characteristic sequence of night blindness, peripheral then central vision loss from photoreceptor degeneration.
- name: LCA
  display_name: Leber Congenital Amaurosis
  subtype_term:
    preferred_term: Leber congenital amaurosis
    term:
      id: MONDO:0018998
      label: Leber congenital amaurosis
  description: The most severe and earliest-onset IRD, presenting in the first year of life with profound visual impairment, nystagmus, sluggish pupillary responses, and a severely reduced or non-recordable electroretinogram. Caused by biallelic variants in genes including RPE65, CEP290, GUCY2D, and CRB1. RPE65-associated LCA is treatable with voretigene neparvovec gene therapy.
  evidence:
  - reference: PMID:31725251
    reference_title: Autosomal Recessive RPE65-Related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In RPE65-related LCA, onset of visual manifestations frequently occurs in infancy during the first year of life.
    explanation: GeneReviews documents the congenital/infantile onset that defines Leber congenital amaurosis as the most severe, earliest-onset IRD.
- name: Cone-Rod Dystrophy
  display_name: Cone-Rod Dystrophy
  subtype_term:
    preferred_term: cone-rod dystrophy
    term:
      id: MONDO:0015993
      label: cone-rod dystrophy
  description: A cone-predominant IRD in which cone degeneration precedes or exceeds rod loss, producing early central vision loss, reduced visual acuity, photophobia, dyschromatopsia, and central scotomas, with later peripheral field involvement. Caused by variants in genes such as ABCA4, CRX, and GUCY2D.
  evidence:
  - reference: PMID:30679166
    reference_title: 'Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Progressive cone and cone-rod dystrophies are a clinically and genetically heterogeneous group of inherited retinal diseases characterised by cone photoreceptor degeneration, which may be followed by subsequent rod photoreceptor loss. These disorders typically present with progressive loss of central vision, colour vision disturbance and photophobia.
    explanation: Defines cone-rod dystrophy as a distinct IRD subtype characterized by primary cone photoreceptor degeneration followed by rod photoreceptor loss, presenting with progressive loss of central vision, color vision disturbance, and photophobia.
- name: Choroideremia
  display_name: Choroideremia
  subtype_term:
    preferred_term: choroideremia
    term:
      id: MONDO:0010557
      label: choroideremia
  description: An X-linked chorioretinal dystrophy caused by loss-of-function variants in CHM, encoding Rab escort protein 1 (REP-1). Affected males develop progressive degeneration of the photoreceptors, RPE, and choriocapillaris, with night blindness in childhood, progressive peripheral field loss, and eventual central vision loss.
  evidence:
  - reference: PMID:20301511
    reference_title: Choroideremia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Choroideremia (CHM) is characterized by progressive chorioretinal degeneration in affected males and milder signs in heterozygous (carrier) females.
    explanation: GeneReviews confirms choroideremia as an X-linked progressive chorioretinal degeneration affecting males, with carrier females mildly affected.
  - reference: PMID:20301511
    reference_title: Choroideremia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: symptoms in affected males evolve from night blindness to peripheral visual field loss, with central vision preserved until late in life
    explanation: Documents the clinical course of choroideremia from night blindness through peripheral field loss to late central vision loss.
pathophysiology:
- name: Photoreceptor Outer Segment and Ciliary Dysfunction
  description: Many IRD genes encode proteins required for the structure and renewal of the photoreceptor outer segment and for protein/lipid transport through the connecting cilium. Defects in outer-segment morphogenesis, disc renewal, or intraflagellar/ciliary transport (e.g., RPGR, CEP290, USH2A) impair phototransduction protein trafficking and outer-segment maintenance, leading to photoreceptor stress and degeneration.

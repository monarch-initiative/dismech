discussions:
- discussion_id: stahp-mouse-human-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why does complete SOD1 absence cause infantile upper and lower motor neuron degeneration in humans but only a distal motor axonopathy, with motor neuron cell bodies spared, in Sod1 knockout mice?
  rationale: The mouse knockout was the basis for the long-held view that loss of SOD1 activity does not damage motor neurons, a view the human syndrome contradicts. Knockout mice do develop a distal motor axonopathy from the first months of life, and SOD1-null dogs develop an early tetraparesis, so the mismatch lies in which parts of the motor system degenerate and how severely, rather than in an absence of motor involvement. Species differences in compensating antioxidants (mice synthesize ascorbate, humans do not), lifespan and motor system size are candidate explanations, but none has been tested.
  attaches_to:
  - animal_models#SOD1-null mouse
  - pathophysiology#Upper and Lower Motor Neuron Degeneration
  evidence:
  - reference: PMID:36793789
    reference_title: The motor system is exceptionally vulnerable to absence of the ubiquitously expressed superoxide dismutase-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: the fact that SOD1 knockout mice do not develop ALS-like disease, contributed to the general view that reduced SOD1 activity does not cause ALS
    explanation: Records how the mouse result shaped expectations that the human syndrome overturns.
- discussion_id: stahp-separate-entity-or-early-als
  kind: CONTROVERSY
  status: OPEN
  prompt: Is STAHP a distinct syndrome or a very early infantile-onset form of SOD1 ALS?
  rationale: The founding reports framed SOD1 deficiency as a new syndrome distinct from ALS, citing the opposite mechanism and additional cerebellar and non-neuronal involvement. A Brazilian series found upper and lower motor neuron involvement that fulfils ALS diagnostic criteria and argued for very early-onset ALS. The answer affects classification but not the causal chain recorded here.
  attaches_to:
  - disease#Spastic Tetraplegia and Axial Hypotonia, Progressive
  evidence:
  - reference: PMID:31332433
    reference_title: 'SOD1 deficiency: a novel syndrome distinct from amyotrophic lateral sclerosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These results are in contrast with the previously proposed theory that a loss of function is the underlying mechanism in SOD1-related motor neuron disease
    explanation: Position that the syndrome is mechanistically distinct from ALS.
  - reference: PMID:34380534
    reference_title: 'Progressive spastic tetraplegia and axial hypotonia (STAHP) due to SOD1 deficiency: is it really a new entity?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: allowing us to conclude that the cases presented by these authors, and the new additional patients reported in this study represent a very early infantile-onset ALS.
    explanation: Opposing position.
- discussion_id: stahp-sod1-silencing-safety
  kind: INTERPRETATION
  status: OPEN
  prompt: What does complete human SOD1 deficiency imply for SOD1-lowering therapies in ALS?
  rationale: Approved and investigational SOD1-lowering therapies for ALS suppress both mutant and wild-type SOD1. STAHP shows that total loss of the enzyme is harmful to the human motor system, while unaffected carriers show that about half of normal activity is tolerated, suggesting a threshold that knockdown should not cross.
  attaches_to:
  - pathophysiology#Absent SOD1 Superoxide Dismutase Activity
  evidence:
  - reference: PMID:36793789
    reference_title: The motor system is exceptionally vulnerable to absence of the ubiquitously expressed superoxide dismutase-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The association of the severe ISODDES phenotype with a loss of SOD1 function suggests the need for cautious application of general silencing interventions in ALS since the currently studied gene therapy approaches equally target the mutant and wild-type SOD1 alleles.
    explanation: The authors' therapeutic interpretation.
  - reference: PMID:36793789
    reference_title: The motor system is exceptionally vulnerable to absence of the ubiquitously expressed superoxide dismutase-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: However, given the absence of an overt phenotype in heterozygous carriers with approximately halved enzyme activity, it is possible that there is a threshold of minimum SOD1 activity to avoid disease manifestation.
    explanation: Carrier data suggest partial reduction is tolerated.
- discussion_id: stahp-antioxidant-therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Could glutathione-replenishing or other antioxidant treatment slow disease in children lacking SOD1?
  rationale: N-acetylcysteine improved anemia and other features in Sod1 knockout mice, and patient erythrocytes are glutathione-depleted, but no treatment has been tested in patients. Any trial would need outcome measures suited to a slowly progressing phase after early rapid decline.
  attaches_to:

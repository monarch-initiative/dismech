notes: The p.Cys112Trpfs*11 patients in the 2023 Swedish-German study include the children first reported in 2019, so the eight-patient cohort and the earlier reports are not independent. Feature frequencies come from small, overlapping case series and are not population estimates; counts in phenotype descriptions are per cohort. Epilepsy (1/5 Brazilian patients) and hydrocephalus (1/8 Swedish-German patients) are single observations and are not recorded as phenotypes. Immune dysregulation (inflammatory bowel disease, asthma, recurrent infections, dermatitis) has been described in one patient only and is likewise not recorded. No GeneReviews chapter covers this disorder.

  distinguishing_features:
  - Biallelic SOD1 variants with absent erythrocyte SOD1 activity
  - Onset in infancy with axial hypotonia, cerebellar vermis atrophy and hyperekplexia-like startle
  - Heterozygous relatives unaffected
  evidence:
  - reference: PMID:36793789
    reference_title: The motor system is exceptionally vulnerable to absence of the ubiquitously expressed superoxide dismutase-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Taken together, these findings suggest that homozygosity for loss-of-function variants in SOD1 results primarily in an infantile-onset motor neuron condition but with additional neuronal and non-neuronal involvement, which distinguishes it from typical adult-onset ALS.
    explanation: Contrasts the loss-of-function syndrome with typical SOD1 ALS.
genetic:
- name: SOD1
  gene_term:
    preferred_term: SOD1
    term:
      id: hgnc:11179
      label: SOD1
  relationship_type: CAUSATIVE
  notes: Biallelic loss-of-function SOD1 variants cause STAHP, whereas heterozygous mostly missense variants cause dominant ALS1 through gain of function. Reported recessive alleles are c.335dupG (p.Cys112Trpfs*11, recurrent), c.357_357+2delGGT (p.Val119/Val120 in-frame deletion), c.52_56del5ins154, c.248dupG (p.Asp84Argfs*8) and c.369_371del. The mutant c.335dupG mRNA is present in carriers and patients, arguing against nonsense-mediated decay; the protein is lost through proteasomal degradation.

  description: All reported patients are homozygous for a SOD1 loss-of-function allele, most from consanguineous families. Heterozygous parents and siblings have roughly halved erythrocyte SOD1 activity and no overt neurological phenotype, which distinguishes this recessive disorder from dominant SOD1 amyotrophic lateral sclerosis.

- name: Absent SOD1 Superoxide Dismutase Activity
  description: SOD1, the principal cytosolic superoxide dismutase, converts superoxide to hydrogen peroxide. In affected children erythrocyte SOD1 activity is essentially zero across all reported alleles. Mouse knockout data suggest the mitochondrial and extracellular isoenzymes do not compensate, plausibly because charged superoxide crosses membranes poorly.

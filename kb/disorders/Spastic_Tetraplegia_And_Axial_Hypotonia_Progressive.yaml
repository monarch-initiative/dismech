- name: Amyotrophic Lateral Sclerosis Type 1
  description: Dominant SOD1 ALS shares the motor neuron target and gene but arises in adulthood from heterozygous variants that produce aggregation-prone, misfolded protein with toxic gain of function, usually with preserved enzyme activity. STAHP is recessive, infantile in onset, and caused by complete absence of the enzyme with an unstable, non-aggregating product.

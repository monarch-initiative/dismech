animal_models:
- name: SOD1-null mouse
  species: Mouse
  genotype: Homozygous Sod1 knockout
  publication: PMID:8673102
  description: Complete loss of Sod1 does not produce overt motor deficits by six months but increases motor neuron death after axonal injury. Histologically, knockout mice develop a progressive distal motor axonopathy, with denervation of fast-twitch muscle from 1 to 4 months, while spinal motor neuron cell bodies are preserved; nothing resembles the combined upper and lower motor neuron disease of the human syndrome.
  evidence:
  - reference: PMID:8673102
    reference_title: Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These animals develop normally and show no overt motor deficits by 6 months in age.
    explanation: Absence of spontaneous motor disease in the knockout over the reported period.
  modeled_mechanisms:
  - target: Upper and Lower Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: The knockout develops a distal motor axonopathy and increased motor neuron vulnerability to injury, but not the combined upper and lower motor neuron degeneration, with loss of motor neuron cell bodies, that complete SOD1 absence causes in children.
    limitations: Motor involvement in the mouse is a distal motor axonopathy with denervation of fast-twitch muscle, while spinal motor neuron cell bodies are preserved to 18 months; the upper motor neuron signs and cerebellar atrophy of the human syndrome are absent.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mice lacking Sod1 have no overt motor deficits at six months and a histological distal motor axonopathy with preserved spinal motor neuron cell bodies, whereas children lacking SOD1 lose motor skills from about eight months of age with upper and lower motor neuron signs; the shared finding is motor axon vulnerability, not the same pattern of degeneration.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: The 1996 knockout study assessed overt motor deficits to six months of age and did not examine neuromuscular histology, so it alone cannot characterize the mouse motor phenotype described in later work.
    evidence:
    - reference: PMID:8673102
      reference_title: Motor neurons in Cu/Zn superoxide dismutase-deficient mice develop normally but exhibit enhanced cell death after axonal injury.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: These results indicate that Cu/Zn SOD is not necessary for normal motor neuron development and function but is required under physiologically stressful conditions following injury.
      explanation: Motor neurons are normal without injury in the knockout.
    - reference: PMID:36793789
      reference_title: The motor system is exceptionally vulnerable to absence of the ubiquitously expressed superoxide dismutase-1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: However, it is notable that Sod1 knockout mice do not replicate the severe motor neuron phenotype that develops in humans despite developing a significant, motor neuropathy in later life
      explanation: Summarizes the knockout literature; a motor neuropathy without the human motor neuron phenotype.
    - reference: PMID:21963651
      reference_title: Absence of SOD1 leads to oxidative stress in peripheral nerve and causes a progressive distal motor axonopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We report preferential denervation of fast-twitch muscles beginning between 1 and 4 months of age, with relative sparing of slow-twitch muscle.
      explanation: Primary report of the knockout's distal motor axonopathy, the part of the motor phenotype the mouse does reproduce.
    - reference: PMID:21963651
      reference_title: Absence of SOD1 leads to oxidative stress in peripheral nerve and causes a progressive distal motor axonopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We confirmed, as was previously reported, that spinal motor neurons and motor and sensory nerve roots in these mice are preserved, even out to 18 months of age.
      explanation: Motor neuron cell bodies are spared in the mouse, unlike the upper and lower motor neuron disease of the children.

    snippet: Heterozygous carriers have a markedly reduced enzyme activity when compared to wild-type controls but show no overt neurologic phenotype.
    explanation: Carriers are clinically unaffected despite reduced activity, consistent with recessive inheritance.
  - reference: PMID:38668754

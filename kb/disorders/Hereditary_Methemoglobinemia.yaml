- name: Male pseudohermaphroditism
  subtype: Type IV
  description: >
    46,XY individuals with CYB5A deficiency have undervirilized or female
    external genitalia from isolated 17,20-lyase deficiency. A 46,XX woman
    homozygous for a CYB5A nonsense variant had normal sexual development and
    fertility, so this feature is restricted to 46,XY patients.
  phenotype_term:
    preferred_term: 46,XY disorder of sex development
    term:
      id: HP:0000037
      label: Male pseudohermaphroditism
  evidence:
  - reference: PMID:22170710
    reference_title: "A missense mutation in the human cytochrome b5 gene causes 46,XY disorder of sex development due to true isolated 17,20 lyase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have described the first human CYB5A missense mutation identified in three children from a large consanguineous family presenting with 17,20 lyase deficiency, 46,XY DSD, and mild methemoglobinemia."
    explanation: Three 46,XY siblings homozygous for a CYB5A variant had DSD.
  - reference: PMID:32051920
    reference_title: "Isolated 17,20-Lyase Deficiency in a CYB5A Mutated Female With Normal Sexual Development and Fertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, she had a completely normal female phenotype with no DSD, normal pubertal development, and spontaneous pregnancy giving birth uneventfully to a healthy female infant."
    explanation: Supports restricting the DSD phenotype to 46,XY patients.

pathophysiology:
- name: CYB5R3 cytochrome b5 reductase deficiency
  description: >
    Biallelic CYB5R3 pathogenic variants reduce NADH-cytochrome b5 reductase
    activity, the erythrocyte enzyme system that normally transfers electrons
    needed to reduce ferric methemoglobin.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYB5R3
    term:
      id: hgnc:2873
      label: CYB5R3
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  molecular_functions:
  - preferred_term: cytochrome-b5 reductase activity, acting on NAD(P)H
    modifier: DECREASED
    term:
      id: GO:0004128
      label: cytochrome-b5 reductase activity, acting on NAD(P)H
  evidence:
  - reference: PMID:18318771
    reference_title: "Recessive congenital methaemoglobinaemia: cytochrome b(5) reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder, now known as recessive congenital methaemoglobinaemia (RCM), is caused by NADH-cytochrome b5 reductase (cb(5)r) deficiency."
    explanation: The review directly supports CYB5R3/cytochrome b5 reductase deficiency as the primary defect.
  - reference: PMID:31898843
    reference_title: "Mutation update: Variants of the CYB5R3 gene in recessive congenital methemoglobinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NADH-cytochrome b5 reductase 3 deficiency is an important genetic cause of recessive congenital methemoglobinemia (RCM)"
    explanation: The mutation update supports the enzyme-deficiency mechanism.
  downstream:
  - target: Impaired methemoglobin reduction
    description: Loss of CYB5R3 activity impairs reduction of ferric methemoglobin back to oxygen-binding hemoglobin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3752898
      reference_title: Congenital enzymopenic methaemoglobinaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the methaemoglobin formed at physiological rate is not efficiently reduced."
      explanation: Supports impaired reduction of physiologically formed methemoglobin when reductase activity is deficient.
  - target: Type II generalized neurologic involvement
    description: Generalized CYB5R3 deficiency across all tissues in type II disease causes neurological involvement beyond the erythrocyte-restricted form.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19480335
      reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In type II, the deficiency occurs in all tissues and causes growth and mental retardation and other neurological impairments."
      explanation: Links pan-tissue CYB5R3 deficiency to generalized neurological involvement in type II disease.
- name: CYB5A cytochrome b5 deficiency
  description: >
    In type IV disease, biallelic CYB5A loss-of-function variants remove
    microsomal cytochrome b5, the cofactor through which NADH-cytochrome b5
    reductase reduces methemoglobin. The same protein stimulates CYP17A1
    17,20-lyase activity in the adrenal and gonad.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYB5A
    term:
      id: hgnc:2570
      label: CYB5A
  molecular_functions:
  - preferred_term: allosteric activation of CYP17A1 17,20-lyase
    modifier: DECREASED
    term:
      id: GO:0008047
      label: enzyme activator activity
  evidence:
  - reference: PMID:3539237
    reference_title: "Enzymopenic hereditary methemoglobinemia: a clinical/biochemical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type IV, also clinically like Type I, is associated with deficiency of the cofactor, cytochrome B5."
    explanation: Identifies cytochrome b5 deficiency as the primary defect in type IV.
  - reference: PMID:22170710
    reference_title: "A missense mutation in the human cytochrome b5 gene causes 46,XY disorder of sex development due to true isolated 17,20 lyase deficiency."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "lending support to the assumption that CYB5A acts as an allosteric facilitator rather than as an electron donor in supporting 17,20 lyase activity"
    explanation: In the lyase reaction cytochrome b5 acts as an enzyme activator rather than as an electron donor, which supports binding enzyme activator activity as the molecular function that CYB5A loss removes.
  - reference: CGGV:assertion_895f7f88-9dcc-42fd-8773-e20dadb6756c-2024-12-13T190000.000Z
    reference_title: "CYB5A / methemoglobinemia type 4 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be loss of function."
    explanation: ClinGen assigns a loss-of-function mechanism to CYB5A variants.
  downstream:
  - target: Impaired methemoglobin reduction
    description: Without cytochrome b5, the reductase system cannot efficiently reduce methemoglobin, giving a mild form of the same defect.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3539237
      reference_title: "Enzymopenic hereditary methemoglobinemia: a clinical/biochemical classification."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Type IV, also clinically like Type I, is associated with deficiency of the cofactor, cytochrome B5."
      explanation: Cytochrome b5 is the cofactor of the methemoglobin reductase system, so its deficiency produces a methemoglobinemia clinically like the reductase-deficient type I; the edge follows by that inference.
  - target: Impaired CYP17A1 17,20-lyase activity
    description: Loss of cytochrome b5 removes its allosteric stimulation of CYP17A1 17,20-lyase activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22170710
      reference_title: "A missense mutation in the human cytochrome b5 gene causes 46,XY disorder of sex development due to true isolated 17,20 lyase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cytochrome b5 (CYB5A) is thought to selectively enhance 17,20 lyase activity by facilitating the allosteric interaction of CYP17A1 with its electron donor P450 oxidoreductase (POR)."
      explanation: States the role of cytochrome b5 in 17,20-lyase activity that CYB5A loss removes.
- name: Impaired CYP17A1 17,20-lyase activity
  description: >
    Without cytochrome b5, CYP17A1 retains 17-hydroxylase activity but its
    17,20-lyase activity is reduced, so androgen precursors are not made while
    cortisol synthesis is preserved. This is isolated 17,20-lyase deficiency.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: androgen biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  evidence:
  - reference: PMID:42824631
    reference_title: "Familial 46,XY disorder of sex development due to a novel CYB5A variant: a rare cause of isolated 17,20-lyase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormonal evaluation showed impaired androgen synthesis with very low testosterone and markedly elevated 17-hydroxyprogesterone:androstenedione ratios, suggestive of isolated 17,20-lyase deficiency."
    explanation: Hormonal profiling of CYB5A-homozygous siblings shows the androgen-synthesis defect.
  downstream:
  - target: Male pseudohermaphroditism
    description: Deficient androgen synthesis in 46,XY individuals causes undervirilization of the external genitalia.
    causal_link_type: DIRECT
    evidence:
    - reference: CGGV:assertion_895f7f88-9dcc-42fd-8773-e20dadb6756c-2024-12-13T190000.000Z
      reference_title: "CYB5A / methemoglobinemia type 4 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Biallelic loss of CYB5A expression or disruption of this interaction leads to 46,XY DSD."
      explanation: ClinGen links loss of the cytochrome b5-CYP17A1 interaction to 46,XY DSD.
- name: Impaired methemoglobin reduction
  description: >
    Methaemoglobin is continuously formed as heme iron becomes ferric; CYB5R3
    deficiency, or in type IV loss of its cofactor cytochrome b5, prevents
    efficient reduction back to the ferrous state.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: heme oxidation-reduction balance
    modifier: ABNORMAL
    term:
      id: GO:0006788
      label: heme oxidation
  evidence:
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the rate at which ferric heme is formed and the rate at which it is reduced back to the ferrous state."
    explanation: The case report review describes normal methemoglobin redox balance.
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the methaemoglobin formed at physiological rate is not efficiently reduced."
    explanation: The report directly supports impaired methemoglobin reduction in congenital enzymopenic disease.
  downstream:
  - target: Methemoglobin accumulation
    description: Inefficient reduction causes chronic ferric methemoglobin accumulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3752898
      reference_title: Congenital enzymopenic methaemoglobinaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A chronically elevated level of oxidized haemoglobin results."
      explanation: Supports chronic accumulation of oxidized hemoglobin downstream of impaired reduction.

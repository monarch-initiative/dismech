differential_diagnoses:
- name: Drug-induced methemoglobinemia
  disease_term:
    preferred_term: drug-induced methemoglobinemia
    term:
      id: MONDO:0018740
      label: drug-induced methemoglobinemia
  description: >
    Acquired methemoglobinemia is the clinical phenocopy of hereditary
    enzymopenic methemoglobinemia, arising when oxidizing medications (such as
    dapsone or benzocaine) or occupational aromatic amino/nitro chemicals
    accelerate ferrous heme oxidation past the recovery capacity of an intact
    NADH-cytochrome b5 reductase system. Both conditions present with central
    cyanosis unresponsive to supplemental oxygen, chocolate-brown blood, and a
    pulse-oximetry saturation gap alongside a normal arterial oxygen tension.
  distinguishing_features:
  - History of exposure to oxidant medications (such as dapsone or benzocaine) or occupational chemicals, with resolution after removal of the offending agent
  - Acute or subacute onset after exposure rather than congenital or infantile lifelong cyanosis
  - Normal baseline erythrocyte NADH-cytochrome b5 reductase activity and absence of biallelic CYB5R3 pathogenic variants
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, should methemoglobin formation be increased--e.g., due to the presence of oxidant drugs, or an abnormal methemoglobin not amenable to reduction (hemoglobin M), or a deficiency in red cell cytochrome b5 reductase--methemoglobinemia will result."
    explanation: The review directly contrasts oxidant drug exposure with red-cell cytochrome b5 reductase deficiency as alternative causes of methemoglobinemia.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A variety of frequently used medications are capable of inducing methemoglobinemia, with dapsone and benzocaine being common culprits."
    explanation: Identifies common medication culprits that distinguish acquired drug-induced disease on clinical history.
- name: Hemoglobin M disease
  disease_term:
    preferred_term: hemoglobin M disease
    term:
      id: MONDO:0018023
      label: hemoglobin M disease
  description: >
    Congenital methemoglobinemia caused by autosomal dominant globin-chain
    variants (such as Hb F-M-Fort Ripley) in which an amino acid substitution in
    the heme pocket stabilizes iron in the ferric state, making the abnormal
    methemoglobin not amenable to reduction despite normal cytochrome b5
    reductase activity.
  distinguishing_features:
  - Normal erythrocyte cytochrome b5 reductase enzyme levels and activity
  - Autosomal dominant inheritance (or de novo globin mutation) rather than autosomal recessive CYB5R3 inheritance
  - Structural alpha-, beta-, or gamma-globin gene mutation identified by globin sequencing or electrophoresis rather than biallelic CYB5R3 variants
  - Transient neonatal cyanosis lasting one to three months in fetal gamma-globin M variants (such as Hb F-M-Fort Ripley), with resolution in early infancy
  - Structurally abnormal methemoglobin that is not amenable to reduction, rather than an enzymatic deficiency in the cytochrome b5 reductase pathway
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, should methemoglobin formation be increased--e.g., due to the presence of oxidant drugs, or an abnormal methemoglobin not amenable to reduction (hemoglobin M), or a deficiency in red cell cytochrome b5 reductase--methemoglobinemia will result."
    explanation: Distinguishes hemoglobin M as an abnormal methemoglobin not amenable to reduction, separate from cytochrome b5 reductase deficiency.
  - reference: PMID:26969357
    reference_title: Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytochrome b5 reductase levels were normal and a newborn screen was unable to pick up any abnormal variants of fetal haemoglobin. Genetic testing showed a γ globin gene mutation resulting in the M haemoglobin, called Hb F-M-Fort Ripley."
    explanation: Demonstrates that congenital M-hemoglobin disease presents with neonatal central cyanosis and normal cytochrome b5 reductase levels, requiring globin genetic testing for differentiation.
  - reference: PMID:26969357
    reference_title: Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The baby had no apparent cyanosis at a corrected gestational age of 42 weeks."
    explanation: Supports resolution of neonatal cyanosis in infancy in fetal gamma-globin M disease (Hb F-M-Fort Ripley).
  - reference: PMID:7517266
    reference_title: "Hb FM-Fort Ripley: confirmation of autosomal dominant inheritance and diagnosis by PCR and direct nucleotide sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first family with Hb FM-Fort Ripley reported so far. It demonstrates autosomal dominant inheritance of this condition and incomplete penetrance."
    explanation: Establishes autosomal dominant inheritance of M-hemoglobin disease, contrasting with autosomal recessive CYB5R3 deficiency.
  - reference: PMID:7517266
    reference_title: "Hb FM-Fort Ripley: confirmation of autosomal dominant inheritance and diagnosis by PCR and direct nucleotide sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of cardiac or pulmonary abnormality and an extended family history included 13 other affected family members with asymptomatic cyanosis lasting one to three months."
    explanation: Supports transient neonatal cyanosis lasting one to three months in affected family members with Hb FM-Fort Ripley.
- name: Transient neonatal cyanosis (hemoglobinopathy Toms River)
  disease_term:
    preferred_term: cyanosis, transient neonatal
    term:
      id: MONDO:0013511
      label: cyanosis, transient neonatal
  description: >
    Autosomal dominant fetal gamma-globin variants in HBG2—including the
    low-oxygen-affinity Hb F-Toms River (HBG2 V67M)—present in newborns as a
    "happy blue baby" with persistent neonatal central cyanosis and low
    pulse-oximetry oxygen saturation despite normal arterial PaO2 and normal
    cardiac and pulmonary evaluation, closely mimicking neonatal congenital
    methemoglobinemia.
  distinguishing_features:
  - Normal blood methemoglobin level on co-oximetry (cyanosis is caused by sterically impaired oxygen binding to mutant fetal hemoglobin rather than ferric methemoglobin accumulation)
  - Moderate neonatal hemolytic anemia and reticulocytosis from post-translational conversion of the mutant gamma-globin E11 methionine to aspartic acid
  - Heterozygous HBG2 V67M missense variant with spontaneous resolution of cyanosis within 1 to 2 months as gamma-globin expression switches to beta-globin
  evidence:
  - reference: PMID:21561349
    reference_title: A hemoglobin variant associated with neonatal cyanosis and anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We characterized a new γ-globin (HBG2) mutation, hemoglobin Toms River, in a neonate with cyanosis and anemia."
    explanation: Identifies hemoglobin Toms River as a genetic cause of neonatal cyanosis in the differential diagnosis of a well-appearing cyanotic newborn.
  - reference: PMID:21561349
    reference_title: A hemoglobin variant associated with neonatal cyanosis and anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory data (Table 1) were notable for moderate anemia with reticulocytosis. The methemoglobin level was normal, and the erythrocyte morphologic features were unremarkable."
    explanation: Normal methemoglobin levels and concomitant hemolytic anemia with reticulocytosis distinguish hemoglobin Toms River from congenital methemoglobinemia.
- name: Cyanotic congenital heart disease
  disease_term:
    preferred_term: cyanotic congenital heart disease
    term:
      id: MONDO:0005453
      label: congenital heart disease
  description: >
    Structural cyanotic heart disease and cardiopulmonary causes of hypoxemia
    are the primary conditions initially suspected in neonates or children
    presenting with persistent central cyanosis.
  notes: >
    Bound to MONDO:0005453 (congenital heart disease) as the closest available
    MONDO ancestor because a MONDO search for "cyanotic congenital heart
    disease" returned no narrower term.
  distinguishing_features:
  - Patients with type I congenital enzymopenic methemoglobinemia are typically asymptomatic or appear well despite intense cyanosis, whereas cardiopulmonary cyanosis of similar severity is accompanied by respiratory distress and systemic illness
  - Cyanosis in methemoglobinemia does not improve with supplemental oxygen administration
  - Arterial blood gas analysis in methemoglobinemia shows a normal partial pressure of dissolved oxygen (PaO2) with a pulse-oximetry saturation gap and chocolate-brown blood, rather than true arterial hypoxemia
  - Normal echocardiography and chest imaging exclude structural cardiac or pulmonary pathology
  evidence:
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with congenital enzymopenic methaemoglobinaemia are asymptomatic despite the intense cyanosis. This is a very important differentiating point from the cyanosis of cardiopulmonary causes."
    explanation: Directly highlights the absence of cardiopulmonary symptoms despite intense cyanosis as a key bedside differentiator from cardiopulmonary cyanosis.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the victim is often less unwell than one would expect from the severity of 'cyanosis' and, secondly, the 'cyanosis' is unresponsive to oxygen therapy"
    explanation: Supports well clinical appearance relative to cyanosis severity and lack of response to supplemental oxygen as clinical features distinguishing methemoglobinemia from cardiopulmonary disease.
treatments:
- name: Methylene blue pharmacotherapy
  description: >
    Methylene blue can lower methemoglobin levels and is generally reserved for
    symptomatic or significantly elevated methemoglobinemia; evidence in type II
    congenital disease is limited to case-level symptomatic benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylene blue
      term:
        id: CHEBI:6872
        label: methylene blue
  target_mechanisms:
  - target: Methemoglobin accumulation
    treatment_effect: MODULATES
    description: Methylene blue treatment aims to reduce elevated methemoglobin levels.
    evidence:
    - reference: PMID:26574897
      reference_title: Congenital Methemoglobinemia Type II-Clinical Improvement with Short-Term Methylene Blue Treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Since the MB treatment regimen has commenced, his methemoglobin level has been significantly lower."
      explanation: Single-case type II treatment evidence supports methemoglobin lowering, but not broad disease modification.
  evidence:
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "treatment with methylene blue is reserved for patients with significantly elevated methemoglobin levels."
    explanation: The management review supports methylene blue use for significant methemoglobinemia.
  - reference: PMID:26574897
    reference_title: Congenital Methemoglobinemia Type II-Clinical Improvement with Short-Term Methylene Blue Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "modest behavioral improvements (as assessed on the Achenbach behavior report scales)."
    explanation: Case-level type II evidence suggests limited symptomatic improvement.
- name: Ascorbic acid pharmacotherapy
  description: >
    Ascorbic acid has been reported as symptomatic treatment for cyanosis in
    recessive congenital methemoglobinemia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ascorbic acid
      term:
        id: CHEBI:22652
        label: ascorbic acid
  target_phenotypes:
  - preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:19480335
    reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cyanosis can be well treated by 200-500 mg of ascorbic acid daily"
    explanation: Clinical report text supports ascorbic acid as symptomatic therapy for cyanosis.
- name: Genetic counseling
  description: >
    Genetic counseling is appropriate because CYB5R3-related hereditary
    methemoglobinemia is autosomal recessive and molecular diagnosis clarifies
    carrier and recurrence risks for relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19480335
    reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal diagnosis is possible."
    explanation: The report supports familial molecular risk assessment and reproductive counseling.
notes: >
  ORPHA:621 is scoped to autosomal recessive congenital/hereditary
  methemoglobinemia types I and II and lists CYB5A only as a candidate-tested
  gene. MONDO places methemoglobinemia type 4 (MONDO:0009605, CYB5A) directly
  under MONDO:0018963, and ClinGen rates CYB5A for that disease Definitive, so
  it is carried here as the Type IV subtype. MONDO has no separate classes for
  types I and II; both fall under MONDO:0009606 (methemoglobinemia due to
  deficiency of methemoglobin reductase), so those rows carry no subtype_term.
  The hemoglobin M diseases (MONDO:0018023, MONDO:0020835), which MONDO also
  places under MONDO:0018963, are structural hemoglobinopathies with dominant
  inheritance and are not curated in this entry.

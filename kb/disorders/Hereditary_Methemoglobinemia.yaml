has_subtypes:
- name: Type I
  display_name: Type I (erythrocyte-restricted recessive congenital methemoglobinemia)
  description: >
    Type I disease is characterized by CYB5R3 deficiency that is functionally
    restricted to erythrocytes, causing cyanosis without the severe generalized
    neurologic disease typical of type II.
  evidence:
  - reference: ORPHA:621
    reference_title: "Autosomal recessive methemoglobinemia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "autosomal recessive congenital (or hereditary) methemoglobinemia types I and II"
    explanation: Orphanet identifies type I and type II as the principal clinical phenotypes.
  - reference: PMID:19480335
    reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type I presents with mild cyanosis due to a significant deficiency of cytb5r in erythrocytes only."
    explanation: This clinical report distinguishes the erythrocyte-restricted type I phenotype.
- name: Type II
  display_name: Type II (generalized recessive congenital methemoglobinemia)
  description: >
    Type II disease reflects more generalized CYB5R3 deficiency and combines
    cyanosis with severe neurologic impairment, developmental delay, movement
    disorder, microcephaly, and shortened life expectancy.
  evidence:
  - reference: PMID:18318771
    reference_title: "Recessive congenital methaemoglobinaemia: cytochrome b(5) reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In type II, the cyanosis is accompanied by neurological impairment and reduced life expectancy."
    explanation: The review directly distinguishes the severe neurologic type II phenotype.
  - reference: PMID:19480335
    reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In type II, the deficiency occurs in all tissues and causes growth and mental retardation and other neurological impairments."
    explanation: This clinical report supports generalized tissue involvement and neurologic disease in type II.
- name: Type IV
  display_name: Type IV (cytochrome b5 deficiency)
  description: >
    Type IV disease is caused by biallelic CYB5A loss of function rather than
    by CYB5R3. Methemoglobinemia is mild and can be clinically inapparent.
    Loss of cytochrome b5 also removes its stimulation of CYP17A1 17,20-lyase
    activity, so affected 46,XY individuals have isolated 17,20-lyase
    deficiency with undervirilization. Fewer than ten cases have been reported.
  subtype_term:
    preferred_term: methemoglobinemia type 4
    term:
      id: MONDO:0009605
      label: methemoglobinemia type 4
  genes:
  - preferred_term: CYB5A
    term:
      id: hgnc:2570
      label: CYB5A
  evidence:
  - reference: PMID:3539237
    reference_title: "Enzymopenic hereditary methemoglobinemia: a clinical/biochemical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type IV, also clinically like Type I, is associated with deficiency of the cofactor, cytochrome B5."
    explanation: The classification defines type IV as cytochrome b5 deficiency, distinct from the reductase-deficient types.
  - reference: CGGV:assertion_895f7f88-9dcc-42fd-8773-e20dadb6756c-2024-12-13T190000.000Z
    reference_title: "CYB5A / methemoglobinemia type 4 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Methemoglobinemia 4, also referred to as methemoglobinemia and ambiguous genitalia (MIM#250790) or pure isolated 17,20-lyase deficiency, is characterized by mildly elevated serum methemoglobin, cyanosis, and 46,XY disorder of sexual differentiation (DSD)."
    explanation: ClinGen's evidence summary describes the type IV clinical picture.
  - reference: PMID:42824631
    reference_title: "Familial 46,XY disorder of sex development due to a novel CYB5A variant: a rare cause of isolated 17,20-lyase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coexistence of 46,XY DSD with methemoglobinemia due to cytochrome b5 deficiency is exceedingly rare, with fewer than 10 cases reported in the literature"
    explanation: Supports the rarity of the type IV form.

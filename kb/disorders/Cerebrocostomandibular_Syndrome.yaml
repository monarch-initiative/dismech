notes: >-
  The historical name is retained because it denotes the established disease scope. Neurological involvement
  is variable: microcephaly and significant developmental delay affected a small minority in the 2016
  series. SNRPB regulatory alleles can show non-penetrance. Human RNA findings, animal perturbations and
  cultured-cell responses provide complementary but non-equivalent mechanistic evidence; the causes of
  uncommon renal and cardiac findings are not resolved by the craniofacial models.

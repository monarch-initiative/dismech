- name: Mandibular distraction osteogenesis
  description: >-
    Repeated mandibular distraction has been reported for severe micrognathia and airway obstruction.
    A 2026 report describes extubation after distraction but also nonunion, recurrent micrognathia and
    repeat surgery; that infant had both an SNRPB variant classified as uncertain and a pathogenic 22q11.2
    duplication, limiting attribution of outcomes specifically to SNRPB-related CCMS.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: >-
      Lengthening the mandible can relieve tongue-based airway obstruction.
  evidence:
  - reference: PMID:41727730
    reference_title: A Rare Case of Concurrent SNRPB Mutation and 22q11.2 Microduplication in a Child With Cerebro-Costo-Mandibular Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was extubated at 6 weeks of age after completion of distraction with 18.6 mm of total distraction
      bilaterally.
    explanation: >-
      Observed short-term airway outcome in the dual-genetic-finding case; not a CCMS-wide efficacy estimate.
  - reference: PMID:41727730
    reference_title: A Rare Case of Concurrent SNRPB Mutation and 22q11.2 Microduplication in a Child With Cerebro-Costo-Mandibular Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat CT showed nonunion and collapse of previous osteotomies (Figure 4).
    explanation: >-
      The later complication qualifies the initial success and led to further surgery.
  notes: >-
    Needs term: `runoak -i ols:ncit search 'distraction osteogenesis'` and `runoak -i ols:ncit search
    'mandibular osteotomy'` returned no terms; `runoak -i ols:ncit search 'distraction'` returned attentional
    distraction concepts, not bone lengthening.
animal_models:
- name: Snrpb conditional heterozygous neural crest deletion mouse
  species: Mouse
  genotype: Snrpb heterozygous conditional deletion in brain and neural crest (Wnt1-Cre2)
  publication: PMID:35593225
  description: >-
    Constitutive heterozygous loss of Snrpb arrests mouse embryos shortly after
    implantation, so the craniofacial phenotype has to be modelled with a
    tissue-restricted deletion.
  modeled_mechanisms:
  - target: Neural Crest-Derived First Arch Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous Snrpb deletion in brain and neural crest reproduces the
      craniofacial malformations of CCMS.
    limitations: >-
      The conditional deletion is not the human hypomorphic poison-exon allele. Whole-embryo Snrpb loss-of-function
      heterozygosity is lethal shortly after implantation in mice; this cannot establish a species difference
      from adult humans carrying regulatory hypomorphic alleles. The conditional model primarily addresses
      craniofacial development and does not reproduce the full human rib phenotype.
    readouts:
    - name: Craniofacial morphology of mutant embryos
      target: Neural Crest-Derived First Arch Hypoplasia
      direction: ALTERED
      interpretation: >-
        Structural correlate of the first-arch hypoplasia node.
      evidence:
      - reference: PMID:35593225
        reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Additionally, heterozygous deletion of Snrpb in the developing brain and
          neural crest cells models craniofacial malformations found in CCMS, and
          results in death shortly after birth.
        explanation: >-
          The craniofacial malformation is the reported morphological outcome.
    evidence:
    - reference: PMID:35593225
      reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."

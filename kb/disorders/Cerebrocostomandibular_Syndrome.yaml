- name: SNRPB
  gene_term:
    preferred_term: SNRPB
    term:
      id: hgnc:11153
      label: SNRPB
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Most established CCMS alleles are heterozygous variants of the PTC-introducing alternative exon, with
    recurrent and novel alleles reported. De novo occurrence and dominant transmission both occur, with
    documented non-penetrance. A 5' UTR variant predicted to create an out-of-frame translation initiation
    site was reported in a fetus with more severe skeletal abnormalities; the suggestion that it creates
    a null allele is not equivalent to functional proof. Poison-exon-aware annotation can recover causal
    variants missed by coding-focused analysis.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE

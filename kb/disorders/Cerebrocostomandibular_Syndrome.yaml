- name: Chick somite Wnt/BMP bead implantation model of the rib defect
  species: Chicken
  genotype: Wild-type, pharmacologically perturbed
  publication: PMID:31884688
  description: >-
    Wnt/beta-catenin and BMP modulator beads implanted during chick somitogenesis test the consequences
    of local pathway perturbation. This is not an SNRPB genetic model.
  modeled_mechanisms:
  - target: Costal Patterning Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Local Wnt/beta-catenin inhibition produces rib gaps, missing ribs and
      shortened ribs.
    limitations: >-
      The perturbation is pharmacological and local, with no SNRPB lesion
      anywhere in the animal, so it tests only whether the proposed downstream
      pathway shift is sufficient for the rib phenotype. It cannot show that
      this is the route taken in patients, and it does not address the
      craniofacial component at all.
    readouts:
    - name: Rib gaps and missing ribs after Wnt inhibition
      target: Costal Patterning Failure
      direction: INCREASED
      interpretation: >-
        The characteristic CCMS rib phenotypes appear after local Wnt inhibition.
      evidence:
      - reference: PMID:31884688
        reference_title: "Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome."
        supports: SUPPORT
        quote_role: PRIMARY_RESULT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Wnt/β-catenin inhibition manifested characteristic rib phenotypes seen in
          CCMS, including rib gaps (P < 0.05) and missing ribs
        explanation: >-
          The rib phenotypes are reported with statistical support.
    - name: Fibrous tissue bridging experimentally induced rib gaps
      target: Costal Patterning Failure
      interpretation: >-
        The model reproduces a tissue bridge across the gap; a proposed tenocyte identity was not established.
      evidence:
      - reference: PMID:31884688
        reference_title: Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: In the present study, a fibrous translucent tissue was also seen to bridge the rib gap.
        explanation: >-
          Observation from the recovered full text. The subsequent tenocyte-lineage explanation is speculation
          and is not encoded as a confirmed cell type.
    evidence:
    - reference: PMID:31884688

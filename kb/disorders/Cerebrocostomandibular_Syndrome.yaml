discussions:
- discussion_id: ccms_tissue_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does reduced expression of a ubiquitous core spliceosomal protein
    produce a phenotype restricted to the mandible and the posterior ribs?
  attaches_to:
  - pathophysiology#Mis-Splicing of Developmental Transcripts
  rationale: >-
    This is the central unexplained feature of every spliceosomopathy, and it is
    stated as an open question in the field rather than answered. The candidate
    answers on offer -- P53 sensitivity of neural crest, Wnt/BMP dose sensitivity
    of rib patterning -- each explain one half of the phenotype and neither
    explains why other tissues are spared.
  status: OPEN
  evidence:
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although gene splicing occurs throughout the body, the phenotype of
      spliceosomal defects is largely limited to specific tissues.
    explanation: >-
      The paper opens by stating the paradox, which is what this gap records.
- discussion_id: ccms_rib_gap_respiratory_contribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the neonatal respiratory failure is caused by the rib gaps
    themselves, as opposed to the upper airway obstruction and the abnormal
    costovertebral articulation?
  attaches_to:
  - pathophysiology#Restrictive and Unstable Thorax
  - pathophysiology#Neonatal Respiratory Failure
  rationale: >-
    The rib gaps are the sign everyone reaches for, but an anatomical review
    argues they may be close to mechanically neutral because increased chest wall
    compliance from the gaps is offset by decreased compliance at the
    costovertebral complex. If that is right, the prognostic weight usually
    placed on the gaps is misdirected. No prospective respiratory-mechanics study
    exists to settle it.
  status: OPEN
  evidence:
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      anatomical consideration, and meta-analyses suggested that they might not be
      the significant factor in causing respiratory distress in neonates
    explanation: >-
      The review states the counterintuitive conclusion that this gap records.
notes: >-
  The "cerebro-" in the name overstates the neurological component: microcephaly
  and significant developmental delay were present only in a small minority of
  the largest published series, and most patients have normal cognition. The
  name is historical.

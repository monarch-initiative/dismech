  evidence:
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that low levels of SmB/B' by knockdown or mutations of SNRPB led
      to suppressed osteodifferentiation in Saos-2 osteoprogenitor-like cells,
      which was accompanied by affected splicing of Dlx5.
    explanation: >-
      The osteogenic arm of the differentiation defect is measured directly and
      linked to a specific mis-spliced transcription factor.
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the other hand, low SmB/B' led to promoted chondrogenesis in HEPM
      mesenchymal stem cells.
    explanation: >-
      The chondrogenic arm runs in the opposite direction, which is why the node
      is written as an altered balance rather than a uniform loss.
  downstream:
  - target: Neural Crest-Derived First Arch Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective osteogenic differentiation in first-arch derivatives is the
      proposed route to mandibular hypoplasia. The differentiation data are from
      cell lines, not from patient mandible, so the step to the tissue is
      inferred.
  - target: Costal Patterning Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same differentiation imbalance is the proposed route to the costal
      defects. Direct measurement in developing human rib is not available.

    case_fraction_percent: 85.7
    cohort_size: 14
    notes: >-
      SNRPB variants found in 12 of 14 patients from whom DNA was available.
    evidence:
    - reference: PMID:26971886
      reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        DNA was available from 14 patients and SNRPB mutations were identified in

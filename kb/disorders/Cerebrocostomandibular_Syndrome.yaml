- name: Snrpb upstream alternative-exon 61-bp deletion mouse
  species: Mouse
  genotype: CRISPR/Cas9 61-bp intronic deletion upstream of Snrpb alternative exon 2; heterozygous and homozygous embryos
  publication: PMID:42896850
  description: >-
    An intronic deletion model reported in 2026 produced craniofacial and rib abnormalities with low penetrance.

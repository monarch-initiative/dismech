    explanation: >-
      This is the gene-disease discovery statement.
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that CCMS is due to heterozygous mutations in SNRPB, enhancing

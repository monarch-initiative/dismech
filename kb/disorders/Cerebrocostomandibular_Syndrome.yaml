        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Additionally, heterozygous deletion of Snrpb in the developing brain and
          neural crest cells models craniofacial malformations found in CCMS, and
          results in death shortly after birth.
        explanation: >-
          The craniofacial malformation is the reported morphological outcome.
    evidence:
    - reference: PMID:35593225

experimental_models:
- name: SNRPB knockdown in Saos-2 and HEPM cells
  experimental_model_type: CELL_LINE
  description: >-
    Osteoprogenitor-like Saos-2 and mesenchymal HEPM cells with SNRPB knockdown
    or CCMS-type mutations, used to measure osteo- and chondro-differentiation.
  modeled_mechanisms:
  - target: Impaired Osteogenic Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced SmB/B' suppresses osteogenic differentiation in Saos-2 cells.
    limitations: >-
      Saos-2 is an osteosarcoma cell line rather than normal patient osteoprogenitors. The separate chondrogenesis
      assay uses HEPM cells, so the two findings cannot be assumed to describe the same lineage in vivo.
    readouts:
    - name: Osteogenic marker expression after SNRPB knockdown
      target: Impaired Osteogenic Differentiation
      direction: DECREASED
      interpretation: >-
        Direct measure of the osteogenic arm of the node.
      evidence:
      - reference: PMID:37584444
        reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found that low levels of SmB/B' by knockdown or mutations of SNRPB led
          to suppressed osteodifferentiation in Saos-2 osteoprogenitor-like cells,
          which was accompanied by affected splicing of Dlx5.
        explanation: >-
          Osteodifferentiation is suppressed, and the direction is stated.
    evidence:
    - reference: PMID:37584444
      reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that low levels of SmB/B' by knockdown or mutations of SNRPB led
        to suppressed osteodifferentiation in Saos-2 osteoprogenitor-like cells,
        which was accompanied by affected splicing of Dlx5.
      explanation: >-
        The osteogenic arm of the differentiation defect is measured directly and
        linked to a specific mis-spliced transcription factor.
  - target: Promoted Chondrogenesis in HEPM Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      HEPM cultures model the increased chondrogenic response to low SmB/B'.
    limitations: >-
      Neither human rib tissue nor the chick somitogenesis model; direction is cell-context dependent.
    evidence:
    - reference: PMID:37584444
      reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        On the other hand, low SmB/B' led to promoted chondrogenesis in HEPM
        mesenchymal stem cells.
      explanation: >-
        The chondrogenic arm runs in the opposite direction, which is why the node
        is written as an altered balance rather than a uniform loss.
- name: SNRPB regulatory-exon minigene assay in HEK293 cells
  experimental_model_type: CELL_LINE
  description: >-
    Minigene reporters carrying wild-type or patient-mutant SNRPB regulatory exon sequence were transfected
    into HEK293 cells. Alternative-exon inclusion rose from 23% for wild type to 78% and 80% for the two
    tested patient alleles.
  modeled_mechanisms:
  - target: SNRPB Alternative-Exon Variants Increase Inclusion of a PTC-Containing Exon
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures the variant-dependent exon-inclusion step directly.
    limitations: >-
      Reporter expression in HEK293 cells does not reproduce endogenous dosage, craniofacial tissue context,
      or the complete syndrome.
    evidence:
    - reference: PMID:25047197
      reference_title: Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In the presence of the wild-type exon, 23% of all transcripts include this alternative exon, while
        introduction of either the chr20:g.2447951C>G or chr20:g.2447847G>T mutation shifts the proportion
        to 78% and 80%, respectively (Fig. 2a,b).
      explanation: >-
        The HEK293 minigene assay directly measures increased exon inclusion for two patient variants,
        rather than inferring the effect from their location.
discussions:
- discussion_id: ccms_tissue_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does reduced expression of a ubiquitous core spliceosomal protein preferentially affect craniofacial
    and rib development?
  attaches_to:
  - pathophysiology#Mis-Splicing of Developmental Transcripts
  rationale: >-
    The skeletal pattern is striking despite ubiquitous spliceosome function. Neural crest cell death
    and patterning changes, and altered Wnt/BMP responses in skeletal precursor models, offer partial
    explanations. They do not fully explain tissue selectivity or variable severity; additional malformations
    show that other organs are not invariably spared.
  status: OPEN
  evidence:
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although gene splicing occurs throughout the body, the phenotype of
      spliceosomal defects is largely limited to specific tissues.
    explanation: >-
      The paper opens by stating the paradox, which is what this gap records.
- discussion_id: ccms_rib_gap_respiratory_contribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the neonatal respiratory failure is caused by the rib gaps
    themselves, as opposed to the upper airway obstruction and the abnormal
    costovertebral articulation?
  attaches_to:
  - pathophysiology#Restrictive and Unstable Thorax
  - pathophysiology#Neonatal Respiratory Failure
  rationale: >-
    The rib gaps are the sign everyone reaches for, but an anatomical review
    argues they may be close to mechanically neutral because increased chest wall
    compliance from the gaps is offset by decreased compliance at the
    costovertebral complex. The same review nominates a fourth contributor the
    gaps get credited for: absent or vestigial rib formation, which it links to
    respiratory distress and increased lethality and proposes counting as a
    priority indicator for treatment planning. So the question is not only "how
    much do the gaps contribute" but "which of the four thoracic features should
    be measured", and no prospective respiratory-mechanics study exists to settle
    either.
  status: OPEN
  evidence:
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      anatomical consideration, and meta-analyses suggested that they might not be
      the significant factor in causing respiratory distress in neonates
    explanation: >-
      The review states the counterintuitive conclusion that this gap records.
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a further absence of ribs or vestigial rib formation is associated with
      respiratory distress and increased lethality.
    explanation: >-
      Names the fourth contributor that the gap statement would otherwise omit,
      and the one the review argues is prognostically relevant.
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      priority indicator to develop a personalized treatment plan based on the
      phenotypes exhibited.
    explanation: >-
      The review proposes an actionable measurement, which is what makes this an
      answerable gap rather than an open-ended one.
- discussion_id: ccms_chondrogenesis_direction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is chondrogenesis increased or decreased in the tissues that malform? The
    in-vitro and in-vivo evidence point in opposite directions.
  attaches_to:
  - pathophysiology#Impaired Osteogenic Differentiation
  - pathophysiology#Costal Patterning Failure
  - pathophysiology#Promoted Chondrogenesis in HEPM Cells
  rationale: >-
    SNRPB knockdown promotes chondrogenesis in HEPM craniofacial mesenchymal
    cells, while in the chick rib model Wnt inhibition reduces Sox9 and the
    authors conclude that inhibited chondrogenesis precipitates the rib defects.
    Both may be right if the direction is tissue-specific -- craniofacial
    mesenchyme and somite-derived costal cartilage are different lineages -- but
    nothing published tests that, and the two systems also differ in species and
    in whether SNRPB itself is perturbed. Until it is resolved, this entry does
    not route the in-vitro chondrogenic finding to the costal lesion.
  status: OPEN
  evidence:
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the other hand, low SmB/B' led to promoted chondrogenesis in HEPM
      mesenchymal stem cells.
    explanation: >-
      One direction, in craniofacial mesenchymal cells with SNRPB knocked down.
  - reference: PMID:31884688
    reference_title: "Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduced expression of Sox9 was detected with Wnt/β-catenin inhibition,
      indicating that inhibition of chondrogenesis precipitated the rib defects
      in the presence of Wnt/β-catenin inhibitors.
    explanation: >-
      The opposite direction, in the in-vivo model of the rib phenotype. Cited as
      REFUTE against a uniform "chondrogenesis is promoted" reading, which is what
      makes the tension explicit rather than leaving it for a reader to notice.

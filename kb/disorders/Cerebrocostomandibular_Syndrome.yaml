- name: Restrictive and Unstable Thorax
  biological_scale: ORGANISM
  description: >-
    A narrow thorax with reduced capacity. How much of the neonatal respiratory
    distress the rib gaps themselves contribute is contested: an anatomical
    review argues that increased chest wall compliance from the gaps and reduced

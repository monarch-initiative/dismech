name: Cerebrocostomandibular Syndrome
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Cerebrocostomandibular syndrome (CCMS) is a rare autosomal dominant
  malformation disorder caused by heterozygous variants in SNRPB, which encodes
  the core Sm proteins SmB/SmB' of the major spliceosome. The variants fall in a
  conserved alternative exon that carries a premature termination codon;
  including that exon routes the transcript to nonsense-mediated decay, so the
  variants raise inclusion of the exon and lower overall SNRPB expression. The
  resulting mis-splicing of developmental transcripts produces a narrowly
  skeletal phenotype: severe micrognathia with Pierre Robin sequence, and
  posterior rib gaps with reduced rib number and abnormal costovertebral
  articulation. Neonatal respiratory failure dominates the early course.
category: Mendelian
disease_term:
  preferred_term: cerebrocostomandibular syndrome
  term:
    id: MONDO:0007301
    label: cerebrocostomandibular syndrome
synonyms:
- CCMS
- cerebro-costo-mandibular syndrome
- rib gap defect with micrognathia
- rib gap syndrome
parents:
- craniofacial spliceosomopathy
- syndromic craniofacial dysostosis
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CCMS segregates as an autosomal dominant trait, and the reported series
    include both sporadic and familial cases. Molecularly the variants are
    heterozygous.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebro-Costo-Mandibular syndrome (CCMS) is a rare autosomal dominant
      condition comprising branchial arch-derivative malformations with striking
      rib-gaps.
    explanation: >-
      The largest published series states the autosomal dominant inheritance
      pattern directly.
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing and Sanger sequencing in five unrelated CCMS patients
      revealed five heterozygous variants in the small nuclear ribonucleoprotein
      polypeptides B and B1 (SNRPB) gene.
    explanation: >-
      The variants found in unrelated patients are heterozygous, consistent with
      a dominant mechanism.
prevalence:
- population: Reported CCMS literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disease-level literature is a
    small number of case reports and one multicentre series of 16 patients; the
    deep-research report put the cumulative published total under about 110
    cases, but that count is not itself sourced to a systematic review and is
    recorded here only as context, not as a curated figure.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a series of 12 sporadic and 4 familial patients including 13
      infants/children and 3 adults.
    explanation: >-
      The size of the largest assembled series supports an ultra-rare disorder
      counted in published cases rather than population rates.
progression:
- phase: Neonatal presentation
  notes: >-
    Presentation is at birth with micrognathia, a small mouth and airway
    obstruction; intubation is often difficult and tracheostomy may be needed in
    the first days of life.
  evidence:
  - reference: PMID:38782423
    reference_title: "Cerebrocostomandibular syndrome: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was born limp and apnoeic and required multiple attempts at intubation
      before a definitive airway was eventually sited.
    explanation: >-
      A representative case documents the neonatal airway emergency that opens
      the clinical course.
- phase: Survival beyond infancy
  notes: >-
    Patients who survive the neonatal airway and ventilation problems can reach
    adulthood; the largest series included three adults alongside thirteen
    infants and children.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a series of 12 sporadic and 4 familial patients including 13
      infants/children and 3 adults.
    explanation: >-
      The presence of adults in the series supports survival into adulthood for
      a subset of patients.
pathophysiology:
- name: SNRPB Alternative-Exon Variants Increase Inclusion of a PTC-Containing Exon
  biological_scale: MOLECULAR
  description: >-
    The CCMS variants cluster in a highly conserved alternative exon of SNRPB
    that contains a premature termination codon. Rather than changing the SmB/B'
    protein sequence, they shift splicing so that this exon is included more
    often.
  genes:
  - preferred_term: SNRPB
    term:
      id: hgnc:11153
      label: SNRPB
  biological_processes:
  - preferred_term: regulation of alternative mRNA splicing
    modifier: ABNORMAL
    term:
      id: GO:0008380
      label: RNA splicing
  evidence:
  - reference: PMID:25047197
    reference_title: "Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify mutations in one such element, a regulatory alternative
      exon of SNRPB as the cause of cerebro-costo-mandibular syndrome.
    explanation: >-
      The discovery paper localises the causal variants to the regulatory
      alternative exon rather than to the coding sequence.
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants were located in the premature termination codon
      (PTC)-introducing alternative exon of transcript 3.
    explanation: >-
      An independent cohort places every variant in the same PTC-introducing
      alternative exon.
  downstream:
  - target: Reduced SNRPB Expression Through Nonsense-Mediated Decay
    causal_link_type: DIRECT
    description: >-
      Inclusion of the PTC-containing exon routes the transcript to
      nonsense-mediated decay, so increased inclusion lowers the amount of
      SNRPB message that survives to be translated.
    evidence:
    - reference: PMID:25047197
      reference_title: "Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This exon contains a premature termination codon that triggers
        nonsense-mediated mRNA decay when included in the transcript. These
        mutations cause increased inclusion of the alternative exon and decreased
        overall expression of SNRPB.
      explanation: >-
        This sentence states the causal step from raised exon inclusion to lower
        SNRPB expression, via nonsense-mediated decay.
- name: Reduced SNRPB Expression Through Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  description: >-
    Less SmB/B' core Sm protein is available for assembly of the small nuclear
    ribonucleoprotein particles of the major spliceosome. The transcript that is
    degraded is measurable in patients: quantitative RT-PCR shows the
    PTC-containing transcript raised in patient leukocytes.
  genes:
  - preferred_term: SNRPB
    term:
      id: hgnc:11153
      label: SNRPB
  biological_processes:
  - preferred_term: spliceosomal snRNP assembly
    modifier: DECREASED
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
  evidence:
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Quantitative RT-PCR analysis revealed a significant increase in transcript
      3 levels in leukocytes of CCMS individuals compared to controls.
    explanation: >-
      Patient leukocytes show the predicted shift toward the decay-targeted
      transcript, measured directly.
  downstream:
  - target: Mis-Splicing of Developmental Transcripts
    causal_link_type: DIRECT
    description: >-
      Lower core Sm protein alters the splicing of many transcripts, with
      increased exon skipping and intron retention.
    evidence:
    - reference: PMID:35593225
      reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RNAseq analysis of mutant heads prior to morphological defects revealed
        increased exon skipping and intron retention in association with
        increased 5' splice site strength.
      explanation: >-
        In the mouse model, reduced Snrpb produces a measurable, genome-wide
        splicing shift, and it precedes the morphological defect.
- name: Mis-Splicing of Developmental Transcripts
  biological_scale: MOLECULAR
  description: >-
    Reduced core Sm protein produces increased exon skipping and intron
    retention. Affected transcripts include negative regulators of the P53
    pathway, head and midface regulators such as Smad2 and Rere, and the Wnt
    effector TCF7L2.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    modifier: ABNORMAL
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:35593225
    reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also found a small but significant increase in exon skipping of several
      transcripts required for head and midface development, including Smad2 and
      Rere.
    explanation: >-
      The affected transcripts are developmental regulators of the same
      structures that are malformed in CCMS.
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SNRPB knockdown altered splicing of TCF7L2 which impacts Wnt/β-catenin
      pathway activities.
    explanation: >-
      A specific mis-spliced transcript is identified and tied to a named
      signalling pathway.
  downstream:
  - target: P53 Pathway Activation in Neural Crest Cells
    causal_link_type: DIRECT
    description: >-
      Exon skipping in negative regulators of P53 raises nuclear P53 and its
      target genes in the developing head.
    evidence:
    - reference: PMID:35593225
      reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found increased exon skipping in negative regulators of the P53
        pathway, along with increased levels of nuclear P53 and P53 target genes.
      explanation: >-
        The paper connects the splicing change in P53 regulators to a measured
        rise in nuclear P53 in the same tissue.
  - target: Attenuated Wnt/beta-Catenin and Enhanced BMP Signalling
    causal_link_type: DIRECT
    description: >-
      Reporter assays in SNRPB-knockdown cells show reduced Wnt pathway output
      and increased BMP pathway output.
    evidence:
    - reference: PMID:37584444
      reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Reporter analysis revealed that suppression of SNRPB results in
        attenuated Wnt pathway and/or enhanced BMP pathway activities.
      explanation: >-
        Reporter output is measured directly in cells with suppressed SNRPB.
- name: P53 Pathway Activation in Neural Crest Cells
  biological_scale: CELLULAR
  description: >-
    Nuclear P53 and its target genes rise in the developing head. Removing Trp53
    from Snrpb-heterozygous neural crest cells does not fully rescue
    craniofacial development, so P53 activation is one contributing arm rather
    than the whole mechanism.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  evidence:
  - reference: PMID:35593225
    reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, removing Trp53 in Snrpb heterozygous mutant neural crest cells did
      not completely rescue craniofacial development.
    explanation: >-
      The rescue experiment bounds how much of the phenotype the P53 arm
      accounts for, which is why this node is not drawn as the sole cause.
  downstream:
  - target: Neural Crest-Derived First Arch Hypoplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - neural crest cell loss and disturbed Fgf8/Shh patterning
    description: >-
      P53 activation together with disturbed patterning signals in the same
      embryos produces the craniofacial malformation.
    evidence:
    - reference: PMID:35593225
      reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, heterozygous deletion of Snrpb in the developing brain and
        neural crest cells models craniofacial malformations found in CCMS, and
        results in death shortly after birth.
      explanation: >-
        Tissue-restricted deletion in neural crest reproduces the human
        craniofacial phenotype, placing the lesion in that lineage.
- name: Attenuated Wnt/beta-Catenin and Enhanced BMP Signalling
  biological_scale: CELLULAR
  description: >-
    Loss of SmB/B' shifts the balance of two skeletal patterning pathways. The
    source reports "attenuated Wnt pathway and/or enhanced BMP pathway
    activities", so the two directions are not established as always co-occurring
    and the modifiers below record each arm as reported rather than as a fixed
    pair. Suppressed osteogenic markers are partly rescued by activating
    Wnt/beta-catenin, which places the Wnt arm upstream of the differentiation
    defect rather than beside it.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  evidence:
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Suppressed osteogenic markers by SNRPB knockdown were partly rescued by
      Wnt/β-catenin pathway activation.
    explanation: >-
      A rescue experiment establishes the direction of the link between the
      pathway shift and the differentiation defect.
  downstream:
  - target: Impaired Osteogenic and Altered Chondrogenic Differentiation
    causal_link_type: DIRECT
    description: >-
      The pathway shift changes how skeletal precursors differentiate.
    evidence:
    - reference: PMID:37584444
      reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Consistent with other reports, osteogenesis was promoted by the
        Wnt/β-catenin pathway activator and suppressed by Wnt and BMP blockers,
        whereas chondrogenesis was promoted by Wnt inhibitors.
      explanation: >-
        The pathway dependence of osteogenesis and chondrogenesis is established
        in the same experimental system.
  - target: Costal Patterning Failure
    causal_link_type: DIRECT
    description: >-
      Local Wnt/beta-catenin inhibition during somitogenesis is sufficient to
      produce rib gaps in vivo.
    evidence:
    - reference: PMID:31884688
      reference_title: "Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Wnt/β-catenin inhibition manifested characteristic rib phenotypes seen in
        CCMS, including rib gaps (P < 0.05) and missing ribs
      explanation: >-
        Beads delivering a Wnt inhibitor to chick somites reproduce the rib gaps,
        making this a sufficiency test for the edge rather than a correlation.
- name: Impaired Osteogenic and Altered Chondrogenic Differentiation
  biological_scale: CELLULAR
  description: >-
    Low SmB/B' suppresses osteodifferentiation in osteoprogenitor-like cells and
    promotes chondrogenesis in mesenchymal cells, with altered splicing of the
    osteogenic transcription factor Dlx5.
  cell_types:
  - preferred_term: osteoblast

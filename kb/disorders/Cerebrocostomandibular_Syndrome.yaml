    reference_title: "Cerebro-costo-mandibular syndrome: Report of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The father had micrognathia, with a history of cleft palate repair. Interestingly, a chest radiograph
      of the father showed rib-gap defects.
    explanation: >-
      The article summarizes a previously reported CCMS family with palate repair. This is background

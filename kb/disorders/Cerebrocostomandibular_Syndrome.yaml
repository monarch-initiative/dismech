animal_models:
- name: Snrpb conditional heterozygous neural crest deletion mouse
  species: Mouse
  genotype: Snrpb heterozygous conditional deletion in brain and neural crest (Wnt1-Cre)
  publication: PMID:35593225
  description: >-
    Complete Snrpb heterozygosity arrests mouse embryos shortly after
    implantation, so the craniofacial phenotype has to be modelled with a
    tissue-restricted deletion.
  modeled_mechanisms:
  - target: Neural Crest-Derived First Arch Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous Snrpb deletion in brain and neural crest reproduces the
      craniofacial malformations of CCMS.
    limitations: >-
      The model is a conditional gene deletion, not the human autoregulatory
      poison-exon mechanism, and the mouse dies shortly after birth. Whole-embryo
      Snrpb heterozygosity is lethal at implantation in mouse but compatible with
      survival to adulthood in humans, so the dose-response relationship differs
      between species.
    readouts:
    - name: Craniofacial morphology of mutant embryos
      target: Neural Crest-Derived First Arch Hypoplasia
      direction: ALTERED
      interpretation: >-
        Structural correlate of the first-arch hypoplasia node.

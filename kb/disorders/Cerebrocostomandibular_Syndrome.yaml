diagnosis:
- name: SNRPB sequencing including the alternative exon
  description: >-
    SNRPB testing should cover the regulatory alternative exon and appropriate intronic sequence. The
    poison-exon annotation study recovered a previously reported pathogenic SNRPB variant in a genome-sequenced
    proband with CCMS features, illustrating how coding-focused annotation can miss clinically relevant
    variants.
  evidence:
  - reference: PMID:37161864
    reference_title: Poison exon annotations improve the yield of clinically relevant variants in genomic diagnostic testing.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This variant has been reported in 10 unrelated, affected individuals with both de novo and inherited
      alleles with incomplete penetrance14.
    explanation: >-
      The full-text SNRPB case illustrates a clinically relevant poison-exon variant; computational prioritization
      and the prior clinical classification are distinct.
  diagnosis_term:
    preferred_term: SNRPB sequencing including the regulatory alternative exon
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Prenatal diagnosis and delivery planning
  description: >-
    Where the family is known, prenatal diagnosis changes management: it allows
    delivery to be planned so that the airway is secured before the neonate
    depends on it.
  evidence:
  - reference: PMID:25252050
    reference_title: "Ex utero intrapartum treatment for an infant with cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EXIT would be an effective option for rescuing patients with prenatally
      diagnosed CCMS and preventing neonatal hypoxia.
    explanation: >-
      The authors state the management consequence of a prenatal diagnosis.
differential_diagnoses:
- name: Pierre Robin sequence without rib defects
  description: >-
    The craniofacial half of CCMS is a Pierre Robin sequence, which has many
    causes. The posterior rib gaps are what separate CCMS, and are described as
    unique to it.
  evidence:
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the posterior rib gaps being unique to this condition and visually
      striking on radiographic images
    explanation: >-
      The rib gaps are the discriminating feature against other causes of Robin
      sequence.
- name: Other craniofacial spliceosomopathies
  description: >-
    Mandibulofacial dysostosis Guion-Almeida type (EFTUD2), Nager syndrome
    (SF3B4), Richieri-Costa-Pereira syndrome (EIF4A3) and Burn-McKeown syndrome
    (TXNL4A) share a spliceosomal lesion and a craniofacial phenotype. CCMS is
    distinguished within this group by the rib defects.
  evidence:
  - reference: PMID:25865758
    reference_title: "A review of craniofacial disorders caused by spliceosomal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SF3B4 in Nager syndrome, an acrofacial dysostosis (AFD); SNRPB in
      cerebrocostomandibular syndrome, characterized by Robin sequence and rib
      defects; EIF4A3 in the AFD Richieri-Costa-Pereira syndrome
    explanation: >-
      The review places CCMS in the spliceosomopathy group and names the feature
      that separates it.
treatments:
- name: Tracheostomy and airway management
  description: >-
    Securing the airway is the first intervention. Intubation may be difficult
    and tracheostomy is often needed early.
  treatment_term:
    preferred_term: tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: >-
      Tracheostomy bypasses the obstruction at the tongue base created by the
      hypoplastic mandible.
  evidence:
  - reference: PMID:38782423
    reference_title: "Cerebrocostomandibular syndrome: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A tracheostomy was formed on day of life 9 given the immediate risk to the
      baby's airway.
    explanation: >-
      A case report documents tracheostomy as the definitive airway intervention.
- name: Ex utero intrapartum treatment (EXIT)
  description: >-
    Where CCMS is diagnosed prenatally, the airway can be secured on placental
    circulation before the cord is clamped, avoiding the emergency intubation
    that the postnatal presentation otherwise forces.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: >-
      Secures the airway before the neonate depends on it, so it preempts the obstruction rather than
      relieving it.
  evidence:
  - reference: PMID:25252050
    reference_title: "Ex utero intrapartum treatment for an infant with cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A boy, having a mother with Pierre-Robin sequence and a sister with CCMS,
      was diagnosed prenatally with CCMS and successfully treated with ex utero
      intrapartum treatment (EXIT) at 36 weeks 6 days of gestation.
    explanation: >-
      One successfully treated CCMS case documents the procedure; it does not establish comparative efficacy.
  notes: >-
    Needs term: EXIT is airway establishment during delivery while placental support is maintained. The
    queries `runoak -i ols:ncit search 'ex utero intrapartum'` and `runoak -i ols:ncit search 'intrapartum'`
    did not return an EXIT intervention term. Cesarean Section describes delivery, not the airway intervention.
- name: Cleft palate repair
  description: >-
    Cleft palate repair has been described in an affected parent in a CCMS family. Timing and outcome
    depend on individual craniofacial and airway anatomy; no disease-specific comparative trial is implied.

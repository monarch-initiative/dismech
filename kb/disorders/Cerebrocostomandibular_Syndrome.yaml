  locations:
  - preferred_term: thoracic cavity
    term:
      id: UBERON:0002224
      label: thoracic cavity
  evidence:
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Rather, the increase in chest wall compliance due to the rib gaps and the
      decrease in compliance at the costovertebral complex was considered to
      result in an equilibrium, minimizing the impact of these abnormalities.
    explanation: >-
      This review supports the thorax being mechanically abnormal, but argues
      against the rib gaps being the dominant driver of neonatal distress. It is

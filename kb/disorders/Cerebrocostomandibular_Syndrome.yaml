name: Cerebrocostomandibular Syndrome
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Cerebrocostomandibular syndrome (CCMS) is a rare autosomal dominant malformation disorder associated
  with heterozygous SNRPB variants. SNRPB encodes the core spliceosomal proteins SmB/SmB'. Most molecularly
  characterized cases carry variants in a regulatory alternative exon containing a premature termination
  codon. Increased inclusion of this exon promotes nonsense-mediated decay and reduces overall SNRPB expression.
  Disturbed splicing of developmental transcripts contributes to severe micrognathia with Pierre Robin
  sequence and posterior rib gaps, reduced rib number and abnormal costovertebral articulation. Airway
  obstruction and thoracic restriction dominate the early clinical course; severity and penetrance vary.
category: Mendelian
disease_term:
  preferred_term: cerebrocostomandibular syndrome
  term:
    id: MONDO:0007301
    label: cerebrocostomandibular syndrome
synonyms:
- CCMS
- cerebro-costo-mandibular syndrome
- rib gap defect with micrognathia
- rib gap syndrome
- Smith-Theiler-Schachenmann syndrome
parents:
- craniofacial spliceosomopathy
- syndromic craniofacial dysostosis
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant inheritance with both de novo and transmitted variants. Non-penetrance was observed
    in two individuals in the discovery cohort; no population penetrance percentage is established.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebro-Costo-Mandibular syndrome (CCMS) is a rare autosomal dominant
      condition comprising branchial arch-derivative malformations with striking
      rib-gaps.
    explanation: >-
      The largest published series states the autosomal dominant inheritance
      pattern directly.
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing and Sanger sequencing in five unrelated CCMS patients
      revealed five heterozygous variants in the small nuclear ribonucleoprotein
      polypeptides B and B1 (SNRPB) gene.
    explanation: >-
      The variants found in unrelated patients are heterozygous, consistent with
      a dominant mechanism.
  - reference: PMID:25047197
    reference_title: Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a high rate of de novo mutations and two instances of non-penetrance.
    explanation: >-
      The discovery study directly documents non-penetrance, rather than merely inferring it from apparently
      unaffected parents.
  penetrance: INCOMPLETE
prevalence:
- population: Reported CCMS literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published case counts are dated ascertainment summaries, not population prevalence estimates. A 2010
    literature analysis reported 75 cases; the 2016 multicentre series described 16 patients, including
    previously reported individuals. These counts must not be added together.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a series of 12 sporadic and 4 familial patients including 13
      infants/children and 3 adults.
    explanation: >-
      The size of the largest assembled series supports an ultra-rare disorder
      counted in published cases rather than population rates.
  - reference: PMID:20507350
    reference_title: "Cerebro-costo-mandibular syndrome: prognosis and proposal for classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 75 cases have been reported worldwide.
    explanation: >-
      Historical literature count reported in 2010, not a current total or a population prevalence estimate.
progression:
- phase: Neonatal presentation
  notes: >-
    Presentation is at birth with micrognathia, a small mouth and airway
    obstruction; intubation is often difficult and tracheostomy may be needed in
    the first days of life.
  evidence:
  - reference: PMID:38782423
    reference_title: "Cerebrocostomandibular syndrome: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was born limp and apnoeic and required multiple attempts at intubation
      before a definitive airway was eventually sited.
    explanation: >-
      A representative case documents the neonatal airway emergency that opens
      the clinical course.
- phase: Perinatal mortality
  notes: >-
    Inadequate ventilation at birth carries high perinatal mortality, and the
    condition can be lethal. Survival is reported to improve with accurate
    diagnosis and management, so the mortality is not fixed by the malformation
    alone.
  evidence:
  - reference: PMID:31884688
    reference_title: "Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These defects include rib gaps, found in the posterior part of the costal
      shaft in multiple ribs, as well as missing ribs, shortened ribs and abnormal
      costotransverse articulations, which result in inadequate ventilation at
      birth and high perinatal mortality.
    explanation: >-
      The rib defects are linked directly to inadequate ventilation and high
      perinatal mortality. HUMAN_CLINICAL because the sentence reports the human
      disease rather than this paper's chick experiments; BACKGROUND because the
      paper is restating it as framing, not measuring it. The independent
      statement from PMID:37265362 below is the stronger source.
  - reference: PMID:37265362
    reference_title: "Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the condition can be lethal, accurate diagnosis, and subsequent
      management help improve the survival rate.
    explanation: >-
      States both the lethality and that management changes the outcome.
- phase: Survival beyond infancy
  notes: >-
    Patients who survive the neonatal airway and ventilation problems can reach
    adulthood; the largest series included three adults alongside thirteen
    infants and children.
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a series of 12 sporadic and 4 familial patients including 13
      infants/children and 3 adults.
    explanation: >-
      The presence of adults in the series supports survival into adulthood for
      a subset of patients.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Neonatal airway obstruction and inadequate ventilation can be lethal. Survivors may require tracheostomy,
    feeding support and orthopaedic care. Cognitive impairment is not universal, and the reported clinical
    burden is predominantly respiratory and skeletal.
  evidence:
  - reference: PMID:31884688
    reference_title: "Local modulation of the Wnt/β-catenin and bone morphogenic protein (BMP) pathways recapitulates rib defects analogous to cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These defects include rib gaps, found in the posterior part of the costal
      shaft in multiple ribs, as well as missing ribs, shortened ribs and abnormal
      costotransverse articulations, which result in inadequate ventilation at
      birth and high perinatal mortality.
    explanation: >-
      High perinatal mortality is the basis for the HIGH band. BACKGROUND: the
      sentence is the paper's framing of the human disease, not a result of its
      own chick experiments. The same claim is carried independently by
      PMID:37265362 in the progression section.
pathophysiology:
- name: SNRPB Alternative-Exon Variants Increase Inclusion of a PTC-Containing Exon
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  biological_scale: MOLECULAR
  description: >-
    The predominant CCMS alleles cluster in a conserved SNRPB alternative exon containing a premature
    termination codon. They overlap exonic splicing silencers and increase exon inclusion without changing
    the normal SmB/B' protein sequence. A predicted null 5' UTR allele reported in a more severely affected
    fetus represents a distinct allelic observation, not this poison-exon mechanism.
  genes:
  - preferred_term: SNRPB
    term:
      id: hgnc:11153
      label: SNRPB
  genetic_context:
    gene:
      preferred_term: SNRPB
      term:
        id: hgnc:11153
        label: SNRPB
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      The alternative-exon alleles act as hypomorphs. Quantitative RT-PCR in three patient fibroblast
      cultures found total SNRPB expression of 0.53–0.66 relative to controls; this is an RNA measurement,
      not a direct protein-dose or population penetrance estimate.
  biological_processes:
  - preferred_term: regulation of alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25047197
    reference_title: "Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify mutations in one such element, a regulatory alternative
      exon of SNRPB as the cause of cerebro-costo-mandibular syndrome.
    explanation: >-
      The discovery paper localises the causal variants to the regulatory
      alternative exon rather than to the coding sequence.
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants were located in the premature termination codon
      (PTC)-introducing alternative exon of transcript 3.
    explanation: >-
      An independent cohort places every variant in the same PTC-introducing
      alternative exon.
  - reference: PMID:25047197
    reference_title: Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      qRT–PCR experiments in three patients show a narrow range of total SNRPB expression (0.53–0.66 relative
      to controls).
    explanation: >-
      The full text reports the quantitative RNA reduction in cultured patient fibroblasts.
  - reference: PMID:25047197
    reference_title: Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the presence of the wild-type exon, 23% of all transcripts include this alternative exon, while
      introduction of either the chr20:g.2447951C>G or chr20:g.2447847G>T mutation shifts the proportion
      to 78% and 80%, respectively (Fig. 2a,b).
    explanation: >-
      The HEK293 minigene assay directly measures increased exon inclusion for two patient variants, rather
      than inferring the effect from their location.
  downstream:
  - target: Reduced SNRPB Expression Through Nonsense-Mediated Decay
    causal_link_type: DIRECT
    description: >-
      Inclusion of the PTC-containing exon routes the transcript to
      nonsense-mediated decay, so increased inclusion lowers the amount of
      SNRPB message that survives to be translated.
    evidence:
    - reference: PMID:25047197
      reference_title: "Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This exon contains a premature termination codon that triggers
        nonsense-mediated mRNA decay when included in the transcript. These
        mutations cause increased inclusion of the alternative exon and decreased
        overall expression of SNRPB.
      explanation: >-
        This sentence states the causal step from raised exon inclusion to lower
        SNRPB expression, via nonsense-mediated decay.
- name: Reduced SNRPB Expression Through Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  description: >-
    Increased inclusion of the premature-termination-codon exon shifts SNRPB transcripts toward nonsense-mediated
    decay. Patient leukocytes show increased decay-targeted transcript, while patient fibroblasts show
    reduced overall SNRPB RNA. Lower availability of the core Sm proteins is the proposed link to downstream
    splicing defects.
  genes:
  - preferred_term: SNRPB
    term:
      id: hgnc:11153
      label: SNRPB
  biological_processes:
  - preferred_term: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  evidence:
  - reference: PMID:25504470
    reference_title: "Mutations in SNRPB, encoding components of the core splicing machinery, cause cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Quantitative RT-PCR analysis revealed a significant increase in transcript
      3 levels in leukocytes of CCMS individuals compared to controls.
    explanation: >-
      Patient leukocytes show the predicted shift toward the decay-targeted
      transcript, measured directly.
  - reference: PMID:25047197
    reference_title: Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the PTC-containing transcript increased, whereas overall expression of SNRPB decreased
      compared with control cells (Fig. 2c,d).
    explanation: >-
      Patient fibroblast measurements support reduced total RNA in addition to the shift toward the decay-targeted
      transcript.
  downstream:
  - target: Mis-Splicing of Developmental Transcripts
    causal_link_type: DIRECT
    description: >-
      Lower core Sm protein alters the splicing of many transcripts, with
      increased exon skipping and intron retention.
    evidence:
    - reference: PMID:35593225
      reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RNAseq analysis of mutant heads prior to morphological defects revealed
        increased exon skipping and intron retention in association with
        increased 5' splice site strength.
      explanation: >-
        In the mouse model, reduced Snrpb produces a measurable, genome-wide
        splicing shift, and it precedes the morphological defect.
  - target: Enhanced BMP Signalling
    causal_link_type: DIRECT
    description: >-
      SNRPB suppression changes the BMP reporter output in cultured cells.
    evidence:
    - reference: PMID:37584444
      reference_title: Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Reporter analysis revealed that suppression of SNRPB results in attenuated Wnt pathway and/or
        enhanced BMP pathway activities.
      explanation: >-
        Separate BMP reporter observation after SNRPB suppression.
  - target: Promoted Chondrogenesis in HEPM Cells
    causal_link_type: DIRECT
    description: >-
      SNRPB depletion promotes chondrogenesis in HEPM cells.
    evidence:
    - reference: PMID:37584444
      reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        On the other hand, low SmB/B' led to promoted chondrogenesis in HEPM
        mesenchymal stem cells.
      explanation: >-
        The chondrogenic arm runs in the opposite direction, which is why the node
        is written as an altered balance rather than a uniform loss.
- name: Mis-Splicing of Developmental Transcripts
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  biological_scale: MOLECULAR
  description: >-
    Reduced core Sm protein produces increased exon skipping and intron
    retention. Affected transcripts include negative regulators of the P53
    pathway, head and midface regulators such as Smad2 and Rere, and the Wnt
    effector TCF7L2.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    modifier: ABNORMAL
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:35593225
    reference_title: "Snrpb is required in murine neural crest cells for proper splicing and craniofacial morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also found a small but significant increase in exon skipping of several
      transcripts required for head and midface development, including Smad2 and
      Rere.
    explanation: >-
      The affected transcripts are developmental regulators of the same
      structures that are malformed in CCMS.
  - reference: PMID:37584444
    reference_title: "Defects of the spliceosomal gene SNRPB affect osteo- and chondro-differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SNRPB knockdown altered splicing of TCF7L2 which impacts Wnt/β-catenin
      pathway activities.
    explanation: >-
      A specific mis-spliced transcript is identified and tied to a named
      signalling pathway.
  downstream:

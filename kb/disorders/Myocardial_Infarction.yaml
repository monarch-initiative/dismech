biochemical:
- name: Elevated cardiac troponin
  presence: Elevated
  context: >
    A rise and/or fall of high-sensitivity cardiac troponin (cTnI or cTnT) above
    the 99th-percentile upper reference limit, in a clinical context of
    ischemia, is the biomarker cornerstone of the Fourth Universal Definition of
    MI; troponin is the most sensitive/specific marker for acute myocardial
    injury.
  evidence:
  - reference: DOI:10.3390/biomedicines13071532
    reference_title: "Network Pharmacology Approaches to Myocardial Infarction Reperfusion Injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "distinguishing reperfusion injury from ischemic damage is challenging and often requires the use of sensitive biomarkers, such as cardiac troponins, alongside advanced imaging modalities."
    explanation: Supports cardiac troponin as the sensitive biomarker used to detect myocardial injury in MI.
- name: Elevated CK-MB
  presence: Elevated
  context: >
    Creatine kinase-MB isoenzyme and LDH rise more slowly (LDH at roughly 24-48
    hours) than troponin; historically used for MI diagnosis and for gauging
    infarct timing, now largely superseded by high-sensitivity troponin.
treatments:
- name: Coronary Reperfusion (PCI or Fibrinolysis)
  description: >
    Emergency restoration of coronary blood flow by primary percutaneous
    coronary intervention or, where unavailable, fibrinolysis, to salvage
    ischemic myocardium.
  treatment_term:
    preferred_term: percutaneous coronary intervention
    term:
      id: NCIT:C99521
      label: Percutaneous Coronary Intervention
  evidence:
  - reference: PMID:27502078
    reference_title: "Acute myocardial infarction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "implementation of care delivery systems prioritising immediate revascularisation through percutaneous coronary intervention (or fibrinolysis)"
    explanation: Identifies immediate revascularisation by PCI or fibrinolysis as central to modern AMI management.
- name: Antiplatelet and Antithrombotic Therapy
  description: >
    Antiplatelet agents and anticoagulants to limit coronary thrombus
    propagation, plus secondary-prevention statins.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:27502078
    reference_title: "Acute myocardial infarction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "advances in antiplatelet agents and anticoagulants, and greater use of secondary prevention strategies such as statins."
    explanation: Identifies antiplatelet agents, anticoagulants, and statins as pillars of pharmacological AMI management.

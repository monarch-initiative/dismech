  - reference: DOI:10.1161/circresaha.124.323658
    reference_title: "Repair of the Infarcted Heart: Cellular Effectors, Molecular Mechanisms and Therapeutic Opportunities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Expansion and diversification of cardiac macrophages in the infarcted heart play a major role in the clearance of the infarct from dead cells and the subsequent stimulation of reparative pathways."
    explanation: Supports the role of cardiac macrophage expansion in clearing the infarct and initiating repair.
  - reference: DOI:10.1161/circresaha.124.323658
    reference_title: "Repair of the Infarcted Heart: Cellular Effectors, Molecular Mechanisms and Therapeutic Opportunities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Efferocytosis triggers the induction and release of anti-inflammatory mediators that restrain the inflammatory reaction and set the stage for the activation of reparative fibroblasts and vascular cells."
    explanation: Evidences the efferocytosis-driven switch from inflammation to fibroblast-mediated repair that this node describes.
  - reference: DOI:10.3390/cells13131125
    reference_title: "The Influence of Metabolic Risk Factors on the Inflammatory Response Triggered by Myocardial Infarction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myocardial infarction (MI) sets off a complex inflammatory cascade that is crucial for effective cardiac healing and scar formation."
    explanation: Corroborates that the post-MI inflammatory cascade is essential for cardiac healing and scar formation.
  - reference: DOI:10.3390/cells13131125
    reference_title: "The Influence of Metabolic Risk Factors on the Inflammatory Response Triggered by Myocardial Infarction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Yet, if this response becomes excessive or uncontrolled, it can lead to cardiovascular complications."
    explanation: Supports that a dysregulated post-MI inflammatory response drives adverse cardiovascular outcomes.
- name: Cardiac Fibrosis and Ventricular Remodeling
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >
    Loss of contractile myocardium and sustained inflammatory/neurohormonal
    drive produce adverse structural remodeling of the ventricle. Cardiac
    fibroblasts differentiate into myofibroblasts that deposit a collagen-based
    extracellular matrix; a well-organized scar protects against rupture and
    limits acute dilation, but excessive, prolonged, or dysregulated fibrogenic
    signaling drives interstitial fibrosis, chamber dilation, and contractile
    dysfunction, progressing to heart failure. This node conforms to the
    conserved ventricular-remodeling step of the maladaptive-cardiomyopathy
    module, substituting the ischemic infarct scar as the disorder-specific
    insult.

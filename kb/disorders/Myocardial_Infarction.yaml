    causal_link_type: DIRECT
    description: >
      Reperfusion-driven necrosis and DAMP release amplify the sterile
      inflammatory response in the infarcted myocardium.
  evidence:
  - reference: DOI:10.1097/crd.0000000000000440
    reference_title: "Pathobiology of Myocardial Ischemia and Reperfusion Injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reperfusion salvages a significant amount of ischemic myocardium in the subepicardium while reperfusion injury contributes up to 50% of the final subendocardial infarct."
    explanation: Establishes that reperfusion, while salvaging myocardium, contributes up to half of the final infarct size — the defining claim of MIRI.
  - reference: DOI:10.1097/crd.0000000000000440
    reference_title: "Pathobiology of Myocardial Ischemia and Reperfusion Injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reperfusion of severely ischemic myocardium leads to sustained opening of the mitochondrial permeability transition pore (MPTP)."
    explanation: Evidences the central mitochondrial mechanism (sustained MPTP opening) of lethal reperfusion injury described in this node.
  - reference: DOI:10.3390/cells14191509
    reference_title: "Myocardial Ischemia/Reperfusion Injury: Molecular Insights, Forensic Perspectives, and Therapeutic Horizons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MIRI refers to paradoxical myocardial damage that occurs upon restoration of coronary blood flow and is driven by complex inflammatory, oxidative, and metabolic mechanisms, which can exacerbate infarct size"
    explanation: Defines MIRI as paradoxical reperfusion damage driven by inflammatory, oxidative, and metabolic mechanisms that enlarge the infarct.
  - reference: DOI:10.3390/cells14191509
    reference_title: "Myocardial Ischemia/Reperfusion Injury: Molecular Insights, Forensic Perspectives, and Therapeutic Horizons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The principal mechanisms discussed include oxidative stress and mitochondrial dysfunction, calcium overload and ion homeostasis imbalance, inflammatory responses, with particular focus on the NLRP3 inflammasome and cytokine pathways, and multiple forms of cell death (apoptosis, necroptosis, pyroptosis, and autophagy)."
    explanation: Enumerates the oxidative-stress, calcium-overload, NLRP3-inflammasome, and multi-modal cell-death mechanisms attributed to MIRI in this node.
  - reference: DOI:10.3390/biomedicines12040802
    reference_title: "Myocardial Ischemia–Reperfusion Injury: Unraveling Pathophysiology, Clinical Manifestations, and Emerging Prevention Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "underscoring its potential to contribute substantially to the final infarct size, up to 50%."
    explanation: Independent review corroborating that MIRI can contribute up to 50% of the final infarct size.
- name: Post-Infarction Inflammation and Cardiac Repair
  description: >
    Massive cardiomyocyte death releases damage-associated molecular patterns
    (DAMPs/alarmins) that engage pattern-recognition receptors (TLRs, NLRs),
    driving cytokine (IL-1, TNF-alpha, IL-6) and chemokine (CCL2) production and
    recruitment of neutrophils and monocytes. Expansion and diversification of
    cardiac macrophages clears dead cells; efferocytosis then triggers
    anti-inflammatory mediators (IL-10, TGF-beta) that restrain inflammation and
    activate reparative fibroblasts and vascular cells. This tightly regulated
    inflammatory-to-reparative transition is essential for healing, but an
    excessive or unresolved response promotes adverse outcomes.
  cell_types:

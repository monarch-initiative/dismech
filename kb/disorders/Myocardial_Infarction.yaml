    explanation: Evidences ischemic cardiomyocyte necrosis and apoptosis in the infarcted myocardium described by this node.
- name: Ischemia-Reperfusion Injury
  description: >
    Restoration of coronary blood flow (by primary PCI or fibrinolysis) is
    essential to salvage ischemic myocardium but paradoxically inflicts
    additional damage — myocardial ischemia-reperfusion injury (MIRI) — that can
    account for up to half of the final infarct size. Reperfusion drives a burst
    of reactive oxygen species, cytosolic and mitochondrial calcium overload,
    and sustained opening of the mitochondrial permeability transition pore
    (MPTP) with collapse of the mitochondrial membrane potential and cessation
    of ATP production, together with endothelial dysfunction, NLRP3 inflammasome
    activation, and multiple regulated cell-death programs (apoptosis,
    necroptosis, pyroptosis, ferroptosis) and dysregulated autophagy.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746

notes: >
  Created as an endpoint entry to support directional comorbidity/trajectory
  modeling of acute respiratory infection (influenza, RSV) as a short-term
  trigger of type 1 myocardial infarction. Type 1 (atherothrombotic) MI is
  modeled here; type 2 MI (supply-demand mismatch without acute
  atherothrombosis) is a related but distinct mechanism.
datasets:
- accession: geo:GSE306012
  title: Temporal inhibition of ADAM17 in fibroblasts reduces stiffness and promotes vascularization following myocardial infarction
  description: Myocardial infarction (MI) triggers a complex remodelling process that leads to heat failure if uncontrolled. A Disintegrin and metalloproteinase-17 (ADAM17), a transmembrane sheddase, is upregulated in patients with ischemic cardiomyopathy, colocalized to myofibroblasts (myoFB) in the infarct tissues. Fibroblasts are key players in post-MI scar formation and exist in different states with diverse functions. Using mice with inducible Adam17 deletion in homeostatic FBs (Adam17 FB-KD ), or activated FBs (Adam17 myoFB-KD ), we found that ADAM17 loss in homeostatic FBs impaired infarct formation post-MI and increased mortality due to left ventricular (LV) rupture.

- accession: geo:GSE291962
  title: CCR8 expression on regulatory T cells reveals trajectories of tissue adaptation and protects against myocardial infarction [bulk RNA-seq]
  description: We employed single-cell RNA sequencing (scRNA-seq) in a mouse model of MI to gain a detailed analysis of heart and lymphoid Tregs, focusing on their developmental trajectories. Bulk RNA sequencing was used to further characterize the phenotype of CC motif chemokine receptor 8 positive (CCR8+) Tregs in the heart and lymph nodes. scRNA-seq of murine Tregs from the mediastinal lymph node (mLN) and heart after MI identified three Treg populations, one of which was mainly derived from the heart.

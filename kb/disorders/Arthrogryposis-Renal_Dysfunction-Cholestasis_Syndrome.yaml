inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All six infants in the original FID series were born to consanguineous
    couples, consistent with autosomal recessive inheritance of a rare founder
    or private allele. ARC-spectrum disease, to which FID belongs, is an
    established autosomal recessive disorder caused by biallelic VPS33B or
    VIPAS39 variants.
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six infants, from consanguineous marriages, with a new syndrome comprising the Fanconi syndrome, ichthyosis, musculoskeletal abnormalities, jaundice and diarrhoea"
    explanation: Consanguinity in all six index families supports recessive inheritance of the FID phenotype.
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome is a rare but fatal autosomal recessive multisystem disorder caused by mutations in the VPS33B or VIPAR gene."
    explanation: Establishes autosomal recessive inheritance for the ARC spectrum that subsumes FID.
has_subtypes:
- name: ARCS1
  display_name: ARCS1 (VPS33B-related)
  subtype_term:
    preferred_term: arthrogryposis, renal dysfunction, and cholestasis 1
    term:
      id: MONDO:0008822
      label: arthrogryposis, renal dysfunction, and cholestasis 1
  description: >
    ARC syndrome caused by biallelic VPS33B variants at 15q26.1, accounting for
    roughly three-quarters of cases. VPS33B is the Sec1/Munc18-family subunit of
    the CHEVI complex. The allelic spectrum is dominated by null variants, and no
    VPS33B protein is detectable in tissues from classical cases. Some alleles
    are associated with attenuated phenotypes and prolonged survival, but the
    functional basis is assay-dependent: c.1225+5G>C retained partial VIPAR
    interaction in a 2012 cell assay yet showed null platelet VPS33B expression
    in a 2026 sibling study.
  genes:
  - preferred_term: VPS33B
    term:
      id: hgnc:12712
      label: VPS33B
  inheritance:
  - name: Autosomal recessive
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we mapped the disease to a 7-cM interval on 15q26.1 and then identified germline mutations in the gene VPS33B in 14 kindreds with ARC"
    explanation: Establishes VPS33B as the ARCS1 disease gene.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in VPS33B are found in approximately 75% of individuals with ARC"
    explanation: Quantifies the ARCS1 share of the spectrum.
- name: ARCS2
  display_name: ARCS2 (VIPAS39/VIPAR-related)
  subtype_term:
    preferred_term: arthrogryposis, renal dysfunction, and cholestasis 2
    term:
      id: MONDO:0013255
      label: arthrogryposis, renal dysfunction, and cholestasis 2
  description: >
    ARC syndrome caused by biallelic VIPAS39 (formerly C14orf133, protein VIPAR)
    variants. VIPAR is the obligate binding partner of VPS33B within the CHEVI
    complex. The 2010 discovery cohort found VIPAS39 variants in every classical
    ARC case in which VPS33B mutation and linkage had been excluded, but that
    cohort-level result is not a universal diagnostic partition. A 2024 systematic
    review identified only eight published VIPAS39-related cases and found no
    distinct clinical differences from VPS33B-related disease, while documenting
    both severe and milder courses.
  genes:
  - preferred_term: VIPAS39
    term:
      id: hgnc:20347
      label: VIPAS39
  inheritance:
  - name: Autosomal recessive
  evidence:
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in VIPAR accounted for all cases of classical ARC in whom mutations in and linkage to VPS33B were excluded."
    explanation: Establishes VIPAS39 as the ARCS2 locus.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

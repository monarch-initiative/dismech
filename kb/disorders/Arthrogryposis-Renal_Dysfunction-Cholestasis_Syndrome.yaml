  notes: >
    VIPAS39 (formerly C14orf133, protein name VIPAR) encodes the obligate binding
    partner of VPS33B. In the 2010 discovery cohort, biallelic VIPAS39 variants
    accounted for every classical ARC case in which VPS33B mutation and linkage
    were excluded; that result is scoped to the cohort rather than asserted as a
    universal partition. The original alleles included nonsense, frameshift and
    start-codon variants, and the 2024 report expanded the spectrum with
    c.762G>A and c.1064_1082delinsAGTG. No distinct clinical differences from
    VPS33B-related disease emerged in the small 2024 systematic review.

name: Arthrogryposis-Renal Dysfunction-Cholestasis Syndrome
creation_date: "2026-08-02T00:00:00Z"
category: Mendelian
synonyms:
- ARC syndrome
- arthrogryposis, renal dysfunction, and cholestasis
- ARCS1
- ARCS2
- Fanconi-ichthyosis-dysmorphism syndrome
- FID syndrome
- Deal-Barratt-Dillon syndrome
- Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea
- Fanconi syndrome-ichthyosis-dysmorphism-jaundice-diarrhoea syndrome
description: >
  Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome is an autosomal
  recessive multisystem disorder that is usually lethal in infancy and is caused
  by biallelic loss-of-function
  variants in VPS33B (ARCS1) or its obligate partner VIPAS39/VIPAR (ARCS2).
  These two proteins form the CHEVI (class C Homologues in Endosome-Vesicle
  Interaction) tethering complex, which acts with RAB11A on the apical recycling
  endosome pathway. Loss of CHEVI function destroys apical-basolateral polarity
  in hepatocytes and renal proximal tubular cells and cripples the biogenesis of
  two specialised lysosome-related organelles - the epidermal lamellar body and
  the platelet alpha-granule. The cardinal triad is neurogenic arthrogryposis
  multiplex congenita, renal tubular dysfunction (usually renal Fanconi
  syndrome), and neonatal cholestasis with a characteristically normal or low
  serum gamma-glutamyltransferase; ichthyosis, intractable diarrhoea, severe
  failure to thrive and an alpha-granule-deficient bleeding diathesis are
  prominent; dysmorphism, central nervous system malformation and sensorineural
  deafness are variably reported. Most affected infants die within the first
  year of life, but attenuated VPS33B- and VIPAS39-related disease can survive
  into childhood, adolescence or adulthood.

  Nomenclature. This entry deliberately carries the ARC name and MONDO:0017123
  because that is the entity whose mechanism is curated here. Two historical
  clinical labels resolve into it and are retained as synonyms. The first is
  Fanconi-ichthyosis-dysmorphism (FID) syndrome, also called Deal-Barratt-Dillon
  syndrome, described in 1990 in six infants of consanguineous parentage who
  shared renal Fanconi syndrome, ichthyosis, musculoskeletal abnormalities,
  jaundice and diarrhoea, two of them with grey-platelet-like platelet
  morphology, all dead before 6 months of age. A 2001 multicentre ARC series
  concluded explicitly that this association "is part of the ARC spectrum", and
  the molecular basis was then established as VPS33B (2004) and VIPAS39 (2010).
  The FID presentation is the arthrogryposis-poor end of the spectrum:
  arthrogryposis is not obligate, and patients with complete loss-of-function
  VPS33B alleles have been reported with ichthyosis, cholestasis and renal
  dysfunction but no contractures. Note that the "Fanconi" in the FID label
  refers to the renal proximal tubulopathy, NOT to Fanconi anaemia - a
  conflation that persists in some classifications (see `discussions` and
  `notes`).

  Management is supportive; no approved disease-modifying therapy exists.
  Liver-targeted VPS33B lentiviral gene addition has rescued hepatic disease in
  a 2026 mouse study but remains preclinical and addresses neither the full
  multisystem phenotype nor VIPAS39-related disease. Liver and kidney biopsy
  carry a very high risk of fatal bleeding from the platelet alpha-granule
  defect, so molecular diagnosis is preferred over tissue sampling.

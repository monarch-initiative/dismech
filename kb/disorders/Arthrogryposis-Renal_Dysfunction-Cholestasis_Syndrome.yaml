- name: Failed Platelet Alpha-Granule Biogenesis
  biological_scale: CELLULAR
  description: >
    VPS33B colocalises with alpha-granule markers in normal megakaryocytes and is
    required to build the alpha-granule, which is a lysosome-related organelle like
    the lamellar body. Its loss produces platelets that are large, pale on blood
    films, deficient in both soluble and membrane-bound alpha-granule proteins, and
    that show compensatorily increased delta-granules. This is the mechanistic basis
    of the "grey platelet syndrome" morphology reported in two of the six original
    FID infants — a phenocopy of, not an instance of, true NBEAL2/GFI1B grey platelet
    syndrome.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  cellular_components:

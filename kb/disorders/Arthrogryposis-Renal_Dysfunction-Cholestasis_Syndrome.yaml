- name: Liver-targeted VPS33B lentiviral gene addition (preclinical only)
  description: >
    A liver-specific integrating lentiviral vector restored VPS33B and
    canalicular organization in VPS33B-knockout HepG2 cells and improved
    survival, growth, liver function, fibrosis and bile-canalicular structure in
    liver-specific Vps33b-knockout mice. This is preclinical evidence only: human
    efficacy and safety have not been studied, the approach treats hepatic rather than
    multisystem disease, and it does not replace VIPAS39 in ARCS2. A ubiquitous
    promoter vector produced liver tumors in the mouse safety arm, underscoring
    that the favorable result applies specifically to the liver-specific vector.

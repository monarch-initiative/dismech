genetic:
- name: VPS33B
  subtype: ARCS1
  gene_term:
    preferred_term: VPS33B
    term:
      id: hgnc:12712
      label: VPS33B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: approximately 75% of ARC-spectrum cases
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >
    VPS33B lies at 15q26.1 and encodes a Sec1/Munc18-family protein. The reported
    allelic spectrum is dominated by null variants — nonsense, frameshift and
    splice-site changes — with only rare missense alleles; no VPS33B protein is
    detectable in tissues from classical ARC cases. A curated locus-specific
    database (LOVD) collates known VPS33B and VIPAS39 variants. The splice variant
    c.1225+5G>C was associated with attenuated survival and retained partial
    VPS33B-VIPAR interaction in a 2012 cell assay, but a 2026 study of homozygous
    siblings found null platelet VPS33B expression and clinically relevant
    bleeding. The proposed genotype-phenotype correlation is therefore useful but
    preliminary and tissue/assay dependent. VPS33B is also
    allelic with autosomal recessive keratoderma-ichthyosis-deafness (ARKID)
    syndrome, in which missense variants impair Rab11a/Rab25 interaction and
    trafficking of the collagen-modifying enzyme LH3 without producing the full ARC
    picture. No molecular testing was available at the time of the 1990 FID report,
    so no FID proband has a confirmed genotype (see `discussions`).
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we mapped the disease to a 7-cM interval on 15q26.1 and then identified germline mutations in the gene VPS33B in 14 kindreds with ARC"
    explanation: Establishes VPS33B as causative and localises it to 15q26.1.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in VPS33B are found in approximately 75% of individuals with ARC"
    explanation: Quantifies the VPS33B share of ARC-spectrum cases.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only one (T89C; L30P) of 31 VPS33B-proven pathogenic mutations detected so far in ARC is a missense mutation"
    explanation: Documents the null-dominated allelic spectrum.
  - reference: PMID:22753090
    reference_title: "Associations among genotype, clinical phenotype, and intracellular localization of trafficking proteins in ARC syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study provides the first evidence of genotype-phenotype correlation in ARC and suggests that VPS33B c.1225+5G>C mutation predicts a mild ARC phenotype."
    explanation: Reports the initial c.1225+5G>C genotype-phenotype correlation, later qualified by tissue-specific evidence.
  - reference: PMID:41138802
    reference_title: "A novel homozygous splice-site variant in VPS33B identified as a cause of bleeding."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblotting confirmed null VPS33B expression and reduced von Willebrand factor levels."
    explanation: >
      Patient-platelet evidence that c.1225+5G>C can yield no detectable VPS33B
      in this tissue, qualifying the earlier residual-interaction assay and any
      simple equation of this genotype with uniformly mild disease.
  - reference: PMID:28017832

diagnosis:
- name: Molecular genetic testing of VPS33B and VIPAS39
  description: >
    Sequencing of VPS33B and VIPAS39 is the preferred confirmatory test and is
    explicitly safer than tissue diagnosis, because liver or kidney biopsy carries a
    substantial risk of life-threatening bleeding from the platelet alpha-granule
    defect. Limitations include turnaround time, incomplete assay coverage and
    variants of uncertain significance.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:16896922
    reference_title: "Clinical and molecular genetic features of ARC syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VPS33B mutation analysis should replace organ biopsy as a first line diagnostic test for ARC syndrome."
    explanation: Direct recommendation from the 62-patient molecular and clinical cohort.
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "along with VPS33B and VIPAR sequencing analyses constitute an apparently safer diagnostic procedure"
    explanation: >
      Recommends sequencing over biopsy as the safer diagnostic route; the sentence
      begins with a hyphen-broken word ("presenta-tions") in the cached full text, so
      the quote starts at the verifiable boundary.
- name: Peripheral blood film and platelet morphology
  description: >
    Examination of platelet morphology on a peripheral blood smear is a proposed
    low-cost screening tool: large, pale, alpha-granule-deficient platelets are
    characteristic. It must not be used to exclude bleeding risk, since routine
    platelet analysis can be normal in patients who nonetheless bleed. Assay of
    VPS33B protein expression in cultured skin fibroblasts is the paired
    non-invasive alternative.
  diagnosis_term:
    preferred_term: peripheral blood smear examination
    term:
      id: NCIT:C49286
      label: Hematology Test
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in skin fibroblasts and platelet morphology in peripheral blood smears are two alternative techniques that have"
    explanation: >
      Fragment of the review's statement that VPS33B expression in skin fibroblasts
      and platelet morphology on blood smears are proposed screening alternatives to
      biopsy; the sentence is line-wrapped in the cached full text.
  - reference: PMID:11668108
    reference_title: "ARC syndrome: an expanding range of phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood films revealed abnormally large platelets."
    explanation: Documents the blood-film finding this test detects.
- name: Serum GGT with conjugated bilirubin
  description: >
    A normal or low serum gamma-glutamyltransferase in the face of severe conjugated
    hyperbilirubinaemia is the pivotal biochemical clue that redirects a neonatal
    cholestasis workup away from biliary atresia and towards the low-GGT
    cholestases, including ARC-spectrum disease. It is a rule-in rather than a
    rule-out test: a genotype-confirmed ARC patient has been reported with
    persistently high GGT, so a raised GGT does not exclude ARC and should not stop
    the workup if the arthrogryposis / renal / cutaneous features are present.
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  evidence:
  - reference: PMID:11668108
    reference_title: "ARC syndrome: an expanding range of phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although all patients had severe cholestasis, serum gamma glutamyltransferase values were normal."
    explanation: Establishes the discriminating normal-GGT-with-severe-cholestasis pattern.
  - reference: PMID:24782640
    reference_title: "ARC syndrome with high GGT cholestasis caused by VPS33B mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "this case indicates that ARC syndrome cannot be excluded from the differential diagnosis of neonatal cholestasis even if high GGT activity is found"
    explanation: >
      Counter-evidence bounding the low-GGT rule. A genotype-confirmed ARC patient
      (compound heterozygous VPS33B c.403+2T>A / c.1509-1510insG) had a HIGH GGT on
      three consecutive tests alongside otherwise typical arthrogryposis, renal
      involvement and ichthyosis. A high GGT therefore does not exclude ARC.
- name: Skin biopsy with electron microscopy
  description: >
    Ultrastructural examination of skin shows lamellar granules entombed within
    cornified cells with normal internal granule structure — the finding that
    separates ARC-spectrum ichthyosis from CEDNIK syndrome, where the granules are
    themselves structurally abnormal. Light microscopy shows mild hyperkeratosis
    without parakeratosis. Skin is a far safer biopsy site than liver or kidney.
  diagnosis_term:
    preferred_term: skin biopsy with electron microscopy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:18347289
    reference_title: "Defective lamellar granule secretion in arthrogryposis, renal dysfunction, and cholestasis syndrome caused by a mutation in VPS33B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ultrastructural examination of the skin in ARC syndrome revealed many entombed lamellar granules in the cornified cells"
    explanation: The diagnostic ultrastructural finding on skin biopsy.
differential_diagnoses:
- name: Fanconi Renotubular Syndrome
  description: >
    The isolated renal phenotype. ARC-spectrum disease includes renal Fanconi
    syndrome as one component of a multisystem disorder, so an infant presenting
    first with proximal tubulopathy can be mistaken for isolated FRTS. The
    distinguishing move is to look for the extrarenal components — cholestasis,
    ichthyosis, contractures, platelet defect — none of which belong to FRTS.
    This is also the entity MONDO places MONDO:0022948 (the Deal-Barratt-Dillon
    stub) under, which is why the nomenclatural argument in `discussions` turns
    on it.
  distinguishing_features:
  - Isolated FRTS lacks low-GGT cholestasis, ichthyosis, neurogenic arthrogryposis and the platelet alpha-granule defect
  - Renal Fanconi syndrome in ARC-spectrum disease is one component of a CHEVI-trafficking multisystem disorder, not the whole phenotype
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a new syndrome comprising the Fanconi syndrome, ichthyosis, musculoskeletal abnormalities, jaundice and diarrhoea"
    explanation: >
      The index description presents renal Fanconi syndrome as one component of a
      multisystem association, not as isolated renotubular disease.
- name: Arthrogryposis Multiplex Congenita
  description: >
    The isolated musculoskeletal phenotype. AMC is an aetiologically
    heterogeneous endpoint of reduced fetal movement; the ARC spectrum is one
    specific neurogenic cause of it, and MONDO parents ARC under
    MONDO:0008823 arthrogryposis multiplex congenita 2, neurogenic type. An
    infant with contractures should be evaluated for the renal and hepatic
    components before AMC is called isolated.
  distinguishing_features:
  - ARC-spectrum arthrogryposis is neurogenic and accompanied by renal tubular dysfunction and low-GGT cholestasis; isolated AMC has neither
  - Arthrogryposis is not obligate in the ARC spectrum, so its absence does not exclude ARC while its presence does not establish isolated AMC
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an autosomal recessive multisystem disorder characterized by neurogenic arthrogryposis multiplex congenita"
    explanation: >
      Establishes that ARC-spectrum contractures are neurogenic AMC occurring
      within a multisystem disorder, distinguishing them from isolated AMC.
- name: Fanconi anemia
  description: >
    Not a clinical mimic but a persistent nomenclatural trap, entered through this
    entry's historical FID synonym. The "Fanconi" in Fanconi-ichthyosis-dysmorphism
    syndrome denotes renal Fanconi syndrome (proximal tubulopathy), not Fanconi
    anaemia (the DNA interstrand-crosslink repair and bone marrow failure disorder).
    The ICD-11 Foundation entry for FID both defines it as an association with
    "Fanconi anaemia" and classifies it as a child of Fanconi anaemia; MONDO instead
    places the same entity under Fanconi renotubular syndrome, which matches the
    primary literature.
  distinguishing_features:
  - ARC-spectrum disease has proximal renal tubulopathy with no reported DNA crosslinker sensitivity; Fanconi anemia is defined by chromosome breakage on diepoxybutane/mitomycin C testing
  - ARC-spectrum disease causes early-infantile death from acidosis, dehydration and sepsis; Fanconi anemia presents with progressive bone marrow failure and cancer predisposition over years
  - ARC-spectrum disease has low-GGT cholestasis and ichthyosis, neither of which is characteristic of Fanconi anemia
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a new syndrome comprising the Fanconi syndrome, ichthyosis, musculoskeletal abnormalities, jaundice and diarrhoea"
    explanation: >
      The primary description names the renal "Fanconi syndrome", not Fanconi
      anaemia, establishing which entity the eponym refers to.
- name: Progressive familial intrahepatic cholestasis
  description: >
    The low-GGT PFIC types (notably PFIC1/ATP8B1 and PFIC2/ABCB11) share severe
    conjugated hyperbilirubinaemia with normal GGT, diarrhoea and failure to thrive,
    and are the principal hepatic differential. They lack the renal Fanconi
    syndrome, ichthyosis, arthrogryposis and alpha-granule defect.
  distinguishing_features:
  - PFIC lacks renal proximal tubulopathy, ichthyosis and the platelet alpha-granule defect
  - Mechanistically related — ARC-spectrum cholestasis arises partly from mis-sorting of BSEP/ABCB11, the protein mutated in PFIC2
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "similar clinical and laboratory findings could be observed both in ARC syndrome and progressive"
    explanation: >
      States the clinical and laboratory overlap with progressive familial
      intrahepatic cholestasis; the sentence is hyphen-broken across a line in the
      cached full text, so only the verifiable fragment is quoted.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mis-sorting of some BSEP to the basolateral hepatocyte membrane was seen in the livers of individuals with ARC"
    explanation: The mechanistic link between the two entities — BSEP is the PFIC2 protein.
- name: Biliary atresia
  description: >
    The dominant differential for any infant with conjugated hyperbilirubinaemia.
    Distinguished by an elevated GGT and by hepatobiliary imaging showing obstruction;
    in ARC-spectrum disease the biliary tree is patent but intrahepatic bile flow is
    absent, and GGT is normal. Misdirection towards biliary atresia risks a
    hazardous laparotomy or biopsy in a child with a bleeding diathesis.
  distinguishing_features:
  - GGT is usually elevated in biliary atresia and normal or low in ARC-spectrum cholestasis, but a high-GGT ARC case is documented, so GGT does not reliably rule ARC out
  - Biliary tract is patent in ARC-spectrum disease despite absent intrahepatic bile flow
  evidence:
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "labeled compounds normally secreted into bile do not enter the duodenum despite biliary tract patency"
    explanation: Documents biliary patency, the anatomical feature distinguishing this from biliary atresia.
  - reference: PMID:24782640
    reference_title: "ARC syndrome with high GGT cholestasis caused by VPS33B mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "this case indicates that ARC syndrome cannot be excluded from the differential diagnosis of neonatal cholestasis even if high GGT activity is found"
    explanation: >
      Counter-evidence bounding the low-GGT rule. A genotype-confirmed ARC patient
      (compound heterozygous VPS33B c.403+2T>A / c.1509-1510insG) had a HIGH GGT on
      three consecutive tests alongside otherwise typical arthrogryposis, renal
      involvement and ichthyosis. A high GGT therefore does not exclude ARC.
- name: CEDNIK syndrome
  description: >
    Cerebral dysgenesis-neuropathy-ichthyosis-keratoderma syndrome (SNAP29) is the
    closest dermatological mimic: another SNARE-machinery disorder with ichthyosis
    from abnormal lamellar granule handling. It is distinguished ultrastructurally —
    in ARC-spectrum disease the entombed lamellar granules have normal internal
    structure, whereas in CEDNIK the granule structure itself is abnormal — and
    clinically by the absence of cholestasis and renal tubulopathy.
  distinguishing_features:
  - Lamellar granule internal structure is normal in ARC-spectrum disease and abnormal in CEDNIK
  - CEDNIK lacks low-GGT cholestasis and renal Fanconi syndrome
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lamellar granule internal structure is normal in ARC syndrome while it is abnormal in"
    explanation: >
      States the ultrastructural discriminator between the two lamellar-granule
      ichthyoses; "CEDNIK" is hyphen-broken across a line in the cached full text.
- name: Gray platelet syndrome
  description: >
    True grey platelet syndrome (NBEAL2, and the GFI1B-related form) is an isolated
    platelet alpha-granule deficiency with macrothrombocytopenia and myelofibrosis.
    Two of the six original FID infants were labelled as having "the grey platelet
    syndrome" on morphology alone; the ARC-spectrum alpha-granule defect is a
    phenocopy arising from a different trafficking lesion and is accompanied by
    multisystem disease.
  distinguishing_features:
  - Gray platelet syndrome is confined to the platelet lineage, without cholestasis, renal tubulopathy or ichthyosis
  - In the ARC spectrum, delta-granules are increased rather than normal
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two of the infants were found to have abnormal platelet morphology--the grey platelet syndrome"
    explanation: The original morphological attribution that this differential resolves.
  - reference: PMID:16123220
    reference_title: "Requirement of VPS33B, a member of the Sec1/Munc18 protein family, in megakaryocyte and platelet alpha-granule biogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated numbers of delta-granules, and completely absent alpha-granules"
    explanation: The increased delta-granule count distinguishing the ARC-spectrum platelet from classical grey platelet syndrome.
treatments:
- name: Fluid, alkali and electrolyte replacement
  description: >
    The cornerstone of care. High fluid and bicarbonate intakes are required to
    offset proximal tubular bicarbonate and solute wasting compounded by diarrhoeal
    losses; failure to keep pace results in fatal dehydration and acidosis.
    Phosphate supplementation addresses renal phosphate wasting.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid and electrolyte replacement
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Bicarbonate Wasting and Metabolic Acidosis
    treatment_effect: INHIBITS
    description: >
      Exogenous alkali offsets the obligatory renal bicarbonate loss; this
      compensates for, rather than corrects, the upstream tubular transport failure.
  - target: Volume Depletion and Dehydration
    treatment_effect: INHIBITS
    description: >

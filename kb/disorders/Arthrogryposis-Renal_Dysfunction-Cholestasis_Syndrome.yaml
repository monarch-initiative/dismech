discussions:
- discussion_id: fid_icd11_fanconi_anaemia_misparent
  kind: INTERPRETATION
  status: OPEN
  prompt: >
    Should the ICD-11 Foundation classification of Fanconi-ichthyosis-dysmorphism
    syndrome as a child of Fanconi anaemia be corrected to renal Fanconi syndrome?
  rationale: >
    The ICD-11 Foundation entity icd11f:235762608 defines FID as "the association of
    Fanconi anaemia, ichthyosis, musculo-skeletal anomalies, jaundice, and
    diarrhoea" and places it under Fanconi anaemia. The primary description
    (PMID:2206896), its MeSH synonym, and MONDO all use "Fanconi syndrome" in the
    renal proximal-tubulopathy sense; MONDO:0022948 is classified under
    MONDO:0001083 Fanconi renotubular syndrome. Nothing in the primary literature
    describes bone marrow failure, pancytopenia, chromosome breakage or cancer
    predisposition in these infants, and the molecular aetiology — biallelic
    VPS33B/VIPAS39 loss disrupting apical trafficking — has no relationship to the
    Fanconi anaemia DNA interstrand-crosslink repair pathway. The ICD-11 placement
    appears to be a homonym error between two unrelated Fanconi eponyms, and it
    propagates into any downstream system that inherits ICD-11 parentage. dismech
    records the mapping as a narrow match - the ICD-11 definition delimits the
    arthrogryposis-poor FID end of this entry's ARC spectrum - while flagging the
    parentage as incorrect.
  attaches_to:
  - pathophysiology#Proximal Tubular Apical Transport Failure
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence of a recognised metabolic disorder was found in any of the six infants"
    explanation: >
      The primary series describes a renal tubulopathy phenotype and reports no
      haematological marrow-failure disorder, contradicting the ICD-11 parentage.
- discussion_id: fid_molecular_confirmation_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Were the six original Deal-Barratt-Dillon infants molecularly VPS33B- or
    VIPAS39-deficient, and does any FID-labelled case exist that is not explained by
    CHEVI complex loss?
  rationale: >
    The 1990 FID series predates the identification of VPS33B (2004) and VIPAS39
    (2010), so no proband from that series has a confirmed genotype. The assignment
    of FID to the ARC spectrum rests on the phenotypic argument made by Eastham and
    colleagues in 2001 (PMID:11668108) plus the subsequent demonstration that
    VPS33B-null patients can lack arthrogryposis (PMID:16492441). That argument is
    strong but is not the same as molecular proof for these specific families.
    Because the assignment determines whether FID should be retired as an
    independent entity or retained as a distinct locus, the gap is worth stating
    explicitly rather than papering over.
  attaches_to:
  - pathophysiology#Biallelic Loss of VPS33B or VIPAS39 Function
  - pathophysiology#Neurogenic Arthrogryposis and Musculoskeletal Anomalies
  proposed_experiments:
  - experiment_id: fid_archival_genotyping
    name: Retrospective genotyping of archival FID material
    description: >
      Where archival DNA or fixed tissue from the 1990 Great Ormond Street cohort or
      surviving relatives can be located and consented, sequence VPS33B and VIPAS39
      (with copy-number analysis) to test directly whether the FID probands carry
      biallelic CHEVI-complex variants.
    would_support:
    - FID is a phenotypic variant of VPS33B/VIPAS39-related ARC-spectrum disease and should be retired as an independent entity
    would_refute:
    - FID represents a distinct, still-unidentified locus that phenocopies the ARC spectrum
  - experiment_id: fid_phenotype_negative_cohort_sequencing
    name: Exome/genome sequencing of ARC-phenotype, CHEVI-negative infants
    description: >
      Sequence infants presenting with renal Fanconi syndrome, low-GGT cholestasis,
      ichthyosis and diarrhoea but no VPS33B or VIPAS39 variant, to determine whether
      a third locus exists that would correspond to a genuinely separate FID entity.
    would_support:
    - A distinct FID locus exists outside the CHEVI complex
    would_refute:
    - VPS33B and VIPAS39 account for the entire phenotypic spectrum, as suggested when VIPAR mutations explained all VPS33B-negative classical ARC cases
  evidence:
  - reference: PMID:11668108
    reference_title: "ARC syndrome: an expanding range of phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of Fanconi syndrome, ichthyosis, dysmorphism, jaundice, and diarrhoea has previously been reported as a separate syndrome: our observations indicate that it is part of the ARC spectrum."
    explanation: >
      The phenotypic, pre-molecular basis on which FID was subsumed into the ARC
      spectrum — strong, but not genotype-confirmed for the FID probands themselves.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in VIPAR accounted for all cases of classical ARC in whom mutations in and linkage to VPS33B were excluded."
    explanation: >
      Evidence bearing on whether a third locus is likely: VIPAS39 closed the
      residual gap in classical ARC, arguing against an unidentified FID locus.
- discussion_id: fid_chevi_trafficking_module_candidate
  kind: CURATION_TODO
  status: OPEN
  prompt: >
    Should a "CHEVI-complex apical trafficking failure" mechanism module be factored
    out of this entry and its allelic relatives?
  rationale: >
    The mechanism curated here — CHEVI/RAB11A-dependent apical recycling failure
    producing simultaneous epithelial polarity loss and defective biogenesis of two
    lysosome-related organelles (lamellar body, platelet alpha-granule) — is shared
    across ARC syndrome, this FID presentation, and the allelic ARKID syndrome, and
    is conceptually adjacent to other lysosome-related-organelle disorders
    (Hermansky-Pudlak, Chediak-Higashi). No existing dismech module covers it: the
    `epithelial_barrier_dysfunction` and `intestinal_barrier_dysfunction` modules
    model allergic and inflammatory barrier loss, not a constitutive trafficking
    lesion. No `conforms_to` edge is asserted in this entry for that reason. If
    ARC syndrome and ARKID are curated as separate entries, a shared module becomes
    worthwhile.
  attaches_to:
  - pathophysiology#Loss of the VPS33B-VIPAR (CHEVI) Tethering Complex
  evidence:
  - reference: PMID:27555442
    reference_title: "The CHEVI tethering complex: facilitating special deliveries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "corroborate its role in the specialized delivery of cargo in different cell types"
    explanation: >
      Frames CHEVI as a general cargo-delivery mechanism operating across cell types,
      which is the recurrence criterion a dismech mechanism module requires.
- discussion_id: mondo_deal_barratt_dillon_unreconciled_stub
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Should MONDO:0022948 (Deal Barratt Dillon syndrome) be obsoleted and merged
    into, or asserted as a subclass of, MONDO:0017123 arthrogryposis-renal
    dysfunction-cholestasis syndrome?
  rationale: >
    MONDO:0022948 is an unreconciled legacy class. It has no textual definition, no
    gene association, and no OMIM xref - only Genetic and Rare Diseases
    Information Center, MEDGEN, MeSH and UMLS cross-references - and it is
    classified under MONDO:0001083 Fanconi renotubular
    syndrome. By contrast MONDO:0017123 has an Orphanet-sourced definition, an
    OMIMPS xref, and two gene-defined children (MONDO:0008822 VPS33B, MONDO:0013255
    VIPAS39). The primary literature closed this gap in 2001: PMID:11668108
    concluded that the Fanconi
    syndrome-ichthyosis-dysmorphism-jaundice-diarrhoea association "is part of the
    ARC spectrum", and the molecular basis was established in 2004 and 2010. So the
    two MONDO classes denote the same patients, one of them without any mechanistic
    grounding. dismech anchors on MONDO:0017123 and records MONDO:0022948 as a
    close match; the ontology-side fix is out of scope here but worth filing
    upstream.
  attaches_to:
  - pathophysiology#Biallelic Loss of VPS33B or VIPAS39 Function
  evidence:
  - reference: PMID:11668108
    reference_title: "ARC syndrome: an expanding range of phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of Fanconi syndrome, ichthyosis, dysmorphism, jaundice, and diarrhoea has previously been reported as a separate syndrome: our observations indicate that it is part of the ARC spectrum."
    explanation: >
      The published statement that the two labels denote one entity, which is what
      MONDO has not yet reflected in its class hierarchy.
notes: >
  Nosological status. This entry is anchored on the ARC entity (MONDO:0017123)
  because dismech is a pathograph resource: the name should correspond to the
  mechanism curated, and the mechanism here is CHEVI-complex (VPS33B/VIPAS39)
  apical-trafficking failure, which is ARC. It was originally drafted under the
  historical label Fanconi-ichthyosis-dysmorphism syndrome, seeded from ICD-11
  icd11f:235762608 and bound to MONDO:0022948; that was a mismatch between the
  bound term and the content, since MONDO:0022948 is a clinical-gestalt stub with
  no gene association. FID and Deal-Barratt-Dillon are retained as synonyms and as
  a `mappings` entry so the historical labels still resolve here. Discoverability
  by the old names is MONDO's concern, not this resource's.

  Synonyms vs mappings. The `synonyms` list is a deliberately broad lookup aid and
  is not a co-denotation claim: it carries historical labels
  (Fanconi-ichthyosis-dysmorphism syndrome, Deal-Barratt-Dillon syndrome) and
  gene-level labels (ARCS1, ARCS2) that `mappings` separately records as
  `skos:narrowMatch`, and that ARCS1/ARCS2 additionally appear in `has_subtypes`.
  Where the two disagree, `mappings` carries the formal claim and `synonyms` is
  the search surface. MONDO likewise does not list ARCS1/ARCS2 as exact synonyms
  of MONDO:0017123.

  Eponym collision. "Fanconi" in the FID label refers to renal Fanconi syndrome
  (Guido Fanconi's proximal tubulopathy), not Fanconi anaemia. The ICD-11
  Foundation entry propagates the wrong reading in both its definition and its
  parentage; see the `fid_icd11_fanconi_anaemia_misparent` discussion. MONDO's
  placement of MONDO:0022948 under Fanconi renotubular syndrome gets the homonym
  right but still does not connect it to ARC; see
  `mondo_deal_barratt_dillon_unreconciled_stub`.

  Subtypes. ARCS1 (VPS33B, MONDO:0008822) and ARCS2 (VIPAS39, MONDO:0013255) are
  curated as `has_subtypes` following MONDO's disease-series-by-gene pattern. No
  clinical differences distinguish them, so the pathograph is shared rather than
  split per subtype.

  Mortality. All six infants in the index FID series died by 6 months of age, and
  most classical ARC-spectrum infants die within the first year. This does not
  exclude attenuated courses: PMID:35281816 reports three prolonged-survival
  VPS33B cases, PMID:39736737 identifies severe and milder VIPAS39-related groups
  with some adolescent survivors, and PMID:41923461 reports an adult VPS33B case
  whose progressive liver disease required transplantation. Following repository
  convention (see Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome), mortality is
  not curated as a `phenotypes` entry, because HP:0001522 (Death in infancy) sits
  in the HPO mortality/clinical-modifier branch rather than under HP:0000118
  Phenotypic abnormality and so is outside the PhenotypeTerm enum. It is instead
  captured on the `Death in Infancy` pathophysiology node, in `progression`, and
  in `clinical_burden`.

  Evidence provenance. In the absence of a GeneReviews chapter (see "GeneReviews
  baseline" below for the check and its provenance), the phenotype baseline is
  drawn from the primary FID series (PMID:2206896), the multicentre ARC
  phenotype series that subsumed it (PMID:11668108), the two gene-discovery papers
  (PMID:15052268, PMID:20190753), and the ARC review (PMID:25239142). Several
  snippets are quoted from the full text of PMID:25239142 and PMID:20190753 rather
  than their abstracts; because that cached full text is hard-wrapped with
  hyphenated word breaks, some snippets begin or end mid-sentence at the nearest
  verifiable boundary. Each such snippet's `explanation` states what the complete
  sentence says.

  Frequency bands. VERY_FREQUENT and OCCASIONAL bands are derived from the
  six-patient ARC cohort of PMID:11668108 (6/6 for diarrhoea, febrile illness and
  failure to thrive; 5/6 for renal Fanconi syndrome; 1/6 for nephrogenic diabetes
  insipidus). These are small denominators from referral series and should be read
  as order-of-magnitude indications, not population frequencies. Phenotypes with no
  defensible denominator carry no `frequency`.

  Epidemiology. No population prevalence or incidence estimate is defensible.
  A review-derived ratio comparing ARC with biliary atresia among 90 referred
  infants with neonatal cholestasis was deliberately not encoded as incidence or
  prevalence because a referral-cohort ratio is not a population rate.

  GGT is not an absolute rule. The low/normal-GGT signature is the standard
  discriminator and is used as such throughout this entry, but PMID:24782640
  reports a genotype-confirmed ARC patient with high GGT on three consecutive
  tests. That paper is cited as PARTIAL counter-evidence on the biochemical,
  diagnosis and biliary-atresia-differential blocks so the rule is not read as
  exclusionary. The mechanism of the raised GGT in that patient is unexplained.

  GeneReviews baseline. Verified 2026-08-05 by searching the GeneReviews
  bookshelf: no dedicated chapter exists for ARC syndrome, VPS33B, VIPAS39 or the
  historical FID label. (An earlier revision of this entry asserted the same thing
  before the check had actually been run; the PR reviewer correctly flagged it as
  author-attested, and it has since been confirmed.)

  Deep research. No deep-research provider artifact underlies this entry; it was
  curated directly from primary literature (the index series, the multicentre ARC
  phenotype series, the two gene-discovery papers, and the ARC review), which is
  why there is no `research/*-deep-research-*.md` file in the change.

  Clinical trials. ClinicalTrials.gov was searched through 2026-08-05 for ARC
  syndrome, VPS33B and VIPAS39; no interventional ARC trial was identified, so
  `clinical_trials` is explicitly empty. PMID:42321174 is a preclinical cell and
  mouse study, not a clinical trial.

  Literature currency. The publication-readiness review searched the ARC, VPS33B,
  VIPAS39/VIPAR, CHEVI, natural-history and treatment literature through
  2026-08-05. It added the 2023 CHEVI structural study, 2024 ARCS2 systematic
  review, 2026 platelet, renal-cell, adult-explant and lentiviral-gene-therapy
  reports. No target-specific deep-research artifact exists; unrelated
  arthrogryposis-multiplex-congenita and PHARC artifacts were not treated as ARC
  evidence.

  Not curated. The allelic autosomal recessive keratoderma-ichthyosis-deafness
  (ARKID) syndrome, which shares the VPS33B locus but not the full ARC phenotype,
  does not yet have a dismech entry; when it is added, this entry should be
  cross-referenced from it and the shared mechanism considered for a module (see
  `fid_chevi_trafficking_module_candidate`).

mappings:
  icd11f_mappings:
  - term:
      id: icd11f:235762608
      label: Fanconi-ichthyosis-dysmorphism syndrome
    mapping_predicate: skos:narrowMatch
    mapping_justification: >-
      The ICD-11 Foundation entity for the historical FID label. Recorded as a
      narrow match now that this entry targets the ARC spectrum
      (MONDO:0017123) on the strength of PMID:11668108, which concluded the FID
      association "is part of the ARC spectrum": FID denotes the
      arthrogryposis-poor end of this entry's extension rather than the whole of
      it. The narrow match rests on that ARC-spectrum literature and not on the
      ICD-11 definition, because the ICD-11 text does not faithfully reproduce
      the original Deal-Barratt-Dillon description — it substitutes the homonym
      error, reading "the association of Fanconi anaemia, ichthyosis,
      musculo-skeletal anomalies, jaundice, and diarrhoea" where PMID:2206896
      says "the Fanconi syndrome". The ICD-11 parentage propagates the same
      misreading (see the `fid_icd11_fanconi_anaemia_misparent` discussion).
  mondo_mappings:
  - term:
      id: MONDO:0022948
      label: Deal Barratt Dillon syndrome
    mapping_predicate: skos:closeMatch
    mapping_justification: >-
      MONDO:0022948 is the historical Deal-Barratt-Dillon / FID clinical label,
      carrying "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and
      diarrhoea" as a synonym (from MESH:C538206). Deliberately recorded as a
      close rather than narrow match, unlike the ICD-11 FID class: MONDO:0022948
      is an unreconciled stub - no textual definition, no gene association, no
      OMIM xref - and it sits under MONDO:0001083 Fanconi renotubular syndrome
      rather than under MONDO:0017123, so its intended extension is not
      formally recoverable from MONDO. Asserting a hierarchical narrowMatch
      would over-claim knowledge of a class that has not been given an
      extension; closeMatch states the association without the subset claim.
      MONDO's placement does at least get the "Fanconi" homonym right. See the
      `mondo_deal_barratt_dillon_unreconciled_stub` discussion.

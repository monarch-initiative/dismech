- name: Defective Epidermal Lamellar Body Biogenesis and Secretion
  biological_scale: CELLULAR
  description: >
    Lamellar bodies (lamellar granules) are keratinocyte lysosome-related
    organelles that are normally exocytosed at the boundary between the granular
    and cornified layers, delivering the lipids that build the stratum corneum
    permeability barrier. In ARC-spectrum skin, ultrastructural examination shows
    lamellar granules entombed within cornified cells rather than secreted; their
    internal structure is normal, distinguishing the defect from CEDNIK syndrome.
    Vps33b- and Vipar-deficient mice reproduce the abnormal lamellar body
    morphology and cargo mislocalisation.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  cellular_components:
  - preferred_term: epidermal lamellar body
    modifier: ABNORMAL
    term:
      id: GO:0097209
      label: epidermal lamellar body
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:18347289
    reference_title: "Defective lamellar granule secretion in arthrogryposis, renal dysfunction, and cholestasis syndrome caused by a mutation in VPS33B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ultrastructural examination of the skin in ARC syndrome revealed many entombed lamellar granules in the cornified cells"
    explanation: Direct human ultrastructural evidence of failed lamellar granule secretion.
  - reference: PMID:29409756
    reference_title: VPS33B and VIPAR are essential for epidermal lamellar body biogenesis and function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mouse knockouts of Vps33b or Vipas39 are good models of ARC syndrome and develop an ichthyotic phenotype."
    explanation: Model-organism confirmation that the lamellar body lesion is sufficient for ichthyosis.
  downstream:

- name: Avoidance of liver and kidney biopsy
  description: >
    A management decision rather than an intervention, but arguably the highest-value
    one. Percutaneous liver or kidney biopsy carries a substantial risk of
    life-threatening or fatal bleeding because of the platelet alpha-granule defect,
    and routine platelet analysis cannot identify who is at risk. Diagnosis should
    proceed via clinical features, blood film, fibroblast VPS33B expression and
    sequencing instead.

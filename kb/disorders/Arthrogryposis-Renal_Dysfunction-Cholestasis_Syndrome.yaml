prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    ARC-spectrum disease has no accurately defined population prevalence and is
    over-represented in populations with high consanguinity rates (Saudi Arabia,
    Pakistan), with sporadic reports from Turkey, North Africa, Italy, Portugal
    and Asia. The historical FID label rests on a single 1990 series of six
    infants; no further cases were published under that name because subsequent
    cases were reported as ARC syndrome.
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe six infants, from consanguineous marriages, with a new syndrome"
    explanation: The complete published FID case series is six infants.
clinical_burden:
  burden_level: HIGH
  rationale: >
    Uniformly lethal in the index FID series — all six infants died by 6 months
    of age — and ARC-spectrum disease more broadly kills most affected infants
    within the first year of life. The burden combines multiorgan failure (renal
    solute wasting with acidosis and dehydration, cholestatic liver disease,
    malabsorptive diarrhoea, failure to thrive), a bleeding diathesis that makes
    diagnostic biopsy hazardous, recurrent sepsis, and the absence of any
    approved disease-modifying therapy.
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they required high fluid and bicarbonate intakes and all died by the age of 6 months of dehydration, acidosis and sepsis"
    explanation: Documents uniform early mortality and intensive supportive-care requirement in the FID series.
  - reference: PMID:22753090
    reference_title: "Associations among genotype, clinical phenotype, and intracellular localization of trafficking proteins in ARC syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with ARC do not survive past the first year of life."
    explanation: Confirms the high mortality burden across the ARC spectrum.
  - reference: PMID:16896922
    reference_title: "Clinical and molecular genetic features of ARC syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost half of the patients who underwent diagnostic organ biopsy (7/16) developed life-threatening haemorrhage."
    explanation: Quantifies the major iatrogenic bleeding burden in the 62-patient cohort.
progression:
- phase: Neonatal and infantile classical course
  age_range: Birth to first year of life
  notes: >
    Congenital contractures and neonatal low-GGT cholestasis are followed by
    renal solute wasting, diarrhoea, failure to thrive and recurrent illness.
    Dehydration, acidosis, sepsis or haemorrhage cause death in most classical
    cases during infancy.
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all died by the age of 6 months of dehydration, acidosis and sepsis"
    explanation: Defines the terminal course of the six-patient historical FID series.
  - reference: PMID:22753090
    reference_title: "Associations among genotype, clinical phenotype, and intracellular localization of trafficking proteins in ARC syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with ARC do not survive past the first year of life."
    explanation: Supports infancy as the dominant mortality interval across molecularly confirmed ARC.
- phase: Attenuated prolonged-survival course
  age_range: Childhood through adulthood
  notes: >
    A minority with VPS33B- or VIPAS39-related disease survives beyond infancy.
    Published courses include developmental and language delay, persistent renal
    and hepatic disease, adolescence in VIPAS39-related cases, and progressive
    cirrhosis with liver decompensation and transplantation in an adult. Residual
    CHEVI function explains some but has not been demonstrated for every survivor.
  evidence:
  - reference: PMID:35281816
    reference_title: "Mild Phenotype of Arthrogryposis, Renal Dysfunction, and Cholestasis Syndrome 1 Caused by a Novel VPS33B Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three patients studied here have a mild ARCS phenotype with prolonged survival."
    explanation: Documents prolonged survival in three VPS33B-related cases.
  - reference: PMID:39736737
    reference_title: "VIPAS39 related arthrogryposis-renal dysfunction-cholestasis syndrome-case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognostically, patients fell into severe and milder groups, with some reaching adolescence."
    explanation: Establishes severe and milder ARCS2 courses, including adolescent survival.
  - reference: PMID:41923461
    reference_title: "Histomorphological Features of a Liver Explant From an Adult With Arthrogryposis-Renal Dysfunction-Cholestasis Syndrome: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's liver dysfunction progressed to decompensation and subsequently she underwent a liver transplant."
    explanation: Documents progressive adult hepatic disease requiring transplantation.
  - reference: PMID:31479177
    reference_title: "Novel missense mutation in VPS33B is associated with isolated low gamma-glutamyltransferase cholestasis: Attenuated, incomplete phenotype of arthrogryposis, renal dysfunction, and cholestasis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these patients did not suffer the other two typical characteristics, survived much longer, and shared a novel missense VPS33B variation c.1726T>C, p.Cys576Arg"
    explanation: Documents an attenuated liver-predominant VPS33B course with prolonged survival.
pathophysiology:
- name: Biallelic Loss of VPS33B or VIPAS39 Function
  biological_scale: MOLECULAR
  description: >
    Germline biallelic loss-of-function variants in VPS33B (15q26.1) or, in
    VPS33B-negative families, in VIPAS39/VIPAR abolish production of functional
    protein. VPS33B is a Sec1/Munc18-family protein containing a Sec1-like domain
    that regulates vesicle-to-target SNARE complex formation and subsequent
    membrane fusion; VIPAR is its obligate binding partner. Nearly all reported
    VPS33B alleles are null (nonsense, frameshift, splice), and no VPS33B protein
    is detectable in tissues from classical ARC cases. VPS33B accounts for
    roughly three-quarters of ARC-spectrum cases, with VIPAS39 explaining the
    remainder.
  genes:
  - preferred_term: VPS33B
    modifier: DECREASED
    term:
      id: hgnc:12712
      label: VPS33B
  - preferred_term: VIPAS39
    modifier: DECREASED
    term:
      id: hgnc:20347
      label: VIPAS39
  molecular_functions:
  - preferred_term: syntaxin binding (Sec1/Munc18-type SNARE regulation)
    modifier: DECREASED
    term:
      id: GO:0019905
      label: syntaxin binding
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we mapped the disease to a 7-cM interval on 15q26.1 and then identified germline mutations in the gene VPS33B in 14 kindreds with ARC"
    explanation: Original identification of VPS33B as the ARC-spectrum disease gene.
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VPS33B encodes a homolog of the class C yeast vacuolar protein sorting gene, Vps33, that contains a Sec1-like domain important in the regulation of vesicle-to-target SNARE complex formation and subsequent membrane fusion."
    explanation: Defines the molecular function lost when VPS33B is inactivated.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in VIPAR (also called C14ORF133) in individuals with ARC without VPS33B defects."
    explanation: Establishes VIPAS39/VIPAR as the second ARC-spectrum locus.
  downstream:
  - target: Loss of the VPS33B-VIPAR (CHEVI) Tethering Complex
    causal_link_type: DIRECT
    description: >
      Absence of either subunit prevents assembly of the heterodimeric tethering
      complex, since the two proteins function only together.
    evidence:
    - reference: PMID:20190753
      reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that VIPAR forms a functional complex with VPS33B that interacts with RAB11A."
      explanation: Demonstrates that the two disease proteins act as one complex.
- name: Loss of the VPS33B-VIPAR (CHEVI) Tethering Complex
  biological_scale: MOLECULAR
  description: >
    VPS33B and VIPAR are the two known components of the CHEVI (class C Homologues
    in Endosome-Vesicle Interaction) complex, a metazoan endosomal tethering
    complex distinct from the better-characterised HOPS and CORVET complexes. The
    purified human assembly is approximately 315 kDa with an estimated 2:3
    VPS33B:VIPAS39 ratio and a bidirectional two-lobed architecture, rather than a
    simple 1:1 heterodimer. The complex interacts with the active, GTP-bound form
    of RAB11A, placing it on the apical recycling endosome pathway. Loss of either
    subunit therefore removes a tethering step required for delivery of specific
    cargo to apical membranes and to specialised lysosome-related organelles.
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  biological_processes:
  - preferred_term: vesicle-mediated transport (endosomal vesicle tethering)
    modifier: DECREASED
    term:
      id: GO:0016192
      label: vesicle-mediated transport
  - preferred_term: SNARE complex assembly
    modifier: DECREASED
    term:
      id: GO:0035493
      label: SNARE complex assembly
  evidence:
  - reference: PMID:27555442
    reference_title: "The CHEVI tethering complex: facilitating special deliveries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VPS33B and VIPAR comprise the two known components of the recently christened class C Homologues in Endosome-Vesicle Interaction (CHEVI) complex, thought to act as a tethering complex in endosomal trafficking distinct from the HOPS and CORVET complexes in mammalian cells."
    explanation: Names and defines the complex whose loss underlies the disease.
  - reference: PMID:37062417
    reference_title: "The Sec1-Munc18 protein VPS33B forms a uniquely bidirectional complex with VPS16B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Quantitative immunoblotting indicated a VPS33B:VPS16B ratio of 2:3."
    explanation: Defines the experimentally measured subunit ratio of purified human CHEVI.
  - reference: PMID:37062417
    reference_title: "The Sec1-Munc18 protein VPS33B forms a uniquely bidirectional complex with VPS16B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "size-exclusion chromatography-multiangle light scattering revealed a molecular weight of ∼315 kDa."
    explanation: Supports the approximate molecular mass of the purified human complex.
  - reference: PMID:37062417
    reference_title: "The Sec1-Munc18 protein VPS33B forms a uniquely bidirectional complex with VPS16B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Small-angle X-ray scattering and negative-staining EM revealed a two-lobed shape for VPS33B-VPS16B."
    explanation: Supports the bidirectional two-lobed structural model without claiming atomic-resolution structure.
  downstream:
  - target: Disrupted RAB11A-Dependent Apical Recycling and Cargo Sorting
    causal_link_type: DIRECT
    description: >
      Without CHEVI tethering, RAB11A-dependent delivery of apical cargo fails and
      cargo is diverted to the basolateral membrane or to lysosomal degradation.
    evidence:
    - reference: PMID:20190753
      reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We suggest that the VPS33B-VIPAR complex is involved in stabilization of apical membrane protein content, possibly via the RAB11A-dependent apical recycling pathway"
      explanation: Places the complex on the apical recycling pathway whose failure is the proximal cellular lesion.
  - target: Defective Epidermal Lamellar Body Biogenesis and Secretion
    causal_link_type: DIRECT
    description: >
      The same tethering function is required for the biogenesis and exocytosis of
      epidermal lamellar bodies, a lysosome-related organelle.
    evidence:
    - reference: PMID:29409756
      reference_title: VPS33B and VIPAR are essential for epidermal lamellar body biogenesis and function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "epidermal lamellar bodies, which are essential for skin barrier function, had abnormal morphology and the localisation of lamellar body cargo was disrupted"
      explanation: Links CHEVI loss directly to lamellar body failure.
  - target: Failed Platelet Alpha-Granule Biogenesis
    causal_link_type: DIRECT
    description: >
      CHEVI is likewise required for construction of the platelet alpha-granule,
      another lysosome-related organelle.
    evidence:
    - reference: PMID:16123220
      reference_title: "Requirement of VPS33B, a member of the Sec1/Munc18 protein family, in megakaryocyte and platelet alpha-granule biogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "VPS33B is involved in intracellular vesicle trafficking, being essential for the development of platelet alpha-granules but not for granule secretion"
      explanation: Assigns alpha-granule biogenesis to the same trafficking complex.
  - target: Neurogenic Arthrogryposis and Musculoskeletal Anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Arthrogryposis in this disorder is neurogenic, so CHEVI loss must reach the
      motor unit, but the intermediates are not established. No published work
      identifies the neuronal cargo, cell type, or developmental window through
      which VPS33B/VIPAS39 deficiency produces anterior horn involvement, and the
      mouse models characterised to date address the cutaneous and platelet arms
      rather than the neuromuscular one. The edge is therefore asserted as
      indirect with unknown intermediates rather than left implicit.
    evidence:
    - reference: PMID:15052268
      reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an autosomal recessive multisystem disorder characterized by neurogenic arthrogryposis multiplex congenita"
      explanation: >
        Establishes that the contractures are neurogenic and part of the same
        VPS33B-determined disorder; it does not establish the intervening mechanism.
- name: Disrupted RAB11A-Dependent Apical Recycling and Cargo Sorting
  biological_scale: CELLULAR
  description: >
    Apical membrane cargo that normally traverses RAB11A-positive apical recycling
    endosomes is mis-sorted: some proteins reach the basolateral membrane instead,
    and others (e.g., CEACAM5) are diverted into late endosomes and lysosomes for
    degradation. Cargo that bypasses the apical recycling endosome (e.g., MRP2) is
    spared, which is what makes the defect cargo-selective rather than a global
    secretory block.
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  biological_processes:
  - preferred_term: apical protein localization
    modifier: DECREASED
    term:
      id: GO:0045176
      label: apical protein localization
  - preferred_term: endosomal transport
    modifier: ABNORMAL
    term:
      id: GO:0016197
      label: endosomal transport
  genes:
  - preferred_term: ABCB11
    modifier: ABNORMAL
    term:
      id: hgnc:42
      label: ABCB11
  evidence:
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mis-sorting of some BSEP to the basolateral hepatocyte membrane was seen in the livers of individuals with ARC"
    explanation: Direct human tissue evidence of apical cargo mis-sorting.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal Ceacam5 expression was due to mis-sorting toward lysosomal degradation"
    explanation: Documents the second fate of mis-sorted apical cargo — lysosomal destruction.
  downstream:
  - target: Loss of Apical-Basolateral Epithelial Polarity
    causal_link_type: DIRECT
    description: >
      Cargo mis-sorting, compounded by transcriptional downregulation of
      E-cadherin, degrades the apical junctional complex and with it epithelial
      polarity and lumen formation.
    evidence:
    - reference: PMID:20190753
      reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Vipar- and Vps33b-deficient mouse inner medullary collecting duct (mIMDC-3) cells expressed membrane proteins abnormally and had structural and functional tight junction defects."
      explanation: Connects cargo mis-sorting to junctional and polarity failure.
- name: Loss of Apical-Basolateral Epithelial Polarity
  biological_scale: CELLULAR
  description: >
    The final shared cellular lesion in liver, kidney and gut: polarised epithelia
    can no longer establish or maintain distinct apical and basolateral membrane
    domains, and the apical junctional complexes required to build lumenal
    structures (bile canaliculi, renal tubules) are destabilised. Reduced
    E-cadherin, secondary to transcriptional downregulation rather than
    mis-sorting, contributes independently.

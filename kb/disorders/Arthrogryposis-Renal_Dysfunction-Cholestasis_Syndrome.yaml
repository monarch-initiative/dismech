    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonatal cholestasis with bile duct hypoplasia and low gamma glutamyl transpeptidase (gGT) activity"
    explanation: Defines the low-GGT cholestasis with bile duct hypoplasia characteristic of the spectrum.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "labeled compounds normally secreted into bile do not enter the duodenum despite biliary tract patency, reflecting absent or severely reduced intrahepatic bile flow"
    explanation: Demonstrates the intrahepatic, non-obstructive nature of the cholestasis.

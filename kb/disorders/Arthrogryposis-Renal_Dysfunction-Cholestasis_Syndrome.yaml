- name: Low-GGT Intrahepatic Cholestasis
  biological_scale: TISSUE
  description: >
    Non-obstructive cholestatic jaundice with a characteristically normal or low
    serum gamma-glutamyltransferase — the combination that separates ARC-spectrum
    liver disease from biliary atresia and most other neonatal cholestases.
    Radionuclide imaging shows that labelled compounds normally secreted into bile
    do not reach the duodenum despite biliary tract patency, and peripheral biliary
    radicles are hypoplastic. Histology shows intrahepatocyte pigment accumulation
    including lipofuscin, with hepatocyte giant-cell transformation.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

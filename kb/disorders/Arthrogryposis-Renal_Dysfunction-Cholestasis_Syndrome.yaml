- name: Bleeding Diathesis and Procedural Haemorrhage Risk
  biological_scale: ORGANISM
  description: >
    Self-limiting intra-abdominal haemorrhage is common, and liver or kidney biopsy
    carries a substantial bleeding risk: 7 of 16 biopsied patients in the largest
    cited cohort developed life-threatening haemorrhage, while a later review
    summarized fatal bleeding risk as greater than 50%. Critically, routine platelet
    count and morphology can be normal and therefore cannot be used to exclude the
    risk — a management trap that makes molecular rather than histological diagnosis
    the safer route.
  evidence:

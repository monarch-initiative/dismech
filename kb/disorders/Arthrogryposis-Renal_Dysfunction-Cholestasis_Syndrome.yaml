biochemical:
- name: Serum gamma-glutamyltransferase
  presence: NORMAL
  notes: >
    Usually the most useful discriminating laboratory finding, but not an absolute
    rule. Severe conjugated hyperbilirubinaemia with a NORMAL or low serum GGT
    separates ARC-spectrum cholestasis from biliary atresia, Alagille syndrome and
    most other causes of neonatal cholestasis, in which GGT is elevated, and it
    overlaps with the low-GGT PFIC types, which are the principal differential.
    Important exception: a genotype-confirmed ARC patient has been reported with a
    persistently HIGH GGT, so a raised GGT does not exclude the diagnosis.
  biomarker_term:
    preferred_term: serum gamma-glutamyltransferase (normal or low despite cholestasis)
  evidence:
  - reference: PMID:11668108
    reference_title: "ARC syndrome: an expanding range of phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although all patients had severe cholestasis, serum gamma glutamyltransferase values were normal."
    explanation: Documents normal GGT despite severe cholestasis in all cohort patients.
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonatal cholestasis with bile duct hypoplasia and low gamma glutamyl transpeptidase (gGT) activity"
    explanation: Low GGT is part of the defining biochemical signature.
  - reference: PMID:24782640
    reference_title: "ARC syndrome with high GGT cholestasis caused by VPS33B mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "this case indicates that ARC syndrome cannot be excluded from the differential diagnosis of neonatal cholestasis even if high GGT activity is found"
    explanation: >
      Counter-evidence bounding the low-GGT rule. A genotype-confirmed ARC patient
      (compound heterozygous VPS33B c.403+2T>A / c.1509-1510insG) had a HIGH GGT on
      three consecutive tests alongside otherwise typical arthrogryposis, renal
      involvement and ichthyosis. A high GGT therefore does not exclude ARC.
- name: Serum aminotransferases
  presence: INCREASED
  notes: >
    Elevated aminotransferases can accompany low-GGT cholestasis, including in
    attenuated prolonged-survival disease. This is a nonspecific liver-injury
    marker, not a discriminator for ARC.
  evidence:
  - reference: PMID:35281816
    reference_title: "Mild Phenotype of Arthrogryposis, Renal Dysfunction, and Cholestasis Syndrome 1 Caused by a Novel VPS33B Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied three patients with cholestasis, increased aminotransferases, normal gamma-glutamyl transferase, and developmental and language delay."
    explanation: Documents increased aminotransferases in three attenuated VPS33B-related cases.
- name: Platelet von Willebrand factor
  presence: DECREASED
  notes: >
    Reduced platelet von Willebrand factor was found by immunoblot in two
    c.1225+5G>C homozygous siblings. This small study supports an alpha-granule

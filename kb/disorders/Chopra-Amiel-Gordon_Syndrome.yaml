genetic:
- name: ANKRD17
  gene_term:
    preferred_term: ANKRD17
    term:
      id: hgnc:23575
      label: ANKRD17
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Definitive (ClinGen gene-disease validity, autosomal dominant)
  notes: >-
    ANKRD17 is the only known gene. Pathogenic alleles are nonsense,
    frameshift and essential-splice variants distributed along the gene, one
    recurrent frameshift (c.5360_5363del, p.Gln1787Argfs*5) in two unrelated
    individuals, missense variants at conserved ankyrin-repeat residues, and
    4q13.3 deletions spanning ANKRD17. None of the founding-cohort variants
    is a founder allele. Larger 4q13.3 deletions also remove neighboring genes
    (for example ADAMTS3, COX18, NPFFR2); the founding authors argue that ANKRD17
    loss accounts for most of the neurodevelopmental phenotype of such
    deletions. A robust genotype-phenotype correlation has not been
    established.
  evidence:
  - reference: CGGV:assertion_48a9765c-f7ae-46f4-aa6f-7fa95f81404f-2024-12-12T170000.000Z
    reference_title: "ANKRD17 / syndromic complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ANKRD17 | HGNC:23575 | syndromic complex neurodevelopmental disorder | MONDO:0800439 | AD | Definitive"
    explanation: ClinGen Intellectual Disability and Autism GCEP classifies ANKRD17 as Definitive (re-evaluated 2024-12-12).
  - reference: CGGV:assertion_48a9765c-f7ae-46f4-aa6f-7fa95f81404f-2024-12-12T170000.000Z
    reference_title: "ANKRD17 / syndromic complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ANKRD17 was first reported in relation to autosomal dominant syndromic complex neurodevelopmental disorder, also known as Chopra-Amiel-Gordon Syndrome (CAGS) (OMIM:619504), in 2021"
    explanation: ClinGen equates its curated umbrella entity with CAGS.
  - reference: PMID:33909992
    reference_title: "Heterozygous ANKRD17 loss-of-function variants cause a syndrome with intellectual disability, speech delay, and dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our work now strongly supports the possibility that haploinsufficiency of ANKRD17 is the major cause of these phenotypes in individuals with large alterations of 4q13.3."
    explanation: Links 4q13.3 deletion phenotypes to ANKRD17 dosage.
  - reference: PMID:32299451
    reference_title: "A case report of familial 4q13.3 microdeletion in three individuals with syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion includes ADAMTS3, ANKRD17, COX18, GC, and NPFFR2 protein-coding genes."
    explanation: A familial 1.56 Mb 4q13.3 deletion including ANKRD17 segregating with intellectual disability, short stature and congenital heart defect in a mother and two children.
diagnosis:
- name: Molecular Diagnosis
  description: >-
    There are no clinical diagnostic criteria; the phenotype overlaps many
    neurodevelopmental syndromes and the facial gestalt is subtle in some
    individuals. Diagnosis is established by a heterozygous pathogenic ANKRD17
    variant, usually found on exome or genome sequencing (trio analysis
    establishes de novo status); 4q13.3 deletions need copy-number analysis.
    For an ANKRD17 variant of uncertain significance, the founding authors
    suggest looking for the discriminating features (recurrent bacterial
    infections, cleft palate with Pierre Robin sequence, unilateral renal
    agenesis), while noting they occur in a minority.
  evidence:
  - reference: PMID:36548456
    reference_title: "ANKRD17-Related Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ANKRD17-related neurodevelopmental syndrome is established in a proband with a heterozygous pathogenic variant in ANKRD17 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:33909992
    reference_title: "Heterozygous ANKRD17 loss-of-function variants cause a syndrome with intellectual disability, speech delay, and dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although recurrent bacterial infections, cleft palate with Pierre Robin sequence, and unilateral renal agenesis are useful discriminating features, they occur in only a minority of patients."
    explanation: Features that can support variant interpretation.
  - reference: PMID:33909992
    reference_title: "Heterozygous ANKRD17 loss-of-function variants cause a syndrome with intellectual disability, speech delay, and dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of dysmorphism was variable, with several individuals (particularly individuals 8 and 10) presenting with only subtle dysmorphic characteristics."
    explanation: Facial gestalt alone is not diagnostic.

- name: Ankyrin Repeat Destabilization by Missense Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Nine of 32 founding-cohort probands carried de novo missense variants and
    one an in-frame indel, all at highly conserved residues. Five of the seven
    missense variants inside the ankyrin repeats alter positions that are
    invariant across all 25 ANKRD17 repeats (the 6th/21st leucines of the
    hydrophobic core and the 13th glycine of the inter-helix turn). Homology
    modeling predicts these destabilize the repeat fold rather than a specific
    binding surface, which would reduce functional protein and converge on
    haploinsufficiency. No functional assay of any missense allele has been
    published, so a dominant-negative or other effect is not excluded.

name: Chopra-Amiel-Gordon Syndrome
creation_date: "2026-09-23T19:52:59Z"
description: >-
  An autosomal dominant neurodevelopmental syndrome caused by heterozygous
  germline pathogenic variants in ANKRD17 (4q13.3), which encodes a large
  ankyrin-repeat and KH-domain protein of the Mask family. Most pathogenic
  variants arise de novo. The core phenotype is global developmental delay or
  intellectual disability of variable severity (borderline to severe) with
  disproportionate impairment of speech and expressive language, evident from
  infancy. Additional features include motor delay, postnatal growth failure,
  feeding difficulties, autism spectrum disorder and ADHD, epilepsy (often with
  onset before 2 years) and EEG abnormalities, non-specific brain MRI findings,
  gait or balance disturbance, recurrent, mostly bacterial, upper and lower
  respiratory and middle-ear infections, joint hypermobility and ophthalmological
  abnormalities (strabismus, refractive error). Many individuals share a facial
  gestalt of triangular face, high anterior hairline, deep-set or almond-shaped
  eyes with periorbital fullness, thick nasal alae with flared nostrils, full
  cheeks and a thin upper lip. Cleft palate with Pierre Robin sequence, unilateral
  renal agenesis and scoliosis are rare but distinctive. The mutational spectrum
  (truncating and essential-splice variants, 4q13.3 deletions spanning the gene,
  and missense variants predicted to destabilize the ankyrin-repeat fold) points
  to haploinsufficiency; how reduced ANKRD17 dosage produces the
  neurodevelopmental phenotype is not established.
category: Mendelian
synonyms:
- ANKRD17-related neurodevelopmental syndrome
- ANKRD17-related neurodevelopmental disorder
- CAGS
- Global developmental delay-recurrent infections-facial dysmorphism syndrome
parents:
- autosomal dominant syndromic intellectual disability
- syndromic complex neurodevelopmental disorder

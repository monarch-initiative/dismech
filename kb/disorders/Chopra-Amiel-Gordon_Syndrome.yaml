- name: Impaired Innate Immune Pattern-Recognition Signaling
  biological_scale: CELLULAR
  role: hypothesized_intermediate
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In cell lines ANKRD17 binds NOD2 and contributes to NOD1- and NOD2-mediated
    pro-inflammatory responses to bacteria, and separately binds RIG-I, MDA5 and
    VISA to enhance RIG-I-like receptor antiviral signaling. The founding
    authors propose these roles as a plausible basis for the recurrent,
    mostly bacterial, infections seen in about a third of patients. Immunology
    assessments in five patients found no obvious immunodeficiency, and no
    innate-immune assay has been done in patient cells.

  biological_scale: TISSUE
  role: outcome
  mechanism_confidence: PROVISIONAL
  description: >-
    Structural brain findings on MRI are present in about half of imaged
    patients but are heterogeneous (reduced white matter volume, thin corpus
    callosum, optic nerve hypoplasia, periventricular nodular heterotopia,
    focal hyperintensities, cysts); one deleted fetus had cerebellar
    hypoplasia. There is no consistent malformation pattern and no study
    linking a specific molecular step to any of them.

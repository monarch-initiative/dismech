animal_models:
- name: Ankrd17 null mouse
  species: Mouse
  genotype: Ankrd17 targeted null (homozygous and heterozygous)
  publication: PMID:19619540
  description: >-
    Constitutive gene-targeted Ankrd17 knockout. Homozygous embryos die at
    E10.5-E11.5 with hemorrhage and a marked reduction of vascular smooth
    muscle cells around vessels; heterozygotes are viable and fertile. The
    embryonic lethality precluded study of brain development, and no
    behavioral or neurodevelopmental phenotype has been reported for
    heterozygotes.
  modeled_mechanisms:
  - target: ANKRD17 Haploinsufficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model informs the essential role of Ankrd17 in embryonic vascular
      maturation, not the heterozygous human neurodevelopmental disorder.
    limitations: >-
      The informative genotype is homozygous null, which has no human
      counterpart; heterozygotes, the human-equivalent genotype, were not
      assessed for neurodevelopmental or behavioral phenotypes, and no
      vascular phenotype has been established in patients.
    evidence:
    - reference: PMID:19619540
      reference_title: "Ankrd17, an ubiquitously expressed ankyrin factor, is essential for the vascular integrity during embryogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Ankrd17-deficient mice died between embryonic day (E) 10.5 and E11.5 due to cardiovascular defects."
      explanation: Homozygous lethality from cardiovascular defects.
    - reference: PMID:33909992
      reference_title: "Heterozygous ANKRD17 loss-of-function variants cause a syndrome with intellectual disability, speech delay, and dysmorphism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Given the early embryonic death of the knockout mice, central nervous system development was not studied."
      explanation: The model could not address the neurodevelopmental phenotype.
- name: Regional Ankrd17 AAV-shRNA knockdown mouse
  species: Mouse
  genotype: AAV-delivered Ankrd17 shRNA in medial prefrontal cortex or hippocampal CA1 of wild-type C57BL/6J males
  publication: PMID:40604385
  description: >-
    Stereotaxic AAV delivery of tandem Ankrd17 siRNAs under a neuronal
    promoter into the medial prefrontal cortex or hippocampal CA1 of 4-5
    week-old male mice, reducing Ankrd17 protein to roughly 53-72% of control.
  modeled_mechanisms:
  - target: Synaptic Protein Deficit and Neural Circuit Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Partial Ankrd17 reduction in juvenile cortex or hippocampus reduces
      synaptic proteins and neuronal activation and produces social, anxiety
      and spatial-memory deficits.
    limitations: >-
      Knockdown is regional, neuronal and begins after brain development, so
      it does not model germline heterozygosity from conception, effects on
      neural progenitors, or non-neural features. Only males were studied, and
      the study has not been replicated.
    readouts:
    - name: Synaptic protein levels
      target: Synaptic Protein Deficit and Neural Circuit Dysfunction
      direction: DECREASED
      interpretation: GluN2A, GluA1, PSD-95 and synapsin I reduced in both regions.
      evidence:
      - reference: PMID:40604385
        reference_title: "Novel ANKRD17 variants implicate synaptic and mitochondrial disruptions in intellectual disability and autism spectrum disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our findings revealed a decrease in the expression of the NMDAR subunit GluN2A, the AMPAR subunit GluA1, the excitatory synaptic scaffolding protein PSD-95 and Synapsin I"
        explanation: Western blot readout in knockdown mice.
    evidence:
    - reference: PMID:40604385
      reference_title: "Novel ANKRD17 variants implicate synaptic and mitochondrial disruptions in intellectual disability and autism spectrum disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results effectively mimic the heterozygous deficiency of ANKRD17 in mice."
      explanation: The authors' rationale that partial knockdown approximates heterozygous deficiency.
mechanistic_hypotheses:
- hypothesis_group_id: ankrd17_hippo_yap
  hypothesis_label: Reduced ANKRD17 impairs YAP-dependent neural progenitor growth signaling
  status: EMERGING
  description: >-
    ANKRD17 is a Mask-family co-factor that promotes YAP nuclear import and
    stability, and it is co-expressed with YAP1 in fetal human radial glia. The
    hypothesis is that reduced ANKRD17 lowers YAP activity in neural
    progenitors and so contributes to the neurodevelopmental phenotype. It
    rests on Drosophila genetics, mammalian cell-line work and expression
    data; it has not been tested in ANKRD17-deficient neural tissue.
  evidence:
  - reference: PMID:33909992
    reference_title: "Heterozygous ANKRD17 loss-of-function variants cause a syndrome with intellectual disability, speech delay, and dysmorphism."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "raising the possibility that the neurodevelopmental phenotypes associated with ANKRD17 variants may be due to disruption of this pathway"
    explanation: The founding authors' statement of the hypothesis.
- hypothesis_group_id: ankrd17_synaptic_mitochondrial
  hypothesis_label: ANKRD17 deficiency impairs synaptic protein composition and mitochondrial function
  status: EMERGING
  description: >-
    Based on one study combining regional knockdown in juvenile mouse brain
    with proteomics of one ANKRD17-deleted fetal cortex, ANKRD17 deficiency is
    proposed to reduce excitatory synaptic proteins and mitochondrial
    respiratory proteins, contributing to intellectual disability and autism.
  evidence:
  - reference: PMID:40604385
    reference_title: "Novel ANKRD17 variants implicate synaptic and mitochondrial disruptions in intellectual disability and autism spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, our studies suggest dysregulation of synaptic proteins and mitochondrial function, along with impaired neural circuits following Ankrd17 knockdown."
    explanation: Statement of the hypothesis from the knockdown study.
- hypothesis_group_id: ankrd17_innate_immunity
  hypothesis_label: Reduced ANKRD17 weakens NOD1/NOD2 and RIG-I-like receptor signaling, predisposing to infection
  status: EMERGING
  description: >-
    Cell-line studies place ANKRD17 in NOD1/NOD2 antibacterial and RIG-I-like
    receptor antiviral signaling; the founding authors propose this as the
    basis of recurrent infections. Not tested in patient cells.
  evidence:
  - reference: PMID:23711367
    reference_title: "A role for the Ankyrin repeat containing protein Ankrd17 in Nod1- and Nod2-mediated inflammatory responses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, this reveals a novel function for Ankrd17 in anti-bacterial innate immune pathways."
    explanation: Cell-line basis for the immune hypothesis.
discussions:
- discussion_id: mismatch_ankrd17_null_mouse_vascular
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  - phenotypes#Intracranial Aneurysm
  prompt: >-
    Homozygous Ankrd17-null mice die of hemorrhage from failed vascular
    maturation, yet no vascular features were found in the 34-person founding
    cohort. Does heterozygous ANKRD17 loss confer any vascular risk in humans,
    as the single neonatal ruptured-aneurysm case might suggest?
  rationale: >-
    The mouse phenotype reflects complete loss, which has no human
    counterpart, and heterozygous mice were not phenotyped in detail. A single
    human aneurysm case with a missense variant cannot establish an
    association, and ClinGen records its significance as unclear. Whether
    vascular imaging belongs in surveillance depends on the answer.
  proposed_experiments:
  - experiment_id: exp_ankrd17_heterozygous_mouse_vasculature
    name: Vascular phenotyping of Ankrd17 heterozygous mice
    description: >-
      Examine cerebral and systemic arterial wall structure, smooth muscle
      coverage and aneurysm formation in aging Ankrd17 heterozygous mice.
  - experiment_id: exp_ankrd17_cohort_vascular_imaging
    name: Systematic vascular review in the natural history cohort
    description: >-
      Review MRI/MRA and clinical vascular events in the NCT05528744
      natural history cohort to estimate whether cerebrovascular disease is
      enriched.
- discussion_id: mismatch_ankrd17_hippo_yap_model_systems
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disrupted YAP Nuclear Import in Neural Progenitors
  - mechanistic_hypotheses#ankrd17_hippo_yap
  prompt: >-
    The Mask/Yorkie requirement is established in Drosophila and YAP nuclear
    import in immortalized mammalian cell lines. Does reduced ANKRD17 dosage
    actually lower YAP-dependent signaling in human neural progenitors, where
    the syndrome originates?
  rationale: >-
    Every functional step in this hypothesis comes from a system that is not
    human neural tissue: fly tissue-growth genetics and cell-line
    overexpression or knockdown. The only human data are expression, namely
    that ANKRD17 and YAP1 are co-expressed in fetal radial glia, which
    establishes opportunity rather than dependence. The paralog ANKHD1 also
    binds YAP and could buffer the pathway differently in human progenitors
    than in either model. If reduced ANKRD17 does not lower YAP activity in
    human neural cells, this node and its hypothesis group are describing a
    conserved biochemical activity that is not the disease mechanism.
  proposed_experiments:
  - experiment_id: exp_ankrd17_yap_human_neural_progenitors
    name: YAP localization and activity in ANKRD17-haploinsufficient human neural progenitors
    description: >-
      In patient-derived or isogenic ANKRD17 heterozygous iPSC-derived neural
      progenitors and cortical organoids, measure nuclear versus cytoplasmic
      YAP, YAP target-gene expression, and progenitor proliferation against
      isogenic controls, with ANKHD1 dosage manipulated separately to test
      paralog buffering.
    perturbations:
    - name: Heterozygous ANKRD17 loss in human neural progenitors
      target: pathophysiology#ANKRD17 Haploinsufficiency
    readouts:
    - name: Nuclear YAP and YAP target-gene activity
      target: pathophysiology#Disrupted YAP Nuclear Import in Neural Progenitors
      direction: DECREASED
      interpretation: >-
        Reduced nuclear YAP and target-gene output in the haploinsufficient
        progenitors would support the pathway step in human cells; no change
        would refute it.
    would_support:
    - pathophysiology#Disrupted YAP Nuclear Import in Neural Progenitors
    supporting_outcome:
    - >-
      Nuclear YAP and YAP target-gene expression are reduced in ANKRD17
      haploinsufficient human neural progenitors relative to isogenic controls.
    would_refute:
    - pathophysiology#Disrupted YAP Nuclear Import in Neural Progenitors
    refuting_outcome:
    - >-
      YAP localization, target-gene output and progenitor proliferation are
      unchanged despite halved ANKRD17, indicating the pathway is buffered in
      human neural cells.
  evidence:
  - reference: PMID:31661072
    reference_title: "Mask family proteins ANKHD1 and ANKRD17 regulate YAP nuclear import and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mammalian Mask1/2 proteins also promote nuclear import of YAP, as well as stabilising YAP and driving formation of liquid droplets."
    explanation: >-
      The mammalian evidence for the pathway step is cell-line work, not
      neural tissue, which is the mismatch this discussion records.
- discussion_id: gap_ankrd17_genotype_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Ankyrin Repeat Destabilization by Missense Variants
  - pathophysiology#ANKRD17 Haploinsufficiency
  prompt: >-
    Do ANKRD17 missense variants act only by destabilizing the protein, and do
    they produce a different severity from truncating alleles?
  rationale: >-
    Missense pathogenicity rests on conservation and homology modeling alone,
    with no protein-level assay. A later report stated that a genotype-phenotype
    correlation could not yet be established. If some missense alleles are not
    simple loss of function, variant interpretation and the single-mechanism
    model in this entry would need revision.
  evidence:
  - reference: PMID:40604385
    reference_title: "Novel ANKRD17 variants implicate synaptic and mitochondrial disruptions in intellectual disability and autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight the difficulty of establishing a clear genotype–phenotype correlation and underscore the need for larger cohort studies to identify potential trends."
    explanation: Genotype-phenotype correlation remains unresolved.
  proposed_experiments:
  - experiment_id: exp_ankrd17_missense_stability
    name: Protein stability assay of patient missense alleles
    description: >-
      Express patient missense and in-frame variants and measure protein
      half-life and steady-state level against wild type and a truncating
      control; test effect on YAP nuclear localization.
notes: >-
  LUMP/SPLIT. This is a single Disease entry for ANKRD17-related
  neurodevelopmental syndrome (MONDO:0859186, OMIM 619504). No subtypes are
  declared: missense and truncating alleles are presented in the literature as
  one disorder with a shared haploinsufficiency mechanism, and no reproducible
  genotype-phenotype split has been published. Small 4q13.3 deletions that
  remove ANKRD17 are included because the founding cohort itself includes one
  and attributes the phenotype to ANKRD17 loss, but larger contiguous 4q13.3
  deletions remove other genes (ADAMTS3, COX18, NPFFR2 and others) and may carry
  additional features, such as the congenital heart defects in the familial
  1.56 Mb deletion; those deletions are not treated as a separate entry here.
  ClinGen curated the gene against the umbrella term syndromic complex
  neurodevelopmental disorder (MONDO:0800439), recorded in mappings as a
  broader match; its dosage curation uses syndromic intellectual disability
  (MONDO:0000508).

  STRUCTURED SOURCES. Orphanet ORPHA:717823 ("Global developmental
  delay-recurrent infections-facial dysmorphism syndrome") is the same entity,
  exact-mapped to OMIM 619504; the Orphadata record used here carries names
  and cross-references only, with no phenotype or epidemiology annotation.
  GeneReviews (PMID:36548456) is cited from its PubMed abstract; the chapter's
  full clinical tables were not available in the reference cache, so
  frequencies come from the founding cohort (PMID:33909992). A 2025 conference
  abstract describing a larger genotype-phenotype cohort and an epilepsy
  analysis of a further cohort could not be retrieved as text and are not
  used; their figures (including a higher epilepsy frequency) are unverified.

  SINGLE-CASE FINDINGS NOT CURATED AS PHENOTYPES. A de novo missense variant of
  uncertain significance (p.His2593Pro) in a girl with severe developmental
  delay, bilateral microphthalmia with coloboma, periventricular heterotopia,
  clubfoot and vigabatrin-responsive epileptic spasms (PMID:37456926), transient
  tics in a boy with a splice variant (PMID:39315309), and multiple congenital
  anomalies with cerebellar hypoplasia in a fetus with a 4q13.3 deletion
  (PMID:40604385) are single observations and are not added as phenotypes.

  CLUBFOOT. Clubfoot has now been reported in two unrelated individuals with a
  de novo ANKRD17 variant: the girl in PMID:37456926, and one of 38 fetuses in
  a prenatal exome series for isolated sonographic clubfoot, in which ANKRD17
  was one of four genes carrying a pathogenic or likely pathogenic de novo
  variant (PMID:36326072). It is not curated as a phenotype here. That series
  selected its subjects on clubfoot, so it can establish neither a frequency
  nor the direction of the association, it reports no variant, no other
  clinical features and no postnatal follow-up for the ANKRD17 fetus, and
  clubfoot appears in neither the 34-person founding cohort nor GeneReviews.
  Two ascertainment-biased observations are a lead for the next cohort report
  rather than a syndrome feature.

  MODULES. No mechanism module was conformed to. The two closest candidates in
  kb/modules/ were read and rejected on their own stated scope:
  excitatory_synapse_scaffold_disruption is scoped to postsynaptic-density
  scaffold and scaffold-regulatory proteins such as SHANK3 and SYNGAP1, and
  ANKRD17 is not one, while the only synaptic-protein evidence here comes from
  a single regional knockdown study; epigenetic_machinery_neurodevelopmental_dysregulation
  is scoped to lesions in proteins that write, erase, read or remodel
  chromatin, and ANKRD17 is an ankyrin-repeat and KH-domain protein with no
  established chromatin-machinery role. No module in kb/modules/ models
  Hippo/YAP signaling in neurodevelopment: the only two modules that reference
  YAP are evading_growth_suppressors and cdk46_inhibitor_resistance, both of
  which model oncogenic growth control rather than neural development.

- name: Disrupted YAP Nuclear Import in Neural Progenitors
  biological_scale: MOLECULAR
  role: hypothesized_intermediate
  mechanism_confidence: HYPOTHETICAL
  description: >-
    ANKRD17 (Mask2) and its paralog ANKHD1 (Mask1) bind YAP and promote its
    nuclear import and stability in mammalian cells, and the Drosophila ortholog
    Mask is required for Yorkie-driven tissue growth. YAP1 and ANKRD17 are
    co-expressed in fetal human radial glia. That reduced ANKRD17 lowers
    nuclear YAP activity in neural progenitors, and that this contributes to the
    neurodevelopmental or growth phenotype, is a hypothesis raised by the
    founding authors; it has not been tested in ANKRD17-deficient human or
    mammalian neural tissue.

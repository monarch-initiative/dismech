pathophysiology:
- name: ANKRD17 Haploinsufficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous germline ANKRD17 variant reduces functional ANKRD17 dosage.
    In the founding cohort 22 of 32 probands carried a variant expected to cause
    loss of function (7 nonsense, 12 frameshift, 2 essential splice site, and a
    1.16 Mb 4q13.3 deletion including ANKRD17); later reports add a second
    4q13.3 deletion removing exons 2-34 and a canonical splice variant shown on
    RNA to skip exon 32. ANKRD17 is highly constrained against loss-of-function
    variation in the population, and ClinGen scores it as haploinsufficient.
    In one proband with a de novo nonsense variant (p.Arg418*), ANKRD17 protein
    in peripheral blood was about half the parental level.

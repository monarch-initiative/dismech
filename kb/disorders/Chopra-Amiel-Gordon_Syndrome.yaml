  expressivity: VARIABLE
  de_novo_rate: 29 of 34 individuals in the founding cohort
  description: >-
    Heterozygous ANKRD17 pathogenic variants cause disease in an autosomal
    dominant manner, typically de novo. In the founding cohort the variant was
    confirmed de novo in 29 of 34 individuals; one truncating variant was
    transmitted from a mother with borderline intellectual functioning to her
    son, and one nonsense variant was present at low level (about 4% of reads)
    in the blood of a healthy, non-dysmorphic father, consistent with parental
    somatic and possibly germline mosaicism. GeneReviews therefore describes the
    recurrence risk to sibs of a proband with an apparently de novo variant as
    low but above the population risk. Expressivity is variable, including
    between a transmitting parent and child; no formal penetrance estimate has
    been published.

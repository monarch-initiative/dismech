    in five. Focal seizures with secondary generalization were the most common
    type (five individuals); single individuals had Lennox-Gastaut syndrome,
    tonic seizures, mixed myoclonic and tonic-clonic, or tonic-clonic and
    absence seizures. Five were well controlled on three or fewer
    anti-seizure medications and two had refractory epilepsy for at least part
    of their course. Epileptic spasms responsive to vigabatrin were reported in
    a later individual with a de novo missense variant of uncertain
    significance.

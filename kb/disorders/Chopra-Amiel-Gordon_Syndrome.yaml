- name: Synaptic Protein Deficit and Neural Circuit Dysfunction
  biological_scale: CELLULAR
  role: hypothesized_intermediate
  mechanism_confidence: HYPOTHETICAL
  description: >-
    After AAV-shRNA knockdown of Ankrd17 in the medial prefrontal cortex or
    hippocampal CA1 of juvenile mice, the NMDA-receptor subunit GluN2A, the
    AMPA-receptor subunit GluA1, PSD-95 and synapsin I were reduced, fewer
    excitatory neurons were activated during behavioral testing, and
    mitochondrial genes (Sdha, Sdhb, Sdhc, Ogdh, Akr1a1) were down-regulated;
    the mice showed reduced sociability, increased anxiety and impaired spatial
    memory. Proteomics of cortex from one ANKRD17-deleted fetus against one
    control fetus showed down-regulation of mitochondrial proteins. The model
    is a regional, postnatal knockdown rather than germline heterozygosity, and
    the human proteomic comparison is one case against one control, so this
    node is a hypothesis for the cognitive and social phenotype, not an
    established mechanism.

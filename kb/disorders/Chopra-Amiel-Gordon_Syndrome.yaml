- name: Reduced ANKRD17 in Developing Neural Progenitors and Neurons
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    In single-cell RNA-seq of the fetal human telencephalon ANKRD17 is broadly
    expressed, including in radial glial progenitors, excitatory neurons and
    interneurons, whereas its paralog ANKHD1 is more restricted, so the paralog
    may not compensate in the developing cortex. In adult mouse brain ANKRD17 is
    expressed in excitatory and inhibitory neurons. Which of ANKRD17's reported
    molecular activities (Hippo/YAP co-factor, cyclin E/CDK2 interaction, RNA
    binding through the KH domain) is dosage-critical in these cells is not
    known.

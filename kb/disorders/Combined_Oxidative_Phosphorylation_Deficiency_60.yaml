- name: Mitochondrial Energy Failure in High-Demand Tissues
  conforms_to: "mitochondrial_translation_deficiency#Tissue-Selective Energy Failure"
  biological_scale: TISSUE
  description: >-
    The tissues affected (cochlea, ovary, cerebral white matter and globus pallidus, retina,
    kidney) are energy-dependent tissues commonly hit in mitochondrial translation disorders.
    Why a given patient has some of these and not others is unexplained: the two families
    homozygous for p.His92Pro share a founder haplotype, yet one has Perrault syndrome and the
    other neither hearing loss nor ovarian failure. The authors propose an unidentified genetic
    modifier. MRPL49 protein was detected in mitochondria of mouse cochlear hair cells and
    supporting cells, which fits but does not explain the hearing phenotype.
  evidence:
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We infer an undefined genetic modifier underpinning these phenotypic differences."
    explanation: Records that the tissue pattern varies between families with the same genotype for an unknown reason.
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MRPL49 was observed in the mitochondria in the outer hair cells, inner hair cells, and supporting cells, consistent with a role in hearing function"
    explanation: Localises mL49 to the cochlear cells whose dysfunction would cause sensorineural hearing loss.
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Energy failure in cochlear hair cells or supporting cells is the presumed route; the
      cochlear lesion has not been studied in patients or animals.
  - target: Premature ovarian insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ovarian failure is shared with the other mitochondrial causes of Perrault syndrome; the
      ovarian cell type affected has not been studied for MRPL49.
  - target: Leukodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progressive white matter and pallidal disease is the consistent neurological lesion; the
      intermediate cellular events are unknown.

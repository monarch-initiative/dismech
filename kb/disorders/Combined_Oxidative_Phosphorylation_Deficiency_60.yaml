- name: Combined Complex I and IV Deficiency
  conforms_to:
  - "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  - "primary_oxphos_deficiency#OXPHOS Complex Deficiency"
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts showed lower complex I and complex IV content and reduced respiratory
    supercomplexes, with free complex III accumulating; complex II, which has no mtDNA-encoded
    subunit, was spared or only slightly reduced. The defect was larger in the more severely
    affected individual, and standard enzyme assays and western blots detected it less reliably
    than complexome profiling. No muscle or other tissue has been studied.

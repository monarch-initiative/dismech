  - "primary_oxphos_deficiency#Mitochondrial Translation Defect"
  biological_scale: CELLULAR
  description: >-
    A reduced rate of synthesis of the mtDNA-encoded respiratory chain subunits is the inferred
    link between mitoribosome loss and the combined complex I and IV deficiency. No direct
    measurement of mitochondrial translation in MRPL49 patient cells has been published, so this
    node rests on the mitoribosome and OXPHOS data on either side of it.

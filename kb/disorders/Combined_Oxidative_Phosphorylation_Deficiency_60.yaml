      snippet: "These data demonstrate that the missense variants reduce 16S rRNA levels, consistent with the mechanism of other mt-LSU-associated disorders"
      explanation: The authors attribute the reduced 16S rRNA in patient cells to the missense variants.
- name: Reduced 16S rRNA and Mitoribosome Content
  biological_scale: MOLECULAR
  description: >-
    Fibroblasts from the two families tested had significantly less 16S rRNA than controls.
    Complexome profiling showed reduced large-subunit (about 60 and 70 percent lower) and
    small-subunit (about 15 and 40 percent lower) content, more marked in the more severely
    affected individual. Subunit components migrated normally and no assembly intermediates
    accumulated, so the authors propose reduced stability and degradation of the large subunit
    rather than an assembly block. Only two patient fibroblast lines have been studied.

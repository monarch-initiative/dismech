  notes: >-
    The founding report describes affected individuals from nine unrelated families of Pakistani,
    Indian, Turkish, Iranian, Saudi Arabian and Northern European ancestry, plus a further Turkish
    woman previously reported with a PANX1 diagnosis who was homozygous for the recurrent MRPL49
    p.Arg88Cys allele. A single Iranian case report (PMID:40715997) has no abstract and is not
    quoted here. No population prevalence or carrier frequency has been published.

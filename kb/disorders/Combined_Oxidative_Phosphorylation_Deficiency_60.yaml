    explanation: The founding report's case count, nine families, is the whole published series.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    All affected individuals carried biallelic MRPL49 variants, homozygous in most families and
    compound heterozygous in one. Parents tested in the index family were unaffected heterozygous
    carriers, and most families were consanguineous.

name: Combined Oxidative Phosphorylation Deficiency 60
category: Mendelian
creation_date: "2026-10-31T00:00:00Z"
synonyms:
- COXPD60
- combined oxidative phosphorylation deficiency type 60
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 60
  term:
    id: MONDO:0978298
    label: combined oxidative phosphorylation deficiency 60
description: >-
  COXPD60 (OMIM 621195) is the combined oxidative phosphorylation deficiency caused by biallelic
  variants in MRPL49, the nuclear gene for mL49, a protein of the large (39S) subunit of the
  mitochondrial ribosome. The disease was defined in 2025 from nine unrelated families. Three
  missense alleles altering arginine 88 or histidine 92, in a loop that contacts the 16S rRNA,
  account for all but one allele. Patient fibroblasts have less 16S rRNA, fewer large and small
  mitoribosomal subunits without a detectable assembly block, and reduced complexes I and IV.

  The clinical range is wide. At the mild end it is Perrault syndrome: sensorineural hearing loss
  with primary ovarian insufficiency in females. At the severe end it is a childhood-onset
  progressive leukoencephalopathy with symmetrical globus pallidus signal change, learning
  disability, microcephaly and retinal dystrophy. One adult deteriorated with refractory epilepsy
  and psychosis and died. Hypoglycaemia, raised lactate and renal disease occur in some
  individuals, but cardiomyopathy and liver disease, common in other mitoribosomal large-subunit
  disorders, were not reported.
parents:

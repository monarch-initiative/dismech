    explanation: Places the disease residues at the mL49 to 16S rRNA interface in the mitoribosome structure.
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This prediction of lethality of an MRPL49 knockout aligns with our data that the disease-associated variants are hypomorphic, evidenced by the reduced levels of MRPL49 in complexome profiling of fibroblasts from affected individuals."
    explanation: Reduced mL49 in patient fibroblasts supports partial rather than complete loss of function.
  downstream:
  - target: Reduced 16S rRNA and Mitoribosome Content
    causal_link_type: DIRECT
    description: >-
      Substitutions in the rRNA-contacting loop are proposed to destabilise the large subunit,
      lowering 16S rRNA and mitoribosome levels.
    evidence:
    - reference: PMID:40043708
      reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
      supports: SUPPORT

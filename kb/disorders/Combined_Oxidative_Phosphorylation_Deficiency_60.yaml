differential_diagnoses:
- name: Perrault syndrome due to other genes
  disease_term:
    preferred_term: Perrault syndrome
    term:
      id: MONDO:0017312
      label: Perrault syndrome
  description: >-
    Two of the nine MRPL49 families (the index British Pakistani sisters and the Turkish girl in
    family 5) have the Perrault phenotype, and a 2026 review lists MRPL49 among fifteen Perrault
    genes. The dismech Perrault syndrome entry deliberately does not curate MRPL49 as a Perrault
    gene, because the evidence is a single report in which most individuals do not have the full
    Perrault phenotype. This entry records MRPL49 disease as its own COXPD, of which Perrault
    syndrome is the mild presentation, rather than as a Perrault subtype.
  distinguishing_features:
  - Progressive leukodystrophy with symmetrical globus pallidus T2 signal was present in every imaged MRPL49 individual, whereas white matter change varies by gene in other Perrault syndrome (common with CLPP, absent with HARS2).
  - Learning disability and microcephaly are frequent in MRPL49 disease.
  - Some MRPL49 individuals have neither hearing loss nor ovarian failure.
  - The distinction is molecular.
  evidence:
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This consistency contrasts with other genes associated with Perrault syndrome where brain white matter changes are variable in frequency, from commonly present in individuals with CLPP-associated Perrault syndrome to absent with HARS2-associated disease."
    explanation: The leukodystrophy contrast with other Perrault genes.
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work expands the number of genes known to cause a phenotype consistent with both Perrault syndrome and COXPD."
    explanation: The authors place MRPL49 disease in both categories.
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "highlighting mutations in fifteen principal genes: HSD17B4, HARS2, CLPP, LARS2, TWNK, ERAL1, RMND1, DAP3, PRORP, MRPL50, MRPL49, MRPS7, PEX6, GGPS1, and TFAM."
    explanation: A review listing MRPL49 among the Perrault syndrome genes.
- name: Other mitoribosomal large-subunit disorders
  description: >-
    COXPDs caused by other genes of the large mitoribosomal subunit, such as MRPL44 deficiency
    (COXPD16), share the combined complex I and IV deficiency and reduced 16S rRNA but commonly
    involve the heart and liver.
  distinguishing_features:
  - No cardiomyopathy or liver involvement was reported in MRPL49 disease.
  evidence:
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to other disorders associated with disruption of the mt-LSU, there was no evidence of cardiomyopathy or liver involvement in individuals with MRPL49 variants."
    explanation: The organ-involvement contrast with other large-subunit disorders.
discussions:
- discussion_id: coxpd60_genotype_phenotype_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mitochondrial Energy Failure in High-Demand Tissues
  - phenotypes#Sensorineural hearing impairment
  - phenotypes#Premature ovarian insufficiency
  prompt: >-
    Why do individuals homozygous for the same founder MRPL49 allele differ in whether they have
    hearing loss and ovarian failure?
  rationale: >-
    The two Pakistani families homozygous for p.His92Pro share a founder haplotype, yet the index
    sisters have Perrault syndrome while the affected woman in the second family has normal hearing
    and menstruation. The authors propose an undefined genetic modifier. The answer decides whether
    MRPL49 should be tested in isolated Perrault syndrome alone or also in leukoencephalopathy
    without hearing loss.
  evidence:
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two families with homozygous His92Pro variants have intrafamilial phenotypic concordance but striking interfamilial differences."
    explanation: States the unexplained variability between families with the same genotype.
- discussion_id: coxpd60_translation_not_measured
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Mitochondrial Translation
  prompt: >-
    Is mitochondrial translation actually reduced in MRPL49 patient cells, and is the defect
    present in affected tissue rather than only fibroblasts?
  rationale: >-
    The founding study measured 16S rRNA, mitoribosome content and OXPHOS complexes in two
    fibroblast lines but did not measure de novo mitochondrial protein synthesis, study muscle or
    another affected tissue, or rescue the defect with wild-type MRPL49. No animal model exists.
    The translation node is therefore inferred from the data on either side of it.
  evidence:
  - reference: PMID:40043708
    reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, no mrpl49 knockout mouse models have been reported."
    explanation: No in vivo model is available to test the mechanism.
notes: >-
  The evidence base is one 2025 multicentre report of nine families; its medRxiv preprint
  (PMID:39417135) is the same study. A 2025 case report of endocrinopathy, dystonia and tremor in
  an Iranian patient homozygous for an MRPL49 variant (PMID:40715997) has no PubMed abstract and is
  not quoted. Phenotype frequencies are therefore small-cohort proportions. The adult from family 8
  also had posterior subcapsular cataracts, obesity, hypothyroidism and psychosis; these single
  observations are recorded here rather than as phenotypes. MRPL49 is not curated as a gene in the
  dismech Perrault syndrome entry; see the differential diagnosis above.

    explanation: Segregation of the homozygous p.His92Pro variant in the index family fits recessive transmission.
pathophysiology:
- name: Biallelic Hypomorphic MRPL49 Variants
  biological_scale: MOLECULAR
  description: >-
    The three missense alleles (p.Arg88Cys, p.Arg88His and p.His92Pro) alter conserved residues
    in a beta-hairpin loop of mL49 that forms part of its interface with the 16S rRNA in the large
    mitoribosomal subunit. The only other allele, a frameshift, occurred in trans to p.Arg88Cys.
    No homozygous loss-of-function allele has been observed, and the authors interpret the
    missense variants as hypomorphic: mL49 itself was reduced in patient fibroblasts, and complete
    loss is predicted to be lethal by analogy with other mitoribosomal large-subunit knockouts. The
    loop-to-rRNA interface is a structural model; no mL49 variant has been shown experimentally
    to break rRNA contact.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complexome profiling of fibroblasts from affected individuals revealed reduced levels of the small mitochondrial ribosomal subunits and a more pronounced reduction of the large mitochondrial ribosomal subunits. There was no evidence of altered mitoribosomal assembly."
    explanation: Reduced mitoribosome content, larger for the large subunit, without an assembly defect.
  downstream:
  - target: Reduced Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Fewer assembled mitoribosomes are proposed to lower the synthesis rate of the 13
      mtDNA-encoded OXPHOS subunits.
    evidence:
    - reference: PMID:40043708
      reference_title: "Bi-allelic variants in MRPL49 cause variable clinical presentations, including sensorineural hearing loss, leukodystrophy, and ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Consequently, a lower content of fully assembled mitoribosomes likely impacts mitochondrial protein translation rates, diminishing the synthesis of OXPHOS subunits, especially for complex I and complex IV"
      explanation: >-
        The authors' inference from mitoribosome content; translation was not measured directly
        with metabolic labelling in this study.
- name: Reduced Mitochondrial Translation
  conforms_to:

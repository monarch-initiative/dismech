progression:
- phase: Neonatal period and infancy
  age_range: Birth to 2 years
  notes: >-
    The neonatal course is dominated by feeding difficulties, cardiac disease,
    and bleeding, often with prolonged hospitalization; about 20% of children
    die during the first two years, mostly from congenital heart disease
    complications and less commonly from bleeding.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 20% of children die during the first two years of life, most
      commonly related to complications from congenital heart disease, and less
      commonly from bleeding.
    explanation: Quantifies early mortality and its leading causes.
- phase: Childhood and long-term course
  age_range: Childhood to adulthood
  notes: >-
    Half of patients are diagnosed by age one year; milder phenotypes are
    recognized later. Platelet counts can normalize over time but platelet
    dysfunction usually persists, and survivors need long-term
    multidisciplinary surgical and medical care.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Half of the patients are diagnosed by age one year of life, usually those
      with the more obvious clinical features of the disorder
    explanation: Documents the typical timing of diagnosis across the severity spectrum.
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT

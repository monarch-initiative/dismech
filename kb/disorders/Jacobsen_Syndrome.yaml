notes: >-
  Curated primarily from the Mattina, Perrotta, and Grossfeld Orphanet Journal
  of Rare Diseases review (PMID:19267933, full text cached). That review
  reports no known increased risk of malignancy in Jacobsen syndrome while
  noting that longer survival could yet reveal one; growth hormone replacement
  is described there as controversial for the same reason and is deliberately
  not curated as a treatment. Endocrine (growth hormone/IGF-1 and TSH
  deficiency) and immunologic (occasionally low IgM/IgA) problems are described
  only qualitatively in the source and are covered by the supportive-care
  follow-up entry rather than as separate evidence-banded phenotypes.

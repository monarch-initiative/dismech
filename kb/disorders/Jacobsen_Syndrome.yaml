name: Jacobsen Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Jacobsen syndrome is a multiple-congenital-anomaly/intellectual-disability
  contiguous-gene syndrome caused by a partial deletion of the long arm of
  chromosome 11 (distal 11q), extending from a breakpoint at or telomeric to
  11q23.3 to the telomere. Haploinsufficiency of the deleted genes produces pre-
  and postnatal growth retardation, psychomotor retardation, characteristic facial
  dysmorphism, and — as a hallmark — a congenital platelet disorder
  (Paris-Trousseau thrombocytopenia, attributed to FLI1 haploinsufficiency).
  Malformations of the heart, kidney, gastrointestinal tract, genitalia, CNS, and
  skeleton are common, and congenital heart disease drives most early mortality.
category: Genetic
synonyms:
- 11q terminal deletion disorder
- distal 11q deletion syndrome
- partial monosomy 11q
- 11q deletion syndrome
parents:
- hereditary disease
- chromosomal disorder

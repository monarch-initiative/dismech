genetic:
- name: Distal 11q terminal deletion
  association: Causal
  notes: >-
    Partial deletion of distal 11q (copy-number loss), ~7-20 Mb, from a breakpoint
    at or telomeric to 11q23.3 to the telomere. De novo in ~85% of cases; ~15%
    arise from unbalanced segregation of a familial balanced translocation or other
    rearrangement, and a minority from breakage at the FRA11B fragile site. No
    coordinate slot exists in the schema; the deletion is recorded here in prose.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion is de novo in 85% of reported cases, and in 15% of cases it results from an unbalanced segregation of a familial balanced translocation or from other chromosome rearrangements."
    explanation: Gives the de novo vs familial-translocation origins of the deletion.
- name: FLI1
  gene_term:
    preferred_term: FLI1
    term:
      id: hgnc:3749
      label: FLI1
  association: Causal for the Paris-Trousseau platelet phenotype
  relationship_type: CAUSATIVE
  notes: >-
    FLI1 (11q24) encodes an ETS transcription factor essential for
    megakaryopoiesis; its haploinsufficiency within the deletion is the
    recognized cause of the Paris-Trousseau thrombocytopenia and abnormal
    platelet function — a component phenotype of the contiguous-gene deletion,
    not the whole syndrome. In vitro over-expression of FLI1 in
    haploinsufficient patient CD34+ cells restores normal megakaryopoiesis,
    though the source notes other distal 11q genes may also contribute.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is in vivo and in vitro evidence that FLI1 plays a fundamental role
      in megakaryocytes differentiation and that heterozygous loss of the FLI-1
      gene is associated with dysmegakaryocytopoiesis and the Paris-Tousseau
      trombocytopenia in JS
    explanation: >-
      Directly attributes the Paris-Trousseau platelet phenotype to
      heterozygous FLI1 loss within the deletion (source spelling preserved).

    explanation: Provides the ~1 in 100,000 prevalence and the female predominance.
pathophysiology:
- name: Distal 11q Terminal Deletion
  biological_scale: MOLECULAR
  description: >-
    A partial deletion of the long arm of chromosome 11, from a proximal breakpoint
    within or telomeric to 11q23.3 extending usually to the telomere; deletion size
    ranges from ~7 to 20 Mb. Most are de novo.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion size ranges from approximately 7 to 20 Mb, with the proximal breakpoint within or telomeric to subband 11q23.3 and the deletion extending usually to the telomere."
    explanation: Defines the location and size range of the causal 11q terminal deletion.
  downstream:
  - target: Haploinsufficiency of Distal 11q Genes
    causal_link_type: DIRECT
    description: The deletion removes one copy of the contiguous distal 11q genes.
- name: Haploinsufficiency of Distal 11q Genes
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of the contiguous distal 11q genes drives the multisystem
    phenotype. The congenital platelet disorder (Paris-Trousseau thrombocytopenia)
    is attributed to haploinsufficiency of FLI1 (11q24), a transcription factor
    required for megakaryopoiesis; other genes in the interval contribute to the
    cardiac, craniofacial, and neurodevelopmental features.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Jacobsen syndrome is a MCA/MR contiguous gene syndrome caused by partial deletion of the long arm of chromosome 11."
    explanation: Establishes Jacobsen syndrome as a contiguous-gene (haploinsufficiency) syndrome.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - FLI1 haploinsufficiency impairing megakaryopoiesis
  - target: Congenital Heart Defects
    causal_link_type: DIRECT
  - target: Intellectual Disability
    causal_link_type: DIRECT

inheritance:
- name: De novo 11q terminal deletion, with an unbalanced-segregation minority
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    De novo in about 85% of reported cases; the remaining 15% arise from
    unbalanced segregation of a familial balanced translocation or other
    rearrangement.
  description: >-
    The 11q deletion acts in the heterozygous state. The 15% familial fraction is
    the counselling-relevant part: it reflects a balanced parental translocation
    segregating unbalanced, not direct transmission of the deletion, so parental
    karyotyping is indicated.
  evidence:
  - reference: PMID:19267933
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletion is de novo in 85% of reported cases, and in 15% of cases it
      results from an unbalanced segregation of a familial balanced translocation
      or from other chromosome rearrangements.
    explanation: >-
      Gives both the de novo rate and the mechanism behind the familial minority.

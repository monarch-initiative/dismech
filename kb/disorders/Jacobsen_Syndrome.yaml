genetic:
- name: Distal 11q terminal deletion
  association: Causal
  notes: >-
    Partial deletion of distal 11q (copy-number loss), ~7-20 Mb, from a breakpoint
    at or telomeric to 11q23.3 to the telomere. De novo in ~85% of cases; ~15%
    arise from unbalanced segregation of a familial balanced translocation or other
    rearrangement, and a minority from breakage at the FRA11B fragile site. No
    coordinate slot exists in the schema; the deletion is recorded here in prose.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion is de novo in 85% of reported cases, and in 15% of cases it results from an unbalanced segregation of a familial balanced translocation or from other chromosome rearrangements."
    explanation: Gives the de novo vs familial-translocation origins of the deletion.
- name: FLI1
  gene_term:
    preferred_term: FLI1
    term:
      id: hgnc:3749
      label: FLI1
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    FLI1 (11q24) encodes an ETS transcription factor essential for megakaryopoiesis;
    its haploinsufficiency within the deletion is the recognized cause of the
    Paris-Trousseau thrombocytopenia and abnormal platelet function.
diagnosis:
- name: Karyotype/Chromosomal Microarray
  presence: distal 11q deletion
  notes: >-
    Diagnosis is based on clinical findings (intellectual deficit, facial
    dysmorphism, and thrombocytopenia) and confirmed by cytogenetic analysis.
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on clinical findings (intellectual deficit, facial dysmorphic features and thrombocytopenia) and confirmed by cytogenetics analysis."
    explanation: States the clinical diagnostic triad and cytogenetic confirmation.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No curative therapy exists. Management is multidisciplinary — cardiac care
    (heart surgery may be needed in the neonatal period), hematologic monitoring and
    bleeding precautions for the platelet disorder, feeding support, and
    ophthalmologic, auditory, endocrine, and immunologic follow-up.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management is multi-disciplinary and requires evaluation by general pediatrician, pediatric cardiologist, neurologist, ophthalmologist."
    explanation: Establishes multidisciplinary supportive care as the management approach.

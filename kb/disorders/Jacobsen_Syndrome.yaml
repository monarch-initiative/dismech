differential_diagnoses:
- name: Turner syndrome
  description: >-
    Shares short stature, a short or webbed neck, downslanting palpebral
    fissures, ptosis, and left-sided cardiac lesions with Jacobsen syndrome.
  distinguishing_features:
  - Cytogenetic analysis shows a 45,X or variant X-chromosome constitution rather than a distal 11q deletion.
  - Congenital thrombocytopenia is not a Turner syndrome feature.
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnoses include Turner and Noonan syndromes, and acquired thrombocytopenia due to sepsis."
    explanation: The review explicitly lists Turner syndrome in the Jacobsen syndrome differential.
- name: Noonan syndrome
  description: >-
    Shares short stature, neck and palpebral anomalies, and congenital heart
    disease with Jacobsen syndrome, and additionally overlaps through
    thrombocytopenia with a bleeding tendency.
  distinguishing_features:
  - Cytogenetic analysis is normal at 11q; molecular testing identifies a RAS-MAPK pathway gene variant.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnoses include Turner and Noonan syndromes, and acquired thrombocytopenia due to sepsis."
    explanation: The review explicitly lists Noonan syndrome in the Jacobsen syndrome differential.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No curative therapy exists. Management is multidisciplinary — cardiac care
    (heart surgery may be needed in the neonatal period), hematologic monitoring and
    bleeding precautions for the platelet disorder, feeding support, and
    ophthalmologic, auditory, endocrine, and immunologic follow-up.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management is multi-disciplinary and requires evaluation by general pediatrician, pediatric cardiologist, neurologist, ophthalmologist."
    explanation: Establishes multidisciplinary supportive care as the management approach.
- name: Prophylactic Platelet Transfusion
  description: >-
    Because of thrombocytopenia and persistent platelet dysfunction, bleeding
    risk is highest in infancy and around procedures; prophylactic platelet or
    whole-blood transfusion is used before, during, or after surgery.
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:19267933
    reference_title: "Jacobsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia and other hematological problems must be taken into
      account preoperatively. Prophylactic transfusion with platelets can be
      lifesaving.
    explanation: Supports perioperative prophylactic platelet transfusion for the bleeding diathesis.
- name: Genetic Counseling and Prenatal Diagnosis
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Recurrence risk after a de novo deletion is generally considered
    negligible, but recurrence has been documented, is 50% when a parent is
    affected, and is high with a parental balanced translocation or 11q
    mosaicism; prenatal cytogenetic diagnosis by amniocentesis or chorionic
    villus sampling is possible.
  treatment_term:

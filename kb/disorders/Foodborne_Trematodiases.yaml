name: Foodborne trematodiases
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Foodborne trematodiases are infections with food-borne trematodes, including
  liver, lung, and intestinal flukes.
disease_term:
  term:
    id: MONDO:0015675
    label: distomatosis
  preferred_term: Foodborne trematodiases
parents:
- Helminth infection
- Neglected tropical disease
has_subtypes:
- name: Clonorchiasis
  display_name: Clonorchiasis (Clonorchis sinensis)
  classification: etiologic_species
  geography:
  - East Asia
  description: >-
    Liver-fluke infection by Clonorchis sinensis, acquired from raw freshwater fish.
    The adult fluke lives in the bile ducts, so disease is hepatobiliary and its
    severe sequela is cholangiocarcinoma; treatment is praziquantel. It is separated
    from opisthorchiasis, which has the same organ and the same drug, on geography:
    C. sinensis carries the burden in eastern Asia.
  subtype_term:
    preferred_term: clonorchiasis
    term:
      id: MONDO:0005705
      label: clonorchiasis
  evidence:
  - reference: DOI:10.1128/cmr.00009-23
    reference_title: >-
      "Clonorchiasis and opisthorchiasis: epidemiology, transmission, clinical
      features, morbidity, diagnosis, treatment, and control"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clonorchis sinensis , Opisthorchis viverrini , and Opisthorchis felineus are
      important liver flukes that cause a considerable public health burden in eastern
      Asia, southeastern Asia, and eastern Europe, respectively.
    explanation: >-
      Assigns each small liver fluke its own region, which is the axis separating
      clonorchiasis from opisthorchiasis when organ and therapy are shared.
  - reference: DOI:10.1128/cmr.00009-23
    reference_title: >-
      "Clonorchiasis and opisthorchiasis: epidemiology, transmission, clinical
      features, morbidity, diagnosis, treatment, and control"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic infections are associated with liver and biliary complications, most
      importantly cholangiocarcinoma.
    explanation: >-
      States the hepatobiliary organ involvement and the carcinogenic sequela of this
      stratum, distinguishing it from the pulmonary and intestinal flukes.
  - reference: DOI:10.1371/journal.pntd.0011073
    reference_title: >-
      "Global prevalence of 4 neglected foodborne trematodes targeted for control by
      WHO: A scoping review to highlight the gaps"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Triclabendazole was the most reported treatment for fascioliasis, while
      praziquantel was the primary treatment for paragonimiasis, clonorchiasis, and
      opisthorchiasis.
    explanation: >-
      Places this stratum on the praziquantel side of the drug split that separates it
      from fascioliasis.
- name: Opisthorchiasis
  display_name: Opisthorchiasis (Opisthorchis viverrini, O. felineus)
  classification: etiologic_species
  geography:
  - Southeast Asia
  - Eastern Europe
  - Russia
  description: >-
    Liver-fluke infection by Opisthorchis viverrini in southeastern Asia and
    O. felineus in eastern Europe and Russia, acquired from raw or undercooked
    freshwater fish. The flukes reach the bile ducts and cause cholangitis,
    periductal fibrosis and cholangiocarcinoma; treatment is praziquantel. The two
    species are kept in one row because they share organ, vehicle and drug and are
    distinguished only by range, which the row records.
  subtype_term:
    preferred_term: opisthorchiasis
    term:
      id: MONDO:0005884
      label: opisthorchiasis
  evidence:
  - reference: DOI:10.1128/cmr.00009-23
    reference_title: >-
      "Clonorchiasis and opisthorchiasis: epidemiology, transmission, clinical
      features, morbidity, diagnosis, treatment, and control"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clonorchis sinensis , Opisthorchis viverrini , and Opisthorchis felineus are
      important liver flukes that cause a considerable public health burden in eastern
      Asia, southeastern Asia, and eastern Europe, respectively.
    explanation: >-
      Gives the southeastern Asian and eastern European ranges of the two Opisthorchis
      species that this row covers, against the eastern Asian range of clonorchiasis.
  - reference: DOI:10.3390/pathogens12060795
    reference_title: >-
      Opisthorchis viverrini—Current Understanding of the Neglected Hepatobiliary
      Parasite
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After ingestion, the flukes migrate to the bile ducts, potentially causing many
      hepatobiliary complications, including cholangitis, cholecystitis,
      cholelithiasis, advanced periductal fibrosis and cholangiocarcinoma.
    explanation: >-
      Names the biliary site and the specific hepatobiliary complications of this
      stratum, the organ-involvement axis.
  - reference: DOI:10.1371/journal.pntd.0011073
    reference_title: >-
      "Global prevalence of 4 neglected foodborne trematodes targeted for control by
      WHO: A scoping review to highlight the gaps"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Triclabendazole was the most reported treatment for fascioliasis, while
      praziquantel was the primary treatment for paragonimiasis, clonorchiasis, and
      opisthorchiasis.
    explanation: >-
      Places this stratum on the praziquantel side of the drug split that separates it
      from fascioliasis.
- name: Fascioliasis
  display_name: Fascioliasis (Fasciola hepatica, F. gigantica)
  classification: etiologic_species
  geography:
  - Worldwide
  - Americas
  description: >-
    Liver-fluke infection by Fasciola hepatica or F. gigantica, and the one stratum
    whose first-line drug differs: it is treated with triclabendazole, not the
    praziquantel that treats every other foodborne trematodiasis here. It also
    differs on vehicle and reservoir — the metacercariae are eaten on raw aquatic
    vegetation rather than in fish or crustacea, and the maintenance hosts are
    ruminants — and on range, being reported from all regions with its highest
    prevalence in the Americas rather than in Asia.
  subtype_term:
    preferred_term: fascioliasis
    term:
      id: MONDO:0004668
      label: fascioliasis
  evidence:
  - reference: DOI:10.1371/journal.pntd.0011073
    reference_title: >-
      "Global prevalence of 4 neglected foodborne trematodes targeted for control by
      WHO: A scoping review to highlight the gaps"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Triclabendazole was the most reported treatment for fascioliasis, while
      praziquantel was the primary treatment for paragonimiasis, clonorchiasis, and
      opisthorchiasis.
    explanation: >-
      The first-line-therapy difference that earns this stratum a subtype: fascioliasis
      takes a different drug from all its siblings.
  - reference: DOI:10.1371/journal.pntd.0011073
    reference_title: >-
      "Global prevalence of 4 neglected foodborne trematodes targeted for control by
      WHO: A scoping review to highlight the gaps"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consumption of raw vegetables and freshwater plants was a key risk factor in
      every geographical area where fascioliasis was reported.
    explanation: >-
      States the plant-borne vehicle that separates this stratum from the fish-borne
      and crustacean-borne strata.
  - reference: DOI:10.1007/s40588-024-00231-y
    reference_title: Foodborne Helminthiasis
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (A) Fasciolidae: (1) Humans and ruminants are the definitive host with the adult
      fluke developing within the hepatic ducts.
    explanation: >-
      Names the ruminant reservoir and the hepatic-duct site for this stratum.
- name: Paragonimiasis
  display_name: Paragonimiasis (Paragonimus spp.)
  classification: etiologic_species
  geography:
  - Asia
  - Africa
  - Americas
  description: >-
    Lung-fluke infection by Paragonimus species, the one stratum here that is not a
    hepatobiliary or intestinal disease: the adult fluke develops in the respiratory
    tract, so the presentation is pulmonary and is routinely mistaken for
    tuberculosis. It is acquired from raw, undercooked or pickled freshwater crabs
    and crayfish rather than from fish or vegetation, and is treated with
    praziquantel.
  subtype_term:
    preferred_term: paragonimiasis
    term:
      id: MONDO:0005895
      label: paragonimiasis
  evidence:
  - reference: DOI:10.1007/s40588-024-00231-y
    reference_title: Foodborne Helminthiasis
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (C) Paragonimidae: (1) Humans and many domestic and wild animals including pigs,
      dogs and cats are the definitive host with the adult fluke developing within the
      respiratory tract.
    explanation: >-
      The organ-involvement difference that earns this stratum a subtype: the adult
      fluke sits in the respiratory tract, not the biliary tree or the gut.
  - reference: DOI:10.1007/s40588-024-00231-y
    reference_title: Foodborne Helminthiasis
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paragonimiasis is contracted through the ingestion of raw, undercooked or pickled
      crustaceans
    explanation: >-
      Names the crustacean vehicle, distinct from the fish and aquatic-vegetation
      vehicles of the liver-fluke strata.
  - reference: DOI:10.1371/journal.pntd.0011073
    reference_title: >-
      "Global prevalence of 4 neglected foodborne trematodes targeted for control by
      WHO: A scoping review to highlight the gaps"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consumption of raw or undercooked crab was identified as a key risk factor in
      the Southeast Asia and Western Pacific regions
    explanation: >-
      Independently confirms the crab vehicle for this stratum in its principal
      endemic regions.
- name: Echinostomiasis
  display_name: Echinostomiasis (Echinostoma spp. and other intestinal flukes)
  classification: etiologic_species
  description: >-
    Intestinal-fluke infection by Echinostoma species. The adult fluke stays in the
    gut rather than migrating to the biliary tree or the lungs, so the disease is an
    enteric one without the cholangiocarcinoma risk that defines the liver-fluke
    strata, and niclosamide is effective alongside praziquantel. Definitive hosts
    include birds as well as mammals.
  subtype_term:
    preferred_term: echinostomiasis
    term:
      id: MONDO:0005739
      label: echinostomiasis
  evidence:
  - reference: DOI:10.1007/s40588-024-00231-y
    reference_title: Foodborne Helminthiasis
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (D) Intestinal Flukes: (1) Humans and multiple wild and domestic mammals and
      birds are definitive hosts of intestinal flukes and pass unembryonated eggs in
      their faeces.
    explanation: >-
      Places this stratum's flukes in the intestine and names avian as well as
      mammalian definitive hosts, the organ and reservoir axes.
  - reference: DOI:10.1007/s40588-024-00231-y
    reference_title: Foodborne Helminthiasis
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Praziquantel and Niclosamide have both proven effective in treating intestinal
      flukes
    explanation: >-
      Records that niclosamide is a treatment option for the intestinal flukes, which
      is not reported for the liver and lung flukes.
  - reference: PMID:19597009
    reference_title: "Food-borne trematodiases."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      liver flukes (Clonorchis sinensis, Fasciola gigantica, Fasciola hepatica,
      Opisthorchis felineus, and Opisthorchis viverrini), lung flukes (Paragonimus
      spp.), and intestinal flukes (e.g., Echinostoma spp., Fasciolopsis buski, and the
      heterophyids)
    explanation: >-
      Assigns Echinostoma to the intestinal-fluke group, separate from the liver and
      lung flukes, which is the three-way organ split these subtypes follow.

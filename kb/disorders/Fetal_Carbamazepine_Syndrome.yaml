  downstream:
  - target: Formation of Reactive Arene Oxide Metabolites
    causal_link_type: DIRECT
    description: >-
      Hepatic (and placental/embryonic) oxidation of carbamazepine generates reactive
      arene-oxide intermediates, the proposed proximate teratogens.
    evidence:
    - reference: PMID:2725616
      reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "both drugs are metabolized through the arene oxide pathway and raises the possibility that it is the epoxide intermediate rather than the specific drug itself that is the teratogenic agent."
      explanation: >-
        The arene-oxide hypothesis this edge encodes, drawn from the phenotypic overlap with
        fetal hydantoin syndrome. Marked indirect because it is an inference from shared
        metabolism and shared phenotype, not a demonstrated step.
  - target: Impaired Embryonic Cell Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The exposure also disrupts the differentiation of embryonic cell lineages, the
      change the ReproTracker human assay reads out.
    evidence:
    - reference: PMID:38029956

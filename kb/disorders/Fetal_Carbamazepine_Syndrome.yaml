differential_diagnoses:
- name: Fetal valproate syndrome
  disease_term:
    preferred_term: fetal valproate syndrome
    term:
      id: MONDO:0012275
      label: fetal valproate syndrome
  description: >-
    The other antiseizure-medication embryopathy and the reciprocal of this entry's own
    split. The craniofacial dysmorphism and neurodevelopmental impairment overlap, which is
    why the two were historically grouped; they are distinguished by mechanism, malformation
    profile and magnitude of risk rather than by a test.
  distinguishing_features:
  - >-
      Fetal valproate syndrome carries a much higher overall malformation risk (about 10%
      vs about 5%), a specific neural tube defect (spina bifida) signal, and acts through
      HDAC inhibition and folate antagonism; fetal carbamazepine syndrome is milder and acts
      through reactive arene-oxide metabolites. Exposure history is what assigns the case.
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "9.9% (153 of 1549 pregnancies; 95% CI, 8.5%-11.5%) for valproate"
    explanation: >-
      The valproate malformation risk in the same cohort as the carbamazepine figure,
      quantifying the magnitude difference that distinguishes the two.
treatments:
- name: Preconception antiseizure medication optimization
  description: >-
    The management is preventive: in a person of childbearing potential, choosing a
    lower-risk antiseizure medication before conception where seizure control allows.
    Levetiracetam, oxcarbazepine and lamotrigine carried the lowest malformation risk in the
    prospective registry, below carbamazepine. As with valproate, this is a trade against
    seizure control and the calculus changes once a pregnancy has begun; it does not treat an
    established embryopathy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lowest prevalence of MCMs was observed in offspring exposed to levetiracetam, oxcarbazepine, and lamotrigine"
    explanation: >-
      Supports preferring a lower-risk antiseizure medication: the registry's safest options
      carried a lower malformation risk than carbamazepine.
experimental_models:
- name: ReproTracker hiPSC developmental-toxicity assay (carbamazepine)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    A human induced pluripotent stem cell (hiPSC) biomarker assay in which cells are
    differentiated toward cardiomyocytes, hepatocytes and neural rosettes under compound
    exposure, with lineage- and cell-specific marker genes quantified. Carbamazepine
    classified as a teratogen in the assay, lowering markers across all three lineages.
    Used with a pregnancy PBPK model to derive human-equivalent doses; only the in vitro
    biomarker arm is linked to the pathograph.
  publication: PMID:38029956
  genes:
  - preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  modeled_mechanisms:
  - target: Impaired Embryonic Cell Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The assay reproduces the differentiation-disruption arm of the mechanism in human
      cells — carbamazepine lowers the cardiomyocyte (MYH6), hepatocyte (FOXA2, AFP) and
      neural-ectoderm (PAX6) markers concentration-dependently. It does not reproduce the
      syndrome's defining craniofacial dysmorphism or fingernail hypoplasia, and it carries
      no reactive-metabolite readout, so it speaks to the cellular differentiation effect
      only.
    limitations: >-
      A 2D hiPSC differentiation reads gene-expression biomarkers of three lineages, not
      craniofacial morphogenesis or nail development; its metabolic competence for forming
      the arene-oxide intermediates is not characterized, so the proposed proximate teratogen
      may be under-represented.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the transcript abundance of lineage markers (MYH6, FOXA2, AFP,
        PAX6). The node's quantity is the differentiation of embryonic cells toward organs.
        Reduced marker expression stands in for impaired differentiation.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The syndrome's defining structural features — minor craniofacial defects and
        fingernail hypoplasia — are outside the model, which differentiates cardiomyocytes,
        hepatocytes and neural rosettes and has no craniofacial or appendicular readout.
    evidence:
    - reference: PMID:38029956
      reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT

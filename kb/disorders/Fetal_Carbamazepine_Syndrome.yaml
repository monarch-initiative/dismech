name: Fetal Carbamazepine Syndrome
creation_date: '2026-11-20T00:00:00Z'
description: >-
  Fetal carbamazepine syndrome is the pattern of minor craniofacial dysmorphism,
  fingernail hypoplasia and developmental delay that follows exposure to the
  antiseizure medication carbamazepine before birth, defined by Jones and
  colleagues in 1989 from a prospective cohort. Maternal carbamazepine therapy is
  the necessary cause, and the overall major-malformation risk in exposed
  pregnancies is modest and dose-dependent — higher than the safest antiseizure
  medications but well below valproate. The mechanism curated here is the reactive
  arene oxide account: carbamazepine, like phenytoin, is oxidized through an arene
  oxide pathway to reactive intermediates including carbamazepine-10,11-epoxide,
  and the overlap of this syndrome with fetal hydantoin syndrome led to the
  proposal that the epoxide intermediate, rather than the parent drug, is the
  teratogen. It is curated as a distinct named entity from fetal valproate
  syndrome, with which it shares only a convergent craniofacial-and-neurodevelopment
  phenotype and not a mechanism: valproate acts through HDAC inhibition and folate
  antagonism, carbamazepine through reactive metabolite formation.
category: Environmental
parents:

notes: >-
  Fetal carbamazepine syndrome is curated as a standalone entry rather than as a subtype of
  Fetal_Valproate_Syndrome, settling the lump/split question raised in issue 16910. The two
  are both antiseizure-medication embryopathies with overlapping craniofacial and
  neurodevelopmental phenotypes, and before this entry existed carbamazepine appeared only as
  a differential_diagnoses row inside Fetal_Valproate_Syndrome. They are split because their
  mechanisms are distinct: valproate acts through class I HDAC inhibition and folate
  antagonism, whereas carbamazepine's curated mechanism is reactive arene-oxide metabolite
  formation (shared with phenytoin, not valproate). The convergent phenotype is a reason to
  place both under a shared Grouping of antiseizure-medication embryopathies, not to merge the
  entries. Note that carbamazepine has also been reported to inhibit HDACs (PMID:15850602),
  an overlap with valproate that is not curated here as a teratogenic mechanism because the
  teratology literature attributes the syndrome to the arene-oxide pathway; it is recorded as
  a lead. The ReproTracker link (PMID:38029956) homes the carbamazepine arm of the NAM paper
  that motivated the issue.

  The fetal susceptibility modifier EPHX1 (microsomal epoxide hydrolase) is deliberately not
  encoded as a genetic SUSCEPTIBILITY or MODIFIER row, as considered in issue 18522. The
  reactive-metabolite account predicts that reduced epoxide-hydrolase detoxification capacity
  raises risk, and that is already captured as the DECREASED epoxide hydrolase activity
  modifier on the Formation of Reactive Arene Oxide Metabolites node. A dedicated EPHX1
  genotype-risk row would overstate the evidence: the single human functional series linking
  low amniocyte epoxide-hydrolase activity to the embryopathy studied phenytoin monotherapy,
  not carbamazepine, and genotyped nobody (Buehler, PMID:2336087), so the carbamazepine link
  is a cross-agent extrapolation within the shared arene-oxide drug class; the
  conceptus-genotype modifier effect is quantitative and polygenic in the mouse and unmapped
  in humans, and EPHX1 genotype-guided stratification remains biologically motivated but
  clinically untested. This is an environmental syndrome with no causal gene; EPHX1, CYP3A4
  and KCNH2 are candidate modifiers, not causes.

  A mechanism lead for a future revision, out of scope here: recent work challenges
  carbamazepine-10,11-epoxide as the proximate teratogen (the zebrafish teratogenicity tracks
  the parent compound rather than the epoxide), so the arene-oxide account curated in the
  pathophysiology nodes above — which this entry already states as a proposal rather than a
  settled step — may warrant nuancing against that literature in a separate pass.

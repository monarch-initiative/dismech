- name: Formation of Reactive Arene Oxide Metabolites
  biological_scale: MOLECULAR
  description: >-
    Carbamazepine is oxidized to carbamazepine-10,11-epoxide and, by oxidation on the
    aromatic ring, to arene-oxide and quinone intermediates. These reactive species,
    rather than the parent drug, are the proposed teratogens; their normal clearance is
    by epoxide hydrolase, so reduced detoxification capacity is thought to raise
    susceptibility. In the mouse, the epoxide metabolite is itself teratogenic at
    exposures achievable in vivo.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  molecular_functions:
  - preferred_term: epoxide hydrolase activity
    modifier: DECREASED
    term:
      id: GO:0004301
      label: epoxide hydrolase activity
  chemical_entities:
  - preferred_term: carbamazepine
    term:
      id: CHEBI:3387
      label: carbamazepine
  evidence:
  - reference: PMID:8968346
    reference_title: "Teratogenicity of carbamazepine-10, 11-epoxide and oxcarbazepine in the SWV mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data are consistent with a teratogenic CBZ metabolite, possibly CBZE, or with oxidation of CBZE or CBZ at positions on the aromatic ring leading to the formation of reactive intermediates such as arene oxides or quinones."
    explanation: >-
      Experimental support that the epoxide and other ring-oxidation reactive intermediates,
      not the parent drug, carry the teratogenic activity.
  - reference: PMID:17587258
    reference_title: "Teratogenicity of antiepileptic drugs: role of drug metabolism and pharmacogenomics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "systems such as epoxide hydrolase, glutathione reductase, superoxide dismutase and other toxin-scavenging systems may be important modifiers that lower the risk"
    explanation: >-
      Sources the epoxide hydrolase annotation and the clearance sentence: the review names
      epoxide hydrolase as a detoxification system that lowers teratogenic risk, so reduced
      activity is a susceptibility modifier. INDIRECT because the modifier direction follows
      from the enzyme's risk-lowering role rather than from a measured decrease in this disease.
  downstream:
  - target: Impaired Embryonic Cell Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reactive-metabolite injury is proposed to disturb the differentiation and survival of
      embryonic cells in the affected fields; the intervening steps are not resolved.
    evidence:
    - reference: PMID:8968346
      reference_title: "Teratogenicity of carbamazepine-10, 11-epoxide and oxcarbazepine in the SWV mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data are consistent with a teratogenic CBZ metabolite, possibly CBZE, or with oxidation of CBZE or CBZ at positions on the aromatic ring leading to the formation of reactive intermediates such as arene oxides or quinones."
      explanation: >-
        Ties the reactive metabolite to teratogenic outcome; the cellular intermediates
        remain unspecified, so the edge is indirect.
- name: Impaired Embryonic Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    Carbamazepine exposure lowers the differentiation of multiple embryonic lineages.
    In the ReproTracker human iPSC assay it reduces the cardiomyocyte marker MYH6, the
    endoderm/hepatocyte markers FOXA2 and AFP, and the neural-ectoderm marker PAX6 in a
    concentration-dependent manner — a broader lineage effect than thalidomide's in the
    same assay, which spared the neural lineage.
  biological_processes:
  - preferred_term: cardiac muscle cell differentiation
    modifier: DECREASED
    term:
      id: GO:0055007
      label: cardiac muscle cell differentiation
  - preferred_term: hepatocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0070365
      label: hepatocyte differentiation
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:38029956
    reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Exposure to carbamazepine led to a significant and concentration-dependent decrease in expression of the cardiomyocyte-specific marker (MYH6), liver-specific markers (FOXA2, and AFP), and neural ectoderm biomarker gene (PAX6), when compared to controls"
    explanation: The human-cell differentiation evidence grounding this node.
  downstream:
  - target: Developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted neural-lineage differentiation (the PAX6 decrease) is the proposed cellular
      route to the developmental delay documented in exposed children; the steps are not
      established.
    evidence:
    - reference: PMID:2725616
      reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "That carbamazepine itself is teratogenic is indicated by the incidence of craniofacial defects (11 percent), fingernail hypoplasia (26 percent), and developmental delay (20 percent) in the 35 live-born children of the women in the prospective study who were exposed prenatally to carbamazepine alone."
      explanation: The developmental-delay outcome this edge leads to, quantified in the monotherapy arm.

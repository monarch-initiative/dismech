notes: >-
  Fetal carbamazepine syndrome is curated as a standalone entry rather than as a subtype of
  Fetal_Valproate_Syndrome, settling the lump/split question raised in issue 16910. The two
  are both antiseizure-medication embryopathies with overlapping craniofacial and
  neurodevelopmental phenotypes, and before this entry existed carbamazepine appeared only as
  a differential_diagnoses row inside Fetal_Valproate_Syndrome. They are split because their
  mechanisms are distinct: valproate acts through class I HDAC inhibition and folate
  antagonism, whereas carbamazepine's curated mechanism is reactive arene-oxide metabolite
  formation (shared with phenytoin, not valproate). The convergent phenotype is a reason to
  place both under a shared Grouping of antiseizure-medication embryopathies, not to merge the
  entries. Note that carbamazepine has also been reported to inhibit HDACs (PMID:15850602),
  an overlap with valproate that is not curated here as a teratogenic mechanism because the
  teratology literature attributes the syndrome to the arene-oxide pathway; it is recorded as
  a lead. The ReproTracker link (PMID:38029956) homes the carbamazepine arm of the NAM paper
  that motivated the issue.

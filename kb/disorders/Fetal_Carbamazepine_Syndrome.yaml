    evidence:
    - reference: PMID:2725616
      reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "both drugs are metabolized through the arene oxide pathway and raises the possibility that it is the epoxide intermediate rather than the specific drug itself that is the teratogenic agent."
      explanation: >-
        The arene-oxide hypothesis this edge encodes, drawn from the phenotypic overlap with

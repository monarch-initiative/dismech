differential_diagnoses:
- name: Fetal valproate syndrome
  disease_term:
    preferred_term: fetal valproate syndrome
    term:
      id: MONDO:0012275
      label: fetal valproate syndrome
  description: >-
    The other antiseizure-medication embryopathy and the reciprocal of this entry's own
    split. The craniofacial dysmorphism and neurodevelopmental impairment overlap, which is
    why the two were historically grouped; they are distinguished by mechanism, malformation
    profile and magnitude of risk rather than by a test.
  distinguishing_features:
  - >-
      Fetal valproate syndrome carries a much higher overall malformation risk (about 10%
      vs about 5%), a specific neural tube defect (spina bifida) signal, and acts through
      HDAC inhibition and folate antagonism; fetal carbamazepine syndrome is milder and acts
      through reactive arene-oxide metabolites. Exposure history is what assigns the case.
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "9.9% (153 of 1549 pregnancies; 95% CI, 8.5%-11.5%) for valproate"
    explanation: >-
      The valproate malformation risk in the same cohort as the carbamazepine figure,
      quantifying the magnitude difference that distinguishes the two.
- name: Fetal hydantoin syndrome
  disease_term:
    preferred_term: fetal hydantoin syndrome
    term:
      id: MONDO:0016008
      label: fetal hydantoin syndrome
  description: >-
    The phenytoin embryopathy, and the near-identical phenocopy a reader of the
    diagnosis-of-exclusion node will reach for: carbamazepine and phenytoin share the
    arene-oxide metabolic pathway, so their craniofacial-and-fingernail-hypoplasia
    phenotypes overlap closely and the two were historically conflated. The case is assigned
    by exposure history rather than by any discriminating feature.
  distinguishing_features:
  - >-
      Fetal hydantoin syndrome follows maternal phenytoin rather than carbamazepine exposure;
      the minor craniofacial dysmorphism and distal-digital (nail and phalanx) hypoplasia are
      largely shared, consistent with the common arene-oxide mechanism, so the distinction is
      the documented drug of exposure, not the phenotype.
  evidence:
  - reference: PMID:2725616
    reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "both drugs are metabolized through the arene oxide pathway and raises the possibility that it is the epoxide intermediate rather than the specific drug itself that is the teratogenic agent."
    explanation: >-
      The shared arene-oxide metabolism behind the phenotypic overlap that makes fetal
      hydantoin syndrome the near-identical differential. Indirect because it argues the
      mechanistic basis of the overlap rather than listing discriminating features.
diagnosis:
- name: Clinical and exposure-history diagnosis of exclusion
  description: >-
    There is no confirmatory test or biomarker for fetal carbamazepine syndrome. The
    diagnosis rests on three elements: documented first-trimester carbamazepine exposure, a
    compatible pattern of minor craniofacial dysmorphism, fingernail hypoplasia and the
    broader multisystem anomalies the case literature records, and exclusion of genetic and
    chromosomal phenocopies. Dysmorphic facial scoring alone is weak: in a blinded
    dysmorphology panel only 47% of antiseizure-medication-exposed children were correctly
    identified as exposed, and nearly half of unexposed children carried some of the same
    minor features. No gene panel exists or should exist; genetic and cytogenetic testing
    serves only to exclude a phenocopy (see the cytogenetic-exclusion node below), never to
    confirm the syndrome.
  evidence:
  - reference: PMID:16239295
    reference_title: "Dysmorphic features: an important clue to the diagnosis and severity of fetal anticonvulsant syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Overall, 47% of exposed children were correctly identified as having been exposed to AEDs in utero."
    explanation: >-
      Quantifies how weak dysmorphic recognition is on its own — near-chance identification of
      exposure — supporting the reliance on exposure history rather than facial gestalt.
  - reference: PMID:16239295
    reference_title: "Dysmorphic features: an important clue to the diagnosis and severity of fetal anticonvulsant syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "many of these features may be seen as part of normal variation and that the diagnosis of the fetal anticonvulsant syndrome is difficult to make on the basis of facial gestalt alone"
    explanation: >-
      The study's own conclusion that the minor dysmorphic features overlap normal variation,
      so the diagnosis cannot be made on facial appearance alone.
  - reference: PMID:22687674
    reference_title: Severe consequences of carbamazepine exposure in utero.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The 'foetal carbamazepine syndrome' is characterised by facial dysmorphism associated to cardiovascular, nervous system, urinary tract and skeletal anomalies."
    explanation: >-
      The recognizable multisystem pattern a compatible presentation is matched against, stated
      in a severe case report.
- name: Cytogenetic exclusion of a chromosomal mimic
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  description: >-
    Because the exposure-defined syndrome has no confirmatory test, a chromosomal or
    copy-number disorder that mimics the dysmorphic-and-malformation pattern is excluded
    before the diagnosis is accepted. Karyotyping is the exclusion step the case literature
    documents — a normal 46,XX result excluded a chromosomal cause in the reported severe
    case — and chromosomal microarray is added where a submicroscopic copy-number mimic is
    suspected. Neither confirms the syndrome.
  evidence:
  - reference: PMID:22687674
    reference_title: Severe consequences of carbamazepine exposure in utero.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "After 7 days of birth, the infant developed severe neutropenia, moderate pulmonary hypertension, multiple organ failure and died. The karyotype was 46, XX."
    explanation: >-
      Karyotyping applied in a diagnosed case and returning a normal 46,XX result — the
      cytogenetic exclusion step this node records.
- name: Prenatal anomaly screening for neural tube and structural defects
  diagnosis_term:
    preferred_term: detailed second-trimester anomaly ultrasound
    term:
      id: NCIT:C217447
      label: Diagnostic Obstetric Ultrasound
  description: >-
    Because carbamazepine carries a specific though low risk of spina bifida aperta (about
    0.5%) and a broader structural-anomaly risk, an exposed pregnancy is offered detailed
    anomaly ultrasound in the second trimester with dedicated spine, posterior fossa, face
    and cardiac views, supported by maternal serum alpha-fetoprotein and, where indicated,
    fetal MRI. Screening detects rather than prevents, and is recommended even when high-dose
    folic acid has been taken.
  evidence:
  - reference: PMID:14504306
    reference_title: "Management issues for women with epilepsy: neural tube defects and folic acid supplementation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Even with supplementary folic acid, women taking valproate or carbamazepine should undergo perinatal diagnostic ultrasound to rule out NTDs."
    explanation: >-
      The recommendation that carbamazepine-exposed pregnancies undergo diagnostic ultrasound to
      exclude neural tube defects, independent of folic acid use.
  - reference: PMID:14504306
    reference_title: "Management issues for women with epilepsy: neural tube defects and folic acid supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The prevalence of SB is approximately 1 to 2% with valproate exposure and 0.5% with carbamazepine."
    explanation: >-
      Sources the roughly 0.5% spina bifida aperta risk under carbamazepine that motivates the
      targeted spinal views.
progression:
- phase: Neonatal period (transient microcephaly)
  description: >-
    Onset is congenital and the malformation pattern is fixed at birth; the syndrome is
    non-progressive and no staging system applies. The one feature that remits is head size:
    carbamazepine carried the highest microcephaly rate among the monotherapies in the NEAD
    cohort, with reduced head circumference at birth and at 12 months, but this normalizes by
    24 months. It matters in counselling because a small head at birth is otherwise an alarming
    finding for parents.
  evidence:
  - reference: PMID:22749607
    reference_title: Differential effects of antiepileptic drugs on neonatal outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Microcephaly rates were elevated to 12% for all newborns and at 12 months old, but normalized by age 24 months."
    explanation: >-
      Documents that the microcephaly seen at birth and at 12 months resolves by 24 months — the
      transient course of this feature.
  - reference: PMID:22749607
    reference_title: Differential effects of antiepileptic drugs on neonatal outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "CBZ followed by VPA had the highest percentage of microcephaly in neonates and 12 month old infants"
    explanation: >-
      Places carbamazepine as the monotherapy with the highest early microcephaly rate, the
      finding whose later normalization this phase records.
- phase: Childhood neurodevelopmental outcome
  description: >-
    Global cognition is largely spared after carbamazepine exposure, but cognitive difficulty
    concentrates in the subgroup with the full facial dysmorphic phenotype. In Ornoy's
    controlled cohort all six children who had the typical carbamazepine-syndrome face had a
    development or intelligence quotient below 90, driving the group's lower mean, while there
    was no difference from controls in growth or in the rate of major anomalies. Dysmorphism,
    not exposure alone, marks the child at risk of cognitive difficulty. Two modifiable
    factors improve the cognitive outcome across the antiseizure-medication cohort that
    included carbamazepine: periconception folate use (adjusted IQ about 6 points higher) and
    breastfeeding during maternal therapy (adjusted IQ about 4 points higher), the latter
    showing no detectable harm from drug transfer in milk.
  evidence:
  - reference: PMID:9014606
    reference_title: Outcome of children born to epileptic mothers treated with carbamazepine during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "all six children with carbamazepine syndrome had a development quotient or intelligence quotient below 90"
    explanation: >-
      Ties the cognitive deficit to the dysmorphic subgroup: every child with the facial
      phenotype scored below 90.
  - reference: PMID:9014606
    reference_title: Outcome of children born to epileptic mothers treated with carbamazepine during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There were no differences between the two groups in physical growth or in the rate of major anomalies."
    explanation: >-
      The counterpoint that growth and major-anomaly rates did not differ from controls, so the
      risk is concentrated in cognition within the dysmorphic subgroup rather than general.
  - reference: PMID:24934501
    reference_title: "Breastfeeding in children of women taking antiepileptic drugs: cognitive outcomes at age 6 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "periconception folate use was associated with higher IQ"
    explanation: >-
      Periconception folate as a modifiable factor raising the cognitive outcome in the NEAD
      cohort (which included carbamazepine monotherapy), adjusted IQ about 6 points higher.
  - reference: PMID:24934501
    reference_title: "Breastfeeding in children of women taking antiepileptic drugs: cognitive outcomes at age 6 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "our results at age 6 years show higher IQ (by 4 points) and enhanced verbal abilities (by 4 points) in breastfed children"
    explanation: >-
      Breastfeeding during maternal antiseizure-medication therapy as the second modifiable
      factor, with higher IQ and no detectable harm from drug transfer in milk.
treatments:
- name: Preconception antiseizure medication optimization
  description: >-
    The management is preventive: in a person of childbearing potential, choosing a
    lower-risk antiseizure medication before conception where seizure control allows.
    Levetiracetam, oxcarbazepine and lamotrigine carried the lowest malformation risk in the
    prospective registry, below carbamazepine. As with valproate, this is a trade against
    seizure control and the calculus changes once a pregnancy has begun; it does not treat an
    established embryopathy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lowest prevalence of MCMs was observed in offspring exposed to levetiracetam, oxcarbazepine, and lamotrigine"
    explanation: >-
      Supports preferring a lower-risk antiseizure medication: the registry's safest options
      carried a lower malformation risk than carbamazepine.
experimental_models:
- name: ReproTracker hiPSC developmental-toxicity assay (carbamazepine)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    A human induced pluripotent stem cell (hiPSC) biomarker assay in which cells are
    differentiated toward cardiomyocytes, hepatocytes and neural rosettes under compound
    exposure, with lineage- and cell-specific marker genes quantified. Carbamazepine
    classified as a teratogen in the assay, lowering markers across all three lineages.
    Used with a pregnancy PBPK model to derive human-equivalent doses; only the in vitro
    biomarker arm is linked to the pathograph.
  publication: PMID:38029956
  genes:
  - preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  modeled_mechanisms:
  - target: Impaired Embryonic Cell Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The assay reproduces the differentiation-disruption arm of the mechanism in human
      cells — carbamazepine lowers the cardiomyocyte (MYH6), hepatocyte (FOXA2, AFP) and
      neural-ectoderm (PAX6) markers concentration-dependently. It does not reproduce the
      syndrome's defining craniofacial dysmorphism or fingernail hypoplasia, and it carries
      no reactive-metabolite readout, so it speaks to the cellular differentiation effect
      only.
    limitations: >-
      A 2D hiPSC differentiation reads gene-expression biomarkers of three lineages, not
      craniofacial morphogenesis or nail development; its metabolic competence for forming
      the arene-oxide intermediates is not characterized, so the proposed proximate teratogen
      may be under-represented.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the transcript abundance of lineage markers (MYH6, FOXA2, AFP,
        PAX6). The node's quantity is the differentiation of embryonic cells toward organs.
        Reduced marker expression stands in for impaired differentiation.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The syndrome's defining structural features — minor craniofacial defects and
        fingernail hypoplasia — are outside the model, which differentiates cardiomyocytes,
        hepatocytes and neural rosettes and has no craniofacial or appendicular readout.
    evidence:
    - reference: PMID:38029956
      reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Exposure to carbamazepine led to a significant and concentration-dependent decrease in expression of the cardiomyocyte-specific marker (MYH6), liver-specific markers (FOXA2, and AFP), and neural ectoderm biomarker gene (PAX6), when compared to controls"
      explanation: >-
        The concentration-dependent, multi-lineage marker decrease that makes this human assay
        informative for the differentiation node.
    readouts:
    - name: Cardiomyocyte marker MYH6 expression
      target: Impaired Embryonic Cell Differentiation
      direction: DECREASED
      interpretation: Loss of the cardiomyocyte-specific marker on directed differentiation.

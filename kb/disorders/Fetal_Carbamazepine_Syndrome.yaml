  rate_per_100000: 5400.0
  rate_low: 4500.0
  rate_high: 6400.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    The major-malformation risk among carbamazepine-exposed pregnancies, 5.4% (95% CI
    4.5-6.4%), recorded as a birth prevalence of major congenital malformations conditional
    on exposure rather than a population prevalence of the syndrome. It is dose-dependent and
    sits between the safest antiseizure medications and valproate (about 10%).
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5.4% (121 of 2255 pregnancies; 95% CI, 4.5%-6.4%) for carbamazepine"
    explanation: The numerator, denominator and interval this record normalizes.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    A recognizable but generally mild dysmorphic and neurodevelopmental syndrome
    rather than a lethal malformation syndrome: the defining features are minor
    craniofacial defects, fingernail hypoplasia and developmental delay. The overall
    major-malformation risk in carbamazepine-exposed pregnancies is about 5%,
    dose-dependent, and higher than the safest antiseizure medications but much lower
    than valproate's roughly 10%. The burden is weighed against the maternal need for
    seizure control, which is itself a fetal risk, so carbamazepine is not simply
    avoidable the way an elective exposure is.
  evidence:
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5.4% (121 of 2255 pregnancies; 95% CI, 4.5%-6.4%) for carbamazepine"
    explanation: The major-malformation risk among carbamazepine-exposed pregnancies in a large prospective registry.
  - reference: PMID:38497990
    reference_title: "Risk of Major Congenital Malformations and Exposure to Antiseizure Medication Monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all dose categories of carbamazepine and valproate were associated with significantly higher risk of MCMs compared with levetiracetam"
    explanation: Establishes that carbamazepine carries an elevated, dose-related malformation risk relative to the safest comparators.
environmental:
- name: Maternal carbamazepine therapy during pregnancy
  description: >-
    Carbamazepine, taken for epilepsy, trigeminal neuralgia or bipolar disorder,
    reaching the embryo by placental transfer. It is the necessary cause of the
    syndrome. Carbamazepine is extensively oxidized in the liver, and one of its
    principal routes generates carbamazepine-10,11-epoxide and other reactive
    arene-oxide intermediates, which is the basis of the reactive-metabolite
    mechanism below.
  exposure_term:
    preferred_term: exposure to carbamazepine
    term:
      id: ECTO:9000603
      label: exposure to carbamazepine
  chemicals:
  - carbamazepine
  influences_mechanisms:
  - target: Transplacental Carbamazepine Exposure of the Embryo
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Maternal dosing delivers carbamazepine to the embryo during organogenesis,
      the initiating step of the mechanism curated here.
    evidence:
    - reference: PMID:2725616
      reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A pattern of malformation, the principal features of which are minor craniofacial defects and fingernail hypoplasia, and of developmental delay was identified in the eight children retrospectively ascertained to have been exposed to carbamazepine in utero"
      explanation: >-
        Identifies the exposure-defined syndrome this edge initiates, from the study that
        first delineated it.
  evidence:
  - reference: PMID:2725616
    reference_title: Pattern of malformations in the children of women treated with carbamazepine during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "That carbamazepine itself is teratogenic is indicated by the incidence of craniofacial defects (11 percent), fingernail hypoplasia (26 percent), and developmental delay (20 percent) in the 35 live-born children of the women in the prospective study who were exposed prenatally to carbamazepine alone."
    explanation: >-
      Attributes the syndrome to carbamazepine itself, with the feature incidences from the
      monotherapy-exposed prospective arm.
pathophysiology:
- name: Transplacental Carbamazepine Exposure of the Embryo
  biological_scale: ORGANISM
  description: >-
    Carbamazepine crosses the placenta and reaches the embryo during organogenesis.
    This node is the shared parent of the reactive-metabolite branch and the

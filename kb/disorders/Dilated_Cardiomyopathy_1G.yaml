diagnosis:
- name: Transthoracic Echocardiography
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography evaluates left ventricular end-diastolic dimensions
    (LVDD > 56 mm) and systolic ejection fraction (EF < 50%) to establish the
    clinical diagnosis of dilated cardiomyopathy, and is recommended annually
    alongside electrocardiography for longitudinal surveillance of
    genotype-positive family members.
  evidence:
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DCM was diagnosed at a mean age of 42 years based on presenting clinical symptoms (exertional dyspnea, palpitations), and echocardiographic findings of LV dilation (LVDD>56 mm) with reduced systolic performance (EF<50%)."
    explanation: Establishes echocardiographic left ventricular dilation (LVDD > 56 mm) and reduced ejection fraction (EF < 50%) as clinical diagnostic criteria in familial TTNtv DCM.
  - reference: PMID:28912180
    reference_title: "Dilated Cardiomyopathy: Genetic Determinants and Mechanisms."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "For gene mutation-positive family members, current guidelines suggest an annual clinical follow up with ECG and echocardiography3, 140, 141."
    explanation: Supports annual echocardiographic surveillance alongside ECG for genotype-positive family members identified by cascade testing.
- name: Cardiovascular Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  description: >-
    Cardiovascular magnetic resonance (CMR) imaging quantifies age- and
    sex-normalized ventricular end-diastolic volume, stroke volume, left
    ventricular wall thickness, and ejection fraction for clinical diagnosis,
    and evaluates delayed gadolinium enhancement (myocardial fibrosis) to
    stratify sudden cardiac death and arrhythmic risk in dilated cardiomyopathy.
  evidence:
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DCM was diagnosed by CMR findings of ejection fraction >2sd below and end diastolic volume >2sd above the mean normalized for age and sex (33, 51) by two independent Level 3 accredited CMR cardiologists (See Fig. S1)."
    explanation: Defines quantitative age- and sex-normalized CMR end-diastolic volume and ejection fraction criteria used to diagnose DCM.
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To better ascertain clinical phenotypes associated with TTNtv-positive DCM, we capitalized on quantitative cardiac MRI (CMR) (32, 33) in DCM patients. Among TTNtv-positive DCM patients we observed more severely impaired LV function, lower stroke volumes and thinner LV walls (Table 2) than in TTNtv-negative DCM patients."
    explanation: Demonstrates quantitative CMR assessment of left ventricular systolic function, stroke volume, and wall thickness in TTNtv-positive DCM.
  - reference: PMID:28912180
    reference_title: "Dilated Cardiomyopathy: Genetic Determinants and Mechanisms."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "CMR, especially the identification of delayed enhancement, can help risk stratify for sudden death34."
    explanation: Establishes late gadolinium delayed-enhancement CMR imaging for sudden cardiac death risk stratification in genetic DCM.
- name: Next-Generation Sequencing of TTN with Cardiac Exon PSI Filtering
  diagnosis_term:
    preferred_term: next generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  description: >-
    High-throughput next-generation sequencing across all TTN exons and canonical
    splice sites, interpreted using cardiac exon usage (proportion spliced in,
    PSI > 0.9) and A-band/isoform location, distinguishes high-probability
    pathogenic TTNtv (>=93-98% probability in DCM patients) from incidental
    truncations in low-PSI exons.
  evidence:
  - reference: PMID:22335739
    reference_title: "Truncations of titin causing dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using genomic DNA isolated from subjects with dilated cardiomyopathy in groups A and B and from the subjects with hypertrophic cardiomyopathy and controls, we captured and performed next-generation sequencing of 145 kb of the TTN gene, including all annotated exons and splice sites."
    explanation: Establishes targeted next-generation sequencing across the giant TTN locus as essential for sensitive TTNtv detection.
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Applying this framework to our discovery cohort, we predicted that TTNtv produced by nonsense, frameshift, or canonical splice site mutations that affect highly expressed exons (PSI>0.9) had at least a 93% probability of pathogenicity (likelihood ratio (LR) = 14) when identified in an unselected patient with DCM, and an even higher probability of pathogenicity in end-stage disease (≥96%, LR= 24)."
    explanation: Defines the diagnostic PSI > 0.9 exon-inclusion criterion giving >=93% pathogenicity probability in unselected DCM and >=96% in end-stage DCM.
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted probability of pathogenicity of nonsense, frameshift, or canonical splice TTNtv in highly expressed exons in the DCM replication cohort was ≥98% (LR= 41)."
    explanation: Confirms the >=98% upper bound of predicted pathogenicity for constitutive-exon TTNtv in familial DCM replication testing.

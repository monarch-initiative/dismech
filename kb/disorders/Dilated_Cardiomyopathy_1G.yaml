- name: Sarcomere Insufficiency and Impaired Mechanosensing
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Titin is the molecular ruler and elastic backbone of the sarcomere: it
    templates myofibril assembly, provides the passive restoring force of diastole,
    and transduces mechanical strain into signalling at the Z-disc and M-band. A
    truncating allele removes full-length titin from half the molecular pool, and
    the truncated product does not substitute for it. The consequence is a
    sarcomere that assembles and transmits force imperfectly and that senses
    mechanical load abnormally - a contractile and mechanosensing deficit rather
    than the hypercontractility of the hypertrophic sarcomeropathies. Human heart
    tissue analyses integrating RNA and protein data underpin the discrimination
    of pathogenic from benign truncations on this basis.
  cell_types:
  - preferred_term: Cardiomyocyte

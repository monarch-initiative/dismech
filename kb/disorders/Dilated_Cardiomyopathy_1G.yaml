- name: Implantable Cardioverter-Defibrillator
  description: >-
    Indicated for primary or secondary prevention of sudden cardiac death given
    the 6.7-fold excess odds of sustained ventricular tachycardia in
    TTNtv-positive dilated cardiomyopathy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Ventricular Arrhythmia
    description: >-
      Detects and terminates sustained ventricular tachycardia and ventricular
      fibrillation.
    evidence:
    - reference: PMID:25589632
      reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mid-wall fibrosis, an important prognostic factor in DCM (34, 35), was
        similar in patients with and without TTNtv, but sustained ventricular
        tachycardia was more common in TTNtv-positive patients (OR = 6.7; P =
        0.001) and robust to adjustment for LV ejection fraction.
      explanation: Establishes the sustained ventricular tachycardia risk targeted by defibrillator therapy in TTNtv-positive DCM.
  evidence:
  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense, frameshift, and canonical splice site TTNtv, particularly those
      that truncate both principal isoforms of TTN and/or reside towards the
      carboxy-terminus, cause DCM with severely impaired LV function and
      life-threatening ventricular arrhythmias.
    explanation: Supports arrhythmic risk management and defibrillator consideration for life-threatening ventricular arrhythmias in TTNtv DCM.
- name: Heart Transplantation
  description: >-
    Advanced, refractory end-stage heart failure is an indication for cardiac
    transplantation; dilated cardiomyopathy is the most frequent precipitating
    cause of heart transplant, with transplant and LVAD rates in TTNtv-positive
    DCM comparable to other severe DCM cohorts.
  therapeutic_modality: SURGERY
  treatment_term:

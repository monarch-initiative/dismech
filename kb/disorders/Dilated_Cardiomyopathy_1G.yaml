name: Dilated Cardiomyopathy 1G
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMD1G
- TTN familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1G
- cardiomyopathy, dilated, 1G
- titin-related dilated cardiomyopathy
- TTNtv dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1G (CMD1G) is the TTN-related form of familial isolated
  dilated cardiomyopathy and the single commonest genetic cause of the disease.
  TTN encodes titin, the largest protein in the human proteome: a single molecule
  spans half the sarcomere from Z-disc to M-band, acting as a molecular ruler for
  sarcomere assembly, as the elastic spring that sets passive myocardial
  stiffness, and as a mechanosensing scaffold. The disease alleles are titin
  truncating variants (TTNtv) - nonsense, frameshift, splice-disrupting, and
  copy-number changes predicted to truncate the full-length polypeptide - which
  Herman and colleagues established in 2012 as a common cause of dilated
  cardiomyopathy, present in roughly a quarter of familial and a fifth of sporadic
  cases. Position within the gene is the critical determinant of pathogenicity:
  truncations in the inextensible A-band, the region that binds myosin and
  myosin-binding protein C, are the disease-associated class, whereas TTNtv
  elsewhere - and TTNtv found at appreciable frequency in the general population -
  are largely benign, so a truncating variant is not by itself a diagnosis.
  Inheritance is autosomal dominant with high penetrance in clinically ascertained
  families but substantially lower penetrance among population carriers.
  TTNtv-positive DCM is clinically distinctive for an appreciable burden of
  atrial and ventricular arrhythmia alongside the ventricular dilation and systolic
  dysfunction.

pathophysiology:
- name: TTN Truncating Variant in the A-Band
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    The initiating lesion in CMD1G is a titin truncating variant (TTNtv) -
    a nonsense, frameshift, splice-disrupting, or copy-number change predicted to
    substantially alter the full-length titin polypeptide. Position and cardiac
    exon inclusion (percent spliced in, PSI > 90%) are the critical determinants
    of pathogenicity: disease-associated TTNtv are located predominantly in
    constitutively expressed exons of the inextensible A-band, the segment that
    binds myosin and myosin-binding protein C and is critical for biomechanical
    sensing and signaling. This positional and isoform-usage dependence separates
    pathogenic truncations from benign truncations in low-PSI exons found in the
    general population.

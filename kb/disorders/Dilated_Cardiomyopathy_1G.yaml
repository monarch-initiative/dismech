        carboxy-terminus, cause DCM with severely impaired LV function and
        life-threatening ventricular arrhythmias.
      explanation: >-
        Connects isoform-truncating C-terminal/A-band TTNtv directly to dilated
        cardiomyopathy with severely impaired left ventricular systolic function.
- name: Ventricular Dilation and Systolic Dysfunction
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Chronic sarcomeric insufficiency produces the defining structural remodeling of
    dilated cardiomyopathy: progressive left ventricular chamber enlargement with
    wall thinning, myocyte loss, and interstitial/mid-wall fibrosis, accompanied by
    falling ejection fraction. Unlike the hypertrophic sarcomeropathies, the
    geometric response is dilation rather than wall thickening, and neurohormonal
    activation drives the remodeling forward.

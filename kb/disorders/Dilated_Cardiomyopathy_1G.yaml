  - reference: PMID:25589632
    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A-band are excluded by alternate splicing, or whether the pathogenesis of TTN

- name: Heart Failure and Arrhythmic Risk
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The dilated, poorly contracting, fibrotic ventricle produces the clinical
    endpoints of CMD1G: progressive systolic heart failure requiring standard
    heart-failure therapy and, in advanced disease, mechanical support or
    transplantation. TTNtv-positive DCM additionally carries a clinically important
    burden of atrial and ventricular arrhythmia, so rhythm surveillance is part of
    management rather than an incidental concern.

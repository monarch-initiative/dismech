notes: >-
  CMD1G is curated as the TTN member of the numbered dilated cardiomyopathy series
  and is the highest-value DCM gene entry: TTN truncating variants are the single
  commonest genetic cause of the disease (~25% familial, ~18% sporadic), and TTN
  carries ClinGen Definitive gene-disease validity for DCM. It conforms to the
  shared cardiomyopathy_maladaptive_remodeling module.

  Positional caveat preserved on the pathograph, deliberately. TTNtv occur in the
  general population, so a truncating variant is not by itself a diagnosis;
  pathogenicity tracks with A-band location. The entry also records the unresolved
  question (PMID:25589632) of whether pathogenicity follows from critical
  functional elements in the A-band or from the length of the truncated product,
  rather than asserting a single settled mechanism. Penetrance is curated with the
  ascertainment caveat: >95% in clinically ascertained families over 40, but
  substantially lower among population-ascertained carriers.

  Note the contrast with Hypertrophic Cardiomyopathy 9 (also TTN): TTN truncating
  variants are established in dilated, not hypertrophic, cardiomyopathy, and the
  TTN-HCM association rests on rare missense reports - a caveat already recorded on
  that entry and in the Familial Hypertrophic Cardiomyopathy grouping.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary TTN cohort and pedigree literature
  cited throughout, principally PMID:22335739, PMID:21353195, PMID:25589632.

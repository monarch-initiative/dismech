    reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By contrast, our analyses of allele-specific transcript expression and
      protein in human LV tissue indicate that TTN is highly and biallelically
      expressed: TTNtv were not subjected to substantial nonsense-mediated decay
      and levels of the major titin isoforms were not diminished.
    explanation: >-
      Human myocardial transcript and protein analysis defining how TTNtv alleles
      are expressed in diseased left ventricular tissue.
  - reference: PMID:28912180
    reference_title: "Dilated Cardiomyopathy: Genetic Determinants and Mechanisms."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: >-
      Induced pluripotent stem cells (iPSC) differentiated into cardiomyocytes in

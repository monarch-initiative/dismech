  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Sarcomere paucity and impaired titin-mediated biomechanical support lead to
      chamber dilation and progressive loss of left ventricular systolic
      performance under load.
    evidence:
    - reference: PMID:25589632
      reference_title: "Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects of titin truncations in health and disease."
      supports: SUPPORT

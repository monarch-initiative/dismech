    snippet: "There were no significant differences between subjects with and those without TTN truncating mutations with respect to the age at diagnosis, left ventricular end-diastolic dimensions, ejection fraction, or rates of cardiac transplantation, implantation of a left ventricular assist device, and death from cardiac causes (Table 2 and Fig."
    explanation: Documents cardiac transplantation as an established end-stage intervention in TTNtv dilated cardiomyopathy cohorts.

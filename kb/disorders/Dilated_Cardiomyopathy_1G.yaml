- name: Sarcomere Insufficiency and Impaired Mechanosensing
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Titin is the molecular ruler and elastic backbone of the sarcomere: it
    templates myofibril assembly, provides the passive restoring force of diastole,
    and transduces mechanical strain into signalling at the Z-disc and M-band.
    Human left-ventricular RNA and protein studies show biallelic TTN expression
    without substantial nonsense-mediated decay, while human TTNtv iPSC-derived
    cardiomyocytes exhibit a paucity of sarcomeres, suggesting that contractile
    force may be impaired directly through sarcomere loss; both haploinsufficiency
    of full-length titin and truncated-peptide effects remain under investigation.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell

name: Lysosomal Acid Phosphatase Deficiency
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Lysosomal acid phosphatase deficiency is an ultra-rare autosomal recessive historical
  lysosomal disorder associated with deficient lysosomal acid phosphatase activity in
  infancy, presenting in historical human reports with intermittent vomiting, lethargy,
  hypotonia, opisthotonus, and terminal bleeding, although the causal relationship
  between the enzyme defect and the human clinical manifestations remains unresolved and
  no human pathogenic ACP2 variants have been reported. Targeted and spontaneous Acp2
  mouse models demonstrate progressive lysosomal substrate accumulation in renal
  podocytes, renal tubular epithelium, and central nervous system glia alongside
  reactive astrogliosis, microglial activation, and impaired cerebellar granule cell
  proliferation.
synonyms:
- acid phosphatase deficiency
- lysosomal acid phosphatase 2 deficiency
- ACP2 deficiency
- LAP deficiency
- total lysosomal acid phosphatase deficiency

    explanation: Establishes deficient lysosomal acid phosphatase activity as the defining biochemical basis of diagnosis.
genetic:
- name: ACP2 loss of function
  gene_term:
    preferred_term: ACP2
    term:
      id: hgnc:123
      label: ACP2
  association: Candidate gene based on biochemical enzyme identity and murine models
  notes: >-
    No human pathogenic ACP2 sequence variant has ever been reported in the literature,
    and Orphanet (ORPHA:35121) lists no causative gene and classifies human lysosomal
    acid phosphatase deficiency as a historical entity with no clinical case descriptions
    since 1970. Assignment to ACP2 reflects its identity as the gene encoding lysosomal
    acid phosphatase 2 together with targeted Acp2-knockout and spontaneous nax mutant
    mouse models.
  evidence:
  - reference: PMID:27132795
    reference_title: "Lysosomal Acid Phosphatase Biosynthesis and Dysfunction: A Mini Review Focused on Lysosomal Enzyme Dysfunction in Brain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acp2 is essential in cerebellar development, and mutations in this gene cause severe cerebellar neurodevelopmental and neurodegenerative disorders."
    explanation: Identifies mutations in Acp2 as causative of lysosomal acid phosphatase dysfunction and cerebellar pathology in murine models.
  - reference: PMID:11950951
    reference_title: Acid phosphatases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Total lysosomal acid phosphatase (LAP) deficiency is an autosomal recessive disorder that was first discovered by Nadler and Egan"
    explanation: Confirms autosomal recessive inheritance of total lysosomal acid phosphatase deficiency in humans.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Acp2 knockout (LAP-deficient)
  description: >-
    Mice with targeted disruption of the lysosomal acid phosphatase (LAP / Acp2) gene are
    viable and develop progressive lysosomal storage in renal podocytes and tubular
    epithelium and in CNS glia, with astrogliosis, microglial activation, generalized
    seizures in a minority, and later kyphoscoliosis.
  associated_phenotypes:
  - Renal lysosomal storage
  - CNS lysosomal storage with astrogliosis
  - Generalized seizures
  - Kyphoscoliosis
  evidence:
  - reference: PMID:9228031
    reference_title: "Mice deficient in lysosomal acid phosphatase develop lysosomal storage in the kidney and central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microscopic examination of various peripheral organs revealed progredient lysosomal storage in podocytes and tubular epithelial cells of the kidney, with regionally different ultrastructural appearance of the stored material."
    explanation: The Acp2 knockout mouse develops renal lysosomal storage, modeling the enzyme deficiency.
  - reference: PMID:9228031
    reference_title: "Mice deficient in lysosomal acid phosphatase develop lysosomal storage in the kidney and central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whereas behavioral and neuromotor analyses were unable to distinguish between control and deficient mice, approximately 7% of the deficient animals developed generalized seizures."
    explanation: A subset of Acp2-deficient mice develop generalized seizures.
  - reference: PMID:9228031
    reference_title: "Mice deficient in lysosomal acid phosphatase develop lysosomal storage in the kidney and central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "From the age of 6 months onward, conspicuous alterations of bone structure became apparent, resulting in a kyphoscoliotic malformation of the lower thoracic vertebral column."
    explanation: Documents adult-onset thoracic kyphoscoliosis and bone remodeling defects in Acp2-deficient mice.
- species: Mouse (Mus musculus)
  genotype: Acp2 spontaneous mutant (naked-ataxia, nax)
  description: >-
    Spontaneous Acp2 mutant (nax) mice exhibit severe cerebellar cortical hypoplasia with
    marked depletion of granule cells, dysregulated Sonic hedgehog signaling, and
    downregulated MYCN expression.
  associated_phenotypes:
  - Cerebellar cortex hypoplasia
  - Reduced cerebellar granule cell proliferation
  evidence:
  - reference: PMID:33804256
    reference_title: "Reduced Granule Cell Proliferation and Molecular Dysregulation in the Cerebellum of Lysosomal Acid Phosphatase 2 (ACP2) Mutant Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lysosomal acid phosphatase 2 (Acp2) mutant mice (naked-ataxia, nax) have a severe cerebellar cortex defect with a striking reduction in the number of granule cells."
    explanation: Establishes the nax mouse phenotype of cerebellar cortical hypoplasia and granule cell loss.
notes: >-
  Human total lysosomal acid phosphatase deficiency rests on historical biochemical
  descriptions from 1970 with no molecularly confirmed ACP2 cases reported in humans,
  and Saftig et al. (PMID:9228031) explicitly concluded from Acp2-knockout mice that
  "The causal relationship of the enzyme defect to the clinical manifestations remains
  to be determined." Separately from total systemic LAP deficiency, Bull et al.
  (PMID:11950951, "Other case studies have shown LAP deficiency to be limited to white
  blood cells. This resulted in recurrent infections.") note historical reports of
  leukocyte-restricted LAP deficiency presenting with recurrent infections, which is
  not merged into the total-deficiency phenotype list.

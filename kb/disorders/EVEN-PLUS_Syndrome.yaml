name: EVEN-PLUS Syndrome
creation_date: "2026-08-31T07:40:00Z"
category: Mendelian
disease_term:
  preferred_term: even-plus syndrome
  term:
    id: MONDO:0014801
    label: even-plus syndrome
description: >
  EVEN-PLUS syndrome (OMIM #616854) is an autosomal recessive congenital
  malformation syndrome caused by biallelic hypomorphic variants in HSPA9,
  which encodes mortalin / mtHSP70 (also GRP75), the mitochondrial matrix
  Hsp70. The acronym names its cardinal features - Epiphyses, Vertebrae, Ears
  and Nose - PLUS a set of associated malformations: prenatal-onset short
  stature, cardiac septal defects, anal atresia, aplasia cutis, hypodontia and
  variable developmental delay. Skeletally it is a spondyloepiphyseal dysplasia
  with coronal vertebral clefts and severe, often unossified, proximal femoral
  epiphyses.

  The disease was delineated by gene-based phenotypic sorting rather than by
  clinical splitting. Patients who looked like CODAS syndrome but carried no
  LONP1 variant turned out to carry biallelic HSPA9 variants instead, and
  earlier reports of "EVE dysplasia" and of "caudal regression with
  spondyloepiphyseal dysplasia" were retrospectively recognised as the same
  entity - one of them later confirmed molecularly. LONP1 and HSPA9 act
  together in the mitochondrial matrix chaperone-protease network, and the
  authors proposed the resulting pair as a family of "mitochondrial
  chaperonopathies".

  The mechanistic point that makes this entry unusual is a negative one, and
  it is stated by the source rather than inferred here: EVEN-PLUS does not
  look like a bioenergetic mitochondrial disease. There is no lactic acidosis,
  no encephalomyopathy, no Leigh-type decompensation. The phenotype is one of
  disturbed embryonic morphogenesis - microtia, a flat nose, abnormal hair
  whorls, anal atresia, sacral agenesis - in a pattern that reads
  developmental rather than metabolic. How loss of a mitochondrial matrix
  chaperone produces that pattern is explicitly unexplained in the primary
  literature, and this entry curates that as a knowledge gap rather than
  papering over it with a plausible-sounding energy-failure chain.

synonyms:
- EVEN-PLUS syndrome
- EVEN-plus syndrome
- epiphyseal-vertebral-ear-nose dysplasia plus associated findings
- EVE dysplasia
- EVE syndrome
- HSPA9-related skeletal dysplasia

parents:
- Skeletal dysplasia
- Multiple congenital anomalies syndrome

notes: >
  Scope and counting. The largest single source is a 2024 systematic review
  that collated 12 cases (9 females) from 6 research items, including two new
  Chinese patients of its own; the rest of the literature is single-patient
  and sibpair reports. Most phenotypes here still carry no `frequency`,
  because a percentage pooled across independently ascertained case reports
  is a scope error rather than a penetrance estimate. The exception is the
  set of features that review found in *all* 12 patients, which is a
  defensible statement about a stated denominator.

  Two of those four are curated as `frequency: OBLIGATE`, and two are not.
  The dividing line is whether the sentence distributes over the term this
  entry actually binds. "Hypoplastic nasal bone" is exactly `HP:0004646`, so
  the value is direct; "dysplastic femoral head" is narrower than
  `HP:0002656` Epiphyseal dysplasia but entails it, since the femoral head is
  an epiphysis, so the value is carried upward. The other two are stated
  disjunctively - "synophrys *or* arched eyebrows", "hypoplastic *or*
  dysplastic ears" - and each is broader than the term bound here
  (`HP:0000664` Synophrys, `HP:0008551` Microtia). A disjunction at 100% puts
  no floor under either limb, so those two nodes carry the quote and no
  number. The asymmetry is deliberate: entailment runs from narrow to broad,
  never the reverse.

  Allelic series, and why this entry does not merge it. HSPA9 also carries
  heterozygous variants reported in congenital sideroblastic anemia, and the
  p.R126W allele that is homozygous in two EVEN-PLUS sibs here has separately
  been reported at heterozygosity in Parkinson disease cohorts. Those are
  different dosage regimes and different phenotypes; this entry curates the
  biallelic hypomorphic developmental syndrome only, and records the p.R126W
  functional work because it is the strongest available evidence that the
  allele is not neutral - not as a claim that EVEN-PLUS and Parkinson disease
  share a mechanism.

  Where the mechanism evidence actually sits. The genotype-to-protein step is
  now well evidenced: a dedicated biophysical study measured ATP hydrolysis,
  interdomain-linker binding, thermostability and aggregation for both
  EVEN-PLUS missense alleles. The protein-to-malformation step is not, and no
  mouse bridges it - homozygous Hspa9 null is embryonically lethal and the
  heterozygote is unaffected. The knowledge gap curated here is specifically
  that second step, not the first.

  Evidence-grading note for reviewers. The zebrafish `crimsonless` mutant is
  cited here twice and the two citations are deliberately different claims. As
  a model of hematopoiesis it is not EVEN-PLUS; what makes it relevant is the
  incidental observation that head and eye development were stunted and that
  development halted globally, which is the only in vivo evidence that hspa9
  loss disturbs morphogenesis rather than energy supply. Both items are
  MODEL_ORGANISM and INDIRECT, and neither is the sole support for a human
  phenotype.

  Cache hygiene. `references_cache/PMID_26598328.md` is a `full_text_xml`
  capture in which superscript reference markers have been concatenated onto
  the preceding word (for example the sentence about the LONP1 relationship
  ends "LONP19101112"). Snippets in this entry were chosen to end before those
  positions. This is a cache-generation artefact, not curator error, and is
  reported upstream.


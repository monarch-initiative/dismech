genetic:
- name: HSPA9
  notes: >
    The sole gene reported for this disorder. It encodes mortalin / mtHSP70 /
    GRP75, the matrix Hsp70 that drives presequence import through TIM23 and
    is required for LONP1 protease activity. Reported EVEN-PLUS alleles are
    hypomorphic rather than null; the recurrent c.882_883delAG (p.V296*) has
    been seen in patients of both Korean and Chinese ancestry, which raises
    the question of an East Asian founder effect.
  gene_term:
    preferred_term: HSPA9
    term:
      id: hgnc:5244
      label: HSPA9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was only one gene that fit all criteria, namely, HSPA9."
    explanation: >
      The result of the exome filtering that identified the gene, stated as
      the sole surviving candidate.
  - reference: PMID:36052765
    reference_title: "Identifying patients with EVEN-plus syndrome using exome sequencing and clinical feature analysis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding expands the spectra of EVEN-plus syndrome phenotype and pathogenic variants and suggests that c.882_c.883delAG may have a higher distribution frequency in East Asian populations."
    explanation: >
      Records the recurrence of the frameshift allele and the authors'
      founder-effect hypothesis.

treatments:
- name: Reproductive genetic counseling with prenatal or preimplantation testing
  description: >
    The only intervention in this entry with a reported outcome rather than an
    inferred one, and it is preventive rather than therapeutic. In one Chinese
    family the biallelic genotype was identified in two affected fetuses,
    mutation-free embryos were selected, and a healthy daughter was born. For
    a recessive condition with no disease-modifying treatment and a recurrence
    risk of one in four, this is what "management" currently means for a
    family after a first affected child.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38281662
    reference_title: "Prenatal to preimplantation genetic diagnosis of a novel compound heterozygous mutation in HSPA9 associated with Even-Plus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assisted reproduction with mutation-free embryos successfully blocked the transmission of mutations."
    explanation: >
      A reported outcome, in a family with a molecularly confirmed EVEN-PLUS
      genotype, of the only intervention with evidence in this disease.
  - reference: PMID:38281662
    reference_title: "Prenatal to preimplantation genetic diagnosis of a novel compound heterozygous mutation in HSPA9 associated with Even-Plus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation-free embryos were selected for transplantation and reconfirmed to possess no mutations. A healthy daughter was successfully born into the family."
    explanation: >
      The confirmatory detail - selection, reconfirmation, and live birth -
      which is what distinguishes this from a proposal.

- name: Orthopedic management of hip dysplasia and epiphyseal disease
  description: >
    Directed at the skeletal phenotype that dominates lifelong burden:
    dysplastic femoral heads found in every collated patient, dislocation,
    unossified proximal femoral epiphyses, dislocated patellae and scoliosis.
    No trial or series reports outcomes in this disease. The intervention is
    curated because the phenotype is universal and orthopedic care is what it
    generates in practice, not because anyone has measured it here - hence
    `directness: INDIRECT`.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Chondro-Osseous Dysplasia of Epiphyses and Vertebral Bodies
    description: >-
      Addresses the mechanical consequences of the growth-plate and
      femoral-head lesion; it does not act on the lesion itself.
  evidence:
  - reference: PMID:38284453
    reference_title: "A new phenotype of EVEN-PLUS syndrome in a Chinese family and literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had synophrys or arched eyebrows, hypoplastic or dysplastic ears, hypoplastic nasal bone, and dysplastic femoral head."
    explanation: >
      Establishes that the femoral-head lesion is universal, which is the
      basis for treating orthopedic care as expected management. INDIRECT: the
      source documents the phenotype, not the outcome of treating it.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 5 yrs, the proximal femoral epiphyses were not ossified, the femoral heads appeared to be dislocated, and the epiphyses at the knee were dysplastic."
    explanation: >
      Documents dislocation and failed ossification in a specific child, which
      is the clinical problem this management addresses. INDIRECT for the same
      reason.

- name: Surveillance for cardiac, renal and neurological involvement
  description: >
    Septal defects, vesicoureteral reflux and hydronephrosis, and now seizures
    with basal ganglia lesions are each reported in a minority of patients and
    none is predictable from the skeletal phenotype. The systematic review's
    own conclusion is that the syndrome should be suspected on the combination
    of craniofacial, skeletal, cardiac and renal findings, which is the same
    argument for looking for them once the diagnosis is made. Note that a
    normal study does not settle the question: one index patient's atrial
    septal defect closed spontaneously by 20 months.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38284453
    reference_title: "A new phenotype of EVEN-PLUS syndrome in a Chinese family and literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSPA9 gene mutations should be suspected in all cases with specific craniofacial features, abnormal skeletal presentations, congenital heart defects, and renal alterations."
    explanation: >
      Names the four organ systems the syndrome involves. INDIRECT: this is a
      diagnostic-suspicion statement being used to argue for surveillance,
      which is an inference step the source does not itself take.
  - reference: PMID:38284453
    reference_title: "A new phenotype of EVEN-PLUS syndrome in a Chinese family and literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures and basal ganglia lesions are a new phenotype of EVEN-PLUS syndrome."
    explanation: >
      Adds neurological surveillance to the list, on the strength of a
      phenotype recognised only in 2024. INDIRECT for the same reason.

diagnosis:
- name: Exome or genome sequencing
  description: >
    The diagnosis is molecular. Every published case was made by exome
    sequencing, in several instances after a clinical diagnosis of CODAS
    syndrome had been made and LONP1 testing returned negative. A skeletal
    survey showing coronal vertebral clefts with severe proximal femoral
    epiphyseal dysplasia, in a child with bilateral microtia and a flat nose,
    is the phenotype that should prompt HSPA9 testing.
  evidence:
  - reference: PMID:32869452
    reference_title: "EVEN-PLUS syndrome: A case report with novel variants in HSPA9 and evidence of HSPA9 gene dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here the fifth case of EVEN-PLUS syndrome with novel variants c.818 T > G (p.L273X) and c.955C > T (p.L319F) in the HSPA9 gene identified through whole-exome sequencing."
    explanation: >
      Documents exome sequencing as the diagnostic route in a representative
      case.

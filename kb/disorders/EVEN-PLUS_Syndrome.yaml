inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic in every reported family - homozygous in the two consanguineous
    sibs and compound heterozygous in the non-consanguineous index case, with
    heterozygosity confirmed in the unaffected parents. Because the mechanism
    is hypomorphic rather than null, at least one allele retaining partial
    function is expected; no individual with two complete null alleles has
    been reported.
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were confirmed by direct bidirectional Sanger sequencing of a second batch of genomic DNA; heterozygosity was confirmed in the unaffected parents."
    explanation: >
      Parental heterozygosity with unaffected status is the direct segregation
      evidence for recessive inheritance.
  - reference: PMID:35779070
    reference_title: "Broadening the phenotypic spectrum of EVEN-PLUS syndrome through identification of HSPA9 pathogenic variants in the original EVE dysplasia family and two sibs with milder facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EVEN-PLUS syndrome is a rare autosomal recessive disorder caused by biallelic pathogenic variants in the mitochondrial chaperone called mortalin, encoded by HSPA9."
    explanation: >
      Independent statement of biallelic recessive inheritance from a second
      group.

mechanistic_hypotheses:
- hypothesis_group_id: mitochondrial_chaperonopathy_morphogenesis
  hypothesis_label: Mitochondrial Chaperonopathy / Developmental Morphogenesis Model
  status: EMERGING
  description: >-
    Biallelic hypomorphic HSPA9 alleles reduce, without abolishing, the
    activity of the mitochondrial matrix Hsp70. The proposal is that the
    resulting deficit acts on embryonic morphogenesis - patterning and
    outgrowth of first- and second-arch derivatives, the nasal skeleton, the
    vertebral bodies and the epiphyseal growth plates - rather than through
    the bioenergetic failure that characterises classical mitochondrial
    disease. The status is EMERGING and not CANONICAL on purpose: the causal
    genetics are solid, but the step from chaperone deficiency to
    dysmorphogenesis is asserted as unexplained by the primary report and has
    no worked-out molecular intermediate.

pathophysiology:
- name: Biallelic Hypomorphic HSPA9 Variants
  biological_scale: MOLECULAR
  description: >
    Thirteen variants across the published cohort. The missense alleles
    cluster on the nucleotide-binding domain surface (p.R126W, p.Y128C,
    p.L319F), with a recurrent frameshift (c.882_883delAG, p.V296*) and a
    nonsense allele (p.L273X). Those truncating alleles remove more than half
    the protein including the entire substrate-binding domain and are subject
    to nonsense-mediated decay, so a truncating allele in trans with a
    missense allele is the commonest configuration. The missense residues sit
    away from the ATP site but adjacent to the predicted interface between the
    nucleotide-binding and substrate-binding domains, which is the allosteric
    coupling that makes an Hsp70 work.

    The nucleotide-binding-domain framing is not the whole spectrum. Splice
    variants at c.1822-1G>A and c.1411-3T>G act on the substrate-binding
    domain instead, abolishing part of it, which is a second and distinct way
    to reach a hypomorphic chaperone.
  genes:
  - preferred_term: HSPA9
    term:
      id: hgnc:5244
      label: HSPA9
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic hypomorphic HSPA9 alleles: homozygous missense in the
      consanguineous family, compound heterozygous missense plus truncating in
      the others.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 1 was found to be heterozygous for variants c.383A > G (p.Y128C) and c.882_883delAG (p.V296*). Patients 2 and 3 were found to be homozygous for variant c.376C > T (p.R126W)."
    explanation: >
      The founding allelic spectrum, showing both the compound-heterozygous
      and the homozygous configuration.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The V296* truncation mutation abolishes more than half of the protein, including all of the substrate binding domain"
    explanation: >
      Establishes that the recurrent frameshift is a functional null for
      substrate binding, which is why the surviving allele sets the phenotype.
  - reference: PMID:32869452
    reference_title: "EVEN-PLUS syndrome: A case report with novel variants in HSPA9 and evidence of HSPA9 gene dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "qPCR analysis provides supporting evidence for a nonsense-mediated decay mechanism for the HSPA9 truncating variant."
    explanation: >
      Transcript-level evidence that truncating HSPA9 alleles are degraded
      rather than producing a stable truncated protein.
  - reference: PMID:30933555
    reference_title: "Biophysical Consequences of EVEN-PLUS Syndrome Mutations for the Function of Mortalin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both variants are colocalized on the NBD near to the IDL interaction site NBD suggesting a potential negative effect on inter-domain communication with the SBD."
    explanation: >
      Independent structural confirmation that both missense alleles sit at
      the interdomain-linker interface, which is the structural claim this
      node makes about their location.
  - reference: PMID:38281662
    reference_title: "Prenatal to preimplantation genetic diagnosis of a novel compound heterozygous mutation in HSPA9 associated with Even-Plus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three-dimensional spatial simulation of the HSPA9 protein after prediction of the mutated RNA splicing pattern abolished part of the substrate-binding domain of the protein. According to ACMG guidelines, c. 1822-1G>A and c. 1411-3T>G were classified as pathogenic and likely pathogenic, respectively."
    explanation: >
      Extends the allelic spectrum to splice variants acting on the
      substrate-binding domain, which complicates the nucleotide-binding-domain
      clustering this node otherwise describes.
  downstream:
  - target: Impaired Mitochondrial Matrix Hsp70 Chaperone Function
    description: >-
      Reduced substrate binding and reduced allosteric coupling between the
      nucleotide-binding and substrate-binding domains.
    hypothesis_groups:
    - mitochondrial_chaperonopathy_morphogenesis

- name: Impaired Mitochondrial Matrix Hsp70 Chaperone Function
  biological_scale: MOLECULAR
  description: >
    Mortalin is the ATP-driven motor that pulls precursor proteins through the
    TIM23 translocase into the matrix and folds them on arrival, and it is also
    required for LONP1's proteolytic activity, so a single hypomorphic
    chaperone degrades both arms of matrix proteostasis - import and folding on
    one side, quality-control degradation on the other. This is the node that
    the LONP1 (CODAS) and HSPA9 (EVEN-PLUS) syndromes share and the reason
    their phenotypes overlap.
  biological_processes:
  - preferred_term: protein import into mitochondrial matrix
    modifier: DECREASED
    term:
      id: GO:0030150
      label: protein import into mitochondrial matrix
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  molecular_functions:
  - preferred_term: ATP-dependent protein folding chaperone
    modifier: DECREASED
    term:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found biallelic mutations in HSPA9, the gene that codes for mHSP70/mortalin, another highly conserved mitochondrial chaperone protein essential in mitochondrial protein import, folding, and degradation."
    explanation: >
      Names the three matrix functions the affected chaperone serves, which is
      the content of this node.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its main role is that of a chaperone that participates in the import of proteins from the cytosol to the mitochondrial matrix as well as their folding"
    explanation: >
      States the import-and-fold role directly, without the disease context,
      supporting the GO annotations on this node.
  - reference: PMID:30933555
    reference_title: "Biophysical Consequences of EVEN-PLUS Syndrome Mutations for the Function of Mortalin."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "These results indicate that the surface mutations R126W and Y128C have far-reaching effects that disrupt ATP hydrolysis, interdomain linker binding, and thermostability and increase the propensity for aggregation."
    explanation: >
      The dedicated biophysical study of the two EVEN-PLUS missense alleles,
      by differential scanning fluorimetry, biolayer interferometry, X-ray
      crystallography and ATP hydrolysis assay. DIRECT: the assays are on the
      disease alleles themselves and measure the chaperone functions this node
      asserts are impaired.
  - reference: PMID:30933555
    reference_title: "Biophysical Consequences of EVEN-PLUS Syndrome Mutations for the Function of Mortalin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the R126W and Y128C mutants exert a combinatorial effect through destabilization and aggregation, impairment of interdomain linker binding, and a reduction in NBD-catalyzed ATP hydrolysis"
    explanation: >
      Names the three separable defects and says they combine, which is why
      surface substitutions distant from the ATP site are nonetheless
      hypomorphic rather than neutral.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "expression studies using wild type and mutated HSPA9 were done, showing that the R126W mutation does impact the function of the HSPA9 protein measured by its effects on mitochondrial morphology, mitochondrial membrane potential, the production of reactive oxygen species"
    explanation: >
      A cellular counterpart to the biophysical work above. Graded INDIRECT
      because the experiments were performed in a Parkinson-disease context on
      the heterozygous allele rather than in an EVEN-PLUS model.
  downstream:
  - target: Disturbed Embryonic Morphogenesis
    description: >-
      The step the primary literature calls unexplained. Curated as an edge
      because the genetics and the phenotype both demand it, not because a
      molecular intermediate is known.
    hypothesis_groups:
    - mitochondrial_chaperonopathy_morphogenesis

- name: Disturbed Embryonic Morphogenesis
  biological_scale: ORGANISM
  description: >
    The convergence node, and the one the entry is careful about. The features
    that define EVEN-PLUS - microtia, nasal hypoplasia, abnormal hair
    patterning, anal atresia, sacral and coccygeal agenesis - are patterning
    and outgrowth failures of the embryo, not the end-organ consequences of
    energy shortfall. The primary report makes both halves of that claim
    explicitly: that the features are consequences of disturbed morphogenesis,
    and that the phenotype does not resemble the classical bioenergetic
    mitochondrial diseases.
  biological_processes:
  - preferred_term: embryonic skeletal system morphogenesis
    modifier: DECREASED
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many of the clinical features of EVEN-PLUS syndrome (microtia, small nose, abnormal hair patterns, anal atresia, sacral agenesis) are the consequence of disturbed embryonic morphogenesis."
    explanation: >
      The authors' own reading of the phenotype as developmental, which is the
      organising claim of this node.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of the CODAS syndrome, and even more so that of EVEN-PLUS, do not resemble those of other multisystem mitochondrial diseases"
    explanation: >
      The explicit negative claim that separates this disease from
      bioenergetic mitochondrial disease, and the reason no energy-failure
      node is curated here.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "it was noted that the head and eyes appeared stunted as early as 38 hpf"
    explanation: >
      The only in vivo observation linking hspa9 loss to disturbed craniofacial
      morphogenesis. INDIRECT and MODEL_ORGANISM: the zebrafish crimsonless
      mutant was ascertained for a haematopoietic phenotype, and the
      developmental observation is incidental to that study.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "after 48 hpf all development appeared to halt, including further maturation of the musculature, fins, and internal organs"
    explanation: >
      The second, distinct claim this model supports: the arrest is global
      rather than confined to the craniofacial structures of the preceding
      item, which is what licenses reading hspa9 loss as a general disturbance
      of morphogenesis rather than a regional patterning defect. INDIRECT and
      MODEL_ORGANISM for the same reason as the item above. The result is
      Craven et al. 2005's, summarised here by the EVEN-PLUS report; the
      summarising paper is cited because it is the cache this entry holds.
  downstream:
  - target: Chondro-Osseous Dysplasia of Epiphyses and Vertebral Bodies
    description: >-
      Growth-plate and vertebral-body patterning failure, the skeletal arm of
      the phenotype.
    hypothesis_groups:
    - mitochondrial_chaperonopathy_morphogenesis
  - target: Craniofacial and External Ear Hypoplasia
    description: >-
      First- and second-arch and nasal-skeleton hypoplasia, the craniofacial
      arm.
    hypothesis_groups:
    - mitochondrial_chaperonopathy_morphogenesis

- name: Chondro-Osseous Dysplasia of Epiphyses and Vertebral Bodies
  biological_scale: TISSUE
  description: >
    A spondyloepiphyseal dysplasia in which the epiphyseal component is severe
    and early: proximal femoral epiphyses may remain unossified at five years,
    the femoral heads dislocate, and the distal femur takes a distinctive
    "bifid" shape. The vertebral component is coronal clefting of the vertebral
    bodies, a finding shared with CODAS syndrome and one of the reasons the two
    were confused before molecular testing.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral bone growth
    modifier: DECREASED
    term:
      id: GO:0003416
      label: endochondral bone growth
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 5 yrs, the proximal femoral epiphyses were not ossified, the femoral heads appeared to be dislocated, and the epiphyses at the knee were dysplastic."
    explanation: >
      Documents the severity and the timing of the epiphyseal component in an
      affected child.
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed lateral vertebral clefts, dysplasia of the proximal femurs and acetabula"
    explanation: >
      Documents the vertebral clefting alongside the proximal femoral
      dysplasia in the index patient.

- name: Craniofacial and External Ear Hypoplasia
  biological_scale: TISSUE
  description: >
    A recognisable and reproducible facial gestalt: severe bilateral microtia
    with a patent ear canal, a markedly flat nose from hypoplastic nasal bones
    with triangular nares, arched eyebrows with synophrys, and midface
    hypoplasia. The patency of the ear canal alongside a severely malformed
    pinna is diagnostically useful - it separates this from the branchial-arch
    syndromes in which canal atresia is the rule.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had severe bilateral microtia with apparently normal external ear duct, arched eyebrows with mild synophris, and a very flat nose with nares that were triangular in shape"
    explanation: >
      The defining craniofacial description, including the patent ear canal.
  - reference: PMID:36052765
    reference_title: "Identifying patients with EVEN-plus syndrome using exome sequencing and clinical feature analysis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had global developmental delay and specific facial features, including a prominent forehead, a bilateral auricle deformity, a collapsed nose, a high palatine arch, a short neck and other appearance abnormalities."
    explanation: >
      Independent replication of the facial gestalt in a patient ascertained
      in a different population.

animal_models:
- name: Hspa9 gene-trap knockout mouse
  species: Mouse
  genotype: Hspa9 null (homozygous and heterozygous)
  publication: PMID:25550197
  description: >
    A gene-trap null generated to study HSPA9 haploinsufficiency in
    myelodysplastic syndrome, not to model EVEN-PLUS. Its relevance here is
    the dosage result at both ends: homozygous loss is embryonically lethal,
    and heterozygous loss with 50% residual expression gives viable mice with
    normal basal haematopoiesis and no skeletal or craniofacial phenotype
    reported.
  modeled_mechanisms:
  - target: Disturbed Embryonic Morphogenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Neither available dosage models the disease. Complete loss kills the
      embryo before a malformation phenotype can be assessed, and half dosage
      produces viable mice in which nothing resembling EVEN-PLUS is described.
      Between them they bracket the human condition without reaching it, which
      is a structural reason no mouse model of this syndrome exists.
    limitations: >-
      A null allele on both counts, whereas every human genotype retains
      partial mortalin function. The study was designed around haematopoiesis
      in del(5q) myelodysplastic syndrome and did not phenotype the skeleton
      or craniofacial structures, so the absence of a skeletal phenotype in
      heterozygotes is an absence of reporting as well as, probably, an
      absence of phenotype. A knock-in of the human hypomorphic alleles is the
      experiment this model cannot substitute for.
    evidence:
    - reference: PMID:25550197
      reference_title: "Reduced levels of Hspa9 attenuate Stat5 activation in mouse B cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although homozygous knockout of Hspa9 is embryonically lethal, mice with heterozygous deletion of Hspa9 (Hspa9(+/-)) are viable and have a 50% reduction in Hspa9 expression."
      explanation: >
        The dosage result, and the direct support for this link's claim that
        the model does not reproduce the human syndrome: one dosage is lethal
        before a malformation phenotype can form, the other is unaffected, so
        neither is EVEN-PLUS.
    - reference: PMID:25550197
      reference_title: "Reduced levels of Hspa9 attenuate Stat5 activation in mouse B cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hspa9(+/-) mice have normal basal hematopoiesis and do not develop MDS."
      explanation: >
        Establishes that half dosage is tolerated, which is the observation
        behind the inference that human patients must retain more residual
        function than a null allele provides.

discussions:
- discussion_id: hspa9_chaperone_to_morphogenesis_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disturbed Embryonic Morphogenesis
  prompt: >-
    By what molecular route does partial loss of the mitochondrial matrix
    Hsp70 produce a patterning phenotype - microtia, nasal hypoplasia, anal
    atresia, sacral agenesis - rather than the bioenergetic failure seen in
    classical mitochondrial disease?
  rationale: >
    This is the load-bearing gap in the entry. Causal genetics are settled and
    replicated across four independent reports, and the clinical phenotype is
    consistent; what is missing is any demonstrated intermediate between
    chaperone deficiency and dysmorphogenesis. The primary report says so in
    as many words, and no subsequent paper has closed it. Curating the edge
    from chaperone failure to morphogenesis without recording this gap would
    misrepresent an assumed step as an established one.

    There are candidate routes in the literature that this entry deliberately
    does not curate as mechanism, because nothing tests them in this disease:
    an effect on iron-sulfur cluster biogenesis, in which mortalin is the
    matrix Hsp70 partner; and reported interactions of HSPA9 with FGF1 and
    with SMAD2, which would place it on signalling pathways with obvious
    developmental relevance. They belong in an experiment, not in a
    pathophysiology node.
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pathogenesis of the developmental defects associated with LONP1 and HSPA9 mutations remain unexplained"
    explanation: >
      The authors state the gap directly; this is the citation that licenses
      recording it rather than inferring a mechanism.
  proposed_experiments:
  - experiment_id: hspa9_lineage_conditional_hypomorph
    name: Conditional Hspa9 hypomorph in neural crest and limb-bud mesenchyme
    description: >-
      Introduce the recurrent human missense alleles (p.R126W, p.Y128C) as
      knock-in hypomorphs and delete Hspa9 conditionally in cranial neural
      crest and in limb-bud/sclerotome mesenchyme, then ask whether the
      craniofacial and skeletal phenotypes segregate with lineage rather than
      with tissue energy demand.
    would_support:
    - pathophysiology#Disturbed Embryonic Morphogenesis
    supporting_outcome:
    - >-
      Lineage-restricted loss reproduces microtia, nasal hypoplasia and
      epiphyseal dysplasia with normal respiratory-chain assembly and normal
      lactate, dissociating the malformation phenotype from bioenergetic
      failure.
    would_refute:
    - pathophysiology#Disturbed Embryonic Morphogenesis
    refuting_outcome:
    - >-
      The malformations appear only where oxidative-phosphorylation capacity
      is measurably reduced, and correlate with respiratory-chain deficiency
      rather than with lineage, which would make this an energy-failure
      disease after all.

phenotypes:
- category: Skeletal
  name: Epiphyseal Dysplasia
  frequency: OBLIGATE
  description: >
    The "E" of the acronym and the most consistent radiographic finding.
    Severe at the proximal femur, where ossification may be absent well into
    childhood, with dysplastic knee epiphyses and a "bifid" distal femur.
    OBLIGATE is entailed rather than stated: the 12-case review reports
    dysplastic femoral heads in 100% (12/12), and the femoral head is an
    epiphysis, so a narrower feature at 100% carries the broader node with
    it.
  phenotype_term:
    preferred_term: Epiphyseal dysplasia
    term:
      id: HP:0002656
      label: Epiphyseal dysplasia
  evidence:
  - reference: PMID:26598328
    reference_title: "Mutations in the heat-shock protein A9 (HSPA9) gene cause the EVEN-PLUS syndrome of congenital malformations and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 5 yrs, the proximal femoral epiphyses were not ossified, the femoral heads appeared to be dislocated, and the epiphyses at the knee were dysplastic."
    explanation: >
      Radiographic documentation of the epiphyseal phenotype and its severity.
  - reference: PMID:36052765
    reference_title: "Identifying patients with EVEN-plus syndrome using exome sequencing and clinical feature analysis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her hip joint magnetic resonance imaging (MRI) results showed bilateral femoral head epiphyseal dysplasia with a fork-shaped malformation at the distal end"
    explanation: >
      Independent replication, including the characteristic distal femoral
      shape, on cross-sectional imaging rather than plain film.

- category: Skeletal

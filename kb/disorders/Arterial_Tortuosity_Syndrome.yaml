diagnosis:
- name: Molecular confirmation of biallelic SLC2A10 variants
  description: >-
    Generalized arterial tortuosity in a compatible connective-tissue phenotype
    is confirmed molecularly by identifying biallelic pathogenic SLC2A10
    variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic SLC2A10 variants support molecular confirmation of arterial tortuosity syndrome.
  evidence:
  - reference: PMID:17935213
    reference_title: "Arterial tortuosity syndrome: clinical and molecular findings in 12 newly identified families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 16 patients harbor biallelic SLC2A10 mutations of which nine are novel
      (six missense, three truncating mutations, including a large deletion).
    explanation: >-
      Molecular characterization of the affected cohort directly supports a
      biallelic SLC2A10 diagnostic result.
- name: Vascular imaging surveillance
  description: >-
    Extensive vascular imaging is recommended after diagnosis because tortuosity,
    stenosis, and aneurysm formation can involve multiple arterial beds.
  diagnosis_term:
    preferred_term: diagnostic imaging
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  results: Imaging may show arterial elongation, tortuosity, stenosis, or aneurysm.
  evidence:
  - reference: PMID:29323665

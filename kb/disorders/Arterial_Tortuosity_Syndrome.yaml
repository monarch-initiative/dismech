- name: Pulmonary arterial reconstruction for severe stenosis
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Surgical pulmonary-artery reconstruction may be considered for severe,
    hemodynamically important pulmonary artery stenosis. Evidence is limited to
    selected cases and does not define universal intervention thresholds.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Pulmonary artery stenosis
    term:
      id: HP:0004415
      label: Pulmonary artery stenosis
  evidence:
  - reference: PMID:38987788
    reference_title: "Total pulmonary arterial reconstruction in a patient with arterial tortuosity syndrome affecting the pulmonary artery: a case report and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 2 years old Arabian female child was diagnosed with ATS affecting the
      pulmonary arteries as a newborn, underwent a pulmonary arterial surgical
      reconstruction at the age of 2 years old due to the development of pulmonary
      artery stenosis
    explanation: >-
      This documents reconstruction for severe ATS-associated pulmonary stenosis
      in one child; single-case evidence cannot establish comparative efficacy or
      a general treatment threshold.
  target_mechanisms:
  - target: Arterial wall structural failure and tortuosity
    treatment_effect: BYPASSES
    description: >-
      Reconstruction bypasses or repairs a focal hemodynamically important
      stenotic consequence without correcting the molecular vessel-wall defect.
    evidence:
    - reference: PMID:38987788
      reference_title: "Total pulmonary arterial reconstruction in a patient with arterial tortuosity syndrome affecting the pulmonary artery: a case report and review of the literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After surgical repair the left pulmonary artery has a peak pressure
        gradient of 20 mmHg, with the right pulmonary artery having a peak pressure
        gradient of 20 mmHg.
      explanation: >-
        The post-repair gradient supports focal hemodynamic improvement in one
        patient, not reversal of the inherited arterial-wall mechanism.

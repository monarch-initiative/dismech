    - reference: PMID:16030068
      reference_title: "Effects of gender on hepatic HMG-CoA reductase, cholesterol 7alpha-hydroxylase, and LDL receptor in hereditary analbuminemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hypoalbuminemia is accompanied by hypercholesterolemia in both nephrotic syndrome and hereditary analbuminemia."
      explanation: The rat reproduces the hypercholesterolemia of the human disorder.
- name: Albumin knockout mouse
  species: Mouse
  genotype: Alb-/-
  description: >-
    Engineered albumin-null mouse used to study fatty acid trafficking, glucose
    metabolism and the pharmacokinetics of albumin-based drugs. Like adult
    patients, it tolerates the absence of albumin.
  publication: PMID:35238481
  evidence:
  - reference: PMID:25654695
    reference_title: "Albumin-deficient mouse models for studying metabolism of human albumin and pharmacokinetics of albumin-based drugs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The resulting Alb(-/-) strains are analbuminemic but healthy."
    explanation: The knockout mouse lacks albumin yet is healthy, mirroring the mild adult human phenotype.
  modeled_mechanisms:
  - target: Impaired Plasma Fatty Acid and Ligand Transport
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The mouse work studies fatty acid and glucose handling; it does not report
      the lower-body fat distribution described in human patients.
    evidence:
    - reference: PMID:35238481
      reference_title: "Albumin knockout mice exhibit reduced plasma free fatty acid concentration and enhanced insulin sensitivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results indicate an important role of albumin and plasma FFA concentration in lipid metabolism and glucoregulation."
      explanation: Loss of albumin alters plasma fatty acid transport in the mouse.

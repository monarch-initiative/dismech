diagnosis:
- name: Serum protein electrophoresis and ALB sequencing
  description: >-
    Serum protein electrophoresis shows absent or near-absent albumin with
    increased globulin fractions. Because renal or intestinal protein loss and
    liver disease can also leave albumin very low, sequencing of ALB is needed to
    confirm the diagnosis.
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, due to the existence of other conditions in which the albumin concentrations are very low or null, analysis of the albumin (ALB) gene is necessary for the molecular diagnosis."
    explanation: States why gene analysis is required to confirm the diagnosis.
treatments:
- name: Albumin Infusion
  description: >-
    Intravenous human albumin is used for symptomatic edema, in pregnancy (for
    polyhydramnios and around delivery) and before surgery. It transiently
    lowers cholesterol, improves endothelial function and reduces platelet
    activation; the effect lasts only as long as the infused albumin.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human albumin
      term:
        id: CHEBI:749447
        label: albumin human
  evidence:
  - reference: PMID:24303462
    reference_title: "Treatment of a patient with congenital analbuminemia with atorvastatin and albumin infusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-months of infusion with albumin improved FMD (7%) and reduced serum cholesterol (273 mg/dL), supporting the hypothesis of a compensatory role of hypercholesterolemia."
    explanation: Albumin infusion lowered cholesterol and improved endothelial function in one patient.
  - reference: PMID:28154155
    reference_title: "Pregnancy in a patient with congenital analbuminaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient suffered from polyhydramnios during her pregnancy which was successfully managed with albumin transfusions and had a normal vaginal delivery with no complications in the intrapartum or postpartum period."
    explanation: Albumin infusion used to manage pregnancy in an affected woman.
  target_mechanisms:
  - target: Absent Circulating Albumin
    treatment_effect: RESTORES
    description: Supplies albumin temporarily; it does not correct the ALB defect.
    evidence:
    - reference: PMID:34614277
      reference_title: "Oxidative stress mediated platelet activation in patients with congenital analbuminemia: Effect of albumin infusion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Albumin infusion reduced platelet activation by reducing oxidative stress."
      explanation: Restoring albumin reversed a downstream effect of its absence.
- name: Statin Therapy
  description: >-
    Statins such as atorvastatin or simvastatin are used for the
    hypercholesterolemia. Because the cholesterol rise may be compensatory,
    lowering it has been followed by peripheral edema; combining statins with
    periodic albumin infusion has been proposed. Many drugs are highly
    albumin-bound, so free drug levels and side-effects need watching.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For example, in many cases the hypercholesterolemia has been treated with cholesterol-lowering drugs such as simvastatin or atorvastatin."
    explanation: Statins are the usual treatment for the hypercholesterolemia.
  - reference: PMID:24303462
    reference_title: "Treatment of a patient with congenital analbuminemia with atorvastatin and albumin infusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term, cholesterol-lowering treatment with atorvastatin was associated with the appearance of peripheral edema."
    explanation: Records the edema that followed statin treatment in one patient.
  target_mechanisms:
  - target: Increased Hepatic Cholesterol and Lipoprotein Synthesis
    treatment_effect: INHIBITS
    description: Statins inhibit HMG-CoA reductase, the step whose activity is raised in the analbuminemic rat liver.
- name: Liposuction With Compression Therapy
  description: >-
    For severe lower-limb fat accumulation, leg liposuction followed by
    controlled compression has been used without recurrence at 12 months in a
    single reported case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liposuction
    term:
      id: NCIT:C157908
      label: Liposuction
  evidence:
  - reference: PMID:24090727
    reference_title: "Liposuction for lower limb lipodystrophy in congenital analbuminaemia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have demonstrated that liposuction along with controlled compression therapy is a safe and effective treatment for managing lipodystrophy secondary to congenital analbuminaemia."
    explanation: Single case of successful liposuction with compression.
animal_models:

name: Congenital Analbuminemia
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
parents:
- Inborn Error of Metabolism
- Plasma Protein Deficiency
disease_term:
  preferred_term: congenital analbuminemia
  term:
    id: MONDO:0014449
    label: congenital analbuminemia
synonyms:
- analbuminemia
- congenital analbuminaemia
- CAA
description: >-
  Congenital analbuminemia is an autosomal recessive disorder in which biallelic
  loss-of-function variants in ALB (start-codon, nonsense, frameshift and
  splice-site variants) stop synthesis of serum albumin, leaving it absent or
  present only in trace amounts. Albumin normally supplies about 80% of plasma
  oncotic pressure and is the main circulating carrier of long-chain fatty acids,
  bilirubin, calcium, hormones and many drugs. Its absence is far better
  tolerated than that would suggest, because the liver raises synthesis of other
  plasma proteins (globulins, lipoproteins, transferrin, alpha-1-antitrypsin,
  coagulation factors) and edema-limiting mechanisms operate at the capillary.
  That compensation is incomplete: total plasma protein stays below the
  reference range. Adults usually have hypercholesterolemia with raised LDL,
  mild edema, low blood pressure and fatigue, and some, mostly women, develop a
  lower-body fat distribution described as lipodystrophy. The prenatal and early
  childhood periods are the dangerous ones, with miscarriage, preterm birth
  linked to oligohydramnios and placental abnormalities, and deaths in infancy
  from fluid retention and lower respiratory tract infection. Recent reports
  also describe a prothrombotic state, with platelet activation, raised
  fibrinogen and thrombotic events, and premature coronary disease. The free
  fraction of albumin-bound drugs is several-fold higher than usual, so dosing
  needs care.
notes: >-
  No GeneReviews chapter covers this disorder. It is distinct from the dominant
  ALB missense disorders: familial dysalbuminemic hyperthyroxinemia, which
  changes albumin's thyroxine binding, and bisalbuminemia, which is a benign
  circulating variant. Both leave albumin concentration intact, and neither is
  part of this entry. Miscarriage is reported but not listed as a phenotype,
  because HP:0005268 Miscarriage falls outside the PhenotypeTerm enum.
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.1
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Stated as an incidence of 1 in 1,000,000 live births. Only about 90 cases had
    been detected worldwide when this was written. Frequency is higher in small,
    minimally admixed populations, such as two First Nations communities in
    Saskatchewan.
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Congenital analbuminemia (CAA) is an inherited, autosomal recessive disorder with an incidence of 1:1,000,000 live birth."
    explanation: States the birth incidence that this record normalizes to 0.1 per 100,000.
  - reference: PMID:23612153
    reference_title: "Congenital analbuminaemia: molecular defects and biochemical and clinical aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CAA is rare, but its frequency seems to be significantly higher in restricted and minimally admixed populations."
    explanation: Supports the note that frequency is concentrated in small, minimally admixed populations.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for ALB
    loss-of-function variants. Heterozygous carriers make about half the normal
    amount of albumin and have concentrations near the lower limit of normal.
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In homozygous or compound heterozygous persons the trait leads to the complete absence or to strongly decreased concentrations of serum albumin."
    explanation: States that the trait is expressed in homozygotes and compound heterozygotes.
  - reference: PMID:35163085
    reference_title: "Variations in the Human Serum Albumin Gene: Molecular and Functional Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the heterozygous state, the single normal allele is sufficient to produce approximately half of the normal amount of ALB, and individuals generally have ALB concentrations close to the lower limit of the normal range (approximately 30–35 g/L)."
    explanation: Explains why heterozygous carriers are unaffected, which is what makes the trait recessive.
pathophysiology:
- name: Biallelic ALB Loss of Function
  description: >-
    More than 27 ALB loss-of-function variants are known, nearly all private to
    one family: splice-site variants, nonsense variants, frameshift deletions and
    insertions, and one start-codon variant. Each truncates or prevents
    translation of preproalbumin. Truncated products lacking the signal and
    propeptide are thought to be misrouted and degraded inside the hepatocyte,
    and some transcripts are probably removed by nonsense-mediated decay. One
    frameshift deletion, Kayseri (c.228_229del), accounts for about a third of
    known cases, which suggests a founder effect.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: fatty acid binding
    term:
      id: GO:0005504
      label: fatty acid binding
    modifier: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ALB
    term:
      id: hgnc:399
      label: ALB
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: ALB
      term:
        id: hgnc:399
        label: ALB
    description: >-
      Usually homozygous, often in consanguineous families; compound
      heterozygosity is also reported.
  evidence:
  - reference: PMID:35163085
    reference_title: "Variations in the Human Serum Albumin Gene: Molecular and Functional Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In 28 other cases, the pathogenic variants (mainly affecting splicing, nonsense, and deletions), mostly in the homozygous form, cause a premature stop in the synthesis of the protein and lead to the condition known as congenital analbuminaemia."
    explanation: States that the causative variants are truncating and stop albumin synthesis.
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most are unique, peculiar for each affected family, but one, a frame-shift deletion called Kayseri, has been found to cause about one third of the known cases allowing to presume a founder effect."
    explanation: Supports the allelic heterogeneity and the recurrent Kayseri founder variant.
  downstream:
  - target: Absent Circulating Albumin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31057599
      reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In homozygous or compound heterozygous persons the trait leads to the complete absence or to strongly decreased concentrations of serum albumin."
      explanation: Directly links the biallelic genotype to absent or near-absent serum albumin.
- name: Absent Circulating Albumin
  description: >-
    Serum albumin is absent or below about 1 g/L instead of the normal 35-50
    g/L. This removes the protein that normally makes up 60-65% of plasma
    protein, supplies about 80% of plasma oncotic pressure, and carries
    long-chain fatty acids, bilirubin, calcium, thyroid hormones and many drugs.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:35163085
    reference_title: "Variations in the Human Serum Albumin Gene: Molecular and Functional Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ALB is the most abundant protein (approximately 35–50 gr/L) in plasma, representing 60–65% of total proteins, and contributes to approximately 80% of the oncotic plasma pressure [1]."
    explanation: Gives the normal share of plasma protein and oncotic pressure that absent albumin removes.
  downstream:
  - target: Hypoalbuminemia
    causal_link_type: DIRECT
  - target: Reduced Plasma Oncotic Pressure
    causal_link_type: DIRECT
  - target: Impaired Plasma Fatty Acid and Ligand Transport
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31057599
      reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The low concentrations, or even total absence, of ALB compromises its ability to function as a transport and depot protein for a range of endogenous ligands."
      explanation: States that loss of albumin removes its carrier function.
  - target: Compensatory Upregulation of Non-Albumin Plasma Proteins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31057599
      reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "However, the compensatory increase in other plasma proteins, which partly can take-over the lacking ALB functions, reduce the potential severity of the symptoms."
      explanation: Describes the rise in other plasma proteins as a response to absent albumin. The signal that drives it is not known.
  - target: Platelet Activation and Prothrombotic State
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34614277
      reference_title: "Oxidative stress mediated platelet activation in patients with congenital analbuminemia: Effect of albumin infusion."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Albumin infusion reduced platelet activation by reducing oxidative stress."
      explanation: >-
        Giving albumin back reversed platelet activation in two patients, which
        ties the prothrombotic state to the missing albumin. The inference runs
        through a rescue, so it is indirect.
- name: Reduced Plasma Oncotic Pressure
  description: >-
    Without albumin, colloid osmotic pressure falls. Edema is milder than this
    would predict, because the rise in other plasma proteins partly restores
    oncotic pressure, the hydrostatic gradient from capillary to interstitium
    falls, and capillary protein permeability falls. Lower blood pressure is part
    of this adaptation. The fall is still enough to cause mild edema in adults,
    edema and fluid retention in infants, and it is the proposed basis of
    oligohydramnios and placental abnormalities before birth.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Systemic and pronounced oedema is not seen, because oedema-preventive mechanisms are operative such as mitigation of the effect on the oncotic gradient and lowering of the hydrostatic blood pressure gradient from the capillaries to the interstitial fluids as well as a decrease in the capillary permeability of proteins (Koot et al., 2004)."
    explanation: Describes the oncotic deficit and the capillary mechanisms that limit edema.
  - reference: PMID:17952464
    reference_title: "A boy with congenital analbuminemia and steroid-sensitive idiopathic nephrotic syndrome: an experiment of nature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The unique occurrence helps confirm earlier reports that albumin is not the exclusive factor responsible for maintaining colloid oncotic pressure."
    explanation: Shows that oncotic pressure is only partly lost when albumin is absent, because other proteins contribute.
  downstream:
  - target: Edema
    causal_link_type: DIRECT
  - target: Hypotension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Oligohydramnios
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hydrops fetalis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Compensatory Upregulation of Non-Albumin Plasma Proteins
  description: >-
    The liver raises the plasma concentration of globulins (alpha-1, alpha-2 and
    beta fractions most consistently), transferrin, alpha-1-antitrypsin,
    ceruloplasmin, thyroxine-binding globulin, apolipoprotein B-containing
    lipoproteins and coagulation factors. These proteins take over part of
    albumin's oncotic and carrier roles, which is why adults are mildly affected.
    The compensation is partial: total plasma protein is still below the
    reference range in most patients.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The quantitative most important increase is seen for the globulins, but the concentration is also increased in the case of other non-albumin proteins such as lipoproteins, transferrin, α1-antitrypsin, thyroxin binding globulin and coagulation factors."
    explanation: Lists the plasma proteins that rise in compensation.
  - reference: PMID:36979342
    reference_title: "Alterations in the Plasma Protein Expression Pattern in Congenital Analbuminemia-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Total plasma protein concentration was below the reference range in the vast majority of CAA patients in the analysis, as upregulation of other proteins was not sufficient to prevent the decline of total plasma protein when albumin was absent."
    explanation: A systematic review of case reports showing that the compensation is incomplete.
  - reference: PMID:36979342
    reference_title: "Alterations in the Plasma Protein Expression Pattern in Congenital Analbuminemia-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonetheless, an impressive level of evidence in the literature indicated upregulated plasma levels of multiple globulin classes and various specific proteins which may have metabolic functions in common with albumin."
    explanation: Supports consistent upregulation of globulins and specific carrier proteins.
  downstream:
  - target: Increased Hepatic Cholesterol and Lipoprotein Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated circulating globulin concentration
    causal_link_type: DIRECT
  - target: Hypoproteinemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The rise in other proteins does not make up the lost albumin, so total
      protein stays low.
  - target: Platelet Activation and Prothrombotic State
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fibrinogen and some coagulation factors are among the proteins that rise,
      which is one proposed contributor to the prothrombotic state.
    evidence:
    - reference: PMID:42311911
      reference_title: "Genomic diagnosis and multisystem phenotyping in pediatric congenital analbuminemia: clinical, coagulation, and immune signatures."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations are also biologically plausible in light of previous data linking low serum albumin levels with increased fibrinogen and FVIII levels and with venous TE risk (8)."
      explanation: >-
        The authors connect raised fibrinogen and factor VIII under low albumin
        to thrombotic risk. They present it as a plausible link, not a
        demonstrated one.
- name: Increased Hepatic Cholesterol and Lipoprotein Synthesis
  description: >-
    Cholesterol synthesis and apolipoprotein B-containing lipoprotein output
    rise, producing marked hypercholesterolemia with raised LDL cholesterol and
    apolipoprotein B; HDL cholesterol and triglycerides are usually normal in
    adults. The hypercholesterolemia is generally read as part of the
    compensation, with lipoproteins contributing oncotic pressure and taking
    over some fatty acid transport, and it falls transiently when albumin is
    infused. In the Nagase analbuminemic rat, hepatic HMG-CoA reductase activity
    is increased. The phenotype resembles the lipid response to albumin loss in
    nephrotic syndrome.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The severe hypercholesterolemia may be the result of a compensatory mechanism for the lack of ALB and provides evidence for the possible role of ALB in controlling lipoprotein metabolism (Crook, 2016)."
    explanation: Presents the hypercholesterolemia as a compensatory response to absent albumin.
  - reference: PMID:16030068
    reference_title: "Effects of gender on hepatic HMG-CoA reductase, cholesterol 7alpha-hydroxylase, and LDL receptor in hereditary analbuminemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Plasma cholesterol, triglycerides, and hepatic HMG-CoA reductase activities were greater in both female and male NAR than in SD rats."
    explanation: In the analbuminemic rat, hepatic cholesterol synthesis is increased alongside plasma cholesterol.
  - reference: PMID:24303462
    reference_title: "Treatment of a patient with congenital analbuminemia with atorvastatin and albumin infusion."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-months of infusion with albumin improved FMD (7%) and reduced serum cholesterol (273 mg/dL), supporting the hypothesis of a compensatory role of hypercholesterolemia."
    explanation: Cholesterol fell when albumin was restored, consistent with the lipid rise being a response to its absence.
  downstream:
  - target: Hypercholesterolemia
    causal_link_type: DIRECT
  - target: Increased LDL cholesterol concentration
    causal_link_type: DIRECT
- name: Impaired Plasma Fatty Acid and Ligand Transport
  description: >-
    Albumin is the main plasma carrier of long-chain fatty acids and also binds
    bilirubin, calcium, thyroid hormones and many drugs. In its absence
    apolipoprotein B-100 takes over part of fatty acid transport, serum bilirubin
    binding capacity falls to about a quarter of normal, and the unbound fraction
    of albumin-bound drugs rises. Albumin-knockout mice have lower plasma free
    fatty acids and less hepatic lipid. Ionized calcium is usually normal, though
    hypocalcemia has been described in a child.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: long-chain fatty acid transport
    modifier: DECREASED
    term:
      id: GO:0015909
      label: long-chain fatty acid transport
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The important transport of free fatty acids is partly taken over by an increased concentration of apolipoprotein B-100."
    explanation: Indicates that albumin-dependent fatty acid transport is lost and partly replaced.
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The bilirubin binding capacity in serum has been reported to be only 25% of normal capacity."
    explanation: Quantifies the loss of bilirubin-carrying capacity.
  - reference: PMID:35238481
    reference_title: "Albumin knockout mice exhibit reduced plasma free fatty acid concentration and enhanced insulin sensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In both sexes of albumin knockout mice compared to the wild type mice, significant reductions (p < 0.05) were observed for plasma FFA concentration, hepatic triacylglycerol and diacylglycerol content, blood glucose during the glucose tolerance test, and blood glucose during the insulin tolerance test."
    explanation: In the knockout mouse, removing albumin lowers plasma free fatty acids and hepatic lipid, showing its role in fatty acid trafficking.
  downstream:
  - target: Increased Free Fraction of Albumin-Bound Drugs
    causal_link_type: DIRECT
- name: Increased Free Fraction of Albumin-Bound Drugs
  description: >-
    Drugs that are normally highly albumin-bound circulate with a much larger
    unbound fraction; free fractions of warfarin and diazepam about ten times
    normal have been reported. Effects and toxicity can appear earlier, and
    clearance may rise. Albumin-binding drugs should be used with caution and
    monitored.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The unbound fraction of this type of drugs is usually higher than expected; for example, 10-fold increases in the free fractions of warfarin and diazepam have been reported (Hu et al., 2017)."
    explanation: Reports the rise in free drug fraction in analbuminemia.
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Therefore, albumin-binding drugs should be used with caution and monitored carefully, mainly because of earlier onset of side-effects and toxicity."
    explanation: States the clinical consequence for prescribing.
  - reference: PMID:26643991
    reference_title: "Pharmacokinetics and pharmacodynamics of mycophenolic acid in Nagase analbuminemic rats: Evaluation of protein binding effects using the modeling and simulation approach."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Free fractions of MPA in the control rats and NARs were 2.09 and 24.8%, respectively."
    explanation: In the analbuminemic rat, the free fraction of an albumin-bound drug rises about twelvefold.
- name: Platelet Activation and Prothrombotic State
  description: >-
    Patients have increased platelet aggregation and platelet activation markers
    with raised oxidative stress, and in a pediatric series raised fibrinogen,
    D-dimer and factor XI activity. Protein C and protein S also rise, so the
    balance is not simply procoagulant. Albumin normally binds antithrombin and
    restrains platelet aggregation. Thrombotic events reported include a
    life-threatening cerebral thrombosis in a child and recurrent acute coronary
    syndrome in a young adult.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  evidence:
  - reference: PMID:34614277
    reference_title: "Oxidative stress mediated platelet activation in patients with congenital analbuminemia: Effect of albumin infusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analbuminemic patients displayed higher platelet aggregation, markers of PA and of OS."
    explanation: Two patients had increased platelet aggregation, activation markers and oxidative stress.
  - reference: PMID:42311911
    reference_title: "Genomic diagnosis and multisystem phenotyping in pediatric congenital analbuminemia: clinical, coagulation, and immune signatures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coagulation profiling identified a reproducible prothrombotic signature, including elevated fibrinogen, D-dimer, and strikingly increased FXI activity, with one patient suffering life-threatening cerebral thrombosis."
    explanation: Five children from two families shared a prothrombotic coagulation profile.
  - reference: PMID:35163085
    reference_title: "Variations in the Human Serum Albumin Gene: Molecular and Functional Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several studies suggested that ALB also exerts an anticoagulant effect by binding antithrombin ... and by inhibiting platelet aggregation"
    explanation: Gives the normal anticoagulant functions of albumin that are lost.
  downstream:
  - target: Hypercoagulability
    causal_link_type: DIRECT
phenotypes:
- name: Hypoalbuminemia
  category: Metabolic
  description: >-
    Serum albumin absent or present only in trace amounts. It is usually found on
    serum protein electrophoresis, and ALB sequencing is needed to separate it
    from other causes of very low albumin.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Absent or near-absent serum albumin
    term:
      id: HP:0003073
      label: Hypoalbuminemia
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Affected individuals have a strongly decreased concentration, or complete absence, of serum albumin."
    explanation: The defining laboratory finding.
- name: Hypoproteinemia
  category: Metabolic
  description: Total plasma protein is below the reference range despite the rise in other proteins.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hypoproteinemia
    term:
      id: HP:0003075
      label: Hypoproteinemia
  evidence:
  - reference: PMID:36979342
    reference_title: "Alterations in the Plasma Protein Expression Pattern in Congenital Analbuminemia-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Total plasma protein concentration was below the reference range in the vast majority of CAA patients in the analysis"
    explanation: "\"The vast majority\" of patients in the systematic review supports VERY_FREQUENT."
- name: Elevated circulating globulin concentration
  category: Metabolic
  description: Globulin fractions are increased on electrophoresis, reflecting the compensatory rise in other plasma proteins.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Elevated circulating globulin concentration
    term:
      id: HP:0032311
      label: Elevated circulating globulin concentration
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both types of electrophoresis allow to detect that in the patient ALB is near absent, whereas all the globulin fractions are increased."
    explanation: Increased globulin fractions are the electrophoretic counterpart of absent albumin.
- name: Hypercholesterolemia
  category: Metabolic
  description: >-
    Marked hypercholesterolemia, the most consistent clinical finding in adults,
    with raised apolipoprotein B. It is present in children as well.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hypercholesterolemia
    term:
      id: HP:0003124
      label: Hypercholesterolemia
  evidence:
  - reference: PMID:31057599
    reference_title: "Diagnosis, Phenotype, and Molecular Genetics of Congenital Analbuminemia."
    supports: SUPPORT

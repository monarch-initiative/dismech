  species: Rat
  genotype: Spontaneous homozygous Alb defect
  description: >-
    Spontaneous analbuminemic rat strain with hypercholesterolemia, used to
    study lipid metabolism and the pharmacokinetics of protein-bound drugs.
  publication: PMID:16030068
  modeled_mechanisms:
  - target: Increased Hepatic Cholesterol and Lipoprotein Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-

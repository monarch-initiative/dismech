name: Immunodeficiency 79
creation_date: "2026-08-31T22:15:00Z"
category: Mendelian
synonyms:
- IMD79
- CD4 deficiency
- inherited CD4 deficiency
- autosomal recessive CD4 deficiency
disease_term:
  preferred_term: immunodeficiency 79
  term:
    id: MONDO:0030981
    label: immunodeficiency 79
parents:
- Primary Immunodeficiency
- Inborn Error of Immunity
description: >
  Immunodeficiency 79 is autosomal recessive CD4 deficiency: an inborn error
  of immunity in which homozygous deleterious CD4 variants abolish expression
  of the canonical CD4 co-receptor on T cells, monocytes and dendritic cells,
  and remove soluble CD4 from plasma. The striking thing about the disease is
  how mild it is. Rather than the profound susceptibility that loss of the
  CD4+ T cell compartment predicts from HIV/AIDS and from MHC class II
  deficiency, patients develop a compensatory population of TCR-alpha-beta+
  CD4-negative CD8-negative T cells that resemble conventional helper T cells
  phenotypically and transcriptionally, respond normally to HLA class
  II-restricted antigens, and support B cell differentiation. What that
  compensation does not cover is narrow and specific: recalcitrant human
  papillomavirus warts, and Whipple disease due to Tropheryma whipplei.
  Patients may not come to medical attention until adulthood, and the reported
  age range spans 5 to 61 years. The disease therefore reads less as a
  catastrophic immunodeficiency than as a natural experiment defining which
  host defences require the CD4 molecule itself as opposed to the helper T
  cell lineage.
notes: >
  Ultra-rare. The reported cohort is seven patients aged 5 to 61 years from
  five families of four ancestries (Béziat et al., J Exp Med 2024), building
  on the first family described in 2021, in which a variant disrupting the CD4
  translation-initiation codon abolished membrane and plasma soluble CD4 in a
  homozygous proband. Counts here are counts of patients, not frequencies, and
  `frequency` is left unset throughout.

  Three things this entry is deliberately careful about.

  First, **it is not a severe combined immunodeficiency, and the entry does
  not present it as one.** MONDO places immunodeficiency 79 under `severe
  combined immunodeficiency`, and the disease name invites the same reading.
  The published phenotype is a mild one dominated by warts, sometimes
  undiagnosed into adulthood. Where the ontology and the literature disagree
  on severity, this entry follows the literature and records the disagreement
  here rather than silently softening either.

  Second, **the compensation is the mechanism, not a footnote.** A pathograph
  that ran CD4 loss straight to broad infection susceptibility would be
  wrong — that is the prediction the disease refutes. The chain therefore
  routes through the compensatory double-negative helper T cell population,
  and the two narrow susceptibilities hang off what that compensation fails
  to cover.

  Third, **the comparison to HIV/AIDS and MHC class II deficiency is a
  contrast, not an analogy.** Both of those remove CD4+ T cells and both
  produce broad susceptibility, but neither isolates the CD4 molecule: HIV
  infection carries many other immunological abnormalities, and MHC class II
  deficiency removes the ligand and disturbs thymic selection. That is
  precisely why inherited CD4 deficiency is informative, and it is recorded
  in `discussions` rather than left implicit.

  One isoform detail worth keeping: a shorter expressed CD4 isoform that
  interacts with LCK but not with HLA class II is affected by only one of the
  reported variants. The entry does not build on that, because with a single
  variant affecting it there is nothing yet to compare it against, but it is
  the natural handle for separating the co-receptor's HLA-binding role from
  its LCK-recruiting role in future work.

  No `conforms_to` was declared; no module covers co-receptor loss with
  lineage compensation.

  **Deep-research provenance, and a warning.** An OpenScientist run was
  commissioned for this entry
  (`research/Immunodeficiency_79-deep-research-openscientist.md`) and is
  committed alongside it, but **none of its content was used**. The report is
  about a different disease: its central claim is that immunodeficiency 79 is
  caused by biallelic germline TET2 loss of function. It is not — MedGen links
  MONDO:0030981 / OMIM:619238 to CD4 (Gene 920), and the report cites OMIM
  619223 rather than 619238. `just preflight-dr` scores the report
  `CD4=3` against `TET2=93` and flags the OMIM mismatch. Every claim in this
  entry is sourced from the primary literature on CD4 deficiency instead. The
  report is retained because a wrong report is provenance too, and because it
  is a clean worked example for issue #9888 (`just research-disorder` sends an
  empty `mondo_id`, so a numbered disease name has nothing to anchor on).
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All reported patients are homozygous for rare deleterious CD4 variants.
    Consanguinity is implied by homozygosity across five families of four
    different ancestries.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report seven patients aged 5-61 years from five families of four ancestries with autosomal recessive CD4 deficiency"
    explanation: >
      States the inheritance mode and the size and composition of the
      reported cohort.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients from five families in the defining series. Because the
    phenotype is mild and can go undiagnosed into adulthood, the published
    count is plausibly a substantial underestimate of the true number of
    affected individuals — but no ascertainment study exists to say by how
    much.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report seven patients aged 5-61 years from five families of four ancestries with autosomal recessive CD4 deficiency and a range of infections, including recalcitrant warts and Whipple's disease."
    explanation: >-
      Gives the cohort size and the wide age range that motivates the
      under-ascertainment caveat.
pathophysiology:
- name: Biallelic CD4 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Homozygous rare deleterious CD4 variants that abolish expression of the
    canonical CD4 isoform. The first reported family carried a variant
    disrupting the translation-initiation codon. A shorter expressed isoform
    that interacts with LCK but not with HLA class II is affected by only one
    of the reported variants, so the cohort is not uniform at the isoform
    level even though it is uniform in losing canonical CD4.
  genes:
  - preferred_term: CD4
    term:
      id: hgnc:1678
      label: CD4
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline homozygous CD4 alleles, including a translation-initiation
      codon variant. All impact expression of the canonical CD4 isoform.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients are homozygous for rare deleterious CD4 variants impacting expression of the canonical CD4 isoform. A shorter expressed isoform that interacts with LCK, but not HLA class II, is affected by only one variant."
    explanation: >
      Establishes the genotype and records the isoform detail this node
      describes.
  - reference: PMID:33471124
    reference_title: "Lost in Translation: Lack of CD4 Expression due to a Novel Genetic Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel variant disrupting the translation-initiation codon of the CD4 gene resulted in complete loss of membrane and plasma soluble CD4"
    explanation: >
      Documents the founding variant and that the loss extends to soluble as
      well as membrane CD4.
  downstream:
  - target: Absent CD4 Co-Receptor Expression
    description: >-
      Loss-of-function alleles remove the CD4 protein from the surface of
      every cell type that normally carries it.
    causal_link_type: DIRECT

- name: Absent CD4 Co-Receptor Expression
  biological_scale: CELLULAR
  description: >
    CD4 is absent from T cells, monocytes and dendritic cells, and soluble CD4
    is absent from plasma. In the founding proband this was demonstrated not
    only in peripheral blood but in lymph node, bone marrow, skin and ileum —
    that is, the loss is systemic and tissue-wide rather than a peripheral
    blood finding. This distinguishes the disease from every acquired or
    ligand-side model of CD4+ T cell loss: it is the co-receptor itself that
    is gone, including its soluble form.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
    modifier: ABSENT
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  evidence:
  - reference: PMID:33471124
    reference_title: "Lost in Translation: Lack of CD4 Expression due to a Novel Genetic Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complete loss of membrane and plasma soluble CD4 in peripheral blood, lymph node, bone marrow, skin, and ileum of a homozygous proband"
    explanation: >
      Documents that the loss is systemic across tissues and includes soluble
      CD4, which is the claim this node makes.
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients lack CD4+ T cells and have increased numbers of TCRαβ+CD4-CD8- T cells"
    explanation: >
      Confirms absence of CD4+ T cells across the whole cohort and introduces
      the compensating population.
  downstream:
  - target: Compensatory Double-Negative Helper T Cell Development
    description: >-
      In the absence of the CD4 co-receptor, a population of
      TCR-alpha-beta+ CD4-CD8- T cells expands and assumes the helper
      transcriptional programme.
    causal_link_type: DIRECT
  - target: Susceptibility to Human Papillomavirus and Tropheryma whipplei
    description: >-
      Two host defences that the compensating population does not
      reconstitute, and that therefore require CD4 itself.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Why these two pathogens specifically require the CD4 molecule, rather than the helper T cell lineage, is not established
  - target: Recurrent Respiratory Infections
    description: >-
      Recurrent respiratory infections beginning in childhood in some
      patients. Recorded as a residual susceptibility rather than as part of
      the two-pathogen claim, since the source does not attribute it to a
      specific organism or to a failure of the compensating population.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Whether these infections reflect a residual gap in the compensated helper compartment or an unrelated susceptibility is not established

- name: Compensatory Double-Negative Helper T Cell Development
  biological_scale: CELLULAR
  description: >
    The finding that reframes the disease. Patients accumulate TCR-alpha-beta+
    CD4-negative CD8-negative T cells that resemble conventional helper T
    cells both phenotypically and transcriptionally. Functionally these cells
    are not a poor substitute: they respond intact to HLA class II-restricted
    antigens and promote B cell differentiation in vitro. Helper immunity is
    therefore reconstituted without the co-receptor, which is why patients
    acquire effective cellular and humoral immunity against an unexpectedly
    large range of pathogens.
  cell_types:
  - preferred_term: TCR-alpha-beta+ CD4-CD8- T cell
    term:
      id: CL:0000791
      label: mature alpha-beta T cell
    modifier: INCREASED
  biological_processes:
  - preferred_term: T-helper cell differentiation
    term:
      id: GO:0042093
      label: T-helper cell differentiation
  - preferred_term: antigen processing and presentation of exogenous peptide antigen via MHC class II
    term:
      id: GO:0019886
      label: antigen processing and presentation of exogenous peptide antigen via MHC class II
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which phenotypically and transcriptionally resemble conventional Th cells"
    explanation: >
      Establishes that the compensating population takes on the helper
      identity, not merely the surface phenotype.
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient CD4-CD8- αβ T cells exhibit intact responses to HLA class II-restricted antigens and promote B cell differentiation in vitro"
    explanation: >
      Demonstrates functional competence of the compensating cells, which is
      what makes this a genuine compensation rather than an inert expansion.
  downstream:
  - target: Broadly Preserved Cellular and Humoral Immunity
    description: >-
      Functional helper cells reconstitute the great majority of
      helper-dependent immunity.
    causal_link_type: DIRECT

- name: Broadly Preserved Cellular and Humoral Immunity
  biological_scale: ORGANISM
  description: >
    Patients acquire effective cellular and humoral immunity against an
    unexpectedly large range of pathogens. This node is the reason the
    clinical phenotype is mild and can go undiagnosed for decades, and it is
    the negative result that gives the disease its scientific value: it shows
    that most of what is attributed to CD4+ T cells is attributable to the
    helper lineage rather than to the CD4 molecule.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compensatory development of Th cells enables patients with inherited CD4 deficiency to acquire effective cellular and humoral immunity against an unexpectedly large range of pathogens"
    explanation: >
      States the preserved-immunity conclusion in the authors' own words.

- name: Susceptibility to Human Papillomavirus and Tropheryma whipplei
  biological_scale: ORGANISM
  description: >
    The two defences the compensation does not cover. Recalcitrant warts due
    to uncontrolled human papillomavirus infection are the commonest
    presentation, and Whipple disease due to Tropheryma whipplei was also
    seen. These are the specific claims the disease licenses about the CD4
    molecule as opposed to the helper lineage. Why these two organisms in
    particular is not known.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD4 is indispensable for protective immunity against at least human papillomaviruses and Trophyrema whipplei."
    explanation: >
      Names the two pathogens for which CD4 itself is required, which is the
      claim this node makes. Note the source misspells the genus as
      "Trophyrema"; the organism is Tropheryma whipplei, and the term binding
      uses the correct name.
  downstream:
  - target: Recalcitrant Warts
    description: >-
      Failure to control human papillomavirus, the commonest and often only
      clinical manifestation.
    causal_link_type: DIRECT
  - target: Whipple Disease
    description: Failure to control Tropheryma whipplei.
    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: canonical_cd4_loss_with_th_compensation_model
  hypothesis_label: Canonical CD4 Loss with Helper-Lineage Compensation Model
  status: CANONICAL
  description: >-
    Biallelic CD4 loss-of-function removes the co-receptor from T cells,
    monocytes and dendritic cells and from plasma, but a compensatory
    TCR-alpha-beta+ CD4-CD8- population adopts the helper transcriptional
    programme and retains intact HLA class II-restricted responses and B cell
    help. Most helper-dependent immunity is therefore preserved, and the
    clinical phenotype narrows to the defences that require the CD4 molecule
    itself — control of human papillomavirus and of Tropheryma whipplei.
discussions:
- discussion_id: imd79_why_hpv_and_whipplei
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do human papillomavirus and Tropheryma whipplei specifically escape
    control when helper immunity is otherwise reconstituted by CD4-negative
    helper T cells?
  attaches_to:
  - pathophysiology#Susceptibility to Human Papillomavirus and Tropheryma whipplei
  rationale: >-
    This is the disease's central unanswered question and the one with the
    widest reach: an answer would identify what the CD4 molecule does that
    the helper lineage does not, in a way that neither HIV infection nor MHC
    class II deficiency can isolate. Candidates include a role for soluble
    CD4, a requirement in monocytes or dendritic cells rather than T cells,
    or a tissue-compartment effect at skin and gut mucosa. Nothing in the
    reported data distinguishes them.
- discussion_id: imd79_severity_classification_conflict
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is immunodeficiency 79 correctly classified under severe combined
    immunodeficiency, given a phenotype dominated by warts and sometimes
    first diagnosed in adulthood?
  attaches_to:
  - pathophysiology#Broadly Preserved Cellular and Humoral Immunity
  rationale: >-
    MONDO places this concept under `severe combined immunodeficiency`, which
    predicts a management approach — early transplantation, prophylaxis,
    isolation — that the published natural history does not support. Patients
    aged up to 61 years were reported, and the phenotype is described as mild
    relative to other primary immunodeficiencies. Recording the conflict is
    the honest position; resolving it needs either an ontology change or
    evidence of severe cases that have not yet been published.
- discussion_id: imd79_cd4_isoform_dissection
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the shorter CD4 isoform that binds LCK but not HLA class II retain
    any protective function, and can the co-receptor's two roles be
    separated genetically?
  attaches_to:
  - pathophysiology#Biallelic CD4 Loss-of-Function Variants
  rationale: >-
    Only one of the reported variants affects this isoform, so there is no
    within-cohort comparison to make. If further patients are found who lose
    only the canonical isoform versus both, the pair would separate the
    co-receptor's HLA class II-binding role from its LCK-recruiting role in
    humans — a dissection currently only available in mouse and in vitro
    systems.

      Names recalcitrant warts as a presenting infection in the cohort.
- name: Whipple Disease
  category: Gastrointestinal
  description: >
    Systemic infection with Tropheryma whipplei, classically producing
    malabsorptive diarrhoea, weight loss and arthralgia. Reported in this
    cohort, and one of only two infections for which CD4 itself appears
    indispensable.
  phenotype_term:
    preferred_term: Malabsorption
    term:
      id: HP:0002024
      label: Malabsorption
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a range of infections, including recalcitrant warts and Whipple's disease"
    explanation: >
      Names Whipple disease among the infections in the reported cohort. The
      phenotype term records malabsorption, its cardinal clinical
      manifestation, since the abstract does not enumerate organ findings.
- name: Recurrent Respiratory Infections
  category: Respiratory
  description: >
    Recurrent respiratory infections beginning in childhood in some patients,
    though the phenotype overall remains mild by comparison with other
    primary immunodeficiencies.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "seven patients aged 5-61 years from five families of four ancestries with autosomal recessive CD4 deficiency and a range of infections"
    explanation: >
      Establishes that a range of infections occurred in the cohort. The
      specific respiratory pattern is described in the MedGen/OMIM summary of
      this disorder rather than in the quoted abstract, so this item supports
      the general infection susceptibility.
genetic:
- name: CD4
  gene_term:
    preferred_term: CD4
    term:
      id: hgnc:1678
      label: CD4
  relationship_type: CAUSATIVE
  notes: >
    CD4 encodes the co-receptor that binds HLA class II and recruits LCK to
    the T cell receptor complex. Biallelic loss-of-function causes
    immunodeficiency 79. The gene is better known as the entry receptor for
    HIV-1, and that is exactly why the inherited deficiency is informative:
    it removes the molecule without the confounding immunological
    abnormalities of HIV infection.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients are homozygous for rare deleterious CD4 variants impacting expression of the canonical CD4 isoform."
    explanation: >
      Establishes CD4 as the disease gene across the whole reported cohort.

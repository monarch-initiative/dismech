genetic:
- name: CD4
  gene_term:
    preferred_term: CD4
    term:
      id: hgnc:1678
      label: CD4
  relationship_type: CAUSATIVE
  notes: >
    CD4 encodes the co-receptor that binds HLA class II and recruits LCK to
    the T cell receptor complex. Biallelic loss-of-function causes
    immunodeficiency 79. The gene is better known as the entry receptor for
    HIV-1, and that is exactly why the inherited deficiency is informative:
    it removes the molecule without the confounding immunological
    abnormalities of HIV infection.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients are homozygous for rare deleterious CD4 variants impacting expression of the canonical CD4 isoform."
    explanation: >
      Establishes CD4 as the disease gene across the whole reported cohort.
infectious_agent:
- name: Human papillomavirus
  infectious_agent_term:
    preferred_term: Human papillomavirus
    term:
      id: NCBITaxon:10566
      label: Human papillomavirus
  description: >-
    Uncontrolled HPV infection producing recalcitrant cutaneous warts, the
    commonest presenting feature. One of the two organisms for which the
    cohort report concludes CD4 itself, rather than the helper T cell lineage,
    is indispensable; that conclusion is stated as "at least" these two, so it
    is a floor rather than an exhaustive list.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD4 is indispensable for protective immunity against at least human papillomaviruses and Trophyrema whipplei."
    explanation: >-
      Names human papillomavirus as an organism whose control requires CD4.
- name: Tropheryma whipplei
  infectious_agent_term:
    preferred_term: Tropheryma whipplei
    term:
      id: NCBITaxon:2039
      label: Tropheryma whipplei
  description: >-
    Causative organism of Whipple disease, reported in this cohort and the
    second infection for which CD4 itself appears indispensable. Note the
    source misspells the genus as "Trophyrema"; the organism is Tropheryma
    whipplei.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a range of infections, including recalcitrant warts and Whipple's disease"
    explanation: >-
      Documents Whipple disease in the reported cohort.

diagnosis:
- name: Flow cytometry for surface CD4
  description: >
    Absence of CD4 on T cells, monocytes and dendritic cells. The finding is
    unmistakable once looked for; the difficulty is that a patient whose only
    complaint is recurrent warts is unlikely to have lymphocyte
    immunophenotyping requested. Expect a compensatory TCR-alpha-beta+
    CD4-CD8- population rather than simple T cell lymphopenia.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients lack CD4+ T cells and have increased numbers of TCRαβ+CD4-CD8- T cells"
    explanation: >
      Describes the immunophenotypic pattern that makes the diagnosis.
- name: CD4 sequencing
  description: >
    Molecular confirmation. Worth distinguishing from idiopathic CD4
    lymphocytopenia, which is an acquired non-Mendelian phenotype of reduced
    CD4+ T cell counts, and from MHC class II deficiency, in which CD4 is
    present but its ligand is not.
  evidence:
  - reference: PMID:33471124
    reference_title: "Lost in Translation: Lack of CD4 Expression due to a Novel Genetic Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This inherited CD4 knockout disease illustrates the clinical and immunological features of a complete deficiency of any functional component of CD4 and its similarities and differences with other clinical models of primary or acquired loss of CD4+ T cells."
    explanation: >
      Frames the differential against other primary and acquired causes of
      CD4+ T cell loss, which is what this diagnostic step resolves.

treatments:
- name: Doxycycline and Hydroxychloroquine for Whipple Disease
  description: >
    Combination antimicrobial therapy for Tropheryma whipplei infection,
    effective in the one reported Whipple disease patient with a durable
    response — his PCR for T. whipplei in blood, saliva and stool was
    negative five years later. This is the only intervention in the published
    cohort with a documented outcome, and it treats one of the two
    susceptibilities the entry is built around rather than the underlying
    co-receptor defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
  target_mechanisms:
  - target: Susceptibility to Human Papillomavirus and Tropheryma whipplei
    treatment_effect: MODULATES
    description: >-
      Clears the organism the host cannot control. It does not restore CD4 or
      alter the underlying susceptibility, so it addresses the consequence
      rather than the mechanism.
  evidence:
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with doxycycline and hydroxychloroquine was effective."
    explanation: >
      Documents the regimen and its effectiveness in the reported patient.
  - reference: PMID:38557723
    reference_title: "Helper T cell immunity in humans with inherited CD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2022, his PCR for T. whipplei in blood, saliva, and stool was negative."
    explanation: >
      Documents the durability of the response five years after
      presentation.


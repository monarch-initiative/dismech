    reference_title: "The expanding clinical phenotype of germline ABL1-associated congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expanding the phenotypic spectrum of CHDSKM to include hearing impairment, lipodystrophy-like features, renal hypoplasia, and distinct ocular abnormalities."
    explanation: Distinct ocular abnormalities in the documented spectrum are the indication for baseline eye examination.
- name: Genetic Counseling and Cascade Testing
  description: >
    Counseling for the recurrence risk from an affected heterozygous parent,
    with cascade testing of at-risk relatives once a familial variant is
    identified. Because the condition is autosomal dominant, each pregnancy of
    an affected heterozygous parent carries a one-in-two transmission risk; the
    documented father-to-child and mother-to-child transmissions of p.Tyr245Cys
    make this a real rather than theoretical counseling scenario. Counseling
    must convey that expressivity is variable, so severity in an affected child
    cannot be predicted from the parent's phenotype, and that most probands to
    date have carried de novo variants. Once a familial variant is known,
    prenatal diagnosis and preimplantation genetic testing for monogenic
    disease are technically available reproductive options.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family 3, p.Tyr245Cys was found to be inherited from the similarly affected father."
    explanation: >
      Documented parent-to-child transmission establishes the recurrence risk
      that genetic counseling addresses.
diagnosis:
- name: Exome or Genome Sequencing Identifying a Heterozygous ABL1 Missense Variant
  description: >
    There are no consensus clinical diagnostic criteria and no biochemical
    biomarker for CHDSKM; diagnosis is molecular. Both the founding cohort and
    the expanded series were identified by exome sequencing after targeted
    testing for known disease genes was negative. The practical trigger for
    testing is syndromic congenital heart disease plus digital or skeletal
    anomalies with the characteristic narrow facies and growth restriction.
    Interpretation should weigh whether the missense allele lies in a known
    autoinhibitory region consistent with the gain-of-function mechanism;
    functional kinase assays remain research tools, not validated clinical
    tests.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing and Sanger fill-in of regions poorly covered by exome sequencing did not identify any causal variants in known disease genes"
    explanation: Establishes exome sequencing as the diagnostic route in the founding cohort.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a series of \nsix new unrelated individuals with heterozygous missense variants in ABL1 \n(including four novel variants) identified via whole exome sequencing."
    explanation: Confirms exome sequencing as the diagnostic modality in the expanded series.
differential_diagnoses:
- name: Marfan Syndrome
  description: >
    The marfanoid habitus, arachnodactyly, joint laxity, high-arched palate,
    aortic root dilatation, and spontaneous pneumothorax of CHDSKM overlap
    Marfan syndrome closely enough that Marfan was the working differential
    diagnosis in one of the four founding families, and CHDSKM patients are
    still reached through connective-tissue gene panels.
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  distinguishing_features:
  - CHDSKM adds congenital septal heart defects, digital contractures and camptodactyly, intrauterine growth restriction and failure to thrive, microcephaly, and hearing impairment, none of which are Marfan features.
  - Ectopia lentis, a cardinal Marfan diagnostic feature, has not been reported in any published CHDSKM patient, although "distinct ocular abnormalities" of unspecified type are part of the CHDSKM spectrum, so this discriminator should be applied with care.
  - The TGF-beta dysregulation that characterises FBN1-related aortopathy was tested in CHDSKM and not found (SMAD2/SMAD3 phosphorylation unchanged).
  - Causal gene ABL1 rather than FBN1.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to cardiac and skeletal manifestations, differential diagnoses commonly included connective tissue disorders, e.g. Marfan syndrome in families 3."
    explanation: Marfan syndrome was the clinical differential in a founding CHDSKM family.
- name: Loeys-Dietz Syndrome
  description: >
    Loeys-Dietz syndrome shares the long face, high-arched palate,
    microretrognathia, pectus deformity, scoliosis, arachnodactyly, joint
    laxity, and aortic root aneurysm, and was named alongside
    Shprintzen-Goldberg syndrome as a formal differential in the original
    CHDSKM report.
  disease_term:
    preferred_term: Loeys-Dietz syndrome
    term:
      id: MONDO:0018954
      label: Loeys-Dietz syndrome
  distinguishing_features:
  - Loeys-Dietz is caused by TGFBR1, TGFBR2, SMAD3, TGFB2, or TGFB3 variants with demonstrably dysregulated TGF-beta signalling; CHDSKM shows no SMAD2/SMAD3 phosphorylation change.
  - Loeys-Dietz carries a high risk of aggressive aortic dissection requiring early prophylactic surgery; the CHDSKM aortic natural history is undefined and may be more indolent.
  - Arterial tortuosity, hypertelorism, and bifid uvula are characteristic of Loeys-Dietz and have not been reported in published CHDSKM patients.
  - CHDSKM adds septal defects, digital contractures, growth failure, and hearing loss.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential diagnosis of the newly described syndrome includes Shprintzen-Goldberg syndrome (dolichostenomelia, arachnodactyly, pectus deformity, scoliosis, aortic root enlargement, and high-arched palate) and Loeys-Dietz syndrome"
    explanation: Loeys-Dietz named as a formal differential in the original report.
- name: Van den Ende-Gupta Syndrome
  description: >
    Van den Ende-Gupta syndrome (VDEGS) is the differential that most often
    causes genuine molecular misclassification rather than merely clinical
    confusion: three individuals with classical VDEGS features and negative
    SCARF2 testing were subsequently found to carry pathogenic ABL1 variants,
    and their phenotype was reclassified as CHDSKM.
  disease_term:
    preferred_term: van den Ende-Gupta syndrome
    term:
      id: MONDO:0010959
      label: van den Ende-Gupta syndrome
  distinguishing_features:
  - VDEGS is autosomal recessive and caused by biallelic SCARF2 variants; CHDSKM is autosomal dominant and caused by heterozygous ABL1 gain-of-function missense alleles.
  - The shared clinical handles are arachnodactyly and blepharophimosis with distinctive facial and skeletal features.
  - Because the two overlap, individuals with arachnodactyly plus blepharophimosis should have echocardiography and testing of both SCARF2 and ABL1.
  evidence:
  - reference: PMID:33783941
    reference_title: "Further delineation of van den Ende-Gupta syndrome: Genetic heterogeneity and overlap with congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three were found to have pathogenic \nABL1 variants using whole exome sequencing (WES) or whole genome sequencing \n(WGS). Their phenotype was consistent with the congenital heart disease and \nskeletal malformations syndrome (CHDSKM), which has been associated with ABL1 \nvariants."
    explanation: Documents actual reclassification of VDEGS-phenotype patients as CHDSKM.
  - reference: PMID:33783941
    reference_title: "Further delineation of van den Ende-Gupta syndrome: Genetic heterogeneity and overlap with congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with the combination of arachnodactyly and blepharophimosis should undergo \nechocardiography while awaiting results of molecular testing due to the \noverlapping physical features of VDEGS and CHDSKM."
    explanation: States the practical diagnostic consequence of the VDEGS-CHDSKM overlap.
- name: Human ABL1 Deficiency Syndrome
  description: >
    The allelic counterpart of CHDSKM at the same locus. Biallelic
    loss-of-function ABL1 variants cause a distinct recognisable syndrome of
    multiple congenital malformations and facial dysmorphism that is described
    as opposite to CHDSKM in many respects - the clearest possible demonstration
    that ABL1 activity must be held within a narrow band during development, and
    the reason the two must never be merged into one entity.
  distinguishing_features:
  - ABL1 deficiency syndrome is autosomal recessive, arises in consanguineous families, and is caused by homozygous loss-of-function alleles.
  - CHDSKM is autosomal dominant and caused by heterozygous gain-of-function missense alleles.
  - The dysmorphic gestalts are reported as opposite in many features.
  - Molecular reports must therefore state zygosity and predicted functional direction, not merely that an ABL1 variant is present.
  evidence:
  - reference: PMID:38743093
    reference_title: "Human ABL1 deficiency syndrome (HADS) is a recognizable syndrome distinct from ABL1-related congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The associated phenotype is multiple \ncongenital malformations and distinctive facial dysmorphism that are opposite in \nmany ways to CHDSKM. We suggest that a tight balance of ABL1 activity is \nrequired during embryonic development and that both germline gain of function \nand loss of function variants result in distinctively different allelic \ncongenital malformation disorders."
    explanation: Establishes ABL1 deficiency syndrome as a distinct allelic disorder, not a CHDSKM variant.
discussions:
- discussion_id: chdskm_lineage_route_to_malformation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Through which developmental cell lineages and downstream effectors does
    ABL1 kinase hyperactivity produce the specific CHDSKM malformation set
    (cardiac septa and outflow tract, digits, axial skeleton, aortic root)?
  attaches_to:
  - "pathophysiology#Increased Substrate Tyrosine Phosphorylation"
  - "pathophysiology#Disrupted Cardiac Septation and Outflow Tract Development"
  rationale: >
    Steps 1 to 3 of the causal chain - autoinhibition loss, kinase
    hyperactivity, increased substrate phosphorylation - are experimentally
    solid and independently replicated. The step from generalised
    phosphotyrosine excess to a specific, reproducible malformation pattern is
    entirely inferential. The only concrete effector nominations come from a
    single phosphoproteomic experiment in a transfected cell line (UFD1, AXIN1,
    ATRX), and even the cell types involved - cardiomyocytes, endocardial and
    valvular interstitial cells, cardiac neural crest derivatives,
    chondrocytes, craniofacial mesenchyme - remain plausible candidates rather
    than demonstrated targets. This is why the pathophysiology edges leading
    out of the phosphorylation node are typed INDIRECT_UNKNOWN_INTERMEDIATES
    and why no cell types are asserted on the cardiac node.
  proposed_experiments:
  - experiment_id: chdskm_lineage_restricted_knockin
    name: Lineage-restricted CHDSKM allele knock-in in mouse
    description: >
      Conditional knock-in of a recurrent human allele (p.Tyr245Cys or
      p.Glu528Lys) restricted to cardiac mesoderm, cardiac neural crest,
      endocardium, and limb/skeletal mesenchyme, with staged phenotyping of
      septation and outflow tract development.
    decision_criterion: >
      A lineage in which the knock-in reproduces septal or outflow tract
      defects identifies the cell population through which kinase
      hyperactivity acts.
  - experiment_id: chdskm_ipsc_lineage_phosphoproteomics
    name: Phosphoproteomics in disease-relevant differentiated cell types
    description: >
      Differentiate patient-derived iPSCs to cardiomyocytes and chondrocytes
      and repeat phosphoproteomic profiling in those lineages rather than in
      HEK293T, testing whether UFD1, AXIN1, and ATRX hyperphosphorylation
      reproduces outside the overexpression system.
    decision_criterion: >
      Reproduction of the effector hyperphosphorylation in a developmentally
      relevant lineage would upgrade those nominations from hypothesis to
      candidate mechanism.
  evidence:
  - reference: PMID:33075386
    reference_title: "Phosphorylated proteome analysis of a novel germline ABL1 mutation causing an autosomal dominant syndrome with ventricular septal defect."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "AXIN1 and ATRX may be important in elucidating the mechanisms of other phenotypes, such as finger contracture and failure to thrive. Verification of these hypotheses would lead to further understanding of the pathophysiology and the development of treatment methods."
    explanation: >
      The authors explicitly frame the effector assignments as unverified
      hypotheses requiring further work.
- discussion_id: chdskm_model_organism_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Do the available Abl1 mouse models, which are all loss-of-function, have
    any translational validity for a human heterozygous gain-of-function
    syndrome?
  attaches_to:
  - "pathophysiology#ABL1 Autoinhibitory Regulatory Core Disruption"
  rationale: >
    Every published Abl1 mouse model is a null or truncation allele. Their
    phenotypes - growth delay, cardiac hyperplasia, osteoporosis, lymphopenia,
    perinatal lethality - establish that ABL1 matters in development but point
    in the opposite functional direction from the human disease. The mismatch
    is not incidental: the original authors specifically re-examined
    ventricular wall thickness in their patients and confirmed the absence of
    the cardiac hyperplasia seen in the knockout mice, attributing the
    difference to increased versus abolished kinase activity. Mouse
    heterozygotes are largely unaffected, so there is no dosage model either.
    No knock-in model of a recurrent human CHDSKM allele has been reported.
  proposed_experiments:
  - experiment_id: chdskm_knockin_versus_null
    name: CHDSKM knock-in mouse compared against Abl1 null
    description: >
      Generate constitutive and conditional knock-in mice carrying the human
      p.Tyr245Cys or p.Glu528Lys allele, assess whether cardiac septal defects,
      digital contractures, growth restriction, and aortic root dilatation are
      recapitulated, and compare directly against Abl1 null animals in the same
      genetic background.
    decision_criterion: >
      Recapitulation of the human malformation set by the knock-in, with a
      phenotype distinct from the null, would establish a valid model and
      confirm the functional direction of the human alleles.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abl1 knockout mice have growth delay, cardiac hyperplasia and osteoporosis"
    explanation: Describes the loss-of-function mouse phenotype available as a model.
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We re-evaluated the ventricular wall thickness of our patients and confirmed that there is no cardiac hyperplasia"
    explanation: >
      Explicitly documents that the mouse cardiac phenotype is not reproduced
      in human patients - the core of the model mismatch.
- discussion_id: chdskm_malignancy_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Do germline ABL1 gain-of-function alleles confer an increased lifetime risk
    of haematological or other malignancy?
  attaches_to:
  - "pathophysiology#Constitutive ABL1 Tyrosine Kinase Hyperactivity"
  rationale: >
    ABL1 is a proto-oncogene and its constitutive activation in the somatic
    BCR::ABL1 fusion drives chronic myeloid leukaemia, so a germline activating
    allele raises an obvious question. No malignancy has been reported in any
    CHDSKM patient, but the total described cohort is very small and mostly
    young, so absence of events is weak evidence of absence of risk. There is a
    mechanistic argument for reassurance - disruption of myristoyl binding alone
    may not activate ABL1 enough to drive malignancy because two other
    autoinhibitory linchpins remain intact, whereas BCR::ABL1 loses both the
    myristoyl group and the N-terminal brace - but this is reasoning, not data.
    Notably, the authors of the largest functional series report that none of
    the activating germline variants they describe has been associated with
    somatic tyrosine kinase inhibitor resistance in leukaemia - though one
    residue, Ala452, is shared between the germline and somatic settings, so
    the separation is not absolute.
  proposed_experiments:
  - experiment_id: chdskm_longitudinal_registry
    name: Longitudinal CHDSKM malignancy registry
    description: >
      Establish a prospective registry capturing routine blood counts and
      malignancy events in molecularly confirmed CHDSKM patients into
      adulthood, alongside aortic dimensions, hearing, growth, and
      neurodevelopment.
    decision_criterion: >
      Accumulated person-years without haematological malignancy, or an
      excess of events, would for the first time bound the lifetime risk.
  - experiment_id: chdskm_hspc_transformation_assay
    name: Transformation capacity of germline-allele haematopoietic cells
    description: >
      Assess whether patient-derived or engineered haematopoietic stem and
      progenitor cells carrying the germline CHDSKM alleles show clonal
      advantage or transformation capacity relative to BCR::ABL1-expressing
      controls.
    decision_criterion: >
      Absence of clonal advantage would support the mechanistic argument that
      myristoyl-pocket disruption alone is insufficient for transformation.
  evidence:
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No patients with the ABL1 skeletal and cardiac malformation syndrome described here or elsewhere are reported to have haematological malignancy, but longitudinal follow up of these patients will be required to better determine this."
    explanation: States both the absence of observed malignancy and the insufficiency of current follow-up.
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Malignancies have not been detected in any of the affected individuals with ABL1 germline variants, but as they cause increased phosphorylation and possibly increased kinase activity of this proto-oncogene, it may be prudent to perform systematic clinical screening for ABL1-associated cancers in the newly identified individuals."
    explanation: >
      The original authors' recommendation for cancer screening in the face of
      unquantified risk.

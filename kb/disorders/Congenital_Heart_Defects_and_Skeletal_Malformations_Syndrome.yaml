name: Congenital Heart Defects and Skeletal Malformations Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >
  Congenital heart defects and skeletal malformations syndrome (CHDSKM;
  OMIM 617602) is an ultra-rare autosomal dominant multisystem developmental
  disorder caused by heterozygous germline gain-of-function missense variants
  in ABL1, the non-receptor tyrosine kinase best known as the 3' partner of the
  somatic BCR::ABL1 fusion of chronic myeloid leukaemia. The best-characterised
  pathogenic alleles fall in autoinhibitory regulatory elements of the protein -
  the myristoyl-binding pocket of the kinase domain, the SH2-kinase linker, and
  the C-terminal alpha-I helix - so that the assembled, low-activity
  SH3-SH2-kinase regulatory core is destabilised and kinase activity rises;
  several later-reported alleles have not been mapped to any defined regulatory
  element, so the clustering is a property of the well-studied alleles rather
  than of the whole allelic series. The resulting
  clinical picture combines congenital heart disease (atrial and ventricular
  septal defects, patent ductus arteriosus, pulmonic stenosis, and aortic root
  dilatation), skeletal and digital malformations (camptodactyly, finger
  contractures, scoliosis, pectus excavatum, hindfoot deformity), a
  characteristic narrow face with small pointed chin, prenatal and postnatal
  growth failure, hearing impairment, and variable developmental delay and
  microcephaly. Because the marfanoid habitus, joint laxity, aortic root
  dilatation, and spontaneous pneumothorax overlap heritable connective-tissue
  disease, CHDSKM is frequently first considered as Marfan, Loeys-Dietz, or
  Shprintzen-Goldberg syndrome; the entity is defined molecularly rather than
  by the descriptive cardiac-plus-skeletal label it carries.
synonyms:
- CHDSKM
- ABL1-related congenital heart defects and skeletal malformations syndrome
- ABL1 malformation syndrome
- marfanoid habitus-facial dysmorphism-skeletal abnormality-heart defect syndrome
disease_term:
  preferred_term: congenital heart defects and skeletal malformations syndrome
  term:
    id: MONDO:0060532
    label: congenital heart defects and skeletal malformations syndrome
notes: >
  Identity anchors used for the Named Entity Confusion (NEC) preflight before
  any deep-research content was accepted: MONDO:0060532, OMIM:617602,
  Orphanet:643503, and the MONDO structured gene relationship
  RO:0004003 hgnc:76 (ABL1). The descriptive label "congenital heart defects
  and skeletal malformations" is shared, as a phenotype pair, with several
  well-known but mechanistically unrelated syndromes (Holt-Oram/TBX5,
  Ellis-van Creveld/EVC-EVC2, Char syndrome/TFAP2B, VACTERL association);
  none of those are in scope here. Two allelic distinctions also matter and
  are deliberately kept as separate entities: the somatic BCR::ABL1 fusion
  neoplasms (chronic myeloid leukaemia, Ph-positive ALL), and human ABL1
  deficiency syndrome (HADS), which is caused by biallelic loss-of-function
  ABL1 alleles and is phenotypically the opposite of CHDSKM in many respects.
  No GeneReviews chapter exists for ABL1 or CHDSKM (PubMed searches for
  "ABL1 GeneReviews" and "congenital heart defects and skeletal malformations
  GeneReviews" returned no matching chapter), so the mandatory GeneReviews
  phenotype baseline does not apply; the phenotype baseline used instead is
  the pooled 18-case series tabulated by Blakes et al. (PMID:33223528).
  Orphanet epidemiology was not quoted because the local Orphadata refresh is
  currently failing a manifest checksum; the prevalence record therefore uses a
  qualitative band with a literature case count.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >
      Mendelian, autosomal dominant single-gene developmental disorder; the
      primary clinical home is genetics/dysmorphology rather than any single
      organ system.
    evidence:
    - reference: PMID:32643838
      reference_title: "The expanding clinical phenotype of germline ABL1-associated congenital heart defects and skeletal malformations syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital heart defects and skeletal malformations syndrome (CHDSKM) is a rare \nautosomal dominant disorder characterized by congenital heart disease, skeletal \nabnormalities, and failure to thrive. CHDSKM is caused by germline mutations in \nABL1."
      explanation: Establishes CHDSKM as a Mendelian autosomal dominant germline single-gene disorder.
  - classification_value: CARDIOVASCULAR
    notes: >
      Congenital heart disease is a cardinal manifestation and, together with
      aortic root dilatation, drives much of the surveillance and management
      burden.
    evidence:
    - reference: PMID:36949638
      reference_title: "ABL1-related congenital heart defects and skeletal malformations syndrome in a patient from Sub-Saharan Africa: A case report highlighting novel cardiac features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "rare syndrome characterized by distinctive facial features, \ncongenital cardiac lesions, failure to thrive, and skeletal abnormalities."
      explanation: Congenital cardiac lesions are a defining component of the syndrome.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    Heterozygous ABL1 missense alleles act dominantly. Most reported probands
    carry de novo variants, but vertical transmission from an affected parent
    to an affected child has been documented for the recurrent p.Tyr245Cys
    allele, establishing cosegregation rather than de novo occurrence alone.
    Expressivity is variable - stature, for example, ranges from short to tall
    within the same molecular condition - and numerical penetrance cannot be
    estimated from the small published pedigrees.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report ABL1 \ngermline variants cosegregating with an autosomal dominant disorder \ncharacterized by congenital heart disease, skeletal abnormalities, and failure \nto thrive."
    explanation: Original report establishing autosomal dominant inheritance with cosegregation.
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of asymptomatic parents of the probands in families 1 and 2 was negative for p.Tyr245Cys, indicating the variant arose de novo in the probands. Subject 1's similarly affected daughter was found to have inherited the heterozygous p.Tyr245Cys substitution. In family 3, p.Tyr245Cys was found to be inherited from the similarly affected father."
    explanation: Documents both de novo occurrence and parent-to-child transmission of the same allele.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, two individuals have tall stature, in contrast to short stature in the majority of cases."
    explanation: Illustrates variable expressivity across carriers of pathogenic ABL1 alleles.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    No population prevalence or incidence has ever been measured. The published
    denominator is a pooled case series of 18 individuals reported by 2021,
    with a handful of additional single-patient reports since. This is a case
    count, not a prevalence estimate.
  evidence:
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical features across all described individuals with ABL1 variants are dysmorphic facies (18/18), finger/toe abnormalities (17/18), congenital heart disease (14/18), failure to thrive (14/18), developmental delay (11/18), IUGR (10/18), ear abnormalities (9/18), palatal deformity (9/18) and microcephaly (9/18)"
    explanation: >
      The 18-individual denominator for all described cases as of 2021 is the
      basis for the ultra-rare classification and the CASES_IN_LITERATURE
      measure type.
genetic:
- name: ABL1 Gain-of-Function Missense Variants
  gene_term:
    preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  association: CAUSAL
  relationship_type: CAUSATIVE
  notes: >
    ABL1 (9q34.12) encodes a ubiquitously expressed non-receptor tyrosine
    kinase. CHDSKM alleles are heterozygous germline missense substitutions
    annotated against the isoform 1b transcript NM_007313.2. They are not
    haploinsufficiency alleles: mouse heterozygotes for Abl1 null alleles are
    largely unaffected, and the human alleles increase rather than decrease
    kinase output. Reported disease alleles include p.Val244Ala,
    p.Tyr245Cys, p.Gln300Glu, p.Ala356Thr, p.Ala452Thr, p.Ile508Leu,
    p.Val525Ala, and p.Glu528Lys, plus p.Thr136Met, p.Pro249Leu, p.Val525Met,
    and p.Trp67Arg. The recurrent alleles p.Tyr245Cys and p.Ala356Thr account
    for a disproportionate share of reported patients. Note that only a subset
    of these alleles has been localised to a named regulatory element: the
    myristoyl-pocket cluster (Ala356, Ala452, Val525, Glu528) and the
    SH2-kinase linker (Val244, Tyr245) are mapped, whereas p.Trp67Arg,
    p.Thr136Met, p.Pro249Leu, p.Gln300Glu, and p.Ile508Leu are reported without
    a domain assignment beyond, for p.Ile508Leu, the kinase domain.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant c.734A>G (p.Tyr245Cys) was found to occur de novo or \ncosegregate with disease in five individuals (families 1-3)."
    explanation: Identifies the recurrent founding ABL1 allele for CHDSKM.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a series of \nsix new unrelated individuals with heterozygous missense variants in ABL1 \n(including four novel variants) identified via whole exome sequencing."
    explanation: Expands the allelic series with four additional novel missense variants.
  - reference: PMID:32643838
    reference_title: "The expanding clinical phenotype of germline ABL1-associated congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe three de novo missense variants, c.407C>T (p.Thr136Met), \nc.746C>T (p.Pro249Leu), and c.1573G>A (p.Val525Met), and one recurrent variant, \nc.1066G>A (p.Ala356Thr), in six patients"
    explanation: Further extends the pathogenic ABL1 missense allele spectrum.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygotes of both strains are largely unaffected, suggesting that ABL1 does not display haploinsufficiency, and supporting the possibility that the human germline missense variants act through a gain of function."
    explanation: >
      Mouse heterozygous null data argue against haploinsufficiency and for a
      gain-of-function disease mechanism in the human syndrome.
variants:
- name: ABL1 p.Tyr245Cys
  description: >
    NM_007313.2:c.734A>G, p.(Tyr245Cys). The founding recurrent CHDSKM allele.
    Tyr245 lies in the SH2-kinase linker, whose docking to the SH3 domain is
    one of the linchpins holding ABL1 in the inactive closed conformation.
    Paradoxically, phosphorylation of Tyr245 is required for maximal wild-type
    kinase activity and the p.Tyr245Phe substitution reduces activity, yet
    p.Tyr245Cys increases overall tyrosine phosphorylation - so the two
    substitutions at the same residue have opposite functional effects.
  gene:
    preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  type: MISSENSE
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results support the contention that the p.Tyr245Phe and p.Tyr245Cys substitutions have opposite effects (gain-of-function vs. loss of function) on ABL1 kinase activities."
    explanation: >
      Direct functional comparison establishing p.Tyr245Cys as gain of function
      despite abolishing the activating autophosphorylation site.
- name: ABL1 p.Ala356Thr
  description: >
    NM_007313.2:c.1066G>A, p.(Ala356Thr). The second recurrent CHDSKM allele
    and the prototype of the myristoyl-binding-pocket cluster. Ala356 sits in
    the pocket that binds the N-terminal myristoyl group of isoform 1b, the
    intramolecular interaction that locks the kinase in its autoinhibited
    conformation; substitution by the polar threonine disrupts the hydrophobic
    contacts that hold the myristoyl group in place.
  gene:
    preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  type: MISSENSE
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.Ala356 residue is located in the myristoyl-binding site of the ABL1 kinase domain which intra molecularly binds the N-terminal myristoyl group and forms an autoinhibition conformation."
    explanation: Locates the recurrent Ala356 allele in the autoinhibitory myristoyl-binding pocket.
- name: ABL1 p.Glu528Lys
  description: >
    NM_007313.2:c.1582G>A, p.(Glu528Lys). A de novo CHDSKM allele in the
    C-terminal alpha-I helix. Structural and biophysical work has since shown
    that Glu528 forms a salt bridge with the kinase-domain C-lobe; breaking it
    increases the mechanical force the alpha-I helix exerts on the SH2 domain,
    disassembling the regulatory core and strongly activating the kinase. This
    is the best mechanistically resolved CHDSKM allele.
  gene:
    preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  type: MISSENSE
  clinical_significance: LIKELY_PATHOGENIC
  evidence:
  - reference: PMID:38588001
    reference_title: "The molecular basis of Abelson kinase regulation by its αI-helix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The αI-helix mutation E528K, which is responsible for the ABL1 malformation \nsyndrome, strongly activates Abl by breaking a salt bridge with the KD C-lobe \nand thereby increasing the force onto the SH2 domain."
    explanation: >
      Defines the physical mechanism by which this CHDSKM allele relieves
      autoinhibition.
pathophysiology:
- name: ABL1 Autoinhibitory Regulatory Core Disruption
  biological_scale: MOLECULAR
  description: >
    Wild-type ABL1 is held in a low-activity state by an assembled
    SH3-SH2-kinase regulatory core. Three intramolecular "linchpins" enforce
    this: docking of the SH3 domain onto the SH2-kinase linker, insertion of
    the N-terminal myristoyl group of isoform 1b into a pocket in the kinase
    domain, and an N-terminal brace over the SH3-SH2 unit. The CHDSKM missense
    substitutions whose position has been mapped fall in these regulatory
    elements - four of the five alleles in the largest functionally
    characterised series lie in the myristoyl-binding pocket, with others in the
    SH2-kinase linker and the C-terminal alpha-I helix - and destabilise the
    assembled core. Several later-reported alleles (p.Trp67Arg, p.Thr136Met,
    p.Gln300Glu, p.Ile508Leu) have not been assigned to a defined autoinhibitory
    element by their source reports, so the clustering claim is scoped to the
    characterised alleles. This is the same autoinhibition failure that the somatic BCR::ABL1
    fusion achieves by deleting the myristoylated N-terminus, which is why the
    two conditions share a molecular logic while remaining entirely distinct
    diseases.
  molecular_functions:
  - preferred_term: ABL1 non-receptor tyrosine kinase activity
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: INCREASED
  gene:
    preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  downstream:
  - target: Constitutive ABL1 Tyrosine Kinase Hyperactivity
    causal_link_type: DIRECT
    description: >
      Loss of autoinhibition is the direct cause of the elevated kinase
      activity, not merely a correlate: the same variants that disrupt the
      regulatory elements are the ones that raise catalytic output.
    evidence:
    - reference: PMID:33223528
      reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results are consistent with gain of ABL1 tyrosine kinase activity due to loss of auto-inhibition by myristoyl binding."
      explanation: >
        States the causal link itself - loss of autoinhibition producing the
        gain of kinase activity - rather than either endpoint alone.
  evidence:
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Four of the variants cluster in the \nmyristoyl-binding pocket of ABL1, a region critical for auto-inhibitory \nregulation of the kinase domain."
    explanation: >
      Establishes the myristoyl-binding pocket as the mutational hotspot of the
      four functionally characterised alleles in that series. Tagged
      COMPUTATIONAL because the clustering is an in silico mapping of patient
      variants onto the autoinhibited ABL1 crystal structure (PDB 1OPL),
      combined with missense-constraint and conservation analysis, rather than
      a clinical or wet-lab observation.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analysis supports an ABL1 gain-of-function mechanism \ndue to loss of auto-inhibition, and demonstrates the potential for \npharmacological inhibition using imatinib."
    explanation: States the loss-of-autoinhibition gain-of-function mechanism directly.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As the N-terminus of ABL1 is lost in the fusion product, the auto-inhibitory binding of the myristoyl group to the kinase domain is abolished, and ABL1 gains constitutive tyrosine kinase activity which drives cellular proliferation"
    explanation: >
      Describes the shared autoinhibition-failure logic with BCR::ABL1, the
      mechanistic parallel that motivates the germline gain-of-function model.
  - reference: PMID:38588001
    reference_title: "The molecular basis of Abelson kinase regulation by its αI-helix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Abelson tyrosine kinase (Abl) is regulated by the arrangement of its regulatory \ncore, consisting sequentially of the SH3, SH2, and kinase (KD) domains, where an \nassembled or disassembled core corresponds to low or high kinase activity, \nrespectively."
    explanation: Defines the assembled-versus-disassembled regulatory core as the activity switch.
- name: Constitutive ABL1 Tyrosine Kinase Hyperactivity
  biological_scale: MOLECULAR
  description: >
    With autoinhibition relieved, the mutant kinase is catalytically more
    active than wild type. This has been demonstrated repeatedly and
    independently: by transient transfection of HEK293T cells with each of the
    reported disease alleles, and by purified-protein biophysics for the
    alpha-I-helix allele p.Glu528Lys. Crucially, the increased activity is
    pharmacologically suppressible - imatinib abolished the excess
    phosphorylation across all tested constructs in vitro, which is the entire
    (preclinical) basis for interest in ABL-directed tyrosine kinase inhibitors
    in this syndrome.
  molecular_functions:
  - preferred_term: ABL1 tyrosine kinase catalytic activity
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: >-
      ABL1 autophosphorylation at Tyr245 (allele-dependent direction; increased
      for myristoyl-pocket alleles, reduced for the SH2-kinase-linker alleles
      p.Val244Ala and p.Tyr245Cys, which activate the kinase independently of
      Tyr245 phosphorylation status)
    term:
      id: GO:0038083
      label: peptidyl-tyrosine autophosphorylation
  downstream:
  - target: Increased Substrate Tyrosine Phosphorylation
    causal_link_type: DIRECT
    description: >
      The elevated kinase activity is measured as, and therefore directly
      produces, increased phosphorylation of ABL1 substrates. The edge is
      reversible in vitro: inhibiting the kinase removes the substrate
      phosphorylation.
    evidence:
    - reference: PMID:33223528
      reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Phosphorylation of ABL1-Tyr245 and STAT5B were substantially increased in lysates transfected with the c.1066G > A p.(Ala356Thr) construct"
      explanation: >
        Directly couples the variant kinase to increased substrate
        phosphorylation in the same experiment.
    - reference: PMID:33223528
      reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with 1 µM imatinib results in complete loss of phosphorylation activity."
      explanation: >
        Pharmacological interruption of the kinase abolishes the downstream
        phosphorylation, supporting the direction of this edge.
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We overexpressed the mutant constructs in HEK 293T cells and \nobserved increased tyrosine phosphorylation, suggesting increased ABL1 kinase \nactivities associated with both the p.Tyr245Cys and p.Ala356Thr substitutions."
    explanation: Original functional demonstration of increased kinase activity for both founding alleles.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional \nwork to investigate ABL1 kinase activity in vitro by transient transfection of \nHEK293T cells with variant ABL1 plasmid constructs revealed increased \nphosphorylation of ABL1-specific substrates compared to wild-type. The increased \ntyrosine kinase activity was suppressed by imatinib treatment."
    explanation: >
      Independent replication across four further alleles, plus the
      imatinib-suppressibility that underpins the ABL-inhibitor hypothesis.
  - reference: PMID:32643838
    reference_title: "The expanding clinical phenotype of germline ABL1-associated congenital heart defects and skeletal malformations syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional investigation of \nthe three novel variants showed an increased ABL1 kinase activity."
    explanation: Third independent laboratory confirming increased kinase activity for new alleles.
- name: Increased Substrate Tyrosine Phosphorylation
  biological_scale: CELLULAR
  description: >
    Hyperactive ABL1 raises global cellular phosphotyrosine and specifically
    hyperphosphorylates canonical ABL1 substrates, of which STAT5/STAT5B is the
    best-characterised readout across all three functional studies. An unbiased
    phosphoproteomic survey of one patient-derived allele additionally found
    increased phosphorylation of UFD1, AXIN1, and ATRX, nominating candidate
    effectors that could link kinase hyperactivity to the cardiac, digital, and
    growth phenotypes - notably UFD1, which the authors relate to the cardiac
    phenotype of 22q11.2 deletion syndrome. These effector assignments are
    hypotheses generated in a cell line, not validated patient-tissue
    mechanisms.
  biological_processes:
  - preferred_term: peptidyl-tyrosine phosphorylation
    term:
      id: GO:0018108
      label: peptidyl-tyrosine phosphorylation
    modifier: INCREASED
  - preferred_term: STAT5 tyrosine phosphorylation
    term:
      id: GO:0007260
      label: tyrosine phosphorylation of STAT protein
    modifier: INCREASED
  downstream:
  - target: Disrupted Cardiac Septation and Outflow Tract Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Disrupted Skeletal and Connective Tissue Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Prenatal and Postnatal Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of the mutant constructs in both isoforms resulted in increased overall phosphotyrosine (p-Tyr) and increased phosphorylation of specific ABL1 substrates (STAT5) when compared to wild-type"
    explanation: Establishes increased global phosphotyrosine and STAT5 phosphorylation as the cellular readout.
  - reference: PMID:33075386
    reference_title: "Phosphorylated proteome analysis of a novel germline ABL1 mutation causing an autosomal dominant syndrome with ventricular septal defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blotting confirmed that tyrosine phosphorylation in STAT5, a substrate of ABL1, was enhanced, and the novel \nmutation was proved to be a gain-of-function mutation."
    explanation: Independent confirmation of STAT5 hyperphosphorylation for a further patient allele.
  - reference: PMID:33075386
    reference_title: "Phosphorylated proteome analysis of a novel germline ABL1 mutation causing an autosomal dominant syndrome with ventricular septal defect."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The proteome analysis showed that \nphosphorylation in proteins such as UFD1, AXIN1, ATRX, which may be involved in \nthe phenotypes, was enhanced in the mutant group."
    explanation: >
      Nominates candidate downstream effectors; the authors themselves frame
      these as hypotheses ("may be involved"), so this supports the node only
      partially.
- name: Disrupted Cardiac Septation and Outflow Tract Development
  biological_scale: TISSUE
  description: >
    Dysregulated ABL1 signalling during cardiac morphogenesis produces
    structural heart disease in the great majority of patients. The reported
    lesions are concentrated at the septa and the left and right outflow tracts:
    atrial and ventricular septal defects, patent ductus arteriosus,
    supravalvular pulmonary stenosis, bicuspid aortic valve, and aortic root
    dilatation. The specific developmental lineage through which kinase
    hyperactivity produces these defects has not been established; the
    phosphoproteomic nomination of UFD1, the 22q11.2 cardiac gene, is the only
    concrete candidate link so far.
  biological_processes:
  - preferred_term: cardiac septum morphogenesis
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
    modifier: ABNORMAL
  - preferred_term: ventricular septum development
    term:
      id: GO:0003281
      label: ventricular septum development
    modifier: ABNORMAL
  - preferred_term: atrial septum development

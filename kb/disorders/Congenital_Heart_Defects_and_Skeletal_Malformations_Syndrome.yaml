- name: Disrupted Skeletal and Connective Tissue Morphogenesis
  biological_scale: TISSUE
  description: >
    The skeletal arm of the syndrome affects the digits most consistently, then
    the axial skeleton and thoracic cage: camptodactyly and finger contractures,
    fifth-finger clinodactyly, 2-3 toe syndactyly, hindfoot deformity,
    scoliosis, and pectus excavatum. A connective-tissue dimension runs in
    parallel - thin skin, joint hypermobility, arachnodactyly, high-arched
    palate, and spontaneous pneumothorax - which is why these patients are
    routinely referred to connective-tissue clinics before the molecular
    diagnosis is made. Notably, the canonical connective-tissue mechanism of
    increased TGF-beta signalling was tested and NOT found: SMAD2 and SMAD3
    phosphorylation were unchanged in the mutant constructs, so CHDSKM does not
    conform to the TGF-beta-dysregulation aortopathy pattern of Marfan and
    Loeys-Dietz syndromes despite the clinical resemblance. That negative is
    the reason this entry declares no conforms_to link to the
    aortopathy_tgfbeta_dysregulation module.
  biological_processes:
  - preferred_term: skeletal system morphogenesis
    term:
      id: GO:0048705
      label: skeletal system morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Progressive Aortic Root Dilatation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common skeletal abnormalities included pectus excavatum, scoliosis, and finger/toe deformities, in particular hindfoot deformity, and finger contractures"
    explanation: Defines the skeletal lesion spectrum.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypes such as skeletal malformations, aortic root dilatation and pneumothorax point towards an overlap with genetic connective tissue disorders"
    explanation: Documents the connective-tissue dimension of the skeletal phenotype.
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "we did not observe significant alteration in the phosphorylation level of SMAD2 and SMAD3"
    explanation: >
      Directly tests and refutes increased TGF-beta signalling as the
      connective-tissue mechanism, which is why this entry does NOT declare
      conformance to the aortopathy_tgfbeta_dysregulation module.
- name: Progressive Aortic Root Dilatation
  biological_scale: TISSUE
  description: >
    Aortic root enlargement is reported chiefly in older children and adults,
    consistent with a progressive rather than a static congenital lesion, and
    at least one patient has had severe and rapidly progressive dilatation. The
    true risk of aneurysm and dissection is not known: as of the 2021 pooled
    18-case review the authors reported no awareness of any affected individual
    having required surgical intervention for rapid progressive dilatation,
    which they suggested may indicate a more indolent course than Marfan
    syndrome - though a 2023 case has since described exactly that pattern, so
    the indolent-course reading should be treated as provisional. The
    uncertainty itself is the
    clinically actionable point: published expert recommendation is baseline and
    serial aortic root measurement modelled on Marfan surveillance until
    natural-history data exist.
  locations:
  - preferred_term: aortic root
    term:
      id: UBERON:0001496
      label: ascending aorta
  evidence:
  - reference: PMID:36949638
    reference_title: "ABL1-related congenital heart defects and skeletal malformations syndrome in a patient from Sub-Saharan Africa: A case report highlighting novel cardiac features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he had several features not \npreviously documented, including severe and rapidly progressive aortic root \ndilatation"
    explanation: Documents that aortic root dilatation can be severe and rapidly progressive.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence is currently lacking as to the true risk of aortic aneurysm and dissection in this condition. We are not aware of any affected individuals having had rapid progressive aortic dilatation requiring surgical intervention and this may therefore suggest a more indolent course."
    explanation: >
      Qualifies the aortic risk claim - the lesion is real but its natural
      history is undefined and may be more indolent than in Marfan syndrome.
- name: Impaired Prenatal and Postnatal Growth
  biological_scale: ORGANISM
  description: >
    Growth impairment begins prenatally as intrauterine growth restriction and
    continues postnatally as failure to thrive with feeding difficulty. In the
    pooled series failure to thrive is tied with congenital heart disease as the
    third most frequent feature, behind facial dysmorphism and digital
    anomalies. Adult
    stature is variable and does not track the infantile growth failure - most
    adults are short but tall stature has been reported, so short stature is not
    a reliable diagnostic handle.

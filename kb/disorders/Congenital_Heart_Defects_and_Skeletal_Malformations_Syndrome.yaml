- name: ABL-Directed Tyrosine Kinase Inhibition (Investigational)
  description: >
    NOT an established treatment. Imatinib abolishes the excess phosphorylation
    of mutant ABL1 constructs in vitro, which makes the gain-of-function
    mechanism pharmacologically tractable in principle and is the sole basis for
    interest in ABL-directed tyrosine kinase inhibitors here. The authors of
    that work do advance a therapeutic hypothesis: because the germline alleles
    functionally mimic the loss of the ABL1 N-terminus in BCR-ABL, they expect
    TKIs effective against BCR-ABL to be similarly effective against the variant
    proteins, and they raise limiting aortic root dilatation as a candidate
    indication. Three considerations nevertheless weigh against clinical use
    outside a rigorously justified research protocol. First, the malformations
    arise during embryofetal development, so any meaningful effect would require
    treatment from a very early age and lifelong exposure. Second, imatinib is
    expected to be teratogenic in pregnancy, and severe congenital malformations
    have been reported in fetuses exposed to it - though the original authors
    caution that no definitive conclusion about imatinib teratogenicity can be
    drawn from the small number of cases, several of which also involved
    exposure to other teratogens such as warfarin or hydroxyurea. Third,
    structural work shows that type II ATP-site inhibitors such as imatinib
    promote disassembly of the very regulatory core whose disassembly drives the
    disease, whereas the allosteric myristoyl-pocket inhibitor asciminib
    stabilises the alpha-I helix instead - so the two inhibitor classes are not
    interchangeable and leukaemia dosing cannot simply be transplanted into a
    developmental syndrome.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: Constitutive ABL1 Tyrosine Kinase Hyperactivity
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Finally, as expected, imatinib abolished phosphorylation of ABL1-Tyr245 and STAT5B in all of the constructs"
    explanation: >
      In vitro pharmacological tractability only; no clinical evidence of
      benefit in CHDSKM, hence PARTIAL.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "While imatinib is used to treat paediatric CML cases, it is expected to be teratogenic in pregnancy. Further work is therefore required to ascertain whether therapeutic scope exists for use of imatinib or similar TKIs in this condition."
    explanation: >
      The authors' own caveat, stated as expert discussion rather than as a
      reported observation: teratogenicity risk and absence of evidence for
      therapeutic scope in this condition.
  - reference: PMID:33223528
    reference_title: "Pathogenic variants causing ABL1 malformation syndrome cluster in a myristoyl-binding pocket and increase tyrosine kinase activity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "TKIs may potentially in some way be therapeutically beneficial for the ABL1 developmental syndrome or its complications, for example in limiting aortic root dilatation or reducing the tendency for dilatation to occur."
    explanation: >
      The therapeutic hypothesis the same authors advance, recorded alongside
      their cautions so the entry reflects both halves of the source argument.
  - reference: PMID:28288113
    reference_title: "Germline mutations in ABL1 cause an autosomal dominant syndrome characterized by congenital heart defects and skeletal malformations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "severe congenital malformations have been reported in fetuses exposed to imatinib, a selective tyrosine kinase inhibitor drug"
    explanation: >
      Documents the fetal malformation signal that makes developmental use of
      this drug class hazardous. PARTIAL because the same paragraph states that
      no definitive conclusion about imatinib teratogenicity can be drawn from
      the small, confounded case set.
  - reference: PMID:38588001
    reference_title: "The molecular basis of Abelson kinase regulation by its αI-helix."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In contrast, the \nallosteric inhibitor asciminib strongly reduces Abl's activity by fixating the \nαI-helix and reducing the force onto the SH2 domain."
    explanation: >
      Supports the mechanistic distinction between allosteric and type II
      ATP-site inhibition that complicates drug selection in this syndrome.
- name: Malignancy Screening
  description: >
    Systematic clinical screening for ABL1-associated cancers, recommended by
    the authors of the original description on the precautionary grounds that
    the germline alleles increase the activity of a proto-oncogene. This is a
    prudential recommendation, not an evidence-based protocol: no malignancy
    has been reported in any CHDSKM patient, no screening modality or interval
    has been specified or validated, and the lifetime risk is unquantified.
    The corresponding evidence gap is tracked in the chdskm_malignancy_risk
    discussion.
  action_category: SCREENING
  treatment_term:
    preferred_term: cancer screening
    term:

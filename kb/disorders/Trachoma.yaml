datasets:
- accession: geo:GSE106961
  title: Conjunctival transcriptome profiling of Solomon Islanders with active trachoma but without ocular Chlamydia trachomatis infection.
  description: The prevalence of trachomatous inflammation–follicular (TF) in Solomon Island children aged 1–9 years is high enough to warrant, among other interventions, mass distribution of azithromycin. However, over 90% of those with TF did not have concurrent Chlamydia trachomatis infection. We analysed the transcriptome of children with TF and Ct infection, children diagnosed with TF but no Ct infection and children with neither TF nor Ct infection to better understand host responses during an episode of TF, and investigate whether it can provide any clues about the aetiology of TF in this context.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 20
  publication: PMID:29467021
  notes: Identified by GEO DataSets index search for Trachoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE69837
  title: Inverse relationship between microRNA-155 and -184 expression with increasing conjunctival inflammation during ocular Chlamydia trachomatis infection
  description: Trachoma, a preventable blinding eye disease, is initiated by ocular infection with Chlamydia trachomatis (Ct). MicroRNA (miR) are post-transcriptional regulators of gene expression and play a major role in health and disease. We have investigated the miR profile during C. trachomatis infection of epithelial cells in vitro and in vivo during follicular trachoma with current C. trachomatis infection. Small RNA sequencing was carried out on human epithelial cells infected in vitro and on samples from five children with follicular trachoma with current Ct infection and five children with no evidence of clinical trachoma or infection.

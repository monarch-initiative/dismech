    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All reported patients showed T cell lymphopenia, suffered infections, and
      required stem cell transplantation to survive. Older patients also showed
      autoimmune features, suggesting poor T-cell selection.
    explanation: >-
      Reports the lymphopenia and attributes the autoimmunity to defective thymic
      selection.
  downstream:
  - target: T-Cell Lymphopenia with Impaired Function
    description: >-
      Failure of development is what depletes the peripheral T-cell compartment.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2142600
      reference_title: "Congenital T-cell receptor immunodeficiencies in man."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        severe TCR ID behaves as a clinical SCID, with clear autoimmune features
        and profound lymphoid tissue depletion
      explanation: >-
        Describes the severe end of the phenotype as lymphoid depletion with
        autoimmunity.
- name: T-Cell Lymphopenia with Impaired Function
  biological_scale: ORGANISM
  description: >-
    Peripheral T-cell numbers are very low, and the cells that are present carry
    little surface receptor and respond poorly through it while responding
    normally to TCR-independent stimuli such as anti-CD2, phorbol esters and
    IL-2. That dissociation — bad through the receptor, fine around it — is the
    laboratory signature of the disorder and separates it from lymphopenias with
    a general proliferative defect.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: DECREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:2142600
    reference_title: "Congenital T-cell receptor immunodeficiencies in man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, normal proliferative responses were recorded to
      TCR-independent activation or proliferation signals (i.e: anti-CD2, phorbol
      esters and IL-2).
    explanation: >-
      Establishes that the functional defect is receptor-specific rather than a
      general failure of T-cell proliferation.
- name: Revertant Somatic Mosaicism
  biological_scale: CELLULAR
  description: >-
    A second, spontaneous change at or near the germline codon arises in a
    subset of T cells and partially restores CD247. This is the usual course in
    this disorder rather than a rarity, and the revertant cells are selected for
    because they can express a receptor. Crucially the rescue is partial in a
    specific way: expression comes back, function does not, and the revertant
    population stays a minority and has not altered any reported patient's
    clinical status. The node is a modifier of the disease course rather than a
    step in the causal chain, so it carries no downstream edge.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell

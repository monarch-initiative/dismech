name: Immunodeficiency 25
creation_date: "2026-08-31T16:45:00Z"
category: Mendelian
synonyms:
- IMD25
- CD247 deficiency
- CD3 zeta chain deficiency
- CD3zeta deficiency
- TCR zeta chain immunodeficiency
description: >-
  Immunodeficiency 25 is an autosomal recessive combined immunodeficiency caused
  by biallelic loss-of-function variants in CD247, the gene encoding the T-cell
  receptor zeta chain (CD3zeta). The alpha-beta T-cell receptor reaches the cell
  surface only as a complete octamer — the clonotypic TCR alpha-beta heterodimer
  together with the CD3 gamma-epsilon, CD3 delta-epsilon and zeta-zeta dimers —
  assembled in the endoplasmic reticulum. CD247 contributes the invariant
  zeta-zeta homodimer, which does two distinct jobs: it is required for efficient
  assembly and export of the receptor, and it carries three of the ten
  immunoreceptor tyrosine-based activation motifs (ITAMs) in the complex, more
  than any other subunit. Losing it therefore costs both receptor density and
  signalling capacity, and the resulting failure of thymic selection produces
  profound T-cell lymphopenia with, in longer-surviving patients, autoimmunity.

  Two features distinguish this disorder from the neighbouring CD3-chain defects
  and are the reason it repays curation as its own entry rather than as a variant
  of them. The first is revertant somatic mosaicism, which is not an incidental
  finding here but the usual state of affairs: most reported patients carry a
  minority population of T cells in which a second, spontaneous change at the
  same codon has partially restored the protein. Those revertant cells recover
  surface receptor without recovering function, and they have not improved any
  reported patient's clinical course — a natural experiment separating TCR
  expression from TCR signalling. The second is that the mouse does not model the
  human disease: the same nonsense change that restores receptor expression in
  the classic murine CD247-deficient line fails to do so in human cells, so
  murine CD247 results cannot be carried across without checking.

  Reported patients present in early childhood with T-cell lymphopenia and
  infection, require haematopoietic stem cell transplantation to survive, and the
  older ones develop autoimmune features attributed to poor thymic selection. The
  disorder is very rare — the published series total a handful of patients — so
  the phenotypic range should be read as the reported range.

    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In human cell models, all somatic revertant variants restored TCR
      expression with varying degrees (WT = Q70L > Q70W > Q70Y).
    explanation: >-
      Quantifies the partial restoration of surface receptor by the revertant

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic CD247 variants cause disease; heterozygous carriers of null alleles
    are clinically well but show roughly half-normal surface CD3, so the gene is
    dosage-sensitive at the level of receptor density without that being enough to
    cause immunodeficiency. Heterozygous nonsense alleles that retain a truncated
    protein are a separate case and behave dominant-negatively in vitro.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38992472
    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous null mutations in CD247 lead to immunodeficiency, while carriers
      exhibit 50% reduced surface CD3.
    explanation: >-
      States the recessive inheritance of the null alleles and the intermediate
      biochemical phenotype in carriers.
mechanistic_hypotheses:
- hypothesis_group_id: expression_function_uncoupling
  hypothesis_label: >-
    Restoring TCR surface expression is not sufficient to restore TCR function in
    CD247 deficiency
  status: EMERGING
  description: >-
    Somatic revertant variants at the patients' own germline codon recover surface
    receptor to varying degrees, yet none of them restores TCR-induced ZAP70
    tyrosine phosphorylation, and the hierarchy of expression rescue does not
    match the hierarchy of activation rescue. If this holds, the ITAM-bearing
    cytoplasmic tail is doing something for signalling that is separable from what
    the transmembrane region does for assembly, and any therapy aimed at
    restoring receptor density alone would be expected to fail. The clinical
    correlate — that revertant T cells did not help any reported patient — is
    consistent but is an observation on very few patients.
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Somatic reversions, such as those detected in patients with pathogenic
      CD247 germinal changes, display a discordant capability to rescue TCR
      expression versus function.
    explanation: >-
      States the uncoupling of expression from function that the hypothesis rests
      on.
pathophysiology:
- name: Biallelic CD247 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Reported germline alleles include an initiation-codon change (p.M1T) and a
    nonsense change truncating the protein before all three ITAMs (p.Q70X). The
    two act differently: p.M1T abolishes translation initiation, while p.Q70X
    leaves a truncated chain that can still be detected intracellularly with a
    transmembrane-directed antibody but not with an ITAM-3-directed one. That
    distinction matters, because a retained truncated chain can compete with
    wild-type CD247 whereas a true null cannot.

    A third reported allele is a homozygous single-C insertion after nucleotide
    411 in exon 7. It behaves as a true null at the protein level: no CD3zeta is
    detectable in the patient's T cells, and when the mutant cDNA is transduced
    into a CD247-deficient background the nascent protein is not detected at all
    on metabolic labelling, indicating it is made and then rapidly degraded. That
    completes the allelic picture — one allele class is degraded away, another is
    retained as a truncated competitor, and the two are not interchangeable when
    predicting a novel variant's behaviour.

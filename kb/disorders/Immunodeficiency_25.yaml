    snippet: >-
      CD247 deficiency frequently associates with revertant somatic mosaicism (4
      of 5 patients, Table S1), likely due to the propensity of CD247 to vary
    explanation: >-
      Establishes how common reversion is in this disorder specifically.
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the revertant T cells remained a minority and did not improve the
      patients' clinical status.
    explanation: >-
      Records that reversion has no observed clinical benefit, which is why it is

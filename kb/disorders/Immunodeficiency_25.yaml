- name: Impaired TCR/CD3 Complex Assembly and Surface Expression
  biological_scale: MOLECULAR
  description: >-
    The zeta-zeta homodimer is one of the invariant dimers the octameric receptor
    needs to complete assembly in the endoplasmic reticulum and leave it. Without
    it the incomplete complex is retained rather than exported, and surface
    receptor density falls sharply — unlike CD3gamma deficiency, where CD3delta
    can partly substitute and T-cell numbers stay normal. This was in fact the
    first biochemical description of the disorder, made before the gene was
    identified, as a failure of the zeta chain to associate with the rest of the
    complex.
  protein_complexes:
  - preferred_term: alpha-beta T cell receptor complex
    modifier: DECREASED
    term:
      id: GO:0042105
      label: alpha-beta T cell receptor complex
  cell_types:

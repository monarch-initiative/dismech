    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that CD247 variants lacking ITAMs due to nonsense, but
      not null, mutations are defective for normal TCR assembly and exert a
      dominant-negative effect on TCR expression and signaling in vitro.
    explanation: >-
      States the dominant-negative effect and, in the authors' own hedging,
      confines it to in vitro observation.
  - reference: PMID:38992472
    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two heterozygous nonsense CD247 mutations were identified (p.Y152X and
      p.Q101X), which affected ITAM-3 and ITAM-2 and ITAM-3, respectively.
    explanation: >-
      Names the heterozygous nonsense alleles found in patients.
experimental_models:
- name: MA5.8 murine CD247-deficient T-cell line
  experimental_model_type: CELL_LINE
  description: >-
    The classic CD247-deficient mouse T-cell line, long used as the reconstitution
    background for zeta-chain work. It is included here as an explicit negative:
    on the specific question of whether a truncating CD247 allele can support
    receptor expression, it gives the opposite answer to human cells.
  modeled_mechanisms:
  - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The Q70X allele restores surface TCR in MA5.8 but not in human T cells, so
      the murine line scores a truncating allele as functional for assembly when
      in human cells it is not.
    limitations: >-
      Species divergence at the assembly step itself, which is the mechanism under
      study rather than a peripheral difference. A reconstitution result obtained
      in MA5.8 cannot be assumed to transfer to human CD247 deficiency, and the
      direction of the error is optimistic — it makes a damaging allele look
      tolerated.
    readouts:
    - name: Surface TCR/CD3 expression after Q70X reconstitution
      target: Impaired TCR/CD3 Complex Assembly and Surface Expression
      direction: RESTORED
      interpretation: >-
        Restored in the murine line and not in human cells; the discrepancy is the
        finding, not the restoration.
      evidence:
      - reference: PMID:40711587
        reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          MA5.8 mouse T cells do not accurately model human CD247 deficiencies, as
          Q70X restores TCR expression in MA5.8 but not in human cells.
        explanation: >-
          Reports the divergent reconstitution result in the two species.
    evidence:
    - reference: PMID:40711587
      reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MA5.8 mouse T cells do not accurately model human CD247 deficiencies, as
        Q70X restores TCR expression in MA5.8 but not in human cells.
      explanation: >-
        States directly that the murine line does not model the human disorder.
- name: ZKO CRISPR/Cas9 CD247-knockout Jurkat line
  experimental_model_type: CELL_LINE
  description: >-
    A human T-cell line in which CD247 has been knocked out, giving an isogenic
    null background for reconstitution with wild-type or mutant CD247. This is the
    system that carries most of the mechanistic argument in the entry, and the
    one against which the murine line was found wanting.
  modeled_mechanisms:
  - target: Loss of ITAM-Dependent Proximal TCR Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reconstituting the null background with ITAM-truncated CD247 reproduces both
      the assembly defect and the downstream activation failure, and grades them by
      the number of ITAMs lost.
    limitations: >-
      Jurkat is a transformed leukaemic line with known deficiencies in
      phosphoinositide phosphatase regulation, and reconstitution is by
      overexpression rather than at endogenous level. It also cannot model thymic
      selection, which is where the clinical phenotype is generated.
    readouts:
    - name: CD69 induction after TCR stimulation
      target: Loss of ITAM-Dependent Proximal TCR Signaling
      direction: DECREASED
      interpretation: >-
        Activation marker induction falls with ITAM loss, reporting the proximal
        signalling block.
      evidence:
      - reference: PMID:38992472
        reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          All 6 transfectants showed reduced CD69 induction (25% to 50%),
          indicating that they were unable to signal downstream properly, neither
          isolated nor associated with WT CD247.
        explanation: >-
          Measures the activation defect in the isogenic human background.
    evidence:
    - reference: PMID:38992472
      reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Jurkat T cells, either wild-type (WT) or CRISPR/Cas9-edited
        CD247-deficient (ZKO), were lentivirally transduced with WT CD247 or
        mutations ablating 1 (Q142X), 2 (Q101X), or 3 (Q70X) ITAMs.
      explanation: >-
        Describes the isogenic human reconstitution system used.
diagnosis:
- name: Flow cytometry for surface CD3 and T-cell subsets
  description: >-
    The disorder is picked up as very low T-cell counts with low surface CD3 on
    the cells that are present. Because revertant cells carry higher surface TCR,
    a bimodal CD3 histogram in a lymphopenic child is itself a pointer to CD247
    deficiency rather than to a CD3-chain defect without reversion.
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reported CD247-deficient patients showed severe immunodeficiency despite the
      presence of two populations of peripheral T cells, most with low TCR levels
      carrying the germline variant and a few with higher TCR levels due to
      somatic reversion.
    explanation: >-
      Describes the two-population surface-TCR pattern that flow cytometry shows.
- name: Newborn screening by T-cell receptor excision circle assay
  description: >-
    The population-level route to a presymptomatic diagnosis. Profound T-cell
    lymphopenia gives low or absent TRECs, so an affected infant is expected to
    screen positive. One caveat specific to this disorder: revertant mosaicism
    expands a T-cell population, and because reversion is the usual state of
    affairs in CD247 deficiency rather than a rarity, a partly restored T-cell
    compartment could in principle raise the TREC value — the same way ZAP70
    deficiency with normal T-cell numbers escapes the assay. That has not been
    reported in a CD247 patient and is a stated concern rather than an observed
    failure.
  evidence:
  - reference: PMID:41441645
    reference_title: "BCGitis and BCGosis: Clinical Spectrum, Immunological Mechanisms, and Risk Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Implementation of universal newborn screening for severe combined
      immunodeficiency (SCID) using the T-cell receptor excision circle (TREC)
      assay now enables prospective identification and deferral of these
      high-risk neonates, virtually eliminating fatal BCGosis.
    explanation: >-
      Establishes TREC screening as the route to presymptomatic identification in
      SCID. Indirect because it is stated for the SCID class rather than for
      CD247 deficiency specifically.
- name: Distinguishing combined immunodeficiency from typical SCID by T-cell count
  description: >-
    A general framework rather than a CD247-specific test, included because the
    placement of this disorder relative to typical SCID turns on it. Patients with
    fewer than 500 circulating CD3-positive T cells per microlitre are classed as
    typical SCID; the IUIS row for CD3Z records very low T cells, which puts it at
    that end of the spectrum.
  evidence:
  - reference: PMID:22664165
    reference_title: "Defining combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Patients with typical SCID can be defined as having fewer than 500
      circulating CD3(+) T cells.
    explanation: >-
      Gives the T-cell count threshold used to separate typical SCID from other
      combined immunodeficiencies. This cohort did not include CD247-deficient
      patients, so it supplies the classification framework rather than direct
      evidence about this disorder.
treatments:
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only reported curative option, and one that every reported patient
    required in order to survive. It replaces the defective T-cell compartment
    with donor-derived cells; it does not correct CD247 in the patient's own
    haematopoietic stem cells.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: T-Cell Lymphopenia with Impaired Function
    description: >-
      Donor-derived progenitors reconstitute a T-cell compartment with an intact
      CD247 locus, bypassing the patient's assembly and signalling defect rather
      than repairing it.
    evidence:
    - reference: PMID:40711587
      reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All reported patients showed T cell lymphopenia, suffered infections, and
        required stem cell transplantation to survive.
      explanation: >-
        Records transplantation as necessary for survival in every reported
        patient.
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All reported patients showed T cell lymphopenia, suffered infections, and
      required stem cell transplantation to survive.
    explanation: >-
      Establishes transplantation as the reported definitive treatment.
- name: Deferral of live vaccines
  description: >-
    The most time-critical intervention, and the one that is lost if diagnosis is
    late. An infant with profound T-cell lymphopenia given a live vaccine is at
    risk of disseminated disease from the vaccine strain itself — BCGosis where
    BCG is given at birth, vaccine-associated paralytic poliomyelitis where oral
    polio vaccine is used. Both are preventable by deferring the vaccine, which
    requires knowing the diagnosis before the vaccine is given, which in turn is
    what newborn screening buys.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41441645
    reference_title: "BCGitis and BCGosis: Clinical Spectrum, Immunological Mechanisms, and Risk Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Implementation of universal newborn screening for severe combined
      immunodeficiency (SCID) using the T-cell receptor excision circle (TREC)
      assay now enables prospective identification and deferral of these
      high-risk neonates, virtually eliminating fatal BCGosis.
    explanation: >-
      Establishes deferral of live BCG in screen-identified SCID as effectively
      eliminating fatal disseminated BCG disease. Indirect because the evidence
      is for SCID as a class rather than for CD247 deficiency specifically; IUIS
      places this disorder in that class with very low T-cell numbers.
  - reference: PMID:41727494
    reference_title: "Case Report: Infant with vaccine-associated paralytic poliomyelitis unveils global disparities in care for inborn errors of immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The lack of NBS for SCID, together with the continued usage of OPV in the
      routine childhood vaccination program in most lower to middle income
      countries is the perfect storm for VAPP in children born with IEIs in these
      settings.
    explanation: >-
      Documents the oral polio vaccine counterpart of the same hazard and ties it
      to absent newborn screening. Indirect for the same reason: a RAG1 Omenn
      case, not CD247, but the exposure risk follows from the T-cell lymphopenia
      this disorder shares.
differential_diagnoses:
- name: CD3gamma deficiency (CD3G)
  description: >-
    The instructive contrast within the same complex. CD3gamma deficiency leaves
    T-cell numbers normal with reduced surface TCR, because CD3delta can partly
    substitute for the missing chain, and the disease is correspondingly milder.
    CD247 deficiency has no such substitute and presents with very low T cells.
    The discriminator at the bench is the T-cell count, not the surface TCR level,
    since both show reduced receptor.
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CD3 deficiency CD3G AR 186740 Normal number, but low TCR expression Normal Normal Immune deficiency and autoimmunity of variable severity
    explanation: >-
      The IUIS row for CD3G, recording normal T-cell numbers with low TCR
      expression, against the very low T-cell numbers recorded for CD3Z.
- name: CD3delta and CD3epsilon deficiency (CD3D, CD3E)
  description: >-
    The other CD3-chain defects that present as T-B+NK+ SCID, and the closest
    clinical mimics. They are separated from CD247 deficiency only by gene
    identity, so the practical route is a sequencing panel rather than a
    laboratory discriminator.
  evidence:
  - reference: PMID:8490660
    reference_title: "Independent mutations of the human CD3-epsilon gene resulting in a T cell receptor/CD3 complex immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report that two independent CD3-epsilon gene mutations present in the
      parents have segregated in the patient, leading to defective CD3-epsilon
      chain synthesis and preventing normal association and membrane expression of
      the TCR/CD3 complex.
    explanation: >-
      Shows CD3E defects produce the same terminal lesion — failure of complex
      assembly and membrane expression — from a different subunit.
discussions:
- discussion_id: mouse_does_not_model_cd247
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can murine CD247 reconstitution data be used to predict the effect of a human
    CD247 allele, given that the same truncating allele behaves differently in the
    two species?
  attaches_to:
  - pathophysiology#Impaired TCR/CD3 Complex Assembly and Surface Expression
  rationale: >-
    The mismatch is allele-specific, not global, and that is the useful form of
    the statement. MA5.8 handles a true null correctly: the exon 7 frameshift
    allele fails to rescue TCR assembly or surface expression in that line, which
    is exactly what it does in the patient. What MA5.8 gets wrong is the
    retained-truncated-chain class — Q70X restores surface TCR there and does not
    in human cells. So the practical rule is that a murine reconstitution result
    can be trusted for an allele whose product is degraded away, and cannot be
    trusted for an allele that leaves a partial chain behind.

    The direction of the error matters: it is optimistic, so a damaging human
    allele of the retained class looks tolerated in the mouse. And this is not an
    isolated quirk of CD247 — the CD3 chains already have partly reciprocal roles
    across the two species, with CD3delta loss permitting some T-cell development
    in mice while causing SCID in humans, and CD3gamma loss doing the reverse.
    Whether the human-specific requirement reflects different subunit
    stoichiometry, different ER quality control, or something else has not been
    established.
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MA5.8 mouse T cells do not accurately model human CD247 deficiencies, as
      Q70X restores TCR expression in MA5.8 but not in human cells.
    explanation: >-
      The direct observation of the species mismatch.
  - reference: PMID:17170122
    reference_title: "T-B+NK+ severe combined immunodeficiency caused by complete deficiency of the CD3zeta subunit of the T-cell antigen receptor complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additional studies demonstrated that retrovirally transduced patient mutant
      CD3zeta cDNA failed to rescue assembly of nascent complete TCR complexes or
      surface TCR expression in CD3zeta-deficient MA5.8 murine T-cell hybridoma
      cells.
    explanation: >-
      The other half of the mismatch, and the reason it is allele-specific rather
      than global: MA5.8 scores the frameshift allele correctly as failing to
      rescue, while mis-scoring the retained-truncated-chain allele Q70X.
  - reference: PMID:17291425
    reference_title: "[Expression anomalies of the CD3-TCR complex expression and immunodeficiencies]."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      The main differences observed involve the respective roles of the CD3gamma
      chain as well as the CD3delta, whose functions seem to be reciprocal between
      the two species.
    explanation: >-
      Establishes that mouse-human divergence is a general feature of the CD3
      complex rather than specific to CD247, which is why the mismatch should be
      assumed rather than discovered for each subunit.
- discussion_id: reversion_expression_function_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does restoring CD247 surface expression by somatic reversion fail to
    restore TCR signalling?
  attaches_to:
  - pathophysiology#Revertant Somatic Mosaicism
  - pathophysiology#Loss of ITAM-Dependent Proximal TCR Signaling
  rationale: >-
    Revertant variants recover surface receptor in a graded way and none of them
    recovers ZAP70 phosphorylation, and the ordering of expression rescue does not
    match the ordering of activation rescue. Candidate explanations — that the
    revertant residue supports folding but not ITAM phosphorylation, that
    stoichiometry within the complex is wrong, or that the revertant cells are
    developmentally abnormal because they arose after thymic selection — have not
    been distinguished. This matters beyond CD247, because it is a natural
    experiment on whether receptor density is a sufficient therapeutic target.
- discussion_id: heterozygous_nonsense_clinical_significance
  kind: OPEN_QUESTION
  prompt: >-
    Do heterozygous CD247 nonsense alleles cause disease in their carriers, or are
    they dominant-negative only in vitro?
  attaches_to:
  - genetic#CD247 heterozygous nonsense alleles
  rationale: >-
    Three patients with heterozygous nonsense CD247 alleles had signs of
    immunodeficiency or autoimmunity, and the alleles suppress wild-type receptor
    expression and signalling when transduced into wild-type Jurkat cells. But the
    in vitro effect is measured under overexpression, no segregation or penetrance
    data are reported, and the authors themselves state the correlation with
    clinical features only as a possibility. Until that is settled the relationship
    is recorded as disputed rather than causative.
notes: >-
  Very few patients have been reported, so severity, frequency and treatment
  statements here describe the published series rather than an established
  disease spectrum.

  Two nodes deliberately have no downstream edge. "Revertant Somatic Mosaicism"
  modifies the disease course without being a step toward the phenotype, and
  including it as a causal step would wrongly imply it contributes to the
  immunodeficiency. The MA5.8 model link is recorded as FAILS_TO_RECAPITULATE
  rather than omitted, because a negative model result is the substantive finding
  that a curator reaching for murine CD247 data needs to see.

  The second `genetic` entry uses relationship_type DISPUTED on purpose. The
  dominant-negative effect of heterozygous nonsense alleles is well demonstrated
  in cell lines but is not established as the cause of the carriers' clinical
  features, and recording it as CAUSATIVE would overstate what the source claims.

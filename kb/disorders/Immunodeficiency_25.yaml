genetic:
- name: CD247
  notes: >-
    Encodes the TCR zeta chain (CD3zeta), the invariant subunit that homodimerises
    within the TCR/CD3 octamer and carries three of the complex's ten ITAMs.
    Reported germline disease alleles include p.M1T and p.Q70X. The locus appears
    unusually prone to somatic change, which is the proposed reason revertant
    mosaicism is so frequent here — a propensity that has been measured rather
    than assumed, and that generalises across the primary immunodeficiency genes
    in which reversion is seen.
  gene_term:
    preferred_term: CD247
    term:
      id: hgnc:1677
      label: CD247
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CD247 chain of the T-cell receptor (TCR) is essential for normal T cell
      development and function.
    explanation: >-
      States the gene's requirement for T-cell development, which is what its loss
      removes.
  - reference: PMID:38992472
    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous null mutations in CD247 lead to immunodeficiency, while carriers
      exhibit 50% reduced surface CD3.
    explanation: >-
      Establishes the gene-disease relationship and the recessive mode.
  - reference: PMID:28743717
    reference_title: "Analysis of the recovery of CD247 expression in a PID patient: insights into the spontaneous repair of defective genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analyses of other genes mutated in primary immunodeficiency diseases (PIDs)
      where reversions have been described also revealed a higher rate of mutation
      than that observed for genes mutated in PIDs where revertants have not been
      identified or control genes.
    explanation: >-
      Supports the elevated mutation propensity of CD247 and comparable genes as
      the reason reversion is common in this disorder rather than incidental.
- name: CD247 heterozygous nonsense alleles
  notes: >-
    A separate, non-recessive situation worth recording because it is easy to
    misread as carrier status. Heterozygous nonsense alleles that retain a
    truncated ITAM-deficient chain suppress wild-type receptor expression and
    signalling in vitro, so they are not equivalent to heterozygous nulls. The
    reported patients carrying them had signs of immunodeficiency or
    autoimmunity, but the dominant-negative effect is demonstrated in cell lines
    rather than established as the cause of their clinical features.
  gene_term:
    preferred_term: CD247
    term:
      id: hgnc:1677
      label: CD247
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  evidence:

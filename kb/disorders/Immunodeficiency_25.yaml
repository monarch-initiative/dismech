      The recovery of CD247 expression in some patient T cells was associated with
      both reversion of the inactivating mutation and a variant with a
      compensating mutation that could reconstitute TCR expression, but not as
      efficiently as wild-type CD247.
    explanation: >-
      Distinguishes true reversion from second-site compensation, and records that
      neither restores wild-type-level expression.
phenotypes:
- category: Immunologic
  name: Combined Immunodeficiency
  description: >-
    Cellular and humoral immunity are both compromised, since the antibody
    response depends on T-cell help. IUIS places CD3Z deficiency in the combined
    immunodeficiency table.
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CD3 deficiency CD3Z AR 186780 Very lowN ormalL ow Normal NK, no  T cells
    explanation: >-
      The IUIS row placing CD3Z deficiency among the combined immunodeficiencies,
      with very low T cells and preserved NK cells.
- category: Immunologic
  name: T-B+NK+ Immunophenotype
  description: >-
    Circulating T cells are profoundly reduced while B cells and NK cells are
    present, giving the T-B+NK+ pattern that separates this from the T-B-
    recombination defects. The NK compartment is present but not normal: an
    unusual CD56-negative CD16-positive population with diminished cytolytic
    activity has been described, so "NK preserved" describes cell number rather
    than cell function.
  phenotype_term:
    preferred_term: Decreased natural killer cell-induced killing of target cells
    term:
      id: HP:0025808
      label: Decreased natural killer cell-induced killing of target cells
  evidence:
  - reference: PMID:17170122
    reference_title: "T-B+NK+ severe combined immunodeficiency caused by complete deficiency of the CD3zeta subunit of the T-cell antigen receptor complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here a patient with T(-)B(+)NK(+) severe combined
      immunodeficiency (SCID) who was homozygous for a single C insertion
      following nucleotide 411 in exon 7 of the CD3zeta gene.
    explanation: >-
      States the T-B+NK+ pattern directly, which the previous evidence for this
      claim did not.
  - reference: PMID:17170122
    reference_title: "T-B+NK+ severe combined immunodeficiency caused by complete deficiency of the CD3zeta subunit of the T-cell antigen receptor complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient also exhibited an unusual population of CD56(-)CD16(+) NK cells
      with diminished cytolytic activity
    explanation: >-
      Qualifies the NK preservation: the cells are there but functionally and
      phenotypically abnormal.
- category: Immunologic
  name: Reduced Surface TCR/CD3 Expression
  description: >-
    The defining laboratory finding, and the one that points at a TCR-complex
    gene rather than a recombination or signalling defect: the few T cells
    present carry markedly reduced surface CD3. HPO has no term for reduced
    surface TCR or CD3 density on T cells, so this is recorded with a free-text
    preferred_term and no binding.
  phenotype_term:
    preferred_term: Reduced surface TCR/CD3 complex density on T cells
  notes: >-
    Needs an ontology term. HPO was searched for a reduced-surface-TCR and a
    reduced-CD3-expression concept and has neither; the nearest terms describe
    T-cell counts rather than receptor density per cell, which is a different
    measurement and would misstate the finding. Recorded unbound rather than
    bound to something broader.
  evidence:
  - reference: PMID:17170122

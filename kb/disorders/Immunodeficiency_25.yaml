      label: mature alpha-beta T cell
  evidence:
  - reference: PMID:2142600
    reference_title: "Congenital T-cell receptor immunodeficiencies in man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The biochemical basis of the defect in one of the cases thus far studied is
      an impaired association of CD3-zeta chain with the other chains of the
      complex. This defect prevented the maturation and transport of the
      incomplete complex to the cell surface.
    explanation: >-
      The original biochemical localisation of the lesion to assembly and export,
      predating identification of the gene.
  - reference: PMID:38992472
    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transduction of the mutations lacking 1, 2, or 3 ITAMs into ZKO cells could
      not restore normal surface CD3 expression (only 60%, 22%, and 10%,
      respectively), whereas in WT cells, normal surface CD3 expression was
      reduced (to 39%, 19%, and 9% of normal levels), and both effects were
      dependent on ITAM number.
    explanation: >-
      Quantifies the assembly defect and shows it scales with the number of ITAMs
      lost, in an isogenic CD247-null human T-cell background.
  - reference: PMID:17170122
    reference_title: "T-B+NK+ severe combined immunodeficiency caused by complete deficiency of the CD3zeta subunit of the T-cell antigen receptor complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these findings provide the first demonstration that
      complete CD3zeta deficiency in humans can cause SCID by preventing normal
      TCR assembly and surface expression.
    explanation: >-
      The first demonstration that complete loss of the chain causes human SCID
      specifically by blocking receptor assembly and export, which is the claim
      this node makes.
  - reference: PMID:17170122
    reference_title: "T-B+NK+ severe combined immunodeficiency caused by complete deficiency of the CD3zeta subunit of the T-cell antigen receptor complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few T cells present contained no detectable CD3zeta protein, expressed
      low levels of cell surface CD3epsilon, and were nonfunctional.
    explanation: >-
      Measures the consequence in patient cells: absent CD3zeta, reduced surface
      CD3epsilon, and loss of function.
  downstream:
  - target: Loss of ITAM-Dependent Proximal TCR Signaling
    description: >-
      Fewer surface receptors, and each surviving complex lacks the three
      zeta-chain ITAMs that normally recruit and activate ZAP70.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38992472
      reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All 6 transfectants showed reduced CD69 induction (25% to 50%),
        indicating that they were unable to signal downstream properly, neither
        isolated nor associated with WT CD247.
      explanation: >-
        Shows the signalling failure follows the assembly defect and is not
        rescued by the presence of wild-type CD247.
- name: Loss of ITAM-Dependent Proximal TCR Signaling
  biological_scale: MOLECULAR
  description: >-
    CD247 carries three of the ten ITAMs in the receptor complex. Their tyrosines
    are the docking sites that, once phosphorylated by LCK, recruit ZAP70 and
    start the proximal signalling cascade. In CD247 deficiency this step fails,
    and the failure is not repaired by restoring surface receptor: revertant
    variants that put the receptor back on the membrane still fail to support
    TCR-induced ZAP70 phosphorylation. The activation defect is therefore
    partly independent of receptor density.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  evidence:
  - reference: PMID:40711587
    reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, all CD247 somatic variants failed to induce TCR-mediated ZAP70
      tyrosine phosphorylation compared to WT.
    explanation: >-
      Locates the signalling block at ZAP70 recruitment and shows it persists when
      surface expression is restored.
  - reference: PMID:38992472
    reference_title: "Nonsense CD247 mutations show dominant-negative features in T-cell receptor expression and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The invariant TCR ζ/CD247 homodimer is crucial for TCR/CD3 expression and
      signaling through its 3 immunoreceptor tyrosine-based activation motifs
      (ITAMs).
    explanation: >-
      States the dual role of the chain in expression and in ITAM-dependent
      signalling.
  downstream:
  - target: Failed Thymic Selection and T-Cell Development
    description: >-
      Thymocyte positive and negative selection read the strength of TCR
      signalling, so a proximal signalling block disrupts both.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40711587
      reference_title: "Discordant Restoration of TCR Expression and Function by CD247 Somatic Reversions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It plays a key role in T-cell receptor (TCR) assembly and surface
        expression by cooperating with other invariant CD3 molecules and in TCR
        development and function by transducing signals from the TCR to initiate
        the activation and response of T cells for thymus selection or antigen
        recognition
      explanation: >-
        States that the signal CD247 transduces is the one used for thymic
        selection.
- name: Failed Thymic Selection and T-Cell Development
  biological_scale: CELLULAR
  description: >-
    Thymocytes need a TCR signal of the right strength to be positively selected,
    and a strong one to be negatively selected against self. With the zeta chain
    missing, both arms fail: few cells complete development, giving profound
    peripheral T-cell lymphopenia, and the self-reactive cells that should have
    been deleted are not, which is the accepted explanation for the autoimmunity
    that appears in longer-surviving patients.
  biological_processes:
  - preferred_term: thymic T cell selection
    modifier: DECREASED
    term:
      id: GO:0045061
      label: thymic T cell selection
  cell_types:

  - reference: PMID:16672702
    reference_title: "Inherited and somatic CD3zeta mutations in a patient with T-cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some of the patient's T cells had low levels of the T-cell receptor-CD3
      complex and carried the Q70X mutation in both alleles of CD3zeta, whereas

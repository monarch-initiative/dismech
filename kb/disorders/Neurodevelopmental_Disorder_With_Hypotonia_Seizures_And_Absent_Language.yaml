    from the Nedl2 knockout mouse, which dies within two weeks of birth with
    progressive bowel motility failure from intestinal aganglionosis. Patients
    have constipation, reflux and gastroparesis rather than Hirschsprung
    disease, and their enteric innervation has not been studied, so the
    mouse phenotype is at most a more severe version of a defect that remains
    to be shown in humans.

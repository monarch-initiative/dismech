inheritance:
- name: Autosomal Dominant
  description: >
    The large majority of patients carry a heterozygous missense variant that
    arose de novo. One family with an affected mother and two affected children
    sharing p.Arg1191Trp shows that the dominant form can be transmitted, with
    milder expressivity in the mother.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:34321324
    reference_title: "Delineating the genotypic and phenotypic spectrum of HECW2-related neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified 13 novel missense variants in HECW2 in 22 unpublished
      cases, of which 18 were confirmed to have a de novo variant.
    explanation: Heterozygous de novo missense variants in a multicentre series.
  - reference: PMID:34327820
    reference_title: "A novel likely pathogenic heterozygous HECW2 missense variant in a family with variable expressivity of neurodevelopmental delay, hypotonia, and epileptiform EEG patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Next-generation-sequencing revealed a novel likely pathogenic variant in
      HECW2 (c.3571C>T; p.Arg1191Trp) in the index patient, her mother and
      brother.
    explanation: Vertical transmission of a heterozygous missense variant in one family.
- name: Autosomal Recessive
  description: >
    A small number of consanguineous families carry homozygous nonsense,
    frameshift or splice variants, with clinically unaffected heterozygous
    parents. The phenotype overlaps the dominant form.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35487419
    reference_title: "A homozygous nonsense HECW2 variant is associated with neurodevelopmental delay and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thus this study describes the first homozygous HECW2 variant, inherited
      as an autosomal recessive pattern, contrasting with former reported de
      novo variants found in HECW2 patients.
    explanation: First recessive family, homozygous nonsense variant.
  - reference: PMID:40812465
    reference_title: "Autosomal recessive frameshift variant broadens HECW2-related disease spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In silico analyses and Sanger validation confirmed the pathogenicity of
      this variant and its autosomal recessive inheritance, with both parents
      being heterozygous carriers but clinically unaffected.
    explanation: Homozygous frameshift with unaffected heterozygous parents.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2021 review counted 35 cases with HECW2 missense variants and a 2023
    report counted 37. Further single case reports, including three recessive
    families, have appeared since. No population estimate exists.
  evidence:
  - reference: PMID:34321324
    reference_title: "Delineating the genotypic and phenotypic spectrum of HECW2-related neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In addition, we reviewed the genotypes and phenotypes of previously
      reported and new cases with HECW2 variants (n=35 cases).
    explanation: Thirty-five cases pooled in 2021.
  - reference: PMID:37280227
    reference_title: "A novel HECW2 variant in an infant with congenital long QT syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of the 37 cases of NDHSAL reported to date, only 4 had cardiac comorbidities
    explanation: Thirty-seven cases counted by 2023.
genetic:
- name: HECW2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    HECW2 (2q32.3) encodes HECT, C2 and WW domain containing E3 ubiquitin
    protein ligase 2 (NEDL2). Causality for the dominant form rests on
    recurrent de novo missense variants in more than 30 unrelated patients,
    clustering of those variants in or near the HECT domain, constraint
    against variation in that region, and a consistent phenotype. ClinGen
    classifies HECW2 as Definitive for autosomal dominant and Limited for
    autosomal recessive complex neurodevelopmental disorder (MONDO:0100038).
    That is a broader disease concept than MONDO:0014995, so the tiers are
    cited as evidence but not recorded in gene_disease_validity. The
    recessive form rests on three consanguineous families, each with a
    different homozygous loss-of-function allele.
  gene_term:
    preferred_term: HECW2
    term:
      id: hgnc:29853
      label: HECW2
  evidence:
  - reference: PMID:27389779
    reference_title: "De novo missense variants in HECW2 are associated with neurodevelopmental delay and hypotonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      we performed whole exome sequencing on a large cohort of patients with ID
      or neurodevelopmental delay and identified four novel de novo predicted
      deleterious missense variants in HECW2 in six probands with
      ID/developmental delay and hypotonia.
    explanation: Defining clinical exome series, six probands.
  - reference: PMID:27334371
    reference_title: "Mutations in HECW2 are associated with intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In combination with previously published exome sequencing results in
      neurodevelopmental disorders, our analysis implicates HECW2 as a novel
      candidate gene in ID and epilepsy.
    explanation: Independent trio study implicating HECW2 from pooled de novo data.
  - reference: PMID:34321324
    reference_title: "Delineating the genotypic and phenotypic spectrum of HECW2-related neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All variants identified are missense, and the majority of likely
      pathogenic and pathogenic variants are located in or near the C-terminal
      HECT domain (88.2%).
    explanation: Allelic spectrum of the dominant form.
  - reference: CGGV:assertion_191cff25-f54c-4628-87f6-13a5daaec847-2023-01-18T170000.000Z
    reference_title: "HECW2 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HECW2 | HGNC:29853 | complex neurodevelopmental disorder | MONDO:0100038 | AD | Definitive"
    explanation: >-
      ClinGen expert-panel classification of HECW2 in dominant complex
      neurodevelopmental disorder, the broader ClinGen concept covering this
      disease.
pathophysiology:
- name: HECW2 HECT-Domain Missense Variant
  biological_scale: MOLECULAR
  description: >
    Heterozygous missense variants, almost always de novo, cluster in or next
    to the C-terminal HECT catalytic domain of HECW2, with recurrent hotspots at
    Arg1191 and Arg1330. No heterozygous truncating variant has been reported in
    a patient, and the heterozygous parents of recessive patients are
    unaffected, so simple haploinsufficiency does not explain the dominant
    form. A dominant-negative effect has been proposed but not tested.
  genes:
  - preferred_term: HECW2
    term:
      id: hgnc:29853
      label: HECW2
  genetic_context:
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:27334371
    reference_title: "Mutations in HECW2 are associated with intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      with five of six reported DNMs located within (n=3) or immediately
      adjacent to (n=2) the HECT domain of the HECW2 protein.
    explanation: Early clustering of de novo variants around the HECT domain.
  - reference: PMID:34321324
    reference_title: "Delineating the genotypic and phenotypic spectrum of HECW2-related neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two variants, (p.(Arg1191Gln);p.(Arg1330Trp)), accounted for 22.9% and
      20% of cases, respectively.
    explanation: Two recurrent hotspot variants.
  - reference: PMID:34047014
    reference_title: "HECW2-related disorder in four Japanese patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These findings suggest that the dominant negative effects of missense
      variants around the HECT domain may be the mechanism underlying
      HECW2-related disorder.
    explanation: >-
      The dominant-negative proposal, inferred from the missense-only spectrum
      rather than from a functional assay.
  downstream:
  - target: Disrupted HECW2 Ubiquitin Ligase Function
    causal_link_type: DIRECT
    description: >
      Inferred from the position of the variants in the catalytic domain; the
      effect of any patient missense variant on ligase activity or substrate
      levels has not been measured.
    evidence:
    - reference: PMID:27389779
      reference_title: "De novo missense variants in HECW2 are associated with neurodevelopmental delay and hypotonia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        However, functional studies will be necessary to assess the missense
        alleles for loss or gain of function or dominant negative mechanism.
      explanation: The defining series states that the functional effect is unknown.
- name: Biallelic HECW2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    In the recessive families, homozygous nonsense, frameshift and splice
    alleles are predicted to abolish HECW2 or, for the one splice allele
    studied, cause an in-frame exon 22 deletion with protein reduced by about
    60% in patient cells.
  genes:
  - preferred_term: HECW2
    term:
      id: hgnc:29853
      label: HECW2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35753050
    reference_title: "First splicing variant in HECW2 with an autosomal recessive pattern of inheritance and associated with NDHSAL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Functional studies showed a twofold increase of its RNA expression, while
      the protein expression level was reduced by 60%, suggesting a partial
      loss-of-function mechanism of pathogenesis.
    explanation: Reduced HECW2 protein from a homozygous splice allele.
  - reference: PMID:40812465
    reference_title: "Autosomal recessive frameshift variant broadens HECW2-related disease spectrum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This frameshift variant likely results in nonsense-mediated decay (NMD)
      of the mRNA, suggesting a loss-of-function mechanism distinct from the
      mechanism implicated in missense variants that causing the disease with
      autosomal dominant inheritance.
    explanation: Predicted, not measured, loss of function for a homozygous frameshift.
  downstream:
  - target: Disrupted HECW2 Ubiquitin Ligase Function
    causal_link_type: DIRECT
    description: >
      Loss or reduction of the HECW2 protein removes its ligase function.
    evidence:
    - reference: PMID:35753050
      reference_title: "First splicing variant in HECW2 with an autosomal recessive pattern of inheritance and associated with NDHSAL."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Functional studies showed a twofold increase of its RNA expression,
        while the protein expression level was reduced by 60%
      explanation: Less HECW2 protein is available to act as a ligase.
- name: Disrupted HECW2 Ubiquitin Ligase Function
  biological_scale: MOLECULAR
  description: >
    HECW2 is a HECT-type E3 ligase whose WW domains bind PY motifs in its
    substrates. In cultured cells it ubiquitinates and stabilizes p73,
    enhancing p73-dependent transcription, and it targets PCNA, lamin B1 and
    HP1 alpha and beta for proteasomal degradation. In endothelial cells it
    stabilizes AMOTL1 by K63-linked ubiquitination, and in mice it promotes
    GDNF/RET/AKT signalling in enteric neural precursors through Nedd8 ligase
    activity. Which of these functions is lost or altered in patients, and in
    which cells, is not known.
  genes:
  - preferred_term: HECW2
    term:
      id: hgnc:29853
      label: HECW2
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:12890487
    reference_title: "A novel HECT-type E3 ubiquitin ligase, NEDL2, stabilizes p73 and enhances its transcriptional activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      p73 was efficiently ubiquitinated but stabilized in a NEDL2-dependent
      manner.
    explanation: Wild-type HECW2 ubiquitinates and stabilizes p73 in cultured cells.
  - reference: PMID:29753763
    reference_title: "E3 ubiquitin ligase HECW2 targets PCNA and lamin B1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      HECW2 mediates their ubiquitination and targets them for proteasomal
      degradation.
    explanation: Wild-type HECW2 targets PCNA and lamin B1 for degradation.
  - reference: PMID:30208514
    reference_title: "E3 ubiquitin ligase HECW2 mediates the proteasomal degradation of HP1 isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ectopic expression of HECW2 causes the ubiquitination of HP1α and
      β, thereby targeting them for proteasomal degradation.
    explanation: Wild-type HECW2 targets HP1 isoforms for degradation.
  - reference: PMID:27498087
    reference_title: "The endothelial E3 ligase HECW2 promotes endothelial cell junctions by increasing AMOTL1 protein stability via K63-linked ubiquitination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      HECW2 physically interacts with AMOTL1 and enhances its stability via
      lysine 63-linked ubiquitination.
    explanation: A further substrate, in endothelial cells.
  downstream:
  - target: Disrupted Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Inferred. HECW2 is expressed in the developing brain and its substrate
      p73 regulates neurogenesis, and knockdown of the zebrafish orthologue
      disturbs early brain morphology, but no study has linked a specific HECW2
      substrate to the human brain phenotype.
    evidence:
    - reference: PMID:27334371
      reference_title: "Mutations in HECW2 are associated with intellectual disability and epilepsy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: PRIMARY_RESULT
      snippet: >-
        Using BrainSpan data,43 we find that HECW2 is expressed at moderate
        levels in the brain throughout development, with the highest
        expression in frontal cortex.
      explanation: HECW2 is expressed in the developing human brain.
    - reference: PMID:33205896
      reference_title: "Association of HECW2 variants with developmental and epileptic encephalopathy and knockdown of zebrafish hecw2a."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Functionally, transcriptional knockdown of zebrafish hecw2a led to
        early morphological abnormalities in the brain tissues.
      explanation: Loss of the zebrafish orthologue disturbs brain development.
  - target: Impaired Enteric Nervous System Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Inferred from the knockout mouse. Nedl2-deficient mice have intestinal
      aganglionosis through reduced GDNF/RET/AKT signalling in enteric neural
      precursors. Enteric innervation has not been examined in patients.
    evidence:
    - reference: PMID:25555806
      reference_title: "NEDL2 is an essential regulator of enteric neural development and GDNF/Ret signaling."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        We show that NEDL2 positively regulates enteric neural precursor
        proliferation through the GDNF/Akt signaling pathway.
      explanation: Mouse evidence that HECW2 supports enteric neural precursor proliferation.
- name: Disrupted Brain Development
  biological_scale: TISSUE
  description: >

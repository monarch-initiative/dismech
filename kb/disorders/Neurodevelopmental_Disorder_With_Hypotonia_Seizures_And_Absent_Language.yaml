    and progressive bowel dysmotility from intestinal aganglionosis; about a
    third have hydronephrosis. Brain phenotypes were not reported.
  modeled_mechanisms:
  - target: Impaired Enteric Nervous System Development
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Reduced enteric neural precursor proliferation and aganglionosis
      through impaired GDNF/RET/AKT signalling.
    limitations: >-
      Aganglionosis has not been described in patients, whose gastrointestinal
      problems are dysmotility, reflux and constipation; the knockout is a
      complete loss of function and does not model heterozygous missense
      variants.

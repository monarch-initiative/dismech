discussions:
- discussion_id: hecw2_variant_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the dominant HECT-domain missense variants reduce HECW2 ligase
    activity, act dominant-negatively on the wild-type protein, or alter
    substrate choice, and how does that relate to the recessive
    loss-of-function form, given that heterozygous null carriers are
    unaffected?
  attaches_to:
  - pathophysiology#HECW2 HECT-Domain Missense Variant
  - pathophysiology#Disrupted HECW2 Ubiquitin Ligase Function
  rationale: >
    No patient missense variant has been assayed for ligase activity or
    substrate turnover. The proposed dominant-negative mechanism is inferred
    only from the absence of heterozygous truncating variants. Parents carrying
    one null allele are unaffected while biallelic null alleles cause disease,
    so a dominant missense allele would have to lower total HECW2 function
    below the half dosage that carriers tolerate. Which substrate (p73, PCNA, lamin B1, HP1 or
    others) matters in the developing brain is also unknown.
notes: >-
  Lump/split: MONDO:0014995 (OMIM:617268) has no MONDO descendants and one
  causal gene. The dominant missense and recessive loss-of-function forms are
  kept in one entry because MONDO does not split them and the reported
  recessive phenotypes fall within the dominant spectrum; they are separated
  at the pathophysiology level. No GeneReviews or StatPearls chapter exists
  (just check-genereviews). Not cited, and why: PMID:29807643 (2018 case
  report and review) and PMID:32814609 (acquired microcephaly case report)
  returned no abstract or full text, so no snippet could be taken from them.
  The patient with a coexisting de novo 15q25.2-q25.3 deletion (PMID:42598698;
  seizures, absent speech and microcephaly) is not cited for any phenotype,
  because the deletion may account for part of that phenotype.

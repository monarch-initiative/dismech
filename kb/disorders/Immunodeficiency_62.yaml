  notes: >-
    Two affected individuals, sisters from one non-consanguineous family. No second
    kindred has been reported in the seven years since the founding paper; the one
    subsequent primary publication studied platelet function in the younger of the
    same two sisters. No population prevalence estimate exists and none is derivable
    from a cohort of this size.
  evidence:
  - reference: PMID:42687834
    reference_title: "Normal platelet function in a patient with ARHGEF1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ARHGEF1 deficiency has been described in two female siblings (P1 and P2) carrying compound heterozygous germline variants in ARHGEF1 (Figure 1A) , resulting in primary antibody deficiency and recurrent severe respiratory tract infections with bronchiectasis"
    explanation: >-
      A 2026 paper's own statement of the published case count, which is still two
      siblings. Graded HUMAN_CLINICAL with quote_role BACKGROUND because the
      sentence restates the founding clinical report rather than this paper's own
      platelet results.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Both sisters were started on polyvalent IgG replacement and were reported doing
    well on subcutaneous immunoglobulin at last follow-up, at 30 and 27 years. No
    trial or case series has evaluated immunoglobulin replacement in ARHGEF1
    deficiency specifically - with two patients none could exist - so the general
    justification is the class-level standard of care for inborn errors of immunity
    with impaired antibody production, and the disease-specific evidence is
    observational use in the two reported patients.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective Specific Antibody Production
    treatment_effect: BYPASSES
    description: >-
      Replacement immunoglobulin supplies the specific antibody the patients cannot
      make. It bypasses the defect; it does not restore RhoA signalling, B cell
      trafficking, or the patients' own vaccine responses.
    evidence:
    - reference: PMID:42208906
      reference_title: "Practice parameter for inborn errors of immunity: What is new in the 2025 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The management part includes recommendations for immunoglobulin replacement, antibiotic prophylaxis, hematopoietic stem cell transplantation, precision medicine, and quality-of-life assessment."
      explanation: >-
        Establishes immunoglobulin replacement as a recommended management
        component for inborn errors of immunity. Class-level evidence, cited as
        such.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P1 was aged 30 and was doing well on subcutaneous IgG replacement therapy."
    explanation: >-
      The only disease-specific outcome statement available: one patient doing well
      on subcutaneous replacement at 30 years. An observation in one patient, not
      an efficacy result.
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polyvalent IgG replacement therapy was initiated, and a lung lobectomy was performed on P1 at the age of 12 because of persistent suppuration associated with localized bronchiectasis"
    explanation: >-
      Records the initiation of replacement therapy in the founding kindred.
- name: Lung Lobectomy for Localized Suppurative Bronchiectasis
  description: >-
    Resection of a lobe destroyed by localized suppurative bronchiectasis, performed
    in the elder sister at age 12 for persistent suppuration. The younger sister
    also underwent lobectomy, but for her bronchial mucoepidermoid carcinoma rather
    than for infection. Surgery here treats the structural sequela; it does nothing
    to the underlying immune defect, and the general practice of resecting localized
    destroyed lung in bronchiectasis is not specific to this disease.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lung lobectomy
    term:
      id: NCIT:C15272
      label: Lobectomy
  target_mechanisms:
  - target: Bronchiectasis
    treatment_effect: MODULATES
    description: >-
      Removing the destroyed, chronically infected lobe removes the focus of
      persistent suppuration. It does not prevent bronchiectasis elsewhere.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Polyvalent IgG replacement therapy was initiated, and a lung lobectomy was performed on P1 at the age of 12 because of persistent suppuration associated with localized bronchiectasis"
      explanation: >-
        States the indication for the operation in the one patient in whom it was
        performed for infection.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polyvalent IgG replacement therapy was initiated, and a lung lobectomy was performed on P1 at the age of 12 because of persistent suppuration associated with localized bronchiectasis"
    explanation: >-
      The single reported instance of this intervention for infection in this
      disease.
diagnosis:
- name: Whole Exome Sequencing
  description: >-
    The test that made the diagnosis. IMD62 has no clinical or laboratory feature
    that distinguishes it from any other primary antibody deficiency at the
    bedside - the two sisters were carried as unexplained antibody deficiency for
    years - so the diagnosis is genetic, and in the founding kindred it came from
    comparing the two affected siblings' exomes.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES of DNA from total blood samples from both patients was performed with a view to identifying the underlying genetic cause of their disease."
    explanation: >-
      States the diagnostic route taken in the only reported kindred.
- name: Specific Antibody Response Testing
  description: >-
    Measurement of antibody titres to protein and polysaccharide vaccine antigens
    after immunisation. This is the functional test that shows the defect, and it
    matters here because total IgG is only modestly reduced (6.3 and 6.93 g/l):
    an entry-level immunoglobulin panel alone would understate the problem, while
    the vaccine responses are flatly absent.
  diagnosis_term:
    preferred_term: specific antibody response measurement
    term:
      id: NCIT:C81869
      label: Immunoglobulin Measurement
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibody production (including T cell-dependent and -independent vaccine responses to poliovirus, tetanus, diphtheria toxoids, and pneumococcal immunizations) was defective in both patients"
    explanation: >-
      Names the antigens tested and the result in both patients.
- name: B Cell Immunophenotyping by Flow Cytometry
  description: >-
    Flow cytometric enumeration of the circulating B cell subsets. The pattern is
    the one that should raise ARHGEF1 as a possibility rather than a generic CVID
    label: marginal zone and switched memory B cells almost absent, transitional
    B cells raised. Examining a blood film at the same time is worth doing, since
    circulating myelocytes with an unremarkable marrow point the same way.
  diagnosis_term:
    preferred_term: B cell immunophenotyping
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both ARHGEF1-deficient patients showed an abnormal B cell immunophenotype, with a deficiency in marginal zone and memory B cells and an increased frequency of transitional B cells."
    explanation: >-
      Gives the subset pattern this test is being recorded for.
animal_models:
- name: Lsc (Arhgef1) knockout mouse
  species: Mouse
  genotype: Lsc (Arhgef1) homozygous null by gene targeting
  publication: PMID:11526402
  description: >-
    The murine ortholog knockout, published nearly two decades before the human
    disease and the reason the human marginal zone and antibody phenotype was
    recognisable when it appeared. Lsc-null mice lack marginal zone B cell
    homeostasis, show reduced basal lymphocyte motility with defective release from
    integrin ligands, and fail to mount the antigen-specific IgM response to a
    T-dependent protein antigen.
  modeled_mechanisms:
  - target: Loss of Circulating Marginal Zone and Memory B Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Marginal zone B cell homeostasis fails in the Lsc-null mouse as it does in the
      ARHGEF1-deficient patients, and in both the proximate defect is a trafficking
      one rather than a developmental block.
    limitations: >-
      The mouse marginal zone compartment is splenic and anatomically better defined
      than the circulating CD27+IgD+ population measured in the patients, so the two
      readouts are related but not the same measurement. The mouse data also say
      nothing about the memory B cell loss that is equally prominent in the human
      disease.
    readouts:
    - name: Marginal zone B cell homeostasis
      target: Loss of Circulating Marginal Zone and Memory B Cells
      direction: DECREASED
      interpretation: >-
        The compartment-level readout that corresponds to the human marginal zone
        B cell deficiency.
      evidence:
      - reference: PMID:11526402
        reference_title: "Lsc is required for marginal zone B cells, regulation of lymphocyte motility and immune responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lsc is essential for marginal zone B (MZB) cell homeostasis and for the generation of immune responses."
        explanation: >-
          States the marginal zone requirement measured in the knockout.
    evidence:
    - reference: PMID:11526402
      reference_title: "Lsc is required for marginal zone B cells, regulation of lymphocyte motility and immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lsc is expressed primarily in the hematopoietic system and links the activation of G alpha(12) and G alpha(13)-coupled receptors to actin polymerization in B and T cells."
      explanation: >-
        Establishes that the mouse model perturbs the same receptor-to-actin
        pathway that is lost in the human disease, which is what makes it
        informative for this node.
  - target: Defective Specific Antibody Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Lsc-null mice fail to produce the antigen-specific IgM response to a protein
      antigen, and their marginal zone B cells do not contribute to the T-dependent
      antibody response - the same functional endpoint measured in the patients as
      absent vaccine responses.
    limitations: >-
      The mouse experiments use defined model antigens and read out IgM; the human
      phenotype is absent IgG responses to toxoid, polio and pneumococcal
      immunisation with IgG4 essentially undetectable. The classes and antigens
      differ, so the correspondence is at the level of "no specific antibody
      response", not of a matched assay.
    readouts:
    - name: Antigen-specific IgM response to a T-dependent protein antigen
      target: Defective Specific Antibody Production
      direction: DECREASED
      interpretation: >-
        Functional antibody readout in the knockout, corresponding to the patients'
        absent specific antibody responses.
      evidence:
      - reference: PMID:16286020
        reference_title: "Lsc regulates marginal-zone B cell migration and adhesion and is required for the IgM T-dependent antibody response."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we demonstrate that Lsc, a protein that regulates G protein-coupled-receptor signaling and RhoA activation, is required by B lymphocytes for the antigen-specific IgM antibody response to a protein antigen."
        explanation: >-
          Reports the failed antigen-specific antibody response in the knockout.
    evidence:
    - reference: PMID:16286020
      reference_title: "Lsc regulates marginal-zone B cell migration and adhesion and is required for the IgM T-dependent antibody response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consequently, lsc(-/-) MZB cells do not traffick appropriately in an immune response and do not contribute to the TD antibody response."
      explanation: >-
        Links the trafficking defect to the antibody failure in the model, the same
        causal shape this entry curates for the human disease.
discussions:
- discussion_id: imd62_mouse_platelet_phenotype_absent_in_humans
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Arhgef1-null mice have a severe platelet activation and haemostasis defect.
    An ARHGEF1-deficient human has none. Which species is telling us what ARHGEF1
    does in platelets?
  attaches_to:
  - "pathophysiology#Reduced RhoA Activation in Lymphocytes"
  rationale: >-
    Arhgef1-/- mice have prolonged tail bleeding and carotid occlusion times, with
    defective platelet aggregation, granule secretion, integrin activation, clot
    retraction and spreading, and absent platelet RhoA activation - a phenotype
    striking enough that its authors proposed ARHGEF1 as a therapeutic target in
    thrombosis. When platelet function was finally measured in the younger of the
    two ARHGEF1-deficient sisters, everything was normal: aggregometry across seven
    agonists, glycoprotein expression and PAC-1 binding, dense and alpha granule
    content and secretion, spreading, clot retraction, procoagulant extracellular
    vesicle release, and - decisively - platelet RhoA activation itself, which was
    of similar magnitude to control. She had had no bleeding through lobectomy,
    ovarian cyst excision, breast implant surgery, two childbirths and terminations.
    So the divergence is not a matter of assay sensitivity: the proximate signalling
    step that fails in the patient's lymphocytes does not fail in her platelets. The
    authors attribute this to redundancy among the RhoGEFs human platelets express,
    noting that ARHGEF7 and ARHGEF6 are more abundant than ARHGEF1 there, and that
    ARHGEF2 and ARHGEF6 protein levels were unchanged so any compensation would have
    to be at the level of activation rather than abundance. The mismatch matters for
    this entry in two directions: it warns against importing the mouse platelet
    literature into the human disease description, and it suggests that the
    lymphocyte phenotype is severe precisely because lymphocytes lack the RhoGEF
    redundancy that protects platelets. It is also a single patient, and the
    compensating mechanism is hypothesised rather than identified.
  evidence:
  - reference: PMID:30994039
    reference_title: "Arhgef1 Plays a Vital Role in Platelet Function and Thrombogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that Arhgef1-/- mice had prolonged carotid artery occlusion and tail bleeding times."
    explanation: >-
      The murine haemostatic phenotype that the human patient does not have.
  - reference: PMID:42687834
    reference_title: "Normal platelet function in a patient with ARHGEF1 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the severe platelet phenotype reported in Arhgef1 -/- mice, loss of ARHGEF1 expression in human platelets was not associated with detectable functional abnormalities across multiple assays."
    explanation: >-
      Recorded as REFUTE against the proposition that the murine platelet phenotype
      transfers to human ARHGEF1 deficiency.
  - reference: PMID:42687834
    reference_title: "Normal platelet function in a patient with ARHGEF1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ARHGEF1 -deficient platelets exhibited RhoA activation of a similar magnitude to control platelets under identical activation conditions (Figure 2C), indicating no defect in RhoA activation."
    explanation: >-
      Locates the divergence at the RhoA activation step itself, not at a downstream
      readout - which is what rules out an assay-sensitivity explanation.
  - reference: PMID:42687834
    reference_title: "Normal platelet function in a patient with ARHGEF1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient P2, a 36-year-old woman, had no personal or familial history of bleeding, including during multiple hemostatic challenges (lung lobectomy, ovarian cyst excision, breast implant placement, two childbirths, and elective pregnancy terminations)."
    explanation: >-
      The clinical counterpart: repeated haemostatic challenges without bleeding.
  proposed_experiments:
  - experiment_id: exp_imd62_platelet_rhogef_redundancy
    name: Which RhoGEF sustains RhoA activation in ARHGEF1-null human platelets
    description: >-
      Knock down ARHGEF7, ARHGEF6, ARHGEF2 and ARHGEF12 individually and in
      combination in a human megakaryocytic system carrying an engineered ARHGEF1
      null, and measure agonist-induced RhoA-GTP, aggregation and clot retraction.
      This would test directly the redundancy hypothesis the platelet paper offers,
      and would say whether lymphocytes lack the same redundancy.
    would_support:
    - "discussions#imd62_mouse_platelet_phenotype_absent_in_humans"
    supporting_outcome:
    - >-
      Loss of one or more additional platelet RhoGEFs on the ARHGEF1-null background
      reproduces the murine platelet phenotype in human cells.
    refuting_outcome:
    - >-
      RhoA activation and platelet function remain intact despite combined RhoGEF
      knockdown, implying the species difference lies elsewhere than in RhoGEF
      redundancy.
- discussion_id: imd62_malignancy_risk_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does germline ARHGEF1 loss carry a tumour risk, and specifically a lymphoma
    risk, given that somatic ARHGEF1 loss of function is recurrent in germinal
    centre B cell-like diffuse large B cell lymphoma?
  attaches_to:
  - "phenotypes#Bronchial neoplasm"
  - "pathophysiology#Disturbed Germinal Center Reaction"
  rationale: >-
    One of the two reported patients developed a bronchial mucoepidermoid carcinoma
    at 21. Taken alone that is a single tumour in a chronically infected and
    bronchiectatic lobe, and nothing more. What keeps the question open is the
    mechanism on the other side: the founding report's own introduction notes that
    germinal centre B cell-like diffuse large B cell lymphoma is frequently
    associated with loss-of-function ARHGEF1 mutations, and that Arhgef1-null mouse
    germinal centre B cells fail to activate sphingosine-1-phosphate signalling and
    escape excessively into blood and lymph - the same retention failure this entry
    curates as the cause of the patients' small, B cell-poor germinal centres. A
    germline null in that pathway is therefore not an obviously neutral background
    for lymphomagenesis, whatever the salivary-type carcinoma turns out to have been.
    With two patients and one tumour of the wrong lineage to bear on the question,
    the honest position is that malignancy risk in IMD62 is UNKNOWN - not absent,
    and not established. Nothing in this entry should be used to counsel a family
    about cancer risk, and no surveillance recommendation follows from it.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "at 21 years of age, she was diagnosed with bronchial mucoepidermoid carcinoma and underwent a lung lobectomy"
    explanation: >-
      The single reported malignancy in the two-patient series.
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "somatic ARHGEF1 mutations are involved in the pathogenesis of germinal center (GC) B cell-like diffuse large B cell lymphoma (GCB-DLBCL)"
    explanation: >-
      The founding report's introduction, restating the somatic-lymphoma literature
      that makes the germline question worth keeping open. Graded with quote_role
      BACKGROUND because the sentence summarises other groups' work rather than this
      paper's own results; the quotation stops where the source line breaks mid-word.
notes: >-
  Gene anchor. MONDO:0032763 records no causal-gene (RO:0004003) relationship, so
  the stub carried no `genes:` field and the gene had to be taken from the
  concept's xrefs. MedGen C5193109 (from OMIM #618459) links the concept to NCBI
  Gene 9138, which resolves to ARHGEF1 at 19q13.2 (HGNC:681, alias IMD62); the IUIS
  2024 classification row independently names ARHGEF1 with autosomal recessive
  inheritance against OMIM 618459. The missing MONDO relationship is worth
  reporting upstream.

  Nosology. Orphanet calls this entity "Childhood-onset common variable
  immunodeficiency phenotype due to ARHGEF1 deficiency" (ORPHA:696942, exact match
  to OMIM:618459), and IUIS 2024 places the ARHGEF1 row in Table 3 section 2, the
  CVID-phenotype antibody deficiencies. Both readings are compatible
  with the entry: the patients have low IgG, absent specific antibody responses,
  low memory B cells and a CVID-like clinical course. The entry is kept as its own
  Disease record rather than folded into common variable immunodeficiency because
  it is monogenic with a defined mechanism, which is exactly the distinction the
  CVID grouping does not make.

  What the disease is, mechanistically. Reading this as "another antibody
  deficiency" misses the point. The lesion is not in antigen receptor signalling;
  it is in Galpha12/13-coupled receptor signalling to RhoA, and the readouts that
  distinguish it are positional - circulating myelocytes with a normal marrow,
  transitional B cells accumulating while marginal zone and memory compartments
  empty, and germinal centres that are structurally intact but nearly free of
  B cells while stuffed with plasma cells. The founding report frames the entity as
  a mirror image of WHIM syndrome, where a CXCR4 gain of function traps cells in the
  marrow; here the failure is retention rather than egress.

  Features NOT curated, and why. Serum IgM was below reference in the elder sister
  only (0.53 g/l against 0.68-1.28) and within reference in the younger, and serum
  IgA likewise; MedGen annotates "Decreased circulating IgM concentration" for this
  concept from the OMIM clinical synopsis, but the underlying table shows the
  finding in one of two patients, so it is named here rather than curated as a
  disease phenotype. The elder sister's low isohaemagglutinin titre and the younger
  sister's severe primary HSV-1 infection are likewise single-patient findings; the
  HSV-1 event is quoted inside the zoster phenotype's evidence rather than given
  a phenotype of its own, because a single severe primary infection is not
  "recurrent herpes". The expanded CD21-low CD38-low B cell subset and the raised
  CCR7 on naive CD8+ T cells are reported without reference intervals in the
  source, so neither is curated as a phenotype and neither is claimed anywhere
  else in this entry.

  No `datasets:` block. No ARHGEF1-immunodeficiency-specific accession was
  identified, and searching the gene alone returns the large ARHGEF1 hypertension,
  platelet, vascular and cancer literature instead - the Named Entity Confusion
  hazard the dataset SOP warns about.

  No GeneReviews chapter. `just check-genereviews` against the committed Bookshelf
  index (snapshot 2026-09-10, 958 GeneReviews chapters) returns NO_CHAPTER for both
  GeneReviews and StatPearls, so the usual Mendelian phenotype baseline is not
  available for this entity and the phenotype list rests on the founding report's
  Table 1 and clinical narrative.

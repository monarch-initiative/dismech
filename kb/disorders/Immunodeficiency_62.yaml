name: Immunodeficiency 62
creation_date: "2026-09-25T00:00:00Z"
category: Mendelian
synonyms:
- IMD62
- ARHGEF1 deficiency
- Childhood-onset common variable immunodeficiency phenotype due to ARHGEF1 deficiency
- Childhood-onset CVID phenotype due to ARHGEF1 deficiency
description: >-
  Immunodeficiency-62 is an autosomal recessive primary antibody deficiency caused
  by biallelic loss-of-function variants in ARHGEF1 at 19q13.2. ARHGEF1 is a
  RhoA-specific guanine nucleotide exchange factor expressed predominantly in
  haematopoietic cells, coupling Galpha12/13-associated G protein-coupled
  receptors - the lysophospholipid receptors for sphingosine-1-phosphate and
  lysophosphatidic acid, and the thromboxane A2 receptor - to RhoA activation. The
  disease is therefore not a defect of antigen receptor signalling but of where
  lymphocytes go: with no ARHGEF1 protein, RhoA activity and steady-state cortical
  actin polymerisation fall, lymphocytes migrate poorly and detach poorly from
  matrix, and B cells and myeloid precursors are not held in the compartments where
  they should mature.

  The clinical picture follows from that. Both reported patients - sisters - had
  recurrent upper and lower respiratory tract infection from late in the first
  decade, pneumonia from ages 7 and 11, and bronchiectasis. Their blood carried
  circulating myelocytes, an excess of transitional B cells, and almost no marginal
  zone or memory B cells; specific antibody responses to protein and polysaccharide
  vaccines were absent. A mediastinal lymph node from one sister showed small
  germinal centres with few B cells but an excess of plasma cells - the
  histological counterpart of a second consequence of the same lesion, the failure
  of the RhoA/ROCK arm to restrain PI3K/AKT signalling.

  EVIDENCE BASE IS VERY THIN AND HAS NOT BROADENED. Seven years after the founding
  report the literature still describes exactly one kindred and two affected
  individuals; the only subsequent primary paper studied platelet function in one
  of the same two sisters. No ClinGen gene-disease validity assertion and no
  GeneReviews chapter exist. The entry is written to be mechanism-rich and
  clinically cautious, and single-patient features - immune thrombocytopenia in
  one sister, a bronchial mucoepidermoid carcinoma in the other - are curated as
  what they are rather than as established features of the disease.

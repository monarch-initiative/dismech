classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      An inborn error of immunity presenting as a primary antibody deficiency with
      recurrent sinopulmonary infection; placed with the immune disorders rather
      than with the respiratory ones, whose involvement is a consequence.
  iuis_category:
    classification_value: predominantly antibody deficiency
    notes: >-
      IUIS 2024 phenotypic classification, Table 3 (predominantly antibody
      deficiencies), section 2 (severe reduction in at least two serum
      immunoglobulin isotypes with normal or low B cell numbers, CVID phenotype):
      the "ARHGEF1 deficiency" row, listing ARHGEF1, autosomal recessive
      inheritance, OMIM 618459, hypogammaglobulinaemia with lack of antibody, and
      recurrent infections with bronchiectasis. The section placement is
      consistent with Orphanet naming the disorder a childhood-onset CVID
      phenotype. The row is unchanged from the 2022 edition of the same table.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ARHGEF1 deficiency | ARHGEF1 | AR | 618459 | Hypogammaglobulinemia; lack of antibody | Recurrent infections, bronchiectasis"
      explanation: >-
        The IMD62 row of IUIS 2024 Table 3, giving the gene, the autosomal
        recessive mode, the OMIM phenotype number, and the immunological and
        clinical summary on which this classification rests.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    ARHGEF1 lies at 19q13.2 and the two affected sisters are compound
    heterozygotes: a nonsense allele inherited from their healthy father and a
    splice acceptor site allele from their healthy mother. Both parents are
    unaffected carriers, so the recurrence risk for a further pregnancy of this
    couple is the standard autosomal recessive 25%. Segregation rests on this one
    family; no second kindred has been reported.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense mutation c.898C>T (Chr19: 42398710: C>T; hg19 build 137) was inherited from the father, and a splice mutation c.1669-1G>T (Chr19: 42406933: G>T) was inherited from the mother."
    explanation: >-
      Establishes biparental transmission of two different damaged alleles to the
      affected siblings, which is the compound heterozygous, autosomal recessive
      pattern.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ARHGEF1 deficiency | ARHGEF1 | AR | 618459 | Hypogammaglobulinemia; lack of antibody | Recurrent infections, bronchiectasis"
    explanation: >-
      Independent statement of the autosomal recessive mode in the IUIS 2024
      classification table.
pathophysiology:
- name: ARHGEF1 Biallelic Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Compound heterozygous germline variants in ARHGEF1 identified by whole-exome
    sequencing in two sisters: a nonsense allele (c.898C>T, p.R300X, exon 12) and
    a splice acceptor site allele (c.1669-1G>T) whose transcript skips exon 19 and
    frameshifts to a premature stop. Neither variant was present in the exome and
    variation databases searched at the time.
  genes:
  - preferred_term: ARHGEF1
    term:
      id: hgnc:681
      label: ARHGEF1
  genetic_context:
    gene:
      preferred_term: ARHGEF1
      term:
        id: hgnc:681
        label: ARHGEF1
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Absence of ARHGEF1 Protein in Lymphocytes
    causal_link_type: DIRECT
    description: >-
      Both alleles truncate the protein, and no full-length or truncated ARHGEF1
      is detectable in patient lymphoblastoid cells or T cell blasts.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "compound heterozygous variants in ARHGEF1 in both patients resulted in ARHGEF1-deficient expression in lymphocytes."
      explanation: >-
        States the step from genotype to absent protein in the patients' own
        lymphocytes.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound heterozygous variants in ARHGEF1: a nonsense variant on Chr19: 42398710: C>T (hg19 build 137) (NM_199002.1, exon 12, c. 898 C>T, p.R300X) and a splice acceptor site variant on Chr19: 42406933: G>T"
    explanation: >-
      Names both alleles with coordinates, transcript and protein consequence.
- name: Absence of ARHGEF1 Protein in Lymphocytes
  biological_scale: MOLECULAR
  description: >-
    No immunoreactive ARHGEF1 is present in patient B and T lymphocytes. ARHGEF1 is
    the RhoA-specific exchange factor that links Galpha12/13-coupled receptors to
    RhoA, so its absence removes a specific route to RhoA activation rather than
    RhoA itself: total RhoA protein is normal.
  molecular_functions:
  - preferred_term: RhoA guanine nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Reduced RhoA Activation in Lymphocytes
    causal_link_type: DIRECT
    description: >-
      With the exchange factor absent, the fraction of RhoA in the GTP-bound active
      state falls even though total RhoA protein is unchanged.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RhoA activity in B-EBV-transformed lymphoblastoid cells and T cell blasts derived from both patients was 2-to 3-fold lower than in cells from healthy donors"
      explanation: >-
        Quantifies the loss of RhoA activation in the patients' own cells.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used whole-exome sequencing to identify compound heterozygous mutations in ARHGEF1, resulting in the loss of ARHGEF1 protein expression in 2 primary antibody-deficient siblings presenting with recurrent severe respiratory tract infections and bronchiectasis."
    explanation: >-
      States the absence of ARHGEF1 protein in the affected siblings.
- name: Reduced RhoA Activation in Lymphocytes
  biological_scale: MOLECULAR
  description: >-
    RhoA-GTP is two- to three-fold below control in patient B and T lymphocytes.
    This is the hub of the entry: RhoA activation is what the ARHGEF1 lesion
    removes, and both downstream arms - cortical actin assembly and ROCK-mediated
    restraint of PI3K/AKT - branch from here. Both are correctable, in patient
    cells, by a pharmacological RhoA activator or by re-expressing ARHGEF1, which
    is what establishes the causal direction rather than mere association.
  biological_processes:
  - preferred_term: RhoA signal transduction
    term:
      id: GO:0007266
      label: Rho protein signal transduction
    modifier: DECREASED
  downstream:
  - target: Defective Actin Polymerization in Lymphocytes
    causal_link_type: DIRECT
    description: >-
      RhoA is a principal regulator of actin cytoskeleton dynamics, and F-actin
      content is low in patient lymphocytes at steady state and after stimulation
      of lysophospholipid receptors.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On the molecular level, T and B lymphocytes from both patients displayed low RhoA activity and low steady-state actin polymerization"
      explanation: >-
        Couples the RhoA deficit to the actin polymerisation deficit in the same
        cells.
  - target: Failure to Restrain PI3K/AKT Signaling
    causal_link_type: DIRECT
    description: >-
      The second arm. RhoA acts through ROCK I/II on PTEN, and without it AKT
      phosphorylation is not efficiently damped after chemokine receptor
      engagement.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the patients' lymphocytes failed to efficiently restrain AKT phosphorylation"
      explanation: >-
        States the failure of restraint that this edge asserts, attributed by the
        same sentence's context to disturbed regulation of the RhoA target ROCK.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enforced ARHGEF1 expression or drug-induced activation of RhoA in the patients' cells corrected the impaired actin polymerization and AKT regulation."
    explanation: >-
      The rescue experiment. Correcting ARHGEF1, or activating RhoA directly,
      repairs both downstream arms, which is why this node is treated as the causal
      hub rather than a correlate.
- name: Defective Actin Polymerization in Lymphocytes
  biological_scale: CELLULAR
  description: >-
    Cortical F-actin content is low in all patient T and B lymphocyte subsets at
    steady state, and actin polymerisation in response to sphingosine-1-phosphate,
    lysophosphatidic acid and the thromboxane A2 analogue U46619 is low or absent.
    The specificity matters: a response to the chemokine SDF1, which does not
    depend strictly on Galpha12/13, is still detectable, so the lesion is in a
    receptor-defined branch rather than in the actin machinery itself.
  biological_processes:
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: DECREASED
  downstream:
  - target: Impaired Lymphocyte Migration and Deadhesion
    causal_link_type: DIRECT
    description: >-
      Patient T cell blasts migrate poorly across fibronectin-coated membranes and
      form elongated trailing edges on live imaging, a pattern the authors read as
      failure of deadhesion rather than excess adhesion.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On fibronectin-coated Boyden chambers, we observed a strongly reduced Transwell migration of patients' T cell blasts compared with those of controls"
      explanation: >-
        The migration measurement this edge asserts.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the molecular level, T and B lymphocytes from both patients displayed low RhoA activity and low steady-state actin polymerization"
    explanation: >-
      Documents the low steady-state actin polymerisation in patient lymphocytes.
- name: Impaired Lymphocyte Migration and Deadhesion
  biological_scale: CELLULAR
  description: >-
    Reduced chemotaxis and reduced mean displacement with elongated uropods.
    Integrin alpha and beta chain expression is normal or reduced and the
    high-affinity LFA-1 conformation is not increased, which argues against the
    cells simply sticking harder and for a failure to release. This is the step
    that converts a cytoskeletal defect into a trafficking disease.
  biological_processes:
  - preferred_term: lymphocyte migration
    term:
      id: GO:0072676
      label: lymphocyte migration
    modifier: DECREASED
  downstream:
  - target: Loss of Circulating Marginal Zone and Memory B Cells
    causal_link_type: DIRECT
    description: >-
      Marginal zone B cells depend on lysophospholipid receptor signalling to
      shuttle between the marginal zone and follicle; without it the compartment is
      not maintained.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both ARHGEF1-deficient patients showed an abnormal B cell immunophenotype, with a deficiency in marginal zone and memory B cells and an increased frequency of transitional B cells."
      explanation: >-
        The B cell compartment phenotype that this edge produces.
  - target: Disturbed Germinal Center Reaction
    causal_link_type: DIRECT
    description: >-
      Germinal centre B cells are positioned and retained by Galpha12/13-coupled
      receptor signals; in the one lymph node examined the germinal centres were
      small and nearly empty of B cells while remaining structurally intact.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis of a mediastinal lymph node from one patient highlighted the small size of the germinal centers and an abnormally high plasma cell content."
      explanation: >-
        The germinal centre abnormality. Note this is a single node from a single
        patient, which is why the node's own description says so.
  - target: Increased circulating myelocyte count
    causal_link_type: DIRECT
    description: >-
      The same retention failure applies to myeloid precursors, which appear in the
      blood without any marrow evidence of a myeloproliferative or myelodysplastic
      process.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results indicate that ARHGEF1 activity in human lymphocytes is involved in controlling actin cytoskeleton dynamics, restraining PI3K/AKT signaling, and confining B lymphocytes and myelocytes within their dedicated functional environment."
      explanation: >-
        The authors' own summary of the confinement defect, naming myelocytes
        alongside B lymphocytes.
  - target: Increased transitional B cell proportion
    causal_link_type: DIRECT
    description: >-
      Transitional B cells accumulate in the blood, the counterpart of the marginal
      zone and memory compartments that fail to fill.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients presented with low CD19+ B cell blood counts, an elevated frequency of transitional B cells"
      explanation: >-
        Documents the transitional B cell excess in both patients.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken as a whole, these data suggest that human ARHGEF1 deficiency is associated with migration defects possibly caused by impaired deadhesion."
    explanation: >-
      The authors' summary of the migration phenotype and its likely proximate
      cause. Their own hedge ("possibly") is preserved rather than removed.
- name: Failure to Restrain PI3K/AKT Signaling
  biological_scale: MOLECULAR
  description: >-
    The RhoA/ROCK axis normally limits PI3K/AKT output through PTEN. In patient
    T cell blasts, AKT Ser473 phosphorylation after SDF1/CXCR4 stimulation is
    repressed less efficiently than in controls, and a RhoA activator restores
    normal repression - placing the defect upstream of RhoA. A ROCK inhibitor
    reproduces the failure in healthy donor cells.
  biological_processes:
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  downstream:
  - target: Excessive Germinal Center Plasma Cell Differentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The authors' proposed explanation for the plasma cell excess seen in the
      germinal centres: if B cells share the AKT dysregulation demonstrated in
      T cells, increased PI3K/AKT signalling would push germinal centre B cells
      towards plasma cell differentiation. This is an inference the founding paper
      itself flags as conditional, and it is recorded as such.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "increased PI3K/AKT signaling in human GC B lymphocytes (because of impaired regulation of ARHGEF1/RhoA/ROCK signaling) might promote the excessive differentiation of GC B lymphocytes into plasma cells."
      explanation: >-
        The proposed mechanism, quoted with the authors' own modal verb intact. It
        is their hypothesis, not a demonstrated result in B cells.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patients' lymphocytes failed to efficiently restrain AKT phosphorylation"
    explanation: >-
      The measured failure of AKT restraint in patient lymphocytes.
- name: Excessive Germinal Center Plasma Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    A high frequency of CD138-positive plasma cells within the germinal centres of
    the one lymph node examined, interpreted as premature exit of germinal centre
    B cells into the plasma cell programme before affinity maturation is complete.
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: plasma cell differentiation
    term:
      id: GO:0002317
      label: plasma cell differentiation
    modifier: INCREASED
  downstream:
  - target: Disturbed Germinal Center Reaction
    causal_link_type: DIRECT
    description: >-
      Premature plasma cell differentiation depletes the germinal centre of the
      B cells that should be undergoing selection there.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis of a mediastinal lymph node from one patient highlighted the small size of the germinal centers and an abnormally high plasma cell content."
      explanation: >-
        Reports the two findings together in the same tissue: small germinal
        centres and excess plasma cells.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of a mediastinal lymph node from one patient highlighted the small size of the germinal centers and an abnormally high plasma cell content."
    explanation: >-
      The histological observation this node records.
- name: Disturbed Germinal Center Reaction
  biological_scale: TISSUE
  description: >-
    Germinal centres that are small, round and structurally preserved but nearly
    devoid of B cells, with a thinner mantle zone, a smaller follicular dendritic
    cell meshwork and less proliferation. T follicular helper cell positioning is
    normal, so this is a B cell positioning and retention failure rather than a
    collapse of the germinal centre niche.
  biological_processes:
  - preferred_term: germinal center formation
    term:
      id: GO:0002467
      label: germinal center formation
    modifier: DECREASED
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  downstream:
  - target: Defective Specific Antibody Production
    causal_link_type: DIRECT
    description: >-
      Without a productive germinal centre reaction, affinity-matured,
      class-switched antibody responses to protein antigens cannot be generated.
    evidence:
    - reference: PMID:30714991
      reference_title: "ARHGEF1 deficiency reveals Gα13-associated GPCRs are critical regulators of human lymphocyte function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "ARHGEF1-deficient lymphocytes from the affected siblings exhibited important functional deficits that indicate that loss of ARHGEF1 accounts for the observed primary antibody deficiency, which manifests in an inability to mount antibody responses to vaccines and pathogens."
      explanation: >-
        An accompanying commentary's synthesis of the founding report, connecting
        the lymphocyte functional defects to the failure of antibody responses.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of a mediastinal lymph node from one patient highlighted the small size of the germinal centers and an abnormally high plasma cell content."
    explanation: >-
      The single available histological description of the germinal centre
      abnormality.
- name: Loss of Circulating Marginal Zone and Memory B Cells
  biological_scale: CELLULAR
  description: >-
    Switched memory and marginal zone B cells are almost undetectable in both
    patients (1-2% and 0.2-1% of B cells against reference floors of 10% and
    13.4%), on a background of low total B cell counts. The marginal zone
    compartment is the one the mouse work had already predicted would fail.
  cell_types:
  - preferred_term: marginal zone B cell
    term:
      id: CL:0000845
      label: marginal zone B cell of spleen
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  downstream:
  - target: Defective Specific Antibody Production
    causal_link_type: DIRECT
    description: >-
      Marginal zone B cells carry the T-independent polysaccharide response and
      memory B cells the recall response; losing both accounts for the pattern of
      absent antibody to pneumococcal polysaccharide as well as to protein vaccine
      antigens.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Antibody production (including T cell-dependent and -independent vaccine responses to poliovirus, tetanus, diphtheria toxoids, and pneumococcal immunizations) was defective in both patients"
      explanation: >-
        Reports failure of both T-dependent and T-independent responses, the two
        arms these compartments serve.
  - target: Decreased memory B cell proportion
    causal_link_type: DIRECT
    description: >-
      The circulating memory B cell compartment is the laboratory readout of this
      node.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Memory B cells (%) 2 (>10) 1 (>10)"
      explanation: >-
        The Table 1 row giving each patient's memory B cell percentage against the
        age-matched reference floor.
  - target: Decreased marginal zone B cell proportion
    causal_link_type: DIRECT
    description: >-
      The circulating marginal zone compartment, likewise.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MZ B cells (%) 1 (13.4-21.4) 0.2 (13.4-21.4)"
      explanation: >-
        The Table 1 row giving each patient's marginal zone B cell percentage
        against the age-matched reference interval.
  - target: Decreased total B cell count
    causal_link_type: DIRECT
    description: >-
      Total circulating CD19+ B cells are below reference in both patients, so the
      subset losses sit on top of an overall B lymphopenia rather than being purely
      redistributive.
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients presented with low CD19+ B cell blood counts, an elevated frequency of transitional B cells"
      explanation: >-
        States the low total B cell count in both patients.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both ARHGEF1-deficient patients showed an abnormal B cell immunophenotype, with a deficiency in marginal zone and memory B cells and an increased frequency of transitional B cells."
    explanation: >-
      The immunophenotype this node names.
- name: Defective Specific Antibody Production
  biological_scale: ORGANISM
  description: >-
    The functional endpoint: absent antibody to diphtheria and tetanus toxoids,

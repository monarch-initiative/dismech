genetic:
- name: ARHGEF1 biallelic loss of function
  gene_term:
    preferred_term: ARHGEF1
    term:
      id: hgnc:681
      label: ARHGEF1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    ARHGEF1 at 19q13.2 is the gene OMIM (#618459) and MedGen (C5193109) associate
    with IMD62; MONDO:0032763 itself records no causal-gene relationship, so the
    anchor here comes from OMIM/MedGen and from the IUIS classification row rather
    than from MONDO. That MONDO gap is worth reporting upstream. The evidence
    strength should be read plainly: two affected individuals, sisters, from one
    family, with the causal direction established functionally in their own cells
    (RhoA activity and actin polymerisation restored by retroviral ARHGEF1
    expression) rather than by segregation across families. A search of the 612
    ClinGen gene-disease validity records cached in this repository
    (`grep -l ARHGEF1 references_cache/CGGV_*.md`, re-run 2026-09-25) returned no
    file, so there is no ClinGen validity assertion for ARHGEF1 to cite.
    `relationship_type` is CAUSATIVE rather than DISPUTED because no publication
    disputes the relationship; the limitation is quantity of evidence, not conflict
    within it.
  variants:
  - name: ARHGEF1 c.898C>T p.(Arg300Ter) (paternal allele)
    description: >-
      Nonsense variant in exon 12 of NM_199002.1, inherited from the healthy
      father, with a CADD score of 41 and absent from ExAC, the Exome Sequencing
      Project, dbSNP and SwissVar at the time of reporting.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "compound heterozygous variants in ARHGEF1: a nonsense variant on Chr19: 42398710: C>T (hg19 build 137) (NM_199002.1, exon 12, c. 898 C>T, p.R300X) and a splice acceptor site variant on Chr19: 42406933: G>T"
      explanation: >-
        Names the nonsense allele with its transcript, exon, cDNA and protein
        notation.
  - name: ARHGEF1 c.1669-1G>T splice acceptor variant (maternal allele)
    description: >-
      Splice acceptor site variant inherited from the healthy mother. RT-PCR on
      patient and maternal peripheral blood mononuclear cells detected an aberrant
      transcript, expressed at lower level than the main transcript, that skips
      exon 19 and frameshifts to a premature stop codon.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "abnormal exon skipping of exon 19, introducing a frame shift with creation of a premature stop codon (E557Kfs34X)"
      explanation: >-
        Gives the transcript-level consequence of the splice allele.
    - reference: PMID:30521495
      reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A nonsense mutation c.898C>T (Chr19: 42398710: C>T; hg19 build 137) was inherited from the father, and a splice mutation c.1669-1G>T (Chr19: 42406933: G>T) was inherited from the mother."
      explanation: >-
        Gives the cDNA notation of the splice allele and its parental origin.
  evidence:
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound heterozygous variants in ARHGEF1 in both patients resulted in ARHGEF1-deficient expression in lymphocytes."
    explanation: >-
      Establishes that the two alleles together abolish protein expression.
  - reference: PMID:30521495
    reference_title: "Loss of ARHGEF1 causes a human primary antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assume that any combination of these variations will lead to ARHGEF1 deficiency."
    explanation: >-
      The authors' expectation that other truncating ARHGEF1 alleles annotated in
      population databases would behave the same way in the biallelic state. Quoted
      with their own hedge intact: it is a prediction, not an observation, and no
      such patient has been reported.

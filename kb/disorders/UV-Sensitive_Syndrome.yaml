        explanation: Lists telangiectasia among the defining cutaneous features.

environmental:
  - name: Ultraviolet radiation exposure
    description: >-
      Solar and artificial ultraviolet radiation is the obligate trigger. The
      genotype creates a repair deficiency that is silent until UV generates
      transcription-blocking photoproducts, so exposure controls whether and how
      severely the disease manifests without being its cause. Artificial sources
      that matter clinically include tanning devices, germicidal lamps and
      welding arcs.
    exposure_term:
      preferred_term: exposure to ultraviolet radiation
      term:
        id: ECTO:0000006
        label: exposure to ultraviolet radiation
    influences_mechanisms:
      - target: Persistent Transcription Blockage After UV Exposure
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          UV photoproducts on the transcribed strand are the lesions that arrest
          RNA polymerase II. Without exposure there is no transcription-blocking
          lesion for the defective repair pathway to fail on.
        evidence:
          - reference: PMID:15486090
            reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "UVsS cells show UV hypersensitivity and defective transcription-coupled DNA repair of UV damage."
            explanation: >-
              Ties the cellular defect specifically to UV damage, which is what
              makes the exposure the trigger for this node rather than general
              background context.
    evidence:
      - reference: PMID:26255937
        reference_title: Photosensitive human syndromes.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: OTHER
        snippet: "We will review current understanding of photosensitivity to short wavelength ultraviolet light (UV) due to genetic defects in particular DNA repair pathways; deficiencies in some are characterized by an extremely high incidence of cancer in sun-exposed tissues, while in others no cancers have been reported."
        explanation: >-
          Frames the disease class as photosensitivity to short-wavelength UV
          arising from DNA repair defects, and distinguishes the members that
          carry cancer risk from those that do not. Graded INDIRECT because it
          describes the class rather than this disease, and OTHER because it is
          a narrative review without primary data.

genetic:
  - name: ERCC6
    gene_term:
      preferred_term: ERCC6
      term:
        id: hgnc:3438
        label: ERCC6
    notes: >-
      Encodes CSB. Biallelic loss causes UVSS1. The same gene more commonly
      causes Cockayne syndrome, and a homozygous null allele has been reported
      in UV-sensitive syndrome without Cockayne features.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we sequenced the CSB gene from UVs1KO and detected a homozygous null mutation."
        explanation: >-
          Identifies a homozygous null CSB allele in a UV-sensitive syndrome
          cell line, which is the observation the CS contrast rests on.
  - name: ERCC8
    gene_term:
      preferred_term: ERCC8
      term:
        id: hgnc:3439
        label: ERCC8
    notes: >-
      Encodes CSA. Biallelic loss causes UVSS2; the same gene causes Cockayne
      syndrome type A.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Three of the seven known UV(S)S cases carry mutations in the Cockayne syndrome genes ERCC8 or ERCC6 (also known as CSA and CSB, respectively)."
        explanation: >-
          Attributes a share of cases to the two Cockayne syndrome genes, which
          is what makes them shared between the two diseases.
  - name: UVSSA
    gene_term:
      preferred_term: UVSSA
      term:
        id: hgnc:29304
        label: UVSSA
    notes: >-
      Encodes UVSSA, which recruits TFIIH to stalled RNA polymerase II and
      carries a TFIIS-like element that keeps the polymerase inactive. The most
      frequently reported gene, and not reported in Cockayne syndrome. A 2024
      study also implicates it in transcription-coupled repair of interstrand
      crosslinks, which is mechanistically notable but of unproven relevance to
      untreated patients.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Using exome sequencing, we determine that mutations in the UVSSA gene (formerly known as KIAA1530) cause UV(S)S-A."
        explanation: The gene-discovery finding for the UVSS-A complementation group.
      - reference: PMID:39383571
        reference_title: UVSSA facilitates transcription-coupled repair of DNA interstrand crosslinks.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Inactivation of UVSSA sensitizes human cells to ICL-inducing drugs, and delays ICL repair."
        explanation: >-
          Extends UVSSA function beyond UV photoproducts to interstrand
          crosslinks in human cell lines.

experimental_models:
  - name: Patient dermal fibroblast lines
    experimental_model_type: PRIMARY_CELL_CULTURE
    description: >-
      Primary fibroblasts cultured from affected individuals. These are the
      systems in which the disease was originally defined: UVs1KO, which carries
      the homozygous null CSB allele, and Kps3, which has normal CSB protein and
      established that the syndrome is genetically heterogeneous. They reproduce
      UV hypersensitivity and the recovery-of-RNA-synthesis defect with
      relatively preserved unscheduled DNA synthesis, and they support
      complementation testing.
    organism:
      preferred_term: human
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cell_types:
      - preferred_term: dermal fibroblast
        term:
          id: CL:0000057
          label: fibroblast
    publication: PMID:15486090
    modeled_mechanisms:
      - target: Persistent Transcription Blockage After UV Exposure
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: CELLULAR
        description: >-
          The cellular phenotype these lines display is the node itself:
          transcription fails to recover after UV while global-genome repair
          stays near normal.
        limitations: >-
          Cultured fibroblasts carry neither the epidermal architecture in which
          the disease is expressed nor a lifetime of intermittent solar
          exposure, and the assays use acute high-dose 254 nm UV rather than
          sunlight.
        evidence:
          - reference: PMID:15486090
            reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "UVsS cells show UV hypersensitivity and defective transcription-coupled DNA repair of UV damage."
            explanation: >-
              States the phenotype these patient lines display, which is what
              makes them informative for this node.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "On the other hand, no mutation in the CSB cDNA and a normal amount of CSB protein was detected in Kps3, a UVsS cell line obtained from an unrelated patient, indicating genetic heterogeneity in UVsS."
        explanation: >-
          Names one of the patient lines and reports the result that established
          genetic heterogeneity, showing what these models were used to decide.

  - name: Isogenic TC-NER knockout human cell lines
    experimental_model_type: CELL_LINE
    description: >-
      Human cell lines in which UVSSA, ERCC8 or ERCC6 has been knocked out on a
      common genetic background, with rescue by wild-type or mutant protein.
      These are the systems that resolved the order of the repair handover and
      allow separation of one protein's contribution from another's.
    organism:
      preferred_term: human
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    publication: PMID:32355176
    modeled_mechanisms:
      - target: Failure to Process Stalled RNA Polymerase II
        relationship: PERTURBS
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: >-
          Deleting each factor in turn is what established that CSB acts first,
          then CSA, then UVSSA, and that UVSSA is the one that brings in TFIIH.
        limitations: >-
          Transformed cell lines exposed to acute experimental UV doses, so they
          model the molecular handover rather than the disease. A knockout is
          also not the same lesion as most patient alleles, which are missense
          or truncating variants with residual protein.
        evidence:
          - reference: PMID:32355176
            reference_title: "The cooperative action of CSB, CSA, and UVSSA target TFIIH to DNA damage-stalled RNA polymerase II."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "Here, we define the assembly mechanism of the TCR complex in human isogenic knockout cells."
            explanation: >-
              Names the model system and the question it was used to answer,
              which is the assembly step this node describes.
    evidence:
      - reference: PMID:38316879
        reference_title: Structural basis for RNA polymerase II ubiquitylation and inactivation in transcription-coupled repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This transition requires site-specific ubiquitylation of Pol II by the CRL4CSA ubiquitin ligase, a process that is facilitated by ELOF1 in an unknown way."
        explanation: >-
          States the molecular step these engineered systems were built to
          dissect, and is explicit that part of it was unresolved.

diagnosis:
  - name: Recovery of RNA synthesis assay in patient fibroblasts
    description: >-
      The functional test that defines the disorder. After UV irradiation,
      patient fibroblasts fail to restore RNA synthesis while unscheduled DNA
      synthesis, which reflects global-genome repair, remains near normal. That
      combination separates this disorder from xeroderma pigmentosum, in which
      global-genome repair is the defective arm. It does not separate it from
      Cockayne syndrome, which gives the same cellular result.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Despite mild clinical features, cells from individuals with UV(S)S, like Cockayne syndrome cells, are very UV sensitive and are deficient in transcription-coupled nucleotide-excision repair (TC-NER), which removes DNA damage in actively transcribed genes."
        explanation: >-
          Establishes the cellular signature the assay detects, and says in the
          same sentence that Cockayne cells give the same result, which is why
          the assay cannot discriminate between them.
    notes: >-
      Specialised and not standardised across routine laboratories, with no
      universal clinical cutoffs, so molecular confirmation of biallelic
      variants is the practical diagnostic endpoint.

  - name: Molecular genetic testing
    description: >-
      A hereditary photosensitivity or DNA-repair gene panel covering at minimum
      UVSSA, ERCC8 and ERCC6, preferably alongside the xeroderma pigmentosum,
      Cockayne and trichothiodystrophy genes given the phenotypic overlap.
      Exome sequencing is the appropriate next step when a panel is negative.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Using exome sequencing, we determine that mutations in the UVSSA gene (formerly known as KIAA1530) cause UV(S)S-A."
        explanation: >-
          Exome sequencing is what identified the third gene, and is the method
          that resolves cases a targeted panel misses.

treatments:
  - name: Photoprotection
    description: >-
      Management is entirely preventive. Sun avoidance, broad-spectrum
      sunscreen, protective clothing and gloves, sunglasses, and emollients for
      dry skin. These reduce the lesion burden rather than correcting the repair
      defect, and no disease-modifying therapy exists.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: photoprotection and ultraviolet avoidance
      term:
        id: NCIT:C15747
        label: Supportive Care
      therapeutic_agent:
        - preferred_term: sunscreen
          term:
            id: NCIT:C851
            label: Sunscreen
    target_phenotypes:
      - preferred_term: Cutaneous photosensitivity
        term:
          id: HP:0000992
          label: Cutaneous photosensitivity
    evidence:
      - reference: PMID:34974577
        reference_title: "The molecular genetics of UV-Sensitive syndrome: A rare dermal anomaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In order to reduce the disease severity, the patients are advised to use medicated skin moisturisers or sun-blocks, sunglasses and gloves, while going out in the sun to avoid sun exposure."
        explanation: >-
          States the photoprotective measures recommended, which is the whole of
          current management.
    notes: >-
      Bound to the generic Supportive Care action because NCIT has no
      clinical-action term for sun avoidance; the specificity is carried in
      preferred_term. NCIT:C851 Sunscreen is a substance rather than an action
      and so sits in therapeutic_agent, following the device/agent pattern in
      CLAUDE.md.

differential_diagnoses:
  - name: Cockayne Syndrome
    disease_term:
      preferred_term: Cockayne syndrome
      term:
        id: MONDO:0016006
        label: Cockayne syndrome
    description: >-
      Shares the TC-NER defect and two of the three causal genes, but adds
      progressive neurodegeneration, cachectic dwarfism, developmental failure
      and premature ageing. The distinction is clinical, not biochemical: both
      disorders fail the recovery-of-RNA-synthesis assay.
    distinguishing_features:
      - >-
        Absence of neurological, growth and developmental abnormality in
        UV-sensitive syndrome.
      - >-
        A homozygous null CSB allele has been observed in UV-sensitive syndrome
        without Cockayne features, so genotype at ERCC6 alone does not separate
        the two disorders.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This finding was surprising because a null mutation of the CSB gene would be expected to result in CS features such as severe developmental and neurological abnormalities."
        explanation: >-
          States the genotype-phenotype discrepancy in the authors' own words:
          a CSB null did not produce Cockayne syndrome.

discussions:
  - discussion_id: uvss_vs_cs_severity
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does loss of CSA or CSB cause Cockayne syndrome in most people but
      UV-sensitive syndrome in others, when both disorders share the same
      transcription-coupled repair defect?
    attaches_to:
      - pathophysiology#Failure to Process Stalled RNA Polymerase II
    rationale: >-
      The TC-NER defect is common to both disorders, so it cannot by itself
      explain why one is a fatal multisystem progeroid disease and the other is
      confined to the skin. A homozygous null CSB allele has been reported in
      UV-sensitive syndrome without Cockayne features, which rules out simple
      dose of residual CSB activity as the answer. The favoured explanation is
      that CSA and CSB carry further transcriptional, mitochondrial or
      repair-independent functions whose loss produces the Cockayne phenotype,
      and that these are somehow spared in UV-sensitive syndrome. That remains
      an inference. UVSSA is the natural comparator, since it acts in the same
      pathway and has never been reported to cause Cockayne syndrome.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This finding was surprising because a null mutation of the CSB gene would be expected to result in CS features such as severe developmental and neurological abnormalities."
        explanation: >-
          The authors themselves frame the observation as an unexplained
          genotype-phenotype discrepancy, which is what this gap records.
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Despite mild clinical features, cells from individuals with UV(S)S, like Cockayne syndrome cells, are very UV sensitive and are deficient in transcription-coupled nucleotide-excision repair (TC-NER), which removes DNA damage in actively transcribed genes."
        explanation: >-
          Confirms the shared cellular defect that makes the clinical divergence
          a genuine puzzle rather than a difference in repair capacity.

datasets:
  - accession: geo:GSE132840
    title: eXcision Repair-sequencing (XR-seq) to map UV induced damage in U2OS cells and in U2OS cells in which CSA or UVSSA genes were knocked out
    description: >-
      Genome-wide maps of UV-damage excision repair in wild-type human cells and
      in CSA- and UVSSA-knockout cells, with complementation by wild-type and
      mutant UVSSA. Measures the repair step this entry's mechanism nodes
      describe, in the same isogenic knockout system curated under
      experimental_models.
    data_type: BULK_RNA_SEQ
    organism:
      preferred_term: human
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    sample_count: 9
    publication: PMID:32355176
    genes:
      - preferred_term: UVSSA
        term:
          id: hgnc:29304
          label: UVSSA
      - preferred_term: ERCC8
        term:
          id: hgnc:3439
          label: ERCC8
    evidence:
      - reference: GEO:GSE132840
        reference_title: eXcision Repair-sequencing (XR-seq) to map UV induced damage in U2OS cells and in U2OS cells in which CSA or UVSSA genes were knocked out
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Complementation of UVSSA knockout with WT or mutant proteins shows UVSSA is a core component of human transcription coupled repair."
        explanation: >-
          The repository's own summary states what the experiment established,
          which is the UVSSA role this entry's mechanism nodes assert.
    notes: >-
      Selected by triage from four candidates returned by just discover-datasets,
      all of which were GENE_ONLY matches. The other three were rejected:

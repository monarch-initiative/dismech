name: UV-Sensitive Syndrome
creation_date: "2026-09-09T16:56:20Z"
category: Genetic
description: >-
  UV-sensitive syndrome is an autosomal recessive photosensitivity disorder
  caused by biallelic loss of transcription-coupled nucleotide excision repair
  (TC-NER). Affected individuals sunburn easily, and develop freckling,
  pigmentary change and telangiectasia on sun-exposed skin. They do not have an
  increased risk of skin cancer.

  The interest of the entry is the contrast rather than the repair defect on its
  own. Two of the three causal genes, ERCC6 (CSB) and ERCC8 (CSA), are the
  Cockayne syndrome genes, and the third, UVSSA, acts in the same pathway. Yet
  Cockayne syndrome is a severe segmental progeroid disease with
  neurodegeneration, cachectic dwarfism and early death, while UV-sensitive
  syndrome is essentially confined to the skin and compatible with a normal
  lifespan. The same TC-NER lesion therefore does not explain the Cockayne
  phenotype, and what CSA and CSB do beyond TC-NER is the open mechanistic
  question this entry has to frame.
parents:
  - DNA Repair Disorder
  - Photosensitivity Disorder
synonyms:
  - UVSS
  - UV-sensitive syndrome
  - UV sensitive syndrome
disease_term:
  preferred_term: UV-sensitive syndrome
  term:
    id: MONDO:0015797
    label: UV-sensitive syndrome

has_subtypes:
  - name: UVSS1
    display_name: UV-sensitive syndrome 1 (ERCC6/CSB-related)
    description: >-
      Caused by biallelic ERCC6 variants. ERCC6 encodes CSB, an SWI/SNF-family
      ATPase that engages RNA polymerase II stalled at a transcription-blocking
      lesion. The same gene causes Cockayne syndrome.
    subtype_term:
      preferred_term: UV-sensitive syndrome 1
      term:
        id: MONDO:0010909
        label: UV-sensitive syndrome 1
    genes:
      - preferred_term: ERCC6
        term:
          id: hgnc:3438
          label: ERCC6
  - name: UVSS2
    display_name: UV-sensitive syndrome 2 (ERCC8/CSA-related)
    description: >-
      Caused by biallelic ERCC8 variants. ERCC8 encodes CSA, the substrate
      recognition component of a CRL4 ubiquitin ligase complex acting on stalled
      RNA polymerase II. The same gene causes Cockayne syndrome.
    subtype_term:
      preferred_term: UV-sensitive syndrome 2
      term:
        id: MONDO:0013829
        label: UV-sensitive syndrome 2
    genes:
      - preferred_term: ERCC8
        term:
          id: hgnc:3439
          label: ERCC8
  - name: UVSS3
    display_name: UV-sensitive syndrome 3 (UVSSA-related)
    description: >-
      Caused by biallelic UVSSA variants. UVSSA delivers the deubiquitinase USP7
      to stalled RNA polymerase II and stabilises CSB. Unlike ERCC6 and ERCC8,
      UVSSA has not been reported to cause Cockayne syndrome, which makes it the
      informative comparator for separating the TC-NER role of this pathway from
      whatever else CSA and CSB do.
    subtype_term:
      preferred_term: UV-sensitive syndrome 3
      term:
        id: MONDO:0013834
        label: UV-sensitive syndrome 3
    genes:
      - preferred_term: UVSSA
        term:
          id: hgnc:29304
          label: UVSSA

pathophysiology:
  - name: Biallelic Loss of a TC-NER Factor
    description: >-
      Loss-of-function variants in ERCC6, ERCC8 or UVSSA remove one component of
      the machinery that resolves RNA polymerase II stalled at a
      transcription-blocking lesion.
    biological_scale: MOLECULAR
    downstream:
      - target: Failure to Process Stalled RNA Polymerase II
        causal_link_type: DIRECT

  - name: Failure to Process Stalled RNA Polymerase II
    description: >-
      Without CSB engagement, CSA-dependent ubiquitination and UVSSA-USP7
      deubiquitination, RNA polymerase II arrested at a UV photoproduct is
      neither backed off nor removed, so the repair machinery is not delivered to
      the lesion.
    biological_scale: MOLECULAR
    downstream:
      - target: Persistent Transcription Blockage After UV Exposure
        causal_link_type: DIRECT

  - name: Persistent Transcription Blockage After UV Exposure
    description: >-
      Transcription of the damaged strand does not recover after UV irradiation.
      This is the defining cellular phenotype of the disorder and the basis of
      the recovery-of-RNA-synthesis diagnostic assay.
    biological_scale: CELLULAR
    downstream:
      - target: UV-Induced Keratinocyte Apoptosis
        causal_link_type: DIRECT

  - name: UV-Induced Keratinocyte Apoptosis
    description: >-
      Sustained transcription arrest in UV-exposed epidermal keratinocytes
      triggers cell death, producing the exaggerated sunburn response.
    biological_scale: CELLULAR
    downstream:
      - target: Cutaneous Photosensitivity
        causal_link_type: DIRECT
      - target: Abnormal Skin Pigmentation
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      - target: Telangiectasia
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

phenotypes:
  - name: Cutaneous Photosensitivity
    category: Dermatological
    description: >-
      Exaggerated sunburn after minimal sun exposure, typically noticed in early
      childhood.

  - name: Abnormal Skin Pigmentation
    category: Dermatological
    description: >-
      Freckling and pigmentary change on sun-exposed skin after repeated
      exposure.

  - name: Telangiectasia
    category: Dermatological
    description: >-
      Small clusters of dilated cutaneous vessels, usually over the cheeks and
      nose.

genetic:
  - name: ERCC6
    gene_term:
      preferred_term: ERCC6
      term:
        id: hgnc:3438
        label: ERCC6
    notes: >-
      Encodes CSB. Biallelic loss causes UVSS1; other variants in the same gene
      cause Cockayne syndrome.
  - name: ERCC8
    gene_term:
      preferred_term: ERCC8
      term:
        id: hgnc:3439
        label: ERCC8
    notes: >-
      Encodes CSA. Biallelic loss causes UVSS2; other variants in the same gene
      cause Cockayne syndrome.
  - name: UVSSA
    gene_term:
      preferred_term: UVSSA
      term:
        id: hgnc:29304
        label: UVSSA
    notes: >-
      Encodes UVSSA, which recruits USP7 to stalled RNA polymerase II. Reported
      only in UV-sensitive syndrome, not in Cockayne syndrome.

notes: >-
  First-pass entry written from textbook knowledge before deep research, per the
  initiate-new-disorder-creation skill. Ontology bindings present at this stage
  are limited to those verified by live lookup while writing them: the four MONDO
  terms (ols:mondo) and the three HGNC gene CURIEs (cache/hgnc/terms.csv for
  ERCC6 and ERCC8, sqlite:obo:hgnc for UVSSA). HP, GO and CL bindings are
  deliberately absent until they can be looked up alongside the evidence that
  motivates them. No evidence items yet.

genetic:
  - name: ERCC6
    gene_term:
      preferred_term: ERCC6
      term:
        id: hgnc:3438
        label: ERCC6
    notes: >-
      Encodes CSB. Biallelic loss causes UVSS1. The same gene more commonly
      causes Cockayne syndrome, and a homozygous null allele has been reported
      in UV-sensitive syndrome without Cockayne features.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we sequenced the CSB gene from UVs1KO and detected a homozygous null mutation."
        explanation: >-
          Identifies a homozygous null CSB allele in a UV-sensitive syndrome
          cell line, which is the observation the CS contrast rests on.
  - name: ERCC8
    gene_term:
      preferred_term: ERCC8
      term:
        id: hgnc:3439
        label: ERCC8
    notes: >-
      Encodes CSA. Biallelic loss causes UVSS2; the same gene causes Cockayne
      syndrome type A.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Three of the seven known UV(S)S cases carry mutations in the Cockayne syndrome genes ERCC8 or ERCC6 (also known as CSA and CSB, respectively)."
        explanation: >-
          Attributes a share of cases to the two Cockayne syndrome genes, which
          is what makes them shared between the two diseases.
  - name: UVSSA
    gene_term:
      preferred_term: UVSSA
      term:
        id: hgnc:29304
        label: UVSSA
    notes: >-
      Encodes UVSSA, which recruits TFIIH to stalled RNA polymerase II and
      carries a TFIIS-like element that keeps the polymerase inactive. The most
      frequently reported gene, and not reported in Cockayne syndrome. A 2024
      study also implicates it in transcription-coupled repair of interstrand
      crosslinks, which is mechanistically notable but of unproven relevance to
      untreated patients.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Using exome sequencing, we determine that mutations in the UVSSA gene (formerly known as KIAA1530) cause UV(S)S-A."
        explanation: The gene-discovery finding for the UVSS-A complementation group.
      - reference: PMID:39383571
        reference_title: UVSSA facilitates transcription-coupled repair of DNA interstrand crosslinks.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Inactivation of UVSSA sensitizes human cells to ICL-inducing drugs, and delays ICL repair."
        explanation: >-
          Extends UVSSA function beyond UV photoproducts to interstrand
          crosslinks in human cell lines.

treatments:
  - name: Photoprotection
    description: >-
      Management is entirely preventive. Sun avoidance, broad-spectrum
      sunscreen, protective clothing and gloves, sunglasses, and emollients for
      dry skin. These reduce the lesion burden rather than correcting the repair
      defect, and no disease-modifying therapy exists.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: photoprotection and ultraviolet avoidance
      term:
        id: NCIT:C15747
        label: Supportive Care
      therapeutic_agent:
        - preferred_term: sunscreen
          term:
            id: NCIT:C851
            label: Sunscreen
    target_phenotypes:
      - preferred_term: Cutaneous photosensitivity
        term:
          id: HP:0000992
          label: Cutaneous photosensitivity
    evidence:
      - reference: PMID:34974577
        reference_title: "The molecular genetics of UV-Sensitive syndrome: A rare dermal anomaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In order to reduce the disease severity, the patients are advised to use medicated skin moisturisers or sun-blocks, sunglasses and gloves, while going out in the sun to avoid sun exposure."
        explanation: >-
          States the photoprotective measures recommended, which is the whole of
          current management.
    notes: >-
      Bound to the generic Supportive Care action because NCIT has no
      clinical-action term for sun avoidance; the specificity is carried in
      preferred_term. NCIT:C851 Sunscreen is a substance rather than an action
      and so sits in therapeutic_agent, following the device/agent pattern in
      CLAUDE.md.

  - name: Genetic Counseling
    description: >-
      Counselling for an autosomal recessive condition, with cascade testing of
      at-risk relatives.
    treatment_term:
      preferred_term: Genetic Counseling
      term:
        id: NCIT:C15240
        label: Genetic Counseling

differential_diagnoses:
  - name: Cockayne Syndrome
    disease_term:
      preferred_term: Cockayne syndrome
      term:
        id: MONDO:0016006
        label: Cockayne syndrome
    description: >-
      Shares the TC-NER defect and two of the three causal genes, but adds
      progressive neurodegeneration, cachectic dwarfism, developmental failure
      and premature ageing. The distinction is clinical, not biochemical: both
      disorders fail the recovery-of-RNA-synthesis assay.
    distinguishing_features:
      - >-
        Absence of neurological, growth and developmental abnormality in
        UV-sensitive syndrome.
      - >-
        A homozygous null CSB allele has been observed in UV-sensitive syndrome
        without Cockayne features, so genotype at ERCC6 alone does not separate
        the two disorders.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This finding was surprising because a null mutation of the CSB gene would be expected to result in CS features such as severe developmental and neurological abnormalities."
        explanation: >-
          States the genotype-phenotype discrepancy in the authors' own words:
          a CSB null did not produce Cockayne syndrome.

discussions:
  - discussion_id: uvss_vs_cs_severity
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does loss of CSA or CSB cause Cockayne syndrome in most people but
      UV-sensitive syndrome in others, when both disorders share the same
      transcription-coupled repair defect?
    attaches_to:
      - pathophysiology#Failure to Process Stalled RNA Polymerase II
    rationale: >-
      The TC-NER defect is common to both disorders, so it cannot by itself
      explain why one is a fatal multisystem progeroid disease and the other is
      confined to the skin. A homozygous null CSB allele has been reported in
      UV-sensitive syndrome without Cockayne features, which rules out simple
      dose of residual CSB activity as the answer. The favoured explanation is
      that CSA and CSB carry further transcriptional, mitochondrial or
      repair-independent functions whose loss produces the Cockayne phenotype,
      and that these are somehow spared in UV-sensitive syndrome. That remains
      an inference. UVSSA is the natural comparator, since it acts in the same
      pathway and has never been reported to cause Cockayne syndrome.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This finding was surprising because a null mutation of the CSB gene would be expected to result in CS features such as severe developmental and neurological abnormalities."
        explanation: >-
          The authors themselves frame the observation as an unexplained
          genotype-phenotype discrepancy, which is what this gap records.
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Despite mild clinical features, cells from individuals with UV(S)S, like Cockayne syndrome cells, are very UV sensitive and are deficient in transcription-coupled nucleotide-excision repair (TC-NER), which removes DNA damage in actively transcribed genes."
        explanation: >-
          Confirms the shared cellular defect that makes the clinical divergence
          a genuine puzzle rather than a difference in repair capacity.

notes: >-
  Curated from a Falcon (Edison) deep-research report,
  research/UV-Sensitive_Syndrome-deep-research-falcon.md. The report resolved
  9/9 references and 16/16 ontology terms with no unresolved identifiers and no
  off-topic references; its one flagged label was the template's own
  "(if available)" boilerplate being parsed as a label for MONDO:0015797, not a
  report defect. The Named Entity Confusion preflight returned SKIP rather than
  PASS, because MONDO records no causal gene for MONDO:0015797, so disease
  identity was confirmed manually instead: MONDO:0015797 carries
  xref OMIMPS:600630, matching the OMIM number the report gives, and the
  report's gene profile (UVSSA, ERCC6, ERCC8) matches MONDO's own subtype terms.

  Every ontology CURIE here was resolved by lookup while it was written
  (ols:mondo, ols:hp, ols:go, ols:cl, ols:ncit; HGNC from cache/hgnc/terms.csv
  and sqlite:obo:hgnc).

  Deliberate omissions. Xerosis is described as a recurrent feature in the
  review literature but no cached source states it in a quotable sentence, so it
  is not curated as a phenotype. The 1:100,000 prevalence figure is recorded in
  the prevalence notes as unsupported rather than curated as a rate. Li et al.
  2019 (PMID:30182135, two novel ERCC8 variants) is cited by the research report
  but its cached record contains a publisher "File not found" page instead of an
  abstract, so it carries no evidence item here. ELOF1 appears in the mechanism
  as a pathway factor and is not a disease gene.

  There is no TC-NER mechanism module in kb/modules/, so no conforms_to link is
  declared. Such a module would have several conformers (Cockayne syndrome,
  COFS, trichothiodystrophy, xeroderma pigmentosum, this entry) and is worth
  considering separately.

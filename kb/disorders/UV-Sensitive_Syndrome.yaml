name: UV-Sensitive Syndrome
creation_date: "2026-09-09T16:56:20Z"
category: Genetic
description: >-
  UV-sensitive syndrome is an autosomal recessive photosensitivity disorder
  caused by biallelic loss of transcription-coupled nucleotide excision repair
  (TC-NER). Affected individuals sunburn easily after minimal exposure, and
  develop freckling and telangiectasia on sun-exposed skin. They have no
  neurological abnormality and no established predisposition to skin cancer.

  The interest of the entry is the contrast rather than the repair defect on its
  own. Two of the three causal genes, ERCC6 (CSB) and ERCC8 (CSA), are the
  Cockayne syndrome genes. Cockayne syndrome is a severe segmental progeroid
  disease with neurodegeneration, cachectic dwarfism and early death, while
  UV-sensitive syndrome is confined to the skin and compatible with a normal
  lifespan. The two share a TC-NER defect, so the TC-NER defect cannot be what
  makes Cockayne syndrome severe. A homozygous null CSB allele has been found in
  a person with UV-sensitive syndrome and no Cockayne features, which is the
  sharpest form of the problem: complete absence of the protein does not produce
  the severe disease. The favoured explanation is that CSA and CSB have further
  transcriptional, mitochondrial or repair-independent roles whose loss drives
  Cockayne syndrome, but this is not settled, and the entry records it as an
  open question rather than asserting it.

  The third gene, UVSSA, is the informative comparator: it acts in the same
  pathway, is the most frequently reported UV-sensitive syndrome gene, and has
  never been reported to cause Cockayne syndrome.
parents:
  - DNA Repair Disorder
  - Photosensitivity Disorder
synonyms:
  - UVSS
  - UV-sensitive syndrome
  - UV sensitive syndrome
  - Ultraviolet-sensitive syndrome
disease_term:
  preferred_term: UV-sensitive syndrome
  term:
    id: MONDO:0015797
    label: UV-sensitive syndrome

classifications:
  harrisons_chapter:
    - classification_value: DERMATOLOGY
      evidence:
        - reference: PMID:34974577
          reference_title: "The molecular genetics of UV-Sensitive syndrome: A rare dermal anomaly."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "Ultraviolet-sensitive syndrome is a rare skin disorder characterised by heterogeneous phenotypic spectrum of skin freckling, telangiectasia and acute sunburn."
          explanation: >-
            The source calls it a skin disorder and lists only cutaneous
            features, which places it in Harrison's dermatology Part.
    - classification_value: GENETICS_ENVIRONMENT_DISEASE
      evidence:
        - reference: PMID:15486090
          reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "UV-sensitive syndrome (UVsS) is a rare autosomal recessive disorder characterized by photosensitivity and mild freckling but without neurological abnormalities or skin tumors."
          explanation: >-
            Names it an autosomal recessive disorder, and the disease is
            expressed only on ultraviolet exposure, so it sits in the
            genetics-and-environment Part as well as dermatology.
      notes: >-
        mechanistic_category is deliberately left unset. Its enum offers
        RASopathy, ciliopathy, laminopathy, collagenopathy, desmosomopathy,
        mitochondrial disease, amyloidopathy, tauopathy, synucleinopathy,
        intermediate filament disease and proteotoxic disease. None of these is
        a DNA repair disorder, and stretching one to fit would assert something
        false.

prevalence:
  - population: Worldwide (published case literature)
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      A 2021 narrative review counted 18 patients from nine families of
      Japanese, French, Israeli, Iranian and Pakistani ancestry. The same review
      also quotes a prevalence of 1:100,000, which is deliberately NOT curated
      here as a rate: it is an unsourced estimate with no registry or
      population-surveillance support behind it, and the deep-research report
      flagged it on the same grounds.
    evidence:
      - reference: PMID:34974577
        reference_title: "The molecular genetics of UV-Sensitive syndrome: A rare dermal anomaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "So far, only 18 patients from nine different families (Japanese, French, Israeli, Iranian and Pakistani) have been reported in scientific literature."
        explanation: >-
          Gives the published case count and the reported ancestries, which is
          the basis for the CASES_IN_LITERATURE record and the ultra-rare band.

inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Biallelic germline loss-of-function variants in ERCC6, ERCC8 or UVSSA.
      Parental consanguinity is reported in several kindreds.
    evidence:
      - reference: PMID:34974577
        reference_title: "The molecular genetics of UV-Sensitive syndrome: A rare dermal anomaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "It usually has an autosomal recessive pattern."
        explanation: States the mode of inheritance for the syndrome.

has_subtypes:
  - name: UVSS1
    display_name: UV-sensitive syndrome 1 (ERCC6/CSB-related)
    description: >-
      Caused by biallelic ERCC6 variants. ERCC6 encodes CSB, the ATPase that
      engages RNA polymerase II stalled at a transcription-blocking lesion. The
      same gene causes Cockayne syndrome.
    subtype_term:
      preferred_term: UV-sensitive syndrome 1
      term:
        id: MONDO:0010909
        label: UV-sensitive syndrome 1
    genes:
      - preferred_term: ERCC6
        term:
          id: hgnc:3438
          label: ERCC6
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Three of the seven known UV(S)S cases carry mutations in the Cockayne syndrome genes ERCC8 or ERCC6 (also known as CSA and CSB, respectively)."
        explanation: >-
          Establishes ERCC6 as one of the genes causing this syndrome, which is
          what defines this subtype.
  - name: UVSS2
    display_name: UV-sensitive syndrome 2 (ERCC8/CSA-related)
    description: >-
      Caused by biallelic ERCC8 variants. ERCC8 encodes CSA, the substrate
      receptor of the CRL4-CSA ubiquitin ligase acting on stalled RNA polymerase
      II. The same gene causes Cockayne syndrome.
    subtype_term:
      preferred_term: UV-sensitive syndrome 2
      term:
        id: MONDO:0013829
        label: UV-sensitive syndrome 2
    genes:
      - preferred_term: ERCC8
        term:
          id: hgnc:3439
          label: ERCC8
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Three of the seven known UV(S)S cases carry mutations in the Cockayne syndrome genes ERCC8 or ERCC6 (also known as CSA and CSB, respectively)."
        explanation: >-
          Establishes ERCC8 as one of the genes causing this syndrome, which is
          what defines this subtype.
  - name: UVSS3
    display_name: UV-sensitive syndrome 3 / UVSS-A (UVSSA-related)
    description: >-
      Caused by biallelic UVSSA variants, and the most frequently reported form.
      UVSSA recruits TFIIH to stalled RNA polymerase II and stabilises the CSB
      complex. Unlike ERCC6 and ERCC8 it has not been reported to cause Cockayne
      syndrome, which makes it the comparator that separates the TC-NER role of
      this pathway from whatever else CSA and CSB do.
    subtype_term:
      preferred_term: UV-sensitive syndrome 3
      term:
        id: MONDO:0013834
        label: UV-sensitive syndrome 3
    genes:
      - preferred_term: UVSSA
        term:
          id: hgnc:29304
          label: UVSSA
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Using exome sequencing, we determine that mutations in the UVSSA gene (formerly known as KIAA1530) cause UV(S)S-A."
        explanation: Establishes UVSSA as the gene of the UVSS-A complementation group.

pathophysiology:
  - name: Biallelic Loss of a TC-NER Factor
    description: >-
      Loss-of-function variants in ERCC6, ERCC8 or UVSSA remove one component of
      the machinery that resolves RNA polymerase II stalled at a
      transcription-blocking lesion. Global-genome nucleotide excision repair is
      comparatively preserved, which is what separates this disorder from
      xeroderma pigmentosum and is why there is no marked cancer predisposition.
    biological_scale: MOLECULAR
    biological_processes:
      - preferred_term: transcription-coupled nucleotide-excision repair
        term:
          id: GO:0006283
          label: transcription-coupled nucleotide-excision repair
        modifier: DECREASED
    downstream:
      - target: Failure to Process Stalled RNA Polymerase II
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:22466610
            reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "The UVSSA protein interacts with TC-NER machinery and stabilizes the ERCC6 complex; it also facilitates ubiquitination of RNA polymerase IIo stalled at DNA damage sites."
            explanation: >-
              Ties the gene product directly to the processing of stalled
              polymerase, which is the step that fails when it is lost.
    evidence:
      - reference: PMID:22466610
        reference_title: Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Despite mild clinical features, cells from individuals with UV(S)S, like Cockayne syndrome cells, are very UV sensitive and are deficient in transcription-coupled nucleotide-excision repair (TC-NER), which removes DNA damage in actively transcribed genes."
        explanation: >-
          Establishes the TC-NER deficiency as the cellular lesion, and states
          in the same sentence that Cockayne cells share it.

  - name: Failure to Process Stalled RNA Polymerase II
    description: >-
      Repair normally proceeds by an ordered handover: CSB binds the stalled
      polymerase and recruits CSA, CSA loads UVSSA, ELOF1 positions UVSSA and
      the CRL4-CSA ligase so that the polymerase is ubiquitylated and
      inactivated, and UVSSA then recruits TFIIH to open the DNA. Losing any one
      of CSB, CSA or UVSSA breaks this chain, so the arrested polymerase is
      neither inactivated nor cleared and the repair machinery is never
      delivered to the lesion.
    biological_scale: MOLECULAR
    cell_types:
      - preferred_term: keratinocyte
        term:
          id: CL:0000312
          label: keratinocyte
    downstream:
      - target: Persistent Transcription Blockage After UV Exposure
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:38316879
            reference_title: Structural basis for RNA polymerase II ubiquitylation and inactivation in transcription-coupled repair.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: IN_VITRO
            snippet: "During transcription-coupled DNA repair (TCR), RNA polymerase II (Pol II) transitions from a transcriptionally active state to an arrested state that allows for removal of DNA lesions."
            explanation: >-
              States that the polymerase transition is what permits lesion
              removal, so failing to make that transition leaves the lesion in
              place and transcription blocked. Graded INDIRECT because the
              source describes the working pathway rather than the failure.
    evidence:
      - reference: PMID:32355176
        reference_title: "The cooperative action of CSB, CSA, and UVSSA target TFIIH to DNA damage-stalled RNA polymerase II."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Importantly, we find that UVSSA is the key factor that recruits the TFIIH complex in a manner that is stimulated by CSB and CSA."
        explanation: >-
          Establishes the order of the handover and why all three proteins are
          needed for the same step.
      - reference: PMID:32355176
        reference_title: "The cooperative action of CSB, CSA, and UVSSA target TFIIH to DNA damage-stalled RNA polymerase II."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We show that TCR is initiated by RNAPIIo-bound CSB, which recruits CSA through a newly identified CSA-interaction motif (CIM)."
        explanation: Gives the first two steps of the assembly, CSB then CSA.
      - reference: PMID:38316879
        reference_title: Structural basis for RNA polymerase II ubiquitylation and inactivation in transcription-coupled repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we found that ELOF1 serves as an adaptor to stably position UVSSA and CRL4CSA on arrested Pol II, leading to ligase neddylation and activation of Pol II ubiquitylation."
        explanation: >-
          Adds the structural step by which the complex is positioned and the
          polymerase ubiquitylated.
      - reference: PMID:38316879
        reference_title: Structural basis for RNA polymerase II ubiquitylation and inactivation in transcription-coupled repair.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In the presence of ELOF1, a transcription factor IIS (TFIIS)-like element in UVSSA gets ordered and extends through the Pol II pore, thus preventing reactivation of Pol II by TFIIS."
        explanation: >-
          Shows UVSSA actively holds the polymerase inactive rather than merely
          recruiting repair factors, so its loss has two consequences.

  - name: Persistent Transcription Blockage After UV Exposure
    description: >-
      Transcription of the damaged strand does not recover after UV irradiation.
      This is the defining cellular phenotype and the basis of the
      recovery-of-RNA-synthesis assay, which is abnormal while unscheduled DNA
      synthesis (reflecting global-genome repair) stays near normal.
    biological_scale: CELLULAR
    biological_processes:
      - preferred_term: UV-damage excision repair
        term:
          id: GO:0070914
          label: UV-damage excision repair
        modifier: DECREASED
    downstream:
      - target: UV-Induced Keratinocyte Apoptosis
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:26255937
            reference_title: Photosensitive human syndromes.
            supports: SUPPORT
            evidence_source: OTHER
            snippet: "The prevailing explanation is that TCR deficiency results in persistent transcription blockage, leading to cell death by apoptosis, or through the compounded problem of replication fork encounters with the immobilized transcription complexes."
            explanation: >-
              States this exact causal step, and is explicit that it is the
              prevailing explanation rather than a demonstrated one, which is
              how the node describes it. Graded OTHER because the source is a
              narrative review presenting a field consensus, not primary data.
    evidence:
      - reference: PMID:15486090
        reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive syndrome but not Cockayne syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "UVsS cells show UV hypersensitivity and defective transcription-coupled DNA repair of UV damage."
        explanation: >-
          States the cellular phenotype: UV hypersensitivity with a
          transcription-coupled repair defect.

  - name: UV-Induced Keratinocyte Apoptosis
    description: >-
      Sustained transcription arrest in UV-exposed epidermal keratinocytes
      triggers stress signalling and cell death, producing the exaggerated
      sunburn response. This last step is inferred from the repair biology and
      the clinical picture rather than traced directly in patient skin, and is
      the weakest link in the chain.
    biological_scale: CELLULAR
    cell_types:
      - preferred_term: keratinocyte
        term:
          id: CL:0000312
          label: keratinocyte
      - preferred_term: melanocyte
        term:
          id: CL:0000148
          label: melanocyte
    downstream:
      - target: Cutaneous Photosensitivity
        causal_link_type: DIRECT
      - target: Freckling
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      - target: Telangiectasia
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
      - reference: PMID:26255937
        reference_title: Photosensitive human syndromes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The responses of UVSS and CS cells to treatment with UV light (254 nm) are identical: defective survival, impaired recovery of RNA synthesis, accumulation of p53 correlated with apoptotic response at low UV doses, and proficient global repair of photoproducts;"
        explanation: >-
          Reports an apoptotic response with p53 accumulation at low UV doses,
          which is the cell-death event this node describes. Note the same
          sentence records that UV-sensitive syndrome and Cockayne cells behave
          identically, so this step is shared with Cockayne syndrome and is not
          what makes the two diseases differ.


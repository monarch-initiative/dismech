- name: DAG1 (primary dystroglycanopathy / LGMD2P)
  subtype: LGMD2P
  relationship_type: CAUSATIVE
  notes: >-
    DAG1 encodes dystroglycan itself, so a pathogenic DAG1 variant produces a
    primary dystroglycanopathy rather than the secondary form caused by the
    glycosyltransferase genes. ClinGen's Muscular Dystrophies and Myopathies Gene
    Curation Expert Panel classifies DAG1 as Definitive, but files the assertion
    against the dystroglycanopathy concept (MONDO:0018282) rather than against
    autosomal recessive limb-girdle muscular dystrophy, which is why a search
    restricted to the LGMD-R concept does not return it.
  gene_term:
    preferred_term: DAG1
    term:
      id: hgnc:2666
      label: DAG1
  evidence:
  - reference: PMID:21388311
    reference_title: "A dystroglycan mutation associated with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a dystroglycan missense mutation (Thr192→Met) in a woman with limb-girdle muscular dystrophy and cognitive impairment."
    explanation: Establishes a DAG1 missense variant as the cause of limb-girdle muscular dystrophy with cognitive impairment.

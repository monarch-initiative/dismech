has_subtypes:
- name: LGMDR1
  display_name: LGMD R1 (calpainopathy, LGMD2A; CAPN3)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2A
    term:
      id: MONDO:0009675
      label: autosomal recessive limb-girdle muscular dystrophy type 2A
  description: >-
    Calpainopathy, caused by biallelic CAPN3 variants. The most common LGMD-R subtype
    in many cohorts (~30-40% of LGMD). Characterized by symmetric progressive proximal
    weakness, scapular winging, tiptoe walking, Achilles tendon shortening, and scoliosis,
    typically without cardiac involvement.
  genes:
  - preferred_term: CAPN3
    term:
      id: hgnc:1480
      label: CAPN3
- name: LGMDR2
  display_name: LGMD R2 (dysferlinopathy, LGMD2B; DYSF)
  description: >-
    Dysferlinopathy, caused by biallelic DYSF variants encoding the membrane-repair
    protein dysferlin. Onset usually in the late teens to thirties, with very high
    serum CK (50-200x normal) and a phenotypic spectrum that also includes Miyoshi
    distal myopathy. Cardiac involvement is rare.
  genes:
  - preferred_term: DYSF
    term:
      id: hgnc:3097
      label: DYSF
- name: LGMDR3
  display_name: LGMD R3 (alpha-sarcoglycanopathy, LGMD2D; SGCA)
  description: >-
    Alpha-sarcoglycanopathy, caused by biallelic SGCA variants. Usually childhood
    onset with proximal weakness, calf hypertrophy, and risk of cardiomyopathy.
  genes:
  - preferred_term: SGCA
    term:
      id: hgnc:10805
      label: SGCA
- name: LGMDR4
  display_name: LGMD R4 (beta-sarcoglycanopathy, LGMD2E; SGCB)
  description: >-
    Beta-sarcoglycanopathy, caused by biallelic SGCB variants. Often a severe
    childhood-onset sarcoglycanopathy with cardiac and respiratory involvement.
  genes:
  - preferred_term: SGCB
    term:
      id: hgnc:10806
      label: SGCB
- name: LGMDR5
  display_name: LGMD R5 (gamma-sarcoglycanopathy, LGMD2C; SGCG)
  description: >-
    Gamma-sarcoglycanopathy, caused by biallelic SGCG variants. Variable severity
    including a severe childhood form with early loss of ambulation, calf hypertrophy,
    and high CK.
  genes:
  - preferred_term: SGCG
    term:
      id: hgnc:10809
      label: SGCG
- name: LGMDR6
  display_name: LGMD R6 (delta-sarcoglycanopathy, LGMD2F; SGCD)
  description: >-
    Delta-sarcoglycanopathy, caused by biallelic SGCD variants. A typically severe
    childhood-to-adolescence sarcoglycanopathy with risk of cardiomyopathy and
    respiratory complications.
  genes:
  - preferred_term: SGCD
    term:
      id: hgnc:10807
      label: SGCD
- name: LGMDR9
  display_name: LGMD R9 (FKRP-related dystroglycanopathy, LGMD2I; FKRP)
  description: >-
    FKRP-related dystroglycanopathy, caused by biallelic FKRP variants that impair
    glycosylation of alpha-dystroglycan. Variable onset; the common founder variant
    c.826C>A is associated with a later median loss of ambulation; respiratory decline
    and cardiomyopathy may occur.
  genes:
  - preferred_term: FKRP
    term:
      id: hgnc:17997
      label: FKRP
- name: LGMDR12
  display_name: LGMD R12 (anoctaminopathy, LGMD2L; ANO5)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2L
    term:
      id: MONDO:0012652
      label: autosomal recessive limb-girdle muscular dystrophy type 2L
  description: >-
    Anoctaminopathy, caused by biallelic ANO5 variants. Typically adult-onset proximal
    weakness, sometimes asymmetric or with a mixed proximal/distal pattern, with
    elevated CK and slower progression than the childhood sarcoglycanopathies.
  genes:
  - preferred_term: ANO5
    term:
      id: hgnc:27337
      label: ANO5
- name: LGMD2P
  display_name: LGMD2P (primary dystroglycanopathy; DAG1)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2P
    term:
      id: MONDO:0013440
      label: autosomal recessive limb-girdle muscular dystrophy type 2P
  description: >-
    Primary dystroglycanopathy: limb-girdle weakness with cognitive impairment caused
    by a missense variant in DAG1 itself rather than in one of the glycosyltransferases
    that modify alpha-dystroglycan. The reported Thr192Met substitution blocks
    LARGE-dependent maturation of the phosphorylated O-mannosyl glycans that
    alpha-dystroglycan needs for high-affinity laminin binding.
  genes:
  - preferred_term: DAG1
    term:
      id: hgnc:2666
      label: DAG1
  evidence:
  - reference: PMID:21388311
    reference_title: "A dystroglycan mutation associated with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a dystroglycan missense mutation (Thr192→Met) in a woman with limb-girdle muscular dystrophy and cognitive impairment."
    explanation: Establishes the DAG1 missense variant as the cause of limb-girdle muscular dystrophy with cognitive impairment.
- name: LGMD2Z
  display_name: LGMD2Z / LGMD R21 (POGLUT1-related)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2Z
    term:
      id: MONDO:0014977
      label: autosomal recessive limb-girdle muscular dystrophy type 2R1
  description: >-
    Autosomal recessive limb-girdle muscular dystrophy caused by a missense variant
    in POGLUT1, the protein O-glucosyltransferase that modifies Notch. Patient
    muscle shows decreased Notch signalling, a markedly reduced satellite cell pool,
    and muscle-specific alpha-dystroglycan hypoglycosylation that is absent from the
    same patients' fibroblasts. MONDO's primary label for this concept reads "type
    2R1", which matches none of its own exact synonyms; those give "autosomal
    recessive limb-girdle muscular dystrophy type 2Z" and "muscular dystrophy,
    limb-girdle, autosomal recessive 21", and this row follows them.
  genes:
  - preferred_term: POGLUT1
    term:
      id: hgnc:22954
      label: POGLUT1
  evidence:
  - reference: PMID:27807076
    reference_title: "A POGLUT1 mutation causes a muscular dystrophy with reduced Notch signaling and satellite cell loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family with autosomal recessive limb-girdle muscular dystrophy, we identified a missense mutation in POGLUT1 (protein O-glucosyltransferase 1), an enzyme involved in Notch posttranslational modification and function."
    explanation: Establishes the POGLUT1 missense variant as the cause of this autosomal recessive limb-girdle muscular dystrophy.
  - reference: PMID:27807076
    reference_title: "A POGLUT1 mutation causes a muscular dystrophy with reduced Notch signaling and satellite cell loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscles from patients revealed decreased Notch signaling, dramatic reduction in satellite cell pool and a muscle-specific α-dystroglycan hypoglycosylation not present in patients' fibroblasts."
    explanation: Sources the muscle findings described for this subtype, including the tissue-restricted alpha-dystroglycan hypoglycosylation.
- name: LGMD2X
  display_name: LGMD2X / LGMD R25 (POPDC1-related, with cardiac arrhythmia)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2X
    term:
      id: MONDO:0014782
      label: autosomal recessive limb-girdle muscular dystrophy type 2X
  description: >-
    Adult-onset proximal limb-girdle weakness with cardiac arrhythmia, caused by a
    homozygous POPDC1 missense variant. POPDC1 (previous symbol BVES) encodes a
    plasma membrane cAMP-binding protein of striated muscle; the reported S201F
    substitution halves cAMP affinity and impairs membrane trafficking of both
    POPDC1 and POPDC2 in patient muscle.
  genes:
  - preferred_term: POPDC1
    term:
      id: hgnc:1152
      label: BVES
  evidence:
  - reference: PMID:26642364
    reference_title: "POPDC1(S201F) causes muscular dystrophy and arrhythmia by affecting protein trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we have described a homozygous missense variant (c.602C>T, p.S201F) in POPDC1, identified by whole-exome sequencing, in a family of 4 with cardiac arrhythmia and limb-girdle muscular dystrophy (LGMD)."
    explanation: Establishes the homozygous POPDC1 variant as the cause of combined arrhythmia and limb-girdle muscular dystrophy.
- name: LGMDR18
  display_name: LGMD R18 (TRAPPC11-related)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type R18
    term:
      id: MONDO:0014144
      label: autosomal recessive limb-girdle muscular dystrophy type R18
  description: >-
    Recessive TRAPPC11 variants cause a spectrum from pure limb-girdle muscular
    dystrophy to a syndromic myopathy with infantile hyperkinetic movements, ataxia
    and intellectual disability, depending on the allele: a gryzun-domain missense
    variant segregated with LGMD in one consanguineous family, while a splice
    variant producing an in-frame deletion in the foie gras domain segregated with
    the syndromic form in Hutterite families.
  genes:
  - preferred_term: TRAPPC11
    term:
      id: hgnc:25751
      label: TRAPPC11
  evidence:
  - reference: PMID:23830518
    reference_title: "Recessive TRAPPC11 mutations cause a disease spectrum of limb girdle muscular dystrophy and myopathy with movement disorder and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the identification of mutations in transport protein particle complex 11 (TRAPPC11) in three individuals of a consanguineous Syrian family presenting with LGMD and in five individuals of Hutterite descent presenting with myopathy, infantile hyperkinetic movements, ataxia, and intellectual disability."
    explanation: Establishes recessive TRAPPC11 variants as the cause of both ends of this subtype's phenotypic spectrum.
- name: POMK-LGMD
  display_name: Limb-girdle muscular dystrophy due to POMK deficiency
  subtype_term:
    preferred_term: limb-girdle muscular dystrophy due to POMK deficiency
    term:
      id: MONDO:0014489
      label: limb-girdle muscular dystrophy due to POMK deficiency
  description: >-
    The mild end of the POMK dystroglycanopathy spectrum: limb-girdle weakness with
    cognitive defects, as opposed to Walker-Warburg syndrome at the severe end.
    POMK phosphorylates the O-mannosyl glycan on alpha-dystroglycan, a step required
    for extracellular matrix binding, so this is a dystroglycanopathy caused by a
    kinase rather than by a glycosyltransferase.
  genes:
  - preferred_term: POMK
    term:
      id: hgnc:26267
      label: POMK
  evidence:
  - reference: PMID:24925318
    reference_title: "POMK mutations disrupt muscle development leading to a spectrum of neuromuscular presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two families carrying different truncating alleles, both removing the kinase domain in POMK, with different clinical manifestations ranging from Walker-Warburg syndrome, the most severe form of dystroglycanopathy, to limb-girdle muscular dystrophy with cognitive defects."
    explanation: Establishes the limb-girdle end of the POMK phenotypic spectrum that this subtype names.
- name: LGMDR26
  display_name: LGMD R26 (POPDC3-related)
  subtype_term:
    preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 26
    term:
      id: MONDO:0030014
      label: "muscular dystrophy, limb-girdle, autosomal recessive 26"
  description: >-
    Homozygous POPDC3 missense variants cause a limb-girdle muscular dystrophy with
    mostly adult-onset proximal weakness affecting the lower limbs before the upper,
    high creatine kinase, dystrophic biopsies, and fat replacement of paraspinal and
    proximal leg muscles on MRI. Unlike its paralogue POPDC1, cardiac investigations
    in the reported patients were unremarkable.
  genes:
  - preferred_term: POPDC3
    term:
      id: hgnc:17649
      label: POPDC3
  evidence:
  - reference: PMID:31610034
    reference_title: "POPDC3 Gene Variants Associate with a New Form of Limb Girdle Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous POPDC3 missense variants (p.Leu155His, p.Leu217Phe, and p.Arg261Gln) in 5 patients from 3 ethnically distinct families."
    explanation: Establishes homozygous POPDC3 variants as the cause of this subtype in three unrelated families.
  - reference: PMID:31610034
    reference_title: "POPDC3 Gene Variants Associate with a New Form of Limb Girdle Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness was proximal with adulthood onset in most patients and affected lower earlier than upper limbs. Muscle MRI revealed fat replacement of paraspinal and proximal leg muscles; cardiac investigations were unremarkable."
    explanation: Sources the clinical pattern and the absence of cardiac involvement described for this subtype.
- name: LGMDR27
  display_name: LGMD R27 (JAG2-related)
  subtype_term:
    preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 27
    term:
      id: MONDO:0030456
      label: "muscular dystrophy, limb-girdle, autosomal recessive 27"
  description: >-
    Biallelic JAG2 variants cause a muscular dystrophy with onset from infancy to
    young adulthood, normal or only mildly raised creatine kinase, and a distinctive
    slightly asymmetric MRI pattern with cores of preserved and affected muscle in
    quadriceps and tibialis anterior that can resemble POGLUT1-associated disease.
    JAG2 encodes the Notch ligand Jagged2, placing this subtype with POGLUT1 in the
    Notch/satellite-cell group rather than with the sarcolemmal ones.
  genes:
  - preferred_term: JAG2
    term:
      id: hgnc:6189
      label: JAG2
  evidence:
  - reference: PMID:33861953
    reference_title: "A form of muscular dystrophy associated with pathogenic variants in JAG2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified rare homozygous or compound heterozygous JAG2 variants in all 13 families."
    explanation: Establishes biallelic JAG2 variants across 13 unrelated families as the cause of this subtype.
  - reference: PMID:33861953
    reference_title: "A form of muscular dystrophy associated with pathogenic variants in JAG2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the lower extremities revealed a distinct, slightly asymmetric pattern of muscle involvement with cores of preserved and affected muscles in quadriceps and tibialis anterior, in some cases resembling patterns seen in POGLUT1-associated muscular dystrophy."
    explanation: Sources the MRI pattern and its resemblance to POGLUT1 disease described for this subtype.

genetic:
- name: CAPN3 (calpainopathy / LGMDR1)
  subtype: LGMDR1
  notes: >-
    Biallelic pathogenic variants in CAPN3 (calpain-3, a muscle-specific calcium-activated
    protease) cause calpainopathy/LGMDR1, the most common LGMD-R subtype.
  gene_term:
    preferred_term: CAPN3
    term:
      id: hgnc:1480
      label: CAPN3
  evidence:
  - reference: PMID:38045992
    reference_title: "Genetic Patterns of Selected Muscular Dystrophies in the Muscular Dystrophy Surveillance, Tracking, and Research Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common associated genes were FKRP, CAPN3, ANO5, and DYSF."
    explanation: >-
      The US MD STARnet population-based surveillance study identifies CAPN3 among the
      most common genes associated with LGMD.
- name: DYSF (dysferlinopathy / LGMDR2)
  subtype: LGMDR2
  notes: >-
    Biallelic pathogenic variants in DYSF (dysferlin, a sarcolemmal membrane-repair
    protein) cause dysferlinopathy/LGMDR2.
  gene_term:
    preferred_term: DYSF
    term:
      id: hgnc:3097
      label: DYSF
  evidence:
  - reference: PMID:38540676
    reference_title: "The Dysferlinopathies Conundrum: Clinical Spectra, Disease Mechanism and Genetic Approaches for Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They are caused by mutations in the DYSF gene, which encodes the dysferlin protein
      that is crucial for repairing muscle membranes.
    explanation: >-
      Identifies DYSF/dysferlin as the cause of dysferlinopathy and its membrane-repair role.

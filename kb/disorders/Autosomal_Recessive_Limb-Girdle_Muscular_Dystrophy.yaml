pathophysiology:
- name: Alpha-Dystroglycan Hypoglycosylation and Loss of Laminin Binding
  biological_scale: MOLECULAR
  description: >-
    Alpha-dystroglycan reaches the extracellular matrix only after an O-mannosyl
    glycan is phosphorylated and then extended by LARGE; the mature glycan is what
    binds laminin with high affinity. Two of the LGMD-R genes act inside this
    pathway rather than on the sarcolemmal complex itself. DAG1 is the substrate:
    the Thr192Met variant blocks LARGE-dependent maturation of the phosphorylated
    O-mannosyl glycan, so the receptor loses laminin binding despite being present.
    POMK is the kinase that performs the phosphorylation step, and truncating
    alleles that remove its kinase domain produce dystroglycanopathy ranging from
    Walker-Warburg syndrome to limb-girdle weakness with cognitive defects. This
    node is the primary-dystroglycanopathy counterpart of the FKRP-driven secondary
    dystroglycanopathy recorded on the sarcolemmal node below.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: laminin binding
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  genes:
  - preferred_term: DAG1
    term:
      id: hgnc:2666
      label: DAG1
  - preferred_term: POMK
    term:
      id: hgnc:26267
      label: POMK
  evidence:
  - reference: PMID:21388311
    reference_title: "A dystroglycan mutation associated with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vitro and in vivo studies showed that the mutation impairs the receptor function of dystroglycan in skeletal muscle and brain by inhibiting the post-translational modification, mediated by the glycosyltransferase LARGE, of the phosphorylated O-mannosyl glycans on α-dystroglycan that is required for high-affinity binding to laminin."
    explanation: Supports loss of high-affinity laminin binding by alpha-dystroglycan as the molecular lesion in the DAG1 form.
  - reference: PMID:24925318
    reference_title: "POMK mutations disrupt muscle development leading to a spectrum of neuromuscular presentations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "POMK, which was found mutated in two dystroglycanopathy cases, is instead involved in a glycan phosphorylation reaction critical for ECM binding, but little is known about the clinical presentation of POMK mutations or of the function of this protein in the muscle."
    quote_role: BACKGROUND
    explanation: States the glycan-phosphorylation step that POMK performs and that this node asserts is lost.
  - reference: PMID:24925318
    reference_title: "POMK mutations disrupt muscle development leading to a spectrum of neuromuscular presentations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of loss of function in the zebrafish embryo and larva showed that pomk function is necessary for normal muscle development, leading to locomotor dysfuction in the embryo and signs of muscular dystrophy in the larva."
    explanation: Model-organism support that loss of POMK function produces muscular dystrophy.
  downstream:
  - target: Sarcolemmal Instability and Failed Membrane Repair
    description: >-
      An alpha-dystroglycan that cannot bind laminin severs the link between the
      myofiber cytoskeleton and the basement membrane, the same lesion the
      sarcoglycan and FKRP subtypes reach by other routes.
    causal_link_type: DIRECT
- name: Calpain-3 Deficiency and Impaired Sarcomere Remodelling
  biological_scale: MOLECULAR
  description: >-
    Calpain-3 is the muscle-specific calcium-dependent protease, held at the N2A
    region of titin in the sarcomere and activated by sustained modest rises in
    cytoplasmic calcium such as those following eccentric contraction. Loss of
    calpain-3 expression causes LGMDR1, and its pathogenic mechanism is understood
    as impaired sarcomere remodelling rather than as sarcolemmal fragility, which is
    why this subtype is wired to a separate node from the sarcoglycanopathies and
    dysferlinopathy.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: sarcomere organization
    term:
      id: GO:0045214
      label: sarcomere organization
    modifier: ABNORMAL
  genes:

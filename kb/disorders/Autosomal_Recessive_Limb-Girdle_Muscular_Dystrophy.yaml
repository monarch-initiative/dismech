    reference_title: "Calpains, skeletal muscle function and exercise."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The physiological roles of the calpains are not well understood, although ubiquitous calpains have been associated with apoptosis and myogenesis and calpain-3 is likely involved in sarcomeric remodelling. A defect in the expression of calpain-3 results in limb-girdle muscular dystrophy Type 2A."
    explanation: >-
      Links loss of calpain-3 expression to LGMD2A and states the sarcomeric
      remodelling role this node asserts, with the hedging the source itself uses.
  - reference: PMID:19793101
    reference_title: "Calpains, skeletal muscle function and exercise."

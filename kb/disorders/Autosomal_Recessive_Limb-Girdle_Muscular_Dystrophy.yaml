- name: POPDC cAMP-Effector Membrane Trafficking Defect
  biological_scale: MOLECULAR
  description: >-
    POPDC1 and its paralogue POPDC3 are plasma-membrane cAMP-binding proteins
    abundant in striated muscle. The LGMD2X variant POPDC1 S201F halves cAMP
    affinity and, in patient skeletal muscle, leaves both mutant POPDC1 and
    wild-type POPDC2 stranded short of the membrane. The three reported POPDC3
    variants instead show up as aberrant modulation of the mechanosensitive
    potassium channel TREK-1 when expressed in Xenopus oocytes. POPDC1 disease
    carries cardiac arrhythmia; POPDC3 disease, in the reported patients, did not
    involve the heart.

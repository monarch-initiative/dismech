    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Notch Signalling Failure and Satellite Cell Depletion
  biological_scale: CELLULAR
  description: >-
    Skeletal muscle regeneration depends on satellite cells, whose quiescence and
    self-renewal are controlled by Notch signalling. Two LGMD-R genes act on that
    pathway rather than on the sarcolemma: POGLUT1 O-glucosylates Notch, and JAG2
    encodes the Notch ligand Jagged2. POGLUT1 patients' muscle shows reduced Notch
    signalling with a dramatically reduced satellite cell pool, and their primary
    myoblasts proliferate slowly, differentiate too readily, and hold a smaller pool
    of quiescent PAX7-positive cells; restoring Notch signalling rescues the
    myogenic defect. JAG2 muscle shows misregulation of myogenesis genes including
    PAX7.
  cell_types:
  - preferred_term: skeletal muscle satellite cell
    term:
      id: CL:0000594
      label: skeletal muscle satellite cell
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:

discussions:
- discussion_id: gap_ts_fever_exacerbation_human_validity
  prompt: >-
    Does fever/elevated body temperature acutely exacerbate arrhythmia and
    seizure susceptibility in human CACNA1C carriers — including overtly normal
    heterozygotes — as it does in the zebrafish cacna1c model, and can this
    fever-provoked signal be used to find latent or mild CACNA1C-spectrum cases
    in electronic health records?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Fever-triggered CaV1.2 activation and lowered arrhythmia/seizure threshold
  - pathophysiology#Fever-associated increased seizure susceptibility
  rationale: >-
    The fever-exacerbation effect — arrhythmia and seizure-like behavior elicited
    by elevated temperature even in phenotypically normal heterozygotes — is
    demonstrated in a zebrafish cacna1c model, and the underlying premise (fever
    activates CaV1.2) is established biophysics. What is NOT established is
    whether the same fever-provoked decompensation occurs in human carriers and
    at what temperature/threshold. This is a genuine human-model-validity gap
    rather than an absence of evidence: model-system data exist, but their
    translation to human disease is the open question. Resolving it matters both
    clinically (fever management as a modifiable intervention) and for the
    hypothesis-based EHR case-finding query captured in this entry's definitions.
  proposed_experiments:
  - experiment_id: exp_ts_fever_ehr_case_finding
    name: EHR scan for fever-associated arrhythmia/seizure and CACNA1C enrichment
    description: >-
      In a genotype-linked EHR biobank (e.g. All of Us, eMERGE, or UK Biobank —
      the ICU-centric MIMIC lacks linked germline DNA and is confounded by sepsis,
      so it can prototype the phenotype logic but not validate it), execute the
      fever_exacerbated_cav1.2 case-finding query — new ventricular arrhythmia /
      QT-prolongation event or new seizure shortly after a documented febrile
      episode, in patients without prior such events — and test whether the
      identified cohort is enriched for rare/likely-pathogenic CACNA1C variants
      relative to matched controls. A positive result would support the
      hypothesis that fever unmasks latent CACNA1C-spectrum disease and validate
      the query as a case-finding tool.
    experiment_type:
      preferred_term: EHR cohort case-finding and genotype-enrichment analysis
    decision_criterion: >-
      Significant enrichment of rare/likely-pathogenic CACNA1C variants in the
      fever-associated arrhythmia/seizure cohort versus matched controls.
    would_support:
    - >-
      Fever acutely unmasks arrhythmia/seizure susceptibility in human CACNA1C
      carriers; the EHR query is a valid latent-case-finding tool.
    would_refute:
    - >-
      No CACNA1C enrichment, indicating the zebrafish fever effect does not
      translate to a detectable human EHR signal (or the query lacks specificity).
  - experiment_id: exp_ts_fever_ipsc_nam_challenge
    name: >-
      Human iPSC/organ-on-chip and in-silico hyperthermia challenge of CACNA1C
      G406R
    description: >-
      Directly test whether the zebrafish fever effect is intrinsic to human
      CACNA1C-mutant cells, using New Approach Methodologies rather than an animal
      model. Subject patient-derived (and isogenic CRISPR-corrected control) human
      iPSC-derived cardiomyocytes and cortical/GABAergic neurons — and a cardiac
      microtissue/heart-on-chip — to a controlled hyperthermia challenge (raising
      temperature from 37 to ~40 degrees C), and pair this with an in-silico human
      ventricular action-potential model carrying a temperature-dependent CaV1.2
      formulation. Timothy syndrome already has human iPSC evidence for the
      baseline mechanism (PMID:21307850 cardiomyocytes, PMID:22120178 neurons), so
      adding a temperature arm to those same NAM platforms is the lowest-inferential
      -distance human-relevant test of the fever hypothesis and the natural way to
      close the zebrafish-to-human gap this discussion raises.
    experiment_type:
      preferred_term: iPSC/organ-on-chip and in-silico temperature-challenge assay
    model_systems:
    - name: CACNA1C G406R human iPSC-derived cardiomyocytes
      description: >-
        Patient-derived and isogenic CRISPR-corrected iPSC-cardiomyocytes; assess
        temperature-dependent action-potential and calcium-handling changes.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_source: patient-derived and isogenic CRISPR-corrected iPSC
    - name: CACNA1C G406R human iPSC-derived cortical/GABAergic neuronal network
      description: >-
        iPSC-derived neuronal networks on multi-electrode arrays to test
        temperature-dependent hyperexcitability and seizure-like bursting.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_source: patient-derived and isogenic CRISPR-corrected iPSC
    - name: Cardiac microtissue / heart-on-chip
      description: >-
        3D engineered human cardiac microtissue to test temperature-dependent
        arrhythmic behavior in a tissue-level NAM.
      experimental_model_type: ORGAN_ON_CHIP
      namo_type: namo:OrganOnChip
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    - name: In-silico human ventricular action-potential model
      description: >-
        Computational human ventricular AP model with a temperature-dependent
        CaV1.2 formulation to predict fever-induced action-potential prolongation
        and early afterdepolarizations.
      experimental_model_type: OTHER
    perturbations:
    - name: Controlled hyperthermia (fever) challenge
      target: pathophysiology#Fever-triggered CaV1.2 activation and lowered arrhythmia/seizure threshold
      description: >-
        Raise culture/model temperature from 37 to ~40 degrees C, comparing mutant
        with isogenic-corrected controls.
    readouts:
    - name: Temperature-dependent APD prolongation and early afterdepolarizations
      target: pathophysiology#Ventricular tachyarrhythmia (torsade de pointes)
      description: >-
        Action-potential duration, persistent L-type calcium current, and EAD
        frequency in cardiomyocytes / microtissue at febrile versus normothermic
        temperature.
    - name: Temperature-dependent network hyperexcitability
      target: pathophysiology#Fever-associated increased seizure susceptibility
      description: >-
        Multi-electrode-array burst rate and network synchrony in iPSC-neurons at
        febrile versus normothermic temperature.
    decision_criterion: >-
      A temperature-dependent increase in APD/EAD (cardiomyocytes/microtissue) and
      network hyperexcitability (neurons) in CACNA1C G406R models but not in
      isogenic-corrected controls, reproduced in silico.
    would_support:
    - >-
      The fever effect is intrinsic to human CACNA1C-mutant cells, translating the
      zebrafish finding to human biology and raising the hypothesis from
      MODEL_SYSTEM_EXTRAPOLATION toward a human-validated mechanism.
    would_refute:
    - >-
      No temperature dependence in human iPSC/organ-on-chip or in-silico models,
      indicating the zebrafish fever effect may be species-specific and not
      human-relevant.
notes: >-
  This entry addresses the listed Gene2Phenotype disease framing for
  CACNA1C-related Timothy syndrome (G2P03309, MONDO:0010979) and does not
  create a separate broader CACNA1C-related disorder entry in this PR. Recent
  international consensus reasserts classical Timothy syndrome while defining a
  broader CACNA1C-related disorder for incompletely syndromic or boundary
  phenotypes; those broader phenotypes can be split later if the knowledge base
  adds a dedicated CACNA1C spectrum entry. Classical Timothy syndrome remains
  the strongest current disease anchor for the CACNA1C gain-of-function syndrome
  with marked QT prolongation plus syndromic developmental features.

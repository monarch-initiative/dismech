inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Timothy syndrome is mechanistically an autosomal dominant gain-of-function
    disorder, although most classical cases reported so far have arisen de novo.
  evidence:
  - reference: PMID:15454078
    reference_title: >-
      Ca(V)1.2 calcium channel dysfunction causes a multisystem disorder
      including arrhythmia and autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In every case, Timothy syndrome results from the identical, de novo
      Ca(V)1.2 missense mutation G406R.
    explanation: >-
      Recurrent heterozygous de novo pathogenic variants support a dominant
      disease architecture with most observed cases being sporadic.
mechanistic_hypotheses:
- hypothesis_group_id: fever_exacerbated_cav1.2
  hypothesis_label: >-
    Fever/elevated body temperature lowers the threshold for CaV1.2-driven
    arrhythmia and seizures
  status: EMERGING
  description: >-
    Elevated body temperature activates the CaV1.2 L-type calcium channel and is
    hypothesized to augment the mutant persistent inward calcium current, so
    febrile episodes may acutely unmask ventricular arrhythmia and lower the
    seizure threshold — even in CACNA1C carriers who are overtly normal at
    baseline. This frames fever as a modifiable risk factor and, at a
    population level, as a candidate signal for scanning electronic health
    records for latent or mild CACNA1C-spectrum cases (e.g. a new rhythm
    disturbance or seizure temporally following a documented fever). The
    hypothesis is currently supported by a zebrafish cacna1c model; its validity
    in human patients is an open question (see the linked HUMAN_MODEL_MISMATCH
    discussion). Downstream causal edges that belong to this hypothesis opt in
    via hypothesis_groups: [fever_exacerbated_cav1.2].
  evidence:
  - reference: PMID:42426269
    reference_title: >-
      Elevated body temperature exacerbates arrhythmia and seizure-like activity
      in a zebrafish model of Timothy syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      elevated water temperature elicited arrhythmia and seizure-like behavior
      even in overtly normal heterozygotes, implicating fever as a modifiable
      risk
    explanation: >-
      In a zebrafish cacna1c Timothy-syndrome model, raising temperature
      elicited arrhythmia and seizure-like behavior even in phenotypically
      normal heterozygotes, directly motivating the fever-exacerbation
      hypothesis.
  - reference: PMID:42426269
    reference_title: >-
      Elevated body temperature exacerbates arrhythmia and seizure-like activity
      in a zebrafish model of Timothy syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      fever, known to activate CaV1.2 channels, may exacerbate TS, yet its
      impact is poorly understood
    explanation: >-
      States the biophysical premise (fever activates CaV1.2) and that its
      impact on Timothy syndrome is not yet characterized in patients.
pathophysiology:
- name: CACNA1C gain-of-function with impaired Cav1.2 inactivation
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  description: >-
    Activating CACNA1C variants impair voltage-dependent inactivation of the
    Cav1.2 L-type calcium channel, causing maintained inward calcium current in
    excitable cells. This persistent calcium influx is the upstream lesion that
    links the cardiac, developmental, and neurobehavioral manifestations of
    Timothy syndrome.
  gene:
    preferred_term: CACNA1C
    term:
      id: hgnc:1390
      label: CACNA1C
  cell_types:

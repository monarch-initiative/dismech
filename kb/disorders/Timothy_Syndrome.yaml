  - reference: PMID:21307850
    reference_title: >-
      Using induced pluripotent stem cells to investigate cardiac phenotypes in
      Timothy syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These depolarizations were similar to the delayed after depolarizations

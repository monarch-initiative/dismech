name: Timothy Syndrome
creation_date: "2026-04-12T00:00:00Z"
category: Mendelian
description: >-
  Timothy syndrome is a rare CACNA1C-associated multisystem channelopathy caused
  by gain-of-function variants in the Cav1.2 L-type calcium channel, classically
  the recurrent G406R variant in alternatively spliced exon 8A and related exon
  8 variants. The syndrome is defined by marked QT prolongation with
  life-threatening ventricular arrhythmia and is frequently accompanied by
  syndactyly, congenital heart disease, intermittent hypoglycemia,
  developmental delay, and autistic behavior. The core mechanism is impaired
  voltage-dependent channel inactivation, which produces maintained inward
  calcium current, delayed cardiomyocyte repolarization, and abnormal
  calcium-dependent differentiation programs in the developing cortex.
disease_term:
  preferred_term: Timothy syndrome
  term:
    id: MONDO:0010979
    label: Timothy syndrome
definitions:
- name: Clinical disease framing for Timothy syndrome
  definition_type: CASE_DEFINITION
  description: >-
    Timothy syndrome is the classical syndromic CACNA1C gain-of-function
    phenotype defined by prolonged QT interval with malignant arrhythmia plus
    characteristic extracardiac developmental features, especially syndactyly
    and neurodevelopmental abnormalities.
  scope: Classical MONDO disease framing for the syndromic CACNA1C channelopathy
  evidence:
  - reference: PMID:15454078
    reference_title: >-
      Ca(V)1.2 calcium channel dysfunction causes a multisystem disorder
      including arrhythmia and autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present Timothy syndrome, a novel disorder characterized by
      multiorgan dysfunction including lethal arrhythmias, webbing of fingers
      and toes, congenital heart disease, immune deficiency, intermittent
      hypoglycemia, cognitive abnormalities, and autism.
    explanation: >-
      Landmark clinical report defining the classical multisystem Timothy
      syndrome phenotype.
  - reference: PMID:41333400
    reference_title: >-
      Timothy Syndrome and CACNA1C-Related Disorder: First International
      Language and Management Guidelines Consensus Statement.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We formalise the language around syndromic presentations linked to CACNA1C
      variants, reassert and demarcate the classical Timothy Syndrome phenotype,
      and define a new syndrome, CACNA1C-Related Disorder.
    explanation: >-
      Recent consensus supports retaining a classical Timothy syndrome disease
      framing while acknowledging a broader CACNA1C-related disorder spectrum.
- name: Molecular definition for Timothy syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Molecularly, this entry captures heterozygous activating CACNA1C variants
    that impair Cav1.2 voltage-dependent inactivation and create persistent
    inward calcium current.
  scope: Molecular anchoring of classical CACNA1C-related Timothy syndrome
  evidence:
  - reference: PMID:15454078
    reference_title: >-
      Ca(V)1.2 calcium channel dysfunction causes a multisystem disorder
      including arrhythmia and autism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional expression reveals that G406R produces maintained inward
      Ca(2+) currents by causing nearly complete loss of voltage-dependent
      channel inactivation.
    explanation: >-
      Defines the core gain-of-function mechanism of Timothy syndrome at the
      channel level.
- name: >-
    Fever-associated arrhythmia/seizure case-finding query for latent CACNA1C
    carriers
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: MECHANISTIC_HYPOTHESIS
  validation_status:
    status: PROPOSED
    rationale: >-
      Drafted from the zebrafish fever-exacerbation result; never executed
      against a human EHR/OMOP dataset, so no PPV/sensitivity is characterized.
  attaches_to:
  - pathophysiology#Fever-triggered CaV1.2 activation and lowered arrhythmia/seizure threshold
  description: >-
    Proposed EHR/OMOP case-finding query: identify individuals with a new
    ventricular arrhythmia / QT-prolongation event or a new seizure within a
    short window after a documented febrile episode, absent a prior such event,
    as candidate latent or mild CACNA1C-spectrum cases. The query operationalizes
    the emerging fever_exacerbated_cav1.2 hypothesis (fever activates CaV1.2 and
    can unmask arrhythmia/seizures even in overtly normal carriers); a positive
    yield is itself partial evidence for that hypothesis.
  scope: >-
    EHR/OMOP case-finding; HYPOTHESIS-GENERATING, NOT a validated diagnostic or
    consensus phenotype algorithm. Predicated on an unproven mechanism
    (fever_exacerbated_cav1.2) whose human validity is an open question.
  criteria_sets:
  - name: Febrile-onset rhythm disturbance or seizure
    description: >-
      Documented fever (temperature or febrile-illness diagnosis code) followed
      within a short window (e.g. days) by a NEW ventricular arrhythmia /
      long-QT event or a new seizure, with no prior arrhythmia/seizure history.
      Temporal window and code sets to be specified at implementation.
    inclusion_criteria:
    - preferred_term: Documented febrile episode
      description: Elevated body temperature or a febrile-illness diagnosis code (index exposure).
    - preferred_term: New post-fever arrhythmia or seizure
      description: >-
        First ventricular arrhythmia / QT-prolongation event or first seizure
        occurring shortly after the febrile episode.
    exclusion_criteria:
    - preferred_term: Pre-existing arrhythmia or epilepsy
      description: >-
        Prior history of the same event type, which would confound the
        fever-provoked interpretation.
  evidence:
  - reference: PMID:42426269
    reference_title: >-
      Elevated body temperature exacerbates arrhythmia and seizure-like activity
      in a zebrafish model of Timothy syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      elevated water temperature elicited arrhythmia and seizure-like behavior
      even in overtly normal heterozygotes, implicating fever as a modifiable
      risk
    explanation: >-
      Model-system basis for the query: temperature elicited arrhythmia and
      seizure-like behavior in phenotypically normal cacna1c heterozygotes,
      motivating a search for analogous latent human cases.
  notes: >-
    Hypothesis-based, unvalidated case-finding query — not a consensus or
    gold-standard-validated phenotype algorithm. Its epistemic status is carried
    structurally by derivation_basis (MECHANISTIC_HYPOTHESIS), the
    validation_status object (PROPOSED), and attaches_to the fever-trigger
    pathophysiology node, so the hypothesis basis is inferred from the pathograph
    (fever_exacerbated_cav1.2). See monarch-initiative/dismech#6245.

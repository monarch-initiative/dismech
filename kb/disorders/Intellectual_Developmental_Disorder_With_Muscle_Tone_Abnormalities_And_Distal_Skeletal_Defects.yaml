      snippet: "JXP Kv1 channels do not affect axonal excitability or amplitude but regulate the length of refractory period."
      explanation: >-
        In sensory roots of Adam23-deficient mice, losing juxtaparanodal Kv1
        channels prolonged the refractory period without changing

animal_models:
- name: Lgi3-null mouse
  species: Mus musculus
  genotype: Lgi3 knockout (homozygous null)
  description: >-
    Lgi3-null mice have reduced and mislocalized Kv1 channel complexes in
    myelinated peripheral axons, with normal myelination. In the brain, loss
    of Lgi3 disrupts juxtaparanodal ADAM23 and Kv1 clustering and alters
    Kv1-mediated short-term synaptic plasticity. The mice develop normally
    and showed no behavioural deficit on rotarod, Morris water maze or
    IntelliCage testing, and myokymia has not been reported in them.
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  associated_phenotypes:
  - Reduced and mislocalized juxtaparanodal Kv1 channel complexes
  - Altered Kv1-mediated short-term synaptic plasticity
  - No detected behavioural or cognitive deficit
  modeled_mechanisms:
  - target: Juxtaparanodal Kv1 Channel Mislocalization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the channel-distribution defect proposed to underlie the human disease.
    limitations: >-
      The defect has not been examined in patient nerve, so agreement with the
      human mechanism is inferred rather than shown.
    evidence:
    - reference: PMID:35948005
      reference_title: "A reverse genetics and genomics approach to gene paralog function and disease: Myokymia and the juxtaparanode."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lgi3-null mice showed reduced and mis-localized Kv1 channel complexes in myelinated peripheral axons."
      explanation: The mouse shows the predicted channel defect.
  - target: Impaired Kv1-Mediated Short-Term Synaptic Plasticity
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Shows the central plasticity change proposed to underlie the intellectual disability.
    limitations: >-
      Synaptic plasticity has not been measured in patients, so whether the
      mouse change reflects the human disease is unknown.
    evidence:
    - reference: PMID:38194969
      reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A lack of Lgi3 in mice disrupts juxtaparanodal clustering of ADAM23 and Kv1 channels and suppresses Kv1-channel-mediated short-term synaptic plasticity."
      explanation: Reports the plasticity change in Lgi3-deficient mice.

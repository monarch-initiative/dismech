- peripheral nerve hyperexcitability syndrome
external_assertions:
- name: OMIM record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:620007
  description: >-
    OMIM phenotype entry that MONDO:0859277 records as an equivalent

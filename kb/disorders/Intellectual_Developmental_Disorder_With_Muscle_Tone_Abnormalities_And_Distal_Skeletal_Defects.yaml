animal_models:
- name: Lgi3-null mouse
  species: Mus musculus
  genotype: Lgi3 knockout (homozygous null)
  description: >-
    Lgi3-null mice have reduced and mislocalized Kv1 channel complexes in
    myelinated peripheral axons, with normal myelination. In the brain, loss
    of Lgi3 disrupts juxtaparanodal ADAM23 and Kv1 clustering and suppresses
    Kv1-mediated short-term synaptic plasticity. Whether the mice show
    myokymia or a cognitive phenotype is not reported in the abstracts cited.
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  associated_phenotypes:
  - Reduced and mislocalized juxtaparanodal Kv1 channel complexes
  - Suppressed Kv1-mediated short-term synaptic plasticity
  modeled_mechanisms:
  - target: Juxtaparanodal Kv1 Channel Mislocalization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the channel-distribution defect proposed to underlie the human disease.
    limitations: >-
      The defect has not been examined in patient nerve, so agreement with the
      human mechanism is inferred rather than shown.
    evidence:
    - reference: PMID:35948005
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lgi3-null mice showed reduced and mis-localized Kv1 channel complexes in myelinated peripheral axons."
      explanation: The mouse shows the predicted channel defect.
  evidence:
  - reference: PMID:35948005
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lgi3-null mice showed reduced and mis-localized Kv1 channel complexes in myelinated peripheral axons."
    explanation: Describes the main finding in the model.
discussions:
- discussion_id: lgi3_skeletal_and_reflex_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Distal limb deformities
  - phenotypes#Hyporeflexia
  prompt: >-
    What produces the distal deformities and the diminished reflexes in a
    disorder whose known lesion is axonal hyperexcitability?
  rationale: >-
    Hyperexcitable motor nerves would more naturally raise reflexes than lower
    them, and no source here explains how loss of LGI3 deforms the hands or
    feet. Both phenotypes are curated without an upstream mechanism for that
    reason.
- discussion_id: lgi3_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: Is there any targeted treatment for LGI3-related disease?
  rationale: >-
    No treatments are curated. The sources describe no therapy, and none has
    been tested in the mouse model.

- name: Impaired Kv1-Mediated Short-Term Synaptic Plasticity
  description: >-
    In the mouse brain, loss of LGI3 alters short-term synaptic plasticity
    that depends on Kv1 channels, reducing short-term depression at callosal
    synapses onto layer 5 pyramidal neurons. This is the proposed central
    counterpart of the peripheral defect and a candidate cause of the
    intellectual disability, but Lgi3-null mice showed no behavioural deficit
    and no study has connected it to cognition in patients.
  biological_scale: CELLULAR
  cell_types:

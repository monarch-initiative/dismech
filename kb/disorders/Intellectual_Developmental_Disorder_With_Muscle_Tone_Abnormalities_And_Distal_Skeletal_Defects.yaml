mechanistic_hypotheses:
- hypothesis_group_id: cns_kv1_short_term_plasticity
  hypothesis_label: Loss of oligodendrocyte-derived LGI3 impairs Kv1-dependent synaptic plasticity
  status: EMERGING
  description: >-
    The proposal that the intellectual disability arises because LGI3 secreted
    by oligodendrocytes is needed to cluster ADAM23 and Kv1 channels at central
    juxtaparanodes, and that their loss impairs Kv1-mediated short-term synaptic
    plasticity. The plasticity defect is shown in mice, but Lgi3-null mice
    showed no behavioural or cognitive deficit, and the pathway has not been
    examined in patients.
  evidence:
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Given the defective secretion of the LGI3 missense variant, we propose a molecular pathway, the juxtaparanodal LGI3-ADAM23-Kv1 channel, for understanding neurodevelopmental disorders."
    explanation: >-
      The authors frame the link to the neurodevelopmental phenotype as a
      proposal, which is why the status is EMERGING.
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, under the present experimental conditions, we observed no significant behavioral alterations in Lgi3−/− mice."
    explanation: >-
      Lgi3-null mice tested on rotarod, Morris water maze and IntelliCage tasks
      showed no deficit, so the plasticity defect has not been tied to a
      cognitive phenotype even in the model. The authors note the tests may
      not have been sensitive enough.
pathophysiology:
- name: LGI3 Loss of Function
  description: >-
    Biallelic loss-of-function variants remove functional LGI3, a secreted
    ligand of the ADAM23 receptor. The missense variant found in the original
    Jordanian family (p.Asp331Asn) markedly reduces secretion, so it too acts
    through loss of the extracellular protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  molecular_functions:
  - preferred_term: ADAM23 ligand activity
    modifier: DECREASED
    term:
      id: GO:0048018
      label: receptor ligand activity
  evidence:
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proteomic analysis using epitope-tagged Lgi3 knockin mice shows that LGI3 uses ADAM23 as a receptor and selectively co-assembles with Kv1 channels."
    explanation: Establishes LGI3's molecular function as a secreted ligand of the ADAM23 receptor, which loss-of-function variants remove.
  - reference: PMID:35948005
    reference_title: "A reverse genetics and genomics approach to gene paralog function and disease: Myokymia and the juxtaparanode."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, we identified 16 individuals from eight unrelated families with loss-of-function (LoF) bi-allelic variants in LGI3."
    explanation: Establishes loss of LGI3 function as the genetic lesion.
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The secretion level of LGI3 D331N from transfected HEK293T cells was greatly decreased as compared to that of wild-type LGI3, showing the similar defect level to that of LGI1 E383A (Figure 1C)."
    explanation: >-
      The missense variant from the Jordanian family is a secretion defect, so
      it behaves as a loss of the extracellular protein.
  downstream:
  - target: Loss of LGI3-ADAM23 Signaling at the Juxtaparanode
    causal_link_type: DIRECT
- name: Loss of LGI3-ADAM23 Signaling at the Juxtaparanode
  description: >-
    LGI3 accumulates at the juxtaparanodes of myelinated axons, where it binds
    the axonal receptor ADAM23 and co-assembles with Kv1 channel complexes.
    ADAM23 needs its LGI ligands to cluster those complexes; LGI2 can partly
    substitute for LGI3 in the peripheral nerve. The source of LGI3 differs by
    compartment: oligodendrocytes in the brain, and in peripheral nerve mainly
    the neurons themselves, acting in an autocrine fashion, rather than
    Schwann cells.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  - preferred_term: ADAM23
    term:
      id: hgnc:202
      label: ADAM23
  cellular_components:
  - preferred_term: juxtaparanode region of axon
    term:
      id: GO:0044224
      label: juxtaparanode region of axon
  evidence:
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we find that LGI3 is uniquely secreted from oligodendrocytes in the brain and enriched at juxtaparanodes of myelinated axons, forming nanoscale subclusters."
    explanation: Identifies the cellular source of LGI3 and where it acts.
  - reference: PMID:38194969
    reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proteomic analysis using epitope-tagged Lgi3 knockin mice shows that LGI3 uses ADAM23 as a receptor and selectively co-assembles with Kv1 channels."
    explanation: Identifies ADAM23 as the LGI3 receptor and places LGI3 in the Kv1 complex.
  - reference: PMID:36828548
    reference_title: "LGI3/2-ADAM23 interactions cluster Kv1 channels in myelinated axons to regulate refractory period."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The function of ADAM23 is critically dependent on its interaction with its extracellular ligands LGI2 and LGI3."
    explanation: Shows that ADAM23 function requires LGI3 (or LGI2) binding.
  - reference: PMID:36828548
    reference_title: "LGI3/2-ADAM23 interactions cluster Kv1 channels in myelinated axons to regulate refractory period."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We therefore suggest that the main cellular origin of the LGI ligands in the PNS is the neuron itself and that LGI3/LGI2 act in an autocrine fashion."
    explanation: >-
      Places the peripheral source of LGI3 in neurons. It follows the
      observation in the same paper that deleting Lgi3 in Schwann cells alone
      leaves Kv1 localization intact.
  downstream:
  - target: Juxtaparanodal Kv1 Channel Mislocalization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38194969
      reference_title: "Oligodendrocyte-derived LGI3 and its receptor ADAM23 organize juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A lack of Lgi3 in mice disrupts juxtaparanodal clustering of ADAM23 and Kv1 channels and suppresses Kv1-channel-mediated short-term synaptic plasticity."
      explanation: Loss of LGI3 disrupts ADAM23 and Kv1 clustering at the juxtaparanode.
- name: Juxtaparanodal Kv1 Channel Mislocalization
  description: >-
    Without LGI3, Kv1 channel complexes in myelinated axons are reduced and
    spread out of the juxtaparanode toward the paranodal axon-glia junction.
    Myelination itself is preserved in the mouse; the defect is in where the
    potassium channels sit, not in the myelin sheath.

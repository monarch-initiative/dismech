discussions:
- discussion_id: lgi3_skeletal_and_reflex_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Distal limb deformities
  - phenotypes#Hyporeflexia
  prompt: >-
    What produces the distal deformities and the diminished reflexes in a
    disorder whose known lesion is axonal hyperexcitability?
  rationale: >-
    Hyperexcitable motor nerves would more naturally raise reflexes than lower
    them, and no source here explains how loss of LGI3 deforms the hands or
    feet. Both phenotypes are curated without an upstream mechanism for that
    reason.
- discussion_id: lgi3_kv1_to_myokymia
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Peripheral Motor Nerve Hyperexcitability
  prompt: >-
    How does mislocalization of juxtaparanodal Kv1 channels make motor axons
    hyperexcitable?
  rationale: >-
    In mice, removing juxtaparanodal Kv1 complexes lengthened the refractory
    period without changing axonal excitability, and that was measured in
    sensory fibres of Adam23 mutants. Nobody has recorded motor-nerve
    excitability in an Lgi3 mutant, so the step from channel position to
    myokymia rests on the clinical association alone.
- discussion_id: lgi3_mouse_lacks_cognitive_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - mechanistic_hypotheses#cns_kv1_short_term_plasticity
  - phenotypes#Intellectual disability
  prompt: >-
    Why do Lgi3-null mice show a synaptic plasticity change but no cognitive
    deficit, when every reported patient has intellectual disability?
  rationale: >-
    The mismatch matters because the plasticity defect is the only proposed
    route from LGI3 loss to intellectual disability. The authors suggest the
    behavioural tests were not sensitive enough, that the mouse may
    compensate, or that species differ; each predicts something different
    about whether the pathway is the right one.
- discussion_id: lgi3_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: Is there any targeted treatment for LGI3-related disease?
  rationale: >-
    No treatments are curated. The sources describe no therapy, and none has
    been tested in the mouse model.

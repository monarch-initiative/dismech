name: Intellectual Developmental Disorder With Muscle Tone Abnormalities And Distal Skeletal Defects
creation_date: "2026-10-19T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic
  loss-of-function variants in LGI3, a secreted leucine-rich glioma-inactivated
  family protein. Affected children have global developmental delay and
  intellectual disability together with a peripheral nerve hyperexcitability
  syndrome: visible facial myokymia, diminished reflexes, distal limb
  deformities and electromyographic signs of motor nerve instability. The
  disorder was delineated in 2022 from 16 individuals in eight unrelated
  families. LGI3 is secreted by myelinating glia and binds the axonal receptor
  ADAM23, which clusters Shaker-type (Kv1) potassium channels at the
  juxtaparanodes of myelinated axons. Without LGI3 those channel complexes are
  reduced and mislocalized, which is the proposed cause of the motor nerve
  hyperexcitability. How the same defect produces the intellectual disability
  is less settled: in the mouse brain LGI3 comes from oligodendrocytes and its
  loss suppresses Kv1-dependent short-term synaptic plasticity, which the
  authors offer as a candidate pathway rather than a demonstrated cause.
disease_term:
  preferred_term: intellectual developmental disorder with muscle tone abnormalities and distal skeletal defects
  term:
    id: MONDO:0859277
    label: intellectual developmental disorder with muscle tone abnormalities and distal skeletal defects
synonyms:
- IDDMSD
- LGI3-related neurodevelopmental disorder
- LGI3-related peripheral nerve hyperexcitability syndrome
parents:

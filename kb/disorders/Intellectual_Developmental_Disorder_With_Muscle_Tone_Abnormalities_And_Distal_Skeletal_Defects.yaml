      evidence_source: MODEL_ORGANISM
      snippet: "Myokymia may result from instability of the facial nerve since their neurons express high levels of LGI3."
      explanation: >-
        The authors' explanation of why the hyperexcitability shows in the
        face. It is stated as a possibility, not tested.
  - target: Myokymia
    causal_link_type: DIRECT
  - target: Tongue fasciculations

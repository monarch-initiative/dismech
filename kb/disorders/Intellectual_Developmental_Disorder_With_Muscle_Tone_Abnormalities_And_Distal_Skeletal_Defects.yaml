      snippet: "LGI3-ADAM23 plays an instructive role in juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
      explanation: Links the juxtaparanodal Kv1 clustering defect to short-term plasticity in the mouse brain.
- name: Peripheral Motor Nerve Hyperexcitability
  description: >-
    Motor axons fire spontaneously and repetitively, seen clinically as facial
    myokymia and electrically as signs of motor nerve instability. How
    mislocalized juxtaparanodal Kv1 channels produce this is not established:
    in mice their loss lengthens the refractory period rather than raising
    excitability, and no Lgi3 mutant mouse has been shown to have myokymia.
  biological_scale: CELLULAR
  cell_types:

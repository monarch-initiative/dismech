notes: >-
  No GeneReviews chapter exists for this disorder (checked against the
  committed Bookshelf index), and no Orphanet or ClinGen record names LGI3. The
  phenotype is therefore taken from the delineating cohort, PMID:35948005, whose
  full text is not open access; only its abstract is quotable here. Per-feature
  counts are taken from the HPO annotation file (phenotype.hpoa release
  2026-09-02, OMIM:620007), which HPO curated from the full text of the same
  paper. They are recorded in each phenotype's notes and not converted into
  frequency bands, because the denominators differ between features (16, 13 or
  8 individuals). HPO records onset as infantile in 8/16 and childhood in 8/16.
  Features HPO annotates in a single individual (progressive microcephaly, axial
  hypotonia, ataxia, hypokinesia, hip dysplasia, pectus carinatum, kyphosis,
  short stature, failure to thrive, anxiety, eczematoid dermatitis) are not
  curated as separate phenotypes.

notes: >-
  No GeneReviews chapter exists for this disorder (checked against the
  committed Bookshelf index), and no Orphanet or ClinGen record names LGI3. The
  phenotype is therefore taken from the delineating cohort, PMID:35948005, whose
  full text is not open access; only its abstract is quotable here, which is
  why the distal deformities are bound to a broad limb term and no per-feature
  frequencies are given.
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic loss-of-function variants in LGI3 are required. The founding
    Jordanian family was consanguineous and carried a homozygous missense
    variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35948005
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, we identified 16 individuals from eight unrelated families with loss-of-function (LoF) bi-allelic variants in LGI3."
    explanation: >-
      Biallelic variants segregating with disease in eight unrelated families
      establish recessive inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: cns_kv1_short_term_plasticity
  hypothesis_label: Loss of oligodendrocyte-derived LGI3 impairs Kv1-dependent synaptic plasticity
  status: EMERGING
  description: >-
    The proposal that the intellectual disability arises because LGI3 secreted
    by oligodendrocytes is needed to cluster ADAM23 and Kv1 channels at central
    juxtaparanodes, and that their loss impairs Kv1-mediated short-term synaptic
    plasticity. Shown in mice; not yet tested in patients.
  evidence:
  - reference: PMID:38194969
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Given the defective secretion of the LGI3 missense variant, we propose a molecular pathway, the juxtaparanodal LGI3-ADAM23-Kv1 channel, for understanding neurodevelopmental disorders."
    explanation: >-
      The authors frame the link to the neurodevelopmental phenotype as a
      proposal, which is why the status is EMERGING.
pathophysiology:
- name: LGI3 Loss of Function
  description: >-
    Biallelic loss-of-function variants remove functional LGI3, a secreted
    ligand of the ADAM23 receptor. The missense variant found in the original
    Jordanian family (p.Asp331Asn) is poorly secreted, so it too leaves no
    functional protein outside the cell.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  evidence:
  - reference: PMID:35948005
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, we identified 16 individuals from eight unrelated families with loss-of-function (LoF) bi-allelic variants in LGI3."
    explanation: Establishes loss of LGI3 function as the genetic lesion.
  - reference: PMID:38194969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The secretion level of LGI3 D331N from transfected HEK293T cells was greatly decreased as compared to that of wild-type LGI3, showing the similar defect level to that of LGI1 E383A (Figure 1C)."
    explanation: >-
      The missense variant from the Jordanian family is a secretion defect, so
      it behaves as a loss of the extracellular protein.
  downstream:
  - target: Loss of LGI3-ADAM23 Signaling at the Juxtaparanode
    causal_link_type: DIRECT
- name: Loss of LGI3-ADAM23 Signaling at the Juxtaparanode
  description: >-
    LGI3 is secreted by myelinating glia (oligodendrocytes in the brain) and
    accumulates at the juxtaparanodes of myelinated axons, where it binds the
    axonal receptor ADAM23 and co-assembles with Kv1 channel complexes. ADAM23
    needs its LGI ligands to cluster those complexes; LGI2 can partly
    substitute for LGI3 in the peripheral nerve.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  genes:
  - preferred_term: LGI3
    term:
      id: hgnc:18711
      label: LGI3
  - preferred_term: ADAM23
    term:
      id: hgnc:202
      label: ADAM23
  cellular_components:
  - preferred_term: juxtaparanode region of axon
    term:
      id: GO:0044224
      label: juxtaparanode region of axon
  evidence:
  - reference: PMID:38194969
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we find that LGI3 is uniquely secreted from oligodendrocytes in the brain and enriched at juxtaparanodes of myelinated axons, forming nanoscale subclusters."
    explanation: Identifies the cellular source of LGI3 and where it acts.
  - reference: PMID:38194969
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proteomic analysis using epitope-tagged Lgi3 knockin mice shows that LGI3 uses ADAM23 as a receptor and selectively co-assembles with Kv1 channels."
    explanation: Identifies ADAM23 as the LGI3 receptor and places LGI3 in the Kv1 complex.
  - reference: PMID:36828548
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The function of ADAM23 is critically dependent on its interaction with its extracellular ligands LGI2 and LGI3."
    explanation: Shows that ADAM23 function requires LGI3 (or LGI2) binding.
  downstream:
  - target: Juxtaparanodal Kv1 Channel Mislocalization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38194969
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A lack of Lgi3 in mice disrupts juxtaparanodal clustering of ADAM23 and Kv1 channels and suppresses Kv1-channel-mediated short-term synaptic plasticity."
      explanation: Loss of LGI3 disrupts ADAM23 and Kv1 clustering at the juxtaparanode.
- name: Juxtaparanodal Kv1 Channel Mislocalization
  description: >-
    Without LGI3, Kv1 channel complexes in myelinated axons are reduced and
    spread out of the juxtaparanode toward the paranodal axon-glia junction.
    Myelination itself is preserved in the mouse; the defect is in where the
    potassium channels sit, not in the myelin sheath.
  biological_scale: CELLULAR
  genes:
  - preferred_term: ADAM23
    term:
      id: hgnc:202
      label: ADAM23
  cellular_components:
  - preferred_term: juxtaparanode region of axon
    term:
      id: GO:0044224
      label: juxtaparanode region of axon
  - preferred_term: voltage-gated potassium channel complex
    term:
      id: GO:0008076
      label: voltage-gated potassium channel complex
  biological_processes:
  - preferred_term: clustering of voltage-gated potassium channels
    modifier: DECREASED
    term:
      id: GO:0045163
      label: clustering of voltage-gated potassium channels
  evidence:
  - reference: PMID:35948005
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lgi3-null mice showed reduced and mis-localized Kv1 channel complexes in myelinated peripheral axons."
    explanation: Direct observation of the channel defect in Lgi3-null peripheral nerve.
  downstream:
  - target: Peripheral Motor Nerve Hyperexcitability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35948005
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate bi-allelic LoF variants in LGI3 cause a clinically distinguishable disease trait of PNHS, most likely caused by disturbed Kv1 channel distribution in the absence of LGI3."
      explanation: >-
        The authors attribute the nerve hyperexcitability to the disturbed Kv1
        distribution; this is their interpretation joining the patient and mouse
        data, not a direct measurement in patient nerve.
  - target: Impaired Kv1-Mediated Short-Term Synaptic Plasticity
    causal_link_type: DIRECT
    hypothesis_groups:
    - cns_kv1_short_term_plasticity
    evidence:
    - reference: PMID:38194969
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "LGI3-ADAM23 plays an instructive role in juxtaparanodal Kv1 channel clustering for short-term synaptic plasticity."
      explanation: Links the juxtaparanodal Kv1 clustering defect to short-term plasticity in the mouse brain.
- name: Peripheral Motor Nerve Hyperexcitability
  description: >-
    Motor axons fire spontaneously and repetitively, seen clinically as facial
    myokymia and electrically as signs of motor nerve instability. Juxtaparanodal
    Kv1 channels shape the axon's refractory period, which offers a plausible
    route from mislocalized channels to unstable firing.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: lower motor neuron
    term:
      id: CL:0008039
      label: lower motor neuron
  evidence:
  - reference: PMID:35948005
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep phenotypic characterization showed LGI3 LoF causes a potentially clinically recognizable PNHS trait characterized by global developmental delay, intellectual disability, distal deformities with diminished reflexes, visible facial myokymia, and distinctive electromyographic features suggestive of motor nerve instability."
    explanation: Defines the peripheral nerve hyperexcitability syndrome in patients.
  - reference: PMID:36828548
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we demonstrate that juxtaparanodal Kv1 complexes affect the refractory period, thus enabling high-frequency burst firing of action potentials."
    explanation: >-
      Shows that juxtaparanodal Kv1 complexes control axonal excitability. The
      experiment perturbed ADAM23 rather than LGI3, so it supports the step by
      inference.
  downstream:
  - target: Facial myokymia
    causal_link_type: DIRECT
  - target: Abnormal electromyogram
    causal_link_type: DIRECT
- name: Impaired Kv1-Mediated Short-Term Synaptic Plasticity
  description: >-
    In the mouse brain, loss of LGI3 suppresses short-term synaptic plasticity
    that depends on Kv1 channels. This is the proposed central counterpart of
    the peripheral defect and a candidate cause of the intellectual disability,
    though no study has connected it to cognition in patients.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:38194969
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A lack of Lgi3 in mice disrupts juxtaparanodal clustering of ADAM23 and Kv1 channels and suppresses Kv1-channel-mediated short-term synaptic plasticity."
    explanation: Reports the plasticity defect in Lgi3-deficient mice.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cns_kv1_short_term_plasticity
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cns_kv1_short_term_plasticity

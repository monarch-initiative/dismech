    term:
      id: CL:0008039
      label: lower motor neuron
  evidence:
  - reference: PMID:35948005
    reference_title: "A reverse genetics and genomics approach to gene paralog function and disease: Myokymia and the juxtaparanode."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep phenotypic characterization showed LGI3 LoF causes a potentially clinically recognizable PNHS trait characterized by global developmental delay, intellectual disability, distal deformities with diminished reflexes, visible facial myokymia, and distinctive electromyographic features suggestive of motor nerve instability."
    explanation: Defines the peripheral nerve hyperexcitability syndrome in patients.
  downstream:
  - target: Facial myokymia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36828548
      reference_title: "LGI3/2-ADAM23 interactions cluster Kv1 channels in myelinated axons to regulate refractory period."
      supports: SUPPORT

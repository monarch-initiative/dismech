    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knocking out JAG1 in hiPSC-BV significantly attenuates bile duct formation, highlighting BVLO potential as a model for Alagille syndrome, a congenital biliary disease.

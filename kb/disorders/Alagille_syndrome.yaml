histopathology:
- name: Paucity of interlobular bile ducts
  diagnostic: true
  description: >-
    Reduced interlobular bile ducts on liver biopsy are the characteristic hepatic
    histopathologic lesion, although a molecular diagnosis may establish Alagille syndrome without biopsy.
  finding_term:
    preferred_term: paucity of interlobular bile ducts
  evidence:
  - reference: PMID:20301450
    reference_title: Alagille Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major clinical manifestations of ALGS are bile duct paucity on liver biopsy, cholestasis
    explanation: GeneReviews directly identifies bile duct paucity as the characteristic biopsy finding.
biochemical:
- name: Elevated serum bile acids
  presence: INCREASED
  context: Cholestasis commonly produces high serum bile-acid concentrations and the level is a pharmacodynamic treatment readout.
  biomarker_term:
    preferred_term: serum bile acids
  evidence:
  - reference: PMID:38670135
    reference_title: "Efficacy and safety of odevixibat in patients with Alagille syndrome (ASSERT): a phase 3, double-blind, randomised, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cholestasis-associated clinical features can include high serum bile acids and severe pruritus
    explanation: The ASSERT trial identifies high serum bile acids as a disease-associated biochemical feature.
- name: Total bilirubin in infancy
  presence: INCREASED
  context: Total bilirubin between six and twelve months is a prognostic biomarker for portal hypertension and native-liver survival.
  biomarker_term:
    preferred_term: total serum bilirubin
  evidence:
  - reference: PMID:36036223
    reference_title: "Natural history of liver disease in a large international cohort of children with Alagille syndrome: Results from the GALA study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A TB <5.0 mg/dl between 6 and 12 months of age is associated with better hepatic outcomes.
    explanation: The international GALA cohort supports infant total bilirubin as an objective prognostic biomarker.
  reference_ranges:
  - unit: mg/dL
    population: children with Alagille syndrome, age 6-12 months
    notes: Prognostic bands for later clinically evident portal hypertension and liver transplantation; these are not general laboratory reference intervals.
    evidence:
    - reference: PMID:36036223
      reference_title: "Natural history of liver disease in a large international cohort of children with Alagille syndrome: Results from the GALA study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Median TB levels between ≥5.0 and <10.0 mg/dl and >10.0 mg/dl were associated with a 4.8 (95% CI, 2.4-9.7) and 15.6 (95% CI, 8.7-28.2) increased risk of transplantation relative to <5.0 mg/dl.
      explanation: GALA provides directly computable infant total-bilirubin prognostic tiers.
    interpretation_bands:
    - name: Lower hepatic-risk band
      upper_bound: 5.0
      unit: mg/dL
      interpretation: Median total bilirubin below 5.0 mg/dL was the reference group and was associated with better hepatic outcomes.
    - name: Intermediate hepatic-risk band
      lower_bound: 5.0
      upper_bound: 10.0
      unit: mg/dL
      interpretation: Median total bilirubin from 5.0 to below 10.0 mg/dL was associated with a 4.8-fold increased transplantation risk relative to below 5.0 mg/dL.
    - name: High hepatic-risk band
      lower_bound: 10.0
      unit: mg/dL
      interpretation: Median total bilirubin above 10.0 mg/dL was associated with a 15.6-fold increased transplantation risk relative to below 5.0 mg/dL.

datasets:
- accession: geo:GSE229527
  title: RNA-seq analysis of hilar and peripheral biliary organoids from a mouse model of Alagille syndrome
  description: To study molecular differences in wild-type and regenrated bile ducts in a mouse model of Alagille syndrome (Andersson, Chivukula, Hankeova, et al. Gastroenterology, 2018;154(4):1080-1095), we derived intrahepatic cholangiocyte organoids from hilar (pICOs) and peripheral (pICOs) regions of adult livers following a published protocol for organoids derivation and culture (Broutier et al., Nat Protoc. 2016;11:1724–1743). At passage 5, we isolated total RNA and performed bulk RNA-sequencing on 3 biological replicates from each region and genotype.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 12
  publication: PMID:38014627
  notes: Identified by GEO DataSets index search for Alagille syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

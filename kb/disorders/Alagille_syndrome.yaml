progression:
- phase: Neonatal and infantile cholestasis
  age_range: Infancy
  notes: Liver disease often presents with cholestasis early in life, but severity is highly variable.
  evidence:
  - reference: PMID:39446153
    reference_title: Kidney and vascular involvement in Alagille syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonatal cholestasis occurs in 85% of cases"
    explanation: This supports early hepatic presentation in most clinically recognized cases.
- phase: Progressive liver disease and portal hypertension
  age_range: Childhood through adolescence
  notes: A substantial fraction of children develop portal hypertension, require transplantation, or die before adulthood.
  evidence:
  - reference: PMID:36036223
    reference_title: "Natural history of liver disease in a large international cohort of children with Alagille syndrome: Results from the GALA study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 10 and 18-year NLS rates were 54.4% and 40.3%.
    explanation: The GALA cohort quantifies progressive loss of native-liver and event-free survival through childhood.
pathophysiology:
- name: JAG1 haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function JAG1 variants and deletions reduce functional Jagged1 dosage;
    JAG1 haploinsufficiency is the established mechanism for most Alagille syndrome.
  genes:
  - preferred_term: JAG1
    term:
      id: hgnc:6188
      label: JAG1
  biological_processes:

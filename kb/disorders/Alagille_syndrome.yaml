      snippet: >-
        certain ASOs targeting the upstream open reading frame (uORF) increased JAG1 protein levels
      explanation: The experiment directly supports activation of residual JAG1 translation as the treatment mechanism.
  evidence:
  - reference: PMID:40980686
    reference_title: Antisense oligonucleotide-mediated upregulation of Jag1 ameliorates liver disease phenotypes in a mouse model of Alagille syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that certain ASOs targeting the upstream open reading frame (uORF) increased JAG1 protein levels in various cell lines and ALGS patient-derived cells.
    explanation: Cell experiments support the intended translational-upregulation mechanism.
  - reference: PMID:40980686
    reference_title: Antisense oligonucleotide-mediated upregulation of Jag1 ameliorates liver disease phenotypes in a mouse model of Alagille syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When newborn Jag1 +/- mice were treated with ASO, improved bile duct development was observed, along with trends of reduced plasma bile acids, bilirubin, and triglyceride levels, implying improved liver function.

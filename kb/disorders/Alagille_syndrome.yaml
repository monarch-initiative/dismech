  evidence:
  - reference: PMID:40742203
    reference_title: Phenotypic Divergence of JAG1- and NOTCH2-Associated Alagille Syndrome & Disease-Specific NOTCH2 Variant Classification Guidelines.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JAG1 variants cause disease through a mechanism of haploinsufficiency, but the mechanism for NOTCH2 variants is not completely understood
    explanation: The 2025 GALA analysis distinguishes established JAG1 haploinsufficiency from the unresolved NOTCH2 mechanism.
  - reference: PMID:9207788
    reference_title: "Alagille syndrome is caused by mutations in human Jagged1, which encodes a ligand for Notch1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate four distinct coding mutations in JAG1 from four Alagille syndrome families, providing evidence that it is the causal gene for Alagille syndrome.
    explanation: The landmark discovery paper directly supports JAG1 as the causal gene in Alagille syndrome.

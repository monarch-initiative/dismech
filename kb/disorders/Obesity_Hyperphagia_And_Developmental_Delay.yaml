genetic:
- name: NTRK2
  gene_term:
    preferred_term: NTRK2
    term:
      id: hgnc:8032
      label: NTRK2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Disease alleles are heterozygous truncating variants and missense variants
    that disturb TrkB structure or kinase function, including the de novo index
    variant p.(Tyr722Cys). Not every rare NTRK2 missense variant found in obese
    children is damaging: p.Ile98Val, p.Pro660Leu and p.Thr821Ala signal
    normally in vitro. Transmembrane-domain variants such as the recurrent
    c.1301A>G p.(Tyr434Cys) upregulate TrkB and cause a different disorder,
    developmental and epileptic encephalopathy 58.

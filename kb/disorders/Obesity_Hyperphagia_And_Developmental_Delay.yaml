name: Obesity, Hyperphagia, and Developmental Delay
creation_date: "2026-10-17T04:45:00Z"
category: Mendelian
synonyms:
- OBHD
- NTRK2-related obesity, hyperphagia, and developmental delay
description: >-
  Rare autosomal dominant neurodevelopmental and monogenic obesity disorder
  caused by heterozygous loss-of-function variants in NTRK2, which encodes TrkB,
  the high-affinity receptor for brain-derived neurotrophic factor (BDNF). The
  index patient, a boy with a de novo p.Tyr722Cys kinase-domain variant, had
  hyperphagia, severe early-onset obesity, developmental delay and impaired
  memory, learning and nociception. A 2025 cohort of 44 individuals with NTRK2
  variants separated truncating and structurally disruptive loss-of-function
  alleles, which give this comparatively mild phenotype of developmental delay,
  obesity and hyperphagia, from transmembrane-domain variants that upregulate
  TrkB and cause a severe developmental and epileptic encephalopathy. In mice,
  reduced TrkB signaling, and deletion of Ntrk2 from the paraventricular or
  dorsomedial hypothalamus, cause hyperphagic obesity, placing the satiety
  defect in hypothalamic TrkB-expressing neurons acting downstream of
  melanocortin-4 receptor signaling. In cultured neurons, patient TrkB variants
  impair BDNF-induced neurite outgrowth and glutamatergic synaptogenesis, the
  proposed basis of the neurodevelopmental features.

      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15494731
    reference_title: "A de novo mutation affecting human TrkB associated with severe obesity and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 8-year-old male with a complex developmental syndrome and severe obesity was heterozygous for a de novo missense mutation resulting in a Y722C substitution in the neurotrophin receptor TrkB."
    explanation: The index patient carried a single, de novo heterozygous NTRK2 variant.
  - reference: PMID:39540377
    reference_title: "Upregulation versus loss of function of NTRK2 in 44 affected individuals leads to 2 distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous pathogenic variants in NTRK2 (HGNC: 8032) have been associated with global developmental delay."
    explanation: NTRK2-related disease is caused by heterozygous variants.
pathophysiology:
- name: NTRK2 Heterozygous Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Truncating NTRK2 variants, and missense variants that are predicted to
    disrupt the folded structure of TrkB or that fall in the kinase domain,
    reduce BDNF-stimulated TrkB activity. The index p.Tyr722Cys variant
    impairs receptor autophosphorylation. Several kinase-domain variants act
    dominantly in neurons, so reduced signaling may reflect dominant-negative
    interference as well as haploinsufficiency.
  genes:
  - preferred_term: NTRK2
    term:
      id: hgnc:8032
      label: NTRK2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: brain-derived neurotrophic factor receptor activity
    term:
      id: GO:0060175
      label: brain-derived neurotrophic factor receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:15494731
    reference_title: "A de novo mutation affecting human TrkB associated with severe obesity and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation markedly impaired receptor autophosphorylation and signaling to MAP kinase."
    explanation: The index variant reduces TrkB kinase activation in cultured cells.
  - reference: PMID:39540377
    reference_title: "Upregulation versus loss of function of NTRK2 in 44 affected individuals leads to 2 distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second group had truncating variants or variants that presumably disturb the 3D structure of the protein leading to loss of function."
    explanation: The allele classes that define this disease are loss-of-function variants.
  - reference: PMID:32493978
    reference_title: "Human BDNF/TrkB variants impair hippocampal synaptogenesis and associate with neurobehavioural abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multiple variants in the kinase domain and one variant in the extracellular domain of TrkB led to a loss of function through multiple signalling pathways, impaired neurite outgrowth and dominantly inhibited glutamatergic synaptogenesis in hippocampal neurons."
    explanation: Further TrkB variants from obese patients reduce receptor function, some with a dominant effect.
  downstream:
  - target: Impaired BDNF-TrkB Intracellular Signaling
    causal_link_type: DIRECT
    description: Reduced receptor activation lowers signaling through the downstream kinase cascades.
- name: Impaired BDNF-TrkB Intracellular Signaling
  biological_scale: CELLULAR
  description: >-
    BDNF binding fails to activate the TrkB effector pathways normally, with
    reduced MAP kinase, phospholipase C-gamma and Akt activation in cells
    expressing the p.Tyr722Cys receptor.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling pathway
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
    modifier: DECREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:16702999
    reference_title: "Functional characterization of human NTRK2 mutations identified in patients with severe early-onset obesity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further functional characterization of the previously reported Y722C TrkB mutation reveals impaired activation of mitogen-activated protein kinase, phospholipase C-gamma and Akt, as well as reduced BDNF-induced neurite outgrowth and cell survival in stably transfected PC12 cell lines."
    explanation: Reduced activation of the MAPK, PLC-gamma and Akt arms of TrkB signaling in cells expressing the patient variant.
  downstream:
  - target: Loss of TrkB-Mediated Hypothalamic Satiety Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypothalamic TrkB signaling suppresses food intake in mice; in patients
      the affected neurons have not been identified, so this link is inferred
      from model organisms.
    evidence:
    - reference: PMID:16702999
      reference_title: "Functional characterization of human NTRK2 mutations identified in patients with severe early-onset obesity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, impaired hypothalamic neurogenesis may contribute to the severe hyperphagia and obesity seen in the individual harboring the Y722C variant."
      explanation: The authors attribute the patient's hyperphagia to a hypothalamic consequence of the signaling defect.
  - target: Impaired Neurite Outgrowth and Synaptogenesis
    causal_link_type: DIRECT
    description: Reduced TrkB signaling diminishes BDNF-driven neurite growth and synapse formation.
  - target: Impaired pain sensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The index patient had reduced nociception, which the authors attribute
      to the role of TrkB in the nervous system; the pathway involved is not
      characterized.
    evidence:
    - reference: PMID:15494731
      reference_title: "A de novo mutation affecting human TrkB associated with severe obesity and developmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The associated impairment in memory, learning and nociception seen in the proband reflects the crucial role of TrkB in the human nervous system."
      explanation: Links the nociceptive deficit to loss of TrkB function.
- name: Loss of TrkB-Mediated Hypothalamic Satiety Signaling
  biological_scale: TISSUE
  description: >-
    TrkB-expressing neurons of the paraventricular and dorsomedial hypothalamus
    suppress food intake, and BDNF acts as an effector of melanocortin-4
    receptor signaling in the ventromedial hypothalamus. Loss of TrkB signaling
    in these circuits removes an anorexigenic signal. This node is established
    in mice; it is inferred, not demonstrated, in patients.
  cell_types:
  - preferred_term: hypothalamus cell
    term:
      id: CL:2000030
      label: hypothalamus cell
  biological_processes:
  - preferred_term: regulation of feeding behavior
    term:
      id: GO:0060259
      label: regulation of feeding behavior
    modifier: DYSREGULATED
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  evidence:
  - reference: PMID:32265438
    reference_title: "TrkB-expressing paraventricular hypothalamic neurons suppress appetite through multiple neurocircuits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate that selective Ntrk2 deletion within paraventricular hypothalamus (PVH) leads to severe hyperphagic obesity."
    explanation: Loss of TrkB in one hypothalamic nucleus is sufficient for hyperphagic obesity in mice.
  - reference: PMID:30718415
    reference_title: "TrkB-expressing neurons in the dorsomedial hypothalamus are necessary and sufficient to suppress homeostatic feeding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, selective Ntrk2 deletion in the DMH of adult mice led to hyperphagia, reduced energy expenditure, and obesity."
    explanation: A second hypothalamic TrkB population restrains feeding in mice.
  - reference: PMID:12796784
    reference_title: "Brain-derived neurotrophic factor regulates energy balance downstream of melanocortin-4 receptor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that MC4R signaling controls BDNF expression in the VMH and support the hypothesis that BDNF is an important effector through which MC4R signaling controls energy balance."
    explanation: Places BDNF-TrkB signaling downstream of the melanocortin satiety pathway.
  - reference: PMID:17130481
    reference_title: "Hyperphagia, severe obesity, impaired cognitive function, and hyperactivity associated with functional loss of one copy of the brain-derived neurotrophic factor (BDNF) gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency for BDNF was associated with increased ad libitum food intake, severe early-onset obesity, hyperactivity, and cognitive impairment."
    explanation: >-
      Loss of one copy of the TrkB ligand in a human produces the same
      hyperphagic obesity, supporting reduced BDNF-TrkB signaling as the cause
      in humans; the evidence concerns the ligand, not the receptor.
  downstream:
  - target: Hyperphagia
    causal_link_type: DIRECT
    description: Removal of a hypothalamic anorexigenic signal increases food intake.
    evidence:
    - reference: PMID:32265438
      reference_title: "TrkB-expressing paraventricular hypothalamic neurons suppress appetite through multiple neurocircuits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, chemogenetic activation or inhibition of TrkB-expressing PVH (PVHTrkB) neurons suppresses or increases food intake, respectively."
      explanation: Silencing hypothalamic TrkB neurons increases food intake in mice.
- name: Impaired Neurite Outgrowth and Synaptogenesis
  biological_scale: CELLULAR
  description: >-
    Patient TrkB variants reduce BDNF-induced neurite outgrowth and neuronal
    survival, and some act dominantly to inhibit glutamatergic synapse
    formation in hippocampal neurons. This is the proposed basis of the
    developmental delay and the learning and memory deficits.

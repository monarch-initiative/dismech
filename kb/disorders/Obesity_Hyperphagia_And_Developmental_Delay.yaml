discussions:
- discussion_id: ntrk2_missense_variant_interpretation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NTRK2 Heterozygous Loss of Function
  prompt: >-
    Which rare NTRK2 missense variants found in children with obesity and
    developmental delay reduce TrkB function, and how should a variant that
    signals normally in vitro be interpreted?
  rationale: >-
    Of four rare missense variants found in a cohort of severely obese
    children with developmental delay, only one impaired signaling in vitro.
    Missense variants in the transmembrane domain have the opposite effect and
    cause a different disorder. Classifying a new missense variant therefore
    depends on functional testing of its direction of effect.
  evidence:
  - reference: PMID:16702999
    reference_title: "Functional characterization of human NTRK2 mutations identified in patients with severe early-onset obesity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the signaling properties of I98V, P660L and T821A were all indistinguishable from wild type."
    explanation: Three of four candidate variants showed no functional defect.
  - reference: PMID:39540377
    reference_title: "Upregulation versus loss of function of NTRK2 in 44 affected individuals leads to 2 distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants probably lead to upregulation of tropomyosin receptor kinase B activity and to a severe phenotype of developmental delay/intellectual disability, muscular hypotonia, therapy-refractory epilepsy, visual impairment and blindness, and feeding difficulties."
    explanation: Other NTRK2 missense variants increase TrkB activity and cause a distinct disease.
  proposed_experiments:
  - experiment_id: ntrk2_variant_functional_panel
    name: Functional panel of NTRK2 missense variants
    description: >-
      Measure BDNF-stimulated TrkB autophosphorylation and downstream MAPK,
      PLC-gamma and Akt activation for reported NTRK2 missense variants from
      both phenotype groups, alongside wild type, to classify each variant's
      direction of effect.
    would_support:
    - pathophysiology#NTRK2 Heterozygous Loss of Function
notes: >-
  NTRK2 gain-of-function variants in the transmembrane domain cause a separate,
  more severe disorder, developmental and epileptic encephalopathy 58, which is
  a subtype of the Genetic_Developmental_and_Epileptic_Encephalopathy entry. No
  disease-specific treatment has been reported. Heterozygous loss of BDNF, the
  TrkB ligand, produces a similar hyperphagic
  obesity and is cited here only as pathway evidence. Per-patient phenotypes
  are taken from Table 1 of PMID:32493978, using only carriers of variants
  that the same paper or PMID:16702999 shows to impair TrkB signaling
  (p.Tyr722Cys and p.Arg715Gln). Variants in that table with normal
  BDNF-stimulated signaling in PC12 cells (p.Pro660Leu, p.Thr821Ala,
  p.Pro831Leu) are not used as evidence, although some of them impair
  synapse maturation in cultured neurons.
  Seizures are recorded only for the index patient; the 44-person cohort in
  PMID:39540377 describes the loss-of-function group with developmental delay,
  obesity and hyperphagia and reserves epilepsy for the gain-of-function
  group, so seizure frequency in this disease is not established.

    evidence_source: IN_VITRO
    snippet: "Further functional characterization of the previously reported Y722C TrkB mutation reveals impaired activation of mitogen-activated protein kinase, phospholipase C-gamma and Akt, as well as reduced BDNF-induced neurite outgrowth and cell survival in stably transfected PC12 cell lines."
    explanation: Reduced BDNF-induced neurite outgrowth with the index variant.
  - reference: PMID:32493978
    reference_title: "Human BDNF/TrkB variants impair hippocampal synaptogenesis and associate with neurobehavioural abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multiple variants in the kinase domain and one variant in the extracellular domain of TrkB led to a loss of function through multiple signalling pathways, impaired neurite outgrowth and dominantly inhibited glutamatergic synaptogenesis in hippocampal neurons."
    explanation: Impaired neurite outgrowth and synaptogenesis with further patient TrkB variants.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective neurite growth and synapse formation are proposed to underlie
      the neurodevelopmental phenotype; this has not been tested in patient
      neurons.
  - target: Memory impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired hippocampal synaptogenesis is proposed to contribute to the
      learning and memory deficits.
    evidence:
    - reference: PMID:32493978
      reference_title: "Human BDNF/TrkB variants impair hippocampal synaptogenesis and associate with neurobehavioural abnormalities."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In conclusion, human loss of function BDNF/TrkB variants that impair hippocampal synaptogenesis may contribute to a spectrum of neurobehavioural disorders."
      explanation: The authors propose the synaptogenesis defect as the basis of the neurobehavioural features.

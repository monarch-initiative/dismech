has_subtypes:
- name: Shields Type II
  display_name: Shields type II (moderate)
  description: >-
    The commonest presentation, and the one the Swedish prevalence study
    counted. Both dentitions are opalescent and discoloured, with bulbous
    crowns, marked cervical constriction, short thick roots and progressive
    pulp obliteration. Penetrance is virtually complete and no normal teeth are
    found. Under the genotype-anchored modified Shields classification this
    grade corresponds to 3-prime DSPP defects.
  subtype_term:
    preferred_term: dentinogenesis imperfecta type 2
    term:
      id: MONDO:0007441
      label: dentinogenesis imperfecta type 2
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      penetrance is virtually complete and osteogenesis imperfecta is not a
      feature
    explanation: >-
      Defines the type II grade as fully penetrant and, critically, as not
      carrying the skeletal disease that defines Shields type I.
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Normal teeth are never found in DGI-II.
    explanation: >-
      Records that the dentition is uniformly affected, which is what makes
      partial expression within a mouth a pointer away from this grade.
- name: Shields Type III
  display_name: Shields type III (severe, Brandywine)
  description: >-
    The severe grade, historically described in the Brandywine triracial
    isolate of Maryland. Clinically like type II, but radiographically the
    pulp is enlarged rather than obliterated, giving hollow "shell teeth" from
    dentine hypotrophy, with multiple pulp exposures in the primary dentition.
    Under the genotype-anchored modified Shields classification this grade
    corresponds to 5-prime DSPP defects.
  subtype_term:
    preferred_term: dentinogenesis imperfecta type 3
    term:
      id: MONDO:0007442
      label: dentinogenesis imperfecta type 3
  evidence:
  - reference: PMID:35627243
    reference_title: "The Modified Shields Classification and 12 Families with Defined DSPP Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we propose a modified Shields Classification based upon the causative
      mutation rather than phenotypic severity such that patients identified
      with 5′-DSPP defects be diagnosed as DGI-III, while those with 3′-DSPP
      defects be diagnosed as DGI-II.
    explanation: >-
      States the genotype-anchored reassignment of the two grades, the reason
      this entry records the mutation class alongside each grade.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Vertical transmission through multiple generations with virtually complete
    penetrance; de novo variants are documented but uncommon. Expressivity is
    variable even within one family, and the Shields II and III pictures have
    been reported in members of the same family and even in one patient, which
    is part of the argument for treating them as grades of one entity.
  evidence:

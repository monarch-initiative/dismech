name: Dentinogenesis Imperfecta
creation_date: "2026-11-19T16:24:19Z"
category: Mendelian
synonyms:
- DGI
- DI
- DGI without OI
- dentinogenesis imperfecta without osteogenesis imperfecta
- non-syndromic DGI
- non-syndromic dentinogenesis imperfecta
- opalescent teeth without OI
- opalescent teeth without osteogenesis imperfecta
- dentinogenesis imperfecta type 2
- dentinogenesis imperfecta type 3
- dentinogenesis imperfecta, Shields type II
- dentinogenesis imperfecta, Shields type III
- hereditary opalescent dentin
- Capdepont teeth
- Brandywine type dentinogenesis imperfecta
description: >-
  Dentinogenesis imperfecta (DGI, DI) is an autosomal dominant hereditary
  dentine disorder caused by heterozygous pathogenic variants in DSPP, the gene
  encoding dentin sialophosphoprotein, the most abundant non-collagenous
  protein of dentine. This entry covers the isolated, non-syndromic form - DGI
  without osteogenesis imperfecta. Both dentitions are affected: teeth are
  opalescent and discoloured grey-blue or amber-brown, with bulbous crowns
  constricted at the cervix, short roots and pulp chambers progressively
  obliterated by abnormal dentine. The enamel is itself normal but shears away
  from an altered enamel-dentine junction, exposing soft hypomineralised
  dentine that wears rapidly. The mechanism is not haploinsufficiency but a
  dominant-negative one: mutant DSPP is retained in the rough endoplasmic
  reticulum of the odontoblast and entraps co-expressed wild-type DSPP there,
  so less functional protein reaches the predentine matrix. Two mutation
  classes converge on that step - 5-prime variants that disrupt the signal
  peptide or the first residues of the mature protein, and 3-prime single-base
  indels in the repetitive exon 5 that shift translation into the -1 reading
  frame. Despite DSPP expression in bone, no skeletal defect accompanies
  isolated DSPP-related disease.
notes: >-
  Lump/split. This entry is deliberately a single Disease covering the Shields
  types, with them recorded as has_subtypes severity grades rather than as
  separate entries. MONDO splits them (MONDO:0007441 type 2, MONDO:0007442
  type 3 as children of MONDO:0018849), and the literature argues they are one
  allelic entity: de La Dure-Molla et al. (PMID:25118030) proposed that all
  DSPP diseases be called dentinogenesis imperfecta with Shields DD-II, DGI-II
  and DGI-III as mild, moderate and severe grades, and Simmer et al.
  (PMID:35627243) proposed a genotype-anchored modified Shields classification
  in which 5-prime defects are DGI-III and 3-prime defects DGI-II. Both views
  are currently in use; this entry follows the lumped one and names the
  competing proposals so the split can be reconstructed.

  Dentin dysplasia type II is kept as its own entry at
  kb/disorders/Dentin_Dysplasia_Type_II.yaml, even though it is allelic and the
  2015 proposal would fold it in here as the mild grade. That entry's own notes
  record the reason - MONDO, OMIM and Orphanet all carry DD-II as a separate
  disease - and anticipate this entry being created. The two should be read
  together, and a DSPP-spectrum grouping is the natural place to record the
  continuum.

  Shields DGI type I is out of scope for this term: it is the dentinal
  manifestation of osteogenesis imperfecta, caused by COL1A1/COL1A2, and is
  covered by the existing osteogenesis imperfecta entries.

  A caution about inherited phenotype annotations. Orphanet's ORPHA:49042
  phenotype table and GARD's feature list both carry joint hypermobility, blue
  sclerae, bruising susceptibility, prolonged bleeding time and
  hyperextensibility at the elbow. These are osteogenesis imperfecta and
  connective-tissue features, not features of isolated DSPP-related disease -
  Barron et al. (PMID:19021896) state that no bone defects are seen with DSPP
  mutations despite expression in bone - and they are deliberately not curated
  here. They are not pure annotation error either: the Swedish nationwide study
  found joint hypermobility in 30% of its DGI-II cohort and identified one
  child whose DGI turned out to be undiagnosed osteogenesis imperfecta type IV,
  which is why that study closes by urging that OI be excluded in any child
  with DGI. The overlap is a differential-diagnosis problem rather than a
  phenotype of this disease.

  No GeneReviews chapter exists for this disorder. Checked with
  `just check-genereviews` against the committed Bookshelf index (snapshot
  2026-09-10) with the full synonym list above present; the verdict is
  NO_CHAPTER on both GeneReviews and StatPearls and is a verified negative
  rather than an unproven one. kb/disorders/Dentin_Dysplasia_Type_II.yaml
  records the same absence for its allelic sibling.

      penetrance is virtually complete and osteogenesis imperfecta is not a
      feature
    explanation: >-
      States near-complete penetrance for the isolated form.
prevalence:
- subtype: Shields Type II
  population: Sweden, children and adolescents born 1996-2015
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.2
  rate_low: 1.6
  rate_high: 2.9
  rate_denominator: POPULATION
  notes: >-
    The only population-based, nationwide, registry-ascertained estimate: 44
    affected children against 2,044,530 births, ascertained through every
    specialist paediatric dental clinic in the country. It is roughly seven to
    eighteen times lower than the classic Witkop figure of 1 in 6,000 to 1 in
    8,000, which is 1975 United States data and is the number most sources
    still quote. A clinic-based French series gives 0.057%, biased upward by
    referral. All three are recorded in the literature; this entry carries the
    population-based one and names the others rather than averaging them.
  evidence:
  - reference: PMID:30134932
    reference_title: "Dentinogenesis imperfecta type II in Swedish children and adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of DGI type II was estimated to be 0.0022% (95% CI,
      0.0016-0.0029%) or 1 in 45,455 individuals.
    explanation: >-
      The point estimate and confidence interval this record normalizes to
      2.2 per 100,000.
  - reference: PMID:30134932
    reference_title: "Dentinogenesis imperfecta type II in Swedish children and adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results show a significantly lower prevalence of DGI type II than
      previously reported and point to the importance of excluding OI in
      children with DGI.
    explanation: >-
      The authors' own framing of the figure against the older literature, and
      the source of this entry's caution about osteogenesis imperfecta overlap.
pathophysiology:
- name: Heterozygous DSPP Pathogenic Variant
  description: >-
    A single germline DSPP allele initiates disease. Two mutation classes
    dominate: 5-prime changes affecting the signal peptide, the
    signal-peptidase cleavage site or the IPV motif at the start of the mature
    protein (exons 2-3), and 3-prime single-base indels in the long repetitive
    exon 5 encoding dentin phosphoprotein, which shift translation into the -1
    reading frame. The pattern itself is informative: true nonsense alleles are
    not reported, and heterozygous Dspp knockout mice have little or no dentine
    phenotype, so simple loss of function does not produce the dominant human
    disease.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  molecular_functions:
  - preferred_term: hydroxyapatite binding
    modifier: DECREASED
    term:
      id: GO:0046848
      label: hydroxyapatite binding
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: DSPP
      term:
        id: hgnc:3054
        label: DSPP
    description: >-
      Germline heterozygous DSPP variant acting through a dominant-negative
      mechanism rather than haploinsufficiency.
  evidence:
  - reference: PMID:34667213
    reference_title: "Mouse Dspp frameshift model of human dentinogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The pattern of mutations strongly supports the conclusion that simple
      loss-of-function mutations do not cause dominant dentin malformations in
      humans
    explanation: >-
      States the inference from the human mutation spectrum that rules out
      haploinsufficiency. Taken from the paper's introduction, where it
      restates the human genetic picture rather than this study's mouse result,
      hence quote_role BACKGROUND.
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      loss of a single allele is recessive and that haploinsufficiency does not
      explain DD or DGI
    explanation: >-
      The authors' conclusion from mouse data plus the absence of true nonsense
      alleles in humans, which is why this node is typed DOMINANT_NEGATIVE.
  downstream:
  - target: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Both mutation classes leave a mutant protein that cannot leave the rough
      endoplasmic reticulum of the odontoblast.
- name: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
  description: >-
    Mutant DSPP fails to exit the rough endoplasmic reticulum. For 5-prime
    variants the block is after signal-peptide processing: mutant protein stays
    endoglycosidase H-sensitive and co-localises with an rER marker while
    wild-type reaches Golgi-like puncta. For 3-prime frameshift alleles the
    -1 frame appends a long hydrophobic C-terminal extension that is thought to
    anchor the protein in the rER membrane. Splicing is unaffected.
  role: intermediate
  biological_scale: CELLULAR
  node_class: PROTEIN_TRAFFICKING_AND_LOCALIZATION
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  evidence:
  - reference: PMID:23509818
    reference_title: "A DSPP mutation causing dentinogenesis imperfecta and characterization of the mutational effect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation did not influence pre-mRNA splicing but caused ER retention
      and defective protein secretion.
    explanation: >-
      Localises the defect to protein trafficking rather than splicing, for a
      5-prime exon 2 allele.
  downstream:
  - target: Entrapment of Wild-Type DSPP and Reduced Secretion
    causal_link_type: DIRECT
    description: >-
      Retained mutant protein captures normal DSPP made in the same cell.
- name: Entrapment of Wild-Type DSPP and Reduced Secretion
  description: >-
    The retained mutant protein forms complexes with co-expressed wild-type
    DSPP and holds it in the rough endoplasmic reticulum, so secretion of the
    normal product falls in a dose-dependent way. This is the dominant-negative
    step, and it also explains the severity gradient between grades: a
    frameshift allele that retains more of the acidic repeat domain suppresses
    wild-type secretion more than one that retains none.
  role: intermediate
  biological_scale: CELLULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  evidence:
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Trafficking out of the rER by coexpressed normal DSPP was reduced in a
      dose-responsive manner, probably due to formation of Ca2+-dependent
      complexes with the retained mutant DSPP.
    explanation: >-
      Demonstrates the entrapment of wild-type protein and its dose dependence
      in transfected cells, the core dominant-negative observation.
  downstream:
  - target: Defective Circumpulpal Dentine Mineralisation
    causal_link_type: DIRECT
    description: >-
      Less DSPP reaches predentine, so its cleavage products are not available
      to control mineralisation at the mineralisation front.
- name: Defective Circumpulpal Dentine Mineralisation
  description: >-
    Reduced delivery of DSPP to predentine means less of its proteolytic
    products, dentin sialoprotein and dentin phosphoprotein, at the
    mineralisation front. Mouse models separating the two show that they are
    dispensable for the initiation of mineralisation but required for
    maturation of the circumpulpal dentine, which is the compartment that fails
    here. The resulting dentine is hypomineralised, with few, large and
    irregularly oriented tubules and atubular areas.
  role: intermediate
  biological_scale: TISSUE
  node_class: FUNCTIONAL_DISTURBANCE
  biological_processes:
  - preferred_term: dentin mineralization
    modifier: DECREASED
    term:
      id: GO:0097188
      label: dentin mineralization
  evidence:
  - reference: PMID:40640300
    reference_title: "DSP and DPP are dispensable for initiation of dentin and enamel mineralization but critical for circumpulpal dentin mineralization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that DSP and DPP are dispensable for the initiation of dentin
      and enamel mineralization, but critical for circumpulpal dentin
      mineralization.
    explanation: >-
      Localises the requirement for the DSPP cleavage products to circumpulpal
      dentine maturation rather than to the onset of mineralisation, which is
      what the human phenotype shows.
  downstream:
  - target: Enamel Shearing at the Altered Enamel-Dentine Junction
    causal_link_type: DIRECT
    description: >-
      Soft dentine beneath an altered junction loses its enamel covering and
      then wears.
  - target: Pulp obliteration
    causal_link_type: DIRECT
    description: >-
      Continued pathological dentine apposition into the pulp space progressively
      obliterates the chamber and canals.
  - target: Opalescent discoloured teeth
    causal_link_type: DIRECT
    description: >-
      The abnormal, hypomineralised dentine gives the teeth their opalescent
      grey-blue to amber-brown appearance.
- name: Enamel Shearing at the Altered Enamel-Dentine Junction
  description: >-
    The enamel is intrinsically normal but the enamel-dentine junction is
    altered, so enamel shears away along the striae of Retzius, exposing the
    soft hypomineralised dentine beneath. The exposed dentine often has a hard
    glassy appearance from sclerosis, and patients rarely complain of
    sensitivity despite the exposure. What follows from the exposure -
    attrition - is its own phenotype rather than part of this node.
  role: intermediate
  biological_scale: TISSUE
  node_class: BARRIER_FAILURE
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Enamel is often dislodged because of altered enamel dentin junction.
    explanation: >-
      States that enamel loss is a consequence of the junction rather than of
      an enamel defect, which is why the enamel is not curated as primarily
      abnormal.
  downstream:
  - target: Excessive dental attrition
    causal_link_type: DIRECT
    description: >-
      Exposed soft dentine wears rapidly once its enamel cover is lost.
phenotypes:
- name: Opalescent discoloured teeth
  category: Clinical
  description: >-
    Both dentitions show grey-blue to amber-brown opalescent discolouration,
    present from eruption. Primary teeth are often more severely affected than
    permanent teeth, which inverts the usual expectation and matters for
    counselling and for the timing of definitive restorative work.
  phenotype_term:
    preferred_term: Yellow-brown discoloration of the teeth
    term:
      id: HP:0006286
      label: Yellow-brown discoloration of the teeth
  notes: >-
    HPO has no term for opalescent teeth. HP:0030756 Erythrodontia is specific
    to congenital erythropoietic porphyria and must not be used here, so the
    nearest accurate colour term is bound and the fuller description carries
    the opalescence.
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary teeth are often more severely affected than permanent teeth
    explanation: >-
      The dentition asymmetry, confirmed across the cases this review
      assembled.
- name: Bulbous crowns with cervical constriction
  category: Clinical
  description: >-
    Bulbous crowns constricted at the cervical margin, with short thick roots,
    are the characteristic radiographic appearance alongside pulp obliteration.
  phenotype_term:
    preferred_term: Bulbous crowns with marked cervical constriction
    term:
      id: HP:0033780
      label: Bulbous tooth
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bulbous crowns are a typical feature with marked cervical constriction.
    explanation: >-
      States the crown morphology that, with pulp obliteration and short roots,
      the classification review calls radiographically pathognomonic.
- name: Pulp obliteration
  category: Clinical
  subtype: Shields Type II
  description: >-
    Progressive obliteration of the pulp chamber and root canals by abnormal
    dentine. At the severe, 5-prime end of the spectrum the opposite is seen -
    pulp enlargement and hollow "shell teeth" - which is why the grade and the
    mutation class are recorded together.
  phenotype_term:
    preferred_term: Pulp obliteration
    term:
      id: HP:0006350
      label: Pulp obliteration
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The radiographical aspect is pathognomonic: bulbous crowns because of an
      important cervical constriction, short and thick roots and pulp
      obliteration.
    explanation: >-
      Groups pulp obliteration with the crown and root changes as the
      diagnostic radiographic triad.
- name: Excessive dental attrition
  category: Clinical
  description: >-
    Rapid wear of exposed dentine once enamel has sheared off, ranging from a
    few erosion facets to complete disappearance of the crown, and often
    requiring overdenture management in the primary dentition.
  phenotype_term:
    preferred_term: Excessive dental attrition
    term:
      id: HP:4000181
      label: Excessive dental attrition
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Attrition ranges from few facets of erosion to a complete disappearance
      of the crown.
    explanation: >-
      Describes the range of attrition severity that follows loss of the enamel
      cover.
- name: Short dental roots
  category: Clinical
  description: >-
    Short, constricted roots are part of the radiographic triad with bulbous
    crowns and pulp obliteration. Roots may occasionally be of normal length,
    and in the severe grade may be absent, which is one route to premature
    tooth loss.
  phenotype_term:
    preferred_term: Short dental root
    term:
      id: HP:0006336
      label: Short dental root
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Roots are often short but may be of normal length or absent.
    explanation: >-
      States both the typical root morphology and its variability.
- name: Shell teeth
  category: Clinical
  subtype: Shields Type III
  description: >-
    Hypotrophic dentine leaves hollow "shell teeth" on radiographs, with pulp
    enlargement instead of obliteration and multiple pulp exposures in the
    primary dentition. This is the distinguishing feature of the severe grade
    and is the opposite radiographic finding to the pulp obliteration seen in
    the moderate one.
  phenotype_term:
    preferred_term: Shell teeth
    term:
      id: HP:0000694
      label: Odontodysplasia
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is associated with hypotrophy of dentine and resultant 'shell teeth'
      which are a distinguishing feature
    explanation: >-
      Identifies shell teeth as what distinguishes Shields type III, which is
      why this phenotype is stratified to that subtype.
- name: Periapical radiolucency in non-carious teeth
  category: Clinical
  description: >-
    Numerous periapical radiolucencies occur in teeth that are not carious,
    which is diagnostically important: the periapical pathology follows pulp
    death through worn or fractured dentine rather than decay. Spontaneous
    abscess formation follows.
  phenotype_term:
    preferred_term: Periapical tooth abscess
    term:
      id: HP:0030758
      label: Periapical tooth abscess
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Numerous periapical radiolucencies are often seen in non-carious teeth.
    explanation: >-
      States the finding and the fact that it occurs without caries.
- name: Premature tooth loss
  category: Clinical
  description: >-
    Teeth are lost early through short or absent roots and spontaneous abscess
    formation. Prevention and regular dental care do not avert it, which sets
    the ceiling on what management can achieve.
  phenotype_term:
    preferred_term: Premature loss of teeth
    term:
      id: HP:0006480
      label: Premature loss of teeth
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early diagnosis and regular dental care however cannot prevent premature
      tooth-loss due to short or absent roots and spontaneous abscess formation
      that occurs in some types of DGI and DD
    explanation: >-
      States both the mechanism of tooth loss and that care does not prevent it.
- name: Progressive high-frequency sensorineural hearing loss
  category: Clinical
  description: >-
    Reported in a small number of DSPP families as DFNA39, with onset in the
    high frequencies in the third decade. The association is contested rather
    than established and is curated here as an uncertain pleiotropic feature,
    not a core phenotype.
  frequency: Rare
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
  notes: >-
    Deliberately left with no incoming causal edge. The entry's pathograph runs
    from the DSPP lesion to dentine, and no mechanism connecting that chain to
    the cochlea is established - DSPP transcripts are detectable in mouse inner
    ear, but the cause of the hearing loss is explicitly unresolved, so drawing
    an edge would assert a mechanism nobody has shown.

    Barron et al. treat this as a rare feature and are explicitly sceptical:
    they note the expected deafness type would be conductive, cite the
    suggestion that it may be secondary to attrition, and conclude that the
    cause remains unresolved. Recorded with that caveat rather than as a
    settled extra-dental manifestation.
  evidence:
  - reference: PMID:11175790
    reference_title: "Dentinogenesis imperfecta 1 with or without progressive hearing loss is associated with distinct mutations in DSPP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected individuals of two families also presented with progressive
      sensorineural high-frequency hearing loss
    explanation: >-
      The original description of the hearing phenotype in two of three DSPP
      families, designated DFNA39. The third family, carrying a splice-site
      change, had no hearing loss.
genetic:
- name: DSPP
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DSPP
    term:
      id: hgnc:3054
      label: DSPP
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_39f5492a-97a3-49a6-929d-f24f23b51217-2018-04-17T160000.000Z
    evidence:
    - reference: CGGV:assertion_39f5492a-97a3-49a6-929d-f24f23b51217-2018-04-17T160000.000Z
      reference_title: "DSPP / dentinogenesis imperfecta (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DSPP | HGNC:3054 | dentinogenesis imperfecta | MONDO:0018849 | AD | Definitive"
      explanation: >-
        ClinGen Hearing Loss Gene Curation Expert Panel assertion for this
        gene-disease pair, classified 2018-04-17.
  evidence:
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All of this second class of mutations caused mutant DSPP to be retained
      in the rough endoplasmic reticulum (rER) of transfected HEK293 cells.
    explanation: >-
      Establishes the shared cell-biological consequence of the DSPP mutation
      classes that cause this disease.
  notes: >-
    DSPP lies at 4q22.1 in the SIBLING gene cluster and is cleaved into dentin
    sialoprotein, dentin glycoprotein and dentin phosphoprotein. Its exon 5
    encodes a long, length-polymorphic Asp-Ser-Ser repeat region: Yang et al.
    found human dentin phosphoprotein varying between 770 and 902 amino acids
    across normal haplotypes. That polymorphism is normal variation, not
    disease, but it makes the repeat region hard to sequence and is why
    targeted coverage of it is recommended. The repeat is not an unstable
    expanding repeat, so genetic anticipation does not apply.
diagnosis:
- name: Clinical and radiographic examination of both dentitions
  description: >-
    Diagnosis rests on the combination of opalescent discolouration in both
    dentitions with the radiographic triad of bulbous crowns with cervical
    constriction, short thick roots and pulp obliteration. Osteogenesis
    imperfecta must be excluded before calling the disease isolated: a
    nationwide Swedish series identified a child reported as DGI-II who proved
    to have osteogenesis imperfecta type IV, and assessed joint hypermobility
    and sclerae for that reason. Differential diagnosis also includes
    tetracycline discolouration and rickets.
  evidence:
  - reference: PMID:30134932
    reference_title: "Dentinogenesis imperfecta type II in Swedish children and adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results show a significantly lower prevalence of DGI type II than
      previously reported and point to the importance of excluding OI in
      children with DGI.
    explanation: >-
      States the exclusion of osteogenesis imperfecta as a necessary step in
      diagnosing isolated disease, from the study that found a misdiagnosed
      case.
- name: DSPP sequencing
  description: >-
    Molecular confirmation targets DSPP, with deliberate attention to the
    repetitive exon 5 dentin phosphoprotein region, which standard pipelines
    cover poorly and which carries the 3-prime frameshift alleles. The
    mutation's position is not merely confirmatory: under the modified Shields
    classification the 5-prime versus 3-prime location is what assigns the
    grade.
  evidence:
  - reference: PMID:35627243
    reference_title: "The Modified Shields Classification and 12 Families with Defined DSPP Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we propose a modified Shields Classification based upon the causative
      mutation rather than phenotypic severity such that patients identified
      with 5′-DSPP defects be diagnosed as DGI-III, while those with 3′-DSPP
      defects be diagnosed as DGI-II.
    explanation: >-
      The basis for treating the variant's position in DSPP as diagnostically
      meaningful rather than incidental.
treatments:
- name: Full-coverage restoration and prosthodontic rehabilitation
  description: >-
    Management is restorative and preventive: early diagnosis followed by
    full-coverage protection of affected teeth to arrest attrition, preserve
    occlusal vertical dimension and maintain aesthetics, with overdentures
    often used in the primary dentition. There is no treatment directed at the
    underlying dentine defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: full-coverage dental restoration
    term:
      id: NCIT:C60718
      label: Dental Restoration
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the primary dentition, stainless steel crowns on the molars may be
      used to prevent tooth wear and maintain the occlusal vertical dimension.
    explanation: >-
      Names the restoration itself and what it is for - arresting wear and
      holding the occlusal vertical dimension - which is what this row claims.
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cast occlusal onlays on the first permanent molars and eventually the
      premolars, help to minimise tooth wear and maintain the occlusal vertical
      dimension
    explanation: >-
      The permanent-dentition counterpart, which is why this row spans both
      dentitions rather than only the primary one.
  target_mechanisms:
  - target: Enamel Shearing at the Altered Enamel-Dentine Junction
    treatment_effect: BYPASSES
    description: >-
      Full coverage substitutes an artificial surface for the failing
      enamel-dentine junction, protecting the soft dentine beneath rather than
      correcting it.
- name: Preventive dental care
  description: >-
    Oral hygiene instruction, dietary advice and appropriate fluoride use, with
    regular review, form the preventive arm. The German S3-level guideline for
    rare dental disorders, which covers dentinogenesis imperfecta by name,
    places preventive care alongside restorative and prosthetic treatment in an
    age-related, long-term plan. Its limit should be stated with it: prevention
    does not avert the tooth loss driven by short or absent roots and
    spontaneous abscess formation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventive dental care
    term:
      id: NCIT:C62548
      label: Dental Prophylaxis
  evidence:
  - reference: DOI:10.1007/s00784-026-07142-w
    reference_title: "The German S3-level guideline for the diagnosis and management of rare dental disorders"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A total of 41 evidence- and consensus-based recommendations covering
      interdisciplinary collaboration, diagnostics, preventive care,
      restorative and prosthetic treatment, and orthodontic and surgical
      interventions were developed.
    explanation: >-
      The guideline's own summary of what its recommendations cover, which is
      the basis for separating preventive care from restorative treatment
      rather than carrying one generic row.
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prevention of tooth decay in the form of oral hygiene instruction,
      dietary advice and appropriate use of fluoride is essential. Early
      diagnosis and regular dental care however cannot prevent premature
      tooth-loss due to short or absent roots and spontaneous abscess formation
      that occurs in some types of DGI and DD
    explanation: >-
      Names the preventive measures this row describes and, in the same
      breath, their limit - prevention does not stop the tooth loss driven by
      root and periapical pathology.
- name: Overdentures and implant-retained prosthetics for late or advanced presentation
  description: >-
    Where a child presents late and the teeth have already worn to the level of
    the gingivae, overdentures are the remaining option; children adapt well
    but the dentures must be remade as they grow. Dental implants are
    considered once growth is complete at about 18 years, and ridge
    augmentation is often needed first because early tooth loss leaves
    maxillo-mandibular atrophy. This row is the counterpart of the restorative
    one: it is what is left when protection came too late.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: dental prosthesis
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If, however the child presents late, the teeth may have undergone
      attrition to the level of the gingivae and the only treatment option then
      is to provide over-dentures
    explanation: >-
      States when overdentures become the only option, which is what makes
      this a late-presentation row rather than an alternative to restoration.
  - reference: PMID:19021896
    reference_title: "Hereditary dentine disorders: dentinogenesis imperfecta and dentine dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dental implants may be considered when growth is complete at about 18
      years of age.
    explanation: >-
      Sets the age constraint on implants, which is why they are a later stage
      rather than an early option.
  target_mechanisms:
  - target: Premature tooth loss
    treatment_effect: BYPASSES
    description: >-
      Prosthetic replacement substitutes for teeth already lost rather than
      preventing further loss.
animal_models:
- name: Dspp P19L knock-in mouse (5-prime mutation class)
  species: Mouse
  genotype: Dspp p.Pro19Leu knock-in
  publication: PMID:34667213
  genes:
  - preferred_term: Dspp
    term:
      id: MGI:109172
      label: Dspp
  description: >-
    The mouse equivalent of the human 5-prime allele p.Pro17Leu, which is the
    class that disrupts the signal peptide region. It is the in vivo
    counterpart of the endoplasmic reticulum retention shown in transfected
    cells.
  modeled_mechanisms:
  - target: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Secretion of the mutant protein is impaired and it accumulates within the
      endoplasmic reticulum, reproducing the trafficking defect in a whole
      animal rather than a transfected cell line.
    limitations: >-
      Mouse incisors grow continuously and human teeth do not, so the dentine
      apposition dynamics differ and the model cannot reproduce the
      eruption-to-attrition sequence that defines the human clinical course.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The continuously erupting murine incisor has no human counterpart, so
        the timing of dentine deposition relative to tooth maturity cannot be
        compared directly.
  - target: Defective Circumpulpal Dentine Mineralisation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Dentine is softer and less mineralised than wild type while still
      containing tubules, which matches the hypomineralised but tubular
      dentine of the milder human grades.
    readouts:
    - name: Dentine nanohardness and mineralisation
      target: Defective Circumpulpal Dentine Mineralisation
      direction: DECREASED
      interpretation: >-
        Quantifies the mineralisation deficit in the 5-prime mutation class.
      evidence:
      - reference: PMID:34667213
        reference_title: "Mouse Dspp frameshift model of human dentinogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          DsppP19L dentin contained dentinal tubules but grew slowly and was
          softer and less mineralized than the wild-type.
        explanation: >-
          The measured dentine phenotype of the 5-prime allele.
  evidence:
  - reference: PMID:34667213
    reference_title: "Mouse Dspp frameshift model of human dentinogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DsppP19L incisor enamel was softer than normal, while molar enamel showed
      reduced rod/interrod definition.
    explanation: >-
      Records the mutation-class-specific enamel effect, which the 3-prime
      model does not show - evidence that the two classes are not
      interchangeable.
- name: Dspp -1fs knock-in mouse (3-prime mutation class)
  species: Mouse
  genotype: Dspp single-nucleotide deletion shifting translation into the -1 reading frame
  publication: PMID:34667213
  genes:
  - preferred_term: Dspp
    term:
      id: MGI:109172
      label: Dspp
  description: >-
    A CRISPR/Cas9 model of the 3-prime exon 5 frameshift class, appending 493
    extraneous residues. It is the counterpart of the human alleles that cause
    the moderate grade, and it produces a more severe dentine phenotype than
    the 5-prime model.
  modeled_mechanisms:
  - target: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Immunostaining localises the frameshifted protein inside the cell rather
      than in the dentinal tubules where wild-type DSPP is found.
    readouts:
    - name: Intracellular retention of frameshifted DSPP
      target: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
      direction: INCREASED
      interpretation: >-
        Localisation evidence that the 3-prime product does not leave the cell.
      evidence:
      - reference: PMID:34667213
        reference_title: "Mouse Dspp frameshift model of human dentinogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These findings are consistent with the interpretation that virtually
          all the frameshifted DSPP protein is retained in the cells
        explanation: >-
          The authors' reading of their own localisation data.
  - target: Defective Circumpulpal Dentine Mineralisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Dentine formation resembles reparative dentine and lacks tubules
      altogether, which is more severe than the tubular but hypomineralised
      dentine of the 5-prime model.
    limitations: >-
      The atubular, reparative-like dentine is at the severe end of what human
      histology shows, where few large irregular tubules with atubular areas is
      the usual description, so the model overstates the human tubular loss.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Human dentine retains some tubules; the model's complete absence of
        them is a more extreme state than the tissue it stands for.
- name: Dspp-null mouse
  species: Mouse
  genotype: Dspp knockout, homozygous null
  publication: PMID:40640300
  genes:
  - preferred_term: Dspp
    term:
      id: MGI:109172
      label: Dspp
  description: >-
    The null allele, used with a DPP-only allele to separate which of the DSPP
    cleavage products is required for which step of mineralisation. It is the
    model that localises the requirement to circumpulpal dentine rather than to
    the onset of mineralisation.
  modeled_mechanisms:
  - target: Defective Circumpulpal Dentine Mineralisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Separating DSP from DPP shows that neither is needed to start
      mineralisation but both are needed for the circumpulpal compartment.
    limitations: >-
      A true null is not the human genotype. Human disease is caused by
      heterozygous dominant-negative alleles, and heterozygous Dspp knockout
      mice have little or no dentine phenotype, so this model informs DSPP
      function rather than the mechanism of the human dominant disease.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The dominant-negative entrapment of wild-type protein, which is the
        human mechanism, cannot occur in a homozygous null animal because
        there is no wild-type product to entrap.
  evidence:
  - reference: PMID:40640300
    reference_title: "DSP and DPP are dispensable for initiation of dentin and enamel mineralization but critical for circumpulpal dentin mineralization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that DSP and DPP are dispensable for the initiation of dentin
      and enamel mineralization, but critical for circumpulpal dentin
      mineralization.
    explanation: >-
      The conclusion that localises the requirement to the compartment that
      fails in human disease.

epidemiology:
- name: Bacterial etiologic share
  description: Bacterial enteropathogens account for most episodes, but the responsible species and pathotypes vary by destination and diagnostic method.
  minimum_value: 75
  maximum_value: 90
  unit: percent of cases
  evidence:
  - reference: PMID:41818528
    reference_title: Travelers’ Diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Bacteria are the predominant enteropathogens and are thought to account for ≥75%–90% of cases.
    explanation: Provides the current estimated bacterial share of the syndrome.
- name: Viral etiologic share
  description: Intestinal viruses are a substantial and likely underdetected component, particularly when molecular assays are used.
  minimum_value: 10
  maximum_value: 25
  unit: percent of illnesses
  evidence:
  - reference: PMID:41818528
    reference_title: Travelers’ Diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Intestinal viruses account for at least 10%–25% of illnesses and are more commonly associated with vomiting.
    explanation: Provides the estimated viral share and its association with vomiting.
- name: Protozoal etiologic share in longer-term travelers
  description: Protozoal pathogens contribute a minority of diagnoses and tend to present later, especially in longer-term travelers.
  minimum_value: 10
  maximum_value: 10
  unit: approximate percent of diagnoses
  evidence:
  - reference: PMID:41818528
    reference_title: Travelers’ Diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Infections with protozoal pathogens are slower to manifest symptoms and collectively account for approximately 10% of diagnoses, predominantly in longer-term travelers (see Post-Travel Diarrhea).
    explanation: Quantifies and temporally contextualizes the protozoal contribution.
progression:
- phase: Toxin-mediated foodborne illness
  incubation_days: Within a few hours
  duration: 12-24 hours
  notes: This rapid-onset phase applies to toxin-mediated illness and not to every cause of traveler's diarrhea.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620898/
    reference_title: Travelers' Diarrhea - CDC Yellow Book, 2026 edition
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Toxin-mediated illness, for example, generally causes symptoms within a few hours.
    explanation: Establishes the characteristic rapid onset of toxin-mediated illness.
  - reference: PMID:41818528
    reference_title: Travelers’ Diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In toxin-mediated illness, both vomiting and diarrhea can be present; symptoms usually resolve spontaneously within 12–24 hours.
    explanation: Provides the typical short duration of toxin-mediated illness.
- phase: Acute bacterial traveler's diarrhea
  incubation_days: 0.25-4 (6-96 hours)
  duration_days: 3-7
  notes: These intervals are bacterial-pathogen conditioned and should not be applied to protozoal disease.
  evidence:
  - reference: url:https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html
    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: By contrast, illnesses caused by bacterial and viral pathogens have incubation periods of 6&ndash;96 hours.
    explanation: Provides the bacterial and viral incubation interval.
  - reference: url:https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html
    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Untreated, bacterial diarrhea usually lasts 3&ndash;7 days.
    explanation: Provides the usual untreated bacterial duration.
- phase: Acute viral traveler's diarrhea
  incubation_days: 0.25-4 (6-96 hours)
  duration_days: 2-3
  notes: These intervals are viral-pathogen conditioned and should not be applied to protozoal disease.
  evidence:
  - reference: url:https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html
    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: By contrast, illnesses caused by bacterial and viral pathogens have incubation periods of 6&ndash;96 hours.
    explanation: Provides the bacterial and viral incubation interval.
  - reference: url:https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html
    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Viral diarrhea generally lasts 2&ndash;3 days.
    explanation: Provides the usual viral duration.
- phase: Protozoal traveler's diarrhea
  incubation_days: 7-14
  duration: Weeks to months without treatment
  notes: Protozoal disease often presents later than bacterial or viral disease and can be persistent.
  evidence:
  - reference: url:https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html
    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In general, illnesses due to protozoal pathogens have longer incubation periods (1&ndash;2 weeks), rarely presenting in the first few days of travel.
    explanation: Provides the longer incubation interval for protozoal disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620898/
    reference_title: Travelers' Diarrhea - CDC Yellow Book, 2026 edition
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Protozoal diarrhea can persist for weeks to months without treatment.
    explanation: Provides the potential untreated duration of protozoal disease.
- phase: Post-infectious irritable bowel syndrome
  duration: Mean 15 months in a retrospective referral-center cohort
  notes: This persistent phase affects a subset after the acute infection and should not be treated as the usual course.
  evidence:
  - reference: PMID:36881659
    reference_title: "Post-infectious irritable bowel syndrome following a diagnosis of traveller's diarrhoea: a comprehensive characterization of clinical and laboratory parameters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The symptoms persisted for a mean of 15 months after diagnosis and treatment of TD.
    explanation: Provides observed duration for persistent PI-IBS symptoms in a selected clinical cohort.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Most illness is self-limited, but functional impact is material in a subset,
    with interrupted activities and occasional hospitalization; dehydration,
    dysentery, and persistent PI-IBS add further burden in selected cases.
  evidence:
  - reference: PMID:28719282
    reference_title: "Travelers' Diarrhea and Other Gastrointestinal Symptoms Among Boston-Area International Travelers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 172 with TD during travel, 24% stopped planned activities, and 2% were hospitalized.
    explanation: Quantifies functional disruption and occasional hospitalization in a prospective traveler cohort.
pathophysiology:
- name: ETEC colonization-factor adhesion to small-intestinal enterocytes
  description: >-
    In the ETEC subset of traveler's diarrhea, bacterial colonization factors
    bind receptors on small-intestinal enterocytes and establish close epithelial
    colonization, positioning toxin-producing organisms at the mucosal surface.
  role: initiating mechanism
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  biological_processes:
  - preferred_term: adhesion of symbiont to host cell
    term:
      id: GO:0044650
      label: adhesion of symbiont to host cell
  downstream:
  - target: Heat-stable enterotoxin activation of epithelial GUCY2C
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Colonization places ST-producing ETEC at the epithelial surface; toxin production and release are omitted intermediates.
  - target: Heat-labile enterotoxin activation of epithelial G protein-adenylyl cyclase
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Colonization places LT-producing ETEC at the epithelial surface; toxin production, release, and uptake are omitted intermediates.
  evidence:
  - reference: PMID:35358002
    reference_title: "Enterotoxigenic Escherichia coli: intestinal pathogenesis mechanisms and colonization resistance by gut microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ETEC is characterized by the ability to produce major virulence factors
      including colonization factors (CFs) and enterotoxins, that bind to specific
      receptors on epithelial cells and induce diarrhea.
    explanation: Supports receptor-binding colonization factors as part of ETEC epithelial pathogenesis.
- name: Heat-stable enterotoxin activation of epithelial GUCY2C
  description: >-
    ETEC heat-stable enterotoxin binds guanylyl cyclase C (GUCY2C) on intestinal
    epithelium and increases the receptor's guanylate-cyclase activity.
  role: molecular mechanism
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  molecular_functions:
  - preferred_term: guanylate cyclase activity
    modifier: INCREASED
    term:
      id: GO:0004383
      label: guanylate cyclase activity
  genes:
  - preferred_term: GUCY2C
    term:
      id: hgnc:4688
      label: GUCY2C
  downstream:
  - target: GUCY2C-dependent cGMP production
    causal_link_type: DIRECT
    description: Ligand-activated GUCY2C catalyzes formation of cGMP.
  evidence:
  - reference: PMID:11952098
    reference_title: Structure and function of the heat-stable enterotoxin receptor/guanylyl cyclase C.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Guanylyl cyclase C (GC-C) was found to function as the principal receptor
      for heat-stable enterotoxins (STa), major causative factors in E. coli-induced
      secretory diarrhea.
    explanation: Identifies GUCY2C as the principal epithelial receptor for E. coli heat-stable enterotoxin.
- name: Heat-labile enterotoxin activation of epithelial G protein-adenylyl cyclase
  description: >-
    ETEC heat-labile enterotoxin binds an intestinal epithelial receptor and
    delivers an enzymatic subunit that modifies the G protein coupled to
    adenylyl cyclase, increasing cyclase activity.
  role: molecular mechanism
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  molecular_functions:
  - preferred_term: adenylate cyclase activity
    modifier: INCREASED
    term:
      id: GO:0004016
      label: adenylate cyclase activity
  downstream:
  - target: Adenylyl-cyclase-dependent cAMP production
    causal_link_type: DIRECT
    description: Toxin-mediated G-protein modification stimulates adenylyl cyclase and cAMP production.
  evidence:
  - reference: PMID:1480112
    reference_title: Structure and function of cholera toxin and the related Escherichia coli heat-labile enterotoxin.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both toxins bind receptors in intestinal epithelial cells and insert an
      enzymatic subunit that modifies a G protein associated with the adenylate
      cyclase complex.
    explanation: Directly supports the receptor-to-G-protein/adenylyl-cyclase step for E. coli heat-labile toxin.
- name: GUCY2C-dependent cGMP production
  description: Activated epithelial GUCY2C increases intracellular cGMP, initiating the secretory signaling branch.
  role: molecular mechanism
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: small intestine

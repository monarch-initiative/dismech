  description: >-
    Mucosa-associated invariant T (MAIT) cells recognize conserved microbial
    antigens presented by MR1 and contribute to barrier immunity. This human
    controlled ETEC challenge dataset profiles blood responses, with activation
    and proliferation most evident among participants who developed mild to
    severe diarrhea.

  description: >-
    Mild traveler's diarrhea is managed with hydration and symptom-directed
    care; routine antibiotics are not recommended when illness is tolerable and
    does not interfere with planned activities.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31084597
    reference_title: "Travelers' Diarrhea: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For mild travelers' diarrhea, the use of antibiotic is not recommended.
    explanation: Directly supports antibiotic stewardship for mild illness.

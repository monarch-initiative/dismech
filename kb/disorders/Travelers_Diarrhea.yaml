infectious_agent:
- name: Enterotoxigenic Escherichia coli
  description: >-
    ETEC is an important diarrheagenic E. coli pathotype. NCBITaxon:562
    represents the species rather than the narrower enterotoxigenic pathotype,
    which is retained in this free-text name.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:35247581
    reference_title: "Bacterial travellers' diarrhoea: A narrative review of literature published over the past 10 years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diarrhoeagenic Escherichia coli (DEC) continue to be the most commonly
      implicated bacteria in TD, although Enteropathogenic E. coli (EPEC) and
      Enteroaggregative E. coli (EAEC) now appear to be predominant where
      Enterotoxigenic E. coli (ETEC) was previously considered most prevalent
      globally.
    explanation: >-
      Supports ETEC as an important cause while showing why it should not be
      represented as the universally predominant pathogen.

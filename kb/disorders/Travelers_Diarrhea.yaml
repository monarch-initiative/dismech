    supports: SUPPORT
    evidence_source: OTHER
    snippet: Prevention of TD with antibiotics has been recommended only under special circumstances.
    explanation: Supports reserving prophylaxis for exceptional circumstances rather than routine use.
  - reference: PMID:25613287
    reference_title: "Antimicrobials increase travelers' risk of colonization by extended-spectrum betalactamase-producing Enterobacteriaceae."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eleven percent of those in subgroup TD-AB-, 21% in TD+AB-, and 37% in TD+AB+ acquired ESBL-PE. The risk proved to be highest in South Asia (46%); 23% became colonized in subgroup TD-AB-, 47% in TD+AB-, and 80% in TD+AB+.

discussions:
- discussion_id: gap_td_pathogen_and_resistance_stratification
  prompt: >-
    How should rapid pathogen identification and destination-specific
    antimicrobial-resistance surveillance be combined to select self-treatment
    or clinician-directed therapy for heterogeneous traveler's diarrhea?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Molecular testing increasingly detects viral disease and mixed infections,
    bacterial rankings differ by method and geography, and susceptibility to
    fluoroquinolones and macrolides varies markedly across destinations. A
    universal ETEC-centered or single-antibiotic treatment rule is therefore
    not supported.
  evidence:
  - reference: PMID:41591385
    reference_title: "GeoSentinel Analysis of Travelers' Diarrhea Antimicrobial Resistance Patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cross-sectional study of travelers' diarrhea antimicrobial
      resistance patterns, there was marked variability of nonsusceptibility to
      2 major classes of antibiotics commonly used for treating travelers'
      diarrhea among global regions.
    explanation: Directly establishes regional variation in susceptibility to the major empiric antibiotic classes.
  - reference: PMID:40699254
    reference_title: "Travellers' diarrhoea - solidifying our knowledgebase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Viral travellers' diarrhoea is more frequently recognised due to the improved sensitivity of molecular diagnostics.
    explanation: Supports the diagnostic-method dependence of observed etiology.
- discussion_id: gap_td_postinfectious_ibs_mechanism
  prompt: >-
    Which pathogen-specific, microbiome, epithelial, and host-response mechanisms
    determine who develops persistent postinfectious irritable bowel syndrome
    after traveler's diarrhea?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Post-infectious irritable bowel syndrome
  rationale: >-
    PI-IBS is a clinically documented sequela, but the available cohort evidence
    identifies associations rather than a causal mechanism that can honestly be
    joined to the acute ETEC secretory graph.
  evidence:
  - reference: PMID:36881659
    reference_title: "Post-infectious irritable bowel syndrome following a diagnosis of traveller's diarrhoea: a comprehensive characterization of clinical and laboratory parameters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Parasitic infections, mainly giardiasis, seem to be associated with PI-IBS.
    explanation: Identifies a pathogen-class association without resolving the downstream mechanism.
  - reference: PMID:40699254
    reference_title: "Travellers' diarrhoea - solidifying our knowledgebase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Better pathophysiological understanding and new intervention strategies are required to help alleviate the suffering of post-travellers' diarrhoea IBS.
    explanation: Explicitly identifies the unresolved post-travel PI-IBS pathophysiology as a research priority.
- discussion_id: hypothesis_td_enteral_magnesium_casr_translation
  prompt: >-
    Can enteral magnesium activation of epithelial CaSR safely reduce
    cyclic-nucleotide-mediated secretion in human ETEC traveler's diarrhea?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#CFTR-mediated epithelial chloride secretion
  - pathophysiology#Net intestinal electrolyte and water secretion
  rationale: >-
    Magnesium suppressed heat-stable-enterotoxin-induced chloride secretion in
    human T84 cells and reduced toxin-driven fluid accumulation in mouse models,
    but this remains preclinical evidence from epithelial and animal systems.
    It is not an established treatment for traveler's diarrhea, and human dose,
    safety, efficacy, and the risk of osmotic diarrhea remain unresolved.
  evidence:
  - reference: DOI:10.1172/jci171249
    reference_title: Mg2+ supplementation treats secretory diarrhea in mice by activating calcium-sensing receptor in intestinal epithelial cells
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mg2+ (10 mM) also suppressed Cl- secretion induced by cholera toxin, heat-stable E. coli enterotoxin, and vasoactive intestinal peptide by 50%.
    explanation: Provides direct preclinical evidence that magnesium suppresses heat-stable-enterotoxin-induced secretion in an epithelial model.
  - reference: DOI:10.1172/jci171249
    reference_title: Mg2+ supplementation treats secretory diarrhea in mice by activating calcium-sensing receptor in intestinal epithelial cells
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In mouse intestinal closed loops, luminal Mg2+ treatment (20 mM) inhibited cholera toxin–induced fluid accumulation by 40%.
    explanation: Provides complementary in vivo mouse evidence for reduced toxin-driven intestinal fluid accumulation.
review_notes: >-
  MONDO has no configured exact term for traveler's diarrhea, so the disease is
  represented formally as a skos:closeMatch to MONDO:0001673 (diarrheal disease),
  with the travel context retained explicitly rather than implying an exact
  identity. The infectious-agent list represents well-supported etiologic
  breadth, whereas the causal pathograph deliberately models exemplar ETEC
  secretory, Shigella invasive-inflammatory, and persistent protozoal branches;
  none should be generalized to every bacterial, viral, or protozoal cause.
  Recent molecular surveillance does not support describing ETEC as universally
  the most common cause. Campylobacter and Giardia are etiologies, not
  differential diagnoses. GeneReviews review is not applicable to this acquired,
  etiologically heterogeneous infectious syndrome; host GUCY2C, CFTR, and
  SLC9A3 annotations are mechanistic targets, not germline causal claims. The
  retained GEO dataset is a direct human ETEC challenge study; the removed aEPEC
  cell-line dataset was a pathogen-relative model without direct
  traveler's-diarrhea relevance. Probiotic prophylaxis is not represented as a
  standard, and antibiotic prophylaxis is explicitly limited to rare special
  circumstances because routine use is discouraged.
  Organism-directed persistent-protozoal treatment is structured here for
  Giardia because it is the main parasitic cause of traveler's diarrhea; this
  does not imply that the Giardia regimen applies to amebiasis,
  cryptosporidiosis, or cyclosporiasis, whose distinct regimens are not modeled
  without corresponding organism-specific pathograph branches.

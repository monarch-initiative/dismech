    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For almost all travelers, though, the risks associated with the use of prophylactic antibiotics, including side effects, <em>Clostridioides difficile</em> infection, and increased risk of carriage of antimicrobial-resistant bacteria, outweigh the potential benefits. Prophylactic antibiotics might rarely be considered for short-term travelers who are high-risk hosts (e.g., immunocompromised people or people who have significant medical comorbidities).
    explanation: Directly supports the adverse-effect, C. difficile, resistant-carriage, and rare high-risk-host qualifications.

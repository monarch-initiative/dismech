  evidence:
  - reference: PMID:21413292
    reference_title: Shigella.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The resulting colitis and ulceration of the mucosa result in bloody,
      mucoid stools, and/or febrile diarrhea.
    explanation: Directly connects colitis and mucosal ulceration to bloody stool.
- name: Protozoal infection associated with persistent traveler's diarrhea
  description: >-
    Intestinal protozoa are a pathogen-conditioned cause of protracted diarrhea
    during or after travel. This syndrome-level node does not assign one
    parasite-specific epithelial mechanism to Giardia, Cryptosporidium,
    Cyclospora, and other protozoa.
  role: pathogen-specific initiating mechanism
  downstream:
  - target: Persistent diarrhea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Parasite-specific epithelial and host-response mechanisms are omitted because they differ across protozoal causes.
  evidence:
  - reference: PMID:11389503
    reference_title: Traveler's diarrhea due to intestinal protozoa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Intestinal protozoa account for a minority of cases of acute traveler's diarrhea, but they are common pathogens in travelers who experience protracted diarrhea during or after travel.
    explanation: Directly establishes protozoal infection as a cause of protracted travel-associated diarrhea.
- name: DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)
  description: >-
    Susceptible bacterial causes of traveler's diarrhea depend on DNA gyrase and
    topoisomerase IV; fluoroquinolones trap their DNA-enzyme complexes and block
    bacterial DNA replication. This is a therapeutic vulnerability rather than
    a syndrome-wide causal mechanism.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_dna_topoisomerase_inhibition#DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)"
  biological_processes:
  - preferred_term: DNA Topological Change
    term:
      id: GO:0006265
      label: DNA topological change
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Quinolones dually target DNA gyrase and topoisomerase IV binding to specific domains and conformations so as to block DNA strand passage catalysis and stabilize DNA-enzyme complexes that block the DNA replication apparatus and generate double breaks in DNA that underlie their bactericidal activity.
    explanation: Defines the bacterial topoisomerase target and bactericidal mechanism of fluoroquinolones.
- name: Bacterial mRNA Translation by the Ribosome
  description: >-
    Bacterial ribosomal translation is the conserved molecular target of
    macrolides such as azithromycin. This node represents an antibiotic
    vulnerability of susceptible bacterial etiologies, not a mechanism of viral
    or protozoal disease.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: Establishes the bacterial ribosome as a central antibiotic target.
- name: Bacterial RNA Polymerase (Rifamycin Target)
  description: >-
    Bacterial DNA-dependent RNA polymerase is the molecular target of rifamycins,
    including the nonabsorbed derivative rifaximin used for selected noninvasive
    E. coli disease.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)"
  biological_processes:
  - preferred_term: DNA-templated transcription
    term:
      id: GO:0006351
      label: DNA-templated transcription
  evidence:
  - reference: PMID:32342856
    reference_title: Inhibition of RNA Polymerase by Rifampicin and Rifamycin-Like Molecules.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The most clinically important and extensively studied class of antibiotics known to inhibit bacterial RNAP are the rifamycins.
    explanation: Directly establishes bacterial RNA polymerase as the rifamycin target.

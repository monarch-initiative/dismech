name: Traveler's Diarrhea
creation_date: '2025-12-19T01:18:09Z'
description: >-
  Traveler's diarrhea is an acute infectious gastrointestinal syndrome acquired
  during or soon after travel, usually through ingestion of food or water
  contaminated with fecal pathogens. It is etiologically heterogeneous:
  diarrheagenic Escherichia coli pathotypes, Campylobacter, Shigella,
  Salmonella, norovirus, and protozoa contribute in proportions that vary by
  destination and diagnostic method. Most illness is self-limited diarrhea,
  but fever, bloody diarrhea, dehydration, and persistent postinfectious
  symptoms can occur. The mechanistic graph below uses enterotoxigenic E. coli
  (ETEC) as a well-supported exemplar of noninvasive secretory disease rather
  than as a mechanism shared by every cause of the syndrome.
category: Infectious Disease

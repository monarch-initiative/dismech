- name: Norovirus
  infectious_agent_term:
    preferred_term: Norovirus
    term:
      id: NCBITaxon:142786
      label: Norovirus
  evidence:
  - reference: PMID:39530798
    reference_title: "Etiology and Epidemiology of Travelers' Diarrhea among US Military and Adult Travelers, 2018-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Harmonized laboratory methods conducted at each partner institution
      identified >1 pathogens, including Escherichia coli (67%-82%), norovirus
      (4%-29%), and Campylobacter jejuni (2%-20%), in 403 (79%) cases.
    explanation: Multisite molecular surveillance directly detected norovirus in travelers with acute gastrointestinal illness.

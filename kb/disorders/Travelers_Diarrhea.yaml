    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Strong evidence supports the effectiveness of antimicrobial therapy in
      most cases of moderate to severe travelers' diarrhea, while either
      increasing intake of fluids only or loperamide or bismuth subsalicylate

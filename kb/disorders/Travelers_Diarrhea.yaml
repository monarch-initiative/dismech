- name: Avoid routine antibiotic prophylaxis
  description: >-
    Prophylactic antibiotics are not recommended for most travelers because
    adverse effects, C. difficile infection, microbiome disruption, and
    acquisition or carriage of antimicrobial-resistant bacteria generally
    outweigh benefit. They may be considered rarely for short-term travelers
    who are high-risk hosts.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620898/
    reference_title: Travelers' Diarrhea - CDC Yellow Book, 2026 edition

      label: small intestine
  downstream:
  - target: Acute watery diarrhea
    causal_link_type: DIRECT
    description: Excess luminal fluid is passed as loose, watery stool.
  - target: Dehydration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - stool fluid loss exceeding oral replacement
    - systemic volume depletion
    description: Sustained gastrointestinal water and electrolyte loss that exceeds replacement can deplete systemic volume and cause dehydration.
  evidence:
  - reference: PMID:1480112
    reference_title: Structure and function of cholera toxin and the related Escherichia coli heat-labile enterotoxin.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The consequent stimulated production of cyclic AMP, or other factors such
      as increased synthesis of prostaglandins by intoxicated cells, initiates a
      metabolic cascade that results in the excessive secretion of fluid and
      electrolytes characteristic of the disease.
    explanation: Supports the final secretory output of the ETEC heat-labile-toxin branch.
- name: Shigella invasion of the colonic epithelium
  description: >-
    In the Shigella subset of traveler's diarrhea, organisms invade the colonic
    epithelium and deliver type III secretion-system effectors into host cells.
    This branch is pathogen-conditioned and is separate from the ETEC
    enterotoxin mechanism.
  role: pathogen-specific initiating mechanism
  cell_types:
  - preferred_term: colonocyte
    term:
      id: CL:1000347
      label: colonocyte
  locations:
  - preferred_term: colonic epithelium
    term:
      id: UBERON:0000397
      label: colonic epithelium
  downstream:
  - target: Cytokine-mediated colonic inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - type III secretion-system effector delivery
    - epithelial innate immune signaling
    description: Invasion and injected bacterial effectors activate epithelial and innate immune signaling that elicits intense colonic inflammation.
  evidence:
  - reference: PMID:23318141
    reference_title: Tips and tricks about Shigella invasion of epithelial cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Shigella, the causative agent of bacillary dysentery, invades the colonic
      epithelium where it elicits an intense inflammation leading to tissular
      destruction.
    explanation: Supports Shigella invasion as the initiating event upstream of intense inflammation and tissue destruction.
- name: Cytokine-mediated colonic inflammation
  description: >-
    In Shigella-associated disease, epithelial invasion triggers a
    cytokine-mediated inflammatory response in the colon. This inflammation is
    separated from the downstream epithelial necrosis and ulceration that it
    promotes.
  role: inflammatory mechanism
  locations:
  - preferred_term: colonic mucosa
    term:
      id: UBERON:0000317
      label: colonic mucosa
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Colonic epithelial necrosis and mucosal ulceration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - neutrophil and cytokine effector injury
    description: The intense inflammatory response causes epithelial necrosis, colitis, and mucosal ulceration through immune effector injury.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - systemic pyrogenic cytokine signaling
    description: The inflammatory response can produce febrile diarrhea through systemic cytokine signaling.
  evidence:
  - reference: PMID:21413292
    reference_title: Shigella.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenic mechanism of shigellosis is complex, involving a possible
      enterotoxic and/or cytotoxic diarrheal prodrome, cytokine-mediated
      inflammation of the colon, and necrosis of the colonic epithelium.
    explanation: Supports cytokine-mediated colonic inflammation upstream of epithelial necrosis.
- name: Colonic epithelial necrosis and mucosal ulceration
  description: >-
    In severe Shigella-associated colitis, inflammatory and cytotoxic injury
    produces necrosis of the colonic epithelium and ulceration of the mucosa.
  role: tissue consequence
  cell_types:
  - preferred_term: colonocyte
    term:
      id: CL:1000347
      label: colonocyte
  locations:
  - preferred_term: colonic mucosa
    term:
      id: UBERON:0000317
      label: colonic mucosa
  downstream:
  - target: Bloody diarrhea
    causal_link_type: DIRECT

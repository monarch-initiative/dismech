    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cross-sectional study of travelers' diarrhea antimicrobial
      resistance patterns, there was marked variability of nonsusceptibility to
      2 major classes of antibiotics commonly used for treating travelers'
      diarrhea among global regions.
    explanation: Supports conditioning empiric macrolide selection on destination-specific resistance patterns.
  - reference: PMID:41591385
    reference_title: "GeoSentinel Analysis of Travelers' Diarrhea Antimicrobial Resistance Patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there is limited evidence associating in vitro AST results with
      treatment outcomes for acute diarrhea,29 given the high nonsusceptibility
      rates for fluoroquinolones in Campylobacter and Shigella species, it is
      reasonable to continue to recommend macrolides for TD originating or
      occurring in South Central Asia. Similarly, in sub-Saharan Africa, where
      Campylobacter infections were a common cause of TD, macrolides are
      preferred given that 60% of isolates were nonsusceptible to
      fluoroquinolones. In South America, where there is 78%
      nonsusceptibility to macrolides in Shigella species, as well as 71%
      nonsusceptibility to fluoroquinolones in Campylobacter species, patients
      receiving empiric therapy may need closer monitoring for persistent or
      worsening symptoms and possible broader antibiotic coverage.
    explanation: Directly provides region-conditioned empiric macrolide guidance and the South American monitoring caveat.

  - target: Inhibition of NHE3-mediated epithelial sodium absorption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cGMP-dependent protein kinase activation
    description: cGMP/PKG signaling inhibits the apical sodium-hydrogen exchanger.
  evidence:
  - reference: PMID:27481254
    reference_title: Intestinal Enteroids Model Guanylate Cyclase C-Dependent Secretion Induced by Heat-Stable Enterotoxins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enteroid secretion depended on canonical molecular signaling events
      responsible for ETEC-induced diarrhea, including cyclic GMP (cGMP) produced
      by GUCY2C, activation of cGMP-dependent protein kinase (PKG), and opening of
      the cystic fibrosis transmembrane conductance regulator (CFTR).
    explanation: Human and mouse intestinal enteroids connect GUCY2C-derived cGMP to PKG and CFTR opening.
- name: Adenylyl-cyclase-dependent cAMP production
  description: Toxin-activated epithelial adenylyl cyclase increases intracellular cAMP and drives the secretory signaling branch.
  role: molecular mechanism
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:

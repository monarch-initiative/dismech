    reference_title: Travelers' Diarrhea | CDC Yellow Book
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Prophylactic antibiotics afford no protection against nonbacterial pathogens and can remove normally protective microflora from the bowel, increasing the risk for acquisition of resistant bacterial pathogens.
    explanation: Directly supports the microbiome-disruption and resistant-pathogen acquisition rationale.
  - reference: PMID:28520998

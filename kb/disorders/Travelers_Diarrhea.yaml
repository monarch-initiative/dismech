    snippet: >-
      The invasive bacterial pathogens Campylobacter species, Shigella species,
      and nontyphoidal Salmonella (NTS) species, as well as diarrheagenic strains
      of Escherichia coli, are responsible for the majority of cases of
      travel-associated bacterial diarrhea.
    explanation: Identifies Shigella among the major invasive causes of travel-associated bacterial diarrhea.

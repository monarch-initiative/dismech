diagnosis:
- name: Selective pathogen testing in severe, dysenteric, or high-risk illness
  description: >-
    Pathogen-directed testing is most important for severe or bloody diarrhea
    and for patients at increased risk of a severe course; routine testing is
    not implied for every self-limited episode.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:39879968
    reference_title: "[Traveler's diarrhea]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pathogen diagnostics are indicated for severe or dysenteric courses as well as for increased risk of severe courses.
    explanation: Directly supports severity- and risk-based selection for pathogen testing.
- name: Stool culture with organism-directed PCR, antigen, or microscopy testing
  description: >-
    Stool culture is central when pathogen identification is indicated and can
    be supplemented by PCR, antigen testing, or microscopy according to the
    suspected organism and illness duration.
  evidence:
  - reference: PMID:39879968
    reference_title: "[Traveler's diarrhea]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A central component of pathogen diagnostics is stool culture. To detect specific pathogens, this is expanded to include stool microscopy, PCR, and antigen diagnostics.
    explanation: Establishes stool culture as the central diagnostic component and supports organism-directed microscopy, PCR, and antigen testing.
- name: Polymerase chain reaction testing of stool
  description: Molecular testing can detect pathogen nucleic acids when targeted or multiplex assays are clinically appropriate.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:39879968
    reference_title: "[Traveler's diarrhea]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: To detect specific pathogens, this is expanded to include stool microscopy, PCR, and antigen diagnostics.
    explanation: Supports PCR as a clinically directed pathogen-detection method rather than only as a surveillance assay.
- name: Culture-based antimicrobial susceptibility testing when possible
  description: >-
    Culture and susceptibility testing can guide therapy and preserve regional
    resistance surveillance, including after an initial culture-independent
    pathogen result.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:41591385
    reference_title: "GeoSentinel Analysis of Travelers' Diarrhea Antimicrobial Resistance Patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antimicrobial susceptibility from culture should be obtained when possible,
      including after pathogen detection by culture-independent methods.
    explanation: Directly supports culture-based susceptibility testing in the setting of geographically variable resistance.
- name: Blood culture and malaria evaluation for a febrile returning traveler
  description: >-
    Fever after travel broadens the evaluation beyond uncomplicated diarrhea;
    blood culture and exposure-directed malaria testing are important red-flag
    investigations.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:39879968
    reference_title: "[Traveler's diarrhea]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If there is a fever, a blood culture and, depending on exposure, malaria diagnosis should be carried out.
    explanation: Directly supports blood culture and exposure-dependent malaria evaluation in febrile illness after travel.
- name: Protozoal evaluation for persistent diarrhea
  description: >-
    Persistent or chronic diarrhea during or after travel warrants targeted
    examination for Giardia, Entamoeba, Cryptosporidium, Cyclospora, and other
    intestinal protozoa using organism-appropriate microscopy, antigen, or PCR
    methods.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:11389503
    reference_title: Traveler's diarrhea due to intestinal protozoa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Evaluation of the traveler with chronic diarrhea should include a careful examination for typical infecting organisms, such as Giardia and Entamoeba species, as well as for emerging parasites, such as Cryptosporidium species, Cyclospora species, and microsporidia.
    explanation: Directly supports a broad protozoal work-up for chronic post-travel diarrhea.
differential_diagnoses:
- name: Post-infectious irritable bowel syndrome
  disease_term:
    preferred_term: irritable bowel syndrome
    term:
      id: MONDO:0005052
      label: irritable bowel syndrome
  description: >-
    Persistent gastrointestinal symptoms can continue after the acute infection
    has cleared and may represent PI-IBS rather than ongoing enteric infection.
  distinguishing_features:
  - Persistent symptoms after pathogen clearance favor a postinfectious process over active infection.
  evidence:
  - reference: PMID:21180583
    reference_title: Management of the returning traveler with diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Postinfectious processes represent a second cause and comprise temporary lactose malabsorption and postinfectious irritable bowel syndrome, now considered a major cause of persistent TD.
    explanation: Establishes PI-IBS as a major noninfectious explanation for persistent symptoms after traveler's diarrhea.
- name: Inflammatory bowel disease unmasked after traveler's diarrhea
  disease_term:
    preferred_term: inflammatory bowel disease
    term:
      id: MONDO:0005265
      label: inflammatory bowel disease
  description: >-
    An incident chronic inflammatory bowel disorder can first become apparent
    after an acute travel-associated diarrheal episode and should not be assumed
    to represent persistent infection.
  distinguishing_features:
  - Evidence of chronic intestinal inflammation despite an unrevealing infectious work-up favors inflammatory bowel disease.
  evidence:
  - reference: PMID:21180583
    reference_title: Management of the returning traveler with diarrhea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Finally, apparently unrelated chronic diseases causing diarrhea are occasionally unmasked by TD and represent a third type of persistent TD, among which the well established case of incident inflammatory bowel disease poses intriguing pathogenesis questions.
    explanation: Directly identifies incident inflammatory bowel disease as a chronic disorder that can be unmasked by traveler's diarrhea.
- name: Clostridioides difficile colitis after antimicrobial exposure
  disease_term:
    preferred_term: Clostridium difficile colitis
    term:
      id: MONDO:0000705
      label: Clostridium difficile colitis
  description: >-
    C. difficile colitis is an important alternative explanation for persistent
    or recurrent diarrhea after antibiotics taken during travel.
  distinguishing_features:
  - Recent antimicrobial exposure increases concern for C. difficile colitis.
  evidence:
  - reference: PMID:9658255
    reference_title: Persistent diarrhea in the returned traveler.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If the patient is immunocompromised, microsporidia and Isospora become more likely, and a prior history of antimicrobial use raises the possibility of C. difficile colitis.
    explanation: Directly supports C. difficile colitis as an antibiotic-associated cause to consider in the returned traveler.

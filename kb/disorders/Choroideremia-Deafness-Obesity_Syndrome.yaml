- name: Subretinal AAV2-REP1 Gene Therapy (investigational, retinal component only)
  description: >
    Subretinal adeno-associated virus serotype 2 vector encoding REP1
    (AAV2-REP1) addresses only the CHM/retinal component of the syndrome — it

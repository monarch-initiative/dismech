genetic:
- name: CHM
  gene_term:
    preferred_term: CHM
    term:
      id: hgnc:1940
      label: CHM
  relationship_type: CAUSATIVE
  features: >
    CHM encodes Rab escort protein 1 (REP1). Its deletion, as part of the Xq21
    contiguous deletion, causes the choroideremia (chorioretinal degeneration)
    component of the syndrome.
  evidence:
  - reference: PMID:28630650
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability"
    explanation: >
      CHM deletion is responsible for the choroideremia ("poor vision")
      component in a molecularly defined case.
- name: POU3F4
  gene_term:
    preferred_term: POU3F4
    term:
      id: hgnc:9217
      label: POU3F4
  relationship_type: CAUSATIVE
  features: >
    POU3F4 (DFN3) encodes a POU-domain transcription factor; its deletion causes
    the X-linked mixed hearing impairment (with stapes fixation) component.
  evidence:
  - reference: PMID:10644430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the underlying genes, REP-1 and POU3F4, respectively"
    explanation: >
      POU3F4 is the DFN3 deafness gene co-deleted with CHM in this contiguous
      gene syndrome.
- name: RPS6KA6
  gene_term:
    preferred_term: RPS6KA6
    term:
      id: hgnc:10435
      label: RPS6KA6
  relationship_type: COOPERATING
  features: >
    RPS6KA6 (RSK4) maps to the MRX critical region between CHM and POU3F4; its
    deletion contributes to the intellectual-disability component.
  evidence:
  - reference: PMID:10644430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RSK4 is completely deleted in eight patients with the contiguous gene syndrome including MRX"
    explanation: >
      RSK4 (RPS6KA6) deletion is associated with the mental-retardation
      component of the Xq21 contiguous gene syndrome.

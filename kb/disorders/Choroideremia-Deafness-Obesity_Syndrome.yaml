prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Ultra-rare; only a small number of families/patients with Xq21
    contiguous-deletion choroideremia-deafness(-obesity/intellectual disability)
    have been reported.
  evidence:
  - reference: PMID:28630650
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until now only a limited number of patients with Xq21 deletions has been reported."
    explanation: >
      Supports the ultra-rare occurrence — only a limited number of Xq21
      contiguous-deletion patients have been described.

inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >
    Interstitial contiguous gene deletion at Xq21 segregating in an X-linked
    recessive pattern. Hemizygous affected males have the full syndrome;
    heterozygous carrier females are clinically normal but show retinal changes
    of the choroideremia carrier state.
  evidence:
  - reference: PMID:28630650
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient's mother exhibits a normal phenotype while carrying the same deletion, which is often observed in previous studies on female carriers in families with this syndrome"
    explanation: >
      Demonstrates X-linked recessive segregation — the carrier mother is
      phenotypically normal while transmitting the same Xq21 deletion that
      causes the full syndrome in her son.
  - reference: PMID:20301511
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHM is inherited in an X-linked manner."
    explanation: >
      GeneReviews confirms X-linked inheritance of the choroideremia component.

pathophysiology:
- name: Xq21 Contiguous Gene Deletion
  biological_scale: MOLECULAR
  description: >
    An interstitial deletion of the Xq21 region removes several contiguous
    genes, including the choroideremia gene CHM and the POU-domain
    transcription factor gene POU3F4 (DFN3), plus additional neighbouring loci
    in the X-linked mental retardation (MRX) region. The size and gene content
    of the deletion determine which extra-ocular features accompany the
    choroideremia.
  downstream:
  - target: REP1 (CHM) Deficiency and Impaired Rab Prenylation
  - target: POU3F4 Deficiency
  - target: Loss of Additional Xq21 Genes
  evidence:
  - reference: PMID:28630650
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletions in Xq21 cause various congenital defects in males including choroideremia, deafness and mental retardation, depending on their size and gene content."
    explanation: >
      Establishes the contiguous-gene-deletion model: an Xq21 deletion produces
      the triad, with the phenotype dependent on deletion size and gene content.
  - reference: PMID:28630650
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deleted region harbors 12 OMIM genes, of which POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability."
    explanation: >
      Identifies the causative contiguous genes (POU3F4, CHM, ZNF711) and maps
      each to a component of the phenotype.
  - reference: PMID:10644430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large deletions in Xq21 often are associated with contiguous gene syndromes consisting of X-linked deafness type 3 (DFN3), mental retardation (MRX), and choroideremia (CHM)."
    explanation: >
      Names the three loci (DFN3/POU3F4, MRX, CHM) that a large Xq21 deletion
      removes, defining the contiguous gene syndrome.

- name: REP1 (CHM) Deficiency and Impaired Rab Prenylation
  biological_scale: CELLULAR
  description: >
    Deletion of CHM eliminates Rab escort protein 1 (REP1), which presents Rab
    GTPases to geranylgeranyltransferase for prenylation. Defective Rab
    prenylation disrupts intracellular vesicular trafficking, especially in the
    retinal pigment epithelium and photoreceptors, leading to progressive
    degeneration of the choriocapillaris, RPE, and photoreceptor layer
    (choroideremia).
  downstream:
  - target: Progressive Chorioretinal Degeneration
  evidence:
  - reference: PMID:10644430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of deletions associated with classic CHM or DFN3 facilitated the positional cloning of the underlying genes, REP-1 and POU3F4, respectively"
    explanation: >
      Establishes REP-1 (REP1) as the product of the CHM locus deleted in this
      syndrome.

- name: Progressive Chorioretinal Degeneration
  biological_scale: TISSUE
  description: >
    Centrifugal, progressive atrophy of the choriocapillaris, retinal pigment
    epithelium, and photoreceptors produces childhood-onset nyctalopia,
    progressive peripheral visual field constriction, and eventual central
    vision loss in affected males.
  evidence:
  - reference: PMID:3476958
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroideremia, an X-chromosome linked retinal dystrophy of unknown pathogenesis, causes progressive nightblindness and eventual central blindness in affected males by the third to fourth decade of life."
    explanation: >
      Describes the progressive chorioretinal degeneration course from night
      blindness to central blindness in affected males.
  - reference: PMID:20301511
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, symptoms in affected males evolve from night blindness to peripheral visual field loss, with central vision preserved until late in life."
    explanation: >
      GeneReviews documents the same progressive natural history of the retinal
      degeneration.

- name: POU3F4 Deficiency
  biological_scale: CELLULAR
  description: >
    Deletion of POU3F4 (the DFN3 gene) removes a POU-domain transcription
    factor required for normal inner-ear (cochlear and middle-ear) development,
    causing X-linked mixed sensorineural and conductive hearing impairment,
    classically with stapes fixation and a perilymphatic "gusher" risk at
    surgery.
  downstream:
  - target: Mixed Hearing Impairment
  evidence:
  - reference: PMID:2491012
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to define the boundaries on the X chromosome for this gene, as well as for X-linked mixed deafness with perilymphatic gusher (DFN3)"
    explanation: >
      Identifies the deafness component as DFN3 (POU3F4), an X-linked mixed
      deafness with perilymphatic gusher, co-deleted with choroideremia.

- name: Mixed Hearing Impairment
  biological_scale: ORGANISM
  description: >
    Congenital mixed (combined sensorineural and conductive) hearing loss with
    stapes fixation, resulting from POU3F4/DFN3 deficiency.
  evidence:
  - reference: PMID:2491012
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients with deletions and choroideremia are affected by an X-linked mixed conductive/sensorineural deafness; one patient, XL-62, was confirmed at surgery to have DFN3"
    explanation: >
      Documents the mixed conductive/sensorineural deafness (DFN3, surgically
      confirmed) accompanying choroideremia in deletion patients.

- name: Loss of Additional Xq21 Genes
  biological_scale: MOLECULAR
  description: >
    Deletion of further contiguous genes in the Xq21 segment beyond CHM and
    POU3F4 — mapping to the X-linked mental retardation (MRX) critical region
    between them (e.g. RPS6KA6/RSK4) and ZNF711 — underlies the intellectual
    disability, and (with obesity) distinguishes this syndrome from isolated
    choroideremia. The specific gene(s) responsible for obesity remain
    incompletely defined.
  evidence:
  - reference: PMID:10644430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RSK4 is completely deleted in eight patients with the contiguous gene syndrome including MRX, partially deleted in a patient with DFN3 and present in patients with an Xq21 deletion and normal intellectual abilities."
    explanation: >
      Links deletion of RSK4 (RPS6KA6), in the MRX region between CHM and
      POU3F4, to the intellectual-disability component; patients retaining RSK4
      have normal intellect.
  - reference: PMID:28630650
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability"
    explanation: >
      Implicates ZNF711 (an XLID gene) among the deleted loci contributing to
      intellectual disability in a molecularly characterised case.


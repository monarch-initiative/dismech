name: Choroideremia-Deafness-Obesity Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >
  Choroideremia-deafness-obesity syndrome (Ayazi syndrome) is a rare X-linked
  recessive contiguous gene deletion syndrome caused by an interstitial deletion
  at Xq21 that removes the choroideremia gene CHM (encoding Rab escort protein 1,
  REP1) together with neighbouring genes, including the DFN3 deafness gene POU3F4
  and mental-retardation-region genes (e.g. RPS6KA6/RSK4, ZNF711). Affected males
  show the full choroideremia phenotype — progressive chorioretinal degeneration
  with childhood-onset night blindness, progressive peripheral visual field loss,
  and eventual central blindness — combined with congenital mixed (sensorineural
  and conductive) deafness with stapes fixation (DFN3), obesity, and moderate
  intellectual disability. The features beyond isolated choroideremia reflect the
  additional deleted genes in the contiguous segment, and the phenotype varies
  with deletion size and gene content. Female carriers show the typical patchy
  retinal changes of the choroideremia carrier state. The syndrome is distinct
  from isolated X-linked choroideremia (MONDO:0010557 / OMIM:303100); this
  contiguous-deletion form is OMIM:303110.

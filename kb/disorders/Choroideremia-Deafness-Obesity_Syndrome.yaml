    explanation: >
      ZNF711 is named among the deleted OMIM genes potentially contributing to
      intellectual disability.

treatments:
- name: Low Vision Rehabilitation and Supportive Care
  description: >
    Supportive management of progressive vision loss with low-vision aids and
    rehabilitation; no disease-modifying therapy is established for the syndrome
    as a whole.
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
- name: Hearing Rehabilitation
  description: >
    Hearing amplification / aural rehabilitation for the mixed hearing loss.
    Note the perilymphatic "gusher" risk with stapes surgery in POU3F4/DFN3
    deafness.
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
- name: Genetic Counseling
  description: >
    X-linked recessive counseling for affected families, including carrier
    testing of at-risk female relatives.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

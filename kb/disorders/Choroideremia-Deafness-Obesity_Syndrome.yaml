prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Ultra-rare; only a small number of families/patients with Xq21
    contiguous-deletion choroideremia-deafness(-obesity/intellectual disability)
    have been reported. A 2024 review of the literature counted 18 published
    male cases of choroideremia with a confirmed large or contiguous gene
    deletion. No population-based prevalence estimate exists, so
    `rate_per_100000` is deliberately omitted rather than derived from a case
    count; the literature case count is the meaningful figure.
  evidence:
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until now only a limited number of patients with Xq21 deletions has been reported."
    explanation: >
      Supports the ultra-rare occurrence — only a limited number of Xq21
      contiguous-deletion patients have been described.
  - reference: PMID:39257251
    reference_title: "A novel large multi-gene deletion in syndromic choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 18 male cases of choroideremia associated with confirmed large or contiguous gene deletions have been published to date."
    explanation: >
      Quantifies the literature-wide case count for syndromic
      (contiguous-deletion) choroideremia as of 2024, supporting the
      CASES_IN_LITERATURE measure and ultra-rare class.

inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >
    Interstitial contiguous gene deletion at Xq21 segregating in an X-linked
    recessive pattern. Hemizygous affected males have the full syndrome;
    heterozygous carrier females are clinically normal but show retinal changes
    of the choroideremia carrier state.
  evidence:
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient's mother exhibits a normal phenotype while carrying the same deletion, which is often observed in previous studies on female carriers in families with this syndrome"
    explanation: >
      Demonstrates X-linked recessive segregation — the carrier mother is
      phenotypically normal while transmitting the same Xq21 deletion that
      causes the full syndrome in her son.
  - reference: PMID:20301511
    reference_title: "Choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHM is inherited in an X-linked manner."
    explanation: >
      GeneReviews confirms X-linked inheritance of the choroideremia component.

diagnosis:
- name: Chromosomal microarray / SNP-array deletion detection
  description: >
    The syndrome is suspected clinically from the combination of choroideremia,
    deafness, and intellectual disability in an affected male, and confirmed by
    chromosomal microarray or SNP-array analysis, which detects and sizes the
    causative Xq21 contiguous deletion.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using SNP arrays, an 8.05 Mb deletion in Xq21 was identified inherited from the apparently healthy mother."
    explanation: >
      Demonstrates SNP-array detection and sizing of the causative Xq21 deletion
      as the diagnostic method.
  - reference: PMID:38927613
    reference_title: "Contiguous Gene Syndromes and Hearing Loss: A Clinical Report of Xq21 Deletion and Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirm the role of cytogenomic microarray analysis to investigate the etiology of unexplained HL"
    explanation: >
      Establishes copy-number (microarray) testing — not sequencing alone — as
      the diagnostic modality that finds this deletion, which matters because
      congenital hearing loss is often the presenting feature and a
      sequencing-only panel would miss the CNV.
  - reference: PMID:39257251
    reference_title: "A novel large multi-gene deletion in syndromic choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it highlights the importance of including syndromic choroideremia on the differential diagnosis in the workup of other syndromic retinopathies, particularly those that feature obesity, hearing loss, or intellectual disability"
    explanation: >
      States the diagnostic trigger from the ophthalmic side: a syndromic
      retinopathy with obesity, hearing loss, or intellectual disability should
      prompt consideration of contiguous-deletion choroideremia.

pathophysiology:
- name: Xq21 Contiguous Gene Deletion
  biological_scale: MOLECULAR
  description: >
    An interstitial deletion of the Xq21 region removes several contiguous
    genes, including the choroideremia gene CHM and the POU-domain
    transcription factor gene POU3F4 (DFN3), plus additional neighbouring loci
    in the X-linked mental retardation (MRX) region. The size and gene content
    of the deletion determine which extra-ocular features accompany the
    choroideremia.
  downstream:
  - target: REP1 (CHM) Deficiency and Impaired Rab Prenylation
    description: >
      Inclusion of CHM in the deleted interval removes the sole copy of the
      gene in a hemizygous male, abolishing REP1.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10644430
      reference_title: "A novel ribosomal S6-kinase (RSK4; RPS6KA6) is commonly deleted in patients with complex X-linked mental retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Large deletions in Xq21 often are associated with contiguous gene syndromes consisting of X-linked deafness type 3 (DFN3), mental retardation (MRX), and choroideremia (CHM)."
      explanation: >
        The Xq21 deletion is the direct cause of the choroideremia (CHM)
        component of the contiguous gene syndrome.
  - target: POU3F4 Deficiency
    description: >
      Inclusion of POU3F4 in the deleted interval abolishes the DFN3 deafness
      gene.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10644430
      reference_title: "A novel ribosomal S6-kinase (RSK4; RPS6KA6) is commonly deleted in patients with complex X-linked mental retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Large deletions in Xq21 often are associated with contiguous gene syndromes consisting of X-linked deafness type 3 (DFN3), mental retardation (MRX), and choroideremia (CHM)."
      explanation: >
        The same deletion removes the DFN3 locus, directly producing the
        deafness component.
  - target: Loss of Additional Xq21 Genes
    description: >
      Larger deletions extend beyond CHM and POU3F4 to remove further
      contiguous loci, adding the neurodevelopmental and other features.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28630650
      reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The deleted region harbors 12 OMIM genes, of which POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability."
      explanation: >
        A molecularly characterised deletion removed 12 OMIM genes beyond the
        two core loci, implicating additional deleted genes in the wider
        phenotype.
  evidence:
  - reference: PMID:39257251
    reference_title: "A novel large multi-gene deletion in syndromic choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously reported deletions range in size from 4 to 15 megabase pairs, and observed phenotypes include cleft lip and palate, ptosis, obesity, metabolic diseases, developmental delay, and hearing loss."
    explanation: >
      Quantifies the reported deletion-size range and shows that the
      accompanying phenotype broadens with deletion extent, which is the
      defining property of the contiguous-gene-deletion mechanism.
  - reference: PMID:38927613
    reference_title: "Contiguous Gene Syndromes and Hearing Loss: A Clinical Report of Xq21 Deletion and Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with the description of a new patient with a novel 3.7 Mb deletion of the Xq21 critical locus, we propose an unreported literature review about clinical findings in patients and their family members with Xq21 deletion syndrome."
    explanation: >
      Documents an Xq21 "critical locus" whose deletion (here 3.7 Mb, the small
      end of the reported range) defines the syndrome.
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletions in Xq21 cause various congenital defects in males including choroideremia, deafness and mental retardation, depending on their size and gene content."
    explanation: >
      Establishes the contiguous-gene-deletion model: an Xq21 deletion produces
      the triad, with the phenotype dependent on deletion size and gene content.
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deleted region harbors 12 OMIM genes, of which POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability."
    explanation: >
      Identifies the causative contiguous genes (POU3F4, CHM, ZNF711) and maps
      each to a component of the phenotype.
  - reference: PMID:10644430
    reference_title: "A novel ribosomal S6-kinase (RSK4; RPS6KA6) is commonly deleted in patients with complex X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large deletions in Xq21 often are associated with contiguous gene syndromes consisting of X-linked deafness type 3 (DFN3), mental retardation (MRX), and choroideremia (CHM)."
    explanation: >
      Names the three loci (DFN3/POU3F4, MRX, CHM) that a large Xq21 deletion
      removes, defining the contiguous gene syndrome.

- name: REP1 (CHM) Deficiency and Impaired Rab Prenylation
  biological_scale: CELLULAR
  description: >
    Deletion of CHM eliminates Rab escort protein 1 (REP1), which presents Rab
    GTPases to geranylgeranyltransferase for prenylation. Defective Rab
    prenylation disrupts intracellular vesicular trafficking, especially in the
    retinal pigment epithelium and photoreceptors, leading to progressive
    degeneration of the choriocapillaris, RPE, and photoreceptor layer
    (choroideremia).
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: protein prenylation (Rab geranylgeranylation)
    term:
      id: GO:0018342
      label: protein prenylation
    modifier: DECREASED
  - preferred_term: intracellular protein transport
    term:
      id: GO:0006886
      label: intracellular protein transport
    modifier: DECREASED
  downstream:
  - target: Photoreceptor and Retinal Pigment Epithelial Cell Death
    description: >
      Defective Rab prenylation impairs vesicular trafficking in the RPE and
      photoreceptors, culminating in death of those cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of Rab GTPase membrane targeting
    - disrupted intracellular vesicular trafficking in RPE and photoreceptors
    evidence:
    - reference: PMID:39257251
      reference_title: "A novel large multi-gene deletion in syndromic choroideremia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "choroideremia is a rare X-linked recessive chorioretinal dystrophy characterized by progressive degeneration of the retinal pigment epithelium, photoreceptors, and the choriocapillaris"
      explanation: >
        Identifies the RPE, photoreceptors, and choriocapillaris as the cell
        populations that degenerate downstream of CHM loss.
  evidence:
  - reference: PMID:10644430
    reference_title: "A novel ribosomal S6-kinase (RSK4; RPS6KA6) is commonly deleted in patients with complex X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of deletions associated with classic CHM or DFN3 facilitated the positional cloning of the underlying genes, REP-1 and POU3F4, respectively"
    explanation: >
      Establishes REP-1 (REP1) as the product of the CHM locus deleted in this
      syndrome.

- name: Photoreceptor and Retinal Pigment Epithelial Cell Death
  biological_scale: CELLULAR
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >
    Loss of REP1-dependent Rab prenylation drives death of retinal pigment
    epithelial cells and photoreceptors. As in the conserved inherited
    photoreceptor-degeneration cascade, rod photoreceptors are affected first
    (producing nyctalopia before central vision loss); in choroideremia the RPE
    and the choriocapillaris degenerate alongside the photoreceptors rather
    than the photoreceptor layer alone, which is what distinguishes
    chorioretinal degeneration from classical retinitis pigmentosa.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  downstream:
  - target: Progressive Chorioretinal Degeneration
    description: >
      Cumulative loss of RPE, photoreceptors, and choriocapillaris produces the
      centrifugally spreading chorioretinal atrophy seen on fundus examination.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301511
      reference_title: "Choroideremia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Choroideremia (CHM) is characterized by progressive chorioretinal degeneration in affected males and milder signs in heterozygous (carrier) females."
      explanation: >
        Progressive chorioretinal degeneration is the tissue-level consequence
        of the cellular loss.
  evidence:
  - reference: PMID:39257251
    reference_title: "A novel large multi-gene deletion in syndromic choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive degeneration of the retinal pigment epithelium, photoreceptors, and the choriocapillaris"
    explanation: >
      Names the three degenerating cell populations — RPE, photoreceptors, and
      choriocapillaris — that define the cellular lesion of choroideremia.

- name: Progressive Chorioretinal Degeneration
  biological_scale: TISSUE
  conforms_to: "photoreceptor_degeneration#Progressive Visual Field Loss and Blindness"
  description: >
    Centrifugal, progressive atrophy of the choriocapillaris, retinal pigment
    epithelium, and photoreceptors produces childhood-onset nyctalopia,
    progressive peripheral visual field constriction, and eventual central
    vision loss in affected males.
  evidence:
  - reference: PMID:3476958
    reference_title: "Isolation of anonymous DNA sequences from within a submicroscopic X chromosomal deletion in a patient with choroideremia, deafness, and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroideremia, an X-chromosome linked retinal dystrophy of unknown pathogenesis, causes progressive nightblindness and eventual central blindness in affected males by the third to fourth decade of life."
    explanation: >
      Describes the progressive chorioretinal degeneration course from night
      blindness to central blindness in affected males.
  - reference: PMID:20301511
    reference_title: "Choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, symptoms in affected males evolve from night blindness to peripheral visual field loss, with central vision preserved until late in life."
    explanation: >
      GeneReviews documents the same progressive natural history of the retinal
      degeneration.

- name: POU3F4 Deficiency
  biological_scale: CELLULAR
  description: >
    Deletion of POU3F4 (the DFN3 gene) removes a POU-domain transcription
    factor required for normal inner-ear (cochlear and middle-ear) development,
    causing X-linked mixed sensorineural and conductive hearing impairment,
    classically with stapes fixation and a perilymphatic "gusher" risk at
    surgery.
  downstream:
  - target: Mixed Hearing Impairment
  evidence:
  - reference: PMID:2491012
    reference_title: "Choroideremia and deafness with stapes fixation: a contiguous gene deletion syndrome in Xq21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to define the boundaries on the X chromosome for this gene, as well as for X-linked mixed deafness with perilymphatic gusher (DFN3)"
    explanation: >
      Identifies the deafness component as DFN3 (POU3F4), an X-linked mixed
      deafness with perilymphatic gusher, co-deleted with choroideremia.

- name: Mixed Hearing Impairment
  biological_scale: ORGANISM
  description: >
    Congenital mixed (combined sensorineural and conductive) hearing loss with
    stapes fixation, resulting from POU3F4/DFN3 deficiency.
  evidence:
  - reference: PMID:2491012
    reference_title: "Choroideremia and deafness with stapes fixation: a contiguous gene deletion syndrome in Xq21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients with deletions and choroideremia are affected by an X-linked mixed conductive/sensorineural deafness; one patient, XL-62, was confirmed at surgery to have DFN3"
    explanation: >
      Documents the mixed conductive/sensorineural deafness (DFN3, surgically
      confirmed) accompanying choroideremia in deletion patients.

- name: Loss of Additional Xq21 Genes
  biological_scale: MOLECULAR
  description: >
    Deletion of further contiguous genes in the Xq21 segment beyond CHM and
    POU3F4 — mapping to the X-linked mental retardation (MRX) critical region
    between them (e.g. RPS6KA6/RSK4) and ZNF711 — underlies the intellectual
    disability, and (with obesity) distinguishes this syndrome from isolated
    choroideremia. The specific gene(s) responsible for obesity remain
    incompletely defined.
  downstream:
  - target: Intellectual Disability
  evidence:
  - reference: PMID:10644430
    reference_title: "A novel ribosomal S6-kinase (RSK4; RPS6KA6) is commonly deleted in patients with complex X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RSK4 is completely deleted in eight patients with the contiguous gene syndrome including MRX, partially deleted in a patient with DFN3 and present in patients with an Xq21 deletion and normal intellectual abilities."
    explanation: >
      Links deletion of RSK4 (RPS6KA6), in the MRX region between CHM and
      POU3F4, to the intellectual-disability component; patients retaining RSK4
      have normal intellect.
  - reference: PMID:28630650
    reference_title: "A maternally inherited 8.05 Mb Xq21 deletion associated with Choroideremia, deafness, and mental retardation syndrome in a male patient."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "POU3F4, CHM, and ZNF711 might have contributed to the patient's phenotype including hearing loss, poor vision, and intellectual disability"
    explanation: >
      Implicates ZNF711 (an XLID gene) among the deleted loci contributing to
      intellectual disability in a molecularly characterised case.

- name: Intellectual Disability
  biological_scale: ORGANISM
  description: >
    Intellectual disability of variable severity resulting from loss of the
    Xq21 X-linked mental retardation (MRX) region genes (e.g. RPS6KA6/RSK4) and
    ZNF711 within the contiguous deletion.
  evidence:
  - reference: PMID:3476958
    reference_title: "Isolation of anonymous DNA sequences from within a submicroscopic X chromosomal deletion in a patient with choroideremia, deafness, and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have recently identified two families in which choroideremia is inherited with mental retardation and deafness."
    explanation: >
      Intellectual disability co-segregates with the deletion (with
      choroideremia and deafness) in the described families.


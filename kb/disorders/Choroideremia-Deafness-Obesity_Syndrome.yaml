classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >
      A constitutional chromosomal (contiguous gene) deletion syndrome; the
      genetics Part is the primary home. The ophthalmic and otologic
      manifestations are consequences of the deleted loci rather than primary
      organ-system disease.
  - classification_value: DISORDER_OF_EAR
    notes: >
      Congenital mixed hearing loss (DFN3/POU3F4) is one of the two cardinal
      sensory components and is frequently the presenting feature that triggers
      diagnostic microarray testing.

discussions:
- discussion_id: obesity_gene_unassigned
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Which deleted gene (or non-genic mechanism) within the Xq21 interval
    accounts for the obesity that Ayazi described as part of the defining
    triad?
  attaches_to:
  - "pathophysiology#Loss of Additional Xq21 Genes"
  rationale: >
    The retinal component maps cleanly to CHM/REP1 and the deafness component
    to POU3F4/DFN3, and the intellectual-disability component has at least
    candidate genes (RPS6KA6/RSK4, ZNF711). Obesity is the one element of the
    eponymous triad with no assigned locus: no gene in the deleted segment has
    been shown to cause it, and the 2024 case reviews list obesity as an
    observed phenotype without attributing it. This matters for the entry's
    causal graph, which has no edge terminating in obesity, and it is why the
    "Loss of Additional Xq21 Genes" node names candidate genes for intellectual
    disability but not for obesity.
  proposed_experiments:
  - experiment_id: obesity_critical_region_mapping
    name: Deletion-breakpoint / obesity genotype-phenotype correlation
    description: >
      Systematically correlate deletion breakpoint coordinates against presence
      or absence of obesity across the published contiguous-deletion cases to
      define a minimal obesity-associated critical region.
    decision_criterion: >
      A contiguous interval shared by all obese cases and absent from all
      non-obese cases would nominate the obesity locus; no such interval would
      argue for a non-genic or modifier-dependent mechanism.
  - experiment_id: core_gene_metabolic_phenotyping
    name: Metabolic phenotyping of Chm- and Pou3f4-deficient mice
    description: >
      Assess adiposity and metabolic phenotype in Chm-conditional and
      Pou3f4-deficient mouse models to test whether either core gene itself
      contributes to obesity.
    decision_criterion: >
      Increased adiposity in either single-gene model would remove the need to
      posit a separate obesity gene in the deleted interval.
  notes: >
    Both 2026 deep-research passes (claude_code and Edison/falcon) independently
    concluded the obesity gene is unresolved; falcon graded gene attribution for
    obesity as low confidence while grading the retinal and auditory
    attributions high.

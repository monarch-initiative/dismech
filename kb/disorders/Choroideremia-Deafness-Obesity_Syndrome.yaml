  disease_term:
    preferred_term: choroideremia
    term:
      id: MONDO:0010557
      label: choroideremia
  description: >
    Isolated choroideremia (MONDO:0010557 / OMIM:303100) is caused by an
    intragenic CHM loss-of-function variant rather than a contiguous deletion,
    and produces the retinal degeneration alone — without the deafness,
    intellectual disability, or obesity that define this syndrome. This is the
    principal named-entity-confusion hazard for this entry, so the distinction
    is made explicit.
  distinguishing_features:
  - Intragenic CHM variant rather than a contiguous Xq21 deletion
  - Retinal degeneration only; no deafness, intellectual disability, or obesity
  evidence:
  - reference: PMID:20301511
    reference_title: "Choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroideremia (CHM) is characterized by progressive chorioretinal degeneration in affected males and milder signs in heterozygous (carrier) females."
    explanation: >
      Documents isolated choroideremia as a retinal-only disorder, contrasting
      with the multisystem contiguous-deletion syndrome.
- name: Isolated X-linked deafness type 3 (DFNX2/DFN3)
  disease_term:
    preferred_term: X-linked mixed hearing loss with perilymphatic gusher
    term:
      id: MONDO:0010576
      label: X-linked mixed hearing loss with perilymphatic gusher
  description: >
    Isolated DFN3 (POU3F4-related X-linked mixed deafness with stapes fixation
    and perilymphatic gusher) results from a POU3F4 lesion that spares CHM, and
    therefore lacks the choroideremia and other contiguous-deletion features.
  distinguishing_features:
  - POU3F4 lesion sparing CHM; no chorioretinal degeneration
  - Mixed hearing loss with a pathognomonic inner-ear malformation and stapes gusher
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POU3F4 is the gene most commonly associated with X-linked deafness (DFNX2, DFN3) and accounts for about 50% of the cases of X-linked non-syndromic hearing loss."
    explanation: >
      Establishes isolated POU3F4/DFN3 as a distinct X-linked non-syndromic
      hearing-loss entity, distinguishing it from the contiguous-deletion
      syndrome.
- name: Bardet-Biedl syndrome
  disease_term:
    preferred_term: Bardet-Biedl syndrome
    term:
      id: MONDO:0015229
      label: Bardet-Biedl syndrome
  description: >
    Bardet-Biedl syndrome also combines retinal dystrophy, obesity, and
    intellectual disability, but is an autosomal recessive ciliopathy with
    additional features (postaxial polydactyly, renal anomalies, hypogonadism)
    and no Xq21 deletion, distinguishing it from this X-linked contiguous-gene
    syndrome.
  distinguishing_features:
  - Autosomal recessive ciliopathy, not an X-linked contiguous deletion
  - Postaxial polydactyly, renal anomalies, and hypogonadism

discussions:
- discussion_id: gap_choroideremia_obesity_locus
  prompt: >-
    Which deleted Xq21 gene(s) account for the obesity that distinguishes
    choroideremia-deafness-obesity syndrome from isolated choroideremia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Additional Xq21 Genes
  rationale: >-
    Obesity is a name-defining feature of the syndrome, yet unlike the retinal
    (CHM/REP1), auditory (POU3F4/DFN3), and cognitive (RPS6KA6/ZNF711) arms it
    has no assigned causative gene or mechanism. The responsible locus within
    the contiguous Xq21 deletion is unresolved, and obesity is inconsistently
    reported across the small number of published cases.
  proposed_experiments:
  - experiment_id: exp_choroideremia_obesity_deletion_mapping
    name: Deletion-interval mapping against the obesity phenotype
    description: >-
      Correlate precisely mapped Xq21 deletion boundaries with the presence,
      absence, and severity of obesity across a multi-family cohort to narrow a
      candidate obesity-associated interval, complemented by expression or
      model-system analysis of candidate genes in that interval.

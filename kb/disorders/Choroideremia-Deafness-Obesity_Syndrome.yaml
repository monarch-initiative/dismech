genetic:
- name: CHM
  gene_term:
    preferred_term: CHM
    term:
      id: hgnc:1940
      label: CHM
  relationship_type: CAUSATIVE
  features: >
    CHM encodes Rab escort protein 1 (REP1). Its deletion, as part of the Xq21
    contiguous deletion, causes the choroideremia (chorioretinal degeneration)
    component of the syndrome.
  evidence:
  - reference: PMID:20301511
    reference_title: "Choroideremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of choroideremia is established in a male proband with suggestive findings and a hemizygous pathogenic variant in CHM identified by molecular genetic testing."
    explanation: >
      Establishes CHM as the gene whose loss of function causes the
      choroideremia component of the syndrome.

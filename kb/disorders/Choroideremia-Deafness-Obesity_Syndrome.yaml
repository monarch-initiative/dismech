    co-deleted genes. It remains investigational even for isolated
    choroideremia: the phase 2 REGENERATE trial (NCT02407678, 30 adult males)
    found no significant visual-acuity benefit at 24 months and reported six
    serious adverse events in treated eyes. Recorded here because it is the
    only mechanism-directed therapy in development that touches any component
    of this syndrome, and because its negative result is the relevant fact for
    families who ask about gene therapy.

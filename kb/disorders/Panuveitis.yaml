  - target: Pan-uveal intraocular inflammation
    description: Altered HLA ocular peptide presentation, Th17 pathway genetic susceptibility, and disinhibited NF-kappaB signaling lower activation thresholds and promote pan-uveal inflammation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41877771
      reference_title: "The Immunopathogenesis of uveitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Additional immune-regulatory loci-STAT4, CCR1, IRF8, TNFAIP3 (A20)-have been linked in cohort- and disease-specific analyses. A20 haploinsufficiency, which normally acts as a brake on the NF-κB inflammation pathway, disinhibits NF-κB signalling, lowering activation thresholds for ocular autoimmunity (221, 224)."
      explanation: Review demonstrating that immunogenetic regulatory variants disinhibit NF-kappaB signaling and lower activation thresholds for ocular autoimmune inflammation.
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As outlined above, HLA polymorphisms shape which ocular peptides are displayed to T-cells and modify risk; prominent examples include HLA-B27 with acute anterior uveitis, HLA-A29 with birdshot chorioretinopathy, and HLA-B*51 with Behçet’s disease (Table 2) (221)."
    explanation: Review showing that HLA-B polymorphisms shape ocular peptide display to T cells and modify uveitis risk.
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For example, IL23R is a key genetic component of Th17 signalling and is implicated in the pathophysiology of Behçet’s and Vogt-Koyanagi-Harada disease (223)."
    explanation: Review implicating IL23R genetic susceptibility and Th17 signaling in Behcet and Vogt-Koyanagi-Harada panuveitis.
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additional immune-regulatory loci-STAT4, CCR1, IRF8, TNFAIP3 (A20)-have been linked in cohort- and disease-specific analyses. A20 haploinsufficiency, which normally acts as a brake on the NF-κB inflammation pathway, disinhibits NF-κB signalling, lowering activation thresholds for ocular autoimmunity (221, 224)."
    explanation: Review showing that TNFAIP3 (A20) haploinsufficiency removes negative feedback on NF-kappaB and lowers thresholds for ocular autoimmunity.

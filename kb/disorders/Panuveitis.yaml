- name: Immunogenetic susceptibility
  description: >-
    Polymorphisms in MHC class I and II molecules (such as HLA-B*51 and
    HLA-B27) alter ocular peptide presentation to T lymphocytes, while
    susceptibility variants in the Th17-pathway receptor IL23R and
    haploinsufficiency of the NF-kappaB negative regulator TNFAIP3 (A20)
    dysregulate adaptive and innate immune signaling, lowering activation
    thresholds for intraocular autoimmunity.

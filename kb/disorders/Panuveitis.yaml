- population: Adult uveitis cohorts (panuveitis anatomical subtype share)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Panuveitis accounts for 7% to 32% of all uveitis cases across clinical
    series. Measure type and prevalence class are set to UNKNOWN because this
    panuveitis-specific figure is an anatomical subtype share among uveitis cases
    rather than a population-denominator rate.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anterior uveitis affects the iris and ciliary body (41%-60% of cases); intermediate uveitis affects the pars plana (attachment point of vitreous humor) and peripheral retina (9%-15%); posterior uveitis involves the choroid and/or retina (17%-23%); and panuveitis involves all uveal layers (7%-32%)."
    explanation: >-
      Review summarizing the proportion of adult uveitis cases classified
      anatomically as panuveitis (7%-32%).
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anterior uveitis represents the most common form, accounting for 41 to 60% of cases, followed by posterior uveitis at 17 to 23%, intermediate uveitis at 9 to 15%, and panuveitis at 7 to 32%."
    explanation: >-
      Independent review corroborating the 7% to 32% anatomical subtype share of
      panuveitis among uveitis cases.

genetic:
- name: HLA-B
  gene_term:
    preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  relationship_type: RISK_FACTOR
  association: MHC class I risk alleles (including HLA-B*51 in Behcet-associated panuveitis and HLA-B27 in spondyloarthritis-associated uveitis)
  notes: >-
    Polymorphisms in HLA-B shape ocular peptide presentation to T cells and
    modify uveitis susceptibility across anatomical and syndromic subtypes,
    including HLA-B*51 in Behcet disease and HLA-B27 in acute anterior and
    spondyloarthritis-associated uveitis.
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As outlined above, HLA polymorphisms shape which ocular peptides are displayed to T-cells and modify risk; prominent examples include HLA-B27 with acute anterior uveitis, HLA-A29 with birdshot chorioretinopathy, and HLA-B*51 with Behçet’s disease (Table 2) (221)."
    explanation: >-
      Review detailing how HLA-B alleles (HLA-B*51 and HLA-B27) alter ocular
      peptide display and modify uveitis risk.
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Incidence and prevalence of uveitis are influenced by genetic factors (eg, human leukocyte antigen-B27), environmental factors (eg, air pollution), and infection rates."
    explanation: >-
      Adult uveitis review highlighting HLA-B27 as a major genetic risk factor
      influencing uveitis occurrence.
- name: IL23R
  gene_term:
    preferred_term: IL23R
    term:
      id: hgnc:19100
      label: IL23R
  relationship_type: SUSCEPTIBILITY
  association: Th17 pathway susceptibility locus in Behcet disease and Vogt-Koyanagi-Harada panuveitis
  notes: >-
    Encodes the interleukin-23 receptor subunit that stabilizes pathogenic Th17
    effector responses implicated in classic panuveitic syndromes including
    Behcet disease and Vogt-Koyanagi-Harada disease.
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For example, IL23R is a key genetic component of Th17 signalling and is implicated in the pathophysiology of Behçet’s and Vogt-Koyanagi-Harada disease (223)."
    explanation: >-
      Review linking IL23R genetic susceptibility and Th17 signaling to major
      panuveitis-associated diseases.
- name: TNFAIP3
  gene_term:
    preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  relationship_type: SUSCEPTIBILITY
  association: Immune-regulatory susceptibility locus and NF-kappaB negative regulator (A20) linked to ocular autoimmunity
  notes: >-
    Encodes A20, a negative regulator of NF-kappaB signaling; reduced A20
    function disinhibits NF-kappaB activation and lowers the threshold for
    intraocular autoimmune inflammation.
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additional immune-regulatory loci-STAT4, CCR1, IRF8, TNFAIP3 (A20)-have been linked in cohort- and disease-specific analyses. A20 haploinsufficiency, which normally acts as a brake on the NF-κB inflammation pathway, disinhibits NF-κB signalling, lowering activation thresholds for ocular autoimmunity (221, 224)."
    explanation: >-
      Review describing TNFAIP3 (A20) as an immune-regulatory locus whose loss of
      function disinhibits NF-kappaB signaling and promotes ocular autoimmunity.
differential_diagnoses:
- name: Intraocular lymphoma
  disease_term:
    preferred_term: intraocular lymphoma
    term:
      id: MONDO:0004351
      label: intraocular lymphoma
  description: >-
    Neoplastic uveitic masquerade syndrome (most commonly primary vitreoretinal
    lymphoma) that presents with vitreous cellular infiltration and chorioretinal
    lesions mimicking chronic intermediate, posterior, or panuveitis.
  distinguishing_features:
  - Neoplastic lymphoid infiltration rather than primary immune or infectious inflammation
  - Poor or transient response to corticosteroid monotherapy and requirement for diagnostic vitreous biopsy or cytology
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Masquerade syndromes, accounting for 1 to 5% of presentations, comprise neoplastic processes and non-neoplastic entities such as ocular ischaemia."
    explanation: >-
      Review identifying neoplastic masquerade syndromes as an important
      differential diagnostic category in patients presenting with uveitis.
- name: Posterior uveitis
  disease_term:
    preferred_term: posterior uveitis
  description: >-
    Anatomic class of uveitis in which primary intraocular inflammation is
    restricted to the retina and/or choroid without predominant simultaneous
    involvement of the anterior chamber and vitreous cavity.
  distinguishing_features:
  - Primary inflammation confined to the choroid and/or retina (17%-23% of uveitis cases) rather than involving all uveal layers simultaneously
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anterior uveitis affects the iris and ciliary body (41%-60% of cases); intermediate uveitis affects the pars plana (attachment point of vitreous humor) and peripheral retina (9%-15%); posterior uveitis involves the choroid and/or retina (17%-23%); and panuveitis involves all uveal layers (7%-32%)."
    explanation: >-
      Review distinguishing posterior uveitis (confined to choroid and/or retina)
      from panuveitis (involving all uveal layers).
- name: Anterior uveitis
  disease_term:
    preferred_term: anterior uveitis
  description: >-
    Anatomic class of uveitis limited to the anterior segment (iris and ciliary
    body), representing the most common form of uveitis (41%-60% of cases).
  distinguishing_features:
  - Inflammation restricted to the iris and ciliary body without chorioretinal or diffuse vitreous involvement
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anterior uveitis affects the iris and ciliary body (41%-60% of cases); intermediate uveitis affects the pars plana (attachment point of vitreous humor) and peripheral retina (9%-15%); posterior uveitis involves the choroid and/or retina (17%-23%); and panuveitis involves all uveal layers (7%-32%)."
    explanation: >-
      Review distinguishing anterior uveitis (iris and ciliary body) from
      panuveitis (all uveal layers).
references:
- reference: PMID:40434762
  title: "Uveitis in Adults: A Review."
  findings:
  - statement: Panuveitis is an anatomic form of uveitis involving all uveal layers and accounting for 7% to 32% of adult uveitis cases, with uveitis overall predominantly affecting adults aged 20 to 50 years.
    supporting_text: "Anterior uveitis affects the iris and ciliary body (41%-60% of cases); intermediate uveitis affects the pars plana (attachment point of vitreous humor) and peripheral retina (9%-15%); posterior uveitis involves the choroid and/or retina (17%-23%); and panuveitis involves all uveal layers (7%-32%)."
  - statement: Uncontrolled uveitis across ocular compartments leads to sight-threatening structural complications including cataract, glaucoma, macular edema, retinal detachment, and optic nerve damage.
    supporting_text: "Untreated uveitis may cause cataracts, glaucoma, macular edema, retinal detachment, optic nerve damage, and vision loss."
- reference: PMID:41877771
  title: "The Immunopathogenesis of uveitis."
  findings:
  - statement: Uveitis has an annual incidence of 17 to 52 per 100,000 people and arises from the interaction of genetic susceptibility loci (including HLA alleles, IL23R, and TNFAIP3) with infectious or environmental triggers that breach ocular immune privilege.
    supporting_text: "The annual incidence ranges from 17 to 52 per 100,000 people, with the condition predominantly affecting young and middle-aged adults aged 20 to 50 years (3)."
- reference: PMID:37428299
  title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
  findings:
  - statement: In the Hellenic Study of Uveitis cohort, among eyes with panuveitis, 87.1% were noninfectious and 12.9% were caused by infectious agents.
    supporting_text: "Finally, for eyes with panuveitis, 12.9% were caused by infectious agents, while 87.1% were non-infectious uveitis."
- reference: PMID:39157460
  title: "Update on non-infectious uveitis treatment: anti-TNF-alpha and beyond."
  findings:
  - statement: Pro-inflammatory cytokines TNF-alpha and IL-6 are elevated in intraocular fluids during active uveitis and serve as key therapeutic targets for biologic immunosuppression.
    supporting_text: "The pro-inflammatory cytokine TNF-α is believed to be a pivotal factor in uveitis inflammation, with upregulated levels in both aqueous humor and serum among uveitis patients."
- reference: PMID:27602665
  title: "Adalimumab in Patients with Active Noninfectious Uveitis."
  findings:
  - statement: In the phase 3 VISUAL I trial of active noninfectious intermediate, posterior, or panuveitis, adalimumab prolonged median time to treatment failure to 24 weeks compared with 13 weeks for placebo.
    supporting_text: "The median time to treatment failure was 24 weeks in the adalimumab group and 13 weeks in the placebo group."

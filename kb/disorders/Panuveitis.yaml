classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:37428299
      reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Finally, for eyes with panuveitis, 12.9% were caused by infectious agents, while 87.1% were non-infectious uveitis."
      explanation: >-
        Large tertiary uveitis cohort demonstrating that 87.1% of panuveitic eyes
        are non-infectious immune-mediated uveitis.
    - reference: PMID:41877771
      reference_title: "The Immunopathogenesis of uveitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Non-infectious aetiologies constitute 52 to 79% of cases. Conditions with established systemic associations include sarcoidosis (a multisystem granulomatous disorder), Behçet’s disease (a systemic vasculitis characterised by recurrent oral and genital ulceration), Vogt-Koyanagi-Harada syndrome (a multisystem autoimmune disorder targeting melanocytes), juvenile idiopathic arthritis, tubulointerstitial nephritis with uveitis syndrome, and multiple sclerosis."
      explanation: >-
        Immunopathogenesis review linking non-infectious uveitis to systemic
        autoimmune and granulomatous conditions including sarcoidosis, Behcet
        disease, and Vogt-Koyanagi-Harada syndrome.
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:40434762
      reference_title: "Uveitis in Adults: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Uveitis is classified as noninfectious or infectious, with toxoplasmosis, herpes, tuberculosis, and HIV comprising 11% to 21% of infectious cases in high-income countries and 50% in low- and middle-income countries."
      explanation: >-
        Adult uveitis review confirming infectious etiologies (toxoplasmosis,
        herpesviruses, tuberculosis, and HIV) as a major etiologic axis of uveitis
        and panuveitis.
inheritance:
- name: Sporadic or multifactorial susceptibility
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Panuveitis generally arises sporadically or through multifactorial interactions
    between host immunogenetic susceptibility (including MHC/HLA alleles and
    immune-regulatory loci) and infectious or environmental triggers, with 27% to
    51% of uveitis presentations remaining idiopathic despite workup.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the US and Europe, 27% to 51% of uveitis cases are idiopathic, and 37% to 49% are associated with systemic disease, such as axial spondyloarthritis."
    explanation: >-
      Adult uveitis review documenting that a large fraction of cases arise
      idiopathically or in association with multifactorial systemic inflammatory
      diseases rather than single-gene inheritance.
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The interaction between genetic predisposition and environmental triggers is central to the onset of uveitis."
    explanation: >-
      Review of uveitis immunopathogenesis confirming multifactorial onset driven
      by polygenic predisposition interacting with environmental or infectious
      triggers.
has_subtypes:
- name: Noninfectious panuveitis
  description: >-
    Immune-mediated panuveitis arising either in association with systemic
    autoimmune or autoinflammatory disorders (such as sarcoidosis, Behcet
    disease, or Vogt-Koyanagi-Harada disease) or as idiopathic pan-uveal
    inflammation without an identifiable infectious pathogen; accounted for
    87.1% of panuveitic eyes in the Hellenic Study of Uveitis.
  evidence:
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Finally, for eyes with panuveitis, 12.9% were caused by infectious agents, while 87.1% were non-infectious uveitis."
    explanation: >-
      Large tertiary-center cohort study quantifying noninfectious panuveitis as
      the predominant etiologic subtype of panuveitis.
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Uveitis is classified as noninfectious or infectious, with toxoplasmosis, herpes, tuberculosis, and HIV comprising 11% to 21% of infectious cases in high-income countries and 50% in low- and middle-income countries."
    explanation: >-
      Adult uveitis review establishing the primary etiologic division into
      noninfectious and infectious forms.
- name: Infectious panuveitis
  description: >-
    Panuveitis caused by direct intraocular infection or pathogen-driven
    inflammation across all uveal layers (including toxoplasmosis, herpesviruses,
    tuberculosis, syphilis, and HIV-associated infections); accounted for 12.9%
    of panuveitic eyes in the Hellenic Study of Uveitis.
  evidence:
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Finally, for eyes with panuveitis, 12.9% were caused by infectious agents, while 87.1% were non-infectious uveitis."
    explanation: >-
      Large tertiary-center cohort study quantifying the infectious subtype of
      panuveitis.
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

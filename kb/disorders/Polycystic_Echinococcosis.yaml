name: Polycystic echinococcosis
creation_date: '2026-01-15T17:46:03Z'
category: Infectious Disease
description: >-
  Polycystic echinococcosis is a zoonotic helminth infection caused by the larval
  stage of Echinococcus vogeli, producing multilocular hydatid cysts that typically
  involve the liver and can infiltrate adjacent organs.
disease_term:
  term:
    id: MONDO:0000288
    label: polycystic echinococcosis
  preferred_term: Polycystic echinococcosis
parents:
- Echinococcosis
- Liver disorder
- Digestive system infectious disorder
infectious_agent:
- name: Echinococcus vogeli
  infectious_agent_term:
    preferred_term: Echinococcus vogeli
    term:
      id: NCBITaxon:6213
      label: Echinococcus vogeli
  description: The cestode species responsible for polycystic echinococcosis in
    humans.
  evidence:
  - reference: PMID:40705460
    reference_title: "Molecular Characterization of Echinococcus vogeli from Human Case, Colombia, 2024."
    supports: SUPPORT
    snippet: We describe a case of E. vogeli echinococcosis in a woman,
      diagnosed through PCR, mitochondrial DNA sequencing, and molecular
      characterization.
    explanation: Molecular confirmation links human infection to Echinococcus
      vogeli.
transmission:
- name: Food or water contaminated by dog or bush dog feces
  description: Human infection occurs after ingestion of E. vogeli eggs shed by
    definitive hosts that fed on infected paca viscera.
  evidence:
  - reference: PMID:41431593
    reference_title: "Neotropical Echinococcosis Complicated by Hepatic Abscess and Hepato-Pleural Fistula: A Case Report From the State of Acre, Brazil."
    supports: SUPPORT
    snippet: Humans become accidental hosts by consuming food or water
      contaminated with eggs of this helminth.
    explanation: The case report describes the fecal-oral route from definitive
      hosts as the human exposure pathway.
prevalence:
- population: Pan-Amazonia (Central and South America)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: Focal endemic zoonosis; roughly 200-400 human cases documented across
    the entire Pan-Amazon region since first description, indicating rarity.
  evidence:
  - reference: PMID:37549288
    reference_title: "Climate determines transmission hotspots of Polycystic Echinococcosis, a life-threatening zoonotic disease, across Pan-Amazonia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: we compiled a unique dataset of host occurrences (~86000 records)
      and disease infections (~400 cases) covering the entire Pan-Amazonia and
      employed different modeling and statistical tools to unveil the spatial
      distribution of PE's key animal hosts.
    explanation: Only ~400 human infections are documented across the entire
      Pan-Amazon region, consistent with a rare, focally endemic disease.
  - reference: DOI:10.1128/cmr.00050-07
    reference_title: "New Aspects of Neotropical Polycystic (Echinococcus vogeli) and Unicystic (Echinococcus oligarthrus) Echinococcosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 200 cases of polycystic echinococcosis (PE) have been recorded from 12 countries in South America."
    explanation: The review reports only ~200 recorded PE cases across 12
      countries, underscoring its rarity.
has_subtypes: []
pathophysiology:
- name: Hepatic metacestode implantation
  description: Oncospheres establish metacestode vesicles within the liver
    parenchyma, the primary site of E. vogeli infection in humans, forming the
    characteristic three-layered (adventitious, laminated, germinal) cyst wall.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: DOI:10.1128/cmr.00050-07
    reference_title: "New Aspects of Neotropical Polycystic (Echinococcus vogeli) and Unicystic (Echinococcus oligarthrus) Echinococcosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following early proliferation of E. vogeli in the human host, typically
      in the liver, the metacestode usually spreads in the peritoneal and
      pleural cavities, and numerous organs may be invaded.
    explanation: The authoritative D'Alessandro & Rausch review states that
      E. vogeli metacestodes proliferate early in the liver, the primary site
      of human infection.
  - reference: DOI:10.1590/s1678-9946202567069
    reference_title: "Pathological characterization of hepatic and mesenteric neotropical Echinococcosis in Brazilian Amazonian patients using light and scanning electron microscopy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver metacestodes showed three characteristic layers: adventitious, laminated, and germinal."
    explanation: Histopathology of E. vogeli liver metacestodes from Amazonian
      patients documents the three-layered cyst wall of the implanted lesion.
- name: Exogenous metacestode proliferation and daughter-cyst formation
  description: Unlike the unicystic neotropical species E. oligarthrus, the
    E. vogeli metacestode undergoes exogenous proliferation, budding daughter
    cysts from the germinal layer that coalesce into the characteristic
    multilocular (polycystic) mass that expands through hepatic tissue.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: DOI:10.1128/cmr.00050-07
    reference_title: "New Aspects of Neotropical Polycystic (Echinococcus vogeli) and Unicystic (Echinococcus oligarthrus) Echinococcosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      consists of a spherical, fluid-filled vesicle that enlarges concentrically
      and is not known to undergo exogenous proliferation.
    explanation: The review states this of the unicystic E. oligarthrus
      metacestode; by explicit contrast, the E. vogeli metacestode does undergo
      exogenous proliferation, producing the polycystic (multilocular) structure.
  - reference: DOI:10.1590/s1678-9946202567069
    reference_title: "Pathological characterization of hepatic and mesenteric neotropical Echinococcosis in Brazilian Amazonian patients using light and scanning electron microscopy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver metacestodes showed three characteristic layers: adventitious, laminated, and germinal."
    explanation: The germinal layer is the proliferative membrane from which
      daughter cysts bud in E. vogeli metacestodes.
- name: Mass effect and local invasion
  description: The enlarging multilocular cyst complex compresses adjacent
    hepatic tissue and can invade neighboring structures, generating
    space-occupying effects.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: DOI:10.1590/s1678-9946202567069
    reference_title: "Pathological characterization of hepatic and mesenteric neotropical Echinococcosis in Brazilian Amazonian patients using light and scanning electron microscopy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compression exerted by the metacestodes led to hepatic and mesenteric hypertension, characterized by passive hyperemia."
    explanation: Metacestode compression produces mass effect on hepatic and
      mesenteric tissue with vascular congestion.
  - reference: DOI:10.1128/cmr.00050-07
    reference_title: "New Aspects of Neotropical Polycystic (Echinococcus vogeli) and Unicystic (Echinococcus oligarthrus) Echinococcosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the metacestode usually spreads in the peritoneal and pleural cavities,
      and numerous organs may be invaded.
    explanation: Beyond local compression, the E. vogeli metacestode spreads
      through the peritoneal and pleural cavities and invades adjacent organs.
phenotypes:
- name: Polycystic hepatic lesion
  description: Large multilocular hydatid cysts occupying the liver, the
    predominant organ involved in polycystic echinococcosis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hepatic cysts
    term:
      id: HP:0001407
      label: Hepatic cysts
  evidence:
  - reference: DOI:10.1128/cmr.00050-07
    reference_title: "New Aspects of Neotropical Polycystic (Echinococcus vogeli) and Unicystic (Echinococcus oligarthrus) Echinococcosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of patients with polycysts in the liver was 81%, and the percentage of patients with polycysts in the chest was 14%."
    explanation: In the reviewed series, 81% of PE patients had hepatic
      polycysts, placing hepatic involvement in the VERY_FREQUENT band (80-99%).
- name: Hepatic abscess complication
  description: Secondary infection of hepatic hydatid lesions leading to abscess
    formation.
  phenotype_term:
    preferred_term: Liver abscess
    term:
      id: HP:0100523
      label: Liver abscess
  evidence:
  - reference: PMID:41431593
    reference_title: "Neotropical Echinococcosis Complicated by Hepatic Abscess and Hepato-Pleural Fistula: A Case Report From the State of Acre, Brazil."
    supports: SUPPORT
    snippet: We describe a rural patient with hepatitis B virus (HBV)-related
      cirrhosis and neotropical echinococcosis who developed a hepatic abscess
      that fistulized into the right hemithorax.
    explanation: The report documents hepatic abscess formation as a
      complication of neotropical echinococcosis.
- name: Thoracic empyema from hepato-pleural fistula
  description: Extension of the hepatic abscess through the diaphragm into the
    pleural space (right hemithorax), producing a secondary thoracic
    (pleural-space) infected collection.
  phenotype_term:
    preferred_term: Thoracic empyema from hepato-pleural fistula
    term:
      id: HP:0011919
      label: Pleural empyema
  evidence:
  - reference: PMID:41431593
    reference_title: "Neotropical Echinococcosis Complicated by Hepatic Abscess and Hepato-Pleural Fistula: A Case Report From the State of Acre, Brazil."
    supports: SUPPORT
    snippet: We describe a rural patient with hepatitis B virus (HBV)-related
      cirrhosis and neotropical echinococcosis who developed a hepatic abscess
      that fistulized into the right hemithorax.
    explanation: The case describes a transdiaphragmatic fistula leading to a
      thoracic abscess, aligning with a lung abscess complication.

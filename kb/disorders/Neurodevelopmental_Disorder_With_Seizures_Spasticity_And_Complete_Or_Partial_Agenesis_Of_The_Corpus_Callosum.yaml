prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Faqeih et al. 2023 report seven patients. The abstract does not state the
    family count, but it reports ten patients from seven families in total, of
    which three patients from two families carry UBE3C variants, which leaves
    five HECTD4 families. Chundru et al. 2024 add two probands with biallelic
    loss-of-function genotypes in the DDD and GeneDx cohorts and two further
    GeneDx cases; their phenotypes are in that paper's supplement and are not
    curated here. A PubMed search for "HECTD4 AND (corpus callosum OR epilepsy
    OR neurodevelopmental OR spasticity)" run on 2026-10-19 returned no other
    case report. No population estimate exists.

discussions:
- discussion_id: nedssacc_hectd4_substrate_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which HECTD4 substrates are stabilized in the developing human brain, and
    which of them account for the callosal maldevelopment, the seizures and the
    upper motor neuron signs?
  attaches_to:
  - pathophysiology#Reduced HECTD4-Dependent Substrate Ubiquitination
  - pathophysiology#Abnormal Corpus Callosum Development
  - pathophysiology#Increased Neuronal GluN2B Phosphorylation and Calcium Influx
  rationale: >
    Every known HECTD4 substrate (COX-2, MKK7, GluN2B, MALT1) was found in a
    non-developmental system: breast cancer cells or neural cells under
    ischemic injury. No HECTD4-deficient animal model with a brain phenotype has
    been published, and no patient-derived neural cells have been studied. The
    IMPC Hectd4 knockout mouse (MGI:3647820) is the one existing model: its gene
    page reports significant phenotypes in four of the 16 physiological systems
    tested (vision/eye, immune system, homeostasis/metabolism and hematopoietic
    system) and no nervous-system phenotype, and its summary does not show
    whether brain structure was examined. The
    missense alleles have not been tested for any effect on ligase activity.

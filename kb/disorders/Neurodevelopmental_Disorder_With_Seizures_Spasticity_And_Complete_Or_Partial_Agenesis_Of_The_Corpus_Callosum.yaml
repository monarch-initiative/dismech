pathophysiology:
- name: Biallelic HECTD4 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic HECTD4 variants remove or reduce HECTD4 function. Patient RNA
    studies support a loss-of-function effect for the truncating alleles; the
    compound heterozygous missense alleles are presumed loss of function on in
    silico grounds. HECTD4 is a HECT-family E3 ligase whose catalytic HECT
    domain accepts ubiquitin from an E2 enzyme and transfers it to substrates.
  genes:
  - preferred_term: HECTD4
    term:
      id: hgnc:26611
      label: HECTD4
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    modifier: DECREASED
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The RNA studies in 4 patients with LoF variants in HECTD4 and UBE3C
      provided evidence for the LoF effect.
    explanation: Patient-derived RNA evidence for loss of function; pooled across the two genes.
  - reference: PMID:40768362
    reference_title: The E3 ligase HECTD4 regulates COX-2-dependent tumor progression and metastasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Transfection of the short-active, but not the short-mutant construct,
      into MDA-MB-231 cells shows autoubiquitination, following
      immunoprecipitation from cellular extracts
    explanation: >-
      The isolated HECTD4 HECT domain is catalytically active and depends on its
      active-site cysteine, grounding the ubiquitin ligase activity bound on
      this node.
  downstream:
  - target: Reduced HECTD4-Dependent Substrate Ubiquitination
    causal_link_type: DIRECT
    description: >
      Inferred from the activity of wild-type HECTD4 in cancer cells and
      cultured nerve cells; substrate ubiquitination has not been measured in patient cells.
    evidence:
    - reference: PMID:40768362
      reference_title: The E3 ligase HECTD4 regulates COX-2-dependent tumor progression and metastasis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We show that purified HECTD4 mediates ubiquitin conjugation in vitro,
        and proteomic studies combined with ubiquitin remnant profiling identify
        a major degradation target as the prostaglandin synthetic enzyme
        cyclooxygenase-2 (COX-2; PTGS2).
      explanation: >-
        HECTD4 ubiquitinates substrates for degradation; INDIRECT because shown
        in breast cancer cells, not in patient cells or the developing brain.
- name: Reduced HECTD4-Dependent Substrate Ubiquitination
  biological_scale: CELLULAR
  description: >
    Loss of HECTD4 is expected to stabilize its substrates. In breast cancer
    cells HECTD4 depletion raises COX-2 and HECTD4 also targets its regulatory
    kinase MKK7; in cultured nerve cells under hypoxic or NMDA injury HECTD4
    knockdown lowers ubiquitination of the NMDA receptor
    subunit GluN2B and of MALT1. Which substrates matter in the developing human
    brain is not known.
  biological_processes:
  - preferred_term: protein ubiquitination
    modifier: DECREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:40768362
    reference_title: The E3 ligase HECTD4 regulates COX-2-dependent tumor progression and metastasis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      its depletion massively increases COX-2 expression, enhancing
      anchorage-independent proliferation and tumorigenesis.
    explanation: HECTD4 depletion stabilizes a substrate in cancer cells; not a neural system.
  - reference: PMID:36527595
    reference_title: The Weakened Interaction Between HECTD4 and GluN2B in Ischemic Stroke Promotes Calcium Overload and Brain Injury Through a Mechanism Involving the Decrease of GluN2B and MALT1 Ubiquitination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Knockdown of HECTD4 exacerbated hypoxia- or NMDA-induced injury in nerve
      cells coincident with a decrease in GluN2B and MALT1 ubiquitination
    explanation: >-
      HECTD4 knockdown lowers substrate ubiquitination in neural cells, in an
      ischemic-injury paradigm rather than a developmental one.
  downstream:
  - target: Abnormal Corpus Callosum Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      No HECTD4 substrate has been tied to callosal axon growth or midline
      crossing; the link rests on the human genetics and on the wider
      association of E3 ligase genes with neurodevelopmental syndromes.
    evidence:
    - reference: PMID:36401616
      reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Pathogenic variants in genes encoding ubiquitin E3 ligases are known to
        cause neurodevelopmental syndromes.
      explanation: >-
        The founding paper's framing: E3 ligase loss as a class causes
        neurodevelopmental disease. It says nothing about the corpus callosum or
        the intermediate step; it supports only the class-level link.
  - target: Impaired Cerebral Neurodevelopment and Neuronal Network Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The intermediate steps between reduced HECTD4 ubiquitination and the
      neurodevelopmental phenotype are unknown.
    evidence:
    - reference: PMID:36401616
      reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        HECTD4 and UBE3C are novel biallelic rare disease genes, expand the
        association of the other HECT E3 ligase group with neurodevelopmental
        syndromes
      explanation: >-
        Places biallelic HECTD4 loss among HECT E3 ligase causes of
        neurodevelopmental syndromes; the mechanism is not shown.
  - target: Increased Neuronal GluN2B Phosphorylation and Calcium Influx
    causal_link_type: DIRECT
    hypothesis_groups:
    - glun2b_excitability
    description: >
      Shown only for HECTD4 knockdown in cultured nerve cells exposed to hypoxia or
      NMDA; not studied in development or in patient cells.
    evidence:
    - reference: PMID:36527595
      reference_title: The Weakened Interaction Between HECTD4 and GluN2B in Ischemic Stroke Promotes Calcium Overload and Brain Injury Through a Mechanism Involving the Decrease of GluN2B and MALT1 Ubiquitination.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Knockdown of HECTD4 exacerbated hypoxia- or NMDA-induced injury in nerve
        cells coincident with a decrease in GluN2B and MALT1 ubiquitination, and
        an increase in GluN2B phosphorylation as well as an increase in
        intracellular calcium level
      explanation: >-
        HECTD4 knockdown raises GluN2B phosphorylation and intracellular calcium
        in nerve cells under injury conditions; extrapolated here, hence INDIRECT.
- name: Increased Neuronal GluN2B Phosphorylation and Calcium Influx
  biological_scale: CELLULAR
  description: >
    HECTD4 interacts with the NMDA receptor subunit GluN2B, an interaction
    that weakens in a rat ischemic stroke model, and in cultured nerve cells
    HECTD4 knockdown increases GluN2B phosphorylation and intracellular calcium
    after hypoxic or NMDA challenge, partly through stabilized MALT1 and
    degradation of the phosphatase STEP61. Whether the same occurs in the
    developing brain, and whether it lowers seizure threshold in patients, has
    not been studied, so this node has no downstream edge.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36527595
    reference_title: The Weakened Interaction Between HECTD4 and GluN2B in Ischemic Stroke Promotes Calcium Overload and Brain Injury Through a Mechanism Involving the Decrease of GluN2B and MALT1 Ubiquitination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      we conclude that the downregulation of HECTD4 in ischemic stroke rat brain
      accounts for calcium overload and brain injury due to activating GluN2B
      directly and indirectly through a mechanism involving the reduced
      ubiquitination of GluN2B and MALT1, respectively.
    explanation: Rat ischemic stroke model; an acquired-injury setting, not a developmental one.

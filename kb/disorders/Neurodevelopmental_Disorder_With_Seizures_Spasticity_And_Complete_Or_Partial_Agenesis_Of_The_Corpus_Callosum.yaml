genetic:
- name: HECTD4
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    HECTD4 (12q24.13; previous symbol C12orf51) encodes HECT domain E3
    ubiquitin protein ligase 4. The causal call rests on two independent lines
    of human genetic evidence: five families with biallelic variants and patient
    RNA studies supporting a loss-of-function effect (Faqeih et al. 2023), and a
    gene-burden excess of biallelic loss-of-function genotypes in 29,745
    developmental disorder probands, whose authors judge the evidence strong
    (Chundru et al. 2024). In that analysis HECTD4 passed the 5% false
    discovery rate threshold on two probands with biallelic loss-of-function
    genotypes but did not pass Bonferroni correction. The compound heterozygous missense alleles have only
    in silico support. ClinGen has not curated HECTD4 (the ClinGen gene search
    reports it uncurated, and no CGGV record is cached), so
    gene_disease_validity is left absent. Heterozygous HECTD4 variants are a
    separate and unsettled question: de novo HECTD4 variants made the gene a
    high-confidence candidate in a de novo neurodevelopmental disorder analysis
    (PMID:35468861), and common 12q24 HECTD4 variants are associated with
    metabolic and drinking traits in East Asian cohorts. Neither is part of this
    recessive entity. Variant nomenclature is in the paper's full text, which is
    not open access, so no variants are listed.

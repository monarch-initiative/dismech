differential_diagnoses:
- name: Angelman syndrome
  description: >-
    The founding study screened patients with Angelman-like presentations and
    frames both HECTD4 and UBE3C disorders as overlapping with Angelman
    syndrome, which is caused by loss of the HECT E3 ligase UBE3A.
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  distinguishing_features:
  - Abnormal 15q11-q13 methylation or a UBE3A variant rather than biallelic HECTD4 variants.
  - Corpus callosum agenesis is not a characteristic Angelman finding.
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HECTD4 and UBE3C are novel biallelic rare disease genes, expand the
      association of the other HECT E3 ligase group with neurodevelopmental
      syndromes, and could explain some of the missing heritability in patients
      with a suggestive clinical diagnosis of Angelman syndrome.
    explanation: The founding paper places these disorders in the Angelman differential.
- name: UBE3C-related neurodevelopmental disorder
  description: >-
    Defined in the same paper: biallelic UBE3C loss of function with an
    Angelman-like picture of absent speech, movement disorder and behavioral
    abnormalities.
  disease_term:
    preferred_term: neurodevelopmental disorder with absent speech and movement and behavioral abnormalities
    term:
      id: MONDO:0859519
      label: neurodevelopmental disorder with absent speech and movement and behavioral abnormalities
  distinguishing_features:
  - Biallelic UBE3C rather than HECTD4 variants.

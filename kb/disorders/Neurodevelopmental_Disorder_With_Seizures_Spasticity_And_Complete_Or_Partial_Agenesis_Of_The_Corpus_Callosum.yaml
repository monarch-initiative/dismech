diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis rests on finding biallelic HECTD4 variants. The founding patients
    were diagnosed by chromosomal analysis and exome sequencing, and the
    replication cases came from exome-based developmental disorder cohorts.
    Patient RNA studies can support a loss-of-function effect of splice or
    truncating alleles.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Chromosomal analysis and exome sequencing were used to identify the
      genetic causes in 10 patients from 7 unrelated families
    explanation: The founding cases were identified by exome sequencing.

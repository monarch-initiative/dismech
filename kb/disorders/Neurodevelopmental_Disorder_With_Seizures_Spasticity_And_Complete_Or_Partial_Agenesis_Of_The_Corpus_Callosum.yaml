notes: >-
  The only clinical description is Faqeih et al. 2023 (PMID:36401616). Its full
  text is not open access, so the only quotable text from it is the abstract.
  Individual-level phenotypes reach this entry through the OMIM description and
  clinical synopsis as mirrored by MedGen (C5830296). The disease-defining
  features are quoted from the MedGen copy of the OMIM description. Synopsis
  features absent from that description carry a notes line naming their
  provenance and no evidence item. The count and severity of intellectual
  disability come from the Genomics England PanelApp review of the paper. The same paper also defines a separate
  UBE3C disorder (kb entry
  Neurodevelopmental_Disorder_With_Absent_Speech_And_Movement_And_Behavioral_Abnormalities);
  sentences of the abstract that describe the combined ten-patient cohort are
  marked INDIRECT wherever they are used here. No GeneReviews chapter exists for
  this disorder or for HECTD4.

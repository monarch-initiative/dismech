    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      frameshift (A339Pfs*32, G148Vfs*113, and H156Ifs*105) or an early
      termination (R234X, Q39X, and R185X)
    explanation: >-
      Documents the frameshift and nonsense/early-termination ELF4 variant
      classes causing loss of protein.
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a missense variant that disrupts the ETS DNA binding domain in exon 7 of
      ELF4
    explanation: >-
      Documents the ETS-domain missense variant class.
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."

treatments:
- name: Anti-TNF Biologic Therapy
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Biologics targeting TNF-alpha are the most common treatment and address the
    excess inflammatory cytokine output; fevers and ulcers responded to TNF (as
    well as IL-1 or IL-12p40) blockade.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Macrophage Hyperinflammatory Response
    description: >-
      Neutralizing TNF-alpha dampens the hyperinflammatory output of ELF4-mutant
      myeloid cells.
    evidence:
    - reference: PMID:34326534
      reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        fevers and ulcers that responded to interleukin-1 (IL-1), tumor necrosis
        factor or IL-12p40 blockade
      explanation: >-
        Fevers and ulcers responded to TNF (and IL-1 / IL-12p40) blockade.
  evidence:
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with the majority of DEX patients treated with biologics targeting TNFα
    explanation: >-
      TNF-alpha-targeting biologics are the predominant treatment across the DEX
      cohort.
- name: IL-1 Blockade
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Interleukin-1 blockade is one of the cytokine-directed options to which
    fevers and ulcers have responded.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fevers and ulcers that responded to interleukin-1 (IL-1), tumor necrosis
      factor or IL-12p40 blockade
    explanation: >-
      Documents response of fevers and ulcers to IL-1 blockade.
- name: Vedolizumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    The gut-selective anti-alpha4beta7 integrin antibody vedolizumab has been an
    effective option for the intestinal disease in DEX.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vedolizumab
      term:
        id: NCIT:C95798
        label: Vedolizumab
  evidence:
  - reference: PMID:39976696
    reference_title: "X-linked Deficiency in ELF4 in Females with Skewed X Chromosome Inactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      novel and effective treatment strategies, such as the use of the biologic
      vedolizumab and exclusive enteral nutrition (EEN), have provided additional
      options for the treatment of DEX
    explanation: >-
      Documents vedolizumab as an effective treatment option in DEX.
notes: >-
  Named for the causal gene and the established disease name (DEX); the serial
  MONDO label "autoinflammatory syndrome, familial, X-linked, Behcet-like 2"
  (AIFBL2) and OMIM 301074 are retained as synonyms. No mechanism-module
  conformance is asserted: ELF4 is a transcriptional regulator of inflammatory
  tone with no current dismech module as a conformance target, consistent with
  the other NF-kB / transcriptional autoinflammatory entries.

- name: TREM1-Driven Neutrophil Recruitment
  biological_scale: CELLULAR
  description: >-
    With ELF4 restraint lost, the inflammation amplifier Trem1 is de-repressed
    and a Th17-skewed response drives neutrophil recruitment to the mucosa; this
    amplifier branch is the mechanistic hook for the gastrointestinal
    ulceration, and blocking Trem1 reverses inflammation in mice carrying
    patient variants.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593

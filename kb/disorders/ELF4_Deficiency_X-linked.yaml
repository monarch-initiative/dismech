name: ELF4 Deficiency, X-linked
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
description: >-
  Deficiency in ELF4, X-linked (DEX) is a monogenic autoinflammatory disease
  caused by loss-of-function variants in the X-linked ETS transcription factor
  gene ELF4. ELF4 normally restrains inflammation: it sustains anti-inflammatory
  genes such as Il1rn and limits inflammation-amplifier genes including S100A8,
  Lcn2 and Trem1, and it supports antiviral gene expression. Loss of ELF4 leaves
  macrophages hyperinflammatory to innate stimuli and impairs control of viral
  replication, producing an early-onset Behçet-like and inflammatory-bowel-
  disease-like syndrome: recurrent oral and gastrointestinal aphthous ulcers,
  fevers, arthritis, and skin inflammation, often with recurrent infections.
  Affected individuals are predominantly male; heterozygous females can be
  affected when X-chromosome inactivation is skewed toward the wild-type allele.
  Treatment has centred on cytokine-blocking biologics, chiefly TNF inhibitors.
synonyms:
- DEX
- deficiency in ELF4, X-linked
- autoinflammatory syndrome, familial, X-linked, Behcet-like 2
- X-linked familial Behcet-like autoinflammatory syndrome 2
- AIFBL2
parents:
- hereditary disease
- autoinflammatory syndrome
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    ELF4 is on the X chromosome. Most reported patients are hemizygous males;
    heterozygous females can be affected, with skewed X-chromosome inactivation
    over-inactivating the wild-type allele.
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discovered loss-of-function variants in the X-linked ETS transcription
      factor gene ELF4 in multiple unrelated male patients with early onset
      mucosal autoinflammation and inflammatory bowel disease (IBD)
      characteristics
    explanation: >-
      Establishes X-linked loss-of-function ELF4 variants in multiple male
      patients.
  - reference: PMID:39976696
    reference_title: "X-linked Deficiency in ELF4 in Females with Skewed X Chromosome Inactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed skewed X chromosome inactivation patterns in all three female
      patients, with over-inactivation of the X chromosome carrying the
      wild-type allele
    explanation: >-
      Documents affected heterozygous females with skewed X-inactivation of the
      wild-type allele.
pathophysiology:
- name: ELF4 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Hemizygous (or, in females, heterozygous with skewed X-inactivation)
    loss-of-function variants in the ETS transcription factor gene ELF4 abolish
    or reduce ELF4 function.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ELF4
    term:
      id: hgnc:3319
      label: ELF4
  evidence:
  - reference: PMID:35266071
    reference_title: "Loss of Function Mutation in ELF4 Causes Autoinflammatory and Immunodeficiency Disease in Human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing found a hemizygous variant in ELF4 (chrX:129205133
      A > G, c.691 T > C, p.W231R)
    explanation: >-
      Documents a representative hemizygous loss-of-function ELF4 variant.
  downstream:
  - target: Loss of ELF4 Transcriptional Control of Inflammation
    causal_link_type: DIRECT
- name: Loss of ELF4 Transcriptional Control of Inflammation
  biological_scale: CELLULAR
  description: >-
    ELF4 is a transcriptional rheostat on inflammation: it sustains anti-
    inflammatory genes such as Il1rn and limits inflammation-amplifier genes
    including S100A8, Lcn2 and Trem1. Loss of ELF4 removes this restraint.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: negative regulation of inflammatory response
    term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    modifier: DECREASED
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Elf4 both sustained the expression of anti-inflammatory genes, such as
      Il1rn, and limited the upregulation of inflammation amplifiers, including
      S100A8, Lcn2, Trem1 and neutrophil chemoattractants
    explanation: >-
      Defines ELF4's dual transcriptional restraint on inflammation that is lost
      in disease.
  downstream:
  - target: Macrophage Hyperinflammatory Response
    causal_link_type: DIRECT
  - target: Impaired Antiviral Control
    causal_link_type: DIRECT
- name: Macrophage Hyperinflammatory Response
  biological_scale: CELLULAR
  description: >-
    ELF4-mutant macrophages respond excessively to a range of innate immune
    stimuli, the cellular engine of the autoinflammation.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we uncovered ELF4-mutant macrophages having hyperinflammatory responses to
      a range of innate stimuli
    explanation: >-
      Documents the hyperinflammatory macrophage phenotype of ELF4-mutant cells.
  downstream:
  - target: Mucosal and Systemic Autoinflammation
    causal_link_type: DIRECT
- name: Impaired Antiviral Control
  biological_scale: CELLULAR
  description: >-
    ELF4 supports antiviral gene expression; mutant cells fail to restrict viral
    replication, contributing to the recurrent-infection (immunodeficiency) arm
    of the disease.
  biological_processes:
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  evidence:
  - reference: PMID:35266071
    reference_title: "Loss of Function Mutation in ELF4 Causes Autoinflammatory and Immunodeficiency Disease in Human."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we showed mutant cells failed to restrict viral replication effectively
      and produced more pro-inflammatory cytokines
    explanation: >-
      Documents impaired antiviral control (and excess cytokines) in ELF4-mutant
      cells.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
- name: Mucosal and Systemic Autoinflammation
  biological_scale: ORGANISM
  description: >-
    Unrestrained innate inflammation produces an early-onset Behçet-like and
    IBD-like syndrome spanning mucosal ulceration, fever, joint and muscle
    inflammation, skin inflammation, and systemic inflammatory markers.
  evidence:
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DEX patients exhibit a heterogeneous clinical phenotype including weight
      loss, oral and gastrointestinal aphthous ulcers, fevers, skin
      inflammation, gastrointestinal symptoms, arthritis, arthralgia, and
      myalgia
    explanation: >-
      Summarises the multiorgan autoinflammatory phenotype produced by the
      mechanism.
  downstream:
  - target: Recurrent aphthous stomatitis
    causal_link_type: DIRECT
  - target: Colitis
    causal_link_type: DIRECT
  - target: Recurrent fever
    causal_link_type: DIRECT
  - target: Arthritis
    causal_link_type: DIRECT
  - target: Arthralgia
    causal_link_type: DIRECT
  - target: Myalgia
    causal_link_type: DIRECT
  - target: Weight loss
    causal_link_type: DIRECT
  - target: Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

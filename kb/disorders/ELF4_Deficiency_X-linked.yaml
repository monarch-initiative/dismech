diagnosis:
- name: Molecular and endoscopic diagnosis
  description: >-
    Diagnosis combines genetic testing (sequencing with copy-number analysis to
    catch exon deletions, and X-inactivation testing in females) with endoscopic
    assessment of the GI tract; CBC/iron studies and ESR/CRP track disease.
  evidence:
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      initial evaluation by upper endoscopy as well as colonoscopy with
      ileoscopy may be informative to determine the extent and location of
      ulceration in the GI tract and to support therapeutic decisions.
    explanation: >-
      Upper endoscopy and colonoscopy with ileoscopy are part of the DEX workup.
animal_models:
- name: Elf4 knock-in mouse (patient-derived variants)
  species: Mouse
  genotype: Elf4 knock-in carrying patient-derived ELF4 variants
  publication: PMID:34326534
  modeled_mechanisms:
  - target: TREM1-Driven Neutrophil Recruitment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Mice carrying patient-derived Elf4 variants show Trem1-amplified mucosal
      inflammation that is reversed by Trem1 blockade.
    limitations: >-
      Mouse mucosal immunology differs from human; the model reports an LPS-driven
      challenge rather than spontaneous DEX-like disease.
    evidence:
    - reference: PMID:34326534
      reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Blockade of Trem1 reversed inflammation and intestine pathology after in
        vivo lipopolysaccharide challenge in mice carrying patient-derived
        variants in Elf4
      explanation: >-
        The patient-variant knock-in mouse recapitulates Trem1-amplified mucosal
        inflammation.
- name: Elf4-knockout mouse
  species: Mouse
  genotype: Elf4 knockout
  publication: PMID:34326534
  modeled_mechanisms:
  - target: Impaired Antiviral Control
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Elf4-null mice are more susceptible to viral infection, modeling the
      antiviral arm of ELF4 function.
    limitations: >-
      Increased susceptibility to West Nile Virus and EAE in mice is not the same
      as the sporadic infections seen in patients.
    evidence:
    - reference: PMID:34326534
      reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mice develop normally but are more susceptible to West Nile Virus12
        infection and experimental autoimmune encephalomyelitis
      explanation: >-
        Elf4-knockout mice model the impaired antiviral defense.
prevalence:
- population: Reported DEX case series and literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DEX is ultra-rare; the 2024 cohort assembled 14 patients from 13 unrelated
    families.
  evidence:
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fourteen patients from thirteen unrelated families with loss-of-function
      mutations in ELF4 leading to DEX
    explanation: >-
      The cohort totals 14 reported DEX patients from 13 families.
notes: >-
  Named for the causal gene and the established disease name (DEX); the serial
  MONDO label "autoinflammatory syndrome, familial, X-linked, Behcet-like 2"
  (AIFBL2) is retained as a synonym. No mechanism-module conformance is asserted:
  ELF4 is a transcriptional regulator of inflammatory tone and there is no
  current dismech module that captures that mechanism as a conformance target.

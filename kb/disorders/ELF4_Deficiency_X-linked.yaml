    modifier: INCREASED
  evidence:
  - reference: PMID:38231408
    reference_title: "\"Deficiency in ELF4, X-Linked\": a Monogenic Disease Entity Resembling Behçet's Syndrome and Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Th17) type was increased in both ELF4-deficient mice and DEX patients and
      associated with increased recruitment of neutrophils, a cell type
      implicated in the pathogenesis of IBD
    explanation: >-
      Documents the Th17-skewed, neutrophil-recruiting amplifier response in both
      patients and mice.
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Blockade of Trem1 reversed inflammation and intestine pathology after in
      vivo lipopolysaccharide challenge in mice carrying patient-derived variants
      in Elf4
    explanation: >-
      Trem1 blockade reverses the mucosal inflammation, identifying the amplifier
      that ELF4 normally restrains.

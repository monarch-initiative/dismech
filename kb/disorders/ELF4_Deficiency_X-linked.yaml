name: ELF4 Deficiency, X-linked
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Deficiency in ELF4, X-linked
  term:
    id: MONDO:0024770
    label: autoinflammatory syndrome, familial, X-linked, Behcet-like 2
description: >-
  Deficiency in ELF4, X-linked (DEX) is a monogenic autoinflammatory disease
  caused by loss-of-function variants in the X-linked ETS transcription factor
  gene ELF4. ELF4 normally restrains inflammation: it sustains anti-inflammatory
  genes such as Il1rn and limits inflammation-amplifier genes including S100A8,
  Lcn2 and Trem1, and it supports antiviral gene expression. Loss of ELF4 leaves
  macrophages hyperinflammatory to innate stimuli and impairs control of viral
  replication, producing an early-onset Behçet-like and inflammatory-bowel-
  disease-like syndrome: recurrent oral and gastrointestinal aphthous ulcers,
  fevers, arthritis, and skin inflammation, often with recurrent infections.
  Affected individuals are predominantly male; heterozygous females can be
  affected when X-chromosome inactivation is skewed toward the wild-type allele.
  Treatment has centred on cytokine-blocking biologics, chiefly TNF inhibitors.
synonyms:
- DEX
- deficiency in ELF4, X-linked
- autoinflammatory syndrome, familial, X-linked, Behcet-like 2
- X-linked familial Behcet-like autoinflammatory syndrome 2
- AIFBL2
parents:
- hereditary disease
- autoinflammatory syndrome
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    ELF4 is on the X chromosome. Most reported patients are hemizygous males;
    heterozygous females can be affected, with skewed X-chromosome inactivation
    over-inactivating the wild-type allele.
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discovered loss-of-function variants in the X-linked ETS transcription
      factor gene ELF4 in multiple unrelated male patients with early onset
      mucosal autoinflammation and inflammatory bowel disease (IBD)
      characteristics
    explanation: >-
      Establishes X-linked loss-of-function ELF4 variants in multiple male
      patients.
  - reference: PMID:39976696
    reference_title: "X-linked Deficiency in ELF4 in Females with Skewed X Chromosome Inactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed skewed X chromosome inactivation patterns in all three female
      patients, with over-inactivation of the X chromosome carrying the
      wild-type allele
    explanation: >-
      Documents affected heterozygous females with skewed X-inactivation of the
      wild-type allele.
genetic:
- name: ELF4 variants
  gene_term:
    preferred_term: ELF4
    term:
      id: hgnc:3319
      label: ELF4
  relationship_type: CAUSATIVE
  notes: >-
    Loss-of-function ELF4 variants cause DEX. Reported classes span frameshift
    (A339Pfs*32, G148Vfs*113, H156Ifs*105) and nonsense/early-termination
    (R234X, Q39X, R185X) alleles that trigger nonsense-mediated decay with loss
    of protein, missense variants disrupting the ETS DNA-binding domain in
    exon 7, an exon 2-7 deletion, and an intronic splice variant. Across 14
    patients from 13 families there are 11 distinct mutations; most are
    maternally inherited (11/12 with known origin), with one confirmed de novo
    (P6).

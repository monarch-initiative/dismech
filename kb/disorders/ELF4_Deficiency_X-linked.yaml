- name: IL-1 Blockade (anakinra)
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Anakinra is recombinant IL-1 receptor antagonist (IL-1Ra). It is recorded
    here as PROTEIN_REPLACEMENT in the specific sense that ELF4 normally sustains
    the endogenous IL-1Ra gene Il1rn, so its loss lowers IL-1Ra; anakinra
    supplies that antagonist. Fevers and ulcers have responded to IL-1 blockade.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Loss of ELF4 Transcriptional Control of Inflammation
    description: >-
      Anakinra replaces the IL-1 receptor antagonist whose gene (Il1rn) ELF4
      normally sustains, restoring antagonism lost when ELF4 is deficient.
    evidence:
    - reference: PMID:34326534
      reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Elf4 both sustained the expression of anti-inflammatory genes, such as
        Il1rn, and limited the upregulation of inflammation amplifiers, including
        S100A8, Lcn2, Trem1 and neutrophil chemoattractants
      explanation: >-
        ELF4 sustains Il1rn (IL-1Ra); anakinra supplies the IL-1Ra that is lost.
  evidence:
  - reference: PMID:34326534
    reference_title: "Human autoinflammatory disease reveals ELF4 as a transcriptional regulator of inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fevers and ulcers that responded to interleukin-1 (IL-1), tumor necrosis
      factor or IL-12p40 blockade
    explanation: >-
      Documents response of fevers and ulcers to IL-1 blockade.

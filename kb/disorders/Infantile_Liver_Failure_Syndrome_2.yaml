  - target: Recurrent Acute Liver Failure
    causal_link_type: DIRECT
    description: Extensive hepatocyte loss during a crisis produces acute liver failure.
  - target: Markedly Elevated Hepatic Transaminases
    causal_link_type: DIRECT
    description: Hepatocyte lysis releases AST and ALT into the circulation.
  - target: Hepatic Necrosis
    causal_link_type: DIRECT
    description: Hepatocyte death is seen as necrosis on liver biopsy.
  - target: Hepatomegaly
    causal_link_type: DIRECT
    description: In the ILFS2 subgroup the liver enlarges during crises and not between them.
    evidence:
    - reference: PMID:40433928
      reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in the other subgroups, hepatomegaly is usually restricted to episodes of liver crises (combined subgroup: 9/14 cases; ILFS2 subgroup: 20/22 cases)"
      explanation: Ties hepatomegaly to the crisis episodes in which hepatocytes are lysed.
  - target: Loss of Hepatic Synthetic and Detoxifying Function
    causal_link_type: DIRECT
    description: Loss of functional hepatocyte mass reduces clotting factor synthesis and ammonia and bilirubin clearance.
- name: Loss of Hepatic Synthetic and Detoxifying Function
  biological_scale: ORGANISM
  description: >-
    The systemic consequence of a liver crisis: coagulopathy from reduced
    clotting factor synthesis, hyperammonemia and hyperbilirubinemia from
    reduced clearance, and hepatic encephalopathy. In the 230-patient cohort,
    the ILFS2 subgroup had higher transaminases, bilirubin, INR and ammonia
    than the SOPH subgroup.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients in the ILFS2 subgroup had significantly higher levels of transaminase activities, bilirubin, INR, and ammonia as well as lower albumin concentrations compared to the SOPH subgroup"
    explanation: Laboratory evidence of synthetic and clearance failure in the ILFS2 subgroup.
  downstream:
  - target: Prolonged Prothrombin Time
    causal_link_type: DIRECT
    description: Reduced hepatic synthesis of clotting factors prolongs the prothrombin time.
  - target: Hyperammonemia
    causal_link_type: DIRECT
    description: Reduced hepatic ammonia clearance raises blood ammonia.
  - target: Hyperbilirubinemia
    causal_link_type: DIRECT
    description: Reduced hepatic bilirubin clearance raises serum bilirubin.
  - target: Hepatic Encephalopathy
    causal_link_type: DIRECT
    description: Liver failure with hyperammonemia causes hepatic encephalopathy.
- name: Impaired ER-Associated Nonsense-Mediated mRNA Decay
  biological_scale: MOLECULAR
  description: >-
    Independently of its trafficking role, NBAS recruits the core NMD factor
    UPF1 to the ER membrane and, with UPF1, controls the stability of
    ER-associated transcripts, especially stress-response transcripts. Nbas
    knockdown in zebrafish embryos impairs degradation of PTC-containing mRNAs.
    Whether loss of this function contributes to ILFS2 is unknown.
  biological_processes:
  - preferred_term: nonsense-mediated decay
    modifier: DECREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:32616520
    reference_title: Identification of a localized nonsense-mediated decay pathway at the endoplasmic reticulum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NBAS and UPF1 coregulate the stability of ER-associated transcripts, in particular those associated with the cellular stress response."
    explanation: Establishes the ER-NMD function of NBAS in cultured cells; it does not study patient cells.
  - reference: PMID:21227923
    reference_title: Dhx34 and Nbas function in the NMD pathway and are required for embryonic development in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also found that Dhx34 and Nbas are required for degradation of PTC-containing mRNAs in zebrafish embryos."
    explanation: Morpholino knockdown in zebrafish shows that the NMD role of Nbas is conserved in vivo.
phenotypes:
- category: Hepatic
  name: Recurrent Acute Liver Failure
  description: >-
    Episodes of acute liver failure triggered by febrile infections, beginning
    in infancy. In the ILFS2 subgroup of the 230-patient cohort, 44 of 48
    patients had at least one ALF episode, with a median of two episodes and
    up to twelve.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Recurrent acute liver failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
    temporality: RECURRENT
  evidence:

name: Infantile Liver Failure Syndrome 2
creation_date: "2026-10-18T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: infantile liver failure syndrome 2
  term:
    id: MONDO:0014659
    label: infantile liver failure syndrome 2
description: >-
  Infantile liver failure syndrome 2 (ILFS2) is an autosomal recessive disorder
  caused by biallelic variants in NBAS, which encodes a 2371-amino-acid
  peripheral membrane subunit of the syntaxin 18 complex that tethers vesicles
  returning from the Golgi to the endoplasmic reticulum (ER). The defining
  presentation is recurrent acute liver failure beginning in infancy, triggered
  by febrile infections, with transaminases that rise into the thousands during
  a crisis and usually normalise between crises. In the ILFS2 genetic subgroup,
  about 90% of patients develop hepatic encephalopathy, and the median maximum
  INR during crises is 8.
  The mechanistic link between fever and liver failure is thermal instability:
  patient fibroblasts carry reduced NBAS and p31 protein, and both the protein
  and its vesicle-tethering function are more sensitive to raised temperature
  than in control cells. At 40 C, patient fibroblasts develop ER stress,
  accumulate reactive oxygen species and undergo apoptosis. The step from
  that fibroblast result to hepatocyte death is inferred rather than measured
  in liver cells. Crises become less frequent with age but can occur into
  adulthood; ALF is the leading cause of death. Management is an emergency
  protocol of early antipyresis and anabolic glucose and lipid infusion, with
  N-acetylcysteine under evaluation and liver transplantation for severe
  recurrent disease.
synonyms:
- ILFS2
- NBAS infantile liver failure
- infantile liver failure caused by mutation in NBAS
- infantile liver failure syndrome type 2
- NBAS-associated recurrent acute liver failure
notes: >-
  Scope. Biallelic NBAS variants cause a disease spectrum that an international
  110-patient study divided into three clinical subgroups according to the
  affected protein region: Sec39 (ILFS2), C-terminal (SOPH syndrome: short
  stature, optic atrophy, Pelger-Huet anomaly) and beta-propeller (a combined
  hepatic and multisystem phenotype). This entry is bound to MONDO:0014659
  (OMIM 616483). SOPH syndrome has its own MONDO term (MONDO:0013889, OMIM
  614800) and its own stub in the curation queue, so it is recorded here as a
  differential diagnosis rather than as a subtype. The beta-propeller combined
  phenotype has no MONDO term; its patients present with recurrent ALF and fall
  under the ILFS2 clinical label in most case reports, so its extrahepatic
  features (short stature, skeletal fragility, immune abnormalities,
  developmental delay) are recorded as phenotypes here without frequencies.
  Cohort frequencies quoted from the NBAS cohorts are either ILFS2-subgroup
  figures (stated as such) or whole-cohort figures, which are not ILFS2
  frequencies and are not used to set `frequency`.

  Orphanet. ORPHA:391677 is the Orphanet code that MONDO maps to SOPH syndrome
  (MONDO:0013889), not to ILFS2; the deep-research report's suggestion of it
  as an ILFS2 identifier is not used.

  No GeneReviews chapter exists for NBAS or ILFS2: PubMed esearch for
  `NBAS AND genereviews[book]` and `infantile liver failure[TI] AND
  genereviews[book]` returned no records on 2026-10-18.

  No mechanism module fits. `er_protein_storage_disease` models toxic retention
  of a misfolded secretory protein (a gain-of-function storage cascade), which
  is not the NBAS lesion, and no module in kb/modules covers Golgi-to-ER
  retrograde trafficking or temperature-sensitive protein complexes.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic NBAS variants, homozygous in consanguineous families and compound
    heterozygous in outbred families, with parental carrier status confirmed by
    segregation.
  evidence:
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in five unrelated individuals with fever-dependent RALF revealed biallelic mutations in NBAS."
    explanation: The discovery study identifies biallelic NBAS variants in every affected individual.
  - reference: PMID:26578240
    reference_title: "Neuroblastoma Amplified Sequence (NBAS) mutation in recurrent acute liver failure: Confirmatory report in a sibship with very early onset, osteoporosis and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous c.409C > T (p.Arg137Trp) missense mutation in NBAS was identified in all patients."
    explanation: Homozygous segregation in three affected siblings of a consanguineous family, consistent with recessive inheritance.
  - reference: PMID:35076915
    reference_title: "[Clinical features and genetic testing of a child with hepatic failure syndrome type 2]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two variants were respectively inherited from his father and mother."
    explanation: Compound heterozygous variants inherited one from each carrier parent.
prevalence:
- population: Worldwide, published cases (ILFS2 genetic subgroup)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    In a 2025 international observational study of 230 individuals with
    biallelic NBAS variants, new and previously published, 48 were assigned to
    the ILFS2 (Sec39) subgroup and 18 to the combined (beta-propeller) subgroup.
    No population prevalence estimate exists.
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the type and localisation of the NBAS variants, 48 patients were assigned to the ILFS2 subgroup, 125 patients to the SOPH subgroup and 18 patients to the combined phenotype."
    explanation: The largest published case count, by genetic subgroup.
progression:
- phase: Onset
  notes: >-
    In the ILFS2 subgroup of the 230-patient cohort, the first liver crisis
    occurred at a median of 1.1 years (range 0.17 to 3.25 years).
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at first ELT crisis/ALF episode in years; median (range) | 0.9 (0–11) | 1 (0–3) | 1.1 (0.17–3.25)"
    explanation: Table row giving age at first crisis; the third value is the ILFS2 subgroup.
- phase: Recurrent febrile crises with interval recovery
  notes: >-
    Crises are triggered by febrile infections, and transaminases normalised
    between crises in 34 of 37 ILFS2-subgroup patients with data. Crises become
    less frequent with age; the median age at the last ALF episode was 5 years,
    but the latest recorded ALF occurred at 24 years.
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset was 0.9 years, the median age at last ALF 5 years, the latest ALF occurred at 24 years."
    explanation: Whole-cohort timing of first and last crises.
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "most patients in the combined (88.9%) and ILFS2 (91.7%) subgroups experienced at least one episode of ALF, and transaminases commonly normalised after the crises (combined: 14/17; ILFS2: 34/37)"
    explanation: Interval normalisation of transaminases in the ILFS2 subgroup.
  - reference: PMID:26541327
    reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver crises are triggered by febrile infections; they become less frequent with age but are not restricted to childhood."
    explanation: An earlier 14-patient series reports the same age trend; it overlaps in patients with the later cohort, so it is not independent replication.
- phase: Outcome
  notes: >-
    In the ILFS2 subgroup, 16 of 48 patients (33.3%) did not survive with their
    native liver (death or transplantation). Across all 230 patients, 24 died
    (median age 2.2 years) and ALF caused two thirds of deaths; apart from one
    death during transplantation, ALF was the only cause of death in the ILFS2
    and combined subgroups.
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non‐native liver survival | 34 (14.8%) | 7 (38.9%)* | 16 (33.3%)*"
    explanation: Table row; the third value is the ILFS2 subgroup.
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Except for one patient who died during liver transplantation, ALF was the only cause of death in the combined and ILFS2 subgroups"
    explanation: ALF as the cause of death in the ILFS2 subgroup.
pathophysiology:
- name: Biallelic NBAS Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline variants in NBAS at 2p24.3. The allelic series is large
    and mostly private: missense, nonsense, frameshift, canonical and deep
    intronic splice variants, and exon deletions have all been reported. In the
    110-patient cohort, missense variants and in-frame deletions in the Sec39
    domain defined the ILFS2 subgroup. In China, c.3596G>A (p.Cys1199Tyr) is a
    recurrent allele strongly associated with the liver-failure phenotype.
  genes:
  - preferred_term: NBAS
    term:
      id: hgnc:15625
      label: NBAS
  genetic_context:
    variant_origin: GERMLINE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in five unrelated individuals with fever-dependent RALF revealed biallelic mutations in NBAS."
    explanation: Discovery of biallelic NBAS variants as the cause of fever-dependent recurrent acute liver failure.
  - reference: PMID:31761904
    reference_title: Defining clinical subgroups and genotype-phenotype correlations in NBAS-associated disease across 110 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three clinical subgroups arise that differ significantly regarding main clinical features and are directly related to the affected region of the NBAS protein: β-propeller (combined phenotype), Sec39 (infantile liver failure syndrome type 2/ILFS2), and C-terminal (short stature, optic atrophy, and Pelger-Huët anomaly/SOPH)"
    explanation: Ties the ILFS2 phenotype to variants affecting the Sec39 region of NBAS.
  - reference: PMID:39606973
    reference_title: "[Clinical features and genetic study of four cases of pediatric acute liver failure caused by NBAS gene variants]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.3596G>A variant site is a hotspot mutation in China and is strongly correlated with the liver failure phenotype."
    explanation: Identifies a recurrent liver-failure allele in Chinese patients, from a literature review of 51 patients plus four new cases.
  downstream:
  - target: Reduced NBAS and p31 Protein Levels
    causal_link_type: DIRECT
    description: Pathogenic NBAS alleles lower the steady-state amount of NBAS and of its binding partner p31.
    evidence:
    - reference: PMID:26073778
      reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Immunoblot analysis of mutant fibroblasts showed reduced protein levels of NBAS and its proposed interaction partner p31, both involved in retrograde transport between endoplasmic reticulum and Golgi."
      explanation: Immunoblots of patient fibroblasts show that the variants reduce NBAS and p31 protein.
  - target: Impaired ER-Associated Nonsense-Mediated mRNA Decay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from the known NMD function of NBAS. No study has measured NMD
      in ILFS2 patient cells, so this edge is a hypothesis.
- name: Reduced NBAS and p31 Protein Levels
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts carry less NBAS protein and less p31 (USE1), the SNARE
    to which the NBAS N-terminus binds within the syntaxin 18 complex. In
    HeLa cells, knockdown of NBAS alone lowers p31, so the p31 reduction
    follows from NBAS loss.
  genes:
  - preferred_term: NBAS
    term:
      id: hgnc:15625
      label: NBAS
  molecular_functions:
  - preferred_term: binding of NBAS to the SNARE p31
    modifier: DECREASED
    term:
      id: GO:0000149
      label: SNARE binding
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblot analysis of mutant fibroblasts showed reduced protein levels of NBAS and its proposed interaction partner p31, both involved in retrograde transport between endoplasmic reticulum and Golgi."
    explanation: Direct measurement of reduced NBAS and p31 in patient cells.
  - reference: PMID:19369418
    reference_title: Identification of the neuroblastoma-amplified gene product as a component of the syntaxin 18 complex implicated in Golgi-to-endoplasmic reticulum retrograde transport.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockdown of NAG resulted in a reduction in the expression of p31, confirming their intimate relationship."
    explanation: Experimental NBAS (NAG) knockdown reduces p31, which explains the paired reduction seen in patient cells.
  - reference: PMID:19369418
    reference_title: Identification of the neuroblastoma-amplified gene product as a component of the syntaxin 18 complex implicated in Golgi-to-endoplasmic reticulum retrograde transport.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Binding studies showed that the extreme N-terminal region of p31 is responsible for the interaction with NAG and that the N- and the C-terminal regions of NAG interact with p31 and ZW10-RINT-1, respectively."
    explanation: Establishes NBAS (NAG) binding to the SNARE p31, the molecular function reduced when NBAS and p31 levels fall.
  downstream:
  - target: Thermal Instability of the NBAS-Containing Syntaxin 18 Complex
    causal_link_type: DIRECT
    description: The residual mutant complex is less stable at raised temperature than the wild-type complex.
    evidence:
    - reference: PMID:26541327
      reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patients' fibroblasts showed an increased sensitivity to high temperature at protein and functional level and a disturbed tethering of vesicles"
      explanation: Shows that the reduced protein in patient fibroblasts is further destabilised by high temperature.
  - target: Impaired Golgi-to-ER Retrograde Vesicle Tethering
    causal_link_type: DIRECT
    description: Loss of NBAS from the syntaxin 18 complex impairs tethering of Golgi-derived vesicles at the ER.
    evidence:
    - reference: PMID:26541327
      reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patients' fibroblasts showed an increased sensitivity to high temperature at protein and functional level and a disturbed tethering of vesicles, pointing at a defect of intracellular transport between the endoplasmic reticulum and Golgi."
      explanation: Vesicle tethering is disturbed in patient fibroblasts carrying reduced NBAS.
  - target: Impaired Anterograde Secretion of Large Cargo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed in a review as the explanation for extrahepatic features; not
      measured in NBAS patient cells.
    evidence:
    - reference: PMID:38279772
      reference_title: "Disorders of vesicular trafficking presenting with recurrent acute liver failure: NBAS, RINT1, and SCYL1 deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The impairment of protein secretion by compromised antegrade transport provides a possible explanation for different organ manifestations such as bone alteration due to lack of collagens or diabetes mellitus when insulin secretion is affected."
      explanation: The review states this link as a possible explanation, which is why the edge is marked as having unknown intermediates.
- name: Thermal Instability of the NBAS-Containing Syntaxin 18 Complex
  biological_scale: MOLECULAR
  description: >-
    The step that makes the disease episodic. At febrile temperature, the
    residual NBAS complex in patient cells loses further protein and function.
    The 2016 series names thermal susceptibility of the syntaxin 18 complex as
    the basis of the fever dependency of liver crises.
  genes:
  - preferred_term: NBAS
    term:
      id: hgnc:15625
      label: NBAS
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:26541327
    reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thermal susceptibility of the syntaxin 18 complex is the basis of fever dependency of ALF episodes."
    explanation: The authors' conclusion from their fibroblast temperature experiments.
  downstream:
  - target: Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: Culture of patient fibroblasts at 40 C induces ER stress.
    evidence:

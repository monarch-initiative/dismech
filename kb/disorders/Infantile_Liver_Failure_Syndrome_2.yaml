genetic:
- name: NBAS
  gene_term:
    preferred_term: NBAS
    term:
      id: hgnc:15625
      label: NBAS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NBAS (2p24.3) encodes the NBAS subunit of the syntaxin 18 / NRZ tethering
    complex. ILFS2 is associated with variants in the Sec39 region; variants in
    the beta-propeller give a combined hepatic and multisystem phenotype, and
    C-terminal variants (including the Yakut founder p.Arg1914His) give SOPH
    syndrome. In Chinese patients, c.3596G>A (p.Cys1199Tyr) was found in 23 of
    51 reported patients. Deep intronic and canonical splice variants have been
    confirmed by RNA sequencing and minigene assays. No ClinGen gene-disease
    validity record for NBAS is cached in this repository, so no validity tier
    is recorded.
  evidence:
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent Sanger sequencing of NBAS in 15 additional unrelated individuals with RALF or ALF identified compound heterozygous mutations in an additional six individuals from five families."
    explanation: Replication of biallelic NBAS variants in further families within the discovery study.
  - reference: PMID:39606973
    reference_title: "[Clinical features and genetic study of four cases of pediatric acute liver failure caused by NBAS gene variants]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A literature study revealed that out of 51 Chinese patients with NBAS gene variants, 98.0% (50/51) had liver involvement, and 37 cases showed PALF."
    explanation: Liver involvement in nearly all of 51 reported Chinese patients with NBAS variants.
  - reference: PMID:41132786
    reference_title: A novel splicing variant in NBAS identified by minigene assay causes infantile liver failure syndrome type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assays confirmed that c.1600-1G>T causes aberrant pre-mRNA splicing"
    explanation: Functional confirmation of a splice variant found in trans with p.Cys1199Tyr in a child with recurrent ALF.
environmental:
- name: Febrile infection
  description: >-
    Fever during infection is the trigger of liver crises, not a cause of the
    disease. Other reported triggers include the postnatal catabolic period,
    fever after vaccination, surgery and chemotherapy.
  notes: >-
    No exposure_term is bound. Fever is an endogenous state, and OLS searches of
    ECTO on 2026-10-18 for "fever", "febrile", "hyperthermia" and "infection"
    returned only pathogen-specific exposures (for example exposure to Yellow
    fever virus) and no generic febrile-illness exposure.
  influences_mechanisms:
  - target: Thermal Instability of the NBAS-Containing Syntaxin 18 Complex
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Raised body temperature further destabilises the mutant NBAS complex.
    evidence:
    - reference: PMID:26541327
      reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thermal susceptibility of the syntaxin 18 complex is the basis of fever dependency of ALF episodes."
      explanation: Links the clinical fever dependency to the thermal instability shown in patient fibroblasts.
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Febrile infections were reported as a trigger of liver crises in all but one affected patient."
    explanation: Febrile infection as the near-universal crisis trigger in the 230-patient cohort.
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to febrile infections, reported triggers were postnatal catabolic period, fever post‐vaccination, chemotherapy, surgery, difficult intravenous sampling or catheterization, cold or hot temperatures, long‐distance travel, and the end of interferon therapy."
    explanation: The other reported crisis triggers.
diagnosis:
- name: Exome sequencing for biallelic NBAS variants
  description: >-
    There are no specific biomarkers, so the diagnosis rests on finding biallelic
    NBAS variants, usually by exome sequencing in a child with recurrent ALF of
    unknown cause, especially when crises follow fever.
  evidence:
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend NBAS analysis in individuals with acute infantile liver failure, especially if triggered by fever."
    explanation: Recommendation from the discovery study.
  - reference: PMID:38279772
    reference_title: "Disorders of vesicular trafficking presenting with recurrent acute liver failure: NBAS, RINT1, and SCYL1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no specific biomarkers for these diseases, and whole exome sequencing should be performed in patients with RALF of unknown etiology."
    explanation: Review recommendation for exome sequencing in RALF of unknown cause.
- name: RNA and minigene analysis of splice-affecting NBAS variants
  description: >-
    Deep intronic or splice-site variants may be missed or left uncertain by
    DNA sequencing; fibroblast RNA sequencing and minigene assays have
    confirmed their effect.
  evidence:
  - reference: PMID:40215727
    reference_title: RNA sequencing driven diagnosis expands the phenotypic spectrum of NBAS deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNAseq performed on her skin fibroblasts showed that NBAS gene expression was significantly reduced compared with controls."
    explanation: RNA sequencing found an NBAS defect after non-diagnostic genome sequencing; the patient had a severe multisystem phenotype rather than classic ILFS2.
  - reference: PMID:41132786
    reference_title: A novel splicing variant in NBAS identified by minigene assay causes infantile liver failure syndrome type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assays confirmed that c.1600-1G>T causes aberrant pre-mRNA splicing"
    explanation: Minigene confirmation of a splice variant in an ILFS2 patient.
treatments:
- name: Early Antipyretic Therapy
  description: >-
    Part of the emergency protocol: start antipyretics as soon as fever begins.
    The 230-patient study recommends metamizole, because ibuprofen raises
    bleeding risk when liver function is impaired and paracetamol toxicity
    produces reactive oxygen species, which may contribute to the disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metamizole
      term:
        id: CHEBI:62088
        label: metamizole
  target_mechanisms:
  - target: Thermal Instability of the NBAS-Containing Syntaxin 18 Complex
    description: Lowering body temperature limits the thermal destabilisation of the mutant complex.
  evidence:
  - reference: PMID:26541327
    reference_title: "Recurrent acute liver failure due to NBAS deficiency: phenotypic spectrum, disease mechanisms, and therapeutic concepts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antipyretic therapy and induction of anabolism including glucose and parenteral lipids effectively ameliorates the course of liver crises."
    explanation: Clinical observation in a 14-patient series; not a controlled trial.
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For antipyretic therapy, we recommend metamizole (8–16 mg/kg body weight as a single dose orally or parenterally at minimum intervals of 6 h, maximum single dose: 1000 mg), considering the increased risk of bleeding when using ibuprofen in the context of impaired liver function and the fact that paracetamol toxicity induces reactive oxidative species, which might play a role in the pathogenesis of the disease"
    explanation: Expert recommendation of the antipyretic agent and of agents to avoid.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute liver failure | 95 (41.3%) | 16 (88.9%)* | 44 (91.7%)*"
    explanation: Table row; 44 of 48 ILFS2-subgroup patients (91.7%) had ALF, the basis for VERY_FREQUENT.
  - reference: PMID:26073778
    reference_title: Biallelic Mutations in NBAS Cause Recurrent Acute Liver Failure with Onset in Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in five unrelated individuals with fever-dependent RALF revealed biallelic mutations in NBAS."
    explanation: Fever-dependent recurrent ALF was the presentation through which the disease was defined.
- category: Hepatic
  name: Markedly Elevated Hepatic Transaminases

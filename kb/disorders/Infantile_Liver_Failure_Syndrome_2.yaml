      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate that elevated temperature induces ER stress in fibroblasts from individuals with NBAS variants, leading to increased reactive oxygen species (ROS) production and apoptosis."
      explanation: Temperature elevation of NBAS-deficient fibroblasts produces ER stress; the cells are fibroblasts, not hepatocytes.
- name: Impaired Golgi-to-ER Retrograde Vesicle Tethering
  biological_scale: CELLULAR
  description: >-
    NBAS links p31 to the ZW10-RINT1 subcomplex, which tethers COPI vesicles
    returning from the Golgi to the ER. Depleting NBAS in cultured cells
    redistributes Golgi recycling proteins and causes a protein glycosylation
    defect, and patient fibroblasts show disturbed vesicle tethering. The 2025
    review proposes that impaired retrograde transport also impairs membrane
    recycling and autophagy.
  biological_processes:
  - preferred_term: Golgi-to-ER retrograde transport
    modifier: DECREASED
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:19369418
    reference_title: Identification of the neuroblastoma-amplified gene product as a component of the syntaxin 18 complex implicated in Golgi-to-endoplasmic reticulum retrograde transport.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NAG depletion did not substantially affect Golgi morphology and protein export from the ER, but it caused redistribution of Golgi recycling proteins accompanied by a defect in protein glycosylation."
    explanation: Knockdown of NBAS (NAG) in cultured cells disrupts Golgi-to-ER recycling.
  - reference: PMID:38279772
    reference_title: "Disorders of vesicular trafficking presenting with recurrent acute liver failure: NBAS, RINT1, and SCYL1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dysfunction of retrograde transport impairs membrane recycling and autophagy."
    explanation: Review statement of the cellular consequences of the retrograde transport defect.
  downstream:

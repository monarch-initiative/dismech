differential_diagnoses:
- name: SOPH syndrome
  description: >-
    The allelic C-terminal NBAS disorder (short stature, optic atrophy,
    Pelger-Huet anomaly). Most SOPH patients have no liver involvement or
    persistently raised transaminases without ALF.
  distinguishing_features:
  - Liver failure is uncommon (5.6% of the SOPH subgroup) and transaminases often stay raised between episodes.
  - Short stature and optic atrophy lead the phenotype; C-terminal NBAS variants, including the Yakut founder p.Arg1914His.
  disease_term:
    preferred_term: SOPH syndrome
    term:
      id: MONDO:0013889
      label: short stature-optic atrophy-Pelger-Huët anomaly syndrome
  evidence:
  - reference: PMID:40433928
    reference_title: "Hepatic Phenotype in NBAS-Associated Disease: Clinical Course, Prognostic Factors and Outcome in 230 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOPH (stature, optic atrophy, Pelger-Huët anomaly) patients mostly had either no liver involvement (66.4%) or persistently elevated transaminases without ALF (28%)"
    explanation: Hepatic difference between SOPH and ILFS2 subgroups.
- name: Infantile liver failure syndrome 3 (RINT1) and CALFAN syndrome (SCYL1)
  description: >-
    The two other vesicular-trafficking disorders presenting with fever-triggered
    recurrent ALF. RINT1 is a partner of NBAS in the NRZ complex.
  distinguishing_features:
  - SCYL1 disease follows a progressive cholestatic course, whereas NBAS and RINT1 crises lessen with age.
  - No biomarker separates the three; exome sequencing is needed.
  evidence:
  - reference: PMID:38279772
    reference_title: "Disorders of vesicular trafficking presenting with recurrent acute liver failure: NBAS, RINT1, and SCYL1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While the frequency and severity of liver crises in NBAS and RINT1-associated disease decrease with age, patients with SCYL1 variants present with a progressive, cholestatic course."
    explanation: Review contrasting the course of the three disorders.
- name: Infantile liver failure syndrome 1 (LARS1)
  description: Recessive LARS1 deficiency, also a cause of infantile liver failure triggered by febrile illness.
  distinguishing_features:
  - Biallelic LARS1 rather than NBAS variants on sequencing.
  disease_term:
    preferred_term: infantile liver failure syndrome 1
    term:
      id: MONDO:0024568
      label: infantile liver failure syndrome 1
  evidence:
  - reference: PMID:33520894
    reference_title: "Case Report: Pediatric Recurrent Acute Liver Failure Caused by Neuroblastoma Amplified Sequence (NBAS) Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies have revealed that deleterious mutations in cytosolic leucine-tRNA synthetase (LARS) and RINT1 gene mutations are common in liver failure syndrome-1 (ILFS1) (19) and liver failure syndrome-3 (ILFS3) (20), respectively."
    explanation: An NBAS case report naming LARS1 (ILFS1) and RINT1 (ILFS3) as genetic differentials it excluded.
experimental_models:
- name: ILFS2 patient fibroblasts cultured at 40 C
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from three individuals with ILFS2 and one control, grown at
    37 C or 40 C and studied by western blot, immunofluorescence, electron
    microscopy and flow cytometry.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:42358045
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Heat-induced ER stress in patient fibroblasts is the cellular model of a febrile crisis.
    limitations: >-
      Fibroblasts are not hepatocytes and lack their secretory load, so the
      model cannot show why the liver fails; three patient lines against one
      control.
    evidence:
    - reference: PMID:42358045
      reference_title: Pathomechanism of Fever-Induced Liver Failure in NBAS Deficiency and Treatment Effect of NAC-Observations In Vitro and In Vivo.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate that elevated temperature induces ER stress in fibroblasts from individuals with NBAS variants"
      explanation: The model reproduces the temperature-dependent ER stress node.
animal_models:
- name: Zebrafish nbas morphant
  species: Zebrafish
  genotype: Morpholino knockdown of nbas
  publication: PMID:21227923
  description: Morpholino-induced Nbas depletion in zebrafish embryos causes severe developmental defects and loss of NMD.
  modeled_mechanisms:
  - target: Impaired ER-Associated Nonsense-Mediated mRNA Decay
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Shows that Nbas depletion impairs degradation of PTC-containing mRNAs in vivo.
    limitations: >-
      A transient, near-complete embryonic knockdown, unlike the partial
      loss of function in ILFS2; no liver or fever phenotype was studied, and the
      ER-localised arm of NMD was not examined.
    evidence:
    - reference: PMID:21227923
      reference_title: Dhx34 and Nbas function in the NMD pathway and are required for embryonic development in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also found that Dhx34 and Nbas are required for degradation of PTC-containing mRNAs in zebrafish embryos."
      explanation: Direct measurement of the NMD defect in the morphant.
discussions:
- discussion_id: ilfs2_hepatocyte_death_unmeasured
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Hepatocytolysis
  - pathophysiology#Apoptotic Cell Death
  prompt: >-
    Does the heat-induced ER stress, ROS and apoptosis cascade seen in patient
    fibroblasts also occur in hepatocytes, and why is the liver the organ that
    fails?
  rationale: >-
    Every measured step after reduced NBAS protein comes from skin fibroblasts.
    The step to hepatocyte death rests on a review statement and on the
    hypothesis that hepatocytes are vulnerable because of their secretory load.
    No patient hepatocyte, iPSC-derived hepatocyte or liver organoid study has
    been reported.
- discussion_id: ilfs2_nmd_contribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired ER-Associated Nonsense-Mediated mRNA Decay
  prompt: >-
    Does loss of the ER-localised NMD function of NBAS contribute to ILFS2, or is
    the disease explained by the trafficking defect alone?
  rationale: >-
    NBAS has an NMD role that is independent of its trafficking role and that
    controls ER stress-response transcripts, which could feed the ER stress
    node. NMD has not been measured in patient cells.

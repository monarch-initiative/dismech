    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a novel missense variant of AIFM1 in a X-linked recessive Chinese family with childhood-onset, slowly progressive, isolated axonal motor and sensory neuropathy."
    explanation: Documents childhood-onset slowly progressive motor (and sensory) neuropathy in a CMTX4 family.
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were severely affected within the first few years of life with distal weakness, muscle atrophy, sensory loss, areflexia, pes cavus, and hammer toes."
    explanation: All seven affected males of the original Cowchock family had early distal weakness, supporting a VERY_FREQUENT band.


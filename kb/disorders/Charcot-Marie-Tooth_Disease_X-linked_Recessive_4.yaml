name: Charcot-Marie-Tooth Disease X-linked Recessive 4
creation_date: "2026-07-31T00:00:00Z"
category: Genetic
description: >
  Charcot-Marie-Tooth disease X-linked recessive 4 (CMTX4), also known as
  Cowchock syndrome, is a rare, slowly progressive X-linked recessive axonal
  peripheral sensorimotor neuropathy caused by mutations in AIFM1, the gene
  encoding apoptosis-inducing factor mitochondrion-associated 1 (AIF). The
  originally described phenotype comprises the triad of axonal motor and
  sensory neuropathy, sensorineural deafness, and cognitive impairment, with
  onset from the neonatal period to early childhood. Distal muscle weakness
  and atrophy predominate in the peroneal (lower-limb) compartment, with pes
  cavus, areflexia, and a length-dependent stocking-glove sensory deficit.
  AIFM1 is a mitochondrial FAD-dependent NADH oxidoreductase imported into the
  intermembrane space, where it supports assembly of the oxidative
  phosphorylation (OXPHOS) complexes; it also has a distinct pro-apoptotic
  function when cleaved and released to the nucleus. Because AIFM1 is
  X-linked, affected individuals are hemizygous males and obligate female
  carriers are typically asymptomatic. The broader AIFM1 allelic spectrum
  ranges from this predominantly peripheral-nerve phenotype to severe infantile
  mitochondrial encephalomyopathy and a cerebellar-ataxia-predominant form
  (CMTX4 "with cerebellar ataxia").
disease_term:
  preferred_term: Charcot-Marie-Tooth disease X-linked recessive 4
  term:
    id: MONDO:0010689
    label: Charcot-Marie-Tooth disease X-linked recessive 4
parents:
- Charcot-Marie-Tooth Disease
synonyms:
- Cowchock syndrome
- CMTX4
- CMT4X
- Neuropathy, axonal motor-sensory, with deafness and intellectual disability

pathophysiology:
- name: AIFM1 Mutation and Altered AIF Redox Function
  biological_scale: MOLECULAR
  description: >
    CMTX4 is caused by hemizygous missense mutations in AIFM1, encoding
    apoptosis-inducing factor (AIF), an FAD-dependent NADH oxidoreductase
    imported into the mitochondrial intermembrane space. The founding
    p.Glu493Val mutation lies at a highly conserved residue and alters the
    redox properties of AIF, increasing apoptotic cell death without impairing
    the enzymatic activity of the respiratory chain complexes — implicating a
    change in AIF's redox/apoptotic behaviour rather than a simple loss of
    OXPHOS enzyme activity.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  molecular_functions:
  - preferred_term: NADH oxidoreductase activity
    term:
      id: GO:0003954
      label: NADH dehydrogenase activity
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Impaired Mitochondrial OXPHOS Complex Assembly
    description: >
      AIF supports import-dependent assembly of the mitochondrial respiratory
      chain; pathogenic AIFM1 variants perturb this function in peripheral
      neurons.
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of an affected individual from the originally described family identified a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor (AIF) mitochondrion-associated 1."
    explanation: Identifies the founding AIFM1 p.Glu493Val mutation as the cause of Cowchock syndrome/CMTX4.
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The c.1478A>T (p.Glu493Val) mutation found in the family reported here alters the redox properties of the AIF protein and results in increased cell death via apoptosis, without affecting the activity of the respiratory chain complexes."
    explanation: Establishes that the Cowchock mutation acts by altering AIF redox properties and increasing apoptosis rather than by directly impairing respiratory chain enzyme activity.

- name: Impaired Mitochondrial OXPHOS Complex Assembly
  biological_scale: MOLECULAR
  description: >
    AIFM1 forms a redox-regulated complex with the mitochondrial intermembrane
    space import and assembly protein MIA40 (CHCHD4), and deficiency of either
    protein impairs assembly of mitochondrial respiratory complex I (and
    complex IV). A neuropathy-associated AIFM1 missense mutation (p.Phe210Leu)
    caused abnormal assembly of mitochondrial complexes I and III, providing a
    mechanistic link between AIFM1 dysfunction and defective oxidative
    phosphorylation in affected peripheral nerve.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  biological_processes:
  - preferred_term: Mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: ABNORMAL
  - preferred_term: Protein import into mitochondrial intermembrane space
    term:
      id: GO:0045041
      label: protein import into mitochondrial intermembrane space
    modifier: ABNORMAL
  downstream:
  - target: Mitochondrial Dysfunction in Peripheral Neurons
    description: >
      Misassembled OXPHOS complexes reduce the mitochondrial energy supply
      available to metabolically demanding peripheral axons.
  evidence:
  - reference: PMID:28888069
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this Phe210Leu mutation resulted in abnormal assembly of mitochondrial complex I and III, and failed to disrupt AIFM1 binding with mitochondrial intermembrane space import and assembly protein 40 (MIA40) in the patients' cells."
    explanation: Patient fibroblast study showing a CMTX4-associated AIFM1 mutation causes misassembly of OXPHOS complexes I and III.
  - reference: PMID:28888069
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deficiency of either AIFM1 or MIA40 is known to impair the assembly of mitochondrial complex I and IV."
    explanation: Establishes the AIFM1/MIA40 axis as required for assembly of mitochondrial respiratory complexes.

- name: Mitochondrial Dysfunction in Peripheral Neurons
  biological_scale: CELLULAR
  description: >
    AIFM1 dysfunction produces abnormal mitochondrial morphology and
    accumulation within the axoplasm of peripheral nerve fibres and the
    subsarcolemmal region of muscle, reflecting disturbed mitochondrial
    homeostasis in the long peripheral neurons that are most dependent on
    sustained mitochondrial energy supply and transport.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Distal Axonal Degeneration
    description: >
      Neuronal mitochondrial dysfunction drives length-dependent dying-back
      degeneration of the longest peripheral axons.
  evidence:
  - reference: PMID:30031633
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologies exhibited abnormal mitochondrial morphology and accumulation in axoplasm of nerve fiber and subsarcolemmal area of muscle."
    explanation: Nerve/muscle pathology in a CMTX4 family shows abnormal mitochondrial morphology and axoplasmic accumulation, linking AIFM1 mutation to neuronal mitochondrial dysfunction.

- name: Distal Axonal Degeneration
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >
    The final common pathway in CMTX4 is length-dependent axonal degeneration
    of peripheral nerves, producing a large-fibre sensorimotor axonal
    neuropathy. The longest axons — those of the distal lower limbs — are
    affected first, yielding the characteristic distal-predominant weakness,
    atrophy, and sensory loss.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Distal Muscle Weakness
  - target: Distal Sensory Impairment
  - target: Distal Lower Limb Amyotrophy
  - target: Pes Cavus
  - target: Areflexia
  evidence:
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurophysiology demonstrated length-dependent large-fibre sensorimotor axonal neuropathy, with particular involvement of superficial radial sensory responses."
    explanation: Neurophysiology in an AIFM1/CMTX4 family confirms a length-dependent large-fibre sensorimotor axonal neuropathy as the core lesion.

phenotypes:
- name: Peripheral Axonal Neuropathy
  category: Neurological
  frequency: OBLIGATE
  description: >
    A length-dependent, large-fibre sensorimotor axonal peripheral neuropathy
    is the defining and constant feature of CMTX4, with motor and sensory
    involvement and preserved or near-normal conduction velocities typical of
    an axonopathy.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Defines the CMTX4 core phenotype as a slowly progressive axonal neuropathy.

- name: Distal Muscle Weakness
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  description: >
    Slowly progressive distal limb weakness, predominantly affecting the
    peroneal muscles of the lower legs, producing foot drop and difficulty
    with dorsiflexion.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:30031633
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a novel missense variant of AIFM1 in a X-linked recessive Chinese family with childhood-onset, slowly progressive, isolated axonal motor and sensory neuropathy."
    explanation: Documents childhood-onset slowly progressive motor (and sensory) neuropathy in a CMTX4 family.

- name: Distal Sensory Impairment
  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Length-dependent distal sensory loss in a stocking-glove distribution,
    reflecting large-fibre sensory axonal degeneration.
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
  evidence:
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurophysiology demonstrated length-dependent large-fibre sensorimotor axonal neuropathy, with particular involvement of superficial radial sensory responses."
    explanation: Confirms the sensory axonal component of the length-dependent neuropathy in CMTX4.

- name: Sensorineural Hearing Impairment
  category: Neurological
  frequency: FREQUENT
  description: >
    Sensorineural deafness is part of the classic Cowchock triad and is
    variably present across affected individuals and families.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Establishes sensorineural deafness as a core component of the CMTX4/Cowchock phenotype.
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement."
    explanation: Confirms variably present sensorineural deafness in an AIFM1/CMTX4 family.

- name: Cognitive Impairment
  category: Neurological
  frequency: OCCASIONAL
  description: >
    Cognitive impairment / intellectual disability was described in the
    original Cowchock family and is part of the classic triad, but it is
    variable and absent in some AIFM1 families, underscoring phenotypic
    heterogeneity.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Establishes cognitive impairment as part of the original Cowchock triad.
  - reference: PMID:31523922
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals had normal cognitive assessment."
    explanation: Documents preserved cognition in one large AIFM1 family, supporting the variable/occasional nature of cognitive impairment in the spectrum.

- name: Distal Lower Limb Amyotrophy
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  description: >
    Wasting of the distal lower-limb muscles, with fatty infiltration and
    atrophy prominent in the peroneal compartment on muscle imaging.
  phenotype_term:
    preferred_term: Distal lower limb amyotrophy
    term:
      id: HP:0008944
      label: Distal lower limb amyotrophy
  evidence:
  - reference: PMID:30031633
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calf magnetic resonance imaging revealed fatty infiltration and atrophy severely involving the muscles of peroneal compartment."
    explanation: MRI documents peroneal-predominant muscle atrophy/fatty infiltration in a CMTX4 family.

- name: Pes Cavus
  category: Musculoskeletal
  frequency: FREQUENT
  description: >
    High-arched feet resulting from the intrinsic-extrinsic foot muscle
    imbalance characteristic of length-dependent motor neuropathy.
  phenotype_term:
    preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus

- name: Areflexia
  category: Neurological
  frequency: FREQUENT
  description: >
    Absent or reduced deep tendon reflexes from loss of the sensory afferent
    arc, typical of a peripheral axonal neuropathy.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia

- name: Cerebellar Ataxia
  category: Neurological
  frequency: OCCASIONAL
  description: >
    A cerebellar-ataxia-predominant presentation with cerebellar atrophy has
    been described in the AIFM1/CMTX4 spectrum, and the disorder is
    designated "CMTX4 with or without cerebellar ataxia." Ataxia and pyramidal
    signs occur in some families in addition to the peripheral neuropathy.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement."
    explanation: Documents cerebellar ataxia and pyramidal involvement within the AIFM1/CMTX4 clinical spectrum.

genetic:
- name: AIFM1
  gene_term:
    preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  association: Causative
  features: >
    Hemizygous missense variants in AIFM1 (Xq26.1) cause CMTX4. Reported
    pathogenic variants include the founding p.Glu493Val, p.Phe210Leu,
    p.Met171Ile, and p.Leu311Val. AIFM1 encodes an FAD-dependent NADH
    oxidoreductase imported into the mitochondrial intermembrane space.
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The change is at a highly conserved residue and cosegregated with the phenotype in the family."
    explanation: Cosegregation of the AIFM1 p.Glu493Val variant with the CMTX4 phenotype supports causality.
  - reference: PMID:37173762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The apoptosis-inducing factor mitochondria associated-1 (AIFM1) is the main pathogenic gene of the X-linked recessive Charcot-Marie-Tooth disease-4 with or without cerebellar ataxia (CMTX4), also known as Cowchock syndrome."
    explanation: Confirms AIFM1 as the causative gene of CMTX4/Cowchock syndrome.

inheritance:
- name: X-linked Recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >
    CMTX4 follows X-linked recessive inheritance: affected individuals are
    hemizygous males carrying an AIFM1 variant, and obligate female carriers
    are typically clinically unaffected.
  evidence:
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four obligate female carriers were assessed clinically, two of them neurophysiologically; all were unaffected."
    explanation: Confirms X-linked recessive inheritance with asymptomatic obligate female carriers.

diagnosis:
- name: Nerve Conduction Studies and Electromyography
  description: >
    Neurophysiology demonstrates a length-dependent, large-fibre sensorimotor
    axonal neuropathy with reduced sensory and motor amplitudes and relatively
    preserved conduction velocities (axonal pattern). Particular involvement of
    the superficial radial sensory response has been proposed as a phenotypic
    marker.
  evidence:
  - reference: PMID:31523922
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Superficial radial nerve was particularly affected neurophysiologically, which could represent a phenotypic marker towards this specific genetic diagnosis."
    explanation: Describes the axonal neurophysiology and a candidate phenotypic marker useful for diagnosis.

- name: Molecular Genetic Testing
  description: >
    Diagnosis is confirmed by identification of a hemizygous pathogenic AIFM1
    variant, typically via exome or whole-genome sequencing in a male with
    X-linked recessive axonal neuropathy with or without deafness, cognitive
    impairment, or cerebellar ataxia.
  evidence:
  - reference: PMID:23217327
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of an affected individual from the originally described family identified a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor (AIF) mitochondrion-associated 1."
    explanation: Establishes AIFM1 sequencing as the molecular diagnostic approach for CMTX4.

treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    Supportive physiotherapy to maintain strength, flexibility, and gait, as
    for other forms of Charcot-Marie-Tooth disease; no disease-modifying
    therapy is currently available for CMTX4.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

- name: Orthotic Devices
  description: >
    Ankle-foot orthoses to compensate for foot drop and improve gait
    stability, with orthopedic footwear for foot deformities.
  treatment_term:
    preferred_term: orthotic supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Hearing Rehabilitation
  description: >
    Management of sensorineural deafness with hearing aids or, in appropriate
    candidates, cochlear implantation, addressing the auditory component of the
    Cowchock phenotype.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic Counseling
  description: >
    Genetic counseling for X-linked recessive inheritance, including carrier
    testing of at-risk female relatives and reproductive counseling.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37173762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of our study may also be useful for genetic counseling, embryo screening of in vitro fertilization embryos, and prenatal genetic diagnosis."
    explanation: Supports genetic counseling and reproductive options for families with AIFM1/CMTX4.


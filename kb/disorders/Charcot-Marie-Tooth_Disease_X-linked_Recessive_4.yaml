name: Charcot-Marie-Tooth Disease X-linked Recessive 4
creation_date: "2026-07-31T00:00:00Z"
category: Genetic
description: >
  Charcot-Marie-Tooth disease X-linked recessive 4 (CMTX4), also known as
  Cowchock syndrome, is a rare, slowly progressive X-linked recessive axonal
  peripheral sensorimotor neuropathy caused by mutations in AIFM1, the gene
  encoding apoptosis-inducing factor mitochondrion-associated 1 (AIF). The
  originally described phenotype comprises the triad of axonal motor and
  sensory neuropathy, sensorineural deafness, and cognitive impairment, with
  onset from the neonatal period to early childhood. Distal muscle weakness
  and atrophy predominate in the peroneal (lower-limb) compartment, with pes
  cavus, areflexia, and a length-dependent stocking-glove sensory deficit.
  AIFM1 is a mitochondrial FAD-dependent NADH oxidoreductase imported into the
  intermembrane space, where it supports assembly of the oxidative
  phosphorylation (OXPHOS) complexes; it also has a distinct pro-apoptotic
  function when cleaved and released to the nucleus. Because AIFM1 is
  X-linked, affected individuals are hemizygous males and obligate female
  carriers are typically asymptomatic. The broader AIFM1 allelic spectrum
  ranges from this predominantly peripheral-nerve phenotype to severe infantile
  mitochondrial encephalomyopathy and a cerebellar-ataxia-predominant form
  (CMTX4 "with cerebellar ataxia").

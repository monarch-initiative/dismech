genetic:
- name: AIFM1
  gene_term:
    preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  association: Causative
  features: >-
    Hemizygous missense variants in AIFM1 cause CMTX4. Reported variants include p.Glu493Val, p.Phe210Leu, p.Met171Ile,
    p.Leu311Val, p.Glu336Lys and p.His457Tyr. Clinical expression varies between and within families, from isolated
    predominantly motor axonal neuropathy to neuropathy with deafness, cognitive impairment, ataxia or tremor. Population
    penetrance has not been quantified. Variant evidence differs: segregation and structural predictions for L311V
    do not by themselves establish the biochemical mechanism measured for other alleles. The p.Ile433Met variant
    in two brothers with a Cowchock-consistent phenotype remained a variant of uncertain significance under ACMG
    criteria in the 2024 report, despite segregation and computational predictions. p.Gly399Ser was classified as
    likely pathogenic in a family with neuropathy, deafness, intellectual disability and cerebellar ataxia; protein
    abundance was preserved.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The change is at a highly conserved residue and cosegregated with the phenotype in the family."
    explanation: Cosegregation of the AIFM1 p.Glu493Val variant with the CMTX4 phenotype supports causality.
  - reference: PMID:37173762
    reference_title: "Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The apoptosis-inducing factor mitochondria associated-1 (AIFM1) is the main pathogenic gene of the X-linked recessive Charcot-Marie-Tooth disease-4 with or without cerebellar ataxia (CMTX4), also known as Cowchock syndrome."
    explanation: Confirms AIFM1 as the causative gene of CMTX4/Cowchock syndrome.
  - reference: PMID:41957773
    reference_title: "Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified and comprehensively characterized a novel hemizygousAIFM1mutation c.1006G > A (E336K) in a male patient presenting with a progressive hereditary axonal sensorimotor polyneuropathy with childhood onset, inherited in an X-linked recessive pattern, associated with sensorineural hearing loss and without cognitive impairment. The clinical phenotype was consistent with Charcot-Marie-Tooth disease type 4 (CMTX4)."
    explanation: Adds a functionally characterized AIFM1 CMTX4 variant (E336K) with the classic axonal neuropathy plus deafness phenotype.

  - reference: PMID:28888069
    reference_title: A novel missense mutation in AIFM1 results in axonal polyneuropathy and misassembly of OXPHOS complexes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a family with a novel missense mutation (Phe210Leu) in AIFM1 who developed an isolated late-onset axonal polyneuropathy in which the central nervous system and other organs were spared.
    explanation: F210L family broadens the phenotype to isolated neuropathy.
  - reference: PMID:30031633
    reference_title: A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A hemizygous variant (c.513G>A, p.Met171Ile) in the family was identified and was classified as likely pathogenic according to the standards and guidelines of the American College of Medical Genetics and Genomics.
    explanation: Authors classify M171I as likely pathogenic.
  - reference: PMID:37173762
    reference_title: Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'identified a novel AIFM1 variant (NM_004208.3: c.931C>G; p.L311V) using whole exon sequencing technology.'
    explanation: L311V was identified in a Cowchock family; cellular functional validation was not reported.
  - reference: PMID:36907087
    reference_title: "Deep Brain Stimulation for the Management of AIFM1-Related Disabling Tremor: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a novel maternally inherited hemizygous missense AIFM1 variant, c.1369C>T p.(His457Tyr), in two brothers with clinical features consistent with Cowchock syndrome using next-generation sequencing.
    explanation: H457Y in two brothers with Cowchock-consistent disease.
  - reference: PMID:39601015
    reference_title: Novel AIFM1 Variant in 2 Siblings With Sensorineural Hearing Loss and Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While this variant meets criteria for a Variant of Uncertain Significance under ACMG criteria
    explanation: I433M remains a VUS in the reporting study; the severe respiratory and anterior-horn-cell phenotype in one sibling is not treated as proven CMTX4 natural history.
  - reference: PMID:32337346
    reference_title: "Cerebellar ataxia, neuropathy, hearing loss, and intellectual disability due to AIFM1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 3 subjects shared a variant (c.1195G>A; p.Gly399Ser) in exon 12 of the AIFM1 gene
    explanation: G399S was shared by two affected males and their heterozygous relative.
inheritance:
- name: X-linked Recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    CMTX4 follows X-linked recessive inheritance. Female carriers in the original and Irish families were clinically
    unaffected. A carrier mother has a 50% chance of transmitting the variant in each pregnancy; affected males
    transmit it to all daughters and no sons. Female manifestation is possible within the broader AIFM1 spectrum,
    but the reported heterozygous p.Pro169Leu child had encephalomyopathy/cardiomyopathy, not classic CMTX4, so
    that case does not quantify risk for CMTX4 carriers. A heterozygous woman in a p.Gly399Ser family had mild neurological
    features, but the authors considered attribution uncertain because medication and alcohol exposure confounded
    her presentation.
  evidence:
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous females were asymptomatic."
    explanation: Original Cowchock-family linkage study confirms asymptomatic heterozygous female carriers, consistent with X-linked recessive inheritance.
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four obligate female carriers were assessed clinically, two of them neurophysiologically; all were unaffected."
    explanation: Confirms X-linked recessive inheritance with asymptomatic obligate female carriers.
  - reference: PMID:42329587
    reference_title: "Cardiomyopathy and mitochondrial encephalomyopathy in a female child associated with a heterozygous X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified a heterozygous AIFM1 variant, c.506C > T (p.Pro169Leu), with extremely skewed X-inactivation (98:2) in a female."
    explanation: A broader AIFM1 encephalomyopathy/cardiomyopathy case was associated with skewed X-inactivation; it is not a CMTX4 penetrance estimate.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Affected males transmit the pathogenic variant to all of their daughters and none of their sons.
    explanation: General X-linked transmission rule applicable to CMTX4.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Heterozygous females have a 50% chance of transmitting the pathogenic variant to each child; sons who inherit the pathogenic variant will be affected; daughters may or may not be affected.
    explanation: General X-linked transmission risk; female clinical expression depends on the gene, variant and family.
  - reference: PMID:32337346
    reference_title: "Cerebellar ataxia, neuropathy, hearing loss, and intellectual disability due to AIFM1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: in our family, a heterozygous woman seems to be symptomatic, although in a much milder form than her brother and son. However, in her case, the causative role of the AIFM1 mutation may be questioned.
    explanation: The authors explicitly question genetic attribution in this symptomatic heterozygote; this does not prove CMTX4 penetrance in women.
diagnosis:
- name: Nerve Conduction Studies and Electromyography
  description: >
    Neurophysiology demonstrates a length-dependent, large-fibre sensorimotor
    axonal neuropathy with reduced sensory and motor amplitudes and relatively
    preserved conduction velocities (axonal pattern). Particular involvement of
    the superficial radial sensory response has been proposed as a phenotypic
    marker.
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Superficial radial nerve was particularly affected neurophysiologically, which could represent a phenotypic marker towards this specific genetic diagnosis."
    explanation: Describes the axonal neurophysiology and a candidate phenotypic marker useful for diagnosis.

  - reference: PMID:8666389
    reference_title: A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Motor nerve conduction velocities in affected males were normal to mildly delayed, and sensory conduction was markedly abnormal.
    explanation: Supports the axonal electrophysiological pattern in the original kindred.
- name: Molecular Genetic Testing
  description: >
    Diagnosis is confirmed by identification of a hemizygous pathogenic AIFM1
    variant, typically via exome or whole-genome sequencing in a male with
    X-linked recessive axonal neuropathy with or without deafness, cognitive
    impairment, or cerebellar ataxia.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of an affected individual from the originally described family identified a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor (AIF) mitochondrion-associated 1."
    explanation: Establishes AIFM1 sequencing as the molecular diagnostic approach for CMTX4.

- name: Audiologic Evaluation
  description: >-
    Audiometry characterizes sensorineural hearing loss; auditory evoked potentials can assess neural pathway dysfunction.
    In the E336K case, brainstem auditory evoked potentials were absent bilaterally. A uniform preserved-outer-hair-cell
    ANSD pattern has not been demonstrated across CMTX4 families.
  evidence:
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Visual evoked potentials revealed a delayed P100 latency at 153 ms, while brainstem auditory evoked potentials were bilaterally absent.
    explanation: Absent brainstem auditory responses in a genetically confirmed CMTX4 case; otoacoustic-emission preservation is not established by this sentence.
- name: Muscle MRI
  description: >-
    Calf MRI in the p.Met171Ile family showed peroneal-compartment fatty infiltration and atrophy. This is a supportive
    observation, not a diagnostic criterion or a universal imaging pattern.
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calf magnetic resonance imaging revealed fatty infiltration and atrophy severely involving the muscles of peroneal compartment."
    explanation: Calf MRI documents the peroneal-predominant fatty infiltration/atrophy pattern useful in the diagnostic workup.

- name: Brain MRI for Central Features
  description: >-
    Cerebellar or pyramidal manifestations can prompt brain imaging. Cerebellar atrophy was documented in the Irish
    family; normal imaging in the E336K case shows that a normal MRI does not exclude CMTX4.
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain imaging, performed in four, revealed varying extent of cerebellar atrophy, and white matter changes in one.
    explanation: Imaging in four members of one family documents cerebellar atrophy.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Repeated brain MRI and vestibulocochlear nerve imaging were unremarkable.
    explanation: Normal imaging in the E336K patient.
histopathology:
- name: Sural Nerve and Muscle Mitochondrial Pathology
  description: >-
    Abnormal mitochondrial morphology and axoplasmic or subsarcolemmal accumulation were described in the p.Met171Ile
    family. The founding p.Glu493Val case also showed subsarcolemmal mitochondrial abnormalities with neurogenic
    atrophy. These findings are supportive and nonspecific; they do not independently diagnose CMTX4.
  diagnostic: false
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologies exhibited abnormal mitochondrial morphology and accumulation in axoplasm of nerve fiber and subsarcolemmal area of muscle."
    explanation: Nerve/muscle histopathology shows abnormal mitochondrial morphology and axoplasmic/subsarcolemmal mitochondrial accumulation in CMTX4.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    The cited literature consists of small family studies and case reports; it does not provide a population-based
    CMTX4 prevalence estimate. General CMT prevalence cannot be assigned to this subtype.

progression:
- phase: Overall course
  duration: Lifelong
  notes: >-
    Course is chronic and generally slowly progressive, with substantial variation in onset and disability. In the
    L311V report, the proband developed weakness at age 10 and used a wheelchair by age 30. The Irish family included
    adult-onset disease. These observations do not define a universal trajectory or life expectancy. Cerebellar
    ataxia in the p.Gly399Ser family stabilized after childhood, illustrating that continuous progression is not
    universal.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Establishes the slowly progressive course of CMTX4.

  - reference: PMID:37173762
    reference_title: Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband showed muscular atrophy worsens after the age of 20 and has to be wheelchair-bound since the age of 30.
    explanation: One L311V proband illustrates progression to substantial motor disability.
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They presented with a variable age of onset, 18 months to 39 years of age.
    explanation: Age range in the seven affected males of the Irish family.
  - reference: PMID:32337346
    reference_title: "Cerebellar ataxia, neuropathy, hearing loss, and intellectual disability due to AIFM1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: cerebellar ataxia progression essentially occurred in the first decade, followed by stabilization and, in the proband, even improvement with intensive rehabilitation.
    explanation: The G399S family had a plateau in ataxia; this is not evidence of spontaneous remission of all neuropathy manifestations.
treatments:
- name: Physical Therapy and Rehabilitation
  description: >-
    Symptomatic rehabilitation follows general CMT guidance: maintain mobility with exercise within individual capability,
    heel-cord stretching and hand exercises. No disease-modifying benefit for CMTX4 is established by this guidance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Daily heel cord stretching exercises to prevent Achilles tendon shortening are desirable, as well as gripping exercises for hand weakness
    explanation: General CMT supportive-care guidance applied to the neuropathy component of CMTX4.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Exercise is encouraged within the individual's capability and many individuals remain physically active
    explanation: General CMT rehabilitation guidance; no CMTX4-specific trial is implied.
- name: Orthotic Devices
  description: >
    Ankle-foot orthoses to compensate for foot drop and improve gait
    stability, with orthopedic footwear for foot deformities.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: orthotic supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Affected individuals often require ankle/foot orthoses (AFOs) to correct foot drop and aid walking.
    explanation: General CMT guidance for symptomatic foot drop.
- name: Hearing Rehabilitation
  description: >-
    Hearing aids have been used for progressive sensorineural hearing loss in CMTX4. Rehabilitation should be tailored
    to measured hearing function; ANSD physiology from other AIFM1 alleles is not assumed for every CMTX4 patient.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He also developed progressive bilateral sensorineural hearing loss, requiring hearing aids by age 25.
    explanation: Direct CMTX4 hearing-aid use in the E336K case.
- name: Cochlear Implantation
  description: >-
    Cochlear implantation has been reported for severe hearing loss in a genetically confirmed E336K CMTX4 patient,
    with partial benefit. This single-patient observation supports individualized assessment, not a uniform outcome
    or preference over hearing aids based solely on AIFM1 genotype.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:

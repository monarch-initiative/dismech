- name: Areflexia
  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Absent or reduced deep tendon reflexes from loss of the sensory afferent
    arc, typical of a peripheral axonal neuropathy.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were severely affected within the first few years of life with distal weakness, muscle atrophy, sensory loss, areflexia, pes cavus, and hammer toes."
    explanation: All seven affected males of the original Cowchock family had areflexia, supporting a VERY_FREQUENT band.

- name: Cerebellar Ataxia
  category: Neurological
  frequency: OCCASIONAL
  description: >
    A cerebellar-ataxia-predominant presentation with cerebellar atrophy has
    been described in the AIFM1/CMTX4 spectrum, and the disorder is
    designated "CMTX4 with or without cerebellar ataxia." Ataxia and pyramidal
    signs occur in some families in addition to the peripheral neuropathy.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement."
    explanation: Documents cerebellar ataxia and pyramidal involvement within the AIFM1/CMTX4 clinical spectrum.

- name: Abnormal Pyramidal Sign
  category: Neurological
  frequency: OCCASIONAL
  description: >
    Pyramidal (upper motor neuron) signs accompany the peripheral neuropathy in
    part of the AIFM1/CMTX4 spectrum, reflecting central corticospinal
    involvement.
  notes: >-
    Frequency banded consistently with cerebellar ataxia (OCCASIONAL), since
    both derive from the same variably-present PMID:31523922 clinical clause.
  phenotype_term:
    preferred_term: Abnormal pyramidal sign
    term:
      id: HP:0007256
      label: Abnormal pyramidal sign
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement."
    explanation: Documents pyramidal involvement in an AIFM1/CMTX4 family.

- name: Tremor
  category: Neurological
  frequency: OCCASIONAL
  description: >
    A progressive movement-disorder component with disabling tremor occurs in a
    subset of CMTX4 patients and can be poorly responsive to medication, forming
    part of the broader AIFM1 movement-disorder/cerebellar spectrum.
  phenotype_term:
    preferred_term: Tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:36907087
    reference_title: "Deep Brain Stimulation for the Management of AIFM1-Related Disabling Tremor: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both individuals had a progressive complex movement disorder phenotype, including disabling tremor poorly responsive to medications."
    explanation: Documents disabling, medication-refractory tremor in two brothers with a Cowchock-syndrome AIFM1 variant.

- name: Color Vision Deficiency
  category: Neurological
  frequency: VERY_RARE
  description: >
    Colour-vision deficiency was reported in a subset of one large AIFM1/CMTX4
    family, representing a rare extension of the phenotypic spectrum.
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, three had colour vision deficiency."
    explanation: Documents colour-vision deficiency in three affected males of the Irish AIFM1/CMTX4 family.

genetic:
- name: AIFM1
  gene_term:
    preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  association: Causative
  features: >
    Hemizygous missense variants in AIFM1 (Xq26.1) cause CMTX4. Reported
    pathogenic variants include the founding p.Glu493Val, p.Phe210Leu,
    p.Met171Ile, p.Leu311Val, p.Glu336Lys, and p.His457Tyr. AIFM1 encodes an
    FAD-dependent NADH oxidoreductase imported into the mitochondrial
    intermembrane space; most pathogenic variants cluster within its FAD- and
    NADH-binding domains, consistent with a redox-balance mechanism. Penetrance
    is high in hemizygous males, while expressivity is highly variable — even
    within a single family and for the same variant — spanning mild neuropathy
    to a severe multisystem cerebellar/encephalopathic presentation.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The change is at a highly conserved residue and cosegregated with the phenotype in the family."
    explanation: Cosegregation of the AIFM1 p.Glu493Val variant with the CMTX4 phenotype supports causality.
  - reference: PMID:37173762
    reference_title: "Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The apoptosis-inducing factor mitochondria associated-1 (AIFM1) is the main pathogenic gene of the X-linked recessive Charcot-Marie-Tooth disease-4 with or without cerebellar ataxia (CMTX4), also known as Cowchock syndrome."
    explanation: Confirms AIFM1 as the causative gene of CMTX4/Cowchock syndrome.
  - reference: PMID:41957773
    reference_title: "Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified and comprehensively characterized a novel hemizygousAIFM1mutation c.1006G > A (E336K) in a male patient presenting with a progressive hereditary axonal sensorimotor polyneuropathy with childhood onset, inherited in an X-linked recessive pattern, associated with sensorineural hearing loss and without cognitive impairment. The clinical phenotype was consistent with Charcot-Marie-Tooth disease type 4 (CMTX4)."
    explanation: Adds a functionally characterized AIFM1 CMTX4 variant (E336K) with the classic axonal neuropathy plus deafness phenotype.

inheritance:
- name: X-linked Recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >
    CMTX4 follows X-linked recessive inheritance: affected individuals are
    hemizygous males carrying an AIFM1 variant, and obligate female carriers
    are typically clinically unaffected. Rarely, across the broader AIFM1
    allelic spectrum, a heterozygous female can manifest disease when X-linked
    inactivation is extremely skewed.
  evidence:
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous females were asymptomatic."
    explanation: Original Cowchock-family linkage study confirms asymptomatic heterozygous female carriers, consistent with X-linked recessive inheritance.
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four obligate female carriers were assessed clinically, two of them neurophysiologically; all were unaffected."
    explanation: Confirms X-linked recessive inheritance with asymptomatic obligate female carriers.
  - reference: PMID:42329587
    reference_title: "Cardiomyopathy and mitochondrial encephalomyopathy in a female child associated with a heterozygous X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous AIFM1 variant can result in disease manifestation in females."
    explanation: Documents that, in the broader AIFM1 spectrum, a heterozygous female can manifest disease (via skewed X-inactivation) — a genetic-counseling caveat; the reported female had a severe (encephalomyopathy/cardiomyopathy) phenotype rather than classic CMTX4.

diagnosis:
- name: Nerve Conduction Studies and Electromyography
  description: >
    Neurophysiology demonstrates a length-dependent, large-fibre sensorimotor
    axonal neuropathy with reduced sensory and motor amplitudes and relatively
    preserved conduction velocities (axonal pattern). Particular involvement of
    the superficial radial sensory response has been proposed as a phenotypic
    marker.
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Superficial radial nerve was particularly affected neurophysiologically, which could represent a phenotypic marker towards this specific genetic diagnosis."
    explanation: Describes the axonal neurophysiology and a candidate phenotypic marker useful for diagnosis.

- name: Molecular Genetic Testing
  description: >
    Diagnosis is confirmed by identification of a hemizygous pathogenic AIFM1
    variant, typically via exome or whole-genome sequencing in a male with
    X-linked recessive axonal neuropathy with or without deafness, cognitive
    impairment, or cerebellar ataxia.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of an affected individual from the originally described family identified a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor (AIF) mitochondrion-associated 1."
    explanation: Establishes AIFM1 sequencing as the molecular diagnostic approach for CMTX4.

- name: Audiologic Evaluation
  description: >
    Audiometry with auditory brainstem response (ABR) testing characterises the
    hearing loss as an auditory neuropathy pattern — abnormal auditory-nerve /
    inner-hair-cell function with preserved outer hair cell (otoacoustic
    emission) responses — which distinguishes the neural deafness of the AIFM1
    spectrum from ordinary cochlear loss and guides rehabilitation choice.
  evidence:
  - reference: PMID:36751702
    reference_title: "AIFM1 variants associated with auditory neuropathy spectrum disorder cause apoptosis due to impaired apoptosis-inducing factor dimerization."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Auditory neuropathy spectrum disorder (ANSD) represents a variety of sensorineural deafness conditions characterized by abnormal inner hair cells and/or auditory nerve function, but with the preservation of outer hair cell function."
    explanation: Defines the auditory-neuropathy audiologic pattern (abnormal auditory nerve with preserved outer hair cells) that characterises AIFM1-associated deafness.

- name: Muscle MRI
  description: >
    Calf muscle MRI shows fatty infiltration and atrophy with a
    peroneal-compartment predominance, supporting the length-dependent motor phenotype.
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calf magnetic resonance imaging revealed fatty infiltration and atrophy severely involving the muscles of peroneal compartment."
    explanation: Calf MRI documents the peroneal-predominant fatty infiltration/atrophy pattern useful in the diagnostic workup.

histopathology:
- name: Sural Nerve and Muscle Mitochondrial Pathology
  description: >
    Nerve and muscle biopsy in CMTX4 shows abnormal mitochondrial morphology
    with accumulation of mitochondria in the axoplasm of nerve fibres and in the
    subsarcolemmal region of muscle, the tissue correlate of the mitochondrial
    dysfunction driven by AIFM1 mutation.
  diagnostic: true
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologies exhibited abnormal mitochondrial morphology and accumulation in axoplasm of nerve fiber and subsarcolemmal area of muscle."
    explanation: Nerve/muscle histopathology shows abnormal mitochondrial morphology and axoplasmic/subsarcolemmal mitochondrial accumulation in CMTX4.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >
    CMTX4 is an ultra-rare AIFM1 subtype of Charcot-Marie-Tooth disease
    described in only a small number of families worldwide (the original US
    family plus Irish, Chinese, Spanish, and other kindreds); no formal
    prevalence or incidence figure has been established.

progression:
- phase: Overall course
  duration: Lifelong
  notes: >
    Slowly progressive, chronic, lifelong course with onset from the neonatal
    period to early childhood in the classic form (reported spectrum ~18 months
    to ~39 years); no relapsing-remitting pattern or spontaneous remission.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Establishes the slowly progressive course of CMTX4.

treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    Supportive physiotherapy to maintain strength, flexibility, and gait, as
    for other forms of Charcot-Marie-Tooth disease; no disease-modifying
    therapy is currently available for CMTX4.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

- name: Orthotic Devices
  description: >
    Ankle-foot orthoses to compensate for foot drop and improve gait
    stability, with orthopedic footwear for foot deformities.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: orthotic supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Hearing Rehabilitation
  description: >
    Management of sensorineural deafness with hearing aids, addressing the
    auditory component of the Cowchock phenotype. Because the hearing loss in
    the AIFM1 spectrum is a neural (auditory neuropathy spectrum disorder /
    DFNX5) phenomenon rather than pure cochlear loss, device selection is guided
    by audiologic (ABR) characterisation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36751702
    reference_title: "AIFM1 variants associated with auditory neuropathy spectrum disorder cause apoptosis due to impaired apoptosis-inducing factor dimerization."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Auditory neuropathy spectrum disorder (ANSD) represents a variety of sensorineural deafness conditions characterized by abnormal inner hair cells and/or auditory nerve function, but with the preservation of outer hair cell function."
    explanation: Establishes that AIFM1-associated deafness is an auditory neuropathy (neural) phenotype, informing hearing-rehabilitation choice.

- name: Cochlear Implantation
  description: >
    Cochlear implantation may be considered for the auditory-neuropathy hearing
    loss of the AIFM1 spectrum when conventional amplification is inadequate,
    stimulating the cochlear nerve directly.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:36751702
    reference_title: "AIFM1 variants associated with auditory neuropathy spectrum disorder cause apoptosis due to impaired apoptosis-inducing factor dimerization."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Auditory neuropathy spectrum disorder (ANSD) represents a variety of sensorineural deafness conditions characterized by abnormal inner hair cells and/or auditory nerve function, but with the preservation of outer hair cell function."
    explanation: The neural (auditory-neuropathy) character of AIFM1 deafness is the rationale for considering cochlear implantation over amplification in selected patients.

- name: Orthopedic Surgery for Foot Deformity
  description: >
    Corrective orthopedic surgery (e.g., tendon transfers, osteotomies) for
    severe pes cavus and hammer-toe deformities when conservative measures fail
    to maintain functional ambulation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
  - preferred_term: Hammertoe
    term:
      id: HP:0001765
      label: Hammertoe

- name: Deep Brain Stimulation for AIFM1-Related Tremor
  description: >
    Deep brain stimulation of the ventral intermediate thalamic nucleus has
    been used to manage disabling, medication-refractory tremor in AIFM1-related
    (Cowchock-syndrome) disease, improving contralateral tremor and quality of
    life.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_phenotypes:
  - preferred_term: Tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:36907087
    reference_title: "Deep Brain Stimulation for the Management of AIFM1-Related Disabling Tremor: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep brain stimulation (DBS) of the ventral intermediate thalamic nucleus ameliorated contralateral tremor and improved their quality of life; this suggests the beneficial role for DBS in treatment-resistant tremor within AIFM1-related disorders."
    explanation: Case series supporting DBS for treatment-resistant tremor in AIFM1-related/Cowchock-syndrome disease.

- name: Genetic Counseling
  description: >
    Genetic counseling for X-linked recessive inheritance, including carrier
    testing of at-risk female relatives and reproductive counseling.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37173762
    reference_title: "Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of our study may also be useful for genetic counseling, embryo screening of in vitro fertilization embryos, and prenatal genetic diagnosis."
    explanation: Supports genetic counseling and reproductive options for families with AIFM1/CMTX4.
  - reference: PMID:20301532
    reference_title: "Charcot-Marie-Tooth Hereditary Neuropathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inform genetic counseling of family members of an individual with CMT hereditary neuropathy."
    explanation: The GeneReviews CMT overview (baseline reference; no CMTX4-specific GeneReviews exists) includes genetic counseling of family members as standard CMT management.


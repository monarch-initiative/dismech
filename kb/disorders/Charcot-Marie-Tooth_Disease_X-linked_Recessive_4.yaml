classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Inherited peripheral neuropathy (Charcot-Marie-Tooth disease) with
      associated sensorineural deafness and CNS features — a neurologic /
      neuromuscular disorder.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      AIFM1 encodes a mitochondrial oxidoreductase. CMTX4 variants have distinct effects on redox regulation, respiratory-complex
      assembly and apoptotic susceptibility; an OXPHOS enzyme deficit is not universal.
pathophysiology:
- name: AIFM1 Missense Variants
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  description: >-
    Hemizygous AIFM1 missense variants segregate with CMTX4. Functional consequences vary between alleles and cannot
    be assigned uniformly from gene identity.
  evidence:
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The change is at a highly conserved residue and cosegregated with the phenotype in the family.
    explanation: The founding E493V variant cosegregated with Cowchock syndrome.
  downstream:
  - target: Altered AIF Redox Function
    description: Biochemical redox effects are demonstrated for E493V and E336K.
  - target: Reduced AIF Protein Stability
    description: Reduced AIF abundance and protein instability were reported for E336K.
  - target: Impaired Mitochondrial OXPHOS Complex Assembly
    description: >-
      F210L is associated with an assembly defect despite retained AIF/MIA40 binding; the intervening mechanism
      is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural Hearing Impairment
    description: >-
      E493V cosegregated with Cowchock syndrome, including hearing loss in affected family members; the cellular mechanism producing the auditory feature is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23217327
      reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In conclusion, we found that a missense mutation in AIFM1 causes Cowchock syndrome, a form of X-linked recessive axonal motor and sensory neuropathy with sensorineural hearing loss and cognitive impairment.
      explanation: Genetic segregation and clinical findings support the variant-to-hearing-loss link without demonstrating auditory neuronal apoptosis.
  - target: Cognitive Impairment
    description: >-
      E493V cosegregated with Cowchock syndrome, including cognitive impairment in some affected family members; the cellular mechanism is not established and cognition is preserved in other kindreds.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23217327
      reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In conclusion, we found that a missense mutation in AIFM1 causes Cowchock syndrome, a form of X-linked recessive axonal motor and sensory neuropathy with sensorineural hearing loss and cognitive impairment.
      explanation: The founding family supports a variable cognitive phenotype associated with E493V, not uniform cognitive involvement across AIFM1 variants.
  - target: Cerebellar Ataxia
    description: >-
      Cerebellar ataxia occurred variably in affected males of the Irish AIFM1 family; the cellular mechanism linking the variant to ataxia is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31523922
      reference_title: Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement.
      explanation: The genetically characterized Irish family supports a variant-to-ataxia link; no intervening neuronal death pathway was measured.
  - target: Abnormal Pyramidal Sign
    description: >-
      Pyramidal involvement occurred variably in affected males of the Irish AIFM1 family; the cellular mechanism linking the variant to corticospinal signs is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31523922
      reference_title: Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All developed variably present sensorineural deafness, peripheral neuropathy, cerebellar ataxia, and pyramidal involvement.
      explanation: Family-level clinical and genetic evidence supports pyramidal involvement without demonstrating a specific corticospinal injury mechanism.
  - target: Tremor
    description: >-
      Two brothers carrying the maternally inherited H457Y variant had disabling tremor; the mechanism linking the variant to this movement disorder is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36907087
      reference_title: "Deep Brain Stimulation for the Management of AIFM1-Related Disabling Tremor: A Case Series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a novel maternally inherited hemizygous missense AIFM1 variant, c.1369C>T p.(His457Tyr), in two brothers with clinical features consistent with Cowchock syndrome using next-generation sequencing. Both individuals had a progressive complex movement disorder phenotype, including disabling tremor poorly responsive to medications.
      explanation: The H457Y family provides clinical and genetic evidence for the inferred link, not a measured cellular tremor mechanism.
  - target: Color Vision Deficiency
    description: >-
      Colour vision deficiency occurred in three affected males of the Irish AIFM1 family; screening for other colour-deficiency genes was negative, but the cellular mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31523922
      reference_title: Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In addition, three had colour vision deficiency.
      explanation: The finding supports a family-scoped association with the AIFM1 phenotype; retinal neuronal apoptosis was not demonstrated.
  - target: Cerebellar Atrophy
    description: >-
      All four imaged affected males in the Irish AIFM1 family had varying cerebellar atrophy; the cellular mechanism connecting the variant to tissue loss is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31523922
      reference_title: Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Brain imaging, performed in four, revealed varying extent of cerebellar atrophy, and white matter changes in one.
      explanation: Imaging in genetically affected relatives supports the inferred link without establishing a specific neuronal injury pathway.
- name: Altered AIF Redox Function
  biological_scale: MOLECULAR
  description: >-
    Purified p.Glu493Val AIF is reduced more rapidly by NADH and forms a shorter-lived charge-transfer complex.
    NADH-induced dimer formation is retained. Purified p.Glu336Lys AIF instead has reduced NADH affinity, less stable
    reduced dimers and weakened CHCHD4 binding. These variant-specific biochemical changes affect AIF regulation;
    they do not establish a common dimerization failure or respiratory-chain defect across CMTX4.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  molecular_functions:
  - preferred_term: NADH oxidoreductase activity
    term:
      id: GO:0003954
      label: NADH dehydrogenase activity
  downstream:
  - target: Altered Caspase-Independent Apoptotic Susceptibility
    description: >-
      For p.Glu493Val, the authors propose that faster oxidation of the charge-transfer complex favors apoptogenic
      AIF. The causal connection to neuronal loss remains inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Mitochondrial OXPHOS Complex Assembly
    description: >-
      For p.Glu336Lys, altered NADH-dependent regulation and weakened CHCHD4 engagement may contribute to respiratory-supercomplex
      abnormalities in fibroblasts. This route is not demonstrated for p.Glu493Val.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Because p.Glu493Val AIF retains its ability to dimerize upon reduction with NADH (Figure S2D), an effect of the p.Glu493Val substitution on redox-linked dimer formation can be ruled out.
    explanation: Purified E493V retains NADH-induced dimerization despite altered redox kinetics.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: First, p.Glu493Val AIF has lower KM for NADH (by 20%) than does wild-type AIF and becomes reduced by NADH 4-fold faster (Figure 3B and Table 1).
    explanation: Recombinant-protein kinetics establish altered redox reactivity.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results indicate that the E336K∆101mutant retains its ability to form dimers under reducing conditions, although the dimers exhibit diminished stability and a slightly less compact dimeric assembly compared to the WT protein.
    explanation: The E336K apoptogenic construct forms less stable dimers; this differs from inability to dimerize.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The purified E336K protein exhibited compromised FAD retention, decreased thermal stability, impaired NADH affinity, destabilization of the charge-transfer complex crucial for sustaining the AIF: CHCHD4 interaction, and a shift in coenzyme preference toward NADPH.'
    explanation: Purified E336K has altered NADH affinity and charge-transfer stability; these are not uniform effects of all CMTX4 variants.
- name: Reduced AIF Protein Stability
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  description: >-
    For p.Glu336Lys, fibroblasts contain less AIF protein despite similar AIF transcript levels. Purified mitochondrial
    E336K protein loses FAD and tends to precipitate, supporting protein instability. This finding is not established
    for E493V or F210L.
  evidence:
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: although the relative expression levels of AIF mRNA in mutant fibroblasts were comparable to those of control cells, the amount of AIF protein was reduced, suggesting decreased stability of the mutant protein.
    explanation: Lower cellular protein with preserved transcript supports instability for E336K.
  downstream:
  - target: Reduced CHCHD4 Expression
    description: >-
      Lower AIF abundance and impaired CHCHD4 engagement accompany reduced CHCHD4 expression in E336K cells; the
      regulatory steps linking them remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced CHCHD4 Expression
  biological_scale: MOLECULAR
  description: >-
    p.Glu336Lys fibroblasts have reduced CHCHD4 transcript and protein levels. CHCHD4 supports mitochondrial protein
    import and respiratory-chain biogenesis. This expression defect is absent in the reported p.Phe210Leu fibroblasts.
  evidence:
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mutation of AIF negatively affects CHCHD4 mRNA and protein expression, as its relative levels were significantly reduced compared to those of control cells (Fig.3A and B).
    explanation: E336K patient-derived fibroblasts show decreased CHCHD4 transcript and protein.
  downstream:
  - target: Impaired Mitochondrial OXPHOS Complex Assembly
    description: >-
      Reduced CHCHD4 expression may contribute to the E336K assembly phenotype through mitochondrial protein import;
      these experiments did not isolate a complete causal sequence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Mitochondrial OXPHOS Complex Assembly
  biological_scale: MOLECULAR
  description: >-
    Patient-derived p.Phe210Leu fibroblasts had reduced complex I and III subunit signals interpreted as misassembly,
    despite preserved AIF/MIA40 abundance and binding. The study measured one subunit per complex, limiting inference
    about the entire complex. p.Glu336Lys fibroblasts had altered respiratory-supercomplex organization, reduced
    CHCHD4 abundance and decreased basal respiration. These findings are variant-specific; p.Glu493Val fibroblasts
    and muscle retained respiratory-chain activities.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  biological_processes:
  - preferred_term: Mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: ABNORMAL
  downstream:
  - target: Mitochondrial Dysfunction in Peripheral Neurons
    description: >-
      Fibroblast assembly defects provide a plausible model for neuronal mitochondrial dysfunction, but respiratory-complex
      assembly was not directly measured in peripheral neurons in these studies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28888069
    reference_title: A novel missense mutation in AIFM1 results in axonal polyneuropathy and misassembly of OXPHOS complexes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Because MIA40 is not deficient and binding between MIA40 and AIFM1 is still preserved in Phe210Leu cells, the misassembly of CI/CIII would not be achieved via the impaired interaction between AIFM1 and MIA40 or via MIA40 deficiency, but through a different mechanism.
    explanation: F210L assembly abnormalities must not be attributed to demonstrated MIA40 loss or loss of binding.
  - reference: PMID:28888069
    reference_title: A novel missense mutation in AIFM1 results in axonal polyneuropathy and misassembly of OXPHOS complexes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our Western blot in Figure 4 only tested one subunit in each complex. Thus, the degree of reduction for the tested subunit does not necessarily reflect the degree of reduction of other subunits in the same complex.
    explanation: Assay limitation on the inferred assembly defect.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of the SCs pattern revealed an overall decrease in the levels of assembled respiratory complexes and SCs in mutant cells, normalized to CII, with a more pronounced reduction observed for SCs (to around 30–40% compared to the control (mean of 2 biological replicates)).
    explanation: E336K fibroblast native electrophoresis directly measures respiratory-supercomplex organization.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: The activity of respiratory chain complexes in fibroblasts derived from an affected individual was not reduced compared to carrier and controls (not shown).
    explanation: 'E493V is a negative comparator for respiratory-chain failure in patient fibroblasts; it does not establish an assembly defect.'
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: Likewise, no impairment in the respiratory chain activities was detected in a muscle biopsy from subject III-9 (not shown).
    explanation: 'Muscle-biopsy respiratory activities were preserved in an E493V patient; the fibroblast and tissue findings are kept separate.'
- name: Altered Caspase-Independent Apoptotic Susceptibility
  biological_scale: CELLULAR
  description: >-
    Skin fibroblasts carrying p.Glu493Val showed increased staurosporine-induced nuclear abnormalities that persisted
    despite caspase inhibition. Patient muscle showed TUNEL-positive nuclei and increased nuclear AIF localization.
    These experiments support enhanced apoptotic susceptibility for this variant; they did not directly assay motor,
    sensory, auditory or central neurons. Increased apoptosis is not a universal CMTX4 mechanism: p.Glu336Lys fibroblasts
    showed attenuated MNNG-induced cell death.
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: ABNORMAL
  downstream:
  - target: Distal Axonal Degeneration
    description: >-
      Apoptotic susceptibility is proposed to contribute to the p.Glu493Val neuropathy. Direct death measurements
      in affected peripheral neurons are unavailable.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In cells pretreated with the general caspase inhibitor z-VAD-FMK (100 μM for 0.5 hr), the staurosporine-induced nuclear abnormalities dropped to less than 10% in control fibroblasts, but remained as high as 50% in p.Glu493Val AIF mutant cells (Figure 4B), suggesting prominent activation of the caspase-independent, AIF-specific cell death pathway.
    explanation: Stimulated patient fibroblasts, not neurons, support enhanced caspase-independent apoptotic susceptibility.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Numerous apoptotic cells were present in the sample from the affected individual, whereas little to no staining was detected in healthy control muscle (Figure 4A).
    explanation: Muscle-biopsy TUNEL staining provides tissue evidence of apoptosis.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results indicate that although the E336K mutation does not abolish AIF-mediated cell death, its efficiency in fibroblasts appears reduced (Fig. S2C).
    explanation: 'E336K attenuated induced cell death, in contrast to the increased susceptibility of E493V; the direction is variant-dependent.'
- name: Mitochondrial Dysfunction in Peripheral Neurons
  biological_scale: CELLULAR
  description: >-
    In the p.Met171Ile family, nerve pathology showed abnormal mitochondrial morphology and accumulation within
    axoplasm; muscle also showed subsarcolemmal accumulation. These findings establish tissue mitochondrial abnormalities.
    Their contribution to axonal degeneration is plausible but does not prove ATP depletion or a specific respiratory-chain
    defect in the affected neurons.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Distal Axonal Degeneration
    description: >-
      Mitochondrial abnormalities in affected nerve suggest a contribution to axonal injury; the intervening causal
      steps have not been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologies exhibited abnormal mitochondrial morphology and accumulation in axoplasm of nerve fiber and subsarcolemmal area of muscle."
    explanation: Nerve/muscle pathology in a CMTX4 family shows abnormal mitochondrial morphology and axoplasmic accumulation, linking AIFM1 mutation to neuronal mitochondrial dysfunction.
- name: Distal Axonal Degeneration
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >
    The final common pathway in CMTX4 is length-dependent axonal degeneration
    of peripheral nerves, producing a large-fibre sensorimotor axonal
    neuropathy. The longest axons — those of the distal lower limbs — are
    affected first, yielding the characteristic distal-predominant weakness,
    atrophy, and sensory loss.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Peripheral Axonal Neuropathy
  - target: Distal Muscle Weakness
  - target: Distal Sensory Impairment
  - target: Distal Lower Limb Amyotrophy
  - target: Pes Cavus
  - target: Hammertoe
  - target: Areflexia
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurophysiology demonstrated length-dependent large-fibre sensorimotor axonal neuropathy, with particular involvement of superficial radial sensory responses."
    explanation: Neurophysiology in an AIFM1/CMTX4 family confirms a length-dependent large-fibre sensorimotor axonal neuropathy as the core lesion.

discussions:
- discussion_id: mismatch_harlequin_knockdown_vs_human_missense
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How well does AIF downregulation in the Harlequin mouse model the distinct mechanisms of human CMTX4 missense
    variants?
  attaches_to:
  - pathophysiology#Mitochondrial Dysfunction in Peripheral Neurons
  - pathophysiology#Impaired Mitochondrial OXPHOS Complex Assembly
  rationale: >-
    Harlequin mice develop complex I deficiency and multifocal CNS neurodegeneration (PMID:17805014). Human variants
    differ: E493V retains respiratory-chain activities and favors apoptotic susceptibility; F210L retains AIF/MIA40
    abundance and binding despite assembly abnormalities; E336K reduces AIF/CHCHD4 abundance and respiratory-supercomplex
    organization while attenuating induced cell death. A knockdown cannot be assumed to reproduce each of these
    mechanisms or human peripheral-nerve and auditory vulnerability.
  proposed_experiments:
  - experiment_id: exp_aifm1_knockin_peripheral_vs_central
    experiment_design: TARGETED_PERTURBATION
    name: Knock-in mouse / iPSC neuron models of human CMTX4 missense variants
    description: >-
      Compare E493V, F210L and E336K knock-in or patient-derived neuronal models with AIF knockdown, measuring respiratory-complex
      assembly, apoptotic susceptibility and peripheral versus central neuronal phenotypes.
phenotypes:
- name: Peripheral Axonal Neuropathy
  category: Neurological
  description: >-
    Axonal peripheral neuropathy is the defining CMTX4 phenotype. It is usually length-dependent, with variable
    sensory involvement; the F210L family showed predominantly motor axonal disease.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
    clinical_course: PROGRESSIVE
    onset:
      notes: >-
        Onset is often in childhood, but an Irish family had onset from 18 months to 39 years; this is a family
        range rather than a bound for all CMTX4.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Defines the CMTX4 core phenotype as a slowly progressive axonal neuropathy.

  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They presented with a variable age of onset, 18 months to 39 years of age.
    explanation: Age range in the seven affected males of the Irish family.
- name: Distal Muscle Weakness
  category: Musculoskeletal
  description: >
    Slowly progressive distal limb weakness, predominantly affecting the
    peroneal muscles of the lower legs, producing foot drop and difficulty
    with dorsiflexion.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a novel missense variant of AIFM1 in a X-linked recessive Chinese family with childhood-onset, slowly progressive, isolated axonal motor and sensory neuropathy."
    explanation: Documents childhood-onset slowly progressive motor (and sensory) neuropathy in a CMTX4 family.
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were severely affected within the first few years of life with distal weakness, muscle atrophy, sensory loss, areflexia, pes cavus, and hammer toes."
    explanation: The original family report describes this feature in affected males; it does not establish its frequency across all CMTX4 variants.


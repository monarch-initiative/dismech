notes: >-
  No CMTX4-specific GeneReviews chapter was identified. The PubMed abstract of the CMT Overview is a purpose statement;
  its full Bookshelf chapter supports general CMT rehabilitation and X-linked genetic counseling. Disease-specific
  phenotypes, variant mechanisms and clinical observations are drawn from the CMTX4 family studies. Frequencies
  from individual kindreds are retained as family observations rather than population estimates. Mechanistic evidence
  from fibroblasts, purified proteins and AIF-deficient mice does not directly establish death of particular human
  neuronal populations. ANSD-associated T260A/R422W/R451Q experiments used 293T-derived cells, not auditory neurons.
  Their dimerization and NADH-rescue findings are not assigned to the E493V Cowchock variant.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurophysiology demonstrated length-dependent large-fibre sensorimotor axonal neuropathy, with particular involvement of superficial radial sensory responses."
    explanation: Confirms the sensory axonal component of the length-dependent neuropathy in CMTX4.
  - reference: PMID:8666389
    reference_title: "A locus for axonal motor-sensory neuropathy with deafness and mental retardation maps to Xq24-q26."

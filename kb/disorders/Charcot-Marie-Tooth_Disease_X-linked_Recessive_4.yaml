name: Charcot-Marie-Tooth Disease X-linked Recessive 4
creation_date: "2026-07-31T00:00:00Z"
category: Genetic
description: >-
  Charcot-Marie-Tooth disease X-linked recessive 4 (CMTX4), or Cowchock syndrome, is an AIFM1-related axonal peripheral
  neuropathy with variable sensorineural hearing loss and cognitive, cerebellar or pyramidal involvement. The original
  family had early-onset distal weakness, muscle wasting, sensory loss, areflexia and foot deformities; other families
  have isolated neuropathy or later onset. AIF is a mitochondrial FAD-dependent NADH oxidoreductase with roles in
  mitochondrial maintenance and caspase-independent cell death. Functional consequences differ by variant: p.Glu493Val
  alters redox kinetics and increases apoptotic susceptibility without measurable respiratory-chain deficiency in
  the tested fibroblasts and muscle, whereas p.Phe210Leu and p.Glu336Lys are associated with respiratory-complex
  assembly abnormalities in fibroblasts. Female carriers in the reported CMTX4 families were generally clinically
  unaffected. Infantile AIFM1 encephalomyopathy and isolated AIFM1 auditory neuropathy are related allelic disorders,
  not interchangeable with this neuropathy phenotype.

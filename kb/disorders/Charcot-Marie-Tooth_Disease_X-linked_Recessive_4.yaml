    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Orthopedic surgery may be required to correct severe pes cavus foot deformity
    explanation: General CMT guidance, applied to CMTX4 foot deformity.
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Since childhood, he exhibited hypotonia, generalized areflexia, and pes cavus, for which he underwent orthopaedic surgery at the age of 8.
    explanation: Direct CMTX4 surgical history; not a controlled treatment outcome.
- name: Deep Brain Stimulation for AIFM1-Related Tremor
  description: >-
    In two brothers with p.His457Tyr and Cowchock-consistent disease, ventral intermediate thalamic nucleus stimulation
    improved contralateral medication-resistant tremor and quality of life. Evidence is limited to this case series,
    and does not establish benefit for neuropathy or for all CMTX4-associated tremor.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_phenotypes:
  - preferred_term: Tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:36907087
    reference_title: "Deep Brain Stimulation for the Management of AIFM1-Related Disabling Tremor: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep brain stimulation (DBS) of the ventral intermediate thalamic nucleus ameliorated contralateral tremor and improved their quality of life; this suggests the beneficial role for DBS in treatment-resistant tremor within AIFM1-related disorders."
    explanation: Case series supporting DBS for treatment-resistant tremor in AIFM1-related/Cowchock-syndrome disease.

- name: Genetic Counseling
  description: >
    Genetic counseling for X-linked recessive inheritance, including carrier
    testing of at-risk female relatives and reproductive counseling.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

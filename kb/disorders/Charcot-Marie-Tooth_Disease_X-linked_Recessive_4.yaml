    reference_title: "Whole-exome sequencing detected a novel AIFM1 variant in a Han-Chinese family with Cowchock syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of our study may also be useful for genetic counseling, embryo screening of in vitro fertilization embryos, and prenatal genetic diagnosis."
    explanation: Supports genetic counseling and reproductive options for families with AIFM1/CMTX4.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the CMT-related pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: General CMT reproductive-testing guidance after identification of the familial AIFM1 variant.
- name: Riboflavin Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Riboflavin has been tried in AIFM1-related ataxia, including a patient with auditory and axonal neuropathy.
    A two-patient uncontrolled report described lower ataxia scores after treatment. Riboflavin was also used in
    the E336K CMTX4 case and reduced because of gastrointestinal intolerance. These observations do not establish
    efficacy or disease modification across CMTX4.
  evidence:
  - reference: PMID:41957773
    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Riboflavin was reduced to 50 mg twice daily due to gastrointestinal intolerance.
    explanation: Clinical use and intolerance in one E336K patient; no controlled efficacy inference.
  - reference: PMID:28967629
    reference_title: Mutations in AIFM1 cause an X-linked childhood cerebellar ataxia partially responsive to riboflavin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Following the diagnosis, patients were treated with up to 200 mg riboflavin/day for 12 months. Ataxia was assessed by the ICARS scale at baseline, and 6 and 12 months following treatment.
    explanation: Treatment and measurement protocol in two AIFM1-ataxia patients; not a clinical recommendation.
  - reference: PMID:28967629
    reference_title: Mutations in AIFM1 cause an X-linked childhood cerebellar ataxia partially responsive to riboflavin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ataxia score, decreased by 39% in patient 1 and 20% in patient 2 following 12 months of treatment.
    explanation: Uncontrolled ataxia outcomes in two patients; no inference of improvement in peripheral neuropathy or applicability to every CMTX4 variant.
  treatment_term:
    preferred_term: riboflavin pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
- name: Avoid Neurotoxic Medication When Possible
  description: >-
    General CMT guidance identifies vincristine as especially damaging to peripheral nerves. Medication selection
    should consider neurotoxicity; the guidance does not quantify a CMTX4-specific risk.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Chemotherapy for cancer that includes vincristine may be especially damaging to peripheral nerves and severely worsen CMT
    explanation: General CMT precaution applied to an inherited axonal neuropathy.

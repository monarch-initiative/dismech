    reference_title: Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A right cochlear implant (Nucleus 7) was placed at age 57 with partial benefit.
    explanation: Direct CMTX4 implant outcome; single-patient evidence.
- name: Orthopedic Surgery for Foot Deformity
  description: >-
    Corrective orthopedic surgery may be needed for severe pes cavus, following general CMT guidance and multidisciplinary
    assessment. Foot surgery was reported in the E336K CMTX4 case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure

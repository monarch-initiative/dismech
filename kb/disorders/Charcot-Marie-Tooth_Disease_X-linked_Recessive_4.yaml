classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Inherited peripheral neuropathy (Charcot-Marie-Tooth disease) with
      associated sensorineural deafness and CNS features — a neurologic /
      neuromuscular disorder.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Caused by mutations in AIFM1, encoding the mitochondrial
      intermembrane-space flavoprotein AIF; pathogenesis involves impaired AIF-dependent
      mitochondrial import/respiratory-complex assembly and increased
      mitochondrial apoptosis.

pathophysiology:
- name: Altered AIF Redox Function
  biological_scale: MOLECULAR
  description: >
    CMTX4 is caused by hemizygous missense mutations in AIFM1, encoding
    apoptosis-inducing factor (AIF), an FAD-dependent NADH oxidoreductase
    imported into the mitochondrial intermembrane space. The founding
    p.Glu493Val mutation lies at a highly conserved residue and alters the
    redox properties of AIF without impairing the enzymatic activity of the
    respiratory chain complexes — implicating a change in AIF's redox behaviour
    rather than a simple loss of OXPHOS enzyme activity. This redox-switch
    perturbation forks downstream into two arms: loss of the AIF-dependent
    mitochondrial import/assembly function, and a shift toward increased
    (caspase-independent) apoptotic cell death.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  molecular_functions:
  - preferred_term: NADH oxidoreductase activity
    term:
      id: GO:0003954
      label: NADH dehydrogenase activity
  downstream:
  - target: Impaired Mitochondrial OXPHOS Complex Assembly
    description: >
      AIF supports import-dependent assembly of the mitochondrial respiratory
      chain; pathogenic AIFM1 variants perturb this function in peripheral
      neurons.
  - target: Increased Caspase-Independent Neuronal Apoptosis
    description: >
      The redox-switch shift promotes AIF's pro-apoptotic activity, driving
      neuronal cell death independent of any respiratory-chain enzyme deficit.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of an affected individual from the originally described family identified a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor (AIF) mitochondrion-associated 1."
    explanation: Identifies the founding AIFM1 p.Glu493Val mutation as the cause of Cowchock syndrome/CMTX4.
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The c.1478A>T (p.Glu493Val) mutation found in the family reported here alters the redox properties of the AIF protein and results in increased cell death via apoptosis, without affecting the activity of the respiratory chain complexes."
    explanation: Establishes that the Cowchock mutation acts by altering AIF redox properties and increasing apoptosis rather than by directly impairing respiratory chain enzyme activity.

- name: Increased Caspase-Independent Neuronal Apoptosis
  biological_scale: CELLULAR
  description: >
    The parallel (pro-apoptotic) arm of AIF dysfunction: the redox-shifted
    mutant protein increases caspase-independent apoptotic cell death in
    vulnerable neuronal populations. In auditory (spiral ganglion) neurons this
    apoptosis is driven by impaired AIF dimerization, giving the neural
    (auditory neuropathy) hearing loss; the same pro-apoptotic tendency
    contributes to the central (cerebellar/cortical) and retinal vulnerability
    seen across the AIFM1 spectrum.
  cell_types:
  - preferred_term: Spiral ganglion (auditory) neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Sensorineural Hearing Impairment
    description: >
      Apoptosis of spiral ganglion / auditory neurons produces the neural
      (auditory neuropathy) sensorineural deafness of the Cowchock triad.
  - target: Cognitive Impairment
    description: >
      Central neuronal apoptosis contributes to the cognitive impairment of the
      classic Cowchock triad.
  - target: Cerebellar Ataxia
    description: >
      Cerebellar neuronal loss underlies the ataxia seen in the
      cerebellar-predominant part of the AIFM1/CMTX4 spectrum.
    evidence:
    - reference: PMID:17805014
      reference_title: "Apoptosis-inducing factor deficiency induces early mitochondrial degeneration in brain followed by progressive multifocal neuropathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neurodegeneration was not restricted to the cerebellum but progressively affected thalamic, striatal, and cortical regions as well."
      explanation: The Harlequin (AIF-deficient) mouse shows progressive cerebellar neurodegeneration, supporting cerebellar neuronal loss as the substrate of ataxia in AIF-related disease.
  - target: Abnormal Pyramidal Sign
    description: >
      Corticospinal (upper motor neuron) involvement from central neuronal loss
      produces the pyramidal signs reported in part of the AIFM1/CMTX4 spectrum.
  - target: Tremor
    description: >
      Central movement-network (basal-ganglia/striatal) neuronal vulnerability
      contributes to the tremor reported in a subset of AIFM1/CMTX4 patients.
    evidence:
    - reference: PMID:17805014
      reference_title: "Apoptosis-inducing factor deficiency induces early mitochondrial degeneration in brain followed by progressive multifocal neuropathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neurodegeneration was not restricted to the cerebellum but progressively affected thalamic, striatal, and cortical regions as well."
      explanation: The Harlequin (AIF-deficient) mouse shows progressive striatal (basal-ganglia) neurodegeneration, consistent with the central movement-network vulnerability proposed for the tremor.
  - target: Color Vision Deficiency
    description: >
      Central visual-pathway neuronal vulnerability is the proposed basis of the
      rare colour-vision deficiency reported in the spectrum.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "results in increased cell death via apoptosis, without affecting the activity of the respiratory chain complexes."
    explanation: The founding CMTX4 mutation increases apoptotic cell death independent of respiratory-chain enzyme activity, establishing the pro-apoptotic arm.
  - reference: PMID:36751702
    reference_title: "AIFM1 variants associated with auditory neuropathy spectrum disorder cause apoptosis due to impaired apoptosis-inducing factor dimerization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AIFM1 variants associated with auditory neuropathy spectrum disorder cause apoptosis due to impaired apoptosis-inducing factor dimerization."
    explanation: In AIF-mutant auditory-neuron cell models, AIFM1 variants cause apoptosis via impaired AIF dimerization, mechanistically linking the pro-apoptotic arm to the auditory-neuropathy deafness.

- name: Impaired Mitochondrial OXPHOS Complex Assembly
  biological_scale: MOLECULAR
  description: >
    AIFM1 forms a redox-regulated complex with the mitochondrial intermembrane
    space import and assembly protein MIA40 (CHCHD4), and deficiency of either
    protein impairs assembly of mitochondrial respiratory complex I (and
    complex IV). A neuropathy-associated AIFM1 missense mutation (p.Phe210Leu)
    caused abnormal assembly of mitochondrial complexes I and III, providing a
    mechanistic link between AIFM1 dysfunction and defective oxidative
    phosphorylation in affected peripheral nerve.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  biological_processes:
  - preferred_term: Mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: ABNORMAL
  - preferred_term: Protein import into mitochondrial intermembrane space
    term:
      id: GO:0045041
      label: protein import into mitochondrial intermembrane space
    modifier: ABNORMAL
  downstream:
  - target: Mitochondrial Dysfunction in Peripheral Neurons
    description: >
      Misassembled OXPHOS complexes reduce the mitochondrial energy supply
      available to metabolically demanding peripheral axons.
  evidence:
  - reference: PMID:28888069
    reference_title: "A novel missense mutation in AIFM1 results in axonal polyneuropathy and misassembly of OXPHOS complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this Phe210Leu mutation resulted in abnormal assembly of mitochondrial complex I and III, and failed to disrupt AIFM1 binding with mitochondrial intermembrane space import and assembly protein 40 (MIA40) in the patients' cells."
    explanation: Patient fibroblast study showing a CMTX4-associated AIFM1 mutation causes misassembly of OXPHOS complexes I and III.
  - reference: PMID:28888069
    reference_title: "A novel missense mutation in AIFM1 results in axonal polyneuropathy and misassembly of OXPHOS complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deficiency of either AIFM1 or MIA40 is known to impair the assembly of mitochondrial complex I and IV."
    explanation: Establishes the AIFM1/MIA40 axis as required for assembly of mitochondrial respiratory complexes.
  - reference: PMID:41957773
    reference_title: "Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived fibroblasts exhibited reduced AIF protein stability despite preserved mRNA expression, impaired growth in OXPHOS-dependent conditions, decreased basal respiration, and altered assembly of mitochondrial respiratory supercomplexes."
    explanation: CMTX4 (E336K) patient fibroblasts show reduced AIF stability, impaired respiration, and altered respiratory supercomplex assembly.
  - reference: PMID:41957773
    reference_title: "Clinical and molecular characterization of a novel pathogenic AIFM1 E336K mutation connecting mitochondrial dysfunction and neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These defects were accompanied by reduced CHCHD4 protein levels and mitochondrial content."
    explanation: Links the CMTX4 AIF defect to loss of its import partner CHCHD4 (MIA40) and reduced mitochondrial content.

- name: Mitochondrial Dysfunction in Peripheral Neurons
  biological_scale: CELLULAR
  description: >
    AIFM1 dysfunction produces abnormal mitochondrial morphology and
    accumulation within the axoplasm of peripheral nerve fibres and the
    subsarcolemmal region of muscle, reflecting disturbed mitochondrial
    homeostasis in the long peripheral neurons that are most dependent on
    sustained mitochondrial energy supply and transport.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Distal Axonal Degeneration
    description: >
      Neuronal mitochondrial dysfunction drives length-dependent dying-back
      degeneration of the longest peripheral axons.
  evidence:
  - reference: PMID:30031633
    reference_title: "A novel AIFM1 mutation in a Chinese family with X-linked Charcot-Marie-Tooth disease type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologies exhibited abnormal mitochondrial morphology and accumulation in axoplasm of nerve fiber and subsarcolemmal area of muscle."
    explanation: Nerve/muscle pathology in a CMTX4 family shows abnormal mitochondrial morphology and axoplasmic accumulation, linking AIFM1 mutation to neuronal mitochondrial dysfunction.
  - reference: PMID:17805014
    reference_title: "Apoptosis-inducing factor deficiency induces early mitochondrial degeneration in brain followed by progressive multifocal neuropathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "degenerating mitochondria were observed in most cells in these structures, even in nondegenerating neurons, a finding that indicates mitochondrial injury is a cause rather than an effect of neuronal cell death."
    explanation: Harlequin (AIF-downregulated) mouse model shows mitochondrial injury precedes and causes neuronal death, supporting mitochondrial dysfunction as the primary driver of AIF-related neurodegeneration.

- name: Distal Axonal Degeneration
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >
    The final common pathway in CMTX4 is length-dependent axonal degeneration
    of peripheral nerves, producing a large-fibre sensorimotor axonal
    neuropathy. The longest axons — those of the distal lower limbs — are
    affected first, yielding the characteristic distal-predominant weakness,
    atrophy, and sensory loss.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Peripheral Axonal Neuropathy
  - target: Distal Muscle Weakness
  - target: Distal Sensory Impairment
  - target: Distal Lower Limb Amyotrophy
  - target: Pes Cavus
  - target: Hammertoe
  - target: Areflexia
  evidence:
  - reference: PMID:31523922
    reference_title: "Clinical spectrum of AIFM1-associated disease in an Irish family, from mild neuropathy to severe cerebellar ataxia with colour blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurophysiology demonstrated length-dependent large-fibre sensorimotor axonal neuropathy, with particular involvement of superficial radial sensory responses."
    explanation: Neurophysiology in an AIFM1/CMTX4 family confirms a length-dependent large-fibre sensorimotor axonal neuropathy as the core lesion.

discussions:
- discussion_id: mismatch_harlequin_knockdown_vs_human_missense
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Harlequin (Hq) mouse — in which AIF is downregulated ~80% — faithfully
    model CMTX4, given that human CMTX4 is caused by hemizygous AIFM1 missense
    variants that destabilize AIF and shift its redox/apoptotic behaviour rather
    than simply reducing AIF expression, and given that the Hq mouse phenotype is
    dominated by central (cerebellar/thalamic/striatal/cortical) and retinal
    neurodegeneration rather than the human peripheral-neuropathy-plus-deafness
    presentation?
  attaches_to:
  - pathophysiology#Mitochondrial Dysfunction in Peripheral Neurons
  - pathophysiology#Impaired Mitochondrial OXPHOS Complex Assembly
  rationale: >-
    The principal in vivo AIF model, the Harlequin mouse (PMID:17805014), is a
    loss-of-expression (knockdown) model producing severe complex I deficiency and
    progressive multifocal CNS neurodegeneration. Human CMTX4, by contrast, is
    caused by missense variants (e.g., p.Glu493Val, p.Glu336Lys) that in the
    classic phenotype do NOT cause overt respiratory-chain failure (PMID:23217327)
    but instead destabilize AIF, weaken the AIF:CHCHD4/MIA40 import interaction, and
    perturb supercomplex assembly (PMID:41957773). Whether a knockdown model that
    removes AIF recapitulates the redox-shift, partial-loss-of-function mechanism of
    the human missense disease — and its peripheral-nerve/auditory-neuron tropism —
    is an open translational question.
  proposed_experiments:
  - experiment_id: exp_aifm1_knockin_peripheral_vs_central
    name: Knock-in mouse / iPSC neuron models of human CMTX4 missense variants
    description: >-
      Generate knock-in mice and/or patient-derived iPSC motor and sensory neurons
      carrying specific human CMTX4 missense alleles (e.g., p.Glu493Val,
      p.Glu336Lys) to model the redox-shift mechanism rather than AIF deficiency,
      and directly compare peripheral-nerve versus central/retinal vulnerability
      against the Harlequin knockdown phenotype.
  notes: >-
    Seeded from the OpenScientist deep-research report (2026-07-31), which flagged
    that the dominant animal model is a knockdown emphasizing central/retinal
    phenotypes and does not knock in the human CMTX4 missense alleles.

phenotypes:
- name: Peripheral Axonal Neuropathy
  category: Neurological
  frequency: OBLIGATE
  description: >
    A length-dependent, large-fibre sensorimotor axonal peripheral neuropathy
    is the defining and constant feature of CMTX4, with motor and sensory
    involvement and preserved or near-normal conduction velocities typical of
    an axonopathy.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
    clinical_course: PROGRESSIVE
    onset:
      onset_category: CHILDHOOD
      notes: >
        Classic onset is neonatal to early childhood; across the broader AIFM1
        spectrum reported age of onset ranges from ~18 months to ~39 years.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Defines the CMTX4 core phenotype as a slowly progressive axonal neuropathy.


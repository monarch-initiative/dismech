  - target: Increased gamma-delta T cell proportion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      As the conventional alpha-beta CD4+ compartment fails, gamma-delta T cells expand into the
      space it leaves. The expansion is read as compensatory rather than as a second lesion, but
      it is incomplete compensation - the expanded cells proliferate poorly on activation - and
      clinically it is a trap, because it can hold the total CD3+ count in the normal range while
      CD4+ cells are profoundly depleted.
    evidence:
    - reference: PMID:39110273
      reference_title: "Epidermodysplasia Verruciformis and Vδ2 γδ T-cell Expansion in STK4 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In conclusion, γδ T-cell expansion may act as a compensatory mechanism to combat viral infection, providing immune protection in immunocompromised individuals.
      explanation: >-
        The authors' interpretation of the expansion as compensatory, which is the claim this edge
        records.
    - reference: PMID:39110273
      reference_title: "Epidermodysplasia Verruciformis and Vδ2 γδ T-cell Expansion in STK4 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        their ability to proliferate in response to T-cell activation was impaired, as was that of CD4+ T cells.
      explanation: >-
        Qualifies the compensation: the expanded gamma-delta cells share the proliferative defect
        of the CD4+ cells they are standing in for.
- name: Increased lymphocyte and neutrophil apoptosis
  description: >-
    STK4 is the human ortholog of Drosophila Hippo, the central constituent of a
    conserved pathway controlling cell growth and apoptosis. STK4-deficient
    lymphocytes and neutrophils show enhanced loss of mitochondrial membrane
    potential and increased susceptibility to apoptosis, contributing to
    lymphopenia and intermittent neutropenia.

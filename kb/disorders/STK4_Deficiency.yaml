progression:
- phase: Symptom onset and diagnostic delay
  age_range: Median 6 years 8 months at onset; median 7 years 5 months at diagnosis
  notes: >-
    STK4 deficiency is not typically a neonatal SCID presentation. In the nine-patient clinical
    cohort the median age at symptom onset was 6 years 8 months and the median age at diagnosis 7
    years 5 months, with both ranges extending past 20 years. The gap between the two medians is
    short, so the delay in this disease is mostly in when it starts declaring itself rather than
    in how long recognition then takes - but the upper end of the range is what matters for
    ascertainment, since an adult presenting with CD4 lymphopenia, warts and lymphoma is a
    recognised route to the diagnosis.
  evidence:
  - reference: PMID:34146746
    reference_title: "Diversity in Serine/Threonine Protein Kinase-4 Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the cohort, median age at symptom onset and age at diagnosis were 6 years 8 months (range, 6-248 months) and 7 years 5 months (range, 6-260 months), respectively.
    explanation: Reports both medians and their ranges in the nine-patient cohort.
  - reference: PMID:39110273
    reference_title: "Epidermodysplasia Verruciformis and Vδ2 γδ T-cell Expansion in STK4 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had no relevant history of infectious disease during childhood other than mild wart-like lesion on the skin, but he developed diffuse large B-cell lymphoma (DLBCL) and EBV viremia with a low viral load in his thirties.
    explanation: >-
      A worked example of the late end of the range: an essentially unremarkable childhood
      followed by lymphoma in the fourth decade.
- phase: Variable clinical penetrance
  notes: >-
    Recorded because it constrains how the rest of this entry should be read. Infectious-disease
    penetrance varies substantially between patients with the same genetic defect, so the
    phenotype frequencies curated here describe a reported case series rather than the expected
    course of any individual patient.
  evidence:
  - reference: PMID:39110273
    reference_title: "Epidermodysplasia Verruciformis and Vδ2 γδ T-cell Expansion in STK4 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical penetrance of infectious diseases varies considerably among patients with inborn errors of immunity (IEI), even for identical genetic defects.
    explanation: >-
      States the variable-penetrance principle, offered by the authors as the frame for their own
      STK4 case.
differential_diagnoses:
- name: Autosomal recessive hyper-IgE syndrome
  description: >-
    The cohort review names this as the crucial differential, because the two diseases share the
    two features that most readily prompt the diagnosis: atopy and CD4 lymphopenia. Elevated IgE
    is common in STK4 deficiency, so the immunoglobulin pattern does not separate them either.
  distinguishing_features:
  - Progressive T- and B-cell lymphopenia with intermittent neutropenia favours STK4 deficiency.
  - Congenital heart defects such as atrial septal defect are reported in STK4 deficiency.
  - EBV-driven lymphoproliferation and lymphoma are characteristic of STK4 deficiency.
  - Identification of a biallelic loss-of-function STK4 variant is confirmatory.
  disease_term:
    preferred_term: autosomal recessive hyper-IgE syndrome
    term:
      id: MONDO:0018037
      label: hyper-IgE syndrome
  evidence:
  - reference: PMID:34146746
    reference_title: "Diversity in Serine/Threonine Protein Kinase-4 Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differential diagnosis with autosomal recessive hyper-IgE syndrome is crucial. Because, atopy and CD4 lymphopenia are common in both diseases.
    explanation: >-
      The authors' own identification of the differential and of the two features that make it
      difficult.
- name: Autoimmune lymphoproliferative syndrome
  description: >-
    STK4-deficient patients can present with a full ALPS-like picture - elevated double-negative T
    cells, non-malignant lymphadenopathy, hepatosplenomegaly, haemolytic anaemia and
    hypergammaglobulinaemia - and both patients in one report were initially given a clinical ALPS
    diagnosis.
  distinguishing_features:
  - ALPS-associated FAS-pathway mutations were absent in the STK4-deficient patients.
  - FAS-mediated apoptosis was intact, unlike in genuine ALPS.
  - Recurrent infections and CD4 lymphopenia point away from ALPS toward a combined immunodeficiency.
  disease_term:
    preferred_term: autoimmune lymphoproliferative syndrome
    term:
      id: MONDO:0017979
      label: autoimmune lymphoproliferative syndrome
  evidence:
  - reference: PMID:30386345
    reference_title: "EBV Negative Lymphoma and Autoimmune Lymphoproliferative Syndrome Like Phenotype Extend the Clinical Spectrum of Primary Immunodeficiency Caused by STK4 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also patient P1 presented with ALPS-like features (lymphadenopathy, elevated DNT cell number and increased Vitamin B12 levels) and both were initially clinically diagnosed as ALPS-like.
    explanation: Documents the ALPS-like misdirection in two STK4-deficient patients.
  - reference: PMID:30386345
    reference_title: "EBV Negative Lymphoma and Autoimmune Lymphoproliferative Syndrome Like Phenotype Extend the Clinical Spectrum of Primary Immunodeficiency Caused by STK4 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the patients harbored typically ALPS-associated mutations of the Fas receptor mediated apoptotic pathway and Fas-mediated apoptosis was not affected.
    explanation: The genetic and functional findings that exclude genuine ALPS.

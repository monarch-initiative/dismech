- name: Lymphoma
  description: >-
    Patients are prone to lymphoma, including EBV-associated and EBV-negative
    B-cell lymphoma, diffuse large B-cell lymphoma, and Hodgkin lymphoma. The
    authors who reported the first EBV-negative case proposed either loss of the
    tumour-suppressive function of STK4 or perturbed immune surveillance from the
    CD4+ T-cell deficit as the explanation; neither has been established over the
    other, so both are recorded as candidate mechanisms rather than as the cause.

discussions:
- discussion_id: gap_hypoalbuminaemia_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does loss of a nuclear DNA-repair enzyme lower serum albumin and
    raise total cholesterol, and why do these markers appear only late?
  attaches_to:
  - pathophysiology#Persistence of Abortive DNA Ligation Intermediates
  rationale: >-
    Hypoalbuminaemia is written into the disease's own MONDO and OMIM labels, yet none of
    the references read for this entry offers a mechanism. Every source treats it as an
    association: the 2001 gene papers report it as a clinical characteristic, the 2003
    French series and the 2011 Italian series quantify it, and the 2008 report places it in
    the adult stage. The searches run for this entry found nothing addressing the causal
    step, so the pathograph deliberately does not connect it to the APTX lesion by an edge.

    The gap is worth stating rather than papering over, because dismech now also holds an
    entry in which hypoalbuminaemia *is* mechanistically explained - hypercatabolic
    hypoproteinaemia, where FcRn salvage failure raises the catabolic rate of albumin. A
    protein-turnover study in AOA1 of the kind Waldmann and Terry performed in 1968 would
    settle in one experiment whether the albumin here is under-synthesised or
    over-catabolised, and nothing in the literature curated here reports one.

    Management practice has quietly taken a side. The published recommendation is a
    high-protein diet to prevent oedema by restoring serum albumin - which only makes sense
    if the albumin is substrate-limited, that is, a synthesis or intake problem. If AOA1
    hypoalbuminaemia were catabolic in the way hypercatabolic hypoproteinaemia's is, eating
    more protein would raise the flux through a leak rather than fix it, and the FcRn
    disease is the demonstration: those patients synthesise albumin at a normal rate and are
    still hypoalbuminaemic.

    So the assumption is testable and, so far as the literature read here goes, untested. It
    is also not idle: it is the stated rationale of a dietary recommendation given to
    patients.
  proposed_experiments:
  - experiment_id: aoa1_albumin_turnover_study
    name: Radiolabelled albumin turnover study in AOA1
    description: >-
      Measure albumin synthetic rate and fractional catabolic rate in mutation-confirmed
      AOA1 patients with hypoalbuminaemia, with urinary and faecal protein loss excluded,
      to distinguish reduced hepatic synthesis from accelerated catabolism.
  - experiment_id: aoa1_high_protein_diet_albumin_response
    name: Serum albumin response to protein intake in AOA1
    description: >-
      Measure serum albumin before and during a defined high-protein intake in AOA1 patients,
      to test the assumption embedded in the current dietary recommendation. A response
      supports a substrate-limited mechanism; no response, with normal renal and enteric
      protein handling, points at catabolism and would make the diet advice mechanistically
      wrong even if harmless.
  evidence:
  - reference: PMID:11586300
    reference_title: "The gene mutated in ataxia-ocular apraxia 1 encodes the new HIT/Zn-finger protein aprataxin."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOA1 is also characterized by axonal motor neuropathy and the later decrease of serum
      albumin levels and elevation of total cholesterol.
    explanation: >-
      The association and its late timing, stated without any mechanism - which is the gap
      itself.
  - reference: PMID:20301629
    reference_title: "Ataxia with Oculomotor Apraxia Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Prevention of secondary complications: High-protein diet to prevent edema by restoring
      serum albumin concentration; low-cholesterol diet.
    explanation: >-
      The management recommendation whose rationale presumes a substrate-limited mechanism.
      Curated as PARTIAL: it is evidence about what is believed and recommended, not evidence
      that the belief is correct.

- discussion_id: controversy_genotype_phenotype_correlation
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does the AOA1 phenotype vary with the APTX allele, or is it homogeneous regardless of
    mutation type and position?
  attaches_to:
  - pathophysiology#Biallelic APTX Loss-of-Function Variant
  rationale: >-
    Two large series disagree. The 2003 French series singles out A198V as producing a
    remarkably severe and persistent chorea, against the usual pattern in which chorea
    fades. The 2011 Italian series states flatly that the phenotype was homogeneous
    irrespective of mutation type and location.

    The disagreement may be smaller than it looks: A198V does not appear among the alleles
    reported in the Italian cohort, which found W279X, W279R and P206L homozygotes plus
    three novel truncating variants. A series that never observed the allele cannot
    contradict a claim about it. Recorded as a controversy rather than resolved in either
    direction, because settling it needs a cohort carrying A198V and scored for chorea
    persistence, which neither series is.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, a remarkably severe and persistent choreic phenotype was associated with one
      of the mutations (A198V).
    explanation: The allele-specific claim.
  - reference: PMID:21465257
    reference_title: "Ataxia with oculomotor apraxia type1 (AOA1): novel and recurrent aprataxin mutations, coenzyme Q10 analyses, and clinical findings in Italian patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical phenotype was homogeneous, irrespectively of the type and location of the
      APTX mutation
    explanation: >-
      The opposing claim. Curated as REFUTE of the general genotype-phenotype proposition,
      not as a refutation of the A198V observation specifically, which this cohort had no
      opportunity to test.

- discussion_id: interpretation_coenzyme_q10_deficiency_not_supported
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should AOA1 be curated as a secondary coenzyme Q10 deficiency, and does coenzyme Q10
    supplementation have a mechanistic rationale in this disease?
  attaches_to:
  - pathophysiology#Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
  rationale: >-
    AOA1 has been discussed alongside the secondary coenzyme Q10 deficiencies, which would
    give it a mitochondrial arm and a supplement with a rationale. The one series in this
    entry's reference set that actually measured it found normal coenzyme Q10 in muscle,
    fibroblasts and plasma in five of six mutation-positive subjects.

    That is a small number and a negative result, so it does not close the question. It is
    enough, though, to keep a mitochondrial node out of this pathograph: there is no
    measured coenzyme Q10 deficit to build one on, and inventing the node would create a
    therapeutic rationale the data do not support.
  evidence:
  - reference: PMID:21465257
    reference_title: "Ataxia with oculomotor apraxia type1 (AOA1): novel and recurrent aprataxin mutations, coenzyme Q10 analyses, and clinical findings in Italian patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses of coenzyme Q10 in muscle, fibroblasts, and plasma demonstrated normal levels
      of coenzyme in five of six mutated subjects.
    explanation: >-
      Direct measurement against the secondary-coenzyme-Q10-deficiency proposal, in three
      tissues.

- discussion_id: controversy_cognitive_impairment_universality
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is cognitive impairment universal in AOA1, or does intellect remain normal in a subset of
    patients?
  attaches_to:
  - pathophysiology#Cerebellar Degeneration
  rationale: >-
    Two sources make incompatible universal claims. The 14-patient French series states that
    cognitive impairment was always present. The GeneReviews chapter states that intellect
    remains normal in some individuals, with varying degrees of impairment in others.

    Both cannot be right as stated, and the disagreement is not resolvable from the abstracts
    curated here because neither reports the instrument used. "Cognitive impairment" assessed
    by formal neuropsychological battery and "intellect remains normal" assessed clinically
    can coexist in the same population: a patient with normal measured IQ and impaired
    executive or processing-speed performance would be counted in both categories by the two
    sources. Cerebellar cognitive-affective changes are exactly the kind that a global
    intellect judgement misses.

    The phenotype band was lowered from OBLIGATE to FREQUENT rather than picking a winner,
    because a band should not assert more than the weaker of two conflicting sources allows.

    A caveat on weighting: the GeneReviews chapter is formally retired and its own header
    warns the information may be out of date, so it is not automatically the better source.
    It is, however, the only one of the two that reports the observation prospectively across
    the disease's described natural history rather than in one ascertained cohort.
  proposed_experiments:
  - experiment_id: aoa1_neuropsychological_battery_stratified
    name: Formal neuropsychological profiling in a mutation-confirmed AOA1 cohort
    description: >-
      Administer a battery separating global intellectual ability from executive function,
      processing speed and the cerebellar cognitive-affective domains, in mutation-confirmed
      patients stratified by disease duration, to establish whether the disagreement is about
      prevalence or about which construct is being measured.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment was always present."
    explanation: The universality claim.
  - reference: PMID:20301629
    reference_title: "Ataxia with Oculomotor Apraxia Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Intellect remains normal in some individuals; in others, different degrees of cognitive
      impairment have been observed.
    explanation: The opposing claim, from the disease's GeneReviews chapter.

- discussion_id: interpretation_age_of_onset_discrepancy
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Why do the two natural-history sources report different mean ages of onset for AOA1, and
    which should a clinician use?
  attaches_to:
  - pathophysiology#Progressive Cerebellar Ataxia and Oculomotor Apraxia
  rationale: >-
    The GeneReviews chapter gives a mean onset of 4.3 years with a range of 2 to 10. The
    French series gives 6.8 plus or minus 4.8 years with a range of 2 to 18. The lower bound
    agrees; the upper bound differs by eight years.

    The likely explanation is ascertainment rather than disagreement. The French figure comes
    from screening a referred series of 158 non-Friedreich recessive ataxia families, which
    will include patients who presented late enough to be mistaken for something else; the
    GeneReviews figure describes the disease as characterised in dedicated AOA1 series. A
    referral-based denominator shifts a mean onset upward and widens the range in exactly this
    way.

    Both are recorded rather than averaged. For counselling, the wider range is the safer one:
    a first presentation at fifteen does not exclude AOA1.
  evidence:
  - reference: PMID:20301629
    reference_title: "Ataxia with Oculomotor Apraxia Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first manifestation is progressive gait imbalance (mean age of onset: 4.3 years;
      range: 2-10 years), followed by dysarthria, then upper-limb dysmetria with mild intention
      tremor.
    explanation: The GeneReviews onset figures.
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at onset was 6.8 +/- 4.8 years (range 2-18 years)."
    explanation: >-
      The cohort figure. Curated as PARTIAL of the onset claim because it is a referral-series
      denominator, which is the point of this discussion.

notes: >-
  Curated from a Perplexity sonar-deep-research report
  (research/Ataxia_With_Oculomotor_Apraxia_Type_1-deep-research-perplexity.md), which
  passed `just preflight-dr` against MONDO:0008842 with the canonical gene APTX mentioned
  75 times and OMIM 208920 matching the MONDO xref.

  The report was used to locate literature only. Its citations file contains just two
  PubMed links, so the other four references here were found by PubMed query and each
  abstract read before use.

  Review round 1 found the largest gap in the first version: no GeneReviews chapter had been
  searched for. PMID:20301629 exists, is now fetched and cited in eleven places, and it
  changed the entry substantively rather than decoratively.

  Most consequentially it corrected the natural history. The first version described a
  neuropathy that becomes dominant in young adults; GeneReviews reports quadriplegia and loss
  of ambulation about seven to ten years after a childhood onset, with a wheelchair usually
  needed by fifteen to twenty. That is a far more severe course than the cross-sectional
  cohort data alone conveyed, and it is now curated as an OBLIGATE phenotype.

  It also supplied five phenotypes the first version missed - generalized areflexia (universal
  and early), dysarthria, external ophthalmoplegia as the endpoint of the oculomotor apraxia,
  upper-limb dystonia, and dysmetria with intention tremor - and it contradicted one. The
  first version banded cognitive impairment OBLIGATE on the French series' "always present";
  GeneReviews says intellect remains normal in some individuals. The band was lowered to
  FREQUENT and the disagreement recorded as a controversy rather than resolved by preferring
  one source.

  The chapter is formally RETIRED and its own header warns the information may be out of date.
  It is cited anyway, because retirement is not a reason to ignore a source, but that status
  is why the cognitive-impairment discussion weighs the two sources rather than deferring to
  it.

  There is no disease-modifying therapy, and that is now curated as a claim rather than as an
  empty section. Everything published is supportive: physical therapy directed at the
  neuropathy, mobility support, educational support, neurological surveillance, and two
  dietary measures. The high-protein diet is the interesting one, because its stated purpose -
  restoring serum albumin - presumes the hypoalbuminaemia is substrate-limited rather than
  catabolic. Nothing tests that presumption, and the knowledge-gap discussion is now written
  around it, with a second proposed experiment that would settle it.

  Coenzyme Q10 is still not curated as a treatment, for the reason in the interpretation
  discussion: the one series that measured it found normal levels in five of six patients.

  Module conformance is claimed at four nodes and stops short of two others on purpose.
  `cerebellar_purkinje_degeneration#Cerebellar Neuron Insult` and `#Cerebellar Ataxia` are
  claimed; the intervening `#Purkinje Neuron Degeneration` is not, because it is a
  cell-level claim and the searches run for this entry surfaced no AOA1 neuropathological
  study - MRI cerebellar atrophy does not say which neuron was lost. The `Purkinje cell`
  cell-type annotation on the single-strand-break node reflects the module's own account
  of Purkinje vulnerability, not an AOA1-specific measurement.

  ORPHA:1168 is a MONDO xref for this disease and would be a good structured source for
  the epidemiology, but `just fetch-reference ORPHA:1168` fails in this environment
  because the Orphadata bulk XML is not present, so the prevalence records here are the
  cohort-level statements from the primary literature instead.


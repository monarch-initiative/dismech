genetic:
- name: APTX
  gene_term:
    preferred_term: APTX
    term:
      id: hgnc:15984
      label: APTX
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
  notes: >-
    Recurrent alleles include W279X, W279R, A198V, D267G and P206L. Mutations are largely
    confined to the HIT domain.
  evidence:
  - reference: PMID:11586300
    reference_title: "The gene mutated in ataxia-ocular apraxia 1 encodes the new HIT/Zn-finger protein aprataxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified the gene causing AOA1 and the major Portuguese and Japanese
      mutations.
    explanation: Causal assignment of AOA1 to APTX.
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 14 patients (nine families) with five different missense or truncating
      mutations in the aprataxin gene (W279X, A198V, D267G, W279R, IVS5+1), four of which
      were new.
    explanation: The allelic spectrum in a large European ataxia series.


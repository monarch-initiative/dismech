- name: High-Protein and Low-Cholesterol Diet
  description: >-
    Aimed at the two biochemical markers rather than at the neurological disease: a
    high-protein diet to prevent oedema by restoring serum albumin, and a low-cholesterol
    diet for the hypercholesterolaemia.

    This is more interesting than a supportive measure usually is, because it embeds a
    mechanistic assumption. Recommending protein intake to raise albumin presumes the
    hypoalbuminaemia is substrate-limited - a synthesis or intake problem - rather than a
    catabolic one. Nothing in the literature read here tests that presumption, and the
    knowledge-gap discussion is written around it.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

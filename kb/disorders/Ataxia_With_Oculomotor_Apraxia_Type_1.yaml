name: Ataxia With Oculomotor Apraxia Type 1
creation_date: "2026-08-23T22:05:00Z"
category: Mendelian
disease_term:
  preferred_term: ataxia with oculomotor apraxia type 1
  term:
    id: MONDO:0008842
    label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
description: >-
  An autosomal recessive childhood-onset cerebellar ataxia caused by biallelic loss of
  function at APTX. Aprataxin is a nucleotide hydrolase whose job is to undo a specific
  self-inflicted lesion: when DNA ligase aborts partway through sealing a nick, it leaves
  its own adenylate group covalently stuck to the 5'-phosphate terminus, and that end can
  no longer be ligated by anything. Aprataxin removes the adenylate and hands back a
  ligatable end. Without it the abortive intermediates accumulate, and with them
  unrepaired single-strand breaks.

  The clinical entity is not simply "another DNA repair ataxia". Two features make it
  distinctive. First, the phenotype is confined to the nervous system - unlike
  ataxia-telangiectasia, which it superficially resembles, there is no
  immunodeficiency, no chromosomal instability and no radiosensitivity at the organism
  level. Second, it carries two biochemical markers, hypoalbuminaemia and
  hypercholesterolaemia, which appear late, are present in most but not all patients, and
  have no mechanistic explanation in the literature curated here. The disease is named
  for a laboratory finding nobody can yet connect to the gene.

  The natural history also inverts over time. Ataxia and chorea dominate at onset; by
  young adulthood a severe axonal sensorimotor neuropathy is the most prominent feature
  and can mask the cerebellar signs that led to the diagnosis.
parents:
- Autosomal Recessive Cerebellar Ataxia
- DNA Repair Disease

pathophysiology:

- name: Biallelic APTX Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Aprataxin is built from three modules - an N-terminal region homologous to
    polynucleotide kinase phosphatase, a histidine-triad (HIT) nucleotide-hydrolase
    domain, and a C2H2 zinc finger. Inactivating mutations are largely confined to the HIT
    domain, which is the catalytic one, and patient lymphocytes show greatly decreased
    protein.

    The recurrent alleles are population-specific (W279X, W279R and P206L recur across
    European series), which is why AOA1 is the commonest recessive ataxia in Japan and
    second only to Friedreich ataxia in Portugal while accounting for around 5-6% of
    non-Friedreich recessive ataxia in mixed European cohorts.
  molecular_functions:
  - preferred_term: aprataxin DNA 5'-adenylate hydrolase activity
    term:
      id: GO:0033699
      label: DNA 5'-adenosine monophosphate hydrolase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11586299
    reference_title: "Early-onset ataxia with ocular motor apraxia and hypoalbuminemia is caused by mutations in a new HIT superfamily gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We narrowed the candidate region and have identified a new gene encoding a member of
      the histidine triad (HIT) superfamily as the 'causative' gene. We have called its
      product aprataxin; the gene symbol is APTX.
    explanation: The gene identification, from one of the two 2001 papers that reported it independently.
  - reference: PMID:16964241
    reference_title: "The neurodegenerative disease protein aprataxin resolves abortive DNA ligation intermediates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Aprataxin is a member of the histidine triad (HIT) family of nucleotide hydrolases and
      transferases, and inactivating mutations are largely confined to this HIT domain.
    explanation: >-
      Localises the disease-causing mutations to the catalytic domain, which is what makes
      the enzymatic model of this disease a mechanism rather than a correlation.
  - reference: PMID:21465257
    reference_title: "Ataxia with oculomotor apraxia type1 (AOA1): novel and recurrent aprataxin mutations, coenzyme Q10 analyses, and clinical findings in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of mutated proteins in lymphocytes from these patients was greatly decreased."
    explanation: >-
      Patient-derived confirmation that these alleles reduce protein, not only activity.
  downstream:
  - target: Persistence of Abortive DNA Ligation Intermediates
    causal_link_type: DIRECT
    description: >-
      The 5'-adenylate adduct has no other route of removal in these cells.

- name: Persistence of Abortive DNA Ligation Intermediates
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting lesion, and the reason this disease is mechanistically specific
    rather than a generic repair failure. DNA ligase works through an adenylated
    intermediate; when the reaction aborts, the adenylate is left covalently attached to
    the 5'-phosphate of the nick. That terminus is now chemically blocked - ligase cannot
    re-attack it, so the break is not merely unrepaired but unrepairable by the pathway
    that created it.

    Aprataxin's contribution is to release the adenylate and restore a 5'-phosphate that
    ligase can use. So the enzyme does not repair DNA; it repairs the repair machinery's
    own mistakes. That distinction matters for the disease, because it predicts damage
    proportional to ligation activity rather than to exogenous genotoxic exposure - which
    is consistent with a phenotype restricted to long-lived post-mitotic neurons and with
    the absence of the organism-level radiosensitivity seen in ataxia-telangiectasia.
  biological_processes:
  - preferred_term: single-strand break repair
    term:
      id: GO:0000012
      label: single strand break repair
    modifier: DECREASED
  evidence:
  - reference: PMID:16964241
    reference_title: "The neurodegenerative disease protein aprataxin resolves abortive DNA ligation intermediates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Specifically, aprataxin catalyses the nucleophilic release of adenylate groups
      covalently linked to 5'-phosphate termini at single-strand nicks and gaps, resulting in
      the production of 5'-phosphate termini that can be efficiently rejoined.
    explanation: The enzymatic reaction this node is built on, stated at chemical resolution.
  - reference: PMID:16964241
    reference_title: "The neurodegenerative disease protein aprataxin resolves abortive DNA ligation intermediates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Aprataxin associates with the DNA repair proteins XRCC1 and XRCC4, which are partners
      of DNA ligase III and ligase IV, respectively, suggestive of a role in DNA repair.
    explanation: >-
      Places aprataxin physically at both the single-strand-break and double-strand-break
      ligase complexes, which is how it reaches its substrate.
  downstream:
  - target: Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
    causal_link_type: DIRECT
    description: >-
      Blocked termini are not resolved and the nicks persist.

- name: Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
  role: effector
  biological_scale: CELLULAR
  description: >-
    Aprataxin-defective cells are hypersensitive to single-strand-break-inducing agents
    and show more induced chromosomal aberrations, so the repair deficit is demonstrable
    in the laboratory. The proposal that the neurological disease arises from gradual
    accumulation of these breaks is the authors' own inference from that biochemistry, and
    is curated here as the mechanism it is - a model that explains the cell-type
    selectivity of a ubiquitously expressed protein, not a lesion measured in patient
    brain.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:16964241
    reference_title: "The neurodegenerative disease protein aprataxin resolves abortive DNA ligation intermediates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with this, APTX-defective cell lines are sensitive to agents that cause
      single-strand breaks and exhibit an increased incidence of induced chromosomal
      aberrations.
    explanation: The cellular repair deficit, measured.
  - reference: PMID:16964241
    reference_title: "The neurodegenerative disease protein aprataxin resolves abortive DNA ligation intermediates."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These data indicate that neurological disorders associated with APTX mutations may be
      caused by the gradual accumulation of unrepaired DNA strand breaks resulting from
      abortive DNA ligation events.
    explanation: >-
      Curated as PARTIAL rather than SUPPORT because the authors write "may be caused by".
      The biochemistry is demonstrated; the link to neurodegeneration is proposed.
  downstream:
  - target: Cerebellar Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No intermediate step between accumulating breaks and neuronal loss is established in
      the sources curated here.
  - target: Peripheral Sensorimotor Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same unresolved gap applies to the peripheral nerve arm.

- name: Cerebellar Degeneration
  role: effector
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    Cerebellar atrophy on MRI is present in every reported patient, alongside the ataxia.
    The module this node conforms to explicitly admits a DNA-repair insult as one of the
    heterogeneous triggers converging on cerebellar neuron stress, which is exactly the
    entry point AOA1 uses.

    Conformance stops at the insult node deliberately. The module's downstream Purkinje
    Neuron Degeneration node is a cellular claim, and no neuropathological study of AOA1
    was found among the references read for this entry; MRI atrophy is a tissue-level
    observation and does not establish which cerebellar neuron is lost.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar ataxia with cerebellar atrophy on MRI and severe axonal sensorimotor
      neuropathy were present in all patients.
    explanation: >-
      Cerebellar atrophy in 14 of 14 mutation-positive patients. The same sentence carries
      the neuropathy arm.
  - reference: PMID:11586300
    reference_title: "The gene mutated in ataxia-ocular apraxia 1 encodes the new HIT/Zn-finger protein aprataxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It shares several neurological features with ataxia-telangiectasia, including early
      onset ataxia, oculomotor apraxia and cerebellar atrophy, but does not share its
      extraneurological features (immune deficiency, chromosomal instability and
      hypersensitivity to X-rays).
    explanation: >-
      The comparison that defines the entity's boundary: the same neurological syndrome as
      ataxia-telangiectasia without any of its systemic features.
  downstream:
  - target: Progressive Cerebellar Ataxia and Oculomotor Apraxia
    causal_link_type: DIRECT
    description: Loss of cerebellar tissue produces the clinical syndrome.

- name: Peripheral Sensorimotor Axonal Degeneration
  role: effector
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    A severe axonal sensorimotor neuropathy is present in every reported patient and
    becomes the dominant feature in young adults, at which point it can partially mask the
    cerebellar signs. AOA1 is a predominantly axonal neuropathy, which the module's central
    effector node explicitly covers alongside the demyelinating route.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar ataxia with cerebellar atrophy on MRI and severe axonal sensorimotor
      neuropathy were present in all patients.
    explanation: Universal severe axonal sensorimotor neuropathy in the cohort.
  - reference: PMID:11586300
    reference_title: "The gene mutated in ataxia-ocular apraxia 1 encodes the new HIT/Zn-finger protein aprataxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOA1 is also characterized by axonal motor neuropathy and the later decrease of serum
      albumin levels and elevation of total cholesterol.
    explanation: >-
      Axonal character of the neuropathy, and the late timing of the biochemical markers.
  downstream:
  - target: Neuropathy-Dominant Adult Phenotype
    causal_link_type: DIRECT
    description: >-
      Progressive length-dependent fibre loss becomes the leading disability.

- name: Progressive Cerebellar Ataxia and Oculomotor Apraxia
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Ataxia"
  description: >-
    Onset is in childhood, with a mean around seven years. Oculomotor apraxia is the
    eponymous sign but is not universal and is most prominent early.

    One measurement in the Le Ber series is worth carrying because it corrects a common
    bedside impression: saccade initiation is actually normal in AOA1. What looks like
    slow saccades is a train of multiple hypometric saccades taking longer to reach
    target. A clinician recording "slow saccades" would be describing the right
    abnormality with the wrong mechanism.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at onset was 6.8 +/- 4.8 years (range 2-18 years)."
    explanation: Age of onset in the mutation-confirmed cohort.
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ocular saccade initiation was normal, but their duration was increased by the
      succession of multiple hypometric saccades that could clinically be confused with
      'slow saccades'.
    explanation: >-
      The oculographic correction this node's description is written around.

- name: Neuropathy-Dominant Adult Phenotype
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  description: >-
    The inversion of the syndrome over time. Cerebellar ataxia and chorea lead at onset;
    in young adults the neuropathy is the most typical symptom and partially masks them.
    A patient first seen in adulthood may therefore present as a neuropathy rather than as
    an ataxia, which is a real diagnostic trap for an ataxia gene panel ordered on
    phenotype.
  evidence:
  - reference: PMID:14506070
    reference_title: "Cerebellar ataxia with oculomotor apraxia type 1: clinical and genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar ataxia and/or chorea predominate at onset, but later on they are often
      partially masked by severe neuropathy, which is the most typical symptom in young
      adults.
    explanation: The temporal inversion, stated directly by the source.
  - reference: PMID:18403580
    reference_title: "Ataxia with oculomotor apraxia type 1 (AOA1): clinical and neuropsychological features in 2 new patients and differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypoalbuminemia, hypercholesterolemia, and cognitive impairment are present in the
      adult stage
    explanation: >-
      Independent statement that the biochemical markers and the cognitive phenotype belong
      to the adult stage rather than to presentation.


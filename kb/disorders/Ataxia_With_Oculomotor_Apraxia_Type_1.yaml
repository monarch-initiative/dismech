      resulting from peripheral neuropathy; a wheelchair for mobility, usually by age 15-20
      years; educational support for difficulties with speaking, reading, and writing.
    explanation: >-
      The published management recommendations are entirely supportive. That is the evidence
      for this node's claim: what is recommended is what you recommend when there is nothing
      disease-modifying to give.

- name: Physical Therapy and Mobility Support
  description: >-
    Directed at the neuropathy rather than at the ataxia, which matches where the disability
    comes from: a wheelchair is usually needed by fifteen to twenty years of age.

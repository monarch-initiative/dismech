    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prevention of secondary complications: High-protein diet to prevent edema by restoring
      serum albumin concentration; low-cholesterol diet.
    explanation: >-
      Both dietary recommendations and the stated purpose of the first, which is what the
      mechanistic assumption above is read from.


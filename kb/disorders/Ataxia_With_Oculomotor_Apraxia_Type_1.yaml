diagnosis:
- name: APTX Sequencing in Early-Onset Recessive Ataxia
  description: >-
    The definitive test. It should be considered in childhood chorea as well as in ataxia,
    since chorea leads at onset in most patients - although screening isolated chorea
    without ataxia has a poor yield.
  evidence:
  - reference: PMID:21465257
    reference_title: "Ataxia with oculomotor apraxia type1 (AOA1): novel and recurrent aprataxin mutations, coenzyme Q10 analyses, and clinical findings in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No mutations were identified in subjects with isolated chorea."
    explanation: >-
      Bounds the previous point: chorea accompanied by ataxia is a clue, chorea alone is not.
      52 patients with early-onset isolated chorea yielded no APTX mutations.

- name: Differentiation from Ataxia-Telangiectasia
  description: >-
    The clinical overlap is close and the distinction is systemic rather than neurological:
    AOA1 lacks immunodeficiency, chromosomal instability and radiosensitivity.
    Alpha-fetoprotein helps but is a weaker discriminator than usually assumed, since it
    is mildly raised in a minority of AOA1 patients.
  evidence:
  - reference: PMID:11586300
    reference_title: "The gene mutated in ataxia-ocular apraxia 1 encodes the new HIT/Zn-finger protein aprataxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It shares several neurological features with ataxia-telangiectasia, including early
      onset ataxia, oculomotor apraxia and cerebellar atrophy, but does not share its
      extraneurological features (immune deficiency, chromosomal instability and
      hypersensitivity to X-rays).
    explanation: The discriminating features, stated as a contrast by the source.

treatments:
- name: No Disease-Modifying Therapy
  description: >-
    Curated positively rather than by omission, because an empty treatments section reads as
    an unfinished entry rather than as a finding. Nothing in the literature read for this
    entry modifies the aprataxin defect or the accumulation of unrepaired strand breaks.
    Everything below is supportive, and the published management recommendations are
    functional and preventive rather than mechanistic.

    Coenzyme Q10 has been discussed as an investigational option on the assumption of a
    secondary coenzyme Q10 deficiency. The one series in this entry's reference set that
    measured it found normal levels in five of six patients, which is why it is not curated
    as a treatment - see the interpretation discussion.

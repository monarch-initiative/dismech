datasets:
- accession: ega:EGAS00001000346
  title: Genetic landscape of pediatric Retinoblastoma
  description: Retinoblastoma is a pediatric cancer of the developing retina. All retinoblastomas are believed to initiate with biallelic inactivation of the RB1 gene. To identify subsequent genetic lesions in retinoblastoma, we performed whole genome sequencing of tumor and normal DNA of 4 children with retinoblastoma and one matched orthotopic xenograft. Both alleles of RB1 were inactivated in the tumor samples. 3 of the patients had sporadic retinoblastoma and one patient had inherited retinoblastoma. Overall, there were few single nucleotide changes in coding regions of the genome and some of the tumors had few chromosomal lesions.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WGS
  publication: PMID:22237022
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Retinoblastoma"); description-level mentions were not accepted. EGA study_type: Whole Genome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000598
  title: RB1 Gene Inactivation by Chromothripsis in Human Retinoblastoma
  description: Retinoblastoma is a rare childhood cancer of the developing retina. Most retinoblastomas initiate with biallelic inactivation of the RB1 gene through diverse mechanisms including point mutations, nucleotide insertions, deletions, loss of heterozygosity and promoter hypermethylation. Recently, a novel mechanism of retinoblastoma initiation was proposed. Gallie and colleagues discovered that a small proportion of retinoblastomas lack RB1 mutations and had MYCN amplification [1]. In this study, we identified recurrent chromosomal, regional and focal genomic lesions in 94 primary retinoblastomas with their matched normal DNA using SNP 6.0 chips.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Retinoblastoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001657
  title: Exome sequencing of retinoblastoma tumors
  description: Retinoblastoma is the most common intraocular cancer of infancy and childhood, with an incidence of one case per 15,000 - 20,000 live births. Patients in developed countries have a good prognosis. However, in most cases, enucleation of the affected eye is required. In low- and middle-income countries, retinoblastoma is frequently lethal. A loss of function of both alleles of the RB1 gene is an early event in the development of retinoblastoma. However, other genes are also likely to be involved in the development of this cancer.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WES
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Retinoblastoma"); description-level mentions were not accepted. EGA study_type: Exome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

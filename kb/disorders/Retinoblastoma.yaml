name: Retinoblastoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Retinoblastoma is a rare pediatric malignancy arising from the developing
  retina — current evidence favours the maturing cone precursor as the cell of
  origin — and is the paradigmatic example of the two-hit hypothesis of tumor
  suppressor gene inactivation. Biallelic loss of RB1 function initiates
  almost all retinoblastoma. In hereditary cases (40%), a germline RB1
  mutation is inherited and a somatic second hit occurs, leading to
  bilateral/multifocal tumors and increased risk of secondary malignancies. In
  sporadic cases (60%), both RB1 alleles are inactivated somatically in a
  single retinal cell. Two qualifications matter mechanistically. First,
  biallelic RB1 loss is not strictly necessary: roughly 2-3% of unilateral
  tumors retain two functional RB1 alleles and are instead driven by
  high-level MYCN amplification. Second, RB1 loss alone is not sufficient in
  humans — progression to overt tumor requires additional events such as MYCN
  or MDM4 gain, BCOR mutation, and 1q/6p gain.
categories:
- Pediatric Cancer
- Ocular Malignancy
- Hereditary Cancer Syndrome
parents:
- retinal cancer
has_subtypes:
- name: Hereditary Retinoblastoma
  description: >-
    Caused by germline RB1 mutation (first hit) present in all cells, with somatic
    loss of the remaining allele in retinal cells. Typically bilateral or multifocal.
    Patients have 50% chance of passing mutation to offspring and increased lifetime
    risk of secondary malignancies including osteosarcoma.
  evidence:
  - reference: PMID:5279523
    reference_title: "Mutation and cancer: statistical study of retinoblastoma."
    supports: SUPPORT
    snippet: "In the dominantly inherited form, one mutation is inherited via the germinal cells and the second occurs in somatic cells."
    explanation: Knudson's analysis established that hereditary retinoblastoma involves germline inheritance of the first mutation.
- name: Sporadic Retinoblastoma
  description: >-
    Both RB1 alleles are inactivated by somatic mutations in a single retinal
    precursor cell. Typically unilateral and unifocal. No increased risk of
    secondary malignancies and no familial transmission unless mosaicism present.
  evidence:
  - reference: PMID:5279523
    reference_title: "Mutation and cancer: statistical study of retinoblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the nonhereditary form, both mutations occur in somatic cells."
    explanation: Knudson established that sporadic retinoblastoma requires two somatic mutations in the same cell.
- name: MYCN-Amplified RB1-Wildtype Retinoblastoma
  display_name: MYCN-Amplified RB1+/+ Retinoblastoma
  description: >-
    A rare molecular subtype (roughly 2-3% of unilateral non-familial
    retinoblastoma) that retains two functional RB1 alleles and expresses
    functional RB1 protein, driven instead by high-level MYCN amplification
    (28-121 copies). These tumors present at a strikingly early age (median
    ~4.5 months), show distinct aggressive histology, and carry fewer of the
    secondary copy-number changes typical of RB1-null retinoblastoma. This
    subtype is the principal exception to the otherwise obligatory two-hit RB1
    model and has direct clinical consequence: RB1 germline testing is
    uninformative, so MYCN status must be assessed to explain an
    RB1-mutation-negative unilateral tumor.
  evidence:
  - reference: PMID:23498719
    reference_title: "Characterisation of retinoblastomas without RB1 mutations: genomic, gene expression, and clinical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No RB1 mutations (RB1(+/+)) were reported in 29 (2·7%) of 1068 unilateral retinoblastoma tumours. 15 of the 29 RB1(+/+) tumours had high-level MYCN oncogene amplification (28-121 copies; RB1(+/+)MYCN(A)), whereas none of 93 RB1(-/-) primary tumours tested showed MYCN amplification (p<0·0001)."
    explanation: >-
      Establishes the frequency of RB1-wildtype retinoblastoma in a
      1068-tumor series and the mutually exclusive relationship between MYCN
      amplification and biallelic RB1 loss.
  - reference: PMID:23498719
    reference_title: "Characterisation of retinoblastomas without RB1 mutations: genomic, gene expression, and clinical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amplification of the MYCN oncogene might initiate retinoblastoma in the presence of non-mutated RB1 genes."
    explanation: >-
      States the central mechanistic claim — that MYCN amplification can
      initiate retinoblastoma without RB1 inactivation — which is the
      counterexample to strict two-hit necessity.
  - reference: PMID:23498719
    reference_title: "Characterisation of retinoblastomas without RB1 mutations: genomic, gene expression, and clinical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RB1(+/+)MYCN(A) tumours expressed functional RB1 protein, had fewer overall genomic copy-number changes in genes characteristic of retinoblastoma than did RB1(-/-) tumours, and showed distinct aggressive histological features."
    explanation: >-
      Confirms retained functional RB1 protein and the distinct genomic and
      histologic profile of this subtype.
pathophysiology:
- name: RB1 Tumor Suppressor Inactivation
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    The RB1 gene encodes the retinoblastoma protein (pRB), a critical regulator of
    the cell cycle. Biallelic RB1 loss removes the constraint on E2F transcription
    factors, allowing uncontrolled progression through the G1/S checkpoint.
    Retinoblastoma exemplifies Knudson's two-hit hypothesis: in hereditary cases,
    one mutation is inherited and the second is somatic; in sporadic cases, both
    mutations occur somatically in the same cell.
  cell_types:
  - preferred_term: retinal progenitor cell
    term:
      id: CL:0002672
      label: retinal progenitor cell
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: ABNORMAL
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Loss of Cell Cycle Checkpoint Control
    description: pRB loss releases E2F transcription factors from inhibition
- name: Loss of Cell Cycle Checkpoint Control
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    pRB normally binds and inhibits E2F transcription factors during G1 phase.
    When pRB is phosphorylated by cyclin-dependent kinases or functionally lost,
    E2F is released to activate genes required for S-phase entry, including
    cyclins, DNA replication factors, and proliferative genes.
  biological_processes:
  - preferred_term: cell cycle checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000075
      label: cell cycle checkpoint signaling
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  downstream:
  - target: Uncontrolled Retinal Cell Proliferation
    description: E2F-driven gene expression promotes S-phase entry and cell division
- name: Uncontrolled Retinal Cell Proliferation
  conforms_to: "evading_growth_suppressors#Unrestrained Proliferation"
  description: >-
    Loss of pRB-mediated cell cycle control results in constitutive E2F activity,
    driving retinal progenitor cells through repeated rounds of DNA replication
    and cell division. This uncontrolled proliferation leads to tumor formation.
  cell_types:
  - preferred_term: retinal progenitor cell
    term:
      id: CL:0002672
      label: retinal progenitor cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:5279523
    reference_title: "Mutation and cancer: statistical study of retinoblastoma."
    supports: PARTIAL
    snippet: "retinoblastoma is a cancer caused by two mutational events. In the dominantly inherited form, one mutation is inherited via the germinal cells and the second occurs in somatic cells. In the nonhereditary form, both mutations occur in somatic cells."
    explanation: This is the foundational Knudson paper establishing the two-hit hypothesis based on statistical analysis of retinoblastoma cases.
histopathology:
- name: Intraocular Malignancy
  finding_term:
    preferred_term: Retinoblastoma
    term:
      id: NCIT:C7541
      label: Retinoblastoma
  frequency: VERY_FREQUENT
  description: >-
    Retinoblastoma is the most common intraocular malignancy in children.
  evidence:
  - reference: PMID:41567907
    reference_title: "Adjuvant Chemotherapy in Children With Enucleated Retinoblastoma and Histopathologic High-Risk Features: Survival Outcomes From a Single Institution in a Middle-Income Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinoblastoma is the most common intraocular malignancy in children."
    explanation: Abstract states retinoblastoma is the most common intraocular malignancy in children; the pediatric restriction is part of the claim.
  notes: >-
    The pediatric restriction matters: retinoblastoma is not the most common
    intraocular malignancy overall — in adults that is uveal melanoma. This
    contrast is not covered by the cited PMID:41567907 snippet and is recorded
    here as an uncited orienting note rather than as an evidenced claim.

phenotypes:
- category: Ocular
  name: Leukocoria
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    White pupillary reflex (cat's eye reflex) is the most common presenting sign,
    resulting from light reflecting off the tumor surface. Often noticed in
    photographs or by parents.
  phenotype_term:
    preferred_term: Leukocoria
    term:
      id: HP:0000555
      label: Leukocoria
- category: Ocular
  name: Strabismus
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Misalignment of the eyes is the second most common presenting sign, occurring
    when the tumor affects macular vision and disrupts binocular fusion.
  phenotype_term:
    preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
- category: Ocular
  name: Decreased Visual Acuity
  frequency: FREQUENT
  description: >-
    Vision loss occurs when the tumor involves the macula or becomes large enough
    to obstruct the visual axis.
  phenotype_term:
    preferred_term: Decreased visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
- category: Ocular
  name: Ocular Pain
  frequency: OCCASIONAL
  description: >-
    Eye pain may occur with advanced disease causing secondary glaucoma or
    inflammation.
  phenotype_term:
    preferred_term: Eye pain
    term:
      id: HP:0200026
      label: Ocular pain
- category: Neurologic
  name: Trilateral Retinoblastoma
  frequency: VERY_RARE
  description: >-
    An intracranial midline embryonal tumor — most often pineoblastoma, less
    often suprasellar or parasellar — arising in a child with bilateral or
    familial retinoblastoma. It reflects the same germline RB1 lesion acting
    in the pineal gland, which is embryologically photoreceptor-related, and
    is therefore a synchronous or metachronous primary rather than a
    metastasis. Its presence is itself diagnostic of germline disease
    (GeneReviews H1 risk category) and it carries a poor prognosis, which is
    why baseline and surveillance neuroimaging is recommended in germline
    carriers. The pineal tumor is curated separately as `Pineoblastoma`.
  phenotype_term:
    preferred_term: Malignant neoplasm of the central nervous system
    term:
      id: HP:0100836
      label: Malignant neoplasm of the central nervous system
  evidence:
  - reference: PMID:20301625
    reference_title: "Retinoblastoma (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "trilateral retinoblastoma (retinoblastoma with intracranial central nervous system midline embryonic tumor)"
    explanation: >-
      GeneReviews defines trilateral retinoblastoma as retinoblastoma with an
      intracranial CNS midline embryonal tumor, and places it in the H1
      category of individuals presumed to carry a germline RB1 variant.
- category: Systemic
  name: Secondary Malignancies
  frequency: OCCASIONAL
  description: >-
    Patients with hereditary retinoblastoma have significantly increased risk of
    secondary cancers, particularly osteosarcoma, soft tissue sarcomas, and
    melanoma. Risk is increased further by external beam radiation therapy.
  phenotype_term:
    preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
biochemical:
- name: RB1 Genetic Testing
  notes: >-
    Molecular testing identifies RB1 mutations including point mutations, small
    insertions/deletions, large deletions, and promoter hypermethylation. Testing
    is essential for genetic counseling and surveillance of family members.
genetic:
- name: RB1
  gene_term:
    preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  association: Germline and Somatic Mutations
  evidence:
  - reference: CGGV:assertion_f8c79621-7ace-4c0c-874e-a315a2e6c872-2020-07-30T213929.219Z
    reference_title: "RB1 / retinoblastoma (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RB1 | HGNC:9884 | retinoblastoma | MONDO:0008380 | AD | Definitive"
    explanation: ClinGen classifies the RB1-retinoblastoma gene-disease relationship as definitive with autosomal dominant inheritance.
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    RB1 (13q14.2) encodes the retinoblastoma protein, the first tumor suppressor
    gene identified. Loss-of-function mutations include nonsense, frameshift, splice
    site, and large deletions. Germline mutations are present in 40% of cases.
    Hereditary retinoblastoma follows autosomal dominant inheritance with high
    but incomplete penetrance (approximately 90%).
treatments:
- name: Focal Therapy (Laser/Cryotherapy)
  description: >-
    Small tumors may be treated with focal ablation including laser photocoagulation
    or cryotherapy. These treatments spare vision and avoid systemic toxicity.
  treatment_term:
    preferred_term: laser ablation therapy
    term:
      id: NCIT:C111241
      label: Laser Ablation
- name: Chemotherapy
  description: >-
    Systemic chemotherapy with carboplatin, vincristine, and etoposide (CEV) reduces
    tumor size enabling focal consolidation. Intra-arterial chemotherapy delivers
    melphalan directly to the ophthalmic artery for localized effect.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: melphalan
      term:
        id: CHEBI:28876
        label: melphalan
- name: Enucleation
  description: >-
    Surgical removal of the eye is indicated for advanced intraocular disease,
    particularly when vision cannot be preserved. Provides excellent local control
    and prevents extraocular spread.
  treatment_term:
    preferred_term: Enucleation
    term:
      id: NCIT:C48601
      label: Enucleation
- name: External Beam Radiation
  description: >-
    Historically used for retinoblastoma but now avoided when possible due to
    significantly increased risk of secondary malignancies in RB1 germline
    mutation carriers, particularly osteosarcoma in the radiation field.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy

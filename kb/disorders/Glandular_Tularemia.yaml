name: Glandular Tularemia
creation_date: "2026-09-25T15:58:32Z"
category: Infectious Disease
description: >-
  Glandular tularemia is the regional-lymph-node form of Francisella tularensis
  infection without the cutaneous ulcer that defines ulceroglandular disease:
  exposure through an arthropod bite or infected-animal contact seeds the
  intracellular bacterium, Francisella phagosomal escape supports macrophage
  cytosolic replication, and inflammation in draining lymph nodes produces
  lymphadenopathy.
disease_term:
  preferred_term: glandular tularemia
  term:
    id: MONDO:0000320
    label: glandular tularemia
parents:
- Tularemia
synonyms:
- Lymph node tularemia
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    glandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Glandular tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Arthropod or Animal Francisella tularensis Exposure
  description: >-
    Arthropod bites or direct handling of infected animals introduce F. tularensis
    and can initiate the glandular form of tularemia.
  biological_scale: TISSUE
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after inoculation.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod bite and infected-animal handling as acquisition routes for
      glandular tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Regional Lymph Node Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular Francisella replication drives inflammatory injury in the
      regional draining lymph nodes.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Regional Lymph Node Inflammation
  description: >-
    Cytosolic Francisella infection activates inflammatory responses in the draining
    lymphatic basin, producing the lymphadenopathy that defines glandular tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      Inflammation in the regional draining basin produces enlarged lymph nodes.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic inflammation produces the early febrile syndrome of tularemia.
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      activation of the inflammasome mediated by caspase-1, and a pro-inflammatory
      response
    explanation: >-
      Supports inflammasome activation and pro-inflammatory signaling downstream of
      cytosolic Francisella infection.
phenotypes:
- name: Lymphadenopathy
  category: Immune
  diagnostic: true
  description: >-
    Regional lymphadenopathy without a defining skin ulcer is the localizing feature
    of glandular tularemia.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In glandular form, there are no skin ulcers but lymphadenopathy is marked
    explanation: >-
      Directly supports marked lymphadenopathy as the defining local finding of
      glandular tularemia without the skin ulcer of ulceroglandular disease.
- name: Fever
  category: Constitutional
  description: >-
    Fever is part of the acute flu-like constitutional syndrome that accompanies
    the regional lymphadenopathy of tularemia.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease has an acute onset, with the occurrence of fever
    explanation: >-
      Supports fever as part of the acute presentation of tularemia, including
      glandular tularemia.
treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
transmission:
- name: Arthropod and Animal Contact Exposure
  description: >-
    Arthropod bites or handling infected animals can introduce F. tularensis and
    produce the glandular form of tularemia.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod and animal-contact exposure as routes leading to glandular
      tularemia.

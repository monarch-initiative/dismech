    reference_title: "Recurrent hemophagocytic lymphohistiocytosis in COG deficiency: a case series and systematic review of inflammatory manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three patients with COG6 or COG7 deficiency presenting
      recurrent episodes of hemophagocytic lymphohistiocytosis (HLH).
    explanation: Recurrent HLH episodes in COG6/COG7-deficient patients.
  - reference: PMID:29445937

phenotypes:
- name: Abnormal glycosylation
  category: Biochemical
  description: >-
    Type 2 serum transferrin isoelectric focusing pattern with abnormal
    apolipoprotein C-III isoelectric focusing, indicating combined N- and
    O-glycosylation defects.
  phenotype_term:
    preferred_term: Abnormal glycosylation
    term:
      id: HP:0012345
      label: Abnormal glycosylation
  evidence:
  - reference: PMID:23430903
    reference_title: "Deficiency of Subunit 6 of the Conserved Oligomeric Golgi Complex (COG6-CDG): Second Patient, Different Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The type 2 isoelectric focusing (IEF) pattern of serum transferrin and
      the abnormal IEF of serum apolipoprotein C-III in our patient pointed to
      a CDG-II, affecting the biosynthesis of both N- and O-linked glycans.
    explanation: Serum transferrin and apoC-III IEF are both abnormal.
- name: Liver involvement
  category: Hepatic
  frequency: VERY_FREQUENT
  description: >-
    Liver involvement (hepatopathy, elevated transaminases, cholestasis,
    fibrosis or cirrhosis) was present in 9 of 10 patients in the 2015
    review.
  phenotype_term:
    preferred_term: Liver involvement
    term:
      id: HP:0001392
      label: Abnormality of the liver
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:26260076
    reference_title: Key features and clinical variability of COG6-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In spite of clinical variability, we delineate the core features of
      COG6-CDG i.e. liver involvement (9/10), microcephaly (8/10),
      developmental disability (8/10), recurrent infections (7/10), early
      lethality (6/10), and hypohidrosis predisposing for hyperthermia (6/10)
      and hyperkeratosis (4/10) as ectodermal signs.
    explanation: Liver involvement in 9 of 10 patients.
  sequelae:

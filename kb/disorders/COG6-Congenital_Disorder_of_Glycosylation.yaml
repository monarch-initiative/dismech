inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic COG6 variants, homozygous in
    consanguineous families or compound heterozygous, inherited from
    unaffected carrier parents.
  evidence:
  - reference: PMID:29709711
    reference_title: Compound heterozygous variants of the COG6 gene in a Chinese patient with deficiency of subunit 6 of the conserved oligomeric Golgi complex (COG6-CDG).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      COG6-CDG is a rare autosomal recessive disease of congenital disorders of
      glycosylation (CDG) caused by deficiency of subunit 6 of the conserved
      oligomeric Golgi complex (COG6)
    explanation: Directly states autosomal recessive inheritance.
  - reference: PMID:34331832
    reference_title: Genetic analysis and prenatal diagnosis in a Chinese with growth retardation, abnormal liver function, and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic sequencing identified two novel heterozygous mutations: c.428G>T
      (p.S143I) and c.1843C>T (p.Q615X) in the COG6 gene, inherited from her
      healthy parents, respectively.
    explanation: >-
      Compound heterozygous variants inherited from unaffected parents fit
      autosomal recessive transmission.
pathophysiology:
- name: COG6 Loss of Function
  description: >-
    Biallelic COG6 variants reduce or abolish COG6 protein. Null alleles
    (nonsense, frameshift, canonical splice) cause the severe, often lethal
    CDG phenotype. The hypomorphic deep intronic c.1167-24A>G allele, which
    causes the separately curated allelic Shaheen syndrome, leaves some normal
    transcript.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COG6
    term:
      id: hgnc:18621
      label: COG6
  evidence:
  - reference: PMID:41362306
    reference_title: Insights Into the Pathological Glycosylation Associated With COG6-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of COG6-CDG was confirmed by the complete absence of the
      COG6 subunit, impairment of two other cooperating subunits, and delayed
      retrograde transport.
    explanation: >-
      A truncating homozygous variant abolished COG6 protein in patient
      cells.
  - reference: PMID:23606727
    reference_title: A novel syndrome of hypohidrosis and intellectual disability is linked to COG6 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing uncovered a deep intronic (NM_020751.2:c.1167-24A>G)
      variant in COG6 that largely replaces the consensus acceptor site,
      resulting in pronounced reduction of the normal transcript and consequent
      deficiency of COG6 protein.
    explanation: >-
      A hypomorphic COG6 allele (the Shaheen syndrome founder variant) reduces
      COG6 protein, supporting loss of function as the shared mechanism.
  - reference: PMID:40225945
    reference_title: "COG6-CDG: Two Novel Variants and Milder Phenotype in a Chinese Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The paternal variant resulted in nonsense-mediated mRNA decay.
    explanation: A nonsense allele acts through transcript loss.
  notes: >-
    No molecular_functions term is bound. COG6 is a lobe B subunit of the COG
    vesicle-tethering complex, and the only molecular-function annotation GO
    gives human COG6 (UniProtKB:Q9Y2V7, QuickGO, retrieved 2026-11-23) is
    GO:0005515 protein binding (IPI), which says nothing the node does not
    already. The node is grandfathered in the gene activity grounding baseline,
    as the COG1, COG4, COG7 and COG8 entries are.
  downstream:
  - target: COG Complex Fragmentation and Loss of Golgi Integrity
    description: >-
      Without COG6, the integral octameric COG complex is replaced by
      fragments and the Golgi loses its normal structure.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20605848
      reference_title: Fatal outcome due to deficiency of subunit 6 of the conserved oligomeric Golgi complex leading to a new type of congenital disorders of glycosylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Western blot examinations combined with gel filtration chromatography
        studies in patient-derived skin fibroblasts showed a severely reduced
        expression of the mentioned subunit and the occurrence of COG complex
        fragments at the expense of the integral COG complex.
      explanation: >-
        Patient fibroblasts link reduced COG6 to fragmentation of the COG
        complex.
  - target: Golgi SNARE STX6 Deficiency
    description: >-
      COG6 binds and stabilises a subset of Golgi SNAREs; its loss is
      accompanied by marked STX6 deficiency.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23606727
      reference_title: A novel syndrome of hypohidrosis and intellectual disability is linked to COG6 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient cells also exhibited pronounced deficiency of STX6, consistent
        with the established stabilising effect of COG6 on STX6.
      explanation: >-
        COG6-deficient patient cells show STX6 deficiency attributed to loss of
        COG6 stabilisation.
- name: COG Complex Fragmentation and Loss of Golgi Integrity
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >-
    COG6 is a lobe B subunit that contacts Golgi SNAREs. Its loss fragments
    the COG complex, impairs cooperating subunits and distorts Golgi
    structure; COG6 knockout produces one of the most severe Golgi
    distortions among single-subunit knockouts.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  locations:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:23057818
    reference_title: COG6 interacts with a subset of the Golgi SNAREs and is important for the Golgi complex integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of COG6, or its depletion from cells, disrupts the
      integrity of the Golgi complex.
    explanation: COG6 depletion disrupts Golgi integrity in cultured cells.
  - reference: PMID:27066481
    reference_title: "COG Complex Complexities: Detailed Characterization of a Complete Set of HEK293T Cells Lacking Individual COG Subunits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lobe A and Cog6 subunit KOs displayed a more severely distorted Golgi
      structure
    explanation: >-
      COG6 knockout HEK293T cells show severe distortion of Golgi structure.
  - reference: PMID:41362306
    reference_title: Insights Into the Pathological Glycosylation Associated With COG6-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of COG6-CDG was confirmed by the complete absence of the
      COG6 subunit, impairment of two other cooperating subunits, and delayed
      retrograde transport.
    explanation: >-
      Loss of COG6 in patient cells also impairs other COG subunits.
  downstream:
  - target: Impaired Retrograde Golgi Trafficking
    description: >-
      Loss of an intact COG tethering complex slows COG-dependent retrograde
      Golgi trafficking; wild-type COG6 restores it.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20605848
      reference_title: Fatal outcome due to deficiency of subunit 6 of the conserved oligomeric Golgi complex leading to a new type of congenital disorders of glycosylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Retroviral complementation of the patients' fibroblasts with the
        wild-type COG6-cDNA led to normalization of the COG complex-depending
        retrograde protein transport after Brefeldin A treatment, demonstrated
        by immunofluorescence analysis.
      explanation: >-
        Rescue of COG-dependent retrograde transport by wild-type COG6 ties the
        trafficking defect to loss of the complex subunit.
- name: Impaired Retrograde Golgi Trafficking
  description: >-
    Patient fibroblasts show slowed anterograde and retrograde ER-Golgi
    transport after Brefeldin A, and delayed retrograde transport is used to
    confirm COG6 variant pathogenicity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: retrograde Golgi-to-ER vesicle transport
    modifier: DECREASED
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
  - preferred_term: intra-Golgi vesicle-mediated transport
    modifier: ABNORMAL
    term:
      id: GO:0006891
      label: intra-Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:36636598
    reference_title: The Swedish COG6-CDG experience and a comprehensive literature review.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To confirm the pathogenicity of the variants, we treated patient and
      control fibroblasts with the ER-Golgi transport inhibitor Brefeldin-A and
      show that patient cells manifest a significantly slower anterograde and
      retrograde ER-Golgi transport.
    explanation: Patient fibroblasts show slowed ER-Golgi transport.
  downstream:
  - target: Mislocalized Golgi Glycosylation Machinery
    description: >-
      The COG complex recycles Golgi glycosylation enzymes through retrograde
      intra-Golgi transport; when it fails, those enzymes are mislocalized.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21421995
      reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The lobe B COG subcomplex subunits COG6 and COG8 were localized on
        trafficking intermediates that carry Golgi glycosyltransferases,
        indicating that the COG complex is directly involved in trafficking and
        maintenance of Golgi glycosylation machinery.
      explanation: >-
        Places COG6 on the trafficking intermediates that carry Golgi
        glycosyltransferases.
- name: Golgi SNARE STX6 Deficiency
  description: >-
    COG6 interacts with the Golgi SNAREs STX5, STX6, GS27 and SNAP29 through
    its SNARE-binding motif, and COG6-deficient patient cells show marked STX6
    deficiency. The STX6 finding comes from cells carrying the hypomorphic
    c.1167-24A>G allele, whose transferrin glycosylation is normal; its
    contribution to the COG6-CDG phenotype is not established.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:23057818
    reference_title: COG6 interacts with a subset of the Golgi SNAREs and is important for the Golgi complex integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using yeast two-hybrid and co-immunoprecipitation approaches, we show
      that the COG6 subunit of the COG complex is capable of interacting with a
      subset of Golgi SNAREs, namely STX5, STX6, GS27 and SNAP29.
    explanation: Establishes the COG6-SNARE interaction.
  - reference: PMID:23606727
    reference_title: A novel syndrome of hypohidrosis and intellectual disability is linked to COG6 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient cells also exhibited pronounced deficiency of STX6, consistent
      with the established stabilising effect of COG6 on STX6.
    explanation: STX6 deficiency in COG6-deficient patient cells.
- name: Mislocalized Golgi Glycosylation Machinery
  description: >-
    COG depletion mislocalizes medial- and trans-Golgi glycosylation enzymes
    such as MAN2A1, MGAT1, B4GALT1 and ST6GAL1, leaving cis/medial-Golgi
    glycosylation deficient.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: N-glycan processing
    modifier: DECREASED
    term:
      id: GO:0006491
      label: N-glycan processing
  locations:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  evidence:
  - reference: PMID:21421995
    reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In response to siRNA-induced depletion of COG complex subunits, several
      key components of Golgi glycosylation machinery, including MAN2A1, MGAT1,
      B4GALT1 and ST6GAL1, were severely mislocalized.
    explanation: >-
      COG-subunit depletion in HeLa cells mislocalizes Golgi glycosylation
      enzymes; COG6 is inferred to act the same way as the other subunits.
  - reference: PMID:27066481
    reference_title: "COG Complex Complexities: Detailed Characterization of a Complete Set of HEK293T Cells Lacking Individual COG Subunits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that all KO cell lines were uniformly deficient in
      cis/medial-Golgi glycosylation and each had nearly abolished binding of
      Cholera toxin.
    explanation: >-
      COG subunit knockouts, including COG6, are deficient in cis/medial-Golgi
      glycosylation.
  downstream:
  - target: Combined N- and O-glycosylation Defect
    description: >-
      Mislocalized Golgi enzymes leave glycoproteins underprocessed, losing
      terminal galactose and sialic acid on N-glycans and affecting O-glycans.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20605848
      reference_title: Fatal outcome due to deficiency of subunit 6 of the conserved oligomeric Golgi complex leading to a new type of congenital disorders of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of oligosaccharides from serum transferrin by HPLC and mass
        spectrometry revealed the loss of galactose and sialic acid residues,
        whereas import and transfer of these sugar residues into Golgi-enriched
        vesicles or onto proteins, respectively, were normal to slightly
        reduced.
      explanation: >-
        Galactose and sialic acid are lost although sugar import and transfer
        are near normal, which points to a Golgi positioning and trafficking
        defect rather than a missing enzyme.
- name: Combined N- and O-glycosylation Defect
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  description: >-
    Severe COG6 alleles produce a type II CDG pattern with hyposialylated and
    hypogalactosylated serum transferrin, abnormal apolipoprotein C-III
    O-glycosylation and accumulation of underprocessed N-glycans. Transferrin
    glycosylation is normal with the hypomorphic deep intronic allele that
    causes the allelic Shaheen syndrome.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: N-glycan processing
    modifier: DECREASED
    term:
      id: GO:0006491
      label: N-glycan processing
  - preferred_term: protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation

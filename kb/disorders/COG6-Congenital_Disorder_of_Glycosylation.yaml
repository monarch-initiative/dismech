  description: >-
    No COG6-specific disease-modifying therapy is established; management is
    supportive and directed at hepatic, coagulation, infectious, nutritional
    and thermoregulatory complications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care

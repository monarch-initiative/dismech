  description: >-
    Recurrent, poorly tolerated febrile episodes occur across COG deficiencies,
    and some COG6 patients develop hemophagocytic lymphohistiocytosis (HLH).
    In reported cases the episodes were followed by neurological
    deterioration.
  biological_scale: ORGANISM
  evidence:

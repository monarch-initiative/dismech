- name: Early or prophylactic corticosteroid therapy for febrile episodes
  description: >-
    Corticosteroids started early in, or before, a febrile episode appeared to
    reduce the severity and neurological impact of inflammatory flares in a
    three-patient COG6/COG7 series. This is an uncontrolled observation, not a
    trial result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

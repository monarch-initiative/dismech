name: COG6-Congenital Disorder of Glycosylation
creation_date: "2026-11-23T17:13:54Z"
description: >-
  COG6-congenital disorder of glycosylation (COG6-CDG, CDG-IIL) is a rare
  autosomal recessive type II congenital disorder of glycosylation caused by
  biallelic loss-of-function variants in COG6, which encodes a lobe B subunit
  of the conserved oligomeric Golgi (COG) tethering complex. Loss of COG6
  fragments the COG complex, disturbs Golgi integrity and retrograde Golgi
  trafficking, and mislocalizes Golgi glycosylation enzymes, producing a
  combined N- and O-glycosylation defect. The clinical spectrum runs from
  prenatal-onset or neonatal-lethal disease with arthrogryposis and skin
  involvement to survival into childhood with intellectual disability. Core
  features are liver involvement, microcephaly, developmental disability,
  recurrent infections, early lethality and ectodermal signs (hypohidrosis
  predisposing to hyperthermia, hyperkeratosis, enamel hypoplasia). Recurrent
  febrile episodes, some meeting criteria for hemophagocytic
  lymphohistiocytosis, and male disorders of sex development are also
  reported. Shaheen syndrome, a milder allelic COG6 disorder caused by a
  hypomorphic deep intronic founder variant, is a separate concept in MONDO
  and OMIM and is not covered by this entry.
category: Mendelian

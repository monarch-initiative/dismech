      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings suggest a link between glycosylation defects and immune
        dysregulation.
      explanation: >-
        The link is stated as a suggestion from a case series and review that
        includes COG6 patients.

  - target: Abnormality of coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthrogryposis multiplex congenita
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ambiguous genitalia
    description: >-
      The authors hypothesise that severe COG6 loss impairs glycosylation of
      ADAM metalloproteases needed for gonadal distal tip cell migration; this
      route is untested.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33394555
      reference_title: Disorder of sex development associated with a novel homozygous nonsense mutation in COG6 expands the phenotypic spectrum of COG6-CDG.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesize that the severe COG6 gene mutation interferes with
        glycosylation of a disintegrin and metalloprotease family members,
        inhibiting the correct gonadal distal tip cells migration, fundamental
        for the genitalia morphogenesis.
      explanation: >-
        States the proposed glycosylation route to the genital phenotype as a
        hypothesis, not a demonstrated mechanism.
  - target: Hyperinflammatory Febrile Episodes
    description: >-
      COG deficiency is associated with recurrent febrile hyperinflammatory
      episodes; the authors suggest, but do not show, that the glycosylation
      defect drives the immune dysregulation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

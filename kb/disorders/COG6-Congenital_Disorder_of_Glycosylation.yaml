discussions:
- discussion_id: gap_cog6_glycosylation_immune_dysregulation
  prompt: >-
    How does COG6 loss produce recurrent infections, combined immunodeficiency
    and hemophagocytic lymphohistiocytosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hyperinflammatory Febrile Episodes
  - pathophysiology#Combined N- and O-glycosylation Defect
  - phenotypes#Recurrent infections
  rationale: >-
    Recurrent infections are a core COG6 feature (7 of 10 patients in 2015),
    one patient had combined T-, B- and neutrophil dysfunction, and COG6
    patients have developed HLH. The case series that reports HLH suggests a
    link between the glycosylation defect and immune dysregulation but does not
    test one, and it is unknown whether the flares are infection-triggered
    secondary HLH or reflect a cytotoxic-lymphocyte defect.
  proposed_experiments:
  - experiment_id: exp_cog6_lymphocyte_cytotoxicity
    experiment_design: DESCRIPTIVE_PROFILING
    name: Cytotoxic lymphocyte degranulation and glycoproteomics in COG6 deficiency
    description: >-
      Measure NK and CD8 T-cell degranulation and cytotoxicity alongside
      glycoproteomic profiling of the granule-exocytosis machinery in
      COG6-deficient patient cells compared with controls.
notes: >-
  Scope: this entry covers MONDO:0013810 only. Shaheen syndrome
  (hypohidrosis-enamel hypoplasia-palmoplantar keratoderma-intellectual
  disability syndrome; MONDO:0014131, OMIM 615328) is an allelic COG6 disorder
  caused by the hypomorphic deep intronic c.1167-24A>G variant, with normal
  transferrin glycosylation, and is curated as a separate entry following
  MONDO and OMIM. ClinGen's Prenatal Gene Curation Expert Panel instead lumps
  the two under COG6-congenital disorder of glycosylation. Phenotype
  frequencies come from the 2015 review of the first 10 patients
  (PMID:26260076); later case reports do not give pooled frequencies. The
  only GeneReviews chapter covering COG-CDG is the retired multiple-pathway
  overview (PMID:20301507), whose cached abstract is a statement of purpose
  with no disease-specific clinical characteristics; the phenotype baseline
  comes from the 2015 review and later case reports instead.

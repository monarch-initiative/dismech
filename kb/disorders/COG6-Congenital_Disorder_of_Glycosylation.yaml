      label: N-glycan
    modifier: ABNORMAL
  - preferred_term: O-glycan
    term:
      id: CHEBI:59521
      label: O-glycan
    modifier: ABNORMAL
  - preferred_term: sialic acid
    term:
      id: CHEBI:26667
      label: sialic acid
    modifier: DECREASED
  evidence:
  - reference: PMID:20605848
    reference_title: Fatal outcome due to deficiency of subunit 6 of the conserved oligomeric Golgi complex leading to a new type of congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deficiency of subunit 6 of the conserved oligomeric Golgi (COG6) complex
      causes a new combined N- and O-glycosylation deficiency of the congenital
      disorders of glycosylation, designated as CDG-IIL (COG6-CDG).
    explanation: Defines the combined N- and O-glycosylation defect.
  - reference: PMID:41362306
    reference_title: Insights Into the Pathological Glycosylation Associated With COG6-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aberrant glycosylation typical of combined N- and O-glycosylation defects
      was detected.
    explanation: Independent patient with the same combined defect.
  - reference: PMID:23606727
    reference_title: A novel syndrome of hypohidrosis and intellectual disability is linked to COG6 deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, none of the patients displayed any detectable abnormality in
      the glycosylation pattern of transferrin
    explanation: >-
      In carriers of the hypomorphic c.1167-24A>G allele (Shaheen syndrome, a
      separately curated allelic disorder) no transferrin glycosylation
      abnormality was found, so the defect is not detectable on transferrin in
      every COG6 loss-of-function genotype.
  downstream:
  - target: Liver involvement
    description: >-
      Liver involvement is the most frequent COG6-CDG feature; the
      intermediate steps from hypoglycosylation to hepatopathy are not
      defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay

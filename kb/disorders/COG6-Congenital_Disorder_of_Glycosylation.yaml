    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time in the literature, we report on a 5-year-old girl
      diagnosed with a Component of Oligomeric Golgi Complex 6 (COG6) gene
      defect complicated by HLH.
    explanation: First reported COG6 patient with HLH.
  downstream:
  - target: Hemophagocytosis
    causal_link_type: DIRECT
  - target: Recurrent fever
    causal_link_type: DIRECT
  - target: Seizure
    description: >-
      In two of three reported COG6/COG7 patients, HLH episodes were followed
      by neurological deterioration and new-onset epilepsy.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42269412
      reference_title: "Recurrent hemophagocytic lymphohistiocytosis in COG deficiency: a case series and systematic review of inflammatory manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

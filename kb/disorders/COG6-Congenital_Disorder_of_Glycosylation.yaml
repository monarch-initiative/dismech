diagnosis:
- name: Serum transferrin and apolipoprotein C-III isoelectric focusing
  description: >-
    Type 2 transferrin and abnormal apolipoprotein C-III IEF point to a
    combined N- and O-glycosylation defect of CDG-II type. Normal results do
    not exclude a hypomorphic COG6 genotype.
  results: Type 2 transferrin IEF with abnormal apolipoprotein C-III IEF.
  evidence:
  - reference: PMID:23430903
    reference_title: "Deficiency of Subunit 6 of the Conserved Oligomeric Golgi Complex (COG6-CDG): Second Patient, Different Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The type 2 isoelectric focusing (IEF) pattern of serum transferrin and
      the abnormal IEF of serum apolipoprotein C-III in our patient pointed to
      a CDG-II, affecting the biosynthesis of both N- and O-linked glycans.
    explanation: Both IEF tests pointed to CDG-II.
- name: Molecular testing for COG6
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome or genome sequencing confirms biallelic COG6 variants; RNA studies
    help classify splice and deep intronic variants, and fibroblast Brefeldin A
    transport assays can support pathogenicity of variants of uncertain
    significance.
  results: Biallelic pathogenic COG6 variants.
  evidence:
  - reference: PMID:34331832
    reference_title: Genetic analysis and prenatal diagnosis in a Chinese with growth retardation, abnormal liver function, and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our work broadens the mutation spectrum of COG6 gene and states the
      importance of whole-exome sequencing in facilitating the definitive
      diagnosis of this disorder and prenatal diagnosis in a subsequent
      pregnancy.
    explanation: Exome sequencing for definitive and prenatal diagnosis.
  - reference: PMID:36636598
    reference_title: The Swedish COG6-CDG experience and a comprehensive literature review.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To confirm the pathogenicity of the variants, we treated patient and
      control fibroblasts with the ER-Golgi transport inhibitor Brefeldin-A and
      show that patient cells manifest a significantly slower anterograde and
      retrograde ER-Golgi transport.
    explanation: Functional fibroblast assay supports variant pathogenicity.
treatments:

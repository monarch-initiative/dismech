  description: >
    Homozygous ERBB2 p.(Ala710Val) in two affected siblings of a
    consanguineous family, with both healthy parents heterozygous. This is a
    different genetic architecture from isolated Hirschsprung disease, which
    is oligogenic with RET as the major locus — a contrast the source paper
    draws explicitly.
  evidence:
  - reference: PMID:33497358

name: Familial Visceral Neuropathy 2
creation_date: "2026-08-31T22:00:00Z"
category: Mendelian
synonyms:
- visceral neuropathy, familial, 2, autosomal recessive
- VSCN2
- ERBB2-related enteric neuropathy
- ERBB2-related neurocristopathy with gastrointestinal dysmotility
disease_term:
  preferred_term: visceral neuropathy, familial, 2, autosomal recessive
  term:
    id: MONDO:0030399
    label: visceral neuropathy, familial, 2, autosomal recessive
parents:
- Enteric Neuropathy
- Neurocristopathy
description: >
  Familial visceral neuropathy 2 is an autosomal recessive neurocristopathy
  caused by biallelic ERBB2 variants. ERBB2 and ERBB3 are the two receptors of
  the neuregulin-1 (NRG1) signalling system, and they work only as a pair:
  ERBB3 binds NRG1 but is catalytically weak, while ERBB2 has no ligand of its
  own but supplies the kinase activity. Loss of ERBB2 kinase function
  therefore disables NRG1 signalling through the heterodimer, and the reported
  homozygous kinase-domain variant drastically reduces phosphorylation of both
  receptors. Single-cell expression data and a conditional mouse knockout
  place this signalling requirement in enteric progenitor cells, so the
  developing gut is incompletely colonized by enteric neural crest
  derivatives. The histological result is aganglionosis or hypoganglionosis
  with intestinal smooth muscle abnormalities; the clinical result is
  congenital gastrointestinal dysmotility, reported as severe constipation and
  as short-segment Hirschsprung disease in the two affected siblings. The
  phenotype extends beyond the gut to axonal peripheral neuropathy, ptosis,
  sensorineural hearing loss and clubfeet, consistent with NRG1/ERBB
  signalling being required in other neural crest and peripheral nervous
  system derivatives.
notes: >
  Ultra-rare, and the cohort is a single family. The disease-defining report
  is Le et al. (J Clin Invest 2021), which identified biallelic ERBB3 and
  ERBB2 variants in eight individuals across five families by trio-exome
  sequencing. Only family F5 — two siblings born to consanguineous parents,
  homozygous for ERBB2 p.(Ala710Val) — carries the ERBB2 genotype, and it is
  that family alone that defines this concept. The ERBB3 families in the same
  paper define familial visceral neuropathy 1 (VSCN1, OMIM:243180), a separate
  MONDO concept, and are out of scope here.

  **Do not read the paper's eight-patient phenotype list as this disease's
  phenotype list.** That list spans both genes, and the two do not carry the
  same features. Per Table 1 of the source, the ERBB2 siblings are positive
  for arthrogryposis, peripheral neuropathy, hearing loss and ptosis, and are
  explicitly **negative** for chronic intestinal pseudo-obstruction, external
  auditory canal agenesis, dysautonomia, pigmentation defect and cardiac
  defect — several of which are positive in the ERBB3 families. The
  intrauterine growth retardation and multiple pterygiums described for the
  ERBB3 fetuses of families F3 and F4 are likewise not attributed to the
  ERBB2 siblings. Only what Table 1 and the case description record for
  family F5 is curated here.

  The CIPO point deserves emphasis because it is counterintuitive: this
  concept sits in the differential for chronic intestinal pseudo-obstruction,
  and yet neither reported ERBB2 patient had CIPO. Their gastrointestinal
  disease was severe constipation and, in the brother, short-segment
  Hirschsprung disease with hypoganglionosis. An entry that listed CIPO as a
  feature here would be contradicted by the source's own table.

  Three things this entry is careful about:

  First, **the relationship to Hirschsprung disease is overlap, not
  identity.** `kb/disorders/Hirschsprung_Disease.yaml` covers the common,
  oligogenic, RET-driven disease. The eight reported ERBB3/ERBB2 patients
  "variably associat[ed]" Hirschsprung disease, chronic intestinal
  pseudo-obstruction, peripheral neuropathy and arthrogryposis — meaning some
  presented as Hirschsprung disease and some did not. The entry records the
  shared enteric-neural-crest mechanism and keeps the entities separate,
  because a Mendelian recessive gene with extra-intestinal features is not the
  same disease as oligogenic RET-associated Hirschsprung disease even where
  the gut histology converges.

  Second, **the relationship to chronic intestinal pseudo-obstruction is the
  same shape.** `kb/disorders/Chronic_Intestinal_Pseudoobstruction.yaml`
  carries a "Neuropathic" subtype as a physiological category, not as a
  genetic entity, and lists no ERBB2. This entry is the Mendelian entity that
  can present as neuropathic dysmotility; it is not a duplicate of that
  clinical syndrome entry.

  Third, **the gene assignment was checked, not assumed.** The two familial
  visceral neuropathy concepts are easy to transpose: VSCN1 (OMIM:243180) is
  the ERBB3 disease and VSCN2 (OMIM:619465, this entry) is the ERBB2 disease,
  which is the opposite of what the gene numbering suggests. The assignment
  here follows the MedGen gene-disease link for the OMIM concept that
  MONDO:0030399 cross-references.

  No `conforms_to` was declared: `kb/modules/` has no enteric or neural-crest
  developmental module. That gap is recorded in `discussions` below rather
  than left silent.

  **Deep-research provenance.** An OpenScientist run
  (`research/Familial_Visceral_Neuropathy_2-deep-research-openscientist.md`,
  5/5 references resolved and on topic) is committed alongside this entry. Its
  substantive contribution was catching a gene error: the first draft of this
  entry attributed MONDO:0030399 to ERBB3, and the report identified ERBB2.
  The correction was then verified independently against the MedGen
  gene-disease links rather than accepted from the report.

  Two of that report's suggested NCIT bindings are badly wrong and must not be
  reused — `NCIT:C157763` is offered as "surgical procedure" but is
  *Metastatic Bladder Small Cell Neuroendocrine Carcinoma*, and `NCIT:C1516`
  is offered as "supportive care" but is *Lisofylline*. The report's own term
  validation flags both, which is the check working; this entry binds no NCIT
  terms.

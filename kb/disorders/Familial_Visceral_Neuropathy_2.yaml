  relationship_type: CAUSATIVE
  notes: >
    ERBB2 (HER2) encodes the kinase-active, ligand-orphan partner of the
    neuregulin-1 receptor system. It is the gene of MONDO:0030399 /
    OMIM:619465, per the MedGen gene-disease link for that OMIM concept.
    ERBB3 is the gene of the sibling concept VSCN1 (OMIM:243180) — note the
    disease numbering runs opposite to the gene numbering, which makes the
    two easy to transpose. Gene-disease validity here rests on a single
    family.
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-exome sequencing led to the identification of biallelic variants in ERBB3 and ERBB2 in 8 individuals"
    explanation: >
      Establishes ERBB2 as one of the two disease genes in this series.
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "missense variant (c.2129C>T, p.(Ala710Val)) within ERBB2"
    explanation: >
      Names the specific ERBB2 allele in the single family that defines this
      concept.
animal_models:
- name: Conditional ErbB3-deficient mouse
  species: Mouse
  genotype: Conditional ErbB3 knockout
  publication: PMID:33497358
  description: >
    Conditional ErbB3 knockout used, together with mouse single-cell RNA
    sequencing, to localize the NRG1/ERBB requirement to enteric progenitor
    cells.
  modeled_mechanisms:
  - target: Disrupted NRG1-ERBB Signaling in Enteric Progenitors
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model established that the NRG1/ERBB requirement in this system
      sits in enteric progenitors rather than in mature enteric neurons or in
      smooth muscle.
    limitations: >-
      The model targets ErbB3, the partner receptor, not ErbB2 — the gene of
      this disease. Because the two signal only as a heterodimer that is a
      defensible proxy, but it is a proxy, and it is why this link is
      PARTIALLY_RECAPITULATES rather than RECAPITULATES. A conditional
      knockout is also a complete loss in the targeted lineage, whereas the
      patient allele is a kinase-domain missense change, so the model speaks
      to where the pathway is required and not to how much residual
      signalling the human disease retains. The extra-intestinal features were
      not addressed by this model.
    evidence:
    - reference: PMID:33497358
      reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in a conditional ErbB3-deficient mouse model, revealing a primary role for ERBB3 in enteric progenitors"
      explanation: >-
        The model result that grounds this link.
diagnosis:
- name: Gut histopathology
  description: >
    Full-thickness or suction rectal biopsy assessing ganglion cell density.
    In these patients thorough histology showed aganglionosis or
    hypoganglionosis together with smooth muscle abnormalities — so a report
    of ganglion cells present does not exclude the diagnosis, and the muscle
    layer should be assessed too.
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thorough gut histology revealed aganglionosis, hypoganglionosis, and intestinal smooth muscle abnormalities."
    explanation: >
      Describes what the diagnostic histology shows in these patients.
- name: Trio-exome sequencing
  description: >
    Molecular diagnosis. Every reported patient was ascertained this way; the
    combination of gastrointestinal dysmotility with peripheral neuropathy or
    arthrogryposis is the clinical pattern that should trigger it, since
    isolated Hirschsprung disease and CIPO have different genetic workups.
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-exome sequencing led to the identification of biallelic variants in ERBB3 and ERBB2 in 8 individuals"
    explanation: >
      Describes the diagnostic method used in the defining series.

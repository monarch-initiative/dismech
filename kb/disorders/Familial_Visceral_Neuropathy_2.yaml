    explanation: >
      Establishes biallelic inheritance. Note the phenotype list here spans
      both genes in the paper; the ERBB2-specific features are recorded
      separately below.
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing \nconfirmed that the 2 affected children are homozygous while the \nhealthy parents are heterozygous for the ERBB2 variant"
    explanation: >
      Segregation in the single reported family: both affected siblings
      homozygous, both parents heterozygous and healthy.
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated HSCR has an oligogenic inheritance with RET as the major disease-causing gene, while CIPO is genetically heterogeneous, caused by mutations in smooth muscle-specific genes."
    explanation: >
      States the contrasting genetic architecture of the two disorders this
      entity sits between, which is why it is curated separately from both.

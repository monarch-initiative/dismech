  description: >
    Short-segment aganglionosis in the proband's brother, with colon resection
    histology showing absent ganglion cells and nerve fibre hyperplasia.
    Hypoganglionosis is scored alongside it in the source's Table 1, and the
    two coexist in this disease — a biopsy reporting ganglion cells present
    does not exclude the diagnosis. That one sibling had Hirschsprung disease
    and the other did not, on the same homozygous genotype, is the clearest
    evidence in this family that the gut phenotype is variable rather than
    determined by genotype alone.

pathophysiology:
- name: Biallelic ERBB2 Kinase-Domain Variant
  biological_scale: MOLECULAR
  description: >
    Homozygous ERBB2 c.2129C>T, p.(Ala710Val), a kinase-domain missense
    change, in both affected siblings of the single reported family. Immunoblot
    analysis of Neuro-2a cells overexpressing wild-type or mutant protein
    showed that this variant drastically decreases phosphorylation of both
    ERBB2 itself and its partner ERBB3 — that is, the lesion is a kinase
    defect that propagates across the heterodimer rather than a defect in
    receptor abundance.
  genes:
  - preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline homozygous ERBB2 kinase-domain missense allele p.(Ala710Val).
      Loss of function is established functionally by the loss of receptor
      phosphorylation rather than inferred from the variant class.
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed a drastic decrease of both ERBB2 and ERBB3"
    explanation: >
      The immunoblot result showing that the ERBB2 variant reduces
      phosphorylation of both receptors, which is the molecular lesion this
      node describes.
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The consequences of the identified variants were evaluated using quantitative real-time PCR (RT-qPCR) on patient-derived fibroblasts or immunoblot assays on Neuro-2a cells overexpressing WT or mutant proteins, revealing either decreased expression or altered phosphorylation of the mutant receptors."
    explanation: >
      Describes the functional assays used across the whole series. The
      ERBB2 allele falls in the altered-phosphorylation group rather than the
      decreased-expression group.
  downstream:
  - target: Disrupted NRG1-ERBB Signaling in Enteric Progenitors
    description: >-
      A kinase-dead ERBB2 cannot phosphorylate the heterodimer, so
      neuregulin-1 binding by ERBB3 no longer produces a signal.
    causal_link_type: DIRECT

- name: Disrupted NRG1-ERBB Signaling in Enteric Progenitors
  biological_scale: CELLULAR
  description: >
    ERBB3 and ERBB2 are the receptors for neuregulin-1 and signal as a
    heterodimer — ERBB3 has minimal intrinsic kinase activity and ERBB2 has no
    ligand of its own, so neither works without the other. That obligate
    pairing is why variants in either gene converge on one phenotype, and why
    an ERBB2 kinase defect removes NRG1 signalling as effectively as losing
    the ligand-binding receptor would. Cell-type-specific analysis in mouse
    single-cell RNA sequencing data together with a conditional
    ErbB3-deficient mouse localized the requirement to enteric progenitor
    cells. That localization is what makes this a developmental disorder of
    gut colonization rather than a defect in mature enteric neurons.
  biological_processes:
  - preferred_term: ERBB signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038127
      label: ERBB signaling pathway
  cell_types:
  - preferred_term: enteric neural crest-derived progenitor
    term:
      id: CL:0011012
      label: neural crest cell
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cell type-specific ErbB3 and ErbB2 function was further analyzed in mouse single-cell RNA sequencing data and in a conditional ErbB3-deficient mouse model, revealing a primary role for ERBB3 in enteric progenitors."
    explanation: >
      Localizes the ERBB3 requirement to enteric progenitor cells, which is
      the claim this node makes.
  downstream:
  - target: Incomplete Enteric Nervous System Colonization
    description: >-
      Enteric progenitors deprived of NRG1/ERBB signalling fail to populate
      the gut wall normally.
    causal_link_type: DIRECT
  - target: Extra-Intestinal Neural Crest and Peripheral Nerve Involvement
    description: >-
      The same signalling requirement in other neural crest and peripheral
      nervous system derivatives, including Schwann cell precursors.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - The cell populations mediating the peripheral neuropathy, ptosis and hearing loss were not localized in the way the enteric requirement was

- name: Incomplete Enteric Nervous System Colonization
  biological_scale: TISSUE
  description: >
    The histological lesion. Thorough gut histology in these patients revealed
    aganglionosis, hypoganglionosis, and intestinal smooth muscle
    abnormalities. Note that all three were found — this is not a pure
    neuropathy, and the smooth muscle abnormality is reported alongside the
    ganglion cell deficit rather than instead of it.
  biological_processes:
  - preferred_term: enteric nervous system development
    modifier: DECREASED
    term:
      id: GO:0048484
      label: enteric nervous system development
  cell_types:
  - preferred_term: enteric neuron
    term:
      id: CL:0007011
      label: enteric neuron
    modifier: DECREASED
  - preferred_term: enteric smooth muscle cell
    term:
      id: CL:0002504
      label: enteric smooth muscle cell
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thorough gut histology revealed aganglionosis, hypoganglionosis, and intestinal smooth muscle abnormalities."
    explanation: >
      The histological findings that define this node, including the smooth
      muscle component.
  downstream:
  - target: Congenital Gastrointestinal Dysmotility
    description: >-
      A gut wall lacking its normal complement of enteric neurons cannot
      generate coordinated propulsive motility.
    causal_link_type: DIRECT

- name: Congenital Gastrointestinal Dysmotility
  biological_scale: ORGANISM
  description: >
    The clinical output. In the two reported ERBB2 patients this took the
    form of severe constipation and, in the brother, short-segment
    Hirschsprung disease with hypoganglionosis; both were scored negative for
    chronic intestinal pseudo-obstruction. Across the wider NRG1/ERBB series
    the same lesion produces Hirschsprung disease in some patients and CIPO in
    others, which is informative in itself — the two clinical labels describe
    where along the gut the colonization deficit falls rather than two
    different diseases — but CIPO is not a feature of this concept as
    reported.
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrate that dysregulation of ERBB3 or ERBB2 leads to a broad spectrum of developmental anomalies, including intestinal dysmotility."
    explanation: >
      States the clinical output and its breadth as the authors' conclusion.
  downstream:
  - target: Severe Constipation
    description: Failure of propulsive motility in the aganglionic and hypoganglionic gut.
    causal_link_type: DIRECT
  - target: Short-Segment Hirschsprung Disease
    description: >-
      Where the colonization deficit stops short of the proximal gut, the
      result is a short aganglionic distal segment.
    causal_link_type: DIRECT

- name: Extra-Intestinal Neural Crest and Peripheral Nerve Involvement
  biological_scale: ORGANISM
  description: >
    The affected siblings had axonal peripheral neuropathy, ptosis,
    sensorineural ("perceptive") hearing loss and clubfeet alongside the
    gastrointestinal disease. These are what mark the disorder as a broader
    neurocristopathy rather than an isolated gut disease, and they are the
    features that should prompt ERBB2 sequencing in a patient who would
    otherwise be worked up as isolated Hirschsprung disease.
  evidence:
  - reference: PMID:33497358
    reference_title: "Dysregulation of the NRG1/ERBB pathway causes a developmental disorder with gastrointestinal dysmotility in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "axonal peripheral neuropathy, ptosis, perceptive hearing loss, and clubfeet"
    explanation: >
      Enumerates the extra-intestinal features in the proband of the single
      ERBB2 family.
  downstream:
  - target: Peripheral Axonal Neuropathy
    description: Loss of NRG1/ERBB signalling in Schwann cell precursors and peripheral nerve.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - The cell population mediating the neuropathy was not localized in these patients
  - target: Ptosis
    description: Neural-crest-derived contribution to periocular structures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Not investigated in these patients
  - target: Sensorineural Hearing Loss
    description: Neural-crest and Schwann cell precursor contribution to the auditory pathway.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Not investigated in these patients
  - target: Clubfeet
    description: Foot deformity accompanying the congenital contractures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Not investigated in these patients
mechanistic_hypotheses:
- hypothesis_group_id: canonical_nrg1_erbb_enteric_progenitor_model
  hypothesis_label: Canonical NRG1/ERBB Enteric Progenitor Model
  status: CANONICAL
  description: >-
    A homozygous ERBB2 kinase-domain variant removes neuregulin-1 signalling
    through the ERBB2/ERBB3 heterodimer in enteric progenitor cells,
    leaving the gut incompletely colonized by enteric neural crest
    derivatives; the resulting aganglionosis or hypoganglionosis, with
    accompanying smooth muscle abnormality, produces congenital
    gastrointestinal dysmotility. The model rests on the localization of
    ERBB3 function to enteric progenitors in mouse single-cell data and a
    conditional knockout, together with the functional demonstration that the
    ERBB2 variant drastically reduces phosphorylation of both receptors.
discussions:
- discussion_id: fvn2_smooth_muscle_primary_or_secondary
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the intestinal smooth muscle abnormalities in ERBB3-related enteric
    neuropathy a primary consequence of lost ERBB signalling in muscle, or
    secondary to the absent enteric innervation?
  attaches_to:
  - pathophysiology#Incomplete Enteric Nervous System Colonization
  rationale: >-
    The histology reports smooth muscle abnormalities alongside the ganglion
    cell deficit, and the ERBB pathway's role was localized to enteric
    progenitors — not to muscle. If the muscle lesion is primary, this disorder is not purely
    neuropathic and its classification within chronic intestinal
    pseudo-obstruction changes; if secondary, restoring innervation would in
    principle be sufficient. Nothing in the reported data separates the two.
- discussion_id: fvn2_erbb2_erbb3_same_entity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should VSCN2 (ERBB2) and VSCN1 (ERBB3) be one disease entry or two?
  attaches_to:
  - pathophysiology#Disrupted NRG1-ERBB Signaling in Enteric Progenitors
  rationale: >-
    ERBB2 and ERBB3 signal only as a heterodimer, and the two genotypes were
    reported together in one paper with one phenotypic spectrum, which is a
    strong argument for a single mechanistic entity. MONDO and OMIM give them
    separate concepts, and this entry follows that. The question is worth
    recording because a grouping over the NRG1/ERBB enteric axis may be the
    better structure once more patients are published — and because the two
    concepts are easy to transpose, the numbering running opposite to the
    gene numbering.
- discussion_id: fvn2_no_enteric_neural_crest_module
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should enteric neural crest colonization failure be factored out of
    Hirschsprung disease, this entry, and the neuropathic CIPO entries as a
    mechanism module?
  attaches_to:
  - pathophysiology#Incomplete Enteric Nervous System Colonization
  rationale: >-
    The knowledge base already carries Hirschsprung disease and chronic
    intestinal pseudo-obstruction, both of which restate a
    migration-proliferation-differentiation chain that this entry restates a
    third time with a different upstream ligand-receptor pair. That
    repetition across independently curated entries is what `kb/modules/`
    exists to absorb. No such module exists, so this entry declares no
    `conforms_to`.

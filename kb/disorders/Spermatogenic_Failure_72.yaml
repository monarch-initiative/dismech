  mechanistic_category:
  - classification_value: ciliopathy
    evidence:
    - reference: PMID:32323121
      reference_title: "A novel homozygous mutation in WDR19 induces disorganization of microtubules in sperm flagella and nonsyndromic asthenoteratospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified WDR19 as a novel pathogenic gene for male infertility caused by asthenoteratospermia in the absence of other ciliopathic phenotypes"
      explanation: >-
        Biallelic WDR19 dysfunction impairs IFT-A-mediated flagellar assembly,
        placing SPGF72 in the nonsyndromic sperm-flagellar arm of the
        ciliopathies.
notes: >-
  MONDO cross-references this disease as OMIM 619867. The human gene-disease
  link rests on one proband (PMID:32323121), so the human phenotype and
  mechanism here describe a single case; a PubMed search for WDR19 with
  spermatogenic, asthenoteratospermia, asthenoteratozoospermia, MMAF, or sperm
  flagella (2026-11-12) found no additional human SPGF72 reports. The founding
  report is cached as abstract only. ClinGen classifies WDR19 as Definitive for
  the lumped MONDO term ciliopathy (MONDO:0005308), not for this disease, so no
  gene-disease validity tier is recorded. The syndromic WDR19 ciliopathies are
  curated separately (Cranioectodermal_Dysplasia, Nephronophthisis,
  Jeune_Asphyxiating_Thoracic_Dystrophy, Senior-Loken_Syndrome).

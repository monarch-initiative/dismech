genetic:
- name: WDR19
  association: Causal
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: WDR19
    term:
      id: hgnc:18340
      label: WDR19
  notes: >-
    One reported allele: homozygous c.3811A>G (p.Lys1271Glu), found by exome
    sequencing of 65 men with asthenoteratozoospermia (PMID:32323121). ClinGen's
    Definitive classification for WDR19 is for ciliopathy (MONDO:0005308), a
    broader disease than this entry, so no validity tier is recorded.
  evidence:
  - reference: PMID:32323121
    reference_title: "A novel homozygous mutation in WDR19 induces disorganization of microtubules in sperm flagella and nonsyndromic asthenoteratospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole exome sequencing (WES) for 65 asthenoteratospermia individuals and identified a proband who carried a homozygous WDR19 (c.A3811G, p.K1271E) mutation from a consanguineous family."
    explanation: Gene-disease report identifying the causal WDR19 variant.
  - reference: PMID:32323121
    reference_title: "A novel homozygous mutation in WDR19 induces disorganization of microtubules in sperm flagella and nonsyndromic asthenoteratospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systematic examinations, including CT scanning and retinal imaging, excluded previous ciliopathic syndromes in the proband."
    explanation: The phenotype is restricted to the sperm flagellum, distinguishing it from the syndromic WDR19 ciliopathies.
animal_models:
- name: Brown Swiss bull WDR19 cryptic splice allele
  species: Cattle
  genotype: WDR19 BTA6:58373887C>T (rs474302732) homozygous
  publication: PMID:32407316
  description: >-
    A synonymous WDR19 variant common in Brown Swiss cattle activates a cryptic
    exonic splice site that removes three conserved amino acids and lowers
    WDR19 protein. Homozygous bulls are otherwise healthy but have reduced
    sperm motility, more sperm head and tail anomalies, and lower fertility.
  modeled_mechanisms:
  - target: Defective Sperm Flagellum Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      A naturally occurring hypomorphic WDR19 allele that causes a
      non-syndromic sperm tail and motility defect, as in the human proband.
    limitations: >-
      The bovine effect is quantitative (a modest rise in tail anomaly scores
      and fall in motility, compensated by more sperm per dose), not the
      complete flagellar destruction and absent progressive motility of the
      human case, and the axonemal ultrastructure was not examined.
    evidence:
    - reference: PMID:32407316
      reference_title: "Activation of cryptic splicing in bovine WDR19 is associated with reduced semen quality and male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, an excess of sperm with morphological anomalies and low motility indicates that spermatogenesis of bulls homozygous for the BTA6:58373887 T-allele is impaired."
      explanation: Homozygous bulls show sperm morphology and motility defects.
  evidence:
  - reference: PMID:32407316
    reference_title: "Activation of cryptic splicing in bovine WDR19 is associated with reduced semen quality and male fertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bioinformatic and transcription analyses revealed that the BTA6:58373887 T-allele activates a cryptic exonic splice site that eliminates three evolutionarily conserved amino acids from WDR19. Western blot analysis demonstrated that the BTA6:58373887 T-allele decreases protein expression."
    explanation: The bovine allele reduces WDR19 protein.

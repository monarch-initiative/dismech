name: Spermatogenic Failure 72
creation_date: "2026-10-22T12:00:00Z"
updated_date: "2026-11-12T19:00:00Z"
category: Mendelian
synonyms:
- SPGF72
- spermatogenic failure 72
- WDR19-related nonsyndromic asthenoteratozoospermia
- WDR19-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 72 (SPGF72) is autosomal recessive male infertility
  with asthenoteratozoospermia and multiple morphological abnormalities of the
  sperm flagella (MMAF), caused by a biallelic variant in WDR19. WDR19 encodes
  IFT144, a core subunit of the intraflagellar transport complex A (IFT-A)
  that drives retrograde transport in cilia and flagella. Biallelic WDR19
  variants more often cause syndromic ciliopathies (cranioectodermal
  dysplasia, Jeune syndrome, nephronophthisis), but the single reported SPGF72
  proband, from a consanguineous Chinese family, carried a homozygous missense
  variant (p.Lys1271Glu) and had no skeletal, renal, hepatic or retinal
  involvement on systematic examination. His sperm had no progressive
  motility, the flagellar ultrastructure was destroyed, WDR19 was absent from
  the sperm neck and flagellum, and the IFT proteins IFT140 and IFT88 were
  mislocalized. Intracytoplasmic sperm injection (ICSI) led to a clinical
  pregnancy.

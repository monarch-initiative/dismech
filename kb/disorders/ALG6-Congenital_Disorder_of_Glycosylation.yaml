biochemical:
- name: Type I CDG serum transferrin isoelectric focusing pattern
  presence: Present
  specificity: Diagnostic support
  notes: A type I pattern reflects missing N-glycan chains and supports an assembly/transfer defect; it does not identify ALG6 specifically. The historical p.Tyr131His patient with normal glycosylation was reclassified as NR2F1-related BBSOAS and is not evidence for a confirmed ALG6 exception.
  evidence: *id008
- name: Dolichyl pyrophosphate-Man9GlcNAc2 accumulation in fibroblasts
  presence: Present
  specificity: Diagnostic support
  notes: Lipid-linked oligosaccharide analysis in cultured fibroblasts shows accumulation of the ALG6 substrate, localising the defect to the glucosylation step rather than to earlier mannosylation.
  evidence:
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of lipid-linked oligosaccharides in fibroblasts confirmed the accumulation of dolichyl pyrophosphate-Man9GlcNAc2 in the CDG-Ic patients.
    explanation: The step-specific biochemical signature of ALG6 deficiency.
    quote_role: PRIMARY_RESULT
- name: Low serum cholesterol and coagulation proteins
  presence: Variable
  specificity: Supportive, not specific
  notes: Low cholesterol, factor XI and anticoagulant factors are reported; concentrations and clinical coagulation consequences vary.
  evidence:
  - reference: PMID:25052310
    reference_title: 'Clinical utility gene card for: ALG6 defective congenital disorder of glycosylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Striking biochemical abnormalities are unusually low levels of serum cholesterol, blood coagulation factor XI, and anticoagulation factors antithrombin, protein C, and protein S
    explanation: Clinical utility review summarizes biochemical findings, without universal penetrance.
progression:
- phase: Wide survival range with substantial diagnostic delay
  notes: 'Survival in ALG6-CDG spans a wide range. In a 37-patient CDG mortality cohort, the three ALG6-CDG patients survived to 12 months, 2 years and 21 years, the last being the oldest age of death in the whole cohort. Diagnosis was delayed to 16 years in one ALG6-CDG patient. Caution: this is a mortality cohort, so it is a description of the deceased, not a survival estimate for the disease.'
  evidence:
  - reference: PMID:39923392
    reference_title: Causes of mortality in the congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The three patients with ALG6-CDG had a wide age range and they survived to 12 months, 2 years and 21 years.
    explanation: ALG6-CDG-specific survival ages from the mortality cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39923392
    reference_title: Causes of mortality in the congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The youngest age of mortality in this cohort is 1 month for two patients with SLC35A3-CDG and PIGA-CDG, the oldest age was 21 years for a patient with ALG6-CDG.
    explanation: Places the ALG6-CDG maximum at the top of the whole CDG mortality cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39923392
    reference_title: Causes of mortality in the congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, CDG diagnosis was delayed to the age of 17 years for a patient with ALG3-CDG, 16 years for a patient with ALG6-CDG
    explanation: Documents diagnostic delay of 16 years in an ALG6-CDG patient.
    quote_role: PRIMARY_RESULT
- phase: Early childhood mortality with long-lived survivors
  notes: The 2016 paper reports eleven early childhood deaths and adult survivors, with PLE, sepsis and seizures among the causes. Internal table/narrative discrepancies in ages and cohort counts preclude a reconstructed survival curve. This selected retrospective cohort and the separate deceased-only series are not population mortality estimates.

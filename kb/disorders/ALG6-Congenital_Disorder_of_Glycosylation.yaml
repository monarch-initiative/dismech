  downstream:
  - target: Global developmental delay
    description: Neurological glycoprotein dysfunction produces psychomotor retardation.
  - target: Muscular hypotonia
    description: Hypotonia is a core neurological feature.
  - target: Seizure
    description: Seizures occur in a substantial fraction of patients.
  - target: Strabismus
    description: Strabismus is a recurrent ophthalmological feature.
  - target: Feeding difficulties
    description: Feeding difficulties accompany the neurological involvement.

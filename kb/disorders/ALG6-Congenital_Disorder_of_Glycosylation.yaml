biochemical:
- name: Type I CDG serum transferrin isoelectric focusing pattern
  presence: Present
  specificity: Diagnostic support
  notes: >-
    Serum transferrin isoelectric focusing shows the type I CDG pattern, produced
    by under-occupancy of N-glycosylation sites. It is a screening test for the
    CDG class rather than a test for ALG6 specifically, and at least one
    genetically ascertained patient had an apparently normal transferrin pattern
    (see the p.Tyr131His knowledge gap).
  evidence:
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isoelectric focusing analysis of serum transferrin indicated a congenital
      disorder of glycosylation (CDG)
    explanation: >-
      Transferrin isoelectric focusing as the route to CDG diagnosis in this
      patient.
- name: Dolichyl pyrophosphate-Man9GlcNAc2 accumulation in fibroblasts
  presence: Present
  specificity: Diagnostic support
  notes: >-
    Lipid-linked oligosaccharide analysis in cultured fibroblasts shows
    accumulation of the ALG6 substrate, localising the defect to the glucosylation
    step rather than to earlier mannosylation.
  evidence:
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of lipid-linked oligosaccharides in fibroblasts confirmed the
      accumulation of dolichyl pyrophosphate-Man9GlcNAc2 in the CDG-Ic patients.
    explanation: >-
      The step-specific biochemical signature of ALG6 deficiency.
genetic:
- name: ALG6 pathogenic variants
  gene_term:
    preferred_term: ALG6
    term:
      id: hgnc:23157
      label: ALG6
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    p.Ala333Val is the most common disease-causing allele, carried by over half of
    known patients and traced to a founder haplotype. The ALG6 gene spans 14 exons
    over 55 kb, and multiple additional alleles have been confirmed by yeast
    complementation.
  evidence:
  - reference: PMID:14517965
    reference_title: "Identification of a frequent variant in ALG6, the cause of Congenital Disorder of Glycosylation-Ic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most common disease-causing mutation, c998C>T (p. Ala333Val), which
      occurs in over half of all known CDG-Ic patients
    explanation: >-
      Establishes p.Ala333Val as the predominant causative allele.
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis of CDG-Ic patients revealed a founder effect for the ALG6
      allele bearing the A333 V mutation.
    explanation: >-
      Founder origin of the common allele.
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genomic organization of the human ALG6 gene was determined, revealing 14
      exons spread over 55 kb.
    explanation: >-
      Gene structure relevant to variant ascertainment.
- name: ALG6 p.Phe304Ser as a severity modifier in PMM2-CDG
  gene_term:
    preferred_term: ALG6
    term:
      id: hgnc:23157
      label: ALG6
  association: Modifier
  relationship_type: MODIFIER
  notes: >-
    This is a modifier claim about a DIFFERENT disease, recorded here because the
    modifying allele is in ALG6. The common ALG6 p.Phe304Ser variant is a mild
    hypomorph that does not by itself cause ALG6-CDG (its allele frequency is
    identical in patients and controls), but is over-represented among severely
    affected PMM2-CDG patients. It should not be read as an ALG6-CDG
    genotype-phenotype claim.
  evidence:
  - reference: PMID:11875054
    reference_title: A frequent mild mutation in ALG6 may exacerbate the clinical severity of patients with congenital disorder of glycosylation Ia (CDG-Ia) caused by phosphomannomutase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the F304S genotype frequency in 55 CDG-Ia patients classified as
      mild/moderate (n = 28), or severe (n = 27) was significantly higher in
      severely affected patients (0.41) than in mild/moderately affected patients
      (0.21)
    explanation: >-
      The quantitative basis for treating p.Phe304Ser as a severity modifier in
      PMM2-CDG.
  - reference: PMID:11875054
    reference_title: A frequent mild mutation in ALG6 may exacerbate the clinical severity of patients with congenital disorder of glycosylation Ia (CDG-Ia) caused by phosphomannomutase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant allele frequency is identical in both CDG patients (0.30) and
      controls (0.28).
    explanation: >-
      Shows the allele is not itself disease-causing, which is why it is curated as
      MODIFIER rather than CAUSAL.
diagnosis:
- name: Serum transferrin isoelectric focusing followed by ALG6 sequencing
  description: >-
    Type I pattern on transferrin isoelectric focusing identifies a CDG of the
    assembly class; lipid-linked oligosaccharide analysis in fibroblasts localises
    the block to the glucosylation step; ALG6 sequencing confirms the genotype.
    Yeast complementation has been used to establish pathogenicity of novel
    alleles.
  evidence:
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations were tested for their ability to rescue faulty N:-linked
      glycosylation of carboxypeptidase Y in an ALG6-deficient Saccharomyces
      cerevisiae strain.
    explanation: >-
      Describes the functional assay used to establish allele pathogenicity.
treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying therapy exists for ALG6-CDG. Management follows the
    published CDG monitoring and management guidelines, with multidisciplinary
    supportive care. Note that the mannose supplementation effective in MPI-CDG
    (CDG-Ib) does not apply here: that therapy corrects a defect upstream in
    mannose supply, whereas ALG6-CDG is a glucosylation defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39923392
    reference_title: Causes of mortality in the congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study emphasizes the importance of diagnosis and supportive care
      following the published monitoring and management guidelines for affected
      patients with CDG to optimize their health and development in the early
      stages of the disease.
    explanation: >-
      Class-level statement of the supportive-care management standard for CDG.
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no specific therapy exists to correct the above-mentioned defects,
      it has been found that CDGS type-Ib patients bearing an inactive
      phosphomannose isomerase enzyme can be treated effectively by oral mannose
      supplementation
    explanation: >-
      Supports the scoping note that mannose therapy is specific to CDG-Ib and does
      not extend to the assembly defects.
discussions:
- discussion_id: gap_alg6_y131his_pathogenicity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is ALG6 p.Tyr131His a genuine cause of ALG6-CDG, a contributing hypomorph, or
    a benign common variant?
  attaches_to:
  - "pathophysiology#ALG6 Alpha-1,3-Glucosyltransferase Deficiency"
  rationale: >-
    The evidence pulls in three directions and has not been reconciled. Yeast
    complementation grades p.Tyr131His as severe as the common p.Ala333Val allele.
    Its US allele frequency of 0.0214 predicts homozygotes at roughly 1:2,200,
    which is orders of magnitude more common than diagnosed ALG6-CDG, so it cannot
    be fully penetrant at that severity. And the single reported p.Tyr131His
    homozygote had typical CDG-Ic symptoms but normal lipid-linked oligosaccharide
    and plasma transferrin glycosylation, which is the opposite of what the
    complementation result predicts. The original authors explicitly leave the
    question open. This matters beyond nomenclature: a variant this common will be
    reported by any exome, and the biochemical screen that would normally
    adjudicate it was itself normal in the one informative patient.
  proposed_experiments:
  - experiment_id: exp_alg6_y131his_population_genotyping
    name: Genotype-first ascertainment of p.Tyr131His homozygotes
    description: >-
      Identify p.Tyr131His homozygotes in unselected population biobanks and
      phenotype them for CDG features and transferrin glycosylation, to measure
      penetrance directly rather than inferring it from an allele-frequency
      argument.
  - experiment_id: exp_alg6_y131his_llo_in_patient_cells
    name: Lipid-linked oligosaccharide profiling in p.Tyr131His patient cells
    description: >-
      Measure lipid-linked oligosaccharide profiles and site occupancy in
      fibroblasts from p.Tyr131His carriers under both resting and
      rapid-proliferation conditions, to test whether the normal transferrin
      result reflects genuinely preserved glycosylation or a defect that only
      manifests under proliferative stress.
- discussion_id: gap_alg6_ple_causal_step
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which hypoglycosylated protein is responsible for enterocyte heparan sulfate
    loss in ALG6-CDG protein-losing enteropathy?
  attaches_to:
  - "pathophysiology#Enterocyte Heparan Sulfate Loss"
  rationale: >-
    The biopsy evidence for heparan sulfate and syndecan-1 loss is direct, and the
    proliferation dependence explains the episodic, gastroenteritis-triggered
    course. But the step between hypoglycosylation and heparan sulfate loss is
    stated by the original authors as a possibility rather than a demonstration:
    the defect could lie in glycosylation of a heparan sulfate core protein itself,
    or in glycosylation of the biosynthetic enzymes that build the chain. These
    predict different things about which other proteoglycans are affected and
    whether the loss is reversible on the same timescale, and no experiment has
    separated them. The causal edge to protein-losing enteropathy is therefore
    curated as PROPOSED rather than DIRECT.
  proposed_experiments:
  - experiment_id: exp_alg6_ple_glycoproteomics
    name: Site-occupancy glycoproteomics of patient enterocytes
    description: >-
      Perform site-specific N-glycosylation occupancy measurement on intestinal
      biopsy material from ALG6-CDG patients during and after an enteropathy
      episode, comparing occupancy on heparan sulfate core proteins against
      occupancy on heparan sulfate biosynthetic enzymes.
notes: >-
  Scope. This entry covers ALG6-CDG (CDG-Ic) only. Sibling per-gene CDG entries
  already exist for ALG12, ALG2, ALG8, DPM2, MPI and UGGT1; this is a parallel
  entry, not a subtype of any of them.

  Module conformance is declared at three nodes of
  congenital_disorder_of_glycosylation: the ER lipid-linked oligosaccharide
  assembly defect, protein hypoglycosylation, and multisystem glycoprotein
  dysfunction. The Enterocyte Heparan Sulfate Loss node deliberately does NOT
  declare conformance: it is an ALG6-CDG-specific branch with no counterpart node
  in the module, and its causal link to protein-losing enteropathy is
  PROPOSED rather than established (see the gap_alg6_ple_causal_step discussion).

  OMIM number. MONDO:0011291 xrefs OMIM 603147, and the ALG6 clinical utility gene
  card gives 603147 as the OMIM number "of the disease". A deep-research report
  used as a lead for this entry instead cited OMIM 604566, which is why the NEC
  preflight returned WARN rather than PASS. The gene-dominance signal was
  unambiguous (ALG6 mentioned 240 times against 6 for the next gene), and the
  independent gene-card evidence agrees with MONDO, so the discrepancy is recorded
  here rather than treated as entity confusion.

  The p.Phe304Ser entry under `genetic:` is a modifier claim about PMM2-CDG, not
  about ALG6-CDG, and is curated with relationship_type MODIFIER for that reason.
  It is included because the allele sits in ALG6 and would otherwise be
  discoverable only from the PMM2 entry.

review_notes: Reviewed the complete entry, matching research and generated source bodies. Primary full-text cohort data replace ambiguous abstract-based frequencies. The p.Tyr131His patient was reclassified, so that historical case no longer supplies ALG6 phenotypes or an unresolved pathogenicity gap. GeneReviews is retired and interpreted with its clinical, diagnostic, management and family scope. Molecular chemistry, heterologous rescue and patient tissue observations remain distinct. The source-availability and cohort discrepancies are detailed in notes.

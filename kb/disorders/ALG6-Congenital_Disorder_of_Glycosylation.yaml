experimental_models:
- name: ALG6-deficient Saccharomyces cerevisiae complementation assay
  experimental_model_type: OTHER
  description: >-
    Yeast lacking the ALG6 orthologue accumulate the same unglucosylated
    lipid-linked oligosaccharide as patient cells, so patient alleles can be scored
    by whether they restore glycosylation when expressed in that strain. This assay
    is what established pathogenicity for the founding p.Ala333Val allele and has
    been used for every subsequent allele, including the contested p.Tyr131His.
  publication: PMID:10359825
  modeled_mechanisms:
  - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reads out residual ALG6 catalytic function of a human allele in a
      null background.
    limitations: >-
      A yeast cell is not a human cell, and the assay measures glycosylation
      rescue rather than the human clinical phenotype. Its limits are visible in
      this disease: it grades p.Tyr131His as severe as the common pathogenic
      allele, yet the one reported human homozygote had normal transferrin
      glycosylation. Growth rate also modulates the readout, so assay conditions
      affect the apparent severity of an allele.
    readouts:
    - name: Rescue of hypoglycosylation in the alg6-null strain
      target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
      direction: ABOLISHED
      interpretation: >-
        Wild-type human ALG6 complements the yeast defect; the patient allele does
        not, which is the operational definition of loss of function used here.
      evidence:
      - reference: PMID:10359825
        reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          By contrast, the mutant ALG6 cDNA of CDGS patients failed to revert the
          hypoglycosylation observed in alg6 yeasts, thereby proving a functional
          relationship between the alanine to valine substitution introduced by the
          C-->T transition and the CDGS phenotype.
        explanation: The complementation failure that defines the assay's positive result.
  evidence:
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the human ALG5 and ALG6 cDNA could partially complement the
      respective S. cerevisiae alg5 and alg6 deficiency.
    explanation: >-
      Establishes that human ALG6 functionally substitutes in the yeast system,
      which is what makes the assay informative for human alleles.
discussions:
- discussion_id: gap_alg6_y131his_pathogenicity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is ALG6 p.Tyr131His a genuine cause of ALG6-CDG, a contributing hypomorph, or
    a benign common variant?
  attaches_to:
  - "pathophysiology#ALG6 Alpha-1,3-Glucosyltransferase Deficiency"
  rationale: >-
    The evidence pulls in three directions and has not been reconciled. Yeast
    complementation grades p.Tyr131His as severe as the common p.Ala333Val allele.
    Its US allele frequency of 0.0214 predicts homozygotes at roughly 1:2,200,
    which is orders of magnitude more common than diagnosed ALG6-CDG, so it cannot
    be fully penetrant at that severity. And the single reported p.Tyr131His
    homozygote had typical CDG-Ic symptoms but normal lipid-linked oligosaccharide
    and plasma transferrin glycosylation, which is the opposite of what the
    complementation result predicts. The original authors explicitly leave the
    question open. This matters beyond nomenclature: a variant this common will be
    reported by any exome, and the biochemical screen that would normally
    adjudicate it was itself normal in the one informative patient.
  proposed_experiments:
  - experiment_id: exp_alg6_y131his_population_genotyping
    name: Genotype-first ascertainment of p.Tyr131His homozygotes
    description: >-
      Identify p.Tyr131His homozygotes in unselected population biobanks and
      phenotype them for CDG features and transferrin glycosylation, to measure
      penetrance directly rather than inferring it from an allele-frequency
      argument.
  - experiment_id: exp_alg6_y131his_llo_in_patient_cells
    name: Lipid-linked oligosaccharide profiling in p.Tyr131His patient cells
    description: >-
      Measure lipid-linked oligosaccharide profiles and site occupancy in
      fibroblasts from p.Tyr131His carriers under both resting and
      rapid-proliferation conditions, to test whether the normal transferrin
      result reflects genuinely preserved glycosylation or a defect that only
      manifests under proliferative stress.
- discussion_id: gap_alg6_ple_causal_step
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which hypoglycosylated protein is responsible for enterocyte heparan sulfate
    loss in ALG6-CDG protein-losing enteropathy?
  attaches_to:
  - "pathophysiology#Enterocyte Heparan Sulfate Loss"
  rationale: >-
    The biopsy evidence for heparan sulfate and syndecan-1 loss is direct, and the
    proliferation dependence explains the episodic, gastroenteritis-triggered
    course. But the step between hypoglycosylation and heparan sulfate loss is
    stated by the original authors as a possibility rather than a demonstration:
    the defect could lie in glycosylation of a heparan sulfate core protein itself,
    or in glycosylation of the biosynthetic enzymes that build the chain. These
    predict different things about which other proteoglycans are affected and
    whether the loss is reversible on the same timescale, and no experiment has
    separated them. The causal edge to protein-losing enteropathy is therefore
    curated as PROPOSED rather than DIRECT.
  proposed_experiments:
  - experiment_id: exp_alg6_ple_glycoproteomics
    name: Site-occupancy glycoproteomics of patient enterocytes
    description: >-
      Perform site-specific N-glycosylation occupancy measurement on intestinal
      biopsy material from ALG6-CDG patients during and after an enteropathy
      episode, comparing occupancy on heparan sulfate core proteins against
      occupancy on heparan sulfate biosynthetic enzymes.
notes: >-
  Scope. This entry covers ALG6-CDG (CDG-Ic) only. Sibling per-gene CDG entries
  already exist for ALG12, ALG2, ALG8, DPM2, MPI and UGGT1; this is a parallel
  entry, not a subtype of any of them.

  Module conformance is declared at three nodes of
  congenital_disorder_of_glycosylation: the ER lipid-linked oligosaccharide
  assembly defect, protein hypoglycosylation, and multisystem glycoprotein
  dysfunction. The Enterocyte Heparan Sulfate Loss node deliberately does NOT
  declare conformance: it is an ALG6-CDG-specific branch with no counterpart node
  in the module, and its causal link to protein-losing enteropathy is
  PROPOSED rather than established (see the gap_alg6_ple_causal_step discussion).

  OMIM number. MONDO:0011291 xrefs OMIM 603147, and the ALG6 clinical utility gene
  card gives 603147 as the OMIM number "of the disease". A deep-research report
  used as a lead for this entry instead cited OMIM 604566, which is why the NEC
  preflight returned WARN rather than PASS. The gene-dominance signal was
  unambiguous (ALG6 mentioned 240 times against 6 for the next gene), and the
  independent gene-card evidence agrees with MONDO, so the discrepancy is recorded
  here rather than treated as entity confusion.

  The p.Phe304Ser entry under `genetic:` is a modifier claim about PMM2-CDG, not
  about ALG6-CDG, and is curated with relationship_type MODIFIER for that reason.
  It is included because the allele sits in ALG6 and would otherwise be
  discoverable only from the PMM2 entry.

  GeneReviews baseline. There is no ALG6-specific GeneReviews chapter. The nearest
  chapter is the N-linked glycosylation overview (PMID:20301507), which is RETIRED
  and carries no ALG6-specific clinical characteristics; it is tagged
  `GeneReviews` in `references:` so the negative result is recorded rather than
  looking like an omission. The phenotype baseline for this entry is therefore the
  primary literature: PMID:14517965 for the core CDG-Ic features and PMID:21334936
  for the deep single-patient phenotype.

  Phenotype evidence weight. The six core features rest on a class-level sentence
  covering CDG-Ic patients generally. The seven additional features (ataxia,
  dysarthria, cortical blindness, partial corpus callosum agenesis, hyperinsulinemic
  hypoglycaemia, myoclonus, delayed puberty) come from ONE deeply phenotyped
  patient, so they are curated without frequency bands and each says so in its
  description. That asymmetry is deliberate: the schema records what a source says
  but not how many patients it says it about, so the distinction is carried in
  prose where a reader will see it.

  Penetrance is not curated because no source quantifies it. The open question is
  recorded instead as the p.Tyr131His knowledge gap, where an allele frequency
  predicting homozygotes at roughly 1:2,200 sits against a far rarer diagnosed
  disease - which is a penetrance problem stated in the only terms the evidence
  supports.

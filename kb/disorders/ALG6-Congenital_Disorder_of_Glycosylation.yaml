genetic:
- name: ALG6 pathogenic variants
  gene_term:
    preferred_term: ALG6
    term:
      id: hgnc:23157
      label: ALG6
  association: Causative
  relationship_type: CAUSATIVE
  notes: Biallelic pathogenic ALG6 variants cause the disease. p.Ala333Val was common in historical cohorts and has a founder haplotype; p.Ile299del and splice variants also recur. The 2016 clinical cohort did not establish a clear genotype–phenotype correlation. Heterologous complementation was performed for selected alleles, not every subsequently reported variant. p.Tyr131His is not treated as causative; the historical homozygous patient was reclassified.
  evidence:
  - reference: PMID:14517965
    reference_title: Identification of a frequent variant in ALG6, the cause of Congenital Disorder of Glycosylation-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the most common disease-causing mutation, c998C>T (p. Ala333Val), which occurs in over half of all known CDG-Ic patients
    explanation: Historical 2003 frequency among then-known cases, not a current global allele frequency.
    quote_role: BACKGROUND
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Haplotype analysis of CDG-Ic patients revealed a founder effect for the ALG6 allele bearing the A333 V mutation.
    explanation: Founder origin of the common allele.
    quote_role: PRIMARY_RESULT
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The genomic organization of the human ALG6 gene was determined, revealing 14 exons spread over 55 kb.
    explanation: Gene structure relevant to variant ascertainment.
    quote_role: PRIMARY_RESULT
  - reference: PMID:27287710
    reference_title: 'ALG6-CDG: a recognizable phenotype with epilepsy, proximal muscle weakness, ataxia and behavioral and limb anomalies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common pathogenic protein alterations were p.A333V and p.I299Del, without any clear genotype-phenotype correlation.
    explanation: Names the two commonest alleles across 41 patients and records the absence of a genotype-phenotype correlation, which is why this entry curates no allele-stratified phenotype claims.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Transferrin glycoform analysis and molecular confirmation
  description: Transferrin isoelectric focusing or mass spectrometry can identify a type I glycosylation pattern. ALG6-CDG is established by clinically interpreted biallelic pathogenic or likely pathogenic ALG6 variants, with segregation and biochemical/functional studies where needed. Exome or panel testing may precede transferrin testing in an infant with unexplained epilepsy. A VUS or benign variant alone is insufficient.
  evidence:
  - *id009
  - reference: PMID:36756224
    reference_title: A Case of ALG6-CDG with Explosive Onset of Intractable Epilepsy During Infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Together, these tests confirmed the diagnosis of ALG6-CDG.
    explanation: The child had compound heterozygous ALG6 variants plus repeated type I transferrin results.
  - reference: PMID:32407885
    reference_title: 'Bosch-Boonstra-Schaaf optic atrophy syndrome (BBSOAS) initially diagnosed as ALG6-CDG: Functional evidence for benignity of the ALG6 c.391T>C (p.Tyr131His) variant and further expanding the BBSOAS phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: This case is illustrative of the utility of whole exome sequencing in the diagnostic odyssey, and the potential pitfalls of relying on focused genetic testing results for diagnosis of conditions with complex overlapping phenotypes.
    explanation: The reclassified patient illustrates why a targeted variant result requires phenotype and biochemical corroboration.
- name: Fibroblast lipid-linked oligosaccharide analysis
  description: Accumulation of Man9GlcNAc2 helps localize the defect. This specialized cultured-cell assay can be equivocal and is available in few centers; it is not required before every genomic diagnosis.
  evidence:
  - *id010
  - reference: PMID:25052310
    reference_title: 'Clinical utility gene card for: ALG6 defective congenital disorder of glycosylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: the DLO analysis is cumbersome, produces sometimes equivocal results, and is only available in very few centers
    explanation: Limitations described in the clinical utility gene card.
- name: Reassess discordant historical diagnoses
  description: The woman reported with homozygous ALG6 p.Tyr131His in 2011 was later diagnosed with NR2F1-related Bosch-Boonstra-Schaaf optic atrophy syndrome. Normal glycosylation studies together with genomic reassessment supported reclassification; normal adult transferrin alone is not an absolute exclusion rule for all CDGs.
  evidence: &id013
  - reference: PMID:32407885
    reference_title: 'Bosch-Boonstra-Schaaf optic atrophy syndrome (BBSOAS) initially diagnosed as ALG6-CDG: Functional evidence for benignity of the ALG6 c.391T>C (p.Tyr131His) variant and further expanding the BBSOAS phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We report on a 31-year-old female initially diagnosed with ALG6-CDG based on glycosylation abnormalities on transferrin isoelectrofocusing and targeted genetic testing, and later diagnosed with BBSOAS by whole-exome sequencing (WES).
    explanation: Primary report of diagnostic revision.
  - reference: PMID:32407885
    reference_title: 'Bosch-Boonstra-Schaaf optic atrophy syndrome (BBSOAS) initially diagnosed as ALG6-CDG: Functional evidence for benignity of the ALG6 c.391T>C (p.Tyr131His) variant and further expanding the BBSOAS phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Functional studies on cultured fibroblasts including Western blotting and RT-qPCR, as well as mass spectrometry of glycosylated transferrin and MALDI-TOF glycan analysis in serum, demonstrated normal glycosylation in this patient.
    explanation: Functional and biochemical support for reassessment; no direct enzyme-activity assay is claimed.
treatments:
- name: Multidisciplinary supportive care
  description: No established disease-modifying treatment is documented in the reviewed ALG6 literature. Coordinate metabolic, neurological, nutritional, developmental and organ-specific care. Evidence for mannose in MPI-CDG does not establish benefit in ALG6-CDG.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:25052310
    reference_title: 'Clinical utility gene card for: ALG6 defective congenital disorder of glycosylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Treatment of ALG6-CDG is purely symptomatic.
    explanation: ALG6-specific clinical utility guidance.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Individualized antiseizure treatment
  description: Treat according to seizure type and response. The cohort used several agents, and some patients remain refractory. One child had initial electroclinical improvement with phenobarbital but subsequently had near-daily seizures despite multiple agents and ketogenic diet. Neither this observation nor isolated drug trials establish a preferred ALG6-specific regimen.
  therapeutic_modality: SMALL_MOLECULE
  evidence:

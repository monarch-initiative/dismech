experimental_models:
- name: ALG6-deficient Saccharomyces cerevisiae complementation assay
  experimental_model_type: OTHER
  description: Human wild-type or p.Ala333Val ALG6 was expressed in Saccharomyces cerevisiae alg6 mutants. CPY glycoform rescue and synthetic growth rescue in alg6 wbp1-2 double mutants are distinct readouts. These assays support impaired but residual activity of the founding allele; they did not test every human variant.
  publication: PMID:10359825
  modeled_mechanisms:
  - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Heterologous complementation assesses functional capacity of the human construct in a yeast pathway.
    limitations: Growth and CPY glycosylation depend on yeast background, expression and assay conditions. Failure of one rescue readout is not a quantitative zero-activity measurement or proof of human organ pathology.
    readouts:
    - name: Failure of mutant CPY glycosylation rescue
      target: Protein Hypoglycosylation
      direction: INCREASED
      interpretation: Compared with the partially rescuing wild-type human construct, p.Ala333Val leaves CPY hypoglycosylation uncorrected in this assay.
      evidence:
      - *id011
    - name: Growth rescue in alg6 wbp1-2 yeast
      target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
      direction: DECREASED
      interpretation: The p.Ala333Val construct partially restores growth, supporting residual function.
      evidence:
      - *id012
  evidence:
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Expression of the human ALG5 and ALG6 cDNA could partially complement the respective S. cerevisiae alg5 and alg6 deficiency.
    explanation: Establishes that human ALG6 functionally substitutes in the yeast system, which is what makes the assay informative for human alleles.
    quote_role: PRIMARY_RESULT
- name: ALG6-CDG patient fibroblast lipid-linked oligosaccharide profiling
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Cultured patient fibroblasts show accumulation of the unglucosylated ALG6 substrate. The original p.Ala333Val study also found similar ALG6 RT-PCR signals in patient and control fibroblasts, so reduced transcript abundance is not asserted as that allele mechanism.
  publication: PMID:10914684
  evidence: *id002
  modeled_mechanisms:
  - target: Incomplete Lipid-Linked Oligosaccharide Glucosylation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Patient-derived cells reproduce the disease biochemical substrate accumulation.
    limitations: Fibroblasts do not model organ-specific developmental, neurological or enterocyte dysfunction.
    readouts:
    - name: Dolichyl pyrophosphate-Man9GlcNAc2 accumulation
      target: Incomplete Lipid-Linked Oligosaccharide Glucosylation
      direction: INCREASED
      interpretation: Accumulated unglucosylated precursor localizes the assembly block.
      evidence: *id002
- name: Purified yeast ALG6 structural and glycosyltransferase assays
  experimental_model_type: OTHER
  description: Saccharomyces cerevisiae ALG6 expressed through an Sf9/baculovirus system was purified for cryo-EM and synthetic-substrate assays. The apo nanodisc structure is 3.0 Å and donor-bound detergent structure 3.9 Å. Patient positions were mapped onto the yeast structure; they were not functionally tested as a clinical allele series. The acceptor groove, donor-glucose geometry and binding order remain incompletely resolved.
  publication: PMID:32103179
  evidence:
  - reference: PMID:32103179
    reference_title: Structure and mechanism of the ER-based glucosyltransferase ALG6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The specificity of ALG6 can be demonstrated in vitro, where only glucose, but not mannose, is transferred from a Dol25-P carrier
    explanation: Purified yeast enzyme with synthetic short-chain donor/acceptor substrates, not human patient cells.
  - reference: PMID:32103179
    reference_title: Structure and mechanism of the ER-based glucosyltransferase ALG6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Purified ALG6 indeed retains activity in the presence of EDTA
    explanation: Direct biochemical evidence for metal-independent transfer.
  modeled_mechanisms:
  - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
    relationship: PERTURBS
    fidelity: MODERATE
    description: Engineered catalytic-site substitutions interrogate the conserved first-glucose reaction.
    limitations: Asp69/Asp99/His378 substitutions are engineered yeast variants, not patient alleles. Endpoint incubation times differ between wild type and mutants; most assays were conducted once. The STT3-coupled readout is distinct from ALG6 catalysis. No patient residual-activity threshold, clinical rescue or human tissue mechanism is established.
    readouts:
    - name: Engineered Asp69 substitution reduces transfer
      target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
      direction: INCREASED
      interpretation: Asp69Ala abolishes and Asp69Asn reduces the measured transfer reaction.
      evidence:
      - reference: PMID:32103179
        reference_title: Structure and mechanism of the ER-based glucosyltransferase ALG6.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: Finally, mutating Asp69 to an alanine abolished ALG6 function, and mutating it to an asparagine strongly reduced activity.
        explanation: Engineered active-site perturbation in purified yeast enzyme.
discussions:
- discussion_id: resolved_alg6_y131his_reclassification
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  prompt: Does the historical homozygous p.Tyr131His case establish ALG6-CDG?
  attaches_to:
  - pathophysiology#Biallelic Pathogenic ALG6 Variants
  rationale: The 2020 primary report reclassified the woman described in the 2011 puberty paper as NR2F1-related BBSOAS and found normal glycosylation in fibroblasts and serum. Her attributed puberty, dysarthria and cortical visual findings are therefore not retained as ALG6 evidence without independent support. The original yeast assay used p.Tyr131His in cis with p.Ser308Arg and cannot establish the isolated common variant as causal. A normal adult transferrin result alone does not exclude every CDG.
  evidence: *id013
  resolved_date: '2026-09-21T05:04:09Z'
  resolution_note: PMID:32407885 reclassified the historical patient as NR2F1-related BBSOAS and documented normal glycosylation. The isolated p.Tyr131His variant is not accepted here as a causal ALG6-CDG allele; independent ALG6 findings are retained with other sources.
- discussion_id: gap_alg6_ple_causal_step
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which hypoglycosylated protein is responsible for enterocyte heparan sulfate loss in ALG6-CDG protein-losing enteropathy?
  attaches_to:
  - pathophysiology#Enterocyte Heparan Sulfate Loss
  rationale: The paired biopsy observation links enteropathy episodes with reduced heparan sulfate and syndecan-1 staining in one boy. Core-protein hypoglycosylation and impaired glycosylation of biosynthetic enzymes are alternative proposed explanations. Yeast growth-phase effects do not directly demonstrate enterocyte proliferation as the causal human intermediate. Neither a specific connecting protein nor rescue of human enteric leakage was established.
  proposed_experiments:
  - experiment_id: exp_alg6_ple_glycoproteomics
    name: Site-occupancy glycoproteomics of patient enterocytes
    description: Perform site-specific N-glycosylation occupancy measurement on intestinal biopsy material from ALG6-CDG patients during and after an enteropathy episode, comparing occupancy on heparan sulfate core proteins against occupancy on heparan sulfate biosynthetic enzymes.

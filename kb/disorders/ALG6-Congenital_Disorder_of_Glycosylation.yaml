prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A time-bounded diagnosed-case count from the literature as of 2011, not a
    population prevalence estimate. Despite the small absolute number, ALG6-CDG
    has been described as the second most common CDG after PMM2-CDG, which
    reflects how rare the non-PMM2 disorders are rather than any large ALG6-CDG
    cohort.
  evidence:
  - reference: PMID:21334936
    reference_title: Pubertal development in ALG6 deficiency (congenital disorder of glycosylation type Ic).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fewer than 100 cases of ALG6D have been described worldwide, presenting with
      psychomotor retardation, muscular hypotonia, gross motor delays, seizures,
      and occasionally protein losing enteropathy.
    explanation: >-
      Direct published patient-count statement for ALG6 deficiency.
  - reference: PMID:10914684
    reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although more than 80% of CDG are type Ia, CDG-Ic may be the second most
      common form of the disease.
    explanation: >-
      Positions ALG6-CDG within the CDG spectrum by relative, not absolute,
      frequency.
pathophysiology:
- name: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic ALG6 variants impair the ER-luminal alpha-1,3-glucosyltransferase
    that transfers the first glucose from dolichylphosphate-glucose onto the
    dolichol-linked Man9GlcNAc2 intermediate. Pathogenicity of individual alleles
    has been established by their failure to complement an ALG6-deficient
    Saccharomyces cerevisiae strain.
  genes:
  - preferred_term: ALG6
    term:
      id: hgnc:23157
      label: ALG6
  molecular_functions:
  - preferred_term: alpha-1,3-glucosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0046527
      label: glucosyltransferase activity
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation in the ALG6 alpha1,3-glucosyltransferase gene defines an
      additional type of CDGS, which we propose to refer to as CDGS type-Ic.
    explanation: >-
      The original report establishing ALG6 as the causative gene and naming the
      disorder.
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, the mutant ALG6 cDNA of CDGS patients failed to revert the
      hypoglycosylation observed in alg6 yeasts, thereby proving a functional
      relationship between the alanine to valine substitution introduced by the
      C-->T transition and the CDGS phenotype.
    explanation: >-
      Yeast complementation establishes that the patient allele is functionally
      null for the glucosylation step. Cited as IN_VITRO because the assay is in
      a yeast strain, not in patient tissue.
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      subsequent analysis showed three point mutations in the ALG6 gene encoding
      an alpha1,3-glucosyltransferase needed for the addition of the first glucose
      to the dolichol-linked oligosaccharide
    explanation: >-
      States the enzyme's exact biochemical step: addition of the first glucose to
      the dolichol-linked oligosaccharide.
  - reference: PMID:32103179
    reference_title: Structure and mechanism of the ER-based glucosyltransferase ALG6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ALG6 transfers the first of three glucose moieties onto the pre-assembled
      GlcNAc2Man9 glycan.
    explanation: >-
      Structural and enzymological confirmation of the reaction ALG6 catalyses.
  downstream:
  - target: Incomplete Lipid-Linked Oligosaccharide Glucosylation
    description: >-
      Loss of ALG6 activity halts glucosylation of the lipid-linked oligosaccharide
      at the Man9GlcNAc2 stage, so the fully glucosylated Glc3Man9GlcNAc2 donor is
      not assembled.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10914684
      reference_title: Multi-allelic origin of congenital disorder of glycosylation (CDG)-Ic.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of lipid-linked oligosaccharides in fibroblasts confirmed the
        accumulation of dolichyl pyrophosphate-Man9GlcNAc2 in the CDG-Ic patients.
      explanation: >-
        Patient fibroblasts accumulate exactly the substrate ALG6 should have
        consumed, directly demonstrating the block.
- name: Incomplete Lipid-Linked Oligosaccharide Glucosylation
  biological_scale: MOLECULAR
  description: >-
    Dolichyl pyrophosphate-Man9GlcNAc2 accumulates in patient cells. The triglucosyl
    cap is what allows efficient substrate recognition by the
    oligosaccharyltransferase complex, so an unglucosylated precursor is
    transferred to nascent glycoproteins inefficiently.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The addition of three glucose residues to the oligomannose core is critical
      for optimal substrate recognition by the oligosaccharyltransferase complex
      and therefore is necessary to ensure the efficient transfer of the
      oligomannose core to nascent glycoproteins
    explanation: >-
      Explains why an unglucosylated precursor is a poor donor, which is the
      mechanistic link from the enzymatic block to hypoglycosylation.
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified in four related patients a novel type of CDGS characterized by
      an accumulation of dolichyl pyrophosphate-linked Man9GlcNAc2
    explanation: >-
      The defining biochemical accumulation in ALG6-CDG patients.
  downstream:
  - target: Protein Hypoglycosylation
    description: >-
      Inefficient transfer of the incompletely glucosylated precursor by
      oligosaccharyltransferase leaves N-glycosylation sequons unoccupied on
      nascent glycoproteins.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32103179
      reference_title: Structure and mechanism of the ER-based glucosyltransferase ALG6.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        it was shown that deficiencies in ALG6 are a frequent cause of congenital
        disorders of glycosylation (CDGs)7, in which patients generally have
        hypo-glycosylated serum glycoproteins8,9
      explanation: >-
        Links ALG6 deficiency to hypoglycosylated serum glycoproteins in patients.
- name: Protein Hypoglycosylation
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  biological_scale: CELLULAR
  description: >-
    Under-occupancy of N-glycosylation sites produces the type I CDG serum
    transferrin isoelectric focusing pattern used diagnostically, and
    hypoglycosylation of cellular glycoproteins more broadly. Severity is
    proliferation- and stress-dependent: underglycosylation is markedly worse in
    rapidly dividing cells.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isoelectric focusing analysis of serum transferrin indicated a congenital
      disorder of glycosylation (CDG)
    explanation: >-
      The transferrin isoelectric focusing abnormality that indexes protein
      hypoglycosylation in this patient.
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Underglycosylation resulting from each of these mutations is much more severe
      in rapidly dividing yeast.
    explanation: >-
      Establishes the proliferation dependence of the glycosylation defect, which
      is the basis for the stress-triggered enteropathy branch below. Cited as
      IN_VITRO because the measurement is in yeast.
  downstream:
  - target: Multisystem Glycoprotein Dysfunction
    description: >-
      Hypoglycosylation of many secreted and membrane glycoproteins produces the
      multisystem neurological, ophthalmological and gastrointestinal phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14517965
      reference_title: "Identification of a frequent variant in ALG6, the cause of Congenital Disorder of Glycosylation-Ic."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CDG-Ic patients have moderate to severe psychomotor retardation, seizures,
        hypotonia, strabismus, and feeding difficulties.
      explanation: >-
        The multisystem clinical consequence of the glycosylation defect.
  - target: Enterocyte Heparan Sulfate Loss
    description: >-
      In rapidly dividing enterocytes under gastroenteritis-induced stress, the
      glycosylation defect becomes severe enough to deplete heparan sulfate and
      syndecan-1 from the basolateral surface.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11106564
      reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similarly, incomplete protein glycosylation in the patient is most severe
        in rapidly dividing enterocytes during gastroenteritis-induced stress.
      explanation: >-
        Directly connects the proliferation-dependent glycosylation defect to the
        enterocyte compartment.
- name: Enterocyte Heparan Sulfate Loss
  biological_scale: TISSUE
  description: >-
    Loss of heparan sulfate and syndecan-1 core protein from the basolateral
    enterocyte surface, reversible when the precipitating gastroenteritis
    resolves. This is the proposed proximate cause of protein-losing enteropathy
    in ALG6-CDG, and explains why the enteropathy is episodic and
    infection-triggered rather than constant.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  evidence:
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intestinal biopsy in a boy with gastroenteritis-induced protein-losing
      enteropathy (PLE) showed loss of heparan sulfate (HS) and syndecan-1 core
      protein from the basolateral surface of the enterocytes, which improved after
      PLE subsided.
    explanation: >-
      Biopsy evidence of the heparan sulfate loss and its reversibility with
      clinical improvement.
  - reference: PMID:11106564
    reference_title: Reduced heparan sulfate accumulation in enterocytes contributes to protein-losing enteropathy in a congenital disorder of glycosylation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete N:-linked glycosylation of an HS core protein and/or other
      biosynthetic enzymes may explain the selective localized loss of HS and PLE.
    explanation: >-
      The authors themselves frame the causal step as a proposal ("may explain"),
      so this is curated as PARTIAL rather than SUPPORT.
  downstream:
  - target: Protein-losing enteropathy
    description: >-
      Loss of the basolateral heparan sulfate barrier permits enteric protein
      loss. Curated as INDIRECT_UNKNOWN_INTERMEDIATES because the original
      authors state this step as a possibility rather than a demonstration.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

name: ALG6-congenital disorder of glycosylation
creation_date: "2026-08-24T13:45:00Z"
description: >-
  ALG6-congenital disorder of glycosylation (ALG6-CDG, CDG-Ic) is an autosomal
  recessive disorder of protein N-linked glycosylation caused by biallelic ALG6
  variants. ALG6 is the endoplasmic reticulum alpha-1,3-glucosyltransferase that
  adds the first of three glucose residues to the dolichol-linked
  Man9GlcNAc2 precursor. Because that glucose cap is what the
  oligosaccharyltransferase complex recognises, its loss leaves a poor donor
  substrate, causing hypoglycosylation of serum and cellular glycoproteins with a
  type I CDG transferrin pattern. Patients present with psychomotor retardation,
  muscular hypotonia, seizures, strabismus and feeding difficulties, and a subset
  develop protein-losing enteropathy. ALG6-CDG has been described as the second
  most common CDG after PMM2-CDG.
synonyms:
- ALG6-CDG
- CDG-Ic
- CDG1C
- congenital disorder of glycosylation type Ic
- carbohydrate-deficient glycoprotein syndrome type Ic
- ALG6 deficiency
- glucosyltransferase 1 deficiency
- alpha-1,3-glucosyltransferase deficiency

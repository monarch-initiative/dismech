notes: 'Scope: ALG6-CDG (CDG-Ic), distinct from other per-gene CDGs. OMIM 603147 is the disease; 604566 is the ALG6 gene. The matching research report was used as a lead, with primary-source correction of unsupported activity thresholds, universal functional testing, speculative ER-stress/receptor pathways and the reclassified p.Tyr131His case.

  GeneReviews baseline: the complete NBK1332 N-linked glycosylation overview contains ALG6-specific clinical and inheritance information and general diagnosis, care, surveillance and family guidance. It is retired and used as historical guidance alongside the clinical utility card and newer primary reports. Its 2011 puberty citation predates the NR2F1 reclassification and was not carried forward.

  Cohort accounting: the 2016 study reports 41 clinical participants, including six without molecular results but characteristic LLO/transferrin findings, and incorporates the five South African cases and the original cardiomyopathy case. Its genetic registry and genotype–phenotype comparison use different denominators. Narrative phenotype counts are used rather than deriving new totals from internally inconsistent tables: duplicate patient labels/extra rows, a 42-case figure caption, and discrepancies in ages/deaths are present. Laboratory assessment was not systematic. A cohort-derived band is not population penetrance. Hypotonia is 40 in the narrative despite all in the abstract; ataxia is 20 and epilepsy 30, while nonspecific dysmorphism is 15 despite the abstract describing it as rare.

  Source availability: all original abstracts and actual cached full bodies were assessed. The 23430515 record is labeled full HTML but contains a subscription preview; the complete five-case paper was generated separately from its institutional PDF. Full 2016 cohort and GeneReviews sources were also recovered. The 32407885 abstract establishes diagnostic revision; publisher clinical/methods text was independently checked but its complete Results were not retrieved, and no disputed secondary NR2F1 residue was imported. Attempts to recover the complete 11106564 body through PMC and a PDF mirror were blocked; its model and biopsy claims remain restricted to the generated abstract. Gene-card PDF extraction has broken words; no test accuracy percentage or lifetime negative predictive value was generalized from it.

  Care scope: the retired GeneReviews chapter also gives a general precaution about acetaminophen and other liver-metabolized medicines. It does not demonstrate an ALG6-specific drug contraindication; medication review should reflect the individual hepatic findings. No blanket prohibition was inferred from that historical class-level advice.

  Treatment ontology scope: live NCIt search supports Nutritional Support, Rehabilitation, Eye Examination and Anticonvulsant Therapy. Patient Monitoring (NCIT:C53607) falls outside the treatment-action enum and was not forced into it. Searches for hematology consultation, psychiatric treatment and protein-losing-enteropathy treatment did not identify a matching specific allowed action; those multimodal plans remain descriptively curated.'

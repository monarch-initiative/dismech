    explanation: No measured population frequency is available in this clinical utility review.
pathophysiology:
- name: Biallelic Pathogenic ALG6 Variants
  biological_scale: MOLECULAR
  description: Recessive ALG6 variants impair the function required for the first glucose addition during ER lipid-linked oligosaccharide assembly. Different alleles require their own clinical and functional interpretation; the common p.Tyr131His variant is not treated as a proven cause.
  evidence:
  - reference: PMID:10359825
    reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient glycoprotein syndrome type-Ic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation cosegregated with the disease in a Mendelian recessive manner.
    explanation: Segregation analysis in the original four patients establishes recessive transmission.
    quote_role: PRIMARY_RESULT

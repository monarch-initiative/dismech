mechanistic_hypotheses:
- hypothesis_group_id: renal_dopamine_toxicity
  hypothesis_label: Intracellular tubular dopamine toxicity causes the kidney dysfunction
  status: EMERGING
  description: >-
    The kidney dysfunction is attributed to toxic dopamine and dopamine metabolites
    in proximal tubular cells. It is proposed on indirect grounds: there is no
    supine hypertension, a single biopsy argued against hypoperfusion injury, and
    renal function improves only partly on droxidopa while dopamine stays high. No
    study has measured tubular dopamine or oxidative injury in patients.
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A potential damaging factor to the kidneys, which is quite unique to patients with DBH‐deficiency, is the very high level of dopamine intracellularly in the proximal tubular cells."
    explanation: Source of the hypothesis.

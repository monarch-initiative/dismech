- name: Failure of Baroreflex-Mediated Vasoconstriction
  biological_scale: ORGANISM
  description: >-
    Baroreflex afferents and sympathetic efferent firing are intact, but the
    efferent signal has no vasoconstrictor transmitter, so blood pressure falls
    profoundly on standing. Supine blood pressure is normal or low, with no supine
    hypertension, and the normal nocturnal dip is absent. Supine exercise is better
    tolerated than in degenerative autonomic failure, possibly because dopamine and
    co-transmitters are still released.
  biological_processes:
  - preferred_term: regulation of systemic arterial blood pressure by carotid sinus baroreceptor feedback
    modifier: DECREASED
    term:
      id: GO:0001978
      label: regulation of systemic arterial blood pressure by carotid sinus baroreceptor feedback
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the untreated drop in systolic and diastolic blood pressure within 3 minutes of standing was profound: mean systolic difference 58 mm Hg (range 32‐115 mm Hg, SD 21), mean diastolic difference 38 mm Hg (range 18‐74, SD 18). Supine blood pressure (office measurements) was <135/90 mm Hg in all patients (mean 109/68 mm Hg SD 13/11)."
    explanation: Profound orthostatic fall without supine hypertension.
  - reference: PMID:7602525
    reference_title: "Abnormal cardiovascular and catecholamine responses to supine exercise in human subjects with sympathetic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In DBH deficiency blood pressure was unchanged; this lack of fall may have been due to vasoconstriction induced by dopamine and other substances released from otherwise intact sympathetic terminals, or to preserved cardiac vagal function."
    explanation: Supine exercise does not lower blood pressure, unlike PAF and MSA.
  downstream:
  - target: Neurogenic orthostatic hypotension
    causal_link_type: DIRECT
    description: Venous pooling on standing is not opposed by vasoconstriction.
    evidence:
    - reference: PMID:20301647
      reference_title: "Dopamine Beta-Hydroxylase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Dopamine beta-hydroxylase (DBH) deficiency is characterized by lack of sympathetic noradrenergic function resulting in profound deficits in autonomic regulation of cardiovascular function (orthostatic hypotension)"

- name: Renal Tubular Dopamine Excess
  biological_scale: CELLULAR
  description: >-
    Proximal tubular cells take up and make dopamine. In DBH deficiency very high
    intracellular dopamine has been proposed to injure tubules through oxidative
    dopamine metabolites. This is a hypothesis from one cohort, offered because
    chronic orthostatic hypoperfusion was not supported by a kidney biopsy that showed
    only discrete fibrosis, and supine hypertension, the usual cause of renal decline
    in autonomic failure, is absent.

name: Dopamine Beta-Hydroxylase Deficiency
creation_date: '2026-10-23T00:00:00Z'
category: Mendelian
synonyms:
- DBH deficiency
- orthostatic hypotension 1
- noradrenaline deficiency
- norepinephrine deficiency
parents:
- Primary Autonomic Failure
- Monoamine Neurotransmitter Synthesis Disorder
disease_term:
  preferred_term: dopamine beta-hydroxylase deficiency
  term:
    id: MONDO:0009123
    label: orthostatic hypotension 1
description: >-
  Autosomal recessive deficiency of dopamine beta-hydroxylase (DBH), the vesicular
  enzyme that converts dopamine to noradrenaline in sympathetic noradrenergic
  neurons, central noradrenergic neurons and adrenal chromaffin cells. Noradrenaline
  and adrenaline are absent from plasma, urine and cerebrospinal fluid while dopamine
  is raised. The sympathetic neurons themselves are structurally intact and fire
  normally, but release dopamine instead of noradrenaline, so the disease is a pure
  noradrenergic failure with preserved cholinergic and parasympathetic function.
  It presents with a complicated neonatal period (hypotension, hypothermia,
  hypoglycaemia), childhood-onset exercise intolerance and profound orthostatic
  hypotension that worsens in adolescence, eyelid ptosis, nasal congestion and
  ejaculatory failure. Impaired kidney function, mild anaemia and hypomagnesaemia are
  common. The noradrenaline prodrug droxidopa bypasses the enzymatic block and gives
  a dramatic and sustained clinical response.

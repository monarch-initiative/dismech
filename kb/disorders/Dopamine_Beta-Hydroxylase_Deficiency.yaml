differential_diagnoses:
- name: CYB561-related orthostatic hypotension
  disease_term:
    preferred_term: orthostatic hypotension 2
    term:
      id: MONDO:0020751
      label: orthostatic hypotension 2
  distinguishing_features:
  - Same low noradrenaline and adrenaline, but plasma DBH activity is normal and DBH has no variants
  - Caused by loss of vesicular ascorbate regeneration (functional DBH deficiency)
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As in dopamine β-hydroxylase deficiency, concentrations of norepinephrine and epinephrine in the patients were low. Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene had no mutations."
    explanation: Distinguishes CYB561 deficiency from DBH deficiency.
- name: Pure autonomic failure
  disease_term:
    preferred_term: pure autonomic failure
    term:
      id: MONDO:0018608
      label: pure autonomic failure
  distinguishing_features:
  - Adult onset with degeneration of postganglionic noradrenergic neurons
  - Absent muscle sympathetic nerve activity and low plasma noradrenaline without dopamine excess
  - Impaired smell, unlike DBH deficiency
  evidence:
  - reference: PMID:8801271
    reference_title: "Total norepinephrine spillover, muscle sympathetic nerve activity and heart-rate spectral analysis in a patient with dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, the PAF subjects had no detectable muscle sympathetic nerve activity, very low levels of norepinephrine spillover and epinephrine secretion and a reduction in heart rate variability at all frequencies."
    explanation: PAF lacks the intact nerve traffic seen in DBH deficiency.
  - reference: PMID:21282592
    reference_title: "A cross-sectional study contrasting olfactory function in autonomic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Odor identification was significantly impaired in patients with pure autonomic failure relative to patients with multiple system atrophy or dopamine β-hydroxylase deficiency."
    explanation: Preserved smell in DBH deficiency.
- name: Multiple system atrophy
  disease_term:
    preferred_term: multiple system atrophy
    term:
      id: MONDO:0007803
      label: multiple system atrophy
  distinguishing_features:
  - Adult-onset neurodegeneration with parkinsonism or ataxia
  - Normal plasma noradrenaline
  evidence:
  - reference: PMID:7602525
    reference_title: "Abnormal cardiovascular and catecholamine responses to supine exercise in human subjects with sympathetic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With exercise, blood pressure increased in controls, fell markedly in SDS and PAF and was unchanged in DBH deficiency."
    explanation: Exercise blood-pressure response separates DBH deficiency from MSA (SDS) and PAF.
- name: Riley-Day syndrome (familial dysautonomia)
  disease_term:
    preferred_term: familial dysautonomia
    term:
      id: MONDO:0009131
      label: Riley-Day syndrome
  distinguishing_features:
  - Absent axon flare to intradermal histamine, absent tearing, impaired taste and tendon reflexes
  - Ashkenazi Jewish ancestry
  evidence:
  - reference: PMID:16722595
    reference_title: "Dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A typical flare reaction to intradermal histamine together with normal tearing sensory function, normal taste and smell, normal intact corneal and deep tendon reflexes, and lack of Askenazi Jewish extraction allow exclusion of familial dysautonomia"
    explanation: Features that exclude familial dysautonomia.
- name: Menkes disease
  disease_term:
    preferred_term: Menkes disease
    term:
      id: MONDO:0010651
      label: Menkes disease
  distinguishing_features:
  - Copper deficiency lowers DBH activity, but with profound developmental delay and hypopigmentation
  evidence:
  - reference: PMID:16722595
    reference_title: "Dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Absence of profound mental retardation or hypopigmentation makes confusion with Menkes syndrome improbable"
    explanation: Clinical features separating Menkes disease.
environmental:
- name: Hot environments, heavy meals and alcohol ingestion
  presence: Positive
  description: >-
    Heat, large meals and alcohol all redistribute blood volume to the skin or splanchnic
    circulation. With no reflex vasoconstriction available, patients report that
    presyncopal symptoms worsen under these conditions.
  effect: Worsens orthostatic symptoms.
  exposure_term:
    preferred_term: exposure to high temperature environment
    term:
      id: ECTO:1000007
      label: exposure to high temperature environment
  notes: >-
    One environmental entry covers the three triggers named together in the GeneReviews
    sentence quoted below. The exposure_term binds only the heat component, because ECTO
    has no class covering heat, meals and alcohol jointly.
  evidence:
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Presyncopal symptoms include dizziness, blurred vision, dyspnea, nuchal discomfort, and chest pain; symptoms may worsen in hot environments or after heavy meals or alcohol ingestion."
    explanation: GeneReviews names heat, heavy meals and alcohol as symptom-worsening exposures.
  influences_mechanisms:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Each of these exposures adds peripheral or splanchnic vasodilatation to a
      circulation that cannot vasoconstrict in response, deepening the standing fall in
      blood pressure.
    evidence:
    - reference: PMID:20301647
      reference_title: "Dopamine Beta-Hydroxylase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Untreated individuals should avoid hot environments, strenuous exercise, standing motionless, and dehydration; nephrotoxic drugs should be avoided."
      explanation: These exposures are listed as circumstances to avoid, which is the management counterpart of their exacerbating effect.
- name: Strenuous exertion
  presence: Positive
  description: >-
    Blood pressure fails to rise with exertion, so exercise provokes hypotension and
    syncope rather than being tolerated.
  effect: Provokes exertional hypotension and syncope.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:16722595
    reference_title: "Dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Children with DβH deficiency exhibit reduced ability to exercise because of blood pressure inadaptation with exertion and syncope."
    explanation: Exertion is not matched by a pressor response, giving syncope.
  influences_mechanisms:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Exercise vasodilates muscle beds and normally recruits sympathetic vasoconstriction
      elsewhere; that arm is missing, so blood pressure falls instead of rising.
    evidence:
    - reference: PMID:16722595
      reference_title: "Dopamine beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Children with DβH deficiency exhibit reduced ability to exercise because of blood pressure inadaptation with exertion and syncope."
      explanation: Names the failure of blood-pressure adaptation to exertion as the reason exercise is not tolerated.
- name: Ephedrine administration
  presence: Positive
  description: >-
    Ephedrine acts largely indirectly, by displacing stored noradrenaline. With no
    noradrenaline in the vesicles there is nothing to release, and in two DBH-deficient
    siblings it lowered blood pressure instead of raising it.
  effect: Paradoxical hypotension rather than a pressor response.
  exposure_term:
    preferred_term: exposure to ephedrine
    term:
      id: ECTO:9000548
      label: exposure to (-)-ephedrine
  evidence:
  - reference: PMID:2795065
    reference_title: "The effect of orthostatic hypotension on cerebral blood flow and middle cerebral artery velocity in autonomic failure, with observations on the action of ephedrine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings with orthostatic hypotension secondary to dopamine-beta-hydroxylase deficiency also had preserved cerebral autoregulation, but ephedrine led to paradoxical hypotension in these patients."
    explanation: Direct observation of paradoxical hypotension on ephedrine in two DBH-deficient siblings.
  influences_mechanisms:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      An indirectly acting sympathomimetic has no transmitter to release in these
      patients, and worsens rather than corrects the pressor failure.
    evidence:
    - reference: PMID:2795065
      reference_title: "The effect of orthostatic hypotension on cerebral blood flow and middle cerebral artery velocity in autonomic failure, with observations on the action of ephedrine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two siblings with orthostatic hypotension secondary to dopamine-beta-hydroxylase deficiency also had preserved cerebral autoregulation, but ephedrine led to paradoxical hypotension in these patients."
      explanation: The drug lowered blood pressure in DBH deficiency, the opposite of its effect in the other autonomic-failure patients studied.

treatments:
- name: Droxidopa
  description: >-
    L-threo-3,4-dihydroxyphenylserine (L-DOPS) is decarboxylated by aromatic L-amino
    acid decarboxylase directly to noradrenaline, bypassing DBH. It is taken up by
    sympathetic neurons and released on nerve stimulation, restoring sympathetic
    control. Doses of 400 to 1800 mg/day in 2 to 3 doses (rarely more than 1200 mg)
    give an almost immediate and sustained response; in children 2 mg/kg/day is
    titrated towards 5 to 10 mg/kg/day. The last dose is taken well before bedtime.
    Plasma noradrenaline rises but seldom normalises, adrenaline mostly stays
    undetectable, and orthostatic hypotension usually persists in milder form.
    Continuing it in pregnancy appears safe on limited data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: droxidopa
      term:
        id: CHEBI:31524
        label: droxidopa
  target_mechanisms:
  - target: Blocked Noradrenaline Synthesis
    treatment_effect: BYPASSES
    description: Supplies noradrenaline by a DBH-independent route.
    evidence:
    - reference: PMID:3149290
      reference_title: "d,l-threo-3,4-dihydroxyphenylserine restores sympathetic control and cures orthostatic hypotension in dopamine beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Acting as an alternative substrate for ALAAD in the production of noradrenaline, DOPS is taken up by the neuron, restoring sympathetic control and thereby curing the orthostatic hypotension in DBH deficiency."
      explanation: Mechanism of droxidopa in DBH deficiency.
  - target: Neurogenic orthostatic hypotension
    treatment_effect: INHIBITS
    description: Raises standing blood pressure and abolishes or reduces orthostatic symptoms.
    evidence:
    - reference: PMID:2890806
      reference_title: "Endogenous restoration of noradrenaline by precursor therapy in dopamine-beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dose-dependent increases in blood pressure were obtained over the range 150-600 mg. After 600 mg mean arterial pressure rose 33 and 19 mm Hg and these rises were tightly correlated with an increase in plasma noradrenaline (r = 0.995, p less than 0.001 and r = 0.88, p less than 0.05)."
      explanation: Single-blind placebo-controlled dose-response in two patients.
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When exact blood pressure measurements were available for analysis, all patients (n = 7) still fulfilled the criteria for orthostatic hypotension during treatment in the great majority of measurements, with a mean systolic (supine minus standing) difference of 38 mm Hg (range 8‐60) and a mean diastolic difference of 21 mm Hg (range 4‐40)."
      explanation: Orthostatic hypotension is reduced but persists on treatment.
  - target: Exercise intolerance
    treatment_effect: INHIBITS
    description: Restores standing time and exercise capacity.
    evidence:
    - reference: PMID:2890806
      reference_title: "Endogenous restoration of noradrenaline by precursor therapy in dopamine-beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Standing time (a correlate of functional capacity) also increased significantly in both patients. No side-effects were noted."
      explanation: Improved standing time.
  - target: Ptosis
    treatment_effect: INHIBITS
    description: Ptosis improves in some patients but often persists.
    evidence:
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Mild ptosis persisted under L‐DOPS treatment (reported in 7 patients)."
      explanation: Ptosis frequently does not resolve with droxidopa.
  - target: Kidney Dysfunction of Uncertain Mechanism
    treatment_effect: INHIBITS
    description: Kidney function improved in only a minority.
    evidence:
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "With L‐DOPS treatment, there was an improvement of kidney function in only three patients."
      explanation: Renal impairment mostly persists.
  - target: Insulin resistance
    treatment_effect: INHIBITS
    description: Metabolic abnormalities were not corrected in the one patient studied.
    evidence:
    - reference: PMID:27778639
      reference_title: "Hyperinsulinemia and Insulin Resistance in Dopamine β-Hydroxylase Deficiency."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "These metabolic derangements were not corrected by chronic droxidopa treatment."
      explanation: Droxidopa did not correct hyperinsulinaemia or insulin resistance.
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Doses ranged from 400 to 1800 mg/day, given in 2 to 3 doses. For the Dutch cohort, treatment follow‐up ranged from 1 to 21 years (median 13 years; Table 2). Treatment response was favorable and sustained in all patients"
    explanation: Dosing and long-term response.
  - reference: PMID:8801271
    reference_title: "Total norepinephrine spillover, muscle sympathetic nerve activity and heart-rate spectral analysis in a patient with dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 5 months treatment with L-threo-3,4-dihydroxyphenylserine (DOPS) in the D beta H deficiency patient there was a dramatic clinical improvement with resolution of the orthostatic symptoms, dramatic reduction in MSNA activity at rest, and return of plasma norepinephrine, norepinephrine spillover, DHPG and MHPG to within the normal range, indicating intraneuronal production of norepinephrine."
    explanation: Restoration of sympathetic physiology on droxidopa.
  - reference: PMID:9603211
    reference_title: "Restoration of norepinephrine and reversal of phenotypes in mice lacking dopamine beta-hydroxylase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is noteworthy that NE can be restored to normal levels in many tissues after a single injection of the synthetic amino acid precursor of NE, L-threo-3,4-dihydroxyphenylserine (DOPS)."
    explanation: Noradrenaline restoration in Dbh-null mice.
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pregnancy management: Routine blood pressure monitoring during pregnancy and delivery, with adjustment of droxidopa dosage as needed"
    explanation: GeneReviews advises blood pressure monitoring through pregnancy and delivery, adjusting the droxidopa dose as needed.

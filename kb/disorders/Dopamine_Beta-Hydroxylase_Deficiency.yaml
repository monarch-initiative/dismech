notes: >-
  The 2004 review PMID:15240410 describes the disorder as autosomal dominant; every
  molecular study and GeneReviews establish autosomal recessive inheritance, so that
  review is not cited for inheritance. Joint hypermobility, high palate and
  brachydactyly are reported repeatedly but have no proposed link to the
  noradrenergic defect, so they are left unwired in the pathograph. Common DBH
  promoter and coding variants that affect plasma enzyme activity are not associated
  with pure autonomic failure or multiple system atrophy (PMID:12833405).

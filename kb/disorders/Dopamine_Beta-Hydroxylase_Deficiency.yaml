      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The hypotension may be so severe that clonic seizures supervene."
      explanation: Orthostatic hypotension severe enough to cause hypoperfusion seizures.
  - target: Exercise intolerance
    causal_link_type: DIRECT

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging scans of the brain revealed that the patients had a smaller total brain volume than the control group, which is in line with the recent hypothesis that norepinephrine has a neurotrophic effect."

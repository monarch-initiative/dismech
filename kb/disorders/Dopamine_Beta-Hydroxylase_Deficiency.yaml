  biological_scale: TISSUE
  description: >-
    Brain noradrenaline is absent and dopamine is raised in cerebrospinal fluid.
    Despite this, cognition is largely normal, sleep architecture is only modestly
    altered (more slow-wave sleep, somewhat less REM sleep that rises on
    droxidopa), and central control of sympathetic outflow is preserved, suggesting
    compensation by other transmitters. Total brain volume was smaller than in
    controls in one study.

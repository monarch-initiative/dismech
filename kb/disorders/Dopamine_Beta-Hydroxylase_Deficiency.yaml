    explanation: Count of unique published patients before adding three unpublished Dutch patients.
progression:
- phase: Neonatal and infancy
  age_range: Birth to 1 year
  notes: >-
    The perinatal period is often complicated by hypotension, hypothermia,
    hypoglycaemia, vomiting, dehydration and muscle hypotonia, sometimes with delayed
    eye opening. Some infants are born preterm. Survivors may then cope relatively
    well for several years.
  evidence:
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the perinatal period, DBH deficiency has been complicated by vomiting, dehydration, hypotension, hypothermia, and hypoglycemia requiring repeated hospitalization"
    explanation: GeneReviews summary of the neonatal presentation.
  - reference: PMID:1677640
    reference_title: "Dopamine beta-hydroxylase deficiency. A genetic disorder of cardiovascular regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neonates with DBH deficiency have had episodic hypothermia, hypoglycemia, and hypotension, but survivors sometimes cope relatively well until late childhood when overwhelming orthostatic hypotension profoundly limits their activities."
    explanation: Neonatal crises followed by a relatively compensated early childhood.
- phase: Childhood onset of orthostatic intolerance
  age_range: 1 to 12 years
  notes: >-
    Orthostatic complaints (reduced standing time, light-headedness, fainting and
    exercise intolerance) begin in early childhood in most patients. Diagnosis is
    nonetheless usually delayed to adulthood.
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthostatic complaints (mostly described as reduced standing time, lightheadedness, fainting spells, and exercise intolerance) started in early childhood (1‐4 years of age) in the majority of patients (n = 18), at school age (4‐12 years) in four patients"
    explanation: Age at onset of orthostatic symptoms across 25 patients.
- phase: Adolescent worsening and adult disease
  age_range: Adolescence onward
  notes: >-
    Symptoms worsen in adolescence and early adulthood, with profound orthostatic
    hypotension, severely limited exercise tolerance, ptosis, nasal congestion and
    sexual dysfunction. Falls and syncope are the main later morbidity. Median age at
    diagnosis is 24 years (range 13 to 73).
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthostatic symptoms became more severe during adolescence in 11 patients."
    explanation: Adolescent worsening in the pooled cohort.
  - reference: PMID:16722595
    reference_title: "Dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Later evolution seems to be marked by progressive orthostatic hypotension with limitation in standing tolerance, limited ability to exercise and traumatic morbidity related to falls and syncope."
    explanation: Long-term course in untreated patients.
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age of diagnosis of DBH‐deficiency was 24 years (range 13‐73, SD 13.5)."
    explanation: Documents the long diagnostic delay.
- phase: Treated course on droxidopa
  notes: >-
    Droxidopa gives a sustained subjective response over follow-up of up to 21
    years, but blood pressure, catecholamines, kidney function, anaemia and
    hypomagnesaemia improve only partially, and mild ptosis often persists. Early
    deaths have been reported, including one at 28 years with suspected cardiac
    arrhythmia.
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjective response to L‐DOPS treatment is excellent and sustained, although the neurotransmitter profile in plasma does not normalize completely. Furthermore, orthostatic hypotension as well as renal function, anemia, and hypomagnesaemia improve only partially."
    explanation: Long-term treated course in the Dutch cohort.
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This man had a severe phenotype with frequent syncopes from early childhood, and died at age 28 years after maximum 4 years of L‐DOPS treatment."
    explanation: Reported early death despite treatment.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated patients cannot stand for more than short periods, have very limited
    exercise capacity and suffer recurrent syncope, falls and orthostatic seizures,
    often misdiagnosed for years as epilepsy or other conditions. Droxidopa restores
    near-normal daily function, so the burden is largely one of delayed diagnosis.
  evidence:
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "By early adulthood, individuals have profound orthostatic hypotension, greatly reduced exercise tolerance, ptosis, and nasal stuffiness."
    explanation: Functional burden in untreated adults.
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quality of life was not objectively recorded by questionnaires, but a great and continuous improvement in overall functioning was reported by all patients, for example, becoming able to work‐full time and to do sports."
    explanation: The burden is largely reversible with treatment.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic DBH variants, most often compound heterozygous. Parents are
    asymptomatic carriers.
  evidence:
  - reference: PMID:11857564
    reference_title: "Mutations in the dopamine beta-hydroxylase gene are associated with human norepinephrine deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that NE deficiency is an autosomal recessive disorder resulting from heterogeneous molecular lesions at DBH."
    explanation: First molecular study establishing recessive inheritance.
  - reference: ORPHA:230
    reference_title: "Dopamine beta-hydroxylase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet inheritance field.
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "DBH deficiency is inherited in an autosomal recessive manner."
    explanation: GeneReviews genetic counseling section states the mode of inheritance.
  - reference: PMID:20301647
    reference_title: "Dopamine Beta-Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: Recessive sib recurrence risks, with carriers asymptomatic.
genetic:
- name: DBH
  gene_term:
    preferred_term: DBH
    term:
      id: hgnc:2689
      label: DBH
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in DBH (9q34.2). Ten pathogenic variants are
    known. The intron 1 splice-donor variant c.339+2T>C (IVS1+2T>C) is found in most
    patients, homozygous or in trans with a missense variant. The common promoter
    variant -1021C>T causes very low plasma DBH activity in about 4% of healthy
    people without any noradrenaline deficiency, so low plasma enzyme activity alone
    is not diagnostic.
  variants:
  - name: c.339+2T>C
    description: >-
      Intron 1 splice-donor variant (also reported as IVS1+2T>C) causing aberrant
      splicing and a premature stop codon. The most frequent pathogenic allele.
    evidence:
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most frequently reported pathogenic variant (19 patients total, seven homozygous) is the intronic mutation c.339+2T>C (also reported as IVS1+2T>C) leading to aberrant splicing."
      explanation: Frequency of the recurrent splice variant.
    - reference: PMID:11857564
      reference_title: "Mutations in the dopamine beta-hydroxylase gene are associated with human norepinephrine deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Each carries one copy of a T-->C transversion in the splice donor site of DBH intron 1, creating a premature stop codon."
      explanation: Original description of the splice-site variant.
  evidence:
  - reference: PMID:11857564
    reference_title: "Mutations in the dopamine beta-hydroxylase gene are associated with human norepinephrine deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report identification of seven novel variants including four potentially pathogenic mutations in the human DBH gene (OMIM 223360) from analysis of two unrelated patients and their families. Both patients are compound heterozygotes for variants affecting expression of DBH protein."
    explanation: First identification of DBH mutations in patients.
  - reference: ORPHA:230
    reference_title: "Dopamine beta-hydroxylase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DBH | dopamine beta-hydroxylase | hgnc:2689 | Disease-causing germline mutation(s) in"
    explanation: Orphanet gene-disease association.
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "plasma DBH enzyme activity is absent in 4 % of the healthy population due to a specific variant (−1021C>T) of the DBH gene, leading to pseudodeficiency with normal levels of plasma norepinephrine."
    explanation: Pseudodeficiency caveat for enzyme-activity testing.
pathophysiology:
- name: Biallelic DBH Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic DBH variants abolish dopamine beta-hydroxylase protein or activity.
    DBH enzyme activity is absent or severely reduced in plasma and cerebrospinal
    fluid of every patient tested.
    In transfected cells the common splice-donor allele produces no detectable
    protein, and the missense alleles tested produce protein that is trapped in the
    endoplasmic reticulum instead of reaching secretory vesicles.
  genes:
  - preferred_term: DBH
    term:
      id: hgnc:2689
      label: DBH
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: dopamine beta-monooxygenase activity
    modifier: DECREASED
    term:
      id: GO:0004500
      label: dopamine beta-monooxygenase activity
  evidence:
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DBH enzyme activity in plasma was reported in 18 patients and absent or severely decreased in all (Table S1). In three patients, DBH enzyme activity was tested in CSF and also absent there."
    explanation: Loss of enzyme activity in every patient tested.
  - reference: PMID:21209083
    reference_title: "Norepinephrine deficiency is caused by combined abnormal mRNA processing and defective protein trafficking of dopamine beta-hydroxylase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the IVS1+2T→C mutation results in a non-detectable level of DBH protein production and that all three missense mutations tested lead to the DBH protein being trapped in the endoplasmic reticulum (ER)."
    explanation: In vitro expression shows two routes to loss of function, absent protein for the splice allele and endoplasmic reticulum retention for missense alleles.
  downstream:
  - target: Blocked Noradrenaline Synthesis
    causal_link_type: DIRECT
    description: Without DBH, dopamine cannot be beta-hydroxylated to noradrenaline.
    evidence:
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "A gene transcript is present in (nor)adrenergic neurosecretory vesicles in the central and peripheral nervous system, the retina, and chromaffin cells of the adrenal medulla, where the enzyme DBH (EC 1.14.17.1) converts dopamine to norepinephrine."
      explanation: Locates the enzyme and the reaction it catalyses.
- name: Blocked Noradrenaline Synthesis
  biological_scale: MOLECULAR
  description: >-
    Noradrenaline, and therefore adrenaline, cannot be made in central noradrenergic
    neurons, peripheral sympathetic neurons or adrenal chromaffin cells.
    Noradrenaline, adrenaline and their metabolites are undetectable in plasma, urine
    and cerebrospinal fluid.
  cell_types:
  - preferred_term: noradrenergic neuron
    term:
      id: CL:0008025
      label: noradrenergic neuron
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  - preferred_term: adrenal chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  biological_processes:
  - preferred_term: norepinephrine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042421
      label: norepinephrine biosynthetic process
  chemical_entities:
  - preferred_term: noradrenaline
    modifier: DECREASED
    term:
      id: CHEBI:33569
      label: noradrenaline
  evidence:
  - reference: PMID:2880016
    reference_title: "Congenital dopamine-beta-hydroxylase deficiency. A novel orthostatic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Noradrenaline and adrenaline were undetectable in plasma, urine, and cerebrospinal fluid (CSF), but dopamine was 7-fold to 12-fold normal in plasma, 4-fold normal in urine, and 20-fold normal in CSF."
    explanation: Absent noradrenaline and adrenaline in every body fluid in the first described patient.
  - reference: PMID:1677640
    reference_title: "Dopamine beta-hydroxylase deficiency. A genetic disorder of cardiovascular regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dopamine beta-hydroxylase (DBH) deficiency is a genetic disorder in which affected patients cannot synthesize norepinephrine, epinephrine, and octopamine in either the central nervous system or the peripheral autonomic neurons."
    explanation: Synthesis failure in both central and peripheral neurons.
  downstream:
  - target: Dopamine Accumulation and Release as False Transmitter
    causal_link_type: DIRECT
    description: The substrate dopamine accumulates in noradrenergic vesicles and is released in place of noradrenaline.
    evidence:
    - reference: PMID:16722595
      reference_title: "Dopamine beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "whatever the nature of the mutations leading to DβH enzyme inactivity, the consequence in patients is a large accumulation of dopamine, the precursor of noradrenaline, in sympathetic nerves."
      explanation: Dopamine accumulates because its conversion is blocked.
  - target: Sympathetic Noradrenergic Neurotransmission Failure
    causal_link_type: DIRECT
    description: Sympathetic terminals have no noradrenaline to release onto vascular and visceral targets.
    evidence:
    - reference: PMID:2890807
      reference_title: "Effect of unnatural noradrenaline precursor on sympathetic control and orthostatic hypotension in dopamine-beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data demonstrate that in congenital dopamine-beta-hydroxylase deficiency dopamine instead of noradrenaline is released as the sympathetic neurotransmitter but that the integrity of the sympathetic neuron is otherwise intact."
      explanation: The defect is the missing transmitter, not the neuron.
  - target: Absent Adrenomedullary Adrenaline Secretion
    causal_link_type: DIRECT
    description: Chromaffin cells cannot make noradrenaline, the substrate for adrenaline.
    evidence:
    - reference: PMID:3291893
      reference_title: "Patients with congenital dopamine beta-hydroxylase deficiency. A lesson in catecholamine physiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The syndrome is characterized by noradrenergic denervation, adrenomedullary failure, but intact baroreflex afferents, cholinergic innervation, and adrenocortical function."
      explanation: Adrenomedullary failure alongside noradrenergic failure.
  - target: Central Noradrenergic Deficiency
    causal_link_type: DIRECT
    description: Brain noradrenergic neurons also lack noradrenaline.
    evidence:
    - reference: PMID:2300263
      reference_title: "Dopamine-beta-hydroxylase deficiency in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There is isolated deficiency of norepinephrine in both central and peripheral neurons, which contain and release dopamine instead."
      explanation: Central as well as peripheral deficiency.
- name: Dopamine Accumulation and Release as False Transmitter
  biological_scale: CELLULAR
  description: >-
    Dopamine is raised 5- to 20-fold in plasma and cerebrospinal fluid and is
    released from sympathetic terminals on standing, exercise or tyramine, where
    noradrenaline would normally appear. Plasma L-DOPA is also raised, consistent with
    upstream induction of tyrosine hydroxylase. Excess dopamine has its own effects:
    it suppresses prolactin and promotes renal sodium loss.
  cell_types:
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  chemical_entities:
  - preferred_term: dopamine
    modifier: INCREASED
    term:
      id: CHEBI:18243
      label: dopamine
  evidence:
  - reference: PMID:2880016
    reference_title: "Congenital dopamine-beta-hydroxylase deficiency. A novel orthostatic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physiological and pharmacological stimuli of sympathetic neurotransmitter release caused increases in plasma dopamine rather than plasma noradrenaline."
    explanation: Dopamine is released in place of noradrenaline.
  - reference: PMID:33034372
    reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dopamine further increased on standing position in seven patients, and remained extremely high without further increase in one."
    explanation: Orthostatic dopamine release in the pooled cohort.
  - reference: PMID:3291893
    reference_title: "Patients with congenital dopamine beta-hydroxylase deficiency. A lesson in catecholamine physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosine hydroxylase is probably induced in this syndrome, since plasma levels of L-DOPA were also elevated."
    explanation: Upstream catecholamine synthesis is increased.
  downstream:
  - target: Reduced circulating prolactin
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Dopamine is the physiological inhibitor of pituitary prolactin release.
    evidence:
    - reference: PMID:3291893
      reference_title: "Patients with congenital dopamine beta-hydroxylase deficiency. A lesson in catecholamine physiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypoprolactinemia, reduced REM sleep, increased slow wave sleep and sodium loss, despite low blood pressure, are further evidence for the biological role of dopamine in man."
      explanation: Attributes hypoprolactinaemia to excess dopamine.
  - target: Renal Tubular Dopamine Excess
    causal_link_type: DIRECT
    hypothesis_groups:
    - renal_dopamine_toxicity
    description: Very high dopamine reaches proximal tubular cells.
    evidence:
    - reference: PMID:33034372
      reference_title: "Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A potential damaging factor to the kidneys, which is quite unique to patients with DBH‐deficiency, is the very high level of dopamine intracellularly in the proximal tubular cells."
      explanation: Proposes intracellular tubular dopamine as the renal insult.
- name: Sympathetic Noradrenergic Neurotransmission Failure
  biological_scale: CELLULAR
  description: >-
    Sympathetic postganglionic neurons are present and fire normally, and their
    central reflex control is intact, but they release no noradrenaline. Muscle
    sympathetic nerve activity is high at rest and rises normally with tilt, the
    opposite of the absent nerve traffic in pure autonomic failure. Cholinergic
    sympathetic (sweating) and parasympathetic functions are preserved.
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:2295511
    reference_title: "Reflex control of sympathetic nerve activity in dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At rest, sympathetic nerve activity was abundant and was modulated in a normal manner by handgrip (+278%), the cold pressor test (+169%), hypotension induced with isoproterenol (+102%), and hypertension induced with phenylephrine (-85%)."
    explanation: Microneurography shows intact, reflexively modulated sympathetic outflow.
  - reference: PMID:8801271
    reference_title: "Total norepinephrine spillover, muscle sympathetic nerve activity and heart-rate spectral analysis in a patient with dopamine beta-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our subject with D beta H deficiency had a high resting nerve firing rate (40.3 bursts/min) compared with the mean value in normal controls (19.3 bursts/min), and an appropriate increase in nerve firing rate during tilt. Total body norepinephrine spillover at rest was very low, 38 ng/min, compared with age-matched normals (519 +/- 43.3 ng/min, mean +/- SEM), and epinephrine secretion was undetectable."
    explanation: High nerve traffic with almost no noradrenaline spillover.
  - reference: PMID:23622564
    reference_title: "Pediatric ptosis as a sign of treatable autonomic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Parasympathetic and sympathetic cholinergic functions remain intact while sympathetic noradrenergic functions are affected."
    explanation: Selectivity of the deficit.
  - reference: PMID:27237083
    reference_title: "Skin biopsy and microneurography disclose selective noradrenergic dysfunction due to dopamine-β-hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These tests disclosed a selective peripheral adrenergic dysfunction demonstrating the possibility to ascertain DβH deficiency."
    explanation: Skin biopsy and microneurography confirm a selective adrenergic deficit.
  downstream:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    causal_link_type: DIRECT
    description: Without noradrenaline, sympathetic bursts cannot constrict resistance and capacitance vessels on standing.
    evidence:
    - reference: PMID:16722595
      reference_title: "Dopamine beta-hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Orthostatic hypotension is profound, and blood pressure does not increase as expected during usual tests such as Valsalva manoeuvre (phase IV), isometric handgrip or cold exposure."
      explanation: Pressor reflexes fail despite intact afferents and efferent firing.
  - target: Ptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of noradrenergic tone to the sympathetically innervated superior tarsal (Muller) muscle lowers the upper eyelid.
    evidence:
    - reference: PMID:23622564
      reference_title: "Pediatric ptosis as a sign of treatable autonomic dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The ophthalmologic findings of the patients in this case series documented mild ptosis and striking orthostatic reductions in intraocular pressure and mean arterial blood pressure, as might be expected with a lack of intrinsic sympathetic function."
      explanation: Authors attribute ptosis to absent sympathetic function.
    - reference: PMID:9603211
      reference_title: "Restoration of norepinephrine and reversal of phenotypes in mice lacking dopamine beta-hydroxylase."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Ptosis and reductions in male fertility, hind-limb extension, postdecapitation convulsions, and uncoupling protein expression in dopamine beta-hydroxylase-deficient mice are all reversed by DOPS injection."
      explanation: Ptosis in Dbh-null mice reverses when noradrenaline is restored, tying it to noradrenaline loss.
  - target: Nasal congestion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of noradrenergic vasoconstriction of nasal venous sinusoids.
    evidence:
    - reference: PMID:20301647
      reference_title: "Dopamine Beta-Hydroxylase Deficiency."
      supports: SUPPORT

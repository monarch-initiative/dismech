animal_models:
- name: Dbh knockout mouse
  species: Mouse
  genotype: Dbh-/- (targeted disruption)
  description: >-
    Mice lacking Dbh cannot make noradrenaline or adrenaline. Most homozygous
    embryos die in utero unless the mother supplies catecholamines or receives
    droxidopa. Survivors are hypotensive with ptosis, hyperinsulinaemia, low glucose,
    impaired T-cell immunity to infection and increased seizure susceptibility, and
    most phenotypes reverse with droxidopa or a human DBH transgene.
  publication: PMID:7715704
  modeled_mechanisms:
  - target: Blocked Noradrenaline Synthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Complete loss of noradrenaline and adrenaline synthesis with dopamine excess.
    limitations: >-
      Embryonic lethality in mice is far more severe than in humans, where
      maternal catecholamines or other compensation allow survival.
    evidence:
    - reference: PMID:7715704

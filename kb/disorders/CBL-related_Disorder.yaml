disease_term:
  preferred_term: CBL-related disorder
  description: >-
    An autosomal dominant RASopathy caused by germline CBL variants that impair
    E3-ubiquitin-ligase-mediated termination of receptor tyrosine kinase
    signaling, producing a Noonan-like developmental phenotype with
    predisposition to juvenile myelomonocytic leukemia and vasculopathy.
  term:
    id: MONDO:0013308
    label: CBL-related disorder
pathophysiology:
- name: Germline CBL RING-Linker Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline variant in CBL, most often a missense change altering
    an evolutionarily conserved residue in the RING finger domain or in the
    linker connecting that domain to the N-terminal tyrosine kinase binding
    domain. This is the same region mutated somatically in myeloid malignancies;
    p.Tyr371His is the recurrent hot-spot allele. Splice-site changes, an
    in-frame deletion, and a nonsense change generating a v-Cbl-like truncated
    protein have also been reported.
  genes:
  - preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  evidence:
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were missense changes altering evolutionarily conserved residues
      located in the RING finger domain or the linker connecting this domain to
      the N-terminal tyrosine kinase binding domain, a known mutational hot spot
      in myeloid malignancies.
    explanation: >-
      Establishes the germline variant class and its localization to the
      RING/linker mutational hot spot.
  - reference: PMID:25952305
    reference_title: "Molecular Diversity and Associated Phenotypic Spectrum of Germline CBL Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, two splice-site changes, one in-frame deletion, and one
      missense mutation affected the RING domain and/or the adjacent linker
      region, overlapping cancer-associated defects.
    explanation: >-
      Extends the germline allelic spectrum beyond missense while confirming the
      same RING/linker localization.
  downstream:
  - target: Loss of CBL E3 Ubiquitin Ligase Activity
    description: >-
      RING/linker variants disrupt the domain that recruits the E2
      ubiquitin-conjugating enzyme, abolishing ligase function.
    evidence:
    - reference: PMID:28343148
      reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both mutations were predicted to alter the ubiquitin ligase activity of
        the CBL protein that acts as a negative regulator of the RAS pathway.
      explanation: >-
        Links the germline variant directly to predicted loss of ubiquitin ligase
        function.
- name: Loss of CBL E3 Ubiquitin Ligase Activity
  biological_scale: MOLECULAR
  description: >-
    Mutant CBL protein loses E3 ubiquitin ligase activity. Critically, the effect
    is not a simple haploinsufficiency: mutant CBL also inhibits the ligase
    activity of residual wild-type CBL and of the paralogue CBL-B, so a single
    heterozygous allele already prolongs tyrosine kinase activation after
    cytokine stimulation.
  genes:
  - preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19620960
    reference_title: "Gain-of-function of mutated C-CBL tumour suppressor in myeloid neoplasms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      C-CBL mutants did not have E3 ubiquitin ligase activity, but inhibited that
      of wild-type C-CBL and CBL-B (also known as CBLB), leading to prolonged
      activation of tyrosine kinases after cytokine stimulation.
    explanation: >-
      Demonstrates both the loss of ligase activity and its dominant-inhibitory
      action on the remaining wild-type ligases.
  downstream:
  - target: Impaired Receptor Tyrosine Kinase Downregulation
    description: >-
      Without functional Cbl-family ligase activity, activated receptor tyrosine
      kinases are not ubiquitylated and therefore are not sorted for degradation.
    evidence:
    - reference: PMID:20619386
      reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutations were shown to affect CBL-mediated receptor ubiquitylation and
        dysregulate signal flow through RAS.
      explanation: >-
        Directly connects loss of ligase function to impaired receptor
        ubiquitylation and downstream RAS dysregulation.
- name: Impaired Receptor Tyrosine Kinase Downregulation
  biological_scale: MOLECULAR
  description: >-
    Cbl-family ligases are the dominant activation-selective ubiquitin ligases
    for protein tyrosine kinases, targeting activated receptors either for
    endocytic sorting into lysosomes or for proteasomal degradation. When this
    step fails, activated receptors and their signaling intermediates persist at
    the membrane and continue to transmit signal.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  - preferred_term: receptor internalization
    term:
      id: GO:0031623
      label: receptor internalization
    modifier: DECREASED
  - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23085373
    reference_title: "Protein tyrosine kinase regulation by ubiquitination: critical roles of Cbl-family ubiquitin ligases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Structural, biochemical and cell biological studies have established that
      Cbl protein-dependent ubiquitination targets activated PTKs for degradation
      either by facilitating their endocytic sorting into lysosomes or by
      promoting their proteasomal degradation.
    explanation: >-
      Establishes the normal Cbl-dependent receptor-downregulation step whose
      failure underlies the disorder.
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Persistent receptor tyrosine kinase signaling feeds prolonged flow through
      the RAS/RAF/MEK/ERK cascade.
    evidence:
    - reference: PMID:20694012
      reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the common p.371Y>H altered Cbl protein induces cytokine-independent
        growth and constitutive phosphorylation of ERK, AKT and S6 only in
        hematopoietic cells in which normal Cbl expression is reduced by RNA
        interference
      explanation: >-
        Shows constitutive ERK/AKT/S6 phosphorylation downstream of the recurrent
        mutant allele, and that loss of the normal allele is required.
- name: RAS-MAPK Pathway Hyperactivation
  biological_scale: CELLULAR
  description: >-
    The shared final common pathway of the RASopathies: enhanced and prolonged
    signal flow through RAS and the RAF/MEK/ERK cascade (with parallel
    PI3K-AKT-S6 activation), which perturbs proliferation, differentiation, and
    morphogenesis across many tissues.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that germline CBL mutations have developmental, tumorigenic and
      functional consequences that resemble disorders that are caused by
      hyperactive Ras/Raf/MEK/ERK signaling and include neurofibromatosis type 1,
      Noonan syndrome, Costello syndrome, cardiofaciocutaneous syndrome and
      Legius syndrome.
    explanation: >-
      Places CBL-related disorder in the RASopathy family by shared
      Ras/Raf/MEK/ERK hyperactivation.
  downstream:
  - target: Developmental RASopathy Phenotype
    description: >-
      Excess RAS-MAPK signaling during development produces the Noonan-like
      craniofacial, growth, genital, and neurodevelopmental phenotype.
    evidence:
    - reference: PMID:20619386
      reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings document that germline mutations in CBL alter development
        to cause a clinically variable condition that resembles NS and that
        possibly predisposes to malignancies.
      explanation: >-
        Connects germline CBL-driven RAS dysregulation to the developmental
        phenotype.
  - target: Myeloid Progenitor Cytokine Hypersensitivity
    description: >-
      In the hematopoietic compartment, failure to terminate cytokine receptor
      signaling lowers the threshold for progenitor proliferation.
    evidence:
    - reference: PMID:19620960
      reference_title: "Gain-of-function of mutated C-CBL tumour suppressor in myeloid neoplasms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        c-Cbl(-/-) haematopoietic stem/progenitor cells (HSPCs) showed enhanced
        sensitivity to a variety of cytokines compared to c-Cbl(+/+) HSPCs
      explanation: >-
        Mouse hematopoietic stem/progenitor cells lacking c-Cbl are hypersensitive
        to cytokines, supporting the hematopoietic arm of the mechanism.
  - target: Cerebral and Systemic Vasculopathy
    description: >-
      Prolonged RAS pathway signaling is proposed to disrupt cerebrovascular
      development, producing progressive stenosis of the terminal internal
      carotid arteries with collateral vessel formation.
    evidence:
    - reference: PMID:25283271
      reference_title: "Germline mutation of CBL is associated with moyamoya disease in a child with juvenile myelomonocytic leukemia and Noonan syndrome-like disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prolonged RAS pathway signaling may cause disruption of cerebrovascular development."
      explanation: >-
        Proposes the causal link from sustained RAS signaling to the
        cerebrovascular phenotype.
  - target: Lymphatic Developmental Dysregulation
    description: >-
      The RAS/MAPK pathway is a major regulator of lymphangiogenesis; its
      dysregulation produces the prenatal effusion and lymphedema phenotypes
      shared across RASopathies.
    evidence:
    - reference: PMID:25358541
      reference_title: "Hydrops, fetal pleural effusions and chylothorax in three patients with CBL mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These syndromes, collectively called RASopathies, are caused by mutations
        in the RAS/MAPK pathway, which is known to play a major role in
        lymphangiogenesis.
      explanation: >-
        Provides the mechanistic rationale linking RAS/MAPK dysregulation to the
        lymphatic phenotype.
- name: Myeloid Progenitor Cytokine Hypersensitivity
  biological_scale: CELLULAR
  description: >-
    Hematopoietic stem and progenitor cells carrying a mutant CBL allele respond
    to a broader spectrum of cytokines at lower concentrations, and cells in which
    the normal allele is additionally lost acquire outright cytokine-independent
    growth — the proliferative substrate for juvenile myelomonocytic leukemia.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: granulocyte monocyte progenitor cell
    term:
      id: CL:0000557
      label: granulocyte monocyte progenitor cell
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the common p.371Y>H altered Cbl protein induces cytokine-independent growth
      and constitutive phosphorylation of ERK, AKT and S6 only in hematopoietic
      cells in which normal Cbl expression is reduced by RNA interference
    explanation: >-
      Cytokine-independent growth appears specifically in hematopoietic cells and
      requires reduction of the normal allele.
  downstream:
  - target: Acquired 11q Isodisomy and Biallelic CBL Inactivation
    description: >-
      Selective pressure in the hematopoietic compartment favors clones that lose
      the residual wild-type CBL allele by copy-neutral loss of heterozygosity.
    evidence:
    - reference: PMID:20694012
      reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Importantly, JMML specimens from affected children show loss of the normal
        CBL allele through acquired isodisomy.
      explanation: >-
        Documents the acquired second hit in patient leukemia specimens.
- name: Acquired 11q Isodisomy and Biallelic CBL Inactivation
  biological_scale: CELLULAR
  description: >-
    A somatic second hit: acquired segmental uniparental (iso)disomy of chromosome
    11q23, the CBL locus, converts the germline heterozygous variant to
    homozygosity in the affected clone. This is the canonical two-hit step
    separating the germline developmental disorder from overt leukemia, and the
    same mechanism has been documented in CBL-associated teratomas.
  genes:
  - preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  evidence:
  - reference: PMID:19571318
    reference_title: "Mutations in CBL occur frequently in juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a region of 11q isodisomy that contains the CBL gene in
      several JMML samples, and subsequently identified CBL mutations in 27 of 159
      JMML samples
    explanation: >-
      Identifies 11q isodisomy at the CBL locus and quantifies CBL involvement in
      a JMML cohort.
  - reference: PMID:24458550
    reference_title: "Germline CBL mutation associated with a noonan-like syndrome with primary lymphedema and teratoma associated with acquired uniparental isodisomy of chromosome 11q23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy neutral loss of heterozygosity for the CBL mutation due to acquired
      segmental uniparental disomy of 11q23 was observed in three teratomas,
      suggesting a specific association of CBL mutations in germ cell tumor
      predisposition.
    explanation: >-
      Shows the same copy-neutral LOH second-hit mechanism outside the myeloid
      compartment.
  downstream:
  - target: Juvenile Myelomonocytic Leukemia
    description: >-
      Biallelic CBL inactivation in a hematopoietic clone drives the
      myeloproliferative expansion diagnosed as JMML.
    evidence:
    - reference: PMID:19571318
      reference_title: "Mutations in CBL occur frequently in juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we also demonstrate that CBL and RAS/PTPN11 mutations were mutually
        exclusive in these patients
      explanation: >-
        Mutual exclusivity with the other RAS-pathway JMML lesions establishes CBL
        loss as an independent, sufficient JMML driver.
- name: Juvenile Myelomonocytic Leukemia
  biological_scale: ORGANISM
  description: >-
    An aggressive myeloproliferative neoplasm of early childhood arising in the
    hematopoietic stem cell compartment. In CBL-related disorder its natural
    history is distinctive: a substantial proportion of cases regress
    spontaneously without hematopoietic stem cell transplantation, and long-term
    survival without transplant has been documented, although affected
    individuals may later develop vasculitis.
  cell_types:
  - preferred_term: granulocyte monocyte progenitor cell
    term:
      id: CL:0000557
      label: granulocyte monocyte progenitor cell
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals experienced spontaneous regression of their JMML but
      developed vasculitis later in life.
    explanation: >-
      Documents the characteristic spontaneous regression and the later
      vasculitic complication.
  - reference: PMID:26911351
    reference_title: "Adults with germline CBL mutation complicated with juvenile myelomonocytic leukemia at infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that two JMML patients survived >20 years without HSCT and
      both patients had uniparental disomy of 11q23 where CBL is located
    explanation: >-
      Long-term transplant-free survival supports the indolent natural history of
      CBL-mutant JMML.
- name: Cerebral and Systemic Vasculopathy
  biological_scale: TISSUE
  description: >-
    A vascular arm of the disorder that is not part of classic Noonan syndrome:
    progressive stenosis of the terminal internal carotid arteries with abnormal
    deep collateral vessels (moyamoya angiopathy), which may present in infancy,
    plus systemic vasculitis emerging later in life. Notably, moyamoya can be the
    presenting and near-isolated manifestation in individuals who never develop
    JMML and show only subtle RASopathy signs.
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:28343148
    reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two germline de novo mutations in CBL in two out of the four
      trio probands, two girls presenting with an infancy-onset severe MMA.
    explanation: >-
      Establishes germline CBL variants as a cause of infancy-onset moyamoya
      angiopathy.
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals experienced spontaneous regression of their JMML but
      developed vasculitis later in life.
    explanation: >-
      Documents the later-onset systemic vasculitis arm of the vasculopathy.
- name: Lymphatic Developmental Dysregulation
  biological_scale: TISSUE
  description: >-
    Disturbed lymphangiogenesis producing prenatal and postnatal lymphatic
    manifestations — hydrops fetalis, fetal pleural effusions, congenital
    hydrothorax/chylothorax, and primary lymphedema of the lower limbs.
  evidence:
  - reference: PMID:25358541
    reference_title: "Hydrops, fetal pleural effusions and chylothorax in three patients with CBL mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on three unrelated patients with CBL mutations manifesting
      with hydrops fetalis, fetal pleural effusions and/or congenital
      hydro-/chylothorax.
    explanation: >-
      Documents the prenatal lymphatic phenotype in molecularly confirmed CBL
      patients.
- name: Developmental RASopathy Phenotype
  biological_scale: ORGANISM
  description: >-
    The germline developmental consequence of RAS-MAPK hyperactivation: impaired
    growth, developmental delay and other neurological features, cryptorchidism,
    Noonan-like facial dysmorphism, and ectodermal findings such as cafe-au-lait
    macules. Compared with Noonan syndrome caused by other RASopathy genes,
    neurological involvement is relatively frequent while cardiac defects,
    reduced growth, and cryptorchidism are comparatively less prevalent.
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a dominant developmental disorder resulting from germline
      missense CBL mutations, which is characterized by impaired growth,
      developmental delay, cryptorchidism and a predisposition to juvenile
      myelomonocytic leukemia (JMML).
    explanation: >-
      Defines the core developmental phenotype of the disorder.
  - reference: PMID:25952305
    reference_title: "Molecular Diversity and Associated Phenotypic Spectrum of Germline CBL Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype correlation analysis performed on available records
      indicated that germline CBL mutations cause a variable phenotype
      characterized by a relatively high frequency of neurological features,
      predisposition to juvenile myelomonocytic leukemia, and low prevalence of
      cardiac defects, reduced growth, and cryptorchidism.
    explanation: >-
      Quantifies how the CBL phenotype is weighted relative to other RASopathies.

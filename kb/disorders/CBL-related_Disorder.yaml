name: CBL-related Disorder
creation_date: "2026-08-04T00:00:00Z"
description: >-
  CBL-related disorder (CBL syndrome; Noonan syndrome-like disorder with or
  without juvenile myelomonocytic leukemia, NSLL) is an autosomal dominant
  RASopathy caused by heterozygous germline missense, splice-site, or in-frame
  variants in CBL, which encodes a multivalent adaptor protein with E3 ubiquitin
  ligase activity that normally terminates activated receptor tyrosine kinase
  signaling. Pathogenic variants cluster in the RING finger domain and the
  adjacent linker region — the same hot spot mutated somatically in myeloid
  malignancy — and abolish CBL-mediated receptor ubiquitylation while also
  inhibiting residual wild-type CBL and CBL-B, so activated kinases escape
  degradation and signal flow through RAS-MAPK is prolonged. The clinical
  phenotype overlaps Noonan syndrome (facial dysmorphism, impaired growth,
  cryptorchidism, developmental delay and a relatively high frequency of
  neurological features, with a comparatively low prevalence of cardiac defects)
  and is distinguished by two characteristic non-Noonan complications: a strong
  predisposition to juvenile myelomonocytic leukemia (JMML), which arises when
  the wild-type CBL allele is lost through acquired 11q uniparental isodisomy and
  which frequently regresses spontaneously; and a cerebral and systemic
  vasculopathy that includes early-onset moyamoya arteriopathy and later-onset
  vasculitis. Prenatal and lymphatic manifestations (hydrops fetalis, fetal
  pleural effusions, chylothorax, primary lymphedema) further connect the
  disorder to the RASopathy family.
category: Mendelian
parents:
- RASopathy

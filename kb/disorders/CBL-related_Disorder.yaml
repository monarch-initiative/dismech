genetic:
- name: CBL
  gene_term:
    preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  association: Heterozygous germline pathogenic variants (autosomal dominant)
  notes: >-
    CBL encodes a multivalent adaptor protein with E3 ubiquitin ligase activity
    that acts as a tumor suppressor in myeloid malignancy. Germline pathogenic
    variants are typically missense changes in the RING finger domain or adjacent
    linker (recurrent p.Tyr371His), with splice-site, in-frame deletion, and
    v-Cbl-like nonsense alleles also reported. Leukemic and teratomatous tissue
    additionally shows acquired copy-neutral loss of heterozygosity at 11q23,
    converting the germline heterozygous allele to homozygosity.
  evidence:
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent CBL mutations were identified in two sporadic cases and two
      families from among 365 unrelated subjects who had NS or suggestive features
      and were negative for mutations in previously identified disease genes.
    explanation: >-
      Original gene-disease discovery cohort establishing CBL as the disease gene.
inheritance:
- name: Autosomal Dominant
  description: >-
    Autosomal dominant. Both de novo occurrence (including in probands presenting
    with isolated moyamoya) and vertical familial transmission have been
    documented; the germline variant is heterozygous, with tissue-restricted loss
    of the wild-type allele driving the neoplastic complications.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a dominant developmental disorder resulting from germline
      missense CBL mutations
    explanation: States the dominant inheritance pattern of the disorder.
  - reference: PMID:28343148
    reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two germline de novo mutations in CBL in two out of the four
      trio probands
    explanation: Documents de novo occurrence confirmed by trio sequencing.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Very rare. As of the 2015 review of the prenatal phenotype, 25 patients with
    germline CBL mutations had been reported, 20 of whom had JMML — a
    case-ascertainment count, not a population rate, and one biased toward
    hematologic presentation.
  evidence:
  - reference: PMID:25358541
    reference_title: "Hydrops, fetal pleural effusions and chylothorax in three patients with CBL mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, germline mutations in the Casitas B-cell lymphoma (CBL) gene were
      reported in 25 patients and of these, 20 had juvenile myelomonocytic
      leukemia (JMML).
    explanation: Reports the cumulative number of published cases at that time.
- population: Children with juvenile myelomonocytic leukemia
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    CBL lesions (germline and somatic combined) accounted for 27 of 159 JMML
    samples (~17%) in the defining cohort. This is the frequency of CBL
    involvement within JMML, not the frequency of JMML within CBL-related
    disorder.
  evidence:
  - reference: PMID:19571318
    reference_title: "Mutations in CBL occur frequently in juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a region of 11q isodisomy that contains the CBL gene in
      several JMML samples, and subsequently identified CBL mutations in 27 of 159
      JMML samples
    explanation: Quantifies CBL involvement within a JMML cohort.
differential_diagnoses:
- name: Noonan syndrome
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  description: >-
    The principal differential. CBL-related disorder presents with clinical
    features fitting or partially overlapping Noonan syndrome, the most common
    RASopathy, and is resolved by molecular testing. The JMML predisposition and
    the later vasculopathy are characteristic of the CBL phenotype, while cardiac
    defects — a Noonan hallmark — are comparatively uncommon.
  distinguishing_features:
  - A pathogenic CBL variant supports CBL-related disorder, whereas PTPN11, SOS1, RAF1, or RIT1 variants favour classic Noonan syndrome.
  - Predisposition to often self-remitting JMML, and later vasculitis or moyamoya arteriopathy, is characteristic of CBL-related disorder.
  - Cardiac defects, reduced growth, and cryptorchidism are of comparatively low prevalence in the CBL phenotype.
  evidence:
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      can underlie a phenotype with clinical features fitting or partially
      overlapping Noonan syndrome (NS), the most common condition of this disease
      family
    explanation: >-
      Establishes Noonan syndrome as the overlapping differential for CBL-related
      disorder.
  - reference: PMID:25952305
    reference_title: "Molecular Diversity and Associated Phenotypic Spectrum of Germline CBL Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype correlation analysis performed on available records
      indicated that germline CBL mutations cause a variable phenotype
      characterized by a relatively high frequency of neurological features,
      predisposition to juvenile myelomonocytic leukemia, and low prevalence of
      cardiac defects, reduced growth, and cryptorchidism.
    explanation: >-
      Provides the feature weighting that distinguishes the CBL phenotype from
      classic Noonan syndrome.
- name: Moyamoya disease
  disease_term:
    preferred_term: Moyamoya disease
    term:
      id: MONDO:0016820
      label: Moyamoya disease
  description: >-
    In children presenting with early-onset moyamoya angiopathy, CBL-related
    disorder is an important differential for apparently non-syndromic moyamoya
    disease, because CBL-mutated probands may show only subtle RASopathy signs
    and may never develop JMML. This is a diagnostically consequential
    differential rather than a phenotypic look-alike: it changes whether the
    child is entered into hematologic and RASopathy surveillance.
  distinguishing_features:
  - Germline CBL testing is recommended in early-onset moyamoya even when RASopathy features are absent or subtle.
  - A germline CBL variant carries JMML and RASopathy surveillance implications that isolated moyamoya disease does not.
  evidence:
  - reference: PMID:28343148
    reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that CBL gene screening should be considered in
      early-onset moyamoya, even in the absence of obvious signs of RASopathy.
    explanation: >-
      Supports treating CBL-related disorder as a differential in apparently
      isolated early-onset moyamoya.
treatments:
- name: Observation for Spontaneously Regressing JMML
  description: >-
    Because CBL-mutant JMML frequently follows an indolent course with spontaneous
    regression, a watch-and-wait strategy without immediate hematopoietic stem cell
    transplantation is appropriate for many patients; long-term transplant-free
    survival beyond 20 years has been documented. Ongoing hematologic surveillance
    is required, and later vasculitis may still develop.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26911351
    reference_title: "Adults with germline CBL mutation complicated with juvenile myelomonocytic leukemia at infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that two JMML patients survived >20 years without HSCT and
      both patients had uniparental disomy of 11q23 where CBL is located
    explanation: >-
      Supports a non-transplant observation strategy for CBL-mutant JMML.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Reserved for progressive or non-regressing JMML. Transplantation is the
    curative modality for aggressive JMML generally, but carries substantial
    relapse and regimen-related toxicity, which is why the indolent CBL-mutant
    subgroup is often observed instead.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:26911351
    reference_title: "Adults with germline CBL mutation complicated with juvenile myelomonocytic leukemia at infancy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile myelomonocytic leukemia (JMML) appears to be a life-threatening
      disease and showed poor prognosis even after hematopoietic stem cell
      transplantation (HSCT) because of high relapse rate.
    explanation: >-
      Establishes HSCT as the standard JMML modality while documenting its
      limitations, which motivate reserving it for progressive CBL-mutant disease.
- name: Cerebral Revascularization Surgery
  description: >-
    Surgical revascularization is the established management for symptomatic
    moyamoya angiopathy. Because CBL-related moyamoya can be severe and
    infancy-onset — and may present without JMML or obvious RASopathy signs — CBL
    testing is recommended in early-onset moyamoya so that affected children are
    identified and referred.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:28343148
    reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that CBL gene screening should be considered in
      early-onset moyamoya, even in the absence of obvious signs of RASopathy.
    explanation: >-
      Supports the diagnostic/referral recommendation; the abstract does not
      itself report surgical outcomes, so this is marked PARTIAL.
- name: Genetic Counseling
  description: >-
    Genetic counseling for the proband and family, covering autosomal dominant
    inheritance, both de novo and inherited occurrence, and the tumor- and
    vasculopathy-surveillance implications of a germline CBL variant.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
discussions:
- discussion_id: gap_cbl_tumor_risk_beyond_jmml
  prompt: >-
    Beyond juvenile myelomonocytic leukemia, what is the lifetime tumor risk in
    germline CBL-related disorder, and does the acquired 11q23 copy-neutral
    loss-of-heterozygosity mechanism predispose to germ cell tumors as a
    reproducible second tumor class?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Acquired 11q Isodisomy and Biallelic CBL Inactivation
  - pathophysiology#Juvenile Myelomonocytic Leukemia
  rationale: >-
    The same copy-neutral 11q23 LOH second hit that produces JMML has been
    documented in three teratomas from a single patient, which would imply a
    tumor-predisposition mechanism that is not tissue-restricted to the myeloid
    compartment. That observation rests on one case report, so the entry records
    the mechanism without asserting a quantified extra-hematologic tumor risk or
    recommending a surveillance protocol.
  proposed_experiments:
  - experiment_id: exp_cbl_extrahematologic_tumor_surveillance
    name: Prospective tumor surveillance with 11q23 LOH genotyping in a germline-CBL cohort
    description: >-
      Assemble an international registry of individuals with a confirmed germline
      CBL variant and follow them prospectively for any incident neoplasm.
      Genotype every available tumor specimen for copy-neutral loss of
      heterozygosity at 11q23 and for the germline allele, and compare observed
      tumor incidence against age- and sex-matched population rates.
    decision_criterion: >-
      Recurrent non-myeloid tumors carrying the 11q23 second hit at above-background
      incidence would establish a broader tumor-predisposition syndrome and justify
      a surveillance protocol; absence of such tumors across an adequately powered
      cohort would confine the predisposition to the myeloid compartment.
  evidence:
  - reference: PMID:24458550
    reference_title: "Germline CBL mutation associated with a noonan-like syndrome with primary lymphedema and teratoma associated with acquired uniparental isodisomy of chromosome 11q23."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy neutral loss of heterozygosity for the CBL mutation due to acquired
      segmental uniparental disomy of 11q23 was observed in three teratomas,
      suggesting a specific association of CBL mutations in germ cell tumor
      predisposition.
    explanation: >-
      Single-patient evidence proposing, but not establishing, germ cell tumor
      predisposition.
- discussion_id: gap_cbl_phenotype_determinants
  prompt: >-
    What determines which germline CBL carriers develop juvenile myelomonocytic
    leukemia, which develop isolated early-onset moyamoya angiopathy with only
    subtle RASopathy signs, and which regress spontaneously versus progressing to
    require transplantation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Myeloid Progenitor Cytokine Hypersensitivity
  - pathophysiology#Cerebral and Systemic Vasculopathy
  - pathophysiology#Juvenile Myelomonocytic Leukemia
  rationale: >-
    Two probands carrying CBL variants that had previously been reported in
    JMML-predisposing Noonan-like disease instead presented with severe
    infancy-onset moyamoya and never developed leukemia, so allele identity alone
    does not predict which arm of the phenotype manifests. Because the management
    decision that matters most clinically — observe versus transplant — turns on
    this, the absence of a predictor is a substantive gap rather than a
    descriptive one.
  proposed_experiments:
  - experiment_id: exp_cbl_genotype_stratified_natural_history
    name: Genotype-stratified natural history with clonal-architecture sequencing
    description: >-
      Follow germline CBL carriers prospectively with serial blood counts and
      cerebrovascular imaging, stratified by germline allele. In parallel, use
      serial deep sequencing of hematopoietic samples to measure the timing and
      clone size of the acquired 11q23 second hit, and test whether second-hit
      kinetics rather than germline allele identity separate the leukemic,
      spontaneously regressing, and cerebrovascular-predominant courses.
    decision_criterion: >-
      A reproducible association between second-hit timing or clone size and
      subsequent course would support clonal-kinetics-based risk stratification;
      segregation by germline allele instead would support allele-based
      counselling; neither would indicate an unidentified modifier.
  evidence:
  - reference: PMID:28343148
    reference_title: "De novo mutations in CBL causing early-onset paediatric moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the two mutated girls never developed JMML and presented only
      subtle signs of RASopathy that did not lead to evoke this diagnosis during
      follow-up.
    explanation: >-
      Demonstrates that previously JMML-associated germline alleles can present
      with an essentially isolated cerebrovascular phenotype.
  - reference: PMID:25952305
    reference_title: "Molecular Diversity and Associated Phenotypic Spectrum of Germline CBL Mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype correlation analysis performed on available records
      indicated that germline CBL mutations cause a variable phenotype
      characterized by a relatively high frequency of neurological features,
      predisposition to juvenile myelomonocytic leukemia, and low prevalence of
      cardiac defects, reduced growth, and cryptorchidism.
    explanation: >-
      The available genotype-phenotype analysis characterizes the phenotype in
      aggregate but does not resolve per-individual outcome prediction.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  Relationship to neighbouring dismech entries. This entry models the germline
  RASopathy; `Juvenile_Myelomonocytic_Leukemia` already carries a `CBL-associated`
  subtype covering the leukemia that arises in these patients, so the JMML
  pathophysiology node and phenotype here are deliberately scoped to the
  predisposition and its distinctive natural history rather than duplicating JMML
  disease biology. `Noonan_Syndrome` cites CBL among its associated genes; the
  two are kept as separate entries because the CBL phenotype is distinguished by
  JMML predisposition, vasculopathy/moyamoya, and a comparatively low prevalence
  of cardiac defects.

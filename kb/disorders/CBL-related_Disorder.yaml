genetic:
- name: CBL
  gene_term:
    preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  association: Heterozygous Germline Missense Variants
  notes: >-
    CBL (chromosome 11q23.3) encodes a multivalent adaptor protein with E3
    ubiquitin ligase activity. Heterozygous germline missense variants in the
    RING finger domain or the adjacent linker region (a mutational hot spot also
    seen in myeloid malignancies) cause CBL-related disorder. The recurrent
    p.Y371H substitution is a common allele. In JMML, the germline variant is the
    first hit and somatic copy-neutral loss of heterozygosity at 11q23 (acquired
    isodisomy) is the second hit.
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a dominant developmental disorder resulting from germline missense CBL
      mutations, which is characterized by impaired growth, developmental delay,
      cryptorchidism and a predisposition to juvenile myelomonocytic leukemia
    explanation: >-
      Identifies germline missense CBL variants as the cause of this dominant
      developmental disorder.
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were missense changes altering evolutionarily conserved residues
      located in the RING finger domain or the linker connecting this domain to
      the N-terminal tyrosine kinase binding domain, a known mutational hot spot
      in myeloid malignancies.
    explanation: >-
      Localizes the causal germline missense variants to the RING finger /
      linker region of CBL.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CBL-related disorder is inherited in an autosomal dominant pattern;
    heterozygous germline CBL missense variants are sufficient to cause the
    developmental phenotype, with biallelic (second-hit) inactivation required
    only for the JMML.
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a dominant developmental disorder resulting from germline
      missense CBL mutations
    explanation: >-
      Documents the dominant inheritance of the germline CBL developmental
      disorder.
differential_diagnoses:
- name: Noonan syndrome
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  description: >-
    Noonan syndrome is the principal differential: CBL-related disorder presents
    with clinical features fitting or partially overlapping Noonan syndrome, the
    most common RASopathy. Molecular testing identifying a CBL variant (versus
    PTPN11, SOS1, RAF1, RIT1, or other Noonan genes) resolves the distinction,
    and the JMML predisposition with later vasculopathy is characteristic of the
    CBL phenotype.
  distinguishing_features:
  - A pathogenic CBL variant supports CBL-related disorder, whereas PTPN11/SOS1/RAF1/RIT1 variants favor classic Noonan syndrome.
  - Predisposition to (often self-remitting) JMML and later vasculitis/vasculopathy is characteristic of CBL-related disorder.
  evidence:
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      can underlie a phenotype with clinical features fitting or partially
      overlapping Noonan syndrome (NS), the most common condition of this
      disease family.
    explanation: >-
      Establishes Noonan syndrome as the overlapping differential for
      CBL-related disorder.
treatments:
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal dominant recurrence risk and the
    prognostic implications of a confirmed CBL variant, including JMML
    predisposition.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Hematologic Surveillance and Supportive Care
  description: >-
    Because JMML in CBL-related disorder is frequently self-remitting,
    management emphasizes hematologic monitoring and supportive care, reserving
    intensive therapy (e.g., hematopoietic stem cell transplantation) for
    aggressive or progressive disease, alongside multidisciplinary developmental
    support.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

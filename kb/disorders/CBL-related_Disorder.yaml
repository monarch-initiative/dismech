name: CBL-related Disorder
creation_date: '2026-07-12T00:00:00Z'
category: Mendelian
description: >-
  CBL-related disorder (also called "CBL syndrome" or Noonan syndrome-like
  disorder with or without juvenile myelomonocytic leukemia) is an autosomal
  dominant RASopathy caused by heterozygous germline missense variants in CBL,
  which encodes a multivalent adaptor protein and E3 ubiquitin ligase that
  normally down-regulates activated receptor tyrosine kinases. Loss of CBL
  ubiquitin-ligase function impairs receptor down-regulation and dysregulates
  signal flow through the RAS-MAPK pathway, the shared effector abnormality of
  the RASopathies. Clinically it produces a variable Noonan-syndrome-like
  picture - dysmorphic craniofacial features, impaired postnatal growth,
  developmental delay and learning difficulties, cryptorchidism, microcephaly,
  and hyperpigmented (café-au-lait) skin lesions - together with a
  characteristic predisposition to juvenile myelomonocytic leukemia (JMML) and,
  in some individuals, later vasculitis/vasculopathy. JMML in CBL-related
  disorder arises via a two-hit mechanism: the germline CBL variant is the first
  hit and somatic copy-neutral loss of heterozygosity at 11q23 (acquired
  isodisomy removing the normal CBL allele) is the positively selected second
  hit, and the JMML is frequently self-remitting (MONDO:0013308; OMIM:613563;
  CBL). This entry is one of four missing core RASopathy entries requested in
  issue #6206.
parents:
- RASopathies
disease_term:
  preferred_term: CBL-related disorder
  description: >-
    An autosomal dominant RASopathy caused by heterozygous germline missense
    variants in the CBL E3 ubiquitin ligase gene, presenting with a
    Noonan-syndrome-like developmental phenotype and a predisposition to
    juvenile myelomonocytic leukemia.
  term:
    id: MONDO:0013308
    label: CBL-related disorder
pathophysiology:
- name: CBL Loss-of-Function and Impaired E3 Ubiquitin Ligase Activity
  description: >-
    Heterozygous germline missense variants cluster in the RING finger domain of
    CBL (and the linker connecting it to the N-terminal tyrosine-kinase-binding
    domain), the same mutational hot spot seen in myeloid malignancies. CBL is
    an E3 ubiquitin ligase, so these variants impair its ubiquitin-ligase
    function - the molecular starting point of the disorder.
  genes:
  - preferred_term: CBL
    term:
      id: hgnc:1541
      label: CBL
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: Impaired Receptor Tyrosine Kinase Down-Regulation
    description: >-
      Because CBL ubiquitinates activated receptor tyrosine kinases to target
      them for down-regulation, loss of CBL ligase function leaves receptors
      inappropriately active.
    evidence:
    - reference: PMID:20619386
      reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutations were shown to affect CBL-mediated receptor ubiquitylation and
        dysregulate signal flow through RAS.
      explanation: >-
        Demonstrates that CBL variants impair receptor ubiquitylation, the step
        required to down-regulate activated receptor tyrosine kinases.
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CBL encodes a member of the Cbl family of proteins, which functions as an
      E3 ubiquitin ligase.
    explanation: >-
      Establishes CBL as an E3 ubiquitin ligase, the function impaired by
      pathogenic variants.
  - reference: PMID:20619386
    reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were missense changes altering evolutionarily conserved residues
      located in the RING finger domain or the linker connecting this domain to
      the N-terminal tyrosine kinase binding domain, a known mutational hot spot
      in myeloid malignancies.
    explanation: >-
      Localizes the germline missense variants to the RING finger / linker
      region that controls CBL's ubiquitin-ligase activity.
- name: Impaired Receptor Tyrosine Kinase Down-Regulation
  description: >-
    CBL normally controls proliferative signalling by ubiquitinating and
    down-regulating growth-factor (receptor tyrosine kinase) signalling
    cascades. When CBL ligase function is lost, this negative feedback fails and
    receptor-driven signalling persists, feeding forward into the RAS-MAPK
    pathway.
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Sustained receptor signalling from failed CBL-mediated down-regulation
      dysregulates signal flow through RAS, raising downstream MAPK/ERK output.
    evidence:
    - reference: PMID:20619386
      reference_title: "Heterozygous germline mutations in the CBL tumor-suppressor gene cause a Noonan syndrome-like phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutations were shown to affect CBL-mediated receptor ubiquitylation and
        dysregulate signal flow through RAS.
      explanation: >-
        Links impaired CBL-mediated receptor ubiquitylation to dysregulated RAS
        signalling.
  evidence:
  - reference: PMID:20543203
    reference_title: "Germline mutations of the CBL gene define a new genetic syndrome with predisposition to juvenile myelomonocytic leukaemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CBL, an E3 ubiquitin ligase and a multi-adaptor protein, controls
      proliferative signalling networks by downregulating the growth factor
      receptor signalling cascades in various cell types.
    explanation: >-
      Establishes CBL's physiological role in down-regulating growth-factor
      receptor signalling, the control lost in CBL-related disorder.
- name: RAS-MAPK Pathway Hyperactivation
  description: >-
    Failed receptor down-regulation dysregulates RAS and increases downstream
    ERK/MAPK signalling. This is the shared effector abnormality of the
    RASopathies; germline CBL variants produce developmental and tumorigenic
    consequences that resemble other disorders of hyperactive RAS/RAF/MEK/ERK
    signalling.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  downstream:
  - target: Somatic Second Hit and JMML Predisposition
    description: >-
      In hematopoietic cells, biallelic CBL loss produces cytokine-independent
      growth and constitutive activation of ERK/AKT/S6, driving the
      myelomonocytic proliferation of JMML.
    evidence:
    - reference: PMID:20694012
      reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        induces cytokine-independent growth and constitutive phosphorylation of
        ERK, AKT and S6 only in hematopoietic cells in which normal Cbl
        expression is reduced by RNA interference.
      explanation: >-
        Shows that biallelic CBL loss drives cytokine-independent hematopoietic
        growth with constitutive ERK/AKT/S6 activation.
  evidence:
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      germline CBL mutations have developmental, tumorigenic and functional
      consequences that resemble disorders that are caused by hyperactive
      Ras/Raf/MEK/ERK signaling
    explanation: >-
      Frames CBL-related disorder within the hyperactive RAS/RAF/MEK/ERK
      (RAS-MAPK) RASopathy spectrum.
- name: Somatic Second Hit and JMML Predisposition
  description: >-
    JMML in CBL-related disorder follows a two-hit pattern: the germline CBL
    variant is the first hit, and somatic copy-neutral loss of heterozygosity of
    the 11q23 region (acquired isodisomy removing the normal CBL allele) is the
    positively selected second hit in the leukemic clone. The resulting JMML is
    frequently self-remitting, though vasculitis may emerge later.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  downstream:
  - target: Late Vasculitis/Vasculopathy
    description: >-
      Some individuals whose JMML regresses spontaneously subsequently develop
      vasculitis, a recognized late complication of the disorder.
    evidence:
    - reference: PMID:20694012
      reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Some individuals experienced spontaneous regression of their JMML but
        developed vasculitis later in life.
      explanation: >-
        Documents spontaneous JMML regression followed by later-onset
        vasculitis.
  evidence:
  - reference: PMID:20543203
    reference_title: "Germline mutations of the CBL gene define a new genetic syndrome with predisposition to juvenile myelomonocytic leukaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The germline mutation represents the first hit, with somatic loss of
      heterozygosity being the second hit positively selected in JMML cells.
    explanation: >-
      Establishes the germline-first-hit / somatic-second-hit mechanism of JMML
      in CBL-related disorder.
  - reference: PMID:20543203
    reference_title: "Germline mutations of the CBL gene define a new genetic syndrome with predisposition to juvenile myelomonocytic leukaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      copy neutral loss of heterozygosity of the 11q23 chromosomal region,
      encompassing the CBL locus, was demonstrated.
    explanation: >-
      Identifies 11q23 copy-neutral loss of heterozygosity (acquired isodisomy)
      at the CBL locus as the somatic second hit.
  - reference: PMID:20694012
    reference_title: "Germline CBL mutations cause developmental abnormalities and predispose to juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JMML specimens from affected children show loss of the normal CBL allele
      through acquired isodisomy.
    explanation: >-
      Confirms somatic loss of the normal CBL allele via acquired isodisomy in
      JMML specimens.

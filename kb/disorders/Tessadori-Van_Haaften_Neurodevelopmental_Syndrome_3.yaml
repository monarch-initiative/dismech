genetic:
- name: H4C5
  gene_term:
    preferred_term: H4C5
    term:
      id: hgnc:4790
      label: H4C5
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    H4C5 (HIST1H4E) is one of fourteen canonical histone H4 genes that differ at
    the nucleotide level but encode an identical protein. Variant protein
    positions are given in HGVS numbering; the source cohort also uses
    mature-histone numbering, which omits the initiator methionine and is one
    lower (p.Arg46Cys is Arg45Cys).
  gene_disease_validity:
  - validity_classification: STRONG
    classified_by: CLINGEN
    external_id: CGGV:assertion_934ff2db-b242-49d8-968f-08f8eb7b1310-2024-03-19T160000.000Z
    evidence:
    - reference: CGGV:assertion_934ff2db-b242-49d8-968f-08f8eb7b1310-2024-03-19T160000.000Z
      reference_title: "H4C5 / Tessadori-Van Haaften neurodevelopmental syndrome 3 (Strong)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "H4C5 | HGNC:4790 | Tessadori-Van Haaften neurodevelopmental syndrome 3 | MONDO:0030993 | AD | Strong"
      explanation: ClinGen gene-disease validity record classifying this pair as Strong.
  case_fractions:
  - population: Founding pan-H4 neurodevelopmental cohort (Tessadori et al. 2022)
    case_fraction_percent: 58.6
    cohort_size: 29
    notes: >-
      17 of 29 individuals carried H4C5 variants (sum of the H4C5 rows of
      Table 1); the rest carried variants in H4C3, H4C4, H4C6, H4C9 or H4C11.
      This is a discovery-cohort split, not a population estimate.
    evidence:
    - reference: PMID:35202563
      reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we present a cohort of 29 subjects with de novo missense variants in six H4 genes (H4C3, H4C4, H4C5, H4C6, H4C9, and H4C11) identified by whole-exome sequencing and matchmaking."
      explanation: Gives the cohort denominator; the H4C5 count of 17 is the sum of the H4C5 rows of Table 1.
  variants:
  - name: H4C5 p.Arg46Cys (mature-histone Arg45Cys)
    description: >-
      NM_003545.3:c.136C>T, the most recurrent variant in the founding cohort
      (seven individuals). Clinical features and growth varied even among
      individuals with this same variant. In zebrafish it caused a
      dose-dependent developmental effect.
    type: MISSENSE
    evidence:
    - reference: PMID:35202563
      reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variability in clinical features and growth was noted even among the seven individuals harboring the same de novo variant in H4C5 encoding Arg45Cys"
      explanation: Recurrence of the variant and variable expressivity among its carriers.
  - name: H4C5 p.Arg41Cys (mature-histone Arg40Cys)
    description: >-
      NM_003545.3:c.121C>T, carried by four individuals in the founding cohort;
      the same residue change also occurred in H4C11. It did not produce a
      significant effect in the zebrafish assay, and the authors rely on its
      recurrence for pathogenicity.
    type: MISSENSE
    evidence:
    - reference: PMID:35202563
      reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The milder effect observed in our functional assay for variants affecting Pro32 and Arg40 may point to a moderate requirement, however the strong recurrence of variants affecting these residues in our cohort provides alternative evidence to support their pathogenicity."
      explanation: Pathogenicity rests on recurrence rather than the functional assay.
  - name: H4C5 p.Tyr99His (mature-histone Tyr98His)
    description: >-
      NM_003545.4:c.295T>C, de novo in two individuals of the founding cohort and
      in a third child with an Angelman-like presentation, where it was classified
      likely pathogenic. Absent from gnomAD v2.1.1; in silico predictions
      conflicted.
    type: MISSENSE
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:36987712
      reference_title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant met criteria for a likely pathogenic classification and is one of the seven known disease-causing missense variants in H4C5."
      explanation: Classification of the variant in the case report.
    - reference: PMID:36987712
      reference_title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Review of the literature demonstrated that the missense variant has previously been reported in two unrelated individuals"
      explanation: Recurrence of the same variant in unrelated individuals.
  evidence:
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants observed were absent from control databases (1KG, gnomAD v2.1.1)."
    explanation: The cohort variants, including those in H4C5, are absent from population controls.
  - reference: CGGV:assertion_934ff2db-b242-49d8-968f-08f8eb7b1310-2024-03-19T160000.000Z
    reference_title: "H4C5 / Tessadori-Van Haaften neurodevelopmental syndrome 3 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "H4C5 was first reported in relation to autosomal dominant Tessadori-Bicknell-van Haaften neurodevelopmental syndrome 3 (TEVANED3) in 2022"
    explanation: ClinGen summary of the gene-disease relationship.
diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    The diagnosis is made by finding a de novo heterozygous H4C5 missense variant
    on trio exome or genome sequencing. The clinical picture is nonspecific and
    can resemble Angelman syndrome. In the reported Angelman-like case,
    chromosomal microarray, Fragile X testing, methylation-specific MLPA,
    mitochondrial sequencing and an earlier exome were negative before genome
    sequencing found the variant. Brain MRI was generally normal in the founding
    cohort, with delayed myelination in two individuals.
  evidence:
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cohort was collected with trio-based whole-exome sequencing in combination with data sharing via Genematcher 13 and DECIPHER."
    explanation: Ascertainment by trio exome sequencing.
  - reference: PMID:36987712
    reference_title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it suggests that cases of clinically suspected Angelman syndrome without molecular confirmation should undergo exome or genome sequencing"
    explanation: Recommends sequencing in Angelman-like presentations without a molecular diagnosis.
  - reference: PMID:36987712
    reference_title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "molecular genetic testing, which included chromosomal microarray, Fragile X analysis, methylation-specific MLPA for Prader-Willi and Angelman syndromes, exome and mitochondrial sequencing was all negative"
    explanation: Earlier first-line tests did not find the H4C5 variant in this case.
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI was generally normal except for two individuals with delayed myelination."
    explanation: Imaging is not diagnostic.
animal_models:
- name: Zebrafish embryos injected with human H4 variant mRNA
  species: Zebrafish
  genotype: Wild-type embryos microinjected at the one-cell stage with mRNA encoding human histone H4 disease variants, including H4C5 Arg45Cys and Arg40Cys
  publication: PMID:35202563
  description: >-
    Transient mRNA overexpression of wild-type or variant human histone H4 in
    zebrafish, whose H4 protein is identical to human. Embryos were scored at 28
    hours post fertilization for cephalic development, body-axis formation and
    necrosis.
  modeled_mechanisms:
  - target: Disrupted Early Embryonic Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Most H4 variants disturbed early development; H4C5 Arg45Cys did so in a
      dose-dependent way, but H4C5 Arg40Cys had no significant effect.
    limitations: >-
      Transient ectopic overexpression on a wild-type background, not a
      heterozygous germline allele at endogenous dosage. The 28-hour embryo
      reports gross development and cell toxicity, not neurodevelopment or
      cognition. The authors state that a stable model is needed.
    evidence:
    - reference: PMID:35202563
      reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, as their interpretation is limited by their transience and the inherent variability of our current mRNA assay, further testing in a stable model is required to obtain more insight in the molecular mechanisms linking genetic variants and phenotype."
      explanation: The authors' own statement of the model's limits.
references:
- reference: PMID:35202563
  title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
- reference: PMID:36987712
  title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
notes: >-
  Phenotype frequencies come from the founding cohort of 29 individuals with
  variants in six H4 genes, 17 of them in H4C5; the paper found no
  genotype-phenotype pattern by gene and does not report the H4C5 subgroup
  separately. No GeneReviews chapter covers this disorder. No treatment section
  is recorded because no cited source describes management.

name: Tessadori-Van Haaften Neurodevelopmental Syndrome 3
creation_date: "2026-11-05T00:54:37Z"
category: Mendelian
categories:
- Chromatinopathy
- Germline Histonopathy
- Neurodevelopmental Disorder
synonyms:
- TEVANED3
- Tessadori-Bicknell-van Haaften neurodevelopmental syndrome 3
description: >-
  Tessadori-Van Haaften neurodevelopmental syndrome 3 is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous de novo missense variants in
  H4C5 (HIST1H4E), one of the fourteen canonical genes that together encode an
  invariant histone H4 protein. It belongs to a group of H4 syndromes, numbered by
  gene, that share intellectual disability and developmental delay with more
  variable microcephaly, short stature, hypotonia, facial differences, tooth
  anomalies, and visual and hearing impairment. The altered residues cluster at
  H4 surfaces that contact DNA, other histones or histone chaperones, and the
  variants are thought to act through a dominant effect on nucleosomes rather than
  by loss of one gene copy.

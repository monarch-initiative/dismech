inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. Every reported H4C5 variant arose de novo, identified by
    trio exome or genome sequencing. A negative parental test does not exclude
    parental germline mosaicism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_934ff2db-b242-49d8-968f-08f8eb7b1310-2024-03-19T160000.000Z
    reference_title: "H4C5 / Tessadori-Van Haaften neurodevelopmental syndrome 3 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is strong evidence to support the relationship between H4C5 and autosomal dominant TEVANED3."
    explanation: ClinGen classifies the H4C5 relationship under an autosomal dominant mode of inheritance.
  - reference: PMID:36987712
    reference_title: "H4C5 missense variant leads to a neurodevelopmental phenotype overlapping with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome sequencing identified the H4 histone gene variant H4C5 NM_003545.4: c.295T>C, p.Tyr99His, which parental testing confirmed to be de novo."
    explanation: A heterozygous H4C5 variant absent from both parents in an affected child.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been published. ClinGen's 2024 curation counted 18
    probands with H4C5 missense variants across two publications: 17 in the
    founding 29-person H4 cohort and one later case report. This is a discovery
    count, not an epidemiological estimate.
  evidence:
  - reference: CGGV:assertion_934ff2db-b242-49d8-968f-08f8eb7b1310-2024-03-19T160000.000Z
    reference_title: "H4C5 / Tessadori-Van Haaften neurodevelopmental syndrome 3 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, 7 missense variants, including 4 unique and 3 recurrent variants in 18 probands have been reported in two publications and are included in this curation"
    explanation: ClinGen's count of reported H4C5 probands.
pathophysiology:
- name: De Novo H4C5 Missense Variant Altering Histone H4
  biological_scale: MOLECULAR
  description: >-
    A heterozygous de novo missense substitution in H4C5 changes one residue of
    histone H4. Because thirteen other genes encode the same protein, and H4
    loss-of-function variants occur in healthy people, the variant is thought to
    act through a dominant effect of the altered protein rather than by reducing
    the amount of H4.
  genes:
  - preferred_term: H4C5
    term:
      id: hgnc:4790
      label: H4C5
  molecular_functions:
  - preferred_term: structural constituent of chromatin
    modifier: ABNORMAL
    term:
      id: GO:0030527
      label: structural constituent of chromatin
  genetic_context:
    gene:
      preferred_term: H4C5
      term:
        id: hgnc:4790
        label: H4C5
    allele_type: MISSENSE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous de novo missense variants. A dominant effect is proposed but
      a specific functional category has not been demonstrated for H4C5 alleles.
  evidence:
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present a cohort of 29 subjects with de novo missense variants in six H4 genes (H4C3, H4C4, H4C5, H4C6, H4C9, and H4C11) identified by whole-exome sequencing and matchmaking."
    explanation: The founding cohort that includes the H4C5 de novo missense variants.
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Loss-of-function variants in H4 genes are present in the healthy population 17 and are even present in homozygous form, 30 supporting our hypothesis that the variants identified here act through a dominant effect."
    explanation: >-
      Population data argue against haploinsufficiency; the dominant mechanism
      is an inference from them rather than a measured effect.
  downstream:
  - target: Perturbed Nucleosome Structure and Histone Interactions
    description: >-
      The substituted residues sit at H4 surfaces that contact DNA, other
      histones or histone chaperones.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35202563
      reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These variants cluster to specific regions of the core H4 globular domain, where protein-protein interactions occur with either other histone subunits or histone chaperones."
      explanation: >-
        Variant location implies an effect on these interactions; the effect
        itself was not measured for H4C5 alleles.
- name: Perturbed Nucleosome Structure and Histone Interactions
  biological_scale: MOLECULAR
  description: >-
    Altered H4 incorporated into chromatin is predicted to perturb nucleosome
    stability or the binding of histone chaperones. This is inferred from the
    position of the variants and from yeast and oncohistone studies of the same
    regions. It has not been shown biochemically for any H4C5 variant.
  evidence:
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "are predicted to perturb either nucleosome stability or interaction with histone chaperones, suggesting the H4 variants described in our cohort most likely cause similar effects."
    explanation: >-
      The authors extend predictions made for other variants in the same
      regions to the cohort variants; the evidence is analogy, not measurement.
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Arg45 is positioned in the loop following the first α-helix and forms one of the sprockets of the nucleosome that contacts the minor groove of DNA."
    explanation: >-
      Structural position of Arg45, the residue altered by the most recurrent
      H4C5 variant (seven individuals).
  downstream:
  - target: Disrupted Early Embryonic Development
    description: >-
      Expressing H4 disease variants in zebrafish embryos disturbs early
      development.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disrupted Early Embryonic Development
  biological_scale: ORGANISM
  description: >-
    In zebrafish embryos, overexpression of human H4 disease variants caused
    abnormal general development, head defects, a shortened body axis and tissue
    necrosis. The H4C5 Arg45Cys variant showed a dose-dependent effect, while
    Arg40Cys, also an H4C5 allele, had no significant effect. That the human
    neurodevelopmental and growth features arise from the same disturbance is an
    inference; no mammalian or human cell model has been reported.
  evidence:
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Functional consequences of the identified variants were evaluated in zebrafish embryos, which displayed abnormal general development, defective head organs, and reduced body axis length, providing compelling evidence for the causality of the reported disorder(s)."
    explanation: The zebrafish result that this node records.
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we observed a dosage-dependent effect for Arg40His and Arg45Cys"
    explanation: Arg45Cys is the recurrent H4C5 allele.
  - reference: PMID:35202563
    reference_title: "Recurrent de novo missense variants across multiple histone H4 genes underlie a neurodevelopmental syndrome."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "All variants tested displayed significant visible developmental effects compared to microinjection of the corresponding wild-type H4 gene, except the Pro32Ala and Arg40Cys variants."
    explanation: >-
      Arg40Cys, carried by four individuals with H4C5 variants, did not
      produce a significant effect in this assay, so the model does not capture
      every H4C5 allele.
  downstream:
  - target: Intellectual Disability
  - target: Global Developmental Delay
  - target: Postnatal Microcephaly
  - target: Short Stature
  - target: Hypotonia

genetic:
- name: TGFBR2
  gene_term:
    preferred_term: TGFBR2
    term:
      id: hgnc:11773
      label: TGFBR2
  association: Causative
  relationship_type: CAUSATIVE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_73be8b4f-d823-44e5-ab76-faa3bc8eca84-2020-11-25T180000.000Z
    evidence:
    - reference: CGGV:assertion_73be8b4f-d823-44e5-ab76-faa3bc8eca84-2020-11-25T180000.000Z
      reference_title: "TGFBR2 / Loeys-Dietz syndrome 2 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TGFBR2 | HGNC:11773 | Loeys-Dietz syndrome 2 | MONDO:0012427 | AD | Definitive"
      explanation: >-
        ClinGen classifies the TGFBR2 - Loeys-Dietz syndrome 2 (MONDO:0012427)
        relationship as Definitive for autosomal dominant inheritance; the
        record's MONDO term is this entry's disease_term.
  notes: >-
    TGFBR2 (HGNC:11773, chromosome 3p) encodes the type II TGF-beta receptor
    serine/threonine kinase. Heterozygous TGFBR2 variants define Loeys-Dietz
    syndrome 2. TGFBR2 is the most frequently involved LDS gene: a review
    subtype table gives it 55-60% of gene-defined LDS, and in a series of 24
    novel LDS families 10 carried TGFBR2 variants, the largest single-gene
    share. Variants in the same gene are also reported in Marfan syndrome type 2
    and in familial thoracic aortic aneurysm and dissection without syndromic
    features (for example R460C), which is relevant when a TGFBR2 variant is
    found in a patient without the LDS systemic picture.
  evidence:
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mutations in the gene encoding transforming growth factor-beta receptor
      type II (TGFBR2) have been described in patients with Loeys-Dietz syndrome
      (LDS), Marfan syndrome type 2 (MFS2) and familial thoracic aortic
      aneurysms and dissections (TAAD).
    explanation: >-
      Places TGFBR2 as an LDS gene and records the allelic MFS2 and TAAD
      presentations noted above.
  - reference: PMID:29270370
    reference_title: "Differences in manifestations of Marfan syndrome, Ehlers-Danlos syndrome, and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "LDS type 2 TGFBR2 55–60%"
    explanation: >-
      The review's LDS subtype table assigns TGFBR2 to LDS type 2 and gives it
      55-60% of gene-defined LDS.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of variants affected the TGFBR1 (9/24) and TGFBR2 (10/24) genes"
    explanation: >-
      Independent single-cohort corroboration that TGFBR2 is the most often
      affected LDS gene.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFBR2 | transforming growth factor beta receptor 2 | hgnc:11773 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet curates TGFBR2 as a disease-causing gene for Loeys-Dietz
      syndrome and supplies the HGNC identifier used here.
differential_diagnoses:
- name: Loeys-Dietz syndrome 1
  disease_term:
    preferred_term: Loeys-Dietz syndrome 1
    term:
      id: MONDO:0012212
      label: Loeys-Dietz syndrome 1
  description: >-
    The TGFBR1 subtype shares the full Loeys-Dietz picture, including the
    craniofacial features, and the two are equally ranked as the most severe
    gene-defined classes. They are separated by molecular testing.
  distinguishing_features:
  - >-
    Gene: TGFBR1 in LDS1, TGFBR2 in LDS2.
  - >-
    Genotype-stratified cohorts report more aggressive aortic disease with
    TGFBR2 - higher-grade cystic medial necrosis, larger and stiffer proximal
    aortas in children, more type B dissection - while craniofacial and skeletal
    features occur at similar rates.
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "from most to least severe form: LDS1=LDS2>LDS3>LDS4>LDS5"
    explanation: >-
      Places LDS1 and LDS2 together at the severe end of the gene-defined
      ranking, which is why molecular rather than clinical distinction is
      needed.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paediatric LDS patients with TGFBR2 present with more severe
      cardiovascular phenotypes than patients with TGFBR1 with larger aortic
      dimensions and increased aortic stiffness
    explanation: >-
      The clearest genotype-stratified difference between the two subtypes.
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    Marfan syndrome shares aortic root aneurysm and skeletal features, and some
    TGFBR2 variant carriers have been described as Marfan syndrome type 2.
  distinguishing_features:
  - >-
    Marfan syndrome is caused by FBN1 variants; molecular testing is
    definitive.
  - >-
    Hypertelorism, bifid uvula or cleft palate, craniosynostosis and
    generalised arterial tortuosity point to Loeys-Dietz syndrome.
  - >-
    Dissection in LDS2 can occur at smaller diameters and younger ages than in
    Marfan syndrome, so the distinction changes surveillance and surgical
    thresholds.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome
    explanation: >-
      The management-relevant difference from Marfan syndrome.
- name: Vascular Ehlers-Danlos syndrome
  disease_term:
    preferred_term: Ehlers-Danlos syndrome, vascular type
    term:
      id: MONDO:0017314
      label: Ehlers-Danlos syndrome, vascular type
  description: >-
    Vascular Ehlers-Danlos syndrome shares arterial fragility, translucent skin
    and easy bruising; TGFBR1 or TGFBR2 variants were found in patients
    presenting as vascular Ehlers-Danlos syndrome without a type III collagen
    defect.
  distinguishing_features:
  - >-
    Vascular Ehlers-Danlos syndrome is caused by COL3A1 variants; LDS2 by
    TGFBR2 variants.
  - >-
    Intraoperative mortality in LDS is low, unlike vascular Ehlers-Danlos
    syndrome, which makes the distinction decisive for prophylactic surgery.
  evidence:
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This low rate of intraoperative mortality distinguishes the Loeys-Dietz
      syndrome from vascular Ehlers-Danlos syndrome.
    explanation: >-
      The surgical outcome difference that makes the distinction matter.
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotyping of patients presenting with symptoms like those of vascular
      Ehlers-Danlos syndrome may be used to guide therapy, including the use and
      timing of prophylactic vascular surgery.
    explanation: >-
      Recommends genotyping in vascular-Ehlers-Danlos-like presentations, where
      TGFBR1/TGFBR2 variants were found.
- name: Familial thoracic aortic aneurysm and dissection
  disease_term:
    preferred_term: familial thoracic aortic aneurysm and aortic dissection
    term:
      id: MONDO:0019625
      label: familial thoracic aortic aneurysm and aortic dissection
  description: >-
    Some TGFBR2 variants, such as R460C, are found in familial thoracic aortic
    aneurysm and dissection without the craniofacial and skeletal features of
    LDS, and retain more residual signalling than LDS alleles.
  distinguishing_features:
  - >-
    Absence of the Loeys-Dietz craniofacial, skeletal and cutaneous features.
  evidence:
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, R460C, which has been found in familial TAAD but not in MFS2
      or LDS, showed a less-severe dominant-negative effect and retained
      residual Smad phosphorylation and transcriptional activity.
    explanation: >-
      Identifies a TGFBR2 allele associated with non-syndromic familial TAAD and
      its milder signalling defect.
progression:
- phase: Childhood
  age_range: Infancy to adolescence
  notes: >-
    Aortic disease is evident in childhood. In a paediatric cohort nearly half
    of TGFBR2 children had already undergone aortic surgery, and the age at
    surgery was more variable and could be earlier than in TGFBR1 children, who
    tended to reach surgery in late childhood.
  evidence:
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with TGFBR1 were more likely to undergo aortic surgery in late
      childhood, whereas the age at aortic surgery in patients with TGFBR2 was
      more variable
    explanation: >-
      Age at aortic surgery was more variable in TGFBR2 children (IQR 2.3-12.0
      years) than in TGFBR1 children (IQR 12.3-14.7 years).
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    Aortic and extra-aortic arterial disease progress through adult life, with
    a risk of dissection after the initial aortic surgery; women with TGFBR2
    variants were a higher-risk group for post-operative dissection in one
    surgical series. Extra-aortic aneurysms were diagnosed at a median age of
    40 years across one LDS cohort.
  evidence:
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The freedom from aortic dissection (AD) after the initial surgery was also
      lower in female patients with TGFBR2 mutation than in other patients (p =
      0.025)
    explanation: >-
      Post-operative dissection risk in women with TGFBR2 variants.
  - reference: PMID:40533122
    reference_title: "Characterization of Arterial Aneurysms in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at AA diagnosis was 40 years; 75% of AAs were in the arch
      vessels or cerebral circulation.
    explanation: >-
      Adult age at diagnosis of extra-aortic aneurysms across the LDS cohort.
diagnosis:
- name: Baseline and serial whole-arterial-tree imaging
  diagnosis_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  description: >-
    Echocardiography of the aortic root and ascending aorta at least annually,
    and MR or CT angiography of the entire arterial tree, head to pelvis, at
    least every other year, with more frequent imaging by genotype, family
    history, vessel size or growth rate. Whole-tree imaging is required in LDS2
    because TGFBR2 variants predispose to intracranial and other extra-aortic
    aneurysms and dissections that echocardiography cannot see.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree (at
      least every other year); more frequent imaging may be indicated based on
      genotype, family history, absolute vessel size or growth rate, or vascular
      pathology.
    explanation: >-
      GeneReviews surveillance schedule for Loeys-Dietz syndrome, including the
      provision for genotype-based intensification.
  - reference: PMID:40533122
    reference_title: "Characterization of Arterial Aneurysms in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Head to pelvis imaging at diagnosis and during follow-up is recommended in
      LDS to evaluate for AAs and their complications.
    explanation: >-
      Recommends head-to-pelvis imaging to detect extra-aortic aneurysms.
treatments:
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers such as losartan reduce haemodynamic stress on
    the aortic wall. In LDS mouse models, including a Tgfbr2 knockin, losartan's
    efficacy correlated with suppression of aortic SMAD2 phosphorylation and
    TGF-beta1 expression. In a paediatric cohort 14 of 15 TGFBR2 children were
    treated with an angiotensin receptor blocker; this is a usage figure, and no
    TGFBR2-specific efficacy trial is cached.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Paradoxical Increase in Aortic Wall TGF-beta Signaling
    treatment_effect: INHIBITS
    description: >-
      In LDS mice losartan's benefit tracked suppression of aortic SMAD2
      phosphorylation and TGF-beta1 expression.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, suppression of Smad2 phosphorylation and TGF-β1 expression
        correlated with the therapeutic efficacy of the angiotensin II type 1
        receptor antagonist losartan.
      explanation: >-
        Mouse evidence linking losartan's effect to the aortic TGF-beta
        signalling node.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or other
      medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews states the medical management of Loeys-Dietz cardiovascular
      disease.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with TGFBR2 were more likely to have undergone aortic surgery
      (47% vs 12%, P = 0.057) and use angiotensin receptor blockers (93% vs 47%,
      P = 0.015).
    explanation: >-
      Documents near-universal angiotensin receptor blocker use in TGFBR2
      children; a usage figure, not efficacy evidence.
- name: Beta-Blocker Therapy
  description: >-
    Beta-adrenergic receptor blockade to reduce haemodynamic stress on the
    dilating aorta.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Progressive Aortic and Arterial Dilation
    treatment_effect: INHIBITS
    description: >-
      Reducing haemodynamic stress is intended to slow aortic dilation.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or other
      medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews names beta-adrenergic receptor blockers in LDS management.
- name: Prophylactic Aortic Root Replacement
  description: >-
    Elective replacement of the dilated aortic root and ascending aorta before
    dissection. In LDS the threshold is lower than in Marfan syndrome, and for
    TGFBR1/TGFBR2 variants the 2022 ACC/AHA guideline allows surgery at smaller
    diameters when higher-risk features are present, among them women with
    TGFBR2 variants and small body size, severe extra-aortic features, a family
    history of dissection, or rapid aortic growth.

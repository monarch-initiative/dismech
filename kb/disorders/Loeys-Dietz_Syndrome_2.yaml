definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis of Loeys-Dietz syndrome is established either clinically, in a
    proband with characteristic findings, or by identification of a heterozygous
    pathogenic variant in one of the autosomal dominant LDS genes in a proband
    with aortic root enlargement, type A dissection, other characteristic
    features, or a family history of LDS; a heterozygous pathogenic TGFBR2
    variant defines subtype 2. A mutation in an LDS gene together with arterial
    aneurysm or dissection has been proposed as sufficient for the diagnosis
    irrespective of how prominent the systemic features are.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 or
      biallelic pathogenic variants in IPO8 in a proband with aortic root
      enlargement, type A dissection, other characteristic clinical features of
      LDS, or a family history of an established diagnosis of LDS.
    explanation: >-
      GeneReviews names TGFBR2 among the genes whose heterozygous pathogenic
      variants establish a molecular diagnosis of Loeys-Dietz syndrome, in a
      proband with the stated clinical context.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      we propose a revised nosology and that a mutation in any of these genes in
      combination with documented aneurysm or dissection should be sufficient
      for the diagnosis of LDS
    explanation: >-
      The expert primer's diagnostic proposal, made for TGFBR1, TGFBR2, SMAD3
      and TGFB2 together, irrespective of the severity of systemic features.

- name: Perturbed TGF-beta Signaling in Craniofacial and Skeletal Development
  biological_scale: TISSUE
  description: >-
    TGF-beta signalling regulates craniofacial and skeletal development,
    including cranial suture closure, palatal fusion and vertebral column
    formation. TGF-beta receptor variants perturb it, producing the craniofacial
    half of the Loeys-Dietz triad (hypertelorism, bifid uvula or cleft palate),
    craniosynostosis, and skeletal and connective-tissue features of the spine,
    chest wall, joints and limbs. Craniofacial features are not a reliable
    discriminator between TGFBR1 and TGFBR2: in a genotyped paediatric cohort
    they were present at similar rates in the two groups.
  biological_processes:
  - preferred_term: skeletal system development

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    TGFBR2-related Loeys-Dietz syndrome is inherited in an autosomal dominant
    manner. Across Loeys-Dietz syndrome about three quarters of probands carry a
    de novo variant and about a quarter have an affected parent; each child of an
    affected individual has a 50% chance of inheriting the variant.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the autosomal dominant inheritance of TGFBR2-related
      Loeys-Dietz syndrome explicitly.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 75% of probands diagnosed with LDS have the disorder as the
      result of a de novo pathogenic variant; approximately 25% of individuals
      diagnosed with LDS have an affected parent.
    explanation: >-
      Sources the de novo and inherited proportions stated in the description.
      These are given for Loeys-Dietz syndrome as a whole rather than for the
      TGFBR2 subtype alone.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report heterozygous mutations in the genes encoding either type I or
      type II transforming growth factor beta receptor in ten families
    explanation: >-
      The founding report identifies the disease-causing receptor variants as
      heterozygous, consistent with dominant inheritance.
pathophysiology:
- name: Heterozygous TGFBR2 Kinase-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous variant in TGFBR2, which encodes the
    type II TGF-beta receptor. In the receptor complex the type II receptor
    phosphorylates specific serine and threonine residues of the type I receptor
    (TGFBR1) to activate it, so the type II kinase is the entry point of the
    canonical pathway. Characterised LDS-associated TGFBR2 alleles are missense
    variants in the intracellular kinase domain that reduce kinase function and
    exert a dominant-negative effect on the receptor complex.
  genes:
  - preferred_term: TGFBR2
    term:
      id: hgnc:11773
      label: TGFBR2
  molecular_functions:
  - preferred_term: TGF-beta type II receptor kinase activity
    term:
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40612107
    reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TGFBR2 plays a vital role in activating TGFBR1 by phosphorylating specific
      serine and threonine residues.
    explanation: >-
      States the normal kinase function of the type II receptor that LDS2
      variants disrupt.
  - reference: PMID:28679693
    reference_title: "Functional validation reveals the novel missense V419L variant in TGFBR2 associated with Loeys-Dietz syndrome (LDS) impairs canonical TGF-β signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe and characterize the functional impact of a novel VUS in
      the TGFBR2 kinase domain (c.1255G>T; p.Val419Leu)
    explanation: >-
      An example of the kinase-domain missense class of LDS2 alleles, identified
      in a patient and later confirmed as diagnostic of Loeys-Dietz syndrome.
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A dominant-negative effect was demonstrated for mutations associated with
      LDS and MFS2.
    explanation: >-
      Quantitative signalling assays across nine patient-derived TGFBR2 alleles
      show the LDS-associated variants act dominant-negatively.
  - reference: PMID:24355923
    reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated 2 knockin mouse strains with LDS mutations in either Tgfbr1
      or Tgfbr2 and a transgenic mouse overexpressing mutant Tgfbr2. Knockin and
      transgenic mice, but not haploinsufficient animals, recapitulated the LDS
      phenotype
    directness: INDIRECT
    explanation: >-
      Mice carrying an LDS Tgfbr2 knockin allele or overexpressing mutant Tgfbr2
      reproduce the phenotype while haploinsufficient animals do not, which
      supports a mutant-receptor rather than a simple loss-of-one-copy
      mechanism. Marked INDIRECT because the sentence groups the Tgfbr1 and
      Tgfbr2 strains and the evidence is from mice.
  downstream:
  - target: Dominant-Negative Impairment of Receptor-Initiated SMAD2/3 Signaling
    description: >-
      A kinase-impaired type II receptor incorporated into the receptor complex
      reduces ligand-induced phosphorylation of the type I receptor and,
      through it, of SMAD2/3.
    evidence:
    - reference: PMID:28679693
      reference_title: "Functional validation reveals the novel missense V419L variant in TGFBR2 associated with Loeys-Dietz syndrome (LDS) impairs canonical TGF-β signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        V419L significantly delayed SMAD2 phosphorylation by western blot and
        significantly decreased TGF-β-induced gene transcription by reporter
        assays consistent with known pathogenic variants in this gene
      explanation: >-
        A TGFBR2 kinase-domain variant measurably delays SMAD2 phosphorylation
        and reduces TGF-beta-induced transcription in cells, as known pathogenic
        TGFBR2 variants do.
  - target: Perturbed TGF-beta Signaling in Craniofacial and Skeletal Development
    description: >-
      The same receptor defect perturbs TGF-beta signalling in the developing
      craniofacial and skeletal tissues.
    evidence:
    - reference: PMID:15731757
      reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data definitively implicate perturbation of TGFbeta signaling in
        many common human phenotypes, including craniosynostosis, cleft palate,
        arterial aneurysms, congenital heart disease and mental retardation
      explanation: >-
        The founding report attributes the craniofacial and skeletal
        developmental features of the syndrome to perturbed TGF-beta signalling
        caused by the receptor variants.
  - target: Allergic and Eosinophilic Inflammatory Predisposition
    description: >-
      TGF-beta receptor deficiency is accompanied by an atopic immune phenotype
      with elevated IgE, food allergy and eczema. The cellular route from the
      receptor variant to this phenotype is not established in the cached
      sources, so the edge records the genotype-phenotype association only.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Recurrent respiratory infections; eczema, food allergies;
        hyperextensible joints, scoliosis, retention of primary teeth; aortic
        aneurisms
      explanation: >-
        The IUIS row for Loeys-Dietz syndrome (TGFBR deficiency), which spans
        the TGFBR1 and TGFBR2 (OMIM 610168) entries, records eczema and food
        allergy, alongside elevated IgE in the same row, as the clinical
        phenotype.
- name: Dominant-Negative Impairment of Receptor-Initiated SMAD2/3 Signaling
  biological_scale: MOLECULAR
  description: >-
    In cell-based assays LDS-associated TGFBR2 alleles reduce the acute,
    ligand-induced canonical response: SMAD2 phosphorylation is delayed and
    TGF-beta-induced transcription falls. The defect does not, however, produce
    a cell-autonomous paradoxical activation, and heterozygous mutant cells keep
    normal steady-state SMAD2 phosphorylation, which the authors read as chronic
    compensation. The familial thoracic aortic aneurysm allele R460C, by
    contrast, has a weaker dominant-negative effect with residual signalling,
    which links the degree of signalling loss to phenotypic severity.
  biological_processes:
  - preferred_term: ligand-induced TGF-beta receptor signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No mutation showed evidence of an immediate cell-autonomous paradoxical
      activation of TGF-β signaling.
    explanation: >-
      The cell-level consequence of the TGFBR2 variants is reduced, not
      increased, signalling, which is why the paradoxical increase is curated
      as a separate, downstream tissue-level node.
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, R460C, which has been found in familial TAAD but not in MFS2
      or LDS, showed a less-severe dominant-negative effect and retained
      residual Smad phosphorylation and transcriptional activity.
    explanation: >-
      Supports the allele-severity relationship stated in the description: the
      TAAD-associated allele impairs signalling less than LDS alleles.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite evidence that receptors derived from selected mutated alleles
      cannot support TGFbeta signal propagation, cells derived from individuals
      heterozygous with respect to these mutations did not show altered kinetics
      of the acute phase response to administered ligand.
    explanation: >-
      Mutant receptors cannot propagate signal, yet heterozygous patient cells
      respond to ligand with normal acute kinetics, the first indication that
      the receptor defect is compensated in vivo.
  - reference: PMID:24355923
    reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While heterozygous mutant cells had diminished signaling in response to
      exogenous TGF-β in vitro, they maintained normal levels of Smad2
      phosphorylation under steady-state culture conditions, suggesting a
      chronic compensation.
    explanation: >-
      Cells from the LDS knockin mice show reduced acute signalling with
      preserved steady-state SMAD2 phosphorylation, the compensation that links
      this node to the paradoxical tissue-level increase.
  downstream:
  - target: Paradoxical Increase in Aortic Wall TGF-beta Signaling
    description: >-
      In the aortic wall the reduced acute receptor signalling is followed by a
      compensatory, progressive increase in TGF-beta ligand expression, SMAD2
      phosphorylation and TGF-beta target-gene output.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Analysis of TGF-β signaling in the aortic wall in vivo revealed
        progressive upregulation of Smad2 phosphorylation and TGF-β target gene
        output, which paralleled worsening of aneurysm pathology and coincided
        with upregulation of TGF-β1 ligand expression.
      explanation: >-
        In LDS mouse models the aortic wall develops progressive SMAD2
        phosphorylation and target-gene upregulation with increased TGF-beta1
        ligand, tracking aneurysm severity.
- name: Paradoxical Increase in Aortic Wall TGF-beta Signaling
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    Despite a receptor defect that reduces acute signalling, tissue from
    individuals with TGFBR1 or TGFBR2 variants shows increased TGF-beta pathway
    output: nuclear enrichment of phosphorylated SMAD2 and raised expression of
    collagen and connective tissue growth factor. In LDS aortas pSMAD2
    immunostaining is increased against controls, and in knockin mice the
    aortic increase is progressive and accompanied by TGF-beta1 ligand
    upregulation. This is the TGF-beta paradox shared across the Loeys-Dietz
    genes; the human tissue studies cited here pool TGFBR1 and TGFBR2 patients.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: TGF-beta signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  - preferred_term: SMAD2/3 signaling
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, tissues derived from affected individuals showed increased
      expression of both collagen and connective tissue growth factor, as well
      as nuclear enrichment of phosphorylated Smad2, indicative of increased
      TGFbeta signaling.
    explanation: >-
      Patient tissue from the founding TGFBR1/TGFBR2 cohort shows the
      paradoxical increase in TGF-beta signalling.
  - reference: PMID:18852674
    reference_title: "Histopathologic findings in ascending aortas from individuals with Loeys-Dietz syndrome (LDS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an immunohistochemical stain for pSmad2, a marker of TGFbeta activity, was
      significantly increased in LDS patients compared with controls
    explanation: >-
      Surgical aortic root tissue from LDS patients (a TGFBR1/TGFBR2 cohort)
      shows increased pSMAD2 against controls.
  - reference: PMID:34807423
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite the loss of function nature of these mutations, the
      patient-derived aortic tissues show evidence of increased (rather than
      decreased) TGFβ signalling.
    explanation: >-
      A review statement of the TGF-beta paradox across the Loeys-Dietz genes,
      TGFBR2 included.
  downstream:
  - target: Aortic Medial Degeneration
    description: >-
      Excess TGF-beta signalling in the aortic media drives the medial
      degeneration that weakens the wall.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together, these data suggest that increased TGF-β signaling contributes
        to postnatal aneurysm progression in LDS.
      explanation: >-
        The authors' conclusion links the increased aortic TGF-beta signalling
        to aneurysm progression in LDS mouse models that include a Tgfbr2
        knockin.
- name: Aortic Medial Degeneration
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    The aortic media in LDS shows diffuse medial degeneration with elastic fibre
    fragmentation, extracellular matrix deposition and increased medial
    collagen. Medial degeneration is more severe with TGFBR2 than with TGFBR1:
    in one surgical series every TGFBR2 specimen showed grade III cystic medial
    necrosis and grade III elastic fibre fragmentation, against one grade III
    cystic medial necrosis among the TGFBR1 specimens. Clinically the weakened
    wall is stiffer and less distensible; a paediatric echocardiographic cohort
    found lower distensibility and strain and a higher stiffness index at the
    annulus, sinotubular junction and ascending aorta in TGFBR2 than in TGFBR1
    children.
  cell_types:
  - preferred_term: aortic smooth muscle cell
    term:
      id: CL:0002539
      label: aortic smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  evidence:
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with TGFBR2 mutations revealed grade III cystic medial
      necrosis (CMN), whereas 67% of patients with TGFBR1 mutations showed CMN
      (p = 0.033) and only one patient had grade III (p <0.001).
    explanation: >-
      Genotype-stratified histopathology shows uniformly grade III cystic
      medial necrosis in TGFBR2 aortas and milder disease with TGFBR1.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In terms of the grade III EF, it was more frequent in the TGFBR2 (10/10:
      100%) than that in the TGFBR1 group (5/9: 55.6%) (p = 0.033)
    explanation: >-
      Grade III elastic fibre fragmentation was present in all ten TGFBR2
      specimens, against five of nine TGFBR1 specimens.
  - reference: PMID:18852674
    reference_title: "Histopathologic findings in ascending aortas from individuals with Loeys-Dietz syndrome (LDS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS samples had increased medial collagen and a subtle but diffuse form of
      elastic fiber fragmentation and extracellular matrix deposition, referred
      to as diffuse medial degeneration.
    explanation: >-
      Describes the medial lesion in LDS aortic root tissue from a TGFBR1/TGFBR2
      cohort.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with TGFBR2 also had significantly lower aortic distensibility
      and strain coupled with higher stiffness index at the level of the
      annulus, sinotubular junction, and ascending aorta.
    explanation: >-
      The in vivo mechanical correlate of the weakened TGFBR2 aortic wall in
      children, measured against TGFBR1 children.
  downstream:
  - target: Progressive Aortic and Arterial Dilation
    description: >-
      The degenerated, stiffened media dilates progressively under
      haemodynamic load.
  - target: Arterial Tortuosity
    description: >-
      Loss of medial integrity along the arterial tree presents as the
      elongation and tortuosity characteristic of Loeys-Dietz syndrome.
- name: Progressive Aortic and Arterial Dilation
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  description: >-
    Aortic dilation in LDS2 begins in childhood and is larger than in LDS1: in a
    paediatric cohort TGFBR2 children had larger aortic z-scores at the annulus,
    sinuses of Valsalva and sinotubular junction, more often had aortic
    regurgitation, and nearly half had already undergone aortic surgery.

name: Loeys-Dietz Syndrome 2
creation_date: "2026-10-14T16:49:12Z"
category: Mendelian
description: >-
  Loeys-Dietz syndrome 2 (LDS2) is the TGFBR2-related subtype of Loeys-Dietz
  syndrome, an autosomal dominant heritable connective tissue disorder of the
  TGF-beta signalling pathway. TGFBR2 encodes the type II TGF-beta receptor, the
  serine/threonine kinase that binds ligand and phosphorylates and activates the
  type I receptor. Heterozygous TGFBR2 variants, most of them missense changes
  in the intracellular kinase domain, impair receptor signalling through a
  dominant-negative effect rather than simple haploinsufficiency; yet aortic
  tissue from affected individuals paradoxically shows increased TGF-beta
  pathway output (nuclear phosphorylated SMAD2, raised collagen and connective
  tissue growth factor expression). The clinical picture is the Loeys-Dietz
  triad of arterial tortuosity and aneurysms, hypertelorism, and bifid uvula or
  cleft palate, with craniosynostosis, skeletal involvement (cervical spine
  instability, scoliosis, pectus deformity, joint laxity, clubfoot, fracture
  susceptibility), thin translucent skin with easy bruising and dystrophic
  scars, and a predisposition to allergic and eosinophilic inflammatory disease.
  TGFBR2 is the most frequently involved Loeys-Dietz gene, and LDS2 sits with
  LDS1 at the severe end of the gene-defined series. Genotype-stratified cohorts
  report more aggressive aortic disease than in TGFBR1-related LDS1: uniformly
  grade III cystic medial necrosis in surgical specimens, larger aortic z-scores
  with stiffer, less distensible proximal aortas in children, more frequent type
  B dissection, and a higher dissection risk in women of small body size, which
  the 2022 ACC/AHA guideline names as a reason for earlier aortic surgery.
  Aneurysm and dissection are not confined to the aortic root: TGFBR2 variants
  also predispose to intracranial and other extra-aortic arterial aneurysms and
  dissections. This entry curates the TGFBR2 subtype specifically; the shared
  Loeys-Dietz clinical picture is also curated in the umbrella entry Loeys-Dietz
  Syndrome, and the conserved aortopathy mechanism in the
  `aortopathy_tgfbeta_dysregulation` module.
disease_term:
  preferred_term: Loeys-Dietz syndrome 2
  term:

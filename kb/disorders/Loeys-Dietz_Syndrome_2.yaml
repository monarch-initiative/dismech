animal_models:
- name: Tgfbr2 LDS knockin mouse
  species: Mouse
  genotype: Heterozygous knockin of an LDS-associated Tgfbr2 missense allele
  publication: PMID:24355923
  description: >-
    One of two LDS knockin strains (the other in Tgfbr1), together with a
    transgenic line overexpressing mutant Tgfbr2. Knockin and transgenic mice,
    unlike haploinsufficient animals, recapitulate the LDS phenotype, with a
    progressive increase in aortic SMAD2 phosphorylation and TGF-beta target
    gene output that tracks aneurysm severity and is suppressed by losartan.
  modeled_mechanisms:
  - target: Paradoxical Increase in Aortic Wall TGF-beta Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The abstract reports the aortic signalling results for the knockin and
      transgenic strains together, so Tgfbr2-specific values are not separable
      from the Tgfbr1 strain in the cached source.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Analysis of TGF-β signaling in the aortic wall in vivo revealed
        progressive upregulation of Smad2 phosphorylation and TGF-β target gene
        output, which paralleled worsening of aneurysm pathology and coincided
        with upregulation of TGF-β1 ligand expression.
      explanation: >-
        The knockin models reproduce the paradoxical aortic increase in
        TGF-beta signalling.

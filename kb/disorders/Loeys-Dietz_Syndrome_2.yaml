- name: Allergic and Eosinophilic Inflammatory Predisposition
  biological_scale: ORGANISM
  description: >-
    Loeys-Dietz syndrome carries a strong predisposition to allergic and
    inflammatory disease: food allergy, asthma, eczema and allergic rhinitis,
    and eosinophilic gastrointestinal inflammation. IUIS classifies TGFBR

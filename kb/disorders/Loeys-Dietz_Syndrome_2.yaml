    label: Loeys-Dietz syndrome 2
synonyms:
- LDS2
- Loeys-Dietz syndrome type 2
- TGFBR2-related Loeys-Dietz syndrome
- TGFBR2 Loeys-Dietz syndrome
- Loeys-Dietz syndrome caused by mutation in TGFBR2
notes: >-
  Nosology caveat for this disease term. "Loeys-Dietz syndrome type 2" has two
  senses in the literature. The modern, gene-based sense is the TGFBR2 class of
  the numbered LDS1-6 series (OMIM:610168), which is the sense this entry
  curates. The older, gene-agnostic clinical sense comes from Loeys et al. 2006
  (PMID:16928994), where "type II" denoted a craniofacially spared,
  vascular-Ehlers-Danlos-like presentation whose probands carried either TGFBR1
  or TGFBR2 variants. MONDO:0012427's free-text definition, imported from
  NCIT:C114768, still reads "caused by mutations in either the TGFBR1 or TGFBR2
  gene", a remnant of the older sense; MONDO's logical definition (Loeys-Dietz
  syndrome with RO:0004003 causal gene HGNC:11773), its by-gene synonyms and its
  OMIM:610168 cross-reference all place the term on TGFBR2, and so does the
  ClinGen gene-disease validity record for TGFBR2, which is filed against
  MONDO:0012427. Two consequences for curators. First, outcome figures quoted
  for "type II" from the 2006 cohort (later surgery at mean 26.9 years, death at
  31.8 years, a vascular-Ehlers-Danlos-like and craniofacially milder picture)
  describe a clinically selected group, not a TGFBR2-genotyped one, and are not
  carried here as LDS2 properties; genotype-stratified cohorts instead report
  craniofacial features at similar rates in TGFBR1 and TGFBR2 children and more
  severe aortic disease with TGFBR2. Second, several reviews and the 2014 LDS
  primer give figures for "LDS 1/2" pooled across TGFBR1 and TGFBR2; such figures
  are used below only where no TGFBR2-specific value is available, and are
  labelled as pooled.

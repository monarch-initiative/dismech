has_subtypes:
- name: RP4
  display_name: Retinitis Pigmentosa 4
  subtype_term:
    preferred_term: retinitis pigmentosa 4
    term:
      id: MONDO:0013395
      label: retinitis pigmentosa 4
  description: >
    The dominant branch: autosomal dominant progressive rod-cone dystrophy
    presenting with childhood or early-adult nyctalopia, followed by progressive
    peripheral field loss and late central visual impairment. A generalized
    phenotype (75% of patients) progresses faster than a sector phenotype (25%),
    with median age to low vision at 52 years based on central visual field.
  evidence:
  - reference: PMID:32301896
    reference_title: "CLINICAL CHARACTERISTICS AND NATURAL HISTORY OF RHO-ASSOCIATED RETINITIS PIGMENTOSA: A Long-Term Follow-Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease progression was significantly faster in patients with a generalized RP phenotype (n = 75; 75%) than that in patients with a sector RP phenotype (n = 25; 25%)"
    explanation: >
      Multicenter natural-history cohort of 100 RHO-associated RP patients
      documents RP4 as the major subtype with two recognized severity classes.
  - reference: PMID:29042326
    reference_title: "The molecular and cellular basis of rhodopsin retinitis pigmentosa reveals potential strategies for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 150 different mutations in rhodopsin have been identified and, collectively, they are the most common cause of autosomal dominant RP (adRP)."
    explanation: >
      This comprehensive review establishes RP4 as the dominant disease branch
      within the RHO family.
- name: CSNBAD1
  display_name: Congenital Stationary Night Blindness Autosomal Dominant 1
  subtype_term:
    preferred_term: congenital stationary night blindness autosomal dominant 1
    term:
      id: MONDO:0012498
      label: congenital stationary night blindness autosomal dominant 1
  description: >
    Rare gain-of-function RHO branch (G90D, T94I) causing congenital,
    non-progressive night blindness without retinal degeneration. Constitutive
    rhodopsin activation generates dark continuous noise that saturates rod
    phototransduction in the absence of light. The absence of degeneration is
    definitional for CSNBAD1 as an entity rather than a prediction for every
    carrier of the variants named: in the largest p.G90D cohort characterized to
    date only 20% were classified as CSNB while 53.3% had classic retinitis
    pigmentosa, so p.G90D carriers specifically may progress and be reclassified
    (see the evidence below and the caveat on the Congenital night blindness
    phenotype). T94I, A292E, and A295V have not been associated with
    degeneration.
  evidence:
  - reference: PMID:38743626
    reference_title: "Dark continuous noise from mutant G90D-rhodopsin predominantly underlies congenital stationary night blindness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "G90D-Rho, is thought to cause CSNB because of its constitutive activity in darkness causing rod desensitization."
    explanation: >
      Knock-in mouse study mechanistically demonstrates that constitutive
      G90D-rhodopsin activity in darkness is the proximal cause of the
      stationary night-blindness phenotype.
  - reference: PMID:29042326
    reference_title: "The molecular and cellular basis of rhodopsin retinitis pigmentosa reveals potential strategies for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in rhodopsin are also associated with dominant congenital stationary night blindness (adCSNB) and, less frequently, recessive RP (arRP)."
    explanation: >
      This review explicitly places CSNBAD1 within the RHO mutation spectrum
      as a distinct gain-of-function subtype.
  - reference: PMID:33669941
    reference_title: "Stationary and Progressive Phenotypes Caused by the p.G90D Mutation in Rhodopsin Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the high occurrence of degeneration in our p.G90D cohort warrants caution in diagnosing p.G90D patients with CSNB without a longer follow up into adulthood."
    explanation: >
      Qualifies the "without retinal degeneration" clause of this description at
      the genotype level rather than supporting it. In this cohort of 15 p.G90D
      carriers only 20% were classified as CSNB while 53.3% had classic RP, so
      the authors advise against a CSNB diagnosis in p.G90D without long
      follow-up. Graded PARTIAL because CSNBAD1 as an entity remains defined as
      non-progressive (the same paper states "CSNB is considered a
      non-progressive rod dysfunction without retinal degeneration" and notes
      that other RHO-CSNB variants have not been associated with degeneration) —
      progressors are reclassified as RP rather than counted as degenerating
      CSNBAD1. The tension is between the nosological category and the
      genotype's real range, and both halves are recorded here rather than one
      being dropped.
  - reference: PMID:9888392
    reference_title: "A novel mutation within the rhodopsin gene (Thr-94-Ile) causing autosomal dominant congenital stationary night blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the results of molecular genetic analysis of an Irish family segregating an autosomal dominant form of CSNB in which a previously unreported threonine-to-isoleucine substitution at codon 94 in the rhodopsin gene was found to segregate with the disease."
    explanation: >
      Human genetic source for the T94I half of this subtype description:
      T94I segregates with autosomal dominant CSNB in an Irish family. The
      quoted segregation finding is a clinical/molecular observation, which is
      what this item is graded on; the paper's proposed mechanism of
      constitutive transducin activation — consistent with the gain-of-function
      model of this branch — comes from computer modelling rather than from
      observation, and is not part of what this snippet establishes.

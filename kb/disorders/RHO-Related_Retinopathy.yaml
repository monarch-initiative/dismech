- category: Ophthalmic
  name: Riggs-type electroretinogram
  subtype: CSNBAD1
  frequency: VERY_FREQUENT
  description: >
    CSNBAD1 is a phototransduction-level (Riggs-type) CSNB: constitutive
    rhodopsin activation desensitizes the rods themselves, so the scotopic
    ERG shows loss of the rod a-wave as well as the b-wave. This is
    distinct from the "negative" Schubert-Bornschein ERG (large a-wave with
    minimal b-wave) seen in the signal-transmission forms of CSNB
    (e.g. NYX/CACNA1F), where photoreceptor-to-bipolar-cell transmission,
    not phototransduction, is the defective step.
  phenotype_term:
    preferred_term: Abnormal electroretinogram
    term:
      id: HP:0000512
      label: Abnormal electroretinogram
  reports_on:
  - target: Constitutive Rhodopsin Activation in Darkness
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: The Riggs-type loss of the rod a-wave measures photoreceptor-level rod desensitization from constitutive rhodopsin activation, rather than an inner-retinal transmission defect.
  evidence:
  - reference: PMID:30051303
    reference_title: "Riggs-type dominant congenital stationary night blindness: ERG findings, a new GNAT1 mutation and a systemic association."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSNB from abnormalities in phototransduction can be recessive or dominant and is much less common. This produces a Riggs type of ERG with loss of the rod a-wave as well as the b-wave."
    explanation: >
      Establishes the electrophysiological dichotomy in CSNB: phototransduction
      defects (the class to which gain-of-function RHO CSNBAD1 belongs) produce
      a Riggs-type ERG with loss of the rod a-wave, whereas the "negative"
      Schubert-Bornschein ERG with a preserved large a-wave arises from
      photoreceptor-to-bipolar-cell transmission defects.
  - reference: PMID:38743626
    reference_title: "Dark continuous noise from mutant G90D-rhodopsin predominantly underlies congenital stationary night blindness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One well-studied rhodopsin point mutant, G90D-Rho, is thought to cause CSNB because of its constitutive activity in darkness causing rod desensitization."
    explanation: >
      Sources the disease-level step directly for RHO rather than by inference
      from the CSNB class: a rhodopsin point mutant causes CSNB through
      constitutive activity in darkness that desensitizes rods. That is a
      phototransduction-level lesion, which is what produces the Riggs-type
      ERG pattern rather than an inner-retinal transmission defect. The
      companion PMID:30051303 item carries only the class-level ERG dichotomy.
  - reference: PMID:33669941
    reference_title: "Stationary and Progressive Phenotypes Caused by the p.G90D Mutation in Rhodopsin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSNB caused by RHO mutations is of the Riggs type, electroretinographically characterized by the complete loss of rod-specific ERG activity. DA bright flash (3.0) ERG typically exhibits a reduced DA a-wave and low b-wave, while the LA cone-specific responses are largely normal, reflecting preserved cone function"
    explanation: >
      Human RHO-specific source for this node: a clinical cohort of p.G90D
      patients states directly that RHO-related CSNB is of the Riggs type,
      with loss of rod-specific ERG activity and a reduced dark-adapted
      a-wave together with a low b-wave, while cone responses are largely
      preserved. This supplies the human counterpart to the G90D knock-in
      mouse item above, which CLAUDE.md requires for a human phenotype.
  - reference: PMID:33669941
    reference_title: "Stationary and Progressive Phenotypes Caused by the p.G90D Mutation in Rhodopsin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three of our patients diagnosed with CSNB had typical electrophysiological features."
    explanation: >
      Sources the VERY_FREQUENT band: every CSNB-phenotype patient in this

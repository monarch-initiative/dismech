- category: Ophthalmic
  name: Congenital night blindness
  subtype: CSNBAD1
  frequency: VERY_FREQUENT
  description: >
    In the CSNBAD1 branch, night blindness is congenital and does not worsen
    with age. Rod sensitivity is profoundly reduced by constitutive signaling
    noise from the gain-of-function rhodopsin variant. The "stationary" label
    applies to the rod dysfunction itself; see notes on the degeneration
    caveat in p.G90D carriers.
  notes: >
    The largest p.G90D cohort characterized to date (PMID:33669941, 15
    patients from three families) classified only 20% as CSNB, with 53.3%
    developing classic retinitis pigmentosa, and cautioned against diagnosing
    p.G90D patients with CSNB without long follow-up into adulthood. Other
    RHO-CSNB variants (T94I, A292E, A295V) have not been associated with
    progressive disease.
  phenotype_term:
    preferred_term: Congenital night blindness
    term:
      id: HP:0000662
      label: Nyctalopia
  evidence:
  - reference: PMID:33669941
    reference_title: "Stationary and Progressive Phenotypes Caused by the p.G90D Mutation in Rhodopsin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had night vision problems for as long as they could remember, which did not worsen with age."

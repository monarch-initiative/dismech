    explanation: Source for the adult point prevalence and its international range.

genetic:
- name: Heritable Liability
  association: >-
    A meta-analysis of 18 twin studies partitioned the variance in gambling into moderate
    additive genetic and non-shared environmental components, with no detectable shared
    environmental contribution in the whole-sample analysis.

    The even split is worth reading carefully rather than as a headline heritability. It
    says that roughly half the variance tracks additive genetic differences and
    essentially all the remainder tracks experiences not shared between twins - which
    puts the family environment, the intuitive candidate for a behaviour learned at home,
    close to zero in this decomposition.
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:29259572
    reference_title: "Genetic and Environmental Influences on Gambling: A Meta-Analysis of Twin Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The whole sample analyses showed moderate additive genetic (a2 = 0.50) and
      non-shared environmental influences (e2 = 0.50) on gambling"
    explanation: The variance decomposition, quoted with both components.

treatments:
- name: Cognitive Behavioural Therapy
  description: >-
    Behavioural intervention with the strongest support, alongside motivational
    interviewing and Gamblers Anonymous. Behavioural treatment is first-line here in a
    stronger sense than usual, because no drug holds a formal indication.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioural interventions, particularly cognitive-behavioural therapy but
      also motivational interviewing and Gamblers Anonymous, are supported in the
      treatment of gambling disorder"
    explanation: Names the supported behavioural interventions.
- name: Opioid Receptor Antagonists
  description: >-
    Nalmefene and naltrexone have the most supportive evidence in a network meta-analysis
    of 16 randomised trials, nalmefene reducing gambling severity with a standardised mean
    difference of -0.86 and naltrexone -0.42.

    The same analysis found both drugs had significantly higher dropout due to side
    effects than placebo, with odds ratios near 8 - so the best-evidenced pharmacotherapy
    is also the least tolerated, and efficacy and tolerability point in opposite
    directions. Neither holds a formal indication for this disorder.

    That an opioid antagonist works at all is itself mechanistically informative: it
    implicates endogenous opioid signalling, which modulates dopamine release in the
    ventral striatum, rather than acting on the dopamine receptor directly.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nalmefene
      term:
        id: CHEBI:7457
        label: Nalmefene
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: Endogenous Opioid Modulation of Striatal Dopamine Release
    treatment_effect: INHIBITS
    description: >-
      The drug is a mu-opioid receptor antagonist, so it acts on the opioid node rather
      than on the dopaminergic circuit node it was previously pointed at. The link
      records the presumed site of action, not measured target engagement in patients
      with gambling disorder.
  evidence:
  - reference: PMID:39675219
    reference_title: "Pharmacological management of gambling disorder: A systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate confidence evidence indicated that nalmefene [Standardized Mean
      Difference (SMD): -0.86; 95 % confidence interval (CI: -1.32,-0.41)] reduced
      gambling severity, followed by naltrexone (SMD: -0.42; 95 %CI: (-0.85,0.01))"
    explanation: The efficacy estimates, quoted with their confidence intervals - note
      that naltrexone's crosses zero.
  - reference: PMID:39675219
    reference_title: "Pharmacological management of gambling disorder: A systematic review and network meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nalmefene [Odds Ratio (OR): 7.55; 95 %CI: (2.24-25.41)] and naltrexone (OR:
      7.82; 95 %CI: (1.26-48.70)) had significantly higher dropout due to side effects
      (lower tolerability) compared with placebo"
    explanation: Marked PARTIAL because it qualifies rather than contradicts the efficacy
      finding - the same two drugs are both the best supported and the worst tolerated.
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No pharmacological therapy has a formal indication for the treatment of
      gambling disorder, although placebo-controlled trials suggest that some medications,
      such as opioid-receptor antagonists, may be helpful"
    explanation: Records the regulatory status alongside the trial evidence, so the
      treatment is not read as approved.

environmental:
- name: Dopamine agonist pharmacotherapy for Parkinson disease
  description: >-
    Treatment with a D2-like dopamine receptor agonist, prescribed for the motor symptoms
    of Parkinson disease, is an iatrogenic exposure that precipitates gambling disorder.
    The association held similarly for pramipexole and ropinirole, consistent with a
    class effect.
  influences_mechanisms:
  - target: Dopamine Agonist-Induced Impulse Control Dysregulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure route by which dopaminergic signalling is pharmacologically
      augmented in these patients.
    evidence:
    - reference: PMID:20457959
      reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Impulse control disorders were more common in patients treated with a
        dopamine agonist than in patients not taking a dopamine agonist (17.1% vs 6.9%;
        odds ratio [OR], 2.72; 95% confidence interval [CI], 2.08-3.54; P < .001)"
      explanation: Links the exposure to the mechanism node it acts on.
  evidence:
  - reference: PMID:20457959
    reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An association between dopamine-replacement therapies and impulse control
      disorders (ICDs) in Parkinson disease (PD) has been suggested in preliminary studies"
    explanation: Establishes the exposure-disorder association this entry curates as an
      iatrogenic route.

discussions:
- discussion_id: behavioral_addiction_classification
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does gambling disorder share a mechanism with substance addiction, or only a
    phenotype and a circuit?
  attaches_to:
  - pathophysiology#Cortico-Striato-Limbic Circuit Dysfunction
  rationale: >-
    DSM-5 placed gambling disorder among the addictive disorders, which asserts more than
    resemblance. The supporting evidence is that the same cortico-striato-limbic circuitry
    is implicated and that an opioid antagonist developed for alcohol dependence reduces
    symptoms.

    Neither observation settles it. Shared circuitry is weak evidence when the circuit in
    question mediates reinforcement generally, and would be implicated by any strongly
    reinforced behaviour. The genuinely discriminating fact is the iatrogenic arm: a
    receptor agonist produces the disorder in people without it, which is closer to a
    substance mechanism than a habit mechanism. But dopamine agonists produce compulsive
    buying, eating and sexual behaviour at comparable rates in the same cohort, so what
    they release may be a general disinhibition of appetitive behaviour rather than
    anything specific to gambling.

    The question matters for the knowledge base because it decides whether gambling
    disorder should eventually conform to a shared addiction module or stand alone.
  proposed_experiments:
  - experiment_id: gd_sud_shared_signal_comparison
    name: Direct comparison of reward prediction error signalling in gambling disorder and substance use disorder
    description: >-
      Measure striatal prediction-error responses in unmedicated gambling disorder,
      substance use disorder and controls under a common task, testing whether the two
      disorders show the same deviation rather than each differing from controls in its
      own way.
- discussion_id: dopamine_agonist_icd_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do dopamine agonists precipitate gambling in some patients and compulsive buying,
    eating or sexual behaviour in others?
  attaches_to:
  - pathophysiology#Dopamine Agonist-Induced Impulse Control Dysregulation
  rationale: >-
    In the same 3,090-patient cohort the four impulse control disorders occurred at
    broadly similar rates - gambling 5.0%, compulsive buying 5.7%, binge eating 4.3%,
    compulsive sexual behaviour 3.5% - and 3.9% of patients had two or more. A single
    pharmacological exposure therefore produces four different behavioural syndromes, and
    nothing in the cited evidence explains what determines which one a given patient
    develops.

    If the determinant is pre-existing individual liability, then the agonist is
    unmasking a predisposition and the iatrogenic cases are informative about the
    sporadic disorder. If it is arbitrary, the agonist is releasing appetitive behaviour
    non-specifically and the iatrogenic form may be a different thing that shares a name.
  proposed_experiments:
  - experiment_id: pd_prospective_icd_liability
    name: Prospective phenotyping of Parkinson patients before dopamine agonist initiation
    description: >-
      Characterise gambling attitudes, reward sensitivity and premorbid appetitive
      behaviour in treatment-naive Parkinson patients, then follow them through agonist
      initiation to test whether which impulse control disorder emerges is predicted by
      baseline liability.

notes: >-
  No GeneReviews chapter exists for gambling disorder. Verified by search: "gambling
  GeneReviews[All Fields]" returns zero results. Expected for a complex behavioural
  disorder with no Mendelian form.

  HPO has no term for gambling. The behavioural phenotype is bound to HP:0100710
  Impulsivity with a more specific preferred_term, which is the documented pattern when
  the ontology is too broad rather than wrong. Impulsivity is not specific to this
  disorder and the binding should not be read as a definition of it.

  MONDO's label for this concept is "pathological gambling", the DSM-IV name. The entry
  is named "Gambling Disorder", the DSM-5 name, because the rename accompanied the
  reclassification from impulse-control disorder to addictive disorder that this entry
  is partly about. The MONDO label is preserved verbatim in term.label as required, with
  the current clinical name carried in preferred_term.

  The iatrogenic and sporadic forms are curated as separate pathophysiology nodes rather
  than merged. They converge on the same downstream behaviour but differ in what
  initiates it, and whether they are the same disorder is recorded as an open discussion
  rather than assumed in the graph structure.

  No frequency bands are assigned to phenotypes. The prevalence record carries the
  population rate; the percentages in the Parkinson cohort are rates of the disorder in
  an exposed population, not frequencies of a phenotype among affected people, and the
  two must not be conflated.

  Deep-research provenance: the claude_code report resolved 52/52 references with
  confabulation_rate 0.0 and no unresolved identifiers. 34 of 52 were weighed on topic
  and none was flagged off topic; the remaining 18 were undecided rather than cleared,
  since a record without an abstract cannot be assessed. The reference set curated here
  was assembled independently by direct PubMed search.


name: Gambling Disorder
creation_date: "2026-08-21T00:00:00Z"
category: Complex
disease_term:
  preferred_term: gambling disorder
  term:
    id: MONDO:0011662
    label: pathological gambling
description: >-
  Persistent and recurrent problematic gambling behaviour producing substantial distress
  or impairment. DSM-5 moved it out of the impulse-control disorders and into the
  substance-related and addictive disorders - the first and still the only behavioural
  addiction placed there.

  That reclassification is a mechanistic claim, not a filing decision, and this entry is
  organised around whether it holds up. The argument for it is that gambling engages the
  same cortico-striato-limbic circuitry as drug addiction without any exogenous compound
  at all, which would mean the addicted state can be reached by reinforcement alone.

  The strongest evidence in the entry is iatrogenic rather than observational: dopamine
  agonists given for Parkinson disease produce gambling disorder in previously unaffected
  people, at roughly two and a half times the rate seen in patients not taking one. That
  is a pharmacological manipulation of dopaminergic signalling in humans that generates
  the disorder - a kind of causal evidence very few psychiatric diagnoses possess.

pathophysiology:
- name: Cortico-Striato-Limbic Circuit Dysfunction
  biological_scale: CELLULAR
  description: >-
    The anatomical substrate implicated across neurobiological studies of the disorder,
    and the same circuitry implicated in substance addiction. This node is deliberately
    described at circuit level and no lower: the cited primer places the pathophysiology
    in these structures without resolving it to a specific cellular lesion, and the entry
    does not supply one.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: G protein-coupled dopamine receptor signaling pathway
    term:
      id: GO:0007212
      label: G protein-coupled dopamine receptor signaling pathway
  downstream:
  - target: Reinforcement Learning Distortion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Endogenous Opioid Modulation of Striatal Dopamine Release
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Opioid modulation operates within this circuitry. Drawn indirect for the same
      reason the node itself is hedged - the opioid arm is inferred from drug response.
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurobiological studies have implicated cortico-striato-limbic structures
      and circuits in the pathophysiology of this disorder"
    explanation: Locates the pathophysiology at circuit level, in the terms the source
      itself uses.
- name: Dopamine Agonist-Induced Impulse Control Dysregulation
  biological_scale: MOLECULAR
  description: >-
    The iatrogenic arm, and the entry's causal anchor. Dopamine agonists prescribed for
    Parkinson disease precipitate gambling disorder in people who did not previously have
    it. In a cross-sectional study of 3,090 treated patients, an impulse control disorder
    was present in 13.6%, gambling specifically in 5.0%, and the rate was 17.1% on a
    dopamine agonist against 6.9% off one (odds ratio 2.72).

    The direction of the pharmacology is what makes this informative. Agonists at D2-like
    receptors, given for a motor indication, generate a behavioural addiction as a side
    effect - so dopaminergic signalling is not merely correlated with the disorder in
    people who already have it. The effect was similar for pramipexole and ropinirole,
    which argues for a class effect rather than an idiosyncrasy of one drug.

    This node is a distinct route into the disorder, not a description of the common
    sporadic form, and is curated as its own trigger for that reason.
  biological_processes:
  - preferred_term: regulation of dopamine receptor signaling pathway
    term:
      id: GO:0060159
      label: regulation of dopamine receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Reinforcement Learning Distortion
    causal_link_type: DIRECT
    description: >-
      Drawn as direct because the exposure is a receptor agonist and the outcome is
      measured in the same patients, but the intervening computational step is inferred
      rather than measured.
  evidence:
  - reference: PMID:20457959
    reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impulse control disorders were more common in patients treated with a
      dopamine agonist than in patients not taking a dopamine agonist (17.1% vs 6.9%;
      odds ratio [OR], 2.72; 95% confidence interval [CI], 2.08-3.54; P < .001)"
    explanation: The core iatrogenic result, with its effect size and confidence interval.
  - reference: PMID:20457959
    reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An ICD was identified in 13.6% of patients (gambling in 5.0%, compulsive
      sexual behavior in 3.5%, compulsive buying in 5.7%, and binge-eating disorder in
      4.3%)"
    explanation: Gives the gambling-specific rate and situates it among the other
      dopamine-agonist-associated impulse control disorders.
- name: Endogenous Opioid Modulation of Striatal Dopamine Release
  biological_scale: MOLECULAR
  description: >-
    Curated because a drug demands it. The best-evidenced pharmacotherapy for gambling
    disorder is opioid-receptor antagonism, not dopamine-receptor antagonism, and an
    entry whose only molecular nodes are dopaminergic cannot say what nalmefene and
    naltrexone act on.

    Endogenous opioid signalling modulates dopamine release in the ventral striatum, so
    blocking mu-opioid receptors damps the dopaminergic response to reward without
    targeting the dopamine receptor itself. This node exists to make that join explicit
    rather than leaving the treatment pointing at a node its mechanism does not describe.

    Its evidential status is weaker than the nodes around it and the entry does not
    disguise that: it is inferred from the drugs' pharmacology and their trial results,
    not from a measurement of opioid signalling in people with gambling disorder.
  biological_processes:
  - preferred_term: G protein-coupled opioid receptor signaling pathway
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
  downstream:
  - target: Reinforcement Learning Distortion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from therapeutic response. No source here measures endogenous opioid tone
      in gambling disorder, so the edge records the pharmacological rationale rather than
      an observed causal step.
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "placebo-controlled trials suggest that some medications, such as
      opioid-receptor antagonists, may be helpful"
    explanation: Marked PARTIAL because it establishes that opioid antagonism has trial
      support without establishing the opioid abnormality this node posits.
- name: Reinforcement Learning Distortion
  biological_scale: ORGANISM
  description: >-
    The functional consequence: gambling continues to be chosen despite mounting losses.
    Curated as a distortion of reinforcement rather than as a failure of willpower,
    because gambling's schedule of intermittent, variable-ratio reward is the schedule
    most resistant to extinction, and near-misses are processed as though they were
    partial wins.

    Marked ORGANISM rather than MOLECULAR because what is established is the behavioural
    output; the computational account of how the circuit produces it is a model rather
    than a measurement, and no source here measures a prediction-error signal.
  biological_processes:
  - preferred_term: reinforcement learning
    term:
      id: GO:0008306
      label: associative learning
    modifier: DYSREGULATED
  downstream:
  - target: Persistent Gambling with Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gambling disorder is characterized by a persistent, recurrent pattern of
      gambling that is associated with substantial distress or impairment"
    explanation: Establishes persistence despite harm as the defining behavioural feature.
- name: Persistent Gambling with Impairment
  biological_scale: ORGANISM
  description: >-
    The clinical disorder: continued gambling with substantial distress or functional
    impairment, frequent psychiatric comorbidity, poor quality of life and elevated
    suicide risk. A recurring theme in the cited primer is that affected people go
    unrecognised and untreated even within clinical settings, which makes under-detection
    part of the disorder's burden rather than merely an artefact of how it is studied.
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with gambling disorder often go unrecognized and untreated,
      including within clinical settings"
    explanation: Records under-recognition as a feature of the disorder's clinical course.

phenotypes:
- category: Behavioral
  name: Persistent Recurrent Gambling
  description: >-
    A persistent, recurrent pattern of gambling despite distress or impairment. Bound to
    the impulsivity term because HPO has no term for gambling; see notes.
  phenotype_term:
    preferred_term: Pathological gambling
    term:
      id: HP:0100710
      label: Impulsivity
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a persistent, recurrent pattern of gambling that is associated with
      substantial distress or impairment"
    explanation: The core behavioural phenotype in the source's own words.
- category: Psychiatric
  name: Suicidal Ideation and Suicide Mortality
  description: >-
    The outcome that makes this disorder matter, and the one an earlier version of this
    entry omitted while quoting a review that closes on it.

    In a Swedish nationwide register study of 2,099 people diagnosed with gambling
    disorder, all-cause mortality was 1.8-fold that of the general population aged 20-74,
    and suicide mortality was 15-fold. Twenty-one of the sixty-seven deaths were suicides.
    Suicide death was predicted by depression rather than by gambling severity, which
    matters clinically: the treatable predictor is the comorbidity, not the gambling.
  phenotype_term:
    preferred_term: Suicidal ideation
    term:
      id: HP:0031589
      label: Suicidal ideation
  evidence:
  - reference: PMID:30427214
    reference_title: "Gambling disorder, increased mortality, suicidality, and associated comorbidity: A longitudinal nationwide register study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMR calculations showed a 1.8-fold increase in mortality for individuals
      20-74 years old with GD compared to the general population, and a 15-fold increase
      in suicide mortality"
    explanation: Both standardized mortality ratios, quoted together because the gap
      between them is the point.
  - reference: PMID:30427214
    reference_title: "Gambling disorder, increased mortality, suicidality, and associated comorbidity: A longitudinal nationwide register study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All-cause mortality was predicted by higher age and any treatment episode
      for cardiovascular disease, whereas suicide death was predicted by depression"
    explanation: Identifies depression as the predictor of suicide death, which is what
      makes comorbidity treatment the intervention point.
- category: Psychiatric
  name: Psychiatric Comorbidity
  description: >-
    Frequent co-occurrence with other conditions, particularly other psychiatric
    disorders. Comorbidity is high enough that it complicates both ascertainment and
    treatment attribution in this literature.

    Deliberately left unbound. HPO has no term for carrying comorbid psychiatric
    diagnoses; the nearest candidate, HP:0000708 Atypical behavior, is near-maximally
    generic and classifies nothing. The cited snippet supports co-occurrence in general
    and does not name specific disorders, so binding to Depression or Anxiety would
    assert more than the source does. The one comorbidity this entry can name -
    depression as the predictor of suicide death - is curated on the phenotype above,
    where it has its own evidence.
  evidence:
  - reference: PMID:31346179
    reference_title: "Gambling disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gambling disorder frequently co-occurs with other conditions, particularly
      other psychiatric disorders"
    explanation: Establishes comorbidity as characteristic, without naming specific
      disorders - which is why no term is bound.


name: HCN1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-23T00:00:00Z"
category: Mendelian
synonyms:
- DEE24
- EIEE24
- HCN1-related developmental and epileptic encephalopathy
- Developmental and epileptic encephalopathy 24
description: >-
  HCN1-related developmental and epileptic encephalopathy (DEE24) is a
  neurodevelopmental disorder caused by variants in HCN1, which encodes the
  hyperpolarization-activated cyclic nucleotide-gated channel 1. HCN1 carries the
  Ih ("pacemaker" or "funny") current, a mixed sodium/potassium current active
  near the resting membrane potential and enriched in the dendrites of cortical
  and hippocampal pyramidal neurons. There, Ih stabilizes the resting membrane
  potential and constrains the dendritic summation of excitatory inputs, damping
  neuronal excitability. Pathogenic HCN1 variants (usually de novo missense)
  alter the Ih current - by shifting its voltage dependence, changing its
  kinetics, or creating a constitutive cation leak - so that the current no
  longer properly regulates excitability. The resulting loss of dendritic
  excitability control and cortical network hyperexcitability produces
  fever-sensitive, often drug-resistant epilepsy with developmental delay. HCN1
  variants cause a broad spectrum, from severe early-onset epileptic
  encephalopathy at one end to milder genetic generalized epilepsy and genetic
  epilepsy with febrile seizures plus (GEFS+) at the other; this entry focuses on
  the developmental and epileptic encephalopathy (severe) end of that spectrum.

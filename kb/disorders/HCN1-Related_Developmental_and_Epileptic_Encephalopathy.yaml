inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous HCN1 variants are inherited in an autosomal dominant manner. The
    severe encephalopathy usually arises from de novo variants, whereas milder
    familial variants segregate with epilepsy but show incomplete penetrance.
  inheritance_term:

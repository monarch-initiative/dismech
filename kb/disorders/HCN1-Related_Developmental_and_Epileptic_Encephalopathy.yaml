    reference_title: "De novo mutations in HCN1 cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exome sequencing for parent-offspring trios with  fever-sensitive, intractable epileptic encephalopathy, leading to the discovery  of two de novo missense HCN1 mutations."
    explanation: >-
      The founding study identified de novo HCN1 mutations in affected children.
  - reference: PMID:30351409
    reference_title: "HCN1 mutation spectrum: from neonatal epileptic encephalopathy to benign generalized epilepsy and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "19 probands carrying 14 different de novo mutations and four families  with dominantly inherited variants segregating with epilepsy in 14 individuals,  but not penetrant in six additional individuals."
    explanation: >-
      Both de novo and dominantly inherited (incompletely penetrant) HCN1 variants
      occur.

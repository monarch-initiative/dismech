prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No established prevalence or incidence; HCN1-related epilepsy is a rare
    single-gene cause within the broader developmental and epileptic
    encephalopathy population, with reported patients numbering in the low
    hundreds worldwide. No population denominator exists, so no rate is asserted.
discussions:
- discussion_id: gap_hcn1_ih_variant_effect_to_phenotype
  prompt: >-
    How does the biophysical effect of an HCN1 variant on the Ih current
    (gain-of-function/cation-leak, loss-of-function, or shifted voltage
    dependence) map to clinical severity across the spectrum (severe developmental
    and epileptic encephalopathy versus milder GEFS+/generalized epilepsy), and
    would Ih-blocking or Ih-enhancing therapy be rational for a given functional
    class?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Hyperpolarization-Activated Current
  - pathophysiology#Cortical Network Hyperexcitability
  rationale: >-
    Disease HCN1 variants have strikingly divergent effects on the Ih current, and
    the disorder spans a wide phenotypic range, so the variant's functional class
    is a plausible determinant of both severity and rational treatment. However,
    functional characterization is not available for most variants, some variants
    have mixed effects, and it is unclear whether reducing or enhancing Ih would
    help a given patient - so treatment remains empirical. Resolving the
    functional-class-to-phenotype-to-therapy mapping is central to precision care.
  proposed_experiments:
  - experiment_id: exp_hcn1_functional_class_phenotype_map
    name: HCN1 variant functional-class to phenotype and therapy mapping
    description: >-
      Characterize a large panel of patient HCN1 variants with standardized
      electrophysiology (voltage dependence, kinetics, cation-leak) to assign
      functional class, correlate class with deep clinical phenotyping, and test in
      neuronal models whether Ih blockers or enhancers normalize excitability for
      each class.
  evidence:
  - reference: PMID:24747641
    reference_title: "De novo mutations in HCN1 cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutations had striking but divergent effects  on homomeric channels."
    explanation: >-
      The divergent functional effects of HCN1 variants motivate the open
      functional-class-to-phenotype-and-therapy question.
  - reference: PMID:37565989
    reference_title: "HCN1 epilepsy: From genetics and mechanisms to precision therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variation in HCN1 causes a spectrum of disease with a genotype-phenotype relationship emerging."
    explanation: >-
      A genotype-phenotype relationship is emerging (transmembrane de novo cation-leak
      variants at the severe end), but remains incompletely mapped - the core gap.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications; response is variable and
    the epilepsy is often drug-resistant at the severe end of the spectrum.
    Importantly, drug selection is genotype-mechanism-sensitive: because the
    severe form is a gain-of-function cation leak, sodium-channel-blocking
    antiseizure medications (phenytoin, lamotrigine, oxcarbazepine, lacosamide)
    can paradoxically worsen seizures and should be used with caution, whereas
    sodium valproate has been reported to help - the same "avoid sodium-channel
    blockers" trap seen in SCN1A Dravet syndrome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:24747641
    reference_title: "De novo mutations in HCN1 cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fever-sensitive, intractable epileptic encephalopathy"
    explanation: >-
      The epilepsy is often intractable, requiring antiseizure medication.
  - reference: PMID:42357823
    reference_title: "Seizure worsening and sodium channel blockers in HCN1-related epilepsies: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment with sodium-channel-blocking ASMs including phenytoin, lamotrigine, oxcarbazepine, and lacosamide was associated with seizure worsening, with clinical improvement after drug discontinuation."
    explanation: >-
      In gain-of-function HCN1 patients, sodium-channel-blocking drugs worsened
      seizures and stopping them improved control - a clinically actionable
      gene-drug interaction.
  - reference: PMID:33822003
    reference_title: "Cation leak underlies neuronal excitability in an HCN1 developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lamotrigine exacerbated seizures and increased spiking, whereas sodium valproate reduced spiking, mirroring drug responses reported in a patient with this variant."
    explanation: >-
      The knock-in mouse reproduces the paradoxical drug responses - lamotrigine
      worsens, valproate helps - matching the patient with the same variant.

- name: HCN Channel Modulator (Org 34167, Investigational)
  description: >-
    Org 34167 is a brain-penetrant, broad-spectrum HCN-channel modulator being
    explored as a mechanism-targeted (precision) therapy: it aims to plug the
    leaky channel by restoring voltage dependence and reducing the cation leak.
    It is investigational (preclinical proof-of-concept; dose-limiting tremor in
    the model), not an approved HCN1 therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Aberrant Hyperpolarization-Activated Current
    treatment_effect: INHIBITS
    description: >-
      Restores voltage dependence of mutant HCN1 channels and reduces the
      constitutively-open cation leak.
  evidence:
  - reference: PMID:40762985
    reference_title: "Org 34167 rescues voltage dependence of mutant channels and normalizes hyperexcitability in HCN1 epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Org 34167 rescued voltage dependence of HCN1 channels carrying a range of pathogenic DEE variants in the Xenopus oocyte expression system"
    explanation: >-
      The HCN modulator restores voltage dependence of multiple pathogenic HCN1
      variants in vitro, reducing the cation leak.
  - reference: PMID:40762985
    reference_title: "Org 34167 rescues voltage dependence of mutant channels and normalizes hyperexcitability in HCN1 epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Org 34167 caused a significant reduction in interictal spiking on electrocorticography in Hcn1M249L mice and normalized performance in several behavioral assays."
    explanation: >-
      In the HCN1 DEE mouse model the modulator reduced epileptiform spiking and
      normalized behavior, proof-of-concept for mechanism-targeted therapy.

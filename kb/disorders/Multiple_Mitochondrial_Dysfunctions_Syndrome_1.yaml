      reference_title: "A fatal mitochondrial disease is associated with defective NFU1 function in the maturation of a subset of mitochondrial Fe-S proteins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Upon depletion of NFU1 by RNA interference in human cell culture, LAS and, in turn, PDHC activities were largely diminished."
      explanation: NFU1 depletion directly reduces lipoic acid synthase and then PDH activity.
  - target: Respiratory Chain Complex I and II Deficiency

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare: 38 cases and 20 NFU1 variants had been reported by 2023, with a further 19
    individuals from 10 families described in the 2022 phenotypic-continuum series. The
    original Iberian cohort shares the p.Gly208Cys founder allele.
  evidence:
  - reference: PMID:36645076
    reference_title: "Patient-specific variants of NFU1/NFU-1 disrupt cholinergic signaling in a model of multiple mitochondrial dysfunctions syndrome 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complicating our understanding of MMDS1 pathogenesis are the small number of cases (38 reported to date) and the diverse genetic variations of NFU1 that are potentially pathogenic."
    explanation: Reported-case count as of 2023.
  - reference: PMID:36256512
    reference_title: "Phenotypic continuum of NFU1-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 19 affected individuals from 10 independent families with ultra-rare bi-allelic NFU1 missense variants associated with a spectrum of early-onset pure to complex hereditary spastic paraplegia (HSP) phenotype with a longer survival (16/19) on one end and neurodevelopmental delay with severe hypotonia (3/19) on the other."
    explanation: Largest single series, expanding the phenotype.
progression:
- phase: Fatal infantile encephalopathy with pulmonary hypertension
  notes: >-
    In the classical form, infants present in the first months with hypotonia, feeding
    difficulty, seizures and pulmonary arterial hypertension, with rapid neurological
    regression and death before 15 months, frequently within 6 months.
  evidence:
  - reference: PMID:22077971
    reference_title: "A fatal mitochondrial disease is associated with defective NFU1 function in the maturation of a subset of mitochondrial Fe-S proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on ten individuals with a fatal infantile encephalopathy and/or pulmonary hypertension, leading to death before the age of 15 months."
    explanation: Original cohort course.
  - reference: PMID:25918518
    reference_title: "Clinical, biochemical, and genetic spectrum of seven patients with NFU1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characteristic clinical features included fatal infantile encephalopathy and pulmonary hypertension leading to death within the first 6 months of life in six out of seven patients."
    explanation: Confirms early lethality in an independent cohort.
- phase: Early-onset spastic paraplegia continuum
  notes: >-
    Missense alleles with residual function produce early-onset pure or complex hereditary
    spastic paraplegia with longer survival, invariable white matter abnormalities and
    reversible or irreversible decompensation after febrile illness; the same homozygous
    genotype can produce a fatal infantile course in one sib and relapsing-remitting spastic
    paraparesis in another.
  evidence:
  - reference: PMID:36256512
    reference_title: "Phenotypic continuum of NFU1-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reversible or irreversible neurological decompensation after a febrile illness was common in the cohort, and there were invariable white matter abnormalities on neuroimaging. The study suggests that MMDS1 and HSP could be the two ends of the NFU1-related phenotypic continuum."
    explanation: Defines the milder end of the continuum.
  - reference: PMID:32747156
    reference_title: "A genetic mimic of cerebral palsy: Homozygous NFU1 mutation with marked intrafamilial phenotypic variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report documents the case of a 27-month-old girl, who showed clinical signs and symptoms of spastic paraparesis with a relapsing-remitting course. The patient had a sister with a severe phenotype who died at the age of 16 months."
    explanation: Intrafamilial variability across the continuum.
genetic:
- name: NFU1
  gene_term:
    preferred_term: NFU1
    term:
      id: hgnc:16287
      label: NFU1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic NFU1 (2p13.3) variants cause MMDS1; about 20 variants (missense, splice,
    frameshift, exon deletion) are reported and over half of patients are compound
    heterozygous. The Iberian founder p.Gly208Cys (c.622G>T) and the splice-region
    c.545+5G>A / p.Arg182Gln alleles are recurrent; structural work shows that Gly208Cys and
    Gly189Arg perturb NFU1 folding and oligomerisation and abolish cluster acceptance from
    physiological donors. Variants form an allelic series with residual function tracking
    phenotype severity.
  variants:
  - name: c.622G>T (p.Gly208Cys)
    description: >
      Founder missense variant, homozygous in nine of the ten original Spanish patients;
      near the cluster-binding site, it increases dimerisation, perturbs secondary structure
      and severely reduces the ability of NFU1 to accept an Fe-S cluster.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22077971
      reference_title: "A fatal mitochondrial disease is associated with defective NFU1 function in the maturation of a subset of mitochondrial Fe-S proteins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygosity mapping revealed a perfectly overlapping homozygous region of 1.24 Mb corresponding to chromosome 2 and led to the identification of a homozygous missense mutation (c.622G > T) in NFU1, which encodes a conserved protein suggested to participate in Fe-S cluster biogenesis. Nine individuals were homozygous for this mutation, whereas one was compound heterozygous for this and a splice-site (c.545 + 5G > A) mutation."
      explanation: Original identification and founder frequency.
    - reference: PMID:28161430
      reference_title: "Understanding the Molecular Basis of Multiple Mitochondrial Dysfunctions Syndrome 1 (MMDS1)-Impact of a Disease-Causing Gly208Cys Substitution on Structure and Activity of NFU1 in the Fe/S Cluster Biosynthetic Pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Analysis of protein stability and oligomeric state demonstrates that the mutant increases the propensity to dimerize and perturbs the secondary structure composition. These changes appear to underlie the severely decreased ability of mutant NFU1 to accept an Fe/S cluster from physiologically relevant sources."
      explanation: Biochemical mechanism of the founder allele.
  - name: c.545G>A (p.Arg182Gln)
    description: >
      Missense variant near the exon 6 splice donor found in the first Canadian family; it
      causes abnormal splicing of exon 6 and no mature protein is detectable in fibroblast
      mitochondria.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21944046
      reference_title: "Mutations in iron-sulfur cluster scaffold genes NFU1 and BOLA3 cause a fatal deficiency of multiple respiratory chain and 2-oxoacid dehydrogenase enzymes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense mutation, c.545G>A, near the splice donor of exon 6 in NFU1 predicting a p.Arg182Gln substitution was found in one of the families. The mutation results in abnormal mRNA splicing of exon 6, and no mature protein could be detected in fibroblast mitochondria."
      explanation: Splicing consequence of the variant.
  - name: c.565G>A (p.Gly189Arg)
    description: >
      Recurrent missense variant, reported compound heterozygous with p.Cys210Phe in an
      Italian cavitating-leukoencephalopathy case and homozygous in a Turkish family with
      marked intrafamilial variability; in vitro it increases flexibility, decreases stability
      and shifts NFU1 toward monomer, impairing cluster acceptance.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28906594
      reference_title: "Understanding the molecular basis for multiple mitochondrial dysfunctions syndrome 1 (MMDS1): impact of a disease-causing Gly189Arg substitution on NFU1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro investigation into the structure-function relationship of the Gly189Arg derivative, along with two other variants, reveals that substitution at position 189 triggers structural changes that increase flexibility, decrease stability, and alter the monomer-dimer equilibrium toward monomer, thereby impairing the ability of the Gly189X derivatives to receive an Fe/S cluster from physiologically relevant sources."
      explanation: Structural consequence of the variant.
    - reference: PMID:32747156
      reference_title: "A genetic mimic of cerebral palsy: Homozygous NFU1 mutation with marked intrafamilial phenotypic variation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygous NM_001002755.4:c.565G>A (p.Gly189Arg) mutation was identified in the NFU1 gene; this had not previously been reported as homozygous."
      explanation: Homozygous occurrence with variable phenotype.
  evidence:
  - reference: PMID:34449775
    reference_title: "Allele-specific mitochondrial stress induced by Multiple Mitochondrial Dysfunctions Syndrome 1 pathogenic mutations modeled in Caenorhabditis elegans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To date, 20 NFU1 variants have been reported and the unique contributions of each variant to MMDS1 pathogenesis is unknown. Given that over half of MMDS1 individuals are compound heterozygous for different NFU1 variants, it is valuable to investigate individual variants in an isogenic background."
    explanation: Variant count and compound heterozygosity rate.
  - reference: PMID:28470589
    reference_title: "Novel NFU1 Variants Induced MMDS Behaved as Special Leukodystrophy in Chinese Sufferers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NGS found that the probands had homozygous mutation of c.545 + 5G > A and compound heterozygous variants of exon 4 deletion and c.721G > T in NFU1, respectively."
    explanation: Additional allele classes including an exon deletion.

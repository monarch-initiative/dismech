discussions:
- discussion_id: mmds1_pulmonary_hypertension_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pulmonary Endothelial Metabolic Dysfunction
  prompt: >
    Why does NFU1 deficiency, uniquely among the MMDS forms, cause severe pulmonary arterial
    hypertension, and is the lesion a developmental lung disorder, an endothelial metabolic
    defect as shown for BOLA3, or both?
  rationale: >
    PAH is the distinguishing feature of MMDS1 but its mechanism is undefined; autopsy
    suggests a developmental basis while the BOLA3 endothelial work implicates
    lipoate-dependent metabolism and glycine handling, and no NFU1-specific pulmonary model
    exists.
  evidence:
  - reference: PMID:42192213
    reference_title: "A Case of Multiple Mitochondrial Dysfunctions Syndrome 1 and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One unique feature of this mitochondrial disorder is the common manifestation of pulmonary arterial hypertension (PAH), for which the pathophysiologic mechanism is not well defined to date."
    explanation: Explicit statement of the gap.
- discussion_id: mmds1_no_vertebrate_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Bioenergetic Failure and Neurodegeneration
  prompt: >
    Do the available invertebrate and rodent Fe-S models reproduce the cavitating
    leukoencephalopathy and pulmonary hypertension of human NFU1 deficiency, given that the
    sex-based phenotype discrepancy described in rat models is not seen in patients?
  rationale: >
    The C. elegans allelic series reports cellular and neuromuscular phenotypes only, and the
    2026 review notes that a sex-based phenotype difference in rat MMDS models is not
    recapitulated in the human case literature, so translational validity of the animal
    models for the human CNS and pulmonary disease is an open question.
  evidence:
  - reference: PMID:42192213
    reference_title: "A Case of Multiple Mitochondrial Dysfunctions Syndrome 1 and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key difference between established animal models of this disorder and human cases published to date is that the previously described sex-based phenotype discrepancy in rats was not recapitulated in this review."
    explanation: Documents a model-human mismatch.
notes: >
  Curated as a per-gene Disease entry (stub entry_type decision: DISEASE), the same
  granularity as Multiple_Mitochondrial_Dysfunctions_Syndrome_9B and the open MMDS4/MMDS6
  PRs; MMDS2 (BOLA3) and MMDS5 (ISCA1) are curated as sibling entries in the same tranche and
  share the lipoate-deficiency chain, which is duplicated rather than inherited. The
  pulmonary node conforms to pulmonary_vascular_remodeling at its endothelial-dysfunction
  entry point on the strength of the BOLA3 endothelial data; the NFU1-specific mechanism is
  recorded as a knowledge gap. Sources: the 2011 discovery papers (PMID:21944046,
  PMID:22077971), cohort and case series (PMID:25918518, PMID:25477904, PMID:29441221,
  PMID:28470589, PMID:32747156, PMID:36256512, PMID:31970900, PMID:42192213), structural and
  biochemical work (PMID:28161430, PMID:28906594, PMID:32776106, PMID:32151725, PMID:37823603,
  PMID:28803783), reviews (PMID:34440194, PMID:35883565) and the C. elegans models

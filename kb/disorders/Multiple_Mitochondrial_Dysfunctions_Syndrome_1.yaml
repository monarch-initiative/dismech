        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Phenotypes were variable between the mutant nfu-1 alleles and generally presented as an allelic series indicating that not all variants have lost complete function."
        explanation: Reports the allelic-series readout.
    evidence:
    - reference: PMID:36645076
      reference_title: "Patient-specific variants of NFU1/NFU-1 disrupt cholinergic signaling in a model of multiple mitochondrial dysfunctions syndrome 1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Each of these mutants, Gly147Arg and Gly166Cys, have altered acetylcholine signaling at neuromuscular junctions, but opposite effects on activity and motility."

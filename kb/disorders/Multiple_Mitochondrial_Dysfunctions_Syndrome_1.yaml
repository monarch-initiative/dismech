name: Multiple Mitochondrial Dysfunctions Syndrome 1
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- MMDS1
- NFU1 deficiency
- NFU1-related multiple mitochondrial dysfunctions syndrome
- Fatal infantile encephalopathy with pulmonary hypertension due to NFU1 deficiency
description: >
  Multiple mitochondrial dysfunctions syndrome 1 (MMDS1; OMIM #605711) is the index form of
  the MMDS series, an autosomal recessive disorder of mitochondrial iron-sulfur (Fe-S)
  cluster biogenesis caused by biallelic variants in NFU1. NFU1 is a late-acting [4Fe-4S]
  cluster carrier that receives clusters from ISCU2 and ISCA1 and delivers them to a
  specific subset of mitochondrial targets, above all lipoic acid synthase (LIAS) and
  succinate dehydrogenase. Loss of NFU1 therefore produces a combined deficiency of the four
  lipoate-dependent 2-oxoacid dehydrogenases and the glycine cleavage system, together with
  respiratory chain complexes I and II, with reduced protein-bound lipoic acid, lactic
  acidosis and non-ketotic hyperglycinemia as the biochemical signature. The classical
  presentation is a fatal infantile encephalopathy with pulmonary arterial hypertension,
  hypotonia, seizures and death before 15 months, often with a cavitating
  leukoencephalopathy on MRI and neurological decompensation after intercurrent infection.
  A homozygous p.Gly208Cys (c.622G>T) founder variant accounts for the original Iberian
  cohort; subsequent series have broadened the phenotype to include a longer-surviving
  early-onset hereditary spastic paraplegia end of a continuum, sometimes with marked
  intrafamilial variability. Treatment is supportive, with management of pulmonary
  hypertension, seizures and nutrition; no therapy corrects the metabolic defect.

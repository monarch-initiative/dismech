- name: Caenorhabditis elegans nfu-1 patient-variant knock-ins
  species: Caenorhabditis elegans
  genotype: nfu-1 (formerly lpd-8) CRISPR knock-ins of patient NFU1 variants (five alleles including Gly147Arg and Gly166Cys)
  publication: PMID:34449775
  description: >
    Exact patient variants recreated in the worm orthologue form an allelic series of
    respiratory dysfunction and oxidative stress, with mitochondrial reactive iron in some
    alleles; Gly147Arg and Gly166Cys alter acetylcholine signalling at neuromuscular junctions
    with opposite effects on motility, and knockdown of acetylcholine release rescues the
    Gly147Arg phenotypes.

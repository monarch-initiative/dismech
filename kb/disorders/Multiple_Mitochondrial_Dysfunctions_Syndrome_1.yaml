pathophysiology:
- name: Biallelic NFU1 Loss of Function
  description: >
    Pathogenic variants abolish mature mitochondrial NFU1 or disrupt its structure so that it
    can no longer receive a [4Fe-4S] cluster. NFU1 dimerises and reductively assembles a
    bridging [4Fe-4S] cluster from two [2Fe-2S] clusters donated by the scaffold ISCU2 and the
    carrier ISCA1, aided by ferredoxin 2, through a conserved hydrophobic patch at its
    C-terminal helix; disease variants near the cluster-binding site perturb folding and
    oligomerisation and block this acceptance.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: 4 iron, 4 sulfur cluster binding
    term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    modifier: DECREASED
  downstream:
  - target: Defective Delivery of 4Fe-4S Clusters to NFU1-Dependent Targets
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32776106
      reference_title: "Assembly of the [4Fe-4S] cluster of NFU1 requires the coordinated donation of two [2Fe-2S] clusters from the scaffold proteins, ISCU2 and ISCA1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, we showed that NFU1 lost its ability to acquire its Fe-S cluster when mutagenized at the identified site of interaction with ISCU2 and ISCA1, which thereby adversely affected biochemical functions of proteins that are thought to acquire their Fe-S clusters directly from NFU1, such as lipoic acid synthase, which supports the Fe-S-dependent process of lipoylation of components of multiple key enzyme complexes, including pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase and the glycine cleavage complex."
      explanation: Loss of cluster acquisition by NFU1 directly impairs its downstream targets.
  evidence:
  - reference: PMID:32776106
    reference_title: "Assembly of the [4Fe-4S] cluster of NFU1 requires the coordinated donation of two [2Fe-2S] clusters from the scaffold proteins, ISCU2 and ISCA1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this work, using genetic and biochemical approaches, we identified the initial scaffold protein, mitochondrial ISCU (ISCU2) and the secondary carrier, ISCA1, as the direct donors of Fe-S clusters to mitochondrial NFU1, which appears to dimerize and reductively mediate the formation of a bridging"
    explanation: Defines the normal function that the variants disrupt.
  - reference: PMID:22077971
    reference_title: "A fatal mitochondrial disease is associated with defective NFU1 function in the maturation of a subset of mitochondrial Fe-S proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, yeast Nfu1 protein carrying the individuals' missense mutation was functionally impaired. We conclude that NFU1 functions as a late-acting maturation factor for a subset of mitochondrial Fe-S proteins."
    explanation: Functional impairment of the patient allele.
- name: Defective Delivery of 4Fe-4S Clusters to NFU1-Dependent Targets
  description: >
    NFU1 is a specific, late-acting maturation factor: its depletion diminishes lipoic acid
    synthase and succinate dehydrogenase (and, via the ISCA1-NFU1 node, the [4Fe-4S]
    mitoribosome assembly factor METTL17) but spares most other Fe-S proteins, unlike
    depletion of the general scaffold ISCU. NFU1 also requires BOLA3 for its stability.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  downstream:

- name: Genital Tubercle Outgrowth Defect
  biological_scale: TISSUE
  description: >-
    Genital hypoplasia is the third leg of the diagnostic triad and is a primary
    developmental defect, not an endocrine one: Ror2 is expressed in the genital
    tubercle and the tubercle is reduced in size in Ror2-null mice. That matters
    clinically, because it predicts a structural micropenis that responds only
    partially to androgen therapy.

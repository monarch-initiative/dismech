    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skeletal abnormalities include short stature, mesomelic or acromesomelic
      limb shortening, hemivertebrae with fusion of thoracic vertebrae, and
      brachydactyly.
    explanation: >-
      GeneReviews lists brachydactyly among the core skeletal abnormalities.
- category: Skeletal
  name: Vertebral Segmentation Defects
  description: >-
    Hemivertebrae, thoracic vertebral fusion, and rib fusions. These are
    characteristic of the recessive ROR2-related form and are notably absent
    from the dominant form — historically the main clinical discriminator
    between the two, and the reason the recessive form was originally named
    COVESDEM.

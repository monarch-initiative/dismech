- name: Increased Cranial Bone Mineral Density
  biological_scale: TISSUE
  description: >-
    A DVL1-specific consequence. High-resolution peripheral quantitative CT in
    molecularly confirmed patients shows a distinctive pattern — low cortical but
    increased trabecular bone mineral density, with fewer and thicker
    trabeculations — and cranial osteosclerosis is confined to the DVL1 (and one
    GPC4) genotype. This is the structural basis of the osteosclerotic variant of
    the syndrome, including its choanal atresia and cranial nerve compression.

  - target: Dislocated Radial Head
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Radial head dislocation follows from disproportionate growth of the paired
      forearm bones rather than from a primary joint defect.
- name: Craniofacial Midline Outgrowth Defect
  biological_scale: TISSUE
  description: >-
    The "fetal face" of Robinow syndrome — hypertelorism, broad prominent
    forehead, short upturned nose, midface retrusion — is a midline outgrowth
    failure of the frontonasal region rather than a collection of independent
    dysmorphisms. In the Ror2-null mouse the craniofacial phenotype is
    attributable to a midline outgrowth defect; abnormal WNT5A signalling
    likewise underlies the mandibular hypoplasia of the syndrome.
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  evidence:
  - reference: PMID:14745966
    reference_title: "Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, we show that the craniofacial phenotype is caused by a midline
      outgrowth defect.
    explanation: >-
      Supplies the developmental mechanism for the craniofacial phenotype in the
      pathway-null model.
  downstream:
  - target: Fetal Facies
    causal_link_type: DIRECT
    description: >-
      Failed midline outgrowth produces the characteristic facial gestalt.
  - target: Prominent Forehead
    causal_link_type: DIRECT
    description: >-
      A component of the same midline outgrowth failure.
  - target: Short Nose
    causal_link_type: DIRECT
    description: >-
      The nasal component of the frontonasal outgrowth defect.
  - target: Macrocephaly
    causal_link_type: DIRECT
    description: >-

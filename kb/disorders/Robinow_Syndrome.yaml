name: Robinow Syndrome
synonyms:
- fetal face syndrome
- fetal facies syndrome
- Robinow dwarfism
- COVESDEM syndrome
- costovertebral segmentation defect with mesomelia
- RS
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Robinow syndrome is a genetically heterogeneous skeletal dysplasia defined by
  a triad of mesomelic (middle-segment) limb shortening, genital hypoplasia, and
  a distinctive "fetal face" appearance with macrocephaly, a broad prominent
  forehead, ocular hypertelorism, a short upturned nose, and midface retrusion.
  All six established causal genes — WNT5A, ROR2, DVL1, DVL3, FZD2, and NXN —
  encode components of one signalling module: the beta-catenin-independent
  WNT/planar cell polarity (PCP) pathway, in which WNT5A is the ligand, ROR2 and
  FZD2 the co-receptors, DVL1/DVL3 the cytoplasmic transducers, and NXN a redox
  regulator of DVL. The syndrome therefore behaves as a pathway disease rather
  than a set of coincidentally similar entities: different genes, different
  inheritance modes, one converging mechanism. Biallelic ROR2 loss of function
  gives the more severe autosomal recessive form, in which vertebral
  segmentation defects (hemivertebrae, rib fusions) are prominent; heterozygous
  WNT5A missense and DVL1/DVL3 penultimate-exon frameshift alleles give the
  milder autosomal dominant forms, with the DVL1 alleles additionally producing
  a distinctive osteosclerotic variant with increased cranial bone mineral
  density and hearing loss.
disease_term:
  preferred_term: Robinow syndrome
  term:
    id: MONDO:0019978
    label: Robinow syndrome
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
- WNT/planar cell polarity pathway disorder
notes: >-
  Scope and lump/split decision. This entry is curated as ONE disease with
  gene-defined subtypes rather than as six separate entries, because every
  causal gene acts in a single signalling module and the clinical entity is
  recognized as one syndrome across them. That follows the published framing:
  PMID:35047859 describes "six genes that converge on the WNT/planar cell
  polarity (PCP) signaling pathway", and its phenotypic-similarity clustering
  found no separation between the NXN-recessive and the dominant forms. MONDO
  and the ISDS Nosology both split the entity per gene; those splits are
  represented here as ``has_subtypes`` entries carrying their own MONDO terms,
  so nothing in either classification is lost.

  DVL2 (PMID:35047859) and GPC4 and RAC3 (PMID:29276006) are reported as
  candidate or single-family loci for Robinow or Robinow-like phenotypes. They
  are described in the genetic section but are deliberately NOT given
  ``has_subtypes`` entries: neither the ISDS Nosology's 2023 revision nor MONDO
  lists them as established Robinow subtypes, and a single reported variant is
  not yet nosologic autonomy.

  Brachydactyly type B is allelic at ROR2 but is a different disease with a
  different mechanism (heterozygous, presumed gain-of-function/dominant-negative
  alleles rather than biallelic loss of function); it is a differential
  diagnosis here, not a subtype.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian developmental disorder of a defined signalling pathway;
      tagged on the genetics axis rather than to an organ-system chapter.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias". This
      dismech entry covers six consecutive rows of that group, one per causal
      gene: NOS 15-0050 "Robinow syndrome, WNT5A-related" (MIM 180700, AD),
      NOS 15-0060 "Robinow syndrome, DVL1-related" (MIM 616331, AD),
      NOS 15-0070 "Robinow syndrome, DVL3-related" (MIM 616894, AD),
      NOS 15-0080 "Robinow syndrome, FZD2-related" (AD, no MIM given in the
      table), NOS 15-0090 "Robinow syndrome, recessive type, ROR2-related"
      (MIM 268310, AR) and NOS 15-0100 "Robinow syndrome, recessive type,
      NXN-related" (AR, no MIM given). All six rows are in group 15, so the
      single assignment is not a lump across groups. The ROR2 row's own comment
      records that it subsumes the previous COVESDEM designation and
      cross-references brachydactyly type B. The 2019 revision (Mortier et al.,
      PMID:31633310) numbered the same group 17.
has_subtypes:
- name: DRS1
  display_name: Autosomal Dominant Robinow Syndrome 1 (WNT5A-related)
  description: >-
    Heterozygous WNT5A missense alleles substituting highly conserved cysteine
    residues, first identified in the original family described by Robinow.
    The alleles behave as hypomorphs rather than nulls in functional assays.
    Skeletal involvement is milder than in the ROR2-related recessive form.
  subtype_term:
    preferred_term: autosomal dominant Robinow syndrome 1
    term:
      id: MONDO:0024455
      label: autosomal dominant Robinow syndrome 1
- name: DRS2
  display_name: Autosomal Dominant Robinow Syndrome 2 (DVL1-related)
  description: >-
    Heterozygous frameshift alleles clustered in the penultimate exon of DVL1
    that escape nonsense-mediated decay and generate a C-terminally truncated
    protein with a -1 reading-frame terminus. This subtype carries the
    osteosclerotic variant of the syndrome: normal stature, persistent
    macrocephaly, increased cranial bone mineral density, and hearing loss.
  subtype_term:
    preferred_term: autosomal dominant Robinow syndrome 2
    term:
      id: MONDO:0014591
      label: autosomal dominant Robinow syndrome 2
- name: DRS3
  display_name: Autosomal Dominant Robinow Syndrome 3 (DVL3-related)
  description: >-
    Heterozygous de novo DVL3 alleles — splice-acceptor variants and single-base
    deletions — that, like the DVL1 alleles, all produce a -1 frameshift of the
    last exon. The mechanistic parallel between the DVL1 and DVL3 alleles is the
    reason the paralog was sequenced in the first place.
  subtype_term:
    preferred_term: autosomal dominant Robinow syndrome 3
    term:
      id: MONDO:0014819
      label: autosomal dominant Robinow syndrome 3
- name: FZD2-RS
  display_name: FZD2-related Robinow Syndrome
  description: >-
    Heterozygous FZD2 variants, identified through the WNT5A interactome.
    Missense and truncating FZD2 alleles separate into two phenotypically
    distinguishable groups. FZD2 is also the gene for autosomal dominant
    omodysplasia, and the two presentations overlap clinically. No gene-specific
    MONDO class exists for the FZD2 form, so ``subtype_term`` below repeats the
    parent MONDO class rather than asserting a more specific one that does not
    exist; the ISDS row (NOS 15-0080) likewise carries no MIM number.
  subtype_term:
    preferred_term: Robinow syndrome
    term:
      id: MONDO:0019978
      label: Robinow syndrome
- name: RRS
  display_name: Autosomal Recessive Robinow Syndrome (ROR2-related)
  description: >-
    Biallelic ROR2 loss-of-function alleles. This is the severe end of the
    spectrum: generalized rather than purely mesomelic limb shortening, marked
    short stature, and segmental defects of the spine with hemivertebrae and rib
    fusions that are characteristically absent from the dominant forms. Formerly
    designated COVESDEM syndrome.
  subtype_term:
    preferred_term: autosomal recessive Robinow syndrome
    term:
      id: MONDO:0009999
      label: autosomal recessive Robinow syndrome
- name: RRS2
  display_name: Autosomal Recessive Robinow Syndrome 2 (NXN-related)
  description: >-
    Biallelic NXN variants, identified in two families through the WNT5A
    interactome. Despite the recessive inheritance, phenotypic clustering places
    NXN probands with the dominant DVL-related probands rather than with the
    ROR2-related recessive form.
  subtype_term:
    preferred_term: robinow syndrome, autosomal recessive 2
    term:
      id: MONDO:0032800
      label: robinow syndrome, autosomal recessive 2
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  description: >-
    The WNT5A, DVL1, DVL3, and FZD2 forms are inherited in an autosomal dominant
    manner. The DVL1 and DVL3 alleles are typically de novo; the WNT5A allele in
    the original Robinow family segregates through several generations.
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADRS is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the inheritance mode for the dominant forms curated
      here as DRS1, DRS2, DRS3, and FZD2-RS.
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five families in which samples from unaffected parents were available,
      the variants were demonstrated to represent de novo mutations.
    explanation: >-
      Establishes that the DVL1 dominant alleles arise de novo in most families,
      which is why an unaffected-parent pedigree does not exclude the diagnosis.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The ROR2 and NXN forms are inherited in an autosomal recessive manner.
    Parental consanguinity is common in ROR2-related families, and a founder
    nonsense allele accounts for a large Omani cohort.
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ROR2-related Robinow syndrome is inherited in an autosomal recessive
      manner.
    explanation: >-
      GeneReviews states the inheritance mode for the ROR2-related form.
  - reference: PMID:10932186
    reference_title: "Recessive Robinow syndrome, allelic to dominant brachydactyly type B, is caused by mutation of ROR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report homozygous missense mutations in both intracellular and
      extracellular domains of ROR2 in affected individuals from 3 unrelated
      consanguineous families, and a nonsense mutation that removes the tyrosine
      kinase domain and all subsequent 3' regions of the gene in 14 patients
      from 7 families from Oman.
    explanation: >-
      Documents homozygous ROR2 alleles segregating in consanguineous families,
      establishing recessive inheritance for this subtype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. A 2002 review counted over
    100 published cases across both inheritance modes; case ascertainment has
    grown since molecular diagnosis became available, but no registry
    denominator has been published, so the count is reported here rather than a
    rate.
  evidence:
  - reference: PMID:12011143
    reference_title: "Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over 100 cases have now been reported and we have reviewed the current
      knowledge of the clinical and genetic features of the syndrome.
    explanation: >-
      Establishes the order of magnitude of published cases as of 2002, the
      basis for the ULTRA_RARE band in the absence of a population denominator.
pathophysiology:
- name: WNT5A Ligand Hypofunction
  biological_scale: MOLECULAR
  genes:
  - preferred_term: WNT5A
    term:
      id: hgnc:12784
      label: WNT5A
  genetic_context:
    gene:
      preferred_term: WNT5A
      term:
        id: hgnc:12784
        label: WNT5A
    allele_type: missense
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  description: >-
    Heterozygous WNT5A missense alleles substitute highly conserved cysteine
    residues (C83S, C182R). In zebrafish and Xenopus assays the mutant ligands
    retain partial activity, so they behave as hypomorphs rather than nulls —
    which is consistent with the milder dominant phenotype relative to complete
    receptor loss.
  molecular_functions:
  - preferred_term: WNT5A frizzled/ROR2 receptor binding
    modifier: DECREASED
    term:
      id: GO:0005109
      label: frizzled binding
  evidence:
  - reference: PMID:19918918
    reference_title: "WNT5A mutations in patients with autosomal dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that two different missense mutations in WNT5A, which result in
      amino acid substitutions of highly conserved cysteines, are associated
      with autosomal dominant Robinow syndrome
    explanation: >-
      Identifies the conserved-cysteine missense alleles that define this node.
  - reference: PMID:19918918
    reference_title: "WNT5A mutations in patients with autosomal dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This data suggests that both the C182R and C83S mutations create
      phenotypes due to expression of less active (hypomorphic) forms of WNT5A.
    explanation: >-
      Supports the hypomorphic rather than null character of the ligand defect,
      which is the specific claim this node makes.
  downstream:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Reduced ligand activity lowers the signal entering the ROR2/FZD2-DVL
      cascade.
- name: ROR2 Receptor Loss of Function
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  genetic_context:
    gene:
      preferred_term: ROR2
      term:
        id: hgnc:10257
        label: ROR2
    allele_type: missense, nonsense, frameshift, or whole-exon deletion
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic ROR2 alleles abolish receptor function by two routes. Truncating
    alleles introduce premature stop codons upstream of the brachydactyly-type-B
    positions and predict nonfunctional protein, with the transcripts degraded
    by nonsense-mediated decay; missense alleles produce protein that is
    retained in the endoplasmic reticulum and so never reaches the cell surface.
    Both routes converge on absence of the receptor. Exonic deletion alleles
    reinforce the loss-of-function reading.
  molecular_functions:
  - preferred_term: ROR2 co-receptor engagement of WNT5A
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005109
      label: frizzled binding
  evidence:
  - reference: PMID:10932187
    reference_title: "Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ROR2 mutations present in RRS result in premature stop codons and
      predict nonfunctional proteins.
    explanation: >-
      Establishes the loss-of-function consequence of the recessive ROR2
      alleles, as distinct from the dominant brachydactyly type B alleles.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While truncating variant mRNAs are degraded by nonsense-mediated decay
      (Ben-Shachar et al. 2009), mutant protein caused by missense variants are
      retained in the endoplasmic reticulum and ultimately lead to the absence
      of the ROR2 receptor
    explanation: >-
      Supplies the two molecular routes — NMD and ER retention — by which
      different allele classes reach the same absent-receptor endpoint.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of exonic deletion variant alleles further supports the
      contention of a loss-of-function mechanism in the etiology of the
      syndrome.
    explanation: >-
      Whole-exon deletions cannot act by a gain-of-function route, so they
      corroborate loss of function as the mechanism.
  downstream:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Absence of the WNT5A co-receptor blocks transduction at the membrane.
- name: DVL1/DVL3 C-Terminal Truncation Escaping Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DVL1
    term:
      id: hgnc:3084
      label: DVL1
  - preferred_term: DVL3
    term:
      id: hgnc:3087
      label: DVL3
  genetic_context:
    genes:
    - preferred_term: DVL1
      term:
        id: hgnc:3084
        label: DVL1
    - preferred_term: DVL3
      term:
        id: hgnc:3087
        label: DVL3
    allele_type: penultimate-exon -1 frameshift escaping nonsense-mediated decay
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      DOMINANT_NEGATIVE is a mechanistic reading of an NMD-escaping
      altered-C-terminus allele expressed alongside wild type, not a term the
      cited papers use verbatim. The evidence establishes the NMD escape and the
      altered protein product; the category is the inference, and the
      ``dvl_frameshift_mode_of_action`` discussion records it as open.
  description: >-
    The dominant DVL1 and DVL3 alleles are not simple loss-of-function. They are
    frameshifts confined to the penultimate exon whose premature termination
    codon falls in the last exon, so the transcript escapes nonsense-mediated
    decay and is expressed alongside the wild-type allele. The product is a
    Dishevelled protein with an intact core and a novel -1 reading-frame
    C-terminus — an altered, not absent, transducer. Both wild-type and variant
    transcripts are detectable in patient leukocytes. Functional work published
    in 2026 separates two effects that had been conflated: the frameshift
    protein transduces canonical and JNK-PCP WNT signal less efficiently than
    wild type, but so does a plain stop codon at the same position, whereas only
    the frameshift protein mislocalizes to the nucleus and only it perturbs
    morphogenesis in Drosophila. The novel peptide therefore does something the
    absence of the wild-type C-terminus does not.
  biological_processes:
  - preferred_term: Dishevelled-mediated WNT signal transduction
    modifier: DYSREGULATED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variant alleles are predicted to result in a premature termination
      codon within the last exon, escape nonsense-mediated decay (NMD), and most
      likely generate a C-terminally truncated protein with a distinct -1
      reading-frame terminus.
    explanation: >-
      States the NMD-escape and altered-C-terminus mechanism that distinguishes
      these alleles from ordinary truncating loss-of-function variants.
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Study of the transcripts extracted from affected subjects' leukocytes
      confirmed expression of both wild-type and variant alleles, supporting the
      hypothesis that mutant mRNA escapes NMD.
    explanation: >-
      Direct patient-derived evidence that the mutant transcript is expressed
      rather than degraded.
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all variants in DVL3 result in a -1 frameshift, indicating that these
      highly specific alterations might be a common cause of dominant Robinow
      syndrome
    explanation: >-
      Extends the same -1 frameshift mechanism from DVL1 to its paralog DVL3.
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In luciferase assays carried out in facial mesenchyme, wtDVL1 activated
      canonical and JNK-PCP WNT signalling whereas the DVL11519* and the
      DVL11519ΔT variant had significantly lower signaling activity.
    explanation: >-
      Measures the signalling consequence directly: the frameshift protein
      transduces both canonical and PCP WNT signal less well than wild type,
      which is the loss-of-signalling half of the allele's effect.
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also determined that there is mislocalization of the protein expressed
      from DVL11519ΔT in the nucleus while the other two constructs were
      expressed in the cytoplasm.
    explanation: >-
      The frameshift protein, and only it, is mislocalized to the nucleus. A
      simple truncation at the same codon is not, so this is a property the
      novel C-terminal peptide confers rather than a consequence of losing the
      wild-type one.
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In complementary Drosophila experiments using a variety of readouts, only
      the DVL11519ΔT variant and not the 1519* impacted morphogenesis and
      signaling.
    explanation: >-
      The discriminating experiment: the frameshift allele perturbs
      morphogenesis where a stop codon at the same position does not, so the
      phenotype cannot be explained by loss of the C-terminus alone.
  downstream:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    causal_link_type: DIRECT
    description: >-
      An altered Dishevelled C-terminus perturbs transduction downstream of the
      receptor complex.
  - target: Increased Cranial Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The DVL1 alleles specifically, and not the other Robinow genotypes, are
      associated with the osteosclerotic form of the disease.
- name: FZD2 Co-Receptor Dysfunction
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FZD2
    term:
      id: hgnc:4040
      label: FZD2
  description: >-
    Heterozygous FZD2 variants were found by screening the WNT5A interactome in
    Robinow families that were negative for the previously known genes. FZD2 is
    the Frizzled receptor through which WNT5A engages the Dishevelled proteins.
    Missense and truncating alleles do not behave identically: they separate into
    two phenotypically distinguishable groups, so allele class matters for
    prognosis within this subtype.
  molecular_functions:
  - preferred_term: FZD2 WNT co-receptor function
    modifier: DECREASED
    term:
      id: GO:0005109
      label: frizzled binding
  evidence:
  - reference: PMID:29276006
    reference_title: "WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, four families with variants in FZD2 were identified as well as
      three individuals from two families with biallelic variants in NXN that
      co-segregate with the phenotype.
    explanation: >-
      Establishes FZD2 as a Robinow syndrome gene with segregating variants in
      four families.
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with FZD2 variants clustered into two groups with demonstrable
      phenotypic differences between those with missense and truncating alleles.
    explanation: >-
      Supports the allele-class-dependent effect asserted by this node.
  downstream:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    causal_link_type: DIRECT
    description: >-
      FZD2 is the receptor arm that triggers the DVL homologs; its dysfunction
      attenuates the same cascade.
- name: NXN Loss of Function
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NXN
    term:
      id: hgnc:18008
      label: NXN
  description: >-
    Nucleoredoxin is a thioredoxin-family redox protein that binds Dishevelled
    and regulates its availability for WNT signal transduction. Biallelic NXN
    variants were identified in two families through the same WNT5A-interactome
    screen that found FZD2, placing an upstream redox regulator of DVL inside
    the Robinow gene set.
  biological_processes:
  - preferred_term: NXN redox regulation of Dishevelled
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  evidence:
  - reference: PMID:29276006
    reference_title: "WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, both FZD2 and NXN are relevant protein partners in the WNT5A
      interactome, supporting their role in skeletal development.
    explanation: >-
      Places NXN as a WNT5A-interactome partner, the basis for treating its loss
      as an input to the same pathway node.
  downstream:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Loss of the DVL redox regulator perturbs transduction at the Dishevelled
      step.
- name: Disrupted WNT/Planar Cell Polarity Signal Transduction
  biological_scale: CELLULAR
  description: >-
    The convergence node of the entry. Every established Robinow gene sits in the
    beta-catenin-independent WNT/PCP cascade — WNT5A ligand, ROR2 and FZD2
    receptors, DVL1/DVL3 transducers, NXN regulator — so genotypes that look
    unrelated produce one clinical syndrome. PCP signalling orients cells within
    the plane of a tissue and drives the polarized, directional cell behaviour
    on which axial elongation, limb outgrowth, midline fusion, and genital
    tubercle formation all depend.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED

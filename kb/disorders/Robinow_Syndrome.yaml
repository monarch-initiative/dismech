    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recessive form of Robinow syndrome (RRS; OMIM 268310), particularly
      frequent in Turkey, has a high incidence of abnormalities of the vertebral
      column such as hemivertebrae and rib fusions, which is not seen in the
      dominant form.
    explanation: >-
      States both the frequency of the vertebral defects in the recessive form
      and their absence from the dominant form.
- category: Skeletal
  name: Rib Fusion
  description: >-
    Fusion of ribs, part of the axial segmentation phenotype of the recessive
    form. Rib fusion has been proposed as near-pathognomonic for the recessive
    form but is not universally present in molecularly confirmed cases, so its
    absence does not exclude that subtype.

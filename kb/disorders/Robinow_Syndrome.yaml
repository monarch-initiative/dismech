genetic:
- name: ROR2
  gene_term:
    preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  relationship_type: CAUSATIVE
  subtype: RRS
  notes: >-
    Receptor tyrosine kinase-like orphan receptor 2, the WNT5A co-receptor.
    Biallelic loss-of-function alleles cause the recessive form. Reported
    alleles include missense, nonsense, frameshift, and whole-exon deletions,
    concentrated in exons 5, 6, and 9. Heterozygous ROR2 alleles at different
    positions cause brachydactyly type B by a distinct, non-loss-of-function
    mechanism.
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 25 putatively pathogenic ROR2 variants, 16 novel, including
      single nucleotide variants and exonic deletions.
    explanation: >-
      Documents the allelic spectrum, including deletions, in a molecularly
      confirmed cohort.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gain-of-function (GoF) ROR2 variants have been associated with autosomal
      dominant brachydactyly type B (MIM 113000)
    explanation: >-
      Establishes the allelic-but-mechanistically-distinct relationship to
      brachydactyly type B that justifies excluding it as a subtype here.
- name: WNT5A
  gene_term:
    preferred_term: WNT5A
    term:
      id: hgnc:12784
      label: WNT5A
  relationship_type: CAUSATIVE
  subtype: DRS1
  notes: >-
    The non-canonical WNT ligand. Heterozygous missense alleles at conserved
    cysteines (C83S, C182R) cause DRS1. Biallelic WNT5A loss of function has
    been reported once, in an infant with a severe atypical presentation.
  evidence:
  - reference: PMID:19918918
    reference_title: "WNT5A mutations in patients with autosomal dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One mutation has been found in all living affected members of the original
      family described by Meinhard Robinow and another in a second unrelated
      patient.
    explanation: >-
      Segregation in the original Robinow pedigree plus a second independent
      family supports causality.
- name: DVL1
  gene_term:
    preferred_term: DVL1
    term:
      id: hgnc:3084
      label: DVL1
  relationship_type: CAUSATIVE
  subtype: DRS2
  notes: >-
    Dishevelled 1. Heterozygous frameshift alleles confined to the penultimate
    exon cause DRS2, including the osteosclerotic variant. The alleles are
    neither null nor simple truncations: the transcript escapes nonsense-mediated
    decay and produces a protein with a novel -1 reading-frame C-terminus. The
    ``DOMINANT_NEGATIVE`` category recorded on the corresponding pathophysiology
    node is a mechanistic reading of that architecture, not a term the cited
    papers use verbatim; see the ``dvl_frameshift_mode_of_action`` discussion.
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, six distinct frameshift mutations were found in eight subjects,
      and all were heterozygous truncating variants within the penultimate exon
      of DVL1.
    explanation: >-
      Establishes the gene, the allele class, and the exon restriction.
- name: DVL3
  gene_term:
    preferred_term: DVL3
    term:
      id: hgnc:3087
      label: DVL3
  relationship_type: CAUSATIVE
  subtype: DRS3
  notes: >-
    Dishevelled 3, the paralog of DVL1. De novo heterozygous splice-acceptor
    variants and single-base deletions all produce the same -1 frameshift of the
    last exon. The gene was sequenced precisely because of that mechanistic
    parallel. The same caveat as DVL1 applies: the dominant-negative reading is
    inferred from the NMD-escaping -1 frameshift architecture rather than stated
    by the source.
  evidence:
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      targeted sequencing identified five unrelated individuals harboring
      heterozygous, de novo frameshift variants in DVL3, including two splice
      acceptor mutations and three 1 bp deletions
    explanation: >-
      Establishes DVL3 as a Robinow gene with de novo alleles in five unrelated
      individuals.
- name: FZD2
  gene_term:
    preferred_term: FZD2
    term:
      id: hgnc:4040
      label: FZD2
  relationship_type: CAUSATIVE
  subtype: FZD2-RS
  notes: >-
    Frizzled 2, the WNT5A receptor that triggers the Dishevelled proteins.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More pronounced skeletal involvement and marked short stature are observed
      in the autosomal recessive (AR) form of RS (AR-RS), initially described as
      COVESDEM syndrome
    explanation: >-
      Records short stature and its greater severity in the recessive form.
- category: Skeletal
  name: Brachydactyly
  description: >-
    Short digits, part of the acral component of the skeletal phenotype and one
    of the features present in essentially all molecularly confirmed patients.

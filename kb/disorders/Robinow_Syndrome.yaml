animal_models:
- name: Ror2-null mouse
  species: Mouse
  genotype: Ror2(-/-)
  publication: PMID:14745966
  description: >-
    Constitutive Ror2 knockout, the reference developmental model for the
    recessive form. Its value is that it resolves the syndrome into separate
    developmental defects at separate sites rather than one global growth
    failure.
  modeled_mechanisms:
  - target: Reduced Presomitic Mesoderm and Defective Somitogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Vertebral malformations in the null mouse are traced to a reduced
      presomitic mesoderm and defective somitogenesis.
    limitations: >-
      Mouse Ror1 partially compensates for Ror2 loss, so the single mutant is
      milder than the WNT5A-null state; the compound Ror1/Ror2 mutant is the
      closer phenocopy of complete pathway loss.
    readouts:
    - name: Presomitic mesoderm size
      target: Reduced Presomitic Mesoderm and Defective Somitogenesis
      direction: DECREASED
      interpretation: >-
        The reduced mesodermal pool is the measured antecedent of the vertebral
        malformations.
      evidence:
      - reference: PMID:14745966
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results demonstrate that vertebral malformations in Ror2(-/-) mice
          are due to reductions in the presomitic mesoderm and defects in
          somitogenesis.
        explanation: >-
          Reports the reduction in presomitic mesoderm that this readout records.
    evidence:
    - reference: PMID:14745966
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Ror2(-/-) mouse provides a suitable model that may help to explain
        many of the underlying developmental malformations in individuals with
        Robinow syndrome.
      explanation: >-
        The authors' own statement that the model is informative for the human
        developmental malformations.
  - target: Perturbed Growth Plate Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mesomelic limb shortening in the null mouse is attributed to perturbed
      chondrocyte differentiation.
    limitations: >-
      Chondrocyte differentiation was assessed in the mouse growth plate; the
      corresponding human histology is not available, so the cellular claim is
      transferred to human disease by inference from a shared gene and a shared
      limb-segment phenotype.
    readouts:
    - name: Growth plate chondrocyte differentiation
      target: Perturbed Growth Plate Chondrocyte Differentiation
      direction: ALTERED
      interpretation: >-
        Disturbed differentiation is the cellular lesion behind mesomelic
        shortening in this model.
      evidence:
      - reference: PMID:14745966
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mesomelic limb shortening in Ror2(-/-) mice is a consequence of
          perturbed chondrocyte differentiation.
        explanation: >-
          States the measured differentiation defect and its limb consequence.
  - target: Craniofacial Midline Outgrowth Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The craniofacial phenotype of the null mouse is caused by a midline
      outgrowth defect.
    limitations: >-
      Mouse and human midfacial morphology differ substantially, so the
      mechanism transfers more confidently than the morphology; the mouse does
      not reproduce the human facial gestalt as such.
    evidence:
    - reference: PMID:14745966
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we show that the craniofacial phenotype is caused by a midline
        outgrowth defect.
      explanation: >-
        Attributes the craniofacial phenotype to a specific developmental
        mechanism in the model.
  - target: Genital Tubercle Outgrowth Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ror2 is expressed in the genital tubercle and the tubercle is reduced in
      the null mouse.
    limitations: >-
      The authors state only that Ror2 involvement in genital development is
      "likely"; expression plus reduced size is suggestive, not a demonstrated
      requirement, so the link is recorded as partial.
    evidence:
    - reference: PMID:14745966
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ror2 expression in the genital tubercle and its reduced size in
        Ror2(-/-) mice makes it likely that Ror2 is involved in genital
        development.
      explanation: >-
        Supports the link at the strength the source states it, which is
        suggestive rather than definitive.
- name: Wnt5a-null mouse
  species: Mouse
  genotype: Wnt5a(-/-)
  publication: PMID:19918918
  description: >-
    The ligand-null mouse. It is more severely affected than human dominant
    Robinow syndrome, which is consistent with the human WNT5A alleles being
    hypomorphic rather than null — the model is informative about pathway loss
    but overshoots the human dominant disease.
  modeled_mechanisms:
  - target: Disrupted WNT/Planar Cell Polarity Signal Transduction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete Wnt5a loss reproduces the syndrome's facial, genital, and axial
      features but at greater severity than the human dominant disease.
    limitations: >-
      Perinatal lethality, fully penetrant cardiac defects, and rib fusions
      exceed what is seen in human dominant Robinow syndrome, so the null mouse
      models complete pathway loss rather than the human hypomorphic genotype.
    evidence:
    - reference: PMID:19918918
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Wnt5a null mice and Ror2 null mice exhibit phenotypes grossly similar to
        those found in Robinow syndrome patients, including shortening of the
        anterior-posterior axis, facial dysmorphism, genital hypoplasia and
        cardiac defects
      explanation: >-
        Supports treating the ligand-null mouse as informative for the pathway
        node.
    - reference: PMID:19918918
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Wnt5a null mice exhibit a phenotype that is more severe than human
        dominant Robinow syndrome patients with perinatal lethality, 100%
        penetrance of cardiac defects, and presence of rib fusions
      explanation: >-
        The severity mismatch that this link's ``limitations`` records, stated by
        the source itself.
diagnosis:
- name: Clinical Recognition of the Robinow Triad
  description: >-
    The diagnosis is suspected at birth or in early childhood from the triad of
    mesomelic limb shortening, genital hypoplasia, and the fetal-facies gestalt.
    Recognition is unusually reliable for a rare dysplasia: in a molecularly
    confirmed ROR2 cohort, 19 clinical features were each present in more than
    75% of subjects.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is recognizable at birth or in early childhood.
    explanation: >-
      Supports clinical recognizability and its timing.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 19 clinical features were present in more than 75% of the
      subjects, thus pointing to an overall uniformity of the phenotype.
    explanation: >-
      Quantifies the phenotypic uniformity that makes clinical recognition
      workable.
- name: Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by identifying a heterozygous pathogenic variant in
    DVL1, DVL3, WNT5A, or FZD2, or biallelic variants in ROR2 or NXN. Because
    the DVL1 and DVL3 alleles cluster in a single exon, targeted sequencing of
    the penultimate exon of the DVL paralogs is a high-yield first step in a
    clinically typical dominant case. Broad panel or exome testing is
    appropriate otherwise; in a recent cohort every clinically diagnosed
    individual received a molecular result.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a
      proband with typical suggestive findings and/or by the identification of a
      heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through molecular
      genetic testing.
    explanation: >-
      States the molecular confirmation criteria for the dominant forms.
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we elected to pursue direct Sanger sequencing of the penultimate exon of
      DVL1 and its paralogs DVL2 and DVL3 to search for potential
      disease-associated variants
    explanation: >-
      Supports the targeted penultimate-exon strategy described here as a
      high-yield first step.
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic or likely pathogenic variants in genes associated with RS or RS
      phenocopies were identified in all 22 individuals
    explanation: >-
      Supports the high molecular diagnostic yield in a clinically ascertained
      cohort.
- name: Prenatal Recognition
  description: >-
    The recessive form is recognizable on second-trimester ultrasound, where
    macrocephaly, a flat face with frontal bossing, mesomelic shortening,
    hemivertebrae and micropenis cluster together; molecular confirmation is
    then possible on amniocytes. This matters because the recessive form is the
    severe one and the families in which it recurs are often already known.
  diagnosis_term:
    preferred_term: prenatal ultrasonography
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:38504427
    reference_title: "Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelic limb shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal ultrasound done on our patient at 24 + 3/7 weeks gestation showed
      macrocephaly, brachycephaly, flat face, prominent forehead, mild frontal
      bossing, lower thoracic hemivertebrae, digital abnormalities and
      micropenis.
    explanation: >-
      Documents the prenatal ultrasound findings and their gestational age.
  - reference: PMID:38504427
    reference_title: "Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelic limb shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal trio whole exome sequencing done on amniocytes showed two pathogenic
      compound heterozygous variants in the ROR2 gene
    explanation: >-
      Establishes that molecular confirmation on amniocytes is achievable in the
      same pregnancy.
differential_diagnoses:
- name: Congenital adrenal hyperplasia
  description: >-
    A live diagnostic trap rather than a look-alike syndrome. An infant with
    micropenis, impalpable testes and ambiguous genitalia can present with
    hyponatremia, hyperkalemia and a mildly raised 17-hydroxyprogesterone, be
    started on glucocorticoid replacement, and only later prove to have a WNT5A
    variant with normal adrenal function on retesting. The discriminator is the
    rest of the examination: the Robinow facial gestalt and mesomelia are
    present from birth and CAH does not produce them.
  evidence:
  - reference: PMID:41477475
    reference_title: "Robinow Syndrome Mimicking Congenital Adrenal Hyperplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was suspected of having congenital adrenal hyperplasia and was started
      on glucocorticoid replacement.
    explanation: >-
      Documents the misdiagnosis and the treatment it led to.
  - reference: PMID:41477475
    reference_title: "Robinow Syndrome Mimicking Congenital Adrenal Hyperplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat evaluation of congenital adrenal hyperplasia after glucocorticoid
      taper was normal.
    explanation: >-
      Confirms the adrenal abnormality was not real, which is what makes this a
      diagnostic pitfall worth recording.
- name: Brachydactyly type B
  description: >-
    Allelic at ROR2 but mechanistically distinct: heterozygous alleles located
    downstream of the Robinow positions, acting by gain of function or dominant
    negative rather than loss of function. Digital shortening without the facial
    or genital components.
  evidence:
  - reference: PMID:10932187
    reference_title: "Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected several homozygous ROR2 mutations in our cohort of RRS
      patients that are located upstream from those previously found in BDB.
    explanation: >-
      Establishes the positional separation of the two allele classes at the
      same locus, the basis for distinguishing the two disorders.
- name: Autosomal dominant omodysplasia
  description: >-
    Also caused by heterozygous FZD2 variants, and clinically overlapping. The
    distinction is the limb segment: omodysplasia is rhizomelic with
    preferential humeral involvement, whereas Robinow syndrome is mesomelic.
    Whether the two are one continuum is an open question, noted in the
    dismech Omodysplasia entry.
- name: Leri-Weill dyschondrosteosis
  description: >-
    The other common cause of mesomelic shortening, from SHOX haploinsufficiency.
    Madelung deformity of the wrist and the absence of genital hypoplasia and the
    fetal-facies gestalt separate it clinically.
treatments:
- name: Orthodontic Treatment
  description: >-
    Malocclusion, crowding, hypodontia, and delayed eruption make orthodontic
    management a routine and long-running part of care rather than an optional
    extra.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: orthodontic treatment
    term:
      id: NCIT:C64248
      label: Orthodontic Treatment
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthodontic treatment is typically required.
    explanation: >-
      GeneReviews states that orthodontic treatment is typically required.
- name: Genital Reconstructive Surgery
  description: >-
    Corrective surgery for cryptorchidism, abnormal penile insertion or
    penoscrotal position, and scrotal transposition.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Corrective surgeries as needed for
      cryptorchidism, abnormal penile insertion / penoscrotal position, and
      cleft lip/palate.
    explanation: >-
      Lists the genital and orofacial procedures used in management.
- name: Androgen Therapy for Micropenis
  description: >-
    Testosterone therapy is used for micropenis. Because the genital phenotype
    originates in a developmental tubercle outgrowth defect rather than an
    androgen deficiency, the response is symptomatic and often incomplete.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hormone therapy as needed for the treatment of micropenis
    explanation: >-
      GeneReviews lists hormone therapy for micropenis in management.
- name: Orthopedic Surgery for Limb and Spine Deformity
  description: >-
    Corrective surgery for limb and spine defects, most relevant in the
    ROR2-related recessive form where vertebral segmentation defects and
    scoliosis are prominent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Corrective surgery for limb and spine defects
      and for facial abnormalities; orthodontic treatment as needed
    explanation: >-
      Lists corrective limb and spine surgery in the management of the recessive
      form.
- name: Growth Hormone Therapy
  description: >-
    Growth hormone is not standard care in Robinow syndrome, and short stature
    here is a skeletal dysplasia rather than a GH-axis problem. It becomes
    relevant when a patient also has documented growth hormone deficiency: one
    WNT5A-related patient treated from age four rose from below the 1st to the
    44th height percentile. That is a single case in a patient with a
    coexisting endocrine diagnosis, so it argues for testing the GH axis in a
    Robinow patient with disproportionate growth failure rather than for
    treating the dysplasia itself.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Growth hormone therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:36917807
    reference_title: "Robinow syndrome and its response to growth hormone treatment: a case report and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient initiated growth hormone treatment at a dose of 0.7 U/kg/week
      at 4 years of age with favorable results, increasing his height from the
      < 1st percentile to the 44th percentile.
    explanation: >-
      A single treated case with a large response. PARTIAL because the patient
      had coexisting growth hormone deficiency, so the result does not
      generalize to Robinow syndrome without it.
- name: Human Chorionic Gonadotropin for Cryptorchidism
  description: >-
    hCG has been used ahead of orchidopexy in a Robinow patient with bilateral
    inguinal testes. As with androgen therapy for micropenis, the genital
    phenotype is developmental rather than endocrine, so hormonal treatment is
    adjunctive to surgery rather than a substitute for it.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human chorionic gonadotropin
      term:
        id: CHEBI:81570
        label: Chorionic gonadotropin
  evidence:
  - reference: PMID:41477475
    reference_title: "Robinow Syndrome Mimicking Congenital Adrenal Hyperplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was treated with human chorionic gonadotropin for 6 months, followed by
      orchidopexy for cryptorchidism.
    explanation: >-
      Documents the sequence used in one patient. A single case, hence PARTIAL.
- name: Cardiac and Renal Surveillance
  description: >-
    Regular cardiac and renal assessment, periodic hearing assessment in
    childhood, and serial head circumference measurement. Cardiac surveillance
    earns its place because cardiac defects, though uncommon, drive mortality
    when present.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regular cardiac and renal assessment as needed by respective specialists
      if abnormalities are identified.
    explanation: >-
      States the surveillance recommendation for the cardiac and renal systems.
- name: Genetic Counseling
  description: >-
    Counseling must be genotype-specific: a 50% recurrence risk for the dominant
    forms, 25% for the recessive forms, and — because most DVL1 and DVL3 alleles
    are de novo — a low but non-zero recurrence risk for unaffected parents of a
    sporadic dominant case.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with ADRS has a 50% chance of inheriting the
      pathogenic variant; however, the severity of the clinical manifestations
      cannot be predicted from the results of molecular genetic testing.
    explanation: >-
      Supports both the recurrence risk and the limit on genotype-based
      prognostication that counseling must convey.
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of
      being affected with Robinow syndrome, a 50% chance of being a heterozygote
      (carrier) and usually asymptomatic, and a 25% chance of being unaffected
      and not a carrier.
    explanation: >-
      Supports the recessive-form recurrence risk figures.
discussions:
- discussion_id: dvl_frameshift_mode_of_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the DVL1 and DVL3 penultimate-exon frameshift alleles act by dominant
    negative interference, by a neomorphic gain of function, or by
    haploinsufficiency of the C-terminal domain?
  attaches_to:
  - pathophysiology#DVL1/DVL3 C-Terminal Truncation Escaping Nonsense-Mediated Decay
  rationale: >-
    Functional work published in 2026 (PMID:42424595) narrowed this
    considerably but did not close it. Comparing the frameshift allele against a
    plain stop codon at the same position showed that reduced canonical and
    JNK-PCP signalling is common to both — so that part is loss of the
    C-terminus — while nuclear mislocalization of the protein and disruption of
    morphogenesis in Drosophila occur only with the frameshift. That is a
    neomorphic component on top of a hypomorphic one, which is not quite what
    either "dominant negative" or "haploinsufficiency of a domain" describes.
    What remains open is whether the mislocalized protein alters transcription
    in the nucleus, as the authors suggest, and whether that is what produces
    the skeletal phenotype. The distinction is not academic: a gained nuclear
    activity is in principle a target for allele-specific knockdown, whereas a
    lost domain function is not.
- discussion_id: null_mouse_vs_dominant_human_alleles
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Ror2-null mouse's developmental decomposition of the syndrome —
    presomitic mesoderm, chondrocyte differentiation, midline outgrowth, genital
    tubercle — hold for the human dominant forms, which are caused by different
    genes acting by a different allelic mechanism?
  attaches_to:
  - pathophysiology#Disrupted WNT/Planar Cell Polarity Signal Transduction
  rationale: >-
    Nearly all of the developmental mechanism curated in this entry comes from
    Ror2-null and Wnt5a-null mice, which model complete loss of a receptor or
    ligand. The human dominant forms are caused by hypomorphic ligand alleles or
    by NMD-escaping altered Dishevelled proteins, neither of which is a null
    state. The Wnt5a-null mouse already overshoots the human dominant phenotype
    (perinatal lethality, fully penetrant cardiac defects), which is direct
    evidence that the null models are not a like-for-like proxy. Whether the
    same four developmental lesions, in the same proportions, produce the
    dominant human phenotype is untested.

phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: >-
    Shortening of the middle limb segment — forearm and lower leg — is the
    defining skeletal feature and is more marked in the upper limbs in the
    dominant forms. In the ROR2-related recessive form the shortening is
    generalized rather than confined to the middle segment.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed phenotypic analyses revealed that all subjects presented with a
      prominent forehead, hypertelorism, short nose, abnormality of the nasal
      tip, brachydactyly, mesomelic limb shortening, short stature, and genital
      hypoplasia in male patients.
    explanation: >-
      Mesomelic limb shortening was present in all 22 molecularly confirmed
      ROR2 patients.
- category: Skeletal
  name: Short Stature
  description: >-
    Disproportionate short stature with a short middle limb segment. Stature is
    most affected in the recessive ROR2 form; in the DVL1 osteosclerotic variant
    stature may be normal.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35344616

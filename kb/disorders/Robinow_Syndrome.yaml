    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Robinow syndrome (RS) is a genetically heterogeneous disorder with six
      genes that converge on the WNT/planar cell polarity (PCP) signaling
      pathway implicated (DVL1, DVL3, FZD2, NXN, ROR2, and WNT5A).
    explanation: >-
      States the convergence claim this node encodes, and names the six genes
      that feed into it.
  - reference: PMID:29276006
    reference_title: "WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support an initial hypothesis that Robinow syndrome results
      from perturbation of the Wnt/PCP pathway
    explanation: >-
      Independent statement of the same convergence, from the study that added
      FZD2 and NXN to the gene set.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WNT5A acts as a soluble extracellular ligand of ROR2; and together with
      FZD2 transmembrane receptor they trigger the DVL homologs to transduce the
      β-catenin independent pathway.
    explanation: >-
      Specifies the ligand-receptor-transducer architecture that makes the
      convergence mechanistic rather than merely statistical.

name: RFT1-congenital disorder of glycosylation
creation_date: "2026-08-22T00:00:00Z"
description: >-
  RFT1-congenital disorder of glycosylation (RFT1-CDG, CDG-In) is an ultra-rare
  autosomal recessive type I congenital disorder of glycosylation caused by
  biallelic pathogenic variants in RFT1, which encodes a multispanning
  endoplasmic-reticulum membrane protein. Assembly of the lipid-linked
  oligosaccharide donor for N-glycosylation begins on the cytosolic face of the
  ER and is completed in the lumen, and the two compartments are bridged by
  transbilayer movement of the heptasaccharide intermediate
  Man5GlcNAc2-PP-dolichol. RFT1 deficiency blocks the pathway at exactly this
  step: patient cells accumulate the truncated Man5 intermediate and fail to
  build the mature GlcNAc2Man9Glc3 donor, so nascent glycoproteins are
  hypoglycosylated and serum transferrin shows a CDG type I pattern. Clinically
  RFT1-CDG is a severe multisystem neurological disease — early-onset
  drug-resistant epilepsy, profound developmental impairment, visual failure,
  feeding difficulty and coagulopathy — distinguished among the CDG by
  consistent sensorineural deafness, which led to its description as the first
  "deafness-CDG". Whether RFT1 is itself the flippase that translocates the
  intermediate, or is instead required for that step by some other means,
  remains genuinely unsettled and is curated here as two competing hypotheses.
category: Mendelian
parents:
- hereditary disease
synonyms:
- RFT1-CDG
- CDG-In
- CDG1N
- congenital disorder of glycosylation type In
- congenital disorder of glycosylation type 1n
- RFT1 deficiency

biochemical:
- name: Transferrin Isoelectric Focusing Type I Pattern
  presence: PRESENT
  notes: >-
    RFT1-CDG is a defect of lipid-linked oligosaccharide assembly, so serum
    transferrin isoelectric focusing shows a CDG type I pattern (loss of whole
    N-glycans, and hence of glycosylation-site occupancy, rather than altered
    glycan processing). This is the standard first-line CDG screen and is what
    places a patient in the type I group before the gene is known.
  evidence:
  - reference: PMID:19862844
    reference_title: "Congenital disorders of glycosylation: an update on defects affecting the biosynthesis of dolichol-linked oligosaccharides."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Defects in the biosynthesis of the oligosaccharide precursor for
      N-glycosylation lead to decreased occupancy of glycosylation sites and
      thereby to diseases known as congenital disorders of glycosylation (CDG).
    explanation: >-
      Explains why a precursor-assembly defect such as RFT1-CDG produces reduced
      site occupancy, the basis of the type I pattern.
  - reference: PMID:30071302
    reference_title: "A family with floppy neonates with severe respiratory insufficiency: A lethal phenotype of RFT1-CDG due to a novel mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin iso-electric focusing was normal."
    explanation: >-
      A genetically confirmed RFT1-CDG patient with a normal transferrin screen,
      showing the first-line test can miss the diagnosis.
- name: Lipid-Linked Oligosaccharide Profile with Man5 Accumulation
  presence: PRESENT
  notes: >-
    The discriminating assay. Metabolic labelling of patient fibroblasts shows
    accumulation of Dol-PP-GlcNAc2Man5 together with absence of the cytosolic
    free oligosaccharide GlcNAc2Man5. This paired result localizes the block to
    the transbilayer step and is what originally pointed to RFT1 by analogy with
    the RFT1-null yeast profile.
  evidence:
  - reference: PMID:19267216
    reference_title: "Comprehensive description of the phenotype of the first case of congenital disorder of glycosylation due to RFT1 deficiency (CDG In)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accumulation of intracellular DolPP-GlcNAc(2)Man(5) with absence of
      cytosolic GlcNAc(2)Man(5) resembled the profile of a yeast mutant deficient
      in RFT1, a protein that is thought to have a role as a flippase.
    explanation: >-
      Describes both components of the discriminating biochemical profile.
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RFT1 deficiency in both yeast and human cells leads to the accumulation of
      incomplete DolPP-GlcNAc(2)Man(5) and to a profound glycosylation disorder in
      humans.
    explanation: >-
      Confirms the accumulating species in human cells.
genetic:
- name: RFT1
  gene_term:
    preferred_term: RFT1
    term:
      id: hgnc:30220
      label: RFT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: All reported patients (biallelic in every case)
  notes: >-
    RFT1 (3p21.1) encodes a multispanning ER membrane protein with cytoplasmic N
    and C termini. The index allele is the homozygous missense c.199C>T
    (p.Arg67Cys); most RFT1-CDG alleles reported since map to regions of the
    protein conserved across eukaryotes, consistent with damage to a shared
    functional core. Note that human and yeast RFT1 share only about 22% sequence
    identity, so functional orthology had to be demonstrated experimentally by
    complementation rather than assumed from sequence.

    Variant class and spectrum. Every RFT1-CDG allele reported is missense and
    biallelic; no null allele has been described, which is consistent with
    complete loss of RFT1 being incompatible with life. Alleles reported across
    the series include p.R67C (the index and recurrent allele), p.K152E and
    p.E298K (PMID:19701946), p.M408V and p.R442Q (PMID:23111317), and p.G276D,
    p.R25W and p.C70R (PMID:29923091), plus p.G340S (PMID:30071302).

    Where the alleles fall. The three earliest-characterised alleles all sit in
    hydrophilic loops predicted to face the ER lumen, which is the structural
    observation behind reading these as damaging a shared translocation-relevant
    surface rather than being scattered. Later work identified p.G340S in a
    transmembrane helix instead, so luminal-loop localisation is a strong
    tendency and not a rule — a variant outside the loops is not thereby benign.
    The same structural point is used diagnostically and is curated in the
    `diagnosis` section as well.

    Recurrence. p.R67C has been found homozygously in unrelated patients of
    British origin with no known relationship, which the reporting authors read
    as a possible founder effect rather than a mutational hotspot.
  evidence:
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The c.199C-->T mutation introduced the amino acid substitution p.R67C.
    explanation: >-
      Identifies the index pathogenic allele at nucleotide and protein level.
  - reference: PMID:39025454
    reference_title: "Molecular characterization of Rft1, an ER membrane protein associated with congenital disorder of glycosylation RFT1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The majority of RFT1-CDG mutations map to highly conserved regions of the
      protein.
    explanation: >-
      Characterizes the distribution of pathogenic alleles across the protein.
  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient was homozygous for the earlier reported RFT1 missense
      mutation (c.199C>T; p.R67C), whereas the two other patients were homozygous
      for the missense mutation c.454A>G (p.K152E) and c.892G>A (p.E298 K),
      respectively.
    explanation: >-
      Adds two novel alleles beyond the index p.R67C and establishes that all
      three are homozygous missense.
  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three RFT1 mutations identified so far are located in one of the
      hydrophilic loops predicted to be within the ER lumen.
    explanation: >-
      The structural localisation of the early allele set. Read as a tendency
      rather than a rule: a later transmembrane-helix allele (p.G340S) does not
      fit it.
  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This could thus point to a founder effect of the p.R67C mutation.
    explanation: >-
      The authors' own reading of p.R67C recurrence in unrelated British
      patients, curated as their hypothesis rather than as an established
      founder haplotype.
diagnosis:
- name: Serum Transferrin Isoelectric Focusing
  description: >-
    First-line screening test. A type I pattern places the patient in the
    lipid-linked-oligosaccharide-assembly group of CDG but does not identify the
    gene. Important caveat: it was normal in a genetically confirmed, lethally
    affected neonate, so a normal result does not exclude RFT1-CDG and should not
    stop a sequencing work-up when the clinical picture fits.
  evidence:
  - reference: PMID:19862844
    reference_title: "Congenital disorders of glycosylation: an update on defects affecting the biosynthesis of dolichol-linked oligosaccharides."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Defects in the biosynthesis of the oligosaccharide precursor for
      N-glycosylation lead to decreased occupancy of glycosylation sites and
      thereby to diseases known as congenital disorders of glycosylation (CDG).
    explanation: >-
      Grounds the screening logic: reduced site occupancy is what the type I
      pattern detects.
- name: Exome Sequencing when the Transferrin Screen is Normal
  description: >-
    The diagnostic route that worked where the biochemical screen failed.
    Clinical exome sequencing identified the causative RFT1 variant in the
    neonate whose transferrin isoelectric focusing was normal. That case also
    broadened the variant spectrum: previously reported pathogenic variants all
    affected luminal loops, whereas this one lay in a transmembrane helical
    domain.
  evidence:
  - reference: PMID:30071302
    reference_title: "A family with floppy neonates with severe respiratory insufficiency: A lethal phenotype of RFT1-CDG due to a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin iso-electric focusing was normal."
    explanation: >-
      Establishes the circumstance in which sequencing rather than biochemistry
      makes the diagnosis.
  - reference: PMID:30071302
    reference_title: "A family with floppy neonates with severe respiratory insufficiency: A lethal phenotype of RFT1-CDG due to a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic variants so far reported are all missense variants affecting
      the luminal loops; whereas the variant in our case is in the trans-membrane
      helical domain.
    explanation: >-
      Documents the extension of the variant spectrum beyond the luminal loops.
- name: CDG Screening in Syndromic Congenital Hearing Loss
  description: >-
    Because sensorineural deafness is consistent in RFT1-CDG and unusual among
    the CDG generally, the RFT1-CDG cohort report argued for adding CDG screening
    to the diagnostic work-up of congenital syndromic hearing loss. This is a
    diagnostic-pathway recommendation rather than a specific assay.
  evidence:
  - reference: PMID:19856127
    reference_title: "RFT1-CDG: deafness as a novel feature of congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDG should be included in the work-up of congenital, particularly syndromic,
      hearing loss.
    explanation: >-
      The authors' explicit diagnostic recommendation arising from this disorder.
discussions:
- discussion_id: rft1_molecular_function_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the essential molecular activity of RFT1 in N-glycosylation, given
    that reconstitution experiments argue it is not itself the flippase for the
    Man5 lipid intermediate?
  attaches_to:
  - "pathophysiology#Block in Transbilayer Completion of the Lipid-Linked Oligosaccharide"
  rationale: >-
    This is the central unresolved question of the disease and the reason this
    entry curates two mechanistic hypotheses rather than one chain. The flippase
    attribution is inherited from yeast genetics and from the shape of the
    patient biochemistry: the Man5 intermediate accumulates and the cytosolic
    free oligosaccharide is absent, exactly as a transport block would predict.
    But flipping proceeds without RFT1 in microsomes and in reconstituted
    proteoliposomes, and at least one eukaryote does not require RFT1 for
    viability. Both observations can be true — RFT1 may be a regulator,
    assembly factor, or accessory subunit whose loss disables a transport step
    catalysed by something else. The gap matters for curation because it sets
    how strongly a downstream causal edge may be stated, and it matters
    clinically because a transporter deficiency and a regulatory-factor
    deficiency imply different therapeutic entry points.
  proposed_experiments:
  - experiment_id: exp_rft1_reconstitution_with_patient_alleles
    name: Reconstitution of flipping activity with RFT1-CDG patient alleles
    description: >-
      Reconstitute ER membrane protein fractions from cells expressing wild-type
      versus RFT1-CDG alleles into unilamellar vesicles and assay Man5 lipid
      flipping directly, to test whether patient alleles impair transport in a
      defined system rather than only in intact cells.
  - experiment_id: exp_rft1_interactome
    name: Proximity labelling of the RFT1 interactome in the ER membrane
    description: >-
      Use proximity-dependent biotinylation from tagged RFT1 to identify partners
      in the ER membrane, testing the hypothesis that RFT1 acts as an accessory
      or regulatory subunit of a transport machine rather than as the transporter.
- discussion_id: rft1_genotype_phenotype_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the position or class of an RFT1 allele predict clinical severity, and
    is there a milder end of the RFT1-CDG spectrum that is currently
    under-ascertained?
  attaches_to:
  - "pathophysiology#RFT1 Loss of Function"
  rationale: >-
    The published RFT1-CDG cohort is very small and was ascertained through
    severe presentations — early-onset drug-resistant epilepsy with deafness. In
    several other CDG (DPM2-CDG among them) an initially uniformly severe
    phenotype broadened once milder, later-diagnosed patients were found,
    sometimes surviving to adulthood. Whether RFT1-CDG has a comparable mild tail
    is unknown, and ascertainment through epileptic encephalopathy would
    systematically miss it. Deafness may be the more sensitive handle: it is the
    feature that is consistent across the cohort, and screening syndromic
    congenital hearing loss for CDG is the route by which a milder tail would
    most plausibly be found.
notes: >-
  Scope and boundaries. This entry covers the RFT1-CDG disease entity
  (MONDO:0012783, CDG-In). It is a type I CDG — a defect in assembly of the
  lipid-linked oligosaccharide donor — and so is mechanistically adjacent to the
  other dolichol-linked-oligosaccharide disorders (ALG series, DPM1/2/3, DOLK,
  MPDU1) rather than to the type II processing defects.

  On the flippase question. Readers of older sources will find RFT1 described
  flatly as "the flippase". That attribution is not settled, and this entry
  deliberately does not assert it: the pathophysiology chain states the step that
  fails (transbilayer completion of the lipid-linked oligosaccharide, which is
  well evidenced) while the competing readings of RFT1's molecular role are
  carried in `mechanistic_hypotheses` and in an open `KNOWLEDGE_GAP` discussion.
  Curators extending this entry should preserve that separation rather than
  collapsing it into a transporter-deficiency narrative.

  Severity spans a wide range, and the entry now reflects both ends. The lethal
  pole is a floppy neonate with ventilator-dependent respiratory insufficiency
  dying at 24 days, in a family with multiple neonatal deaths. The mild pole is
  adult siblings with profound intellectual disability but preserved feeding and
  growth, well-controlled epilepsy, clinically silent coagulopathy and normal
  visual acuity, plus a further pair with neither epilepsy nor deafness. Neither
  deafness nor epilepsy should be treated as required for the diagnosis, and a
  normal transferrin screen does not exclude it.

  Evidence base. The literature is small — the index case, a detailed phenotype
  report on that same patient, a six-patient cohort establishing deafness, an
  electroclinical epilepsy report, and the 2024 molecular characterization,
  together with later case reports that widened the phenotype at both ends. No
  treatment beyond supportive and anticonvulsant care is established, so no
  `treatments` block is curated; adding one would require evidence that does not
  presently exist.

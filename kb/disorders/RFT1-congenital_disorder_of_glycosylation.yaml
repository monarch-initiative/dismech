      label: RFT1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Reported genotypes are biallelic germline RFT1 variants, homozygous in the
      index case. Loss of function is established functionally: the index allele
      failed to complement RFT1-null yeast, and wild-type RFT1 cDNA restored
      normal glycosylation in patient fibroblasts.

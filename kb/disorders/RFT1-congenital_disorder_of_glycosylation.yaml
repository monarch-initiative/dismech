  downstream:
  - target: Protein N-Hypoglycosylation
- name: Protein N-Hypoglycosylation
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With the mature donor unavailable, the oligosaccharyltransferase reaction
    proceeds at reduced efficiency and sequons on nascent glycoproteins are left
    unoccupied. Site occupancy, rather than glycan structure, is what falls —
    which is why the defect presents biochemically as a CDG type I pattern on
    serum transferrin isoelectric focusing.

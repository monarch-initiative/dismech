    explanation: >-
      A functional readout of hypoglycosylation at the level of a single reporter
      glycoprotein, which is what makes it more than a transferrin pattern: the
      novel alleles impair secretion of a heterologous N-glycoprotein in patient
      fibroblasts.
  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both the glycosylation pattern and recombinant DNase 1 secretion could be
      normalized by expression of normal RFT1 cDNA in the patients' fibroblasts.
    explanation: >-
      The rescue arm, and the strongest single piece of evidence that the
      hypoglycosylation is caused by the RFT1 alleles rather than merely
      correlated with them.

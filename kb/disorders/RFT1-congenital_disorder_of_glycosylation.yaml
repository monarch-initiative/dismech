    explanation: >-
      Links the precursor block to a global glycosylation defect in human cells.
  downstream:
  - target: Multisystem Neurological and Sensory Disease
- name: Multisystem Neurological and Sensory Disease
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Because N-glycosylation is required by a very large and functionally diverse
    set of secreted and membrane proteins, hypoglycosylation produces disease in
    many organs at once. In RFT1-CDG the burden falls most heavily on the nervous
    system and the ear: drug-resistant early-onset epilepsy, profound
    developmental impairment and visual failure, together with the sensorineural
    deafness that distinguishes this CDG from the others. Coagulation-factor
    hypoglycosylation adds a bleeding-and-thrombosis diathesis that proved fatal
    in the index case.
  evidence:
  - reference: PMID:19856127
    reference_title: "RFT1-CDG: deafness as a novel feature of congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, all six patients with RFT1-CDG show sensorineural deafness as
      part of a severe neurological syndrome.
    explanation: >-
      Establishes the consistent pairing of sensorineural deafness with severe
      neurological disease across the reported cohort.
  - reference: PMID:19267216
    reference_title: "Comprehensive description of the phenotype of the first case of congenital disorder of glycosylation due to RFT1 deficiency (CDG In)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient showed very little development and no vision and suffered from
      drug-resistant epilepsy.
    explanation: >-
      Documents the neurological and visual burden in the index patient.
mechanistic_hypotheses:
- hypothesis_group_id: rft1_flippase_model
  hypothesis_label: RFT1-as-Flippase Model
  status: CANONICAL
  description: >-
    The original and still most widely cited reading is that RFT1 is itself the
    transporter that flips Man5GlcNAc2-PP-dolichol from the cytosolic to the
    luminal leaflet of the ER membrane. On this model the accumulating Man5
    intermediate in patient cells is the direct substrate of a missing transport
    activity, and RFT1-CDG is a transporter deficiency.
  evidence:
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The human RFT1 protein shares 22% identity with its yeast ortholog, which is
      involved in the translocation of DolPP-GlcNAc(2)Man(5) from the cytosolic
      into the lumenal side of the endoplasmic reticulum.
    explanation: >-
      States the translocation role attributed to the yeast orthologue and carried
      over to human RFT1.
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The definition of the RFT1 defect establishes the functional conservation of
      the DolPP-GlcNAc(2)Man(5) translocation process in eukaryotes.
    explanation: >-
      The authors' own framing of the defect as one of a conserved translocation
      process.
- hypothesis_group_id: rft1_non_flippase_essential_role
  hypothesis_label: RFT1-Essential-But-Not-The-Flippase Model
  status: ALTERNATIVE
  description: >-
    Reconstitution work argues against RFT1 being the flippase itself:
    heptasaccharide lipid flipping proceeds in microsomes and in proteoliposomes
    reconstituted from ER membrane proteins without a requirement for RFT1, and
    at least one eukaryote does not need RFT1 for viability. On this reading RFT1
    is genuinely essential for N-glycosylation in yeast and mammalian cells, and
    RFT1-CDG alleles are genuinely damaging, but the molecular activity being
    lost is something other than direct transbilayer transport — and has not yet
    been identified.
  evidence:
  - reference: PMID:39025454
    reference_title: "Molecular characterization of Rft1, an ER membrane protein associated with congenital disorder of glycosylation RFT1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, other studies indicated that Rft1 is not required for
      heptasaccharide lipid flipping in microsomes or unilamellar vesicles
      reconstituted with ER membrane proteins, nor is it required for the
      viability of at least one eukaryote.
    explanation: >-
      The direct experimental challenge to the flippase attribution.
  - reference: PMID:39025454
    reference_title: "Molecular characterization of Rft1, an ER membrane protein associated with congenital disorder of glycosylation RFT1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It is therefore not known what essential role Rft1 plays in N-glycosylation.
    explanation: >-
      States plainly that the molecular function remains unresolved, which is why
      this entry curates two hypotheses rather than one mechanism.
  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, recent evidence suggests that the RFT1 protein would not be the
      flippase enzyme itself, but would play a critical accessory role in
      translocating Man5GlcNAc2PP-dolichol to the ER lumen
    explanation: >-
      Worth recording because of its date: this 2009 clinical series already
      stated the accessory-role reading, fifteen years before the 2024
      reconstitution work that is the primary support for this hypothesis. The
      alternative is therefore long-standing rather than a recent
      reinterpretation.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    RFT1-CDG requires biallelic RFT1 variants. The index patient was homozygous
    for a missense allele, and subsequent reports have described further
    homozygous and compound heterozygous genotypes. Causality for the index
    allele was established functionally rather than by segregation alone:
    expressing wild-type RFT1 cDNA in patient fibroblasts restored the normal
    glycosylation profile.
  evidence:
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A young patient diagnosed with a congenital disorder of glycosylation
      characterized by an intracellular accumulation of DolPP-GlcNAc(2)Man(5) was
      found to carry a homozygous point mutation in the RFT1 gene.
    explanation: >-
      A homozygous RFT1 point mutation in the index patient establishes recessive
      inheritance.
  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The causality of the RFT1 p.R67C mutation was further established by
      restoration of normal glycosylation profiles in patient-derived fibroblasts
      after lentiviral expression of a normal RFT1 cDNA.
    explanation: >-
      Functional complementation in patient cells confirms the biallelic RFT1
      genotype is causal rather than incidental.
pathophysiology:
- name: RFT1 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic pathogenic RFT1 variants reduce or abolish the function of RFT1, a
    multispanning ER membrane protein whose N and C termini both face the
    cytoplasm. The index allele, c.199C>T (p.Arg67Cys), was shown to be
    functionally deleterious by complementation assay in RFT1-null yeast, and
    most RFT1-CDG alleles reported since fall in regions of the protein that are
    highly conserved across eukaryotes.

      drug-resistant epilepsy.
    explanation: >-
      Documents drug-resistant epilepsy in the index patient.
  - reference: PMID:26892341
    reference_title: "RFT1-congenital disorder of glycosylation (CDG) syndrome: a cause of early-onset severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RFT1-congenital disorder of glycosylation (CDG) syndrome, a recessive
      N-glycosylation disorder caused by mutation in the RFT1 gene, is a very rare
      subtype of CDG syndrome associated with deafness, developmental delay, and
      non-specific epilepsy.
    explanation: >-
      Lists epilepsy among the defining clinical associations of RFT1-CDG.
  - reference: PMID:29923091
    reference_title: "RFT1-CDG: Absence of Epilepsy and Deafness in Two Patients with Novel Pathogenic Variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither of them shows signs of epilepsy, which was observed in all RFT1-CDG
      patients reported to date (n = 14).
    explanation: >-
      Two patients without epilepsy, against 14 previously reported with it;
      marked PARTIAL because it bounds rather than supports the phenotype.
- category: Auditory
  name: Sensorineural Deafness
  description: >-
    Sensorineural hearing loss is the most discriminating feature of RFT1-CDG and
    is rarely reported across the CDG generally, which is why RFT1-CDG was
    designated the first "deafness-CDG" and why CDG entered the differential for
    syndromic congenital hearing loss. It is not, however, universal. It was
    present in all six patients in the report that established it, but later
    cases include two patients in whom deafness was absent, and adult siblings in
    whom hearing impairment affected only one of the pair. Treat it as the
    strongest single pointer to this diagnosis, not as a required feature.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:19856127
    reference_title: "RFT1-CDG: deafness as a novel feature of congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, all six patients with RFT1-CDG show sensorineural deafness as
      part of a severe neurological syndrome.
    explanation: >-
      Direct observation of sensorineural deafness in every reported patient at
      the time.
  - reference: PMID:19856127
    reference_title: "RFT1-CDG: deafness as a novel feature of congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

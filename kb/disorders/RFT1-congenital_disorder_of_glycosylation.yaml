  - reference: PMID:18313027
    reference_title: "Human RFT1 deficiency leads to a disorder of N-linked glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The substrate of N-linked glycosylation, dolichol pyrophosphate
      (DolPP)-GlcNAc(2)Man(9)Glc(3), is assembled through a complex series of
      ordered reactions requiring the translocation of the intermediate
      DolPP-GlcNAc(2)Man(5) structure across the endoplasmic-reticulum membrane.
    explanation: >-
      States the transbilayer step at which the RFT1 block occurs.
  - reference: PMID:19856127
    reference_title: "RFT1-CDG: deafness as a novel feature of congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RFT1 is involved in the transfer of Man(5)GlcNAc(2)-PP-Dol from the
      cytoplasmic to the luminal side of the endoplasmic reticulum.
    explanation: >-
      Places RFT1 at the cytosolic-to-luminal transfer of the Man5 intermediate.
  downstream:
  - target: Accumulation of the Truncated Man5 Intermediate
- name: Accumulation of the Truncated Man5 Intermediate
  biological_scale: MOLECULAR
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Because the pathway stalls, the truncated species Dol-PP-GlcNAc2Man5
    accumulates intracellularly while the cytosolic free oligosaccharide

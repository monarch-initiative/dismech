  downstream:
  - target: Block in Transbilayer Completion of the Lipid-Linked Oligosaccharide
- name: Block in Transbilayer Completion of the Lipid-Linked Oligosaccharide
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Assembly of the N-glycosylation donor is a two-compartment process: the
    Man5GlcNAc2-PP-dolichol intermediate is built on the cytosolic face of the ER
    and must reach the lumen for the remaining mannose and glucose residues to be
    added. In RFT1 deficiency this transition fails, and the pathway stalls at
    the Man5 intermediate. The step itself is not in doubt; what RFT1 actually
    does at this step is, and the two readings are curated as competing
    hypotheses below.

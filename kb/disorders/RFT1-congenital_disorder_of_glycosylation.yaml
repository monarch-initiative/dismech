  - reference: PMID:19701946
    reference_title: "RFT1 deficiency in three novel CDG patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The pathogenic character of the novel mutations was illustrated by the
      accumulation of Man(5)GlcNAc(2)-PP-dolichol and by reduced recombinant

    ICSI bypasses the motility defect. The one treated proband had a live
    birth after two cycles. In mice, ICSI with knockout sperm produced
    healthy offspring but at lower two-cell and blastocyst rates than with
    wild-type sperm.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion irrelevant to fertilization.
    evidence:
    - reference: PMID:37352829
      reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ICSI using the spermatozoa from the CFAP70-mutated patient (II-1) was applied for two cycles and successfully resulted in a live birth (Table 3)."
      explanation: Live birth from ICSI with patient sperm.
  evidence:
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ICSI using the spermatozoa from the CFAP70-mutated patient (II-1) was applied for two cycles and successfully resulted in a live birth (Table 3)."
    explanation: The only reported human ICSI outcome.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the rates of two-cell embryos and blastocysts were reduced upon ICSI treatment using spermatozoa from Cfap70-KO mice compared with those using wild-type spermatozoa (Table 2)."
    explanation: >-
      In mice ICSI works but with reduced embryo development, a caveat for

genetic:
- name: CFAP70
  association: Causal
  gene_term:
    preferred_term: CFAP70
    term:
      id: hgnc:30726
      label: CFAP70
  notes: >-
    Reported alleles are homozygous: a splice-acceptor variant
    (c.1723-1G>T) and a missense variant (p.Phe60Ile) from a 167-patient MMAF
    cohort, and a nonsense variant (c.2962C>T, p.R988X) in a Chinese man.
    ClinGen has not curated CFAP70 for any disease, so no gene-disease
    validity tier is recorded.
  evidence:
  - reference: PMID:31621862
    reference_title: "CFAP70 mutations lead to male infertility due to severe astheno-teratozoospermia. A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient had a homozygous splice variant c.1723-1G>T, altering a consensus splice acceptor site of CFAP70 exon 16, and one had a likely deleterious missense variant in exon 3 (p.Phe60Ile)."
    explanation: First two probands.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous nonsense variant (c.2962C > T/p.R988X) in CFAP70 was identified in a Chinese infertile man with OAT."
    explanation: Third proband.
animal_models:
- name: Cfap70 knockout mouse
  species: Mouse
  genotype: Cfap70-/- (CRISPR knockout), homozygous
  publication: PMID:37352829
  description: >-
    Knockout males are sterile with low sperm counts, low motility and MMAF
    sperm. They also develop neonatal hydrocephalus with premature death,
    which has not been reported in patients.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the human oligoasthenoteratozoospermia with MMAF.
    evidence:
    - reference: PMID:37352829
      reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morphologic analysis of spermatozoa using Papanicolaou staining (Fig. 1f) and SEM (Fig. 1g) revealed that Cfap70-KO spermatozoa were malformed with short and coiled flagella."
      explanation: MMAF in knockout sperm.
  - target: Failure of Sperm Flagellum Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: The knockout shows the spermatid assembly defect, alongside motile-cilia disease that patients lack.
    limitations: >-
      Knockout mice develop hydrocephalus and sinusitis from motile-cilia
      dysfunction, so they model a broader ciliopathy than the isolated
      infertility seen in the three reported men.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse ependymal and airway cilia depend on CFAP70 for central-pair
        stability, and knockouts develop hydrocephalus; no CFAP70-deficient
        man has had hydrocephalus or respiratory disease, so the extra-gonadal
        phenotype does not transfer to humans on present evidence.
    evidence:
    - reference: PMID:37352829
      reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we report that Cfap70-KO mice exhibit male infertility with OAT and that CFAP70 is required for the assembly of flagella in mouse early spermatids."
      explanation: The knockout localizes the defect to flagellar assembly in early spermatids.
- name: Cfap70 TPR5-8 truncation mouse
  species: Mouse
  genotype: Cfap70 truncation lacking tetratricopeptide repeats 5-8, homozygous
  publication: PMID:37352829
  description: >-
    Mice expressing CFAP70 truncated like the patient's p.R988X protein
    (the exact allele could not be engineered) are sterile with low sperm
    count and motility.
  modeled_mechanisms:
  - target: Loss of CFAP70 from the Sperm Axoneme
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Models the C-terminal truncation produced by the patient allele.
    limitations: >-
      The patient's exact nonsense codon could not be edited in mouse, so the
      model approximates rather than reproduces the human allele.
    evidence:
    - reference: PMID:37352829
      reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cfap70-truncated mice lacking 5-8 tetratricopeptide repeats (TPRs) mimic the patient's symptoms."
      explanation: The truncation model reproduces the patient phenotype.
- name: Cfap70-deficient mouse (Chen 2023)
  species: Mouse
  genotype: Cfap70-deficient (CRISPR), homozygous
  publication: PMID:37458246
  description: >-
    An independent knockout with MMAF, abnormal head shaping and abnormal

name: Spermatogenic Failure 41
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF41
- spermatogenic failure 41
- CFAP70-related multiple morphological abnormalities of the sperm flagella
- CFAP70-related oligoasthenoteratozoospermia
description: >-
  Spermatogenic failure 41 (SPGF41) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP70, a
  tetratricopeptide-repeat protein of motile cilia and sperm flagella. CFAP70
  is a component of the C2a projection of the axonemal central apparatus,
  where it is required for the stability of its partner proteins CFAP65 and
  MYCBPAP, and its N-terminus also sits at the base of the outer dynein arm.
  In spermatids it is needed to assemble the flagellum.

  Affected men present with primary infertility and severe
  asthenoteratozoospermia with multiple morphological abnormalities of the
  sperm flagella (MMAF): coiled, short and absent flagella, no progressive
  motility and, in reported men, reduced sperm concentration. Patient sperm
  lack CFAP70 and show loss of outer dynein arm and central pair markers.
  Only three probands have been reported (a splice-site, a missense and a
  nonsense variant), all without respiratory or other ciliary symptoms,
  although Cfap70 knockout mice develop hydrocephalus and sinusitis in
  addition to sterility. Intracytoplasmic sperm injection (ICSI) has produced
  a live birth.
disease_term:
  preferred_term: spermatogenic failure 41
  term:
    id: MONDO:0032863
    label: spermatogenic failure 41
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 618670. ClinGen has no
  gene-disease validity curation for CFAP70 in any disease, so no validity
  tier is recorded. The human evidence rests on three probands from two
  publications (PMID:31621862, two homozygous probands from a 167-patient
  MMAF cohort; PMID:37352829, one homozygous nonsense proband); the
  supporting mouse models are a knockout and a truncation mutant
  (PMID:37352829) and an independent knockout (PMID:37458246). Cfap70 is also
  one of three C2a-projection genes whose mouse knockouts develop
  hydrocephalus and sinusitis (PMID:42417609); no affected man has been
  reported with these features.
  No GeneReviews or StatPearls chapter covers this disorder.
inheritance:
- name: Autosomal recessive
  description: >-
    All reported probands are homozygous for a CFAP70 variant. In the one
    family with segregation data, a fertile brother carries the wild-type
    allele; the parents were not available for testing.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31621862
    reference_title: "CFAP70 mutations lead to male infertility due to severe astheno-teratozoospermia. A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two unrelated affected individuals carrying a homozygous deleterious mutation in CFAP70, a gene not previously linked to the MMAF phenotype"
    explanation: Two unrelated homozygous probands.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of the CFAP70 gene revealed that the proband (II-1) carried the homozygous nonsense variant, and his fertile brother (II-2) harboured the wild-type allele"
    explanation: A third homozygous proband, with a fertile wild-type brother.
pathophysiology:
- name: Loss of CFAP70 from the Sperm Axoneme
  description: >-
    The splice-site allele removes CFAP70 from the sperm flagellum, and the
    p.R988X nonsense allele leaves a truncated protein lacking C-terminal
    tetratricopeptide repeats 5-8. CFAP70 is a structural component of the C2a
    projection of the central apparatus: in mouse motile cilia, loss of CFAP70,
    CFAP65 (CCDC108) or MYCBPAP destabilizes the other two and collapses the
    projection, and in Chlamydomonas the fap70 mutant lacks most of C2a.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP70
    term:
      id: hgnc:30726
      label: CFAP70
  molecular_functions:
  - preferred_term: structural constituent of the axonemal C2a projection
    modifier: DECREASED
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  cellular_components:
  - preferred_term: Axonemal central pair projection (C2a)
    term:
      id: GO:1990718
      label: axonemal central pair projection
  downstream:
  - target: Failure of Sperm Flagellum Assembly
    causal_link_type: DIRECT
    description: >-
      Without CFAP70 the flagellar axoneme is not assembled properly in
      spermatids; patient sperm lack both outer dynein arm and central pair
      markers.
    evidence:
    - reference: PMID:31621862
      reference_title: "CFAP70 mutations lead to male infertility due to severe astheno-teratozoospermia. A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Moreover, IF analysis showed the absence of markers for the ODAs and the central pair complex of the axoneme."
      explanation: Patient sperm lacking CFAP70 also lack ODA and central pair markers.
  evidence:
  - reference: PMID:31621862
    reference_title: "CFAP70 mutations lead to male infertility due to severe astheno-teratozoospermia. A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the sperm cells from the patient carrying the splice variant, immunofluorescence (IF) experiments confirmed the absence of the protein in the sperm flagellum."
    explanation: Protein loss in patient sperm with the splice allele.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This nonsense variant generates a truncated CFAP70 protein lacking the C-terminal 5–8 tetratricopeptide repeats (TPRs)."
    explanation: The nonsense allele truncates the TPR region.
  - reference: PMID:42417609
    reference_title: "Proteomic composition and mutual assembly of the C2a projection in vertebrate motile cilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The ciliary incorporation of CCDC108, MYCBPAP, and CFAP70 is essential for one another's stability, with the loss of any single component triggering C2a collapse, which destabilizes the central pair microtubules, and ultimately alters the ciliary movement pattern."
    explanation: >-
      Knockout mice show that CFAP70 is a structural component whose loss
      collapses the C2a projection, which grounds the structural molecular
      function.
  - reference: PMID:33988244
    reference_title: "Chlamydomonas FAP70 is a component of the previously uncharacterized ciliary central apparatus projection C2a."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We also found that fap70-1 mutant axonemes lack most of the C2a projection."
    explanation: The algal ortholog is required for the C2a projection.
  - reference: PMID:30158508
    reference_title: "CFAP70 Is a Novel Axoneme-Binding Protein That Localizes at the Base of the Outer Dynein Arm and Regulates Ciliary Motility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Cryo-electron tomography revealed that the N-terminus of FAP70 resided stably at the base of the ODA."
    explanation: A second axonemal site for the algal ortholog, at the base of the outer dynein arm.
- name: Failure of Sperm Flagellum Assembly
  description: >-
    Flagellar biogenesis fails in spermatids. In mice, CFAP70 helps to
    preassemble the calmodulin- and radial spoke-associated complex in the
    cytoplasm, maintains levels of other MMAF proteins such as QRICH2, and
    controls the localization of axonemal proteins on the manchette; loss of
    CFAP70 also causes club-shaped heads and abnormal manchette disassembly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatid
    term:
      id: CL:0000018
      label: spermatid
  cellular_components:
  - preferred_term: Axonemal central apparatus
    term:
      id: GO:1990716
      label: axonemal central apparatus
  biological_processes:
  - preferred_term: Sperm flagellum assembly
    modifier: DECREASED
    term:
      id: GO:0120316
      label: sperm flagellum assembly
  downstream:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CFAP70 is required for the biogenesis of spermatid flagella partially by regulating the expression of OAT-associated proteins (e.g., QRICH2), assisting the cytoplasmic preassembly of the calmodulin- and radial spoke-associated complex (CSC), and controlling the manchette localization of axoneme-related proteins."
    explanation: Mechanism of the assembly defect in knockout spermatids.
  - reference: PMID:37458246
    reference_title: "Experimental and molecular support for Cfap70 as a causative gene of 'multiple morphological abnormalities of the flagella' with male infertility†."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, the lack of CFAP70 impairs sperm flagellum biogenesis and head shaping during spermiogenesis."
    explanation: An independent knockout confirms the flagellar biogenesis defect.

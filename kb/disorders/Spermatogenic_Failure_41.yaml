    evidence:
    - reference: PMID:37458246
      reference_title: "Experimental and molecular support for Cfap70 as a causative gene of 'multiple morphological abnormalities of the flagella' with male infertility†."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings show that the loss of CFAP70 leads to multiple morphological abnormalities of the flagella and spermiogenesis defects."
      explanation: MMAF in the second knockout line.
treatments:

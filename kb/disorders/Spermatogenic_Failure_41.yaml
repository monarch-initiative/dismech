mechanistic_hypotheses:
- hypothesis_group_id: cfap70_sperm_restricted_in_humans
  hypothesis_label: CFAP70 loss causes isolated male infertility in humans although knockout mice also develop motile-cilia disease
  status: EMERGING
  description: >-
    All three reported men have infertility alone, with no respiratory or
    other ciliary symptoms. Cfap70 knockout mice, by contrast, develop fully
    penetrant hydrocephalus and sinusitis with central-pair defects in
    ependymal and tracheal cilia, as do knockouts of the other C2a genes.
    Whether the human sparing reflects species differences, redundancy or
    under-ascertainment in three probands is unresolved.
  evidence:
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients carrying CFAP70 variants in Charles Coutton's study23 and our current study have no symptoms other than male sterility, indicating no obvious role or functional redundancy of CFAP70 in the development of ependymal cilia in humans."
    explanation: No extra-reproductive ciliary disease in the three reported men.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of the patient's physical examination revealed normal development of male external genitalia, normal bilateral testicular size, no abnormality in the bilateral spermatic veins, normal hormone levels and no PCD-related symptoms."
    explanation: The nonsense proband was examined and had no PCD-related symptoms.
  - reference: PMID:42417609
    reference_title: "Proteomic composition and mutual assembly of the C2a projection in vertebrate motile cilia."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Importantly, the hydrocephalus and sinusitis phenotypes were fully penetrant in the KO mice of each strain (Figure 1K)."
    explanation: >-
      Cfap70 knockout mice have motile-cilia disease, which argues that
      CFAP70 is not sperm-specific. This is mouse evidence; no affected man
      has these features.
  - reference: PMID:37352829
    reference_title: "CFAP70 is a solid and valuable target for the genetic diagnosis of oligo-astheno-teratozoospermia in infertile men."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In addition to OAT, Cfap70-KO mice suffer from neonatal hydrocephalus, which leads to a high ratio of premature lethality."
    explanation: A second knockout with hydrocephalus.

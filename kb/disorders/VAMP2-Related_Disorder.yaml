pathophysiology:
- name: VAMP2 v-SNARE Defect
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  biological_scale: MOLECULAR
  description: >-
    De novo variants affect conserved residues of the VAMP2 SNARE motif (residues
    31-91) — the region whose zippering with syntaxin-1 and SNAP-25 provides the
    energy for membrane fusion. Three allelic classes are reported — a scheme that
    is the literature's and not exhaustive, since a de novo start-loss variant
    (c.1A>G, p.Met1?) fits none of them: non-synonymous variants within the
    motif, of which the three index-cohort variants
    (p.Ser75Pro, p.Phe77Ser, p.Glu78Ala) cluster in its C-terminal portion, with
    p.Gly73Trp reported adjacent to that cluster and p.Arg56Leu, p.Arg66Pro and
    p.Ala67Pro lying further N-terminally; in-frame single-amino-acid deletions at
    more N-terminal residues (p.Val43del, p.Ile45del); and truncating
    loss-of-function variants (p.Arg56*, p.Tyr113Glnfs*12). VAMP2 is the vesicle-associated (v-)SNARE essential for
    vesicular exocytosis and activity-dependent neurotransmitter release, so these
    variants act directly on the fusion machinery. The downstream route differs by
    allelic class: SNARE-motif missense variants act dominant-negatively, whereas
    truncating variants are proposed to act through haploinsufficiency.

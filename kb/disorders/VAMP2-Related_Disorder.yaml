imaging_findings:
- name: Delayed Myelination
  modality: MRI
  description: >-
    Brain MRI was unrevealing in four of the five individuals of the index cohort.
    The exception showed a generalized delay in myelin maturation at age 2 years.
    Normal brain imaging does not argue against the diagnosis. The corpus callosum
    and cerebral white matter volume findings from the same individual, and the
    brain atrophy reported independently, are curated separately, since each is a
    distinct abnormality with its own HPO term.
  imaging_finding_term:
    preferred_term: Delayed myelination
    term:
      id: HP:0012448
      label: Delayed myelination
  located_in:
    preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) was unrevealing in all children except
      in individual 1, for whom mild myelination delay and a posteriorly slender
      corpus callosum was observed at the age of 2 years

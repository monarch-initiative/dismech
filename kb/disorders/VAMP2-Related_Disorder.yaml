name: VAMP2-Related Neurodevelopmental Disorder
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A neurodevelopmental disorder caused by de novo variants in VAMP2, which encodes
  the vesicular SNARE protein VAMP2 (synaptobrevin-2). Together with its
  plasma-membrane partners syntaxin-1 and SNAP-25, VAMP2 forms the neuronal SNARE complex
  that mediates calcium-triggered fusion of synaptic vesicles and neurotransmitter
  release. Three allelic classes are reported (a scheme that is the literature's
  and not exhaustive — a de novo start-loss variant fits none of them):
  non-synonymous (missense) variants
  within the SNARE motif, of which the three index-cohort variants cluster in its
  C-terminal portion; in-frame single-amino-acid deletions at more N-terminal
  SNARE-motif residues; and truncating loss-of-function variants. Two mechanisms
  are correspondingly invoked — dominant-negative interference with wild-type
  VAMP2 by SNARE-motif missense variants, and haploinsufficiency from truncating
  variants — and the in vitro fusion defect is variant-specific rather than
  uniform across the allelic series. Affected individuals present from birth with
  axial hypotonia, intellectual disability, and autistic features with Rett-like
  motor stereotypies and a virtual absence of purposeful hand movements. Within the
  index cohort the three children with C-terminal missense variants were the more
  severely affected, additionally having central visual impairment and a
  hyperkinetic movement disorder. Neither association is curated as holding
  across all reported patients: hyperkinetic movement is directly documented
  outside that cluster, and for central visual impairment the poor visual
  fixation that precedes it is. Epilepsy does not track genotype as cleanly: within the index cohort
  one C-terminal missense carrier never had seizures while one
  single-amino-acid-deletion carrier did, and EEG abnormalities were recorded
  across the cohort. It completes the three core neuronal SNAREs among the synaptic
  vesicle cycle disorders — the vesicle-side (v-SNARE) counterpart of SNAP25
  (t-SNARE) and syntaxin-1B.

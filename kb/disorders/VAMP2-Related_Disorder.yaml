name: VAMP2-Related Neurodevelopmental Disorder
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A neurodevelopmental disorder caused by de novo variants in VAMP2, which encodes
  the vesicular SNARE protein VAMP2 (synaptobrevin-2). Together with its plasma-
  membrane partners syntaxin-1 and SNAP-25, VAMP2 forms the neuronal SNARE complex
  that mediates calcium-triggered fusion of synaptic vesicles and neurotransmitter
  release. Pathogenic single-amino-acid deletions and non-synonymous variants
  affect conserved residues of the C-terminal VAMP2 SNARE motif and impair vesicle
  fusion. Affected individuals present from birth with axial hypotonia,
  intellectual disability, and autistic features (with Rett-like motor
  stereotypies); more severe C-terminal variants add central visual impairment, a
  hyperkinetic movement disorder, and epilepsy/EEG abnormalities. It completes the
  three core neuronal SNAREs among the synaptic vesicle cycle disorders — the
  vesicle-side (v-SNARE) counterpart of SNAP25 (t-SNARE) and syntaxin-1B.
category: Mendelian
parents:
- Neurodevelopmental Disorder

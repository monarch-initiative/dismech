animal_models:
- name: Synaptobrevin-2 (Vamp2) knockout mouse
  species: Mouse (Mus musculus)
  genotype: Vamp2 (synaptobrevin-2) homozygous knockout
  description: >-
    Constitutive null mice are the source of the causal claim that VAMP2 is
    required for fast calcium-triggered synaptic vesicle fusion and for fast
    vesicle endocytosis. In their absence, spontaneous and sucrose-evoked fusion
    fall about 10-fold while fast calcium-triggered fusion falls more than
    100-fold; endocytosis and recycling-pool replenishment are also delayed. The
    mice die immediately after birth.
  publication: PMID:11691998
  modeled_mechanisms:
  - target: Impaired SNARE-Mediated Vesicle Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes the direction and the disproportionate sensitivity of
      calcium-triggered release to loss of VAMP2, which is the mechanism this node
      asserts.
    limitations: >-
      Homozygous null, not the heterozygous state of affected humans, and a
      complete absence of protein rather than a SNARE-motif missense allele acting
      dominant-negatively. The mice die perinatally and so model neither the
      surviving human neurodevelopmental course nor the graded genotype-phenotype
      correlation. The knockout is informative for the haploinsufficiency arm's
      direction of effect but cannot test dominant-negative interference, which
      requires mutant protein to be present.
    readouts:
    - name: Fast calcium-triggered synaptic vesicle fusion
      target: Impaired SNARE-Mediated Vesicle Fusion
      direction: DECREASED
      interpretation: >-
        Electrophysiological measure of the fusion step this node models.
      evidence:
      - reference: PMID:11691998
        reference_title: "SNARE function analyzed in synaptobrevin/VAMP knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the absence of synaptobrevin 2, spontaneous synaptic vesicle fusion
          and fusion induced by hypertonic sucrose were decreased approximately
          10-fold, but fast Ca2+-triggered fusion was decreased more than 100-fold.
        explanation: >-
          Quantifies the fusion defect and shows calcium-triggered release is the
          most sensitive component.
    evidence:
    - reference: PMID:11691998
      reference_title: "SNARE function analyzed in synaptobrevin/VAMP knockout mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, synaptobrevin 2 may function in catalyzing fusion reactions and
        stabilizing fusion intermediates but is not absolutely required for
        synaptic fusion.
      explanation: >-
        The knockout supports a catalytic rather than strictly obligatory role, so
        it substantiates the node only partially — fusion is degraded, not
        abolished.
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The knockout is the primary evidence that VAMP2 is required for fast
      endocytosis and readily-releasable-pool replenishment, not only exocytosis.
    limitations: >-
      Homozygous null rather than the human heterozygous missense/truncating state.
      More seriously, the direct test of endocytosis in human variant-expressing
      neurons was negative, so this is the one arm where the model and the human
      data disagree — hence LOW fidelity and PARTIALLY_RECAPITULATES rather than a
      claim that the model reproduces a human mechanism.
    readouts:
    - name: Stimulus-dependent endocytosis of HRP and FM1-43
      target: Impaired Synaptic Vesicle Endocytosis and Recycling
      direction: DECREASED
      interpretation: >-
        Tracer-uptake measure of the endocytic retrieval step.
      evidence:
      - reference: PMID:15475946
        reference_title: "Synaptobrevin is essential for fast synaptic-vesicle endocytosis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the stimulus-dependent endocytosis of horseradish peroxidase and
          fluorescent FM1-43 were delayed
        explanation: >-
          Direct measurement of delayed endocytosis in knockout synapses.
    evidence:
    - reference: PMID:15475946
      reference_title: "Synaptobrevin is essential for fast synaptic-vesicle endocytosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        replenishment of the pool is delayed by knockout of synaptobrevin.
      explanation: >-
        Supports treating the knockout as informative for the recycling node.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice present severely decreased rates of both spontaneous and Ca2+-triggered
      synaptic-vesicle fusion, and these mice die immediately after birth.
    explanation: >-
      The index clinical report's own framing of the knockout phenotype, including
      the perinatal lethality that bounds its use as a disease model.
experimental_models:
- name: Reconstituted SNARE liposome lipid-mixing (fusion) assay
  description: >-
    Cell-free reconstitution in which purified wild-type or variant VAMP2 is
    incorporated into fluorescent donor liposomes and the syntaxin-1/SNAP-25
    t-SNARE complex into acceptor liposomes; fusion is read out as NBD-to-rhodamine
    dequenching. Run with and without Munc18-1, and with 50:50 wild-type:mutant
    donor liposomes to emulate the heterozygous state. This is the assay behind the
    entry's fusion claims, and behind their variant-specific limits.
  experimental_model_type: OTHER
  publication: PMID:30929742
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We read out membrane fusion between the donor and acceptor liposome mixing
      by quantifying increased fluorescence resulting from the dequenching of NBD
      fluorescence
    explanation: >-
      Describes the reconstituted readout, establishing that this model system was
      applied to the disease variants.
  modeled_mechanisms:
  - target: Impaired SNARE-Mediated Vesicle Fusion
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Isolates the SNARE fusion step from all other presynaptic biology, which is
      what makes it decisive for p.Ser75Pro and uninformative for variants whose
      defect lies in regulatory-protein interaction.
    limitations: >-
      Contains only the core SNAREs (plus Munc18-1 where added) — synaptotagmin-1,
      complexin, and Munc13 are absent, so a variant that acts through those
      regulators scores as normal. p.Glu78Ala is the worked example: pathogenic in
      patients, indistinguishable from wild-type here. p.Phe77Ser could not be
      purified and was never tested.
    readouts:
    - name: Endpoint liposome fusion normalized to wild-type VAMP2
      target: Impaired SNARE-Mediated Vesicle Fusion
      direction: DECREASED
      interpretation: >-
        Fell to ~25% of wild-type for p.Ser75Pro; unchanged for p.Glu78Ala.
      evidence:
      - reference: PMID:30929742
        reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the VAMP2 disease-associated variant p.Ser75Pro reduced the rate and
          extent of fusion compared to that seen with VAMP2 WT, whereas the
          p.Glu78Ala variant had little to no effect
        explanation: >-
          The primary readout, reported for both variants, including the negative
          result.
    evidence:
    - reference: PMID:30929742
      reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To evaluate the functional consequence of VAMP2 variants, we employed the
        reconstituted, lipid-mixing assay based on NBD
      explanation: >-
        Establishes the assay as the functional test applied to the disease
        variants.
- name: Variant-expressing cultured neurons with synaptophysin-pHluorin imaging
  description: >-
    Cultured neurons expressing VAMP2 disease variants, assayed by live-cell
    imaging of the synaptophysin-pHluorin optical reporter of synaptic vesicle
    recycling together with electrophysiology. Unlike the liposome assay this
    system contains the full presynaptic regulatory complement, and it is the
    system in which dominant-negative behaviour was separated from
    haploinsufficiency and in which aminopyridine rescue was tested.
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:32906212
  evidence:
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we used live cell imaging of an optical reporter of SV recycling,
      synaptophysin-pHluorin (syp-pH).
    explanation: >-
      Establishes the reporter and imaging approach that define this model system.
  modeled_mechanisms:
  - target: Dominant-Negative Interference with Wild-Type VAMP2
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Distinguishes SNARE-motif missense variants, which suppress
      action-potential-triggered fusion in the presence of endogenous wild-type
      VAMP2, from the nonsense variant, which does not.
    limitations: >-
      Rat primary hippocampal neurons, not human cells — relevant because this
      system supplies the negative endocytosis result used to bound the
      recycling node and to anchor the HUMAN_MODEL_MISMATCH discussion. Variants
      are expressed on a wild-type background rather than knocked in at the
      endogenous locus, so expression level is not the patients'; only three
      variants were tested.
    readouts:
    - name: Rate of exocytosis and size of the released recycling pool
      target: Dominant-Negative Interference with Wild-Type VAMP2
      direction: DECREASED
      interpretation: >-
        Two of three tested variants reduced both measures relative to wild-type.
      evidence:
      - reference: PMID:32906212
        reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In cellular models, two variants decrease both the rate of exocytosis and
          the number of synaptic vesicles released from the recycling pool,
          compared with wild-type.
        explanation: >-
          The primary readout distinguishing variants with and without a cellular
          release defect.
    evidence:
    - reference: PMID:32906212
      reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Synaptic vesicle recycling and neurotransmission were assayed in neurons
        expressing three VAMP2 variants by live-cell imaging and
        electrophysiology.
      explanation: >-
        Establishes the model system and the assays applied.
mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_snare_interference
  hypothesis_label: Dominant-negative interference by SNARE-motif missense variants
  status: CANONICAL
  description: >-
    SNARE-motif missense variants encode a stable protein that is incorporated
    into SNARE complexes but assembles or zippers defectively, poisoning complexes
    that also contain wild-type VAMP2. The decisive experiment is the 50:50
    wild-type:mutant liposome, whose fusion profile matched pure mutant rather
    than falling halfway — reduced dose alone cannot produce that. This is the
    better-evidenced arm and accounts for dominant inheritance. PMID:32906212
    associates the two dominant-negatively acting missense variants it tested,
    p.Gly73Trp and p.Arg56Leu, with a more severe phenotype including epilepsy —
    but epilepsy does not track the C-terminal cluster itself: the p.Ser75Pro
    carrier had no seizures while a p.Val43del carrier did, so severity and
    epilepsy are curated separately from cluster membership.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This implies that p.Ser75Pro mutant dominantly interferes with WT
    explanation: >-
      The authors' conclusion from the mixed-liposome experiment. Note this
      variant's carrier had no epileptic seizures, which is why this hypothesis is
      not curated as explaining an epilepsy phenotype.
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual 1 did not present with epileptic seizures
    explanation: >-
      Bounds this hypothesis: the carrier of the variant whose dominant-negative
      effect is the decisive experiment had no seizures.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      exert a dominant-negative effect on action potential-triggered SV fusion and
      neurotransmitter release in vitro
    explanation: >-
      Independent replication in neurons for additional missense variants
      (p.Gly73Trp, p.Arg56Leu), which are the variants the source ties to the more
      severe epilepsy-bearing phenotype — not the C-terminal cluster as such.
- hypothesis_group_id: truncating_haploinsufficiency
  hypothesis_label: Haploinsufficiency from truncating loss-of-function variants
  status: ALTERNATIVE
  description: >-
    Truncating variants act by reduced gene dose rather than by poisoning the
    complex: nonsense-mediated decay removes the mutant transcript and the
    truncated protein does not interfere with wild-type VAMP2 in cellular assays.
    Curated as ALTERNATIVE rather than a competing account of the same variants —
    the two arms are proposed for different allelic classes, and the phenotypic
    correlate is real (the truncating carrier was milder and had no epilepsy).
    It is the weaker arm on three counts: nonsense-mediated decay is predicted,
    not measured; the absent dominant-negative effect may be an artifact of a
    construct lacking the transmembrane domain and was not directly tested; and
    mouse Vamp2 heterozygous loss of function is reported to cause only a mild
    phenotype, which a pure gene-dose mechanism has to explain away.
  evidence:
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      does not cause dominant-negative effects, suggesting that haploinsufficiency
      underlies the disease mechanism for the R56X variant patient
    explanation: >-
      The in vitro basis of the haploinsufficiency proposal, PARTIAL because the
      authors state the dominant-negative effect was not directly tested.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Although not directly tested, this variant could also result in a dominant
      negative effect.
    explanation: >-
      The authors' explicit caveat that the haploinsufficiency attribution is not
      exclusive — kept on the hypothesis it qualifies.
discussions:
- discussion_id: gap_vamp2_glu78ala_no_fusion_defect
  prompt: >-
    Why is p.Glu78Ala pathogenic in patients when its reconstituted fusion profile
    is indistinguishable from wild-type and it remains fully Munc18-1-activatable —
    does it act through a regulatory protein absent from the assay (synaptotagmin-1,
    complexin, Munc13), and does the same apply to the untested p.Phe77Ser?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  rationale: >-
    The entry asserts impaired SNARE-mediated fusion as its central effector, but
    the assay supporting that node returned a clear defect for only one of the two
    variants it could test. A third could not be purified. Treating "disease
    variants impair fusion" as settled across the allelic series would overstate
    the evidence, and the alternative the authors themselves propose — disrupted
    binding to regulatory elements such as Munc18-1 or synaptotagmin — predicts
    different therapeutic leverage. Until this is resolved, the fusion node is
    curated as variant-specific.
  proposed_experiments:
  - experiment_id: exp_vamp2_glu78ala_full_regulatory_fusion
    name: Reconstituted fusion with the full regulatory complement
    description: >-
      Repeat the lipid-mixing assay for p.Glu78Ala with synaptotagmin-1,
      complexin, and Munc13 included, under calcium triggering, and compare with
      wild-type.
    would_support:
    - A calcium-triggered release defect appearing only when regulatory proteins are present would support the regulatory-interaction mechanism.
    would_refute:
    - A normal profile even with the full regulatory complement would leave p.Glu78Ala pathogenicity unexplained by any fusion-step mechanism.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The pathophysiological phenotype for the p.Glu78Ala variant might be due to
      impaired interactions with regulatory proteins that were not included in the
      in vitro assay.
    explanation: >-
      The authors' own statement of the gap and of the leading candidate
      explanation.
- discussion_id: mismatch_vamp2_null_mouse_vs_human_heterozygote
  prompt: >-
    How far does the homozygous Vamp2-null mouse, which dies immediately after
    birth, inform a human disorder caused by heterozygous missense and truncating
    variants in surviving children with a graded genotype-phenotype correlation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  - pathophysiology#VAMP2 Haploinsufficiency
  - pathophysiology#Impaired Synaptic Vesicle Endocytosis and Recycling
  rationale: >-
    The knockout supplies the strongest causal evidence that VAMP2 is required for
    fast calcium-triggered fusion and for fast endocytosis, and the entry relies on
    it for both. But it models neither human allelic class: it removes the protein
    entirely, so it cannot exhibit dominant-negative interference, which requires
    mutant protein to be present, and it is homozygous and perinatally lethal,
    whereas affected humans are heterozygous and survive into adolescence with
    variable severity. The mismatch cuts against the haploinsufficiency arm
    specifically: mouse Vamp2 heterozygous loss of function is reported to cause
    only a mild phenotype, whereas the humans proposed to have a
    haploinsufficiency mechanism have a neurodevelopmental disorder. No knock-in
    of a human SNARE-motif variant has been reported, so the dominant-negative
    arm has never been tested in vivo at all. Separately, the one direct test of
    endocytosis in human variant-expressing neurons was negative, while the
    endocytic requirement is well established in the null mouse — so the
    recycling node's species evidence and its human evidence disagree.
  proposed_experiments:
  - experiment_id: exp_vamp2_snare_motif_knockin_mouse
    name: Knock-in mouse carrying a human SNARE-motif variant
    description: >-
      Generate and characterize knock-in mice carrying a human SNARE-motif
      missense variant (e.g. p.Ser75Pro) and a truncating variant, benchmarked
      against the already-reported heterozygous null, comparing survival, evoked
      release, endocytosis, and behaviour.
    would_support:
    - A missense knock-in more severely affected than the reported mild heterozygous null phenotype would confirm dominant-negative action in vivo and validate the two-arm model.
    would_refute:
    - A missense knock-in no worse than the heterozygous null would argue that reduced dose accounts for both allelic classes and that the dominant-negative arm is an in vitro artifact.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice present severely decreased rates of both spontaneous and Ca2+-triggered
      synaptic-vesicle fusion, and these mice die immediately after birth.
    explanation: >-
      Establishes both the model's informativeness and the perinatal lethality that
      limits its translational reach.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      while VAMP2 heterozygosity loss of function in mice causes only a mild
      phenotype
    explanation: >-
      The heterozygous mouse — the genotype that actually matches the human
      truncating carriers — is only mildly affected, which is the substance of
      the mismatch for the haploinsufficiency arm.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The post-stimulus fluorescence decay of syp-pH, representing endocytosis, is
      not significantly altered by any of the VAMP2 variants compared to WT
    explanation: >-
      The human-versus-mouse disagreement on the endocytic arm, recorded here
      because it is the same translational-validity question.

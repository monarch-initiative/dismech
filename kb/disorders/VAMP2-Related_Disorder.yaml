  - reference: PMID:37901860
    reference_title: "VAMP2 Gene-Related Neurodevelopmental Disorder: A Differential Diagnosis for Rett/Angelman-Type Spectrum of Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Later, she developed a sleep disorder, challenging behaviour with

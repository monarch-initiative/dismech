    causal_link_type: DIRECT
- name: Disrupted Neurotransmission and Impaired Neurodevelopment
  conforms_to: "synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit"
  description: >-
    Impaired SNARE-mediated fusion reduces activity-dependent neurotransmitter
    release, disturbing cortical synaptic transmission and activity-dependent brain
    development. This produces axial hypotonia from birth, intellectual disability,
    and autistic features with motor stereotypies; more severe C-terminal variants
    additionally cause central visual impairment, a hyperkinetic movement disorder,
    and epilepsy.
  role: effector

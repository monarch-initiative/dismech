      disability, and autistic features.
    explanation: >-
      Establishes the de novo dominant genetic basis and core phenotype.
pathophysiology:
- name: VAMP2 v-SNARE Defect
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    De novo single-amino-acid deletions and non-synonymous variants affect
    conserved residues within the C-terminal VAMP2 SNARE motif — the region whose
    zippering with syntaxin-1 and SNAP-25 provides the energy for membrane fusion.
    VAMP2 is the vesicle-associated (v-)SNARE that is essential for vesicular
    exocytosis and activity-dependent neurotransmitter release, so these variants
    directly impair the fusion machinery.
  role: trigger
  cell_types:

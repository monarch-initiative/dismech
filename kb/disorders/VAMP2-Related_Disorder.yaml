    Impaired SNARE-mediated fusion reduces activity-dependent neurotransmitter
    release, disturbing cortical synaptic transmission and activity-dependent brain
    development. This produces axial hypotonia from birth, intellectual disability,
    and autistic features with motor stereotypies. Within the index cohort the
    three C-terminal missense carriers were additionally the ones with central
    visual impairment and a hyperkinetic movement disorder, but neither is curated
    as holding across all reported patients: a p.Ala67Pro carrier developed a
    hyperkinetic movement disorder, and for central visual impairment it is the
    preceding poor visual fixation that is documented outside the cluster.
    Seizures occur across allelic classes and are likewise not curated as a
    genotype-specific consequence.

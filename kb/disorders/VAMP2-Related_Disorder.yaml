- name: Impaired SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  biological_scale: CELLULAR
  description: >-
    VAMP2 is one of the three core neuronal SNAREs whose zippering, triggered by the
    calcium sensor synaptotagmin-1, fuses the synaptic vesicle with the presynaptic
    membrane. The fusion defect is variant-specific rather than uniform across the
    allelic series: in the reconstituted lipid-mixing assay p.Ser75Pro reduced
    fusion to roughly 25% of wild-type and could not be activated by Munc18-1 (a
    >90% loss-of-function under Munc18-activated conditions), whereas p.Glu78Ala
    was indistinguishable from wild-type and p.Phe77Ser could not be purified for
    testing. In cultured neurons, two of three variants tested reduced both the
    rate of exocytosis and the size of the released recycling pool. The authors
    therefore frame impaired fusion as one of the possible mechanisms and
    explicitly invoke mutation-specific mechanisms; for variants without a
    reconstituted fusion defect, disrupted interaction with regulatory proteins
    absent from the assay is the proposed alternative. This is the module's key
    conformance target — the fusion-machinery arm.

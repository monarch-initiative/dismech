genetic:
- name: VAMP2
  gene_term:
    preferred_term: VAMP2
    term:
      id: hgnc:12643
      label: VAMP2
  association: SNARE-Motif Mutations
  presence: Positive
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant (De Novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:30929742
      reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Chromatograms of individuals 1–5 and their parents confirm the de-novo
        occurrence of the VAMP2 variants in all cases.
      explanation: >-
        Sanger confirmation of de novo occurrence in every case establishes the
        de novo dominant mode for this gene-disease relationship.
  notes: >-
    Three allelic classes are reported. (1) De novo non-synonymous variants
    within the SNARE motif. The three index-cohort variants (p.Ser75Pro,
    p.Phe77Ser, p.Glu78Ala) cluster in the C-terminal portion of the motif and
    are the ones shown to act dominant-negatively. Of the later-reported missense
    variants, p.Gly73Trp is described as lying in close proximity to p.Ser75Pro
    and so sits adjacent to that cluster, while p.Arg56Leu, p.Arg66Pro and
    p.Ala67Pro lie further N-terminally within the motif; the "C-terminal cluster"
    claim should not be extended to those three. (2) De novo in-frame
    single-amino-acid deletions at more N-terminal SNARE-motif residues
    (p.Val43del, p.Ile45del), associated with milder involvement — these
    individuals walk and speak a few words. (3) Truncating loss-of-function
    variants (p.Arg56*, p.Tyr113Glnfs*12), proposed to act through
    haploinsufficiency. The SNARE motif spans residues 31-91; VAMP2 carried no
    loss-of-function variants in ExAC, consistent with constraint. The three-class
    scheme is the literature's and is not exhaustive: a de novo start-loss variant
    (c.1A>G, p.Met1?) has also been reported and fits none of them.
  variants:
  - name: NM_014232(VAMP2):c.223T>C (p.Ser75Pro)
    type: missense
    clinical_significance: PATHOGENIC
    description: >-
      C-terminal SNARE-motif missense variant. The only variant with a
      demonstrated reconstituted fusion defect: fusion reduced to ~25% of
      wild-type, no Munc18-1 activation (>90% loss of function under
      Munc18-activated conditions), and dominant interference with wild-type
      VAMP2 in 50:50 mixed liposomes. Predicted to lose two hydrogen bonds, one
      interchain with Tyr243 of STX1A and one intrachain with Gln71.
    evidence:
    - reference: PMID:30929742
      reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Replacement analysis shows that the p.Ser75Pro variant will result in the
        loss of two hydrogen bonds, one interchain between Ser75 of VAMP2 and
        Tyr243 of STX1A and one intrachain between Ser75 and Gln71
      explanation: >-
        Structural basis for the p.Ser75Pro fusion defect.
  - name: NM_014232(VAMP2):c.233A>C (p.Glu78Ala)
    type: missense
    clinical_significance: PATHOGENIC
    description: >-
      C-terminal SNARE-motif missense variant that disrupts the hydrogen bond
      between Glu78 of VAMP2 and Arg246 of STX1A, but whose reconstituted fusion
      profile was indistinguishable from wild-type and which remained
      Munc18-1-activatable. Its pathogenic mechanism is unresolved; the authors
      propose impaired interaction with regulatory proteins absent from the assay.
    evidence:
    - reference: PMID:30929742
      reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the p.Glu78Ala variant disrupts the hydrogen bond between Glu78 of VAMP2
        and Arg246 of STX1A
      explanation: >-
        Structural consequence, recorded alongside the absent functional effect in
        the fusion assay.
  - name: NM_014232(VAMP2):c.230T>C (p.Phe77Ser)
    type: missense
    clinical_significance: PATHOGENIC
    description: >-
      C-terminal SNARE-motif missense variant introducing a hydrophilic residue
      into an otherwise hydrophobic region. Could not be purified, so it was never
      tested in the reconstituted fusion assay.
    evidence:
    - reference: PMID:30929742
      reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, all attempts to isolate the p.Phe77Ser were unsuccessful.
      explanation: >-
        Records why no functional data exist for this variant.
  - name: NM_014232(VAMP2):c.128_130delTGG (p.Val43del)

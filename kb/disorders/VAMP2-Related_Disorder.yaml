- name: Dominant-Negative Interference with Wild-Type VAMP2
  biological_scale: MOLECULAR
  description: >-
    SNARE-motif missense variants produce a protein that is still incorporated
    into the SNARE complex but assembles or zippers defectively, so the mutant
    poisons complexes that also contain wild-type VAMP2. In the reconstituted
    fusion assay, liposomes carrying a 50:50 mixture of wild-type and p.Ser75Pro
    VAMP2 fused no better than liposomes carrying mutant protein alone — the
    signature of dominant-negative action, and a direct explanation for dominant
    inheritance of a heterozygous variant. Cellular assays extend this to
    p.Gly73Trp and p.Arg56Leu, which reduce action-potential-triggered vesicle
    fusion and are associated with the more severe, epilepsy-bearing phenotype.

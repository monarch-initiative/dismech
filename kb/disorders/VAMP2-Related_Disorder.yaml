- name: VAMP2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Truncating variants (p.Arg56*, p.Tyr113Glnfs*12) are predicted to trigger
    nonsense-mediated decay, leaving a single functional VAMP2 allele. Unlike the
    missense variants, the truncated protein did not interfere with wild-type
    VAMP2 in cellular assays, so reduced gene dose rather than poisoning of the
    complex is the proposed mechanism. VAMP2 is strongly constrained in population
    databases, consistent with intolerance to loss of function. Two caveats keep
    this arm weaker than the dominant-negative one: nonsense-mediated decay is
    predicted rather than measured, and the authors attribute the absent
    dominant-negative effect possibly to their construct lacking the
    transmembrane domain, noting it was not directly tested.

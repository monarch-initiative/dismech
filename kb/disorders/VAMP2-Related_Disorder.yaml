- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  conforms_to: "synaptic_vesicle_cycle#Impaired Synaptic Vesicle Endocytosis and Recycling"
  biological_scale: CELLULAR
  description: >-
    Beyond its role in fusion, VAMP2 is required for fast, stimulus-dependent
    synaptic vesicle endocytosis and for replenishment of the readily releasable
    pool. Synaptobrevin-2 knockout synapses show delayed pool replenishment,
    altered vesicle shape and size, and delayed uptake of endocytic tracers.
    **This node rests on the mouse knockout only.** When the human disease
    variants were tested directly, post-stimulus syp-pHluorin decay — the
    endocytosis readout — was not significantly altered by any of them. The
    reduced "recycling pool released" measure reported for two variants is an
    exocytosis-extent measure, not a measure of endocytic retrieval, and it
    belongs to the fusion arm. Whether losing one VAMP2 allele or expressing a
    SNARE-motif variant impairs human endocytosis is therefore untested at best
    and negative on the one direct measurement available.

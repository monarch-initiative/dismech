diagnosis:
- name: VAMP2 Molecular Diagnosis
  description: >-
    Diagnosis is established by identifying a de novo heterozygous pathogenic VAMP2
    variant (SNARE-motif deletion or non-synonymous variant) in a child with
    congenital axial hypotonia, intellectual disability, and autistic features.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: VAMP2
        term:
          id: hgnc:12643
          label: VAMP2
  results: A de novo pathogenic VAMP2 SNARE-motif variant establishes the diagnosis.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report five heterozygous de novo mutations in VAMP2 in unrelated
      individuals
    explanation: >-
      Molecular identification of de novo VAMP2 variants establishes the diagnosis.
differential_diagnoses:
- name: Rett syndrome and Rett-like disorders
  description: >-
    The autistic features with hand stereotypies, absent purposeful hand movements,
    and developmental impairment resemble Rett syndrome; VAMP2 disease is
    distinguished by molecular testing.
  distinguishing_features:
  - A de novo VAMP2 SNARE-motif variant favors this disorder.
  - MECP2 (or CDKL5/FOXG1) variants favor Rett syndrome or a Rett-like disorder.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including variable motor stereotypies resembling Rett syndrome
    explanation: >-
      The index report itself frames the stereotypies as Rett-resembling, which is
      the source of the diagnostic confusion.
  - reference: PMID:37901860
    reference_title: "VAMP2 Gene-Related Neurodevelopmental Disorder: A Differential Diagnosis for Rett/Angelman-Type Spectrum of Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presenting with features of either Rett syndrome or Angelman
      syndrome, in whom genetic testing is not suggestive, should be evaluated for
      variants in the VAMP2 gene, given the significant overlap in clinical
      presentation of these disorders.
    explanation: >-
      Explicit recommendation to test VAMP2 in genetically unexplained Rett- or
      Angelman-like presentations — the practical content of this differential.
- name: Angelman syndrome and Angelman-like disorders
  description: >-
    The developmental impairment, absent speech, movement disorder, and epilepsy
    overlap with Angelman syndrome. VAMP2 has been recovered by exome sequencing
    of a cohort assembled for an Angelman-syndrome-like phenotype with negative
    UBE3A/15q testing, so it belongs in that differential rather than only in the
    Rett one.
  distinguishing_features:
  - A de novo VAMP2 variant favors this disorder.
  - UBE3A variants or a 15q11-q13 imprinting/deletion defect favor Angelman syndrome.
  evidence:
  - reference: PMID:34653234
    reference_title: "New genes involved in Angelman syndrome-like: Expanding the genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of WES led to the identification of 10 new genes that cause an
      AS-like phenotype (SYNGAP1, VAMP2, TBL1XR1, ASXL3, SATB2, SMARCE1, SPTAN1,
      KCNQ3, SLC6A1 and LAS1L), all of them previously associated with other
      neurodevelopmental disorders.
    explanation: >-
      Places VAMP2 among the genes recovered from an Angelman-syndrome-like
      diagnostic cohort.
  - reference: PMID:37901860
    reference_title: "VAMP2 Gene-Related Neurodevelopmental Disorder: A Differential Diagnosis for Rett/Angelman-Type Spectrum of Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      highlights this condition as an important differential diagnosis of
      Rett/Angelman-type spectrum of disorders.
    explanation: >-
      States the Angelman-spectrum differential directly.
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Other SNARE-machinery and synaptic vesicle cycle disorders (SNAP25, STX1B,
    STXBP1, SYT1) overlap through developmental impairment, movement disorder, and
    epilepsy, and are distinguished by molecular testing.
  distinguishing_features:
  - A de novo VAMP2 variant favors this disorder.
  - A variant in another SNARE/vesicle-cycle gene favors the corresponding SNAREopathy.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Together with its partners syntaxin-1A and synaptosomal-associated protein 25
      (SNAP25), VAMP2 mediates fusion of synaptic vesicles to release
      neurotransmitters.
    explanation: >-
      Places VAMP2 within the SNARE complex shared with the other SNAREopathies.
      Definitional background rather than a study result, hence OTHER — matching
      how the same sentence is tagged on the fusion node.
progression:
- phase: Infancy to Childhood
  notes: >-
    Neurodevelopmental impairment occurs within the first year of life, beginning
    with axial hypotonia at birth. In the index cohort the C-terminal missense
    carriers additionally developed a hyperkinetic movement disorder in the first
    year, and were later diagnosed with central visual impairment after poor
    visual fixation from the first months of life. Hyperkinetic movement has also
    been reported with onset at 8 years in a carrier outside that cluster. Seizure
    onset ranges from shortly after birth to age 5 and is not confined to the
    severe group.
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      axial hypotonia (which had been present since birth)
    explanation: >-
      Documents the congenital onset with axial hypotonia.
treatments:
- name: Antiseizure Medication
  description: >-
    Epilepsy, when present, is managed with antiseizure medication. In the index
    cohort valproic acid, vigabatrin, and lamotrigine were trialed in the three
    individuals with seizures; benefit was noted only for valproic acid, in the
    individual with the mildest epilepsy phenotype, who became seizure-free with
    normal follow-up EEGs. No disease-specific antiseizure strategy has been
    established, and the evidence base is a handful of individual treatment
    courses rather than any trial. Adrenocorticotropic hormone for infantile
    spasms is curated as a separate treatment.
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
  evidence:
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several anti-epileptic drugs, including valproic acid, vigabatrin, and
      lamotrigine, have been trialed in individuals 2–4
    explanation: >-
      Names the antiseizure agents actually used in the reported cohort.
  - reference: PMID:30929742
    reference_title: "Mutations in the Neuronal Vesicular SNARE VAMP2 Affect Synaptic Membrane Fusion and Impair Human Neurodevelopment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      beneficial effects of valproic acid treatment were noted in individual 4,
      who has been seizure-free since the age of 12 years and has had normal
      follow-up EEGs
    explanation: >-
      The only reported antiseizure benefit, and it is a single uncontrolled
      observation — hence PARTIAL rather than SUPPORT for a general
      recommendation.
- name: Adrenocorticotropic Hormone for Infantile Spasms
  description: >-
    Infantile spasms with hypsarrhythmia were treated with adrenocorticotropic
    hormone in an independently reported case, with complete resolution of the
    spasms. Curated separately from maintenance antiseizure medication because
    the indication, the agent class, and the course of therapy are all distinct.
    The interictal EEG abnormality persisted after the spasms resolved, so the
    response was seizure-specific rather than a normalization of the underlying
    encephalopathy. This is a single case, not a disease-specific recommendation.
  therapeutic_modality: PEPTIDE
  target_phenotypes:
  - preferred_term: Infantile spasms
    term:
      id: HP:0012469
      label: Infantile spasms
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adrenocorticotropic hormone
      term:
        id: CHEBI:3892
        label: corticotropin
  evidence:
  - reference: PMID:32336483
    reference_title: "Variant in the neuronal vesicular SNARE VAMP2 (synaptobrevin-2): First report in Japan."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His infantile spasms completely disappeared by adrenocorticotropic hormone
      therapy, but his EEG findings continued to show high voltage slow-waves with
      multi-focal spikes.
    explanation: >-
      Single uncontrolled case showing spasm resolution but persistent interictal
      EEG abnormality — hence PARTIAL, and the reason the EEG caveat is stated in
      the description.
- name: Aminopyridine Potassium-Channel Blockade (Investigational)
  description: >-
    An investigational, mechanism-directed strategy rather than established care.
    Blocking presynaptic potassium channels with 4-aminopyridine or
    3,4-diaminopyridine prolongs the action potential, increasing calcium entry
    and release probability, and so compensates for — rather than corrects — the
    VAMP2 fusion deficit. In neurons expressing VAMP2 variants, aminopyridine
    increased the rate and extent of exocytosis and total synaptic charge
    transfer. Clinical experience is a single patient with a nonsense variant
    treated off-label for two years, with improved emotional and behavioral
    regulation by parental report and improvement on standardized cognitive
    measures. This is an uncontrolled n-of-1 observation; the authors propose
    testing responsiveness in vitro before treating. Safety caveat that matters
    in this disorder specifically: 4-aminopyridine lowers the seizure threshold
    and the authors advise caution in patients with epilepsy — and epilepsy,
    infantile spasms, and EEG abnormality are all curated features here. The
    treated patient carried a truncating variant and had no epilepsy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-aminopyridine
      term:
        id: CHEBI:34385
        label: 4-aminopyridine
    - preferred_term: 3,4-diaminopyridine
      term:
        id: CHEBI:135948
        label: amifampridine
  target_mechanisms:
  - target: Impaired SNARE-Mediated Vesicle Fusion
    treatment_effect: BYPASSES
    description: >-
      Aminopyridines do not repair the SNARE complex. They raise presynaptic
      calcium availability so that the residual fusion machinery achieves more
      release per action potential, compensating around the fusion deficit.
    evidence:
    - reference: PMID:32906212
      reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Aminopyridine treatment increases the rate and extent of exocytosis and
        total synaptic charge transfer and desynchronizes GABA release.
      explanation: >-
        Demonstrates the compensatory effect on the impaired exocytosis step in
        neurons expressing the disease variants.
  evidence:
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we tested a potential treatment strategy, enhancing neurotransmission by
      prolonging action potentials with the aminopyridine family of potassium
      channel blockers, 4-aminopyridine and 3,4-diaminopyridine, in vitro and in
      vivo.
    explanation: >-
      Defines the agents and the pharmacological rationale.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical response of the patient to 2 years of off-label aminopyridine
      treatment includes improved emotional and behavioral regulation by parental
      report, and objective improvement in standardized cognitive measures.
    explanation: >-
      The entire human evidence base is this single uncontrolled off-label
      treatment course, so the clinical claim is PARTIAL.
  - reference: PMID:32906212
    reference_title: "Overcoming presynaptic effects of VAMP2 mutations with 4-aminopyridine treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      4-AP should be used cautiously in patients with epilepsy given risk of
      lowering seizure threshold, which can limit its broad-based utility.
    explanation: >-
      The authors' own safety limitation, material because epilepsy is a curated
      feature of this disorder and the single treated patient did not have it.
  notes: >-
    Curated deliberately as investigational. One treated patient, no control
    condition, and the responder carried a nonsense (haploinsufficiency) variant —
    whether dominant-negative missense variants respond equally is untested.
- name: Supportive and Developmental Care
  description: >-
    Multidisciplinary supportive care — developmental and behavioral therapies,
    management of the movement disorder, and vision support — is the mainstay.
    There is no disease-modifying therapy, and the care needs follow directly from
    the phenotype: absent speech and absent purposeful hand use, non-ambulation in
    the severe group, central visual impairment, and challenging or self-injurious
    behavior.

- name: Impaired SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    VAMP2 is one of the three core neuronal SNAREs whose zippering, triggered by the
    calcium sensor synaptotagmin-1, fuses the synaptic vesicle with the presynaptic
    membrane. Disease variants in the C-terminal SNARE motif impair vesicle fusion,
    as shown directly in a reconstituted lipid-mixing assay, reducing calcium-
    triggered neurotransmitter release. This is the module's key conformance target
    — the fusion-machinery arm.
  role: central_effector

diagnosis:
- name: Germline multigene panel sequencing with copy-number analysis
  description: >-
    The carrier state has no clinical signs, so diagnosis is by sequencing.
    RAD51D is on widely used hereditary cancer panels. Copy-number analysis
    matters here rather than being optional: a substantial minority of
    pathogenic RAD51D alleles are indel- or copy-number-scale events that
    sequence-only panels miss.
  evidence:
  - reference: PMID:26261251
    reference_title: "Contribution of Germline Mutations in the RAD51B, RAD51C, and RAD51D Genes to Ovarian Cancer in the Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These results confirm that RAD51C and RAD51D are moderate ovarian cancer susceptibility genes and suggest that they confer levels of risk of EOC that may warrant their use alongside BRCA1 and BRCA2 in routine clinical genetic testing."
    explanation: The basis for including RAD51D in routine clinical genetic testing.
treatments:
- name: Risk-Reducing Salpingo-Oophorectomy
  description: >-
    Removal of the tubes and ovaries removes the tissue of origin and is the
    only intervention with direct evidence of benefit in carriers. Because the
    risk accrues late, it is offered close to the age of menopause rather than
    in the fourth decade, on age-specific risks and shared decision making. The
    counterpart recommendation is equally specific: risk-reducing mastectomy is
    generally not recommended, because the breast risk is moderate and
    subtype-restricted.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: risk-reducing salpingo-oophorectomy
    term:
      id: NCIT:C15323
      label: Salpingo-Oophorectomy
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RAD51C, RAD51D, and BRIP1 heterozygotes should be offered risk-reducing salpingo-oophorectomy close to the age of menopause based on age-specific risks and shared decision making."
    explanation: The guideline recommendation, including its timing.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Generally, risk-reducing mastectomy is not recommended."
    explanation: The paired recommendation against the breast operation, which is part of what this intervention is chosen over.
  target_mechanisms:
  - target: Somatic Loss of the Wild-Type RAD51D Allele
    description: >-
      Removes the tissue in which the second hit would occur, rather than
      acting on the molecular lesion.
- name: Platinum-Based Chemotherapy
  description: >-
    Platinum cross-links are unrepairable without homologous recombination, so
    a RAD51D-deficient tumour is platinum-sensitive. Germline or somatic
    mutation in this gene set predicts platinum response and survival in
    ovarian, fallopian tube and peritoneal carcinoma.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: platinum-based chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  evidence:
  - reference: PMID:24240112
    reference_title: "Germline and somatic mutations in homologous recombination genes predict platinum response and survival in ovarian, fallopian tube, and peritoneal carcinomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The presence of germline and somatic homologous recombination mutations was highly predictive of primary platinum sensitivity (P = 0.0002)"
    explanation: >-
      The cohort establishing platinum response as predicted by mutation in
      this gene set, RAD51D among them.
    directness: INDIRECT
  target_mechanisms:
  - target: Platinum and PARP-Inhibitor Sensitivity
    description: Exploits the tumour's inability to repair interstrand cross-links.
- name: PARP Inhibitor Therapy
  description: >-
    PARP inhibition is synthetically lethal in a homologous-recombination-
    deficient tumour cell while a heterozygous normal cell tolerates it. In
    recurrent ovarian cancer, RAD51D mutation predicts rucaparib response as
    BRCA1/BRCA2 mutation does.

    The guideline position and the trial evidence are both correct about
    different populations and should not be merged: the ACMG resource states
    there is insufficient evidence to guide targeted treatment for germline
    heterozygotes who develop cancer, which is a statement about prospective
    management, while the rucaparib data concern tumours already shown to be
    homologous-recombination-deficient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: PARP inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rucaparib
      term:
        id: NCIT:C137800
        label: Rucaparib
    - preferred_term: olaparib
      term:
        id: NCIT:C71721
        label: Olaparib
    - preferred_term: niraparib
      term:
        id: NCIT:C80059
        label: Niraparib
  evidence:
  - reference: PMID:33941784
    reference_title: "Molecular and clinical determinants of response and resistance to rucaparib for recurrent ovarian cancer treatment in ARIEL2 (Parts 1 and 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "RAD51C and RAD51D mutations and high-level BRCA1 promoter methylation predict response to rucaparib, similar to BRCA1/BRCA2 mutations"
    explanation: The trial analysis establishing RAD51D mutation as a predictor of PARP inhibitor response.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For RAD51C, RAD51D, and BRIP1 heterozygotes who develop cancer, there is insufficient evidence to guide any specific targeted treatment."
    explanation: >-
      The guideline declines to recommend targeted treatment for germline
      heterozygotes, which contradicts reading the trial result as a management
      recommendation for carriers. Recorded as a separate item rather than
      softened into the one above, because the two statements are about
      different populations.
  target_mechanisms:
  - target: Platinum and PARP-Inhibitor Sensitivity
    description: Converts the repair defect into synthetic lethality.
- name: Enhanced Breast Surveillance
  description: >-
    Breast imaging surveillance may be indicated for carriers, set against a
    personalised risk estimate and country-specific guidelines rather than
    offered uniformly. It is the counterpart of the recommendation against
    risk-reducing mastectomy: the breast risk is real but moderate and
    subtype-restricted, so it is managed by detection rather than by surgery.

    There is no equivalent for the ovary. Ovarian surveillance has no proven
    benefit, which is why the ovarian arm is managed by risk-reducing surgery
    and the breast arm by imaging.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: enhanced breast cancer screening
    term:
      id: NCIT:C15546
      label: Breast Cancer Screening
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For RAD51C and RAD51D heterozygotes, enhanced breast surveillance may be indicated according to their personalized risk estimate and country-specific guidelines."
    explanation: The guideline recommendation, including the conditionality this row preserves.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple studies have shown that OC surveillance has no proven benefit as it does not detect preclinical lesions or lead to a significant effect on survival rate."
    explanation: >-
      The contrast that explains why surveillance is offered for the breast and
      not for the ovary in the same carrier.
animal_models:
- name: Rad51d-null mouse
  species: Mouse
  genotype: Rad51d (Rad51l3) homozygous null
  publication: PMID:10705376
  genes:
  - preferred_term: Rad51d
    term:
      id: MGI:1261809
      label: Rad51d
  description: >-
    Biallelic Rad51d disruption is lethal in midgestation, with small,
    posteriorly truncated, developmentally delayed embryos. The model therefore
    reports the consequence of losing both copies, which in this disease is a
    somatic event confined to the transformed clone, and not the heterozygous
    carrier state the disease is defined by.
  modeled_mechanisms:
  - target: Germline RAD51D Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The homozygous null does not model the human predisposition. Human
      carriers are heterozygous and phenotypically normal; this genotype is
      embryonic lethal, so there is no tumour-prone animal to observe.
    limitations: >-
      Biallelic loss in the mouse is constitutional and embryonic, while in the
      human disease it is somatic, late and restricted to one epithelial clone
      that has already lost TP53. The model has no counterpart for the
      heterozygous carrier state or for the second hit.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The human disease requires a somatic second hit in a TP53-inactivated
        fallopian tube cell. A constitutional homozygous null contains neither
        the heterozygous starting state nor the somatic second hit, so the step
        this entry's chain turns on is outside the model entirely. Midgestation
        lethality compounds it: no tumour phenotype can be observed at all in
        an animal that does not survive to develop one.
    evidence:
    - reference: PMID:10705376
      reference_title: "Midgestation lethality in mice deficient for the RecA-related gene, Rad51d/Rad51l3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Rad51d-deficient mice die between 8.5 and 11.5 dpc."
      explanation: >-
        The lethality that prevents this genotype from modelling a late-onset
        tumour predisposition.
    readouts:
    - name: Embryonic survival and morphology
      target: Germline RAD51D Loss of Function
      direction: ABOLISHED
      interpretation: >-
        A negative result: the model reports constitutional biallelic loss,
        which the human disease never has.
      evidence:
      - reference: PMID:10705376
        reference_title: "Midgestation lethality in mice deficient for the RecA-related gene, Rad51d/Rad51l3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "The affected embryos are smaller than littermates, posteriorly truncated, and developmentally delayed."
        explanation: The embryonic phenotype measured in the null.
differential_diagnoses:
- name: RAD51C-related cancer predisposition
  description: >-
    The sibling BCDX2 subunit, with a near-identical tubo-ovarian relative risk
    and the same subtype-restricted breast risk, and managed by the same
    guideline. Two differences matter: biallelic RAD51C loss causes Fanconi
    anemia complementation group O while no human biallelic RAD51D null is
    known, and RAD51C has a saturation-genome-editing functional map that makes
    its missense variants interpretable where RAD51D's are not.
  evidence:
  - reference: PMID:32107557
    reference_title: "Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The estimated cumulative risks of developing TOC to age 80 years were 11% (95% CI = 6% to 21%) for RAD51C and 13% (95% CI = 7% to 23%) for RAD51D pathogenic variant carriers."
    explanation: The two genes' risks estimated side by side in the same analysis.
- name: BRCA1- and BRCA2-associated hereditary breast and ovarian cancer
  description: >-
    The high-penetrance differential. BRCA1 and BRCA2 carry roughly 44% and 17%
    cumulative tubo-ovarian risk against 13% here, present earlier, and carry an
    unrestricted rather than subtype-confined breast risk; their management
    includes risk-reducing mastectomy, which is generally not recommended for
    RAD51D.
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This is predominantly explained by GPVs in high-risk genes, such as BRCA1 (HGNC:1100) and BRCA2 (HGNC:1101). GPVs in other genes, such as RAD51C, RAD51D and BRIP1 have also been implicated in OC risk"
    explanation: The guideline's own framing of the moderate-penetrance genes against the high-risk ones.
references:
- reference: PMID:41070818
  title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
- reference: PMID:32107557
  title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.

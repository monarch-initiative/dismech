name: RAD51D-Related Cancer Predisposition
creation_date: "2026-11-19T03:30:00Z"
category: Mendelian
synonyms:
- RAD51D-related cancer predisposition
- RAD51L3-related cancer predisposition
- RAD51D-associated tubo-ovarian cancer susceptibility
description: >-
  An autosomal dominant, moderate-penetrance, adult-onset cancer predisposition
  caused by germline loss-of-function alleles of RAD51D, one of the four
  subunits of the BCDX2 RAD51-paralog complex (RAD51B-RAD51C-RAD51D-XRCC2). The
  dominant manifestation is high-grade serous tubo-ovarian carcinoma arising in
  the distal fallopian tube, with a smaller breast cancer risk that is confined
  to the oestrogen-receptor-negative and triple-negative subtype.

  Carriers have no constitutional phenotype. One functional RAD51D allele
  supports enough homologous recombination for normal development, so the
  disease is defined by risk and found by sequencing rather than by
  examination, and the entry's phenotypes are tumours rather than physical
  findings. Carcinoma arises only in a cell that has lost the second allele,
  and fallopian tube organoid work fixes the order of the hits: RAD51D deletion
  alone impairs homologous recombination and arrests the cell, while concurrent
  TP53 deletion rescues the proliferation and senescence defects and lets the
  double-mutant clone survive. TP53 loss therefore precedes and permits the
  consequences of RAD51D loss.

  Where the lesion bites is the BCDX2 complex rather than RAD51D in isolation.
  RAD51D interacts specifically with XRCC2 and RAD51C among the five paralogs,
  so its absence leaves the complex unable to support RAD51 filament nucleation
  on resected single-stranded DNA and unable to protect reversed replication
  forks from MRE11 and EXO1. The resulting homologous recombination deficiency
  is what makes the tumour platinum- and PARP-inhibitor-sensitive, and
  secondary mutations that restore the RAD51D reading frame are the documented
  route to acquired resistance.

  The risk profile is asymmetric and late-accruing, which is what the
  management recommendation turns on: risk-reducing salpingo-oophorectomy is
  offered close to the age of menopause rather than in the fourth decade, and
  risk-reducing mastectomy is generally not recommended.

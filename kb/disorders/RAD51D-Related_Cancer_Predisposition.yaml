      quote_role: REVIEW_SYNTHESIS
      snippet: "can cause genomic instability through loss of the wildtype allele, with potential malignant transformation"
      explanation: The guideline's statement of the second-hit step this edge asserts.
- name: Somatic Loss of the Wild-Type RAD51D Allele
  biological_scale: MOLECULAR
  description: >-
    Loss of the remaining functional copy in a fallopian tube secretory
    epithelial cell, or in a mammary luminal cell, leaves that cell with no
    functional RAD51D. This is the cell of origin node for the tubo-ovarian
    arm.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: fallopian tube secretory epithelial cell
    term:
      id: CL:4030006
      label: fallopian tube secretory epithelial cell
  evidence:
  - reference: PMID:35149617
    reference_title: "Serous Tubal Intraepithelial Carcinoma in a Risk-reducing Salpingo-oophorectomy Specimen From a RAD51D Mutation Carrier: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a case of serous tubal intraepithelial carcinoma in a patient undergoing risk-reducing total hysterectomy with bilateral salpingo-oophorectomy for a RAD51D pathogenic variant."
    explanation: >-
      The precursor lesion documented in a carrier's own risk-reducing surgery
      specimen, which places the transforming cell in the distal tube. It does
      not itself demonstrate loss of the second allele.
    directness: INDIRECT
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "can cause genomic instability through loss of the wildtype allele, with potential malignant transformation"
    explanation: States the loss of the wild-type allele that this node asserts.
  downstream:
  - target: Failure of BCDX2-Mediated RAD51 Loading and Fork Protection
    causal_link_type: DIRECT
- name: Failure of BCDX2-Mediated RAD51 Loading and Fork Protection
  biological_scale: MOLECULAR
  description: >-
    RAD51D interacts specifically with XRCC2 and RAD51C among the five RAD51
    paralogs, so its absence is not buffered by the others: the BCDX2 complex
    cannot assemble. BCDX2 supports RAD51 filament nucleation and extension on
    resected single-stranded DNA, and it synergises with RAD51 to protect
    reversed replication forks from MRE11 and EXO1. Both functions fail
    together.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  - preferred_term: replication fork processing
    modifier: DECREASED
    term:
      id: GO:0031297
      label: replication fork processing
  evidence:
  - reference: PMID:10749867
    reference_title: "Evidence for simultaneous protein interactions between human Rad51 paralogs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Here we report that in the yeast two-hybrid system, Rad51D interacts with XRCC2 and Rad51C. No other interactions, including self-interactions, were found, indicating that the observed interactions are specific."
    explanation: >-
      The specificity of RAD51D's partners, which is why no other paralog
      substitutes for it in the complex.
  - reference: PMID:37843130
    reference_title: "RAD51 paralogs synergize with RAD51 to protect reversed forks from cellular nucleases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "BCDX2 significantly synergizes with RAD51 to protect DNA against attack by the nucleases MRE11 and EXO1"
    explanation: The fork-protection function of the complex RAD51D belongs to.
  downstream:
  - target: Homologous Recombination Deficiency and Genomic Instability
    causal_link_type: DIRECT
- name: Homologous Recombination Deficiency and Genomic Instability
  biological_scale: CELLULAR
  description: >-
    Unrepaired and mis-repaired double-strand breaks and unprotected forks
    accumulate, and the cell acquires chromosomal rearrangements and, at genome
    scale, loss of heterozygosity. RAD51D deficiency produces a high frequency
    of large deletions on top of the chromosomal abnormalities.
  biological_processes:
  - preferred_term: DNA recombination
    modifier: DECREASED
    term:
      id: GO:0006310
      label: DNA recombination
  - preferred_term: interstrand cross-link repair
    modifier: DECREASED
    term:
      id: GO:0036297
      label: interstrand cross-link repair
  evidence:
  - reference: PMID:27924006
    reference_title: "The homologous recombination protein RAD51D protects the genome from large deletions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "our data revealed that, in addition to leading to chromosomal abnormalities, RAD51D-deficiency resulted in a high frequency of deletions advancing our understanding of how a RAD51 paralog is involved in maintaining genomic stability and how its deficiency may predispose cells to tumorigenesis"
    explanation: The genomic consequence of RAD51D loss, measured directly.
  downstream:
  - target: TP53-Dependent Arrest Eliminating the RAD51D-Null Clone
    causal_link_type: DIRECT
  - target: Checkpoint Escape in a TP53-Inactivated Cell
    causal_link_type: DIRECT
  - target: Platinum and PARP-Inhibitor Sensitivity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38255960
      reference_title: "Human Fallopian Tube-Derived Organoids with TP53 and RAD51D Mutations Recapitulate an Early Stage High-Grade Serous Ovarian Cancer Phenotype In Vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "exhibited heightened sensitivity to platinum, poly-ADP ribose polymerase inhibitors (PARPi), and cell cycle-related medication"
      explanation: >-
        The repair-deficient organoid's drug sensitivity, which is the step this
        edge asserts.
- name: TP53-Dependent Arrest Eliminating the RAD51D-Null Clone
  biological_scale: CELLULAR
  description: >-
    Where TP53 is intact the accumulated damage triggers arrest and the
    RAD51D-null clone is removed. This branch is why RAD51D loss alone is not
    oncogenic, and it is the reason the order of hits matters: in fallopian
    tube organoids, RAD51D deletion alone impaired homologous recombination and
    arrested the cell, while concurrent TP53 deletion rescued the
    proliferation, stemness, senescence and apoptosis defects.
  evidence:
  - reference: PMID:38255960
    reference_title: "Human Fallopian Tube-Derived Organoids with TP53 and RAD51D Mutations Recapitulate an Early Stage High-Grade Serous Ovarian Cancer Phenotype In Vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "RAD51D deletion impaired the homologous recombination (HR) function and induced G2/M phase arrest"
    explanation: >-
      The organoid system in which the dependence of RAD51D-driven
      transformation on prior TP53 loss was demonstrated.
    directness: INDIRECT
- name: Checkpoint Escape in a TP53-Inactivated Cell
  biological_scale: CELLULAR
  description: >-
    Where TP53 has already been inactivated the arrest is bypassed and the
    double-mutant clone survives and expands. TP53 loss therefore precedes and
    permits the consequences of RAD51D loss, which fixes the order of the two
    hits.
  evidence:
  - reference: PMID:38255960
    reference_title: "Human Fallopian Tube-Derived Organoids with TP53 and RAD51D Mutations Recapitulate an Early Stage High-Grade Serous Ovarian Cancer Phenotype In Vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We observed that TP53 deletion rescued the adverse effects of RAD51D deletion on the proliferation, stemness, senescence, and apoptosis of FTE organoids."
    explanation: >-
      The double-mutant organoid that models this step; TP53 and RAD51D
      together, not RAD51D alone, reproduce early carcinogenesis.
    directness: INDIRECT
  downstream:
  - target: Serous Tubal Intraepithelial Carcinoma
    causal_link_type: DIRECT
  - target: Breast carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33471974
      reference_title: "A Population-Based Study of Genes Previously Implicated in Breast Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Pathogenic variants in BARD1, RAD51C, and RAD51D were associated with increased risks of estrogen receptor-negative breast cancer and triple-negative breast cancer, whereas pathogenic variants in ATM, CDH1, and CHEK2 were associated with an increased risk of estrogen receptor-positive breast cancer."
      explanation: >-
        The subtype restriction is established epidemiologically. That the
        mammary arm runs through the same two-hit route in a luminal cell is an
        inference from the ovarian arm and from the BRCA1 cell-of-origin model,
        not a measured step.
- name: Serous Tubal Intraepithelial Carcinoma
  biological_scale: TISSUE
  description: >-
    The surviving double-mutant clone forms the recognised precursor lesion in
    the distal tube, documented in a RAD51D carrier's risk-reducing surgery
    specimen with complete loss of p53 staining. Exfoliation of transformed
    cells onto the ovarian surface and peritoneum then produces the invasive
    carcinoma; that step is inferred from the shared histology and molecular
    identity of the lesion and the carcinoma rather than observed in a carrier.
  evidence:
  - reference: PMID:35149617
    reference_title: "Serous Tubal Intraepithelial Carcinoma in a Risk-reducing Salpingo-oophorectomy Specimen From a RAD51D Mutation Carrier: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a case of serous tubal intraepithelial carcinoma in a patient undergoing risk-reducing total hysterectomy with bilateral salpingo-oophorectomy for a RAD51D pathogenic variant."
    explanation: The precursor lesion as it was found in a carrier.
  downstream:

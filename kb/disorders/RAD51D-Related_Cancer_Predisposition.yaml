    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Fallopian tube carcinoma
    causal_link_type: DIRECT
  - target: Primary peritoneal carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Platinum and PARP-Inhibitor Sensitivity
  biological_scale: CELLULAR
  description: >-
    The tumour's homologous recombination deficiency is also its therapeutic
    vulnerability. Platinum cross-links cannot be repaired without homologous
    recombination, and PARP inhibition is synthetically lethal in a cell that
    cannot repair the resulting replication-associated breaks, while a
    heterozygous normal cell can. In recurrent ovarian cancer, RAD51D mutation
    predicts rucaparib response as BRCA1/BRCA2 mutation does.
  evidence:
  - reference: PMID:33941784
    reference_title: "Molecular and clinical determinants of response and resistance to rucaparib for recurrent ovarian cancer treatment in ARIEL2 (Parts 1 and 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "RAD51C and RAD51D mutations and high-level BRCA1 promoter methylation predict response to rucaparib, similar to BRCA1/BRCA2 mutations"
    explanation: The clinical demonstration that this vulnerability is actionable in RAD51D-mutated disease.
  - reference: PMID:42306566
    reference_title: "Impact of germline RAD51D mutations on breast cancer: Susceptibility to DNA-damaging agents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "significantly more sensitive to cisplatin than wild-type"
    explanation: The platinum half of the same vulnerability, measured in RAD51D-deficient cells.
  downstream:
  - target: Reversion Mutation Restoring the RAD51D Reading Frame
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28588062
      reference_title: "Secondary Somatic Mutations Restoring RAD51C and RAD51D Associated with Acquired Resistance to the PARP Inhibitor Rucaparib in High-Grade Ovarian Carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Analyses of primary and secondary mutations in RAD51C and RAD51D provide evidence for these primary mutations in conferring PARPi sensitivity and secondary mutations as a mechanism of acquired PARPi resistance."
      explanation: >-
        Names RAD51D and attributes acquired resistance to the secondary
        mutation, which is the step this edge asserts.
- name: Reversion Mutation Restoring the RAD51D Reading Frame
  biological_scale: MOLECULAR
  description: >-
    Under platinum or PARP-inhibitor pressure, secondary somatic mutations that
    restore the RAD51D open reading frame are selected, homologous
    recombination is restored, and resistance follows. There is no way to
    reverse this; detecting it informs the decision to abandon PARP inhibition
    rather than escalate it.
  genetic_context:
    variant_origin: SOMATIC
  evidence:
  - reference: PMID:28588062
    reference_title: "Secondary Somatic Mutations Restoring RAD51C and RAD51D Associated with Acquired Resistance to the PARP Inhibitor Rucaparib in High-Grade Ovarian Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Analyses of primary and secondary mutations in RAD51C and RAD51D provide evidence for these primary mutations in conferring PARPi sensitivity and secondary mutations as a mechanism of acquired PARPi resistance."
    explanation: >-
      Names RAD51D and states both halves of this node's claim: the primary
      mutation confers PARP-inhibitor sensitivity and the secondary mutation
      confers acquired resistance.
phenotypes:
- category: Neoplastic
  name: Ovarian carcinoma
  description: >-
    High-grade serous tubo-ovarian carcinoma is the dominant manifestation, at
    a relative risk of 7.60 and a cumulative risk to age 80 of 13%. An
    independent meta-analysis of about 29,400 ovarian cancer cases against
    gnomAD controls gives an odds ratio of 6.94, so two independent estimates
    agree that this is a high-risk ovarian gene. Risk accrues late, with the
    modal diagnosis after age 50.
  phenotype_term:
    preferred_term: High-grade serous tubo-ovarian carcinoma
    term:
      id: HP:0025318
      label: Ovarian carcinoma
  evidence:
  - reference: PMID:32107557
    reference_title: "Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The estimated cumulative risks of developing TOC to age 80 years were 11% (95% CI = 6% to 21%) for RAD51C and 13% (95% CI = 7% to 23%) for RAD51D pathogenic variant carriers."
    explanation: The cumulative tubo-ovarian risk from family-based segregation analysis.
  - reference: PMID:32359370
    reference_title: "BRIP1, RAD51C, and RAD51D mutations are associated with high susceptibility to ovarian cancer: mutation prevalence and precise risk estimates based on a pooled analysis of ~30,000 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "confirming that all three genes are ovarian cancer high-risk genes (odds ratio (OR) = 4.94, 95%CIs:4.07-6.00, p < 0.0001; OR = 5.59, 95%CIs:4.42-7.07, p < 0.0001; and OR = 6.94, 95%CIs:5.10-9.44, p < 0.0001, respectively)"
    explanation: >-
      The independent pooled estimate; the third odds ratio in the series is
      RAD51D's, the genes being listed as BRIP1, RAD51C and RAD51D.
- category: Neoplastic
  name: Fallopian tube carcinoma
  description: >-
    The fallopian tube is the usual primary site, and tubal carcinoma is
    counted within the tubo-ovarian risk rather than estimated separately. It
    is the reason the risk-reducing operation is a salpingo-oophorectomy.
  phenotype_term:
    preferred_term: Fallopian tube carcinoma
    term:
      id: HP:0030394
      label: Fallopian tube carcinoma
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Monoallelic GPV in RAD51C, RAD51D and BRIP1 are associated with increased lifetime risks of cancer, predominantly epithelial ovarian, fallopian tube and primary peritoneal cancer"
    explanation: >-
      The guideline names fallopian tube cancer among the sites RAD51D
      pathogenic variants raise the risk of.
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Breast cancer risk is moderate, at a relative risk of 1.83 and a cumulative
    risk to age 80 of 20%, and it is confined to the oestrogen-receptor-negative
    and triple-negative subtypes. An unstratified analysis dilutes it, which is
    why one large exome series found no breast association for this gene at
    all. The subtype restriction is also why risk-reducing mastectomy is
    generally not recommended while enhanced breast surveillance may be.
  phenotype_term:
    preferred_term: ER-negative or triple-negative breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:33471974
    reference_title: "A Population-Based Study of Genes Previously Implicated in Breast Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Pathogenic variants in BARD1, RAD51C, and RAD51D were associated with increased risks of estrogen receptor-negative breast cancer and triple-negative breast cancer, whereas pathogenic variants in ATM, CDH1, and CHEK2 were associated with an increased risk of estrogen receptor-positive breast cancer."
    explanation: The population-based study that establishes the subtype restriction.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RAD51C and RAD51D GPVs are also associated with moderate risk of breast cancer, predominantly triple-negative subtype."
    explanation: The guideline statement of the breast risk and its subtype restriction.
- category: Neoplastic
  name: Primary peritoneal carcinoma
  description: >-
    Serous carcinoma of the peritoneum, including the residual risk that

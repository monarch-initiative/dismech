parents:
- Hereditary Neoplastic Syndrome
- Homologous Recombination Repair Deficiency Syndrome
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      A hereditary predisposition to tubo-ovarian and breast carcinoma managed
      through risk assessment, surveillance and risk-reducing surgery.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian single-gene predisposition acting through somatic loss of the
      wild-type allele.
notes: >-
  Entry shape follows design decisions §3a: this is a germline predisposition
  syndrome, so it takes the plain Mendelian lump/split rules rather than the
  somatic cancer granularity ladder, and it is kept separate from the somatic
  carcinomas it predisposes to. It is the sibling of
  RAD51C-Related_Cancer_Predisposition, BARD1-related_Cancer_Predisposition,
  PALB2-Related_Cancer_Predisposition and CHEK2-related_Cancer_Predisposition.
  ClinGen's own curation records the same decision for this concept: it found
  no difference in mechanism or inheritance between the ovarian,
  triple-negative breast and ER-negative breast predispositions and lumped
  them into one entity.

  No GeneReviews chapter covers this disease or RAD51D.

  No LOINC code is bound on the diagnosis row: no RAD51D-specific
  molecular-analysis code is in cache/loinc/terms.csv and none could be
  resolved with just loinc-seed-cache.

  No prevalence record is given. The cumulative risks to age 80 are penetrance
  within carriers rather than disease occurrence, and are recorded on the
  phenotypes they describe; no source cached for this entry reports a
  RAD51D-specific population carrier frequency. The nearest available figure,
  0.11% of controls in PMID:26261251, is for deleterious RAD51B, RAD51C and
  RAD51D mutations combined.

  Unlike RAD51C, RAD51D has no saturation-genome-editing functional map, so
  missense interpretation in this gene remains the practical bottleneck and
  most missense alleles return as variants of uncertain significance.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Dominant at the level of predisposition and recessive at the level of the
    cell, since a tumour requires biallelic inactivation. Each child of a
    carrier has a 50% chance of inheriting the allele. The phenotype is
    effectively female-limited while transmission is equal between sexes, so a
    male carrier's clinical relevance is as a transmitter and as an indication
    for cascade testing.
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RAD51C, RAD51D, and BRIP1 are moderate (intermediate) penetrance ovarian cancer predisposition genes."
    explanation: The guideline designation of penetrance class for this gene.
genetic:
- name: RAD51D
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RAD51D
    term:
      id: hgnc:9823
      label: RAD51D
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic alleles are overwhelmingly truncating: frameshift, nonsense,
    canonical splice-site and copy-number events. Exactly one missense
    substitution carries a pathogenic ClinGen-era ClinVar record, the French
    Canadian founder allele p.Ser207Leu, against a large backlog of variants of
    uncertain significance. There is no saturation-genome-editing functional
    map for RAD51D of the kind that exists for RAD51C, so missense
    interpretation in this gene remains the practical bottleneck.
  case_fractions:
  - population: Invasive epithelial ovarian cancer cases, UK population-based case-control study
    case_fraction_percent: 0.35
    notes: >-
      Share of epithelial ovarian cancer cases carrying a deleterious RAD51D
      mutation, against 0.41% for RAD51C and 0.06% for RAD51B in the same
      series. This is a share of cases, not a population carrier frequency.
    evidence:
    - reference: PMID:26261251
      reference_title: "Contribution of Germline Mutations in the RAD51B, RAD51C, and RAD51D Genes to Ovarian Cancer in the Population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Mutations in EOC cases were more frequent in RAD51C (14 occurrences, 0.41%) and RAD51D (12 occurrences, 0.35%) than in RAD51B (two occurrences, 0.06%)."
      explanation: The per-gene share of ovarian cancer cases this record reports.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_2d2e5a83-03cb-4483-915d-6ac32a84dc0a-2024-08-29T170000.000Z
    evidence:
    - reference: CGGV:assertion_2d2e5a83-03cb-4483-915d-6ac32a84dc0a-2024-08-29T170000.000Z
      reference_title: "RAD51D / RAD51D-related cancer predisposition (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RAD51D | HGNC:9823 | RAD51D-related cancer predisposition | MONDO:0700274 | AD | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classification for this MONDO entity.
  evidence:
  - reference: CGGV:assertion_2d2e5a83-03cb-4483-915d-6ac32a84dc0a-2024-08-29T170000.000Z
    reference_title: "RAD51D / RAD51D-related cancer predisposition (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found no difference in molecular mechanism(s) or inheritance pattern among the different cancer predispositions."
    explanation: >-
      ClinGen's own lumping decision, which is why ovarian, triple-negative
      breast and ER-negative breast predisposition are one entity here rather
      than three.
  - reference: PMID:26261251
    reference_title: "Contribution of Germline Mutations in the RAD51B, RAD51C, and RAD51D Genes to Ovarian Cancer in the Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These results confirm that RAD51C and RAD51D are moderate ovarian cancer susceptibility genes and suggest that they confer levels of risk of EOC that may warrant their use alongside BRCA1 and BRCA2 in routine clinical genetic testing."
    explanation: The population-based study establishing RAD51D as a clinically actionable ovarian cancer susceptibility gene.
  - reference: PMID:30733081
    reference_title: "Large-scale meta-analysis of mutations identified in panels of breast/ovarian cancer-related genes - Providing evidence of cancer predisposition genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "a substantial difference in the profile of genes contributing to either BC or OC risk, including genes specifically associated with a high risk of OC but not BC (e.g., RAD51C, and RAD51D)"
    explanation: >-
      The meta-analysis across 48 panel studies that places RAD51D among the
      ovarian-specific rather than the breast-dominant predisposition genes.
  variants:
  - name: "RAD51D p.Ser207Leu"
    clinical_significance: PATHOGENIC
    description: >-
      A French Canadian founder missense allele and the only RAD51D missense
      substitution with a pathogenic record. It is functionally null in cellular
      assay and confers PARP inhibitor sensitivity.

      How it acts is unsettled. The primary report attributes the defect to
      disruption of the RAD51D-XRCC2 interaction. The deep-research report for
      this entry measured the residue in the later BCDX2 cryo-EM structure PDB
      8OUZ and found Ser207 buried inside RAD51D with every close neighbour
      intra-chain and the nearest XRCC2 atom 17.6 A away, which would make a
      broken direct contact an unlikely explanation and local destabilisation
      of the packed pocket beside the nucleotide site the more likely one. That
      re-measurement is the report's own structural analysis rather than a
      published finding, and it is recorded here as an open question. The
      functional defect is not in doubt.
    evidence:
    - reference: PMID:28646019
      reference_title: "Functionally Null RAD51D Missense Mutation Associates Strongly with Ovarian Carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "this mutation impairs HR by disrupting the RAD51D-XRCC2 interaction and confers PARP inhibitor sensitivity"
      explanation: >-
        The functional characterisation of the allele. The quoted mechanism is
        the authors' interpretation; see this variant's notes.
pathophysiology:
- name: Germline RAD51D Loss of Function
  biological_scale: MOLECULAR
  description: >-
    One germline truncating RAD51D allele, present in every cell. The
    heterozygous state is tolerated: homologous recombination remains
    sufficient, which is why carriers have no constitutional phenotype and why
    the entry's phenotypes are all neoplasms.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: RAD51D
    term:
      id: hgnc:9823
      label: RAD51D
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Germline pathogenic and likely pathogenic variants (collectively referred to in this document as “germline pathogenic variants” (GPVs)) in RAD51C, RAD51D and BRIP1 can cause genomic instability through loss of the wildtype allele, with potential malignant transformation."
    explanation: States the germline-allele-plus-somatic-loss architecture this chain is built on.
  downstream:
  - target: Somatic Loss of the Wild-Type RAD51D Allele
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41070818

- accession: geo:GSE292189
  title: Single cell and clonal analysis of AL amyloidosis plasma cells and their bone marrow microenvironment
  description: AL amyloidosis is a disorder characterized by expansion of clonal plasma cells in the bone marrow and distant end organ damage mediated by misfolded immunoglobulin free light chains. There are currently limited data regarding the functional characteristics of AL amyloidosis plasma cells and their surrounding bone marrow microenvironment. We performed 5’ single cell RNA sequencing on 9 newly diagnosed, treatment naive AL amyloidosis patients and 8 healthy subjects. We identified generalized suppression of normal bone marrow hematopoiesis with distinct expansion of CD16 monocytes and subsets of CD4+ T cells in AL amyloidosis patients.
  organism:

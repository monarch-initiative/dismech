- name: Progressive Systemic Tissue Amyloid Accumulation
  description: >-
    Continued fibril deposition expands the extracellular amyloid burden across
    affected organs. Accumulation can be slowed by eliminating light-chain
    production, and organ improvement may occur after a deep clonal response;
    established injury is therefore not described as uniformly irreversible.
  role: effector
  conforms_to: amyloidogenesis#Progressive Tissue Amyloid Accumulation
  evidence:
  - reference: PMID:33099432
    reference_title: "Supportive Care for Patients with Systemic Light Chain Amyloidosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Treatment directed at the clonal cells eliminates light chain production
      and further deposition and may enable organ improvement and decrease the
      risk of organ failure.
    explanation: >-
      The review supports ongoing deposition as a modifiable process and avoids
      an absolute irreversibility claim.
  downstream:

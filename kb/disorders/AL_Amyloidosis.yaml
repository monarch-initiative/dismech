- name: Daratumumab-Bortezomib-Cyclophosphamide-Dexamethasone
  description: >-
    Subcutaneous daratumumab/hyaluronidase-fihj with bortezomib,
    cyclophosphamide, and dexamethasone (D-VCd) is the approved, evidence-based
    frontline regimen for most newly diagnosed patients. It is not recommended
    for Mayo cardiac stage IIIB or NYHA class IIIB/IV disease outside controlled
    clinical trials; eligibility and dosing also require attention to frailty and
    organ dysfunction.

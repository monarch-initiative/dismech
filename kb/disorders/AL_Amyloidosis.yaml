- name: Systemic Multiorgan Dysfunction
  description: >-
    The combined burden of cardiac, renal, neurologic, gastrointestinal, and
    other organ involvement produces nonspecific systemic manifestations. The
    exact intermediate mechanisms for fatigue and weight loss vary between
    patients and are not collapsed into a falsely direct molecular edge.

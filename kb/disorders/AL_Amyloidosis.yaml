name: Systemic AL Amyloidosis
creation_date: "2026-06-18T00:00:00Z"
category: Complex
disease_term:
  preferred_term: systemic AL amyloidosis
  term:
    id: MONDO:0017816
    label: primary systemic amyloidosis
parents:
- Amyloidosis
- Plasma Cell Neoplasm
description: >-
  Systemic AL (immunoglobulin light-chain) amyloidosis is a clonal plasma-cell
  disorder in which a usually plasma-cell clone produces and secretes an
  amyloidogenic immunoglobulin light chain that misfolds, forms cross-beta
  fibrils, and accumulates
  extracellularly in multiple organs. Organ injury reflects both deposited
  fibrils and, especially in the heart, direct proteotoxic effects of soluble
  light chains. The heart and kidneys are most commonly involved, while nerves,
  the gastrointestinal tract, blood vessels, and soft tissues may also be
  affected. Diagnosis requires demonstration of amyloid in tissue and correct
  biochemical typing; detecting a monoclonal protein or plasma-cell clone alone
  does not establish that the deposited amyloid is AL.
synonyms:
- immunoglobulin light-chain amyloidosis
- primary systemic amyloidosis
- systemic light-chain amyloidosis
prevalence:
- population: Olmsted County, Minnesota, 1990-2015
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.2
  rate_low: 0.8
  rate_high: 1.6
  notes: >-
    Age- and sex-adjusted incidence per 100,000 person-years in a geographically
    defined US population; this is an incidence estimate, not point prevalence.
  evidence:
  - reference: PMID:30713046
    reference_title: "Incidence of AL Amyloidosis in Olmsted County, Minnesota, 1990 through 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence rate of AL amyloidosis from 1990 through 2015 adjusted for
      age and sex was 1.2 per 100,000 person-years (95% CI, 0.8-1.6 per 100,000
      person-years).
    explanation: >-
      This population-based cohort provides the rate and confidence interval
      represented in the structured incidence fields.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_al_amyloid_deposition
  hypothesis_label: Canonical AL Amyloid Deposition Model
  status: CANONICAL
  description: >-
    A plasma-cell clone produces an amyloidogenic monoclonal light chain that
    misfolds, forms beta-sheet-rich oligomers and fibrils, deposits in the
    extracellular matrix of multiple organs, and causes organ-specific
    dysfunction.
  evidence:
  - reference: PMID:30361521
    reference_title: "Systemic immunoglobulin light chain amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Systemic immunoglobulin light chain amyloidosis is a protein misfolding
      disease caused by the conversion of immunoglobulin light chains from their
      soluble functional states into highly organized amyloid fibrillar
      aggregates that lead to organ dysfunction.
    explanation: >-
      This review states the precursor-to-fibril-to-organ-dysfunction model that
      defines the canonical hypothesis group.
- hypothesis_group_id: soluble_light_chain_cardiotoxicity
  hypothesis_label: Soluble Light-Chain Cardiotoxicity Model
  status: CANONICAL
  description: >-
    Soluble or prefibrillar amyloidogenic light chains exert direct cardiac
    proteotoxicity superimposed on structural injury from deposited fibrils,
    activating oxidative stress and non-canonical p38alpha MAPK signaling in
    cardiomyocytes and promoting contractile dysfunction and apoptosis.
  evidence:
  - reference: PMID:20150510
    reference_title: "Amyloidogenic light chains induce cardiomyocyte contractile dysfunction and apoptosis via a non-canonical p38alpha MAPK pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we report that amyloidogenic light chain (AL-LC) proteins
      provoke oxidative stress, cellular dysfunction, and apoptosis in isolated
      adult cardiomyocytes through activation of p38 mitogen-activated protein
      kinase (MAPK).
    explanation: >-
      Isolated adult cardiomyocytes provide direct experimental support for a
      soluble-light-chain injury branch independent of extracellular fibril
      burden.
pathophysiology:
- name: Amyloidogenic Plasma-Cell Clone
  description: >-
    A usually small clonal plasma-cell population produces the pathogenic light
    chain. The term clone is used deliberately: a large marrow expansion is not
    required, and clone detection alone does not prove that tissue amyloid is
    light-chain-derived.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  evidence:
  - reference: PMID:33099432
    reference_title: "Supportive Care for Patients with Systemic Light Chain Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Light chain amyloidosis is a disease in which clonal plasma cells produce
      toxic immunoglobulin light chains that form amyloid fibrils with deposition
      in organs, most commonly the heart and kidneys, but also the nervous system,
      gastrointestinal tract, and soft tissues.
    explanation: >-
      The review identifies clonal plasma cells as the source of the toxic light
      chains while also describing their downstream deposition.

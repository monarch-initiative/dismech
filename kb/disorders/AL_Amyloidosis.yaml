progression:
- phase: Prognostic risk and treatment response
  notes: >-
    Cardiac involvement is the dominant prognostic determinant. Prognosis is not
    uniformly fixed by baseline organ damage: rapid reduction of the
    amyloidogenic free light chain is associated with survival benefit, and
    organ responses can follow effective clone suppression.
  evidence:
  - reference: PMID:23091105
    reference_title: "New criteria for response to treatment in immunoglobulin light chain amyloidosis based on free light chain measurement and cardiac biomarkers: impact on survival outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a strong correlation between the extent of reduction of
      amyloidogenic free light chains (FLCs) and improvement in survival.
    explanation: >-
      The multicenter cohort directly relates depth of precursor reduction to
      survival.
  - reference: PMID:23091105
    reference_title: "New criteria for response to treatment in immunoglobulin light chain amyloidosis based on free light chain measurement and cardiac biomarkers: impact on survival outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac involvement is the major determinant of survival, and changes in
      cardiac function after therapy can be reliably assessed using the cardiac
      biomarker N-terminal natriuretic peptide type B (NT-proBNP).
    explanation: >-
      This supports both the prognostic importance of cardiac disease and the
      possibility of measurable post-treatment cardiac change.
histopathology:
- name: Congo Red-Positive Amyloid Deposition
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  description: >-
    Extracellular tissue deposits bind Congo red and show apple-green
    birefringence under polarized light. This confirms amyloid deposition but
    does not identify the precursor protein; biochemical typing is still
    required to establish AL.
  diagnostic: true
  evidence:
  - reference: PMID:30713046
    reference_title: "Incidence of AL Amyloidosis in Olmsted County, Minnesota, 1990 through 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All diagnostic specimens contained amyloid deposits that exhibited
      apple-green birefringence when stained with alkaline Congo red and viewed
      under polarized light.
    explanation: >-
      The clinical series directly documents the diagnostic histologic finding.
diagnosis:
- name: Monoclonal-Protein Screening
  diagnosis_term:
    preferred_term: free immunoglobulin light chain measurement
    term:
      id: NCIT:C156517
      label: Free Immunoglobulin Light Chain Measurement
  description: >-
    Initial clonal screening combines serum immunofixation, urine
    immunofixation, and serum free-light-chain measurement. A positive screen
    increases suspicion but cannot substitute for tissue confirmation and
    amyloid typing.
  results: >-
    A monoclonal protein or abnormal free-light-chain result supports suspicion
    for AL and prompts tissue confirmation and clone evaluation.
  evidence:
  - reference: PMID:41592868
    reference_title: "American Society of Hematology (ASH) 2026 Guidelines on Diagnosis of Light Chain Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The use of serum immunofixation, urine immunofixation and serum free light
      chains enhances the clinical suspicion of AL amyloidosis.
    explanation: >-
      The guideline explicitly recommends the three-part monoclonal-protein
      screen as a suspicion-enhancing step.
- name: Surrogate-Tissue Biopsy
  description: >-
    Abdominal fat-pad and bone-marrow sampling provide minimally invasive tissue
    for Congo red staining. Combined testing detects many, but not all, AL cases;
    a negative surrogate biopsy does not exclude disease, and involved-organ
    biopsy may be needed when suspicion remains high.
  results: >-
    Congo red-positive amyloid in fat pad or bone marrow supports systemic
    amyloidosis; a negative combined result leaves residual diagnostic risk.
  evidence:
  - reference: PMID:41460224
    reference_title: "Detection yield of surrogate tissue biopsies across amyloidosis classes: a large-scale analysis of 4,027 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 2,213 patients with AL amyloidosis who underwent both FP and BM
      sampling, combined testing increased detection to 85% (40% positive in
      both; 32% FP-only; 13% BM-only).
    explanation: >-
      The large cohort quantifies the benefit and residual false-negative risk
      of combined surrogate sampling.
- name: Congo Red Tissue Confirmation
  diagnosis_term:
    preferred_term: Congo red staining method
    term:
      id: NCIT:C154782
      label: Congo Red Staining Method
  description: >-
    Tissue is stained with Congo red and examined under polarized light to
    demonstrate amyloid. A positive stain confirms amyloid deposition but not AL
    type.
  results: >-
    Congo red-positive deposits with apple-green birefringence establish tissue
    amyloid and must be followed by precursor typing.
  evidence:
  - reference: PMID:30713046
    reference_title: "Incidence of AL Amyloidosis in Olmsted County, Minnesota, 1990 through 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All diagnostic specimens contained amyloid deposits that exhibited
      apple-green birefringence when stained with alkaline Congo red and viewed
      under polarized light.
    explanation: >-
      The series directly documents the Congo-red/polarized-light diagnostic
      pattern.
- name: Mass-Spectrometry Amyloid Typing
  description: >-
    Laser microdissection followed by liquid chromatography and mass
    spectrometry identifies the protein composing a Congo red-positive deposit
    and distinguishes AL from ATTR and other amyloid types.
  results: >-
    Detection of an immunoglobulin light-chain amyloid proteomic signature
    establishes the AL precursor type in the sampled deposit.
  evidence:
  - reference: PMID:30834260
    reference_title: "Mass Spectrometry Amyloid Typing Is Reproducible across Multiple Organ Sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LMD-LC-MS correctly typed AL amyloidosis in all 22 FFPE tissue samples
      despite tissue origin.
    explanation: >-
      This ex vivo multi-organ study directly supports mass-spectrometric AL
      typing across fixed tissue sites.
- name: Plasma-Cell Clone and Organ Assessment
  description: >-
    Bone-marrow morphology, flow cytometry, and plasma-cell FISH characterize the
    underlying somatic clone, including clinically relevant t(11;14), while
    cardiac, renal, neurologic, and gastrointestinal assessments establish organ
    burden. Cardiac troponin, NT-proBNP, and dFLC support prognostic staging.
  results: >-
    Clone characterization guides treatment selection; organ measurements and
    Mayo staging define risk but do not replace tissue amyloid typing.
  evidence:
  - reference: PMID:22331953
    reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a multivariate model that included these characteristics as well as cTnT
      and NT-ProBNP, only FLC-diff, cTnT, and NT-ProBNP were independently
      prognostic for overall survival (OS).
    explanation: >-
      The staging cohort supports the three principal prognostic measurements;
      marrow/FISH and broader organ-assessment details are standard diagnostic
      context not directly evaluated by this source.
  - reference: PMID:33431806
    reference_title: "Venetoclax induces deep hematologic remissions in t(11;14) relapsed/refractory AL amyloidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-one patients harbored t(11;14), 11 did not, and one t(11;14) status
      was unknown. Patients received a venetoclax-containing regimen for at least
      one 21- or 28-day cycle; the median prior treatments was three.
    explanation: >-
      The retrospective cohort shows why defining t(11;14) status can affect
      treatment selection, without by itself validating the full diagnostic
      work-up.
differential_diagnoses:
- name: Transthyretin Amyloidosis
  description: >-
    ATTR amyloidosis is the principal alternative precursor diagnosis when
    cardiac amyloid is suspected. AL uses an immunoglobulin light chain, whereas
    ATTR uses wild-type or variant transthyretin. Clinical and imaging features
    overlap, so a monoclonal-protein result alone cannot type the tissue deposit;
    precise biochemical typing is required when AL remains possible.
  distinguishing_features:
  - AL amyloid is composed of an immunoglobulin light chain; ATTR amyloid is composed of transthyretin.
  - A monoclonal-protein screen raises suspicion for AL but does not itself identify the protein in a tissue deposit.
  - Congo red establishes amyloid but not its type; mass spectrometry or another validated typing method identifies the precursor.
  - Cardiac involvement can occur in either disease, so demographic heuristics are not diagnostic substitutes.
  evidence:
  - reference: PMID:29700090
    reference_title: "Cardiac amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The need for a high index of suspicion and the critical importance of
      precise biochemical typing of the amyloid deposits is paramount in light of
      recent therapeutic advances that can significantly improve prognosis.
    explanation: >-
      The review directly supports biochemical typing rather than reliance on a
      nonspecific cardiac phenotype.
  - reference: PMID:29700090
    reference_title: "Cardiac amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases of cardiac amyloidosis are of either transthyretin type, which
      may be acquired in older individuals or inherited in younger patients, or
      acquired monoclonal immunoglobulin light chain (AL) type.
    explanation: >-
      This identifies the two dominant precursor classes without using age as a
      stand-alone diagnostic rule.
stages:
- name: Mayo 2012 Prognostic Staging System
  description: >-
    Prognostic stage is assigned from three adverse factors: dFLC at least 18
    mg/dL, cardiac troponin T at least 0.025 ng/mL, and NT-proBNP at least 1,800
    pg/mL. Zero through three adverse factors correspond to stages I through IV.
    The IIIa/IIIb labels used by some cardiac trials refer to a separate
    European-modified staging convention and are not subdivisions of this Mayo
    2012 four-stage score.
  substages:
  - name: Mayo 2012 Stage I
    description: None of the three adverse biomarker thresholds is met.
    evidence:
    - reference: PMID:22331953
      reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients were assigned a score of 1 for each of FLC-diff ≥ 18 mg/dL,
        cTnT ≥ 0.025 ng/mL, and NT-ProBNP ≥ 1,800 pg/mL, creating stages I to IV
        with scores of 0 to 3 points, respectively.
      explanation: A score of zero maps directly to Mayo 2012 stage I.
  - name: Mayo 2012 Stage II
    description: One of the three adverse biomarker thresholds is met.
    evidence:
    - reference: PMID:22331953
      reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients were assigned a score of 1 for each of FLC-diff ≥ 18 mg/dL,
        cTnT ≥ 0.025 ng/mL, and NT-ProBNP ≥ 1,800 pg/mL, creating stages I to IV
        with scores of 0 to 3 points, respectively.
      explanation: A score of one maps directly to Mayo 2012 stage II.
  - name: Mayo 2012 Stage III
    description: Two of the three adverse biomarker thresholds are met.
    evidence:
    - reference: PMID:22331953
      reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients were assigned a score of 1 for each of FLC-diff ≥ 18 mg/dL,
        cTnT ≥ 0.025 ng/mL, and NT-ProBNP ≥ 1,800 pg/mL, creating stages I to IV
        with scores of 0 to 3 points, respectively.
      explanation: A score of two maps directly to Mayo 2012 stage III.
  - name: Mayo 2012 Stage IV
    description: All three adverse biomarker thresholds are met.
    evidence:
    - reference: PMID:22331953
      reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients were assigned a score of 1 for each of FLC-diff ≥ 18 mg/dL,
        cTnT ≥ 0.025 ng/mL, and NT-ProBNP ≥ 1,800 pg/mL, creating stages I to IV
        with scores of 0 to 3 points, respectively.
      explanation: A score of three maps directly to Mayo 2012 stage IV.
  evidence:
  - reference: PMID:22331953
    reference_title: "Revised prognostic staging system for light chain amyloidosis incorporating cardiac biomarkers and serum free light chain measurements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were assigned a score of 1 for each of FLC-diff ≥ 18 mg/dL, cTnT
      ≥ 0.025 ng/mL, and NT-ProBNP ≥ 1,800 pg/mL, creating stages I to IV with
      scores of 0 to 3 points, respectively.
    explanation: >-
      The derivation and validation study provides the exact thresholds and
      stage mapping.
- name: Renal Outcome Staging System
  description: >-
    Renal risk is stratified by proteinuria above 5 g/24 h and eGFR below 50
    mL/min. Neither adverse factor defines stage I, one defines stage II, and
    both define stage III, with increasing risk of progression to dialysis.
  substages:
  - name: Renal Stage I
    description: Proteinuria is at or below 5 g/24 h and eGFR is at or above 50 mL/min.
    evidence:
    - reference: PMID:25115890
      reference_title: "A staging system for renal outcome and early markers of renal response to chemotherapy in AL amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Proteinuria below and eGFR above the thresholds indicated low risk (0 and
        4% at 3 years in the testing and validation cohorts, respectively).
      explanation: The low-risk combination defines renal stage I.
  - name: Renal Stage II
    description: One adverse renal factor is present.
    evidence:
    - reference: PMID:25115890
      reference_title: "A staging system for renal outcome and early markers of renal response to chemotherapy in AL amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Proteinuria >5 g/24 h and estimated glomerular filtration rate (eGFR) <50
        mL/min predicted progression to dialysis best.
      explanation: Stage II is the intermediate category with one adverse factor.
  - name: Renal Stage III
    description: Proteinuria exceeds 5 g/24 h and eGFR is below 50 mL/min.
    evidence:
    - reference: PMID:25115890
      reference_title: "A staging system for renal outcome and early markers of renal response to chemotherapy in AL amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High proteinuria and low eGFR indicated high risk (60% and 85% at 3
        years).
      explanation: The high-risk two-factor combination defines renal stage III.
  evidence:
  - reference: PMID:25115890
    reference_title: "A staging system for renal outcome and early markers of renal response to chemotherapy in AL amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteinuria >5 g/24 h and estimated glomerular filtration rate (eGFR) <50
      mL/min predicted progression to dialysis best.
    explanation: >-
      The testing and validation cohorts establish the two renal risk thresholds.

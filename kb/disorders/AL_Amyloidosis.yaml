      daratumumab to bortezomib, cyclophosphamide, and dexamethasone was
      associated with higher frequencies of hematologic complete response and
      survival free from major organ deterioration or hematologic progression.
    explanation: >-
      The primary ANDROMEDA publication supports the four-drug regimen and its
      hematologic and organ-progression outcomes.

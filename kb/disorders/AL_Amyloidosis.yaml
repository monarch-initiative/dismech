    reference_title: "Daratumumab-Bortezomib-Cyclophosphamide-Dexamethasone in Newly Diagnosed Amyloidosis: ANDROMEDA Final Survival Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With a median follow-up of 61.4 months, significant improvement was
      observed with D-VCd versus VCd in major organ
      deterioration-progression-free survival (hazard ratio, 0.44; 95% CI,
      0.31-0.63; P<0.0001) and overall survival (hazard ratio, 0.62; 95% CI,
      0.42-0.90; P=0.0121).
    explanation: >-
      The final randomized-trial analysis demonstrates both organ-deterioration
      and overall-survival benefit.

- name: Individualized Therapy for Relapsed Disease
  description: >-
    Relapsed systemic AL has no single universal salvage regimen. Selection among
    anti-CD38, proteasome-inhibitor, immunomodulatory, alkylator-based, and
    selected transplant approaches depends on the depth and duration of the
    initial response, prior drug-class exposure, fitness or frailty, and end-organ
    dysfunction. A previously unused active class is generally preferred when
    feasible; venetoclax remains a separate investigational option for selected
    t(11;14)-positive disease.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Amyloidogenic Plasma-Cell Clone
    treatment_effect: INHIBITS
    description: Salvage therapy is selected to regain suppression of the pathogenic clone after relapse.
    evidence:
    - reference: PMID:35838162
      reference_title: "Guidelines for non-transplant chemotherapy for treatment of systemic AL amyloidosis: EHA-ISA working group."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        At relapse, the two guiding principles are the depth and duration of
        initial response, use of a class of agents not previously exposed as well
        as the limitation imposed by patients' fitness/frailty and end organ
        damage.
      explanation: >-
        The specialty guideline directly supports individualized, exposure-aware
        relapse selection constrained by patient fitness and organ damage.
  evidence:

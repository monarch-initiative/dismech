discussions:
- discussion_id: gap_al_advanced_cardiac_therapy
  prompt: >-
    Which strategies can rapidly improve survival and cardiac function in
    systemic AL patients presenting with advanced cardiac involvement while
    clone-directed therapy reduces new light-chain production?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Myocardial Stiffening and Diastolic Dysfunction
  - pathophysiology#Soluble Amyloidogenic Light-Chain Cardiotoxicity
  rationale: >-
    Advanced cardiac disease remains a major unmet need. CAEL-101 phase III
    programs remain active but closed to new enrollment, while the confirmatory
    birtamimab phase III trial was terminated after missing its primary endpoint;
    no fibril-clearing strategy should therefore be represented as established.
  evidence:
  - reference: PMID:30361521
    reference_title: "Systemic immunoglobulin light chain amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, effective therapies for patients with advanced cardiac involvement
      are an unmet need.
    explanation: >-
      The review explicitly identifies the advanced-cardiac treatment gap.
  - reference: clinicaltrials:NCT04512235
    reference_title: "A Phase 3, Double-Blind, Multicenter Study to Evaluate the Efficacy and Safety of CAEL-101 and Plasma Cell Dyscrasia Treatment Versus Placebo and Plasma Cell Dyscrasia Treatment in Plasma Cell Dyscrasia Treatment Naïve Patients With Mayo Stage IIIa AL Amyloidosis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary purpose of this study is to determine whether CAEL-101, a
      monoclonal antibody that removes AL amyloid deposits from tissues and
      organs, improves overall survival, reduces cardiovascular related
      hospitalizations and it is safe and well tolerated in patients with stage
      IIIa AL amyloidosis.
    explanation: >-
      The registry describes an ongoing investigational deposit-directed
      strategy but does not establish benefit.
  - reference: clinicaltrials:NCT04973137
    reference_title: "A Phase 3, Randomized, Multicenter, Double-Blind, Placebo-Controlled, Efficacy and Safety Study of Birtamimab Plus Standard of Care vs. Placebo Plus Standard of Care in Mayo Stage IV Subjects With Light Chain (AL) Amyloidosis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A Phase 3 study to evaluate the efficacy and safety of birtamimab plus
      standard of care compared to placebo plus standard of care in Mayo Stage IV
      patients with AL amyloidosis.
    explanation: >-
      The registry cache supports the confirmatory trial design; its terminated
      status was independently verified and prevents portraying the agent as
      established.

- name: Amyloidogenic Monoclonal Free Light-Chain Production and Secretion
  description: >-
    The clone produces and secretes a patient-specific kappa or lambda free light
    chain whose sequence and stability favor misfolding. A large clone or marked
    absolute excess is not required for pathogenicity. This is the disease-specific
    amyloidogenic precursor measured by serum free-light-chain assays.
  role: trigger
  conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein

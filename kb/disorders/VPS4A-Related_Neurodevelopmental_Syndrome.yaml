  evidence:
  - reference: PMID:33186545
    reference_title: "De Novo VPS4A Mutations Cause Multisystem Disease with Abnormal Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      six unrelated individuals with de novo missense variants affecting the
      ATPase domain of VPS4A, a critical enzyme regulating ESCRT function
    explanation: >-
      Locates the disease-causing variants in the ATPase domain of VPS4A and
      identifies VPS4A as the ESCRT-regulating enzyme.
  - reference: PMID:33186545
    reference_title: "De Novo VPS4A Mutations Cause Multisystem Disease with Abnormal Neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cultured cells, overexpression of VPS4A mutants caused enlarged
      endosomal vacuoles resembling those induced by expression of known
      dominant-negative ATPase-defective forms of VPS4A.
    explanation: >-
      The mutant proteins phenocopy engineered ATPase-dead VPS4A, supporting a
      dominant-negative loss of ATPase-driven ESCRT-III disassembly.
  - reference: PMID:39455257
    reference_title: "Defects in Exosome Biogenesis Are Associated with Sensorimotor Defects in Zebrafish vps4a Mutants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Biochemical analyses indicate that the T248I mutation reduces the ATPase
      activity of Vps4a and disassembly of ESCRT filaments, which mediate
      membrane scission.
    explanation: >-
      A zebrafish vps4a missense allele directly demonstrates that this class of
      variant reduces ATPase activity and ESCRT filament disassembly.
  downstream:
  - target: Enlarged Endosomal Compartments with IST1 Retention
    causal_link_type: DIRECT
    description: >-
      Without ATP-driven ESCRT-III turnover, ESCRT-III subunits remain bound to
      endosomal membranes and endosomal compartments swell.
    evidence:
    - reference: PMID:33186545
      reference_title: "De Novo VPS4A Mutations Cause Multisystem Disease with Abnormal Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Proband-derived fibroblasts had enlarged endosomal structures with
        abnormal accumulation of the ESCRT protein IST1 on the limiting
        membrane.
      explanation: >-
        Patient-derived cells show the predicted consequence of failed
        ESCRT-III disassembly.
  - target: VPS4A Destabilization and Lipotoxic Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed additional arm from a single 2026 family: an ATPase-domain
      missense variant destabilises VPS4A and impairs its lipid-droplet
      association, producing lipotoxic stress in proband fibroblasts. The
      intermediates between protein destabilisation and lipid accumulation are
      not established.
    evidence:
    - reference: PMID:42498620
      reference_title: "A novel VPS4A variant drives lipotoxicity underlying CIMDAG syndrome."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Together, these findings demonstrate that a novel pathogenic VPS4A
        variant drives structural destabilization and lipotoxicity, providing
        mechanistic insight into lipid homeostasis perturbations in CIMDAG
        syndrome.
      explanation: >-
        The authors assert the destabilisation-to-lipotoxicity link; marked
        PARTIAL because it derives from one variant in one family and has not
        been replicated for the canonical de novo alleles.
  - target: Defective Cytokinetic Abscission
    causal_link_type: DIRECT
    description: >-
      ESCRT-III disassembly by VPS4A is also required to complete the final
      membrane cut between daughter cells.
    evidence:
    - reference: PMID:38687820
      reference_title: "The human AAA-ATPase VPS4A isoform and its co-factor VTA1 have a unique function in regulating mammalian cytokinesis abscission."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        VPS4A depletion resulted in a more severe abscission delay than VPS4B
        and was found to be involved in earlier stages of abscission.
      explanation: >-
        Isoform-resolved knockout work shows VPS4A itself carries a
        non-redundant abscission role, linking VPS4A loss of function to
        cytokinesis failure.
  - target: Chromosome Missegregation and Mitotic Spindle Errors
    causal_link_type: DIRECT
    description: >-
      The same failure of ESCRT-III turnover disturbs chromosome segregation,
      mitotic spindle formation and cell cycle progression in proband cells.
    evidence:
    - reference: PMID:33186545
      reference_title: "De Novo VPS4A Mutations Cause Multisystem Disease with Abnormal Neurodevelopment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutations affected other ESCRT-dependent cellular processes, including
        regulation of centrosome number, primary cilium morphology, nuclear
        membrane morphology, chromosome segregation, mitotic spindle formation,
        and cell cycle progression.
      explanation: >-
        The disease variants are shown to disturb chromosome segregation and
        spindle formation as ESCRT-dependent processes, placing this arm
        downstream of the ESCRT-III turnover defect.
  - target: Centrosome Number and Primary Cilium Abnormalities
    causal_link_type: DIRECT
    description: >-
      Failed ESCRT-III turnover is also accompanied by abnormal centrosome

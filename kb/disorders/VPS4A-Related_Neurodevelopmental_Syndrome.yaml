name: VPS4A-Related Neurodevelopmental Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: CIMDAG syndrome
  term:
    id: MONDO:0035819
    label: cerebellar hypoplasia-intellectual disability-congenital microcephaly-dystonia-anemia-growth retardation syndrome
description: >-
  CIMDAG syndrome (cerebellar hypoplasia, impaired intellectual development,
  congenital microcephaly, dystonia, anemia, and growth retardation) is an
  ultra-rare multisystem developmental disorder caused by missense variants in
  VPS4A, the AAA-ATPase that disassembles ESCRT-III filaments and thereby
  terminates every ESCRT-dependent membrane-scission event. Affected children
  have severe neurodevelopmental delay with structural brain abnormalities,
  congenital microcephaly, dystonia, cataracts, growth impairment, and a
  congenital dyserythropoietic anemia in which bone marrow shows binucleated
  erythroblasts and erythroblasts joined by cytoplasmic bridges. The unifying
  cellular lesion is failure of ESCRT-III turnover: patient cells accumulate
  enlarged endosomal compartments with the ESCRT protein IST1 trapped on the
  limiting membrane, and cytokinetic abscission, centrosome number, primary
  cilium morphology, chromosome segregation, and cell-cycle progression are all
  disturbed. Most reported probands carry de novo heterozygous variants in the
  VPS4A ATPase domain that behave in cells like known dominant-negative
  ATPase-defective VPS4A.
synonyms:
- CIMDAG syndrome
- cerebellar hypoplasia-intellectual disability-congenital microcephaly-dystonia-anemia-growth retardation syndrome
- VPS4A-related multisystem disease with abnormal neurodevelopment
- syndromic congenital dyserythropoietic anemia due to VPS4A deficiency
parents:
- Neurodevelopmental Disorder
notes: >-
  Gene identity was confirmed before curation: MONDO:0035819 asserts
  RO:0004003 to HGNC:13488 (VPS4A) and xrefs OMIM:619273, matching every
  source cited here. VPS4A is deliberately distinguished throughout from its
  paralog VPS4B; PMID:38687820 is cited specifically because it dissects the
  paralog-specific abscission role that explains why VPS4A variants are
  pathogenic in the presence of a fully functional VPS4B.

  No GeneReviews chapter exists for CIMDAG syndrome or VPS4A (PubMed searches
  "VPS4A GeneReviews[All Fields]" and "CIMDAG GeneReviews[All Fields]" both
  returned zero records on 2026-08-01), so the GeneReviews phenotype baseline
  step was not applicable.

  Phenotype `frequency:` bands are deliberately omitted throughout. The
  published cohorts are tiny (six probands in PMID:33186545, three in
  PMID:33186543, single case reports thereafter) and the abstracts attribute
  features to "probands" collectively without per-feature counts, so no
  defensible denominator exists for a FrequencyEnum band. Per the frequency
  evidence guidelines, the association is asserted and the band is left unset.

  Onset descriptors are likewise omitted except where a source states the
  timing: the disease name and PMID:42498620 establish that the microcephaly is
  congenital, but the cached abstracts give no ages at onset for the other
  features.

  Deep research: `just research-disorder claude_code
  VPS4A-Related_Neurodevelopmental_Syndrome`
  (research/VPS4A-Related_Neurodevelopmental_Syndrome-deep-research-claude_code.md,
  2026-08-01, 11 web searches, 69 turns). NEC preflight on that report passed -
  VPS4A is named 120 times against 23 for VPS4B (the paralog comparison is the
  report's own subject matter, not a substitution), the only OMIM asserted is
  OMIM:619273, and the only disease MONDO asserted is MONDO:0035819.

  Only PMID:38687820 is cached as full text; every other cited reference is
  abstract-only. A large amount of clinically valuable detail in the deep
  research report (per-phenotype patient-count frequencies from the HPO
  annotation file, splenomegaly, hepatomegaly, iron overload, seizures,
  spasticity, retinal dystrophy, the specific variant table, and the family
  support-group management guidance) therefore has no quotable cached source.
  None of it is supported here by an unverifiable snippet.

  HPOA-sourced phenotypes. Following the PR #7728 review, the features that the
  HPO annotation set records for OMIM:619273 but that no cached abstract quotes
  are curated as phenotype descriptors carrying a `notes:` provenance statement
  and no evidence item, rather than being omitted. dismech does not require an
  evidence item on a Phenotype, and this entry already used the
  descriptor-plus-note pattern for its Treatment object; omitting the
  phenotypes made the entry read as though a child with CIMDAG syndrome has no
  seizures, no visual impairment and no feeding difficulty. The annotation set
  was retrieved independently for this entry from
  https://ontology.jax.org/api/network/annotation/OMIM:619273 on 2026-08-01
  (35 annotations returned) and each descriptor's note records the
  patient-count fraction that the annotation set carries and the date of
  retrieval. Those fractions are deliberately NOT converted into `frequency:`
  bands: they are counts over series of three to six probands drawn from the
  unreachable full texts, and a band would assert a population frequency that
  no source states. Where a cached text does support the feature, an evidence
  item is attached instead (HP:0000252, HP:0000505, HP:0000407, HP:0010972).
  One descriptor, HP:0001744 Splenomegaly, is NOT in the annotation set and its
  weaker provenance is recorded in its own note.

- name: Multisystem Developmental and Hematologic Disease
  biological_scale: ORGANISM
  description: >-
    The convergent clinical endpoint: a syndrome combining cerebellar
    hypoplasia, impaired intellectual development, congenital microcephaly,
    dystonia, anemia, and growth retardation, with cataracts a frequent
    additional feature.
  evidence:
  - reference: PMID:42498620
    reference_title: "A novel VPS4A variant drives lipotoxicity underlying CIMDAG syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar hypoplasia, impaired intellectual development, congenital
      microcephaly, dystonia, anemia, and growth retardation (CIMDAG) syndrome
      is caused by variants in VPS4A.
    explanation: >-
      Names the full CIMDAG feature set and attributes it to VPS4A variants.
- name: VPS4A Destabilization and Lipotoxic Stress
  biological_scale: CELLULAR
  role: emerging mechanism
  description: >-
    A single 2026 report proposes an additional lipid-handling arm: a VPS4A
    p.Arg288Gln variant aggregated, interacted less with LC3B, and failed to
    localise to lipid droplets, and proband fibroblasts accumulated lipid, free
    fatty acids, and reactive oxygen species. This is a one-family observation
    and is recorded here as an emerging, not established, mechanism.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: lipid storage
    modifier: INCREASED
    term:
      id: GO:0019915
      label: lipid storage
  cellular_components:
  - preferred_term: lipid droplet
    term:
      id: GO:0005811
      label: lipid droplet
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:42498620
    reference_title: "A novel VPS4A variant drives lipotoxicity underlying CIMDAG syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Proband fibroblasts exhibited increased lipid accumulation, elevated free
      fatty acids, and higher reactive oxygen species levels, indicative of
      lipotoxic stress.
    explanation: >-
      Direct fibroblast measurements in one proband support a lipotoxic-stress
      readout downstream of the variant.
  - reference: PMID:42498620
    reference_title: "A novel VPS4A variant drives lipotoxicity underlying CIMDAG syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The VPS4A-p.Arg288Gln variant showed enhanced aggregation and reduced
      interaction with LC3B
    explanation: >-
      Proposed molecular basis for the lipid-droplet mislocalisation; PARTIAL
      because it rests on a single variant in a single family.
  notes: >-
    Downstream consequence is only partly established (raised in the PR #7728
    review, suggestion 4, where this node was a pathograph dead-end). The
    authors of PMID:42498620 frame lipotoxic stress as explaining lipid
    homeostasis perturbations in CIMDAG syndrome, which is enough to draw the
    edge below to the multisystem endpoint, but no source demonstrates that
    lipotoxicity produces any specific clinical feature. The plausible clinical
    correlates are the hepatomegaly and hepatic steatosis recorded in the
    annotation set and the single reported case of lipodystrophy; neither has
    been linked to this mechanism in a cached source, so the edge is marked
    INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL support and no more specific
    target is asserted.
  downstream:
  - target: Multisystem Developmental and Hematologic Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42498620
      reference_title: "A novel VPS4A variant drives lipotoxicity underlying CIMDAG syndrome."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Together, these findings demonstrate that a novel pathogenic VPS4A
        variant drives structural destabilization and lipotoxicity, providing
        mechanistic insight into lipid homeostasis perturbations in CIMDAG
        syndrome.
      explanation: >-
        The authors attach the lipotoxic arm to CIMDAG syndrome itself, which
        justifies an edge to the clinical endpoint. PARTIAL and
        INDIRECT_UNKNOWN_INTERMEDIATES because the claim is an interpretive
        framing from one family, and no intermediate step between fibroblast
        lipid accumulation and any clinical feature has been shown.

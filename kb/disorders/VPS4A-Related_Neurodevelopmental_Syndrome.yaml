- category: Hematological
  name: Congenital dyserythropoietic anemia
  phenotype_term:
    preferred_term: Congenital dyserythropoietic anemia
    term:
      id: HP:0001903
      label: Anemia
  description: >-
    Anemia is a defining CIMDAG feature. In most reported individuals it is a
    congenital dyserythropoietic anemia with binucleated erythroblasts on
    marrow examination.
  notes: >-
    Term choice: HPO was searched for a "congenital dyserythropoietic anemia"
    class and none exists. The nearest candidates were audited and rejected:
    HP:0005532 (Macrocytic dyserythropoietic anemia) is a child of macrocytic
    anemia and no cached source documents macrocytosis in these probands, and
    HP:0031688 (Erythroid dysplasia, synonym "Dyserythropoiesis") is a marrow
    morphology term rather than an anemia term - the marrow morphology is
    curated separately below under HP:0034278. Generic HP:0001903 is therefore
    used for the anemia itself.

    Following the PR #7728 review (suggestion 3), HP:0010972 (Anemia of
    inadequate production) was added as a second, mechanistically specific
    anemia descriptor - see the phenotype immediately below. It was added
    rather than substituted: HP:0001903 is retained because the anemia of this
    syndrome is not uniformly a production defect (PMID:33460484 reports a
    hemolytic presentation), so the generic term is the one that covers the
    whole reported spectrum.

    The haematological presentation is also not uniform: PMID:33460484 reports a
    VPS4A proband whose anemia was hemolytic without obvious dyserythropoiesis.
    Only that paper's title is available in the cached record (the journal
    supplied no abstract to PubMed), so the observation is recorded here as a
    note rather than as a snippet-backed evidence item.
  evidence:
  - reference: PMID:33186543
    reference_title: "VPS4A Mutations in Humans Cause Syndromic Congenital Dyserythropoietic Anemia due to Cytokinesis and Trafficking Defects."

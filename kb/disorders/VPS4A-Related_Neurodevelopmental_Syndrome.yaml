- name: Ineffective Erythropoiesis with Dyserythropoiesis
  biological_scale: TISSUE
  description: >-
    The erythroid lineage is unusually sensitive to the VPS4A lesion. Bone
    marrow shows binucleated erythroblasts and erythroblasts connected by
    cytoplasmic bridges, and circulating red cells abnormally retain the
    transferrin receptor CD71, showing that VPS4A-dependent vesicular
    trafficking is also required for the terminal membrane remodelling of
    reticulocyte maturation. The phenotype has been reproduced in
    proband-derived iPSCs.

- name: Defective Cytokinetic Abscission
  biological_scale: CELLULAR
  description: >-
    VPS4A-dependent ESCRT-III turnover is required to complete the final
    membrane cut between daughter cells. VPS4A holds an abscission role that its
    paralog VPS4B cannot fully substitute, which is why heterozygous VPS4A
    variants are pathogenic despite an intact VPS4B gene.
  notes: >-
    Split out from a former combined node "Defective Cytokinetic Abscission and
    Cell-Division Errors" in response to the PR #7728 review (suggestion 2).
    The abscission arm, which carries the erythroid consequence, is now separate
    from the chromosome-segregation arm and from the centrosome/cilium arm, so
    that downstream edges and discussion attachments can be made against the
    specific process each depends on.
  biological_processes:
  - preferred_term: mitotic cytokinesis
    modifier: ABNORMAL
    term:
      id: GO:0000281
      label: mitotic cytokinesis
  evidence:
  - reference: PMID:38687820
    reference_title: "The human AAA-ATPase VPS4A isoform and its co-factor VTA1 have a unique function in regulating mammalian cytokinesis abscission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These observations provide a potential mechanistic explanation for the
      neurodevelopmental defects and other related disorders reported in
      VPS4A-mutated patients with a fully functional VPS4B paralog.
    explanation: >-
      Explains why the disease is VPS4A-specific: VPS4B cannot compensate for
      the regulatory abscission role held by VPS4A.
  - reference: PMID:38687820
    reference_title: "The human AAA-ATPase VPS4A isoform and its co-factor VTA1 have a unique function in regulating mammalian cytokinesis abscission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that patients who carry normal VPS4B and mutated VPS4A genes
      develop pathologies due to the disruption of VPS4A-mediated cellular
      regulation, which is essential for neurodevelopment
    explanation: >-
      The authors' explicit statement of the paralog-non-redundancy argument,
      quoted from the cached full text. This is the NEC-relevant discriminator:
      the disease is VPS4A-specific and is not a VPS4B disorder.
  - reference: PMID:38687820
    reference_title: "The human AAA-ATPase VPS4A isoform and its co-factor VTA1 have a unique function in regulating mammalian cytokinesis abscission."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of VTA1, a co-factor of VPS4, disrupted VPS4A-ANCHR interactions
      and accelerated abscission, suggesting that VTA1 is also involved in the
      abscission regulation.
    explanation: >-
      Places VPS4A within a regulated abscission-checkpoint module (with ANCHR
      and the co-factor VTA1), supporting a regulatory rather than purely
      catalytic role at the midbody. PARTIAL because it uses depletion rather
      than a patient missense allele.
  downstream:
  - target: Ineffective Erythropoiesis with Dyserythropoiesis
    causal_link_type: DIRECT
    description: >-
      Failed abscission in the erythroid lineage produces binucleated
      erythroblasts and erythroblasts joined by cytoplasmic bridges.
    evidence:
    - reference: PMID:33186543
      reference_title: "VPS4A Mutations in Humans Cause Syndromic Congenital Dyserythropoietic Anemia due to Cytokinesis and Trafficking Defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bone marrow studies showed binucleated erythroblasts and erythroblasts
        with cytoplasmic bridges indicating abnormal cytokinesis and abscission.
      explanation: >-
        Patient bone marrow directly demonstrates the abscission failure in
        erythroid precursors.

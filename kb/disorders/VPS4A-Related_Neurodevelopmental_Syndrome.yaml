inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The established mode is a heterozygous de novo missense variant in the
    VPS4A ATPase domain acting through a dominant-negative mechanism. A single
    later report (PMID:42498620) describes a homozygous VPS4A variant in a
    consanguineous-context proband, so a recessive route is not excluded, but
    the multi-proband series both report de novo heterozygous alleles.
  evidence:
  - reference: PMID:33186545
    reference_title: "De Novo VPS4A Mutations Cause Multisystem Disease with Abnormal Neurodevelopment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe six unrelated individuals with de novo missense variants
      affecting the ATPase domain of VPS4A, a critical enzyme regulating ESCRT
      function.
    explanation: >-
      Six unrelated probands with de novo missense variants establishes a
      dominant, sporadic mode of inheritance.
pathophysiology:
- name: VPS4A ATPase-Domain Missense Variants Impair ESCRT-III Disassembly
  biological_scale: MOLECULAR
  description: >-
    VPS4A is the AAA-ATPase that hydrolyses ATP to disassemble ESCRT-III
    polymers after a membrane-scission event. Disease-associated missense
    variants cluster in the ATPase domain and behave in cells like known
    dominant-negative ATPase-defective VPS4A, so the enzyme is present but
    cannot complete the ESCRT-III turnover cycle.

- category: Hematological
  name: Anemia of inadequate production
  phenotype_term:
    preferred_term: Anemia of inadequate production
    term:
      id: HP:0010972
      label: Anemia of inadequate production
  description: >-
    In the dyserythropoietic presentations the anemia arises from ineffective
    erythropoiesis - erythroblasts fail cytokinesis and mature asynchronously -
    rather than from peripheral red cell loss. HP:0010972 captures that
    production-side mechanism, which the generic anemia term does not.

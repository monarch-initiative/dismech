discussions:
- discussion_id: vps4a_zebrafish_translational_reach
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the zebrafish vps4a T248I sensorimotor-circuit lesion actually explain
    the hypotonia and motor delay of human CIMDAG syndrome, given that the
    human disease additionally shows cerebellar hypoplasia, congenital
    microcephaly, dystonia, and dyserythropoietic anemia that the fish model
    has not been shown to reproduce?
  attaches_to:
  - "pathophysiology#Abnormal Neurodevelopment and Structural Brain Malformation"
  rationale: >-
    The zebrafish work localises the deficit to sensorimotor transformation
    with intact motor neurons and muscle, which maps well onto the central
    hypotonia described in patients. But the model's reported readouts are
    reflex and circuit assays, not the structural cerebellar/cortical
    malformation or the erythroid phenotype that dominate the human disorder,
    so its translational reach beyond hypotonia is untested.
  proposed_experiments:
  - experiment_id: vps4a_zf_brain_morphometry
    name: Cerebellar and telencephalic morphometry in vps4a mutant larvae
    description: >-
      Quantify cerebellar and telencephalic size and neuronal number in vps4a
      T248I larvae and compare with the cerebellar hypoplasia and congenital
      microcephaly reported in patients.
    decision_criterion: >-
      A significant reduction in cerebellar and telencephalic volume/neuron
      number relative to wild-type siblings would extend the model's validity
      beyond sensorimotor circuits.
  - experiment_id: vps4a_zf_erythroid_phenotyping
    name: Erythroid phenotyping of vps4a mutant zebrafish
    description: >-
      Assay erythroid development and erythrocyte morphology in vps4a mutant
      zebrafish to test whether the dyserythropoietic arm of the human disease
      is conserved.
    decision_criterion: >-
      Binucleate or bridged erythroid precursors in the mutant would support
      conservation of the abscission-failure mechanism in vivo.
  - experiment_id: vps4a_patient_organoid_growth
    name: Patient-variant cerebral and cerebellar organoids
    description: >-
      Determine whether human iPSC-derived cerebral or cerebellar organoids
      carrying VPS4A ATPase-domain variants reproduce the structural growth
      deficit.
    decision_criterion: >-
      Reduced organoid size or disrupted cytoarchitecture versus isogenic
      controls would place the growth deficit in human neural tissue.
- discussion_id: vps4a_recessive_allele_question
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the homozygous VPS4A p.Arg288Gln allele a genuine recessive route to
    CIMDAG syndrome, or a hypomorph whose heterozygous carriers are simply
    unascertained?
  attaches_to:
  - "pathophysiology#VPS4A ATPase-Domain Missense Variants Impair ESCRT-III Disassembly"
  rationale: >-
    Every proband in the two multi-case series carried a de novo heterozygous
    ATPase-domain missense variant acting dominant-negatively. A single 2026
    report describes a homozygous allele. Whether the parents were
    asymptomatic heterozygotes, and whether p.Arg288Gln is dominant-negative or
    simply hypomorphic, is unresolved and matters for counselling.
  proposed_experiments:
  - experiment_id: vps4a_r288q_parental_segregation
    name: Parental phenotyping and segregation analysis
    description: >-
      Phenotype and re-sequence the heterozygous parents of the p.Arg288Gln
      proband for subclinical CIMDAG features.
    decision_criterion: >-
      Entirely unaffected heterozygous parents would support a genuinely
      recessive allele; subclinical features would argue for a hypomorph with
      dosage-dependent expressivity.
  - experiment_id: vps4a_r288q_isogenic_allele_comparison
    name: Isogenic side-by-side allele comparison
    description: >-
      Compare p.Arg288Gln with a canonical de novo allele in an isogenic cell
      system for ATPase activity, ESCRT-III disassembly, and dominant-negative
      behaviour on co-expression with wild-type VPS4A.
    decision_criterion: >-
      Absence of dominant-negative behaviour for p.Arg288Gln when co-expressed
      with wild-type VPS4A would establish it as a distinct, recessive-acting
      allele class.
- discussion_id: vps4a_static_versus_progressive
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is CIMDAG syndrome a static developmental malformation syndrome, a
    progressive neurodegeneration, or both?
  attaches_to:
  - "pathophysiology#Abnormal Neurodevelopment and Structural Brain Malformation"
  rationale: >-
    The disorder is usually framed developmentally - cerebellar hypoplasia and
    congenital microcephaly are malformations present from birth. But an
    abscission/cell-division lesion that depletes neural progenitors and an
    endolysosomal lesion that persists in post-mitotic neurons are different
    kinds of injury with different time courses, and reported neuroimaging
    includes atrophy (PMID:42498620 documents cerebellar atrophy, not only
    hypoplasia) rather than pure hypoplasia. Whether affected individuals lose
    previously acquired skills, and whether brain volume falls on serial
    imaging, determines whether this entry's causal graph should carry a
    degenerative arm at all. No natural history study exists.
  proposed_experiments:
  - experiment_id: vps4a_serial_neuroimaging
    name: Serial volumetric neuroimaging in a CIMDAG cohort
    description: >-
      Collect longitudinal volumetric brain MRI in molecularly confirmed
      individuals and measure change in cerebellar, brainstem, and supratentorial
      volume over time against age-matched norms.
    decision_criterion: >-
      Progressive loss of volume beyond the expected trajectory would establish a
      degenerative component; stable z-scores would support a purely
      malformative model.
  - experiment_id: vps4a_longitudinal_developmental_assessment
    name: Longitudinal standardised developmental assessment
    description: >-
      Apply repeated standardised developmental/adaptive measures to distinguish
      plateau from regression.
    decision_criterion: >-
      Documented loss of previously acquired skills would support regression.
- discussion_id: vps4a_micronuclei_cgas_sting_interferon
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the chromosome-segregation errors caused by VPS4A variants generate
    micronuclei that activate cGAS-STING and produce a chronic type I
    interferon signature in patients?
  attaches_to:
  - "pathophysiology#Chromosome Missegregation and Mitotic Spindle Errors"
  rationale: >-
    PMID:33186545 documents disturbed chromosome segregation and mitotic spindle
    formation in patient cells. Micronucleus formation from missegregated
    chromosomes is the canonical route to cytosolic-DNA sensing by cGAS-STING and
    hence to a chronic interferonopathy. Nobody has measured an interferon
    signature in CIMDAG blood, so it is unknown whether this well-established
    downstream consequence of chromosomal instability actually operates here.
    If it does, it would add a targetable inflammatory arm to a disease that
    currently has no disease-modifying therapy.
  proposed_experiments:
  - experiment_id: vps4a_interferon_signature_blood
    name: Type I interferon signature in patient blood
    description: >-
      Measure an interferon-stimulated gene score in whole blood from molecularly
      confirmed VPS4A probands against age-matched controls.
    decision_criterion: >-
      An elevated ISG score would support an active cGAS-STING arm and justify
      testing JAK inhibition; a normal score would close the question.
  - experiment_id: vps4a_micronuclei_cgas_colocalisation
    name: Micronucleus and cGAS colocalisation in proband fibroblasts
    description: >-
      Quantify micronuclei in proband-derived fibroblasts and score cGAS
      recruitment to ruptured micronuclei alongside downstream STING-TBK1-IRF3
      activation.
    decision_criterion: >-
      cGAS-positive micronuclei with downstream pathway activation, absent in
      isogenic controls, would establish the cell-autonomous link.
- discussion_id: vps4a_allele_selective_silencing_rationale
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If the dominant alleles act by poisoning VPS4A hexamers rather than by
    haploinsufficiency, is allele-selective knockdown of the mutant transcript a
    rational therapeutic strategy?
  attaches_to:
  - "pathophysiology#VPS4A ATPase-Domain Missense Variants Impair ESCRT-III Disassembly"
  rationale: >-
    PMID:33186545 shows the patient mutants phenocopy engineered
    dominant-negative ATPase-dead VPS4A, which implies that removing the mutant
    product - rather than adding wild-type protein - is the mechanistically
    correct intervention. Gene addition would not clear poisoned hexamers. The
    open questions are whether losing one VPS4A allele is tolerated in humans,
    and whether the CNS phenotype is already fixed prenatally, which would cap
    any postnatal benefit. Recorded as an open question, not as a treatment
    claim: no such program exists and no supporting outcome data are cited here.
  proposed_experiments:
  - experiment_id: vps4a_allele_selective_knockdown_in_vitro
    name: Allele-selective knockdown in proband fibroblasts and iPSC neurons
    description: >-
      Test allele-selective ASO or siRNA against a recurrent VPS4A missense
      allele in proband-derived fibroblasts and iPSC-derived neurons, reading out
      endosomal morphology, IST1 localisation, and abscission timing.
    decision_criterion: >-
      Normalisation of endosomal morphology and abscission on selective mutant
      knockdown, without a penalty from the resulting reduced total VPS4A dose,
      would validate the strategy in principle.
  - experiment_id: vps4a_heterozygous_lof_tolerance
    name: Population assessment of VPS4A loss-of-function tolerance
    description: >-
      Systematically evaluate whether heterozygous predicted-loss-of-function
      VPS4A alleles occur in unselected population databases at frequencies
      incompatible with a severe phenotype.
    decision_criterion: >-
      Confirmed tolerance of heterozygous loss of function would remove the main
      safety objection to allele-selective silencing.

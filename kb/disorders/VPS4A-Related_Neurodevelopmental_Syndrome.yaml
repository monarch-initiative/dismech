- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying therapy exists for VPS4A-related disease. Reported
    management is supportive: transfusion support for anemia, developmental and
    rehabilitative therapies, dystonia management, cataract surgery, and
    nutritional support for growth failure. No treatment claim in this entry is
    backed by a trial, and none is asserted with evidence here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    Deliberately left without evidence items: no cached reference in this entry
    reports treatment outcomes for CIMDAG syndrome, and asserting a supportive
    care regimen with a mechanistic snippet would be a claim/snippet mismatch.

    Management components described in the secondary literature but NOT curated
    as separate evidenced Treatment objects, because the only sources are a
    family-support-group guide and full-text passages that cannot be verified
    against a cached abstract: red cell transfusion for the anemia, iron
    chelation for transfusional plus ineffective-erythropoiesis iron loading,
    cataract extraction, gastrostomy for feeding failure, anti-seizure
    medication, physiotherapy/occupational therapy/speech therapy with
    augmentative communication, orthotics and spinal surveillance, and genetic
    counselling. Recorded here per the dismech SOP (move an unquotable but
    well-established claim to notes rather than fabricating a snippet).

    No disease-modifying therapy exists and no interventional trial for VPS4A
    or CIMDAG syndrome is registered.

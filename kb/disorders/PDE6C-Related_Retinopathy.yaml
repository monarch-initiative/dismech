diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of PDE6C to identify biallelic pathogenic variants confirms the
    diagnosis and places the patient on the achromatopsia-to-cone-dystrophy
    spectrum.
  results: >-
    Identification of biallelic pathogenic PDE6C variants confirms the diagnosis.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: Molecular sequencing identifies the biallelic PDE6C variants that confirm the diagnosis.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Photopic (cone and flicker) and scotopic (rod) full-field ERG distinguishes
    the cone-selective dysfunction of PDE6C-related retinopathy.
  results: >-
    Reduced or absent cone/photopic ERG responses with preserved rod/scotopic
    responses.
  evidence:
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reduced or absent cone/photopic ERG responses, normal rod/scotopic ERG responses"
    explanation: ERG shows the cone-selective response loss characteristic of PDE6C disease.
- name: Optical coherence tomography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    OCT images outer-retinal and cone-photoreceptor structure, which is more
    severely disrupted in complete achromatopsia than in early-onset cone
    dystrophy.
  results: >-
    More pronounced absence of cone photoreceptors in ACHM than in early-onset
    cone dystrophy.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-sectional retinal imaging via optical coherence tomography revealed a more pronounced absence of cone photoreceptors in patients with ACHM compared to patients with early-onset arCD."
    explanation: OCT resolves the structural cone-loss gradient across the spectrum.
epidemiology:
- name: Contribution to achromatopsia and cone dysfunction
  description: >-
    PDE6C is a rare cause of achromatopsia and cone dysfunction. In one large
    screen, twelve affected patients from seven independent families carried
    PDE6C mutations within a cohort of 492 independent families.
  evidence:
  - reference: PMID:21127010
    reference_title: "Decreased catalytic activity and altered activation properties of PDE6C mutants associated with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve affected patients from seven independent families segregating PDE6C mutations were identified in our total patient cohort of 492 independent families."
    explanation: Quantifies the rarity of PDE6C among achromatopsia/cone-dysfunction families.

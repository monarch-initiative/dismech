genetic:
- name: PDE6C
  gene_term:
    preferred_term: PDE6C
    term:
      id: hgnc:8787
      label: PDE6C
  relationship_type: CAUSATIVE
  features: >-
    Biallelic PDE6C variants reported to date include missense, nonsense,
    frameshift and splice-site changes; the gene-discovery cohort reported the
    homozygous missense alleles p.R29W and p.Y323N and a compound-heterozygous
    missense allele p.M455V. The mechanism of pathogenicity is loss of PDE6C
    catalytic function.
  case_fractions:
  - population: ACHM cohort (1074 independent families; Weisschuh et al., cited by Georgiou 2019)
    case_fraction_percent: 2.4
    notes: PDE6C is a low-prevalence achromatopsia genotype.
    evidence:
    - reference: PMID:31826238
      reference_title: "Deep Phenotyping of PDE6C-Associated Achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A recent study by Weisschuh et al.11 estimated the prevalence of the PDE6C genotype to be 2.4% in a cohort of 1074 independent ACHM families."
      explanation: Gives the PDE6C share of a large achromatopsia cohort.

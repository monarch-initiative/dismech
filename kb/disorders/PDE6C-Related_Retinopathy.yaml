animal_models:
- name: Rhesus macaque PDE6C R565Q
  species: Rhesus macaque
  genotype: PDE6C c.1694G>A (p.R565Q) homozygous
  publication: PMID:39641747
  description: >-
    A naturally occurring homozygous PDE6C missense colony; the only PDE6C model
    with a true fovea, making it the most translationally relevant for human
    cone-dystrophy structure.
  modeled_mechanisms:
  - target: Failure of the Cone Light Response
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Homozygotes have absent cone ERG responses from infancy.
    limitations: >-
      ERG is a tissue-level summation; the cone-intrinsic signalling step is
      inferred rather than directly recorded.
    readouts:
    - name: Light-adapted (cone) electroretinogram
      target: Failure of the Cone Light Response
      direction: DECREASED
      interpretation: Absent cone ERG from infancy indicates loss of the cone light response.
      evidence:
      - reference: PMID:39641747
        reference_title: "Onset and Progression of Disease in Nonhuman Primates With PDE6C Cone Disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygotes as young as 3 months postnatal showed absent cone responses on electroretinogram."
        explanation: Reports absent cone ERG responses in homozygous macaques from infancy.
  - target: Progressive Cone Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reduced foveal ONL thickness from infancy with slow progression and macular atrophy.
    limitations: Progression within adults over four years was modest; degeneration is slow.
    evidence:
    - reference: PMID:39641747
      reference_title: "Onset and Progression of Disease in Nonhuman Primates With PDE6C Cone Disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cone photoreceptors probably degenerate over time and macular atrophy can occur."
      explanation: Documents progressive cone degeneration with macular atrophy in the foveate macaque model.
- name: cpfl1 mouse (Pde6c)
  species: Mouse
  genotype: Pde6c cpfl1 (cone photoreceptor function loss 1), homozygous
  publication: PMID:20593360
  description: >-
    The spontaneous cpfl1 mouse carries a Pde6c loss-of-function mutation and is
    the homologous mouse model of PDE6C achromatopsia; it directly evidences the
    cGMP-driven cone-death branch.
  modeled_mechanisms:
  - target: Progressive Cone Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cone death is associated with cGMP accumulation, calpain activity and VASP
      phosphorylation, grounding the cGMP/Ca2+-overload degeneration edge in
      primary data.
    limitations: >-
      The mouse is rod-dominant and lacks a fovea, and cone death is far more
      rapid than in human PDE6C disease.
    readouts:
    - name: Cone cGMP accumulation
      target: Progressive Cone Photoreceptor Degeneration
      direction: INCREASED
      interpretation: cGMP accumulation precedes and accompanies cone death, the module's toxic-second-messenger route.
      evidence:
      - reference: PMID:20593360
        reference_title: "cGMP-dependent cone photoreceptor degeneration in the cpfl1 mouse retina."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cpfl1 cone photoreceptor cell death was associated with an accumulation of cyclic guanosine monophosphate (cGMP), activity of calpains, and phosphorylation of vasodilator-stimulated protein (VASP)."
        explanation: Directly ties cGMP accumulation to cone photoreceptor death in the PDE6C mouse.
- name: pde6c(w59) zebrafish
  species: Zebrafish
  genotype: pde6c(w59) homozygous
  publication: PMID:24413151
  description: >-
    The pde6c(w59) zebrafish shows early cone loss; it localises cone death to a
    necroptotic (RIP1/RIP3) pathway distinct from the rod caspase route.
  modeled_mechanisms:
  - target: Progressive Cone Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Cone death proceeds through RIP1/RIP3-dependent necroptosis, rescuable by rip3 knockdown.
    limitations: >-
      Zebrafish retinal architecture and regenerative capacity differ markedly
      from human; the necroptosis mechanism is not confirmed in human PDE6C disease.
    evidence:
    - reference: PMID:24413151
      reference_title: "Rip3 knockdown rescues photoreceptor cell death in blind pde6c zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In pde6c(w59) mutant zebrafish, cone photoreceptors expressed high levels of receptor-interacting protein kinase 1 (RIP1) and receptor-interacting protein kinase 3 (RIP3) kinases, key regulators of necroptotic cell death."
      explanation: Identifies the necroptotic cone-death mechanism in the PDE6C zebrafish model.
treatments:
- name: Low vision aids and tinted filters
  therapeutic_modality: DEVICE
  description: >-
    Management is supportive. Tinted or filtering lenses reduce photophobia and
    improve comfort, and low-vision aids support residual acuity; there is no
    approved disease-modifying therapy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dark or special filter glasses or red-tinted contact lenses to reduce photophobia and potentially improve visual acuity; low vision aids"
    explanation: >-
      GeneReviews management of achromatopsia (which includes PDE6C-related
      ACHM5) directly supports tinted/filter lenses and low-vision aids.
- name: Genetic counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance warrants genetic counseling and molecular
    confirmation of both alleles.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: Confirms biallelic recessive inheritance underlying genetic counseling.
- name: Ophthalmologic surveillance
  therapeutic_modality: OTHER
  description: >-
    Periodic ophthalmologic examination monitors for macular and structural
    change; GeneReviews recommends examination every six to 12 months for
    children and every two to three years for adults in achromatopsia.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ophthalmologic examination every six to 12 months for children and every two to three years for adults."
    explanation: GeneReviews surveillance schedule for achromatopsia, which includes PDE6C-related (ACHM5) disease.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of PDE6C to identify biallelic pathogenic variants confirms the
    diagnosis and places the patient on the achromatopsia-to-cone-dystrophy
    spectrum.
  results: >-
    Identification of biallelic pathogenic PDE6C variants confirms the diagnosis.
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Identification of biallelic pathogenic (or likely pathogenic) variants in ATF6, CNGA3, CNGB3, GNAT2, PDE6C, or PDE6H confirms the clinical diagnosis."
    explanation: GeneReviews states biallelic PDE6C variants confirm the clinical diagnosis of achromatopsia.
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: Molecular sequencing identifies the biallelic PDE6C variants that confirm the diagnosis.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Photopic (cone and flicker) and scotopic (rod) full-field ERG distinguishes
    the cone-selective dysfunction of PDE6C-related retinopathy.
  results: >-
    Reduced or absent cone/photopic ERG responses with preserved rod/scotopic
    responses.
  evidence:
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reduced or absent cone/photopic ERG responses, normal rod/scotopic ERG responses"
    explanation: ERG shows the cone-selective response loss characteristic of PDE6C disease.
- name: Optical coherence tomography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    OCT images outer-retinal and cone-photoreceptor structure, which is more
    severely disrupted in complete achromatopsia than in early-onset cone
    dystrophy.
  results: >-
    More pronounced absence of cone photoreceptors in ACHM than in early-onset
    cone dystrophy. Unlike ATF6-related achromatopsia, PDE6C retinopathy presents
    without foveal hypoplasia, a useful distinguishing feature.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-sectional retinal imaging via optical coherence tomography revealed a more pronounced absence of cone photoreceptors in patients with ACHM compared to patients with early-onset arCD."
    explanation: OCT resolves the structural cone-loss gradient across the spectrum.
  - reference: PMID:31826238
    reference_title: "Deep Phenotyping of PDE6C-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDE6C retinopathy is a severe cone dysfunction syndrome often presenting as typical achromatopsia but without foveal hypoplasia."
    explanation: Absence of foveal hypoplasia on OCT distinguishes PDE6C retinopathy from ATF6-related achromatopsia.
epidemiology:
- name: Contribution to achromatopsia and cone dysfunction
  description: >-
    PDE6C is a rare cause of achromatopsia and cone dysfunction. In one large
    screen, twelve affected patients from seven independent families carried
    PDE6C mutations within a cohort of 492 independent families.
  evidence:
  - reference: PMID:21127010
    reference_title: "Decreased catalytic activity and altered activation properties of PDE6C mutants associated with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve affected patients from seven independent families segregating PDE6C mutations were identified in our total patient cohort of 492 independent families."
    explanation: Quantifies the rarity of PDE6C among achromatopsia/cone-dysfunction families.
references:
- reference: PMID:20301591
  title: "Achromatopsia."

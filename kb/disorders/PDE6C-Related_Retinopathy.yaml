  description: >-
    Progressive early-onset autosomal recessive cone (or cone-rod) dystrophy
    from biallelic PDE6C variants, with loss of visual acuity over decades and
    structural cone loss on imaging, representing the degenerative pole of the
    same PDE6C spectrum.
  subtype_term:

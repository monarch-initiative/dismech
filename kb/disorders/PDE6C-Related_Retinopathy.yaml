name: PDE6C-Related Retinopathy
creation_date: "2026-11-02T00:00:00Z"
category: Mendelian
description: >-
  PDE6C-related retinopathy is an autosomal recessive cone photoreceptor
  disorder caused by biallelic pathogenic variants in PDE6C, which encodes the
  catalytic alpha-prime subunit of the cone-specific cGMP phosphodiesterase 6.
  In the light response, activated cone transducin stimulates PDE6 to hydrolyse
  cGMP to 5'-GMP, lowering outer-segment cGMP and closing the cyclic
  nucleotide-gated channels. Loss of PDE6C catalytic activity leaves cone cGMP
  (and, through the open CNG channels, Ca2+) chronically elevated, so the cone
  cannot generate a normal light response and the same second messengers become
  cytotoxic. The phenotype is a clinical spectrum from complete/incomplete
  achromatopsia (ACHM5) to progressive early-onset cone and cone-rod dystrophy
  (cone dystrophy 4), distinguished largely by the rate of structural cone loss.
  This entry captures the PDE6C-specific gene-disease mechanism and spectrum;
  Achromatopsia.yaml models the ACHM5 subtype within the broader achromatopsia
  umbrella and should be consulted for cross-gene comparison within that
  phenotype.
synonyms:
- achromatopsia 5
- cone dystrophy 4
- PDE6C-related cone dystrophy
- PDE6C-related cone-rod dystrophy
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  PDE6C is the cone-specific catalytic subunit of PDE6; it is the direct cone
  counterpart of the rod catalytic subunits PDE6A and PDE6B. Because loss of
  PDE6C catalytic activity parks cone cGMP high rather than merely silencing the
  response, this gene sits on the degenerative side of the phototransduction
  spectrum, which is why its phenotype spans stationary achromatopsia through
  progressive cone/cone-rod dystrophy depending on residual activity. The
  PDE6C-specific phenotype statements below are restricted to gene-specific
  sources (the ClinGen Retina GCEP curation and the PDE6C gene-discovery cohort)
  rather than generic achromatopsia descriptions.
disease_term:
  preferred_term: PDE6C-related retinopathy
  term:
    id: MONDO:1040028
    label: PDE6C-related retinopathy
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PDE6C-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in PDE6C.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: >-
      Identifies biallelic (homozygous and compound heterozygous) PDE6C variants
      in affected individuals, establishing recessive inheritance.
has_subtypes:
- name: ACHM5
  display_name: Achromatopsia 5 (PDE6C)
  description: >-
    Complete or incomplete achromatopsia from biallelic PDE6C variants: a
    congenital, largely stationary loss of cone function with severe colour
    vision defect, reduced acuity, photophobia and nystagmus.
  subtype_term:
    preferred_term: achromatopsia 5
    term:
      id: MONDO:0800196
      label: achromatopsia 5
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: Establishes the complete-achromatopsia pole of the PDE6C spectrum.
- name: Cone Dystrophy 4
  display_name: Cone Dystrophy 4 (PDE6C)
  description: >-
    Progressive early-onset autosomal recessive cone (or cone-rod) dystrophy
    from biallelic PDE6C variants, with loss of visual acuity over decades and
    structural cone loss on imaging, representing the degenerative pole of the
    same PDE6C spectrum.
  subtype_term:
    preferred_term: cone dystrophy 4
    term:
      id: MONDO:0013129
      label: cone dystrophy 4
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings identify PDE6C as a gene for cone photoreceptor disorders and show that arCD and ACHM constitute genetically and clinically overlapping phenotypes."
    explanation: >-
      Establishes autosomal recessive cone dystrophy as the second, overlapping
      pole of the PDE6C phenotypic spectrum.
pathophysiology:
- name: PDE6C Catalytic Deficiency
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >-
    Biallelic PDE6C variants abolish or reduce the catalytic activity of the
    cone-specific alpha-prime subunit of cGMP phosphodiesterase 6. PDE6 is the
    effector that hydrolyses cGMP to 5'-GMP during the cone light response, so a
    catalytic-subunit lesion is the initiating, cone-autonomous defect in the
    phototransduction cascade.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PDE6C
    term:
      id: hgnc:8787
      label: PDE6C
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Elevated Cone cGMP and Calcium Overload
    causal_link_type: DIRECT
    description: Loss of cGMP hydrolysis leaves cone cGMP and Ca2+ chronically elevated.
    evidence:
    - reference: PMID:19615668
      reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP) phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone phototransduction."
      explanation: >-
        Establishes the catalytic reaction PDE6C performs, so loss of that
        activity directly leaves cGMP un-hydrolysed.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP) phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone phototransduction."
    explanation: Defines PDE6C as the cone PDE6 catalytic subunit and its essential role in cone phototransduction.
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be loss of function in PDE6C"
    explanation: ClinGen Retina GCEP records loss of function as the disease mechanism.
  - reference: PMID:21127010
    reference_title: "Decreased catalytic activity and altered activation properties of PDE6C mutants associated with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Four of the six PDE6C missense mutations led to baseline PDE activities and most likely represent functional null alleles."
    explanation: >-
      Recombinant expression shows disease-associated PDE6C missense alleles
      abolish catalytic activity, confirming the loss-of-function mechanism
      biochemically.
- name: Elevated Cone cGMP and Calcium Overload
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  description: >-
    Without PDE6C-mediated hydrolysis, cone outer-segment cGMP stays elevated and
    the cyclic nucleotide-gated channels stay open, sustaining depolarising
    Na+/Ca2+ influx. The outer segment loses the cGMP and Ca2+ set point that the
    light response normally modulates.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: cGMP catabolic process
    term:
      id: GO:0046069
      label: cGMP catabolic process
    modifier: DECREASED
  downstream:
  - target: Failure of the Cone Light Response
    causal_link_type: DIRECT
  - target: Progressive Cone Photoreceptor Degeneration
    causal_link_type: DIRECT
    description: Chronically elevated cGMP and Ca2+ are cytotoxic to cones.
    evidence:
    - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
      reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These models also collectively exhibit progressive thinning of the outer nuclear layer and photoreceptor outer segments within the macula, caused by rapid and progressive loss of cone photoreceptors"
      explanation: >-
        Animal models of PDE6C loss show the chronic cGMP/Ca2+ state proceeds to
        progressive cone death.
- name: Failure of the Cone Light Response
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >-
    With the cascade unable to lower cGMP, the cone cannot translate absorbed
    photons into the graded hyperpolarisation that signals light. Cone-driven
    (photopic) light responses are reduced or abolished while rod-driven
    (scotopic) responses are preserved, the electrophysiological signature of a
    cone-autonomous cascade defect.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: detection of light stimulus involved in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  downstream:
  - target: Color vision defect
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT
  - target: Photophobia
    causal_link_type: DIRECT
  - target: Nystagmus
    causal_link_type: DIRECT
  - target: Abnormal cone electroretinogram
    causal_link_type: DIRECT
  evidence:
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reduced or absent cone/photopic ERG responses, normal rod/scotopic ERG responses"
    explanation: >-
      Documents the selective loss of cone-driven light responses with preserved
      rod responses that defines this cone-cascade failure.
- name: Progressive Cone Photoreceptor Degeneration
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  description: >-
    In the degenerative pole of the spectrum, chronically elevated cGMP and Ca2+
    drive progressive death of cone photoreceptors, with thinning of the outer
    nuclear layer and loss of outer-segment structure most marked in the macula.
    This is the cone-dystrophy (cone dystrophy 4) end of the PDE6C spectrum, and
    is more pronounced in complete achromatopsia than in early-onset cone
    dystrophy.
  role: consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  downstream:
  - target: Macular dystrophy
    causal_link_type: DIRECT
  - target: Central scotoma
    causal_link_type: DIRECT
    description: Macular cone loss produces a central scotoma.
  - target: Cone/cone-rod dystrophy
    causal_link_type: DIRECT
  - target: Constriction of peripheral visual field
    causal_link_type: DIRECT
    description: In the cone-rod end of the spectrum, rod involvement constricts the visual field.
  - target: Nyctalopia
    causal_link_type: DIRECT
    description: Rod involvement in PDE6C-related cone-rod dystrophy produces night blindness.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-sectional retinal imaging via optical coherence tomography revealed a more pronounced absence of cone photoreceptors in patients with ACHM compared to patients with early-onset arCD."
    explanation: >-
      Documents structural cone loss on OCT and its gradient across the PDE6C
      phenotypic spectrum.
  - reference: PMID:39641747
    reference_title: "Onset and Progression of Disease in Nonhuman Primates With PDE6C Cone Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cone photoreceptors probably degenerate over time and macular atrophy can occur."
    explanation: >-
      A naturally occurring PDE6C-mutant rhesus macaque model shows progressive
      cone degeneration with macular atrophy, supporting the degenerative pole.

    snippet: "The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP) phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone phototransduction."
    explanation: Defines PDE6C as the cone PDE6 catalytic subunit and its essential role in cone phototransduction (stated as established background in the gene-discovery paper).
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be loss of function in PDE6C"
    explanation: ClinGen Retina GCEP records loss of function as the disease mechanism.
  - reference: PMID:21127010
    reference_title: "Decreased catalytic activity and altered activation properties of PDE6C mutants associated with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Four of the six PDE6C missense mutations led to baseline PDE activities and most likely represent functional null alleles."
    explanation: >-
      Recombinant expression shows disease-associated PDE6C missense alleles
      abolish catalytic activity, confirming the loss-of-function mechanism
      biochemically.
- name: Elevated Cone cGMP and Calcium Overload
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  description: >-
    Without PDE6C-mediated hydrolysis, cone outer-segment cGMP stays elevated and
    the cyclic nucleotide-gated channels stay open, sustaining depolarising
    Na+/Ca2+ influx. The outer segment loses the cGMP and Ca2+ set point that the
    light response normally modulates.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: cGMP catabolic process
    term:
      id: GO:0046069
      label: cGMP catabolic process
    modifier: DECREASED
  downstream:
  - target: Failure of the Cone Light Response
    causal_link_type: DIRECT
    description: >-
      With cGMP held high the CNG channels cannot close on illumination, so the
      cone generates no light-evoked hyperpolarisation.
  - target: Progressive Cone Photoreceptor Degeneration
    causal_link_type: DIRECT
    description: Chronically elevated cGMP and Ca2+ are cytotoxic to cones.
    evidence:
    - reference: PMID:20593360
      reference_title: "cGMP-dependent cone photoreceptor degeneration in the cpfl1 mouse retina."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "cpfl1 cone photoreceptor cell death was associated with an accumulation of cyclic guanosine monophosphate (cGMP), activity of calpains, and phosphorylation of vasodilator-stimulated protein (VASP)."
      explanation: >-
        The PDE6C (cpfl1) mouse directly ties cone cGMP accumulation to cone
        photoreceptor death, grounding this edge in primary data.
    - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
      reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These models also collectively exhibit progressive thinning of the outer nuclear layer and photoreceptor outer segments within the macula, caused by rapid and progressive loss of cone photoreceptors"
      explanation: >-
        Animal models of PDE6C loss show the chronic cGMP/Ca2+ state proceeds to
        progressive cone death.
- name: Failure of the Cone Light Response
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >-
    With the cascade unable to lower cGMP, the cone cannot translate absorbed
    photons into the graded hyperpolarisation that signals light. Cone-driven
    (photopic) light responses are reduced or abolished while rod-driven
    (scotopic) responses are preserved, the electrophysiological signature of a
    cone-autonomous cascade defect.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: detection of light stimulus involved in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  downstream:
  - target: Color vision defect
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT
  - target: Photophobia
    causal_link_type: DIRECT
  - target: Nystagmus
    causal_link_type: DIRECT
  - target: Abnormal cone electroretinogram
    causal_link_type: DIRECT
  evidence:
  - reference: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
    reference_title: "PDE6C / PDE6C-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reduced or absent cone/photopic ERG responses, normal rod/scotopic ERG responses"
    explanation: >-
      Documents the selective loss of cone-driven light responses with preserved
      rod responses that defines this cone-cascade failure.
- name: Progressive Cone Photoreceptor Degeneration
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  description: >-
    In the degenerative pole of the spectrum, chronically elevated cGMP and Ca2+
    drive progressive death of cone photoreceptors, with thinning of the outer
    nuclear layer and loss of outer-segment structure most marked in the macula.
    This is the cone-dystrophy (cone dystrophy 4) end of the PDE6C spectrum, and
    is more pronounced in complete achromatopsia than in early-onset cone
    dystrophy.
  role: consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  downstream:
  - target: Macular dystrophy
    causal_link_type: DIRECT
  - target: Central scotoma
    causal_link_type: DIRECT
    description: Macular cone loss produces a central scotoma.
  - target: Cone/cone-rod dystrophy
    causal_link_type: DIRECT
  - target: Constriction of peripheral visual field
    causal_link_type: DIRECT
    description: In the cone-rod end of the spectrum, rod involvement constricts the visual field.
  - target: Nyctalopia
    causal_link_type: DIRECT
    description: Rod involvement in PDE6C-related cone-rod dystrophy produces night blindness.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-sectional retinal imaging via optical coherence tomography revealed a more pronounced absence of cone photoreceptors in patients with ACHM compared to patients with early-onset arCD."
    explanation: >-
      Documents structural cone loss on OCT and its gradient across the PDE6C
      phenotypic spectrum.
  - reference: PMID:39641747
    reference_title: "Onset and Progression of Disease in Nonhuman Primates With PDE6C Cone Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cone photoreceptors probably degenerate over time and macular atrophy can occur."
    explanation: >-
      A naturally occurring PDE6C-mutant rhesus macaque model shows progressive
      cone degeneration with macular atrophy, supporting the degenerative pole.

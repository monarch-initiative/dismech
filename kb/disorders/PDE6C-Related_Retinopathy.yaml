genetic:
- name: PDE6C
  gene_term:
    preferred_term: PDE6C
    term:
      id: hgnc:8787
      label: PDE6C
  relationship_type: CAUSATIVE
  features: >-
    Biallelic PDE6C variants reported to date include missense, nonsense,
    frameshift and splice-site changes; the gene-discovery cohort reported the
    homozygous missense alleles p.R29W and p.Y323N and a compound-heterozygous
    missense allele p.M455V. The mechanism of pathogenicity is loss of PDE6C
    catalytic function.
  gene_disease_validity:

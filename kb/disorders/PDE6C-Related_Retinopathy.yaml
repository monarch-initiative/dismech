      explanation: Reports the p.R29W homozygous missense allele.
  - name: p.Y323N
    description: Homozygous missense allele reported in one of two sibling pairs (early-onset arCD and incomplete ACHM); recombinant p.Y323N retains only ~20% of wild-type PDE activity.
    evidence:

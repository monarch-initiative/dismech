  description: >-
    PDE6C-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in PDE6C.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of 104 probands with arCD and 10 probands with ACHM revealed compound heterozygous PDE6C mutations in three complete ACHM patients from two families."
    explanation: >-
      Identifies biallelic (homozygous and compound heterozygous) PDE6C variants
      in affected individuals, establishing recessive inheritance.
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews states the autosomal recessive recurrence risks that underlie
      genetic counseling for this disease.

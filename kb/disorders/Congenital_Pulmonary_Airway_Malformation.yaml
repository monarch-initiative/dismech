progression:
- phase: Onset
  age_range: Fetal lung branching morphogenesis; typically detected on antenatal ultrasound at 18 to 22 weeks of gestation
  notes: >-
    CPAM arises from a continuum of developmental disturbances across stages of
    fetal lung branching morphogenesis and is most commonly diagnosed on
    prenatal ultrasound between 18 and 22 weeks of gestation.
  evidence:
  - reference: PMID:40473982
    reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of mixed-type patterns supports the hypothesis that CPAM represents a continuum of developmental disturbances occurring at various stages of lung branching morphogenesis."
    explanation: Supports developmental onset of CPAM during fetal lung branching morphogenesis.
  - reference: PMID:41545807
    reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Most CPAM can be diagnosed between 18 and 22 weeks of gestation [4]."
    explanation: Background synthesis in this fetal series establishes 18 to 22 weeks of gestation as the typical prenatal diagnostic window for CPAM.
pathophysiology:
- name: Disordered Airway Branching Morphogenesis
  description: >
    CPAM arises from a localized disruption of airway branching
    morphogenesis during fetal lung development, producing a hamartomatous
    overgrowth of terminal bronchiolar/airway structures with cystic
    dilatation. The presumed level of the tracheobronchial tree at which
    the developmental insult occurs underlies the Stocker subtype histology,
    and mixed type-1/type-2 patterns support a continuum model.

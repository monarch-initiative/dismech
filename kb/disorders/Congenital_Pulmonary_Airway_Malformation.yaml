  description: >
    Symptomatic neonates present with respiratory distress driven by mass
    effect of large lesions on adjacent lung and mediastinum.
  phenotype_term:
    preferred_term: Respiratory distress
    term:
      id: HP:0002098
      label: Respiratory distress
  evidence:
  - reference: PMID:34980466
    reference_title: "Neonatal congenital pulmonary airway malformation associated with mucinous adenocarcinoma and KRAS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 infants, all males, had undergone surgical resection for respiratory distress (at 3, 4 and 8 days of life)"
    explanation: Neonatal respiratory distress is the indication for early surgical resection in this case series.
- name: Recurrent Respiratory Infections
  description: >
    A common postnatal presentation, especially in older infants and
    children with previously undiagnosed lesions, is recurrent pulmonary
    infection localized to the affected lobe.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:40174959
    reference_title: "Risk of malignant transformation and infections in congenital lung malformations in adults: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pneumonia was the most common symptom in congenital pulmonary airway malformation (CPAM) and intralobar sequestration, with over 30% of these patients experiencing recurrent respiratory infections."
    explanation: Over 30% of adults with previously undiagnosed CPAM experience recurrent respiratory infections, supporting recurrent infection as a major phenotype.
- name: Pneumothorax
  description: Spontaneous pneumothorax can complicate cystic CPAM lesions.
  phenotype_term:
    preferred_term: Pneumothorax
    term:
      id: HP:0002107
      label: Pneumothorax
  evidence:
  - reference: PMID:37919294
    reference_title: "Congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resection, either thoracoscopically or through thoracotomy, minimizes the risk of local morbidity, including recurrent infections and pneumothorax, and avoids the risk of malignancies that have been associated with CPAM, bronchopulmonary sequestration and bronchogenic cyst."
    explanation: Pneumothorax is a recognized postnatal complication of CPAM lesions.
- name: Hydrops Fetalis
  description: >
    Large lesions can cause mediastinal shift and cardiac compression,
    producing fetal hydrops, which is the principal indication for fetal
    intervention.
  phenotype_term:
    preferred_term: Hydrops fetalis
    term:
      id: HP:0001789
      label: Hydrops fetalis
  evidence:
  - reference: PMID:41557046
    reference_title: "Fetal thoracoamniotic shunting for severe macrocystic congenital pulmonary airway malformation with the Somatex(®) intrauterine shunt: intrauterine course and postnatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal hydrops prior to TAS (ascites and fetal scalp oedema) was present in 36% (9/25)."
    explanation: Fetal hydrops is documented in a substantial fraction of severe macrocystic CPAM cases treated with thoracoamniotic shunting.
- name: Pulmonary Cyst
  description: Cystic pulmonary lesion(s) are the defining radiographic and histopathologic feature of CPAM.
  phenotype_term:
    preferred_term: Pulmonary cyst
    term:
      id: HP:0032445
      label: Pulmonary cyst
  evidence:
  - reference: PMID:42012654
    reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "benign congenital lung malformations such as congenital pulmonary airway malformation (CPAM, formerly congenital cystic adenomatoid malformation or CCAM)"
    explanation: CPAM is classified among cystic congenital lung malformations.
histopathology:
- name: Mucinous Cell Clusters in Type 1 CPAM
  description: >
    Foci of mucinous cell clusters within otherwise non-mucinous CPAM
    epithelium are a recognized histologic finding, particularly in type 1
    lesions, and harbor KRAS mutations identical to those in adjacent
    non-mucinous areas.
  finding_term:
    preferred_term: mucinous cell clusters in CPAM epithelium
  evidence:
  - reference: PMID:40473982
    reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Possible findings are foci of mucinous cell clusters (MCCs), harboring KRAS mutations."
    explanation: Mucinous cell clusters with KRAS mutations are a recognized histologic finding in CPAM.
- name: Mixed Type 1 and Type 2 Patterns
  description: >
    A substantial subset of CPAM lesions show mixed type 1 and type 2
    histologic patterns within the same specimen, supporting a continuum
    model of developmental disturbance rather than discrete subtypes.
  finding_term:
    preferred_term: mixed Stocker type 1 and type 2 histologic pattern
  evidence:
  - reference: PMID:40473982
    reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mixed pattern of types 1 and 2 was observed in 22%."
    explanation: Mixed type 1/2 histology is present in roughly one-fifth of CPAM specimens in a 46-case series.
- name: CK7/TTF-1 Positive Epithelium
  description: >
    The epithelial lining of CPAM is consistently positive for CK7 and
    TTF-1, with variable expression of Napsin A, surfactant protein A,
    p40, CK5/6, and CK20 by subtype.
  finding_term:
    preferred_term: CK7 and TTF-1 positive respiratory epithelium
  evidence:
  - reference: PMID:40473982
    reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epithelial lining was strongly positive for CK7 and TTF-1 in all samples."
    explanation: Uniform CK7/TTF-1 positivity defines the lung-epithelial origin of CPAM lining.
treatments:
- name: Anatomic Lobectomy
  description: >
    Anatomic lobectomy is the most common definitive surgical treatment
    for CPAM in U.S. pediatric practice, used in approximately 88% of
    resections, and is increasingly performed via video-assisted
    thoracoscopic surgery (VATS), which is associated with shorter
    hospital stay and lower 30-day complication rates than open lobectomy.
  treatment_term:
    preferred_term: lobectomy
    term:
      id: NCIT:C15272
      label: Lobectomy
  target_mechanisms:
  - target: Disordered Airway Branching Morphogenesis
    description: >-
      Anatomic lobectomy removes the malformed cystic pulmonary lobe, preventing
      recurrent infection and pneumothorax.
    evidence:
    - reference: PMID:37919294
      reference_title: "Congenital lung malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resection, either thoracoscopically or through thoracotomy, minimizes the risk of local morbidity, including recurrent infections and pneumothorax, and avoids the risk of malignancies that have been associated with CPAM, bronchopulmonary sequestration and bronchogenic cyst."
      explanation: Surgical resection removes the malformed lung tissue to prevent local complications and malignant transformation.
  - target: Progression to Mucinous Adenocarcinoma
    description: >-
      Surgical resection eliminates the risk of malignant progression of CPAM
      epithelium to mucinous adenocarcinoma.
    evidence:
    - reference: PMID:37919294
      reference_title: "Congenital lung malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resection, either thoracoscopically or through thoracotomy, minimizes the risk of local morbidity, including recurrent infections and pneumothorax, and avoids the risk of malignancies that have been associated with CPAM, bronchopulmonary sequestration and bronchogenic cyst."
      explanation: Definitive resection removes the lesion and prevents CPAM-associated malignancy.
  evidence:
  - reference: PMID:41945161
    reference_title: "Lobectomy vs. sublobar resection for congenital pulmonary airway malformations: a 10-year NSQIP-pediatric review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lobectomy (n = 1,865; 88%) was performed far more often than sublobar resection (n = 245; 12%)"
    explanation: Lobectomy was the predominant resection approach in a 10-year U.S. NSQIP-Pediatric review.
  - reference: PMID:41945161
    reference_title: "Lobectomy vs. sublobar resection for congenital pulmonary airway malformations: a 10-year NSQIP-pediatric review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VATS was utilized more often than open surgery for both lobectomy (57.8%) and sublobar resections (54.7%) and was associated with lower 30-day complication rates (OR 0.58, p < 0.01) and total hospital length of stay (-1.48 days, p < 0.0001) after lobectomy."
    explanation: VATS is the predominant approach for pediatric CPAM lobectomy and is associated with reduced complications and shorter hospital stays.
- name: Sublobar Resection (Segmentectomy or Wedge)
  description: >
    Sublobar resection (anatomic segmentectomy or wedge resection) is a
    lung-sparing alternative to lobectomy for selected CPAM lesions.
    Anatomic segmentectomy is associated with fewer 30-day complications
    than lobectomy in large registry data.
  treatment_term:
    preferred_term: pulmonary segmentectomy
    term:
      id: NCIT:C91061
      label: Segmentectomy
  target_mechanisms:
  - target: Disordered Airway Branching Morphogenesis
    description: >-
      Lung-sparing sublobar resection excises the localized malformed airway
      segment while preserving uninvolved lung parenchyma.
    evidence:
    - reference: PMID:41945161
      reference_title: "Lobectomy vs. sublobar resection for congenital pulmonary airway malformations: a 10-year NSQIP-pediatric review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Segmentectomy was associated with significantly fewer 30-day complications compared to lobectomy (OR 0.08, p < 0.0001)"
      explanation: Segmentectomy resects the malformed pulmonary segment with lower 30-day complication rates than lobectomy.
  evidence:
  - reference: PMID:41945161
    reference_title: "Lobectomy vs. sublobar resection for congenital pulmonary airway malformations: a 10-year NSQIP-pediatric review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segmentectomy was associated with significantly fewer 30-day complications compared to lobectomy (OR 0.08, p < 0.0001)"
    explanation: Anatomic segmentectomy is associated with fewer 30-day complications than lobectomy in pediatric CPAM resection.
- name: Expectant (Conservative) Management
  description: >
    For asymptomatic, antenatally-diagnosed CPAMs, contemporary evidence
    supports observational management with serial imaging in selected
    patients, with low rates of serious adverse outcomes and no reported
    malignancy in medium-term follow-up.
  treatment_term:
    preferred_term: watchful waiting
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41643769
    reference_title: "The Safety of Conservative Management of Asymptomatic Congenital Pulmonary Airway Malformations (CPAMs) in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In asymptomatic patients with mainly antenatally diagnosed lesions, conservative management of CPAM lesions was associated with a complication rate and no reported cases of mortality or malignancy."
    explanation: A 298-patient systematic review supports the safety of conservative management of asymptomatic CPAM with medium-term follow-up.
  - reference: PMID:41643769
    reference_title: "The Safety of Conservative Management of Asymptomatic Congenital Pulmonary Airway Malformations (CPAMs) in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 58 patients (20%) eventually underwent surgical resection due to complications, lesion progression, or parental preference."
    explanation: Approximately 20% of conservatively managed asymptomatic CPAM patients ultimately undergo resection.
- name: Fetal Thoracoamniotic Shunting
  description: >
    Thoracoamniotic shunting (TAS) is the standard fetal intervention for
    severe macrocystic CPAM, particularly when complicated by fetal
    hydrops. TAS achieves resolution of hydrops and lesion regression in
    the great majority of treated fetuses.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Intrathoracic Mass Effect
    description: >-
      Intrauterine thoracoamniotic shunting drains dominant macrocysts to
      decompress intrathoracic mass effect.
    evidence:
    - reference: PMID:41557046
      reference_title: "Fetal thoracoamniotic shunting for severe macrocystic congenital pulmonary airway malformation with the Somatex(®) intrauterine shunt: intrauterine course and postnatal outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resolution of hydrops and regression of the lesion occurred in 96% (24/25)."
      explanation: Thoracoamniotic shunting induces lesion regression and relieves intrathoracic mass effect.
  - target: Fetal Hydrops from Cardiac Compression
    description: >-
      Decompression of macrocystic CPAM via thoracoamniotic shunting relieves
      cardiac compression and resolves fetal hydrops.
    evidence:
    - reference: PMID:41557046
      reference_title: "Fetal thoracoamniotic shunting for severe macrocystic congenital pulmonary airway malformation with the Somatex(®) intrauterine shunt: intrauterine course and postnatal outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resolution of hydrops and regression of the lesion occurred in 96% (24/25)."
      explanation: Thoracoamniotic shunting resolves fetal hydrops in 96% of severe macrocystic CPAM cases.
  evidence:
  - reference: PMID:41557046
    reference_title: "Fetal thoracoamniotic shunting for severe macrocystic congenital pulmonary airway malformation with the Somatex(®) intrauterine shunt: intrauterine course and postnatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resolution of hydrops and regression of the lesion occurred in 96% (24/25)."
    explanation: TAS achieved resolution of hydrops and lesion regression in 96% of treated severe macrocystic CPAM fetuses.
- name: Fetal Radiofrequency Ablation
  description: >
    For microcystic CPAM complicated by fetal hydrops and refractory to
    maternal steroid therapy, ultrasound-guided radiofrequency ablation
    (RFA) is described as a salvage intrauterine intervention, though it
    carries a meaningful risk of intrauterine fetal demise.
  treatment_term:
    preferred_term: radiofrequency ablation
    term:
      id: NCIT:C15666
      label: Radiofrequency Ablation
  target_mechanisms:
  - target: Intrathoracic Mass Effect
    description: >-
      Ultrasound-guided radiofrequency ablation coagulates the feeding vessels
      and parenchyma of giant microcystic CPAMs to reduce mass effect.
    evidence:
    - reference: PMID:41545807
      reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For microcystic CPAM complicated with fetal hydrops and refractory to maternal conservative steroid administration, ultrasound-guided RFA serves as an effective salvage option for intrauterine treatment."
      explanation: Radiofrequency ablation targets giant steroid-refractory microcystic CPAMs complicated by hydrops.
  - target: Fetal Hydrops from Cardiac Compression
    description: >-
      By debulking giant microcystic CPAM lesions, salvage fetal radiofrequency
      ablation reverses cardiac compression and fetal hydrops.
    evidence:
    - reference: PMID:41545807
      reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For microcystic CPAM complicated with fetal hydrops and refractory to maternal conservative steroid administration, ultrasound-guided RFA serves as an effective salvage option for intrauterine treatment."
      explanation: Salvage intrauterine RFA treats fetal hydrops secondary to giant microcystic CPAM.
  evidence:
  - reference: PMID:41545807
    reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For microcystic CPAM complicated with fetal hydrops and refractory to maternal conservative steroid administration, ultrasound-guided RFA serves as an effective salvage option for intrauterine treatment."
    explanation: Ultrasound-guided RFA is described as a salvage option for microcystic CPAM complicated by fetal hydrops refractory to steroids.
- name: Maternal Antenatal Corticosteroids
  description: >
    Maternal corticosteroid administration is used as conservative medical
    therapy for microcystic CPAM lesions and can reduce mortality, although
    giant lesions complicated by fetal hydrops frequently demonstrate steroid
    refractoriness and require salvage intrauterine intervention.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Intrathoracic Mass Effect
    description: >-
      Maternal antenatal corticosteroids are used as conservative therapy in
      microcystic CPAM to reduce mortality, though giant lesions complicated by
      hydrops are frequently steroid-refractory.
    evidence:
    - reference: PMID:41545807
      reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Although steroids can reduce mortality in microcystic CPAM, giant CLMs complicated by hydrops frequently demonstrate steroid refractoriness."
      explanation: Background statement in an RFA case series noting that maternal corticosteroids can reduce mortality in microcystic CPAM, while giant lesions with hydrops are frequently refractory.
  - target: Fetal Hydrops from Cardiac Compression
    description: >-
      Maternal antenatal steroids are administered as initial conservative
      therapy to reduce mortality in microcystic CPAM complicated by fetal
      hydrops, though giant hydropic lesions frequently demonstrate steroid
      refractoriness.
    evidence:
    - reference: PMID:41545807
      reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Although steroids can reduce mortality in microcystic CPAM, giant CLMs complicated by hydrops frequently demonstrate steroid refractoriness."
      explanation: Background statement in an RFA case series noting that maternal steroids can reduce mortality in microcystic CPAM, while giant lesions complicated by fetal hydrops are often steroid-refractory.
  evidence:
  - reference: PMID:41545807
    reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Although steroids can reduce mortality in microcystic CPAM, giant CLMs complicated by hydrops frequently demonstrate steroid refractoriness."
    explanation: Background synthesis in this fetal series notes that maternal steroids can reduce mortality in microcystic CPAM, though giant hydropic lesions are frequently refractory.
  - reference: PMID:41545807
    reference_title: "Radiofrequency ablation for giant congenital lung malformations complicated by fetal hydrops: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases received two courses of maternal steroid before the RFA procedure."
    explanation: Maternal steroid courses were administered as initial conservative therapy prior to salvage RFA in this referral series.
diagnosis:
- name: Antenatal Ultrasound
  description: >-
    Prenatal obstetric ultrasonography is the primary screening and diagnostic
    modality that detects congenital lung malformations including CPAM in utero.
  diagnosis_term:
    preferred_term: prenatal ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:37919294
    reference_title: "Congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLMs are typically diagnosed with antenatal ultrasonography and confirmed by chest CT angiography in the first few months of life."
    explanation: Establishes antenatal ultrasonography as the primary prenatal diagnostic modality for congenital lung malformations including CPAM.
- name: Postnatal Chest Computed Tomography Angiography
  description: >-
    Postnatal chest computed tomography angiography (CTA) in the first few
    months of life confirms and delineates cystic lung anatomy, assesses lesion
    extent and vascular supply, and guides surgical planning.
  diagnosis_term:
    preferred_term: chest computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  evidence:
  - reference: PMID:37919294
    reference_title: "Congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLMs are typically diagnosed with antenatal ultrasonography and confirmed by chest CT angiography in the first few months of life."
    explanation: Confirms postnatal chest CT angiography in early infancy as the standard confirmatory diagnostic imaging test.
- name: Histopathologic and Molecular Genetic Evaluation (KRAS / DICER1)
  description: >-
    Definitive subtype classification and exclusion of cystic (type I)
    pleuropulmonary blastoma require histopathologic examination of resected
    tissue combined with molecular genetic testing (particularly DICER1
    mutation testing).
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42012654
    reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article highlights the role of imaging modalities (computed tomography, magnetic resonance imaging, including ultrashort echo time sequences), as well as histopathology and genetics-especially DICER1 mutation-in the diagnosis and therapeutic decision-making of pleuropulmonary blastoma."
    explanation: Demonstrates the essential diagnostic role of histopathology and DICER1 genetic testing in differentiating cystic PPB from CPAM.
differential_diagnoses:
- name: Pleuropulmonary Blastoma
  disease_term:
    preferred_term: pleuropulmonary blastoma
    term:
      id: MONDO:0011014
      label: pleuropulmonary blastoma
  description: >-
    Purely cystic (type I) pleuropulmonary blastoma (formerly classified as
    CPAM type 4) closely mimics macrocystic CPAM on prenatal and postnatal
    imaging but is a malignant DICER1-associated mesenchymal neoplasm with
    potential to progress to high-grade type II or III sarcoma.
  distinguishing_features:
  - Presence of germline and/or somatic hotspot DICER1 mutations (present in 70-80% of PPB cases) rather than somatic KRAS or FGFR2 mutations.
  - Solid tumor components in types II and III, whereas purely cystic type I requires histopathology and DICER1 genetic analysis to distinguish from CPAM.
  evidence:
  - reference: PMID:42012654
    reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While types II and III are usually identifiable on imaging due to their solid tumor components, the purely cystic type I represents a particular diagnostic challenge. In imaging, it is often difficult to distinguish from benign congenital lung malformations such as congenital pulmonary airway malformation (CPAM, formerly congenital cystic adenomatoid malformation or CCAM), sequestration, or bronchogenic cyst."
    explanation: Establishes cystic type I pleuropulmonary blastoma as the most critical differential diagnosis of CPAM.
- name: Congenital Pulmonary Sequestration
  disease_term:
    preferred_term: congenital pulmonary sequestration
    term:
      id: MONDO:0017843
      label: congenital pulmonary sequestration
  description: >-
    Congenital lung malformation that can be difficult to distinguish from CPAM
    on imaging; extralobar sequestration shares similar or identical pathologic
    features with CPAM type 2, with both linked to bronchial atresia.
  distinguishing_features:
  - Evaluated alongside CPAM by postnatal chest CT angiography and histopathology as a distinct congenital lung malformation entity.
  evidence:
  - reference: PMID:42012654
    reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In imaging, it is often difficult to distinguish from benign congenital lung malformations such as congenital pulmonary airway malformation (CPAM, formerly congenital cystic adenomatoid malformation or CCAM), sequestration, or bronchogenic cyst."
    explanation: Lists pulmonary sequestration alongside CPAM among congenital lung malformations that overlap on imaging.
  - reference: PMID:37334833
    reference_title: "Congenital Pulmonary Airway Malformations With a Reconsideration and Current Perspective on the Stocker Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CPAM type 2 is an acquired lesion resulting from interruption in lung development secondary to bronchial atresia. The latter is also regarded as the etiology of EIS whose pathologic features are similar, if not identical, to CPAM type 2."
    explanation: Documents the close pathologic and etiologic overlap between extralobar sequestration and CPAM type 2 secondary to bronchial atresia.
genetic:
- name: DICER1 germline variants (former CPAM type 4 / cystic PPB overlap)
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  variant_origin: GERMLINE
  association: Pathogenic Variants
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:42012654
      reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By contrast, pleuropulmonary blastoma is associated with germline mutations within the DICER1 gene in approximately 70–80% of cases. These represent the first “hit,” resulting in monoallelic loss of function. A subsequent somatic “second hit,” often a hotspot mutation in the RNase IIIb domain, leads to biallelic inactivation and tumorigenesis. This two-hit model forms the basis of DICER1 tumor predisposition syndrome, with pleuropulmonary blastoma being its hallmark neoplasm."
      explanation: Confirms autosomal dominant germline DICER1 predisposition with a somatic second hit in cystic pleuropulmonary blastoma (former CPAM type 4).
  notes: >
    Germline DICER1 pathogenic variants define DICER1 tumor predisposition
    syndrome and underlie cystic (type I) pleuropulmonary blastoma, which
    overlaps clinically and radiographically with former CPAM type 4.
    Distinguishing PPB from CPAM is critical for oncologic management and
    DICER1 surveillance.
  evidence:
  - reference: PMID:37334833
    reference_title: "Congenital Pulmonary Airway Malformations With a Reconsideration and Current Perspective on the Stocker Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "germline variants in congenital acinar dysplasia, formerly CPAM type 0, and pleuropulmonary blastoma (PPB), type I, formerly CPAM type 4"
    explanation: The Stocker reconsideration links germline variants to former CPAM types 0 and 4 (the PPB type I overlap).
  - reference: PMID:42012654
    reference_title: "Pleuropulmonary blastoma and the challenge of distinguishing the cystic form (type I) from other congenital lung malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histopathology and genetics-especially DICER1 mutation-in the diagnosis and therapeutic decision-making of pleuropulmonary blastoma."
    explanation: DICER1 mutation analysis is central to distinguishing PPB from benign cystic congenital lung malformations including CPAM.
- name: Somatic KRAS mosaic variants (CPAM types 1 and possibly 3)
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  variant_origin: SOMATIC
  association: Pathogenic Variants
  notes: >
    Somatic activating KRAS mutations (commonly G12D, G12V) are detected
    in CPAM types 1 and possibly 3, localized to mucinous cell clusters
    and adjacent non-mucinous epithelium, and are interpreted as a clonal
    precursor alteration for mucinous adenocarcinoma progression.
  evidence:
  - reference: PMID:37334833

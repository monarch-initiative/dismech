    evidence:
    - reference: PMID:40473982
      reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of mixed-type patterns supports the hypothesis that CPAM represents a continuum of developmental disturbances occurring at various stages of lung branching morphogenesis."
      explanation: Developmental disturbances across stages of lung branching morphogenesis directly produce CPAM lesions.
  - target: Pulmonary Cyst
    description: Cystic dilatation of disorganized terminal airway structures forms the characteristic pulmonary cysts.
    evidence:
    - reference: PMID:40473982
      reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of mixed-type patterns supports the hypothesis that CPAM represents a continuum of developmental disturbances occurring at various stages of lung branching morphogenesis."
      explanation: Disrupted airway branching morphogenesis produces the cystic pulmonary lesions characteristic of CPAM.
  - target: Recurrent Respiratory Infections
    description: Malformed cystic pulmonary airway structures carry an ongoing risk of local morbidity including recurrent pulmonary infections.
    evidence:
    - reference: PMID:37919294
      reference_title: "Congenital lung malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resection, either thoracoscopically or through thoracotomy, minimizes the risk of local morbidity, including recurrent infections and pneumothorax, and avoids the risk of malignancies that have been associated with CPAM, bronchopulmonary sequestration and bronchogenic cyst."
      explanation: Unresected congenital airway malformations carry an ongoing risk of local morbidity including recurrent respiratory infections.
  - target: Pneumothorax
    description: Rupture or air-trapping of malformed cystic airway spaces leads to pneumothorax.
    evidence:
    - reference: PMID:37919294
      reference_title: "Congenital lung malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resection, either thoracoscopically or through thoracotomy, minimizes the risk of local morbidity, including recurrent infections and pneumothorax, and avoids the risk of malignancies that have been associated with CPAM, bronchopulmonary sequestration and bronchogenic cyst."
      explanation: Pneumothorax is a recognized local complication of cystic congenital pulmonary airway malformations.
  evidence:
  - reference: PMID:37334833
    reference_title: "Congenital Pulmonary Airway Malformations With a Reconsideration and Current Perspective on the Stocker Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The developmental model of CPAM histogenesis by Stocker proposed perturbations designated as CPAM type 0 to type 4 without known or specific pathogenetic mechanisms along the airway from the bronchus to the alveolus."
    explanation: Stocker's developmental model frames CPAM as level-dependent perturbations along the developing airway.
  - reference: PMID:40473982
    reference_title: "Comprehensive morphological, immunohistochemical, and molecular characterization of congenital pulmonary airway malformation (CPAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of mixed-type patterns supports the hypothesis that CPAM represents a continuum of developmental disturbances occurring at various stages of lung branching morphogenesis."
    explanation: Mixed type-1/type-2 lesions in the same specimen support a developmental-continuum model rather than discrete entities.
- name: Bronchial Atresia and Type 2 Histology
  description: >
    Type 2 CPAM is increasingly interpreted as an acquired secondary lesion
    in which interruption of fetal airway development by bronchial atresia
    produces small uniform cysts of bronchiolar character. The same
    mechanism is invoked for the histologically similar extralobar
    sequestration.
  cell_types:
  - preferred_term: epithelial cell of lower respiratory tract
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  locations:
  - preferred_term: main bronchus
    term:
      id: UBERON:0002182
      label: main bronchus
  evidence:
  - reference: PMID:37334833
    reference_title: "Congenital Pulmonary Airway Malformations With a Reconsideration and Current Perspective on the Stocker Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CPAM type 2 is an acquired lesion resulting from interruption in lung development secondary to bronchial atresia. The latter is also regarded as the etiology of EIS whose pathologic features are similar, if not identical, to CPAM type 2."
    explanation: The Stocker reconsideration attributes CPAM type 2 (and histologically identical extralobar sequestration) to bronchial atresia.
- name: Somatic KRAS Mutations and Mucinous Cell Clusters
  description: >
    A subset of CPAM lesions, particularly type 1, harbor somatic activating
    KRAS mutations (commonly G12D, G12V) within foci of mucinous cell
    clusters. The same KRAS mutation is detected in mucinous and adjacent
    non-mucinous epithelium, supporting a clonal precursor lesion model
    within the CPAM epithelium.
  cell_types:
  - preferred_term: pulmonary mucinous columnar cell
    term:
      id: CL:0000160
      label: goblet cell
  genes:
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  downstream:
  - target: Progression to Mucinous Adenocarcinoma
    description: >-
      Clonal KRAS-mutant mucinous cell clusters within type 1 CPAM epithelium
      act as precursors that can progress to well-differentiated mucinous
      adenocarcinoma.
    evidence:
    - reference: PMID:34980466
      reference_title: "Neonatal congenital pulmonary airway malformation associated with mucinous adenocarcinoma and KRAS mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This series highlights a clear association between type 1 CPAM and mucinous adenocarcinoma with KRAS point mutations, suggesting that the process of carcinogenesis has the potential to start in utero."
      explanation: Somatic KRAS point mutations in type 1 CPAM drive progression to mucinous adenocarcinoma beginning as early as fetal life.
  evidence:
  - reference: PMID:34980466
    reference_title: "Neonatal congenital pulmonary airway malformation associated with mucinous adenocarcinoma and KRAS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent genetic analysis showed somatic KRAS (Kirsten Rat Sarcoma Viral Oncogene) mutations in all three cases."
    explanation: Three neonatal type 1 CPAM resections with co-existing mucinous adenocarcinoma all harbored somatic KRAS mutations.
  - reference: PMID:40473982

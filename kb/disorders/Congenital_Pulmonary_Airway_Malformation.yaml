- accession: geo:GSE311205
  title: Comparative transcriptome analyses highlight distinct pathogenetic mechanisms for pleuropulmonary blastoma and congenital pulmonary airway malformations I
  description: Pleuropulmonary blastoma (PPB) and congenital pulmonary airway malformations (CPAM) are two rare cystic lung diseases occurring in childhood. PPB can evolve from a low-grade epithelial cyst lesion to a high-grade sarcoma with poor prognosis, while CPAM usually has a favorable non-tumorous outcome. Clinical similarities complicate diagnosis and may delay appropriate care. PPB is associated with DICER1 mutations that disturb miRNA biogenesis, altering the miRNA repertoire. Conversely, KRAS mutations are detected in CPAM, but their implication remains unclear.

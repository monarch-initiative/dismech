- accession: geo:GSE190620
  title: The application of second-generation sequencing in congenital pulmonary airway malformations
  description: 'Objective: To investigate the differential expression of genes in whole transcripts of congenital pulmonary airway malformation (CPAM) using second-generation sequencing (also known as next-generation sequencing, NGS) technology. Methods: Children with CPAM were strictly screened after setting the criteria, and grouped by taking CPAM parietal tissue and CPAM lesion tissue respectively, and RNA-Seq libraries were established separately using second-generation sequencing technology, followed by differential expression analysis and GO (gene ontology) functional enrichment analysis, KEGG pathway analysis and GSEA (Gene Set Enrichment Analysis) analysis.'

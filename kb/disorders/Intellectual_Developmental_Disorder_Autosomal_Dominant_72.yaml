  evidence:
  - reference: PMID:40046925
    reference_title: "Rare SRRM2 mutation in neurodevelopmental disorders involving hyperphagia triggering severe obesity and other complication."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An interview with the parents suggested hyperphagia as an associated
      phenotype, leading to recommendations for strict dietary management. Despite
      these recommendations, the primary guardians' inadequate adherence to the
      dietary guidelines led to rapid weight gain, resulting in morbid obesity and
      related health complications over the years.
    explanation: >-
      Documents both the recommendation and its failure under poor adherence -
      supporting the indication but not demonstrating efficacy, hence PARTIAL.

- name: Genetic Counseling
  description: >-
    Genetic counseling is indicated for all families, covering the predominantly
    de novo mechanism, the 50% recurrence risk where a parent is affected, and the
    availability of prenatal diagnosis when the familial variant is known.
    Prenatal testing has been performed in reported pedigrees.
  therapeutic_modality: BEHAVIORAL

    only 1/22 in the defining cohort. This is a series-level contrast: the
    Genomics England group comprised four whole-gene deletions plus two
    protein-truncating point variants, and the defining cohort itself included
    two microdeletions, so the difference cannot be attributed to deletion size
    on this evidence. Note also that macrocephaly is reported elsewhere in this
    entry - head size is not uniform in MRD72.

notes: >-
  No GeneReviews chapter exists for SRRM2 or MRD72 as of the curation date; a
  PubMed search for "SRRM2 GeneReviews[All Fields]" returned no results, so the
  GeneReviews phenotype baseline step was not applicable. Dysmorphic sub-feature
  frequencies circulating in secondary sources (e.g. per-feature counts from the
  Cuinat cohort) are not present in any abstract or full text available in the
  local reference cache and were therefore not curated; only dysmorphic features
  that could be quoted directly are recorded here.

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    MRD72 is inherited in an autosomal dominant manner, but nearly all molecularly
    confirmed probands carry a de novo heterozygous loss-of-function SRRM2 variant
    or a de novo 16p13.3 deletion spanning the gene. A single multigenerational
    Chinese pedigree with a transmitted nonsense variant has been reported,
    establishing that vertical transmission does occur.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:35567594
    reference_title: "Loss-of-function variants in SRRM2 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 1000 probands studied with developmental delay and intellectual
      disability in our database, we found 2 patients with de novo LoF variants in
      SRRM2.
    explanation: >-
      Establishes the de novo heterozygous loss-of-function mechanism in the index
      probands of the defining cohort.
  - reference: PMID:37621647
    reference_title: "Familial and genetic association with neurodevelopmental disorders caused by a heterozygous variant in the SRRM2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a family with an autosomal dominant genetic disorder caused by
      variants in the SRRM2 gene causing NDDs.
    explanation: >-
      Documents inherited (non-de-novo) autosomal dominant transmission in a
      multigenerational family, confirming the AD inheritance mode.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The defining morbidity is neurodevelopmental - developmental and speech
      delay, intellectual disability, hypotonia, and ASD/ADHD features. The
      metabolic (overweight) and, in a subset, respiratory (NEHI/PTI) features
      are real but secondary to the neurodevelopmental core.


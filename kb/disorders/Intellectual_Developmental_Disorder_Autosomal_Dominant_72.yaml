- name: Dietary Intervention for Hyperphagia and Obesity
  description: >-
    Strict dietary management was recommended for hyperphagia in the reported
    obesity case. Notably, poor adherence was followed by progression to morbid
    obesity with cardiometabolic complications, illustrating both the rationale
    for and the practical limits of dietary management in this phenotype.

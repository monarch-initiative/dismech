  downstream:
  - target: Neurodevelopmental Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted neuronal and glial maturation is the presumed substrate of the
      clinical developmental delay, hypotonia, and behavioural phenotype. The

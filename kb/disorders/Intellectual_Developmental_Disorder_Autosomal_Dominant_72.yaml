    reference_title: "Familial and genetic association with neurodevelopmental disorders caused by a heterozygous variant in the SRRM2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal diagnosis can help patients with this genetic disorder to have
      healthy offspring.
    explanation: >-
      States the reproductive-counseling application demonstrated in a
      multigenerational SRRM2 family.
  - reference: PMID:42342640
    reference_title: "[Prenatal diagnosis and genetics analysis of a fetus with type 27 intellectual disability syndrome due to variant of SRRM2 gene]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amniotic fluid and peripheral blood samples were collected from the fetus
      and its parents for genomic DNA extraction. Whole-exome sequencing (WES)
      was carried out, and candidate variants were verified by Sanger sequencing
      of the family members and rated based on guidelines from the American
      College of Medical Genetics and Genomics (ACMG).
    explanation: >-
      Documents the concrete prenatal-diagnosis workflow (amniocentesis, trio
      WES, Sanger confirmation, ACMG classification) applied in an MRD72
      pregnancy.

animal_models:
- name: Srrm2 heterozygous knockout mouse (brain phenotyping)
  species: Mouse
  genotype: Srrm2+/-
  category: GENETIC
  description: >-
    Constitutive heterozygous Srrm2 mice, modelling the human haploinsufficiency
    mechanism directly. They show transcriptomic change across neuronal and glial
    populations, reduced SynGAP-gamma with elevated Agap3, reduced striatal
    oligodendrocyte proportions with decreased myelin gene and protein expression,
    reduced locomotor activity, impaired startle, and reduced EEG sleep spindles.
  publication: PMID:42189682
  modeled_mechanisms:
  - target: Impaired Neuronal and Oligodendrocyte Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cellular and molecular consequences of Srrm2
      haploinsufficiency in brain at the same allelic dosage as human disease.
    limitations: >-
      The model was developed and interpreted as a genetic model of schizophrenia;
      its behavioural and electrophysiological readouts (locomotor activity,
      startle, sleep spindles) have no established counterpart in MRD72 patients,
      and it does not address the craniofacial dysmorphism, speech delay,
      overfriendliness, or obesity that define the human syndrome.
    readouts:
    - name: Striatal oligodendrocyte proportion
      target: Impaired Neuronal and Oligodendrocyte Development
      direction: DECREASED
      interpretation: >-
        Cellular correlate of the impaired-glial-development node in this model.
      evidence:
      - reference: PMID:42189682
        reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          reduced oligodendrocyte proportions, particularly in the striatum,
          accompanied by decreased expression of myelin-related mRNAs and proteins
        explanation: >-
          Reports the oligodendrocyte and myelin measurements behind this readout.
    - name: SynGAP gamma isoform abundance
      target: Impaired Neuronal and Oligodendrocyte Development
      direction: DECREASED
      interpretation: >-
        Post-synaptic protein readout of the splicing defect in this model.
      evidence:
      - reference: PMID:42189682
        reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          reduction of the gamma isoform of SynGAP and elevation of its
          interactor, Agap3
        explanation: Reports the post-synaptic isoform measurement.
    evidence:
    - reference: PMID:42189682
      reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We find that Srrm2+/- mice exhibit (1) large-scale changes in gene
        expression in neuronal and glial cells, affecting DNA-binding-, synapse-,
        translation-, mitochondria-related pathways across multiple brain regions
      explanation: >-
        The model's own primary result, establishing that the same heterozygous
        dosage as human disease produces measurable neuronal and glial change -
        which is what makes it informative for this node.

experimental_models:
- name: Srrm2 heterozygous mouse embryonic stem cells
  description: >-
    Constitutively Srrm2-heterozygous mouse embryonic stem cells, plus transient
    RNA-interference depletion, used to dissect the earliest consequences of
    reduced Srrm2 dosage. Heterozygous cells lose stemness, co-expressing naive
    and formative pluripotency markers; transient depletion shows that specific
    alternative splicing events precede the broader expression changes.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: embryonic stem cell
    term:
      id: CL:0002322
      label: embryonic stem cell
  publication: PMID:38656788
  modeled_mechanisms:
  - target: Loss of Stemness and Altered Lineage Commitment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly demonstrates the stemness and lineage-commitment consequences of
      heterozygous Srrm2 loss at the same allelic dosage as human disease.
    limitations: >-
      Mouse embryonic stem cells in culture, not human tissue; the link between
      early-embryonic stemness defects and the postnatal MRD72 phenotype is
      inferred rather than shown.
    evidence:
    - reference: PMID:38656788
      reference_title: "SRRM2 splicing factor modulates cell fate in early development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we show that Srrm2 dosage is critical for maintaining embryonic stem cell
        pluripotency and cell identity
      explanation: >-
        States the dosage-dependent stemness finding this model establishes.

- name: SRRM2-deficient human iPSC-derived neurons
  description: >-
    Human induced pluripotent stem cell-derived neurons with SRRM2 deficiency,
    used to test whether the mouse splicing findings hold in a human neuronal
    context. AGAP3 splicing defects are conserved.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:42189682
  modeled_mechanisms:
  - target: Alternative Pre-mRNA Splicing Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Confirms in human neurons the specific mis-splicing event identified in the
      mouse model, bridging the species gap for this arm of the mechanism.
    limitations: >-
      Only the AGAP3 event was reported as conserved; the wider murine splicing
      and myelination findings were not tested in the human system, and iPSC-derived
      neurons do not model the circuit-level or systemic features of the disorder.
    readouts:
    - name: AGAP3 splicing
      target: Alternative Pre-mRNA Splicing Dysregulation
      direction: ALTERED
      interpretation: >-
        Human neuronal confirmation of the mis-splicing signature of SRRM2
        deficiency.
      evidence:
      - reference: PMID:42189682
        reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Human induced pluripotent stem cell (iPSC)-derived neurons deficient in
          SRRM2 display conserved AGAP3 splicing defects.
        explanation: Reports the human neuronal splicing measurement.
    evidence:
    - reference: PMID:42189682
      reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human induced pluripotent stem cell (iPSC)-derived neurons deficient in
        SRRM2 display conserved AGAP3 splicing defects.
      explanation: >-
        Supports treating this human cellular model as informative for the
        splicing-dysregulation node.

discussions:
- discussion_id: mrd72_mouse_model_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Neuronal and Oligodendrocyte Development
  prompt: >-
    Does the Srrm2+/- mouse brain phenotype - reduced striatal oligodendrocytes,
    impaired myelination, reduced sleep spindles, blunted startle - correspond to
    anything measurable in people with MRD72, whose defining features are speech
    delay, overfriendliness, hypotonia, and overweight?
  rationale: >-
    The Srrm2+/- mouse has excellent construct validity: the same gene, the same
    heterozygous dosage. But it was built and interpreted as a genetic model of
    schizophrenia, and its readouts were chosen accordingly. None of the human
    MRD72 features - the predominant speech delay, the characteristic
    overfriendliness, the facial dysmorphism, the overweight - has a murine
    counterpart in the published phenotyping, and no MRD72 patient series reports
    EEG sleep-spindle or myelin-imaging data. The mouse therefore substantiates
    the molecular arm of the mechanism (splicing, synaptic protein isoforms,
    oligodendrocytes) while leaving the mapping onto the human syndrome
    undetermined. This matters for curation because the myelination and
    oligodendrocyte nodes rest entirely on this model.
  proposed_experiments:
  - experiment_id: mrd72_white_matter_imaging
    name: Neuroimaging of white matter in MRD72 patients
    description: >-
      Diffusion MRI in a genotype-confirmed MRD72 cohort against matched controls,
      to test whether the murine myelin deficit has a human structural correlate.
  - experiment_id: mrd72_sleep_eeg_spindles
    name: Sleep EEG in MRD72 patients
    description: >-
      Overnight polysomnography with spindle quantification in MRD72 patients, the
      direct human counterpart of the murine EEG finding.
  evidence:
  - reference: PMID:42189682
    reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      electroencephalogram (EEG) recordings reveal reduced sleep spindles
      resembling humans with schizophrenia
    explanation: >-
      The model's headline neurophysiological readout is framed against
      schizophrenia rather than against the MRD72 phenotype, which is the mismatch
      at issue.

- discussion_id: mrd72_speckle_dosage_threshold
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nuclear Speckle Scaffold Disruption
  prompt: >-
    Is a 50% reduction in SRRM2 dosage - the actual lesion in MRD72 - sufficient
    to degrade nuclear speckle architecture, or are speckles buffered against
    heterozygous loss?
  rationale: >-
    Every published demonstration that speckles depend on SRRM2 used a much
    harsher perturbation than the disease: co-depletion of both SON and SRRM2,
    depletion of SON in a line whose SRRM2 intrinsically disordered regions had
    been genetically deleted, or acute degron depletion. None tested the
    heterozygous state. Because SON remains at full dosage in MRD72, speckles may
    well be largely preserved, in which case the disease-relevant consequence of
    SRRM2 haploinsufficiency runs through the spliceosome-catalytic-centre role
    rather than through speckle architecture. This is the single largest
    uncertainty in the entry's pathograph, and it is why the speckle node is
    marked PROVISIONAL while the splicing node is ESTABLISHED.
  proposed_experiments:
  - experiment_id: mrd72_speckle_morphometry_heterozygous
    name: Speckle morphometry in SRRM2-heterozygous human cells
    description: >-
      Quantitative imaging of nuclear speckle number, size, and sphericity in
      isogenic SRRM2+/- human cells (and, where available, patient-derived
      fibroblasts or iPSC-derived neurons) against wild-type, to test whether the
      disease-relevant dosage measurably alters speckle architecture.
  - experiment_id: mrd72_speckle_vs_splicing_separation
    name: Separation of the speckle and catalytic-centre contributions
    description: >-
      Compare transcriptome-wide splicing in SRRM2+/- cells against cells
      carrying a separation-of-function allele that preserves the spliceosomal
      N-terminus while deleting the speckle-driving IDRs, to apportion the
      splicing defect between the two roles.
  evidence:
  - reference: PMID:33095160
    reference_title: SON and SRRM2 are essential for nuclear speckle formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      depletion of SON leads only to a partial disassembly of NS, while
      co-depletion of SON and SRRM2 or depletion of SON in a cell-line where
      intrinsically disordered regions (IDRs) of SRRM2 are genetically deleted,
      leads to a near-complete dissolution of NS
    explanation: >-
      Shows that the published speckle-dissolution result required perturbing
      both scaffolds, never SRRM2 haploinsufficiency alone - which is the gap.

- discussion_id: mrd72_genotype_severity_gradient
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SRRM2 Haploinsufficiency
  prompt: >-
    Is the more severe phenotype of large 16p13.3 deletions (moderate-to-severe
    intellectual disability, microcephaly, seizures) caused by SRRM2 loss itself,
    or by loss of neighbouring genes within the deleted interval?
  rationale: >-
    Both classes of lesion abolish one SRRM2 allele, so a pure
    haploinsufficiency model predicts comparable severity. The observed gradient
    therefore points either to a contiguous-gene effect at 16p13.3 or to
    ascertainment differences between the cohorts. The authors themselves note
    that phenotypic blending from co-occurring pathogenic variants in CASR/PKD1
    and SLC17A5 confounded two of the six deletion cases, so the comparison is not
    clean. Resolving this determines whether the deletion subtype should be
    modelled as the same disease with greater severity or as a distinct
    contiguous-gene syndrome.
  proposed_experiments:
  - experiment_id: mrd72_deletion_breakpoint_phenotype_correlation
    name: Deletion-interval breakpoint-to-phenotype correlation
    description: >-
      Assemble a larger series of SRRM2-spanning 16p13.3 deletions with precise
      breakpoints and systematic phenotyping, and test whether severity tracks
      deletion size and specific co-deleted genes independently of SRRM2 loss.
  evidence:
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic blending, present for two cases with additional pathogenic
      variants in CASR/PKD1 and SLC17A5, hampered the phenotypic delineation of
      this recently described condition.
    explanation: >-
      The authors identify the confounder that keeps this comparison open.


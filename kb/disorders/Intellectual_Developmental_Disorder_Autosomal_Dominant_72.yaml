    (P5, a 16 bp frameshift; P6, p.(Arg632*)), so seizures are NOT a marker of
    the deletion subtype - and P6 additionally carried biallelic pathogenic
    SLC17A5 variants, which the authors flag as a blended phenotype. Recorded

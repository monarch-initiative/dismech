differential_diagnoses:
- name: ZTTK syndrome (SON-related disorder)
  disease_term:
    preferred_term: ZTTK syndrome
    term:
      id: MONDO:0014936
      label: ZTTK syndrome
  description: >-
    The closest mechanistic relative of MRD72: heterozygous loss of function of
    SON, the other non-redundant nuclear speckle scaffold protein, which likewise
    perturbs splicing of transcripts with weak splice sites. Both disorders are
    therefore nuclear-speckle scaffold haploinsufficiencies presenting with
    developmental delay and intellectual disability.
  distinguishing_features:
  - >-
    ZTTK syndrome is a complex, multisystem developmental disorder with
    congenital anomalies (growth retardation, skeletal abnormalities, kidney
    agenesis), whereas MRD72 is comparatively mild and largely confined to
    neurodevelopment, behaviour, weight, and facial gestalt.
  - >-
    Haematological and immunological involvement (leukopenia, immunoglobulin
    deficiency) is described in ZTTK syndrome but not in MRD72.
  evidence:
  - reference: PMID:38290089
    reference_title: >-
      A mouse model of Zhu-Tokita-Takenouchi-Kim syndrome reveals indispensable
      SON functions in organ development and hematopoiesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is a rare disease caused by
      genetic alterations that result in heterozygous loss of function of SON.
    explanation: >-
      Establishes the gene and mechanism of the differential diagnosis - the
      partner speckle scaffold of SRRM2.
  - reference: PMID:38290089
    reference_title: >-
      A mouse model of Zhu-Tokita-Takenouchi-Kim syndrome reveals indispensable
      SON functions in organ development and hematopoiesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, ZTTK syndrome is a complex, multisystem developmental disorder
    explanation: >-
      Supports the multisystem severity that distinguishes ZTTK from the
      comparatively mild MRD72 phenotype.
  - reference: PMID:33095160
    reference_title: SON and SRRM2 are essential for nuclear speckle formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the core of NS is likely formed by SON and SRRM2
    explanation: >-
      Establishes why the two disorders are mechanistically paired: SON and SRRM2
      are the two joint scaffolds of the same organelle.
  notes: >-
    Nomenclature caution, not a clinical differential: an autosomal dominant
    neurodevelopmental disorder with a similar descriptive name -
    "macrocephaly, neurodevelopmental delay, lymphoid hyperplasia, and
    persistent fetal hemoglobin" (MNDLFH, OMIM 619769, MONDO:0859231, caused by
    ZBTB7A) - is a distinct entity. One of the deep-research runs for this entry
    initially attributed MRD72 to ZBTB7A before self-correcting, so any
    ZBTB7A-derived literature must be kept out of this record.

name: Intellectual Developmental Disorder, Autosomal Dominant 72
creation_date: '2026-08-19T08:30:00Z'
category: Mendelian
description: >-
  Autosomal dominant intellectual developmental disorder 72 (MRD72), also called
  SRRM2-related neurodevelopmental disorder, is caused by heterozygous
  loss-of-function variants in SRRM2 at 16p13.3. SRRM2 encodes SRm300, an
  SR-related pre-mRNA splicing factor that docks at the spliceosome catalytic
  centre and, together with SON, forms the scaffold of nuclear speckles. Affected
  individuals present with mild developmental delay and predominant speech delay,
  autistic and/or attention-deficit/hyperactivity features, overfriendliness,
  generalized hypotonia, overweight/obesity, and dysmorphic facial features;
  intellectual disability is variable and mild when present. A severity contrast
  has been reported between series - the Genomics England structural-variant
  series found moderate-to-severe intellectual disability and frequent
  microcephaly, against typically mild intellectual disability in the original
  cohort - but this is a cohort-level comparison rather than a clean
  deletion-versus-point-variant one, and it is confounded by ascertainment and by
  co-occurring pathogenic variants in two of the six cases. The phenotypic
  spectrum has
  since been extended to neuroendocrine cell hyperplasia of infancy / persistent
  tachypnoea of infancy.
synonyms:
- MRD72
- SRRM2-related neurodevelopmental disorder
- autosomal dominant intellectual developmental disorder-72
- developmental delay-overweight-facial dysmorphism-behavioral abnormalities syndrome

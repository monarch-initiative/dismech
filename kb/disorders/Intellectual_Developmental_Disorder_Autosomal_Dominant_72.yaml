pathophysiology:
- name: SRRM2 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous frameshift, nonsense, or canonical splice-site variants in SRRM2,
    or whole-gene 16p13.3 deletions, halve the functional dose of SRm300. SRRM2 is
    among the most loss-of-function-intolerant genes in the genome (7 observed
    versus 111.4 expected loss-of-function SNVs in gnomAD v2.1.1; LOEUF 0.18, pLI
    1.0), and the disorder was discovered through statistical enrichment of de
    novo protein-truncating variants across 31,058 trios.
  genetic_context:
    gene:
      preferred_term: SRRM2
      term:
        id: hgnc:16639
        label: SRRM2
    allele_type: SNV
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Predominantly de novo heterozygous protein-truncating variants; a minority
      are contiguous 16p13.3 deletions or, more rarely, missense variants in the
      intrinsically disordered region.
  genes:
  - preferred_term: SRRM2
    term:
      id: hgnc:16639
      label: SRRM2
  molecular_functions:
  - preferred_term: mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: spliceosomal complex
    term:
      id: GO:0005681
      label: spliceosomal complex
  evidence:
  - reference: PMID:35567594
    reference_title: "Loss-of-function variants in SRRM2 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis identified 12 frameshift variants, 8 nonsense variants,
      and 2 microdeletions of 66 kb and 270 kb.
    explanation: >-
      Documents the truncating and deletion variant spectrum underlying
      haploinsufficiency in the defining cohort.
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SRRM2 is highly intolerant to putative loss-of-function (pLoF) variants,
      with 111.4 single nucleotide variants (SNVs) expected vs. 7 observed in
      gnomAD v2.1.1. It has a LOEUF score = 0.18 and pLI = 1.0, supporting a link
      to disease via haploinsufficiency
    explanation: >-
      Population constraint metrics directly support haploinsufficiency as the
      disease mechanism rather than a dominant-negative or gain-of-function
      effect.
  downstream:
  - target: Nuclear Speckle Scaffold Disruption
    causal_link_type: UNKNOWN
    description: >-
      SRm300 is one of the two non-redundant scaffold proteins of nuclear
      speckles. Note the cited experiment shows near-complete speckle dissolution
      only on CO-depletion of SON and SRRM2, or on SON depletion in a line whose
      SRRM2 intrinsically disordered regions are deleted - neither SRRM2
      depletion alone nor a 50% dosage reduction has been shown to degrade
      speckle architecture. The edge is therefore recorded as mechanistically
      motivated but not directly demonstrated at disease-relevant dosage.
    evidence:
    - reference: PMID:33095160
      reference_title: "SON and SRRM2 are essential for nuclear speckle formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the core of NS is likely formed by SON and SRRM2, since depletion of SON
        leads only to a partial disassembly of NS, while co-depletion of SON and
        SRRM2 or depletion of SON in a cell-line where intrinsically disordered
        regions (IDRs) of SRRM2 are genetically deleted, leads to a near-complete
        dissolution of NS
      explanation: >-
        Establishes SRRM2 as a required scaffold component whose loss dissolves
        nuclear speckles.
  - target: Alternative Pre-mRNA Splicing Dysregulation
    causal_link_type: DIRECT
    description: >-
      SRm300 sits at the spliceosome catalytic centre, so reduced dosage directly
      perturbs splice-site selection independently of the speckle-scaffold role.
    evidence:
    - reference: PMID:19854871
      reference_title: "Physical and genetic interactions of yeast Cwc21p, an ortholog of human SRm300/SRRM2, suggest a role at the catalytic center of the spliceosome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrate that SRm300, the only SR-related protein known to be at the
        core of human catalytic spliceosomes, is a functional ortholog of Cwc21p,
        also interacting directly with Prp8p and Snu114p.
      explanation: >-
        Places SRm300 physically at the catalytic core of the spliceosome, the
        basis for a direct splicing effect of reduced dosage.

- name: Nuclear Speckle Scaffold Disruption
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    SRm300 and SON are the two non-redundant scaffolds of nuclear speckles,
    membraneless nuclear condensates that concentrate splicing factors. The
    serine/arginine-rich intrinsically disordered regions of SRRM2 drive
    multicomponent liquid-liquid phase separation that subcompartmentalizes the
    speckle. The scaffold role itself is well established; what is NOT
    established is that the ~50% dosage reduction of MRD72 is sufficient to
    degrade speckle architecture. The published dissolution experiments used
    co-depletion of both scaffolds or complete IDR deletion, so this node is
    recorded as PROVISIONAL - see the mrd72_speckle_dosage_threshold discussion.
  cellular_components:
  - preferred_term: nuclear speck
    term:
      id: GO:0016607
      label: nuclear speck
  biological_processes:
  - preferred_term: nuclear speck organization
    term:
      id: GO:0035063
      label: nuclear speck organization
    modifier: DECREASED
  evidence:
  - reference: PMID:38381607
    reference_title: "SRRM2 phase separation drives assembly of nuclear speckle subcompartments."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further show that SRRM2 forms multicomponent liquid phases in cells to
      drive NS subcompartmentalization, which is reliant on homotypic interaction
      and heterotypic non-selective protein-RNA complex coacervation-driven phase
      separation.
    explanation: >-
      Demonstrates that SRRM2 phase separation is the physical basis of nuclear
      speckle subcompartment assembly.
  - reference: PMID:35929045
    reference_title: "SRRM2 organizes splicing condensates to regulate alternative splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that SRRM2 acts as a scaffold to organize nuclear speckles,
      regulating alternative splicing in innate immunity and cell homeostasis.
    explanation: >-
      Independent demonstration of the scaffold role linking speckle organization
      to alternative splicing control.
  downstream:
  - target: Alternative Pre-mRNA Splicing Dysregulation
    causal_link_type: DIRECT
    description: >-
      Loss of the speckle scaffold disperses the splicing-factor reservoir and
      changes splice-site selection.
    evidence:
    - reference: PMID:35929045
      reference_title: "SRRM2 organizes splicing condensates to regulate alternative splicing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As bona-fide splicing factor present in spliceosome structures, SRRM2
        deficiency induces skipping of cassette exons with short introns and weak
        splice sites, tending to change large protein domains.
      explanation: >-
        Directly links SRRM2 deficiency to a defined class of mis-splicing events.

- name: Alternative Pre-mRNA Splicing Dysregulation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced SRm300 shifts splice-site selection genome-wide, preferentially
    causing skipping of cassette exons flanked by short introns and weak splice
    sites, which tends to remove large protein domains. In brain, the affected
    transcripts include post-synaptic regulators - the gamma isoform of SynGAP is
    reduced and its interactor Agap3 is mis-spliced, a defect conserved in human
    SRRM2-deficient iPSC-derived neurons.
  biological_processes:
  - preferred_term: alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000380
      label: alternative mRNA splicing, via spliceosome
    modifier: ABNORMAL
  - preferred_term: regulation of alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:35929045
    reference_title: "SRRM2 organizes splicing condensates to regulate alternative splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SRRM2 deficiency induces skipping of cassette exons with short introns and
      weak splice sites, tending to change large protein domains
    explanation: >-
      Defines the specific mis-splicing signature produced by SRRM2 deficiency.
  - reference: PMID:42189682
    reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human induced pluripotent stem cell (iPSC)-derived neurons deficient in
      SRRM2 display conserved AGAP3 splicing defects.
    explanation: >-
      Shows the mis-splicing consequence is conserved in a human neuronal context,
      not restricted to the mouse model.
  downstream:
  - target: Impaired Neuronal and Oligodendrocyte Development
    causal_link_type: DIRECT
    description: >-
      Mis-splicing and altered abundance of synaptic and myelin transcripts
      perturbs neuronal and glial maturation.
    evidence:
    - reference: PMID:42189682
      reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        alterations in splicing and/or abundance of multiple postsynaptic
        proteins, including reduction of the gamma isoform of SynGAP and elevation
        of its interactor, Agap3
      explanation: >-
        Links the splicing defect to specific post-synaptic protein changes in
        Srrm2 haploinsufficient brain.
  - target: Loss of Stemness and Altered Lineage Commitment
    causal_link_type: DIRECT
    description: >-
      Alternative splicing changes in a small number of genes are the earliest
      detectable consequence of Srrm2 depletion in embryonic stem cells and
      precede the broader transcriptional shift.
    evidence:
    - reference: PMID:38656788
      reference_title: "SRRM2 splicing factor modulates cell fate in early development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the earliest effects of Srrm2 heterozygosity are specific alternative
        splicing events on a small number of genes, followed by expression changes
        in metabolism and differentiation-related genes
      explanation: >-
        Establishes splicing change as the proximal event upstream of the
        stemness/differentiation phenotype.

- name: Loss of Stemness and Altered Lineage Commitment
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Srrm2 dosage is critical for maintaining embryonic stem cell pluripotency and
    cell identity. Heterozygous Srrm2 embryonic stem cells co-express naive and
    formative pluripotency markers and show extensive gene-expression change,
    indicating a partial loss of stemness. This branch is a plausible
    developmental route to the congenital features of MRD72 but has not been
    directly demonstrated in patient tissue, so it is recorded as provisional.
  cell_types:
  - preferred_term: embryonic stem cell
    term:
      id: CL:0002322
      label: embryonic stem cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  - preferred_term: cell differentiation
    term:
      id: GO:0030154
      label: cell differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38656788
    reference_title: "SRRM2 splicing factor modulates cell fate in early development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Srrm2 heterozygosity promotes loss of stemness, characterised by the
      coexistence of cells expressing naive and formative pluripotency markers,
      together with extensive changes in gene expression
    explanation: >-
      Directly demonstrates the stemness phenotype at the same heterozygous dosage
      as human disease.
  downstream:
  - target: Neurodevelopmental Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A candidate early-embryonic route from SRRM2 dosage to the congenital
      features of MRD72. The stemness defect is demonstrated only in mouse
      embryonic stem cells; no step between it and any human clinical feature has
      been shown, so the edge is speculative and recorded with unknown
      intermediates.
    evidence:
    - reference: PMID:38656788
      reference_title: "SRRM2 splicing factor modulates cell fate in early development."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Our findings unveil molecular and cellular roles of Srrm2 in stemness and
        lineage commitment, shedding light on the roles of splicing regulators in
        early embryogenesis, developmental diseases and tumorigenesis.
      explanation: >-
        The authors themselves frame the relevance to developmental disease as
        illumination rather than demonstration, which is why this edge is PARTIAL
        with unknown intermediates.

- name: Impaired Neuronal and Oligodendrocyte Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    In Srrm2 haploinsufficient mouse brain, gene expression changes across
    neuronal and glial populations affect synapse, translation, and mitochondrial
    pathways; oligodendrocyte proportions are reduced, particularly in striatum,
    with decreased myelin-related mRNA and protein. The corresponding
    electrophysiological and behavioural changes (reduced locomotor activity,
    impaired startle, reduced sleep spindles) have not been assessed in patients,
    so the human relevance of the glial/myelin arm remains provisional.
  cell_types:

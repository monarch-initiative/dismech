has_subtypes:
- name: Large 16p13.3 deletion
  display_name: Large contiguous 16p13.3 deletion including SRRM2
  description: >-
    Individuals carrying whole-gene deletions of SRRM2 (248-482 kb in the
    Genomics England series, 66-270 kb in the defining cohort) rather than
    protein-truncating point variants. The subtype is defined by lesion
    architecture, which is well characterised: distal breakpoints cluster within
    a 144 kb palindrome-like structure 75 kb upstream of SRRM2, and three of the
    four Genomics England deletions carried inverted internal segments of 45-94
    kb. A severity difference is often attributed to this subtype but is NOT
    established: the moderate-to-severe intellectual disability reported by
    Genomics England describes all six of their patients (four deletions plus two
    point variants) versus the defining cohort as a whole (which itself contained
    two microdeletions), two of the six carried co-occurring pathogenic variants
    in other genes, and both seizure cases were point-variant carriers. See the
    mrd72_genotype_severity_gradient discussion.
  evidence:
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ID was observed in all 6 individuals described here and ranged from moderate
      to severe, whereas in the published cohort, the level of ID was typically
      mild.
    explanation: >-
      The severity statement usually cited for this subtype. Note it compares the
      six Genomics England patients (a mixed deletion/point-variant group) with
      the defining cohort, so it is a series-level rather than genotype-level
      contrast.
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions ranged between 248 and 482 kb in size and all distal breakpoints
      clustered within a complex 144 kb palindrome situated 75 kb upstream of
      SRRM2. Strikingly, three of the deletions were complex, with inverted
      internal segments of 45-94 kb.
    explanation: >-
      Defines the structural architecture underlying this subtype.

genetic:
- name: SRRM2
  gene_term:
    preferred_term: SRRM2
    term:
      id: hgnc:16639
      label: SRRM2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  notes: >-
    SRRM2 at 16p13.3 encodes SRm300, a 2,752-amino-acid SR-related splicing factor
    and nuclear speckle scaffold. Heterozygous loss of function - by frameshift,
    nonsense, canonical splice-site variant, or whole-gene deletion - is the sole
    established cause of MRD72. The gene was first robustly implicated by de novo
    mutation enrichment across 31,058 developmental-disorder trios.
  evidence:
  - reference: PMID:35567594
    reference_title: "Loss-of-function variants in SRRM2 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 22 patients with LoF variants in SRRM2 and provide a
      description of the phenotype.
    explanation: >-
      The defining gene-disease study establishing SRRM2 loss of function as
      causal.
  - reference: PMID:35567594
    reference_title: "Loss-of-function variants in SRRM2 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We established SRRM2 as a gene responsible for a rare neurodevelopmental
      disease.
    explanation: Explicit gene-disease conclusion.
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SRRM2, a 15 exon gene that encodes a 2,752 amino acid splicing factor, was
      one of 28 genes that showed a strong enrichment for de novo mutations, but
      which had not previously been robustly linked to developmental disorders.
      Enrichment was driven primarily by protein-truncating variants
    explanation: >-
      Records the statistical de novo enrichment that first implicated SRRM2 and
      confirms protein-truncating variants as the driving class.
  variants:
  - name: Recurrent arginine-to-stop variants (CpG deamination)
    description: >-
      SRRM2 is arginine-rich (468/2,752 residues) and correspondingly CpG-dense,
      making it a high-risk gene for de novo nonsense variants arising by
      deamination of methylated cytosine. Four of the 22 variants in the defining
      cohort were Arg-to-Ter changes, and p.(Arg632*) reported in the Genomics
      England series lies close to the previously reported p.(Arg628*).
    gene:
      preferred_term: SRRM2
      term:
        id: hgnc:16639
        label: SRRM2
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:40225164
      reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As SRRM2 encodes an arginine-rich protein (468/2,752 residues), it
        contains a relatively high number of CpG dinucleotides rendering it a
        high-risk gene for de novo nonsense variants via deamination of methylated
        cytosine. Of the 22 variants reported by Cuinat et al., 4 were Arg - > Ter
        variants.
      explanation: >-
        Establishes CpG deamination as a recurrent mutational mechanism at this
        locus.
  - name: MSP-associated missense variant disrupting the SRRM2-ACIN1 interaction
    description: >-
      A co-segregating SRRM2 missense variant reported in a family with
      dominantly inherited multisystem proteinopathy - a degenerative
      nervous-system/muscle/bone disorder, NOT MRD72. Knock-in of the single
      amino-acid change abolished the SRRM2-ACIN1 protein-protein interaction and
      produced widespread expression change converging on synapse-associated
      pathways. Recorded here as an allelic-spectrum contrast: it indicates that
      SRRM2 missense alleles can act through a mechanism other than the
      haploinsufficiency that causes MRD72, and such variants should not be
      assumed to cause this disorder.
    gene:
      preferred_term: SRRM2
      term:
        id: hgnc:16639
        label: SRRM2
    evidence:
    - reference: PMID:42309671
      reference_title: "A mutation in the nuclear speckle and splicing factor SRRM2 is associated with multisystem proteinopathy and causes dysregulation of synapse-associated genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we describe a family with dominantly inherited MSP, in which a
        mutation in the serine/arginine repetitive matrix protein 2 gene (SRRM2)
        that co-segregates with disease, is identified.
      explanation: >-
        Establishes a distinct SRRM2-associated dominant disease, separate from
        MRD72.
    - reference: PMID:42309671
      reference_title: "A mutation in the nuclear speckle and splicing factor SRRM2 is associated with multisystem proteinopathy and causes dysregulation of synapse-associated genes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we found that the resulting single amino acid exchange led to the loss of
        protein-protein interaction between SRRM2 and the splicing factor ACIN1
      explanation: >-
        Identifies a non-haploinsufficiency molecular consequence for this allele
        class.
  - name: p.Gln1554Leu (intrinsically disordered region missense)
    description: >-
      A de novo missense variant NM_016333:c.4661A>T (p.Q1554L) in the SRRM2
      intrinsically disordered region, classified Likely Pathogenic, reported in a
      patient with a hyperphagia-driven severe obesity presentation. This is the
      principal reported non-truncating candidate; the disorder's mechanism is
      otherwise haploinsufficiency.
    gene:
      preferred_term: SRRM2
      term:
        id: hgnc:16639
        label: SRRM2
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:40046925
      reference_title: "Rare SRRM2 mutation in neurodevelopmental disorders involving hyperphagia triggering severe obesity and other complication."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified a novel missense mutation in SRRM2 (NM_016333: c.4661A > T,
        p.Q1554L). This mutation is classified as "Likely Pathogenic" based on the
        American College of Medical Genetics and Genomics (ACMG) guideline.
      explanation: >-
        Reports the variant and its ACMG classification.

diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    Essentially all reported cases were ascertained by exome or genome sequencing,
    usually as parent-child trios to establish de novo status. Genome sequencing
    is preferred where a structural variant is suspected, because the 16p13.3
    deletions are frequently complex and were missed or under-resolved by
    array-based testing in reported cases.
  evidence:
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data highlights the benefits of genome sequencing for resolving
      structural complexity and inferring de novo status.
    explanation: >-
      States the diagnostic advantage of genome sequencing for this locus.
  - reference: PMID:40225164
    reference_title: "A Palindrome-Like Structure on 16p13.3 Is Associated with the Formation of Complex Structural Variations and SRRM2 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array-based testing had yielded a normal result, albeit at a low resolution.
    explanation: >-
      Documents a false-negative microarray result in a patient with an SRRM2
      deletion, supporting sequencing-based workup.
- name: SRRM2 sequencing in NEHI/PTI workup
  description: >-
    Because SRRM2 loss-of-function variants explain a substantial fraction of
    neuroendocrine cell hyperplasia of infancy / persistent tachypnoea of infancy,
    SRRM2 sequencing has been proposed as part of the standard workup for that
    presentation, with paediatric neurology assessment.
  evidence:
  - reference: PMID:40967764
    reference_title: "D e novo SRRM2 variants in neuroendocrine cell hyperplasia of infancy and persistent tachypnoea of infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that NEHI/PTI patients should be evaluated by a
      paediatric neurologist and that SRRM2 sequencing should be included in every
      NEHI/PTI workup.
    explanation: Explicit diagnostic recommendation from the NEHI/PTI cohort study.


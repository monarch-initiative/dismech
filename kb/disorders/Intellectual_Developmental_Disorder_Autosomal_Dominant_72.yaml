    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:42189682
    reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      reduced oligodendrocyte proportions, particularly in the striatum,
      accompanied by decreased expression of myelin-related mRNAs and proteins
    explanation: >-
      Documents the glial and myelin consequences of Srrm2 haploinsufficiency in
      vivo.
  - reference: PMID:42189682
    reference_title: "Srrm2 haploinsufficiency drives SynGAP-γ reduction, Agap3 mis-splicing, and oligodendrocyte deficits in a genetic mouse model of schizophrenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Behaviorally, Srrm2+/- mice have reduced locomotor activity and impaired
      startle responses, and electroencephalogram (EEG) recordings reveal reduced
      sleep spindles resembling humans with schizophrenia.
    explanation: >-
      Documents the behavioural and electrophysiological consequences in the same

  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family B, the children are each homozygous for the variant c.446delT whereas the parents are heterozygous carriers."
    explanation: All children of family B, not only the affected boy, are homozygous for the c.446delT allele.
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

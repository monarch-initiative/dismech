notes: >-
  Evidence base. The human phenotype rests on one report of three symptomatic
  children in two consanguineous families (PMID:32160317), with sulfur
  metabolite measurements in the second family published separately
  (PMID:36306676). No phenotype frequencies are recorded because three patients
  cannot support them. The H2S-to-complex IV mechanism is supported in patients
  by the pattern of isolated complex IV deficiency with normal complex IV
  assembly, and causally by the SqorDeltaN/DeltaN mouse; sustained H2S elevation
  has not been shown in patients. The complex IV and lactate nodes conform to
  the corresponding nodes of the complex_iv_assembly_deficiency module, but the
  module's Complex IV Biogenesis Failure node does not apply because complex IV
  assembly is normal in this disease. Unlike ethylmalonic encephalopathy,
  urinary ethylmalonic acid, chronic diarrhea and petechiae have not been
  reported in SQOR deficiency, so the ETHE1 biochemical signature is not
  curated here. No GeneReviews chapter covers SQOR deficiency.

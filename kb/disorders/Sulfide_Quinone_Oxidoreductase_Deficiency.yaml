discussions:
- discussion_id: sqord_penetrance_and_triggers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some SQOR-deficient individuals remain asymptomatic, and what raises
    H2S enough to cause an episode?
  attaches_to:
  - pathophysiology#Hydrogen Sulfide Accumulation
  - inheritance#Incomplete penetrance
  rationale: >-
    Plasma sulfide was normal in the symptomatic family B patient and in one
    asymptomatic sibling, and raised in another asymptomatic sibling, so baseline
    H2S does not track disease. All reported episodes followed intercurrent
    illness, and the mouse data implicate gut microbial H2S. Whether infection,
    fasting, or a surge in microbial sulfide production exceeds an otherwise
    adequate alternative sulfide-disposal capacity has not been measured during
    an episode in a patient.
  evidence:
  - reference: PMID:36306676
    reference_title: "Human ultrarare genetic disorders of sulfur metabolism demonstrate redundancies in H(2)S homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In deficiency of sulfide:quinone oxidoreductase - the first enzyme in mitochondrial H2S oxidation - we found normal H2S concentrations in a symptomatic patient and his asymptomatic sibling, and elevated levels in an asymptomatic sibling, challenging the requirement for this enzyme in catabolizing H2S under physiological conditions."
    explanation: Baseline sulfide measurements do not separate symptomatic from asymptomatic SQOR-deficient siblings.
- discussion_id: sqord_sulfide_lowering_therapy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Will metronidazole or dietary sulfur restriction prevent episodes in
    patients, as they rescue the SqorDeltaN/DeltaN mouse?
  attaches_to:
  - treatments#Metronidazole
  - treatments#Sulfur-restricted diet
  rationale: >-
    Both interventions rescue the mouse, whose disease is continuous and
    accompanied by raised H2S, but patients present with episodic decompensation
    and inconsistent baseline sulfide. No patient has been treated and reported,
    so efficacy, dosing, and whether treatment should be continuous or reserved
    for intercurrent illness are unknown.
  evidence:
  - reference: PMID:38870029
    reference_title: "Exclusion of sulfide:quinone oxidoreductase from mitochondria causes Leigh-like disease in mice by impairing sulfide metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Metronidazole administration and a sulfur-restricted diet may be therapeutic approaches to treatment of patients with Leigh syndrome caused by mutations in SQOR."
    explanation: The model study proposes, but does not test, these therapies in patients.

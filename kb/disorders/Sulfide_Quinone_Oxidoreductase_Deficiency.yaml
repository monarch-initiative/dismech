inheritance:
- name: Autosomal recessive
  description: >-
    All reported patients are homozygous for SQOR loss-of-function variants:
    c.637G>A p.(Glu213Lys) in a consanguineous Lehrerleut Hutterite family and
    c.446delT in a consanguineous family of Turkish descent. Heterozygous parents
    are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were homozygous for c.637G > A, which we identified as a founder mutation in the Lehrerleut Hutterite with a carrier frequency of 1 in 13."
    explanation: >-
      Both affected sisters in family A are homozygous for a founder allele carried
      by unaffected heterozygotes in their population, consistent with autosomal
      recessive inheritance; the abstract does not name the mode of inheritance
      itself.
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was homozygous for c.446delT and had severely reduced fibroblast SQOR enzyme activity and protein levels."
    explanation: >-
      The affected boy in the second family is also homozygous for a
      loss-of-function SQOR allele.
- name: Incomplete penetrance
  description: >-
    Homozygous siblings of the affected boy in family B have remained clinically
    well, so carrying two SQOR loss-of-function alleles does not invariably cause
    disease. The number of genotyped individuals is too small to estimate
    penetrance.
  inheritance_term:
    preferred_term: Incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:

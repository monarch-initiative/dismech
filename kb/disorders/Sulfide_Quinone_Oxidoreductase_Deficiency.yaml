pathophysiology:
- name: SQOR Sulfide Oxidation Deficiency
  description: >-
    Biallelic SQOR variants leave very little SQOR protein and enzyme activity.
    The missense p.(Glu213Lys) disrupts hydrogen bonding and destabilizes the
    protein, and c.446delT is a frameshift. SQOR catalyses the first and
    committed step of mitochondrial sulfide oxidation, oxidizing H2S with
    coenzyme Q as electron acceptor and glutathione as sulfane sulfur acceptor,
    so its loss removes the main mitochondrial route for H2S disposal. Levels of
    the H2S-generating enzymes are unchanged.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SQOR
    term:
      id: hgnc:20390
      label: SQOR
  molecular_functions:
  - preferred_term: glutathione-dependent sulfide quinone oxidoreductase activity
    term:
      id: GO:0106436
      label: glutathione-dependent sulfide quinone oxidoreductase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: sulfide oxidation
    term:
      id: GO:0019418
      label: sulfide oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting p.Glu213Lys change disrupts hydrogen bonding with neighboring residues, resulting in severely reduced SQOR protein and enzyme activity, whereas sulfide generating enzyme levels were unchanged."
    explanation: The founder missense variant destabilizes SQOR and abolishes most enzyme activity in patient tissue.
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was homozygous for c.446delT and had severely reduced fibroblast SQOR enzyme activity and protein levels."
    explanation: The second family's frameshift allele also severely reduces SQOR protein and activity.
  - reference: PMID:39719173
    reference_title: "Essential role of sulfide oxidation in brain health and neurological disorders."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The reaction, catalyzed by sulfide:quinone oxidoreductase (SQOR), is the initial and critical step in sulfide oxidation."
    explanation: Places SQOR at the first step of the mitochondrial sulfide oxidation pathway.
  - reference: PMID:26318450
    reference_title: "Transient Kinetic Analysis of Hydrogen Sulfide Oxidation Catalyzed by Human Sulfide Quinone Oxidoreductase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During the catalytic cycle, the flavin cofactor is intermittently reduced by sulfide and oxidized by ubiquinone, linking H2S oxidation to the electron transfer chain and to energy metabolism."
    explanation: Kinetic work on purified human SQOR shows the enzyme passes electrons from sulfide to ubiquinone, coupling sulfide oxidation to the respiratory chain.
  downstream:
  - target: Hydrogen Sulfide Accumulation
    description: >-
      Without SQOR, H2S produced by host tissues and by gut bacteria is not
      oxidized in mitochondria and can accumulate systemically.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38870029
      reference_title: "Exclusion of sulfide:quinone oxidoreductase from mitochondria causes Leigh-like disease in mice by impairing sulfide metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these observations suggest that mitochondrial SQOR is essential to prevent systemic accumulation of H2S."
      explanation: In mice lacking mitochondrial SQOR, H2S accumulates systemically.
    - reference: PMID:32160317
      reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "SQOR dysfunction can result in hydrogen sulfide accumulation, which, consistent with its known toxicity, inhibits complex IV resulting in energy failure."
      explanation: The authors of the human report propose H2S accumulation as the consequence of SQOR deficiency; it was inferred rather than measured in the patients.
- name: Hydrogen Sulfide Accumulation
  description: >-
    H2S comes from cysteine catabolism in host tissues and from gut bacteria. In
    the SqorDeltaN/DeltaN mouse, H2S levels rise and are lowered by
    metronidazole, implicating the gut microbial source. In patients the
    accumulation is thought to be intermittent: plasma sulfide was normal in a
    symptomatic patient between episodes and elevated in one asymptomatic
    sibling, which suggests that alternative routes can handle basal H2S load
    and that disease follows when supply exceeds them.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
    modifier: INCREASED
  evidence:
  - reference: PMID:38870029
    reference_title: "Exclusion of sulfide:quinone oxidoreductase from mitochondria causes Leigh-like disease in mice by impairing sulfide metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SqorΔN/ΔN mice had increased blood lactate levels that were associated with markedly decreased complex IV activity and increased hydrogen sulfide (H2S) levels."
    explanation: H2S levels are increased in the mouse model of SQOR deficiency.
  - reference: PMID:38870029
    reference_title: "Exclusion of sulfide:quinone oxidoreductase from mitochondria causes Leigh-like disease in mice by impairing sulfide metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Daily treatment with metronidazole alleviated increased H2S levels, normalized complex IV activity and blood lactate levels, and prolonged the survival of SqorΔN/ΔN mice."
    explanation: Lowering gut bacterial H2S production with metronidazole reduces the H2S excess, implicating the microbial source.
  - reference: PMID:36306676
    reference_title: "Human ultrarare genetic disorders of sulfur metabolism demonstrate redundancies in H(2)S homeostasis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In deficiency of sulfide:quinone oxidoreductase - the first enzyme in mitochondrial H2S oxidation - we found normal H2S concentrations in a symptomatic patient and his asymptomatic sibling, and elevated levels in an asymptomatic sibling, challenging the requirement for this enzyme in catabolizing H2S under physiological conditions."
    explanation: >-
      Sulfide measured in the family B patient and his siblings did not show
      consistent elevation, so sustained H2S accumulation has not been
      demonstrated in humans. This argues against a constant H2S excess and is
      compatible only with intermittent accumulation.

name: Sulfide Quinone Oxidoreductase Deficiency
creation_date: "2026-10-08T13:32:21Z"
category: Mendelian
description: >-
  Sulfide quinone oxidoreductase deficiency (SQORD) is an autosomal recessive
  inborn error of hydrogen sulfide (H2S) metabolism caused by biallelic
  loss-of-function variants in SQOR (previously SQRDL). SQOR is the inner
  mitochondrial membrane enzyme that performs the first step of mitochondrial
  sulfide oxidation, transferring electrons from H2S to coenzyme Q and the
  sulfane sulfur to glutathione; ETHE1 persulfide dioxygenase acts on its
  product in the next step. Affected children from two unrelated families have
  been described. Episodes following intercurrent illness produce coma, lactic
  acidosis and Leigh-like basal ganglia lesions, with isolated decreased
  cytochrome c oxidase (complex IV) activity in muscle and liver despite normal
  complex IV protein and assembly. The proposed mechanism is intermittent
  accumulation of H2S, which inhibits complex IV and causes energy failure; a
  mouse model in which SQOR is excluded from mitochondria reproduces the
  Leigh-like disease, the H2S elevation and the complex IV deficit. Two sisters
  in the first family died during their first episode, while homozygous siblings
  in the second family have remained asymptomatic, so penetrance and the
  triggers that convert the biochemical defect into disease are not settled.

    reference_title: "Human ultrarare genetic disorders of sulfur metabolism demonstrate redundancies in H(2)S homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In deficiency of sulfide:quinone oxidoreductase - the first enzyme in mitochondrial H2S oxidation - we found normal H2S concentrations in a symptomatic patient and his asymptomatic sibling, and elevated levels in an asymptomatic sibling, challenging the requirement for this enzyme in catabolizing H2S under physiological conditions."
    explanation: >-
      The SQOR-deficient group studied includes a symptomatic patient and two
      asymptomatic siblings. The quote supports incomplete penetrance through the
      inference that the asymptomatic siblings share the deficiency, which the

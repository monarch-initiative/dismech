environmental:
- name: Intercurrent infection and fasting
  description: >-
    Every reported decompensation followed an intercurrent illness, often with
    fasting, which the authors associate with protein catabolism and propose
    raises H2S supply beyond the low residual SQOR capacity.
  notes: >-
    exposure_term left unbound. An OLS search of ECTO for "fasting" returned
    ECTO:2000118 exposure to fasting intervention, which describes a deliberate
    fasting intervention rather than illness-related fasting; "infection"
    returned only pathogen-specific exposures (ECTO:2000053 exposure to Human
    Papillomavirus Infection, ECTO:3000104 exposure to Infectious bronchitis
    virus); "starvation", "food deprivation" and "exposure to infectious agent"
    returned no ECTO term.
  evidence:
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, acute symptoms were triggered by infections and fasting, episodes associated with protein catabolism."
    explanation: Infection and fasting preceded every acute episode in the reported patients.
  influences_mechanisms:
  - target: Hydrogen Sulfide Accumulation
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Protein catabolism during illness is proposed to increase H2S production
      beyond what the low residual SQOR activity can clear.
    evidence:
    - reference: PMID:32160317
      reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize that in our patients, the low residual SQOR activity was likely sufficient to support H2S clearance during stable episodes but was insufficient during acute illness with catabolism resulting in H2S accumulation and toxicity."
      explanation: The authors propose, without measuring H2S during an episode, that illness-related catabolism tips the patients into H2S accumulation.
genetic:
- name: SQOR
  gene_term:
    preferred_term: SQOR
    term:
      id: hgnc:20390
      label: SQOR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    SQOR (previously SQRDL) encodes sulfide:quinone oxidoreductase, a
    flavoprotein of the inner mitochondrial membrane. Two homozygous
    loss-of-function alleles have been reported, each in one consanguineous
    family.
  evidence:
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe children of two families with pathogenic variants in SQOR."
    explanation: The founding report of SQOR variants in affected children.
  - reference: PMID:38870029
    reference_title: "Exclusion of sulfide:quinone oxidoreductase from mitochondria causes Leigh-like disease in mice by impairing sulfide metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that mice with a mutation in the gene encoding SQOR (SqorΔN/ΔN mice), which prevented SQOR from entering mitochondria, had clinical and pathological manifestations of Leigh syndrome."
    explanation: A mouse model independently supports SQOR loss as a cause of Leigh-like disease.
  variants:
  - name: "SQOR c.637G>A p.(Glu213Lys)"
    description: >-
      Missense founder variant in exon 5 (NM_021199.4), homozygous in two
      affected sisters of a Lehrerleut Hutterite family. It destabilizes the
      protein, leaving severely reduced SQOR protein and activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32160317
      reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The resulting p.Glu213Lys change disrupts hydrogen bonding with neighboring residues, resulting in severely reduced SQOR protein and enzyme activity, whereas sulfide generating enzyme levels were unchanged."
      explanation: Functional characterization of the founder variant.
  - name: "SQOR c.446delT"
    description: >-
      Single-nucleotide deletion, homozygous in the affected boy of family B and
      in his asymptomatic siblings.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32160317
      reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He was homozygous for c.446delT and had severely reduced fibroblast SQOR enzyme activity and protein levels."
      explanation: The deletion abolishes most SQOR protein and activity in fibroblasts.
  notes: >-
    No ClinGen gene-disease validity record exists for SQOR against this MONDO
    term. ClinGen's Mitochondrial Diseases Gene Curation Expert Panel classifies
    SQOR against the broader Leigh syndrome concept (MONDO:0009723) as Limited
    (autosomal recessive, 2021); that is a different disease pair, so no tier is
    recorded here.
differential_diagnoses:
- name: Ethylmalonic encephalopathy
  disease_term:
    preferred_term: ethylmalonic encephalopathy
    term:
      id: MONDO:0011229
      label: ethylmalonic encephalopathy
  description: >-
    ETHE1 deficiency blocks the next step of the same mitochondrial H2S oxidation
    pathway and also produces complex IV deficiency and basal ganglia lesions.
    It differs by a chronic course with petechiae, acrocyanosis, chronic
    diarrhea, ethylmalonic aciduria and massive thiosulfate excretion, whereas
    SQOR deficiency has presented as episodic decompensation in otherwise well
    children. Molecular testing separates them.
  distinguishing_features:
  - Massive accumulation of thiosulfate and sulfite in ethylmalonic encephalopathy.
  - Biallelic ETHE1 rather than SQOR variants.
  evidence:
  - reference: PMID:36306676
    reference_title: "Human ultrarare genetic disorders of sulfur metabolism demonstrate redundancies in H(2)S homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ethylmalonic encephalopathy and sulfite oxidase/molybdenum cofactor deficiencies exhibited massive accumulation of thiosulfate and sulfite with formation of large amounts of S-sulfocysteine and S-sulfohomocysteine"
    explanation: >-
      In the same study that measured SQOR-deficient patients, thiosulfate and
      sulfite accumulation characterized ethylmalonic encephalopathy, giving a
      biochemical distinction between the two disorders of H2S oxidation.
- name: Leigh syndrome due to complex IV assembly defects
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  description: >-
    Isolated complex IV deficiency with Leigh-like lesions is most often caused
    by defects in complex IV subunits or assembly factors such as SURF1. In SQOR
    deficiency complex IV protein and assembly are normal while activity is
    reduced, which points to toxic inhibition rather than a biogenesis defect.
  distinguishing_features:
  - Normal complex IV protein levels and complex formation despite reduced activity.
  evidence:
  - reference: PMID:32160317
    reference_title: "Pathogenic variants in SQOR encoding sulfide:quinone oxidoreductase are a potentially treatable cause of Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle and liver tissue had isolated decreased complex IV activity, but normal complex IV protein levels and complex formation."
    explanation: Normal complex IV amount and assembly separate SQOR deficiency from complex IV biogenesis defects.
treatments:
- name: Metronidazole
  description: >-
    Proposed sulfide-lowering therapy, by analogy with ethylmalonic
    encephalopathy: the antibiotic reduces H2S production by gut anaerobes. Its
    support comes from the SqorDeltaN/DeltaN mouse, in which daily metronidazole
    lowered H2S, normalized complex IV activity and blood lactate, and prolonged
    survival. No treated patient has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Hydrogen Sulfide Accumulation
    description: Lowers the gut microbial contribution to systemic H2S.
    evidence:

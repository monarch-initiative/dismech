name: Czech dysplasia
creation_date: "2026-08-24T21:50:00Z"
category: Mendelian
description: >-
  Czech dysplasia (spondyloepiphyseal dysplasia with metatarsal shortening,
  OMIM 609162) is an autosomal dominant type II collagenopathy caused by the
  single recurrent COL2A1 substitution c.823C>T, p.Arg275Cys, in the
  triple-helical domain of the alpha-1 chain of type II collagen. It is defined
  as much by what it lacks as by what it has: affected individuals have normal
  height and no ophthalmological or orofacial involvement, which separates it
  from every other COL2A1 disorder. The positive features are an early-onset,
  progressive pseudorheumatoid arthropathy with joint pain and stiffness,
  platyspondyly, and short third and fourth metatarsals with correspondingly
  short toes. Sensorineural hearing loss was added to the core phenotype after
  a large family was reported. The disorder is remarkable among the type II
  collagenopathies in that a single allele appears to account for every
  molecularly confirmed case.

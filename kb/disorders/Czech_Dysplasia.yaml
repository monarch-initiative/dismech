  description: >-
    Transmitted as an autosomal dominant trait; the recurrent p.Arg275Cys allele
    segregated with disease in all 11 affected members of a single large family.
  evidence:
  - reference: PMID:17726487
    reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Czech dysplasia metatarsal type is an autosomal-dominant disorder
      characterized by an early-onset, progressive spondyloarthropathy with
      normal stature.
    explanation: States autosomal dominant inheritance together with the two
      defining features.
notes: >-
  Three things about this entry are deliberate.

  First, the **allelic specificity is curated as a claim with a stated basis,
  not as a definition.** PMID:18553548 puts it as "possibly caused exclusively
  by the R275C mutation, which is a unique situation among the COL2A1
  disorders", and PMID:26443184 reports from a 700-patient COL2A1 variant review
  that "the p.(Arg275Cys) substitution is found in all patients with
  COL2A1-associated Czech dysplasia". Both are curated. Neither licenses the
  stronger statement that no other allele could produce this phenotype, and the
  entry does not make it.

  Second, the **negative features are curated as evidence-bearing content**
  rather than left out. Normal stature and the absence of ocular and orofacial
  anomalies are what separate Czech dysplasia from the rest of the type II
  collagenopathies, and PMID:17726487 shows why that matters in practice: one of
  the three originally reported Czech dysplasia patients did *not* carry R275C,
  and the Y1391C variant found instead, together with disproportionate short
  stature, reassigned the diagnosis to spondyloperipheral dysplasia. A negative
  finding did the diagnostic work there.

  Third, **module conformance is claimed at two nodes and explicitly not at the
  three in between.** The `osteoarthritis_cartilage_degradation` module names an
  intrinsic ECM defect as one of its anticipated entry routes, and the clinical
  endpoint node describes exactly the arthropathy reported here, so both ends
  are evidenced. The intermediate catabolic-chondrocyte, MMP-13/ADAMTS-5 and
  subchondral-remodeling nodes are not: no source cited here measures a
  chondrocyte phenotype, a matrix-degrading enzyme, or subchondral bone turnover
  in a Czech dysplasia patient. Declaring those would assert mechanism this
  disorder's literature has not supplied.

  A naming hazard worth recording: "progressive pseudorheumatoid dysplasia" is
  both a listed synonym of this disorder and the standard name of a
  mechanistically unrelated CCN6/WISP3 recessive disorder. The Perplexity report
  generated for this entry cited PMID:27587938, which is about the CCN6 disease,
  not this one. It is not cited anywhere in this entry.

  Research input: `research/Spondyloepiphyseal_Dysplasia_With_Metatarsal_Shortening-deep-research-perplexity.md`.
  The NEC preflight returned SKIP because MONDO records no causal gene for
  MONDO:0012206, so the manual check was run instead: the report's OMIM (609162)
  matches the MONDO xref exactly, and COL2A1 dominates its gene mentions (69 to
  1). The report supplied no usable primary citations — two PMIDs in its body,
  one of which is the wrong-disease citation above — so all references here were
  found independently in PubMed.
pathophysiology:
- name: COL2A1 p.Arg275Cys Substitution in the Triple-Helical Domain
  biological_scale: MOLECULAR
  description: >-
    A heterozygous c.823C>T transition in exon 13 of COL2A1 replaces arginine
    275 with cysteine in the triple-helical domain of the pro-alpha-1(II)
    collagen chain. Unlike the glycine substitutions that dominate the severe
    type II collagenopathies, this variant alters a non-glycine residue, and it
    is the only allele so far identified in molecularly confirmed cases.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17726487
    reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the R275C substitution in two of the original patients
      reported with Czech dysplasia and three additional patients.
    explanation: >-
      Establishes the R275C substitution as the molecular lesion in the original
      and additional Czech dysplasia patients.
  - reference: PMID:19764028
    reference_title: "Czech dysplasia occurring in a Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A specific missense mutation (c.823C > T, R275C) in the exon 13 of the
      COL2A1 gene, coding for the triple helical domain of the alpha 1 chain of
      the type II collagen, has been linked to Czech dysplasia
    explanation: >-
      Locates the variant precisely in exon 13 and in the triple-helical domain
      of the alpha-1(II) chain.
  downstream:
  - target: Defective Type II Collagen Fibril in Cartilage Matrix
    description: >-
      An unpaired cysteine substituted into the triple-helical domain of a
      structural collagen chain is incorporated into the heterotrimer and
      compromises the fibrillar matrix that chain builds.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26443184
      reference_title: "Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in the COL2A1 gene cause a spectrum of rare autosomal-dominant
        conditions characterized by skeletal dysplasia, short stature, and
        sensorial defects.
      explanation: >-
        Supports COL2A1 variants acting through the collagen the gene encodes.
        PARTIAL, and the edge is typed INDIRECT_UNKNOWN_INTERMEDIATES, because no
        cited source reports a structural or biochemical study of the R275C
        protein itself.
- name: Defective Type II Collagen Fibril in Cartilage Matrix
  biological_scale: TISSUE
  description: >-
    Type II collagen is the principal fibrillar constituent of hyaline cartilage,
    including articular cartilage and the vertebral growth plate. A structurally
    abnormal alpha-1(II) chain degrades the load-bearing collagen network of that
    matrix. The tissue distribution of the resulting disease follows the tissues
    in which type II collagen is load-bearing, which is why the vertebral bodies,
    the appendicular joints and the metatarsals are affected while the eye and
    palate — also type II collagen tissues, but affected in the other COL2A1
    disorders — are spared here.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: ABNORMAL
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Curated with `mechanism_confidence: HYPOTHETICAL` on purpose, but the reason
    is narrower than it first appears. Recombinant work on this exact
    substitution (PMID:29439465, where the allele is written R75C in mature-helix
    numbering rather than R275C in precursor numbering) has measured several of
    the properties that might have been expected to be unknown: the mutant chain
    folds correctly by circular dichroism, retains trypsin resistance, traffics
    normally from ER to Golgi, and triggers neither the unfolded-protein response
    nor apoptosis. Its melting temperature is 2.5 degrees Celsius below wild type,
    which the authors read as a slight structural difference. What remains
    unmeasured is the state of the fibril and the matrix in patient cartilage, and
    the tissue selectivity of the disease. The node stays HYPOTHETICAL for that
    reason, not for want of any biophysics.
  evidence:
  - reference: PMID:19764028
    reference_title: "Czech dysplasia occurring in a Japanese family."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      coding for the triple helical domain of the alpha 1 chain of the type II
      collagen
    explanation: >-
      Places the lesion in the structural domain of the cartilage collagen.
      PARTIAL because it establishes the location of the variant, not the state
      of the fibril.
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      including Czech dysplasia metatarsal type (R75C)
    explanation: >-
      Establishes that the R75C substitution studied in this recombinant work is
      the Czech dysplasia allele, i.e. R275C in precursor numbering.
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      suggesting slight structural differences even though these changes were not
      pronounced enough to loose trypsin resistance
    explanation: >-
      A 2.5 degree Celsius melting-temperature reduction with retained trypsin
      resistance. PARTIAL because it establishes a measurable but slight
      destabilization of the recombinant molecule, not a defective fibril in
      cartilage.
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      demonstrating that the intracellular trafficking of these proteins from ER
      to Golgi apparatus is not affected by the mutation
    explanation: >-
      Refutes an intracellular-retention mechanism for this allele, which is why
      the pathograph routes the lesion through the extracellular matrix rather
      than through ER stress.

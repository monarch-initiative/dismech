genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  association: Heterozygous recurrent p.Arg275Cys substitution
  relationship_type: CAUSATIVE
  features: >-
    Czech dysplasia is, so far, allelically homogeneous: every molecularly
    confirmed patient carries the same COL2A1 c.823C>T (p.Arg275Cys) change in
    exon 13. This is unusual among the COL2A1 disorders, where over 400 distinct
    variants are recorded and one third are glycine substitutions in the G-X-Y
    repeat. The allele has arisen independently rather than descending from a
    single European founder, since it was found in a Japanese family after the
    first 11 reported families were all of European ancestry.
  evidence:
  - reference: PMID:26443184
    reference_title: "Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.(Arg275Cys) substitution is found in all patients with
      COL2A1-associated Czech dysplasia.
    explanation: >-
      A review of over 700 COL2A1 patients reports this allele in every Czech
      dysplasia case, which is the strongest available support for allelic
      homogeneity.
  - reference: PMID:18553548
    reference_title: "Czech dysplasia: report of a large family and further delineation of the phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, Czech dysplasia is possibly caused exclusively by the R275C mutation,
      which is a unique situation among the COL2A1 disorders.
    explanation: >-
      Records the exclusivity claim in the hedged form its authors used
      ("possibly"), which is why this item is PARTIAL rather than SUPPORT.
  - reference: PMID:19764028
    reference_title: "Czech dysplasia occurring in a Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, this report provides novel evidence for the independent
      occurrence of Czech dysplasia among the populations.
    explanation: >-
      Refutes a single-founder explanation for the recurrent allele and supports
      independent recurrence.

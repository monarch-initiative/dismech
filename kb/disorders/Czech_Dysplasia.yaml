genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  association: Heterozygous recurrent p.Arg275Cys substitution
  relationship_type: CAUSATIVE
  features: >-
    Czech dysplasia is, so far, allelically homogeneous: every molecularly
    confirmed patient carries the same COL2A1 c.823C>T (p.Arg275Cys) change in
    exon 13. This is unusual among the COL2A1 disorders, where over 400 distinct
    variants are recorded and one third are glycine substitutions in the G-X-Y
    repeat. The allele has arisen independently rather than descending from a
    single European founder, since it was found in a Japanese family after the
    first 11 reported families were all of European ancestry.
  evidence:
  - reference: PMID:26443184
    reference_title: "Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.(Arg275Cys) substitution is found in all patients with
      COL2A1-associated Czech dysplasia.
    explanation: >-
      A review of over 700 COL2A1 patients reports this allele in every Czech
      dysplasia case, which is the strongest available support for allelic
      homogeneity.
  - reference: PMID:18553548
    reference_title: "Czech dysplasia: report of a large family and further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, Czech dysplasia is possibly caused exclusively by the R275C mutation,
      which is a unique situation among the COL2A1 disorders.
    explanation: >-
      Records the allelic-exclusivity hypothesis in the hedged phrasing used by
      the authors ("possibly caused exclusively by the R275C mutation").
  - reference: PMID:19764028
    reference_title: "Czech dysplasia occurring in a Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, this report provides novel evidence for the independent
      occurrence of Czech dysplasia among the populations.
    explanation: >-
      Refutes a single-founder explanation for the recurrent allele and supports
      independent recurrence.
progression:
- phase: Early-onset arthropathy
  notes: >-
    Joint symptoms begin early and progress, which is what distinguishes the
    disorder from idiopathic osteoarthritis and drives the frequent
    misdiagnosis as an inflammatory arthritis.
  evidence:
  - reference: PMID:17726487
    reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Czech dysplasia metatarsal type is an autosomal-dominant disorder
      characterized by an early-onset, progressive spondyloarthropathy with
      normal stature.
    explanation: Establishes early onset and progression as intrinsic to the disorder.
diagnosis:
- name: Targeted COL2A1 Exon 13 Sequencing
  description: >-
    Because a single recurrent allele accounts for the molecularly confirmed
    cases, targeted sequencing of COL2A1 exon 13 is an efficient first-line test,
    with sequencing of the remaining exons reserved for cases in which R275C is
    not found. A negative R275C result in a patient with disproportionate short
    stature should prompt reconsideration of the diagnosis rather than continued
    pursuit of Czech dysplasia.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:17726487
    reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted sequencing of exon 13 of the COL2A1 gene was performed, followed by
      sequencing of the remaining exons in case the R275C mutation was not
      identified.
    explanation: Describes the tiered sequencing strategy used to establish the diagnosis.
- name: Clinical and Radiographic Differentiation from Other Type II Collagenopathies
  description: >-
    Normal stature together with the absence of ocular and orofacial anomalies
    distinguishes Czech dysplasia from the other COL2A1 disorders, in which short
    stature and sensorial or palatal involvement are typical. In one originally
    reported patient, disproportionate short stature plus a different COL2A1
    variant (Y1391C) reassigned the diagnosis to spondyloperipheral dysplasia.
  diagnosis_term:
    preferred_term: skeletal radiography and clinical phenotype evaluation
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:17726487
    reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the identification of the Y1391C mutation in this patient with
      disproportionate short stature made the diagnosis of spondyloperipheral
      dysplasia (SPD) more probable.
    explanation: >-
      A worked example of the differential: stature plus genotype reassigned the
      diagnosis away from Czech dysplasia.
  - reference: ORPHA:137678
    reference_title: "Spondyloepiphyseal dysplasia with metatarsal shortening"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in the absence of ophthalmologic, cleft palate, and height anomalies
    explanation: >-
      Orphanet's own definition makes the three negative features part of the
      disease definition rather than incidental observations, which is what makes
      them usable as discriminators.
discussions:
- discussion_id: gap_r275c_cartilage_matrix_and_tissue_selectivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Type II Collagen Fibril in Cartilage Matrix
  prompt: >-
    Given that the R275C chain folds, traffics and is secreted essentially
    normally, how does it damage cartilage — and why does it spare the eye and
    palate that other COL2A1 alleles affect?
  rationale: >-
    Recombinant work on this substitution (PMID:29439465) has removed several
    candidate explanations rather than supplying one. The mutant chain folds
    correctly, keeps trypsin resistance, moves from ER to Golgi normally, and
    provokes neither XBP-1 splicing nor caspase-3 activation, so intracellular
    retention, ER stress and chondrocyte apoptosis are not the route here. The
    authors conclude the allele "might cause a disease predominantly via
    extracellular interference". A 2.5 degree Celsius fall in melting temperature
    is the only measured abnormality, and it is slight. What is still missing is
    any observation from patient cartilage: fibril architecture, cross-linking,
    matrix composition, or how a molecule that behaves nearly normally in a
    recombinant system produces a severe early arthropathy. The tissue
    selectivity is equally unexplained — the eye and palate are type II collagen
    tissues and are spared by this allele while other COL2A1 alleles affect them.
    Both facts are why the fibril node keeps `mechanism_confidence: HYPOTHETICAL`
    and an INDIRECT_UNKNOWN_INTERMEDIATES edge.
  evidence:
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      neither induce ER stress nor apoptosis and might cause a disease
      predominantly via extracellular interference
    explanation: >-
      The authors' own conclusion for this allele, which is what narrows the open
      question to the extracellular compartment.
  proposed_experiments:
  - experiment_id: exp_czech_r275c_fibril_ultrastructure
    name: Ultrastructural and biochemical analysis of R275C patient cartilage
    description: >-
      Examine collagen fibril diameter, packing and cross-linking in articular
      cartilage obtained at arthroplasty from an R275C carrier, against
      age-matched non-dysplastic controls, and measure the proportion of mutant
      chain incorporated into fibrils versus remaining soluble.
    decision_criterion: >-
      Altered fibril architecture with the mutant chain incorporated would upgrade
      the fibril node from HYPOTHETICAL to established and confirm the
      extracellular-interference model. Normal fibril architecture would move the
      explanation to the interactions the fibril makes with other matrix
      components rather than to the fibril itself. An intracellular-retention
      result is not treated as a live branch here, because PMID:29439465 measured
      normal ER-to-Golgi trafficking and no unfolded-protein response for this
      substitution.
  - experiment_id: exp_czech_r275c_tissue_selectivity
    experiment_design: TARGETED_PERTURBATION
    name: Comparative matrix assay across type II collagen tissues
    description: >-
      Compare mutant-chain incorporation and matrix integrity across articular
      cartilage, growth-plate cartilage, vitreous and palatal tissue in a knock-in
      model carrying the orthologous substitution, to test whether sparing of
      ocular and orofacial structures reflects tissue-specific tolerance.
    decision_criterion: >-
      Matrix disruption confined to skeletal tissues would explain the clinical
      sparing structurally. Uniform disruption would mean the sparing is
      functional or compensatory and needs a different explanation, most likely in
      the differing mechanical demands placed on those matrices.
  - experiment_id: exp_czech_r275c_unpaired_cysteine_interactions
    name: Test for aberrant disulfide bonding of the introduced cysteine
    description: >-
      Determine, in secreted recombinant R275C collagen II and in patient-derived
      material, whether the introduced cysteine forms intermolecular disulfide
      bonds with other matrix components, using non-reducing gels and
      cross-linking mass spectrometry.
    decision_criterion: >-
      Identified aberrant partners would give the extracellular-interference
      hypothesis a concrete molecular form and a candidate target. No abnormal
      bonding would push the explanation towards altered fibril packing driven by
      the reduced thermal stability alone.

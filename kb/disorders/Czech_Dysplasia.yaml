discussions:
- discussion_id: gap_r275c_cartilage_matrix_and_tissue_selectivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Type II Collagen Fibril in Cartilage Matrix
  prompt: >-
    Given that the R275C chain folds, traffics and is secreted essentially
    normally, how does it damage cartilage — and why does it spare the eye and
    palate that other COL2A1 alleles affect?
  rationale: >-
    Recombinant work on this substitution (PMID:29439465) has removed several
    candidate explanations rather than supplying one. The mutant chain folds
    correctly, keeps trypsin resistance, moves from ER to Golgi normally, and
    provokes neither XBP-1 splicing nor caspase-3 activation, so intracellular
    retention, ER stress and chondrocyte apoptosis are not the route here. The
    authors conclude the allele "might cause a disease predominantly via
    extracellular interference". A 2.5 degree Celsius fall in melting temperature
    is the only measured abnormality, and it is slight. What is still missing is
    any observation from patient cartilage: fibril architecture, cross-linking,
    matrix composition, or how a molecule that behaves nearly normally in a
    recombinant system produces a severe early arthropathy. The tissue
    selectivity is equally unexplained — the eye and palate are type II collagen
    tissues and are spared by this allele while other COL2A1 alleles affect them.
    Both facts are why the fibril node keeps `mechanism_confidence: HYPOTHETICAL`
    and an INDIRECT_UNKNOWN_INTERMEDIATES edge.
  evidence:
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      neither induce ER stress nor apoptosis and might cause a disease
      predominantly via extracellular interference
    explanation: >-
      The authors' own conclusion for this allele, which is what narrows the open
      question to the extracellular compartment.
  proposed_experiments:
  - experiment_id: exp_czech_r275c_fibril_ultrastructure
    name: Ultrastructural and biochemical analysis of R275C patient cartilage
    description: >-
      Examine collagen fibril diameter, packing and cross-linking in articular
      cartilage obtained at arthroplasty from an R275C carrier, against
      age-matched non-dysplastic controls, and measure the proportion of mutant
      chain incorporated into fibrils versus remaining soluble.
    decision_criterion: >-
      Altered fibril architecture with the mutant chain incorporated would upgrade
      the fibril node from HYPOTHETICAL to established and confirm the
      extracellular-interference model. Normal fibril architecture would move the
      explanation to the interactions the fibril makes with other matrix
      components rather than to the fibril itself. An intracellular-retention
      result is not treated as a live branch here, because PMID:29439465 measured
      normal ER-to-Golgi trafficking and no unfolded-protein response for this
      substitution.
  - experiment_id: exp_czech_r275c_tissue_selectivity
    name: Comparative matrix assay across type II collagen tissues
    description: >-
      Compare mutant-chain incorporation and matrix integrity across articular
      cartilage, growth-plate cartilage, vitreous and palatal tissue in a knock-in
      model carrying the orthologous substitution, to test whether sparing of
      ocular and orofacial structures reflects tissue-specific tolerance.
    decision_criterion: >-
      Matrix disruption confined to skeletal tissues would explain the clinical
      sparing structurally. Uniform disruption would mean the sparing is
      functional or compensatory and needs a different explanation, most likely in
      the differing mechanical demands placed on those matrices.
  - experiment_id: exp_czech_r275c_unpaired_cysteine_interactions
    name: Test for aberrant disulfide bonding of the introduced cysteine
    description: >-
      Determine, in secreted recombinant R275C collagen II and in patient-derived
      material, whether the introduced cysteine forms intermolecular disulfide
      bonds with other matrix components, using non-reducing gels and
      cross-linking mass spectrometry.
    decision_criterion: >-
      Identified aberrant partners would give the extracellular-interference
      hypothesis a concrete molecular form and a candidate target. No abnormal
      bonding would push the explanation towards altered fibril packing driven by
      the reduced thermal stability alone.

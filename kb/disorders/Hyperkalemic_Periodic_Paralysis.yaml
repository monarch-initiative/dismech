- name: Sustained Sarcolemmal Depolarization
  biological_scale: CELLULAR
  description: >-
    The resting potential fails to be maintained and settles at a stable
    depolarized value of about -45 mV instead of the normal -85 mV. This is the
    pivotal node: it is stable on the timescale of hours, which is what
    distinguishes an attack of paralysis from the millisecond-scale gating
    changes that cause myotonia alone.

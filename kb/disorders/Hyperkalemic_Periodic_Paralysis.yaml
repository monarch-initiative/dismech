- name: Potassium Efflux and Extracellular Potassium Accumulation
  biological_scale: ORGANISM
  description: >-
    Potassium leaves the depolarized and repetitively firing fibre and
    accumulates both locally in the transverse tubules and systemically as a
    rise in serum potassium during the attack. This node closes a feed-forward
    loop: the potassium it raises is the very stimulus that reveals the
    inactivation defect and deepens the depolarization that produced it. It is
    also the reason an exogenous potassium load can start the cycle from
    outside.

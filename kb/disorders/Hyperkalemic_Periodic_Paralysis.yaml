pathophysiology:
- name: SCN4A Gain-of-Function Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in SCN4A, encoding the pore-forming alpha
    subunit of the skeletal-muscle voltage-gated sodium channel Nav1.4, is the
    sole established genetic lesion. T704M and M1592V are the two most common
    alleles. The variants act by gain of function rather than by loss of
    channel, which is why null alleles of SCN4A do not cause periodic paralysis.
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  genetic_context:
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous germline missense substitutions in SCN4A whose functional
      consequence, measured by heterologous expression, is a gain of function
      for Nav1.4 gating.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:

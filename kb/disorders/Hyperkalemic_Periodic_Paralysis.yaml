    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Across the narrow clinical spectrum from PMC to HyperPP, and everything in
      between, the gene defects are missense mutations of SCN4A. No other
      causative gene has been implicated for HyperPP/PMC.
    explanation: >-
      Establishes SCN4A missense variation as the only causative lesion for this
      disease.
  - reference: PMID:25880512
    reference_title: Channelopathies of skeletal muscle excitability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Similarly, T704M causes HyperPP with late-onset permanent myopathy
    explanation: >-
      Names the most common HyperPP allele and its genotype-phenotype
      correlation.
  downstream:
  - target: Impaired Nav1.4 Inactivation and Persistent Sodium Current
    causal_link_type: DIRECT
    description: >-
      The missense substitution changes channel gating, and the functional
      consequence is measured directly in expression systems.
- name: Impaired Nav1.4 Inactivation and Persistent Sodium Current
  biological_scale: MOLECULAR
  description: >-
    Mutant Nav1.4 channels fail to inactivate completely. The wild-type channel
    leaves a barely perceptible persistent current of about 0.2% of the
    transient peak; HyperPP alleles raise it to 1 to 4%, a five- to twenty-fold
    relative increase in a standing inward sodium current. Several HyperPP
    alleles additionally disrupt slow inactivation, which removes the safeguard
    that would otherwise curtail the anomalous steady-state current.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: Nav1.4 voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:25880512
    reference_title: Channelopathies of skeletal muscle excitability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mutations associated with HyperPP disrupt the completeness of fast
      inactivation, which results in persistent Na+ currents of 1 to 4%.
    explanation: >-
      States the specific biophysical defect and the size of the resulting
      persistent current, synthesized from voltage-clamp studies.
  - reference: PMID:25880512
    reference_title: Channelopathies of skeletal muscle excitability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Voltage-clamp studies have demonstrated defects of slow inactivation for
      the two most common mutations found in HyperPP (T704M and M1592V)
    explanation: >-
      Records the additional slow-inactivation defect in the two commonest
      alleles.
  - reference: PMID:36628799
    reference_title: >-
      Hyperkalemic periodic paralysis associated with a novel missense variant
      located in the inner pore of Nav1.4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, steady-state slow inactivation in V792G was impaired with larger
      residual currents in comparison with wild-type Nav1.4.
    explanation: >-
      Whole-cell patch clamp in HEK293T cells directly measures the residual
      (persistent) current of a HyperPP allele against wild type.
  - reference: PMID:21708955
    reference_title: >-
      Na+,K+-pump stimulation improves contractility in isolated muscles of mice

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-body muscle MRI analysis revealed muscle atrophy and fatty
      infiltration in hyperKPP patients, especially in older individuals.
    explanation: >-
      Imaging evidence in genetically confirmed T704M patients establishes the
      structural myopathy and its age dependence.
  - reference: PMID:26256659
    reference_title: >-
      Whole-Body Muscle MRI in Patients with Hyperkalemic Periodic Paralysis
      Carrying the SCN4A Mutation T704M: Evidence for Chronic Progressive
      Myopathy with Selective Muscle Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle involvement followed a selective pattern, primarily affecting the
      posterior compartment of the lower leg and anterior thigh muscles.
    explanation: >-
      Documents the selective distribution that makes this myopathy
      recognizable.
  downstream:
  - target: Permanent Proximal Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Atrophy and fatty replacement present as fixed weakness between attacks.
phenotypes:
- name: Episodic Flaccid Weakness
  category: Clinical
  description: >-
    Recurrent attacks of flaccid limb weakness or paralysis, typically beginning
    in the first decade, commonly on waking before breakfast, and lasting from
    about a quarter of an hour to a few hours.
  phenotype_term:
    preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
    temporality: RECURRENT
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A spontaneous attack commonly starts in the morning before breakfast, lasts
      for 15 minutes to one hour, and then passes.
    explanation: >-
      GeneReviews describes the timing and duration of a typical spontaneous
      attack.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Weakness severe enough to impair mobility typical lasts for 30 min to a few
      hours, although full recovery may not occur for days.
    explanation: >-
      Gives the duration of functionally significant weakness and the slower tail
      of recovery.
- name: Hyperkalemia During Attacks
  category: Laboratory
  description: >-
    Serum potassium rises during an attack, above 5 mmol/L or by at least 1.5
    mmol/L from baseline, and is normal between attacks. An ictal value above
    4.5 mmol/L points to HyperPP, but a normal ictal potassium does not exclude
    the diagnosis.
  phenotype_term:
    preferred_term: Ictal hyperkalemia
    term:
      id: HP:6000833
      label: Hyperkalemia while symptomatic
    temporality: ACUTE
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ictal serum K+ may be low (< 3.5 mmol/L) suggesting HypoPP, high (> 4.5
      mmol/L) suggestive of HyperPP, or in the normal range which does not exclude
      a diagnosis of periodic paralysis.
    explanation: >-
      Gives the ictal serum potassium threshold that points to HyperPP and states
      that a normal value does not exclude the diagnosis.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Between episodes of weakness, the serum K+ is usually in the normal range in
      all forms of familial periodic paralysis.
    explanation: >-
      Establishes that the biochemical abnormality is confined to attacks.
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hyperkalemia (serum potassium concentration >5 mmol/L)
    explanation: >-
      GeneReviews gives the diagnostic potassium threshold used to define an
      attack.
  reports_on:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The ictal rise in serum potassium is the accessible readout of the
      potassium shift out of depolarized muscle.
- name: Myotonia
  category: Musculoskeletal
  description: >-
    Muscle stiffness from delayed relaxation, present in most patients and
    typically most prominent around the onset of an attack of weakness. It may be
    symptomatic or detectable only by percussion or needle EMG.
  phenotype_term:
    preferred_term: Myotonia
    term:
      id: HP:0002486
      label: Myotonia
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with hyperPP frequently have myotonia (muscle stiffness),
      especially around the time of an episode of weakness.
    explanation: >-
      GeneReviews states the frequency of myotonia and its temporal relation to
      attacks.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Between attacks, approximately half of patients with HyperPP experience
      muscle stiffness arising from myotonia or paramyotonia that does not impede
      voluntary movements.
    explanation: >-
      Quantifies interictal stiffness and notes it is usually not
      function-limiting.
- name: Paramyotonia
  category: Musculoskeletal
  description: >-
    Muscle stiffness that is aggravated by cold and by exercise, rather than
    relieved by repeated contraction as in the warm-up myotonias. It occurs in
    close to half of patients and is the clinical feature that places HyperPP on
    a continuum with paramyotonia congenita.
  phenotype_term:
    preferred_term: Paramyotonia (cold- and exercise-aggravated muscle stiffness)
    term:
      id: HP:0003552
      label: Muscle stiffness
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paramyotonia (muscle stiffness aggravated by cold and exercise) is present
      in about 45% of affected individuals.
    explanation: >-
      GeneReviews defines paramyotonia and gives its frequency in HyperPP.
  notes: >-
    HPO has no term for paramyotonia as distinct from myotonia; searching the
    configured OLS adapter with `runoak -i ols:hp search "paramyotonia"` returns
    nothing. The binding is therefore the general `Muscle stiffness` term, with
    the cold- and exercise-aggravated character carried in `preferred_term` and
    in the cited quote.
- name: Permanent Proximal Muscle Weakness
  category: Musculoskeletal
  description: >-
    Fixed, slowly progressive proximal weakness that develops in most patients
    after the fourth decade and may impair ambulation. It is the main source of
    long-term disability and its development is not strictly tied to attack
    frequency.
  phenotype_term:
    preferred_term: Progressive proximal muscle weakness
    term:
      id: HP:0009073
      label: Progressive proximal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For many patients the frequency of attacks diminishes with age, and is
      replaced by a chronic state of mild weakness that later progresses to
      myopathy with permanent muscle weakness, especially of proximal muscles,
      and may cause loss of ambulation
    explanation: >-
      Describes the proximal distribution, the progressive course, and the
      functional endpoint.
  - reference: PMID:26256659
    reference_title: >-
      Whole-Body Muscle MRI in Patients with Hyperkalemic Periodic Paralysis
      Carrying the SCN4A Mutation T704M: Evidence for Chronic Progressive
      Myopathy with Selective Muscle Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A proportion of affected individuals develop fixed or chronic progressive
      weakness that results in significant disability.
    explanation: >-
      Confirms fixed weakness as a recognized disabling outcome in HyperPP.
- name: Weakness of Ocular, Bulbar, Respiratory and Trunk Muscles
  category: Clinical
  description: >-
    Severe attacks are not confined to the limbs and may involve the extraocular,
    pharyngeal, respiratory, and trunk muscles. Respiratory involvement is the
    reason depolarizing anaesthetic agents are contraindicated.
  phenotype_term:
    preferred_term: Episodic respiratory muscle weakness
    term:
      id: HP:0004889
      label: Intermittent episodes of respiratory insufficiency due to muscle weakness
    temporality: ACUTE
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      attacks of flaccid limb weakness (which may also include weakness of the
      muscles of the eyes, throat, breathing muscles, and trunk)
    explanation: >-
      GeneReviews names the extra-limb muscle groups that severe attacks can
      involve, including the respiratory muscles.
  notes: >-
    The bound HPO term names episodic respiratory insufficiency specifically,
    which is the most consequential element of this phenotype, while the curated
    node also covers ocular, bulbar, and trunk involvement as the cited quote
    lists them.
genetic:
- name: SCN4A
  gene_term:
    preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  association: >-
    Heterozygous gain-of-function missense variants in SCN4A are the sole
    established cause. T704M and M1592V are the two commonest alleles.
  relationship_type: CAUSATIVE
  features: >-
    Only missense substitutions cause the disease. Null alleles of SCN4A do not,
    because the mechanism requires an anomalous current rather than an absent
    channel, and a variant in an intron or regulatory element cannot produce one.
    This constrains interpretation of variants of uncertain significance in a
    HyperPP gene panel.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Across the narrow clinical spectrum from PMC to HyperPP, and everything in
      between, the gene defects are missense mutations of SCN4A. No other
      causative gene has been implicated for HyperPP/PMC.
    explanation: >-
      Establishes SCN4A as the only causative gene and missense change as the
      only variant class.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Likewise, null mutations of SCN4A or CACNA1S do not cause periodic
      paralysis, and individuals with a single intact copy of these genes have no
      muscle signs or symptoms
    explanation: >-
      Supports the variant-interpretation constraint that haploinsufficiency is
      not a disease mechanism here.
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of hyperPP is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in SCN4A identified by
      molecular genetic testing.
    explanation: >-
      GeneReviews defines the molecular diagnostic criterion, naming the gene and
      the heterozygous state.
  - reference: PMID:30931713
    reference_title: >-
      Overlap of periodic paralysis and paramyotonia congenita caused by SCN4A
      gene mutations two family reports and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first proband and part of his family with the overlap of PMC and
      hyperkalemic periodic paralysis (HyperPP) has been identified as c.2111C > T
      (T704M) substitution of the gene SCN4A.
    explanation: >-
      Family-level evidence for the T704M allele in HyperPP, here in a kindred
      that also shows paramyotonia.
  notes: >-
    Genotype-phenotype correlation is real but not absolute: M1592V has produced
    HyperPP in some members of a single family and paramyotonia congenita in
    others, and no modifier gene has been established.
environmental:
- name: Ingestion of potassium-rich food or potassium-containing medication
  description: >-
    A dietary or medicinal potassium load is the single commonest attack trigger.
    It acts by raising extracellular potassium enough to depolarize the fibre
    modestly, which is what exposes the inactivation defect, so this exposure
    enters the pathograph at exactly the point the disease's own feed-forward loop
    turns on.
  exposure_term:
    preferred_term: exposure to potassium via ingestion
    term:
      id: ECTO:0900037
      label: exposure to potassium via ingestion
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major attack trigger is eating potassium-rich foods
    explanation: >-
      GeneReviews names dietary potassium as the principal precipitant.
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provoking/worsening of an attack by oral potassium intake
    explanation: >-
      Oral potassium provocation is part of the diagnostic definition, which is
      the strongest available statement that the exposure causes attacks.
  influences_mechanisms:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An exogenous potassium load raises extracellular potassium from outside the
      muscle, substituting for the endogenous efflux that would otherwise have to
      start the cycle.
    evidence:
    - reference: PMID:25880512
      reference_title: Channelopathies of skeletal muscle excitability.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The requirement for elevated extracellular K+ (interstitial or T-tubular)
        to mildly depolarize the fiber and reveal the inactivation defect explains
        why attacks may be triggered or aggravated by potassium ingestion in
        HyperPP.
      explanation: >-
        States the mechanistic link from ingested potassium through extracellular
        potassium to unmasking of the channel defect.
- name: Rest after strenuous exercise
  description: >-
    Weakness characteristically appears within minutes of stopping vigorous
    exercise, while the working muscle is spared. Mild activity at the onset of
    an attack is protective, which is why the exposure is the rest and not the
    exercise.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sustained vigorous exercise is commonly reported to be a trigger, with
      preserved strength of active muscles and weakness occurring within minutes
      of stopping to rest.
    explanation: >-
      Describes the exposure precisely, including the sparing of the muscles that
      keep working.
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      other triggers include: cold environment; rest after exercise, stress, or
      fatigue; alcohol; hunger; and changes in activity level.
    explanation: >-
      GeneReviews lists rest after exercise among the established precipitants.
  influences_mechanisms:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Vigorous contraction loads the interstitial and transverse-tubular spaces
      with potassium; on stopping, that potassium is no longer being cleared by
      the activity-dependent mechanisms that protected the working muscle.
    evidence:
    - reference: PMID:21708955
      reference_title: >-
        Na+,K+-pump stimulation improves contractility in isolated muscles of mice
        with hyperkalemic periodic paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These observations may explain how mild exercise helps locally to prevent
        severe weakness during an attack of HyperKPP.
      explanation: >-
        The mouse experiments show repeated stimulation restoring force, which
        supports activity itself, rather than rest, being the protective state for
        the potassium handling this link depends on.
- name: Cold exposure
  description: >-
    A cold environment both triggers attacks of weakness and aggravates the
    stiffness of paramyotonia, and avoiding it is part of standard preventive
    advice.
  exposure_term:
    preferred_term: cold exposure
    term:
      id: XCO:0000306
      label: cold exposure
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The onset of attacks is usually in childhood and episodes are triggered by
      cold environments, rest after vigorous exercise, stress, fasting, ingesting
      of K-rich foods, or alcohol
    explanation: >-
      Lists cold environment first among the established attack triggers.
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paramyotonia (muscle stiffness aggravated by cold and exercise) is present
      in about 45% of affected individuals.
    explanation: >-
      Supports cold as an aggravator of the myotonic arm of the phenotype in
      nearly half of patients.
  influences_mechanisms:
  - target: Skeletal Muscle Membrane Hyperexcitability and Myotonic Discharges
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cooling worsens the stiffness arm of the phenotype. The intervening steps
      between muscle temperature and mutant-channel gating are not traced by the
      sources cited here, so the link is recorded as indirect.
    evidence:
    - reference: PMID:20301669
      reference_title: Hyperkalemic Periodic Paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with hyperPP frequently have myotonia (muscle stiffness),
        especially around the time of an episode of weakness. Paramyotonia (muscle
        stiffness aggravated by cold and exercise)
      explanation: >-
        Ties cold aggravation specifically to the stiffness phenotype that this
        mechanism node produces.
- name: Fasting
  description: >-
    Going without food precipitates attacks, and the corresponding preventive
    measure is frequent carbohydrate-rich meals rather than avoidance of any
    single food.
  exposure_term:
    preferred_term: fasting
    term:
      id: XCO:0000102
      label: fasting
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperkalemic attacks of weakness can be prevented by frequent meals rich in
      carbohydrates
    explanation: >-
      The preventive measure is the direct counterpart of the fasting trigger, and
      GeneReviews states it as standard management.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      avoid fasting and use a carbohydrate snack to abort an attack of HyperPP
    explanation: >-
      Names fasting explicitly as the exposure to avoid in HyperPP, and
      carbohydrate as the abortive measure.
  influences_mechanisms:
  - target: Sustained Sarcolemmal Depolarization
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fasting precipitates attacks and a carbohydrate load aborts them, which
      implicates the insulin-driven shift of potassium into muscle as the
      intermediate; the sources cited here state the clinical relation rather than
      the intervening steps.
    evidence:
    - reference: PMID:20301669
      reference_title: Hyperkalemic Periodic Paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At the onset of weakness, attacks may be prevented or aborted with mild
        exercise and/or oral ingestion of carbohydrates
      explanation: >-
        That carbohydrate ingestion aborts an incipient attack is the clinical
        evidence that the fasting state permits the depolarization this node
        describes.
animal_models:
- name: Scn4a M1592V knock-in mouse
  species: Mouse
  genotype: Scn4a M1592V heterozygous knock-in
  background: FVB.129S4(B6)-Scn4atm1.1Ljh/J
  publication: PMID:21708955
  genes:
  - preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  description: >-
    A knock-in mouse carrying the substitution corresponding to human M1592V, one
    of the two commonest HyperPP alleles. It reproduces the resting
    depolarization, the sodium overload, the myotonia, and the potassium
    sensitivity, but not spontaneous paralytic attacks.
  modeled_mechanisms:
  - target: Resting Intracellular Sodium Overload
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Resting mutant muscle shows greatly increased tetrodotoxin-suppressible
      sodium influx, a raised intracellular sodium concentration, and a resting
      membrane potential depolarized by 16 mV that tetrodotoxin repolarizes.
    limitations: >-
      Measurements are made in isolated soleus and extensor digitorum longus at
      30 degrees Celsius, so absolute influx rates are not directly transferable
      to intact human muscle.
    readouts:
    - name: Na+,K+-pump-mediated 86Rb uptake in resting soleus
      target: Resting Intracellular Sodium Overload
      direction: INCREASED
      interpretation: >-
        Raised pump-mediated potassium uptake is the compensatory response to the
        resting sodium load and is the quantitative signature of that load.
      evidence:
      - reference: PMID:21708955
        reference_title: >-
          Na+,K+-pump stimulation improves contractility in isolated muscles of
          mice with hyperkalemic periodic paralysis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Na(+),K(+) pump-mediated (86)Rb uptake was 83% larger than in WT.
        explanation: >-
          Quantifies the increase in pump-mediated uptake in mutant muscle.
    evidence:
    - reference: PMID:21708955
      reference_title: >-
        Na+,K+-pump stimulation improves contractility in isolated muscles of mice
        with hyperkalemic periodic paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The results confirm that the functional disorders of skeletal muscles in
        HyperKPP are secondary to increased Na(+) influx and show that
        contractility can be restored by acute stimulation of the Na(+),K(+) pumps.
      explanation: >-
        The study's own conclusion is that the model's contractile defect is
        secondary to the sodium influx this node describes.
  - target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Mutant muscle is markedly less excitable than wild type, requiring stronger
      and longer stimuli to reach maximal force, and loses force dramatically when
      challenged with 10 mM extracellular potassium.
    limitations: >-
      The mouse does not have spontaneous attacks of weakness; the loss of force
      has to be provoked by an in vitro potassium challenge, so the model
      reproduces the susceptibility rather than the episodic disease.
    readouts:
    - name: Tetanic force during 10 mM potassium challenge
      target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
      direction: DECREASED
      interpretation: >-
        Accelerated loss of tetanic force under a potassium challenge is the
        functional readout of potassium-provoked inexcitability.
      evidence:
      - reference: PMID:21708955
        reference_title: >-
          Na+,K+-pump stimulation improves contractility in isolated muscles of
          mice with hyperkalemic periodic paralysis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In muscles from mutant mice, the rate of force reduction as measured over
          the first 10 min after exposure to 10 mM K+ was 760% faster than in
          muscles from WT.
        explanation: >-
          Quantifies the potassium sensitivity of force in mutant versus wild-type
          muscle.
    - name: Tetanic force after salbutamol
      target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
      direction: RESTORED
      interpretation: >-
        Restoration of force by a beta-agonist links the model's inexcitability to
        the therapy used in patients.
      evidence:
      - reference: PMID:21708955
        reference_title: >-
          Na+,K+-pump stimulation improves contractility in isolated muscles of
          mice with hyperkalemic periodic paralysis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          When added to muscles exposed to 10 mM K+, 10-6 M salbutamol restored
          tetanic force to the same level as measured at 4 mM K+ both in WT and in
          mutant mice
        explanation: >-
          Records the rescue of force by salbutamol during a potassium challenge.
    evidence:
    - reference: PMID:21708955
      reference_title: >-
        Na+,K+-pump stimulation improves contractility in isolated muscles of mice
        with hyperkalemic periodic paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These observations indicate that in muscles from the mutants, excitability
        is lower than in muscles from WT.
      explanation: >-
        Establishes reduced fibre excitability in the model, which is the node this
        link points at.
  evidence:
  - reference: PMID:25880512
    reference_title: Channelopathies of skeletal muscle excitability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Spontaneous attacks of weakness have not been observed, but in vitro
      challenge with 10 mM K+ triggered a severe reduction of muscle force.
    explanation: >-
      States both what the model does and does not reproduce, which is the honest
      basis for treating it as partially informative.
  notes: >-
    Acetazolamide protects the mutant muscle against potassium-induced loss of
    force in this model, which is the closest thing to a mechanistic rationale for
    carbonic anhydrase inhibition in HyperPP.
- name: Equine hyperkalemic periodic paralysis (quarter horse)
  species: Horse
  genotype: >-
    Naturally occurring heterozygous SCN4A DIIIS3 phenylalanine-to-leucine
    substitution, traceable to a single founder sire
  publication: PMID:25880512
  description: >-
    A naturally occurring equine disease in American quarter horses caused by a
    single SCN4A founder mutation. It is the one HyperPP model with spontaneous
    attacks in an outbred whole organism, and it is informative precisely because
    the phenotype is variable on a near-uniform genetic background.
  modeled_mechanisms:
  - target: Sustained Sarcolemmal Depolarization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Intercostal muscle fibres from affected horses are depolarized at rest and
      repolarize to normal values on exposure to tetrodotoxin, which localizes the
      depolarizing current to sodium channels.
    limitations: >-
      The equine mutation is not one of the human HyperPP alleles, and the
      measurements are made on excised intercostal fibres rather than in vivo.
    readouts:
    - name: Resting membrane potential of intercostal muscle fibres
      target: Sustained Sarcolemmal Depolarization
      direction: DECREASED
      interpretation: >-
        A less negative resting potential that tetrodotoxin corrects is the direct
        readout of a sodium-dependent depolarization.
      evidence:
      - reference: PMID:21708955
        reference_title: >-
          Na+,K+-pump stimulation improves contractility in isolated muscles of
          mice with hyperkalemic periodic paralysis.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: BACKGROUND
        snippet: >-
          intercostal muscle fibers from horses with HyperKPP were found to be
          depolarized, and TTX induced repolarization to the level measured in
          normal horses
        explanation: >-
          Records the measurement and its reversal by sodium-channel blockade in
          excised equine muscle fibres.
    evidence:
    - reference: PMID:21708955
      reference_title: >-
        Na+,K+-pump stimulation improves contractility in isolated muscles of mice
        with hyperkalemic periodic paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Hyperkalemic periodic paralysis (HyperKPP) is a rare hereditary disease
        seen in human subjects and horses.
      explanation: >-
        Establishes that the equine condition is the same hereditary disease, which
        is what licenses treating it as a model.
  evidence:
  - reference: PMID:25880512
    reference_title: Channelopathies of skeletal muscle excitability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite this single mutation being expressed on a very homogenous genetic
      background of inbreed horses, the phenotype is variable with regard to
      severity and frequency of attacks
    explanation: >-
      The variability on a near-uniform background is the model's distinctive
      contribution: it shows that phenotypic variability in this disease is not
      accounted for by genetic background alone.
treatments:
- name: Trigger Avoidance and Frequent Carbohydrate-Rich Meals
  description: >-
    The first-line intervention. Patients avoid potassium-rich foods and
    potassium-containing medications, fasting, strenuous work, and cold, and eat
    frequent carbohydrate-rich meals. Depolarizing anaesthetic agents and
    ACE-inhibitors are also avoided.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary and trigger-avoidance counselling
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  target_mechanisms:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    description: >-
      Removing the exogenous potassium load and the fasting state keeps
      extracellular potassium below the level that unmasks the inactivation
      defect.
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperkalemic attacks of weakness can be prevented by frequent meals rich in
      carbohydrates; continuous use of a thiazide diuretic or a carbonic anhydrase
      inhibitor; and avoidance of potassium-rich medications and foods, fasting,
      strenuous work, and exposure to cold.
    explanation: >-
      GeneReviews states the whole preventive package, of which this treatment is
      the non-pharmacological part.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In individuals with HyperPP, consider recommending consumption of multiple
      small carbohydrate snacks and avoid potassium-rich foods.
    explanation: >-
      Independent review gives the same dietary recommendation specifically for
      HyperPP.
- name: Mild Exercise at Attack Onset
  description: >-
    Gentle voluntary activity at the first sign of weakness can prevent or abort
    an attack, and works locally in the muscles that are exercised. This is the
    intervention that most directly exploits the mechanism.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: mild voluntary exercise at attack onset
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  target_mechanisms:
  - target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
    description: >-
      Repeated activation restores excitability and force in mutant muscle,
      apparently by stimulating the Na+,K+-ATPase.
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the onset of weakness, attacks may be prevented or aborted with mild
      exercise and/or oral ingestion of carbohydrates, intravenously injected
      glucocorticoids, inhalation of salbutamol, or intravenous calcium gluconate.
    explanation: >-
      GeneReviews lists mild exercise first among the measures that abort an
      incipient attack.
  - reference: PMID:21708955
    reference_title: >-
      Na+,K+-pump stimulation improves contractility in isolated muscles of mice
      with hyperkalemic periodic paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      tetanic stimulation every minute caused a progressive and highly significant
      force increase of 48% in the soleus of mutant mice (P < 0.001) but no
      significant change in soleus of WT mice
    explanation: >-
      Provides the mechanistic counterpart in the knock-in mouse: repeated
      activation itself restores force, and only in mutant muscle.
  notes: >-
    The bound NCIT term, Physical Therapy, is broader than this treatment; NCIT
    has no clinical-action term for self-directed mild exercise used abortively,
    and `runoak -i ols:ncit search "l~exercise test"` returns only cardiac and
    cardiopulmonary stress-testing terms.
- name: Inhaled Salbutamol for Acute Attacks
  description: >-
    An inhaled beta-2 agonist lowers serum potassium and hastens recovery from an
    attack. The evidence base in HyperPP is case reports rather than trials, but
    the mechanism is well characterized: salbutamol stimulates the Na+,K+-ATPase,
    which clears potassium from the extracellular space and restores force.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: salbutamol
      term:
        id: CHEBI:2549
        label: albuterol
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  target_mechanisms:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    description: >-
      Beta-2 agonist stimulation of the sodium-potassium pump drives potassium
      back into muscle, which is the step the disease's feed-forward loop depends
      on.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Beta-adrenergic inhalants may be used to hasten recovery from an episode of
      HyperPP
    explanation: >-
      States the clinical indication for an inhaled beta-agonist in HyperPP
      specifically.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In case reports, salbutamol 1-2 puffs (0.1 mg) and other beta-agonists have
      shown benefits.
    explanation: >-
      Names the drug and dose while stating plainly that the human evidence is
      case-report level.
  - reference: PMID:21708955
    reference_title: >-
      Na+,K+-pump stimulation improves contractility in isolated muscles of mice
      with hyperkalemic periodic paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stimulating Na(+),K(+) pumps with salbutamol restored force in mutant soleus
      and extensor digitorum longus (EDL).
    explanation: >-
      Supplies the mechanism of the clinical effect, in the knock-in mouse model of
      this disease.
- name: Dichlorphenamide Preventive Pharmacotherapy
  description: >-
    A carbonic anhydrase inhibitor, and the only drug approved for primary
    periodic paralysis. The evidence in HyperPP specifically is weaker than the
    approval suggests: in the pivotal randomized trial the hyperkalemic substudy
    showed a lower median attack rate on dichlorphenamide that did not reach
    statistical significance, and the trialists concluded the substudy lacked the
    precision to decide the question either way.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dichlorphenamide
      term:
        id: CHEBI:101085
        label: diclofenamide
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  target_mechanisms:
  - target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
    description: >-
      Carbonic anhydrase inhibition promotes kaliuresis and a systemic acidosis;
      which of these reduces susceptibility to depolarization-induced
      inexcitability is not settled.
  evidence:
  - reference: PMID:34129236
    reference_title: >-
      Long-term efficacy and safety of dichlorphenamide for treatment of primary
      periodic paralysis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The oral carbonic anhydrase inhibitor dichlorphenamide (DCP) is approved for
      treatment of hyperkalemic and hypokalemic periodic paralyses and related
      variants.
    explanation: >-
      Records the regulatory status, which covers HyperPP explicitly.
  - reference: PMID:26865514
    reference_title: >-
      Randomized, placebo-controlled trials of dichlorphenamide in periodic
      paralysis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median attack rate was also lower in HYP participants on DCP (0.9 vs
      4.8) than in participants on placebo, but the difference in median attack
      rate was not significant (p = 0.10).
    explanation: >-
      The hyperkalemic arm showed a five-fold lower median attack rate, which
      supports the treatment only indirectly because the difference did not reach
      significance.
  - reference: PMID:26865514
    reference_title: >-
      Randomized, placebo-controlled trials of dichlorphenamide in periodic
      paralysis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These studies provide Class I evidence that DCP significantly reduces attack
      frequency in HOP but lacked the precision to support either efficacy or lack
      of efficacy of DCP in HYP.
    explanation: >-
      The trialists' own classification of evidence cuts against any claim that
      efficacy in hyperkalemic periodic paralysis has been demonstrated, which is
      why this is recorded as a refuting item beside the supporting ones.
  notes: >-
    The one-year open-label extension reported sustained reductions in attack rate,
    but it pooled the hyperkalemic and hypokalemic substudies, so it does not
    resolve the HyperPP-specific question either.
- name: Acetazolamide Preventive Pharmacotherapy
  description: >-
    The older carbonic anhydrase inhibitor, used empirically for about half a
    century at 125 to 1000 mg per day. Its most striking reported effect in
    HyperPP is on fixed weakness rather than on attacks, though that rests on
    single-patient observation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  - preferred_term: Progressive proximal muscle weakness
    term:
      id: HP:0009073
      label: Progressive proximal muscle weakness
  target_mechanisms:
  - target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
    description: >-
      In the M1592V knock-in mouse, bath acetazolamide protects against
      potassium-induced loss of force, which is the closest available mechanistic
      rationale for the drug in this disease.
    evidence:
    - reference: PMID:25880512
      reference_title: Channelopathies of skeletal muscle excitability.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Bath application of the carbonic anhydrase inhibitor acetazolamide
        protected against K+-induced loss of force
      explanation: >-
        Records the protective effect of acetazolamide on potassium-provoked
        inexcitability in the mouse model of this disease.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acetazolamide 125-1000 mg/day may be effective for chronic treatment of
      HyperPP.
    explanation: >-
      Gives the dose range and the indication for chronic preventive use in
      HyperPP.
  - reference: PMID:23473731
    reference_title: >-
      Long-term effectiveness of acetazolamide on permanent weakness in
      hyperkalemic periodic paralysis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He rapidly recovered from weakness after acetazolamide treatment. Magnetic
      resonance imaging of thighs comparing pre- and post-treatment revealed a
      significant increase in muscle bulk.
    explanation: >-
      A single T704M patient recovered from fixed weakness with an imaging
      correlate. It is one uncontrolled observation, so it supports the claim only
      indirectly.
  notes: >-
    The same source warns that some patients develop deleterious effects from
    acetazolamide, so the drug is not uniformly beneficial. How carbonic anhydrase
    inhibition works in periodic paralysis remains unsettled.
- name: Thiazide Diuretic Preventive Pharmacotherapy
  description: >-
    A potassium-wasting diuretic, usually hydrochlorothiazide 25 to 75 mg daily,
    used for chronic prevention. Potassium-sparing diuretics are contraindicated
    here, which is the mirror image of their use in hypokalemic periodic
    paralysis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrochlorothiazide
      term:
        id: CHEBI:5778
        label: hydrochlorothiazide
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  target_mechanisms:
  - target: Potassium Efflux and Extracellular Potassium Accumulation
    description: >-
      Promoting renal potassium loss lowers the extracellular potassium that
      unmasks the channel defect.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The drug of choice is hydrochlorothiazide 25 mg to 75 mg daily.41, 54
      Potassium-sparing diuretics should be avoided.
    explanation: >-
      Names the agent, the dose range, and the contraindicated diuretic class for
      HyperPP.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral K+ supplements and K-sparing diuretics (e.g. eplerenone) are used for
      HypoPP, whereas K-wasting diuretics (e.g. hydrochlorothiazide) are used for
      HyperPP
    explanation: >-
      States the opposite diuretic choice in the two periodic paralyses, which is
      the clinically consequential distinction.
- name: Mexiletine for Myotonic Stiffness
  description: >-
    A use-dependent sodium-channel blocker, used when myotonic stiffness rather
    than weakness is the dominant symptom. It targets the hyperexcitable arm of
    the phenotype, not the paralytic one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mexiletine
      term:
        id: CHEBI:6916
        label: mexiletine
  target_phenotypes:
  - preferred_term: Myotonia
    term:
      id: HP:0002486
      label: Myotonia
  target_mechanisms:
  - target: Skeletal Muscle Membrane Hyperexcitability and Myotonic Discharges
    description: >-
      Use-dependent block preferentially silences the repetitive firing that
      produces myotonia while sparing single action potentials.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If myotonic stiffness is the more problematic symptom, then use-dependent
      sodium channel blockers (e.g. mexiletine) may provide relief
    explanation: >-
      States the indication and the symptom it addresses, within a chapter covering
      HyperPP and paramyotonia congenita.
  notes: >-
    The randomized evidence for mexiletine comes from the non-dystrophic myotonias
    rather than from HyperPP cohorts, and is curated on the
    Thomsen_and_Becker_disease entry. It is cited here only as an indication.
diagnosis:
- name: SCN4A Molecular Genetic Testing
  description: >-
    Sequencing SCN4A is the first-line confirmatory test. Because only missense
    variants cause the disease, a truncating or splice variant does not support
    the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous pathogenic missense variant in SCN4A establishes the diagnosis.
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case of diagnostic uncertainty, a provocative test can be employed,
      although the availability of genetic testing and electrophysiologic studies
      largely obviates the need for such dangerous tests.
    explanation: >-
      GeneReviews states that genetic and electrophysiological testing have
      displaced provocative potassium challenge, which is itself hazardous.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genetic testing by next-generation sequencing of candidate genes (CACNA1S,
      SCN4A, and KCNJ2) is now routinely performed in the evaluation for familial
      periodic paralysis
    explanation: >-
      Confirms panel sequencing as routine practice and names the genes tested
      alongside SCN4A.
- name: Needle Electromyography for Myotonic Discharges
  description: >-
    Needle EMG can show myotonic discharges even when the patient reports no
    stiffness. This is discriminating rather than merely confirmatory: electrical
    myotonia argues for HyperPP or paramyotonia congenita and against hypokalemic
    periodic paralysis or Andersen-Tawil syndrome.
  diagnosis_term:
    preferred_term: electromyography procedure
    term:
      id: NCIT:C38056
      label: Electromyography
  results: >-
    Myotonic discharges waxing and waning in amplitude and frequency support
    HyperPP or paramyotonia congenita.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Convincing evidence of myotonia (discharges waxing and waning in frequency
      and amplitude, increased activity after voluntary contraction or provoked by
      percussion or needle movement) is inconsistent with a diagnosis of HypoPP or
      ATS, and supports a diagnosis of HyperPP or PMC.
    explanation: >-
      States the discriminating value of electrical myotonia across the periodic
      paralyses.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      On needle electromyography (EMG), positive sharp waves and myotonia,
      characterized by spontaneous waxing and waning motor unit potential
      amplitude and frequency, can be seen in PMC and HyperPP.
    explanation: >-
      Independently confirms the EMG findings expected in HyperPP.
- name: Long Exercise Compound Muscle Action Potential Test
  description: >-
    A focal attack is provoked by five minutes of repeated isometric contraction
    and the compound muscle action potential is followed for up to an hour. A
    decrement of 40% or more is abnormal. The pattern discriminates: an early
    increase followed by a late decrease is characteristic of HyperPP.
  diagnosis_term:
    preferred_term: long exercise compound muscle action potential test
  results: >-
    A CMAP amplitude decrement of at least 40% supports susceptibility to periodic
    paralysis; an early increase followed by a late decrease favours HyperPP.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A reduction in CMAP amplitude of 40% or more from the maximal during
      exercise or post exercise is considered abnormal and is typically seen in
      >70% of patients.
    explanation: >-
      Gives the decrement threshold and the sensitivity of the test.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      with a late decrease alone most often found in HypoPP (pattern V), an early
      increase follow by a late decrease in HyperPP (pattern IV), or a rapid onset
      decrease that persisted for minutes in PMC (pattern I)
    explanation: >-
      Records the subtype-discriminating response patterns, including the HyperPP
      pattern.
  notes: >-
    No NCIT clinical-action term is bound because none exists for this test.
    Searching the configured OLS adapter with `runoak -i ols:ncit search
    "l~compound muscle action potential"` and `runoak -i ols:ncit search "l~muscle
    action potential"` returns nothing, and `runoak -i ols:ncit search "l~exercise
    test"` returns only cardiac and cardiopulmonary stress-testing terms.
    NCIT:C88502 Nerve Conduction Velocity Test was rejected on positive grounds:
    this test measures CMAP amplitude decrement after exercise, not conduction
    velocity.
- name: Serum Potassium Measurement During an Attack
  description: >-
    Potassium is measured during weakness and between attacks. The pairing is what
    carries the information, since the interictal value is normal in all forms of
    periodic paralysis.
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  results: >-
    Serum potassium above 4.5 to 5 mmol/L during an attack, or a rise of at least
    1.5 mmol/L from the interictal value, supports HyperPP; a normal ictal value
    does not exclude it.
  evidence:
  - reference: PMID:20301669
    reference_title: Hyperkalemic Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      normal serum potassium between attacks, and onset before age 20 years
    explanation: >-
      GeneReviews includes the normal interictal potassium and the age limit in the
      diagnostic definition, which is why the ictal value must be paired with a
      baseline.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Provocative testing, with a glucose plus insulin challenge for HypoPP or
      with an oral K+ challenge in HyperPP, is potentially dangerous and no longer
      used in clinical practice.
    explanation: >-
      Records that measuring spontaneous ictal potassium has replaced deliberate
      potassium provocation, which is no longer acceptable practice.
differential_diagnoses:
- name: paramyotonia congenita of Von Eulenburg
  disease_term:
    preferred_term: paramyotonia congenita of Von Eulenburg
    term:
      id: MONDO:0008195
      label: paramyotonia congenita of Von Eulenburg
  description: >-
    Allelic with HyperPP at SCN4A and caused by the same class of
    gain-of-function inactivation defect, so this is not a differential in the
    usual sense but a neighbouring point on one continuum. The same variant, and
    even the same family, can produce either presentation. What separates them is
    which arm of the phenotype dominates: myotonic stiffness with infrequent
    weakness in paramyotonia congenita, recurrent weakness with accompanying
    myotonia in HyperPP.
  distinguishing_features:
  - >-
    Predominant symptom, not gene or variant: myotonic stiffness dominates in
    paramyotonia congenita, episodic weakness in HyperPP.
  - >-
    Stiffness that paradoxically worsens over the first few contractions, rather
    than easing with repetition, favours paramyotonia congenita.
  - >-
    Cold-selective distal and facial stiffness in winter favours paramyotonia
    congenita, although cold triggers attacks in HyperPP too.
  - >-
    On long exercise testing, a rapid-onset decrement persisting for minutes
    (pattern I) favours paramyotonia congenita; an early increase followed by a
    late decrease (pattern IV) favours HyperPP.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Paramyotonia congenita (PMC) and hyperkalemic periodic paralysis (HyperPP)
      have extensive overlap of clinical features (Figure 1, center) and are
      caused by similar gain-of-function defects arising from missense mutations
      of NaV1.4
    explanation: >-
      States the allelism and the mechanistic identity of the two conditions,
      which is why the distinction is clinical rather than genetic.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The predominant symptom in PMC is myotonic stiffness that paradoxically
      worsens with the first few repetitions for voluntary contraction of
      affected muscles (paramyotonia), whereas the stiffness diminishes with
      repeated effort (warm-up) for other forms of myotonia
    explanation: >-
      Gives the bedside sign that separates paramyotonia from warm-up myotonia.
  - reference: PMID:30931713
    reference_title: >-
      Overlap of periodic paralysis and paramyotonia congenita caused by SCN4A
      gene mutations two family reports and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To verify the diagnosis of channelopathies in two families and explore the
      mechanism of the overlap between periodic paralysis (PP) and paramyotonia
      congenita (PMC).
    explanation: >-
      A family-level study framed around the overlap itself, confirming that the
      two diagnoses coexist within SCN4A kindreds.
  notes: >-
    Paramyotonia congenita has no dismech entry yet, so this differential points
    at the MONDO concept rather than at a sibling entry. Because the two are
    allelic and on one continuum, a future paramyotonia congenita entry would
    duplicate most of this entry's pathophysiology, and the lump-or-split
    decision should be made deliberately rather than by default.
- name: hypokalemic periodic paralysis
  disease_term:
    preferred_term: hypokalemic periodic paralysis
    term:
      id: MONDO:0008223
      label: hypokalemic periodic paralysis
  description: >-
    The mechanistically opposite periodic paralysis, and the most important
    differential because the treatments are contradictory. Both end in
    depolarization-induced inexcitability, but HypoPP gets there through an
    anomalous gating-pore leak current that depolarizes the fibre when
    extracellular potassium is low, whereas HyperPP gets there through impaired
    channel inactivation unmasked when potassium is high. Giving potassium helps
    one and precipitates the other.
  distinguishing_features:
  - >-
    Ictal serum potassium: low (below 3.5 mmol/L) in HypoPP, high (above 4.5
    mmol/L) in HyperPP. This is the defining separation, though it can be hard to
    document.
  - >-
    Myotonia is an exclusionary criterion for HypoPP and is present in most
    HyperPP patients.
  - >-
    Triggers diverge: carbohydrate-rich meals and high salt in HypoPP,
    potassium-rich food and fasting in HyperPP.
  - >-
    Treatment is opposite in direction: potassium supplements and
    potassium-sparing diuretics in HypoPP, potassium-wasting diuretics in
    HyperPP.
  - >-
    Genetics: HypoPP is usually CACNA1S, and its SCN4A variants are arginine
    substitutions in S4 voltage sensors, which HyperPP variants are not.
  - >-
    HypoPP attacks tend to be more severe and prolonged; HyperPP attacks are more
    frequent and shorter.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Episodic weakness in HypoPP is caused by "leaky" Ca2+ or Na+ channels, with
      an anomalous gating pore current that is conducted through the
      voltage-sensor domain of the channel.
    explanation: >-
      States the distinct HypoPP mechanism, a gating-pore leak rather than an
      inactivation defect.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Almost all HypoPP mutations are missense substitutions at arginine residues
      in S4 transmembrane segments (Matthews et al., 2009), which not only helps
      to distinguish HypoPP from HyperPP or ATS
    explanation: >-
      Gives the variant-level rule that separates SCN4A-related HypoPP from
      HyperPP.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Attacks in HyperPP tend to be more frequent and shorter in duration than
      attacks in HypoPP.
    explanation: >-
      Records the difference in attack pattern between the two.
- name: Thomsen and Becker disease
  disease_term:
    preferred_term: Thomsen and Becker disease
    term:
      id: MONDO:0009710
      label: Thomsen and Becker disease
  description: >-
    CLCN1-related myotonia congenita. Both diseases cause myotonia through
    sarcolemmal instability, but the lesion is a reduced chloride conductance
    rather than a persistent sodium current, and there are no potassium-associated
    paralytic attacks. Transient weakness after rest does occur in Becker disease,
    which is the point of genuine clinical confusion.
  distinguishing_features:
  - >-
    Recurrent paralytic attacks with a documented ictal rise in serum potassium
    favour HyperPP; myotonia congenita has stiffness without dyskalemic attacks.
  - >-
    Stiffness relieved by repeated contraction (warm-up) favours myotonia
    congenita; stiffness worsened by the first contractions or by cold favours the
    sodium-channel disorders.
  - >-
    CLCN1 rather than SCN4A on sequencing, and recessive inheritance in the case
    of Becker disease.
  - >-
    Marked muscle hypertrophy is usual in myotonia congenita and is not a feature
    of HyperPP.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reduction of the chloride conductance, as occurs in myotonia congenita,
      impairs this stability and results in bursts of after-discharges and delayed
      relaxation of force in myotonia
    explanation: >-
      States the distinct chloride-conductance mechanism of myotonia congenita
      against the sodium-current mechanism of HyperPP.
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When myotonia is present, CLCN1 should also be screened, and the possibility
      of myotonic dystrophy should be investigated by testing for expansion of CTG
      repeats in DMPK and CCTG repeats in CNBP.
    explanation: >-
      Records CLCN1 and the myotonic dystrophies as the tests that exclude this
      differential when myotonia is the presenting feature.
- name: Andersen-Tawil syndrome
  disease_term:
    preferred_term: Andersen-Tawil syndrome
    term:
      id: MONDO:0008222
      label: Andersen-Tawil syndrome
  description: >-
    The third primary periodic paralysis, caused by loss of function of the
    inward-rectifier potassium channel Kir2.1 rather than gain of function of
    Nav1.4. It also reaches depolarization-induced inexcitability, by removing the
    resting outward potassium current instead of adding an inward sodium current.
    Attacks can be associated with high, low, or normal potassium, so potassium
    alone does not separate it from HyperPP.
  distinguishing_features:
  - >-
    Ventricular arrhythmia, prolonged QT and prominent U waves, and the
    characteristic facial and skeletal features, are absent in HyperPP.
  - >-
    KCNJ2 is expressed in heart and bone as well as muscle, which is why
    Andersen-Tawil syndrome is multisystem while SCN4A disease is confined to
    skeletal muscle.
  - >-
    Myotonia argues against Andersen-Tawil syndrome and for HyperPP.
  evidence:
  - reference: PMID:39174253
    reference_title: Periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unlike the skeletal muscle-specific expression for CLCN1, SCN4A, and
      CACNA1S; KCNJ2 is expressed in multiple tissues including skeletal muscle,
      heart, and bone.
    explanation: >-
      Explains why Andersen-Tawil syndrome is multisystem and HyperPP is not,
      which is the discriminating observation.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Attacks of muscle weakness can be associated with high, low or normal serum
      potassium levels.
    explanation: >-
      Records that ictal potassium does not distinguish Andersen-Tawil syndrome
      from HyperPP, so the extramuscular features must be sought.
clinical_trials:
- name: NCT00494507
  phase: PHASE_III
  status: COMPLETED
  description: >-
    HYP HOP, the pivotal randomized, double-blind, placebo-controlled crossover
    programme of dichlorphenamide in hyperkalemic and hypokalemic periodic
    paralysis, with a 52-week open-label extension. Its hyperkalemic substudy is
    the source of the efficacy uncertainty recorded on the dichlorphenamide
    treatment above.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  evidence:
  - reference: clinicaltrials:NCT00494507
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to compare Dichlorphenamide with placebo (an
      inactive substance) for prevention of episodes and for improvement of
      strength in hyperkalemic (HYP) and hypokalemic (HOP) periodic paralysis.
    explanation: >-
      The registered objective names hyperkalemic periodic paralysis as a study
      population and episode prevention as the endpoint, which is the trial this
      entry's dichlorphenamide evidence comes from.

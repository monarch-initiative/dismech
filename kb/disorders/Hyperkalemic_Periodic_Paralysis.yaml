- name: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
  biological_scale: CELLULAR
  description: >-
    At a resting potential near -45 mV the wild-type Nav1.4 channels and most of
    the mutant ones are held in the inactivated state, so no action potential can
    be generated and the fibre cannot contract. This is the counterintuitive step
    of the disease: the paralysis is caused by too much depolarizing current, not
    by too little, and the mutant allele therefore behaves as a functional
    dominant negative acting through voltage-dependent inactivation.

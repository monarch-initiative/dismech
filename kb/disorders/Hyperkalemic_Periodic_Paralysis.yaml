name: Hyperkalemic Periodic Paralysis
creation_date: '2026-09-29T00:00:00Z'
description: >-
  Hyperkalemic periodic paralysis is an autosomal dominant skeletal-muscle
  channelopathy caused by gain-of-function missense variants in SCN4A, which
  encodes the skeletal-muscle voltage-gated sodium channel Nav1.4. The variants
  impair channel inactivation, leaving a small persistent inward sodium current
  that holds the sarcolemma depolarized. Because that sustained depolarization
  drives the remaining sodium channels into their inactivated state, the fibre
  becomes inexcitable, so the weakness arises from depolarization-induced
  inexcitability rather than from reduced excitatory drive. Modest elevation of
  extracellular potassium is what reveals the inactivation defect, which is why
  attacks follow potassium-rich meals, rest after exercise, cold, and fasting.
  The same channel defect produces myotonia at lesser degrees of depolarization,
  so most patients have both stiffness and episodic paralysis.

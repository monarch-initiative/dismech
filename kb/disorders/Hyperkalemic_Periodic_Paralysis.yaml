      tetrodotoxin (TTX), leading to repolarization
    explanation: >-
      Recordings from isolated intercostal muscle fibres of HyperPP patients
      show the noninactivating inward sodium current itself, and that blocking
      it with tetrodotoxin repolarizes the fibre.
  downstream:

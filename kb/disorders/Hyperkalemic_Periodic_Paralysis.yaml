- name: Resting Intracellular Sodium Overload
  biological_scale: CELLULAR
  description: >-
    The persistent inward current loads the resting fibre with sodium even
    between attacks, which increases the demand on the Na+,K+-ATPase and is
    detectable by sodium magnetic resonance spectroscopy in patients. It is the
    plausible link between a purely electrical defect and the structural
    myopathy that develops over decades.

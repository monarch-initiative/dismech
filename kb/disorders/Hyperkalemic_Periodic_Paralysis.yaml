- name: Skeletal Muscle Membrane Hyperexcitability and Myotonic Discharges
  biological_scale: CELLULAR
  description: >-
    At lesser degrees of depolarization the same inactivation defect increases
    sodium-channel availability during repolarization, so one stimulus is
    followed by a self-sustained train of action potentials. This is why
    myotonia and paralysis are two expressions of one channel defect at
    different membrane potentials, and why myotonic stiffness commonly precedes
    an attack of weakness.

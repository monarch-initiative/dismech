      A standing inward sodium current shifts the resting potential in the
      depolarizing direction and holds it there.
  - target: Resting Intracellular Sodium Overload
    causal_link_type: DIRECT
    description: >-
      The same anomalous current loads the resting fibre with sodium, which is

  - reference: PMID:32117025
    reference_title: "A Patient With CAD Deficiency Responsive to Uridine and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all presented with DD, drug-resistant epilepsy, and anemia with anisopoikilocytosis"
    explanation: >-

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With no biomarker available, the diagnosis relies on genetic testing and functional validation in patient-derived fibroblasts."
    explanation: >-
      States the diagnostic pathway and, critically, the absence of a metabolic
      biomarker.
  - reference: PMID:32461667
    reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using CRISPR/Cas9, we generated a human CAD-knockout cell line that requires uridine supplements for survival. Transient transfection of the knockout cells with recombinant CAD restores growth in absence of uridine."
    explanation: >-
      Describes the complementation assay that resolves variants of unknown
      significance.
- name: Peripheral blood film
  description: >-
    A blood film showing anisopoikilocytosis alongside anaemia, in a child with
    developmental delay and seizures, is the routine finding most likely to
    raise the diagnosis. It is not specific and is not a biomarker in the
    metabolic sense, but it is available everywhere and normalizes on treatment,
    so it doubles as a response measure.

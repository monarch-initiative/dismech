treatments:
- name: Oral uridine supplementation
  description: >-
    Uridine bypasses the enzymatic block by entering the pyrimidine pool through
    the salvage route, which does not require CAD. It is given as uridine,
    uridine monophosphate or uridine triacetate. In treated patients seizures
    can stop immediately, development resumes, cerebellar atrophy can arrest and
    the blood film normalizes; supplementation was safe in the largest treated
    series. The disorder's authors recommend a trial in any patient with
    developmental delay, epilepsy and anaemia, in any patient with status
    epilepticus, and in any patient with neonatal seizures, until the diagnosis
    is excluded or six months have passed without benefit — an unusually
    permissive threshold that follows from the treatment's safety and the
    untreated mortality.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: uridine
      term:
        id: CHEBI:16704
        label: uridine
    - preferred_term: uridine triacetate
      term:
        id: CHEBI:90914
        label: uridine triacetate
  target_mechanisms:
  - target: Intact Uridine Salvage Pathway
    treatment_effect: ACTIVATES
    description: >-
      Supplying exogenous uridine drives the CAD-independent salvage route,
      which is the node this treatment acts through.
  - target: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
    treatment_effect: BYPASSES
    description: >-
      The depleted nucleotide and UDP-sugar pools are refilled without
      restoring CAD activity, which is why a complete enzymatic loss is still
      treatable.
  target_phenotypes:
  - preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supplementation of the two surviving children with oral uridine led to immediate cessation of seizures in both."
    explanation: >-
      The founding demonstration of efficacy on the seizure endpoint.
  - reference: PMID:25678555
    reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Uridine supplementation rescued these abnormalities, suggesting a potential therapy for this new glycosylation disorder."
    explanation: >-
      The biochemical basis of the treatment — correction of the depleted pools
      in patient cells — which is the mechanism the target_mechanisms links
      record.
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supplementation with uridine, uridine monophosphate, or uridine triacetate in ten patients was safe and led to significant clinical improvement in most patients."
    explanation: >-
      The largest treated series, establishing safety and the three acceptable
      preparations, with the qualifier that improvement was in most rather than
      all.
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We advise a trial with uridine (monophosphate) in all patients with developmental delay/intellectual disability, epilepsy, and anemia; all patients with status epilepticus; and all patients with neonatal seizures until (genetically) proven otherwise or proven unsuccessful after 6 months."
    explanation: >-
      The empirical-trial recommendation and its stopping rule, quoted in full
      so the threshold is not overstated.
  notes: >-
    Evidence is from case series and cohort reports; no randomized trial exists
    and none is likely at this cohort size. The recommendation to trial uridine
    empirically rests on safety plus untreated mortality, not on controlled
    comparison.
animal_models:
- name: CAD-deficient Bengal cat
  species: Cat
  genotype: CAD p.Ser2015Asn homozygous
  category: Genetic
  description: >-
    A naturally occurring feline model. A four-month-old Bengal kitten with
    intractable seizures and abnormal behaviour carried a homozygous CAD variant
    predicted to disrupt oligomerization of the C-terminal ATCase domain, and
    the variant failed to rescue growth in the human CAD-knockout complementation
    assay. Four further carriers were found among 110 unaffected Bengals, so the
    allele segregates in the breed. This is a spontaneous large-animal model of
    a disorder whose human cohort is only a few dozen people.
  publication: PMID:40251393
  genes:
  - preferred_term: CAD
    term:
      id: hgnc:1424
      label: CAD
  modeled_mechanisms:
  - target: Biallelic CAD Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The feline variant abolishes CAD function in the same complementation
      assay used to classify human variants, and the affected kitten had
      intractable seizures.
    limitations: >-
      A single affected animal, characterized clinically rather than
      neuropathologically; the haematological arm of the human phenotype was not
      reported, and no uridine trial was performed, so the model's treatment
      responsiveness is inferred rather than demonstrated.
    readouts:
    - name: Growth rescue of CAD-knockout cells by the feline variant
      target: Biallelic CAD Loss of Function
      direction: ABOLISHED
      interpretation: >-
        The mutant protein cannot support growth without uridine, establishing
        loss of function rather than a benign substitution.
      evidence:
      - reference: PMID:40251393

        snippet: "In a CAD-knockout human cell line dependent on uridine, the recombinant expression of human wildtype CAD, but not of the Asn2015 mutant, restored cell growth without uridine, demonstrating that the p.Ser2015Asn variant disrupts CAD function and is pathogenic."
        explanation: >-
          The functional measurement and its direction.
    evidence:
    - reference: PMID:40251393
      reference_title: "Epileptic encephalopathy in a young Bengal cat caused by CAD deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report a novel variant in the feline CAD gene in a 4-month-old Bengal kitten with intractable seizures and abnormal behavior."
      explanation: >-

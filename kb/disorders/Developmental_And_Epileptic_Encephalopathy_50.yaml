    term:
      id: CL:0002620
      label: skin fibroblast
  publication: PMID:25678555
  modeled_mechanisms:
  - target: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Direct quantification of the depleted nucleotide and UDP-sugar pools in
      human patient cells, with uridine rescue.
    limitations: >-
      Fibroblasts are not an affected tissue; they report the cell-autonomous
      metabolic lesion but say nothing about why neurons and erythroid
      precursors specifically are damaged.
    readouts:
    - name: CTP, UTP and UDP-activated sugar levels
      target: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
      direction: DECREASED
      interpretation: >-
        Confirms in human cells that the block depletes both the nucleotide
        pool and the glycosylation donor pool.
      evidence:

differential_diagnoses:
- name: DTYMK-related neurodegeneration
  description: >-
    The other neurodegenerative disorder of the pyrimidine pathway, and the
    instructive contrast. DTYMK sits downstream of the point at which the de
    novo and salvage routes converge, so its loss cannot be bypassed and uridine
    is not a rational therapy — whereas CAD sits at the entry to the pathway, so
    it can. The two are already cross-referenced from the DTYMK entry in this
    knowledge base.
  notes: >-
    No evidence item is attached: the claim recorded here is the pathway-position
    contrast, which is asserted in the DTYMK entry with its own evidence rather
    than re-derived here.
discussions:
- discussion_id: gap_pyrimidine_depletion_to_neuronal_injury
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does depletion of pyrimidine nucleotides and UDP-sugars
    produce neuronal injury, seizures and brain atrophy, rather than a uniform
    proliferation defect?
  attaches_to:
  - "pathophysiology#Pyrimidine Nucleotide and UDP-Sugar Pool Depletion"
  - "pathophysiology#Progressive Neuronal Injury and Brain Atrophy"
  rationale: >-
    The metabolic lesion is measured directly in patient fibroblasts and the
    clinical endpoint is well described, but nothing in between is. Proposed
    routes include impaired glycosylation of neuronal proteins, since UDP-sugar
    donors are depleted, and impaired nucleic acid synthesis during neuronal
    differentiation; neither has been demonstrated in neural tissue from an
    affected individual or a model. The gap matters practically: it is why there
    is no biomarker of neuronal involvement, and why treatment response is
    monitored with seizure counts and blood films rather than anything
    mechanism-specific.
  proposed_experiments:
  - experiment_id: exp_neuronal_glycosylation_in_cad_deficiency
    name: Glycosylation and nucleotide status in CAD-deficient neurons
    description: >-
      Differentiate neurons from a CAD-deficient patient iPSC line (one already
      exists) alongside isogenic controls, and measure UDP-sugar pools, protein
      glycosylation and neurite outgrowth with and without uridine. A
      glycosylation deficit correcting on uridine would support the
      glycosylation route; a normal glycan profile with impaired outgrowth would
      point at the nucleic-acid-synthesis route instead.
  evidence:
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With no biomarker available, the diagnosis relies on genetic testing and functional validation in patient-derived fibroblasts."
    explanation: >-
      The absence of a biomarker is the practical face of this gap — no measured
      quantity tracks the neuronal arm of the disease.
- discussion_id: gap_treatment_timing_and_reversibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the neurological damage in CAD deficiency is reversible, and
    does the answer depend on age at which uridine is started?
  attaches_to:
  - "pathophysiology#Progressive Neuronal Injury and Brain Atrophy"
  rationale: >-
    The evidence that timing matters is real but thin: one sibling pair in which
    the younger sib treated at 5 improved dramatically and the older treated at
    14 only modestly. That is a single family, and severity and age are
    confounded within it — the brother is described as having had a more severe
    course independently of when he was treated. The question is consequential
    because it is the argument for newborn screening, which the founding study
    and the largest series both raise.
  proposed_experiments:
  - experiment_id: exp_age_stratified_uridine_response
    name: Age-stratified outcome registry
    description: >-
      Pool treated patients across centres and relate response — seizure
      freedom, developmental trajectory, arrest of atrophy on serial MRI — to
      age at treatment initiation and to pre-treatment severity separately, so
      the two can be disentangled. At the current cohort size this needs
      international pooling rather than a single series.
  evidence:
  - reference: PMID:33497533
    reference_title: "Uridine-responsive epileptic encephalopathy due to inherited variants in CAD: A Tale of Two Siblings."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Her older brother had a more severe course and only modest response to uridine started at 14 years old."
    explanation: >-
      Classified PARTIAL: the observation is consistent with a timing effect but
      confounds it with baseline severity, which is exactly the ambiguity the
      proposed experiment is meant to resolve.
notes: >-
  Deliberate non-conformances. This entry does not declare conformance to
  epilepsy_excitation_inhibition_imbalance: that module runs through a measured
  excitation-inhibition imbalance, and no such measurement exists in CAD
  deficiency, so conforming would substitute a plausible route for an evidenced
  one. It likewise does not conform to cerebellar_purkinje_degeneration —
  cerebellar atrophy here is an imaging finding in 4 of 24 imaged patients, with
  no Purkinje-cell-specific lesion demonstrated. Both decisions are recorded so
  a later curator with new evidence knows what would need to change.

  Frequency bands are taken only from the 2024 pooled review, which reports each
  figure against an explicit denominator of 42 patients (or 19 and 24 for the
  extrapyramidal and imaging subsets). Phenotypes described only in single case
  reports carry no band.

  A note on this entry's deep-research report. Its own reference validation set
  `needs_review: true` with 4 of 9 quoted claims unsupported, despite a
  confabulation rate of 0.0 — the identifiers all resolved, the quotes did not
  match. No snippet in this entry was taken from that report; every one was
  read out of the cached reference. Five of the report's suggested ontology
  terms were also wrong, among them GO:0004087, which is the ammonia-dependent
  carbamoyl-phosphate synthetase of the urea cycle rather than CAD's
  glutamine-hydrolyzing CPS-II — a substitution that would have asserted the
  wrong enzyme. The bound term is GO:0004088.

  Review round on PR #9391. Three of the reviewer's six optional suggestions
  were applied: strabismus (7%) was added as a phenotype from the same
  denominator-bearing sentence already quoted elsewhere; uridine triacetate was
  added as a second `therapeutic_agent`; and an NCIT binding was added to the
  exome-sequencing diagnosis entry. Three were declined, with reasons. (An
  earlier draft of this paragraph said "both diagnosis entries"; only one was
  bound, for the reason given below.)

  The suggestion to curate uridine triacetate's reported four-to-six-fold
  bioavailability advantage was declined because no quotable source for it
  exists here. The review attributed the figure to "Frederick et al. 2021,
  already cited as PMID:33497533", but PMID:33497533 is McGraw et al., "A Tale
  of Two Siblings", and its cached record contains no bioavailability statement.
  The agent is therefore curated by identity (CHEBI:90914) without the
  pharmacokinetic claim.

  The review also relayed the deep-research report's suggestion of NCIT:C17004
  for whole exome sequencing. That term is Genetic Polymorphism. The binding
  used is NCIT:C101295, verified against OLS4 — the third instance in this entry
  of a suggested term being wrong, and the reason every term here was checked
  individually rather than accepted. The peripheral blood film was left unbound:
  NCIT:C79903 Blood Smear is not reachable from NCIT:C25218 (Clinical
  Intervention or Procedure), so it fails the TreatmentActionTerm enum, and no
  reachable term names the assay. Leaving it unbound is preferred to binding a
  broader procedure term that would not mean "blood film".

  `evidence_source: OTHER` was retained on the two PMID:34288185 items. The
  suggestion to consider IN_VITRO is reasonable, but that reference is a review
  article and the statements cited from it are descriptive summaries of protein
  architecture rather than experiments it performed, which is what OTHER is for.

  No `datasets:` block: the mechanistic work on this disorder is targeted
  nucleotide and UDP-sugar quantification in patient fibroblasts rather than
  deposited omics, and no disease-specific dataset was identified.

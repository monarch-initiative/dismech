experimental_models:
- name: CRISPR CAD-knockout human cell line
  description: >-
    A CRISPR/Cas9-generated human CAD-knockout line that cannot grow without
    uridine and is rescued by transfection with functional recombinant CAD. It
    is simultaneously the disease model and the diagnostic assay: growth rescue
    is the readout that classifies a patient variant as tolerated or deleterious,
    and therefore predicts who will benefit from uridine.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32461667
  modeled_mechanisms:
  - target: Biallelic CAD Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A complete CAD knockout reproduces the defining cellular consequence of
      the human lesion: uridine dependence for survival.
    limitations: >-
      A proliferating immortalized line is the compartment in which de novo
      synthesis matters most, so it models the metabolic lesion well and the
      neuronal consequence not at all. It also reports total loss rather than
      the graded residual activity of hypomorphic alleles.
    readouts:
    - name: Growth without uridine supplementation
      target: Biallelic CAD Loss of Function
      direction: ABOLISHED
      interpretation: >-
        Loss of CAD makes the cell line dependent on exogenous uridine, which is
        the cellular phenotype the disease and its treatment both turn on.
      evidence:
      - reference: PMID:32461667
        reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we generated a human CAD-knockout cell line that requires uridine supplements for survival"
        explanation: >-
          The measurement and its direction.
    evidence:
    - reference: PMID:32461667
      reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transient transfection of the knockout cells with recombinant CAD restores growth in absence of uridine. This system determines missense variants that inactivate CAD and do not rescue the growth phenotype."
      explanation: >-
        Establishes the rescue logic that makes the line informative for the
        trigger node.
  evidence:
  - reference: PMID:32461667
    reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We designed a cell-based assay to test the pathogenicity of CAD variants, identifying 11 CAD-deficient individuals who could benefit from uridine therapy."
    explanation: >-
      Establishes the system as informative for the disease and its direct
      clinical use.
- name: Patient-derived dermal fibroblasts
  description: >-
    Fibroblasts from affected individuals carry the biochemical lesion and are
    the system in which it was first characterized: impaired aspartate
    incorporation into RNA and DNA by the de novo route, depleted CTP, UTP and
    UDP-sugars, and correction of all of it by uridine.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:

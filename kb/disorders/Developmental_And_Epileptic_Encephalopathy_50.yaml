        reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "CTP, UTP and nearly all UDP-activated sugars that serve as donors for glycosylation were decreased."
        explanation: >-
          The measurement and its direction.
    evidence:

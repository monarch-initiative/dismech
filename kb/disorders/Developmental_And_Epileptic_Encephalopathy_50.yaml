      reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Metabolic flux studies showed impaired aspartate incorporation into RNA and DNA through the de novo synthesis pathway."
      explanation: >-
        Establishes the system as carrying the disease biochemistry.
  evidence:

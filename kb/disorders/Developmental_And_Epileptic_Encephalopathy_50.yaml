name: Developmental and Epileptic Encephalopathy 50
creation_date: "2026-08-24T00:00:00Z"
description: >-
  DEE50, or CAD deficiency, is an autosomal recessive neurometabolic disorder
  caused by biallelic variants in CAD, the single 1.5 MDa multienzyme particle
  that carries the first three committed reactions of de novo pyrimidine
  biosynthesis. Loss of activity depletes the UTP, CTP and UDP-sugar pools of
  cells that depend on de novo synthesis, producing a triad of global
  developmental delay or regression, drug-refractory epilepsy with recurrent
  status epilepticus, and a dyserythropoietic anaemia with anisopoikilocytosis.
  Untreated, the course is progressive and can be lethal in early childhood.
  What makes the entry unusual is that the block sits at the entry to the
  pathway, upstream of where de novo and salvage converge, so oral uridine
  bypasses it entirely: seizures can stop within days and the haematological
  abnormalities resolve. There is no metabolic biomarker, diagnosis rests on
  sequencing plus functional validation, and most reported deaths were in
  patients who never received uridine.
category: Mendelian
parents:
- autosomal recessive disease
- inborn error of metabolism
synonyms:
- DEE50
- CAD deficiency
- early infantile epileptic encephalopathy 50
- EIEE50
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 50
  term:
    id: MONDO:0014647
    label: developmental and epileptic encephalopathy, 50
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Placed as an inborn error of metabolism (de novo pyrimidine biosynthesis)
      rather than under a neurology chapter, because the treatable metabolic
      lesion is what defines the entity. Harrison's does not list DEE50 by name;
      this is a mechanism-based placement, not a textbook citation.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    DEE50 is autosomal recessive, caused by biallelic CAD variants in the
    homozygous or compound heterozygous state. Reported families include both
    consanguineous unions and unrelated compound heterozygotes.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic CAD variants underlie CAD deficiency"
    explanation: >-
      Establishes biallelic causation and names the salvage route that the
      treatment exploits.
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients had consanguineous parents, and 12 had a reported family history."
    explanation: >-
      Documents both consanguineous and familial occurrence across the
      42-patient literature review, consistent with recessive inheritance.
pathophysiology:
- name: Biallelic CAD Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    CAD is a single 2,225-residue polypeptide that assembles into a roughly
    1.5 MDa hexameric particle carrying four catalytic domains in one chain:
    glutamine amidotransferase, carbamoyl phosphate synthetase II, aspartate
    transcarbamoylase and dihydroorotase. The covalent fusion of these
    activities into one particle is unique to animals. Biallelic variants
    reduce or abolish activity; missense alleles predominate and can act by
    disrupting oligomerization of a domain rather than by destroying a catalytic
    site — the feline variant below is a worked example of that route. A
    hypomorphic allelic class retaining partial activity produces a milder,
    primarily haematological phenotype.
  genes:
  - preferred_term: CAD
    term:
      id: hgnc:1424
      label: CAD
  molecular_functions:
  - preferred_term: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
    term:
      id: GO:0004088
      label: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
    modifier: DECREASED
  - preferred_term: aspartate carbamoyltransferase activity
    term:
      id: GO:0004070
      label: aspartate carbamoyltransferase activity
    modifier: DECREASED
  - preferred_term: dihydroorotase activity
    term:
      id: GO:0004151
      label: dihydroorotase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40251393
    reference_title: "Epileptic encephalopathy in a young Bengal cat caused by CAD deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The variant, XP_011279586.1:p.(Ser2015Asn), was predicted to affect the oligomerization of the C-terminal aspartate transcarbamylase (ATCase) domain of CAD."
    explanation: >-
      A worked example of the oligomerization route to loss of function, in
      which the substitution disrupts domain assembly rather than a catalytic
      site. Evidence source is MODEL_ORGANISM because the variant is feline.
  - reference: PMID:34288185
    reference_title: "Deciphering CAD: Structure and function of a mega-enzymatic pyrimidine factory in health and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CAD is a 1.5 MDa particle formed by hexameric association of a 250 kDa protein divided into different enzymatic domains, each catalyzing one of the initial reactions for de novo biosynthesis of pyrimidine nucleotides: glutaminase-dependent Carbamoyl phosphate synthetase, Aspartate transcarbamoylase, and Dihydroorotase."
    explanation: >-
      Establishes the architecture and the catalytic domains whose loss defines
      the trigger, and is the source for the glutamine-hydrolyzing (not
      ammonia-dependent) carbamoyl phosphate synthetase activity bound above.
  - reference: PMID:34288185
    reference_title: "Deciphering CAD: Structure and function of a mega-enzymatic pyrimidine factory in health and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the covalent linkage of the first enzymatic activities into a multienzymatic CAD particle is unique to animals"
    explanation: >-
      Supports the statement that the multienzyme fusion is animal-specific,
      which is why a single gene defect removes three sequential activities.
  downstream:
  - target: Impaired De Novo Pyrimidine Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Loss of the CAD activities blocks the first three of the six reactions
      that make UMP.
    evidence:
    - reference: PMID:25678555
      reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The tri-functional enzyme contains carbamoyl-phosphate synthetase 2 (CPS2), aspartate transcarbamylase (ATCase) and dihydroorotase (DHOase) activities, which comprise the first three of six reactions required for de novo pyrimidine biosynthesis."
      explanation: >-
        States precisely which steps of the pathway the enzyme carries, and so
        which are lost.
- name: Impaired De Novo Pyrimidine Biosynthesis
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    With CAD inactive, flux through de novo pyrimidine synthesis fails. Metabolic
    flux studies in patient fibroblasts show impaired incorporation of aspartate
    into RNA and DNA by this route. This is the rate-limiting lesion of the
    disease, and its position matters therapeutically: it lies upstream of the
    point at which the de novo and salvage routes converge, which is what leaves
    the disease bypassable.
  biological_processes:
  - preferred_term: "'de novo' UMP biosynthetic process"
    term:
      id: GO:0044205
      label: "'de novo' UMP biosynthetic process"
    modifier: DECREASED
  - preferred_term: "'de novo' pyrimidine nucleobase biosynthetic process"
    term:
      id: GO:0006207
      label: "'de novo' pyrimidine nucleobase biosynthetic process"
    modifier: DECREASED
  cell_types:
  - preferred_term: Dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:25678555
    reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Metabolic flux studies showed impaired aspartate incorporation into RNA and DNA through the de novo synthesis pathway."
    explanation: >-
      Direct measurement of the blocked flux in cells from an affected
      individual.
  downstream:
  - target: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
    causal_link_type: DIRECT
    description: >-
      The blocked pathway fails to supply its downstream products.
    evidence:
    - reference: PMID:25678555
      reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In addition, CTP, UTP and nearly all UDP-activated sugars that serve as donors for glycosylation were decreased."
      explanation: >-
        Measures the depleted pools directly downstream of the blocked flux, in
        the same patient cells.
- name: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
  biological_scale: CELLULAR
  description: >-
    The consequence is not only a nucleic-acid precursor shortage. CTP and UTP
    fall, and so do nearly all UDP-activated sugars, which are the donor
    substrates for glycosylation. The original report of the disease framed it
    as a glycosylation disorder for exactly this reason. Cells that rely on de
    novo synthesis rather than salvage — proliferating cells such as erythroid
    precursors, and neurons during development — are the ones that feel it.
  biological_processes:
  - preferred_term: "'de novo' UMP biosynthetic process"
    term:
      id: GO:0044205
      label: "'de novo' UMP biosynthetic process"
    modifier: DECREASED
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Erythroid lineage cell
    term:
      id: CL:0000764
      label: erythroid lineage cell
  evidence:
  - reference: PMID:25678555
    reference_title: "Biallelic mutations in CAD, impair de novo pyrimidine biosynthesis and decrease glycosylation precursors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CTP, UTP and nearly all UDP-activated sugars that serve as donors for glycosylation were decreased. Uridine supplementation rescued these abnormalities, suggesting a potential therapy for this new glycosylation disorder."
    explanation: >-
      Establishes both arms of the depletion — nucleotide and glycosylation
      donor — and that uridine corrects them, which is the mechanistic basis of
      the treatment node below.
  downstream:
  - target: Dyserythropoiesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Erythroid precursors are proliferative and depend on de novo supply.
    evidence:
    - reference: PMID:32820246
      reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study confirms CAD deficiency as a progressive EIEE with recurrent status epilepticus, loss of skills, and dyserythropoietic anemia."
      explanation: >-
        Classified PARTIAL: the source establishes that dyserythropoietic
        anaemia is part of the disease, but does not demonstrate the
        intervening steps from nucleotide depletion to defective erythropoiesis.
  - target: Progressive Neuronal Injury and Brain Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developing and mature brain is the other affected compartment. How
      pool depletion produces neuronal injury specifically is not established —
      see the gap_pyrimidine_depletion_to_neuronal_injury discussion.
    evidence:
    - reference: PMID:32820246
      reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study confirms CAD deficiency as a progressive EIEE with recurrent status epilepticus, loss of skills, and dyserythropoietic anemia."
      explanation: >-
        Classified PARTIAL: establishes the progressive neurological course
        that this node represents, without evidencing the mechanism connecting
        it to the metabolic lesion.
- name: Dyserythropoiesis
  biological_scale: TISSUE
  description: >-
    The haematological arm is a dyserythropoietic anaemia with a strikingly
    abnormal blood film — anisopoikilocytosis, with target cells and
    poikilocytes described. It is one of the few features that can point at the
    diagnosis before sequencing, and it resolves on uridine. In the hypomorphic
    allelic class it can be the presenting and near-only feature.
  cell_types:
  - preferred_term: Erythroid lineage cell
    term:
      id: CL:0000764
      label: erythroid lineage cell
  evidence:
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in three families identified biallelic CAD mutations in four children with global developmental delay, epileptic encephalopathy, and anaemia with anisopoikilocytosis."
    explanation: >-
      The founding description of the haematological phenotype alongside the
      neurological one.
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood smears normalized and anaemia resolved."
    explanation: >-
      Establishes that this node is reversible on uridine, which is what makes
      it usable as a treatment-response readout.
- name: Progressive Neuronal Injury and Brain Atrophy
  biological_scale: TISSUE
  description: >-
    Neuroimaging shows brain atrophy in most of the patients who have an
    abnormal MRI, involving the whole brain or the cerebellum, with delayed
    myelination and hydrocephalus reported less often. The atrophy is
    progressive if untreated, and at least one sibling pair showed that uridine
    can arrest it. This entry does not declare conformance to
    cerebellar_purkinje_degeneration: cerebellar atrophy is an imaging finding
    here, and no Purkinje-cell-specific lesion has been demonstrated in CAD
    deficiency.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrated that one-third of the reviewed cases had MRI abnormalities, with delayed myelination and brain atrophy being the main manifestations in infants and older children, respectively. The cerebral and/or cerebellar atrophy gradually progressed after 3.5 years of age."
    explanation: >-
      Gives the imaging picture and its age dependence, and states that the
      atrophy is progressive rather than static.
  - reference: PMID:33497533
    reference_title: "Uridine-responsive epileptic encephalopathy due to inherited variants in CAD: A Tale of Two Siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "uridine started at age 5 resulted in dramatic improvements in seizure control and development, cessation of cerebellar atrophy, and resolution of hematological abnormalities"
    explanation: >-
      Shows the atrophy is an active, arrestable process rather than a fixed
      developmental malformation.
  downstream:
  - target: Epileptic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ongoing neuronal injury accompanies the seizure disorder and the loss of
      developmental skills.
    evidence:
    - reference: PMID:38454370
      reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "DEE 50 has early onset, refractory seizures, even status epilepticus leading to death, with favorable response to treatment with oral uridine."
      explanation: >-
        Classified PARTIAL: the source establishes that the epilepsy and the
        progressive course co-occur, not that the atrophy causes the seizures.
- name: Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is an early-onset, drug-refractory epileptic
    encephalopathy with recurrent status epilepticus and loss of acquired
    skills, on a background of developmental delay. Most patients need multiple
    antiseizure medicines and remain refractory on them. This entry does not
    declare conformance to epilepsy_excitation_inhibition_imbalance: no
    excitation-inhibition measurement exists in CAD deficiency, and asserting
    that module's mechanism would substitute a plausible route for an
    evidenced one.
  evidence:
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms CAD deficiency as a progressive EIEE with recurrent status epilepticus, loss of skills, and dyserythropoietic anemia."
    explanation: >-
      Characterizes the endpoint syndrome in a 20-patient series.
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty cases had drug-refractory epilepsy, fourteen had SE, and one had a history of temporal lobectomy and ventriculoperitoneal shunt surgery."
    explanation: >-
      Quantifies refractoriness and status epilepticus in the pooled cohort.
- name: Intact Uridine Salvage Pathway
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    This node is what the disease is bypassable through, not a lesion. Pyrimidines
    can be recycled from uridine by a route that does not use CAD and enters the
    pathway downstream of the block, so supplying uridine restores the depleted
    pools without repairing the enzyme. It is curated as a node so the treatment
    below can point at it. The contrast with DTYMK deficiency is instructive and
    is drawn out in that entry: DTYMK sits downstream of where de novo and
    salvage converge, so the same trick does not work there.
  biological_processes:
  - preferred_term: pyrimidine nucleoside salvage
    term:
      id: GO:0043097
      label: pyrimidine nucleoside salvage
  evidence:
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAD encodes a multifunctional enzyme involved in de novo pyrimidine biosynthesis. Alternatively, pyrimidines can be recycled from uridine."
    explanation: >-
      States the existence of the CAD-independent route that the therapy uses.
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an error of pyrimidine de novo biosynthesis amenable to treatment via the uridine salvage pathway"
    explanation: >-
      Names the salvage pathway as the treatment route, which is the role this
      node plays in the pathograph.
phenotypes:
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay, often with frank regression of acquired skills, is the
    most frequent feature of the disorder, present in 95% of the 42 patients in
    the pooled literature review. Regression rather than static delay is what
    distinguishes the untreated course.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features of the 42 patients included developmental delay or regression (95%), epilepsy (73%), anaemia (71%), extrapyramidal symptoms (33%), dysphagia (23%), hypotonia (14%), and strabismus (7%)"
    explanation: >-
      Gives the 95% figure with an explicit 42-patient denominator, which is
      what the VERY_FREQUENT band rests on.
- name: Developmental regression
  category: Neurologic
  description: >-
    Loss of previously acquired skills is a defining feature of the untreated
    course and is the endpoint that uridine most visibly reverses. It is pooled
    with delay in the 95% figure, so no separate band is assigned.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms CAD deficiency as a progressive EIEE with recurrent status epilepticus, loss of skills, and dyserythropoietic anemia."
    explanation: >-
      Names loss of skills as a confirmed feature of the disorder.
- name: Epileptic encephalopathy
  category: Neurologic
  description: >-
    Epilepsy is present in 73% of reported patients and is characteristically
    drug-refractory: the mean number of antiseizure medicines used was almost
    four, and twenty of the reviewed cases were refractory on them. Onset is
    early, with 76% of those with seizures starting before age two.
    Refractoriness is curated separately, as its own phenotype below.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features of the 42 patients included developmental delay or regression (95%), epilepsy (73%), anaemia (71%), extrapyramidal symptoms (33%), dysphagia (23%), hypotonia (14%), and strabismus (7%)"
    explanation: >-
      Supplies the 73% figure and the 42-patient denominator behind the
      FREQUENT band.
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean number of ASMs used was 3.72 ± 1.36. Twenty cases had drug-refractory epilepsy"
    explanation: >-
      Quantifies the refractoriness recorded as its own phenotype below.
- name: Drug-Resistant Epilepsy
  category: Neurologic
  description: >-
    The epilepsy characteristically resists antiseizure medication: patients in
    the pooled review were on a mean of 3.72 medicines, and twenty of the
    forty-two were refractory on them. No band is assigned. Twenty of 42 is 48%,
    which would fall in FREQUENT, but the denominator for refractoriness is
    properly the 73% who have epilepsy at all, not the whole cohort, and the
    source does not state it that way.
  phenotype_term:

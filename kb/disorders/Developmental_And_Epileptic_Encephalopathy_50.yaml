    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her older brother had a more severe course and only modest response to uridine started at 14 years old."
    explanation: >-
      The within-family contrast that supports treatment timing as a determinant
      of response.
diagnosis:
- name: Exome sequencing with functional validation
  description: >-
    Diagnosis rests on sequencing, but sequencing alone is not sufficient.
    Because CAD is large and prediction tools perform poorly on it, candidate
    variants are commonly returned as variants of unknown significance;
    functional validation in patient-derived fibroblasts, or in the CAD-knockout
    complementation assay, is what establishes the diagnosis. The assay is a
    CRISPR-generated human CAD-knockout line that cannot grow without uridine
    and is rescued by transfection with functional recombinant CAD.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32820246

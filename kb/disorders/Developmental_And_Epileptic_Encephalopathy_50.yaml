progression:
- phase: Onset
  notes: >-
    Onset is early. Ninety per cent of reported patients presented before three
    years of age, at a mean of about 1.6 years, and of those with seizures 76%
    began before age two. Neonatal-onset presentations occur.
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, 90% had onset before 3 years of age, with average of 1.6±1.8 years old."
    explanation: >-
      The onset distribution from the pooled review.
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "add that milder courses with isolated developmental delay/intellectual disability can occur as well as onset with neonatal seizures"
    explanation: >-
      Extends the onset range at both ends — neonatal seizures, and milder
      later-recognized courses.
- phase: Diagnostic delay
  notes: >-
    There is a large gap between onset and diagnosis: a mean age at diagnosis of
    7.7 years against a mean onset of 1.6 years, with a range extending to 43
    years. Because the disorder is treatable and untreated patients deteriorate,
    this delay is itself a determinant of outcome.
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at diagnosis was 7.7 ± 10 years on average (school age) and ranged from 9 months to 43 years with a median of 5.5 years, only two cases were diagnosed in adult."
    explanation: >-
      Quantifies the diagnostic delay against the onset figures above.
- phase: Untreated course and mortality
  notes: >-
    Untreated, the disease is progressive and can be lethal in early childhood.
    The pooled mortality was about 9.5%, and every reported death was in a
    patient who had not received uridine — the single most consequential
    observation in the literature on this disorder.
  evidence:
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mortality rate was approximately 9.5%, with all reported deaths occurring in patients without uridine treatment."
    explanation: >-
      The mortality figure together with its association with untreated status.
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two died aged 4 and 5 years after a neurodegenerative disease course."
    explanation: >-
      The founding cohort's two deaths, both untreated, establishing the lethal
      natural history.
- phase: Treated course
  notes: >-
    Response to uridine can be rapid and substantial. In the founding cohort
    seizures ceased immediately in both treated children, and a four-year-old
    previously in a minimally conscious state began to communicate and walk with
    assistance within nine weeks. Response is not uniform: a sibling started at
    14 years had only a modest response where his sister started at 5 had a
    dramatic one, which is the clearest available signal that timing matters.
  evidence:
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supplementation of the two surviving children with oral uridine led to immediate cessation of seizures in both. A 4-year-old female, previously in a minimally conscious state, began to communicate and walk with assistance after 9 weeks of treatment."
    explanation: >-
      The founding treatment observation, with its timescale.
  - reference: PMID:33497533

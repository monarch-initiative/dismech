genetic:
- name: CAD
  gene_term:
    preferred_term: CAD
    term:
      id: hgnc:1424
      label: CAD
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    CAD is the only gene implicated. Missense variants dominate the reported
    spectrum, with nonsense and splice-site alleles making up the remainder.
    Two features complicate variant interpretation and are the practical reason
    the disorder is under-recognized: the gene is very large with over a
    thousand catalogued missense variants, and prediction tools perform poorly
    on it, so pathogenic alleles are frequently returned as variants of unknown
    significance. A cell-based complementation assay is what resolves them, and
    it reclassified more than half of a suspected cohort as not CAD-deficient.
    A hypomorphic allelic class retains partial activity and produces a
    primarily haematological phenotype.
  evidence:
  - reference: PMID:28007989
    reference_title: "CAD mutations and uridine-responsive epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We establish CAD as a gene confidently implicated in this neurometabolic disorder, characterized by co-occurrence of global developmental delay, dyserythropoietic anaemia and seizures."
    explanation: >-
      The gene-disease association statement from the founding study.
  - reference: PMID:32461667
    reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This condition is difficult to diagnose given the large size of CAD with over 1000 missense variants and the nonspecific clinical presentation."
    explanation: >-
      Establishes the interpretive difficulty that makes functional validation
      necessary.
  - reference: PMID:32461667
    reference_title: "Cell-based analysis of CAD variants identifies individuals likely to benefit from uridine therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used the CAD-knockout complementation assay to test a total of 34 variants, identifying 16 as deleterious for CAD activity. Combination of these pathogenic variants confirmed 11 subjects with a CAD deficit"
    explanation: >-
      Quantifies how many suspected variants were actually deleterious — 16 of
      34 — and how many of 25 suspected individuals were confirmed.
  - reference: PMID:32820246
    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Underlying pathogenic variants are often rated as variants of unknown significance, which could lead to underrecognition of this treatable disorder."
    explanation: >-
      States the clinical consequence of the interpretation problem, which is
      the reason this is worth recording in a knowledge base at all.
  - reference: PMID:37984840
    reference_title: "Biallelic hypomorphic variants in CAD cause uridine-responsive macrocytic anaemia with elevated haemoglobin-A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional studies did not support complete abrogation of protein function; however, the patient responded to uridine supplement. We conclude that biallelic hypomorphic CAD variants may cause a primarily haematological phenotype."
    explanation: >-
      Establishes the hypomorphic allelic class and its distinct phenotypic
      consequence.
  - reference: PMID:38454370
    reference_title: "Novel CAD gene mutations in a boy with developmental and epileptic encephalopathy 50 with dramatic response to uridine therapy: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed a compound heterozygous variant in the CAD gene, with one locus inherited from his father (c.1252C>T: p.Q418* nonsense mutation) and one from his mother (c.6628G>A: p.G2210S, missense mutation)"
    explanation: >-
      A worked example of the compound-heterozygous nonsense-plus-missense
      genotype typical of the disorder.

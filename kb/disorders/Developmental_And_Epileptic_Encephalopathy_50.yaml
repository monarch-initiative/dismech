    reference_title: "Expanding the clinical and genetic spectrum of CAD deficiency: an epileptic encephalopathy treatable with uridine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis relies on genetic testing and functional validation in patient-derived fibroblasts"
    explanation: >-
      Establishes that this system is not merely a research model but part of

# EXPERIMENTAL — SEPIO evidence-model pilot (issue #7439). Example 3 of 3.
#
# NOT a curated dismech entry; deliberately outside kb/disorders/. A small excerpt of
# kb/disorders/Timothy_Syndrome.yaml, carrying BOTH the native `evidence:` and the SEPIO
# `has_evidence_lines:` representation of the same evidence. Content copied verbatim —
# nothing newly curated.
#
# WHAT THIS EXAMPLE SHOWS, that the other two do not:
#
#   AN ARGUMENT THAT RESTS ENTIRELY ON A MODEL ORGANISM, and what it looks like to say
#   so honestly. dismech's curation policy already states that model-organism evidence
#   must not be the sole support for a human claim — but today that is a rule a human
#   applies by reading, because the flat model gives every item the same visual and
#   structural weight regardless of what it can actually establish.
#
#   Here an EMERGING hypothesis — that fever lowers the arrhythmia and seizure
#   threshold in CACNA1C carriers — rests on exactly one zebrafish paper. In SEPIO form
#   that is one evidence line, typed MODEL_ORGANISM, marked WEAK, and the weakness is a
#   property of the argument sitting right next to the claim rather than an inference
#   the reader has to make.
#
#   It also shows the second reason to GROUP items into one line, distinct from the
#   convergence case in the IgG4-RD example: here the two quoted passages are not two
#   findings but a PREMISE AND A RESULT from the same paper — "fever activates CaV1.2"
#   plus "raising the temperature triggered arrhythmia in overtly normal heterozygotes".
#   Neither half is an argument on its own; the syllogism is. Natively they are two
#   sibling items with different `evidence_source` values (MODEL_ORGANISM and OTHER),
#   which reads as two pieces of evidence when it is one.
#
#   This hypothesis is also the worked example behind dismech's hypothesis-based
#   phenotype algorithms (docs/hypothesis-based-phenotype-algorithms.md) — a computable
#   EHR case-finding query predicated on an unproven mechanism. When a query is going to
#   be run against patient records on the strength of an argument, being able to read
#   that argument's strength off the data matters more than usual.
#
# See docs/explanation/sepio-evidence-pilot.md.

name: Timothy Syndrome (SEPIO evidence pilot)
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Experimental excerpt of the Timothy Syndrome entry used to pilot a SEPIO-style
  evidence representation on an emerging hypothesis supported only by an animal model.
  Not a curation target: see kb/disorders/Timothy_Syndrome.yaml for the real entry.
category: Mendelian

notes: >-
  Pilot fixture for issue #7439. Do not cite, extend, or curate against this file.
  Content is duplicated from kb/disorders/Timothy_Syndrome.yaml as of 2026-07-31.

mechanistic_hypotheses:
- hypothesis_group_id: fever_exacerbated_cav1.2
  hypothesis_label: >-
    Fever/elevated body temperature lowers the threshold for CaV1.2-driven
    arrhythmia and seizures
  status: EMERGING
  description: >-
    Elevated body temperature activates the CaV1.2 L-type calcium channel and is
    hypothesized to augment the mutant persistent inward calcium current, so
    febrile episodes may acutely unmask ventricular arrhythmia and lower the
    seizure threshold — even in CACNA1C carriers who are overtly normal at
    baseline. The hypothesis is currently supported by a zebrafish cacna1c model;
    its validity in human patients is an open question.

  # Native representation (unchanged, copied from kb/disorders/Timothy_Syndrome.yaml).
  # Two items, same paper, different `evidence_source` values — structurally identical
  # to two independent supporting references, which is not what they are.
  evidence:
  - reference: PMID:42426269
    reference_title: >-
      Elevated body temperature exacerbates arrhythmia and seizure-like activity
      in a zebrafish model of Timothy syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      elevated water temperature elicited arrhythmia and seizure-like behavior
      even in overtly normal heterozygotes, implicating fever as a modifiable
      risk
    explanation: >-
      In a zebrafish cacna1c Timothy-syndrome model, raising temperature
      elicited arrhythmia and seizure-like behavior even in phenotypically
      normal heterozygotes, directly motivating the fever-exacerbation
      hypothesis.
  - reference: PMID:42426269
    reference_title: >-
      Elevated body temperature exacerbates arrhythmia and seizure-like activity
      in a zebrafish model of Timothy syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      fever, known to activate CaV1.2 channels, may exacerbate TS, yet its
      impact is poorly understood
    explanation: >-
      States the biophysical premise (fever activates CaV1.2) and that its
      impact on Timothy syndrome is not yet characterized in patients.

  # SEPIO representation of the same two passages as ONE argument — a premise and the
  # experimental result that together make the case — explicitly typed to the organism
  # it was made in, and explicitly marked weak for the human claim it is being used to
  # support.
  has_evidence_lines:
  - evidence_type: MODEL_ORGANISM
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: WEAK
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: >-
        fever, known to activate CaV1.2 channels, may exacerbate TS, yet its
        impact is poorly understood
      reported_in:
        id: PMID:42426269
        document_type: PRIMARY_LITERATURE
        title: >-
          Elevated body temperature exacerbates arrhythmia and seizure-like activity
          in a zebrafish model of Timothy syndrome.
    - data_type: TEXT_SPAN
      value: >-
        elevated water temperature elicited arrhythmia and seizure-like behavior
        even in overtly normal heterozygotes, implicating fever as a modifiable
        risk
      reported_in:
        id: PMID:42426269
        document_type: PRIMARY_LITERATURE
        title: >-
          Elevated body temperature exacerbates arrhythmia and seizure-like activity
          in a zebrafish model of Timothy syndrome.
    description: >-
      One argument in two parts from a single paper: the biophysical premise that
      temperature activates CaV1.2, and the experimental result that raising water
      temperature elicited arrhythmia and seizure-like behaviour in cacna1c zebrafish
      that were overtly normal at baseline. Weak with respect to the human claim, and
      deliberately so — the entire argument is made in zebrafish, the paper itself notes
      the impact on Timothy syndrome is poorly understood, and no human febrile-carrier
      series exists. That is exactly why the hypothesis status is EMERGING and why the
      case-finding algorithm predicated on it is marked PROPOSED rather than validated.

  notes: >-
    The single line above carries a WEAK strength on a MODEL_ORGANISM argument, which is
    the machine-readable form of dismech's existing rule that model-organism evidence
    must not be the sole support for a human phenotype. Natively the same state is only
    inferable by noticing that every item happens to share one animal-model reference.

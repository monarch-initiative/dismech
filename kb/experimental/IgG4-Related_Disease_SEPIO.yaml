# EXPERIMENTAL — SEPIO evidence-model pilot (issue #7439). Example 2 of 3.
#
# NOT a curated dismech entry; deliberately outside kb/disorders/. A small excerpt of
# kb/disorders/IgG4-Related_Disease.yaml, carrying BOTH the native `evidence:` and the
# SEPIO `has_evidence_lines:` representation of the same evidence, so the two can be
# compared on one rendered page. Content copied verbatim — nothing newly curated.
#
# WHAT THIS EXAMPLE SHOWS, that the Cystic Fibrosis example does not:
#
#   CONTESTED EVIDENCE. The "innate-first bystander" model is a live scientific
#   dispute. Five references bear on it and they do not agree: mouse and in vitro
#   work supports innate-first initiation, human cross-sectional data partially
#   supports it, and a phase 3 randomised trial of B-cell depletion refutes the
#   "bystander" part of it outright.
#
#   Natively that is five sibling evidence items whose `supports` values differ. What
#   the flat model cannot say is which side is *heavier* — and that is precisely the
#   judgement the entry's own `notes` field spends a paragraph of prose making
#   ("strongly supported ... but four qualifications temper the seed hypothesis ...
#   Status retained as ALTERNATIVE"). In SEPIO form that adjudication becomes
#   structure: each argument carries its own strength, the refuting human RCT
#   outweighs the supporting animal work, and a reader (or a query) can see why the
#   hypothesis sits at ALTERNATIVE rather than CANONICAL without parsing prose.
#
#   It also shows evidence-line GROUPING doing real work on a second axis: the mouse
#   sufficiency experiment and the in vitro NOD2/BAFF shortcut are two mechanistically
#   distinct pathways (TLR7 vs NOD2) making ONE argument — that innate activation
#   alone can initiate IgG4 responses through redundant routes. Their force is
#   convergent, not additive, and one line with two items says so.
#
# See docs/explanation/sepio-evidence-pilot.md.

name: IgG4-Related Disease (SEPIO evidence pilot)
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Experimental excerpt of the IgG4-Related Disease entry used to pilot a SEPIO-style
  evidence representation on a genuinely contested mechanistic hypothesis. Not a
  curation target: see kb/disorders/IgG4-Related_Disease.yaml for the real entry.
category: Autoimmune

notes: >-
  Pilot fixture for issue #7439. Do not cite, extend, or curate against this file.
  Content is duplicated from kb/disorders/IgG4-Related_Disease.yaml as of 2026-07-31.

mechanistic_hypotheses:
- hypothesis_group_id: innate_first_bystander_model
  hypothesis_label: Innate-First Bystander Activation Model
  status: ALTERNATIVE
  description: >-
    A competing or superimposed model in which innate immune activation in
    susceptible tissues precedes classical autoantigen-driven adaptive immunity,
    with plasmablast expansion and IgG4 class switching arising partly as
    downstream bystander responses.

  # Native representation (unchanged, copied from kb/disorders/IgG4-Related_Disease.yaml).
  # Four items, three directions, four evidence sources — and no way to say which wins.
  evidence:
  - reference: PMID:31339007
    reference_title: Activated M2 Macrophages Contribute to the Pathogenesis of IgG4-Related Disease via Toll-like Receptor 7/Interleukin-33 Signaling.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TLR-7-expressing M2 macrophages may promote the activation of Th2 immune
      responses via IL-33 secretion in IgG4-RD.
    explanation: >-
      Case-control study of IgG4-RD patient salivary glands (with in vitro and
      huTLR-7-transgenic mouse validation) supports an innate TLR7/M2 macrophage
      axis as an alternative or upstream amplifier, but it does not replace the
      adaptive plasmablast/CTL model.
  - reference: PMID:39264798
    reference_title: A positive cytokine/chemokine feedback loop establishes plasmacytoid DC-driven autoimmune pancreatitis in IgG4-related disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      murine AIP was initiated by TLR3-bearing conventional DCs in the
      uninflamed pancreas whose activation by the TLR3 ligand poly(I:C) caused
      IFN-α, CXCL9, and CXCL10 secretion
    explanation: >-
      In the MRL/MpJ poly(I:C) autoimmune pancreatitis model, innate TLR3+
      conventional dendritic cells act first in uninflamed tissue and only then
      recruit T cells and plasmacytoid DCs, providing the strongest temporal
      evidence for the innate-first component of the hypothesis.
  - reference: PMID:21971969
    reference_title: Involvement of activation of toll-like receptors and nucleotide-binding oligomerization domain-like receptors in enhanced IgG4 responses in autoimmune pancreatitis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of NOD-2 in monocytes from healthy control subjects induced
      IgG4 production by B cells in a BAFF-dependent and T cell-independent
      manner
    explanation: >-
      PBMC assays demonstrate a T-cell-independent innate-to-IgG4 shortcut in
      which monocyte NOD2 activation drives BAFF-dependent IgG4 class switching,
      one of several redundant innate pathways to IgG4.
  - reference: PMID:39541094
    reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inebilizumab reduced the risk of flares of IgG4-related disease and
      increased the likelihood of flare-free complete remission at 1 year,
      confirming the role of CD19-targeted B-cell depletion as a potential
      treatment for IgG4-related disease
    explanation: >-
      The MITIGATE phase 3 trial shows that CD19+ B-cell depletion dramatically
      prevents disease flares, demonstrating that adaptive B-cell responses are
      necessary to sustain disease and refuting a purely innate/bystander model
      in which innate activation alone would suffice.

  # SEPIO representation of exactly the same four evidence items, reorganised into
  # three arguments and weighted. Nothing is added and nothing is dropped; the
  # strengths encode the adjudication that the entry's `notes` currently makes in prose.
  has_evidence_lines:

  # Argument 1 (the strongest one FOR): innate activation is sufficient to initiate,
  # shown through two mechanistically redundant routes. Two items, one line — the
  # mouse sufficiency experiment and the in vitro NOD2/BAFF shortcut are the same
  # argument made twice over, not two arguments.
  - evidence_type: MODEL_ORGANISM
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: MODERATE
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: >-
        murine AIP was initiated by TLR3-bearing conventional DCs in the
        uninflamed pancreas whose activation by the TLR3 ligand poly(I:C) caused
        IFN-α, CXCL9, and CXCL10 secretion
      reported_in:
        id: PMID:39264798
        document_type: PRIMARY_LITERATURE
        title: A positive cytokine/chemokine feedback loop establishes plasmacytoid DC-driven autoimmune pancreatitis in IgG4-related disease.
    - data_type: TEXT_SPAN
      value: >-
        Activation of NOD-2 in monocytes from healthy control subjects induced
        IgG4 production by B cells in a BAFF-dependent and T cell-independent
        manner
      reported_in:
        id: PMID:21971969
        document_type: PRIMARY_LITERATURE
        title: Involvement of activation of toll-like receptors and nucleotide-binding oligomerization domain-like receptors in enhanced IgG4 responses in autoimmune pancreatitis.
    description: >-
      Innate activation alone can initiate an IgG4 response, shown twice through
      independent routes: TLR3+ conventional dendritic cells act first in uninflamed
      mouse pancreas before any T cell or plasmacytoid DC is recruited, and monocyte
      NOD2 activation drives BAFF-dependent, T-cell-independent IgG4 class switching in
      human PBMCs. Moderate rather than strong: the temporal ordering that carries the
      argument is established only in mouse, and the human arm is an ex vivo assay
      rather than a demonstration in disease. Note the mixed provenance — the line is
      typed MODEL_ORGANISM for its decisive item, which is itself a limitation worth
      seeing rather than averaging away.

  # Argument 2 (weakly for): human tissue is consistent with the innate axis, but is
  # cross-sectional and cannot establish that innate activation came first.
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: PARTIAL
    strength_of_evidence_provided: WEAK
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: >-
        TLR-7-expressing M2 macrophages may promote the activation of Th2 immune
        responses via IL-33 secretion in IgG4-RD.
      reported_in:
        id: PMID:31339007
        document_type: PRIMARY_LITERATURE
        title: Activated M2 Macrophages Contribute to the Pathogenesis of IgG4-Related Disease via Toll-like Receptor 7/Interleukin-33 Signaling.
    description: >-
      Human salivary-gland case-control data are consistent with an innate TLR7/M2
      macrophage axis upstream of the Th2 response. Weak for the hypothesis as stated,
      because a cross-sectional tissue association cannot establish temporal
      priority — the ordering is the whole claim — and the source's own hedge is
      "may promote".

  # Argument 3 (the strongest one AGAINST, and the reason the status is ALTERNATIVE):
  # a randomised phase 3 trial showing the adaptive arm is necessary, which is
  # incompatible with the "bystander" half of the hypothesis.
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: REFUTE
    strength_of_evidence_provided: STRONG
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: >-
        Inebilizumab reduced the risk of flares of IgG4-related disease and
        increased the likelihood of flare-free complete remission at 1 year,
        confirming the role of CD19-targeted B-cell depletion as a potential
        treatment for IgG4-related disease
      reported_in:
        id: PMID:39541094
        document_type: PRIMARY_LITERATURE
        title: Inebilizumab for Treatment of IgG4-Related Disease.
    description: >-
      Depleting CD19+ B cells prevents flares in a randomised phase 3 trial (MITIGATE),
      so the adaptive B-cell response is necessary to sustain disease and cannot be a
      downstream bystander. Strong: an interventional human trial testing necessity
      directly, which is the highest-value design available for this claim and the
      reason this argument outweighs the animal work above.

  notes: >-
    The three lines above are what the entry's real `notes` paragraph says in prose:
    innate-first ordering is well supported but only in mouse, the human data are
    correlational, and B-cell depletion shows adaptive immunity is necessary — hence
    ALTERNATIVE rather than CANONICAL. The point of this fixture is that in SEPIO form
    a reader does not have to take that on trust from a prose block: the strongest
    argument on the page is the one pointing the other way, and it is visible as such.

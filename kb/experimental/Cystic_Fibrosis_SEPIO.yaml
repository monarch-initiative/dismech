# EXPERIMENTAL — SEPIO evidence-model pilot (issue #7439).
#
# This is NOT a curated dismech disorder entry and is deliberately kept out of
# kb/disorders/. It is a small, self-contained excerpt of kb/disorders/Cystic_Fibrosis.yaml
# used to exercise the experimental SEPIO evidence representation end to end:
# schema validation, snippet validation, and rendering.
#
# Every assertion below carries BOTH representations of the SAME evidence:
#
#   evidence:            the native dismech EvidenceItem model (unchanged)
#   has_evidence_lines:  the SEPIO-style model (EvidenceLine / DataItem / Document)
#
# so the two can be read side by side on one rendered page. The content is copied
# verbatim from the production Cystic_Fibrosis entry — nothing here is newly curated,
# and no new literature claims are introduced.
#
# The three worked cases were chosen to cover the mapping's interesting corners:
#
#   1. CFTR Dysfunction              two snippets from one paper making two DIFFERENT
#                                    points -> two evidence lines (1 item each). This is
#                                    the upstream SEPIO example, reproduced faithfully:
#                                    https://github.com/sepio-framework/sepio-linkml/blob/main/workspace/dismech-examples.yaml
#   2. Airway Surface Liquid         one snippet -> one line, plus the strength axis the
#      Depletion                     native model has no room for.
#   3. Recurrent Respiratory         two snippets from DIFFERENT documents of different
#      Infections (phenotype)        kinds, jointly making ONE argument -> one evidence
#                                    line with two evidence items. The native model
#                                    cannot express this grouping at all.
#
# See docs/explanation/sepio-evidence-pilot.md for the full mapping.

name: Cystic Fibrosis (SEPIO evidence pilot)
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Experimental excerpt of the Cystic Fibrosis entry used to pilot a SEPIO-style
  evidence representation alongside the native dismech evidence model. Not a
  curation target: see kb/disorders/Cystic_Fibrosis.yaml for the real entry.
category: Genetic

notes: >-
  Pilot fixture for issue #7439. Do not cite, extend, or curate against this file.
  Content is duplicated from kb/disorders/Cystic_Fibrosis.yaml as of 2026-07-31.

pathophysiology:

# --- Case 1: two snippets, two distinct arguments, one source document ---------
- name: CFTR Dysfunction
  description: >-
    Mutations in the CFTR gene reduce or eliminate CFTR channel function at
    epithelial surfaces. Defective CFTR impairs epithelial anion and water
    handling, creating dehydrated secretions that initiate respiratory,
    gastrointestinal, hepatobiliary, sweat-gland, and reproductive disease.
  cell_types:
  - preferred_term: Epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: Chloride Transport
    modifier: DECREASED
    term:
      id: GO:0006821
      label: chloride transport
  - preferred_term: bicarbonate transport
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport

  # Native representation (unchanged, copied from kb/disorders/Cystic_Fibrosis.yaml)
  evidence:
  - reference: PMID:9922375
    reference_title: "Structure and function of the CFTR chloride channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cystic fibrosis transmembrane conductance regulator (CFTR) is a unique member of the ABC transporter family that forms a novel Cl- channel. It is located predominantly in the apical membrane of epithelia where it mediates transepithelial salt and liquid movement. Dysfunction of CFTR causes the genetic disease cystic fibrosis."
    explanation: Comprehensive review establishes CFTR as chloride channel whose dysfunction causes cystic fibrosis.
  - reference: PMID:9922375
    reference_title: "Structure and function of the CFTR chloride channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CFTR is composed of five domains: two membrane-spanning domains (MSDs), two nucleotide-binding domains (NBDs), and a regulatory (R) domain."
    explanation: Describes the five-domain architecture of CFTR critical to understanding mutation effects.

  # SEPIO representation of exactly the same two evidence items. The two snippets
  # argue for different things — one that CFTR is the channel whose loss causes CF,
  # one about its domain architecture — so they become two separate lines.
  has_evidence_lines:
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: SUPPORT
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: "The cystic fibrosis transmembrane conductance regulator (CFTR) is a unique member of the ABC transporter family that forms a novel Cl- channel. It is located predominantly in the apical membrane of epithelia where it mediates transepithelial salt and liquid movement. Dysfunction of CFTR causes the genetic disease cystic fibrosis."
      reported_in:
        id: PMID:9922375
        document_type: REVIEW
        title: "Structure and function of the CFTR chloride channel."
    description: Comprehensive review establishes CFTR as chloride channel whose dysfunction causes cystic fibrosis.
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: SUPPORT
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: "The CFTR is composed of five domains: two membrane-spanning domains (MSDs), two nucleotide-binding domains (NBDs), and a regulatory (R) domain."
      reported_in:
        id: PMID:9922375
        document_type: REVIEW
        title: "Structure and function of the CFTR chloride channel."
    description: Describes the five-domain architecture of CFTR critical to understanding mutation effects.

  downstream:
  - target: Airway Surface Liquid Depletion
    description: Loss of epithelial chloride and bicarbonate secretion dehydrates airway surface liquid.
    evidence:
    - reference: PMID:23878362
      reference_title: "Does epithelial sodium channel hyperactivity contribute to cystic fibrosis lung disease?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CF lungs are characterized by viscous, dehydrated mucus, persistent neutrophilia and chronic infections. ENaC is negatively regulated by CFTR and, in patients with CF, the absence of CFTR results in a double hit of reduced Cl-/HCO3- and H2O secretion as well as ENaC hyperactivity and increased Na+ and H2O absorption."
      explanation: CFTR loss with reduced Cl-/HCO3- secretion is linked to airway dehydration.

# --- Case 2: one snippet, one line, plus the strength axis ---------------------
- name: Airway Surface Liquid Depletion
  description: >-
    Reduced epithelial anion secretion together with increased sodium absorption
    depletes the periciliary liquid layer and airway surface liquid.
  cell_types:
  - preferred_term: Bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: mucus secretion
    modifier: ABNORMAL
    term:
      id: GO:0070254
      label: mucus secretion
  locations:
  - preferred_term: Lung
    term:
      id: UBERON:0002048
      label: lung

  evidence:
  - reference: PMID:23878362
    reference_title: "Does epithelial sodium channel hyperactivity contribute to cystic fibrosis lung disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CF lungs are characterized by viscous, dehydrated mucus, persistent neutrophilia and chronic infections. ENaC is negatively regulated by CFTR and, in patients with CF, the absence of CFTR results in a double hit of reduced Cl-/HCO3- and H2O secretion as well as ENaC hyperactivity and increased Na+ and H2O absorption."
    explanation: Review describes ENaC hyperactivity and dehydration mechanism in CF airways.

  # The SEPIO form adds two things the native item above cannot say: that the source
  # is a review rather than a primary report, and that this single narrative passage
  # is a moderate rather than a decisive argument for the assertion.
  has_evidence_lines:
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: MODERATE
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: "CF lungs are characterized by viscous, dehydrated mucus, persistent neutrophilia and chronic infections. ENaC is negatively regulated by CFTR and, in patients with CF, the absence of CFTR results in a double hit of reduced Cl-/HCO3- and H2O secretion as well as ENaC hyperactivity and increased Na+ and H2O absorption."
      reported_in:
        id: PMID:23878362
        document_type: REVIEW
        title: "Does epithelial sodium channel hyperactivity contribute to cystic fibrosis lung disease?"
    description: >-
      Review describes ENaC hyperactivity and dehydration mechanism in CF airways. Narrative
      synthesis rather than a primary measurement of airway surface liquid height, hence
      moderate rather than strong.

  downstream:
  - target: Impaired Mucociliary Clearance
    description: Airway liquid depletion causes ineffective mucus transport and mucus stasis.
    evidence:
    - reference: PMID:23878362
      reference_title: "Does epithelial sodium channel hyperactivity contribute to cystic fibrosis lung disease?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Together, these effects are hypothesized to trigger mucus dehydration, resulting in a failure to clear mucus."
      explanation: Supports the mechanistic link between airway dehydration and defective mucus clearance.

- name: Impaired Mucociliary Clearance
  description: >-
    Dehydrated airway surfaces reduce effective mucus transport, allowing mucus to
    remain adherent on airway epithelium.
  biological_processes:
  - preferred_term: mucociliary clearance
    modifier: DECREASED
    term:
      id: GO:0120197
      label: mucociliary clearance

phenotypes:

# --- Case 3: two documents of different kinds, one joint argument --------------
- category: Respiratory
  name: Recurrent Respiratory Infections
  description: >-
    Chronic and recurrent lower respiratory tract infections with characteristic CF
    pathogens including Pseudomonas aeruginosa and Staphylococcus aureus.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Recurrent Respiratory Infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections

  # Natively these are two sibling evidence items with no way to say they make one
  # point together, and no way to say that one is a narrative review while the other
  # is a row out of a structured database.
  evidence:
  - reference: PMID:30986316
    reference_title: "Review of Cystic Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystic fibrosis (CF) is an autosomal recessive disease characterized by pancreatic insufficiency and chronic endobronchial airway infection."
    explanation: Clinical review identifies chronic airway infection as a defining characteristic of cystic fibrosis.
  - reference: ORPHA:586
    reference_title: Cystic fibrosis (Orphanet structured-database record)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0002205 | Recurrent respiratory infections | Very frequent (99-80%)"
    explanation: Orphanet's HPO annotation independently supports recurrent respiratory infections as a very frequent cystic fibrosis phenotype.

  # In SEPIO form the same two passages become ONE argument built from two evidence
  # items — the review states the association and the Orphanet row independently
  # corroborates it, and it is that convergence, not either passage alone, that makes
  # the case. Each item keeps its own source document with its own type.
  has_evidence_lines:
  - evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: STRONG
    has_evidence_items:
    - data_type: TEXT_SPAN
      value: "Cystic fibrosis (CF) is an autosomal recessive disease characterized by pancreatic insufficiency and chronic endobronchial airway infection."
      reported_in:
        id: PMID:30986316
        document_type: REVIEW
        title: "Review of Cystic Fibrosis."
    # NOTE: the title here is "Cystic fibrosis", not the descriptive label the native
    # item above uses. The reference validator only checks titles when it can find one
    # attached to the reference; a bare `reference: ORPHA:586` string gives it nothing
    # to check, so the native `reference_title` is never verified, while a
    # `reported_in` Document is. Moving to SEPIO form turns title checking on.
    - data_type: TEXT_SPAN
      value: "HP:0002205 | Recurrent respiratory infections | Very frequent (99-80%)"
      reported_in:
        id: ORPHA:586
        document_type: STRUCTURED_DATABASE
        title: Cystic fibrosis
    description: >-
      A clinical review and an independent Orphanet HPO annotation converge on chronic
      endobronchial infection as a defining, very frequent feature of cystic fibrosis.
      Neither passage is decisive alone; together they are.

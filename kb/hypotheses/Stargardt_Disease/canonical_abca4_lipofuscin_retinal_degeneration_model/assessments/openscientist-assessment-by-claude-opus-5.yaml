claims:
- claim_id: core-causal-chain-validated
  statement: >-
    The canonical chain from biallelic ABCA4 loss of function through impaired
    N-Ret-PE transport, bisretinoid accumulation, and RPE damage to photoreceptor
    degeneration is validated at every step by independent groups.
  disposition: RETAINED
  report_quote: "The core causal chain — biallelic ABCA4 loss-of-function → impaired N-retinylidene-phosphatidylethanolamine (N-Ret-PE) transport → bisretinoid accumulation → RPE damage → photoreceptor degeneration — has been validated at each mechanistic step by independent research groups using orthogonal approaches."
  rationale: >-
    Verified at the two ends. PMID:34625547 resolves ABCA4 in substrate-free and
    N-Ret-PE-bound states and states outright that ABCA4 flips N-Ret-PE from the
    lumen to the cytoplasmic leaflet of photoreceptor membranes. PMID:10412977
    shows abcr knockout mice accumulate N-retinylidene-PE and A2E in RPE and
    proposes RPE poisoning with secondary photoreceptor degeneration. This is
    nonetheless a restatement of the KB seed hypothesis rather than new support
    for it; what the report adds is the citation set, not a new inference.
  citations:
  - PMID:34625547
  - PMID:10412977
- claim_id: lipofuscin-necessary-not-sufficient
  statement: >-
    Bisretinoid and lipofuscin accumulation is necessary but not sufficient for
    retinal degeneration, because PV knock-in mice reach knockout-level A2E and
    lipofuscin without degenerating for 12 months.
  disposition: RETAINED
  report_quote: "PV knock-in mice (L541P;A1038V) accumulate A2E/lipofuscin at knockout levels yet show no retinal degeneration for 12 months"
  rationale: >-
    PMID:25712131 states it directly: Abca4(PV/PV) mice showed substantial A2E
    and lipofuscin accumulation in RPE cells but no retinal degeneration up to 12
    months of age, similar to Abca4(-/-) mice. This is the report's most
    consequential finding and it is absent from the disease entry, whose
    pathophysiology chain treats lipofuscin accumulation as directly producing
    RPE injury. The authors' own reading is a species difference in the unfolded
    protein response rather than a general insufficiency of lipofuscin, so the
    finding is curated as a human/model mismatch rather than as a refutation.
  citations:
  - PMID:25712131
- claim_id: light-required-cofactor
  statement: >-
    Light exposure is a required cofactor for bisretinoid toxicity rather than
    merely an accelerator, because Abca4/Rdh8 double-knockout mice degenerate
    only when illuminated.
  disposition: QUALIFIED
  report_quote: "bisretinoid accumulation alone is insufficient for degeneration in the PV knock-in mouse model, and Abca4⁻/⁻Rdh8⁻/⁻ double-KO mice degenerate only upon light exposure."
  rationale: >-
    Directionally right but over-cited. The report's support is PMID:26225634,
    which is a manganese-enhanced MRI methods paper. It does report that MEMRI
    contrast stayed high in nonilluminated and in retinylamine-treated
    illuminated double-knockout retinas while illuminated untreated retinas lost
    it, which is consistent with light dependence, but the paper was not designed
    to establish light as necessary and never claims it. PMID:33334878
    independently confirms that ferroptosis appears in double-knockout retina
    after light exposure. Both are mouse-only; the report itself concedes there is
    no human epidemiology, so "required cofactor" is a model-system statement and
    is curated as an environmental modifier plus an open question, not as a
    settled step of the human chain.
  citations:
  - PMID:26225634
  - PMID:33334878
- claim_id: atral-direct-photoreceptor-death-pathways
  statement: >-
    All-trans-retinal acts directly on photoreceptors through ferroptosis,
    pyroptosis, inflammasome activation, and ER stress, forming a cell-death axis
    parallel to RPE lipofuscin toxicity.
  disposition: RETAINED
  report_quote: "The canonical model focuses on RPE lipofuscin toxicity, but multiple distinct cell death pathways are activated by all-trans-retinal directly in photoreceptors"
  rationale: >-
    PMID:33334878 establishes the ferroptosis limb in both directions: atRAL
    overload drives Fe2+ accumulation, ACSL4 induction, system Xc- inhibition,
    GSH depletion, and lipid peroxidation in 661W photoreceptor cells, ferroptosis
    is present in Abca4-/-Rdh8-/- retina after light exposure, and ferrostatin-1
    given systemically alleviates photoreceptor atrophy in those mice. The rescue
    arm is what makes this more than an association. The report's phrasing that
    the axis operates "upstream of RPE lipofuscin accumulation" is loose: the
    evidence supports a parallel pathway acting on photoreceptors, not an upstream
    one, and the curated node is written as parallel. The pyroptosis, NLRP3, and
    ER-stress limbs were not source-checked here and are not curated.
  citations:
  - PMID:33334878
- claim_id: remofuscin-lipofuscin-removal-rescue
  statement: >-
    Pharmacological removal of RPE lipofuscin rescues retinal degeneration in an
    advanced Stargardt mouse model, providing interventional evidence that
    lipofuscin drives degeneration.
  disposition: RETAINED
  report_quote: "a single intravitreal injection in an advanced Stargardt mouse model reversed lipofuscin accumulation in RPE and was accompanied by rescue from retinal degeneration and amelioration of retinal dysfunction"
  rationale: >-
    PMID:35219849 supports this almost word for word, and it is the strongest
    interventional evidence in the report for the lipofuscin limb specifically,
    because it removes existing lipofuscin rather than preventing its formation.
    It sits in productive tension with the PV knock-in result and both are worth
    carrying. Model-organism evidence only; no human data.
  citations:
  - PMID:35219849
- claim_id: genotype-dependent-cell-death-order
  statement: >-
    The temporal order of cell death is genotype-dependent, with G1961E-associated
    disease showing photoreceptor loss before RPE atrophy rather than the
    canonical RPE-first sequence.
  disposition: QUALIFIED
  report_quote: "In G1961E-associated STGD1, SD-OCT reveals progressive ellipsoid zone (EZ) band loss preceding RPE atrophy through three defined stages, indicating photoreceptor-first degeneration"
  rationale: >-
    The conditional is inverted. PMID:25301883 studied 15 patients selected for
    the optical gap phenotype and found 91% of them were compound heterozygous
    for p.G1961E. That supports "optical-gap lesions are usually G1961E", not
    "G1961E disease is usually photoreceptor-first", and the paper scopes its
    ordering conclusion to ABCA4-associated optical gap lesions. The underlying
    observation, that focal photoreceptor loss can precede RPE dysfunction, is
    real and does qualify the entry's strict RPE-first edge, so it is curated as a
    scoped counter-observation on that edge rather than as a subtype rule.
  citations:
  - PMID:25301883
- claim_id: rpe-autonomous-abca4-lipid-function
  statement: >-
    ABCA4 has an RPE-autonomous role in lipid homeostasis, so RPE pathology is
    partly independent of bisretinoid delivered from photoreceptors.
  disposition: QUALIFIED
  report_quote: "Farnoodian et al. (2023) demonstrated that ABCA4 loss-of-function in RPE leads to cell-autonomous lipid homeostasis defects in both mouse and human Stargardt models"
  rationale: >-
    PMID:37385300 does contain that sentence, but it is a Pharmacology and
    Therapeutics article in which the authors restate their own earlier finding
    ("Recently, we demonstrated that...") before presenting lipidomic profiles of
    mouse and human Stargardt models. It is therefore review-level restatement
    plus new lipidomics, not the primary demonstration the report implies, and it
    is graded accordingly. The claim is a genuine addition to the disease entry,
    which currently models ABCA4 dysfunction as photoreceptor-only.
  citations:
  - PMID:37385300
- claim_id: qaf-elevated-bisretinoid-in-vivo
  statement: >-
    Quantitative fundus autofluorescence confirms elevated bisretinoid in living
    patients and tracks allele severity.
  disposition: QUALIFIED
  report_quote: "quantitative fundus autofluorescence confirming elevated bisretinoid levels in vivo correlated with genotype severity"
  rationale: >-
    PMID:32891696 supports both limbs: 76.6% of 77 patients exceeded the 95%
    prediction interval of age-matched controls, and nullizygous patients reached
    high qAF earlier in life than those carrying a milder variant. The report
    omits the study's other conclusion, that lipofuscin accumulation precedes
    other structural changes and may remain without clinically relevant effect on
    retinal function, which cuts the same way as the PV knock-in paradox and
    should not have been dropped from a section arguing for lipofuscin toxicity.
  citations:
  - PMID:32891696
- claim_id: second-allele-progression-range
  statement: >-
    In G1961E-associated disease the identity of the second ABCA4 allele shifts
    progression across a range of roughly 70 years.
  disposition: QUALIFIED
  report_quote: "For the common G1961E variant, the second allele identity determines progression rate across a ~70-year range"
  rationale: >-
    PMID:41677386 reports that differences in the second variant were strongly
    associated with variation in progression, with c.1957C>T at -50.7 years and
    c.1648G>A at +19.8 years for age at criterion ellipsoid-zone loss. The
    "70-year range" is the report's own arithmetic on two extreme model
    coefficients and appears nowhere in the paper; with 52 analysed patients
    spread over many second alleles, the per-variant estimates are thin. The
    qualitative finding is solid and is what gets curated.
  citations:
  - PMID:41677386
- claim_id: cis-modifier-g1961e-penetrance
  statement: >-
    A cis-acting deep intronic variant, c.769-784C>T, on the p.Gly1961Glu allele
    modulates penetrance and severity.
  disposition: RETAINED
  report_quote: "c.769-784C>T on the G1961E allele was present in 5/7 homozygous G1961E cases and associated with more severe phenotype"
  rationale: >-
    PMID:33909047 matches on every element: the haplotype was present in 5/7
    homozygous cases where p.(Gly1961Glu) was the only known pathogenic variant,
    complex-allele carriers had a more severe phenotype, and the authors conclude
    the variant is a major cis-acting modifier that explains the paucity of
    affected homozygotes. The disease entry records G1961E as a mild allele
    without this modifier, so it is a real gap.
  citations:
  - PMID:33909047
- claim_id: misfolding-and-er-retention-mechanism
  statement: >-
    Protein misfolding with ER retention is a distinct pathogenic mechanism for
    many ABCA4 missense variants.
  disposition: QUALIFIED
  report_quote: "**Protein misfolding and ER retention** represent a distinct pathogenic mechanism for many missense variants."
  rationale: >-
    The misfolding half is supported and the ER-retention half is contradicted by
    the report's own lead citation. PMID:25712131 states that the mutant ABCA4
    proteins expressed heterologously retained normal cellular localization, with
    the defect being reduced ATPase activity, electron-microscopic misfolding, and
    near-complete loss of protein in vivo despite near-normal RNA. That is
    misfolding plus rapid degradation, not ER retention. Since the report
    generalizes from one mislabelled example, the misfolding mechanism is not
    curated as a pathophysiology node here; the mouse result is curated instead as
    the human/model mismatch it supports.
  citations:
  - PMID:25712131
- claim_id: no-proven-human-therapy
  statement: >-
    No gene therapy, cell replacement, or visual cycle modulator has demonstrated
    clinical benefit in human STGD1 trials.
  disposition: RETAINED
  report_quote: "no gene therapy, cell replacement, or visual cycle modulator has demonstrated clinical benefit in human STGD1 trials to date."
  rationale: >-
    Checked for the two named trials. PMID:35248547 reports that across 22
    patients and three dose levels of EIAV-ABCA4 no patient had a clinically
    significant change in any functional endpoint attributable to treatment, and
    hypoautofluorescent change was worse in the treated eye in 6 patients.
    PMID:29884405 reports that microperimetry showed no evidence of benefit at 12
    months in all 12 hESC-RPE recipients and that apparent acuity gains were
    unsustained or matched in the untreated eye. This matters for curation because
    the disease entry's stem-cell and gene-therapy treatment entries currently
    carry only optimistic review-level evidence.
  citations:
  - PMID:35248547
  - PMID:29884405
- claim_id: light-exposure-epidemiology-gap
  statement: >-
    No epidemiological study has tested whether light exposure modifies STGD1
    progression in humans, despite the mouse data and the low cost of
    photoprotection.
  disposition: RETAINED
  report_quote: "If light exposure accelerates STGD1 as animal data predicts, photoprotection (blue-blocking lenses, reduced light exposure) would be an immediate, low-cost intervention available now"
  rationale: >-
    Retained as a curation-relevant open question rather than as an established
    absence, because the negative search behind it is not logged (see the
    pubmed-light-exposure-search data source). The gap is well posed: the mouse
    evidence is directional, the intervention is cheap and available, and no
    human study is cited anywhere in the report or in the disease entry.
  citations:
  - PMID:26225634
- claim_id: seed-hypothesis-factual-errors
  statement: >-
    The seed hypothesis text contained two factual errors, a CTNS/CEP290 gene
    therapy reference and a reference to emisindiprost.
  disposition: RETAINED
  report_quote: 'The seed hypothesis also contains two factual errors: references to "CTNS/CEP290 retinal gene therapy" are incorrect (CTNS causes cystinosis; CEP290 causes Leber congenital amaurosis/Joubert syndrome), and "emisindiprost" has no PubMed-indexed evidence in the context of Stargardt disease.'
  rationale: >-
    Correct on both counts, and already fixed. The current
    mechanistic_hypotheses description in kb/disorders/Stargardt_Disease.yaml
    names emixustat rather than emisindiprost and cites AAV-ABCA4 strategies
    including EIAV-ABCA4 / SAR422459 and dual-vector designs, with no CTNS or
    CEP290 mention. No further action; recorded so a later reviewer does not
    reopen it.

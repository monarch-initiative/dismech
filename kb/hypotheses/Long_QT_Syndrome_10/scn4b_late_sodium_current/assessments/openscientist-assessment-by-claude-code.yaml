overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report's verdict, that the SCN4B L179F late-sodium-current model is
  biophysically plausible but rests on one family and one heterologous
  experiment, is correct, and its recommendation to keep the hypothesis
  EMERGING and the knowledge gap lqt10_scn4b_causality_unestablished open is
  the right curation outcome. The dispute is not resolved by this run: no
  second family, no cardiomyocyte replication and no new genetic evidence were
  found. What the report adds beyond the seed is checkable: gnomAD v4.1 places
  L179F as a single Admixed American allele (AC=1 of 152,122) and SCN4B as
  loss-of-function tolerant (pLI about 0, LOEUF 1.48), which constrains the
  model to a strict gain-of-function mechanism, and it names polygenic QT risk
  as the main competing explanation for single-family segregation. Every quote
  checked against the cited abstracts matches, and the gnomAD figures were
  reproduced by an independent live query. The one defect is an ontology lead:
  CL:0002129 resolves to regular atrial cardiac myocyte, not the ventricular
  cardiomyocyte the report names. The report also describes the ClinGen-framework
  tier as limited or disputed, where the cited reappraisal classifies SCN4B
  specifically as disputed.

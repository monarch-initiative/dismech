claims:
  - claim_id: single-family-single-assay
    statement: >-
      The direct evidence for the model is one three-generation family and one
      HEK293 experiment showing an 8-fold increase in late sodium current, and
      262 genotype-negative LQTS patients carried no further SCN4B mutation.
    disposition: RETAINED
    report_quote: >-
      The entire direct evidentiary basis is a single 2007 report
    rationale: >-
      Matches the cached abstract of PMID:17592081, including "an 8-fold
      (compared with SCN5A alone) and 3-fold (compared with SCN5A + WT-beta4)
      increase in late sodium current" and the 262-patient screen. This is
      already the knowledge gap's rationale in the entry, so the report confirms
      rather than extends it.
    citations:
      - PMID:17592081
  - claim_id: clingen-framework-disputed
    statement: >-
      The international ClinGen-framework reappraisal of LQTS genes does not
      support SCN4B as a cause of congenital LQTS.
    disposition: QUALIFIED
    report_quote: >-
      placed SCN4B among the LQTS genes with **limited or disputed** gene–disease validity
    rationale: >-
      Correct in direction, but less specific than the source: PMID:31983240
      lists SCN4B among the six genes "classified as disputed", not merely
      limited, and gives the reason that the original report used a candidate
      gene approach without statistically significant segregation. The entry's
      DISPUTED relationship type is the accurate reading.
    citations:
      - PMID:31983240
  - claim_id: ultra-rare-vus
    statement: >-
      L179F is a single ultra-rare gnomAD v4.1 allele and a ClinVar variant of
      uncertain significance.
    disposition: RETAINED
    report_quote: >-
      exists in gnomAD v4.1 as a **single ultra-rare allele** (AC=1, AF≈6.6×10⁻⁶)
    rationale: >-
      Reproduced by the assessor's own live gnomAD query (genome AC 1, AN
      152,122, no exome call). The provider's retrieval is recorded as PARTIAL
      because its query code is not committed, so this claim is retained on
      the assessor's independent check, not on the provider's execution. New relative to the entry, which does not record the
      population frequency or ClinVar status.
  - claim_id: scn4b-lof-tolerant
    statement: >-
      SCN4B shows no loss-of-function constraint, so the model must rest on a
      specific gain-of-function effect rather than on dosage.
    disposition: RETAINED
    report_quote: >-
      **SCN4B shows no loss-of-function constraint** (pLI≈0, LOEUF≈1.48)
    rationale: >-
      The constraint values reproduce exactly in the assessor's own live query;
      as above, the claim is retained on that check rather than on the
      provider's PARTIAL retrieval. The inference drawn from them is
      sound and sharpens the hypothesis: any SCN4B LQTS mechanism has to be
      gain-of-function, which is what the seed already proposes.
  - claim_id: beta-subunit-class-plausibility
    statement: >-
      Other sodium channel beta-subunit variants raise late sodium current,
      making the mechanism class plausible without supporting L179F
      specifically.
    disposition: RETAINED
    report_quote: >-
      the mechanism is real as a class, yet the specific L179F→LQT10 causal chain remains supported by a single source
    rationale: >-
      The quoted findings match PMID:20226894 (beta4-S206L, in a sudden infant
      death context) and PMID:24662403 (SCN1B beta1b-P213T). The report is
      careful to label these as qualifying rather than confirming, which is
      correct.
    citations:
      - PMID:20226894
      - PMID:24662403
  - claim_id: polygenic-competing-model
    statement: >-
      Polygenic QT risk is a credible competing explanation for prolonged QT
      co-segregating in a single small pedigree.
    disposition: QUALIFIED
    report_quote: >-
      polygenic background is a credible confounder of apparent co-segregation
    rationale: >-
      The cited population and carrier studies say what the report quotes
      (PMID:35389749, PMID:39209900, and PMID:42111135 on LQT1 carriers).
      They show that polygenic score modulates QTc and penetrance; they do not
      show that it explains this family, whose proband had a QTc of 712 ms at
      21 months, far beyond typical polygenic effects. A competing model worth
      recording as an alternative, not one that displaces the seed.
    citations:
      - PMID:35389749
      - PMID:39209900
      - PMID:42111135
  - claim_id: retain-emerging-and-gap
    statement: >-
      The hypothesis should stay EMERGING and the causality knowledge gap should
      stay open until an independent family and a native-tissue functional
      replication exist.
    disposition: RETAINED
    report_quote: >-
      The seed hypothesis should retain EMERGING status, and the knowledge gap `lqt10_scn4b_causality_unestablished` should be retained.
    rationale: >-
      Follows from the checked claims above. The dispute is not one this run
      can settle; it needs new genetic and functional evidence, which is what
      the knowledge gap records.
  - claim_id: cell-type-ontology-lead
    statement: >-
      CL:0002129 is the cell-type term for the ventricular cardiomyocyte.
    disposition: REJECTED
    report_quote: >-
      cell type — ventricular cardiomyocyte (CL:0002129)
    rationale: >-
      The report's own term validation shows CL:0002129 resolves to regular
      atrial cardiac myocyte. The lead must not be used.

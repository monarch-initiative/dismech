hypothesis_id: tmao_autonomic_af
assessed_at: "2026-08-02T22:30:00Z"
overall_verdict: INCONCLUSIVE
summary: >-
  This hypothesis was chosen deliberately as the best available match for a
  knowledge-graph query - its causal claim is itself a two-hop
  chemical-gene-disease assertion (TMAO acts on atrial fibrillation via the M2
  muscarinic receptor), over a common disease with dense gene annotation and an
  endogenous metabolite that chemical-gene resources cover well. The run cannot
  be used, for a reason worth recording: the merged knowledge graph returns the
  queried CURIE `CHEBI:15724` under the label *L-asparagine*, and the
  publications attached to a single one of its edges are a mixture of asparagine
  and TMAO studies. Two distinct molecules' assertions are merged under one
  node, so no returned route can be attributed to TMAO without checking each
  citation individually. The hypothesis's specific intermediate, CHRM2, does not
  appear; nor does anything muscarinic or autonomic. Nothing here supports,
  refutes or qualifies the hypothesis. The report is retained as a record of the
  defect and as the reference case for the entity-mismatch guard the tool now
  applies.
claims:
  - claim_id: node-conflates-two-chemicals
    statement: >-
      The knowledge-graph node for the queried CURIE merges trimethylamine
      N-oxide with L-asparagine, so every route in the report has ambiguous
      chemical identity.
    disposition: REJECTED
    report_quote: "The knowledge graph labels `CHEBI:15724` as **L-asparagine**"
    rationale: >-
      ChEBI assigns CHEBI:15724 to trimethylamine N-oxide and CHEBI:17196 to
      L-asparagine; the SRI node normalizer also returns "trimethylamine
      N-oxide" as the preferred label for CHEBI:15724. The merged ARS knowledge
      graph nonetheless names that node L-asparagine. The contamination is not
      only cosmetic: on the single node-to-TNF edge, PMID:27554055 ("Asparagine
      improves intestinal integrity...") and PMID:26079268 ("Asparagine
      attenuates hepatic injury...") are asparagine studies, while
      PMID:31715585 and PMID:35676936 are TMAO studies. Assertions from two
      chemicals are pooled, so a curator reading any route as a TMAO finding
      would be attributing asparagine biology to TMAO in an unknown fraction of
      cases.
    citations:
      - PMID:27554055
      - PMID:26079268
      - PMID:31715585
      - PMID:35676936
  - claim_id: chrm2-absent
    statement: >-
      The hypothesis's asserted intermediate - the M2 muscarinic receptor
      (CHRM2) - appears in no route, and neither does any autonomic or
      muscarinic mechanism.
    disposition: NEEDS_VERIFICATION
    report_quote: "- Paths: 20"
    rationale: >-
      The twenty returned intermediates are dominated by generic inflammatory
      and metabolic genes (TNF, IL6, IL1B, NLRP3, TLR4, CD36, APOE, AGT), which
      is the signature of text-mined chemical-gene edges crossed with a
      well-annotated common disease rather than of a specific mechanism. Because
      the chemical node is conflated, the absence of CHRM2 cannot be read as
      evidence that the graph lacks a TMAO-CHRM2 assertion; the query never
      cleanly asked about TMAO. The hypothesis therefore remains untested by
      this run and should be re-queried if the upstream node is corrected.
  - claim_id: intermediates-unmatched-by-design
    statement: >-
      No returned intermediate matched the entry's curated mechanism, which in
      this case reflects the noise of the answer set rather than a curation gap.
    disposition: QUALIFIED
    report_quote: "- Entry does not yet curate this drug."
    rationale: >-
      Every route came back unmatched. On a clean run that pattern would be a
      useful signal - candidate mechanism the entry does not model - but here
      the unmatched genes are largely non-specific inflammatory mediators
      reached through text-mining providers, and the chemical identity is
      unreliable. Treating any of them as a curation lead for atrial
      fibrillation would import noise. The one defensible use of this report is
      the negative methodological finding it documents.

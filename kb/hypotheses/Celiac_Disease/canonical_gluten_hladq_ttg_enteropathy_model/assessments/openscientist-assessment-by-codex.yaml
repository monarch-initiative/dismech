hypothesis_id: canonical_gluten_hladq_ttg_enteropathy_model
assessed_at: "2026-07-31T17:37:10Z"
overall_verdict: SUPPORTED
summary: >-
  The canonical gluten-to-TG2-deamidation-to-HLA-DQ-restricted CD4 T-cell
  mechanism is supported by human T-cell studies and by attenuation of
  gluten-challenge injury with the TG2 inhibitor ZED1227. The report is not
  reliable as written for finer-grained curation. It converts attenuation into
  proof that TG2 is necessary and dose-responsive, generalizes an engineered
  HLA-DQ8/IL-15 mouse model into a universal three-signal requirement, and
  treats individually plausible mechanisms as three established feedback loops
  that explain chronicity. Its claims that IgA-CD71 transcytosis is the
  dominant gluten-entry route and that Nexvax2 failure proves nonadaptive
  pathways are required are not supported by the cited experiments. ATI/TLR4
  evidence is preclinical and not specific to celiac disease. Most importantly,
  a published phase 2a anti-IL-15 trial predates the report and directly
  contradicts its asserted evidence gap. Citation characterization, ontology
  mappings, the unreconstructable 130-paper corpus, and four missing figure
  artifacts add provenance concerns. These qualifications do not overturn the
  canonical core, but they preclude blind promotion of the five proposed
  expansions into the disease YAML.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-core
    statement: >-
      TG2 deamidation enhances HLA-DQ2/DQ8 presentation of gluten peptides to
      disease-relevant CD4 T cells and contributes causally to celiac mucosal
      injury.
    disposition: RETAINED
    report_quote: >-
      The canonical gluten/HLA-DQ2-DQ8/tTG enteropathy model is strongly
      supported as the central pathogenic mechanism of celiac disease (CeD).
    rationale: >-
      Human intestinal T-cell studies establish preferential recognition of
      TG2-deamidated, HLA-DQ-restricted gluten epitopes, tetramer studies detect
      and quantify disease-associated gluten-reactive CD4 T cells, and the
      randomized ZED1227 gluten-challenge trial provides interventional support
      for a pathogenic contribution from TG2. This supports the scoped core,
      not every downstream expansion in the report.
    citations:
      - PMID:10684852
      - PMID:23775608
      - PMID:34192430
  - claim_id: zed1227-interventional-support
    statement: >-
      ZED1227 attenuated gluten-induced mucosal injury at all three tested dose
      levels in a randomized phase 2a proof-of-concept trial.
    disposition: RETAINED
    report_quote: >-
      All three dose levels of ZED1227 significantly attenuated gluten-induced
      duodenal mucosal injury versus placebo.
    rationale: >-
      The report accurately transcribes the primary villus-height-to-crypt-depth
      differences for the three groups, and follow-up studies support mucosal
      target localization and broad transcriptomic attenuation. The trial was
      short, used gluten challenge in treated disease, and showed attenuation
      rather than complete prevention.
    citations:
      - PMID:34192430
      - PMID:37445994
      - PMID:38914866
  - claim_id: zed1227-dose-dependence-and-necessity
    statement: >-
      The ZED1227 trial demonstrated dose-dependent efficacy and proved that TG2
      is a necessary node in the human pathogenic chain.
    disposition: REJECTED
    report_quote: >-
      pharmacological TG2 inhibition attenuated gluten-induced villous atrophy
      in a dose-dependent manner, confirming TG2 as a necessary node in the
      pathogenic chain.
    rationale: >-
      The primary endpoint differences from placebo were 0.44 at 10 mg, 0.49 at
      50 mg, and 0.48 at 100 mg, which is not a monotonic dose response.
      Pharmacologic inhibition attenuated rather than abolished injury and does
      not establish that TG2 is strictly necessary in every genotype or disease
      context. The defensible inference is causal contribution and therapeutic
      tractability.
    citations:
      - PMID:34192430
  - claim_id: three-signal-generalization
    statement: >-
      IL-15 expression in two intestinal compartments, gluten, and HLA-DQ are a
      universally demonstrated co-requirement for human celiac villous atrophy.
    disposition: QUALIFIED
    report_quote: >-
      A critical expansion of the canonical model emerged from mouse studies
      demonstrating that villous atrophy requires three simultaneous signals:
      (1) IL-15 overexpression, (2) gluten exposure, and (3) HLA-DQ expression.
    rationale: >-
      The three-way perturbation was demonstrated in an engineered HLA-DQ8
      mouse with IL-15 overexpression in epithelium and lamina propria. Human
      biopsy studies support IL-15 involvement and synergy between epithelial
      stress and adaptive immunity, but they do not establish that this exact
      engineered configuration is a universal necessary-and-sufficient rule in
      patients. Curate it as strong model-organism support and a human
      mechanistic hypothesis, not as a proven human co-requirement.
    citations:
      - PMID:15357948
      - PMID:26001928
      - PMID:32051586
  - claim_id: mixed-cytokine-response
    statement: >-
      Active celiac mucosa contains IL-17A- and IL-21-producing T cells in
      addition to the established IFN-gamma-dominant response.
    disposition: QUALIFIED
    report_quote: >-
      The canonical model describes a Th1/IFN-γ response, but primary evidence
      shows a more complex cytokine milieu.
    rationale: >-
      The cited human biopsy studies support IL-17A and IL-21 expression,
      including IFN-gamma co-expression and gliadin responsiveness. They do not
      establish a single stable Th17 lineage as a coequal causal driver or show
      that changing the canonical description to a mixed Th1/Th17/IL-21 model
      improves causal specificity. Retain the cytokine complexity with that
      caveat.
    citations:
      - PMID:20061410
      - PMID:21206487
      - PMID:22785229
  - claim_id: feedback-loops-and-chronicity
    statement: >-
      Three nested positive-feedback loops have been demonstrated to jointly
      drive disease chronicity, slow healing, and treatment resistance.
    disposition: QUALIFIED
    report_quote: >-
      These loops explain: (a) rapid disease escalation after initiation, (b)
      slow and often incomplete mucosal healing on GFD (65% at 2 years, 85% at 5
      years, with 10% persistent atrophy; [PMID: 12219789](https://pubmed.ncbi.nlm.nih.gov/12219789/);
      [PMID: 3170777](https://pubmed.ncbi.nlm.nih.gov/3170777/)), and (c)
      decade-long T cell memory.
    rationale: >-
      IgA-CD71 transport, thioredoxin activation of extracellular TG2, and
      epitope-dependent T-B collaboration each have experimental support, but
      they were studied in different systems. The B-cell paper says selected
      TG2-reactive B cells could be principal antigen-presenting cells, and the
      report itself acknowledges that the three mechanisms have never been
      tested as an integrated system. The histologic follow-up cohorts document
      delayed or incomplete recovery but do not attribute it to these loops.
    citations:
      - PMID:3170777
      - PMID:12219789
      - PMID:21908620
      - PMID:22750506
      - PMID:31285344
  - claim_id: ati-celiac-amplifier
    statement: >-
      Wheat amylase-trypsin inhibitors are established TLR4-dependent adjuvants
      of the adaptive gluten response in human celiac disease.
    disposition: QUALIFIED
    report_quote: >-
      This represents a parallel, non-gluten wheat component contributing to
      CeD pathogenesis.
    rationale: >-
      The cited work establishes TLR4 activation in cell systems and modest
      intestinal inflammation in mice; the second study concerns allergic
      inflammation in PBMC-humanized mice, not celiac disease. These data make
      ATI/TLR4 a plausible parallel amplifier, but they do not directly
      demonstrate contribution to human celiac initiation or enteropathy.
    citations:
      - PMID:27993525
      - PMID:29574077
  - claim_id: nexvax2-mechanistic-inference
    statement: >-
      Failure of Nexvax2 proves that dominant gluten-specific CD4 T-cell
      epitopes are insufficient and that additional innate or non-dominant
      pathways cause disease.
    disposition: REJECTED
    report_quote: >-
      This negative result is mechanistically informative: targeting dominant
      gluten CD4+ T cell epitopes alone is insufficient, strongly suggesting
      that additional pathogenic pathways (innate immunity, non-immunodominant
      epitopes, IEL activation) operate beyond the adaptive axis.
    rationale: >-
      The terminated trial showed that this dosing and tolerization strategy did
      not reduce acute symptoms after bolus gluten challenge. It did not isolate
      failure of the targeted epitopes from dose, schedule, immune deviation,
      or other product-level explanations. Contrary to the report, the cited
      study did not test protection from mucosal injury. A failed therapy is not
      a clean causal ablation of the adaptive pathway.
    citations:
      - PMID:36898393
  - claim_id: transcellular-transport-dominance
    statement: >-
      IgA-CD71 transcytosis is the dominant route by which gluten peptides reach
      the human lamina propria, superseding paracellular transport.
    disposition: REJECTED
    report_quote: >-
      Combined with the IgA-CD71 retrotranscytosis finding ([PMID:
      22750506](https://pubmed.ncbi.nlm.nih.gov/22750506/)), these data indicate
      transcellular routes are the dominant mechanism of gluten peptide access
      to the lamina propria, qualifying the canonical model's implicit reliance
      on paracellular permeability.
    rationale: >-
      The CD71 study demonstrated a possible transport mechanism in epithelial
      monolayers, not its quantitative dominance in patients. The HLA-DQ8 mouse
      study measured bacterial translocation, not gluten-peptide route usage.
      Larazotide trials and a meta-analysis found mixed permeability and symptom
      endpoints; they did not compare transcellular with paracellular gluten
      flux. No cited experiment supports the route-ranking conclusion.
    citations:
      - PMID:21822909
      - PMID:22750506
      - PMID:23163616
      - PMID:34339872
  - claim_id: anti-il15-trial-gap
    statement: >-
      No phase 2 or later human celiac trial of anti-IL-15 therapy had been
      published by the report's May 2026 search date.
    disposition: REJECTED
    report_quote: >-
      However, no published phase 2+ human CeD trial of anti-IL-15 therapy was
      identified as of our search date.
    rationale: >-
      A randomized, double-blind, placebo-controlled phase 2a trial of the
      anti-IL-15 monoclonal antibody AMG 714 in 64 adults with celiac disease and
      gluten challenge was published in 2019. It did not meet the primary
      villus-height-to-crypt-depth endpoint, although the 300-mg group had a
      smaller IEL increase and symptom signals. This is both a direct search
      failure and material negative therapeutic evidence for the IL-15 arm.
    citations:
      - PMID:19805228
      - PMID:31494096
      - PMID:31622625
  - claim_id: rcd2-boundary
    statement: >-
      Refractory celiac disease type II is an important boundary condition in
      which stable clonal IEL expansion can become independent of continuing
      gluten stimulation.
    disposition: RETAINED
    report_quote: >-
      This represents a clear boundary condition where the canonical model is
      insufficient — the disease has transitioned to a gluten-independent,
      pre-lymphomatous state.
    rationale: >-
      Persistent clonal IEL disease despite a gluten-free diet and the lack of
      homology between dominant RCDII TCR-beta sequences and known
      gliadin-specific sequences support this boundary. The sequence evidence
      supports rather than by itself proves stimulus independence, but the
      report's boundary-level conclusion is appropriate.
    citations:
      - PMID:28188172
      - PMID:29787419
  - claim_id: potential-celiac-inference
    statement: >-
      Positive celiac serology with normal histology proves activation and later
      spontaneous resolution of the complete canonical adaptive cascade.
    disposition: QUALIFIED
    report_quote: >-
      This demonstrates that the canonical adaptive immune cascade can be
      activated (positive serology) without progressing to tissue damage, and
      can even self-resolve — strongly supporting the multi-signal requirement
      for atrophy.
    rationale: >-
      The prospective pediatric cohort directly supports heterogeneous outcomes:
      some children progressed to villous atrophy while others lost seropositivity.
      Anti-TG2 and anti-endomysial antibodies indicate a disease-associated
      humoral response, but the study did not show activation or resolution of
      every T-cell and effector step in the report's canonical cascade. It is
      consistent with, but does not prove, a strict multi-signal requirement.
    citations:
      - PMID:30978358
  - claim_id: dermatitis-herpetiformis-independence
    statement: >-
      The cited evidence proves that the humoral arm of celiac disease causes
      dermatitis herpetiformis independently of enteropathy.
    disposition: REJECTED
    report_quote: >-
      This demonstrates that the humoral arm of the canonical model can cause
      extraintestinal damage independently of enteropathy.
    rationale: >-
      The TG3 source is a review, and PMID:22214930 is a report of DH-like
      dermatitis in one rhesus macaque rather than primary human cross-reactivity
      evidence. The HLA-DQ8 NOD model found blistering in 15 of 90 sensitized
      mice and no bowel pathology in only the three blistering mice examined.
      That model supports separability as a hypothesis; it does not establish
      an enteropathy-independent causal route in human dermatitis herpetiformis.
    citations:
      - PMID:15489956
      - PMID:22214930
      - PMID:22811741
  - claim_id: seronegative-core-inference
    statement: >-
      HLA-DQ2/DQ8 positivity and response to a gluten-free diet confirm that the
      core T-cell pathway operates in seronegative celiac disease.
    disposition: QUALIFIED
    report_quote: >-
      The preservation of HLA-DQ2/DQ8 requirement and GFD response confirms the
      core T cell pathway operates in the absence of detectable serum
      antibodies.
    rationale: >-
      The 1.7 percent figure is specific to one retrospective referral cohort.
      HLA-DQ2/DQ8 positivity and improvement on diet were diagnostic inclusion
      criteria, and the study did not measure gluten-specific T cells. The
      observations are consistent with a T-cell mechanism despite absent serum
      antibodies, but they do not directly confirm it or establish a universal
      prevalence.
    citations:
      - PMID:27352981
  - claim_id: hla-dq2-dq8-necessity
    statement: >-
      HLA-DQ2 or HLA-DQ8 is literally necessary for every case of celiac
      disease.
    disposition: QUALIFIED
    report_quote: >-
      HLA-DQ2/DQ8 (necessary)   +    ??? Tolerance breakdown ???
    rationale: >-
      These haplotypes account for the overwhelming majority of well-supported
      cases and their absence has high exclusionary value. Cohort studies have
      nevertheless reported rare DQ2/DQ8-negative celiac diagnoses and possible
      contribution from DQ7 or single DQ2 component alleles. State strong HLA-DQ
      restriction and near-necessity, rather than an exceptionless rule.
    citations:
      - PMID:9548076
      - PMID:26398634
  - claim_id: teddy-citation-characterization
    statement: >-
      PMID:31593953 is the prospective TEDDY birth-cohort study establishing
      that timing of gluten introduction had no effect.
    disposition: REJECTED
    report_quote: >-
      TEDDY prospective birth cohort (timing of gluten introduction had no
      effect, [PMID: 31593953](https://pubmed.ncbi.nlm.nih.gov/31593953/))
    rationale: >-
      PMID:31593953 is a narrative review of shared mechanisms in type 1
      diabetes and celiac disease, not a TEDDY cohort report. The relevant
      primary TEDDY analysis is PMID:25601977; it found that age at first gluten
      introduction was not an independent risk factor in the studied range.
      The broad conclusion is defensible, but the cited study design and source
      are wrong.
    citations:
      - PMID:25601977
      - PMID:31593953
  - claim_id: ontology-mappings
    statement: >-
      The proposed CL and GO identifiers specifically and accurately represent
      the named celiac cell types and processes.
    disposition: REJECTED
    report_quote: >-
      **Cell types:** CD4+ gluten-specific T cells (CL:0000492), intraepithelial
      lymphocytes (CL:0000084), TG2-reactive B cells, plasmacytoid dendritic
      cells
    rationale: >-
      OAK identifies CL:0000492 as CD4-positive helper T cell, not a
      gluten-specific cell, and CL:0000084 as generic T cell, not
      intraepithelial lymphocyte; CL:0002496 is the direct IEL class. The GO
      identifiers resolve, but two displayed labels are inexact: GO:0002224 is
      toll-like receptor signaling pathway, and GO:0002291 includes the final
      qualifier on antigen-presenting-cell context. GO:0006968 is correctly
      labeled cellular defense response. The entire candidate block requires
      term-by-term verification before reuse.
  - claim_id: literature-corpus-provenance
    statement: >-
      The claimed systematic review of 130 papers can be reconstructed from the
      deposited report provenance.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Report generated through systematic evaluation of 130 primary papers
      across 5 investigation iterations.
    rationale: >-
      The report frontmatter and companion citation manifest expose 46 unique
      PMIDs, not 130 papers. No search strings, screening log, excluded-record
      list, iteration state, or complete 130-item corpus is deposited. The
      larger count and the separate claim of 24 confirmed findings therefore
      cannot be independently reconstructed.
  - claim_id: citation-verification-claim
    statement: >-
      Every citation in the report was verified accurately against its PubMed
      abstract.
    disposition: REJECTED
    report_quote: >-
      All citations verified against PubMed abstracts.
    rationale: >-
      At minimum, PMID:31593953 is misidentified as the prospective TEDDY cohort,
      PMID:36898393 is said to demonstrate failure to protect against mucosal
      injury although that endpoint was not tested, and the embedded seed gives
      PMID:38914866 the wrong title. These are source-characterization defects,
      irrespective of whether the identifiers themselves resolve.
    citations:
      - PMID:31593953
      - PMID:36898393
      - PMID:38914866
  - claim_id: missing-figure-artifacts
    statement: >-
      The report's mechanistic diagrams and evidence dashboards are deposited
      and available for provenance review.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      {{figure:final_causal_model.png|caption=Integrated mechanistic causal chain
      of celiac disease showing the three-signal model, positive feedback loops,
      and alternative pathways. Solid lines indicate well-established links;
      dashed lines indicate emerging or partially supported connections.}}
    rationale: >-
      The hypothesis directory contains the report and citation manifest but
      none of the four referenced files: final_causal_model.png,
      evidence_dashboard.png, causal_chain.png, or knowledge_gaps.png. The
      artifact tokens therefore do not provide inspectable provenance in the
      repository.

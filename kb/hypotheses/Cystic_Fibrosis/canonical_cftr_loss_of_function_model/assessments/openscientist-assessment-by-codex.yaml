hypothesis_id: canonical_cftr_loss_of_function_model
assessed_at: "2026-07-31T05:55:10Z"
overall_verdict: SUPPORTED
summary: >-
  The report correctly retains the canonical CFTR loss-of-function model.
  Human genetics, newborn CF-pig physiology, epithelial transport experiments,
  CFTR structures, and genotype-directed modulator trials converge on CFTR
  dysfunction as the upstream cause of classic cystic fibrosis. Several
  extensions require narrower wording. The report conflates more than 2,000
  reported CFTR variants with variants established as CF-causing, treats
  porcine bicarbonate-dose results as a universal chloride-versus-bicarbonate
  hierarchy, overstates clinical rescue of previously untreatable variants,
  and infers CFTR-independent self-sustaining inflammation from incomplete
  restoration on modulators. Its zebrafish citation is not immune-cell-specific,
  ENaC drug failures do not refute ENaC physiology, and a 2024 severe
  CF-liver-disease GWAS directly contradicts a claimed source absence. The
  report also claims 126 primary sources while exposing only 44 PMIDs and
  references two undelivered figure artifacts. The central model is supported,
  while these quantitative, mechanistic, and provenance claims should not be
  promoted without correction.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-cftr-causal-chain
    statement: >-
      CFTR functional failure is the necessary upstream cause of classic
      cystic-fibrosis pathology.
    disposition: RETAINED
    report_quote: >-
      The central claim of the canonical model — that CFTR functional failure
      is the necessary upstream cause of CF pathology — is supported by
      convergent evidence across multiple experimental paradigms.
    rationale: >-
      PMID:22763554 directly connects absent CFTR-mediated bicarbonate transport
      to low airway-surface-liquid pH and impaired bacterial killing in newborn
      CF pigs before infection or inflammation. PMID:41738096 links restoration
      of variant CFTR function to improved sweat chloride and lung function in
      a randomized human trial. ClinGen classified the autosomal-recessive
      CFTR–cystic-fibrosis relationship as definitive in 2022. Together with
      long-established human genetics, these are convergent causal and rescue
      evidence for classic CF.
    citations:
      - PMID:22763554
      - PMID:41738096
      - "url:https://search.clinicalgenome.org/kb/gene-validity/CGGV%3Aassertion_eb5b2eb1-e354-4e5a-ad5a-d0ee02805590"
  - claim_id: necessary-and-sufficient-scope
    statement: >-
      Any biallelic CFTR loss of function is by itself necessary and sufficient
      for cystic fibrosis.
    disposition: QUALIFIED
    report_quote: >-
      No published evidence refutes the core hypothesis that biallelic CFTR
      loss-of-function is the necessary and sufficient upstream cause of cystic
      fibrosis.
    rationale: >-
      The causal statement is sound for two CF-causing variants in trans and
      classic CF, but "biallelic loss-of-function" is not a sufficiently precise
      diagnostic category. CFTR2 distinguishes CF-causing variants, variants of
      varying clinical consequence, non-CF-causing variants, and unresolved
      variants; some genotypes produce CFTR-related disorders or inconclusive
      screening phenotypes rather than classic CF. PMID:40265445 documents that
      distinction. Preserve variant classification, phase, phenotype, and
      evidence of CFTR dysfunction rather than using an unqualified
      necessary-and-sufficient formula.
    citations:
      - PMID:40265445
  - claim_id: disease-causing-variant-count
    statement: >-
      More than 2,000 CFTR variants have been established as disease-causing.
    disposition: REJECTED
    report_quote: >-
      human genetics with >2,000 disease-causing CFTR variants and
      GWAS-identified modifier loci
    rationale: >-
      This conflates variants reported in CFTR with variants classified as
      CF-causing. PMID:40265445 states that, as of September 2024, CFTR2 had
      interpreted 1,167 variants and classified 1,085 as CF-causing. The report
      provides no dated CFTR2 query or alternative classification list that
      supports more than 2,000 disease-causing variants. Variant totals are
      dynamic, but the supplied number and category are not source-faithful.
    citations:
      - PMID:40265445
  - claim_id: newborn-pig-acidification
    statement: >-
      CFTR loss acidifies airway surface liquid and impairs bacterial killing in
      newborn CF pigs before infection and inflammation.
    disposition: RETAINED
    report_quote: >-
      The CF pig model demonstrates that CFTR loss directly acidifies airway
      surface liquid and impairs bacterial killing at birth — before any
      infection or inflammation has occurred — establishing the causal primacy
      of CFTR dysfunction
    rationale: >-
      PMID:22763554 measured reduced airway-surface-liquid pH and bacterial
      killing in newborn CF pigs, lowered pH in wild-type animals to impair
      killing, and raised pH in CF animals to rescue it. This is direct
      perturbational evidence for the early airway-host-defense edge in that
      model. It does not by itself establish every downstream human
      manifestation.
    citations:
      - PMID:22763554
  - claim_id: bicarbonate-rate-limiting-scope
    statement: >-
      Bicarbonate secretion, rather than chloride secretion, is the universal
      rate-limiting determinant of initial host defense in cystic fibrosis.
    disposition: QUALIFIED
    report_quote: >-
      A critical refinement to the canonical model is that **bicarbonate
      (HCO₃⁻) secretion, not chloride**, is the rate-limiting factor for initial
      host defense impairment.
    rationale: >-
      PMID:27114540 showed in mixed porcine airway epithelia that bicarbonate
      secretion and several host-defense readouts scaled with CFTR abundance,
      whereas prior chloride-secretion results plateaued when roughly 10–50% of
      cells expressed CFTR. PMID:35635440 independently shows that SLC4A4
      inhibition acidifies human airway cultures and that Slc4a4-null mice have
      a CF-like phenotype. These support bicarbonate as a critical, potentially
      dose-limiting arm, but they do not establish a universal
      bicarbonate-versus-chloride hierarchy across human tissues, genotypes,
      disease stages, or all host-defense functions.
    citations:
      - PMID:27114540
      - PMID:35635440
  - claim_id: eti-interventional-validation
    statement: >-
      ETI produces sustained population-level improvement in lung function,
      providing interventional support for the CFTR causal pathway.
    disposition: RETAINED
    report_quote: >-
      Interventional validation comes from the largest real-world ETI study to
      date (N=11,151), demonstrating a mean ppFEV1 increase of 9.9 (95% CI
      9.6–10.2) sustained over three years
    rationale: >-
      PMID:42033769 reports exactly 11,151 registry participants in its ppFEV1
      analysis and a mean pre/post increase of 9.9 percentage points over three
      years. The observational design does not eliminate secular or selection
      effects, and only 32.8% of participants with both outcomes improved in
      both ppFEV1 and BMI, but the scale and sustained response complement
      randomized modulator evidence.
    citations:
      - PMID:42033769
      - PMID:41738096
  - claim_id: vtd-previously-untreatable-scope
    statement: >-
      Vanzacaftor/tezacaftor/deutivacaftor has clinically rescued previously
      untreatable CFTR variants.
    disposition: QUALIFIED
    report_quote: >-
      Next-generation vanzacaftor/tezacaftor/deutivacaftor (VTD) rescues
      variants previously unresponsive to ETI, with patient-derived intestinal
      organoid assays confirming functional improvement for G458V and G85R
      mutations
    rationale: >-
      PMID:41478784 is a synthesis that reports differential VTD responses in
      intestinal organoids from two people with G458V and G85R and explicitly
      says clinical outcomes remain the determinant of benefit. The phase 3
      studies in PMID:39756424 and PMID:39756425 enrolled
      ETI-responsive genotypes and establish noninferiority, safety, or
      additional sweat-chloride improvement—not clinical rescue of those two
      previously unresponsive variants. Retain this as a personalized-treatment
      lead, not an established patient-level extension.
    citations:
      - PMID:41478784
      - PMID:39756424
      - PMID:39756425
  - claim_id: residual-disease-independence
    statement: >-
      Residual abnormalities on ETI establish that airway inflammation has
      become self-sustaining independently of ongoing CFTR dysfunction.
    disposition: QUALIFIED
    report_quote: >-
      These findings indicate that once the inflammatory cascade is established,
      it becomes partially self-sustaining independent of ongoing CFTR
      dysfunction — a critical gap in the canonical model's explanatory power.
    rationale: >-
      PMID:42128740 shows that sputum proteomic and cytokine profiles improved
      after ETI but remained distinct from seven healthy controls.
      PMID:33613309 found residual epithelial lipid, oxidative-stress, and
      cytokine abnormalities after short in vitro treatment that restored
      roughly 60% of CFTR function. These findings establish incomplete
      normalization, not independence from ongoing CFTR dysfunction. Partial
      target restoration, advanced structural injury, persistent infection,
      treatment timing, and cell-specific exposure remain viable explanations.
    citations:
      - PMID:42128740
      - PMID:33613309
      - PMID:40227282
  - claim_id: macrophage-parallel-mechanism
    statement: >-
      CFTR dysfunction in macrophages and neutrophils is a cell-autonomous
      parallel mechanism beyond epithelial ion transport.
    disposition: QUALIFIED
    report_quote: >-
      CFTR is expressed and functional in macrophages, and CF macrophages
      exhibit impaired phagocytosis, intracellular killing, and efferocytosis of
      apoptotic neutrophils
    rationale: >-
      PMID:36265882 measured CFTR and effector functions in blood-derived
      macrophages from 56 people before and after ETI and observed partial
      restoration. PMID:39574739 found ENaC overexpression in CF macrophages,
      induced it by CFTR inhibition in non-CF cells, and improved several
      readouts with amiloride. This supports a direct macrophage mechanism, but
      ex vivo assays do not quantify its independent contribution to human lung
      disease, and the evidence should not be generalized to every immune-cell
      lineage.
    citations:
      - PMID:36265882
      - PMID:39574739
  - claim_id: zebrafish-immune-cell-autonomy
    statement: >-
      A CF zebrafish experiment confirms intrinsic dysfunction caused by CFTR
      depletion specifically within innate immune cells.
    disposition: REJECTED
    report_quote: >-
      A CF zebrafish model confirms that CFTR-depleted innate immune cells have
      intrinsic functional defects
    rationale: >-
      PMID:32849617 used globally CFTR-depleted larvae, not an
      immune-cell-specific knockout or rescue. It attributed excess neutrophil
      recruitment after sterile injury to an excessive epithelial oxidative
      response and also observed impaired neutrophil reverse migration and
      apoptosis. The model supports dysregulated innate inflammation after
      organism-wide CFTR loss; it does not isolate immune-cell-autonomous CFTR
      causation.
    citations:
      - PMID:32849617
  - claim_id: modifier-gwas
    statement: >-
      Large human genetic studies identify non-CFTR loci that modify
      organ-specific cystic-fibrosis phenotypes.
    disposition: QUALIFIED
    report_quote: >-
      GWAS studies involving >6,500 CF participants have identified modifier
      loci at genome-wide significance: ATP12A (chr13, p=3.83×10⁻¹⁰), SLC6A14
      (chrX, p<2.2×10⁻¹⁶), SLC26A9 (chr1, p=2.81×10⁻¹¹), and PRSS1 (chr7,
      p=2.55×10⁻⁷) for meconium ileus
    rationale: >-
      PMID:30807572 reports a consortium of more than 6,500 participants, a new
      ATP12A meconium-ileus locus, replicated SLC6A14 and SLC26A9 loci, and a
      suggestive—not genome-wide-significant—PRSS1 locus. The modifier
      conclusion is supported, but the report's introductory wording should not
      imply that all four loci met genome-wide significance in the same trait.
    citations:
      - PMID:30807572
  - claim_id: enac-drug-failure-inference
    statement: >-
      Failed or unsafe ENaC inhibitor studies challenge ENaC hyperabsorption as a
      causal arm of human CF airway dehydration.
    disposition: REJECTED
    report_quote: >-
      This challenges the simplistic "ENaC hyperabsorption" arm of the canonical
      model in the clinical setting.
    rationale: >-
      PMID:23905576 was a healthy-volunteer phase 1 safety study terminated
      because active metabolites reached the kidney and caused transient
      hyperkalemia; it did not test airway efficacy or ENaC's causal
      contribution. PMID:16421365 tested hypertonic saline with or without
      amiloride in 24 people and attributed reduced mucus-clearance benefit to
      inhibition of osmotically driven water transport; between-group lung
      function changes were not significant. These studies constrain drug
      design and combination strategy, not the underlying ENaC mechanism.
    citations:
      - PMID:23905576
      - PMID:16421365
  - claim_id: liver-gwas-absence
    statement: >-
      No genome-wide association study of cystic-fibrosis liver disease had
      been identified by the report date.
    disposition: REJECTED
    report_quote: >-
      no GWAS for CF liver disease was identified in our search.
    rationale: >-
      PMID:38536042 was published in 2024, before this report. It analyzed
      whole-genome data from 4,082 people with pancreatic-insufficient CF,
      including 516 with severe liver disease, tested roughly 15.9 million
      variants, and found genome-wide-significant loci containing PKD1 and
      FNBP1 plus two suggestive loci. The proposed future GWAS substantially
      duplicates an existing study and the asserted source absence is false.
    citations:
      - PMID:38536042
  - claim_id: er-stress-context
    statement: >-
      ER stress and proteostasis operate both upstream of the CFTR defect and
      downstream as inflammatory amplifiers in cystic fibrosis.
    disposition: QUALIFIED
    report_quote: >-
      ER stress in airway epithelial cells also increases susceptibility to
      secondary bacterial infection through CFTR disruption
    rationale: >-
      PMID:40720746 studied acute influenza-induced ER stress in primary airway
      cultures with initially functional CFTR; ER stress reduced CFTR activity,
      acidified airway surface liquid, and increased pneumococcal
      susceptibility. That is acquired CFTR dysfunction, not evidence that ER
      stress is upstream of biallelic CFTR loss in classic CF. PMID:36835664 is
      relevant to F508del misfolding and lumacaftor but should remain
      mutation-class-specific.
    citations:
      - PMID:40720746
      - PMID:36835664
  - claim_id: prenatal-sheep-interpretation
    statement: >-
      Prenatal cellular-composition differences in CFTR-null sheep establish an
      in-utero origin of functional CF airway disease.
    disposition: QUALIFIED
    report_quote: >-
      CF sheep model showing cellular imbalance in proximal and distal lung
      prenatally (FOXJ1+ ciliated cells overrepresented). *Relevance:* Supports
      in utero origin of CF airway disease, predating postnatal infection.
    rationale: >-
      PMID:40495135 found age- and region-dependent cell-abundance differences
      by single-cell RNA sequencing, with overrepresented FOXJ1-positive
      ciliated cells at term and a transient prenatal immune-cell shift. The
      authors say these differences may reflect developmental sequelae. They did
      not measure airway-surface-liquid physiology, mucus transport, infection,
      or clinical airway disease in utero. Retain this as a developmental lead.
    citations:
      - PMID:40495135
  - claim_id: nonobstructive-male-infertility
    statement: >-
      CFTR dysfunction broadens male infertility beyond congenital bilateral
      absence of the vas deferens through effects on spermatogenesis.
    disposition: QUALIFIED
    report_quote: >-
      CFTR role in non-obstructive male infertility beyond CBAVD. *Snippet to
      verify:* "CFTR plays a critical role in spermatogenesis via regulation of
      the cAMP-CREB signaling pathway in Sertoli cells." *Relevance:* Broadens
      the reproductive phenotype beyond CBAVD.
    rationale: >-
      PMID:42144530 is a review combining associations of CFTR variants with
      nonobstructive azoospermia and experimental Sertoli-cell, germ-cell, and
      sperm studies. It explicitly calls the evidence emerging and requests
      further mechanistic work. It does not establish that nonobstructive
      infertility in people with classic CF is caused by this pathway.
    citations:
      - PMID:42144530
  - claim_id: ontology-leads
    statement: >-
      The proposed biological-process and cell-type terms are promotion-ready
      curation leads.
    disposition: QUALIFIED
    report_quote: >-
      - **Cell types:** Pulmonary ionocyte (CFTR-high expressing; [PMID:
      38573173](https://pubmed.ncbi.nlm.nih.gov/38573173/)), Monocyte-derived
      macrophage (CFTR-expressing immune cell) - **Biological processes:**
      GO:0015701 (bicarbonate transport), GO:0006909 (phagocytosis), GO:0030198
      (extracellular matrix organization — for bronchiectasis)
    rationale: >-
      OAK resolves all three GO identifiers with the supplied labels and
      resolves pulmonary ionocyte as CL:0017000, which the report omits.
      PMID:38573173 shows that ionocytes regulate airway-surface-liquid pH while
      club cells provide bulk fluid secretion, so "CFTR-high" alone is not a
      functional edge. "Monocyte-derived macrophage" has no supplied CL
      identifier or reconciled exact class. Treat both cell types as mapping
      tasks before promotion.
    citations:
      - PMID:38573173
  - claim_id: systematic-corpus
    statement: >-
      The report systematically evaluated 126 primary literature sources.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This investigation systematically evaluated this hypothesis against 126
      primary literature sources spanning structural biology, animal models,
      human clinical trials, single-cell transcriptomics, and genetic
      epidemiology.
    rationale: >-
      The report metadata says citation_count 44, and the committed citation
      sidecar enumerates exactly 44 unique PMIDs. No search strings, screening
      log, exclusions, source list for the other 82 items, or claim-to-corpus
      mapping is delivered. Several exposed sources are reviews rather than
      primary studies. Individual citations can be checked, but neither the
      total nor the "primary literature" characterization is reproducible.
  - claim_id: referenced-figure-artifacts
    statement: >-
      The referenced evidence matrix and mechanistic causal-chain figures were
      delivered with the report.
    disposition: REJECTED
    report_quote: >-
      {{figure:evidence_matrix.png|caption=Evidence matrix summarizing key
      studies evaluated for the CFTR hypothesis, including evidence types,
      relationship to canonical model, mechanistic claims tested, and confidence
      levels.}}
    rationale: >-
      The hypothesis directory contains only openscientist.md and its citation
      sidecar. Neither evidence_matrix.png nor causal_chain_diagram.png is
      committed, so both placeholders are unresolved references rather than
      auditable artifacts.
  - claim_id: cf-omics-repository-absence
    statement: >-
      No standardized cystic-fibrosis multi-omics repository exists.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **CF-specific omics repositories:** No standardized multi-omics database
      for CF was identified.
    rationale: >-
      The report gives no repository names, queries, dates, accessions, data-type
      definition, or standardization criteria. CF data are distributed across
      public repositories and CF Foundation resources, so failure to identify a
      single integrated database is not evidence that none exists. Preserve
      this as a reproducible resource-discovery task rather than a source-level
      absence.

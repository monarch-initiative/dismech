hypothesis_id: canonical_fxn_loss_of_function
assessed_at: "2026-09-02T11:21:21Z"
overall_verdict: SUPPORTED
summary: >-
  The seed hypothesis is the KB's own CANONICAL entry, so the report's headline
  verdict was never in doubt and confirming it is not new support. What the
  report actually contributes is a set of tissue-specific qualifications, and
  those are the parts worth reviewing. Every consequential citation I acted on
  was fetched into references_cache/ and compared against the cached source; I
  found no fabricated PMID and no hallucinated quotation, which is better than
  this provider's average.

  Three findings changed the curated entry. The Koeppen neuropathology review
  (PMID:23334592, full text available) establishes that dorsal root ganglion
  pathology combines developmental hypoplasia with superimposed atrophy rather
  than being purely degenerative; the entry's DRG node described only injury and
  loss, so the developmental limb was missing outright. The cardiac
  heart-specific-knockout study (PMID:41628678) locates the cardiac lesion in
  mitophagy failure through a dysregulated mTOR-TFEB axis, which the entry
  carried only as a sentence inside the hypothesis notes and not as a graph
  annotation. And the DRG ferroptosis work (PMID:39243573, PMID:41579709) was
  likewise present only at the hypothesis level, so the two tissue-specific
  effector pathways the report is arguing for had no structural presence in the
  pathograph at all.

  Two corrections run the other way, and both are cases where the report's prose
  had already been copied into the curated entry more confidently than the
  primary source allows. The report says secretable-frataxin gene therapy
  "rescues both cardiac and neurological phenotypes in mouse and non-human
  primate models"; PMID:42157962 reports broad protein repletion in mouse and
  non-human primate but phenotype rescue in mouse models only. And the report
  reads the deferiprone trial as demonstrating that Fe-S cluster deficiency
  rather than iron excess is the primary neurological lesion; PMID:25112865 is a
  6-month safety and tolerability trial whose own abstract says the lack of
  deterioration in the placebo arm impaired its ability to detect an effect. The
  entry's evidence explanations for both papers repeated the report's stronger
  reading and have been softened to what the abstracts support.

  One curation lead is simply wrong. The report proposes CL:0011113 as "DRG
  proprioceptive neuron"; that CURIE is spiral ganglion neuron, a cochlear cell
  type. This is exactly the failure mode a plausible-looking CURIE produces, and
  it is why report-proposed identifiers were re-derived from the repository
  caches rather than copied.

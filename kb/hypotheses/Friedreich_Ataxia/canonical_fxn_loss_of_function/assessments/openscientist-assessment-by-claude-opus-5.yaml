claims:
  - claim_id: canonical-chain-supported-at-every-link
    statement: >-
      The canonical chain from biallelic GAA expansion through epigenetic
      silencing, frataxin deficiency, impaired Fe-S cluster biogenesis and
      mitochondrial dysfunction to tissue-selective degeneration is supported at
      every link.
    disposition: RETAINED
    report_quote: >-
      The core causal chain — biallelic GAA repeat expansion → epigenetic
      silencing → frataxin deficiency → impaired Fe-S cluster biogenesis →
      mitochondrial dysfunction → tissue-selective degeneration — is established
      at every link by independent lines of evidence.
    rationale: >-
      True, and independently supported by the sources already curated in the
      entry (PMID:21315377, PMID:14653404, PMID:26401053). But this is the seed
      hypothesis restated, so it produces no new support and warrants no status
      change. The report's own Candidate Status section agrees that CANONICAL
      should be retained.
    citations:
      - PMID:21315377
      - PMID:26401053
      - PMID:14653404
  - claim_id: frataxin-is-allosteric-activator-not-iron-donor
    statement: >-
      Frataxin acts as an allosteric activator of the NFS1-ISD11-ACP-ISCU2
      cysteine desulfurase complex rather than as an iron donor.
    disposition: RETAINED
    report_quote: >-
      cannot be fully explained by the hypothesis that FXN functions as an iron
      donor
    rationale: >-
      Verified in the cached source. PMID:24971490 states that ISCU2 residue
      C104 is critical for FXN activation while C35, C61 and C104 are all
      essential for cluster formation, and that these results cannot be fully
      explained by an iron-donor function; PMID:31511419 shows FXN accelerating
      each individual step of the mechanism; PMID:21776984 separates binding
      from catalytic defects across three FRDA missense variants. Already
      curated on the hypothesis entry, so no integration was needed.
    citations:
      - PMID:24971490
      - PMID:31511419
      - PMID:21776984
  - claim_id: gaa-silencing-is-cis-restricted
    statement: >-
      GAA-expansion-driven silencing is confined to the FXN locus, with a
      transcription elongation defect past the repeat and no long-range effect
      on neighbouring genes.
    disposition: QUALIFIED
    report_quote: >-
      repressive histone marks enriched near the repeat but confined strictly to
      the *FXN* locus — no trans-effects on neighboring genes were detected
    rationale: >-
      The cis-restriction and the elongation defect are exactly what
      PMID:26401053 reports, in a large cohort of FRDA and control primary
      fibroblasts rather than a patient cohort as the report's phrasing
      suggests. The qualification is that the report presents PMID:26896803
      alongside it as concordant, when that paper states that deficient
      transcriptional initiation is the predominant cause of transcriptional
      deficiency in FRDA and that its HDAC inhibitor acts by improving
      initiation. Initiation and elongation are competing accounts of where the
      block sits; the report does not notice the tension.
    citations:
      - PMID:26401053
      - PMID:26896803
      - PMID:22522441
  - claim_id: ferroptosis-dominant-in-drg-neurons
    statement: >-
      Ferroptosis, driven by impaired NRF2 signalling with loss of SLC7A11 and
      GPX4 and consequent lipid peroxidation, is a major cell-death mechanism in
      frataxin-deficient dorsal root ganglion neurons.
    disposition: RETAINED
    report_quote: >-
      Multiple studies in frataxin-deficient DRG neuron models demonstrate
      increased lipid peroxidation (the key ferroptosis marker), decreased GPX4,
      and impaired NRF2 response
    rationale: >-
      Verified in both cited sources. PMID:39243573 shows decreased total and
      nuclear NRF2 explaining SLC7A11 and GPX4 downregulation and increased
      lipid peroxidation in primary DRG cultures and FXNI151F mouse DRG, and
      PMID:41579709 shows omaveloxolone almost completely rescuing that lipid
      peroxidation. The entry carried both only as hypothesis-level evidence, so
      ferroptosis has been added as a biological process on the DRG
      pathophysiology node and omaveloxolone now targets that node.
    citations:
      - PMID:39243573
      - PMID:41579709
  - claim_id: cardiac-mitophagy-failure-without-oxidative-stress
    statement: >-
      Cardiac pathology in frataxin deficiency proceeds through mitochondrial
      iron aggregates and mitophagy failure via a dysregulated mTOR-TFEB axis,
      without increased oxidative stress.
    disposition: QUALIFIED
    report_quote: >-
      heart-specific FXN knockout mice show mitochondrial iron aggregates,
      severely altered mitochondrial ultrastructure, and markedly impaired
      respiration, yet **"despite the absence of increased oxidative stress"**
    rationale: >-
      The quotation is accurate and PMID:41628678 does report exactly this,
      including the p62 and Parkin accumulation and the mTOR-TFEB dysregulation.
      The qualification is twofold. It is one mouse study in a heart-specific
      knockout, and the report's own companion citation in the same section
      cuts the other way: PMID:23169664 concludes that the mitochondrial
      biomineral iron aggregates "probably contribute to the oxidative stress
      and pathology observed in the absence of frataxin". The report bundles the
      two under a heading asserting the absence of oxidative stress without
      noting that they disagree. Integrated as a mitophagy annotation plus a
      knowledge-gap discussion rather than as a settled fact.
    citations:
      - PMID:41628678
      - PMID:23169664
  - claim_id: drg-dual-phase-hypoplasia-plus-atrophy
    statement: >-
      Dorsal root ganglion pathology in FRDA combines developmental hypoplasia
      with superimposed progressive atrophy, rather than being purely
      degenerative.
    disposition: RETAINED
    report_quote: >-
      DRG pathology in FRDA involves both hypoplasia (developmental) and
      superimposed atrophy (degenerative)
    rationale: >-
      Verified against the full text of PMID:23334592, a systematic study of the
      central and peripheral nervous system in 35 FRDA patients, which states
      that the review stresses the critical role of hypoplasia and superimposed
      atrophy of dorsal root ganglia and that size differences in short-survival
      cases are more readily explained by neuronal hypoplasia. This was absent
      from the entry, whose DRG node described only injury and destruction, and
      it is the report's most useful genuinely new contribution. Integrated into
      the DRG node description with this citation.
    citations:
      - PMID:23334592
      - PMID:28912677
      - PMID:30761510
  - claim_id: hypoxia-rescues-frataxin-null-viability
    statement: >-
      Frataxin is not absolutely required for viability: growth at 1% ambient
      oxygen rescues frataxin-null yeast, human cells and nematodes and restores
      Fe-S cluster levels.
    disposition: RETAINED
    report_quote: Growth in 1% ambient O₂ rescues viability of frataxin-deficient cells
    rationale: >-
      Verified in PMID:31031004, which additionally reports that 11% oxygen
      attenuates and 55% oxygen hastens ataxia progression in an FRDA mouse
      model. Already curated on the hypothesis entry with an appropriate
      IN_VITRO grade. The report's extension of this to a general explanation of
      tissue-selective vulnerability by oxygen tension is its own inference and
      is not asserted by the paper.
    citations:
      - PMID:31031004
  - claim_id: iron-chelation-failure-proves-primary-lesion
    statement: >-
      The deferiprone trial result demonstrates that Fe-S cluster deficiency,
      not iron excess, is the primary neurological lesion in FRDA.
    disposition: QUALIFIED
    report_quote: >-
      it demonstrates that **Fe-S cluster deficiency, not iron excess, is the
      primary neurological lesion**
    rationale: >-
      The trial facts are right. PMID:25112865 randomized 72 patients for six
      months, discontinued the 60 mg/kg/day arm after ataxia worsened in two
      patients, and reports worsening FARS and ICARS at 40 mg/kg/day. The
      inference is too strong for the design: the primary objective was safety,
      the trial ran six months, and the abstract itself states that the lack of
      deterioration in the placebo arm impaired the ability to detect any
      protective effect. Worsening on a chelator is consistent with the Fe-S
      reading but does not establish it against dose toxicity or chance in a
      small dose-ranging arm. The entry had copied the report's stronger wording
      into its evidence explanation; that has been softened.
    citations:
      - PMID:25112865
  - claim_id: frataxin-overexpression-cardiotoxic-above-20-fold
    statement: >-
      AAV-mediated cardiac frataxin overexpression is safe up to about 9-fold
      endogenous level but causes mitochondrial and cardiac toxicity above about
      20-fold, defining a narrow therapeutic window for gene therapy.
    disposition: RETAINED
    report_quote: >-
      safe up to 9-fold normal endogenous levels but caused significant
      mitochondrial and cardiac toxicity above 20-fold
    rationale: >-
      Verbatim accurate against PMID:33209958, which reports gradual severity
      with increasing overexpression, from subclinical cardiotoxicity to left
      ventricular dysfunction driven by respiratory-chain and ultrastructural
      impairment. Already curated on the hypothesis entry, and the numbers are
      mouse cardiac values, which the curated explanation states.
    citations:
      - PMID:33209958
  - claim_id: secretable-frataxin-dual-rescue-in-mouse-and-primate
    statement: >-
      A single intra-CSF injection of secretable frataxin rescues both cardiac
      and neurological phenotypes in mouse and non-human primate models.
    disposition: QUALIFIED
    report_quote: >-
      secretable frataxin gene therapy delivered via a single intra-CSF
      injection rescues both cardiac and neurological phenotypes in mouse and
      non-human primate models
    rationale: >-
      PMID:42157962 reports broad protein repletion across heart, dorsal root
      ganglia and cerebellum in mouse and non-human primate, and then says "In
      FA mouse models, we observed rescue of cardiac and neurological
      phenotypes". Phenotypic rescue is a mouse result; the non-human primate
      data establish biodistribution and repletion. The report merges the two
      clauses, and the curated entry had inherited that merge in the evidence
      explanation and in the hypothesis notes. Both have been corrected. The
      underlying claim, that restoring frataxin across tissues corrects the
      multisystem phenotype, still stands on the mouse arm.
    citations:
      - PMID:42157962
  - claim_id: nfl-decline-supports-developmental-front-loading
    statement: >-
      The age-dependent decline of plasma neurofilament light in FRDA, opposite
      to other neurodegenerative diseases, supports an early front-loaded
      degenerative phase consistent with developmental hypoplasia.
    disposition: QUALIFIED
    report_quote: >-
      This unique trajectory — the opposite of other neurodegenerative diseases
      — supports an early, front-loaded neurodegenerative phase consistent with
      the developmental hypoplasia model.
    rationale: >-
      The measurement is verified: PMID:40498047 reports NfL elevated below age
      40, declining with age in FRDA while increasing in controls, with annual
      reductions of 8% in children and 13% in young adults under 35, converging
      with controls by 35 to 40 years. The developmental interpretation is the
      report's own; the paper frames the trajectory as a trial-design caveat and
      does not link it to hypoplasia. Curated with hedged wording, so no change
      was needed.
    citations:
      - PMID:40498047
      - PMID:23334592
  - claim_id: microglial-immunometabolic-shift-parallel-mechanism
    statement: >-
      Frataxin-deficient microglia lose homeostatic function and shift to a
      glycolytic, itaconate-producing reactive phenotype, making
      neuroinflammation a candidate parallel mechanism.
    disposition: QUALIFIED
    report_quote: >-
      FXN-deficient microglia lose homeostatic function and shift to a
      glycolytic, reactive phenotype with itaconate production
    rationale: >-
      Verified in PMID:38631900, which also reports that butyrate reverses the
      immunometabolic changes through itaconate-Nrf2-GSH signalling and improves
      neuromotor performance. The evidence is one single-cell RNA-seq study in
      one mouse model plus patient fibroblast data (PMID:40308559); whether
      neuroinflammation drives degeneration or follows it is untested, and there
      is no human FRDA cerebellar microglial dataset. Too thin for a
      pathophysiology node, so integrated as an open knowledge-gap discussion.
    citations:
      - PMID:38631900
      - PMID:40308559
  - claim_id: cardiac-neurologic-severity-dissociation
    statement: >-
      Cardiomyopathy severity and neurological severity are not clearly
      correlated in FRDA, implying tissue-specific modifiers.
    disposition: RETAINED
    report_quote: >-
      No clear correlation was found between cardiomyopathy groups and
      neurological function in 205 patients
    rationale: >-
      Verified in PMID:22379112, a cross-sectional study of 205 patients using
      echocardiography, colour Doppler myocardial imaging and cardiac magnetic
      resonance, whose results state that no clear correlation was found between
      FA-CM groups and neurological function. Absent from the entry and
      genuinely consequential for how the branching pathograph should be read,
      so integrated as a knowledge-gap discussion. The dissociation is
      cross-sectional and grouping-based; it is not evidence of independent
      causation.
    citations:
      - PMID:22379112
  - claim_id: somatic-gaa-instability-tissue-specific
    statement: >-
      GAA tracts are longer in heart and pancreas than in other tissues and
      expand progressively in lymphocytes, but the quantitative contribution of
      somatic instability to tissue-selective pathology is unresolved.
    disposition: RETAINED
    report_quote: >-
      GAA tracts are significantly longer in heart and pancreas than in other
      tissues, with progressive expansion of ~9 repeats per year in lymphocytes
    rationale: >-
      Verified in PMID:29261783, which measured repeats in heart, cerebral
      cortex, spinal cord, cerebellar cortex and pancreas from 15 FRDA patients
      and followed lymphocyte repeats over 7 to 9 years with a maximum gain of
      approximately 9 repeats per year. The report is also right that this does
      not explain DRG vulnerability, since DRG is affected earliest despite
      shorter repeats than heart. Absent from the entry, and integrated as a
      knowledge-gap discussion attached to the FXN genetic entry and the
      upstream silencing node.
    citations:
      - PMID:29261783
  - claim_id: fdx2-fxn-competition-therapeutic-avenue
    statement: >-
      FDX2 and FXN compete for overlapping binding sites on the core Fe-S
      assembly complex, opening a therapeutic route through peptide inhibitors
      of the FDX2-NFS1 interaction.
    disposition: QUALIFIED
    report_quote: >-
      This competition opens a novel therapeutic avenue: rationally designed
      peptide inhibitors targeting the FDX2-NFS1 interaction could mitigate FXN
      deficiency by shifting the competitive equilibrium
    rationale: >-
      The structural claim is solid: PMID:39632806 presents cryo-EM structures
      showing FDX2 and FXN competing for overlapping sites, with distal and
      proximal FDX2 conformations. The therapeutic extension rests on
      PMID:42150975, which is a short perspective discussing the potential of
      such inhibitors, not a result. No compound, no in vivo data, and the
      report's own Test 5 concedes this is untested. Retained as a research lead
      only; nothing added to the disease entry.
    citations:
      - PMID:39632806
      - PMID:42150975
      - PMID:41372413
  - claim_id: candidate-cell-type-curie-for-drg-neuron
    statement: >-
      CL:0011113 is offered as the ontology term for a DRG proprioceptive
      neuron.
    disposition: REJECTED
    report_quote: DRG proprioceptive neuron (CL:0011113)
    rationale: >-
      CL:0011113 is spiral ganglion neuron, a cochlear cell type, not a dorsal
      root ganglion neuron. The repository cache records that label directly
      (cache/cl/terms.csv). Binding it here would have put a hearing-related
      cell type on the FRDA sensory-neuronopathy node. The entry already uses
      CL:1001451 sensory neuron of dorsal root ganglion, which is correct, and
      the other proposed CURIEs I acted on (GO:0097707 ferroptosis, GO:0000423
      mitophagy) were re-derived from the repository caches rather than taken
      from the report.
    citations: []
  - claim_id: thin-randomized-trial-evidence-base
    statement: >-
      The therapeutic evidence base in FRDA is unusually thin, with only two
      small published RCTs meeting Cochrane inclusion criteria and the largest
      idebenone trial unpublished.
    disposition: QUALIFIED
    report_quote: Cochrane review found only 2 small published RCTs meeting inclusion criteria.
    rationale: >-
      Accurate as a statement about PMID:27572719, which reports two included
      RCTs totalling 72 participants plus unpublished pioglitazone (40
      participants) and idebenone (232 participants) trials. But that review is
      from 2016 and its scope is antioxidants with 12-month duration; it
      predates the MOXIe omaveloxolone programme and the approval that followed.
      Presenting it in a 2026 report as the current state of the trial evidence
      is stale, and the entry already curates MOXIe and two gene-therapy trials.
      No integration.
    citations:
      - PMID:27572719

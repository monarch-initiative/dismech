provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model
assessed_at: "2026-09-02T11:30:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The upstream half of the seeded chain (CGG expansion, promoter
  hypermethylation, FMR1 silencing, FMRP loss, loss of translational
  repression) is strongly supported, and the report adds causal evidence the
  KB entry did not carry: dCas9-Tet1 demethylation is sufficient to reactivate
  FMR1 and rescue the electrophysiological phenotype of patient neurons, and
  restoration of only a few percent of FMRP normalizes neuronal hyperactivity.
  The downstream half is where the report earns its qualifications, and they
  check out against the primary sources: the mGluR5-antagonist arm failed its
  behavioral endpoints in two phase 2b trials, the enhanced mGluR-LTD
  phenotype is confined to a narrow postnatal window, and the immature-spine
  phenotype normalizes with age while dendritic complexity declines. The
  report also documents four effector arms the synaptic-translation
  formulation does not cover (astrocytic GABA handling, chromatin regulation
  via BRD4, nuclear genome protection, and glutaminase-dependent metabolism);
  each is real in its cited source but each is a small number of studies.
  Two defects matter for curation. The report reads a region-specific
  spine-sparing contrast into an N=1 postmortem case whose own abstract
  reports no spine pathology in any region examined, and it declares an
  absence of ClinGen or GenCC gene-disease validity data that this repository
  already caches as a Definitive FMR1 assertion. Neither the 110-paper review
  nor the four embedded figures has any committed artifact.

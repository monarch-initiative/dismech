claims:
  - claim_id: canonical-upstream-chain
    statement: >-
      CGG repeat expansion above 200 units drives FMR1 promoter
      hypermethylation and transcriptional silencing, abolishing FMRP and
      removing translational repression.
    disposition: RETAINED
    report_quote: >-
      The upstream causal chain — CGG expansion → epigenetic silencing → FMRP
      loss → excess local protein synthesis — is among the most thoroughly
      validated disease mechanisms in neuroscience
    rationale: >-
      Well supported, but this is the seed hypothesis restated, so the report
      contributes no new support for it. The dismech entry already carries
      this chain across four pathophysiology nodes with cited evidence
      (PMID:28420439, PMID:27713816, PMID:24346713). Retained because it is
      correct and because the report's later qualifications are scoped
      against it.
    citations:
      - PMID:28420439
      - PMID:27713816
      - PMID:24346713
  - claim_id: methylation-editing-causal-proof
    statement: >-
      Targeted demethylation of the expanded CGG repeat with dCas9-Tet1 is
      sufficient to reactivate FMR1 in patient iPSCs and to rescue the
      electrophysiological abnormality of the derived neurons.
    disposition: RETAINED
    report_quote: >-
      Targeted demethylation of the CGG expansion by dCas9-Tet1 reversed FMR1
      promoter heterochromatin to an active state, restoring persistent FMR1
      expression in FXS iPSCs
    rationale: >-
      Confirmed against the source. The paper reports the switch from
      heterochromatin to active chromatin, persistent FMR1 expression, rescue of the
      elevated firing rate on multi-electrode arrays, and maintenance of FMRP
      after engraftment into mouse brain, and it states that demethylation is
      sufficient for reactivation. This is the strongest causal evidence in
      the report and it was absent from the dismech entry.
    citations:
      - PMID:29456084
  - claim_id: partial-fmrp-rescue-threshold
    statement: >-
      Restoring a small fraction of FMRP, or restoring it in a minority of
      neurons, is enough to normalize the hyperactive phenotype of FXS
      iPSC-derived neurons.
    disposition: RETAINED
    report_quote: >-
      partial restoration of >5% of overall FMRP expression levels or >20%
      FMRP-expressing neurons in a mosaic pattern was sufficient to normalize
      neuronal hyperactivity in FXS iPSC-derived neurons
    rationale: >-
      The numbers and the qualifier are reproduced accurately from the source
      abstract. The scope is one in vitro phenotype (multi-electrode-array
      hyperactivity) in patient-derived excitatory neurons; the report does
      not overclaim beyond that, though its framing as having "profound
      implications for gene therapy" is the report's inference rather than
      the paper's result.
    citations:
      - PMID:31880363
  - claim_id: unmethylated-full-mutation-spine-sparing
    statement: >-
      Rare unmethylated full-mutation males who retain FMRP lack dendritic
      spine pathology in their FMRP-positive brain regions, proving that
      methylation-dependent silencing is necessary for the phenotype.
    disposition: QUALIFIED
    report_quote: >-
      Unmethylated full mutation: FMRP+ regions lack spine pathology
    rationale: >-
      The region-contrast is not in the source. The cited postmortem study is
      a single high-functioning male with tissue-heterogeneous methylation,
      and its abstract states that neuroanatomical studies showed no dendritic
      spine pathology in any region of the brain analyzed, including the
      parietal lobe that carried the methylated full mutation and no FMRP.
      Read as written, that observation does not establish the FMRP-positive
      versus FMRP-negative contrast the report and its evidence matrix assert,
      and an N=1 case cannot carry the confidence rating "High" the matrix
      assigns it. What the case does support, and what should be retained, is
      that an unmethylated full mutation with preserved brain FMRP can
      coexist with near-normal cognition.
    citations:
      - PMID:10331599
  - claim_id: fmrp-level-tracks-cognition
    statement: >-
      Residual FMRP is quantitatively related to cognitive outcome in
      full-mutation FXS.
    disposition: RETAINED
    report_quote: >-
      Quantitative correlation between FMRP protein levels and IQ scores has
      been established in both males and females with full mutation FXS
    rationale: >-
      Supported by the cited assay-development study, which reports a positive
      correlation between IQ and Fragile X Protein levels in 187 individuals
      including both sexes with full mutation. The correlation is peripheral
      (dried blood spots), not brain, which the report does not say; that
      limitation is worth carrying into any curation of this claim.
    citations:
      - PMID:35379866
  - claim_id: mglur5-antagonist-clinical-failure
    statement: >-
      The therapeutic prediction of the mGluR theory failed in humans: phase
      2b mavoglurant trials missed their behavioral primary endpoints in
      adolescents and adults with FXS.
    disposition: RETAINED
    report_quote: >-
      Multiple phase 2b randomized controlled trials of mavoglurant (AFQ056)
      failed to demonstrate efficacy on behavioral rating primary endpoints in
      FXS adults and adolescents
    rationale: >-
      Both cited sources say this directly, and the report's secondary point
      that mavoglurant nonetheless improved eye-gaze fixation and pupil
      reactivity to faces is also accurate. The dismech entry records the
      later FXLEARN phase 3 failure but not these earlier phase 2b failures,
      so this is a genuine gap. The report's framing that expert consensus
      attributes the failure to trial design rather than model invalidity is
      itself review-level opinion and should be curated as an open question,
      not as a finding.
    citations:
      - PMID:30451888
      - PMID:30653533
      - PMID:29217836
  - claim_id: mglur-ltd-age-restriction
    statement: >-
      Enhanced mGluR-dependent long-term depression in Fmr1 knockout mice is
      restricted to a narrow postnatal window rather than being a general
      property of the genotype.
    disposition: QUALIFIED
    report_quote: >-
      The enhanced mGluR-LTD phenotype is age-restricted — observed only in
      the P30–60 age group; at all other ages tested, mGluR-LTD was almost
      identical between KO and WT
    rationale: >-
      The age restriction is stated in the source and is accurately quoted,
      but the report drops the experimental condition attached to it: the
      excess LTD in knockouts was seen in the presence of the NMDA-receptor
      blocker APV, and without APV the P60 knockouts showed little or no LTD
      at all. The paper's own conclusion is that hyperactive
      GluN2B-containing NMDA receptors, not the mGluR arm alone, underlie the
      difference. Any KB annotation of the age window should carry the
      pharmacological condition with it.
    citations:
      - PMID:27656021
  - claim_id: spine-density-normalizes-with-age
    statement: >-
      Increased dendritic spine density in the FXS mouse is developmental and
      resolves in adulthood, while dendritic branching complexity declines
      progressively, so spine density is not the relevant structural
      phenotype of the mature circuit.
    disposition: QUALIFIED
    report_quote: >-
      This dissociation fundamentally challenges the "immature spine"
      narrative for adult FXS and suggests dendritic simplification, not spine
      density, may be the relevant structural phenotype in mature circuits.
    rationale: >-
      The underlying measurement is reported exactly as the report describes
      it: Golgi-Cox analysis of hippocampal CA1 principal neurons across four
      stages from P14 to P150 found progressively fewer Sholl intersections
      and reduced branch number and length, with spine density elevated early
      and normal by adulthood. The interpretation is what needs narrowing.
      This is one 2026 mouse study in one cell population using one staining
      method; it does not overturn the human postmortem spine literature, and
      "fundamentally challenges" overstates what a single unreplicated result
      can do. Curated as an age qualification on the existing spine node, not
      as a replacement for it.
    citations:
      - PMID:41982083
  - claim_id: astrocyte-autonomous-gaba-arm
    statement: >-
      FMRP loss in astrocytes alone dysregulates astrocytic GABA handling and
      degrades cortical inhibition and temporal processing, independently of
      neuronal FMRP loss.
    disposition: RETAINED
    report_quote: >-
      Astrocyte-specific Fmr1 conditional KO mice show reduced inhibitory
      connectivity, impaired cortical responses to sound, and abnormal
      temporal processing — independently of neuronal FMRP loss
    rationale: >-
      Accurate to the source, which pairs an astrocyte-specific conditional
      knockout with human FXS iPSC-derived astrocytes showing raised GABA and
      GAD65/67, and shows that blocking astrocytic GABA transport restores PV
      expression, EEG responses to frequency-modulated sound, and exploratory
      behavior. The rescue arm is what makes this a mechanism rather than a
      correlation. It is a single 2026 study awaiting replication, and the
      human arm is cellular rather than clinical, so it belongs in the KB as
      an explicitly model-derived node.
    citations:
      - PMID:41443375
  - claim_id: nuclear-genome-protection-arm
    statement: >-
      FMRP has a nuclear genome-maintenance role: FXS cells accumulate twice
      the double-strand breaks of controls, breaks colocalize with R-loop
      forming sequences under replication stress, and DNA repair transcription
      is suppressed.
    disposition: QUALIFIED
    report_quote: >-
      FMRP loss causes genome-wide DNA double-strand break (DSB) accumulation
      — 2× compared to controls — R-loop formation during replication stress,
      and downregulation of virtually all DNA repair pathways
    rationale: >-
      The two-fold break excess, the R-loop colocalization, and the rescue by
      exogenous wild-type but not I304N FMRP are all in the first source. The
      repair-pathway downregulation is in the second source but is
      conditional in a way the report's phrasing loses: it is transcriptional
      downregulation observed under replication stress, not a constitutive
      property of FXS cells. Both studies are in patient-derived fibroblasts;
      no link from this arm to a neural or clinical phenotype has been
      established, which is the report's own Knowledge Gap 5.
    citations:
      - PMID:32966779
      - PMID:36688938
  - claim_id: brd4-chromatin-arm
    statement: >-
      FMRP represses translation of chromatin regulators including BRD4, and
      BET inhibition reverses FXS phenotypes in mice, making chromatin
      misregulation a parallel effector arm of FMRP loss.
    disposition: RETAINED
    report_quote: >-
      loss of FMRP causes widespread chromatin dysregulation and aberrant gene
      expression, and BRD4 inhibition alleviates multiple FXS phenotypes in
      mice
    rationale: >-
      Faithful to the source, whose stated conclusion is that FMRP loss
      produces significant epigenetic misregulation and that targeting
      transcription through regulators such as Brd4 may provide new
      treatments. The pharmacological reversal makes this the best-supported
      of the non-synaptic arms. Evidence is mouse-only, so it is curated as a
      model-organism mechanism.
    citations:
      - PMID:28823556
  - claim_id: glutaminase-metabolic-arm
    statement: >-
      FXS neurons show aberrant glutaminase isoform expression, reduced
      glutamine-to-glutamate conversion, and reduced anaplerotic supply to the
      TCA cycle.
    disposition: RETAINED
    report_quote: >-
      FXS iPSC neurons show dysregulated glutaminase isoforms, reduced
      glutaminolysis, and impaired TCA cycle anaplerosis
    rationale: >-
      Matches the source, which combines human postmortem metabolite and
      solute-carrier dysregulation with metabolic tracing in iPSC-derived
      excitatory neurons and attributes the reduced glutaminolysis to
      aberrant glutaminase isoform expression. The paper hedges its own
      disease link ("may contribute to FXS"), and the report does not carry
      that hedge. Note that this is already the publication behind the
      geo:GSE296077 dataset record in the dismech entry, so the KB knows the
      study without curating its mechanism.
    citations:
      - PMID:41557506
  - claim_id: trkb-superiority-over-mglur5
    statement: >-
      A TrkB agonist rescues plasticity and multiple forms of memory in Fmr1
      knockout mice where an mGluR5 antagonist does not, establishing
      BDNF-TrkB signaling as the superior therapeutic arm.
    disposition: QUALIFIED
    report_quote: >-
      In the same experimental paradigm, an mGluR5 antagonist did not improve
      learning — a direct head-to-head comparison demonstrating the
      superiority of TrkB agonism.
    rationale: >-
      The 7,8-DHF results are reported accurately, and the abstract does
      contain the sentence that an mGluR5 antagonist did not improve
      learning. Calling that a head-to-head comparison demonstrating
      superiority overreads it: the negative arm is a single unelaborated
      sentence with no drug, dose, or statistics given in the abstract, it was
      not the study's design, and the study is a mouse behavioral series. The
      useful, defensible version is that the BDNF-TrkB arm is a parallel and
      independently tractable target, which is how the report's Alternative
      Models section frames it.
    citations:
      - PMID:31494285
  - claim_id: hub-and-spoke-status-recommendation
    statement: >-
      Retain the hypothesis as CANONICAL but annotate it as a hub-and-spoke
      model in which FMRP loss feeds several parallel effector arms rather
      than a single synaptic-translation pathway.
    disposition: RETAINED
    report_quote: >-
      Mechanistically validated core pathway (CGG→silencing→FMRP loss→excess
      translation) with incomplete clinical translation. Multiple parallel
      effector arms (astrocytic, nuclear, metabolic, growth) not captured by
      synaptic-translation-only formulation.
    rationale: >-
      A reasonable curation lead and explicitly not a status change, so
      status stays CANONICAL. The dismech entry's hypothesis notes already
      record this framing; what was missing was any representation of the
      arms in the pathograph itself. Two arms with rescue evidence (astrocytic
      GABA, BRD4 chromatin) are integrated as nodes; the nuclear and metabolic
      arms are recorded as an open question because their link to the disease
      phenotype is the unresolved part.
    citations:
      - PMID:41443375
      - PMID:28823556
  - claim_id: clingen-gencc-absence
    statement: >-
      No systematic ClinGen or GenCC gene-disease validity assessment exists
      for FMR1 and fragile X syndrome.
    disposition: REJECTED
    report_quote: >-
      No GenCC or ClinGen systematic gene-disease validity assessment was
      identified in this search.
    rationale: >-
      This source-absence finding is wrong. ClinGen's Intellectual Disability
      and Autism Gene Curation Expert Panel classified FMR1 versus fragile X
      syndrome (MONDO:0010383) as Definitive under SOP6 on 2019-06-03, and
      that assertion is already cached in this repository as a CGGV reference.
      The report's own wording ("was identified in this search") describes a
      search failure, but Knowledge Gap 8 presents it alongside the genuine
      cohort-data absence as if it were an absence in the world. Nothing in
      the KB should be curated from it.
    citations:
      - PMID:29456084
  - claim_id: premutation-rna-toxicity-scope
    statement: >-
      The canonical FMRP-loss model applies to full mutations only; premutation
      carriers have an RNA gain-of-function mechanism, with UK Biobank data
      showing no relationship between repeat length and FMRP level.
    disposition: RETAINED
    report_quote: >-
      UK Biobank analysis found no association between premutation repeat
      length and FMRP levels, consistent with RNA toxicity rather than FMRP
      loss
    rationale: >-
      The quoted UK Biobank result is reported accurately, and the scope
      restriction it supports is correct and useful. One context slip: the
      cited study's subject is premature ovarian insufficiency in about 92,000
      women, not FXTAS, and the report places it in an FXTAS paragraph. The
      FMRP-level observation is a secondary result of that study rather than
      an FXTAS finding. The dismech entry already separates the FMR1 Carrier
      subtype from the Full Mutation subtype, so no new curation follows.
    citations:
      - PMID:42001465
      - PMID:16511373

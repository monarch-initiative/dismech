schema_version: "1.0"
bundle_id: abat_mitochondrial_nucleoside_salvage/openscientist_artifacts
hypothesis_group_id: abat_mitochondrial_nucleoside_salvage
disease: GABA Aminotransaminase Deficiency
generated: "2026-11-28"
retrieval_date: "2026-11-28"

status:
  overall: succeeded_with_documented_fallbacks
  fallback_flags:
    - id: intact_rest_404
      description: >-
        IntAct REST endpoint /intact/ws/interaction/countInteraction/{gene} returned HTTP 404 for
        ABAT, TK2 and DGUOK. Fell back to the PSICQUIC IntAct mirror
        (www.ebi.ac.uk/Tools/webservices/psicquic/intact, format tab25). Documented, not silent.
        Limitation: PSICQUIC returns a capped result set (maxResults=200); the 23 records retrieved
        are not guaranteed to be the complete IntAct record for ABAT.
    - id: depmap_gated
      description: >-
        depmap.org/portal/api/download/files returned an HTML verification interstitial rather than
        JSON. DepMap co-essentiality analysis for ABAT was NOT performed. Not attempted further.
        Limitation: a CRISPR co-dependency test of ABAT against mtDNA-maintenance genes is absent
        from this bundle.
    - id: clinvar_parser_v1_failed
      description: >-
        First ClinVar esummary parse (iteration 1) read a top-level trait_set key and returned zero
        terms. Corrected in iteration 2 to read germline_classification.trait_set and re-run with
        TK2 and DGUOK positive controls. Only the corrected run is reported.
    - id: pubmed_tool_recall
      description: >-
        The search_pubmed MCP tool returned 0 results for several multi-term queries that NCBI
        E-utilities answered normally. Literature enumeration therefore used E-utilities directly;
        search_pubmed was used only to obtain abstracts for citation snippet validation.


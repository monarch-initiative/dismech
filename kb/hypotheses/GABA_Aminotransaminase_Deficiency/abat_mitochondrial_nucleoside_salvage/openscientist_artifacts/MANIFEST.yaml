environment:
  executor: OpenScientist MCP execute_code, Python sandbox
  allowed_imports: [pandas, numpy, scipy, matplotlib, seaborn, statsmodels, sklearn, math, statistics,
                    collections, itertools, functools, operator, datetime, time, re, json, os, requests,
                    networkx, scanpy, anndata, h5py]
  blocked_imports_encountered: [sys, io, hashlib, platform, urllib]
  random_seeds: none required, no stochastic method used
  checksums_computed_by: sha256sum, host shell, outside the Python sandbox (hashlib unavailable)

replay_verification:
  deterministic: partial
  note: >-
    All analyses are deterministic given a fixed snapshot of each live API. GenCC, ClinVar, PanelApp,
    HPO and PubMed are live and unversioned or rolling, so re-running on a later date may yield
    different counts. GTEx v8 and gnomAD v4 are versioned and should replay exactly.
    Re-running A1-A9 and A11 reproduces the reported statistics from the bundled derived tables
    without network access. FAERS is cumulative and append-only, so later re-queries will return
    larger counts; the receivedate window is fixed in the query to bound this.

not_produced:
  - DepMap CRISPR co-essentiality table for ABAT (source gated, analysis skipped)
  - Any patient-level or controlled-access data (none accessed by design)
  - Raw GenCC 28.5 MB CSV (recoverable from the cited URI, deliberately excluded)

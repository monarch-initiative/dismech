analyses:
  - id: A1_gencc_curation_gap
    outcome: succeeded
    input: gencc_submissions
    method: pandas filter on gene_symbol; regex 'mitochond|depletion|MDS' on disease_title; scipy.stats.fisher_exact one-sided
    output: derived/gencc_ABAT_submissions.csv, derived/gencc_MDS_gene_comparison.csv
    result: "ABAT 0/6 vs comparators 89/137 (65.0%); one-sided p = 2.42e-03"
    limitation: GenCC export carries no version string, so the snapshot is reproducible only by date
  - id: A2_clinvar_condition_terms
    outcome: succeeded
    input: clinvar_abat
    method: esearch + esummary; parse germline_classification.trait_set; TK2/DGUOK positive controls
    output: derived/clinvar_ABAT_condition_terms.csv
    result: "ABAT 0/1088 trait assertions mitochondrial; TK2 23.0%, DGUOK 6.1%"
    limitation: supersedes a failed v1 parse (see fallback clinvar_parser_v1_failed)
  - id: A3_literature_enumeration
    outcome: succeeded
    input: PubMed E-utilities esearch/esummary/elink
    method: tiab field queries; elink pubmed_pubmed_citedin for PMID 25738457; author-affiliation flagging
    output: derived/pubmed_ABAT_X_mtDNA.csv, derived/pubmed_ABAT_X_nucleoside.csv, derived/pubmed_ABAT_deficiency_clinical.csv, logs/pubmed_clinvar_log.json
    result: "7 ABAT x mtDNA records, only 2 primary and both Bonnen lab; 103 citers of PMID 25738457, no independent primary replication in the result set"
    limitation: "tiab restricts to title/abstract; a replication buried in a paper's results without abstract mention would be missed"
  - id: A4_gtex_tissue_tropism
    outcome: succeeded
    input: gtex_v8
    method: median TPM per tissue; within-gene rank across 54 tissues; comparison to known MDS organ tropism
    output: derived/gtex_v8_median_tpm_MDS_genes.csv, figures/plot_1.png
    result: "ABAT muscle 0.8 TPM rank 54/54; liver 98.4 TPM rank 3/54; brain cortex 83.7 TPM rank 6/54"
    limitation: "bulk adult transcript levels, not protein or neonatal; GTEx has no neonatal donors, and the disease is neonatal-onset"
  - id: A5_interaction_neighbourhood
    outcome: succeeded
    input: string_v12, intact_psicquic
    method: partner gene-set classification against 33 nucleotide/mtDNA genes, 29 GABA genes, 18 TCA genes; explicit edge lookup in top 200
    output: derived/string_partner_class_counts.csv, logs/intact_log.json
    result: "ABAT 0/50 nucleotide partners vs TK2 17/50, DGUOK 18/50; ABAT-SUCLA2, ABAT-NME4 absent from top 200"
    limitation: "absence from STRING text-mining is weaker evidence than absence from curated experimental channels"
  - id: A6_panelapp_membership
    outcome: succeeded
    input: panelapp_ge
    method: gene-to-panel enumeration; confidence_level and publications field extraction; TK2 control
    output: derived/panelapp_ABAT_full.csv, derived/panelapp_mito_membership.csv, figures/plot_3.png
    result: "ABAT GREEN (confidence 3) on 3 mitochondrial panels, phenotype 'Mitochondrial DNA depletion syndrome', publications = PMID 25738457 only"
    limitation: none material; this is a direct record read
  - id: A7_gnomad_constraint
    outcome: succeeded_non_discriminating
    input: gnomad_v4
    method: GraphQL gnomad_constraint fields for 8 genes
    output: derived/gnomad_constraint_ABAT_vs_MDS.csv
    result: "ABAT LOEUF 0.893 inside comparator range 0.634-1.113; no discrimination between hypotheses"
    limitation: "constraint metrics are uninformative for recessive genes; recorded as a tried-and-failed approach"
  - id: A8_impc_mouse
    outcome: succeeded
    input: impc_gp
    method: Solr query marker_symbol:"Abat"
    output: logs (inline), no separate table
    result: "homozygous preweaning lethality complete penetrance p=0.0; het decreased erythrocyte count p=9.27e-06; no mitochondrial parameter run"
    limitation: IMPC pipeline does not assay mtDNA copy number, so this is absence of assay not absence of phenotype
  - id: A9_hpo_phenotype_entity
    outcome: succeeded
    input: hpo_annotations, mondo_ols4
    method: term-name regex for mitochondrial markers; fisher_exact vs 4 MDS entities
    output: derived/hpo_mito_marker_counts.csv, logs/hpo_disease_annotations.json, figures/plot_4.png
    result: "ABAT 0/18 mitochondrial HPO terms vs pooled 24/166 (14.5%); one-sided p = 0.0707, suggestive not significant"
    limitation: "small term counts; HPO annotation depth tracks literature volume, which is itself confounded with the ascertainment problem"
  - id: A10_depmap_coessentiality
    outcome: skipped
    input: depmap
    method: not run
    result: null
    limitation: "portal gated behind a verification interstitial; no CRISPR co-dependency evidence in this bundle"
  - id: A11_openfda_faers_disproportionality
    outcome: succeeded
    input: openfda_faers
    method: >-
      PRR and ROR with one-sided Fisher exact test for 7 MedDRA preferred terms across vigabatrin
      (ABAT inhibitor, the pharmacological model of the hypothesis), valproate (drug positive control)
      and levetiracetam (intended drug negative control), against a 21,053,772-report background
    output: derived/openfda_faers_disproportionality.csv, logs/openfda_query_log.json, figures/plot_5.png
    result: >-
      Vigabatrin n = 5113 reports. Mitochondrial-toxicity terms all below null: lactic acidosis
      PRR 0.25 (n=2), hepatic failure PRR 0.28 (n=3), mitochondrial toxicity PRR 0.00 (n=0),
      rhabdomyolysis PRR 0.30 (n=3), myopathy PRR 0.80 (n=2). Within-drug method control positive:
      visual field defect PRR 16.57 (n=29, p = 2.31e-25). Valproate positive control recovers
      mitochondrial toxicity PRR 11.02 (n=15, p = 2.5e-11).
    limitation: >-
      Levetiracetam was not a clean negative control (mitochondrial toxicity PRR 9.02, rhabdomyolysis
      PRR 8.06), most plausibly confounding by indication and co-prescription with valproate, so
      cross-drug contrasts are weakened and only the within-vigabatrin pattern is relied on. FAERS is
      spontaneous reporting with no denominators and strong reporting bias. Power: a PRR of 2 for
      lactic acidosis would predict about 16 reports against 2 observed, so a large systemic signal is
      excluded but a PRR near 1.5 is not. Blood lactic acid increased was borderline (PRR 3.91, n=5,
      p = 0.010) and uncorroborated by the higher-severity lactic acidosis term.


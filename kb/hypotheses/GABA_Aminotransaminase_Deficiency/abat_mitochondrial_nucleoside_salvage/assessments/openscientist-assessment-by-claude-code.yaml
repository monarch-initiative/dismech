schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: abat_mitochondrial_nucleoside_salvage
assessed_at: "2026-11-28T22:00:00Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report tests whether ABAT has a second role in mitochondrial nucleoside
  salvage and whether GABA aminotransaminase deficiency is in part a
  mitochondrial DNA depletion syndrome. Its conclusion is that the idea is
  weakly supported and should stay EMERGING, which is the status the disease
  entry already gives it, so nothing in the entry needs to change.

  What the report adds is a set of indirect checks, all pointing the same way:
  ABAT is barely expressed in skeletal muscle, patients and vigabatrin-treated
  populations show no systemic mitochondrial signal, the curated phenotype
  carries no mitochondrial marker, and no interaction database links ABAT to
  the proposed partners. None of these is the measurement that would settle the
  question, which is mitochondrial DNA copy number in patient muscle, brain or
  retina, and the report says so itself. A version of the hypothesis limited to
  the retina is left standing.

  Two findings are new to curation and were checked. Genomics England PanelApp
  lists ABAT at diagnostic grade for mitochondrial DNA depletion syndrome on
  three panels, each citing only the 2015 paper; this was reproduced by a fresh
  query of the PanelApp API during assessment. IMPC reports that mice
  homozygous for an Abat null allele die before weaning, which is why no adult
  animal has been used to test the idea. Neither has been promoted into the
  disease entry yet; both need a citable source first.

  The artifact bundle has 19 derived tables, logs and figures, and three of the
  tables were recomputed or spot-checked here and match the report. It fails
  the repository's analysis-run gate (no analysis code, no environment
  specification, a manifest not in the canonical shape), so every analysis is
  recorded as PARTIAL: the outputs are inspectable but the step from source to
  table is attested only by the provider.
artifact_root: ../openscientist_artifacts
data_sources:
  - data_source_id: gtex-v8
    source_type: API
    name: GTEx v8 median gene expression for ABAT and 12 comparison genes
    uri: https://gtexportal.org/api/v2/expression/medianGeneExpression
    version: gtex_v8
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: 54 tissues by 13 genes, median TPM
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/gtex_v8_median_tpm_MDS_genes.csv
    notes: >-
      Relevant, with the limit the report states: bulk adult tissue from healthy
      donors, no neonatal samples. The committed table reproduces the headline
      figures (skeletal muscle 0.81 TPM, lowest of 54 tissues; liver 98.4, third).
  - data_source_id: openfda-faers
    source_type: API
    name: openFDA FAERS adverse event counts for vigabatrin and two control drugs
    uri: https://api.fda.gov/drug/event.json
    version: live API, no version string
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: aggregate counts, 3 drugs by 7 MedDRA terms, 2004 to 2026
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/openfda_faers_disproportionality.csv
      - ../openscientist_artifacts/logs/openfda_query_log.json
    notes: >-
      Aggregate counts only. Relevance is indirect: vigabatrin exposure in
      people with epilepsy is a pharmacological stand-in for the genetic
      disease, and spontaneous reports cannot show absence of an effect that
      nobody tests for. The table also shows a raised ratio for increased blood
      lactic acid (3.91, 5 reports), which the summary's "below the null"
      wording does not mention.
  - data_source_id: panelapp-abat
    source_type: API
    name: Genomics England PanelApp gene record for ABAT
    uri: https://panelapp.genomicsengland.co.uk/api/v1/genes/ABAT/
    version: API v1; panels 112 v10.25, 533 v3.11, 539 v5.25
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: gene-to-panel enumeration with confidence level and publications
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/panelapp_ABAT_full.csv
      - ../openscientist_artifacts/derived/panelapp_mito_membership.csv
    notes: >-
      Re-queried during assessment on 2026-11-28; the live record matches the
      report: 11 panels, with panels 533, 539 and 112 at confidence level 3
      under a mitochondrial DNA depletion phenotype and citing only
      PMID:25738457.
  - data_source_id: gencc-export
    source_type: DATABASE
    name: GenCC submissions export
    uri: https://search.thegencc.org/download/action/submissions-export-csv
    version: live export, no version string
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: gene_symbol ABAT, with 16 mitochondrial DNA maintenance genes as comparators
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/gencc_ABAT_submissions.csv
      - ../openscientist_artifacts/derived/gencc_MDS_gene_comparison.csv
      - ../openscientist_artifacts/logs/access_log_gencc.json
    notes: >-
      The raw export is not committed, by the bundle's stated policy. The six
      ABAT rows are: five for GABA aminotransaminase deficiency (Definitive,
      Strong twice, Moderate, Supportive) and one for developmental and
      epileptic encephalopathy. None names a mitochondrial disease. The five
      disease-specific rows are a lead for the entry's gene_disease_validity
      slot, which currently records nothing.
  - data_source_id: clinvar-abat
    source_type: DATABASE
    name: ClinVar condition terms for ABAT, TK2 and DGUOK
    uri: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    version: live database
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: "ABAT[gene], TK2[gene], DGUOK[gene]; esearch then esummary"
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/clinvar_ABAT_condition_terms.csv
      - ../openscientist_artifacts/logs/pubmed_clinvar_log.json
    notes: >-
      The 926-record count for ABAT matches an independent ClinVar query made
      while curating the disease entry. A first parse returned nothing and was
      corrected; only the corrected run is reported.
  - data_source_id: pubmed-abat
    source_type: DATABASE
    name: PubMed enumeration of ABAT with mitochondrial DNA and nucleoside terms
    uri: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    version: live database
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: title and abstract queries; citing records of PMID 25738457
    source_artifacts:
      - ../openscientist_artifacts/derived/pubmed_ABAT_X_mtDNA.csv
      - ../openscientist_artifacts/derived/pubmed_ABAT_X_nucleoside.csv
      - ../openscientist_artifacts/logs/pubmed_clinvar_log.json
    notes: >-
      Supports the statement that primary data come from one laboratory.
      Title-and-abstract search cannot exclude a replication reported only in
      a paper's body.
  - data_source_id: string-intact
    source_type: API
    name: STRING v12 partners and IntAct records for ABAT and comparison genes
    uri: https://string-db.org/api
    version: STRING v12; IntAct through the PSICQUIC mirror
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: top 50 and top 200 partners; IntAct identifier ABAT, capped at 200 results
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/string_partner_class_counts.csv
      - ../openscientist_artifacts/logs/intact_log.json
    notes: >-
      IntAct was reached through a fallback after the REST endpoint returned
      404, and the result set is capped, so absence of an interaction here is
      weak evidence.
  - data_source_id: hpo-annotations
    source_type: API
    name: HPO disease annotations for OMIM 613163 and four depletion syndromes
    uri: https://ontology.jax.org/api/network/annotation
    version: live
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: annotation term lists, matched against mitochondrial marker terms
    source_artifacts:
      - ../openscientist_artifacts/derived/hpo_mito_marker_counts.csv
      - ../openscientist_artifacts/logs/hpo_disease_annotations.json
    notes: >-
      Annotation depth follows how much has been published, so 0 of 18 terms is
      weak evidence, and the report's own test does not reach significance
      (p = 0.07).
  - data_source_id: gnomad-constraint
    source_type: API
    name: gnomAD v4 constraint for ABAT and seven comparison genes
    uri: https://gnomad.broadinstitute.org/api
    version: gnomAD v4
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: ACCESSED
    query: gnomad_constraint fields for ABAT, TK2, DGUOK, SUCLA2, POLG, RRM2B, TFAM and ALDH5A1
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/derived/gnomad_constraint_ABAT_vs_MDS.csv
    notes: The report correctly calls this non-discriminating for recessive genes.
  - data_source_id: impc-abat
    source_type: API
    name: IMPC genotype-phenotype calls for mouse Abat
    uri: https://www.ebi.ac.uk/mi/impc/solr/genotype-phenotype
    version: live
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: UNVERIFIABLE
    query: 'marker_symbol:"Abat"'
    organism: Mus musculus
    notes: >-
      Recorded as UNVERIFIABLE because no response or log for this query is in
      the bundle; the report describes the log as inline. The preweaning
      lethality result is plausible and worth confirming against IMPC before it
      is used in the disease entry.
  - data_source_id: depmap
    source_type: API
    name: DepMap CRISPR co-dependency
    uri: https://depmap.org/portal/api/download/files
    retrieved_at: "2026-11-28T00:00:00Z"
    access_status: UNVERIFIABLE
    notes: >-
      Not accessed: the portal returned a verification page. The report states
      this and records the analysis as skipped.
analyses:
  - analysis_id: gtex-tissue-rank
    method: Rank each gene's median TPM across 54 GTEx tissues and compare ABAT with established depletion-syndrome genes.
    input_data_source_ids:
      - gtex-v8
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/derived/gtex_v8_median_tpm_MDS_genes.csv
      - ../openscientist_artifacts/figures/plot_1.png
    status_reason: >-
      Re-ranking the committed table reproduces the reported ranks for ABAT.
      PARTIAL because no code or environment was delivered.
    limitations: Bulk adult expression says nothing about neonatal brain or about protein level.
  - analysis_id: faers-disproportionality
    method: Proportional reporting ratios with one-sided Fisher tests for 3 drugs by 7 adverse event terms.
    input_data_source_ids:
      - openfda-faers
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/derived/openfda_faers_disproportionality.csv
      - ../openscientist_artifacts/figures/plot_5.png
    status_reason: >-
      The table and the query log are committed and agree with the text; the
      code that produced them is not. Positive controls (valproate, and
      vigabatrin visual field defect) behave as expected.
    limitations: >-
      Spontaneous reporting; small counts for vigabatrin (2 to 5 reports per
      mitochondrial term); a drug taken for epilepsy is not the genetic disease.
  - analysis_id: panelapp-membership
    method: Enumerate PanelApp panels listing ABAT, with confidence level and cited publications.
    input_data_source_ids:
      - panelapp-abat
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/derived/panelapp_ABAT_full.csv
      - ../openscientist_artifacts/derived/panelapp_mito_membership.csv
      - ../openscientist_artifacts/figures/plot_3.png
    status_reason: >-
      A direct record read, independently reproduced against the live API
      during assessment. PARTIAL only because no code was delivered.
  - analysis_id: curation-and-literature-census
    method: >-
      Count mitochondrial disease terms for ABAT in GenCC, ClinVar and HPO
      against depletion-syndrome genes, and enumerate primary papers and citing
      records in PubMed.
    input_data_source_ids:
      - gencc-export
      - clinvar-abat
      - hpo-annotations
      - pubmed-abat
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/derived/gencc_MDS_gene_comparison.csv
      - ../openscientist_artifacts/derived/clinvar_ABAT_condition_terms.csv
      - ../openscientist_artifacts/derived/hpo_mito_marker_counts.csv
      - ../openscientist_artifacts/derived/curation_source_agreement_matrix.csv
    status_reason: >-
      Tables committed and consistent with the text; the GenCC ABAT rows were
      read here. No code delivered, and all four sources are unpinned live
      databases.
    limitations: >-
      These count what curators have written down. Absence of a mitochondrial
      term reflects absence of reported measurement as much as absence of the
      feature.
  - analysis_id: interaction-neighbourhood
    method: Classify STRING and IntAct partners of ABAT and comparison genes against nucleotide, GABA and TCA gene sets.
    input_data_source_ids:
      - string-intact
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/derived/string_partner_class_counts.csv
    status_reason: Table committed; IntAct reached by a documented fallback with a capped result set; no code delivered.
    limitations: Database absence of an interaction is weak evidence against a complex reported from co-immunoprecipitation.
  - analysis_id: depmap-codependency
    method: CRISPR co-dependency of ABAT with mitochondrial DNA maintenance genes.
    input_data_source_ids:
      - depmap
    status: SKIPPED
    auditability: UNVERIFIABLE
    status_reason: The data portal could not be reached; the report records the analysis as not run.
claims:
  - claim_id: stays-emerging
    statement: >-
      The hypothesis that ABAT maintains mitochondrial dNTP pools and
      mitochondrial DNA is weakly supported and should remain an emerging
      hypothesis.
    disposition: RETAINED
    report_quote: >-
      should stay EMERGING, with its curated scope narrowed
    rationale: >-
      Matches the primary literature as read during curation: the supporting
      data are cell-culture experiments from one group (PMID:25738457,
      PMID:27903293), and patient tissue has not been measured. The disease
      entry already records the hypothesis as EMERGING with the two mechanism
      nodes marked PROVISIONAL.
    citations:
      - PMID:25738457
      - PMID:27903293
  - claim_id: systemic-depletion-contradicted
    statement: >-
      Classing the disease as a systemic mitochondrial DNA depletion syndrome is
      contradicted by current data.
    disposition: QUALIFIED
    report_quote: >-
      Every result against the systemic model is indirect
    rationale: >-
      The direction is reasonable but "contradicted" is stronger than the
      evidence. Each result is indirect, as the report itself states: tissue
      expression in healthy adults, adverse event reports for a drug, and
      counts of what curators have annotated. The adverse event table also
      contains a raised ratio for increased blood lactic acid that the summary
      omits. The fair reading is that there is no positive evidence for a
      systemic mitochondrial phenotype, not that one has been excluded.
    analysis_ids:
      - gtex-tissue-rank
      - faers-disproportionality
      - curation-and-literature-census
  - claim_id: muscle-expression-lowest
    statement: ABAT expression is lowest in skeletal muscle and high in liver and brain, unlike established depletion-syndrome genes.
    disposition: QUALIFIED
    report_quote: >-
      ABAT ranks 54 of 54 GTEx v8 tissues for skeletal muscle expression
    rationale: >-
      Reproduced from the committed table, though the analysis itself is only
      partly auditable because no code was delivered. It explains why a myopathic
      presentation would not be expected, but says nothing about whether brain
      or retina depend on the proposed function.
    analysis_ids:
      - gtex-tissue-rank
  - claim_id: panelapp-green-on-one-paper
    statement: >-
      Genomics England PanelApp lists ABAT at diagnostic grade under a
      mitochondrial DNA depletion phenotype on three panels, citing only the
      2015 paper.
    disposition: QUALIFIED
    report_quote: >-
      ABAT appears on 11 panels, 3 of them mitochondrial
    rationale: >-
      Confirmed by a fresh query of the PanelApp API on 2026-11-28; qualified
      only because the provider's own analysis is partly auditable. This is
      expert-panel use of the claim that is not independent of PMID:25738457,
      and it is a useful fact for the disease entry's discussion of the
      hypothesis once a citable form is chosen.
    analysis_ids:
      - panelapp-membership
    citations:
      - PMID:25738457
  - claim_id: no-interaction-footprint
    statement: No interaction database links ABAT to nucleotide metabolism proteins or to the proposed partners.
    disposition: QUALIFIED
    report_quote: >-
      0 of ABAT's 50 top STRING v12 partners are nucleotide-metabolism genes
    rationale: >-
      True of the tables, but weak. STRING is largely text-mined and IntAct was
      reached through a capped fallback query, so absence does not test the
      co-immunoprecipitation result.
    analysis_ids:
      - interaction-neighbourhood
  - claim_id: abat-null-mouse-lethal
    statement: Mice homozygous for an Abat null allele die before weaning, so no adult null animal is available to measure tissue mitochondrial DNA.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Homozygotes show preweaning lethality with complete penetrance
    rationale: >-
      Plausible and relevant, since the disease entry currently lists no
      vertebrate genetic model, but the query response is not in the bundle.
      Confirm against IMPC and find a citable source before adding an animal
      model to the entry.
  - claim_id: all-analyses-reproducible
    statement: Ten of eleven analyses succeeded and all inputs, code paths and checksums are recorded in the bundle manifest.
    disposition: QUALIFIED
    report_quote: >-
      Eleven analyses were attempted: ten succeeded and one was skipped
    rationale: >-
      The derived tables, logs and figures are present and the spot checks made
      here agree with the text, and failures and fallbacks are reported openly.
      The bundle nevertheless fails just validate-hypothesis-analysis-run: it
      contains no analysis code and no environment specification, and the
      manifest is not in the canonical shape, so the runs cannot be replayed
      and are recorded here as PARTIAL.

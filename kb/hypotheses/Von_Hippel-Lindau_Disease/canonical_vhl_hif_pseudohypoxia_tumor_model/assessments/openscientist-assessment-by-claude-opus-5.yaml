schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_vhl_hif_pseudohypoxia_tumor_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The seed mechanism — biallelic VHL inactivation, failure to ubiquitylate
  prolyl-hydroxylated HIF-alpha, pseudohypoxic transcription of VEGF/PDGF/EPO,
  and the characteristic vascular tumor spectrum — is confirmed at every link I
  checked against primary sources. The report also does real work beyond
  restating the KB seed: it assembles four evidence layers the entry did not
  cite (the VCB-hydroxyproline crystal structure, the PT2385 G323E gatekeeper
  resistance mutation, the EPAS1 GWAS locus, and belzutifan response data in
  retinal hemangioblastoma and PPGL), and it states four qualifications that
  genuinely bound the model's explanatory reach. Each of those qualifications
  checked out against its primary source: HIF1A behaves as a 14q kidney cancer
  suppressor rather than an oncogene; type 2C VHL alleles promote HIF-alpha
  ubiquitylation normally and still cause pheochromocytoma; VHL loss alone is
  often insufficient for ccRCC without a 3p chromatin-modifier co-deletion; and
  tissue tropism is unexplained. Three defects keep this short of a clean
  endorsement. The Chuvash polycythemia paragraph attributes pulmonary
  hypertension and the absence of tumor predisposition to PMID:23015148, a
  glucose-metabolism study that reports neither. The TBK1 finding is drawn from
  a commentary rather than the primary study it previews, and is graded "in
  vitro" as though it were primary data. The report's two headline
  quantitative anchors, roughly 95 percent penetrance by age 60 and 86 to 89
  percent biallelic inactivation in ccRCC, carry no citation anywhere in the
  document. One proposed ontology CURIE (GO:0061418) is not resolvable from
  this repository's caches and one proposed label does not match the ontology.
  None of this touches the central mechanism, which is why the verdict is
  SUPPORTED rather than PARTIALLY_SUPPORTED.
data_sources:
  - data_source_id: pubmed-literature-corpus
    source_type: DATABASE
    name: PubMed literature corpus screened by the provider run
    access_status: UNVERIFIABLE
    notes: >-
      The report claims 115 papers reviewed across 5 iterations with 20
      confirmed findings, but the committed citation manifest
      (openscientist.md.citations.md) lists 41 identifiers and no search
      strategy, query string, or screening log is deposited. Prose alone is not
      an access record, so the corpus size and the screening procedure cannot be
      reconstructed. Every identifier I spot-checked does resolve to a real
      paper with the title the report implies, so this is a provenance gap
      rather than evidence of fabricated citations.
  - data_source_id: flatiron-foundation-medicine-cgdb
    source_type: DATABASE
    name: Flatiron Health-Foundation Medicine clinico-genomic database (mccRCC cohort, n=858)
    identifier: PMID:39965361
    access_status: CITED_NOT_ACCESSED
    cohort: Adults with metastatic clear-cell renal cell carcinoma, US electronic health records 2011-2022
    notes: >-
      The mutation frequencies quoted by the report (VHL 73.9 percent, PBRM1
      42.4 percent, SETD2 25.3 percent, BAP1 16.4 percent) are transcribed
      correctly from the cited publication's abstract. The provider read the
      publication, not the database; the database itself is licensed and was not
      queried.
  - data_source_id: rcc-gwas-scans
    source_type: PUBLIC_DATASET
    name: IARC/CNG and NCI renal cell carcinoma genome-wide association scans
    identifier: PMID:21131975
    access_status: CITED_NOT_ACCESSED
    cohort: 3,772 RCC cases and 8,505 controls of European background, plus replication
    notes: >-
      Both reported association statistics at the EPAS1 locus match the cited
      paper exactly. No genotype or summary-statistic file was retrieved by the
      provider.
  - data_source_id: vhl-natural-history-registries
    source_type: DATABASE
    name: VHL clinical registries and cohorts named as checked for longitudinal molecular data
    identifier: PMID:36625343
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Knowledge Gap 6 names a Brazilian registry (PMID:36625343), a Canadian
      cohort (PMID:31368132), and the NIH VHL study as what was checked, and
      concludes that no large-scale public longitudinal molecular dataset exists.
      That is a source-level absence claim with no deposited search log behind
      it, so the negative result is a lead rather than a verified absence. The
      two named cohort publications are real.
analyses:
  - analysis_id: evidence-matrix-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual construction of a 33-row evidence matrix classifying each citation
      by evidence type, direction, mechanistic claim, subtype, and confidence.
    input_data_source_ids:
      - pubmed-literature-corpus
    status_reason: >-
      No code, intermediate table, or scoring rubric is committed. The matrix is
      readable and its per-row assignments are mostly defensible, but the
      confidence and direction labels are unaudited editorial judgements. Two
      rows are wrong on their own terms: row 26 grades a commentary
      (PMID:41997114) as in vitro primary evidence, and row 21 attributes a
      no-tumor-predisposition observation to a glucose-metabolism paper.
  - analysis_id: figure-generation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Four figures are emitted as template placeholders: an evidence assessment
      panel, a mechanistic causal chain diagram, an evidence-type distribution,
      and a knowledge-gap importance-versus-tractability plot.
    status_reason: >-
      The hypothesis directory contains only openscientist.md and its citations
      sidecar. There is no openscientist_artifacts/ bundle, so none of the four
      referenced PNG files exists and the underlying plotted values cannot be
      inspected. The placeholders render as literal template syntax.
claims:
  - claim_id: canonical-core-mechanism
    statement: >-
      Biallelic VHL inactivation stabilizes HIF-alpha under normoxia and drives
      the characteristic VHL vascular tumor spectrum, and this remains the
      canonical mechanism.
    disposition: RETAINED
    report_quote: >-
      The canonical VHL/HIF pseudohypoxia tumor model is robustly validated
      across five independent and convergent evidence layers
    rationale: >-
      The seed hypothesis came from the dismech entry, so agreement with it is
      not itself new support. What makes this RETAINED rather than a
      rubber-stamp is that three of the five layers the report names are
      citations the disorder entry did not previously hold, and each checks out:
      the VCB-hydroxyproline crystal structure defining oxygen sensing, the
      PT2385 gatekeeper resistance mutation establishing HIF-2 as the core
      dependency, and the EPAS1 GWAS locus linking hereditary to sporadic RCC.
      The report retains CANONICAL status and proposes no status change, which
      is the correct call.
    citations:
      - PMID:12050673
      - PMID:31727677
      - PMID:21131975
      - PMID:37980175
  - claim_id: belzutifan-pan-tumor-validation
    statement: >-
      HIF-2alpha inhibition with belzutifan produces objective responses across
      every VHL tumor type, which is pharmacologic evidence that HIF-2alpha
      activation is the shared driver of the spectrum.
    disposition: RETAINED
    report_quote: >-
      This pan-tumor efficacy of a single molecular-targeted agent is
      exceptionally strong evidence that HIF-2α activation is the shared
      pathogenic driver across the VHL tumor spectrum.
    rationale: >-
      The two figures I could check against primary sources are exact. The
      LITESPARK-004 ocular subgroup reports all 16 evaluable eyes improved for a
      100 percent response rate, and the phase 2 PPGL trial reports a 26 percent
      confirmed objective response with 85 percent disease control in 72
      participants. The inference from cross-tissue drug response to a shared
      driver is a reasonable one for a target-selective agent, though it remains
      an inference: response rates span 26 to 100 percent across tissues, which
      the report itself flags as an unexplained heterogeneity.
    citations:
      - PMID:38849055
      - PMID:41124218
  - claim_id: hif2-gatekeeper-resistance
    statement: >-
      An acquired G323E gatekeeper mutation in HIF-2alpha confers resistance to
      a HIF-2 inhibitor in patients, which is on-target genetic confirmation
      that HIF-2 activity is the critical mediator of ccRCC growth.
    disposition: RETAINED
    report_quote: >-
      Prolonged treatment led to acquired resistance through a gatekeeper
      mutation (G323E) in HIF-2α that interfered with drug binding and precluded
      HIF-2 complex dissociation
    rationale: >-
      Verbatim in the cited trial substudy, which reports that prolonged PT2385
      treatment produced resistance via a G323E gatekeeper mutation interfering
      with drug binding, and concludes that the findings demonstrate a core
      dependency on HIF-2 in metastatic ccRCC. This is the single strongest new
      citation in the report and the disorder entry did not hold it.
    citations:
      - PMID:31727677
  - claim_id: hif1a-tumor-suppressor-dichotomy
    statement: >-
      HIF-2alpha rather than HIF-1alpha is the oncogenic isoform in ccRCC, and
      HIF-1alpha behaves as a 14q tumor suppressor, so undifferentiated
      references to HIF-alpha stabilization are imprecise.
    disposition: RETAINED
    report_quote: >-
      This means the canonical model's generic reference to "HIF-α
      stabilization" is mechanistically imprecise — it is specifically HIF-2α
      that drives oncogenesis, while HIF-1α loss is a cooperating event.
    rationale: >-
      The cited functional study identifies focal homozygous HIF1A deletions on
      14q in ccRCC cell lines, shows wild-type HIF1A suppresses renal carcinoma
      growth while the deleted products do not, and reports that every somatic
      HIF1A mutation found in kidney cancer tested to that point was
      loss-of-function. The disorder entry's own node already hedged with
      "primarily HIF-2alpha in RCC" but carried no citation for the isoform
      split, so this is a real gap the report closes.
    citations:
      - PMID:22037472
      - PMID:26298207
  - claim_id: type2c-hif-independent-pheochromocytoma
    statement: >-
      Type 2C VHL mutations cause pheochromocytoma while retaining normal
      HIF-alpha ubiquitylation, proving that HIF-independent pVHL functions are
      pathogenically relevant.
    disposition: RETAINED
    report_quote: >-
      Biochemically, these mutations promote HIF-α ubiquitylation in vitro and
      demonstrate wild-type binding patterns with pVHL interacting proteins,
      suggesting that loss of other pVHL functions — not HIF dysregulation —
      drives pheochromocytoma susceptibility
    rationale: >-
      This is an accurate paraphrase of the cited study, which examined 13
      naturally occurring VHL mutations across the phenotypic subclasses and
      found the pheochromocytoma-only alleles promoted HIF-alpha ubiquitylation
      and showed wild-type interactor binding. Note the report's word "proving"
      is stronger than the authors' "suggesting"; the biochemical retention of
      HIF regulation is demonstrated, the identity of the responsible
      HIF-independent function is not. The disorder entry's VHL Type 2C subtype
      description said these alleles "retain some HIF regulatory function",
      which understates a result showing normal ubiquitylation.
    citations:
      - PMID:11331613
      - PMID:21155973
  - claim_id: chromatin-remodeler-co-drivers
    statement: >-
      VHL loss alone is often insufficient for ccRCC; co-deletion of the 3p
      chromatin modifiers PBRM1, BAP1 and SETD2 supplies required co-driver
      events that define distinct molecular subtypes.
    disposition: QUALIFIED
    report_quote: >-
      Loss of VHL alone is often insufficient to drive oncogenesis;
      co-deletions of VHL with PBRM1, BAP1, and/or SETD2 are important
      co-drivers
    rationale: >-
      The insufficiency statement is copied almost word for word from the cited
      review and is well accepted. The co-mutation frequencies are transcribed
      correctly from the 858-patient genomic cohort. The qualification is that
      the frequency data establish co-occurrence, not requirement: no cited study
      tests whether ccRCC can form without a chromatin-modifier hit. The report
      also blurs somatic ccRCC genomics with VHL disease, where inherited tumors
      are reported to carry fewer alterations than sporadic ones. Curate this as
      a cooperating step, not as a necessary condition.
    citations:
      - PMID:36253570
      - PMID:39965361
      - PMID:41915349
      - PMID:37405915
  - claim_id: crystal-structure-oxygen-sensing
    statement: >-
      The VCB-hydroxyproline crystal structure defines a single conserved
      binding pocket in pVHL that discriminates hydroxylated from unmodified
      prolyl residues, giving the model its structural foundation.
    disposition: RETAINED
    report_quote: >-
      The crystal structure of hydroxylated HIF-1α peptide bound to the VCB
      complex (pVHL, elongins C and B) reveals a single conserved
      hydroxyproline-binding pocket in pVHL that confers precise discrimination
      between hydroxylated and unmodified prolyl residues through optimized
      hydrogen bonding
    rationale: >-
      Accurate to the cited structure paper, which describes a single conserved
      hydroxyproline-binding pocket and optimized hydrogen bonding conferring
      precise discrimination. The one editorial addition is the report's claim
      that this explains how beta-domain mutations disrupt HIF recognition while
      preserving other pVHL functions, which the structure paper does not test.
    citations:
      - PMID:12050673
  - claim_id: gwas-epas1-sporadic-rcc
    statement: >-
      Common variation at the EPAS1 locus on 2p21 is associated with sporadic
      RCC susceptibility, linking the hereditary VHL/HIF axis to population-level
      risk.
    disposition: RETAINED
    report_quote: >-
      GWAS of 3,772 RCC cases and 8,505 controls identified variants on 2p21
      mapping to EPAS1 (encoding HIF-2α) as associated with RCC susceptibility
    rationale: >-
      Sample sizes and both p-values (rs11894252 at 1.8e-8 and rs7579899 at
      2.3e-9) match the cited GWAS exactly. The report's framing as
      "triangulation" for the HIF-2 mechanism is fair, with the standard caveat
      that a GWAS locus identifies an association region rather than a causal
      variant or a mechanism.
    citations:
      - PMID:21131975
      - PMID:22113997
  - claim_id: jak1-stat3-epas1-enhancer-circuit
    statement: >-
      A SOCS3/JAK1/STAT3 circuit drives EPAS1 transcription through distal
      enhancers, amplifying HIF-2alpha independently of post-translational
      stabilization and offering a route to belzutifan resistance.
    disposition: RETAINED
    report_quote: >-
      Loss of SOCS3 activates JAK1/STAT3 signaling, recruiting STAT3 to distal
      EPAS1 enhancers that physically loop to the promoter to drive HIF-2α
      transcription
    rationale: >-
      Confirmed verbatim against the cited genome-wide CRISPR screen, which
      identifies SOCS3 as the top negative regulator of HIF-2alpha, traces the
      effect to JAK1 rather than JAK2, shows STAT3 occupancy at an enhancer
      roughly 20 kb upstream of the EPAS1 promoter, and validates the circuit by
      CRISPR interference. The resistance framing is the authors' own proposal,
      supported by RCC10 cells that resist HIF-2alpha antagonists yet remain
      ruxolitinib-sensitive; it has not been tested in patients on belzutifan.
      This is genuinely new material relative to the disorder entry.
    citations:
      - PMID:41874563
  - claim_id: hemangioblastoma-stromal-epo-vegf
    statement: >-
      Hemangioblastoma stromal cells co-express EPO and VEGF as direct HIF
      targets, localizing the pseudohypoxic transcriptional output to the
      neoplastic cell.
    disposition: RETAINED
    report_quote: >-
      **Hemangioblastoma stromal cells co-express EPO and VEGF** as direct HIF
      targets, with in situ hybridization localizing both to neoplastic stromal
      cells specifically in all 11 hemangioblastoma specimens
    rationale: >-
      Accurate to the cited study, which found Epo mRNA in all 11
      hemangioblastomas and in none of four glioblastomas, VEGF mRNA in both, and
      used in situ hybridization to assign both transcripts to neoplastic stromal
      cells. The specimen count and the cell assignment are both correct. This
      grounds the erythropoietin arm of the seed hypothesis, which the disorder
      entry asserted without any citation.
    citations:
      - PMID:9787178
  - claim_id: chuvash-hif-without-tumors
    statement: >-
      Chuvash polycythemia (homozygous VHL R200W) raises HIF-1 and HIF-2 at
      normoxia and causes erythrocytosis and pulmonary hypertension, yet
      patients do not develop VHL-associated tumors.
    disposition: QUALIFIED
    report_quote: >-
      Chuvash polycythemia, caused by homozygous VHL R200W mutation, results in
      elevated HIF-1 and HIF-2 levels at normoxia causing erythrocytosis and
      pulmonary hypertension ([PMID: 23015148](https://pubmed.ncbi.nlm.nih.gov/23015148/)),
      but critically, patients do not develop VHL-associated tumors.
    rationale: >-
      The citation is carrying more than it can. PMID:23015148 is a study of
      glucose and HbA1c in Chuvash polycythemia; its abstract does support
      impaired HIF-1 and HIF-2 alpha degradation with augmented hypoxic
      responses during normoxia, but it never mentions pulmonary hypertension
      and never states that these patients escape tumor predisposition. The
      pulmonary hypertension phenotype belongs to PMID:33512384, which the
      report cites one sentence later for a different point. The
      no-tumor-predisposition assertion, which is the whole reason the paragraph
      exists, is uncited. The underlying observation is well known and probably
      true, but the report has not sourced it, so it should not be curated on
      this citation.
    citations:
      - PMID:23015148
      - PMID:33512384
  - claim_id: tbk1-non-hif-vulnerability
    statement: >-
      VHL-deficient ccRCC has a TBK1 dependency that constitutes a non-HIF
      therapeutic vulnerability, supported by in vitro evidence.
    disposition: QUALIFIED
    report_quote: >-
      VHL-deficient ccRCC exhibits TBK1 dependency, and targeted TBK1
      degradation represents a therapeutic strategy outside of HIF-2α inhibition
    rationale: >-
      The sentence is quotable from the cited item, but PMID:41997114 is a Cell
      Chemical Biology preview whose own text says "In this issue of Cell
      Chemical Biology, Liao et al. describe a second-generation
      cereblon-recruiting TBK1 proteolytic targeting chimera". It is a
      commentary, not the experiment. The evidence matrix nonetheless grades it
      as in vitro primary evidence, and the primary study it previews is never
      cited. The claim may well be right; the report has cited the wrong
      document for it.
    citations:
      - PMID:41997114
  - claim_id: uncited-penetrance-and-biallelic-rates
    statement: >-
      VHL germline loss-of-function is causal with roughly 95 percent penetrance
      by age 60, and 86 to 89 percent of ccRCC shows biallelic VHL
      inactivation.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Mendelian genetics establishing VHL germline loss-of-function as causal
      with ~95% penetrance by age 60
    rationale: >-
      These are the two load-bearing quantitative anchors of the Executive
      Judgment and of the causal-chain diagram, and neither carries a citation
      anywhere in the report. Both fall in the range usually quoted for VHL, so
      this is not an implausibility flag, but a number with no source cannot be
      promoted into the disorder entry. The existing entry says penetrance is
      "nearly complete by age 65" with its own sourcing, and I left that alone.
  - claim_id: candidate-ontology-terms
    statement: >-
      The proposed cell-type and biological-process CURIEs are usable curation
      leads as written.
    disposition: QUALIFIED
    report_quote: >-
      - **Biological processes:** GO:0001666 (response to hypoxia), GO:0061418
      (regulation of transcription in response to hypoxia), GO:0071456
      (cellular response to hypoxia)
    rationale: >-
      GO:0001666 and GO:0071456 are correct, cached in this repository, and
      already bound in the disorder entry, so they add nothing. GO:0061418 is
      absent from both the label cache and the biological-process enum cache
      here, so it cannot be validated offline and I did not bind it. The
      proposed cell-type CURIE CL:0002306 resolves, but its canonical label is
      "epithelial cell of proximal tubule", not the report's "renal proximal
      tubular epithelial cell"; the label would have to be corrected before use.
      The other two proposed cell types (hemangioblastoma stromal cell, PAX2+
      cerebellar basket/stellate progenitor) are offered without CURIEs and
      would need real terms.
  - claim_id: unresolved-figure-artifacts
    statement: >-
      The report delivers artifact-friendly outputs including an evidence
      matrix, a mechanistic diagram, and a knowledge-gap table.
    disposition: REJECTED
    report_quote: >-
      {{figure:knowledge_gaps.png|caption=Knowledge gaps mapped by importance
      (y-axis) vs. tractability (x-axis), highlighting tissue specificity and
      type 2C mechanism as highest-priority unknowns}}
    rationale: >-
      Four figure placeholders survive unrendered in the committed report, and
      the hypothesis directory holds no openscientist_artifacts/ bundle, so none
      of the referenced PNGs exists. The evidence matrix and knowledge-gap table
      do exist as inline Markdown and are usable; the figures do not exist in
      any form and their plotted values cannot be inspected.

analyses:
  - analysis_id: mac1-bfactor-coupling-analysis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Claimed comparison of crystallographic B-factors between apo (7KQO) and
      ADP-ribose-bound (7KQP) SARS-CoV-2 Mac1, reporting a global mean change
      of +2.27 square angstroms and a mean change of +8.27 square angstroms
      over residues 155-169, described as 3.6-fold the global average and
      interpreted as conformational coupling to the active site.
    comparison: Apo versus ADP-ribose-bound Mac1, per-residue and by region.
    input_data_source_ids:
      - rcsb-pdb-7kqo-7kqp
    status_reason: >-
      No code, no environment specification, no per-residue table, and no
      figure file are committed; only the two summary numbers and a figure
      caption survive in prose. B-factors also confound thermal motion,
      occupancy, refinement protocol and crystal packing, and the two entries
      are separate refinements, so a raw difference in mean B is not by itself
      evidence of allosteric communication even if the arithmetic is right.
    limitations: >-
      The interpretive step that residues 155-169 sit at the topological
      equivalent of the PARP14 MD2 allosteric pocket rests on the misidentified
      PDB 5RSE and could not be checked.
  - analysis_id: evidence-matrix-and-tiering
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual construction of an 18-row evidence matrix assigning each item an
      evidence type, a direction relative to the seed hypothesis, a mechanistic
      claim, a disease context and a confidence grade, plus a three-tier
      ESTABLISHED / EMERGING / SPECULATIVE summary of the hypothesis
      sub-claims.
    comparison: Each retrieved paper against the seed hypothesis.
    input_data_source_ids:
      - report-literature-corpus
    status_reason: >-
      No grading rubric, intermediate table, or code is committed, and two
      matrix rows are not papers at all but the report's own literature-absence
      and B-factor findings entered as evidence rows. The tiering is provider
      judgment recorded as prose.
  - analysis_id: viral-macrodomain-allosteric-site-absence-search
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Literature search intended to establish that no allosteric site has been
      characterized on any viral macrodomain, entered into the evidence matrix
      as rows 16 and 17 with "High confidence in absence".
    input_data_source_ids:
      - pubmed-viral-macrodomain-allostery-negative-search
    status_reason: >-
      Recorded as an analysis because the report treats the absence as a
      graded evidence item. Without a committed query and result log it cannot
      be replayed. I reached the same conclusion independently from the cited
      papers, so the finding is retained on its merits rather than on the
      strength of this run.
claims:
  - claim_id: overall-verdict-partially-supported
    statement: >-
      The Mac1 allosteric conformational pivot model is partially supported and
      should remain at EMERGING status.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED — Retain EMERGING status with upgraded confidence"
    rationale: >-
      Concordant with the curated status and with my own reading. The
      conceptual foundation (conformational dynamics matter beyond catalysis)
      is well supported; the two therapeutic modalities the hypothesis names
      remain without any direct evidence. No status change made.
    citations:
      - PMID:38260573
      - PMID:36598939
      - PMID:28991428
  - claim_id: conformational-dynamics-beyond-catalysis
    statement: >-
      A GIF-motif isoleucine-to-alanine substitution that increases ADP-ribose
      binding without impairing catalysis still attenuates MERS-CoV and
      SARS-CoV-2, so Mac1's conformational landscape rather than its enzymatic
      output alone determines viral fitness.
    disposition: RETAINED
    report_quote: >-
      Mutation of a conserved isoleucine in the GIF motif (I→A) enhances
      ADP-ribose binding without impairing catalytic activity, yet I-A mutant
      MERS-CoV and SARS-CoV-2 are highly attenuated in both cell culture and
      mice.
    rationale: >-
      Verified against the cached abstract of PMID:38260573, which states the
      attenuation and the gating interpretation directly. This is the strongest
      support for the pivot framing and is already curated on the hypothesis
      entry as MODEL_ORGANISM evidence; no change needed.
    citations:
      - PMID:38260573
  - claim_id: parp14-md2-allosteric-precedent-anchored-to-wrong-pdb
    statement: >-
      The GeA-69 co-crystal establishing the PARP14 macrodomain 2 allosteric
      site is PDB 5RSE, determined at 1.0 angstrom resolution.
    disposition: REJECTED
    report_quote: >-
      Co-crystallization at 1.0 Å resolution (PDB: 5RSE) revealed the allosteric
      binding site involves residues topologically adjacent to but distinct from
      the ADP-ribose binding site.
    rationale: >-
      PDB 5RSE is a SARS-CoV-2 NSP3 macrodomain fragment complex from the
      XChem/PanDDA group deposition (deposited 2020-09-28, released
      2020-12-16, 1.0 A), confirmed via the RCSB REST API. It is neither a
      PARP14 structure nor contemporaneous with Schuller et al. 2017, and the
      quoted resolution is 5RSE's own. The scientific claim that GeA-69 is a
      selective allosteric PARP14 MD2 inhibitor is separately true
      (PMID:28991428, PMID:29567296) and is already curated; only the
      structural identifier and the topological-equivalence argument built on
      it are rejected.
    citations:
      - PMID:28991428
      - PMID:29567296
  - claim_id: bfactor-coupling-identifies-candidate-allosteric-region
    statement: >-
      Mac1 residues 155-169 show 3.6-fold the global mean B-factor change on
      ADP-ribose binding, marking a candidate allosteric communication pathway
      at the position equivalent to the PARP14 MD2 allosteric pocket.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      The C-terminal region (residues 155–169) showed a mean ΔB of +8.27 Å²,
      representing 3.6-fold the global average.
    rationale: >-
      A provider computation with no committed code, environment, per-residue
      table, or figure. The inputs 7KQO and 7KQP are correctly identified, but
      a difference in refined B-factors between two independent structures
      confounds thermal motion with occupancy, resolution and refinement
      protocol, and the topological-equivalence step depends on the rejected
      5RSE attribution. Not integrated into the disease entry.
    analysis_ids:
      - mac1-bfactor-coupling-analysis
  - claim_id: no-allosteric-site-or-protac-for-viral-mac1
    statement: >-
      No allosteric site has been experimentally characterized on any viral
      macrodomain, and no Mac1-directed PROTAC has been designed, synthesized,
      or tested.
    disposition: RETAINED
    report_quote: >-
      (1) no allosteric site has been identified or characterized on any viral
      macrodomain; (2) no PROTAC targeting a domain within a large viral
      polyprotein has been demonstrated
    rationale: >-
      Consistent with everything I could find in the cited literature: the only
      validated macrodomain allosteric ligand series remains GeA-69 against
      human PARP14 MD2, and every published SARS-CoV-2 degrader targets a
      standalone protein rather than a domain inside nsp3. This is the load
      bearing negative finding for the hypothesis and it is already the subject
      of the curated knowledge-gap discussion; I extended that discussion's
      rationale to state both absences explicitly rather than leaving them
      implied.
    citations:
      - PMID:28991428
      - PMID:36598939
  - claim_id: active-site-inhibition-has-in-vivo-proof-of-concept
    statement: >-
      An active-site Mac1 inhibitor, AVI-4206, reduces viral replication,
      potentiates innate immune responses, and confers a survival benefit in an
      animal model of severe SARS-CoV-2 infection.
    disposition: RETAINED
    report_quote: >-
      AVI-4206 has antiviral activity in human airway organoids, macrophages,
      and in vivo
    rationale: >-
      Verified against the cached abstract of PMID:41258893, which reports the
      survival benefit in vivo and the stronger effect in airway organoids and
      monocyte-derived macrophages. This is genuinely new to the entry and it
      cuts against the seed hypothesis's premise that active-site inhibition
      alone "may not achieve" therapeutic effect, so I added it to the
      hypothesis as REFUTE-direction evidence.
    citations:
      - PMID:41258893
  - claim_id: three-independent-groups-showed-antiviral-activity
    statement: >-
      Three independent groups have demonstrated that Mac1 active-site
      inhibitors achieve antiviral activity in immune-competent systems.
    disposition: REJECTED
    report_quote: >-
      However, three independent groups subsequently demonstrated that Mac1
      active-site inhibitors *can* achieve antiviral activity
    rationale: >-
      The count does not survive checking. PMID:41820535 (Knapp et al.) is a
      cell-based PARP15 nuclear-foci screening assay in U2OS cells for
      monitoring macrodomain hydrolase activity; its abstract reports no
      antiviral experiment at all. PMID:39554145 and PMID:40407321 are the
      bioRxiv preprint and the mBio version of one Pfannenstiel study, not two
      groups. That leaves two independent demonstrations, Suryawanshi and
      Pfannenstiel. The weaker claim, that active-site inhibition can achieve
      antiviral activity in interferon-competent settings, does hold.
    citations:
      - PMID:41258893
      - PMID:40407321
      - PMID:41820535
  - claim_id: lee-null-result-is-a-resolved-outlier
    statement: >-
      The Lee et al. failure to see antiviral activity from potent Mac1
      inhibitors is best interpreted as an outlier reflecting compound- or
      model-specific differences.
    disposition: QUALIFIED
    report_quote: >-
      Lee et al. is now best interpreted as an outlier reflecting
      compound-specific or model-specific differences rather than a fundamental
      flaw in Mac1 targeting.
    rationale: >-
      The underlying data are real and correctly quoted from PMID:39229055,
      including the negative result under interferon-gamma co-treatment. The
      "resolved outlier" reading is provider inference, and the report
      contradicts it four sections later by listing the same discrepancy as
      open Gap 6 pending a head-to-head comparison. I curated the primary
      result, which supports the hypothesis's premise that active-site
      inhibition alone may be insufficient, without importing the outlier
      framing.
    citations:
      - PMID:39229055
      - PMID:41258893
  - claim_id: no-resistance-data-exist-for-mac1-inhibitors
    statement: >-
      No serial-passage resistance study has been performed with any Mac1
      inhibitor, so the hypothesis's resistance-advantage claim is untestable
      against current data.
    disposition: REJECTED
    report_quote: >-
      No serial passage experiments with Mac1 inhibitors have been published
    rationale: >-
      Contradicted by a paper the report itself cites two sections earlier.
      PMID:40407321 passaged MHV under compound 5a, identified an
      alanine-to-threonine plus glycine-to-valine double mutation in Mac1,
      confirmed the resistant recombinant replicates better under drug, and
      showed that the resistant virus is highly attenuated in vivo. Resistance
      data for active-site Mac1 inhibitors therefore exist, and they suggest
      escape carries a fitness cost. The narrower true statement is that no
      resistance data exist for an allosteric Mac1 compound, because no such
      compound exists.
    citations:
      - PMID:40407321
      - PMID:39554145
  - claim_id: mac1-interactome-extends-beyond-interferon-signaling
    statement: >-
      Mac1 engages ADP-ribosylated host proteins in DNA damage response,
      cytoskeletal, cell-cycle and TRiC chaperonin pathways, so its role is
      broader than interferon antagonism.
    disposition: QUALIFIED
    report_quote: >-
      identified Mac1 substrates involved in DNA damage response, cytoskeletal
      components, cell cycle regulation, and the TRiC protein-folding complex
    rationale: >-
      The interactor categories are correctly quoted from PMID:41279050, but
      the report overstates them in two ways. The experiment transfects an
      isolated Strep-tagged Mac1 domain into HEK293T and A549 cells and
      compares wild type against the catalytically dead N40D mutant; it is not
      an infection, so the report's Evidence Matrix context "SARS-CoV-2 in A549
      cells" is wrong. And the paper calls these putative clients requiring
      functional validation, not established substrates. I curated it with
      that hedging preserved.
    citations:
      - PMID:41279050
  - claim_id: mac1-stabilizes-nsp3-supporting-protac-rationale
    statement: >-
      Mac1 contributes to nsp3 protein stability through an interplay with
      PLP2, and destabilizing mutations enhance proteasome-mediated degradation
      of the macrodomain-PLP2 region, providing indirect support for a
      degradation-based strategy.
    disposition: QUALIFIED
    report_quote: >-
      The Deng et al. finding that Mac1 temperature-sensitive mutations enhance
      proteasome-mediated nsp3 degradation
    rationale: >-
      Verified against PMID:30918076, which reports the coimmunoprecipitation
      evidence for a macrodomain-PLP2 interaction and the enhanced proteasomal
      degradation of the expressed macrodomain-PLP2 fragment. Two
      qualifications the report soft-pedals: the work is entirely in mouse
      hepatitis virus, and the construct is a macrodomain-PLP2 fragment rather
      than full-length nsp3. Curated with the species and construct stated.
    citations:
      - PMID:30918076
  - claim_id: binding-and-hydrolysis-are-separable-mac1-functions
    statement: >-
      ADP-ribose binding and hydrolysis are separable Mac1 activities that
      promote different stages of the coronavirus life cycle, with the
      binding-defective mutant impairing viral RNA accumulation in all cell
      types and the hydrolysis-defective mutant reducing viral protein only in
      interferon-competent macrophages.
    disposition: RETAINED
    report_quote: >-
      D1329A (adenine-binding defect) impairs viral RNA accumulation across all
      cell types, while N1347A (hydrolysis defect) allows normal RNA levels but
      reduces protein production specifically in IFN-competent macrophages.
    rationale: >-
      Matches the cached abstract of PMID:40736256 almost word for word. This
      is the cleanest genetic evidence that Mac1 is not a single-activity
      enzyme, which is the substantive core of the "pivot" framing, and it was
      absent from the entry. Added, with the mouse hepatitis virus JHM context
      stated.
    citations:
      - PMID:40736256
  - claim_id: interferon-competence-gates-any-mac1-directed-therapy
    statement: >-
      Because Mac1 inhibition works by restoring host innate immunity, patients
      with inborn errors of type I interferon immunity or anti-interferon
      autoantibodies, who together account for roughly 20 percent of critical
      COVID-19, are the least likely to benefit from any Mac1-directed
      strategy.
    disposition: RETAINED
    report_quote: >-
      15–20% of critical COVID-19 patients over 70 have autoantibodies against
      type I IFN
    rationale: >-
      The epidemiological premise is verified against PMID:37196358, which
      reports inborn errors of type I interferon immunity in 1-5 percent of
      unvaccinated patients with critical pneumonia and autoantibodies in
      another 15-20 percent. The mechanistic inference is supported
      independently: AVI-4206's cellular activity is interferon-gamma and
      catalysis dependent (PMID:41258893), and the pyrrolo-pyrimidine series
      inhibits SARS-CoV-2 only in the presence of interferon-gamma
      (PMID:40407321). This is a real constraint the entry did not carry, so I
      added it as a knowledge-gap discussion rather than as a bare assertion,
      because whether efficacy is actually lost in these patients has not been
      tested.
    citations:
      - PMID:37196358
      - PMID:41258893
      - PMID:40407321
  - claim_id: cache3-is-a-starting-point-for-conformational-pivot-chemistry
    statement: >-
      The third CACHE community challenge supplies chemistry suitable as a
      starting point for conformational-pivot approaches to Mac1.
    disposition: QUALIFIED
    report_quote: >-
      CACHE Challenge #3 — community-wide hit-finding
    rationale: >-
      CACHE #3 does demonstrate tractability, which is all the report claims for
      it. But the seed hypothesis, and the curated description copied from it,
      go further and call it "a strong starting point for conformational-pivot
      chemistry". The primary CACHE #3 report (PMID:41565251) says the opposite
      about chemotype: the best confirmed hits were structurally similar to
      previously published compounds and largely mimicked the adenine ring of
      ADP-ribose, preserving the canonical orthosteric chemotype. Twenty-three
      groups screening 1739 candidates produced no allosteric series. I added
      the CACHE #3 paper to the hypothesis as REFUTE-direction evidence against
      that specific sub-claim.
    citations:
      - PMID:41565251
      - PMID:40964377
  - claim_id: mac1-is-a-genetically-validated-sars-cov-2-virulence-factor
    statement: >-
      Complete deletion of Mac1 leaves SARS-CoV-2 replication near wild-type in
      cell culture but abolishes pathogenesis in mice, with increased
      interferon and interferon-stimulated gene induction.
    disposition: RETAINED
    report_quote: >-
      SARS-CoV-2 ΔMac1 replicates at near-wild-type levels in multiple cell
      lines but is rapidly cleared in mice with minimal pathology and no
      morbidity
    rationale: >-
      Verified against PMID:37607224, which reports exactly this dissociation
      plus the interferon and interferon-stimulated gene induction and the drop
      in inflammatory monocytes and neutrophils. The curated entry asserted
      Mac1 essentiality for pathogenesis from a review-level snippet; this is
      the direct SARS-CoV-2 reverse-genetics evidence for it and was missing.
      Added to the macrodomain countermeasure pathophysiology node.
    citations:
      - PMID:37607224

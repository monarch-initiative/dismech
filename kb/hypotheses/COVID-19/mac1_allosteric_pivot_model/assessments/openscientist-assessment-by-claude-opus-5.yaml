source_report: ../openscientist.md
hypothesis_id: mac1_allosteric_pivot_model
assessed_at: "2026-09-02T09:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is unusually productive on literature discovery and unusually
  careless on structural provenance. Ten of its candidate references are real,
  correctly attributed, and absent from the curated entry; I verified each
  against the reference cache before promoting any of them.

  Its single most consequential error is a misattributed PDB identifier.
  Finding 5 and Evidence Matrix row 2 both anchor the "validated allosteric
  precedent" argument to "PDB: 5RSE" as the GeA-69 co-crystal with PARP14
  macrodomain 2 from Schuller et al. 2017. PDB 5RSE is a SARS-CoV-2 NSP3
  macrodomain fragment complex from the XChem/PanDDA campaign, deposited
  2020-09-28 and released 2020-12-16 at 1.0 A resolution. A 2017 paper cannot
  cite a 2020 deposition, and the report's stated resolution matches 5RSE
  exactly, so the resolution figure was read off the wrong entry. The
  downstream B-factor argument, which asserts that Mac1 residues 155-169 sit at
  "the topological equivalent of the PARP14 MD2 allosteric pocket", is built on
  that misidentification and cannot be checked. The underlying claim that
  GeA-69 is a selective allosteric PARP14 MD2 inhibitor is nevertheless true
  and is already curated in the entry from PMID:28991428, so the precedent
  survives while the structural coordinates supporting it do not.

  Two of the report's own knowledge gaps are contradicted by papers it cites.
  Gap 5 states that no serial-passage resistance experiment with a Mac1
  inhibitor has been published; PMID:40407321 (which the report cites in
  Finding 2) passaged MHV under compound 5a, recovered a Mac1 double mutant,
  and showed the resistant virus is attenuated in mice. Finding 2's count of
  "three independent groups" demonstrating antiviral activity also does not
  hold: PMID:41820535 is a PARP15-foci screening assay in U2OS cells with no
  antiviral readout, and PMID:39554145 and PMID:40407321 are the preprint and
  journal versions of one study.

  Substantively I retain the central thesis. Mac1 conformational dynamics
  matter beyond catalysis, the domain has several separable functions, and its
  interactome is broader than interferon antagonism. What the report shows
  clearly, and what the curated entry did not previously say, is that
  active-site inhibition now has in vivo pharmacological proof of concept
  (PMID:41258893), that the CACHE #3 winning chemistry converged on canonical
  adenine-mimetic orthosteric ligands rather than on anything conformationally
  selective (PMID:41565251), and that any Mac1-directed strategy is gated on
  host type I interferon competence (PMID:37196358). Those three findings
  narrow rather than widen the hypothesis, and I integrated all of them.
  Status stays EMERGING, as the report itself recommends.

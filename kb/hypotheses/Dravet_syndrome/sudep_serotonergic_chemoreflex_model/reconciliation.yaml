      relevant to the target disease.
    claim_origin: PROVIDER_DISCOVERY
    rationale: >-
      The raw report asserts the claim, but its independent assessment rejects the
      Dravet-specific inference after reading the underlying abstract.
  citations:
  - PMID:29608654

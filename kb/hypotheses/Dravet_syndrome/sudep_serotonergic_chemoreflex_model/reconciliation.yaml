  citations:
  - PMID:31301453
- claim_id: autoresuscitation_competing_locus
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    Fluoxetine and respiratory-stimulant experiments motivate an autoresuscitation
    or network-level alternative to HCVR gain but do not exclude chemoreflex-gain
    restoration.
  disposition: QUALIFIED
  rationale: >-
    The studies dissociate protection from increased basal ventilation. Basal
    ventilation is not HCVR slope, so a stronger mechanistic exclusion is not licensed.
  provider_support:
  - provider: biomni
    stance: CONCORDANT
    assessment_claim_ids:
    - autoresuscitation_competing_locus
    report_quote: >-
      Fluoxetine blocked S-IRA without increasing basal ventilation; breathing
      stimulants that raise baseline ventilation failed to protect in this paradigm.
    claim_origin: PRIOR_PROVIDER_DERIVED
    derived_from_provider: openscientist
    rationale: >-
      Biomni inherited this caveat but correctly states that basal ventilation is
      not HCVR slope.
  - provider: openscientist
    stance: PARTIAL
    assessment_claim_ids:
    - autoresuscitation_not_chemoreflex_gain
    report_quote: >-
      This argues the serotonergic benefit works through
      **network/autoresuscitation mechanisms rather than a simple increase in
      chemoreflex-driven ventilation** — a direct challenge to the seed's "restore
      chemoreflex gain" framing.
    claim_origin: PROVIDER_DISCOVERY
    rationale: >-
      OpenScientist surfaced the alternative locus but framed it too strongly for
      an experiment measuring basal rather than hypercapnic ventilation.
  citations:
  - PMID:26272185
  - PMID:31056750
- claim_id: dravet_brainstem_serotonergic_deficit
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    PMID:29608654 directly demonstrates a serotonergic brainstem deficit in Dravet
    syndrome.
  disposition: REJECTED
  rationale: >-
    The serotonin-marker deficits occurred in the mixed sudden-death group. The
    seven Dravet cases showed fewer alterations and differed from controls only for
    somatostatin; cohort inclusion is not Dravet-specific positive evidence.
  provider_support:
  - provider: biomni
    stance: SILENT
    rationale: Biomni does not cite or assess this neuropathology study.
  - provider: openscientist
    stance: CONCORDANT
    assessment_claim_ids:

schema_version: '1.0.0'
assessor: codex
hypothesis_id: sudep_serotonergic_chemoreflex_model
reconciled_at: '2026-08-29T00:00:00Z'
providers:
- provider: biomni
  source_assessment: assessments/biomni-assessment-by-codex.yaml
  source_report: biomni.md
  contribution_summary: >-
    Rapid mechanistic restatement and concrete experimental designs, with clear
    acknowledgement that automated retrieval failed.
  limitations: >-
    The lightweight run extracted only the five PMIDs already supplied in its
    seed. That seed had itself been enriched from the earlier OpenScientist
    review, so several apparent agreements are inherited rather than independent.
- provider: openscientist
  source_assessment: assessments/openscientist-assessment-by-claude-opus-5.yaml
  source_report: openscientist.md
  contribution_summary: >-
    Broad literature discovery, including a 2026 human HCVR surrogate study,
    competing mechanisms, and specific pharmacological qualifications.
  limitations: >-
    One Dravet-specific neuropathology inference was reversed by source review,
    and several conclusions were stated more strongly than their abstracts allow.
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The reconciled evidence supports an emerging mechanistic scaffold but not its
  distinctive human protective edge. Mouse dose separation is real; human
  fenfluramine-mediated HCVR rescue independent of seizure reduction remains
  untested. OpenScientist materially outperformed lightweight Biomni on literature
  discovery, while Biomni usefully exposed the limitations of its own run. Claims
  inherited through Biomni's OpenScientist-enriched seed are recorded as lineage,
  not counted as independent corroboration.
reconciled_claims:
- claim_id: human_fenfluramine_hcvr_keystone
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    Fenfluramine has not been shown to restore human postictal HCVR independently
    of its effect on seizure frequency.
  disposition: RETAINED
  rationale: >-
    This is the defining unresolved edge that separates the hypothesis from the
    canonical seizure-count explanation and justifies keeping it emerging.
  provider_support:
  - provider: biomni
    stance: CONCORDANT
    assessment_claim_ids:
    - human_fenfluramine_hcvr_keystone_gap
    report_quote: >-
      the fenfluramine effect on human postictal HCVR has not been demonstrated
      (trial pending)
    claim_origin: SEED_DERIVED
    rationale: The Biomni seed already stated this absence and the pending trial.
  - provider: openscientist
    stance: CONCORDANT
    assessment_claim_ids:
    - keystone_separability_untested
    report_quote: >-
      The keystone — that **fenfluramine restores the *human* CO₂ chemoreflex
      disproportionately to its anticonvulsant effect** — is untested; NCT07112365
      is the first attempt.
    claim_origin: SEED_DERIVED
    rationale: >-
      OpenScientist verified and emphasized a gap that was already present in its
      seed rather than independently originating it.
  citations:
  - PMID:37160367
  - clinicaltrials:NCT07112365
- claim_id: mouse_dose_separability
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    In DBA/1 mice, a fenfluramine dose prevents seizure-induced respiratory arrest
    without suppressing convulsions, while higher doses reduce seizures.
  disposition: QUALIFIED
  rationale: >-
    This is strong preclinical evidence for pharmacological separability, but the
    measured outcome is respiratory arrest rather than HCVR gain and the result is
    neither human nor Dravet-specific.
  provider_support:
  - provider: biomni
    stance: CONCORDANT
    assessment_claim_ids:
    - fenfluramine_mouse_dose_separation
    report_quote: >-
      15 mg/kg fenfluramine blocked S-IRA without changing convulsive behavior;
      ED50 for seizure reduction was ~21 mg/kg.
    claim_origin: PRIOR_PROVIDER_DERIVED
    derived_from_provider: openscientist
    rationale: >-
      The exact dose dissociation was added to the hypothesis seed after the
      OpenScientist review and then restated by Biomni.
  - provider: openscientist
    stance: CONCORDANT
    assessment_claim_ids:
    - fenfluramine_dose_dissociation_separability
    report_quote: >-
      In primed DBA/1 mice, 15 mg/kg fenfluramine administered 16 h before an
      audiogenic seizure produced **selective block of S-IRA (P < 0.001) without
      blocking any convulsive behavior**; only higher doses (20–40 mg/kg)
      additionally reduced convulsions
    claim_origin: PROVIDER_EXTRACTION
    rationale: >-
      OpenScientist extracted the load-bearing dose-level distinction from a PMID
      already present in its seed, adding a claim beyond what the seed stated.
  citations:
  - PMID:30719703
- claim_id: human_hcvr_surrogate_association
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    In a mixed epilepsy cohort, lower interictal HCVR was associated with greater
    postictal hypercapnia, and prolonged hypercapnia was associated with delayed
    recovery of consciousness; this supports a surrogate arm but not Dravet-specific
    or SUDEP-death prediction.
  disposition: QUALIFIED
  rationale: >-
    The 2026 human study materially strengthens clinical plausibility while leaving
    disease specificity, causal direction, and death-endpoint validation open.
  provider_support:
  - provider: biomni
    stance: PARTIAL
    assessment_claim_ids:
    - human_hcvr_surrogate_coverage_gap
    report_quote: The proposed biomarker (HCVR) remains unproven in clinical cohorts.
    claim_origin: PROVIDER_INFERENCE
    rationale: >-
      Biomni correctly leaves SUDEP prediction unvalidated but, with an October
      2024 cutoff and failed retrieval, misses the newer surrogate association.
  - provider: openscientist
    stance: CONCORDANT
    assessment_claim_ids:
    - interictal_hcvr_predicts_postictal_hypercapnia_and_arousal
    report_quote: >-
      Sainju et al. found that in 149 generalized convulsive seizures from 86 of
      351 monitored patients, **interictal HCVR was negatively associated with
      postictal hypercapnia**, and **prolonged postictal hypercapnia was associated
      with delayed recovery of consciousness**
    claim_origin: PROVIDER_DISCOVERY
    rationale: OpenScientist surfaced the post-cutoff human surrogate study.
  citations:
  - PMID:42501660
- claim_id: sri_postconvulsive_apnea_bound
  claim_kind: SCIENTIFIC_CLAIM
  statement: >-
    Chronic SRI use is associated with less ictal central apnea but no detected
    association with postconvulsive central apnea; this bounds generic serotonergic
    protection but does not refute fenfluramine.
  disposition: QUALIFIED
  rationale: >-
    The observation is retained, but SRI and fenfluramine pharmacology differ and
    a nonsignificant observational association does not prove absence of effect.
  provider_support:
  - provider: biomni
    stance: CONCORDANT
    assessment_claim_ids:
    - sri_postconvulsive_apnea_bound
    report_quote: >-
      SSRIs associated with reduced ictal central apnea but not with
      postconvulsive central apnea (phase highlighted by this model).
    claim_origin: PRIOR_PROVIDER_DERIVED
    derived_from_provider: openscientist
    rationale: This finding entered Biomni through the enriched seed.
  - provider: openscientist
    stance: PARTIAL
    assessment_claim_ids:
    - sri_postconvulsive_apnea_contradiction
    report_quote: >-
      This is a surrogate-level contradiction that currently prevents upgrading
      the model beyond EMERGING.
    claim_origin: PROVIDER_DISCOVERY
    rationale: >-
      OpenScientist discovered the result but overcalled a bound as a

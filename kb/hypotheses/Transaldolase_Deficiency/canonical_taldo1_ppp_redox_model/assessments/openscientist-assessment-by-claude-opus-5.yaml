claims:
- claim_id: canonical-ppp-redox-core-chain
  statement: >-
    Biallelic TALDO1 loss blocks the nonoxidative pentose phosphate pathway,
    trapping carbon as sedoheptulose 7-phosphate, depleting glucose
    6-phosphate, NADPH and glutathione, and causing mitochondrial dysfunction
    and hepatocyte death that progresses to cirrhosis.
  disposition: RETAINED
  report_quote: >-
    is established beyond reasonable doubt by primary experimental data from at
    least five independent research groups
  rationale: >-
    Checked against the cached primary sources. PMID:18498245 reports in
    patient-derived lymphoblasts that sedoheptulose 7-phosphate accumulated
    while glucose 6-phosphate was depleted; PMID:19436114 reports NADPH and
    glutathione depletion with lipid hydroperoxide production in Taldo1-null
    mouse liver; PMID:16470722 reports the matching urinary metabolite profile;
    PMID:15115436 shows the index patient's TALDeltaS171 protein has no enzymic
    activity. The chain holds at every step. This is, however, the seed
    hypothesis restated: the KB entry already carried all four of these
    citations, so the report adds breadth of confirmation rather than new
    support.
  citations:
  - PMID:18498245
  - PMID:19436114
  - PMID:16470722
  - PMID:15115436
- claim_id: nac-rescue-in-taldo1-null-mice
  statement: >-
    Lifelong N-acetylcysteine prevents acetaminophen-induced liver failure and
    blocks hepatocarcinogenesis in Taldo1-null mice, establishing oxidative
    stress as a causal driver rather than a correlate.
  disposition: RETAINED
  report_quote: >-
    lifelong administration of the potent antioxidant N-acetylcysteine (NAC)
    prevented acetaminophen-induced liver failure, restored Fas-dependent
    hepatocyte apoptosis, and blocked hepatocarcinogenesis in Taldo1-/- mice
  rationale: >-
    Verbatim in the PMID:19436114 abstract and correctly attributed. This is
    the single strongest causal test in the whole hypothesis, because it is an
    intervention rather than an observation, and the same laboratory's
    PMID:17003133 reproduces the rescue in a non-hepatic tissue by normalizing
    male fertility. Already carried by the KB entry.
  citations:
  - PMID:19436114
  - PMID:17003133
- claim_id: nac-human-translational-proof
  statement: >-
    Successful N-acetylcysteine treatment of four transaldolase-haploinsufficient
    patients with acetaminophen-induced liver failure provides human proof of
    principle for the redox model.
  disposition: QUALIFIED
  report_quote: >-
    The human translational data, while limited to four patients with
    haploinsufficiency rather than complete deficiency, provides crucial proof
    of principle.
  rationale: >-
    The underlying observation is accurate; PMID:31769880 states that all four
    patients with TAL haplo-insufficiency and acetaminophen-induced liver
    failure were successfully treated with NAC. Calling it proof of principle
    for the TAL redox mechanism overreads it. N-acetylcysteine is the standard
    antidote for acetaminophen hepatotoxicity in any patient regardless of
    TALDO1 genotype, there was no comparator arm, and the paper reports
    treatment success rather than a genotype-specific response. The report
    already flags the haploinsufficiency-versus-complete-deficiency limitation
    but not this confound, which is the larger one. The KB entry's own
    explanation of this item said the patients recovered fully and that the
    mouse rescue generalizes; neither is what the source says, and that prose
    was corrected during integration.
  citations:
  - PMID:31769880
- claim_id: ar-rheostat-hcc-dependency
  statement: >-
    Aldose reductase acts as a rheostat whose polyol-generating, NADPH-consuming
    activity is required for progression from cirrhosis to hepatocellular
    carcinoma, while simultaneously protecting against carbon trapping and
    growth restriction.
  disposition: QUALIFIED
  report_quote: >-
    AR inactivation in TAL-deficient mice blocked HCC susceptibility but
    enhanced growth restriction, carbon trapping in the nonoxidative PPP, and
    failed to reverse G6P depletion or liver cirrhosis.
  rationale: >-
    Faithful to PMID:36658399, whose abstract states that progression from
    cirrhosis to HCC and acetaminophen-induced liver necrosis are critically
    dependent on NADPH depletion and polyol buildup by aldose reductase while
    that enzyme protects from carbon trapping. The qualification is that this
    is genetic epistasis in compound-knockout mice from one laboratory. No
    human patient has been AKR1B1-genotyped against hepatocellular-carcinoma
    outcome, and the report's own Discriminating Test 1 concedes this. Polyol
    accumulation itself is human-established from urinary metabolites; the
    AR-dependence of the carcinoma step is not.
  citations:
  - PMID:36658399
- claim_id: mtor-pon1-apl-autoimmune-cirrhosis
  statement: >-
    An mTOR-dependent axis causing loss of paraoxonase 1 secretion and
    antiphospholipid autoantibody production drives cirrhosis independently of
    direct oxidative hepatocyte death when aldose reductase is absent.
  disposition: QUALIFIED
  report_quote: >-
    may independently drive cirrhosis through autoimmune mechanisms when AR is
    absent
  rationale: >-
    PMID:37742509 supports the mechanism in TAL/AR double-knockout mice and
    identifies PON1 glycosylation and antiphospholipid antibody production as
    mTOR-dependent checkpoints, rapamycin-responsive in vivo. Two limits the
    report states correctly and one it does not. It states that this is a
    single mouse study and that human relevance is unknown. It does not note
    that the paper frames the axis as underlying cirrhosis in transaldolase
    deficiency generally rather than only in the AR-null condition, so the
    report's conditional phrasing is a narrowing of the source, not an
    overstatement. Integrated as a HUMAN_MODEL_MISMATCH discussion rather than
    as a pathophysiology node, because no patient PON1 activity or
    antiphospholipid titre has ever been measured.
  citations:
  - PMID:37742509
  - PMID:32506314
- claim_id: erythronic-acid-unknown-pathway
  statement: >-
    Erythronic acid accumulates in all transaldolase-deficient patients and in
    knockout mice through a biochemical pathway that is completely unknown, so
    the canonical model is incomplete.
  disposition: QUALIFIED
  report_quote: >-
    The biosynthetic source and pathogenic significance of erythronic acid in
    TAL deficiency are completely unknown.
  rationale: >-
    The accumulation is real and consistently reported: PMID:20600873 states
    that erythronic acid was identified as a major abnormal metabolite in all
    patients and in knockout TALDO mice, implicating an as yet unknown
    biochemical pathway. Completely unknown overstates the source, which in the
    same abstract says a putative sequence of enzymatic reactions leading to the
    formation of erythronic acid is presented. The honest gap is that the
    proposed route is unvalidated and the metabolite's pathogenic significance
    untested, not that no candidate exists. The report also cites the same
    paper for a species difference, elevated urinary 2-oxoglutarate and
    fumarate in patients but not knockout mice, which the abstract does support.
  citations:
  - PMID:20600873
- claim_id: extrahepatic-mechanism-gap
  statement: >-
    No tissue-level study of pentose-phosphate flux, NADPH, or oxidative stress
    exists in kidney, heart, or skin of any transaldolase-deficient model, so
    the extra-hepatic arm of the hypothesis is inferred rather than tested.
  disposition: RETAINED
  report_quote: >-
    No primary studies of PPP flux, NADPH levels, or oxidative stress in renal,
    cardiac, or dermal tissues of TAL-deficient models were found.
  rationale: >-
    This is the report's most consequential finding for the KB, because the
    seed hypothesis explicitly claims that toxic metabolite accumulation
    contributes to renal, cardiac, skin, hematologic, and fetal manifestations.
    The extra-hepatic literature is clinical description only: PMID:22510381
    characterizes the renal phenotype without measuring anything mechanistic,
    and PMID:24497183 attributes tubulopathy to a toxic effect of sugars, sugar
    phosphates and polyols on the proximal tubules as an inference, not a
    measurement. The one non-hepatic mechanism that has been tested is
    spermatozoal, in PMID:17003133. Stated as absence of evidence the search
    actually checked for, which is the standard the template asks for.
  citations:
  - PMID:22510381
  - PMID:24497183
  - PMID:17003133
- claim_id: renal-involvement-seven-of-nine
  statement: >-
    Nephrological abnormality, chiefly low-molecular-weight proteinuria and
    hypercalciuria, is present in seven of the nine transaldolase-deficient
    patients studied systematically, and may progress to chronic renal failure.
  disposition: RETAINED
  report_quote: >-
    Nephrological abnormalities were documented in 7 of 9 patients studied
    systematically
  rationale: >-
    Exactly what PMID:22510381 reports: nephrological abnormalities in seven of
    nine patients, most commonly low-molecular-weight proteinuria and
    hypercalciuria, with the two oldest patients in moderate chronic kidney
    failure and a conclusion that monitoring of kidney function is mandatory.
    Seven of nine is consistent with the Orphanet Frequent band already curated.
    This citation was absent from the KB entry and was added.
  citations:
  - PMID:22510381
- claim_id: phenotypic-variability-modifiers
  statement: >-
    Four patients homozygous for the same TALDO1 p.R192C allele range from
    hydrops fetalis to mild disease, implicating unidentified modifiers that the
    canonical model does not capture.
  disposition: RETAINED
  report_quote: >-
    This phenotypic variability within identical genotypes strongly implicates
    modifier genes (potentially including AR genotype), epigenetic factors, or
    environmental exposures that are not captured by the canonical model.
  rationale: >-
    The observation is verbatim in PMID:25388407 and already carried by the KB.
    Strongly implicates is the report's inference, not the paper's: the paper
    documents variability and does not test or name any modifier. PMID:41806563
    sharpens the gap independently, reporting three adults diagnosed at 17, 26
    and 32 years whose genotypes did not reveal any variant that would be
    expected to cause a milder disease course, so severity is discordant with
    genotype in the mild direction too. Retained as a knowledge gap, with the
    modifier speculation kept out of the entry's assertional content.
  citations:
  - PMID:25388407
  - PMID:41806563
- claim_id: early-onset-hcc-human-endpoint
  statement: >-
    Hepatocellular carcinoma is a documented early-onset human endpoint of
    transaldolase deficiency, found on explanted liver and including a syncytial
    giant cell variant in an infant.
  disposition: RETAINED
  report_quote: >-
    A syncytial giant cell variant of HCC was identified on explant in an infant
    with TAL deficiency
  rationale: >-
    PMID:34677006 reports four patients with liver disease of whom two had
    early-onset hepatocellular carcinoma, three underwent transplantation, and
    concludes that patients are at risk of early-onset HCC and may require early
    transplantation. PMID:37071763 independently describes the syncytial giant
    cell variant on explant in an infant with transaldolase deficiency,
    expressing EpCAM, alpha-fetoprotein and metallothionein. The KB entry cited
    PMID:34677006 inside the hypothesis block but carried no hepatocellular
    carcinoma phenotype and no pathograph route to it, so the disease's most
    severe hepatic endpoint was invisible in the causal graph. Added.
  citations:
  - PMID:34677006
  - PMID:37071763
- claim_id: liver-transplantation-viability
  statement: >-
    At least eight liver transplantations have been reported in transaldolase
    deficiency with generally favourable short-term outcomes, while the systemic
    enzyme defect and its extra-hepatic consequences persist after grafting.
  disposition: RETAINED
  report_quote: >-
    At least 8 liver transplant cases have been reported with generally
    favorable short-term outcomes.
  rationale: >-
    Arithmetic checks out: PMID:39992042 states that clinical evidence is
    limited to seven reported cases and then adds an eighth, a three-year-old
    with stable liver function at one year. PMID:34572178 reports two Polish
    brothers alive with normal graft function 23 and 20 months after
    transplantation, and PMID:34677006 reports three transplantations with one
    early death. The caveat the report attaches, that transplantation does not
    correct the systemic enzyme deficiency, is borne out in PMID:34572178, where
    one brother's renal impairment persisted after grafting and both remained
    below the third centile for growth. The KB entry described the transplant
    evidence as cautious and insufficient on the strength of a single 2014
    sentence; that prose was updated.
  citations:
  - PMID:39992042
  - PMID:34572178
  - PMID:34677006
- claim_id: crispr-independent-nadph-validation
  statement: >-
    An unbiased CRISPR screen in HER2-positive breast cancer independently
    reaches the hypothesis's central tenet, that transaldolase loss creates
    vulnerability through NADPH depletion and excess reactive oxygen species.
  disposition: RETAINED
  report_quote: >-
    independently validates the central tenet of the canonical hypothesis:
    TALDO1 loss creates a critical vulnerability through NADPH depletion and ROS
    overproduction
  rationale: >-
    PMID:30323337 states that transaldolase depletion combined with HER2
    inhibition significantly reduces cellular NADPH levels, resulting in
    excessive ROS production and deficient lipid and nucleotide synthesis. The
    value is exactly the independence the report claims: a functional-genomics
    screen in cancer cells, from a group with no stake in the inborn error,
    arrives at the same NADPH/ROS consequence of losing the same enzyme. It is
    also the only one of the report's seven candidate evidence references that
    the KB entry did not already carry. Added to the hypothesis block, graded
    IN_VITRO, with the cancer-cell context stated in the explanation so it is
    not read as disease evidence.
  citations:
  - PMID:30323337
- claim_id: structural-biology-active-site
  statement: >-
    Conservation of the transaldolase active site and Schiff-base mechanism
    across species explains why active-site disruptions such as the index
    patient's Ser171 deletion abolish enzymatic function.
  disposition: QUALIFIED
  report_quote: >-
    The dihydroxyacetone moiety is covalently linked to the side chain of Lys
    132 at the active site of the enzyme
  rationale: >-
    The structural facts are correctly quoted but they are Escherichia coli
    transaldolase B, and the cross-subfamily comparison is likewise bacterial
    and archaeal. Neither paper concerns human TALDO1 or the disease, so the
    step to the patient allele is the report's own inference. The report also
    slides between numbering systems: Lys132 is the E. coli TalB catalytic
    lysine, whereas the human catalytic residue near Ser171 is K142, as stated
    in PMID:31769880. Nothing here needs to enter the disorder entry, which
    already grounds the Ser171 mechanism directly in human patient cells via
    PMID:15115436.
  citations:
  - PMID:9007983
  - PMID:22212631
  - PMID:31769880
- claim_id: no-trials-no-clingen-absence
  statement: >-
    No registered clinical trial exists for any therapy in transaldolase
    deficiency and no ClinGen or GenCC gene-disease validity assessment has been
    made for TALDO1.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    No ClinGen/GenCC gene-disease validity assessment, no large cohort or omics
    studies identified.
  rationale: >-
    Both are source-level absence claims, and the template asks for absence to
    be reported only when the search actually checked. Neither is accompanied by
    a query, a date, a registry, or a result count, and no search log is
    committed, so neither can be graded as a completed negative search. Weak
    corroboration for the ClinGen half only: this repository's Gene-Disease
    Validity cache holds 502 assertions and none is TALDO1, but that is a curated
    subset. Both claims are plausible for a disorder with about 50 reported
    patients; they are recorded here as unverified rather than promoted into the
    entry.
- claim_id: ontology-term-leads
  statement: >-
    The report proposes cell-type, biological-process, and disease ontology
    terms for curation, including CL:0000182, CL:0000019, CL:1000507, GO:0006098,
    GO:0006749, GO:0006979, GO:0000422, MONDO:0011624, HP:0001394 and HP:0001402.
  disposition: QUALIFIED
  report_quote: >-
    Hepatocyte (CL:0000182), Spermatozoon (CL:0000019), Renal tubular epithelial
    cell (CL:1000507)
  rationale: >-
    Every CURIE resolves in this repository's caches, which is better than the
    usual rate for provider-proposed terms, but two of the display labels are not
    the canonical ones: CL:0000019 is sperm, not Spermatozoon, and CL:1000507 is
    kidney tubule cell, not Renal tubular epithelial cell. Under the term
    contract those would have to be corrected before binding. Only HP:0001402,
    Hepatocellular carcinoma, was actually needed: CL:0000182, GO:0006098 and
    MONDO:0011624 are already bound in the entry, and the sperm and kidney-tubule
    terms would have to hang on mechanism nodes that this report has just
    established do not have tissue-level evidence in the human disease.
- claim_id: retain-canonical-status
  statement: >-
    The hypothesis should retain CANONICAL status, with added annotation for the
    aldose-reductase modifier, the mTOR autoimmune pathway, and the identified
    knowledge gaps.
  disposition: RETAINED
  report_quote: >-
    status with expanded annotations for the AR rheostat modifier, the
    mTOR-autoimmune candidate pathway, and 12 identified knowledge gaps
  rationale: >-
    Agreed, and no status change was made. The proximal metabolic-redox
    mechanism is the best-evidenced part of this disease and nothing in the
    report competes with it; the alternatives the report lists are downstream
    branches, parallel routes, or uncharacterized metabolites rather than rival
    explanations of the same facts. The annotation half of the recommendation
    was already partly carried out in a previous curation pass, which wrote all
    three qualifications into the hypothesis notes; this pass converted the
    knowledge gaps into structured discussions and added the missing carcinoma
    endpoint.

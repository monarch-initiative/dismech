hypothesis_id: canonical_taldo1_ppp_redox_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The hepatic arm of the seed hypothesis is strongly supported and the report
  reproduces that support accurately: patient-derived lymphoblasts and
  Taldo1-null mice both show sedoheptulose 7-phosphate accumulation, glucose
  6-phosphate depletion, NADPH and glutathione loss, and mitochondrial failure,
  and lifelong N-acetylcysteine blocks acetaminophen-induced liver failure and
  hepatocarcinogenesis in the mouse. An unrelated CRISPR screen in HER2-positive
  breast cancer reaches the same NADPH/ROS conclusion from a different
  direction. The seed's second clause, that toxic metabolite accumulation
  contributes to renal, cardiac, skin, hematologic, and fetal manifestations,
  is the part that is not supported: the report searched for and did not find
  any tissue-level study of pentose-phosphate flux, NADPH, or oxidative stress
  in kidney, heart, or skin of a transaldolase-deficient model, so those organ
  claims rest on clinical co-occurrence alone. Two of the report's three
  headline qualifications are single-laboratory mouse results that have never
  been tested in patients: the aldose-reductase dependence of the cirrhosis to
  hepatocellular-carcinoma transition, and the mTOR/PON1/antiphospholipid
  autoimmune cirrhosis route. One qualification is overstated: the report calls
  the erythronic acid pathway completely unknown, while the cited paper in fact
  proposes a putative enzymatic sequence. The report is a review-and-synthesis
  run with no committed artifacts, so its two figure placeholders and its
  quantitative screening counts cannot be audited.

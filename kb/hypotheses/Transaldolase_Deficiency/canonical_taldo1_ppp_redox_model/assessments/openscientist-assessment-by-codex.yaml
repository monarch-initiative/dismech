assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_taldo1_ppp_redox_model
assessed_at: '2026-09-04T22:58:51+00:00'
overall_verdict: PARTIALLY_SUPPORTED
summary: The proximal TALDO1 loss, carbon-recycling defect and redox disturbance are
  strongly supported by human genetics, patient cells and mouse perturbations. The full
  linear hepatocyte-apoptosis model is incorrect, and the report misrestricts the mTOR/PON1
  findings to double-knockout mice. It overstates erythronic-acid universality and clinical
  NAC validation, misses long-term transplant and cohort evidence, and falsely claims no
  GenCC or omics evidence. No provider execution logs, raw-data analyses or figure files are
  committed. The disease review retains the canonical proximal mechanism, separates fibrosis
  from HCC, incorporates qualified OpenScientist leads and updates clinical care from
  primary cohorts.
claims:
- claim_id: proximal-metabolic-model
  statement: TALDO1 deficiency disrupts carbon recycling and redox balance.
  disposition: RETAINED
  report_quote: Sedoheptulose 7-phosphate was accumulated, whereas G6P (glucose 6-phosphate)
    was depleted
  rationale: PMID:18498245 directly measured the patient-lymphoblast phenotype and reversed
    several abnormalities with TAL gene transfer. PMID:15115436 demonstrated mutant protein
    instability and absent catalytic activity. Mouse studies add perturbational support.
    These data support the proximal mechanism without validating every downstream organ
    claim.
  citations:
  - PMID:15115436
  - PMID:18498245
  - PMID:19436114
- claim_id: fas-death-direction
  statement: The central diagram incorrectly identifies increased hepatocyte apoptosis as
    the route supported by the mouse paper.
  disposition: REJECTED
  report_quote: Hepatocyte apoptosis → LIVER CIRRHOSIS
  rationale: PMID:19436114 reports resistance to CD95/Fas apoptosis, oxidative adaptation
    and spontaneous HCC; NAC restores Fas apoptosis while preventing tumors and
    acetaminophen injury. PMID:18498245 likewise distinguishes Fas resistance from increased
    peroxide/CD20 apoptosis in lymphoblasts. The YAML now separates oxidative injury from
    apoptosis resistance and carcinogenesis.
  citations:
  - PMID:19436114
  - PMID:18498245
- claim_id: mitochondrial-context
  statement: Reduced ATP is not a universal downstream effect across the cited systems.
  disposition: QUALIFIED
  report_quote: (loss ΔΨm, reduced ATP)
  rationale: Mouse liver has reduced ATP/ADP and mitochondrial mass, but patient
    lymphoblasts have increased ATP and mitochondrial mass. Both show altered membrane
    potential. The report recognizes the mass difference in prose but its single diagram
    erases this context.
  citations:
  - PMID:19436114
  - PMID:18498245
- claim_id: nac-preclinical-rescue
  statement: Lifelong NAC prevents important liver endpoints in Taldo1-null mice.
  disposition: RETAINED
  report_quote: NAC) prevented acetaminophen-induced liver failure
  rationale: The report quotes a valid intervention, with prevention of mouse HCC and
    restoration of Fas-dependent apoptosis. Lifelong exposure, including parental treatment
    in later experiments, differs from treating established patient disease. The
    heterozygous fertility rescue should not be described as rescue of infertile null males.
  citations:
  - PMID:19436114
  - PMID:17003133
  - PMID:37742509
- claim_id: nac-human-inference
  statement: Four heterozygous APAP cases do not establish disease-modifying NAC efficacy in
    congenital biallelic TALDO deficiency.
  disposition: QUALIFIED
  report_quote: Critically, this finding has translational validation in humans
  rationale: PMID:31769880 found functional heterozygous variants in 4/27 APAP liver-failure
    cases versus 2/94 healthy controls, with NAC-treated recovery in the four cases. There
    is no untreated matched group and NAC is an established APAP antidote. This cannot
    validate prevention of congenital cirrhosis or HCC. In PMID:29923087 AFP was already
    resolving before NAC, so that case does not establish a treatment effect either.
  citations:
  - PMID:31769880
  - PMID:29923087
- claim_id: ar-epistasis
  statement: AR deletion separates carcinogenesis and APAP susceptibility from carbon
    trapping and cirrhosis in mice.
  disposition: RETAINED
  report_quote: AR inactivation in TAL-deficient mice blocked HCC susceptibility but
    enhanced growth restriction
  rationale: PMID:36658399 supports the core epistasis observation. NADPH normalizes,
    whereas GSH depletion and cirrhosis persist and carbon sequestration worsens. This is
    not evidence that inhibiting AR is uniformly beneficial or that the same modifier
    determines patient risk. The mouse AR gene is Akr1b3; proposed patient studies concern
    AKR1B1.
  citations:
  - PMID:36658399
- claim_id: nadph-gsh-dissociation
  statement: Persistent double-knockout cirrhosis cannot be attributed to persistent NADPH
    depletion.
  disposition: REJECTED
  report_quote: cirrhosis from NADPH depletion (canonical)
  rationale: AR deletion reverses NADPH depletion in the primary study, while GSH depletion
    remains. The study discusses altered pyroglutamate metabolism and carbon limitation. The
    report alternative model conflates these distinct pools and its diagram must not encode
    them as an obligatory single sequence.
  citations:
  - PMID:36658399
- claim_id: mtor-single-knockout
  statement: The mTOR/PON1/aPL observations were not limited to TAL/AR double-knockout mice.
  disposition: REJECTED
  report_quote: demonstrated only in compound knockout mice
  rationale: PMID:37742509 measures PON1 loss, aPL and stellate-cell expansion in TALKO and
    DKO mice. Rapamycin improves serum PON1 activity, aPL production and stellate-cell
    expansion in TALKO mice with functional AR. The report repeatedly misstates this key
    genotype scope. Human TALDO-specific relevance remains unproven.
  citations:
  - PMID:37742509
- claim_id: autoimmune-mediation
  statement: The autoimmune branch is a supported candidate mouse mechanism, with unresolved
    mediator specificity.
  disposition: QUALIFIED
  report_quote: driven by mTOR activation, PON1 loss, and antiphospholipid autoantibody
    production
  rationale: The primary paper measures this coordinated phenotype and rapamycin response. A
    pleiotropic mTOR intervention does not separately establish that PON1 loss or antibodies
    are necessary and sufficient for fibrosis, nor that they replace all other injury
    mechanisms. PON1 and aPL nodes are therefore provisional or hypothetical in the disease
    pathograph.
  citations:
  - PMID:37742509
- claim_id: erythronic-universal
  statement: Elevated erythronic acid is not established in every affected patient.
  disposition: REJECTED
  report_quote: Its consistent presence in all patients and knockout mice
  rationale: PMID:20600873 studied six patients and knockout mice. PMID:26238251 later found
    erythronic acid below its detection limit in a patient with elevated polyols. This does
    not prove zero production, but invalidates treating elevated erythronic acid as a
    universal required hallmark.
  citations:
  - PMID:20600873
  - PMID:26238251
- claim_id: erythronic-origin
  statement: The source pathway is incompletely established, but published PPP-derived
    routes already exist.
  disposition: QUALIFIED
  report_quote: The biosynthetic source and pathogenic significance of erythronic acid in
    TAL deficiency are completely unknown.
  rationale: The source paper proposes enzymatic routes from erythrose, including
    GAPDH/phosphatase steps and alternative oxidation. These remain proposals rather than
    flux validation. Erythronic acid is not evidence of a necessarily independent non-PPP
    pathway, and toxicity has not been established.
  citations:
  - PMID:20600873
- claim_id: clinical-extrahepatic
  statement: Renal, endocrine and developmental manifestations are real, but their precise
    biochemical causes remain unresolved.
  disposition: RETAINED
  report_quote: The canonical model is validated in liver and sperm; extension to kidney,
    skin, heart, and blood is inferred but untested.
  rationale: The report appropriately distinguishes direct organ mechanistic evidence from
    clinical associations. PMID:22510381 documents renal findings in 7/9 patients;
    PMID:41806563 describes adult endocrine, skeletal, renal and hepatic progression. The
    2026 follow-up cohort PMID:41823103 further documents CKD, coagulopathy and endocrine
    replacement needs. These observations do not prove polyol toxicity in every organ.
  citations:
  - PMID:22510381
  - PMID:41806563
  - PMID:41823103
- claim_id: intragenotypic-variability
  statement: Clinical variability within a shared genotype does not identify a specific
    modifier.
  disposition: QUALIFIED
  report_quote: strongly implicates modifier genes (potentially including AR genotype),
    epigenetic factors, or environmental exposures
  rationale: The four p.R192C patients in PMID:25388407 have variable severity, but
    modifiers were not directly mapped. Different ages, observation periods and stochastic
    effects also affect phenotype. PMID:41823103 describes both recurring sibling patterns
    and intragenotypic liver variability; no validated AKR1B1 patient modifier is
    established by these cohorts.
  citations:
  - PMID:25388407
  - PMID:41823103
- claim_id: transplant-benefit
  statement: Transplantation can correct hepatic disease while systemic manifestations
    persist.
  disposition: RETAINED
  report_quote: does not correct the systemic enzyme deficiency
  rationale: Clinical reports support normal graft function in survivors and persistent or
    later extrahepatic disease. PMID:41823103 also reports one posttransplant death, so
    favorable outcome is not guaranteed. Reports overlap in patients and should not be
    simply summed into an independent transplant count.
  citations:
  - PMID:34572178
  - PMID:34677006
  - PMID:39992042
  - PMID:41823103
- claim_id: transplant-followup-gap
  statement: The claimed two-year ceiling and absence of extrahepatic post-transplant data
    are false.
  disposition: REJECTED
  report_quote: Maximum follow-up ~2 years; no data on extra-hepatic disease progression
    post-LT.
  rationale: The report itself cites PMID:34677006, which describes normal graft function 21
    years after transplantation, renal immunosuppression complications and ovarian
    insufficiency. PMID:34572178 describes post-transplant renal, hematologic and growth
    findings. PMID:41823103 adds a median 5.3-year posttransplant follow-up and persistent
    renal/endocrine complications. This was already incorrect from cited pre-report
    literature.
  citations:
  - PMID:34677006
  - PMID:34572178
  - PMID:41823103
- claim_id: structural-scope
  statement: Bacterial structural chemistry and human deletion-induced instability support
    different levels of inference.
  disposition: QUALIFIED
  report_quote: active-site disruptions (such as the ΔS171 deletion in the index patient)
  rationale: PMID:9007983 directly identifies catalytic Lys132 in E. coli transaldolase B,
    not a human residue assignment. PMID:15115436 demonstrates loss of activity and
    proteasome-mediated degradation for human Ser171 deletion. The general Schiff-base
    chemistry is valid, but the bacterial structure does not establish that the human
    deletion simply removes the catalytic site.
  citations:
  - PMID:9007983
  - PMID:15115436
  - PMID:22212631
- claim_id: cancer-context
  statement: The HER2 synthetic-lethality study is contextual support, not independent
    sufficiency proof for congenital liver disease.
  disposition: QUALIFIED
  report_quote: independently validates the central tenet of the canonical hypothesis
  rationale: PMID:30323337 combines TALDO1 depletion with HER2 blockade in resistant breast
    cancer cells. The combined treatment lowers NADPH and increases ROS, whereas TA-depleted
    cells can still proliferate under vehicle. It supports a context-dependent metabolic
    vulnerability, not the claim that TAL loss alone causes the same response in every cell
    or validates human hepatic causation.
  citations:
  - PMID:30323337
- claim_id: gencc-absence
  statement: GenCC assertions exist for TALDO1; this must not be conflated with a dedicated
    ClinGen expert-panel assessment.
  disposition: REJECTED
  report_quote: No ClinGen/GenCC gene-disease validity assessment
  rationale: On 2026-09-04 the ClinGen TALDO1 gene page displays GenCC Moderate, Strong,
    Supportive and Definitive classifications and links to GenCC. The GenCC disease page is
    indexed with a transaldolase-deficiency Definitive classification. The direct GenCC page
    returned 403 during this assessment, so individual submission details were not fully
    audited; the provider no-GenCC assertion is nevertheless contradicted by the accessible
    official aggregator. A ClinGen expert-panel curation is a separate question.
  citations:
  - https://search.clinicalgenome.org/kb/genes/HGNC:11559/genomeconnect
  - https://thegencc.org/genes/HGNC%3A11559/disease
- claim_id: cohort-omics-absence
  statement: Relevant cohorts and omics studies exist.
  disposition: REJECTED
  report_quote: no large cohort or omics studies identified
  rationale: For an ultra-rare condition, the 34-patient clinical/endocrine cohort
    PMID:30740741 is substantial and predates the report. PMID:18498245 uses patient-cell
    microarrays, and PMID:36658399 uses mass spectrometry, stable-isotope tracing and RNA
    sequencing. The report itself cites these omics papers. Human population-scale omics
    remains a narrower unresolved need; a blanket omics absence is incorrect.
  citations:
  - PMID:30740741
  - PMID:18498245
  - PMID:36658399
- claim_id: trial-search-scope
  statement: A scoped current registry query found no records, but the provider absence
    claim lacks a reproducible search log.
  disposition: QUALIFIED
  report_quote: Literature search found no registered clinical trials for TAL deficiency.
  rationale: On 2026-09-04 the assessor queried ClinicalTrials.gov API v2 with
    query.term=AREA[ConditionSearch](transaldolase deficiency) and separately TALDO1; both
    returned totalCount=0. This supports a narrow current registry result, not an exhaustive
    worldwide trial absence or retrospective proof of the provider search. Broad metabolic
    studies may not name the condition in searchable fields.
  citations:
  - https://clinicaltrials.gov/api/v2/studies
- claim_id: isotope-design
  statement: Unspecified glucose labeling is insufficient to uniquely resolve competing
    erythronate routes.
  disposition: QUALIFIED
  report_quote: Labeling pattern reveals whether erythronic acid derives from PPP,
    glycolysis, or independent pathway.
  rationale: Shared intermediates and carbon rearrangements make this conclusion
    design-dependent. The proposal needs specified tracer positions, isotopologue or
    positional measurements, precursor enrichment, time courses and pathway perturbations
    informed by the candidate routes in PMID:20600873. No tracing was executed in the
    provider report.
  citations:
  - PMID:20600873
- claim_id: nac-trial-design
  statement: The proposed uncontrolled NAC study would need natural-history comparators and
    endpoint validation.
  disposition: QUALIFIED
  report_quote: Open-label oral NAC in 10-15 TAL-deficient patients
  rationale: The proposal is not a completed analysis. Age-dependent AFP, variable
    progression, concomitant care and survival selection can mimic benefit; PMID:29923087
    directly illustrates AFP decline before NAC. Polyol or GSH changes alone do not validate
    prevention of fibrosis or HCC. A feasible protocol would need prespecified safety,
    clinical endpoints and age/severity-matched natural history, informed by PMID:30740741
    and PMID:41823103.
  citations:
  - PMID:29923087
  - PMID:30740741
  - PMID:41823103
- claim_id: provider-corpus-provenance
  statement: The numerical corpus and figure placeholders are not auditable provider
    outputs.
  disposition: NEEDS_VERIFICATION
  report_quote: Literature Reviewed:** 39 papers
  rationale: The committed citation sidecar contains 30 numbered PMIDs, while the report
    claims 39 papers, eight confirmed findings and two iterations. No dated search export,
    screening log or analysis environment is present. Two figure placeholders name files
    that are absent. The textual matrix and causal chain can be assessed as literature
    synthesis, but none of these counts establishes executed experimental or computational
    work.
  citations:
  - PMID:36658399

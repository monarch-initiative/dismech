hypothesis_id: anti_dsg2_causal_injury_driver_or_amplifier
assessed_at: '2026-10-12T02:05:00Z'
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  An unusually disciplined report whose directional conclusion survives
  independent checking: anti-DSG2 occurs in ARVC, is not specific to it against
  inflammatory myocardial disease, and no study supplies causal-grade
  perturbation evidence. Citation integrity is clean, all eighteen cited
  identifiers resolve with the titles the report attributes to them, and every
  negative-existence search claim held on re-run. Three findings narrow it.
  Its strongest pro-hypothesis row (PMID:42233375) has no PubMed abstract, so
  the AUC, cut-off, and hazard-ratio figures anchoring the comparator
  reconciliation cannot be verified from this repository's reference cache. Its
  assay-artifact argument inverts the cited authors' own explanation for their
  failure to detect DSG2 binding, and overlooks that a later study from the same
  group reports DSG2 binding directly. And its canine non-replication narrative
  omits an earlier, better-controlled multi-breed study that both strengthens
  the non-specificity conclusion and qualifies the report's reading that the
  antibody tracks progressive dysfunction rather than arrhythmia. The ontology
  bindings offered as curation leads should not be used as written: four of
  eight pair a real CURIE with the wrong label or the wrong concept.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

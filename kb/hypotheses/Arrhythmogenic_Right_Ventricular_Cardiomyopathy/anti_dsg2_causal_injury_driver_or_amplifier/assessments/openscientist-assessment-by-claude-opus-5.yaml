claims:
  - claim_id: citation-integrity
    statement: >-
      Every identifier the report cites exists and carries the title and study
      type the report attributes to it.
    disposition: RETAINED
    report_quote: "citation_count: 18"
    rationale: >-
      All 18 cited PMIDs were resolved; 13 were already in references_cache and 5
      were fetched for this assessment. Every title matches the report's
      attribution, including the five high-numbered 2026 identifiers whose
      recency makes them the most likely candidates for fabrication
      (PMID:42233375, 42219531, 42193878, 42160918, 42406223). No invented
      citation, mismatched title, or misattributed study design was found. This is
      worth recording positively because a plausible-looking fabricated
      identifier is the failure mode that would most undermine a literature-only
      run, and it did not occur here.
    citations:
      - PMID:42233375
      - PMID:42219531
      - PMID:42193878
      - PMID:42160918
      - PMID:42406223
  - claim_id: pivotal-figures-unverifiable
    statement: >-
      The diagnostic and prognostic figures carrying the report's strongest
      pro-hypothesis evidence row cannot be verified from this repository's
      reference cache.
    disposition: NEEDS_VERIFICATION
    report_quote: Two pivotal papers (PMID:42233375, PMID:39597880) had no abstract in the PubMed tool
    rationale: >-
      The report discloses this limitation, which is to its credit, but the
      consequence is larger than the disclosure suggests and no assessment has
      recorded it. The cached record for PMID:42233375 is 1,876 bytes of citation
      metadata and author affiliations with content_type abstract_only and no
      abstract text at all, so the AUC of 0.823, the OD > 0.774 cut-off at 72.3%
      sensitivity and 100% specificity, the OD > 1.021 threshold, and the
      hazard ratio of 4.56 are absent from the repository. Those figures are what
      the comparator reconciliation, the "+29% yield over genetics" claim, and
      the prognostic argument all rest on. The paper is real and in PMC
      (PMC13256025), so this is a verification gap rather than a fabrication
      concern, but any promotion of these numbers to a disease entry would fail
      exact-quote snippet validation today. PMID:39597880 is in a different
      position: its cache does carry the quoted sentences, and the 48%
      myocarditis/DCM positivity, the absence of a titer difference, and the
      wider AIDA autoantigenic spectrum all verified.
    citations:
      - PMID:42233375
      - PMID:39597880
  - claim_id: elisa-nondetection-reading
    statement: >-
      Failure of two groups to detect anti-DSG2 binding by their own assays
      indicates the ARVC anti-DSG2 signal may be an assay or epitope artifact.
    disposition: QUALIFIED
    report_quote: Cross-lab assay disagreement means part of the "signal" may be assay/epitope-artifactual
    rationale: >-
      The non-detection is real, but the report's inference from it runs opposite
      to the cited authors' own stated explanation. PMID:37450050 writes that
      "Since we observed a loss of cardiomyocyte cohesion but did not detect
      autoantibodies firmly binding to DSG2 in the AC patient IgG fractions, we
      wondered whether autoantibodies affecting cell-cell adhesion target
      adhesion molecules by modifying the epitope structure which would interfere
      with detection by ELISA or Western blot analysis." On that reading the
      non-detection is a predicted consequence of catalytic activity destroying
      the epitope, which is a mechanism compatible with pathogenicity, not
      evidence that the signal is artifactual. The underlying concern that
      cross-laboratory assay disagreement is unresolved stands, and the
      recommended ring trial remains the right remedy; what does not follow is
      that the disagreement points toward artifact. The report places this
      concern "upstream of all causal interpretation", which gives a
      directionally mistaken inference load-bearing weight.
    citations:
      - PMID:37450050
  - claim_id: dsg2-binding-independent-reproduction
    statement: >-
      The DSG2 antigen-specificity premise rests on a single study and has no
      independent reproduction.
    disposition: QUALIFIED
    report_quote: has no independent reproduction (searched 2026-07-26)
    rationale: >-
      True of the mapped disease-specific epitope, which remains confined to
      PMID:30239670, and the re-run search supports that narrow claim. It is too
      strong for DSG2 binding itself, because the report's own cited
      PMID:42219531 reports that "Pathogenic autoantibodies, bound to DSG2 in
      healthy and ACM hiPSC-CMs, cleaved and reduced DSG2 interaction at the
      molecular level", demonstrated by atomic force microscopy. That is a 2026
      study from the same group whose earlier failure to detect binding the
      report cites as grounds for doubt, so it is the most informative available
      update on exactly this question and the report does not use it here. The
      defensible statement is that the epitope has not been independently
      mapped, while DSG2 binding and DSG2-interaction reduction have been
      independently demonstrated by a second group.
    citations:
      - PMID:30239670
      - PMID:42219531
      - PMID:37450050
  - claim_id: canine-non-replication-incomplete
    statement: >-
      Later canine cohorts fail to reproduce the diagnostic discrimination that
      anchored the original specificity claim.
    disposition: QUALIFIED
    report_quote: The animal model that anchored the original specificity claim now fails to replicate.
    rationale: >-
      The conclusion holds and is in fact better supported than the report
      shows, but the word "now" misdates the record. Re-running the report's own
      search terms recovers PMID:36977772 (Scientific Reports, March 2023), a
      prospective 46-dog study across five groups that no evidence row cites. It
      found anti-DSG2 "detected in all dogs", no difference between study groups,
      and concluded the antibodies "were not disease specific in the studied
      population of dogs" — by Western blot, the original study's own modality,
      and with non-ARVC cardiac comparators (dilated cardiomyopathy, myxomatous
      mitral valve disease) that neither 2025 nor 2026 Boxer cohort included.
      That comparator design addresses the specificity question more directly
      than either study the report relies on. So canine non-replication is a
      three-study, seven-year-old finding rather than a 2025 development, and the
      codex assessment's careful within-modality argument was available three
      years earlier than that assessment locates it.
    citations:
      - PMID:36977772
      - PMID:30239670
      - PMID:41351822
      - PMID:42160918
  - claim_id: arrhythmia-correlate-qualified
    statement: >-
      The antibody's clinical associations track progressive myocardial
      dysfunction rather than arrhythmia, which favours an injury-dependent
      reading.
    disposition: QUALIFIED
    report_quote: and **not** with arrhythmic events
    rationale: >-
      Correct for PMID:42233375, where the prognostic association is with cardiac
      death or transplantation, and PMID:39597880 found no ARVC clinical
      correlates. But the same uncited canine study reports, within ARVC-affected
      Boxers, a "strong correlation with the complexity of ventricular
      arrhythmias (r = 0.841, p = 0.007)", which echoes the PVC-burden
      correlation (r = 0.70) in PMID:30239670. Two independent reports of an
      arrhythmia-severity correlation among affected subjects sit awkwardly with
      an argument built on the absence of an arrhythmic association. The two are
      reconcilable, since a within-affected severity gradient and a
      between-group diagnostic or prognostic association answer different
      questions, and neither canine correlation is adjusted for disease severity.
      The point is that the dysfunction-not-arrhythmia asymmetry is softer than
      the report presents, and it should not carry weight in ranking the
      biomarker-only null against the amplifier model.
    citations:
      - PMID:36977772
      - PMID:30239670
      - PMID:42233375
      - PMID:39597880
  - claim_id: negative-existence-claims
    statement: >-
      No study supplies antigen-specific depletion and add-back, monoclonal
      reconstruction, Fc or complement dissection, intact-animal passive
      transfer, or longitudinal pre-injury antibody sampling.
    disposition: RETAINED
    report_quote: "Actively searched PubMed 2026-07-26 (ARVC autoantibody passive/adoptive transfer): zero studies."
    rationale: >-
      Negative-existence claims are the one class of assertion no validator can
      reach, so each was re-run against PubMed for this assessment rather than
      taken on trust. All held. The passive-transfer search returns a single
      pemphigus and infectious skin disease review; the DSG2 Fc and complement
      search returns eight records that are without exception adenovirus-receptor
      studies, DSG2 being an adenovirus serotype receptor, with no cardiac
      autoantibody content; the DSG2 monoclonal cardiomyocyte search returns
      nothing; and the epitope search returns only the originating study plus an
      unrelated plakoglobin epitope-masking paper. The report's characterisation
      of what is missing is accurate, and the gaps it identifies are the right
      ones. One caveat applies to the method rather than the result: a search run
      on 2026-07-26 and re-run on 2026-10-12 cannot speak to the intervening
      literature beyond those two dates, and the re-run used the assessor's query
      wording because the report commits none of its own.
    citations:
      - PMID:30239670
      - PMID:37450050
      - PMID:42219531
  - claim_id: ontology-term-leads
    statement: >-
      The proposed cell-type and biological-process ontology terms are usable as
      curation leads.
    disposition: REJECTED
    report_quote: "cell types — cardiomyocyte (CL:0000746)"
    rationale: >-
      Every CURIE offered resolves, but four of the eight pair a real identifier
      with the wrong label or the wrong concept, so the block should not be
      copied into an entry as written. Two are concept errors that validation
      would not necessarily catch. GO:0005922 is offered as part of "fascia
      adherens/gap junction (GO:0005921/GO:0005922)" but is the connexin complex,
      not the fascia adherens. GO:0038061 is offered as "NIK/NF-κB signaling" and
      is non-canonical NF-kappaB signal transduction, whereas the biology the
      report cites from PMID:34345905 and PMID:42193878 is pan-inflammatory
      canonical NF-κB; the canonical terms are GO:0007249 and GO:0043123. Two are
      slot-level mismatches. GO:0072559 is offered under "Processes" as "NLRP3
      inflammasome" and is the NLRP3 inflammasome complex, a cellular component,
      where the process term is GO:0044546, NLRP3 inflammasome complex assembly.
      CL:0000746 carries the canonical label cardiac muscle cell, so
      "cardiomyocyte" belongs in preferred_term rather than in the binding. The
      remaining four, GO:0014704, GO:0005921, GO:0098609, and GO:0006956, carry
      their canonical labels correctly. All labels were read from the committed
      term caches for this assessment rather than recalled.
    citations:
      - PMID:34345905
      - PMID:42193878
  - claim_id: declared-artifacts-absent
    statement: The run produced inspectable rendered artifacts.
    disposition: REJECTED
    report_quote: "[OpenScientist final report](openscientist_artifacts/final_report.html)"
    rationale: >-
      Frontmatter declares artifact_count 2 with an artifact_sources entry for an
      openscientist_artifacts_zip, lists final_report.html and final_report.pdf
      with media types, and the Artifacts section links both. No
      openscientist_artifacts directory exists in the hypothesis directory and
      neither file is committed, so both links are dead and nothing the run
      rendered can be inspected. For a literature-only run this costs little
      scientifically, since the Markdown report is self-contained and the claims
      are traceable to PMIDs, but it means the declared provenance overstates
      what is auditable. No canonical MANIFEST.yaml exists either, so the
      hypothesis-analysis-run gate does not apply and was not run.
  - claim_id: keep-emerging-unwired
    statement: >-
      The hypothesis should stay EMERGING, with no causal pathophysiology edge,
      no ARVC-specific biomarker, and no immune-directed treatment proposed.
    disposition: RETAINED
    report_quote: >-
      does **not** warrant wiring a causal pathophysiology edge, defining a
      clinical biomarker as ARVC-specific, or proposing immune-directed therapy
    rationale: >-
      This is the report's operative recommendation and it survives every check
      made here, including the three corrections above. Non-specificity against
      inflammatory myocardial disease is verified in the cache; the absence of
      causal-grade perturbation evidence is verified by re-run search; canine
      non-specificity is more firmly established than the report claims, not
      less. The corrections cut in both directions without reaching the
      recommendation: independent DSG2 binding and the arrhythmia-severity
      correlations strengthen the amplifier reading, while the earlier canine
      non-replication strengthens the biomarker-only null. The report's own
      ranking of the null as "more parsimonious" is better left as unresolved,
      which is where the codex assessment also landed and which this
      assessment's findings reinforce from both sides.
    citations:
      - PMID:39597880
      - PMID:35764120
      - PMID:36977772
      - PMID:42219531

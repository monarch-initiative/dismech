schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: anti_dsg2_causal_injury_driver_or_amplifier
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report is a careful and useful causal assessment. It correctly separates
  antibody prevalence from ARVC specificity and antigen-specific pathogenicity,
  reconciles comparator-dependent cohort results, and identifies the decisive
  missing perturbation experiments. Its main conclusions should be retained,
  but claims that prevalence is robust and that the biomarker-only null is more
  parsimonious require narrower wording. Later canine data genuinely fail to
  reproduce diagnostic discrimination, including by the original Western-blot
  modality, but cohort, threshold, and phenotype differences prevent extending
  that failure to every assay-defined observation.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: comparator-reconciliation
    statement: >-
      Anti-DSG2 can distinguish ARVC from healthy or non-inflammatory
      right-ventricular overload controls without distinguishing ARVC from
      myocarditis or dilated cardiomyopathy.
    disposition: RETAINED
    report_quote: "The two are reconcilable, not contradictory:"
    rationale: >-
      The comparator sets answer different specificity questions. PMID:42233375
      supports separation from healthy, Ebstein-anomaly, and Eisenmenger
      controls, whereas PMID:39597880 materially limits specificity against
      inflammatory myocardial disease.
    citations:
      - PMID:42233375
      - PMID:39597880
  - claim_id: prevalence-robustness
    statement: Anti-DSG2 occurrence is robust across human ARVC cohorts.
    disposition: QUALIFIED
    report_quote: Pillar 1 is robust in human ARVC cohorts.
    rationale: >-
      Multiple cohorts detect a signal, but positivity rates, clinical
      correlates, antigen-binding results, assays, and cutoffs differ across
      groups. The defensible claim is that anti-DSG2 reactivity has been
      repeatedly observed, not that its prevalence estimate or assay-defined
      phenotype is robust.
    citations:
      - PMID:30239670
      - PMID:37450050
      - PMID:39597880
      - PMID:42233375
  - claim_id: canine-replication
    statement: >-
      Later Boxer cohorts do not reproduce the original canine diagnostic
      discrimination.
    disposition: QUALIFIED
    report_quote: >-
      The animal model that anchored the original specificity claim now fails
      to replicate.
    rationale: >-
      PMID:42160918 found poor discrimination by both ELISA (AUC 0.534) and
      Western blot (AUC 0.600); the Western-blot arm used the same modality as
      the original PMID:30239670 study, so this is genuine within-modality
      non-replication of diagnostic discrimination. PMID:41351822 likewise
      detected anti-DSG2 in nearly all dogs, including healthy controls.
      Differences in cohort selection, diagnostic thresholds, and phenotype
      definitions still constrain the inference: the later cohorts do not
      reproduce diagnostic discrimination in their settings, but they do not
      show that every assay-defined observation in the original study fails to
      reproduce.
    citations:
      - PMID:30239670
      - PMID:41351822
      - PMID:42160918
  - claim_id: missing-causal-experiments
    statement: Existing studies do not establish antigen-specific anti-DSG2 causality in vivo.
    disposition: RETAINED
    report_quote: No study delivers the causal-grade experiments
    rationale: >-
      The reviewed studies use cohort associations, total or partially
      characterized IgG, and in-vitro rescue signals. They do not provide the
      depletion/add-back, monoclonal reconstruction, epitope rescue,
      Fc/complement dissection, passive transfer, or pre-injury longitudinal
      evidence needed for a causal claim.
    citations:
      - PMID:30239670
      - PMID:37450050
      - PMID:42219531
  - claim_id: biomarker-null-ranking
    statement: The injury-dependent biomarker-only null is more parsimonious than a causal amplifier.
    disposition: QUALIFIED
    report_quote: injury-dependent epiphenomenon, with an injury-dependent amplifier not excluded.
    rationale: >-
      Cross-sectional nonspecificity and association with progressive
      dysfunction favor an injury-associated interpretation, but absence of
      causal-grade experiments does not positively establish epiphenomenon.
      The current evidence leaves biomarker-only and injury-dependent amplifier
      models unresolved rather than decisively ranking them.
    citations:
      - PMID:39597880
      - PMID:42233375

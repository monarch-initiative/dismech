schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: alternative_excitotoxicity
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A substantive report that does real work beyond the seed. The seed hypothesis
  entry in kb/disorders/Huntington_Disease.yaml carried only two references
  (PMID:17188796, PMID:19279257) and a one-line "selective-vulnerability
  amplifier" framing; the report supplies the mechanistic content that framing
  was asserting without evidence — the cell-autonomous synaptic-to-extrasynaptic
  GluN2B redistribution in YAC128 medium spiny neurons, the calpain/STEP
  trafficking mechanism behind it, the DAPK1 and p38 amplifiers, and the classic
  quinolinic-acid lesion pharmacology.

  I fetched and read nine of the load-bearing citations into references_cache/.
  Eight check out verbatim: PMID:22668780, PMID:22523092, PMID:33250715,
  PMID:40461488, PMID:36517241, PMID:33016873, PMID:1710657 and PMID:9100675 all
  say what the report says they say, at the stated model, direction and level.
  One does not. Gap 4 cites PMID:11554551 for the failure of remacemide and
  memantine trials in HD; that 2001 review predates the result and in fact states
  the opposite tense — "Phase III clinical trials are ongoing with remacemide for
  epilepsy and Huntington's disease". The companion citation PMID:15717010 does
  support trial failure, so the gap survives on one leg rather than two.

  The verdict PARTIALLY_SUPPORTED is right and matches the curated ALTERNATIVE
  status, but the report's own strongest observations argue harder against the
  hypothesis than its prose does. Human postmortem in-situ hybridization
  (PMID:9100675) finds NMDAR subunit mRNA falling with disease severity and reads
  the astrocytic GLT1 response as compensatory and protective; HD GWAS returns
  mismatch-repair genes and no glutamate-receptor pathway signal; and every
  extrasynaptic-redistribution measurement is mouse. That combination is a
  human/model mismatch, not merely a knowledge gap, and it is what I recorded in
  the disease entry.

  One ontology lead is wrong and must not be used: GO:0070997 is obsolete in the
  current cache ("obsolete neuron death").
data_sources:
  - data_source_id: pubmed-literature-search
    source_type: DATABASE
    name: PubMed
    access_status: UNVERIFIABLE
    query: >-
      Not stated. The report says only that "The 71 papers reviewed were
      identified through PubMed searches"; no query strings, date filters, or
      result sets are given.
    notes: >-
      No search log or response artifact is committed anywhere under the
      hypothesis directory, which holds only openscientist.md and its citations
      sidecar, so the search cannot be checked. The report claims 71 papers
      reviewed and 9 findings confirmed, but openscientist.md.citations.md lists
      34 PMIDs; the other ~37 papers cannot be identified, let alone re-examined.
  - data_source_id: hd-gwas-modifier-studies
    source_type: DATABASE
    name: GeM-HD consortium HD onset-modifier GWAS
    access_status: UNVERIFIABLE
    notes: >-
      Gap 6 asserts that no significant glutamate-receptor-pathway association is
      reported in HD GWAS, and lists "HD GWAS modifier studies (GeM-HD
      consortium)" under what was checked. The claim is consistent with the
      published GeM-HD results, but the report names no accession, release,
      summary-statistics file, or query, and cites no GWAS paper by PMID at that
      point, so whether anything was actually consulted cannot be established. It
      reads as a recollection of the literature rather than a database check.
  - data_source_id: gencc-clingen-curation
    source_type: DATABASE
    name: GenCC / ClinGen gene-disease curation
    access_status: UNVERIFIABLE
    notes: >-
      Gap 7 reports that no GenCC, ClinGen, or comparable curation resource maps
      excitotoxicity-pathway genes in HD. That is true but uninformative by
      construction — those resources curate gene-disease validity, not mechanism
      — and no query artifact is committed.
  - data_source_id: enroll-hd-cohort
    source_type: DATABASE
    name: ENROLL-HD observational cohort
    uri: https://enroll-hd.org/
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Named only as the proposed sampling frame for Discriminating Test 5
      (longitudinal MRS and CSF kynurenine metabolomics, n ~ 100). This is a
      future-work proposal; no ENROLL-HD data were retrieved.
analyses:
  - analysis_id: literature-evidence-matrix
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature synthesis rendered as a 22-row evidence matrix with
      hand-assigned direction (SUPPORTS / QUALIFIES / COMPETING) and confidence
      grades, plus an ASCII causal-chain diagram with per-link strength labels.
    comparison: >-
      Seed NMDAR-excitotoxicity model versus somatic CAG expansion, proteostasis
      collapse, BDNF/TrkB deficit, transcriptional dysregulation, A1-astrocyte
      neuroinflammation, mitochondrial dysfunction, and kynurenine-pathway
      alternatives.
    input_data_source_ids:
      - pubmed-literature-search
    status_reason: >-
      There is no openscientist_artifacts bundle for this hypothesis. The report
      embeds three figure placeholders ({{figure:mechanistic_chain.png}},
      {{figure:evidence_matrix.png}}, {{figure:knowledge_gaps.png}}) that resolve
      to no committed file, so even the tables it calls artifacts are prose. The
      confidence labels (HIGH, MODERATE-HIGH, MODERATE) are assigned with no
      stated rubric, and the report itself concedes that "no formal
      meta-analysis was performed".
    limitations: >-
      Roughly half the claimed corpus is unidentifiable (see
      pubmed-literature-search). Every per-link strength label in the causal
      chain is a judgment, not a computation.
claims:
  - claim_id: verdict-amplifier-not-initiating-lesion
    statement: >-
      NMDAR-mediated excitotoxicity in Huntington disease is partially supported
      as a selective-vulnerability amplifier rather than the primary initiating
      lesion, and the hypothesis should stay ALTERNATIVE.
    disposition: RETAINED
    report_quote: >-
      PARTIALLY SUPPORTED — as a selective-vulnerability amplifier, not the sole
      initiating lesion.
    rationale: >-
      Concordant with the curated status and with the primary sources I checked.
      Note this is largely seed-derived: the KB entry already described the
      hypothesis as "a selective-vulnerability amplifier rather than the sole
      initiating lesion", almost word for word, so the verdict itself is not new
      support. What is new is the mechanistic detail underneath it. No status
      change made.
    citations:
      - PMID:17188796
      - PMID:19279257
  - claim_id: cell-autonomous-extrasynaptic-glun2b-redistribution
    statement: >-
      Mutant huntingtin drives a cell-autonomous increase in extrasynaptic
      GluN2B-containing NMDA receptors in striatal medium spiny neurons, leaving
      synaptic NMDAR currents unchanged.
    disposition: RETAINED
    report_quote: >-
      MSN cell-autonomous increases in extrasynaptic NMDARs are driven by the HD
      mutation
    rationale: >-
      Verified verbatim in the PMID:22668780 abstract. The abstract also supplies
      the specificity the report claims — synaptic NMDAR currents and synaptic
      GluN2A/GluN2B are equal between YAC128 and wild type, whole-cell and
      especially extrasynaptic current is elevated, and GluN2B surface expression
      rises irrespective of whether the co-cultured cortical cells carry mutant
      huntingtin, which is what makes it cell-autonomous. This is the report's
      single most valuable contribution and the disorder entry had no node for
      it; promoted to a new pathophysiology node.
    citations:
      - PMID:22668780
      - PMID:22523092
  - claim_id: calpain-step-trafficking-mechanism
    statement: >-
      Calpain cleavage of the GluN2B C-terminus and elevated STriatal-Enriched
      protein tyrosine phosphatase activity are the trafficking mechanisms that
      relocate GluN2B to extrasynaptic sites in the YAC128 striatum.
    disposition: RETAINED
    report_quote: Calpain activation & STEP dysregulation
    rationale: >-
      Verified in the PMID:22523092 abstract, which reports increased calpain
      cleavage of GluN2B and elevated synaptic STEP activity with decreased
      GluN2B Y1472 phosphorylation in YAC128 striatum, and shows the effect is
      reversible — calpain inhibition plus STEP inactivation together reduce
      extrasynaptic and increase synaptic GluN2B. The interventional arm is what
      lifts this above correlation.
    citations:
      - PMID:22523092
  - claim_id: dapk1-glun2b-s1303-amplifier
    statement: >-
      DAPK1 is re-activated in the adult brain, recruited to extrasynaptic NMDAR
      complexes, and phosphorylates GluN2B at S1303 to amplify toxic receptor
      function; this is dysregulated early in YAC128 mice.
    disposition: RETAINED
    report_quote: >-
      becomes re-activated and recruited to extrasynaptic NMDAR complexes during
      neuronal death, where it phosphorylates GluN2B at S1303, amplifying toxic
      receptor function
    rationale: >-
      Verbatim from the PMID:22523092-adjacent DAPK1 paper PMID:33250715, whose
      cached full text confirms both the S1303 mechanism and the YAC128 early
      dysregulation. One caveat the report does not flag: the quoted sentence is
      the paper's background statement about DAPK1 in the adult brain generally,
      not its own HD result; the HD-specific finding is the YAC128 sentence that
      follows it. Retained as a mechanism lead, not promoted as HD evidence on
      the strength of a background sentence.
    citations:
      - PMID:33250715
  - claim_id: pkd1-loss-human-and-mouse
    statement: >-
      PKD1 protein is reduced in striatal neurons of HD patients and lost
      progressively from early stages in R6/1 mice, and PKD inhibition worsens
      NMDAR-mediated excitotoxic damage in primary striatal neurons.
    disposition: RETAINED
    report_quote: >-
      an unexpected reduction in PKD1 protein levels in striatal neurons from HD
      patients. Similarly, the R6/1 mouse model of HD exhibited progressive PKD1
      protein loss, commencing at early disease stages, accompanied by decreased
      Prkd1 transcript levels
    rationale: >-
      Verified verbatim against the cached PMID:40461488 abstract and full text.
      This is one of very few excitotoxicity-pathway findings with human
      postmortem confirmation, which is exactly the axis on which this hypothesis
      is weakest. The report's framing is accurate on a point that is easy to get
      wrong: the transcript decrease is the mouse result, and in human tissue
      PRKD1 mRNA actually trends up while protein falls, which the paper
      attributes to a post-transcriptional mechanism.
    citations:
      - PMID:40461488
  - claim_id: tnf-d1-msn-pathway-specificity
    statement: >-
      In presymptomatic YAC128 mice the excitatory/inhibitory shift that would
      potentiate excitotoxicity is specific to direct-pathway D1 medium spiny
      neurons and is TNF-dependent, which is at odds with D2 neurons degenerating
      first in HD.
    disposition: QUALIFIED
    report_quote: >-
      an increase in excitatory synaptic strength, as measured by AMPA/NMDA
      ratios, specifically on direct pathway D1 receptor expressing medium spiny
      neurons, with no changes on indirect pathway neurons
    rationale: >-
      The quoted result is verbatim in the PMID:36517241 abstract and is real.
      Qualified because the report elevates it to a "paradox" (Gap 5) without
      noting what the abstract itself is careful about — the paper measures
      synaptic strength, not degeneration, and states only that the change "may
      potentiate excitotoxicity". A synaptic-strength difference in D1 neurons is
      not evidence that D1 neurons die first. Also of note, the cohort is male
      only.
    citations:
      - PMID:36517241
  - claim_id: quinolinic-acid-lesion-reproduces-hd-neurochemistry
    statement: >-
      Chronic quinolinic acid lesions in rat striatum reproduce the neurochemical
      and interneuron-sparing pattern of HD in a way that kainate and AMPA
      lesions do not, implicating NMDAR activation specifically.
    disposition: RETAINED
    report_quote: >-
      striking sparing of NADPH-diaphorase neurons (not seen with kainate or AMPA
      lesions)
    rationale: >-
      Verified in the PMID:1710657 abstract, including the receptor-class
      contrast that carries the argument: somatostatin and neuropeptide Y rise
      after QA but not after kainate or AMPA, and only QA spares
      NADPH-diaphorase neurons. This is the strongest pharmacological support the
      hypothesis has and the entry did not cite it.
    citations:
      - PMID:1710657
  - claim_id: human-postmortem-nmdar-mrna-falls-with-severity
    statement: >-
      In human HD neostriatum, NR1/NR2B and GLT1 mRNA fall in proportion to
      disease severity, with only the earliest-stage matrix zones showing levels
      above control.
    disposition: QUALIFIED
    report_quote: >-
      Early in the disease, cellular NR1/NR2BmRNA levels were higher in these
      zones than in controls
    rationale: >-
      The sentence is in the PMID:9100675 abstract, but the report quotes the one
      clause that favours the hypothesis and files the paper as QUALIFIES rather
      than as counter-evidence. Read whole, the paper points the other way: the
      dominant finding is that NR1, NR2B and GLT1 mRNA all decrease with
      severity, the authors attribute the NMDAR loss to neuronal loss rather than
      to receptor regulation, and they read the astrocytic GLT1 proliferation as
      "a compensatory mechanism protecting neostriatal neurons from glutamate
      excitotoxicity" — the opposite of the report's gloss that reduced per-cell
      GLT1 implies impaired clearance. Retained only with that correction, and
      curated in the entry with the authors' own compensatory reading.
    citations:
      - PMID:9100675
  - claim_id: late-corticostriatal-disconnection-limits-the-model
    statement: >-
      Corticostriatal glutamate release becomes undetectable in HD mice, so
      excitotoxicity cannot account for continued neurodegeneration once
      disconnection has occurred.
    disposition: QUALIFIED
    report_quote: >-
      optogenetically-induced glutamate release from M2 cortex terminals in the
      dorsolateral striatum (DLS) was undetectable in HD mice and striatal
      neurons show blunted electrophysiological responses
    rationale: >-
      Verbatim in the PMID:33016873 abstract, and the inference is sound and
      important — it bounds the hypothesis in time, which is the report's best
      qualifying contribution. Qualified on two points the report adds beyond the
      source: the abstract says "in HD mice" without the report's "In late-stage
      mice" staging, and it reports no measurement supporting a preceding phase
      of glutamate excess, so the "biphasic" shape is assembled from two
      literatures rather than observed in one experiment.
    citations:
      - PMID:33016873
      - PMID:33198566
  - claim_id: nmdar-antagonist-trials-failed
    statement: >-
      NMDA receptor antagonists have failed to modify disease progression in
      Huntington disease.
    disposition: QUALIFIED
    report_quote: Remacemide and memantine clinical trials showed no disease modification in HD
    rationale: >-
      Half-supported by its own citations. PMID:15717010 does support it, stating
      that "many NMDA receptor antagonists have disappointingly failed advanced
      clinical trials for a number of diseases including stroke and
      neurodegenerative disorders such as Huntington's disease". PMID:11554551,
      the report's other citation for this gap, does not: it is a 2001 review
      written before the readout and says the opposite tense — "Phase III
      clinical trials are ongoing with remacemide for epilepsy and Huntington's
      disease". Neither paper is a trial report, and neither mentions a memantine
      HD trial at all, so the specific "remacemide and memantine" pairing is
      unsourced here. Curated using PMID:15717010 only.
    citations:
      - PMID:15717010
      - PMID:11554551
  - claim_id: memantine-modest-benefit-in-hd
    statement: >-
      Memantine confers modest clinical benefit in HD through preferential
      blockade of extrasynaptic NMDA receptors.
    disposition: REJECTED
    report_quote: memantine shows modest benefit via preferential extrasynaptic blockade
    rationale: >-
      Not supported by the cited source. PMID:15717010 establishes only the
      pharmacology — memantine is an open-channel blocker that preferentially
      blocks excessive NMDAR activity — and reports its approval for Alzheimer
      dementia, not any HD efficacy result. No HD trial is cited anywhere in the
      report for a memantine benefit. Not curated.
    citations:
      - PMID:15717010
  - claim_id: somatic-expansion-is-upstream-of-excitotoxicity
    statement: >-
      Somatic CAG repeat expansion driven by mismatch-repair genes sits upstream
      of excitotoxicity, so NMDAR redistribution is a downstream effector rather
      than an independent initiating lesion.
    disposition: QUALIFIED
    report_quote: >-
      This finding repositions excitotoxicity as a downstream consequence of
      somatic expansion rather than an independent initiating lesion.
    rationale: >-
      The somatic-expansion premise is already curated in this entry from
      PMID:39938516, PMID:22970194 and PMID:37177784, so the upstream claim is
      not new. The ordering assertion, however, is stated as established while
      the report's own Gap 1 concedes it is untested — no experiment has shown
      that blocking somatic expansion prevents the synaptic-to-extrasynaptic
      NMDAR shift. Recorded as the knowledge gap the report itself identified,
      not as a curated causal edge.
    citations:
      - PMID:39938516
      - PMID:38387080
  - claim_id: no-human-genetic-support-for-glutamate-receptor-pathway
    statement: >-
      HD onset-modifier GWAS converge on mismatch-repair genes and return no
      glutamate-receptor-pathway signal, which is evidence against excitotoxicity
      being rate-limiting for onset.
    disposition: QUALIFIED
    report_quote: GWAS modifiers converge on MMR genes, not glutamate receptor genes
    rationale: >-
      The observation is correct and is the sharpest argument in the report, but
      it is asserted from recollection: no GWAS paper is cited at this point, no
      release or summary statistics are named, and absence of a genome-wide
      significant signal in a modifier GWAS is weak evidence of no effect for a
      pathway whose contribution may be downstream of onset. Curated as one leg
      of a HUMAN_MODEL_MISMATCH discussion rather than as an assertion of no
      involvement.
    citations:
      - PMID:39938516
  - claim_id: candidate-ontology-terms
    statement: >-
      The report proposes cell-type and biological-process CURIEs for the
      excitotoxicity pathway, including GO:0070997 for neuron death.
    disposition: REJECTED
    report_quote: GO:0070997 (neuron death)
    rationale: >-
      GO:0070997 is obsolete — the repository term cache records its label as
      "obsolete neuron death" — so binding it would be a defect. Of the rest,
      CL:1001474 (medium spiny neuron), CL:0000127 (astrocyte), UBERON-level
      striatum, GO:0007215 (glutamate receptor signaling pathway) and GO:0006816
      (calcium ion transport) are all present in the caches and were used where
      they fit; CL:0000540 (neuron) is too broad to add anything beside
      CL:1001474. Term leads from a report are not usable without cache
      re-derivation, and this one is the demonstration of why.
    citations: []
  - claim_id: status-change-retain-alternative
    statement: >-
      The hypothesis status should remain ALTERNATIVE with a richer annotation
      rather than being reclassified.
    disposition: RETAINED
    report_quote: ALTERNATIVE (retain) — with enhanced annotation
    rationale: >-
      Agreed and acted on literally: status untouched, annotation added. The
      report also floats reclassifying to "CONTRIBUTING_FACTOR", which is not a
      permissible value of the KB's hypothesis status enum and was not pursued.
    citations: []
  - claim_id: corpus-size-not-reconstructible
    statement: >-
      The report characterizes its evidence base as 71 papers reviewed with 9
      findings confirmed.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      71 papers spanning human postmortem studies, genetic mouse models,
      single-cell transcriptomics, electrophysiology, and clinical trial data
    rationale: >-
      openscientist.md.citations.md lists 34 PMIDs. Roughly half the claimed
      corpus cannot be identified, so the breadth claim cannot be checked and
      should not be relayed into the KB as a measure of evidence weight. The
      corresponding notes I added to the disorder entry cite the report by path
      and do not repeat the paper count.
    citations: []

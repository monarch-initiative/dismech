analyses:
  - analysis_id: literature-evidence-matrix
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature synthesis rendered as a 23-row evidence matrix with
      hand-assigned direction and confidence, an ASCII causal-chain diagram, and
      a prose classification of links as strong, moderate, or inferred/weak.
    comparison: >-
      Seed toxic gain-of-function model versus somatic CAG instability
      (upstream), loss of normal huntingtin function (parallel), RNA toxicity
      (parallel), excitotoxicity (downstream), mitochondrial dysfunction
      (downstream), and non-cell-autonomous glial mechanisms (parallel).
    input_data_source_ids:
      - pubmed-literature-search
    status_reason: >-
      There is no openscientist_artifacts bundle for this hypothesis. No figures
      are claimed, so nothing is promised that does not exist, but the tables are
      prose and the confidence grades (Very High through Moderate) carry no
      stated rubric. The report describes itself accurately as "a narrative
      review rather than a systematic review or meta-analysis".
    limitations: >-
      Half the claimed corpus is unidentifiable. The report's own stated temporal
      bias toward 2020-2026 literature means the weighting of somatic
      instability against older mechanisms reflects retrieval, not evidence
      weight. One proposed evidence snippet (PMID:39938516) is a paraphrase
      presented as a quotation.
claims:
  - claim_id: verdict-supported-with-qualifications
    statement: >-
      The toxic gain-of-function model is the best-validated mechanism in HD and
      should remain CANONICAL, subject to three qualifications - somatic
      expansion upstream, loss of function in parallel, and RNA toxicity as an
      additional layer.
    disposition: QUALIFIED
    report_quote: "Verdict: SUPPORTED — with significant qualifications requiring model refinement"
    rationale: >-
      The conclusion is correct and the status is right, but it is almost
      entirely seed-derived: this entry's hypothesis notes already recorded all
      three qualifications, citing this same report, before this assessment
      began. Graded PARTIALLY_SUPPORTED at the report level because the report's
      own Gaps 1 to 4 - toxic species unknown, striatal selectivity unexplained,
      RNA-versus-protein split unquantified, HTT-lowering trials failed - sit
      directly on the causal path being defended. Status left CANONICAL.
    citations:
      - PMID:22180703
      - PMID:25336039
  - claim_id: somatic-expansion-is-necessary-amplifier
    statement: >-
      Inherited repeat length is necessary but not sufficient; mismatch-repair
      driven somatic expansion in vulnerable striatal neurons is what carries the
      tract past the aggregation threshold.
    disposition: RETAINED
    report_quote: >-
      the inherited repeat length is a necessary but not sufficient determinant
      of toxicity
    rationale: >-
      Correct, and already fully curated in this entry - the Somatic CAG Repeat
      Expansion pathophysiology node exists, and the hypothesis carries
      PMID:39938516, PMID:22970194 and PMID:37177784 for exactly this claim. No
      integration followed. Recorded as RETAINED rather than QUALIFIED because
      the claim is sound; it is simply not new.
    citations:
      - PMID:39938516
      - PMID:22970194
      - PMID:37177784
  - claim_id: msh3-snippet-is-a-paraphrase
    statement: >-
      The report offers a verbatim evidence snippet for PMID:39938516 stating
      that Msh3 deficiency prevents mHtt aggregation by keeping somatic MSN CAG
      length below 150.
    disposition: REJECTED
    report_quote: "Msh3 deficiency prevents mHtt aggregation by keeping somatic MSN CAG length below 150."
    rationale: >-
      The cached abstract reads "Msh3 or Pms1 deficiency prevents mHtt
      aggregation by keeping somatic MSN CAG length below 150." The report drops
      "or Pms1" and presents the result as a quotation under a "Snippet:"
      heading. The error narrows rather than inflates the claim, but a proposed
      snippet that is not a substring of the source would fail this repository's
      reference validation, and it is the concrete reason report snippets are
      re-derived from the cache rather than copied.
    citations:
      - PMID:39938516
  - claim_id: mtrna-release-drives-neuronal-innate-immune-activation
    statement: >-
      Mutant huntingtin causes release of mitochondrial RNA into the cytoplasm of
      striatal spiny projection neurons, where it binds protein kinase R and
      activates innate immune signalling.
    disposition: RETAINED
    report_quote: >-
      In striatal spiny projection neurons, the most vulnerable cell type in HD,
      we observe a release of mitochondrial RNA (mtRNA)...and a concomitant
      upregulation of innate immune signaling.
    rationale: >-
      Verified against the cached PMID:32681824 text, including the part the
      report's ellipsis omits - that the released mtRNAs bind protein kinase R
      directly, which is what makes this a mechanism rather than a correlation.
      The study profiled human HD caudate/putamen by snRNA-seq alongside R6/2 and
      zQ175DN mice by snRNA-seq and TRAP. This is the report's best contribution:
      the entry had Mitochondrial Dysfunction and Neuroinflammation as separate
      nodes with no mechanistic link between them, and this supplies one.
      Promoted as a new pathophysiology node.
    citations:
      - PMID:32681824
  - claim_id: human-snrnaseq-confirms-ispn-vulnerability
    statement: >-
      Indirect-pathway spiny projection neurons are lost preferentially with
      advancing grade in human HD striatum.
    disposition: RETAINED
    report_quote: >-
      mHTT leads to mitochondrial RNA release and concomitant upregulation of
      innate immune signaling
    rationale: >-
      A finding the report does not itself highlight, recovered from the cached
      full text of the paper it cites for the mtRNA claim: the number of iSPNs
      decreases with human HD grade progression, "confirming reports of enhanced
      iSPN vulnerability in human HD that were based upon marker gene expression
      studies". The entry's D2 Receptor Medium Spiny Neuron Selective
      Vulnerability node was resting on mouse and marker-gene evidence; this is
      direct human single-nucleus confirmation. Promoted there.
    citations:
      - PMID:32681824
  - claim_id: rna-level-toxicity-is-a-parallel-layer
    statement: >-
      Expanded CAG repeats in HTT mRNA cause toxicity independently of the
      protein, through mislocalized transcripts, sequestration of RNA-binding
      proteins with consequent splicing defects, and aberrant small CAG RNA
      biogenesis.
    disposition: QUALIFIED
    report_quote: >-
      Independent of protein-level effects, expanded CAG repeats in HTT mRNA can
      directly cause toxicity.
    rationale: >-
      The mechanisms are accurately reported from PMID:27529325, but the report
      states the claim more confidently than its own source does. The review's
      closing sentence is a caveat the report does not carry: "Although these
      altered pathways have been detected in HD models, their contribution to
      disease development and progress requires further study." Promoted as a
      pathophysiology node because the entry represented no RNA-level mechanism
      at all, but curated with that caveat in the node description and the
      caveat sentence as the evidence snippet, and the report's proposal to
      create a separate EMERGING hypothesis entry for it was not followed - a
      2016 review with no in-vivo quantification is not enough to stand up a
      hypothesis group.
    citations:
      - PMID:27529325
      - PMID:33172304
  - claim_id: caa-interruptions-abolish-instability-in-human-neurons
    statement: >-
      Engineering four internal CAA interruptions into the HTT CAG tract
      abolishes somatic instability and reverses HD cellular phenotypes in human
      stem-cell-derived neurons.
    disposition: RETAINED
    report_quote: >-
      four internal CAA interruptions completely abolish CAG instability and
      reverse HD phenotypes
    rationale: >-
      Verified verbatim in the PMID:41389205 abstract. The entry already has an
      Uninterrupted CAG Tract Length and Loss of CAA Interruption node, but its
      evidence is human genetic association (PMID:31398342, PMID:31104771); this
      is an isogenic interventional demonstration in human neurons, which is a
      different and stronger claim about the same node. Promoted.
    citations:
      - PMID:41389205
  - claim_id: mhtt-directly-inhibits-core-transcription-apparatus
    statement: >-
      Mutant huntingtin directly inhibits Sp1 and core transcription-apparatus
      components TFIID and TFIIF in a polyglutamine-dependent manner, and
      restoring RAP30 rescues striatal neurons.
    disposition: RETAINED
    report_quote: >-
      Sp1, TFIID, TFIIF, and other components of the core transcription apparatus
      in a polyQ-dependent manner
    rationale: >-
      Verified in the PMID:16377565 abstract, which also carries a rescue arm the
      report does not mention: overexpressing RAP30 in cultured primary striatal
      cells protects neurons from mutant huntingtin toxicity and relieves
      repression of the dopamine D2 receptor gene. The entry's transcriptional
      hypothesis rests on sequestration of Sp1, CBP and REST; this adds
      polyQ-dependent inhibition of the basal apparatus itself, plus a D2-gene
      link that connects it to the D2 selective-vulnerability node. Promoted.
    citations:
      - PMID:16377565
  - claim_id: gain-and-loss-of-function-coexist
    statement: >-
      Mutant huntingtin contributes toxicity through both gain of function by the
      misfolded aggregate and loss of function through sequestration of wild-type
      huntingtin and other proteins.
    disposition: QUALIFIED
    report_quote: mHTT aggregates sequestering wild-type HTT and other essential proteins
    rationale: >-
      Supported by PMID:31203656, but that source is a structural-biology review
      that states the dual mechanism as a likelihood ("thereby likely
      contributing to disease toxicity through a combination of..."), not a
      result. The entry's hypothesis notes already record this qualification. Not
      promoted as new evidence; the claim is real but this report supplies
      review-level restatement of something already curated.
    citations:
      - PMID:31203656
      - PMID:22932724
  - claim_id: primary-toxic-species-unknown
    statement: >-
      It is unresolved whether soluble oligomers, protofibrils, mature fibrils or
      inclusion bodies are the primary toxic species, and inclusions may be
      protective.
    disposition: RETAINED
    report_quote: >-
      Whether soluble oligomers, protofibrils, mature fibrils, or inclusion
      bodies are the primary drivers of toxicity.
    rationale: >-
      A genuine and consequential gap, correctly identified, and the entry does
      not record it. It is the gap that most directly qualifies this hypothesis:
      the entry's Mutant Huntingtin Protein Aggregation node names aggregation as
      the toxic event without saying which species does the damage. Not
      integrated in this pass - two knowledge-gap discussions were already added
      to this entry from the sibling reports and a third would be padding - but
      flagged here as the strongest remaining uncurated lead from this report.
    citations:
      - PMID:31880908
      - PMID:31203656
  - claim_id: htt-lowering-trials-failed
    statement: >-
      First-generation HTT-lowering trials, both non-allele-selective
      (Tominersen) and allele-selective (WVE-120101/120102), failed to show
      efficacy, which is in tension with a simple gain-of-function model.
    disposition: QUALIFIED
    report_quote: >-
      Clinical trials of ASOs Tominersen (non-allele-selective) and
      WVE-120101/WVE-120102 (allele-selective) failed to show efficacy.
    rationale: >-
      True, and already curated in this entry from PMID:38861215 - the same
      review the report names as what it checked. The report adds nothing beyond
      what the entry holds, and explicitly did not retrieve the trial
      publications themselves. No integration.
    citations:
      - PMID:38861215
  - claim_id: prion-like-spreading-via-phagocytic-glia
    statement: >-
      Mutant huntingtin aggregates transfer between neurons across synapses via
      phagocytic glia, giving the disease a prion-like spreading component.
    disposition: NEEDS_VERIFICATION
    report_quote: mHTT aggregates transfer across neuronal synapses via phagocytic glia
    rationale: >-
      Cited to PMID:32463364, a Drosophila study, and graded by the report itself
      as Moderate confidence. Trans-synaptic spread of mutant huntingtin in a fly
      model is a long way from human HD, and the entry has no spreading mechanism
      to attach it to. Not fetched, not checked against the source, and not
      curated; recorded here so a later curator knows it was seen and left.
    citations:
      - PMID:32463364
  - claim_id: candidate-new-hypothesis-rna-toxicity
    statement: >-
      RNA toxicity should be added to the knowledge base as a separate EMERGING
      hypothesis group.
    disposition: REJECTED
    report_quote: 'Candidate new hypothesis:** "RNA Toxicity" — status: **EMERGING**'
    rationale: >-
      The mechanism is worth representing, and was, as a pathophysiology node.
      A separate hypothesis group is not warranted on this evidence: the sole
      supporting citation is a 2016 narrative review whose own conclusion is that
      the contribution of these pathways "requires further study", and the report
      supplies no primary in-vivo result. A hypothesis group in this KB carries
      its own status and evidence block and should not be stood up on one review.
    citations:
      - PMID:27529325
  - claim_id: candidate-ontology-terms
    statement: >-
      The report proposes ontology terms for the mechanism, including
      DOID:12858 for Huntington disease and GO:0006986 for response to unfolded
      protein.
    disposition: REJECTED
    report_quote: "DOID:12858 (Huntington's disease)"
    rationale: >-
      DOID is not a prefix this repository uses or can validate - disease
      identity here is MONDO, and this entry is already bound to MONDO:0007739.
      Of the biological-process suggestions, GO:0006298 (mismatch repair) and
      GO:0016236 (macroautophagy) are plausible but were not needed for the nodes
      added; the cell-type list is prose rather than CURIEs except for
      CL:1001474, which the entry already uses. As in the sibling reports, no
      report-supplied CURIE was used without re-derivation from the caches.
    citations: []
  - claim_id: corpus-size-not-reconstructible
    statement: >-
      The report characterizes its evidence base as 81 primary research articles
      and reviews.
    disposition: NEEDS_VERIFICATION
    report_quote: 81 primary research articles and reviews
    rationale: >-
      openscientist.md.citations.md lists 44 PMIDs. About half the claimed corpus
      cannot be identified, so the breadth claim cannot be checked and was not
      relayed into the disease entry. This is the same shortfall pattern seen in
      the other three Huntington disease reports.
    citations: []

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_toxic_gain_of_function
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The broadest of the four Huntington disease reports (44 citations) and the one
  whose headline conclusion is least informative, because the seed it was given
  is the most firmly established mechanism in the field. Its executive judgment
  restates the curated entry: polyQ expansion beyond ~36 repeats is toxic,
  somatic expansion amplifies it, loss of normal huntingtin function runs
  alongside. All three of those, and the citations behind them, were already in
  kb/disorders/Huntington_Disease.yaml before this report - the hypothesis notes
  say so, naming this report.

  What the report does add is three mechanisms the entry genuinely lacked, and I
  verified each against the cached source before promoting it. PMID:32681824 is
  the most valuable: single-nucleus profiling of human HD caudate/putamen plus
  two mouse models shows mutant huntingtin drives release of mitochondrial RNA
  into the cytoplasm of spiny projection neurons, where it binds protein kinase R
  and activates innate immune signalling. That is a concrete mechanistic bridge
  from mitochondrial damage to the neuroinflammation node, and nothing in the
  entry described it. The same paper supplies human snRNA-seq confirmation that
  indirect-pathway SPNs are lost preferentially with grade, which the entry's D2
  selective-vulnerability node was asserting from mouse and marker-gene work.
  PMID:27529325 supplies RNA-level toxicity, a pathogenic layer independent of
  the protein that the entry's causal graph did not represent at all.
  PMID:41389205 supplies an isogenic human demonstration that engineered CAA
  interruptions abolish somatic instability and reverse HD cellular phenotypes.

  I record PARTIALLY_SUPPORTED rather than the report's SUPPORTED. Not because
  the gain-of-function model is in doubt - it is not - but because this
  assessment grades what the report established, and on its own account the
  identity of the toxic species is unknown, the basis of striatal selectivity is
  unknown, the RNA-versus-protein split is unquantified, and the first
  generation of HTT-lowering trials failed. A report whose four largest gaps sit
  on the causal path it is defending has not delivered SUPPORTED.

  One snippet fidelity problem worth recording: the report's proposed evidence
  snippet for PMID:39938516 reads "Msh3 deficiency prevents mHtt aggregation by
  keeping somatic MSN CAG length below 150", but the paper says "Msh3 or Pms1
  deficiency". Small, and in the direction of narrowing rather than
  overclaiming, but it is a paraphrase presented as a quotation and would have
  failed snippet validation.
data_sources:
  - data_source_id: pubmed-literature-search
    source_type: DATABASE
    name: PubMed
    access_status: UNVERIFIABLE
    query: >-
      Not stated. The report says only that the evaluation "is based on 81
      papers identified through PubMed searches".
    notes: >-
      No query, date filter, search log or result set is committed under the
      hypothesis directory, which holds only openscientist.md and its citations
      sidecar. openscientist.md.citations.md lists 44 PMIDs against 81 claimed,
      so roughly half the corpus is unidentifiable. The report is candid about a
      related bias - that its search "overrepresents recent literature
      (2020-2026), particularly on somatic instability" - which is visible in the
      citation list and is a reason to treat its balance of mechanisms as a
      product of the search rather than of the field.
  - data_source_id: hd-gwas-modifier-studies
    source_type: DATABASE
    name: HD onset-modifier GWAS (GeM-HD and related)
    access_status: CITED_NOT_ACCESSED
    identifier: PMID:32898862
    notes: >-
      Unlike its sibling reports this one does cite GWAS modifier studies by
      identifier (PMID:39801710, PMID:32898862) rather than gesturing at "GWAS".
      Still cited rather than queried - no summary statistics, release or
      accession is named - but the claim is at least traceable to a source.
  - data_source_id: hd-clinical-trial-landscape

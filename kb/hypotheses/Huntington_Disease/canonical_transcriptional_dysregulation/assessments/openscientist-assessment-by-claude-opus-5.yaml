schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_transcriptional_dysregulation
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The most useful of the four Huntington disease reports, because it is the only
  one that found the curated entry to be wrong rather than merely incomplete.

  The entry's hypothesis description reads that mutant huntingtin "disrupts
  transcriptional regulation by sequestering key transcription factors and
  co-activators (Sp1, CBP, REST/NRSF)". The report surfaces the study that tested
  that model directly and failed to confirm it: PMID:11971872 examined TBP, CBP
  and Sp1 in HD mice by immunohistochemistry, double labelling, electron
  microscopy and western blot, and found all three diffusely distributed in the
  nucleus despite abundant intranuclear inclusions, with no difference from
  wild-type and no trapping in inclusions. It then supplies the study that
  resolves the contradiction: PMID:15225551 shows that monomers and small soluble
  oligomers of huntingtin exon 1 inhibit TBP in a polyQ-dependent manner by
  structurally destabilizing it, explicitly independent of insoluble
  co-aggregate formation, and that Hsp70/Hsp40 chaperones block the conformational
  change and prevent the deactivation. I fetched and read both, plus
  PMID:11988536, PMID:17596446 and PMID:16766198, and all five say what the
  report says they say.

  So the mechanism is functional inhibition by soluble species, not physical
  trapping in visible aggregates - and the KB was asserting the trapping model in
  its description prose. That prose has been rewritten and both sides of the
  contradiction curated, with a CONTROVERSY discussion recording that the CBP arm
  is genuinely disputed rather than settled.

  The report also fills in the arm the entry was weakest on. Its REST/NRSF
  evidence was a 2003 paper; PMID:17596446 adds genome-wide ChIP-on-chip in human
  postmortem HD brain plus the loss-of-function phenocopy - huntingtin depletion
  reproduces the same REST occupancy phenotype - which is a stronger claim than
  anything previously curated here.

  Where I part company with the report is its verdict and one inference. SUPPORTED
  overstates a hypothesis whose central mechanistic clause the report itself
  spends two findings correcting, so I record PARTIALLY_SUPPORTED. And its use of
  PMID:40482637 to argue that transcriptional change is not the earliest event is
  self-undermining: that study is spatial transcriptomics, so its "mitochondrial
  deficits" are themselves transcriptional measurements, and the same abstract
  reports striatal identity genes changing at the same early timepoint.

  Third demonstrably wrong ontology lead in this set: CL:0000617 is "GABAergic
  neuron", not medium spiny neuron.
data_sources:
  - data_source_id: pubmed-literature-search
    source_type: DATABASE
    name: PubMed
    access_status: UNVERIFIABLE
    query: >-
      Not stated. The report describes "Our systematic evaluation of 89 papers"
      without giving queries, filters, inclusion criteria, or dates.
    notes: >-
      Calling the evaluation "systematic" is not supportable from what is
      committed: no protocol, query string, screening record or result set exists
      under the hypothesis directory, which holds only openscientist.md and its
      citations sidecar. openscientist.md.citations.md lists 32 PMIDs against 89
      claimed.
  - data_source_id: hd-gwas-modifier-studies
    source_type: DATABASE
    name: HD onset-modifier GWAS
    access_status: CITED_NOT_ACCESSED
    identifier: PMID:40490511
    notes: >-
      Cited by identifier rather than queried. The report draws a specific and
      interesting detail from it - a synonymous CAG-adjacent HTT variant that
      hastens motor onset without increasing somatic expansion - which is a real
      claim about the source rather than a gesture at "GWAS", but no summary
      statistics or release are named and the paper was not fetched for this
      assessment.
  - data_source_id: gencc-clingen-curation
    source_type: DATABASE
    name: GenCC / ClinGen disease-mechanism curation
    access_status: UNVERIFIABLE
    notes: >-
      Gap 7 reports that the transcriptional dysregulation mechanism "has not
      been formally classified in standardized disease mechanism databases". No
      query is recorded, and the observation is true by construction - GenCC and
      ClinGen curate gene-disease validity, not mechanism - so it carries no
      information about this hypothesis.
  - data_source_id: hd-hdac-inhibitor-trials
    source_type: DATABASE
    name: HDAC inhibitor clinical trials in HD
    access_status: UNVERIFIABLE
    notes: >-
      Gap 4 records that "No positive Phase II/III clinical trial results were
      identified" for HDAC inhibitors in HD. This is the one negative search in
      the four Huntington disease reports that states what it looked for and what
      it did not find, so it is closer to a documented negative than anything
      else in this set. It still falls short of SEARCHED_NO_RESULT: no registry,
      query string, date or search log is committed, and prose alone is not a
      search record. The underlying claim is very likely correct.
analyses:
  - analysis_id: literature-evidence-matrix
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature synthesis rendered as an evidence matrix with
      hand-assigned direction and confidence, a numbered causal chain, and prose
      sections separating strong links, inferred or weak links, and missing
      causal steps.
    comparison: >-
      Seed transcriptional-dysregulation model versus somatic CAG expansion
      (upstream), H3K9me3/HDAC epigenetic silencing (parallel), mitochondrial
      dysfunction (downstream and parallel), excitotoxicity (parallel), BDNF
      transport deficit (downstream), and aberrant HTT mRNA processing
      (parallel).
    input_data_source_ids:
      - pubmed-literature-search
      - hd-hdac-inhibitor-trials
    status_reason: >-
      There is no openscientist_artifacts bundle. The report embeds a figure
      placeholder ({{figure:evidence_matrix.png}}) that resolves to no committed
      file. Its confidence grades carry no stated rubric, and it describes itself
      as a "systematic evaluation" while supplying none of the apparatus that
      would make it one.
    limitations: >-
      Roughly two-thirds of the claimed corpus is unidentifiable from the
      citation sidecar. The "Where Links Are Inferred or Weak" section is the
      most valuable part of the report and is also entirely judgment.
claims:
  - claim_id: verdict-supported-with-refinement
    statement: >-
      Transcriptional dysregulation is a well-supported canonical mechanism in HD
      but requires mechanistic refinement and should stay CANONICAL.
    disposition: QUALIFIED
    report_quote: "Verdict: SUPPORTED — with mechanistic refinement required"
    rationale: >-
      The status call is right and was acted on - CANONICAL retained. The grade
      is not. The report devotes two of its six findings to showing that the
      hypothesis's central mechanistic clause, sequestration of transcription
      factors into aggregates, is not what the data show, and a further gap to
      the failure of transcription-targeted therapy in the clinic. A hypothesis
      whose stated mechanism has to be rewritten mid-report is
      PARTIALLY_SUPPORTED, not SUPPORTED. The distinction matters here because
      the KB description was carrying the superseded mechanism.
    citations:
      - PMID:11971872
      - PMID:15225551
  - claim_id: sequestration-into-aggregates-not-observed
    statement: >-
      TBP, CBP and Sp1 are not depleted from the nucleus or trapped in
      huntingtin inclusions in HD mouse brain, contradicting the physical
      sequestration model.
    disposition: RETAINED
    report_quote: >-
      All three transcription factors were diffusely distributed in the nucleus,
      despite the presence of abundant intranuclear inclusions.
    rationale: >-
      Verified verbatim in the PMID:11971872 abstract, and the paper is more
      thorough than the report conveys: it tested the model four ways
      (immunohistochemistry, double labelling, electron microscopy and western
      blot), and the authors' own conclusion is that altered gene expression
      "may result from the interactions of soluble mutant huntingtin with
      nuclear transcription factors, rather than from the depletion of
      transcription factors by nuclear inclusions". This is the single most
      consequential thing any of the four Huntington disease reports found,
      because the disease entry's hypothesis description asserted the model this
      paper failed to confirm. Promoted as REFUTE evidence and the description
      rewritten.
    citations:
      - PMID:11971872
  - claim_id: soluble-oligomers-deactivate-tbp-by-destabilization
    statement: >-
      Monomers and small soluble oligomers of huntingtin exon 1 inhibit TBP in a
      polyglutamine-dependent manner by structurally destabilizing it,
      independently of insoluble co-aggregate formation, and chaperones block
      the responsible conformational change.
    disposition: RETAINED
    report_quote: >-
      monomers or small soluble oligomers of huntingtin exon1 accumulate in the
      nucleus and inhibit the function of TBP in a polyQ-dependent manner
    rationale: >-
      Verified verbatim in the PMID:15225551 abstract, which also carries the two
      details that make it a resolution rather than a third opinion: the
      inhibition is "independent of the formation of insoluble coaggregates",
      and Hsp70/Hsp40 chaperones interfere with the conformational change and
      inhibit TBP deactivation. That chaperone result is a manipulation, not an
      observation, which is what lets it arbitrate between the two models.
      Promoted, and the entry's mechanism prose rewritten around it.
    citations:
      - PMID:15225551
  - claim_id: mechanism-is-functional-inhibition-not-trapping
    statement: >-
      The hypothesis should describe functional inhibition of transcription
      factors by soluble and oligomeric mutant huntingtin rather than physical
      trapping in visible aggregates.
    disposition: RETAINED
    report_quote: >-
      The mechanism should therefore be described as functional inhibition by
      soluble/oligomeric mutant huntingtin (mHTT) species rather than physical
      trapping in visible aggregates.
    rationale: >-
      This is the report's recommendation and it is correct on the sources I
      checked. Acted on directly: the canonical_transcriptional_dysregulation
      description and the Transcriptional Dysregulation node description in
      kb/disorders/Huntington_Disease.yaml both said "sequestering", and both
      were rewritten. Note the correction does not overturn the entry's existing
      REST/NRSF evidence, which is about cytoplasmic retention of a repressor by
      wild-type huntingtin - a different claim that the counter-evidence does not
      touch.
    citations:
      - PMID:11971872
      - PMID:15225551
  - claim_id: cbp-depletion-is-contested-not-settled
    statement: >-
      Whether CBP is physically depleted or only functionally impaired is
      genuinely disputed: single-cell work finds depletion accompanied by histone
      hypo-acetylation with rescue by CBP overexpression, while whole-brain work
      in mice finds no depletion.
    disposition: RETAINED
    report_quote: cell toxicity was accompanied by CBP depletion, rather than merely recruitment
    rationale: >-
      Both sides verified. PMID:16766198 reports the single-cell result including
      the full rescue chain - CBP depletion, histone hypo-acetylation, toxicity,
      all reversed by CBP overexpression - and is explicit that "the role of CBP
      has been controversial". PMID:11971872 reports the negative. The report is
      right that these are not reconcilable by preferring one, and its proposed
      explanation (different model systems and detection methods) is plausible
      but untested. Curated as a CONTROVERSY discussion carrying both, rather
      than by picking a side.
    citations:
      - PMID:16766198
      - PMID:11971872
  - claim_id: rest-nrsf-arm-has-genome-wide-and-loss-of-function-validation
    statement: >-
      REST/NRSF occupancy is increased at multiple RE1/NRSE loci in HD cells,
      animal models and postmortem human brain; depleting endogenous huntingtin
      reproduces the same phenotype; and attenuating REST binding restores BDNF.
    disposition: RETAINED
    report_quote: >-
      increased binding of the RE1 silencing transcription factor/neuron-restrictive
      silencer factor (REST/NRSF) repressor occurs at multiple genomic RE1/NRSE
      loci in HD cells, in animal models, and in postmortem brains
    rationale: >-
      Verified verbatim in the PMID:17596446 abstract. The report is right that
      this is the best-evidenced arm, and right about why: the loss-of-function
      phenocopy means the REST phenotype follows from absence of wild-type
      huntingtin function, not only from presence of the mutant, which is a
      genuinely different claim from the rest of this hypothesis. The entry's
      REST evidence was PMID:12881722 alone; this adds genome-wide occupancy in
      human brain plus the rescue. Promoted.
    citations:
      - PMID:17596446
      - PMID:12881722
  - claim_id: sp1-inhibition-detectable-presymptomatically
    statement: >-
      Soluble mutant huntingtin inhibits Sp1 DNA binding in postmortem brain from
      presymptomatic as well as affected HD patients, and co-expressing Sp1 with
      TAFII130 reverses repression of the dopamine D2 receptor gene and protects
      striatal neurons.
    disposition: RETAINED
    report_quote: >-
      soluble mutant huntingtin inhibits Sp1 binding to DNA in postmortem brain
      tissues from both presymptomatic and symptomatic HD patients
    rationale: >-
      Verified in the PMID:11988536 abstract, which says "presymptomatic and
      affected" where the report writes "presymptomatic and symptomatic" - a
      narrative paraphrase, not presented as a quotation, so not a defect, but
      the curated snippet uses the paper's wording. Two things make this worth
      promoting: the human presymptomatic detection places the lesion before
      clinical onset, and the paper independently reports that the interaction is
      with soluble huntingtin, which is the same conclusion PMID:15225551
      reaches by a different route.
    citations:
      - PMID:11988536
  - claim_id: hdac3-inhibition-also-suppresses-somatic-expansion
    statement: >-
      A selective HDAC3 inhibitor prevents cognitive and motor-learning deficits
      in HdhQ111 mice and also suppresses striatal CAG repeat expansions.
    disposition: RETAINED
    report_quote: >-
      Suelves et al. (2017) showed HDAC3 inhibition prevented cognitive deficits
      and, remarkably, suppressed striatal CAG expansions in HD mice
    rationale: >-
      Verified in the PMID:28729730 abstract. The report's word "remarkably" is
      earned: a chromatin-targeting intervention reaching back up to modify the
      DNA-repair-driven process the field now treats as upstream makes the
      hierarchy less strictly linear than the rest of the report assumes. The
      abstract is also careful to note HDAC3 was already known to "fuel CAG
      repeat expansions in human cells", so this was hypothesis-driven rather
      than serendipitous. Promoted as a treatment-relevant qualifier on the
      epigenetic arm.
    citations:
      - PMID:28729730
  - claim_id: jq1-was-detrimental-in-hd-mice
    statement: >-
      The BET bromodomain inhibitor JQ1 worsened HD-related transcriptional
      pathways and phenotypes selectively in R6/2 mice while improving motor
      performance in non-transgenic controls.
    disposition: RETAINED
    report_quote: >-
      the bromodomain inhibitor JQ1 was selectively detrimental to R6/2 mice,
      worsening HD-related transcriptional pathways
    rationale: >-
      Verified in the PMID:31696228 abstract, which adds the detail that carries
      the warning: JQ1 improved motor performance in non-transgenic mice while
      exacerbating weight loss, worsening the pole test, and increasing a
      mutant-huntingtin-dependent high molecular weight species in R6/2. A
      negative interventional result in the right direction to constrain the
      hypothesis, and the entry recorded no such caution. Promoted.
    citations:
      - PMID:31696228
  - claim_id: mitochondrial-deficits-precede-transcriptional-change
    statement: >-
      Mitochondrial deficits at postnatal day 0 in R6/2 mice precede striatal
      identity gene loss, suggesting transcriptional change is not the earliest
      downstream event.
    disposition: REJECTED
    report_quote: >-
      found mitochondrial deficits at postnatal day 0 in R6/2 mice, preceding
      striatal identity gene loss — suggesting transcriptional changes may not be
      the earliest downstream event
    rationale: >-
      The inference does not follow from the design. PMID:40482637 is Visium
      spatial transcriptomics with matched snRNA-seq; every measurement it makes
      is a transcript measurement, so its "mitochondrial deficits" at P0 are
      themselves transcriptional dysregulation, not an alternative to it. The
      same abstract also reports early Tcf4 dysregulation driving cortical
      changes and that "striatal identity genes show early increased expression
      that becomes progressively downregulated" - early transcriptional change,
      not its absence. What the study actually supports is that different
      transcriptional programs move at different times, which is interesting and
      is not what the report claims. Not curated.
    citations:
      - PMID:40482637
  - claim_id: somatic-expansion-prevents-transcriptionopathy-entirely
    statement: >-
      Preventing somatic expansion by Msh3 knockout prevents transcriptional
      dysregulation entirely, placing mismatch repair causally upstream.
    disposition: QUALIFIED
    report_quote: >-
      preventing somatic expansion via Msh3 knockout also prevents
      transcriptional dysregulation entirely
    rationale: >-
      The upstream ordering is right and is already curated in this entry from
      PMID:39938516. "Entirely" is the report's word and overstates it: the
      cited abstract says Msh3 deficiency "ameliorates open-chromatin
      dysregulation" and corrects synaptic, astrocytic and locomotor defects, not
      that transcriptional dysregulation is abolished. The distinction matters
      because PMID:38387080, already curated in this entry, reports that
      abolishing somatic expansion in zQ175 left "the dysregulated striatal
      transcriptional profile" unchanged - a direct counterexample the report
      does not cite. No integration; the entry already holds both sides.
    citations:
      - PMID:39938516
      - PMID:38387080
  - claim_id: hdac-inhibitor-clinical-translation-failed
    statement: >-
      HDAC inhibitors benefit HD animal models but no positive phase II or III
      clinical result exists.
    disposition: QUALIFIED
    report_quote: >-
      HDAC inhibitors show robust benefit in animal models but have not
      demonstrated efficacy in HD clinical trials.
    rationale: >-
      Reported as a negative search, which is the honest framing, but no
      registry, query or search log is committed and no trial is named on either
      side of the claim. Treated as a genuine gap in the hypothesis's
      therapeutic tractability and folded into the hypothesis notes as a caution,
      not curated as an evidence item, because nothing here is citable.
    citations:
      - PMID:31696228
  - claim_id: candidate-ontology-terms
    statement: >-
      The report proposes CL:0000617 as the CURIE for medium spiny neuron.
    disposition: REJECTED
    report_quote: Medium spiny neuron (CL:0000617)
    rationale: >-
      CL:0000617 is "GABAergic neuron" in the repository term cache; medium spiny
      neuron is CL:1001474, which this entry already uses. This is the third
      wrong ontology lead across the four Huntington disease reports - the
      excitotoxicity report offered the obsolete GO:0070997 and the
      toxic-gain-of-function report offered CL:0000598 (pyramidal neuron) for the
      same concept. Three different wrong CURIEs for medium spiny neuron across
      three reports on one disease is a pattern, not an accident: no
      report-supplied CURIE should be used without cache re-derivation.
    citations: []
  - claim_id: corpus-size-not-reconstructible
    statement: >-
      The report characterizes its evidence base as a systematic evaluation of 89
      papers.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      89 papers spanning primary research, model organism studies, human clinical
      data, and mechanistic reviews
    rationale: >-
      openscientist.md.citations.md lists 32 PMIDs. Beyond the count, "systematic
      evaluation" is a claim about method that nothing committed supports - no
      protocol, no search strategy, no screening record. Not relayed into the
      disease entry.
    citations: []

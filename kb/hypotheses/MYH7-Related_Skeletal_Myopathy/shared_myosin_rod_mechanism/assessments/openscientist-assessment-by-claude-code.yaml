hypothesis_id: shared_myosin_rod_mechanism
assessed_at: "2026-10-16T02:13:30Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The hypothesis says dominant light meromyosin (LMM) variants in MYH7 and MYH2
  share one defect: loss of the myosin super-relaxed state (SRX) and raised basal
  ATP demand. OpenScientist calls it partially supported and says it should stay
  EMERGING. The second half of that verdict is right. The functional claim rests
  on exactly one study, PMID:37788100 (Carrington et al. 2023, one consortium).
  Its full text does report the shared phenotype: SRX was reduced in type IIA
  fibres from MYH2 patients and in beta/slow fibres from MYH7 patients, each
  relative to controls and to fibres of the other genotype. Contractility was
  unaffected. The report adds nothing that replicates this. Its other "support"
  is either not independent or not about these variants. The sequence analysis
  restates an observation the seed paper already made (variants sit on charged
  exterior coiled-coil positions). The cryo-EM structure (PMID:37131793) is a
  wild-type cardiac motor. The mavacamten study (PMID:39216086) is the same
  senior author's lab, in nebulin myopathy. What the report does well is
  qualification. It finds and correctly quotes the published dispute over
  whether SRX equals the folded-back interacting-heads motif and whether the
  mantATP assay measures SRX at all (PMID:38103642, PMID:31540109,
  PMID:40727670). It also notes that the recessive MYH2 series and the
  aggregate pathologies fall outside the energetic model. Citations are sound:
  all 20 PMIDs resolve to the papers described and all 8 quoted passages match
  the source verbatim. The computational analysis is not reproducible from the
  bundle: the script it names (code/lmm_rod_analysis.py), an environment record
  and a MANIFEST.yaml are all absent. It also has design problems that weaken
  its p-value. Verdict: weakly supported and unresolved. The finding is real but
  single-study, and the head-sequestration interpretation is contested. A shared
  mechanism module is not yet justified. Nothing here is promoted into either
  disease entry.

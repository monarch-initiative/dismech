      responses are not committed and no MANIFEST.yaml binds them.
    limitations: >-
      ClinVar counts are whole-gene and irrelevant to the hypothesis. The trial
      null is confined to four text queries.
claims:
  - claim_id: single-study-functional-convergence
    statement: >-
      MYH7 and MYH2 LMM variants both lose the super-relaxed state and raise
      basal ATP demand while sparing contractility, measured side by side.
    disposition: QUALIFIED
    report_quote: >-
      basal myosin ATP consumption was increased and the myosin super-relaxed
      state was decreased in vivo
    rationale: >-
      The claim is true of the one study it comes from and the quote is verbatim
      from PMID:37788100. The full text confirms the genotype-specific result:
      SRX fell in type IIA fibres from MYH2 patients and in beta/slow fibres
      from MYH7 patients, each relative to controls and to the other genotype,
      with contractility preserved. Qualified, not retained, because it is one
      consortium's single study with no independent MYH2 replication, no
      per-variant effect sizes, and it rests on the mantATP assay a later paper
      disputes. The report does not add replication; it restates this study.
    citations:
      - PMID:37788100
  - claim_id: shared-structural-substrate
    statement: >-
      A sequence analysis shows the MYH7 LMM pathogenic residues are conserved
      in MYH2 and enriched for coiled-coil surface-charge loss, giving the
      shared mechanism a structural basis.
    disposition: QUALIFIED
    report_quote: >-
      all 9 MYH7-mutated residues are strictly identical in MYH2 at aligned positions
    rationale: >-
      Conservation and a charge-loss bias are plausible, but the analysis is
      not reproducible (no code, environment or manifest in the bundle) and its
      p-value comes from a binomial test on 9 hand-picked variants, which is not
      a valid random sample. More importantly it is not independent support:
      PMID:37788100 already reports that these mutations hit charged exterior
      coiled-coil positions and already studies MYH2 variants directly, so the
      conservation finding restates the seed rather than corroborating it.
    citations:
      - PMID:37788100
  - claim_id: ihm-srx-bridge-contested
    statement: >-
      Equating lost SRX with impaired folded-back head sequestration (IHM) is
      disputed, and the mantATP assay used to read SRX is itself questioned.
    disposition: RETAINED
    report_quote: >-
      the commonly employed mantATP displacement assay was unable to quantify
      the population of the SRX state with all data fitting very well by a
      single exponential
    rationale: >-
      This is the report's strongest contribution and the quotes check out.
      PMID:38103642 questions the assay, PMID:31540109 shows the IHM does not
      explain relaxed-muscle X-ray patterns, and PMID:40727670 argues IHM and
      SRX are weakly or not coupled. The seed hypothesis leans on the IHM=SRX
      equivalence, so this is a genuine limitation on the mechanistic
      interpretation, not merely on the magnitude.
    citations:
      - PMID:38103642
      - PMID:31540109
      - PMID:40727670
  - claim_id: ihm-structure-not-universal
    statement: >-
      A folded-back IHM is structurally established for MYH7, but its
      cross-myosin universality across fibre types is not.
    disposition: RETAINED
    report_quote: >-
      the structures of cardiac and smooth muscle myosin IHMs are dramatically
      different. This challenges the concept that the IHM structure is conserved
      in all muscle types
    rationale: >-
      Verbatim from PMID:37131793, a 3.6 A cryo-EM structure of wild-type human
      beta-cardiac (MYH7) myosin. It supports a sequestered off-state for MYH7
      and, by the authors' own caution, undercuts the leap to one shared
      head-sequestration structure across MYH7 and MYH2. No MYH2 IHM structure
      exists. This is wild-type structural biology, not evidence about the
      variants, which is why it qualifies rather than confirms.
    citations:
      - PMID:37131793
  - claim_id: competing-mechanisms-outside-energetic-model
    statement: >-
      Aggregate pathologies and the recessive MYH2 fibre-loss series are not
      explained by the energetic SRX model and point to parallel mechanisms.
    disposition: RETAINED
    report_quote: >-
      limit the shared-mechanism claim to **dominant LMM/rod variants**; recessive
      MYH2 (type 2A fibre loss) likely follows a distinct loss-of-function mechanism
    rationale: >-
      Well grounded. MYH7 myosin storage myopathy shows hyaline bodies
      (PMID:15699387, PMID:25666907, PMID:17336526); MYH2 myopathy shows type 2A
      fibre loss, rimmed vacuoles and nemaline rods/tangles (PMID:33926564,
      PMID:29934118, PMID:32578970); recessive MYH2 is fibre loss, not an
      energetic defect. The scope restriction to dominant LMM variants is the
      correct curation lead and matches how both KB entries already model these
      variants.
    citations:
      - PMID:33926564
      - PMID:29934118
      - PMID:25666907
  - claim_id: therapeutic-corollary-untested
    statement: >-
      The corollary that SRX modulators tested in one gene should work in the
      other is untested, and short-term in vivo rescue has already failed in a
      related myopathy.
    disposition: RETAINED
    report_quote: >-
      mavacamten rescued SRX energetics *in vitro* but failed to correct the
      energy proteome *in vivo* over 4 weeks in a related nemaline model
    rationale: >-
      Correct and appropriately cautious. PMID:39216086 shows in vitro rescue
      but failed 4-week in vivo proteome correction, in nebulin nemaline
      myopathy rather than MYH7/MYH2, and it is the same senior author's lab, so
      it is adjacent evidence, not independent confirmation of the corollary.
      No registered SRX-modulator skeletal-myopathy trial was found.
    citations:
      - PMID:39216086
  - claim_id: keep-emerging-no-module-yet
    statement: >-
      The hypothesis should stay EMERGING and does not yet justify a shared
      cross-isoform mechanism module.
    disposition: RETAINED
    report_quote: >-
      Keep status EMERGING.
    rationale: >-
      The report recommends keeping EMERGING, which the single-study functional
      basis and contested interpretation support. It stops short of the module
      question the KB discussion shared_rod_mechanism_across_isoforms actually
      poses; on this evidence a shared module is premature. One study, one lab,
      a disputed molecular bridge, and no MYH2 replication is not enough to
      collapse two fibre-type-specific entries onto one module.

analyses:
  - analysis_id: lmm-sequence-charge-analysis
    status: REPORTED_ONLY
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Needleman-Wunsch alignment (+1/-1/-2) of the MYH7 and MYH2 LMM regions;
      a one-sided binomial test of R/K loss among 9 MYH7 variants against a
      background R/K fraction of 0.177; a heptad a/d core-enrichment test.
    comparison: 9 literature-picked MYH7 LMM variants versus the MYH7 LMM background composition.
    input_data_source_ids:
      - uniprot-myh7-myh2
    software:
      - software_name: Python (OpenScientist execute_code sandbox)
    parameters:
      - LMM region = MYH7 residues 1281-1935
      - alignment scoring +1/-1/-2
      - variant set = R1500P, R1500W, A1603P, K1617del, R1434P, A1437P, R1845W, R1820W, K1784del
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_MYH7-Related_Skeletal_Myopathy_shared_myosin_rod_mechanism_openscientist_artifacts_data_lmm_variant_heptad_analysis.csv
      - ../openscientist_artifacts/kb_hypotheses_MYH7-Related_Skeletal_Myopathy_shared_myosin_rod_mechanism_openscientist_artifacts_logs_execution_log.md
      - ../openscientist_artifacts/kb_hypotheses_MYH7-Related_Skeletal_Myopathy_shared_myosin_rod_mechanism_openscientist_artifacts_figures_README.md
    status_reason: >-
      Not reproducible from the committed bundle. The output table and a prose
      execution log survive, so the numbers are inspectable, but the analysis
      script, an environment record and a MANIFEST.yaml are absent, so the run
      cannot be rerun and the computational-bundle gate does not apply.
    limitations: >-
      Design weakens the headline p-value. The 9 variants were hand-picked from
      the literature, not sampled, so the binomial test treats a curated set as
      random draws. Charge-removing substitutions are over-represented among
      reported pathogenic rod variants partly through ascertainment. The result
      is suggestive of coiled-coil surface-charge sensitivity, not a calibrated
      probability. The conservation finding (all 9 sites identical in MYH2) is
      real but restates what PMID:37788100 already shows by studying MYH2
      variants directly.

    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      GenCC gene-disease validity lookup, ClinVar record counts, and a
      ClinicalTrials.gov text search for SRX-modulator trials.
    input_data_source_ids:

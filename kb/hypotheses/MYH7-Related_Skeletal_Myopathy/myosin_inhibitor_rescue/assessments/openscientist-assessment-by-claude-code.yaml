analyses:
  - analysis_id: literature-evidence-synthesis
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Manual stance classification (supports / qualifies / refutes / competing)
      of retrieved abstracts and full texts into a 13-row evidence matrix, with a
      causal-chain synthesis and a competing-model table.
    comparison: Seed hypothesis versus qualifying, refuting, and competing published results.
    input_data_source_ids:
      - pubmed
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_MYH7-Related_Skeletal_Myopathy_myosin_inhibitor_rescue_openscientist_artifacts_tables_evidence_matrix.csv
    status_reason: >-
      The derived matrix is committed and inspectable and its stances are
      defensible, but this is manual reading with no code, no query log, and no
      snippet validation in the run itself, so it is auditable as a record of
      what was concluded rather than rerunnable.
    limitations: >-
      Two rows (PMID:39677804 and PMID:41144950) are the preprint and published
      versions of one study, so the independent evidence base is 12 studies, not
      13, and the skeletal-engagement result is counted once as support and once
      as a safety qualifier. One row types a human patient-myofibre study
      (PMID:37788100) as model-organism in vivo in the report prose, though the
      committed CSV types it correctly. Several conclusions rest on
      abstract-level reading (PMID:42089145, PMID:39216086, PMID:41780808 are
      abstract-only in the cache).

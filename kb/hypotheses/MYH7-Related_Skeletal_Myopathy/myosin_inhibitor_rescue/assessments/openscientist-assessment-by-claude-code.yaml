overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A literature-plus-API run on the MYH7 myosin-inhibitor hypothesis. Its verdict
  (partially supported, scoped to the DRX-hypercontractile rod/Laing subtype,
  speculative for myosin-storage alleles, unresolved for human efficacy and
  tolerability) is the right reading of the evidence and matches the seed's
  EMERGING status, so nothing here argues for a status change.

  Citation discipline is good by the standards of these runs. All 17 cited PMIDs
  resolve to real papers on the stated subjects, and every quoted sentence
  checked against the fetched reference cache is verbatim; no fabricated or
  misattributed reference was found. The ClinicalTrials.gov negative search is
  the strongest part of the run: the committed log records database, version,
  seven exact queries and date, and replaying all seven today returned the same
  counts (0/0/0/14/1/0/0), with NCT05099107 confirmed as a salbutamol congenital
  myopathy study whose condition list does include myosin storage myopathy.

  Three defects bound how far the synthesis can be trusted. (1) The report counts
  one study twice: PMID:39677804 is the bioRxiv preprint of PMID:41144950 (same
  authors, same title but for one word, same X-ray diffraction experiment), and
  the report presents them as separate evidence-matrix rows and as a result plus
  a corroborating statement from "the same group". Only the published version
  should be cited. (2) The safety signal that drives the executive judgment's
  "documented iatrogenic skeletal-myopathy" framing is one discussion sentence in
  that mouse biophysics paper, itself citing unnamed "emerging clinical reports",
  plus an n=1 case report of myalgia with normal creatine kinase. That is a
  caution worth recording, not a documented drug-induced myopathy. (3) The
  artifact bundle has no MANIFEST.yaml although the report's own Artifact Bundle
  paragraph says it should, no code is committed for any of the three API
  analyses, and the committed filenames are flattened, so the report's internal
  path `logs/clinicaltrials_gov_search.json` does not resolve as written.

  Minor: the report's evidence matrix types PMID:37788100 as "Model organism /
  in vivo" when it is a human patient-myofibre study (its own CSV gets this
  right, as does the KB entry); and term validation flags MONDO:0008050 as named
  "target" in the prose. Nothing is promoted into the disease entry from this
  run; the two cross-disease safety/mechanism leads are recorded as
  NEEDS_VERIFICATION for a curator.

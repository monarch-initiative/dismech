claims:
  - claim_id: myk581-rescue-r1500p
    statement: >-
      A DRX-depleting myosin modulator improves muscle function in a MYH7 rod
      (R1500P) model and corrects the elevated disordered-relaxed fraction in
      patient myofibrils.
    disposition: RETAINED
    report_quote: >-
      oral administration of MYK-581, a small molecule that decreases the
      population of heads in the DRX configuration, significantly improved the
      limited running capacity of the R1500P-transgenic mice and corrected the
      increased DRX state of the myofibrils from patients
    rationale: >-
      Verbatim in the cached source and already the seed evidence item in the KB
      entry, where it supports both the hypothesis block and the
      "Myosin ATPase inhibition (preclinical)" treatment. The report adds the
      caveats the entry also carries - one allele, one transgenic (not knock-in)
      model, a running-capacity surrogate, a tool compound - and the full text
      adds a detail worth having, that running capacity normalized within four
      days of dosing. Retained as an accurate restatement of what the KB already
      holds; nothing new to promote.
    citations:
      - PMID:38690726
  - claim_id: skeletal-target-engagement
    statement: >-
      Mavacamten engages skeletal muscle myosin, shifting heads from the ON to
      the OFF state in relaxed skeletal muscle.
    disposition: QUALIFIED
    report_quote: >-
      facilitates myosin head ON-to-OFF transitions
    rationale: >-
      The quotation is verbatim and the finding is real: small-angle X-ray
      diffraction in relaxed mouse skeletal muscle shows a reduced proportion of
      ON heads. Qualified on two counts. First, the report cites this one study
      twice - PMID:39677804 is the bioRxiv preprint of PMID:41144950, same
      authors and same title but for the word "mouse" - and builds the
      engagement-plus-safety argument as though a result and an independent
      corroboration existed; only the journal version should be cited. Second,
      engagement in wild-type mouse skeletal muscle establishes that the drug
      reaches skeletal myosin, not that it helps a mutant one, which is the step
      the hypothesis needs.
    citations:
      - PMID:41144950
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: iatrogenic-skeletal-myopathy-signal
    statement: >-
      Cardiac myosin inhibitors carry a skeletal-muscle safety liability that
      bears on dosing them for a skeletal myopathy.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      emerging clinical reports indicate mavacamten-induced generalized skeletal
      myopathy in elderly patients
    rationale: >-
      Both quotations are verbatim, but the executive judgment's
      "documented iatrogenic skeletal-myopathy safety signal" is stronger than
      its sources. The generalized-myopathy sentence is a discussion remark in a
      mouse biophysics paper referring to unnamed emerging clinical reports - a
      secondary, background assertion, not that paper's own finding - and the
      only primary human datum is a single case of transient hypertension and
      myalgia four weeks after initiation, with creatine kinase within normal
      limits, in a 68-year-old with obstructive cardiomyopathy. The caution is
      legitimate and curation-relevant; the primary reports behind it need to be
      found and read before the KB states it, and the quote-role distinction
      matters (a background sentence in a model-organism paper is not model-organism
      evidence for a human adverse effect).
    citations:
      - PMID:41144950
      - PMID:41000531
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: energetic-rescue-inconsistent-in-vivo
    statement: >-
      Correcting the relaxed-state energetic defect pharmacologically does not
      reliably normalize downstream biology in vivo, and a reduced super-relaxed
      state does not always produce a contractile deficit.
    disposition: RETAINED
    report_quote: >-
      short-term Mavacamten treatment is not sufficient to properly counterbalance
      the metabolically dysregulated proteome of cNeb KO mice
    rationale: >-
      The strongest analytic contribution of the run, and both legs check out
      verbatim: four weeks of mavacamten failed to rescue the dysregulated
      proteome of nebulin-deficient muscle, and in human MYH7/MYH2
      light-meromyosin myopathy the super-relaxed state was decreased in vivo
      while myofibre contractility was unaffected. The second of these is already
      curated in the entry, as evidence under rod_srx_energetics and as the
      counterpoint in the energetic-model discussion; the nebulin result is a
      different-gene analogue, so it qualifies the generalization rather than
      refuting the MYH7 claim. Retained as a correct reading, with the scope
      limit that neither study is in MYH7 rod disease treated with a myosin
      inhibitor.
    citations:
      - PMID:39216086
      - PMID:37788100
  - claim_id: inhibitors-not-interchangeable
    statement: >-
      The relevant myosin inhibitors are not mechanistically interchangeable:
      aficamten reduces force without structurally sequestering heads along the
      thick filament, unlike mavacamten and MYK-581.
    disposition: QUALIFIED
    report_quote: >-
      In contrast to Mavacamten, Aficamten does not structurally sequester myosin
      heads along the thick filament
    rationale: >-
      Verbatim, and the most actionable lead in the report for this entry,
      because the hypothesis description and the myosin_inhibitor_transfer
      discussion both name mavacamten and aficamten together as though one
      question. If the rescue runs through depleting the DRX population, a drug
      that inhibits by shifting heads into a super-slow turnover state without
      OFF-state sequestration is a different bet. Qualified because the work is
      in cardiac muscle, the predicted non-equivalence for a mutant slow skeletal
      myosin is the report's inference rather than a measured result, and no
      study has compared the two on MYH7-mutant material.
    citations:
      - PMID:40463178
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: storage-alleles-competing-mechanism
    statement: >-
      Myosin storage alleles act through coiled-coil destabilization,
      thick-filament assembly failure and aggregation, a mechanism a
      relaxed-state modulator has no evident handle on.
    disposition: RETAINED
    report_quote: >-
      frequently disrupt the tail's stabilizing heptad repeat motif
    rationale: >-
      Accurate and verbatim, and it converges with what the entry already holds:
      rod_assembly_aggregation is the CANONICAL hypothesis there, and the
      myosin_inhibitor_rescue description already says the storage alleles are
      untested. The report's contribution is to state the consequence plainly -
      that this is a competing mechanism rather than an untested extension - and
      to propose the discriminating experiment (aggregate load as the readout, with
      an expected null). Retained as a scoping conclusion; the Drosophila and
      machine-learning sources are leads for the aggregation hypothesis, not for
      this one.
    citations:
      - PMID:39485824
      - PMID:41780808
  - claim_id: no-registered-human-trial
    statement: >-
      No registered clinical trial of a relaxed-state myosin inhibitor exists for
      MYH7-related skeletal myopathy, Laing distal myopathy, or myosin storage
      myopathy, so the hypothesis is preclinical at the human-interventional level.
    disposition: QUALIFIED
    report_quote: >-
      ClinicalTrials.gov API v2 was queried on 2026-10-16
    rationale: >-
      A properly constructed negative: database, version, seven exact queries,
      date, counts, and a reason for discarding each of the two non-empty result
      sets. Replayed independently with identical counts, and NCT05099107 confirmed
      as a completed salbutamol study in congenital myopathy - its condition list
      does include myosin storage myopathy, so it is a real hit correctly
      discarded on intervention rather than on disease. Qualified only by its
      scope: one registry, keyword matching, and a date that will go stale. It supports the
      entry's existing "no human skeletal-muscle data" framing rather than
      changing it.
  - claim_id: keep-emerging-subtype-scoped
    statement: >-
      Curation recommendation: keep the hypothesis EMERGING and state its subtype
      scope explicitly - promising for the DRX-hypercontractile rod/Laing branch,
      speculative for myosin-storage alleles, unresolved for human efficacy and
      tolerability.
    disposition: RETAINED
    report_quote: >-
      Retain **EMERGING**, but add an explicit **subtype restriction**
    rationale: >-
      The right call, and it matches the committed seed, which is already EMERGING
      and already says the storage-allele question is untested. Retained as a
      curation recommendation rather than a disease claim: acting on it would be a
      wording refinement plus optional cross-disease caveat evidence, not a new
      mechanism assertion. The report proposes no pathophysiology node the entry
      lacks.
  - claim_id: bundle-manifest-absent
    statement: >-
      The run's artifact bundle meets the report's own description of it only in
      part.
    disposition: QUALIFIED
    report_quote: >-
      should contain `MANIFEST.yaml`, `logs/clinicaltrials_gov_search.json`, and
      the Monarch query log
    rationale: >-
      No MANIFEST.yaml is committed, so there are no checksums, no byte counts and
      no replay record, and the gate in docs/hypothesis-report-assessments.md
      cannot be run against this bundle. No query code is committed for any of the
      three API analyses. The committed filenames are flattened copies, so the
      relative paths the report uses internally
      (`logs/clinicaltrials_gov_search.json`) do not resolve as written. What is
      committed - the two JSON logs, the environment record and the evidence
      matrix - is genuinely useful and is what made the independent replay
      possible, which is why this is a provenance qualification rather than a
      rejection. The report also hedges with "should contain" rather than
      asserting the manifest exists, so this is an unmet intention, not a false
      claim of execution.
    analysis_ids:
      - clinicaltrials-negative-search
      - monarch-gene-disease-enumeration
  - claim_id: preprint-journal-double-count
    statement: >-
      The evidence base is 12 independent studies, not the 13 rows the matrix
      shows.
    disposition: REJECTED
    report_quote: >-
      the same group states
    rationale: >-
      Rejected as stated. PMID:39677804 (bioRxiv, 2024) and PMID:41144950
      (Physiol Rep, 2025) are the preprint and journal versions of one study by
      the same authors with the same title but for one word, and the report treats
      them as two sources - one row "supports" skeletal engagement, the other
      "qualifies/refutes" on safety - and narrates the second as corroboration
      from "the same group". The underlying facts are right; the independence is
      not. Any promotion should cite PMID:41144950 only.
    citations:
      - PMID:39677804
      - PMID:41144950
    analysis_ids:
      - literature-evidence-synthesis

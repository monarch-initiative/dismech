overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A literature-led OpenScientist run with two small public-database queries. Its
  verdict, PARTIALLY_SUPPORTED, is sound for the molecular half of the
  hypothesis: loss of the super-relaxed (SRX) state and raised basal myosin ATP
  use are measured both in the R1500P mouse (PMID 38690726) and in patient
  biopsies carrying MYH7/MYH2 light-meromyosin variants (PMID 37788100). The
  causal half of the label ("cause weakness ... causing fatigue") is not
  established in people: no study links the energetic defect to weakness in
  genotyped patients, and an assessor PubMed search for MYH7, Laing or myosin
  storage myopathy with magnetic resonance spectroscopy, 31P or phosphocreatine
  returned only three cardiac papers, which agrees with the report's gap.

  The report does not discriminate between the energetic model and the canonical
  assembly/aggregation model. It sets them side by side and calls primacy
  unresolved, which is honest but not a result. Its "competing mechanism"
  sources (PMID 22155079, 22918376) are already cited in the KB entry, so they
  add nothing new to the controversy. The one structurally useful observation is
  in a paper the entry already cites: PMID 37788100 measured coiled-coil and
  filament-packing disruption and SRX loss for the same variants and attributes
  the SRX loss to that structural remodeling. That makes the two models two
  downstream branches of one backbone lesion rather than rival upstream causes,
  which the entry's graph does not show (the rod variant points straight to loss
  of head sequestration, bypassing the coiled-coil node). The MYK-581 rescue in
  the mouse also does not separate the models: it shows that shifting heads back
  toward the relaxed state helps running, but it was not tested against
  aggregate burden.

  All 12 cited PMIDs resolve, and every passage the report quotes from them is an
  exact substring of the cached abstract (seven caches were fetched for this
  review). Small misstatements: the 81% footdrop figure in PMID 24664454 is per
  family (17 of 21), not per patient; PMID 38103642 concerns purified porcine
  cardiac HMM, so its mantATP caveat bears less directly on the fibre-based
  assays of the seed papers. The gnomAD constraint values reproduce exactly on
  replay. The ClinVar counts reproduce numerically, but the recorded query
  strings do not: "1479 pathogenic/likely-pathogenic" is in fact the count of
  MYH7 records containing the word "pathogenic" anywhere, and the free-text
  counts are token matches, not phrase matches. The report's closing claim that
  the bundle checksums matched a MANIFEST is unsupported: the committed bundle
  has no MANIFEST.yaml, no code and no environment record. Nothing here should be
  promoted into the KB entry directly; see the claims for the two changes worth a
  curator's look.

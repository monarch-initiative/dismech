claims:
  - claim_id: srx-loss-and-raised-basal-atp
    statement: >-
      MYH7 rod (LMM) variants reduce the super-relaxed state and raise basal
      myosin ATP consumption, in the R1500P mouse and in patient biopsies.
    disposition: RETAINED
    report_quote: >-
      basal myosin ATP consumption was increased and the myosin super-relaxed
      state was decreased in vivo
    rationale: >-
      Both quoted passages are exact abstract text (PMID 37788100, 38690726), and
      PMID 38690726 also reports a raised DRX fraction in Laing patient biopsies.
      These are the KB entry's existing evidence for this hypothesis, so the
      report confirms rather than extends it. "In vivo" is the authors' wording;
      the measurements are on biopsied fibres.
    citations:
      - PMID:37788100
      - PMID:38690726
  - claim_id: hypercontractility-mouse-only
    statement: >-
      Hypercontractility is shown in the R1500P mouse but not in human LMM-variant
      fibres, where contractility was unchanged.
    disposition: RETAINED
    report_quote: and not yet demonstrated in human tissue
    rationale: >-
      Verified: PMID 37788100 states "myofiber contractility was not affected".
      The KB entry already records this conflict in the hypothesis description,
      on the fatigue node and in the assembly_versus_energetics discussion, so no
      change is needed.
    citations:
      - PMID:37788100
      - PMID:38690726
  - claim_id: energetics-to-weakness-unmeasured
    statement: >-
      The step from raised ATP demand to weakness and fatigue has not been
      measured in MYH7 patients.
    disposition: QUALIFIED
    report_quote: is not directly measured in patients
    rationale: >-
      The provider's search was non-exhaustive, but an assessor PubMed query,
      (MYH7 OR "Laing distal myopathy" OR "myosin storage myopathy") AND
      ("magnetic resonance spectroscopy" OR 31P OR phosphocreatine), run
      2026-10-16, returned three papers, all cardiac (36802920, 34053450,
      29343710). Qualified because the only data on the step are the mouse
      fatigue findings, which the report sets aside under the hypercontractility
      caveat; the entry's INDIRECT_UNKNOWN_INTERMEDIATES edge already encodes the
      uncertainty. The two 31P-MRS papers cited (21719720, 12914557) concern
      exercise-induced muscle damage and post-polio syndrome and serve only to
      show the method exists.
    citations:
      - PMID:38690726
      - PMID:21719720
      - PMID:12914557
  - claim_id: report-does-not-discriminate
    statement: >-
      The report does not discriminate between the energetic and the
      assembly/aggregation models; it lists both and leaves primacy unresolved.
    disposition: QUALIFIED
    report_quote: >-
      of the energetic arm within human disease remains unresolved
    rationale: >-
      Correct as a statement of the evidence, but it is a restatement of the
      KB's open CONTROVERSY rather than progress on it. The dominant-negative
      aggregation evidence (PMID 22155079) and the assembly review (PMID 22918376)
      are already cited on the entry's assembly and aggregation nodes. The
      MYK-581 rescue it calls "perturbational support" lowers the DRX fraction and
      improves running, but was not assessed against aggregates, so it does not
      separate the models; the report says as much in its second discriminating
      test.
    citations:
      - PMID:22155079
      - PMID:22918376
      - PMID:38690726
  - claim_id: shared-backbone-upstream
    statement: >-
      The same LMM variants disrupt coiled-coil structure and filament packing
      and reduce the SRX state, and the authors attribute the SRX loss to that
      structural remodeling, so the energetic and assembly models share an
      upstream lesion.
    disposition: QUALIFIED
    report_quote: >-
      perturbed backbone could produce BOTH SRX loss and aggregation
    rationale: >-
      PMID 37788100's abstract reports coiled-coil and packing disruption in vitro
      and in silico and concludes that "the structural remodeling associated with
      LMM mutations induces a pathogenic state in which formation of shutdown
      heads is impaired". This supports routing the energetic branch through the
      coiled-coil node in the KB graph. Qualified because the link is
      correlational across separate assays and was shown for a small set of
      common variants; it is not shown that the same backbone defect produces
      aggregates in those patients. Candidate KB change: an edge from
      Coiled-Coil Destabilization of the Myosin Rod to Loss of Myosin Head
      Sequestration (hypothesis group rod_srx_energetics), citing that sentence.
    citations:
      - PMID:37788100
  - claim_id: srx-loss-not-myh7-specific
    statement: >-
      SRX loss with raised resting ATP use also occurs in NEB nemaline myopathy,
      so it is a convergent node rather than a MYH7-specific driver.
    disposition: RETAINED
    report_quote: >-
      SRX disruption is a shared downstream consequence of diverse sarcomeric
      lesions rather than a MYH7-specific primary driver
    rationale: >-
      Verified against PMID 36528760 (quote exact). PMID 40295335 (type 2
      diabetes, SRX increased and ATP demand decreased) and PMID 19966283
      (filament structure modulates SRX turnover) are accurately described. This
      bears on specificity, not on whether the mechanism operates in MYH7 disease,
      and is a cross-entry module question rather than an edit to this entry.
    citations:
      - PMID:36528760
      - PMID:40295335
      - PMID:19966283
  - claim_id: readout-equivalence-caveat
    statement: >-
      X-ray thick-filament order and mantATP-chase SRX fraction are correlated
      readouts, not interchangeable measures of one state.
    disposition: QUALIFIED
    report_quote: >-
      the two readouts should be interpreted as correlated proxies rather than a
      single ground truth
    rationale: >-
      Both quoted passages are exact (PMID 36696446, 38103642). Both studies use
      porcine cardiac material, and 38103642 tests purified HMM rather than
      permeabilised fibres, so the caveat transfers to the skeletal fibre assays
      of the seed papers only partly. It does not overturn the seed findings.
    citations:
      - PMID:36696446
      - PMID:38103642
  - claim_id: constraint-premise
    statement: >-
      MYH7 is missense-constrained but not haploinsufficient in gnomAD, consistent
      with an altered-function mechanism.
    disposition: QUALIFIED
    report_quote: >-
      without adjudicating between SRX-energetics and dominant-negative
      aggregation
    rationale: >-
      The values reproduce on replay, and the report itself states that they do
      not discriminate between the models. Constraint for MYH7 is driven largely
      by cardiomyopathy alleles, so it says little about the skeletal rod
      phenotype specifically.
    analysis_ids:
      - gnomad-constraint-retrieval
  - claim_id: clinvar-skeletal-underrepresentation
    statement: >-
      ClinVar MYH7 records are dominated by cardiomyopathy, with a small share
      for the skeletal myopathies.
    disposition: QUALIFIED
    report_quote: >-
      1479 pathogenic/likely-pathogenic
    rationale: >-
      The direction is right, but the "pathogenic/likely-pathogenic" figure is a
      free-text count of records mentioning "pathogenic" (a property search for
      P/LP gives 465), and the percentages do not partition the records. Context
      only; not a finding to carry into the KB.
    analysis_ids:
      - clinvar-record-counts
  - claim_id: manifest-verified
    statement: The provider's artifact bundle was checksum-verified against a manifest.
    disposition: REJECTED
    report_quote: >-
      The bundle checksums were verified in iteration 5 (inputs/outputs match
      MANIFEST).
    rationale: >-
      No MANIFEST.yaml exists in the committed bundle, and the analysis-run gate
      reports it missing.
    analysis_ids:
      - bundle-manifest-verification
  - claim_id: recommended-kb-changes
    statement: >-
      Curation recommendation: keep rod_srx_energetics EMERGING; consider an edge
      from the coiled-coil node to loss of head sequestration citing PMID
      37788100; consider proposed experiments on the assembly_versus_energetics
      discussion that test SRX-stabiliser rescue against aggregate burden and
      in-vivo energetics (31P-MRS) in genotyped patients.
    disposition: RETAINED
    report_quote: >-
      keep status **EMERGING**; restrict confident claims to the **energetic arm**
    rationale: >-
      Status EMERGING matches the evidence. The hypercontractility caveat and the
      inferred energetics-to-weakness edge are already encoded in the entry, so no
      change is needed there. The graph edge and the proposed experiments are
      the only additions with independent support; each needs normal evidence
      validation before it enters the entry.
    citations:
      - PMID:37788100

hypothesis_id: antigen_persistence_granuloma_chronicity_model
assessed_at: "2026-07-29T20:09:41Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report correctly identifies that its distinctive
  Th17.1-to-macrophage-mTORC1 edge is unresolved, and it assembles useful
  evidence for the component modules. It nevertheless overgrades the integrated
  mechanism by causally stitching observational human immunophenotyping,
  engineered mouse mTORC1 models, and broad JAK inhibition. A recent model
  provides a partial Th17/Th17.1-to-mTORC1 bridge, but macrophage-specific
  mediation has not been demonstrated. The integrated mechanism therefore
  remains weakly supported and unresolved.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: integrated-th171-mtorc1-edge
    statement: >-
      Direct macrophage-specific mediation between Th17.1 signaling and mTORC1
      remains unresolved, although the literature contains a partial bridge.
    disposition: QUALIFIED
    report_quote: >-
      the integrative edge that gives the hypothesis its distinctive identity —
      Th17.1→macrophage mTORC1 — is nowhere directly demonstrated.
    rationale: >-
      Anti-CXCR6 treatment in a P. acnes-induced mouse model reduced Th17 and
      Th17.1 abundance and was associated with inhibition of downstream mTORC1
      signaling, so "nowhere" is too categorical. That experiment changes
      immune-cell recruitment and composition and does not establish that
      Th17.1-derived IFN-gamma activates macrophage-intrinsic mTORC1 or that this
      edge mediates granuloma persistence. The report's central unresolved-edge
      conclusion is therefore retained with narrower wording.
    citations:
      - PMID:42143504
  - claim_id: engineered-mtorc1-sufficiency
    statement: >-
      Engineered chronic mTORC1 activation is sufficient for sarcoid-like
      granulomas in mice, but it does not validate the proposed upstream human
      mechanism.
    disposition: QUALIFIED
    report_quote: >-
      This is knockout-plus-pharmacologic-rescue evidence — the gold standard
      for demonstrating sufficiency
    rationale: >-
      TSC2 loss in macrophage or CD11c-positive compartments and Fsp1-Cre
      Tsc1/Tsc2 deletion support sufficiency within engineered mouse models and
      pharmacologic reversibility. They do not show that antigen persistence or
      Th17.1 signaling produces mTORC1 activation in human sarcoidosis.
      Moreover, phospho-S6 was detected in only 43% of a Dutch sarcoidosis
      cohort, was also present in other granulomatous lung diseases, and did not
      associate with clinical phenotype. The report also cites the preprint
      record PMID:40791394 although the peer-reviewed update PMID:42246493 was
      available before the report date.
    citations:
      - PMID:28092373
      - PMID:37750561
      - PMID:42246493
      - PMID:34944053
  - claim_id: th171-disease-activity
    statement: >-
      Activated Th17.1 enrichment is a credible pulmonary-sarcoidosis activity
      and progression correlate, not yet a demonstrated causal driver.
    disposition: QUALIFIED
    report_quote: >-
      these cells **decline with corticosteroid treatment** and reflect disease
      activity/progression
    rationale: >-
      Treatment-naive lymph-node and BAL studies associate higher Th17.1
      proportions with chronic disease, and an exploratory longitudinal study
      associates activated Th17.1 cells with activity in
      corticosteroid-responsive pulmonary sarcoidosis. These studies support a
      biomarker or endotype claim, but their observational design and modest
      cohorts do not establish that Th17.1 cells cause chronicity or activate
      macrophage mTORC1.
    citations:
      - PMID:29449421
      - PMID:42286635
  - claim_id: jak-causal-necessity
    statement: >-
      The tofacitinib evidence is a promising therapeutic signal but does not
      prove causal necessity of the proposed effector circuit.
    disposition: REJECTED
    report_quote: >-
      This proves the effector cytokine circuit is causally required to sustain
      granulomas
    rationale: >-
      The cited human study is an uncontrolled series of eight refractory
      cardiac-sarcoidosis patients, seven of whom improved by repeat PET/CT.
      Tofacitinib broadly inhibits JAK-dependent signaling, the cohort has no
      randomized counterfactual, and response does not identify Th17.1,
      IFN-gamma, or mTORC1 as the necessary mediator. The primary paper itself
      calls for larger prospective studies.
    citations:
      - PMID:41916671
  - claim_id: hla-determines-antigen-clearance
    statement: >-
      HLA-DRB1 alleles associate with susceptibility and course, but do not
      establish deterministic antigen recognition or clearance.
    disposition: REJECTED
    report_quote: >-
      Genotype thus sits upstream of the Th17.1/mTORC1 effector axis and
      determines whether antigen is efficiently recognized/cleared (resolution)
      or persists (chronicity).
    rationale: >-
      HLA association studies support susceptibility and
      persistence/resolution effects, while in-silico peptide-binding analyses
      offer a plausible explanation. They do not identify the causal antigen,
      measure its clearance, establish the Th17.1-to-mTORC1 pathway, or justify
      deterministic wording.
    citations:
      - PMID:19382529
      - PMID:25506722
  - claim_id: unidentified-causal-antigen
    statement: >-
      No candidate antigen has been shown necessary for sarcoidosis chronicity.
    disposition: RETAINED
    report_quote: >-
      No single antigen has been shown causally necessary for chronicity
    rationale: >-
      Candidate microbial and self antigens have been detected or associated
      with immune responses, but those observations do not establish that one
      antigen is necessary for persistence. Preserving this uncertainty is
      essential to the report's status recommendation.
    citations:
      - PMID:30038611
      - PMID:33801218
  - claim_id: pulmonary-cardiac-subtype-scope
    statement: >-
      The evidence is strongest for chronic pulmonary disease and does not yet
      validate a unified pulmonary-and-cardiac subtype restriction.
    disposition: QUALIFIED
    report_quote: >-
      non-Löfgren, chronic/progressive pulmonary (and cardiac) sarcoidosis
    rationale: >-
      The longitudinal Th17.1 evidence is pulmonary. Cardiac support comes
      mainly from an engineered mouse model, a very small uncontrolled
      tofacitinib series, and descriptive tissue datasets. Those data motivate
      cardiac investigation but do not establish that the same integrated
      Th17.1-to-mTORC1 circuit defines both organ phenotypes.
    citations:
      - PMID:29449421
      - PMID:37750561
      - PMID:41916671

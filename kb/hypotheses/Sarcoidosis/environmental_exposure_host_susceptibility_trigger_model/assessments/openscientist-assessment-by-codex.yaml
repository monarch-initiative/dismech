hypothesis_id: environmental_exposure_host_susceptibility_trigger_model
assessed_at: "2026-07-29T20:09:41Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report appropriately separates established host-genetic associations,
  modest exposure associations, exploratory gene-environment interactions, and
  the unproven exposure-specific sensor mechanism. Its distinctive idiopathic
  exposure-by-genotype-to-CD4 mechanism remains weakly supported and
  unresolved. The assessment also finds an incomplete gene-environment search,
  overgeneralization from chronic beryllium disease, invalid interaction-only
  logic, an overinterpreted sensitization association, and an incorrect type-II
  hypersensitivity label.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: host-genetic-susceptibility
    statement: >-
      Host genetic susceptibility to sarcoidosis and phenotype modification is
      well supported at the association level.
    disposition: RETAINED
    report_quote: >-
      Host genetic susceptibility (HLA class II + immune alleles) predisposes to
      sarcoidosis and shapes phenotype
    rationale: >-
      Multi-ancestry genome-wide studies replicate HLA-region, BTNL2, and ANXA11
      associations and identify additional loci. These findings establish a
      host-susceptibility node, while not by themselves identifying the
      interacting exposure or initiating mechanism.
    citations:
      - PMID:22952805
  - claim_id: inhaled-exposure-associations
    statement: >-
      Several inhaled occupational or environmental exposure classes have
      modest observational associations with sarcoidosis risk.
    disposition: QUALIFIED
    report_quote: >-
      Specific inhaled bioaerosols / inorganic particles are associated with
      pulmonary sarcoidosis risk
    rationale: >-
      ACCESS found associations with agricultural employment, occupational
      insecticides, and mold or mildew work environments, with odds ratios
      around 1.5. Questionnaire-based case-control associations do not identify
      a causal antigen, establish temporality for every exposure, or exclude
      correlated occupational and socioeconomic factors.
    citations:
      - PMID:15347561
  - claim_id: gene-environment-search-completeness
    statement: >-
      The report's claim that ACCESS is the only direct human
      gene-environment analysis is incorrect.
    disposition: REJECTED
    report_quote: >-
      the one direct human gene-environment interaction analysis
    rationale: >-
      The search missed a Swedish population-based analysis of smoking
      interactions with FCRL1, IL23R, and other loci and a gene-environment-wide
      analysis of insecticide exposure in 1,877 African Americans. These studies
      do not replicate the exact ACCESS HLA-DRB1*11 exposure pairs and do not
      establish a biological sensor mechanism, but they invalidate the
      categorical literature claim and materially change the GxE evidence map.
    citations:
      - PMID:31819081
      - PMID:30793815
  - claim_id: beryllium-model-class
    statement: >-
      Chronic beryllium disease is a mechanistic analogue, not direct evidence
      for the idiopathic sarcoidosis mechanism.
    disposition: QUALIFIED
    report_quote: >-
      proof-of-principle that the model *class* is biologically real.
    rationale: >-
      HLA-DP2-restricted beryllium responses provide a strong example of an
      inhaled exposure, host genotype, innate response, antigen presentation,
      CD4 T-cell response, and granulomatous disease. CBD has a known exposure
      and disease-specific T-cell response and is etiologically distinct from
      idiopathic sarcoidosis. It demonstrates biological plausibility for a
      general model architecture but provides no support for any particular
      idiopathic exposure-sensor pair.
    citations:
      - PMID:24912188
      - PMID:33630763
  - claim_id: interaction-only-inference
    statement: >-
      Null beryllium and Glu69 main effects do not imply that the entire
      sarcoidosis trigger model survives only as an interaction.
    disposition: REJECTED
    report_quote: >-
      so the model only survives as a genuine *interaction*
    rationale: >-
      The cited study addresses occupational beryllium and HLA-DPB1 Glu69, not
      all proposed sarcoidosis exposures and genotypes. It also reports a
      significant exposure-duration-by-Glu69 interaction and concludes that
      some diagnoses may represent occupational beryllium disease. The result
      is chiefly a CBD misclassification and exposure-history constraint; it
      neither validates nor logically restricts the broader idiopathic model to
      interaction-only causation.
    citations:
      - PMID:25305207
  - claim_id: idiopathic-sensor-edge
    statement: >-
      The defining exposure-specific sensor and antigen-presentation mechanism
      remains unproven in idiopathic sarcoidosis.
    disposition: RETAINED
    report_quote: >-
      the defining *exposure-specific-sensor × genotype → CD4 polarization*
      edge is unproven for idiopathic disease.
    rationale: >-
      Existing human gene-environment studies identify statistical interactions
      or suggestive loci. They do not identify a matched exposure-derived
      antigen or innate sensor, demonstrate genotype-dependent presentation,
      and connect that event to CD4 polarization and granuloma formation in
      idiopathic disease.
    citations:
      - PMID:19382531
      - PMID:30793815
      - PMID:31819081
  - claim_id: inorganic-sensitization-fibrosis
    statement: >-
      Inorganic-antigen sensitization is associated with later fibrosis but is
      not an established exposure-to-phenotype modifier edge.
    disposition: QUALIFIED
    report_quote: >-
      inorganic sensitization → fibrotic phenotype
    rationale: >-
      The primary study found inorganic-antigen ELISPOT responses in 27.6% of a
      tested sarcoidosis subset versus 4.2% of controls and an association with
      fibrosis five years after diagnosis. Sensitization was measured after
      disease recognition and does not establish verified exposure, initiation,
      temporality, genotype interaction, or causal progression.
    citations:
      - PMID:32941653
  - claim_id: metal-hypersensitivity-class
    statement: >-
      Type II hypersensitivity is not an appropriate process label for the
      HLA-restricted T-cell response used as the report's metal-exposure model.
    disposition: REJECTED
    report_quote: >-
      type II hypersensitivity to metals.
    rationale: >-
      Type II hypersensitivity denotes antibody-mediated cytotoxic mechanisms.
      The CBD evidence reviewed here concerns MHC class II-restricted,
      beryllium-specific CD4 T cells and a delayed cell-mediated response,
      conventionally classified as type IV hypersensitivity. The proposed
      ontology label would encode the wrong immune mechanism.
    citations:
      - PMID:24912188
      - PMID:33630763
  - claim_id: controlled-human-exposure-design
    statement: >-
      The proposed experiment is acceptable only as an observationally matched
      ex-vivo challenge, not as deliberate hazardous human exposure.
    disposition: QUALIFIED
    report_quote: >-
      HLA-stratified controlled human exposure / ex vivo challenge.
    rationale: >-
      Matching existing exposure histories to HLA-stratified BAL-cell or
      organoid challenges could test specificity. Deliberately exposing people
      to silica, pesticides, mold mixtures, or an unresolved suspected trigger
      would be unsafe and scientifically difficult to interpret. The heading
      should unambiguously specify ex-vivo challenge or prospective observation
      of naturally occurring exposure.
  - claim_id: causal-curation-guardrail
    statement: >-
      No exposure-specific causal trigger edge should be promoted from this
      report.
    disposition: RETAINED
    report_quote: >-
      Do **not** curate any exposure-specific trigger edge as causal yet.
    rationale: >-
      The available evidence supports susceptibility and exposure-association
      nodes plus exploratory statistical interactions. It does not establish a
      named exposure-specific sensor, presented antigen, or causal
      genotype-dependent CD4 pathway in idiopathic sarcoidosis.
    citations:
      - PMID:15347561
      - PMID:19382531
      - PMID:30793815

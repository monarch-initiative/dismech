hypothesis_id: vimentin_autoimmunity_model
assessed_at: "2026-07-31T17:10:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A high-quality, well-sourced report. Its central verdict is sound: vimentin
  autoimmunity is a mechanistically detailed, human-and-mouse-supported feature
  of HLA-DRB1*03+ Lofgren (self-resolving pulmonary) sarcoidosis, but it is one
  antigen within a shared DR3-restricted multi-antigen presentation program, not
  the proven unique or disease-initiating trigger. Two of the report's
  corrections are directly actionable against the seed KB hypothesis: (1) the
  proposed molecular-mimicry bridge to mycobacterial antigens is speculative and
  unsupported, and (2) the DR3 good-prognosis "resolution paradox" is a real
  caveat that reframes the mechanism as antigen recognition coupled to effective
  clearance rather than chronic autoimmunity. All primary PMIDs I acted on were
  independently fetched and their snippets verified as exact abstract substrings.
  Keep the hypothesis at EMERGING with tightened scope.
artifacts: []
claims:
  - claim_id: dr3-presents-vim429-443-to-public-tcr
    statement: >-
      HLA-DRB1*03 presents the vimentin peptide Vim429-443 to a clonally
      restricted, public Valpha2.3(TRAV12-1)/Vbeta22(TRBV2) CD4+ T-cell
      repertoire in Lofgren's sarcoidosis.
    disposition: RETAINED
    report_quote: >-
      Vim)429-443 DSLPLVDTHSKRTLL, matching both the HLA peptide-binding cleft
      and distinct T-cell receptor features
    rationale: >-
      The core molecular claim of the seed hypothesis is strongly and
      convergently documented (structural docking, public deep-sequenced
      repertoire, self-peptide elution). Retained as the well-supported center
      of the causal chain.
    citations:
      - PMID:26585430
      - PMID:28827283
      - PMID:17975675
  - claim_id: mouse-vimentin-immunization-causal
    statement: >-
      Vimentin immunization followed by vimentin-bead challenge reproduces
      sarcoid-like Th1/Th17 lung granulomas in mice, giving rare experimental
      causal support.
    disposition: RETAINED
    report_quote: >-
      Vimentin immunization plus vimentin-bead challenge reproduces
      sarcoidosis-like lung granulomas in mice
    rationale: >-
      Verified against the primary abstract (PMID:35434591): vimentin-immunized
      mice challenged with vimentin-coated beads develop granulomas with giant
      cells, CD4 T cells, and Ifng/Il17/Tnfa upregulation. Genuine causal
      support, with the caveat that a bead-challenge model is not spontaneous
      human disease (MODEL_ORGANISM). Promoted to the KB hypothesis as evidence.
    citations:
      - PMID:35434591
  - claim_id: molecular-mimicry-bridge-unsupported
    statement: >-
      The seed hypothesis's proposed molecular-mimicry reconciliation between
      vimentin and mycobacterial antigens has no linear-sequence support.
    disposition: QUALIFIED
    report_quote: >-
      the seed hypothesis's proposed **molecular-mimicry bridge** between
      vimentin and mycobacterial proteins has **no linear-sequence support**
    rationale: >-
      The point is well taken and the seed KB description overstated a
      speculative mimicry bridge; I softened it in the disorder YAML. However the
      supporting BLOSUM62 sliding-window analysis (F005/F007) is the report's own
      unpublished computation, not a citable primary source, and cannot exclude
      conformational or post-translational mimicry - so I treat "mimicry is
      unsupported/speculative" as a caveat rather than an asserted, citable
      refutation.
    citations: []
  - claim_id: vimentin-not-unique-multi-antigen
    statement: >-
      The same DR3-restricted public TCR responds to several antigens (ATP
      synthase, lysyl-tRNA synthetase, and the microbial mKatG), so vimentin is
      not the unique disease-defining antigen.
    disposition: RETAINED
    report_quote: >-
      the same DR3/AV2S3+ T cells respond to ATP synthase, lysyl-tRNA
      synthetase, and — critically — the microbial antigen mycobacterial
      catalase-peroxidase (mKatG)
    rationale: >-
      Verified against primary abstracts: PMID:19786367 shows DR3-restricted
      T-cell responses to vimentin plus ATP synthase and lysyl-tRNA synthetase;
      PMID:15753209 shows mKatG is a sarcoid tissue antigen and adaptive-immune
      target. Supports reframing the seed model as a shared multi-antigen
      DR3-presentation program. Added to the KB as qualifying/competing evidence.
    citations:
      - PMID:19786367
      - PMID:15753209
  - claim_id: anti-vimentin-not-disease-specific
    statement: >-
      Anti-vimentin autoreactivity is not sarcoidosis-specific (also seen in
      lupus nephritis and, as anti-citrullinated-vimentin, rheumatoid arthritis).
    disposition: RETAINED
    report_quote: anti-vimentin autoreactivity is not sarcoidosis-specific
    rationale: >-
      A valid limitation on vimentin's value as a "disease-defining" antigen or
      biomarker. Captured in the KB hypothesis notes. Not promoted as a
      standalone disorder-YAML evidence item (cross-disease references are
      context, not sarcoidosis evidence).
    citations: []
  - claim_id: dr3-resolution-paradox
    statement: >-
      HLA-DRB1*03, the allele anchoring the model, is a dominant good-prognosis
      allele predicting spontaneous resolution, which is hard to reconcile with
      chronic autoimmunity.
    disposition: RETAINED
    report_quote: >-
      HLA-DRB1\*03, the very allele that anchors the model, is a dominant
      *good-prognosis* allele that predicts spontaneous resolution
    rationale: >-
      Verified against PMID:20187937 (n=754): DRB1*01 and DRB1*03 protect against
      non-resolving disease, and DRB1*03 good prognosis dominates DRB1*15 bad
      prognosis. The most important conceptual caveat; favors an
      "antigen-recognition-coupled-to-clearance" reframing. Added to the KB
      hypothesis notes and a new knowledge-gap discussion.
    citations:
      - PMID:20187937

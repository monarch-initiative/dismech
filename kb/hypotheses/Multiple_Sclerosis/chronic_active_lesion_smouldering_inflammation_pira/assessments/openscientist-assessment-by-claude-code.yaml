overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is high quality and, on verification, citation-clean: the six
  load-bearing PMIDs I checked (the seed plus the meta-analysis, both randomized
  trials, the contested-complement paper, and the competing-substrate study) are
  all real, correctly attributed by title, and quoted as exact substrings of
  their abstracts. Its distinctive claim splits cleanly. The BIOMARKER arm
  (chronic-active-lesion imaging markers -- paramagnetic-rim lesions and slowly
  expanding lesions -- predict PIRA) and the THERAPEUTIC / compartmentalization
  arm (peripheral anti-CD20 fails to move the astrocytic sGFAP marker or PIRMA
  while the brain-penetrant BTK inhibitor tolebrutinib slows progression in
  non-relapsing SPMS) are well supported by meta-analytic and randomized-trial
  evidence and should be retained as strong leads. The MOLECULAR CORE of the
  seeded hypothesis -- C1q as an upstream driver of the MIMS microglial state --
  is supported by direct microglia-specific C1q ablation and therapeutic C1q
  blockade in mouse EAE (PMID:34497421), but its translation to human chronic
  active lesions remains uncertain and is complicated by longitudinal PPMS data
  in which elevated CSF C1q was PROTECTIVE, not harmful (PMID:38912898).
  Grey-matter and spinal-cord atrophy stand as a co-equal / competing anatomical
  substrate for PIRA (PMID:41527428). Recommendation: keep the hypothesis
  EMERGING; the biomarker/therapeutic sub-claims are curation-ready leads, the
  C1q-driver edge must be curated as model-supported but human-translation-limited
  with the PPMS compartment-specific evidence attached, and grey-matter/cord
  degeneration should be recorded as a competing substrate.
artifacts: []
claims:
  - claim_id: prl-sel-biomarker-predicts-pira
    statement: >-
      In vivo chronic-active-lesion imaging markers (paramagnetic-rim lesions
      and slowly expanding lesions) predict progression independent of relapse
      activity (PIRA) and confirmed disability progression.
    disposition: RETAINED
    report_quote: >-
      The presence of PRLs was associated with a higher risk of PIRA (odds ratio
      [OR] 2.24; 95% confidence interval [CI]: 1.17-4.29; p = 0.01) and CDP (OR
      2.87; 95% CI: 1.01-8.1; p = 0.05).
    rationale: >-
      Verified: PMID:41205558 is a real systematic review/meta-analysis with the
      matching title and the quoted OR values are exact substrings of the cached
      abstract. Independently corroborated by an SEL diffusion-MRI cohort
      (PMID:40897401, quoted values verified as present) and a post-mortem
      QSM-to-Perls' histology validation of the iron rim. Strong, curation-ready
      biomarker lead; still observational and heterogeneous across cohorts.
    citations:
      - PMID:41205558
      - PMID:40897401
  - claim_id: cns-penetrant-btki-slows-pira
    statement: >-
      A CNS-penetrant, myeloid/microglia-directed therapy (the BTK inhibitor
      tolebrutinib) slows disability progression in non-relapsing secondary
      progressive MS, as the compartmentalization model predicts.
    disposition: RETAINED
    report_quote: >-
      A smaller percentage of participants in the tolebrutinib group than in the
      placebo group had confirmed disability progression sustained for at least
      6 months (22.6% vs. 30.7%; hazard ratio, 0.69; 95% confidence interval,
      0.55 to 0.88; P = 0.003).
    rationale: >-
      Verified: PMID:40202696 is the real HERCULES phase 3 trial ("Tolebrutinib
      in Nonrelapsing Secondary Progressive Multiple Sclerosis"); the quoted HR
      and event rates are exact substrings of the cached abstract. This is
      strong therapeutic support for the "CNS-penetrant beats peripheral"
      prediction. Caveat (report's own Gap 4): the trial does not prove the
      benefit is MEDIATED by lesion-rim/microglial modulation -- no PRL-mediation
      analysis exists -- so the specific rim-target attribution stays inferred.
    citations:
      - PMID:40202696
  - claim_id: bbb-compartmentalization-dissociation
    statement: >-
      Peripheral B-cell depletion (anti-CD20/rituximab) lowers the acute axonal
      marker sNfL but not the astrocytic marker sGFAP or relapse-independent
      progression, dissociating a peripherally accessible arm from a BBB-shielded
      progressive arm.
    disposition: RETAINED
    report_quote: >-
      sGFAP remained stable in RTX (3.6% decrease; CI -7.8%-13.8%, p = 0.81) but
      decreased with DMF (18.4%; CI 8.5%-27.2%; p < 0.001).
    rationale: >-
      Verified: PMID:41968564 (RIFUND-MS, "Dimethyl Fumarate, But Not Rituximab,
      Reduces Serum GFAP Levels and PIRMA in Relapsing-Remitting MS"); both the
      sGFAP quote and the "PIRMA ... higher with RTX (HR 3.3 ...)" statement are
      present in the cached abstract. Cleanly supports the BBB-shielding
      prediction. Note this is an RRMS cohort, so it tests the dissociation, not
      the progressive-phase mechanism directly.
    citations:
      - PMID:41968564
  - claim_id: c1q-upstream-driver-of-mims
    statement: >-
      Complement component C1q is an upstream causal driver of the "microglia
      inflamed in MS" (MIMS) state that drives smouldering demyelination.
    disposition: QUALIFIED
    report_quote: >-
      C1q causal directionality is unconfirmed and possibly reversed.
    rationale: >-
      This is the seeded molecular core and the main translational uncertainty.
      PMID:34497421 does perturb C1q directly: it reports microglia-specific C1q
      ablation and therapeutic C1q blockade in mouse EAE. The limiting issue is
      whether that model-organism mechanism operates in human lesion-rim MIMS.
      PMID:38912898 reports elevated CSF C1q as a protective prognostic factor,
      which complicates but does not directly refute local microglial C1q because
      the analyte and compartment differ. Curate the mechanism as model-supported
      but human-translation-limited, use PARTIAL for the CSF evidence, and open a
      HUMAN_MODEL_MISMATCH discussion on compartment-resolved C1q directionality.
    citations:
      - PMID:34497421
      - PMID:38912898
  - claim_id: competing-grey-matter-cord-substrate
    statement: >-
      Grey-matter and spinal-cord degeneration are a co-equal or competing
      anatomical substrate for PIRA, not fully reducible to white-matter rim
      lesions.
    disposition: RETAINED
    report_quote: >-
      Spinal cord atrophy consistently emerged as the strongest predictor of
      disability severity and predicted PIRA, along with cortical thinning and
      subcortical atrophy - particularly in deep gray matter.
    rationale: >-
      Verified: PMID:41527428 is real with a matching title; the quoted sentence
      is present in the cached abstract (line-wrapped). This is the most
      important qualification to the seed -- WM rims are a driver, but cord/GM
      atrophy may drive PIRA at least as strongly and partly independently.
      Record as a competing substrate / discussion prompt rather than folding it
      into the smouldering-lesion causal chain.
    citations:
      - PMID:41527428
  - claim_id: overall-status-emerging
    statement: >-
      The hypothesis should remain EMERGING, with biomarker/therapeutic arms
      elevated toward well-supported and the molecular-causal core flagged as
      contested.
    disposition: RETAINED
    report_quote: >-
      explicitly flag the C1q-driver mechanism as speculative/contested while
      adding grey-matter/cord degeneration as a competing substrate.
    rationale: >-
      Concur. The verified evidence supports the KIND of process (compartmentalized,
      innate/glial, BBB-shielded) and how to monitor/treat it, but not the precise
      molecular trigger. EMERGING is the correct status; the report's own scoping
      of what is strong vs contested is well-calibrated and matches the verified
      citations.
    citations:
      - PMID:34497421
      - PMID:40202696
      - PMID:38912898

hypothesis_id: canonical_autoimmune_demyelination_neurodegeneration_model
assessed_at: "2026-09-02T11:06:39Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is citation-clean at the identifier level: every load-bearing PMID I
  fetched (35025605, 35073561, 40063790, 41934071, 41239018, 29774057, 21555250,
  39711984, 40357663, 34293193, 41284953, 41666922, 34156169, 35285112, 39465429,
  41961242) resolves to a real paper with the title the report implies. Its
  three pillars for relapsing disease hold on source check: the Bjornevik
  military cohort's 32-fold post-EBV risk with the NfL rise confined to
  post-seroconversion, the >200-locus immune-centred genetic architecture with
  HLA-DRB1*15:01 as the dominant allele, and anti-CD20 interventional
  validation including the observation that CD20 depletion spares plasma cells
  and so implicates non-antibody B-cell functions. Its qualifications for
  progressive disease also hold: PIRA is the main disability-accrual mechanism
  in all four latent-class phenotypes of 2,563 untreated patients, chronic
  active lesions track worsening disability, and meningeal ectopic lymphoid
  follicles occur in about 40% of progressive post-mortem brains. The verdict is
  PARTIALLY_SUPPORTED rather than SUPPORTED for two reasons. First, much of the
  supportive material restates the seed hypothesis the KB supplied, so it is
  confirmation rather than new support; the genuinely new material is the
  progressive-MS qualification, the EBNA1-GlialCAM mechanism, and the
  inside-out alternative. Second, three specific statements do not survive
  source checking as written: the DMT-resistance quotation is attributed to the
  wrong PMID (the sentence is in 39711984, not 41961242, which does not contain
  the word "resistant" at all, yet the report marks the attribution "Verified");
  the epitope-spreading result is reported as demonstrated when its source says
  "suggest"; and the NfL-versus-GFAP biomarker dissociation is asserted with no
  citation and sits beside a paper that actually links sNfL to PIRA risk. The
  inside-out alternative is real and worth recording, but the report's claim
  that myelin blistering "precedes immune infiltration" is an inference its
  cited review does not make.
artifacts: []

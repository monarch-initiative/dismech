  - data_source_id: gencc
    source_type: DATABASE
    name: Gene Curation Coalition (GenCC) gene-disease validity assertions
    uri: https://search.thegencc.org/
    access_status: UNVERIFIABLE
    notes: >-
      Gap 6 reports a negative result ("No GenCC or ClinGen clinical validity
      assertions for MS-specific genes were identified in this search"). A
      negative search is only recordable as SEARCHED_NO_RESULT with a committed
      query and response; neither exists here, so the absence claim cannot be
      distinguished from an unperformed search. Note also that GenCC/ClinGen
      curate Mendelian gene-disease validity, which is the wrong instrument for
      a polygenic susceptibility disease, so the absence is expected and is not
      the evidential shortfall the report implies.

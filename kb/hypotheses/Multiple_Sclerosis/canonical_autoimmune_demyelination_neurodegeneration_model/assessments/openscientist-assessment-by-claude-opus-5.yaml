analyses:
  - analysis_id: narrative-literature-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative synthesis of PubMed-indexed literature into an evidence matrix,
      a causal-chain diagram, a knowledge-gap list, and curation leads.
    status_reason: >-
      No computation is claimed and the report says so itself ("This report is
      based on literature synthesis rather than primary analysis of
      patient-level data"). There is no committed code, environment, output
      table, or artifact bundle, so the evidence matrix and the confirmed-finding
      count cannot be regenerated or audited; they are provider assertions.
      Recorded here because the report presents structured, tabulated output
      that reads as a derived result.
    limitations: >-
      Search restricted to PubMed-indexed English literature as of May 2026,
      with preprints, conference abstracts, and non-English sources excluded by
      the report's own account. Selection of the 81 reviewed papers is
      undocumented, so citation selection bias cannot be assessed.
claims:
  - claim_id: ebv-near-necessary-upstream-trigger
    statement: >-
      Epstein-Barr virus infection is a near-necessary upstream trigger for
      multiple sclerosis, with a roughly 32-fold risk increase after
      seroconversion that is specific to EBV among common viruses.
    disposition: RETAINED
    report_quote: >-
      MS risk increased 32-fold following EBV infection (HR = 32), with no
      comparable risk increase after infection with other viruses, including the
      similarly transmitted cytomegalovirus
    rationale: >-
      Verified against the cached abstract of PMID:35025605, which states "Risk
      of MS increased 32-fold after infection with EBV but was not increased
      after infection with other viruses, including the similarly transmitted
      cytomegalovirus" in a cohort of more than 10 million US military personnel
      with 955 incident MS cases. The report's companion point about temporal
      ordering is also exact: serum neurofilament light chain rose only after
      EBV seroconversion. This is the strongest single citation in the report
      and, notably, was absent from the dismech entry, whose EBV evidence rested
      on reviews.
    citations:
      - PMID:35025605
  - claim_id: ebna1-glialcam-molecular-mimicry
    statement: >-
      Molecular mimicry between the EBV nuclear antigen 1 (EBNA1) and the CNS
      protein GlialCAM provides a molecular route from EBV infection of B cells
      to a CNS-directed adaptive immune response.
    disposition: RETAINED
    report_quote: >-
      identified molecular mimicry between the EBV nuclear antigen 1 (EBNA1) and
      the glial cell adhesion molecule GlialCAM
    rationale: >-
      Verified. PMID:35073561 demonstrates high-affinity EBNA1-GlialCAM mimicry
      with a crystal structure of the EBNA1 epitope bound to a CSF-derived Fab,
      shows EBNA1 immunization exacerbates disease in a mouse MS model, and
      reports anti-EBNA1 and anti-GlialCAM antibodies are prevalent in MS.
      PMID:40063790 independently confirms cross-reactivity by blocking
      experiments in 650 patients versus 661 controls. This is a genuine
      mechanistic addition; the dismech entry carried the corresponding
      proteomics dataset but no mechanism node or evidence for it.
    citations:
      - PMID:35073561
      - PMID:40063790
  - claim_id: epitope-spreading-demonstrated
    statement: >-
      Epitope spreading from EBNA1 to adjacent GlialCAM peptide regions has been
      demonstrated in a large case-control cohort.
    disposition: QUALIFIED
    report_quote: >-
      demonstrating epitope spreading from EBNA1 to adjacent GlialCAM peptide
      regions
    rationale: >-
      Two problems, neither fatal. PMID:40063790 says antibody responses against
      adjacent peptide regions of GlialCAM "suggest epitope spreading" - the
      report upgrades "suggest" to "demonstrating". The spreading described is
      also within GlialCAM (to peptide regions adjacent to the mimicked
      epitope), not "from EBNA1 to" GlialCAM regions as the report's phrasing
      implies. The underlying observation is real and the cohort sizes quoted
      (650 versus 661) are exact; only the strength and direction of the wording
      need narrowing before curation.
    citations:
      - PMID:40063790
  - claim_id: polygenic-immune-genetic-architecture
    statement: >-
      MS susceptibility is polygenic and immune-centred, with more than 200
      associated genomic regions and HLA-DRB1*15:01 as the most robust
      individual risk allele.
    disposition: RETAINED
    report_quote: The genetic architecture of MS is unambiguously polygenic and immune-centered.
    rationale: >-
      Verified against PMID:41934071, which states the number of susceptibility
      regions is now more than 200, names HLA-DRB1*15:01 and its extended
      haplotypes as the most robust and reproducible risk factors, and lists the
      non-HLA pathways (T-cell and B-cell activation, cytokine signalling,
      antigen presentation) the report cites. This restates material the seed
      hypothesis already asserted and that the dismech entry already curates
      across HLA-DRB1, IL7R, IL2RA, CD40, TYK2, STAT3 and CD28 genetic entries,
      so it confirms rather than extends the KB.
    citations:
      - PMID:41934071
  - claim_id: hla-drb1-mendelian-randomization-causality
    statement: >-
      Mendelian randomization establishes a causal effect of HLA-DRB1 on MS risk
      with an odds ratio of 2.24 and 100% colocalization.
    disposition: QUALIFIED
    report_quote: >-
      Yan et al. (2025) demonstrated that HLA-DRB1 confers an OR of 2.24 for MS
      risk with 100% colocalization probability
    rationale: >-
      The numbers are exact - PMID:41239018 reports OR 2.24 for HLA-DRB1 and
      100% colocalization - but the report elides what the exposure is. The MR
      instrument is cis-eQTL-predicted HLA-DRB1 expression, not the classical
      DRB1*15:01 haplotype, so the OR describes elevated transcript level rather
      than allele carriage, and the two are not interchangeable. MR inside the
      MHC is additionally confounded by extreme long-range linkage
      disequilibrium and extensive HLA paralogy, which the report does not
      mention. The microglial gene targets it foregrounds (ARHGAP25, MERTK,
      MS4A6A, SYK) are real findings of the same paper but are eQTL-derived
      leads, not validated causal genes.
    citations:
      - PMID:41239018
  - claim_id: anti-cd20-interventional-validation
    statement: >-
      Anti-CD20 B-cell depletion provides the strongest interventional
      validation of the autoimmune arm of the canonical model.
    disposition: RETAINED
    report_quote: >-
      The dramatic efficacy of anti-CD20 therapies represents the strongest
      interventional evidence for the autoimmune arm of the canonical model.
    rationale: >-
      Supported, and already curated. PMID:29774057 is a real review of the
      ocrelizumab programme and the OPERA/ORATORIO numbers the report quotes
      (46-47% relapse reduction, 94-95% fewer gadolinium-enhancing lesions,
      first positive PPMS trial) match the primary trial reports. The dismech
      entry already carries the primary sources directly (PMID:28002679 OPERA,
      PMID:28002688 ORATORIO, PMID:32757523 ASCLEPIOS) with matching quoted
      effect sizes, so the report adds a review layer over evidence the KB
      already holds at primary-source grade. No integration needed for the
      efficacy claim itself.
    citations:
      - PMID:29774057
  - claim_id: b-cells-act-through-non-antibody-functions
    statement: >-
      Because CD20 depletion spares CD20-negative plasma cells, anti-CD20
      efficacy implicates non-antibody B-cell functions such as antigen
      presentation and cytokine secretion rather than autoantibody production.
    disposition: RETAINED
    report_quote: >-
      its efficacy demonstrated that B cells contribute to MS through
      non-antibody functions
    rationale: >-
      Verified. PMID:21555250 states that insights from rituximab studies "have
      underscored the importance of non-antibody mediated functions of B cells",
      and the plasma-cell-sparing argument is the standard reading of that
      result. This is the mechanistically interesting half of the anti-CD20
      story and, unlike the efficacy numbers, it was absent from the dismech
      treatment entry, which asserted validation of the B-cell arm without
      saying which B-cell function is implicated.
    citations:
      - PMID:21555250
  - claim_id: smouldering-inflammation-resists-dmts
    statement: >-
      Smouldering neuroinflammation behind a relatively intact blood-brain
      barrier is relatively resistant to existing disease-modifying therapies,
      as reported by Preziosa et al. (PMID:41961242).
    disposition: REJECTED
    report_quote: >-
      Smoldering neuroinflammation persists behind a relatively intact
      blood-brain barrier and is "relatively resistant to treatment with
      existing disease-modifying therapies"
    rationale: >-
      REJECTED as attributed, not as science. The quoted sentence is not in
      PMID:41961242 (Preziosa et al., "Treatment Effects on Chronic Active
      Lesions in Multiple Sclerosis"); the cached full text of that paper does
      not contain the string "resistan" at all. The sentence is from
      PMID:39711984 ("Chronic active lesions in multiple sclerosis:
      classification, terminology, and clinical significance"), whose abstract
      reads "This condition, known as smoldering neuroinflammation, is present
      across the clinical spectrum of MS and is currently understood to be
      relatively resistant to treatment with existing disease-modifying
      therapies". The report repeats the misattribution in Curation Lead 3 and
      marks it "Verified", which is the failure mode this review exists to
      catch: a curator copying that lead would have committed a snippet that
      cannot match its cited cache file. The claim itself is correct and is
      curated here against PMID:39711984.
    citations:
      - PMID:39711984
      - PMID:41961242
  - claim_id: chronic-active-lesions-track-disability
    statement: >-
      Chronic active lesions, detected in vivo as paramagnetic rim lesions and
      slowly expanding lesions, are associated with worsening disability across
      MS phenotypes.
    disposition: RETAINED
    report_quote: >-
      A systematic review of 30 studies confirmed that CALs are associated with
      worsening disability across MS phenotypes
    rationale: >-
      Verified. PMID:40357663 is a systematic literature review of CAL-outcome
      associations naming exactly the three in vivo markers the report lists
      (PRLs, TSPO-PET rim-positive lesions, SELs), and PMID:39711984 confirms
      that PRLs are highly specific to MS and have been incorporated into the
      diagnostic criteria. This is the same biomarker arm the sibling
      chronic_active_lesion_smouldering_inflammation_pira hypothesis already
      curates against PMID:41205558, so the KB holds the claim; the report
      corroborates it from an independent review.
    citations:
      - PMID:40357663
      - PMID:39711984
  - claim_id: meningeal-ectopic-lymphoid-follicles
    statement: >-
      Meningeal ectopic lymphoid follicles occur in roughly 40% of progressive
      MS post-mortem brains and track cortical degeneration severity and
      clinical progression.
    disposition: RETAINED
    report_quote: >-
      Ectopic lymphoid follicles (ELFs) in the meninges, found in approximately
      40% of progressive MS post-mortem brain tissues, are associated with the
      severity of cortical degeneration and clinical disease progression
    rationale: >-
      Verified essentially word for word against the cached abstract of
      PMID:34293193. The same review is candid that the absence of a uniform
      ELF definition impedes reproducible neuropathology, so the 40% figure
      should be carried as an approximate post-mortem prevalence rather than a
      stable parameter. The dismech entry asserts meningeal lymphoid aggregates
      in both the canonical hypothesis description and the Compartmentalized CNS
      Inflammation node but cited no source specific to them.
    citations:
      - PMID:34293193
  - claim_id: pira-dominant-disability-mechanism
    statement: >-
      Progression independent of relapse activity is the main disability-accrual
      mechanism across disability-worsening phenotypes, including in relapse-onset
      MS.
    disposition: RETAINED
    report_quote: >-
      Latent class analysis of over 2,500 untreated MS patients identified four
      disability worsening phenotypes, with PIRA representing the main
      disability accrual mechanism in all phenotypes
    rationale: >-
      Verified. PMID:41284953 analysed 2,563 untreated and 2,952 treated
      relapse-onset patients from the Italian MS Register over a median 10.1
      years, identified four latent classes, and states "In all phenotypes,
      PIRA represented the main disability accrual mechanism". This directly
      substantiates the qualification the dismech canonical-hypothesis notes
      already assert in prose but had not cited. The paper's own caveat -
      phenotypes derived from EDSS alone - should travel with the claim.
    citations:
      - PMID:41284953
  - claim_id: nfl-gfap-biomarker-dissociation
    statement: >-
      Serum NfL predicts acute inflammatory activity but not PIRA, whereas GFAP
      predicts progression under low inflammatory activity.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      NfL predicts acute inflammatory activity but does not reliably predict
      PIRA, whereas GFAP (a marker of astrogliosis) is associated with
      progression even with low inflammatory activity
    rationale: >-
      The report gives this no citation of its own; the only PMID in the
      paragraph is 41666922, which does not test it and in fact reports the
      opposite direction for one half - choroid plexus volume correlates with
      sNfL and predicts relapse-independent progression, so sNfL is not cleanly
      dissociated from PIRA there. The sGFAP half is separately supported in
      the sibling hypothesis by PMID:41968564 (RIFUND-MS), where rituximab
      lowered sNfL but not sGFAP or PIRMA. Not integrated: the dissociation may
      well be true, but as stated it is an uncited generalization and would need
      a dedicated biomarker source before it becomes evidence.
    citations:
      - PMID:41666922
      - PMID:41968564
  - claim_id: choroid-plexus-enlargement-predicts-pira
    statement: >-
      Choroid plexus enlargement is associated with serum neurofilament light
      chain and confers a 2.7-fold increased risk of progression independent of
      relapse activity.
    disposition: QUALIFIED
    report_quote: >-
      Choroid plexus enlargement, reflecting CSF-mediated inflammation, confers
      a 2.7-fold increased risk of PIRA
    rationale: >-
      The quantitative claim is exact - PMID:41666922 reports that high CP
      volume "confers a 1.8-fold increased risk of disability worsening and a
      2.7-fold increased risk of progression independent of relapse activity" in
      a 434-patient prospective multicentre cohort. The gloss "reflecting
      CSF-mediated inflammation" is the report's interpretation, not a measured
      result; the paper offers CP enlargement as a non-invasive imaging
      biomarker of neuroaxonal loss and relapse-free progression and does not
      establish a CSF-inflammatory mechanism. Curated as a prognostic
      association attached to the open question about which anatomical
      substrate drives PIRA, with the mechanistic gloss dropped.
    citations:
      - PMID:41666922
  - claim_id: inside-out-cns-first-alternative
    statement: >-
      An inside-out model, in which a primary CNS cytodegenerative process
      releases myelin antigen and triggers secondary autoimmunity, competes with
      the canonical outside-in ordering and is not resolved in humans.
    disposition: QUALIFIED
    report_quote: >-
      The inside-out model has experimental support but lacks definitive human
      evidence establishing primacy over the outside-in pathway.
    rationale: >-
      The alternative is real and its two anchors check out. PMID:34156169
      argues from non-human primate models, where the immune system is
      experienced rather than specific-pathogen-free, that the trigger is
      endogenous, and reports myelin blistering in normal-appearing white matter
      of MS brains. PMID:35285112 shows Ermin loss produces de-compacted,
      fragmented myelin with later microgliosis and astrogliosis and increased
      susceptibility to demyelinating insult, and reports a rare inactivating
      ERMN variant in MS patients. QUALIFIED rather than RETAINED because the
      report's own scoping is right: neither line establishes primacy in human
      disease, the ERMN finding is a single rare inactivating mutation rather
      than the plural "mutations" the report writes, and the honest KB home for
      this is an open controversy rather than a competing mechanistic_hypotheses
      entry.
    citations:
      - PMID:34156169
      - PMID:35285112
  - claim_id: myelin-blistering-precedes-infiltration
    statement: >-
      Myelin blistering in normal-appearing white matter precedes immune
      infiltration.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      including observations of myelin blistering in normal-appearing white
      matter that precedes immune infiltration
    rationale: >-
      PMID:34156169 does describe myelinated axons in normally appearing white
      matter where myelin sheaths have locally dissociated from the enwrapped
      axon, and argues the ensuing disintegration releases post-translationally
      modified myelin. It does not report a temporal observation that blistering
      precedes infiltration; that ordering is the inside-out hypothesis being
      argued for, so using it as evidence for the hypothesis is circular. The
      temporal claim needs a source that actually times the two events.
    citations:
      - PMID:34156169
  - claim_id: btk-inhibition-targets-cns-compartment
    statement: >-
      Brain-penetrant BTK inhibition acts on microglial as well as B-cell
      signalling and is therefore the decisive therapeutic test of the
      compartmentalized-inflammation component of the model.
    disposition: RETAINED
    report_quote: >-
      fenebrutinib blocks microglial FcγR activation, cytokine and chemokine
      release, microglial clustering, and neurite damage in diverse human brain
      cell systems
    rationale: >-
      Verified almost verbatim against PMID:39465429, which reports in human
      iPSC-derived microglia and brain organoids that fenebrutinib blocks Fc
      gamma receptor-driven cytokine and chemokine release, microglial
      clustering and neurite damage, while notably not affecting TLR4, NLRP3 or
      myelin phagocytosis - a specificity the report omits and that matters for
      how much of smouldering biology BTK inhibition can reach. PMID:42075951
      and PMID:41015666 support the trial-level framing, including heterogeneous
      phase 2/3 outcomes. Already partly curated: the sibling hypothesis carries
      the positive HERCULES phase 3 result for tolebrutinib (PMID:40202696), so
      the claim is represented in the entry even though no BTK treatment entry
      exists yet.
    citations:
      - PMID:39465429
      - PMID:42075951
      - PMID:41015666
  - claim_id: report-largely-confirms-its-own-seed
    statement: >-
      The report's supportive findings for the canonical model are new evidence
      rather than a restatement of the hypothesis the KB supplied as its seed.
    disposition: REJECTED
    report_quote: >-
      Seven key findings were confirmed through literature synthesis, spanning
      the EBV trigger, genetic architecture, B cell depletion therapy, chronic
      active lesions, inside-out competing model, PIRA as a dominant disability
      mechanism, and BTK inhibitors as next-generation therapeutic tests.
    rationale: >-
      Four of the seven "confirmed findings" - EBV as trigger, polygenic immune
      architecture, anti-CD20 validation, and chronic active lesions with
      meningeal follicles driving progression - are asserted verbatim in the
      seed hypothesis YAML reproduced at the top of the report, and three of
      those four were already curated in the dismech entry. Presenting them as
      confirmations overstates what the run produced. The genuinely additive
      material is narrower: the EBNA1-GlialCAM mechanism, the quantified PIRA
      latent-class result, the ectopic-follicle prevalence, the choroid-plexus
      association, and the inside-out alternative. Recording this so the verdict
      is not read as independent corroboration of the seed.
    citations:
      - PMID:35073561
      - PMID:41284953
      - PMID:34293193

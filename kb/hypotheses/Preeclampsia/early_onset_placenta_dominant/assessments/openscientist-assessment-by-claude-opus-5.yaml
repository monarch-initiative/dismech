analyses:
  - analysis_id: literature-screen
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Iterative literature screening summarized as "5 iterations, 14 confirmed
      findings, 98 papers reviewed".
    status_reason: >-
      No search strategy, screening log, inclusion criteria, or list of the 98
      reviewed papers is committed. The citations sidecar lists 30 identifiers,
      not 98, so even the denominator cannot be reconstructed.
    limitations: >-
      Because the screen cannot be replayed, its most consequential output, the
      claim that a deliberate search for refuting evidence returned nothing,
      cannot be audited. That claim is separately contradicted by one of the
      report's own citations.
  - analysis_id: negative-evidence-search
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Systematic search for refuting evidence, reported in Finding 14 as
      returning no early-onset preeclampsia without elevated sFlt-1, no failed
      sFlt-1-targeted trials, and no early-onset preeclampsia with normal
      placental histology.
    status_reason: >-
      No queries, databases, dates, or screened-record counts are recorded. A
      negative result asserted in prose without a search log cannot be graded as
      a completed search.
    limitations: >-
      The assessor's own check of PMID:29858106, which the report cites, found a
      pilot apheresis study whose authors concluded that pregnancy prolongation
      occurred without lowering sFlt-1. That is a qualifying negative result
      inside the report's own reference list.
  - analysis_id: flt1-mendelian-randomization
    status: SKIPPED
    auditability: UNVERIFIABLE
    method: >-
      Two-sample Mendelian randomization using FLT1 variants as instruments for
      circulating sFlt-1, with preeclampsia as the outcome.
    input_data_source_ids:
      - uk-biobank
      - finngen
    status_reason: >-
      Proposed in the Discriminating Tests section as a study the field should
      run. The report neither claims to have run it nor reports an estimate.
      Recorded here so the proposal is not mistaken for provider analysis.
claims:
  - claim_id: central-antiangiogenic-chain
    statement: >-
      Placental ischemia in early-onset preeclampsia drives an antiangiogenic
      shift, dominated by excess sFlt-1 and soluble endoglin with reduced free
      PlGF, that causes maternal endothelial dysfunction and multi-organ injury,
      and the hypothesis should keep CANONICAL status.
    disposition: RETAINED
    report_quote: >-
      **Verdict: STRONGLY SUPPORTED** — Maintain CANONICAL status.
    rationale: >-
      The chain is the KB seed restated, so the report earns little credit for
      it, but it is independently well supported. PMID:22103497 applies
      Bradford-Hill criteria and concludes that antiangiogenic factor elevation
      satisfies temporality while inflammatory markers do not, and that
      corticosteroid immunosuppression fails to improve maternal outcome. The
      target entry already carries the sFlt-1, sEng, and endothelial nodes with
      their landmark citations, so retaining CANONICAL needs no status edit.
    citations:
      - PMID:22103497
      - PMID:35177220
  - claim_id: single-cell-flt1-pgf-early-onset
    statement: >-
      Single-cell and single-nuclei transcriptomics of human placenta show FLT1
      upregulation and PGF downregulation specifically in syncytiotrophoblast
      and extravillous trophoblast in early-onset preeclampsia.
    disposition: RETAINED
    report_quote: >-
      Key findings in early-onset preeclampsia included disrupted
      syncytiotrophoblast and extravillous trophoblast angiogenic signaling,
      characterized by an up-regulation of FLT1 and down-regulation of PGF,
      consistent with an angiogenic imbalance.
    rationale: >-
      The proposed snippet is a verbatim sentence of the PMID:40253080 abstract
      and the cell-type attribution is exactly as stated. PMID:41582793 reports
      the same atlas with the early-onset contrast. This is the report's most
      useful genuine addition: it puts the antiangiogenic shift at cell-type
      resolution in the tissue, where the target entry previously had only
      circulating-protein evidence.
    citations:
      - PMID:40253080
      - PMID:41582793
  - claim_id: late-onset-outside-model
    statement: >-
      Late-onset preeclampsia shows comparatively subtle placental
      transcriptional change and is driven by maternal cardiovascular
      maladaptation, so the antiangiogenic model does not apply to it as a
      primary mechanism.
    disposition: RETAINED
    report_quote: >-
      | Late-onset PE driven by antiangiogenic shift | **CONTRADICTED** |
      scRNA-seq shows distinct pathology |
    rationale: >-
      Both single-cell sources state this directly, and PMID:41582793 names
      maternal cardiovascular maladaptation, placental aging, cellular
      senescence, and oxidative stress as the late-onset process. This agrees
      with the target entry's existing two-hypothesis structure, so the finding
      confirms an existing curation decision rather than changing it. Note the
      one tension with the FLT1 genetics discussed below.
    citations:
      - PMID:41582793
      - PMID:40253080
  - claim_id: fetal-flt1-gwas-significance
    statement: >-
      The fetal FLT1 preeclampsia locus rs4769613 reached P = 5.4 x 10^-16 in
      2,658 offspring of preeclamptic pregnancies against 308,292 controls.
    disposition: REJECTED
    report_quote: >-
      The first genome-wide significant susceptibility locus for PE maps to
      rs4769613 near FLT1 on chromosome 13 (P = 5.4 × 10⁻¹⁶), identified in a
      GWAS of 2,658 offspring from preeclamptic pregnancies vs 308,292 controls
    rationale: >-
      PMID:28628106 reports "rs4769613; P = 5.4 × 10-11" in "4,380 cases and
      310,238 controls". The exponent is wrong by five orders of magnitude, and
      the sample counts are the discovery-screen figures as described in the
      PMID:29138037 review, spliced onto the primary paper's headline result.
      The report repeats the wrong exponent four times, including in its
      Executive Judgment and Claim Classification table. The locus and its
      biological interpretation are correct; the quantitative claim is not.
    citations:
      - PMID:28628106
      - PMID:29138037
  - claim_id: flt1-gwas-not-subtype-stratified
    statement: >-
      The fetal FLT1 GWAS was never stratified by early versus late
      preeclampsia, leaving the hypothesis's prediction that FLT1 variants are
      early-onset specific untested.
    disposition: REJECTED
    report_quote: >-
      **Scope:** The fetal FLT1 GWAS hit was not stratified by early vs. late
      PE.
    rationale: >-
      PMID:28628106 reports the stratification in its own abstract: "The
      association was strongest in offspring from pregnancies in which
      preeclampsia developed during late gestation and offspring birth weights
      exceeded the tenth centile." So the analysis exists, and its direction is
      the opposite of what this hypothesis predicts. This matters twice over.
      The gap as written is false, and the report's single strongest genetic
      pillar for an early-onset-specific model is drawn from a paper whose
      signal is strongest in late-gestation disease with normally grown babies.
      The honest reading is that fetal FLT1 genetics supports the antiangiogenic
      axis in preeclampsia generally without supporting its restriction to the
      early-onset subtype.
    citations:
      - PMID:28628106
  - claim_id: help-apheresis-supports-sflt1-removal
    statement: >-
      The H.E.L.P. apheresis study is interventional evidence that removing
      sFlt-1 prolongs pregnancy in very preterm preeclampsia.
    disposition: REJECTED
    report_quote: >-
      The H.E.L.P. apheresis study (n = 6 vs 6 controls) showed average
      admission-to-birth interval of 15.0 days vs 6.3 days in controls (p =
      0.027)
    rationale: >-
      The prolongation figures are quoted correctly, but the mechanism
      attribution inverts the source. PMID:29858106 concludes that H.E.L.P.
      apheresis "rather stabilized sFlt-1 levels at pre-apheresis levels
      throughout treatments, with sFlt-1/PLGF ratio remaining unaffected" and
      that "without changing sFlt-1 levels below baseline lowering lipids or
      other yet undefined factors appear to be of more relevance than reducing
      sFlt-1." The report's Evidence Matrix nonetheless files it under "sFlt-1
      removal prolongs pregnancy". This study partly dissociates apheresis
      benefit from sFlt-1 removal and belongs on the qualifying side.
    citations:
      - PMID:29858106
  - claim_id: dsc-apheresis-reversibility
    statement: >-
      Dextran sulfate cellulose apheresis lowers circulating sFlt-1, reduces
      proteinuria, and prolongs pregnancy, satisfying the Bradford-Hill
      experiment or reversibility criterion.
    disposition: QUALIFIED
    report_quote: >-
      This satisfies the Bradford-Hill experiment/reversibility criterion:
      removing the hypothesized causal agent improves the disease.
    rationale: >-
      PMID:21810665 does report dose-dependent sFlt-1 adsorption in 5 women and
      prolongation of 15, 19, and 23 days in 3 further women, and its own
      conclusion is deliberately hedged: a pilot study that "supports the
      hypothesis", with "further studies warranted". There is no control group,
      no randomization, and eight participants in total. Once the H.E.L.P.
      citation is removed from this argument, the reversibility criterion rests
      on this single uncontrolled series plus PMID:22103497's review-level
      assertion. Retained as a real interventional signal, not as proof.
    citations:
      - PMID:21810665
      - PMID:22103497
  - claim_id: hif1a-mechanistic-hub
    statement: >-
      HIF-1alpha stabilization is the transcriptional hub linking persistent
      placental hypoxia to sFlt-1 overproduction and to mitochondrial
      dysfunction and oxidative stress.
    disposition: QUALIFIED
    report_quote: >-
      HIF-1α has been identified as the transcriptional regulator linking
      placental ischemia to the antiangiogenic shift.
    rationale: >-
      PMID:41814104 states each element the report attributes to it: persistent
      hypoxia stabilizes HIF-1alpha, sustained activation drives mitochondrial
      dysfunction and oxidative stress, and HIF-1alpha promotes antiangiogenic
      programs including sFlt-1 upregulation. It is a review, and the report's
      own Gap 1 correctly notes that no HIF-1alpha perturbation has been done in
      human placental tissue. Worth curating as a mechanism node with the
      review-level caveat stated, which is what the target entry now does.
    citations:
      - PMID:41814104
  - claim_id: kir-hla-c-gmcsf-trigger
    statement: >-
      The maternal KIR and fetal HLA-C combination is the upstream immunogenetic
      trigger, acting through activating KIR2DS1 on decidual NK cells that
      stimulates GM-CSF secretion and enhances trophoblast migration.
    disposition: RETAINED
    report_quote: >-
      Activating KIR2DS1 on decidual NK cells recognizes HLA-C2 on trophoblast
      and stimulates GM-CSF production, which enhances trophoblast migration.
    rationale: >-
      PMID:24091323 demonstrates exactly this in primary decidual NK cells, with
      GM-CSF measured by intracellular FACS and ELISA and migration shown in
      primary trophoblast and JEG-3 cells. PMID:20972337 adds a specificity the
      target entry lacked: maternal KIR AA frequency is raised in affected
      pregnancies only when the fetus carries more group 2 HLA-C genes than the
      mother, implicating a paternally inherited C2 allogeneic effect. This is
      the report's second genuinely useful mechanistic addition.
    citations:
      - PMID:24091323
      - PMID:20972337
  - claim_id: no-refuting-evidence-found
    statement: >-
      An active search for negative results found no failed sFlt-1-targeted
      therapy trials and no refuting evidence of any kind.
    disposition: REJECTED
    report_quote: >-
      Systematic searches for negative evidence found: no published reports of
      early-onset PE without elevated sFlt-1, no failed sFlt-1-targeted therapy
      trials
    rationale: >-
      PMID:29858106, which the report itself cites and lists in its Evidence
      Matrix, reports an apheresis intervention that prolonged pregnancy while
      leaving sFlt-1 and the sFlt-1/PlGF ratio unchanged, and whose authors
      concluded that lipid lowering or undefined factors mattered more than
      sFlt-1 reduction. That is a qualifying negative result the search
      overlooked in its own reference list. The claim is also unauditable: no
      queries, databases, dates, or screened counts are recorded.
    citations:
      - PMID:29858106
  - claim_id: fda-approved-diagnostic
    statement: >-
      The sFlt-1/PlGF ratio is an FDA-approved molecular diagnostic, and that
      approval validates the antiangiogenic model as clinically actionable.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      The FDA approval of this molecular test validates the antiangiogenic model
      as clinically actionable
    rationale: >-
      No citation is attached to the regulatory claim anywhere in the report.
      The two sources adjacent to it, PMID:31188674 and PMID:41213792, are
      diagnostic-performance studies, not regulatory documents, and PMID:31188674
      is a prospective Asian cohort with no FDA content. The clinical-performance
      numbers around it are accurate, so the ratio's diagnostic value is not in
      doubt; the regulatory assertion simply has no source here and was not
      carried into the disorder entry.
    citations:
      - PMID:31188674
  - claim_id: complement-independent-in-hellp
    statement: >-
      Complement activation is an effector pathway that operates independently
      of the antiangiogenic shift in HELLP syndrome, and complement inhibition
      improved HELLP without acting on sFlt-1.
    disposition: QUALIFIED
    report_quote: >-
      | Eculizumab improved HELLP independently of sFlt-1 | HELLP | Low (n=1) |
    rationale: >-
      PMID:23228435 is a single case of eculizumab at 26 weeks with marked
      clinical improvement and 17 days of prolongation, and its authors put it no
      higher than "suggests that complement inhibition may be an effective
      treatment strategy". Crucially, it reports no angiogenic measurements at
      all, so "independently of sFlt-1" is not something that source can
      establish. The report's Alternative Models section words this more
      carefully than its Evidence Matrix does. PMID:38983853 does document
      consistent complement activation and dysregulation across 41 studies,
      which makes the pathway real without making it independent. Curated as an
      open knowledge gap rather than as a mechanism edge.
    citations:
      - PMID:23228435
      - PMID:38983853
  - claim_id: syncytiotrophoblast-sasp
    statement: >-
      Syncytiotrophoblast senescence with a senescence-associated secretory
      phenotype is a parallel or amplifying mechanism in early-onset
      preeclampsia, detectable in maternal blood in the first trimester.
    disposition: QUALIFIED
    report_quote: >-
      Elevated senescence markers were validated across clinical multicenter
      cohorts, with secreted SASP factors PAI-1 and activin A elevated in
      maternal blood already in the first trimester
    rationale: >-
      PMID:39440423 supports every measurement here: single-nucleus RNA
      sequencing with spatial transcriptomics identified senescent
      syncytiotrophoblast states, markers were validated in multicenter cohorts,
      and PAI-1 and activin A were elevated before clinical diagnosis. What it
      does not show is a causal edge from SASP secretion to the maternal
      syndrome, so the "parallel mechanism" framing runs ahead of the data.
      Integrated as a biochemical marker record rather than as a pathophysiology
      node.
    citations:
      - PMID:39440423
  - claim_id: organ-damage-phenotype-stratification
    statement: >-
      The degree of antiangiogenic imbalance quantitatively predicts which
      organ-damage pattern a preeclamptic pregnancy develops.
    disposition: QUALIFIED
    report_quote: >-
      This demonstrates that the degree of antiangiogenic imbalance
      quantitatively predicts not just PE occurrence but specific organ-damage
      patterns within the disease.
    rationale: >-
      PMID:42041953 does report the gradient the report quotes, renal-dominant
      66.0 plus or minus 22.5, hepatic 55.9, hematologic 52.0, in 68 preeclampsia
      cases within a 320-woman cohort. But it is retrospective, the phenotypes
      were defined from the same laboratory markers the ratio is being compared
      against, and the paper reports only moderate discrimination for the renal
      phenotype at AUC 0.69, a number the report omits. "Predicts" overstates a
      cross-sectional association; the gradient itself is worth curating.
    citations:
      - PMID:42041953
  - claim_id: candidate-ontology-curies
    statement: >-
      The proposed cell-type and biological-process CURIEs are usable curation
      leads for decidual NK cell and trophoblast cell migration.
    disposition: REJECTED
    report_quote: >-
      - **Cell types:** Syncytiotrophoblast (CL:0000525), Extravillous
      trophoblast (CL:0008036), Decidual NK cell (CL:0002252), Podocyte
      (CL:0000653)
    rationale: >-
      Two of the proposed identifiers name unrelated concepts. CL:0002252 is
      epithelial cell of esophagus, not decidual NK cell; the term this KB uses
      is CL:0002343, decidual natural killer cell, human. GO:0008045, proposed in
      the same block as trophoblast cell migration, is motor neuron axon
      guidance. The syncytiotrophoblast, extravillous trophoblast, and podocyte
      identifiers are correct, and GO:0002040, GO:0001890 and GO:0001666 resolve
      as named. None of the wrong CURIEs was used; a label check against the term
      cache is required before any of these are bound.
    citations: []

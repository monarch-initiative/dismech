provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: early_onset_placenta_dominant
assessed_at: "2026-09-02T11:26:22Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The central chain the report defends is real and well sourced: placental
  ischemia drives an antiangiogenic shift dominated by sFlt-1 excess and PlGF
  deficiency, and that shift produces maternal endothelial dysfunction. Two
  placental single-cell transcriptomic sources check out exactly as quoted and
  add cell-resolution support the KB did not have, and the KIR/HLA-C upstream
  trigger is confirmed at the molecular level. Three of the report's own
  headline pillars do not survive a source check. Its strongest genetic claim
  misstates the FLT1 GWAS significance by five orders of magnitude
  (5.4 x 10^-16 reported, 5.4 x 10^-11 in the paper) and pairs it with sample
  counts taken from a different review; the same paper explicitly reports that
  the association was strongest in late gestation, which the report both misses
  and contradicts by listing subtype stratification as an open gap. Its second
  apheresis citation concluded that pregnancy was prolonged without lowering
  sFlt-1, and the report inverts it into support for sFlt-1 removal, which also
  falsifies the claim that an active search for refuting evidence found none.
  Two of the five proposed ontology CURIEs name unrelated concepts. The verdict
  is PARTIALLY_SUPPORTED rather than SUPPORTED because the interventional and
  genetic pillars that were supposed to lift this model above its KB seed are
  the ones that failed verification.

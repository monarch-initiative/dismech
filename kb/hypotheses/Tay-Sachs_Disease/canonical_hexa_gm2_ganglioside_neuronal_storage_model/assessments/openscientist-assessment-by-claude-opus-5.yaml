overall_verdict: SUPPORTED
summary: >-
  The scoped core mechanism (biallelic HEXA loss of function, loss of HexA
  activity, failure of lysosomal GM2 hydrolysis, neuronal GM2 storage, and
  neurodegeneration) is supported by human genetics, the HexA crystal
  structure, mouse and sheep models, gene therapy rescue, and a residual
  activity dose-response, and the report's source checks hold up where I
  could verify them against cached abstracts. Most of that content, however,
  restates the seed hypothesis and is already curated in the dismech entry,
  so the report's real contribution is narrower than its "STRONGLY SUPPORTED"
  framing suggests. Its one genuinely actionable finding is the seed
  correction on the mouse model: the seed's Hexa/Hexb double knockout claim
  is wrong, and the infantile-phenotype model is the Hexa/Neu3 double
  knockout. Two of the six declared knowledge gaps are false: human AAV gene
  therapy safety and proof-of-concept data were published in 2022 and are
  already cited in the dismech entry, and human fetal Tay-Sachs brain
  transcriptomics with a public GEO accession is likewise already curated
  there. One curation lead misreads its source: the G269S knock-in mouse is
  offered as a late-onset model, but the cited paper reports that the
  knock-in and knockout models did not differ in survival or behaviour. The
  "zero refuting evidence across 57+ papers" claim cannot be reconstructed
  from the 33-entry citation manifest and has no committed search log.

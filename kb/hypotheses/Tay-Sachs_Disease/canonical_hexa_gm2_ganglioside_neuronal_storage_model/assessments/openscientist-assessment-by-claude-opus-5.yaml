claims:
  - claim_id: core-hexa-gm2-storage-axis
    statement: >-
      Biallelic HEXA loss of function abolishes HexA activity, blocks lysosomal
      GM2 ganglioside hydrolysis, and causes neuronal GM2 storage that drives
      neurodegeneration.
    disposition: RETAINED
    report_quote: >-
      The core mechanism — biallelic *HEXA* mutations → loss of HexA enzymatic
      activity → failure of lysosomal GM2 ganglioside hydrolysis → massive
      neuronal GM2 accumulation → neurodegeneration — is established beyond
      reasonable doubt.
    rationale: >-
      Verified against the cached abstracts of PMID:10571007 (deficiency of
      HEXA, HEXB, or GM2A each causes lysosomal ganglioside storage in
      neuronal cells) and PMID:7610760 (Hexa-disrupted mice are devoid of
      HexA activity and accumulate GM2 with membranous cytoplasmic bodies
      identical to Tay-Sachs disease). The claim is correct, but it is the
      seed hypothesis restated: every element of it was already curated in
      the dismech entry before this run, so the report adds confirmation
      rather than new support.
    citations:
      - PMID:10571007
      - PMID:7610760
      - PMID:40710901
  - claim_id: alpha-subunit-structural-specificity
    statement: >-
      Only the HexA alpha-subunit active site can hydrolyse GM2 ganglioside,
      because of a flexible loop removed post-translationally from beta plus
      alphaAsn423 and alphaArg424, which is why HEXA variants specifically
      cause GM2 storage.
    disposition: RETAINED
    report_quote: >-
      only the α-subunit active site can hydrolyze GM2 gangliosides due to a
      flexible loop structure that is removed post-translationally from β, and
      to the presence of αAsn423 and αArg424
    rationale: >-
      The quotation is faithful to the cached PMID:16698036 abstract, which
      states the same in ASCII transliteration and adds that the beta-subunit
      carries betaAsp452/betaLeu453 in those positions and therefore cleaves
      only neutral substrates efficiently. This is a genuinely absent piece
      of molecular detail in the dismech entry, which asserts the enzyme
      deficiency without the structural reason for alpha-subunit specificity.
    citations:
      - PMID:16698036
      - PMID:12662933
  - claim_id: seed-mouse-model-correction
    statement: >-
      The seed hypothesis's assertion that a Hexa/Hexb double knockout is
      required to recapitulate the human Tay-Sachs phenotype is wrong; that
      genotype produces additional mucopolysaccharidosis pathology, and the
      infantile-phenotype model is the Hexa/Neu3 double knockout.
    disposition: RETAINED
    report_quote: >-
      The seed hypothesis states that "the HEXA mouse model requires Hexa/Hexb
      double knockout to fully recapitulate the human phenotype." This is
      incorrect.
    rationale: >-
      Confirmed at source. The cached PMID:8896570 abstract states that
      Hexa/Hexb double knockout mice showed the phenotypic, pathologic and
      biochemical features of the mucopolysaccharidoses, and that this
      phenotype is not seen in the Tay-Sachs or Sandhoff model mice or in the
      corresponding human patients. The cached PMID:41819452 abstract states
      that Hexa-/-Neu3-/- mice show GM2 accumulation, astrogliosis, Purkinje
      cell loss, ataxia, tremors and a lifespan of about 20 weeks, and were
      considered the early-onset TSD model. This is the report's single most
      actionable finding, because the erroneous claim is present verbatim in
      the dismech entry's hypothesis description.
    citations:
      - PMID:8896570
      - PMID:41819452
  - claim_id: neuraminidase-bypass-mechanism-detail
    statement: >-
      Murine neuraminidases Neu3 and Neu4 bypass HexA deficiency by cleaving
      sialic acid from GM2 to give GA2, which HexB then degrades, explaining
      the mild Hexa-/- mouse phenotype.
    disposition: QUALIFIED
    report_quote: >-
      This discrepancy was explained by the discovery that murine
      neuraminidases (Neu3, Neu4) can bypass HexA deficiency by cleaving
      sialic acid from GM2 to produce GA2, which is then degraded by HexB
    rationale: >-
      The existence of the bypass and Neu3's responsibility for it are
      supported: PMID:28442549 states that neuraminidase 3 deficiency
      drastically increased GM2 storage in the brain of an asymptomatic mouse
      Tay-Sachs model, indicating that this enzyme is responsible for the
      metabolic bypass of beta-hexosaminidase A deficiency, and PMID:7610760
      independently documents the regionally restricted storage that needs
      explaining. The specific downstream step, GA2 handed to HexB, is not
      stated in the cached abstract, and Neu4's contribution to the GM2
      bypass specifically is asserted more strongly than that source
      supports. Retain the bypass, not the enzymatic detail.
    citations:
      - PMID:28442549
      - PMID:7610760
  - claim_id: neuroinflammation-temporal-precedence
    statement: >-
      Neuroinflammation precedes peak neuronal death rather than following it,
      placing microglial and astrocyte activation upstream of the bulk of
      neurodegeneration.
    disposition: QUALIFIED
    report_quote: >-
      establishing that neuroinflammation precedes peak neuronal death
    rationale: >-
      The sentence the report quotes from PMID:32951593 in support of this is
      that paper's BACKGROUND framing of GM2-gangliosidosis in general, not a
      temporal measurement it reports, and an equivalent review sentence is
      already cited in the dismech entry from PMID:30524313. The stronger
      support the report does not lean on is PMID:12615653, where substrate
      reduction therapy in the Sandhoff mouse slowed glycosphingolipid
      accumulation and thereby delayed the onset of the inflammatory process,
      which is a genuine ordering experiment placing inflammation downstream
      of storage. The ordering of inflammation against neuronal death, as
      opposed to against storage, remains an inference from coincident onset.
    citations:
      - PMID:32951593
      - PMID:12615653
      - PMID:30524313
  - claim_id: gene-therapy-rescue-sheep
    statement: >-
      Multipoint CSF delivery of a bidirectional AAV9 HexA/HexB vector extended
      survival of Tay-Sachs sheep from about 9 months to as long as 5 years,
      with lasting neurological improvement.
    disposition: RETAINED
    report_quote: >-
      with treated animals that survived up to 5 years of age (untreated
      animals with TSD die after ~9 months). Extension in survival was
      accompanied by lasting improvement in neurological examination and maze
      testing
    rationale: >-
      Verbatim and accurate against the cached PMID:41026525 abstract. The
      full text further reports an average survival of 45 months in the
      four-site CSF cohort against 9.4 months untreated, so the headline
      figure is the best animal rather than the cohort mean; the report does
      not say otherwise. This is strong therapeutic-rescue support for the
      causal direction of the model and is not currently cited in the dismech
      entry.
    citations:
      - PMID:41026525
      - PMID:27199088
  - claim_id: no-human-gene-therapy-data-gap
    statement: >-
      No human gene therapy efficacy or safety data for Tay-Sachs disease had
      been published as of the search date.
    disposition: REJECTED
    report_quote: >-
      TSHA-101 (intrathecal AAV-HEXA) is in clinical development, but as of
      May 2026, no human efficacy or safety data have been published.
    rationale: >-
      This is false, and the report's own cited source says so. PMID:41026525
      states that the monocistronic vector strategy in patients with infantile
      TSD has reported early positive effects including disease stabilization,
      myelination on MRI, improved social interaction, and prolonged oral
      feeding, and refers to a completed phase I/II trial, NCT04669535. The
      published first-in-human report is PMID:35145305, which states that the
      study provides early safety and proof-of-concept data in humans; it was
      already cited in the dismech entry's Gene Therapy treatment before this
      run, alongside both trial records. The gap statement should not be
      promoted into the knowledge base.
    citations:
      - PMID:35145305
      - PMID:41026525
  - claim_id: no-human-omics-data-gap
    statement: >-
      No transcriptomic, proteomic, or metabolomic profiling of human Tay-Sachs
      brain tissue has been published.
    disposition: REJECTED
    report_quote: >-
      No published transcriptomic, proteomic, or metabolomic profiling of human
      TSD brain tissue was identified in our search.
    rationale: >-
      Also false. PMID:36700853 reports bulk RNA-seq of human fetal brain
      samples carrying biallelic pathogenic HEXA variants, finding dramatic
      transcriptome changes and a shift in the sphingolipid metabolic pathway
      away from GM2 production; the data are deposited as GEO GSE224860. Both
      the paper (two evidence items) and the accession (a datasets record)
      were already curated in the dismech entry. This also partly answers the
      report's own Gap 4 on neurodevelopmental impact with human rather than
      organoid data, which the report does not notice.
    citations:
      - PMID:36700853
  - claim_id: g269s-knockin-lots-model-lead
    statement: >-
      The new Hexa Gly269Ser knock-in / Neu3 knockout mouse is a model for
      late-onset Tay-Sachs disease research.
    disposition: QUALIFIED
    report_quote: >-
      New Hexa G269S knock-in / Neu3 KO mouse models for LOTS research
    rationale: >-
      The cited PMID:40916664 does describe the knock-in as intended to model
      chronic disease, but its actual result is the opposite of what this
      lead implies: both models accumulated GM2 throughout the brain and died
      prematurely by 24 weeks, and survival and behavioural phenotypes did not
      differ between the knockout and knock-in models. The paper's own stated
      value for the knock-in is gene-editing correction of the Gly269Ser
      variant and testing therapies for partial HexA deficiency, not
      phenocopying the human late-onset course. Curated as a model that fails
      to reproduce the human residual-activity phenotype, this is useful; as
      written the lead would misrepresent the source.
    citations:
      - PMID:40916664
      - PMID:31076878
  - claim_id: residual-activity-dose-response
    statement: >-
      Residual HexA activity of roughly 2 to 4 percent of control, typically
      carried by the c.805G>A p.Gly269Ser allele, produces late-onset
      cerebellar and anterior horn cell disease rather than the infantile
      course.
    disposition: RETAINED
    report_quote: >-
      residual enzyme activity was 1.8–4.1% of controls. All patients carried
      the typical LOTS-associated c.805G>A (p.Gly269Ser) mutation on at least
      one allele
    rationale: >-
      Exact against the cached PMID:31076878 abstract, whose 14-patient Czech
      cohort also reports the anterior horn cell weakness, cerebellar signs
      and psychiatric presentation. PMID:15714079 and PMID:9073025 corroborate
      the allele and phenotype. The residual-activity mechanism is already
      curated in the dismech entry; the specific 1.8 to 4.1 percent
      quantification is not.
    citations:
      - PMID:31076878
      - PMID:15714079
      - PMID:9073025
  - claim_id: upr-perk-and-autophagy-branches
    statement: >-
      GM2 storage additionally engages PERK-branch unfolded protein response
      signalling and impairs autophagic flux with increased lysosomal
      permeability and reduced mTOR activity, beyond the physical burden of
      storage.
    disposition: RETAINED
    report_quote: >-
      Beyond the physical burden of lysosomal storage, GM2 accumulation
      activates specific toxic signaling cascades.
    rationale: >-
      Both branches check out in patient-derived material. PMID:34831346
      reports pathological autophagosomes with impaired autophagic flux in
      Tay-Sachs and Sandhoff patient fibroblasts, accelerated release of
      mature cathepsins and HexA into the cytosol indicating increased
      lysosomal permeability, and diminished basal mTOR activity partly
      restored by L-arginine. PMID:37108372 reports that UDCA reduced
      GM2-induced neurite atrophy and CHOP up-regulation and interacts
      directly with the PERK cytosolic domain. The report's own EMERGING
      grade is right: this is cellular evidence without in vivo Tay-Sachs
      validation, and neither branch is represented in the dismech entry.
    citations:
      - PMID:34831346
      - PMID:37108372
  - claim_id: gm2-skeletal-remodeling
    statement: >-
      GM2 accumulation contributes to a skeletal phenotype, with reduced bone
      remodeling and trabecular bone loss in the Hexa/Neu3 double knockout
      mouse.
    disposition: RETAINED
    report_quote: >-
      First demonstration of skeletal pathology (bone loss) in TSD mice
    rationale: >-
      Supported by the cached PMID:39514043 abstract: lower plasma alkaline
      phosphatase and calcium with raised tartrate-resistant acid phosphatase,
      osteoblast reduction and osteoclast induction in femur, and reduced
      trabecular bone volume, mineral density, number and thickness at 5
      months. The paper also notes that Tay-Sachs patients display bone
      anomalies including kyphosis. This is a genuinely new mechanistic branch
      relative to the dismech entry, but it is mouse-only for the remodeling
      mechanism, so it belongs as a model-level rather than human phenotype
      claim.
    citations:
      - PMID:39514043
  - claim_id: secondary-gm2-in-non-hexa-lsds
    statement: >-
      GM2 accumulates secondarily in Niemann-Pick and mucopolysaccharidosis
      disorders, so GM2 neurotoxicity is convergent rather than specific to
      HEXA deficiency.
    disposition: RETAINED
    report_quote: >-
      This qualifies the specificity of the canonical model: GM2 neurotoxicity
      is a convergent pathogenic mechanism, not exclusive to *HEXA*
      deficiency.
    rationale: >-
      The scoping point is correct and is consistent with PMID:32272755 and
      with the three-gene GM2 hydrolysis system in PMID:10571007, where GM2A
      deficiency produces the same storage with normal HexA. It qualifies the
      inference direction (GM2 storage, not HexA loss as such, is the
      proximate neurotoxic state) rather than the mechanism in Tay-Sachs
      disease, and it is about other diseases, so it carries little curation
      value for this entry beyond noting it.
    citations:
      - PMID:32272755
      - PMID:10571007
  - claim_id: selective-neuronal-vulnerability-gap
    statement: >-
      The canonical model does not explain why anterior horn cells and
      cerebellar Purkinje cells degenerate preferentially in late-onset
      disease while cortical function is relatively preserved.
    disposition: RETAINED
    report_quote: >-
      Why do motor neurons (anterior horn cells) and cerebellar Purkinje cells
      degenerate preferentially when residual HexA activity is 1.8–4.1%, while
      cortical neurons are relatively spared?
    rationale: >-
      This is a real and well-posed gap. PMID:9073025 documents four adult
      siblings with slowly progressive motor neuron disease, ataxia and ocular
      motor disturbance, severe cerebellar atrophy on MRI, and no dementia at
      that stage, and PMID:31076878 reports the same regional pattern in 14
      patients. Nothing in the report's corpus supplies a cell-type-resolved
      explanation, and the report says so explicitly. The wording should be
      softened from "cortical neurons are relatively spared" to preserved
      cognition at the stages reported, since the cited sources measured
      clinical and imaging phenotype rather than cortical GM2 load.
    citations:
      - PMID:9073025
      - PMID:31076878
  - claim_id: zero-refuting-evidence-audit
    statement: >-
      Across 57 or more papers reviewed and 41 catalogued evidence items, no
      refuting evidence exists for the canonical model.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Across 57+ papers reviewed and 41 discrete evidence items catalogued,
      **zero refuting evidence** was identified.
    rationale: >-
      The corpus behind this cannot be reconstructed. The citation sidecar
      lists 33 identifiers, the rendered evidence matrix has 23 rows, and no
      search log, screening record, or artifact bundle is committed. Two of
      the report's own six negative findings turned out to be wrong on a
      single check each, which is a poor sign for the completeness of an
      absence claim of this scope. The underlying position, that the core
      mechanism has no serious contradicting literature, is plausible and
      independently likely; the audited counts are not usable.
    citations:
      - PMID:35145305
      - PMID:36700853

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Unlike the ovarian mTOR run, this one did real data retrieval: it queried the
  Human Protein Atlas, MSigDB (SenMayo), Open Targets and ClinicalTrials.gov and
  committed the query URLs and JSON responses, so the central claims are
  auditable from the bundle. Its answer to the specificity question is the useful
  result and it matches the module's own framing: uPAR is senescence-ENRICHED,
  not senescence-specific. HPA classes PLAUR "Tissue enriched / Detected in all"
  and "Cell type enhanced" (explicitly not "Cell type specific"), with the
  highest single-cell expression on normal neutrophils, monocytes, dendritic
  cells and macrophages. That broad baseline has a real therapeutic cost: a
  uPAR T-cell engager caused on-target hepatotoxicity via hepatic endothelium
  (PMID:42806572). The therapeutic core holds: anti-uPAR CAR T causally reverses
  age-related pathology across several mouse tissues. PLAUR's SenMayo membership
  is verified but sits inside the secretory/fibrinolysis arm of the signature,
  and the human cohort evidence (Dunedin suPAR) is soluble uPAR, an inflammation
  biomarker, not membrane uPAR on senescent cells. The net is: keep EMERGING,
  keep the enriched-not-specific caveat, and treat specificity as the open
  problem. Records the assessment only; does not change the hypothesis status.

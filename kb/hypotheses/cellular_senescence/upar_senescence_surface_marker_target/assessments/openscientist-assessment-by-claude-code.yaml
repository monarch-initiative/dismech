claims:
  - claim_id: C001
    statement: >-
      uPAR is senescence-enriched, not senescence-specific: PLAUR is broadly
      expressed, highest on normal myeloid cells, so it cannot cleanly separate
      senescent from non-senescent cells.
    disposition: RETAINED
    report_quote: >-
      is only **quantitative, not categorical**
    rationale: >-
      Supported by the committed HPA data (PLAUR "Cell type enhanced", "Detected
      in all", top single-cell expression on neutrophils/monocytes/DC/macrophages).
      This is the module's own framing and the hypothesis already states it, so
      the run confirms rather than changes the KB. Not attributing to the
      analysis id because the analysis is PARTIALLY_AUDITABLE; it stands on the
      committed data artifact.
    citations: []
  - claim_id: C002
    statement: >-
      PLAUR is a verified member of the SenMayo senescence signature, within its
      secretory/fibrinolysis arm.
    disposition: RETAINED
    report_quote: >-
      PLAUR is a **verified member of the SenMayo senescence gene signature**
    rationale: >-
      Confirmed against the committed MSigDB response (member 99/124) and the
      source paper PMID:35974106. The fibrinolysis-axis co-membership is a fair
      qualification, not a defect.
    citations:
      - PMID:35974106
  - claim_id: C003
    statement: >-
      Clearing uPAR-positive cells with anti-uPAR CAR T causally reverses
      age-related pathology across multiple mouse tissues.
    disposition: RETAINED
    report_quote: >-
      clearing them is causally beneficial: anti-uPAR CAR T cells
    rationale: >-
      The therapeutic core, already curated on the module as a treatment, and
      verified against PMID:32555459, PMID:38267706 and PMID:41291258. Mouse,
      so human relevance is by extension.
    citations:
      - PMID:32555459
      - PMID:38267706
      - PMID:41291258
  - claim_id: C004
    statement: >-
      The broad uPAR baseline causes real on-target, off-senescent-cell
      toxicity, seen as hepatotoxicity with a uPAR T-cell engager.
    disposition: RETAINED
    report_quote: >-
      A uPAR-targeting T-cell engager (GFD-CD3) produced **dose-dependent
      hepatotoxicity through T cell-mediated attack on hepatic endothelial cells**
    rationale: >-
      Verified against PMID:42806572. This is the concrete therapeutic
      consequence of non-specificity and the reason the specificity question
      matters clinically.
    citations:
      - PMID:42806572
  - claim_id: C005
    statement: >-
      Human cohort support is from soluble uPAR tracking pace of aging, which is
      indirect for the membrane-marker claim.
    disposition: QUALIFIED
    report_quote: >-
      elevated plasma suPAR was associated with accelerated pace of biological
      aging
    rationale: >-
      The Dunedin finding measures shed, soluble uPAR (an inflammation
      biomarker), not membrane uPAR on senescent cells, so it supports the
      aging link without establishing that membrane uPAR marks senescent cells
      specifically. The module should not cite it as direct marker evidence.
    citations: []
  - claim_id: C006
    statement: >-
      No human senolytic or uPAR-directed CAR-T trial is registered.
    disposition: RETAINED
    report_quote: >-
      As of the search date there is no registered human trial of a
      uPAR-directed senolytic CAR-T (or any senolytic CAR-T).
    rationale: >-
      A real source-level absence: the committed ClinicalTrials.gov v2 search
      log shows seven null queries with non-zero calibration queries. A dated
      negative a curator can re-check.
    citations: []

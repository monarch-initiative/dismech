schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: etr_lipid_metabolism_acsl5_macrophage
assessed_at: "2026-09-06T18:50:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The provider retrieved the GSE65914 series matrix and GPL570 annotation,
  ran the prespecified ETR-versus-control contrast on gene-level log2
  expression, and produced a complete, replayable bundle. The descriptive
  half of the hypothesis reproduces with very large effects: ACSL5 is 5.6x
  higher in ETR (q = 3e-13, d = 4.2), PPARG 4.5x and ACADVL 2.0x, with CPT1A
  unchanged as an internal negative control, and all three macrophage
  markers (CD68, CD163, CD86) are 1.4-1.8x higher. The provider's own
  subject-level sensitivity analysis (7 vs 10, averaging replicate arrays)
  shows this is not a pseudoreplication artifact. The mechanistic half does
  not hold: within ETR, ACSL5 is uncorrelated with every macrophage marker
  (all q > 0.45 at both granularities), and the CD86/CD163 balance shifts
  toward the M2 marker CD163 (p = 0.018, d = -0.85) while PPARG, an M2
  regulator, is among the most up-regulated genes. Lipid-metabolic
  reprogramming and macrophage infiltration co-occur in ETR; an
  ACSL5-driven M1 program is not supported by these data. Because the
  originating study (PMID:40195491) derived its signature from this same
  series, this is a reproduction of the analysis rather than an
  independent-cohort replication. Provenance: the runner's download dropped
  the manifest, code and environment file (client extension allowlist);
  they were recovered from the provider API, the manifest was given the
  field names the repository gate requires without changing any analysis
  bytes, and an independent replay with the pinned versions reproduced all
  four output tables byte-identically.
artifacts:
  - openscientist-assessment-by-claude-code.yaml
artifact_root: ../openscientist_artifacts

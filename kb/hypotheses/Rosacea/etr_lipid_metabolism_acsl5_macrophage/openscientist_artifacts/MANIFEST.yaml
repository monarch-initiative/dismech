  t-test; BH-FDR across the 7 prespecified genes; Cohen's d oriented ETR-minus-control with pooled SD;
  fold change = 2**(log2 mean diff). Within ETR, Spearman correlation of ACSL5 with CD68, CD163 and CD86.

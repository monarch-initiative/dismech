limitations:
- Each subject contributed two arrays (_1/_2); arrays were treated as independent observations for this
  prespecified sample-level contrast, so nominal p-values may be anticonservative due to pseudoreplication.
- Within-ETR Spearman correlations are based on 14 arrays (7 subjects x 2) and are underpowered; non-significant
  correlations cannot exclude a modest true association.
- Cross-sectional expression data cannot establish causal direction (whether ACSL5 drives macrophage infiltration).
- Gene-level values aggregate multiple probes by arithmetic mean on the log2 scale; CD68 is represented
  only by multi-gene probe 203507_at (LOC101928634///SNORA67///CD68).
- GEO-supplied normalized values were used as provided; no reprocessing from raw CEL files.

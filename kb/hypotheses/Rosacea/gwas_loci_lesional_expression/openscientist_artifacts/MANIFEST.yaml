limitations:
- Cross-sectional microarray association only; no genotypes/eQTL, so causal GWAS-to-expression link is
  not directly tested.
- Subject-level duplicate arrays (title suffixes _1/_2) are treated as independent samples, matching the
  GEO sample count; this may introduce pseudoreplication and modestly inflate significance.
- Probe-to-gene mapping uses GPL570 GEO annotation (Aug 09 2016); multi-gene probes are assigned to all
  listed genes and averaged, which can dilute gene-specific signal.
- Bulk skin tissue; expression changes may partly reflect differential immune-cell infiltration rather
  than per-cell regulation.
- Fisher r-to-z applied to Spearman coefficients is approximate.

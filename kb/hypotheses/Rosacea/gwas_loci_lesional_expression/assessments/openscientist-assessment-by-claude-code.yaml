hypothesis_id: gwas_loci_lesional_expression
assessed_at: "2026-09-06T19:05:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The provider retrieved GSE65914 and the GPL570 annotation, aggregated
  probes to gene level, and ran the prespecified lesional-versus-control
  contrast for 13 GWAS-locus genes in each subtype and pooled, plus the
  TLR1-TLR2 correlation analysis. The result splits cleanly along the
  immune/pigmentation axis: every immune locus gene is higher in lesional
  skin (TLR2 log2FC +1.91, d = 4.0; HLA-DRA +1.45; IRF1 +1.41; HLA-DQA1,
  HLA-DQB1, HLA-DRB1, TLR1 all about +1.0 to +1.25; BTNL2 +0.19; all BH
  q < 0.05 across 52 tests), IL13 and pooled IRF4 are unchanged, and the
  pigmentation loci are flat or modestly down (HERC2 -0.20, OCA2 -0.56).
  TLR1 and TLR2 are strongly co-induced (Spearman rho 0.69 across all
  samples) but their coupling is no stronger within rosacea than within
  controls (0.35 vs 0.52, Fisher p = 0.47). That supports the hypothesis
  for the immune loci, refutes the lesional-expression route for the
  pigmentation loci, and reads the TLR1-TLR2 axis as turned up rather
  than rewired. Bulk tissue cannot separate infiltration from per-cell
  regulation, and expression change does not tie the risk alleles to the
  transcripts, which needs eQTL/colocalization. Provenance is the one
  hard problem: the provider's report never contains the bare
  ANALYSIS_STATUS: SUCCEEDED line the execution contract requires, so the
  run is invalid as a provider execution claim even though the assessor
  independently replayed all three output tables byte-identically. The
  analysis is therefore classified PARTIAL, not SUCCEEDED, and the marker
  was not added by the assessor.

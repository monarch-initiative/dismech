analyses:
  - analysis_id: gse65914-gwas-loci-contrasts
    status: PARTIAL
    auditability: REPRODUCIBLE
    method: >-
      Gene-level expression as the mean of mapped probes on the supplied
      log2 scale; per-gene Welch two-sample t-test lesional vs control for
      each subtype and for pooled rosacea; Benjamini-Hochberg across all
      52 gene-by-comparison tests jointly; Cohen's d with pooled SD;
      Spearman TLR1-TLR2 across all samples and within rosacea and control
      with a Fisher r-to-z difference test.
    comparison: >-
      ETR (14), PPR (12), PhR (12) and pooled rosacea (38) arrays each vs
      control (20); TLR1-TLR2 correlation in 58, 38 and 20 arrays.
    input_data_source_ids:
      - geo-gse65914
      - geo-gpl570-annotation
    software:
      - software_name: python
        software_version: "3.12.13"
      - software_name: numpy
        software_version: "2.3.5"
      - software_name: pandas
        software_version: "3.0.3"
      - software_name: scipy
        software_version: "1.17.1"
      - software_name: statsmodels
        software_version: "0.14.6"
    parameters:
      - "target genes: HLA-DRA, BTNL2, HLA-DRB1, HLA-DQB1, HLA-DQA1, IL13, IRF1, TLR1, TLR2, IRF4 (immune); HERC2, OCA2, SLC45A2 (pigmentation)"
      - "group labels: exact GSE65914 characteristics for Healthy volunteer, ETR, PPR, PhR; all 58 arrays included"
      - "probe aggregation: arithmetic mean of mapped probes per gene, no re-transform"
      - "multiple testing: BH over all 52 gene-by-comparison tests jointly"
      - "replicate arrays per subject treated as independent observations"
      - "float rounding: 10 decimal places for deterministic output"
    code_artifacts:
      - ../openscientist_artifacts/analysis.py
    environment_artifact: ../openscientist_artifacts/environment.txt
    output_artifacts:
      - ../openscientist_artifacts/gene_results.csv
      - ../openscientist_artifacts/tlr_correlation.csv
      - ../openscientist_artifacts/samples.csv
      - ../openscientist_artifacts/comparison.md
      - ../openscientist_artifacts/replay/gene_results.csv
      - ../openscientist_artifacts/replay/tlr_correlation.csv
      - ../openscientist_artifacts/replay/samples.csv
    status_reason: >-
      The computation is fully auditable: committed code, environment and
      checksummed outputs, provider replay copies, and an assessor replay
      in an isolated environment with the pinned versions that regenerated
      samples.csv, gene_results.csv and tlr_correlation.csv
      byte-identically against the manifest checksums. The status is
      PARTIAL rather than SUCCEEDED because the provider's report does not
      contain the exact ANALYSIS_STATUS: SUCCEEDED line that
      templates/hypothesis_dataset_analysis.md requires (the only
      occurrences are the template's own backticked instructions), so
      just validate-hypothesis-analysis-run fails on the marker and the
      run is invalid as a provider execution claim; the assessor did not
      add the marker. As with the other runs, the client download had
      dropped MANIFEST.yaml, analysis.py and environment.txt, which were
      restored from the job's artifacts zip, and the manifest inputs were
      given canonical_url/local_path/identifier/retrieved_at duplicates
      and a provider field, recorded in assessor_corrections with the
      pre-correction sha256 (44b8c360...). No analysis bytes changed.
    limitations: >-
      Each subject contributes two arrays, so array-level p-values are
      anticonservative; no subject-level sensitivity analysis was run for
      this hypothesis. Bulk tissue cannot distinguish immune-cell
      infiltration from per-cell transcriptional change, which matters
      most for the MHC class II and TLR genes. Expression change does not
      connect the GWAS risk alleles to the transcripts; eQTL or
      colocalization would be needed. The correlation-difference test is
      power-limited. Single-probe genes (BTNL2, IL13) depend entirely on
      one probe's behaviour.
claims:
  - claim_id: immune-loci-up-in-lesional-skin
    statement: >-
      The immune GWAS-locus genes (HLA-DRA, HLA-DRB1, HLA-DQB1, HLA-DQA1,
      BTNL2, IRF1, TLR1, TLR2) are up-regulated in lesional rosacea skin
      across subtypes and pooled.
    disposition: QUALIFIED
    report_quote: >-
      These are large effect sizes — several with Cohen's d well above 2 — indicating the upregulation is not a marginal statistical artifact but a dominant feature of the lesional transcriptome.
    rationale: >-
      Reproduced by the assessor replay. Qualified rather than retained
      only because the run's execution claim is contract-invalid (missing
      status marker) and because bulk expression of MHC class II and TLR
      genes is at least partly a composition effect of immune infiltration,
      which the report itself notes; the direction is robust and matches
      independent protein-level evidence for TLR2 (PMID:29330632).
    citations:
      - PMID:29330632
    analysis_ids:
      - gse65914-gwas-loci-contrasts
  - claim_id: pigmentation-loci-not-up
    statement: >-
      The pigmentation loci HERC2, OCA2 and SLC45A2 are not up-regulated in
      lesional skin; HERC2 and OCA2 are modestly lower.
    disposition: QUALIFIED
    report_quote: >-
      the lesional-expression mechanism captures the immune arm of rosacea genetics but does not explain the pigmentation-associated GWAS signals
    rationale: >-
      Reproduced by the assessor replay. This is the informative negative
      of the run: the hypothesis's lesional-expression route does not hold
      for the pigmentation loci, consistent with those loci acting through
      constitutive phototype rather than lesional transcription. Qualified
      for the same contract reason as above, and because the report
      correctly limits the reading to this specific mechanism.
    analysis_ids:
      - gse65914-gwas-loci-contrasts
  - claim_id: tlr1-tlr2-coinduced-not-rewired
    statement: >-
      TLR1 and TLR2 are co-elevated and correlated across samples, but the
      strength of their correlation does not differ between rosacea and
      control.
    disposition: QUALIFIED
    report_quote: >-
      In other words, the TLR1–TLR2 axis is turned **up**, not **rewired**.
    rationale: >-
      Reproduced by the assessor replay (rho 0.69 all, 0.35 rosacea, 0.52
      control, Fisher p = 0.47). The co-induction is the new observation
      relevant to the TLR1 risk locus flagged in the entry; the
      no-difference result is a null in modest groups and does not exclude
      a subtle change. Qualified for the contract reason above.
    analysis_ids:
      - gse65914-gwas-loci-contrasts
  - claim_id: il13-irf4-unchanged
    statement: >-
      IL13 and pooled IRF4 show no lesional expression change despite being
      GWAS loci.
    disposition: QUALIFIED
    report_quote: >-
      Their inclusion in the target list reflects their GWAS annotation rather than a guaranteed lesional signal, and reporting them as null is part of honoring the "report every gene whether or not it reaches significance" requirement.
    rationale: >-
      Reproduced by the assessor replay. IL13 rests on a single probe, and
      the IL13 signal relevant to rosacea may lie in ILC2-derived cytokine
      rather than bulk transcript; IRF4 is a pigmentation-and-immune locus
      whose lesional expression need not change. Qualified for the
      contract reason above.
    analysis_ids:
      - gse65914-gwas-loci-contrasts
  - claim_id: tlr2-protein-elevation-independent
    statement: >-
      Independent immunohistochemistry confirms higher TLR2 protein in
      rosacea skin than in normal controls.
    disposition: RETAINED
    report_quote: >-
      Expression of TLR2, TLR4 and iNOS was higher in rosacea samples than in normal skin controls.
    rationale: >-
      Verified against the cached abstract of PMID:29330632. This is
      post-lock literature context correctly lineage-marked by the report,
      and it corroborates the direction of the computed TLR2 result at the
      protein level. The two other post-lock quotes (PMID:25047092,
      PMID:34352786) were also verified against their abstracts.
    citations:
      - PMID:29330632
      - PMID:25047092
      - PMID:34352786
  - claim_id: replication-recorded-as-succeeded
    statement: >-
      The replication is recorded as SUCCEEDED.
    disposition: REJECTED
    report_quote: >-
      so the replication is recorded as **SUCCEEDED**.
    rationale: >-
      The prose says so and MANIFEST.yaml says status: SUCCEEDED, but the
      execution contract requires the exact line ANALYSIS_STATUS: SUCCEEDED
      in the report and it is absent; a report from this template without
      the marker is invalid by policy. The computation itself is sound and
      was independently reproduced, which is why the analysis is PARTIAL
      with REPRODUCIBLE auditability rather than FAILED. A provider rerun
      or attestation that adds the marker would let the gate pass without
      any change to the bundle.
    analysis_ids:
      - gse65914-gwas-loci-contrasts

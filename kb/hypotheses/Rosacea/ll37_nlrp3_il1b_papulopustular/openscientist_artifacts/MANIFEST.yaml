comparison:
  contrast_1:
    name: lesional_vs_nonlesional
    test_group: lesional_noTx (n=5)
    reference_group: nonlesional_noTx (n=5)
    pairing: paired by subject S1-S5
    test: two-sided paired t-test on log2(CPM+1); BH-FDR over 8 genes
  contrast_2:
    name: il1b_vs_untreated_nonlesional
    test_group: nonlesional_IL1b (n=5)
    reference_group: nonlesional_noTx (n=5)
    pairing: paired by subject S1-S5
    test: two-sided paired t-test on log2(CPM+1); BH-FDR over 8 genes
  effect_size_convention: log2_mean_diff=mean_test-mean_ref on log2(CPM+1); fold_change=2**log2_mean_diff;
    cohens_d=paired dz=mean(diff)/sd(diff,ddof=1)
  key_observation: IL-1beta significantly up-regulates NLRP3 mRNA (paired t p=0.0246, Cohen's d=1.57,
    BH q=0.196); no target gene significant in lesional vs non-lesional after FDR.

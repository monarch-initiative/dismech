limitations:
- n=5 per group; per-gene paired t-tests are low-powered and are not a genome-wide DE model (no DESeq2/limma-voom).
- CPM+log2 within-file normalization; no between-file batch correction, though the lesional vs non-lesional
  contrast spans two supplementary files.
- mRNA cannot capture post-translational inflammasome activation (CASP1 cleavage, pro-IL-1beta/LL-37 maturation).
- Subjects S1 and S5 reuse identical library barcodes in sample descriptions but have distinct ages/GSMs;
  treated as 5 distinct subjects per GEO metadata.

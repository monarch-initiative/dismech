schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: phyma_fibroblast_identity
assessed_at: "2026-09-06T19:20:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Although launched on the literature template, the provider downloaded
  the E-MTAB-16629 rhinophyma / hypertrophic scar / healthy skin
  single-cell atlas (nine processed 10x files plus SDRF/IDF, logged with
  byte sizes) and ran an exploratory scanpy analysis. Its result splits
  the hypothesis: the biomarker claim fails, the identity claim holds in
  qualified form. PTGDS, the pro-inflammatory fibroblast marker from
  papulopustular disease, is lowest in rhinophyma fibroblasts (5.0%
  positive) and highest in healthy fibroblasts (54.5%), tracks the
  quiescent markers CFD and APOD, and the few PTGDS-high rhinophyma
  cells are endothelial; no hidden PTGDS-high fibroblast subset exists.
  Rhinophyma fibroblasts are nonetheless not scar myofibroblasts: they
  are ACTA2-activated (38.9%) but lack the POSTN/CTHRC1 persistence
  program that defines hypertrophic scar (POSTN 3.1% vs 46.4%, CTHRC1
  8.0% vs 43.4%) and express reticular and inflammatory chemokines
  (CCL19, CXCL12, CCL2) above scar levels. The report reads this as an
  inflammatory-but-non-persistent activated fibroblast, consistent with
  post-surgical reversibility. Every computational claim rests on one
  donor per condition, marker-score lineage assignment without
  integration, a proxy for the papulopustular signature because Chen et
  al.'s data have no public accession, and possible ambient-RNA spillover
  in an immune-rich rhinophyma sample; the committed script does not
  regenerate the result tables, a Leiden step failed on the executor
  limit, and one figure is local-only. The analyses are therefore
  partially auditable exploratory descriptions, not reproducible
  replications, and the hypothesis label should drop PTGDS as the
  marker. Twelve references resolved, none unresolved.

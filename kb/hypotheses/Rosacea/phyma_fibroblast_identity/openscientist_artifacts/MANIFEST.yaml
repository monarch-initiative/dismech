analyses:
  - id: fibroblast_marker_comparison
    outcome: succeeded
    input: E-MTAB-16629
    method: code/fibroblast_marker_analysis.py
    environment: environment.txt
    steps: "per-sample QC (min_genes=200, pct_mito<20) -> normalize_total(1e4)+log1p -> lineage by canonical-marker score-argmax -> subset Fibroblast -> per-gene mean & pct-positive + composite proinflam/myofib scores"
    outputs:
      - results/fibroblast_marker_table.csv
      - results/lineage_composition.csv
    key_result: "PTGDS+ fibroblast fraction Healthy 54.5% > HS 22.7% > Rhinophyma 5.0%; ACTA2+ elevated in Rhinophyma(38.9%) & HS(39.5%) vs Healthy(22.4%); scar matrix POSTN/CTHRC1 strong in HS, weak in Rhinophyma."
    limitations:
      - "n=1 per condition (pseudo-replication); no cross-individual statistics"
      - "marker-argmax lineage assignment, no fibroblast subclustering"
      - "cross-sample absolute expression confounded by depth/dropout; pct-positive more robust"
      - "PTGDS 'signature' = single gene + proxy set, NOT Chen et al. exact papulopustular gene list (no public accession)"

  - id: rhinophyma_ptgds_robustness
    outcome: succeeded
    input: E-MTAB-16629 (ROS sample only)
    method: "clustering-free: rank all cells by PTGDS; profile lineage-marker means in top-5% PTGDS cells vs rest; PTGDS in a stringent fibroblast gate (COL1A1>1 & DCN>0.5 & PECAM1<0.5 & LYZ<0.5)"
    outputs: [results/rhinophyma_ptgds_robustness.md]
    key_result: "PTGDS detected in only 2.9% of rhinophyma cells; PTGDS-high cells are endothelial (endo score 1.24 vs 0.53); stringent fibroblasts (n=224) 4.0% PTGDS+ / 46.9% ACTA2+. No hidden PTGDS-high fibroblast subset."
    limitations: ["single donor; sample-specific capture/batch effect on fibroblast PTGDS cannot be fully excluded"]
    note: "Leiden-based clustering was attempted but exceeded the 60s executor limit (outcome: failed); replaced by the clustering-free test above."

  - id: inflammatory_chemokine_comparison
    outcome: succeeded
    input: E-MTAB-16629
    method: "compare fibroblast %positive for reticular/inflammatory chemokines between rhinophyma and hypertrophic scar"
    outputs: [results/fibroblast_marker_barplot.png]
    key_result: "Rhinophyma fibroblasts > scar fibroblasts for CCL19 (32.0% vs 10.2%, 3.14x), CXCL12 (60.2% vs 32.1%, 1.88x), CCL2 (43.0% vs 25.2%, 1.71x); PTGDS lower (5.0% vs 22.7%); POSTN/CTHRC1 much lower."
    limitations: ["rhinophyma sample is immune/endothelial-rich; ambient-RNA spillover of immune chemokines into fibroblast barcodes may inflate fractions; single donor; proxy chemokine set"]


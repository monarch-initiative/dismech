hypothesis_id: canonical_f9_deficiency_intrinsic_coagulation_model
assessed_at: '2026-09-04T23:59:28.116559Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The canonical functional F9/FIX–intrinsic-tenase–thrombin–bleeding mechanism remains strongly supported. The report is partially reliable as a literature exploration: it identifies useful Leyden, rebalancing, inhibitor, female-carrier, synovitis and skeletal refinements, but materially overstates several causal interpretations and makes false absence claims for >10-year gene-therapy follow-up, extravascular FIX evidence and ClinGen curation. Trial cohorts/time points, mutation-risk P values and the mouse correction denominator need correction. The disease review incorporates verified findings, preserves species and clinical-design limits, and adds current primary trial evidence. The overall verdict assesses report reliability, not uncertainty about the canonical F9 disease association.
claims:
- claim_id: canonical-f9-axis
  statement: Functional FIX deficiency is the established inherited lesion and intrinsic-tenase impairment explains bleeding.
  disposition: RETAINED
  report_quote: loss-of-function variants in *F9* on Xq27.1 disable the intrinsic tenase complex (FIXa–FVIIIa)
  rationale: >-
    Human F9 genetics, biochemical evidence, factor replacement, gene addition, and animal correction converge on this axis. The updated YAML expands FIX→tenase→FXa→thrombin→fibrin→bleeding rather than treating one undifferentiated node as a direct cause of every outcome.
  citations:
  - PMID:20301668
  - PMID:31219805
  - PMID:9883841
  - PMID:41358585
- claim_id: activity-not-antigen
  statement: All F9 disease entails reduced or absent FIX protein and abolished thrombin generation.
  disposition: QUALIFIED
  report_quote: '**Step 1: F9 Gene Variants (Xq27.1) → Reduced/Absent FIX Protein**'
  rationale: >-
    The common abnormality is reduced functional clotting activity. CRM-positive missense proteins can remain in plasma; some severe mutations are dysfunctional rather than antigen-null. Residual activity defines a clinical continuum, and tissue-factor initiation remains possible. Universal absence/abolition language incorrectly extends severe null disease to mild, moderate and dysfunctional-protein disease.
  citations:
  - PMID:20301668
  - PMID:33780107
  - PMID:32809627
  - PMID:31219805
- claim_id: hopeb-five-year
  statement: HOPE-B shows durable benefit, with mean FIX 36.7% at five years.
  disposition: QUALIFIED
  report_quote: achieved a 63% reduction in annualized bleeding rate (ABR) sustained over 5 years with mean FIX activity of 36.7%
  rationale: >-
    The 54-participant phase 3 five-year report gives ABR 4.16 to 1.52 and mean activity 36.1±15.7 IU/dL at five years. The 36.7% value is from the two-year analysis. The separate phase 2b study had three participants and mean 45.7 IU/dL at five years. These distinct time points and cohorts must not be combined.
  citations:
  - PMID:41358585
  - PMID:38437857
  - PMID:40188458
- claim_id: same-padua-transgene
  statement: The two clinical vector programs use different FIX transgene variants.
  disposition: REJECTED
  report_quote: different capsids, promoters, and transgene variants
  rationale: >-
    Both etranacogene and fidanacogene encode FIX-Padua (R338L in mature FIX; p.Arg384Leu in precursor numbering). Distinct delivery platforms support generalizability but cannot be called independent protein variants. A separate wild-type FIX AAV8 cohort supplies that additional contrast.
  citations:
  - PMID:41358585
  - PMID:39321362
  - PMID:40499172
- claim_id: benegene-design
  statement: BENEGENE-2 supports clinical benefit and general long-term correction.
  disposition: QUALIFIED
  report_quote: '**phase 3 BENEGENE-2 trial** (N=45)'
  rationale: >-
    This was an open-label, single-arm comparison with each participant's prophylaxis lead-in, not a parallel randomized trial. ABR declined 71% and mean FIX was 26.9% at 15 months. Anti-AAV antibodies excluded 188/316 screened men and 28/45 treated men received glucocorticoids. Efficacy in selected adults does not establish universal eligibility, absence of immune toxicity, pediatric efficacy, or redosing.
  citations:
  - PMID:39321362
  - PMID:41110511
- claim_id: fidanacogene-followup-cohort
  statement: The 5.5-year fidanacogene results extend the 45-person phase 3 population.
  disposition: QUALIFIED
  report_quote: Long-term follow-up at 5.5 years confirmed mean FIX activity in the mild hemophilia range with ABR <1 and 10/14 participants having no treated bleeds
  rationale: >-
    The numerical result is supported, but PMID:40239068 follows 14 of the 15 phase 1/2a participants, not the BENEGENE-2 population. Follow-up was median 5.5 years, range 3–6, with eight ongoing at cutoff. Prior advanced liver fibrosis progressed in one participant; none of this is a lifetime safety guarantee.
  citations:
  - PMID:40239068
  - PMID:39321362
- claim_id: missed-thirteen-year-followup
  statement: No human gene-therapy data extend beyond ten years.
  disposition: REJECTED
  report_quote: no >10-year data exist
  rationale: >-
    PMID:40499172 was published in June 2025, before the May 2026 report. Ten men given scAAV2/8-LP1-hFIXco had median 13.0-year follow-up (11.1–13.8), stable mean activity 1.7/2.3/4.8 IU/dL across dose groups, and seven remained off prophylaxis. Fifteen vector-related events were mainly early transaminase elevations; two cancers were judged likely unrelated after evaluation. One ten-year liver biopsy showed active transgene expression. Product-specific lifetime durability and repeat administration remain valid gaps; total absence of >10-year data does not.
  citations:
  - PMID:40499172
- claim_id: leyden-regulation
  statement: Promoter-factor interactions explain an age-dependent regulatory subtype.
  disposition: QUALIFIED
  report_quote: Synergistic interaction between DBP and C/EBP compensates for the −5 mutant promoter during puberty
  rationale: >-
    ONECUT binding perturbation and knockout, HNF4 promoter assays, and DBP/C/EBP synergy support variant-specific regulation. The DBP result concerns the -5 allele and is not a universal mechanism for every Leyden mutation. The -26 promoter variant causing lifelong severe disease should not be grouped as a recovering Leyden allele; a maximum near 60% is not a guaranteed endpoint for every patient.
  citations:
  - PMID:23472758
  - PMID:1631121
  - PMID:8499951
- claim_id: rebalancing-functional-bypass
  statement: Reducing anticoagulant activity can improve hemostasis without supplying FIX.
  disposition: RETAINED
  report_quote: the system can be pharmacologically rebalanced to bypass this lesion
  rationale: >-
    Fitusiran lowers antithrombin and anti-TFPI agents augment tissue-factor-pathway FXa. This qualifies a claim that FIX restoration is the only possible rescue; it does not dispute the genetic cause or establish one TGA value as the sole determinant of every clinical outcome. Treatment targets are curated as BYPASSES rather than RESTORES F9.
  citations:
  - PMID:40053895
  - PMID:33587824
  - PMID:37646676
  - PMID:39521008
  - PMID:40608864
- claim_id: atlas-denominators
  statement: ATLAS-OLE demonstrates fitusiran benefit in 213 HB patients.
  disposition: QUALIFIED
  report_quote: In the ATLAS-OLE phase 3 trial (N=213)
  rationale: >-
    The 213 participants received the redesigned antithrombin-guided regimen and included HA and HB with or without inhibitors. Integrated safety used 286 participants and efficacy comparisons used parent-study control groups. The 71%/73% reductions are versus on-demand CFC/BPA, whereas ABR was comparable to CFC prophylaxis. Earlier low-AT and thrombotic events motivated targeting AT 15–35%; omitting that redesign overstates an uncomplicated rescue.
  citations:
  - PMID:40053895
  - PMID:33587824
- claim_id: antitfpi-evidence-class
  statement: The cited concizumab source is direct phase 2 evidence and establishes equal effects across all subgroups.
  disposition: QUALIFIED
  report_quote: Concizumab is expected to be equally effective in hemophilia A and B, regardless of inhibitor status
  rationale: >-
    PMID:33570646 is a mechanistic/clinical synthesis, not the primary phase 2 dataset. Expectation of similar utility is not an equivalence test. Primary explorer7 and explorer8 trials were available before the report; explorer8 separately estimated HB treated-bleed rate ratio 0.21 versus no prophylaxis. BASIS is a before-after HA/HB study, not a randomized HB-only comparison. Thromboembolic events and mitigation must be retained. Later 56-week explorer8 results are a current update, not a missed May-2026 paper.
  citations:
  - PMID:33570646
  - PMID:40515600
  - PMID:37646676
  - PMID:39521008
  - PMID:40608864
  - PMID:41499759
  - PMID:42341325
- claim_id: padua-cofactor-mechanism
  statement: Padua hyperactivity depends on FVIIIa and enhanced FX activation.
  disposition: RETAINED
  report_quote: the hyperactivity of FIX-R338L **requires FVIIIa cofactor activity**
  rationale: >-
    Purified-protein, plasma, and gene-therapy-sample experiments show that the extra specific activity depends on FVIIIa and faster FX activation rather than unregulated activation or failed inactivation. Emicizumab experiments remove this extra activity when substituting for FVIIIa; they do not make FIX dispensable.
  citations:
  - PMID:31219805
- claim_id: evolutionary-margin
  statement: The residue-338 scan explains why modest FIX reductions produce clinical disease.
  disposition: REJECTED
  report_quote: it explains why even modest reductions in FIX activity produce clinical hemophilia — there is very little functional margin
  rationale: >-
    The scan suggests evolutionary constraint on activity but does not measure clinical reserve or establish a causal explanation for the activity threshold. Many modest reductions remain above the hemophilia range, and activity substantially below normal can preserve useful hemostasis. This evolutionary narrative should not be promoted as an established disease mechanism.
  citations:
  - PMID:33656538
  - PMID:31219805
  - PMID:20301668
- claim_id: modifier-variance
  statement: Known modifiers explain the 10–15% of severe HB patients with mild disease.
  disposition: REJECTED
  report_quote: explain the 10–15% of severe HB patients with milder-than-expected clinical disease
  rationale: >-
    PMID:19686262 opens with 10–15% as the phenomenon to explain, then tests 53 parameters in a mixed F8/F9 cohort of 114 individuals. It reports a nominal FVII353Q association, not an HB-specific variance-explained estimate. The thrombophilia paper is a review and neither it nor the platelet review establishes complete explanation of that subgroup. Replication, multiplicity and clinical-treatment confounding matter.
  citations:
  - PMID:19686262
  - PMID:15230944
  - PMID:28550758
- claim_id: platelet-endothelial-scope
  statement: Platelet and endothelial abnormalities establish primary HB cellular mechanisms.
  disposition: QUALIFIED
  report_quote: suggesting primary hemostasis is also affected
  rationale: >-
    The platelet review explicitly states that evidence is limited and clear phenotype correlations have not been demonstrated. Endothelial dysfunction was measured in 40 mixed HA/HB patients and was associated with cardiovascular risks and chronic viral infection. Neither source establishes a primary F9-driven platelet disorder or a direct F9→endothelial dysfunction edge.
  citations:
  - PMID:28550758
  - PMID:18624700
- claim_id: female-xci
  statement: Skewed X inactivation proves a directly proportional F9 gene-dose mechanism.
  disposition: QUALIFIED
  report_quote: This confirms that the bleeding phenotype is directly proportional to functional *F9* gene dosage.
  rationale: >-
    The 73 selected carriers include 56 HA and 17 HB carriers with low factor activity. Peripheral-blood HUMARA methylation patterns correlate with factor activity and bleeding but do not directly measure liver X-inactivation or prove proportionality. The 97% value refers to finding a heterozygous variant, not proof that 97% require skewed XCI. The separate 22-woman severe/moderate series also mixes HA/HB. One pathogenic allele can cause female HB.
  citations:
  - PMID:33082527
  - PMID:24533955
  - PMID:20301668
- claim_id: inhibitor-risk-denominators
  statement: A single inhibitor rate of 1.5–3% and approximately half with anaphylaxis summarize all HB.
  disposition: QUALIFIED
  report_quote: FIX inhibitors develop in **1.5–3%** of all HB patients
  rationale: >-
    Older all-patient prevalence is not cumulative risk in severe previously untreated patients. PedNet followed 154 severe PUPs: 14 developed inhibitors, cumulative incidence 9.3% at 75 exposure days and 10.2% at 500, with allergies in 4/14. The selected Chinese inhibitor cohort had 59.1% allergic/anaphylactic reactions and registry prevalence 44/4485 (0.98%) with possible underdetection. Italian 8/282 prevalence is severe HB. These denominators and selection effects must stay separate.
  citations:
  - PMID:29925096
  - PMID:36163649
  - PMID:23601006
  - PMID:31919092
- claim_id: inhibitor-pvalue-attribution
  statement: Both large-deletion and nonsense high-risk associations are assigned the cited P values.
  disposition: REJECTED
  report_quote: Large deletions and nonsense mutations carry the highest risk (P=0.0002 and P<0.0001, respectively)
  rationale: >-
    The Chinese abstract assigns P=.0002 to large deletions and P<.0001 to the low risk with missense mutations; the report misassigns the second P value to nonsense high risk. Null variants are genuinely associated with inhibitors, supported independently by PedNet, but the exact statistical attribution is wrong.
  citations:
  - PMID:36163649
  - PMID:31919092
- claim_id: tolerance-outcomes
  statement: Italian success and Chinese complications define expected ITI outcomes.
  disposition: QUALIFIED
  report_quote: with ITI successful in 4/5 attempted cases
  rationale: >-
    The small Italian series supports feasibility and had no nephrotic syndrome, but cannot define population success. B-Natural reported 8/22 first-course successes and 11/22 after one or more courses at study end with eight ongoing. Allergy and nephrosis complicate treatment in selected patients and are not core untreated disease phenotypes.
  citations:
  - PMID:23601006
  - PMID:36163649
  - PMID:34118102
- claim_id: animal-genotype-immunity
  statement: Null-mutation dogs always develop inhibitors while missense dogs do not.
  disposition: QUALIFIED
  report_quote: null-mutation dogs developed inhibitory antibodies after gene transfer, while missense-mutation dogs did not
  rationale: >-
    The relevant experiment used skeletal-muscle AAV delivery at comparable doses and compared with earlier missense-dog observations; transient immune suppression blocked inhibitors in one null dog. Other liver-directed canine experiments achieved partial correction without inhibitors. Genotype informs risk, but route, dose, transgene and immunomodulation limit generalization.
  citations:
  - PMID:11545609
  - PMID:9883841
  - PMID:25675273
- claim_id: crispr-denominator
  statement: Mouse correction achieved 62.5% gene correction.
  disposition: REJECTED
  report_quote: 62.5% gene correction sufficient to remit coagulopathy
  rationale: >-
    The narrative Finding 8 correctly gives the denominator, but matrix row 14 does not: 62.5% of HTV-treated mice had >1% corrected hepatocyte F9 alleles. It was not 62.5% allelic correction. Hydrodynamic plasmid delivery and germline mouse experiments do not constitute a human treatment result.
  citations:
  - PMID:28508290
- claim_id: editing-versus-addition
  statement: All cited editing studies correct the endogenous mutation.
  disposition: QUALIFIED
  report_quote: correcting the endogenous mutation rather than adding an exogenous transgene achieves the same phenotypic rescue
  rationale: >-
    PMID:28508290 tests endogenous correction, whereas PMID:32775489 inserts a FIX transgene at the albumin locus. PMID:34649996 uses long-range replacement plus a synthetic promoter/enhancer for regulatory and coding defects and reports treatment-associated hepatic heterogeneity/inflammation. These are distinct rescue strategies, all preclinical, not three interchangeable endogenous repairs.
  citations:
  - PMID:28508290
  - PMID:32775489
  - PMID:34649996
- claim_id: acquired-phenocopy
  statement: Acquired inhibitor cases prove FIX deficiency is necessary and sufficient and fulfill Koch postulates.
  disposition: REJECTED
  report_quote: These lines of evidence collectively fulfill Koch's postulates adapted for genetic disease.
  rationale: >-
    A selective acquired anti-FIX case supports the causal importance of functional FIX loss, but clinical case observations are not controlled necessity/sufficiency experiments. PMID:21707870 describes a cross-reactive antibody with prothrombin and FX deficiencies and cannot isolate FIX as the cause. Concurrent inherited HB/acquired HA cases instead show why additional defects must be considered. Bleeding also has many causes other than FIX deficiency.
  citations:
  - PMID:22123568
  - PMID:21707870
  - PMID:38700550
  - PMID:36407152
- claim_id: emicizumab-boundary
  statement: Emicizumab substitutes for FVIIIa function and is not an indicated HB therapy.
  disposition: RETAINED
  report_quote: Emicizumab, a bispecific antibody mimicking FVIIIa cofactor activity, transformed hemophilia A management but is explicitly not applicable to hemophilia B.
  rationale: >-
    The quoted statement correctly distinguishes FVIII-mimetic action from replacing FIX. Emicizumab needs FIXa to bridge to FX and is not an indicated HB therapy. This is mechanistically consistent with the tenase model, although residual FIX in some patients means the report's universal phrase FIXa is absent is too broad.
  citations:
  - PMID:39613145
  - PMID:31219805
  - PMID:40608864
- claim_id: bone-directness
  statement: FIX directly controls bone biology independently of coagulation.
  disposition: QUALIFIED
  report_quote: '**FIX deficiency directly impairs bone metabolism**'
  rationale: >-
    F9-null mice have reduced mass and strength without spontaneous bleeding, but the primary paper favors testing an effector downstream of coagulation. It did not measure a direct FIX-osteoblast signaling pathway; bone histomorphometry and reliable RANKL/OPG assessment were unavailable. Mixed HA/HB human studies cannot isolate FIX, bleeding, mobility and comorbidity. The skeletal finding is retained as a model and explicit mechanistic gap, without a fabricated direct human edge.
  citations:
  - PMID:34117910
  - PMID:22292576
  - PMID:21391975
- claim_id: synovitis-independence
  statement: Mouse MTX benefit proves inflammatory persistence independent of blood exposure and requires clinical immunomodulation.
  disposition: QUALIFIED
  report_quote: persists and requires immunomodulatory intervention beyond hemostatic correction
  rationale: >-
    The mouse study supports an adjunct inflammatory contribution: prophylactic MTX improved cartilage and synovial outcomes, while delayed MTX improved synovitis but not cartilage erosion or proteoglycan loss. It does not demonstrate a requirement for human MTX, prove independence from all residual bleeding, or establish irreversible-cartilage reversal. PMID:17822515 is a mechanistic synthesis with limited human experimentation, not proof of a linear p53/p21/TRAIL cascade.
  citations:
  - PMID:42119948
  - PMID:17822515
- claim_id: extravascular-absence
  statement: No extravascular FIX studies were found, leaving the role wholly unknown.
  disposition: REJECTED
  report_quote: Searched for FIX extravascular distribution studies — no results returned
  rationale: >-
    PMID:19583826 perturbs collagen-IV binding in FIX K5A mice and finds abnormal hemostasis despite normal in vitro activity. PMID:27106122 compares day-seven FIX products in mice and localizes FIX around vessels in human liver and skeletal muscle. PMID:33780107 adds CRM-status and binding data; PMID:27766061 reviews the evidence. Quantitative human contribution and dosing translation remain uncertain, but absence of experimental evidence is false.
  citations:
  - PMID:19583826
  - PMID:27106122
  - PMID:33780107
  - PMID:27766061
- claim_id: clingen-absence
  statement: There is no formal F9-HB validity assertion and one should be initiated.
  disposition: REJECTED
  report_quote: No formal gene-disease validity curation entry identified during search
  rationale: >-
    The existing disease YAML already carries ClinGen CGGV assertion_3d56d08d-48d0-4523-b433-dbd44c5b9e45-2019-05-22T190226.728Z, a definitive F9–hemophilia B X-linked assertion. A failed provider search is not absence of curation, and initiating duplicate curation is unwarranted.
  citations:
  - PMID:20301668
  - CGGV:assertion_3d56d08d-48d0-4523-b433-dbd44c5b9e45-2019-05-22T190226.728Z
- claim_id: omics-gwas-absence
  statement: HB-specific modifier GWAS and patient joint omics are confirmed absent.
  disposition: QUALIFIED
  report_quote: No transcriptomic/proteomic datasets from HB patient joint tissue identified
  rationale: >-
    No query-response artifacts substantiate an exhaustive absence claim. The existing GSE190760 dataset is longitudinal blood scRNA-seq in seven gene-therapy participants and therefore does not refute the narrower joint-tissue claim. Mouse liver scRNA-seq is also not patient joint tissue. These remain bounded search gaps, not evidence that no HB omics or no possible modifier data exist.
  citations:
  - PMID:35598604
  - PMID:34649996
- claim_id: tga-surrogate
  statement: Thrombin generation is validated as superior to FIX level for individual HB management.
  disposition: RETAINED
  report_quote: Whether TGA better predicts individual bleeding phenotype than one-stage FIX assays
  rationale: >-
    The report correctly leaves this as a question. PMID:15735797 had only twelve HB patients within a 46-person HA/HB cohort; its post-infusion comparison involved FVIII treatment. Associations support a prospective HB-specific study, not immediate TGA-only dosing or proof of clinical surrogacy.
  citations:
  - PMID:15735797
- claim_id: ha-versus-hb-severity
  statement: HB is uniformly milder than HA at comparable activity.
  disposition: QUALIFIED
  report_quote: HB is clinically milder than HA
  rationale: >-
    The report labels this speculative, which is appropriate. Its review says fewer HB patients may bleed but bleeds can be equally severe. Treatment history, genotype, activity assays, and joint status make a universal biological severity ranking unjustified. Tissue-specific FVII-versus-FIX evidence is informative but is not a matched HA-versus-HB experiment.
  citations:
  - PMID:28826659
  - PMID:19245420
  - PMID:31919092
- claim_id: epidemiologic-disadvantage
  statement: The registry estimate gives a 24% loss of individual life expectancy.
  disposition: QUALIFIED
  report_quote: Life expectancy disadvantage in high-income countries is 24% for all HB and 27% for severe HB
  rationale: >-
    The reported numbers are correct for the paper's defined proxy: 1 minus point-prevalence/birth-prevalence ratio in six high-income registries. PubMed methods were independently checked. This is not a direct estimate of years lost for a contemporary treated individual, and the study could not adjust for comorbidity or ethnicity.
  citations:
  - PMID:31499529
- claim_id: proposed-bone-tests
  statement: Osteoblast deletion and DXA normalization would identify a direct FIX bone mechanism.
  disposition: QUALIFIED
  report_quote: If FIX restoration normalizes bone turnover → confirms FIX deficiency drives bone pathology
  rationale: >-
    The tests are proposals, not completed analyses. Establish meaningful F9 expression in osteoblasts before proposing deletion there; systemic hepatic FIX is the major source. DXA improvement after gene therapy can reflect reduced bleeding, improved mobility, treatment history or comorbidity, so it cannot by itself separate direct FIX effects from downstream thrombin or behavioral pathways.
  citations:
  - PMID:34117910
  - PMID:21391975
- claim_id: proposed-comparisons
  statement: The proposed TGA, MTX, GWAS, and treatment comparisons definitively distinguish causal models.
  disposition: QUALIFIED
  report_quote: If rebalancing equivalent to FIX replacement → supports thrombin generation deficit model
  rationale: >-
    No tests were executed. Cross-sectional TGA differences do not explain clinical severity without longitudinal outcomes; an indirect treatment comparison needs transitivity and harmonized populations/endpoints; a fixed sample size of 500 does not establish GWAS power. MTX trials require clinical equipoise and safety groundwork. Equivalent bleeding outcomes under distinct interventions are consistent with convergence on hemostasis, but do not uniquely identify every mediator.
  citations:
  - PMID:42119948
  - PMID:15735797
  - PMID:40053895
  - PMID:39521008
- claim_id: search-and-artifact-audit
  statement: The claimed systematic search and all artifacts are reproducible.
  disposition: QUALIFIED
  report_quote: '**Papers reviewed:** 124'
  rationale: >-
    The committed report and sidecar expose 44 unique citations, 31 matrix rows, twelve Finding sections and fourteen claim-status rows, versus 124 papers and sixteen confirmed findings stated in the header. There are three figure placeholders but no corresponding images, code, query logs, extraction tables, environment, or analysis output. Counts could refer to uncommitted internal material, but cannot be verified. Candidate snippets contain ellipses or altered wording and must be re-extracted from primary caches. The seed title attached to PMID:23430394 is also wrong; the actual title is Treatment of hemophilia B: focus on recombinant factor IX.
  citations:
  - PMID:23430394

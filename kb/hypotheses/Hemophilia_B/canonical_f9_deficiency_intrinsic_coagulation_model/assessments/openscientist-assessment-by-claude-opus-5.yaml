hypothesis_id: canonical_f9_deficiency_intrinsic_coagulation_model
assessed_at: "2026-09-02T18:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The seed hypothesis is the KB's own canonical model, so the report's central
  thesis was never in doubt; what it adds is a wide, largely source-faithful
  citation layer that the KB entry did not have. I fetched and read 17 of its 44
  cited PMIDs. The load-bearing ones hold up verbatim: the HOPE-B five-year
  bleeding-rate reduction, the fidanacogene multiyear follow-up, the
  demonstration that FIX-Padua hyperactivity collapses without factor VIIIa, the
  ONECUT and HNF-4 promoter work behind hemophilia B Leyden, the CRISPR
  correction experiment, the fitusiran extension study, and the methotrexate
  arthropathy experiment all say what the report says they say. The verdict is
  SUPPORTED rather than PARTIALLY_SUPPORTED because none of the qualifications
  the report raises touches the causal core, and the report itself frames them
  as boundary conditions rather than as competitors. Four problems keep
  individual claims below RETAINED. The BENEGENE-2 quotation cannot be checked
  at all, because that abstract does not retrieve into the reference cache. The
  bone claim is framed as an extrahemostatic role for factor IX, while its own
  cited mouse paper attributes the skeletal phenotype to an effector downstream
  of the coagulation cascade, which is the opposite framing. The
  emicizumab-inapplicability claim is real but is not asserted by the review
  cited for it. And the modifier-gene and X-inactivation findings are both
  imported from mixed or predominantly hemophilia A cohorts and restated as
  hemophilia B facts, the X-inactivation one with a
  "directly proportional" upgrade the source does not carry. The recommendation
  to retain CANONICAL status is correct.

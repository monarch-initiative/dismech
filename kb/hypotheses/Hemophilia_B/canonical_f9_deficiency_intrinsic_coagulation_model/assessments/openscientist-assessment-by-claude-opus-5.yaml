analyses:
- analysis_id: literature_evidence_matrix
  status: REPORTED_ONLY
  auditability: UNVERIFIABLE
  method: >-
    Iterative literature triage across five stated iterations, then manual
    construction of a 31-row evidence matrix, a 14-row claim-status table, a
    six-step causal chain with per-step evidence grades, a six-entry
    alternative-models list, and an eight-entry knowledge-gap table.
  comparison: >-
    Each catalogued paper classified as supporting, qualifying, or competing
    with the seed hypothesis, then aggregated into an ESTABLISHED, EMERGING, or
    SPECULATIVE grade per mechanistic claim.
  input_data_source_ids:
  - pubmed
  status_reason: >-
    There is no openscientist_artifacts directory for this hypothesis. No code,
    query set, intermediate table, or output file is committed, so the report's
    self-reported counts (124 papers, 16 confirmed findings, 5 iterations)
    cannot be checked and the row-level classifications cannot be regenerated.
  limitations: >-
    The per-row direction and confidence grades are judgements rather than
    computations, so a committed matrix would make them inspectable but still
    not reproducible. Spot-checking found the matrix rows less reliable than the
    body prose: row 22 grades the FIX-knockout bone study as showing that factor
    IX has extrahemostatic roles, which is not what that paper concludes.

claims:
- claim_id: f9-loss-of-function-core-mechanism
  statement: >-
    Loss-of-function variants in F9 disable the intrinsic tenase complex,
    abolish the thrombin burst, and cause the bleeding phenotype.
  disposition: RETAINED
  report_quote: >-
    The core claim — that loss-of-function variants in *F9* on Xq27.1 disable
    the intrinsic tenase complex (FIXa–FVIIIa), abolish the thrombin burst, and
    cause the bleeding phenotype — is validated by over 1,200 catalogued *F9*
    mutations, two independent phase 3 gene therapy programs demonstrating that
    restoring FIX expression corrects hemostasis with up to 5 years of sustained
    benefit
  rationale: >-
    This is the KB seed restated, so as a proposition it is not new support. Its
    value is the corroboration layer, which I checked and which holds:
    PMID:41358585 reports the five-year HOPE-B outcome, PMID:40239068 the
    fidanacogene follow-up, PMID:28508290 the CRISPR correction, and
    PMID:31219805 the biochemical demonstration that the tenase complex is the
    functional unit. The KB entry cited exactly one paper for this hypothesis
    before this run, which is the gap the integration closes. The "over 1,200
    catalogued F9 mutations" figure carries no citation anywhere in the report
    and I did not verify it; nothing was curated from it.
  citations:
  - PMID:41358585
  - PMID:40239068
  - PMID:28508290
  - PMID:31219805
- claim_id: hope-b-five-year-bleeding-reduction
  statement: >-
    A single infusion of etranacogene dezaparvovec reduced the adjusted
    annualized bleeding rate by 63 percent, sustained across five years.
  disposition: RETAINED
  report_quote: >-
    54 participants showed a reduction in adjusted ABR from 4.16 during the
    lead-in period to 1.52 during months 7–60 post-treatment, representing a
    **63% reduction** (95% CI: 24–82%) sustained over 5 years
  rationale: >-
    Verified against the fetched abstract, which gives the same three numbers in
    the same direction and the same confidence interval, and adds that factor IX
    activity was stable at 36.1 IU per deciliter at five years with exogenous
    factor consumption down 96 percent. This is the strongest single piece of
    causal evidence in the report: an intervention that supplies only the
    missing gene product corrects the phenotype. It was absent from the KB, whose
    Gene Therapy treatment rested on a guideline sentence merely listing gene
    therapy among novel strategies.
  citations:
  - PMID:41358585
- claim_id: benegene-2-quotation-unverifiable
  statement: >-
    A quotation giving a 71 percent bleeding-rate reduction and a treatment
    difference of minus 3.15 episodes is attributed to the BENEGENE-2 phase 3
    report and offered as a ready-to-use snippet.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    The annualized rate of bleeding for all bleeding episodes decreased by
    71%...a treatment difference of -3.15 episodes (95% CI, -5.46 to -0.83; P =
    0.008)
  rationale: >-
    PMID:39321362 fetches with bibliographic metadata only; its cached record
    has content_type unavailable and no abstract text, so nothing in this
    repository can confirm or refute the sentence. The ellipsis in the middle
    also means the quotation is stitched from two places, which is exactly the
    construction the snippet rule exists to catch. I did not curate it. The
    same trial programme is represented in the integration by PMID:40239068
    instead, whose abstract does retrieve and whose long-term result is
    quotable verbatim.
  citations:
  - PMID:39321362
  - PMID:40239068
- claim_id: intrinsic-tenase-is-the-functional-unit
  statement: >-
    The factor IXa and factor VIIIa complex, not factor IXa alone, is the
    functional unit through which factor IX acts, shown by the loss of
    FIX-Padua hyperactivity when factor VIIIa is replaced by a mimetic.
  disposition: RETAINED
  report_quote: >-
    Critically, the hyperactivity of FIX-R338L **requires FVIIIa cofactor
    activity**: when emicizumab (a FVIII-mimicking bispecific antibody) replaces
    FVIIIa, the hyperactivity is ablated
  rationale: >-
    Faithful to PMID:31219805, which states that the high specific activity of
    FIX-R338L requires factor VIIIa cofactor and that in an emicizumab-based
    system the hyperactivity of both recombinant and AAV-expressed FIX-R338L is
    ablated without factor VIIIa activity. This is a genuinely useful
    contribution: it is the cofactor-dependence experiment done from the factor
    IX side, and the disorder YAML had no tenase node at all, jumping straight
    from factor IX deficiency to bleeding. The report's attached inference that
    wild-type factor IX sits near the bottom of the activity scale at position
    338 so that "there is very little functional margin" is its own reading;
    PMID:33656538 reports the amino-acid scan and infers evolutionary pressure
    to limit activity, and says nothing about clinical margin. That inference
    was not curated.
  citations:
  - PMID:31219805
  - PMID:33656538
- claim_id: thrombin-generation-is-the-functional-determinant
  statement: >-
    Non-replacement rebalancing therapies show that thrombin generation
    capacity, rather than factor IX protein, is the proximate functional
    requirement for hemostasis.
  disposition: QUALIFIED
  report_quote: >-
    These therapies qualify the canonical model by demonstrating that the
    **thrombin burst**, not FIX protein per se, is the proximate functional
    requirement.
  rationale: >-
    The direction is right and both cited sources support it. PMID:40053895
    reports that fitusiran lowers antithrombin to raise thrombin generation and
    that the antithrombin-based regimen was superior to on-demand factor
    concentrates and to on-demand bypassing agents. PMID:33570646 gives the
    anti-TFPI counterpart, stating that when TFPI inhibitory activity falls,
    enough factor Xa is produced by the factor VIIa and tissue factor complex to
    achieve hemostasis. The qualification is that both trials enrolled hemophilia
    A and hemophilia B together and neither cited result is broken out for
    hemophilia B, so the claim is a family-level result imported into a
    hemophilia B entry. Note also that this class is deliberately curated on the
    parent Hemophilia entry rather than on either member, with a written
    rationale that it acts on the anticoagulant side and is therefore indifferent
    to which subunit is missing; duplicating it here would contradict that
    decision, so only the hypothesis-level annotation was added.
  citations:
  - PMID:40053895
  - PMID:33570646
- claim_id: hb-leyden-promoter-transcription-factors
  statement: >-
    Hemophilia B Leyden arises from F9 promoter variants that disrupt binding of
    ONECUT1, ONECUT2, and HNF-4, with severity graded by how far binding is
    disrupted.
  disposition: RETAINED
  report_quote: >-
    ONECUT transcription factors (ONECUT1 and ONECUT2) bind the −5/−6 site, and
    mutations at this site inhibit ONECUT binding to varying degrees that
    correlate with clinical severity
  rationale: >-
    Both cited sources say this. PMID:23472758 identifies ONECUT1 and ONECUT2 as
    the long-sought minus-5 and minus-6 regulators and reports that the Leyden
    mutations inhibit their binding to degrees correlating with clinical
    severity. PMID:1631121 reports the HNF-4 site at minus-34 to minus-10, shows
    that both the minus-20 and minus-26 mutations disrupt binding, and states
    that phenotype severity tracks the degree of disruption, with minus-26
    abolishing transactivation and causing lifelong rather than Leyden disease.
    Leyden is already curated as a subtype on the parent Hemophilia entry, which
    records explicitly that it has no dismech entry of its own, so this material
    was added here as hypothesis-level evidence for the transcriptional-modifier
    refinement rather than as a duplicate subtype.
  citations:
  - PMID:23472758
  - PMID:1631121
- claim_id: modifier-genes-explain-phenotype-discordance
  statement: >-
    Co-inherited variants outside F9, exemplified by the factor VII 353Q allele,
    explain the 10 to 15 percent of severe patients whose clinical disease is
    milder than their genotype predicts.
  disposition: QUALIFIED
  report_quote: >-
    The FVII 353Q allele was associated with severe phenotype in severe
    hemophilia patients (RR=3.5, 95% CI: 1.04–12.05, P=0.044), demonstrating
    that functional polymorphisms in coagulation genes beyond *F9* affect
    clinical severity
  rationale: >-
    The statistic is exact: PMID:19686262 reports the FVII353Q association at
    RR 3.5 with that interval and p value, and separately gives the 4.1-fold
    risk from severe molecular defects. Two qualifications matter for a
    hemophilia B entry. First, the study population is severe haemophilia
    broadly, and its comparability analysis reports F8:c activity, so it is
    predominantly or wholly hemophilia A; the report places it in a section
    titled as being about F9 genotype. Second, the direction is the opposite of
    the framing: the 353Q allele associates with a more severe phenotype, while
    the surrounding text presents modifiers as explaining milder-than-expected
    disease. Curated with both qualifications stated in the explanation.
  citations:
  - PMID:19686262
- claim_id: skewed-xci-gene-dose-proportionality
  statement: >-
    Skewed X-chromosome inactivation in carriers demonstrates that the bleeding
    phenotype is directly proportional to functional F9 gene dosage.
  disposition: QUALIFIED
  report_quote: >-
    This confirms that the bleeding phenotype is directly proportional to
    functional *F9* gene dosage.
  rationale: >-
    The underlying observation is real but the conclusion is an upgrade.
    PMID:33082527 reports a statistical association between inactivation pattern
    and factor VIII and factor IX levels in 73 symptomatic carriers, and that
    carriers with activity at or below 20 IU per deciliter and skewing at or
    above 80:20 had higher ISTH bleeding-assessment scores than carriers with the
    opposite combination. That is an association across two dichotomized strata
    in a mixed hemophilia A and B carrier cohort, not a demonstration of
    proportionality, and no factor IX-specific dose-response curve is reported.
    Not curated: the disorder entry has no inheritance block, and adding one on
    the strength of an overstated reading of a mixed cohort would import the
    overstatement.
  citations:
  - PMID:33082527
- claim_id: inhibitor-risk-tracks-null-genotype
  statement: >-
    Factor IX inhibitors develop in 1.5 to 3 percent of hemophilia B patients,
    carry a high rate of anaphylaxis and a risk of nephrotic syndrome, and arise
    preferentially in patients with large deletions and nonsense variants.
  disposition: RETAINED
  report_quote: >-
    Large deletions and nonsense mutations carry the highest risk (P=0.0002 and
    P<0.0001, respectively), while missense mutations have low risk
  rationale: >-
    Both halves check out. PMID:29925096 states the 1.5 to 3 percent figure and
    couples it to allergic and anaphylactic reactions and nephrotic syndrome in
    one sentence. PMID:36163649, a national registry cohort of 44 inhibitor
    patients among 4485 registered hemophilia B patients, reports that large
    deletions were most significantly associated with inhibitor development and
    that missense variants carried low risk, with anaphylaxis in 59.1 percent of
    inhibitor patients and nephrotic syndrome in two of twelve completing immune
    tolerance induction. The genotype gradient is itself evidence for the
    canonical model, since the patients with no endogenous factor IX protein at
    all are the ones who treat the infused protein as foreign. The report's
    supporting Italian figure of 8 of 282 severe patients rests on PMID:23601006,
    which I did not fetch; nothing was curated from it.
  citations:
  - PMID:29925096
  - PMID:36163649
- claim_id: emicizumab-inapplicability-cited-source-mismatch
  statement: >-
    Emicizumab is explicitly not applicable to hemophilia B, and this asymmetry
    demonstrates that factor IX and factor VIII have non-redundant roles in the
    intrinsic tenase complex.
  disposition: QUALIFIED
  report_quote: >-
    It bridges FIXa and FX (mimicking FVIIIa's role), but in HB, FIXa itself is
    absent.
  rationale: >-
    The proposition is true and follows from the mechanism, but PMID:39613145,
    the only source cited for it, does not assert it. That review says that
    factor VIII-mimetic agents such as emicizumab transformed the management of
    hemophilia A with inhibitors, and that rebalancing agents have shown promise
    in hemophilia B; it never states that emicizumab is inapplicable to
    hemophilia B, and the word inapplicable does not appear. The inference is the
    report's own. It is also better supported from elsewhere in the same report:
    PMID:31219805 shows directly that an emicizumab-based system cannot sustain
    FIX-Padua hyperactivity, which is the biochemical form of the same point. Not
    curated as a standalone claim, because the parent Hemophilia entry already
    records the therapeutic asymmetry in its rebalancing-therapy rationale.
  citations:
  - PMID:39613145
  - PMID:31219805
- claim_id: extrahemostatic-fix-bone-role
  statement: >-
    Factor IX may have roles in bone biology beyond hemostasis, expanding the
    canonical model to include extrahemostatic consequences.
  disposition: QUALIFIED
  report_quote: >-
    This emerging evidence suggests FIX may have roles in bone biology beyond
    hemostasis, potentially expanding the canonical model to include
    extrahemostatic consequences.
  rationale: >-
    The observations are solid and the interpretation inverts them.
    PMID:34117910 does report that factor IX knockout mice, growth-matched to
    littermates at 10 and 20 weeks, have reduced bone mineral density, reduced
    cortical and cancellous mass, and lower whole-bone fracture resistance. But
    its own conclusion is that these findings, together with parallel
    observations in factor VIII-deficient mice, point to an effector downstream
    of the coagulation cascade necessary for normal skeletal development. That
    is a claim about something downstream of coagulation, most plausibly
    thrombin, being needed in bone, and it is shared with hemophilia A. It is not
    a claim that factor IX itself has a non-hemostatic function, which is what
    the report and its evidence-matrix row 22 assert. The human arm is weaker
    still: PMID:21391975 studied 29 children with haemophilia of mixed type and
    severity, found lower density, higher urinary calcium, and no excess
    fractures, and offers primary skeletal pathology as a suggestion. Curated as
    a HUMAN_MODEL_MISMATCH discussion with the mechanism stated as unknown and
    the downstream-effector reading recorded, not as a pathophysiology node.
  citations:
  - PMID:34117910
  - PMID:21391975
- claim_id: arthropathy-independent-inflammatory-component
  statement: >-
    Once joint bleeding has initiated hemophilic arthropathy, an inflammatory
    process persists that hemostatic correction alone does not arrest, so
    methotrexate added to factor IX prophylaxis further protects the joint.
  disposition: RETAINED
  report_quote: >-
    This demonstrates that once blood-induced joint damage is initiated, an
    independent inflammatory cascade involving iron deposition, immune
    activation, and angiogenesis persists and requires immunomodulatory
    intervention beyond hemostatic correction.
  rationale: >-
    PMID:42119948 supports the experimental core: in hemophilia B mice given
    three biweekly knee punctures, prophylactic methotrexate with extended
    half-life factor IX reduced synovitis severity, synovial pannus vascular
    density, and cartilage damage relative to factor IX alone, and delayed
    methotrexate reduced synovial hyperplasia, vascularity, and macrophage
    infiltration. Two things the report does not carry. The same experiment found
    no difference in cartilage erosion or proteoglycan loss in the delayed arm,
    which bounds the effect. And iron deposition is not measured in this study at
    all; it is imported from a separate citation. The word demonstrates is doing
    more work than one murine experiment supports, which is why this was curated
    as a HUMAN_MODEL_MISMATCH discussion rather than as a causal edge. Note also
    that the report's proposed snippet for this paper is not verbatim: it renders
    the abstract's "decreased the degree of cartilage damage" as "reduced ... the
    degree of cartilage damage".
  citations:
  - PMID:42119948
- claim_id: crispr-correction-independently-validates-f9
  statement: >-
    In vivo CRISPR correction of the endogenous mutant F9 allele in hemophilia B
    mice remits the coagulation defect, validating F9 as the causal gene by a
    route independent of transgene supplementation.
  disposition: RETAINED
  report_quote: >-
    Gene editing represents an orthogonal therapeutic modality to gene
    supplementation that independently validates *F9* as the causal gene —
    correcting the endogenous mutation rather than adding an exogenous transgene
    achieves the same phenotypic rescue.
  rationale: >-
    PMID:28508290 reports that 62.5 percent of hydrodynamically injected mice
    showed detectable correction above 1 percent in hepatocyte F9 alleles and
    that this was sufficient to remit the coagulation deficiency. The
    orthogonality argument is sound and is the strongest form of the causal claim
    available in a model system, since it changes the endogenous locus rather
    than adding a transgene. It remains murine, and the report's two supporting
    citations (PMID:32775489, PMID:34649996) were not fetched, so only the
    primary result was curated.
  citations:
  - PMID:28508290
- claim_id: retain-canonical-status
  statement: >-
    The hypothesis should keep CANONICAL status, with the qualifications
    recorded as annotations rather than as a status change.
  disposition: RETAINED
  report_quote: >-
    - **Recommendation:** Maintain **CANONICAL** status
  rationale: >-
    Correct, and already implemented: the entry carries status CANONICAL with a
    notes field summarizing this same report and its six refinements. No status
    edit is warranted and none was made. The defect that remained is that those
    six refinements were asserted with no citation behind any of them, which the
    integration fixes by attaching one verified source to each. The report's
    proposed annotation text was not copied in; the existing notes already say
    the same thing in the entry's own words.
  citations:
  - PMID:41358585

  - analysis_id: report-figure-generation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Three figures the report references inline as artifact-friendly outputs:
      a mechanistic causal-chain diagram, a three-panel evidence summary, and a
      knowledge-gap ranking.
    status_reason: >-
      The committed report still carries the unresolved template placeholders
      for all three figures, and the hypothesis directory contains only
      openscientist.md and its citations sidecar. No image, no generating code,

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_autoimmune_thyrocyte_destruction_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The central mechanism is well supported in its stated scope, and unlike many
  hypothesis-search runs this one brings genuinely new primary sources rather
  than restating the seed: intrathyroidal lymphoid follicles as functional
  germinal centres with RAG1/RAG2 re-expression, cytokine sensitisation of
  otherwise Fas-resistant human thyrocytes, a human single-cell thyroid atlas,
  a 2026 Nature Genetics meta-analysis of 81,718 autoimmune hypothyroidism
  cases, and two clinically important subtypes the entry did not address. All
  41 cited identifiers that I checked resolve to real papers saying broadly
  what the report says they say, including the seven above PMID 41000000 that
  look implausible at a glance. Three claims are nonetheless overstated and one
  misreads its source. The immune-checkpoint-inhibitor "natural experiment" is
  presented as validation "via the exact pathways described in the canonical
  model", whereas the cited murine study concludes the opposite, that
  checkpoint-inhibitor thyroid disease is a novel entity with distinct pathways
  and upstream regulators; only the apoptosis arm converged. Fas/FasL is called
  "the dominant killing pathway" on the strength of a hedged 1997 commentary
  and a 2001 study that actually found killing only partially Fas/FasL
  dependent with a coexisting caspase-independent route. The Th17/Treg claim is
  sound as a correlation but its distinctive temporal ordering rests on one
  2025 review's synthesis, and the report's own knowledge-gap section concedes
  that ordering lacks longitudinal human evidence. Finally the executive
  judgment juxtaposes 418 GWAS signals with "only ~5.4% of variance" as though
  the second number came from the first; it is a seven-variable candidate-SNP
  model in 294 Polish subjects. The seed hypothesis was drawn from this
  knowledge base, so agreement with it is confirmation, not independent
  support; the report's value here is the effector-level and subtype-level
  detail underneath the seed.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md
data_sources:
  - data_source_id: pubmed-literature-corpus
    source_type: DATABASE
    name: PubMed literature corpus assembled by the run
    uri: https://pubmed.ncbi.nlm.nih.gov/
    access_status: UNVERIFIABLE
    notes: >-
      The header claims "145 papers reviewed" across five iterations, and the
      Limitations section states the search drew "primarily from PubMed". The
      citations sidecar enumerates 41 PMIDs, so the gap between 145 reviewed
      and 41 cited is not accounted for anywhere in the run. No search string,
      date filter, inclusion rule, or result log is committed, so the corpus
      cannot be reconstructed and its recall cannot be assessed. Prose alone is
      not an access record. The 41 identifiers themselves are sound: I fetched
      and read 16 of them, and every one resolved to a real paper broadly
      matching the report's characterisation.
  - data_source_id: gencc
    source_type: DATABASE
    name: GenCC
    uri: https://thegencc.org/
    access_status: UNVERIFIABLE
    notes: >-
      GAP 6 asserts that no GenCC curated gene-disease validity assessment was
      found for Hashimoto's thyroiditis "during this search". No query,
      response, or search log is committed, so this documented-negative claim
      cannot be graded SEARCHED_NO_RESULT, which would require a committed
      search artifact.
  - data_source_id: clingen
    source_type: DATABASE
    name: ClinGen Gene-Disease Validity
    uri: https://clinicalgenome.org/
    access_status: UNVERIFIABLE
    notes: >-
      Same status as GenCC and asserted in the same sentence of GAP 6. Worth
      noting that the claimed absence is plausible rather than surprising:
      Hashimoto's thyroiditis is a complex polygenic disease, and ClinGen
      gene-disease validity curation targets Mendelian gene-disease
      relationships, so an empty result is the expected outcome rather than a
      curation gap in ClinGen.
  - data_source_id: amsterdam-aitd-cohort
    source_type: OTHER
    name: Amsterdam AITD prospective cohort of euthyroid relatives
    identifier: PMID:20956436
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Named once, in GAP 1, as the kind of longitudinal pre-disease cohort that
      would resolve the tolerance-breaking initiating event. It is proposed as
      a future instrument, not queried; no cohort data, extract, or summary
      statistic from it appears anywhere in the report.

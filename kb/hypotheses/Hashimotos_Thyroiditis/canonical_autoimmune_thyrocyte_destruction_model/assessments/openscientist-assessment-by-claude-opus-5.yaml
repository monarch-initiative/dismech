claims:
  - claim_id: canonical-model-robustly-supported
    statement: >-
      The canonical model, in which loss of tolerance to thyroid peroxidase and
      thyroglobulin drives lymphocytic infiltration, tertiary lymphoid
      structure formation, and coordinated T-cell and autoantibody-mediated
      thyrocyte destruction, is the well-supported dominant effector mechanism
      of Hashimoto's thyroiditis.
    disposition: RETAINED
    report_quote: >-
      The Canonical Autoimmune Thyrocyte Destruction Model is robustly
      supported as the dominant effector mechanism for Hashimoto's thyroiditis
      (HT).
    rationale: >-
      Supported by independent primary sources the report actually brings, not
      merely by agreement with the seed. Armengol et al. establish that
      intrathyroidal lymphoid follicles are structurally and functionally
      germinal centres committed to thyroid self-antigen. Mezosi et al.
      establish cytokine-gated Fas apoptosis in primary human thyrocytes. Song
      et al. give a human single-cell thyroid atlas showing expansion of
      cytotoxic and B-lineage subsets. Li et al. show 92.9% autoantibody
      positivity in PD-1-inhibitor destructive thyroiditis. The important
      caveat is that the seed hypothesis was itself copied out of this
      knowledge base, so the report agreeing with it is confirmation rather
      than independent support; the new content is the effector-level and
      subtype-level detail underneath the seed, which is where the integration
      value lies.
    citations:
      - PMID:11549579
      - PMID:15563545
      - PMID:39931830
      - PMID:39216687
  - claim_id: evidence-base-tally
    statement: >-
      The run reviewed 145 papers and confirmed 15 findings across five
      investigation iterations.
    disposition: NEEDS_VERIFICATION
    report_quote: 145 papers reviewed, 15 findings confirmed across 5 iterations
    rationale: >-
      The 15 findings are enumerated as F001 to F015 and are checkable. The 145
      papers are not: the citations sidecar lists 41 PMIDs and the report never
      names the other roughly 104. No search log, query string, or screening
      record is committed. The iteration count is likewise unrecorded outside
      this one line. Nothing here is implausible, but nothing can be confirmed
      either, and the tally is the basis for the "12 of 13 claims established"
      framing carried into the executive judgment.
  - claim_id: tls-functional-germinal-centers
    statement: >-
      Intrathyroidal tertiary lymphoid structures are functional germinal
      centres committed to thyroid autoantigen responses, with RAG1 and RAG2
      re-expression implying in situ receptor revision.
    disposition: RETAINED
    report_quote: >-
      Intrathyroidal TLS function as germinal centers committed to thyroid
      autoantigen responses with RAG1/RAG2 expression enabling in situ receptor
      revision
    rationale: >-
      Accurately represents the cited source. Armengol et al. compared
      intrathyroidal lymphoid follicles with tonsil and lymph node follicles
      and found well-developed germinal centres with mantle, light and dark
      zones, follicular dendritic cells, high endothelial venules, thyroglobulin
      and thyroperoxidase binding, and unexpectedly high RAG1/RAG2 levels. One
      wording caveat the report does not carry: the source phrases receptor
      revision as suggested by RAG expression, not as demonstrated. Genuinely
      absent from the disease entry, whose Lymphocytic Infiltration node
      mentions germinal centre formation in prose without evidence.
    citations:
      - PMID:11549579
  - claim_id: fas-cytokine-sensitization
    statement: >-
      Normal thyrocytes resist Fas-mediated apoptosis and are sensitised to it
      by the specific combination of interferon gamma and interleukin 1 beta.
    disposition: RETAINED
    report_quote: >-
      Fas-mediated apoptosis of thyrocytes, sensitized by the combination of
      IFN-gamma and IL-1beta, is well-documented as the principal killing
      mechanism
    rationale: >-
      The sensitisation half is exactly what Mezosi et al. report in primary
      human thyroid cells: Fas signalling is blocked downstream of proximal
      caspase cleavage, and interferon gamma plus interleukin 1 beta
      pretreatment overcomes the block by raising surface Fas, procaspases 7, 8
      and 10, and Bid. This is the mechanistically specific, integratable part
      of the report's apoptosis section. The "principal killing mechanism"
      wording is assessed separately below.
    citations:
      - PMID:15563545
  - claim_id: fas-dominant-perforin-independent
    statement: >-
      Fas/FasL apoptosis is the confirmed dominant thyrocyte killing pathway
      and operates independently of perforin and granzyme.
    disposition: QUALIFIED
    report_quote: >-
      Fas/FasL-mediated apoptosis of thyrocytes, sensitized by IFN-gamma and
      IL-1beta, is confirmed as the dominant killing pathway, operating
      independently of perforin/granzyme
    rationale: >-
      Perforin independence holds; dominance does not. Hammond et al., the
      report's own second citation, found killing of Fas-expressing targets
      "only partially dependent on Fas/Fas ligand", unaffected by perforin
      blockade, only limitedly affected by caspase inhibitors, and concluded
      that a caspase-independent mechanism may coexist. The other citation,
      Ludgate and Jasani, is a one-paragraph commentary on an accompanying
      paper and is hedged to "may determine". Neither source confirms
      dominance. Hammond et al. does establish a different and more useful
      point the report states correctly in its findings section but drops from
      the summary: in Hashimoto glands the effector killers are the infiltrating
      lymphocytes, whereas the thyrocytes are poorly functional, which argues
      against thyrocyte fratricide.
    citations:
      - PMID:9274519
      - PMID:11716038
  - claim_id: ici-exact-pathway-validation
    statement: >-
      Checkpoint-inhibitor thyroiditis validates the canonical model as a
      natural experiment because it destroys the thyroid through the exact
      pathways the canonical model describes.
    disposition: QUALIFIED
    report_quote: >-
      This provides powerful causal validation: removing checkpoint inhibition
      on T cells produces thyroid destruction via the exact pathways described
      in the canonical model.
    rationale: >-
      This misreads its source. Pollack et al. did find the reported apoptosis
      and necrosis activation z-scores and did find apoptosis pathways
      similarly activated relative to interleukin 1 beta and interferon gamma
      treated human thyroid cell datasets, so the apoptosis arm converges. But
      the same comparison "revealed marked differences in pathway enrichment as
      well as in the predicted upstream regulators between the three types of
      immune thyroid disease", and the authors' stated conclusion is that
      checkpoint-inhibitor thyroid disease "represents a novel form of immune
      thyroid disease with distinct underlying biological pathways and
      regulators". "The exact pathways" is the opposite of what the paper
      concludes. Two further scope limits the report drops: this is thyroid
      tissue from a murine lung-cancer model, not human Hashimoto tissue, and
      the anti-PD-L1 arm produced only 35 differentially expressed genes and
      was set aside. The separate clinical observation that 92.9% of
      PD-1-inhibitor destructive thyroiditis cases were TPOAb or TgAb positive
      is sound and is reported accurately.
    citations:
      - PMID:37445704
      - PMID:39216687
  - claim_id: th17-treg-upstream-initiator
    statement: >-
      Th17/Treg imbalance is an established upstream initiator of the canonical
      destruction cascade rather than a bystander, because Th17 predominance
      precedes Th1-mediated tissue destruction.
    disposition: QUALIFIED
    report_quote: >-
      This temporal sequence suggests the Th17/Treg imbalance is not merely a
      bystander but an upstream initiator of the canonical destruction cascade.
    rationale: >-
      The correlational half is solid human data. Xue et al. measured a
      significantly lower Treg percentage, lower Foxp3, higher Th17 percentage
      and higher RORgt in Hashimoto patients, with the Treg/Th17 ratio
      negatively correlated with thyroperoxidase antibody, thyroglobulin
      antibody and thyrotropin, and it differed across thyroid-function
      subgroups. The temporal ordering is weaker: it comes from one sentence of
      a 2025 systematic review synthesising human, animal and preclinical
      literature, with no longitudinal human series behind it. The report's own
      GAP 1 concedes that "the transition from Th17/Treg imbalance to full
      Th1-mediated destruction also lacks longitudinal human evidence", which
      contradicts the executive judgment calling the axis "now established as a
      critical upstream event". Retain the imbalance as a mechanism node;
      record the ordering as review-level.
    citations:
      - PMID:25771887
      - PMID:41243116
  - claim_id: gwas-418-independent-signals
    statement: >-
      A genome-wide meta-analysis of 81,718 autoimmune hypothyroidism cases
      identified 418 independent genome-wide significant signals, a far more
      polygenic architecture than the roughly five loci named in the canonical
      model.
    disposition: RETAINED
    report_quote: >-
      The largest GWAS meta-analysis of 81,718 autoimmune hypothyroidism cases
      identified 418 independent signals
    rationale: >-
      Verified against the source. Reeve et al. report exactly 81,718 cases in
      FinnGen and UK Biobank and exactly 418 independent signals at
      p < 5e-8. The paper adds detail the report omits and the entry would
      benefit from: 48 loci where a protein-coding variant is the lead or is
      highly correlated with it, including Finnish-enriched coding variants in
      LAG3, ZAP70 and TG, and a Bayesian partition estimating 38% of loci as
      general-autoimmunity and 20% as thyroid-specific. The entry already
      curates LAG3 from a different source, so the two lines converge.
    citations:
      - PMID:41748903
  - claim_id: polygenicity-variance-juxtaposition
    statement: >-
      The 418 GWAS signals explain only about 5.4% of variance, so genetic
      testing has very low predictive power for Hashimoto's thyroiditis.
    disposition: QUALIFIED
    report_quote: "(418 independent GWAS signals vs. ~5 canonical loci, explaining only ~5.4% of variance)"
    rationale: >-
      Both numbers are real but they do not belong in one parenthesis. The 5.48%
      figure is from Jabrocka-Hybel et al., a seven-variable multivariate model
      built on candidate SNPs plus HLA-DRB1 sequencing in 147 Hashimoto cases
      and 147 controls in a single Polish cohort, published six years before
      the 418-signal meta-analysis and not derived from it. Reeve et al. report
      no such variance figure. Written as the report writes it, the sentence
      reads as though 418 signals jointly explain 5.4%, which is not a result
      anyone published. The underlying conclusion, that single-locus
      associations should be interpreted with caution and that prediction from
      a handful of variants fails, is the cited paper's own conclusion and is
      sound.
    citations:
      - PMID:41748903
      - PMID:29931474
  - claim_id: igg4-thyroiditis-distinct-subtype
    statement: >-
      IgG4 thyroiditis is a histopathologically distinct Hashimoto subtype with
      younger age, lower female-to-male ratio, rapid progression, higher
      autoantibody levels, dense stromal fibrosis and marked follicular
      degeneration, at roughly 27% of a surgical series.
    disposition: RETAINED
    report_quote: >-
      IgG4 thyroiditis, comprising approximately 27% of HT cases in a surgical
      series, presents with distinct features: younger age, lower
      female-to-male ratio, rapid progression, higher autoantibody levels,
      severe lymphoplasmacytic infiltration, dense stromal fibrosis, and marked
      follicular cell degeneration
    rationale: >-
      Accurate down to the feature list. Li et al. split 105 Hashimoto patients
      by IgG4 immunostaining into 28 IgG4 and 77 non-IgG4, which is the 27%,
      and report exactly these clinical and histological distinctions plus a
      predominance of interfollicular fibrosis. The report is careful to say
      "in a surgical series", and that scope limit must survive into the
      knowledge base: 27% of a Japanese thyroidectomy cohort is not 27% of
      Hashimoto's thyroiditis. The source also refutes the simpler reading that
      IgG4 thyroiditis is just the fibrous variant, since 14% of IgG4 cases had
      only mild fibrosis and 38% of non-IgG4 cases met fibrous-variant criteria.
    citations:
      - PMID:22555173
  - claim_id: seronegative-ht-88-percent-annotation
    statement: >-
      The canonical model's autoantibody claims apply to about 88% of cases,
      with about 12% following an antibody-independent pathway.
    disposition: QUALIFIED
    report_quote: >-
      Annotate that canonical model's antibody claims apply to ~88% of cases;
      ~12% follow antibody-independent pathway
    rationale: >-
      The existence and milder phenotype of seronegative disease is well
      supported by two independent cohorts, and it is a real qualification the
      entry lacks. The 88/12 split is not: 12.3% is 19 of 154 children in one
      Italian paediatric series, and the adult case-control series does not
      report a prevalence at all. Generalising one paediatric cohort to a
      global case fraction, and reading antibody-negative serology as an
      "antibody-independent pathway" rather than as sub-threshold or
      intrathyroidal antibody, both go past the sources. The paediatric paper
      also notes its seronegative group is clinically superimposable on
      overweight children with ultrasound changes and no antibodies, a
      reversible condition, which raises a real question about whether every
      seronegative case is autoimmune at all.
    citations:
      - PMID:35377135
      - PMID:24743395
  - claim_id: scrnaseq-cd8-expansion
    statement: >-
      A human single-cell atlas of Hashimoto thyroid tissue defined eight cell
      types and showed increased CD8+ T cell abundance plus a novel
      B_MEF2B_BCL6 subset.
    disposition: QUALIFIED
    report_quote: >-
      Single-cell transcriptomic sequencing of thyroid tissue from 6 HT
      patients constructed a panoramic atlas defining 8 cell types. CD8+ T cell
      abundance was increased.
    rationale: >-
      The atlas, the six patients and the eight cell types are exact. The CD8
      statement is not: Song et al. report elevated abundance of the
      CD8+T_CCL4L2 subcluster specifically, alongside B_MEF2B_BCL6, Mac_APOE,
      Mac_IL1B and TFC_PAX8_NKX2-1, not of CD8+ T cells as a whole. The report
      also omits the thyrocyte subcluster TFC_PAX8_NKX2-1, which is arguably
      the more novel finding for a mechanism model since it is a thyrocyte
      state rather than an immune one. Power is the binding limit: six patients
      against one healthy control, with part of the data pulled from a public
      accession, so abundance differences are descriptive.
    citations:
      - PMID:39931830
  - claim_id: sex-biased-cxcl13-b-cell-homing
    statement: >-
      Female thyroids without clinical autoimmune disease already harbour
      plasma B cells recruited through the CXCL13-CXCR5 axis, which may explain
      the female predominance of autoimmune thyroid disease.
    disposition: RETAINED
    report_quote: >-
      Female thyroids without clinical autoimmune disease already harbor plasma
      B cells recruited via the CXCL13-CXCR5 axis
    rationale: >-
      Faithful to the source, and correctly labelled by the report as a
      predisposition mechanism rather than a disease mechanism. Pereira
      Vasconcelos et al. deliberately excluded thyroids with any clinical sign
      of autoimmune disease, found sex differences in plasma-B-cell gene
      programmes by bulk RNA-seq, and localised CXCL13-CXCR5 recruitment by
      single-cell and spatial transcriptomics. The inference to autoimmune
      susceptibility is the authors' own and is explicitly framed as "may
      contribute", so it belongs in the entry as an emerging hypothesis and not
      as a wired causal edge. The disease entry currently offers no mechanistic
      account of the female predominance at all.
    citations:
      - PMID:39487734
  - claim_id: jak-inhibitor-demonstrates-reversal
    statement: >-
      A JAK inhibitor case report demonstrates reversal of Hashimoto's
      thyroiditis by targeting JAK/STAT signalling downstream of interferon
      gamma and interleukin 6.
    disposition: QUALIFIED
    report_quote: >-
      The JAK inhibitor case report demonstrates HT reversal upon targeting the
      JAK/STAT pathway mediating IFN-gamma/IL-6 signaling
    rationale: >-
      One 44-year-old woman treated for alopecia universalis whose
      thyroperoxidase antibodies normalised and who came off levothyroxine. The
      source itself says only "suggesting possible reversal of HT" and calls
      for further investigation; "demonstrates" is the report's word, not the
      paper's. The report's own evidence matrix grades it "Low (n=1)", so the
      overstatement is internal to the report. It is still a real and
      well-placed lead, and it is the strongest thing anyone has for the
      report's GAP 2, that no disease-modifying trial has been completed. The
      same case report is also the report's source for "TPOAb >90%", which is
      background prose in a case report rather than a primary measurement.
    citations:
      - PMID:42039112
  - claim_id: gencc-clingen-absence
    statement: >-
      No GenCC or ClinGen curated gene-disease validity assessment exists for
      Hashimoto's thyroiditis despite 418 GWAS signals.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Despite 418 GWAS signals, no GenCC or ClinGen curated gene-disease
      validity assessments were found for HT during this search.
    rationale: >-
      A documented-negative claim with nothing documenting it: no query, no
      date, no response, no log. Under the sidecar contract that makes it
      unverifiable rather than a searched-no-result. It is also framed as a
      curation deficiency when it is closer to a scope boundary. ClinGen and
      GenCC curate Mendelian gene-disease validity; Hashimoto's thyroiditis is
      a complex polygenic trait, so an empty result is expected and the
      proposed follow-up action of seeking ClinGen curation for HLA-DR, CTLA-4
      and PTPN22 asks those panels to do something outside their remit. Not
      integrated.

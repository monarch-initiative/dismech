hypothesis_id: late_truncating_nmd_escape
assessed_at: "2026-09-07T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The cleanest analysis of the five screens, and the one that adds least new
  evidence. Its contribution is a distinction rather than a citation: it splits
  the hypothesis into a clinical claim and a molecular claim and shows they rest
  on completely different footing. The clinical claim, that truncations in the
  last two KAT6A exons associate with a more severe phenotype, is supported by
  three independent cohorts converging on the same gradient. The molecular claim,
  that those alleles produce a translated protein acting by gain of function or
  dominant interference, is unproven, and the run did not close it.

  Its useful conclusion is a framing one. KAT6A is among the most
  loss-of-function-intolerant genes in the genome and early NMD-competent
  truncations are unambiguously pathogenic, so haploinsufficiency is the baseline
  mechanism for this disease and the late-truncating branch is better read as a
  severity modifier layered on top of it than as a competing primary mechanism.
  That is the same correction the parallel Bainbridge-Ropers run produced for
  ASXL3, reached independently and by a different route, and the ADNP run reaches
  it a third time. The entry's hypothesis description was amended accordingly;
  its ALTERNATIVE status was kept, which the report explicitly endorses.

  No new evidence was promoted. The three cohorts it cites for the severity
  gradient were already the entry's own evidence for that branch, so the
  convergence is a check on existing curation rather than an addition to it.

  Its computational work is two rule-based lookups, honestly labelled predictive
  rather than experimental. This bundle is the best-provisioned of the five: it
  is the only one carrying an environment record naming the runtime, package
  version and the fact that no random seeds were used. It still omits the
  MANIFEST.yaml and analysis code, so the analyses remain partially auditable.

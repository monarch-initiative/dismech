analyses:
  - analysis_id: kat6a-nmd-boundary
    method: >-
      Apply the 50 to 55 nucleotide last-junction rule to the canonical KAT6A
      transcript coordinates to locate the nonsense-mediated-decay escape
      boundary and classify premature termination codon positions.
    comparison: NMD-competent early truncations against NMD-escaping late truncations.
    input_data_source_ids:
      - ensembl-kat6a
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    software:
      - software_name: OpenScientist execute_code sandbox (Python)
        software_version: "3.12.13"
      - software_name: requests
        software_version: "2.34.2"
    environment_artifact: ../openscientist_artifacts/kb_hypotheses_Arboleda-Tham_Syndrome_late_truncating_nmd_escape_openscientist_artifacts_config_environment.md
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Arboleda-Tham_Syndrome_late_truncating_nmd_escape_openscientist_artifacts_tables_kat6a_exon_structure.csv
    status_reason: >-
      The exon table is committed and the environment record names the runtime,
      package version and the absence of random seeds, which is more provenance
      than any sibling run delivered. PARTIAL rather than SUCCEEDED because the
      analysis code was not delivered, so the arithmetic from the exon table to
      the quoted boundary is attested only by the provider.
    limitations: >-
      Rule-based prediction, not an experimental decay assay, and the report says
      so. It assigns an expected fate to a position; it does not show that any
      transcript escapes decay in patient cells.
  - analysis_id: kat6a-domain-retention
    method: >-
      Interval overlap of UniProt domain boundaries against the decay-escape
      boundary to determine which domains a late truncation retains or loses.
    input_data_source_ids:
      - uniprot-kat6a
      - ensembl-kat6a
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    environment_artifact: ../openscientist_artifacts/kb_hypotheses_Arboleda-Tham_Syndrome_late_truncating_nmd_escape_openscientist_artifacts_config_environment.md
    status_reason: >-
      No output table for this analysis was delivered; its result appears only as
      prose in the report. The inputs are recorded by stable identifier and the
      method is a stated interval overlap, so it is PARTIAL rather than
      REPORTED_ONLY, but there is less to inspect here than for the exon mapping.
    limitations: >-
      Assumes the canonical isoform, and the report notes protein stability was
      not assessed, which is the property the hypothesis actually turns on.
claims:
  - claim_id: clinical-severity-gradient-established
    statement: >-
      Truncating variants in the last two KAT6A exons associate with a more
      severe phenotype, supported by three independent cohorts converging on the
      same directional gradient.
    disposition: RETAINED
    report_quote: >-
      is **robustly and reproducibly supported**
    rationale: >-
      Accurate, and the cohort convergence is real. Not promoted, because the
      cohorts it names were already the entry's evidence for this branch. The
      value is confirmatory: an independent search over the same question
      returned the same cohorts and read them the same way.
  - claim_id: molecular-claim-unproven
    statement: >-
      That late-truncating alleles produce a translated protein acting by gain of
      function or dominant interference in patient tissue is structurally
      plausible but experimentally unproven.
    disposition: RETAINED
    report_quote: >-
      is **structurally plausible but experimentally unproven**
    rationale: >-
      Correct and correctly separated from the clinical claim, which is the
      report's main analytical contribution. The distinction matters for curation:
      the entry's two hypotheses are about mechanism, and a well-supported
      severity gradient is not evidence about mechanism. Confirms the discussion's
      framing and the category staying UNKNOWN.
  - claim_id: haploinsufficiency-is-baseline
    statement: >-
      KAT6A is extremely loss-of-function intolerant and early NMD-competent
      truncations are unambiguously pathogenic, establishing haploinsufficiency
      as the baseline pathogenic mechanism.
    disposition: QUALIFIED
    report_quote: >-
      This establishes **haploinsufficiency as the baseline pathogenic mechanism** for ARTHS.
    rationale: >-
      The constraint values are committed and the argument is sound as far as it
      goes. Qualified rather than retained because it rests on an analysis that is
      only partially auditable, and because constraint reflects all
      loss-of-function alleles and cannot by itself say how the late-truncating
      class behaves, which the report acknowledges as a limitation of that
      lookup.
    analysis_ids:
      - kat6a-nmd-boundary
  - claim_id: modifier-not-competing-mechanism
    statement: >-
      The late-truncating branch is better curated as a severity modifier layered
      on haploinsufficiency than as a competing primary mechanism that replaces
      it.
    disposition: RETAINED
    report_quote: >-
      not* as a competing primary mechanism that replaces haploinsufficiency
    rationale: >-
      The promoted conclusion. It is the same correction the parallel
      Bainbridge-Ropers run produced for ASXL3 and the ADNP run for ADNP, reached
      here independently and from constraint data rather than from cohort
      severity, which makes the convergence worth something. The entry's
      hypothesis description was amended to say the branch modifies rather than
      competes; its ALTERNATIVE status was kept, which the report endorses.
  - claim_id: bundle-manifest-and-code
    statement: >-
      A canonical manifest with checksums and the analysis code accompany the
      artifact bundle.
    disposition: REJECTED
    report_quote: >-
      canonical `MANIFEST.yaml` (schema version, status/fallback flags, checksummed
    rationale: >-
      Neither is in the delivered bundle, which is the same omission as every
      other run in this series. This bundle is nonetheless the best of the five:
      it is the only one carrying an environment record, and its committed tables
      and two search logs make the literature work traceable. The analysis-run
      gate still cannot be applied.

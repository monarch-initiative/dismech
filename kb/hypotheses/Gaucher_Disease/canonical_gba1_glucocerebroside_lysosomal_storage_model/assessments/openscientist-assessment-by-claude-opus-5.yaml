hypothesis_id: canonical_gba1_glucocerebroside_lysosomal_storage_model
assessed_at: "2026-09-02T14:20:00Z"
overall_verdict: SUPPORTED
summary: >-
  The seeded chain (biallelic GBA1 variants, reduced glucocerebrosidase
  activity, glucosylceramide accumulation in macrophage lysosomes, visceral and
  skeletal disease) is well supported, and the report's recommendation to retain
  CANONICAL status is correct. The central thesis, however, restates the seed:
  the seed hypothesis already asserted the chain and already named enzyme
  replacement and substrate reduction therapy as converging on it, so the
  report's contribution is its citation set rather than a new argument. That
  citation set is unusually clean. Every consequential claim checked here
  resolves to a real paper that says what the report says it says, at the right
  taxonomic level and in the right direction, and quantitative figures (ENGAGE
  4.5-year organ volumes, the 6.2 percent atypical-phenotype fraction, the
  multiple myeloma and lymphoma risk multiples) are transcribed accurately. Four
  defects limit how the report may be used. Its own limitations section
  misdescribes the complement study as a chemical-inhibitor model when that
  paper used germline GCase-deficient and C5aR1-deficient mice. The
  osteonecrosis ROC AUC of 0.894 belongs to a combined biomarker set, not to
  glucosylsphingosine alone. One proposed Cell Ontology identifier resolves to a
  narrower concept than its stated label. And the claimed 70-paper corpus cannot
  be reconstructed from the 25-entry citation manifest, with no search log,
  screening record, or figure artifact committed anywhere in the hypothesis
  directory.

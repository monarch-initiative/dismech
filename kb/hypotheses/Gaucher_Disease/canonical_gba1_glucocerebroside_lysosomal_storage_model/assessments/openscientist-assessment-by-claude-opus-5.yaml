analyses:
  - analysis_id: evidence-matrix-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature synthesis rendered as an 18-row evidence matrix, a
      six-gap knowledge-gap table, and a text causal-chain diagram.
    status_reason: >-
      No committed corpus, screening log, code, or output table substantiates
      the synthesis. The report embeds two figure placeholders
      (causal_chain.png and evidence_matrix.png), but no image file and no
      openscientist_artifacts bundle exists in the hypothesis directory, so the
      figures cannot be inspected.
    limitations: >-
      The matrix rows were spot-checked against the cached primary sources and
      were accurate; that check validates the transcription, not the
      completeness or the selection process behind the corpus.
claims:
  - claim_id: canonical-core-chain
    statement: >-
      Biallelic GBA1 variants reduce glucocerebrosidase activity, causing
      glucosylceramide accumulation in macrophage lysosomes and driving visceral
      and skeletal disease, with converging enzyme replacement and substrate
      reduction efficacy as the strongest validation.
    disposition: RETAINED
    report_quote: >-
      The core causal chain — biallelic GBA1 mutations → reduced
      glucocerebrosidase (GCase) activity → glucosylceramide (GlcCer)
      accumulation in macrophage lysosomes → visceral and skeletal disease — is
      validated most convincingly by the concordant clinical efficacy of two
      mechanistically orthogonal therapies
    rationale: >-
      The chain is correct and the therapeutic-convergence argument holds. It is
      worth being explicit that this is not new support: the seed hypothesis
      YAML supplied to the provider already stated the chain and already named
      both therapy classes as targeting it, so restating it is provider
      inference over the KB's own content. What the report does add is a
      contemporary citation set for the convergence argument, including the
      ENGAGE final results and a 1,197-child registry analysis, neither of which
      was cited in the disorder entry.
    citations:
      - PMID:34161616
      - PMID:41821052
      - PMID:37342037
  - claim_id: engage-final-trial-outcomes
    statement: >-
      Eliglustat over 4.5 years reduced spleen volume by 66 percent and liver
      volume by 23 percent, raised hemoglobin by 1.4 g/dL and platelets by 87
      percent, concurrently with falls in glucosylceramide and
      glucosylsphingosine.
    disposition: RETAINED
    report_quote: >-
      spleen volume decreased from 17.1 to 5.8 multiples of normal (66%
      reduction), liver volume decreased from 1.5 to 1.1 multiples of normal
      (23% reduction), hemoglobin increased by 1.4 g/dL, and platelet counts
      increased by 87%
    rationale: >-
      Every figure matches the ENGAGE final-results abstract verbatim, as does
      the linkage clause "concomitant with reductions in pathological lipid
      substrate levels (glucosylceramide and glucosylsphingosine)". The
      simultaneity of substrate fall and clinical improvement is the specific
      observation that makes this the strongest single piece of pharmacological
      support for the canonical chain, and it is stronger than the 9-month
      primary analysis the disorder entry currently cites.
    citations:
      - PMID:34161616
  - claim_id: glcsph-more-proximal-mediator
    statement: >-
      Glucosylsphingosine, rather than glucosylceramide, is the more proximal
      cytotoxic mediator, particularly for skeletal and neurological disease.
    disposition: QUALIFIED
    report_quote: >-
      Glucosylsphingosine (GlcSph), a deacylated derivative of GlcCer, is likely
      the more proximal cytotoxic mediator, particularly for skeletal and
      neurological complications.
    rationale: >-
      The conversion step is real and well sourced: acid ceramidase deacylates
      glucosylceramide to glucosylsphingosine, which is described as a toxic
      metabolite. The correlational evidence is also solid, with
      glucosylsphingosine tracking disease burden and falling under therapy. But
      the cited work is biomarker-correlation and review material; no cited study
      compares the two lipids head to head for toxicity, which is exactly the
      experiment the report itself proposes as Discriminating Test 3. Relative
      potency is therefore a well-motivated hypothesis, not an established
      ranking. Note the disorder entry already models a glucosylsphingosine node
      with edges to the neuronopathic and skeletal branches, so the claim adds
      citation strength rather than a missing mechanism.
    citations:
      - PMID:35764179
      - PMID:36739645
      - PMID:38843618
  - claim_id: glcsph-osteonecrosis-auc
    statement: >-
      Glucosylsphingosine levels predicted osteonecrosis risk during therapy
      with a ROC AUC of 0.894.
    disposition: QUALIFIED
    report_quote: >-
      Most strikingly, GlcSph levels predicted osteonecrosis risk during therapy
      with an ROC AUC of 0.894 (p<0.001), suggesting it directly mediates
      skeletal complications even in treated patients
    rationale: >-
      The AUC is misattributed. The source reports that "Together, these
      biomarkers reliably predicted risk of AVN during therapy (ROC AUC 0.894,
      p<0.001)", where the biomarker set includes genotype, prior osteonecrosis
      history, and treatment type alongside glucosylsphingosine. What the source
      does support for glucosylsphingosine alone is an independent association:
      a 1.2 percent increase in osteonecrosis risk per ng/ml. The report's added
      inference that glucosylsphingosine "directly mediates" skeletal
      complications also goes beyond an observational association in a
      155-patient single-center cohort.
    citations:
      - PMID:37249220
  - claim_id: complement-c5a-amplification-loop
    statement: >-
      Complement C5a and C5aR1 form a feed-forward loop that amplifies
      glucosylceramide accumulation and tissue inflammation, with C5aR1 loss
      rescuing otherwise lethal GCase deficiency in mice.
    disposition: RETAINED
    report_quote: >-
      All GCase-inhibited mice died within 4–5 weeks, but mice deficient in both
      GCase and C5aR1 were rescued and survived
    rationale: >-
      Verified against the primary source, which reports marked local and
      systemic complement activation associated with glucosylceramide storage,
      rescue of the lethal phenotype in double-deficient animals, formation of
      complement-activating glucosylceramide-specific IgG autoantibodies in both
      mice and humans, and C5aR1 control of UDP-glucose ceramide
      glucosyltransferase. This is the report's most substantial addition: it is
      a mechanism absent from the disorder entry, it converts stored substrate
      from inert deposit into an active amplifier, and the survival rescue is a
      genuine perturbation result rather than a correlation.
    citations:
      - PMID:28225753
  - claim_id: complement-chemical-model-limitation
    statement: >-
      The complement findings come from chemical-inhibitor mouse models rather
      than genetic Gaucher disease models, which limits translational
      confidence.
    disposition: REJECTED
    report_quote: >-
      derive from chemical inhibitor mouse models, not genetic GD models,
      limiting translational confidence.
    rationale: >-
      This self-imposed limitation misreads the source it cites. That study used
      genetic models throughout: GCase-deficient mice, mice deficient in both
      GCase and C5aR1, and separately a pharmacological arm in wild-type animals
      as a confirmatory design. The genetic double-deficient rescue is the
      paper's central experiment. The report has therefore discounted its own
      strongest mechanistic evidence on a false premise, and a curator relying on
      this caveat would understate the finding.
    citations:
      - PMID:28225753
  - claim_id: no-brain-substrate-in-gba1pd
    statement: >-
      There is no convincing evidence of substrate accumulation in GBA1-Parkinson
      disease brains, so the canonical chain may be broken at the node that would
      explain the neurodegenerative branch.
    disposition: RETAINED
    report_quote: >-
      there is no convincing evidence of substrate accumulation in GBA1-PD brains
    rationale: >-
      Verbatim in the cited review's abstract, which sets it against preclinical
      evidence that GCase activity products can promote alpha-synuclein
      accumulation, and proposes misfolded-GCase endoplasmic reticulum stress
      with impaired autophagy as the operative alternative. This is review-level
      synthesis rather than a primary negative result, and it is scoped to
      GBA1-PD brains rather than to neuronopathic Gaucher disease types 2 and 3,
      which the report at one point conflates. Within that scope it is a real and
      curation-relevant absence, and it is not represented anywhere in the
      disorder entry.
    citations:
      - PMID:37080432
  - claim_id: gcase-alpha-synuclein-loop
    statement: >-
      Loss of GCase function compromises lysosomal protein degradation and causes
      alpha-synuclein accumulation, while alpha-synuclein reciprocally inhibits
      GCase, forming a self-reinforcing loop.
    disposition: RETAINED
    report_quote: >-
      functional loss of GCase compromises lysosomal protein degradation and
      causes α-synuclein accumulation, while α-synuclein in turn inhibits normal
      GCase activity in neurons
    rationale: >-
      Accurately transcribed from the primary study, which worked in primary
      cultures and human iPSC neurons, showed glucosylceramide stabilizing
      soluble oligomeric alpha-synuclein intermediates, and demonstrated
      alpha-synuclein inhibition of GCase in neurons and idiopathic Parkinson
      disease brain. The disorder entry already asserts this bidirectional
      relationship, but only on a review citation; this is the primary source
      behind it.
    citations:
      - PMID:21700325
  - claim_id: cancer-and-gammopathy-risk
    statement: >-
      Type 1 Gaucher disease carries roughly ninefold multiple myeloma risk,
      threefold non-Hodgkin lymphoma risk, and elevated liver, kidney, and
      melanoma risk, with a mechanism that remains incomplete.
    disposition: RETAINED
    report_quote: >-
      GD1 patients show 9x risk of multiple myeloma, 3x non-Hodgkin lymphoma,
      and elevated risks of liver, kidney, and melanoma cancers
    rationale: >-
      Every multiple is verified against the 2,123-patient registry analysis,
      which reports hematological malignancy risk more than four times expected,
      non-Hodgkin lymphoma about three times, multiple myeloma about nine times,
      and solid tumors of liver 2.9, kidney 2.8, melanoma 2.5, and breast 1.4
      times expected, against a SEER comparator. The paper itself frames the
      mechanism as an open question about the role of glucosylceramide and
      related sphingolipids in cancer biology, which supports the report's gap
      framing rather than a curated causal edge. The disorder entry currently
      carries no malignancy or gammopathy content at all.
    citations:
      - PMID:36054609
  - claim_id: bone-remodeling-uncoupling
    statement: >-
      Skeletal disease involves active uncoupling of bone remodeling, with
      GCase-inhibited macrophage secretions both driving osteoclast
      differentiation and suppressing osteoblast function.
    disposition: QUALIFIED
    report_quote: >-
      GCase-inhibited macrophages produced conditioned media that simultaneously
      induced osteoclast differentiation (via TNF-α) and reduced osteoblast
      alkaline phosphatase and mineralization
    rationale: >-
      Faithful to the source, with one scope caveat the report does not state.
      The experiment used splenocytes and peritoneal macrophages isolated from
      normal mice and exposed to conduritol B epoxide, so it is a chemical in
      vitro model of GCase inhibition rather than a genetic Gaucher model or
      patient material, and the TNF-alpha attribution is offered by the authors
      as a candidate ("could be one of the factors"). The complementary human
      mesenchymal stromal cell work from a genotyped patient is stronger on
      provenance but is n equals 1. The claim is a good substantiation of an
      inference the disorder entry already carries as an unsupported intermediate
      mechanism.
    citations:
      - PMID:24076352
      - PMID:19587377
  - claim_id: ambroxol-cns-benefit
    statement: >-
      Ambroxol, a blood-brain-barrier-penetrant pharmacological chaperone,
      reduced the severity of or resolved selected neurological symptoms in type
      3 Gaucher disease, addressing a gap that enzyme replacement therapy cannot.
    disposition: QUALIFIED
    report_quote: >-
      a reduction in severity or complete resolution of selected neurological
      symptoms in several patients
    rationale: >-
      The quote is verbatim from the cited study and the enzyme replacement
      blood-brain-barrier limitation is stated in that same abstract, so the
      direction of the claim is right. The strength is not. The neurological
      result comes from 13 L444P homozygotes given ambroxol for one year as an
      add-on to stable enzyme replacement, with no control arm, and the authors
      themselves hedge to "several patients" and "selected" symptoms. The
      supporting visceral and biomarker dataset is a separate 28-patient
      uncontrolled case series in patients who could not afford enzyme
      replacement. Ambroxol is a well-evidenced curation lead for a treatment
      entry, but as investigational and off-label rather than established.
    citations:
      - PMID:41901003
      - PMID:37342037
  - claim_id: genotype-phenotype-heterogeneity-wes
    statement: >-
      Clinical heterogeneity within identical GBA1 genotypes is substantial, and
      exome sequencing attributed a fraction of atypical presentations to
      concurrent unrelated genetic diagnoses.
    disposition: RETAINED
    report_quote: >-
      6.2% of patients (17/275) presented with atypical phenotypes not fully
      explained by GD, and whole-exome sequencing revealed additional genetic
      diagnoses including hereditary hemochromatosis (n=5) and familial
      Mediterranean fever (n=4).
    rationale: >-
      Numbers and gene-disease attributions match the source exactly, including
      the two further diagnoses the report omits (homozygous MSH6 cancer
      predisposition and autosomal dominant polycystic kidney disease). The
      report's framing is sound: this explains a small minority of atypical
      cases and leaves the bulk of within-genotype variability unexplained, so it
      bounds rather than rescues the canonical model's predictive reach.
    citations:
      - PMID:41282474
  - claim_id: ontology-term-leads
    statement: >-
      The proposed Cell Ontology and Gene Ontology identifiers correctly name the
      cell types and processes the report assigns to them.
    disposition: QUALIFIED
    report_quote: >-
      Osteoclast (CL:0000092), Osteoblast (CL:0001039), Mesenchymal stromal cell
      (CL:0000134), Dopaminergic neuron (CL:0000700), Dendritic cell (CL:0000451)
    rationale: >-
      All seven proposed Gene Ontology identifiers resolve with the labels the
      report gives them, and five of the six cell-type identifiers are correct.
      The exception is CL:0001039, offered as "Osteoblast", which resolves to
      terminally differentiated osteoblast; the generic osteoblast term is
      CL:0000062. CL:0000134 resolves as mesenchymal stem cell rather than the
      report's "mesenchymal stromal cell" label, which is a synonym-level rather
      than a concept-level discrepancy. A curator copying the list unchecked
      would bind one node to a narrower class than intended.
    citations: []
  - claim_id: seventy-paper-corpus
    statement: >-
      The evaluation rests on a 70-paper corpus assembled by targeted PubMed
      searches.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This evaluation is based on 70 papers identified through targeted PubMed
      searches.
    rationale: >-
      The report frontmatter records citation_count 25 and the citations sidecar
      lists exactly 25 identifiers. Reading 70 papers and citing 25 is entirely
      normal practice, but with no search strategy, screening log, or corpus
      list committed, the number and the "targeted" characterization cannot be
      reconstructed from the deposited provenance. Nothing turns on it for
      curation; it is recorded so the figure is not later cited as an audited
      corpus size.
    citations: []

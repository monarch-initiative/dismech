schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: nmd_escape_truncation_branch
assessed_at: "2026-09-07T00:00:00Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The screen that most sharply changed what this entry can claim, by finding the
  negative result the hypothesis had been describing as an absence of evidence.

  The hypothesis has two parts and the run separates them cleanly. Its premise,
  that most pathogenic last-exon truncating ADNP alleles escape nonsense-mediated
  decay and produce mutant transcript, is confirmed on both a computed allele
  census and direct detection of mutant ADNP mRNA in patient blood. Promoted.

  Its central question, what the retained mutant protein does, is where the run
  earns its keep. The entry recorded that mutant protein "has never been
  unambiguously demonstrated in patients", which reads as nobody having looked
  properly. The run surfaces a study that did look, systematically, across
  patient-derived materials and multiple antibodies, and found no detectable
  mutant ADNP protein, reading the result as degradation or absence of a mutant
  protein. That is a materially stronger statement than an absence of evidence
  and it cuts against the branch it was asked to explore. Promoted as a REFUTE
  item, and the hypothesis description was amended so it no longer implies the
  question is merely unexamined.

  The report's own balance judgement follows: current evidence modestly favours
  insufficiency, with any gain-of-function or dominant-negative effect unproven
  at the endogenous patient-protein level. This is the third of five screens to
  arrive at the same shape, after Bainbridge-Ropers and Arboleda-Tham: the
  decay-escape branch is a candidate modifier on a dosage-loss baseline rather
  than a symmetric competitor. The category stays UNKNOWN, since none of this
  measures what the protein does when it is present.

  Provenance reporting is the best of the five. It names the full package
  environment, reports a ClinGen API failure rather than hiding it, and states
  that a figure exists only in the executor sandbox. The bundle still omits the
  MANIFEST.yaml and analysis script its own README lists.
artifacts:
  - openscientist-assessment-by-claude-code.md
artifact_root: ../openscientist_artifacts
data_sources:
  - data_source_id: clinvar-adnp
    source_type: DATABASE
    name: ClinVar pathogenic and likely-pathogenic ADNP variants
    identifier: "clinvar:ADNP"
    version: live database, no pinned release
    uri: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    retrieved_at: "2026-09-07T00:00:00Z"
    access_status: ACCESSED
    query: 'ADNP[gene] AND ("pathogenic"[clinsig] OR "likely pathogenic"[clinsig]); esearch to 303 IDs, then esummary, GRCh38 positions'
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_summary_stats.json
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_class_counts.csv
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_nmd_sensitive_early_variants.csv
    notes: >-
      Directly relevant and the committed tables are internally consistent: the
      seven class counts sum to the stated 303 records, nonsense plus frameshift
      gives the stated 165 truncating, and 150 of 165 is the stated 90.9 percent.
      The query is recorded but the source is a live database with no pinned
      release, so the census is a snapshot that cannot be reproduced exactly
      later. Variant class was inferred from ClinVar text fields, which the
      report states as a limitation.
  - data_source_id: ensembl-adnp
    source_type: API
    name: Ensembl record for the MANE ADNP transcript
    identifier: "ensembl:ENST00000621696"
    version: Ensembl 2026-09
    uri: https://rest.ensembl.org
    retrieved_at: "2026-09-07T00:00:00Z"
    access_status: ACCESSED
    query: exon and CDS coordinates for ENST00000621696, chromosome 20 minus strand
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_summary_stats.json
    notes: >-
      No response snapshot was delivered; the only committed record is the
      analysis summary, which carries the transcript identifier, strand and last
      coding exon coordinates it derived. Supplies the exon mapping the decay
      prediction depends on. The last coding
      exon carries about 94 percent of the coding sequence, which is why decay
      escape is the structural default for nearly any premature stop in this gene.
  - data_source_id: gnomad-adnp
    source_type: API
    name: gnomAD gene constraint for ADNP
    identifier: "gnomad:ADNP"
    version: gnomAD v2.1.1 constraint
    uri: https://gnomad.broadinstitute.org/api
    retrieved_at: "2026-09-07T00:00:00Z"
    access_status: ACCESSED
    query: 'gene(gene_symbol:"ADNP") constraint fields'
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_gnomad_adnp_constraint.json
    notes: >-
      Relevant to the dosage baseline: pLI 1.0 and LOEUF 0.11. Note the version
      is v2.1.1 while the sibling runs used v4, so constraint values across these
      assessments are not drawn from a common release.
  - data_source_id: clingen-adnp
    source_type: DATABASE
    name: ClinGen dosage sensitivity and gene-disease validity for ADNP
    identifier: "hgnc:15766"
    uri: https://search.clinicalgenome.org/kb/genes/HGNC:15766
    retrieved_at: "2026-09-07T00:00:00Z"
    access_status: UNVERIFIABLE
    notes: >-
      A reported failure rather than an omission: the gene page returned HTTP 200
      as a client-rendered shell while the JSON endpoints returned 404, so the
      machine-readable dosage and validity records were not retrieved. The report
      records this as partial or failed and flags it as a curator lead, which is
      the correct disposition and better practice than the sibling runs, which
      simply did not query.
  - data_source_id: pubmed-adnp
    source_type: DATABASE
    name: PubMed retrieval for ADNP truncation, NMD escape and mutant protein
    uri: https://pubmed.ncbi.nlm.nih.gov/
    retrieved_at: "2026-09-07T00:00:00Z"
    access_status: UNVERIFIABLE
    query: 12 short queries, of which 4 over-specified queries returned no hits
    notes: >-
      Recorded as UNVERIFIABLE rather than ACCESSED because no search log was
      delivered, although the report states one is in the bundle. The retrieval
      evidently happened, since it produced the protein-detection study that is
      the substantive finding of the screen, and the promoted claims from it were
      verified independently against the fetched record. But the queries
      themselves cannot be checked, so the four reported zero-hit searches are
      not auditable and this run's negative results carry less weight than the
      Arboleda-Tham run's, which committed its logs.
analyses:
  - analysis_id: adnp-clinvar-nmd-mapping
    method: >-
      Classify 303 ClinVar pathogenic and likely-pathogenic ADNP variants by
      molecular consequence, map genomic positions to exons on the MANE
      transcript, and predict decay escape for premature stops in the last coding
      exon or within 55 nucleotides of the last junction.
    comparison: Decay-escaping truncating alleles against decay-sensitive early truncating alleles.
    input_data_source_ids:
      - clinvar-adnp
      - ensembl-adnp
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    software:
      - software_name: Python
        software_version: "3.12"
      - software_name: pandas
        software_version: "3.0.3"
      - software_name: numpy
        software_version: "2.3.5"
      - software_name: requests
        software_version: "2.34.2"
    parameters:
      - "NMD escape rule: PTC in last coding exon or within 55 nt upstream of the last exon-exon junction"
      - "no random seed; deterministic given the database snapshot"
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_summary_stats.json
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_class_counts.csv
      - ../openscientist_artifacts/kb_hypotheses_ADNP-Related_Syndrome_nmd_escape_truncation_branch_openscientist_artifacts_tables_nmd_sensitive_early_variants.csv
    status_reason: >-
      The outputs are committed, and recomputing the class arithmetic from the
      committed tables reproduces the report's headline figures exactly. The
      software environment is reported to package-version precision, which no
      sibling run matched. PARTIAL rather than SUCCEEDED because the analysis
      script the report names was not delivered, so the step from ClinVar to the
      tables is attested only by the provider, and because the source is an
      unpinned live database.
    limitations: >-
      Decay escape is predicted from transcript architecture, not measured, and
      the report says so. Variant class was inferred from ClinVar text fields,
      and ClinVar submission bias applies. A figure was generated but exists only
      in the executor sandbox, which the report discloses rather than listing it
      as delivered.
claims:
  - claim_id: nmd-escape-premise-confirmed
    statement: >-
      Most pathogenic truncating ADNP alleles lie in the last coding exon and are
      predicted to escape nonsense-mediated decay, and mutant ADNP mRNA has been
      directly detected in patient blood.
    disposition: RETAINED
    report_quote: >-
      **Established / strongly supported.**
    rationale: >-
      Two independent supports, one computed and one experimental, and only the
      experimental one was promoted. The census is a live-database snapshot from
      a partially auditable analysis, so it is recorded here rather than curated
      as evidence. The mRNA detection in patient blood was verified against the
      fetched record and promoted, because it establishes the branch's premise in
      patient material rather than by prediction.
    citations:
      - PMID:38926592
  - claim_id: mutant-protein-not-detected
    statement: >-
      Systematic western assessment of patient-derived materials with multiple
      antibodies found no detectable mutant ADNP protein, which the authors read
      as degradation or absence of a mutant protein.
    disposition: RETAINED
    report_quote: >-
      Mutant ADNP protein has never been unambiguously demonstrated in patient tissue
    rationale: >-
      The substantive finding of the screen and the reason this assessment is
      weakly-supported rather than partially-supported. The entry described the
      mutant protein as never unambiguously demonstrated, which reads as nobody
      having looked; the study the run surfaced looked systematically and found
      nothing, concluding degradation or absence. That is a stronger claim and it
      cuts against the hypothesis. Verified against the fetched record and
      promoted as a REFUTE item. It does not close the question: absence of a
      western signal in the materials and antibodies tested is not proof that no
      mutant protein exists in any relevant tissue, and the same paper's difficulty
      obtaining specific signal even for wild-type protein is a real caveat, which
      the promoted evidence records.
    citations:
      - PMID:38926592
  - claim_id: balance-favours-insufficiency
    statement: >-
      Current model and in vitro evidence leans toward functional insufficiency,
      with any gain-of-function or dominant-negative contribution unproven at the
      endogenous patient-protein level.
    disposition: RETAINED
    report_quote: >-
      the balance of current evidence modestly favors haploinsufficiency/insufficiency as the dominant driver
    rationale: >-
      Consistent with the evidence assembled, and it is hedged appropriately
      rather than asserted. This is the third of five screens to reach the same
      shape independently, after ASXL3 and KAT6A, which makes the pattern worth
      recording across the entries even though no single run establishes it. It
      does not move the category, because none of the cited evidence measures what
      the retained protein does when present.
    citations:
      - PMID:42208149
      - PMID:38424297
  - claim_id: durable-open-question
    statement: >-
      The ambiguity about the mutant protein's consequence is a long-standing open
      question rather than a recent one.
    disposition: RETAINED
    report_quote: >-
      The ambiguity is a durable, decade-old open question
    rationale: >-
      Accurate and useful context for curation: a question open since the gene's
      first description is unlikely to be closed by further literature search,
      which is an argument for the discussion's proposed experiment rather than
      for another screen.
  - claim_id: bundle-manifest-and-code
    statement: >-
      A canonical manifest with checksums and replay notes, and the analysis
      script, accompany the artifact bundle.
    disposition: REJECTED
    report_quote: >-
      Artifact bundle root: `kb/hypotheses/ADNP-Related_Syndrome/nmd_escape_truncation_branch/openscientist_artifacts/`
      (MANIFEST.yaml, code/, tables/, logs/, environment/).
    rationale: >-
      Neither is in the delivered bundle, the same omission as all four sibling
      runs. The report is at least candid that input checksums were not computed
      because hashing was blocked in the sandbox, arguing the inputs are
      regenerable from the pinned queries instead; that argument is weakened by
      the ClinVar source being an unpinned live database. It is worth separating from the report's provenance reporting, which
      is the best of the series: the environment is named to package-version
      precision, a ClinGen API failure is reported rather than hidden, and a
      sandbox-only figure is disclosed rather than claimed. The bundling defect
      and the honesty of the narrative are independent.

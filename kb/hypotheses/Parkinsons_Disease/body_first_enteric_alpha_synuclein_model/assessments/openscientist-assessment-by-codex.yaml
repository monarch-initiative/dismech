schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: body_first_enteric_alpha_synuclein_model
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is a useful, unusually broad synthesis and correctly limits the
  body-first model to a proposed Parkinson disease subtype. Artificial-seeding
  animal models directly show that enteric alpha-synuclein can reach the brain
  through an intact vagus, and proxy-defined human cohorts show compatible
  autonomic, imaging, and cutaneous patterns. Those findings support
  plausibility and some central edges, but they do not demonstrate spontaneous
  enteric initiation or gut-to-brain propagation in a living human. The report
  overstates the vagotomy cohorts, the number of independent route-blockade
  models, the precision of a 20-30% subtype estimate, and what failed
  immunotherapy trials imply about intervention timing.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: subtype-level-support
    statement: >-
      Human and experimental evidence supports a body-first-compatible
      Parkinson disease subtype, but not a proven enteric origin in humans.
    disposition: QUALIFIED
    report_quote: >-
      one well-supported origin-site pathway within the multi-origin Synuclein
      Origin and Connectome (SOC) framework.
    rationale: >-
      PMID:32830221, PMID:34334424, and PMID:41105632 distinguish groups defined
      largely by premotor RBD and autonomic markers, but the studies are
      cross-sectional and the subtype labels encode the hypothesis being
      tested. They support compatible phenotypic topography, not direct
      observation of the first pathological site or direction of spread.
    citations:
      - PMID:32830221
      - PMID:34334424
      - PMID:41105632
  - claim_id: subtype-prevalence
    statement: The body-first pathway accounts for 20-30% of Parkinson disease.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      applicable to an estimated 20–30% of Parkinson's disease (PD) cases.
    rationale: >-
      The report later says this estimate is derived from RBD prevalence, but
      RBD is an imperfect proxy whose ascertainment and timing vary, and it is
      not equivalent to demonstrated peripheral initiation. No directly
      validated origin-site prevalence study is cited for this numerical range.
  - claim_id: experimental-vagal-route
    statement: >-
      Enteric alpha-synuclein seeds can produce vagus-dependent ascending
      pathology in engineered mouse models.
    disposition: QUALIFIED
    report_quote: >-
      The strongest direct evidence comes from mouse gut-to-brain α-synuclein
      transmission experiments demonstrating that both truncal vagotomy and
      α-synuclein deficiency block enteric-to-central propagation (3
      independent studies)
    rationale: >-
      PMID:31255487 and PMID:39241780 directly support route dependence after
      experimental induction, but the report identifies two, not three,
      independent vagotomy-plus-deficiency studies. Both use imposed seeds or
      transgenic induction, so they establish anatomical possibility rather
      than spontaneous human enteric initiation.
    citations:
      - PMID:31255487
      - PMID:39241780
  - claim_id: vagotomy-epidemiology
    statement: Truncal vagotomy is associated with reduced subsequent Parkinson disease risk.
    disposition: QUALIFIED
    report_quote: >-
      corroborated by human epidemiological data showing truncal vagotomy
      reduces PD risk (HR 0.53–0.59 with long follow-up).
    rationale: >-
      The quoted hazard ratios are long-latency subgroup estimates.
      PMID:26031848 found a nonsignificant overall adjusted HR of 0.85 and
      explicitly noted limited precision; PMID:28446653 found no association
      for vagotomy overall and called the truncal result suggestive. Residual
      confounding, historical indication, small truncal groups, and subgroup
      analysis prevent treating these observational studies as corroboration of
      enteric alpha-synuclein propagation.
    citations:
      - PMID:26031848
      - PMID:28446653
  - claim_id: clinical-imaging-signature
    statement: >-
      RBD-positive and autonomic-predominant Parkinson disease groups show
      patterns predicted by the body-first model.
    disposition: QUALIFIED
    report_quote: >-
      These convergent clinical findings strongly validate the SOC model's
      prediction that body-first and brain-first PD represent biologically
      distinct subtypes with different prodromal trajectories.
    rationale: >-
      More symmetric dopaminergic loss and greater peripheral pathology are
      replicated, useful observations. However, most cohorts classify subtype
      using RBD or autonomic features and then test correlated features, and
      none measures origin or longitudinal propagation directly. "Consistent
      with" is supported; "strongly validate" is too causal.
    citations:
      - PMID:32830221
      - PMID:34334424
      - PMID:41105632
  - claim_id: lrrk2-gut-interaction
    statement: >-
      Gut inflammation can interact with LRRK2 G2019S to produce enteric and
      central Parkinson-like endophenotypes in mice.
    disposition: QUALIFIED
    report_quote: >-
      they provide a concrete gene–environment interaction mechanism whereby
      genetically susceptible individuals could develop body-first PD through
      gut inflammatory triggers
    rationale: >-
      PMID:38750146, PMID:42295088, and PMID:42327194 support a concrete
      interaction in LRRK2 G2019S mouse models. They do not show that the same
      sequence causes disease in human carriers, that it is body-first by
      multimodal criteria, or that it generalizes to sporadic Parkinson
      disease.
    citations:
      - PMID:38750146
      - PMID:42295088
      - PMID:42327194
  - claim_id: enteric-ihc-specificity
    statement: Conventional enteric alpha-synuclein immunohistochemistry is not a specific diagnostic test.
    disposition: RETAINED
    report_quote: >-
      Enteric α-Synuclein Immunohistochemistry Lacks Diagnostic Specificity
    rationale: >-
      PMID:27044604 found positive staining in most control slides and no
      tested method or pattern with both sensitivity and specificity above
      80%. This is a valid and important limitation, though it addresses the
      assay rather than disproving all enteric pathology.
    citations:
      - PMID:27044604
  - claim_id: microbiome-causality
    statement: >-
      Microbiome manipulation has inconsistent clinical effects and does not
      establish dysbiosis as the initiating cause of body-first Parkinson
      disease.
    disposition: RETAINED
    report_quote: >-
      These results suggest the microbiome may modulate but does not clearly
      modify disease trajectory, consistent with a role as a
      contributor/modifier rather than a sufficient cause.
    rationale: >-
      The positive phase 2 trial in PMID:41826284 and the null primary motor
      outcome in PMID:41674471 justify restraint. Symptomatic response,
      microbiome change, and correlation with colonic staining do not identify
      the first alpha-synuclein site or prove prevention of neurodegeneration.
    citations:
      - PMID:41826284
      - PMID:41674471
  - claim_id: immunotherapy-timing-inference
    statement: >-
      Failure of anti-alpha-synuclein antibodies in established Parkinson
      disease proves that treatment must occur during a peripheral prodrome.
    disposition: REJECTED
    report_quote: >-
      supporting the model's implication that intervention must occur during
      the peripheral/prodromal phase to be effective.
    rationale: >-
      PMID:41702332 is a narrative review of trials that were not designed to
      compare origin-site subtypes or peripheral versus central timing. Limited
      CNS exposure, target engagement, agent properties, outcomes, and disease
      heterogeneity provide alternative explanations. The failures do not test,
      and therefore cannot support, the asserted "must occur" timing claim.
    citations:
      - PMID:41702332
  - claim_id: direct-human-gap
    statement: Direct human evidence of gut-to-brain alpha-synuclein propagation is absent.
    disposition: RETAINED
    report_quote: >-
      No study has directly demonstrated α-synuclein propagating from gut to
      brain in a living human; all evidence is inferential.
    rationale: >-
      This is the decisive calibration for the overall verdict. Human
      pathology, imaging, prodromal symptoms, and vagotomy associations remain
      indirect with respect to the literal initiation-and-propagation claim.

claims:
  - claim_id: C001
    statement: >-
      Multiple PD genes functionally converge on clathrin-mediated endocytosis
      and synaptic-vesicle recycling, supported beyond the ITSN1 paper by
      independent model-system and genetic evidence.
    disposition: RETAINED
    report_quote: >-
      converge on pathways involved in clathrin-mediated endocytosis and
      synaptic vesicle recycling.
    rationale: >-
      Supported by independent lines verified against their abstracts: SYNJ1
      clathrin-uncoating (PMID:28231468), DNAJC6/auxilin (PMID:22563501,
      PMID:36920906), LRRK2/endophilin (PMID:27720484). This answers the seed
      question - the convergence does not rest on the ITSN1 paper alone.
    citations:
      - PMID:28231468
      - PMID:22563501
      - PMID:36920906
      - PMID:27720484
  - claim_id: C002
    statement: >-
      ITSN1 protein-truncating variants confer large, replicated PD risk.
    disposition: RETAINED
    report_quote: >-
      ITSN1 protein-truncating variants at a large effect size (OR = 10.5;
      combined p = 4.5×10⁻¹²)
    rationale: >-
      The anchoring human genetics, verified against PMID:40056900 (already
      curated as the ITSN1 risk-gene evidence on this entry).
    citations:
      - PMID:40056900
  - claim_id: C003
    statement: >-
      The convergence is functional, not genetic-architectural: common-variant
      signal at SH3GL2/LRRK2 but rare/monogenic-only for SYNJ1, DNAJC6, ITSN1
      and VPS35.
    disposition: RETAINED
    report_quote: >-
      common-variant signal at SH3GL2/LRRK2 but rare/monogenic-only for SYNJ1,
      DNAJC6, ITSN1, VPS35
    rationale: >-
      Backed by the committed genetic-evidence table (Open Targets scores +
      GWAS Catalog v2 counts): SH3GL2 and LRRK2 carry genome-wide signal, the
      others do not. A genuine qualification of the word "convergence" that the
      seed did not state. Not attached to the analysis id because that analysis
      is PARTIALLY_AUDITABLE; it stands on the committed table.
    citations: []
  - claim_id: C004
    statement: >-
      gnomAD constraint separates dominant-LoF convergence genes (ITSN1, DNAJC6,
      VPS35) from LoF-tolerant ones, consistent with ITSN1 acting by
      haploinsufficiency.
    disposition: RETAINED
    report_quote: >-
      gnomAD constraint distinguishes dominant-LoF from recessive genes within
      the convergence set
    rationale: >-
      The committed gnomAD table shows ITSN1 pLI 1.0 / LOEUF 0.30, matching the
      dominant protein-truncating-variant burden reported for it. Consistent,
      data-backed, and it refines the mechanism rather than just asserting it.
    citations: []
  - claim_id: C005
    statement: >-
      ITSN1's PD effect may not be PD-specific, because ITSN1 variants also
      cause autism, intellectual disability and epilepsy.
    disposition: QUALIFIED
    report_quote: >-
      Raises PD-specificity question for ITSN1
    rationale: >-
      A fair open question, verified against PMID:34707297 (ITSN1 in
      neurodevelopmental disorder). It does not weaken the convergence claim but
      it does bound how PD-specific the ITSN1 locus is; left as a knowledge gap.
    citations:
      - PMID:34707297
  - claim_id: C006
    statement: >-
      Whether the endocytic defect is upstream or downstream of alpha-synuclein
      is unresolved; they form a bidirectional loop.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      bidirectional feedback loop rather than a clean upstream→downstream axis
    rationale: >-
      Correctly flagged. This is why the Synaptic Dysfunction node is not wired
      as strictly upstream of alpha-synuclein aggregation in the entry; the
      ordering is a genuine open question, not a curation omission.
    citations: []

hypothesis_id: synaptic_vesicle_endocytosis_convergence
assessed_at: "2026-10-18T06:20:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  This run did real data retrieval and answers the question the hypothesis was
  seeded to ask: is the vesicle-endocytosis convergence supported beyond the
  single ITSN1 discovery paper? Yes. It queried Open Targets, the GWAS Catalog
  v2 and gnomAD, committed the per-gene genetic-evidence table, the gnomAD
  constraint table and an execution log recording which API calls succeeded or
  failed, and it assembled independent model-system evidence for SYNJ1, DNAJC6,
  LRRK2 and parkin-SYNJ1-endophilin all acting on clathrin-mediated endocytosis
  and synaptic-vesicle recycling. The important nuance it adds is that the
  convergence is functional, not genetic-architectural: SH3GL2 and LRRK2 carry
  genome-wide common-variant signal while SYNJ1, DNAJC6, VPS35 and ITSN1 are
  rare/monogenic only, and gnomAD constraint separates the dominant-LoF genes
  (ITSN1, DNAJC6, VPS35 haploinsufficient) from the LoF-tolerant ones. Two real
  limits: alpha-synuclein sits in a bidirectional loop with the endocytic
  machinery so upstream/downstream ordering is unresolved, and ITSN1 variants
  also cause autism/ID/epilepsy, so PD-specificity is open. Keep EMERGING.
  Records the assessment only; does not change the hypothesis status.

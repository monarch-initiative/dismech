assessor: codex
source_report: ../openscientist.md
hypothesis_id: brain_first_central_alpha_synuclein_model
assessed_at: "2026-07-31T02:53:05Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report identifies credible brain-first-compatible imaging,
  neuropathological, and artificial-seeding patterns, and it correctly preserves
  the absence of longitudinal human propagation evidence. Its central mechanism
  remains only partially supported: cross-sectional proxy-defined cohorts do
  not establish temporal order, post-mortem progression modeling infers earliest
  sampled involvement rather than a causal origin, and olfactory-bulb injection
  models establish anatomical possibility after an imposed seed. The report
  also misstates a five-SNP association study as broad pathway enrichment and
  uses preprint progression metrics that changed in the final publication.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: subtype-level-support
    statement: >-
      Human cohorts contain reproducible brain-first-compatible patterns, but
      central initiation and centrifugal spread have not been demonstrated.
    disposition: QUALIFIED
    report_quote: >-
      the brain-first model captures a real biological phenomenon in a subset
      of PD patients
    rationale: >-
      Asymmetric dopaminergic loss, relative preservation of early autonomic
      markers, and amygdala findings support a useful phenotype. The studies
      define groups using RBD and other model-linked proxies and do not observe
      the first alpha-synuclein seed or its direction of travel. The
      "phenomenon" should be limited to a compatible pattern, not a proven
      origin route.
    citations:
      - PMID:32830221
      - PMID:34334424
      - PMID:40209563
  - claim_id: imaging-temporal-order
    statement: >-
      RBD-negative de novo Parkinson disease has imaging patterns compatible
      with central dysfunction preceding peripheral autonomic dysfunction.
    disposition: QUALIFIED
    report_quote: >-
      establishing the temporal ordering of central-before-peripheral
      dysfunction.
    rationale: >-
      PMID:32830221 was a cross-sectional case-control study with 37 de novo
      Parkinson disease patients and 22 iRBD comparators. Its abstract says the
      data were "compatible with" the proposed trajectories. Between-group
      marker differences cannot establish within-person temporal ordering or
      alpha-synuclein propagation.
    citations:
      - PMID:32830221
  - claim_id: olfactory-first-modeling
    statement: >-
      Post-mortem progression modeling infers an olfactory-early trajectory in
      most sampled Lewy body disease donors.
    disposition: QUALIFIED
    report_quote: >-
      perhaps the most direct support for the brain-first model, demonstrating
      that olfactory-initiated pathology is the predominant trajectory in Lewy
      body disease
    rationale: >-
      PMID:38879548 did infer earliest olfactory-bulb involvement in 81.9% of
      814 donors with Lewy pathology. The cohort spans Lewy body disorders,
      including an olfactory/limbic group associated with Alzheimer
      characteristics, and SuStaIn reconstructs trajectories from regional
      post-mortem burden. "Olfactory-early inferred trajectory" is supported;
      literal initiation, propagation direction, and Parkinson-disease
      predominance are not directly demonstrated.
    citations:
      - PMID:38879548
  - claim_id: olfactory-seeding-models
    statement: >-
      An imposed olfactory-bulb alpha-synuclein seed can spread through
      connected central regions in mice and marmosets.
    disposition: QUALIFIED
    report_quote: >-
      These studies confirm the anatomical plausibility of
      olfactory-to-limbic-to-brainstem spread
    rationale: >-
      PMID:35989519 and PMID:33547846 support anatomical plausibility after
      direct preformed-fibril inoculation. They do not show spontaneous
      olfactory initiation; the mouse model required human SNCA overexpression
      for broader pathology and did not develop motor dysfunction.
    citations:
      - PMID:35989519
      - PMID:33547846
  - claim_id: genetic-pathway-enrichment
    statement: >-
      Brain-first and body-first groups show broad synaptic/immune versus
      lysosomal/autophagy pathway enrichment.
    disposition: REJECTED
    report_quote: >-
      body-first cases were enriched for lysosomal/autophagy genetic pathways
      while brain-first cases were enriched for synaptic/immune pathways.
    rationale: >-
      PMID:40542411 tested 123 previously associated SNPs and reported five
      subtype-associated loci after correction (TRIM40 and GBF1 with higher
      brain-first risk; IP6K2, RIT2, and CTSB with lower brain-first risk), plus
      selected genotype-outcome associations. It did not report the broad,
      opposing pathway-enrichment result stated by the report. Functional
      discussion of individual genes does not license that summary.
    citations:
      - PMID:40542411
  - claim_id: rbd-proxy-variability
    statement: RBD alone is an unstable proxy for anatomical origin and requires standardized ascertainment.
    disposition: QUALIFIED
    report_quote: >-
      This 3.5-fold range in RBD prevalence fundamentally undermines the
      reliability of body-first proportion estimates and, by extension,
      brain-first classification accuracy.
    rationale: >-
      PMID:41714532 and PMID:29084403 report 17.8% and 62.5% RBD prevalence in
      different PD cohorts, supporting heterogeneity and caution. The studies
      differ in population, objectives, and implementation; their contrast does
      not isolate ascertainment method or directly measure origin-label
      accuracy. "Limits an RBD-only proxy" is supported; "fundamentally
      undermines classification accuracy" is stronger than the comparison
      establishes.
    citations:
      - PMID:41714532
      - PMID:29084403
  - claim_id: data-driven-prognosis
    statement: >-
      Data-driven subtyping may enrich rapid progressors more efficiently than
      origin-proxy subtyping without testing the anatomical-origin mechanism.
    disposition: QUALIFIED
    report_quote: >-
      suggesting data-driven subtyping has greater practical utility for
      clinical trial design.
    rationale: >-
      The cited PMID:40678221 was a preprint record. Its final publication,
      PMID:42286020, retained the trial-enrichment conclusion but changed the
      milestone proportions from 50%, 43%, and 42% to 63.0%, 55.6%, and 54.0%.
      This comparison addresses prognostic enrichment, not whether central or
      peripheral initiation occurs, so it is not mechanistic counterevidence.
    citations:
      - PMID:40678221
      - PMID:42286020
  - claim_id: structural-mri-null
    statement: A large structural MRI analysis failed to reproduce predicted subtype differences.
    disposition: RETAINED
    report_quote: >-
      This negative finding from a large cohort directly challenges one
      prediction of the brain-first model.
    rationale: >-
      PMID:35943058 found no association between putaminal DaT asymmetry and
      gray-matter volume or asymmetry, and no significant gray-matter
      difference between RBD-negative and RBD-positive groups. The authors
      correctly state that this fails to support, but does not disprove, the
      spreading hypothesis.
    citations:
      - PMID:35943058
  - claim_id: framework-integration
    statement: >-
      Omission of origin-site labels from biological staging frameworks is an
      implementation gap, not evidence against the hypothesis.
    disposition: QUALIFIED
    report_quote: >-
      Neither framework incorporates brain-first versus body-first origin site,
      creating a conceptual gap that must be bridged for the model to achieve
      clinical integration.
    rationale: >-
      PMID:38267190 and PMID:39973492 confirm that NSD-ISS and SynNeurGe focus
      on alpha-synuclein, neurodegeneration, genetics, and functional stage
      rather than inferred origin. That affects current clinical integration,
      but framework scope is not an empirical test and should not count among
      the scientific qualifications that determine the mechanism verdict.
    citations:
      - PMID:38267190
      - PMID:39973492
  - claim_id: direct-human-gap
    statement: Direct longitudinal human evidence for central-to-peripheral alpha-synuclein spread is absent.
    disposition: RETAINED
    report_quote: >-
      no prospective longitudinal human study has directly tracked
      α-synuclein pathology from a CNS origin site to peripheral structures in
      living patients.
    rationale: >-
      This correctly identifies the decisive unresolved edge. Current imaging
      markers measure neuronal dysfunction, post-mortem models infer ordering,
      and experimental inoculation establishes possibility; none directly
      observes spontaneous human initiation and centrifugal propagation.
  - claim_id: dominant-younger-subtype
    statement: Brain-first Parkinson disease is the dominant subtype and begins substantially earlier.
    disposition: NEEDS_VERIFICATION
    report_quote: Brain-First PD May Be the Dominant Subtype with Younger Onset
    rationale: >-
      A single Indian cohort with a low proxy-defined body-first fraction and a
      review proposing an onset difference do not establish population-wide
      dominance or a stable ten-year onset gap. The mixed Lewy body donor
      trajectories in PMID:38879548 likewise cannot supply a Parkinson-specific
      prevalence estimate.
    citations:
      - PMID:38879548
      - PMID:40796681
      - PMID:41195692

hypothesis_id: pphp_parent_of_origin_model
assessed_at: "2026-07-31T04:15:41Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The canonical parent-of-origin mechanism is well supported: paternal coding
  GNAS loss usually preserves renal PTH responsiveness while reducing Gs-alpha
  dosage in biallelic tissues. The report nevertheless turns a strong
  probabilistic model into several absolutes. It omits a directly relevant
  paternal-mutation case with PTH and possible GHRH resistance, places an
  STX16-imprinting-control experiment for PHP1B inside the PPHP causal chain,
  overstates complete-knockout skeletal experiments as direct heterozygous
  evidence, and treats mixed-function GNAS variants as counterexamples to a
  hypothesis explicitly restricted to loss of function. Its ontology leads
  also mislabel a hypertrophic chondrocyte term and recommend an obsolete cAMP
  process.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-parent-of-origin-model
    statement: >-
      Paternal coding loss of GNAS is a well-established cause of the classical
      PPHP phenotype, but the report needs narrower wording around exceptions
      and direct human evidence.
    disposition: QUALIFIED
    report_quote: >-
      **Verdict: SUPPORTED — Canonical status confirmed.**
    rationale: >-
      Parent-of-origin mouse models, human segregation, and tissue-specific
      allelic-expression studies strongly support the core model. "Canonical"
      should not be read as exception-free: the relevant human literature
      includes paternal variants with biochemical hormone resistance, and
      several downstream tissue mechanisms remain model-organism inferences.
    citations:
      - PMID:9671744
      - PMID:16099856
      - PMID:25802881
      - PMID:25464124
  - claim_id: renal-imprinting-mouse-evidence
    statement: >-
      Maternal, but not paternal, Gnas disruption reduces renal-cortical
      Gs-alpha and causes PTH resistance in the foundational mouse model.
    disposition: RETAINED
    report_quote: >-
      PTH resistance is present in maternal-inheritance knockout mice (m−/+)
      but not in paternal-inheritance knockout mice (+/p−).
    rationale: >-
      The cited experiment directly measured the parent-of-origin phenotype and
      renal-cortical expression. It is strong model-organism support for the
      renal arm of the hypothesis, while translation to every human carrier
      should remain qualified.
    citations:
      - PMID:9671744
      - PMID:16099856
  - claim_id: absolute-absence-of-hormone-resistance
    statement: >-
      Classical PPHP usually lacks renal PTH resistance, but paternal coding
      variants do not guarantee complete absence of hormone resistance.
    disposition: QUALIFIED
    report_quote: >-
      This tissue-specific imprinting pattern explains the clinical divergence
      between PHP1A (maternal inheritance → AHO plus hormone resistance) and
      PPHP (paternal inheritance → AHO alone without hormone resistance).
    rationale: >-
      This is the classical distinction and is well supported at population
      level. The report omits a directly relevant patient with a proven
      paternal GNAS p.A109P variant, repeated PTH elevation, and a blunted
      growth-hormone stimulation response. It mentions a separate POH-overlap
      case with adolescent PTH/TSH resistance but still encodes "NO hormone
      resistance" as a strong causal link and negative curation edge. Those
      exceptions require "usually spares classic renal PTH resistance," not an
      absolute exclusion.
    citations:
      - PMID:25464124
      - PMID:34254228
      - PMID:29959430
  - claim_id: stx16-in-pphp-causal-chain
    statement: >-
      STX16-ICR biology is relevant background on GNAS imprinting but is not a
      disease-causing upstream step for PPHP due to an intact paternal coding
      loss-of-function allele.
    disposition: REJECTED
    report_quote: >-
      This fills a key gap in the causal chain by explaining how tissue-specific
      imprinting is established developmentally.
    rationale: >-
      The cited human-embryonic-stem-cell study explains allele-specific
      pathogenicity of STX16-ICR microdeletions, which cause PHP1B after
      maternal inheritance. A patient with a paternal GNAS coding variant does
      not acquire that variant through an STX16 deletion, and the experiment
      did not establish the renal imprinting pattern in PPHP patient tissue.
      It can contextualize the locus but should not be promoted as a
      PPHP-specific causal-chain node.
    citations:
      - PMID:39910084
  - claim_id: chondrocyte-to-brachydactyly-directness
    statement: >-
      Gs-alpha is a key PTHrP-pathway mediator in growth plate chondrocytes, but
      the cited deletion evidence does not by itself directly reproduce
      heterozygous human PPHP brachydactyly.
    disposition: QUALIFIED
    report_quote: >-
      This provides the direct mechanistic link from Gsα haploinsufficiency to
      the most specific AHO feature.
    rationale: >-
      The 2005 conditional study used complete chondrocyte-specific deficiency;
      its heterozygotes explicitly had no phenotype. A separate chimera study
      found approximately half-normal Gs-alpha RNA and modestly premature
      hypertrophy in heterozygous cells, which is the more dosage-relevant
      support. Neither experiment explains digit selectivity or directly tests
      human PPHP cartilage, so "directly explaining brachydactyly" is too
      strong.
    citations:
      - PMID:15765186
      - PMID:15459318
  - claim_id: xlas-double-hit
    statement: >-
      Loss of XL-alpha-s is a plausible modifier for variants in shared exons,
      but its contribution to human PPHP is not isolated quantitatively.
    disposition: QUALIFIED
    report_quote: >-
      This creates a mechanistic distinction within paternal GNAS mutations:
      exon 2–13 mutations produce a "double hit" (Gsα haploinsufficiency in
      biallelic tissues + complete XLαs loss in paternal tissues), while exon 1
      mutations produce only Gsα haploinsufficiency.
    rationale: >-
      The molecular transcript consequence is correct, and an engineered mouse
      allele supports XL-alpha-s effects on growth, fat, leptin, and bone.
      Lower birth weight with human exon 2–13 variants is compatible with a
      modifier effect, but mutation-class confounding and the absence of an
      XL-alpha-s-specific human rescue or comparison prevent assigning the
      additional phenotype to XL-alpha-s alone.
    citations:
      - PMID:22215617
      - PMID:25952723
  - claim_id: mixed-function-variants-scope
    statement: >-
      Receptor-specific mixed gain- and loss-of-function variants broaden GNAS
      disease, but they do not refute a model expressly limited to coding
      loss-of-function variants.
    disposition: QUALIFIED
    report_quote: >-
      These findings qualify the hypothesis by demonstrating that the simple
      LOF classification does not capture all paternal GNAS variant effects
    rationale: >-
      The cited variants have ligand-independent gain of function at AVPR2 or
      PTH1R and ligand-dependent loss of function in other contexts. Their
      non-classical NSIAD and bone phenotypes are real, but the seed hypothesis
      says "loss-of-function variants." They are differential-diagnosis and
      variant-interpretation cautions rather than exceptions to the classical
      paternal loss-of-function mechanism.
    citations:
      - PMID:30312418
      - PMID:40172207
      - PMID:41530545
  - claim_id: obesity-sparing
    statement: >-
      Parent-of-origin Gs-alpha signaling in the DMH helps explain why marked
      early-onset obesity is associated with maternal rather than paternal
      variants, but it does not prove universal leanness in PPHP.
    disposition: QUALIFIED
    report_quote: >-
      This directly explains why obesity is a feature of PHP1A (maternal
      mutations) but typically not PPHP (paternal mutations), extending the
      imprinting model from endocrine to metabolic phenotypes.
    rationale: >-
      The parent-specific DMH deletion experiment strongly supports a mechanism
      for the group-level difference. It is a mouse experiment, however, and a
      67-person AHO cohort described PPHP as lacking marked obesity rather than
      establishing that every patient is lean. The report's "typically not"
      wording is defensible; its diagrammatic "NO obesity" should not be carried
      forward as an invariant negative edge.
    citations:
      - PMID:27991864
      - PMID:29059381
      - PMID:29959430
  - claim_id: ontology-leads
    statement: >-
      Two ontology leads are invalid as labeled and should not be promoted.
    disposition: REJECTED
    report_quote: >-
      Renal proximal tubule cell (CL:1000838); Growth plate chondrocyte
      (CL:0000743); Mesenchymal stem cell (CL:0000134); Dorsomedial
      hypothalamic neuron; Osteoblast (CL:0000062)
    rationale: >-
      CL:1000838 is specifically "kidney proximal convoluted tubule epithelial
      cell," not a generic renal-proximal-tubule class. CL:0000743 is
      "hypertrophic chondrocyte," not "growth plate chondrocyte." In the
      accompanying process list, GO:0019933 is obsolete
      "cAMP-mediated signaling"; the current specific term is GO:0141156
      "cAMP/PKA signal transduction." GO:0007224 currently labels the
      smoothened signaling pathway, so it should not be asserted as a verbatim
      "Hedgehog signaling pathway" label without explanation.
  - claim_id: cohort-characterization
    statement: >-
      The cited cohorts are useful but do not constitute large prospective,
      PPHP-specific mechanistic confirmation.
    disposition: QUALIFIED
    report_quote: >-
      large clinical cohorts confirming genotype-phenotype correlations
    rationale: >-
      The 88-patient mutation cohort combined PHP1A and PPHP and established a
      truncating-versus-missense association with subcutaneous calcification.
      The 95-proband study combined iPPSD2 phenotypes and focused on de novo
      variants and parental mosaicism, not PPHP natural history. The report
      later recognizes this limitation, but the executive wording overstates
      what those cohorts directly confirmed for PPHP.
    citations:
      - PMID:25802881
      - PMID:36686455
  - claim_id: search-provenance
    statement: >-
      The claimed literature corpus cannot be reproduced from the delivered
      artifacts.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Papers Reviewed:** 54 | **Confirmed Findings:** 9 | **Iterations:** 2
    rationale: >-
      The citation sidecar lists 30 PMIDs and the report supplies no complete
      54-record bibliography, search strings, dates, screening log, or
      inclusion decisions. The report also missed PMID:25464124, a directly
      relevant paternal-variant hormone-resistance case. The numerical total
      should be treated as provider metadata rather than verified systematic
      coverage.
    citations:
      - PMID:25464124

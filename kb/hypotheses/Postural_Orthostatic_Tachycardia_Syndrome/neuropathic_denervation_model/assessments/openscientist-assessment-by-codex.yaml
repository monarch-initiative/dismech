hypothesis_id: neuropathic_denervation_model
assessed_at: "2026-07-31T02:53:08Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The subtype-restricted model is partially supported: small physiologic
  studies directly demonstrate reduced lower-extremity norepinephrine release
  with preserved arm responses, and several cohorts identify structural or
  functional small-fiber abnormalities in a subset of POTS patients. Peripheral
  vasoconstrictor failure and pooling are also well documented. The report
  overstates these pieces as one established causal chain, conflates sudomotor
  abnormalities with biopsy-confirmed SFN prevalence, and mishandles important
  counterevidence. In particular, abdominal compression alone did not improve
  heart rate or symptoms, the quoted 71% exercise remission applies only to 103
  of 251 program completers in an uncontrolled multicomponent intervention, and
  negative immunotherapy trials constrain an autoimmune upstream cause rather
  than the denervation model itself. The report also misses a relevant
  operational subtype study and a negative controlled 2025 neuropathy cohort
  and proposes three incorrect ontology identifiers.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: regional-norepinephrine-evidence
    statement: >-
      Reduced stimulated leg norepinephrine spillover with preserved arm
      responses directly supports regional lower-extremity sympathetic
      impairment, but not a proven length-dependent structural lesion in all
      POTS.
    disposition: QUALIFIED
    report_quote: >-
      establishing that sympathetic denervation in POTS is partial and
      length-dependent, affecting the lower but not the upper extremities.
    rationale: >-
      PMID:11018167 found lower femoral norepinephrine and blunted leg, but not
      arm, spillover responses in 10 patients versus 8 controls; the authors
      concluded partial sympathetic denervation especially in the legs. The
      study did not sample a proximal-to-distal gradient, perform nerve
      histology, or establish prevalence across unselected POTS, so
      "length-dependent" and universal wording go beyond the direct result.
    citations:
      - PMID:11018167
  - claim_id: cardiac-innervation-scope
    statement: >-
      Generalized cardiac sympathetic denervation is not a uniform POTS
      feature, but cardiac imaging findings are heterogeneous rather than proof
      of an exclusively lower-body lesion.
    disposition: QUALIFIED
    report_quote: >-
      proving the denervation is regional, not global
    rationale: >-
      PMID:12403667 found increased cardiac norepinephrine spillover with normal
      myocardial fluorodopamine-derived radioactivity in 16 patients. In
      contrast, PMID:24647968 found reduced cardiac MIBG uptake in 21% of 84
      patients and correlation with low IENFD. These studies argue against
      uniform generalized failure but do not establish one invariant regional
      pattern.
    citations:
      - PMID:12403667
      - PMID:24647968
  - claim_id: sfn-prevalence
    statement: >-
      Objective neuropathic abnormalities occur in a substantial subset, but
      the report's 24-50% range combines different tests, definitions, and
      selected populations and is not a biopsy-confirmed SFN prevalence.
    disposition: QUALIFIED
    report_quote: >-
      Small Fiber Neuropathy Confirmed in 24–50% of POTS Patients
    rationale: >-
      PMID:17352367 reported sudomotor abnormalities in half of 152 patients,
      not skin-biopsy-confirmed SFN. PMID:24647968 found IENFD slightly below
      its reference in 45% of 84 patients. In PMID:36349067, only 80 of 356
      patients were biopsied and 24% of that selected subset had reduced IENFD;
      QSART was reduced in 33% of 211 tested. A 2025 case-control cohort found
      comparable IENFD in 43 POTS patients and 54 controls
      (PMID:40608783). Ascertainment and case definition materially affect the
      range.
    citations:
      - PMID:17352367
      - PMID:24647968
      - PMID:36349067
      - PMID:40608783
  - claim_id: causal-chain-strength
    statement: >-
      The model's individual physiologic components are supported, but the
      complete denervation-to-pooling-to-tachycardia chain has not been
      demonstrated within one objectively defined neuropathic-POTS cohort.
    disposition: QUALIFIED
    report_quote: >-
      The downstream causal chain — from postganglionic sympathetic denervation
      to impaired lower-extremity vasoconstriction to venous pooling to reflex
      tachycardia — is robustly established by convergent human clinical
      evidence
    rationale: >-
      PMID:11018167 supports regional sympathetic impairment, and
      PMID:11295714 plus PMID:12653674 support abnormal peripheral resistance
      and pooling. Those studies use different cohorts and generally do not
      require biopsy-defined neuropathic POTS. PMID:24386408 supplies an
      operational structural-plus-functional subtype in 9 of 24 patients but
      does not perturb denervation or demonstrate the entire causal sequence.
    citations:
      - PMID:11018167
      - PMID:11295714
      - PMID:12653674
      - PMID:24386408
  - claim_id: splanchnic-compression-result
    statement: >-
      The abdominal-compression trial does not show that compression alone
      attenuated tachycardia or symptoms and does not directly measure
      splanchnic denervation.
    disposition: REJECTED
    report_quote: >-
      abdominal compression (40 mmHg inflatable binder) attenuated orthostatic
      tachycardia and improved symptoms
    rationale: >-
      PMID:32673517 reports that compression alone had no effect on standing
      heart rate and did not improve symptoms versus placebo. When added to
      propranolol, it prevented the propranolol-associated blood-pressure drop
      and improved symptoms versus propranolol alone, without an additional
      heart-rate effect. This supports an adjunct hemodynamic role, not the
      report's stated result or denervation etiology.
    citations:
      - PMID:32673517
  - claim_id: midodrine-denervation-inference
    statement: >-
      Acute response to midodrine is consistent with inadequate peripheral
      vascular tone but is not specific evidence of structural nerve loss.
    disposition: QUALIFIED
    report_quote: >-
      Alpha-1 receptor hypersensitivity is a classical marker of denervation
      supersensitivity, providing pharmacological evidence for structural nerve
      loss.
    rationale: >-
      PMID:9244228 found that both midodrine and saline reduced upright heart
      rate and interpreted midodrine response as supporting partial
      dysautonomia. It did not measure nerve structure, and an alpha-1 agonist
      can improve vascular tone through mechanisms that do not require fixed
      denervation.
    citations:
      - PMID:9244228
  - claim_id: exercise-remission-inference
    statement: >-
      The exercise registry does not establish a 71% remission rate in the
      enrolled cohort and does not refute fixed denervation in the neuropathic
      subtype.
    disposition: REJECTED
    report_quote: >-
      Exercise Training Achieves 71% Remission — The Central Paradox
    rationale: >-
      PMID:26690066 enrolled 251 patients, but only 103 completed the
      three-month exercise-plus-salt/water lifestyle program; 71% of those
      completers no longer met the heart-rate criterion. Outcomes for 148
      non-completers are unknown, there was no control arm, and participants
      were not stratified by IENFD or sudomotor status. Exercise can also
      compensate hemodynamically for a fixed deficit. The result supports
      exercise efficacy among completers, not a refutation of a
      subtype-restricted neuropathy model.
    citations:
      - PMID:26690066
  - claim_id: net-alternative
    statement: >-
      NET dysfunction demonstrates a non-denervation route to tachycardia and
      catecholamine abnormalities, but the rare familial variant and mouse
      model do not reproduce an identical human POTS phenotype or establish a
      common mechanism.
    disposition: QUALIFIED
    report_quote: >-
      This is a complete alternative mechanism — impaired NE reuptake rather
      than structural denervation — that produces an identical phenotype.
    rationale: >-
      PMID:10684912 identified a greater-than-98%-loss-of-function SLC6A2
      variant in one family, and PMID:23580201 showed tachycardia and altered
      norepinephrine handling in knock-in mice. These data establish mechanistic
      sufficiency for important POTS-like features, but mice do not reproduce
      human upright orthostatic physiology and this rare variant does not
      explain typical POTS prevalence.
    citations:
      - PMID:10684912
      - PMID:23580201
  - claim_id: immunotherapy-scope
    statement: >-
      The controlled trials weaken specific autoimmune-upstream and
      IVIG-treatment claims; they do not directly refute the presence or
      hemodynamic relevance of denervation in neuropathic POTS.
    disposition: QUALIFIED
    report_quote: >-
      Two controlled trials directly challenge the autoimmune-neuropathic
      pathway
    rationale: >-
      PMID:38311655 enrolled presumed-autoimmune POTS without requiring
      objective SFN, while PMID:36367813 enrolled antibody-associated SFN rather
      than POTS. Both were small and found no IVIG advantage. They constrain an
      immune cause and treatment response but test neither the seed model's
      regional norepinephrine deficit nor its pooling mechanism.
    citations:
      - PMID:38311655
      - PMID:36367813
  - claim_id: long-covid-upstream
    statement: >-
      Long-COVID neuropathy supplies external post-viral plausibility but does
      not demonstrate a post-viral autoimmune trigger for neuropathic POTS.
    disposition: REJECTED
    report_quote: >-
      provides the strongest contemporary evidence for a post-viral autoimmune
      mechanism as an upstream trigger for neuropathic POTS
    rationale: >-
      PMID:40093251 is a Long-COVID cohort, not a POTS-onset cohort. Of 977
      participants, 85 selected patients were biopsied and 48 had SFN; 25% of
      patients with Long-COVID neuropathy had anti-ganglioside antibodies. The
      study is cross-sectional and does not show that SFN preceded POTS or that
      antibodies caused either condition.
    citations:
      - PMID:40093251
  - claim_id: subtype-definition
    statement: >-
      A neuropathic-POTS restriction is appropriate, but one abnormal IENFD,
      QSART, or sweat test is not a validated consensus definition.
    disposition: QUALIFIED
    report_quote: >-
      defined by at least one of: reduced IENFD on skin biopsy, abnormal QSART,
      or abnormal thermoregulatory sweat test.
    rationale: >-
      PMID:36349067 explicitly notes that no formal diagnostic criteria exist.
      PMID:24386408 offered a useful research definition requiring abnormal
      IENFD plus at least one other abnormal small-fiber or sudomotor test, not
      any single test. Test discordance and selected testing populations make a
      one-test rule premature.
    citations:
      - PMID:36349067
      - PMID:24386408
  - claim_id: sfn-causality-gap
    statement: >-
      Objective SFN and POTS co-occur in a subset, but causal primacy remains
      unestablished.
    disposition: RETAINED
    report_quote: >-
      SFN causes the POTS phenotype (not just co-occurs)
    rationale: >-
      The report correctly classifies this claim as speculative. Existing
      studies are cross-sectional and do not show that inducing, preventing, or
      reversing small-fiber loss causes the corresponding onset, prevention, or
      resolution of POTS.
    citations:
      - PMID:24386408
      - PMID:36349067
      - PMID:40608783
  - claim_id: evidence-map-completeness
    statement: >-
      The primary-study synthesis omits both a directly relevant operational
      subtype study and recent controlled negative neuropathy evidence.
    disposition: QUALIFIED
    report_quote: >-
      This investigation evaluated the model across 104 primary research papers
    rationale: >-
      The report does not incorporate PMID:24386408, which defined neuropathic
      POTS using combined structural and functional criteria, or
      PMID:40608783, a 2025 case-control study that found comparable IENFD in
      POTS and controls. The report's stated total cannot be audited from its
      36-item citation sidecar, and these omissions materially narrow both its
      diagnostic-gap and evidence-balance claims.
    citations:
      - PMID:24386408
      - PMID:40608783
  - claim_id: sympathetic-neuron-cl-id
    statement: The candidate postganglionic sympathetic-neuron CL identifier is incorrect.
    disposition: REJECTED
    report_quote: Postganglionic sympathetic neuron (CL:0011100)
    rationale: >-
      Current Cell Ontology identifies CL:0011100 as galanergic neuron, not a
      postganglionic sympathetic neuron. The existing disease YAML uses the
      broader valid sympathetic-neuron term CL:0011103.
  - claim_id: small-fiber-hp-id
    statement: The candidate small-fiber-neuropathy HPO identifier is incorrect.
    disposition: REJECTED
    report_quote: HP:0012899 (Small fiber neuropathy)
    rationale: >-
      Current HPO identifies HP:0012899 as Handgrip myotonia. This mapping is an
      ontology hallucination and must not be promoted.
  - claim_id: pots-mondo-id
    statement: The candidate POTS MONDO identifier is invalid for this disease.
    disposition: REJECTED
    report_quote: MONDO:0100233 (Postural orthostatic tachycardia syndrome)
    rationale: >-
      MONDO:0100233 does not resolve to the POTS term in the repository's
      current MONDO release. This repository uses MONDO:0011479, postural
      orthostatic tachycardia syndrome.

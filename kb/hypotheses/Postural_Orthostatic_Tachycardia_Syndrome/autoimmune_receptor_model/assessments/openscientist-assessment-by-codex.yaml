hypothesis_id: autoimmune_receptor_model
assessed_at: "2026-07-31T02:53:08Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report identifies a real but unconfirmed mechanism class: patient IgG has
  receptor-modulating activity in small cell-based studies, and active peptide
  immunization can induce POTS-like hemodynamics in rabbits. Those findings
  partially support biological plausibility, not a validated antibody-defined
  human POTS subtype or patient-antibody causality. The report correctly
  foregrounds the large negative ELISA study, single-group functional-assay
  evidence, absent patient-IgG passive transfer, and negative small IVIG trial.
  It nevertheless overstates the independence of the rabbit models, AT1R
  consistency, the relevance of systemic-sclerosis assay discordance, an EBV
  upstream mechanism, and a 30-50% subtype estimate. It also omits a relevant
  small sham-controlled tVNS trial and proposes two incorrect ontology IDs.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: rabbit-model-independence
    statement: >-
      Active peptide immunization shows that experimentally induced
      receptor-modulating antibodies can produce POTS-like physiology in
      rabbits, but the studies are not independent replications and do not test
      patient-derived antibodies.
    disposition: QUALIFIED
    report_quote: >-
      supported by three independent rabbit immunization studies
    rationale: >-
      PMID:31547749, PMID:36873318, and PMID:35118574 are small active
      immunization experiments from the same University of Oklahoma research
      program with extensively overlapping investigators. PMID:36873318
      explicitly says it confirms the group's previous report. Immunization
      with selected receptor peptides establishes construct-level sufficiency
      of induced antibodies; it does not establish that naturally occurring
      human POTS IgG has the same in-vivo effect.
    citations:
      - PMID:31547749
      - PMID:36873318
      - PMID:35118574
  - claim_id: large-elisa-null
    statement: >-
      The largest standard-ELISA study did not distinguish POTS from controls
      for any of the 11 tested cardiovascular GPCR autoantibodies.
    disposition: RETAINED
    report_quote: >-
      the largest ELISA-based study (116 POTS vs. 81 controls, 11 GPCR targets)
      found no significant differences for any receptor
    rationale: >-
      PMID:35766055 tested adrenergic, muscarinic, angiotensin-II, and
      endothelin receptors at two sites. Concentrations and
      manufacturer-threshold positivity did not differ, and ROC discrimination
      was poor.
      This is strong evidence against clinical use of that ELISA platform, while
      not directly testing functional receptor modulation.
    citations:
      - PMID:35766055
  - claim_id: functional-assay-signal
    statement: >-
      Functional cell assays have found adrenergic, muscarinic, and AT1R
      activity in POTS IgG, but the evidence is concentrated in one
      collaborating laboratory network and remains independently unreplicated.
    disposition: QUALIFIED
    report_quote: >-
      cell-based functional bioassays consistently detect elevated autoantibody
      activity in POTS patients
    rationale: >-
      PMID:32743496 found group differences for alpha-1 and beta-1 activity,
      PMID:34409582 found M2R activity in 5 of 10 patients versus 0 of 5
      controls, and PMID:29618472 found AT1R activity in 12 of 17 patients.
      These are receptor-specific in-vitro observations, but they share the
      Yu/Kem assay lineage, include small samples for M2R and AT1R, and lack an
      independent blinded replication.
    citations:
      - PMID:32743496
      - PMID:34409582
      - PMID:29618472
  - claim_id: at1r-cross-platform-consistency
    statement: >-
      AT1R is a promising but inconsistent candidate, not a target repeatedly
      elevated across all relevant ELISA and functional studies.
    disposition: REJECTED
    report_quote: >-
      AT1R autoantibodies are the most consistently elevated target across both
      ELISA and functional assay platforms.
    rationale: >-
      The positive evidence consists of a 17-patient functional study
      (PMID:29618472) and a later ELISA study with 19 POTS patients and 22
      controls (PMID:40432440). The larger 116-patient ELISA study included
      angiotensin-II receptors and found no difference for any tested receptor
      (PMID:35766055). Two positive small studies on different platforms do not
      justify "most consistently elevated."
    citations:
      - PMID:29618472
      - PMID:40432440
      - PMID:35766055
  - claim_id: systemic-sclerosis-assay-analogy
    statement: >-
      Assay discordance in systemic sclerosis is an external methodological
      caution, not validation of the POTS functional assay or a reason to
      discount the large POTS ELISA null result.
    disposition: REJECTED
    report_quote: >-
      substantially mitigates the impact of the negative Hall et al. ELISA study
      on the POTS autoimmune receptor hypothesis.
    rationale: >-
      PMID:34956217 studied a different disease and found that functional AT1R
      activity did not correlate with ELISA, disease activity, or organ
      manifestations and was poorly disease-specific. It shows that platforms
      can measure different properties; it neither independently reproduces
      POTS functional results nor establishes their clinical relevance.
    citations:
      - PMID:34956217
      - PMID:35766055
  - claim_id: at1r-raas-bridge
    statement: >-
      The low-renin/low-aldosterone phenotype and inhibitory AT1R activity form
      a testable mechanistic link, but no study connects both observations in
      the same POTS patients or shows antibody-mediated aldosterone suppression
      in vivo.
    disposition: QUALIFIED
    report_quote: >-
      provides a compelling mechanistic bridge to AT1R autoantibody-mediated
      RAAS disruption
    rationale: >-
      PMID:15781744 documents low aldosterone and absent compensatory renin in
      15 hypovolemic patients. PMID:29618472 separately shows that POTS IgG can
      shift an AT1R ligand-response curve to the right in transfected cells.
      Linking these cohorts is plausible but inferred; renal, volume-regulatory,
      and other mechanisms remain alternatives.
    citations:
      - PMID:15781744
      - PMID:29618472
  - claim_id: ebv-upstream-trigger
    statement: >-
      The cited EBV-homology study supplies external plausibility for molecular
      mimicry but does not identify an upstream trigger for receptor-antibody
      POTS.
    disposition: REJECTED
    report_quote: >-
      provides the missing upstream trigger mechanism
    rationale: >-
      PMID:41050647 is an exploratory study in women with post-COVID syndrome
      and ME/CFS, not a POTS cohort. It reports reactivity to EBV-homologous
      human peptides and full-length adrenergic proteins plus symptom
      correlations. It does not demonstrate that EBV initiated POTS, isolate
      cross-reactive receptor-antibody clones, or connect those antibodies to
      orthostatic hemodynamics.
    citations:
      - PMID:41050647
  - claim_id: istand-interpretation
    statement: >-
      iSTAND constrains broad IVIG treatment claims in clinically selected
      presumed-autoimmune POTS but is not a receptor-autoantibody-selected
      causal test.
    disposition: QUALIFIED
    report_quote: >-
      the only randomized controlled trial of immunotherapy (iSTAND: IVIG vs.
      albumin) found no significant benefit.
    rationale: >-
      PMID:38311655 found no COMPASS-31 difference in 30 treated participants.
      The trial used clinical criteria suggesting autoimmunity rather than a
      validated functional receptor-antibody biomarker, and albumin intentionally
      controlled for volume expansion. The result is important negative
      therapeutic evidence, but it does not specifically refute any one receptor
      antibody.
    citations:
      - PMID:38311655
  - claim_id: randomized-trial-synthesis
    statement: >-
      iSTAND is the only randomized IVIG trial, but the report's broader
      therapeutic synthesis omits a relevant small sham-controlled tVNS trial.
    disposition: QUALIFIED
    report_quote: >-
      The iSTAND trial represents the only randomized controlled trial testing
      immunotherapy in POTS.
    rationale: >-
      The statement is defensible when "immunotherapy" means immunoglobulin.
      However, PMID:37999672 randomized 26 women to active or sham transcutaneous
      vagus-nerve stimulation and reported less postural tachycardia plus lower
      antiadrenergic activity and cytokines with active treatment. That
      same-group, small neuromodulation study does not prove antibody
      mediation, but it is consequential randomized evidence that should appear
      alongside the negative IVIG result.
    citations:
      - PMID:38311655
      - PMID:37999672
  - claim_id: antibody-subtype-prevalence
    statement: >-
      Available studies do not establish that a coherent receptor-antibody
      subtype comprises 30-50% of POTS.
    disposition: REJECTED
    report_quote: >-
      The model applies to an estimated 30–50% of POTS patients at most
    rationale: >-
      Positivity varies by receptor, assay, threshold, and cohort; targets may
      overlap within patients. PMID:32743496 reported 22% alpha-1 and 52% beta-1
      functional positivity, whereas PMID:35766055 found no discriminatory
      ELISA target and PMID:40432440 found a small-cohort AT1R group difference.
      These data cannot be combined into a validated patient-level prevalence.
    citations:
      - PMID:32743496
      - PMID:35766055
      - PMID:40432440
  - claim_id: causal-gaps
    statement: >-
      Patient-IgG passive transfer and independent functional-assay replication
      remain decisive missing tests of causal relevance.
    disposition: RETAINED
    report_quote: >-
      no passive transfer experiment has demonstrated that human POTS IgG
      reproduces the phenotype in animals
    rationale: >-
      The rabbit studies induce antibodies by peptide immunization, and the
      human studies stop at receptor-transfected-cell activity and cohort
      association. Patient-derived transfer, antigen-specific depletion and
      add-back, and independent blinded assay replication would materially
      distinguish pathogenic antibodies from assay-dependent biomarkers.
    citations:
      - PMID:31547749
      - PMID:32743496
      - PMID:35766055
  - claim_id: evidence-maturity-score
    statement: >-
      The 22%-versus-69% evidence-maturity comparison is an assessor-created
      checklist, not a validated quantitative measure.
    disposition: QUALIFIED
    report_quote: >-
      POTS autoimmune receptor model scores 8/36 (22% maturity), compared to
      25/36 (69%) for the established dilated cardiomyopathy β1AR autoantibody
      model.
    rationale: >-
      The categories usefully expose missing experiments, but the report gives
      no validated weighting, calibration, or reproducible scoring protocol.
      The percentages should not be interpreted as measured probabilities,
      effect sizes, or formal evidence grades.
  - claim_id: pots-mondo-id
    statement: The candidate POTS MONDO identifier is incorrect.
    disposition: REJECTED
    report_quote: POTS (MONDO:0017360)
    rationale: >-
      Current MONDO identifies MONDO:0017360 as vitamin B12-unresponsive
      methylmalonic acidemia type mut0. The POTS entry used by this repository
      is MONDO:0011479, postural orthostatic tachycardia syndrome.
  - claim_id: drg-cell-id
    statement: The candidate dorsal-root-ganglion neuron Cell Ontology ID is incorrect.
    disposition: REJECTED
    report_quote: dorsal root ganglion neurons (CL:0000003)
    rationale: >-
      Current Cell Ontology identifies CL:0000003 as obsolete native cell, not
      a dorsal-root-ganglion neuron. This candidate mapping must not be promoted.

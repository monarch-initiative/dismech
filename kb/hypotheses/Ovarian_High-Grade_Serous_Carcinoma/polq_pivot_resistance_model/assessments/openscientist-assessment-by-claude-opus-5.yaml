schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: polq_pivot_resistance_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report goes well beyond its seed (which carried a single prostate PMID)
  and its central judgment holds up against the primary sources: TMEJ
  signatures are genuinely enriched at BRCA reversion junctions, the
  BRCA2-specific templated-insertion signature is genuinely ovarian data, and
  the therapeutic core of the hypothesis — that blocking POLQ would prevent
  reversion alleles from arising — genuinely has no mammalian experimental
  test. That combination of real correlative support plus an untested causal
  step is what PARTIALLY_SUPPORTED means here. Three things need qualifying.
  The report presents "33-60% microhomology across three independent cohorts"
  as convergent cohort-scale evidence, but one of those cohorts contributes 7
  microhomology-flanked deletions out of 21 reversion events in 12 patients,
  only 4 of whom had ovarian, tubal, or peritoneal cancer. The "~50% of
  patients show intrinsic resistance" figure is stated in a metastatic
  castration-resistant prostate cancer frame and was derived in murine
  prostate organoids, so it should not be restated as an HGSOC number. And
  the report's own provenance is thin: it claims 102 papers reviewed against
  a 29-entry citation manifest with no search log, and it emits four figure
  placeholders with no committed artifact bundle behind them. Its correction
  of the seed's "allosteric stabilization" wording to "allosteric inhibition"
  is right, and the KB entry had already absorbed it.
data_sources:
  - data_source_id: pubmed-literature-corpus
    source_type: DATABASE
    name: PubMed literature search underlying the report's evidence matrix
    access_status: UNVERIFIABLE
    notes: >-
      The report states 102 publications were reviewed and 14 findings
      confirmed. The committed citation manifest
      (openscientist.md.citations.md) lists 29 PMIDs, matching the
      frontmatter citation_count. No search strategy, date range, screening
      log, or full corpus is committed, so neither the 102 figure nor the
      selection process can be reconstructed. Prose is not an access record.
  - data_source_id: polq-reversion-prevention-negative-search
    source_type: DATABASE
    name: Negative literature search for POLQ perturbation reducing BRCA reversion frequency
    access_status: UNVERIFIABLE
    query: >-
      Studies testing POLQ knockout or inhibition against reversion frequency
      in BRCA-mutant cells under PARP-inhibitor pressure.
    notes: >-
      This negative result is the report's most consequential claim and my
      own checking agrees with it. It is nonetheless recorded as
      UNVERIFIABLE rather than SEARCHED_NO_RESULT because no search log,
      query string, or result set is committed anywhere in the hypothesis
      directory.
  - data_source_id: polq-protac-negative-search
    source_type: DATABASE
    name: Negative literature search for POLQ-targeting PROTAC compounds
    access_status: UNVERIFIABLE
    notes: >-
      The report states that no published POLQ PROTAC compounds were found.
      Plausible, and consistent with the seed's own framing of PROTAC
      degradation as prospective, but again unsupported by a committed log.
  - data_source_id: polq-inhibitor-trial-search
    source_type: DATABASE
    name: Search for published HGSOC-specific POLQ inhibitor trial results
    access_status: UNVERIFIABLE
    notes: >-
      The report reports two POLQ inhibitor classes in early-phase trials and
      no published HGSOC-specific results. No registry identifiers (NCT or
      otherwise) are given for either programme, so the trial claim cannot be
      resolved to specific studies from the report alone.
analyses:
  - analysis_id: evidence-matrix-and-figure-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative synthesis into a 14-row evidence matrix, a claim-status
      table, and a nine-step annotated causal chain, plus four referenced
      figures.
    status_reason: >-
      The report embeds four figure placeholders in
      {{figure:NAME.png|caption=...}} form. The hypothesis directory contains
      only the two reports and their citation sidecars, with no
      openscientist_artifacts bundle, so no figure, table export, code, or
      environment specification exists to inspect. The tables in the report
      body are readable but are the report's own prose, not a derived
      artifact.
    limitations: >-
      Nothing here is a computation over data. The evidence-strength labels
      on each causal-chain step (ESTABLISHED, SUPPORTED, EMERGING, INFERRED,
      SPECULATIVE) are the provider's editorial judgment and carry no method.
claims:
  - claim_id: tmej-signature-at-brca-reversions
    statement: >-
      Microhomology signatures characteristic of POLQ-mediated end joining are
      enriched at BRCA reversion junctions, most clearly for BRCA2.
    disposition: RETAINED
    report_quote: >-
      In clinical specimens, microhomology signatures are enriched at BRCA
      reversion junctions, particularly for BRCA2.
    rationale: >-
      Confirmed against the primary sources. The AstraZeneca meta-analysis of
      327 patients (234 of them ovarian) reports 269 reversion events in 86
      patients and states directly that mutagenic end-joining pathways play a
      key role in generating reversions, especially those affecting BRCA2, on
      the basis of significant accumulation of microhomologies around
      reversion deletions. The TOPARP-B analysis already cited in the KB
      supplies the 60% figure. This is the best-supported element of the
      hypothesis and, unlike the KB's existing evidence, the meta-analysis
      cohort is majority-ovarian.
    citations:
      - PMID:33091561
      - PMID:39577422
  - claim_id: tins-signature-ovarian-brca2
    statement: >-
      Templated insertions attributable to TMEJ are specific to biallelic
      BRCA2-mutant tumors and their burden associates with survival after
      platinum in advanced ovarian cancer.
    disposition: RETAINED
    report_quote: >-
      This is the most direct HGSOC-specific evidence linking TMEJ activity to
      BRCA2 deficiency and clinical outcomes, strongly supporting the model's
      applicability to BRCA2-mutant tumors.
    rationale: >-
      Verified against the source, which states that TINS consistent with TMEJ
      repair are highly specific to tumors with pathogenic biallelic BRCA2
      mutations and that high TINS content in advanced ovarian cancers
      associates with overall survival following platinum treatment. This is
      the single most valuable lead in the report for this entry, because
      every POLQ and reversion evidence item already in the disorder file
      comes from prostate cancer. Note the study establishes that TMEJ is
      active in BRCA2-deficient ovarian tumors; it does not show that TMEJ
      produced any reversion allele.
    citations:
      - PMID:35385581
  - claim_id: polq-inhibition-prevents-reversions-untested
    statement: >-
      No mammalian study has tested whether POLQ inhibition or knockout
      reduces the frequency of BRCA reversion mutations, so the hypothesis's
      therapeutic premise rests on an inference from signature to cause.
    disposition: RETAINED
    report_quote: >-
      the model's central mechanistic claim — that POLQ inhibition would
      prevent the generation of reversion alleles — has never been directly
      tested.
    rationale: >-
      This is the report's most important contribution and it survives
      checking. The meta-analysis that established the microhomology signature
      concludes only that pharmacological inhibition of end-joining repair
      "could improve durability of drug treatments by preventing the
      acquisition of reversion mutations" — a proposal, in the authors' own
      hedged wording, not a result. The ART558 work demonstrates synthetic
      lethality and rescue of 53BP1/Shieldin-mediated resistance, neither of
      which is reversion prevention. The KB's existing knowledge-gap
      discussion already poses exactly this question.
    citations:
      - PMID:33091561
      - PMID:34140467
  - claim_id: microhomology-percentage-cohort-framing
    statement: >-
      Three independent clinical cohorts converge on 33-60% of BRCA reversion
      deletions carrying microhomology.
    disposition: QUALIFIED
    report_quote: >-
      A pan-cancer Japanese cohort found that 33.3% of reversion deletions
      showed microhomology >1 bp
    rationale: >-
      The 33.3% number is transcribed correctly, but the denominator is not
      cohort-scale. The Japanese study screened 3,738 patients, found
      reversion mutations in 12 (0.32%), and identified 21 reversion events of
      which 7 deletions showed microhomology longer than 1 bp. Only 4 of the
      12 patients had ovarian, fallopian tube, or peritoneal cancer. Reporting
      this alongside a 327-patient meta-analysis as one of three comparable
      cohorts overstates its weight, and the 33-60% range should not be
      treated as a stable population estimate.
    citations:
      - PMID:38041241
      - PMID:33091561
  - claim_id: polq-dispensable-in-normal-cells
    statement: >-
      POLQ is dispensable in normal cells, so POLQ blockade would not incur
      host genotoxicity.
    disposition: QUALIFIED
    report_quote: >-
      Polq-/- mice are viable and fertile, supporting the claim that POLQ is
      dispensable in normal physiology.
    rationale: >-
      Viability is not the same as absence of genotoxic cost, and the report
      is right to flag this. The knockout study it cites reports that
      Polq-null bone marrow stromal cells are more radiosensitive than
      wild-type, are moderately more bleomycin-sensitive, and that Polq-null
      mice carry more spontaneous and radiation-induced micronucleated
      reticulocytes. That sits in real tension with the pharmacological result
      already curated in the KB, in which noncancerous cells were not
      radiosensitized by Polθ inhibition. Genetic loss and allosteric
      inhibition are not interchangeable, and the entry should say so rather
      than assert an unqualified therapeutic window.
    citations:
      - PMID:19630521
      - PMID:36689546
  - claim_id: polq-dual-function-ssdna-gap-filling
    statement: >-
      POLQ acts on post-replicative single-stranded DNA gaps as well as on
      double-strand breaks, so the therapeutic effect of POLQ blockade need
      not run through MMEJ at breaks.
    disposition: RETAINED
    report_quote: >-
      POLQ-deficient cells accumulate post-replicative ssDNA gaps upon BRCA1/2
      loss or PARP inhibitor treatment, and POLQ can perform
      microhomology-mediated gap skipping (MMGS)
    rationale: >-
      Verified almost verbatim against the source abstract. The KB hypothesis
      description already names ssDNA gap filling as one of the escape
      pathways but carries no evidence for it, so this is a real gap the
      report closes. Its consequence is a genuine qualification of the
      hypothesis: if gap sealing is where POLQ inhibitors earn their benefit,
      the reversion-blocking rationale stops being load-bearing and becomes
      optional.
    citations:
      - PMID:36455556
  - claim_id: celegans-causality-extrapolation
    statement: >-
      Genetic work in C. elegans establishes POLQ as causally responsible for
      the microhomology-flanked deletion class, providing the causality that
      human signature data cannot.
    disposition: QUALIFIED
    report_quote: >-
      though extrapolation to human cancer reversion events requires caution
    rationale: >-
      The source does establish causality for a distinct deletion class
      arising at replication-associated breaks, and reports that most
      spontaneously evolving structural variation in wild isolates matches the
      TMEJ signature. The report's own caution is warranted and should be kept
      attached to the claim: the demonstration is of deletion class, in an
      invertebrate, at replication-associated breaks, not of reversion allele
      generation at a BRCA locus under drug pressure. This is the strongest
      causal anchor available, and it is still two extrapolations away from
      the clinical claim.
    citations:
      - PMID:24614976
  - claim_id: allosteric-stabilization-terminology
    statement: >-
      The seed hypothesis's "allosteric stabilization" wording is wrong; the
      clinical-stage compounds are allosteric inhibitors, and POLQ PROTACs do
      not exist.
    disposition: RETAINED
    report_quote: >-
      No publications use the term "allosteric stabilization" for POLQ. PROTAC
      degradation of POLQ is entirely speculative with zero published
      compounds.
    rationale: >-
      Correct on both counts against the cited sources: ART558 is described as
      an allosteric inhibitor of the polymerase function, and novobiocin
      blocks nucleic acid binding and inhibits stimulation of ATPase activity.
      The disorder entry has already been revised to say allosteric POLQ
      polymerase inhibitors and ATPase-domain inhibitors, and to describe
      PROTACs as prospective, so no further correction is needed there. The
      knowledge-gap discussion still proposes conformational stabilization as
      a perturbation, which is legitimate because that arm is explicitly a
      hypothetical experiment rather than a description of an existing drug.
    citations:
      - PMID:34140467
      - PMID:37665033
  - claim_id: reversion-independent-resistance-scope-limit
    statement: >-
      Roughly half of BRCA-mutant patients show upfront, reversion-independent
      resistance, restricting the POLQ model to acquired resistance.
    disposition: QUALIFIED
    report_quote: >-
      ~50% of BRCA-mutant patients show intrinsic resistance via
      reversion-independent mechanisms entirely outside the model's scope
    rationale: >-
      The scope limitation is real and worth recording, but the number is
      being moved out of its setting. The cited paper frames both figures in
      metastatic castration-resistant prostate cancer, where clinical
      responses to PARPi are seen in about half of BRCA-mutant patients, and
      derives its mechanism in murine Brca2-null prostate organoids
      engineered so reversion cannot occur. Neither the 50-80% reversion
      figure nor the ~50% upfront-resistance figure is an HGSOC statistic, and
      restating them as such in an ovarian entry would repeat the very
      prostate-to-ovary transfer the entry's existing evidence caveat warns
      about.
    citations:
      - PMID:40460119
  - claim_id: ctdna-mmej-reversion-breast-phase1b
    statement: >-
      A Phase Ib breast cancer study confirms BRCA reversion with an MMEJ
      signature in ctDNA at progression.
    disposition: QUALIFIED
    report_quote: >-
      A Phase Ib breast cancer study confirmed BRCA reversion mutations with
      MMEJ signature in circulating tumor DNA from progressing patients
    rationale: >-
      The observation exists but "confirmed" oversells it. The trial enrolled
      ten patients with germline BRCA1/2-mutated metastatic breast cancer, and
      ctDNA from two of them showed reversion mutations associated with a
      microhomology-mediated end-joining signature, while three had
      non-reversion resistance mechanisms. Two events in a ten-patient breast
      cohort is a consistent anecdote, not corroboration, and it is not
      ovarian.
    citations:
      - PMID:41335237
  - claim_id: aldh1a1-polq-axis
    statement: >-
      ALDH1A1 drives POLQ expression through retinoic acid receptor signaling
      and promotes PARPi resistance in BRCA2-mutated ovarian cancer.
    disposition: RETAINED
    report_quote: >-
      ALDH1A1 promotes PARPi resistance by enhancing MMEJ in BRCA2-mutated
      ovarian cancer
    rationale: >-
      Verified, and one of only two genuinely ovarian mechanistic threads in
      the report. It is already curated: the disorder entry carries two
      evidence items from this study on the POLQ hypothesis, covering both the
      expression link and the NCT-505 plus olaparib organoid combination.
      Recorded here as retained rather than as a new lead.
    citations:
      - PMID:37429899
  - claim_id: candidate-ontology-terms
    statement: >-
      The proposed GO terms are appropriate bindings for the mechanisms in
      this hypothesis.
    disposition: QUALIFIED
    report_quote: >-
      GO:0006281 (DNA repair); GO:0006310 (DNA recombination); GO:0045087
      (innate immune response); GO:0000724 (double-strand break repair via
      homologous recombination)
    rationale: >-
      All four identifiers resolve and all four labels match their canonical
      ontology labels, which is better than most reports manage. They are
      nonetheless too coarse to use here: DNA repair and DNA recombination say
      nothing specific about theta-mediated end joining, and the disorder
      entry already binds the more precise GO:0097681, double-strand break
      repair via alternative nonhomologous end joining, on the POLQ node.
      GO:0000724 is likewise already bound on the reversion node. No new
      binding is warranted from this list.
  - claim_id: brca1-versus-brca2-differential
    statement: >-
      The hypothesis does not distinguish BRCA1 from BRCA2, but TMEJ
      signatures appear substantially more specific to BRCA2.
    disposition: RETAINED
    report_quote: >-
      BRCA1-mutant tumors show distinct deletion phenotypes and may rely less
      on TMEJ for reversions.
    rationale: >-
      Supported by both signature sources: the templated-insertion signature
      is reported as highly specific to biallelic BRCA2, and the meta-analysis
      singles out BRCA2 when describing microhomology accumulation at
      reversion deletions. Neither addresses whether BRCA1-mutant HGSOC
      reverts by a different route. This is an open question the disorder
      entry does not currently pose, and it is the most curatable gap in the
      report.
    citations:
      - PMID:35385581
      - PMID:33091561
  - claim_id: status-retain-emerging
    statement: >-
      The hypothesis should stay at EMERGING rather than being upgraded.
    disposition: RETAINED
    report_quote: >-
      Core reversion-blocking claim unproven; upgrade to SUPPORTED only when
      mammalian experimental evidence demonstrates POLQ inhibition reduces
      reversion frequency
    rationale: >-
      Agreed, and no change was made. The entry already carries
      status EMERGING. The added evidence strengthens the upstream
      signature claim and the ovarian applicability, but leaves the
      untested reversion-blocking step exactly where it was.
  - claim_id: literature-corpus-provenance
    statement: >-
      The report's conclusions rest on a review of 102 publications.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Our investigation across 102 publications confirmed that the biochemical
      foundations of the model are sound.
    rationale: >-
      The citation manifest contains 29 identifiers and the frontmatter
      records citation_count 29. Reviewing 102 papers and citing 29 is
      entirely plausible, but with no search strategy or screening record
      committed, the 102 figure cannot be checked, and neither can the
      claim of 14 confirmed findings.
  - claim_id: figure-artifacts-not-committed
    statement: >-
      The report supplies artifact-friendly figures as provenance for
      hypothesis-level review.
    disposition: REJECTED
    report_quote: >-
      {{figure:evidence_matrix.png|caption=Evidence matrix visualization
      showing the landscape of supporting, qualifying, and scope-limiting
      evidence for the POLQ Pivot Resistance Model.}}
    rationale: >-
      Four figure placeholders appear in the report and none of them resolves
      to anything. The hypothesis directory contains only openscientist.md,
      its citation sidecar, and the sibling asta report and sidecar; there is
      no openscientist_artifacts directory. The placeholders should be read as
      unfilled template output, not as deposited provenance.

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_galc_deficiency_psychosine_demyelination_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The upstream half of the seed hypothesis is well supported and the report adds
  real new support for it: a 31-variant expression panel in a GALC-knockout human
  oligodendrocytic line gives a quantitative dose-response between residual GALC
  activity and age of onset, with an inverse relationship to endogenous
  psychosine. The report's genuinely new contribution, however, is negative. Two
  independent perturbations that remove or deeply deplete psychosine fail to
  prevent disease: saposin-D ablation in twitcher mice leaves late-stage
  demyelination intact and shortens lifespan, and a UGT8 inhibitor lowers
  psychosine 72-86% with unchanged survival. The seed hypothesis as written
  ("psychosine accumulation ... triggers apoptosis of myelin-forming cells ...
  and progressive CNS and peripheral demyelination") therefore overstates
  sufficiency, which is why the verdict is PARTIALLY_SUPPORTED rather than the
  report's own SUPPORTED. The report is also uneven at the sentence level. It
  presents a paraphrase of PMID:35290889 inside quotation marks; it reports
  PMID:34999780 as "widespread accumulations" and confirmed prion-like capacity
  without noting that the same paper found no Lewy body pathology, no
  conformation-specific or pS129 labelling, and tested seeding in only two of
  four cases; its four-row "psychosine paradox" table is assembled from four
  separate studies on different backgrounds with no head-to-head comparison; one
  proposed ontology term (GO:0031579, given as "lipid raft organization") is not
  in this repo's caches and the label is not GO's canonical wording; and its
  Gap 8 claim that no ClinGen gene-disease validity classification exists for
  GALC-Krabbe is simply wrong - a Definitive Lysosomal Diseases GCEP assertion
  dated 2022-06-15 is already cited in the disorder entry. Its headline "Papers
  Reviewed: 90" cannot be reconstructed from the 33-entry citation manifest.
data_sources:
  - data_source_id: pubmed-literature-search
    source_type: DATABASE
    name: PubMed literature corpus assembled by the provider
    uri: https://pubmed.ncbi.nlm.nih.gov/
    access_status: CITED_NOT_ACCESSED
    query: >-
      Not recorded. The report states 90 papers reviewed and 20 confirmed
      findings across 5 investigation iterations, but deposits no search
      strategy, screening log, or date-bounded query string.
    notes: >-
      No artifact bundle is committed for this run, so the search is prose only
      and is not an access record. The citations sidecar lists 33 identifiers,
      all of which resolve to real papers whose titles match the report's
      descriptions; the gap between 33 and 90 is unexplained.
  - data_source_id: clingen-gencc-gene-disease-validity
    source_type: DATABASE
    name: ClinGen / GenCC gene-disease validity
    uri: https://search.clinicalgenome.org/
    access_status: UNVERIFIABLE
    notes: >-
      The report records this as a source-level absence. The absence is false:
      ClinGen's Lysosomal Diseases Gene Curation Expert Panel classified
      GALC-Krabbe disease as Definitive on 2022-06-15, and that assertion is
      already cached and cited in kb/disorders/Krabbe_Disease.yaml. No query or
      response is deposited, so the negative result cannot be audited either.
  - data_source_id: clinicaltrials-gov-krabbe-gene-therapy
    source_type: DATABASE
    name: ClinicalTrials.gov records for Krabbe gene therapy and registry studies
    identifier: NCT04693598
    access_status: CITED_NOT_ACCESSED
    notes: >-
      NCT04693598, NCT05739643 and NCT02993796 are named in prose with phase and
      status assertions but no retrieved record, snapshot date, or artifact.
      NCT04693598 and NCT05739643 are already named in the disorder entry's gene
      therapy treatment description.
  - data_source_id: human-krabbe-cns-omics
    source_type: OTHER
    name: Large-scale single-cell or proteomic data for human Krabbe CNS tissue
    access_status: UNVERIFIABLE
    notes: >-
      Reported as a data-level absence in Gap 8. No repository, query, or search
      log is deposited, so this is an unverifiable negative rather than a
      recorded search.
analyses:
  - analysis_id: psychosine-paradox-comparison-table
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative cross-study tabulation of four psychosine-lowering perturbations
      (ACDase knockout, saposin-D knockout, UGT8 inhibitor RA 5557, CGT
      inhibitor S202) against psychosine reduction, cure, and lifespan.
    comparison: Psychosine-depleting perturbations versus untreated twitcher mice.
    status_reason: >-
      No code, extraction table, or artifact bundle is committed, and the four
      rows come from four separate publications using different genetic
      backgrounds, endpoints and time points. The report itself concedes that no
      head-to-head comparison exists. The tabulation is a reading of abstracts,
      not a computation.
    limitations: >-
      The "Lifespan: Extended" cell for the ACDase-knockout row is an inference
      from the source's word "cures" plus a separate carmofur survival result,
      not a reported survival comparison against the other three arms.
  - analysis_id: evidence-matrix-classification
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Assignment of each of 28 evidence-matrix rows to a supports / qualifies /
      competing verdict with a confidence label.
    status_reason: >-
      Verdict and confidence labels are asserted without a stated rubric,
      inter-rater step, or deposited scoring artifact.
claims:
  - claim_id: core-galc-psychosine-demyelination-axis
    statement: >-
      GALC loss of function causes psychosine accumulation, and that axis is the
      well-supported upstream core of Krabbe disease pathogenesis.
    disposition: RETAINED
    report_quote: >-
      The core GALC → psychosine → demyelination axis is robustly supported by
      genetic, pharmacological, and biomarker evidence.
    rationale: >-
      Retained, but it produces almost no new support: this is the seed
      hypothesis restated, and the disorder entry already carries the GALC
      deficiency, psychosine accumulation, oligodendrocyte and Schwann cell
      toxicity, and demyelination chain with evidence. The one genuinely new
      contribution to the upstream half is the variant dose-response, handled as
      a separate claim below.
    citations:
      - PMID:31527255
      - PMID:7354254
  - claim_id: galc-activity-onset-dose-response
    statement: >-
      Residual GALC activity measured across a 31-variant missense panel in a
      GALC-knockout human oligodendrocytic line correlates with reported age of
      disease onset and inversely with endogenous psychosine.
    disposition: RETAINED
    report_quote: >-
      Residual GALC activity strongly correlated with the age of disease-onset
      in reported cases (Pearson's r > 0.94, p < 0.0001), suggesting that enzyme
      activity resulting from MMV expression in this model may serve as a
      readout for clinical prognostication.
    rationale: >-
      Verified verbatim against the cached abstract of PMID:40449593, including
      the 92-100% activity reduction in 26 of 31 clinically relevant variants and
      the separately stated inverse correlation with endogenous psychosine. This
      is the strongest quantitative support the report adds and it was absent
      from the disorder entry, which asserted the r > 0.94 figure in prose with
      no citation. Note the correlation is between a cell-line activity readout
      and onset ages taken from published case reports, not a prospective
      clinical cohort.
    citations:
      - PMID:40449593
  - claim_id: psychosine-necessary-not-sufficient
    statement: >-
      Psychosine accumulation is necessary but not sufficient for the full
      Krabbe phenotype, and GALC has pathogenically relevant functions beyond
      clearing psychosine.
    disposition: RETAINED
    report_quote: >-
      These results demonstrate that psychosine is necessary but not sufficient,
      and that GALC has critical functions beyond psychosine degradation.
    rationale: >-
      Two independent perturbations support this. Saposin-D ablation in twitcher
      mice leaves very little psychosine in CNS or PNS yet produces comparable
      late-stage demyelination and shorter lifespans, and the UGT8 inhibitor
      RA 5557 lowers psychosine 72-86% in midbrain and cortex with unchanged
      survival. This is the report's most consequential finding and it is the
      part that actually qualifies the seed hypothesis, whose description asserts
      that psychosine accumulation triggers myelinating-cell apoptosis and
      progressive demyelination.
    citations:
      - PMID:37337846
      - PMID:35290889
  - claim_id: sapd-knockout-late-stage-demyelination
    statement: >-
      Eliminating psychosine by saposin-D ablation delays but does not prevent
      demyelination in twitcher mice, and the double mutants die earlier.
    disposition: RETAINED
    report_quote: >-
      at the later disease stage, qualitatively and quantitatively comparable
      demyelination occurred in Twi/Sap-D KO mice, particularly in the PNS, and
      the lifespans of Twi/Sap-D KO mice were even shorter than that of Twi mice
    rationale: >-
      Verified verbatim against the cached abstract of PMID:37337846. The same
      abstract also reports that bone-marrow-derived macrophages from both Twi
      and Twi/Sap-D KO mice make TNF-alpha on GalCer exposure and become globoid
      cells, which the authors offer as the psychosine-independent mechanism.
      That second half is a direct, independent corroboration of the
      GalCer-macrophage arm the disorder entry already carries and the report
      does not connect the two.
    citations:
      - PMID:37337846
  - claim_id: ugt8-inhibitor-quote-fidelity
    statement: >-
      The sentence the report places in quotation marks for PMID:35290889 is the
      source's wording.
    disposition: QUALIFIED
    report_quote: >-
      given the unchanged lifespan, it appears that GALC has critical functions
      in the nervous system beyond its traditional role in the degradation of
      galactosylceramide and psychosine
    rationale: >-
      The finding is correct but the quotation is not verbatim. The cached
      abstract reads "beyond the hydrolysis of galactosylceramide and
      galactosylsphingosine"; the report substitutes "its traditional role in
      the degradation of" and "psychosine". A curator copying this string into a
      snippet would fail reference validation, which is exactly why report
      snippets must be re-derived from the cache.
    citations:
      - PMID:35290889
  - claim_id: dual-mechanism-galcer-macrophage-arm
    statement: >-
      A GalCer-driven, macrophage-autonomous arm operates in parallel with
      psychosine toxicity, and HSCT benefit reflects phagocytic macrophage
      replacement rather than efficient enzyme cross-correction.
    disposition: RETAINED
    report_quote: >-
      GLD may be caused by at least two mechanisms: psychosine-induced
      demyelination and secondary neuroinflammation from galactosylceramide
      storage in macrophages
    rationale: >-
      Well supported and already curated: the disorder entry has a
      GalCer-Driven Macrophage Pathology node with this PMID and an edge from
      GALC Deficiency. The report adds no new source for it, but the saposin-D
      paper independently reaches the same macrophage conclusion, which is worth
      curating as a second citation on that node.
    citations:
      - PMID:32375064
      - PMID:37337846
  - claim_id: neuron-autonomous-psychosine-toxicity
    statement: >-
      Psychosine damages neurons cell-autonomously, so Krabbe disease is not
      exclusively a disorder of myelinating glia.
    disposition: RETAINED
    report_quote: >-
      Psychosine alone was sufficient to induce these defects in healthy
      neurons.
    rationale: >-
      Supported by the cached abstract of PMID:27780934, which reports neurite
      fragmentation, abnormal neuritic branching, enlarged and fragmented
      LAMP1-positive vesicles and altered mitochondria in iNeurons from two
      adult-onset patients, and states that psychosine was sufficient to induce
      neurite defects, mitochondrial fragmentation and lysosomal alterations in
      iNeurons from healthy individuals. This is a directly converted human
      neuronal system rather than a mouse model, and the disorder entry had no
      neuronal node at all: every pathophysiology node was glial, macrophage or
      myelin. The scope caveat is that the patients were adult-onset compound
      heterozygotes, so extrapolation to infantile disease is an inference.
    citations:
      - PMID:27780934
  - claim_id: alpha-synuclein-prion-like-pathology
    statement: >-
      Infant Krabbe brains carry widespread alpha-synuclein accumulation with
      confirmed prion-like seeding capacity.
    disposition: QUALIFIED
    report_quote: >-
      confirming the prion-like capacity of Krabbe disease-derived α-synuclein
    rationale: >-
      The quoted words are the source's, but the report omits the constraints
      the same paper states. Hatton et al. explicitly did not observe Lewy body
      pathology in any case, globoid cells were not labelled by the
      conformation-specific Syn-O2 and 5G4 antibodies or by pS129, the cohort is
      four Krabbe cases against four infant controls, and RT-QuIC seeding was run
      on only the two cases with frozen tissue available. PMID:30127535 supplies
      the mechanism and an important limit the report states only in passing:
      knocking out alpha-synuclein reduces but does not prevent neurological
      signs in the mouse model. Reportable as an emerging downstream branch, not
      as an established arm of Krabbe pathogenesis.
    citations:
      - PMID:34999780
      - PMID:30127535
  - claim_id: sphingolipid-fibril-formation
    statement: >-
      Self-assembly of GalCer and galactosylsphingosine into cytotoxic
      amyloid-like fibrils is a novel supramolecular toxic species in Krabbe
      disease.
    disposition: QUALIFIED
    report_quote: >-
      both GalCer and GalSph can self-assemble in vitro into highly organized
      fibrils reminiscent of fibrils of amyloidogenic proteins. These fibrils
      exhibit significant cytotoxicity to both neuronal and oligodendroglial
      cells
    rationale: >-
      In vitro only, with fibrils detected in GALC-inhibited cells rather than
      in patient or twitcher tissue. The report labels it Emerging and
      Speculative in its own tables and then lists it as a candidate
      pathophysiology node, which is inconsistent. Not ready for a curated
      mechanism node; the appropriate destination is a knowledge gap or a future
      revisit.
    citations:
      - PMID:40603002
  - claim_id: galc-heterozygosity-neurodegeneration-risk
    statement: >-
      GALC heterozygosity is enriched roughly 1 in 28 among adults with
      neurodegenerative conditions versus 1 in 150 in the general population.
    disposition: QUALIFIED
    report_quote: >-
      GALC heterozygosity in this group to be notably enriched, approximately 1
      in 28, compared to 1 in 150 in the general population
    rationale: >-
      The figures are the source's, but the design does not support the
      "risk factor" framing the report gives it. The 110 adults were selected
      for symptoms shared by lysosomal storage disorders and common
      neurodegenerative disease, the 1-in-150 comparator is a background
      literature figure rather than a matched control group, and no statistical
      test is reported. The paper's own conclusion is a "possible connection".
      Out of scope for the Krabbe disease entry in any case, which is a biallelic
      disorder; this belongs with Parkinson disease or Lewy body disease
      curation if anywhere.
    citations:
      - PMID:40391866
  - claim_id: clingen-gencc-absence
    statement: >-
      No published formal gene-disease validity classification exists for
      GALC-Krabbe disease.
    disposition: REJECTED
    report_quote: >-
      **ClinGen/GenCC:** No published formal gene-disease validity
      classification found for GALC-Krabbe (though well-established in OMIM).
    rationale: >-
      Factually wrong, and wrong in the direction that matters: ClinGen's
      Lysosomal Diseases Gene Curation Expert Panel classified GALC / Krabbe
      disease as Definitive under SOP9 on 2022-06-15, nearly four years before
      this report's search date. That assertion is already cached in this
      repository and already cited in the disorder entry's genetic block. A
      claimed source-level absence with no deposited query is the least
      auditable kind of claim a report can make, and this one is checkable and
      false.
    citations:
      - CGGV:assertion_d17202fb-89c4-4bf6-ad57-4b8c541dc808-2022-06-15T160000.000Z
  - claim_id: candidate-ontology-terms
    statement: >-
      The proposed cell-type and biological-process CURIEs are usable as given.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Biological processes:** GO:0042552 (myelination), GO:0006915 (apoptotic
      process), GO:0031579 (lipid raft organization), GO:0099504 (synaptic
      vesicle cycle), GO:0006914 (autophagy), GO:0006954 (inflammatory response)
    rationale: >-
      Five of the six GO identifiers check out against this repository's caches
      with the labels given, and all five proposed CL identifiers
      (CL:0000128 oligodendrocyte, CL:0002573 Schwann cell, CL:0000235
      macrophage, CL:0000129 microglial cell, CL:0000540 neuron) are cached and
      are enum members. GO:0031579 is the exception: it is absent from
      cache/go/terms.csv, and GO's canonical wording for this family is
      "membrane raft", not the "lipid raft organization" the report supplies, so
      the label must not be copied into curated data without an independent
      lookup. Nothing here is new to the entry - every proposed CL term except
      neuron is already bound somewhere in it.
  - claim_id: status-change-recommendation
    statement: >-
      The hypothesis should stay CANONICAL with an explicit multi-mechanism
      qualification rather than being downgraded.
    disposition: RETAINED
    report_quote: >-
      **Recommended:** CANONICAL with mandatory qualifications
    rationale: >-
      Agreed, and already implemented: the disorder entry keeps status CANONICAL
      and its notes already carry the multi-mechanism qualifier text nearly
      verbatim from this report. No status edit is warranted. What the entry
      lacked was citations for the qualifying claims, which is the integration
      this assessment drives.
  - claim_id: literature-corpus-provenance
    statement: >-
      The report rests on a systematic review of 90 publications.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Papers Reviewed:** 90
    rationale: >-
      The citations sidecar lists 33 identifiers and the frontmatter records
      citation_count 33. No search strategy, screening log, or 90-paper corpus
      is deposited, so the headline count cannot be reconstructed. Every one of
      the 33 identifiers I checked resolves to a real paper whose title matches
      the report's description, so this is a provenance gap rather than evidence
      of fabrication.

hypothesis_id: vascular_bbb_clearance_model
assessed_at: "2026-09-04T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  I fetched eleven of this report's identifiers into references_cache/ and
  compared the report's wording with the cached source. Ten resolve to the paper
  described and their quoted sentences are exact. The report's overall verdict is
  also right, and unlike the neuroimmune run it correctly recommends leaving the
  curated status alone.

  The verified additions are substantial and the entry has none of them: its
  vascular_bbb_clearance_model block currently carries two review citations from
  2016 and 2017 and no molecular mechanism at all. The report supplies the human
  post-mortem APOE4 pericyte-degeneration series with the cyclophilin A and MMP-9
  pathway (PMID:25757756), the PICALM link that routes both LRP1 and
  P-glycoprotein through the endothelium (PMID:30041013), causal bilateral
  carotid stenosis raising soluble amyloid-beta in Tg-SwDI mice (PMID:28667120),
  and glymphatic influx and clearance falling at six months in AppNL-F mice
  before substantial plaque deposition (PMID:41762118).

  Three problems. First, the ARIA-E incidence range attributed to the 2026
  Cochrane review is not in that review, which reports an absolute risk
  difference of 107 more per 1000 for any ARIA-E rather than a 22 to 36 percent
  incidence; the APOE4-highest-risk attribution is likewise not in that record.
  Second, the sPDGFRbeta biomarker finding is reported selectively: the same
  abstract states that higher baseline sPDGFRbeta was associated with better
  cross-sectional attention, visuospatial, and executive functioning, which the
  report omits, in a study of 83 people. Third, the report's own key glymphatic
  citation contains a result cutting against the simple clearance loop, which it
  does not mention: in that model, anti-amyloid antibody treatment cleared plaques
  and rescued border macrophages without restoring glymphatic function, and the
  authors conclude the glymphatic deficit is not driven by parenchymal plaques.

  One curation lead is wrong as written: CL:0000669 is pericyte, not pericyte
  cell death, so it cannot be used to name a degeneration node. Nothing
  computational was run, and the claimed 110-publication corpus is not
  reconcilable with the 35 identifiers actually committed.

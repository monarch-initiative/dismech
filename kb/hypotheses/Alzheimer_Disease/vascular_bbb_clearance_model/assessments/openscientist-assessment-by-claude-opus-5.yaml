claims:
  - claim_id: verdict-partially-supported-alternative-retained
    statement: >-
      Vascular and blood-brain barrier clearance failure is a well-validated
      upstream and reinforcing mechanism in Alzheimer disease rather than a proven
      standalone cause, with the strongest applicability to late-onset disease,
      APOE4 carriers, and concurrent cerebral amyloid angiopathy.
    disposition: RETAINED
    report_quote: "**Verdict: PARTIALLY SUPPORTED — with strong mechanistic evidence but incomplete human causal proof.**"
    rationale: >-
      Concordant with the curated ALTERNATIVE status and with the entry's
      existing restriction of this hypothesis to Late-Onset Alzheimer's Disease.
      The three reasons the report gives for withholding full support are each
      accurate on the sources I checked.
    citations:
      - PMID:25757756
      - PMID:41985900
  - claim_id: apoe4-drives-pericyte-degeneration-and-bbb-breakdown
    statement: >-
      Pericyte degeneration is accelerated in APOE4 carriers with Alzheimer
      disease relative to APOE3 carriers and to non-Alzheimer controls, correlates
      with the magnitude of blood-brain barrier breakdown to immunoglobulin G and
      fibrin, and is accompanied by cyclophilin A and MMP-9 accumulation in
      pericytes and endothelial cells.
    disposition: RETAINED
    report_quote: "accelerated pericyte degeneration in AD APOE4 carriers > AD APOE3 carriers > non-AD controls, which correlates with the magnitude of BBB breakdown to immunoglobulin G and fibrin"
    rationale: >-
      Verified verbatim against the cached abstract, which also reports that LRP1
      was similarly reduced in APOE4 and APOE3 carriers, so the genotype effect
      runs through the CypA-MMP-9 arm rather than through LRP1 levels. This is the
      single strongest human mechanistic source in the report and is absent from
      the entry, whose vascular block currently has no molecular content at all.
      Human post-mortem.
    citations:
      - PMID:25757756
  - claim_id: spdgfrb-predicts-cognitive-decline
    statement: >-
      Higher CSF soluble PDGFR-beta, a marker of pericyte injury, predicts faster
      cognitive decline in biomarker-positive and APOE4-positive older adults
      without dementia.
    disposition: QUALIFIED
    report_quote: "higher sPDGFRβ was associated with faster longitudinal decline in all cognitive domains in biomarker-positive relative to biomarker-negative individuals"
    rationale: >-
      The quotation is exact, but the report presents only the half of the result
      that supports the hypothesis. The same abstract states that higher baseline
      sPDGFRbeta was associated with better cross-sectional attention,
      visuospatial, and executive functioning, a directionally opposite
      cross-sectional finding, and the cohort is 83 people without dementia
      followed up to five years. Curate the interaction effect with both
      directions stated and the sample size attached, or the entry will overstate
      a small study.
    citations:
      - PMID:41216906
  - claim_id: picalm-links-lrp1-and-p-glycoprotein-clearance
    statement: >-
      The late-onset Alzheimer risk gene PICALM associates with both ABCB1
      P-glycoprotein and LRP1 and guides both through the brain endothelium,
      making a GWAS risk locus a direct regulator of blood-brain barrier
      amyloid-beta clearance.
    disposition: RETAINED
    report_quote: "is associated with both ABCB1/P-gp and LRP1 representing a functional link and guiding both proteins through the brain endothelium"
    rationale: >-
      Verified verbatim. This is the genetic-convergence step that makes the
      clearance model more than a physiological description, and the entry lacks
      it entirely. Evidence is molecular and in vitro, so curate it as a mechanism
      rather than as human causal evidence.
    citations:
      - PMID:30041013
  - claim_id: chronic-hypoperfusion-causally-raises-amyloid
    statement: >-
      Bilateral carotid artery stenosis in Tg-SwDI mice raises soluble
      amyloid-beta 40 and 42 in parenchyma within one month alongside elevated APP
      and its proteolytic products, with insoluble amyloid, microinfarcts, and
      haemorrhage by three months.
    disposition: RETAINED
    report_quote: "A significant increase in soluble Aβ peptides (Aβ40/42) was detected after 1 month of hypoperfusion in the parenchyma in parallel with elevated APP and APP proteolytic products"
    rationale: >-
      Verified verbatim. This is the report's clearest interventional evidence
      that hypoperfusion is upstream of amyloid rather than downstream, and it is
      absent from the entry. MODEL_ORGANISM only, in a cerebral amyloid angiopathy
      model, which limits how far it generalises to parenchymal-predominant human
      disease.
    citations:
      - PMID:28667120
  - claim_id: glymphatic-failure-precedes-plaque-deposition
    statement: >-
      AppNL-F knock-in mice show reduced glymphatic influx and clearance at six
      months, before substantial amyloid plaque deposition, correlating with loss
      of parenchymal border macrophages.
    disposition: RETAINED
    report_quote: "AppNL-F mice showed reductions in glymphatic influx and clearance at 6 months, preceding substantial Aβ plaque deposition"
    rationale: >-
      Verified verbatim, and a useful temporal-ordering result absent from the
      entry. The integration worker should also carry the part the report omits,
      which is in the same abstract and is arguably more informative: four weeks
      of systemic anti-amyloid antibody treatment reduced plaque load and rescued
      border macrophages in some regions but did not restore glymphatic function,
      and the authors conclude that the glymphatic dysfunction is not driven by
      parenchymal plaques. That dissociates the two directions of the vicious
      cycle the report's causal chain asserts. Note also that the entry keeps
      glymphatic_clearance_model as a separate hypothesis block deliberately, so
      this belongs there rather than here.
    citations:
      - PMID:41762118
  - claim_id: cochrane-amyloid-removal-not-clinically-meaningful
    statement: >-
      A 2026 Cochrane review concludes that successful removal of amyloid from the
      brain does not appear to produce clinically meaningful effects in mild
      cognitive impairment or mild Alzheimer dementia.
    disposition: RETAINED
    report_quote: "successful removal of amyloid from the brain does not seem to be associated with clinically meaningful effects in people with mild cognitive impairment or mild dementia due to Alzheimer's disease"
    rationale: >-
      Verified verbatim from the authors' conclusions of the cached record, which
      also grades the effect on cognition and dementia severity at 18 months as
      trivial and on functional ability as small at best, and recommends that
      future disease-modifying research focus on other mechanisms of action. A
      strong, citable, high-level qualification of amyloid-centric models that the
      entry does not carry.
    citations:
      - PMID:41985900
  - claim_id: cochrane-aria-e-incidence-range-not-in-source
    statement: >-
      The Cochrane review found ARIA-E in 22 to 36 percent of patients on active
      treatment, with APOE4 carriers at highest risk.
    disposition: REJECTED
    report_quote: "found ARIA-E in 22–36% of patients on active treatment, with APOE4 carriers at highest risk"
    rationale: >-
      Not what that review reports. The cached record gives pooled effects, not
      per-arm incidence: an absolute risk difference of 107 more per 1000 for any
      ARIA-E, 95 percent CI 77 to 148 more, across 11 studies and 13,595
      participants at moderate certainty. No 22 to 36 percent range and no APOE4
      subgroup statement appears in it. A 22 to 36 percent band is roughly right
      for individual agents across separate trials, so the numbers are not
      invented, but they are attributed to a source that does not contain them.
      Do not promote this figure against PMID:41985900.
    citations:
      - PMID:41985900
  - claim_id: abcb1-rs1045642-increases-risk
    statement: >-
      The ABCB1 3435C>T (rs1045642) TT genotype confers a 4.4-fold increased
      Alzheimer risk and a 13.3-fold higher likelihood of severe cognitive
      impairment.
    disposition: QUALIFIED
    report_quote: "TT carriers have a 4.4-fold increased risk of AD and a 13.3-fold higher likelihood of severe cognitive impairment"
    rationale: >-
      Both odds ratios are verified in the cached abstract, but the 13.3-fold
      figure is for scoring below 20 on the Mini-Mental State Examination, which
      the report renders as severe cognitive impairment. The study is a single
      unreplicated case-control of 150 cases and 150 controls in an Egyptian
      cohort, and effect sizes of this magnitude for a common transporter
      polymorphism are far out of line with what large Alzheimer GWAS report for
      non-APOE common variants. Usable as a lead with population and sample size
      attached; not usable as population-level evidence linking barrier
      transporter genetics to Alzheimer susceptibility.
    citations:
      - PMID:41882463
  - claim_id: vascular-to-tau-link-unestablished
    statement: >-
      The causal link from neurovascular dysfunction to tau pathology remains
      poorly established, since tau spreading follows its own prion-like
      propagation logic.
    disposition: RETAINED
    report_quote: "the **causal link from neurovascular dysfunction to tau pathology** remains poorly established"
    rationale: >-
      An honest and correctly scoped limitation, and the most important one for
      this hypothesis: tau burden rather than amyloid is the stronger correlate of
      cognitive decline, so a model that explains amyloid accumulation but not tau
      has bounded explanatory reach. Nothing in the entry records this boundary.
      It is the natural content for a discussions entry with kind KNOWLEDGE_GAP
      attached to this hypothesis, with the report's Test 3 as the resolving
      experiment.
  - claim_id: no-human-interventional-proof-rrad-pending
    statement: >-
      No human interventional trial has shown that correcting vascular
      dysfunction prevents or slows amyloid accumulation; the rrAD trial
      (NCT02913664) tests intensive vascular risk reduction with exercise and its
      results are pending.
    disposition: RETAINED
    report_quote: "The rrAD trial (NCT02913664; [PMID: 30826452](https://pubmed.ncbi.nlm.nih.gov/30826452/)) tests intensive vascular risk reduction + exercise but results are pending"
    rationale: >-
      The identifier is correct: the cached rationale-and-methods publication
      carries NCT02913664 and describes 640 cognitively normal hypertensive
      adults randomised over two years. One correction for anyone curating this as
      a clinical_trials entry: the primary outcomes are neurocognitive, with MRI
      at baseline and 24 months, so rrAD will not deliver the serial amyloid PET
      endpoint the report's own Gap 1 says is needed. The absence claim itself is
      the load-bearing part and it is why the hypothesis stays ALTERNATIVE.
    citations:
      - PMID:30826452
  - claim_id: stage-dependent-paradoxical-cbf-tau-association
    statement: >-
      Cerebral blood flow associations with tau are stage-dependent: inverse in
      mild cognitive impairment and positive in established Alzheimer disease, so
      the model's assumption of monotonic perfusion decline does not hold.
    disposition: RETAINED
    report_quote: "in early AD, tau correlates with hypoperfusion, but in established AD, tau paradoxically correlates with increased CBF"
    rationale: >-
      Verified against the cached abstract: in 416 ADNI participants, total tau
      and p-tau181 were inversely associated with left temporal pole flow in mild
      cognitive impairment, while in the Alzheimer group widespread positive
      tau-flow correlations emerged, including p-tau181 with posterior cingulate
      at beta 0.850. Cross-sectional, so the stage pattern is between-group rather
      than within-subject. This is a real constraint on the entry's current
      description, which asserts perfusion changes as a straightforward early
      contributor.
    citations:
      - PMID:40884970
  - claim_id: cl-0000669-is-pericyte-not-pericyte-cell-death
    statement: >-
      CL:0000669 names pericyte cell death and can be used for a pericyte
      degeneration pathophysiology node.
    disposition: REJECTED
    report_quote: "Node:** Pericyte degeneration (CL:0000669 — pericyte cell death)"
    rationale: >-
      CL:0000669 is pericyte in this repository's term cache, a cell type rather
      than a process, so it cannot carry a degeneration node's meaning. Use it as
      a cell_types binding on the node and leave the degeneration in the node
      name. CL:0000359 is likewise cached as vascular associated smooth muscle
      cell, not vascular smooth muscle cell, and GO:0035633 is maintenance of
      blood-brain barrier rather than blood-brain barrier maintenance, so both
      need their canonical labels. GO:0097242 amyloid-beta clearance, GO:0006956
      complement activation, and CL:0000127 astrocyte do resolve as written;
      CL:0002583, CL:0000881, and GO:0015238 are not cached and would need
      validation first.
  - claim_id: status-alternative-retained
    statement: >-
      The hypothesis status should remain ALTERNATIVE.
    disposition: RETAINED
    report_quote: "**Recommended status: ALTERNATIVE (retain)**"
    rationale: >-
      Explicit and correct: do not change the status slot on the basis of this
      report. The report's conditional suggestion of an ESTABLISHED CONTRIBUTING
      tier if rrAD reports positively is not expressible, since
      MechanisticHypothesisStatusEnum permits only CANONICAL, ALTERNATIVE,
      EMERGING, and DEPRECATED.
  - claim_id: corpus-size-exceeds-committed-record
    statement: >-
      The report rests on systematic evaluation of over 110 publications.
    disposition: NEEDS_VERIFICATION
    report_quote: "After systematic evaluation of over 110 publications spanning human clinical studies, animal models, in vitro systems, and computational analyses"
    rationale: >-
      The committed retrieval record lists 35 identifiers, and no search protocol
      or screening log is committed. The claim also mentions computational
      analyses, of which the report contains none. Its coverage and absence
      statements should be read as provider assertions rather than as
      systematic-review findings.

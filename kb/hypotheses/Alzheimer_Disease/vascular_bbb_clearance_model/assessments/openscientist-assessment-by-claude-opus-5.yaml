analyses:
  - analysis_id: literature-corpus-screen
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Provider-side literature retrieval and synthesis into an executive
      judgment, six key findings, an evidence matrix, an annotated causal chain
      with link-strength grading, knowledge gaps, and curation leads.
    input_data_source_ids:
      - pubmed
    status_reason: >-
      The report claims systematic evaluation of over 110 publications, while the
      committed retrieval record lists 35 identifiers. No search expression,
      inclusion criteria, or screening log is committed, so the screen cannot be
      shown to have run as described. The report's own limitations section
      concedes the search was a single iteration.
    limitations: >-
      The report acknowledges that null findings on blood-brain barrier
      dysfunction are probably underrepresented and calls for a dedicated review
      of negative evidence, which is exactly the coverage question the missing
      protocol prevents anyone from checking.

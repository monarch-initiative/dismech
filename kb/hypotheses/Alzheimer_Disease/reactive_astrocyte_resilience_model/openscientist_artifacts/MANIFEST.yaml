comparison: 'Objective 1 (Supp Data 2 ''Fig. 3f''): Astro AD-resilient vs AD-strict adjusted P=0.00149687
  and (strict - resilient) median PAC difference=+0.38617 (strict 0.43096 vs resilient 0.04479); Astro
  ranks 16 of 27 subclasses by P-adj (neuronal subclasses separate most strongly). Objective 2 (astrocyte
  DEG tables Supp7 ''AD PAC DEGs'', Supp1 ''Fig. 2f'' donor+PAC, Supp3 Depression-astrocyte): EMP1 (A2)
  down in AD-PAC (log2FC=-0.99, higher in inferred-resilient direction) and FKBP5 (A1) up (log2FC=+0.96,
  impaired-like) match the neuroprotective/neurotoxic model, but directional A2-vs-A1 Fisher is null (Supp7
  OR=1.0 p=0.83; pooled OR=0.5 p=0.89; BH q=1.0) because HLA-E/GBP2/SERPING1 (A1) are also down; pan-reactive
  overlap Fisher OR=12.8 raw p=0.0098 (BH q=0.059). Objective 3 (Supp Data 6 ''Avg. PAC scores AD progression'',
  n=581 donors): all 17 excitatory/inhibitory subclasses correlate positively with Astro PAC (Spearman
  rho 0.168-0.570, all BH q<0.05).'
limitations:
- Re-analysis of published derived scores; shares data lineage with the source paper (not independent
  replication).
- Donor PAC matrices carry donor ID only (no diagnosis/Braak/resilience labels); no direct resilient-vs-strict
  astrocyte DE was possible. The 'higher-in-resilient' direction is INFERRED via Fig.3f (resilient donors
  have lower Astro PAC).
- Astrocyte DEG tables are significant-only; the enrichment background is the union of genes reported
  across Supp7 subclass blocks (11145 genes), not the full transcriptome.
- Group means and Cohen's d are not recoverable from published summary statistics; log2FC is the effect-size
  convention. Group sizes reflect documented balanced donor subsets (Supp Data 5).
- H2-T23 mapped to human HLA-E; IIGP1 skipped (no 1:1 human ortholog).
- Objective 1 and EMP1/FKBP5 directions largely restate quantities the paper already computed.

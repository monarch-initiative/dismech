schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: reactive_astrocyte_resilience_model
assessed_at: "2026-09-26T03:20:00Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The provider downloaded the open Supplementary Data of He et al. 2026
  (PMID:42778763), which is derived from the controlled PsychAD cohort, and
  re-analysed three published tables without inventing donor labels. Astrocytes
  do separate AD-strict from AD-cognitive-resilient donors (adjusted P 1.5e-3),
  but rank only 16th of 27 subclasses; neuronal subclasses dominate. EMP1 is
  lower and FKBP5 higher in the disease-associated astrocyte state, as the model
  predicts, but the aggregate neuroprotective-versus-neurotoxic marker test is
  null (OR 0.5 to 1.0, p 0.83 to 0.89) and rests on four to eight markers.
  Astrocyte scores correlate positively with every neuronal subclass within
  donors (rho 0.17 to 0.57), which favours a shared donor-level burden gradient
  over an astrocyte-specific resilience axis. Two readings in the report go
  further than the data: the EMP1/FKBP5 directions come from AD-versus-control
  tables, so "higher on the resilient side" is an inference, and the two tables
  called independent share one cohort. All five result tables were reproduced
  byte-identically by an assessor replay, but the report lacks the exact
  ANALYSIS_STATUS: SUCCEEDED line, so the analysis is PARTIAL. Every result
  shares data lineage with the seed paper and is not replication.
artifacts:
  - openscientist-assessment-by-claude-code.yaml
artifact_root: ../openscientist_artifacts
data_sources:
  - data_source_id: he2026-supplementary-data
    source_type: PUBLICATION_SUPPLEMENT
    name: He et al. 2026 Nature Medicine Supplementary Data 1-7 (MOESM3_ESM.zip)
    identifier: doi:10.1038/s41591-025-04128-1
    uri: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41591-025-04128-1/MediaObjects/41591_2025_4128_MOESM3_ESM.zip
    retrieved_at: "2026-09-26T02:15:00Z"
    access_status: ACCESSED
    cohort: >-
      PsychAD dorsolateral prefrontal cortex snRNA-seq, 1,494 donors; derived
      tables cover 581 donors (AD progression), 425 (AD) and 210 (depression)
    organism: Homo sapiens
    tissue: dorsolateral prefrontal cortex
    assay: >-
      Published derived tables: donor-by-subclass mean phenotype-associated-cell
      scores, subclass resilience contrasts, and PAC-level DEG tables
    source_artifacts:
      - ../openscientist_artifacts/MANIFEST.yaml
      - ../openscientist_artifacts/samples.csv
    notes: >-
      Zip sha256 27901070... (13,893,637 bytes) recorded in MANIFEST.yaml. The
      assessor independently downloaded the same URL and obtained the same
      bytes. The raw zip is recoverable from its URL and is not committed.
      Directly relevant: the tables are the seed paper's own results for this
      hypothesis. They carry donor IDs only, with no diagnosis, Braak or
      resilience labels.
  - data_source_id: psychad-controlled-snrnaseq
    source_type: PUBLIC_DATASET
    name: PsychAD_NPS
    identifier: synapse:syn60084804
    uri: https://doi.org/10.7303/syn60084804
    access_status: CITED_NOT_ACCESSED
    cohort: 1,494 donors
    organism: Homo sapiens
    tissue: dorsolateral prefrontal cortex
    assay: single-nucleus RNA-seq
    notes: >-
      Controlled access under an AD Knowledge Portal data use agreement. Not
      accessed, by instruction; it is the only source of the donor phenotype
      labels that a direct resilient-versus-strict astrocyte contrast would
      need.
analyses:
  - analysis_id: astro-resilience-supplement-reanalysis
    status: PARTIAL
    auditability: REPRODUCIBLE
    method: >-
      (1) Read the resilient-versus-strict subclass contrast (Supp Data 2 Fig.
      3f) and ranked Astro by adjusted P. (2) Classified astrocyte DEGs from
      Supp Data 7 'AD PAC DEGs' and Supp Data 1 'Fig. 2f' against prespecified
      pan-reactive, A1 and A2 marker sets; Fisher overlap against an
      11,145-gene union background and a directional A2-versus-A1 Fisher test,
      BH-corrected. (3) Spearman correlation of donor Astro PAC with each of 17
      neuronal subclasses in Supp Data 6 'Avg. PAC scores AD progression'
      (n = 581), BH-corrected.
    comparison: >-
      AD-strict versus AD-cognitive-resilient (as published); AD-PAC+ versus
      AD-PAC- astrocytes; within-donor co-variation across subclasses.
    input_data_source_ids:
      - he2026-supplementary-data
    software:
      - software_name: python
        software_version: "3.12.13"
      - software_name: numpy
        software_version: "2.3.5"
      - software_name: pandas
        software_version: "3.0.3"
      - software_name: scipy
        software_version: "1.17.1"
      - software_name: statsmodels
        software_version: "0.14.6"
      - software_name: openpyxl
        software_version: "3.1.5"
    parameters:
      - "marker sets prespecified in the analysis objective; H2-T23 mapped to HLA-E, IIGP1 dropped (no 1:1 human ortholog)"
      - "enrichment background: union of genes across Supp Data 7 subclass blocks (11,145 genes)"
      - "multiple testing: Benjamini-Hochberg within each test family"
      - "no donor labels inferred; resilient direction taken from Fig. 3f"
    code_artifacts:
      - ../openscientist_artifacts/analysis.py
    environment_artifact: ../openscientist_artifacts/environment.txt
    output_artifacts:
      - ../openscientist_artifacts/samples.csv
      - ../openscientist_artifacts/gene_results.csv
      - ../openscientist_artifacts/fig3f_resilience.csv
      - ../openscientist_artifacts/enrichment_results.csv
      - ../openscientist_artifacts/correlation_results.csv
      - ../openscientist_artifacts/comparison.md
      - ../openscientist_artifacts/replay/samples.csv
      - ../openscientist_artifacts/replay/gene_results.csv
      - ../openscientist_artifacts/replay/fig3f_resilience.csv
      - ../openscientist_artifacts/replay/enrichment_results.csv
      - ../openscientist_artifacts/replay/correlation_results.csv
    status_reason: >-
      Fully auditable: committed code, pinned environment, checksummed outputs,
      provider replay copies, and an assessor replay in an isolated environment
      with the pinned versions that regenerated all five CSV tables
      byte-identically from the same input zip. PARTIAL rather than SUCCEEDED
      because the provider's report does not contain the exact
      ANALYSIS_STATUS: SUCCEEDED line the template requires, so
      just validate-hypothesis-analysis-run fails on the marker; the assessor
      did not add it. The runner's download had dropped MANIFEST.yaml,
      analysis.py and environment.txt, which were restored from OpenScientist
      job 19cc0c3f's artifacts zip. The manifest's repository-relative paths
      were rewritten to artifact-relative and the input identifier fields were
      added, recorded in assessor_corrections with the pre-correction sha256
      (1b9436dd...). No analysis bytes changed.
    limitations: >-
      The inputs are the seed paper's own derived scores, so nothing here is
      independent of PMID:42778763. Without donor labels no direct
      resilient-versus-strict astrocyte DE was possible. The astrocyte DEG
      tables list significant genes only, which constrains the background and
      leaves the directional marker test with four to eight genes. Cohen's d
      and group means are not recoverable from summary tables.
claims:
  - claim_id: astro-separates-resilience-modestly
    statement: >-
      Astrocytes separate AD-strict from AD-cognitive-resilient donors
      significantly but rank 16th of 27 subclasses, behind most neuronal
      subclasses.
    disposition: QUALIFIED
    report_quote: >-
      the AD-strict group carries the higher astrocyte phenotype-associated-cell burden
    rationale: >-
      Reproduced by the assessor replay, and the report correctly marks it as a
      restatement of the paper's Fig. 3f values. It weakens the model's
      emphasis on astrocytes: the leading resilience separators are neuronal.
    analysis_ids:
      - astro-resilience-supplement-reanalysis
  - claim_id: emp1-fkbp5-direction
    statement: >-
      EMP1 is lower and FKBP5 higher in the disease-associated astrocyte state.
    disposition: QUALIFIED
    report_quote: >-
      The two flagship genes behave exactly as the model predicts:
    rationale: >-
      The log2FC values are reproduced, but they come from AD-PAC+ versus
      AD-PAC- (AD versus control) tables, not from a resilient-versus-strict
      contrast. Reading lower-in-AD as higher in resilient donors is an
      inference the report states as a finding. The report also calls the two
      tables independent; both derive from the same PsychAD donors, so the
      agreement is internal consistency, not replication.
    analysis_ids:
      - astro-resilience-supplement-reanalysis
  - claim_id: a1-a2-axis-not-supported
    statement: >-
      The aggregate neuroprotective-versus-neurotoxic marker axis is not
      supported in the published astrocyte DEGs.
    disposition: QUALIFIED
    report_quote: >-
      but does not cleanly resolve into the classical binary A1/A2 polarity
    rationale: >-
      Reproduced (directional OR 1.0, p = 0.83 on Supp Data 7; pooled OR 0.5,
      p = 0.89). It is a null result on very few informative markers, so it
      shows the axis is not detectable in these tables rather than refuting
      it; several A1 markers (HLA-E, GBP2, SERPING1) run against the model.
      Qualified rather than retained because the run's execution claim is
      contract-invalid (missing status marker).
    analysis_ids:
      - astro-resilience-supplement-reanalysis
  - claim_id: shared-burden-gradient
    statement: >-
      Donor astrocyte PAC scores correlate positively with every neuronal
      subclass, consistent with a shared donor-level burden gradient.
    disposition: QUALIFIED
    report_quote: >-
      donors with high astrocyte PAC also tend to have high neuronal PAC
    rationale: >-
      Reproduced (17 of 17 positive, rho 0.17 to 0.57, all BH q < 0.05). The
      report rightly offers it as an alternative to an astrocyte-specific
      axis. Part of the correlation may come from how PAC scores are
      constructed per donor, which these tables cannot separate from biology,
      as the provider's own comparison.md notes.
    analysis_ids:
      - astro-resilience-supplement-reanalysis
  - claim_id: overall-verdict-partial-support
    statement: >-
      The model is partially supported at the single-gene level and not
      supported at the aggregate-axis level.
    disposition: QUALIFIED
    report_quote: >-
      partially supported at the single-gene level and not supported at the aggregate-axis level
    rationale: >-
      Accepted with the caveat that the single-gene support is itself an
      AD-versus-control inference. The assessor's overall reading is
      WEAKLY_SUPPORTED_UNRESOLVED: the decisive test needs the controlled
      PsychAD labels or an independent cohort with resilience phenotyping.
    analysis_ids:
      - astro-resilience-supplement-reanalysis
  - claim_id: run-recorded-as-succeeded
    statement: >-
      The run is recorded as SUCCEEDED.
    disposition: REJECTED
    report_quote: >-
      direct analysis completed, clean replay byte-identical, no fallback used
    rationale: >-
      The computation is sound and was independently reproduced, but the
      report lacks the exact ANALYSIS_STATUS: SUCCEEDED line, so by policy the
      execution claim is invalid and the analysis is PARTIAL with REPRODUCIBLE
      auditability. A provider rerun or attestation adding the marker would
      let the gate pass without changing the bundle.
    analysis_ids:
      - astro-resilience-supplement-reanalysis

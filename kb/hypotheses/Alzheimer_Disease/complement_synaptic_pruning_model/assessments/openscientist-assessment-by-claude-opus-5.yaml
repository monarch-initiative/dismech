    disposition: RETAINED
    report_quote: "C3 elevated in AD brain and at synapses, and in CSF correlating with tau"
    rationale: >-
      Verified against the fetched abstract, with the snippet taken from the source
      rather than the report's paraphrase. Promoted as HUMAN_CLINICAL evidence.
      This is the finding that required me to revise the discussion's claim about

  - claim_id: complement-in-human-tauopathy
    statement: >-
      Complement dysregulation with C1q deposition on tau aggregates occurs in
      tauopathy, including in human post-mortem tissue, where amyloid is absent.
    disposition: RETAINED
    report_quote: "complement tagging of synapses with loss of the CSMD1 checkpoint in **human** tauopathy tissue"
    rationale: >-
      The paper was verified and its mouse C1q-on-tau-aggregates result promoted
      with a source snippet. The human-tissue and CSMD1-checkpoint elements of the
      report's phrasing were not promoted, because the abstract text I could verify
      covers the P301S mouse arm; the human arm is stated in the title and design
      but its specific findings sit beyond the portion I validated.
    citations:
      - PMID:42271460
  - claim_id: complement-genetics-cr1-clu
    statement: >-
      Common-variant genetics independently implicates the classical complement
      pathway in Alzheimer disease through the CR1 and CLU loci.
    disposition: RETAINED
    report_quote: "human common-variant genetics independently implicating the classical complement pathway"
    rationale: >-
      Verified in a meta-analysis reporting risk association at CR1 and protective
      association at CLU. Promoted, and the report's argument for why it matters —
      that genetic association cannot be downstream of pathology — was adopted into
      the discussion, because it is the strongest available answer to the objection
      that every human complement finding could be a consequence rather than a
      cause.
    citations:
      - PMID:29504051
  - claim_id: executing-step-unproven-in-humans
    statement: >-
      No human study demonstrates glial phagocytosis of structurally intact
      synapses via complement opsonization.
    disposition: RETAINED
    report_quote: "No human study demonstrates that microglia (or astrocytes) actually *phagocytose structurally intact synapses* **via complement opsonization**."
    rationale: >-
      Correct, and stated more precisely than the discussion originally had it.
      The distinction between the phenomenon being human-confirmed and the pathway
      being human-implicated, with no join between them, was adopted directly.
  - claim_id: complement-not-uniformly-pathogenic
    statement: >-
      Complement is simultaneously protective for amyloid clearance and harmful
      for synapses, so the model must not be read as uniformly pathogenic.
    disposition: RETAINED
    report_quote: "complement is simultaneously *protective* (amyloid clearance; C3 KO increases plaque burden — Shi 2017) and *harmful* (synapse pruning)"
    rationale: >-
      Already curated in this entry from PMID:28566429 before the run; the report
      independently reaches the same qualification, which is mild corroboration
      that the existing curation is not idiosyncratic. No change made.
    citations:
      - PMID:28566429
  - claim_id: additional-human-complement-biomarkers
    statement: >-
      Cerebrospinal fluid C3, C4 and CR1 elevations track disease progression,
      and plasma C1q and clusterin are elevated and predictive across

    disposition: NEEDS_VERIFICATION
    report_quote: "CSF C3/C4/CR1 elevations tracking disease progression (Daborg 2012, PMID:22488444)"
    rationale: >-
      Plausible and consistent with the promoted C3 result, but I fetched only the

summary: >-
  The most consequential of the four reports assessed so far, because it corrected
  an assertion I had made in the opposite direction from the usual failure mode.
  I had curated the human arm of this model as thin — "human corroboration of
  complement specifically is limited to C1q accumulating in postsynaptic
  densities, reported within a mouse study." That understated it, and the report
  produced three independent lines I had missed.

  First, PMID:31433986 reports C3 protein elevated in Alzheimer patient brains
  including at synapses, with cerebrospinal fluid C3 tracking tau — human
  evidence for the opsonizing component at the relevant subcellular location. The
  same study is a second laboratory reproducing the necessity result across both
  an amyloid and a tauopathy model. Second, PMID:42271460 extends complement
  dysregulation to human tauopathies where amyloid is absent, with C1q deposited
  on tau aggregates. Third, and the report is right that this carries the most
  weight, common-variant genetics implicates CR1 and CLU (PMID:29504051):
  inherited association is the one class of human evidence here that cannot be a
  downstream consequence of established pathology.

  What survives unchanged is the actual mismatch, and the report states it more
  sharply than I had: no human study shows glia phagocytosing structurally intact
  synapses via complement opsonization. The phenomenon is human-confirmed
  (PMID:37652017) and the pathway is human-implicated; the join between them is
  not. ALTERNATIVE status is correct and unchanged — the executing step is
  unproven in humans and a named competitor, MFG-E8, holds the only direct human
  phagocytosis evidence.

  On the dataset question, the report reached the same negative as the necroptosis
  run and for an analogous reason: engulfment is a phagocytic event and opsonin
  identity is a protein-level question, so single-nucleus data can show where and
  when complement genes are induced but cannot close the gap. That limitation is
  now recorded in the discussion rather than left implicit.

  Spot-checking found no fabricated quotation; all five identifiers I fetched
  resolved to the titles the report gave them, including two 2025-2026 papers.
claims:

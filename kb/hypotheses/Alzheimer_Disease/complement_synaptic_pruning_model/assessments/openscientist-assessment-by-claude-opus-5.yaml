    disposition: RETAINED
    report_quote: "Retaining the **ALTERNATIVE** status is correct."
    rationale: >-
      Concordant with the curated status. The report's reasoning for it — that the
      executing step is unproven in humans and a named competitor holds the only
      direct human phagocytosis evidence — matches the HUMAN_MODEL_MISMATCH
      discussion already attached to this node.
  - claim_id: c3-at-synapses-human-brain
    statement: >-
      Complement C3 is elevated in Alzheimer patient brains including at

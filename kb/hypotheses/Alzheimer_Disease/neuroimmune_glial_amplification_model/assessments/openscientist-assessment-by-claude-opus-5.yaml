claims:
  - claim_id: overall-verdict-partially-supported
    statement: >-
      Neuroimmune-glial amplification is an established disease-amplifying
      mechanism in Alzheimer disease rather than a sufficient standalone causal
      model.
    disposition: RETAINED
    report_quote: "**Verdict: PARTIALLY SUPPORTED — established as a disease-amplifying mechanism, but not sufficient as a standalone causal model.**"
    rationale: >-
      Concordant with the curated ALTERNATIVE status and with the entry's
      existing description of the pathways as stage-dependent and
      disease-modifying. The verdict is correct but is not new information: the
      seed hypothesis and its notes already said this, so it is seed-derived.
    citations:
      - PMID:29293211
      - PMID:34100905
  - claim_id: asc-speck-amyloid-cross-seeding
    statement: >-
      Microglia-released ASC specks bind amyloid-beta, increase oligomer and
      aggregate formation, and spread amyloid pathology after intrahippocampal
      injection in transgenic APP mice.
    disposition: RETAINED
    report_quote: "ASC specks released by activated microglia bind rapidly to Aβ and increase formation of Aβ oligomers and aggregates"
    rationale: >-
      Verified against the cached Venegas 2017 Nature abstract, which states the
      binding, the increased oligomer and aggregate formation, and the spreading
      after intrahippocampal injection in APPSwePSEN1dE9 mice. PMID:29293211 is
      already cited in the disorder entry, so this is confirmation rather than a
      curation lead.
    citations:
      - PMID:29293211
  - claim_id: inpp5d-ripk1-nlrp3-axis
    statement: >-
      Microglial INPP5D deficiency promotes RIPK1-mediated transcriptional
      induction of NLRP3, complement components, and proinflammatory mediators,
      linking a late-onset Alzheimer risk gene to inflammasome activation.
    disposition: RETAINED
    report_quote: "INPP5D deficiency in microglia promotes RIPK1-mediated transcriptional induction of NLRP3, complement genes, and proinflammatory cytokines"
    rationale: >-
      Verified against the cached Immunity 2026 abstract, which reports the
      INPP5D SH2 domain interacting with RIPK1 at p-Y383 to suppress its kinase
      activation, and cell-autonomous induction of LOAD risk genes, cytokines,
      complements, ROS mediators, TLRs, MyD88, Nlrp3, gasdermin D, and Zbp1 on
      INPP5D loss. Absent from the disorder entry and the most valuable new
      mechanistic source in this report.
    citations:
      - PMID:41633359
  - claim_id: hdac6-dual-bace1-nlrp3-regulator
    statement: >-
      HDAC6 stabilises BACE1 and facilitates NLRP3 inflammasome activation, so
      HDAC6 loss reduces amyloid deposition, ASC speck formation, and IL-1beta
      together in 5xFAD mice.
    disposition: RETAINED
    report_quote: "HDAC6 facilitates both BACE1 stability (increasing Aβ production) and NLRP3 activation"
    rationale: >-
      Verified against the cached Brain 2026 abstract, including deacetylation of
      BACE1 at K501 and the combined reduction in BACE1 accumulation, amyloid
      deposition, ASC specks, and IL-1beta with improved cognition in HDAC6
      deficient 5xFAD mice. Absent from the entry, and a genuine convergence node
      between amyloid production and inflammasome activation.
    citations:
      - PMID:41789727
  - claim_id: activated-microglia-transfer-compound-proteinopathy
    statement: >-
      Transplanting amyloid-beta oligomer-activated microglia into the striatum
      of naive mice is sufficient to generate tauopathy, synucleinopathy,
      gliosis, synapse loss, neuronal death, and behavioural deficits.
    disposition: RETAINED
    report_quote: "Aβ-activated microglia transplant induces tau, α-syn, neurodegeneration"
    rationale: >-
      Verified against the cached Brain 2024 abstract, which additionally reports
      that the pathology was eliminated by microglial depletion and by
      anti-inflammatory treatment. This is the strongest transfer-of-sufficiency
      experiment in the report for microglia as an amplifier, and it is absent
      from the disorder entry. Evidence is MODEL_ORGANISM only.
    citations:
      - PMID:39194073
  - claim_id: preclinical-glial-biomarker-elevation
    statement: >-
      Plasma GFAP and CSF sTREM2 are already elevated in cognitively unimpaired
      individuals in the preclinical Alzheimer phase, and CSF sTREM2 relates to
      CSF p-tau181 and neurogranin.
    disposition: RETAINED
    report_quote: "Plasma GFAP and CSF sTREM2 are increased in cognitively unimpaired individuals who are amyloid-positive"
    rationale: >-
      Verified against the cached Alzheimers Dement 2025 abstract, a structural
      equation model over 211 cognitively unimpaired participants, which reports
      exactly these directions plus the CSF sTREM2 influence on p-tau181 and
      neurogranin. Absent from the entry. Note the design is cross-sectional
      modelling, so it establishes early timing but not causal direction, which
      the report states correctly.
    citations:
      - PMID:40747577
  - claim_id: protective-microglial-counterweight
    statement: >-
      TREM2 loss and microglial ablation increase amyloid-associated tau seeding
      and spreading, so microglia restrain as well as amplify pathology.
    disposition: RETAINED
    report_quote: "both TREM2 knockout and microglial ablation dramatically enhance Aβ-associated tau seeding and spreading around plaques"
    rationale: >-
      Verified against the cached Gratuze 2021 J Exp Med abstract. Correct, and
      the report is right that it qualifies the model. It is not new to the
      knowledge base: PMID:34100905 is already curated on this hypothesis block
      with a nearly identical snippet, and the block description already frames
      the pathways as protective or pathogenic by stage. Seed-derived; no
      integration action needed.
    citations:
      - PMID:34100905
  - claim_id: trem2-r47h-attenuates-tau-driven-neurodegeneration
    statement: >-
      The TREM2 R47H risk variant attenuates brain atrophy and synapse loss in
      the PS19 tauopathy model, with reduced microglial reactivity and reduced
      phagocytosis of postsynaptic elements.
    disposition: RETAINED
    report_quote: "TREM2-R47H mice showed **attenuated** brain atrophy and synapse loss versus TREM2-CV in a PS19 tauopathy model"
    rationale: >-
      Verified against the cached JCI 2020 abstract, which also reports reduced
      microglial phagocytosis of postsynaptic elements in human Alzheimer brain,
      giving the finding a human arm the report does not mention. Absent from the
      entry, and it is the mirror image of the Gratuze result already curated:
      the same variant is protective against tau-driven degeneration and harmful
      for amyloid-associated tau spread. The report's added gloss, that microglia
      may be the primary driver rather than an amplifier in pure tauopathy, is an
      interpretation rather than a result of this paper.
    citations:
      - PMID:32544086
  - claim_id: nlrp3-tau-link-contested
    statement: >-
      NLRP3 inflammasome activation and pyroptosis are dispensable for tau
      seeding and phosphorylation in P301S organotypic brain slice cultures.
    disposition: QUALIFIED
    report_quote: "NLRP3 inflammasome activation and pyroptosis are dispensable for tau pathology in P301S organotypic brain slice cultures"
    rationale: >-
      The finding is real and PMID:39381137 is already curated in the entry. Two
      qualifications. The scope is one ex vivo slice-culture system without
      peripheral immune input, which the report acknowledges. More importantly,
      the snippet the report proposes for curation is the paper's background
      paragraph describing prior positive NLRP3-to-tau results, which asserts the
      opposite of the claim being made; the report itself flags this in a
      parenthesis. Anyone acting on this lead must quote the paper's own result,
      not that background sentence.
    citations:
      - PMID:39381137
  - claim_id: a1-astrocyte-axis-cited-to-a-neurohiv-study
    statement: >-
      Microglial TNF-alpha, IL-1alpha, and C1q drive astrocytes to a neurotoxic
      A1-like state, evidenced by PMID:41345807.
    disposition: REJECTED
    report_quote: "Activated microglia secrete TNF-α, IL-1α, and C1q, which drive astrocytes into an A1-like neurotoxic phenotype"
    rationale: >-
      Wrong source. PMID:41345807 is a Mol Neurobiol study of A1-like astrocyte
      polarization in the presence of HIV-1 Tat and its consequences for
      blood-brain barrier function; Alzheimer disease appears only in its
      background. The sentences the report attributes to it, including the claim
      that A1-like astrocytes correlate with Alzheimer progression and severity,
      are that paper's restatement of the Liddelow paradigm, not its results. The
      underlying biology is well established, but the report grades this as
      high-confidence in vitro support for an Alzheimer mechanism and never cites
      the primary source. Do not promote this identifier for this claim.
    citations:
      - PMID:41345807
  - claim_id: nsaid-failure-and-timing-hypothesis
    statement: >-
      Long-term NSAID and COX-2 trials in Alzheimer disease failed, and the
      failure is explained by inhibition of protective microglial amyloid
      clearance once deposition has begun.
    disposition: QUALIFIED
    report_quote: "once deposition has started, NSAIDs may be detrimental because they inhibit activated microglia that mediate Aβ clearance"
    rationale: >-
      The trial failures are verified in the cached abstract, including the
      negative rofecoxib secondary-prevention and naproxen/celecoxib primary
      prevention studies. The timing explanation, however, is explicitly
      hypothesised by that author rather than demonstrated, and PMID:19589092 is
      a 2009 review that the report grades as human clinical trial evidence. Cite
      it for the failures; carry the timing account as an interpretation.
    citations:
      - PMID:19589092
  - claim_id: gwas-immune-locus-enrichment
    statement: >-
      Recent Alzheimer GWAS meta-analyses identify more than 75 susceptibility
      loci enriched for innate immune, phagocytosis, and endocytosis genes.
    disposition: QUALIFIED
    report_quote: "The largest GWAS meta-analyses identify 75+ AD susceptibility loci enriched for genes in the innate immune system, phagocytosis, and endocytosis pathways"
    rationale: >-
      The locus count is verified: the cached abstract reports 90 independent
      variants across 75 loci from two GWAS. The qualification is provenance.
      PMID:36907103 is an EBioMedicine review of the genetic architecture, not
      the primary GWAS, and the report grades it as human genetic evidence with
      very high confidence. Anyone curating this should cite the underlying GWAS
      publications instead.
    citations:
      - PMID:36907103
  - claim_id: recommended-status-change-not-in-schema
    statement: >-
      The hypothesis status should be changed from ALTERNATIVE to PARTIALLY
      SUPPORTED or DISEASE MODIFIER.
    disposition: REJECTED
    report_quote: "**Recommended status:** PARTIALLY SUPPORTED (or DISEASE MODIFIER)"
    rationale: >-
      Not expressible. MechanisticHypothesisStatusEnum permits only CANONICAL,
      ALTERNATIVE, EMERGING, and DEPRECATED, so neither proposed value can be
      written to the entry. On the substance the recommendation is also wrong for
      this vocabulary: ALTERNATIVE already means a plausible competing or
      superimposed hypothesis with supporting evidence, which is exactly what the
      report concludes. Retain ALTERNATIVE.
  - claim_id: corpus-size-exceeds-committed-record
    statement: >-
      The report rests on a systematic evaluation of 84 primary research articles
      and reviews.
    disposition: NEEDS_VERIFICATION
    report_quote: "After systematic evaluation of 84 primary research articles and reviews spanning human genetics, molecular biology, biomarker studies, animal models, and clinical trials"
    rationale: >-
      The committed retrieval record lists 38 identifiers, and no search
      expression, screening log, or inclusion criteria are committed anywhere in
      the hypothesis directory. The 84 figure cannot be checked, and the gap
      between claimed corpus and committed record is large enough that the
      report's coverage statements, including its source-level absence claims,
      should not be treated as systematic.

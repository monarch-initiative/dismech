schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: neuroimmune_glial_amplification_model
assessed_at: "2026-09-04T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A literature-only run with an unusually good citation hit rate. I fetched every
  identifier behind a consequential claim into references_cache/ and compared the
  report's wording against the cached source; ten of eleven checked identifiers
  resolve to the paper the report describes, and the quantitative statements
  match the abstracts.

  Its central thesis adds nothing the knowledge base did not already hold. The
  seed came from the entry, and the entry's neuroimmune_glial_amplification_model
  block had already been rewritten as a stage-dependent dual-function model
  carrying PMID:34100905 (Gratuze) for the protective plaque-barrier arm. The
  report rediscovers that framing and presents it as its headline qualification.
  That is seed-derived material and is scored here as such.

  What the report does add is four primary sources the entry lacks, each of which
  I verified against the cached abstract: the INPP5D to RIPK1 to NLRP3 axis
  (PMID:41633359, Immunity 2026), HDAC6 as a dual regulator of BACE1 stability
  and inflammasome activation (PMID:41789727), transplantation of amyloid-beta
  oligomer-activated microglia into naive mouse striatum generating tau and
  alpha-synuclein pathology plus neurodegeneration (PMID:39194073), and a 211
  participant cognitively unimpaired cohort placing plasma GFAP and CSF sTREM2
  elevation in preclinical disease (PMID:40747577). PMID:32544086 (TREM2-R47H in
  PS19) is likewise absent from the entry and is verified, including its human
  post-mortem arm.

  Two defects matter. PMID:41345807, cited for the microglia to A1 astrocyte
  axis and graded high-confidence in vitro support, is a neuroHIV study of HIV-1
  Tat; the sentences the report attributes to it are that paper's background
  restatement of the Liddelow paradigm, and the canonical source is never cited.
  Second, the recommended status change is to a value the schema does not have:
  MechanisticHypothesisStatusEnum permits only CANONICAL, ALTERNATIVE, EMERGING
  and DEPRECATED, so neither PARTIALLY SUPPORTED nor DISEASE MODIFIER can be
  written, and the curated ALTERNATIVE status should stand.

  No artifact bundle exists, so nothing computational is auditable. The report
  claims a systematic evaluation of 84 articles against a committed citation
  record of 38 identifiers, and its source-level absence claims about GenCC,
  ClinGen and the trial registries carry no query, date, or response log.

summary: >-
  The first attempt at this hypothesis failed with an API 502 and produced no
  report; this is the retry. The report is the strongest of the three assessed so
  far, and notably it answered the dataset question in the negative, which is
  what the template was written to permit.

  Its central dataset finding is that none of the five supplied transcriptomic
  datasets can confirm the model's core execution claim, because MLKL activation
  is post-translational. Transcript abundance of RIPK1, RIPK3, MLKL or MEG3 is an
  indirect proxy; cell-resolved data can test where the programme is engaged, but
  only phospho-protein or imaging data can show it executing. I had written that
  caveat into the prompt, so the report agreeing with it is weak evidence — but it
  went further, correctly separating the localization prediction (testable now)
  from the execution claim (not testable with these data) and naming the
  within-donor tangle-bearing contrast as the one analysis worth running. That
  separation is a real contribution and is now recorded in the node notes.

  Two findings changed curated content. PMID:35971179 shows hyperphosphorylated
  tau assembles the RIPK1/RIPK3/MLKL necrosome in neuronal cells, with a
  pharmacological rescue in TauP301S mice. This supplies the upstream trigger the
  node entirely lacked — Necroptotic Neuronal Death previously had no incoming
  edge at all — and a tau-to-necroptosis edge was added. PMID:29238035 qualifies
  the proposed upstream trigger from the other direction: in ischemic injury the
  same long non-coding RNA, MEG3, drives neuronal death through a caspase-
  dependent apoptotic route, so MEG3 looks like a general pro-death effector whose
  downstream modality is context-dependent rather than a necroptosis-specific one.

  The report also surfaced a cell-type attribution ambiguity worth carrying:
  necroptosis in Alzheimer disease is separately framed as an innate-immune glial
  programme (PMID:35741014), so a transcriptomic necroptosis signal could come
  from glia rather than neurons. Recorded in the node notes.

  Spot-checking found no fabricated quotation. One error propagated from my own
  prompt rather than the provider: the dataset context file for this run still
  carried GEO's linked PMID (41620473) for GSE129308 rather than the originating
  Otero-Garcia study (PMID:35882228). I had corrected the disease entry but not
  the scratch prompt file before this run was launched, so the report repeats it.

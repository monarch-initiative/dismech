overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A genuinely useful report with one disqualifying fabrication. What it got
  right: the overall verdict (PARTIALLY SUPPORTED, retain EMERGING) matches the
  curated KB status; it correctly identified real, relevant primary papers
  (VALAD RCT, two antiviral cohorts, the seed petabase-scale study); three of
  four numeric claims I spot-checked reproduce their abstracts exactly; and its
  most valuable contribution is a clean prevention-vs-treatment framing —
  observational antiviral/zoster prevention signals are positive while the only
  interventional trial in symptomatic AD (VALAD) is null-to-harmful. Those three
  verified items were promoted (after independent fetch + snippet validation)
  into the antiviral-suppression knowledge-gap discussion on the disorder entry.

  What it got wrong: for the HSV-AD association meta-analysis (PMID:40934136) the
  report presents a verbatim-quoted "snippet" giving OR = 1.46 (95% CI 1.14-1.86,
  I2 = 3.1%). The real abstract reports OR = 1.32 (95% CI 1.12-1.55, I2 = 22.7%)
  for case-control studies and ~20% for cohort studies. The paper was retrieved
  correctly (right authors, 26 studies, n = 1,213,193; the ~1.20 cohort figure
  the report also gives is roughly right), but the case-control quote is
  fabricated: the OpenScientist job trace (job f2a99ecc, provenance
  iter1_transcript.json msg#50) shows the figure first appears in the agent's own
  update_knowledge_state tool call, never in a tool/retrieval result — an
  agent-authored confabulation stamped as a verbatim quotation, the single most
  dangerous DR failure mode. 1.46 is suspiciously close to the neighbouring meta
  it cites (PMID:33317741 = 1.40), suggesting cross-contamination. That figure
  was rejected and not curated.

  Provenance caveat: the saved trace captured only the agent's own turns, not the
  tool results, so search_pubmed outputs cannot be independently audited from the
  artifact bundle — a gap worth closing in the OpenScientist integration.
claims:
  - claim_id: overall-verdict-partially-supported
    statement: >-
      The HSV-1 reactivation model is partially supported with strong biological
      plausibility but unresolved causality, and should remain EMERGING.
    disposition: RETAINED
    report_quote: "PARTIALLY SUPPORTED — Retain as EMERGING"
    rationale: >-
      Concordant with the curated KB status and with the primary evidence the
      entry already cites. Discounted as weak confirmation, however: the prompt
      template passed the full seed YAML including status EMERGING, so agreement
      is close to what anchoring alone predicts. No status change is warranted.
    citations:
      - PMID:42094473
  - claim_id: hsv1-rorb-cell-type-core
    statement: >-
      Cell-type-resolved human transcriptomic data localizes HSV-1 expression to
      the RORB+ glutamatergic neuron population progressively lost in dementia,
      supporting the seed mechanism.
    disposition: QUALIFIED
    report_quote: >-
      cell-type-resolved human transcriptomic data places HSV-1 expression
      specifically in the RORB+ neuronal population that is progressively lost
      during dementia
    rationale: >-
      Faithful restatement of the seed evidence (PMID:42094473) and correctly
      framed. Qualified, not retained outright, because it is cross-sectional
      post-mortem association: it cannot establish that reactivation causes RORB+
      neuron loss rather than marking already-committed neurons — a limitation
      the report itself flags and the entry already curates as an open knowledge
      gap.
    citations:
      - PMID:42094473
  - claim_id: hsv-ad-meta-or-1p46
    statement: >-
      The most recent HSV-AD meta-analysis (26 studies) found HSV-1 infection
      associated with 46% higher odds of AD, OR = 1.46 (95% CI 1.14-1.86,
      I2 = 3.1%).
    disposition: REJECTED
    report_quote: >-
      HSV-1 infection was associated with 46% higher odds of AD (OR = 1.46; 95%
      CI: 1.14, 1.86; I² = 3.1%)
    rationale: >-
      Fabricated verbatim quotation. The cited paper (PMID:40934136) actually
      reports OR = 1.32 (95% CI 1.12-1.55, I2 = 22.7%) for case-control studies
      and ~20% increased risk for cohort studies — verified against the fetched
      abstract. The paper was retrieved correctly (right authors, 26 studies,
      n = 1,213,193), and the report's separate ~1.20 cohort figure is roughly
      right, but the case-control OR, CI, and I2 are all wrong and are presented
      inside quotation marks as a direct quote. The OpenScientist job trace
      (job f2a99ecc; provenance/iter1_transcript.json msg#50) shows the figure
      originating in the agent's own update_knowledge_state call, not in any
      tool result. Not curated; 1.46 likely cross-contaminated from the adjacent
      meta-analysis PMID:33317741 (OR 1.40).
    citations:
      - PMID:40934136
  - claim_id: valad-refutes-treatment
    statement: >-
      The phase II VALAD RCT found valacyclovir gave no cognitive benefit and
      possibly greater decline in early symptomatic AD, refuting anti-HSV
      treatment of established disease (not the upstream hypothesis).
    disposition: RETAINED
    report_quote: >-
      the valacyclovir group showed *greater* cognitive worsening than placebo
      (between-group difference: 3.93, 95% CI: 1.03–6.83; P = 0.01)
    rationale: >-
      Verified exactly against the JAMA 2026 abstract (PMID:41405855): ADAS-Cog
      between-group difference 3.93 (95% CI 1.03-6.83), P = .01, favoring
      placebo. The report also correctly scopes this as refuting the therapeutic
      claim in symptomatic AD while leaving the upstream reactivation hypothesis
      and pre-symptomatic prevention open. Promoted to the disorder entry as
      REFUTE evidence.
    citations:
      - PMID:41405855
  - claim_id: antiviral-meta-prevention
    statement: >-
      A meta-analysis of 14 cohort studies (HSV and VZV) found anti-herpetic
      treatment associated with lower incident dementia (aHR 0.77 for
      diagnosed-and-treated vs diagnosed-but-untreated).
    disposition: RETAINED
    report_quote: >-
      diagnosed and treated versus diagnosed but untreated (aHR = 0.77, 95% CI:
      0.67–0.89)
    rationale: >-
      Verified against the abstract (PMID:41467972): non-demented adults >=50,
      HSV and VZV, aHR 0.77. Correctly characterized as an observational
      prevention-side signal. Notably covers VZV, bridging to the zoster-vaccine
      natural-experiment evidence. Promoted to the disorder entry as SUPPORT.
    citations:
      - PMID:41467972
  - claim_id: trinetx-antiviral-prevention
    statement: >-
      A propensity-matched TriNetX cohort found antiviral therapy for
      oral/mucocutaneous HSV associated with lower risk of AD (RR 0.87) and
      dementia (RR 0.83).
    disposition: RETAINED
    report_quote: >-
      antiviral treatment for oral/mucocutaneous HSV significantly reduced the
      risk of AD (RR 0.87; 95% CI 0.73–0.92) and dementia (RR 0.83; 95% CI
      0.77–0.90)
    rationale: >-
      Verified exactly against the abstract (PMID:41779765): 231,277 matched
      pairs, RR 0.87 for AD and 0.83 for dementia. Correctly noted that
      confounding by indication and healthy-user bias cannot be excluded.
      Promoted to the disorder entry as SUPPORT.
    citations:
      - PMID:41779765

summary: >-
  The seventh and last report. Its first attempt timed out server-side after
  7200 seconds with no output; a retry at two iterations rather than three
  completed. Worth recording that the fix was a smaller job, not more time — the
  provider caps timeout at 7200s and rejects a larger value outright.

  The report's most useful act was to check a justification I had written into
  this node and find it over-read. I had said the node "gives the entry's
  Oligodendrocyte Precursor Cell Plasma Proteomic Age Gap biomarker a mechanism
  to attach to". That biomarker comes from a plasma clock spanning more than
  forty cell types (PMID:42297981), and in that study the strongest APOE4-linked
  Alzheimer signal is astrocyte aging — verified in the cached full text, which
  reports that APOE4 carriers show older astrocytes and that extreme astrocyte
  aging tripled incident Alzheimer risk in APOE4 homozygotes. The biomarker is
  consistent with this model but does not privilege it, and the notes now say so.
  This is the clearest case in the whole set of a report auditing my reasoning
  rather than supplying new literature.

  Two further corrections were promoted. Reverse-direction evidence is
  non-trivial: oligodendrocyte-progenitor and myelin changes appear early as a
  consequence of amyloid and tau pathology in 3xTg-AD mice (PMID:32619874), so
  oligodendrocyte disruption can be downstream of proteinopathy rather than
  upstream of it. And the microglial-diversion sub-mechanism should be read as
  SPECULATIVE rather than merely less replicated — the report ran a targeted
  search for independent primary support of that clearance edge and found none,
  which is a checked absence rather than an unexamined gap.

  The report also confirmed the access problem I had flagged in the prompt: no
  human dataset can establish the directional claim, and the decisive human
  material behind the APOE4-myelination work is controlled-access through
  Synapse. That is a genuine dead end for an automated agent, and the notes
  record it as such rather than proposing an analysis that cannot be run.

  Spot-checking found no fabricated quotation.

claims:
  - claim_id: arc-tau-ev-core-mechanism
    statement: >-
      Arc binds tau directly, is required for packaging tau into neuronal extracellular
      vesicles, and its loss almost abolishes intercellular tau transmission in a
      tau transgenic mouse.
    disposition: RETAINED
    report_quote: |-
      This study demonstrated near-complete abolition of intercellular tau transmission in Arc knockout mice crossed with rTg4510 tau transgenic animals, and showed a strong positive correlation between Arc and phosphorylated tau levels in brain-derived EVs from human Alzheimer's disease (AD) brains.
    rationale: >-
      Verified against the cached abstract of PMID:42372723, which is a real Cell 2026
      paper and states both halves in terms the report reproduces faithfully. Two details
      worth carrying into curation that the report leaves out: the knockout cross also
      reduced EV tau seeding potential, not just tau content, and the knockout animals show
      "increased accumulation of intracellular tau and a modest increase in cell toxicity
      early in disease progression" — which is the concrete form of the donor-protective,
      network-detrimental duality the seed hypothesis asserts.
    citations:
      - PMID:42372723
  - claim_id: maintain-emerging-status
    statement: >-
      The hypothesis should remain EMERGING until the Arc-tau interaction and the knockout
      transmission phenotype are independently replicated.
    disposition: RETAINED
    report_quote: |-
      - **Recommended status:** Maintain as EMERGING until independent replication of Arc-tau binding and Arc KO phenotype
      - **Trigger for upgrade to SUPPORTED:** Independent replication + demonstration with AD-type tau + quantitative in vivo contribution data
      - **Trigger for downgrade:** Failed replication of Arc-tau binding by independent lab, or demonstration that Arc KO has no effect on tau spreading in AD-type (non-P301L) tau models
    rationale: >-
      The right call, and the stated upgrade and downgrade triggers are unusually concrete
      and worth preserving as curation notes. One mechanical caveat: SUPPORTED and
      ESTABLISHED, used elsewhere in the report, are not values of
      MechanisticHypothesisStatusEnum, which permits only CANONICAL, ALTERNATIVE, EMERGING
      and DEPRECATED. The actionable recommendation — leave it at EMERGING — is unaffected.
    citations:
      - PMID:42372723
  - claim_id: no-independent-replication
    statement: >-
      No independent replication of the Arc-tau binding interaction or the Arc knockout
      transmission phenotype existed as of July 2026.
    disposition: RETAINED
    report_quote: |-
      First, no independent replication of the Arc-tau binding interaction or the Arc KO transmission phenotype exists as of July 2026.
    rationale: >-
      Consistent with the publication date — the foundational paper appeared online ahead of
      print in Cell in June 2026, a month before this search — so the absence is expected
      rather than suspicious, and the report handles it honestly. One thing to add, which
      the report does not mention and which strengthens rather than undermines its own
      point: the paper's senior author discloses co-founding VNV, LLC and consulting for
      Aera Therapeutics, which licenses intellectual property and patents covering Arc
      capsids. Single-source results with commercial interest in the mechanism are exactly
      where independent replication carries the most weight, and the disclosure belongs
      beside this gap in any curated knowledge-gap entry.
    citations:
      - PMID:42372723
  - claim_id: eight-month-pathology-convergence
    statement: >-
      By 8 months, tau pathology was similar in Arc knockout and control rTg4510 animals,
      implying compensatory propagation routes dominate at later disease stages.
    disposition: NEEDS_VERIFICATION
    report_quote: |-
      However, a critical caveat emerged: by 8 months in the transgenic model, tau pathology was similar between Arc-KO and control animals, suggesting that Arc loss does not overtly accelerate late-stage pathology despite blocking early transmission. This convergence implies that compensatory propagation mechanisms operate at later disease stages.
    rationale: >-
      This is one of the report's two most consequential qualifying claims — it is what
      motivates Gap 6 and Discussion Prompt 2, which proposes restricting the model to early
      disease — and it cannot be verified from what the repository holds. The statement is
      not in the abstract of PMID:42372723; the report itself records under Gap 6 that what
      was checked was "The primary Tyagi et al. 2026 report", meaning full text we do not
      have cached. The abstract does describe an early-stage phenotype in the knockout
      (increased intracellular tau, modest toxicity increase), which is compatible with the
      claim but is not the claim. Anyone acting on the proposed early-stage subtype
      restriction must read the paper first.
    citations:
      - PMID:42372723
  - claim_id: most-extracellular-tau-is-free
    statement: >-
      Most extracellular tau is free-floating rather than vesicle-encapsulated, so the
      quantitative contribution of vesicle-mediated spread in vivo is unresolved.
    disposition: RETAINED
    report_quote: |-
      Critically, Guix et al. (2018; [PMID: 29495441](https://pubmed.ncbi.nlm.nih.gov/29495441/)) showed that "in each case, most tau was free-floating with a small component inside EVs," raising the question of whether EV-mediated spread is quantitatively significant in vivo.
    rationale: >-
      The proposed snippet is an exact substring of the cached abstract, so the lead is
      usable as supplied (note the report's body lowercases the sentence-initial "In"; the
      Candidate Evidence Reference 3 version preserves the capital and is the one to copy).
      The report undersells its own find in the evidence matrix, where the context is given
      as "Primary neurons" and the confidence as Moderate. The measurements were made in
      induced-pluripotent-stem-cell-derived neuron conditioned media, human cerebrospinal
      fluid and human plasma, so two of the three sample types are human clinical material.
      That makes it the strongest quantitative challenge in the report and the best
      counterweight to the model's central claim.
    citations:
      - PMID:29495441
  - claim_id: abeta-arc-paradox
    statement: >-
      Amyloid deposition locally suppresses Arc expression, so an Arc-dependent propagation
      route would be attenuated precisely where amyloid pathology is heaviest.
    disposition: RETAINED
    report_quote: |-
      Wegenast-Braun et al. (2009; [PMID: 19556514](https://pubmed.ncbi.nlm.nih.gov/19556514/)) demonstrated "reductions in both the number of Arc-activated neurons and the levels of Arc mRNA were seen in the neocortices of depositing mice from all transgenic lines (deficits ranging from 14 to 26%)" and up to 58% in dentate gyrus near amyloid plaques.
    rationale: >-
      Verified exactly, including the harder details: three transgenic lines (APPPS1,
      APPDutch, APP23), a 14 to 26% neocortical deficit, and "striking reductions (up to 58%
      in aged APPPS1 mice)" in dentate gyrus. The paper also reports proximity to fibrillar
      amyloid and transient intracellular granular amyloid as independent contributors to
      reduced Arc, which is what makes the local-suppression reading legitimate rather than
      a correlation. This is the report's genuine intellectual contribution: nothing in the
      seed asked for it, and it is a real tension in the model rather than a restatement.
      The proposed snippet is exact and usable as MODEL_ORGANISM evidence.
    citations:
      - PMID:19556514
      - PMID:42372723
  - claim_id: tangles-do-not-suppress-arc
    statement: >-
      Neurons bearing neurofibrillary tangles express Arc in response to stimulation as
      readily as neighbouring tangle-free neurons, so tau pathology does not disable the
      proposed packaging mechanism.
    disposition: QUALIFIED
    report_quote: |-
      Rudinskiy et al. (2014; [PMID: 24915991](https://pubmed.ncbi.nlm.nih.gov/24915991/)) demonstrated in the rTg4510 mouse model that neurons with tangles are as likely to express comparable amounts of Arc in response to visual stimulation as neighbors without tangles.
    rationale: >-
      I did not fetch this identifier, so the attribution is unverified here; the claim is
      biologically plausible and the report uses it consistently. Two scope limits should
      travel with it if it is curated: the readout is visually driven Arc induction in mouse
      visual cortex, which is a narrow probe of "Arc function", and rTg4510 P301L tangles
      are not Alzheimer paired helical filaments. It supports the weaker statement that
      tangle-bearing neurons remain capable of activity-dependent Arc induction, not that
      Arc-dependent packaging is unimpaired.
    citations:
      - PMID:24915991
  - claim_id: no-genetic-support-for-arc
    statement: >-
      Four genetic and protein resources show no association between ARC and Alzheimer
      disease, so the model lacks human genetic validation.
    disposition: QUALIFIED
    report_quote: |-
      A systematic database survey (July 2026) revealed no genetic support for ARC in AD. UniProt (Q7LC44) lists no disease annotations. Open Targets shows an ARC-AD association score of only 0.1043, driven entirely by literature evidence (subscore 0.8577) with no genetic/GWAS, somatic mutation, or drug target evidence. GWAS Catalog lists 20 SNPs at the ARC locus but none associated with AD or cognitive traits. GenCC has no curations for ARC.
    rationale: >-
      Almost certainly correct, and a legitimate and useful source-level absence — it is the
      strongest structural argument for keeping the hypothesis at EMERGING, and it is the
      contrast the report draws well against the tunneling-nanotube alternative, which does
      carry Alzheimer risk-gene links through LRRK2 and TREM2. Qualified rather than
      retained because none of the four surveys is documented: no query, no release version,
      no timestamp, no saved response. The Open Targets figures in particular are quoted to
      four decimal places against a platform that rescores on every release. Curate the
      absence as a knowledge gap with a note that it was reported by a provider survey and
      needs re-derivation, not as evidence.
  - claim_id: endolysosomal-permeabilization-is-the-gate
    statement: >-
      Tau seeding from vesicles requires endolysosomal permeabilization, which is the
      rate-limiting step for cytosolic seed delivery.
    disposition: RETAINED
    report_quote: |-
      Polanco et al. (2021; [PMID: 33417012](https://pubmed.ncbi.nlm.nih.gov/33417012/)) revealed the gating mechanism: "tau aggregation was only induced in cells that exhibited permeabilization" of endolysosomes, establishing this as the critical bottleneck for EV-tau seeding.
    rationale: >-
      Snippet verified as an exact substring. This is the most curatable mechanistic node in
      the report because it is downstream of, and independent of, the contested Arc step:
      it holds whatever packages the tau. Curate as a pathophysiology node with an incoming
      edge from vesicle uptake and an outgoing edge to cytosolic templated aggregation. The
      experiments are in HEK293T biosensor cells, so grade the evidence IN_VITRO.
    citations:
      - PMID:33417012
  - claim_id: arc-capsid-biology-plausibility
    statement: >-
      Arc self-assembles into virus-like capsids that are released in extracellular vesicles
      and transfer cargo between neurons, making an Arc-dependent tau packaging route
      biologically plausible.
    disposition: RETAINED
    report_quote: |-
      Pastuzyn et al. (Cell, 2018; [PMID: 29328916](https://pubmed.ncbi.nlm.nih.gov/29328916/)) showed that "Arc self-assembles into virus-like capsids that encapsulate RNA" and is released from neurons in EVs that transfer Arc mRNA to target cells.
    rationale: >-
      Snippet verified as an exact substring, and the surrounding gloss matches the abstract,
      which also states that endogenous Arc is released in extracellular vesicles mediating
      transfer of Arc mRNA into target cells. Note for curation that the demonstrated cargo
      is Arc's own mRNA; extending capsid-mediated transfer from RNA to a bound protein is
      the inference the foundational Arc-tau paper makes, not something this 2018 work
      establishes. Cite it for plausibility of the vehicle, not for tau.
    citations:
      - PMID:29328916
  - claim_id: tau-strain-snippet-is-a-retitled-title
    statement: >-
      PMID:33693528 should be added with the snippet "Disease-specific tau strains determine
      substrates recruited for templated amplification".
    disposition: REJECTED
    report_quote: |-
      6. **Add [PMID: 33693528](https://pubmed.ncbi.nlm.nih.gov/33693528/)** as qualifying evidence for tau strain specificity.
         - Snippet: Disease-specific tau strains determine substrates recruited for templated amplification
         - Evidence source: IN_VITRO
    rationale: >-
      The only defective lead in an otherwise clean set, and it fails twice. The proposed
      string is a lightly reworded version of the paper's own title, "Human tauopathy-derived
      tau strains determine the substrates recruited for templated amplification", so it is
      both a title used as a finding and not an exact substring of anything. The paper
      supplies a far better sentence: "The seeding activity towards full-length four-repeat
      tau substrate was highest in CBD-tau seeds, followed by PSP-tau and Alzheimer's
      disease (AD)-tau seeds, while AD-tau seeds showed higher seeding activity than PiD-tau
      seeds towards three-repeat tau substrate." Use that. Note also that the report's
      compression of it in Finding 10 invites a misreading: Alzheimer tau seeds better than
      Pick disease tau on a three-repeat substrate; it does not follow that Alzheimer tau
      prefers three-repeat over four-repeat.
    citations:
      - PMID:33693528
  - claim_id: feed-forward-hyperexcitability-loop
    statement: >-
      Hyperexcitability induces Arc, which increases vesicle tau packaging and release,
      which raises excitability in recipient neurons, forming a self-amplifying loop.
    disposition: QUALIFIED
    report_quote: |-
      However, this loop remains entirely inferred and has not been directly tested experimentally.
    rationale: >-
      The report deserves credit for labelling its own most attractive idea as untested, and
      that label should be preserved rather than quietly dropped in curation. Each link has
      separate support — Arc is an immediate-early gene, and cerebrospinal-fluid tau raises
      single-neuron excitability per PMID:37095572 — but no experiment closes the circuit,
      and the amyloid-Arc paradox in this same report cuts against the loop operating where
      Alzheimer pathology is heaviest. If integrated at all, this belongs as a discussion
      entry with the loop stated as a question, never as pathophysiology edges.
    citations:
      - PMID:37095572
  - claim_id: declared-artifact-bundle-is-absent
    statement: >-
      The report's figures and provenance artifacts are available under
      openscientist_artifacts/ for inspection.
    disposition: REJECTED
    report_quote: |-
      - [OpenScientist final report](openscientist_artifacts/final_report.html)
    rationale: >-
      No such directory exists. The hypothesis folder contains exactly two files, the report
      and its citation sidecar. The Artifacts section links about twenty files — the final
      report as HTML and PDF, and paired JSON and PNG provenance files for the causal chain,
      evidence matrix, competing mechanisms, mechanism comparison, feed-forward loop, final
      verdict, integrated evidence map and eight plots — and the body embeds seven inline
      figure placeholders. All are dead. This matters beyond tidiness because the executive
      judgment defers to a "final verdict" figure for its evidence tiering and the evidence
      matrix is duplicated into a figure the reader cannot see, so the report's own claimed
      provenance chain terminates in nothing. No artifact_root is declared in this
      assessment for the same reason.

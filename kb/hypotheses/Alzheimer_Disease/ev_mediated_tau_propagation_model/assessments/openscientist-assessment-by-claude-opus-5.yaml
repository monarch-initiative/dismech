overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The strongest of the four Alzheimer reports I assessed in this sweep, and unusually
  self-critical: it identifies its own single-source dependency, names the disease-stage
  convergence that cuts against it, and surfaces a genuine internal tension (the
  amyloid-Arc paradox) that no one asked it to look for. Every proposed evidence snippet I
  tested was an exact substring of the cached source — six for six, which none of the other
  three reports managed. The foundational paper is real and says what the report says it
  says: PMID:42372723 (Tyagi et al., Cell, 2026) contains the sentences "intercellular tau
  transmission is almost absent in Arc KO mice" and "Arc levels in brain-derived EVs
  isolated from human Alzheimer's disease (AD) brains show a strong positive correlation
  with phosphorylated EV-tau levels" verbatim. The Wegenast-Braun figures (14 to 26% across
  three APP transgenic lines, up to 58% in aged APPPS1 dentate gyrus), the Fitzpatrick
  filament core residues, the tau-strain seeding directions, and the ApoE4 cohort sizes
  (ADNI n = 237, Avid-A05 n = 130) all check out exactly.

  Three things hold it at PARTIALLY_SUPPORTED rather than higher.

  The Arc-specific mechanism rests on one paper, and the report is right to say so. I would
  add something it does not: that paper's senior author discloses being a co-founder of VNV,
  LLC and a consultant for Aera Therapeutics, which licenses patents covering Arc capsids.
  That does not weaken the result, but it is exactly the context in which independent
  replication matters most, and it belongs beside the replication gap.

  The report's provenance does not survive contact with the repository. Its Artifacts
  section links about twenty files under openscientist_artifacts/ — the final report in two
  formats plus paired JSON and PNG provenance files for the causal chain, evidence matrix,
  competing mechanisms, feed-forward loop, final verdict and eight plots — and the body
  carries seven inline figure placeholders. None of that directory is committed. Every
  figure the narrative points at is missing, and the four database surveys that produce its
  most quotable negative finding (Open Targets score 0.1043, literature subscore 0.8577,
  twenty GWAS Catalog SNPs at the ARC locus, GenCC empty) have no committed query, release
  version, or response.

  And one factual attribution cannot be checked. The 8-month convergence between Arc
  knockout and control tau pathology is attributed to the primary paper, is load-bearing for
  the report's disease-stage caveat, and is not in the abstract we hold.
artifacts: []

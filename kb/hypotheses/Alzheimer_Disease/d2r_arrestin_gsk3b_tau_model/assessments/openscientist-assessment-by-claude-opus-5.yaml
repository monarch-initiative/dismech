claims:
- claim_id: negative-search-tau-arm-never-measured
  statement: >-
    No study has measured tau or GSK-3beta-dependent phospho-epitopes after
    aripiprazole in any Alzheimer or tauopathy model.
  disposition: REJECTED
  report_quote: >-
    A PubMed search for `aripiprazole tau phosphorylation amyloid Alzheimer
    model` returned **zero** papers.
  rationale: >-
    PMID:32587124 measures Abeta accumulation, GSK-3beta, P300, acetylated tau
    and phospho-tau in N2a-Swe cells expressing the human APP Swedish mutation,
    with aripiprazole as one of three drugs in the tested combination. The
    report's own search log records the query as a bare multi-term string, and
    the report elsewhere notes that this index has low recall on over-specific
    multi-term queries - so the zero is a query artifact. Re-run with field tags
    and Boolean operators the same question returns 41 records.

    This matters beyond a citation correction. The claim is load-bearing: the
    report calls the tau arm "the decisive gap", makes it knowledge gap 1, and
    cites it in the verdict as what keeps the hypothesis from promotion. The
    honest finding is narrower and more useful - the readout has been taken
    once, in a cell line, in a three-drug combination with no aripiprazole-alone
    arm, through a SIRT1/PI3K route rather than an arrestin one, and it moved in
    the direction the seed predicts. That reframes the decisive experiment from
    "measure this for the first time" to "isolate aripiprazole's contribution in
    vivo", which is a different and cheaper study.
  citations:
  - PMID:32587124
- claim_id: directional-conflict-with-ad-dopamine-literature
  statement: >-
    The seed's premise that D2 receptor over-activation is pathogenic runs
    against the prevailing Alzheimer dopamine framework, which describes early
    VTA dopaminergic degeneration and hypodopaminergia.
  disposition: RETAINED
  report_quote: >-
    The core premise runs against the prevailing AD-dopamine model** (the
    strongest caveat)
  rationale: >-
    The report's single most valuable contribution, and correct. PMID:28367951
    is strong primary evidence: age-dependent VTA dopaminergic neuron loss in
    Tg2576 at pre-plaque stages, sparing the substantia nigra, with reduced
    hippocampal and nucleus accumbens dopamine outflow tracking CA1 plasticity
    and memory deficits. PMID:29778899 and PMID:29630556 extend it. The seed
    asserted its direction without testing it against this literature, and the
    assessor who wrote the seed should have checked it first.
  citations:
  - PMID:28367951
  - PMID:29778899
  - PMID:29630556
- claim_id: hyperprolactinemia-review-read-as-pure-contradiction
  statement: >-
    The dopamine-depletion-to-GSK-3beta review contradicts the hypothesis.
  disposition: QUALIFIED
  report_quote: >-
    A 2026 review couples dopamine **depletion** to GSK-3β **activation** — the
    opposite direction (PMID:41930581).
  rationale: >-
    Accurately quoted - the review does say that hyperprolactinemia-induced
    dopamine depletion reduces inhibitory control of GSK-3beta and so raises tau
    phosphorylation. But the report stops at the sign flip and misses that the
    same framework still predicts benefit from this particular drug, by a route
    that preserves the seed's drug-level discrimination. The review proposes that
    dopamine agonists could re-establish dopaminergic suppression of GSK-3beta. A
    D2 partial agonist behaves as a functional agonist in a hypodopaminergic
    state, and aripiprazole is the antipsychotic that does not raise prolactin,
    where full antagonists do - so under this review's own mechanism aripiprazole
    is protective and haloperidol is not, which is the same drug-level split the
    seed's load-bearing result reports.

    The hypothesis is therefore better treated as needing its premise inverted
    than as refuted: keep the GSK-3beta-to-tau terminus and the drug-level
    discrimination, replace "D2R over-activation is pathogenic" with "loss of
    dopaminergic suppression of GSK-3beta is pathogenic". The discriminating
    test is unchanged and gains a second readout, prolactin.

    Source quality is weak and should be stated: a narrative review in a
    low-impact journal, with a garbled abstract and keywords listing PD-1 and
    immune checkpoint inhibitors that have nothing to do with its subject. It
    cannot carry a directional verdict on its own.
  citations:
  - PMID:41930581
- claim_id: drd2-taq1a-presented-as-genetic-evidence
  statement: >-
    DRD2 Taq1A A1, the low-receptor-density allele, is associated with higher
    Alzheimer risk.
  disposition: REJECTED
  report_quote: >-
    human genetics associate **lower** D2 receptor function (DRD2 Taq1A A1) with
    worse memory and higher AD risk (PMID:28965318, 27647283)
  rationale: >-
    PMID:28965318 reports no association analysis. It is a review whose own
    abstract says "Based on DRD2 known genetic polymorphisms, we hypothesize
    that the DRD2 Taq1A A1 allele magnifies the risk of Alzheimer's in aging
    African-Americans" - a proposal for future work, built on allele frequencies
    and an inference from long-term-memory studies. The report types it as
    "human (genetic)" with stance "contradict (direction)" and annotates it
    "Association; not a tau readout", which grants it a standing it does not
    have. PMID:27647283 is a real memory-phenotype association study and does
    support the memory half of the sentence, so the citation pair is not empty -
    but one of the three pillars of the report's directional case is an
    untested hypothesis, and the report's own knowledge gap 6 separately
    concedes that no DRD2 Alzheimer-risk association was retrievable. Those two
    statements cannot both stand.
  citations:
  - PMID:28965318
  - PMID:27647283
- claim_id: gsk3-inhibitor-clinical-null
  statement: >-
    Clinical failure of GSK-3 inhibition weakens the therapeutic rationale for
    the hypothesis's terminal node.
  disposition: QUALIFIED
  report_quote: >-
    direct GSK-3β inhibition failed to help AD cognition in RCTs (tideglusib
    null; PMID:31156177)
  rationale: >-
    The tideglusib figures are quoted exactly (SMD -0.02, p = 0.89), and the
    meta-analysis headline is indeed null overall (SMD -0.25, p = 0.11). But the
    same sensitivity analysis found the lithium subgroup significantly better
    than placebo (SMD -0.41, p = 0.04), and lithium is also a GSK-3 inhibitor.
    Reporting the null arm of a two-arm subgroup analysis and omitting the
    significant one overstates the headwind, and does so in the direction of the
    report's own verdict. The honest reading is that the terminal node's clinical
    rationale is unsettled rather than refuted, with the effect size of
    GSK-3-inhibitor trials associated with study duration.
  citations:
  - PMID:31156177
  - PMID:38160617
- claim_id: no-computational-nomination-of-aripiprazole
  statement: >-
    Nothing in the computational drug-repurposing literature nominates
    aripiprazole for Alzheimer disease.
  disposition: REJECTED
  report_quote: >-
    Literature-only run; no dataset/omics/structural analysis was performed
    (none provided).
  rationale: >-
    Not an error the report makes explicitly, but an absence it inherits from
    the seed and never corrects, and the seed stated it outright. PMID:35204697
    nominates aripiprazole for Alzheimer disease by name, among antipsychotics
    with circadian effects, from a deep-learning optimal-transport repositioning
    model. The earlier basis for the "no computational signal" statement was a
    single docking study whose top hits were pimozide and benperidol; one
    screen's silence is not the field's. Recorded here so the next provider run
    is not seeded with the same false negative.
  citations:
  - PMID:35204697
- claim_id: butyrylcholinesterase-mechanism-unconsidered
  statement: >-
    Aripiprazole inhibits human butyrylcholinesterase at concentrations
    compatible with its normal clinical doses, which is a candidate Alzheimer
    mechanism neither the seed nor the report considered.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    mechanistically plausible but unverified assembly* of edges borrowed from
    three different domains
  rationale: >-
    Surfaced by the assessor, not by the report, and it is the most interesting
    thing the re-run turned up after the false negative. PMID:33274491 used
    VigiBase disproportionality to find drugs whose safety profile resembles the
    anticholinesterases, then assayed the hits: aripiprazole inhibited human
    butyrylcholinesterase by over 70 percent at 10 micromolar, with an IC50 the
    authors call compatible with clinical anticholinesterase action at normal
    doses. Butyrylcholinesterase rises as acetylcholinesterase falls in the
    Alzheimer brain, so this is a live target rather than an incidental assay
    result, and it is a mechanism with a direct precedent class in the clinic.

    Needs verification before it goes anywhere: brain concentrations at clinical
    doses, whether the inhibition holds in tissue, and whether the
    pharmacovigilance signal that nominated it is anything more than shared
    adverse-event vocabulary. It is listed as a competing mechanism for this
    hypothesis, not as support for it - if aripiprazole does anything in
    Alzheimer disease, cholinesterase inhibition is a simpler explanation than a
    four-step arrestin cascade, and it predicts no tau change at all.
  citations:
  - PMID:33274491
- claim_id: backbone-pathway-edges-well-established
  statement: >-
    The noncanonical D2 receptor to beta-arrestin2/PP2A/Akt to GSK-3beta pathway
    is independently established biology.
  disposition: QUALIFIED
  report_quote: >-
    Upstream edges are individually well established** (high confidence)
  rationale: >-
    The pathway is real and the citations are accurate, but the report grades
    them above their standing. PMID:17681085 is quoted verbatim and correctly,
    yet the quoted sentence is that paper's introductory framing of other
    groups' work; its own results are beta-arrestin1 levels in patient
    lymphocytes and reduced phospho-Ser9-GSK-3beta in schizophrenia frontal
    cortex. In this repository's vocabulary that is a BACKGROUND quote graded as
    a primary result. PMID:23380502 does carry the complex and the
    apomorphine-recruits-PP2A-C finding as its own work, so it is correctly
    cited, though its subject is Rhes. Every edge is in schizophrenia, striatum
    or recombinant cells; none is in an Alzheimer context, which the report does
    say in its limitation column.
  citations:
  - PMID:17681085
  - PMID:23380502
  - PMID:23188793
  analysis_ids:
  - evidence-matrix-transcription
- claim_id: unc9994-discriminating-test
  statement: >-
    UNC9994, a beta-arrestin-biased analogue built on the aripiprazole scaffold,
    is an existing probe that can separate an arrestin-blocking account from a
    biased-signalling one.
  disposition: RETAINED
  report_quote: >-
    its own falsification test is feasible (UNC9994 exists and is
    arrestin-biased; PMID:22025698)
  rationale: >-
    Accurate and the report's second real contribution. PMID:22025698 confirms
    UNC9975, UNC0006 and UNC9994 were derived by diversity-oriented modification
    of the aripiprazole scaffold and are simultaneously antagonists of
    Gi-regulated cAMP production and partial agonists for D2R/beta-arrestin-2
    interactions. The probe pushes arrestin recruitment in the opposite
    direction from what the seed wants of aripiprazole, which is exactly what
    makes the comparison informative, and PMID:26129680 establishes it is active
    in vivo. The test survives the premise inversion discussed above.
  citations:
  - PMID:22025698
  - PMID:22845053
  - PMID:26129680
- claim_id: aripiprazole-dose-window
  statement: >-
    Whether any benefit is dose-dependent is testable, and the exposure used in
    the one Alzheimer-model study sits far below therapeutic D2 occupancy.
  disposition: RETAINED
  report_quote: >-
    Compare 1 mg/kg (5xFAD study) vs therapeutic-occupancy dosing; the seed's
    arrestin-antagonist reading should be dose-dependent.
  rationale: >-
    A good test, inherited from the seed and sharpened. Worth adding that the
    human dose-response is now characterised: PMID:41276485 finds aripiprazole
    10 mg significantly more effective than placebo for neuropsychiatric
    symptoms with tolerability not significantly worse up to 10 mg, which gives
    the human arm of a dose-stratified analysis a concrete anchor rather than an
    open range.
  citations:
  - PMID:41276485
- claim_id: verdict-and-no-promotion
  statement: >-
    The hypothesis should not be promoted to a curated causal edge on this
    evidence.
  disposition: RETAINED
  report_quote: >-
    It should **not** be promoted to a curated causal edge until the tau arm has
    direct support and the directional conflict is resolved.
  rationale: >-
    The right call, and it survives every correction above - indeed the
    corrections strengthen it, since the premise now looks more likely wrong
    than merely unsupported. The report's own verdict wording of weakly or
    partially supported is a fair self-assessment. This assessment grades the
    report PARTIALLY_SUPPORTED rather than lower because its reasoning structure,
    its alternative-models section and its discriminating tests are genuinely
    good work, and because most of its 25 citations say what it claims; the
    false central negative and the source-grading lapses are serious but local.
  citations:
  - PMID:32587124
  - PMID:28367951

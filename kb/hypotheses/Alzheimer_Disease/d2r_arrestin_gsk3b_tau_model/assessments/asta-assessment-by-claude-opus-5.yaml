- analysis_id: asta-relevance-retrieval
  status: REPORTED_ONLY
  auditability: UNVERIFIABLE
  method: >-
    Provider states it combines search_papers_by_relevance with snippet_search
    and performs no synthesis or second-stage model call.
  input_data_source_ids:
  - asta-scientific-corpus
  status_reason: >-
    There is no computation to verify beyond the returned list. The list is
    committed in the report so its relevance is checkable, which it was, and it
    fails; the ranking that produced it is not recoverable.
  limitations: >-
    No committed search log, no artifact directory, and no record of how the
    query string was constructed from the template. Asta emitted no ontology
    identifiers, so the run's term_validation block reports zero terms checked -
    a vacuous pass rather than a clean one, and it should not be read as
    evidence of term hygiene.
claims:
- claim_id: no-synthesis-performed
  statement: >-
    The run performs retrieval only and reaches no conclusion about the
    hypothesis.
  disposition: RETAINED
  report_quote: No synthesis or second-stage model call is performed.
  rationale: >-
    Accurate and creditable self-description. The provider does not dress a
    paper list up as an assessment, invent a verdict, or imply it evaluated
    anything. This is the right failure mode for a tool that cannot do the task
    asked of it, and it is why this assessment grades the run INCONCLUSIVE
    rather than REFUTED - there is nothing to refute.
- claim_id: retrieved-set-bears-on-the-hypothesis
  statement: >-
    The retrieved literature is relevant to the D2 receptor to arrestin to
    GSK-3beta to tau hypothesis.
  disposition: REJECTED
  report_quote: 'Papers retrieved: 19'
  rationale: >-
    Not a claim the provider makes in words, but the one its output exists to
    make, and it fails on inspection. Zero of 19 papers and zero of 20 snippets
    mention aripiprazole, arrestin, the D2 receptor, GSK-3, antipsychotics,
    haloperidol, PP2A, prolactin, tau phosphorylation or UNC9994. Zero overlap
    with the 25 papers OpenScientist cited. Several returns are off-topic for
    Alzheimer mechanism work altogether, including a 2007 Semantic Web
    bioinformatics paper and a 2026 review of MFSD2A lysolipid transport. The
    run contributes nothing to the hypothesis.
- claim_id: citations-are-genuine
  statement: >-
    The retrieved records are real publications correctly identified.
  disposition: RETAINED
  report_quote: >-
    retrieval-only and is generated directly from Asta results.
  rationale: >-
    Checked rather than assumed. Four of the 14 PMIDs in the report were
    resolved against PubMed and all four returned matching titles. The failure
    is relevance, not confabulation, which matters for what to do next: the
    provider is trustworthy about what it returns and unsuited to being asked
    this question this way.
  citations:
  - PMID:42809080
  - PMID:41256774
  - PMID:40808411
  - PMID:26733247
- claim_id: integration-sends-template-as-query
  statement: >-
    The hypothesis runner passes a prompt written for an agentic provider to a
    retrieval provider as a relevance query, which is the likely cause of the
    miss.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    This provider combines `search_papers_by_relevance` with `snippet_search`.
  rationale: >-
    Assessor inference, offered as a tooling lead and not as a finding about the
    science. The report's own title line is the rendered template's first
    instruction sentence run into the heading, which indicates the whole
    template reached the provider as text. If that is how the query is formed,
    the result is predictable: a long document whose most frequent topical
    signal is Alzheimer's disease retrieves general Alzheimer's papers, and the
    mechanism-specific terms are diluted below threshold. Testing it is cheap -
    submit the hypothesis label and description alone and compare the returned
    set - and worth doing before concluding anything about Asta's corpus
    coverage of dopamine-arrestin signalling, which this run does not establish
    either way.

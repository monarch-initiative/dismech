source_report: ../asta.md
hypothesis_id: d2r_arrestin_gsk3b_tau_model
assessed_at: '2026-10-28T00:00:00Z'
overall_verdict: INCONCLUSIVE
summary: >-
  Asta is a retrieval endpoint, not a hypothesis-exploration agent, and this run
  produced no assessable claim about the hypothesis. The report says so plainly:
  retrieval-only, no synthesis, no second-stage model call. It ran in 25 seconds
  against OpenScientist's 16 minutes, emitted no ontology terms, created no
  artifact bundle, and offers no verdict, evidence matrix, alternative models or
  discriminating tests. It therefore cannot serve as the second opinion on the
  directional conflict that this run was commissioned to get.

  The retrieval itself missed completely. Across all 19 returned papers and 20
  snippets there is not one occurrence of aripiprazole, arrestin, D2 receptor,
  GSK-3, antipsychotic, haloperidol, PP2A, prolactin, tau phosphorylation or
  UNC9994 - every term the hypothesis is made of. What came back is generic
  Alzheimer review and drug-discovery material plus clear irrelevancies: a
  Semantic Web bioinformatics paper, a metallothionein review, an MFSD2A
  lysolipid-transport review, and a 2011 TH17-autoimmunity item on the defunct
  Nature Precedings server. Overlap with the 25 papers OpenScientist cited is
  zero.

  The citations are nonetheless genuine. Four PMIDs were spot-checked against
  PubMed and all four resolve with matching titles, so this is a relevance
  failure, not fabrication - a distinction worth keeping, since a confabulating
  retriever would be a reason to stop using the provider whereas this is a
  reason to fix how it is called.

  The probable cause is an integration mismatch rather than a defect in Asta.
  The hypothesis runner renders one template written for an agentic provider
  that reads instructions, and passes the whole thing - task framing, seed YAML,
  output specification - to whatever provider is named. A dense retriever treats
  that as the query string, where the dominant signal is "Alzheimer's disease"
  and template boilerplate. The leaked heading in the report, which runs the
  template's first instruction sentence into the title, is the visible symptom.

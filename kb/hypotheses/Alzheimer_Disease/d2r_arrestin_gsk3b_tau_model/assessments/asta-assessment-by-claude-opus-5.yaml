    access record. The retrieval plainly happened - the records are real and
    resolve - but nothing committed lets a reader confirm what was asked or how
    the ranking fell out. The 19 returned records and 20
    snippets are listed with titles, authors, venues, years, DOIs and
    Semantic Scholar URLs, which is enough to audit relevance but not enough to
    reproduce the ranking.

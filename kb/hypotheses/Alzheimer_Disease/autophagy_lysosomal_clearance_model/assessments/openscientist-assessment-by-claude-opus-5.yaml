analyses:
  - analysis_id: literature-evidence-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative synthesis of retrieved literature into six numbered findings, an evidence
      table split by study role, and a causal chain annotated with per-node evidence
      strength.
    comparison: >-
      Evidence for the descriptive claim (autophagic and endolysosomal failure is an early
      Alzheimer feature) against evidence for the causal claim (that failure is a primary
      driver).
    input_data_source_ids:
      - pubmed-corpus-55-publications
    status_reason: >-
      No code, rubric, scoring rule, or intermediate table is committed, and the STRONG,
      MODERATE, EMERGING and INFERRED grades on the causal chain are assigned without a
      stated basis. Three figures the narrative refers to are left in the committed
      Markdown as unrendered template placeholders (evidence_matrix.png,
      mechanistic_causal_chain.png, knowledge_gaps_alternatives.png), so those artifacts
      do not exist. No artifact_root is declared because no provider artifact directory
      was committed.
    limitations: >-
      The synthesis is entirely bibliographic. No dataset was queried, no computation was
      performed, and the one quantitative reanalysis the report proposes as an immediate
      step (integrating existing single-cell datasets to score autophagy gene modules by
      cell type and Braak stage) is explicitly future work.
claims:
  - claim_id: descriptive-strong-causal-primacy-unresolved
    statement: >-
      Autophagic and lysosomal failure is well supported as an early, Alzheimer-specific
      descriptive feature, while its causal primacy relative to amyloid and tau
      accumulation remains unresolved.
    disposition: RETAINED
    report_quote: |-
      **Verdict: PARTIALLY SUPPORTED — strong descriptive and genetic evidence; causal primacy unresolved.**
    rationale: >-
      The correct reading, and it is the split that should govern how anything from this
      report is curated. The descriptive half rests on human post-mortem work I verified
      in detail; the causal half rests on cross-sectional tissue plus rodent perturbation,
      which cannot order events in human disease. Retain the hypothesis at EMERGING.
    citations:
      - PMID:9236226
      - PMID:8004466
      - PMID:30124770
  - claim_id: three-axis-status-change-not-expressible
    statement: >-
      The hypothesis status should be split into three: ESTABLISHED for the descriptive
      claim, EMERGING for the causal claim, and SPECULATIVE for the therapeutic claim.
    disposition: REJECTED
    report_quote: |-
      - **Descriptive claim** (autophagy-lysosomal dysfunction is an early, consistent feature of AD): recommend upgrade to **ESTABLISHED**
      - **Causal claim** (autophagy-lysosomal dysfunction is a primary driver of Aβ/tau accumulation): retain as **EMERGING** pending longitudinal and interventional evidence
      - **Therapeutic claim** (autophagy enhancement treats AD): classify as **SPECULATIVE** until Phase II/III data available
    rationale: >-
      Not expressible in this schema, on two counts. MechanisticHypothesisStatusEnum
      permits exactly CANONICAL, ALTERNATIVE, EMERGING and DEPRECATED; ESTABLISHED and
      SPECULATIVE are not values it has, and adding them would be a schema change, not a
      curation act. And a mechanistic hypothesis carries a single status, with no slot for
      a per-claim breakdown. The underlying distinction is genuinely useful and the report
      deserves credit for drawing it, but it belongs in the hypothesis description or
      notes as prose. Leave status at EMERGING.
  - claim_id: ps1-vatpase-v0a1-acidification-failure
    statement: >-
      Presenilin 1 is required to target the v-ATPase V0a1 subunit to lysosomes, and its
      loss selectively impairs autolysosome acidification and cathepsin activation.
    disposition: RETAINED
    report_quote: |-
      1. **[PMID: 20541250](https://pubmed.ncbi.nlm.nih.gov/20541250/)** — Verified snippet: "substrate proteolysis and autophagosome clearance during macroautophagy are prevented as a result of a selective impairment of autolysosome acidification and cathepsin activation. These deficits are caused by failed PS1-dependent targeting of the v-ATPase V0a1 subunit to lysosomes."
    rationale: >-
      Verified as an exact substring of the cached abstract, so this lead is usable as
      supplied — the only one of the four candidate snippets that is. It is the report's
      strongest mechanistic contribution: a molecular route from the commonest genetic
      cause of early-onset disease to a clearance defect. Scope it carefully, though: the
      experiments are in presenilin-null and presenilin-depleted cells, so the claim
      established is that presenilin is required for the function, not that heterozygous
      patient mutations produce the same magnitude of defect.
    citations:
      - PMID:20541250
  - claim_id: ps1-lysosomal-calcium-second-mechanism
    statement: >-
      Presenilin loss also depletes the lysosomal calcium store and alters two-pore
      calcium channel expression, so the presenilin lysosomal defect may not be purely a
      pH mechanism.
    disposition: QUALIFIED
    report_quote: |-
      Bhatt et al. ([PMID: 23103503](https://pubmed.ncbi.nlm.nih.gov/23103503/)) reported that "presenilin loss leads to a lower total lysosomal calcium store despite the buildup of lysosomes found in these cells. Additionally, we find alterations in two-pore calcium channel protein expression."
    rationale: >-
      The quotation is exact and the paper says what the report says it says. The
      qualification is one the report makes itself in Gap 2 and should be carried into any
      curation: both this and the v-ATPase result come from presenilin-null or
      presenilin-depleted cells, and neither has been weighed against the other in
      patient-derived cells carrying heterozygous PSEN1 mutations. Curate the two as
      competing or complementary readings of the same genetic lesion, not as a settled
      dual mechanism.
    citations:
      - PMID:23103503
      - PMID:20541250
  - claim_id: endolysosomal-gwas-enrichment-population-level
    statement: >-
      Autophagic and endolysosomal genes are enriched for common variants conferring
      Alzheimer risk across three genome-wide association studies totalling 62,415 people.
    disposition: RETAINED
    report_quote: |-
      Rappaport et al. ([PMID: 30124770](https://pubmed.ncbi.nlm.nih.gov/30124770/)) analyzed three GWAS datasets (combined n=62,415) and found that "autophagic and endolysosomal genes were enriched for genetic variants that convey increased risk of Alzheimer's disease; such a finding would provide population-based support for the endolysosomal hypothesis of neurodegeneration."
    rationale: >-
      Verified in full, and the proposed snippet is an exact substring. The strongest
      genuinely population-level support in the report, and the one that lifts the model
      above rodent and post-mortem correlation. Two details the report omits are worth
      more than the headline for curation: the enrichment score was 3.67 standard
      deviations (P = 0.00012) for the 891-gene autophagy and endolysosomal set and
      survived removal of the APOE locus almost unchanged (3.35 SD), whereas the
      Mendelian-lysosomal-disease subset's signal collapsed once APOE was removed (1.16
      SD, P = 0.12). That contrast is what makes this evidence for the pathway rather than
      a restatement of APOE. Note also the quoted sentence is the study's stated aim
      rather than its result, so a curator may prefer the results sentence instead.
    citations:
      - PMID:30124770
  - claim_id: abeta-dynein-snapin-transport-block
    statement: >-
      Amyloid-beta oligomers interrupt dynein-Snapin coupling on axonal autophagosomes,
      immobilizing them in distal axons and creating a feedback loop in which the
      aggregate impairs its own clearance.
    disposition: RETAINED
    report_quote: |-
      3. **[PMID: 28085665](https://pubmed.ncbi.nlm.nih.gov/28085665/)** — Verified snippet: "Amyloid-β (Aβ) oligomers associate with AVs in AD axons and interact with dynein motors. This interaction impairs dynein recruitment to amphisomes through competitive interruption of dynein-Snapin motor-adaptor coupling."
    rationale: >-
      The mechanism is real and correctly reported, and the feedback framing is a fair
      reading. But the snippet as supplied will fail validation: the source sentence
      continues "coupling, thus immobilizing them in distal axons", and the report
      terminates it early with a period that is not in the source. Extend the quotation to
      the true sentence end when promoting it. The immobilization clause is also the part
      that carries the mechanistic payload, so extending it improves the evidence as well
      as fixing the match.
    citations:
      - PMID:28085665
  - claim_id: endosomal-enlargement-early-and-disease-specific
    statement: >-
      Early endosomes in Alzheimer pyramidal neurons are enlarged up to 32-fold, the change
      is present at early disease stages, and it is absent in several other
      neurodegenerative disorders.
    disposition: RETAINED
    report_quote: |-
      Cataldo et al. ([PMID: 9236226](https://pubmed.ncbi.nlm.nih.gov/9236226/)) demonstrated that individual endosomes display up to **32-fold larger volumes** than the normal average in AD neurons, with an average **2.5-fold larger total endosomal volume per neuron** in AD versus controls, implying a marked increase in endocytic activity. Critically, these endosomal alterations were "evident in most pyramidal neurons in Alzheimer brain, detectable at early stages of the disease but absent in several other neurodegenerative disorders examined," establishing both the temporal priority and disease specificity of these changes.
    rationale: >-
      Every element verified against the cached abstract, including both fold-change
      figures, and the quoted clause is an exact substring. One caution on the gloss:
      "detectable at early stages" in cross-sectional post-mortem tissue establishes that
      the change is present early, not that it precedes amyloid or tau, so "temporal
      priority" overstates what the design can deliver. The report concedes exactly this
      in Gap 1, which is the honest version.
    citations:
      - PMID:9236226
  - claim_id: lysosomal-accumulation-precedes-degeneration
    statement: >-
      Hydrolase-positive lysosomes accumulate in Alzheimer pyramidal neurons before overt
      degenerative change and far beyond what normal aging produces.
    disposition: QUALIFIED
    report_quote: |-
      Complementary work by Cataldo et al. ([PMID: 8004466](https://pubmed.ncbi.nlm.nih.gov/8004466/)) showed that at the earliest stages of cell atrophy, "hydrolase-positive lysosomes accumulated at the basal pole and then massively throughout the perikarya and proximal dendrites of affected pyramidal neurons in Alzheimer prefrontal cortex and hippocampus, **far exceeding the changes of normal aging**."
    rationale: >-
      Substantively right — the cached abstract opens by saying the alterations "preceded
      evident degenerative changes" — but the quotation cannot be used as written. The
      cached source reads "throughout the perikarya and proximal and proximal dendrites",
      carrying a duplicated word, and the report silently repairs it. Quote the source as
      it stands, or pick the cleaner "preceded evident degenerative changes" clause, which
      makes the temporal point more directly anyway. Substantively, note this is
      1994 morphology in end-stage tissue: "before overt degeneration" means before
      degeneration was visible in that neuron, not before disease onset.
    citations:
      - PMID:8004466
  - claim_id: tfeb-activation-clears-aggregates-in-models
    statement: >-
      Activating TFEB rescues the autophagy and lysosomal clearance deficit and clears
      amyloid-beta and tau across multiple independent rodent and cell models, and TFEB is
      both necessary and sufficient for activity-dependent tau clearance.
    disposition: QUALIFIED
    report_quote: |-
      Multiple independent studies converge on **TFEB** (Transcription Factor EB) as a master regulator whose activation can rescue the autophagy-lysosomal clearance deficit.
    rationale: >-
      The convergence across six compounds and three cell types is real and is the
      report's best therapeutic argument, but two qualifications are needed before any of
      it is curated. First, sufficiency is overstated: the quoted result from PMID:35867714
      shows that blocking TFEB translocation or depleting TFEB abolishes activity-dependent
      tau clearance, which establishes necessity; no sufficiency experiment is described.
      Second, four of the six agents are natural products (capsaicin, hederagenin, uric
      acid, dendrobium nobile alkaloid) tested in single rodent studies, a literature with
      a well-known positive-result bias, and I did not verify those six papers
      individually. Curate the axis as a preclinical therapeutic target with no human data,
      which is what the report's own Gap 4 concludes.
    citations:
      - PMID:35867714
      - PMID:34699252
  - claim_id: chmp1a-from-er-stress-gene-set-study
    statement: >-
      Multi-omics Mendelian randomization identified CHMP1A, an endosomal sorting and
      autophagy-related gene, as associated with Alzheimer risk, adding genetic support to
      the endolysosomal model.
    disposition: QUALIFIED
    report_quote: |-
      Additional genetic support comes from multi-omics Mendelian randomization ([PMID: 41314550](https://pubmed.ncbi.nlm.nih.gov/41314550/)), which identified **CHMP1A** — an endosomal sorting and autophagy-related gene — as associated with AD risk across methylation, expression, and protein QTL analyses, suggesting that reduced expression of this proteostasis regulator may increase AD risk.
    rationale: >-
      CHMP1A is genuinely among the study's hits and the phrase "endosomal sorting and
      autophagy-related protein" is the paper's own wording, so the report is not
      inventing anything. But the study is framed as a search for endoplasmic reticulum
      stress-related genes, not endolysosomal ones, and CHMP1A entered through that gene
      set; the same paper also nominates calcium signaling genes. The inputs are blood
      quantitative trait loci with brain expression data used only for validation, and the
      discovery genome-wide association study is FinnGen. It is a supporting hint for the
      pathway, not independent endolysosomal genetic evidence on a par with PMID:30124770,
      and should be curated with the gene-set framing stated.
    citations:
      - PMID:41314550
  - claim_id: no-completed-phase-iii-autophagy-trial
    statement: >-
      No autophagy-enhancing therapy has completed Phase III testing in Alzheimer disease,
      so the therapeutic arm of the model is entirely preclinical.
    disposition: RETAINED
    report_quote: |-
      **Scope:** No autophagy-enhancing therapy has completed Phase III testing in AD.
      **Why it matters:** Preclinical evidence is extensive (TFEB activators, mTOR inhibitors, lysosomal acidification agents), but translation to human disease is unproven.
    rationale: >-
      Almost certainly correct and materially useful, since it is what keeps the
      therapeutic claim out of the entry. Retained as a lead rather than as evidence: the
      report reached it by literature search rather than a trial-registry query, and
      committed no search record, so a curator wanting to state it in the entry should
      re-derive it from ClinicalTrials.gov and cite that. Note this is the clearest case in
      the report where an absence is the finding.
  - claim_id: gencc-clingen-absence-not-documented
    statement: >-
      No curated GenCC or ClinGen gene-disease validity classification exists for autophagy
      genes in Alzheimer disease.
    disposition: NEEDS_VERIFICATION
    report_quote: |-
      - **GenCC/ClinGen:** No curated gene-disease validity classifications specifically for autophagy genes in AD were identified.
    rationale: >-
      Asserted with no query, date, or response record, so it is not a documented negative
      search. It is also framed so as to be nearly unfalsifiable, since neither resource
      curates gene-disease validity by pathway membership — the question those resources
      answer is whether a named gene causes a named disease. Do not record as evidence of
      absence. If the intended question is whether PSEN1 or PSEN2 carry validity
      classifications, that is answerable and the answer is not an absence.
  - claim_id: verification-attestation-overstated
    statement: >-
      All PMID citations in the report were verified against source abstracts.
    disposition: QUALIFIED
    report_quote: |-
      *Report generated 2026-05-19. Based on systematic evaluation of 55 publications spanning human neuropathology, genetics, cell biology, and pharmacology. All PMID citations verified against source abstracts.*
    rationale: >-
      True in the sense that matters most and false in the sense that will break a build.
      Every one of the ten identifiers I fetched resolved, and every one matched the
      attributed authors, disease, direction and model system — no hallucinated identifier,
      no wrong-paper citation, which is better than the other Alzheimer reports in this
      sweep managed. But three quoted strings are not exact substrings of their sources
      (PMID:28085665 truncated with an added period, PMID:8004466 with a duplicated word
      silently removed, PMID:21613495 with a sentence-initial capital lowercased). The
      attestation should be read as "identifiers and attributions verified", not "quotations
      are exact". Re-derive every snippet from references_cache before promotion.
    citations:
      - PMID:28085665
      - PMID:8004466
      - PMID:21613495

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The best-sourced of the four Alzheimer reports I assessed in this sweep, and the one
  whose central judgment is most obviously right: the descriptive claim (autophagic and
  endolysosomal failure is an early, Alzheimer-specific feature) is strong, the causal
  claim (it is a primary driver rather than an early consequence) is not settled, and the
  therapeutic claim rests entirely on rodents. I fetched ten of its load-bearing
  identifiers. All ten resolved, and in every case the paper matched the attribution, the
  disease, the direction, and the model system the report gave it. The quantitative
  details are exact where I could check them: the 32-fold and 2.5-fold endosomal volume
  figures, the combined n of 62,415 across three genome-wide association studies, the
  PS1 v-ATPase V0a1 sentence, the presenilin lysosomal calcium sentence.

  Two things stop it short of SUPPORTED, and neither is about the science.

  The first is the Candidate Status Change block, which is unusable as written. It asks
  for three separate statuses on one hypothesis — ESTABLISHED for the descriptive claim,
  EMERGING for the causal claim, SPECULATIVE for the therapeutic claim. The dismech
  schema has one status per hypothesis and its enum permits only CANONICAL, ALTERNATIVE,
  EMERGING and DEPRECATED. ESTABLISHED and SPECULATIVE do not exist, and there is no slot
  to hang a per-claim status on. The distinction the report is drawing is a good one and
  belongs in the hypothesis description or notes; it cannot be expressed as a status.

  The second is that the report closes by asserting "All PMID citations verified against
  source abstracts", and at character level that is not true of three quotations. The
  proposed snippet for the amyloid-beta/dynein lead stops mid-sentence and closes with a
  period the source does not have. The lysosomal accumulation quotation silently repairs a
  duplicated word carried in the cached abstract. The axonal transport quotation lowercases
  a sentence-initial capital. None of these changes the meaning, and none of the three
  reflects a wrong paper, but all three will fail exact-substring validation, so a curator
  copying them out of the report will get a red build. The other snippets I tested (the
  PS1 v-ATPase, the endolysosomal enrichment, the cholesterol fusion, the endosomal
  specificity and the presenilin calcium quotations) match exactly.

  The most curatable new material is the genetics and the negative findings, not the
  mechanism, which the entry is likely to hold already.

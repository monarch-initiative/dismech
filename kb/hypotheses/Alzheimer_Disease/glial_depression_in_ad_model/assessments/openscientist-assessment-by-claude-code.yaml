      (2,499 genes) and an assumed 19,000-gene genomic background, BH over 8
      tests. (3) Overlap and Jaccard index of depression-PAC astrocyte DEGs
      against Supp Data 7 AD-PAC astrocyte DEGs.
    comparison: >-
      Depression-PAC versus AD-progression PAC within donors; depression and
      AD-Depression astrocyte gene lists versus prespecified sets; depression
      versus AD astrocyte DEGs.

summary: >-
  The provider re-analysed the open Supplementary Data of He et al. 2026
  (PMID:42778763) without inventing donor labels. For the 208 donors present in
  both the depression and AD-progression score matrices, astrocyte depression
  scores are uncorrelated with astrocyte AD-progression scores (rho -0.015,
  q 0.83), and astrocytes are the top SHAP predictor of depression. That fits a
  glial depression signal separate from the general Alzheimer signal, but it is
  weaker evidence than the report says: neuronal subclasses show strong negative
  correlations (rho about -0.8) between the same two scores, which suggests the
  scores' construction shapes these correlations, and a zero correlation is not
  a demonstration of a distinct signal. The ER-stress limb is not supported.
  UPR genes are enriched in the AD-Depression Astro_WIF1 cluster only against an
  assumed 19,000-gene background (q 0.009) and not against the tested-gene
  background (q 0.57); none appears among the depression-PAC astrocyte DEGs, and
  HSPA5 and CALR appear in the general AD astrocyte DEGs. External MDD and rodent
  literature gives plausibility only. All eight outputs were reproduced
  byte-identically by an assessor replay. This is the one run in the set whose
  report carries the ANALYSIS_STATUS: SUCCEEDED line, but the runner could not
  bind it because the download dropped MANIFEST.yaml, and the restored manifest
  then needed metadata fields, so the analysis stays PARTIAL.

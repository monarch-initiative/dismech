claims:
  - claim_id: astro-depression-signal-decoupled
    statement: >-
      Astrocyte depression PAC scores are uncorrelated with astrocyte
      AD-progression PAC scores, and astrocytes are the top SHAP predictor of
      depression.
    disposition: QUALIFIED
    report_quote: >-
      Astrocytes show no meaningful correlation between their depression and AD-progression PAC scores (rho = −0.015, q = 0.825)
    rationale: >-
      Reproduced by the assessor replay. The report reads the null correlation
      as a distinct signal. The same analysis gives rho of about -0.8 for
      several neuronal subclasses, a strong inverse coupling that is hard to
      read biologically and points to the scoring construction; against that
      background a zero correlation for astrocytes is compatible with a distinct
      signal but does not demonstrate one. The SHAP ranking re-exposes the
      paper's own values.
    analysis_ids:
      - glial-depression-supplement-reanalysis
  - claim_id: er-stress-not-depression-specific
    statement: >-
      The ER-stress / UPR signature is not specific to depression within
      Alzheimer disease in these tables.
    disposition: QUALIFIED
    report_quote: >-
      This universe dependence means the ER-stress enrichment should be interpreted cautiously; it is not a background-robust signal.
    rationale: >-
      Reproduced. Against the tested-gene background the UPR enrichment is null
      (OR 2.07, q 0.57); it reaches significance only against an assumed genome
      background, which overstates enrichment for lists drawn from expressed
      genes. No UPR gene is among the 568 depression-PAC astrocyte DEGs, and
      HSPA5 and CALR are among the AD astrocyte DEGs. This is the main negative
      finding for the hypothesis's ER-stress limb. Qualified rather than
      retained because the analysis is PARTIAL.
    analysis_ids:
      - glial-depression-supplement-reanalysis
  - claim_id: depression-ad-deg-overlap
    statement: >-
      Depression-PAC and AD-PAC astrocyte DEG sets overlap partially (Jaccard
      0.18; 265 shared genes).
    disposition: QUALIFIED
    report_quote: >-
      Comparing the depression-astrocyte DEG set (568 genes) with the AD-astrocyte DEG set (1,171 genes) gives a
    rationale: >-
      Reproduced. Both lists come from the same donors and scoring model, so
      the overlap describes the paper's outputs rather than independent
      biological convergence.
    analysis_ids:
      - glial-depression-supplement-reanalysis
  - claim_id: inflammation-module-level
    statement: >-
      Inflammatory terms are enriched at the gene-module level in the paper's
      depression co-regulation networks.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      neuroinflammation is a module-level (co-regulation) signal
    rationale: >-
      Drawn from a descriptive keyword read of Supp Data 4 that was not part of
      the locked analysis and has no committed output table, so it is not
      supported by the audited execution. The prespecified inflammatory gene
      sets were not enriched (one gene each, q 1.0).
  - claim_id: mdd-upr-external-plausibility
    statement: >-
      UPR genes are elevated in dorsolateral prefrontal cortex in major
      depressive disorder.
    disposition: RETAINED
    report_quote: >-
      The level of mRNA expression in MDD subjects was significantly higher for GRP78 (p = 0.008), GRP94 (p = 0.018), and ATF4C (p = 0.03) compared to non-psychiatric controls
    rationale: >-
      Verified against the cached full text of PMID:31727394. It is bulk-tissue
      qPCR in major depressive disorder, not astrocytes and not depression
      within Alzheimer disease, so it is external plausibility for the ER-stress
      limb and not support for it. The two MANF papers (PMID:42537476,
      PMID:42425961) are rodent stress models and carry the same limitation.
    citations:
      - PMID:31727394
      - PMID:42537476
      - PMID:42425961
  - claim_id: run-status-succeeded
    statement: >-
      The run declares ANALYSIS_STATUS: SUCCEEDED.
    disposition: QUALIFIED
    report_quote: >-
      ANALYSIS_STATUS: SUCCEEDED
    rationale: >-
      The marker is present and the computation was independently reproduced,
      so this is the strongest provenance of the four runs. The execution claim
      still does not pass the gate, because the manifest the report should be
      bound to was dropped in download and then corrected by the assessor; the

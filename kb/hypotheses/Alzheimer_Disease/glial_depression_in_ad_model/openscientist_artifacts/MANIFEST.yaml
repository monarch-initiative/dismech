comparison: 'Re-analysis of published derived scores (shared lineage; not independent replication). (1)
  Spearman correlation of each subclass''s DepressionMood PAC vs AD-progression PAC across 208 common
  donors (BH over 27 tests): Astro rho=-0.015 q=0.825 (no correlation), Oligo rho=-0.182 q=0.0099 (weak);
  neuronal subclasses strongly negative (IN_VIP -0.80, IN_SST -0.77). SHAP DepressionMood ranks Astro
  #1, Oligo #2. (2) Fisher exact enrichment (BH over 8 tests): AD-Depression Astro_WIF1 up-cluster is
  enriched for UPR/ER-stress (CALR,DNAJB9,HSPA5; genomic universe OR=17.5 q=0.0092; DEG-restricted universe
  OR=2.07 q=0.57 ns); depression-PAC astrocyte DEGs contain 0/15 UPR and 1/11 inflammatory (CHI3L1). (3)
  Depression-astro DEGs (568) vs AD-astro DEGs (1171): intersection 265, Jaccard 0.180; ER-stress genes
  CALR/HSPA5 appear in the AD set and none in the depression-PAC set, so ER-stress is not depression-specific.'
limitations:
- Supplementary Data 6 PAC matrices carry no diagnosis/Braak/resilience labels; only label-free tests
  were run and no donor labels were inferred.
- All inputs are the paper's own derived scores/DEG tables; results share data lineage and cannot constitute
  independent replication.
- Enrichment significance for UPR/ER-stress depends on the gene-universe choice (significant vs genomic
  ~19,000 background; not significant vs DEG-restricted N=2499).
- DEG tables list only reported DEGs, not the full expressed-gene background; the DEG-restricted universe
  is conservative.
- gene_results.csv fold_change/log2_mean_diff use absolute mean PAC scores and are undefined where a mean
  is zero; the primary effect size for signed PAC scores is Spearman rho with paired Cohen's d as auxiliary.
- Several prespecified target genes (ATF4,DDIT3,XBP1,MANF,SERPINA3,IL1B,IL6,TNF) are absent from all four
  loaded astrocyte gene lists.

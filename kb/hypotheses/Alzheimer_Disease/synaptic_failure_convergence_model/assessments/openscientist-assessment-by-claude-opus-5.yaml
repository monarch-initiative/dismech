claims:
  - claim_id: verdict-supported-overstates-arm-heterogeneity
    statement: >-
      The synaptic failure convergence model is supported by converging human
      clinical, imaging, and experimental evidence.
    disposition: QUALIFIED
    report_quote: "**Verdict: SUPPORTED — with important qualifications**"
    rationale: >-
      Supported is right for the anchor claim and for the amyloid, tau, and
      complement arms, and wrong as a summary of the whole model. The report's own
      link-strength table scores five of eleven links ESTABLISHED, five EMERGING,
      and the infectious arm SPECULATIVE against a negative randomised trial. The
      curated CANONICAL status should nonetheless stand, since it denotes the
      default explanatory model rather than a claim that every arm is settled.
    citations:
      - PMID:25147118
      - PMID:40465636
  - claim_id: model-breadth-risks-unfalsifiability
    statement: >-
      By accommodating nearly every known Alzheimer mechanism as an upstream
      stressor, the convergence model risks being unfalsifiable, and would be
      improved by formalisation as a weighted causal graph.
    disposition: RETAINED
    report_quote: "The model's principal weakness is its descriptive breadth: by accommodating nearly every known AD pathological mechanism as an \"upstream stressor,\" it risks becoming unfalsifiable"
    rationale: >-
      The sharpest observation in the report, and a fair one about a hypothesis
      block whose description already lists six stressor classes. It is a
      methodological critique rather than a literature finding, so it belongs in
      the entry as a discussion or as a note on the hypothesis, not as an
      evidence item. The report's Gap 1, that no study quantifies the relative
      contribution of each stressor, is the concrete form of the same point.
  - claim_id: synapse-loss-strongest-anatomical-correlate-of-cognition
    statement: >-
      Synaptic loss is the closest anatomical correlate of cognitive impairment in
      Alzheimer disease, measurable post mortem and now in living patients.
    disposition: RETAINED
    report_quote: "synaptic loss is the closest anatomical correlate of cognitive impairment in AD, validated by both postmortem stereology and in vivo SV2A PET imaging"
    rationale: >-
      The anchor claim of the hypothesis and correct. The entry already asserts
      synaptic convergence but supports it with two general references from 2003
      and 2016; what the report adds is the in vivo measurement layer, assessed
      separately below.
    citations:
      - PMID:25147118
      - PMID:40491249
  - claim_id: csf-sv2a-tracks-sv2a-pet
    statement: >-
      CSF SV2A measured by a new ELISA is lower in Alzheimer disease than in
      cognitively normal participants and correlates strongly with SV2A PET within
      the Alzheimer group.
    disposition: RETAINED
    report_quote: "CSF SV2A was lower in AD compared to CN participants. Within the AD group, CSF SV2A was highly correlated with SV2A PET"
    rationale: >-
      Verified verbatim against the cached abstract. Absent from the entry.
      Curate with the sample size stated, since it is small: 21 participants with
      early Alzheimer disease and 7 cognitively normal controls, all scanned with
      carbon-11 UCB-J. The cached abstract also notes that other CSF synaptic
      proteins were higher in Alzheimer disease and not associated with SV2A PET,
      which sharpens rather than weakens the claim.
    citations:
      - PMID:40491249
  - claim_id: plasma-gap43-tracks-synaptic-loss-and-decline
    statement: >-
      Plasma GAP-43 correlates with CSF GAP-43, neurofilament light, and baseline
      and longitudinal synaptic PET, and elevated levels track greater tau
      aggregation, faster atrophy, and accelerated cognitive decline, most clearly
      in cognitively unimpaired individuals.
    disposition: RETAINED
    report_quote: "Elevated plasma GAP-43 is associated with greater tau aggregation, faster brain atrophy, and accelerated cognitive decline, particularly among cognitively unimpaired individuals"
    rationale: >-
      Verified verbatim. The cached abstract gives the scale the report omits: two
      Chinese cohorts totalling 785 participants, with SV2A PET in 85, tau PET in
      280, and MRI in 595, plus post-mortem brain-derived extracellular vesicle
      proteomics in 21. A blood-based synaptic marker is genuinely new to the
      entry.
    citations:
      - PMID:41406948
  - claim_id: hippocampal-tangle-burden-tracks-synaptic-density
    statement: >-
      Hippocampal neurofibrillary tangle burden correlates strongly with SV2A
      synaptic density while entorhinal cortex shows weaker effects, and
      hippocampal synaptic density is similar in controls and cognitively
      unimpaired people with biological Alzheimer disease.
    disposition: RETAINED
    report_quote: "Hp NFT burden strongly correlated with synaptic density, while the ERC showed weaker effects"
    rationale: >-
      Verified verbatim in 94 older adults imaged with carbon-11 UCB-J,
      carbon-11 PiB, and fluorine-18 MK-6240. The second half of this paper,
      that synaptic density is preserved in unimpaired biological Alzheimer
      disease and reduced only once impairment appears, is the report's own
      Finding 5 evidence and is the more interesting result for the convergence
      model, since it places synapse loss at the pathology-to-symptom step rather
      than at pathology onset.
    citations:
      - PMID:40465636
  - claim_id: glymphatic-impairment-associated-with-synaptic-loss
    statement: >-
      A lower DTI-ALPS index, indicating greater glymphatic impairment, is
      associated with reduced SV2A synaptic density.
    disposition: RETAINED
    report_quote: "A lower ALPS index, indicating greater glymphatic impairment, was significantly associated with reduced synaptic density"
    rationale: >-
      Verified verbatim in 182 participants with SV2A PET/MRI and amyloid PET/CT.
      Absent from the entry, and it is the first quantitative link between the
      entry's separately curated glymphatic_clearance_model and its synaptic
      convergence block. Curate as an association: the design is cross-sectional
      with mediation modelling, and DTI-ALPS is an imaging surrogate for
      glymphatic function rather than a direct measure.
    citations:
      - PMID:41454064
  - claim_id: gut-bacterial-vesicles-drive-complement-pruning
    statement: >-
      Lipopolysaccharide-carrying bacterial extracellular vesicles are elevated in
      the plasma of people with Alzheimer disease, cross the blood-brain barrier,
      and activate microglial Piezo1, precipitating excessive C1q-C3
      complement-mediated synaptic pruning.
    disposition: RETAINED
    report_quote: "These bEVs activated microglial Piezo1, consequently precipitating an excessive synaptic pruning process mediated by the C1q-C3 complement pathway"
    rationale: >-
      Verified verbatim against the cached abstract, which also reports elevated
      LPS-containing vesicles in patient plasma and in vivo imaging of transport
      across the barrier. A mechanistically specific peripheral-to-central route
      into the complement arm that the entry does not contain. Single study, so
      curate as an emerging edge rather than an established one.
    citations:
      - PMID:40731189
  - claim_id: apoe4-accelerates-complement-mediated-pruning
    statement: >-
      ApoE4 destabilises postsynaptic scaffolding networks and accelerates
      complement- and microglia-mediated synaptic pruning, linking the strongest
      late-onset risk allele to the convergence mechanism.
    disposition: QUALIFIED
    report_quote: "accelerate complement- and microglia-mediated synaptic pruning"
    rationale: >-
      The proposed snippet is an exact substring of the cached abstract, but
      PMID:42061654 is a 2026 narrative review, which the report labels correctly
      as review-level. It is usable as orientation and as evidence_source OTHER,
      but a claim tying the dominant genetic risk factor to the core convergence
      mechanism deserves the primary studies the review synthesises rather than
      the review itself.
    citations:
      - PMID:42061654
  - claim_id: ndan-resilience-decouples-pathology-from-synapse-loss
    statement: >-
      Non-demented individuals with Alzheimer neuropathology show higher dendritic
      spine density distant from plaques, more immature spines, and higher Pin1
      than people with Alzheimer dementia, so convergence on synaptic failure is
      not deterministic.
    disposition: RETAINED
    report_quote: "NDAN subjects displayed a higher spine density in regions distant from Aβ plaques versus AD patients"
    rationale: >-
      Verified verbatim against the cached abstract, including the immature-spine
      predominance and the lower Pin1 expression in Alzheimer disease relative to
      both NDAN and controls. This is the report's best qualification of its own
      hypothesis and is absent from the entry. Human post-mortem, DiI labelling,
      descriptive, so it supports a resilience discussion rather than a causal
      edge.
    citations:
      - PMID:38829680
  - claim_id: complement-pruning-as-the-core-convergence-mechanism
    statement: >-
      Complement-mediated microglial synaptic pruning through C1q-C3-CR3 should be
      elevated to the named core convergence mechanism of the model.
    disposition: QUALIFIED
    report_quote: "This complement pathway represents the **best-characterized convergence mechanism** in the model"
    rationale: >-
      Best characterised is defensible; core is a synthesis judgement the cited
      evidence does not establish, and the report reaches it partly through
      review-level sources. It is also largely already curated: the entry carries
      a separate complement_synaptic_pruning_model hypothesis block, so the useful
      action is to cross-reference the two rather than to restructure this one.
      The genuinely new inputs to that pathway are the gut-vesicle and ApoE4
      claims assessed above.
    citations:
      - PMID:41745721
      - PMID:37118504
  - claim_id: infectious-arm-weakest-with-negative-valad-trial
    statement: >-
      The infectious arm of the model has the weakest clinical support, with the
      VALAD randomised trial of valacyclovir negative and the antiviral-dementia
      link otherwise observational.
    disposition: NEEDS_VERIFICATION
    report_quote: "the infectious arm has the weakest clinical evidence: the VALAD randomized controlled trial of valacyclovir was negative"
    rationale: >-
      Recorded as unverified because I did not fetch it. The report attributes the
      VALAD outcome to PMID:41561087, which it describes as a perspective arguing
      that antiviral trials need synaptic endpoints, rather than to the trial
      publication itself. The direction of the claim is honest and the report
      deserves credit for grading its own arm SPECULATIVE, but the trial result
      must be cited to the trial report before anything is promoted. Note the
      entry has a separate hsv1_reactivation_model block where this belongs.
    citations:
      - PMID:41561087
  - claim_id: go-0150076-is-not-complement-mediated-synapse-elimination
    statement: >-
      GO:0150076 is the ontology term for complement-mediated synapse
      elimination.
    disposition: REJECTED
    report_quote: "Complement-mediated synapse elimination (GO:0150076)"
    rationale: >-
      GO:0150076 is neuroinflammatory response in this repository's term cache, so
      binding it under that label would assert the wrong concept. The remaining
      candidates in the same list do resolve with matching labels: GO:0060291
      long-term synaptic potentiation, GO:0036465 synaptic vesicle recycling,
      GO:0001774 microglial cell activation, GO:0000423 mitophagy, CL:0000129
      microglial cell, CL:0000127 astrocyte, CL:0000679 glutamatergic neuron, and
      MONDO:0004975 Alzheimer disease. CL:4023015 for the parvalbumin interneuron
      is not cached and would need validation before use.
  - claim_id: no-status-change-recommended
    statement: >-
      No status change is warranted; the hypothesis should remain CANONICAL.
    disposition: RETAINED
    report_quote: "**No status change recommended.** Maintain CANONICAL status."
    rationale: >-
      Correct and explicit. Do not alter the status slot on the basis of this
      report. The qualifier the report suggests attaching alongside is better
      expressed by narrowing the hypothesis description and opening a discussion
      than by inventing a new slot.
  - claim_id: corpus-size-exceeds-committed-record
    statement: >-
      The report rests on a systematic evaluation of over 105 publications.
    disposition: NEEDS_VERIFICATION
    report_quote: "Our systematic evaluation of over 105 publications confirms five major findings"
    rationale: >-
      The committed retrieval record lists 37 identifiers, and no search protocol
      or screening log is committed anywhere in the hypothesis directory. The
      figure cannot be checked, so the report's coverage statements, including its
      GenCC and ClinGen absence claims, should be read as provider assertions.

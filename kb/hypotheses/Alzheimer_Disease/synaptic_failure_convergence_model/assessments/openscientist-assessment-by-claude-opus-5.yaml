schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: synaptic_failure_convergence_model
assessed_at: "2026-09-04T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  This is the most accurate of the four Alzheimer OpenScientist reports I
  checked. I fetched ten of its identifiers into references_cache/ and compared
  the report's wording with the cached source; every proposed curation snippet in
  its Candidate Evidence References list is an exact substring of the cached
  abstract, and none of the checked identifiers pointed at the wrong paper. That
  is not the norm in this sweep.

  I grade the run PARTIALLY_SUPPORTED rather than the report's own SUPPORTED,
  because the report's arm-by-arm table contradicts its headline. Of the eleven
  causal links it scores, five are ESTABLISHED, five are EMERGING, and one, the
  infectious arm, is SPECULATIVE against a negative randomised trial. A model
  whose amyloid, tau, and complement arms are solid and whose vascular,
  oxidative, gut, and infectious arms are single-study or negative has material
  unresolved gaps, which is what PARTIALLY_SUPPORTED denotes here. The report is
  also unusually candid about this: its own summary says the breadth of the model
  risks making it unfalsifiable, which is the most useful sentence in the
  document and belongs in the entry as a discussion rather than being lost.

  The substantive additions are a modern biomarker layer the entry does not have.
  The seed hypothesis rests on two references from 2003 and 2016 that establish
  synaptic dysfunction qualitatively; the report supplies in vivo and fluid
  measurements of synaptic density itself: CSF SV2A tracking SV2A PET
  (PMID:40491249), plasma GAP-43 tracking synaptic PET, tau aggregation and
  cognitive decline in 785 participants (PMID:41406948), hippocampal tangle
  burden tracking SV2A density in 94 participants (PMID:40465636), and DTI-ALPS
  glymphatic impairment tracking reduced SV2A density in 182 participants
  (PMID:41454064). It also supplies two genuinely new convergence edges: gut-derived
  bacterial vesicles carrying lipopolysaccharide activating microglial Piezo1 and
  driving C1q-C3 pruning (PMID:40731189), and the NDAN resilience finding that
  preserved and remodelled dendritic spines decouple pathology from cognition
  (PMID:38829680).

  One curation lead is wrong as written: GO:0150076 is neuroinflammatory
  response, not complement-mediated synapse elimination. The remaining candidate
  identifiers check out against this repository's caches. Nothing computational
  was run, and the claimed 105-publication corpus is not reconcilable with the
  37 identifiers actually committed.

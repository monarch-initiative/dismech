overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A careful, well-sourced report whose headline judgment — retain CANONICAL, annotate as
  a necessary but not sufficient initiating trigger inside a multifactorial architecture —
  is right and is where the field actually is. Its citation hygiene in the body is
  unusually good for a deep-research run: I fetched and checked eleven of the load-bearing
  identifiers and every one resolved, matched its attributed content, and reproduced its
  quoted numbers exactly. The donanemab hazard ratio (0.67, 95% CI 0.52-0.87, 33% lower
  risk of MCI to mild AD progression), The 90+ Study's 33% of 235 participants at a mean
  age of 98, the Cochrane review's 17 trials and 20,342 participants with SMD -0.11 on
  ADAS-Cog and -0.12 on CDR-SB, the 14-of-29 familial mutation figure for APP-A673T, and
  the Selkoe and Hardy sentence about all dominant early-onset mutations are all verbatim
  or numerically exact.

  The defects are concentrated in the Curation Leads and Knowledge Gaps sections, which is
  precisely where a curator would act, so they matter more than their word count suggests.

  The worst is biochemical rather than bibliographic. Gap 3 and Candidate Knowledge Gap
  Entry 2 both argue that BACE1 inhibitors "reduce Abeta but increase C99" and that BACE1
  inhibitor trial failures may therefore reflect C99 toxicity. BACE1 is the beta-secretase
  that produces C99; inhibiting it lowers C99. The paper the report cites for the whole
  C99 story says so directly — lowering APP expression or inhibiting BACE1 reversed the
  cathepsin deficits, and deleting one Bace1 allele from adult Ts2 mice rescued them in
  vivo. The report's own Test 2 states the direction correctly, so this is an internal
  contradiction, not a considered position, and the gap must not be curated as written.

  Two proposed evidence snippets are also unusable as supplied. The TREM2 lead quotes a
  background sentence rather than a finding, from a Familial Danish Dementia vascular
  amyloid model rather than an Alzheimer amyloid model. The C99 lead contains an ellipsis
  and silently repairs a typo present in the cached source ("Down ayndrome"), so it is not
  an exact substring and will fail snippet validation. Both need re-deriving from the
  cache rather than copying.

  Net: the qualifying evidence is the valuable part and most of it is genuinely absent
  from the Alzheimer entry — the tau-first subtype, the Cochrane null, the C99 arm, the
  oldest-old resilience figure. The supportive half largely restates what the CANONICAL
  status already asserts.

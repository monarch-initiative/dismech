claims:
  - claim_id: retain-canonical-with-qualification
    statement: >-
      The amyloid cascade model should remain CANONICAL but be annotated as describing a
      necessary, not sufficient, initiating trigger within a multifactorial disease
      architecture rather than a linear chain from amyloid to dementia.
    disposition: RETAINED
    report_quote: |-
      **Current status CANONICAL** should be retained but with added qualifier: "Describes a necessary but not sufficient initiating mechanism; applies most strongly to familial AD and the amyloid-first sporadic subtype."
    rationale: >-
      This is the correct reading of the evidence the report assembles and matches the
      field's current position. No status change; the value is in the qualifying
      annotation, which is supported by four independently verified lines (the Cochrane
      null, the tau-first subtype, the oldest-old resilience figure, and the C99 arm).
    citations:
      - PMID:41985900
      - PMID:37433038
      - PMID:41942821
  - claim_id: familial-mutations-converge-on-abeta-pathway
    statement: >-
      Every dominant mutation causing early-onset familial Alzheimer disease falls in
      either the substrate or the protease of the reaction generating amyloid-beta.
    disposition: RETAINED
    report_quote: |-
      The Amyloid Cascade Model (ACM) remains the most genetically validated mechanistic hypothesis for Alzheimer's disease (AD). Every known dominant mutation causing early-onset familial AD maps to the amyloid-beta (Aβ) generating pathway — either in the substrate (APP) or the protease (PSEN1/PSEN2). The Icelandic protective variant APP-A673T provides rare bidirectional causal evidence: reducing BACE1 cleavage by ~40% protects against both AD and age-related cognitive decline.
    rationale: >-
      Verified verbatim in PMID:27025652 (Selkoe and Hardy 2016), whose text reads "all
      dominant mutations causing early-onset AD occur either in the substrate (amyloid
      precursor protein, APP) or the protease (presenilin) of the reaction that generates
      Abeta". Foundational and near-certainly already curated; nothing new.
    citations:
      - PMID:27025652
  - claim_id: a673t-bidirectional-causal-evidence
    statement: >-
      The Icelandic protective variant APP-A673T supplies bidirectional causal evidence by
      reducing beta-secretase cleavage and amyloid pathology.
    disposition: QUALIFIED
    report_quote: |-
      In vivo, the Icelandic mutation in transgenic mice produced a moderate yet significant reduction in Aβ plaque size ([PMID: 41609044](https://pubmed.ncbi.nlm.nih.gov/41609044/)).
    rationale: >-
      All three supporting identifiers check out, but the numbers belong to different
      systems and the report merges them. The "~40%" reduction in BACE1 cleavage is the
      in-vitro SH-SY5Y figure from PMID:33370284, whose title confirms an effect across 14
      familial forms and whose text gives "14/29 (48%)" for the mutations tested. The in
      vivo evidence is two separate mouse experiments: PMID:39496485 introduced A673T into
      Swedish-mutation-free AppG-F knock-in mice and found downregulated beta-cleavage
      with attenuated amyloid, neuroinflammation and neuritic change; PMID:41609044 is a
      different model (5xFAD crossed to murine mAPP-A673T) and its quoted "moderate yet
      significant reduction" was observed in males, a restriction the report drops. Curate
      each figure to its own system rather than as one bidirectional package.
    citations:
      - PMID:33370284
      - PMID:39496485
      - PMID:41609044
  - claim_id: anti-amyloid-antibodies-partial-validation
    statement: >-
      Lecanemab and donanemab produce statistically significant but modest slowing of
      clinical decline, giving the amyloid target partial pharmacological validation.
    disposition: RETAINED
    report_quote: |-
      - **Donanemab** (TRAILBLAZER-ALZ 2): 33% reduction in risk of MCI-to-mild AD progression (HR = 0.67, 95% CI 0.52–0.87) ([PMID: 42128444](https://pubmed.ncbi.nlm.nih.gov/42128444/)).
    rationale: >-
      Verified exactly against PMID:42128444, which reads "There was a 33% lower risk of
      progression from MCI to mild AD (CDR-G score >=1) in the overall population treated
      with donanemab compared with placebo (hazard ratio [HR] = 0.67; 95% CI 0.52-0.87;
      p = 0.003)". Note for curation that this identifier is a clinical-meaningfulness
      analysis of TRAILBLAZER-ALZ 2 combining prespecified and post hoc analyses, not the
      primary trial report, and that the paper also gives a number needed to treat of 8.5
      over 76 weeks, which is a more curatable effect measure than the percentage.
    citations:
      - PMID:42128444
      - PMID:36449413
  - claim_id: cochrane-null-on-clinical-meaningfulness
    statement: >-
      A Cochrane review of 17 randomized trials in 20,342 participants found that
      amyloid-beta-targeting monoclonal antibodies probably make little to no difference to
      cognition or dementia severity at 18 months.
    disposition: RETAINED
    report_quote: |-
      A Cochrane systematic review of 17 RCTs (20,342 participants, 7 different antibodies) concluded that at 18 months, Aβ-targeting monoclonal antibodies "probably result in little to no difference in cognitive function" (SMD −0.11 on ADAS-Cog) and "may result in little to no difference in dementia severity" (SMD −0.12 on CDR-SB) ([PMID: 41985900](https://pubmed.ncbi.nlm.nih.gov/41985900/)). The review stated that "successful removal of amyloid from the brain does not seem to be associated with clinically meaningful effects."
    rationale: >-
      Fully verified: the participant count, both standardized mean differences, both
      certainty phrasings, and the word "trivial" used in the report's summary all appear
      in the cached review. The strongest and most curatable qualifying item in the report.
      One mechanical caution for whoever promotes it — the exact cached sentence begins
      with a capital and continues past where the report body stops it, so use the full
      form given in the report's own Candidate Evidence Reference 1, which is an exact
      substring, rather than the truncated body version.
    citations:
      - PMID:41985900
  - claim_id: solanezumab-graded-as-trial-evidence
    statement: >-
      Solanezumab accelerated cognitive decline in both asymptomatic and symptomatic trial
      participants, and this is high-confidence human clinical trial evidence partially
      refuting the cascade.
    disposition: QUALIFIED
    report_quote: |-
      Critically, **solanezumab** (targeting soluble monomeric Aβ) not only failed but "showed to accelerate cognitive decline in both asymptomatic and symptomatic trial participants" ([PMID: 38685682](https://pubmed.ncbi.nlm.nih.gov/38685682/)).
    rationale: >-
      The quotation is verbatim, but its provenance is misgraded. PMID:38685682 is a
      narrative "Drug Discovery Case History" review, and the sentence sits in its EXPERT
      OPINION section, not in a results section — it is the authors' summary judgment
      about the solanezumab programme, with no effect size, trial, or statistic attached.
      The report's evidence matrix nonetheless records it as "Human clinical (RCT)" with
      confidence "High; failed trial". If promoted, this belongs as review-level or
      expert-opinion evidence, not as a trial result, and the underlying EXPEDITION, A4 or
      DIAN-TU report should be cited for any quantitative claim.
    citations:
      - PMID:38685682
  - claim_id: oldest-old-resilience-fraction
    statement: >-
      Thirty-three percent of individuals with intermediate-to-high Alzheimer
      neuropathologic change remain cognitively normal into their nineties, showing
      pathology is not deterministic for clinical disease.
    disposition: QUALIFIED
    report_quote: |-
      In The 90+ Study, **33% of participants with intermediate/high Alzheimer's Disease Neuropathologic Change (ADNC) maintained normal cognition at death** (mean age 98 years)
    rationale: >-
      The figure is exact — 235 participants, mean age at death 98, 77 of them (33%)
      cognitively normal — but the report generalizes it past what the study supports in
      two ways. The fraction falls to 22% in the high-ADNC subgroup (25 of 114), so the
      headline number depends on including intermediate change. More importantly, the
      paper's actual conclusion is that co-pathology, not amyloid tolerance, is what
      separates the groups: LATE-NC, Lewy body disease, hippocampal sclerosis and a high
      count of non-Alzheimer changes all raised the odds of dementia, while vascular
      changes did not. The report instead reads the finding as evidence for
      synaptic/metabolic resilience modifiers. Curate the number with the co-pathology
      explanation attached, and treat the cohort's counterintuitive protective
      associations for hypertension and heart disease as oldest-old survivor effects
      rather than mechanism.
    citations:
      - PMID:41942821
  - claim_id: tau-first-subtype-challenges-universality
    statement: >-
      A data-driven tau-first subtype exists in which tau accumulates in medial temporal
      and neocortical regions before interacting with amyloid-beta, so amyloid does not
      initiate the sequence in all cases.
    disposition: RETAINED
    report_quote: |-
      Data-driven disease progression modeling across ADNI and ROSMAP cohorts identified two distinct spatiotemporal subtypes of AD pathology accumulation: an **"amyloid-first" subtype** (extensive neocortical amyloid precedes tau spread beyond the medial temporal lobe) and a **"tau-first" subtype** where "mild tau accumulates in medial temporal and neocortical areas prior to interacting with amyloid-β" ([PMID: 37433038](https://pubmed.ncbi.nlm.nih.gov/37433038/)). APOE ε4 carriers were enriched in the amyloid-first subtype.
    rationale: >-
      Verified in detail. PMID:37433038 applied SuStaIn subtyping to ADNI PET (502
      participants with concurrent amyloid and tau scans) and ROSMAP post-mortem
      neuropathology (1338 participants), recovered both subtypes consistently in each,
      and found amyloid-first enriched among APOE e4 carriers. The quoted clause is
      verbatim. Two nuances worth carrying into any curation: the paper is explicit that
      the amyloid cascade hypothesis "does not require that Abeta occurs first in all
      Alzheimer's disease cases", and tau-first APOE e4 non-carriers largely recapitulated
      primary age-related tauopathy rather than Alzheimer disease — so part of the
      tau-first group may not belong in the disease at all.
    citations:
      - PMID:37433038
  - claim_id: c99-endolysosomal-abeta-independent-arm
    statement: >-
      The APP beta-cleaved C-terminal fragment C99, rather than amyloid-beta itself,
      mediates lysosomal dysfunction in Down syndrome, indicating an APP-dependent but
      amyloid-beta-independent pathogenic arm.
    disposition: RETAINED
    report_quote: |-
      Recent evidence reveals that APP processing products other than Aβ — specifically the C-terminal fragment C99 (β-CTF) — independently disrupt endolysosomal function.
    rationale: >-
      Verified against PMID:31043483, including the 0.6-unit lysosomal pH elevation,
      cathepsin D inactivation, and the transcriptional contribution being excluded by RNA
      sequencing. The paper's own bridge to sporadic disease is the sentence a curator
      should use, since it states that APP-betaCTF but not APP is elevated in sporadic
      Alzheimer disease. This is an in-vitro and mouse result in a Down syndrome model, so
      the amyloid-beta-independence claim is specific to lysosomal acidification, not to
      Alzheimer pathogenesis generally.
    citations:
      - PMID:31043483
  - claim_id: bace1-inhibitors-increase-c99
    statement: >-
      BACE1 inhibitors reduce amyloid-beta but increase C99, so failed BACE1 inhibitor
      trials may reflect C99 accumulation toxicity.
    disposition: REJECTED
    report_quote: |-
      **Why it matters:** If C99 is the primary driver of endolysosomal dysfunction (as suggested by [PMID: 31043483](https://pubmed.ncbi.nlm.nih.gov/31043483/)), then BACE1 inhibitors (which reduce Aβ but increase C99) could worsen pathology — as may have been observed in failed BACE1 inhibitor trials.
    rationale: >-
      Backwards. BACE1 is the beta-secretase whose cleavage of APP produces C99, so
      inhibiting BACE1 lowers C99 rather than raising it. The very paper cited in the same
      sentence reports the opposite of the predicted consequence: "Lowering APP expression
      with siRNA or BACE1 inhibition reversed cathepsin deficits in both fibroblasts and
      neurons", and "Deleting one Bace1 allele from adult Ts2 mice had similar rescue
      effects in vivo". The report's own Discriminating Test 2 states the correct direction
      ("BACE1 inhibitors (reduce both Aβ and C99 production)"), so this is an internal
      contradiction. The error is repeated in Candidate Knowledge Gap Entry 2, which is
      the form a curator would copy. Do not curate this gap as written; a real version of
      the question is whether gamma-secretase inhibition, which does raise C99, was the
      relevant harm.
    citations:
      - PMID:31043483
  - claim_id: trem2-lead-quotes-background-not-finding
    statement: >-
      PMID:42039545 should be added as qualifying evidence with the snippet
      "Loss-of-function mutations in TREM2 markedly increase AD risk."
    disposition: REJECTED
    report_quote: |-
      **[PMID: 42039545](https://pubmed.ncbi.nlm.nih.gov/42039545/)** — TREM2 region-specific effects on amyloid. Candidate for addition as QUALIFIES evidence. Abstract snippet: "Loss-of-function mutations in TREM2 markedly increase AD risk."
    rationale: >-
      Two problems, either of which disqualifies the lead as supplied. The proposed snippet
      is a background sentence introducing the study, not a result of it — the paper's own
      findings concern what happens when TREM2 is deleted, and citing its introduction for
      a human genetics claim is the pattern check-title-snippets exists to catch. Second,
      the model is the Familial Danish Dementia Tg-FDD mouse crossed to TREM2 knockout, a
      vascular amyloid (cerebral amyloid angiopathy) model rather than an Alzheimer amyloid
      model. The report's evidence matrix labels the context correctly as "Mouse CAA
      model", but Finding 4 then uses the same identifier to source the human risk claim.
      The genuinely interesting result — TREM2 loss reducing cortical vascular amyloid
      while exacerbating it in cerebellum — is curatable, but needs its own snippet and
      should be scoped to cerebral amyloid angiopathy.
    citations:
      - PMID:42039545
  - claim_id: c99-snippet-not-an-exact-substring
    statement: >-
      The proposed C99 evidence snippet can be used as supplied for the disease entry.
    disposition: NEEDS_VERIFICATION
    report_quote: |-
      3. **[PMID: 31043483](https://pubmed.ncbi.nlm.nih.gov/31043483/)** — C99-mediated endolysosomal dysfunction. Candidate for addition as COMPETING evidence. Abstract snippet: "lysosomal dysfunction in Down syndrome (trisomy 21)... is specifically mediated by the β cleaved carboxy terminal fragment of APP (APP-βCTF, C99)."
    rationale: >-
      It cannot. The proposed snippet elides text with an ellipsis and silently corrects a
      typographical error carried in the cached source, which reads "lysosomal dysfunction
      in Down ayndrome (trisomy 21), a neurodevelopmental disorder and form of early onset
      AD, requires the extra gene copy of amyloid precursor protein (APP) and is
      specifically mediated by the beta cleaved carboxy terminal fragment of APP
      (APP-betaCTF, C99)". Neither the ellipsis nor the corrected spelling will match on
      exact-substring validation. The underlying claim is sound (see
      c99-endolysosomal-abeta-independent-arm); only the snippet must be re-derived from
      references_cache rather than copied from the report.
    citations:
      - PMID:31043483
  - claim_id: gencc-clingen-absence-not-documented
    statement: >-
      No GenCC or ClinGen gene-disease validity curations exist for APP and PSEN in the
      context of the amyloid cascade.
    disposition: NEEDS_VERIFICATION
    report_quote: |-
      - **No GenCC/ClinGen** formal gene-disease validity curations were identified for APP/PSEN genes in the context of the amyloid cascade specifically (as opposed to general AD classification).
    rationale: >-
      Reported as a source-level absence without any query, date, or response record, so it
      is an assertion rather than a documented negative search. It is also framed in a way
      that resists checking: GenCC and ClinGen do carry APP and PSEN1/PSEN2 gene-disease
      records for Alzheimer disease, and the qualifier "in the context of the amyloid
      cascade specifically" describes something those resources do not curate at all.
      Do not record this as evidence of absence.

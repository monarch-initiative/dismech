claims:
  - claim_id: retain-emerging-tau-restricted
    statement: >-
      The hypothesis should retain EMERGING status with an explicit restriction to
      tau-dominant pathology rather than Alzheimer disease generally.
    disposition: RETAINED
    report_quote: |-
      Verdict: PARTIALLY SUPPORTED. Retain EMERGING status, with an explicit tau-restriction on scope.
    rationale: >-
      Concordant with the curated status, and no status change is warranted. Its
      evidential value is limited, though: the seed hypothesis handed the provider the
      tau restriction ("In tauopathy — but not pure amyloidosis"), so agreeing with it is
      not independent support. Treat as confirmation that nothing found in this search
      overturns the existing status.
    citations:
      - PMID:36890231
  - claim_id: tcell-depletion-blocks-tau-neurodegeneration
    statement: >-
      Depleting either microglia or T cells blocks tau-mediated neurodegeneration in
      P301S mice but not in amyloid-only mice, making the adaptive arm functionally
      required rather than a bystander.
    disposition: RETAINED
    report_quote: |-
      In P301S tauopathy mice — but *not* in amyloid-only mice — the authors observed a unique innate and adaptive immune response, and **depletion of either microglia or T cells blocked tau-mediated neurodegeneration**.
    rationale: >-
      Verified against the cached abstract of PMID:36890231; the perturbation framing is
      accurate. Already the seed's own evidence and already curated in the entry, so
      nothing to integrate.
    citations:
      - PMID:36890231
  - claim_id: cd103-polarity-inverted
    statement: >-
      Brain-infiltrating cytotoxic CD8 T cells in Alzheimer disease carry a CD103-positive
      tissue-resident memory phenotype.
    disposition: REJECTED
    report_quote: |-
      the Constantin group reported brain CD8 T cells with a CD103⁺ tissue-resident memory phenotype participating in AD neuropathology
    rationale: >-
      The cited paper reports the opposite marker polarity. PMID:40993111 is titled
      "CD103(-)CD8(+) T cells promote neurotoxic inflammation in Alzheimer's disease via
      granzyme K-PAR-1 signaling" and its abstract states the brain CD8 compartment is
      "accumulating activated CD103- tissue-resident memory T cells that produce large
      amounts of granzyme K". The report repeats "CD103+" in the key finding, the evidence
      matrix, the mechanistic chain diagram and the Candidate Ontology Terms lead
      ("tissue-resident memory CD8 T cell (CD103+)"). That ontology lead must not be
      acted on; the cell population is CD103-negative and tissue-resident.
    citations:
      - PMID:40993111
  - claim_id: granzyme-k-par1-axis-underreported
    statement: >-
      PMID:40993111 contributes only independent-lab replication of the cytotoxic-CD8
      effector role.
    disposition: QUALIFIED
    report_quote: |-
      ***CD103⁺ tissue-resident CD8 in AD*** ([PMID:40993111](https://pubmed.ncbi.nlm.nih.gov/40993111/)) and ***adaptive immunity contribution*** ([PMID:39191349](https://pubmed.ncbi.nlm.nih.gov/39191349/)) — independent-lab replication of the cytotoxic-CD8 effector role, strengthening generalizability.
    rationale: >-
      True but a substantial undersell, and this is the report's most useful missed
      finding. The paper supplies a second independent perturbation result ("Ablation of
      brain CD103-CD8+ T cells in 3xTg-AD mice ameliorates cognitive decline and reduces
      neuropathology") and, separately, a molecular effector mechanism that does not run
      through interferon-gamma or PDCD1 at all ("GrK induces neuronal dysfunction and tau
      hyperphosphorylation in human and mouse cells via protease-activated receptor-1
      (PAR-1), which is expressed at higher levels in the AD brain"). It also names LFA-1
      integrin as the route of entry from the circulation. Two consequences for curation:
      granzyme K to PAR-1 is a curatable downstream arm the entry does not carry, and the
      experiment was done in 3xTg-AD, which has both amyloid and tau, so it does not
      cleanly sit inside the report's own tau-only scoping.
    citations:
      - PMID:40993111
  - claim_id: treg-direction-inverted
    statement: >-
      PMID:15549735 shows regulatory T cells were neuroprotective against amyloid-beta
      toxicity.
    disposition: REJECTED
    report_quote: |-
      A directly competing observation is that, in an amyloid-toxicity context, adaptive immunity can be protective. In *Vaccination with autoantigen protects against aggregated beta-amyloid and glutamate toxicity...* ([PMID:15549735](https://pubmed.ncbi.nlm.nih.gov/15549735/)), β-amyloid-induced neuronal loss was **greater in immunodeficient mice** and was "attenuated or augmented by elimination or addition, respectively, of naturally occurring CD4⁺CD25⁺ regulatory T cells (Treg)" — i.e., Tregs were neuroprotective.
    rationale: >-
      The report quotes the abstract accurately and then reverses it. Elimination of
      regulatory T cells attenuated the neurodegeneration and addition augmented it, so in
      that model regulatory T cells worsened the lesion. The abstract's own closing
      sentence proposes treating "with compounds that weaken Treg suppression". The
      report's own evidence matrix contains the contradiction unresolved, listing
      PMID:32075657 as "IIV breaks Treg tolerance, downregulates Abeta, improves
      cognition" under the heading "Opposite Treg manipulation, same beneficial outcome".
      Do not curate a protective regulatory-T-cell direction from this paper.
    citations:
      - PMID:15549735
  - claim_id: adaptive-immunity-protective-in-amyloid-context
    statement: >-
      In an amyloid-toxicity context adaptive immunity as a whole can be protective, which
      is why the cytotoxic-driver framing must stay tau-scoped.
    disposition: QUALIFIED
    report_quote: |-
      The lesson for the seed hypothesis: the *direction* of the T-cell effect flips with pathology, so the cytotoxic-driver framing must remain tau-scoped.
    rationale: >-
      The umbrella claim survives the source check that sinks the regulatory-T-cell
      gloss: amyloid-beta-induced neuronal loss was "significantly greater in
      immunodeficient mice than in normal mice" (PMID:15549735). Retain the scoping
      conclusion, drop the regulatory-T-cell mechanism the report attaches to it, and note
      that this is an intraocular injection lesion model rather than an amyloid-depositing
      transgenic, which limits how far the "amyloid context" reading generalizes.
    citations:
      - PMID:15549735
  - claim_id: ifng-pd1-valence-reverses-by-pathology
    statement: >-
      Interferon-gamma and PDCD1 blockade is protective in tau models but the same axis is
      beneficial in amyloidosis, so no universal therapeutic prescription follows.
    disposition: RETAINED
    report_quote: |-
      In amyloidosis, the reverse holds: PD-1 checkpoint blockade "leads to clearance of cerebral amyloid-β (Aβ) plaques and improved cognitive performance" through an IFN-γ-dependent, monocyte-derived-macrophage response (IFN-γ beneficial;
    rationale: >-
      Verified against PMID:26779813 (Baruch 2016, Nat Med), which is correctly
      characterized. Already curated as the discussion gap_ad_tcell_ifng_pd1_valence_and_source,
      so no new integration is required.
    citations:
      - PMID:26779813
      - PMID:36890231
  - claim_id: nk-cells-parallel-ifng-source
    statement: >-
      Natural killer cells are a parallel source of interferon-gamma and tumour necrosis
      factor alpha whose release correlates negatively with cognition, so interferon-gamma
      effects cannot be attributed exclusively to clonal CD8 T cells.
    disposition: RETAINED
    report_quote: |-
      NK cells are an alternative source. In AD (DAT) patients, purified NK cells (CD16⁺CD56⁺CD3⁻) showed increased spontaneous and IL-2-induced IFN-γ and TNF-α release versus controls (p<0.001), and "significant negative correlations among the spontaneous release of IFN-γ and TNF-α from NK and the decrease of the score of cognitive function (MMSE) were found" (
    rationale: >-
      Verified against PMID:11268360; the quoted sentence, the cell-surface phenotype and
      the significance level all match the abstract. Worth flagging that this is a
      22-patient, 15-control study from 2000, so it is a caveat about attribution rather
      than a quantified effect. Already curated in the same discussion.
    citations:
      - PMID:11268360
  - claim_id: virtual-memory-cd8-antigen-independent-alternative
    statement: >-
      Age-expanded virtual-memory CD8 T cells arise without foreign-antigen priming and can
      be clonal and cytotoxic, so restricted T-cell-receptor clonality does not by itself
      establish a tau-antigen-driven response.
    disposition: RETAINED
    report_quote: |-
      The hypothesis interprets restricted TCR clonality as evidence of a tau-antigen-driven response, but aging expands **virtual-memory (VM) CD8 T cells that "arise in the absence of foreign antigen priming"** and acquire a memory-like phenotype through self-reactivity, IL-15, and EOMES — including subsets with cytotoxic and inflammatory potential ([PMID:42432776](https://pubmed.ncbi.nlm.nih.gov/42432776/)). Literature searches for tau-peptide/MAPT-specific TCR reactivity in AD ("tau specific T cells antigen MAPT autoreactive"; "tau antigen specific T cell recognition") returned **no primary demonstration** — only vaccine and review hits.
    rationale: >-
      The virtual-memory half is verified: PMID:42432776 is a 2026 Immunity and Ageing
      review whose abstract states virtual-memory CD8 T cells "arise in the absence of
      foreign antigen priming", names IL-15 and EOMES, and describes subsets "with
      cytotoxic and inflammatory potential". This is a review, so it establishes the
      alternative as live, not as demonstrated in Alzheimer brain. The negative-search
      half is unverified (see the pubmed-tau-tcr-reactivity-search data source). Already
      curated as gap_ad_tcell_antigen_identity.
    citations:
      - PMID:42432776
  - claim_id: csf-clonal-cd8-omits-ebv-specificity
    statement: >-
      Clonally expanded CD8 T cells patrolling the cerebrospinal fluid in Alzheimer disease
      provide correlative human support for the adaptive-immune-tau axis.
    disposition: QUALIFIED
    report_quote: |-
      clonally expanded CD8 T cells patrolling the CSF in AD ([PMID:31915375](https://pubmed.ncbi.nlm.nih.gov/31915375/)) and T-cell infiltration correlating with neuronal loss/cognitive decline ([PMID:38437992](https://pubmed.ncbi.nlm.nih.gov/38437992/)
    rationale: >-
      The observation is real but the report uses it only in the supportive column and
      never mentions what those clones recognize. Gate et al. mapped the expanded
      cerebrospinal-fluid clones to Epstein-Barr virus antigens, including EBNA3A — which
      cuts directly against the tau-antigen inference the report elsewhere identifies as
      its weakest link, and is a stronger argument for its own case than the aging review
      it leans on. The Alzheimer entry already records this in
      gap_ad_tcell_antigen_identity. Also note PMID:38437992 is a narrative review, not
      primary human data, so "T-cell infiltration correlating with neuronal loss" is
      review-level here.
    citations:
      - PMID:31915375
      - PMID:38437992
  - claim_id: human-primary-tauopathy-tissue-support
    statement: >-
      Post-mortem human primary tauopathy tissue shows T-cell infiltration tracking tau
      pathology independently of amyloid, supporting cross-tauopathy generalization.
    disposition: RETAINED
    report_quote: |-
      Human, amyloid-independent tissue evidence exists. A Boche-lab post-mortem study (2024) quantified CD4⁺/CD8⁺ T cells against multiple pTau epitopes and 30 inflammatory proteins across 45 PSP, 33 Pick's, and 12 FTLD-MAPT cases versus 52 controls, explicitly motivated by the observation that T-cell infiltration seen in THY-Tau22 mice "remains to be confirmed in FTLD-tau patients
    rationale: >-
      Verified in detail against PMID:37703311; every cohort count (45, 33, 12, 52), the
      30-protein panel, and the THY-Tau22 motivation quote are exactly right. The
      companion chronic traumatic encephalopathy study (PMID:41957675) is likewise
      accurate — 58 individuals exposed to repetitive head impacts plus 18 unexposed
      controls, with infiltrating T cells elevated in p-tau-bearing sulci, correlated with
      synaptic loss, and spatially related to MHC class II expressing cells. Neither PMID
      appears anywhere in the Alzheimer entry, so both are genuine additions.
    citations:
      - PMID:37703311
      - PMID:41957675
  - claim_id: microglial-recruiter-step-strong-in-human
    statement: >-
      Microglial activation with MHC class II antigen presentation is a strongly supported,
      required recruiting step in the causal chain.
    disposition: QUALIFIED
    report_quote: |-
      [STRONG — required recruiter; APOE4 amplifies (PMID:39468688)]
    rationale: >-
      Strong in the mouse tauopathy perturbation, and the report is right that microglial
      depletion also blocks the phenotype in PMID:36890231. But the report grades the step
      STRONG without distinguishing species, and its own best human dataset pushes the
      other way: PMID:37703311 concludes frontotemporal lobar degeneration with tau shows
      "remarkably little activation of microglia" while T-cell recruitment was
      chemokine-driven and detectable specifically in Pick's disease. Curate the recruiter
      step as model-organism-strong and human-uncertain rather than STRONG outright.
    citations:
      - PMID:36890231
      - PMID:37703311
  - claim_id: amyloid-pd1-failed-replication
    statement: >-
      The amyloid PD-1 blockade result has a documented history of failed independent
      replication.
    disposition: NEEDS_VERIFICATION
    report_quote: |-
      Notably, the amyloid PD-1-blockade result also has a documented history of failed independent replication.
    rationale: >-
      Asserted twice — here and as knowledge gap G6 — with no citation. The G6 row's "what
      was checked" column reads only "Noted in F005 record", which points back at the same
      unsourced sentence. I did not locate or fetch a replication-failure paper. This is a
      material claim about the reliability of the competing amyloid result, so it should
      not be curated as fact without an identifier.

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's headline judgment — retain EMERGING, keep the tau restriction — is
  correct, but almost all of it is the seed hypothesis read back. The seed already
  said "in tauopathy but not pure amyloidosis", already cited PMID:36890231 for both
  the depletion and the interferon-gamma/PDCD1 results, and already listed antigen
  identity, the antigen-presenting route and the B-cell arm as open. Most of the
  Alzheimer entry's existing curation for this hypothesis, including both knowledge-gap
  discussions, was written from an earlier pass over this same report on 2026-07-11.

  Two source checks changed the picture. First, PMID:40993111 is titled "CD103(-)CD8(+)
  T cells promote neurotoxic inflammation in Alzheimer's disease via granzyme K-PAR-1
  signaling" and reports accumulation of activated CD103-negative tissue-resident memory
  T cells. The report calls them "CD103+" in the key finding, in the evidence matrix, in
  the mechanistic chain and, most damagingly, in its Candidate Ontology Terms lead. A
  curator who acted on that lead would bind the wrong cell type. The same paper is also
  under-reported: it is not merely an independent replication of "cytotoxic CD8 matter",
  it is a second independent perturbation (ablation of brain CD103-CD8+ T cells in
  3xTg-AD ameliorates cognitive decline and reduces neuropathology) plus a distinct,
  interferon-gamma-independent effector mechanism (granzyme K acting on neuronal PAR-1 to
  induce dysfunction and tau hyperphosphorylation). That is the most valuable thing in
  the report and the report does not notice it.

  Second, PMID:15549735 is glossed backwards. The report quotes the abstract correctly —
  neurodegeneration was "attenuated or augmented by elimination or addition,
  respectively" of CD4+CD25+ regulatory T cells — and then writes "i.e., Tregs were
  neuroprotective". Elimination attenuating and addition augmenting means regulatory T
  cells made the lesion worse in that model; the abstract closes by proposing treatment
  "with compounds that weaken Treg suppression". The umbrella point the report wanted to
  make (adaptive immunity is protective in an amyloid context) does survive, because
  neuronal loss was greater in immunodeficient mice, but the regulatory-T-cell direction
  as written is inverted and must not be curated.

  Everything else I checked held up: PMID:42432776, PMID:11268360, PMID:26779813,
  PMID:37703311 (cohort counts exactly right) and PMID:41957675 all say what the report
  says they say, and none of the 23 cited identifiers failed to resolve.

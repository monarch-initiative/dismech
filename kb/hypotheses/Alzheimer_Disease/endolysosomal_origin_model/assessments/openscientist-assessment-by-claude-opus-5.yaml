overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The most useful report of the set on the dataset question, and the only one to
  answer it constructively rather than negatively. I had supplied transcriptomic
  datasets while telling the report in the prompt that they were probably unfit,
  and asking it to name what data type would actually discriminate. It did, and
  then went further: it identified that the discriminating human data type —
  laser-capture proteomics of amyloid plaques — already exists publicly, and that
  it already reports endosomal and lysosomal proteins particularly highly
  enriched within plaques (PMID:35418158). That is qualitatively what an
  intraneuronal origin predicts. It does not exclude glial or dystrophic-neurite
  contributions and so does not settle the controversy, but it converts the crux
  from "blocked on data that do not exist" to "re-analyzable against existing
  human proteomics", which is a materially different curation state.

  The report also usefully split the hypothesis into two modules with different
  evidentiary weight: an upstream module (β-CTF drives endosome enlargement
  before and independent of extracellular amyloid-beta) that is independently
  replicated across laboratories and systems, and a downstream module (v-ATPase
  inhibition, PANTHOS, plaque-as-tombstone) that is largely single-laboratory.
  That asymmetry was already implicit in the curated notes but is now stated.

  One finding partly resolves a caveat I had recorded as unresolved. I had
  carried the Cataldo negative — endosomes of normal size in advanced
  presenilin-mutation familial disease — as evidence that the mechanism does not
  generalize across genetic subtypes. PMID:31416668 shows that in isogenic human
  iPSC neurons, PSEN1 mutants do accumulate β-CTFs and do enlarge Rab5-positive
  endosomes, so the postmortem negative may reflect end-stage tissue or the
  limits of an endosome-size readout. The hypothesis notes and the plaque-origin
  controversy were updated accordingly. That paper is also the strongest
  non-Nixon-laboratory support for the upstream module, in a human
  non-overexpressing system with a pharmacological rescue.

  Spot-checking found no fabricated quotation across the four identifiers I
  fetched, including two I had not previously seen.

  One claim I declined to act on fully: the report describes the plaque
  proteomics data as public. The papers are real and verified, but neither cached
  full text contains a data-availability statement naming a ProteomeXchange or
  PRIDE accession, so no `datasets:` record was added. Curating an accession I
  could not resolve would repeat exactly the error this workflow is built to
  catch.

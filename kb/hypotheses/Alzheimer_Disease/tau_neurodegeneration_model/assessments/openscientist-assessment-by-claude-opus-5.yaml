schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: tau_neurodegeneration_model
assessed_at: "2026-09-04T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The seed for this run is the entry's CANONICAL tau hypothesis, which carries
  two 2009 to 2011 references establishing only that hyperphosphorylated tau is
  the principal tangle component. Against that low baseline the report is
  genuinely additive: none of the eighteen identifiers in its evidence matrix
  appear anywhere in the disorder entry. I fetched eleven of them into
  references_cache/ and checked the report's wording against the cached source.
  Every identifier resolved to the paper described, and no quotation was
  fabricated.

  The report's most valuable contribution is a claim the entry does not make at
  all: at matched Braak III to IV tangle burden, demented and cognitively
  resilient people differ in glial phenotype, including in cortex without overt
  tau deposits (PMID:35534858, 55 brains). That is a real constraint on the
  canonical model, since it says tangle burden alone does not determine clinical
  expression. Three further verified additions are the hnRNP R and MAPT
  antisense result showing axonal tau reduction lowers both phospho-tau and
  amyloid plaques in 5xFAD mice (PMID:40734174), tau seeding preceding
  AT8-positive tangles with pTau-Ser214 tracking seeding (PMID:39211286), and
  the absence of any gantenerumab effect on tau PET despite robust amyloid and
  fluid-biomarker responses in GRADUATE I and II (PMID:39887500).

  Where the report overreaches is in converting framing sentences into findings.
  Its headline refinement, that soluble pretangle species rather than mature
  tangles are the primary neurotoxic entity, is anchored on a sentence that
  PMID:41695614 offers as background rather than as its own result; that paper's
  actual contribution is a default-mode-network pretangle quantification from
  Braak stage III. The neuroprotective-tangle claim is worse: PMID:31456657 is an
  in vitro study of EFhd2 effects on tau liquid-liquid phase separation, and the
  quoted words about putative neuroprotective tangles are its opening premise,
  not a tested result. The PP2A link is carried by a 2001 starvation model rather
  than an Alzheimer model. And the proposed curation snippet for the TANGO trial
  is the safety and tolerability sentence, which says nothing about the efficacy
  failure it is offered to document; the usable sentence is in the cached full
  text instead.

  Two curation leads cannot be written as proposed: GO:0015630 is a cellular
  component and is offered as a biological process, and there is no
  qualifications slot on a mechanistic hypothesis. I checked the remaining
  candidate identifiers against this repository's caches and they resolve with
  matching labels.

analyses:
  - analysis_id: literature-corpus-screen
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Provider-side literature retrieval and synthesis into an executive
      judgment, evidence matrix, annotated causal chain, knowledge-gap list, and
      curation leads.
    input_data_source_ids:
      - pubmed
    status_reason: >-
      The report describes a systematic evaluation of over 100 primary research
      papers and reviews and elsewhere gives the figure as roughly 101, while the
      only committed retrieval record lists 38 identifiers. No search expression,
      inclusion criteria, or screening log is committed, so the screen cannot be
      shown to have run as described.
    limitations: >-
      The report's own limitations section concedes that non-English literature
      and preprints were not searched, but nothing in the repository allows the
      realised coverage to be measured.
  - analysis_id: source-absence-checks
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Asserted checks of GenCC and ClinGen for a gene-disease validity curation
      covering tau in Alzheimer disease specifically.
    input_data_source_ids:
      - gencc
      - clingen
    status_reason: >-
      Reported as checked with nothing found, but no query, date, or response
      artifact is committed. The conclusion drawn, that late-onset Alzheimer
      genetics is polygenic rather than Mendelian for MAPT, is background
      knowledge rather than a result of the check.
claims:
  - claim_id: verdict-partially-supported-canonical-retained
    statement: >-
      The tau neurodegeneration model is partially supported and should remain
      the default disease mechanism while being annotated with qualifications.
    disposition: RETAINED
    report_quote: "**Verdict: PARTIALLY SUPPORTED — with critical qualifications requiring knowledge base refinement**"
    rationale: >-
      The two axes are compatible in this vocabulary: CANONICAL means the widely
      accepted default explanatory model, not a claim that every mechanistic
      detail is settled. The report's recommendation to retain CANONICAL while
      recording qualifications is the right call, and the qualifications it names
      are individually assessed below.
    citations:
      - PMID:35534858
      - PMID:41695614
  - claim_id: glial-phenotype-separates-demented-from-resilient-at-matched-braak
    statement: >-
      At matched Braak III to IV tangle burden, people who became demented show
      increased proinflammatory and decreased homeostatic glial markers relative
      to cognitively resilient people, including in cortical regions without
      overt tau deposits.
    disposition: RETAINED
    report_quote: "Changes in glial cell phenotypes **precede** overt NFT formation, correlate with markers of cortical cell damage, and predict cognitive status at Braak III–IV stages"
    rationale: >-
      Verified against the cached abstract: 55 brains at Braak III to IV with
      diverging antemortem cognition plus Braak 0 to II controls, quantified in
      temporal pole and visual cortex. The finding that the glial difference
      appears in visual cortex, which carries no overt tau at those stages, is
      the load-bearing part and the report reports it correctly. This is the
      single most useful addition in the report and is absent from the entry.
      Evidence is human post-mortem and observational.
    citations:
      - PMID:35534858
  - claim_id: neuroinflammation-as-required-cofactor
    statement: >-
      Microglial and astrocytic activation is a required intermediary that
      converts tau pathology into clinical disease, rather than a downstream
      consequence.
    disposition: QUALIFIED
    report_quote: "neuroinflammatory co-factors** (microglial and astrocytic activation) appear to be required intermediaries converting tau pathology into clinical disease"
    rationale: >-
      The observation behind this is sound and verified, but requiredness is a
      causal claim and the supporting design is cross-sectional post-mortem
      comparison of demented and resilient brains. Nothing cited perturbs glia
      and measures the clinical or degenerative consequence in a matched
      tau burden. Curate the association, and treat necessity as the open
      question; the report's own Gap 4 asks exactly this and its Test 2 is the
      experiment that would settle it.
    citations:
      - PMID:35534858
      - PMID:31277708
  - claim_id: pretangle-soluble-tau-is-primary-toxic-species
    statement: >-
      Soluble pretangle tau aggregates rather than mature neurofibrillary tangles
      are the primary neurotoxic species driving progression and cognitive
      impairment.
    disposition: QUALIFIED
    report_quote: "the primary neurotoxic species are **soluble pretangle tau oligomers**, not the mature neurofibrillary tangles emphasized in the canonical model"
    rationale: >-
      The words the report quotes for this are real and appear in PMID:41695614,
      but they are that paper's background framing, introduced as what growing
      evidence suggests, rather than its result. What the paper actually
      establishes, and what is worth curating from it, is that pretangle moieties
      marked by pS422, TOC1, and TNT2 are present as neuropil threads and
      neuronal inclusions in default-mode-network hubs as early as Braak stage
      III with stepwise increases from Braak IV to V. Curate the measurement, not
      the framing sentence.
    citations:
      - PMID:41695614
  - claim_id: mature-tangles-may-be-neuroprotective-sequestration
    statement: >-
      Conversion of toxic tau oligomers into neurofibrillary tangles is a
      neuroprotective sequestration step, evidenced by the EFhd2 work.
    disposition: QUALIFIED
    report_quote: "EFhd2 modulates oligomer-to-tangle conversion; tangles may sequester toxicity"
    rationale: >-
      PMID:31456657 is an in vitro biophysics paper showing that EFhd2 alters tau
      liquid-liquid phase separation in a calcium-dependent and coiled-coil
      domain-dependent manner. The phrase about putative neuroprotective tangles
      is in its opening premise; the study measures no toxicity, no neurons, and
      no protection. The oligomer-versus-tangle question is a legitimate open
      controversy and belongs in the entry as a knowledge gap, but this citation
      cannot carry it as evidence, and the report grades it as moderate-confidence
      qualifying evidence.
    citations:
      - PMID:31456657
  - claim_id: mapt-mutations-causal-but-not-in-alzheimer-disease
    statement: >-
      MAPT mutations prove tau dysfunction can cause neurodegeneration without
      amyloid, but they cause primary tauopathies rather than Alzheimer disease,
      which is a secondary tauopathy.
    disposition: RETAINED
    report_quote: "MAPT mutations are not found in typical AD** — they cause primary tauopathies (FTD), not AD"
    rationale: >-
      Verified against the cached PMID:30742061 abstract, which states that MAPT
      mutations causing FTDP-17 provide the clearest evidence of a causal role for
      tauopathy in neurodegeneration and cautions that they may not explain how
      tauopathy arises in the absence of mutation. The report deserves credit for
      stating the limitation rather than letting the genetic argument stand
      unqualified. Note that PMID:30742061 is a review and the report grades it as
      human genetic evidence.
    citations:
      - PMID:30742061
      - PMID:38554150
  - claim_id: anti-tau-antibody-trials-failed-primary-endpoints
    statement: >-
      Gosuranemab, tilavonemab, and semorinemab failed their primary clinical
      endpoints in phase 2 Alzheimer trials, with semorinemab significant on
      ADAS-Cog11 but not ADCS-ADL in mild-to-moderate disease.
    disposition: RETAINED
    report_quote: "Semorinemab slowed ADAS-Cog11 (p=0.0008) but not ADCS-ADL"
    rationale: >-
      Verified. The cached TANGO record confirms n=654 and that no gosuranemab
      dose produced a favourable CDR-SB change at week 78. The cached Lauriet
      record confirms n=272 and a 42.2 percent reduction in ADAS-Cog11 decline
      with a 2.89 point absolute difference at p=0.0008, alongside no effect on
      ADCS-ADL. This translational gap is absent from the entry and is a fair
      qualification of a hypothesis curated as CANONICAL.
    citations:
      - PMID:38012285
      - PMID:36730056
      - PMID:37643887
  - claim_id: tango-proposed-snippet-does-not-support-the-claim
    statement: >-
      The TANGO trial failure should be curated using the sentence stating that
      gosuranemab had an acceptable safety profile and was generally well
      tolerated.
    disposition: REJECTED
    report_quote: "Gosuranemab had an acceptable safety profile and was generally well tolerated"
    rationale: >-
      The proposed snippet reports safety and tolerability and says nothing about
      efficacy, so it cannot substantiate the claim it is offered for. A usable
      sentence exists in the cached full text, which states that no dose resulted
      in a favourable change from baseline CDR-SB at week 78 compared with
      placebo. Anyone acting on this lead must requote from the cache.
    citations:
      - PMID:38012285
  - claim_id: gantenerumab-does-not-move-tau-pet
    statement: >-
      Gantenerumab reduced amyloid PET and multiple fluid biomarkers in GRADUATE
      I and II but produced no treatment effect on tau PET.
    disposition: RETAINED
    report_quote: "Gantenerumab reduced amyloid PET but no effect on tau PET"
    rationale: >-
      Verified verbatim against the cached abstract, which states that tau PET
      showed no treatment effect over 116 weeks. This is a direct human
      interventional result bearing on the amyloid-to-tau link, absent from the
      entry, and it cuts against a simple unidirectional cascade. Note the trial
      is anti-amyloid, so it constrains the upstream trigger rather than the tau
      hypothesis itself.
    citations:
      - PMID:39887500
  - claim_id: axonal-tau-reduction-lowers-tau-and-amyloid
    statement: >-
      Reducing axonal tau, by hnRNP R loss or by a MAPT antisense oligonucleotide
      blocking hnRNP R binding to Mapt, lowers both phospho-tau aggregates and
      amyloid-beta plaques in 5xFAD mice.
    disposition: RETAINED
    report_quote: "Brains of 5×FAD mice deficient for hnRNP R contained less phospho-tau aggregates and amyloid-β plaques in the cortex and hippocampus"
    rationale: >-
      Verified verbatim, and the cached abstract adds that intracerebroventricular
      MAPT antisense injection reduced phospho-tau and plaque load and prevented
      neurodegeneration. Absent from the entry, mechanistically specific, and the
      cleanest support in the report for a bidirectional rather than
      unidirectional tau-amyloid relation. Evidence is MODEL_ORGANISM.
    citations:
      - PMID:40734174
  - claim_id: tau-seeding-precedes-at8-positive-tangles
    statement: >-
      Tau seeding activity appears well before AT8-positive tangles, and
      phosphorylation at Ser214 tracks seeding activity and contributes to
      propagation.
    disposition: RETAINED
    report_quote: "tau seeding is an early event that occurs well before the appearance of AT8-positive NFT"
    rationale: >-
      Verified verbatim. The cached abstract also reports that preventing Ser214
      phosphorylation reduced propagation in mouse primary neurons and seeding in
      a Drosophila tauopathy model, which is the perturbation arm the report does
      not mention and which strengthens the lead. Two mouse tauopathy models plus
      Drosophila, so MODEL_ORGANISM only.
    citations:
      - PMID:39211286
  - claim_id: pp2a-inhibition-dominant-over-kinase-activation
    statement: >-
      PP2A inhibition is the dominant in vivo driver of tau hyperphosphorylation,
      overriding inhibition of GSK-3beta and CDK5.
    disposition: QUALIFIED
    report_quote: "inhibition of PP2A is likely the dominant factor in inducing tau hyperphosphorylation in the starved mouse"
    rationale: >-
      The quotation is exact and the result is real, but the model is
      starvation-induced hyperphosphorylation in adult mice from 2001, not an
      Alzheimer model, and the paper's own claim is scoped to the starved mouse.
      The report promotes it to a STRONG link in the Alzheimer causal chain. Keep
      the finding, keep the scope.
    citations:
      - PMID:11441005
  - claim_id: braak-tau-pet-semiquantitative-concordance
    statement: >-
      Semi-quantitative tau PET measures agree closely with visually assessed
      Braak staging, with accuracy 0.84 to 0.90.
    disposition: RETAINED
    report_quote: "Braak staging of tau PET agrees with neuropathology (accuracy 0.84–0.90)"
    rationale: >-
      The numbers are verified against the cached abstract, in 263 ADNI3
      participants imaged with flortaucipir. One correction to the framing: the
      comparison is between semi-quantitative measures (CenTauRz, STOC) and
      visually assessed Braak stage on PET, not between PET and neuropathology, so
      the evidence-matrix wording overstates what was validated against. The
      report also uses this paper's background sentence about tau and cognitive
      decline to carry its tau-outperforms-amyloid claim, which the paper does not
      test.
    citations:
      - PMID:41770504
  - claim_id: go-0015630-is-not-a-biological-process
    statement: >-
      GO:0015630 (microtubule cytoskeleton) is a candidate biological-process term
      for this hypothesis.
    disposition: REJECTED
    report_quote: "GO:0015630 (microtubule cytoskeleton)"
    rationale: >-
      GO:0015630 is a cellular component, so it cannot be bound in a
      biological_processes slot, and it is not present in this repository's term
      caches. The remaining candidate identifiers in the same list do check out
      against the caches with matching labels: GO:0050808 synapse organization,
      GO:0007409 axonogenesis, GO:0006954 inflammatory response, GO:0007018
      microtubule-based movement, GO:0008017 microtubule binding, GO:0004674
      protein serine/threonine kinase activity, CL:0000129 microglial cell,
      CL:0000127 astrocyte, MONDO:0004975 Alzheimer disease, and MONDO:0017276
      frontotemporal dementia.
  - claim_id: qualifications-slot-does-not-exist
    statement: >-
      A qualifications field should be added to the hypothesis YAML to record the
      toxic-species, co-factor, and trial-failure caveats.
    disposition: REJECTED
    report_quote: "Recommend adding a \"qualifications\" field to the hypothesis YAML"
    rationale: >-
      No such slot exists on a mechanistic hypothesis and inventing one would
      fail schema validation. The three caveats have existing homes: narrow the
      hypothesis description, record the reasoning in notes, and open a
      discussions entry with kind KNOWLEDGE_GAP for the oligomer-versus-tangle
      question and for whether neuroinflammation is required. Recording the
      caveats is right; the proposed mechanism for recording them is not.
  - claim_id: corpus-size-exceeds-committed-record
    statement: >-
      The report rests on a systematic evaluation of over 100 primary research
      papers and reviews.
    disposition: NEEDS_VERIFICATION
    report_quote: "Our systematic evaluation of over 100 primary research papers and reviews"
    rationale: >-
      The committed retrieval record lists 38 identifiers and no search protocol
      or screening log is committed. The claimed corpus cannot be checked, so the
      report's coverage and absence statements should be read as provider
      assertions rather than as systematic-review findings.

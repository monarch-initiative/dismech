overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The first run using the dataset-anchored template, and it earned its keep. I
  spot-checked every citation I acted on by fetching it into references_cache/
  and comparing the report's quotation against the cached source; unlike the
  earlier HSV-1 report on this disease, I found no fabricated quotation or
  mis-attributed identifier in this one.

  Two findings materially changed the curated entry. First, PMID:30126037 (Musi
  2018) was absent from the KB and breaks the framing I had written into the
  senescent-cell-identity controversy. I had described the dispute as "mouse
  studies say glia, the largest human survey says excitatory neurons"; Musi
  reports a senescence expression profile in microdissected tangle-bearing
  neurons from human post-mortem brain AND that in four transgenic mouse models
  it is tangles rather than plaques that carry the senescence-like phenotype.
  That is mouse and human evidence agreeing on neurons, so the conflict is
  between studies, not between species. It is also a third independent mouse
  clearance experiment. The controversy discussion and the hypothesis notes were
  rewritten accordingly.

  Second, the report surfaced that human interventional data now exist: the
  SToMP-AD phase 1 open-label senolytic trial (NCT04063124, n=5; PMID:37679434,
  with exploratory biomarkers in PMID:40274471). My curation had asserted the
  model was untested in people. The trial cannot test efficacy, but it
  establishes central nervous system penetrance of dasatinib, and its biomarker
  result — stable CSF amyloid-beta and tau alongside rising CSF interleukin-6 —
  is not what a simple SASP-reduction reading predicts. It was added as a
  clinical_trials entry and folded into the hypothesis notes.

  The Dataset-Anchored Analysis section is the part worth keeping in the
  workflow. It ranked the six supplied datasets, named a first analysis, and —
  most usefully — reported honestly that one dataset I supplied (geo:GSE160936)
  is structurally incapable of settling the question I supplied it for, because
  it profiles glia only and so has no neuronal comparator. It also raised a
  circularity risk I had not considered: Musi defined a senescence signature FROM
  tangle-bearing neuron transcriptomes, so scoring that signature in
  geo:GSE129308 would be partly circular and the honest test requires an
  independently defined signature.

  One error propagated from me rather than from the provider: the dataset context
  I supplied gave PMID:41620473 for geo:GSE129308, which is GEO's linked
  citation but is a 2026 reuse of the series rather than the originating study
  (Otero-Garcia 2022, PMID:35882228). The report repeats it. The disease entry
  has been corrected; the report retains the wrong identifier.
claims:
  - claim_id: overall-verdict-partially-supported
    statement: >-
      The cellular senescence model is partially supported — causally strong in
      mice, unresolved in humans — and should remain EMERGING.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED — causally strong in mice, unresolved in humans, with a load-bearing internal contradiction about which cell is senescent."
    rationale: >-
      Concordant with the curated status and with the primary evidence I verified
      independently. No status change made.
    citations:
      - PMID:30232451
      - PMID:30936558
      - PMID:35531351
  - claim_id: musi-2018-neuronal-senescence-human-and-mouse
    statement: >-
      Tangle-bearing neurons microdissected from human post-mortem Alzheimer
      brain carry a senescence expression profile, and in four transgenic mouse
      models tangles rather than plaques show the senescence-like phenotype.
    disposition: RETAINED
    report_quote: "Musi 2018, PMID:30126037"
    rationale: >-
      Verified by fetching the paper into references_cache/; both claims appear
      in the abstract and were promoted to the entry as separate HUMAN_CLINICAL
      and MODEL_ORGANISM evidence items after snippet validation. This is the
      report's single most valuable contribution, because it falsifies the
      species-split framing previously curated in the controversy discussion.
    citations:
      - PMID:30126037
  - claim_id: stomp-ad-human-senolytic-trial-exists
    statement: >-
      Human interventional senolytic data in Alzheimer disease exist — an
      open-label, uncontrolled phase 1 trial in five participants showing central
      nervous system penetrance of dasatinib, no cognitive or imaging change, and
      stable CSF amyloid-beta and tau with a rise in CSF interleukin-6.
    disposition: RETAINED
    report_quote: "the SToMP-AD phase 1 senolytic trial (PMID:37679434; PMID:37162971) and its exploratory biomarker follow-up (PMID:40274471)"
    rationale: >-
      All three identifiers verified and cached; the quantitative statements match
      the abstracts. Promoted as a clinical_trials entry (NCT04063124) plus
      hypothesis-level evidence. Correctly characterized by the report as
      establishing feasibility rather than efficacy.
    citations:
      - PMID:37679434
      - PMID:40274471
  - claim_id: gse160936-cannot-adjudicate
    statement: >-
      A glia-only dataset cannot adjudicate a glia-versus-neuron cell-identity
      dispute, because it contains no neuronal comparator.
    disposition: RETAINED
    report_quote: "It profiles glia only, so it **cannot compare glia vs neurons** and therefore cannot adjudicate the central cell-type dispute"
    rationale: >-
      Correct, and a genuinely useful negative finding about a dataset the curator
      supplied. Recorded in the entry's datasets notes so the limitation travels
      with the record rather than being rediscovered.
  - claim_id: musi-signature-circularity
    statement: >-
      Scoring the Musi senescence signature in tangle-bearing neuron data is
      partly circular, because that signature was derived from tangle-bearing
      neuron transcriptomes; an independently defined signature is required.
    disposition: RETAINED
    report_quote: "Musi 2018 defined senescence *from* microdissected NFT neuron transcriptomes, so re-deriving the same signature in a similar design is partly circular"
    rationale: >-
      A methodological point I had not identified, and one that changes how the
      recommended first analysis should be run. Retained as a lead for anyone
      acting on the dataset recommendations.
    citations:
      - PMID:30126037
  - claim_id: cdkn2a-dropout-caveat
    statement: >-
      CDKN2A/p16 is severely under-detected in single-nucleus RNA-seq, so a
      negative senescence call in a cell type may reflect dropout rather than
      biology.
    disposition: QUALIFIED
    report_quote: "snRNA-seq **severely under-detects CDKN2A/p16** (dropout) — the answer will hinge on signature choice"
    rationale: >-
      Biologically plausible and consistent with the low expression of the locus,
      and it cuts in a direction that matters — against confident negative calls in
      rarer cell types. Retained in the entry's hypothesis notes as a stated
      caveat rather than as an evidenced claim, because the report supplies no
      citation quantifying the dropout rate and I did not verify one.
  - claim_id: gil-2020-cell-cycle-reentry
    statement: >-
      PMID:32155994 supports neuronal cell-cycle re-entry in human Alzheimer
      disease.
    disposition: NEEDS_VERIFICATION
    report_quote: "neuronal cell-cycle re-entry in human AD (32155994)"
    rationale: >-
      The identifier and author attribution are correct (Gil et al. 2020), but the
      paper is titled for perinuclear lamin A and nucleoplasmic lamin B2 in
      hippocampal neuron types through Alzheimer progression. Lamin B loss is a
      recognized senescence correlate, so the citation is defensible for a
      senescence-like neuronal state; "cell-cycle re-entry" overstates what the
      title claims. Not promoted to the entry.
    citations:
      - PMID:32155994
  - claim_id: gse129308-wrong-pmid
    statement: >-
      geo:GSE129308 is associated with PMID:41620473.
    disposition: REJECTED
    report_quote: "GSE129308 — NFT⁺ vs NFT⁻ single somas from the same AD brains (27 samples, PMID:41620473)"
    rationale: >-
      Incorrect, but the error originated in the curator-supplied dataset context,
      not in the provider: PMID:41620473 is GEO's linked citation and is a 2026
      reuse of the series (Dharshini et al., on layer 4 resilience). The
      originating study is Otero-Garcia et al. 2022, PMID:35882228, whose title
      matches the series title exactly. The disease entry now carries the
      originating identifier and a note not to trust the GEO-linked one.
    citations:
      - PMID:35882228

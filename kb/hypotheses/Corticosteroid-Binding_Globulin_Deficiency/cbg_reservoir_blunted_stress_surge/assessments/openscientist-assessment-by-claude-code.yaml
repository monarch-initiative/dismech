analyses:
  - analysis_id: free-exposure-and-peak-simulation
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      One-compartment plasma model with saturable CBG binding, linear albumin
      binding and clearance of free cortisol only. A stress secretion pulse is
      simulated with and without CBG at identical secretion, with a 24-setting
      one-at-a-time sensitivity sweep (report analyses A1 to A3).
    comparison: CBG absent against CBG normal, at identical secretion.
    input_data_source_ids:
      - published-binding-and-pk-parameters
    software:
      - software_name: Python with numpy and scipy solve_ivp
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table1_baseline_and_surge.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table2_sensitivity_free_peak_ratio.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_figures_fig1_free_vs_total_surge.png
    status_reason: >-
      Output tables and the figure are committed. The model code, environment
      file and manifest named in the report were not delivered, so the
      provider's run cannot be replayed. PARTIAL and not REPORTED_ONLY because
      the result was reproduced independently by the assessor from the written
      model description (replication script and output listed under
      artifacts): free peak ratio 1.23 to 2.92 across 54 settings, against the
      provider's 1.21 to 2.01 across 24, and free exposure conserved.
    limitations: >-
      Assumes instantaneous binding equilibrium, a single well-mixed
      compartment, clearance of free hormone only, and the same adrenal
      secretion in both genotypes. The last assumption is the one the mouse
      data put in doubt.
  - analysis_id: rescue-route-sweeps
    status: REPORTED_ONLY
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Sweeps asking whether a secretion deficit, clearance of bound hormone,
      downstream readout kinetics or cooperativity could restore a blunted
      free rise (report analyses A4, A7, A9, A11, A12).
    input_data_source_ids:
      - published-binding-and-pk-parameters
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table3_secretion_scaling.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table5_nonrestrictive_clearance.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table8_secretion_rescue_and_cooperativity.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_figures_fig2_secretion_scaling.png
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_figures_fig6_secretion_rescue_and_cooperativity.png
    status_reason: >-
      Tables and figures are committed but no code was delivered and the
      assessor did not reproduce these sweeps. The report says its code file
      does not cover analyses A6 to A12.
    limitations: >-
      The secretion sweep shows how large a stress-specific cut in adrenal
      output would be needed, not whether one occurs.
  - analysis_id: receptor-occupancy-simulation
    status: REPORTED_ONLY
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Adds fractional receptor occupancy F/(Kd+F) to the plasma model and
      integrates it over the stress episode at several receptor affinities and
      across a seven-genotype allelic series (report analyses A6, A10).
    input_data_source_ids:
      - published-binding-and-pk-parameters
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table4_receptor_occupancy.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_derived_table7_allelic_series.csv
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_figures_fig3_receptor_occupancy.png
      - ../openscientist_artifacts/kb_hypotheses_Corticosteroid-Binding_Globulin_Deficiency_cbg_reservoir_blunted_stress_surge_openscientist_artifacts_figures_fig5_allelic_series_dose_response.png
    status_reason: >-
      Outputs committed, code not delivered, not reproduced by the assessor.
    limitations: >-
      The direction follows from the shape of the occupancy curve, but the size
      of the deficit depends on receptor affinities and pulse shapes that were
      assumed. The report notes the predicted deficit is too small and too
      shallow across genotypes to match reported symptom severity.
claims:
  - claim_id: free-exposure-conserved-peak-higher
    statement: >-
      Under clearance of free cortisol only, removing CBG leaves free-cortisol
      exposure over a stress episode unchanged and raises the free peak.
    disposition: QUALIFIED
    report_quote: >-
      The faster clearance is true of total cortisol and false of free cortisol.
    rationale: >-
      Accepted, with the qualification that it holds under the model's
      assumptions (equal secretion, clearance of free hormone only, fast
      binding equilibrium) and that the provider's own run cannot be replayed.
      It follows from mass balance and was reproduced independently. The premise,
      that free-cortisol kinetics are normal in people without functional CBG,
      is a human measurement (PMID:21054475) and was already cited in the
      entry.
    citations:
      - PMID:21054475
    analysis_ids:
      - free-exposure-and-peak-simulation
  - claim_id: seed-hypothesis-refuted
    statement: >-
      The hypothesis that loss of the CBG-bound store blunts the stress rise in
      free glucocorticoid is contradicted.
    disposition: QUALIFIED
    report_quote: >-
      CONTRADICTED-AS-STATED
    rationale: >-
      Accepted for the mechanism as worded: the lost store alone cannot blunt
      the free rise. Not accepted as a statement that no blunted rise occurs.
      Two mouse studies measured one (PMID:20022933, PMID:22930537), and the
      simulation holds secretion equal between genotypes, which a mouse study
      of adrenal gene expression calls into question (PMID:31570737). The
      schema has no contradicted status, so the entry's hypothesis was
      restated and set to ALTERNATIVE, and the pharmacokinetic study was added
      to it as evidence against faster clearance of free cortisol.
    citations:
      - PMID:20022933
      - PMID:22930537
      - PMID:31570737
    analysis_ids:
      - free-exposure-and-peak-simulation
      - rescue-route-sweeps
  - claim_id: human-stress-test-opposite-direction
    statement: >-
      The one human stress test in a carrier showed a high, not blunted,
      salivary cortisol response.
    disposition: QUALIFIED
    report_quote: >-
      This is n = 1, a single case with no control group
    rationale: >-
      Correct about PMID:17245537, which the entry already carried as evidence
      against the blunted-rise node. It is not the only human measurement of a
      stimulated free-cortisol proxy: PMID:40365551 reports a low stimulated
      salivary cortisol in one Lyon homozygote and normal or high values in two
      homozygous siblings, after ACTH and not a stress test. The human evidence
      is mixed and very thin in both directions.
    citations:
      - PMID:17245537
      - PMID:40365551
  - claim_id: pulse-shape-occupancy-successor
    statement: >-
      Loss of plasma buffering sharpens free cortisol pulses, and sharper
      pulses of equal area give less integrated receptor occupancy.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      One restated version survives, and it sits downstream of plasma.
    rationale: >-
      Simulation only. The supporting experiment (PMID:34375333) compares
      constant with pulsatile corticosterone at equal dose in rats, which is
      the opposite manipulation, as the report itself says. Recorded in the
      entry as a sentence in the existing pulsatility hypothesis with that
      paper as indirect support, not as a new hypothesis.
    citations:
      - PMID:34375333
    analysis_ids:
      - receptor-occupancy-simulation
  - claim_id: bundle-code-and-manifest
    statement: >-
      The artifact bundle contains a canonical manifest, the model code and an
      environment record.
    disposition: REJECTED
    report_quote: >-
      was not re-executed in the sandbox, and does not cover analyses A6 to A12
    rationale: >-
      None of the three files is in the delivered bundle, which holds the
      rendered report, derived tables, figures, provenance plots and the PubMed
      search log. The report is candid that its code file is a transcription
      that was not re-executed. The bundle was therefore not put through the
      analysis-run gate, and no analysis is recorded as SUCCEEDED.

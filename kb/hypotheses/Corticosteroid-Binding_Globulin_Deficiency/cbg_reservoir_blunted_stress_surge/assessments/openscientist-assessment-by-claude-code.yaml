schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: cbg_reservoir_blunted_stress_surge
assessed_at: "2026-11-28T10:30:00Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The run tested whether losing the CBG-bound cortisol store can, by itself,
  make free cortisol rise less during stress. Its answer is no, and that answer
  holds up. If only free cortisol is cleared, which is what the human
  pharmacokinetic study in CBG-null homozygotes shows, the free-cortisol
  exposure over a stress episode depends on how much the adrenal secretes and
  how fast free hormone is cleared, and not on CBG. Removing the buffer makes
  the free peak higher and shorter, not lower. The assessor re-derived this
  from the mass balance and reproduced it with an independent simulation
  written from the report's description (54 parameter settings; free peak 1.2
  to 2.9 times higher without CBG in every one; free exposure unchanged to
  within 6 percent, the residue being the slow return of the buffered case to
  baseline within the 36 hour window).

  What the run does not show is that the mouse observations are wrong. Two
  mouse studies measured a smaller free corticosterone rise after stress in
  Cbg knockout animals. The simulation says the lost store cannot be the whole
  explanation for that, so something else must differ in those mice, such as
  adrenal output or how corticosterone is cleared. The hypothesis in the
  disease entry was therefore restated and moved from EMERGING to ALTERNATIVE:
  the lost store is established, the blunted free rise is a mouse observation
  whose cause is not established, and the one stress test in a human carrier
  went the other way. The report missed a 2025 family report in which one of
  three homozygous siblings had a low stimulated salivary cortisol and the
  other two did not.

  The run's proposed successor, that sharper cortisol pulses at the same total
  exposure deliver less receptor occupancy, is simulation only. It was folded
  into the existing pulsatility hypothesis as a lead and not promoted as
  evidence.

  Every quantitative result is from a simulation with assumed parameters; no
  patient or animal dataset was used. The derived tables, figures and a PubMed
  search log were delivered. The manifest, model code and environment file
  that the report lists were not, so the provider's own analyses cannot be
  re-run from the bundle.
artifacts:
  - openscientist-assessment-by-claude-code-replication.py
  - openscientist-assessment-by-claude-code-replication.tsv

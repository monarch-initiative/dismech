summary: >-
  The report's verdict is correct and its curation recommendation is the right
  one: keep the hypothesis EMERGING. Each half of the chain is real and the two
  halves were established with different lesions in different systems. The
  molecular arm, that C-terminal ABCC9/SUR2A missense displaces the intrinsic
  ATP-hydrolytic cycle and mis-gates the Kir6.2 pore, is shown in recombinant
  systems only (PMID:15034580). The myocardial arm, that failure of KATP
  metabolic decoding under load produces calcium overload and
  calcineurin-dependent remodeling, is shown in a Kir6.2/KCNJ11 knockout mouse
  (PMID:16782803), which deletes the pore subunit rather than carrying an ABCC9
  allele. Nothing joins them in a heart, and the report says so rather than
  glossing it.
  What the run adds beyond the seed is genetic and checkable. ABCC9 is
  loss-of-function tolerant and strongly missense constrained, which argues
  against haploinsufficiency and for a dominant-negative mis-gating allele
  class; the founder allele p.Ala1513Thr sits in gnomAD at a combined
  4.96e-5; no ABCC9 variant anywhere in ClinVar carries expert-panel review;
  and the wider allelic series runs the other way, with gain of function
  causing Cantu syndrome and biallelic loss of function causing AIMS rather
  than a cardiomyopathy. The constraint figures and the founder-allele
  frequency were reproduced exactly by replaying the committed query, and the
  expert-panel claim was reproduced independently.
  Two defects. The report's identification of VCV 856369 as the second ClinVar
  record for p.Ala1513Thr contradicts its own derived artifact, which records
  that accession as an intronic variant, so that pairing must not be carried
  into the entry. And GO:0008282 is a cellular component, the Kir6.x/SURx
  complex, not a channel activity as the ontology lead presents it. The
  gene-validity quote from PMID:31983221 is not in the cached abstract, so the
  entry should cite the 12-gene sentence that is.

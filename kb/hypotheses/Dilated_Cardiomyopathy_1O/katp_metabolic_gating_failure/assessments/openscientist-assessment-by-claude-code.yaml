claims:
  - claim_id: molecular-arm-recombinant-only
    statement: >-
      The ATP-hydrolytic mis-gating mechanism is demonstrated for CMD1O ABCC9
      missense alleles, but only in heterologous recombinant systems.
    disposition: RETAINED
    report_quote: >-
      is directly demonstrated, but only in **recombinant heterologous systems**
    rationale: >-
      The cited sentence is verbatim in the cached abstract of PMID:15034580,
      including the conclusion that defective catalysis-mediated pore
      regulation is a mechanism for channel dysfunction and susceptibility to
      dilated cardiomyopathy. The system limitation is the paper's own.
    citations:
      - PMID:15034580
  - claim_id: myocardial-arm-is-a-pore-subunit-knockout
    statement: >-
      The calcium-overload and calcineurin-dependent remodeling arm is shown in
      a Kir6.2/KCNJ11 knockout mouse, not in any heart carrying an ABCC9
      allele.
    disposition: RETAINED
    report_quote: >-
      demonstrated **only in a pore-subunit (KCNJ11/Kir6.2) knockout mouse**
    rationale: >-
      The quoted calcium/calcineurin sentence is verbatim in the cached
      abstract of PMID:16782803, and that paper's lesion is deletion of the
      pore-forming subunit. Reading complete channel absence as equivalent to a
      conformationally mis-gating SUR2A mutant would be the error, and the
      report refuses it.
    citations:
      - PMID:16782803
  - claim_id: missing-edge-in-a-heart
    statement: >-
      No study shows an ABCC9 catalytic-domain allele mis-gating KATP in a
      cardiomyocyte and thereby producing the remodeling phenotype in a heart.
    disposition: RETAINED
    report_quote: >-
      The critical causal edge — *an ABCC9 catalytic allele causing the remodeling phenotype in a heart* — remains entirely inferred.
    rationale: >-
      Follows from the two claims above: the arms were established with
      different lesions in different systems, so the junction between them is
      asserted rather than observed. This is the substance of the entry's
      existing knowledge gap, and the reason the hypothesis stays EMERGING.
  - claim_id: abcc9-dcm-validity-limited
    statement: >-
      ABCC9's gene-disease validity for dilated cardiomyopathy is weak: it is
      outside the robustly associated gene set and below the high-evidence
      ClinGen tiers.
    disposition: QUALIFIED
    report_quote: >-
      ABCC9's validity as a monogenic DCM gene is **Limited**
    rationale: >-
      Correct in substance but cite it differently. The quoted
      diagnostic-testing sentence is not in the cached abstract of
      PMID:31983221, whose abstract-verifiable claim is that the cohort
      "identified 12 genes that have robust evidence of disease association" —
      that is the sentence an entry should quote, since ABCC9 is not among
      them. PMID:33947203's abstract gives the tier counts but never names
      ABCC9, so "falls below these high-evidence tiers" is an inference from
      absence rather than a quotable statement. The entry already types the
      relationship DISPUTED, which is the accurate reading.
    citations:
      - PMID:31983221
      - PMID:33947203
  - claim_id: biallelic-lof-gives-aims-not-dcm
    statement: >-
      Complete biallelic SUR2 loss of function produces a neurodevelopmental
      and myopathic syndrome rather than a dilated cardiomyopathy, which
      argues against a generic KATP-loss model of CMD1O.
    disposition: RETAINED
    report_quote: >-
      That complete SUR2 loss-of-function produces a neuromuscular syndrome rather than DCM is a direct challenge to a simple KATP-gating-failure model
    rationale: >-
      The quoted non-functional-SUR2 sentence is verbatim in the cached
      abstract of PMID:38217872, which reports the AIMS phenotype rather than a
      cardiomyopathy. This is the single most useful thing the run contributes:
      it narrows any surviving version of the hypothesis to a specific
      dominant-negative missense class.
    citations:
      - PMID:38217872
      - PMID:42290677
  - claim_id: gof-gives-cantu
    statement: >-
      Gain-of-function ABCC9 variants cause Cantu syndrome, so the gene's
      dominant disease association runs in the opposite channel direction.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Gain-of-function** ABCC9 variants cause **Cantú syndrome**
    rationale: >-
      Well established in the field and consistent with the allelic-series
      argument, but neither PMID:41448431 nor PMID:39031464 is in
      references_cache, so the assessor could not check the quotes offline.
      Fetch them before citing either in the entry.
    citations:
      - PMID:41448431
      - PMID:39031464
  - claim_id: constraint-favours-dominant-negative
    statement: >-
      ABCC9 is loss-of-function tolerant and strongly missense constrained,
      which argues against haploinsufficiency and for a dominant-negative or
      conformational missense mechanism.
    disposition: RETAINED
    report_quote: >-
      Population-genetics constraint (LoF-tolerant, strongly missense-intolerant) is most consistent with a **dominant-negative / conformational** mechanism rather than haploinsufficiency
    rationale: >-
      The figures reproduce to full precision when the committed query is
      replayed, and the inference drawn from them is sound: it sharpens rather
      than proves the hypothesis, which is how the report presents it. The
      report is careful to add that the dominant-negative mechanism is itself
      unproven for a cardiac allele. Note the caveat recorded on the data
      source about which gene record the constraint was read from; it does not
      affect the direction.
    analysis_ids:
      - gnomad-constraint
  - claim_id: founder-allele-is-population-present
    statement: >-
      The CMD1O founder allele p.Ala1513Thr is present in gnomAD at a combined
      allele frequency around 5e-5, which is high for a fully penetrant
      dominant cause of a rare cardiomyopathy.
    disposition: RETAINED
    report_quote: >-
      p.Ala1513Thr is present in gnomAD at ~5×10⁻⁵
    rationale: >-
      The assessor's own clinvar_variants query returns exome 10/251,072 and
      genome 4/31,394 for p.Ala1513Thr, matching the derived table exactly.
      Retained on that independent check rather than on the provider's run,
      which committed no query for this join. New relative to the entry, which
      records no population frequency for the allele.
  - claim_id: no-expert-panel-review
    statement: >-
      No ABCC9 variant carries expert-panel ClinVar review.
    disposition: RETAINED
    report_quote: >-
      No ABCC9 variant carries expert-panel ClinVar review.
    rationale: >-
      Reproduced independently: across 2,139 ABCC9 ClinVar variants returned
      by gnomAD's join, the highest review level present is two gold stars, so
      nothing reaches expert-panel or practice-guideline status. The provider's
      own esearch for that review status also returned zero.
  - claim_id: vcv-856369-as-a-second-a1513t-record
    statement: >-
      VCV 856369 is the second ClinVar record for the p.Ala1513Thr amino-acid
      change.
    disposition: REJECTED
    report_quote: >-
      legacy VCV 8162 "Pathogenic, no assertion criteria" (0 stars) and VCV 856369 "Conflicting classifications of pathogenicity" (1 star)
    rationale: >-
      The report body contradicts its own derived artifact, which records VCV
      856369 as the intronic c.4512+711G>A and files it as a pleiotropy example
      spanning CMD1O, Cantu, AIMS and familial atrial fibrillation rather than
      as an A1513T record. gnomAD's ClinVar join shows p.Ala1513Thr carrying
      two separate records at two genomic positions, the 0-star Pathogenic one
      with no gnomAD frequency and a 1-star Conflicting one that carries the
      14/282,466 counts. The substantive point, that the founder allele's
      pathogenicity is asserted at low confidence and the amino-acid change
      also appears as Conflicting, survives; the specific accession pairing
      does not, and must not be carried into the entry.
  - claim_id: keep-emerging
    statement: >-
      The hypothesis should stay EMERGING and not be promoted, with any
      surviving version restricted to dominant-negative catalytic-domain
      missense alleles.
    disposition: RETAINED
    report_quote: >-
      Retain `status: EMERGING`. Do not promote to CANONICAL.
    rationale: >-
      Follows from the checked claims. The run did not resolve the dispute: it
      found no ABCC9-allele cardiac model and no expert-panel classification,
      and it strengthened the competing readings. That is what the knowledge
      gap records, so the gap stays open too.
  - claim_id: ontology-lead-katp-complex
    statement: >-
      GO:0008282 names a KATP channel activity.
    disposition: REJECTED
    report_quote: >-
      KATP channel activity (GO:0015272 inward rectifier K⁺ channel; GO:0008282)
    rationale: >-
      GO:0008282 is "inward rectifying potassium channel", a cellular component
      defined as the complex of four Kir6.x pore subunits and four SURx
      regulatory subunits. It is the right term for the channel complex and the
      wrong one for an activity, so it belongs in a complex slot if used at
      all. GO:0015272, which the same lead names, is the activity term
      ("ATP-activated inward rectifier potassium channel activity") and is
      correct. CL:0000746 is also correct, resolving to "cardiac muscle cell",
      so the cell-type lead stands.

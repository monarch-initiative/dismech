# gnomAD GraphQL API query
# Endpoint: https://gnomad.broadinstitute.org/api
# Dataset: gnomAD v2.1.1 constraint (GRCh38 reference_genome parameter; constraint derived from v2.1.1 exomes)
# Retrieved: 2026-10-24
# Purpose: assess ABCC9 tolerance to LoF vs missense to discriminate haploinsufficiency
#          vs dominant-negative mechanism for the CMD1O KATP gating-failure hypothesis.
{
  gene(gene_symbol: "ABCC9", reference_genome: GRCh38) {
    gene_id
    symbol
    gnomad_constraint {
      pLI
      oe_lof oe_lof_lower oe_lof_upper
      oe_mis mis_z lof_z
      exp_lof obs_lof exp_mis obs_mis
    }
  }
}

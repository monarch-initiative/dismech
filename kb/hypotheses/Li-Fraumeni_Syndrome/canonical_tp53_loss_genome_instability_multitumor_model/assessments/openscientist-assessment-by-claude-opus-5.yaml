    source_type: DATABASE
    name: PubMed / MEDLINE literature corpus
    access_status: UNVERIFIABLE
    notes: >-
      Every finding in the report is literature-derived and the report states that a
      PubMed search "confirmed MILI as the only registered RCT" in LFS. No search
      strategy, date-stamped query, result count, screening table, or exclusion log
      is committed anywhere in the hypothesis directory, so neither the positive
      retrievals nor the negative-existence claim can be reproduced. Prose is not an
      access record.
  - data_source_id: iarc_tp53_database
    source_type: DATABASE
    name: IARC TP53 Database
    uri: https://p53.iarc.fr/
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Named twice, as the source of functional variant data underpinning the
      Petitjean transactivation analysis and in knowledge gap 4 on the
      genotype-phenotype map for 2000+ TP53 variants. The report reproduces no query,
      no release version, and no extracted record; the database is reached only
      through a cited publication.
  - data_source_id: clingen_tp53_vcep
    source_type: DATABASE
    name: ClinGen TP53 Variant Curation Expert Panel
    uri: https://clinicalgenome.org/
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Invoked in knowledge gap 4 as an ongoing effort that would resolve variant
      classification. No ClinGen assertion identifier, classification, or download is
      quoted. The dismech entry independently cites a ClinGen gene-disease validity
      assertion for TP53, which the report does not mention.
  - data_source_id: lfs_registries_nci_iarc
    source_type: DATABASE
    name: NCI and IARC Li-Fraumeni syndrome registries
    identifier: NCT01443468
    access_status: CITED_NOT_ACCESSED
    notes: >-
      Discriminating test 3 proposes a retrospective gain-of-function versus
      loss-of-function stratification "using large LFS registries (NCI, IARC)". This
      is a future analysis proposal, not data access. The NCI cohort enters the report
      only through published cohort papers.
analyses:
  - analysis_id: literature_evidence_synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Multi-iteration literature retrieval and synthesis into a 30-row evidence
      matrix, a 20-item findings list, a causal-chain diagram, five alternative
      models, nine knowledge gaps, and five discriminating tests.
    input_data_source_ids:
      - pubmed_literature
    status_reason: >-
      The report asserts a specific corpus and workflow ("20 confirmed findings, 37
      evidence items, 115+ papers reviewed across 5 investigative iterations") but
      commits no search logs, screening records, per-iteration outputs, or the
      remaining papers. The citation sidecar enumerates 34 PMIDs. The findings are
      also numbered F001 to F020 while F011, F012 and F014 never appear, and the
      evidence matrix has 30 rows against a claimed 37 evidence items, so the
      internal counts do not reconcile.
    limitations: >-
      Provider-internal retrieval may explain the totals, but they cannot be audited
      from the committed artifacts and should not be read as quality metrics.
  - analysis_id: figure_generation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Generation of four embedded figures: an evidence-strength assessment, a
      mechanistic causal-chain diagram, an evidence-matrix visualization, and a
      knowledge-gaps table.
    status_reason: >-
      The report body carries four figure placeholders of the form
      "{{figure:...png|caption=...}}", but the hypothesis directory contains only
      openscientist.md and its citation sidecar. There is no openscientist_artifacts
      directory and no committed image, so the figures cannot be inspected and no
      artifact_root is declared for this assessment.
claims:
  - claim_id: canonical-core-chain
    statement: >-
      The chain from germline heterozygous TP53 pathogenic variant, through somatic
      biallelic inactivation and genome instability, to early-onset multi-organ
      cancer predisposition is established.
    disposition: RETAINED
    report_quote: >-
      The core causal chain — germline heterozygous TP53 pathogenic variants →
      somatic biallelic inactivation → genome instability → early-onset multi-organ
      cancer predisposition — is established beyond reasonable doubt.
    rationale: >-
      Correct, and independently anchored by the primary sources the report cites:
      penetrance in the NCI cohort (PMID:27496084, already curated), 96% loss of
      heterozygosity in core-spectrum tumors (PMID:34240179), and Trp53 mouse models
      (PMID:9110404). It is nonetheless a restatement of the seed hypothesis that was
      handed to the provider from this knowledge base, so it produces no new support
      for the mechanism itself. The report's value lies in the quantification and
      spectrum work assessed in the claims below, not in the central thesis.
    citations:
      - PMID:27496084
      - PMID:34240179
      - PMID:9110404
  - claim_id: loh-96-percent-core-tumors
    statement: >-
      Loss of heterozygosity of the germline TP53 variant occurs in 96% of core LFS
      spectrum tumors and in a much lower fraction of non-core tumors.
    disposition: RETAINED
    report_quote: >-
      Loss of heterozygosity of germline TP53 variant was observed in 96.0% (95% CI =
      79.7% to 99.9%) of core LFS spectrum-type tumors
    rationale: >-
      Verbatim and correct against the cited abstract, which reports 96.0% in core
      LFS spectrum-type tumors versus 45.5% in other tumors from the same paired
      tumor-normal series. The confidence interval is wide because the core-tumor
      denominator is small, and the paper's own conclusion is the complementary one
      the report underplays: a subset of tumors in TP53 carriers retain the wild-type
      allele and may be unrelated to the germline defect. This generalizes the
      entry's existing second-hit evidence, which came only from pediatric
      adrenocortical tumors.
    citations:
      - PMID:34240179
  - claim_id: chip-confounds-germline-tp53-testing
    statement: >-
      A 24% clonal-hematopoiesis rate among blood-detected pathogenic TP53 variants
      means blood-only testing overestimates germline TP53 prevalence.
    disposition: QUALIFIED
    report_quote: >-
      24% CHIP rate means current blood-based testing overestimates germline TP53
      prevalence.
    rationale: >-
      The number is accurate for its source: of 50 patients with pathogenic or likely
      pathogenic TP53 variants, 12 (24.0%) were clonal-hematopoiesis related and 4
      (8.0%) were mosaic. The direction of the caveat is right and clinically
      important, and nothing in the dismech entry recorded it. But the denominator is
      50 variants ascertained within 17,922 cancer patients undergoing paired
      tumor-normal sequencing, a population enriched for prior cytotoxic therapy and
      for age-related clonal hematopoiesis. The rate should not be transferred to
      unselected germline testing. The same paper's mirror-image finding, that 35.3%
      of true germline carriers did not meet LFS testing criteria, is at least as
      consequential and the report mentions it only in passing.
    citations:
      - PMID:34240179
  - claim_id: petitjean-cited-for-gain-of-function
    statement: >-
      PMID:17401424 supports gain-of-function properties as a driver of
      allele-specific LFS phenotypes beyond simple loss of function.
    disposition: REJECTED
    report_quote: >-
      Petitjean et al. (2007) further demonstrated that in LFS, the age at onset of
      certain tumors correlates directly with the degree of transactivation capacity
      lost by the specific missense mutation
    rationale: >-
      The quoted sentence is a fair paraphrase of the paper, but it is deployed under
      the report's heading "Gain-of-Function Mutations Produce Allele-Specific
      Phenotypes Beyond Simple LOF" and is immediately followed by a gain-of-function
      conclusion. The paper says the opposite about gain of function: it concludes
      that intrinsic mutagenicity, loss of transactivation, and to a lesser extent
      dominant-negative activity drive mutation patterns and tumor phenotype, and that
      "current experimental data on the acquisition of oncogenic activities (gain of
      function) by p53 mutants are too scarce and heterogenous to assess whether this
      property has an impact on tumor development and outcome". A degree-of-loss
      correlation is evidence about the severity of loss of function, not about gain
      of function. The gain-of-function case in this report rests on PMID:15607980
      alone.
    citations:
      - PMID:17401424
      - PMID:15607980
  - claim_id: olive-knockin-allele-specific-spectra
    statement: >-
      Knock-in mice carrying hotspot missense p53 alleles develop allele-specific
      tumor spectra distinct from p53 heterozygous null mice.
    disposition: RETAINED
    report_quote: >-
      p53R270H/+ and p53R172H/+ mice are models of Li-Fraumeni Syndrome; they
      developed allele-specific tumor spectra distinct from p53+/- mice.
    rationale: >-
      Verbatim from the cited abstract, which additionally reports novel carcinomas
      and more frequent endothelial tumors in p53R270H/- and p53R172H/- mice relative
      to p53-/- mice, and concludes that these alleles have enhanced oncogenic
      potential beyond simple loss of p53 function. This is the strongest experimental
      support in the report for the gain-of-function qualification, and it is genuinely
      absent from the dismech entry, whose gain-of-function node rested on a human
      onset-gradient cohort and a review. Model-organism evidence, so it should not
      stand alone for a human claim.
    citations:
      - PMID:15607980
  - claim_id: pin3-modifier-onset-shift
    statement: >-
      The TP53 PIN3 intron 3 duplication shifts mean age at first cancer diagnosis in
      TP53 carriers by 19 years.
    disposition: QUALIFIED
    report_quote: >-
      (rs17878362), a 16-bp duplication in intron 3, is associated with a 19-year
      difference in mean age at first diagnosis (A1A1: 28.0 years vs. A1A2: 47.0
      years; p = 0.01)
    rationale: >-
      The figures are exact and the effect is the largest single modifier reported for
      germline TP53. Two cautions. The comparison is 25 A1A1 carriers against 7 A1A2
      carriers within a series of 135 Brazilian LFS/LFL patients of whom only 32 were
      TP53 mutation carriers; the paper frames it as a first report, not a replicated
      estimate. Separately, the report's own evidence matrix records the context for
      this PMID as "French LFS families", which is wrong; the cohort is Brazilian. The
      adjacent MDM2 haplotype row (PMID:23884452) is the French one. The dismech entry
      already names PIN3 and MDM2 SNP309 as modifiers in prose without any citation,
      so this is a real gap to close, with the cohort stated accurately.
    citations:
      - PMID:19542078
      - PMID:23884452
  - claim_id: ferroptosis-supersedes-canonical-effectors
    statement: >-
      Ferroptosis, rather than cell-cycle arrest, apoptosis or senescence, may be the
      primary tumor-suppressive output of p53 in LFS.
    disposition: QUALIFIED
    report_quote: >-
      The p53(3KR) experiment suggests ferroptosis is critical, but this was
      demonstrated in xenograft models, not in the germline heterozygous context of
      LFS.
    rationale: >-
      The underlying result is solid and already curated in the dismech entry as a
      dedicated "Loss of Ferroptosis Surveillance" node citing the same paper. What
      the report adds is the much stronger framing that the canonical effectors "may
      be dispensable" and that emphasizing them is "mechanistically misleading". The
      3KR allele retains other p53 functions and the tumor-suppression readout was a
      xenograft, not a germline heterozygous animal; the report concedes exactly this
      in its own knowledge gap 2. Ferroptosis belongs in the model as a parallel
      non-canonical arm, which is how the entry curates it, not as a demoted
      replacement for the canonical effectors.
    citations:
      - PMID:25799988
  - claim_id: p53-cgas-sting-trex1-immune-arm
    statement: >-
      p53 drives TREX1 degradation, cytosolic dsDNA accumulation and cGAS/STING
      activation, giving it a non-cell-autonomous innate-immune tumor-suppressive arm.
    disposition: RETAINED
    report_quote: >-
      Additionally, p53 engages the cGAS/STING innate immune pathway by promoting
      degradation of the TREX1 exonuclease, leading to cytosolic dsDNA accumulation
      and type I interferon activation
    rationale: >-
      Accurately reported. The primary paper shows TRIM24-dependent p53-driven TREX1
      degradation, cytosolic dsDNA accumulation, cGAS/STING activation and type I
      interferon induction, that TREX1 overexpression blocks it, and that p53 tumor
      suppressor activity is compromised when cGAS/STING signaling is lost. This is a
      p53 tumor-suppressive function with no counterpart anywhere in the dismech
      entry, which curates the ferroptosis arm but not the immune arm. The work is
      cell-based and mouse-based and was not done in germline TP53-heterozygous human
      tissue, so a curated node must say so rather than assert the arm operates in LFS
      carriers.
    citations:
      - PMID:36638783
  - claim_id: birch-tissue-selective-predisposition
    statement: >-
      Germline TP53 mutation produces a tissue-selective rather than a general
      increase in cancer risk, and the mechanism of that selectivity is unexplained.
    disposition: RETAINED
    report_quote: >-
      The greatest relative risk increases were in adrenocortical carcinoma and
      phyllodes tumor—both rare cancers in the general population—suggesting that
      certain tissues have an acute dependency on p53 for tumor suppression.
    rationale: >-
      Supported by the cited cohort of 28 LFS families, which concludes explicitly
      that germline TP53 mutations do not simply increase general cancer risk and that
      there are tissue-specific effects, with breast, soft tissue sarcoma,
      osteosarcoma, brain, adrenocortical carcinoma, Wilms tumour and phyllodes tumour
      strongly associated. The report's accompanying assertion that no mechanistic
      explanation exists is the strongest gap it surfaces, and the dismech entry
      asserts a tissue-tropism explanation in prose without flagging that it is
      unresolved.
    citations:
      - PMID:11498785
  - claim_id: lung-cancer-spectrum-boundary
    statement: >-
      Lung cancer belongs to an extended, rather than core, LFS tumor spectrum.
    disposition: QUALIFIED
    report_quote: "Extended spectrum: hypodiploid ALL, CPC, phyllodes tumor, lung cancer"
    rationale: >-
      The report quietly demotes lung cancer from the seed hypothesis, where it is
      listed among the LFS-defining cancers, to an extended spectrum, and never
      reconciles the two. Its own key spectrum source found that lung, colon, bladder,
      prostate, cervix and ovary carcinomas did not occur to excess in LFS families
      (PMID:11498785), which argues for removal rather than demotion. Recent
      ascertainment-corrected pedigree analysis already cited in the dismech entry
      (DOI:10.1200/PO.23.00453) reaches the opposite conclusion and reports elevated
      lung, colorectal, gastric, pancreatic and ovarian risk. The boundary of the
      spectrum is a live disagreement between an older family-based study and modern
      pedigree modelling; the report presents a placement without acknowledging it.
    citations:
      - PMID:11498785
  - claim_id: hypodiploid-all-spectrum-expansion
    statement: >-
      Germline pathogenic TP53 variants are enriched in childhood ALL and are strongly
      associated with the hypodiploid subtype.
    disposition: RETAINED
    report_quote: >-
      TP53 pathogenic variants were significantly over-represented in ALL compared
      with non-ALL controls (odds ratio, 5.2; P < .001)
    rationale: >-
      Verbatim and correct. In 3,801 Children's Oncology Group frontline ALL patients,
      2.0% carried a rare nonsilent TP53 coding variant, carriers were older at
      diagnosis (median 15.5 versus 7.3 years), 65.4% versus 1.2% had hypodiploid ALL,
      and carriers had markedly worse event-free and overall survival plus a 25.1%
      versus 0.7% five-year cumulative incidence of second cancers. The dismech entry
      records a generic Leukemia phenotype with no evidence at all and no mention of
      hypodiploidy, so this is a substantive, well-sourced addition.
    citations:
      - PMID:29300620
  - claim_id: choroid-plexus-carcinoma-germline-tp53
    statement: >-
      Choroid plexus carcinoma carries a high frequency of germline TP53 mutation and
      should trigger germline testing.
    disposition: RETAINED
    report_quote: >-
      For choroid plexus carcinoma, Gozali et al. (2012) found germline TP53 mutations
      in 36.4% of CPC patients
    rationale: >-
      Accurate: 4 of 11 choroid plexus carcinoma patients tested in the 20-year
      Children's Hospital Los Angeles series were germline TP53 positive, and the
      authors themselves raise universal germline testing for childhood CPC. The
      denominator is 11, so 36.4% is a small-series estimate rather than a population
      frequency. The dismech CPC phenotype currently carries no evidence at all and
      asserts "approximately 50% of CPC patients" without a source, so this both fills
      the gap and tempers the figure.
    citations:
      - PMID:21990040
  - claim_id: brazilian-r337h-universal-in-cpc
    statement: In Brazil, 100% of choroid plexus carcinomas carry the TP53 R337H allele.
    disposition: QUALIFIED
    report_quote: in Brazil, 100% of CPCs carry R337H
    rationale: >-
      The percentage is arithmetically true and materially misleading. The cited study
      genotyped 57 pediatric tumor samples from a high-prevalence region and found
      R337H in 6; the "100%" figures are 2 of 2 choroid plexus carcinomas and 3 of 3
      adrenocortical tumors. Two cases cannot support a universal statement about a
      tumor type, and the study makes no such claim. The dismech entry already states
      the regional R337H contribution to CPC and adrenocortical carcinoma with an
      appropriately hedged proportion, so nothing should be tightened on the strength
      of this report.
    citations:
      - PMID:32671623
  - claim_id: metformin-mechanism-unresolved
    statement: >-
      The mechanism by which metformin exerts anticancer activity in LFS is
      unresolved, despite an ongoing randomized chemoprevention trial.
    disposition: RETAINED
    report_quote: metformin's mechanism of anticancer activity in this context is unclear
    rationale: >-
      Verbatim from the MILI trial protocol, which states this in its own background
      and makes establishing the mechanism of action an exploratory endpoint. This
      directly qualifies the dismech entry, whose metformin treatment record asserts a
      specific mechanism (complex I inhibition, AMPK activation, mTORC1 suppression)
      as settled rationale. The preclinical LFS mouse evidence for the OXPHOS axis is
      real and separately cited in the entry; what is unresolved is which of
      metformin's activities produces the chemopreventive effect in carriers.
    citations:
      - PMID:38308321
  - claim_id: report-corpus-and-figure-provenance
    statement: >-
      The evaluation rests on 20 confirmed findings, 37 evidence items and more than
      115 papers across 5 investigative iterations, with four supporting figures.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      20 confirmed findings, 37 evidence items, 115+ papers reviewed across 5
      investigative iterations
    rationale: >-
      None of these totals can be checked. The citation sidecar lists 34 PMIDs, the
      evidence matrix has 30 rows, and the numbered findings run F001 to F020 while
      F011, F012 and F014 never appear. The four figure placeholders point at PNG
      files that are not committed; the hypothesis directory holds only the report and
      its citation sidecar. Provider-internal retrieval may account for the larger
      corpus, but with no search log, screening table or artifact bundle these figures
      are not usable as quality evidence.

hypothesis_id: canonical_tp53_loss_genome_instability_multitumor_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The report's central chain (germline heterozygous TP53 pathogenic variant, somatic
  biallelic inactivation, genome instability, early-onset multi-organ cancer) is
  correct and is already the curated CANONICAL model, so the report supplies
  corroboration rather than a new mechanism. Its genuine contributions are
  quantitative and spectrum-related: paired tumor-normal sequencing quantifying
  loss of heterozygosity at 96% in core-spectrum tumors while also showing that 24%
  of blood-detected pathogenic TP53 variants are clonal hematopoiesis; the
  hypodiploid-ALL and choroid-plexus-carcinoma associations; the Olive knock-in
  mice that establish allele-specific phenotypes beyond simple loss of function;
  and the unresolved mechanism of metformin chemoprevention. Three problems limit
  the report. It cites Petitjean 2007 in support of gain-of-function when that
  paper attributes onset to loss of transactivation and explicitly declines to
  credit gain of function. It reports several percentages without their
  denominators, most severely "100% of CPCs carry R337H" from a 2-of-2 series. And
  it mislabels the Brazilian PIN3 modifier cohort as French. No artifact bundle is
  committed, so the four embedded figures, the "115+ papers" corpus and the
  five-iteration workflow cannot be audited.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

claims:
  - claim_id: idua-deficiency-gag-storage-core
    statement: >-
      Biallelic IDUA loss of function causes alpha-L-iduronidase deficiency and
      lysosomal accumulation of heparan sulfate and dermatan sulfate, which
      drives the multisystem pathology of MPS I.
    disposition: RETAINED
    report_quote: >-
      The canonical hypothesis that loss-of-function variants in *IDUA* cause
      α-L-iduronidase deficiency, leading to lysosomal accumulation of heparan
      sulfate (HS) and dermatan sulfate (DS), which drives the multisystemic
      pathology of Mucopolysaccharidosis type I (MPS I) / Hurler syndrome, is
      robustly supported by convergent genetic, biochemical, therapeutic, and
      model-organism evidence accumulated over decades.
    rationale: >-
      This restates the seed hypothesis, so as a proposition it produces no new
      support. What the report does add is independent corroboration the KB did
      not previously cite: a 538-patient registry genotype-phenotype analysis,
      a 1,803-person pseudodeficiency cohort, a fibroblast residual-activity
      series, and a phase IV laronidase trial. Each was checked against its
      cached abstract and each says what the report says it says.
    citations:
      - PMID:32780955
      - PMID:31194252
      - PMID:39559959
      - PMID:23786846
      - PMID:41163043
  - claim_id: residual-activity-severity-gradient
    statement: >-
      Residual alpha-L-iduronidase activity measured in patient fibroblasts
      tracks MPS I subtype severity, averaging 0.18% of control in Hurler, 0.27%
      in Hurler-Scheie, and 0.79% in Scheie.
    disposition: RETAINED
    report_quote: >-
      A modified IDUA assay in patient fibroblasts established a quantitative
      enzyme-activity gradient: Hurler (severe) mean 0.18% of control (range
      0–0.6%, n=5), Hurler-Scheie (intermediate) mean 0.27% (range 0.2–0.3%,
      n=3), and Scheie (attenuated) mean 0.79% (range 0.3–1.8%, n=5)
    rationale: >-
      Transcribed exactly from the PMID:23786846 abstract, including the
      subgroup sizes. Worth noting the study rests on 13 fibroblast lines in
      total and its own conclusion is the weaker "residual IDUA activity and
      severity of the MPS I phenotype are correlated", offered as a
      phenotype-prediction aid rather than as a threshold.
    citations:
      - PMID:23786846
  - claim_id: pseudodeficiency-alleles-no-disease
    statement: >-
      Adults homozygous for IDUA pseudodeficiency alleles show no clinically
      relevant excess of MPS I features relative to matched controls.
    disposition: RETAINED
    report_quote: >-
      A landmark retrospective cohort study of 1,803 individuals homozygous for
      IDUA pseudodeficiency alleles found "no clinically relevant significant
      differences between cases and controls nor genotype-phenotype
      associations across four alleles"
    rationale: >-
      Verbatim from the PMID:39559959 abstract and correctly attributed. The
      1,803 individuals were identified inside a 65,309-participant
      hospital biorepository, and ascertainment is by electronic medical record
      rather than by protocolized phenotyping, which the report does not say.
    citations:
      - PMID:39559959
  - claim_id: pathogenic-window-zero-to-two-percent
    statement: >-
      The pathogenic range of residual alpha-L-iduronidase activity is 0 to 2%
      of normal, with pseudodeficiency lying above roughly 2%.
    disposition: QUALIFIED
    report_quote: >-
      This establishes that the disease threshold lies between approximately
      0.79% (Scheie, mildly affected) and the pseudodeficiency range (typically
      >2% of normal activity), defining a remarkably narrow pathogenic window of
      0–2% residual activity.
    rationale: >-
      Neither cited source supplies the 2% figure. PMID:39559959 is an
      electronic-medical-record phenotype comparison and reports no enzyme
      activity values at all; PMID:23786846 reports a Scheie range topping out
      at 1.8% and makes no claim about pseudodeficiency. The window is provider
      arithmetic across two incommensurable assays and should not be curated as
      a quantitative threshold.
    citations:
      - PMID:23786846
      - PMID:39559959
  - claim_id: genotype-phenotype-registry-gradient
    statement: >-
      In the MPS I Registry, 67.6% of severe patients carry two variants
      predicted to severely disrupt gene or protein function, and 96.1% of
      attenuated patients carry at least one missense or intronic variant.
    disposition: RETAINED
    report_quote: >-
      67.6% of severe patients carry biallelic truncating variants, while 96.1%
      of attenuated patients retain at least one missense variant
    rationale: >-
      The percentages match PMID:31194252 exactly. The report's wording narrows
      the source slightly: the registry categories are "predicted to severely
      disrupt protein/gene function" and "at least one missense or intronic
      variant", which is broader than truncating and missense respectively. The
      direction and magnitude are unaffected.
    citations:
      - PMID:31194252
  - claim_id: immune-system-required-for-cardiac-disease
    statement: >-
      An intact immune system is a required co-factor for the MPS I
      cardiovascular phenotype, so GAG storage alone is not sufficient to
      produce aortic dilation and insufficiency.
    disposition: QUALIFIED
    report_quote: >-
      The immune system is a required co-factor for cardiovascular disease, and
      multiple secondary cascades — neuroinflammation, cathepsin B leakage,
      ganglioside accumulation, oxidative stress, and disrupted GAG-growth
      factor signaling — are critical downstream effectors that explain
      persistent residual disease burden even after successful enzyme
      correction.
    rationale: >-
      The underlying experiment is real and the quoted statistics are exact:
      B6 MPS I mice had larger ascending aortas, lower left ventricular
      function, and more frequent aortic insufficiency than NSG MPS I mice, all
      eleven inflammasome components were upregulated in B6 but only Aim2 and
      Ctsb in NSG, and B6 aortas carried medial macrophage and adventitial
      T-cell infiltrates that NSG aortas lacked. But this is a single study of
      12 B6 and 8 NSG mutant male mice whose own authors call it "a preliminary
      foray into a novel area of interest for MPS I" and list unconfirmed
      cytokine protein levels among its limitations. The two strains differ in
      genetic background as well as immune competence, and no human data test
      the claim. The report's phrase "required co-factor" is a stronger causal
      commitment than the source's "these results suggest that the innate and
      adaptive immune systems play a role".
    citations:
      - PMID:35165009
  - claim_id: equivalent-gag-storage-in-both-strains
    statement: >-
      Histology confirmed that immunocompetent and immunodeficient MPS I mice
      had equivalent GAG storage, so the divergent cardiac phenotype cannot be
      a storage difference.
    disposition: REJECTED
    report_quote: >-
      Both strains showed intramural inflammation, vacuolated cells, elastin
      fragmentation, and GAG staining — confirming equivalent GAG storage.
    rationale: >-
      The source states the opposite about quantification: "Alcian blue staining
      appeared much less intense although tissue GAG was not quantitated in
      either WT or MUT mice". What was shown to be equivalent is urinary GAG
      excretion, and the authors also record that histologic severity formed a
      continuum with generally milder elastin disarray in NSG mutants. Presenting
      unquantified staining as confirmation of equal tissue storage converts an
      acknowledged gap in the source into the load-bearing premise of the
      report's headline qualification.
    citations:
      - PMID:35165009
  - claim_id: cathepsin-b-drives-cardiovascular-pathology
    statement: >-
      Cathepsin B leaking from destabilized lysosomes is a driver of MPS I
      cardiovascular pathology and a druggable target.
    disposition: QUALIFIED
    report_quote: >-
      CtsB leaks from lysosomes, acting as a degradative agent of ECM; "CtsB
      inhibition improved cardiovascular parameters in MPS I mice and can have
      a potential benefit in this disease"
    rationale: >-
      PMID:29366749 has no abstract in PubMed's record, so the quoted sentence
      cannot be verified against a cached source and no snippet can be curated
      from it. More importantly, the report's own strongest citation cuts
      against the framing: PMID:35165009 found Ctsb upregulated in NSG mutant
      aortas that showed no dilation, and concluded that "increased cathepsin
      alone is not sufficient to produce aortic dilation". Cathepsin B is a
      candidate mediator, not an established driver.
    citations:
      - PMID:29366749
      - PMID:35165009
  - claim_id: persistent-residual-disease-after-transplant
    statement: >-
      Considerable residual disease burden requiring corrective surgery persists
      in all successfully transplanted Hurler patients at every decade of
      follow-up.
    disposition: RETAINED
    report_quote: >-
      Long-term follow-up of 25 HSCT-treated MPS I-H patients (7–33 years)
      reveals that "despite HSCT, considerable residual disease burden and
      ensuing corrective surgical interventions were observed in all, and at
      every decade of follow-up post HSCT"
    rationale: >-
      Verbatim from the PMID:33517895 abstract. A companion cohort adds that all
      66 tested MPS I patients had restrictive lung disease, with 49% of the
      transplanted group severe to very severe. The report's "7-33 years" is a
      restatement of the source's follow-up spread rather than a quoted figure;
      the abstract gives a median age of 21 years at last evaluation, range 8 to
      36.
    citations:
      - PMID:33517895
      - PMID:32713717
  - claim_id: self-sustaining-secondary-cascades
    statement: >-
      Persistent post-transplant disease is the strongest evidence that
      secondary cascades become self-sustaining and independent of ongoing GAG
      accumulation.
    disposition: QUALIFIED
    report_quote: >-
      This persistent disease despite enzyme correction is the strongest
      evidence that secondary cascades become self-sustaining once established.
    rationale: >-
      Neither source tests cascade autonomy. Residual burden after transplant is
      at least equally explained by irreversible damage accrued before a median
      transplant age of 21 months, and by poor enzyme delivery to avascular
      cartilage, bone, heart valve, and cornea, which is exactly what the
      cited ERT literature already reports. The report itself concedes in Gap 2
      that the transition point is unknown, which contradicts calling the
      inference the strongest evidence for it. This is a legitimate open
      question, not a finding.
    citations:
      - PMID:33517895
      - PMID:32713717
  - claim_id: corneal-clouding-keratocyte-storage
    statement: >-
      Corneal clouding in MPS results from glycosaminoglycan storage in stromal
      keratocytes rather than from corneal oedema caused by endothelial
      dysfunction.
    disposition: RETAINED
    report_quote: >-
      In MPS I cat corneas, "the corneal clouding was the result of storage in
      stromal keratocytes rather than corneal edema from endothelial
      dysfunction"
    rationale: >-
      Verbatim from PMID:8907377, whose conclusion is drawn across MPS I cat,
      MPS VI cat, and MPS VII dog corneas. The paper is explicit that MPS I
      endothelium carried abundant lysosomal inclusions yet still maintained
      corneal dehydration normally, which is the substantive point. This is
      animal morphology, so it grounds the mechanism rather than the human
      phenotype frequency.
    citations:
      - PMID:8907377
  - claim_id: dermatan-sulfate-primary-in-cornea
    statement: >-
      Dermatan sulfate is the species primarily responsible for corneal clouding
      because clouding occurs in MPS I and MPS VI but is absent in MPS II and
      MPS III.
    disposition: REJECTED
    report_quote: >-
      Corneal clouding is present in MPS I (HS+DS) and MPS VI (DS only) but
      absent in MPS II (HS+DS, no corneal clouding) and MPS III (HS only),
      suggesting DS plays the primary role via keratocyte storage disrupting
      stromal collagen organization.
    rationale: >-
      The cross-disease contrast appears in no cited source and the premise is
      wrong in its own terms: MPS II is listed as storing both HS and DS, so a
      DS-driven mechanism predicts clouding there, and the sentence has to
      assert the absence twice to hold together. Corneal involvement in MPS II
      is in any case reported rather than absent. The DS attribution is provider
      inference built on a factual error and must not be curated.
    citations:
      - PMID:8907377
  - claim_id: csf-heparan-sulfate-cns-biomarker
    statement: >-
      Cerebrospinal fluid heparan sulfate is brain-derived and tracks brain
      tissue heparan sulfate, supporting its use as a CNS biomarker in
      neuronopathic MPS.
    disposition: RETAINED
    report_quote: >-
      The predominant GAG observed in cerebrospinal fluid (CSF) in all
      individuals with neuronopathic MPS (nMPS) is HS. CSF HS correlates with
      brain tissue HS in MPS animal models. Therefore, the reduction of CSF HS
      reflects a decrease in brain tissue HS
    rationale: >-
      Verbatim from PMID:41935419. That source is a review arguing for
      regulatory acceptance of the biomarker, and the tissue correlation it
      cites is from animal models, so this is review-level and model-derived
      support rather than a human validation study. It is nonetheless a
      reasonable curation lead for a CNS biochemical readout.
    citations:
      - PMID:41935419
  - claim_id: cns-gene-therapy-corrects-neurodevelopment
    statement: >-
      Intracisternal AAV9-IDUA gene therapy corrects CNS disease in severe MPS I.
    disposition: QUALIFIED
    report_quote: >-
      First-in-human intracisternal AAV9-IDUA in a single Hurler patient showed
      sustained neurodevelopment >5 years without HSCT
    rationale: >-
      The narrative sentence is accurate to PMID:41966056, but the report's
      evidence matrix compresses it into the claim "Gene therapy corrects CNS".
      This is one open-label patient with no control, and the same report notes
      he "continues with weekly IDUA infusions", so somatic enzyme replacement
      is a co-intervention throughout. The result supports therapeutic potential
      and supports curating the treatment; it does not establish CNS correction.
    citations:
      - PMID:41966056
  - claim_id: candidate-ontology-bindings
    statement: >-
      The candidate ontology identifiers proposed for curation denote the
      concepts the report labels them with.
    disposition: REJECTED
    report_quote: >-
      MONDO:0011758 (MPS I), HP:0000501 (corneal clouding), HP:0001376 (joint
      contracture), HP:0000943 (dysostosis multiplex)
    rationale: >-
      HP:0000501 is Glaucoma, not corneal clouding; the corneal term is
      HP:0007957, which the disease entry already uses. HP:0001376 is
      Limitation of joint mobility, not joint contracture. MONDO:0011758 is
      Hurler syndrome specifically, not MPS I as a whole. Elsewhere in the same
      section GO:0072559 is labelled "Inflammasome complex assembly" when the
      term is NLRP3 inflammasome complex. HP:0000943, GO:0006027, GO:0030201,
      CL:0002363 and CL:0000129 are correct. Roughly half the proposed bindings
      are wrong, so none may be copied without re-derivation.
  - claim_id: literature-corpus-and-artifact-provenance
    statement: >-
      The report rests on a 116-paper review across five iterations with all
      snippets verified against stored abstracts, and produces figure artifacts.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Report generated 2026-05-24 across 5 investigative iterations. 116
      PubMed-indexed papers reviewed. 16 confirmed findings. All citation
      snippets verified against stored abstracts.
    rationale: >-
      The committed citation manifest lists 49 identifiers, and no search
      strategy, screening log, or 116-paper corpus is deposited, so the count
      and the five-iteration process cannot be reconstructed. Five figures are
      referenced with the provider's inline figure syntax but no image files
      exist in the hypothesis directory, so the artifact-friendly outputs the
      prompt asked for were never committed. Sampling ten citations found the
      quotes exact, which is consistent with the verification claim but does not
      establish it across the corpus.
  - claim_id: retain-canonical-status
    statement: >-
      The hypothesis should keep CANONICAL status while its description is
      expanded to treat secondary cascades as integral rather than incidental.
    disposition: RETAINED
    report_quote: >-
      The KB description should retain its CANONICAL status but be expanded to
      incorporate these secondary mechanisms as integral to pathogenesis, not
      merely epiphenomena.
    rationale: >-
      No source contests IDUA deficiency as the upstream cause, so CANONICAL is
      correct and no status change is warranted. The expansion is partly already
      present in the entry's hypothesis notes. The parts that are genuinely
      unresolved, chiefly the immune requirement for cardiac disease and the
      cause of persistent post-transplant burden, belong in discussion entries
      rather than in an assertive description.
    citations:
      - PMID:35165009
      - PMID:33517895

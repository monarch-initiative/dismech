analyses:
  - analysis_id: structural-distance-analysis-1bmf
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Minimum heavy-atom distance from each index residue to the gamma subunit
      (chain G) and to the nearest bound nucleotide ligand, computed in the three
      catalytic states (beta chains D, E, F) of PDB 1BMF, with a Walker A P-loop
      residue and a DELSEED residue as positive controls.
    comparison: >-
      Variant residues T334, L335 and V482 against each other and against the two
      internal controls, to test whether proximity to catalysis or to the rotor
      distinguishes the coupling arm from the catalytic arm.
    input_data_source_ids:
      - pdb-1bmf
      - uniprot-p06576
      - uniprot-p00829
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2_coupling_versus_catalysis_allelic_split_openscientist_artifacts_data_derived_residue_distances.csv
    status_reason: >-
      Recorded SUCCEEDED because the result was independently reproduced for this
      assessment, not because the report asserts it. An independently written PDB
      parser computing minimum heavy-atom distances returns all nine variant rows
      to 0.1 Angstrom, including the nearest-nucleotide ligand identity in every
      row, and the three DELSEED control rows to 0.1 Angstrom. Auditability is
      PARTIALLY_AUDITABLE rather than REPRODUCIBLE because no code, environment
      specification or MANIFEST.yaml was committed and the report frontmatter has
      no artifact_manifest_sha256: replication was possible only because the
      derived table records enough per-chain detail to re-derive from a public
      structure, which is weaker than a replayable bundle.
    limitations: >-
      Two provenance defects in the committed table, neither affecting the
      variant distances or the conclusion. The P-loop control row is recorded
      against UniProt 206 / PDB 156, which measures 5.2 Angstrom to bound
      nucleotide; the 2.7 and 3.0 Angstrom values that row carries belong to
      UniProt 209 / PDB 159, which is the residue the report's prose names. Both
      residues are Gly, since Walker A reads GGAGVGKT, which is how the mislabel
      escapes notice. The DELSEED control row labels UniProt 446 as Asp when it
      is Leu; the Asp of DELSEED is 444. Separately, and more consequentially for
      interpretation, this is a static bovine homolog crystal with no
      molecular-dynamics perturbation of the proline substitutions, so it
      establishes where the residues sit, not what proline does to the local
      structure. The report states this limitation itself.
  - analysis_id: secondary-structure-parse-1bmf
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      DSSP-style secondary-structure assignment of PDB 1BMF beta chain D,
      reported as T334 in loop or coil, L335 as the N-cap residue of a helix
      spanning PDB 285-293, V482 and DELSEED in loop or coil, and the P-loop
      control in a strand.
    input_data_source_ids:
      - pdb-1bmf
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2_coupling_versus_catalysis_allelic_split_openscientist_artifacts_data_derived_secondary_structure_and_constraint.csv
    status_reason: >-
      PARTIAL rather than SUCCEEDED. The assignment is plausible and its inputs
      are verified, but no DSSP output, code or software version was committed,
      the method is described only as "DSSP-style", and this assessment did not
      reproduce the assignment. The same table carries the mislabelled DELSEED
      residue identity noted above, which lowers confidence in its annotation
      layer specifically.
    limitations: >-
      A single chain in a single catalytic state. The report is appropriately
      modest about the finding, calling the loop-versus-helix-N-cap distinction
      the only structural feature that tracks the clinical split and "a weak
      one". It should not be read as a mechanism: nothing here shows that a
      proline at a helix N-cap and a proline in a loop have the divergent
      consequences the hypothesis needs.
  - analysis_id: gnomad-constraint-lookup
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Single GraphQL query against the gnomAD v4 API for gene-level constraint
      on ATP5F1B, reporting missense Z 4.70 with observed/expected 0.57, pLI
      0.80, LOEUF 0.556, 17 observed against 45.9 expected loss-of-function
      variants, and synonymous Z 1.43 as a model-validity check.
    input_data_source_ids:
      - gnomad-v4-constraint
    software:
      - software_name: gnomAD GraphQL API
        software_uri: https://gnomad.broadinstitute.org/api
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2_coupling_versus_catalysis_allelic_split_openscientist_artifacts_data_derived_gnomad_constraint_ATP5F1B.json
    status_reason: >-
      REPRODUCIBLE in the strict sense: the committed artifact carries the exact
      query string and the raw unrounded response, and re-issuing that query
      returned identical values to every significant digit. This is the standard
      the other two analyses do not meet.
    limitations: >-
      Gene-level constraint, not variant-level prediction, and it cannot
      discriminate the two arms, since both are missense in the same constrained
      gene. The report's inference that strong missense constraint with only
      moderate loss-of-function constraint favours a poison-subunit reading over
      haploinsufficiency is reasonable and applies to both arms equally.
  - analysis_id: side-by-side-assay-literature-search
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Literature search for any study co-measuring respiratory flux and complex V
      activity across ATP5F1B variants from both clinical arms, reported as a
      true negative and treated as the hypothesis's central empirical gap.
    input_data_source_ids:
      - pubmed-negative-search-side-by-side
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2_coupling_versus_catalysis_allelic_split_openscientist_artifacts_logs_pubmed_search_log.md
    status_reason: >-
      A negative search with a committed log of queries and result counts, which
      is substantiated in the way a negative finding can be. It also agrees with
      the disorder entry's own independent reading of the two primary reports.
    limitations: >-
      The committed log contains no query aimed specifically at a co-measurement
      study, so it supports the weaker claim that no such study surfaced across
      twelve queries rather than that a targeted search for one returned nothing.
      A negative literature result is in any case bounded by the queries run.
claims:
  - claim_id: two-arms-exist-and-dominance-does-not-separate-them
    statement: >-
      Heterozygous ATP5F1B variants are associated with two clinically disjoint
      phenotypes, each independently documented, and both missense arms are
      reported as dominant-negative, so the mode of dominance does not
      distinguish them.
    disposition: RETAINED
    report_quote: >-
      The two clinical "arms" it posits are each independently well documented in
      primary literature, and the claim that the dominance mode cannot separate
      them is correct
    rationale: >-
      Correct, and it restates the seed rather than adding to it: the seed
      hypothesis already asserted both arms and the shared dominance mode. Worth
      recording that the disorder entry has since scoped the dominance premise to
      the missense alleles, because the ATP5F1B splice allele c.1074+1G>T lowers
      transcript level and its own authors model dominant ATP5F1A and ATP5F1B
      disease as insufficient protein production for loss-of-function alleles
      alongside dominant negativity for missense alleles. The report does not
      make that distinction.
    citations:
      - PMID:36239646
      - PMID:36860166
      - PMID:40276935
  - claim_id: no-positional-basis-for-the-split
    statement: >-
      The two adjacent proline substitutions with opposite clinical consequences
      occupy near-identical structural microenvironments, and none of the three
      index residues contacts the catalytic nucleotide or the gamma rotor, so
      proximity to catalysis or to the rotor does not explain the clinical split.
    disposition: QUALIFIED
    report_quote: >-
      the two adjacent prolines with opposite clinical consequences, p.Thr334Pro
      (dystonia) and p.Leu335Pro (hypermetabolism), occupy near-identical
      microenvironments
    rationale: >-
      This is the report's most valuable claim and it is independently verified.
      Re-deriving the distances from PDB 1BMF with an independently written
      parser reproduces all nine variant rows to 0.1 Angstrom across the three
      catalytic states, with matching nearest-nucleotide ligand identities, and
      the residue identities at the stated offset confirm the mapping. The claim
      is negative and therefore well suited to this method: it says a positional
      account fails, which static coordinates can establish. Two caveats. The
      P-loop positive control is recorded against the wrong residue in the
      committed table, as detailed on the analysis, so the method validation
      reads correctly in the prose and incorrectly in the data file. And the
      finding constrains explanations without supplying one: it does not show
      what proline does at either position, and a dynamics calculation could
      still distinguish them.
    analysis_ids:
      - structural-distance-analysis-1bmf
  - claim_id: v482-is-farthest-from-gamma
    statement: >-
      V482, in the catalytic arm, is the index residue farthest from the gamma
      subunit despite its sequence adjacency to the DELSEED rotor-coupling motif,
      which inverts a naive domain-to-phenotype reading.
    disposition: QUALIFIED
    report_quote: >-
      correcting an earlier inference that its DELSEED sequence-adjacency implied
    rationale: >-
      Verified: the independent replication returns 27.6, 33.1 and 30.4 Angstrom
      for chains D, E and F, matching the report. Creditable that the report
      records this as a correction of its own earlier inference rather than
      presenting it as a first reading. The wider point stands, that sequence
      adjacency to a functional motif does not imply spatial proximity to its
      partner.
    analysis_ids:
      - structural-distance-analysis-1bmf
  - claim_id: uncoupling-step-is-yeast-derived
    statement: >-
      The loosened-coupling-of-synthesis step for p.Leu335Pro is demonstrated
      directly only in a yeast homolog; in human cells only the elevated
      respiration phenotype is recapitulated.
    disposition: RETAINED
    report_quote: >-
      the key "loosened coupling of synthesis" step for p.Leu335Pro is
      demonstrated directly only in a yeast homolog; in human cells only the
      elevated-respiration phenotype is recapitulated
    rationale: >-
      Accurate against the cached full text and a useful sharpening of the
      entry's own framing. The NEJM report's human measurements are oxygen
      consumption and membrane potential; the inference that protons cross
      without ATP being made rests on the yeast mgi literature plus the
      oligomycin and saturating-ADP controls. The disorder entry already grades
      the yeast sentence MODEL_ORGANISM with quote_role BACKGROUND, which encodes
      exactly this distinction.
    citations:
      - PMID:36239646
  - claim_id: competing-basal-ganglia-vulnerability-model
    statement: >-
      A more parsimonious competing model explains the dystonia arm without a
      catalysis-versus-coupling axis: the basal ganglia are selectively
      vulnerable to any partial loss of complex V output, which recurs across
      ATP5F1A, ATP5F1B and ATP5MC3, while the hypermetabolic presentation remains
      unique to one ATP5F1B allele.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      also explains the dystonia arm without invoking a catalysis-versus-coupling
      axis
    rationale: >-
      The strongest idea in the report and the one needing most care, because it
      is a literature argument rather than a result of anything the run computed,
      and the report's own search log records zero hits for its
      selective-vulnerability query. The convergence premise is checkable and the
      supporting papers are now cached, but none has been read against this claim
      under normal evidence validation, and ATP5MC3 and the ATP5F1A preprint are
      cited in the report only. Recorded in the disorder entry's knowledge-gap
      rationale as an explicitly flagged provider lead, with no evidence items
      and no promotion into the pathograph, which is the right disposition until
      the cross-subunit claims are verified individually. Note also that the
      model is not a strict competitor: it could hold for the dystonia arm while
      a coupling defect still explains the hypermetabolic one.
    citations:
      - PMID:34636445
      - PMID:36860166
      - PMID:40672495
  - claim_id: seed-snippet-not-in-abstract
    statement: >-
      A snippet cited in the seed YAML for PMID:36239646 could not be found
      verbatim in the NEJM abstract, and the verifiable human-level readout is
      elevated oxygen consumption with decreased mitochondrial membrane
      potential.
    disposition: REJECTED
    report_quote: >-
      was **not found verbatim in the NEJM abstract**; the human-level readout
      that *is* verifiable is "elevated oxygen consumption and decreased
      mitochondrial membrane potential."
    rationale: >-
      Correct about the abstract and wrong as a curation flag against this
      repository, so it is rejected as stated while being credited as a sound
      instinct. The sentence is present in the cached PMC full text for
      PMID:36239646, this repository permits full-text snippet matches for KB
      entries, and the gating validator verifies it along with every other
      snippet in the entry. The provider could not have known this: it saw the
      abstract through E-utilities and had no view of the reference cache. Flagged
      here because the same caveat appears twice, in the executive judgment and
      in the committed search log, and a future reader of either could mistake it
      for an unresolved defect in the entry.
    citations:
      - PMID:36239646
  - claim_id: luft-syndrome-as-historical-prototype
    statement: >-
      ATP5F1B p.Leu335Pro can be read as a molecularly defined instance of the
      Luft disease phenotype, the first described mitochondrial disorder, in
      which isolated mitochondria showed loose coupling with normal
      phosphorylation capacity.
    disposition: QUALIFIED
    report_quote: >-
      ATP5F1B p.Leu335Pro can be read as a molecularly defined, gene-level
      instance of the Luft phenotype.
    rationale: >-
      Qualified rather than retained, because the primary source the report
      builds on draws the opposite boundary. The NEJM report groups the two
      conditions by shared physiology while stating that Luft syndrome's
      uncoupling appears to originate outside complex V, so calling HUMOP2 an
      instance of the Luft phenotype overstates a relationship its own source
      limits to a proposed category. The disorder entry's notes already record
      the distinction. The Luft citation the report adds is a genuine
      contribution and is now cached, though not cited in the entry.
    citations:
      - PMID:1249587
      - PMID:36239646
  - claim_id: emerging-status-should-be-retained
    statement: >-
      The hypothesis should retain EMERGING status pending a single isogenic
      experiment measuring respiration and complex V activity together across
      variants from both arms.
    disposition: QUALIFIED
    report_quote: >-
      Status **EMERGING should be retained** pending a single isogenic experiment
      that measures respiration and complex V activity together across variants
      from both arms.
    rationale: >-
      Agrees with the disorder entry, which independently reached the same
      conclusion and already proposes that experiment with stated supporting and
      refuting outcomes. The report's own structural finding strengthens the case
      for EMERGING rather than weakening it, by removing the positional account
      that would otherwise have been the readiest explanation.
    analysis_ids:
      - structural-distance-analysis-1bmf

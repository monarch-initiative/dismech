summary: >-
  The report's verdict on the seeded hypothesis is PARTIALLY SUPPORTED with
  EMERGING retained, and that is the right call. Its substantive contribution is
  computational rather than bibliographic: it mapped the three index residues
  onto the bovine F1-ATPase structure and found that the two adjacent prolines
  with opposite clinical consequences occupy near-identical microenvironments,
  neither contacting the catalytic nucleotide nor the gamma rotor. That removes a
  positional explanation for the split, which is a real finding and not something
  the seed supplied.

  Unusually for a provider run, the central computation is independently
  reproducible, and this assessment reproduced it. Re-deriving minimum heavy-atom
  distances from PDB 1BMF with an independently written parser returns the
  report's table to 0.1 Angstrom for all nine variant rows across all three
  catalytic states, nearest-nucleotide ligand identities included, and the
  DELSEED control to 0.1 Angstrom as well. The gnomAD constraint lookup replays
  to every significant digit from the committed GraphQL query. Every UniProt
  feature assertion checks out against P06576: 529 residues, transit peptide
  1-47, Walker A at 206-213 reading GGAGVGKT, DELSEED at 444-450, nucleotide
  binding sites at 209-214 and 238-239, and the local context GYQPTLATDM placing
  Thr334 and Leu335 where the report says.

  Two defects sit in the derived tables rather than in the result. The
  P-loop positive control is recorded against the wrong residue: the table rows
  it as UniProt 206 / PDB 156, which measures 5.2 Angstrom to bound nucleotide,
  whereas the 2.7 and 3.0 Angstrom values the row carries belong to UniProt 209 /
  PDB 159, which is what the report's own prose says. The error hides because the
  Walker A motif has glycines at 206, 207, 209 and 211, so both candidates are
  Gly. And the DELSEED control is labelled Asp at UniProt 446, which is Leu; the
  Asp of DELSEED is 444. Neither defect touches the variant distances or the
  conclusion drawn from them.

  Three limits on how the run may be used. The structural work is a static
  bovine homolog crystal with no molecular-dynamics perturbation of the proline
  substitutions, so it establishes where the residues sit and not what proline
  does there. No analysis code, environment specification or MANIFEST.yaml was
  committed, and the report frontmatter carries no artifact_manifest_sha256, so
  the bundle is not a canonical computational run bundle and
  just validate-hypothesis-analysis-run does not apply to it; auditability here
  rests on the derived tables being complete enough to re-derive from public
  inputs, which they were. And the competing model the report advances, selective
  basal-ganglia vulnerability to any loss of complex V output, is a literature
  argument from cross-subunit convergence, not a result of any analysis it ran.

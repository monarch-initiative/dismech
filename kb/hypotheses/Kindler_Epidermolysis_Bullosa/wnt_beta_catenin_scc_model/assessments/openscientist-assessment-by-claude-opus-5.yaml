analyses:
  - analysis_id: literature-evidence-synthesis-wnt
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature search across a claimed 54 papers, manual construction
      of a 14-row evidence matrix, a per-step causal-chain strength table, and a
      literature-search coverage table.
    comparison: >-
      Wnt arm versus TGF-β arm of the seed hypothesis, and both against
      oxidative-stress, NF-κB/JNK inflammation, hypoxia/MMP13, EMT/fibrosis and
      EGFR alternatives.
    input_data_source_ids:
      - pubmed-literature-searches-wnt
      - uniprot-q9bql6
    status_reason: >-
      There is no openscientist_artifacts bundle for this hypothesis; the
      directory holds only openscientist.md and its citations sidecar. Three
      figure placeholders (evidence_landscape.png, evidence_matrix.png,
      mechanistic_diagram.png) resolve to no committed file. The evidence-strength
      grades ("Very high", "Moderate", "Weak/Inferred") are assigned without a
      stated rubric.
    limitations: >-
      The report claims 54 papers reviewed while its citation manifest lists 17
      PMIDs. Its own coverage table cites a further 14 PMIDs that appear nowhere
      in the manifest, so the corpus cannot be reconstructed and the coverage
      claim cannot be audited.
claims:
  - claim_id: tgf-beta-arm-independently-validated
    statement: >-
      The TGF-β arm of the hypothesis is independently supported by skin
      carcinogenesis studies from multiple laboratories.
    disposition: RETAINED
    report_quote: >-
      The **TGF-β arm** is independently and robustly validated by decades of skin
      carcinogenesis research from multiple laboratories
    rationale: >-
      Both cited sources say what the report says they say. Glick et al. report
      that v-rasHa-initiated TGF-β1-null keratinocyte grafts progressed rapidly to
      multifocal squamous cell carcinomas and conclude that autocrine TGF-β1
      suppresses the frequency and rate of malignant progression. Hoot et al.
      report accelerated formation and malignant progression of chemically induced
      skin tumours in keratinocyte-specific Smad2 knockouts. Neither study
      involves kindlin-1, so what they validate is the downstream premise — losing
      keratinocyte TGF-β signalling accelerates skin carcinogenesis — rather than
      the kindlin-1-to-TGF-β step itself. Both are already curated in the entry.
    citations:
      - PMID:7958907
      - PMID:18618014
      - PMID:24681597
  - claim_id: wnt-arm-single-study-no-replication
    statement: >-
      The Wnt arm rests on one study and has not been independently replicated in
      twelve years.
    disposition: QUALIFIED
    report_quote: >-
      without independent replication in the 12 years since publication
    rationale: >-
      The first half is verifiable within the report's own cited set: of the 17
      PMIDs in the manifest, only PMID:24681597 tests kindlin-1 against
      Wnt/β-catenin. The twelve-year absence, however, is an
      absence-of-evidence claim resting on unlogged searches, and the report
      compounds it by treating four later papers that studied other mechanisms as
      evidence of non-replication — a group not reproducing a finding it never set
      out to test is not a failed replication. Note also that Rognoni is not
      thin evidence in itself: it reports nuclear β-catenin-Lef1 in human Kindler
      skin as well as mouse, which the entry already cites.
    citations:
      - PMID:24681597
  - claim_id: uniprot-annotation-asymmetry
    statement: >-
      UniProt's FERMT1 entry annotates the TGF-β role but not the Wnt role, which
      indicates the Wnt claim lacks consensus-level confidence.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This asymmetry between TGF-β (adopted) and Wnt (not adopted) in a major
      curated database reflects the broader evidence landscape and provides an
      independent indicator that the Wnt claim has not yet achieved
      consensus-level confidence in the scientific community.
    rationale: >-
      Two separate problems. The factual half could not be checked: UniProt is not
      in this repository's reference cache, no release version or retrieval record
      accompanies the quoted annotation string, and the assessment did not query
      the service. The inferential half is weak even if the fact holds — UniProt
      function annotation is not a consensus ballot, its coverage of any single
      2014 mouse-genetics result is a curation-throughput matter, and an argument
      from a database's silence should not carry the weight the report places on
      it. The report uses this as one of its two main supports for questioning
      CANONICAL status.
  - claim_id: stem-cell-expansion-to-malignancy-gap
    statement: >-
      No study shows that Wnt-driven stem cell expansion is necessary or
      sufficient for malignant transformation in kindlin-1-deficient skin.
    disposition: RETAINED
    report_quote: >-
      no study has demonstrated that this stem cell expansion is necessary or
      sufficient for malignant transformation in the kindlin-1–deficient context
    rationale: >-
      This is the report's sharpest structural observation and it is right about
      what Rognoni does and does not show. The paper reports enlarged and
      hyperactive stem cell compartments together with increased tumour
      susceptibility; it does not lineage-trace tumours to the expanded
      compartment, and it does not test whether blocking Wnt prevents them. An
      enlarged target-cell pool is a plausible contributor to, not a demonstration
      of, transformation. The entry's hypothesis notes already frame SCC risk as
      multi-hit, which is the same conclusion.
    citations:
      - PMID:24681597
  - claim_id: fermt1-context-paradox
    statement: >-
      Kindlin-1 acts in opposite directions in Kindler-associated and sporadic
      cutaneous SCC — loss drives tumour growth in the former while FERMT1
      expression rises with progression in the latter.
    disposition: RETAINED
    report_quote: >-
      This creates a paradox: kindlin-1 loss promotes SCC in KS, but kindlin-1 gain
      promotes sporadic SCC.
    rationale: >-
      Verified directly in the abstract of PMID:38982038, which reports both halves
      in one study: FERMT1 expression increased in actinic keratoses relative to
      normal skin with a further increase in cSCC in non-Kindler patients, and,
      in contrast, kindlin-1 loss increasing SCC tumour growth in vivo and in 3D
      spheroids. A single-source, same-paper contrast cannot be dismissed as
      cross-laboratory noise. The entry cited this paper only for its hypoxia and
      MMP13 findings, so the direction paradox was genuinely absent; it is added
      as a CONTROVERSY discussion.
    citations:
      - PMID:38982038
  - claim_id: tgf-beta-direction-tension
    statement: >-
      A mouse study reporting increased TGF-β signalling after epidermal kindlin-1
      deletion sits in tension with the canonical model's claim that kindlin-1
      loss removes TGF-β activation, possibly reconcilable as autocrine loss
      versus paracrine gain.
    disposition: RETAINED
    report_quote: >-
      this study shows *increased* TGF-β signaling upon kindlin-1 deletion
      (paracrine), which may seem to contradict the hypothesis claim of *lost*
      TGF-β signaling — though the distinction may be between autocrine growth
      inhibition (lost) and paracrine fibrotic signaling (gained)
    rationale: >-
      Verified: PMID:42091340 reports increased TGF-β signalling and activation of
      dermal fibroblasts after Kindlin-1 deletion, and itself attributes this to
      paracrine signalling. The report is appropriately tentative about the
      reconciliation rather than asserting it, which is the correct posture — the
      compartmental split is a hypothesis, and an alternative reading is that
      germline and adult-induced deletion differ. The entry cited this paper only
      for Gstp1 suppression, so the tension was unrecorded; it is added as an
      INTERPRETATION discussion.
    citations:
      - PMID:42091340
      - PMID:24681597
  - claim_id: hypoxia-mmp13-progression-mechanism
    statement: >-
      Kindlin-1 loss promotes SCC growth and invasion through a hypoxic,
      glycolytic, MMP13-driven route that acts on progression rather than
      initiation.
    disposition: RETAINED
    report_quote: >-
      This study addresses tumor progression and invasion mechanisms rather than
      initiation, suggesting it may operate at a later stage than Wnt-driven stem
      cell expansion.
    rationale: >-
      Supported by the source, which reports increased SCC tumour growth in vivo
      and in 3D spheroids with a hypoxic environment and increased glycolysis, and
      Mmp13 upregulation driving increased invasion of kindlin-1-depleted cells.
      The stage assignment (progression, not initiation) is the report's reading
      rather than the paper's claim, but it follows from the experimental design,
      which starts from established SCC cells. Already curated in the entry.
    citations:
      - PMID:38982038
  - claim_id: egfr-loss-opposes-proliferative-model
    statement: >-
      Kindlin-1 loss degrades EGFR, which should reduce proliferative signalling
      and therefore sits awkwardly with a Wnt-driven proliferative model.
    disposition: QUALIFIED
    report_quote: >-
      EGFR loss typically reduces proliferative signaling, which paradoxically
      opposes the proliferative phenotype predicted by Wnt activation.
    rationale: >-
      The underlying finding is solid — Michael et al. report significantly reduced
      EGFR in Kindler patient skin and keratinocytes with defective EGF-dependent
      signalling and migration, and kindlin-1 protecting EGFR from lysosomal
      degradation. The tension the report draws from it is the report's own
      inference: the paper studies migration and adhesion, not tumorigenesis, and
      says nothing about proliferation in a neoplastic context. Reduced EGFR in
      normal keratinocytes is compatible with a tumour that has acquired other
      growth signals. Worth recording as a caveat, not as a contradiction.
    citations:
      - PMID:30248333
  - claim_id: no-human-omics-validation
    statement: >-
      No human Kindler syndrome omics dataset exists that could test Wnt pathway
      activation, TGF-β signalling, or stem cell marker expression.
    disposition: REJECTED
    report_quote: >-
      No transcriptomic, proteomic, or single-cell RNA-seq study of human KS skin
      has been published that directly measures Wnt pathway activation status,
      TGF-β signaling, or stem cell marker expression.
    rationale: >-
      A counterexample sits in the disorder entry this report was generated for.
      GSE47642 is a human skin-biopsy microarray comparing Kindler syndrome and
      control samples, curated in the entry's datasets block, and its linked
      publication is PMID:24681597 — the Rognoni study the report says lacks omics
      validation. The dataset is small (6 samples) and the report's narrower point
      survives, namely that no one has re-analysed or extended it for Wnt target
      signatures at genome scale and that no single-cell study exists. But the
      claim as written is false, and it is the kind of absence assertion that
      should not be promoted into a knowledge gap without a repository query
      behind it.
    citations:
      - PMID:24681597
  - claim_id: general-wnt-scc-plausibility
    statement: >-
      Wnt/β-catenin activation is broadly established as promoting cutaneous SCC,
      making the kindlin-1-to-Wnt mechanism biologically plausible.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This broader evidence makes the kindlin-1→Wnt mechanism biologically
      plausible, even though the specific causal link has not been independently
      replicated.
    rationale: >-
      None of the four supporting citations (PMID:34345013, PMID:29662191,
      PMID:32881028, PMID:28945253) is in references_cache, and none was fetched
      during this assessment, so the quoted findings are unchecked. The
      contexts also differ from the disease at hand — HPV-driven cSCC and
      keratoacanthoma transition are not Kindler syndrome — so even if verified
      this supports plausibility rather than the specific mechanism. Nothing here
      is ready for the disease entry.
    citations:
      - PMID:34345013
      - PMID:29662191
      - PMID:32881028
  - claim_id: lgr6-paradox
    statement: >-
      Loss of the Wnt mediator Lgr6 paradoxically predisposes to SCC via
      compensatory Lgr5 upregulation, showing the Wnt-SCC relationship is
      non-linear.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      showed that loss of a Wnt pathway mediator can *paradoxically promote* SCC
      through compensatory Lgr5 upregulation
    rationale: >-
      PMID:28945253 is not cached and was not fetched, so the finding is unchecked.
      The reasoning is also loose as applied: Lgr6 is a Wnt-pathway receptor
      component marking a specific epidermal stem cell population, and its loss is
      not interchangeable with reduced canonical Wnt signalling, so a paradoxical
      Lgr6 result does not straightforwardly transfer to the kindlin-1 case.
    citations:
      - PMID:28945253
  - claim_id: multi-hit-reframing-from-epidemiology
    statement: >-
      The clinical epidemiology of SCC in Kindler syndrome — long latency, sharp
      rise after 60, concentration at inflammation-prone sites, high metastatic
      rate — favours a multi-hit model over Wnt-driven initiation.
    disposition: QUALIFIED
    report_quote: >-
      (a) The decades-long latency (youngest case at 29, risk rising steeply after
      60) is more consistent with accumulated mutations from impaired DNA damage
      repair than with constitutive Wnt activation alone, which would predict
      earlier onset
    rationale: >-
      The epidemiology is accurately reported from PMID:31340837 and is already
      curated in the entry, and the multi-hit conclusion is a reasonable synthesis
      that the entry's notes also reach. The specific argument quoted is weaker
      than it sounds: no quantitative model is offered for what onset age
      "constitutive Wnt activation alone" would predict, and a germline
      predisposition acting on a slowly accumulating somatic mutation burden
      produces late onset under either model. Latency does not discriminate; the
      site distribution is the more informative observation.
    citations:
      - PMID:31340837
  - claim_id: status-revision-recommendation
    statement: >-
      The hypothesis status should be qualified or downgraded from CANONICAL,
      possibly to SUPPORTED, because the Wnt arm is unreplicated.
    disposition: QUALIFIED
    report_quote: >-
      Alternatively, consider whether CANONICAL requires independent replication of
      all mechanistic arms, in which case downgrade to SUPPORTED may be warranted
      for the overall hypothesis.
    rationale: >-
      SUPPORTED is not a value MechanisticHypothesisStatusEnum offers — the
      permissible values are CANONICAL, ALTERNATIVE, EMERGING and DEPRECATED — so
      the fallback recommendation is not implementable. The report's primary
      recommendation, CANONICAL with an explicit qualifier, is exactly what the
      entry already records in its hypothesis notes, which name the arm asymmetry,
      the missing replication and the four parallel mechanisms. No status change is
      warranted or made.
  - claim_id: papers-reviewed-54
    statement: >-
      The report reviewed 54 papers.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Papers Reviewed:** 54
    rationale: >-
      The citations sidecar lists 17 PMIDs. The report's own literature-coverage
      table names roughly 14 additional PMIDs (for example 41277650, 40362475,
      35388510, 35189150, 31957900, 41097738, 40362519, 39450990, 28641957,
      22807896, 20938162, 17086002, 27660560) that do not appear in the manifest
      and are cited nowhere in the body, so they cannot be checked and their
      relevance cannot be assessed. Roughly half the claimed corpus is
      unreconstructable, which is the same limitation that undermines the report's
      negative-search findings.

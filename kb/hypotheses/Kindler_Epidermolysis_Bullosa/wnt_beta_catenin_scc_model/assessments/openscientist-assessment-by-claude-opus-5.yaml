source_report: ../openscientist.md
hypothesis_id: wnt_beta_catenin_scc_model
assessed_at: "2026-09-02T12:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's central move — separating the hypothesis into a TGF-β arm with
  independent cross-laboratory support and a Wnt arm resting on one 2014 study,
  then arguing that SCC in Kindler syndrome is multi-hit rather than
  Wnt-initiated — holds up against the sources that could be checked, and the
  disorder entry already records that reframing. Two findings it surfaces are
  real, verifiable and were not in the entry: the direction paradox in which
  FERMT1 expression rises through actinic keratosis to sporadic cSCC while
  kindlin-1 loss drives tumour growth in Kindler syndrome, both reported in
  PMID:38982038; and the tension between the canonical loss-of-TGF-β-activation
  arm and the increased TGF-β signalling PMID:42091340 reports after epidermal
  kindlin-1 deletion. Both are integrated as discussions. Against that, one gap
  claim is simply wrong — the report states no human Kindler omics dataset was
  identified, while GSE47642, a human Kindler-versus-control skin microarray
  deposited with the very Rognoni paper under discussion, is already curated in
  this entry. The UniProt argument, on which the report leans for its
  "insufficient consensus" conclusion, is an argument from a database's silence
  and could not be checked here. Four of the general Wnt-SCC citations are
  uncached and unverified. The recommended status revision names values the
  schema does not have, and CANONICAL with the existing qualifying notes is
  already the right record.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

analyses:
  - analysis_id: literature-evidence-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature search and manual evidence-matrix synthesis with
      per-row confidence grading and a hand-drawn causal chain.
    comparison: >-
      Seed ERK-specific model versus p38, NF-kB/JNK, Wnt/TGF-beta, EGFR,
      microtubule/mitotic, and kindlin-2 "double hit" alternatives.
    input_data_source_ids:
      - pubmed-literature-searches
    status_reason: >-
      There is no openscientist_artifacts bundle for this hypothesis; the
      directory holds only openscientist.md and its citations sidecar. The report
      embeds five figure placeholders ({{figure:evidence_matrix.png}},
      final_assessment.png, causal_chain.png, gaps_and_alternatives.png) that
      resolve to no committed file. The confidence grades ("High", "Moderate")
      are assigned without a stated rubric.
    limitations: >-
      The report claims synthesis across 27 publications while its citation
      manifest lists 14 PMIDs, so roughly half the claimed corpus cannot be
      identified, let alone re-checked.
claims:
  - claim_id: oxidative-stress-phenotype-replication
    statement: >-
      The elevated-ROS, reduced-viability, increased-DNA-damage phenotype of
      kindlin-1-deficient keratinocytes is replicated across three independent
      laboratories.
    disposition: QUALIFIED
    report_quote: >-
      is well-replicated across at least three independent laboratories
    rationale: >-
      True for UV sensitivity and DNA damage, not for ROS as measured. Emmert
      (PMID:28501563) measured ROS, viability and DNA damage directly. Maier
      (PMID:27798104) reports p38 induction "by higher ROS levels" and a direct
      relationship between kindlin-1 abundance and UV-B apoptosis, so it
      corroborates elevated ROS. Zhang (PMID:27725201) reports increased
      apoptosis, gammaH2AX and cyclobutane pyrimidine dimers but says nothing
      about ROS in its abstract. Two labs on ROS, three on UV/oxidative
      vulnerability.
    citations:
      - PMID:28501563
      - PMID:27798104
      - PMID:27725201
  - claim_id: erk-arm-single-study
    statement: >-
      The ERK-specific component of the hypothesis derives from one unreplicated
      study.
    disposition: QUALIFIED
    report_quote: >-
      derives from a single unreplicated study (Emmert et al., 2017) and is
      directly challenged by equally strong evidence implicating
    rationale: >-
      The first half holds within the report's own cited set: of the 14 PMIDs in
      the manifest, only PMID:28501563 measures ERK. The second half does not.
      "Directly challenged" requires a study that measured ERK and found it
      uninvolved; neither PMID:27798104 nor PMID:27725201 assayed ERK at all.
      They establish additional pathways, which is a different and weaker claim
      than challenging the ERK finding. Note also that the absence of replication
      since 2017 rests on an unlogged PubMed search.
    citations:
      - PMID:28501563
      - PMID:27798104
      - PMID:27725201
  - claim_id: p38-supplants-erk
    statement: >-
      p38, rather than ERK, is the key MAPK driving the UV-B response in
      kindlin-1-deficient keratinocytes.
    disposition: QUALIFIED
    report_quote: >-
      Notably, this study identified **p38 — not ERK** — as the key MAPK driving
      the UV-B inflammatory response in KS keratinocytes.
    rationale: >-
      Maier shows IL-1beta, IL-6 and TNF-alpha upregulation in KS skin and
      UV-B-irradiated KS keratinocytes is p38-dependent, which is a real and
      well-supported finding. But the paper is about the inflammatory cytokine
      arm and does not test ERK, so "not ERK" is the report's framing rather than
      the study's result. The two arms — p38-driven inflammation and ERK-linked
      DNA-damage protection — are complementary readouts of different endpoints,
      not competitors for one slot.
    citations:
      - PMID:27798104
      - PMID:28501563
  - claim_id: nfkb-jnk-dna-repair-causal
    statement: >-
      NF-kB and JNK activation causally mediates the UV-induced DNA repair defect
      in KIND1-deficient keratinocytes.
    disposition: RETAINED
    report_quote: >-
      Critically, JNK/NF-κB inhibition reduced CPD-positive cells, directly
      demonstrating these pathways' causal role in DNA repair impairment.
    rationale: >-
      This is the report's strongest verified contribution and the causal claim is
      properly supported by the source: Zhang reports that genetic or
      pharmacological JNK inhibition and NF-kB inhibition markedly reduced
      cyclobutane-pyrimidine-dimer-positive cells, which is an intervention, not a
      correlation. Already curated in the entry's hypothesis evidence block.
    citations:
      - PMID:27725201
  - claim_id: integrin-dependence-requires-qualification
    statement: >-
      The seed hypothesis's description of the mechanism as integrin-dependent
      needs to be qualified because kindlin-1 has integrin-independent functions.
    disposition: REJECTED
    report_quote: >-
      The hypothesis's claim that the mechanism is "integrin-dependent" requires
      qualification given evidence that kindlin-1 has integrin-independent
      functions
    rationale: >-
      This misreads what the seed hypothesis asserts. Emmert tested exactly this
      question and reports that "the Kindlin-1 dependent activation of ERK and
      protection from DNA damage following oxidative stress depends on the ability
      of Kindlin-1 to bind integrins" — the integrin-dependence of this specific
      mechanism is a positive experimental result, not an assumption. That
      kindlin-1 additionally stabilises EGFR (PMID:30248333) or regulates
      microtubules independently of integrins says nothing about whether the
      ERK/oxidative arm is integrin-dependent. The disorder entry's notes had
      adopted this report's framing; the integration corrects it and cites the
      Emmert sentence.
    citations:
      - PMID:28501563
      - PMID:30248333
  - claim_id: kindlin1-abundance-threshold
    statement: >-
      Photosensitivity is a non-redundant kindlin-1 function that kindlin-2 cannot
      rescue, and low residual kindlin-1 suffices to relieve it, implying milder
      photosensitivity in patients retaining partial function.
    disposition: QUALIFIED
    report_quote: >-
      supporting genotype-phenotype correlation where patients with missense
      mutations (retaining some kindlin-1 function) may have milder
      photosensitivity
    rationale: >-
      The cellular half is directly supported: Maier reports a direct relationship
      between kindlin-1 abundance and UV-B-induced apoptosis, that kindlin-2
      overexpression has no compensatory effect, and that low kindlin-1 levels
      suffice to relieve or rescue the feature. The extension to patient genotype
      is the report's inference — Maier did not stratify patients by mutation
      class against a photosensitivity endpoint. The threshold finding itself was
      absent from the disease entry and is added by the integration.
    citations:
      - PMID:27798104
      - PMID:21356350
  - claim_id: uvb-kindlin2-double-hit
    statement: >-
      UV-B-induced loss of kindlin-2 removes a compensatory paralogue and thereby
      worsens the Kindler phenotype.
    disposition: QUALIFIED
    report_quote: >-
      This "double hit" model — UV exposure eliminates the compensatory
      kindlin-2, worsening the KS phenotype — provides an additional mechanistic
      layer to understand photosensitivity.
    rationale: >-
      He et al. do show that UV-B irradiation induces loss of kindlin-2 in
      keratinocytes and that the two paralogues partly compensate for adhesion,
      migration and beta1 integrin activation, and they themselves raise phenotype
      modulation in Kindler syndrome. What is not demonstrated is the worsening
      step: no experiment removes kindlin-2 by UV in a kindlin-1-null background
      and measures a phenotypic consequence. Maier's finding that kindlin-2 cannot
      compensate for UV-B apoptosis further limits this to adhesion functions, as
      the report itself concedes elsewhere.
    citations:
      - PMID:21356350
      - PMID:27798104
  - claim_id: wnt-tgfb-more-parsimonious-for-scc
    statement: >-
      Wnt/TGF-beta-driven stem cell dysregulation explains SCC susceptibility more
      parsimoniously than accumulated UV-induced DNA damage.
    disposition: QUALIFIED
    report_quote: >-
      This stem cell-based cancer susceptibility mechanism operates independently
      of the oxidative stress/ERK model and provides a more direct, parsimonious
      explanation for cancer predisposition through aberrant stem cell
      proliferation rather than accumulated UV-induced DNA damage.
    rationale: >-
      Rognoni is genuine in vivo evidence for stem-cell expansion and increased
      tumour susceptibility, and the KB already carries it as its own CANONICAL
      hypothesis. But "more parsimonious" is an assessor-free judgement: no study
      compares the two models, and the companion wnt_beta_catenin_scc_model report
      argues the opposite way, calling the stem-cell-expansion-to-malignancy step
      the critical unfilled gap and treating oxidative DNA damage as the missing
      mutagenic step. The two reports cannot both be right about which model is
      more parsimonious; the honest reading is that both are components.
    citations:
      - PMID:24681597
      - PMID:28501563
  - claim_id: scc-site-distribution-favours-inflammation
    statement: >-
      The anatomical distribution of SCC in Kindler syndrome argues for
      inflammation-driven rather than UV-driven carcinogenesis.
    disposition: QUALIFIED
    report_quote: >-
      SCC distribution in KS (hands, oral cavity per PMID:31340837) correlates
      with areas of high inflammation rather than UV exposure, potentially
      favoring inflammation-driven over UV-driven carcinogenesis
    rationale: >-
      Has et al. do describe the distribution as concentrated in the hands and
      around the oral cavity, "areas of high inflammation in this disease", and
      that observation is already curated. The inferential step is weaker than the
      report presents: the dorsal hands are among the most UV-exposed sites on the
      body, so hand involvement is compatible with both explanations, and the
      study did not measure UV exposure. Only the oral concentration is genuinely
      discriminating.
    citations:
      - PMID:31340837
  - claim_id: status-downgrade-recommendation
    statement: >-
      The hypothesis status should be changed from CANONICAL to "PARTIALLY
      SUPPORTED" or "QUALIFIED".
    disposition: REJECTED
    report_quote: >-
      **Recommended status:** PARTIALLY SUPPORTED or QUALIFIED
    rationale: >-
      Neither value exists. MechanisticHypothesisStatusEnum permits only
      CANONICAL, ALTERNATIVE, EMERGING and DEPRECATED, so the recommendation is
      not implementable as written. Of the values that do exist, CANONICAL remains
      correct — this is the default explanatory model for KS photosensitivity and
      no source refutes it. The substantive multi-pathway qualification the report
      wants is already recorded in the entry's hypothesis notes, which is where a
      caveat that has no enum value belongs.
  - claim_id: mitotic-microtubule-contribution
    statement: >-
      Kindlin-1 loss impairs mitosis via reduced tubulin acetylation, contributing
      to photosensitivity and carcinogenesis.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Confidence:** Moderate to high. Two independent studies, but functional
      connection to photosensitivity is inferred, not directly demonstrated.
    rationale: >-
      PMID:26993041 is not in references_cache and was not fetched during this
      assessment, so the quoted mouse mitosis finding is unchecked. The report is
      candid that the link to photosensitivity is inferred, which is the right
      grade; nothing here is ready to promote into the disease entry without first
      caching and reading the source.
    citations:
      - PMID:26993041
  - claim_id: no-interventional-trial-data
    statement: >-
      No interventional clinical studies relevant to this hypothesis exist for
      Kindler syndrome.
    disposition: QUALIFIED
    report_quote: >-
      ClinicalTrials.gov, PubMed for "Kindler" + "treatment" or "clinical trial";
      no relevant interventional studies found
    rationale: >-
      Too strong as stated. NCT04908215, a completed phase 2 vehicle-controlled
      trial of topical INM-755 whose condition list includes Kindler syndrome, is
      already curated in the disease entry. The defensible claim is narrower — no
      trial has tested an antioxidant, an ERK modulator, or any other
      mechanism-directed intervention against a photosensitivity endpoint — and
      that narrower gap is real and worth recording.
  - claim_id: antioxidant-luteolin-therapeutic-lead
    statement: >-
      Topical antioxidants and the flavonoid luteolin reduce UV-B-induced
      apoptosis in Kindler syndrome keratinocyte and organotypic cultures.
    disposition: RETAINED
    report_quote: >-
      Antioxidants and the flavonoid luteolin reduced UV-B-induced apoptosis,
      supporting a therapeutic approach targeting oxidative stress and
      inflammation rather than ERK.
    rationale: >-
      Directly stated in the Maier abstract, which reports antioxidants and
      luteolin as feasible topical approaches decreasing UV-B-induced apoptosis in
      two-dimensional and organotypic KS cultures. This is preclinical and belongs
      in a knowledge gap about untested mechanism-directed therapy rather than in
      the entry's treatments block, since no patient has received it.
    citations:
      - PMID:27798104
  - claim_id: twenty-seven-publication-synthesis
    statement: >-
      The report synthesised evidence across 27 publications.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Through systematic literature search and evidence synthesis across 27
      publications
    rationale: >-
      The citations sidecar lists 14 PMIDs and the report's own front matter
      records citation_count 14. The remaining 13 publications are not identified
      anywhere in the report, so the claimed corpus cannot be reconstructed or
      re-checked. This does not by itself impugn the claims that are cited, but it
      does mean the report's coverage assertions and its negative-search findings
      cannot be audited.

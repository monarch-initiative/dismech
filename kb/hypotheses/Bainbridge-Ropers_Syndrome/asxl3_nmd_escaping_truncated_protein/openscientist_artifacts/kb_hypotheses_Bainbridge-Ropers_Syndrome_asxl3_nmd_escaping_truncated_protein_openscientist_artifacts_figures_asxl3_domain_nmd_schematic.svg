<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" font-family="Arial" font-size="13">
  <text x="20" y="28" font-size="16" font-weight="bold">ASXL3 (ENSP00000269197, 2249 aa) — domains, NMD-escape boundary, truncation distribution</text>
  <!-- scale: x(aa) = 50 + aa*0.39 -->
  <!-- protein backbone -->
  <rect x="50" y="70" width="877" height="26" fill="#e6e6e6" stroke="#888"/>
  <!-- axis ticks -->
  <line x1="50" y1="100" x2="927" y2="100" stroke="#bbb"/>
  <text x="50" y="118">1</text>
  <text x="430" y="118">996 (NMD boundary)</text>
  <text x="895" y="118">2249</text>
  <!-- domains -->
  <rect x="54" y="66" width="29" height="34" fill="#7fb3d5" stroke="#21618c"/>
  <text x="40" y="55">HARE-HTH (10-84)</text>
  <rect x="144" y="62" width="46" height="42" fill="#f1948a" stroke="#922b21"/>
  <text x="120" y="52">DEUBAD/ASXH · BAP1-binding (240-360)</text>
  <rect x="910" y="66" width="16" height="34" fill="#82e0aa" stroke="#1e8449"/>
  <text x="820" y="55">PHD (2204-2246)</text>
  <!-- NMD boundary line -->
  <line x1="438" y1="55" x2="438" y2="150" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- region labels -->
  <rect x="50" y="150" width="388" height="18" fill="#fdebd0" stroke="#e59866"/>
  <text x="70" y="163">NMD-subject region (aa 1-996): PTC -&gt; true null</text>
  <rect x="438" y="150" width="489" height="18" fill="#d5f5e3" stroke="#82e0aa"/>
  <text x="470" y="163">NMD-escape region (aa 996-2249; last exon = 55% of ORF): PTC -&gt; truncated protein</text>
  <!-- pathogenic truncation summary -->
  <text x="20" y="205" font-weight="bold">ClinVar pathogenic/LP truncating variants (n=226): span aa 4-2230, median 984</text>
  <rect x="50" y="215" width="388" height="22" fill="#f5b7b1" stroke="#c0392b"/>
  <text x="120" y="230">~50% proximal (true null)</text>
  <rect x="438" y="215" width="489" height="22" fill="#f5b7b1" stroke="#c0392b"/>
  <text x="560" y="230">~50% NMD-escape (truncated protein)</text>
  <text x="20" y="262" font-weight="bold">Interpretation:</text>
  <text x="20" y="282">1) Proximal null truncations are fully pathogenic + gene is haploinsufficient (pLI=1, LOEUF=0.27) =&gt; haploinsufficiency SUFFICIENT.</text>
  <text x="20" y="302">2) NMD-escaping truncations retain DEUBAD(BAP1) &amp; lose C-terminal PHD/degron = the ASXL1 gain-of-function architecture.</text>
  <text x="20" y="322">=&gt; Seed hypothesis best fits as a PHENOTYPIC MODIFIER (e.g., autism enrichment in no-NMD class), not the primary cause.</text>
  <text x="20" y="348" font-size="11" fill="#666">Sources: Ensembl REST GRCh38 + gnomAD r4 + ClinVar (via gnomAD API), retrieved 2026-09-05. Schematic; positions to scale.</text>
</svg>

schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: asxl3_nmd_escaping_truncated_protein
assessed_at: "2026-09-06T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The run was commissioned to test whether a provider search can move the
  Bainbridge-Ropers variant mechanism off UNKNOWN, where this repository records
  it because truncating ASXL3 alleles that undergo nonsense-mediated decay reduce
  dosage while the decay-escaping class produces a truncated protein of untested
  activity. It does not settle the question, but unlike the parallel Weaver run it
  changes the balance of the argument, and against the hypothesis it was asked to
  explore.

  The correction is specific and checkable. The seed cited the largest ASXL3
  cohort for a phenotype difference tracking the decay-escaping class, an autism
  enrichment. The report reads the same cohort further and finds that the core
  severity measures run the other way: intellectual disability and global
  developmental delay are more severe in the decay-subject null group. If a
  decay-escaping truncated protein were simply more toxic than a null, the
  no-decay class should carry the greater core burden, and it does not. The report
  also notes that the one functional readout available in ASXL3 patient material
  shows increased H2AK119 ubiquitination, the loss-of-function direction and the
  opposite of the ASXL1 gain-of-function paradigm the hypothesis reasons from.
  Both observations were verified against the cached records and the second is
  correctly caveated in the report, since the assayed allele was decay-subject and
  so does not represent the class in question. The alternative hypothesis in the
  disease entry was qualified on the strength of the first.

  Its computational work is a predictive exon, decay-boundary and domain mapping
  for the canonical transcript, delivered as committed tables. The report states
  that checksums and replay instructions are in an artifact manifest and names two
  analysis scripts; none of the three files is in the bundle. The outputs are
  therefore inspectable but the runs are not replayable as described, and both
  analyses are recorded as PARTIAL and PARTIALLY_AUDITABLE.
artifacts:
  - openscientist-assessment-by-claude-code.md
artifact_root: ../openscientist_artifacts
data_sources:
  - data_source_id: ensembl-asxl3
    source_type: API
    name: Ensembl REST records for the canonical ASXL3 transcript
    identifier: "ensembl:ENST00000269197"
    version: GRCh38, live endpoint
    uri: https://rest.ensembl.org
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: ACCESSED
    query: "GET /lookup/symbol/homo_sapiens/ASXL3?expand=1 and /overlap/translation"
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_logs_access_and_search_log.md
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_exon_cds_nmd_map.csv
    notes: >-
      Directly relevant: the transcript is the MANE Select for the disease gene,
      and the exon and coding coordinates are what the decay-boundary calculation
      rests on. The committed access log records each endpoint call.
  - data_source_id: gnomad-asxl3
    source_type: API
    name: gnomAD constraint and transcript variants for ASXL3
    identifier: "gnomad:ENST00000269197"
    version: gnomad_r4, GRCh38
    uri: https://gnomad.broadinstitute.org/api
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: ACCESSED
    query: gene constraint, transcript variants and clinvar_variants for ENST00000269197
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_clinvar_gnomad_positional_analysis.json
    notes: >-
      Relevant to dosage sensitivity. The committed JSON records the constraint
      values and the positional test. ClinVar was reached through the gnomAD
      transcript field rather than queried directly, so the pathogenic-truncation
      set inherits gnomAD's snapshot and annotation rather than a ClinVar query of
      the assessor's choosing.
  - data_source_id: pfam-asxl3
    source_type: DATABASE
    name: Pfam domain coordinates for ASXL3 via Ensembl
    identifier: "pfam:PF13919,PF13922"
    access_status: ACCESSED
    query: "Pfam domain coordinates for ENSP00000269197 via Ensembl /overlap/translation"
    retrieved_at: "2026-09-05T00:00:00Z"
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_domain_map.csv
    notes: >-
      Supplies the DEUBAD/BAP1-binding and C-terminal PHD coordinates that the
      retained-versus-lost domain argument depends on.
  - data_source_id: pubmed-asxl3-proteomics
    source_type: DATABASE
    name: PubMed search for a truncated ASXL3 protein detection study
    uri: https://pubmed.ncbi.nlm.nih.gov/
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: SEARCHED_NO_RESULT
    query: ASXL3 truncated protein western blot / proteomics
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_logs_access_and_search_log.md
    notes: >-
      The most consequential negative result of the run, and it agrees with the
      protein-detection step this repository records as the precondition of the
      discriminating experiment. A bounded absence for the queries run, not an
      exhaustive audit.
  - data_source_id: gencc-clingen-asxl3
    source_type: DATABASE
    name: GenCC and ClinGen dosage-sensitivity annotation for ASXL3
    access_status: UNVERIFIABLE
    notes: >-
      The report states these were not programmatically retrieved and labels them
      unverified rather than absent, which is the correct disposition.
analyses:
  - analysis_id: asxl3-nmd-domain-mapping
    method: >-
      Map exon and coding coordinates for the canonical ASXL3 transcript, apply the
      50-nucleotide rule to locate the nonsense-mediated-decay escape boundary, and
      overlay Pfam domain coordinates to determine which domains a decay-escaping
      truncation would retain or lose.
    comparison: >-
      Predicted decay-escaping ASXL3 truncation architecture against the ASXL1
      truncation architecture reported to yield a hyperactive complex.
    input_data_source_ids:
      - ensembl-asxl3
      - pfam-asxl3
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    software:
      - software_name: OpenScientist execute_code sandbox
        software_version: "unreported"
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_exon_cds_nmd_map.csv
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_domain_map.csv
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_nmd_domain_analysis_summary.json
    status_reason: >-
      The outputs are committed and internally consistent: a twelve-exon coding map
      with per-exon decay classification, a domain table, and a summary JSON whose
      transcript, protein length, junction and boundary values agree with the
      report's prose. Execution is not replayable as described, because the script
      the report names is not in the bundle, so this is PARTIAL rather than
      SUCCEEDED.
    limitations: >-
      Predictive throughout. The 50-nucleotide rule assigns an expected decay fate
      to a position; it does not show that any transcript escapes decay in patient
      cells, that a truncated protein is made, or that such a protein has activity.
      The report is explicit about this, calling the result a predictive
      computational match rather than a demonstration, which is the correct
      framing.
  - analysis_id: asxl3-clinvar-positional
    method: >-
      Test the positional distribution of pathogenic and likely-pathogenic ASXL3
      truncating variants against the decay boundary, alongside gnomAD
      loss-of-function constraint.
    comparison: >-
      Proximal decay-subject truncations against distal decay-escaping truncations
      in the pathogenic set.
    input_data_source_ids:
      - gnomad-asxl3
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Bainbridge-Ropers_Syndrome_asxl3_nmd_escaping_truncated_protein_openscientist_artifacts_data_asxl3_clinvar_gnomad_positional_analysis.json
    status_reason: >-
      The committed JSON records sources, retrieval date, constraint values and the
      positional result. The named analysis script is not in the bundle, so the
      step from the API to the JSON is attested only by the provider.
    limitations: >-
      This analysis carries the argument that cuts against the hypothesis, namely
      that roughly half the pathogenic truncations are proximal true nulls and are
      fully pathogenic. That inference depends on the ClinVar set as snapshotted
      through gnomAD, which was not independently re-queried.
claims:
  - claim_id: core-severity-tracks-null-class
    statement: >-
      In the largest ASXL3 cohort, core severity measures are worse in the
      decay-subject null group than in the decay-escaping protein-truncating group,
      which is the opposite of what a more toxic truncated protein would predict.
    disposition: RETAINED
    report_quote: >-
      If the NMD-escaping truncated protein were simply more toxic than a null, the
      no-NMD class should carry greater core burden; instead the null class does.
    rationale: >-
      The most valuable finding of the run and a direct correction to the seed. The
      seed quoted this cohort only for the autism enrichment in the decay-escaping
      class, which reads as support for the alternative hypothesis; the report
      reads the same paper further and finds the core severity measures run the
      other way. The underlying sentence was verified in the cached record for
      PMID:42494517, which states that intellectual disability and global
      developmental delay were more severe in the decay-subject and first
      mutational-cluster groups. The argument is a reasonable inference rather than
      a measurement of protein activity, since severity could also track variant
      position or residual function, and the report says so. The alternative
      hypothesis in the disease entry was qualified on this basis.
    citations:
      - PMID:42494517
  - claim_id: h2aub-direction-opposes-gof
    statement: >-
      The one functional readout from ASXL3 patient material shows increased
      H2AK119 ubiquitination, the loss-of-function direction, opposite to the
      decrease produced by truncated ASXL1 in the gain-of-function paradigm.
    disposition: RETAINED
    report_quote: >-
      The direction of that chromatin change is diagnostic.
    rationale: >-
      Correctly reported and correctly caveated. The measurement is real and is
      already cited in the disease entry for the PR-DUB arm of the pathophysiology;
      the directional contrast against the ASXL1 paradigm is the report's addition.
      Its own limitation is stated plainly in the report: the assayed allele
      underwent decay and therefore does not represent the decay-escaping class the
      hypothesis is about, and it is a single patient. It constrains the
      gain-of-function reading without excluding it for the untested class.
    citations:
      - PMID:26647312
  - claim_id: asxl1-loss-is-gain-plausibility
    statement: >-
      Truncated ASXL1 forms a stable protein that confers gain of function on the
      ASXL1-BAP1 complex, and ASXL3 shares the domain architecture required for the
      same mechanism.
    disposition: QUALIFIED
    report_quote: >-
      all direct experimental evidence is in ASXL1; it establishes plausibility,
      not proof for ASXL3
    rationale: >-
      Accurately reported, and the report qualifies it in the same breath, which is
      the right disposition. This is the strongest available support for the
      alternative hypothesis and it is entirely cross-gene. Useful as a lead into
      the ASXL1 literature, including for the Bohring-Opitz entry where the same
      question arises for ASXL1 itself. Not promoted to the disease entry: a
      mechanism demonstrated in a paralogue is not evidence for this gene's alleles.
    citations:
      - PMID:35122023
      - PMID:34186160
      - PMID:34536441
  - claim_id: nmd-domain-architecture-match
    statement: >-
      A decay-escaping ASXL3 truncation would retain the BAP1-binding DEUBAD module
      while losing the C-terminal PHD finger, matching the configuration that
      yields a hyperactive complex in ASXL1.
    disposition: QUALIFIED
    report_quote: >-
      This is a predictive computational match, not a demonstration that such a
      protein is made or is active in patients.
    rationale: >-
      The computation is internally consistent and its outputs are committed, and
      the report states its own epistemic limit accurately. Qualified because the
      claim is a prediction about a protein whose existence in patient cells is
      exactly what the report's own literature search failed to find evidence for.
    analysis_ids:
      - asxl3-nmd-domain-mapping
  - claim_id: overall-verdict-modifier-not-primary
    statement: >-
      The decay-escaping truncated-protein mechanism is at most a phenotypic
      modifier, not the primary or necessary disease mechanism, and its central
      molecular claim is untested in ASXL3 patient material.
    disposition: RETAINED
    report_quote: >-
      Haploinsufficiency is the sufficient primary driver; NMD-escape/GOF is a
      plausible phenotypic modifier.
    rationale: >-
      Well argued and consistent with the evidence assembled. It does not by itself
      move the disease entry's category off UNKNOWN, because the entry records the
      contested question as which mechanism the truncating alleles act through and
      this verdict concedes that the decay-escaping class has never been assayed.
      What it does support is qualifying the alternative hypothesis rather than
      leaving it stated as a symmetric competitor, which is the change made.
  - claim_id: manifest-and-code-present
    statement: >-
      Checksums, replay instructions and the two analysis scripts are committed with
      the artifact bundle.
    disposition: REJECTED
    report_quote: "Checksums and replay instructions in `openscientist_artifacts/MANIFEST.yaml`."
    rationale: >-
      No MANIFEST.yaml is in the bundle, and neither of the two scripts the report
      names under a code directory was delivered. The analysis-run gate cannot be
      applied to this bundle, and unlike the parallel Weaver run there is no
      provenance record carrying the code as an embedded string, so the
      computations are not replayable from what was committed. The data outputs
      themselves are present and inspectable, which is why the analyses are recorded
      as PARTIAL rather than REPORTED_ONLY.

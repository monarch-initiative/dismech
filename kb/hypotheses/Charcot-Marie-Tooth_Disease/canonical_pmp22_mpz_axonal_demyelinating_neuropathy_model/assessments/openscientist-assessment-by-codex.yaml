provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
assessed_at: "2026-07-31T17:47:48Z"
overall_verdict: SUPPORTED
summary: >-
  The scoped canonical framework is well supported: CMT is genetically and
  mechanistically heterogeneous, PMP22 duplication is the most common resolved
  cause, Schwann-cell and neuronal lesions define major demyelinating and axonal
  compartments, and distal axonal dysfunction or loss is a major determinant of
  disability. The report is not curation-ready as written. It conflates
  denominators for PMP22 frequency, converts a dermal-fiber observation into an
  absolute disease-wide "dysmyelinating, not demyelinating" reclassification,
  generalizes mouse results across subtypes and humans, proposes cholesterol
  supplementation for CMT1A from a rescue experiment in PMP22-deficient tissue,
  and describes mouse complement inhibition as a failed human intervention. It
  also overstates a checked single-cell-omics absence, an oligogenic model, and
  biomarker validation; supplies two incorrect ontology mappings; and does not
  deposit enough corpus or figure provenance to reconstruct its claimed
  128-paper, 36-finding review.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-core
    statement: >-
      The canonical PMP22, MPZ, axonal, and demyelinating framework is strongly
      supported in its broad disease-level scope.
    disposition: RETAINED
    report_quote: >-
      The Canonical PMP22/MPZ/Axonal & Demyelinating Peripheral Neuropathy Model
      for Charcot-Marie-Tooth disease is robustly supported by converging lines
      of evidence from human genetics, animal models, clinical trials, and
      emerging biomarker studies.
    rationale: >-
      The 1,515-person specialist cohort in PMID:38481354 establishes the broad
      genetic architecture and the dominance of PMP22 duplication among solved
      cases. Human pathology, nerve-conduction phenotypes, and subtype-specific
      model systems support major Schwann-cell/myelin and neuronal/axonal
      compartments. This retains the framework, not every universal edge or
      refinement asserted by the report.
    citations:
      - PMID:38481354
      - PMID:19923170
      - PMID:21487305
      - PMID:28796392
  - claim_id: pmp22-frequency-denominators
    statement: >-
      PMP22 duplication accounts for 43 to 60 percent of diagnosed CMT cases.
    disposition: QUALIFIED
    report_quote: >-
      PMP22 duplication as the most common cause (43-60% of diagnosed cases)
    rationale: >-
      The 43.3 percent figure is 505 of 1,165 genetically solved cases in a
      single specialist cohort; it is 33.3 percent of that cohort's 1,515
      clinically diagnosed participants. The approximately 60 percent figure in
      PMID:31852984 is a background statement about pathogenic variations, not
      a result from its 200 PMP22-duplication-negative participants. The report
      correctly ranks PMP22 duplication first but presents unlike denominators
      as a range of diagnosed-case fractions.
    citations:
      - PMID:38481354
      - PMID:31852984
  - claim_id: universal-final-common-path
    statement: >-
      All CMT subtypes converge on length-dependent axonal degeneration as a
      single final common pathway.
    disposition: QUALIFIED
    report_quote: >-
      convergent length-dependent axonal degeneration as the final common
      pathway
    rationale: >-
      Distal axonal loss is a major correlate of disability and a useful
      convergence concept, but the report itself cites CMT1A model mice with
      pronounced impairment in the absence of overt axonal loss. CMT subtypes
      also differ in developmental myelin dysfunction, primary axonal injury,
      progression, and additional phenotypes. The final-common-path framing is
      useful when expressed as a frequent late convergence rather than a
      universal sufficient explanation.
    citations:
      - PMID:21487305
      - PMID:25216747
      - PMID:28796392
      - PMID:41400104
  - claim_id: absolute-dysmyelination-reclassification
    statement: >-
      CMT1A is fundamentally dysmyelinating and not demyelinating.
    disposition: REJECTED
    report_quote: >-
      This establishes that CMT1A is fundamentally a *dysmyelinating*
      (developmental) rather than *demyelinating* (destructive) disorder.
    rationale: >-
      PMID:19923170 found shortened internodes and no segmental demyelination in
      sampled dermal myelinated fibers from 32 patients; its conclusion says
      this suggests a potential developmental defect, not that it reclassifies
      every nerve compartment or disease stage. PMID:21487305 supports stable
      adult dysmyelination in two overexpression mouse models. Neither source
      establishes the report's absolute disease-wide exclusion, and
      PMID:22189569 explicitly describes CMT1A as dysmyelinating and
      demyelinating. The conventional demyelinating electrophysiologic class
      can coexist with a major developmental dysmyelination mechanism.
    citations:
      - PMID:19923170
      - PMID:21487305
      - PMID:22189569
  - claim_id: structural-organizer-scope
    statement: >-
      PMP22 is a structural organizer of myelin junctional and nodal
      architecture whose disruption contributes directly to CMT1A disability.
    disposition: QUALIFIED
    report_quote: >-
      PMP22 is now proposed to function as a structural organizer coordinating
      adherens junction patterning and nodal subdomain integrity
    rationale: >-
      PMID:41400104 directly supports junctional and nodal disorganization in
      CMT1A and HNPP model mice and proposes the structural-organizer model. Its
      abstract explicitly describes compromised metabolic support and axonal
      excitability as predictions. Human validation and the quantitative
      contribution to disability remain unresolved, so this is a strong model
      result and curation lead rather than an established human causal branch.
    citations:
      - PMID:41400104
  - claim_id: cholesterol-trafficking-scope
    statement: >-
      PMP22 dosage and mutation alter cholesterol trafficking, and this
      mechanism contributes to PMP22-linked myelination defects.
    disposition: QUALIFIED
    report_quote: >-
      PMP22 contains a cholesterol recognition amino acid consensus (CRAC)
      domain that is essential for cholesterol trafficking.
    rationale: >-
      PMID:32511821 supports altered subcellular cholesterol trafficking in
      gain-, loss-, and point-mutation models, including lysosomal
      sequestration and reduced efflux after PMP22 overexpression. The study
      does not establish that the CRAC/cholesterol branch is primary in human
      CMT1A or that one intervention direction applies across opposing PMP22
      dosage states.
    citations:
      - PMID:32511821
      - PMID:38743588
  - claim_id: cholesterol-supplementation-cmt1a
    statement: >-
      Cholesterol supplementation is a source-supported intervention to pilot
      in PMP22-duplication CMT1A.
    disposition: REJECTED
    report_quote: >-
      Pilot trial of targeted cholesterol supplementation (or LXR agonist) in
      CMT1A patients
    rationale: >-
      The supplementation rescue in PMID:32511821 used dorsal-root-ganglion
      explants from heterozygous PMP22-deficient mice, a loss-of-function HNPP
      context. The same paper reports lysosomal cholesterol sequestration and
      reduced efflux under PMP22 overexpression. Transferring a rescue from
      deficiency to duplication without establishing direction, dose, tissue
      delivery, or safety is not supported and could worsen the relevant
      trafficking imbalance.
    citations:
      - PMID:32511821
  - claim_id: sarm1-generalization
    statement: >-
      SARM1 is the central executioner of CMT2A axon degeneration and a
      convergence target across axonal CMT subtypes.
    disposition: QUALIFIED
    report_quote: >-
      demonstrating that SARM1 is the central executioner of axon degeneration
      in this model
    rationale: >-
      Genetic Sarm1 deletion rescued much of the axonal, synaptic, muscle,
      functional, and mitochondrial pathology in one Mfn2-H361Y rat model in
      PMID:36287202. That is strong causal evidence in the tested model. It does
      not establish rate limitation in human CMT2A, every MFN2 genotype, or
      unrelated axonal CMT subtypes; the paper itself concludes that inhibition
      is a therapeutic candidate.
    citations:
      - PMID:36287202
  - claim_id: upr-convergence
    statement: >-
      UPR and ER stress are a validated convergent therapeutic target across
      CMT1A and CMT1B.
    disposition: QUALIFIED
    report_quote: >-
      This identifies UPR/ER stress as a convergent mechanism across genetically
      distinct demyelinating CMT subtypes and validates it as a therapeutic
      target.
    rationale: >-
      PMID:35501630 shows that IFB-088 improved motor, neurophysiologic,
      myelination, and UPR-marker outcomes in C3-PMP22 and Mpz-R98C mice. This
      supports a cross-model proteostasis lead. It does not yet validate UPR as
      a human disease-modifying target, and MPZ misfolding/ER retention and
      PMP22 overexpression need not contribute with the same weight or
      molecular route.
    citations:
      - PMID:35501630
  - claim_id: inflammation-subtype-and-source-scope
    statement: >-
      RAG1-cross and CSF1 evidence establishes immune amplification across
      CMT1A, CMT1B, and CMT1X.
    disposition: QUALIFIED
    report_quote: >-
      Genetic evidence from RAG-1-deficient crosses demonstrates that adaptive
      immunity substantially amplifies demyelination in CMT models
    rationale: >-
      PMID:16775375 is a review, although the matrix classifies it as model
      organism evidence. Its abstract reports RAG1 crosses for P0-deficient
      CMT1B and Cx32-deficient CMT1X models; CMT1A is described as showing
      increased immune cells, not as receiving the same RAG1 perturbation.
      PMID:26865613 directly studies opposing CSF1 isoforms in a CMT1X mouse.
      Secondary inflammation is a credible subtype-specific amplifier, but the
      causal perturbations and even immune-cell effects are not uniform across
      models or established in patients.
    citations:
      - PMID:16775375
      - PMID:26865613
      - PMID:36926597
  - claim_id: complement-human-trial
    statement: >-
      Terminal-complement inhibition is among the pharmacological
      interventions that failed in human CMT1A trials.
    disposition: REJECTED
    report_quote: >-
      every pharmacological intervention tested in human CMT1A trials to date
      (ascorbic acid across five trials, complement inhibition) has failed to
      demonstrate clinical efficacy except for PXT3003
    rationale: >-
      PMID:36926597 inhibited C6 with antisense oligonucleotides in two
      PMP22-overexpressing mouse models. It was not a human clinical trial.
      The human ascorbic-acid trials were negative and the cited PXT3003 trial
      reported a modest positive high-dose result, but inserting the mouse
      complement experiment into a list of human failures is a material
      species and evidence-level error. The report correctly describes this as
      a CMT1A mouse experiment later in the mechanistic review, so the error is
      confined to the executive judgment rather than repeated throughout.
    citations:
      - PMID:21393063
      - PMID:34656144
      - PMID:36926597
  - claim_id: ascorbic-pharmacokinetic-explanation
    statement: >-
      Tight regulation of ascorbic-acid absorption likely explains why the
      CMT1A trials failed.
    disposition: QUALIFIED
    report_quote: >-
      Pharmacokinetic limitations -- tight control of ascorbic acid absorption
      -- likely explain the translational failure
    rationale: >-
      Five trials were negative, and PMID:21393063 provides direct randomized
      evidence for no benefit over two years. PMID:23525455 is a
      pharmacokinetic perspective that proposes its explanation; it did not
      experimentally establish absorption as the cause of failure. Other
      explanations, including target biology, exposure in nerve, outcome
      sensitivity, and model fidelity, remain possible.
    citations:
      - PMID:21393063
      - PMID:23525455
      - PMID:26450076
  - claim_id: preclinical-pmp22-lowering
    statement: >-
      Direct PMP22 lowering reverses CMT1A features after onset in rodent
      models, and AAV9-miR871 has supporting mouse and non-human-primate safety
      and biodistribution evidence.
    disposition: RETAINED
    report_quote: >-
      PMP22-targeting ASOs reversed CMT1A features in rodent models even when
      treatment was initiated *after* disease onset
    rationale: >-
      PMID:29202483 directly reports post-onset ASO rescue in two rodent models
      and rat-skin target-engagement measurements. PMID:41948127 reports
      miR871-mediated lowering and phenotypic improvement in a humanized mouse
      model plus dose, toxicity, target-engagement, and biodistribution work in
      mice and non-human primates. Both are strong preclinical results; neither
      is human clinical efficacy.
    citations:
      - PMID:29202483
      - PMID:41948127
  - claim_id: pxt3003-trial-result
    statement: >-
      High-dose PXT3003 produced a statistically significant but modest ONLS
      improvement in one phase 3 CMT1A trial complicated by formulation and
      missing-data problems.
    disposition: RETAINED
    report_quote: >-
      PXT3003 demonstrated statistically significant improvement in the ONLS
      primary endpoint in phase III (mean difference -0.37 points; 97.5% CI
      [-0.68 to -0.06]; p=0.008), though the trial was complicated by early
      discontinuation of the high-dose arm due to formulation issues
    rationale: >-
      These values and the high-dose crystallization problem match
      PMID:34656144. The trial changed its statistical analysis plan before
      database lock because of extensive missing data and used a modified full
      analysis set, so the report is right to treat the result as modest and
      qualified rather than definitive validation of direct PMP22 lowering.
    citations:
      - PMID:34656144
  - claim_id: human-pmp22-lowering-gap
    statement: >-
      The PMP22-dosage axis lacks any definitive human validation.
    disposition: QUALIFIED
    report_quote: >-
      The entire PMP22-dosage axis, validated extensively in rodent models,
      lacks definitive human validation.
    rationale: >-
      The central clinical gap is real: the cited corpus contains no human trial
      of direct PMP22 lowering. The wording is too broad, however. Before the
      report, patient-derived CMT1A PNS organoids showed myelin defects improved
      by PMP22 downregulation (PMID:36511878), and patient-derived iPSC Schwann
      cells showed rescue after editing the duplicated region (PMID:38017287).
      These are human-cell proof-of-concept, not clinical validation.
    citations:
      - PMID:36511878
      - PMID:38017287
      - PMID:29202483
      - PMID:41948127
  - claim_id: human-single-cell-omics-absence
    statement: >-
      Human CMT peripheral-nerve single-cell and spatial-omics evidence is
      completely absent.
    disposition: QUALIFIED
    report_quote: >-
      Complete Absence of Human Peripheral Nerve Single-Cell/Spatial Omics
    rationale: >-
      On 2026-07-31, the PubMed query `("Charcot-Marie-Tooth"[Title/Abstract] OR
      CMT1A[Title/Abstract] OR CMT1B[Title/Abstract] OR CMT2A[Title/Abstract] OR
      CMTX1[Title/Abstract]) AND ("single cell"[Title/Abstract] OR
      "single-cell"[Title/Abstract] OR "single nucleus"[Title/Abstract] OR
      "single-nucleus"[Title/Abstract] OR scRNA-seq[Title/Abstract] OR
      snRNA-seq[Title/Abstract] OR "spatial transcriptomics"[Title/Abstract] OR
      "spatial omics"[Title/Abstract])` returned 13 records. Manual screening
      found no single-cell or spatial profiling of ex vivo CMT nerve, so that
      narrowly stated gap remains useful. "Complete absence" overstates the
      broader human evidence: PMID:36511878 used single-cell analysis in
      patient-derived CMT1A PNS organoids and tested PMP22 downregulation. The
      report deposits no query, result set, or search date beyond prose, so its
      negative search cannot be independently reconstructed.
    citations:
      - PMID:36511878
  - claim_id: metabolic-support-cmt-bridge
    statement: >-
      Schwann-cell lactate shuttling is an established intermediate mechanism
      connecting CMT dysmyelination to secondary axonal degeneration.
    disposition: QUALIFIED
    report_quote: >-
      This suggests that metabolic support failure may be an intermediate
      mechanism linking Schwann cell dysfunction to axonal degeneration
    rationale: >-
      PMID:32686211 shows that Schwann-cell MCT1 deletion disrupts long-term
      motor-endplate innervation while preserving peripheral myelin; it does not
      test CMT. PMID:25762662 reports MCT localization, altered culture outcomes
      after MCT1 downregulation, and increased Krox20 and P0 expression after
      lactate exposure. These provide general PNS plausibility, not a direct
      causal bridge in CMT1A or other subtypes.
    citations:
      - PMID:25762662
      - PMID:32686211
  - claim_id: oligogenic-inheritance-model
    statement: >-
      Rare-variant burden and concomitant variants establish an oligogenic
      inheritance model for a subset of CMT.
    disposition: QUALIFIED
    report_quote: >-
      This does not refute the canonical model but challenges its purely
      Mendelian framing for some patients.
    rationale: >-
      PMID:32741968 reports a preliminary EXOC4 risk allele and explores
      multilocus inheritance; it does not establish a required oligogenic
      genotype. PMID:35153971 found variants in two genes in 4 of 189 families,
      with intrafamilial severity differences, but coexistence and possible
      modification are not proof that both loci are necessary for disease.
      Complex modifiers are plausible; a defined oligogenic CMT class remains
      unproven from these sources.
    citations:
      - PMID:32741968
      - PMID:35153971
  - claim_id: kif1b-attribution
    statement: >-
      The KIF1B-CMT2A1 relationship has limited evidence and should not be
      presented as equivalent to the established MFN2-CMT2A relationship.
    disposition: RETAINED
    report_quote: >-
      The canonical model lists KIF1B as a CMT gene, but evidence is limited to
      a few pedigrees.
    rationale: >-
      The original KIF1B report involved one pedigree, while subsequent work
      identified MFN2 in most families linked to the historical CMT2A locus.
      PMID:30126838 supplies functional evidence for additional KIF1B variants
      but acknowledges limited pedigrees. The ClinGen Charcot-Marie-Tooth GCEP
      classified KIF1B-CMT2A1 as Limited in June 2026, so the report's proposed
      downgrade is directionally correct even though that expert-panel result
      postdates the report.
    citations:
      - PMID:11389829
      - PMID:16043786
      - PMID:30126838
      - CGGV:assertion_ae6ffeae-9609-47bf-89a9-4863cf6ef05c-2026-06-12T160000.000Z
  - claim_id: biomarker-validation-level
    statement: >-
      MRI calf fat fraction is the most responsive CMT1A trial biomarker, and
      plasma NfL and GFAP are validated indicators of axonal and glial disease.
    disposition: QUALIFIED
    report_quote: >-
      MRI calf muscle fat fraction has emerged as the most responsive biomarker
      for CMT1A clinical trials.
    rationale: >-
      PMID:39957630 supports longitudinal responsiveness and correlation in 20
      CMT1A participants; PMID:37979968 supports efficient automated
      segmentation in 20 participants and 7 controls. PMID:39882365 finds NfL
      and GFAP severity correlations in 44 cases and 44 controls. These are
      promising validation studies, but they do not prove a field-wide
      superlative, causal dual pathology, treatment responsiveness, or surrogate
      endpoint validity. The report later acknowledges the treatment-response
      gap.
    citations:
      - PMID:37979968
      - PMID:39882365
      - PMID:39957630
  - claim_id: ontology-candidate-mappings
    statement: >-
      The proposed cell-type and biological-process mappings are
      ontology-ready.
    disposition: REJECTED
    report_quote: >-
      Myelinating Schwann cell (CL:0000218), Non-myelinating Schwann cell,
      Neural crest cell (CL:0000333), Endoneurial macrophage
    rationale: >-
      OAK confirms CL:0000218 as myelinating Schwann cell, but CL:0000333 is
      migratory neural crest cell; the generic neural crest cell is
      CL:0011012. In the process list, GO:0031175 is neuron projection
      development, not axon degeneration. GO:0006986 has the canonical label
      response to unfolded protein, not "unfolded protein response." The
      non-myelinating Schwann-cell and endoneurial-macrophage suggestions have
      no identifiers. These labels were checked on 2026-07-31 with `uv run
      runoak -i sqlite:obo:cl info CL:0000333 CL:0011012 CL:0000218` and `uv
      run runoak -i sqlite:obo:go info GO:0031175 GO:0006986`. Several other
      mappings are valid, but the list as a whole must not be copied without
      correction.
  - claim_id: corpus-provenance
    statement: >-
      The deposited report supports its accounting of 36 primary findings
      across 128 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Evidence Items Evaluated:** 36 primary findings across 128 papers
      reviewed over 5 investigation iterations
    rationale: >-
      The frontmatter reports citation_count 42 and the citation manifest lists
      exactly 42 PMIDs. The evidence matrix has 29 rows. No search strategies,
      screened-result log, exclusion record, or complete 128-paper corpus is
      deposited. The larger review may have occurred, but neither its count nor
      the characterization of 36 primary findings can be reconstructed.
  - claim_id: figure-artifact-delivery
    statement: >-
      The five figure references in the report correspond to deposited review
      artifacts.
    disposition: REJECTED
    report_quote: >-
      {{figure:evidence_strength_heatmap.png|caption=Evidence strength heatmap
      showing support for each core claim of the canonical CMT model across
      different evidence dimensions (human genetics, animal models, clinical
      trials, biomarkers, structural/molecular biology). Green indicates strong
      support; yellow indicates moderate; red indicates weak or contradicted.}}
    rationale: >-
      The hypothesis directory contains only openscientist.md and its citation
      manifest. None of evidence_strength_heatmap.png,
      final_summary_visualization.png, mechanistic_causal_chain.png,
      biomarker_landscape_and_gaps.png, or evidence_strength_assessment.png is
      present. The prose can be assessed, but the purported visual evidence and
      artifact provenance cannot.
  - claim_id: uniprot-query-provenance
    statement: >-
      Reproducible UniProt SPARQL results confirm 20 disease associations for
      all five seed genes.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      UniProt SPARQL queries confirmed disease annotations for all five seed
      hypothesis genes (PMP22, MPZ, GJB1, MFN2, NEFL) across 20 disease
      associations.
    rationale: >-
      The report provides no endpoint, query text, retrieval date, result table,
      accession list, or saved artifact. The broad gene-disease statement is
      plausible, but the exact count and the claimed database check are not
      reproducible from the deposited materials.

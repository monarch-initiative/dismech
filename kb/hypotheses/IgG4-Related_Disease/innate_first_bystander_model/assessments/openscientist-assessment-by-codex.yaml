claims:
  - claim_id: innate-first-temporal-ordering
    statement: >-
      Innate-first temporal ordering is demonstrated in one induced mouse model
      of autoimmune pancreatitis, but not in human IgG4-RD.
    disposition: QUALIFIED
    report_quote: >-
      the **"innate-first" temporal ordering is strongly supported**
    rationale: >-
      PMID:39264798 uses repeated poly(I:C) administration in MRL/MpJ mice to
      establish a cDC-to-T-cell-to-pDC sequence. Its human arm measured serum
      CXCL9, CXCL10, and CCL25 cross-sectionally in 33 AIP/IgG4-RD patients,
      with paired pre/post-prednisolone measurements in a 14-patient subset. It
      did not observe lesion initiation or temporal ordering in people. The
      paper itself says a similar human loop is possible, which is narrower
      than the report's claim of strong human-relevant temporal support.
    citations:
      - PMID:39264798
  - claim_id: slc29a3-model-specificity
    statement: >-
      Constitutive TLR7 activation is sufficient for autoimmune sialadenitis in
      Slc29a3-deficient mice, not for a faithful model of systemic human
      IgG4-RD.
    disposition: QUALIFIED
    report_quote: >-
      This genetic model provides the strongest evidence that innate TLR7/8
      activation alone is **sufficient** to initiate IgG4-RD-like pathology
    rationale: >-
      PMID:41332187 demonstrates salivary dysfunction, acinar-cell injury,
      lymphocyte infiltration, and chemokine production in Slc29a3-deficient
      mice. The human comparison is shared salivary-gland chemokine expression.
      The study does not reproduce IgG4 biology, storiform fibrosis,
      obliterative phlebitis, or systemic IgG4-RD, and autoimmune sialadenitis
      is also a feature of Sjögren syndrome. It supports an innate TLR7 route
      to salivary inflammation, with disease-specific extrapolation unresolved.
    citations:
      - PMID:41332187
  - claim_id: three-independent-innate-pathways
    statement: >-
      Primary ex vivo studies support NOD2-monocyte and TLR-basophil routes to
      IgG4 production, but the report does not establish three independent
      in-vivo pathways in IgG4-RD.
    disposition: QUALIFIED
    report_quote: >-
      existence of at least three independent, T-cell-independent pathways
    rationale: >-
      PMID:21971969 and PMID:22744834 are primary PBMC or cell-culture studies
      showing BAFF-associated IgG4 production after innate-receptor
      stimulation, including experiments using healthy-control cells.
      PMID:27744509 is a review rather than a third independent primary study.
      These data establish biological plausibility for T-cell-independent IgG4
      production in culture, but not redundant in-vivo operation, disease
      initiation, or temporal priority in patients.
    citations:
      - PMID:21971969
      - PMID:22744834
      - PMID:27744509
  - claim_id: adaptive-bystander-interpretation
    statement: >-
      The adaptive response is antigen-selected and cannot be described as
      purely bystander, while a concomitant or earlier bystander component has
      not been excluded.
    disposition: QUALIFIED
    report_quote: >-
      This finding is fundamentally incompatible with a bystander model of
      B-cell expansion.
    rationale: >-
      PMID:24815737 directly shows oligoclonality, extensive somatic
      hypermutation, self-reactivity, and de novo clones at relapse; PMID:26971690
      shows clonally expanded CD4-positive CTLs. Those findings strongly reject
      a purely nonspecific explanation for the established adaptive response.
      The seed hypothesis, however, says plasmablast expansion arises "partly"
      as a downstream bystander response. The repertoire data do not test or
      exclude a simultaneous nonspecific component, nor do they establish what
      initiated antigen selection.
    citations:
      - PMID:24815737
      - PMID:26971690
  - claim_id: anti-cd19-proves-necessity
    statement: >-
      Anti-CD19 efficacy establishes therapeutic relevance of the B-lineage
      compartment, not the biological necessity of antigen-specific adaptive
      responses for every form or phase of IgG4-RD.
    disposition: REJECTED
    report_quote: >-
      establishes that adaptive B-cell responses are **necessary** for disease
      persistence.
    rationale: >-
      The randomized MITIGATE trial (PMID:39541094) shows that inebilizumab
      markedly reduces flares and improves remission outcomes. That is strong
      interventional evidence that CD19-positive cells are therapeutically
      important. Anti-CD19 depletion affects several B-lineage functions,
      including antigen presentation, cytokine support, and plasmablast
      compartments; the trial does not isolate antigen-specific adaptation or
      prove that every untreated lesion requires that compartment. "Necessary"
      and "conclusively" exceed the trial's mechanistic resolution.
    citations:
      - PMID:39541094
  - claim_id: cytokines-not-epiphenomena
    statement: >-
      Serum IFN-alpha and IL-33 are activity-associated biomarkers, but their
      causal role in human disease is not established.
    disposition: REJECTED
    report_quote: >-
      confirming they are disease-active biomarkers and not epiphenomena.
    rationale: >-
      PMID:32938972 reports higher serum concentrations, correlation with
      serum IgG4, comparable diagnostic discrimination, and decline after
      prednisolone. Correlation and response to broad immunosuppression support
      biomarker utility; they cannot distinguish causal mediators from
      downstream markers that track inflammatory burden.
    citations:
      - PMID:32938972
  - claim_id: two-phase-transition-gap
    statement: >-
      The proposed innate-initiation to adaptive-amplification transition has
      not been observed longitudinally in humans.
    disposition: RETAINED
    report_quote: >-
      The Phase 1 to Phase 2 transition is inferred, not directly observed in
      humans.
    rationale: >-
      The report correctly identifies the central missing edge. Mouse temporal
      data and human cross-sectional evidence can be arranged into a coherent
      two-phase narrative, but no study tracks an initially polyclonal human
      response becoming an oligoclonal, somatically hypermutated response.
      Retaining this gap prevents component-pathway evidence from being mistaken
      for validation of the integrated mechanism.
    citations:
      - PMID:39264798
      - PMID:24815737
  - claim_id: two-phase-reframing
    statement: >-
      An innate-initiation/adaptive-amplification model is a useful hypothesis,
      but it is a substantive reframing rather than validation of the original
      bystander mechanism.
    disposition: QUALIFIED
    report_quote: >-
      reframe as "Innate-Initiation / Adaptive-Amplification Two-Phase Model"
    rationale: >-
      The reframing appropriately removes the pure-bystander implication and
      accommodates adaptive clonality. Its defining transition and temporal
      ordering in humans remain untested, so the synthesis should be retained
      as an alternative model and discriminating experiment, not promoted as a
      partially validated causal chain.
    citations:
      - PMID:39264798
      - PMID:24815737
  - claim_id: status-recommendation
    statement: >-
      The original composite hypothesis should remain ALTERNATIVE until its
      defining temporal and transition claims are demonstrated in humans.
    disposition: REJECTED
    report_quote: >-
      **Recommended status**: PARTIALLY_SUPPORTED -- with qualification that
      "bystander" component is contradicted; recommend renaming to
      "Innate-Initiation Model" or "Two-Phase Innate-Adaptive Model"
    rationale: >-
      Component evidence supports innate involvement, but the report's own
      reframing removes the original bystander premise and introduces an
      unobserved two-phase transition. Promoting the composite status would
      conflate model-system and ex-vivo support for individual pathways with
      validation of human temporal ordering. ALTERNATIVE remains the calibrated
      status while the proposed longitudinal tests are outstanding.
    citations:
      - PMID:39264798
      - PMID:24815737

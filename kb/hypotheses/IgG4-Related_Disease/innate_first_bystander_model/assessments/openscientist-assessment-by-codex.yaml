hypothesis_id: innate_first_bystander_model
assessed_at: '2026-09-04T23:52:33.449953+00:00'
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: 'Innate component pathways are credible, but the defining human innate-first/bystander temporal
  sequence remains weakly supported and unresolved. Mouse perturbations and human-derived cultures demonstrate
  selected mechanisms; the human arm of the key cDC/T-cell/pDC study is serum association, not tissue
  validation. The prior assessment is retained and extended: the cited third-pathway review is misclassified,
  but a separate primary pDC/NET study does exist. The report also misstates healthy-control responses,
  autoantibody denominators, trial absence and genetic interpretation. Oligoclonality opposes a purely
  nonspecific adaptive response without excluding the seed hypothesis partly-bystander component. Missing
  artifacts and search records prevent reproducing provider analyses.'
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: innate-first-temporal-ordering
  statement: Innate-first temporal ordering is demonstrated in one induced mouse model of autoimmune pancreatitis,
    but not in human IgG4-RD.
  disposition: QUALIFIED
  report_quote: the **"innate-first" temporal ordering is strongly supported**
  rationale: PMID:39264798 uses repeated poly(I:C) administration in MRL/MpJ mice to establish a cDC-to-T-cell-to-pDC
    sequence. Its human arm measured serum CXCL9, CXCL10, and CCL25 cross-sectionally in 33 AIP/IgG4-RD
    patients, with paired pre/post-prednisolone measurements in a 14-patient subset. It did not observe
    lesion initiation or temporal ordering in people. The paper itself says a similar human loop is possible,
    which is narrower than the report's claim of strong human-relevant temporal support.
  citations:
  - PMID:39264798
- claim_id: slc29a3-model-specificity
  statement: Constitutive TLR7 activation is sufficient for autoimmune sialadenitis in Slc29a3-deficient
    mice, not for a faithful model of systemic human IgG4-RD.
  disposition: QUALIFIED
  report_quote: This genetic model provides the strongest evidence that innate TLR7/8 activation alone
    is **sufficient** to initiate IgG4-RD-like pathology
  rationale: PMID:41332187 demonstrates salivary dysfunction, acinar-cell injury, lymphocyte infiltration,
    and chemokine production in Slc29a3-deficient mice. The human comparison is shared salivary-gland
    chemokine expression. The study does not reproduce IgG4 biology, storiform fibrosis, obliterative
    phlebitis, or systemic IgG4-RD, and autoimmune sialadenitis is also a feature of Sjögren syndrome.
    It supports an innate TLR7 route to salivary inflammation, with disease-specific extrapolation unresolved.
    Injury includes Aqp5-positive intercalated duct cells, not only acinar cells. The mouse mechanistic
    conclusion concerns TLR7; the TLR8 statement concerns broader SLC29A3-associated innate biology. Presence
    of lymphocyte infiltration precludes claiming isolated innate-cell sufficiency without adaptive-compartment
    exclusion experiments.
  citations:
  - PMID:41332187
- claim_id: three-independent-innate-pathways
  statement: Primary ex vivo studies support NOD2-monocyte and TLR-basophil routes to IgG4 production,
    but the report does not establish three independent in-vivo pathways in IgG4-RD.
  disposition: QUALIFIED
  report_quote: existence of at least three independent, T-cell-independent pathways
  rationale: PMID:21971969 and PMID:22744834 are primary PBMC or cell-culture studies showing BAFF-associated
    IgG4 production after innate-receptor stimulation, including experiments using healthy-control cells.
    PMID:27744509 is a review rather than a third independent primary study. These data establish biological
    plausibility for T-cell-independent IgG4 production in culture, but not redundant in-vivo operation,
    disease initiation, or temporal priority in patients. PMID:26297761, cited elsewhere in the same report,
    does provide primary patient-pDC/NET/control-B-cell culture evidence for IgG4 production. Thus the
    earlier assessment citation criticism stands, but should not imply no primary third component exists.
    T-cell-independent production assays are not direct demonstration of de-novo class-switch recombination
    or three redundant in-vivo pathways.
  citations:
  - PMID:21971969
  - PMID:22744834
  - PMID:27744509
  - PMID:26297761
- claim_id: adaptive-bystander-interpretation
  statement: The adaptive response is antigen-selected and cannot be described as purely bystander, while
    a concomitant or earlier bystander component has not been excluded.
  disposition: QUALIFIED
  report_quote: This finding is fundamentally incompatible with a bystander model of B-cell expansion.
  rationale: PMID:24815737 directly shows oligoclonality, extensive somatic hypermutation, self-reactivity,
    and de novo clones at relapse; PMID:26971690 shows clonally expanded CD4-positive CTLs. Those findings
    strongly reject a purely nonspecific explanation for the established adaptive response. The seed hypothesis,
    however, says plasmablast expansion arises "partly" as a downstream bystander response. The repertoire
    data do not test or exclude a simultaneous nonspecific component, nor do they establish what initiated
    antigen selection.
  citations:
  - PMID:24815737
  - PMID:26971690
- claim_id: anti-cd19-proves-necessity
  statement: Anti-CD19 efficacy establishes therapeutic relevance of the B-lineage compartment, not the
    biological necessity of antigen-specific adaptive responses for every form or phase of IgG4-RD.
  disposition: REJECTED
  report_quote: establishes that adaptive B-cell responses are **necessary** for disease persistence.
  rationale: The randomized MITIGATE trial (PMID:39541094) shows that inebilizumab markedly reduces flares
    and improves remission outcomes. That is strong interventional evidence that CD19-positive cells are
    therapeutically important. Anti-CD19 depletion affects several B-lineage functions, including antigen
    presentation, cytokine support, and plasmablast compartments; the trial does not isolate antigen-specific
    adaptation or prove that every untreated lesion requires that compartment. "Necessary" and "conclusively"
    exceed the trial's mechanistic resolution.
  citations:
  - PMID:39541094
- claim_id: cytokines-not-epiphenomena
  statement: Serum IFN-alpha and IL-33 are activity-associated biomarkers, but their causal role in human
    disease is not established.
  disposition: REJECTED
  report_quote: confirming they are disease-active biomarkers and not epiphenomena.
  rationale: PMID:32938972 reports higher serum concentrations, correlation with serum IgG4, comparable
    diagnostic discrimination, and decline after prednisolone. Correlation and response to broad immunosuppression
    support biomarker utility; they cannot distinguish causal mediators from downstream markers that track
    inflammatory burden.
  citations:
  - PMID:32938972
- claim_id: two-phase-transition-gap
  statement: The proposed innate-initiation to adaptive-amplification transition has not been observed
    longitudinally in humans.
  disposition: RETAINED
  report_quote: The Phase 1 to Phase 2 transition is inferred, not directly observed in humans.
  rationale: The report correctly identifies the central missing edge. Mouse temporal data and human cross-sectional
    evidence can be arranged into a coherent two-phase narrative, but no study tracks an initially polyclonal
    human response becoming an oligoclonal, somatically hypermutated response. Retaining this gap prevents
    component-pathway evidence from being mistaken for validation of the integrated mechanism.
  citations:
  - PMID:39264798
  - PMID:24815737
- claim_id: two-phase-reframing
  statement: An innate-initiation/adaptive-amplification model is a useful hypothesis, but it is a substantive
    reframing rather than validation of the original bystander mechanism.
  disposition: QUALIFIED
  report_quote: reframe as "Innate-Initiation / Adaptive-Amplification Two-Phase Model"
  rationale: The reframing appropriately removes the pure-bystander implication and accommodates adaptive
    clonality. Its defining transition and temporal ordering in humans remain untested, so the synthesis
    should be retained as an alternative model and discriminating experiment, not promoted as a partially
    validated causal chain.
  citations:
  - PMID:39264798
  - PMID:24815737
- claim_id: status-recommendation
  statement: The original composite hypothesis should remain ALTERNATIVE until its defining temporal and
    transition claims are demonstrated in humans.
  disposition: REJECTED
  report_quote: '**Recommended status**: PARTIALLY_SUPPORTED -- with qualification that "bystander" component
    is contradicted; recommend renaming to "Innate-Initiation Model" or "Two-Phase Innate-Adaptive Model"'
  rationale: Component evidence supports innate involvement, but the report's own reframing removes the
    original bystander premise and introduces an unobserved two-phase transition. Promoting the composite
    status would conflate model-system and ex-vivo support for individual pathways with validation of
    human temporal ordering. ALTERNATIVE remains the calibrated status while the proposed longitudinal
    tests are outstanding.
  citations:
  - PMID:39264798
  - PMID:24815737
- claim_id: human-tissue-validation
  statement: The cDC-to-T-cell-to-pDC sequence was not validated in human tissue by the cited study.
  disposition: REJECTED
  report_quote: This innate-to-adaptive temporal sequence was validated in human AIP/IgG4-RD tissues
  rationale: PMID:39264798 performed temporal, depletion, receptor-blocking and sorted-cell coculture
    experiments in female MRL/MpJ mice. The human component was serum chemokines in 33 patients versus
    12 chronic-pancreatitis and 8 healthy controls, with 14 paired prednisolone samples. No human tissue
    perturbation or preclinical trajectory was demonstrated. The mouse CXCR3-positive cells also lacked
    the SLAMF7/granzyme-B phenotype of the human CTLs.
  citations:
  - PMID:39264798
- claim_id: innate-culture-controls
  statement: Healthy-control cells can respond to microbial ligands; disease enrichment is not absolute
    specificity.
  disposition: REJECTED
  report_quote: in type 1 AIP patients but not in controls
  rationale: PMID:39241273 reports broader microbial-motif responses in patients compared with limited
    motifs in controls, with both IgG1 and IgG4 outputs. NOD2 and basophil primary studies also demonstrate
    healthy-control responses. These findings support altered responsiveness, not a binary disease-exclusive
    switch.
  citations:
  - PMID:39241273
  - PMID:21971969
  - PMID:22744834
- claim_id: igg4-production-vs-switching
  statement: IgG4 production assays do not by themselves demonstrate direct de-novo class switching.
  disposition: QUALIFIED
  report_quote: innate cells drive IgG4 class switching
  rationale: PMID:21971969 and 22744834 measure antibody production after receptor stimulation; the pDC/NET
    experiment is separate. Evidence for BAFF-associated T-cell-independent output is useful but cannot
    substitute for tracking recombination, isotype transitions and precursor-cell fates in vivo.
  citations:
  - PMID:21971969
  - PMID:22744834
  - PMID:26297761
- claim_id: autoantibody-denominator
  statement: The four-antigen frequencies use a complete-panel subset and cannot establish a secondary
    temporal event.
  disposition: QUALIFIED
  report_quote: In a cohort of 100 IgG4-RD patients
  rationale: The overall cohort had 100 participants but the complete four-antigen panel had 86:32/86
    positive and 12/86 multiple. A negative limited antigen panel is not absence of autoreactivity. Severity
    correlations do not date antibody appearance or show that diversification follows an innate initiating
    phase.
  citations:
  - PMID:31612628
- claim_id: conditional-microbiota
  statement: Microbiota experiments demonstrate conditional amplification, not spontaneous transfer of
    the whole human disease.
  disposition: QUALIFIED
  report_quote: Gut dysbiosis exacerbates this pDC-driven pathway
  rationale: FMT recipients received 10-microgram poly(I:C), and gut-barrier/S. sciuri experiments required
    poly(I:C). The latter exacerbated pancreatitis but not sialadenitis. Their model-specific effects
    are incorporated without assigning a proven human microbial initiator.
  citations:
  - PMID:31287532
  - PMID:36044992
- claim_id: fcgr2b-expression-direction
  statement: Susceptibility associations do not distinguish innate-first from adaptive-first causation.
  disposition: QUALIFIED
  report_quote: Genetic susceptibility
  rationale: The Japanese GWAS identifies HLA-DRB1 p 1.1e-11 and FCGR2B p 2.0e-8, with rs1340976 associated
    with increased FCGR2B expression p 2.7e-10. Fc-gamma-RIIb is also a B-cell receptor regulator, not
    an exclusively innate marker. Chinese data support polygenic risk but do not assign a causal gene/function
    to every locus. The YAML uses RISK_FACTOR, not Mendelian causation.
  citations:
  - PMID:38229354
  - PMID:41298177
- claim_id: c4-copy-number-scope
  statement: C4 copy-number directions are nominal associations in a specific ancestry, not a proven causal
    complement pathway.
  disposition: QUALIFIED
  report_quote: C4 CNV
  rationale: PMID:41197642 gives C4A protective beta-0.127 p 0.0079 and C4B risk beta 0.151 p 0.019 in
    joint analysis, not genome-wide-significant C4 tests. FCGR2B replication, HLA residues and Mikulicz-specific
    PTCH1/lncRNA loci have different scopes. Genetic association does not establish innate temporal priority.
  citations:
  - PMID:41197642
- claim_id: fgfbp2-uncited
  statement: The proposed FGFBP2 family mechanism lacks a traceable supporting citation in the report.
  disposition: NEEDS_VERIFICATION
  report_quote: The FGFBP2 variant in CTLs links innate-like cytotoxicity to fibroblast activation
  rationale: The assertion says one-family evidence plus cohort enrichment but supplies no linked primary
    reference, variant, pedigree, assay or dataset. It is not promoted to a causative gene or proven CTL-to-fibroblast
    edge pending source verification.
- claim_id: belimumab-trial-exists
  statement: A belimumab trial was registered years before the report.
  disposition: REJECTED
  report_quote: Anti-BAFF (belimumab) has been tested in SLE but not IgG4-RD.
  rationale: NCT04660565 was first submitted September 2020 and describes randomized open-label maintenance
    treatment in IgG4-RD, with planned enrollment 60. Current status UNKNOWN and absent published efficacy
    do not negate its existence. This is a failed absence claim; the registry phase IV label does not
    prove disease-specific approval. BAFF intervention also affects B-cell survival and cannot independently
    discriminate innate versus adaptive initiation.
  citations:
  - clinicaltrials:NCT04660565
- claim_id: new-nondepleting-randomized-trial
  statement: The report omits a randomized nondepleting B-cell trial available before its search date.
  disposition: QUALIFIED
  report_quote: Inebilizumab Phase 3 Trial Confirms Adaptive B-Cell Centrality
  rationale: INDIGO PMID:42233621 was published June 2 before the July 6 report:194 randomized, obexelimab
    coengaging CD19/Fc-gamma-RIIb without depletion, flare HR 0.44. This complements MITIGATE but does
    not isolate an antigen-specific adaptive function. Abatacept also had a published 10-person proof-of-concept
    trial; later rilzabrutinib phase IIa results are uncontrolled and postdate the report.
  citations:
  - PMID:42233621
  - PMID:35425928
  - PMID:42481271
- claim_id: innate-th2-pathway-scope
  statement: TLR7/IL-33 and IL-33/ST2/MMP12 evidence supports amplification without establishing human
    initiation or treatment efficacy.
  disposition: QUALIFIED
  report_quote: TLR7/M2 Macrophage/IL-33 Axis
  rationale: PMID:31339007 combines 15 human IgG4-RD glands with comparison groups, macrophage agonist
    cultures and huTLR7 mice. PMID:39299101 includes nine IgG4-related ophthalmic cases and a LatY136F
    mouse system. Tissue expression and experimental MMP12 induction do not prove storiform architecture
    or human therapeutic efficacy. The YAML encodes this bounded pathway and model limitations.
  citations:
  - PMID:31339007
  - PMID:39299101
- claim_id: omics-and-curation-absence
  statement: Unlogged database searches and undefined large-scale thresholds cannot establish a broad
    absence of relevant curation or omics.
  disposition: QUALIFIED
  report_quote: No IgG4-RD entries in GenCC or ClinGen databases; no large-scale multi-omics datasets
    publicly available.
  rationale: No saved query responses support the negative database claims. The disease already has two
    deposited GEO expression datasets, and published single-cell studies exist. Those do not prove a large
    integrated multi-omics resource exists, but the scope and size threshold must be explicit. GenCC gene-disease
    validity curation is not a general submission channel for polygenic GWAS loci.
  citations:
  - PMID:37561593
  - PMID:38092138
- claim_id: reported-79-primary-papers
  statement: The claimed 79-primary-paper review and figure bundle cannot be reproduced from the repository.
  disposition: NEEDS_VERIFICATION
  report_quote: 79 primary research articles
  rationale: Only 25 distinct linked PMID records are present and include reviews. All 18 declared artifact
    files are missing, including final-report HTML/PDF and provenance JSON/PNG. No provider raw-data analysis
    or screening coverage is reproducible.
  analysis_ids:
  - literature-synthesis
- claim_id: study-design-discrimination
  statement: The proposed experiments must measure actual temporal order and distinguish overlapping intervention
    targets.
  disposition: QUALIFIED
  report_quote: Discriminating Tests
  rationale: Diagnosis-time recruitment does not observe disease initiation, and a single-organ patient
    is not inherently early-stage. Spatial periphery is not temporal upstream. BAFF or BTK effects would
    not discriminate innate initiation from established adaptive amplification; receptor-specific mouse
    induction and antagonist matching must be considered. Longitudinal immune signatures at diagnosis,
    including the small diagnosis-time study (PMID:42277154), still do not provide preclinical onset trajectories.
  citations:
  - PMID:39264798
  - PMID:42277154

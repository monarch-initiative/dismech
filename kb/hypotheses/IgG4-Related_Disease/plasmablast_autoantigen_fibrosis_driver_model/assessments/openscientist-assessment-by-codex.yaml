hypothesis_id: plasmablast_autoantigen_fibrosis_driver_model
assessed_at: "2026-07-31T02:47:58Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report correctly identifies a well-replicated cellular scaffold:
  oligoclonal plasmablasts, expanded lesional CD4-positive cytotoxic T cells,
  Tfh-associated B-cell responses, and clinical dependence on the B-lineage
  compartment. It also correctly preserves the two most important missing
  causal edges, B-lineage antigen presentation to CTLs and CTL-to-fibroblast
  activation. Several purported qualifications are overgraded or
  misattributed, however. The phenotype-to-immune-subset and IgG1 claims come
  from a review rather than phenotype-matched primary immunophenotyping; an
  allergy meta-analysis explicitly leaves causality unresolved; and an
  isolated-aortitis cohort without established IgG4-RD cannot demonstrate an
  IgG4-RD phlebitis mechanism. The seed model does not claim that IgG4 antibody
  is the dominant pathogenic effector, so the report's IgG1 argument does not
  contradict it. The scaffold remains canonical but only partially supported
  as an integrated causal mechanism.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: cellular-scaffold
    statement: >-
      Plasmablast and CD4-positive CTL expansion are strongly supported, while
      disease-specific Tfh causality is supported mainly by association and
      tissue colocalization.
    disposition: QUALIFIED
    report_quote: The model's cellular components are robustly supported.
    rationale: >-
      PMID:24815737 and PMID:26971690 provide repertoire, tissue, and
      longitudinal treatment-associated evidence for plasmablasts and
      CD4-positive CTLs. PMID:29253269 is a 16-patient immunophenotyping study
      reporting correlation and explicitly says Tfh contribution is suggested.
      PMID:35568079 identifies IL-10-positive LAG3-positive Tfh cells and
      receptor-expressing B cells in tissue, but does not perturb the
      Tfh-to-class-switching edge. The cellular scaffold is credible, whereas
      "Tfh cells drive" should remain a qualified causal inference.
    citations:
      - PMID:24815737
      - PMID:26971690
      - PMID:29253269
      - PMID:35568079
  - claim_id: b-lineage-therapeutic-dependence
    statement: >-
      B-cell depletion supplies strong indirect support for B-lineage
      involvement, without identifying the function that sustains disease.
    disposition: RETAINED
    report_quote: >-
      Rituximab responsiveness provides powerful indirect validation that
      B-cell lineage activity sustains the disease.
    rationale: >-
      The report appropriately labels this evidence indirect. In
      PMID:38781535, all 33 patients responded at six months and deeper
      depletion predicted fewer later relapses. PMID:26971690 associates
      rituximab-induced remission with reduced disease-associated CTLs. These
      observations support B-lineage centrality but do not distinguish antigen
      presentation from cytokine, costimulatory, or other B-lineage effects.
    citations:
      - PMID:38781535
      - PMID:26971690
  - claim_id: missing-apc-and-fibroblast-edges
    statement: >-
      Direct B-lineage-to-CTL antigen-presentation and
      CTL-to-fibroblast-activation experiments are missing in IgG4-RD.
    disposition: RETAINED
    report_quote: >-
      No co-culture, blocking, or spatial transcriptomics study has directly
      demonstrated either the B-cell antigen-presentation step or the CD4
      CTL-to-fibroblast activation step.
    rationale: >-
      PMID:27667138 calls continuous B-lineage antigen presentation
      "presumed." PMID:26971690 establishes CTL clonality and expression of
      IL-1beta and TGF-beta1, not antigen-presenting-cell identity or fibroblast
      response. PMID:41766862 is a review that infers profibrotic activity from
      the available cellular evidence. These are the most consequential gaps
      in the integrated canonical chain.
    citations:
      - PMID:27667138
      - PMID:26971690
      - PMID:41766862
  - claim_id: pathogenic-autoantigen-count
    statement: >-
      Candidate autoantibody responses are documented, and anti-IL-1RA
      antibodies have functional in-vitro effects in a subset, but four
      broadly established pathogenic autoantigens have not been demonstrated.
    disposition: QUALIFIED
    report_quote: >-
      Pathogenic autoantibodies against four autoantigens have been identified
    rationale: >-
      In PMID:31612628, responses to PHB1, annexin A11, and laminin
      511-E8 were infrequent and not significantly different from controls;
      broader autoreactivity correlated with severity, but causation was not
      tested. PMID:33974929 concerns a separate anti-IL-1RA specificity and
      shows neutralization plus inflammatory and fibrotic mediator production
      in vitro in a subset. The report conflates candidate autoreactivity,
      severity association, and functional pathogenicity.
    citations:
      - PMID:31612628
      - PMID:33974929
  - claim_id: phenotype-immune-subset-mapping
    statement: >-
      Four organ-distribution phenotypes are replicated, but the report does
      not provide primary phenotype-matched evidence that each is driven by a
      distinct immune-cell subset.
    disposition: REJECTED
    report_quote: >-
      Critically, these phenotypes map to distinct dominant immune cell subsets
    rationale: >-
      PMID:30612117 derives and replicates four clinical latent classes but
      does not immunophenotype their lesions. PMID:39306708 is explicitly a
      review that proposes phenotype-specific immune-cell interpretations. The
      synthesis is a useful lead, not a high-confidence human mechanistic
      result, and it cannot establish that the full seed chain applies mainly
      to retroperitoneal fibrosis or aortitis.
    citations:
      - PMID:30612117
      - PMID:39306708
  - claim_id: igg1-contradicts-seed
    statement: >-
      Possible IgG1-mediated injury does not contradict a seed model that
      assigns IgG4-positive plasmablasts a marker and sustaining role while
      assigning fibrogenic effector activity to CD4-positive CTLs.
    disposition: REJECTED
    report_quote: >-
      The seed hypothesis's implicit privileging of IgG4 as the primary
      pathogenic antibody is thus contradicted for a substantial patient
      subset.
    rationale: >-
      The seed description does not make the implied antibody-effector claim.
      PMID:39306708 is a review whose wording says Tfh1 and IgG1 "may be"
      important in an autoimmune phenotype; it is not primary evidence for a
      substantial IgG1-defined causal subset. PMID:41728618 is also a review
      and merely describes IgG4/IgG1 autoantibodies in organ-specific disease.
      IgG1 mechanisms remain a complementary lead, not a refutation.
    citations:
      - PMID:39306708
      - PMID:41728618
  - claim_id: atopy-establishes-copathogenesis
    statement: >-
      Allergy, eosinophilia, and hyper-IgE are common in IgG4-RD, but their
      causal or co-pathogenic contribution remains unresolved.
    disposition: QUALIFIED
    report_quote: >-
      the Th2/atopic axis is a major contributor in a large patient subset.
    rationale: >-
      PMID:41912044 is a systematic review and meta-analysis of prevalence. Its
      abstract explicitly states that mechanistic connections and causality
      remain unclear and calls for controlled comparisons to establish whether
      the features are more prevalent than in other populations. Co-occurrence
      motivates stratified studies; it does not establish a competing driver
      or qualify CTL causality by itself.
    citations:
      - PMID:41912044
  - claim_id: isolated-aortitis-phlebitis-inference
    statement: >-
      An isolated thoracic-aortitis series cannot establish the mechanism of
      obliterative phlebitis within confirmed IgG4-RD.
    disposition: REJECTED
    report_quote: >-
      This demonstrates that IgG4+ plasma cell infiltration alone is
      insufficient for this pathognomonic feature.
    rationale: >-
      PMID:21036629 studied 11 patients with isolated thoracic aortitis; none
      had a history of IgG4-RD or developed it during follow-up. The authors
      concluded only that a subset "may represent" an aortic manifestation.
      IgG4-positive plasma cells outside confirmed IgG4-RD are not a
      counterfactual test of a plasma-cell-to-phlebitis edge in IgG4-RD.
      Moreover, the seed model does not claim that plasma-cell infiltration
      alone causes obliterative phlebitis.
    citations:
      - PMID:21036629
  - claim_id: sil2r-proximate-driver
    statement: >-
      Soluble IL-2 receptor is an activity biomarker and cannot establish that
      T cells, rather than antibodies, are the proximate tissue-injury driver.
    disposition: REJECTED
    report_quote: >-
      This biomarker evidence strongly supports T-cell activation, rather than
      antibody levels, as the proximate driver of tissue injury.
    rationale: >-
      PMID:29465360 and PMID:29251035 correlate sIL-2R with disease activity,
      organ count, treatment response, or treatment requirement.
      PMID:25437196 correlates sIL-2R with PET total lesion glycolysis in 17
      patients. None perturbs T-cell activity, measures tissue-injury mediation,
      or provides a fair mechanistic comparison with antibody effectors.
    citations:
      - PMID:29465360
      - PMID:29251035
      - PMID:25437196
  - claim_id: schema-status-recommendation
    statement: >-
      The model can remain CANONICAL while its unresolved edges are represented
      explicitly; CANONICAL-WITH-QUALIFICATIONS is not an available status.
    disposition: QUALIFIED
    report_quote: >-
      Change from CANONICAL to CANONICAL-WITH-QUALIFICATIONS or add qualifier
      flag.
    rationale: >-
      The report's substantive point is sound: canonical does not mean every
      causal edge is established. Its proposed replacement value is not part of
      the disease schema. The scalable curation response is to retain
      CANONICAL, use qualified causal-link types and evidence, and record the
      missing APC, fibroblast, vascular, and organ-tropism mechanisms as
      explicit knowledge gaps.

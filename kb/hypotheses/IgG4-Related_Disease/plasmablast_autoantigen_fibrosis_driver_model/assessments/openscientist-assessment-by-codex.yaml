hypothesis_id: plasmablast_autoantigen_fibrosis_driver_model
assessed_at: '2026-09-04T23:52:33.426487+00:00'
overall_verdict: PARTIALLY_SUPPORTED
summary: The adaptive cellular framework remains partially supported, with direct human-derived Tfh-to-B-cell
  and B-cell-to-fibroblast experiments strengthening components beyond the original report and prior assessment.
  B-lineage-to-CTL antigen presentation, CTL-specific fibroblast activation, organ tropism and obliterative
  phlebitis remain unresolved. The review corrects overinterpretation of clinical phenotype clusters,
  allergy prevalence, antibody isotypes, complement and biomarker correlations; distinguishes conditional
  mouse microbial amplification from human initiation; and adds omitted 2019 B-cell fibrosis experiments
  and the 2026 randomized nondepleting B-cell trial. Claims of exhaustive screening and generated figures
  remain unauditable. Both the report and its earlier assessment were reconciled against the expanded
  disease YAML.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: cellular-scaffold
  statement: The cellular scaffold has human association and functional Tfh-to-B-cell evidence, but not
    complete human causal mediation.
  disposition: QUALIFIED
  report_quote: The model's cellular components are robustly supported.
  rationale: PMID:24815737 and PMID:26971690 establish plasmablast and CTL repertoire/tissue/treatment-associated
    findings; PMID:38092138 adds independent single-cell and spatial evidence. The report Tfh citations
    PMID:29253269 and PMID:35568079 primarily establish association and localization. Independently retrieved
    PMID:27411315, PMID:28916523 and PMID:29781221 provide functional patient-derived Tfh/B-cell coculture
    evidence for plasmablast differentiation or IgG4 production. These strengthen the earlier assessment,
    whose association-only description was incomplete. Lesional and circulating subsets and culture conditions
    differ; functional capacity in vitro does not establish universal in-vivo necessity.
  citations:
  - PMID:24815737
  - PMID:26971690
  - PMID:29253269
  - PMID:35568079
  - PMID:38092138
  - PMID:27411315
  - PMID:28916523
  - PMID:29781221
- claim_id: b-lineage-therapeutic-dependence
  statement: B-cell depletion supplies strong indirect support for B-lineage involvement, without identifying
    the function that sustains disease.
  disposition: RETAINED
  report_quote: Rituximab responsiveness provides powerful indirect validation that B-cell lineage activity
    sustains the disease.
  rationale: The report appropriately labels this evidence indirect. In PMID:38781535, all 33 patients
    responded at six months and deeper depletion predicted fewer later relapses. PMID:26971690 associates
    rituximab-induced remission with reduced disease-associated CTLs. These observations support B-lineage
    centrality but do not distinguish antigen presentation from cytokine, costimulatory, or other B-lineage
    effects.
  citations:
  - PMID:38781535
  - PMID:26971690
- claim_id: missing-apc-and-fibroblast-edges
  statement: The reviewed sources do not isolate B-lineage antigen presentation to CTLs or a CTL-specific
    fibroblast response; a direct B-cell-to-fibroblast route is established in culture.
  disposition: RETAINED
  report_quote: No co-culture, blocking, or spatial transcriptomics study has directly demonstrated either
    the B-cell antigen-presentation step or the CD4 CTL-to-fibroblast activation step.
  rationale: PMID:27667138 calls continuous B-lineage antigen presentation "presumed." PMID:26971690 establishes
    CTL clonality and expression of IL-1beta and TGF-beta 1, not antigen-presenting-cell identity or fibroblast
    response. PMID:41766862 is a review that infers profibrotic activity from the available cellular evidence.
    These are the most consequential gaps in the integrated canonical chain. PMID:31319101, omitted by
    the report, directly shows patient B-cell/plasmablast stimulation of fibroblast collagen production
    and attenuation by PDGF-B blockade. This does not close the CTL-specific gap. The report search logs
    are absent, so a universal claim that no relevant study exists exceeds audited search coverage.
  citations:
  - PMID:27667138
  - PMID:26971690
  - PMID:41766862
  - PMID:31319101
- claim_id: pathogenic-autoantigen-count
  statement: Candidate autoantibody responses are documented, and anti-IL-1RA antibodies have functional
    in-vitro effects in a subset, but four broadly established pathogenic autoantigens have not been demonstrated.
  disposition: QUALIFIED
  report_quote: Pathogenic autoantibodies against four autoantigens have been identified
  rationale: In PMID:31612628, responses to PHB1, annexin A11, and laminin 511-E8 were infrequent and
    not significantly different from controls; broader autoreactivity correlated with severity, but causation
    was not tested. PMID:33974929 concerns a separate anti-IL-1RA specificity and shows neutralization
    plus inflammatory and fibrotic mediator production in vitro in a subset. The report conflates candidate
    autoreactivity, severity association, and functional pathogenicity.
  citations:
  - PMID:31612628
  - PMID:33974929
- claim_id: phenotype-immune-subset-mapping
  statement: Four organ-distribution phenotypes are replicated, but the report does not provide primary
    phenotype-matched evidence that each is driven by a distinct immune-cell subset.
  disposition: QUALIFIED
  report_quote: Critically, these phenotypes map to distinct dominant immune cell subsets
  rationale: PMID:30612117 derives and replicates four clinical latent classes but does not immunophenotype
    their lesions. PMID:39306708 is explicitly a review that proposes phenotype-specific immune-cell interpretations.
    The synthesis is a useful lead, not a high-confidence human mechanistic result, and it cannot establish
    that the full seed chain applies mainly to retroperitoneal fibrosis or aortitis.
  citations:
  - PMID:30612117
  - PMID:39306708
- claim_id: igg1-contradicts-seed
  statement: Possible IgG1-mediated injury does not contradict a seed model that assigns IgG4-positive
    plasmablasts a marker and sustaining role while assigning fibrogenic effector activity to CD4-positive
    CTLs.
  disposition: REJECTED
  report_quote: The seed hypothesis's implicit privileging of IgG4 as the primary pathogenic antibody
    is thus contradicted for a substantial patient subset.
  rationale: The seed description does not make the implied antibody-effector claim. PMID:39306708 is
    a review whose wording says Tfh1 and IgG1 "may be" important in an autoimmune phenotype; it is not
    primary evidence for a substantial IgG1-defined causal subset. PMID:41728618 is also a review and
    merely describes IgG4/IgG1 autoantibodies in organ-specific disease. IgG1 mechanisms remain a complementary
    lead, not a refutation.
  citations:
  - PMID:39306708
  - PMID:41728618
- claim_id: atopy-establishes-copathogenesis
  statement: Allergy, eosinophilia, and hyper-IgE are common in IgG4-RD, but their causal or co-pathogenic
    contribution remains unresolved.
  disposition: QUALIFIED
  report_quote: the Th2/atopic axis is a major contributor in a large patient subset.
  rationale: PMID:41912044 is a systematic review and meta-analysis of prevalence. Its abstract explicitly
    states that mechanistic connections and causality remain unclear and calls for controlled comparisons
    to establish whether the features are more prevalent than in other populations. Co-occurrence motivates
    stratified studies; it does not establish a competing driver or qualify CTL causality by itself.
  citations:
  - PMID:41912044
- claim_id: isolated-aortitis-phlebitis-inference
  statement: An isolated thoracic-aortitis series cannot establish the mechanism of obliterative phlebitis
    within confirmed IgG4-RD.
  disposition: REJECTED
  report_quote: This demonstrates that IgG4+ plasma cell infiltration alone is insufficient for this pathognomonic
    feature.
  rationale: PMID:21036629 studied 11 patients with isolated thoracic aortitis; none had a history of
    IgG4-RD or developed it during follow-up. The authors concluded only that a subset "may represent"
    an aortic manifestation. IgG4-positive plasma cells outside confirmed IgG4-RD are not a counterfactual
    test of a plasma-cell-to-phlebitis edge in IgG4-RD. Moreover, the seed model does not claim that plasma-cell
    infiltration alone causes obliterative phlebitis.
  citations:
  - PMID:21036629
- claim_id: sil2r-proximate-driver
  statement: Soluble IL-2 receptor is an activity biomarker and cannot establish that T cells, rather
    than antibodies, are the proximate tissue-injury driver.
  disposition: REJECTED
  report_quote: This biomarker evidence strongly supports T-cell activation, rather than antibody levels,
    as the proximate driver of tissue injury.
  rationale: PMID:29465360 and PMID:29251035 correlate sIL-2R with disease activity, organ count, treatment
    response, or treatment requirement. PMID:25437196 correlates sIL-2R with PET total lesion glycolysis
    in 17 patients. None perturbs T-cell activity, measures tissue-injury mediation, or provides a fair
    mechanistic comparison with antibody effectors.
  citations:
  - PMID:29465360
  - PMID:29251035
  - PMID:25437196
- claim_id: schema-status-recommendation
  statement: The model can remain CANONICAL while its unresolved edges are represented explicitly; CANONICAL-WITH-QUALIFICATIONS
    is not an available status.
  disposition: QUALIFIED
  report_quote: Change from CANONICAL to CANONICAL-WITH-QUALIFICATIONS or add qualifier flag.
  rationale: 'The report''s substantive point is sound: canonical does not mean every causal edge is established.
    Its proposed replacement value is not part of the disease schema. The scalable curation response is
    to retain CANONICAL, use qualified causal-link types and evidence, and record the missing APC, fibroblast,
    vascular, and organ-tropism mechanisms as explicit knowledge gaps.'
- claim_id: omitted-direct-b-fibrosis
  statement: Direct B-lineage profibrotic experiments provide a complementary route omitted from the purported
    complete model.
  disposition: QUALIFIED
  report_quote: fibroblast transition to myofibroblasts.
  rationale: PMID:31319101 used patient and control B cells with primary pancreatic/skin fibroblasts,
    transwells, sorted subsets and PDGF-B blocking. Patient cells induced more collagen; control B cells
    also had activity, and comparable PDGF-B levels imply additional factors. LOXL2 expression was not
    exclusive to IgG4-positive plasma cells. Fibroblast EMT-related gene enrichment is not epithelial
    fate conversion, and the assay does not reconstruct storiform architecture. The YAML now separates
    B-lineage signaling, fibroblast activation and storiform matrix remodeling.
  citations:
  - PMID:31319101
- claim_id: anti-il1ra-functional-scope
  statement: Anti-IL-1RA antibodies have functional activity in a subset, without proving IgG4-only pathogenicity.
  disposition: QUALIFIED
  report_quote: Pathogenic autoantibodies against four autoantigens have been identified
  rationale: The IL-1RA study expresses plasmablast-derived antibody, uses reporter assays and patient
    plasma with epithelial/fibroblast cultures, and measures inflammatory/profibrotic mediators. IgG4
    predominates in many positive samples but other subclasses occur; mixed plasma assays do not isolate
    purified IgG4 effects or prove human tissue fibrosis. Anti-IL-1RA is also observed in SLE/RA. A scoped
    functional node and cell model were added.
  citations:
  - PMID:33974929
- claim_id: panel-denominator-and-temporality
  statement: A negative four-antigen panel neither excludes autoreactivity nor dates its onset.
  disposition: QUALIFIED
  report_quote: 37%
  rationale: PMID:31612628 included 100 patients overall, but the complete four-antigen panel used 86;
    32/86 (37%) were positive and 12/86 (14%) had multiple reactivities. Frequencies for several antigens
    were low and not significantly different from controls. Cross-sectional severity associations cannot
    establish epitope spreading as a late event.
  citations:
  - PMID:31612628
- claim_id: isotype-transfer-precedent
  statement: IgG1-versus-IgG4 passive transfer has already been tested in a limited mouse system.
  disposition: QUALIFIED
  report_quote: Passive transfer of purified IgG1 vs. IgG4 fractions
  rationale: 'PMID:26964842 (2016) injected patient fractions into neonatal male BALB/c mice: both caused
    injury, IgG1 more strongly, and coadministered IgG4 reduced IgG1 injury. A humanized or phenotype-stratified
    follow-up is useful, but the experiment is not wholly novel and cannot assume IgG4 is universally
    inert or protective. The model records context-dependent isotype effects.'
  citations:
  - PMID:26964842
- claim_id: cholangiocyte-functional-specificity
  statement: Cholangiocyte experiments support protective machinery but do not establish pathogenicity
    of every candidate antibody.
  disposition: QUALIFIED
  report_quote: Pathogenic autoantibodies against four autoantigens have been identified
  rationale: PMID:34718050 uses ANXA11 knockdown and patient serum to show altered ANO1 trafficking and
    protection. PMID:38524667 shows laminin-knockdown and recombinant-laminin effects on bile-acid permeability/apoptosis,
    with 7/52 anti-laminin-positive patients. Gene knockdown is not equivalent to autoantibody neutralization.
    The YAML now represents this bounded biliary route.
  citations:
  - PMID:34718050
  - PMID:38524667
- claim_id: allergy-distinct-denominators
  statement: Allergy, eosinophilia and hyper-IgE pooled estimates have different denominators.
  disposition: QUALIFIED
  report_quote: Meta-analysis of 32 studies (n=8,233)
  rationale: PMID:41912044 gives allergy n=8233, eosinophilia n=4376 and hyper-IgE n=2353. Assigning all
    three estimates to 8233 patients is misleading; these prevalence estimates do not demonstrate Th2-mediated
    causal dominance. PMID:35568079 further distinguishes IL-10-positive LAG3-positive Tfh-rich IgG4-RD
    from IL-13-rich Kimura disease.
  citations:
  - PMID:41912044
  - PMID:35568079
- claim_id: phlebitis-anatomic-definition
  statement: Phlebitis is venous pathology and must not be conflated with arteritis.
  disposition: REJECTED
  report_quote: Obliterative phlebitis has been described in veins, arteries, pulmonary arteries, and
    aorta
  rationale: Arterial/aortic inflammation is a distinct lesion. The isolated thoracic-aortitis cohort
    does not establish IgG4-RD or a venous mechanism. The YAML keeps obliterative phlebitis as an organ-variable
    histopathological hallmark with an explicit causal gap; no unsupported CTL-to-vascular-obliteration
    arrow was added.
  citations:
  - PMID:21036629
  - PMID:22596100
- claim_id: sil2r-cohort-attribution
  statement: The cited soluble IL-2 receptor study is mischaracterized numerically.
  disposition: REJECTED
  report_quote: n=26+controls
  rationale: PMID:29465360 compared 43 IgG4-RD, 62 primary Sjogren and five sicca patients. The report
    n=26 label and quoted median 4667 versus 1515 pg/mL are not established by its cited abstract; supported
    correlations are retained without those values. sIL-2R is also an activity marker in Sjogren disease.
    PMID:29251035 normalization denominators and PMID:25437196 n=17 PET association cannot establish a
    proximate tissue-injury driver.
  citations:
  - PMID:29465360
  - PMID:29251035
  - PMID:25437196
- claim_id: complement-mixed-complexes
  statement: Mixed immune-complex activation does not establish an IgG4-only causal renal pathway.
  disposition: QUALIFIED
  report_quote: Immune complexes containing IgG4 and IgG1 can activate complement
  rationale: PMID:26357950 tests patient PEG-precipitated complexes with normal serum; classical and lectin-pathway
    consumption does not isolate antibody subclass. PMID:39798124 is a 70-person association study, with
    six cutaneous vasculitis cases and three skin biopsies, and anti-C1q did not predict relapse-free
    survival. Leukocytoclastic vasculitis is not obliterative phlebitis. The model adds complement activation
    and a complement readout, without declaring proven renal mediation.
  citations:
  - PMID:26357950
  - PMID:39798124
- claim_id: conditional-microbiota-transfer
  statement: Microbiota transfer amplifies induced mouse pancreatitis rather than independently transmitting
    human disease.
  disposition: QUALIFIED
  report_quote: fecal microbiota transplantation from AIP mice induced severe AIP in recipients
  rationale: Recipients also received low-dose 10-microgram poly(I:C), while donors received 100 micrograms.
    Barrier disruption and S. sciuri experiments also require the inducing context, and exacerbated pancreatitis
    but not sialadenitis. Human microbiome associations overlap systemic sclerosis and do not establish
    causal microbial specificity.
  citations:
  - PMID:31287532
  - PMID:36044992
  - PMID:33648559
- claim_id: marco-expression
  statement: MARCO upregulation identifies an associated cell program, not an initiating trigger.
  disposition: QUALIFIED
  report_quote: MARCO, a pattern-recognition receptor, was significantly upregulated
  rationale: PMID:26886650 expression and tissue-validation data do not perturb MARCO or establish human
    temporal ordering. MARCO is retained as a research lead rather than a causal initiating node.
  citations:
  - PMID:26886650
- claim_id: fibrosis-autonomy
  statement: Self-sustaining fibrosis remains a hypothesis rather than a proven human feedback cycle.
  disposition: QUALIFIED
  report_quote: establishes autonomous feedback loops
  rationale: PMID:41956965 is a review that proposes immune-stromal feedback; it does not demonstrate
    temporal autonomy after removal of immune input. The B-cell coculture supports one directed route,
    not a complete feedback cycle. The graph includes only the experimentally documented mouse pDC/T-cell
    return loop.
  citations:
  - PMID:41956965
  - PMID:31319101
  - PMID:39264798
- claim_id: updated-b-cell-trial
  statement: Nondepleting B-cell inhibition adds randomized evidence without isolating the canonical APC-to-CTL
    pathway.
  disposition: QUALIFIED
  report_quote: its therapeutic predictions are validated
  rationale: 'INDIGO PMID:42233621 was published June 2, 2026, before this June 4 report: 194 patients,
    obexelimab coengagement of CD19/Fc-gamma-RIIb without depletion, flare HR 0.44 with 26.8% versus 54.6%
    events. MITIGATE provides complementary CD19-depletion evidence and FDA adult approval followed in
    April 2025. Rilzabrutinib PMID:42481271 appeared after the report and is a small uncontrolled phase
    IIa study. The YAML distinguishes randomized efficacy, regulatory indication and preliminary activity.'
  citations:
  - PMID:42233621
  - PMID:39541094
  - PMID:42481271
- claim_id: exhaustive-search-provenance
  statement: Reported search counts and figure generation are not reproducible from committed evidence.
  disposition: NEEDS_VERIFICATION
  report_quote: 124 papers reviewed, 25 findings confirmed, 44 evidence items evaluated.
  rationale: Only 33 PMID links and four missing figure placeholders are available. The omitted direct
    B-fibroblast and phase III studies constrain an exhaustive-coverage claim. No original numerical analysis
    is reproducible; later assessor retrieval does not establish provider execution.
  analysis_ids:
  - literature-synthesis
- claim_id: experimental-controls
  statement: The proposed studies need controls that separate cell depletion, antigen presentation and
    tissue-stage confounding.
  disposition: QUALIFIED
  report_quote: Discriminating Tests
  rationale: Autologous B/CTL cocultures require viability, antigen-specificity, MHC-II, costimulation
    and cytokine controls. A positive coculture alone does not demonstrate in-vivo necessity. Spatial
    association does not date initiation; single-organ disease is not inherently early and multi-organ
    disease is not inherently late. Passive transfer must include pre-existing findings and evaluate species,
    Fc and isotype differences.
  citations:
  - PMID:26964842
  - PMID:31319101
  - PMID:39264798

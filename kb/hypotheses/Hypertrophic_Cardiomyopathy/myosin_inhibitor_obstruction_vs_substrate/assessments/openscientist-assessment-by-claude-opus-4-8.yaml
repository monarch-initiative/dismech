claims:
  - claim_id: obstruction-relief-dominant-ohcm
    statement: >-
      In obstructive HCM, the myosin inhibitors' symptomatic/functional benefit is
      chiefly load-dependent relief of LV outflow-tract obstruction, reversible on
      drug withdrawal.
    disposition: QUALIFIED
    report_quote: >-
      large, rapid, reversible LVOT-gradient reductions
    rationale: >-
      The best-supported part of the hypothesis and well argued from the
      obstructive-HCM trial set (EXPLORER/MAPLE/aficamten), with reversibility on
      withdrawal as the signature of a load effect. Qualified rather than retained
      because the supporting PMIDs are unverified leads (no reference validation
      in this run) and several are recent 2026 citations needing source-checking.
    citations:
      - PMID:42251960
      - PMID:42002189
      - PMID:42667283
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: odyssey-discriminating-prediction
    statement: >-
      The discriminating prediction holds: in non-obstructive HCM, where there is
      no gradient to relieve, the phase 3 ODYSSEY-HCM trial did not meet its
      primary endpoint.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      ODYSSEY-HCM trial did not meet its primary endpoint
    rationale: >-
      This is the load-bearing claim for the whole hypothesis, and it rests on a
      single review-level citation (PMID 40624601); the report itself flags that
      the ODYSSEY-HCM primary trial report was not retrievable through the search
      tool. No ACACIA-HCM citation appears anywhere -- notable because the
      2-iteration run's refutation of the hypothesis had hinged on ACACIA, which
      this fuller run did not reproduce. The non-obstructive evidence must be
      pinned to a verified primary source before any KB use.
    citations:
      - PMID:40624601
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: substrate-clause-overstated
    statement: >-
      The "rather than reversing the sarcomere substrate" clause is overstated: a
      gradient-independent sarcomere/energetics effect exists (non-obstructive
      biomarker gains; preclinical prevention of hypertrophy, disarray and
      fibrosis) and is not excluded.
    disposition: QUALIFIED
    report_quote: >-
      a genuine load-independent sarcomere/energetics component exists and is not excluded
    rationale: >-
      The report's central nuance and a fair one: the molecular target is
      gradient-independent, non-obstructive cohorts (MAVERICK/REDWOOD) show
      biomarker gains, and MYK-461 in MYH7-mutant mice prevented substrate
      pathology. Qualified because the human evidence is review-level and
      biomarker-only, the mouse result is prevention not reversal, and all PMIDs
      are unverified. It refines rather than confirms the seed, which is why the
      recommended status stays EMERGING.
    citations:
      - PMID:26912705
      - PMID:40000285
      - PMID:41841680
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: human-fibrosis-not-reversed
    statement: >-
      In humans, myosin inhibitors regress LV mass but the fibrotic substrate
      (LGE scar) does not clearly reverse.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      fibrotic substrate (LGE scar) does not clearly reverse
    rationale: >-
      Consistent with the CMR literature cited (mass regression with unclear or
      unchanged fibrosis), and it cuts against a strong substrate-reversal reading.
      Needs verification because the strongest serial-CMR evidence row is a single
      case (PMID 41877729), the mass-regression signal is itself partly
      load-mediated, and the PMIDs are unverified.
    citations:
      - PMID:42715826
      - PMID:41877729
    analysis_ids:
      - literature-evidence-synthesis
  - claim_id: keep-emerging-subtype-qualified
    statement: >-
      Curation recommendation: keep the hypothesis EMERGING and refine its label
      to a subtype-qualified form (obstruction-relief dominant for symptomatic
      benefit in obstructive HCM; a gradient-independent arm exists but has not
      translated to a positive non-obstructive clinical endpoint).
    disposition: RETAINED
    report_quote: >-
      Keep **EMERGING**, refine label to subtype-qualified
    rationale: >-
      The right call given the evidence state, and it matches the committed seed's
      own EMERGING status. Retained as a curation recommendation (not a disease
      claim); acting on it would be a label refinement on the existing hypothesis
      block, not a new mechanism assertion.
    citations: []

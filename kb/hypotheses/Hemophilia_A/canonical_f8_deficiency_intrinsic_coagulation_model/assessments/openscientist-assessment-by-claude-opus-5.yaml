hypothesis_id: canonical_f8_deficiency_intrinsic_coagulation_model
assessed_at: '2026-09-02T00:00:00Z'
overall_verdict: SUPPORTED
summary: >-
  The report's central mechanism (F8 loss of function, abolished FVIII cofactor
  activity in the intrinsic tenase complex, failed thrombin burst, bleeding
  diathesis) is well supported, and every consequential citation I checked
  against the cached abstracts says what the report says it says. The core
  thesis is nonetheless the KB seed restated, so its genuinely new contribution
  is the qualification layer: a verified TAFI/fibrinolysis second arm that
  explains joint bleeding tropism, verified genotype/phenotype discordance in
  severe disease, and verified downstream arthropathy and fracture burden. Three
  quantitative statements are looser than their sources support (SIPPET
  inhibitor hazard ratios whose confidence intervals both cross 1, a Cochrane
  pooled estimate attributed to all six included trials rather than the two it
  came from, and an LSEC-versus-hepatocyte exclusivity claim that its older
  cited paper does not make), and one diagnostic claim is contradicted by both
  papers cited for it: the report says the chromogenic FVIII assay correlates
  better with thrombin generation, whereas the cited study found the one-stage
  assay did. Retaining CANONICAL is correct.

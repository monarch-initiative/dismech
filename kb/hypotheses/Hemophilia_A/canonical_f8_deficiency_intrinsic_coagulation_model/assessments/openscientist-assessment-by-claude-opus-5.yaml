analyses:
- analysis_id: evidence_matrix_synthesis
  status: REPORTED_ONLY
  auditability: UNVERIFIABLE
  method: >-
    Narrative construction of a 33-row evidence matrix classifying each citation
    by evidence type, relationship to the hypothesis, mechanistic claim, key
    finding, context, and confidence.
  status_reason: >-
    The matrix is presented as report prose only. No code, input table, or
    output file is committed under the hypothesis directory, and no
    openscientist_artifacts bundle exists, so the classification cannot be
    audited or regenerated.
  limitations: >-
    Several matrix rows misgrade the evidence type of their source: PMID:41473775
    is a commentary rather than the human clinical study the matrix labels it,
    and PMID:41846404 is an assay-development study whose paradoxical-bleeder
    figure appears only in its introduction.
- analysis_id: causal_chain_and_figure_generation
  status: REPORTED_ONLY
  auditability: UNVERIFIABLE
  method: >-
    Assembly of a mechanistic causal chain with per-link evidence-strength
    annotation, plus four referenced figures (final_evidence_summary.png,
    expanded_causal_network.png, causal_chain_diagram.png, evidence_matrix.png,
    knowledge_gap_table.png).
  status_reason: >-
    The report embeds figure placeholders, but no image files, plotting code, or
    environment specification are committed anywhere beneath the hypothesis
    directory. Nothing establishes that the figures were produced as described.
  limitations: >-
    The evidence-strength labels (STRONG, MODERATE, inferred) on individual
    causal links are assessor-style judgments with no stated rubric.
claims:
- claim_id: fviii-cofactor-200000-fold-tenase-enhancement
  statement: >-
    FVIIIa assembled with FIXa on an activated platelet phospholipid surface
    raises the catalytic efficiency of factor X activation by roughly
    200,000-fold, making the intrinsic tenase complex effectively non-functional
    without FVIII.
  disposition: RETAINED
  report_quote: >-
    FVIIIa, when assembled with FIXa on an activated platelet phospholipid
    surface in the presence of calcium, increases the catalytic efficiency of FX
    activation by approximately 200,000-fold
  rationale: >-
    PMID:27208168 (Kristensen et al., Biochem J 2016) states verbatim in its
    abstract that "Within the Xase complex the substrate turnover by Factor IXa
    is enhanced 200000-fold". The paper attributes the enhancement to Xase
    complex assembly, of which FVIIIa is the obligate cofactor, so the report's
    attribution is a fair reading. PMID:16513527 independently states that
    factor VIIIa increases catalytic efficiency for factor Xa generation "by
    several orders of magnitude". This is the quantitative backbone of the
    hypothesis and is not currently cited in the disorder YAML.
  citations:
  - PMID:27208168
  - PMID:16513527
- claim_id: central-thesis-restates-kb-seed
  statement: >-
    The report's central mechanistic thesis, that F8 loss of function abolishes
    FVIII cofactor activity in intrinsic tenase and thereby the thrombin burst,
    is validated by five independent interventional approaches.
  disposition: QUALIFIED
  report_quote: >-
    The core claim — that loss-of-function variants in the F8 gene on Xq28
    abolish FVIII cofactor activity in the intrinsic tenase complex, disabling
    the thrombin burst and causing the bleeding diathesis — is validated by five
    independent interventional approaches that each restore hemostasis by
    correcting or bypassing the FVIII deficiency.
  rationale: >-
    The claim is true and the therapeutic evidence is real, but it is the seed
    hypothesis handed to the provider, so restating it produces no new support
    for the KB. Every element (FVIII replacement, emicizumab, gene therapy) is
    already curated as a treatment with target_mechanisms in the disorder entry.
    Retained as background, not as a new finding. The report's genuinely
    additive material is its qualification layer, assessed separately below.
  citations:
  - PMID:30157389
  - PMID:35294811
- claim_id: tafi-defective-activation-dual-bleeding-mechanism
  statement: >-
    Hemophilic bleeding has a second arm beyond insufficient fibrin formation:
    thrombin-dependent TAFI activation fails, permitting premature clot lysis,
    and impaired TAFIa generation tracks with a 3-fold to 4-fold higher bleeding
    rate in severe hemophilia A.
  disposition: RETAINED
  report_quote: >-
    In 61 severe HA patients, impaired TAFIa generation correlated with 3-4-fold
    higher bleeding rates
  rationale: >-
    PMID:31571361 studied exactly 61 severe hemophilia A patients and states
    that "Patients with markedly impaired TAFIa generation or TAFIa response
    (below median) displayed 3-fold to 4-fold higher bleeding rate and factor
    consumption". The number, the direction, the cohort size, and the disease
    all match. This is the report's most valuable addition: the disorder YAML
    mentions the TAFI arm only inside free-text hypothesis notes, with no
    pathophysiology node, no edge, and no citation. Note the human data are
    correlational.
  citations:
  - PMID:31571361
- claim_id: tafi-explains-joint-bleeding-tropism
  statement: >-
    Defective TAFI activation is the mechanism by which joint bleeding
    predominates in congenital hemophilia A but is rare in acquired hemophilia A
    despite comparable FVIII levels.
  disposition: RETAINED
  report_quote: >-
    Defective TAFI activation was identified as a major contributor to
    joint-specific bleeding in hemophilia A mice
  rationale: >-
    PMID:30026184 compared joint bleeding in anti-FVIII antibody-treated wild
    type mice against FVIII-null mice, found joint bleeding milder in the
    acquired model, showed that TAFI knockout abolished that difference, and
    reported "severely defective TAFI activation in FVIII-/- mice in vivo" with
    notable TAFI activation preserved in the acquired model. The report's
    characterization is accurate and the interventional evidence is
    model-organism only, which the report's own evidence matrix correctly labels.
    Human confirmation that correcting TAFI reduces joint bleeding does not
    exist, which is a genuine curation-relevant gap.
  citations:
  - PMID:30026184
  - PMID:27928886
- claim_id: severe-ha-paradoxically-mild-bleeders
  statement: >-
    More than 10 percent of severe hemophilia A patients bleed paradoxically
    mildly despite FVIII below 1 IU/dL.
  disposition: QUALIFIED
  report_quote: >-
    More than 10% of severe hemophilia A patients (FVIII <1 IU/dL) exhibit
    paradoxically mild bleeding phenotypes
  rationale: >-
    The sentence is a verbatim substring of the PMID:41846404 abstract, so the
    citation is not fabricated. But that paper is an assay-development study
    optimizing a FIXa-triggered thrombin generation assay, and the 10 percent
    figure appears only in its introduction as uncited background, not as its
    own result. Citable as a review-grade statement of the discordance; not
    citable as a measured incidence. The report presents it as an established
    quantity without that distinction.
  citations:
  - PMID:41846404
- claim_id: proc-variant-rebalances-hemostasis
  statement: >-
    A coinherited heterozygous PROC variant reducing protein C activity to
    roughly 53 to 58 percent attenuates bleeding severity in a patient with
    severe hemophilia A, demonstrating that coagulation balance rather than
    absolute FVIII level sets clinical severity.
  disposition: QUALIFIED
  report_quote: >-
    A case study documented a patient with severe HA and coinherited
    heterozygous PROC variant (p.Trp414Arg, resulting in protein C activity of
    53-58%) who displayed discordantly mild-to-moderate bleeding
  rationale: >-
    PMID:41791668 confirms every specific: the p.Trp414Arg variant, plasma
    protein C activity of 58 percent clotting-based and 53 percent chromogenic,
    and increased endogenous thrombin potential and peak height in
    protein-C-deficient versus protein-C-replete FVIII-deficient plasma. The
    paper's own conclusion is guarded, however: the variant "was predicted to
    attenuate bleeding severity", which is a single-patient inference plus an
    in vitro thrombin generation experiment, not a demonstrated causal modifier
    effect. The report's phrasing "can partially compensate" is stronger than
    n=1 supports.
  citations:
  - PMID:41791668
- claim_id: chromogenic-assay-better-reflects-coagulation-potential
  statement: >-
    The chromogenic FVIII assay correlates more closely with thrombin generation
    parameters than the one-stage assay and therefore better reflects true
    coagulation potential.
  disposition: REJECTED
  report_quote: >-
    The chromogenic assay correlates more closely with thrombin generation
    parameters, suggesting it better reflects true coagulation potential.
  rationale: >-
    Both papers the report cites for the surrounding assay-discrepancy passage
    contradict this. PMID:20148980 reports the opposite direction outright:
    "Analysis of the discrepant patient group showed the most significant
    correlation between the one-stage FVIII:C assay and ETP (r(2) = 0.44) and
    peak thrombin parameters (r(2) = 0.27)". PMID:33141777 found "No significant
    correlation was noted between the results of ISTH BAT with FVIII:C levels of
    each method", so it supports neither assay as the better phenotype
    predictor. The underlying discrepancy figures the report quotes (up to 40
    percent in mild hemophilia A; 68 percent discrepant and 38 percent
    reclassified in the Iranian cohort) are accurate; only this interpretive
    sentence is wrong, and it must not be curated.
  citations:
  - PMID:20148980
  - PMID:33141777
- claim_id: mutation-type-inhibitor-risk-magnitudes
  statement: >-
    Null F8 mutations carry a 2-fold higher inhibitor risk than non-null
    mutations, and antigen-negative mutations a 3.5-fold higher risk than
    antigen-positive mutations.
  disposition: QUALIFIED
  report_quote: >-
    null mutations (inversions, nonsense, large deletions) carry a 2-fold higher
    risk than non-null mutations, and antigen-negative mutations carry a 3.5-fold
    higher risk than antigen-positive mutations
  rationale: >-
    PMID:29399993 (SIPPET, 231 patients) does report those point estimates, but
    with hazard ratios of 2.08 (95% CI 0.84-5.17) and 3.61 (95% CI 0.89-14.74).
    Both confidence intervals cross 1, so neither association reached
    significance in that cohort. The report states the magnitudes as established
    without the intervals, which overstates them. The qualitative direction is
    consistent with PMID:18503540 and with the wider literature, so the claim is
    a usable lead rather than a curatable quantity.
  citations:
  - PMID:29399993
  - PMID:18503540
- claim_id: lsec-not-hepatocyte-fviii-synthesis
  statement: >-
    FVIII is primarily synthesized and secreted by liver sinusoidal endothelial
    cells rather than hepatocytes, which matters because current AAV gene
    therapy targets hepatocytes ectopically.
  disposition: QUALIFIED
  report_quote: >-
    FVIII is primarily synthesized and secreted by liver sinusoidal endothelial
    cells (LSECs), not hepatocytes
  rationale: >-
    PMID:33187005 does state that FVIII "is largely synthesized and secreted by
    the liver sinusoidal endothelial cells (LSECs)" and that the hepatocyte "is
    not the natural site for FVIII synthesis", so the claim has a source. The
    other paper cited alongside it does not support the exclusivity: PMID:10391893
    detected FVIII mRNA in both cell types and reports that "LSECs and
    hepatocytes contained comparable numbers of fVIII mRNA (40 and 70 transcripts
    per cell, respectively)". Its real contribution is that LSECs secreted active
    FVIII in culture, which is a positive finding about LSECs and not a negative
    one about hepatocytes. The report's proposed ontology binding CL:0019026 is
    absent from this repository's term caches and was not used.
  citations:
  - PMID:10391893
  - PMID:33187005
- claim_id: cochrane-prophylaxis-bleeding-reduction
  statement: >-
    A Cochrane review of six randomized trials showed FVIII prophylaxis reduced
    all bleeding by 70 percent and joint bleeding by 78 percent versus on-demand
    treatment.
  disposition: QUALIFIED
  report_quote: >-
    A Cochrane systematic review of 6 RCTs (142 participants) demonstrated that
    FVIII prophylaxis reduced all bleedings by 70% (rate ratio 0.30, 95% CI
    0.12-0.76) and joint bleedings by 78% (rate ratio 0.22, 95% CI 0.08-0.63)
    compared to on-demand treatment
  rationale: >-
    The rate ratios and intervals are exactly right, but the attribution is not.
    PMID:21901684 pooled those two ratios from only two of the six included
    studies, both in children, and the review covers hemophilia A or B rather
    than FVIII prophylaxis alone. Both intervals are wide and the review's own
    conclusion is limited to preserving joint function in children. The disorder
    entry already cites the ISTH guideline (PMID:39043543) for the stronger and
    better-scoped prophylaxis recommendation, so this adds little.
  citations:
  - PMID:21901684
- claim_id: apc-regulates-fviiia-in-vivo
  statement: >-
    Activated protein C inactivation of FVIIIa is a physiologically significant
    regulatory checkpoint, shown by an APC-resistant FVIII variant with roughly
    fivefold greater procoagulant function in hemophilia A mice.
  disposition: RETAINED
  report_quote: >-
    An APC-resistant FVIII variant (FVIII-R336Q/R562Q) demonstrated approximately
    5-fold increased procoagulant function relative to wild-type FVIII in
    hemophilia A mice
  rationale: >-
    PMID:33512448 states verbatim that "FVIII-QQ demonstrated approximately
    fivefold increased procoagulant function relative to FVIII-WT in the tail
    clip and ferric chloride injury models in hemophilia A (HA) mice", and that
    the advantage disappeared with the PC/APC inhibitory antibody mAb 1609,
    which is exactly the control the report describes. Model-organism evidence
    only, and the report's evidence matrix labels it correctly. I did not
    integrate it: it is a regulator of normal FVIIIa lifespan and a therapeutic
    design lead rather than a step in the hemophilia A causal chain.
  citations:
  - PMID:33512448
  - PMID:1939075
- claim_id: arthropathy-iron-mediated-dual-pathology
  statement: >-
    Hemophilic arthropathy proceeds through two parallel processes, iron-catalyzed
    oxidative damage causing chondrocyte apoptosis and hemosiderin-triggered
    synovial inflammation.
  disposition: RETAINED
  report_quote: >-
    Hemophilic arthropathy involves dual pathological processes: iron-catalyzed
    oxidative damage causing chondrocyte apoptosis, and hemosiderin-triggered
    synovial inflammation
  rationale: >-
    PMID:16684006 states that intra-articular blood "first has a direct effect on
    cartilage, as a result of the iron-catalysed formation of destructive oxygen
    metabolites (resulting in chondrocyte apoptosis), and subsequently affects
    the synovium, in addition to haemosiderin-induced synovial triggering", and
    that both processes occur in parallel. The disorder entry carries a
    Hemophilic Arthropathy phenotype describing the outcome but nothing about
    how blood in the joint destroys it, so this is a real gap the report fills.
  citations:
  - PMID:16684006
- claim_id: fracture-risk-4-56-fold
  statement: >-
    People with hemophilia carry a 4.56-fold increased fracture risk.
  disposition: QUALIFIED
  report_quote: >-
    Meta-analysis showed a 4.56-fold increased fracture risk in hemophilia (RR
    4.56, 95% CI 1.28-16.25, p=0.019), with severe hemophilia (aOR 1.72) and
    inhibitor status (aOR 2.42) as independent risk factors
  rationale: >-
    PMID:40099433 reports "RR 4.56, 95% CI 1.28-16.25, p = 0.019, I2 90.74%"
    exactly. Three caveats the report drops: the pooled estimate rests on four
    studies with 90.7 percent heterogeneity and a confidence interval spanning
    more than an order of magnitude, the population is hemophilia A and B
    combined rather than hemophilia A, and the review states there were
    insufficient data to stratify by severity or hemophilia type, which sits
    awkwardly beside the report's severity and inhibitor adjusted odds ratios.
    Usable as a qualified downstream burden statement, not as a hemophilia
    A-specific effect size.
  citations:
  - PMID:40099433
- claim_id: retain-canonical-status
  statement: >-
    The hypothesis should remain CANONICAL; the identified qualifications refine
    rather than diminish the model.
  disposition: RETAINED
  report_quote: >-
    The hypothesis status of **CANONICAL** is fully supported and should be
    maintained. No status change is recommended.
  rationale: >-
    Agreed, and this is what the report's own Candidate Status Assessment asks
    for, so no status: value was changed. Every therapeutic and genetic line of
    evidence converges on FVIII deficiency as the initiating lesion, and the
    rebalancing therapies and phenotypic modifiers act downstream of it rather
    than displacing it.
  citations:
  - PMID:33570646
  - PMID:41473775

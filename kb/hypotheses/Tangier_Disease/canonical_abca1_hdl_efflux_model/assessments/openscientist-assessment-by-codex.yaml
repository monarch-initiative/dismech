provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_abca1_hdl_efflux_model
assessed_at: '2026-09-04T22:46:21Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The canonical ABCA1 efflux mechanism is well supported, but the report is PARTIALLY_SUPPORTED because it overstates human pathway validation and search completeness, misstates an observational effect-size contrast, and misses pre-existing intervention and GenCC records. Retain source-qualified membrane inflammation, platelet and insulin-secretion findings; treat S1P, PMP22 and HSPC clinical mediation as unresolved. No provider computational analysis is reproducible from the available bundle.
claims:
- claim_id: canonical-efflux
  statement: ABCA1 loss causes Tangier disease through defective cellular lipid efflux.
  disposition: RETAINED
  report_quote: ABCA1 Is the Sole Causative Gene for Tangier Disease
  rationale: >-
    Independent family mapping and mutation studies, and bidirectional cellular perturbations, support the core mechanism. HDL biogenesis and tissue efflux are parallel cell-specific consequences; low plasma HDL alone is not the sole upstream cause of local storage.
  citations:
  - PMID:10431236
  - PMID:10431237
  - PMID:10431238
  - PMID:10525055
  - PMID:11309399
- claim_id: variant-functional-scope
  statement: The 74-variant screen validates domain-specific functional impairment.
  disposition: RETAINED
  report_quote: shifting 10 variants of uncertain significance to likely pathogenic or likely benign categories
  rationale: >-
    The 2025 study (not 2024 as in the report table) tested 74 intracellular-domain variants and reclassified ten. It supports functional interpretation for tested alleles, not complete genotype-to-organ-severity prediction.
  citations:
  - PMID:40617357
- claim_id: structure-interpretation
  statement: Cryo-EM definitively establishes the lateral-access export mechanism.
  disposition: QUALIFIED
  report_quote: Cryo-EM Structures Reveal Lateral-Access Lipid Export Mechanism
  rationale: >-
    The 2017 structure suggests a plausible lateral-access mechanism; it does not directly measure the complete transport cycle. The 2023 nanodisc study adds conformations and membrane curvature while acknowledging that the lipid-movement mechanism remains poorly understood.
  citations:
  - PMID:28602350
  - PMID:36889459
- claim_id: dmpc-inference
  statement: Failure of DMPC-treated Tangier plasma proves absolute dependence on functional cellular ABCA1.
  disposition: REJECTED
  report_quote: confirming the absolute dependence on functional ABCA1
  rationale: >-
    The manipulated material was plasma, with efflux tested using J774 macrophages. Tangier plasma lacks the normal apoA-I/HDL acceptor pool, so failure to improve efflux after DMPC does not isolate a defect in donor-cell ABCA1. The separate cAMP/glyburide experiments support an ABCA1 component; the absolute-dependence conclusion from patient plasma alone is invalid.
  citations:
  - PMID:15654121
  - PMID:11309399
- claim_id: vascular-compartment
  statement: Macrophage and whole-body knockout results explain different contributions to atherosclerosis.
  disposition: QUALIFIED
  report_quote: macrophage-specific ABCA1 knockout markedly increased it
  rationale: >-
    The bone-marrow transplantation experiments support a macrophage contribution in Apoe-null recipients; global Abca1 loss in Apoe/Ldlr backgrounds changes apoB lipoproteins and does not increase lesions. These are strong compartment-specific mouse findings, not a quantitative explanation of each Tangier patient’s cardiovascular risk.
  citations:
  - PMID:11950702
  - PMID:11696576
- claim_id: efflux-effect-size
  statement: The cohort shows a 67% risk reduction per standard deviation of efflux.
  disposition: REJECTED
  report_quote: 67% CVD risk reduction per SD efflux capacity
  rationale: >-
    Rohatgi et al. report an adjusted hazard ratio of 0.33 for highest versus lowest efflux-capacity quartile, not per standard deviation. The 2,924-person Dallas Heart Study is observational and not a Tangier cohort; association and discrimination do not prove that modifying efflux will cause the same risk reduction.
  citations:
  - PMID:25404125
- claim_id: hdl-causality
  statement: HDL quantity/function distinctions prove clinical pathway dominance in Tangier disease.
  disposition: QUALIFIED
  report_quote: cholesterol efflux capacity is the more relevant functional metric
  rationale: >-
    The distinction is useful, but common-population cohort associations and CETP trial/Mendelian-randomization reviews do not quantify the contribution of ABCA1 deficiency in biallelic Tangier patients. The cited 2026 source is a review, not a new Mendelian-randomization analysis.
  citations:
  - PMID:25404125
  - PMID:42142223
- claim_id: early-coronary-case
  statement: The 37-year-old coronary case provides unequivocal genotype-confirmed Tangier evidence.
  disposition: QUALIFIED
  report_quote: A 37-year-old TD patient with optimal LDL still had significant CAD
  rationale: >-
    The report accurately identifies severe low-HDL and angiographic disease, but the primary paper describes two ABCA1 variants of uncertain significance in trans and a clinical diagnosis considered most consistent with Tangier disease. This is not equivalent to molecular confirmation by two established pathogenic variants, nor a penetrance estimate.
  citations:
  - PMID:39691320
- claim_id: human-inflammasome
  statement: The complete NLRP3–NETosis causal axis is confirmed in Tangier patients.
  disposition: QUALIFIED
  report_quote: NLRP3 Inflammasome Activation and NETosis -- Confirmed in TD Patients
  rationale: >-
    Tangier plasma IL-1β/IL-18 elevations support inflammasome relevance. Nlrp3 or Caspase-1/11 deletion, plaque NETosis and anti-IL-1β intervention were tested in hyperlipidemic mice with combined Abca1/Abcg1 deficiency. The full pathway and therapeutic response were not demonstrated in Tangier patients; it is downstream of cholesterol accumulation, not biologically independent of the efflux defect.
  citations:
  - PMID:29588315
  - PMID:36537208
- claim_id: s1p-human-scope
  statement: S1P depletion and its quantitative clinical contribution were demonstrated in one patient.
  disposition: REJECTED
  report_quote: The quantitative contribution of S1P deficiency to clinical manifestations has been demonstrated in only one TD patient and liver-specific KO mice.
  rationale: >-
    The human observation is low total plasma sphingolipids in one compound heterozygote. Reduced apoM and S1P were demonstrated in liver-specific Abca1 knockout mice. Neither experiment quantifies mediation of human vascular or neurological disease by S1P; total sphingolipid depletion must not be substituted for a human S1P-specific result.
  citations:
  - PMID:37601634
- claim_id: neuropathy-ascertainment
  statement: Four neuropathy patterns characterize clinical heterogeneity.
  disposition: QUALIFIED
  report_quote: syringomyelia-like neuropathy (52.4%), multifocal sensorimotor neuropathy (26.2%), focal neuropathy (19.1%), and distal symmetric polyneuropathy (2.4%)
  rationale: >-
    These are literature-derived patterns among selected reported neuropathy cases, not an unselected 54-patient Tangier population. Syringomyelia-like denotes peripheral sensory/motor dysfunction and does not establish an anatomical spinal cord cavity. The literature includes demyelination and conduction block as well as axonal injury.
  citations:
  - PMID:29582519
  - PMID:31751110
- claim_id: pmp22-scope
  statement: Disrupted PMP22–ABCA1 interaction explains human Tangier neuropathy.
  disposition: QUALIFIED
  report_quote: PMP22-ABCA1 interaction linking TD neuropathy to Charcot-Marie-Tooth disease mechanisms
  rationale: >-
    The cited 2024/2026 articles are reviews. The primary 2019 experiments support co-immunoprecipitation and reciprocal trafficking abnormalities in mouse nerves and Schwann cells, including abnormal PMP22 processing in Abca1-null nerves. This is a useful tissue-specific mechanism, but human variant-specific binding disruption and its contribution to neuropathy severity remain unmeasured.
  citations:
  - PMID:38979632
  - PMID:41750400
  - PMID:31061090
- claim_id: hspc-context
  statement: HSPC expansion is a demonstrated feed-forward amplifier in Tangier disease.
  disposition: QUALIFIED
  report_quote: HSPC Myeloproliferation as a Feed-Forward Amplifier
  rationale: >-
    The cited study used rheumatoid-arthritis models with inflammation-driven downregulation of Apoe, Abca1 and Abcg1, and RA patient monocytes. It does not isolate biallelic ABCA1 loss in Tangier HSPCs. Retain as a proposed cross-disease mechanism rather than a clinical Tangier causal edge.
  citations:
  - PMID:29905812
- claim_id: platelet-granules
  statement: Tangier platelets have defective dense-body maturation and agonist-selective activation.
  disposition: QUALIFIED
  report_quote: Platelet Dense-Body Deficiency and Bleeding Tendency
  rationale: >-
    Patient platelet ultrastructure and assays support fewer dense bodies, giant granules and secretion defects. Responses to collagen/low thrombin were impaired, while ADP responses were preserved. A splenic-hematoma case supports bleeding relevance, but neither population frequency nor the entire lipid-to-granule biogenesis mechanism is established.
  citations:
  - PMID:15163665
  - PMID:19723515
- claim_id: beta-cell-context
  statement: Impaired insulin secretion follows ABCA1 dysfunction in some patients.
  disposition: QUALIFIED
  report_quote: Tangier Disease patients occasionally present with impaired insulin secretion from pancreatic beta cells
  rationale: >-
    A primary 2009 study, omitted by the report, tested four Japanese Tangier patients by OGTT and found reduced insulinogenic index. The 2024 study cited by the report tested ApoA-I receptor silencing in rat INS-1E cells and expression data from type 2 diabetes. These findings do not establish universal diabetes or directly measure cholesterol accumulation in human Tangier beta cells.
  citations:
  - PMID:19556721
  - PMID:39546458
  - PMID:31336517
- claim_id: carrier-infusion
  statement: Acute apoA-I/PC infusion establishes Tangier disease treatment efficacy.
  disposition: QUALIFIED
  report_quote: This provides direct therapeutic evidence that HDL replacement can reverse endothelial dysfunction caused by ABCA1 deficiency.
  rationale: >-
    The study involved nine heterozygous carriers and nine controls, with short-term forearm vasomotor endpoints. It supports acute physiology in carriers, not sustained efficacy, tissue-storage correction or prevention of coronary events in biallelic Tangier disease.
  citations:
  - PMID:12771001
- claim_id: common-allele
  statement: R230C population data validate the recessive disease model.
  disposition: QUALIFIED
  report_quote: independent population-scale validation of the dose-dependent relationship between ABCA1 function and HDL-C levels
  rationale: >-
    The common variant’s 27% efflux reduction and HDL association support ABCA1 function across populations; they do not establish R230C as a fully penetrant recessive Tangier allele or validate every distal disease branch. The Finnish resequencing study likewise supports aggregate rare-variant lipid associations rather than an organ-level Tangier mechanism.
  citations:
  - PMID:20418488
  - PMID:24497850
- claim_id: clinical-expression
  statement: Some biallelic carriers have only biochemical manifestations.
  disposition: RETAINED
  report_quote: two compound heterozygotes for ABCA1 mutations did NOT have overt clinical manifestations of TD
  rationale: >-
    The familial study reports two compound heterozygotes without overt manifestations and highlights ascertainment bias plus other lipid-gene defects in selected CAD cases. This supports variable clinical expression without negating the severe biochemical phenotype or measuring population penetrance.
  citations:
  - PMID:15019541
  - PMID:20070997
  - PMID:31751110
- claim_id: trial-absence
  statement: There were no interventional Tangier studies and only one therapeutic attempt.
  disposition: REJECTED
  report_quote: The only reported therapeutic attempt is miglustat in a single patient
  rationale: >-
    MUSTANG (PMID:41212481, online November 2025, before the May 2026 report) studied a second patient in a nonrandomized n-of-1 ABAB trial registered as ISRCTN17945917. The primary endpoints did not reach prespecified clinical-difference thresholds, although later extension and biomarker signals suggested possible benefit. ClinicalTrials.gov also lists NCT01782027, a terminated interventional tracer-method study including Tangier disease; it is not a therapeutic efficacy trial. The report’s zero-interventional-study assertion is false, while absence of a large randomized therapeutic trial remains a narrower, reasonable gap.
  citations:
  - PMID:25227739
  - PMID:41212481
- claim_id: trial-discrimination
  statement: An anti-IL-1β pilot cleanly discriminates inflammation from lipid-storage causality.
  disposition: QUALIFIED
  report_quote: Would discriminate between cholesterol storage and inflammasome activation as drivers of atherosclerosis progression in TD.
  rationale: >-
    Inflammasome activation is downstream of lipid accumulation, so reducing inflammation would demonstrate an intervening contribution rather than refute the upstream storage model. An uncontrolled short pilot using inflammatory markers or carotid thickness cannot establish pathway dominance; exposure, target engagement, lipid burden, comparator design and sufficient vascular follow-up are needed.
  citations:
  - PMID:29588315
  - PMID:36537208
- claim_id: search-provenance
  statement: The 134-paper investigation demonstrates exhaustive negative evidence.
  disposition: QUALIFIED
  report_quote: Over five iterations of systematic investigation, we reviewed 134 papers
  rationale: >-
    The committed report and 35-item citation sidecar do not include query logs, a screened 134-record corpus, data files, code, or the figure artifacts referenced by placeholders. Literature numbers are cited study results, not provider analyses. Missed pre-existing MUSTANG and GenCC records show that absence claims cannot be treated as exhaustive.
  citations:
  - PMID:41212481
- claim_id: gencc-absence
  statement: No GenCC gene–disease validity classification exists for ABCA1–Tangier disease.
  disposition: REJECTED
  report_quote: No GenCC or ClinGen gene-disease validity classification for ABCA1-Tangier Disease was identified during the search.
  rationale: >-
    The primary GenCC gene page, checked 2026-09-04, includes G2P Definitive (evaluated 2017, submitted July 2025), Labcorp Strong (evaluated April 2023, submitted November 2023), and other Tangier assertions predating the run. A GenCC submission is not synonymous with a ClinGen expert-panel curation; absence of the latter cannot establish absence of the former.
  citations:
  - https://thegencc.org/genes/HGNC%3A29
  - https://search.clinicalgenome.org/kb/genes/HGNC%3A29/groups

analyses:
  - analysis_id: openscientist-evidence-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Iterative literature retrieval and narrative synthesis producing 16
      numbered findings, a 24-row evidence matrix, an ASCII causal chain with
      per-edge strength labels, seven knowledge gaps, five alternative models
      and a curation-lead list.
    comparison: Seed hypothesis versus retrieved literature.
    input_data_source_ids:
      - openscientist-pubmed-sweep
    status_reason: >-
      No search log, screening record, scoring rubric or artifact bundle was
      committed, so neither the 134-paper denominator nor the per-edge strength
      grades (STRONG, MODERATE, EMERGING) can be reproduced or audited. The
      individual citations are checkable and were checked; the synthesis
      procedure that produced the grades is not.
    limitations: >-
      The report embeds five figure artifacts by placeholder
      (causal_chain_diagram.png, evidence_matrix.png,
      evidence_landscape_summary.png, knowledge_gaps_table.png,
      alternative_models_comparison.png). None exists: the hypothesis directory
      contains only openscientist.md and its citations sidecar, and there is no
      openscientist_artifacts/ bundle. The declared provenance outputs of this
      run are therefore missing.
  - analysis_id: openscientist-negative-searches
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Targeted searches for evidence against the seed model: ABCA1 mutations
      with preserved HDL, Tangier-like phenotypes without ABCA1 mutations,
      ABCA1 gain-of-function variants conferring cardiovascular protection,
      interventional trials in Tangier disease, and ClinGen or GenCC
      gene-disease validity records.
    comparison: Presence versus absence of refuting or curating records.
    input_data_source_ids:
      - openscientist-pubmed-sweep
      - clinicaltrials-gov
      - clingen-gene-disease-validity
      - gencc
    status_reason: >-
      Every one of these searches is reported as returning zero results, and
      each is stated in prose without a query string, execution date, database
      version or committed response. A documented negative search would be
      gradable as SEARCHED_NO_RESULT; these are not, so the report's headline
      "no refuting evidence" conclusion rests on an unauditable absence.
    limitations: >-
      The report acknowledges publication bias as a competing explanation for
      the null result. Only the ClinGen limb could be corroborated
      independently by the assessor, and only for the release pinned in this
      repository.
claims:
  - claim_id: canonical-efflux-storage-chain
    statement: >-
      Biallelic ABCA1 loss of function impairs apolipoprotein-mediated
      phospholipid and cholesterol efflux, blocks nascent HDL formation, and
      produces cellular cholesteryl ester storage with reticuloendothelial,
      neurologic, biochemical and vascular manifestations.
    disposition: RETAINED
    report_quote: >-
      The core causal chain — biallelic ABCA1 loss-of-function variants →
      impaired apolipoprotein-mediated phospholipid and cholesterol efflux →
      blocked nascent HDL formation → cellular cholesteryl ester storage →
      reticuloendothelial, neurologic, biochemical, and vascular manifestations
      — is firmly established.
    rationale: >-
      Retained, but this is the KB seed restated rather than a new provider
      result: the identical chain is the seed hypothesis description supplied to
      the run. It is nonetheless corroborated by independent sources the seed did
      not cite and that I checked in references_cache. PMID:10431238 identifies
      ABCA1 as the Tangier locus, PMID:40617357 shows cholesterol efflux
      activity across 74 intracellular-domain variants tracking pathogenicity,
      PMID:20418488 gives a dose-response at population scale, and PMID:11950702
      confirms macrophage cholesterol ester accumulation on ABCA1 loss. The KB
      entry already carries all four.
    citations:
      - PMID:10431238
      - PMID:40617357
      - PMID:20418488
      - PMID:11950702
  - claim_id: sole-causative-gene-no-refutation
    statement: >-
      Systematic searching found no evidence refuting ABCA1 as the sole
      causative gene for Tangier disease.
    disposition: QUALIFIED
    report_quote: >-
      No published evidence was found that refutes ABCA1 as the sole causative
      gene for Tangier Disease, despite systematic literature searches across
      134 papers.
    rationale: >-
      The conclusion is very likely correct and matches the KB, but it is an
      argument from absence built on a search nobody can repeat. No query
      strings, dates, databases, screening criteria or result counts were
      committed, and the 134-paper denominator is unsupported. The report itself
      concedes publication bias as a competing explanation in its Limitations
      section. Qualify to "no refuting evidence was surfaced by an undocumented
      search", which is a weaker statement than the one made.
  - claim_id: td-patient-inflammasome-activation
    statement: >-
      People with Tangier disease show markers of NLRP3 inflammasome activation,
      making inflammatory amplification a human-confirmed layer of the
      mechanism rather than a mouse-only inference.
    disposition: RETAINED
    report_quote: >-
      Tangier Disease patients showed markers of inflammasome activation
    rationale: >-
      Verified against the cached abstract of PMID:29588315, which states that
      patients with Tangier disease carrying ABCA1 loss-of-function mutations
      and increased myeloid cholesterol content showed a marked increase in
      plasma IL-1beta and IL-18 levels, and concludes that this suggests human
      relevance. This is a case-control human observation in the correct
      disease, in the stated direction. It is the report's single strongest
      distinctive contribution.
    citations:
      - PMID:29588315
  - claim_id: inflammasome-netosis-axis-strength
    statement: >-
      The NLRP3 inflammasome to IL-1beta to NETosis to atherosclerosis axis is
      established in Tangier disease at STRONG confidence.
    disposition: QUALIFIED
    report_quote: >-
      Macrophage (but not neutrophil) Abca1/g1 deficiency drove inflammasome
      activation and NETosis via IL-1beta secretion; IL-1beta neutralizing
      antibody suppressed NETosis
    rationale: >-
      The description of PMID:36537208 is accurate: macrophage-specific but not
      neutrophil-specific Abca1/g1 deletion activated inflammasomes and induced
      plaque NETosis, and an IL-1beta neutralizing antibody suppressed it. The
      overreach is the promotion of the whole axis to a Tangier claim. That
      model is a combined Abca1 and Abcg1 double knockout in Ldlr-null mice, not
      isolated ABCA1 loss, and the human Tangier data are plasma IL-1beta and
      IL-18 concentrations, not NETosis, plaque neutrophils or lesion size.
      Retain the inflammasome node with human evidence; keep the NETosis and
      atherosclerosis-acceleration limbs labelled as murine.
    citations:
      - PMID:36537208
      - PMID:29588315
  - claim_id: efflux-capacity-per-sd-risk
    statement: >-
      Cholesterol efflux capacity is associated with a 67% reduction in
      cardiovascular risk per standard deviation, independent of HDL-C.
    disposition: REJECTED
    report_quote: >-
      67% CVD risk reduction per SD efflux capacity, independent of HDL-C
    rationale: >-
      Misquantified. PMID:25404125 (Dallas Heart Study, 2924 adults, median 9.4
      years) reports a 67% reduction in cardiovascular risk in the highest
      quartile of cholesterol efflux capacity versus the lowest quartile
      (hazard ratio 0.33, 95% CI 0.19 to 0.55) in a fully adjusted model. That
      is an extreme-quartile contrast, not a per-standard-deviation effect, and
      restating it per SD materially inflates the implied effect size. The
      qualitative point the report is making — that efflux capacity, not HDL-C
      concentration, tracks risk — is supported by the same abstract, which
      found HDL-C level itself unassociated with events (hazard ratio 1.08).
      Separately, this is a general-population cohort, so it does not establish
      anything about risk in Tangier disease.
    citations:
      - PMID:25404125
  - claim_id: hepatic-abca1-dominant-hdl-source
    statement: >-
      Hepatocyte ABCA1 is established as the dominant source of plasma HDL.
    disposition: QUALIFIED
    report_quote: >-
      hepatocyte-specific ABCA1 knockout mice retain only 20% of wild-type
      HDL-cholesterol, establishing the liver as the dominant source of plasma
      HDL
    rationale: >-
      The 20% figure is correct for Abca1 hepatocyte-specific knockout mice in
      PMID:37601634, but the source says the result suggests a major
      contribution of hepatic ABCA1 to the HDL phenotype. "Establishing the
      dominant source" is a stronger verb than the cited paper uses, and the
      observation is murine. Qualify to a mouse-derived estimate of hepatic
      contribution.
    citations:
      - PMID:37601634
  - claim_id: s1p-parallel-signaling-mechanism
    statement: >-
      Loss of HDL-carried sphingosine-1-phosphate is a parallel mechanism
      contributing independently to the vascular and neurological
      manifestations of Tangier disease.
    disposition: QUALIFIED
    report_quote: >-
      This finding reveals a mechanistic dimension -- signaling lipid depletion
      -- that is distinct from cholesterol efflux impairment and may contribute
      independently to the vascular and neurological manifestations of TD.
    rationale: >-
      The human limb and the S1P limb are different experiments and the report
      merges them. PMID:37601634 reports a drastic reduction of total
      sphingolipids in the plasma of one Tangier patient with compound
      heterozygous ABCA1 mutations; S1P and apoM specifically were reduced in
      Abca1 hepatocyte-specific knockout mice, not measured in that patient. So
      no S1P value has been reported for any person with Tangier disease. The
      onward inference to vascular and neurological manifestations is provider
      inference with no supporting measurement in either species. Keep as an
      open knowledge gap rather than a mechanism node.
    citations:
      - PMID:37601634
  - claim_id: pmp22-abca1-neuropathy-mechanism
    statement: >-
      Disruption of a PMP22-ABCA1 interaction in Schwann cells explains why
      peripheral neuropathy is prominent in Tangier disease.
    disposition: QUALIFIED
    report_quote: >-
      This molecular link provides a mechanistic explanation for why neuropathy
      is such a prominent feature of TD and suggests ABCA1 as a therapeutic
      target for peripheral myelin repair across multiple disease contexts.
    rationale: >-
      PMID:38979632 is a Biochemical Society Transactions review about PMP22 in
      Charcot-Marie-Tooth disease. Its own framing is "this review explores
      emerging evidence" and "we examine roles for interactions between PMP22
      and ABCA1 in cholesterol efflux"; it reports no Tangier patient data and
      no ABCA1-null Schwann cell experiment. PMID:41750400, the second citation,
      is likewise a 2026 review that states ABCA1's role has not been
      investigated broadly in peripheral nerves. The direction of evidence runs
      from PMP22 mutations causing cholesterol mislocalization, which is the CMT
      case, not from ABCA1 loss. Qualify to a cross-disease lead.
    citations:
      - PMID:38979632
      - PMID:41750400
  - claim_id: hspc-myeloproliferation-in-td
    statement: >-
      ABCA1 deficiency in haematopoietic stem and progenitor cells drives
      myeloid expansion that amplifies foam cell burden in Tangier disease.
    disposition: QUALIFIED
    report_quote: >-
      In Tangier Disease, this mechanism could amplify foam cell burden by
      expanding the precursor pool of monocytes destined to become tissue
      macrophages.
    rationale: >-
      PMID:29905812 studies two mouse models of rheumatoid arthritis. There,
      systemic inflammation is the upstream cause and downregulation of Apoe,
      Abca1 and Abcg1 is a downstream consequence associated with HSPC
      cholesterol accumulation and expansion. Germline biallelic ABCA1 loss is a
      different starting point with a different causal ordering, and the paper
      contains no Tangier data. The report is candid about this in its
      Alternative Models section, calling the model speculative for Tangier
      disease, but Finding 15 and the Executive Judgment list it among the eight
      qualifications without that caveat. This is a human-model-mismatch gap,
      not a mechanism.
    citations:
      - PMID:29905812
  - claim_id: platelet-dense-body-deficiency
    statement: >-
      Tangier platelets show reduced dense bodies, giant granules and impaired
      activation, caused by ABCA1's role in intracellular membrane cholesterol
      distribution affecting granule biogenesis.
    disposition: QUALIFIED
    report_quote: >-
      This platelet phenotype is likely caused by ABCA1's role in intracellular
      membrane cholesterol distribution affecting granule biogenesis.
    rationale: >-
      The observation is solid and checks out in PMID:15163665: fibrinogen
      binding and CD62 surface expression in response to collagen and low
      thrombin concentrations were defective in Tangier platelets, electron
      microscopy showed reduced dense bodies and Chediak-Higashi-like giant
      granules, and the authors conclude that intact ABCA1 is necessary for
      proper dense-body maturation. The appended mechanism is the problem: the
      same abstract reports that collagen-induced changes in phosphatidylserine
      and cholesterol distribution were unaltered in Tangier platelets, which
      is the opposite of what the report proposes. Retain the finding, drop the
      mechanism.
    citations:
      - PMID:15163665
  - claim_id: mouse-phenocopy-attribution
    statement: >-
      ABCA1-deficient mice phenocopy human Tangier disease with severe HDL
      deficiency, xanthomatosis and foam cell accumulation, per PMID:12615679.
    disposition: QUALIFIED
    report_quote: >-
      ABCA1-deficient mice phenocopy the human disease with severe HDL
      deficiency, xanthomatosis, and foam cell accumulation
    rationale: >-
      The phenocopy claim is right but the citation is carrying descriptors it
      does not contain. The cached PMID:12615679 abstract says only that the
      ABCA1-deficient mouse phenotype parallels human Tangier disease, including
      substantial reductions in apolipoprotein B and apolipoprotein AI. The
      xanthomatosis and foam cell observations belong to PMID:11950702, which
      describes severe skin xanthomatosis with marked foamy macrophages and
      cholesterol ester accumulation in ABCA1-null apoE-null and Ldlr-null mice.
      Cite the second paper for those two descriptors.
    citations:
      - PMID:12615679
      - PMID:11950702
  - claim_id: no-clingen-or-gencc-curation
    statement: >-
      No ClinGen or GenCC gene-disease validity classification exists for
      ABCA1-Tangier disease.
    disposition: RETAINED
    report_quote: >-
      No GenCC or ClinGen gene-disease validity classification for ABCA1-Tangier
      Disease was identified during the search.
    rationale: >-
      Corroborated for the ClinGen limb against this repository's pinned
      snapshot of the ClinGen Gene-Disease Validity CSV
      (cache/clingen/gene_validity.csv, 2026-08-13 per
      data/clingen/MANIFEST.yaml): the file contains ABCA3 and ABCA4 assertions
      and no row for ABCA1 (hgnc:29) or Tangier disease. The GenCC limb is not
      independently checkable here because GenCC is not ingested by this
      repository. Note the report reached the right answer by the wrong route,
      saying only that a literature search was run rather than that the registry
      was queried.
  - claim_id: candidate-ontology-term-curies
    statement: >-
      The candidate ontology CURIEs offered for curation are correct as
      CURIE-label pairs.
    disposition: REJECTED
    report_quote: >-
      GO:0042632 (cholesterol homeostasis), GO:0006954 (inflammatory response),
      GO:0097530 (NLRP3 inflammasome complex assembly)
    rationale: >-
      GO:0097530 is granulocyte migration, not NLRP3 inflammasome complex
      assembly; the correct CURIE is GO:0044546, which is already cached in this
      repository. In the same list, CL:0000556 is offered as
      "megakaryocyte/platelet" but is megakaryocyte only, and platelet is
      CL:0000233. GO:0034375, offered for high-density lipoprotein particle
      remodeling, is not in this repository's caches and was not used. The
      remaining suggestions (GO:0033344, GO:0042632, GO:0006954, CL:0000235,
      CL:0002573, CL:0000169, CL:0000037) resolve correctly. This is the
      expected failure mode for report-suggested CURIEs and is exactly why the
      repository requires them to be re-derived from the caches rather than
      copied.
  - claim_id: declared-figure-artifacts-absent
    statement: >-
      The run produced the five figure artifacts the report embeds as
      provenance.
    disposition: REJECTED
    report_quote: >-
      {{figure:causal_chain_diagram.png|caption=Mechanistic causal chain from
      biallelic ABCA1 mutations through intermediate molecular events to
      clinical manifestations of Tangier Disease. Green nodes indicate
      well-established links; yellow indicates emerging evidence; red indicates
      knowledge gaps.}}
    rationale: >-
      Five figure placeholders appear in the report (causal_chain_diagram.png,
      evidence_matrix.png, evidence_landscape_summary.png,
      knowledge_gaps_table.png, alternative_models_comparison.png). The
      hypothesis directory contains only openscientist.md and
      openscientist.md.citations.md; there is no openscientist_artifacts/
      directory and no image files anywhere beneath it. The report's own prompt
      calls these artifacts "important provenance for hypothesis-level review",
      so their absence is a provenance defect, not a cosmetic one. No artifact
      paths are declared in this assessment as a result.
  - claim_id: candidate-status-and-sub-hypotheses
    statement: >-
      The hypothesis should stay CANONICAL, and the eight qualifications should
      be split out into three new sub-hypotheses.
    disposition: QUALIFIED
    report_quote: >-
      Create sub-hypotheses for (a) inflammasome-mediated vascular pathology,
      (b) S1P-mediated signaling deficiency, (c) PMP22-dependent neuropathy
      mechanism
    rationale: >-
      Retaining CANONICAL is right and the KB already does so. Creating three
      sub-hypotheses is premature on this evidence. Of the three, only the
      inflammasome arm has a human Tangier observation behind it, and that is a
      single case-control plasma cytokine measurement; the S1P arm has no human
      S1P measurement at all and the PMP22 arm rests on two reviews about
      Charcot-Marie-Tooth disease. A mechanistic_hypotheses entry asserts a
      competing or complementary model of the disease, which none of these has
      earned yet. The right home is a pathophysiology node with human evidence
      for the inflammasome arm and discussions entries for the other two.

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_abca1_hdl_efflux_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The seed mechanism is sound and the report does not overturn it: biallelic
  ABCA1 loss of function impairs apolipoprotein-mediated lipid efflux, blocks
  nascent HDL assembly, and produces cholesteryl ester storage with
  reticuloendothelial, neurologic and vascular disease. That chain, however, is
  the KB seed restated, so the report's own contribution is the set of eight
  "mechanistic qualifications" it says the canonical model is missing, and those
  are uneven. One is well supported in humans: Tangier patients have raised
  plasma IL-1beta and IL-18, which I confirmed in PMID:29588315. The rest
  degrade on source review. The S1P arm rests on a single Tangier patient whose
  S1P was never measured; S1P and apoM were reduced only in liver-specific
  knockout mice. The PMP22-ABCA1 neuropathy mechanism comes from a PMP22 review
  written about Charcot-Marie-Tooth disease that frames the ABCA1 interaction as
  emerging, with no Tangier or ABCA1-null Schwann cell data behind it. The HSPC
  myeloproliferation arm is a rheumatoid-arthritis mouse model in which systemic
  inflammation downregulates efflux genes, which is not germline ABCA1 loss. The
  platelet arm reports a real ultrastructural finding but attaches a mechanism
  the cited paper specifically measured and found unaltered. One quantitative
  claim is wrong: PMID:25404125 reports a 67% risk reduction for the highest
  versus lowest efflux-capacity quartile, not per standard deviation. Two
  candidate ontology CURIEs are misassigned. The report also declares five
  figure artifacts that were never committed, and its zero-result searches carry
  no query strings, dates or logs, so its central "no refuting evidence"
  conclusion cannot be audited. Its Gap 7 claim of absent ClinGen curation does
  check out against this repository's pinned ClinGen snapshot.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

hypothesis_id: canonical_th1_effector_polarization
assessed_at: "2026-07-31T03:29:57Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report supports retaining a canonical IFN-gamma/Th1 effector arm, while
  correctly recognizing that it is neither exclusive nor sufficient for the
  entire disease trajectory. Small human gastric-clone studies and several
  murine perturbations provide a credible core. The report nevertheless calls
  partial antibody prevention "abolition," conflicts with a second model in
  which IFN-gamma is dispensable for initiation, generalizes mouse
  epithelial-death and cell-source findings to humans, describes IL-13 as
  independent despite evidence that metaplasia is absent without upstream
  IFN-gamma-associated atrophy, and overinterprets separate PA-GWAS and
  healthy-donor PTPN22 studies as a direct genetic wiring result. It also
  proposes an unrelated apoptosis GO term. Several of these interpretations
  have already propagated into the disease YAML.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: human-th1-clones
    statement: >-
      Gastric H+/K+-ATPase-reactive CD4 clones from small human AIG studies
      frequently had Th1 and cytotoxic phenotypes.
    disposition: RETAINED
    report_quote: >-
      human gastric H+/K+-ATPase-reactive CD4+ T cell clones are overwhelmingly
      Th1-polarized and cytotoxic
    rationale: >-
      PMID:11159878 and PMID:15763992 directly support a predominantly Th1,
      IFN-gamma-producing and cytotoxic phenotype among the sampled clones.
      "Overwhelmingly" should remain scoped to these selected clonal studies;
      they do not quantify all gastric effectors or establish population-wide
      dominance with modern single-cell sampling.
    citations:
      - PMID:11159878
      - PMID:15763992
  - claim_id: ifng-initiation-necessity
    statement: IFN-gamma is universally required to initiate autoimmune gastritis.
    disposition: QUALIFIED
    report_quote: >-
      Anti-IFN-γ monoclonal antibody treatment abolished autoimmune gastritis
      initiation in the neonatal thymectomy (NTx) BALB/c model.
    rationale: >-
      PMID:8766575 provides strong model-specific loss-of-function evidence,
      but incidence fell from 69% to 16% rather than to zero. In a different
      transfer setting, PMID:22777705 found that IFN-gamma-deficient T cells
      could still initiate mild disease. The evidence supports a major,
      context-dependent early role, not universal necessity or literal
      abolition.
    citations:
      - PMID:8766575
      - PMID:22777705
  - claim_id: cooperative-severe-disease
    statement: >-
      IFN-gamma and IL-17 cooperate in progression to severe late-stage disease
      in a polyclonal murine model.
    disposition: RETAINED
    report_quote: >-
      while T cells deficient in either IFN-γ or IL-17 could still initiate mild
      AIG, both cytokines were required for progression to severe disease with
      significant tissue disruption
    rationale: >-
      This accurately captures PMID:22777705 and appropriately refutes an
      exclusive Th1 account. It should remain explicitly restricted to that
      experimental system rather than becoming a universal human
      co-requirement.
    citations:
      - PMID:22777705
  - claim_id: dominant-ifng-source
    statement: CD8 T cells are the dominant IFN-gamma source in human AIG.
    disposition: QUALIFIED
    report_quote: >-
      CD8+ T cells — not CD4+ Th1 cells — are the dominant IFN-γ source
    rationale: >-
      PMID:22777705 supports this in the polyclonal neonatal-thymectomy mouse
      model. The report later acknowledges that comparative human CD4-versus-CD8
      source data are absent. The source assignment therefore qualifies the
      model, not the human disease mechanism.
    citations:
      - PMID:22777705
  - claim_id: direct-epithelial-cytotoxicity
    statement: >-
      IFN-gamma can directly injure gastric epithelium and is required for
      atrophy/metaplasia in the TxA23 mouse system.
    disposition: QUALIFIED
    report_quote: >-
      This establishes IFN-γ as a direct epithelial cytotoxin responsible for
      the atrophic phase.
    rationale: >-
      PMID:30511397 directly exposed murine gastric organoids to IFN-gamma and
      used TxA23 Ifng-deficient mice, providing strong evidence in that model.
      It does not isolate human parietal-cell killing in vivo or establish
      IFN-gamma as the sole cause of human atrophy.
    citations:
      - PMID:30511397
  - claim_id: il13-independence
    statement: IL-13 drives gastric metaplasia independently of IFN-gamma-mediated disease.
    disposition: QUALIFIED
    report_quote: >-
      IL-13 independently drives metaplasia
    rationale: >-
      PMID:34587523 strongly supports direct IL-13/IL-4R-alpha signaling as a
      required metaplastic arm in TxA23 mice and organoids. However,
      PMID:30511397 found neither atrophy nor metaplasia in TxA23
      Ifng-deficient mice. IL-13 is a mechanistically separable downstream
      requirement, but independence from IFN-gamma-associated atrophy across
      the full disease trajectory has not been established.
    citations:
      - PMID:34587523
      - PMID:30511397
  - claim_id: ptpn22-th1-wiring
    statement: >-
      A pernicious-anemia PTPN22 risk allele directly wires affected patients
      toward Th1 rather than Th17 gastric autoimmunity.
    disposition: REJECTED
    report_quote: >-
      This genetic evidence directly connects a pernicious anemia risk allele
      to the Th1/IFN-γ axis, providing human genetic support for the hypothesis.
    rationale: >-
      PMID:34145262 associates the PTPN22 region with pernicious anemia, while
      PMID:23333624 reports Th1/Th17 effects of W620 in genotyped donors rather
      than AIG or PA patients. Joining these studies yields a plausible
      hypothesis, not direct evidence about gastric immune polarization.
      Moreover, the report gives rs6679677 p=1.91×10^-10, whereas the GWAS
      reports p=1.91×10^-24.
    citations:
      - PMID:34145262
      - PMID:23333624
  - claim_id: nk-exclusion
    statement: Negative NK-depletion data rule out all innate IFN-gamma sources.
    disposition: REJECTED
    report_quote: >-
      This rules out innate IFN-γ sources and confirms that T cells are the
      necessary IFN-γ producers for disease initiation
    rationale: >-
      PMID:11905844 showed that the tested NK-cell depletion did not reduce AIG
      incidence in one neonatal-thymectomy model. A null depletion result for
      NK cells does not assay or exclude every innate IFN-gamma-producing cell,
      prove depletion at every relevant time and site, or identify which T-cell
      subset is necessary.
    citations:
      - PMID:11905844
  - claim_id: hpylori-de-novo-trigger
    statement: H. pylori cross-reactive Th1 cells demonstrate de novo initiation of AIG.
    disposition: QUALIFIED
    report_quote: >-
      This provides a mechanism by which H. pylori infection could trigger de
      novo Th1-polarized autoimmunity through molecular mimicry
    rationale: >-
      The modal "could" is appropriate. PMID:14568977 establishes
      cross-reactivity in selected infected patients, not temporal de novo
      initiation, population attributable risk, or persistent autoimmunity
      after eradication.
    citations:
      - PMID:14568977
  - claim_id: apoptosis-ontology-term
    statement: GO:0010656 denotes epithelial cell apoptotic process.
    disposition: REJECTED
    report_quote: >-
      epithelial cell apoptotic process (GO:0010656)
    rationale: >-
      GO:0010656 is negative regulation of muscle cell apoptotic process. The
      report's Th1 differentiation and type II interferon signaling identifiers
      are correctly labeled, but this apoptosis candidate must not be curated
      under the stated label.
  - claim_id: human-longitudinal-gap
    statement: >-
      Human studies have not established which effector population dominates
      over the AIG disease course.
    disposition: RETAINED
    report_quote: >-
      All human immune data are cross-sectional snapshots.
    rationale: >-
      This is the decisive limitation on claims of human Th1, CD8, Th17, or
      Th2 dominance and on stage-specific therapeutic proposals. Small clonal
      studies support a real Th1 arm but do not resolve temporal or
      population-level composition.

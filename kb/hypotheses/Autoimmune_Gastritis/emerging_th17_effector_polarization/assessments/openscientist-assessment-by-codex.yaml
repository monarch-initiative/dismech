hypothesis_id: emerging_th17_effector_polarization
assessed_at: "2026-07-31T03:29:57Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report supports retaining an emerging Th17 contribution: a small human
  study found H+/K+-ATPase-responsive gastric IL-17 production, and
  antigen-specific Th17 transfer can cause severe gastritis in mice. It does
  not establish Th17 dominance or the terminal human tissue-damage mechanism.
  The report's central revision is not adequately supported because it
  generalizes protective IL-17RA effects from H. pylori infection models to
  sterile AIG, mislabels H. pylori-specific antibodies as autoantibodies,
  elevates an untested IL-21 bridge into the likely AIG effector, and treats
  anti-IL-17 therapy as contraindicated without any AIG treatment data. STAT3
  perturbation is promising but pleiotropic and model-specific. The proposed
  ontology block contains errors in its cell, process, and disease identifiers.
  The strongest overclaims have already propagated into the disease YAML and
  require a separate evidence-curation correction.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: human-atpase-th17-response
    statement: >-
      H+/K+-ATPase-responsive gastric cells produced IL-17A and IL-17F in a
      small human AIG study.
    disposition: QUALIFIED
    report_quote: >-
      The universality of the response (100% of patients tested) and the
      specificity for the disease-relevant autoantigen make this the strongest
      single piece of evidence for the hypothesis.
    rationale: >-
      PMID:35911678 directly supports antigen-responsive proliferation and
      IL-17A/F production, but the gastric LPMC experiment included only eight
      AIG patients and four healthy controls. "All tested" is accurate;
      "universality" is not a population estimate, and the cross-sectional
      experiment does not establish causal tissue injury or disease-stage
      dominance.
    citations:
      - PMID:35911678
  - claim_id: intrinsic-factor-profile
    statement: >-
      Ninety-four percent of intrinsic-factor-specific gastric clones were
      either Th17 or Th1, demonstrating a mixed inflammatory compartment.
    disposition: QUALIFIED
    report_quote: >-
      In pernicious anemia, intrinsic-factor-specific gastric CD4 clones are
      predominantly Th17/Th1 (Th17-skewed)
    rationale: >-
      PMID:31080562 reports a combined "Th17 or Th1" percentage. That result
      supports involvement of both profiles but does not show that Th17
      outnumbers Th1 or that pernicious anemia is Th17-skewed/dominant. The
      clones also produced TNF-alpha and IL-21, reinforcing a mixed rather than
      exclusive interpretation.
    citations:
      - PMID:31080562
  - claim_id: th17-transfer-sufficiency
    statement: >-
      Antigen-specific, in-vitro-polarized Th17 cells can cause severe
      gastritis after transfer into immunodeficient mice.
    disposition: RETAINED
    report_quote: >-
      Th17 cells induced the most destructive disease
    rationale: >-
      PMID:18641328 supports this comparison among engineered Th1, Th2, and
      Th17 transfer conditions. It establishes sufficiency and distinct
      pathology in that model, not spontaneous Th17 initiation, prevalence in
      humans, or dominance over other arms in intact polyclonal immunity.
    citations:
      - PMID:18641328
  - claim_id: stat3-th17-specificity
    statement: >-
      STAT3 knockout and STA-21 prove that a Th17-specific STAT3 pathway drives
      AIG and is a justified human therapeutic target.
    disposition: QUALIFIED
    report_quote: >-
      This provides proof-of-concept for targeting the upstream STAT3 pathway
      rather than IL-17 directly
    rationale: >-
      PMID:40471463 supports reduced TxA23 pathology, lower Th17 abundance, and
      higher Treg abundance after genetic or pharmacologic STAT3 perturbation.
      STAT3 affects many immune and epithelial programs, so the experiment does
      not establish Th17 mediation or isolate IL-21. The study did not assess
      long-term safety, and it does not justify the report's proposed human
      pilot without substantial preclinical and clinical development.
    citations:
      - PMID:40471463
  - claim_id: il17ra-aig-generalization
    statement: >-
      Epithelial IL-17RA signaling is protective in AIG and directly refutes
      IL-17-mediated parietal-cell injury.
    disposition: REJECTED
    report_quote: >-
      This directly refutes any claim that IL-17 signaling through IL-17RA
      drives parietal cell apoptosis
    rationale: >-
      PMID:38639570 studied GI-epithelial Il17ra deletion during H. pylori
      infection, not sterile autoimmune gastritis, parietal-cell-specific
      deletion, or apoptosis. IL-17RA also transduces multiple IL-17-family
      ligands. The result challenges a simple epithelial-cytotoxic model and is
      a reason to test context dependence, but it does not directly refute the
      AIG edge.
    citations:
      - PMID:38639570
  - claim_id: hpylori-antibody-misclassification
    statement: IL-17RA loss increases AIG autoantibody production.
    disposition: REJECTED
    report_quote: >-
      IL-17RA loss increases B cell/autoantibody responses
    rationale: >-
      PMID:19812196 examined H. pylori-infected Il17ra-deficient mice and
      reported enhanced H. pylori-specific serum antibody responses, not
      autoantibodies against H+/K+-ATPase or intrinsic factor. PMID:38639570
      similarly measured an infection-associated Tfh/B-cell axis. These
      infection findings cannot be relabeled as AIG autoantibody evidence.
    citations:
      - PMID:19812196
      - PMID:38639570
  - claim_id: il21-causal-reframing
    statement: >-
      Th17 cells cause AIG mainly through IL-21-driven B-cell differentiation
      and pathogenic autoantibodies.
    disposition: REJECTED
    report_quote: >-
      the pathogenic Th17-derived mediator may be **IL-21**, which directly
      promotes B cell differentiation, class-switching, and autoantibody
      production.
    rationale: >-
      A small human study found serum IL-21 elevation and
      intrinsic-factor-specific clones can produce IL-21, but no IL-21
      perturbation has been performed in AIG. The report's proposed bridge
      depends on misclassified H. pylori-specific antibodies and assumes
      autoantibodies are the principal destructive effector. The report itself
      later acknowledges that the IL-21 mechanism lacks direct confirmation.
    citations:
      - PMID:35911678
      - PMID:31080562
      - PMID:19812196
  - claim_id: anti-il17-contraindication
    statement: Existing evidence contraindicates anti-IL-17 treatment in AIG.
    disposition: REJECTED
    report_quote: >-
      the therapeutic implication of anti-IL-17 blockade is contraindicated
    rationale: >-
      No human anti-IL-17 AIG study is cited, and no AIG animal experiment in
      the report compares IL-17 blockade with control. Protective signaling in
      H. pylori infection and a gastric-cancer context raises a legitimate
      safety question but cannot establish an AIG contraindication or predict
      net treatment effect.
    citations:
      - PMID:38639570
      - PMID:19812196
  - claim_id: autoantibody-pathogenicity
    statement: Anti-parietal-cell and anti-intrinsic-factor antibodies are central destructive effectors in AIG.
    disposition: QUALIFIED
    report_quote: >-
      Since autoantibodies (anti-parietal cell, anti-intrinsic factor) are
      central to AIG pathogenesis
    rationale: >-
      These antibodies are clinically important markers, and
      anti-intrinsic-factor antibodies can impair vitamin B12 absorption.
      Direct parietal-cell destruction is primarily supported as T-cell
      mediated, and the report elsewhere acknowledges that the pathogenic role
      of autoantibodies remains unclear. They cannot supply the assumed
      terminal mechanism for the proposed IL-21 pathway.
  - claim_id: ontology-identifiers
    statement: The report's candidate ontology identifiers resolve to their assigned labels.
    disposition: REJECTED
    report_quote: >-
      gastric parietal cell (CL:0000163), regulatory T cell (CL:0000815)
    rationale: >-
      CL:0000163 is endocrine cell; parietal cell is CL:0000162. In the same
      candidate block, GO:0032623 is interleukin-2 production, not
      interleukin-21 production; MONDO:0010156 is Troyer syndrome, not
      autoimmune gastritis; and MONDO:0001061 is pylorus cancer, not pernicious
      anemia. The current terms used elsewhere in the KB include MONDO:0031014
      for autoimmune gastritis and MONDO:0008228 for pernicious anemia.
  - claim_id: unresolved-human-dominance
    statement: >-
      Which effector arm dominates human AIG and whether dominance changes with
      stage remain unresolved.
    disposition: RETAINED
    report_quote: >-
      which effector arm dominates at different disease stages is unresolved
    rationale: >-
      This is the key limitation that preserves EMERGING status. The human
      evidence is cross-sectional and small, while the strongest perturbations
      use engineered mouse systems. No longitudinal human tissue study or
      AIG-specific IL-17/IL-21 intervention resolves dominance or mediation.

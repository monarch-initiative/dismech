source_report: ../openscientist.md
hypothesis_id: alternative_hpylori_molecular_mimicry_origin
assessed_at: "2026-07-31T03:29:57Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report correctly identifies a plausible H. pylori-associated subset and
  preserves the decisive absence of prospective human evidence for the full
  infection-to-cross-reactivity-to-persistent-autoimmunity sequence. Direct
  gastric CD4 T-cell cross-reactivity and an uncontrolled eradication cohort
  support plausibility and early H. pylori dependence, but they do not prove
  initiation, epitope spreading, or a self-perpetuating "hit-and-run" phase.
  The synthesis materially overstates what the 80% healing result implies,
  misreads multiplex serology as showing up to 79% without prior exposure,
  infers genetic confounding from an MR study that did not test that question,
  and supplies several incorrect ontology identifiers. Some of these
  overclaims have already propagated into the disease YAML and need a separate
  evidence-curation correction.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: cellular-cross-reactivity
    statement: >-
      H. pylori-reactive gastric CD4 T cells can cross-recognize gastric
      H+/K+-ATPase in a selected human gastric-autoimmunity context.
    disposition: QUALIFIED
    report_quote: >-
      Cross-reactive T cells exist in human AIG
    rationale: >-
      PMID:14568977 directly identified gastric CD4 clones reactive to both
      H+/K+-ATPase and nine H. pylori epitopes. This is important mechanistic
      plausibility, but it comes from a small, selected setting and does not
      establish temporal initiation, an attributable fraction, or independent
      replication of the cross-reactive repertoire.
    citations:
      - PMID:14568977
  - claim_id: eradication-reversibility
    statement: >-
      Eradication was followed by resolution of active non-atrophic corpus
      gastritis in 64 of 80 selected patients.
    disposition: QUALIFIED
    report_quote: >-
      early-stage (non-atrophic) autoimmune gastritis can be healed by H. pylori
      eradication in 80% of cases
    rationale: >-
      PMID:11549834 was a retrospective, uncontrolled study restricted to
      active, not-yet-atrophic disease. It supports an H. pylori-dependent early
      phenotype in that cohort. It does not show that eradication prevents AIG,
      define an autoimmune point of no return, or demonstrate persistence after
      bacterial clearance.
    citations:
      - PMID:11549834
  - claim_id: hit-and-run-inference
    statement: >-
      Early reversibility after eradication supports a later
      self-perpetuating hit-and-run phase.
    disposition: REJECTED
    report_quote: >-
      The "hit-and-run" concept—where the infection triggers autoimmunity that
      persists after bacterial clearance—is supported by the Müller/Stolte
      eradication data showing early-stage reversibility, implying a
      time-dependent window.
    rationale: >-
      Reversibility while infection is present does not demonstrate the
      report's distinctive persistence edge after clearance. The report itself
      correctly notes that epitope spreading and post-clearance
      self-perpetuation lack direct human evidence. Case reports of diagnostic
      evolution after eradication cannot establish the initiating cause.
    citations:
      - PMID:11549834
      - PMID:40769905
      - PMID:38072907
  - claim_id: humoral-mimicry
    statement: >-
      The available absorption studies do not support H. pylori molecular
      mimicry as the source of human gastric autoantibodies.
    disposition: RETAINED
    report_quote: >-
      contradictory evidence that human autoantibodies are NOT generated
      through molecular mimicry
    rationale: >-
      PMID:10738313, PMID:11815766, and PMID:10077749 support this qualification
      of the humoral arm. These studies do not refute the separate cellular
      cross-reactivity finding and should not be generalized beyond the
      populations and antibody assays tested.
    citations:
      - PMID:10738313
      - PMID:11815766
      - PMID:10077749
  - claim_id: hpylori-naive-range
    statement: Between 29% and 79% of AIG patients have no evidence of prior H. pylori exposure.
    disposition: REJECTED
    report_quote: >-
      a substantial proportion of AIG patients (29–79%) have no evidence of
      prior H. pylori exposure
    rationale: >-
      In PMID:41484031, 29.3% of 75 AAG cases had no reactivity to any of 13
      H. pylori antigens. The study's 21.1% figure was the proportion meeting a
      stringent positive cutoff of reactivity to more than three antigens; its
      complement is not equivalent to "no evidence." The report's other basis,
      "Pacheco et al. 2025," is not given a PMID, bibliographic entry, or
      traceable citation in the report or citation sidecar.
    citations:
      - PMID:41484031
  - claim_id: arioso-subgroup
    statement: >-
      H. pylori-naive AIG has stronger familial and autoimmune associations
      than previously exposed AIG in a large tertiary cohort.
    disposition: QUALIFIED
    report_quote: >-
      H. pylori-naive AIG as a distinct clinical entity with stronger
      familial/genetic autoimmune signatures
    rationale: >-
      PMID:38976374 supports differences in family history, type 1 diabetes,
      and pernicious anemia in a retrospective tertiary-center cohort of 1,598
      patients. It does not demonstrate a genetically distinct entity, measure
      initiation, or prove that the groups have separate etiologies.
    citations:
      - PMID:38976374
  - claim_id: shared-genetic-confounding
    statement: >-
      Mendelian-randomization evidence shows shared autoimmune genetics
      confound the H. pylori-AIG association.
    disposition: REJECTED
    report_quote: >-
      This implies that autoimmune-susceptibility genes may independently
      increase both Hp infection risk (via altered gastric immunity) and AIG
      risk, creating a confounded association that mimics causation.
    rationale: >-
      PMID:41425574 synthesized MR analyses relating autoimmune thyroid disease
      to pernicious anemia and H. pylori infection. It did not test shared
      variants, H. pylori as an exposure for AIG, or mediation/confounding of
      the H. pylori-AIG association. The proposed explanation is a hypothesis,
      not a result of that study.
    citations:
      - PMID:41425574
  - claim_id: refractory-infection-misclassification
    statement: >-
      Urease-positive non-H. pylori organisms can confound testing in selected
      AIG patients referred for repeated eradication failure.
    disposition: QUALIFIED
    report_quote: >-
      some Hp-AIG associations may be inflated by diagnostic
      misclassification
    rationale: >-
      PMID:29920721 found AIG in a selected group with repeated eradication
      failure and documented non-H. pylori urease-positive organisms. This is a
      valid diagnostic warning, but the referral series cannot quantify bias in
      the wider epidemiologic literature.
    citations:
      - PMID:29920721
  - claim_id: aig-gwas-gap
    statement: No genome-wide association study relevant to autoimmune gastritis exists.
    disposition: REJECTED
    report_quote: No GWAS for AIG Specifically
    rationale: >-
      The exact phenotype boundary matters, but PMID:34145262 was a large
      pernicious-anemia GWAS meta-analysis with 2,166 cases and 659,516 controls
      that identified five risk loci. A report centered on AIG and its
      pernicious-anemia stage should acknowledge this adjacent genetic evidence
      rather than state the literature gap categorically.
    citations:
      - PMID:34145262
  - claim_id: ontology-identifiers
    statement: The report's candidate CL and MONDO identifiers resolve to the labels it assigns.
    disposition: REJECTED
    report_quote: >-
      Disease: `MONDO:0007093` (autoimmune gastritis), `MONDO:0008223`
      (pernicious anemia)
    rationale: >-
      Current ontology lookup resolves MONDO:0007093 to
      hypomaturation-hypoplastic amelogenesis imperfecta with taurodontism and
      MONDO:0008223 to hypokalemic periodic paralysis. The same candidate block
      maps CL:0002086 to regulatory T cell, but it resolves to specialized
      cardiac myocyte. The disease YAML already uses MONDO:0031014 for
      autoimmune gastritis, while MONDO:0008228 is the current pernicious-anemia
      term. Candidate identifiers require independent lookup before curation.
  - claim_id: prospective-causal-gap
    statement: >-
      Prospective human evidence for the complete H. pylori-to-persistent-AIG
      sequence is absent.
    disposition: RETAINED
    report_quote: >-
      the key intermediate causal steps (epitope spreading, self-perpetuation
      after H. pylori clearance) lack direct experimental evidence in humans.
    rationale: >-
      This is the decisive calibration for the overall verdict. Cross-sectional
      cross-reactivity, association cohorts, eradication response, and case
      reports each cover only part of the proposed chain.

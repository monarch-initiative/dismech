schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_primary_autoimmune_hk_atpase_origin
assessed_at: "2026-07-31T03:29:57Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report properly separates the strongly supported H+/K+-ATPase-specific
  CD4 effector mechanism from the unresolved initiating origin. Murine
  perturbations establish important central- and peripheral-tolerance
  mechanisms, but the report repeatedly promotes model sufficiency, isolated
  case reports, and a progression cohort into proof of initiating pathways and
  self-sustaining human autoimmunity. It also calls one engineered TCR
  specificity necessary when the experiment establishes sufficiency only,
  overstates a dominant human ATP4B T-cell repertoire, combines distinct
  genetic studies as one AIG architecture, and proposes mislabeled GO terms.
  Several of these stronger interpretations have already entered the disease
  YAML and require a separate evidence-curation correction.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-effector-mechanism
    statement: >-
      H+/K+-ATPase-specific CD4 T cells are a well-supported effector mechanism
      for parietal-cell destruction.
    disposition: RETAINED
    report_quote: >-
      The **effector mechanism** — CD4+ T cells recognizing the H+/K+ ATPase
      heterodimer mediating parietal cell destruction — is robustly established
    rationale: >-
      Concordant TCR-transgenic, neonatal-thymectomy, transfer, and human
      gastric-clone studies support the antigen-specific CD4 effector arm. This
      does not determine which upstream event initiates sporadic human disease
      or require that one polarization state dominates every case.
    citations:
      - PMID:11449363
      - PMID:8759770
      - PMID:15763992
  - claim_id: alpha-thymic-tolerance
    statement: >-
      ATP4A thymic mRNA expression alone does not guarantee negative selection
      of pathogenic ATP4A-reactive T cells in mice.
    disposition: RETAINED
    report_quote: >-
      thymic H/Kα mRNA expression in wild-type mice — or even in mice that
      overexpressed H/Kα — did not result in negative selection of pathogenic
      anti-H/Kα T cells.
    rationale: >-
      PMID:16237067 directly supports this mechanistic qualification. It also
      showed that engineered H/K-beta coexpression can restore antigen
      trafficking and deletion, so the result is a specific antigen-processing
      mechanism in mice rather than evidence that central tolerance is
      generally irrelevant.
    citations:
      - PMID:16237067
  - claim_id: beta-dominant-human-repertoire
    statement: >-
      ATP4B is the dominant surviving autoreactive T-cell specificity in both
      mice and humans because it is absent from the thymus.
    disposition: QUALIFIED
    report_quote: >-
      the beta subunit's complete absence from the thymus leaves beta-reactive T
      cells as the primary autoreactive repertoire.
    rationale: >-
      PMID:8393475 strongly supports ATP4B as a critical T-cell target in the
      neonatal-thymectomy mouse model because transgenic thymic expression
      prevented disease. PMID:16214318 reviews the murine tolerance model. A
      consensus description of ATP4B as a main human autoantigen does not
      directly demonstrate that ATP4B-specific T cells dominate the surviving
      human repertoire or precede ATP4A reactivity.
    citations:
      - PMID:8393475
      - PMID:16214318
      - PMID:41198445
  - claim_id: single-tcr-necessity
    statement: >-
      One ATP4A-specific CD4 TCR is both necessary and sufficient for autoimmune
      gastritis.
    disposition: REJECTED
    report_quote: >-
      These models establish that a single CD4+ TCR specificity targeting H/K
      ATPase is both necessary and sufficient for autoimmune gastritis.
    rationale: >-
      The TxA23 model in PMID:11449363 establishes sufficiency of an engineered,
      abundant autoreactive specificity: the transgenic mice developed disease
      and small transfers caused gastritis in immunocompromised recipients.
      Neither that experiment nor detection of ATPase-reactive cells in another
      model removes the specificity to test necessity. Other effector and
      tolerance models also produce gastritis through different engineered
      routes.
    citations:
      - PMID:11449363
      - PMID:8759770
  - claim_id: hpylori-trigger-proof
    statement: >-
      Cross-reactivity and post-eradication case reports prove H. pylori
      initiates a self-sustaining human autoimmune process.
    disposition: REJECTED
    report_quote: >-
      proving the autoimmune process becomes self-sustaining once initiated.
    rationale: >-
      PMID:14568977 supports cellular cross-reactivity, while PMID:40769905 and
      PMID:38072907 describe diagnostic evolution in a few patients after
      eradication. These observations do not establish that H. pylori was the
      initiating cause, measure epitope spreading, or distinguish persistence
      from pre-existing or evolving AIG.
    citations:
      - PMID:14568977
      - PMID:40769905
      - PMID:38072907
  - claim_id: checkpoint-initiation
    statement: >-
      Immune-checkpoint inhibition is proof of concept that peripheral
      tolerance disruption can cause severe gastric immune injury, but it does
      not define initiation of sporadic AIG.
    disposition: QUALIFIED
    report_quote: >-
      These cases demonstrate that pharmacological disruption of peripheral
      immune checkpoints, without any central tolerance defect, is sufficient
      to initiate autoimmune gastritis
    rationale: >-
      The deeply phenotyped nivolumab citation, PMID:34755133, is a single case
      of immune-checkpoint-inhibitor-associated gastritis. It supports an
      iatrogenic peripheral-tolerance mechanism but cannot establish absence of
      host predisposition, equivalence to canonical AIG, or the initiating
      mechanism of untreated sporadic disease.
    citations:
      - PMID:34755133
  - claim_id: roseolovirus-scope
    statement: >-
      Neonatal murine roseolovirus can perturb thymic tolerance and cause adult
      autoimmune gastritis in mice.
    disposition: QUALIFIED
    report_quote: >-
      This establishes a viral-mediated central tolerance disruption pathway
      that produces AIG indistinguishable from the genetic models but initiated
      by an environmental trigger.
    rationale: >-
      PMID:35226043 and PMID:38895117 support this pathway in the experimental
      murine infection system. They do not show that human roseoloviruses
      initiate AIG, estimate relevance to sporadic human disease, or make the
      murine phenotype mechanistically indistinguishable from every genetic
      model.
    citations:
      - PMID:35226043
      - PMID:38895117
  - claim_id: self-sustaining-progression
    statement: >-
      A prospective progression cohort proves that established AIG never
      remits and is mechanistically self-sustaining.
    disposition: REJECTED
    report_quote: >-
      This confirms a core claim of the hypothesis: once initiated, the
      autoimmune process is self-sustaining, regardless of the initiating
      trigger.
    rationale: >-
      PMID:38050966 measured stage progression in a prospective, single-center
      cohort and supports AIG as commonly progressive. Its abstract does not
      report a systematic no-remission endpoint, and clinical progression
      cannot by itself demonstrate the immune mechanism sustaining disease or
      show independence from every initiating trigger.
    citations:
      - PMID:38050966
  - claim_id: genetic-architecture-synthesis
    statement: >-
      PTPN22, HLA, ABO, and IFIH1 collectively constitute a confirmed AIG
      genetic architecture.
    disposition: QUALIFIED
    report_quote: >-
      The genetic architecture (PTPN22, HLA, ABO, IFIH1) confirms shared
      autoimmune susceptibility across organ-specific diseases
    rationale: >-
      The pernicious-anemia GWAS, PMID:34145262, identified PTPN22, PNPT1,
      HLA-DQB1, IL2RA, and AIRE loci. ABO and IFIH1 are discussed from a
      parietal-cell-antibody GWAS in a type 1 diabetes cohort
      (PMID:21829393), a different phenotype and sampling frame. The combined
      list is useful hypothesis context, not one confirmed AIG architecture.
    citations:
      - PMID:34145262
      - PMID:21829393
  - claim_id: ontology-process-labels
    statement: The report's proposed GO identifiers encode its stated tolerance processes.
    disposition: REJECTED
    report_quote: >-
      Central tolerance (GO:0006968), Peripheral tolerance (GO:0002513)
    rationale: >-
      GO:0006968 is cellular defense response, not central tolerance.
      GO:0002513 is tolerance induction to self antigen, not the broader label
      "peripheral tolerance." GO:0043383 correctly denotes negative T-cell
      selection. Candidate identifiers require ontology lookup and precise
      labels before curation.
  - claim_id: etiology-remains-unresolved
    statement: >-
      The canonical effector mechanism should be separated from the unresolved
      initiating etiology.
    disposition: RETAINED
    report_quote: >-
      the hypothesis conflates two separable claims: (a) the identity of the
      effector mechanism (strongly supported) and (b) the etiology/initiating
      trigger (oversimplified).
    rationale: >-
      This is the report's most useful organizing judgment. Evidence for
      antigen-specific effectors is substantially more direct than evidence
      assigning relative causal contributions to central tolerance, infection,
      environmental thymic disruption, or peripheral checkpoint failure in
      sporadic human AIG.

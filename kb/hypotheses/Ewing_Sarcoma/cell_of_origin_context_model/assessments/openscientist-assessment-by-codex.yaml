schema_version: '1'
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: cell_of_origin_context_model
assessed_at: '2026-09-04T22:36:29Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Developmental permissiveness is supported across several experimental systems, but the report does
  not establish a unique human cell of origin. Neural crest and early mesenchymal models, mutation
  timing, pubertal signaling and adult diagnosis must remain distinct questions. Some proposed experiments
  assume the answer, and transcriptional antagonism is incorrectly recast as tumor suppression. The
  complete report and its citation sidecar were reviewed. No provider artifact bundle is committed;
  figure placeholders and summary metrics are not executable evidence. Independently checked literature
  findings have been curated into the disease YAML with exact cached evidence and explicit model/clinical
  scope.
claims:
- claim_id: model-permissiveness
  statement: Neural crest / embryonic mesenchymal progenitor
  disposition: QUALIFIED
  report_quote: Neural crest / embryonic mesenchymal progenitor
  rationale: >-
    Human neural crest-derived cultures, engineered early human MSCs and zebrafish lineage models
    demonstrate context-dependent fusion tolerance. These are different systems and do not uniquely
    trace spontaneous human tumors to one developmental lineage.
  citations:
  - PMID:21559395
  - PMID:41136396
  - PMID:41072418
- claim_id: zebrafish-origin
  statement: NC-derived cells uniquely tolerate EWS-FLI1 (zebrafish)
  disposition: QUALIFIED
  report_quote: NC-derived cells uniquely tolerate EWS-FLI1 (zebrafish)
  rationale: >-
    Uniqueness applies to the tested zebrafish developmental system. PMID:39554045 is the preprint
    predecessor of the work published as PMID:41072418, not a second independent experimental replication.
    Use the final publication for the animal model.
  citations:
  - PMID:39554045
  - PMID:41072418
- claim_id: human-early-msc
  statement: Embryonic MSCs permissive; pediatric/adult not (human)
  disposition: QUALIFIED
  report_quote: Embryonic MSCs permissive; pediatric/adult not (human)
  rationale: >-
    The 2025 study supports a distinction among its tested MSC states and confirms tumorigenicity
    in xenografts. It does not establish that no other human progenitor can transform, nor that xenograft
    validation is a wholly non-animal methodology.
  citations:
  - PMID:41136396
- claim_id: chromatin-origin
  statement: NCSC molecular signature closest to Ewing tumors
  disposition: QUALIFIED
  report_quote: NCSC molecular signature closest to Ewing tumors
  rationale: >-
    A similarity of transformed-cell expression profiles does not establish a lineage history, especially
    because the fusion rewires developmental programs. Treat it as compatibility evidence rather
    than lineage tracing.
  citations:
  - PMID:21559395
  - PMID:25453903
  - PMID:41072418
- claim_id: reversible-state
  statement: rather than creating an irreversibly transformed phenotype
  disposition: QUALIFIED
  report_quote: rather than creating an irreversibly transformed phenotype
  rationale: >-
    Reversal of gene expression or differentiation after fusion suppression does not show elimination
    of every malignant property or reversion to the original normal cell. Persistent dosage-associated
    transcriptional changes and xenograft behavior require separate measurement.
  citations:
  - PMID:24963049
  - PMID:41484205
- claim_id: igf-human-prediction
  statement: IGF-1 will enable transformation in human embryonic MSCs; YAP1 inhibition will
    block it.
  disposition: QUALIFIED
  report_quote: IGF-1 will enable transformation in human embryonic MSCs; YAP1 inhibition will
    block it.
  rationale: >-
    This is a prediction for a proposed human experiment, not an observed result. Mouse-cell data
    justify testing it but neither demonstrate a universal human IGF-1 requirement nor exclude IGF-independent
    transformation.
  citations:
  - PMID:40080499
  - PMID:41136396
- claim_id: yap-tumor-suppression
  statement: Stage-dependent role of YAP1 (transformation cooperator vs. established tumor
    suppressor)
  disposition: REJECTED
  report_quote: Stage-dependent role of YAP1 (transformation cooperator vs. established tumor
    suppressor)
  rationale: >-
    PMID:31880317 reports opposition to the EWS-FLI1 transcriptional signature while linking YAP1/TAZ
    activity to progression and poor outcome. Opposing an oncofusion signature is not equivalent
    to suppressing an established tumor. A time-dependent experiment is reasonable, but this binary
    claim is unsupported.
  citations:
  - PMID:31880317
  - PMID:40080499
- claim_id: baseline-accessibility
  statement: Permissive cells will have pre-existing open chromatin at GGAA microsatellites and
    developmental enhancers; non-permissive cells will lack these features.
  disposition: REJECTED
  report_quote: Permissive cells will have pre-existing open chromatin at GGAA microsatellites
    and developmental enhancers; non-permissive cells will lack these features.
  rationale: >-
    The canonical EWS-FLI1 model includes pioneering chromatin opening at GGAA sites without prior
    enhancer activity. Baseline accessibility is a variable to measure, not a necessary condition
    or predefined discriminator of permissiveness.
  citations:
  - PMID:25453903
  - PMID:22086061
  - PMID:41072418
- claim_id: germline-locus
  statement: Germline GGAA microsatellite length variation
  disposition: QUALIFIED
  report_quote: Germline GGAA microsatellite length variation
  rationale: >-
    EGR2 and RREB1 susceptibility studies support particular allele-dependent fusion enhancers. This
    does not prove one genome-wide repeat rule or identify a human cell of origin; NR0B1 population
    findings also caution against a simple longer-is-more-susceptible rule.
  citations:
  - PMID:26214589
  - PMID:36787739
  - PMID:22749036
- claim_id: adult-origin-test
  statement: Unified cell-of-origin model vs. age-dependent dual-origin model.
  disposition: QUALIFIED
  report_quote: Unified cell-of-origin model vs. age-dependent dual-origin model.
  rationale: >-
    Age-stratified molecular profiling can test heterogeneity, but age at diagnosis does not date
    the initiating translocation. Shared methylation can reflect fusion reprogramming, and a difference
    could reflect site, stage, treatment or assay. Historical older-adult cohorts may also include
    entities now separated from FET-ETS Ewing sarcoma.
  citations:
  - PMID:22959474
  - PMID:28134926
  - PMID:39158802
- claim_id: absence-searches
  statement: No relevant GenCC or ClinGen entries for EWS-FLI1 cell-of-origin classification
  disposition: NEEDS_VERIFICATION
  report_quote: No relevant GenCC or ClinGen entries for EWS-FLI1 cell-of-origin classification
  rationale: >-
    No query/version/results artifacts substantiate these negative searches. Germline gene-disease
    validity databases are not exhaustive catalogs of somatic developmental mechanisms; missing annotation
    would not resolve the cell-of-origin question.
- claim_id: parp-cellular-validation
  statement: This creates sensitivity to PARP inhibitors, validated
  disposition: QUALIFIED
  report_quote: This creates sensitivity to PARP inhibitors, validated
  rationale: >-
    The cited bifunctional compound study validates cellular/spheroid activity, not clinical efficacy
    or a universal HR-deficient phenotype. Explicitly retain the negative talazoparib/temozolomide
    Ewing cohort and limited later olaparib/irinotecan activity.
  citations:
  - PMID:29513652
  - PMID:37279093
  - PMID:26505995
  - PMID:31724813
  - PMID:41591981

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: cell_of_origin_context_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  This is the most productive of the four Ewing sarcoma reports, because it found
  a whole-organism result the knowledge base did not have. The Vasileva zebrafish
  model shows that neural crest-derived cells uniquely tolerate EWSR1::FLI1, that
  targeted expression there generates lethal Ewing sarcomas, and that the fusion
  hijacks developmental enhancers to reprogram neural crest toward mesoderm - the
  first in vivo demonstration of cell-type-specific permissiveness, against an
  entry whose permissive-progenitor node rested entirely on in vitro and xenograft
  work. The report also surfaces a scope limitation the entry does not state
  anywhere: roughly 14% of Ewing sarcomas present at 40 years or older, two thirds
  of them extraskeletal, with markedly worse survival, which a strictly embryonic
  or pubertal-window model has to account for. Both are integrated. Against that,
  the report's evidence accounting is unreliable in a way that matters for
  curation. It lists the bioRxiv preprint (PMID:39554045) and the peer-reviewed
  Cell Reports version (PMID:41072418) of one and the same zebrafish study as two
  separate high-confidence evidence rows, so its headline "multiple independent
  experimental systems" framing is inflated at exactly the point where it is most
  load-bearing. It claims systematic evaluation of about 100 primary research
  papers while citing 46. And it embeds five figure placeholders whose image files
  were never committed, so none of its four claimed synthesis figures can be
  inspected. Everything else the report retains - the embryonic-versus-adult MSC
  permissiveness gradient, the germline GGAA to RREB1 chain, the IGF-1/YAP1
  cooperating signal, the stage-dependent YAP1 question - was already curated with
  the same citations before the run.
data_sources:
  - data_source_id: seer-adult-onset-cohort
    source_type: DATABASE
    name: Surveillance, Epidemiology, and End Results registry cohort of Ewing sarcoma
    uri: https://seer.cancer.gov/
    access_status: CITED_NOT_ACCESSED
    cohort: >-
      2,780 registry patients including 383 diagnosed at 40 years or older, as
      reported by the cited publication.
    notes: >-
      The report reaches SEER only through PMID:22959474 and quotes that paper's
      published percentages. It records no query against the registry, no release
      or submission version, and no extraction, and no artifact is committed under
      this hypothesis directory. This is a citation of a published analysis, not
      database access.
  - data_source_id: gencc-clingen-negative-search
    source_type: DATABASE
    name: GenCC and ClinGen gene-disease resources
    access_status: UNVERIFIABLE
    notes: >-
      The report's source-level absences section asserts that no relevant GenCC or
      ClinGen entries exist for EWS-FLI1 cell-of-origin classification. No query
      string, search date, resource version, or response log is recorded, and no
      search artifact is committed, so this cannot be graded SEARCHED_NO_RESULT.
      The assertion is also weakly framed: GenCC and ClinGen curate gene-disease
      validity, which is not a resource that would classify a cell of origin in the
      first place, so a null result there carries little information.
  - data_source_id: report-literature-corpus
    source_type: OTHER
    name: The report's own primary-literature corpus
    access_status: UNVERIFIABLE
    notes: >-
      Frontmatter declares citation_count 46 and 46 distinct PMIDs appear in the
      text, but the narrative claims systematic evaluation of about 100 primary
      research papers across five investigative iterations. No search strategy,
      query, date filter, or screening record survives, so neither the larger
      screened set nor the iteration structure can be reconstructed. The report's
      own limitations section states searches were PubMed-only through May 2026,
      which is useful but not a reconstructable protocol.
analyses:
  - analysis_id: evidence-matrix-and-confirmed-findings
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual assembly of a 43-row evidence matrix with per-row evidence type,
      direction, and confidence, plus derivation of a count of "confirmed findings"
      across five stated investigative iterations.
    comparison: >-
      Each retrieved study against the seed permissive-cell-of-origin hypothesis,
      classed as supporting, qualifying, or competing.
    input_data_source_ids:
      - report-literature-corpus
      - gencc-clingen-negative-search
    status_reason: >-
      No code, query log, iteration record, or intermediate table is committed;
      the hypothesis directory holds only the report and its citation sidecar.
      The count of 23 "confirmed findings" has no stated confirmation criterion
      and cannot be mapped onto the 43 matrix rows. Execution is not
      substantiable from the repository.
    limitations: >-
      Rows 1 and 2 of the matrix are the preprint and journal versions of a single
      study, both graded High and both counted, so the matrix double-counts the
      report's single strongest line of evidence. Confidence grades elsewhere are
      assigned without a stated rubric.
  - analysis_id: synthesis-figure-generation
    status: FAILED
    auditability: UNVERIFIABLE
    method: >-
      Generation of four synthesis figures referenced inline as an integrative
      mechanistic model, an evidence-landscape summary, a causal-chain diagram,
      a knowledge-gap summary, and a final assessment panel.
    status_reason: >-
      The report contains five {{figure:...}} placeholders naming
      integrated_model.png, evidence_summary.png, causal_chain.png,
      final_assessment.png, and knowledge_gaps.png. No artifact directory exists
      beside the report and none of these image files is committed anywhere in the
      repository, so the placeholders never resolved. The captions assert
      synthesis content - an integrative model and an evidence-landscape
      distribution - that therefore cannot be reviewed at all.
    limitations: >-
      Because the figures are absent, any reader-facing claim that depends on them
      (notably the asserted distribution of supporting versus qualifying versus
      competing evidence) has to be taken on the prose alone.
claims:
  - claim_id: neural-crest-in-vivo-permissiveness
    statement: >-
      In a zebrafish genetic model, neural crest-derived cells uniquely tolerate
      EWSR1::FLI1 expression, targeted expression there generates lethal Ewing
      sarcomas, and the fusion hijacks developmental enhancers to reprogram neural
      crest cells toward a mesoderm-like state.
    disposition: RETAINED
    report_quote: >-
      Neural crest-derived cells uniquely tolerate EWSR1-FLI1 expression, and
      targeted expression in these cells generates lethal Ewing sarcomas.
    rationale: >-
      Verified against the cached abstract of the peer-reviewed version, which
      states that neural crest-derived cells uniquely tolerate the fusion, that
      targeted expression generates lethal Ewing sarcomas, and that chromatin
      accessibility and binding profiling show the fusion hijacking developmental
      enhancers for neural crest to mesoderm reprogramming during initiation. This
      is the report's genuine contribution: the entry's Permissive Progenitor Cell
      State node carried only in vitro human-cell and xenograft evidence, with no
      whole-organism demonstration that permissiveness is cell-type-specific.
      Integrated against the journal version rather than the preprint. The
      cross-species caveat is real and is recorded with the evidence.
    citations:
      - PMID:41072418
  - claim_id: vasileva-preprint-and-journal-double-counted
    statement: >-
      Two independent zebrafish studies support neural crest permissiveness.
    disposition: REJECTED
    report_quote: >-
      | 2 | [PMID: 41072418](https://pubmed.ncbi.nlm.nih.gov/41072418/) | Model
      organism (zebrafish) | **Supports** | NC cells uniquely tolerate EWS-FLI1 |
      Targeted NC expression generates Ewing sarcomas | In vivo, zebrafish | High |
    rationale: >-
      PMID:39554045 and PMID:41072418 are the same study. The cached records show
      identical titles, with PMID:39554045 in bioRxiv (2024,
      doi:10.1101/2024.10.27.620438) and PMID:41072418 in Cell Reports (2025,
      doi:10.1016/j.celrep.2025.116376). The report gives them evidence-matrix rows
      1 and 2, both graded High, and elsewhere writes "Vasileva et al. (2024/2025)"
      showing it recognised the pairing while still counting it twice. This
      inflates the apparent independence of the single most important line of
      evidence in the report, and it inflates the confirmed-findings count. The
      underlying science is unaffected; only the accounting is rejected. Curated
      against the journal version alone.
    citations:
      - PMID:41072418
      - PMID:39554045
    analysis_ids:
      - evidence-matrix-and-confirmed-findings
  - claim_id: embryonic-msc-permissiveness-gradient
    statement: >-
      Only human embryonic mesenchymal stem cells support full EWS-FLI1-driven
      transformation, with pediatric and adult mesenchymal stem cells responding
      transcriptionally but failing to form tumours.
    disposition: RETAINED
    report_quote: >-
      Only the earliest, most undifferentiated embryonic MSCs support full
      EWS-FLI1-driven transformation
    rationale: >-
      Consistent with the cached record for PMID:41136396, which the entry already
      cites twice on the Permissive Progenitor Cell State node, including the
      xenograft tumour-formation result. This is the seed paper for the hypothesis
      as curated, so the report is restating knowledge base content rather than
      adding support. No integration follows.
    citations:
      - PMID:41136396
  - claim_id: adult-onset-extraskeletal-scope-limit
    statement: >-
      A substantial minority of Ewing sarcomas present at 40 years or older,
      predominantly as extraskeletal disease and with worse survival, which a
      strictly embryonic or pubertal-window origin model must account for.
    disposition: QUALIFIED
    report_quote: >-
      13.8% of Ewing sarcomas occur in patients ≥40 years, predominantly
      extraskeletal (66.1%), with worse prognosis (HR for death 2.04, 95% CI
      1.63-2.54)
    rationale: >-
      The epidemiology checks out against the cached SEER analysis: 383 of 2,780
      patients diagnosed at 40 or older (13.8%), extraskeletal in 66.1% versus
      31.7%, five-year survival 40.6% versus 54.3%, and an adjusted hazard ratio
      for death of 2.04 (95% CI 1.63-2.54). Qualified rather than retained because
      the report's inference from it is not established: registry data show that
      adult-onset disease exists and behaves differently, but nothing in that paper
      speaks to cell of origin, and the report itself concedes no molecular study
      has compared origin across age strata. The cohort also predates routine
      molecular confirmation, so some registry-coded adult extraskeletal cases may
      be round cell sarcomas now recognised as distinct entities. Integrated as an
      open knowledge gap attached to the developmental nodes, not as a mechanism.
    citations:
      - PMID:22959474
  - claim_id: germline-ggaa-rreb1-chain
    statement: >-
      Longer germline GGAA microsatellite alleles at the 6p25.1 susceptibility
      locus increase EWSR1-FLI1 binding and neo-enhancer output, regulating RREB1
      and downstream proliferative signalling.
    disposition: RETAINED
    report_quote: >-
      longer germline GGAA repeats → more EWSR1-FLI1 binding → stronger
      neo-enhancer activity → RREB1-mediated proliferation
    rationale: >-
      Accurate and already fully curated: the entry's GGAA Microsatellite Germline
      Susceptibility Architecture node names both the EGR2 and RREB1 loci, carries
      RREB1 as a gene descriptor, records RREB1-mediated RAS/MAPK-associated
      transcription as an intermediate mechanism, and cites this paper twice
      including the RREB1 knockdown result. No integration follows.
    citations:
      - PMID:36787739
  - claim_id: igf1-yap1-cooperating-signal
    statement: >-
      Transient pubertal-level IGF-1 exposure is a non-genetic cooperating signal
      that reprograms EWS-FLI1-expressing mesenchymal cells to stable
      transformation through YAP1.
    disposition: RETAINED
    report_quote: >-
      transient exposure to IGF-1 concentrations mimicking serum levels during
      puberty reprograms limb-derived mesenchymal cells of EWS::FLI1-mutant mice to
      stable transformation and tumorigenicity
    rationale: >-
      Verbatim from the cached abstract and correct. Already curated as the
      IGF-1/YAP1 Developmental Cooperation node with this citation, graded
      MODEL_ORGANISM. No integration follows.
    citations:
      - PMID:40080499
  - claim_id: yap1-stage-dependent-role
    statement: >-
      YAP1 promotes initial transformation but its transcriptional activity is
      inversely correlated with the EWS-FLI1 signature in established tumours, so
      its role is stage-dependent and unresolved.
    disposition: QUALIFIED
    report_quote: >-
      YAP1 likely has **stage-dependent roles** — promoting initial transformation
      but potentially opposing the EWS-FLI1 program in established tumors.
    rationale: >-
      A fair reading of the tension between the two cited results, and the report is
      appropriately hedged ("likely", "potentially"). Qualified because no
      experiment cited resolves it - the two studies address different temporal
      windows in different systems, and an inverse correlation in established
      tumours is not evidence of opposition. Not separately integrated: the entry's
      IGF-1/YAP1 node description already states the mechanism "remains to be
      validated across human progenitor systems and across established tumor
      maintenance states", which is this qualification.
    citations:
      - PMID:40080499
      - PMID:31880317
  - claim_id: fusion-determines-phenotype-competing-model
    statement: >-
      The competing model in which EWS-FLI1 alone drives the neural crest
      phenotype irrespective of cell of origin is partially compatible rather than
      a true alternative.
    disposition: QUALIFIED
    report_quote: >-
      This model is partially compatible — EWS-FLI1 induces some neural crest
      features broadly, but the full oncogenic program requires a specific
      progenitor context.
    rationale: >-
      The reconciliation is reasonable and matches the KB's framing, but the report
      settles it more firmly than its own evidence allows: it rests on one 2005
      rhabdomyosarcoma-transfection study on one side and one 2004 HEK293
      microarray study on the other, neither of which tests tumour formation in a
      permissive versus non-permissive comparison. Not integrated; the entry
      already flags the cell of origin as unresolved and carries an open discussion
      on permissiveness.
    citations:
      - PMID:15930281
      - PMID:15548687
  - claim_id: endothelial-origin-superseded
    statement: >-
      The historical endothelial or vascular origin model has been largely
      superseded by mesenchymal and neural crest evidence, though expression
      overlap remains worth investigating.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This is a **historical alternative** that has been largely superseded by the
      MSC/NCSC evidence, but the endothelial gene expression overlap deserves
      further investigation as it may reflect shared developmental lineage.
    rationale: >-
      Plausible and probably right, but the two supporting citations were not
      checked against source in this review and one of them (PMID:40850534) is
      used only for an assertion of molecular similarity between
      EWS-FLI1-silenced cells and endothelial cells, which would need reading
      before any weight is placed on it. Marked NEEDS_VERIFICATION rather than
      retained, and not integrated: the entry takes no position on an endothelial
      origin, and adding a dismissal of one would introduce a claim the KB does not
      currently make.
    citations:
      - PMID:40850534
      - PMID:18556509
  - claim_id: retain-emerging-status
    statement: >-
      The hypothesis should keep EMERGING status until permissive chromatin
      features are characterised in human cells and the IGF-1/YAP1 mechanism is
      validated in human progenitors.
    disposition: RETAINED
    report_quote: >-
      **Recommended:** Retain EMERGING. Consider upgrade to ESTABLISHED once: (1)
      chromatin features defining permissiveness are characterized in human cells,
      and (2) the IGF-1/YAP1 mechanism is validated in human progenitors.
    rationale: >-
      Agreed. The entry already reads EMERGING for this hypothesis group and both
      stated upgrade conditions remain unmet. Note the report's target status name
      is not a value this schema uses; the point stands regardless. No edit made.
    citations:
      - PMID:41136396
  - claim_id: hundred-paper-corpus-claim
    statement: >-
      The report systematically evaluated approximately 100 primary research
      papers across five investigative iterations.
    disposition: REJECTED
    report_quote: >-
      After systematic evaluation of ~100 primary research papers across 5
      investigative iterations, we find **strong convergent evidence** supporting
      the core claims of this hypothesis from multiple independent experimental
      systems
    rationale: >-
      The report cites 46 distinct PMIDs, matching its own frontmatter
      citation_count of 46, against a claimed ~100 systematically evaluated. No
      screening log, iteration record, or excluded-study list is committed, so the
      other half of the claimed corpus cannot be examined and the word "systematic"
      cannot be checked. The same sentence's appeal to "multiple independent
      experimental systems" is additionally weakened by the preprint/journal
      double-count. Rejected as an unsupported provenance claim; it does not
      disturb the individual findings.
    analysis_ids:
      - evidence-matrix-and-confirmed-findings
  - claim_id: missing-synthesis-figure-artifacts
    statement: >-
      The report supplies synthesis figures summarising the integrated model,
      evidence landscape, causal chain, and knowledge gaps.
    disposition: REJECTED
    report_quote: >-
      {{figure:knowledge_gaps.png|caption=Summary of major knowledge gaps in the
      permissive developmental cell-of-origin hypothesis}}
    rationale: >-
      Five figure placeholders appear in the text and none of the named image
      files exists: there is no artifact directory beside the report and no
      committed image anywhere. The captions promise content that would otherwise
      be reviewable evidence, notably an evidence-landscape distribution across
      supporting, qualifying, and competing categories. Since nothing rendered,
      those summaries cannot be inspected or reconciled with the prose.
    analysis_ids:
      - synthesis-figure-generation

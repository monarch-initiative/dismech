schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_fusion_enhanceropathy_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The core enhanceropathy mechanism is genuinely well supported, but almost none
  of that support is new: the seed hypothesis came from this knowledge base, and
  the report's central chain (LCD hubs, BAF retargeting, GGAA de novo enhancers,
  NuRD repression, core regulatory circuitry, dosage sensitivity, IGF-1/YAP1
  permissiveness, DHX9/R-loop arm, ETV6 counter-regulation) is already curated in
  kb/disorders/Ewing_Sarcoma.yaml with the same primary citations. The report's
  real contribution is two single-cell papers the entry lacked: Aynaud 2020
  (PMID:32049009), which ties an intermediate EWS-FLI1 activity window to
  proliferation and oxidative phosphorylation with hypoxia at both extremes, and
  Waltner 2025 (PMID:40667384), which shows multiple co-existing, TGF-beta-modifiable
  regulatory modules within and across tumors. Three claims are overstated on source
  review. The report presents Beck 2012 as explaining the ten-fold
  African-versus-European incidence gap, but that paper found African NR0B1
  microsatellites to be larger - the direction that predicts more, not less,
  EWS/FLI activation - and itself says the effect may operate "in unanticipated
  ways". It presents PKC beta II immunohistochemistry as a clean discriminator
  while omitting the off-target positives the same abstract reports. And it calls
  the DHX9/R-loop arm a "genuinely independent mechanism" while its own
  knowledge-gap section admits the relative
  contribution of the two arms is unknown. Corpus accounting is also loose: 50
  distinct PMIDs are cited against 43 evidence-matrix rows, the evidence-type counts
  do not sum to 43, and an unnamed "knowledge graph" is credited with 16 confirmed
  findings.
data_sources:
  - data_source_id: clinicaltrials-nct03600649
    source_type: DATABASE
    name: ClinicalTrials.gov record for the seclidemstat trial cited as clinical validation
    identifier: NCT03600649
    access_status: CITED_NOT_ACCESSED
    notes: >-
      The report cites this registration to argue that enhanceropathy-directed
      therapy has reached the clinic, but it reports no registry field, arm,
      enrolment figure, or result. No query, response, or artifact is committed
      anywhere under this hypothesis directory, so the registry record was cited
      rather than inspected.
  - data_source_id: unnamed-knowledge-graph
    source_type: DATABASE
    name: Unnamed knowledge graph credited in the evidence summary statistics
    access_status: UNVERIFIABLE
    notes: >-
      The final statistics table asserts "Confirmed findings in knowledge graph |
      16" without naming the graph, giving a version or access date, or saying
      which 16 of the 43 evidence rows were confirmed against it. Nothing in the
      report or the hypothesis directory allows the resource or the confirmation
      step to be identified, so access cannot be established.
  - data_source_id: report-literature-corpus
    source_type: OTHER
    name: The report's own primary-literature corpus
    access_status: UNVERIFIABLE
    notes: >-
      No search engine, query string, date filter, or inclusion rule is recorded.
      The report frontmatter declares citation_count 50 and 50 distinct PMIDs do
      appear in the text, but the evidence matrix has 43 rows and the summary
      calls those 43 "primary research papers" while the same statistics table
      counts 3 as review-level. The corpus is therefore not reconstructable and
      the seven cited-but-unmatrixed PMIDs cannot be accounted for.
analyses:
  - analysis_id: evidence-matrix-compilation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual construction of a 43-row evidence matrix with per-row assignment of
      evidence type, relationship to the seed hypothesis, and a confidence grade,
      followed by tabulation of category counts in the closing statistics table.
    comparison: >-
      Each retrieved paper against the seed hypothesis, scored as supports,
      qualifies, refutes, or competing.
    input_data_source_ids:
      - report-literature-corpus
      - unnamed-knowledge-graph
    status_reason: >-
      No code, query log, or intermediate table is committed; the hypothesis
      directory contains only the report. The tabulation is also internally
      inconsistent - the relationship counts (24 + 16 + 3) reach 43 but the
      evidence-type counts (8 human clinical + 25 in vitro + 7 in vivo) reach 40,
      and the "confirmed findings in knowledge graph" row has no defined
      denominator. Execution cannot be substantiated from the repository.
    limitations: >-
      Confidence grades are assigned by the provider without a stated rubric, so
      "High" and "Moderate" are not comparable across rows and cannot be used to
      weight evidence during curation.
claims:
  - claim_id: enhanceropathy-core-thesis
    statement: >-
      EWS-FLI1 is the truncal driver of Ewing sarcoma, retargeting chromatin
      remodelling machinery to GGAA microsatellites to create de novo enhancers
      that drive an oncogenic transcriptional program.
    disposition: RETAINED
    report_quote: >-
      The canonical EWS-FLI1 fusion enhanceropathy model is one of the
      best-validated oncogenic mechanisms in pediatric cancer.
    rationale: >-
      Correct, and independently supported by the landmark chromatin work
      (PMID:25453903), the BAF-retargeting mechanism (PMID:28844694), and the
      core regulatory circuitry study (PMID:33080033). It is nonetheless not new
      support: the seed hypothesis YAML embedded in this report was copied from
      kb/disorders/Ewing_Sarcoma.yaml, and all three of these citations were
      already curated there before the run. Retained as accurate, with no
      integration consequence.
    citations:
      - PMID:25453903
      - PMID:28844694
      - PMID:33080033
  - claim_id: methylation-ubiquity-human-validation
    statement: >-
      Genome-scale DNA methylation profiling of patient tumours shows consistent
      hypomethylation at EWS-FLI1-regulated enhancers, establishing enhancer
      reprogramming as a ubiquitous feature of Ewing sarcoma.
    disposition: RETAINED
    report_quote: >-
      Genome-scale DNA methylation sequencing (PMID:28134926) established enhancer
      reprogramming as a *ubiquitous* feature of Ewing sarcoma across patient
      tumors, providing key human clinical validation.
    rationale: >-
      Verified against the cached abstract, which uses the word "ubiquitous" for
      exactly this claim ("thus establishing epigenomic enhancer reprogramming as a
      ubiquitous and characteristic feature of Ewing sarcoma"). The report's
      emphasis is faithful rather than inflated. Already curated on the GGAA
      Microsatellite Enhancer Reprogramming node, so no integration follows.
    citations:
      - PMID:28134926
  - claim_id: single-cell-oxphos-activity-window
    statement: >-
      Single-cell profiling links a well-defined intermediate range of EWS-FLI1
      activity to proliferation and strong oxidative phosphorylation, with cells
      above and below that range showing increased hypoxia programs.
    disposition: RETAINED
    report_quote: >-
      scRNA-seq + time-resolved ChIP defines direct enhancer-driven EWS-FLI1
      program. Proliferation and OXPHOS associated with optimal EWS-FLI1 activity.
      Hypoxia at extremes.
    rationale: >-
      Verified against the cached abstract, which states that in Ewing sarcoma
      tumours "cell proliferation and strong oxidative phosphorylation metabolism
      are associated with a well-defined range of EWSR1-FLI1 activity" while cells
      from below and above the intermediary activity level show increased hypoxia.
      This is a genuine gap-filler for the knowledge base: the entry's metabolic
      node covers only the ATF4 serine-glycine and glutamine arm and has no
      dosage-to-metabolism link, and the dosage node cites no metabolic
      consequence. Integrated.
    citations:
      - PMID:32049009
  - claim_id: coexisting-regulatory-modules-tgfb
    statement: >-
      Ewing sarcoma cells carry several co-existing gene-regulatory modules that
      vary within and between tumours, are differentially activated or repressed by
      the fusion, and can be shifted by exogenous TGF-beta.
    disposition: RETAINED
    report_quote: >-
      Multiple co-existing gene regulatory modules shape Ewing sarcoma phenotypic
      diversity. TGF-beta can modify modules. Intratumoral heterogeneity in
      regulatory networks.
    rationale: >-
      Verified against the cached full text, which reports single-cell RNA plus
      ATAC across nine Ewing lines resolving into three modules, shows fusion
      knockdown lowering module 1 and 3 expression while raising module 2, and
      shows TGF-beta polarising A673 and CHLA10 towards module 2. The report's
      framing is accurate. Two caveats a curator must carry: the cached record is
      a bioRxiv preprint, and the module structure is derived largely from cell
      lines with primary-tumour data used as confirmation. Integrated with those
      qualifications rather than as a settled mechanism.
    citations:
      - PMID:40667384
  - claim_id: igf1-yap1-permissive-context
    statement: >-
      Transient IGF-1 exposure at pubertal serum concentrations reprograms
      EWS-FLI1-expressing limb-derived mesenchymal cells to stable tumorigenicity
      via YAP1, whereas the fusion alone produces skeletal malformations without
      tumours.
    disposition: RETAINED
    report_quote: >-
      IGF-1 at puberty concentrations reprograms EWS::FLI1 mesenchymal cells to
      tumorigenicity via YAP1. EWS-FLI1 alone causes skeletal malformations but NOT
      tumors.
    rationale: >-
      Both halves verified against the cached record, which states that fusion
      expression in this lineage "does not result in tumor formation but in skeletal
      malformations and perinatal death" and that transient pubertal-level IGF-1
      exposure drives stable transformation and tumorigenicity. Already curated as
      the IGF-1/YAP1 Developmental Cooperation node with this citation, so no
      integration follows.
    citations:
      - PMID:40080499
  - claim_id: no-faithful-gemm
    statement: >-
      No genetically engineered mouse model reproduces Ewing sarcoma from EWS-FLI1
      expression alone; published attempts required cooperating lesions and
      irradiation.
    disposition: RETAINED
    report_quote: >-
      No GEMM recapitulates Ewing sarcoma from EWS-FLI1 expression alone in the
      correct cell of origin.
    rationale: >-
      Verified against the cached El Beaino record, which reports that EWS-FLI1
      p53-null murine mesenchymal stem cells "were resistant to transformation and
      did not form tumors in syngeneic mice without irradiation", with Stag2
      knockdown raising tumour formation from 22% to 91% only in irradiated cells.
      The gap is real and correctly stated. The entry already carries an open
      knowledge-gap discussion on cell-of-origin permissiveness that covers it, so
      no new discussion is warranted.
    citations:
      - PMID:31898537
  - claim_id: ggaa-repeat-racial-disparity
    statement: >-
      GGAA microsatellite polymorphism explains the roughly ten-fold lower incidence
      of Ewing sarcoma in African compared with European populations.
    disposition: QUALIFIED
    report_quote: >-
      NR0B1 GGAA microsatellite differs between African and European populations.
      May explain 10-fold incidence disparity.
    rationale: >-
      The polymorphism and the incidence gap are both real, but the report's
      causal framing runs against the direction the source reports. Beck et al.
      found the NR0B1 microsatellite in African subjects to be significantly
      larger, "harboring more repeat motifs, a greater number of repeat segments,
      and longer consecutive repeats", and the same abstract states that gene
      expression correlates positively with repeat number. More repeats in the
      lower-incidence population is the opposite of what a simple
      more-repeats-more-activation model predicts, which is why the authors
      conclude only that the polymorphism "might influence disease susceptibility
      and prognosis in Ewing sarcoma in unanticipated ways". The report's own
      confidence column concedes the functional link is inferred, but its key-finding
      cell does not. Not integrated as a mechanism; the entry's germline
      susceptibility node already treats repeat architecture as permissive context
      without asserting a population-level causal direction.
    citations:
      - PMID:22749036
  - claim_id: pkcbetaii-diagnostic-specificity
    statement: >-
      Strong PKC beta II immunostaining is a specific marker separating classic
      Ewing sarcoma from its round cell mimics.
    disposition: QUALIFIED
    report_quote: >-
      PKC Beta II (PRKCB) is strongly expressed in all tested EWS-FLI1, EWS-ERG,
      EWS-ETV4, and FUS-ERG fusion-positive sarcomas (n=34). Negative in all
      BCOR/CIC/NFATC2/NUTM1/PATZ1-rearranged round cell sarcomas (n=46).
    rationale: >-
      The negative result in the 46 non-Ewing round cell sarcomas is exactly as
      reported, but "strongly expressed in all tested" is not: the abstract records
      a patchy rather than diffuse pattern in 3 fusion-positive cases, and the
      report silently drops every off-target positive the same abstract lists -
      2 of 130 synovial sarcomas, 1 of 26 poorly differentiated head and neck
      carcinomas, more than half of neuroblastomas, 2 sarcomatoid mesotheliomas,
      2 metastatic melanomas, and weak staining in most T-lymphoblastic and half of
      other non-Hodgkin lymphomas. The marker's usefulness is confined to the
      round-cell differential the study frames it for. Not integrated: this is
      diagnostic immunohistochemistry rather than support for the enhanceropathy
      mechanism, and the report's link from enhanceropathy to PRKCB expression is
      asserted, not demonstrated.
    citations:
      - PMID:40230184
  - claim_id: dhx9-parallel-independent-arm
    statement: >-
      EWS-FLI1-driven DHX9 sequestration and R-loop accumulation constitute an
      oncogenic mechanism genuinely independent of the enhanceropathy.
    disposition: QUALIFIED
    report_quote: >-
      This is a genuinely independent mechanism - not mediated by enhanceropathy but
      by direct protein sequestration.
    rationale: >-
      The underlying finding is sound and already curated on the R-loop Resolution
      and Replication-Fork Vulnerability node with the same citation. The word
      "independent" overreaches on two counts: both arms are driven by the same
      fusion protein, so they are mechanistically parallel rather than independent
      of the driver, and no experiment in the cited work partitions oncogenicity
      between transcriptional and replication-stress arms. The report's own
      knowledge-gap section concedes this, asking what fraction of oncogenicity is
      attributable to each - a question it has already answered rhetorically in the
      alternative-models section. Retained as parallel, not integrated as
      independent.
    citations:
      - PMID:40721661
  - claim_id: ggaa-therapeutic-payload-platform
    statement: >-
      The fusion's neomorphic GGAA binding can be exploited as a synthetic enhancer
      cassette driving fusion-dependent expression of a therapeutic payload.
    disposition: RETAINED
    report_quote: >-
      Engineered GGAA-based synthetic enhancer cassette drives EWS-FLI1-dependent
      therapeutic payload expression. Anti-GPR64 targeted lentivirus + thymidine
      kinase causes tumor-specific killing. Also works in PAX3-FOXO1 ARMS.
    rationale: >-
      Verified against the cached full text, which describes the de novo
      enhancer-based expression cassette, the anti-GPR64-pseudotyped lentivirus
      delivering viral thymidine kinase, ganciclovir sensitisation, and the
      transfer to PAX3-FOXO1 alveolar rhabdomyosarcoma. Accurate. Deliberately not
      integrated: this is a preclinical vector-engineering proof of concept with no
      clinical arm, so it belongs in neither the pathophysiology graph nor the
      treatments list, and adding it would misrepresent an in-vivo xenograft result
      as a therapy.
    citations:
      - PMID:36229873
  - claim_id: retain-canonical-status
    statement: >-
      The hypothesis should keep CANONICAL status, with the description noting the
      dual activation/repression mechanism, dynamic hub formation rather than bulk
      phase separation, and dosage sensitivity of GGAA enhancers.
    disposition: RETAINED
    report_quote: >-
      **Recommendation:** Maintain CANONICAL status. The evidence is overwhelming for
      the core mechanism.
    rationale: >-
      Agreed, and no change is needed: the entry already reads CANONICAL, and its
      current description already names BAF-supported enhancer activation,
      NuRD/CHD4-associated repression, ETV6 counter-regulation, and dosage-sensitive
      chromatin hubs. The three suggested description additions are therefore
      already present. No edit made.
    citations:
      - PMID:41659683
      - PMID:23178492
  - claim_id: evidence-corpus-accounting
    statement: >-
      The report's evidence corpus and summary statistics are internally consistent
      and reconstructable.
    disposition: REJECTED
    report_quote: >-
      | Confirmed findings in knowledge graph | 16 |
    rationale: >-
      Three defects. The report cites 50 distinct PMIDs but builds a 43-row matrix
      and never accounts for the difference. The statistics table's evidence-type
      counts sum to 40 against a declared total of 43, while its relationship counts
      sum correctly to 43 - so at least one axis is miscounted. And the quoted row
      credits an unnamed knowledge graph with confirming 16 findings, with no
      resource name, version, access date, or list of which findings. This does not
      touch the biology of the core claims, but it means the corpus cannot be
      audited and the confirmation counts cannot be relied on when triaging leads.
    analysis_ids:
      - evidence-matrix-compilation

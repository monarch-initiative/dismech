schema_version: '1'
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_fusion_enhanceropathy_model
assessed_at: '2026-09-05T00:46:23Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The core fusion-driven enhancer and transcriptional-repression model is well supported. The expanded
  report materially overstates human developmental inference, mechanistic independence and clinical
  translation, and does not flag an endogenous-imaging preprint. CHD4 maintenance, dosage plasticity
  and hybrid regulatory states are useful additions when separated from the canonical activation/repression
  chain. The complete report and its citation sidecar were reviewed. No provider artifact bundle
  is committed; figure placeholders and summary metrics are not executable evidence. Independently
  checked literature findings have been curated into the disease YAML with exact cached evidence
  and explicit model/clinical scope.
claims:
- claim_id: enhancer-core
  statement: EWS-FLI1 creates de novo enhancers at GGAA microsatellites
  disposition: RETAINED
  report_quote: EWS-FLI1 creates de novo enhancers at GGAA microsatellites
  rationale: >-
    ChIP/functional perturbation supports de novo enhancer formation and BAF recruitment in EWS-FLI1
    models. Patient methylation data add human relevance but are observational and do not independently
    establish each causal step.
  citations:
  - PMID:25453903
  - PMID:28844694
  - PMID:28134926
- claim_id: repression-arm
  statement: EWS-FLI1 has an equally important repressive arm via NuRD complex recruitment at
    ETS motifs
  disposition: RETAINED
  report_quote: EWS-FLI1 has an equally important repressive arm via NuRD complex recruitment
    at ETS motifs
  rationale: >-
    NuRD-associated HDAC/LSD1 activity and fusion repression contribute to transformation in cellular
    models. Relative quantitative importance is not universal, and all repression should not be equated
    with one motif class.
  citations:
  - PMID:23178492
  - PMID:25453903
  - PMID:24963049
- claim_id: chd4-distinct
  statement: CHD4 promotes survival through chromatin structure maintenance and DNA damage
    control.
  disposition: QUALIFIED
  report_quote: CHD4 promotes survival through chromatin structure maintenance and DNA damage
    control.
  rationale: >-
    Correct as a distinct dependency. PMID:37963210 explicitly reports that CHD4 survival effects
    were not mediated by changing EWS-FLI1 activity or its oncogenic gene-expression program. The
    YAML now separates CHD4 architecture maintenance from NuRD/LSD1 repression.
  citations:
  - PMID:37963210
- claim_id: endogenous-hubs-preprint
  statement: Endogenous EWS::FLI1 forms dynamic sub-diffraction hubs, NOT macroscopic LLPS.
  disposition: QUALIFIED
  report_quote: Endogenous EWS::FLI1 forms dynamic sub-diffraction hubs, NOT macroscopic LLPS.
  rationale: >-
    PMID:41659683 is a bioRxiv preprint, not independent established clinical or peer-reviewed validation.
    Retain dynamic hubs as a provisional refinement alongside published evidence for an optimum of
    LCD interactions; the report high-confidence label omits this publication-status limitation.
  citations:
  - PMID:41659683
  - PMID:35483357
- claim_id: dosage-metastasis
  statement: paradoxical pro-metastatic effects at intermediate depletion levels
  disposition: QUALIFIED
  report_quote: paradoxical pro-metastatic effects at intermediate depletion levels
  rationale: >-
    Engineered endogenous fusion depletion/restoration supports non-monotonic metastatic phenotypes
    in preclinical models. It does not show that partial exposure to a clinical fusion inhibitor
    causes metastasis in patients.
  citations:
  - PMID:41484205
  - PMID:34329586
- claim_id: developmental-igf
  statement: explaining the adolescent age peak
  disposition: QUALIFIED
  report_quote: explaining the adolescent age peak
  rationale: >-
    IGF-1 concentrations designed to model pubertal serum levels transformed particular EWS-FLI1-mutant
    mouse mesenchymal cells. The experiment neither dates human initiation nor establishes a universal
    human pubertal signal. Keep developmental cooperation as emerging and model-specific.
  citations:
  - PMID:40080499
  - PMID:41136396
  - PMID:41072418
- claim_id: universal-secondary-hits
  statement: additional hits (STAG2, TP53, CDKN2A, irradiation) are required for full
    transformation.
  disposition: REJECTED
  report_quote: additional hits (STAG2, TP53, CDKN2A, irradiation) are required for full
    transformation.
  rationale: >-
    Requirements in particular engineered models are not requirements in every human tumor. Whole-genome
    cohorts contain many tumors without these recurrent secondary lesions. Human embryonic MSC and
    zebrafish lineage models further prevent a universal genetic-cooperator requirement from being
    inferred.
  citations:
  - PMID:25223734
  - PMID:41136396
  - PMID:41072418
- claim_id: dhx9-independence
  statement: This is a genuinely independent mechanism - not mediated by enhanceropathy but by
    direct protein sequestration.
  disposition: QUALIFIED
  report_quote: This is a genuinely independent mechanism - not mediated by enhanceropathy but
    by direct protein sequestration.
  rationale: >-
    The DHX9 study shows sequestration and failed resolution of TOP1-poison-induced R-loops, with
    resistance effects independent of measured global transcription/proliferation rates. That is
    narrower than complete mechanistic independence from transcription or proof of an untreated initiating
    pathway.
  citations:
  - PMID:40721661
- claim_id: etv6-counterregulation
  statement: ETV6 competes with EWS::FLI1 at short GGAA repeats, restraining function.
  disposition: RETAINED
  report_quote: ETV6 competes with EWS::FLI1 at short GGAA repeats, restraining function.
  rationale: >-
    Biochemical, genomic and perturbation data support selected-site competition, differentiation
    after ETV6 loss and preclinical growth inhibition. This is not evidence for a clinically validated
    degrader.
  citations:
  - PMID:36658219
  - PMID:40215343
- claim_id: multiple-regulatory-states
  statement: Multiple co-existing gene regulatory modules shape Ewing sarcoma phenotypic
    diversity.
  disposition: RETAINED
  report_quote: Multiple co-existing gene regulatory modules shape Ewing sarcoma phenotypic
    diversity.
  rationale: >-
    Single-cell RNA/ATAC and patient tumor analyses support multiple programs; CD73-positive matrix-depositing
    malignant cells can have hybrid fusion-high/low signatures. The YAML includes hybrid states without
    mistaking these cells for nonmalignant fibroblasts.
  citations:
  - PMID:40667384
  - PMID:37471463
  - PMID:40029262
- claim_id: repeat-ancestry-inference
  statement: GGAA repeats explain racial disparity
  disposition: QUALIFIED
  report_quote: GGAA repeats explain racial disparity
  rationale: >-
    The NR0B1 study measured healthy donors and found longer repeats in African subjects; CAV1 did
    not show the same difference. It proposes, but does not establish, an explanation of incidence
    or outcome differences. Susceptibility is locus-specific and not a universal monotonic repeat-length
    rule.
  citations:
  - PMID:22749036
  - PMID:36787739
  - PMID:26214589
- claim_id: clinical-translation
  statement: Clinical translation
  disposition: QUALIFIED
  report_quote: Clinical translation
  rationale: >-
    The seclidemstat source presents preclinical pharmacology and mentions a trial; this is not a
    positive clinical result. Limited xenograft activity and negative/small PARP combination trials
    temper any claim that laboratory validation proves treatment efficacy.
  citations:
  - PMID:40852926
  - PMID:34453478
  - PMID:31724813
  - PMID:41591981
- claim_id: knowledge-graph-metric
  statement: Confirmed findings in knowledge graph
  disposition: NEEDS_VERIFICATION
  report_quote: Confirmed findings in knowledge graph
  rationale: >-
    The count of sixteen is a report summary with no committed graph, node/edge table, query response
    or executable derivation. It is not an additional independent source of confirmation.
  analysis_ids:
  - knowledge-graph-summary

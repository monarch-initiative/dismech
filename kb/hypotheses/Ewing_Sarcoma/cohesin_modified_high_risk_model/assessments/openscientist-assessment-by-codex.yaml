hypothesis_id: cohesin_modified_high_risk_model
assessed_at: '2026-09-05T00:46:23Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The model has real preclinical and cohort support, but the report makes material source and analysis
  errors. It reverses the NR0B1 ancestry finding, treats contact changes as an exact replication
  of occupancy redistribution, infers ancestry from incomparable prognostic cohorts, and presents
  an unarchived portal analysis as independent confirmation. These flaws do not erase the primary
  STAG2 chromatin and clinical evidence. The complete report and its citation sidecar were reviewed.
  No provider artifact bundle is committed; figure placeholders and summary metrics are not executable
  evidence. Independently checked literature findings have been curated into the disease YAML with
  exact cached evidence and explicit model/clinical scope.
claims:
- claim_id: redistribution-replication
  statement: STAG2 loss selectively redistributes EWS-FLI1 binding from short (1–4) GGAA repeat
    enhancers to multimeric (≥5 repeat) GGAA microsatellite enhancers
  disposition: QUALIFIED
  report_quote: STAG2 loss selectively redistributes EWS-FLI1 binding from short (1–4) GGAA
    repeat enhancers to multimeric (≥5 repeat) GGAA microsatellite enhancers
  rationale: >-
    PMID:41950086 directly reports repeat-class occupancy redistribution. PMID:39487368 reports that
    STAG2 supports long-repeat enhancer-promoter communication and identifies CTCF changes; it does
    not independently reproduce the same directional occupancy/amplification result. Related multi-omics
    findings should not be counted as two exact replications.
  citations:
  - PMID:41950086
  - PMID:39487368
- claim_id: prc2-ctcf
  statement: STAG2 loss simultaneously disrupts PRC2-mediated gene silencing and CTCF-dependent
    chromatin contacts
  disposition: RETAINED
  report_quote: STAG2 loss simultaneously disrupts PRC2-mediated gene silencing and
    CTCF-dependent chromatin contacts
  rationale: >-
    Ewing-specific perturbation and contact studies support multiple pathways. Their separate quantitative
    contributions to human prognosis remain unresolved; cross-cancer studies are complementary plausibility,
    not independent Ewing replication.
  citations:
  - PMID:34129824
  - PMID:39487368
- claim_id: cog-prognosis
  statement: largest prospective immunohistochemistry study
  disposition: QUALIFIED
  report_quote: largest prospective immunohistochemistry study
  rationale: >-
    The source calls this a retrospective cohort study of patients enrolled in COG studies. Diagnostic
    IHC loss associated with lower five-year EFS in localized disease, but this is not a prospective
    biomarker-validation or treatment-selection trial.
  citations:
  - PMID:36221002
- claim_id: japan-comparison
  statement: the prognostic impact varies by population, with a Japanese cohort showing no
    significant survival difference
  disposition: REJECTED
  report_quote: the prognostic impact varies by population, with a Japanese cohort showing no
    significant survival difference
  rationale: >-
    COG compares protein loss with diagnostic EFS; the Japanese cohort compares sequence variants
    with OS after profiling enrollment, with only three STAG2-mutant cases. A nonsignificant result
    under these differences does not establish a population interaction, mechanistic ancestry effect
    or failure to replicate the same endpoint.
  citations:
  - PMID:36221002
  - PMID:41206913
- claim_id: ancestry-reversed
  statement: African and Asian populations have shorter GGAA repeats at key loci
  disposition: REJECTED
  report_quote: African and Asian populations have shorter GGAA repeats at key loci
  rationale: >-
    PMID:22749036 studied African- and European-descent healthy subjects, not Asian subjects. NR0B1
    repeats were significantly longer in African subjects, while CAV1 distributions were similar.
    The report reverses direction and adds an unstudied population; the proposed explanation of Japanese
    STAG2 prognosis is unsupported.
  citations:
  - PMID:22749036
  - PMID:41206913
- claim_id: ihc-not-epigenetic
  statement: epigenetic silencing ~27% by IHC
  disposition: REJECTED
  report_quote: epigenetic silencing ~27% by IHC
  rationale: >-
    IHC measures absent protein, not an epigenetic mechanism. The 29/108 localized fraction includes
    multiple possible genetic and non-genetic causes. Limited paired sequencing cannot assign every
    IHC-negative case to epigenetic silencing.
  citations:
  - PMID:36221002
  - PMID:25186949
- claim_id: portal-spectrum
  statement: STAG2 mutated in 10.3% and 15.7% respectively; 93% of STAG2 mutations are
    loss-of-function
  disposition: NEEDS_VERIFICATION
  report_quote: STAG2 mutated in 10.3% and 15.7% respectively; 93% of STAG2 mutations are
    loss-of-function
  rationale: >-
    The source exports, exact study IDs, code, sample membership and unique-patient denominators
    are absent. Twenty-nine mutation events need not equal twenty-nine mutated patients. Published
    cohort rates are curated independently; these numerical recomputations are not promoted.
  citations:
  - PMID:25186949
  - PMID:25223734
  analysis_ids:
  - cbio-mutation-analysis
- claim_id: portal-exclusivity
  statement: perfect mutual exclusivity between STAG2 and CDKN2A point mutations (0
    co-mutations).
  disposition: REJECTED
  report_quote: perfect mutual exclusivity between STAG2 and CDKN2A point mutations (0
    co-mutations).
  rationale: >-
    Zero joint point mutations is not a test of the published relationship with CDKN2A deletions,
    and no denominator, coverage or deletion calls are supplied. The portal cohorts may derive from
    the same primary studies, precluding a claim of independent validation.
  citations:
  - PMID:25223734
  analysis_ids:
  - cbio-mutation-analysis
- claim_id: portal-tp53
  statement: STAG2+TP53 co-mutation confirmed in 9/29 STAG2-mutant cases (31%)
  disposition: NEEDS_VERIFICATION
  report_quote: STAG2+TP53 co-mutation confirmed in 9/29 STAG2-mutant cases (31%)
  rationale: >-
    No executed record establishes the calculation or whether 29 counts events, samples or patients.
    The primary whole-genome study supports an association with TP53 and poor outcome; that literature
    result does not validate this unarchived reanalysis.
  citations:
  - PMID:25223734
  analysis_ids:
  - cbio-mutation-analysis
- claim_id: stag1-dependence
  statement: STAG1 is synthetic lethal with STAG2 loss
  disposition: QUALIFIED
  report_quote: STAG1 is synthetic lethal with STAG2 loss
  rationale: >-
    Genetic perturbation studies support STAG1 dependence, but noncompensation at enhancers and mitotic
    synthetic lethality are distinct mechanisms. This is a potential therapeutic strategy, not evidence
    of an available effective STAG1 drug or human treatment benefit.
  citations:
  - PMID:29649003
  - PMID:32467316
  - PMID:39487368
- claim_id: repair-generalization
  statement: STAG2 loss impairs replication fork progression, creating synthetic lethality with
    PARP and ATR inhibitors
  disposition: QUALIFIED
  report_quote: STAG2 loss impairs replication fork progression, creating synthetic lethality
    with PARP and ATR inhibitors
  rationale: >-
    Broader cancer-cell studies, including selected Ewing experiments, motivate Ewing-specific investigation.
    They do not establish STAG2 as a clinical predictor of PARP/ATR benefit, nor should non-Ewing
    HR experiments become an unqualified Ewing causal edge.
  citations:
  - PMID:30975996
  - PMID:37985839
  - PMID:31724813
- claim_id: six1-bridge
  statement: This link is speculative but testable.
  disposition: QUALIFIED
  report_quote: This link is speculative but testable.
  rationale: >-
    The report correctly labels the proposed STAG2-to-SIX1 bridge speculative. SIX1-mediated metastasis
    regulation does not demonstrate that STAG2 acts through SIX1; preserve it as a possible experiment
    rather than a curated established edge.
  citations:
  - PMID:37468459
- claim_id: database-global-absence
  statement: No GenCC, ClinGen, or ClinVar gene-disease curation exists for somatic STAG2 in
    any cancer.
  disposition: NEEDS_VERIFICATION
  report_quote: No GenCC, ClinGen, or ClinVar gene-disease curation exists for somatic STAG2 in
    any cancer.
  rationale: >-
    No versioned queries support this exhaustive negative. These resources have different germline/variant/validity
    scopes and are not interchangeable somatic mechanism catalogs. The statement cannot be used as
    biological refutation or as evidence of zero cancer annotation.
- claim_id: trial-absence
  statement: Zero trials on ClinicalTrials.gov mention STAG2 or cohesin in Ewing sarcoma.
  disposition: NEEDS_VERIFICATION
  report_quote: Zero trials on ClinicalTrials.gov mention STAG2 or cohesin in Ewing sarcoma.
  rationale: >-
    No registry query, date or result artifact establishes a completed negative search. Existing
    trials lacking an explicitly reported stratification can be described individually, but a global
    absence is not demonstrated.
- claim_id: patient-validation
  statement: all enhancer-level data derive from cell lines rather than primary tumors
  disposition: QUALIFIED
  report_quote: all enhancer-level data derive from cell lines rather than primary tumors
  rationale: >-
    Detailed causal perturbation and contact experiments are cell-model based, while patient tumors
    contribute expression/signature associations. Primary tumor repeat-resolved chromatin validation
    remains a reasonable gap; do not describe the model as entirely without patient support.
  citations:
  - PMID:41950086
  - PMID:39487368
  - PMID:36221002

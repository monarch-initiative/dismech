schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: cohesin_modified_high_risk_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The mechanistic core is sound and mostly already curated: STAG2 loss
  redistributing EWS-FLI1 away from short GGAA repeats toward multimeric ones,
  the parallel PRC2 and CTCF arms, the COG prognostic association, and its
  failure to replicate in a Japanese cohort are all in the entry with the same
  citations. Three things the report adds are worth having and are integrated -
  that STAG1 cannot substitute for STAG2 at CTCF-free enhancers and is a
  synthetic-lethal dependency of STAG2-deficient cells, that STAG2 loss in Ewing
  sarcoma occurs partly through nongenetic mechanisms (which is what reconciles
  the entry's 17% mutation frequency with the 27% protein-loss rate it cites
  beside it), and that STAG2 loss raises EWS-FLI1 protein abundance by an
  entirely uncharacterised route. Set against that, this report has the worst
  source-handling of the four. It inverts its cited population-genetics source:
  Beck et al. found African NR0B1 microsatellites to be larger, and the report
  twice states the opposite and then builds its explanation of the Japanese
  cohort discrepancy on the inverted version. Its two proposed ontology terms are
  both invalid - MONDO:0007898 is "leukocyte nuclear appendages, hereditary
  prevalence of", not Ewing sarcoma, and GO:0016569 was obsoleted. Its cBioPortal
  analysis reports precise mutation-spectrum percentages from 222 samples with no
  query, no export, and no committed output, so none of those numbers can be
  checked. And its closing assertion that all PMID citations were verified is not
  consistent with the directional misreading a single abstract check exposed.
data_sources:
  - data_source_id: cbioportal-ewing-222
    source_type: DATABASE
    name: cBioPortal Ewing sarcoma studies (stated as DFCI N=107 and Institut Curie N=115)
    uri: https://www.cbioportal.org/
    access_status: UNVERIFIABLE
    cohort: >-
      222 Ewing sarcoma samples across two studies as described by the report;
      study identifiers, portal version, and access date are not given.
    notes: >-
      The report presents this as its own analysis and derives specific figures
      from it (STAG2 mutated in 10.3% and 15.7%; 93% loss-of-function with 41%
      nonsense, 41% frameshift, 10% splice site; R216* recurrent in 5 of 29;
      STAG2/TP53 co-mutation in 9 of 29; zero STAG2/CDKN2A co-mutations). No
      study identifier, query URL, download, export, or date is recorded and no
      artifact is committed under this hypothesis directory, so access cannot be
      established and the derived percentages cannot be reproduced. Prose is not
      an access record.
  - data_source_id: clinvar-gencc-clingen-stag2
    source_type: DATABASE
    name: ClinVar, GenCC, and ClinGen gene-disease curation for somatic STAG2
    uri: https://www.ncbi.nlm.nih.gov/clinvar/
    access_status: UNVERIFIABLE
    notes: >-
      The report asserts that no ClinVar, GenCC, or ClinGen gene-disease curation
      exists for somatic STAG2 in any cancer, and repeats this as a knowledge
      gap. No query string, search date, or response is recorded and no search
      log is committed, so this cannot be graded SEARCHED_NO_RESULT. The claim is
      also framed in a way that partly answers itself: ClinVar records variant
      interpretations rather than somatic gene-cancer assertions, and ClinGen and
      GenCC curate germline gene-disease validity, so absence there is close to
      expected and carries little evidential weight.
  - data_source_id: uniprot-stag2
    source_type: DATABASE
    name: UniProt annotation for STAG2
    uri: https://www.uniprot.org/
    access_status: CITED_NOT_ACCESSED
    notes: >-
      The report states that UniProt annotates STAG2 only for developmental
      cohesinopathies (MIM:301022, 301043) with no cancer annotation. No
      accession, entry version, or retrieval date is given and no artifact is
      committed, so this is a cited assertion rather than an inspected record.
  - data_source_id: clinicaltrials-parp-ewing
    source_type: DATABASE
    name: ClinicalTrials.gov records for olaparib and talazoparib in Ewing sarcoma
    identifier: NCT01583543
    access_status: CITED_NOT_ACCESSED
    notes: >-
      NCT01583543 (olaparib) and NCT02116777 (talazoparib) are named to support
      the claim that completed PARP inhibitor trials exist but none stratified by
      STAG2 status. No registry field, arm description, result posting, or
      retrieval date is quoted and no artifact is committed. The claim that no
      trial stratified by STAG2 status is plausible but was not verified in this
      review.
  - data_source_id: report-literature-corpus
    source_type: OTHER
    name: The report's own primary-literature corpus
    access_status: UNVERIFIABLE
    notes: >-
      The closing line describes systematic evaluation of 28 primary references
      and 65 total papers across five investigation iterations, while frontmatter
      declares citation_count 32. No search strategy, screening record, or
      excluded-study list survives, so neither the 65-paper screened set nor the
      iteration structure is reconstructable.
analyses:
  - analysis_id: cbioportal-stag2-mutation-spectrum
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Tabulation of STAG2 alteration frequency, variant-consequence spectrum,
      recurrent hotspot, and pairwise co-occurrence with TP53 and CDKN2A across
      two cBioPortal Ewing sarcoma studies.
    comparison: >-
      STAG2-mutant against STAG2-wild-type samples for co-occurrence, and STAG2
      against CDKN2A point mutations for mutual exclusivity.
    input_data_source_ids:
      - cbioportal-ewing-222
    status_reason: >-
      No query, export, script, or result table is committed, and the two studies
      are identified only by institution rather than by cBioPortal study id. The
      mutual-exclusivity result is additionally not equivalent to the published
      finding it is offered as confirming: Tirode et al. reported exclusivity
      between STAG2 mutations and CDKN2A deletions, whereas the report tests
      STAG2 against CDKN2A point mutations, which are not the alteration class at
      issue and are rare, so zero co-occurrence there is close to uninformative.
      Execution cannot be substantiated and the comparison as described does not
      establish the claim.
    limitations: >-
      Denominators are inconsistent across the reported statistics: percentages
      are given per study (10.3% and 15.7%) while spectrum and co-occurrence
      counts are pooled over 29 mutations, and 10.3% of 107 plus 15.7% of 115
      does not reach 29, so the pooled denominator is not derivable from the
      figures given.
  - analysis_id: synthesis-figure-generation
    status: FAILED
    auditability: UNVERIFIABLE
    method: >-
      Generation of five inline synthesis figures covering evidence synthesis,
      the STAG2 mutation landscape, competing models, a final synthesis
      dashboard, and a final summary.
    status_reason: >-
      The report embeds {{figure:...}} placeholders for evidence_synthesis.png,
      mutation_landscape.png, final_synthesis_dashboard.png,
      competing_models.png, and final_summary.png. No artifact directory exists
      beside the report and none of these files is committed, so the placeholders
      never resolved. The mutation_landscape figure in particular is the only
      offered rendering of the cBioPortal result, so its absence leaves that
      analysis with no inspectable output at all.
claims:
  - claim_id: stag2-multimeric-enhancer-redistribution
    statement: >-
      STAG2 loss removes EWS-FLI1 binding at short GGAA repeats while increasing
      binding and output at multimeric GGAA enhancers, and cohesin-STAG2 mediates
      contact between long GGAA neo-enhancers and their promoters.
    disposition: RETAINED
    report_quote: >-
      The convergence of these two studies — one focused on binding
      redistribution, the other on 3D chromatin contact changes — provides robust,
      complementary evidence for the enhancer amplification arm of the hypothesis.
    rationale: >-
      Accurate, and the two studies are genuinely independent and methodologically
      complementary. Both are already curated on the STAG2-Modified Enhancer State
      node with these citations, and the entry's hypothesis description already
      states the selective-amplification model. The report's own caveat that both
      studies are cell-line-based is correct and is already reflected in the
      node's PROVISIONAL mechanism confidence. No integration follows.
    citations:
      - PMID:41950086
      - PMID:39487368
  - claim_id: stag2-prognostic-with-population-qualifier
    statement: >-
      STAG2 protein loss marks adverse prognosis in localized Ewing sarcoma in a
      COG cohort, but the association did not replicate in a Japanese cohort where
      CDKN2A/CDKN2B deletions were prognostic instead.
    disposition: RETAINED
    report_quote: >-
      the prognostic impact varies by population, with a Japanese cohort showing
      no significant survival difference
    rationale: >-
      Both halves are correct and both are already curated, the COG result on the
      STAG2 node and genetic entry and the Japanese cohort as an explicit
      qualifier on the hypothesis description. The report deserves credit for not
      burying the non-replication. No integration follows.
    citations:
      - PMID:36221002
      - PMID:41206913
  - claim_id: stag2-dual-mechanism-prc2-ctcf
    statement: >-
      STAG2 loss acts through EWS-FLI1-dependent enhancer changes and also through
      PRC2-mediated silencing and CTCF-dependent contacts that are independent of
      fusion binding, so enhancer amplification is only one arm.
    disposition: RETAINED
    report_quote: >-
      the enhancer amplification model is real but represents only one arm of
      STAG2's contribution to aggressiveness
    rationale: >-
      Correct and already curated: the STAG2 node cites Adane for the PRC2 arm and
      Gimenez-Llorente for the CTCF arm, and both the node description and the
      hypothesis description name the unresolved competition between the enhancer,
      PRC2, and DNA-damage arms. The entry also already carries an open discussion
      asking which arm explains high-risk disease. No integration follows.
    citations:
      - PMID:34129824
      - PMID:39487368
  - claim_id: stag1-noncompensation-and-synthetic-lethality
    statement: >-
      STAG1-containing cohesin cannot substitute for STAG2 at CTCF-free enhancers,
      and STAG1 is a selective synthetic-lethal dependency of STAG2-deficient
      cells.
    disposition: RETAINED
    report_quote: >-
      This non-compensation creates a therapeutic vulnerability: STAG1 is
      synthetic lethal with STAG2 loss
    rationale: >-
      Both halves verified. Kojic et al. report that cohesin-SA2 localises to
      enhancers lacking CTCF, is linked to tissue-specific transcription, and
      "cannot be replaced by the SA1-containing cohesin complex when SA2 is
      absent". Van der Lelij et al. report genome-wide CRISPR screens in isogenic
      lines identifying STAG1 as the most prominent and selective dependency of
      STAG2-deficient cells, with degron-mediated STAG1 degradation causing rapid
      death in STAG2-deficient cells while sparing wild-type. This is a real gap
      in the entry, which mentioned STAG1 nowhere: the non-interchangeability is
      the reason STAG2 loss has an enhancer-specific consequence at all rather
      than being buffered. Integrated on the STAG2 node, with the cross-cancer
      provenance of both studies stated in the explanations - neither is
      Ewing-specific, and the entry already sets that precedent for
      PMID:30975996.
    citations:
      - PMID:29867216
      - PMID:32467316
  - claim_id: stag2-nongenetic-inactivation
    statement: >-
      STAG2 loss in Ewing sarcoma occurs by point mutation, rearrangement, and
      likely nongenetic mechanisms, and is associated with disease dissemination.
    disposition: RETAINED
    report_quote: >-
      STAG2 was lost in 29/108 (27%) localized cases by IHC — a higher rate than
      the ~15% mutation frequency, consistent with non-genetic mechanisms of STAG2
      inactivation reported by Crompton et al.
    rationale: >-
      Verified verbatim against the cached Crompton abstract. This resolves a
      discrepancy the entry currently leaves standing without comment: the genetic
      section records STAG2 at 17% frequency while the node beside it cites a
      protein-loss study whose IHC rate is substantially higher. Nongenetic
      inactivation is why both numbers can be right, and it also matters for how a
      STAG2-defined subgroup should be ascertained. Integrated on the STAG2
      genetic entry.
    citations:
      - PMID:25186949
  - claim_id: stag2-loss-raises-ewsfli1-protein-mechanism-unknown
    statement: >-
      STAG2 loss increases EWS-FLI1 protein abundance, and no study has tested
      whether this occurs through the known ubiquitin-proteasome turnover pathway
      for the fusion.
    disposition: RETAINED
    report_quote: >-
      Eyunni et al. (2026) reported increased EWS-FLI1 protein abundance upon
      STAG2 loss, but the mechanism is entirely uncharacterized.
    rationale: >-
      The observation is present in the cached Eyunni record ("increased EWS-FLI1
      protein abundance, STAG2 loss eliminates over 40% of EWS-FLI1..."), and the
      turnover pathway the report points at is real: the cached Gierisch record
      shows USP19 deubiquitinates and stabilises the fusion, with depletion
      lowering and active USP19 raising protein levels. The gap is well posed
      because the entry already curates both endpoints separately - a
      STAG2-Modified Enhancer State node and an EWS-FLI1 Hub and Dosage Control
      node built on TRIM8-mediated turnover - without any link between them, and a
      dose increase would feed straight back into the enhancer phenotype.
      Integrated as an open knowledge gap rather than as a mechanism edge, since
      the connection is exactly what is untested.
    citations:
      - PMID:41950086
      - PMID:30700749
  - claim_id: ggaa-architecture-explains-population-discrepancy
    statement: >-
      African and Asian populations carry shorter GGAA repeats at key loci, which
      reduces the substrate for STAG2-loss-mediated enhancer amplification and
      explains why the STAG2 prognostic effect did not replicate in a Japanese
      cohort.
    disposition: REJECTED
    report_quote: >-
      Beck et al. (2012; [PMID: 22749036](https://pubmed.ncbi.nlm.nih.gov/22749036/))
      demonstrated that NR0B1 GGAA microsatellites are significantly longer in
      European versus African populations.
    rationale: >-
      The cited source says the opposite. Beck et al. report that "the NR0B1
      microsatellite in African subjects was significantly larger, harboring more
      repeat motifs, a greater number of repeat segments, and longer consecutive
      repeats, than in European subjects", and note the implication runs "in
      unanticipated ways" precisely because more repeats would predict more
      EWS/FLI activation in the lower-incidence population. The report states the
      direction backwards twice and then uses the inverted version to build a
      substrate-availability explanation for the Japanese non-replication. The
      inversion is load-bearing: reversed, the argument predicts a stronger, not
      weaker, STAG2 effect in the compared population. The paper also studied
      African versus European subjects and says nothing about Asian populations,
      so extending it to a Japanese cohort has no basis in the source. Nothing
      from this chain is integrated.
    citations:
      - PMID:22749036
      - PMID:41206913
  - claim_id: cbioportal-222-sample-analysis
    statement: >-
      An independent analysis of 222 Ewing sarcoma samples in cBioPortal confirmed
      the STAG2 loss-of-function spectrum, the R216* hotspot, STAG2/TP53
      co-occurrence, and STAG2/CDKN2A mutual exclusivity.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Analysis of 222 Ewing sarcoma samples across two cBioPortal studies (DFCI
      N=107, Institut Curie N=115) independently validated key genomic features
    rationale: >-
      Presented as the report's own computation and used to upgrade the
      mutual-exclusivity claim to ESTABLISHED, but nothing supporting it is
      committed - no study identifier, query, export, or table - so no figure can
      be checked. The exclusivity test as described is also not the published
      claim it is offered as confirming: Tirode reported exclusivity between STAG2
      mutations and CDKN2A deletions, and the report tests CDKN2A point mutations
      instead, where zero co-occurrence is close to expected regardless. The
      reported denominators do not reconcile either. Marked NEEDS_VERIFICATION
      rather than rejected because the underlying figures are individually
      plausible and consistent with published Ewing sarcoma genomics; they simply
      cannot be relied on as independent confirmation. Not integrated: the entry
      already sources STAG2 frequency and STAG2/TP53 co-occurrence from the
      published WGS study.
    analysis_ids:
      - cbioportal-stag2-mutation-spectrum
    citations:
      - PMID:25223734
  - claim_id: primary-tumor-chromatin-data-absent
    statement: >-
      No study has profiled EWS-FLI1 enhancer redistribution in primary Ewing
      sarcoma tumours, so the enhancer arm of the model rests entirely on cell
      lines.
    disposition: RETAINED
    report_quote: >-
      | Primary tumor enhancer redistribution | **NOT TESTED** | 0 primary tumor
      chromatin studies |
    rationale: >-
      Consistent with the two mechanistic studies actually cited, both of which
      are cell-line based, and it is an honestly declared limit rather than an
      inflated finding. Not separately integrated: the entry's STAG2 node is
      already marked PROVISIONAL, its hypothesis description already flags the
      enhancer-versus-PRC2-versus-DDR question as unresolved, and the existing
      open discussion on which causal arm explains high-risk disease is where a
      primary-tumour chromatin study would be the resolving experiment. Adding a
      second discussion saying the same thing would duplicate it.
    citations:
      - PMID:41950086
      - PMID:39487368
  - claim_id: candidate-ontology-terms-valid
    statement: >-
      The report's proposed ontology bindings are usable curation leads.
    disposition: REJECTED
    report_quote: >-
      - **Disease:** MONDO:0007898 (Ewing sarcoma)
    rationale: >-
      Two of the proposed terms are wrong. MONDO:0007898 resolves to "leukocyte
      nuclear appendages, hereditary prevalence of", an unrelated concept; Ewing
      sarcoma is MONDO:0012817, which is what the entry already uses. GO:0016569,
      offered as "covalent chromatin modification", is obsolete - it was retired
      on the grounds that it names a molecular function rather than a biological
      process - and is absent from this repository's GO cache. GO:0006355 is also
      given under its superseded label; the current label is "regulation of
      DNA-templated transcription". Only GO:0051276 and GO:0045944 are usable, and
      both are already bound elsewhere in the entry. No proposed term was adopted.
  - claim_id: citation-verification-assertion
    statement: >-
      All PMID citations in the report were verified against available abstracts.
    disposition: REJECTED
    report_quote: >-
      All PMID citations verified against available abstracts.
    rationale: >-
      Whatever check was run did not catch a directional inversion of
      PMID:22749036 that a single reading of that abstract exposes, and the same
      inverted reading appears twice and carries an explanatory argument. Paired
      with an invalid MONDO CURIE and an obsolete GO term in the curation leads,
      the assertion overstates the verification that took place. It should not be
      read as licence to promote the report's snippets without independent
      checking - and in this repository, none of them may be promoted without
      re-derivation from the reference cache in any case.
    citations:
      - PMID:22749036
  - claim_id: retain-emerging-status
    statement: >-
      The hypothesis should keep EMERGING status pending primary-tumour chromatin
      validation, a mechanism for the EWS-FLI1 protein increase, and
      STAG2-stratified therapeutic data.
    disposition: RETAINED
    report_quote: >-
      **Recommended status:** Maintain **EMERGING**
    rationale: >-
      Agreed. The entry already reads EMERGING for this hypothesis group and all
      three upgrade criteria remain unmet - the second of which is now recorded as
      an explicit knowledge gap in the entry as a result of this review. No status
      edit made.
    citations:
      - PMID:41950086

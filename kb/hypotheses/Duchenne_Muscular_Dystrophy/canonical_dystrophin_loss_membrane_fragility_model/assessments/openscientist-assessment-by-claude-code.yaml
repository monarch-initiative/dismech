analyses:
  - analysis_id: an-a1-a2-clinvar-spectrum-and-frame
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      esummary tabulation of pathogenic and likely pathogenic DMD records into
      mechanism classes by cDNA HGVS, with intronic-offset correction, then a
      Fisher exact test with Woolf confidence intervals for whether truncating
      alleles predict a Duchenne rather than Becker condition tag.
    comparison: truncating versus frame-preserving alleles against Duchenne versus Becker condition tags
    input_data_source_ids:
      - ds-clinvar
    software:
      - software_name: pandas
        software_version: 3.0.0
      - software_name: scipy
        software_version: 1.16.3
      - software_name: statsmodels
        software_version: 0.14.6
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_plp_frame.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_plp_classified.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig01_clinvar_allele_class_spectrum.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_1.json
    status_reason: >-
      The computation ran and its output tables and figure are committed, and
      the figure payload carries the plotting code. It is not SUCCEEDED because
      the analysis code the report cites as code/01 is absent from the bundle,
      so the mechanism classification and the frame arithmetic cannot be
      re-executed. The report's own list of artifacts it did not produce does
      not mention this.
    limitations: >-
      The negative result is a property of ClinVar's annotation practice, not of
      the reading-frame rule, and the report says so explicitly and gives two
      specific annotation artifacts that explain it. 1165 of 3530 records have
      no parseable cDNA coordinate and 250 copy-number events have unresolvable
      frame, so a third of the corpus is outside the test by construction.
  - analysis_id: an-a2b-trial-portfolio
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Keyword labelling of intervention names and brief summaries into
      mechanistic target categories, counted by unique registry identifier.
    comparison: dystrophin-restoring or surrogate targets versus downstream and parallel mechanisms
    input_data_source_ids:
      - ds-clinicaltrials-v2
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinicaltrials_dmd_classified.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig02_clinicaltrials_mechanism_portfolio.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_2.json
    status_reason: >-
      Outputs and snapshot committed, code/02 absent. A regex over free text is
      the weakest method in the run and its result is a descriptive census
      rather than a test, so little turns on re-execution; the 181 unclassified
      or supportive studies out of 359 bound how much the counts can carry.
    limitations: >-
      Counting trials by mechanism measures where the field has placed its bets,
      not whether a mechanism is correct. The report uses it appropriately, to
      show that as many registered programmes target downstream or parallel
      mechanisms as target dystrophin itself.
  - analysis_id: an-a3a-exon-skip-amenability
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Genomic intervals of ClinVar copy-number events mapped onto exon ranks,
      then modulo-three span arithmetic to compute which single-exon skip would
      restore frame.
    comparison: computed single-exon skip amenability against published patient-registry fractions
    input_data_source_ids:
      - ds-clinvar
      - ds-ensembl-rest
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_cnv_exonmapped.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig03_exon_skip_amenability_validation.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_3.json
    status_reason: >-
      Outputs committed, code/03 absent. This is the run's one external
      validation of its own machinery and it passes, reproducing published
      registry fractions for exons 51, 45 and 53 to within two to three
      percentage points, and recovering both known deletion hotspots. That is
      the strongest reason to trust the frame arithmetic used downstream, and it
      is also the reason the absence of the code is a real loss rather than a
      formality.
    limitations: >-
      Agreement with registry fractions validates the arithmetic, not the
      ClinVar sample, which is a submission-biased convenience set rather than a
      patient cohort.
  - analysis_id: an-a3b-domain-frame-corrected
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Fisher exact test per dystrophin domain with Benjamini-Hochberg
      correction, plus logistic adjustment for deletion size in exons, after
      excluding gene-terminal and whole-gene-spanning deletions.
    comparison: in-frame versus out-of-frame intragenic deletions by protein domain
    input_data_source_ids:
      - ds-clinvar
      - ds-ensembl-rest
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_domain_frame_test_corrected.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig05_domain_frame_test_corrected_null.png
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_intragenic_deletions.csv
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_5.json
    status_reason: >-
      Outputs committed, analysis code absent. The corrected result is a clean
      null across all domains at FDR 1.0, both crude and size-adjusted, and the
      177 retained intragenic deletions split almost evenly by frame.
    limitations: >-
      A null across 177 deletions does not exclude a domain effect; it says this
      sample cannot see one. Zero deletions of either class touch the
      cysteine-rich domain, so that region is untested rather than negative.
  - analysis_id: an-a3b-superseded-uncorrected-domain-frame
    status: FAILED
    auditability: PARTIALLY_AUDITABLE
    method: >-
      The same domain test applied to coding-span modulo three without excluding
      gene-terminal or whole-gene deletions.
    comparison: in-frame versus out-of-frame deletions by domain, before terminal exclusion
    input_data_source_ids:
      - ds-clinvar
      - ds-ensembl-rest
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_clinvar_dmd_domain_frame_test.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig04_domain_frame_test_UNCORRECTED_artifact.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_4.json
    fallback_from_analysis_id: an-a3b-domain-frame-corrected
    status_reason: >-
      Recorded as FAILED rather than omitted because that is what it was, and
      because the run identified the failure itself. The DMD canonical coding
      sequence is 11058 base pairs, exactly divisible by three, so 23 of 25
      terminal or whole-gene deletions scored as frame-preserving despite
      removing the entire protein. The uncorrected pass produced an apparently
      decisive confirmation of the hypothesis, with the cysteine-rich
      beta-dystroglycan-binding domain at Fisher p 1.75e-05 and FDR 1.0e-04,
      which evaporated on correction. Both the superseded table and its figure
      are kept and the figure name carries the word artifact.
    limitations: >-
      This is the single most useful thing in the run for anyone building a
      frame pipeline, and it is a methodological warning rather than a finding
      about DMD.
  - analysis_id: an-a4-gse6011-presymptomatic
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Symbol collapse by maximum probe, Welch t-tests with Cohen's d and
      Benjamini-Hochberg correction, module median effect size tested against
      genome background by Mann-Whitney, and per-sample module z-scores, with
      an age-stratified contrast and a strictly age-matched infant subset.
    comparison: >-
      all DMD versus all control; DMD at or under 9 months versus control at or
      under 9 months; DMD over 9 months versus DMD at or under 9 months
    input_data_source_ids:
      - ds-gse6011
      - ds-gpl96
    software:
      - software_name: pandas
        software_version: 3.0.0
      - software_name: numpy
        software_version: 2.3.5
      - software_name: scipy
        software_version: 1.16.3
      - software_name: statsmodels
        software_version: 0.14.6
    parameters:
      - 13299 symbol-collapsed genes, 1547 significant at BH FDR below 0.05
      - positive control DMD transcript log2 fold change -1.67, Cohen's d -2.87, FDR 1.1e-07
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_GSE6011_module_scores.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_GSE6011_age_stratified_module_scores.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_GSE6011_strict_agematched_infant_test.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig06_GSE6011_module_effects_and_volcano.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_6.json
      - ../openscientist_artifacts/provenance_plot_7.json
      - ../openscientist_artifacts/provenance_plot_8.json
    environment_artifact: ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_environment_environment_record.json
    status_reason: >-
      Outputs committed with a correctly behaving positive control, code/04
      absent. The module definitions are the load-bearing choice here, since a
      module median is only as good as its membership, and they can be read off
      the committed score tables but not off any committed code.
    limitations: >-
      One cohort, on a 2006 three-prime-biased array, and the intended
      replication in GSE38417 did not run because its platform annotation
      returned HTTP 404. The report states that the single-cohort limitation
      therefore stands, which is why the findings resting on this analysis are
      marked for verification rather than qualified. The environment record is
      also incomplete by the executor's own constraint: the Python interpreter
      version is missing because sys and platform imports are blocked.

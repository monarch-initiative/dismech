summary: >-
  A hypothesis-search run on the literature template, so there is no
  ANALYSIS_STATUS contract and no execution gate to pass. It ran for 114
  minutes, returned 31 citations and eleven findings, and did real computation
  rather than only reading: gnomAD v4 hemizygote depletion, ClinVar
  allele-class and reading-frame tests, a ClinicalTrials.gov v2 portfolio
  classification, and a presymptomatic transcriptome test on GSE6011. Seven
  sources were accessed, one failed preflight and is honestly recorded as
  skipping its analysis, and two more are named as needed but not queried. Two
  of its own analyses were superseded after it found errors in them, with both
  the wrong and the corrected figure kept, and one of those self-corrections
  overturns what would have been its most decisive confirmation of the
  hypothesis. That is the behaviour the assessment process is supposed to
  reward. The verdict is PARTIALLY_SUPPORTED because the chain divides. The
  first edge is strongly supported: truncating variants in DMD are tolerated in
  hemizygous males a fifth as often as synonymous ones. Several downstream steps
  are not. The calcium-dependent protease node has no transcriptional support
  and the most muscle-specific calpain moves the other way, the
  fibro-inflammatory programme appears already complete before ambulation
  rather than accumulating through repeated injury cycles, satellite-cell
  failure looks cell-autonomous rather than the exhaustion the seed describes,
  and restoring more dystrophin does not buy more preserved walking, which is
  the prediction the interventional-validation clause rests on. The single
  'functional dystrophin' node also needs splitting, since both the population
  data and the mouse comparison say severity tracks which isoforms are lost
  rather than frame alone. One defect runs through the whole bundle and caps
  what any reader can check. The analysis table cites code paths from
  'code/01_*.py' to 'code/05_*.py' and the bundle contains no Python file at
  all, while the data section says full checksums are in MANIFEST.yaml and no
  manifest was written. The report's own 'Expected artifacts not produced'
  section lists three omissions and does not mention either of these, so the
  gap is unflagged. Output tables and figure code are committed and the figure
  payloads carry their plotting code, so every analysis is inspectable at the
  level of its results and none is re-executable. No analysis is therefore
  recorded as REPRODUCIBLE, and no claim resting on one is RETAINED. One
  declared artifact is deliberately absent from the tree:
  provenance_gnomad_v4_DMD_variants_raw.json, a 4.5 MB raw API dump the report
  itself lists among four large recoverable downloads excluded by identifier
  and sha256. Nothing here is promotable without normal reference-cache and
  evidence validation against the cited primary literature.
artifacts:
  - openscientist-assessment-by-claude-code.md

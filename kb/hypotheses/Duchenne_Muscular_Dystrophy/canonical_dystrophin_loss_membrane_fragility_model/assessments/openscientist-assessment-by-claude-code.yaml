    comparison: hemizygous male observation rate, truncating versus synonymous, within Dp427m
    input_data_source_ids:
      - ds-gnomad-v4
      - ds-ensembl-rest
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_gnomad_v4_DMD_HCpLoF_region_classified.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_tables_gnomad_v4_DMD_HCpLoF_canonical_mapped.csv
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig11_gnomad_Dp427m_truncating_depletion.png
      - ../openscientist_artifacts/kb_hypotheses_Duchenne_Muscular_Dystrophy_canonical_dystrophin_loss_membrane_fragility_model_openscientist_artifacts_figures_fig10_gnomad_tolerated_pLoF_by_canonical_exon.png
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_10.json
      - ../openscientist_artifacts/provenance_plot_11.json
    status_reason: >-
      Outputs committed, code/05 absent. The genomic re-mapping is the step that
      makes this analysis sound rather than circular, and it is precisely the
      step a reader cannot re-execute. The effect is nonetheless large and
      consistent across two framings, 12.6 percent of all HC-pLoF calls
      tolerated against 53.1 percent of synonymous, and 10.6 percent after
      restricting to genuine Dp427m truncations.
    limitations: >-
      gnomAD is depleted of severe paediatric disease by design, so the
      comparison measures selection rather than penetrance. The prespecified
      positional-gradient test was negative, so tolerance is exon-specific and
      curation should annotate specific exons rather than regions.
  - analysis_id: an-a5-superseded-positional
    status: FAILED
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Positional analysis keyed off gnomAD's own HGVS coding strings rather than
      genomic coordinates.
    comparison: position of tolerated truncating variants along the coding sequence
    input_data_source_ids:
      - ds-gnomad-v4
    output_artifacts:
      - ../openscientist_artifacts/provenance_gnomad_v4_DMD_HCpLoF_positional.csv
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_9.json
    fallback_from_analysis_id: an-a5-gnomad-depletion
    status_reason: >-
      Invalid because gnomAD returns hgvsc against whichever transcript each
      variant was annotated on, so the positions mixed transcripts. The run
      identified this itself and replaced it with genomic re-mapping. Its figure
      is the one superseded output not present in the bundle, which is
      consistent with the figure numbering skipping fig09.
    limitations: >-
      Recorded so that the corrected positional result is read as a correction
      rather than as an independent confirmation.
  - analysis_id: an-a6-gse38417-replication
    status: SKIPPED
    auditability: UNVERIFIABLE
    method: Intended independent replication of the presymptomatic module analysis in a second cohort
    comparison: DMD versus control in GSE38417
    input_data_source_ids:
      - ds-gpl6244
    status_reason: >-
      Not run. The GPL6244 annotation returned HTTP 404 on preflight and the log
      is committed. The report states that the analysis was skipped, not run and
      not reported, and that the single-cohort limitation on the presymptomatic
      finding therefore stands. No result was substituted, which is the
      behaviour the policy on tool failure and fallback asks for.
    limitations: >-
      Its absence is the specific reason the presymptomatic and
      fibrosis-timing claims are marked for verification. The replication is
      the cheapest thing anyone could do to settle them.
claims:
  - claim_id: dystrophin-truncation-strongly-selected-against
    statement: >-
      Variants that truncate the canonical muscle dystrophin isoform are
      strongly selected against in hemizygous males, supporting the first edge
      of the canonical chain.
    disposition: QUALIFIED
    report_quote: >-
      The fraction of variants observed in at least one hemizygous male is 53.1%
      for synonymous (834/1,571), 49.6% for missense (2,255/4,544) and 12.6% for
      all HC-pLoF calls (35/277), Fisher OR 0.128 (95% CI 0.089-0.185),
      p = 2.6e-39.
    rationale: >-
      A large, internally controlled effect with the right comparator and the
      right cohort for an X-linked recessive disorder, reproduced after genomic
      re-mapping onto the canonical transcript. Qualified rather than retained
      because the analysis code is absent from the bundle, so the re-mapping and
      the region classification cannot be re-executed, and because gnomAD
      measures selection against reproductive fitness rather than penetrance.
    analysis_ids:
      - an-a5-gnomad-depletion
  - claim_id: isoform-identity-outweighs-frame
    statement: >-
      Which dystrophin isoform a variant truncates matters more than whether it
      shifts the reading frame, so the single functional dystrophin node needs
      splitting by isoform.
    disposition: QUALIFIED
    report_quote: >-
      Isoform identity matters more than frame.
    rationale: >-
      The most frequent truncating call in the gene reaches 140 hemizygous males
      and is a frameshift only in a short isoform, lying in the three-prime
      untranslated region of the canonical transcript; two stop-gained calls at
      38 and 11 hemizygotes sit in canonical intron 29, which carries the Dp260
      promoter. Within the canonical isoform, splice-site loss is tolerated five
      times more often than coding-exon loss, which identifies leaky or
      frame-restoring splicing as the escape route. The mouse comparison in
      finding 9 reaches the same conclusion from the opposite direction, since
      mdx retains short isoforms and is mild while isoform-null mice are severe.
      Qualified on the same auditability grounds, and because the escaper
      examples are individual variants rather than a tested model.
    analysis_ids:
      - an-a5-gnomad-depletion
  - claim_id: clinvar-cannot-source-the-reading-frame-rule
    statement: >-
      ClinVar condition tags cannot reproduce the reading-frame rule, which is a
      source-level absence rather than evidence against the rule, so a knowledge
      base edge asserting the rule must be sourced from curated patient
      registries.
    disposition: QUALIFIED
    report_quote: >-
      It is not evidence against the reading-frame rule.
    rationale: >-
      The distinction is drawn correctly and is the kind this repository cares
      about: the test is specified by database, query, filters and date, the
      Fisher result is a wide confidence interval around a positive point
      estimate rather than a null, and two concrete annotation artifacts are
      offered that would produce exactly this failure. The report then names the
      registries that could settle it and records them as not accessed. Qualified
      because the code is absent and because a third of the ClinVar corpus is
      outside the test by construction, having no parseable cDNA coordinate or
      unresolvable copy-number frame.
    analysis_ids:
      - an-a1-a2-clinvar-spectrum-and-frame
    citations:
      - PMID:41046771
  - claim_id: exon-skip-amenability-validates-the-frame-arithmetic
    statement: >-
      Computed single-exon skip amenability reproduces published patient-registry
      fractions, validating the frame arithmetic used in the rest of the run.
    disposition: QUALIFIED
    report_quote: >-
      The computed values reproduce independent cohort estimates to within 2-3
      percentage points
    rationale: >-
      The run's only external check on its own machinery, and it passes on three
      independent exon targets while also recovering both known deletion
      hotspots. It is the main reason to take the corrected domain null and the
      amenability ceilings seriously. Qualified because the validation rests on
      code that is not in the bundle, which is the sharpest instance of the
      missing-code problem in the run.
    analysis_ids:
      - an-a3a-exon-skip-amenability
    citations:
      - PMID:34797383
  - claim_id: domain-frame-confirmation-was-an-artifact
    statement: >-
      The apparent enrichment of pathogenic in-frame deletions in the
      cysteine-rich and C-terminal domains was an artifact of frame arithmetic
      that did not exclude gene-terminal and whole-gene deletions, and
      disappears on correction.
    disposition: QUALIFIED
    report_quote: >-
      Any reading-frame pipeline that does not exclude gene-terminal and
      whole-gene deletions will systematically mislabel the most severe allele
      class as frame-preserving.
    rationale: >-
      The strongest methodological contribution in the run, and the most
      credibility-earning act in it, because the artifact had produced a clean
      confirmation of the hypothesis and the run overturned its own result. The
      mechanism is specific and checkable: the canonical coding sequence is
      11058 base pairs, divisible by three, so whole-gene deletions score as
      frame-preserving, and 23 of 25 terminal deletions were mislabelled that
      way. Both the superseded and the corrected figure are kept. Qualified
      because the arithmetic is not re-executable from the bundle, and because
      the corrected result is a null that does not exclude a domain effect.
    analysis_ids:
      - an-a3b-domain-frame-corrected
      - an-a3b-superseded-uncorrected-domain-frame
  - claim_id: fibro-inflammatory-programme-already-established
    statement: >-
      The fibrotic and inflammatory programme is already fully established in
      DMD muscle before ambulation and does not accumulate with age, which is
      not what a model of repeated injury cycles exhausting repair predicts.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Fibrosis / ECM
    rationale: >-
      The effect sizes are large and the positive control behaves correctly, with
      the dystrophin transcript at Cohen's d -2.87. But the claim is built on one
      2006 three-prime-biased array cohort of 23 cases and 14 controls, the
      age-stratified and age-matched infant contrasts cut that cohort into
      smaller pieces still, and the intended independent replication in GSE38417
      did not run because its platform annotation returned HTTP 404. The report
      says the single-cohort limitation stands, and that is the right reading. A
      quoted module name rather than a sentence is used here because the finding
      is carried by a table; the figures are in the committed module score files.
    analysis_ids:
      - an-a4-gse6011-presymptomatic
      - an-a6-gse38417-replication
  - claim_id: fatty-replacement-is-separable-from-fibrosis
    statement: >-
      Fatty replacement is a genuinely later event than fibrosis and should not
      be bundled with it as a single fibro-adipose step.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      so fatty replacement is a genuinely later event, separable from the
      fibrosis the seed bundles with it
    rationale: >-
      A directly curatable observation if it holds, since the entry and the
      sarcolemmal module both carry a combined fibro-adipose node. The adipogenic
      module shows no effect at this age while the fibrosis module is at Cohen's
      d 2.24, which is a clean dissociation within one dataset. Marked for
      verification on the same single-cohort grounds, and because an absent
      effect in young muscle is weaker evidence for a later event than a
      longitudinal or older cohort would be.
    analysis_ids:
      - an-a4-gse6011-presymptomatic
  - claim_id: protease-step-unsupported-and-sign-reversed
    statement: >-
      The calcium-dependent protease step has no coordinate transcriptional
      support, and the most muscle-specific calpain moves in the opposite
      direction, suggesting impaired repair rather than execution of proteolytic
      damage.
    disposition: QUALIFIED
    report_quote: >-
      The direction measured for the most muscle-specific calpain is downward.
    rationale: >-
      Qualified rather than retained, and the report is the reason: it states
      that calpain activation is post-translational and driven by raised
      cytosolic calcium, so a transcriptome cannot confirm or refute the step.
      The honest negative is therefore an absence of transcriptional
      corroboration, not a refutation. What is a positive observation is CAPN3
      reduction at log2 fold change -0.60 and FDR 3.3e-03, which, given CAPN3's
      role in sarcomere remodelling during regeneration, suggests a different
      causal sign from the one the entry assigns. That is a lead worth pursuing
      and not yet a curation change, and it needs the protein-level measurement
      the dataset cannot give.
    analysis_ids:
      - an-a4-gse6011-presymptomatic
    citations:
      - PMID:22443334
  - claim_id: dystrophin-dose-does-not-track-ambulation
    statement: >-
      Greater restored dystrophin does not correspond to longer preserved
      ambulation across approved exon-skipping oligonucleotides and AAV
      micro-dystrophin, which is the prediction the interventional-validation
      clause of the canonical model rests on.
    disposition: RETAINED
    report_quote: >-
      Absence of that relationship is the single most awkward fact for the
      hypothesis as written.
    rationale: >-
      Retained with no analysis link because it rests on the primary literature
      rather than on this run's computation, and because it is the most
      consequential thing in the report for the hypothesis as the entry states
      it. The entry's hypothesis description asserts that therapies restoring
      partial dystrophin provide interventional validation of the canonical
      chain. The record is more divided than that: EMBARK's primary endpoint,
      change in North Star Ambulatory Assessment at 52 weeks against placebo,
      did not reach significance, and the benefit claims beyond it rest on
      propensity-weighted external controls or on four treated patients.
      Retention is of the claim as a research lead; promoting it would require
      fetching each cited reference and verifying an exact snippet, which has
      not been done here.
    citations:
      - PMID:42510866
      - PMID:41518520
      - PMID:42944976
      - PMID:42237476
      - PMID:42396397
  - claim_id: satellite-cell-defect-is-cell-autonomous
    statement: >-
      Satellite cell dysfunction in dystrophin deficiency is cell-autonomous
      rather than the downstream exhaustion of repeated regeneration that the
      canonical chain describes.
    disposition: RETAINED
    report_quote: >-
      Strength restored without dystrophin is a result the pure membrane-fragility
      model does not predict.
    rationale: >-
      Retained as a lead on the literature, with no analysis link. The
      load-bearing result is interventional rather than correlative: EGF
      treatment in mdx restored asymmetric satellite cell division, increased
      progenitors, improved regeneration and restored muscle strength without
      restoring myofiber dystrophin. CRISPR correction in muscle progenitor cells
      improving their own proliferation and bioenergetics points the same way. If
      this holds, the entry's exhaustion step is at least partly a parallel
      cell-autonomous branch, and it also offers a mechanism for the weak
      dose-to-function relationship above, since myofiber-directed therapies
      leave the branch uncorrected. Promotion requires per-reference snippet
      verification.
    citations:
      - PMID:30713094
      - PMID:33910206
      - PMID:31574188
      - PMID:39723578
      - PMID:40643552
  - claim_id: calcium-entry-is-channel-and-ros-mediated
    statement: >-
      Calcium entry in dystrophic muscle is mediated by stretch-activated
      channels and NADPH-oxidase-dependent redox signalling as well as by
      transient membrane microruptures, so there are missing causal nodes
      between dystrophin loss and calcium overload.
    disposition: RETAINED
    report_quote: >-
      These insert missing causal nodes between dystrophin loss and calcium
      overload
    rationale: >-
      Retained as a lead on the literature, with no analysis link. It bears on
      this entry twice. It refines the entry's own calcium influx node, which
      currently attributes entry to stretched or damaged membrane alone, and the
      cited work explicitly apportions the effect between stretch-activated
      channels and short-lived microruptures rather than choosing one. It also
      bears on the competing clearance hypothesis in this entry, because the
      transcriptional correlates the run measured in GSE6011 are consistent with
      it, with CYBB raised at FDR 0.025 and TRPC1 raised at trend level, where
      the clearance-side calcium handling module showed no shift. That is
      suggestive rather than decisive and the two hypotheses remain
      unadjudicated. Promotion requires per-reference snippet verification.
    citations:
      - PMID:19604578
      - PMID:25616416
      - PMID:21900691
      - PMID:22871609
      - PMID:25329652
  - claim_id: nnos-delocalisation-is-a-parallel-mechanism
    statement: >-
      Loss of sarcolemmal nNOS targeting is a parallel, domain-specific
      mechanism producing exercise-induced functional ischemia, distinct from
      mechanical fragility.
    disposition: RETAINED
    report_quote: >-
      This explains why severity varies among in-frame Becker deletions
      depending on whether R16/17 is retained
    rationale: >-
      Retained as a lead on the literature, with no analysis link. It has the
      shape a mechanism claim should have: a specific structural requirement in
      spectrin-like repeats 16 and 17, a functional consequence measured in dog
      and in human Becker patients stratified by whether their mutation disrupts
      nNOS targeting, a rescue by delivering the repeats in trans, and a
      negative clinical record for the pathway's drugs that is reported rather
      than omitted. It explains variability the frame rule cannot, and it
      predicts that micro-dystrophins omitting those repeats underperform.
      Promotion requires per-reference snippet verification.
    citations:
      - PMID:30349485
      - PMID:30152022
      - PMID:26437761
      - PMID:31266455
      - PMID:30352768
  - claim_id: report-declares-artifacts-it-did-not-bundle
    statement: >-
      The report cites analysis code and a checksum manifest that are not in the
      artifact bundle, and its own list of artifacts it did not produce does not
      mention either omission.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Full detail with checksums is in `MANIFEST.yaml`
    rationale: >-
      Recorded as a claim because it bounds what every other claim in this
      assessment can be worth. The analysis table cites code paths from
      code/01 to code/05 and the bundle contains no Python file; the data
      section points at a MANIFEST.yaml that was never written. Neither appears
      in the report's own section on expected artifacts not produced, which
      lists three other omissions accurately, so this is an unflagged gap rather
      than a declared one. Committed output tables and the plotting code inside
      the figure payloads keep every analysis inspectable at the level of its
      results, so nothing here is unverifiable in principle, but nothing is
      re-executable either. The template is not execution-gated, so no manifest
      was required; what is at issue is the report asserting one exists. The
      verification this needs is a provider rerun that bundles the code, or an
      independent reimplementation from the committed tables.

analyses:
  - analysis_id: an-locked-de
    status: PARTIAL
    auditability: REPRODUCIBLE
    method: >-
      Gene-level differential expression. Six per-sample featureCounts files
      assembled into one matrix, Ensembl IDs mapped to approved HGNC symbols,
      low-expression filter of raw count at least 10 in at least 3 of 6 samples,
      DESeq2 median-of-ratios normalization, negative-binomial GLM with design
      by group, Wald test, Benjamini-Hochberg correction over all tested
      features with DESeq2 independent filtering disabled so that low-expressed
      target genes still receive a q-value.
    comparison: DMD (AB1071) versus healthy (AB1190), the single prespecified contrast
    input_data_source_ids:
      - ds-gse299627
      - ds-hgnc-complete-set
    software:
      - software_name: PyDESeq2
        software_version: "0.6.0"
      - software_name: Python
        software_version: 3.12.16
      - software_name: pandas
        software_version: 3.0.0
      - software_name: numpy
        software_version: 2.3.5
      - software_name: scipy
        software_version: 1.18.1
      - software_name: statsmodels
        software_version: 0.15.0
    parameters:
      - filter rule, raw count at least 10 in at least 3 of 6 samples
      - 57500 features before filtering, 17977 after
      - independent filtering disabled
      - 6265 of 17977 features at BH q below 0.05, 3143 up and 3122 down
    code_artifacts:
      - ../openscientist_artifacts/analysis.py
    environment_artifact: ../openscientist_artifacts/environment.txt
    output_artifacts:
      - ../openscientist_artifacts/gene_results.csv
      - ../openscientist_artifacts/target_gene_results.csv
      - ../openscientist_artifacts/replication_check.csv
      - ../openscientist_artifacts/normalized_counts.csv
      - ../openscientist_artifacts/count_matrix.csv
      - ../openscientist_artifacts/count_matrix_filtered.csv
      - ../openscientist_artifacts/de_summary.json
      - ../openscientist_artifacts/samples.csv
      - ../openscientist_artifacts/run_log.txt
      - ../openscientist_artifacts/MANIFEST.yaml
      - ../openscientist_artifacts/target_genes_log2fc.png
    status_reason: >-
      Execution is substantiated and the assessor reproduced the manifest's
      byte-identity claim independently: all ten primary and replay output pairs
      match by sha256sum, and the manifest hashes for analysis.py,
      gene_results.csv and normalized_counts.csv match the committed files. The
      numbers the report quotes for FBN1, FBN2, DMD and ATP2A2 match
      target_gene_results.csv exactly, so the report's locked figures are bound
      to the committed tables by content. It is recorded as PARTIAL rather than
      SUCCEEDED because the run fails the repository execution gate, which
      reports twenty-seven problems. The report carries no
      'ANALYSIS_STATUS: SUCCEEDED' line and no artifact_manifest_sha256
      frontmatter binding, and the manifest uses accession, retrieval_url and
      retrieval_date_utc where the gate requires identifier, canonical_url or
      uri, and retrieved_at or retrieval_time_utc, and carries no top-level
      provider key. Twenty-five of the twenty-seven problems follow the
      template's own prose, which names none of those keys, so they are a
      repository mismatch rather than a provider defect, and a rerun against the
      unchanged template would fail them again. Nothing has been corrected in
      the report or the manifest to make the gate pass, so the status stays at
      PARTIAL until the provider reruns or attests corrected bytes.
    limitations: >-
      Each group is a single immortalized cell line, so the three samples per
      group are replicates of one donor background and every result is
      confounded with cell-line identity; the comparison is not six independent
      samples. Transcript abundance is neither pump activity nor calcium flux,
      so the analysis cannot test the hypothesis it was run against. The
      dystrophin positive control is weak at log2 fold change -0.431 and BH
      q = 0.056, and gene-level counts cannot distinguish an out-of-frame
      lesion that preserves transcript from a labelling problem; no exon-level
      or transcript-level evidence was generated. Thirty-five percent of tested
      features reach significance in a near-symmetric split, so an individual
      significant target gene carries little evidential weight. FBN3, SLN, PLN,
      CASQ1 and TRPC6 fell below the filter in undifferentiated myoblasts and
      were reported as filtered rather than omitted. RYR1 and CASQ2 move between
      two near-zero states and their large fold changes are a property of the
      cell state rather than a finding.
  - analysis_id: an-postlock-filter-sensitivity
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Five variants of the same PyDESeq2 model re-run on the locked count matrix
      with different low-expression rules and with DESeq2 independent filtering
      enabled, plus a per-sample CPM inspection of the three dystrophic
      replicates. Reported as findings F003 and F004.
    comparison: DMD versus healthy under five filtering variants
    input_data_source_ids:
      - ds-gse299627
    software:
      - software_name: PyDESeq2
        software_version: "0.6.0"
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_2.json
    output_artifacts:
      - ../openscientist_artifacts/provenance_plot_2.png
    status_reason: >-
      Run after the manifest was closed, in memory, writing no file under the
      artifact directory. The code is committed inside the provenance plot
      payload and the figure is committed, so the work is inspectable and
      re-runnable, but the variant result tables are not committed and the
      verified replay does not cover them. The assessor did not re-execute them.
    limitations: >-
      The finding that matters here is negative and robust, that FBN2 never
      reaches significance under any variant while FBN1 holds between -1.200 and
      -1.204, so the split replication is a property of the deposited counts
      rather than of one filtering choice. The monotone gradient across the
      three dystrophic replicates is a separate warning: one dystrophic
      replicate sits inside the healthy range for FBN2 and the group means
      separate largely because of a third, which is consistent with a
      passage or batch gradient rather than a genotype effect.
  - analysis_id: an-postlock-block-permutation
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Expression-matched competitive permutation tests on the locked
      differential-expression table, 20000 draws with background genes drawn
      from the same baseMean deciles, for three prespecified gene blocks:
      fibrillin with LTBP partners, sarcoplasmic reticulum calcium handling, and
      sarcolemmal calcium entry. Reported as finding F005.
    comparison: each target block against expression-matched background genes
    input_data_source_ids:
      - ds-gse299627
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_3.json
    output_artifacts:
      - ../openscientist_artifacts/provenance_plot_3.png
    status_reason: >-
      Post-lock and read-only, with committed code and figure but no committed
      result table, as for the sensitivity analysis. Not re-executed by the
      assessor.
    limitations: >-
      This is the only result in the run that favours the hypothesis over its
      rival, with the ECM and SR calcium blocks shifted down beyond background
      and the entry block not shifted. The report itself discounts it, noting
      that the sets are small, that members move in both directions, and that
      the most abundant member of each set barely moves. It is also directly
      undercut by the run's own line-divergence analysis, which finds coherent
      downward shifts in proliferation and myoblast-identity sets of comparable
      size and significance, so a block shift of this magnitude does not
      identify calcium biology specifically.
  - analysis_id: an-postlock-within-line-nulls
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Six within-line null contrasts, each pitting one replicate against the two
      others of its own cell line with no biological contrast, and three
      between-line contrasts at matched sample count, all under the locked model
      and filter. Reported as finding F009.
    comparison: within-line replicate contrasts against the locked between-line contrast
    input_data_source_ids:
      - ds-gse299627
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_5.json
    output_artifacts:
      - ../openscientist_artifacts/provenance_plot_5.png
    status_reason: >-
      Post-lock, with committed code and figure and no committed table. Not
      re-executed by the assessor. This is the most consequential post-lock
      result in the run and the one most worth re-deriving before it is relied
      on.
    limitations: >-
      The analysis does two things at once. It shows the pipeline does not
      manufacture differential expression from technical variation, since the
      within-line nulls give a median of one significant gene against roughly
      two thousand for between-line contrasts. And it shows the published FBN2
      effect size is not distinguishable from within-line replicate noise, since
      one dystrophic replicate differs from its own two siblings by +0.788 log2
      for FBN2 and +0.720 for FBN1. The second point is a limitation of the
      dataset, not of the analysis.
  - analysis_id: an-postlock-sex-chromosome-check
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Y-chromosome marker expression and a per-chromosome dosage check on
      normalized counts for the two cell lines. Reported as finding F007.
    comparison: AB1190 versus AB1071 by chromosome
    input_data_source_ids:
      - ds-gse299627
    code_artifacts:
      - ../openscientist_artifacts/provenance_plot_4.json
    output_artifacts:
      - ../openscientist_artifacts/provenance_plot_4.png
    status_reason: >-
      Post-lock, committed code and figure, no committed table, not
      re-executed by the assessor.
    limitations: >-
      A useful control that removes one candidate confound by showing both lines
      are male with no chromosome-scale dosage difference. It does not address
      the donor-background confound, which is the one that matters.
  - analysis_id: an-postlock-line-divergence
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Proliferation, myoblast-identity and myogenic-differentiation marker sets
      tested by expression-matched permutation, a sweep of 478 HGNC gene
      families with at least eight tested genes, principal component analysis on
      the 2000 most variable genes, and an inspection of IL1RAPL1 adjacent to
      DMD on Xp21. Reported as findings F006 and F008.
    comparison: AB1071 versus AB1190 by marker set, gene family and principal component
    input_data_source_ids:
      - ds-gse299627
    status_reason: >-
      No committed artifact corresponds to these findings. They are not covered
      by any of the five provenance plot payloads, no result table was written,
      and the verified replay does not reach them, so there is nothing to
      inspect beyond the report's own prose. Recorded as reported only.
    limitations: >-
      This is the run's most important interpretive contribution and the least
      auditable part of it. If the two lines separate on 90.7 percent of
      variance on the first principal component, and proliferation and
      myoblast-identity sets shift down as coherently as the calcium sets do,
      then the block-level support for the hypothesis has an alternative
      explanation in differentiation state and growth rate. Because none of it
      is artifact-backed, it should be re-derived from the committed locked
      tables before it is cited anywhere.
claims:
  - claim_id: fbn1-replicates
    statement: >-
      The published FBN1 downregulation in dystrophic human myoblasts reproduces
      from the deposited counts of the same dataset under a standard DESeq2
      analysis.
    disposition: QUALIFIED
    report_quote: >-
      The two agree to three significant figures, on sign, on magnitude and on
      significance.
    rationale: >-
      Observed log2 fold change -1.2004 against the published -1.2, unadjusted
      p = 1.9e-13, BH q = 3.4e-12. The assessor confirmed those values against
      the committed target_gene_results.csv. The result is insensitive to the
      filtering rule, holding between -1.200 and -1.204 across five variants,
      and holds near -1.2 in each of the three single-sample between-line
      contrasts. Retained as a transcript-level observation only, and still
      subject to the cell-line confound that applies to every result in this
      design.
    analysis_ids:
      - an-locked-de
      - an-postlock-filter-sensitivity
    citations:
      - PMID:40979067
  - claim_id: fbn2-does-not-replicate
    statement: >-
      The published FBN2 downregulation does not reproduce from the deposited
      counts: the observed effect is 2.5-fold smaller and does not survive
      multiple-testing correction.
    disposition: QUALIFIED
    report_quote: >-
      The magnitude is 2.5-fold smaller and the gene does not reach q < 0.05, so
      the replication fails for FBN2.
    rationale: >-
      Observed log2 fold change -0.358 against the published -0.9, BH q = 0.111,
      confirmed by the assessor against the committed table. The gap survives
      all five filtering variants and FBN2 reaches significance in none of the
      three between-line contrasts. The report states the discrepancy without
      tuning the pipeline toward the published value and without reconciling it
      by argument, which is what the run was asked to do. This bears directly on
      the disease entry's Fibrillin-Related ECM Protein Downregulation node,
      whose supporting snippet asserts significant downregulation of both genes.
      The snippet remains an exact and correctly attributed quotation of the
      paper, so the evidence item is not defective, but the node's claim is
      weaker than it reads and the FBN2 half is not supported by the data behind
      it.
    analysis_ids:
      - an-locked-de
      - an-postlock-filter-sensitivity
    citations:
      - PMID:40979067
  - claim_id: published-fbn2-effect-within-line-noise
    statement: >-
      A fibrillin difference the size of the published FBN2 effect occurs
      between replicates of a single cell line in this dataset.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      A fibrillin difference of that size arises within a single cell line in
      this dataset.
    rationale: >-
      One dystrophic replicate differs from its own two siblings by +0.788 log2
      for FBN2 and +0.720 for FBN1, against a published disease effect of -0.9.
      If it holds, this is the strongest reason to treat the published FBN2
      figure as unreliable rather than merely unreplicated, and it is consistent
      with the independently reported monotone gradient across the three
      dystrophic replicates. It is marked for verification because it was
      computed after the manifest was closed: the code is committed inside the
      provenance plot payload but no result table is, and the verified replay
      does not cover it. Re-derive it from the committed locked count matrix
      before citing it.
    analysis_ids:
      - an-postlock-within-line-nulls
      - an-postlock-filter-sensitivity
  - claim_id: no-gene-level-coordinated-signature
    statement: >-
      There is no coordinated gene-level signature linking the ECM genes to
      sarcoplasmic reticulum calcium handling, and the SERCA paralog that
      carries essentially all the expression in these cells is unchanged.
    disposition: QUALIFIED
    report_quote: >-
      Among the SERCA paralogs, ATP2A2 carries essentially all the signal in
      these undifferentiated myoblasts (normalized mean 15,839) and does not
      differ: -0.151, q = 0.360.
    rationale: >-
      The gene-level reading is sound and the assessor confirmed the ATP2A2
      numbers against the committed table. ATP2A1 and ATP2A3 do fall but from
      normalized means of 221 and 54, RYR1 and CASQ2 move between two near-zero
      states, the LTBP block splits with LTBP1 rising, and ZNF277 rises where
      the hypothesis predicts a fall. The claim is qualified rather than
      retained because the run's own block-level test reaches the opposite
      conclusion for the same gene sets, finding the ECM and SR calcium blocks
      shifted down beyond expression-matched background. The two readings are
      compatible, since a set can shift without its dominant member moving, but
      the report's headline negative should not be quoted without the
      block-level result beside it.
    analysis_ids:
      - an-locked-de
      - an-postlock-block-permutation
  - claim_id: block-level-shift-favours-clearance-side
    statement: >-
      Read as sets rather than as individual genes, the ECM and sarcoplasmic
      reticulum calcium blocks are shifted downward beyond expression-matched
      background while the sarcolemmal entry block is not.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This is the strongest support the dataset gives the hypothesis, and it is
      weaker than the gene-level claim it was meant to support
    rationale: >-
      Needs verification on two independent grounds. It is post-lock with
      committed code and figure but no committed result table, so it is not
      covered by the verified replay. And it is undercut by the run's own
      line-divergence finding, which reports comparable coherent downward shifts
      in proliferation and myoblast-identity sets, supplying a differentiation
      state explanation for a block shift of this size that has nothing to do
      with calcium. The report is appropriately cautious about it, and that
      caution should travel with the result.
    analysis_ids:
      - an-postlock-block-permutation
      - an-postlock-line-divergence
  - claim_id: entry-model-no-transcriptional-signature
    statement: >-
      The competing entry-based model has no transcriptional signature in this
      dataset.
    disposition: QUALIFIED
    report_quote: >-
      The competing entry-based model gives no transcriptional signature.
    rationale: >-
      ORAI1, STIM1 and PIEZO1 are unchanged and the entry block fails the
      block-level test, which the assessor confirmed for the gene-level values.
      Qualified because the absence is not evidence against the entry model: the
      mechanisms that model invokes are channel gating and sarcolemmal
      permeability, which transcript abundance does not measure, and TRPC1 and
      TRPC3 do move significantly in opposite directions. The symmetric scope
      limit that protects the clearance model from this dataset protects the
      entry model too.
    analysis_ids:
      - an-locked-de
      - an-postlock-block-permutation
  - claim_id: dataset-cannot-test-calcium-clearance
    statement: >-
      Nothing in this dataset can establish that sarcoplasmic reticulum calcium
      clearance is impaired, that SERCA function is reduced, or that the
      clearance model is correct.
    disposition: RETAINED
    report_quote: >-
      Nothing in this dataset can show that sarcoplasmic reticulum calcium
      clearance is impaired
    rationale: >-
      The prespecified scope limit, honoured in the report body, in the
      interpretation section and in the manifest limitations. It is the reason
      the overall verdict is UNRESOLVED rather than weakly supported or refuted:
      the hypothesis concerns a rate of calcium transport and the dataset
      contains transcript counts, so the exploration leaves the hypothesis
      exactly where it found it. The hypothesis group's own discriminating
      measurement, phase-resolved calcium imaging, is not in this dataset.
      The claim is retained without an analysis link because it rests on what
      the dataset contains, not on whether the run executed correctly: it would
      hold even if no analysis had been performed at all.
  - claim_id: design-confounded-with-cell-line
    statement: >-
      Every differential-expression result from this design is confounded with
      cell-line identity and cannot be attributed to dystrophin deficiency.
    disposition: RETAINED
    report_quote: >-
      every differential-expression result is confounded with cell-line identity
    rationale: >-
      Retained on the series metadata rather than on any analysis link: the GEO
      per-sample characteristics give cell line AB1190 for all three healthy
      samples and AB1071 for all three dystrophic ones, so the three samples per
      group are replicates of one donor background rather than independent
      donors, and donor genotype, immortalization history, passage and
      differentiation state are not separable from dystrophin status. That is
      true of the design whatever the run's execution status. The prespecified
      limitation was honoured as a statement about the design rather than as a
      per-gene caveat. The run also corroborated it computationally, with
      between-line contrasts giving roughly two thousand significant genes
      against a within-line median of one and the first principal component
      separating the lines completely, but both of those results are post-lock
      and are recorded under their own analyses as needing verification, so they
      are not relied on here.
  - claim_id: dystrophin-positive-control-weak
    statement: >-
      The dystrophin positive control is weak, so gene-level counts alone do not
      confirm the group labels.
    disposition: QUALIFIED
    report_quote: >-
      the gene-level count by itself does not confirm the group labels
    rationale: >-
      Log2 fold change -0.431 with BH q = 0.056, a 26 percent reduction that
      misses significance while 6265 other genes reach it. The assessor
      confirmed the values against the committed table. The report draws the
      right inference and declines to choose between the two explanations: an

summary: >-
  An execution-gated differential-expression run of GSE299627, the dataset
  behind the fibrillin arm of PMID:40979067, against the clearance hypothesis.
  The run does not pass the repository execution gate. The response body opens
  with a Markdown heading instead of the required first line
  'ANALYSIS_STATUS: SUCCEEDED', so the runner refused to stamp
  artifact_manifest_sha256 into the report frontmatter and the report is not
  bound to the manifest bytes. A further twenty-five gate problems are a
  template-to-gate mismatch on the repository side rather than a provider
  failure: the gate requires the manifest keys provider, identifier,
  canonical_url or uri, and retrieved_at or retrieval_time_utc, while
  templates/hypothesis_dataset_analysis.md describes the manifest only in prose
  and names none of them. The run wrote accession, retrieval_url and
  retrieval_date_utc with correct values. Neither the report nor the manifest
  has been corrected to make the gate pass, and the stale binding is left
  stale, so the locked analysis is recorded as PARTIAL pending a provider
  rerun. The computation underneath is nonetheless sound and was verified
  independently of the manifest's own claim. All ten primary and replay output
  pairs are byte-identical by sha256sum, the manifest hashes for analysis.py,
  gene_results.csv and normalized_counts.csv match the committed files, and
  four locked target-gene results quoted in the report match
  target_gene_results.csv exactly. Scientifically the run leaves the hypothesis
  where it found it, because the dataset cannot reach it. Transcript abundance
  is not pump activity, so nothing here tests calcium clearance, and the report
  says so in the body and in the manifest. What the dataset can speak to is one
  upstream node, fibrillin downregulation, and it splits that claim: FBN1
  reproduces to three significant figures and holds under every filtering
  variant, while FBN2 is 2.5-fold smaller than published and not significant
  after correction. The design is confounded with cell-line identity throughout.
  Two post-lock findings sharpen that confound into the central limitation: a
  within-line replicate pair differs by the size of the published FBN2 effect,
  and the dystrophic line is independently less proliferative and less
  myoblast-like, which supplies a non-calcium explanation for the one coherent
  block-level shift the report treats as its strongest supporting result. The
  dystrophin positive control is weak. Nothing in this exploration is promotable
  to the disease entry without normal reference-cache and evidence validation of
  the underlying publication.

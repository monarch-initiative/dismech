limitations:
- Each group is a single immortalized cell line (healthy AB1190, DMD AB1071), so the three samples per
  group are replicates of one donor background rather than independent donors. Every differential-expression
  result from this design is confounded with cell-line identity, and the analysis cannot attribute any
  difference to dystrophin deficiency as opposed to donor genotype, immortalization history, or passage.
  This is a limitation of the design, not a caveat on individual genes. The comparison is not n=6 independent
  samples.
- Transcript abundance is not pump activity and not calcium flux. This dataset cannot show that sarcoplasmic
  reticulum calcium clearance is impaired, that SERCA function is reduced, or that the clearance-based
  model is confirmed. Permitted conclusions concern transcript levels of the named genes in these two
  cell lines; any statement about calcium handling is an inference this dataset cannot test.
- 6265 of 17977 tested genes (35 percent) reach BH q < 0.05, nearly symmetric in direction, so the prior
  probability that any prespecified gene differs significantly in this comparison is high and individual
  significant target genes carry little evidential weight.
- The dystrophin positive control is weak (log2 fold change -0.431, BH q = 0.056). Gene-level counts cannot
  distinguish an out-of-frame mutation that preserves transcript from a labelling problem; exon- or transcript-level
  evidence was not generated.
- Target genes FBN3, SLN, PLN, CASQ1 and TRPC6 fell below the low-expression filter in undifferentiated
  myoblasts and were not tested; they are reported as filtered with their raw group means, not omitted.
- The HGNC complete set is updated continuously; the exact snapshot used is checksummed in this manifest
  and cached under raw/.

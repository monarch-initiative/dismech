status: SUCCEEDED
fallback_used: false
direct_analysis_completed: true
hypothesis_id: calcium_clearance_failure_model
hypothesis_label: Impaired Calcium Clearance and ECM-Calcium Coupling Model
disease: Duchenne Muscular Dystrophy
start_time_utc: '2026-11-25T05:44:14Z'
end_time_utc: '2026-11-25T05:53:07Z'
analysis_objective: Prespecified differential-expression analysis of GSE299627 testing whether fibrillin-related
  ECM genes and sarcoplasmic-reticulum calcium-handling gene transcripts are coordinately lower in dystrophic
  human myoblasts, and whether sarcolemmal calcium-entry genes of the competing model move in the same
  comparison.
comparison:
  name: DMD_vs_healthy
  dataset: GSE299627
  organism: Homo sapiens
  tissue: skeletal muscle (paravertebral), undifferentiated skeletal myoblasts
  case_group:
    label: DMD
    cell_line: AB1071
    genotype: DMD
    samples:
    - GSM9042258
    - GSM9042259
    - GSM9042260
    n: 3
  reference_group:
    label: healthy
    cell_line: AB1190
    genotype: wildtype
    samples:
    - GSM9042255
    - GSM9042256
    - GSM9042257
    n: 3
  direction_convention: log2 fold change is DMD relative to healthy; negative means lower in DMD
  method: PyDESeq2 0.6.0 (DESeq2), median-of-ratios normalization, negative-binomial Wald test, design
    ~group
  multiple_testing: Benjamini-Hochberg over all 17977 tested genes; DESeq2 independent filtering disabled
  filter_rule: raw count >= 10 in at least 3 of 6 samples
  identifier_type: Ensembl gene ID (unversioned) in the source count files; mapped to approved HGNC symbols
    via hgnc_complete_set.txt; counts for Ensembl IDs sharing a symbol are summed (0 such cases here);
    16550 unmapped Ensembl IDs retained under their Ensembl ID
  features_before_filtering: 57500
  features_after_filtering: 17977
  genome_wide_bh_significant:
    alpha: 0.05
    total: 6265
    up_in_dmd: 3143
    down_in_dmd: 3122
  positive_control:
    gene: DMD
    log2_fold_change: -0.431182
    p_value: 0.0200882
    q_value_bh: 0.0562822
    note: 'Dystrophin transcript is 26 percent lower in the dystrophic line but does not reach BH q <
      0.05. Reported prominently: the positive control is weak and gene-level counts alone do not confirm
      the group labels.'
  replication_check:
  - gene: FBN1
    published_log2_fold_change: -1.2
    published_p: p < 0.0001
    observed_log2_fold_change: -1.200377
    observed_p: 1.879036e-13
    observed_q_bh: 3.360951e-12
    agrees: true
  - gene: FBN2
    published_log2_fold_change: -0.9
    published_p: p < 0.0001
    observed_log2_fold_change: -0.358358
    observed_p: 0.0464901
    observed_q_bh: 0.1105723
    agrees: false
    discrepancy: Sign matches but magnitude is 2.5-fold smaller than published and the gene is not significant
      after BH correction. Reported as found; the pipeline was not adjusted and the difference is not
      reconciled by argument.

schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_mitochondrial_bioenergetic_failure
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The strongest of the four Huntington disease OpenScientist reports on source
  accuracy. I fetched nine load-bearing citations into references_cache/ and all
  nine say what the report says they say, at the stated model, tissue and
  direction - including the two whose wording most invited overstatement
  (PMID:31418857 and PMID:31278192).

  Its most valuable contribution is not the supporting evidence but the negative
  result. PMID:31418857 applied mHTT-containing YAC128 brain cytosol to wild-type
  brain mitochondria and found no change in respiration, membrane potential,
  reactive oxygen species production or calcium uptake - and the result is
  stronger than the report renders it, because mHTT did bind the mitochondria,
  and enriching YAC128 mitochondria further still changed nothing. The disorder
  entry's hypothesis notes already asserted that the direct-interaction model was
  challenged, but cited nothing for it; this supplies the source.

  Its second contribution is human primary data. The Mitochondrial Dysfunction
  node in kb/disorders/Huntington_Disease.yaml previously rested on two reviews
  and nothing else. PMID:20660112 (grade-dependent mitochondrial loss in
  calbindin-positive striatal neurons from HD postmortem caudate) and
  PMID:38195181 (mtDNA mutations and reduced complex I and IV activity in HD
  skeletal muscle) are exactly the primary human evidence that node was missing.

  The verdict is not the report's own. The report says SUPPORTED with reframing;
  I record PARTIALLY_SUPPORTED, because a hypothesis that (a) has no GWAS
  modifier support, (b) has failed every clinical trial that targeted it, and (c)
  has just lost its direct-interaction limb is exactly the shape
  PARTIALLY_SUPPORTED describes - central edges supported, material unresolved
  gaps. The report's own body says all three things; only its headline verdict
  does not.

  Two ontology leads are wrong. CL:0000598 is "pyramidal neuron", not "medium
  spiny neuron" (that is CL:1001474), and GO:0000422 is offered under a
  non-canonical label. And PMID:39026894 is the bioRxiv preprint of
  PMID:39938516, which this disease entry already cites; citing both would double
  count one experiment.
data_sources:
  - data_source_id: pubmed-literature-search
    source_type: DATABASE
    name: PubMed
    access_status: UNVERIFIABLE
    query: >-
      Not stated. The report says only that the "Literature search was conducted
      via PubMed and is limited to indexed publications as of May 2026".
    notes: >-
      No search log, query string or result set is committed under the hypothesis
      directory, which holds only openscientist.md and its citations sidecar, so
      the search cannot be re-run or checked. The report footer claims 76 papers
      reviewed; openscientist.md.citations.md lists 27 PMIDs, so roughly
      two-thirds of the claimed corpus is unidentifiable.
  - data_source_id: hd-gwas-modifier-studies
    source_type: DATABASE
    name: HD onset-modifier GWAS (GeM-HD and related)
    access_status: UNVERIFIABLE
    notes: >-
      Gap 6 asserts that no mitochondrial gene has been identified as an HD GWAS
      modifier and lists "HD GWAS modifier studies (multiple large studies
      reviewed)" as what was checked, but names no study, accession, release or
      query at that point. The claim is consistent with the published record and
      is cited elsewhere in the report to PMID:41233526, a review; nothing here
      is a database check.
  - data_source_id: hd-mitochondrial-clinical-trials
    source_type: DATABASE
    name: Coenzyme Q10 and creatine clinical trials in HD
    access_status: UNVERIFIABLE
    notes: >-
      Gap 4 states that these trials failed to show disease modification and
      concedes under "What was checked" only that "Trial results are known to be
      negative". No NCT identifier, registry query or trial publication is cited
      anywhere in the report. The underlying claim is correct in the literature,
      but this report does not source it, so it was not promoted to the disease
      entry on this report's authority.
analyses:
  - analysis_id: literature-evidence-matrix
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Narrative literature synthesis rendered as a 17-row evidence matrix with
      hand-assigned direction and confidence, an ASCII causal-chain diagram, and
      a per-link "Strength of Causal Links" table.
    comparison: >-
      Seed mitochondrial/bioenergetic model versus somatic CAG expansion
      (upstream), transcriptional dysregulation (parallel/upstream),
      excitotoxicity (synergistic), proteostasis failure (parallel), and
      neuroinflammation (downstream/parallel).
    input_data_source_ids:
      - pubmed-literature-search
    status_reason: >-
      There is no openscientist_artifacts bundle for this hypothesis. Unlike its
      sibling reports this one embeds no figure placeholders, so nothing is
      claimed that does not exist; but the tables are prose and the confidence
      grades (HIGH, MODERATE-HIGH, WEAK) carry no stated rubric. The report
      itself records that "No formal meta-analysis of effect sizes across studies
      was performed".
    limitations: >-
      Two-thirds of the claimed corpus is unidentifiable from the citation
      sidecar. One cited item (PMID:39026894) is the preprint of another
      (PMID:39938516), so the matrix treats one experiment as two independent
      rows.
claims:
  - claim_id: verdict-downstream-convergent-mediator
    statement: >-
      Mitochondrial dysfunction in HD is real and pathologically significant but
      is best modelled as a downstream convergent mediator rather than an
      independent initiating event, and the hypothesis should stay CANONICAL.
    disposition: QUALIFIED
    report_quote: >-
      Verdict: SUPPORTED — with reframing as a downstream convergent mediator,
      not an independent initiating event.
    rationale: >-
      The reframing is right and is already curated in the entry's hypothesis
      notes. The grade is not. The report's own body reports no GWAS modifier
      support, uniformly failed mitochondrial-targeted trials, and a failed test
      of the direct-interaction limb; a hypothesis carrying those three findings
      is PARTIALLY_SUPPORTED, not SUPPORTED. Status left CANONICAL - the
      convergent-mediator role is not in doubt, only the initiating role, and the
      entry already says so.
    citations:
      - PMID:17018277
      - PMID:41233526
  - claim_id: pgc1a-repression-is-the-strongest-link
    statement: >-
      Transcriptional repression of PGC-1alpha by mutant huntingtin, via
      interference with the CREB/TAF4 pathway at the promoter, is the
      best-validated mechanistic route from mHTT to mitochondrial dysfunction.
    disposition: RETAINED
    report_quote: >-
      mHTT physically associates with the PGC-1α promoter, blocking its
      transcriptional activation
    rationale: >-
      Already curated in this entry from PMID:17018277, with the same genetic
      epistasis and lentiviral-rescue framing, so this restates the seed and adds
      no new support. Retained because it is correct and remains the load-bearing
      link, but it is seed-derived material and no integration followed from it.
    citations:
      - PMID:17018277
      - PMID:23602910
  - claim_id: mhtt-does-not-directly-damage-mitochondria
    statement: >-
      Mutant huntingtin does not directly impair isolated brain mitochondria,
      arguing that its mitochondrial effects are indirect.
    disposition: RETAINED
    report_quote: >-
      Brain cytosolic fractions containing mHTT from YAC128 HD mice were applied
      to wild-type brain mitochondria, with no observable impairment of
      mitochondrial respiration, membrane potential, or calcium handling
    rationale: >-
      Verified against the cached PMID:31418857 full text, and the paper is
      stronger than the report's rendering. mHTT did bind the wild-type
      mitochondria - in greater amount than mitochondria isolated from YAC128
      mice carry natively - and function was still unchanged; the authors then
      enriched YAC128 mitochondria with more mHTT and again saw no change in
      respiration, membrane potential, reactive oxygen species production or
      calcium uptake capacity. Their conclusion is explicit: mHTT "does not
      directly impair mitochondrial functions". The disorder entry asserted this
      challenge in prose with no citation behind it; promoted as a REFUTE
      evidence item on the hypothesis. The report's own caveat is fair and was
      preserved - this is one group's reconstitution assay and cannot exclude
      compartment-specific interactions in intact neurons.
    citations:
      - PMID:31418857
  - claim_id: human-postmortem-mitochondrial-loss-is-grade-dependent
    statement: >-
      Mitochondria are progressively lost from calbindin-positive spiny striatal
      neurons in HD postmortem caudate in proportion to Vonsattel grade, with
      reduced COX2, mtTFA and PGC-1alpha and a fission/fusion shift.
    disposition: RETAINED
    report_quote: >-
      Combined calbindin and mitochondrial marker immunofluorescence showed a
      significant and progressive grade-dependent reduction in the number of
      mitochondria in spiny striatal neurons, with marked alteration in size.
    rationale: >-
      Verbatim in the PMID:20660112 abstract. This is the single most useful
      addition the report makes to the entry: the Mitochondrial Dysfunction
      pathophysiology node previously carried only two review citations and no
      primary human data at all. Promoted. Note the cohort is moderate-to-severe
      grade, so it establishes the association with severity, not that
      mitochondrial loss precedes neuronal loss.
    citations:
      - PMID:20660112
  - claim_id: mtdna-mutation-burden-in-human-hd-muscle
    statement: >-
      HD skeletal muscle accumulates mtDNA mutations affecting oxidative
      phosphorylation, with reduced complex I and IV activity and impaired mtDNA
      maintenance.
    disposition: RETAINED
    report_quote: >-
      Using ultra-deep mitochondrial DNA (mtDNA) sequencing, we showed an
      accumulation of mtDNA mutations affecting oxidative phosphorylation.
    rationale: >-
      Verified in the cached PMID:38195181 text. Substantiates the "impaired
      mitochondrial DNA stability" clause that the entry's Mitochondrial
      Dysfunction node asserted without evidence. Promoted with the tissue stated
      explicitly, because this is peripheral muscle rather than brain and should
      not be read as a striatal measurement.
    citations:
      - PMID:38195181
  - claim_id: presymptomatic-oxphos-deficit-in-large-animal-model
    statement: >-
      Respiratory chain complex I, II and IV activity and citrate synthase
      activity fall in transgenic HD minipig skeletal muscle before ultrastructural
      change and locomotor impairment appear.
    disposition: RETAINED
    report_quote: >-
      significant reductions in citrate synthase activity and respiratory chain
      complexes I, II, and IV in skeletal muscle of transgenic HD minipigs,
      detectable before locomotor impairment
    rationale: >-
      Verified in the PMID:31278192 abstract, which states the biochemical
      phenotype "was detectable in TgHD minipigs prior to the development of
      ultrastructural changes and locomotor impairment". This is the report's best
      evidence on temporal ordering, which is otherwise its weakest axis, and the
      report grades its own temporal claim honestly as MODERATE. Promoted.
    citations:
      - PMID:31278192
  - claim_id: impaired-mitophagy-compounds-the-deficit
    statement: >-
      The polyglutamine tract in mutant HTT disrupts the protein complexes
      required for mitophagy, so damaged mitochondria accumulate - a clearance
      deficit acting alongside the biogenesis deficit.
    disposition: QUALIFIED
    report_quote: >-
      The presence of the polyQ tract in mutant HTT affects the formation of
      these protein complexes and determines the negative consequences of mutant
      HTT on mitophagy, leading to the accumulation of damaged mitochondria and
      an increase in oxidative stress.
    rationale: >-
      Verbatim in the PMID:32093570 abstract and mechanistically well specified.
      Qualified on scope: the paper's title is explicit that this is "a cellular
      model of Huntington disease", so it is in-vitro evidence with no in-vivo or
      human validation, and the report's own Gap 3 concedes the relative
      contribution of impaired clearance versus impaired biogenesis is
      unquantified. Promoted as a single IN_VITRO evidence item with a clause in
      the node description rather than as its own pathophysiology node, which one
      cellular study does not yet support.
    citations:
      - PMID:32093570
  - claim_id: bioenergetic-excitotoxic-feedforward-loop
    statement: >-
      Bioenergetic failure sensitizes medium spiny neurons to glutamate by
      depolarizing the membrane and lifting the voltage-dependent Mg2+ block on
      NMDA receptors, so energy failure and excitotoxicity amplify each other.
    disposition: RETAINED
    report_quote: >-
      impaired energy metabolism results in deterioration of membrane function,
      loss of the voltage-dependent Mg²⁺ block of NMDA receptors, and persistent
      receptor activation at physiological glutamate concentrations
    rationale: >-
      The mechanism statement is verbatim from PMID:8971131, a conceptual review,
      and the experimental leg is real: PMID:7582122 shows that Na+/K+ ATPase
      inhibition with ouabain or strophanthidin "dramatically increased the
      membrane depolarization and the inward current produced by subcritical
      concentrations of glutamate, AMPA and NMDA" in identified medium spiny
      neurons. The entry's hypothesis notes asserted this synergy with no
      citation; promoted as an explicit causal edge from Mitochondrial
      Dysfunction to Excitotoxicity carrying both references. Note the
      experimental evidence is pharmacological mimicry of energy failure in rat
      slices, not measurement in an HD model.
    citations:
      - PMID:8971131
      - PMID:7582122
  - claim_id: no-mitochondrial-gwas-modifiers
    statement: >-
      No mitochondrial gene has emerged as a genetic modifier of HD onset, which
      argues against mitochondrial dysfunction being a rate-limiting step.
    disposition: QUALIFIED
    report_quote: >-
      No mitochondrial genes have been identified as genetic modifiers of HD in
      GWAS — all major modifiers are DNA repair pathway genes.
    rationale: >-
      The observation is correct and is already reflected in the entry's
      hypothesis notes. Qualified because the inference is stated more firmly
      than the design supports: absence of a genome-wide significant modifier of
      onset age is weak evidence against a mechanism that the report itself
      places downstream of onset, and the report cites no GWAS study at this
      point. Its own concession that this "is likely a genuine biological finding
      rather than a gap in search coverage" is the right hedge and was kept.
    citations:
      - PMID:41233526
  - claim_id: mitochondrial-trials-failed
    statement: >-
      Coenzyme Q10 and creatine trials in HD failed to demonstrate disease
      modification.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Clinical trials targeting mitochondrial bioenergetics in HD (coenzyme Q10,
      creatine) have not demonstrated disease modification.
    rationale: >-
      Very likely true, and already asserted in the entry's hypothesis notes, but
      this report does not source it: no NCT identifier, no trial publication, no
      registry query, and the "What was checked" line says only that the results
      "are known to be negative". Not promoted to a curated evidence item on this
      report's authority. If it is to be curated it should cite the 2CARE and
      CREST-E reports directly.
    citations: []
  - claim_id: msh3-pms1-preprint-double-counted
    statement: >-
      Msh3 and Pms1 set the neuronal CAG-repeat expansion rate and drive
      selective striatal and cortical pathogenesis in Q140 mice.
    disposition: QUALIFIED
    report_quote: >-
      Wang et al. (2024) showed that Msh3 and Pms1 drive selective striatal and
      cortical pathogenesis in Q140 mice by mediating CAG-repeat migration
    rationale: >-
      The finding is correct and is already curated in this entry, but from
      PMID:39938516 (Cell, 2025). The report cites PMID:39026894, which is the
      bioRxiv preprint of that same work, and lists it as an independent
      COMPETING row in the evidence matrix alongside the published paper's
      findings. Not added; adding it would double count one experiment.
    citations:
      - PMID:39026894
      - PMID:39938516
  - claim_id: pgc1a-nucleolar-ribosomal-transcription
    statement: >-
      PGC-1alpha localizes to the nucleolus and regulates ribosomal transcription,
      a function impaired in early-stage human HD, linking PGC-1alpha loss to
      cachexia and sarcopenia.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Greiner et al. (2017) showed that PGC-1α also localizes to the nucleolus
      and regulates ribosomal transcription, a function impaired in early-stage
      human HD, providing a link between PGC-1α loss and the cachexia/sarcopenia
      seen in HD patients
    rationale: >-
      PMID:28819135 does establish the nucleolar and ribosomal-transcription
      function and its disturbance in HD. The clause the report appends - that
      this provides the link to cachexia and sarcopenia - is the report's own
      inference and not a stated result. The mechanism is interesting and the
      entry does carry weight loss and muscle weakness as phenotypes, but
      connecting them through nucleolar PGC-1alpha needs a source that makes the
      claim. Not curated.
    citations:
      - PMID:28819135
  - claim_id: candidate-ontology-terms-msn
    statement: >-
      The report proposes CL:0000598 as the CURIE for medium spiny neuron.
    disposition: REJECTED
    report_quote: "CL:0000598` (medium spiny neuron)"
    rationale: >-
      CL:0000598 is "pyramidal neuron" in the repository term cache. The correct
      CURIE is CL:1001474, which this entry already uses throughout. This is the
      second demonstrably wrong ontology lead across the Huntington disease
      OpenScientist reports (the excitotoxicity report offered the obsolete
      GO:0070997), and it is the reason report-supplied CURIEs must be
      re-derived from the caches rather than copied.
    citations: []
  - claim_id: corpus-size-not-reconstructible
    statement: >-
      The report characterizes its evidence base as 76 papers reviewed with 6
      confirmed findings.
    disposition: NEEDS_VERIFICATION
    report_quote: "76 papers reviewed | 6 confirmed findings"
    rationale: >-
      openscientist.md.citations.md lists 27 PMIDs, one of which is a preprint
      duplicate of another. Roughly two-thirds of the claimed corpus cannot be
      identified, so the breadth claim cannot be checked and was not relayed into
      the disease entry.
    citations: []

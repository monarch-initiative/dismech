source_report: ../translator.md
hypothesis_id: canonical_tsc1_tsc2_mtorc1_hyperactivation_model
assessed_at: "2026-08-02T20:30:00Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report is factually accurate about what the Translator knowledge graph
  asserts, and its two top routes recover the correct TSC disease genes, both of
  which the entry already models. It does not, however, bear on the hypothesis's
  distinctive mechanism. The canonical model's causal core is TSC1/TSC2 loss
  releasing Rheb-GTP and driving constitutive mTORC1 activity, with everolimus
  acting on mTORC1; MTOR appears in none of the returned routes, because a
  gene-intermediate two-hop query asks for genes associated with the disease and
  MTOR is correctly not a TSC disease gene. The drug-gene hops that are returned
  are also weaker than their Biolink predicate implies: the DGIdb
  everolimus-TSC1/TSC2 edges rest on pharmacogenomic response-biomarker studies,
  not on any physical or functional drug-target interaction. Useful as a
  cross-check that the entry's gene curation matches consensus resources;
  it neither supports nor refutes the mTORC1 axis.
claims:
  - claim_id: everolimus-tsc1-interaction-predicate
    statement: >-
      The reported everolimus-TSC1 and everolimus-TSC2 edges are drug-response
      biomarker associations, not drug-target interactions, and the
      `interacts_with` predicate overstates them.
    disposition: QUALIFIED
    report_quote: "Everolimus --interacts_with--> TSC1"
    rationale: >-
      All three DGIdb-cited publications describe genotype-conditioned response
      rather than an interaction between the drug and the gene product.
      PMID:22923433 reports a bladder-cancer patient with an exceptional and
      durable everolimus response whose tumour carried a loss-of-function TSC1
      mutation, framing TSC1 status as a sensitivity marker. PMID:25295501
      reports response and then acquired resistance to everolimus in anaplastic
      thyroid cancer, again keyed to mTOR-pathway genotype. PMID:23158522 is
      EXIST-1, a randomised trial of everolimus for subependymal giant cell
      astrocytoma in TSC, which establishes clinical efficacy in the disease and
      says nothing about a molecular everolimus-TSC1 interaction. The
      relationship is real and clinically important, but a curator reading
      `interacts_with` as target engagement would be wrong; everolimus binds
      FKBP12 and inhibits mTORC1, downstream of TSC1/TSC2.
    citations:
      - PMID:22923433
      - PMID:23158522
      - PMID:25295501
  - claim_id: disease-gene-recovery
    statement: >-
      TSC1 and TSC2 are correctly returned as the disease genes and match the
      pathophysiology node the entry already curates.
    disposition: RETAINED
    report_quote: "TSC1 --gene_associated_with_condition--> tuberous sclerosis"
    rationale: >-
      The gene-disease hop is attributed to ClinGen, an expert-curated
      gene-disease validity resource, and TSC1/TSC2 are the established causal
      genes for tuberous sclerosis. The tool independently matched both to the
      entry's "TSC1/TSC2 Loss of Function (Germline First Hit)" node, so this
      arm of the report functions as a consistency check on existing curation
      rather than as new information.
  - claim_id: mtor-absent-from-all-routes
    statement: >-
      The hypothesis's distinctive mechanism - mTORC1 hyperactivation as the
      target of everolimus - is absent from every returned route, and this is a
      limit of the query shape rather than evidence against the mechanism.
    disposition: NEEDS_VERIFICATION
    rationale: >-
      A two-hop query with a gene intermediate requires the intermediate to
      carry a gene-to-disease edge, and MTOR is not a tuberous sclerosis disease
      gene, so the drug -> target -> pathway chain cannot be expressed in this
      query shape. Two alternatives were tried against the same drug-disease
      pair and neither recovered it: `--via process` returned no merged result
      set at all, because no ARA answers a `biolink:BiologicalProcessOrActivity`
      intermediate; and an ARS Pathfinder run returned twelve routes through
      generic intermediates (Apoptosis, IL4, interferon-gamma, phosphorylation)
      at scores near 0.17, none through MTOR, TSC1 or TSC2. The absence should
      therefore be read as "not queryable here", not as "not asserted anywhere",
      and no conclusion about the mTORC1 axis should be drawn from this report.
  - claim_id: ifng-route
    statement: >-
      The third route, everolimus -> IFNG -> tuberous sclerosis, is unsupported
      by any cited publication and should not be treated as a lead without
      independent grounding.
    disposition: NEEDS_VERIFICATION
    report_quote: "IFNG --contributes_to--> tuberous sclerosis"
    rationale: >-
      Neither hop carries a publication in the report. The drug-gene hop is
      attributed to a targeted text-mining provider and the gene-disease hop to
      an automated aggregator (automat-robokop), so the route rests entirely on
      machine-derived assertions with no citation to check. Interferon-gamma is
      not an established contributor to tuberous sclerosis pathogenesis. The
      route is not necessarily wrong, but nothing in this report makes it
      checkable, and it is the only returned route the entry does not already
      model - which is precisely the position where an unverified lead is most
      likely to be over-read.

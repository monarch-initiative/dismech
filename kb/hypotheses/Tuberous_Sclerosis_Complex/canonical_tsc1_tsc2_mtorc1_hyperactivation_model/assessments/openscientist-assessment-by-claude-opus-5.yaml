claims:
  - claim_id: canonical-mtorc1-axis-core
    statement: >-
      TSC1/TSC2 loss of function releases Rheb-GTP and constitutively activates
      mTORC1, and this is the core pathogenic axis of tuberous sclerosis
      complex.
    disposition: QUALIFIED
    report_quote: >-
      The canonical TSC1/TSC2/mTORC1 hyperactivation model is among the most
      thoroughly validated monogenic disease mechanisms in human genetics.
    rationale: >-
      True, and independently supported by the cryo-EM structure of the TSC
      complex (PMID:33436626, already cited twice in the disorder entry) and by
      the angiomyolipoma exome study (PMID:27494029). But this is the seed
      hypothesis handed to the provider, restated. The run produced no new
      support for the core axis, so it is provider-inference-grade for this
      claim and the useful output is the qualification set below. Qualified
      rather than retained on that basis, not because the biology is in doubt.
    citations:
      - PMID:33436626
      - PMID:27494029
  - claim_id: biallelic-loss-drives-angiomyolipoma
    statement: >-
      Biallelic TSC1/TSC2 inactivation is the primary and sufficient somatic
      driver of angiomyolipoma, present in 94% of sequenced lesions against a
      very low background mutation burden.
    disposition: RETAINED
    report_quote: >-
      Whole exome sequencing of 32 angiomyolipoma/LAM samples demonstrated that
      94% harbored biallelic TSC1/TSC2 loss, with a remarkably low somatic
      mutation burden (median 4 non-synonymous mutations), confirming biallelic
      loss as the primary and sufficient driver
    rationale: >-
      Verified against the cached full text of PMID:27494029: "30 of 32 (94%)
      had biallelic loss of either TSC2 or TSC1", "a median of 4 somatic
      non-synonymous coding region mutations", and the authors' own conclusion
      that TSC2/TSC1 alterations are "the primary essential driver event".
      Every number in the report's sentence is correct. The disorder entry
      asserts the two-hit model qualitatively but had no quantitative human
      genomic anchor for it, so this is a genuine gap the report closes.
    citations:
      - PMID:27494029
  - claim_id: two-hit-model-not-universal
    statement: >-
      The two-hit requirement is not universal across TSC lesion classes:
      mesenchymal tumorigenesis proceeds from haploinsufficiency alone, requires
      HMGA2, and shows mTOR pathway activation in only about half of human
      tumours.
    disposition: RETAINED
    report_quote: >-
      However, the two-hit model is **not universal**. HMGA2-driven mesenchymal
      tumorigenesis in TSC2+/- mice occurs via haploinsufficiency without a
      second hit, and mTOR was elevated in only 50% of human mesenchymal tumors
    rationale: >-
      Verified against PMID:26837766, which states "the mTOR pathway was not
      activated in all TSC2(+/-) tumors and was elevated in only 50% of human
      mesenchymal tumors" and "haploinsufficiency of one TSC tumor suppressor
      gene was required for tumor initiation, but further tumorigenesis did not
      require the second hit, as previously postulated". The primary experiments
      are in the TSC2+/- mouse, corroborated on human tumour samples, so the
      species framing in the report is accurate. This is the strongest
      boundary condition the report produces and the disorder entry did not
      carry it.
    citations:
      - PMID:26837766
  - claim_id: everolimus-no-neurocognitive-benefit
    statement: >-
      mTORC1 inhibition with everolimus does not improve IQ, autism, or
      neuropsychological function in children with TSC aged 4-17.
    disposition: RETAINED
    report_quote: >-
      A randomized, double-blind, placebo-controlled trial (n=32, ages 4–17)
      demonstrated that everolimus (trough 5–10 ng/mL) for 12 months showed **no
      benefit** on full-scale IQ (treatment effect −5.6 IQ points, 95% CI −12.3
      to 1.0), autism, neuropsychological functioning, behavioral problems,
      social functioning, or quality of life.
    rationale: >-
      Verified line by line against PMID:31217257 (Overwater et al., Neurology
      2019): 32 randomised, ages 4-17, trough 5-10 ng/mL, treatment effect -5.6
      IQ points with 95% CI -12.3 to 1.0, and no effect on any secondary
      outcome. The paper carries a Class I evidence classification. This is the
      single most consequential item in the report and is the direct
      counterweight to the seed hypothesis's assertion that mTOR inhibitors
      "definitively" confirm the axis: the pharmacologic validation holds for
      tumours and partially for seizures, and fails for the neuropsychiatric
      arm.
    citations:
      - PMID:31217257
  - claim_id: preventive-vigabatrin-no-neurodevelopmental-benefit
    statement: >-
      Pre-emptive vigabatrin does not alter developmental or autism-specific
      outcomes in infants with TSC.
    disposition: RETAINED
    report_quote: >-
      This finding is corroborated by the PREVeNT trial (Phase IIb, n=84): no
      significant differences in developmental or autism-specific outcomes
      between preventive vigabatrin and control groups at 36 months, with ASD
      rate of 31% regardless of treatment
    rationale: >-
      Verified against PMID:41061327: 84 infants enrolled, 65 completed to 36
      months, 31% rated as having ASD with no difference by treatment
      assignment, and the authors' conclusion "No significant differences in
      developmental or autism-specific outcomes were seen between treatment
      groups". The report's n and percentage are exact. Worth noting the
      authors' own caveat, which the report omits: they attribute the null in
      part to early seizure detection and closer monitoring across all arms,
      and no participant without epilepsy was diagnosed with ASD. The disorder
      entry's vigabatrin treatment block asserted the opposite expectation
      without this counterweight.
    citations:
      - PMID:41061327
      - PMID:41135308
  - claim_id: neurodevelopment-dissociated-from-seizure-burden
    statement: >-
      Neurodevelopmental impairment in TSC is partly dissociated from seizure
      burden: abnormal trajectories appear before seizure onset and some
      children at risk of autism never develop seizures.
    disposition: RETAINED
    report_quote: >-
      The EPISTOP trial had earlier shown that 20% of children had abnormal
      developmental trajectories **before seizure onset**, and 21% of ASD-risk
      children had not developed seizures, demonstrating that neurodevelopmental
      impairment is dissociated from seizure burden
    rationale: >-
      Verified against PMID:32705817: "In 20% of children abnormal developmental
      trajectories were detected before the onset of seizures" and "21% of all
      children with risk of ASD at 24 months had not developed seizures at that
      timepoint". The same paper reports that early versus conventional
      vigabatrin made no difference to ASD or DD risk at 24 months, which
      reinforces the PREVeNT result at an earlier timepoint. The word
      "dissociated" slightly overstates a partial dissociation - the same paper
      finds children with epilepsy did have higher ASD and DD risk - so the
      claim is retained with that scope.
    citations:
      - PMID:32705817
  - claim_id: mtorc2-estradiol-cox2-lam-arm
    statement: >-
      A rapamycin-insensitive, mTORC2-dependent estradiol-COX-2-prostaglandin
      arm contributes to LAM pathology, which mTORC1-selective rapalogues do not
      address.
    disposition: QUALIFIED
    report_quote: >-
      COX-2 expression is **not** affected by rapamycin (mTORC1 inhibitor) but
      **is** reduced by Torin 1 (dual mTORC1/2 inhibitor) and Rictor knockdown
      (mTORC2-specific), demonstrating mTORC2-specific regulation
    rationale: >-
      The molecular finding is verified against PMID:24395886, which states COX-2
      "was also increased at baseline in TSC-deficient cells and was not affected
      by rapamycin treatment. However, both Torin 1 treatment and Rictor
      knockdown led to reduced COX-2 expression and phospho-Akt-S473." Qualified
      on scope: the experiments are in cultured TSC2-null cells and mouse
      xenografts, the rapamycin-insensitivity established is of COX-2
      expression, not of LAM disease progression, and the report's summary
      sentence that mTORC2 "drives LAM-specific pathology ... insensitive to
      rapamycin" reads as a disease-level claim the cited work does not make.
      Sirolimus does stabilise lung function in LAM. Retained as a real parallel
      arm, not as a competing account of LAM.
    citations:
      - PMID:24395886
      - PMID:19202070
  - claim_id: rhoa-mtor-independent-axon-guidance
    statement: >-
      TSC2 heterozygosity impairs axon guidance in human neurons through
      RHOA-dependent cytoskeletal signalling that is independent of mTOR.
    disposition: RETAINED
    report_quote: >-
      1. **RHOA-mediated axon guidance defects**: TSC2-heterozygous iPSC neurons
      show impaired axon guidance via mTOR-independent RHOA signaling in growth
      cones
    rationale: >-
      Verified against the cached full text of PMID:33972524: TSC2+/- neurons
      show reduced responses to repulsive cues, basal MTOR activity and
      MTOR-mediated protein synthesis are normal in those neurons, mTORC1 and
      mTORC2 inhibitors fail to rescue the guidance defect, and basal and
      cue-activated RHOA is diminished. Importantly this is a haploinsufficiency
      phenotype, so it does not require a second hit - which makes it consistent
      with the two-hit exception above and a plausible partial account of why
      mTOR inhibition fails for neurodevelopmental outcomes. Scope caveat: human
      iPSC-derived neurons from one patient plus engineered isogenic controls,
      not human tissue.
    citations:
      - PMID:33972524
  - claim_id: developmental-critical-window-epigenetic-fixation
    statement: >-
      mTORC1-driven neuronal abnormalities become mTORC1-independent after a
      developmental window because of maturation-dependent DNA demethylation, so
      late mTORC1 inhibition cannot reverse them.
    disposition: QUALIFIED
    report_quote: >-
      2. **Developmental critical window**: Late mTORC1 inhibition is ineffective
      in reversing gene expression changes and neuronal hyperactivity due to
      maturation-dependent DNA demethylation in TSC neurons
    rationale: >-
      The experimental result is verified against PMID:41379617: EGR1
      downregulation in TSC2-deficient excitatory neurons, impaired
      activity-dependent transcription "due to abnormalities in
      maturation-dependent DNA demethylation", and late mTORC1 inhibition "only
      partially effective in reversing gene expression changes and ineffective
      in reducing spontaneous neuronal hyperactivity". Qualified because the
      report converts this into "irreversible epigenetic changes" and a defined
      "critical window", which is the authors' own framing of an in vitro human
      iPSC neuron result; no window boundary is measured, no human in vivo
      evidence exists, and the loci, cell types and timing are unknown - a
      limitation the report itself concedes under Gap 1. Best curated as an open
      question rather than as a mechanism node.
    citations:
      - PMID:41379617
  - claim_id: rapalogues-cytostatic-via-autophagy
    statement: >-
      Rapalogues are cytostatic rather than curative because lesions regrow on
      withdrawal, and this is caused by paradoxical autophagy induction that
      keeps TSC2-deficient cells alive.
    disposition: QUALIFIED
    report_quote: >-
      Critically, tumor regrowth upon discontinuation has been documented ([PMID:
      30192751](https://pubmed.ncbi.nlm.nih.gov/30192751/)), indicating that
      rapalogues are **cytostatic, not curative** — a fundamental limitation
      traceable to paradoxical autophagy induction that promotes TSC2-deficient
      cell survival.
    rationale: >-
      Half right. PMID:30192751 does document rebound: median angiomyolipoma
      volume change from baseline moved from -70.6% at discontinuation to -50.6%
      at week 48 off drug, and 5 of 16 evaluable patients progressed relative to
      their volume at discontinuation. But the same abstract concludes "there
      was no evidence of rapid regrowth", which the report's "tumor regrowth
      upon discontinuation has been documented" flattens; and the denominators
      are small (16 evaluable of 112 who discontinued). The causal attribution to
      paradoxical autophagy induction is carried by no citation anywhere in the
      report and is provider inference. The cytostatic conclusion is retained;
      the autophagy mechanism is not.
    citations:
      - PMID:30192751
  - claim_id: exist-trial-citation-misattribution
    statement: >-
      The report's Phase III trial table attributes named EXIST trials to PMIDs
      that report different studies.
    disposition: REJECTED
    report_quote: >-
      | EXIST-2 | Angiomyolipoma | 53.3% response vs 0% placebo; 80% showed ≥50%
      reduction at 48 weeks |
    rationale: >-
      PMID:24729041 is not EXIST-2. Its own abstract identifies it as "EXamining
      everolimus In a Study of Tuberous Sclerosis Complex-1 (NCT00789828)" - the
      renal angiomyolipoma subgroup of EXIST-1. EXIST-2 is NCT00790400, a
      different trial in a different population (patients selected for
      angiomyolipoma, not for SEGA). Two further rows in the same table are
      mislabelled: PMID:23325902, cited as EXIST-1 SEGA data, is the open-label
      extension of the phase 1-2 trial NCT00411619, and PMID:23231513, source of
      the "35% response rate vs 0% placebo" figure, is a drug-profile review
      rather than a trial report. The numeric results are accurate to their
      actual sources, so this is a provenance defect rather than a fabrication -
      but the trial identities would propagate into the KB if copied, and a
      curator citing "EXIST-2" from this table would cite the wrong study.
    citations:
      - PMID:24729041
      - PMID:23325902
      - PMID:23231513
  - claim_id: myelination-requires-balanced-mtorc1
    statement: >-
      Myelin pathology in TSC correlates with cognitive and autism outcomes, and
      arises from mTORC1 OVERactivation in oligodendrocytes, so mTORC1 inhibition
      alone cannot be assumed to correct it.
    disposition: RETAINED
    report_quote: >-
      In 46 TSC patients, reduced oligodendroglia numbers correlated with lower
      IQ scores, and lower MOBP with ASD presence ([PMID:
      32954437](https://pubmed.ncbi.nlm.nih.gov/32954437/)). Critically,
      oligodendrocyte-specific mTORC1 overactivation (via TSC1 ablation) causes
      hypomyelination through downregulation of Akt signaling and lipogenic
      pathways
    rationale: >-
      Both halves verify. PMID:32954437 (n=46 resected tubers): "reduced numbers
      of oligodendroglia were associated with lower numbers on the intelligence
      quotient scale and ... lower amounts of myelin-associated oligodendrocyte
      basic protein were associated with the presence of autism-spectrum
      disorder". PMID:24948799: "oligodendrocyte-specific overactivation of
      mTORC1, via ablation of tuberous sclerosis complex 1 (TSC1), causes
      hypomyelination characterized by downregulation of Akt signaling and
      lipogenic pathways", with the authors concluding that "a delicately
      balanced regulation of mTORC1 activation ... is essential for CNS
      myelination". The human arm is correlational and the causal arm is mouse;
      the report labels them correctly. The disorder entry already annotates
      DECREASED myelination but had only a review-level citation for it and no
      human cognitive correlate.
    citations:
      - PMID:32954437
      - PMID:24948799
  - claim_id: neuroinflammation-precedes-seizure-onset
    statement: >-
      Glial inflammatory signalling in TSC precedes seizure onset and is
      therefore not merely a consequence of seizures.
    disposition: RETAINED
    report_quote: >-
      In Tsc1-GFAP CKO mice, IL-1beta and CXCL10 are elevated at 2 weeks of age
      **before seizure onset**, establishing that inflammation is not secondary
      to seizures
    rationale: >-
      Verified against PMID:26003087: increased IL-1beta and CXCL10 in
      Tsc1(GFAP)CKO neocortex and hippocampus, reversed by an mTORC1 inhibitor,
      localised primarily to astrocytes, and "observed ... at 2 weeks of age in
      Tsc1(GFAP)CKO mice before the onset of epilepsy in vivo, indicating that
      the inflammatory changes were not secondary to seizures". Blocking IL-1beta
      and CXCL10 reduced seizure frequency and prolonged survival, which makes
      this a perturbation result rather than an association. Mouse only, so the
      temporal ordering is established in the model and not in patients - the
      report does not claim otherwise.
    citations:
      - PMID:26003087
  - claim_id: nmi-cases-resolved-as-mosaic
    statement: >-
      Most TSC cases with no mutation identified by conventional testing are
      resolved as low-level mosaic TSC1/TSC2 variants by deep multi-tissue
      sequencing.
    disposition: RETAINED
    report_quote: >-
      NMI patients (10–15%) tend toward milder phenotype, and deep/long-read
      sequencing resolves 50–72% as mosaic variants
    rationale: >-
      Verified against PMID:39352229: 18 NMI participants, multi-tissue
      massively parallel sequencing, "a diagnostic yield of 72% (13/18) was
      achieved, with the majority (10/13) being mosaic variants". So 10 of 18
      (56%) of the whole NMI cohort were mosaic, and 10 of the 13 solved. The
      report's "50-72%" spans yield and mosaic fraction from two papers without
      distinguishing them, which is loose but not wrong. This upgrades the
      disorder entry's existing statement that mosaicism is "postulated" to a
      demonstrated finding in a defined cohort.
    citations:
      - PMID:39352229
  - claim_id: sst-interneuron-immaturity-in-tubers
    statement: >-
      Somatostatin-expressing interneurons in TSC cortical tubers are
      developmentally immature, with an abnormal NKCC1/KCC2 ratio indicating an
      incomplete excitatory-to-inhibitory GABA switch.
    disposition: RETAINED
    report_quote: >-
      Single-nuclei RNA-seq of TSC cortical tubers identified SST+ interneurons
      as a uniquely immature subpopulation with abnormal NKCC1/KCC2 ratio,
      indicating incomplete chloride homeostasis maturation and failure of the
      excitatory-to-inhibitory GABA switch
    rationale: >-
      Verified against PMID:38714540, which identifies "somatostatin-expressing
      (SST+) interneurons as a unique and immature subpopulation in TSC" with
      "an abnormal NKCC1/KCC2 ratio, indicating an imbalance in chloride
      homeostasis", downregulated GABRA1 and upregulated GABRA2, and altered
      deep-layer localisation. The paper's own hedge - the switch "may undergo an
      incomplete switch" - is stronger in the report than in the source, so the
      cell-type finding is what is retained rather than the completed causal
      story about circuit-level epileptogenesis, which the report also concedes
      is unmapped under Gap 3.
    citations:
      - PMID:38714540

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's core axis (TSC1/TSC2 loss of function -> Rheb-GTP accumulation ->
  constitutive mTORC1 activation -> hamartoma growth) is a restatement of the
  seed hypothesis and adds no new support for it, but the report earns its keep
  by assembling the boundary conditions on that axis, and those check out
  against the primary sources. Verified independently: biallelic TSC1/TSC2 loss
  in 30/32 angiomyolipoma/LAM samples with a median of 4 other somatic coding
  mutations (PMID:27494029); a Class I randomised controlled trial in which
  everolimus produced no benefit on IQ, autism, or neuropsychological function
  (PMID:31217257); the PREVeNT Phase IIb negative neurodevelopmental result
  (PMID:41061327); developmental trajectory abnormalities preceding seizure
  onset in 20% of infants (PMID:32705817); COX-2 regulation in TSC2-null LAM
  cells that is mTORC2/Rictor-dependent and rapamycin-insensitive
  (PMID:24395886); mTOR-independent RHOA-mediated axon guidance failure in
  TSC2+/- human iPSC neurons
  (PMID:33972524); haploinsufficiency-driven, HMGA2-dependent mesenchymal
  tumorigenesis with mTOR activation in only half of human tumours
  (PMID:26837766); and hypomyelination caused by oligodendrocyte mTORC1
  OVERactivation (PMID:24948799). Marked down to PARTIALLY_SUPPORTED for three
  reasons. First, the Phase III trial table mislabels its own citations: the
  paper cited as "EXIST-2" is the angiomyolipoma subgroup of EXIST-1
  (NCT00789828), the paper cited as EXIST-1 SEGA data is the extension of a
  phase 1-2 trial (NCT00411619), and the 35%-versus-0% figure is quoted from a
  drug-profile review rather than a trial report. Second, the "cytostatic, not
  curative" claim is asserted from a post-hoc analysis whose own conclusion is
  that there was no evidence of rapid regrowth, and the attribution to
  paradoxical autophagy induction is provider inference with no cited support.
  Third, the report performed no computation: the "182 papers reviewed, 17
  confirmed findings across 5 investigative iterations" tally and the two
  referenced figures have no committed artifact bundle, so nothing about the
  search process is auditable.

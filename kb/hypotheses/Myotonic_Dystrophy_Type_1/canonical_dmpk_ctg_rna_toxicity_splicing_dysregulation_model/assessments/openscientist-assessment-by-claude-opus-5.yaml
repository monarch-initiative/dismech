claims:
  - claim_id: canonical-mbnl1-sequestration-core
    statement: >-
      MBNL1 loss of function caused by sequestration on expanded CUG-repeat RNA
      is the primary driver of the DM1 spliceopathy.
    disposition: RETAINED
    report_quote: >-
      Multiple independent lines of evidence converge on MBNL1 loss-of-function
      as the central pathogenic event.
    rationale: >-
      Bidirectional genetic proof holds up on source checking. Mbnl1 deletion in
      mice produces conduction disease, sudden death, and persistence of
      embryonic splice isoforms across a cardiac RNA network (PMID:25761764);
      AAV-mediated Mbnl1 overexpression reverses myotonia and restores adult
      splicing patterns in HSA-LR poly(CUG) mice (PMID:16864772); and global
      mRNA profiling finds that the majority of CUG-expansion changes in
      skeletal muscle are explained by reduced Mbnl1 activity (PMID:19223393).
      That last paper is more careful than the report is, concluding the effects
      are mediated "mainly but not entirely" through Mbnl1 sequestration, with
      transcription and mRNA decay also contributing. This restates the dismech
      seed rather than extending it, but the underlying sources are real and
      correctly read.
    citations:
      - PMID:25761764
      - PMID:16864772
      - PMID:19223393
  - claim_id: single-rnas-not-foci-titrate-mbnl1
    statement: >-
      Nuclear foci are not the unit of toxicity — individual nuclear-retained
      CUG-repeat RNAs titrate MBNL1 independently of higher-order assemblies.
    disposition: RETAINED
    report_quote: >-
      quantitative imaging reveals that most nuclear "foci" are comprised of
      single CUG-repeat RNAs, and these individual RNA species contribute to
      MBNL1 sequestration independent of higher-order foci formation
    rationale: >-
      The cited paper says exactly this in a patient-derived myotube model, and
      adds that the rare multimeric foci arise from transcriptional bursting,
      dissociate over time, and are themselves MBNL dependent (PMID:40238630).
      This is a real qualification of the foci-centric framing that the dismech
      entry currently uses in its "Toxic CUG RNA Nuclear Foci" node
      description. It refines the canonical model rather than competing with it.
    citations:
      - PMID:40238630
  - claim_id: scn5a-mis-splicing-not-sufficient
    statement: >-
      Correcting SCN5A mis-splicing does not rescue the cardiac phenotype, so
      SCN5A mis-splicing is not the sole driver of DM1 heart disease.
    disposition: RETAINED
    report_quote: >-
      the critical qualifying finding is that rescue of Scn5a mis-splicing alone
      does NOT improve the structural and functional heart defects of a DM1
      heart mouse model
    rationale: >-
      Verified against the source. Mice lacking Scn5a exon 6A, forced onto the
      adult exon 6B isoform and crossed into the CUG960 DM1 heart model, showed
      no improvement in conduction delay or structural change (PMID:39126705).
      The same paper reports a second finding the report omits and that is worth
      curating — Scn5a expression, not just splicing, is reduced in CUG960
      hearts and in DM1-affected individuals. This is the strongest single
      qualification in the report and is absent from the dismech entry, whose
      SCN5A node currently reads as an unqualified cardiac branch.
    citations:
      - PMID:39126705
      - PMID:27063795
  - claim_id: splicing-independent-cardiac-progression
    statement: >-
      Sustained expression of a stable CUG-repeat RNA drives progressive cardiac
      disease while MBNL-dependent splicing defects stay static, establishing a
      route to cardiac progression that does not run through spliceopathy or
      somatic expansion.
    disposition: RETAINED
    report_quote: >-
      prolonged CUG-repeat RNA expression causes progressive cardiac
      enlargement, contractile dysfunction, myocardial fibrosis, and reduced
      survival while MBNL-dependent splicing defects remain static
    rationale: >-
      The source is an inducible heart-specific transgenic carrying a stable,
      interrupted 960-CUG-repeat RNA, so repeat length is held fixed by design
      and somatic expansion is excluded as the progression driver
      (PMID:41855125). It further reports that shutting off the transgene
      rescues the cardiac abnormalities but that reversibility declines with
      longer exposure. Scope caveat the report does not state: this is one mouse
      model with an engineered interrupted repeat, and the mechanism connecting
      persistent CUG RNA to fibrosis and contractile failure is not identified,
      so this belongs in the entry as a node plus an open gap rather than as a
      solved pathway.
    citations:
      - PMID:41855125
      - PMID:39126705
  - claim_id: cataract-dsrna-innate-immunity
    statement: >-
      DM1 cataract pathogenesis runs through dsRNA-triggered innate immune and
      interferon activation rather than through MBNL1/CELF1 spliceopathy.
    disposition: QUALIFIED
    report_quote: >-
      This suggests cataract pathogenesis involves dsRNA-triggered innate
      immunity and neighboring gene (SIX5) haploinsufficiency rather than purely
      MBNL1/CELF1 splicing dysregulation.
    rationale: >-
      The transcriptomic finding is real and is human material — Illumina array
      profiling of DM1 and DM2 cataract lens samples found the upregulated genes
      highly enriched for interferon-regulated genes and dsRNA-response genes,
      with 83 percent of dysregulated genes shared between DM1 and DM2
      (PMID:22062891). But the study is an expression association in surgical
      cataract specimens with no perturbation, no MBNL1 comparison arm, and no
      demonstration that the interferon signature precedes or causes lens
      opacity; its own authors present it as the basis for a novel hypothesis.
      "Rather than" therefore overstates a mechanism hierarchy that has not been
      tested. Retained as a parallel candidate lens mechanism, not as a
      displacement of the splicing axis.
    citations:
      - PMID:22062891
  - claim_id: six5-sk3-lens-fragility
    statement: >-
      Reduced SIX5 and increased SK3 in DM1 lens epithelial cells cause
      calcium-induced cell fragility and death, contributing to cataract.
    disposition: QUALIFIED
    report_quote: >-
      DM1 lens cells also show reduced SIX5 expression and increased SK3
      calcium-activated K+ channel expression, leading to calcium-induced cell
      fragility and death, rescued by the specific SK inhibitor apamin
    rationale: >-
      Accurately reported. Four DM1-derived and two non-DM lens epithelial cell
      lines showed reduced SIX5 and increased SK3 by real-time PCR, longer
      population doubling times driven by cell death rather than reduced
      proliferation, and both the ionomycin-stimulated potassium efflux and the
      excess death were blocked by apamin (PMID:17101631). The pharmacological
      rescue makes the SK3 arm causal for the in vitro fragility. What is not
      shown is the step the report's phrasing implies: SIX5 reduction is
      measured, not manipulated, so it is correlative here, and nothing connects
      these cell lines to opacity formation in a patient lens. Valuable as human
      support for the existing SIX5 lens node, which currently rests on a mouse
      Six5 dosage study alone.
    citations:
      - PMID:17101631
      - PMID:10802668
  - claim_id: congenital-dm1-multigene-dosage
    statement: >-
      Congenital DM1 requires a multigene dosage-reduction model spanning DMPK,
      SIX5, MBNL1, and DMWD.
    disposition: QUALIFIED
    report_quote: >-
      Congenital DM1 requires a multigene dosage model incorporating DMPK, SIX5,
      MBNL1, and DMWD
    rationale: >-
      The mouse genetics are strong and correctly summarized — triple
      heterozygous Dmpk/Six5/Mbnl1 mutants show adult-onset DM1 phenotypes and
      adding Dmwd yields quadruple heterozygotes recapitulating many congenital
      DM1 manifestations (PMID:31853004). But this demonstrates that combined
      dosage reduction is sufficient to produce the phenotype in mouse; it does
      not show that it is what happens in human congenital DM1, where no such
      allele combination exists and the causal lesion is a single expanded
      repeat. "Requires" is the wrong modal. The report itself concedes in its
      Limitations that the model has not been validated in human congenital DM1
      tissue. Recorded here as an alternative model worth flagging, not as an
      established requirement.
    citations:
      - PMID:31853004
  - claim_id: crispr-repeat-deletion-proof
    statement: >-
      CRISPR-Cas9 excision of the expanded CTG tract removes ribonucleoprotein
      foci and corrects mis-splicing, giving DNA-level proof that the repeat is
      the upstream cause.
    disposition: RETAINED
    report_quote: >-
      CRISPR-Cas9 deletion of expanded CTG repeats (2,600 repeats) in DM1
      patient-derived muscle cells results in targeted DNA deletion,
      ribonucleoprotein foci disappearance, and correction of splicing
      abnormalities
    rationale: >-
      Verbatim accurate against the abstract, which additionally reports that a
      single intramuscular AAV injection of the CRISPR-SaCas9 components reduced
      pathological RNA foci in DMSXL mouse myonuclei (PMID:31253581). The
      authors frame it as proof of concept for genome editing rather than as a
      completed therapy, and the report does not overreach on that point. This
      is the cleanest sufficiency argument for the canonical axis and is not yet
      cited anywhere in the dismech entry.
    citations:
      - PMID:31253581
  - claim_id: aso-trial-pharmacologic-activity
    statement: >-
      The phase 1/2a baliforsen trial demonstrated pharmacologic activity and so
      provides therapeutic validation of the RNA-toxicity model.
    disposition: REJECTED
    report_quote: >-
      baliforsen (ASO targeting DMPK mRNA) demonstrated safety and pharmacologic
      activity in Phase 1/2a
    rationale: >-
      This misreads the cited trial. The Lancet Neurology report concludes that
      baliforsen was generally well tolerated but that "skeletal muscle drug
      concentrations were below levels predicted to achieve substantial target
      reduction", and reports no splicing, DMPK-knockdown, or functional
      endpoint met (PMID:36804094). The only pharmacology reported is that
      muscle drug concentration rose with dose, which is exposure, not activity
      on target. A trial that failed to reach predicted target engagement cannot
      corroborate the mechanism it was designed to test, so the report's Finding
      7 framing ("Therapeutic Validation Supports the Canonical Model") does not
      follow from this citation. The dismech hypothesis description makes the
      same move in asserting that CUG-ASO therapy corroborates the axis, and
      that overstatement should be corrected in the entry rather than reinforced.
    citations:
      - PMID:36804094
  - claim_id: satellite-cell-p16-senescence
    statement: >-
      DM1 muscle precursor cells undergo p16-dependent premature senescence, and
      removing p16 activity restores their proliferative capacity.
    disposition: RETAINED
    report_quote: >-
      DM1 muscle precursor cells enter p16-dependent premature senescence rather
      than exhausting proliferative capacity; abolishing p16 activity restores
      proliferation
    rationale: >-
      Correctly reported, including the discrimination the finding turns on: the
      cells have not exhausted replicative capacity, and abolishing p16 activity
      overcomes the early growth arrest and extends proliferation, while
      accelerated telomere shortening does not account for the p16 induction
      (PMID:19246640). Scope limits worth carrying into the entry: this is
      cultured human muscle precursor cells from large-expansion DM1, the
      upstream link from CUG-repeat RNA to p16 accumulation is described only as
      "a cellular stress", and the connection to muscle wasting in vivo is the
      authors' proposal rather than their result.
    citations:
      - PMID:19246640
  - claim_id: ctg-length-predicts-mortality
    statement: >-
      CTG repeat length is inversely related to all-cause survival in adult DM1.
    disposition: RETAINED
    report_quote: >-
      CTG repeat length shows an inverse relationship with all-cause survival
    rationale: >-
      The quantitative claim checks out exactly against the source — a
      406-patient adult DM1 cohort followed 9.2 years, 118 deaths, relative risk
      5.4 per log repeat with 95 percent CI 2.9 to 10.2 and P below 0.001
      (PMID:21484823). The dismech entry asserts in its top-level description
      that severity correlates with expansion size but carries no citation for
      it; the description slot takes no evidence, so this is recorded as
      verified rather than integrated.
    citations:
      - PMID:21484823
  - claim_id: msh3-somatic-expansion-and-onset
    statement: >-
      MSH3 polymorphism modifies somatic expansion rate, and variation in
      somatic expansion rate directly contributes to variation in age of onset.
    disposition: QUALIFIED
    report_quote: >-
      Variation in somatic expansion rate directly contributes to variation in
      age of onset.
    rationale: >-
      The two halves have different support. The MSH3 association is real —
      Rs26279 was associated with somatic instability at p=0.003 in a Costa
      Rican DM1 cohort and survived multiple-testing correction, and it changes
      an amino acid in the MSH3 ATPase domain (PMID:26994442). But the same
      paper states plainly that it did not detect an association between Rs26279
      and age at onset, and the onset link comes from regression modelling of
      residual repeat instability, not from a perturbation. "Directly
      contributes" therefore overstates a modelled association. The dismech
      entry already curates the somatic-expansion node with MSH3 and FAN1
      evidence, so no integration follows from this.
    citations:
      - PMID:26994442
  - claim_id: celf1-secondary-amplifier
    statement: >-
      CELF1 upregulation is a PKC-driven, DM1-specific amplifying arm rather
      than a regeneration artifact, and is secondary to MBNL1 loss for most
      splicing targets.
    disposition: RETAINED
    report_quote: >-
      CELF1 elevation in DM1 occurs in mature myofibers, distinguishing it from
      secondary CELF1 elevation seen in non-DM1 muscular dystrophies and muscle
      injury, where it occurs only in regenerating fibers
    rationale: >-
      Both supporting sources hold. Expression of DMPK CUG-repeat RNA
      hyperphosphorylates and stabilizes CUGBP1, PKC activation is required for
      that hyperphosphorylation in DM1 cells, and PKC alpha and beta-II
      phosphorylate CUGBP1 directly in vitro (PMID:17936705). The
      mature-myofiber discrimination is the point of the second study, which
      found DM1-like mis-splicing and altered MBNL1/CELF1 in four non-DM1
      dystrophy models and two myotoxin injury models, with CELF1 elevated in
      mature myofibers only in the DM1 model (PMID:21400563). The dismech entry
      asserts increased CELF1 activity in its spliceopathy node description with
      no citation for that arm, so this is a real evidence gap the report closes.
    citations:
      - PMID:17936705
      - PMID:21400563
  - claim_id: systematic-153-source-evaluation
    statement: >-
      The report rests on a systematic evaluation of 153 primary literature
      sources over 5 investigation iterations, with 20 findings carrying
      verified citation snippets.
    disposition: REJECTED
    report_quote: >-
      Report generated from systematic evaluation of 153 primary literature
      sources across 5 investigation iterations.
    rationale: >-
      Not reconstructible. The committed citation manifest lists 48 PMIDs and
      the report front matter records citation_count 48, against a claimed 153
      sources. No search strategy, screening record, or exclusion log is
      committed, and the two figures the report references are unresolved
      placeholders, so "systematic" is unsupported as a methodological claim.
      This does not impugn the individual citations, which checked out
      consistently, but the provenance claim itself should not be repeated.
    citations: []

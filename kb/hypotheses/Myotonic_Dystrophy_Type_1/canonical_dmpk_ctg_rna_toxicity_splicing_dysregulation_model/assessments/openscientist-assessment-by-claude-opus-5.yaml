provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The seed mechanism — expanded CUG-repeat DMPK RNA titrating MBNL proteins and
  producing a fetal-pattern spliceopathy that explains myotonia, insulin
  resistance, and skeletal muscle weakness — is supported by bidirectional
  genetic proof (Mbnl1 knockout recapitulates, AAV-Mbnl1 rescues, CRISPR removal
  of the repeat abolishes foci and corrects splicing) plus transcriptome-wide
  profiling showing that most CUG-expansion effects in skeletal muscle are
  MBNL1 mediated. Every consequential citation I checked resolves to a real
  paper that says what the report says it says, and no hallucinated or
  wrong-paper citation was found.
  The report's genuine contribution beyond the seed is a set of scope limits
  the dismech entry did not carry: cardiac disease is not explained by SCN5A
  mis-splicing (correcting it rescues nothing, and stable CUG RNA drives
  progressive cardiac pathology with static splicing defects); nuclear foci are
  not the toxic unit, since single nuclear-retained RNAs titrate MBNL1; and the
  lens has candidate mechanisms (dsRNA innate immune activation, SIX5 and SK3)
  that sit outside the MBNL1 axis.
  Two things should not be taken at face value. The report calls the phase 1/2a
  baliforsen trial therapeutic validation showing "pharmacologic activity",
  whereas that trial explicitly reported muscle drug concentrations below the
  level predicted to reduce the target. And its claimed 153-source systematic
  evaluation cannot be reconstructed from the 48-entry citation manifest, with
  no committed search log, code, or figure artifact anywhere in the hypothesis
  directory.

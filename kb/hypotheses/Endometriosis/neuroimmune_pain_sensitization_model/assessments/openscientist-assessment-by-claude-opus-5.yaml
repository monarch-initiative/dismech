analyses:
  - analysis_id: iterative-literature-evidence-synthesis
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Autonomous multi-iteration literature triage producing an evidence matrix,
      a step-by-step causal chain with per-step evidence grades, and a knowledge
      gap table.
    input_data_source_ids:
      - pubmed-literature-search
    status_reason: >-
      The report states that 120 papers were reviewed across five iterations and
      25 findings confirmed, but no screening log, inclusion list, or grading
      rubric is committed, so neither the denominator nor the grading can be
      audited. The individual citations are checkable one at a time, and the
      ones I checked held up.
    limitations: >-
      Evidence grades such as ESTABLISHED and EMERGING are applied
      inconsistently: the IL-33 pathway is graded ESTABLISHED in the candidate
      edge list and ESTABLISHED (mouse model) in the causal-chain table for the
      same single mouse study.
  - analysis_id: report-figure-generation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Generation of five summary figures referenced inline as claim_assessment.png,
      molecular_circuit.png, final_evidence_summary.png, knowledge_gaps.png, and
      final_synthesis.png.
    status_reason: >-
      The figures are referenced by unresolved template placeholders. The
      hypothesis directory contains only openscientist.md and its citations
      sidecar, so no image, code, or manifest exists for any of them.
    limitations: >-
      Claims made only inside a figure caption cannot be reviewed. None were
      relied on for curation.
claims:
  - claim_id: core-chain-partially-supported
    statement: >-
      The neuroimmune model's core chain, from lesion-derived neurotrophin
      signaling through peripheral nociceptor sensitization to central
      sensitization and pain that does not track lesion burden, is supported
      but with material unresolved qualifications.
    disposition: RETAINED
    report_quote: >-
      The core causal chain -- from lesion-derived neurotrophin signaling
      through peripheral nociceptor sensitization to central sensitization and
      pain-stage discordance -- is substantiated by convergent genetic,
      molecular, cellular, imaging, and clinical trial evidence.
    rationale: >-
      Concordant with the curated entry, which already models all three steps as
      linked pathophysiology nodes under this hypothesis group and already
      carries the eliapixant failure as a qualifier. Because the seed hypothesis
      came from the KB, this verdict on its own is a restatement and adds no new
      support; the report's value is in the specific citations below. Status
      left at EMERGING, which the report also recommends.
    citations:
      - PMID:24859987
      - PMID:38890641
  - claim_id: lesion-innervation-by-sp-cgrp-fibers
    statement: >-
      Peritoneal endometriotic lesions contain significantly more nerve fibres
      than normal peritoneum, and those fibres are substance P, CGRP,
      acetylcholine, or tyrosine hydroxylase immunoreactive.
    disposition: RETAINED
    report_quote: >-
      There were significantly more nerve fibres identified in peritoneal
      endometriotic lesions than in normal peritoneum (P < 0.001) or
      endosalpingiosis lesions (P < 0.001). These nerve fibres were SP, CGRP,
      ACh or TH immunoreactive
    rationale: >-
      Verified verbatim against the cached abstract of Tokushige 2006, including
      the n = 40 versus 36 design and the intense NGF immunoreactivity near
      endometriotic glands. This is primary human histology and was absent from
      the entry, whose neuroangiogenesis node rested entirely on two reviews. It
      was promoted as HUMAN_CLINICAL evidence on that node.
    citations:
      - PMID:16950827
  - claim_id: peritoneal-nociceptive-ion-channel-upregulation
    statement: >-
      Nociceptive ion channel transcripts TRPV1, TRPA1, and SCN11A are elevated
      in peritoneum from women with endometriosis, and TRPV1, SCN9A, and TAC1
      are elevated in lesions.
    disposition: RETAINED
    report_quote: >-
      TRPV1, TRPA1, and SCN11A mRNAs were significantly higher in the peritoneum
      from women with endometriosis (P < .001, P < .01). TRPV1, SCN9A, and TAC1
      were elevated in endometriosis lesions (P < .05)
    rationale: >-
      Verified verbatim against the cached Greaves 2014 abstract. This is the
      molecular layer the entry's peripheral sensitization node was missing; the
      node previously cited only prolactin signaling and a BDNF biomarker study.
      Promoted as HUMAN_CLINICAL evidence. Worth noting for scope: the same paper
      found P2RX3 raised in chronic pelvic pain with or without endometriosis,
      so the purinergic transcript change is not endometriosis specific.
    citations:
      - PMID:25029427
  - claim_id: estrogen-upregulates-trpv1-in-sensory-neurons
    statement: >-
      Estradiol raises TRPV1 message in human sensory neurons, giving a direct
      molecular route by which the disease's estrogen dependence feeds nociceptor
      sensitization.
    disposition: RETAINED
    report_quote: >-
      incubation of sensory neurons with 17beta-estradiol increased TRPV1 mRNA
      (P < .01)
    rationale: >-
      Verified against the cached abstract, where the neurons are human embryonic
      stem cell derived sensory neurons and an ER-beta selective agonist raised
      TRPV1, P2RX3, SCN9A and TAC1. Curated as a separate IN_VITRO evidence item
      rather than folded into the human tissue item, because the two arms are
      different study types and must not share one evidence_source. This is the
      mechanistic bridge between the entry's Estrogen Dependence node and its
      pain circuit, and it is also the paper's own explanation for why ovarian
      suppression relieves pain.
    citations:
      - PMID:25029427
  - claim_id: il33-macrophage-tnf-trpv1-pathway
    statement: >-
      IL-33 acting through ST2 on macrophages raises TNF-alpha, which increases
      TRPV1 in dorsal root ganglion neurons via TNFR1/p38 MAPK, linking the
      peritoneal immune compartment to nociceptor sensitization.
    disposition: QUALIFIED
    report_quote: >-
      macrophage-derived TNF-alpha increased TRPV1 protein level in DRG neuronal
      cells through the TNFR1/p38 MAPK signaling pathway
    rationale: >-
      The pathway is real and verified against the cached abstract, but the
      report grades it ESTABLISHED in its candidate-edge list while the
      underlying work is entirely a murine endometriosis model plus RAW 264.7
      cells and DRG neuronal cells. Curated as MODEL_ORGANISM evidence on the
      peripheral sensitization node with the species limit stated in the
      explanation, and IL-33/ST2 macrophage signaling added as a named
      intermediate on the existing inflammation-to-sensitization edge. No human
      confirmation of this specific cascade in endometriosis was found.
    citations:
      - PMID:39969583
  - claim_id: pain-intensity-does-not-track-rasrm-stage
    statement: >-
      Meta-analysis finds pain intensity does not differ between rASRM stages
      I/II and III/IV, although chronic pelvic pain is more frequent in advanced
      disease.
    disposition: QUALIFIED
    report_quote: >-
      pain intensity did not differ significantly between rASRM stages I/II and
      III/IV (p > 0.05), though chronic pelvic pain was more frequent in advanced
      disease (p < 0.05)
    rationale: >-
      Verified verbatim against the cached abstract of Alves 2026. This is the
      strongest evidence in the report for the hypothesis's signature prediction
      and was missing from the entry, which asserted stage-symptom discordance
      only from a narrative review. Qualified rather than retained outright
      because the report's own narrative calls this the clinical cornerstone
      while quietly carrying the second half of the sentence: chronic pelvic pain
      frequency does rise with stage, so lesion burden is not wholly
      uninformative. Only eight studies met inclusion and heterogeneity was high.
      Both halves were curated onto the hypothesis entry.
    citations:
      - PMID:41338448
  - claim_id: ngf-gwas-locus-and-pain-genetic-correlation
    statement: >-
      NGF is among the genes implicated by endometriosis GWAS signals associated
      with pain perception and maintenance, and endometriosis is genetically
      correlated with 11 pain conditions.
    disposition: RETAINED
    report_quote: >-
      identified signals regulated expression or methylation of genes in
      endometrium and blood, many of which were associated with pain
      perception/maintenance (SRP14/BMF, GDAP1, MLLT10, BSN and NGF)
    rationale: >-
      Verified verbatim against the cached full text of Rahmioglu 2023, which
      also states the 11-pain-condition genetic correlation and the multitrait
      sharing with migraine and multisite chronic pain. This is orthogonal
      genetic support for a neurally weighted pain model and was entirely absent
      from the entry. Promoted as evidence on the hypothesis entry. The paper
      supports genetic implication of neurotrophin biology, not a demonstrated
      NGF-to-pain causal chain in patients, and the curated explanation says so.
    citations:
      - PMID:36914876
  - claim_id: insula-glutamate-and-connectivity-central-amplification
    statement: >-
      Women with endometriosis-associated chronic pelvic pain show raised
      anterior insula combined glutamine-glutamate and greater anterior
      insula to medial prefrontal cortex connectivity.
    disposition: QUALIFIED
    report_quote: >-
      women with endometriosis-associated CPP displayed increased levels of
      combined glutamine-glutamate (Glx) within the anterior insula and greater
      anterior insula connectivity to the medial prefrontal cortex (mPFC)
    rationale: >-
      Verified verbatim against the cached full text of As-Sanie 2016 and
      promoted as HUMAN_CLINICAL neuroimaging evidence, which the central
      sensitization node lacked. Qualified because the report presents it as
      endometriosis-specific central sensitization while the paper reports no
      significant difference in endometriosis patients without pelvic pain versus
      controls and concludes the changes may play a role in the pathophysiology
      of chronic pelvic pain independent of the presence of endometriosis. Group
      sizes are small (17 with pain, 13 without). The curated explanation carries
      that caveat.
    citations:
      - PMID:26456676
  - claim_id: spinal-microglial-m1-polarization
    statement: >-
      Spinal microglia polarize toward an M1 phenotype in endometriosis mice
      through CX3CR1 and P2X4R driven NF-kappaB signaling.
    disposition: QUALIFIED
    report_quote: >-
      spinal microglia exhibited M1 polarization in endometriosis mice.
      Mechanistically, neuronal ligands triggered microglial M1 polarization
      through CX3CR1 and P2X4R-mediated activation of the IkBa/NF-kappaB
      signaling pathway
    rationale: >-
      Verified against the cached abstract, and the report is honest here,
      grading it EMERGING (mouse only) in the causal-chain table. Not curated:
      the entry's central sensitization node is built on human sensory testing,
      neuroimaging, and a randomized neuromodulation trial, and adding a single
      mouse spinal-cord mechanism would extend the node's scope past what the
      rest of its evidence supports. Recorded here as a lead if a spinal
      mechanism node is ever added.
    citations:
      - PMID:41791308
  - claim_id: p2x3-antagonist-clinical-failure
    statement: >-
      The phase 2b SCHUMANN trial of the P2X3 antagonist eliapixant showed no
      significant pain reduction versus placebo, with elagolix outperforming
      every eliapixant dose.
    disposition: RETAINED
    report_quote: >-
      The study found no significant differences in EAPP reduction from baseline
      between groups and no significant dose-response model. The elagolix 150 mg
      group showed better pain reduction than any of the other groups
    rationale: >-
      Already curated in the entry's knowledge-gap discussion as the qualifier on
      this hypothesis, so no change was needed. The report's handling is fair: it
      names the early termination for safety and the resulting power limitation
      rather than treating the trial as a clean refutation. Note the interaction
      with the Greaves finding above, where the P2RX3 transcript rise was seen in
      chronic pelvic pain with and without endometriosis.
    citations:
      - PMID:38890641
  - claim_id: subtype-restriction-to-peritoneal-and-die
    statement: >-
      The neuroimmune sensitization circuit is restricted to, or operates most
      strongly in, peritoneal and deep infiltrating endometriosis, and weakly or
      not at all in ovarian endometriomas.
    disposition: QUALIFIED
    report_quote: >-
      This critical finding means the neuroimmune sensitization circuit likely
      operates most strongly in peritoneal/DIE subtypes and differently (if at
      all) in ovarian endometriomas.
    rationale: >-
      The immune-hot versus immune-cold contrast is real and verified in the
      cached He 2026 paper, but the inference drawn from it is the provider's,
      not the source's. That study is an integrative reanalysis of previously
      published transcriptomes and reports no nerve fibre, neurotrophin, or
      nociceptive ion-channel measurement, so it cannot speak to where the pain
      circuit operates. The report also cites, without reconciling it, a study
      finding elevated fibromyalgia survey scores in 41.7 percent of ovarian
      endometriosis patients, which cuts the other way. Curated as a new
      KNOWLEDGE_GAP discussion carrying both sides, not as a subtype restriction
      on the model.
    citations:
      - PMID:42010552
      - PMID:41890200
  - claim_id: asymptomatic-endometriosis-proves-lesion-insufficiency
    statement: >-
      The roughly 12 percent prevalence of incidentally discovered endometriosis
      establishes that lesion presence alone is insufficient to produce pain.
    disposition: QUALIFIED
    report_quote: >-
      The existence of substantial asymptomatic endometriosis (~12% prevalence at
      incidental surgery) confirms that lesion presence alone is insufficient for
      pain
    rationale: >-
      The prevalence figure checks out: 11.82 percent visually identified at
      interval laparoscopic tubal sterilization, 10 percent among the asymptomatic
      parous subgroup. The word confirms overstates it. A cross-sectional
      prevalence series in women presenting for sterilization is indirect
      evidence for lesion insufficiency, it does not control for lesion type or
      activity, and the same series found endometriosis in 17.58 percent of the
      women who did report pain. Not curated; the entry already makes the
      lesion-insufficiency point through mechanisms with direct support.
    citations:
      - PMID:28526518
  - claim_id: no-anti-ngf-trial-in-endometriosis
    statement: >-
      No endometriosis-specific anti-NGF clinical trial exists, despite NGF being
      a GWAS-implicated locus and anti-NGF antibodies having demonstrated
      efficacy in somatic pain.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Yet no endometriosis-specific anti-NGF trial was found across exhaustive
      PubMed searches.
    rationale: >-
      Plausible and, if true, the highest-value discriminating test in the
      report. It is an absence claim resting on searches with no committed log,
      and PubMed is the wrong place to establish the absence of a trial in any
      case; a registry sweep of ClinicalTrials.gov and the WHO ICTRP would be
      needed. Not curated as a knowledge gap on that basis. The genetic premise
      is independently verified via the GWAS claim above.
    citations:
      - PMID:36914876

hypothesis_id: neuroimmune_pain_sensitization_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's headline verdict matches what the curated entry already says, so
  the seed restatement contributes nothing new on its own. What the report does
  contribute is molecular and genetic specificity that the KB entry lacked. I
  fetched and read twelve of its cited papers into references_cache/ and found
  no fabricated identifier and no quotation that failed to match its source;
  every quote I acted on is verbatim in the cached abstract or full text. That
  is unusual and worth recording.

  Four citations were genuinely new to the entry and changed it. Tokushige 2006
  (PMID:16950827) supplies primary human histology for the neuroangiogenesis
  node, which until now rested on two reviews. Greaves 2014 (PMID:25029427)
  supplies the missing molecular layer of peripheral sensitization, showing
  elevated TRPV1/TRPA1/SCN11A message in endometriosis peritoneum and, in a
  separate cell-culture arm, estrogen upregulation of TRPV1, which is the
  mechanistic bridge between the entry's Estrogen Dependence node and its pain
  circuit. Rahmioglu 2023 (PMID:36914876) supplies orthogonal genetic support:
  NGF is a GWAS locus and endometriosis is genetically correlated with 11 pain
  conditions. Alves 2026 (PMID:41338448) supplies a meta-analysis of the
  model's signature prediction, pain intensity not tracking rASRM stage, which
  the entry previously asserted only from a narrative review.

  Three of the report's framings needed qualifying rather than adopting. The
  IL-33/ST2/TNF-alpha/TRPV1 pathway is labelled ESTABLISHED in one table and
  "ESTABLISHED (mouse model)" in another; it is mouse plus RAW 264.7 cells
  throughout and was curated as MODEL_ORGANISM. The As-Sanie insula finding is
  presented as endometriosis central sensitization evidence, but that paper
  found no difference in endometriosis patients without pelvic pain and
  concluded the change may operate independently of the presence of
  endometriosis; the curated explanation says so. And the inference that the
  neuroimmune circuit is restricted to peritoneal/DIE subtypes runs past its
  source: He 2026 is a reanalysis of published transcriptomes with no neural or
  pain readout at all, and a separate paper the same report cites
  (PMID:41890200) finds nociplastic pain features in the ovarian subtype. That
  tension was curated as an open knowledge gap rather than as a subtype
  restriction.

  Status is unchanged at EMERGING, which is what the report itself recommends.

analyses:
  - analysis_id: gr-inhibition-at-measured-hog
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Fractional reversible-inhibition estimate f = [I] / ([I] + Ki) evaluated
      at the HOG concentrations reported for PH3 patients, against the HOG
      inhibition constant for glyoxylate reductase. Liver content in pmol per
      mg protein is converted to an approximate whole-cell concentration across
      a 150-350 mg protein per mL sensitivity range, and a hypothetical
      five-fold mitochondrial enrichment is evaluated as a further case.
    comparison: >-
      Measured PH3 serum and liver HOG against the concentration required for
      half-maximal inhibition of glyoxylate reductase.
    input_data_source_ids:
      - riedel-2012-fulltext
    software:
      - software_name: Python
      - software_name: NumPy
      - software_name: Matplotlib
    parameters:
      - "Ki_HOG=1.75 mM (global fit), sensitivity range 1.0-1.8 mM"
      - "serum_HOG=0.89 uM"
      - "liver_HOG=34.3 pmol/mg protein"
      - "protein density = 150 / 250 / 350 mg per mL cell water"
      - "mitochondrial enrichment factor = 5x applied to the mid estimate"
    code_artifacts:
      - ../openscientist_artifacts/provenance_gr_inhibition_vs_HOG.json
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Primary_Hyperoxaluria_Type_3_hog_glyoxylate_reductase_inhibition_openscientist_artifacts_data_gr_inhibition_table.csv
      - ../openscientist_artifacts/kb_hypotheses_Primary_Hyperoxaluria_Type_3_hog_glyoxylate_reductase_inhibition_openscientist_artifacts_figures_gr_inhibition_vs_HOG.png
    status_reason: >-
      Replayed independently: the code was extracted from the committed
      provenance record and run in a clean directory outside the repository,
      and it reproduced every row of the committed table exactly, including the
      0.0508, 0.2929, 0.4875, 0.6808 and 2.390 percent inhibition values and
      the 1966.3, 340.1, 204.1, 145.8 and 40.8 fold-below-Ki figures. The unit
      conversion is correct on inspection, and the computation is arithmetic
      over four scalars rather than statistics over a dataset. Graded PARTIAL
      and PARTIALLY_AUDITABLE rather than SUCCEEDED and REPRODUCIBLE: the
      provider recorded no software versions and no environment specification,
      so the committed record is not one a third party could rerun as given,
      and my replay used unpinned NumPy and Matplotlib of my own choosing. That
      the replay matched to every decimal is why this is not REPORTED_ONLY, but
      it is my execution rather than a reproducible provider record, and that
      distinction is what these two fields exist to keep.
      The bundle also has no MANIFEST.yaml and the
      report no artifact_manifest_sha256, so
      just validate-hypothesis-analysis-run rejects it.
    limitations: >-
      The result is an order-of-magnitude argument, not a measurement, and two
      things limit it, neither of them the accuracy of its inputs, which are
      confirmed against the source. Table 2's PH3 cohorts are n equals 5 sera
      and n equals 3 livers, so the liver concentration carrying most of the
      argument is a mean of three samples. And it compares a
      bulk tissue average against a constant that applies at the enzyme, so a
      local concentration high enough to inhibit is not excluded; the five-fold
      enrichment case probes that but does not settle it, and the gap it would
      have to close is 40-fold even there. A steady-state concentration can
      also be low while flux through the pathway is high, which the authors'
      own argument about the daily mass of hydroxyproline degraded turns on, and
      the computation does not address flux at all.
claims:
  - claim_id: gr-inhibition-real-and-specific
    statement: >-
      HOG inhibits glyoxylate reductase in vitro, and the inhibition is
      specific to HOG rather than a general effect of similar dicarboxylates.
    disposition: RETAINED
    report_quote: >-
      using purified recombinant enzyme, HOG specifically inhibits GR, while
      the structurally related metabolites 2-hydroxyglutarate and
      2-oxoglutarate do not
    rationale: >-
      Verified against the cached abstract of PMID:22771891, which states "GR
      was inhibited by HOG but not by 2-hydroxyglutarate or 2-oxoglutarate".
      The full text adds the controls: glutarate and oxalate had no observable
      effect, and 2-oxoglutarate, 2-hydroxyglutarate and oxaloacetate showed
      under ten percent inhibition at 10 mM against 89-91 percent for HOG. The
      specificity is the reason the hypothesis is worth keeping as an
      alternative at all, and it is why this claim is retained while the in
      vivo claim below is not.
    citations:
      - PMID:22771891
    analysis_ids: []
  - claim_id: concentration-gap-disfavors-in-vivo-inhibition
    statement: >-
      HOG concentrations measured in PH3 patients are two to three orders of
      magnitude below the inhibition constant, so meaningful inhibition of
      glyoxylate reductase in vivo is quantitatively implausible on these
      numbers.
    disposition: QUALIFIED
    report_quote: >-
      roughly **200- to 2,000-fold below** the concentration needed to produce
      meaningful (50%) inhibition
    rationale: >-
      The computation reproduces exactly on independent replay, and the
      conclusion does not depend on it: the source paper's discussion states
      that given the roughly millimolar requirement and the roughly ten
      micromolar physiological concentration "one would not expect HOG to
      inhibit GR under normal physiological conditions", which I confirmed in
      the article's body text. The authors then argue that PH3 raises HOG above
      physiological levels, and the report's contribution is to check that
      against the measured PH3 values rather than assuming it. Retained as a
      quantitative objection of the right order, not as a measurement; the
      bulk-versus-local proxy in the analysis limitations is why this disfavours
      the mechanism rather than refuting it. Qualified rather than retained
      because the supporting analysis is PARTIAL: the estimate rests on an input
      I could not verify and on a record that is not independently rerunnable as
      committed. The paper's own concurring statement is what keeps the claim
      standing without it.
    citations:
      - PMID:22771891
    analysis_ids:
      - gr-inhibition-at-measured-hog
  - claim_id: kinetic-parameter-provenance
    statement: >-
      The inhibition constant and kinetic parameters used in the computation
      are the paper's global-fit values, reported in the Fig. 4 caption, which
      differ from the values quoted in its running text.
    disposition: RETAINED
    report_quote: >-
      Ki(HOG) = 1.75 ± 0.85 mM (global fit; point estimate ~1.0 mM);
      Km(glyoxylate) = 267 µM; kcat = 72.7/s.
    rationale: >-
      Worth recording because it looks like a transcription error and is not,
      and I first read it as one. The article's running text gives a constant
      of 1.8 plus or minus 0.9 mM for the inhibition experiment and, separately,
      63 per second and 253 micromolar for glyoxylate turnover described as
      consistent with an earlier report. The run's search log quotes both those
      strings and the global-fit parameter set verbatim, and the report used the
      global fit, which is the appropriate source for an inhibition constant and
      is internally consistent with the figure's stated range. All three values
      are now confirmed against the Fig. 4 caption of the author manuscript,
      which reads "Ki for HOG, 1.75 ± 0.85 mM; KM for glyoxylate, 267 ± 19 μM;
      kcat, 72.7 ± 0.01s−1" with R2 = 0.988. Note it is a figure caption rather
      than a table, which an earlier version of this sidecar called a table.
      Only the constant enters the calculation, and 1.75 against 1.8 changes
      nothing at this scale. The lesson for the sidecar is the general one: a value that
      disagrees with the first place you find it in a paper may be the right
      value from a second place, so check the log before calling it an error.
      Not linked to the analysis: this is an observation about where the
      numbers came from, not a result the analysis produced.
    citations:
      - PMID:22771891
    analysis_ids: []
  - claim_id: patient-hog-concentrations
    statement: >-
      PH3 patients have serum HOG of about 0.89 micromolar and liver HOG of
      about 34.3 pmol per mg protein.
    disposition: RETAINED
    report_quote: >-
      serum 0.89 µM (range 0.5–1.43); liver 34.3 pmol/mg protein (range
      27.3–38.8)
    rationale: >-
      Verified against Table 2 of the author manuscript, which gives serum
      0.89 plus or minus 0.39 micromolar with range 0.5 to 1.43 and liver 34.3
      plus or minus 6.2 pmol per mg protein with range 27.3 to 38.8. Both
      central values and both ranges match the report exactly, and the
      attribution to Table 2 is correct. This claim was NEEDS_VERIFICATION in
      the first version of this assessment because three retrieval routes
      failed from this environment and the repository cache for the reference
      is abstract-only; the manuscript PDF was then supplied directly, which is
      what settled it. One qualification the table carries and the report does
      not: the cohorts are very small, n equals 5 PH3 sera and n equals 3 PH3
      livers, so "measured in PH3 patients" rests on three liver samples. That
      does not change the order of magnitude the inhibition estimate turns on,
      since closing a 200-fold gap would take far more than sampling spread,
      but it belongs next to any use of the figure. Not linked to the analysis:
      these are the measurements the analysis consumes as input, not something
      it produced.
    citations:
      - PMID:22771891
    analysis_ids: []
  - claim_id: no-tissue-gr-activity-measurement
    statement: >-
      No study has measured glyoxylate reductase activity in PH3 patient
      tissue, so the hypothesis has never been tested where it would operate.
    disposition: QUALIFIED
    report_quote: >-
      returned **no study** that directly measured GRHPR enzymatic activity in
      PH3 patient tissue
    rationale: >-
      Consistent with the logged searches and with the state of the cited
      literature, and it is the finding that keeps the hypothesis unresolved
      rather than refuted. Qualified because a negative result from two PubMed
      queries is scoped to those queries: the log itself records that GenCC,
      ClinGen and ClinVar were not consulted, and no proteomics or enzymology
      repository was searched directly. An absence established this way is a
      good lead for a knowledge gap and not a proof that nobody has measured it.
    citations: []
    analysis_ids: []
  - claim_id: no-trial-targets-this-edge
    statement: >-
      No registered trial or agent targets glyoxylate reductase restoration or
      HOG lowering in PH3; the registered interventions act downstream on
      lactate dehydrogenase.
    disposition: RETAINED
    report_quote: >-
      No registered trial or agent targets glyoxylate reductase
      restoration/activation or HOG lowering.
    rationale: >-
      The registry was queried directly with both URLs, statuses and total
      counts logged, and the named studies are consistent with what is known of
      the PH3 trial landscape. This is a therapeutic-landscape observation
      rather than evidence about the mechanism, and the report does not
      overstate it. It does carry one real implication for the entry, which the
      sibling run also reached from a different direction: nedosiran's failure
      in PH3 while working in PH1 is hard to reconcile with a purely
      hepatocyte-local account of where PH3 oxalate comes from.
    citations:
      - PMID:39582099
    analysis_ids: []
  - claim_id: clinical-mildness-discordance
    statement: >-
      PH3 is the mildest primary hyperoxaluria and can normalise with age,
      which is discordant with sustained functional loss of the PH2 enzyme.
    disposition: QUALIFIED
    report_quote: >-
      If HOG substantially and chronically inhibited GR, PH3 should phenocopy
      PH2 (GRHPR genetic loss); instead PH3 is typically milder and more
      transient, which is discordant with sustained functional GR inhibition.
    rationale: >-
      The mildness half is supported: the quoted span from PMID:39476025
      verifies against its cached abstract, and PMID:21896830 independently
      describes PH3's lower urinary oxalate and preserved renal function. The
      argument is a reasonable consistency check rather than a decisive one,
      for a reason the source paper supplies: partial inhibition of an enzyme
      is not equivalent to losing it, so a milder phenotype is what a weak
      inhibition mechanism would predict, and the comparison cuts both ways.
      The "more transient" part is also doing work that the cited cohort, which
      is about prevalence and underdiagnosis, does not carry on its own.
    citations:
      - PMID:39476025
      - PMID:21896830
    analysis_ids: []
  - claim_id: bundle-fails-analysis-run-gate
    statement: >-
      The artifact bundle does not meet the repository's computational-run
      contract, although its computation is replayable.
    disposition: REJECTED
    report_quote: >-
      Bulk-tissue HOG; cannot exclude local microcompartment enrichment
    rationale: >-
      Recorded against the limitation line because the report makes no claim
      about its own manifest, unlike its sibling, which claimed one it had not
      written. The gate rejects this bundle on three counts: no MANIFEST.yaml,
      no artifact_manifest_sha256 in the report frontmatter, and no exact
      'ANALYSIS_STATUS: SUCCEEDED' line. Nothing was repaired, because writing a
      manifest now would stamp assessor-produced bytes onto a provider report
      and make the gate pass on a record the provider did not produce. The
      disposition is about the contract rather than the content: the
      computation itself replayed cleanly, which is why the analysis above is
      PARTIAL and REPRODUCIBLE rather than REPORTED_ONLY. The quoted limitation
      is the report's own, and it is the right one to have named.
    citations: []
    analysis_ids:
      - gr-inhibition-at-measured-hog

summary: >-
  The report's core finding is a concentration argument, and it holds. HOG
  inhibition of glyoxylate reductase is real and specific in vitro, but the
  inhibition constant sits two to three orders of magnitude above the HOG
  concentrations measured in PH3 patients, so a reversible-inhibition estimate
  predicts well under one percent inhibition in vivo. The source paper's own
  discussion says the same thing in words, which the report found and quoted.
  Unlike its sibling run, this one computed rather than only read: the code,
  its inputs and its output table are committed, and an independent replay in a
  clean directory reproduced all five rows exactly. It is graded PARTIAL rather
  than SUCCEEDED only because no software versions or environment were
  recorded. Every input is now confirmed against the author manuscript: the
  Table 2 patient concentrations and the Fig. 4 global-fit parameters match the
  report exactly, including the ranges, so the report extracted them
  faithfully. Two cautions remain, both about what the numbers can carry rather
  than whether they are right. The computation's weakest step is one the report
  names itself, that bulk tissue HOG stands in for the concentration at the
  enzyme, which is a proxy rather than a measurement. And Table 2's cohorts are
  very small, n equals 5 PH3 sera and n equals 3 PH3 livers, which the report
  does not mention; the gap it computes is wide enough to survive that, but the
  figure should not be quoted as a population value.
  The bundle fails just validate-hypothesis-analysis-run on
  three counts, all provenance: no MANIFEST.yaml, no artifact_manifest_sha256
  binding, and no analysis-status marker.

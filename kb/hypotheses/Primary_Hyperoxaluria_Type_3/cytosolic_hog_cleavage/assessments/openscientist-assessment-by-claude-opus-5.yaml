    status_reason: >-
      An annotation lookup rather than a computation. The response snapshot is
      committed and the recorded query can be re-run against the live API, but
      no software version, code or environment was recorded and UniProt is
      unpinned, so this is not reproducible in the sense the schema reserves
      SUCCEEDED for.
    limitations: >-
      Establishes where HOGA1 is, which nobody disputes. It says nothing about
      the separate enzyme the hypothesis needs, and an ontology or sequence
      database cannot rule that enzyme out.
  - analysis_id: hog-to-oxalate-flux-quantification
    status: SKIPPED
    auditability: UNVERIFIABLE
    method: >-
      Direct measurement of flux from 4-hydroxy-2-oxoglutarate through
      glyoxylate to oxalate, which is the quantity the hypothesis turns on.
    comparison: Not run.
    input_data_source_ids: []
    status_reason: >-
      Not run and not runnable from a literature search. The report proposes
      13C-HOG tracing in PH3 patient-derived hepatocytes or organoids against
      HOGA1-corrected isogenic controls as the discriminating experiment, and
      records the analysis as skipped rather than substituting a literature
      estimate for it. That is the correct handling of an unmeasured quantity.
    limitations: >-
      Because this was never measured, no run of this kind can raise the
      hypothesis above a proposal, however many papers it reviews.
  - analysis_id: cytosolic-aldolase-identification
    status: FAILED
    auditability: UNVERIFIABLE
    method: >-
      Attempt to identify the cytosolic HOG-cleaving aldolase from available
      omics or proteomics evidence.
    comparison: Candidate cytosolic aldolases against measured HOG-cleaving activity.
    input_data_source_ids:
      - omics-cytosolic-aldolase-identity
    status_reason: >-
      No dataset resolving the enzyme's identity was located, so the attempt
      produced no result. The fallback was literature appraisal, which
      established only that the one previously named candidate,
      N-acetylneuraminate aldolase, was tested elsewhere and does not cleave
      HOG at a useful rate; it is recorded here as the fallback for this failed
      attempt rather than as a second analysis.
    limitations: >-
      A failed identification is not evidence that no such enzyme exists. It
      leaves the hypothesis's defining step without a molecular entity, which is
      the state the report correctly reports.
claims:
  - claim_id: upstream-half-established
    statement: >-
      The upstream half of the hypothesis is established: HOGA1 is a
      mitochondrial enzyme, PH3 variants are loss of function, and HOG with its
      hydroxyproline-pathway neighbours accumulates in PH3 patients.
    disposition: RETAINED
    report_quote: >-
      Its *upstream* half is firmly established: HOGA1 (DHDPSL) is a strictly
      mitochondrial enzyme whose PH3 variants are loss-of-function, and the
      hydroxyproline-pathway metabolites 4-hydroxy-2-oxoglutarate (HOG),
      4-hydroxyglutamate, and 2,4-dihydroxyglutarate (DHG) accumulate in PH3
      patient urine, serum, and liver.
    rationale: >-
      Supported by the cited sources and already carried by the disorder entry.
      PMID:22771891 reports all nine tested PH3 HOGA variants unstable,
      aggregation-prone and without measurable activity, and confirms HOG
      buildup in urine, sera and liver; PMID:22729392 reports the urinary
      metabolite elevations by GC-MS. Separating this from the distinctive step
      is the report's most useful move, because it is what stops the
      hypothesis's weak half borrowing credibility from its strong half.
    citations:
      - PMID:22771891
      - PMID:22729392
    analysis_ids: []
  - claim_id: cytosolic-enzyme-never-identified
    statement: >-
      The cytosolic aldolase the hypothesis depends on has never been
      molecularly identified.
    disposition: RETAINED
    report_quote: >-
      The responsible cytosolic aldolase has never been molecularly identified
    rationale: >-
      Consistent with everything reachable: the originating study
      (PMID:22729392) reports a detected activity in hepatocyte cell lines
      without purifying or identifying the enzyme, and the run's own attempt to
      find a dataset resolving its identity failed. Recording the absence is
      correct and is what makes the hypothesis's status readable.
    citations:
      - PMID:22729392
    analysis_ids: []
  - claim_id: nal-candidate-falsified
    statement: >-
      N-acetylneuraminate aldolase, the one named candidate for the cytosolic
      enzyme, does not cleave HOG at a useful rate.
    disposition: RETAINED
    report_quote: >-
      the one explicitly tested candidate — N-acetylneuraminate aldolase (NAL)
      — was nearly inactive against HOG
    rationale: >-
      Verified against the cached abstract of PMID:22771891, which states "NAL
      showed minimal activity towards HOG". The full text is stronger than the
      report's summary and worth noting: the authors also argue that even if
      some enzyme cleaved all the HOG, the same amount of glyoxylate would be
      produced and should be handled by the patient's intact GR and AGT, so
      cleavage alone would not produce a PH phenotype without a net increase in
      hydroxyproline-pathway flux. That argument weakens the hypothesis further
      than the report says, and it was promoted into the disorder entry as
      REFUTE evidence through normal snippet validation, not from this report.
    citations:
      - PMID:22771891
    analysis_ids: []
  - claim_id: mouse-compartment-contradiction
    statement: >-
      In the Hoga1-knockout mouse the residual HOG-to-glyoxylate aldolase
      activity is mitochondrial rather than cytosolic, and the cytosol instead
      reduces HOG to 2,4-dihydroxyglutarate, which inverts the compartment logic
      the hypothesis requires.
    disposition: RETAINED
    report_quote: >-
      the non-HOGA aldolase activity is **mitochondrial, not cytosolic**, the
      opposite of what the seed model predicts
    rationale: >-
      Verified against the cached abstract of PMID:39040543, which reports the
      activity "highest in liver mitoplasts, with no activity present in brain
      tissue lysates" and HOG-to-DHG metabolism "enhanced in the cytosolic
      compartment of the liver" preferring NADPH. This is the single most
      consequential finding in the report and the entry did not previously carry
      it. The species caveat is real and the report states it, so the finding
      qualifies the hypothesis in mouse rather than refuting it in human.
    citations:
      - PMID:39040543
    analysis_ids: []
  - claim_id: knockout-mouse-not-hyperoxaluric
    statement: >-
      HOGA1-deficient mice do not overproduce oxalate, and routing AGT to
      peroxisomes only, as in humans, does not change that.
    disposition: RETAINED
    report_quote: >-
      even Hoga1-/-/Agxt-/- mice engineered to express AGT in peroxisomes only
      (the human-like configuration) "did not show increased urinary oxalate,
      suggesting that AGT expression in both cellular compartments is not an
      explanation for the lack of hyperoxaluria in Hoga1-/- mice."
    rationale: >-
      The quoted span verifies against the cached abstract of PMID:40578401,
      and PMID:26428388 independently reports no increased oxalate excretion in
      Hoga1-null mice. The report reads this correctly as removing a candidate
      explanation for the model-human gap rather than as settling it. Note this
      bears on PH3 as a whole, not only on this hypothesis: it is a problem for
      any mechanism that is meant to operate inside a hepatocyte.
    citations:
      - PMID:40578401
      - PMID:26428388
    analysis_ids: []
  - claim_id: literature-only-run-declared
    statement: >-
      The run performed no computation on a primary dataset, and says so rather
      than presenting literature synthesis as analysis.
    disposition: RETAINED
    report_quote: >-
      No computational statistical analysis of a primary dataset was performed
    rationale: >-
      The committed bundle matches this: a PubMed query log, a UniProt response
      snapshot, an evidence matrix, and the rendered report. No code, no
      dataset, no result table beyond the matrix. The inventory in the report's
      own Data and Tool Use section distinguishes accessed from not-searched
      sources and marks the flux quantification skipped and the enzyme
      identification failed. The skipped and failed analyses are recorded in
      this sidecar's analyses block and deliberately not linked to this claim,
      since the claim is about the absence of computation rather than supported
      by it. This is the behaviour the assessment policy asks
      for, and it is the reason nothing in this report is counted here as
      computational support.
    citations: []
    analysis_ids: []
  - claim_id: manifest-bundle-claimed-not-present
    statement: >-
      The report states that a checksummed MANIFEST.yaml was prepared for its
      artifact bundle; no manifest exists in the bundle.
    disposition: REJECTED
    report_quote: >-
      An artifact bundle with a checksummed `MANIFEST.yaml`, evidence matrix,
      search logs, and this report was prepared under
    rationale: >-
      The bundle contains five files and none of them is MANIFEST.yaml, and the
      report frontmatter carries no artifact_manifest_sha256 binding. Running
      just validate-hypothesis-analysis-run against this report and directory
      fails on exactly three counts: missing MANIFEST.yaml, missing
      artifact_manifest_sha256, and no 'ANALYSIS_STATUS: SUCCEEDED' line. A
      manifest was not written, so the claim describes an artifact that does not
      exist. The defect is in the provenance record rather than in the science
      here, because the run made no computational claim that a manifest would
      have been needed to audit; a run that did make one and carried the same
      false statement would be a more serious problem. Not repaired: writing a
      manifest now would stamp assessor-produced bytes onto a provider report
      and make the gate pass without the provider having produced the record.
    citations: []
    analysis_ids: []
  - claim_id: curation-status-recommendation
    statement: >-
      The hypothesis should keep its CANONICAL status while its cytosolic step
      is flagged as speculative.
    disposition: QUALIFIED
    report_quote: >-
      retain the model as the default narrative but downgrade its mechanistic
      certainty
    rationale: >-
      Reasonable but not a finding, and not the provider's call. The status
      field records how the field treats a mechanism, so retaining CANONICAL is
      defensible on the ground that this remains the default published account;
      on the report's own evidence a lower status is also arguable. The
      disorder entry keeps CANONICAL and now carries the specific uncertainties
      in its notes, so a reader does not have to infer them from the status.
      Recorded as qualified because a curator decided it, informed by this
      report rather than instructed by it.
    citations: []
    analysis_ids: []

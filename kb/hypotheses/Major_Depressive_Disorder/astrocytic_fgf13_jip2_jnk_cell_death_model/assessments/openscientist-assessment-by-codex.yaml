hypothesis_id: astrocytic_fgf13_jip2_jnk_cell_death_model
assessed_at: "2026-07-29T20:07:33Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report correctly keeps the FGF13-JIP2-JNK mechanism emerging and
  model-specific: one new study supplies bidirectional mouse evidence and
  primary-astrocyte pathway data, while adult human causal evidence and
  independent replication are absent. Its central verdict is defensible, but
  several ancillary conclusions overreach. Older FHF2-IB2 biochemistry creates
  a context-dependent kinase-specificity conflict rather than directly
  refuting the newer astrocyte result; a sex-stratified dlPFC study does not
  predict a female-null FGF13 mechanism; FGF2 and FGF9 evidence is
  misclassified as more directly competing than it is; and selected literature
  papers cannot establish a search-verified genetic absence.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: bidirectional-mouse-model-evidence
    statement: >-
      The report appropriately treats the astrocyte-specific mouse
      perturbations as direct support within the tested model, not as proof of
      an adult human MDD mechanism.
    disposition: RETAINED
    report_quote: >-
      Astrocyte-specific knockout of FGF13 induces astrocytic apoptosis,
      exacerbates inflammatory levels, and aggravates depression-like behaviors
      in mice.
    rationale: >-
      The 2026 source reports bidirectional astrocyte-specific manipulation,
      behavioral effects, apoptosis, and inflammation in male stress-model
      mice. The report also correctly separates these model-organism results
      from its secondary human transcriptomic analysis. Because all
      load-bearing FGF13-depression evidence comes from one newly published
      study, PARTIALLY_SUPPORTED is appropriate only for the model-specific
      hypothesis.
    citations:
      - PMID:42421017
      - PMID:32341540
  - claim_id: jip2-jnk-biochemical-conflict
    statement: >-
      The older FHF2-IB2 result raises a serious kinase-specificity conflict but
      is not a direct refutation of JIP2-associated JNK signaling in primary
      astrocytes.
    disposition: QUALIFIED
    report_quote: >-
      The JIP2→JNK edge is directly contradicted by prior biochemistry.
    rationale: >-
      The 2002 study found that FHF2/FGF13 promoted IB2/JIP2 recruitment and
      activation of p38delta rather than JNK in its brain-complex and
      heterologous biochemical systems. That conflicts with the newer pathway
      assignment and makes p38delta an essential comparator. It did not repeat
      the 2026 perturbation in stress-exposed astrocytes, however, so
      differences in cell type, state, complex composition, or assay leave the
      newer result unresolved rather than directly refuted.
    citations:
      - PMID:12244047
      - PMID:42421017
  - claim_id: female-generalization-inference
    statement: >-
      The cited sex-stratified transcriptomic study supports testing both sexes
      but does not justify predicting that the FGF13 mechanism is male-only or
      null in females.
    disposition: REJECTED
    report_quote: >-
      is not expected to generalize to female MDD
    rationale: >-
      The study found different cell types contributing the largest numbers of
      significant DEGs in females and males, but also reported similar
      threshold-free MDD-associated expression patterns and astrocyte
      concordance between sexes. It did not test FGF13, JIP2, kinase activity,
      or astrocyte apoptosis. The valid conclusion is to require
      sex-stratified replication, not to infer a male subtype or an expected
      female-null result.
    citations:
      - PMID:37217515
  - claim_id: fgf2-parallel-mechanism
    statement: >-
      Astrocytic FGF2 is a useful parallel comparator, not a more parsimonious
      replacement for the distinct FGF13-JIP2 apoptosis mechanism.
    disposition: QUALIFIED
    report_quote: >-
      a more parsimonious, better-human-anchored FGF-family alternative
    rationale: >-
      The FGF2 study directly manipulated astrocytic Fgf2 in male mouse nucleus
      accumbens and linked it to stress resilience and blood-brain-barrier
      protection. Its human component associated circulating FGF2 with
      symptoms; it did not establish human astrocyte causality. Different
      protein, region, cellular target, and endpoint make this a parallel
      mechanism showing that shared behavioral effects are nonspecific, not an
      evidential substitute for the FGF13-JIP2-JNK chain.
    citations:
      - PMID:41545369
      - PMID:42421017
  - claim_id: fgf9-evidence-context
    statement: >-
      The cited FGF9 neurotoxicity experiment is not direct MDD evidence and
      should not carry the report's composite MDD claim by itself.
    disposition: QUALIFIED
    report_quote: >-
      FGF9 selectively upregulated in MDD; suppresses synaptic/neuronal function
    rationale: >-
      PMID:37705188 tested FGF9-treated cultures and cortical overexpression in
      a progressive-multiple-sclerosis context; its MDD statement was a premise
      drawn from earlier work. The directly relevant primary MDD study is
      PMID:26351673, which reported increased hippocampal FGF9 in postmortem MDD
      cohorts and bidirectional affect-related results in rodents. Even that
      study supports a parallel FGF9 hypothesis, not a test of astrocytic FGF13,
      JIP2, or JNK.
    citations:
      - PMID:37705188
      - PMID:26351673
  - claim_id: human-fgf13-context
    statement: >-
      The report correctly identifies the secondary GSE144136 association as
      the only positive human FGF13 component; an older frontal-cortex
      FGF-system study supplies background but not a verified negative FGF13
      result.
    disposition: RETAINED
    report_quote: >-
      The only human component is a secondary transcriptomic association
    rationale: >-
      The secondary GSE144136 astrocyte result remains the only positive,
      cell-type-specific human component tied to this hypothesis. The abstract
      of PMID:15483108 reports dysregulation of several FGF-system transcripts
      in frontal cortical tissue but does not identify FGF13 among its
      significant findings. It says profiles of other detected growth factors
      and receptors were made available, but the abstract does not establish
      that FGF13 was measured or nonsignificant. The older study is therefore
      broad FGF-system context, not evidence for or against an
      astrocyte-restricted FGF13 signal.
    citations:
      - PMID:15483108
      - PMID:32341540
      - PMID:42421017
  - claim_id: genetic-absence-claim
    statement: >-
      The report did not perform the systematic resource-level search needed to
      label FGF13 or MAPK8IP2 human genetic support a verified absence.
    disposition: REJECTED
    report_quote: >-
      Search-verified source-level absence: FGF13 and MAPK8IP2/JIP2 are absent
      from prioritized human MDD GWAS/functional-genomics loci
    rationale: >-
      Checking whether selected recent papers mention the genes is not
      equivalent to querying the underlying large GWAS, exome results, GenCC,
      and ClinGen resources. The report itself lists a direct
      PGC-MDD/GWAS/exome/GenCC/ClinGen lookup as work that would resolve the gap.
      It may say that no genetic support was identified in the material
      inspected, but it cannot record a search-verified absence.
  - claim_id: curation-disposition
    statement: >-
      The report's recommendation to retain EMERGING status and avoid a human
      causal edge or FGF13-directed treatment is appropriate.
    disposition: RETAINED
    report_quote: >-
      Keep at EMERGING.
    rationale: >-
      The evidence supports a testable male-mouse and primary-astrocyte model,
      while human regional translation, cell-death identity, kinase
      specificity, causal mediation, replication, target engagement, and
      safety remain unresolved. The disease YAML should preserve a
      HUMAN_MODEL_MISMATCH discussion and should not promote the report's
      ancillary alternatives or negative-search claims into curated causal
      assertions.
    citations:
      - PMID:42421017
      - PMID:12244047
      - PMID:37217515

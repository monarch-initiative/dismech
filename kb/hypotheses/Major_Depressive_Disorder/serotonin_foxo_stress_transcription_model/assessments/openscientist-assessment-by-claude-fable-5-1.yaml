overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report's central judgment is sound and its load-bearing quotes check
  out against the fetched abstracts: the serotonin-to-DAF-2-to-DAF-16 chain is
  established in Caenorhabditis elegans, a mammalian AKT-to-FOXO arm exists
  and is reversed by antidepressants, but no mammalian study tests the
  serotonin-to-FOXO edge that defines the hypothesis, rodent FOXO3a
  directionality is contradictory, the one human FOXO3 cohort is negative for
  depressive symptoms, and the only human genetic FOXO signal is a FOXO1
  credible set from a cognition-by-MDD interaction GWAS. I replayed the Open
  Targets queries and reproduced the FOXO1 association and the single
  credible set, and the evidences call returned no credible-set or burden
  rows for INSR, IGF1R or FOXO3. The report's recommended disposition, a
  HUMAN_MODEL_MISMATCH discussion attached to Monoamine Deficiency rather
  than a new node, is adopted. Two things keep the provider analyses at
  PARTIAL: the GraphQL query file the report says it saved is not in the
  bundle, and there is no MANIFEST.yaml.

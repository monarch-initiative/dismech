claims:
  - claim_id: worm-chain-established
    statement: >-
      The serotonin-to-insulin-receptor-to-FOXO chain, and its reversal by
      fluoxetine, lithium and clozapine, is established in C. elegans.
    disposition: RETAINED
    report_quote: >-
      The chain is real and reproducible in worms; the question is whether it
      generalises to human disease.
    rationale: >-
      The three worm quotes in the report are exact abstract text of
      PMID:17141627, PMID:10676966 and PMID:21732403, all of which were
      fetched and cached. This is the seed evidence, so the report adds no
      independent support here; it correctly labels it INDIRECT for MDD.
    citations:
      - PMID:17141627
      - PMID:10676966
      - PMID:21732403
  - claim_id: no-mammalian-serotonin-foxo-edge
    statement: >-
      No study demonstrates a serotonin-to-FOXO edge in any mammal, so the
      hypothesis's defining step is untested outside the nematode.
    disposition: RETAINED
    report_quote: >-
      The single missing causal step that defines the hypothesis — a
      demonstrated serotonin→FOXO edge in a mammal — was not found.
    rationale: >-
      A negative claim, but a declared one: the search log records three
      targeted PubMed phrasings with dates and hit counts. It remains a
      negative search, not proof of absence, and the report says so. This is
      the decisive finding for the curation decision.
  - claim_id: mammalian-akt-foxo-arm
    statement: >-
      Rodent stress models support an AKT-to-FOXO arm in which nuclear FOXO is
      pro-depressive and antidepressants act by excluding or degrading FOXO.
    disposition: QUALIFIED
    report_quote: >-
      they establish the downstream AKT→FOXO→stress-program arm but leave the
      defining serotonin→FOXO edge untested
    rationale: >-
      The quoted sentences from PMID:41249439 (NDRG2 inhibits AKT and promotes
      FoxO3a nuclear translocation and Puma activation in astrocytes) and
      PMID:36039087 (an herbal antidepressant promotes FOXO1 cytoplasmic
      translocation through SIRT1) are exact. QUALIFIED because the four
      studies use different FOXO family members, cell types and triggers, and
      one of them is a multi-component herbal formulation, so they show a
      shared effector rather than one mechanism.
    citations:
      - PMID:41249439
      - PMID:36039087
      - PMID:36819781
      - PMID:37173696
  - claim_id: rodent-directional-conflict
    statement: >-
      Within rodents FOXO3a is pro-depressive in astrocytes but protective
      when overexpressed in dentate gyrus neurons.
    disposition: RETAINED
    report_quote: >-
      So within rodents FOXO3a is cast as both pro- and anti-depressive
      depending on cell type and region
    rationale: >-
      Confirmed against the full abstract of PMID:41622191: chronic
      unpredictable stress decreased dentate-gyrus FoxO3a and targeted
      AAV-FoxO3a injection alleviated the behavioural, oxidative and
      inflammatory changes. Set against PMID:41249439, the sign of FOXO3a's
      effect depends on the cell type, which the hypothesis as written does
      not accommodate.
    citations:
      - PMID:41622191
      - PMID:41249439
  - claim_id: human-foxo3-biomarker-negative
    statement: >-
      The one human cohort measuring FOXO3 found it unassociated with
      depressive symptoms after adjustment.
    disposition: QUALIFIED
    report_quote: >-
      After adjustment, FOXO3 remained unassociated with depressive symptoms
      (P = 0.232)
    rationale: >-
      Exact abstract text of PMID:42632434. QUALIFIED rather than RETAINED as
      a refutation: the cohort is 183 patients with a recent small subcortical
      infarct and 150 controls, the analyte is plasma FOXO3 protein in the
      acute phase, and the outcome is depressive symptoms at discharge, not
      MDD. It is weak evidence against the hypothesis, not a test of it.
    citations:
      - PMID:42632434
  - claim_id: foxo1-only-human-genetic-signal
    statement: >-
      The only human genetic evidence linking a FOXO gene to MDD is a FOXO1
      credible set whose parent study is a cognition-by-MDD interaction GWAS,
      and the insulin-receptor genes have no MDD genetic evidence.
    disposition: QUALIFIED
    report_quote: >-
      narrowing any claim to a cognitive subtype
    rationale: >-
      Reproduced by the assessor's own Open Targets query on 2026-10-09. The
      parent study's abstract (PMID:34782712) confirms the design: a
      genome-wide interaction meta-analysis of MDD and cognitive function in
      3510 cases and 6057 controls, with FOXO1 appearing among pathway-analysis
      core genes. L2G of 0.469 is below the usual 0.5 threshold. QUALIFIED
      rather than RETAINED only because the provider analyses it rests on are
      partially auditable (no saved query file, no manifest); the assessor's
      replay gives the same numbers.
    citations:
      - PMID:34782712
    analysis_ids:
      - ot-association-scan
      - ot-foxo1-credible-set
  - claim_id: insulin-link-is-metabolic-comorbidity
    statement: >-
      The human insulin-pathway link to MDD is a bidirectional metabolic
      comorbidity with type 2 diabetes, not a serotonin-gated transcriptional
      switch.
    disposition: RETAINED
    report_quote: >-
      The insulin node in human MDD is therefore real, but it operates as a
    rationale: >-
      The Mendelian randomization quote is exact abstract text of
      PMID:40595333, including the obesity-mediated insulin-resistance
      pathway. The inference that this is a different edge from the one the
      hypothesis draws is the report's, and it is reasonable: nothing in the
      MR study concerns serotonin or FOXO.
    citations:
      - PMID:40595333
  - claim_id: serotonin-premise-contested
    statement: >-
      The hypothesis's upstream premise, loss of serotonin, is contested in
      humans and may hold only for a subgroup of patients.
    disposition: RETAINED
    report_quote: >-
      by the Moncrieff umbrella review, surviving at best as a
      subtype-restricted claim
    rationale: >-
      Both quotes are exact: the umbrella review's stated aim (PMID:35854107)
      and the riposte's sentence that decreased serotonin activity is
      characteristic of only a subgroup of depressed subjects
      (PMID:36356194). This bears on the entry's Monoamine Deficiency node as
      much as on the hypothesis, and the node already calls itself
      oversimplified.
    citations:
      - PMID:35854107
      - PMID:36356194
  - claim_id: disposition-human-model-mismatch
    statement: >-
      The right curation outcome is a HUMAN_MODEL_MISMATCH discussion attached
      to Monoamine Deficiency, not a new insulin/FOXO pathophysiology node.
    disposition: RETAINED
    report_quote: >-
      Recommended disposition: HUMAN_MODEL_MISMATCH discussion attached to
      Monoamine Deficiency, with a subtype-restricted EMERGING FOXO1 lead — not
      a promoted primary pathophysiology node.
    rationale: >-
      Follows from the retained claims above and matches the decision rule
      set for this issue: a node only if the human evidence is solid and the
      links to the entry can be established. The human evidence here is one
      negative biomarker cohort, one subtype-conditioned interaction-GWAS
      locus, and a metabolic comorbidity that does not run through serotonin.
      The report's secondary suggestion of a subtype-restricted EMERGING
      FOXO1 lead is not adopted as a separate record; it is noted inside the
      discussion.

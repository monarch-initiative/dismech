claims:
  - claim_id: gene-disease-established
    statement: >-
      RNU5B-1 variants cause a neurodevelopmental disorder.
    disposition: QUALIFIED
    report_quote: >-
      Independently demonstrated by two orthogonal discovery strategies
    rationale: >-
      The gene-disease link is sound and has two later reports of further cases
      (PMID:42502410, a Japanese cohort; PMID:40968615, a Chinese cohort). The
      two discovery papers used different methods but are not independent
      samples: Jackson et al. analysed the 100,000 Genomes Project and Nava et
      al. included the Genomics England and NHS GMS cohorts held in the same
      environment, so overlapping individuals are likely.
    citations:
      - PMID:40379786
      - PMID:40442284
      - PMID:42502410
      - PMID:40968615
  - claim_id: missplicing-weakly-supported
    statement: >-
      Mis-splicing as the mechanism is supported only by four RNU5B-1 carriers'
      lymphocytes and by analogy to RNU4-2.
    disposition: RETAINED
    report_quote: >-
      For **RNU5B-1 itself**, the only splicing data come
      from cultured lymphocytes of **four carriers**
    rationale: >-
      Matches PMID:40379786, which analysed two n.39C>G and two n.44A>G
      carriers, found no shared signature, and describes the per-variant
      effects as possible. The RNU2-2 comparison (PMID:41912934, subtle
      variant-specific blood effects) is a fair qualifier on effect size.
    citations:
      - PMID:40379786
      - PMID:41912934
  - claim_id: renu-neuron-signature
    statement: >-
      In ReNU syndrome, a blood splicing signature specific to T-loop variants is
      reproduced in iPSC-derived cortical neuron-like cells.
    disposition: RETAINED
    report_quote: >-
      recapitulated in iPSC cortical neurons
    rationale: >-
      PMID:42856368 states that the signature was fully recapitulated across
      differentiation into cortical neuron-like cells from a patient-derived
      n.64_65insT line. It is a preprint and concerns RNU4-2, so it supports the
      feasibility of the neural experiment and the portability of blood
      signatures in a sibling disorder, not any RNU5B-1 result.
    citations:
      - PMID:42856368
  - claim_id: loop-i-pairing-speculative
    statement: >-
      The loop I pairing rationale is an inference from normal spliceosome
      biology, untested for RNU5B-1.
    disposition: RETAINED
    report_quote: >-
      The "loop I pairing" rationale
      is an **inference from normal spliceosome biology**
    rationale: >-
      Correct and consistent with the seed's own wording; PMID:39809319 is a
      review of normal splice-site classes with no RNU5B-1 data.
    citations:
      - PMID:39809319
  - claim_id: qc-competing-model
    statement: >-
      snRNA quality control, which degrades defective and disease-mutant snRNAs,
      supports a competing loss-of-function or broad dominant-negative model.
    disposition: QUALIFIED
    report_quote: >-
      A mechanistically grounded **competing model — loss-of-function /
      dominant-negative splicing stress via snRNA quality control**
    rationale: >-
      PMID:42562572 shows that quality-control pathways repress mutant snRNAs
      associated with developmental disorders and that impeding quality control
      produces aberrant spliceosomes and altered splicing; PMID:42629158 is a
      commentary on it. The study worked on U1 variants and a general set of
      disease mutants, and its abstract does not say RNU5B-1 loop I variants were
      tested. It makes the competing model credible and testable, not
      demonstrated for this disease. A loss-of-function reading also has to
      explain why heterozygous loss of one of several brain-expressed U5 genes
      would be pathogenic, and recessive RNU4-2 (PMID:41951959) shows that a
      loss-of-function snRNA disease can look clinically different.
    citations:
      - PMID:42562572
      - PMID:42629158
      - PMID:41951959
  - claim_id: u4atac-target-template
    statement: >-
      A defined mis-spliced target has been traced for one snRNA disorder, in a
      Drosophila U4atac model.
    disposition: RETAINED
    report_quote: >-
      U4atac stem-II mutant mis-splices immunity/hematopoiesis set incl. JAK (hop)
    rationale: >-
      PMID:42463491 reports Hop-related defects in the fly mutant and reduced
      Jak1 expression in Roifman syndrome patients. It concerns the minor
      spliceosome and a recessive disorder, so it is a methodological template
      for finding a target, not evidence about U5.
    citations:
      - PMID:42463491
  - claim_id: joint-laxity-manifestation
    statement: >-
      Joint laxity is a clinical manifestation of the disorder.
    disposition: REJECTED
    report_quote: >-
      Developmental delay, seizures, joint laxity
    rationale: >-
      The phrase comes from the disease name, not from patient data. Nava et al.
      (PMID:40379786) tabulate joint hyperlaxity only for RNU4-2 patients, and the
      single RNU5B-1 patient in PMID:42502410 Table 2 did not have it.
    citations:
      - PMID:40379786
      - PMID:42502410
  - claim_id: neuron-term-binding
    statement: >-
      CL:0000679 is the right binding for the cortical excitatory neuron the
      report proposes.
    disposition: REJECTED
    report_quote: >-
      cell type — cortical excitatory neuron (CL:0000679)
    rationale: >-
      CL:0000679 is labelled "glutamatergic neuron" in CL. The report's term
      check did not flag the mismatch, so the label passed only because it was
      not compared. A curator should look up a cortical glutamatergic neuron
      term directly rather than reuse this pairing.
  - claim_id: no-public-dataset
    statement: >-
      No public dataset exists to re-test RNU5B-1 splicing independently.
    disposition: QUALIFIED
    report_quote: >-
      No accessible omics dataset
      exists to independently re-test the splicing claim
    rationale: >-
      Supported by the committed GEO DataSets and SRA searches, but GDS covers
      only curated series, and controlled-access archives such as EGA and the
      paper's supplementary tables were not searched. The safer statement is
      that no openly accessible dataset was found.

hypothesis_id: amyloid_beta_proteotoxicity
assessed_at: "2026-08-02T20:15:00Z"
overall_verdict: SUPPORTED
summary: >-
  The report reaches the same verdict as the KB entry (refuted as stated,
  correctly curated DEPRECATED) and reaches it along five axes, three of which
  the entry did not cover: therapeutics, genetic architecture, and an
  experimental causal inversion placing inflammation upstream of amyloid
  handling. Its most valuable contributions are two positive findings the entry
  lacked - the TDP-43-dependent cryptic HDGFL2 peptide as a genuinely
  IBM-specific marker (absent in 197 disease-control biopsies), and the report's
  explicit statement that a targeted search for independent, non-originating-lab
  replication of the Abeta-oligomer data returned nothing, which converts an
  inference in the entry into a checked absence.

  The verdict agreement is weak confirmation and should be read as such: the
  prompt template passes the full seed YAML including `status: DEPRECATED` and
  the entire curated assessment, so the report was anchored on the conclusion it
  reached. The findings that carry weight are the ones that are new, not the
  ones that agree.

  All 7 newly proposed PMIDs were fetched and read. Six are accurately
  characterized. One is materially mis-sourced: PMID:23998706 is cited as
  in-vitro evidence that IL-1beta promotes APP/amyloid production, but that
  paper is a 4-patient negative anakinra pilot trial, and the IL-1beta-to-APP
  statement appears only in its introductory framing, not its results. Citing a
  background assertion as if it were a finding is the precise failure mode
  PMID:19622839 documented for this literature - which makes it worth recording
  here rather than silently correcting.
claims:
  - claim_id: overall-verdict-refuted
    statement: >-
      The amyloid-beta proteotoxicity hypothesis is refuted as stated and is
      correctly curated as DEPRECATED.
    disposition: RETAINED
    report_quote: "Verdict: REFUTED as stated; correctly curated as DEPRECATED"
    rationale: >-
      Concordant with the curated assessment and with the primary evidence the
      entry already cites. Discounted as confirmation, however: the prompt
      supplied the seed YAML including the DEPRECATED status and the full
      curated reasoning, so agreement is close to what anchoring alone predicts.
      No status change is warranted, and none was already contemplated.
    citations:
      - PMID:19533646
      - PMID:9781653
      - PMID:16788822
  - claim_id: hdgfl2-ibm-specific-marker
    statement: >-
      A TDP-43-dependent cryptic HDGFL2 peptide is present in about two-thirds
      of IBM biopsies and absent across 197 disease controls, demonstrating that
      an IBM-specific molecular marker exists and is not amyloid.
    disposition: RETAINED
    report_quote: >-
      positive in roughly two-thirds of IBM biopsies and **absent in 197/197
      disease controls** except 2 vacuolar myopathies
    rationale: >-
      Verified against the abstract: cryptic HDGFL2 peptides were found in 79 of
      122 IBM patients (65%), and immunoreactivity was absent in 197 disease
      control biopsies except 2 with vacuolar myopathies. This is the strongest
      new item in the report and is a genuine addition - the entry argued
      amyloid's non-specificity from negatives, whereas this supplies the
      positive counter-example. Note one internal inconsistency in the report:
      its executive judgment says the marker "is present in the great majority
      of IBM biopsies", which overstates 65%; the Key Findings section states it
      correctly.
    citations:
      - PMID:39757935
  - claim_id: il1b-promotes-app-production
    statement: >-
      IL-1beta, upregulated in sIBM myofibres, co-localizes with APP and
      promotes APP and amyloid production, placing inflammation upstream of
      amyloid.
    disposition: REJECTED
    report_quote: >-
      **IL-1β**, which is upregulated in sIBM myofibres, co-localizes with APP
      and *promotes* APP/amyloid production
    rationale: >-
      Mis-sourced. PMID:23998706 is a 4-patient open pilot trial of anakinra in
      sIBM that found no improvement in muscle strength; the IL-1beta / APP
      statement appears only in the paper's introductory framing, not as a
      result it reports. The report additionally groups this citation with
      PMID:23294492 as "in-vitro data", which this human trial is not. Citing a
      review-style background assertion as though it were a finding is exactly
      the amplification pattern PMID:19622839 identified in this literature, so
      the claim is rejected rather than qualified. The paper remains usable for
      what it actually shows - that IL-1 blockade did not benefit sIBM patients,
      with the authors listing "the irrelevance of IL1 in the disease process"
      among the possible explanations.
    citations:
      - PMID:23998706
      - PMID:19622839
  - claim_id: tnfa-drives-app-processing
    statement: >-
      TNF-alpha upregulates macroautophagic processing of APP and beta-amyloid
      in human muscle cells, inverting the seed hypothesis's causal order.
    disposition: QUALIFIED
    report_quote: >-
      **TNF-α** upregulates macroautophagic processing of APP/β-amyloid in human
      muscle cells
    rationale: >-
      The underlying result is real and is legitimate causal-inversion evidence,
      but the scope is narrower than stated. The experiment was performed in a
      human rhabdomyosarcoma cell line used as a muscle-cell model, not in
      primary human muscle or IBM tissue, and the authors' own conclusion is
      hedged ("macroautophagy may be a crucial mediator"). Usable as IN_VITRO
      evidence with the cell-line caveat stated; not usable as evidence about
      human IBM muscle.
    citations:
      - PMID:23294492
  - claim_id: no-independent-replication-of-abeta-oligomers
    statement: >-
      A targeted search for independent, non-originating-laboratory replication
      of the Abeta-oligomer / Abeta42 data in IBM muscle returned no papers.
    disposition: RETAINED
    report_quote: >-
      a targeted PubMed search for independent (non-originating-lab) replication
      of Aβ-oligomer/Aβ42 IHC in IBM returned no papers.
    rationale: >-
      Valuable because it is a checked absence rather than an inference. The
      entry asserted the oligomer data were "essentially single-laboratory" from
      authorship patterns; the report states it actively searched and found
      nothing. Retained with the standard scope limit - a negative search result
      bounds the published record as of the search date and is not proof that no
      replication exists. This strengthens, without settling, the open
      abnormal-presence half of the curated assessment.
    citations:
      - PMID:20711838
  - claim_id: gne-myopathy-app-upregulation
    statement: >-
      APP is upregulated in GNE myopathy and correlates with generic cell-stress
      markers, further undercutting IBM specificity.
    disposition: RETAINED
    report_quote: >-
      APP mRNA is elevated (non-significantly) and APP co-localizes with
      cell-stress markers (αB-crystallin, iNOS, NCAM, IL-1β), pointing to a
      generic stress response rather than an IBM-specific lesion
    rationale: >-
      Accurately characterized, including the parenthetical that the mRNA
      elevation did not reach statistical significance - the report did not
      overstate it. The correlation of APP mRNA with pro-inflammatory and
      cell-stress markers is a reported result. A useful additional
      non-specificity data point, though weaker than the postpolio and
      congenital-myopathy evidence already curated.
    citations:
      - PMID:23496965
  - claim_id: app-toxicity-without-aggregates
    statement: >-
      Human APP expressed in Drosophila muscle causes age- and
      activity-dependent weakness without any protein aggregates, decoupling
      toxicity from deposition.
    disposition: RETAINED
    report_quote: "without any protein aggregates or structural abnormalities"
    rationale: >-
      Verified: muscles from the transgenic animals did not display protein
      aggregates or structural abnormalities at light or electron microscopic
      level, while adults developed age-dependent climbing and flying defects.
      The inference drawn is apt and cuts against the histological arm of the
      hypothesis - if APP is pathogenic without deposits, then amyloid deposits,
      the diagnostic criterion, are not the toxic species. Model-organism
      evidence in an invertebrate; not sufficient alone for a human claim.
    citations:
      - PMID:21518451
  - claim_id: mck-bapp-mouse-qualified-support
    statement: >-
      MCK-betaAPP transgenic mice accumulate intramyofibre beta-amyloid and
      develop mitochondrial dysfunction before overt histopathology, showing
      Abeta accumulation can be upstream of mitochondrial injury.
    disposition: QUALIFIED
    report_quote: >-
      develop mitochondrial structural and functional damage, reduced TCA-cycle
      activity, a switch to anaerobic metabolism, increased ROS and plasmalemmal
      depolarization as early as 2–3 months — *before* overt histopathology
    rationale: >-
      Accurately characterized against the abstract. Qualified because it is a
      forced-overexpression construct: it establishes that Abeta accumulation
      can be proteotoxic in principle, not that this occurs in human IBM, and it
      is the same category of model-system evidence the entry's existing
      HUMAN_MODEL_MISMATCH discussion warns about for IBM specifically. The
      report handles this correctly, framing it as the reason the hypothesis is
      deprecated rather than nonsensical.
    citations:
      - PMID:22518836
  - claim_id: proteomics-not-reported-versus-absent
    statement: >-
      The rimmed-vacuole proteomics paper does not state whether Abeta or APP
      peptides were sought, so "not reported" should not be read as "absent".
    disposition: RETAINED
    report_quote: "does not state whether Aβ/APP were sought and not found."
    rationale: >-
      A fair and useful sharpening. The curated entry was already careful to say
      the paper "does not report" Abeta or APP rather than that it excluded
      them, and the curated discussion already notes that absence of detection
      in spectral-count proteomics is weak evidence of absence for a small,
      poorly soluble peptide. The report's proposed resolution - targeted
      re-interrogation of the existing LCM-MS peptide libraries for APP and
      Abeta peptides - is a cheaper and more direct test than the new blinded
      mass-spectrometry study already proposed in the entry's discussion, and is
      worth adding there.
    citations:
      - PMID:28009083
  - claim_id: therapeutic-and-genetic-absence
    statement: >-
      No amyloid-directed therapy has been trialed in IBM, the nearest proteostasis
      proxy failed, and no amyloid-pathway gene appears in IBM genetics.
    disposition: RETAINED
    report_quote: >-
      No amyloid-processing gene (APP, PSEN1/2, BACE1, APOE) is reported as an
      IBM susceptibility locus
    rationale: >-
      Two orthogonal axes the curated entry did not use. Verified that the 2025
      systematic review of IBM RCTs concludes drug interventions were not
      effective for most outcomes of interest, and the entry already curates the
      arimoclomol failure. Both are indirect - absence of an amyloid-directed
      trial means the mechanism has never been tested therapeutically, which is
      an argument about what remains unknown rather than a refutation - and the
      report says so explicitly.
    citations:
      - PMID:39843353
      - PMID:37739573
      - PMID:29611059

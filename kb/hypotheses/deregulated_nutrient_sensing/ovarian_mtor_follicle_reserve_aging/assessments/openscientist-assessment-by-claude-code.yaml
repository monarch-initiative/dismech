claims:
  - claim_id: C001
    statement: >-
      mTORC1 (not mTORC2) is the activation-driving arm: PTEN loss raises
      PI3K/AKT/mTORC1 in oocytes, prematurely activates the primordial-follicle
      pool and causes premature ovarian failure, and mTORC1-specific rapamycin
      given before activation prevents this and preserves the reserve.
    disposition: RETAINED
    report_quote: >-
      when administered to Pten-deficient mice prior to the activation of the
      primordial follicles, rapamycin effectively prevented global follicular
      activation and preserved the ovarian reserve
    rationale: >-
      Verified against PMID:23326514, whose abstract carries this sentence and
      the mTORC1 attribution. This is the mechanistically strongest edge and is
      the specific causal step the seed hypothesis lacked. Mouse genetics, so
      support for the human claim is by extension, but it directly resolves the
      seed's open mTORC1-vs-mTORC2 question in favour of mTORC1 as the driver.
    citations:
      - PMID:23326514
  - claim_id: C002
    statement: >-
      mTORC2 (RICTOR) is pro-survival; oocyte-specific Rictor loss causes
      follicular death and premature ovarian failure, the opposite sign to "less
      mTOR is better", and RICTOR is the one gene the human atlas validated.
    disposition: RETAINED
    report_quote: >-
      massive follicular death, excessive loss of functional ovarian follicles,
      abnormal gonadal hormone secretion, and consequently, secondary
      subfertility
    rationale: >-
      Verified against PMID:25564616. This is the directional tension that makes
      a naive "mTOR genes up, so inhibit mTOR" reading of the atlas unsafe,
      because the atlas-validated gene (RICTOR) is the protective mTORC2 arm.
      Confirms and sharpens the caveat the seed already recorded; it is the main
      reason the mTORC1-node evidence must stay INDIRECT until the complex is
      resolved in human cells.
    citations:
      - PMID:25564616
  - claim_id: C003
    statement: >-
      Rapamycin suppresses follicle activation in human ovarian tissue ex vivo,
      extending the mouse mechanism toward human relevance.
    disposition: RETAINED
    report_quote: >-
      rapamycin attenuates only PI3K signalling activation, in human ovarian
      cortex in vitro
    rationale: >-
      Verified against PMID:38070496 (the phrase is the paper's own title) and
      consistent with the already-curated human-xenograft result PMID:31887337.
      Human tissue, though ex vivo/in vitro rather than an in-vivo outcome.
    citations:
      - PMID:38070496
      - PMID:31887337
  - claim_id: C004
    statement: >-
      Human genetics of menopause timing is dominated by DNA-damage-response
      genes, not mTOR, which is a competing explanation for the hypothesis's
      boldest claim that mTOR sets menopause timing.
    disposition: RETAINED
    report_quote: >-
      Pathway analyses identified major association with DNA damage response
      (DDR) genes, including the first common coding variant in BRCA1 associated
      with any complex trait
    rationale: >-
      Verified against PMID:26414677, and corroborated by PMID:34349265 which
      states DDR "is the primary biological pathway that regulates reproductive
      senescence". This is the report's strongest human evidence and it argues
      the hypothesis should be scoped to follicle-activation RATE, not the
      genetic menopause clock. Accepted as a real scope limit; it does not
      refute the activation-rate axis.
    citations:
      - PMID:26414677
      - PMID:34349265
  - claim_id: C005
    statement: >-
      The age-related human ovarian mTOR signal cannot be assigned to mTORC1 vs
      mTORC2 or to a cell type from current evidence, because no one has
      resolved it in human tissue.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      which complex (mTORC1 vs mTORC2) and which cell type (oocyte vs granulosa
      vs stroma) carries the human signal
    rationale: >-
      This is the open question the run was meant to close with GSE202601 and
      did not, because the dataset was not accessed. It remains a genuine
      knowledge gap, not a finding. It is the reason the ovarian-atlas evidence
      on the hypothesis stays graded INDIRECT, and a reason to consider a
      Biomni/compute run or an external reanalysis if the question is worth the
      cost.
    citations: []

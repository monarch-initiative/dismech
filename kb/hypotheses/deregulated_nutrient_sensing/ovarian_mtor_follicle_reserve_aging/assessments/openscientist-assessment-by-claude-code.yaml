hypothesis_id: ovarian_mtor_follicle_reserve_aging
assessed_at: "2026-10-18T05:30:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The run was commissioned to analyse the GSE202601 human ovarian aging atlas
  (the question was whether the age-related mTOR signal is mTORC1- or
  mTORC2-biased and in which cell types). It did not do that: the provider ran
  a literature-only synthesis and states plainly that the GEO matrices were not
  downloaded and no analysis was executed, so the dataset question this run
  existed to answer is unresolved. As a literature review it is sound. Every
  PMID spot-checked exists with a matching title, and the load-bearing claims
  are accurately represented against their abstracts. Its useful contribution
  is three things the seed did not have: the specific mouse genetic edge that
  mTORC1 (not mTORC2) drives follicle activation and is prevented by rapamycin
  (PMID:23326514); human ex-vivo tissue support (PMID:38070496); and a genuine
  competing human-genetic account, that menopause TIMING is DNA-damage-response
  dominated rather than mTOR (PMID:26414677). It also sharpens the RICTOR/mTORC2
  tension the seed already flagged. The net curation action is to narrow the
  hypothesis scope to mTORC1-driven follicle-activation rate (reserve quantity),
  not menopause timing, and to add the verified supporting and competing edges.
  This records the run's assessment only; it does not change the hypothesis's
  MechanisticHypothesisStatusEnum value.

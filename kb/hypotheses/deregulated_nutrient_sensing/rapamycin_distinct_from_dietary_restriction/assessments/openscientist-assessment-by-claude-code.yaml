schema_version: "1.0.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: rapamycin_distinct_from_dietary_restriction
assessed_at: "2026-08-07T05:10:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report substantiates the divergence half of the hypothesis across multiple
  organisms and molecular modalities, while establishing a genuine convergence
  at the mTORC1 entry point that the strict "fully distinct routes" reading
  cannot accommodate. All 8 PMIDs cited in the report body were checked against
  PubMed: every one exists and every title matches the content the report
  attributes to it. Four load-bearing claims were additionally checked against
  the real abstracts and are accurately represented. The run's most useful
  contribution is a 2020 review devoted to precisely this question, which the
  originating sweep did not have. One report recommendation is rejected here on
  schema grounds rather than on evidence: the report proposes changing the
  hypothesis's KB status to "partially supported", which conflates a provider
  run's verdict with the hypothesis's positional standing among competing
  accounts. The verdict belongs in this assessment; MechanisticHypothesisStatusEnum
  is left untouched.
claims:
- claim_id: C001
  statement: >-
    Rapamycin and dietary restriction diverge molecularly and metabolically, but
    converge at the mTORC1 entry point, so the accurate framing is distinct but
    partially overlapping routes rather than fully distinct routes.
  disposition: RETAINED
  report_quote: >-
    **Verdict: Partially supported, trending toward supported — best described
    as "distinct but partially overlapping routes."**
  rationale: >-
    Accepted. This is a more precise position than the seed hypothesis stated,
    and it is better supported. The seed claimed the two interventions "converge
    on longevity without being the same intervention"; the report sharpens this
    by locating exactly where they overlap (mTORC1 entry, autophagy,
    translational suppression, part of the hepatic methylation signature) and
    where they diverge (endocrine and metabolic axes, most sharply insulin
    sensitivity).
- claim_id: C002
  statement: >-
    A Drosophila epistasis result - rapamycin further extending the lifespan of
    flies already maximized by dietary restriction - is the single strongest
    evidence for partly independent routes.
  disposition: QUALIFIED
  report_quote: >-
    The single strongest piece of evidence for partly independent routes is an
    epistasis result in *Drosophila*: rapamycin further extends the lifespan of
    flies whose lifespan has already been maximized by DR ([PMID:
    20074526](https://pubmed.ncbi.nlm.nih.gov/20074526/)). If the two
    interventions acted through one identical pathway, this additivity should
    not occur.
  rationale: >-
    Verified accurate. PMID:20074526's abstract states that rapamycin "could
    increase life span of weak insulin/Igf signaling (IIS) pathway mutants and
    of flies with life span maximized by dietary restriction, indicating
    additional mechanisms". The epistasis logic is sound. QUALIFIED on
    taxonomic level: this is Drosophila, while the hypothesis as curated is
    about a module evidenced predominantly in mice, and additivity in flies does
    not establish additivity in mammals. The report is explicit that the result
    is in Drosophila and does not disguise the extrapolation.
  citations:
  - PMID:20074526
- claim_id: C003
  statement: >-
    Dietary restriction, rapamycin and Ames dwarfism share a hepatic gene-body
    hypermethylation signature, so convergence exists even at the epigenetic
    level.
  disposition: RETAINED
  report_quote: >-
    convergence exists even at the epigenetic level, where DR, rapamycin, and
    Ames dwarfism share a hepatic gene-body hypermethylation signature ([PMID:
    30462643](https://pubmed.ncbi.nlm.nih.gov/30462643/))
  rationale: >-
    Verified against the abstract, which analyses whole-genome BS-seq from mouse
    liver across dietary restriction, rapamycin and Ames dwarf mice. Recording
    this is to the report's credit - it is the evidence that most weakens the
    hypothesis it was asked to evaluate, and it is what converts the verdict
    from SUPPORTED to PARTIALLY_SUPPORTED.
  citations:
  - PMID:30462643
- claim_id: C004
  statement: >-
    Rapamycin is diabetogenic while dietary restriction is insulin-sensitizing,
    so the two interventions move insulin sensitivity in opposite directions.
  disposition: RETAINED
  report_quote: >-
    rapamycin being diabetogenic (β-cell toxicity, mTORC2-driven insulin
    resistance) while DR is insulin-sensitizing.
  rationale: >-
    Supported by the cited literature and by PMID:25807975, whose title states
    that subacute calorie restriction and rapamycin "discordantly alter mouse
    liver proteome homeostasis" and whose abstract reports their effects on
    protein turnover and abundance "differed greatly between canonical
    pathways". An opposite-direction effect on a major metabolic axis is
    stronger evidence for route distinctness than mere non-overlap would be.
  citations:
  - PMID:23881200
  - PMID:31577953
  - PMID:25807975
- claim_id: C005
  statement: >-
    The KB status of the hypothesis should be upgraded from EMERGING toward
    "partially supported".
  disposition: REJECTED
  report_quote: >-
    I recommend upgrading the KB status from **EMERGING** toward **partially
    supported**, with an explicit subtype restriction to
    "distinct-but-overlapping" rather than "fully distinct."
  rationale: >-
    Rejected on schema grounds, not on evidence. MechanisticHypothesisStatusEnum
    admits only CANONICAL, ALTERNATIVE, EMERGING and DEPRECATED - a positional
    claim about where a hypothesis sits among competing accounts of a mechanism.
    "Partially supported" is a verdict about a body of evidence as read by one
    provider on one date, and its home is this sidecar's overall_verdict, where
    PARTIALLY_SUPPORTED is a permissible value of
    HypothesisAssessmentVerdictEnum. Allowing a single automated run to write
    the positional field would collapse "what one tool concluded" into "what the
    field holds". The substantive half of the recommendation - restricting the
    hypothesis to "distinct but overlapping" rather than "fully distinct" - is a
    legitimate curation lead and is recorded as such, but it is a change to the
    hypothesis description rather than to its status.
- claim_id: C006
  statement: >-
    The decisive experiment has not been performed - a lifespan-matched,
    multi-omic head-to-head of dietary restriction versus rapamycin versus the
    combination in a single mouse cohort.
  disposition: RETAINED
  report_quote: >-
    the decisive experiment — a lifespan-matched, multi-omic head-to-head of DR
    vs. rapamycin vs. the combination in a single mouse cohort — has not been
    located as of the search date.
  rationale: >-
    Accepted as stated, with the wording noted: the report says the study has
    not been *located*, which is a claim about the search rather than about the
    literature. That is the appropriately modest phrasing for a negative result
    from an automated search, and the gap is a good candidate for a
    KNOWLEDGE_GAP discussion on the module.
- claim_id: C007
  statement: >-
    Assessment-level observation, not a report claim - the run surfaced a 2020
    review devoted to the exact question the hypothesis asks.
  disposition: NEEDS_VERIFICATION
  rationale: >-
    PMID:30854544, "Is Rapamycin a Dietary Restriction Mimetic?", exists and its
    abstract concludes that "dietary restriction and rapamycin have different
    effects on many pathways and molecular processes" and that the two affect
    the lifespan of genetically manipulated mouse models differently. It is a
    strong candidate evidence item for this hypothesis and was not in the
    originating sweep. Marked NEEDS_VERIFICATION because it has not been through
    fetch-reference and snippet validation, so it must not be promoted to the
    hypothesis evidence list on the strength of this assessment alone.
  citations:
  - PMID:30854544

hypothesis_id: sex_dimorphic_geroprotector_exposure
assessed_at: "2026-08-07T05:10:00Z"
overall_verdict: REFUTED
summary: >-
  The report's central finding survives verification. The hypothesis makes one
  falsifiable prediction - equalize blood levels and the sex difference in
  geroprotector efficacy disappears - and wherever that prediction has been
  tested directly it has failed. All 17 PMIDs cited in the report body were
  checked against PubMed: every one exists and every title matches the content
  the report attributes to it, so there are no fabricated or misattributed
  citations. Four load-bearing claims were additionally checked against the real
  abstracts and are accurately represented, including the report's decisive new
  citation. The report is also honest about its own limits: it flags that the
  canagliflozin refutation rests on a neuroprotection endpoint with lifespan
  inference by extension, and it independently reaches the same conclusion the
  seed hypothesis notes had anticipated - that the single-model framing is wrong
  and the evidence splits by compound. This assessment records the run's verdict
  only; it makes no change to the hypothesis's MechanisticHypothesisStatusEnum
  value, which is a positional claim about the field and not a property of one
  provider run.
claims:
- claim_id: C001
  statement: >-
    The pharmacokinetic (drug-exposure) model of sex-dimorphic geroprotector
    response is refuted as a general explanation, and retains support only as a
    compound-specific contributor.
  disposition: RETAINED
  report_quote: >-
    **Verdict: Refuted as a general model; at best weakly/partially supported as
    a compound-specific contributor.**
  rationale: >-
    Verified and accepted. The model's sole clean prediction is that
    dose-matching abolishes the sex difference, and the direct test of that
    prediction (PMID:24245565, already curated on the hypothesis as REFUTE)
    failed for NDGA. The report does not overstate: it confines itself to
    refuting the general model rather than denying that exposure differences
    exist or matter.
  citations:
  - PMID:24245565
  - PMID:27312235
- claim_id: C002
  statement: >-
    A 2026 exposure-manipulation study undercuts the canagliflozin
    pharmacokinetic inference, showing that neither dose reduction nor greater
    drug accumulation confers the benefit in females.
  disposition: QUALIFIED
  report_quote: >-
    This directly undercuts the PK inference drawn from the 20-fold female
    blood-level observation (PMID 38753230), which was only a *correlational*
    association, never an exposure-matching test.
  rationale: >-
    The claim is accurate. PMID:42465412 exists and its abstract states that
    "neither dose reduction nor greater drug accumulation drives neuroprotective
    benefit in females" and that the sex-specific longevity effects "are not
    simply a matter of dose". The logical point is also correct: the 20-fold
    blood-level observation curated as SUPPORT on this hypothesis was
    correlational and never exposure-matched. QUALIFIED rather than RETAINED for
    two reasons the report itself discloses - PMID:42465412 is an unreviewed
    bioRxiv preprint, and its measured endpoint is neuroprotection and cognition
    rather than lifespan, so the lifespan conclusion is inference by extension.
    Demoting the curated SUPPORT item on this basis is defensible but should not
    be treated as settled until the preprint is reviewed.
  citations:
  - PMID:42465412
  - PMID:38753230
- claim_id: C003
  statement: >-
    The male-restricted response to 17-alpha-estradiol is gonadal-hormone gated,
    which is a pharmacodynamic wiring signature rather than a drug-disposition
    difference.
  disposition: RETAINED
  report_quote: >-
    the male-restricted response is **gonadal-hormone dependent** — castration
    abolishes the male metabolomic and functional response to 17aE2 (PMID
    29806096, 30740872), and tissue-level anti-inflammatory drug responses are
    themselves male-specific (PMID 28544365). This is a pharmacodynamic wiring
    signature, not a disposition difference.
  rationale: >-
    Both citations verified against their abstracts and accurately represented.
    PMID:29806096 reports that after castration and ovariectomy "virtually all
    the male-specific metabolite responses to 17aE2 are inhibited or reduced";
    PMID:30740872 reports that castrated males "do not respond to 17aE2". This
    is the strongest positive evidence in the report for the competing
    pharmacodynamic model, and the inference drawn from it - that a
    hormone-gated response is wiring rather than disposition - is sound.
  citations:
  - PMID:29806096
  - PMID:30740872
- claim_id: C004
  statement: >-
    Rapamycin is the one compound for which the pharmacokinetic model remains
    internally consistent, since the sex gap narrows at higher dose.
  disposition: QUALIFIED
  report_quote: >-
    **Rapamycin is the single compound where the PK model remains internally
    consistent:** at a 3× higher dose the sex gap *narrows* (23% M vs 26% F,
    PMID 24341993) — the exposure-limited signature the PK model predicts
  rationale: >-
    The underlying numbers are correct - PMID:24341993 reports 23% (males) to
    26% (females) at the threefold-higher dose. QUALIFIED because a narrowing
    gap at one higher dose is consistent with an exposure-limited effect but
    does not establish it; no rapamycin dose-matching experiment analogous to
    the NDGA test has been done, so the compound has not actually been subjected
    to the prediction that falsified the model elsewhere. This is a coherence
    argument, not a test.
  citations:
  - PMID:24341993
  - PMID:38500383
- claim_id: C005
  statement: >-
    The defensible synthesis is a hybrid in which pharmacokinetics sets
    achievable exposure while a sex-dimorphic pharmacodynamic substrate
    determines whether that exposure produces benefit.
  disposition: RETAINED
  report_quote: >-
    The most defensible position is a **hybrid**: PK sets the achievable
    exposure, but a sex-dimorphic pharmacodynamic substrate
    (androgen/gonadal-hormone-gated nutrient-sensing physiology) determines
    whether that exposure translates into lifespan benefit.
  rationale: >-
    Accepted as the reading best fitting the verified evidence. It accommodates
    the real exposure differences (canagliflozin, rapamycin, NDGA/aspirin
    disposition) without letting them carry the causal weight the falsified
    predictions deny them, and it accommodates the hormone-gating result. It is
    a synthesis rather than a tested claim, so it is a candidate hypothesis
    rather than a finding.
- claim_id: C006
  statement: >-
    The single-model framing is wrong and the evidence splits by compound, with
    pharmacokinetics contributing for rapamycin and canagliflozin magnitude
    while pharmacodynamics dominates for NDGA, 17-alpha-estradiol and acarbose.
  disposition: RETAINED
  report_quote: >-
    the single-model framing is wrong. The evidence splits by compound — PK may
    contribute for rapamycin/canagliflozin magnitude, but PD dominates for
    NDGA/17aE2/acarbose.
  rationale: >-
    Accepted, and notable as independent convergence: the seed hypothesis notes
    curated before this run already stated that "the pharmacokinetic model may
    hold for some compounds (canagliflozin, rapamycin) and fail for others
    (NDGA), in which case the single-model framing is itself wrong and should be
    split". The report reached the same conclusion from the literature rather
    than from the seed's framing. The report also independently reproduces the
    seed's recorded scope caveat that this module is an imperfect home because
    the male-bias phenomenon spans compounds acting outside nutrient sensing.
    Together these are the strongest argument for splitting this hypothesis into
    a pharmacokinetic and a pharmacodynamic group, which is a curation decision
    and is not made by this assessment.
- claim_id: C007
  statement: >-
    Assessment-level observation, not a report claim - the run surfaced a 2025
    comprehensive review of two decades of the NIA Interventions Testing Program
    devoted to the sex-specific response pattern.
  disposition: NEEDS_VERIFICATION
  rationale: >-
    PMID:40717358 exists and its abstract confirms it reviews 54 agents in more
    than 30,000 mice and reports that "most compounds that extended lifespan
    were effective primarily or exclusively in male mice". It is not in the MPD
    ITP1 bibliography and was missed by the sweep in
    docs/reports/itp-citp-mechanism-sweep-2026-08-06.md. It is a strong
    candidate evidence item for this hypothesis, but is marked
    NEEDS_VERIFICATION because it has not yet been through fetch-reference and
    snippet validation and so must not be promoted to the hypothesis
    evidence list on the strength of this assessment alone.
  citations:
  - PMID:40717358

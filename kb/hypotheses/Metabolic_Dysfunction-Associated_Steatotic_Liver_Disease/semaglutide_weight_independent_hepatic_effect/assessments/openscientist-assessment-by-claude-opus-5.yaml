  - data_source_id: pubmed-literature
    source_type: DATABASE
    name: PubMed
    uri: https://pubmed.ncbi.nlm.nih.gov/
    access_status: UNVERIFIABLE
    retrieved_at: "2026-10-07T13:34:01Z"
    notes: >-
      The run's only material source, and its use cannot be audited. Eighteen
      references were extracted and all eighteen resolved under
      linkml-reference-validator 0.3.0, with six quoted claims checked and six
      found in source, so the references the report ended up citing are real.
      But no search log, query string or query response was committed, so which
      queries were run and what they returned cannot be established — which is
      why this is UNVERIFIABLE rather than ACCESSED. Coverage is therefore
      assessable only from the resulting reference list, and the omissions
      recorded in the claims below are what that list is missing.
claims:
  - claim_id: predominantly-weight-mediated
    statement: >-
      The hepatic benefit of semaglutide in MASH is predominantly mediated by
      weight loss and its metabolic sequelae.
    disposition: RETAINED
    report_quote: >-
      predominantly mediated by weight loss and its metabolic sequelae, not by a
      direct action of GLP-1 receptor agonism on the liver
    rationale: >-
      The conclusion survives the checks and is strengthened by evidence the
      report did not reach. PMID:42545725 puts 66.7% and 71.8% of the
      steatohepatitis endpoints through weight reduction, PMID:37212393 shows
      non-pharmacologic weight loss reproducing the histologic benefit, and
      PMID:40342635 — absent from the report — finds equal liver outcomes at
      matched weight loss. Three independent designs agree.
    citations:
      - PMID:42545725
      - PMID:37212393
      - PMID:40342635
  - claim_id: no-weight-matched-trial-exists
    statement: >-
      No weight-matched comparison of a GLP-1 receptor agonist against a
      non-GLP-1 weight-loss route with a liver endpoint has been performed.
    disposition: REJECTED
    report_quote: >-
      There is no RCT comparing semaglutide against caloric restriction,
      bariatric surgery, or a non-GLP-1 agent at **matched weight loss** with a
      liver histology endpoint. This is the single most informative missing
      experiment.
    rationale: >-
      PMID:40342635 is a randomised prospective trial of a GLP-1 receptor
      agonist against a caloric-deficit lifestyle arm in MASLD that states
      "Matched weight loss was achieved in both arms" and reports reductions in
      alanine aminotransferase, liver steatosis and disease activity "similar
      following both treatments". PMID:28503750 is a second randomised matched
      comparison with an equivalent liver-fat result. The report's
      histology-endpoint qualifier is literally true — both use imaging and
      biochemistry — but the categorical framing presents the experiment as
      never attempted, which conceals two negative results bearing directly on
      the hypothesis. The defensible gap is a matched-weight-loss trial with a
      histologic endpoint.
    citations:
      - PMID:40342635
      - PMID:28503750
  - claim_id: hepatic-receptor-absent
    statement: >-
      Human hepatocytes and hepatic stellate cells lack a functional GLP-1
      receptor, making a cell-autonomous hepatic action implausible.
    disposition: QUALIFIED
    report_quote: >-
      the widely reported absence of functional GLP1R protein in human
      hepatocytes and HSCs, which makes a cell-autonomous direct hepatic action
      anatomically implausible
    rationale: >-
      The conclusion is probably right and the report's own citation supports
      it, but the question is contested and the report does not say so.
      PMID:26394161 reports a 24.6% fall in lipogenesis in primary human
      hepatocytes, a direct functional effect in the same cell type where
      PMID:39607493 found none; PMID:20225248 is the original positive
      expression report. What decides between them is reagent validation, and
      the report cites none of that literature: PMID:24467746 pairs an
      extensively validated monoclonal antibody with in-situ ligand binding and
      finds no receptor in primate liver, which is the stronger negative than
      the one the report leans on. Reporting a live dispute as settled, while
      landing on the defensible side, is still an epistemic defect.
    citations:
      - PMID:24467746
      - PMID:26394161
      - PMID:39607493
      - PMID:20225248
  - claim_id: in-vitro-negative-tested-semaglutide
    statement: >-
      The in-vitro negative result establishes that human liver cells do not
      respond to GLP-1 receptor agonists.
    disposition: QUALIFIED
    report_quote: >-
      human liver cells do not respond to GLP-1R agonists in vitro
    rationale: >-
      PMID:39607493 tested liraglutide, acyl-GIP and the dual agonist MAR709,
      not semaglutide. The report states the agonists correctly in its own
      Finding 1 and then generalises in the summary and verdict. The class
      inference is reasonable, since liraglutide is a GLP-1 receptor agonist
      acting at the same receptor, but the verdict should carry it as an
      inference rather than as a result about semaglutide.
    citations:
      - PMID:39607493
  - claim_id: survodutide-not-transferable
    statement: >-
      The survodutide mediation result cannot be transferred to semaglutide,
      because its weight-independent component may be carried by the hepatic
      glucagon receptor.
    disposition: RETAINED
    report_quote: >-
      survodutide is a **dual agonist** engaging the hepatic **glucagon receptor
      (GCGR)**, which *is* expressed in human liver, so part of this
      "weight-independent" fibrosis signal may reflect direct GCGR action rather
      than GLP-1R action — a mechanism not available to semaglutide
    rationale: >-
      The strongest piece of reasoning in the report, and it is correct. The
      hepatic glucagon receptor is expressed in human liver and is
      pharmacologically engaged by survodutide, so a direct hepatic route exists
      for that agent and not for a pure GLP-1 receptor agonist. The report
      applies this caveat consistently and declines to carry the 36.3% figure
      over to semaglutide.
    citations:
      - PMID:42545725
  - claim_id: larger-direct-component-for-fibrosis
    statement: >-
      Semaglutide's antifibrotic effect has a larger weight-independent
      component than its effect on steatohepatitis resolution.
    disposition: REJECTED
    report_quote: >-
      A genuine but minority **weight-independent** component does appear to
      exist, and it is concentrated specifically on **fibrosis** rather than on
      steatohepatitis resolution.
    rationale: >-
      The inference runs from a survodutide figure the report itself says is not
      transferable, and the semaglutide-specific evidence points the other way.
      PMID:40305708 reports fibrosis improvement in 36.8% against a combined
      endpoint of 32.7%, so fibrosis improvement outside the resolution stratum
      is about 4 percentage points on semaglutide against about 6 on placebo —
      no excess over placebo, on marginal proportions. PMID:36934740 tests the
      claim where fibrosis is autonomous and finds improvement numerically lower
      on semaglutide than placebo. PMID:33185364 found no significant fibrosis
      benefit at 72 weeks despite 13% weight loss. The report reaches none of
      these. The marginal-proportion arithmetic is the assessor's, not a
      reported result, and cannot substitute for the unreported two-by-two.
    citations:
      - PMID:40305708
      - PMID:36934740
      - PMID:33185364
  - claim_id: no-essence-mediation-analysis
    statement: >-
      No mediation analysis of the ESSENCE trial has been published.
    disposition: QUALIFIED
    report_quote: >-
      No ESSENCE-based mediation analysis has yet been published
    rationale: >-
      An ESSENCE secondary analysis reporting exploratory mediation exists as a
      conference abstract, PMID:41660648, which states that the investigators
      "used exploratory mediation analyses to attempt to measure the extent to
      which the effects of semaglutide on liver parameters were indirect effects
      (resulting from body weight reduction) or direct effects". The report's
      claim is therefore wrong as to existence but right as to substance: that
      record carries no numeric direct/indirect split, so no published
      proportion-mediated figure for semaglutide exists. The report also
      correctly identifies this analysis as the highest-priority follow-up,
      which remains true for the full numeric result.
    citations:
      - PMID:41660648
  - claim_id: dnl-suppression-weight-independent
    statement: >-
      Suppression of de novo lipogenesis is a weight-independent hepatic effect
      of GLP-1 receptor agonism.
    disposition: RETAINED
    report_quote: >-
      reduced **postprandial lipid flux and de novo lipogenesis** independent of
      net weight change
    rationale: >-
      The report lists this among several speculative routes; it is in fact the
      best-evidenced one and deserves more weight than it is given.
      PMID:40342635 is the matched-weight-loss design, and suppression of de
      novo lipogenesis is precisely what separated the arms while steatosis and
      disease activity did not differ. That makes DNL the one weight-independent
      hepatic effect with randomised human support — and simultaneously shows it
      did not translate into a measurable liver-outcome difference over twelve
      weeks.
    citations:
      - PMID:40342635
      - PMID:26394161

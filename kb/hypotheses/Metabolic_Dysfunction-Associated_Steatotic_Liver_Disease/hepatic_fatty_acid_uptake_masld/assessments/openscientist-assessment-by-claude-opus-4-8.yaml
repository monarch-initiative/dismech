overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's own verdict (PARTIALLY_SUPPORTED, retain EMERGING) is the right
  one, and it reaches it the honest way: it splits the seed into a general claim
  and a strong, specific claim and lets the evidence separate them. The general
  claim — hepatocellular long-chain fatty-acid entry is protein-mediated, and
  circulating NEFA uptake is the quantitatively dominant source of hepatic
  triglyceride in human MASLD (~59%, Donnelly 2005) — is well supported, and
  each supporting quote checked here resolves to the cited paper at the right
  taxonomic level. The strong, specific claim — that FATP5/FATP2 are the
  rate-limiting, separately druggable setters of that flux and that blocking
  them reverses established human steatosis — is not supported in humans and is
  confounded in the rodent evidence (FATP5's bile-acid-CoA-ligase moonlighting
  function; reduced whole-animal caloric intake on knockdown). The report's
  distinctive contribution over the seed is three committed, inspectable
  database queries: Open Targets v4 shows no human genetic_association for any of
  the three transporters to any MASLD term; GTEx v8 shows FATP5 is constitutively
  liver-predominant while CD36 is low in healthy liver (disease-induced); and
  ClinicalTrials.gov v2 confirms zero FATP-directed MASLD trials. Those are
  genuine artifact-backed negatives, not literature paraphrase. Three caveats
  bound how this report may be used. (1) It ran with provider defaults
  (max_iterations 5, use_hypotheses false), so it is a full-depth run and its
  depth is not a limitation; read the verdict at that depth. (2) The GWAS
  Catalog direct lookup FAILED (legacy endpoint
  410, v2 gene-scoped query 404); the genetic-absence negative is therefore
  aggregator-mediated through Open Targets, not a primary-source scan, which the
  report discloses. (3) PubMed is described as "33 papers reviewed" across
  iterations but no search log is committed, so that search is an unverifiable
  access. Several citations are recent/high-numbered 2025-2026 PMIDs
  (40840619, 40935652, 42564069, 42687024); all resolve to real, on-topic cached
  records, and the resmetirom MAESTRO-NASH figures and Donnelly/CD36/bile-acid
  quotes should still be snippet-verified before any promotion to the disease
  YAML. No claim here is promoted into the MASLD entry; this is a research lead.

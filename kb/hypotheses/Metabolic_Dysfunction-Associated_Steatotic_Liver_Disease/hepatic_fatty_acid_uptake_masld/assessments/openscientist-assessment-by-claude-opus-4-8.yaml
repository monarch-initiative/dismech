claims:
  - claim_id: uptake-protein-mediated
    statement: >-
      Hepatocellular long-chain fatty-acid entry is a protein-mediated process
      rather than passive diffusion.
    disposition: RETAINED
    report_quote: >-
      hepatic LCFA uptake is protein-mediated ([PMID: 16618416]
    rationale: >-
      The general premise of the seed, supported by a whole-animal FATP5 knockout
      (PMID:16618416, MODEL_ORGANISM) and consistent with GTEx liver-predominant
      FATP5 expression. Well established; not in dispute. The GTEx analysis is
      corroborating context only and is cited on the constitutivity claim below,
      not relied on here.
    citations:
      - PMID:16618416
  - claim_id: nefa-uptake-dominant-human
    statement: >-
      Circulating NEFA uptake is the single largest source of hepatic
      triglyceride in human NAFLD (~59%).
    disposition: RETAINED
    report_quote: >-
      59.0% +/- 9.9% of TAG arose from NEFAs; 26.1% +/- 6.7%, from DNL; and
      14.9% +/- 7.0%, from the diet.
    rationale: >-
      Verified against the committed cache for PMID:15864352 (Donnelly 2005), a
      human stable-isotope flux study; the quoted partition is present. Supports
      dominance of the supply arm but, as the report itself states, measures flux
      not transporter rate-limitation, so it does not implicate any specific FATP.
    citations:
      - PMID:15864352
  - claim_id: fatp-no-human-genetics
    statement: >-
      No human genetic_association links SLC27A5 or SLC27A2 (or CD36) to any
      MASLD/steatosis/MASH term in Open Targets v4 as of 2026-10-07.
    disposition: QUALIFIED
    report_quote: >-
      the human genetic edge SLC27A5/SLC27A2 → MASLD is absent as of the search date
    rationale: >-
      Backed by a committed, inspectable Open Targets GraphQL artifact recording
      the per-term datatype breakdown; the negative is a genuine artifact-backed
      result, not literature paraphrase. Qualified rather than retained because
      the analysis commits its output but not its query code (not rerunnable
      end-to-end), and the negative is an aggregator snapshot as of the search
      date, not proof of no association.
    citations: []
    analysis_ids:
      - opentargets-genetic-association-absence
  - claim_id: fatp5-constitutive-cd36-induced
    statement: >-
      FATP5 is the constitutive liver-predominant LCFA transporter, while CD36 is
      low in healthy liver and becomes relevant only when disease-induced.
    disposition: QUALIFIED
    report_quote: >-
      FATP5 as the **constitutive dominant hepatic LCFA transporter** in health,
      whereas CD36 is low in healthy liver and becomes relevant only when
      *induced* by disease (consistent with F003)
    rationale: >-
      The liver-predominance of FATP5 (rank 1/54, 254 TPM) and low healthy-liver
      CD36 are directly read from the GTEx artifact. The "disease-induced" label
      for CD36 is an inference from low baseline TPM, corroborated by the human
      CD36 biopsy work (PMID:21270117, verified in cache) but not demonstrated by
      the bulk-tissue query itself. Retained with that scope caveat.
    citations:
      - PMID:21270117
    analysis_ids:
      - gtex-tissue-expression-ranking
  - claim_id: strong-form-druggable-fatp-target
    statement: >-
      FATP5/FATP2 are the rate-limiting, separately druggable setters of hepatic
      fatty-acid flux and blocking them reverses established human steatosis.
    disposition: REJECTED
    report_quote: >-
      is **not supported by human evidence and is confounded in the rodent
      evidence**.
    rationale: >-
      The strong therapeutic form of the seed. Rejected as stated for humans: all
      causal evidence is murine, and two confounds (FATP5 bile-acid-CoA ligase
      moonlighting, PMID:25061560 verified in cache; reduced caloric intake on
      knockdown, PMID:18524776) prevent clean attribution of protection to the
      hepatic-uptake step. The report reaches this rejection itself; recording it
      as REJECTED reflects the claim as originally seeded, not a defect in the report.
    citations:
      - PMID:25061560
      - PMID:18524776
      - PMID:40840619
  - claim_id: cd36-competing-human-arm
    statement: >-
      CD36 (not FATP5/FATP2), including an iPLA2b/CD36/caveolin-1/FABPpm complex,
      carries the strongest human transporter-uptake evidence and is a competing,
      druggable arm.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      points at **CD36**, a different protein than the one the seed hypothesis elevates
    rationale: >-
      A useful, well-argued competing model raised beyond the seed. The CD36
      membrane-relocation quote (PMID:21270117) verifies in cache; the O-GlcNAc
      (PMID:38642829) and iPLA2b-complex (PMID:24719358) claims were not verified
      against cached snippets in this assessment and should be before any
      promotion. Flagged as a lead, not an established edge.
    citations:
      - PMID:21270117
      - PMID:38642829
      - PMID:24719358
  - claim_id: no-fatp-directed-trial
    statement: >-
      No registered interventional trial of any FATP5/FATP2-directed agent exists
      in MASLD/NASH/NAFLD as of 2026-10-07.
    disposition: QUALIFIED
    report_quote: >-
      Zero registered trials of any FATP5/FATP2-directed agent in MASLD/NASH
    rationale: >-
      Artifact-backed by the committed ClinicalTrials.gov log. Qualified only by
      the log's own disclosed scope limit: ClinicalTrials.gov alone, non-US
      registries not queried, code-named compounds could be missed.
    citations: []
    analysis_ids:
      - clinicaltrials-absence-search
  - claim_id: human-genetics-absence-method
    statement: >-
      The human-genetics absence was established via Open Targets because a direct
      GWAS Catalog gene-scoped lookup could not be completed.
    disposition: QUALIFIED
    report_quote: >-
      no human `genetic_association` for SLC27A5/SLC27A2 to any MASLD term (Open Targets v4)
    rationale: >-
      The report's own GWAS Catalog log records a failed primary-source access
      (legacy endpoint 410, v2 404) and an explicit aggregator fallback to Open
      Targets, both committed. The genetic-absence negative is therefore
      aggregator-mediated and should be read as partial, exactly as labelled; a
      primary GWAS summary-statistics scan would be needed to harden it. Linked to
      both the PARTIAL Open Targets analysis that established the negative and
      the FAILED direct GWAS lookup it stood in for.
    citations: []
    analysis_ids:
      - opentargets-genetic-association-absence
      - gwas-catalog-direct-lookup

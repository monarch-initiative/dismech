assessor: codex
source_report: ../openscientist.md
hypothesis_id: autoimmune_model
assessed_at: "2026-07-31T04:24:31Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report identifies credible autoimmune biology and one direct passive-IgG
  experiment relevant to pain, but repeatedly broadens acute-COVID,
  severe-survivor, and association evidence into a general Long COVID causal
  model. Total IgG from a selected neurological Long COVID cohort produced
  transient sensory hypersensitivity in mice; it did not identify a pathogenic
  autoantibody specificity or explain the syndrome's other major phenotypes.
  Peripheral B-cell normalization does not show that autoantibodies or
  long-lived plasma cells have normalized. Autoimmunity remains a plausible
  mechanism in a subset, with causal scope, persistence, specificity, and
  therapeutic reversibility unresolved.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-convergence
    statement: >-
      Convergent evidence establishes de novo pathogenic autoantibody pathways
      as a general mechanism of Long COVID.
    disposition: QUALIFIED
    report_quote: >-
      Strong, convergent evidence establishes that SARS-CoV-2 infection
      triggers de novo autoantibody production through well-characterized
      immunological pathways
    rationale: >-
      SARS-CoV-2 can induce autoreactivity, but much of the cited mechanistic
      evidence concerns acute or severe COVID, reviews, or cross-sectional
      antibody associations. Those sources do not establish that newly induced
      antibodies persist and cause the heterogeneous Long COVID syndrome.
    citations:
      - PMID:37490975
      - PMID:41259457
      - PMID:38318183
  - claim_id: passive-igg-pathogenicity
    statement: >-
      Passive transfer directly demonstrates an IgG-dependent mechanism for a
      restricted pain and sensory phenotype.
    disposition: QUALIFIED
    report_quote: >-
      provides the first direct experimental evidence that IgG from Long COVID
      patients is pathogenic, inducing pain and sensory symptoms in mice.
    rationale: >-
      PMID:42053865 found transient mechanical allodynia and thermal
      hypersensitivity after transfer of total patient IgG, with loss of effect
      after IgG depletion or digestion. This supports IgG-dependent sensory
      pathogenicity in the sampled cohort, but it neither identifies a specific
      autoantibody nor generalizes to all Long COVID symptoms or patients.
    citations:
      - PMID:42053865
  - claim_id: cognitive-exclusion
    statement: >-
      Failure to reproduce cognitive and mood phenotypes in one passive-transfer
      experiment excludes autoantibodies from those Long COVID manifestations.
    disposition: REJECTED
    report_quote: >-
      excluding the most prevalent and debilitating Long COVID symptoms from
      the autoantibody hypothesis.
    rationale: >-
      A negative result in one cohort, mouse strain, transfer route, and endpoint
      panel cannot exclude other antibody specificities, intrathecal antibodies,
      or blood-brain-barrier-dependent effects. It narrows what this experiment
      demonstrated; it does not falsify every autoantibody explanation of
      cognitive symptoms.
    citations:
      - PMID:42053865
  - claim_id: b-cell-normalization
    statement: >-
      Normalization of peripheral B-cell subset proportions by 200 days shows
      that the cellular basis of persistent autoantibody production is
      transient.
    disposition: REJECTED
    report_quote: >-
      all changes in B cell subpopulation proportions normalized within 200
      dsso
    rationale: >-
      PMID:40915391 used persistent anosmia as its post-acute phenotype and
      measured circulating B-cell proportions, not broad Long COVID, antibody
      kinetics, bone-marrow plasma cells, or tissue B cells. Normal subset
      proportions do not demonstrate disappearance of autoreactive clones or
      antibodies.
    citations:
      - PMID:40915391
  - claim_id: meta-analysis-scope
    statement: >-
      A 68-study meta-analysis confirms broadly elevated GPCR and
      renin-angiotensin-system autoantibodies across COVID severity.
    disposition: QUALIFIED
    report_quote: >-
      Meta-analytic data from 68 studies confirm elevated GPCR and
      renin-angiotensin system autoantibodies across the COVID-19 severity
      spectrum
    rationale: >-
      PMID:37490975 reviewed 68 studies but meta-analyzed only nine. The pooled
      result supported higher ACE2 autoantibodies, whereas the angiotensin-II
      autoantibody result was null; other targets were heterogeneous and often
      descriptive. The review does not establish a broad pathogenic Long COVID
      signature.
    citations:
      - PMID:37490975
  - claim_id: anti-apoa1-longitudinal
    statement: >-
      Early anti-apolipoprotein A-1 antibodies predict later respiratory
      symptom persistence and provide limited mechanistic plausibility.
    disposition: QUALIFIED
    report_quote: >-
      independently predict respiratory symptom persistence at 12 months
    rationale: >-
      PMID:35598178 reported a longitudinal association and an in-vitro
      interferon-alpha effect. Anti-ApoA1 seropositivity also fell from 93% at
      one month to 15% at twelve months. Prediction plus an in-vitro response is
      useful evidence, but it does not show that the antibody caused persistent
      symptoms.
    citations:
      - PMID:35598178
  - claim_id: molecular-mimicry-long-covid
    statement: >-
      Anti-mGluR2 cross-reactivity provides direct molecular-mimicry evidence
      for Long COVID.
    disposition: REJECTED
    report_quote: >-
      Computational and experimental studies confirm molecular mimicry between
      viral proteins (spike, nucleocapsid) and human proteins as a mechanistic
      basis for cross-reactive autoantibody generation.
    rationale: >-
      The report's anti-mGluR2 example, PMID:40343769, studied hospitalized
      patients with severe acute neurological Omicron COVID, not Long COVID.
      Cross-reactivity in that setting establishes plausibility but cannot
      validate a persistent post-acute mechanism.
    citations:
      - PMID:40343769
  - claim_id: intervention-gap
    statement: >-
      No completed targeted trial yet shows that removing autoantibodies or
      depleting B cells improves Long COVID.
    disposition: RETAINED
    report_quote: >-
      The field lacks a completed interventional trial directly testing whether
      autoantibody removal or B-cell depletion improves Long COVID outcomes.
    rationale: >-
      This is the key causal and therapeutic gap. Association, prediction, and
      total-IgG transfer do not substitute for a biomarker-linked intervention
      showing that changing the proposed autoimmune driver changes symptoms.

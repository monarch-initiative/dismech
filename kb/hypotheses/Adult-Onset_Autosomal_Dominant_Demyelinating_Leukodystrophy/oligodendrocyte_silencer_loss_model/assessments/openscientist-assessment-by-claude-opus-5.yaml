analyses:
  - analysis_id: wt-rnaseq-lmnb1-by-cell-type
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Reported as: parse RSEM gene-level TPM from each openly mirrored 4DN
      cortical RNA-seq set, verify cell identity from marker genes, then compare
      LMNB1 across the five sorted cell types with a Kruskal-Wallis test and an
      oligodendrocyte-versus-pooled-others Mann-Whitney test.
    comparison: >-
      LMNB1 expression in sorted cortical oligodendrocytes versus excitatory
      neurons, interneurons, astrocytes and microglia, in wild-type donors.
    input_data_source_ids:
      - fourdn-rnaseq-cortical-neural
    status_reason: >-
      The report gives medians, test statistics and p-values, but the provider
      bundle contains only an HTML and a PDF rendering of the report itself: no
      code, no sample table, no results table, no environment specification and
      no manifest. Execution cannot be substantiated from the repository, so
      this is REPORTED_ONLY and UNVERIFIABLE rather than SUCCEEDED, whatever its
      prose says. An independent assessor re-analysis of the same public files
      reproduces the medians it reports for astrocytes, excitatory neurons and
      microglia exactly, and reproduces the overall conclusion; that replication
      is committed beside this assessment and is the basis for the scientific
      claims below.
    limitations: >-
      The reported sample count is 42 against 40 openly mirrored tables, so the
      two runs are not over an identical sample set and the oligodendrocyte
      medians are not directly comparable. The comparison is also pooled across
      donors, which the assessor replication shows masks a within-donor pattern.
  - analysis_id: wt-hichip-lmnb1-promoter-contacts
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Reported as: download openly mirrored mcool matrices, lift the hg19
      deletion intervals to GRCh38 via an LMNB1 anchor offset, extract the locus
      at 10 kb from raw unbalanced counts, and score LMNB1 promoter looping
      normalized to the CANX promoter, plus an insulation profile and an
      observed-over-expected contact with the deletion overlap.
    comparison: >-
      LMNB1 promoter contact and local insulation in sorted cortical
      oligodendrocytes versus microglia and astrocytes, in wild-type donors.
    input_data_source_ids:
      - fourdn-hichip-cortical-neural
    status_reason: >-
      As for the RNA-seq analysis, no code, matrix extract, coordinate record or
      environment specification was deposited, so execution is unverifiable. The
      liftover is additionally described as approximated from an anchor offset
      rather than performed, which the report acknowledges should be done
      formally before any production use; the assessor replication lifted both
      intervals through the Ensembl assembly-mapping service instead.
    limitations: >-
      The reported numbers are not internally consistent between iterations, so
      the normalization changed without being redefined; see the claim on
      iteration inconsistency. H3K4me3 HiChIP anchors contacts on active
      promoters and so cannot observe a repressive CTCF/PRC2 loop, a limitation
      the report states clearly and does not overclaim past.
claims:
  - claim_id: verdict-partially-supported
    statement: >-
      The oligodendrocyte silencer-loss mechanism is partially supported, with
      its cell-type-specificity claim unresolved in human tissue.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED (mechanism of LMNB1 derepression), with a key cell-type-specificity claim UNRESOLVED in human tissue."
    rationale: >-
      This matches the published evidence. The silencer's oligodendrocyte
      specificity rests on a mouse oligodendrocyte-lineage line and reporter
      assays in PMID:39910058, and that paper itself leaves open whether
      silencer loss alone is sufficient. The disease entry records the
      hypothesis at EMERGING on the same reading.
    citations:
      - PMID:39910058
  - claim_id: no-human-oligodendrocyte-measurement
    statement: >-
      Neither the silencer-promoter loop nor PRC2 occupancy has been shown in
      primary human oligodendrocytes.
    disposition: RETAINED
    report_quote: "No measurement in human oligodendrocytes.** Neither the silencer→promoter loop nor PRC2 occupancy has been demonstrated in primary human oligodendrocytes."
    rationale: >-
      Checked against the cited source. PMID:39910058's specificity experiments
      are in Oli-neu, N2A and 3T3 lines and in reporter constructs; no human
      oligodendrocyte contact or PRC2 measurement is reported. This is the gap
      the hypothesis block's notes field now records.
    citations:
      - PMID:39910058
  - claim_id: wild-type-data-cannot-settle-the-hypothesis
    statement: >-
      No wild-type-only dataset among those supplied can confirm or refute
      oligodendrocyte-specific silencing, because the hypothesis concerns the
      counterfactual effect of deleting the silencer rather than the normal
      baseline.
    disposition: RETAINED
    report_quote: "no wild-type-only dataset on this list can settle the core causal claim"
    rationale: >-
      The reasoning is sound and is the most useful output of the run. It is
      also the correct reading of its own two negative results: a silencer that
      tunes expression leaves the normal level normal, so the absence of
      baseline depletion is not evidence against the model. The report reached
      this after pre-registering the opposite prediction and then arguing
      against its own framing, which is the right move. The practical
      consequence - that the decisive experiment needs an ADLD allele in an
      oligodendrocyte-lineage cell and that no such public dataset exists - is
      recorded as a data absence rather than a curation gap.
  - claim_id: lmnb1-not-depleted-in-wild-type-oligodendrocytes
    statement: >-
      In sorted wild-type cortical cells, LMNB1 expression is not lower in
      oligodendrocytes than in other cortical cell types.
    disposition: RETAINED
    report_quote: "NOT depleted in oligodendrocytes.** Median *LMNB1* TPM = oligodendrocyte **3.95** (n=8, highest), interneuron 3.81 (9), excitatory 2.57 (8), astrocyte 1.72 (9), microglia 1.21 (8)."
    rationale: >-
      Independently reproduced. The assessor replication over the 40 openly
      mirrored tables gives medians of 1.72 for astrocytes, 2.57 for excitatory
      neurons and 1.21 for microglia, identical to the report, with 2.38 for
      oligodendrocytes over 7 sets rather than 3.95 over 8. The whole difference
      is the one oligodendrocyte set the report counts and this replication
      excludes, 4DNESYCPG6S5, which carries no openly mirrored table; the
      interneuron median differs for the same reason. The conclusion is
      unchanged under either count: Kruskal-Wallis p=0.087 and
      oligodendrocyte-versus-others p=0.972. No analysis is linked to this claim
      because the provider's execution is unauditable; the basis is the
      committed replication.
  - claim_id: lmnb1-promoter-actively-looped
    statement: >-
      The LMNB1 promoter carries active promoter-anchored contacts in wild-type
      cortical oligodendrocytes rather than appearing epigenetically silent.
    disposition: QUALIFIED
    report_quote: "the *LMNB1* promoter is **actively looped** in oligodendrocytes (CANX-normalized signal highest of oligo/microglia/astrocyte)."
    rationale: >-
      The direction replicates; the quantity does not transfer. Using an
      independently defined metric over all 37 sets, oligodendrocyte LMNB1
      promoter contacts are not lower than comparators (median ratio 1.06,
      range 0.78-1.31; oligodendrocyte versus others p=0.426), and within each
      donor contributing several cell types the oligodendrocyte ratio is 0.88 to
      1.29 of the others. So the report's qualitative reading stands. Its
      numeric values cannot be checked because it deposited neither code nor a
      definition of the normalization, and they are not reproducible from the
      description alone. A reproducible insulation minimum between 126.5 and
      126.7 Mb on GRCh38, inside both lifted deletion intervals, appears in 9 of
      9 oligodendrocyte and 5 of 5 astrocyte sets but only 1 of 8 excitatory
      neuron sets, which supports the report's claim that the structural
      substrate is measurable in this cell type.
  - claim_id: provider-analyses-are-not-auditable
    statement: >-
      The provider's two computational analyses cannot be audited from the
      deposited bundle.
    disposition: NEEDS_VERIFICATION
    report_quote: "EXECUTED multi-donor (Iteration 4):** extended to **8 oligodendrocyte donors** + 2 microglia + 2 astrocyte."
    rationale: >-
      The bundle contains an HTML and a PDF rendering of the report and nothing
      else: no analysis code, no sample or results table, no environment
      specification, no manifest and no coordinate record. The prose reports
      execution in detail, which is exactly the case the REPORTED_ONLY status
      exists for. Nothing here suggests the analyses were not run; the point is
      that the repository cannot establish that they were, or re-run them. This
      is why the scientific claims above rest on the assessor replication, and
      why no provider analysis is linked to a retained claim.
    analysis_ids:
      - wt-rnaseq-lmnb1-by-cell-type
      - wt-hichip-lmnb1-promoter-contacts
  - claim_id: hichip-numbers-inconsistent-between-iterations
    statement: >-
      The reported HiChIP promoter-looping values are mutually inconsistent
      across the report's own iterations.
    disposition: NEEDS_VERIFICATION
    report_quote: "normalized to the housekeeping CANX promoter = **oligodendrocyte 3.26, astrocyte 3.19, microglia 2.13**"
    rationale: >-
      These single-donor values are presented on the same stated metric as the
      later eight-donor summary, where the oligodendrocyte range is 3.80 to 5.54
      and the astrocyte value is 4.41. The single-donor oligodendrocyte and
      astrocyte figures fall outside those ranges, and the same donor appears in
      both passes, so the metric or its normalization changed between iterations
      without being redefined. With no code deposited there is no way to tell
      which pass to believe, which is a second reason the figures are not usable
      as curated quantities.
    analysis_ids:
      - wt-hichip-lmnb1-promoter-contacts
  - claim_id: open-mirror-count-overstated
    statement: >-
      All 42 cortical RNA-seq sets were openly mirrored and analysed.
    disposition: QUALIFIED
    report_quote: "all 42** openly-mirrored RNA-seq gene-expression TSVs (RSEM TPM, GRCh38/GENCODE) across sorted cortical cell types,"
    rationale: >-
      40 of the 42 released sets carry an open-data URL for their gene-expression
      table; 4DNESUZPOJXG and 4DNESYCPG6S5 do not, and the second of those is an
      oligodendrocyte set, so the discrepancy falls in the cell type under test.
      The difference is small and does not change the conclusion, but it is the
      kind of count that propagates into a methods sentence, and the report's
      own group sizes depend on it. Both exclusions are recorded in the
      committed replication's sample table.
  - claim_id: malformed-go-identifier
    statement: >-
      GO:0006classes is offered as a candidate ontology term for lipid
      biosynthetic process.
    disposition: REJECTED
    report_quote: "GO:0006classes lipid biosynthetic process"
    rationale: >-
      Not an identifier. It is a truncated numeric stem with the word "classes"
      spliced in, and nothing in the repository catches it: the report's own
      term-validation pass checked 6 terms and resolved all 6, because a string
      this malformed is never extracted as a CURIE in the first place. The
      intended term is most likely GO:0008610 lipid biosynthetic process, but
      that is a guess and was not bound anywhere. Treat every identifier in the
      report's candidate-terms list as unchecked: the one term in that list the
      validator did look at, GO:0140718, it flagged as named loosely
      ("repressive looping/heterochromatin") against its real label, facultative
      heterochromatin formation.
  - claim_id: maturity-stratification-not-tested
    statement: >-
      Wild-type cross-cell-type RNA-seq is intrinsically non-discriminating for
      the silencer model.
    disposition: QUALIFIED
    report_quote: "non-discriminating** for the silencer model because the model is about the *counterfactual* effect of deleting the silencer, not the WT baseline"
    rationale: >-
      Correct for the comparison the report ran, and the inference about the
      counterfactual is right. It is too strong as a statement about the data,
      because one stratification was not tried. In the assessor replication,
      splitting the oligodendrocyte samples on mature-myelin marker level
      reverses the within-donor direction: the three donors whose
      oligodendrocyte samples are myelin-high give LMNB1/CANX ratios of 0.31,
      0.31 and 0.64 against the same donors' other cortical cells, while the
      four myelin-low donors give 0.87 to 1.75. A silencer acting in mature
      oligodendrocytes predicts the first pattern. This is a lead and not a
      result: n=7 donors, and the split is perfectly confounded with donor
      cohort and sampled region, since all three myelin-high samples are from
      one cohort and all four myelin-low from another. A single-nucleus dataset
      resolving precursors and mature oligodendrocytes within the same donors
      would separate maturity from cohort; that is the test worth proposing, and
      it is not one the supplied datasets support.
  - claim_id: competing-boundary-model-surfaced
    statement: >-
      A competing boundary-loss and enhancer-adoption model exists for the same
      deletions, advanced by a different group, which also places astrocytes
      rather than oligodendrocytes as the pathological drivers.
    disposition: RETAINED
    report_quote: "Classic ADLD = intra-TAD duplication (dose gain); atypical = inter-TAD deletion/duplication → forebrain misexpression; one inter-TAD duplication crossing 2 boundaries did NOT cause ADLD; astrocytes key players"
    rationale: >-
      Verified against the source and the most directly useful discovery in the
      run. PMID:39078102 was not cited by this disease entry; its abstract
      states each of the four elements summarized here, and it carries patient
      chromosome-conformation capture, RNA-seq and postmortem histopathology
      across more than twenty families. Two of its sentences are now curated on
      the entry: the forebrain-misexpression result on the enhancer-adoption
      node, and the astrocyte result on the astrocyte node, which that node's
      description had flagged as needing patient-tissue corroboration. Its
      non-pathogenic boundary-crossing duplication is cited in the hypothesis
      block, because a boundary-crossing variant that causes no disease is what
      keeps the silencer model in contention against boundary loss alone.
    citations:
      - PMID:39078102
      - PMID:25701871

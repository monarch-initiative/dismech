      openscientist-replication-hichip-by-claude-opus-5.py and .csv. 4DN
      accessions are not a prefix `just verify-datasets` supports, so each set
      was confirmed by fetching its portal record directly. Relevance is partial
      by construction: the cell type is right and the assay anchors contacts on
      active promoters, which is the wrong anchor for a repressive CTCF/PRC2
      loop, as the report itself says. No set carries an ADLD allele.

    name: RNA-seq on human cortical neural cells (4D Nucleome)
    identifier: 4DNESYCPG6S5
    uri: https://data.4dnucleome.org/browse/?dataset_label=RNA-seq+on+human+cortical+neural+cells&experimentset_type=replicate&type=ExperimentSetReplicate
    access_status: UNVERIFIABLE
    cohort: >-
      42 released experiment sets of RSEM gene-level expression on the same

      40 sets carry an openly mirrored gene-expression table.
    organism: Homo sapiens
    tissue: cerebral cortex, sorted nuclei
    assay: RNA-seq, RSEM TPM on GRCh38/GENCODE
    notes: >-
      As above, the report claims it analysed these tables and the bundle holds

data_sources:
  - data_source_id: fourdn-hichip-cortical-neural
    source_type: PUBLIC_DATASET
    name: HiChIP on human cortical neural cells (4D Nucleome)
    identifier: 4DNESC4J62CH
    uri: https://data.4dnucleome.org/browse/?dataset_label=HiChIP+on+human+cortical+neural+cells&experimentset_type=replicate&type=ExperimentSetReplicate
    access_status: UNVERIFIABLE
    cohort: >-
      37 released experiment sets of H3K4me3 HiChIP on sorted postmortem adult
      human cortical nuclei: oligodendrocytes/OPC from 9 donors, excitatory
      neurons 8, interneurons 7, microglia 7, astrocytes 5. Several donors
      contribute more than one cell type.
    organism: Homo sapiens
    tissue: cerebral cortex, sorted nuclei
    assay: H3K4me3 HiChIP, processed to pairs/hic/mcool on GRCh38
    notes: >-
      The report states it downloaded and analysed twelve of these matrices, but
      the provider bundle contains only a rendered report, so access cannot be
      established from the repository and this is recorded as UNVERIFIABLE
      rather than ACCESSED. The assessor independently read the chr5 LMNB1
      locus from all 37 sets' mcool files over HTTP range requests; that

hypothesis_id: genotype_ultrastructure_severity
assessed_at: '2026-09-05T00:24:56Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Genotype-associated group differences and CCDC39/CCDC40 cellular mechanisms are partly supported,
  but fixed severity tiers, uniform absent clearance, exclusive severe-group decline and clinical
  mechanistic mediation are not established. The report misidentifies a functional comparison and
  misses existing cross-genotype omics. This assessment expands and reconciles the July review after
  reading the complete provider report, citation sidecar, existing assessment, and disease YAML,
  and independently retrieving the material primary literature and current diagnostic/care guidance.
  No provider computation or primary omics analysis was reproduced.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: genotype-severity-extremes
  statement: >-
    CCDC39/CCDC40 disease is relatively severe and RSPH1 disease relatively
    mild within the studied PCD populations.
  disposition: RETAINED
  report_quote: 'Verdict: PARTIALLY SUPPORTED'
  rationale: >-
    A prospective cohort and a large registry support worse lung-function and
    growth measures for CCDC39/CCDC40-associated disease, while a matched
    RSPH1 series supports a milder phenotype. These are relative group
    associations, not deterministic prognoses for individuals.
  citations:
  - PMID:30067075
  - PMID:38871375
  - PMID:24568568
- claim_id: ccdc-worst-prognosis
  statement: >-
    At least five independent cohorts firmly establish CCDC39/CCDC40 as the
    worst prognosis among all PCD genotypes.
  disposition: QUALIFIED
  report_quote: >-
    CCDC39/CCDC40 mutations (IDA/MTD ultrastructural class) confer the worst
    prognosis
  rationale: >-
    The severe association is credible, but the evidentiary count is
    inflated: one cited item is a narrative review and another is a situs
    ambiguus outcome study that adjusts for a predefined severe-genotype
    category. Available cohorts do not compare every genotype longitudinally
    or show that every CCDC39/CCDC40 patient has the worst course.
  citations:
  - PMID:30067075
  - PMID:38871375
  - PMID:38072392
  - PMID:40948093
- claim_id: three-tier-model
  statement: >-
    PCD severity is best represented by a validated three-tier classification
    of Severe, Standard, and Mild genotypes.
  disposition: QUALIFIED
  report_quote: rather than a continuous ultrastructure-to-severity gradient.
  rationale: >-
    The extremes are supported, but “most others” has not been established as
    a homogeneous standard tier, CCNO placement rests on limited and
    cross-sectional data, and the exact strata have not been prospectively
    validated. This is a useful testable proposal, not a curation-ready
    classification.
  citations:
  - PMID:30067075
  - PMID:38871375
  - PMID:26777464
- claim_id: rsph1-p-value
  statement: >-
    The RSPH1 lung-function comparison yielded FEV1 73.0 versus 61.8 percent
    predicted with P equal to 0.0.
  disposition: REJECTED
  report_quote: better lung function (FEV₁ 73.0 vs. 61.8 %predicted; P = 0.0)
  rationale: >-
    The source reports P=0.043 for the lung-function comparison. The effect
    estimate is correctly transcribed, but the P value is not.
  citations:
  - PMID:24568568
- claim_id: dnah5-dnah11-equivalence
  statement: >-
    A direct comparison refutes a DNAH5–DNAH11 severity difference and
    collapses the intermediate gradient.
  disposition: QUALIFIED
  report_quote: p = 0.829 for cross-sectional lung function
  rationale: >-
    A single-center study of 74 participants found no statistically
    significant lung-function or CT difference. A null, relatively small
    comparison does not establish equivalence, and the larger registry found
    milder cross-sectional lung function for DNAH11 relative to the overall
    PCD population. The middle remains unresolved rather than collapsed.
  citations:
  - PMID:38602513
  - PMID:38871375
- claim_id: universal-clearance-absence
  statement: Mucociliary clearance is absent in every PCD patient and genotype.
  disposition: REJECTED
  report_quote: mucociliary clearance is uniformly absent across genotypes
  rationale: >-
    PMID:38076675 states that clearance was consistently absent in most
    patients regardless of genotype and reports one participant with residual
    clearance. The study challenges a simple residual-clearance explanation
    but does not support “uniformly” or “every.”
  citations:
  - PMID:38076675
- claim_id: proteostasis-clinical-mediation
  statement: >-
    CCDC39/CCDC40-related proteostasis disruption explains the genotype's
    excess clinical severity.
  disposition: QUALIFIED
  report_quote: >-
    This motility-independent mechanism provides a compelling explanation for
    why IDA/MTD defects produce worse disease than other PCD subtypes with
    similarly impaired motility
  rationale: >-
    Patient-cell and model experiments robustly show loss of an axonemal
    protein network, proteostasis disruption, cell-fate changes, and rescue
    by normal CCDC39. They do not yet demonstrate that this pathway mediates
    between genotype and longitudinal clinical severity; the source itself
    presents that link as an explanation the findings may provide.
  citations:
  - PMID:39879322
- claim_id: nno-progression
  statement: >-
    Longitudinal nasal-NO decline proves a uniquely progressive clinical
    disease trajectory for IDA/MTD PCD.
  disposition: REJECTED
  report_quote: >-
    This progressive biomarker decline is unique to the IDA/MTD class and
    supports the hypothesis of a distinct, progressively worsening disease
    trajectory.
  rationale: >-
    The study measured nasal and exhaled NO, not lung-function decline or
    prognosis. Its authors state that lower nNO may be related to
    ultrastructural severity and that causality requires further study.
    Biomarker change cannot be substituted for demonstrated clinical
    progression.
  citations:
  - PMID:35777446
- claim_id: ccno-severe-tier
  statement: CCNO-associated PCD belongs in the same established severe tier as CCDC39/CCDC40.
  disposition: QUALIFIED
  report_quote: >-
    CCNO mutations, affecting cilia generation rather than structure,
    constitute an additional severe PCD subtype
  rationale: >-
    Small pooled case series describe rapid deterioration, and the large
    registry reports low cross-sectional FEV1 for CCNO. These findings support
    concern but do not yet validate equal tier membership or a common
    mechanism with CCDC39/CCDC40.
  citations:
  - PMID:26777464
  - PMID:31765523
  - PMID:38871375
- claim_id: variant-type-prognosis
  statement: >-
    Loss-of-function versus residual-function alleles generally refine
    severity prediction within PCD genes.
  disposition: QUALIFIED
  report_quote: >-
    Within individual genes, the type of variant (loss-of-function vs.
    residual function) adds an additional layer of severity stratification.
  rationale: >-
    The direct cited evidence is a DNAH5 association with neonatal
    respiratory distress. That endpoint supports a gene- and
    phenotype-specific modifier, not a general within-gene rule for
    longitudinal PCD severity.
  citations:
  - PMID:40344341
- claim_id: tas2r38-ceiling
  statement: >-
    Severe CCDC39/CCDC40 mutations overwhelm any beneficial TAS2R38 modifier
    through a ceiling effect.
  disposition: QUALIFIED
  report_quote: >-
    In severe genotypes like CCDC39/CCDC40, the ceiling effect of the primary
    mutation may overwhelm any modifier gene benefit.
  rationale: >-
    The modifier study supports possible TAS2R38 effects in a mild subgroup
    but does not directly test or demonstrate a ceiling effect in
    CCDC39/CCDC40. The proposed interaction is a hypothesis.
  citations:
  - PMID:39181709
- claim_id: ccdc40-mrna-clinical-validation
  statement: >-
    CCDC40 mRNA rescue validates CCDC40's causal role in clinical severity and
    establishes genotype-specific therapeutic prioritization.
  disposition: QUALIFIED
  report_quote: >-
    This therapeutic development both validates the causal role of CCDC40
    loss in disease severity and demonstrates the clinical prioritization of
    this severe genotype for genotype-specific therapy.
  rationale: >-
    Human-cell and zebrafish experiments support molecular and functional
    rescue. They do not establish clinical efficacy, validate the proposed
    severity strata, or show that prioritization is evidence of relative
    prognosis; the report notes only that a phase 1 study is planned.
  citations:
  - PMID:42089334
- claim_id: cell-ontology-mapping
  statement: CL:0000064 specifically denotes a multiciliated airway epithelial cell.
  disposition: REJECTED
  report_quote: Multiciliated airway epithelial cell (CL:0000064)
  rationale: >-
    CL:0000064 denotes the broader class “ciliated cell”; it does not encode
    the stated airway, epithelial, or multiciliated specificity. Depending on
    the intended anatomical scope, CL:4030034 (respiratory tract
    multiciliated cell) or CL:1000271 (lung multiciliated epithelial cell)
    provides a more specific replacement.
- claim_id: go-ontology-label
  statement: >-
    GO:0045197 is adequately labeled as establishment of epithelial-cell
    polarity.
  disposition: QUALIFIED
  report_quote: GO:0045197 (establishment of epithelial cell polarity)
  rationale: >-
    The exact label is “establishment or maintenance of epithelial cell
    apical/basal polarity.” The report's shortened wording omits both the
    maintenance alternative and the apical/basal specificity.
- claim_id: disease-ontology-proposal
  statement: >-
    OMIM records should be used as disease ontology sub-entries for the
    proposed genotype severity classes.
  disposition: REJECTED
  report_quote: >-
    OMIM:244400 (PCD); sub-entries for CCDC39 (#613807), CCDC40 (#613808),
    DNAH5 (#608644), DNAH11 (#611884), RSPH1, CCNO (#615872)
  rationale: >-
    This conflicts with the project's ontology policy: disease identity and
    mappings use MONDO, while OMIM identifiers are source records rather than
    newly invented subtype ontology nodes. A proposed severity tier also does
    not establish a new disease entity.
- claim_id: literature-count-provenance
  statement: The supplied artifacts substantiate review of 59 papers.
  disposition: NEEDS_VERIFICATION
  report_quote: 59 papers reviewed
  rationale: >-
    The citation manifest exposes 26 unique PMIDs and no search log or full
    screened corpus. The asserted total may reflect provider-internal work,
    but it cannot be reconstructed from the deposited artifacts.
- claim_id: clearance-study-genotypes
  statement: MCC impaired in both ODA and IDA
  report_quote: MCC impaired in both ODA and IDA
  disposition: REJECTED
  rationale: >-
    PMID:41561107 actually compares seven RSPH1 patients, eight DNAH5 patients and eight healthy
    controls. RSPH1 is a radial-spoke defect, not an IDA/MTD cohort. The report matrix mislabels
    the groups and should not use this study as an ODA-versus-IDA mechanistic comparison.
  citations:
  - PMID:41561107
- claim_id: cough-clearance-statistical-scope
  statement: cough clearance may differ between genotypes
  report_quote: cough clearance may differ between genotypes
  disposition: QUALIFIED
  rationale: >-
    Whole-lung cough clearance medians were 9.7% in RSPH1 versus 4.2% in DNAH5 (p=0.015), versus
    8.3% in controls (RSPH1 p=0.88). The small comparisons were unadjusted; removing one participant
    with extra coughs retained a RSPH1/DNAH5 difference. Baseline whole-lung MCC did not differ significantly
    between genotypes (p=0.27), and RSPH1 versus controls was p=0.054, so universal complete absence
    or equally proven deficits are too absolute. Clinical severity mediation was not tested; albuterol
    did not clearly restore MCC.
  citations:
  - PMID:41561107
- claim_id: longitudinal-cohort-denominator
  statement: Human clinical (longitudinal, n=118)
  report_quote: Human clinical (longitudinal, n=118)
  disposition: REJECTED
  rationale: >-
    PMID:30067075 enrolled 137 participants with 732 visits over five years. CCDC39/40 n=34 and DNAH5
    n=36 comparisons are correctly quoted, but the report total of 118 is not the primary cohort
    denominator. Multiple visits are not independent people.
  citations:
  - PMID:30067075
- claim_id: within-group-slope-inference
  statement: IDA/MTD only group with significant longitudinal decline
  report_quote: IDA/MTD only group with significant longitudinal decline
  disposition: QUALIFIED
  rationale: >-
    The average entire-cohort decline was 0.57±0.25 percentage points per year; the IDA/MTD/CA slope
    was the only subgroup slope significantly below zero in this study. A significant within-group
    slope versus a nonsignificant slope elsewhere is not itself a significant difference between
    slopes. Small group sizes and heterogeneous trajectories preclude asserting all other genotypes
    have stable disease.
  citations:
  - PMID:30067075
- claim_id: registry-cross-sectional-prognosis
  statement: genetic variant predicts the course of lung function
  report_quote: genetic variant predicts the course of lung function
  disposition: QUALIFIED
  rationale: >-
    PMID:38871375 is a cross-sectional registry analysis of 1236 genetically confirmed individuals,
    908 pathogenic variants and 46 genes from 19 countries. It supports lower FEV1 z-scores in CCNO/CCDC39/CCDC40
    and milder group values in DNAH11/ODAD1, but is not prospective validation of individual decline
    or three discrete tiers. Geography, founder alleles, age and diagnostic selection affect generalizability.
  citations:
  - PMID:38871375
- claim_id: omics-gap-contradicted
  statement: No Omics Comparisons Across PCD Genotypes
  report_quote: No Omics Comparisons Across PCD Genotypes
  disposition: REJECTED
  rationale: >-
    Published 2024 PMID:39558053 directly compares mouse tracheal scRNA-seq responses across Cfap221,
    Cfap54 and Spef2 mutants, with shared and genotype-specific DEGs (GSE254100). PMID:39042459 supplies
    DNAH5 patient/mother/control and iPSC omics (GSE272189), while PMID:39879322 supplies CCDC39/40
    network proteomics. Robust multi-genotype human clinical-outcome-linked omics remain limited,
    but the blanket no-RNA-seq/proteomics comparison claim is false.
  citations:
  - PMID:39558053
  - PMID:39042459
  - PMID:39879322
- claim_id: proteostasis-publication-independence
  statement: at least five independent cohorts
  report_quote: at least five independent cohorts
  disposition: QUALIFIED
  rationale: >-
    The CCDC39/40 work combines patient-derived material, Chlamydomonas structural/proteomic analysis
    and transgene rescue; calling all evidence only in vitro loses that model diversity. Nevertheless,
    it does not quantify human clinical mediation. PMID:38562900 is the preprint version of PMID:39879322,
    and PMID:40948093 is a review of existing evidence, not independent patient replication. Cohort
    overlap and publication versions must be checked before counting independent support.
  citations:
  - PMID:39879322
  - PMID:38562900
  - PMID:40948093
  - PMID:30067075
- claim_id: ccno-pool-and-mcidas
  statement: CCNO Mutations Represent an Additional Severe Subtype
  report_quote: CCNO Mutations Represent an Additional Severe Subtype
  disposition: QUALIFIED
  rationale: >-
    The original 15 CCNO individuals came from 10/170 Israeli mucociliary-disorder families. Hydrocephalus
    10% and female infertility 22% were calculated after pooling these with prior CCNO reports, not
    within the 15-person series alone. CCNO registry FEV1 supports severe group burden, but universal
    CCNO/MCIDAS tier placement is not prospectively validated; the mechanisms and residual-cilium
    phenotypes differ.
  citations:
  - PMID:26777464
  - PMID:38871375
  - PMID:24747639
  - PMID:25048963
- claim_id: neonatal-variant-endpoint
  statement: Variant Type Adds Sub-Genotype Severity Refinement
  report_quote: Variant Type Adds Sub-Genotype Severity Refinement
  disposition: QUALIFIED
  rationale: >-
    PMID:40344341 supports neonatal respiratory distress associations: DNAH11 OR0.35 versus ODA,
    and DNAH5 two loss-of-function variants OR3.06 versus genotypes allowing possible residual function.
    These are term-neonatal respiratory endpoints in 455 participants, not long-term FEV1 effects
    or direct molecular quantification of residual protein. The model preserves the endpoint distinction.
  citations:
  - PMID:40344341
- claim_id: ent-intervention-endpoint
  statement: IDA/MTD Severity Extends to Earlier ENT Interventions
  report_quote: IDA/MTD Severity Extends to Earlier ENT Interventions
  disposition: QUALIFIED
  rationale: >-
    PMID:39989621 relates ultrastructure to earlier pressure-equalization tube placement in longitudinal
    ENT care. Intervention timing is influenced by clinician practice, local guidelines, hearing
    surveillance and patient selection; it is not a direct assay of ciliary biology or necessarily
    a validated proxy for pulmonary severity.
  citations:
  - PMID:39989621
- claim_id: gene-validity-severity-category
  statement: GenCC/ClinGen Source-Level Absence
  report_quote: GenCC/ClinGen Source-Level Absence
  disposition: QUALIFIED
  rationale: >-
    The absence of a severe/standard/mild label in gene-validity resources is not evidence against
    a clinical association. Those frameworks grade whether a gene causes a disease, not outcome strata.
    Limited gene validity also cannot be upgraded merely because a functional C1d study includes
    the gene. Quantitative prognosis requires independent outcome data and validated prediction.
  citations:
  - PMID:41005984
  - PMID:38871375
  - PMID:39362668
- claim_id: ccdc40-restoration-outcomes
  statement: mRNA Therapy Validates CCDC40 as a Therapeutic Target
  report_quote: mRNA Therapy Validates CCDC40 as a Therapeutic Target
  disposition: QUALIFIED
  rationale: >-
    PMID:42089334 treated ALI cultures from five CCDC40-deficient people, with expression in 10–74%
    of ciliated cells, restoration of associated proteins, improved beating and particle transport.
    Zebrafish olfactory-pit motion/flow also improved. These are meaningful proximal and transport
    endpoints, but there is no human trial outcome or proof that the proposed severe tier predicts
    clinical treatment benefit.
  citations:
  - PMID:42089334
- claim_id: future-tests-scope
  statement: Post-Hoc Genotype Stratification of CLEAN-PCD Trial
  report_quote: Post-Hoc Genotype Stratification of CLEAN-PCD Trial
  disposition: RETAINED
  rationale: >-
    Exploratory genotype reanalysis can generate hypotheses but the 123-person short crossover trial
    was not powered to establish all genotype-treatment interactions, and separate within-group p-values
    would not establish heterogeneity. Any new analysis needs prespecified contrasts, small-cell
    handling, multiplicity correction and confirmation. The provider did not access participant-level
    data or execute the proposal.
  citations:
  - PMID:37660715

schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: genotype_ultrastructure_severity
assessed_at: "2026-07-31T04:48:04Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Genotype modifies PCD phenotype, and the relatively severe CCDC39/CCDC40
  extreme and relatively mild RSPH1 extreme are supported. The report's
  discrete Severe/Standard/Mild model is nevertheless a provider-generated
  synthesis, not a validated classification: its middle is poorly resolved,
  CCNO tiering relies on limited and cross-sectional evidence, and no
  prospective study or intervention has tested the strata. The report also
  turns null results into equivalence, nasal-NO change into clinical
  progression, and cell rescue into validation of clinical severity. Its
  universal-clearance claim and RSPH1 P value are factually wrong, proposed
  modifier and proteostasis explanations need narrower causal language, and
  ontology/provenance suggestions require correction.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: genotype-severity-extremes
    statement: >-
      CCDC39/CCDC40 disease is relatively severe and RSPH1 disease relatively
      mild within the studied PCD populations.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED"
    rationale: >-
      A prospective cohort and a large registry support worse lung-function and
      growth measures for CCDC39/CCDC40-associated disease, while a matched
      RSPH1 series supports a milder phenotype. These are relative group
      associations, not deterministic prognoses for individuals.
    citations:
      - PMID:30067075
      - PMID:38871375
      - PMID:24568568
  - claim_id: ccdc-worst-prognosis
    statement: >-
      At least five independent cohorts firmly establish CCDC39/CCDC40 as the
      worst prognosis among all PCD genotypes.
    disposition: QUALIFIED
    report_quote: >-
      CCDC39/CCDC40 mutations (IDA/MTD ultrastructural class) confer the worst
      prognosis
    rationale: >-
      The severe association is credible, but the evidentiary count is
      inflated: one cited item is a narrative review and another is a situs
      ambiguus outcome study that adjusts for a predefined severe-genotype
      category. Available cohorts do not compare every genotype longitudinally
      or show that every CCDC39/CCDC40 patient has the worst course.
    citations:
      - PMID:30067075
      - PMID:38871375
      - PMID:38072392
      - PMID:40948093
  - claim_id: three-tier-model
    statement: >-
      PCD severity is best represented by a validated three-tier classification
      of Severe, Standard, and Mild genotypes.
    disposition: QUALIFIED
    report_quote: rather than a continuous ultrastructure-to-severity gradient.
    rationale: >-
      The extremes are supported, but “most others” has not been established as
      a homogeneous standard tier, CCNO placement rests on limited and
      cross-sectional data, and the exact strata have not been prospectively
      validated. This is a useful testable proposal, not a curation-ready
      classification.
    citations:
      - PMID:30067075
      - PMID:38871375
      - PMID:26777464
  - claim_id: rsph1-p-value
    statement: >-
      The RSPH1 lung-function comparison yielded FEV1 73.0 versus 61.8 percent
      predicted with P equal to 0.0.
    disposition: REJECTED
    report_quote: "better lung function (FEV₁ 73.0 vs. 61.8 %predicted; P = 0.0)"
    rationale: >-
      The source reports P=0.043 for the lung-function comparison. The effect
      estimate is correctly transcribed, but the P value is not.
    citations:
      - PMID:24568568
  - claim_id: dnah5-dnah11-equivalence
    statement: >-
      A direct comparison refutes a DNAH5–DNAH11 severity difference and
      collapses the intermediate gradient.
    disposition: QUALIFIED
    report_quote: p = 0.829 for cross-sectional lung function
    rationale: >-
      A single-center study of 74 participants found no statistically
      significant lung-function or CT difference. A null, relatively small
      comparison does not establish equivalence, and the larger registry found
      milder cross-sectional lung function for DNAH11 relative to the overall
      PCD population. The middle remains unresolved rather than collapsed.
    citations:
      - PMID:38602513
      - PMID:38871375
  - claim_id: universal-clearance-absence
    statement: Mucociliary clearance is absent in every PCD patient and genotype.
    disposition: REJECTED
    report_quote: mucociliary clearance is uniformly absent across genotypes
    rationale: >-
      PMID:38076675 states that clearance was consistently absent in most
      patients regardless of genotype and reports one participant with residual
      clearance. The study challenges a simple residual-clearance explanation
      but does not support “uniformly” or “every.”
    citations:
      - PMID:38076675
  - claim_id: proteostasis-clinical-mediation
    statement: >-
      CCDC39/CCDC40-related proteostasis disruption explains the genotype's
      excess clinical severity.
    disposition: QUALIFIED
    report_quote: >-
      This motility-independent mechanism provides a compelling explanation for
      why IDA/MTD defects produce worse disease than other PCD subtypes with
      similarly impaired motility
    rationale: >-
      Patient-cell and model experiments robustly show loss of an axonemal
      protein network, proteostasis disruption, cell-fate changes, and rescue
      by normal CCDC39. They do not yet demonstrate that this pathway mediates
      between genotype and longitudinal clinical severity; the source itself
      presents that link as an explanation the findings may provide.
    citations:
      - PMID:39879322
  - claim_id: nno-progression
    statement: >-
      Longitudinal nasal-NO decline proves a uniquely progressive clinical
      disease trajectory for IDA/MTD PCD.
    disposition: REJECTED
    report_quote: >-
      This progressive biomarker decline is unique to the IDA/MTD class and
      supports the hypothesis of a distinct, progressively worsening disease
      trajectory.
    rationale: >-
      The study measured nasal and exhaled NO, not lung-function decline or
      prognosis. Its authors state that lower nNO may be related to
      ultrastructural severity and that causality requires further study.
      Biomarker change cannot be substituted for demonstrated clinical
      progression.
    citations:
      - PMID:35777446
  - claim_id: ccno-severe-tier
    statement: CCNO-associated PCD belongs in the same established severe tier as CCDC39/CCDC40.
    disposition: QUALIFIED
    report_quote: >-
      CCNO mutations, affecting cilia generation rather than structure,
      constitute an additional severe PCD subtype
    rationale: >-
      Small pooled case series describe rapid deterioration, and the large
      registry reports low cross-sectional FEV1 for CCNO. These findings support
      concern but do not yet validate equal tier membership or a common
      mechanism with CCDC39/CCDC40.
    citations:
      - PMID:26777464
      - PMID:31765523
      - PMID:38871375
  - claim_id: variant-type-prognosis
    statement: >-
      Loss-of-function versus residual-function alleles generally refine
      severity prediction within PCD genes.
    disposition: QUALIFIED
    report_quote: >-
      Within individual genes, the type of variant (loss-of-function vs.
      residual function) adds an additional layer of severity stratification.
    rationale: >-
      The direct cited evidence is a DNAH5 association with neonatal
      respiratory distress. That endpoint supports a gene- and
      phenotype-specific modifier, not a general within-gene rule for
      longitudinal PCD severity.
    citations:
      - PMID:40344341
  - claim_id: tas2r38-ceiling
    statement: >-
      Severe CCDC39/CCDC40 mutations overwhelm any beneficial TAS2R38 modifier
      through a ceiling effect.
    disposition: QUALIFIED
    report_quote: >-
      In severe genotypes like CCDC39/CCDC40, the ceiling effect of the primary
      mutation may overwhelm any modifier gene benefit.
    rationale: >-
      The modifier study supports possible TAS2R38 effects in a mild subgroup
      but does not directly test or demonstrate a ceiling effect in
      CCDC39/CCDC40. The proposed interaction is a hypothesis.
    citations:
      - PMID:39181709
  - claim_id: ccdc40-mrna-clinical-validation
    statement: >-
      CCDC40 mRNA rescue validates CCDC40's causal role in clinical severity and
      establishes genotype-specific therapeutic prioritization.
    disposition: QUALIFIED
    report_quote: >-
      This therapeutic development both validates the causal role of CCDC40
      loss in disease severity and demonstrates the clinical prioritization of
      this severe genotype for genotype-specific therapy.
    rationale: >-
      Human-cell and zebrafish experiments support molecular and functional
      rescue. They do not establish clinical efficacy, validate the proposed
      severity strata, or show that prioritization is evidence of relative
      prognosis; the report notes only that a phase 1 study is planned.
    citations:
      - PMID:42089334
  - claim_id: cell-ontology-mapping
    statement: CL:0000064 specifically denotes a multiciliated airway epithelial cell.
    disposition: REJECTED
    report_quote: "Multiciliated airway epithelial cell (CL:0000064)"
    rationale: >-
      CL:0000064 denotes the broader class “ciliated cell”; it does not encode
      the stated airway, epithelial, or multiciliated specificity.
  - claim_id: disease-ontology-proposal
    statement: >-
      OMIM records should be used as disease ontology sub-entries for the
      proposed genotype severity classes.
    disposition: REJECTED
    report_quote: >-
      OMIM:244400 (PCD); sub-entries for CCDC39 (#613807), CCDC40 (#613808),
      DNAH5 (#608644), DNAH11 (#611884), RSPH1, CCNO (#615872)
    rationale: >-
      This conflicts with the project's ontology policy: disease identity and
      mappings use MONDO, while OMIM identifiers are source records rather than
      newly invented subtype ontology nodes. A proposed severity tier also does
      not establish a new disease entity.
  - claim_id: literature-count-provenance
    statement: The supplied artifacts substantiate review of 59 papers.
    disposition: NEEDS_VERIFICATION
    report_quote: 59 papers reviewed
    rationale: >-
      The citation manifest exposes 26 unique PMIDs and no search log or full
      screened corpus. The asserted total may reflect provider-internal work,
      but it cannot be reconstructed from the deposited artifacts.

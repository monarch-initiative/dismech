schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_motile_cilia_beat_failure
assessed_at: "2026-07-31T04:48:04Z"
overall_verdict: SUPPORTED
summary: >-
  The canonical mechanism—motile-cilia dysfunction causing ineffective
  mucociliary clearance and chronic airway disease—is well supported. The
  report also usefully identifies reduced multiciliogenesis as a distinct
  upstream route to the same clearance phenotype. Several extensions are
  materially overstated, however: clearance was absent in most rather than all
  measured patients, the mRNA and azithromycin studies do not validate the
  entire causal chain, and the proposed NOS, macrophage, and
  inflammation-independent branches remain model- or association-level leads.
  One RSPH1 P value and several ontology labels are incorrect, and the claimed
  135-paper review cannot be reconstructed from the supplied citation manifest.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-core
    statement: >-
      Motile-cilia dysfunction causing ineffective mucociliary clearance is a
      well-supported central mechanism of respiratory disease in PCD.
    disposition: RETAINED
    report_quote: >-
      Verdict: STRONGLY SUPPORTED — with nine critical qualifications that
      reveal the canonical model is correct but mechanistically incomplete.
    rationale: >-
      Human genetic, structural, functional-clearance, and clinical evidence
      converge on this core mechanism. The verdict applies to the scoped core,
      not to every additional branch assembled in the report.
    citations:
      - PMID:38076675
      - PMID:31772028
      - PMID:42026914
  - claim_id: reduced-multiciliogenesis-route
    statement: >-
      CCNO- and MCIDAS-related reduced multiciliogenesis is a distinct upstream
      mechanism that converges on mucociliary-clearance failure.
    disposition: RETAINED
    report_quote: >-
      This pathway converges on MCC failure — the downstream phenotype is the
      same — but the upstream mechanism (ciliogenesis failure vs. axonemal
      dysfunction) is distinct
    rationale: >-
      Patient-cell studies show a marked reduction in cilia number despite
      relatively normal structure and motility of the residual cilia. This is
      a useful mechanistic distinction from axonemal beat defects.
    citations:
      - PMID:24747639
      - PMID:25048963
  - claim_id: universal-clearance-absence
    statement: Mucociliary clearance is absent in every PCD genotype and patient.
    disposition: REJECTED
    report_quote: Direct functional measurements show MCC is universally absent across 26 genotypes
    rationale: >-
      PMID:38076675 reports that clearance was consistently absent in most
      patients, not universally absent. One CCDC103 participant retained
      measurable clearance. The defensible conclusion is that severe clearance
      impairment spans many genotypes.
    citations:
      - PMID:38076675
  - claim_id: mrna-causal-chain
    statement: >-
      DNAI1 mRNA rescue directly proves the complete
      gene-structure-function-clearance disease chain.
    disposition: QUALIFIED
    report_quote: >-
      This therapeutic rescue experiment constitutes the most direct causal
      evidence: restoring the missing axonemal protein restores ciliary
      function, confirming the gene-structure-function chain.
    rationale: >-
      The mouse airway-culture experiment restored DNAI1 incorporation and
      ciliary beat frequency. It did not measure mucociliary clearance,
      infection, inflammation, lung disease, or a human clinical outcome, so it
      validates an important proximal link rather than the full disease chain.
    citations:
      - PMID:40963409
  - claim_id: azithromycin-mechanistic-validation
    statement: >-
      Azithromycin efficacy validates the infection-to-inflammation causal arm
      of the PCD mechanism.
    disposition: QUALIFIED
    report_quote: validating the infection-inflammation arm therapeutically.
    rationale: >-
      BESTCILIA established fewer respiratory exacerbations during azithromycin
      treatment. It did not distinguish antimicrobial from immunomodulatory
      effects and therefore does not, by itself, validate the proposed causal
      route.
    citations:
      - PMID:32380069
  - claim_id: intrinsic-nos-vulnerability
    statement: >-
      PCD includes a mutation-intrinsic, pan-epithelial NOS defect that acts
      independently of impaired clearance.
    disposition: QUALIFIED
    report_quote: >-
      This suggests an intrinsic NOS pathway defect in PCD that may represent a
      parallel immune vulnerability independent of — and additional to — the
      clearance defect.
    rationale: >-
      Small human studies support low bronchial/alveolar NO and deficient NOS2
      induction in cultured PCD cells. They do not establish a shared molecular
      consequence of diverse PCD mutations or demonstrate that the signal is
      causally independent of chronic airway disease.
    citations:
      - PMID:23290188
      - PMID:24189859
  - claim_id: inflammation-independent-remodeling
    statement: >-
      Motile-cilia loss directly causes airway remodeling independently of
      inflammation and mucus-clearance failure in PCD.
    disposition: QUALIFIED
    report_quote: >-
      This demonstrates a cilia-dependent airway remodeling pathway that is
      independent of the canonical clearance-infection-inflammation cascade
    rationale: >-
      Conditional IFT88 deletion produced remodeling without apparent
      inflammation or clearance defects in mice. IFT88 also affects nonmotile
      cilia and epithelial differentiation, and this model is not equivalent
      to a human axonemal PCD genotype. It is a mechanistic lead, not a
      demonstrated human PCD branch.
    citations:
      - PMID:24213915
  - claim_id: macrophage-endotype
    statement: PCD has a distinct M2-macrophage inflammatory endotype.
    disposition: QUALIFIED
    report_quote: >-
      a PCD-specific inflammatory endotype with M2-macrophage polarization
      rather than pure neutrophilic inflammation
    rationale: >-
      Sputum from 27 people with PCD induced an M2-like phenotype in healthy
      monocyte-derived macrophages ex vivo. This does not establish a stable
      in-vivo endotype or displace the well-described neutrophil-dominant
      airway phenotype.
    citations:
      - PMID:41582098
  - claim_id: perinatal-fluid-clearance
    statement: >-
      The Spag17 mouse study directly establishes failed perinatal lung-fluid
      clearance as the mechanism of neonatal respiratory distress in human PCD.
    disposition: QUALIFIED
    report_quote: >-
      This supports the canonical model's earliest manifestation — failure of
      perinatal lung fluid clearance
    rationale: >-
      Spag17-null mice develop neonatal lung-fluid accumulation, while neonatal
      respiratory distress is common in human PCD. The cross-species
      combination supports plausibility but does not directly establish the
      proposed mechanism in human infants.
    citations:
      - PMID:23418344
      - PMID:35011687
  - claim_id: rsph1-p-value
    statement: >-
      The RSPH1 lung-function comparison yielded FEV1 73.0 versus 61.8 percent
      predicted with P equal to 0.0.
    disposition: REJECTED
    report_quote: >-
      better preserved lung function (FEV1 73.0 vs. 61.8% predicted, P=0.0)
    rationale: >-
      The source reports P=0.043 for this comparison. The effect estimate is
      correctly transcribed, but the reported P value is not.
    citations:
      - PMID:24568568
  - claim_id: ontology-labels
    statement: >-
      The proposed CL identifiers correctly denote a multiciliated cell, club
      cell, M2 macrophage, and ependymal cell.
    disposition: REJECTED
    report_quote: >-
      Multiciliated cell (CL:0000710), Club cell (CL:0000158), M2 macrophage
      (CL:0000235), Ependymal cell (CL:0000065)
    rationale: >-
      CL:0000710 denotes neurecto-epithelial cell, not multiciliated cell, and
      CL:0000235 denotes macrophage without an M2 subtype. CL:0000158 and
      CL:0000065 are correctly labeled. CL:0005012 (multiciliated epithelial
      cell) is a suitable replacement for the report's intended generic
      multiciliated-cell concept. These ontology suggestions must not be copied
      into curated data as written.
  - claim_id: go-ontology-mapping
    statement: GO:0060271 denotes multiciliated-cell differentiation.
    disposition: REJECTED
    report_quote: "Multiciliated cell differentiation (GO:0060271)"
    rationale: >-
      GO:0060271 denotes cilium assembly, not multiciliated-cell
      differentiation. This candidate ontology mapping must not be copied into
      curated data as written.
  - claim_id: literature-count-provenance
    statement: The supplied artifacts substantiate review of 135 papers.
    disposition: NEEDS_VERIFICATION
    report_quote: 5 iterations, 135 papers, 16 confirmed findings, 52 evidence items
    rationale: >-
      The citation manifest exposes 50 unique PMIDs and no search log or
      complete screened corpus. The larger count may be valid, but it cannot be
      reconstructed from the deposited artifacts and should not be used as an
      evidence-quality metric.

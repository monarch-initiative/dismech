hypothesis_id: canonical_motile_cilia_beat_failure
assessed_at: '2026-09-05T00:46:23Z'
overall_verdict: SUPPORTED
summary: >-
  The canonical transport-failure mechanism is supported, with distinct upstream motor, multiciliogenesis
  and central-apparatus transport routes. Several report extensions remain unproven, and its absence
  claims, universal formulations and clinical-mechanistic inferences need correction. This assessment
  expands and reconciles the July review after reading the complete provider report, citation sidecar,
  existing assessment, and disease YAML, and independently retrieving the material primary literature
  and current diagnostic/care guidance. No provider computation or primary omics analysis was reproduced.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: canonical-core
  statement: >-
    Motile-cilia dysfunction causing ineffective mucociliary clearance is a
    well-supported central mechanism of respiratory disease in PCD.
  disposition: RETAINED
  report_quote: >-
    Verdict: STRONGLY SUPPORTED — with nine critical qualifications that
    reveal the canonical model is correct but mechanistically incomplete.
  rationale: >-
    Human genetic, structural, functional-clearance, and clinical evidence
    converge on this core mechanism. The verdict applies to the scoped core,
    not to every additional branch assembled in the report.
  citations:
  - PMID:38076675
  - PMID:31772028
  - PMID:42026914
- claim_id: reduced-multiciliogenesis-route
  statement: >-
    CCNO- and MCIDAS-related reduced multiciliogenesis is a distinct upstream
    mechanism that converges on mucociliary-clearance failure.
  disposition: RETAINED
  report_quote: >-
    This pathway converges on MCC failure — the downstream phenotype is the
    same — but the upstream mechanism (ciliogenesis failure vs. axonemal
    dysfunction) is distinct
  rationale: >-
    Both genes reduce cilia generation and converge on clearance failure. Residual cilia in CCNO
    can retain normal motor proteins and motility; the MCIDAS primary report explicitly identifies
    absent DNAH5/CCDC39 in residual cilia. This corrects the July assessment that inadvertently generalized
    CCNO residual normality to both genes.
  citations:
  - PMID:24747639
  - PMID:25048963
- claim_id: universal-clearance-absence
  statement: Mucociliary clearance is absent in every PCD genotype and patient.
  disposition: REJECTED
  report_quote: Direct functional measurements show MCC is universally absent across 26
    genotypes
  rationale: >-
    PMID:38076675 reports that clearance was consistently absent in most
    patients, not universally absent. One CCDC103 participant retained
    measurable clearance. The defensible conclusion is that severe clearance
    impairment spans many genotypes.
  citations:
  - PMID:38076675
- claim_id: mrna-causal-chain
  statement: >-
    DNAI1 mRNA rescue directly proves the complete
    gene-structure-function-clearance disease chain.
  disposition: QUALIFIED
  report_quote: >-
    This therapeutic rescue experiment constitutes the most direct causal
    evidence: restoring the missing axonemal protein restores ciliary
    function, confirming the gene-structure-function chain.
  rationale: >-
    The mouse airway-culture experiment restored DNAI1 incorporation and
    ciliary beat frequency. It did not measure mucociliary clearance,
    infection, inflammation, lung disease, or a human clinical outcome, so it
    validates an important proximal link rather than the full disease chain.
  citations:
  - PMID:40963409
- claim_id: azithromycin-mechanistic-validation
  statement: >-
    Azithromycin efficacy validates the infection-to-inflammation causal arm
    of the PCD mechanism.
  disposition: QUALIFIED
  report_quote: validating the infection-inflammation arm therapeutically.
  rationale: >-
    BESTCILIA established fewer respiratory exacerbations during azithromycin
    treatment. It did not distinguish antimicrobial from immunomodulatory
    effects and therefore does not, by itself, validate the proposed causal
    route.
  citations:
  - PMID:32380069
- claim_id: intrinsic-nos-vulnerability
  statement: >-
    PCD includes a mutation-intrinsic, pan-epithelial NOS defect that acts
    independently of impaired clearance.
  disposition: QUALIFIED
  report_quote: >-
    This suggests an intrinsic NOS pathway defect in PCD that may represent a
    parallel immune vulnerability independent of — and additional to — the
    clearance defect.
  rationale: >-
    Small human studies support low bronchial/alveolar NO and deficient NOS2
    induction in cultured PCD cells. They do not establish a shared molecular
    consequence of diverse PCD mutations or demonstrate that the signal is
    causally independent of chronic airway disease.
  citations:
  - PMID:23290188
  - PMID:24189859
- claim_id: inflammation-independent-remodeling
  statement: >-
    Motile-cilia loss directly causes airway remodeling independently of
    inflammation and mucus-clearance failure in PCD.
  disposition: QUALIFIED
  report_quote: >-
    This demonstrates a cilia-dependent airway remodeling pathway that is
    independent of the canonical clearance-infection-inflammation cascade
  rationale: >-
    Conditional IFT88 deletion produced remodeling without apparent
    inflammation or clearance defects in mice. IFT88 also affects nonmotile
    cilia and epithelial differentiation, and this model is not equivalent
    to a human axonemal PCD genotype. It is a mechanistic lead, not a
    demonstrated human PCD branch.
  citations:
  - PMID:24213915
- claim_id: macrophage-endotype
  statement: PCD has a distinct M2-macrophage inflammatory endotype.
  disposition: QUALIFIED
  report_quote: >-
    a PCD-specific inflammatory endotype with M2-macrophage polarization
    rather than pure neutrophilic inflammation
  rationale: >-
    Sputum from 27 people with PCD induced an M2-like phenotype in healthy
    monocyte-derived macrophages ex vivo. This does not establish a stable
    in-vivo endotype or displace the well-described neutrophil-dominant
    airway phenotype.
  citations:
  - PMID:41582098
- claim_id: perinatal-fluid-clearance
  statement: >-
    The Spag17 mouse study directly establishes failed perinatal lung-fluid
    clearance as the mechanism of neonatal respiratory distress in human PCD.
  disposition: QUALIFIED
  report_quote: >-
    This supports the canonical model's earliest manifestation — failure of
    perinatal lung fluid clearance
  rationale: >-
    Spag17-null mice develop neonatal lung-fluid accumulation, while neonatal
    respiratory distress is common in human PCD. The cross-species
    combination supports plausibility but does not directly establish the
    proposed mechanism in human infants.
  citations:
  - PMID:23418344
  - PMID:35011687
- claim_id: rsph1-p-value
  statement: >-
    The RSPH1 lung-function comparison yielded FEV1 73.0 versus 61.8 percent
    predicted with P equal to 0.0.
  disposition: REJECTED
  report_quote: >-
    better preserved lung function (FEV1 73.0 vs. 61.8% predicted, P=0.0)
  rationale: >-
    The source reports P=0.043 for this comparison. The effect estimate is
    correctly transcribed, but the reported P value is not.
  citations:
  - PMID:24568568
- claim_id: ontology-labels
  statement: >-
    The proposed CL identifiers correctly denote a multiciliated cell, club
    cell, M2 macrophage, and ependymal cell.
  disposition: REJECTED
  report_quote: >-
    Multiciliated cell (CL:0000710), Club cell (CL:0000158), M2 macrophage
    (CL:0000235), Ependymal cell (CL:0000065)
  rationale: >-
    CL:0000710 denotes neurecto-epithelial cell, not multiciliated cell, and
    CL:0000235 denotes macrophage without an M2 subtype. CL:0000158 and
    CL:0000065 are correctly labeled. CL:0005012 (multiciliated epithelial
    cell) is a suitable replacement for the report's intended generic
    multiciliated-cell concept. These ontology suggestions must not be copied
    into curated data as written.
- claim_id: go-ontology-mapping
  statement: GO:0060271 denotes multiciliated-cell differentiation.
  disposition: REJECTED
  report_quote: Multiciliated cell differentiation (GO:0060271)
  rationale: >-
    GO:0060271 denotes cilium assembly, not multiciliated-cell
    differentiation. This candidate ontology mapping must not be copied into
    curated data as written.
- claim_id: literature-count-provenance
  statement: The supplied artifacts substantiate review of 135 papers.
  disposition: NEEDS_VERIFICATION
  report_quote: 5 iterations, 135 papers, 16 confirmed findings, 52 evidence items
  rationale: >-
    The citation manifest exposes 50 unique PMIDs and no search log or
    complete screened corpus. The larger count may be valid, but it cannot be
    reconstructed from the deposited artifacts and should not be used as an
    evidence-quality metric.
- claim_id: multiciliogenesis-residual-cilium-distinction
  statement: CCNO and MCIDAS mutations cause PCD through reduced cilia number rather than beat
    defects
  report_quote: CCNO and MCIDAS mutations cause PCD through reduced cilia number rather than
    beat defects
  disposition: QUALIFIED
  rationale: >-
    CCNO patient cells retain residual cilia with appropriate axonemal motor proteins and motility.
    In contrast, PMID:25048963 explicitly reports that the one or two residual MCIDAS cilia lack
    DNAH5 and CCDC39, with loss of the upstream motor-expression program. Both reduce cilia number,
    but reduced number and residual-cilium beat dysfunction are not mutually exclusive. The previous
    assessment incorrectly extended CCNO residual normality to MCIDAS and has been corrected.
  citations:
  - PMID:24747639
  - PMID:25048963
- claim_id: dominant-inheritance-omission
  statement: biallelic (or, for FOXJ1, dominant)
  report_quote: biallelic (or, for FOXJ1, dominant)
  disposition: QUALIFIED
  rationale: >-
    FOXJ1 is an important dominant exception, but TUBB4B dominant-negative respiratory PCD was already
    described in 2024 in a 12-person cohort with functional models. Relevant X-linked forms also
    exist. TUBB4B is allelically heterogeneous, so sensory-only or mixed variants must not be generalized
    to every respiratory case. The disease definition now covers these inheritance classes.
  citations:
  - PMID:34132502
  - PMID:38662826
  - PMID:41005984
- claim_id: normal-beating-transport-dissociation
  statement: abolish or disorganize the coordinated beat
  report_quote: abolish or disorganize the coordinated beat
  disposition: QUALIFIED
  rationale: >-
    The report appropriately includes normal-TEM DNAH11 and RSPH1 frequency/waveform differences.
    Existing PMID:39362668 additionally demonstrates C1d-associated impaired patient-cell transport
    despite normal routine TEM, beat assessment and nasal NO. A transport defect is not synonymous
    with a detectable conventional beat defect. The nine-person characterization and available cultured
    samples do not establish every candidate gene at equal clinical-validity strength. Ascertainment
    selected situs-solitus cases, limiting laterality prevalence inference.
  citations:
  - PMID:39362668
  - PMID:24568568
  - PMID:18022865
- claim_id: longitudinal-data-absence
  statement: No Genotype-Stratified Longitudinal Natural History Data
  report_quote: No Genotype-Stratified Longitudinal Natural History Data
  disposition: REJECTED
  rationale: >-
    PMID:30067075 already followed 137 children and young adults over five years with 732 visits,
    stratified by ultrastructure and genotype; additional iPCD longitudinal evidence predates the
    report. Sparse adult/rare-genotype follow-up is a valid narrower gap, but categorical absence
    is false. The 24-year window in the radioaerosol series is the retrospective collection period,
    not 24 years of follow-up per participant.
  citations:
  - PMID:30067075
  - PMID:38076675
- claim_id: pcd-randomized-trial-gap
  statement: Paucity of PCD-Specific RCTs
  report_quote: Paucity of PCD-Specific RCTs
  disposition: QUALIFIED
  rationale: >-
    Few PCD trials exist, but the gap text calls BESTCILIA the only PCD-specific RCT while the same
    report cites CLEAN-PCD, a 123-participant randomized crossover trial. CLEAN-PCD showed a small
    combination-versus-hypertonic-saline ppFEV1 effect (1.5 points; CI below 0.1–3.0; p=0.044), with
    nonsignificant combination-versus-placebo and monotherapy-versus-placebo comparisons. Trial rarity
    and uncertain long-term benefit remain valid; absence of all other randomized evidence does not.
  citations:
  - PMID:32380069
  - PMID:37660715
- claim_id: human-dnai1-pharmacodynamic-update
  statement: mRNA Therapy as Mechanistic Proof
  report_quote: mRNA Therapy as Mechanistic Proof
  disposition: QUALIFIED
  rationale: >-
    The cited DNAI1 replacement study is mouse airway-culture rescue, not human efficacy. The 2026
    primary conference abstract for separate RCT1100-101/102 studies reports nine single-dose and
    seven multidose adults, no serious or grade ≥3 adverse events, and no post-treatment improvement
    in dynein-arm counts, movement or DNAI1 immunofluorescence. These small open-label pharmacodynamic
    findings do not prove efficacy or permanent failure of the platform. NCT06633757 is RCT1100-103,
    a distinct registry protocol, not the source of these reported outcomes.
  citations:
  - PMID:40963409
  - DOI:10.1093/ajrccm/aamag286.098
  - clinicaltrials:NCT06633757
- claim_id: enac-rationale-not-etiology
  statement: Mucus Dehydration / ASL Defect
  report_quote: Mucus Dehydration / ASL Defect
  disposition: QUALIFIED
  rationale: >-
    CLEAN-PCD tested mucus hydration through ENaC inhibition and hypertonic saline. Its rationale
    and comparator-specific FEV1 findings do not independently demonstrate primary mutation-intrinsic
    ENaC hyperabsorption across PCD genotypes. CFTR/ENaC airway physiology is relevant background,
    while a new universal PCD causal edge would require direct genotype-matched transport measurements.
  citations:
  - PMID:37660715
- claim_id: infertility-denominators
  statement: Male infertility was documented at 78% (39/50 men) and female infertility at 61%
    (72/118 women)
  report_quote: Male infertility was documented at 78% (39/50 men) and female infertility at
    61% (72/118 women)
  disposition: QUALIFIED
  rationale: >-
    Correct numerical estimates apply to 168 survey respondents who had tried to conceive, from 265/482
    adult respondents. Infertility included use of medically assisted reproduction; clinical data
    were unvalidated self-report. The 7.6% ectopic estimate is per pregnancy, not per woman. Selection/recall
    bias and gene differences preclude universal prevalence or obligatory infertility. Shared ciliary
    machinery supports the organ mechanism, not identity of every respiratory and reproductive phenotype.
  citations:
  - PMID:38962571
  - PMID:26373788
- claim_id: ccno-pooled-denominator
  statement: 10% hydrocephalus prevalence
  report_quote: 10% hydrocephalus prevalence
  disposition: QUALIFIED
  rationale: >-
    PMID:26777464 identified 15 people from 10/170 Israeli mucociliary-disorder families (6% of families).
    Its 10% hydrocephalus and 22% female-infertility estimates combine these with previously published
    CCNO cases, not just the 15 new participants, and are not general PCD frequencies.
  citations:
  - PMID:26777464
- claim_id: early-care-causal-inference
  statement: Treatment Insufficiency Despite Early Diagnosis
  report_quote: Treatment Insufficiency Despite Early Diagnosis
  disposition: QUALIFIED
  rationale: >-
    The 35-infant retrospective series shows substantial morbidity despite early care, including
    obstructive trends at age seven. There is no randomized early-versus-late diagnosis control,
    and hypertonic-saline exposure is strongly confounded by center. Disease persisting despite care
    does not establish care futility or quantify prevented harm.
  citations:
  - PMID:42112810
- claim_id: pathogen-progression-causality
  statement: Pseudomonas Colonization Marks Disease Progression
  report_quote: Pseudomonas Colonization Marks Disease Progression
  disposition: QUALIFIED
  rationale: >-
    Pseudomonas isolation and more severe disease associate in observational cohorts; established
    structural disease also promotes infection. These data do not on their own identify which direction
    dominates or prove a pathogen-specific independent mediator. Culture-directed care and a qualified
    infection-injury pathway are justified.
  citations:
  - PMID:38072392
  - PMID:42112810
- claim_id: infection-induced-epitranscriptomics
  statement: Epigenetic/Metabolic Ciliary Regulation
  report_quote: Epigenetic/Metabolic Ciliary Regulation
  disposition: QUALIFIED
  rationale: >-
    PMID:41738162 studies acquired Pseudomonas-induced lactate/YTHDF1/DNAH5 regulation in infection
    models, including conditional YTHDF1 knockout mice. It is not a demonstrated mutation-specific
    modifier pathway in congenital PCD. Existing DNAH5 patient-cell scRNA-seq/proteomics instead
    directly supports oxidative stress and adaptive GSTA1/2-NRF2 expression; GSTA2 loss slows motility,
    but antioxidant clinical benefit remains untested.
  citations:
  - PMID:41738162
  - PMID:39042459
- claim_id: brensocatib-scope
  statement: Brensocatib in PCD
  report_quote: Brensocatib in PCD
  disposition: QUALIFIED
  rationale: >-
    ASPEN supports brensocatib in a broad non-CF bronchiectasis population, and FDA approval in August
    2025 covers age ≥12 with non-CF bronchiectasis. This indication is not proof of a separately
    powered PCD treatment benefit; an etiologic subgroup cannot be assumed to share the overall effect.
    The report proposal should focus on PCD-specific precision and biological response rather than
    imply a new general indication or established PCD efficacy.
  citations:
  - PMID:40267423
- claim_id: diagnostic-guidance-update
  statement: normal ciliary ultrastructure
  report_quote: normal ciliary ultrastructure
  disposition: RETAINED
  rationale: >-
    The 2025 joint ERS/ATS guideline places high-speed video, immunofluorescence and nasal NO as
    adjuncts to TEM/genetics, requires inheritance-consistent P/LP variants in adequately validated
    genes, and states that no single normal test excludes PCD. The 77 nL/min standardized velum-closure
    threshold is a diagnostic aid, not an emergency critical-low or genotype-independent exclusion
    boundary. Routine FeNO concentration is not nasal NO production rate.
  citations:
  - PMID:41005984
  - PMID:24024753

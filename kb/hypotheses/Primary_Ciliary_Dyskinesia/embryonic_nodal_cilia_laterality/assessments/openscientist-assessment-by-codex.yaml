hypothesis_id: embryonic_nodal_cilia_laterality
assessed_at: "2026-07-31T04:48:04Z"
overall_verdict: SUPPORTED
summary: >-
  The genotype-scoped core mechanism—motile cilia at the left-right organizer
  generate directional flow, and disruption of relevant ciliary machinery
  randomizes laterality—is strongly supported by experimental and human
  evidence. The report nevertheless overstates mechanistic completeness,
  treats heterotaxy's flow basis as demonstrated rather than hypothesized, and
  overgeneralizes laterality sparing across DRC/IDA genes. Its claim that only
  outer-dynein-arm mutations impair 9+0 nodal cilia is contradicted by
  CCDC39/CCDC40 data. The cited DRC1 item is a case report rather than an
  independent negative-control cohort, several proposed ontology mappings are
  wrong, and the asserted 100-paper corpus is not reconstructable.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: nodal-flow-core
    statement: >-
      Disruption of motile cilia at the embryonic left-right organizer can
      abolish directional flow and randomize organ laterality.
    disposition: RETAINED
    report_quote: "Verdict: SUPPORTED (high confidence) — CANONICAL status confirmed."
    rationale: >-
      Artificial-flow experiments, motile-cilia mutants, flow-sensing studies,
      and human PCD laterality distributions converge on the scoped mechanism.
      It should not be generalized to every PCD genotype because some affected
      structures are absent from nodal cilia.
    citations:
      - PMID:12097914
      - PMID:22983710
      - PMID:17515466
      - PMID:24577564
  - claim_id: artificial-flow-causality
    statement: >-
      Experimentally imposed flow is sufficient to direct laterality in mouse
      embryos, including embryos with immotile cilia.
    disposition: RETAINED
    report_quote: >-
      the artificial flow was also able to direct the situs of mutant mouse
      embryos with immotile cilia
    rationale: >-
      Reversing flow reversed situs in wild-type embryos, and imposed flow
      directed situs in immotile-cilia mutants. This is unusually direct
      evidence that extracellular flow is causally instructive.
    citations:
      - PMID:12097914
  - claim_id: exclusion-of-preexisting-asymmetry
    statement: >-
      The artificial-flow experiment excludes any contribution from
      pre-existing intracellular chirality to left-right patterning.
    disposition: QUALIFIED
    report_quote: >-
      This constitutes the first direct evidence that mechanical fluid flow —
      not a pre-existing intracellular asymmetry — determines left-right
      patterning.
    rationale: >-
      The experiment establishes that flow is sufficient to direct the
      downstream axis; it does not exclude cellular chirality upstream of flow.
      Subsequent work explicitly combines embryonic axes with the chirality of
      ciliary rotation to explain how leftward flow is generated.
    citations:
      - PMID:12097914
      - PMID:16035921
  - claim_id: mechanistic-completeness
    statement: >-
      Every link from PCD genotype through flow transduction to clinical
      laterality is independently established.
    disposition: QUALIFIED
    report_quote: >-
      is mechanistically complete from upstream trigger to clinical
      manifestation, with each link supported by independent experimental
      evidence.
    rationale: >-
      The major chain is compelling, but direct observation in the human node is
      unavailable, the exact flow-to-signal biophysics remains debated, and
      genotype-specific effects are not captured by one universal axonemal
      chain.
    citations:
      - PMID:21307093
      - PMID:22983710
      - PMID:37477290
  - claim_id: heterotaxy-flow-mechanism
    statement: >-
      The excess of heterotaxy in PCD demonstrates that partial or turbulent
      residual nodal flow produces discordant organ situs.
    disposition: QUALIFIED
    report_quote: >-
      This suggests that partial or turbulent residual nodal flow may produce
      discordant laterality across organ systems rather than complete
      randomization.
    rationale: >-
      The human cohorts establish a 6–12 percent heterotaxy category. They do
      not measure embryonic flow, so the proposed partial/turbulent-flow
      explanation remains a testable hypothesis rather than an established
      mechanism.
    citations:
      - PMID:17515466
      - PMID:24577564
  - claim_id: negative-control-genotypes
    statement: >-
      RSPH1, CCNO, and DRC1 are three independently validated genotypes that
      spare laterality.
    disposition: QUALIFIED
    report_quote: >-
      three independent negative-control genotypes (RSPH1, CCNO, DRC1) that
      spare laterality as predicted
    rationale: >-
      RSPH1 is a strong structure-based negative control and CCNO is a useful
      but still small clinical series. The deposited DRC1 evidence does not
      independently validate laterality sparing, so the three should not be
      presented as equivalent.
    citations:
      - PMID:24518672
      - PMID:26777464
      - PMID:34102041
      - PMID:42185991
  - claim_id: drc1-cohort-characterization
    statement: >-
      Kato and colleagues reported a DRC1 cohort demonstrating frequent situs
      solitus.
    disposition: REJECTED
    report_quote: >-
      Kato et al. (2026) reported that "pathogenic variants in DRC1 are
      prevalent in East Asian populations and are frequently associated with
      situs solitus, which often obscures clinical suspicion"
    rationale: >-
      PMID:42185991 is a report of one neonatal DRC1 case plus a literature
      review. The quoted sentence is background synthesis, not a cohort result
      generated by that study. A separate DRC1 cohort supports a distinct
      clinical presentation but does not make this citation a primary
      laterality dataset.
    citations:
      - PMID:42185991
      - PMID:41570615
  - claim_id: oda-only-nodal-impairment
    statement: Only outer-dynein-arm mutations impair 9+0 nodal cilia.
    disposition: REJECTED
    report_quote: "Note: Only ODA-affecting mutations impair 9+0 cilia"
    rationale: >-
      CCDC39 and CCDC40 defects affect the nexin-dynein regulatory complex,
      inner dynein arms, and axonemal organization yet are associated with
      randomized laterality in humans and model organisms. Central-pair and
      radial-spoke defects may spare the node, but that fact cannot be extended
      to all non-ODA defects.
    citations:
      - PMID:21131972
      - PMID:21131974
      - PMID:23255504
  - claim_id: proposed-genotype-strata
    statement: >-
      CCDC39 and CCDC40 should be grouped with radial-spoke genes as an
      IDA/central-apparatus class predicted to have under 20 percent laterality
      defects.
    disposition: REJECTED
    report_quote: >-
      IDA/CA genes (CCDC39, CCDC40, RSPH1, RSPH4A) vs. multiciliogenesis genes
      (CCNO, MCIDAS).
    rationale: >-
      This grouping conflates biologically different defects. RSPH1/RSPH4A
      affect structures absent from 9+0 nodal cilia, whereas CCDC39/CCDC40
      organize axonemal components needed at the node and are associated with
      laterality defects.
    citations:
      - PMID:21131972
      - PMID:21131974
      - PMID:24518672
  - claim_id: go-ontology-mappings
    statement: >-
      GO:0003351 denotes epithelial cilium movement in left-right asymmetry and
      GO:0060287 denotes ciliary body morphogenesis.
    disposition: REJECTED
    report_quote: >-
      GO:0003351 (epithelial cilium movement involved in determination of
      left/right asymmetry); GO:0060287 (ciliary body morphogenesis)
    rationale: >-
      The labels are mismatched. GO:0003351 is epithelial cilium movement
      involved in extracellular fluid movement; GO:0060287 is epithelial
      cilium movement involved in determination of left/right asymmetry.
  - claim_id: node-ontology-mapping
    statement: UBERON:0003080 denotes the embryonic ventral node.
    disposition: REJECTED
    report_quote: "UBERON:0003080 (ventral node)"
    rationale: >-
      UBERON:0003080 denotes anterior neural tube, not the ventral node. The
      proposed anatomy mapping must not be copied into curated data.
  - claim_id: literature-count-provenance
    statement: The supplied artifacts substantiate review of 100 papers.
    disposition: NEEDS_VERIFICATION
    report_quote: 100 papers reviewed
    rationale: >-
      The citation manifest exposes 37 unique PMIDs and no search log or full
      screened corpus. The asserted total may reflect provider-internal work,
      but it cannot be reconstructed from the deposited artifacts.

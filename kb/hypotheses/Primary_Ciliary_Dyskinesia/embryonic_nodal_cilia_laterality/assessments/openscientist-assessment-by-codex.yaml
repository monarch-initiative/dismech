hypothesis_id: embryonic_nodal_cilia_laterality
assessed_at: '2026-09-05T00:24:56Z'
overall_verdict: SUPPORTED
summary: >-
  The genotype-restricted nodal-flow arm is supported. The report overstates mechanistic completeness,
  misclassifies non-ODA genes and cohort evidence, and misses direct mammalian mechanosensing experiments
  that already address a central proposed gap. This assessment expands and reconciles the July review
  after reading the complete provider report, citation sidecar, existing assessment, and disease
  YAML, and independently retrieving the material primary literature and current diagnostic/care
  guidance. No provider computation or primary omics analysis was reproduced.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: nodal-flow-core
  statement: >-
    Disruption of motile cilia at the embryonic left-right organizer can
    abolish directional flow and randomize organ laterality.
  disposition: RETAINED
  report_quote: 'Verdict: SUPPORTED (high confidence) — CANONICAL status confirmed.'
  rationale: >-
    Artificial-flow experiments, motile-cilia mutants, flow-sensing studies,
    and human PCD laterality distributions converge on the scoped mechanism.
    It should not be generalized to every PCD genotype because some affected
    structures are absent from nodal cilia.
  citations:
  - PMID:12097914
  - PMID:22983710
  - PMID:17515466
  - PMID:24577564
- claim_id: artificial-flow-causality
  statement: >-
    Experimentally imposed flow is sufficient to direct laterality in mouse
    embryos, including embryos with immotile cilia.
  disposition: RETAINED
  report_quote: >-
    the artificial flow was also able to direct the situs of mutant mouse
    embryos with immotile cilia
  rationale: >-
    Reversing flow reversed situs in wild-type embryos, and imposed flow
    directed situs in immotile-cilia mutants. This is unusually direct
    evidence that extracellular flow is causally instructive.
  citations:
  - PMID:12097914
- claim_id: exclusion-of-preexisting-asymmetry
  statement: >-
    The artificial-flow experiment excludes any contribution from
    pre-existing intracellular chirality to left-right patterning.
  disposition: QUALIFIED
  report_quote: >-
    This constitutes the first direct evidence that mechanical fluid flow —
    not a pre-existing intracellular asymmetry — determines left-right
    patterning.
  rationale: >-
    The experiment establishes that flow is sufficient to direct the
    downstream axis; it does not exclude cellular chirality upstream of flow.
    Subsequent work explicitly combines embryonic axes with the chirality of
    ciliary rotation to explain how leftward flow is generated.
  citations:
  - PMID:12097914
  - PMID:16035921
- claim_id: mechanistic-completeness
  statement: >-
    Every link from PCD genotype through flow transduction to clinical
    laterality is independently established.
  disposition: QUALIFIED
  report_quote: >-
    is mechanistically complete from upstream trigger to clinical
    manifestation, with each link supported by independent experimental
    evidence.
  rationale: >-
    The broad model is well supported, while human nodal dynamics and discordant organ outcomes remain
    incompletely observed. The July assessment left mammalian mechanosensing too unresolved: existing
    2023 mouse optical-tweezer evidence directly links ciliary bending to calcium and Dand5 decay,
    and parallel zebrafish manipulation supports the sensing principle. The September revision adds
    these and the 2021 BICC1/CNOT3 RNA-decay mechanism, without declaring every human intermediate
    resolved.
  citations:
  - PMID:36603091
  - PMID:36603098
  - PMID:34210974
  - PMID:22983710
- claim_id: heterotaxy-flow-mechanism
  statement: >-
    The excess of heterotaxy in PCD demonstrates that partial or turbulent
    residual nodal flow produces discordant organ situs.
  disposition: REJECTED
  report_quote: >-
    This suggests that partial or turbulent residual nodal flow may produce
    discordant laterality across organ systems rather than complete
    randomization.
  rationale: >-
    Heterotaxy cohorts do not directly measure embryonic flow. Partial or spatially disordered flow
    and signaling thresholds can be proposed, but a turbulent-flow explanation is not demonstrated
    and conflicts with the usual low-Reynolds-number nodal regime. Definitions and genotype mixtures
    explain variation in recorded frequencies without validating a particular flow mechanism.
  citations:
  - PMID:36342963
  - PMID:12097914
  - PMID:36603091
- claim_id: negative-control-genotypes
  statement: >-
    RSPH1, CCNO, and DRC1 are three independently validated genotypes that
    spare laterality.
  disposition: QUALIFIED
  report_quote: >-
    three independent negative-control genotypes (RSPH1, CCNO, DRC1) that
    spare laterality as predicted
  rationale: >-
    RSPH1 is a strong structure-based negative control and CCNO is a useful
    but still small clinical series. The deposited DRC1 evidence does not
    independently validate laterality sparing, so the three should not be
    presented as equivalent.
  citations:
  - PMID:24518672
  - PMID:26777464
  - PMID:34102041
  - PMID:42185991
- claim_id: drc1-cohort-characterization
  statement: >-
    Kato and colleagues reported a DRC1 cohort demonstrating frequent situs
    solitus.
  disposition: REJECTED
  report_quote: >-
    Kato et al. (2026) reported that "pathogenic variants in DRC1 are
    prevalent in East Asian populations and are frequently associated with
    situs solitus, which often obscures clinical suspicion"
  rationale: >-
    PMID:42185991 is a report of one neonatal DRC1 case plus a literature
    review. The quoted sentence is background synthesis, not a cohort result
    generated by that study. A separate DRC1 cohort supports a distinct
    clinical presentation but does not make this citation a primary
    laterality dataset.
  citations:
  - PMID:42185991
  - PMID:41570615
- claim_id: oda-only-nodal-impairment
  statement: Only outer-dynein-arm mutations impair 9+0 nodal cilia.
  disposition: REJECTED
  report_quote: 'Note: Only ODA-affecting mutations impair 9+0 cilia'
  rationale: >-
    CCDC39 and CCDC40 defects affect the nexin-dynein regulatory complex,
    inner dynein arms, and axonemal organization yet are associated with
    randomized laterality in humans and model organisms. Central-pair and
    radial-spoke defects may spare the node, but that fact cannot be extended
    to all non-ODA defects. These three citations were introduced by the
    assessor rather than drawn from the provider's citation manifest.
  citations:
  - PMID:21131972
  - PMID:21131974
  - PMID:23255504
- claim_id: proposed-genotype-strata
  statement: >-
    CCDC39 and CCDC40 should be grouped with radial-spoke genes as an
    IDA/central-apparatus class predicted to have under 20 percent laterality
    defects.
  disposition: REJECTED
  report_quote: >-
    IDA/CA genes (CCDC39, CCDC40, RSPH1, RSPH4A) vs. multiciliogenesis genes
    (CCNO, MCIDAS).
  rationale: >-
    This grouping conflates biologically different defects. RSPH1/RSPH4A
    affect structures absent from 9+0 nodal cilia, whereas CCDC39/CCDC40
    organize axonemal components needed at the node and are associated with
    laterality defects. The CCDC39/CCDC40 citations were introduced by the
    assessor rather than drawn from the provider's citation manifest.
  citations:
  - PMID:21131972
  - PMID:21131974
  - PMID:24518672
- claim_id: go-ontology-mappings
  statement: >-
    GO:0003351 denotes epithelial cilium movement in left-right asymmetry and
    GO:0060287 denotes ciliary body morphogenesis.
  disposition: REJECTED
  report_quote: >-
    GO:0003351 (epithelial cilium movement involved in determination of
    left/right asymmetry); GO:0060287 (ciliary body morphogenesis)
  rationale: >-
    The labels are mismatched. GO:0003351 is epithelial cilium movement
    involved in extracellular fluid movement; GO:0060287 is epithelial
    cilium movement involved in determination of left/right asymmetry.
- claim_id: node-ontology-mapping
  statement: UBERON:0003080 denotes the embryonic ventral node.
  disposition: REJECTED
  report_quote: UBERON:0003080 (ventral node)
  rationale: >-
    UBERON:0003080 denotes anterior neural tube, not the ventral node.
    UBERON:0003062 (primitive knot, with primitive node among its synonyms) is
    the appropriate replacement. The proposed mapping must not be copied into
    curated data as written.
- claim_id: literature-count-provenance
  statement: The supplied artifacts substantiate review of 100 papers.
  disposition: NEEDS_VERIFICATION
  report_quote: 100 papers reviewed
  rationale: >-
    The citation manifest exposes 37 unique PMIDs and no search log or full
    screened corpus. The asserted total may reflect provider-internal work,
    but it cannot be reconstructed from the deposited artifacts.
- claim_id: omitted-direct-mechanosensing
  statement: a definitive mammalian experiment is still needed
  report_quote: a definitive mammalian experiment is still needed
  disposition: REJECTED
  rationale: >-
    PMID:36603091 (Science 2023) directly bends immotile mouse nodal cilia with optical tweezers
    and measures calcium transients and Dand5 mRNA degradation, with directional PKD2 localization.
    Independent PMID:36603098 uses zebrafish optical tweezers, light-sheet microscopy and deep learning
    to show Pkd2-dependent intraciliary calcium and rescue/reversal of cardiac situs. These predate
    the report. Molecular details and human embryonic observation remain open, but the claimed absence
    of direct mammalian mechanosensory evidence is incorrect.
  citations:
  - PMID:36603091
  - PMID:36603098
- claim_id: dand5-rna-intermediate
  statement: Complete Downstream Signaling Cascade Mapped
  report_quote: Complete Downstream Signaling Cascade Mapped
  disposition: QUALIFIED
  rationale: >-
    The broad flow-to-NODAL pathway is supported, but the report skips experimentally resolved post-transcriptional
    intermediates. PMID:34210974 maps a flow-responsive Dand5 3′UTR region, PKD2/calcium and BICC1
    regulation, and CNOT3/CCR4-NOT-dependent RNA decay in mouse crown cells. These findings strengthen
    a specified mechanistic chain without making human heterotaxy timing or every signaling intermediate
    completely resolved.
  citations:
  - PMID:34210974
  - PMID:36603091
  - PMID:22983710
- claim_id: cohort-overlap-definitions
  statement: heterotaxy occurs in 6–12% of PCD patients
  report_quote: heterotaxy occurs in 6–12% of PCD patients
  disposition: QUALIFIED
  rationale: >-
    The 337-person 2007 and 305-person 2014 North American studies use different definitions and
    can share recruiting cohorts; they are not automatically independent prevalence replications.
    The 559-person later study found 51.2% solitus, 38.5% complete inversion and 10.4% ambiguus,
    but only 14/559 (2.5%) met its narrower complex-cardiovascular heterotaxy definition. The model
    should retain genotype- and definition-dependent distributions rather than treat 6–12% as a universal
    fixed rate.
  citations:
  - PMID:17515466
  - PMID:24577564
  - PMID:36342963
- claim_id: heterotaxy-surgery-population
  statement: 16.1%
  report_quote: 16.1%
  disposition: QUALIFIED
  rationale: >-
    PMID:20884020 concerns 87 heterotaxy/CHD surgical patients versus 634 surgical controls, not
    a confirmed-PCD cohort. The postoperative death rate of 16.1% versus 4.7% and other complications
    cannot be assigned to every patient with PCD/heterotaxy. Ciliary dysfunction was a proposed contributor,
    not a tested explanation for all excess surgical risk.
  citations:
  - PMID:20884020
- claim_id: chd-cohort-not-pcd-denominator
  statement: 18,781
  report_quote: 18,781
  disposition: QUALIFIED
  rationale: >-
    PMID:40467998 begins with background PCD frequency statements but its own denominator is 18,781
    CHD patients; 206 had laterality defects and 121 underwent sequencing. It is a reverse-ascertained
    CHD cohort, not a new 18,781-person PCD laterality study or independent confirmation of the 6.3%
    PCD estimate.
  citations:
  - PMID:40467998
- claim_id: flow-turbulence-inference
  statement: partial or turbulent residual nodal flow
  report_quote: partial or turbulent residual nodal flow
  disposition: REJECTED
  rationale: >-
    Clinical discordant situs does not measure embryonic flow speed or turbulence. Nodal microscale
    flow is in a low-Reynolds-number regime; irregular, weak or spatially altered flow and signaling
    thresholds are plausible hypotheses, but turbulent flow is not supported by the cited experiments
    or cohort data. No such causal edge is added.
  citations:
  - PMID:12097914
  - PMID:36603091
  - PMID:37477290
- claim_id: negative-control-scope
  statement: three independent negative-control genotypes
  report_quote: three independent negative-control genotypes
  disposition: QUALIFIED
  rationale: >-
    RSPH1 supports a structure-based nodal-sparing prediction and CCNO/MCIDAS provide multiciliogenesis-specific
    contrast. DRC1 report PMID:42185991 is one case plus review; PMID:41570615 supplies a separate
    64-person Japanese clinical series but does not convert that case report into a cohort. C1d transport-defect
    research selected situs-solitus cases, so its lack of laterality cannot estimate unselected prevalence.
    The nodal prediction must remain gene specific, not extend to all N-DRC or IDA defects.
  citations:
  - PMID:24568568
  - PMID:24747639
  - PMID:25048963
  - PMID:42185991
  - PMID:41570615
  - PMID:39362668
- claim_id: ccdc40-subcellular-location
  statement: CCDC39, CCDC40
  report_quote: CCDC39, CCDC40
  disposition: QUALIFIED
  rationale: >-
    The report wrongly groups these with radial-spoke/central-apparatus genes for laterality prediction.
    PMID:21131974 shows CCDC40 required for left-right patterning, but reports no CCDC40 signal in
    56 assessed nodal axonemes; it is apical cytoplasmic in node cells. Required function in the
    node does not imply demonstrated localization to its axoneme. The revised model therefore describes
    function rather than inventing nodal protein localization.
  citations:
  - PMID:21131974
  - PMID:21131972
  - PMID:23255504
- claim_id: human-transcriptomic-test-limits
  statement: This would close the most significant evidence gap
  report_quote: This would close the most significant evidence gap
  disposition: QUALIFIED
  rationale: >-
    Expression of ciliary genes in human gastrulation scRNA-seq would support cell identity and timing,
    not directly measure ciliary rotation, flow, mechanosensing or laterality outcomes. The proposed
    dataset analysis has no deposited accession or executed code in this report; it cannot by itself
    close the direct human embryonic mechanism gap.
  citations:
  - PMID:36603091
  - PMID:36603098
- claim_id: conditional-pkd2-existing-evidence
  statement: Conditional Pkd2 Knockout in Crown Cells Only
  report_quote: Conditional Pkd2 Knockout in Crown Cells Only
  disposition: QUALIFIED
  rationale: >-
    PMID:22983710 already localizes required Pkd2 function to crown-cell cilia and tests nodal flow
    sensing. New perturbations could resolve timing or interactions, but the proposed experiment
    should acknowledge prior cell-specific work and the subsequent 2023 mechanical-stimulation studies.
    Pkd2/Pkd1l1 sensor genes are not thereby general respiratory-PCD diagnostic genes.
  citations:
  - PMID:22983710
  - PMID:21307093
  - PMID:36603091
- claim_id: gene-validity-not-laterality-ranking
  statement: No GenCC/ClinGen Laterality-Specific Gene Classifications
  report_quote: No GenCC/ClinGen Laterality-Specific Gene Classifications
  disposition: QUALIFIED
  rationale: >-
    ClinGen/GenCC assess gene-disease validity rather than directly provide a quantitative laterality
    penetrance model. A missing outcome-specific grade is not a failure to establish the nodal mechanism.
    Gene validity, allele pathogenicity, tissue expression and observed laterality frequency need
    distinct evidence.
  citations:
  - PMID:41005984
  - PMID:38871375

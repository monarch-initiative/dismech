schema_version: "1.0"
provider: openscientist
assessor: claude-code
source_report: ../openscientist.md
hypothesis_id: dominant_negative_prc2
assessed_at: "2026-09-06T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The run was commissioned to test whether a provider search can move the
  Weaver-syndrome variant mechanism off UNKNOWN, where this repository records it
  because in vitro reconstitution reads the alleles as hypomorphic while a 2025
  isogenic study reads them as dominant-negative. It does not resolve that
  question, and the report says so itself: it concedes that dominant-negative
  interference and haploinsufficiency both lower net PRC2 output, converge on the
  same reduced-H3K27me3 endpoint, and are better described as compatible
  mechanisms at different scales than as exclusive alternatives. Its verdict of
  "partially-to-well supported" is therefore about the dominant-negative reading
  being credible, not about the competing reading being excluded.

  Two contributions are nonetheless material and were not in the seed. First it
  surfaces PMID:28696078, a de novo 1.2-Mb deletion removing the whole EZH2 gene
  in a child with tall stature and intellectual disability, whose authors conclude
  that EZH2 haploinsufficiency may replicate the Weaver phenotype. That is the
  closest human approximation to the null-allele arm of the discriminating
  experiment this repository records, and it argues that a poison protein is not
  required to produce the phenotype. Second it establishes by targeted search that
  the reciprocal germline gain-of-function growth-restriction arm asserted in the
  seed hypothesis rests on a single study, with no independent primary germline
  report; that arm was overstated in the seed and is corrected on the basis of
  this finding.

  The computational work is modest but real: a ClinVar and gnomAD variant-spectrum
  analysis whose committed CSV independently reproduces every count the report
  states. It was not replayed against the live sources, no MANIFEST.yaml
  accompanies the bundle, and the analysis code is recoverable only from an
  embedded string inside a provenance JSON rather than from the code path the
  report names, so the analyses are recorded as PARTIAL and
  PARTIALLY_AUDITABLE rather than SUCCEEDED.
artifacts:
  - openscientist-assessment-by-claude-code.md
artifact_root: ../openscientist_artifacts
data_sources:
  - data_source_id: clinvar-ezh2
    source_type: DATABASE
    name: ClinVar EZH2 germline pathogenic/likely-pathogenic variants
    identifier: "clinvar:EZH2"
    version: "821 variation records as reported by the run"
    uri: https://www.ncbi.nlm.nih.gov/clinvar/
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: ACCESSED
    query: "EZH2[gene]; germline pathogenic/likely-pathogenic; Weaver-syndrome trait filter"
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_data_ezh2_clinvar_weaver_plp.csv
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_data_ezh2_variant_class_summary.csv
    notes: >-
      The committed CSV holds 27 rows and its class counts and codon positions
      match every figure quoted in the report. Relevance is direct: the rows are
      EZH2 variants annotated to the Weaver-syndrome trait. The trait filter
      depends on ClinVar submitter annotation and was not audited per record.
  - data_source_id: gnomad-ezh2-constraint
    source_type: API
    name: gnomAD gene constraint for EZH2
    identifier: "gnomad:ENSG00000106462"
    version: gnomAD GraphQL, GRCh38
    uri: https://gnomad.broadinstitute.org/api
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: ACCESSED
    query: >-
      { gene(gene_symbol: "EZH2", reference_genome: GRCh38) { gene_id
      gnomad_constraint { pLI oe_lof oe_lof_lower oe_lof_upper lof_z syn_z mis_z
      obs_lof exp_lof } } }
    organism: Homo sapiens
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_data_gnomad_ezh2_constraint.json
    notes: >-
      The committed JSON records both the query and the response. Relevance is
      indirect: population constraint bears on EZH2 dosage sensitivity, which the
      report correctly describes as a double-edged datum that supports the
      importance of dosage as readily as it supports dominant-negative selection.
  - data_source_id: pubmed-reciprocal-gof
    source_type: DATABASE
    name: PubMed search for a germline EZH2 gain-of-function growth-restriction syndrome
    uri: https://pubmed.ncbi.nlm.nih.gov/
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: SEARCHED_NO_RESULT
    query: '"EZH2 gain of function microcephaly growth restriction germline" and variants'
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_logs_search_log.md
    notes: >-
      A relevant negative result, and the basis for down-statusing the seed's
      reciprocal gain-of-function arm. The committed search log records the
      queries run, so the absence is checkable against the queries rather than
      asserted.
  - data_source_id: pubmed-primary
    source_type: DATABASE
    name: PubMed primary-literature retrieval for Weaver/EZH2/PRC2
    uri: https://pubmed.ncbi.nlm.nih.gov/
    retrieved_at: "2026-09-05T00:00:00Z"
    access_status: ACCESSED
    query: Weaver syndrome / EZH2 / PRC2 / dominant-negative and related boolean queries
    source_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_logs_search_log.md
    notes: >-
      The committed log lists each query with the PMIDs returned, which is how
      PMID:28696078 can be traced to a specific search rather than to recall.
  - data_source_id: gencc-clingen
    source_type: DATABASE
    name: GenCC and ClinGen mechanism/dosage annotation for EZH2
    access_status: UNVERIFIABLE
    notes: >-
      The report states that no dominant-negative-specific mechanism annotation
      was located, and then correctly labels this unverified because neither
      resource was queried directly. Recorded as UNVERIFIABLE rather than as an
      established absence.
analyses:
  - analysis_id: ezh2-variant-spectrum
    method: >-
      Classify the 27 ClinVar Weaver-annotated pathogenic/likely-pathogenic EZH2
      variants by molecular consequence and map codon positions onto SANT1, CXC
      and SET/post-SET domain boundaries.
    comparison: >-
      Observed allele-class distribution against the distribution a stable
      poison-protein model predicts (missense in folded domains, no early
      NMD-triggering truncations).
    input_data_source_ids:
      - clinvar-ezh2
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    software:
      - software_name: OpenScientist execute_code sandbox
        software_version: "unreported"
      - software_name: pandas / matplotlib / requests
        software_version: "unreported"
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_data_ezh2_clinvar_weaver_plp.csv
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_data_ezh2_variant_class_summary.csv
    status_reason: >-
      Recomputing the class counts from the committed CSV reproduces the report's
      figures exactly: 27 rows, 21 missense, 3 truncating at codons 730, 733 and
      738, missense spanning codons 132 to 746. Execution is therefore
      substantiated by inspectable output. It is recorded as PARTIAL rather than
      SUCCEEDED because the run was not replayed against live ClinVar, so the step
      from the database to the CSV is attested only by the provider.
    limitations: >-
      No MANIFEST.yaml accompanies the bundle and no environment specification was
      delivered, so the analysis-run gate cannot be applied to it. The analysis
      code exists only as an embedded string inside
      provenance_ezh2_weaver_lollipop.json; the report and the bundle README point
      instead at code/clinvar_gnomad_analysis.py, which is not in the bundle. A
      curator replaying this must extract the code from the provenance JSON.
      Denominators depend on ClinVar submitter trait annotation, which was not
      audited per record.
  - analysis_id: ezh2-lollipop-figure
    method: matplotlib lollipop plot of variant codon positions across the 746-aa EZH2 protein.
    input_data_source_ids:
      - clinvar-ezh2
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/provenance_ezh2_weaver_lollipop.png
      - ../openscientist_artifacts/provenance_ezh2_weaver_lollipop.json
    status_reason: >-
      The figure is a real PNG in the bundle and its generating code is embedded in
      the accompanying provenance JSON. The bundle's own figures README states the
      PNG could not be copied out of the sandbox and is external, which the
      delivered bundle contradicts; the README is stale rather than the figure
      missing.
    limitations: >-
      Presentational. It restates the variant-spectrum table and carries no
      information beyond the committed CSV.
  - analysis_id: reciprocal-gof-negative-search
    method: Boolean PubMed queries for a germline gain-of-function EZH2 growth-restriction syndrome.
    input_data_source_ids:
      - pubmed-reciprocal-gof
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Weaver_Syndrome_dominant_negative_prc2_openscientist_artifacts_logs_search_log.md
    status_reason: >-
      The queries are committed in the search log, so the negative result is
      checkable against the exact expressions run. It is a bounded absence for
      those queries, not an exhaustive audit of the literature.
    limitations: >-
      A negative literature search cannot establish that no such case exists, only
      that these queries did not return one.
claims:
  - claim_id: dn-interference-at-low-dose
    statement: >-
      Weaver-associated EZH2 missense variants reduce H3K27me2/3 and increase
      H3K27ac even when expressed at low levels, which the source study reads as
      dominant-negative interference with PRC2 rather than gene-dosage loss.
    disposition: QUALIFIED
    report_quote: >-
      the pattern of H3K27me2/3 reductions indicated dominant-negative
      interference on PRC2 activity even when WS variants were expressed at low
      levels
    rationale: >-
      Accurately quoted, and it is the strongest direct evidence for the
      dominant-negative reading. It is qualified rather than retained outright for
      two reasons. It was supplied to the provider in the seed hypothesis, so it is
      not an independent discovery of this run. And the inference from
      low-dose activity loss to dominant-negative interference is the study
      authors', resting on an isogenic embryonic stem cell system rather than on a
      comparison against a heterozygous null, which is the comparison that would
      separate the two mechanisms.
    citations:
      - PMID:40846643
  - claim_id: whole-gene-deletion-phenocopy
    statement: >-
      A de novo deletion removing the whole EZH2 gene produced a Weaver-like
      phenotype, so true haploinsufficiency is sufficient to generate the clinical
      picture without a poison protein.
    disposition: RETAINED
    report_quote: >-
      haploinsufficiency of EZH2 may replicate the clinical phenotype of Weaver
      syndrome
    rationale: >-
      The most useful contribution of the run and absent from the seed. The quoted
      conclusion was checked against the fetched record for PMID:28696078, whose
      title independently confirms the lesion as a 1.2-Mb 7q36.1 deletion in a
      child with tall stature and intellectual disability. This is the nearest
      human approximation to the null arm of the discriminating experiment this
      repository records for the controversy, and it cuts against treating the
      dominant-negative reading as established. It is a single case report and the
      authors describe the phenotype as Weaver-like rather than classic Weaver
      syndrome, so it constrains the argument without settling it.
    citations:
      - PMID:28696078
  - claim_id: reciprocal-gof-single-source
    statement: >-
      The reciprocal claim that germline gain-of-function EZH2 variants cause a
      growth-restriction phenotype rests on a single study, with no independent
      primary germline report.
    disposition: RETAINED
    report_quote: >-
      The reciprocal comparison in the seed hypothesis (increased vs decreased
      H3K27me3 causing opposite growth phenotypes) is **currently supported only
      within PMID:40846643 itself**
    rationale: >-
      A correction to the seed, which asserted the reciprocal contrast without
      marking it single-source. The supporting queries are committed in the search
      log, and the report correctly separates the germline case from somatic
      oncogenic Y641 gain-of-function alleles, which raise H3K27me3 but cause
      lymphoma rather than a growth syndrome. The hypothesis description in the
      disease entry was amended on the strength of this finding.
    citations:
      - PMID:40846643
      - PMID:21190999
  - claim_id: variant-spectrum-supports-poison-protein
    statement: >-
      Weaver-annotated pathogenic EZH2 alleles are overwhelmingly missense in
      folded catalytic domains, and the only truncating alleles are extreme
      C-terminal and NMD-escaping, with no early truncations.
    disposition: QUALIFIED
    report_quote: >-
      There are **no early/NMD-triggering truncating variants** in the pathogenic
      Weaver set — the exact pattern the seed hypothesis predicts.
    rationale: >-
      The counts were recomputed from the committed CSV and match exactly. The
      genetic architecture is real and is consistent with a stable poison protein.
      It is weaker as an argument than the report implies, because the same
      architecture is also what a gene whose missense alleles are simply the
      commonly ascertained pathogenic class would look like, and because the
      whole-gene deletion case shows the null route can also produce the phenotype.
      The observation is accurate and the counts check out, but the analysis behind
      it is only partially auditable, so it is qualified rather than retained: it is
      a consistent pattern, not a demonstration of mechanism.
    analysis_ids:
      - ezh2-variant-spectrum
  - claim_id: mouse-r684c-heterozygote
    statement: >-
      A heterozygous knock-in mouse carrying the most common Weaver variant
      depletes H3K27me3 and shows skeletal overgrowth that is reversed by
      inhibiting the opposing KDM6A/KDM6B demethylases.
    disposition: RETAINED
    report_quote: >-
      inhibiting the opposing H3K27 demethylases KDM6A/KDM6B substantially
      reversed the excess osteogenesis
    rationale: >-
      Correctly reported and already cited in the disease entry for the osteoblast
      arm of the pathophysiology. The report is right that the heterozygote
      reproduces the human zygosity. It does not discriminate the two mechanisms,
      because the comparison it lacks is against an Ezh2 null heterozygote in the
      same background, which the report itself lists as a discriminating test.
    citations:
      - PMID:38015625
  - claim_id: overall-verdict-framing
    statement: >-
      The dominant-negative hypothesis is partially-to-well supported by convergent
      in vitro, model-organism and genetic-spectrum evidence.
    disposition: QUALIFIED
    report_quote: "**Verdict: PARTIALLY-TO-WELL SUPPORTED.**"
    rationale: >-
      The convergence is real but the three lines are not independent tests of the
      contested question. All three are compatible with reduced net PRC2 output
      from any cause, which is exactly what the competing hypothesis also predicts.
      The report concedes this in its own caveats, noting that the two models are
      not mutually exclusive and that a co-existing haploinsufficiency
      contribution cannot be excluded. The variant mechanism therefore stays
      UNKNOWN in the disease entry, and the verdict is read as support for the
      dominant-negative reading being credible rather than as exclusion of the
      alternative.
  - claim_id: bundle-completeness
    statement: >-
      The analysis code needed to replay the variant-spectrum computation is
      bundled with the report.
    disposition: REJECTED
    report_quote: "Artifacts: `data/ezh2_clinvar_weaver_plp.csv`, `figures/ezh2_weaver_lollipop.png` (regeneration code bundled)."
    rationale: >-
      No code file is in the bundle and no MANIFEST.yaml accompanies it, so the
      analysis-run gate cannot be applied. The code is in fact recoverable, as an
      embedded string inside provenance_ezh2_weaver_lollipop.json, but not at the
      path the report and the bundle README name. The claim is rejected as stated
      while the underlying capability is preserved in the analysis records above,
      because a curator following the report's own pointer would not find the code.

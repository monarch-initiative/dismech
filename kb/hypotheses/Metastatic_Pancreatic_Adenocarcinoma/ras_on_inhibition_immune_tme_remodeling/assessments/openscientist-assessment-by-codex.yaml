provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: ras_on_inhibition_immune_tme_remodeling
assessed_at: "2026-07-31T04:56:43Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's overall verdict remains appropriate: RAS(ON) multiselective
  inhibition can remodel the PDAC immune microenvironment and deepen
  immunotherapy responses in preclinical models, but no patient trial yet
  validates the combination or its immune pharmacodynamics. The report,
  however, misses the most directly matched primary study. PMID:40057911 tested
  RMC-7977 and daraxonrasib in immunocompetent PDAC models, reporting higher
  tumor MHC-I, fewer suppressive myeloid subsets, more T cells, and deeper,
  more durable immunotherapy combinations. This omission makes the claimed
  daraxonrasib/PDAC agent gap and categorical RAS-independent
  antigen-presentation conclusion incorrect. The report also double-counts a
  preprint and its final paper, overgeneralizes a CDK8 mechanism from MRTX1133
  to daraxonrasib, and cites a retracted PMID where a corrected republication is
  available.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: central-preclinical-spine
    statement: >-
      RAS(ON) multiselective inhibition has direct preclinical support for
      remodeling PDAC immunity and sensitizing tumors to immunotherapy.
    disposition: RETAINED
    report_quote: >-
      strong preclinical support for the central spine of this causal chain
    rationale: >-
      The report's conclusion is correct and is more directly supported than
      its evidence inventory indicates. PMID:40057911 tested RAS(ON)
      multiselective inhibition in immunocompetent PDAC models, including
      daraxonrasib, and reported fewer suppressive myeloid cells, more T cells,
      T-cell/cDC dependence, and deeper and more durable responses with
      immunotherapy.
    citations:
      - PMID:40057911
      - PMID:37782788
      - PMID:37625401
  - claim_id: direct-daraxonrasib-pdac-omission
    statement: >-
      Direct daraxonrasib-containing immune and anti-PD-1 combination evidence
      exists in preclinical PDAC models.
    disposition: REJECTED
    report_quote: >-
      the strongest **daraxonrasib-containing** immune-remodeling data are in
      KRAS-G12C **NSCLC**, not PDAC
    rationale: >-
      PMID:40057911 is a directly matched PDAC study. Its full text reports
      immunocompetent PDAC experiments with the tool compound RMC-7977 and the
      investigational drug daraxonrasib, including a daraxonrasib-plus-anti-PD-1
      study. It found increased tumor MHC-I, decreased MDSC-like subsets,
      increased CD4/CD8 T cells, T-cell/cDC-dependent regression, and deeper,
      more durable immunotherapy combinations. The NSCLC study PMID:41670434 is
      supportive but is not the strongest available drug-class/disease match.
    citations:
      - PMID:40057911
      - PMID:41670434
  - claim_id: clinical-combination-gap
    statement: >-
      Daraxonrasib plus checkpoint blockade lacks clinical efficacy and paired
      immune-contexture data in PDAC.
    disposition: RETAINED
    report_quote: >-
      the pivotal daraxonrasib + ICB combination, with on-treatment tumor immune
      contexture as pharmacodynamic readout, is **clinically untested**
    rationale: >-
      PMID:42223072 and PMID:42090791 evaluate daraxonrasib without checkpoint
      blockade or paired immune profiling. A current ClinicalTrials.gov search
      identifies PDAC daraxonrasib monotherapy and chemotherapy combinations,
      but no PDAC arm combining daraxonrasib with a checkpoint inhibitor. The
      preclinical evidence therefore cannot establish patient benefit.
    citations:
      - PMID:42223072
      - PMID:42090791
      - clinicaltrials:NCT06625320
      - clinicaltrials:NCT07491445
  - claim_id: antigen-presentation-ownership
    statement: >-
      Autophagy and FAK are parallel regulators of PDAC antigen presentation;
      their existence does not show that the RAS contribution is absent or
      subordinate.
    disposition: REJECTED
    report_quote: >-
      the **antigen-presentation** arm is dominantly autophagy- and FAK-driven
      and largely RAS-independent
    rationale: >-
      PMID:32376951 and PMID:36977556 establish autophagy/NBR1 and FAK control
      of MHC-I, but neither comparison establishes dominance over RAS signaling
      or independence from it. PMID:40057911 directly observed increased MHC-I
      on remaining PDAC tumor cells after RMC-7977. The causal mediation and
      interaction among RAS, autophagy, and FAK remain to be separated; the
      report's categorical ownership inference is unsupported.
    citations:
      - PMID:40057911
      - PMID:32376951
      - PMID:36977556
  - claim_id: treg-edge
    statement: >-
      A reduction in Treg abundance or suppressive function after daraxonrasib
      remains unproven, although the report's claim that no relevant primary
      PDAC study exists is too strong.
    disposition: QUALIFIED
    report_quote: >-
      **no primary evidence was found** that RAS/daraxonrasib inhibition
      relieves Treg dominance in PDAC
    rationale: >-
      PMID:40057911 directly measured FoxP3-positive CD4 Tregs and reported that
      the RMC-7977-associated CD4 increase was not attributable to that
      population. This is relevant primary evidence that the report missed, but
      it does not demonstrate Treg depletion or functional disarming. The
      specific Treg-relief edge should therefore remain unresolved rather than
      be treated as supported.
    citations:
      - PMID:40057911
  - claim_id: cdk8-daraxonrasib-scope
    statement: >-
      CDK8 is a credible shared resistance node, but the full
      CDK8-CXCL2 immune-reversal chain was demonstrated under MRTX1133 rather
      than daraxonrasib.
    disposition: QUALIFIED
    report_quote: >-
      The remodeling is **transient and self-reversing** via an adaptive
      CDK8→CXCL2 myeloid program that drives resistance
    rationale: >-
      PMID:42436354 directly shows initial immune infiltration followed by
      CDK8-CXCL2/FAS-mediated reversal during long-term MRTX1133 treatment.
      For daraxonrasib, it reports CDK8 upregulation in resistant PDX tumors,
      not the complete temporal immune-remodeling mechanism. The durability
      warning is important, but agent-specific mechanistic equivalence remains
      an inference.
    citations:
      - PMID:42436354
  - claim_id: independence-of-support
    statement: >-
      The cited evidence supports CD8-dependent combination benefit, but does
      not represent four independent confirmations of the same regimen.
    disposition: QUALIFIED
    report_quote: >-
      combining KRAS/MAPK inhibition with checkpoint blockade achieves durable,
      CD8-dependent regression that neither agent achieves alone
    rationale: >-
      PMID:36824971 is the preprint version of the study later published as
      PMID:37625401 and should not be counted as an independent replication.
      PMID:38727236 used SOS1 plus MEK inhibition and found that durable benefit
      required myeloid activation with a CD40 agonist before checkpoint
      blockade. The central conclusion is supported, but the regimens and
      independence of the sources must be stated accurately.
    citations:
      - PMID:36824971
      - PMID:37625401
      - PMID:37782788
      - PMID:38727236
  - claim_id: retracted-alternative-citation
    statement: >-
      The non-immune triple-targeting alternative must not rely on retracted
      PMID:41329731; the corrected republication has PMID:42224594.
    disposition: REJECTED
    report_quote: >-
      Daraxonrasib + EGFR (afatinib) + STAT3 (SD36) produced durable regressions
      with no immune combination at all (PMID 41329731)
    rationale: >-
      PubMed marks PMID:41329731 as retracted in May 2026. PNAS published a
      corrected version in June 2026 under PMID:42224594. The mechanistic
      alternative can be retained only by citing and reviewing that corrected
      record; the retracted PMID should not be treated as evidence.
    citations:
      - PMID:41329731
      - PMID:42224594
  - claim_id: human-immune-readout-gap
    statement: >-
      Daraxonrasib's phase 3 benefit supplies clinical context but not evidence
      for immune remodeling in patients.
    disposition: RETAINED
    report_quote: >-
      the trial was **monotherapy versus chemotherapy**, with no ICB arm and no
      on-treatment tumor immune contexture readout
    rationale: >-
      PMID:42223072 establishes improved survival and progression-free survival
      in previously treated mPDAC. It did not test checkpoint blockade or the
      proposed MHC-I, myeloid, T-cell, or Treg pharmacodynamic changes, so those
      clinical causal steps remain open.
    citations:
      - PMID:42223072

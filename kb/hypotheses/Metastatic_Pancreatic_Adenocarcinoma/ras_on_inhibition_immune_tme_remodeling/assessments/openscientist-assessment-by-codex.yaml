hypothesis_id: ras_on_inhibition_immune_tme_remodeling
assessed_at: '2026-09-05T00:46:23Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The central preclinical immune-remodeling hypothesis is supported, but its antigen-presentation
  ownership, daraxonrasib agent gap and generalized Treg-relief framing are flawed. The report missed
  direct 2025 RMC-7977/daraxonrasib PDAC evidence. Subsequent August evidence adds Treg recruitment
  and context-specific CTLA4 combination efficacy, qualifying generic checkpoint synergy. Patient
  immune mediation and checkpoint-combination efficacy remain unestablished in the cited clinical
  trials. This September review retains and expands the useful July assessment, reviews the complete
  report and citation sidecar, and distinguishes contemporaneous omissions from subsequently published
  evidence. Literature findings were independently verified and the disease YAML revised; no provider
  computation was reproduced.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: central-preclinical-spine
  statement: >-
    RAS(ON) multiselective inhibition has direct preclinical support for
    remodeling PDAC immunity and sensitizing tumors to immunotherapy.
  disposition: RETAINED
  report_quote: >-
    strong preclinical support for the central spine of this causal chain
  rationale: >-
    The report's conclusion is correct and is more directly supported than
    its evidence inventory indicates. PMID:40057911 tested RAS(ON)
    multiselective inhibition in immunocompetent PDAC models, including
    daraxonrasib, and reported fewer suppressive myeloid cells, more T cells,
    T-cell/cDC dependence, and deeper and more durable responses with
    immunotherapy.
  citations:
  - PMID:40057911
  - PMID:37782788
  - PMID:37625401
- claim_id: direct-daraxonrasib-pdac-omission
  statement: >-
    Direct daraxonrasib-containing immune and anti-PD-1 combination evidence
    exists in preclinical PDAC models.
  disposition: REJECTED
  report_quote: >-
    the strongest **daraxonrasib-containing** immune-remodeling data are in
    KRAS-G12C **NSCLC**, not PDAC
  rationale: >-
    PMID:40057911 is a directly matched PDAC study. Its full text reports
    immunocompetent PDAC experiments with the tool compound RMC-7977 and the
    investigational drug daraxonrasib, including a daraxonrasib-plus-anti-PD-1
    study. It found increased tumor MHC-I, decreased MDSC-like subsets,
    increased CD4/CD8 T cells, T-cell/cDC-dependent regression, and deeper,
    more durable immunotherapy combinations. The NSCLC study PMID:41670434 is
    supportive but is not the strongest available drug-class/disease match.
  citations:
  - PMID:40057911
  - PMID:41670434
- claim_id: clinical-combination-gap
  statement: >-
    The cited clinical studies do not establish PDAC benefit or immune pharmacodynamics of daraxonrasib
    plus checkpoint blockade.
  disposition: RETAINED
  report_quote: >-
    the pivotal daraxonrasib + ICB combination, with on-treatment tumor immune
    contexture as pharmacodynamic readout, is **clinically untested**
  rationale: >-
    PMIDs 42223072 and 42090791 report daraxonrasib trials without a randomized checkpoint-combination
    or paired tissue immune-contexture endpoint. Registry entries supply trial context, not negative
    proof of all ongoing or future trials. The prior assessment claimed a current exhaustive registry
    search without a committed query record; that absence claim is narrowed here. The experimental
    combinations remain preclinical evidence.
  citations:
  - PMID:42223072
  - PMID:42090791
  - clinicaltrials:NCT06625320
- claim_id: antigen-presentation-ownership
  statement: >-
    Autophagy and FAK are parallel regulators of PDAC antigen presentation;
    their existence does not show that the RAS contribution is absent or
    subordinate.
  disposition: REJECTED
  report_quote: >-
    the **antigen-presentation** arm is dominantly autophagy- and FAK-driven
    and largely RAS-independent
  rationale: >-
    PMID:32376951 and PMID:36977556 establish autophagy/NBR1 and FAK control
    of MHC-I, but neither comparison establishes dominance over RAS signaling
    or independence from it. PMID:40057911 directly observed increased MHC-I
    on remaining PDAC tumor cells after RMC-7977. The causal mediation and
    interaction among RAS, autophagy, and FAK remain to be separated; the
    report's categorical ownership inference is unsupported.
  citations:
  - PMID:40057911
  - PMID:32376951
  - PMID:36977556
- claim_id: treg-edge
  statement: >-
    A reduction in Treg abundance or suppressive function after daraxonrasib
    remains unproven, although the report's claim that no relevant primary
    PDAC study exists is too strong.
  disposition: QUALIFIED
  report_quote: >-
    **no primary evidence was found** that RAS/daraxonrasib inhibition
    relieves Treg dominance in PDAC
  rationale: >-
    The July assessment correctly noted that PMID:40057911 measured FoxP3-positive CD4 Tregs and
    did not attribute its RMC-7977-associated CD4 increase to that population; this did not show
    Treg depletion or disarming. Subsequent DOI:10.1038/s41467-026-75960-3 reports Treg recruitment
    under MRTX1133/daraxonrasib and CTLA4-associated reprogramming. The YAML replaces an unsupported
    generalized relief node with this contextual adaptation.
  citations:
  - PMID:40057911
  - DOI:10.1038/s41467-026-75960-3
- claim_id: cdk8-daraxonrasib-scope
  statement: >-
    CDK8 is a credible shared resistance node, but the full
    CDK8-CXCL2 immune-reversal chain was demonstrated under MRTX1133 rather
    than daraxonrasib.
  disposition: QUALIFIED
  report_quote: >-
    The remodeling is **transient and self-reversing** via an adaptive
    CDK8→CXCL2 myeloid program that drives resistance
  rationale: >-
    PMID:42436354 directly shows initial immune infiltration followed by
    CDK8-CXCL2/FAS-mediated reversal during long-term MRTX1133 treatment.
    For daraxonrasib, it reports CDK8 upregulation in resistant PDX tumors,
    not the complete temporal immune-remodeling mechanism. The durability
    warning is important, but agent-specific mechanistic equivalence remains
    an inference.
  citations:
  - PMID:42436354
- claim_id: independence-of-support
  statement: >-
    The cited evidence supports CD8-dependent combination benefit, but does
    not represent four independent confirmations of the same regimen.
  disposition: QUALIFIED
  report_quote: >-
    combining KRAS/MAPK inhibition with checkpoint blockade achieves durable,
    CD8-dependent regression that neither agent achieves alone
  rationale: >-
    PMID:36824971 is the preprint version of the study later published as
    PMID:37625401 and should not be counted as an independent replication.
    PMID:38727236 used SOS1 plus MEK inhibition and found that durable benefit
    required myeloid activation with a CD40 agonist before checkpoint
    blockade. The central conclusion is supported, but the regimens and
    independence of the sources must be stated accurately.
  citations:
  - PMID:36824971
  - PMID:37625401
  - PMID:37782788
  - PMID:38727236
- claim_id: retracted-alternative-citation
  statement: >-
    The non-immune triple-targeting alternative must not rely on retracted
    PMID:41329731; the corrected republication has PMID:42224594.
  disposition: REJECTED
  report_quote: >-
    Daraxonrasib + EGFR (afatinib) + STAT3 (SD36) produced durable regressions
    with no immune combination at all (PMID 41329731)
  rationale: >-
    PubMed marks PMID:41329731 as retracted in May 2026. PNAS published a
    corrected version in June 2026 under PMID:42224594. The mechanistic
    alternative can be retained only by citing and reviewing that corrected
    record; the retracted PMID should not be treated as evidence.
  citations:
  - PMID:41329731
  - PMID:42224594
- claim_id: human-immune-readout-gap
  statement: >-
    Daraxonrasib's phase 3 benefit supplies clinical context but not evidence
    for immune remodeling in patients.
  disposition: RETAINED
  report_quote: >-
    the trial was **monotherapy versus chemotherapy**, with no ICB arm and no
    on-treatment tumor immune contexture readout
  rationale: >-
    PMID:42223072 establishes improved survival and progression-free survival
    in previously treated mPDAC. It did not test checkpoint blockade or the
    proposed MHC-I, myeloid, T-cell, or Treg pharmacodynamic changes, so those
    clinical causal steps remain open.
  citations:
  - PMID:42223072
- claim_id: newer-treg-recruitment
  statement: Treg-relief edge unsupported
  report_quote: Treg-relief edge unsupported
  disposition: QUALIFIED
  rationale: >-
    The July caution against asserting Treg depletion was appropriate. Subsequent DOI:10.1038/s41467-026-75960-3
    directly finds recruitment of regulatory, effector and exhausted T cells under MRTX1133 or daraxonrasib.
    CTLA4 blockade reprogrammed effector Tregs toward a naive state and improved immune control in
    these models. This supports a context-dependent counter-regulatory recruitment node rather than
    generalized Treg relief; abundance and suppressive function are distinct endpoints.
  citations:
  - DOI:10.1038/s41467-026-75960-3
  - PMID:40057911
- claim_id: checkpoint-partner-specificity
  statement: combining KRAS/MAPK inhibition with checkpoint blockade achieves durable,
    CD8-dependent regression
  report_quote: combining KRAS/MAPK inhibition with checkpoint blockade achieves durable,
    CD8-dependent regression
  disposition: QUALIFIED
  rationale: >-
    PMID:40057911 demonstrated daraxonrasib plus anti-PD1 benefit in one PDAC system, whereas the
    subsequent Nature Communications study found CTLA4 blockade specifically effective compared with
    PD1, Tim3, Lag3, Vista and 4-1BB combinations in its models. Different regimen, timing and model
    conditions preclude treating either as a universal checkpoint ranking. Both are preclinical;
    no routine human combination is inferred.
  citations:
  - DOI:10.1038/s41467-026-75960-3
  - PMID:40057911
- claim_id: autophagy-publication-independence
  statement: 'PMID: 32459143'
  report_quote: 'PMID: 32459143'
  disposition: QUALIFIED
  rationale: >-
    PMID:32376951 is the primary Nature study. PMID:32459143 is an Autophagy commentary by overlapping
    authors about that recent study, not another independent Nature experiment. The NBR1 lysosomal
    MHC-I mechanism is supported by the primary evidence; two citation identifiers do not imply two
    independent replications.
  citations:
  - PMID:32376951
  - PMID:32459143
- claim_id: fak-kinase-and-subtype
  statement: cell-intrinsic FAK signaling suppresses the immunoproteasome and MHC-I
  report_quote: cell-intrinsic FAK signaling suppresses the immunoproteasome and MHC-I
  disposition: QUALIFIED
  rationale: >-
    The primary FAK study shows a kinase-independent function requiring nuclear FAK. The suppression
    was lost in an extreme squamous phenotype. Its genetic depletion and STAT3 interactions do not
    establish that a FAK kinase inhibitor reproduces antigen-presentation rescue in every PDAC subtype
    or that the pathway operates independently of RAS in all settings.
  citations:
  - PMID:36977556
- claim_id: usp20-direction-and-clinical-scope
  statement: USP20 acts as a metabolic checkpoint orchestrating CD8+ T-cell function and
    modulating KRAS-G12D-inhibitor efficacy
  report_quote: USP20 acts as a metabolic checkpoint orchestrating CD8+ T-cell function and
    modulating KRAS-G12D-inhibitor efficacy
  disposition: QUALIFIED
  rationale: >-
    PMID:42392864 supports KRAS-G12D/EGR1-driven USP20 stabilization of HMGCR, cholesterol accumulation
    and CD8 exhaustion, plus ULK1/autophagy-mediated adaptation under G12D inhibition. Thus active
    USP20 promotes suppression; relief follows inhibition, not activation of USP20. Human multiomics
    anchors associations, while causal perturbation and MRTX1133/USP20-inhibitor/PD1 combinations
    are model experiments, not a clinical daraxonrasib combination.
  citations:
  - PMID:42392864
- claim_id: sos1-mek-rebound-context
  statement: IL6+ iCAFs, M2 macrophages
  report_quote: IL6+ iCAFs, M2 macrophages
  disposition: QUALIFIED
  rationale: >-
    PMID:38727236 concerns combined SOS1/MEK inhibition and reports IL6-associated fibroblast/myeloid
    rebound with impaired dendritic-cell quality. Adding a CD40 agonist was required before checkpoint
    blockade produced the reported durable tumor-free outcomes. The report diagram should not assign
    that complete sequence to daraxonrasib or generic checkpoint blockade alone.
  citations:
  - PMID:38727236
- claim_id: ras-activity-human-association
  statement: KRAS activity score predicts immune composition
  report_quote: KRAS activity score predicts immune composition
  disposition: QUALIFIED
  rationale: >-
    PMID:37782788 links KRAS activity and immune/stromal states in human profiling and tests pathway
    inhibitors with immune therapy in preclinical systems. A bulk or single-cell association does
    not establish that every myeloid, stromal and T-cell effect is mediated by a single RAS-MAPK
    causal chain. KRAS is frequent but not universal, and KRAS-wild-type PDAC is a valid disease
    subset.
  citations:
  - PMID:37782788
  - PMID:37404765
- claim_id: allele-and-unselected-response
  statement: Allele-specificity of immune response
  report_quote: Allele-specificity of immune response
  disposition: QUALIFIED
  rationale: >-
    The cited PMID:42226008 is a review of allele-associated architecture, not a randomized comparison
    proving immune-treatment effect modification. General PDAC checkpoint response estimates below
    5% must distinguish unselected/microsatellite-stable cases from the rare MSI-high/dMMR treatment-sensitive
    subset. Molecular selection and immune-state composition are different stratifiers.
  citations:
  - PMID:42226008
  - DOI:10.1136/jitc-2021-004485
- claim_id: corrected-nonimmune-alternative
  statement: Daraxonrasib + EGFR (afatinib) + STAT3 (SD36) produced durable regressions
  report_quote: Daraxonrasib + EGFR (afatinib) + STAT3 (SD36) produced durable regressions
  disposition: QUALIFIED
  rationale: >-
    Corrected PMID:42224594 supports pharmacologic triple targeting and genetic RAF1/EGFR/STAT3 ablation
    in mouse/PDX systems. It provides a combination strategy without an added checkpoint antibody,
    but the absence of an immune drug does not prove absence of an immune contribution to efficacy.
    This is preclinical durability, not demonstrated human cure or clinical tolerability.
  citations:
  - PMID:42224594
- claim_id: trial-news-not-replication
  statement: RASolute 302
  report_quote: RASolute 302
  disposition: QUALIFIED
  rationale: >-
    The randomized trial PMID:42223072 establishes clinical efficacy. The report PMID:42226659 did
    not resolve in an independent NCBI fetch; the matching quoted wording is in Cancer Discovery
    news DOI:10.1158/2159-8290.CD-NW2026-0062. That secondary news item describes the same trial,
    not independent replication or immune pharmacodynamics. The August acquired-resistance ctDNA
    cohort PMID:42581230 adds molecular evolution data but no paired tissue immune-contexture or
    randomized checkpoint-combination endpoint. The unresolved PMID is retained here only as the
    object of the source audit, not a validated supporting citation.
  citations:
  - PMID:42223072
  - DOI:10.1158/2159-8290.CD-NW2026-0062
  - PMID:42581230
- claim_id: proposed-tests-not-results
  statement: Discriminating Tests
  report_quote: Discriminating Tests
  disposition: RETAINED
  rationale: >-
    All five proposed tests remain proposals in the provider record, with no executed input data,
    code or results. The Treg and antigen-presentation tests need redesign in light of direct existing
    evidence: quantify function and composition, distinguish kinase inhibition from FAK depletion,
    test interaction rather than exclusive pathway ownership, and compare clinically relevant exposure
    and checkpoint partners.
  citations:
  - PMID:40057911
  - PMID:36977556
  - DOI:10.1038/s41467-026-75960-3

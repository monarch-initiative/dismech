hypothesis_id: ras_on_inhibitor_acquired_resistance
assessed_at: '2026-09-04T23:34:09Z'
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The multi-route resistance hypothesis is partially supported, with strong direct PDAC evidence
  now available for KRAS amplification and MAPK/RTK pathway alterations at acquired resistance. The
  report overgeneralizes selective-G12C NSCLC, combination-treatment and metabolic-vulnerability
  findings, omits primary MYC/YAP work, and inconsistently distinguishes genetic from pharmacologic
  combinations. Newly published August paired clinical data supersede its broad clinical-data gap
  without validating every proposed escape route. This September review retains and expands the useful
  July assessment, reviews the complete report and citation sidecar, and distinguishes contemporaneous
  omissions from subsequently published evidence. Literature findings were independently verified
  and the disease YAML revised; no provider computation was reproduced.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: clinical-resistance-scope
  statement: >-
    Clinical data show finite disease control and acquired resistance in at
    least some responders, but do not show that essentially every treated
    patient acquires resistance.
  disposition: QUALIFIED
  report_quote: >-
    The *existence* of acquired resistance to RAS(ON) multiselective,
    tri-complex inhibition (daraxonrasib / RMC-6236) in metastatic PDAC is
    firmly established: in the phase 3 RASolute 302 trial, daraxonrasib
    improved but did not cure disease (median PFS 7.3 months in the RAS G12
    population), and essentially all patients eventually progress
  rationale: >-
    PMID:42223072 reports a median progression-free survival, whose endpoint
    is progression or death; it does not establish eventual progression in
    every patient or distinguish primary from acquired resistance.
    PMID:42090791 reported objective responses in only 35% of a 26-patient
    second-line RAS-G12 subgroup, so progression among all treated patients
    cannot be labeled acquired resistance. PMID:42465401 does directly
    describe progression after ten months in one responding KRAS-G12R
    patient, supporting existence but not universality.
  citations:
  - PMID:42223072
  - PMID:42090791
  - PMID:42465401
- claim_id: clinical-route-gap
  statement: >-
    The July gap in longitudinal clinical resistance profiling is now partly resolved by a subsequent
    phase I/II paired-ctDNA study.
  disposition: QUALIFIED
  report_quote: >-
    There is, as of the search date, no published longitudinal clinical
    (ctDNA/rebiopsy) characterization of resistance from the RASolute 302
    daraxonrasib-treated PDAC cohort.
  rationale: >-
    The original July review correctly distinguished efficacy trials from molecular profiling. PMID:42581230
    appeared on August 11 and now provides paired ctDNA in 44 acquired-resistant patients from phase
    I/II NCT05379985, not RASolute 302. KRAS amplification was detected in 16/44 and RAS-pathway
    changes in 26/44. Molecular origin, undetected/non-genetic routes and population-wide prevalence
    remain unresolved; the old categorical absence must no longer drive the disease model.
  citations:
  - PMID:42581230
  - PMID:42223072
  - PMID:42465401
- claim_id: cypa-allele-specific-route
  statement: >-
    Cyclophilin-A loss is a plausible allele-specific daraxonrasib resistance
    route in KRAS-G12D PDAC models.
  disposition: QUALIFIED
  report_quote: >-
    KRAS-allele-specific resistance including downregulation of cyclophilin A
    (CypA)
  rationale: >-
    PMID:42465401 directly reports reduced CypA with retained KRAS-G12D-GTP
    signaling in daraxonrasib-resistant PDAC cells. It is a July 2026 preprint,
    however, and its clinical case concerns a different KRAS-G12R
    EGFR/RAS-WT route. Patient prevalence, causal rescue, and generality
    beyond the tested models remain unresolved.
  citations:
  - PMID:42465401
- claim_id: g12c-study-context
  statement: >-
    PMID:41165456 does not establish KRAS amplification or RTK reactivation as
    resistance mechanisms to multiselective RAS(ON) inhibition.
  disposition: REJECTED
  report_quote: >-
    supported in RAS(ON)-inhibitor–resistant models (PMID:41165456)
  rationale: >-
    This NSCLC study selected models resistant to KRAS-G12C(OFF) or
    G12C-selective RAS(ON) inhibitors. The KRAS-G12C-amplified and NRAS-G13R
    models were vulnerable to dual RMC-4998 plus RMC-7977 treatment, while
    RTK/persistent-RAS models were sensitive to RMC-7977 alone. Thus
    multiselective inhibition, alone or in combination, overcame rather than
    modeled these escape states. The study is useful analog evidence and
    supports the report's later sufficiency caveat, but it cannot be used as
    direct evidence that those routes escape multiselective RAS(ON)
    inhibition.
  citations:
  - PMID:41165456
- claim_id: cell-cycle-bypass
  statement: >-
    RAS-independent cell-cycle continuation is directly supported as a
    preclinical RMC-6236 resistance state, but the report bundles distinct
    cell-cycle and microenvironmental findings.
  disposition: QUALIFIED
  report_quote: >-
    RAS-independent cell-cycle continuation (CDK4/6, CDK2, CDK8, E2F, DDR)
  rationale: >-
    PMID:41959066 reports RMC-6236-resistant cells with proliferation
    uncoupled from RAS and restoration of sensitivity by CDK4/6 or CDK2
    targeting, including resistant-model xenografts. It is a preprint with
    mixed PDAC and NSCLC models and no patient validation. CDK8 in
    PMID:42436354 is principally a CXCL2/FAS/TME resistance node and should
    not be treated as interchangeable with the cell-intrinsic CDK2/4/6
    program.
  citations:
  - PMID:41959066
  - PMID:42436354
- claim_id: jun-combination-scope
  statement: >-
    JUN is a supported preclinical bypass node under combined SHP2 and
    RAS(ON) inhibition, not yet a demonstrated clinical or daraxonrasib
    monotherapy resistance mechanism.
  disposition: QUALIFIED
  report_quote: >-
    JUN/AP-1 + mTOR hyperactivation is a mediator of resistance to RAS(ON)
    multiselective inhibition in PDAC
  rationale: >-
    PMID:41572361 generated resistance to SHP2 plus RMC-6236 in PDAC cell
    lines and showed that JUN overexpression was sufficient for resistance to
    that combination. The in-vivo MAP2K4 rescue experiment instead used
    SHP2-plus-ERK inhibition. The paper supports JUN as a candidate convergent
    node, but the report should preserve the combination, model-system, and
    validation-scope restrictions.
  citations:
  - PMID:41572361
- claim_id: ferroptosis-scope
  statement: >-
    Mitochondrial remodeling and GPX4 vulnerability are plausible
    RAS-pathway-treatment adaptations, not established daraxonrasib resistance
    routes in patients.
  disposition: QUALIFIED
  report_quote: >-
    a persistent mitochondrial-remodeled,
    ferroptosis(GPX4)-vulnerable metabolic state emerges
  rationale: >-
    PMID:41545339 primarily studied dual SHP2/MEK inhibition in PDAC cell
    lines, organoids, and mouse models; it reports confirmation with direct
    RAS targeting but not a clinical daraxonrasib-resistance cohort. The
    ferroptosis sensitivity is a treatment-induced vulnerability and should
    not be conflated with evidence that this state itself is a prevalent
    clinical escape route.
  citations:
  - PMID:41545339
- claim_id: rtk-sufficiency-caveat
  statement: >-
    RTK and PI3K feedback are strong analog mechanisms whose sufficiency
    against multiselective RAS(ON) inhibition remains context dependent.
  disposition: QUALIFIED
  report_quote: >-
    mostly demonstrated against *partial* pathway inhibition; its sufficiency
    against *complete* RAS(ON) blockade is less certain.
  rationale: >-
    The original scope caveat remains correct for MEK and G12C-selective analog studies. Subsequent
    PMID:42581230 now documents clinical acquired RTK alterations and functional HER2-associated
    resistance to daraxonrasib in PDAC; PMID:42465401 adds an allele-specific G12R preprint case.
    This updates the route from solely analog rationale while retaining context-dependent sufficiency
    and unproven clinical salvage efficacy.
  citations:
  - PMID:25736685
  - PMID:41165456
  - PMID:42465401
  - PMID:42581230
- claim_id: august-clinical-update
  statement: No longitudinal clinical resistance dataset for daraxonrasib in PDAC.
  report_quote: No longitudinal clinical resistance dataset for daraxonrasib in PDAC.
  disposition: QUALIFIED
  rationale: >-
    Reasonable as a dated July search result, but superseded by PMID:42581230, published August 11.
    Paired ctDNA from 44 phase I/II patients selected for prior response or stable disease over three
    months followed by progression found emergent RAS-pathway alterations in 26/44, including KRAS
    amplification in 16/44. This is not a RASolute 302 phase III cohort or prevalence among all treated
    patients. RTK 4/44, MAPK 11/44 and PI3K 4/44 categories overlap. Eighteen cases lacked detected
    RAS-pathway events; ctDNA cannot exclude non-genetic, spatial or undetected resistance.
  citations:
  - PMID:42581230
  - PMID:42223072
- claim_id: secondary-ras-mutation-spectrum
  statement: no published second-site RAS mutation spectrum for daraxonrasib
  report_quote: no published second-site RAS mutation spectrum for daraxonrasib
  disposition: QUALIFIED
  rationale: >-
    The July absence should remain dated. The August PDAC clinical/preclinical study found no acquired
    secondary KRAS mutations in its 44 clinical cases or models, while KRAS amplification was common.
    Absence within a selected finite cohort does not exclude all on-target mutations, variants in
    other cancers, or later evolution. The YAML no longer lists secondary RAS mutations as an established
    PDAC route.
  citations:
  - PMID:42581230
- claim_id: allele-identity-and-salvage
  statement: PDAC, allele-stratified (e.g., G12D vs G12V)
  report_quote: PDAC, allele-stratified (e.g., G12D vs G12V)
  disposition: QUALIFIED
  rationale: >-
    The actual July preprint compares G12D with G12R, not G12V: CypA protein loss accompanies retained
    G12D-GTP signaling, whereas G12R resistance recruits EGFR/RAS-WT signaling. Its single G12R patient
    had ten months on daraxonrasib and about five months of sixth-line trametinib-based combination
    control. Forty months of total survival cannot be attributed to that salvage regimen by comparison
    with an unselected historical median. The report correctly requested verification of its truncated
    abstract; the full cached abstract resolves allele assignment but not all experimental causality.
  citations:
  - PMID:42465401
- claim_id: cdk-inhibitor-conjunction
  statement: CDK4/6 + CDK2 co-targeting restores sensitivity, durable control
  report_quote: CDK4/6 + CDK2 co-targeting restores sensitivity, durable control
  disposition: REJECTED
  rationale: >-
    PMID:41959066 is a preprint studying mixed PDAC/NSCLC systems. It reports benefit from CDK4/6
    OR CDK2 inhibition with RMC-6236, not proof that simultaneously inhibiting both CDK classes is
    required. CDK2-associated persistent cytostasis is not a demonstrated patient survival benefit.
    The disease model distinguishes this from CDK8-mediated immune adaptation.
  citations:
  - PMID:41959066
- claim_id: myc-primary-omission
  statement: MYC amplification causal role for daraxonrasib | Review-level only (PMID:39586491)
  report_quote: MYC amplification causal role for daraxonrasib | Review-level only
    (PMID:39586491)
  disposition: REJECTED
  rationale: >-
    Primary PMID:38588697 predates the report and directly studies RMC-7977 in PDAC. MYC amplification
    appeared in 7/11 resistant KPC tumors versus 3/36 controls, with functional MYC and YAP/TEAD
    experiments and frequent continued pERK suppression at relapse. The report missed this primary
    evidence. August daraxonrasib clinical profiling found MYC amplification in only 1/44 cases,
    co-occurring with KRAS amplification; preclinical prominence does not establish human dominance.
  citations:
  - PMID:38588697
  - PMID:39586491
  - PMID:42581230
- claim_id: ras-independence-absolute
  statement: NOT reversed by deeper RAS inhibition
  report_quote: NOT reversed by deeper RAS inhibition
  disposition: QUALIFIED
  rationale: >-
    Some cell-state bypass routes maintain growth despite suppressed MAPK output, but the report
    gives an absolute cross-mechanism prediction without exposure-response, target-occupancy and
    rescue comparisons for every model. MYC/YAP, JUN plus SHP2/RAS and CDK continuation are separate
    experimental contexts. Deeper inhibition cannot be assumed either sufficient or insufficient
    in all patients.
  citations:
  - PMID:38588697
  - PMID:41572361
  - PMID:41959066
- claim_id: erbb-fak-computational-preprint
  statement: FAK is a baseline (standing) dependency in 58% of lines, independent of induced
    ERBB
  report_quote: FAK is a baseline (standing) dependency in 58% of lines, independent of induced
    ERBB
  disposition: QUALIFIED
  rationale: >-
    PMID:42465359 is a computational preprint integrating public data, not new OpenScientist analysis.
    The pharmacologic ERBB effect has confidence intervals crossing zero; pooled ERBB/FAK correlation
    uses n=8 and is nonsignificant. Nonsignificance does not establish statistical independence.
    The 58% figure belongs to the sampled pancreatic cell lines, not patients or all PDAC, and no
    functional daraxonrasib combination efficacy was established.
  citations:
  - PMID:42465359
- claim_id: yap-sdc1-and-shp2-pi3k
  statement: YAP1 restores SDC1 → macropinocytosis + multi-RTK activation → resistance
  report_quote: YAP1 restores SDC1 → macropinocytosis + multi-RTK activation → resistance
  disposition: QUALIFIED
  rationale: >-
    PMID:40713971 supports a YAP1-SDC1 mechanism under mutant-selective KRAS inhibition in gastrointestinal
    cancer models; PMID:40146324 supports MRTX1133 with SHP2 or PI3K inhibition in pancreatic cell
    models. Neither establishes that all RTK routes overcome clinically achieved multiselective RAS
    inhibition or that proposed combinations benefit patients. The model retains the broader scavenging
    program and confines these leads to hypothesis discussion.
  citations:
  - PMID:40713971
  - PMID:40146324
- claim_id: cd24-version-and-agent
  statement: CD24 upregulation / loss of T-cell–cDC control → immune escape
  report_quote: CD24 upregulation / loss of T-cell–cDC control → immune escape
  disposition: QUALIFIED
  rationale: >-
    CD24 upregulation and antibody-sensitive macrophage phagocytosis were tested under G12C/G12D-selective
    inhibition. PMID:37790498 is the preprint of final PMID:40966362, not independent replication.
    T-cell/cDC dependence under RMC-7977/daraxonrasib is separate evidence and does not itself show
    acquired immune escape in clinical progressors. The YAML distinguishes these programs.
  citations:
  - PMID:40966362
  - PMID:37790498
  - PMID:40057911
- claim_id: triple-combination-scope
  statement: High biologically; genetic (not pharmacologic)
  report_quote: High biologically; genetic (not pharmacologic)
  disposition: REJECTED
  rationale: >-
    Corrected PMID:42224594 includes both genetic RAF1/EGFR/STAT3 ablation and pharmacologic daraxonrasib/afatinib/SD36
    treatment, including orthotopic, genetically engineered and PDX systems. The report incorrectly
    restricts it to genetic experiments. No resistance for over 200 days in an experimental setting
    is not permanent clinical cure, universal tolerability or proof immune contributions are absent.
    The corrected republication replaces retracted PMID:41329731.
  citations:
  - PMID:42224594
  - PMID:41329731
- claim_id: tfeb-lysosomal-drug-scope
  statement: TFEB → lysosomal drug sequestration → reduced drug exposure
  report_quote: TFEB → lysosomal drug sequestration → reduced drug exposure
  disposition: QUALIFIED
  rationale: >-
    The complete primary source PMID:32194992 supports lysosomal accumulation of MEK inhibitors trametinib/refametinib
    by LC-MS, with TFEB knockdown sensitization and stronger biogenesis in classical than basal-like
    models. The mechanism is valid within that drug/model context but has not been demonstrated for
    daraxonrasib. A truncated-snippet validator failure is not biological refutation; no tri-complex
    drug-sequestration edge is promoted.
  citations:
  - PMID:32194992
- claim_id: crc-drug-holiday-extrapolation
  statement: drug withdrawal → oncogene-induced senescence; senolytic vulnerability
  report_quote: drug withdrawal → oncogene-induced senescence; senolytic vulnerability
  disposition: QUALIFIED
  rationale: >-
    PMID:36355783 studies KRAS-G12C/EGFR-inhibited colorectal cancer, with molecular monitoring and
    experimental withdrawal effects. It supports an analogy, not a daraxonrasib PDAC drug-holiday
    or senolytic treatment recommendation. Amplification dosage, allele, tissue and inhibitor exposure
    alter consequences.
  citations:
  - PMID:36355783
- claim_id: review-level-combination-landscape
  statement: Anti-resistance combination landscape
  report_quote: Anti-resistance combination landscape
  disposition: QUALIFIED
  rationale: >-
    PMIDs 40256920, 42077604, 40805153, 40624835 and 42226005 synthesize resistance/allele concepts
    rather than independently validate each combination. The G12R review is useful background, but
    allele frequencies, pocket restrictions and proposed drug sensitivity cannot substitute for drug-matched
    primary functional and clinical data.
  citations:
  - PMID:40256920
  - PMID:42077604
  - PMID:40805153
  - PMID:40624835
  - PMID:42226005
- claim_id: quantitative-and-artifact-limit
  statement: No effect sizes/statistics could be independently computed (no datasets)
  report_quote: No effect sizes/statistics could be independently computed (no datasets)
  disposition: RETAINED
  rationale: >-

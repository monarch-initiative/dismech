hypothesis_id: baijiu_extract_microbiota_lactate_mediation_model
assessed_at: "2026-07-31T05:47:42Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report has a useful causal structure and correctly identifies that the
  accessible source evidence does not establish the proposed mediation chain.
  One mouse study directly supports an extract-associated phenotype with
  concurrent microbiome, lactate, redox, oxidative-stress, and liver-injury
  changes, plus context-specific lactate sufficiency in a cell assay. It does
  not establish microbiota dependence, microbial lactate origin, portal
  delivery, mediator necessity, causal direction between lactate and redox, or
  an active constituent. The synthesis also contains material errors: it
  falsely reports a checked absence of gut-to-liver microbial lactate evidence,
  treats a different protective lactobacillus genus as a refutation, reverses
  the cited FMT experiment, overinterprets two human evidence sets, omits close
  Baijiu-component alternatives, and proposes two incorrect GO mappings.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: distinctive-mediation-gap
    statement: >-
      The accessible source evidence does not establish the distinctive
      microbiota-derived-lactate mediation chain.
    disposition: RETAINED
    report_quote: >-
      no formal mediation analysis, no causal constituent assignment, no
      strain isolation, and no gut→liver flux measurement
    rationale: >-
      The PMID:42300615 abstract reports concurrent changes in microbiota,
      lactate, redox balance, oxidative-stress markers, and liver injury, and a
      cell assay in which excessive lactate worsened oxidative stress. It does
      not report microbiota perturbation, portal or isotope tracing, mediator
      add-back, or constituent-specific necessity. These are the decisive
      missing tests for the proposed chain.
    citations:
      - PMID:42300615
  - claim_id: source-access-provenance
    statement: >-
      Categorical claims about experiments absent from the source require
      full-text verification.
    disposition: QUALIFIED
    report_quote: >-
      The seed source (PMID:42300615) abstract was available but its full
      methods/mediation details could not be inspected; mediation-absence is
      inferred from the abstract.
    rationale: >-
      The report transparently states this access limitation, but elsewhere
      converts what was not reported in the inspected abstract into categorical
      statements about what the study did not contain. The evidence-grade
      conclusion remains that mediation is unestablished; provenance-sensitive
      wording should say that the decisive experiments were not found in the
      materials inspected.
    citations:
      - PMID:42300615
  - claim_id: checked-absence-gut-liver-lactate
    statement: >-
      The reported checked absence of gut-derived lactate reaching and
      affecting the liver is false.
    disposition: REJECTED
    report_quote: >-
      Two independent PubMed queries (2026-07-26) returned zero papers
    rationale: >-
      PMID:32810440 directly reports commensal-derived D-lactate reaching the
      mouse liver through the portal vein and restoring Kupffer-cell pathogen
      clearance after purified-metabolite administration or gnotobiotic
      colonization. PMID:40738110 identifies gut microbiota as the main source
      of circulating D-lactate, traces its hepatic metabolism, and lowers liver
      inflammation and fibrosis by trapping intestinal D-lactate in obese
      MAFLD/MASH mice. Neither validates the Baijiu/ALD chain, but together they
      invalidate a checked absence. The defensible gap is ALD- and
      intervention-specific evidence.
    citations:
      - PMID:32810440
      - PMID:40738110
  - claim_id: lactate-identity-and-source
    statement: >-
      The proposed gut-derived lactate node is not sufficiently specified to
      connect the source observations to the external evidence.
    disposition: QUALIFIED
    report_quote: Lower GUT-DERIVED lactate flux to liver
    rationale: >-
      The report does not establish whether the source assay measured D-lactate,
      L-lactate, or total lactate; whether the in-vivo signal was luminal,
      portal, systemic, or hepatic; or whether it arose from microbes or host
      LDH activity. PMID:32810440 and PMID:40738110 show that microbial
      D-lactate can reach and affect the liver, while PMID:29025729 shows that
      ethanol directly raises hepatocyte NADH/NAD+ and changes the
      lactate-pyruvate redox system. These are mechanistically distinct routes
      that cannot be collapsed into one generic lactate node.
    citations:
      - PMID:32810440
      - PMID:40738110
      - PMID:29025729
  - claim_id: ligilactobacillus-refutation
    statement: >-
      A protective Lactiplantibacillus strain does not refute a
      Ligilactobacillus source claim.
    disposition: REJECTED
    report_quote: "Contradicted sub-claim:"
    rationale: >-
      PMID:41543328 studies Lactiplantibacillus plantarum NXU0014 and broad
      legacy Lactobacillus abundance, not the Ligilactobacillus taxon observed
      in PMID:42300615. PMID:32293557 establishes Lactiplantibacillus and
      Ligilactobacillus as distinct genera after reclassification of the former
      broad Lactobacillus genus. A protective strain also cannot exclude a
      condition-dependent harmful strain. The Ligilactobacillus source remains
      unconfirmed, not contradicted.
    citations:
      - PMID:32293557
      - PMID:41543328
      - PMID:42300615
  - claim_id: fmt-direction
    statement: The cited FMT experiment transmitted susceptibility to ALD.
    disposition: REJECTED
    report_quote: FMT transmits susceptibility
    rationale: >-
      PMID:27890791 transplanted microbiota from alcohol-resistant donors into
      alcohol-sensitive recipients and prevented steatosis, inflammation, and
      gut-homeostasis disruption. It supports the narrower claim that
      microbiota manipulation can modify ALD susceptibility in mice; it did not
      perform the asserted susceptible-donor transfer or show microbiota alone
      causing ALD.
    citations:
      - PMID:27890791
  - claim_id: cross-disease-lactylation-bookend
    statement: >-
      Lactate-dependent lactylation is causally implicated in metabolic liver
      injury, but this is external plausibility rather than direct support for
      the Baijiu/ALD chain.
    disposition: QUALIFIED
    report_quote: >-
      Lactate/lactylation is a **causally validated** driver of metabolic liver
      injury
    rationale: >-
      PMID:41329453 and PMID:42499162 support causal lactylation mechanisms in
      MAFLD/MASH models, not alcohol-associated disease, gut-derived lactate, or
      Baijiu-extract treatment. PMID:41479511 explicitly states that direct
      histone-lactylation evidence in alcoholic steatohepatitis had not been
      reported. Calling this a causal bookend risks stitching different
      diseases and lactate sources into apparent support for an untested chain.
    citations:
      - PMID:41329453
      - PMID:42499162
      - PMID:41479511
  - claim_id: severe-ald-lactate-mechanism
    statement: >-
      The cited severe-ALD cohort establishes impaired clearance or
      hypoperfusion as the explanation for elevated lactate.
    disposition: REJECTED
    report_quote: >-
      most parsimoniously explained by impaired hepatic clearance/hypoperfusion
    rationale: >-
      PMID:41137971 is an observational prognostic study of alcohol-related
      acute-on-chronic liver failure. It reports an association between serum
      lactate and 90-day mortality, but does not determine lactate source,
      clearance, hypoperfusion, or causal direction. Reverse causation is a
      reasonable possibility, not a mechanism established by this citation.
    citations:
      - PMID:41137971
  - claim_id: universal-no-safe-dose
    statement: The cited human studies establish that no alcohol dose is safe.
    disposition: REJECTED
    report_quote: no safe alcohol dose
    rationale: >-
      PMID:32135583 says the safe level is unclear and finds higher risk for
      consumption above its low-level category. PMID:38971533 reports increased
      fibrosis risk and no safe daily limit specifically among people with
      unhealthy metabolic status and MASLD. These sources support caution
      against human benefit extrapolation, but not the universal claim used in
      the report.
    citations:
      - PMID:32135583
      - PMID:38971533
  - claim_id: omitted-close-alternatives
    statement: >-
      Strong competing mediators remain unexcluded, but the report omits two
      especially close primary studies of non-ethanol beverage components.
    disposition: QUALIFIED
    report_quote: stronger competing mediators remain unexcluded
    rationale: >-
      PMID:39661730 shows that ethyl lactate, a non-ethanol distilled-liquor
      constituent, protects in alcohol-associated liver-disease mouse models
      through a hepatocyte SIRT1-FGF21 mechanism. PMID:41606891 compares Baijiu
      with ethanol, finds bile-acid differences, shows deoxycholic-acid
      supplementation aggravating ethanol-induced barrier disruption, and
      reports protection by a non-alcoholic Baijiu-component formula. Both were
      available before the report's search date and are closer to the
      intervention and disease context than several cited cross-disease papers.
      They do not disprove lactate mediation, but materially change the
      alternative-model ranking and expose search incompleteness.
    citations:
      - PMID:39661730
      - PMID:41606891
  - claim_id: ontology-candidate-mappings
    statement: The proposed GO mappings are curation-ready candidates.
    disposition: REJECTED
    report_quote: >-
      Processes: response to oxidative stress (GO:0006979), NAD metabolic
      process (GO:0019674), protein lactylation (GO:0140838 / histone
      lactylation), lipopolysaccharide-mediated signaling / TLR4 (GO:0034142),
      aryl hydrocarbon receptor signaling (GO:0140986), lactate metabolic
      process (GO:0006089-adjacent).
    rationale: >-
      GO:0140838 labels RNA polymerase II CTD heptapeptide repeat
      peptidyl-prolyl isomerase activity, not protein lactylation. GO:0140986
      labels G protein-coupled chemorepellent receptor signaling pathway, not
      aryl hydrocarbon receptor signaling. GO:0019674 is NAD+ metabolic process,
      GO:0034142 is toll-like receptor 4 signaling pathway, and GO:0006089 is
      exactly lactate metabolic process rather than an adjacent identifier.
      The valid cell-type mappings do not rescue these process-term errors.
  - claim_id: human-benefit-scope
    statement: The mouse extract comparison does not imply that Baijiu benefits humans.
    disposition: RETAINED
    report_quote: >-
      this does **not** imply human Baijiu benefit
    rationale: >-
      PMID:42300615 reports a mouse and cell-study comparison of a non-ethanol
      extract against ethanol exposure. It provides no clinical efficacy,
      safety, dose, or net beverage-effect evidence in humans. The report's
      explicit scope boundary is necessary and correct.
    citations:
      - PMID:42300615

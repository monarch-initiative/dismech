claims:
- claim_id: abcd1-loss-to-vlcfa-accumulation-established
  statement: >-
    The upstream arm of the hypothesis — ABCD1 loss of function disabling
    peroxisomal import and beta-oxidation of VLCFA-CoA esters, producing VLCFA
    accumulation — is definitively established.
  disposition: RETAINED
  report_quote: >-
    The causal chain from ABCD1 mutation through VLCFA accumulation is
    definitively established by convergent cryo-EM structural biology, human
    genetics, biochemical assays, and therapeutic proof-of-concept from gene
    therapy.
  rationale: >-
    Verified against the cited structural work. PMID:36810450 reports six
    cryo-EM structures in four conformational states and shows that C26:0-CoA
    binds the transmembrane domains and stimulates NBD ATPase activity, while
    neither free C26:0 nor acetyl-CoA does. PMID:22483867 and PMID:38034003
    independently state that ALDP deficiency impairs peroxisomal beta-oxidation
    of VLCFA with accumulation in plasma and tissues. This is also the KB seed,
    so the report adds molecular-level corroboration rather than a new claim.
  citations:
  - PMID:36810450
  - PMID:22483867
  - PMID:38034003
- claim_id: elovl1-dual-accumulation-mechanism
  statement: >-
    ABCD1 deficiency raises VLCFA by two routes at once: reduced peroxisomal
    catabolism and increased ELOVL1-mediated chain elongation.
  disposition: RETAINED
  report_quote: >-
    ABCD1 deficiency not only impairs VLCFA degradation but also facilitates
    further chain elongation by ELOVL1, creating a dual accumulation mechanism
    — reduced catabolism coupled with enhanced synthesis
  rationale: >-
    Faithful to the cited source. PMID:22483867 states that ALDP deficiency
    impairs the peroxisomal beta-oxidation of VLCFA and facilitates their
    further chain elongation by ELOVL1, resulting in accumulation in plasma and
    tissues. This is a real gap in the KB entry, whose VLCFA-accumulation node
    attributed the buildup to defective degradation alone.
  citations:
  - PMID:22483867
- claim_id: missense-variants-degraded-by-proteasome
  statement: >-
    Most ABCD1 missense variants are cleared by the proteasome rather than
    producing a catalytically inert transporter, so protein instability is the
    predominant molecular consequence.
  disposition: RETAINED
  report_quote: >-
    Most ABCD1 missense mutations result in rapid proteasomal degradation of
    the protein before or after targeting to peroxisomes
  rationale: >-
    Reproduces PMID:21039332 almost word for word and the source says exactly
    this. Independently corroborated by PMID:36810450, which reports that
    roughly 65% of ABCD1 variants affect protein folding and stability with a
    marked reduction of ALDP in the peroxisomal membrane, and names G277R,
    R280C, and Y296C as variants that do not reduce ALDP levels.
  citations:
  - PMID:21039332
  - PMID:36810450
- claim_id: vlcfa-necessary-not-sufficient
  statement: >-
    VLCFA accumulation is necessary but not sufficient for cerebral inflammatory
    demyelination; no genotype-phenotype correlation exists and the determinants
    of conversion are unknown.
  disposition: RETAINED
  report_quote: >-
    No genotype-phenotype correlation exists in X-ALD
  rationale: >-
    This is the report's single most useful contribution and it holds up in
    three independent sources. PMID:25999754 states that the molecular basis for
    the heterogeneity of clinical symptoms is still largely unresolved as no
    correlation between genotype and phenotype exists in X-ALD. PMID:22483867
    says the same and adds that environmental factors and a multitude of
    modifying genes appear to determine clinical manifestation in this
    monogenetic but multifactorial disease. PMID:34716609 describes the
    phenotypic range from cerebral disease to isolated adrenal insufficiency as
    occurring without genotype-phenotype correlation. The supporting
    monozygotic-twin discordance report (PMID:9629856) is real but its abstract
    is not retrievable, and one twin pair does not prove non-genetic causation
    the way the report's wording implies.
  citations:
  - PMID:25999754
  - PMID:22483867
  - PMID:34716609
  - PMID:9629856
- claim_id: cerebral-conversion-fraction
  statement: >-
    Only about 35 to 40 percent of males with an ABCD1 variant develop cerebral
    ALD.
  disposition: QUALIFIED
  report_quote: >-
    All patients accumulate VLCFA, but only approximately 35–40% of males
    develop cerebral ALD
  rationale: >-
    The figure is review-derived and age-dependent, and the report presents
    conflicting numbers without reconciling them. Its own Danish national cohort
    citation (PMID:41166774) reports 44% of males having developed cerebral ALD
    by age 60, and PMID:39467011 opens by stating that more than half of males
    with an ABCD1 mutation develop inflammatory cerebral demyelination. The
    qualitative point — that conversion is partial and unpredictable — survives;
    the specific band should not be quoted as settled, and any KB use needs the
    cohort and the age ceiling attached.
  citations:
  - PMID:41166774
  - PMID:39467011
- claim_id: vlcfa-level-does-not-predict-phenotype
  statement: >-
    Measured VLCFA levels do not correlate with phenotype severity.
  disposition: QUALIFIED
  report_quote: >-
    VLCFA levels in plasma and fibroblasts do not correlate with phenotype
    severity
  rationale: >-
    The prose is accurate and the compartment qualifier is what makes it so, but
    the report's own evidence matrix restates the same citation as the
    unrestricted claim that there is no correlation between VLCFA and phenotype.
    PMID:15800013 says both halves: no correlation with VLCFA in plasma and
    fibroblasts, and, as its own headline result, that accumulation of saturated
    VLCFA in normal-appearing white matter correlates with ALD phenotype.
    Dropping the compartment inverts the paper's finding. The matrix also grades
    this post-mortem tissue and expression study as human clinical. Usable in
    the KB only with the plasma and fibroblast restriction stated.
  citations:
  - PMID:15800013
- claim_id: no-animal-model-of-spontaneous-cerebral-demyelination
  statement: >-
    No animal model of X-ALD spontaneously develops cerebral leukocyte invasion
    and inflammatory demyelination despite reproducing VLCFA accumulation.
  disposition: RETAINED
  report_quote: >-
    cerebral invasion of leukocytes and demyelination were not observed in any
    animal model for X-ALD, reflecting upon pathological processes that are yet
    to be discovered
  rationale: >-
    Copied verbatim from PMID:34716609, which is a review of the animal-model
    literature and states this as its central negative finding while noting that
    the models do reproduce VLCFA accumulation, mitochondrial ROS, oxidative
    damage, glial death, and axonal damage. Consistent with PMID:39467011, which
    had to combine cuprizone and experimental autoimmune encephalomyelitis on an
    Abcd1-knockout background — an artificial two-hit immune provocation — to
    obtain a cerebral phenotype at all. This is a human-model mismatch rather
    than a plain evidence gap and the KB entry had no record of it.
  citations:
  - PMID:34716609
  - PMID:39467011
- claim_id: adrenal-pathway-distinct-and-uncorrected-by-transplant
  statement: >-
    Adrenal insufficiency runs through a pathway distinct from the
    neuroinflammatory cascade, as shown by HSCT and gene therapy failing to
    correct adrenal dysfunction.
  disposition: QUALIFIED
  report_quote: >-
    and operates through a pathway distinct from the neuroinflammatory cascade,
    as demonstrated by the failure of HSCT/gene therapy to correct adrenal
    dysfunction.
  rationale: >-
    The clinical observation is real but the report upgrades absence of evidence
    into demonstration. PMID:38034003 states that there are no long-term
    observational studies after HCT and no evidence so far that HCT can change
    the course of primary adrenal insufficiency, that all HCT-treated patients
    with pre-existing insufficiency had to continue glucocorticoid replacement,
    and that no cases of reversed insufficiency have been reported after gene
    therapy. That is a well-supported negative clinical record, not a
    demonstrated mechanistic dissociation, and the same review explicitly leaves
    open that transplant might restore adrenal function by delivering functional
    genes to the adrenal glands. The report's separate assertion that no
    detailed mechanistic studies of adrenocortical apoptosis were found also
    overstates: the same review describes cholesterol and saturated VLCFA
    accumulating in the zona fasciculata and reticularis from foetal life and
    triggering early apoptosis of adrenal cortical cells with irreversible
    cortical shrinkage.
  citations:
  - PMID:38034003
- claim_id: adrenal-pathogenesis-still-unclear
  statement: >-
    The molecular mechanism linking VLCFA accumulation to adrenocortical
    insufficiency remains unresolved, which matters because roughly 70 percent
    of affected males develop primary adrenal insufficiency.
  disposition: RETAINED
  report_quote: >-
    No detailed mechanistic studies of adrenocortical apoptosis pathways were
    identified.
  rationale: >-
    Directionally correct and worth curating as a gap even though the wording is
    absolute. PMID:38034003 states outright that the pathogenesis of X-ALD
    related primary adrenal insufficiency is still unclear, gives the 70% figure
    in ALD and AMN patients against 5% in female carriers, and says the
    mechanisms by which elevated VLCFAs damage adrenal and testicular
    steroid-producing cells are not fully understood. The Danish cohort puts
    adrenal insufficiency at 44% of males by age 60 (PMID:41166774), so the 70%
    prevalence figure is itself cohort-dependent.
  citations:
  - PMID:38034003
  - PMID:41166774
- claim_id: lysosomal-cholesterol-adrenal-model
  statement: >-
    Lysosomal cholesterol trapping is a testable mechanism for adrenal failure,
    with 2-hydroxypropyl-beta-cyclodextrin rescuing adrenocortical hormone
    levels in Abcd1-knockout mice.
  disposition: QUALIFIED
  report_quote: >-
    plasma levels of adrenocortical hormones were increased and the behavioral
    abnormalities were greatly ameliorated upon HPCD administration
  rationale: >-
    The quotation is exact and PMID:36971991 supports it, including reduced
    cholesterol and VLCFA sequestration in brain and adrenal cortex after HPCD
    injection in Abcd1-knockout mice. Two caveats the report does not carry. The
    cellular arm used siRNA knockdown of fifteen peroxisomal-disorder genes in
    cultured cells rather than patient material, and the paper's own claim is
    that defective cholesterol transport underlies most peroxisomal disorders —
    it is not specific to ALD adrenal biology. A single study with a
    pharmacological rescue in one mouse model is a lead, not an established
    mechanism, and should enter the KB labelled as such.
  citations:
  - PMID:36971991
- claim_id: saturated-vlcfa-specific-toxicity
  statement: >-
    Toxicity tracks saturation status, not chain length alone: saturated VLCFAs
    cause ER stress while monounsaturated VLCFAs do not, and rerouting through
    SCD1 is therapeutically tractable.
  disposition: RETAINED
  report_quote: >-
    Importantly, saturated VLCFAs caused ER stress in ALD fibroblasts, whereas
    monounsaturated VLCFA did not
  rationale: >-
    Verbatim from the PMID:33690217 abstract, and the surrounding claims check
    out too: chloroquine raised scd1 expression and lowered saturated VLCFA,
    SCD1 inhibition raised saturated VLCFA, CRISPR scd1 knockout in zebrafish
    reproduced the ALD motor phenotype, and LXR agonists shifted the saturation
    ratio in Abcd1-null mice. This is a real refinement of the KB's undifferentiated
    VLCFA node and explains why total VLCFA is a poor phenotype predictor.
  citations:
  - PMID:33690217
- claim_id: cd1-cd8-cytolysis-of-oligodendrocytes
  statement: >-
    CD8 cytotoxic T cells infiltrate morphologically normal white matter in
    early cerebral lesions and kill oligodendrocytes by cytolysis rather than
    apoptosis, with CD1-mediated lipid antigen presentation proposed as the
    trigger.
  disposition: QUALIFIED
  report_quote: >-
    cytolysis of oligodendrocytes, rather than apoptosis, appears to be the
    major mode of oligodendrocytic death
  rationale: >-
    Exact quotation from PMID:11589421, whose immunohistochemical and TUNEL
    analysis of staged lesions found most infiltrating lymphocytes to be CD8
    cytotoxic T cells in unaffected white matter, few caspase-3-positive
    oligodendrocytes, and CD1 molecules present. Qualified on two grounds: it is
    a 2001 morphological autopsy study with no cohort denominator given in the
    abstract, and the CD1 arm is explicitly a proposal — the paper says
    presentation of lipid antigens may be a key pathogenetic element. The report
    is consistent with this, listing the unconfirmed CD1-VLCFA-phosphatidylcholine
    antigen link as its own Gap 5.
  citations:
  - PMID:11589421
- claim_id: 25hc-nlrp3-parallel-pathway
  statement: >-
    25-hydroxycholesterol rather than VLCFA itself activates the NLRP3
    inflammasome in the cerebral ALD context, driving microglial recruitment and
    oligodendrocyte death.
  disposition: RETAINED
  report_quote: >-
    25-hydroxycholesterol (a sterol metabolite), not VLCFA directly,
  rationale: >-
    PMID:27779191 supports the discriminating detail. It reports aberrant CH25H
    and 25-HC production in patient iPSC and fibroblast material, that 25-HC but
    not VLCFA promotes NLRP3 inflammasome assembly through potassium efflux,
    mitochondrial ROS, and LXR pathways, and that stereotaxic 25-HC injection
    into mouse corpus callosum induces microglial recruitment, IL-1-beta
    production, and oligodendrocyte death NLRP3-dependently. This is a parallel
    downstream branch rather than a competitor to the seed hypothesis, since
    25-HC production is still downstream of ABCD1 loss.
  citations:
  - PMID:27779191
- claim_id: macrophage-cd36-jnk-priming
  statement: >-
    Saturated VLCFAs prime macrophages for inflammation through CD36-mediated
    uptake and JNK signalling rather than through toll-like receptors.
  disposition: RETAINED
  report_quote: >-
    VLCFAs provoke pro-inflammatory responses through scavenger receptor
    CD36-mediated uptake
  rationale: >-
    PMID:36528616 states this and adds the negative control the report omits:
    externally added VLCFAs did not activate toll-like receptors in primary
    macrophages, so the CD36 route is a specific finding rather than generic
    lipid-driven inflammation. The paper also reports that ABCD1 deficiency
    prolongs pro-inflammatory gene expression after LPS, which is a
    cell-autonomous myeloid mechanism consistent with why hematopoietic
    correction works.
  citations:
  - PMID:36528616
- claim_id: ferroptosis-in-cald
  statement: >-
    Iron accumulation, myelin peroxidation, and raised ACSL4 in cerebral ALD
    lesions implicate ferroptosis in pathogenesis.
  disposition: QUALIFIED
  report_quote: >-
    This is a single 2026 study requiring independent replication.
  rationale: >-
    The report grades its own claim correctly, which is why this is qualified
    rather than rejected. PMID:41732993 is real and its concluding sentence is
    quoted exactly, but the abstract is 752 characters, reports a first
    application of quantitative susceptibility mapping source separation, and
    frames ferroptosis as implicated rather than demonstrated. There is no
    intervention arm and no replication. Appropriate for a knowledge-gap or
    emerging-hypothesis record, not for a pathograph node with a causal edge.
  citations:
  - PMID:41732993
- claim_id: nfl-pretreatment-thresholds
  statement: >-
    Pre-treatment plasma NfL stratifies outcome after HSCT or gene therapy, with
    a low threshold predicting stabilization and a high threshold predicting
    major progression independent of Loes score.
  disposition: RETAINED
  report_quote: >-
    Pre-treatment NfL ≤113 pg/mL correlates with cALD stabilization after
    HSCT/gene therapy; NfL >243 pg/mL associates with major progression
    irrespective of baseline Loes score
  rationale: >-
    Both thresholds and their directions match the PMID:41862589 abstract
    exactly, including the qualifier that GFAP does not stratify outcome the way
    NfL does. The one thing the report drops is scale: this is a retrospective
    cohort of 14 paediatric patients aged 5 to 13 monitored for up to 5.5 years,
    so the thresholds are provisional. It complements, rather than duplicates,
    the PMID:37683329 diagnostic cut-off already curated in the KB.
  citations:
  - PMID:41862589
- claim_id: nfl-outperforms-loes-quotation
  statement: >-
    A sentence stating that NfL has prognostic value for treatment response,
    surpassing traditional MRI-based Loes scoring in some contexts, is presented
    in quotation marks as text from PMID:41862589.
  disposition: REJECTED
  report_quote: >-
    NfL has prognostic value for treatment response, surpassing traditional
    MRI-based Loes scoring in some contexts
  rationale: >-
    That sentence does not appear in PMID:41862589. Searching the full text
    returns no occurrence of "surpassing". What the paper actually says is
    narrower and countable: in three boys with atypical lesions or advanced
    disease, NfL outperforms Loes-scoring in predicting outcome. Presenting a
    paraphrase inside quotation marks is the failure mode the KB snippet rule
    exists to catch, and it is why no snippet may be lifted out of this report
    without re-deriving it from the reference cache. The underlying finding is
    real in its narrower form and is captured separately under
    nfl-pretreatment-thresholds.
  citations:
  - PMID:41862589
- claim_id: retain-canonical-status
  statement: >-
    The hypothesis should keep CANONICAL status, with the downstream
    qualifications annotated rather than expressed as a status change.
  disposition: RETAINED
  report_quote: >-
    We recommend maintaining **CANONICAL status** with annotated qualifications
    reflecting this downstream complexity
  rationale: >-
    Correct, and the KB already implements it. The gene-disease relationship is
    ClinGen Definitive and the qualifications all concern downstream mechanistic
    detail rather than the core causal claim. The entry's mechanistic_hypotheses
    block already carries status CANONICAL with a long notes field summarizing
    this report, so no status edit is warranted. The gap this leaves is that the
    notes assert the qualifications without citing anything, which is what the
    integration addresses.
  citations:
  - PMID:25999754
- claim_id: databases-not-queried
  statement: >-
    The run did not directly query GenCC, ClinGen, or ClinVar, and its
    variant-level statements come from published literature.
  disposition: RETAINED
  report_quote: >-
    GenCC, ClinGen, ClinVar databases were not directly queried; variant-level
    pathogenicity assessments derive from published literature.
  rationale: >-
    An accurate self-disclosure and the correct basis for classifying all three
    as CITED_NOT_ACCESSED. It also means the report contributes nothing at the
    variant level, so no variant, allele-frequency, or pathogenicity assertion
    from it should reach the KB. The report is a literature synthesis with no
    original data analysis, which it states plainly in its limitations.

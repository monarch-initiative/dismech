- analysis_id: literature_evidence_matrix
  status: REPORTED_ONLY
  auditability: UNVERIFIABLE
  method: >-
    Iterative literature triage and manual construction of a 44-row evidence
    matrix, a tiered causal-chain diagram, an alternative-models table, and a
    per-claim evidence-status table.
  comparison: >-
    Each catalogued paper classified as supporting, qualifying, or competing
    with the seed hypothesis, then aggregated into three tiers of evidence
    strength.
  input_data_source_ids:
  - pubmed
  status_reason: >-
    No code, query set, intermediate table, or output file is committed with
    this run; there is no openscientist_artifacts directory. The counts the
    report reports about itself (120 papers, 18 confirmed findings, 54
    evidence rows, 5 iterations) cannot be checked, and the row-level
    classifications cannot be regenerated.
  limitations: >-
    The classification of each row is a judgement rather than a computation,
    so even a committed table would not make it reproducible in the strict
    sense. Spot-checking found the row-level summaries less reliable than the
    surrounding prose, which is the failure mode a committed matrix would
    have made auditable.

source_report: ../openscientist.md
hypothesis_id: rpp40_rnase_p_pretrna_mtor_myc_bridge
assessed_at: "2026-07-29T20:08:05Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report reaches the defensible conclusion that the RNase-P/pre-tRNA bridge
  remains weakly supported and unresolved, and its time-resolved
  branch-discrimination strategy is useful. Its literature adjudication is not
  reliable without correction, however: it misses both a separate
  RPP40-rRNA/ribosomal-gene HCC study and the strongest rapid RPP40-versus-RPP21
  depletion study, overreads Rpp14-mediated degradation of an already excised
  leader as a refutation of RPP40 holoenzyme function, and overstates what
  pan-cancer essentiality and canonical mTOR/MYC directionality establish.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: central-bridge-remains-unresolved
    statement: >-
      No available HCC study establishes the proposed RNase-P-specific
      pre-tRNA-to-mTOR/MYC temporal bridge.
    disposition: RETAINED
    report_quote: >-
      All mechanistic specificity in the seed hypothesis is currently
      *inferred*, not *demonstrated*.
    rationale: >-
      PMID:42424930 supports the flanking RPP40 phenotype and mTOR/MYC
      association, while PMID:40517827 supports a competing
      rRNA/ribosomal-gene route. Neither demonstrates that a pre-tRNA defect
      precedes mTOR/MYC decline in HCC or that RNase-P-specific loss phenocopies
      RPP40 loss.
    citations:
      - PMID:42424930
      - PMID:40517827
  - claim_id: single-primary-study-claim
    statement: >-
      The report's assertion that the primary evidence base consists of only
      the 2026 mTOR/MYC paper is false.
    disposition: REJECTED
    report_quote: >-
      The entire primary-evidence base is one 2026 paper (PMID:42424930)
    rationale: >-
      PMID:40517827 is a separate 2025 primary HCC study of RPP40,
      pre-rRNA/ribosomal-gene transcription, and malignant phenotypes.
      PMID:40533478 is a 2025 primary human-cell study directly comparing rapid
      depletion of shared-subunit RPP40 with RNase-P-specific RPP21. These
      papers do not prove the seed bridge, but they materially change the
      evidence landscape.
    citations:
      - PMID:40517827
      - PMID:40533478
      - PMID:42424930
  - claim_id: hcc-rpp40-rrna-source-absence
    statement: >-
      The report's claimed search absence for a distinct RPP40-rRNA HCC source
      is demonstrably incorrect.
    disposition: REJECTED
    report_quote: RPP40+rRNA+HCC returned no hits
    rationale: >-
      PMID:40517827 is titled "Ribonuclease P/MRP subunit RPP40 coordinates the
      transcription of pre-rRNA and ribosomal protein genes to promote
      Hepatocellular carcinoma malignancy." Its abstract directly reports
      coordinated ribosomal-RNA and ribosomal-gene expression in HCC cells.
    citations:
      - PMID:40517827
  - claim_id: shared-subunit-confounding
    statement: >-
      RPP40 perturbation is not RNase-P-specific, but the magnitude and timing
      of effects on both complexes must be measured rather than assumed.
    disposition: QUALIFIED
    report_quote: >-
      An RPP40 gain/loss experiment therefore perturbs pre-tRNA maturation
      (RNase P) **and** pre-rRNA/ribosome biogenesis (RNase MRP) at once.
    rationale: >-
      Shared membership alone does not prove that every gain/loss design
      perturbs both branches equally. Strong direct support now exists in
      HEK293T cells: rapid RPP40 degradation reduced both catalytic RNAs and
      accumulated both pre-tRNA and pre-rRNA intermediates
      (PMID:40533478). The HCC seed study did not report those branch-specific
      readouts, so its RPP40 phenotype remains confounded rather than assigned
      to either branch.
    citations:
      - PMID:16723659
      - PMID:40533478
  - claim_id: rpp14-leader-degradation-overreach
    statement: >-
      Rpp14-mediated degradation of an excised leader does not refute an
      RPP40 contribution to RNase-P holoenzyme-dependent pre-tRNA cleavage.
    disposition: REJECTED
    report_quote: >-
      an RPP40 perturbation cannot cleanly isolate "RNase-P 5' pre-tRNA
      maturation" even in principle.
    rationale: >-
      PMID:37831743 distinguishes RNase P cleavage of precursor tRNA from
      Rpp14's exonucleolytic degradation of the leader after excision. More
      directly, rapid RPP40 degradation causes accumulation of
      5-prime-leader-containing pre-tRNAs (PMID:40533478). RPP40 need not be the
      catalytic nuclease to contribute to holoenzyme integrity and cleavage.
      RPP40 loss still cannot distinguish RNase P from RNase MRP by itself, but
      the report's Rpp14 argument is mechanistically invalid.
    citations:
      - PMID:37831743
      - PMID:40533478
  - claim_id: canonical-directionality
    statement: >-
      Canonical mTOR/MYC-to-RNA-biogenesis regulation is a valid competing
      direction, not evidence that reciprocal RNA-processing-to-signaling
      feedback cannot occur.
    disposition: QUALIFIED
    report_quote: >-
      The seed hypothesis inverts this (RNA processing upstream, sustaining
      mTOR/MYC).
    rationale: >-
      Primary HCC evidence places mTORC1 upstream of the ribosome-biogenesis
      factor HEATR1 (PMID:37247644), so reciprocal perturbation is essential.
      That direction does not by itself exclude a feedback loop in which loss
      of RNA-processing capacity secondarily reduces mTOR/MYC output. Temporal
      and epistasis experiments are needed.
    citations:
      - PMID:37247644
      - PMID:42424930
  - claim_id: pan-essentiality-parsimony
    statement: >-
      Pan-cancer essentiality supports a nonselective-dependency alternative,
      but it does not establish that the HCC association is merely a generic
      proliferation correlate.
    disposition: QUALIFIED
    report_quote: >-
      The identical "RPP40↑ → worse prognosis → proliferation" pattern across
      many cancers indicates the HCC observation is a **generic correlate of
      the proliferative state**, not an HCC-specific RNase-P/pre-tRNA
      mechanism.
    rationale: >-
      PMID:41933259 reanalyzes DepMap and supports broad cancer-cell
      essentiality, cross-cancer overexpression, and a plausible cell-cycle
      association. It does not establish causal ordering or make RPP40 a
      passenger. Its own CancerSEA analysis reports that the expression-to-cell
      cycle correlation was not significant in LIHC, specifically weakening
      extrapolation of that result to HCC.
    citations:
      - PMID:41933259
  - claim_id: branch-specific-perturbation-handles
    statement: >-
      The proposed branch comparison is useful after replacing ambiguous
      subunits with experimentally established complex-specific handles.
    disposition: QUALIFIED
    report_quote: >-
      knock down P-specific POP4/RPP21 vs MRP-specific RPP24/RPP64
    rationale: >-
      RPP21 is the established RNase-P-specific protein handle. C18orf21/RMP24
      and NEPRO/RMP64 are RNase-MRP-specific handles
      (PMID:40413743; PMID:41136609). POP4/RPP29 has been described as shared or
      preferentially RNase-P-associated, not as the clean unique subunit used by
      these current studies. The current names are RMP24 and RMP64, not RPP24
      and RPP64.
    citations:
      - PMID:16723659
      - PMID:40413743
      - PMID:41136609
  - claim_id: time-resolved-discriminator
    statement: >-
      Early, time-resolved processing, translation, and signaling measurements
      are an appropriate way to test the proposed causal order.
    disposition: RETAINED
    report_quote: >-
      Time-course (0–72 h) of acute RPP40 degron depletion; joint measurement
      of pre-tRNA maturation, polysome/translation, and mTOR/MYC activity
    rationale: >-
      This design directly addresses the missing temporal edge. It should use
      RPP21 versus C18orf21/RMP24 or NEPRO/RMP64, include a matched combined
      RNase-P-plus-RNase-MRP perturbation, and sample before generalized
      translation failure or cell-cycle arrest. PMID:40533478 provides a strong
      non-HCC precedent for the required early processing time course.
    citations:
      - PMID:40533478
      - PMID:41136609

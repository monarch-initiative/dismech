claims:
  - claim_id: ifn-signature-marks-sle-presence
    statement: >-
      The blood type I interferon signature is strongly elevated in pediatric
      SLE compared with healthy children.
    disposition: RETAINED
    report_quote: >-
      The six-gene interferon composite (**IFN6_SCORE** = mean per-gene z-score of IFI27, IFI44L, IFIT1, ISG15, RSAD2, SIGLEC1, z-referenced to healthy first-visit samples) **massively separates SLE from healthy controls**
    rationale: >-
      Reproduced exactly (d = 2.18, q about 1.9e-27; every gene q < 1e-9). It
      agrees with the discovery paper, which confirmed "a prevalent IFN
      signature" in this cohort (PMID:27040498). Being a re-analysis of that
      cohort, it adds reproducibility rather than independent support.
    citations:
      - PMID:27040498
    analysis_ids:
      - gse65391-first-visit-contrasts
  - claim_id: ifn-signature-tracks-global-activity
    statement: >-
      Within SLE at first visit, the interferon score is higher with SLEDAI >= 6
      and correlates positively with SLEDAI and inversely with C3 and C4.
    disposition: RETAINED
    report_quote: >-
      The IFN signature therefore scales with clinical disease activity, not merely with the binary presence of disease.
    rationale: >-
      Reproduced (d = 0.89, q about 9.9e-6; rho with SLEDAI +0.44, with C3
      -0.34, with C4 -0.35). This is cross-sectional between patients. The
      discovery paper's mixed models across repeated visits named the
      plasmablast signature, not interferon, "the most robust biomarker of DA"
      (PMID:27040498); the two are compatible, since a between-patient
      association does not imply that interferon tracks activity within a
      patient over time.
    citations:
      - PMID:27040498
    analysis_ids:
      - gse65391-first-visit-contrasts
  - claim_id: ifn-does-not-mark-nephritis
    statement: >-
      The blood interferon signature does not distinguish biopsy-proven
      nephritis from non-nephritis SLE, so it indexes activity rather than
      renal tissue injury.
    disposition: REJECTED
    report_quote: >-
      Crucially, the IFN signature **does NOT distinguish biopsy-proven nephritis from non-nephritis SLE** at first visit
    rationale: >-
      The null depends on the comparator. The pooled comparator is 53 percent
      unbiopsied patients, 55 of 59 of them SLEDAI >= 6, which is why its mean
      interferon score is high. Against biopsy-confirmed NoLN, nephritis
      patients have a higher score (d = 0.57, q = 0.026 in the assessor's
      sensitivity table), which the provider also found and still did not
      carry into its conclusion. Neither direction can be read as renal
      specificity: nephritis patients are almost all highly active, and in the
      activity-matched stratum there are only 7 NoLN patients (d = 0.23,
      p = 0.62, uninformative). The supportable statement is that this cohort
      cannot separate nephritis from global activity cross-sectionally.
    analysis_ids:
      - gse65391-first-visit-contrasts
      - provider-nephritis-sensitivity
  - claim_id: plasmablast-severity-axis
    statement: >-
      The plasmablast genes form a severity or tissue-injury signature distinct
      from the interferon activity signature, and better track renal severity.
    disposition: REJECTED
    report_quote: >-
      Renal severity appears to be better tracked by the plasmablast/plasma-cell axis and by complement consumption.
    rationale: >-
      The provider's own data contradict this. JCHAIN, MZB1 and TNFRSF17 show
      no nephritis difference in the prespecified contrast (|d| <= 0.06) or
      against biopsy-confirmed NoLN (d 0.09 to 0.21, all q > 0.4). Their
      stronger inverse correlation with C3 and C4 is a complement-consumption
      association, not a renal one. The supporting quote from PMID:31167757 is
      real ("a 'severity signature' best illustrated in active nephritis,
      enriched in druggable granulocyte and plasmablast/plasma-cell pathways"),
      but it comes from a different, adult cohort and does not make this
      dataset show the same thing.
    citations:
      - PMID:31167757
    analysis_ids:
      - gse65391-first-visit-contrasts
  - claim_id: kidney-ifn-is-local
    statement: >-
      A single-cell study of lupus nephritis kidneys found an interferon
      response in most cells, alongside local B-cell activation.
    disposition: RETAINED
    report_quote: >-
      "a clear interferon response was observed in most cells"
    rationale: >-
      Verified against the cached abstract of PMID:31209404. The same abstract
      says "interferon response is mainly an extrarenal process", which the
      provider did not mention. Neither sentence is tested by a blood dataset.
      It is context for the hypothesis's local-injury arm, not evidence from
      this run.
    citations:
      - PMID:31209404
  - claim_id: activity-vs-nephritis-not-separable
    statement: >-
      In this cohort, nephritis and high global disease activity are nearly
      collinear at first visit, so a cross-sectional blood analysis cannot test
      whether renal injury depends on more than systemic interferon activity.
    disposition: QUALIFIED
    report_quote: >-
      The prespecified null (d = 0.22) is therefore a conservative estimate conditioned on a heterogeneous comparator, not evidence that IFN is unrelated to renal injury.
    rationale: >-
      The provider acknowledges the comparator problem in its limitations but
      not the collinearity with SLEDAI. The assessor's crosstab from
      samples.csv: nephritis 32 of 33 SLEDAI >= 6; NoLN 7 of 66 SLEDAI >= 6.
      Testing the hypothesis's local-selection claim needs a within-patient
      longitudinal model (the cohort has repeated visits and biopsy timing) or
      tissue data, not another first-visit contrast.
    analysis_ids:
      - gse65391-first-visit-contrasts

      analysis.py and environment.txt (client extension allowlist); they were
      restored from provider job 90f1de29-fb10-4734-bc54-35771bfb91d7's
      artifacts zip, and nine flattened duplicates were removed after
      byte-identity checks. The assessor then changed manifest metadata only:
      added provider, converted inputs from a mapping to a list with
      identifier/canonical_url/retrieved_at/local_path duplicates, and moved
      the byte-identical replay outputs from replay/output/ to replay/ with
      matching replay.assets paths and command. The provider manifest sha256
      before correction is recorded in assessor_corrections. No input, code
      or output bytes changed, so the status stays SUCCEEDED.
    limitations: >-
      Cross-sectional, first visit only; the longitudinal structure the cohort
      was built for is unused. The nephritis comparator mixes biopsy-confirmed
      no-nephritis with unbiopsied patients who are mostly highly active, and
      nephritis_class is a patient-level biopsy history, not a flag for renal
      activity at that visit. Nephritis and high SLEDAI are nearly collinear
      (32 of 33 nephritis patients have SLEDAI >= 6), so no contrast here
      separates renal injury from global activity. Only 90 of 158 anti-dsDNA
      values are numeric. The analysis uses the authors' normalized
      intensities.

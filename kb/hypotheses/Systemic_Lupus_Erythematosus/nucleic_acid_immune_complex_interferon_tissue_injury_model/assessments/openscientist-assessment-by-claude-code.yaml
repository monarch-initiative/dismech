    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Reported re-runs of the nephritis contrast against biopsy-confirmed NoLN
      only, and proliferative-only nephritis vs NoLN.
    comparison: nephritis 33 vs NoLN 66; proliferative 24 vs NoLN 66
    input_data_source_ids:

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The provider retrieved the pediatric SLE whole-blood cohort GSE65391, ran the
  three prespecified first-visit contrasts and the correlation panel, and
  produced a replayable bundle; an assessor replay with the pinned package
  versions regenerated every table byte-identically. Two results are solid.
  The six-gene type I interferon score separates SLE from healthy children by a
  very large margin (d = 2.18, 158 vs 46 subjects), and within SLE it is higher
  with SLEDAI >= 6 (d = 0.89) and correlates with SLEDAI (rho = +0.44) and
  inversely with C3 and C4. This supports the systemic, interferon-driven
  activity arm of the canonical model. The report's headline conclusion, that
  the blood interferon signature "does NOT distinguish" nephritis and so
  indexes activity rather than tissue injury, does not hold. The prespecified
  no-nephritis comparator pooled biopsy-confirmed no-nephritis patients (NoLN,
  n = 66, 59 of them SLEDAI < 6) with patients whose nephritis class is "Data
  Not Available" (n = 59, 55 of them SLEDAI >= 6). Against NoLN alone,
  nephritis patients carry a higher interferon score (d = 0.57, q = 0.026); the
  provider found this itself and still headlined the pooled null. Because 32 of
  33 nephritis patients are also SLEDAI >= 6, and renal items score into SLEDAI,
  this cohort cannot separate nephritis from global activity cross-sectionally:
  an activity-matched comparison has only 7 NoLN patients. The hypothesis's
  claim that organ injury is selected by local factors "rather than by systemic
  interferon activity alone" is therefore neither supported nor refuted by this
  run. The provider's further inference that the plasmablast genes form a
  tissue-injury or severity signature is not supported by its own data, which
  show no plasmablast difference by nephritis status under any comparator.
  Provenance corrections were metadata and file-layout only; no analysis bytes
  changed.

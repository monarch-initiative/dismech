analyses:
  - analysis_id: gse65391-first-visit-contrasts
    status: SUCCEEDED
    auditability: REPRODUCIBLE
    method: >-
      Series-matrix parse; exclude set == Technical_Replicate; keep the first
      included visit per subject; collapse probes to genes by highest mean
      expression across included arrays; IFN6_SCORE as the mean of per-gene
      z-scores against healthy first-visit samples; Welch t-tests with pooled-SD
      Cohen's d and Benjamini-Hochberg within each contrast; Spearman
      correlations of IFN6_SCORE and three plasmablast genes against SLEDAI,
      anti-dsDNA, C3, C4 and neutrophil count with BH across the 20 pairs.
    comparison: >-
      (1) SLE 158 vs healthy 46; (2) within SLE, SLEDAI >= 6 (94) vs < 6 (64);
      (3) within SLE, nephritis class Prolif/Membr/Mesan/Proli+Membr (33) vs
      NoLN plus "Data Not Available" (125).
    input_data_source_ids:
      - geo-gse65391
      - geo-gpl10558-annotation
    software:
      - software_name: python
        software_version: "3.12.13"
      - software_name: numpy
        software_version: "2.3.5"
      - software_name: pandas
        software_version: "3.0.3"
      - software_name: scipy
        software_version: "1.17.1"
      - software_name: statsmodels
        software_version: "0.14.6"
    parameters:
      - "interferon genes: IFI27, IFI44L, IFIT1, ISG15, RSAD2, SIGLEC1"
      - "plasmablast genes: JCHAIN, MZB1, TNFRSF17"
      - "SLEDAI threshold: 6"
      - "no-nephritis comparator: NoLN plus 'Data Not Available'"
      - "BH over the 10 rows within each contrast (methods.md says 7 rows; the output uses 10)"
    code_artifacts:
      - ../openscientist_artifacts/analysis.py
    environment_artifact: ../openscientist_artifacts/environment.txt
    output_artifacts:
      - ../openscientist_artifacts/samples.csv
      - ../openscientist_artifacts/gene_results.csv
      - ../openscientist_artifacts/correlations.csv
      - ../openscientist_artifacts/comparison.md
      - ../openscientist_artifacts/replay/samples.csv
      - ../openscientist_artifacts/replay/gene_results.csv
      - ../openscientist_artifacts/replay/correlations.csv

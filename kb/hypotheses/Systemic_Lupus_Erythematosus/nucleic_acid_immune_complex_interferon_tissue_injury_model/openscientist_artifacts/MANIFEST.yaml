exact_comparison:
  contrast_1: SLE (n=158) vs Healthy (n=46), first visit; disease state
  contrast_2: Within SLE first visit, SLEDAI>=6 (n=94) vs SLEDAI<6 (n=64)
  contrast_3: Within SLE first visit, biopsy-proven nephritis (n=33; Prolif/Membr/Mesan/Proli+Membr) vs no nephritis
    (n=125; NoLN + Data Not Available)
  target_genes:
  - IFI27
  - IFI44L
  - IFIT1
  - ISG15
  - RSAD2
  - SIGLEC1
  - JCHAIN
  - MZB1
  - TNFRSF17
  - IFN6_SCORE
  composite: IFN6_SCORE = mean of per-gene z-scores (z vs Healthy first-visit) of the 6 IFN genes
  tests: Welch t-test; BH FDR within each contrast; pooled-SD Cohen's d (group1-group2)
  correlations: Spearman (SLE first visit) of IFN6_SCORE + JCHAIN/MZB1/TNFRSF17 vs sledai, ds_dna, c3, c4, neutrophil_count;
    BH across 20 pairs
key_result: Type I IFN signature strongly marks SLE presence (IFN6 d=2.18, q~1.9e-27) and tracks disease activity
  (SLEDAI>=6 vs <6 d=0.89, q~9.9e-6; rho with SLEDAI=+0.44) but does NOT distinguish biopsy-proven nephritis at
  first visit (all q>=0.57).
group_counts:
  total_arrays: 996
  excluded_technical_replicate: 24
  duplicate_subject_visit: 0
  included_arrays: 972
  first_visit_subjects: 204
  first_visit_SLE: 158
  first_visit_Healthy: 46
  SLEDAI_ge6: 94
  SLEDAI_lt6: 64
  nephritis: 33
  no_nephritis: 125
limitations:
- Cross-sectional first-visit design; no longitudinal within-subject modelling.
- Nephritis contrast modestly powered (33 vs 125) and depends on documented nephritis_class parsing (NoLN + 'Data
  Not Available' = no nephritis).
- ds_dna is largely non-numeric (titers) so its numeric correlation n is small (n=90).
- Uses authors' processed log2 intensities from the series matrix; no re-normalization from raw IDAT.

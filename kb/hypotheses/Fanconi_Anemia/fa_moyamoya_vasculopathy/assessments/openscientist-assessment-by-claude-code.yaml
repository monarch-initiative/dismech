analyses:
  - analysis_id: gtex-artery-expression-percentiles
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Retrieve GTEx v8 median gene-level TPM for seven FA-pathway genes, RNF213,
      and ACTA2/PECAM1/GAPDH controls across all 54 tissues, then rank each
      gene's three artery values as a percentile within that gene's own
      54-tissue distribution and compare the FA genes against RNF213.
    comparison: >-
      FA-pathway genes versus RNF213 in aorta, coronary and tibial artery;
      artery values versus each gene's distribution across all 54 GTEx tissues.
    input_data_source_ids:
      - gtex-v8-median-gene-tpm
      - provider-sandbox-preflight-connectivity
    software:
      - software_name: GTEx Portal API
        software_version: "v2"
        software_uri: https://gtexportal.org/api/v2
      - software_name: Python with pandas (reported, unversioned)
    parameters:
      - dataset=gtex_v8
      - measure=median gene-level TPM
      - tissues=54 (all GTEx v8 tissues)
      - artery_tissues=Artery_Aorta, Artery_Coronary, Artery_Tibial
      - percentile=rank of artery value within the gene's 54-tissue distribution
      - vascular_identity_controls=ACTA2, PECAM1 (plus GAPDH)
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_moyamoya_vasculopathy_openscientist_artifacts_data_gtex_fa_genes_artery_expression.csv
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_moyamoya_vasculopathy_openscientist_artifacts_data_gtex_artery_pivot_all_markers.csv
    status_reason: >-
      Graded PARTIAL, not SUCCEEDED as the report claims. The referenced
      `code/gtex_query.py` does not exist: openscientist_artifacts/ contains no
      code file, no environment record, and no MANIFEST.yaml, and the nested
      data//code//logs/ paths cited in the report are absent (all nine committed
      files are flattened). `just validate-hypothesis-analysis-run` on the report
      and this directory fails with exactly three problems -- no
      "ANALYSIS_STATUS: SUCCEEDED" line, no artifact_manifest_sha256 frontmatter
      binding, and no MANIFEST.yaml -- and I did not create a manifest to make it
      pass. Retrieval is nevertheless credible rather than merely reported:
      preflight records HTTP 200 from the GTEx gene endpoint and the query log
      carries ten correctly versioned Ensembl identifiers with the endpoints
      used. What is missing is the second half of the work -- the committed
      inputs, code and manifest that would let the derived numbers be
      recomputed -- so part of the intended deliverable was not produced.
    limitations: >-
      The percentile claims cannot be audited from the bundle: the two CSVs hold
      only the three artery rows, not the 54-tissue distributions the percentiles
      are ranked against, and neither the raw API responses nor any transcription
      code survives. The provider's preflight log states values were
      "transcribed from inspected stdout," so an unrecorded manual step sits
      between the API and the CSVs; no software versions or seeds were recorded.
      Internal consistency is checkable and mostly holds -- report table values
      match the CSV for FANCA, FANCC, FANCD2, FANCG, FANCI and RNF213 -- but the
      CSV contradicts the report's generalization for BRCA2/FANCD1 (59th-80th
      percentile, overlapping RNF213's 50th-78th) whose percentile the report
      table omits, and the "3-8x" margin over the FA genes is nearer 2.4-2.6x
      against FANCG. Scientifically the design is weak for the hypothesis
      regardless: healthy adult bulk artery, no cerebral artery, no FA donors,
      no cell-type resolution, and expression is not a functional requirement.
  - analysis_id: gwas-moyamoya-locus-screen
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Query the GWAS Catalog REST API for studies with diseaseTrait "Moyamoya
      disease", collect author-reported gene annotations per study, and
      intersect that gene set with 16 canonical FA-pathway genes.
    comparison: >-
      Canonical FA-pathway gene set versus author-reported genes at catalogued
      moyamoya GWAS loci.
    input_data_source_ids:
      - ebi-gwas-catalog-moyamoya
    software:
      - software_name: EBI GWAS Catalog REST API
        software_version: live snapshot 2026-09-13
        software_uri: https://www.ebi.ac.uk/gwas/rest/api
    parameters:
      - query=diseaseTrait = 'Moyamoya disease'
      - studies=GCST000860, GCST005575, GCST90310003, GCST90705091
      - screened_genes=FANCA, FANCB, FANCC, FANCD1/BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, FANCJ/BRIP1, FANCL, FANCM, BRCA1, PALB2, RAD51C, SLX4
      - matching=author-reported gene symbol intersection
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_moyamoya_vasculopathy_openscientist_artifacts_logs_gwas_catalog_moyamoya.json
    status_reason: >-
      Graded PARTIAL rather than SUCCEEDED because no code, environment record
      or MANIFEST.yaml exists anywhere in the bundle and the raw API response was
      not committed, so a clean replay is impossible and the
      `just validate-hypothesis-analysis-run` gate fails as described for the
      GTEx analysis. It is the best-documented computation in the run: the single
      committed log carries the endpoint, the query, the four study accessions,
      the per-study author-reported gene lists and the screened FA-gene list, so
      the empty intersection can be re-derived by hand from the artifact, and I
      did so -- none of the 16 FA-pathway genes appears among the reported genes,
      and RNF213 appears in both gene-reporting studies.
    limitations: >-
      Coverage is narrower than the report's framing: two of the four studies
      contribute no reported genes, so the screen rests on GCST000860
      (PMID:21048783) and GCST005575 (PMID:29273593). Matching is on
      author-reported gene symbols rather than on positional overlap with
      credible-set variants, so a nearby FA gene would not be detected. Most
      importantly the design cannot test the hypothesis: common-variant GWAS in
      East-Asian-weighted, non-FA cohorts has no power for a rare Mendelian
      FA-moyamoya co-segregation, so a null result is uninformative rather than
      refuting -- a caveat the report does state correctly in its own log and
      body while its section heading ("RNF213 is the sole reported moyamoya
      gene") overstates both the null and RNF213's exclusivity.
  - analysis_id: clinicaltrials-absence-check
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Three keyword queries against the ClinicalTrials.gov API v2 studies
      endpoint, recording HTTP status and totalCount per query, followed by
      manual relevance triage of each returned study against FA cerebral
      arteriopathy.
    comparison: >-
      Presence versus absence of any registered study targeting FA cerebral
      arteriopathy or moyamoya.
    input_data_source_ids:
      - clinicaltrials-gov-v2-fa-arteriopathy-queries
    software:
      - software_name: ClinicalTrials.gov API
        software_version: "v2"
        software_uri: https://clinicaltrials.gov/api/v2/studies
    parameters:
      - 'query=Fanconi anemia moyamoya'
      - 'query=Fanconi anemia vasculopathy'
      - 'query=Fanconi anemia cerebral arteriopathy'
      - triage=manual per-study relevance assessment
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_moyamoya_vasculopathy_openscientist_artifacts_logs_clinicaltrials_negative_search.json
    status_reason: >-
      A documented negative search whose log records database, API version,
      endpoint, UTC timestamp, exact queries, HTTP 200 statuses, counts and
      triage notes, so the negative result is substantiated and re-runnable
      against the live API. It is still graded PARTIAL rather than SUCCEEDED
      because no query code, environment record or MANIFEST.yaml was committed
      and the raw study records behind the eight and one hits were not saved, so
      the manual relevance triage cannot be independently checked from the
      bundle. No claim in this assessment is grounded in this analysis; the
      absence claim is anchored on the committed search log as a data source.
    limitations: >-
      Bounded to three keyword strings against a live, changing registry; a
      trial indexed under different terminology, or registered on a non-NCT
      registry reachable only through WHO ICTRP, would be missed. The triage
      that discounted the nine returned studies as irrelevant is a judgment
      recorded as a one-line note rather than a per-study table.

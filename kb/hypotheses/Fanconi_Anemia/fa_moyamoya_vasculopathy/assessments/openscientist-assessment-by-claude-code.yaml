claims:
  - claim_id: fa-moyamoya-association-is-anecdotal-only
    statement: >-
      The FA-moyamoya association rests entirely on a small number of
      single-patient reports plus one denominator-based prevalence estimate, with
      no cohort, case-control, or vascular-tissue mechanistic study.
    disposition: RETAINED
    report_quote: >-
      The entire clinical basis is a handful of case reports spanning 44 years
    rationale: >-
      Confirmed against all five primary sources. PMID:7367089 (1980) is one
      10-year-old boy with unilateral right-sided moyamoya; PMID:7746424 (1995)
      is two patients drawn from a 434-patient FA database, i.e. the only
      denominator (~0.46%); PMID:9409403 (1997) contributes one FA child
      incidentally within a 30-child moyamoya surgical series who "died of his
      Fanconi's anemia 7 years after his encephalo-duro-arterio-synangiosis
      (EDAS) procedure"; PMID:25719591 (2015) is one Saudi girl whose moyamoya
      was diagnosed before stem-cell transplantation; PMID:38510908 (2024) is one
      9-year-old boy. None reports vascular histology, vascular-cell assays, or a
      comparison group. The report's characterization of the evidence base is
      accurate and appropriately deflationary, and it correctly recommends
      retaining EMERGING rather than promoting a mechanism.
    citations:
      - PMID:7367089
      - PMID:7746424
      - PMID:9409403
      - PMID:25719591
      - PMID:38510908
  - claim_id: fancc-genotype-vascular-predisposition
    statement: >-
      The FANCC 322delG plus R185X compound-heterozygous genotype shared by the
      two genotyped FA-moyamoya patients indicates a genotype-linked, possibly
      congenital vascular predisposition rather than chance co-occurrence.
    disposition: QUALIFIED
    report_quote: >-
      suggesting a genotype-linked, possibly congenital vascular predisposition
      rather than random co-occurrence
    rationale: >-
      The report quotes Pavlakis 1995 correctly and does label it a proposal in
      the body text, but its executive judgment promotes it to the strongest
      argument for the seed. The source sentence is explicitly conditional
      speculation: "Either the 322delG or R185X mutation alone or in combination
      may predispose to primary, possibly congenital, vascular anomalies."
      Nothing was demonstrated. Three separate weaknesses are not addressed.
      (1) The stated support -- the combination "is not found in any other of the
      174 FA families screened" -- is the expected observation for any specific
      compound-heterozygous pairing of two rare alleles and establishes no
      enrichment without an expected-frequency comparison. (2) n=2 from one
      registry, with relatedness of the two probands not excluded in the
      abstract, so this may be a single independent genotype observation.
      (3) PMID:35417938 reports that more than 80% of variants in the NCI FA
      cohort are in the upstream complex, of which FANCC is the second most
      common gene, so an upstream FANCC genotype in two FA patients is the prior
      expectation. Retain only as a hypothesis-generating observation, not as
      evidence of a FANCC-specific vascular phenotype.
    citations:
      - PMID:7746424
      - PMID:35417938
  - claim_id: rnf213-never-genotyped-in-fa-moyamoya-cases
    statement: >-
      RNF213, the dominant moyamoya susceptibility gene, has never been
      genotyped in any reported FA-moyamoya case, so it has never been excluded
      as the actual cause of the phenotype.
    disposition: QUALIFIED
    report_quote: >-
      RNF213 was never genotyped in any FA-moyamoya case.
    rationale: >-
      Consistent with every available abstract: none of PMID:7367089,
      PMID:7746424, PMID:9409403, PMID:25719591, or PMID:38510908 reports RNF213
      testing, and PMID:25719591 states outright that "to identify the etiology
      of this association furthermore genetic mutation analysis is needed." But
      the claim is presented as a stronger negative than the run establishes.
      For the 1980, 1995, and 1997 cases it is chronologically trivial -- RNF213
      was first implicated in moyamoya in 2011 (PMID:21048783) -- so the
      informative gap is only the 2015 and 2024 cases, and there the finding is
      absence of mention in an abstract rather than a documented full-text or
      registry check. No RNF213-in-FA search string, date, or log appears in the
      artifact bundle, so this is an unlogged literature negative. The
      substantive point stands and is the single highest-value discriminating
      test the report proposes; the wording should be narrowed to "no reported
      case has published RNF213 genotyping."
    citations:
      - PMID:25719591
      - PMID:38510908
      - PMID:7746424
      - PMID:21048783
  - claim_id: moyamoya-outside-fa-malformation-spectrum
    statement: >-
      Moyamoya is not part of the recognized FA congenital-anomaly spectrum, and
      because FA structural anomalies track the ID complex while the genotyped
      FA-moyamoya cases are upstream-complex FANCC, the seed's framing of
      moyamoya as an FA developmental anomaly is internally inconsistent.
    disposition: QUALIFIED
    report_quote: >-
      if moyamoya were an FA developmental structural anomaly, one would expect
      it to track with the ID complex, not FANCC
    rationale: >-
      Both underlying quotations check out: PMID:27028275 defines VACTERL-H as
      three of eight features (vertebral, anal atresia, cardiac,
      tracheo-esophageal fistula, esophageal atresia, renal, limb, hydrocephalus)
      with a 33% frequency (18/54, P<0.0001) and does not list cerebral
      arteriopathy, and PMID:35417938 states "ID complex was associated with
      VACTERL-H" and that upstream-complex patients "lacked VACTERL-H ... and/or
      PHENOS features." The inference drawn from them is overstated twice over.
      VACTERL-H is a diagnostic composite of eight specified features, not an
      exhaustive catalogue of FA anomalies: the same authors created PHENOS
      expressly for FA features outside VACTERL-H, and it includes "structural
      central nervous system abnormalities," which PMID:35417938 reports as a
      recognized and imaging-dependent FA finding. Absence from an eight-item
      acronym therefore does not place a cerebral arteriopathy outside the FA
      phenotype. The subtype tension is likewise weaker than claimed, because
      more than 80% of cohort variants are upstream-complex, making an upstream
      genotype in two cases uninformative in either direction, and because the
      tension only arises if one has already assumed moyamoya is a VACTERL-H-type
      developmental malformation. Keep as a real scope caveat, not as evidence
      against the hypothesis.
    citations:
      - PMID:27028275
      - PMID:35417938
  - claim_id: tgf-beta-tp53-route-never-localized-to-vascular-cells
    statement: >-
      The TP53-dependent progenitor-apoptosis and hyperactive TGF-beta program
      that the hypothesis borrows is established only in hematopoietic,
      fibroblast, and whole-embryo systems, leaving the pivotal step from FA gene
      loss in a vascular cell to arterial stenosis without direct evidence.
    disposition: RETAINED
    report_quote: >-
      No study localizes this apoptosis/TGF-β program to vascular smooth muscle,
      endothelium, or their progenitors
    rationale: >-
      Verified against the sources. PMID:27053300 ran its genome-wide shRNA
      screen "in human FA fibroblasts," identified "transforming growth factor-β
      (TGF-β) pathway-mediated growth suppression as a cause of BMF in FA," and
      rescued proliferative and functional defects of HSPCs from FA mice and FA
      patients -- hematopoietic and fibroblast, not vascular. PMID:36441774 is a
      Fancd2-/-Smad3-/- whole-embryo lethality study and PMID:37627314 is an
      inherited-bone-marrow-failure review. None assays endothelium or vascular
      smooth muscle, and no FA vascular model exists. This is the report's most
      important and best-supported judgment: the hypothesis's distinctive edge is
      an extrapolation across tissue lineage, which is exactly what a
      HUMAN_MODEL_MISMATCH or KNOWLEDGE_GAP discussion should record if any of
      this is curated.
    citations:
      - PMID:27053300
      - PMID:36441774
      - PMID:37627314
  - claim_id: radiation-induced-moyamoya-competing-mechanism
    statement: >-
      Radiation-induced moyamoya is an established dose- and age-dependent
      competing explanation for FA-moyamoya, separable from intrinsic
      arteriopathy by arterial-wall enhancement on MR imaging.
    disposition: QUALIFIED
    report_quote: >-
      Radiation-induced moyamoya syndrome (RIMS) is a well-established, dose- and
      age-dependent entity.
    rationale: >-
      Both quantitative anchors are exact. PMID:36057476 predicts cerebrovascular
      toxicity of "0.2% at 30 Gy, 1.3% at 45 Gy, and 4.4% at 54 Gy" to the circle
      of Willis, and PMID:12034935 reports that "contrast enhancement of the
      arterial walls in patients with radiation-induced arteritis was
      significantly more prominent than in patients with moyamoya disease
      (P = .003)." The transfer to FA is where the claim needs narrowing. The
      PENTEC model covers therapeutic cranial radiotherapy at 30-54 Gy, whereas
      FA conditioning regimens use low-dose total body or total lymphoid
      irradiation or are radiation-free, so the quoted dose-response does not
      quantify risk in the transplanted FA population the report applies it to;
      conversely FA cells are crosslinker- and radiation-hypersensitive, so the
      curve may not extrapolate downward either. The imaging discriminator rests
      on five irradiated patients versus eighteen moyamoya patients and has never
      been applied in FA. Most decisively for the seed, the earliest cases predate
      routine FA transplantation and PMID:25719591's moyamoya was diagnosed before
      transplant, so irradiation cannot explain those cases at all. Retain as a
      genuine confounder for the modern, HSCT-exposed FA population and as a
      testable imaging stratification, not as a quantified alternative.
    citations:
      - PMID:36057476
      - PMID:12034935
      - PMID:25719591
  - claim_id: gtex-fa-genes-expressed-not-artery-enriched
    statement: >-
      GTEx v8 bulk artery tissue shows FA-pathway genes are expressed but not
      artery-enriched, while RNF213 is comparatively artery-high, providing no
      positive transcriptomic signal for a specialized arterial role of the FA
      pathway.
    disposition: QUALIFIED
    report_quote: >-
      No FA-pathway gene is artery-enriched (all near or below median tissue
      percentile).
    rationale: >-
      The median TPM values and percentiles in the report's table reproduce the
      committed CSV exactly for FANCA, FANCC, FANCD2, FANCG, FANCI, and RNF213,
      and ACTA2 (4969-7732 TPM) and PECAM1 (44-93 TPM) do confirm vascular sample
      identity. The generalization as written is nevertheless contradicted by the
      bundle's own data. BRCA2/FANCD1, which the report itself counts among the
      16 canonical FA-pathway genes in its GWAS screen, sits at the 80th, 72nd,
      and 59th artery percentile in gtex_fa_genes_artery_expression.csv --
      above median and overlapping RNF213's 78th, 70th, and 50th -- yet the
      report's table replaces its percentile cell with "(proliferation-linked)"
      and the narrative then asserts that all FA-pathway genes are near or below
      median. The companion quantitative claim that RNF213 is "roughly 3-8x the
      FA genes" also overstates the margin: against FANCG (7.6-8.9 TPM) the ratio
      is about 2.4-2.6x. Substantively the weak conclusion survives for the core
      and ID complexes, and the report is right that non-enrichment neither
      supports nor refutes a functional requirement. Relevance to the hypothesis
      is indirect in any case: healthy adult bulk aorta, coronary, and tibial
      artery establish expression, not vascular pathology, and no cerebral artery
      or diseased tissue was examined. The linked analysis is graded PARTIAL
      because no code, manifest, or 54-tissue input is committed.
    analysis_ids:
      - gtex-artery-expression-percentiles
    citations:
      - PMID:35417938
  - claim_id: gwas-catalog-no-fa-gene-at-moyamoya-loci
    statement: >-
      No FA-pathway gene appears among the author-reported genes at any moyamoya
      GWAS locus, where RNF213 is the dominant signal.
    disposition: QUALIFIED
    report_quote: >-
      no FA-pathway gene maps to any moyamoya locus
    rationale: >-
      This is the most auditable part of the run: the committed
      gwas_catalog_moyamoya.json records the endpoint, the diseaseTrait query,
      the four study accessions, the per-study author-reported gene lists, and
      the 16 screened FA-pathway genes, so the empty intersection can be
      re-derived by hand from the artifact, and it is empty. Two qualifications
      are needed. The finding's coverage is narrower than "all moyamoya GWAS":
      the log shows two of the four studies (GCST90310003, GCST90705091)
      contributed no reported genes, so the screen effectively covers
      GCST000860 (PMID:21048783, Kamada 2011) and GCST005575 (PMID:29273593,
      Duan 2018). And the section heading "RNF213 is the sole reported moyamoya
      gene" is contradicted by its own body and by PMID:29273593, titled "Novel
      Susceptibility Loci for Moyamoya Disease," which contributes HDAC9, MTHFR,
      LRP1, FADS1/2, JAZF1, CARD14, TCN2 and others. The report's own caveat is
      the right one and should be preserved in any curation: a common-variant
      GWAS in East-Asian-weighted, non-FA cohorts cannot detect a rare Mendelian
      FA-moyamoya co-segregation, so this is no population-level FA contribution
      rather than a refutation.
    analysis_ids:
      - gwas-moyamoya-locus-screen
    citations:
      - PMID:21048783
      - PMID:29273593
  - claim_id: no-clinical-trial-addresses-fa-cerebral-arteriopathy
    statement: >-
      As of the search date no ClinicalTrials.gov study targets FA cerebral
      arteriopathy or moyamoya, a documented source-level absence.
    disposition: RETAINED
    report_quote: >-
      no ClinicalTrials.gov study addresses FA cerebral arteriopathy/moyamoya
    rationale: >-
      This absence claim meets the standard the project asks of a negative
      search, unlike the report's prose-only PubMed negatives. The committed
      clinicaltrials_negative_search.json records the API (v2), the endpoint, the
      UTC search timestamp, all three query strings, per-query HTTP 200 status,
      totalCount values (0, 8, 1), and the manual relevance triage that
      discounted the eight and one hits as transplant, registry, and cranioplasty
      studies. The absence is properly bounded to those keyword strings, which
      the report acknowledges. It is a legitimate curation-relevant negative, and
      the appropriate destination is a discussion or knowledge-gap note rather
      than a clinical_trials entry.
  - claim_id: provider-analyses-executed-and-bundle-complete
    statement: >-
      All three database analyses executed successfully and the artifact bundle
      contains the manifest, code, and structured data and log paths needed to
      inspect them.
    disposition: REJECTED
    report_quote: >-
      All three computational analyses (GTEx v8, GWAS Catalog,
      ClinicalTrials.gov v2) completed with outcome = succeeded; no analysis
      silently fell back to literature.
    rationale: >-
      The self-report of its own provenance is false in checkable ways. The
      report states the bundle "contains `MANIFEST.yaml`, `code/gtex_query.py`,
      `data/gtex_fa_genes_artery_expression.csv`, ... `logs/gtex_query_log.json`"
      and cites those nested paths from the findings sections, but
      openscientist_artifacts/ holds nine flattened files with no MANIFEST.yaml,
      no code file of any kind, no environment record, and no data/, code/, or
      logs/ subdirectories. Running the gate reports exactly three defects:
      missing MANIFEST.yaml, missing artifact_manifest_sha256 frontmatter
      binding, and no exact "ANALYSIS_STATUS: SUCCEEDED" line. The provider's own
      preflight_connectivity.json is the decisive record: the sandbox "cannot
      write to the kb/ artifact path (PermissionError). Artifacts were written
      via the agent file tool instead; values were transcribed from inspected
      stdout." A manual transcription step sits between the API responses and the
      committed CSVs, and neither the raw responses nor the transcribing code
      survives. Access itself is credible -- the preflight records HTTP 200 from
      the GTEx endpoint and the query log carries versioned Ensembl gene
      identifiers -- so the analyses are graded PARTIAL rather than
      REPORTED_ONLY, and the run is genuinely free of the silent
      literature-fallback it disclaims. But "succeeded" with a complete bundle is
      not the state of this run, and the GTEx percentile ranks in particular
      cannot be recomputed from what was committed.

    status: FAILED
    auditability: UNVERIFIABLE
    method: >-
      Intended in-sandbox execution of the TCGA HPV comparator through the
      provider's execute_code MCP tool, with results written into the artifact
      bundle.
    comparison: Same HPV-negative versus HPV-positive contrast later run outside the sandbox.
    input_data_source_ids:
      - cbioportal-hnsc-tcga-pancan-2018
    status_reason: >-
      The report discloses that the execute_code sandbox ran under /app with
      restricted imports and no repository write access and therefore could not
      persist files into the bundle, so the work was re-run elsewhere. Recording
      the failure and the fallback is the correct behaviour, but no sandbox log,
      traceback or exit status is committed, so the failure itself is attested
      only in prose.
    limitations: >-
      Because nothing from the sandbox attempt survives, there is no way to check
      whether the sandbox and the later run used the same query, cohort filter or
      statistical procedure.
  - analysis_id: tcga-hnsc-hpv-comparator
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Two-sided Mann-Whitney U tests with rank-biserial effect sizes comparing
      MUTATION_COUNT and FRACTION_GENOME_ALTERED between HPV-negative and
      HPV-positive sporadic HNSCC samples, plus descriptive medians/means and
      boxplots.
    comparison: TCGA HNSC HPV-negative (n = 415) versus HPV-positive (n = 72) sporadic tumours.
    input_data_source_ids:
      - cbioportal-hnsc-tcga-pancan-2018
    software:
      - software_name: Python
        software_version: 3.12.13
      - software_name: pandas
        software_version: 3.0.3
      - software_name: numpy
        software_version: 2.3.5
      - software_name: SciPy
        software_version: 1.17.1
      - software_name: matplotlib
        software_version: 3.10.9
      - software_name: requests
        software_version: 2.34.2
    parameters:
      - test=two-sided Mann-Whitney U
      - effect_size=rank-biserial correlation
      - grouping=SUBTYPE in {HNSC_HPV-, HNSC_HPV+}
      - inclusion=non-null MUTATION_COUNT, FRACTION_GENOME_ALTERED and SUBTYPE
      - multiplicity=none applied across the two tested variables
      - random_seed=none (report states no seed used)
    environment_artifact: ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_logs_environment.json
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_data_tcga_hnsc_hpv_stats.json
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_data_tcga_hnsc_hpv_summary.csv
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_data_tcga_hnsc_hpv_persample.csv
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_figures_tcga_hnsc_hpv_boxplots.png
    fallback_from_analysis_id: sandbox-execute-code-attempt
    status_reason: >-
      Not SUCCEEDED, because the execution record the report describes is not in
      the bundle. The report says the bundle carries "MANIFEST.yaml with
      checksums + replay flags, code, data, figure, logs, environment" and names
      code/tcga_hnsc_hpv_comparator.py as the method, but the delivered directory
      contains only four data/figure files, two log files, an environment JSON
      and the HTML/PDF report: there is no MANIFEST.yaml and no .py file at all.
      just validate-hypothesis-analysis-run on this report and artifact directory
      fails with three problems - the report contains no exact
      "ANALYSIS_STATUS: SUCCEEDED" line, its frontmatter carries no
      artifact_manifest_sha256 binding, and the artifact directory contains no
      MANIFEST.yaml. The claimed replay verification ("identical results in
      sandbox and in the bundle-runner") therefore has no committed support
      either. It is graded PARTIAL rather than REPORTED_ONLY because the
      committed per-sample table does substantiate the reported numbers: an
      independent assessor recomputation over the 487 rows reproduces n = 415/72,
      medians 106.0 versus 62.0 for MUTATION_COUNT and 0.2394 versus 0.2032 for
      FRACTION_GENOME_ALTERED, p = 2.5e-05 and p = 0.074, and rank-biserial
      magnitudes of 0.311 and 0.132, matching the committed stats JSON. This
      second analysis also ran as a fallback after the sandbox attempt could not
      write into the bundle.
    limitations: >-
      The cohort is sporadic and contains no Fanconi anemia tumours, so the
      analysis characterises the reference distribution only and cannot test any
      FA-specific claim. The recomputation establishes internal consistency
      between the committed table and the committed statistics, not that
      cBioPortal returned that table: with no code, no manifest and no
      checksummed API response, the retrieval step is unaudited. Both analysed
      variables are repository-precomputed attributes, which is the wrong
      substrate for a like-for-like burden comparison against FA cohorts
      sequenced and called on other pipelines. No multiplicity correction was
      applied across the two variables, and the FGA result (p = 0.074) is
      reported without claiming significance.
  - analysis_id: pubmed-literature-screen
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Nineteen logged PubMed queries through the provider's search_pubmed tool
      across two iterations, classified in the committed log as HIT, EMPTY or ERR.
    comparison: Not applicable (literature retrieval, not a statistical contrast).
    input_data_source_ids:
      - pubmed-eutilities-hit-queries
      - pubmed-zero-result-queries
      - pubmed-rate-limited-queries
    software:
      - software_name: OpenScientist search_pubmed MCP tool (NCBI E-utilities backend)
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_hnscc_hpv_independent_keratinocyte_carcinogenesis_openscientist_artifacts_logs_pubmed_search_log.md
    status_reason: >-
      Partial rather than succeeded: two of nineteen queries failed with HTTP 429
      and were not retried, and the screen did not retrieve the full text of its
      single most important primary source (PMID:36450981), which the report
      concedes was truncated to the abstract. The committed log also disagrees
      with the report's own tally, recording seven HIT and ten EMPTY rows where
      the prose says six HIT and eleven EMPTY.
    limitations: >-
      The log records query strings, outcomes and returned PMIDs but no field
      tags, date limits or complete result counts, so it documents the search
      without making it exactly repeatable. Zero-result rows are correctly
      labelled UNVERIFIED rather than absence of literature, which means the
      report's keratinocyte-level negative findings rest on query phrasing the
      provider itself distrusts. Roughly a dozen PMIDs used in the report body do
      not appear in the citations sidecar and cannot be traced to a logged query.
  - analysis_id: fa-vs-sporadic-matched-pipeline-genomics
    status: SKIPPED
    auditability: UNVERIFIABLE
    method: >-
      Proposed whole-genome comparison of FA HNSCC against matched HPV-negative
      sporadic HNSCC on identical pipelines, scoring SNV burden, SV and
      copy-number counts and mutational signatures.
    comparison: FA HNSCC versus HPV-negative sporadic HNSCC on one pipeline.
    input_data_source_ids:
      - pmid-36450981-fa-scc-genomics
    status_reason: >-
      Proposed as the report's top discriminating test and never run; the report
      states plainly that TCGA contains no FA tumours and that it reached the
      primary FA genomics paper at abstract level only. Recorded here because the
      report also promotes the absence of this comparison to a knowledge gap,
      which the full text of PMID:36450981 contradicts: that study performed the
      FA-versus-sporadic WGS contrast on 20 FA and 41 sporadic genomes and
      reported a median two-fold SV excess plus elevated somatic copy-number
      alteration frequency. What remains genuinely open is a larger,
      prospectively harmonised replication, not the existence of the comparison.
    limitations: >-
      No inputs were accessed and no code or output exists, so nothing about this
      proposal is auditable beyond its description.
claims:
  - claim_id: hpv-independent-route
    statement: >-
      Head and neck squamous cell carcinoma in Fanconi anemia arises through an
      HPV-independent route, even though oral HPV exposure is more prevalent in
      FA than in relatives or controls.
    disposition: RETAINED
    report_quote: >-
      FA patients carry *more* oral HPV than relatives, yet their HNSCCs are
      predominantly **HPV-negative**
    rationale: >-
      Both halves check out against the cited primary sources, and the separation
      of exposure from causation is exactly right. PMID:33803570 measured oral
      HPV in 201 individuals with FA and found 20% positivity versus 13% in
      parents, 8% in siblings and 6% in unrelated controls, with FA diagnosis
      raising positivity 4.84-fold. PMID:36450981 then found no HPV sequences in
      20 FA HNSCC whole genomes while detecting them in 18 HPV-positive sporadic
      HNSCCs, and only two HPV-positive cases among 40 FA SCC exomes, both
      gynecologic. PMID:35454946 states that a definitive role for HPV in FA
      HNSCC is unproven. The residual caveat, which the report also makes, is
      that HPV may still matter for FA anogenital SCC.
    citations:
      - PMID:33803570
      - PMID:35454946
      - PMID:36450981
      - PMID:40970532
  - claim_id: sv-and-copy-number-driven-genomics
    statement: >-
      FA HNSCC genomes are dominated by structural variation and somatic
      copy-number alteration, with fewer point mutations and small indels than
      HPV-negative sporadic HNSCC.
    disposition: RETAINED
    report_quote: >-
      FA HNSCC carries frequent somatic CNVs but *fewer* SNVs/indels than even
      HPV-negative sporadic HNSCC
    rationale: >-
      Directly supported, and by a stronger source than the report realised.
      PMID:36450981 reports that the primary genomic signature of FA repair
      deficiency is a high number of structural variants enriched for small
      deletions, unbalanced translocations and fold-back inversions, a median
      two-fold total SV increase over HPV-negative sporadic HNSCC, elevated focal
      somatic copy-number alteration frequency across 55 FA SCCs with PIK3CA
      amplified in 78% and MYC in 71%, and a reduced rate of SNVs and indels in
      known driver genes relative to HPV-negative sporadic HNSCC. PMID:40970532
      states the same pattern at review level. Note the mechanism runs through
      structural variation specifically, not copy-number change alone, so KB
      phrasing should say structural variation leading to copy-number alteration.
    citations:
      - PMID:36450981
      - PMID:40970532
  - claim_id: low-snv-burden-as-fa-distinct-feature
    statement: >-
      Because HPV-negative sporadic HNSCC is itself the higher-mutation subtype,
      the low point-mutation burden of FA HNSCC is a feature specific to FA
      rather than a by-product of HPV-negative status.
    disposition: QUALIFIED
    report_quote: >-
      My TCGA reference analysis shows HPV-negativity alone is the *high*-mutation
      subtype, so FA's low SNV load is a **distinct** feature, not a by-product of
      HPV status.
    rationale: >-
      The logic is sound as far as it goes, and the comparator direction is real,
      but the inference skips the confounder the primary source names. PMID:36450981
      attributes the reduced exonic mutation rate in FA SCCs "most likely" to the
      earlier age of cancer onset in FA patients, a median 31 years against
      typical sporadic HNSCC ages; the report never mentions age. The comparison is
      also cross-pipeline, contrasting FA burden figures taken from literature
      against TCGA precomputed MUTATION_COUNT attributes, which is exactly the
      matched-pipeline problem the report elsewhere lists as an open gap. Retain
      the observation that low SNV burden is not explained by HPV-negativity
      alone; do not yet retain it as evidence that the ICL-repair mechanism
      suppresses point mutation independently of age at onset.
    citations:
      - PMID:36450981
      - PMID:40970532
    analysis_ids:
      - tcga-hnsc-hpv-comparator
  - claim_id: tcga-hpv-strata-burden-contrast
    statement: >-
      Within sporadic TCGA HNSCC, HPV-negative tumours carry a higher mutation
      count than HPV-positive tumours, while the fraction of genome altered does
      not differ significantly.
    disposition: QUALIFIED
    report_quote: >-
      HPV-neg sporadic HNSCC has **higher** mutation burden (median 106 vs 62;
      p=2.5e-5)
    rationale: >-
      The numbers hold up internally: recomputing two-sided Mann-Whitney U over
      the committed 487-row per-sample table reproduces medians of 106.0 versus
      62.0 with p = 2.5e-05, and FGA medians of 0.2394 versus 0.2032 with
      p = 0.074, matching the committed stats JSON, and the report is careful not
      to call the FGA difference significant. What is not established is the
      retrieval step: with no committed code, no MANIFEST.yaml and no checksummed
      API response, nothing ties that table to the cBioPortal endpoints named in
      the access log, so the result is provider-internally consistent rather than
      independently verified. The cohort also contains no FA tumours, so this
      result is a reference distribution and never direct evidence about FA.
    analysis_ids:
      - tcga-hnsc-hpv-comparator
  - claim_id: analysis-bundle-succeeded-and-replay-verified
    statement: >-
      The provider's computational analysis succeeded, was replay-verified, and is
      backed by a bundle containing a checksummed manifest and the analysis code.
    disposition: REJECTED
    report_quote: >-
      MANIFEST.yaml with checksums + replay flags, code, data, figure, logs,
      environment
    rationale: >-
      The bundle does not contain what the report says it contains. A full listing
      of openscientist_artifacts shows nine files: final_report.html,
      final_report.pdf, three data files, one PNG, a cBioPortal access log, a
      PubMed search log and an environment JSON. There is no MANIFEST.yaml and no
      .py file anywhere under the root, so the named method file
      code/tcga_hnsc_hpv_comparator.py does not exist and the checksums, replay
      flags and "Execution outcome: SUCCEEDED; replay verified" assertion have no
      committed backing. just validate-hypothesis-analysis-run on this report and
      artifact directory fails with three problems: no exact
      "ANALYSIS_STATUS: SUCCEEDED" line in the report, no artifact_manifest_sha256
      in the frontmatter, and no MANIFEST.yaml in the directory. Per repository
      policy no manifest was created to make the gate pass; the failure is the
      provenance signal. The underlying computation is still gradeable as PARTIAL
      because the per-sample table substantiates the reported statistics, but the
      claim of a verified, manifest-backed successful run is rejected.
    analysis_ids:
      - tcga-hnsc-hpv-comparator
  - claim_id: leukoplakia-premalignant-intermediate
    statement: >-
      Oral leukoplakia is the visible premalignant intermediate of the FA route
      and occurs independently of hematopoietic stem cell transplantation.
    disposition: QUALIFIED
    report_quote: >-
      it occurs even in transplant-naive FA patients, arguing the intrinsic
      keratinocyte route does not require transplantation
    rationale: >-
      The transplant-independence half is well supported: PMID:25682760
      cross-sectionally evaluated 138 FA patients who had not undergone HSCT,
      median age 9 years, and found leukoplakia in 16 (12%), concluding that oral
      leukoplakias are highly prevalent in non-transplanted FA and should be
      investigated as part of the syndrome phenotype. The premalignant-intermediate
      half is weaker than the report's causal chain implies: that study is
      cross-sectional and reports no progression to carcinoma, and the
      transformation rate the report quotes (1.8% of oral potentially malignant
      disorders) comes from PMID:38309198, a case-report aggregation that is
      absent from the citations sidecar and was not verified here. Curate
      leukoplakia as a prevalent, transplant-independent oral lesion under
      surveillance; treat the lesion-to-carcinoma progression edge as needing
      longitudinal evidence.
    citations:
      - PMID:25682760
  - claim_id: aldehyde-step-unconfirmed-in-oral-keratinocytes
    statement: >-
      The endogenous aldehyde genotoxicity arm of the hypothesis is established in
      hematopoietic tissue and remains unconfirmed in oral keratinocytes, making it
      the central missing causal step.
    disposition: RETAINED
    report_quote: no study demonstrates it in oral keratinocytes or HNSCC
    rationale: >-
      This is the report's most important statement and it is accurate, which
      matters because the hypothesis is named after the step. PMID:26412304 shows
      that endogenous formaldehyde is cleared by ADH5, that Adh5-null mice
      accumulate N2-methyl-dG adducts, and that Adh5/Fancd2 double-knockout mice
      suffer HSC depletion, bone marrow failure and fatal malignancies, but its
      tissues are bone marrow, liver and kidney, and the neoplasms are T-ALL plus
      one liver cancer; no squamous or oral epithelium is examined. PMID:38944932 is
      a review whose FA-relevant evidence concerns bone marrow failure and
      ALDH2*2 modification of FA outcomes. PMID:36450981 raises alcohol- and
      tobacco-derived aldehydes overwhelming the FA pathway as a proposal for
      sporadic HPV-negative HNSCC, not as a demonstrated step in FA oral
      keratinocytes. Two of the provider's zero-result queries targeted exactly
      this literature, so the gap is partly query-limited rather than proven
      empty; the honest reading is that the step remains a lead requiring oral
      adductomics or keratinocyte perturbation, which is what the report says.
    citations:
      - PMID:26412304
      - PMID:38944932
      - PMID:36450981
  - claim_id: gvhd-route-parallel-not-necessary
    statement: >-
      The transplantation and chronic-GVHD inflammatory route amplifies oral
      cancer risk in FA but is not necessary for it.
    disposition: QUALIFIED
    report_quote: >-
      Real (SHR 2.9; 7–16× with cGVHD, PMID:39048762, 40478605) but non-necessary
      (cancer in transplant-naive patients).
    rationale: >-
      Both figures are real but they come from different populations, and the
      report's compressed phrasing blurs that. The 2.9 sub-distribution hazard
      ratio (95% CI 1.1-7.5, p = 0.024) in PMID:40478605 is FA-specific and is for
      malignancies overall, not oral cancer specifically. The 7-16-fold figure in
      PMID:39048762 is for secondary oral cancer in allogeneic HCT recipients
      generally, with cGVHD as a risk factor, not in an FA cohort, so transferring
      it to FA is an extrapolation across populations. The non-necessity claim is
      well grounded, since FA HNSCC and leukoplakia occur in transplant-naive
      patients (PMID:25682760, and the report notes only 54.5% of pooled FA oral
      SCC cases had undergone HSCT). Keep this as a parallel amplifying route with
      the population of each risk estimate recorded.
    citations:
      - PMID:39048762
      - PMID:40478605
      - PMID:25682760
  - claim_id: fa-vs-sporadic-comparison-treated-as-absent
    statement: >-
      A quantitative FA-versus-sporadic mutation and copy-number comparison on
      matched pipelines is unpublished or absent as of the search date, and is a
      knowledge gap.
    disposition: REJECTED
    report_quote: >-
      Quantitative FA-vs-sporadic SNV/SV comparison on matched pipelines is
      unpublished/absent as of 2026-09-13
    rationale: >-
      The comparison exists and is the central result of a paper the report itself
      cites. PMID:36450981 compared somatic SV landscapes of 20 FA SCCs plus two
      adenocarcinomas against 23 HPV-negative and 18 HPV-positive sporadic HNSCC
      whole genomes (and BRCA1/BRCA2-mutant carcinomas), reporting a median
      two-fold total SV increase, two-fold more deletions, three-fold more
      translocations, 1.7-fold more inversions and 1.5-fold more tandem
      duplications, alongside elevated focal sCNA frequency in 55 FA SCCs and a
      reduced SNV/indel rate in driver genes. The report reached this source at
      abstract level only, and the gap statement is a direct consequence of that
      truncated read rather than of the literature. This is the clearest instance
      in the report of an unverified absence becoming a curation lead: promoting
      it would put a false gap into the KB. A genuine residual gap can be stated
      much more narrowly, as the need for a larger prospectively harmonised
      replication with FA-specific mutational-signature analysis.
    citations:
      - PMID:36450981
    analysis_ids:
      - fa-vs-sporadic-matched-pipeline-genomics
  - claim_id: replication-stress-evidence-in-fa-keratinocytes
    statement: >-
      Replication stress in FA-deficient oral keratinocytes is expected from FA
      pathway loss but is unevidenced, based on a zero-result literature search.
    disposition: QUALIFIED
    report_quote: >-
      **Replication-stress evidence in FA keratinocytes.** Checked: query #6 EMPTY
      (UNVERIFIED).
    rationale: >-
      The gap is real at the level the report wants, namely a functional
      keratinocyte assay: no cited study reports fork stalling, ssDNA, RPA or
      gamma-H2AX measurements in FA versus corrected oral keratinocytes, so the
      proposed DNA-fiber and immunofluorescence experiments remain the right test.
      But the absence is overstated, and rests on a single query the provider
      itself distrusts. PMID:36450981 provides genomic-footprint evidence of
      replication-associated instability in FA squamous tumours: deletion,
      inversion and tandem-duplication breakpoints are greatly enriched at common
      fragile sites in FA SCCs, tandem-duplication breakpoints associate with
      early-replicating regions, and short deletions under 1 kb are abundant,
      which the authors read as continuous double-strand-break generation from
      abnormal repair. Qualify the gap to the missing functional keratinocyte
      measurement rather than a general absence of replication-stress evidence.
    citations:
      - PMID:36450981
    analysis_ids:
      - pubmed-literature-screen

overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Three of the hypothesis's four arms hold up against the primary literature the
  report cites. FA head and neck squamous cell carcinoma is HPV-negative despite
  elevated oral HPV exposure, the tumours are driven by structural variation and
  copy-number change with comparatively few point mutations, and oral
  leukoplakia occurs in transplant-naive FA patients. The eponymous arm does
  not: the aldehyde-FA genotoxic axis is demonstrated in mouse hematopoietic
  stem cells, liver and kidney, and in no cited study of oral keratinocytes or
  squamous epithelium, and the report says so itself. Two findings cut against
  the report's own framing. First, its stated gap "quantitative FA-vs-sporadic
  SNV/SV comparison on matched pipelines is unpublished/absent" is wrong: the
  comparison is the core result of PMID:36450981, which the report cites but read
  at abstract level only, and which reports a median two-fold SV increase over
  HPV-negative sporadic HNSCC in 20 FA whole genomes plus elevated somatic
  copy-number alteration frequency across 55 FA SCCs. That same paper also
  attributes the reduced exonic mutation rate "most likely" to earlier age of
  cancer onset, which the report does not consider when it calls low SNV load a
  distinct FA feature. Second, the artifact bundle does not contain the
  MANIFEST.yaml or code/tcga_hnsc_hpv_comparator.py the report says it does; no
  MANIFEST.yaml and no .py file exist under openscientist_artifacts, and the
  analysis-run gate fails on three counts. The one computation is also a
  sporadic reference cohort with no FA tumours, so it cannot test the hypothesis
  directly. The report's search-log discipline is otherwise good: it commits a
  cBioPortal access log and a 19-query PubMed log, labels zero-result queries
  UNVERIFIED rather than absent, and discloses both rate-limited queries and the
  sandbox write restriction.

      evidence matrix does the reverse, and the citation sidecar lists 40980970 but
      not 41313766. The committed artifact and the report therefore disagree about
      the evidence base.
    limitations: >-
      The CSV's per-row limitation fields are in several places more candid than the
      prose - it alone flags the older reference controls in PMID:18454466, the
      DNA-repair-independent cytoplasmic FANCC role, and that the proxy mouse uses a
      different repair pathway - so a reader of the report body alone sees a stronger
      case than the bundle supports.
claims:
  - claim_id: childhood-secretion-localized-defect
    statement: >-
      In FA children, OGTT-derived beta-cell function indices are reduced while
      HOMA-IR does not differ, localizing the childhood glucose defect to insulin
      secretion rather than insulin sensitivity.
    disposition: QUALIFIED
    report_quote: insulin sensitivity was statistically indistinguishable across groups
    rationale: >-
      Every number reproduces exactly against PMID:18454466 - 46% abnormal glucose
      metabolism among 39 children, insulinogenic index 105 +/- 29 (FA-NGT), 44 +/- 8
      (FA-AGM) and 173 +/- 41 (REF) pM/mM, HOMA-IR 1.9/2.2/1.3 not significant, and a
      disposition index reduced in both FA groups at P < 0.0002. The dissociation is
      real and is the strongest thing in the report. Two qualifications the prose
      omits: the reference group is lean adolescents a mean 11 years older than the
      FA children (19.8 +/- 0.3 vs 8.6 +/- 3.9 years, P < 0.001), not age-matched
      controls, and HOMA-IR was numerically higher in both FA groups, so "preserved"
      sensitivity is a non-significant difference in a small cross-sectional cohort
      rather than a demonstrated equivalence. The report's own evidence-matrix CSV
      records the control-age mismatch; the report body does not.
    citations:
      - PMID:18454466
  - claim_id: first-phase-defect-never-measured-in-fa
    statement: >-
      No study has measured first-phase insulin secretion in Fanconi anemia by IVGTT
      acute insulin response or hyperglycemic clamp, so the hypothesis's defining
      assay is untested.
    disposition: RETAINED
    report_quote: has never been measured in FA using gold-standard assays
    rationale: >-
      This is the report's most valuable contribution and it holds up. The targeted
      PubMed query is in the committed log at 0 hits, and independent reading of every
      cited human source agrees: PMID:18454466 is an OGTT with surrogate indices,
      PMID:11335753 is a registry endocrine survey, PMID:36513378 is a retrospective
      chart review, and PMID:41313766 is an oral 13C-glucose challenge with hourly
      sampling - none is an IVGTT or clamp. The report is right to keep the hypothesis
      at EMERGING on this basis, and a curator should treat "first-phase" in the
      hypothesis label as an unmeasured extrapolation from insulinogenic index.
    citations:
      - PMID:18454466
      - PMID:11335753
      - PMID:36513378
      - PMID:41313766
  - claim_id: pre-transplant-cohort-attribution
    statement: >-
      The pediatric OGTT cohort was pre-transplant, which excludes transplant and
      total-body-irradiation confounding from the childhood secretory phenotype.
    disposition: REJECTED
    report_quote: explicitly excluded by the childhood pre-transplant cohort
    rationale: >-
      The cited source does not support this. The PMID:18454466 record states only
      that patients were "without prior diagnosis of diabetes"; it reports no
      transplant or conditioning status anywhere, and its keyword and results fields
      contain nothing about HSCT or irradiation. The report nevertheless describes the
      cohort as "39 FA children, pre-transplant, no prior diabetes" in its evidence
      matrix and then uses that characterization to dismiss its own
      transplant-confounder alternative model. This matters more than a stray
      descriptor: "independently of transplantation" is an explicit arm of the seed
      hypothesis, and this unsupported inference is the only thing in the report that
      discharges it. Notably the provider's own log shows a query aimed at exactly
      this question - "Fanconi anemia glucose abnormalities before transplantation
      untransplanted children insulin" - returning 0 hits. A curator must not promote
      a pre-transplant restriction to this cohort; the FA-vs-transplant attribution
      remains open.
    citations:
      - PMID:18454466
      - PMID:26017459
      - PMID:19308039
  - claim_id: fancc-cell-autonomous-beta-cell-injury
    statement: >-
      FA-pathway loss is intrinsically harmful to beta cells, as shown by FANCC
      knockdown in a human beta-cell line sensitizing cells to oxidative-stress
      apoptosis and lowering insulin and glucokinase expression.
    disposition: QUALIFIED
    report_quote: >-
      FANCC knockdown in human beta cells sensitizes them to oxidative-stress
      apoptosis and lowers insulin and glucokinase expression
    rationale: >-
      The findings are reported accurately - PMID:29901137 shows siRNA FANCC
      suppression causing loss of protection against oxidative-stress-induced
      apoptosis in the human 1.1B4 line, rescue by FANCC overexpression confirmed by
      Annexin V-FITC/PI, caspase 3/7 and pro-/anti-apoptotic gene expression, and
      decreased insulin and glucokinase mRNA. But the study supports intrinsic
      beta-cell vulnerability, not an intrinsic secretory defect, and three context
      limits narrow it further. The injury is exogenous H2O2, not the unrepaired
      endogenous DNA damage the hypothesis invokes. The paper's own framing is
      cytoplasmic FANCC's anti-apoptotic role, which it presents as separable from
      nuclear DNA repair, so it does not evidence the DNA-damage arm of the chain and
      measures no p53. And the secretory readouts are INS and GCK mRNA in one
      immortalized single-complementation-group line - no insulin secretion, no
      glucose-stimulated secretion, no beta-cell mass. The report's own CSV records
      the DNA-repair-independent caveat; the report body does not.
    citations:
      - PMID:29901137
  - claim_id: dna-damage-p53-proxy-chain
    statement: >-
      Endogenous DNA damage acting through p53/p21 drives beta-cell senescence,
      islet-mass loss and diabetes, supplying a molecular spine for the FA case by
      proxy.
    disposition: QUALIFIED
    report_quote: supplying a plausible molecular spine for the FA case
    rationale: >-
      PMID:19833883 is described correctly as far as it goes - NHEJ-deficient
      p53R172P mice accumulate DNA damage, upregulate p53 and p21, lose beta-cell
      proliferation, show islet senescence and progressive islet-mass loss, and die
      diabetic at 3-5 months. The report labels it non-FA, but understates how far the
      genetics diverge. The islet phenotype appears only when NHEJ deficiency is
      combined with the apoptosis-dead p53R172P hypomorph: the paper's premise is that
      abrogating p53-dependent apoptosis substitutes p21-driven senescence, and islet
      loss there is explicitly "independent of apoptosis". FA cells have intact -
      indeed characteristically hyperactive - p53-dependent apoptotic signalling, and
      the FA lesion is interstrand-crosslink repair rather than non-homologous end
      joining. So the proxy demonstrates a chain whose required genetic condition is
      the opposite of the FA situation, which makes it a weaker analogy than "the
      closest available model" conveys. Retained as a lead, not as a spine.
    citations:
      - PMID:19833883
      - PMID:29901137
  - claim_id: doxorubicin-p53-linked-apoptosis
    statement: >-
      A genotoxic agent impairs glucose-stimulated insulin secretion and induces
      p53-linked apoptosis in beta cells, reinforcing the oxidative-stress-to-p53 arm.
    disposition: REJECTED
    report_quote: >-
      doxorubicin impairs glucose-stimulated insulin secretion and induces p53-linked
      apoptosis in INS-1 beta cells and islets
    rationale: >-
      The GSIS half is right: PMID:27255381 reports doxorubicin impairing
      glucose-stimulated insulin secretion and viability in INS-1 832/13 cells within
      6 hours and inducing caspase-3 and -7 in those cells and mouse islets. The p53
      half inverts the paper. It states that doxorubicin induced mRNA for mdm2, cyclin
      G1 and fas "whereas downregulating p53", and its conclusion is that DNA damage
      rather than H2O2 redox cycling is the major mechanism of toxicity - the word
      p53 appears in the direction opposite to the one the report needs. Citing this
      study to reinforce a p53-activation arm is a directional misreading, and the
      same wording is carried into the committed CSV. The correct use of this paper is
      as support for genotoxin-induced secretory impairment, with p53 target-gene
      induction described as such and the p53 downregulation stated. PMID:23321474
      does support ROS-driven p53 stabilization, but in rodent beta cells under
      exogenous H2O2, not in FA.
    citations:
      - PMID:27255381
      - PMID:23321474
  - claim_id: competing-ros-peripheral-insulin-resistance
    statement: >-
      A competing model in which FA-pathway loss drives ROS-mediated peripheral
      insulin resistance with compensatory hyperinsulinemia is at least as well
      evidenced in vivo, so the beta-cell defect cannot be adopted as the sole
      explanation.
    disposition: RETAINED
    report_quote: found hyperinsulinemia in 28 of 39 (72%) FA patients tested
    rationale: >-
      Both legs check out. PMID:22482891 reports Fanca- and Fancc-deficient mice as
      diabetes-prone with hyperglycemia, hyperinsulinemia and rapid weight gain on a
      high-fat diet, driven by reduced insulin-receptor tyrosine phosphorylation and
      increased inhibitory IRS-1 serine phosphorylation in liver, muscle and fat, with
      Quercetin restoring signalling. PMID:11335753 reports hyperinsulinemia in 28 of
      39 (72%) tested, impaired glucose tolerance in 8 of 40 (25%), within an 81%
      overall endocrinopathy rate. The report's framing - parallel rather than
      mutually exclusive, with a shared FA-to-ROS upstream node - is the most
      defensible reading and the assessor agrees with it. One extraction the report
      missed in its own cited source bears directly on its unresolved gap 7: PMID:11335753
      reports insulin resistance "most evident in patients in FA-G, and least evident
      in those in FA-C", which is a complementation-group axis in the very dataset the
      report uses for the competing model, and one that sits interestingly beside the
      FANCC-specific in-vitro support. Also note the mouse phenotype is high-fat-diet
      dependent, which the report's comparison table records.
    citations:
      - PMID:22482891
      - PMID:11335753
      - PMID:41313766
  - claim_id: fanca-gwas-glycemic-null
    statement: >-
      A partial GWAS Catalog traversal found no glycemic, diabetes, insulin, HbA1c or
      beta-cell trait association among the FANCA mapped variants checked.
    disposition: QUALIFIED
    report_quote: FANCA returned 60 mapped SNPs; 23 were checked
    rationale: >-
      The committed log substantiates exactly what the report says: FANCA HTTP 200
      with 60 SNPs found, 23 checked, 27 associations, 16 traits, the nearest
      metabolic hit being a metabolite trait. The report's self-labelling as PARTIAL
      and inconclusive, and its refusal to read the null as a validated negative
      without a working positive control, are honest and match the artifact. The claim
      is qualified rather than retained for four reasons: the traversal covers 23 of
      60 SNPs under an undocumented truncation rule; the BRCA2/FANCD1 positive control
      returned 429 and never ran; the log records a third failure the report never
      mentions, a 404 on REST associations/search/findByGene; and no catalog release
      or API version is pinned, so the query is not replayable. Most importantly the
      instrument is mismatched to the question - common-variant association cannot
      speak to a biallelic recessive loss-of-function disease - which the report
      concedes and which means even a complete null would be uninformative for this
      hypothesis. Usable as "no evidence either way", not as a source-level absence.
    analysis_ids:
      - gwas-catalog-glycemic-trait-scan
  - claim_id: artifact-bundle-completeness
    statement: >-
      The provider artifact bundle contains a manifest, an environment record and the
      referenced analysis logs at the stated paths.
    disposition: REJECTED
    report_quote: (MANIFEST, evidence matrix, GWAS query log, environment record)
    rationale: >-
      Listing the directory refutes this. openscientist_artifacts/ holds five files:
      the GWAS log, the PubMed log, the evidence-matrix CSV, and HTML and PDF
      renderings of the report itself. There is no MANIFEST.yaml, no environment or
      package-version record, and no analysis code or query script. The paths the
      report cites for its log - openscientist_artifacts/logs/gwas_catalog_query_log.json
      - do not exist either, because the provider zip was flattened into long
      underscore-joined filenames at the bundle root; the content is committed but not
      where the report says. `just validate-hypothesis-analysis-run` on this report
      and directory exits 1 with three problems (no ANALYSIS_STATUS: SUCCEEDED line,
      no artifact_manifest_sha256 in frontmatter, no MANIFEST.yaml). Per the artifact
      policy this assessment records the failure rather than repairing it, and created
      no manifest. Two mitigations in the provider's favour: this report came from
      templates/hypothesis_deep_research.md, not the execution-gated dataset template,
      so the missing status marker is a template mismatch rather than an invalid gated
      run; and the two search logs that do exist are genuinely the kind of sanitized
      execution evidence the policy asks for, with no credentials or signed URLs.
    analysis_ids:
      - gwas-catalog-glycemic-trait-scan
      - literature-evidence-matrix
  - claim_id: human-evidence-base-completeness
    statement: >-
      The 2008 pediatric OGTT study is the only human evidence bearing on insulin
      secretion in Fanconi anemia.
    disposition: QUALIFIED
    report_quote: the only human evidence
    rationale: >-
      The report's committed artifacts contradict its prose. Both the evidence-matrix
      CSV and the PubMed log carry PMID:41313766, a 2025 human 13C6-glucose
      stable-isotope study in FA, which the report body and the citation sidecar both
      omit entirely. That paper is directly on point for this hypothesis: insulin
      levels in the FA group did not differ from controls despite sustained
      hyperglycemia and significantly elevated GIP and GLP-1, with C-peptide and
      amylin discordant with the degree of incretin stimulation and glucose - a
      second, independent human observation of relative secretory inadequacy, and one
      that also reports a delayed glucose peak and a metabolic-inflexibility pattern
      compatible with insulin resistance. It therefore strengthens the secretory arm
      while also feeding the competing model, and it is a stronger curation lead than
      several rows the report did print. Conversely PMID:40980970 appears in the
      report's matrix and citation sidecar but not the CSV. Both PMIDs resolve, so
      this is an internal-consistency and coverage defect rather than fabrication; a
      curator should read the CSV alongside the report and should pull PMID:41313766
      before curating this hypothesis.
    citations:
      - PMID:41313766
      - PMID:40980970
      - PMID:18454466
    analysis_ids:
      - pubmed-negative-search-screen
      - literature-evidence-matrix

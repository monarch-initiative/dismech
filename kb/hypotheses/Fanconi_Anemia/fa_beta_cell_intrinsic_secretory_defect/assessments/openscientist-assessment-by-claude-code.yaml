    limitations: >-
      Single database, exact multi-word phrase strings, no MeSH expansion, no date or
      publication-type filters recorded, and the log's own caveat applies - these are
      scoped negatives on specific term strings, not demonstrated absences. The
      report's own evidence base shows the sensitivity of this: PMID:41313766 was
      retrieved by an unrelated query and never reached the report body.
  - analysis_id: literature-evidence-matrix
    status: REPORTED_ONLY
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Extraction of one row per evidence item (citation, evidence type, stance,
      mechanistic claim, key finding, context, confidence, limitations) into a
      committed CSV.
    comparison: Stance of each retrieved publication toward the seed hypothesis.
    input_data_source_ids:
      - pubmed-literature-screen
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_beta_cell_intrinsic_secretory_defect_openscientist_artifacts_data_evidence_matrix.csv
    status_reason: >-
      The derived table survives, so it is inspectable, but nothing connects a row to
      the query or the source text that produced it and no extraction code was
      committed - hence REPORTED_ONLY rather than PARTIAL. Inspecting it exposes a
      divergence from the prose: the CSV's 12 rows include PMID:41313766 (a 2025

analyses:
  - analysis_id: gwas-catalog-glycemic-trait-scan
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Per-gene REST traversal of GWAS Catalog mapped SNPs to associations to EFO
      traits, with reported trait strings screened against a glycemic/diabetes/islet
      keyword list, plus an attempted Solr bulk download per gene.
    comparison: >-
      Common-variant associations of FA genes (FANCA, FANCC, FANCD2, FANCG) against
      glycemic, diabetes, insulin, HbA1c and beta-cell traits, with BRCA2/FANCD1 as
      an intended positive control.
    input_data_source_ids:
      - gwas-catalog-fanca
      - gwas-catalog-incomplete-genes
      - gwas-catalog-solr-download
    software:
      - software_name: Python requests
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_beta_cell_intrinsic_secretory_defect_openscientist_artifacts_logs_gwas_catalog_query_log.json
    status_reason: >-
      PARTIAL is the correct grade and the report itself assigns it. One of five
      genes returned data, 23 of 60 FANCA SNPs were traversed, the positive control
      never ran, and the bulk endpoint failed for every gene - all substantiated by
      the committed log, which is why this is PARTIALLY_AUDITABLE rather than
      REPORTED_ONLY. It cannot be SUCCEEDED: no code, no environment record and no
      software versions were committed, and the traversal is incomplete by its own
      account. `just validate-hypothesis-analysis-run
      kb/hypotheses/Fanconi_Anemia/fa_beta_cell_intrinsic_secretory_defect/openscientist.md
      kb/hypotheses/Fanconi_Anemia/fa_beta_cell_intrinsic_secretory_defect/openscientist_artifacts`
      exits 1 with three problems - the report has no exact
      "ANALYSIS_STATUS: SUCCEEDED" line, its frontmatter carries no
      artifact_manifest_sha256, and the bundle has no MANIFEST.yaml. That gate
      failure is recorded, not repaired: this report was generated from
      templates/hypothesis_deep_research.md rather than the execution-gated
      templates/hypothesis_dataset_analysis.md, so the missing status marker is a
      template mismatch rather than an invalid gated run, while the missing manifest
      and binding remain real gaps against the artifact policy. No manifest was
      created by this assessment. Positively, no silent fallback occurred: the
      failures are reported in the prose and the log, and literature synthesis is
      presented as complementary rather than as a substitute for the failed check.
    limitations: >-
      Common-variant GWAS is the wrong instrument for a biallelic recessive
      loss-of-function disease, so neither a complete null nor a hit would move the
      hypothesis much; the report says so itself. No catalog release, API version or
      request timestamp is pinned, so the query is not replayable, and the 23/60 SNP
      truncation rule is undocumented.
  - analysis_id: pubmed-negative-search-screen
    status: PARTIAL
    auditability: PARTIALLY_AUDITABLE
    method: >-
      Query-by-query PubMed E-utilities screen through the provider's search_pubmed
      tool, with per-query hit counts, key PMIDs and outcome labels written to a
      committed JSON log.
    comparison: >-
      Presence versus documented absence of (a) a first-phase/IVGTT/clamp insulin
      secretion study in FA and (b) an in-vivo FA beta-cell or islet model.
    input_data_source_ids:
      - pubmed-literature-screen
      - pubmed-negative-first-phase
      - pubmed-negative-fa-islet-mouse
      - pubmed-negative-additional-queries
      - pubmed-rate-limited-queries
    software:
      - software_name: PubMed E-utilities via openscientist search_pubmed
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_beta_cell_intrinsic_secretory_defect_openscientist_artifacts_logs_pubmed_search_log.json
    status_reason: >-
      The screen is the best-evidenced part of the run: 16 queries are logged with
      counts, and the two negatives the report leans on are among them. It is PARTIAL
      rather than SUCCEEDED because two queries aborted with HTTP 429 and were never
      retried, so the corpus is incomplete, and because no code, environment or

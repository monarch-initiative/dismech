    fallback_from_analysis_id: monarch-hpo-query-wrong-ids
    status_reason: >-
      The query itself ran and its result is correct: the assessor reissued it
      on 2026-09-13 and reproduced all three association totals exactly, 668,
      115 and 132, together with the TAR radius and thumb label set the report
      relies on. It is graded PARTIAL rather than SUCCEEDED because the
      execution record is incomplete by the provider's own account. The
      execute_code sandbox had no write access to the job filesystem, so no raw
      query response was saved and the numbers were retyped into
      monarch_hpo_query.json through the Write tool; no script, no environment
      specification and no unfiltered response are committed, and no Monarch or
      HPO release is pinned. Software versions are therefore unavailable for the
      sandbox and the requests library. The bundle is a literature-and-annotation
      run, not a computational bundle produced from the execution-gated dataset
      template, and it has no MANIFEST.yaml; running
      `just validate-hypothesis-analysis-run` against the report and this
      artifact directory fails with three problems, namely no exact
      `ANALYSIS_STATUS: SUCCEEDED` line in the report, no
      `artifact_manifest_sha256` in the report frontmatter, and no MANIFEST.yaml
      in the artifact directory. That outcome is recorded, not repaired: no
      manifest was created for this assessment, because writing one would bind
      an assessor-built contract to a provider report that never claimed the
      gated contract.
    limitations: >-
      The result is annotation-level. Monarch disease-to-phenotype associations
      are aggregated across sources, are not frequency-weighted, and include
      child and spectrum terms, so the totals reflect curation depth and cannot
      speak to penetrance, obligate presence or mechanism. The report states
      this limitation accurately. The comparison also cannot distinguish the
      progenitor-loss and patterning models, since both predict the same
      annotation set.

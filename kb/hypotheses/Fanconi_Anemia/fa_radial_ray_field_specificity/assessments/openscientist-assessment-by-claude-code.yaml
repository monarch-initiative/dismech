claims:
  - claim_id: radial-ray-predominance
    statement: >-
      Fanconi anemia upper-limb malformation is preaxial and radial-ray
      predominant, with thumb hypoplasia present in every limb-affected patient
      in the reference clinical cohort.
    disposition: RETAINED
    report_quote: >-
      28 of 28 limb-affected FA patients had thumb hypoplasia
    rationale: >-
      Checked against the cached abstract of PMID:35360980, which states that
      twenty-eight patients had an upper limb difference "which always included
      thumb hypoplasia", out of 48 Fanconi anemia patients at the National
      Cancer Institute, with 23 bilateral. The report states the denominators
      correctly and does not inflate 28 of 28 limb-affected into 28 of 48. This
      is descriptive single-cohort epidemiology with no inferential statistics,
      and PMID:33086350 adds only a correlational severity association across a
      mixed-etiology registry, so the claim establishes the phenomenon the
      hypothesis must explain and contributes nothing about mechanism.
    citations:
      - PMID:35360980
      - PMID:33086350
  - claim_id: p53-p21-engine-hematopoietic-only
    statement: >-
      The p53/p21-dependent progenitor-attrition engine the hypothesis invokes
      is demonstrated in hematopoietic cells, and its operation in limb-bud
      mesenchyme is an untested extrapolation.
    disposition: RETAINED
    report_quote: >-
      all direct evidence is hematopoietic; no cited study demonstrates
      p53-dependent apoptosis of anterior limb-bud progenitors
    rationale: >-
      PMID:22683204 establishes the engine and the scope limit in the same
      paper: p53 is hyperactivated in Fanconi anemia cells in response to
      replicative stress and unresolved DNA damage and triggers a late
      p21(Cdkn1a)-dependent G0/G1 arrest, and p53 knockdown rescued the
      hematopoietic stem and progenitor defect. Every compartment tested is
      hematopoietic, namely patient bone marrow CD34+ cells, Fancd2-null and
      Fancg-null murine LSK cells, and a cord-blood xenograft. PMID:33723374 is
      a review and adds framing, not limb data. This scope caveat is the most
      useful thing the report says, and it is stated without hedging.
    citations:
      - PMID:22683204
      - PMID:33723374
  - claim_id: apoptosis-effector-relabel
    statement: >-
      The disorder entry's apoptosis effector label for Fanconi anemia
      developmental progenitor loss should be widened to include p53/p21-driven
      cell-cycle arrest and senescence, but not replaced by an arrest-only
      label.
    disposition: QUALIFIED
    report_quote: >-
      the best limb evidence shows radius-selective loss via impaired
      proliferation without massive apoptosis
    rationale: >-
      A widening is justified, but on evidence the report undersells rather than
      on the chick study it leads with. PMID:22683204 reports that in Fanconi
      anemia cells p53 was preferentially recruited to the promoters of CDKN1A
      and GADD45A, both G0/G1 arrest genes, "but not of BAX, a gene controlling
      apoptosis, in agreement with low level of apoptosis in these
      EBV-immortalized cells", and PMID:33723374 collects in vitro senescence
      hallmarks including p53-p21 axis activation. That is direct, in-disease
      support for arrest and senescence as effectors. The same paper, however,
      reports that Fancd2-null murine LSK cells "exhibited a high rate of
      binucleated cells and apoptosis", rescued in Fancd2/p53 double knockouts,
      so apoptosis is documented in Fanconi anemia progenitors and is p53
      dependent. Arrest, senescence and apoptosis are alternative outputs of one
      p53 response, and the evidence supports an inclusive label such as
      p53/p21-dependent progenitor arrest, senescence and apoptosis. Replacing
      apoptosis outright would trade one over-specified effector for another.
    citations:
      - PMID:22683204
      - PMID:33723374
  - claim_id: chick-fgfr-effector-inference
    statement: >-
      A chicken wing-bud FGFR-inhibitor experiment shows that the radius is
      selectively lost through impaired chondroprogenitor proliferation and
      adhesion rather than through cell death, and therefore contradicts an
      apoptotic effector in Fanconi anemia.
    disposition: REJECTED
    report_quote: >-
      This reproduces the **anterior/radial selective sensitivity** the
      hypothesis predicts
    rationale: >-
      The source does not support the inference as drawn, for three separable
      reasons. First, dose scope: PMID:25280231 reports that "microinjection of
      higher PD173074 concentrations (25 and 50 mmol/L) into the wing bud at
      stage 20" produced the small wing rudiment or absent wing whose skeletal
      analysis revealed "the absence of the radius but not ulna", while the
      apoptosis statement is explicitly bounded, "none of the inhibitors caused
      massive apoptosis at low concentrations". The paper therefore reports no
      apoptosis measurement in the concentration range that produced the
      radius-selective loss, and joining the two sentences attributes to the
      source a comparison it did not make. Second, the perturbation is
      pharmacologic FGFR tyrosine-kinase inhibition, not FA-pathway loss,
      interstrand-crosslink repair failure or aldehyde-driven replication
      stress, and the authors' own conclusion concerns FGFR signalling in
      anterior-posterior zeugopod patterning. Third, the model is chicken. The
      study is a legitimate lead for the proliferative-demand premise, which the
      report also draws from it, but it cannot adjudicate the Fanconi anemia
      effector and should not be cited as refuting it.
    citations:
      - PMID:25280231
  - claim_id: field-specificity-unresolved
    statement: >-
      No experiment has shown that anterior or preaxial limb-bud progenitors are
      preferentially depleted on an FA-deficient background, so the
      field-specificity step of the hypothesis is unresolved.
    disposition: RETAINED
    report_quote: >-
      no experiment yet demonstrates that anterior limb-bud progenitors are
      *preferentially* eliminated in an FA-deficient background
    rationale: >-
      Nothing in the checked corpus tests anterior against posterior progenitor
      fate in a Fanconi anemia model. PMID:22683204 tests hematopoietic
      compartments only; PMID:21734703 reports embryonic development and
      hematopoietic and leukemic outcomes with no limb-field readout. The report
      names this as its crux gap, keeps the hypothesis at EMERGING, and does not
      overclaim, which is the right disposition for a lead of this kind. It is
      retained as an accurate statement of what the run failed to find rather
      than as a demonstrated negative, since the search behind the absence is
      weak; see fa-limb-omics-absence.
    citations:
      - PMID:22683204
      - PMID:21734703
  - claim_id: patterning-convergence-parsimony
    statement: >-
      Radial-ray malformation is a convergent output of several patterning-gene
      disorders, so radial predominance in Fanconi anemia alone does not
      implicate a DNA-damage-driven progenitor-loss mechanism.
    disposition: QUALIFIED
    report_quote: >-
      if unrelated genes converge on the radial ray via patterning, radial
      predominance in FA *does not by itself* implicate field-specific apoptosis
    rationale: >-
      The parsimony argument is sound and is the strongest analytical
      contribution of the report, and the human genetics behind it holds:
      PMID:16917909 reports the TBX5 mutation spectrum in Holt-Oram syndrome
      including preaxial radial-ray upper-limb defects, and PMID:36829172 and
      PMID:35179219 report SALL4-related radial-ray and absent-thumb phenotypes.
      The mechanistic half is thinner than presented. PMID:41984002 is a
      ten-patient Congenital Upper Limb Differences registry case series whose
      sonic-hedgehog sentence sits in its Purpose as background attribution to
      animal studies, not as its own finding, and whose stated conclusion, that
      with co-occurrence "there was no clear association in severity between
      thumb hypoplasia/RLD and radial polydactyly", is not reported and cuts
      against the coherent-field framing the report builds elsewhere.
      PMID:41925074 is a single juvenile-myelomonocytic-leukemia transplantation
      case report whose TAR phenotype sentence is likewise background. Retain
      the convergence argument; do not carry these two into the entry as
      patterning-mechanism evidence.

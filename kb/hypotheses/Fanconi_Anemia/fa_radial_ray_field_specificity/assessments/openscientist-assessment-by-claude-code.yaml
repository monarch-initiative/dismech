  - claim_id: rbm8a-hedgehog-mismatch-flag
    statement: >-
      The RBM8A and Hedgehog citation that the report flagged as a possible
      identifier-content mismatch resolves to a real study, but the quoted
      string is that study's title rather than one of its findings.
    disposition: QUALIFIED
    report_quote: >-
      is marked `[mismatch]` in the knowledge state; confirm the RBM8A/Hedgehog
      snippet before curation
    rationale: >-
      The flag is resolved. PMID:42147171 was fetched into the reference cache
      with `just fetch-reference` and is a real full-text record, Mao, Mott and
      Pei, "TAR syndrome causal gene RBM8A is critical for embryonic bone
      development and proper Hedgehog signaling", and the report's quoted string
      is a verbatim fragment of that title, which is what the mismatch flag was
      detecting. The underlying science is on-topic: the Prx1-Cre Rbm8a
      conditional knockout shows reduced SOX9 and increased IHH in the primary
      ossification center with selective downregulation of the Hedgehog targets
      Gli3 and Hhip. Two limits remain. A title is not an evidence snippet under
      this repository's evidence policy, so promotion needs a results sentence
      instead. And the reported phenotype is proportionate shortening of radius,
      ulna, humerus, tibia and femur with delayed ossification and altered
      cranial morphogenesis, not radius-selective aplasia, so the model is a
      weaker stand-in for the TAR radial-ray phenotype than the report's framing
      suggests.

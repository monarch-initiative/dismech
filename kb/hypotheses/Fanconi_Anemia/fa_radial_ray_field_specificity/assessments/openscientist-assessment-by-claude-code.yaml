      assessor did for the consequential citations. Literature synthesis is in
      any case not a computational result and is not treated as one here. The
      HTML and PDF files carry no derived content beyond the Markdown report.
    limitations: >-
      Retrieval was shaped by the search tool rather than by the question: 23 of
      39 logged queries returned nothing under AND-of-all-terms behaviour, one

  - claim_id: mouse-limb-phenotype-inference
    statement: >-
      Mouse Fanconi anemia models support an aldehyde-dependent developmental
      requirement for the FA pathway, but establish no limb or radial-ray
      phenotype in either direction.
    disposition: QUALIFIED
    report_quote: >-
      robust FA-mouse limb defects generally require aldehyde sensitization
    rationale: >-
      The developmental claim is supported as quoted. PMID:21734703 states that
      "the acetaldehyde-catabolising enzyme Aldh2 is essential for the
      development of Fancd2(-/-) embryos", with in-utero ethanol sensitivity,
      rapid marrow failure on postnatal ethanol and spontaneous acute leukaemia
      in Aldh2-null Fancd2-null animals, and PMID:22922648 and PMID:37348497
      extend the aldehyde-to-p53 axis in hematopoietic stem cells. None of these
      reports a limb or skeletal phenotype, so the report's statement that
      FA-mouse limb defects require aldehyde sensitization has no source: there
      is no aldehyde-sensitized limb result for sensitization to be required
      for. The companion species-divergence point has the mirror-image problem.
      PMID:12893777 reports microphthalmia, perinatal lethality and epithelial
      cancers in Fancd2-null mice and does not report limb findings at all, so
      "not the human radial-ray limb malformation" is an argument from silence
      rather than a measured negative. Keep both as scope limitations on
      extrapolating from mouse, and do not record either as a limb result.
    citations:
      - PMID:21734703
      - PMID:12893777
      - PMID:22922648
      - PMID:37348497
  - claim_id: fa-limb-omics-absence
    statement: >-
      No usable dataset or study exists reporting anterior limb-bud progenitor
      apoptosis on an FA-deficient background.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      No relevant primary dataset (e.g., FA-deficient anterior limb-bud
      scRNA-seq with apoptosis readout) was located
    rationale: >-
      The report handles this correctly as process: it declines to run a
      substitute, states plainly that the analysis was not performed, and does
      not relabel literature synthesis as a computation. The absence itself is
      not established and should not be quoted as one. No data-repository query
      is recorded anywhere in the bundle, neither endpoint, accession nor
      response, only a single prose line; and the literature side rests on four
      free-text PubMed queries whose own log states the result is "an unverified
      absence limited by the tool's strict AND matching, NOT a curated database
      negative", in a run where 23 of 39 queries returned nothing, which is a
      tool-behaviour signal rather than a literature signal. A recorded
      repository search and a MeSH-indexed literature search are needed before
      this absence supports a knowledge-gap statement in the disorder entry.
    analysis_ids:
      - fa-limb-bud-omics-analysis
      - literature-evidence-synthesis

analyses:
  - analysis_id: directional-concordance-tally
    status: REPORTED_ONLY
    auditability: PARTIALLY_AUDITABLE
    method: >-
      One-sided exact binomial sign test of categorical direction codes against a
      null proportion of 0.5, applied per measured parameter.
    comparison: >-
      Proportion of cohorts reporting a reduced value versus chance, for NK count,
      NK cytotoxicity, and B cell count.
    input_data_source_ids:
      - evidence-matrix-table
    software:
      - software_name: SciPy
        software_version: 1.17.1
    parameters:
      - test=one-sided exact binomial sign test
      - null_proportion=0.5
      - input=direction codes only, no effect sizes
    output_artifacts:
      - ../openscientist_artifacts/kb_hypotheses_Fanconi_Anemia_fa_intrinsic_nk_and_b_lymphoid_defect_openscientist_artifacts_logs_database_source_checks.md
    status_reason: >-
      No committed execution record substantiates this computation. There is no
      code file, no environment record, no MANIFEST.yaml, and no tally output in
      the bundle, although the report names logs/reproducibility_tally.txt,
      code/reproducibility_tally.py, and a MANIFEST replay_verification entry;
      `just validate-hypothesis-analysis-run` on the report and this artifact
      directory fails with three problems (missing ANALYSIS_STATUS marker,
      missing artifact_manifest_sha256 frontmatter binding, missing
      MANIFEST.yaml). Worse for the numbers themselves, recomputing the counts
      from the committed CSV gives 5 of 5 reduced for nk_count, 4 of 4 for
      nk_cytotox, and 3 reduced among 5 non-null b_count values; that matches
      neither the report's 4/4, 3/3, 3/3 nor the log's 4/5, 3/5, 3/5. The log
      attributes the discrepancy to a NaN retained by pandas, but the committed
      file contains no NaN in those columns: the fifth nk_count and fourth
      nk_cytotox value is a real "reduced" code on a review row. The status is
      not FAILED, because the printed output lines are preserved in the log and
      the input is committed, but nothing establishes that the run produced the
      numbers the report states. The database-source-checks log is listed as
      this analysis's only output artifact because its iteration-4 section
      transcribes the three printed tally lines; that transcription is the
      entire surviving execution trace, and it is not a result file.
    limitations: >-
      Even a faithful replay would not carry inferential weight. The rows are not
      independent observations, one of them is a review that synthesizes two
      others, and the directions were selected by a literature search, so the
      statistic is dominated by reporting bias rather than by replication. The
      b_count column also contains a discordant value (PMID:23889587, normal
      marrow lymphocyte proportions) that the report's "3/3 of measuring cohorts"
      excludes by relabeling rather than by counting. The report's own
      acknowledgement that the p-values are under-powered and not inferential is
      accurate and should be preserved; no figure was produced.

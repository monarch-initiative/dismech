claims:
  - claim_id: nk-and-b-cell-numeric-reduction
    statement: >-
      Peripheral NK-cell and B-cell numbers are reduced in Fanconi anemia, and the
      finding is reproduced across independent human cohorts.
    disposition: RETAINED
    report_quote: >-
      Reduced NK and B cell numbers, reduced NK cytotoxicity, and reduced NK
      perforin/granzyme content are reproduced across at least four independent
      human cohorts
    rationale: >-
      Every cited cohort checks out against its source. PMID:21542827 reports
      reduced absolute B (P = 0.048) and NK (P = 0.0002) counts in 10 children
      with FA; PMID:28557197 reports lower total B, memory B, and NK cells (all
      P < 0.001) in 29 patients; PMID:25963299 reports lower B and NK cells
      (P < 0.01) in both children and adults with FA against 202 relatives. The
      qualification is on "four independent cohorts" rather than on the finding.
      PMID:24240977 measured a decreased proportion of the CD56dim CD16+ subset
      rather than absolute NK number, and PMID:21542827 and PMID:28557197 come
      from the same center and recruitment pipeline, so the count of independent
      replications is nearer three than four.
    citations:
      - PMID:21542827
      - PMID:28557197
      - PMID:25963299
      - PMID:24240977
  - claim_id: intrinsic-nk-cytotoxic-machinery-lesion
    statement: >-
      Reduced NK perforin and granzyme content together with defective
      degranulation indicate a cytotoxic-machinery lesion rather than a purely
      numeric consequence of pancytopenia.
    disposition: QUALIFIED
    report_quote: >-
      argues for an intrinsic cytotoxic-apparatus defect rather than a pure
      numeric consequence of pancytopenia
    rationale: >-
      The inference is the right shape and is the report's strongest mechanistic
      move, but it rests on a thinner base than the prose implies. Reduced
      perforin (P < 0.00001) and granzyme (P = 0.0057) content is a single n = 10
      cohort (PMID:21542827) and was not re-measured in the larger follow-up.
      PMID:30949167 is the only degranulation evidence and is a case-level report
      whose framing is hyperinflammation and HLH. The strongest
      function-over-number datum is in PMID:28557197, where 16% of FA individuals
      with normal NK numbers had reduced NK function, and it reaches only
      P = 0.07. No complementation, rescue, or FA-pathway perturbation experiment
      ties the granule defect to the FA lesion, so "intrinsic" is an inference
      from patient cells, not a demonstrated cell-autonomous property.
    citations:
      - PMID:21542827
      - PMID:28557197
      - PMID:30949167
  - claim_id: transplant-independence-established
    statement: >-
      The NK and B cell defect is present in FA patients who have never been
      transplanted and have no malignancy.
    disposition: RETAINED
    report_quote: >-
      The Myers 2017 cohort explicitly excluded transplanted and malignant
      patients yet still showed the NK/B defect
    rationale: >-
      This is accurate and verifiable in the source. PMID:28557197 states that
      the assessment was performed in "a large FA cohort who have not undergone
      bone marrow transplantation or developed malignancies", and its methods
      confirm that none of the 29 participants had a cancer history or a prior
      transplant at enrollment, while still reporting reduced B, memory B, and NK
      cells and reduced NK cytotoxicity. Independence from transplantation and
      from malignancy is the part of the hypothesis label that the literature
      actually establishes.
    citations:
      - PMID:28557197
  - claim_id: marrow-failure-independence-unestablished
    statement: >-
      Independence of the lymphoid defect from marrow failure itself, as opposed
      to from transplantation, is not established.
    disposition: QUALIFIED
    report_quote: >-
      Establishes transplant-independence; still cannot separate from BMF severity
    rationale: >-
      The report's conclusion is right and its reasoning is under-informed in both
      directions. It under-credits its own sources: PMID:28557197 reports that
      "across the immune parameters studied, however, there were no differences
      observed by marrow failure status", and no participant had severe BMF at
      baseline, while PMID:25963299 adjusted its comparisons for severe BMF and
      still found reduced B and NK cells in children and adults. Both are more
      than the report allows. Neither, however, demonstrates independence from
      reduced marrow output: a within-FA null across a truncated BMF range is not
      a test against non-FA cytopenic controls, and PMID:22683204 shows a profound
      pan-HSPC defect already present before clinical BMF, which supplies a
      lineage-nonspecific route to the same reduced counts. The report's related
      observation that the p53-mediated lymphoid-progenitor step is inferred
      rather than shown, and that PMID:27720904 finds the fetal Fancd2 HSPC
      fitness deficit to be p53-independent, is correct and is part of why this
      arm stays open.
    citations:
      - PMID:28557197
      - PMID:25963299
      - PMID:22683204
      - PMID:27720904
  - claim_id: fancc-mouse-b-cell-intrinsic-defect
    statement: >-
      The Fancc-/- mouse demonstrates a B-cell-intrinsic class-switch and
      antibody-secreting-cell defect independent of marrow failure.
    disposition: QUALIFIED
    report_quote: >-
      the strongest evidence that at least the B-lineage functional defect is
      marrow-failure-independent
    rationale: >-
      PMID:26895835 does support an intrinsic B-cell functional defect: purified
      Fancc-/- B cells show defective IgG2a switching and impaired ASC
      differentiation with hyperactive Wnt/beta-catenin repressing Blimp1. Three
      things the report omits narrow it. The same paper reports that Fancc-/- mice
      have normal total peripheral B-cell numbers and normal splenic B-cell
      subpopulations at steady state, with only a redistributed bone-marrow
      developmental profile, so the model is a negative for the human numeric
      reduction rather than support for it. Its authors attribute the
      differentiation impairment to conditions where "the hematopoietic system is
      under stress and might not be able to compensate", which cuts against the
      marrow-failure-independent framing rather than for it. And it is a single
      gene in a single species: Fancc is one complementation group, and no
      equivalent experiment exists for the NK arm.
    citations:
      - PMID:26895835
  - claim_id: antigen-proliferation-subclaim
    statement: >-
      The hypothesis's "impaired proliferative response to activation"
      sub-mechanism is inconsistently supported.
    disposition: QUALIFIED
    report_quote: >-
      Giri 2015 found normal lymphoproliferation and normal cytokines in FA
    rationale: >-
      Both halves of the report's evidence are accurate: PMID:25963299 reports
      lymphoproliferative responses and cytokine levels similar across patient
      groups and relatives, and PMID:21542827 reports reduced tetanus
      proliferation (P = 0.008) with normal candida and PHA responses. Calling
      the sub-claim "inconsistently supported" nonetheless blurs an interpretable
      pattern the report had the material to see. PMID:28557197, which the report
      cites elsewhere, found reduced antigen proliferation to both tetanus
      (P = 0.019) and candida (P = 0.019) with normal PHA. Read across the three
      cohorts, antigen-recall responses are impaired in two independent
      assessments while mitogen-driven proliferation is consistently normal, which
      is a narrower and more testable claim than a general proliferation defect
      and is exactly what the report's own discriminating test 4 proposes.
    citations:
      - PMID:25963299
      - PMID:21542827
      - PMID:28557197
  - claim_id: nkg2d-hspc-clearance-tension
    statement: >-
      NKG2D-ligand-driven NK clearance of FA HSPCs is a competing explanation for
      the numeric deficit and is in tension with hypofunctional patient NK cells.
    disposition: QUALIFIED
    report_quote: >-
      mature peripheral FA NK cells are hypofunctional/hypocytotoxic, yet the
      NKG2D axis posits NK cells that are cytotoxic enough to destroy HSPCs
    rationale: >-
      Identifying PMID:35671096 as a competing model is the report's most useful
      contribution, and the source supports the description: FA CD34+ HSPCs
      upregulate NKG2D ligands inversely to the CD34+ percentage, NKG2D blockade
      improves clonogenic potential, and in vivo blockade ameliorates anemia in an
      FA mouse. The tension is real as an open question but is overstated as an
      incompatibility. NKG2D is also expressed on CD8+ T cells, the blockade
      readouts are HSPC clonogenicity and mouse anemia rather than patient NK
      lytic capacity, and reduced-but-nonzero lytic units against K562 targets do
      not exclude ligand-driven killing of autologous HSPCs in the marrow. The two
      models are separable by compartment and target, which is what the report's
      own discriminating test 3 sets out to do.
    citations:
      - PMID:35671096
      - PMID:21542827
      - PMID:28557197
  - claim_id: hpo-immune-annotation-absence
    statement: >-
      Fanconi anemia carries no NK, B cell, immunoglobulin, or immunodeficiency
      phenotype annotation, verified across three independent curation layers.
    disposition: QUALIFIED
    report_quote: >-
      confirming the absence across HPO disease-level, HPO gene-level, and a
      federated resource
    rationale: >-
      The absence itself holds, and I verified it rather than taking the log's
      word for it: re-querying the HPO disease node for OMIM:227650 returns 14
      categories and 35 terms with no Immunology category and none of HP:0040218,
      HP:0010976, HP:0002721, HP:0004313, HP:0002850, or HP:0001888; the FANCA,
      FANCC, and FANCD2 gene nodes return 130, 137, and 143 phenotypes with none
      of those six and with HP:0000010 present; Monarch returns exactly 34
      associations with HP:0001875 the only immune-adjacent one. Two things are
      wrong with the framing. The layers are not independent, since Monarch's
      disease-to-phenotype associations for this MONDO term derive from the same
      HPO annotation corpus, so the third check is corroboration by construction.
      And the committed log is a summary, not a response record: it presents four
      blood-category terms as the full returned set where the endpoint returns
      six, omitting HP:0001896 and HP:0000978, and the Monarch 34-term list it
      says was captured in provider output is not in the bundle. The claim is a
      curation gap in HPO, not a biological finding, and the report is right to
      present it that way.
    analysis_ids:
      - hpo-annotation-absence-check
      - monarch-federated-absence-check
  - claim_id: directional-concordance-tally-result
    statement: >-
      A committed, replayed sign-test tally shows that every cohort measuring a
      parameter reported it reduced, at denominators of 4/4, 3/3, and 3/3.
    disposition: REJECTED
    report_quote: >-
      every human cohort that measured a parameter reported it reduced
    rationale: >-
      Recomputing directly from the committed evidence matrix yields 5 of 5
      reduced for nk_count, 4 of 4 for nk_cytotox, and 3 reduced among 5 non-null
      b_count values. That reproduces neither the report's 4/4, 3/3, 3/3 nor the
      log's 4/5, 3/5, 3/5, and the log's stated cause, a NaN retained by pandas
      inflating the denominator, is not present in the file: the extra nk_count
      and nk_cytotox values are real "reduced" codes on a review row
      (PMID:34348001), which is not a measuring cohort at all. The "3/3 of
      measuring cohorts" for b_count is reachable only by excluding
      PMID:23889587, whose normal marrow lymphocyte proportions are a discordant
      observation rather than a non-measurement. The underlying direction of the
      literature is indeed consistent, and the report is commendably explicit
      that the p-values are under-powered and non-inferential; what is rejected
      is the tally as a computational result, since no code, environment,
      manifest, or output file is committed and the stated counts do not follow
      from the committed input.
    analysis_ids:
      - directional-concordance-tally
  - claim_id: artifact-bundle-completeness
    statement: >-
      The provider artifact bundle contains a canonical MANIFEST.yaml with
      checksums and a replay command, plus data, code, log, and environment
      directories.
    disposition: REJECTED
    report_quote: >-
      with `MANIFEST.yaml` (checksums, replay command), `data/`, `code/`,
      `logs/`, `env/`
    rationale: >-
      The committed bundle is five flat files: an HTML and a PDF rendering of the
      report, the evidence-matrix CSV, the database-source-checks log, and the
      PubMed search log. There is no MANIFEST.yaml, no code file, no environment
      record, and no reproducibility_tally output, so the log's claim to have
      confirmed a MANIFEST replay_verification entry cannot be checked either.
      `just validate-hypothesis-analysis-run` on the report and this directory
      fails with three problems: no exact ANALYSIS_STATUS line, no
      artifact_manifest_sha256 in the report frontmatter, and no MANIFEST.yaml. No
      manifest was created by this assessment, per the artifact policy: a
      report-manifest binding that an assessor manufactures after the fact would
      convert a provenance failure into a false success. The report's Limitations
      section does flag a stale manifest hash, so the run was partly aware of the
      problem, but a bundle described as containing code and a manifest and
      containing neither is a misstatement about the repository and not merely a
      staleness note.
    analysis_ids:
      - directional-concordance-tally

  - ../openscientist_artifacts/final_report.pdf
claims:
  - claim_id: intrinsic-fa-alveolar-oxidative-cytokine-fibrosis
    statement: >-
      Fanconi anemia interstitial lung disease reflects intrinsic oxidative and
      cytokine-mediated injury in FA-deficient alveolar epithelium, rather than
      transplant conditioning, infection, or environmental exposure.
    disposition: QUALIFIED
    report_quote: >-
      biologically plausible and now mechanistically specific, but the direct
      human evidence is n=1 and the entire lung-tissue causal chain is inferred
    rationale: >-
      This is the report's central, distinctive mechanism and it has no direct
      support. No FA lung tissue has ever been assayed for oxidative or cytokine
      markers, no FA pulmonary-fibrosis model exists, and the alveolar-epithelial
      edge is entirely inferred by analogy. Retain only as an EMERGING lead with
      the explicit caveat that the FA-lung-specific segment is unmeasured; do not
      promote to disease-YAML pathophysiology.
    citations:
      - PMID:9096763
      - PMID:42121854
  - claim_id: direct-human-evidence-single-confounded-case
    statement: >-
      The pulmonary-fibrosis phenotype in FA rests on a single 1997 case report
      in which the oxidative/cytokine mechanism is stated as conjecture and the
      patient carried major confounders.
    disposition: RETAINED
    report_quote: >-
      the oxidative/cytokine mechanism is explicitly stated as a conjecture
    rationale: >-
      Verified against the cached full abstract of PMID:9096763. The authors
      write the mechanism "may relate to oxidative injury and cytokine
      anomalies"; the 38-year-old patient had taken prednisone for interstitial
      lung disease and trimethoprim-sulfamethoxazole for sinusitis and had a
      smoking history (stopped at age 32, dyspnea from his late 20s); and the
      IFAR "contains no example of a similar pulmonary presentation." The
      report's characterization of the seed evidence is accurate and
      appropriately deflationary.
    citations:
      - PMID:9096763
  - claim_id: fa-intrinsic-oxidative-stress-arm
    statement: >-
      FA cells display intrinsic increased ROS, mitochondrial dysfunction, and
      defective redox-adaptive responses.
    disposition: QUALIFIED
    report_quote: >-
      increased ROS / mitochondrial dysfunction / defective redox adaptation
      (PMID:42121854, 31472450)
    rationale: >-
      Well supported as FA cell biology but not in lung. PMID:42121854 is a
      review that itself states the alterations are "particularly relevant in
      hematopoietic stem and progenitor cells" and that "most mechanistic
      insights derive from in vitro or patient-derived models, while animal
      models and longitudinal clinical studies remain insufficient";
      PMID:31472450 is mouse Fancd2-/- HSPCs. The oxidative arm is real but its
      relevance to alveolar epithelium is unestablished.
    citations:
      - PMID:42121854
      - PMID:31472450
  - claim_id: fa-tnf-cytokine-dysregulation-arm
    statement: >-
      FA cells overproduce TNF-alpha via a p38/MK2 pathway, evidencing intrinsic
      cytokine dysregulation.
    disposition: QUALIFIED
    report_quote: >-
      unrestrained TNF-α production via p38/MK2 (PMID:25534205, 22234699)
    rationale: >-
      Supported for hematopoietic lineages only. PMID:25534205 concerns FANCA
      bone-marrow cells and erythropoiesis; PMID:22234699 concerns FANCC/FANCA
      mononuclear phagocytes/macrophages. Neither examines lung epithelium or
      lung fibrosis, so the cytokine arm supports the general FA phenotype but
      not the pulmonary edge.
    citations:
      - PMID:25534205
      - PMID:22234699
  - claim_id: fa-tgfb-mir29a-intrinsic-driver
    statement: >-
      FA intrinsically hyperactivates TGF-beta and loses the anti-fibrotic
      miRNA miR-29a-3p, providing a specific druggable pro-fibrotic node.
    disposition: QUALIFIED
    report_quote: >-
      intrinsic hyperactivation of TGF-β with loss of the anti-fibrotic miRNA
      miR-29a-3p
    rationale: >-
      This is the report's strongest mechanistic bridge, but the evidence is not
      lung. I confirmed PMID:36441774 is a Fancd2-/- mouse embryo / HSPC study
      ("TGFβ pathway is required for viable gestation of Fanconi anemia
      embryos") and PMID:40555815 is FANCA lymphoblasts/fibroblasts
      ("Fibroblasts/metabolism"). The report itself flags both as "not lung
      tissue"/"not lung epithelium." Retain as a testable intrinsic driver whose
      tissue generalization to alveolar epithelium remains unconfirmed.
    citations:
      - PMID:36441774
      - PMID:40555815
  - claim_id: telomere-disorder-analogy-is-plausibility
    statement: >-
      The telomere-biology-disorder route to pulmonary fibrosis supports the
      hypothesis.
    disposition: QUALIFIED
    report_quote: >-
      The telomere-biology-disorder analogy invoked in the seed is real and
      mechanistically coherent
    rationale: >-
      This is external plausibility, not FA-lung evidence. The supporting
      papers describe different diseases: PMID:42035100 is idiopathic pulmonary
      fibrosis alveolar type II cell senescence, PMID:24504062 is a DKC1
      telomere disorder, PMID:25539146 is TINF2 familial pulmonary fibrosis. The
      report correctly labels each "strong analogy template; different disease."
      Useful as a conceptual template and a source of discriminating
      experiments, but it does not raise the direct evidentiary footing for FA.
    citations:
      - PMID:42035100
      - PMID:24504062
      - PMID:25539146
  - claim_id: competing-transplant-conditioning-explanation
    statement: >-
      Transplant conditioning (cyclophosphamide plus irradiation) reproduces the
      same alveolar-injury TNF-alpha/IL-1beta/TGF-beta axis and is a strong
      non-intrinsic competing explanation for FA lung disease.
    disposition: RETAINED
    report_quote: >-
      transplant conditioning (cyclophosphamide + irradiation) reproduces the
      exact TNF-α/IL-1β/TGF-β alveolar-injury axis (IPS; PMID:9276718)
    rationale: >-
      Verified against PMID:9276718, an allogeneic-BMT idiopathic-pneumonia model
      showing cyclophosphamide exacerbates irradiation-induced alveolar
      epithelial injury with elevated pro-fibrotic cytokines. Because
      conditioning, infection, and an intrinsic FA defect share a TNF/TGF-beta
      signature, the signature alone cannot attribute causation. This materially
      limits the intrinsic claim and is correctly identified by the report as the
      strongest competitor.
    citations:
      - PMID:9276718
  - claim_id: no-computational-analysis-run
    statement: >-
      The run was literature-only; no omics/statistical analysis was performed
      and the sandbox was used for infrastructure preflight only.
    disposition: RETAINED
    report_quote: >-
      No statistical or omics analysis was run
    rationale: >-
      Consistent with the report body, the environment record, and the search
      log. The intended computational analysis was deliberately skipped because
      no FA lung dataset was available; there was no attempted-then-hidden
      fallback. The literature retrieval itself (PubMed E-utilities) is a data
      source, not a computation.
  - claim_id: databases-not-queried-labeled-unverified
    statement: >-
      GEO, GTEx, cBioPortal, ClinVar, GenCC, and ClinGen were not queried this
      run, and those absences are labeled unverified rather than asserted as
      true absence.
    disposition: RETAINED
    report_quote: >-
      no GenCC/ClinGen lung-phenotype gene–disease assertion, no FA lung omics
      dataset, and no trial were queried this run
    rationale: >-
      The report is appropriately disciplined about the boundary between
      "searched and found nothing" and "not searched." These six databases are
      candidate future sources, not evidence of absence, and are not counted as
      data sources here. The five zero-result PubMed searches (queries
      #5/#8/#12/#14/#15) are the only bounded negative results and are recorded
      as SEARCHED_NO_RESULT.
    citations: []
  - claim_id: manifest-yaml-absent-from-bundle
    statement: >-
      The report claims the provider artifact bundle contains a checksummed
      MANIFEST.yaml, but no MANIFEST.yaml is present in the bundle.
    disposition: REJECTED
    report_quote: >-
      `MANIFEST.yaml` (checksums).
    rationale: >-
      Listing openscientist_artifacts/ shows only final_report.html,
      final_report.pdf, environment.md, evidence_matrix.csv, and search_log.md.
      No MANIFEST.yaml exists, so the report's own inventory overstates the
      bundle. This is a literature-only run with no accessed dataset and no
      analysis, so a canonical computational MANIFEST is not strictly required;
      the defect is the false claim of its presence, not its absence. The
      committed search log and evidence matrix are the substantive access
      records, and they are present and non-empty.
    citations: []

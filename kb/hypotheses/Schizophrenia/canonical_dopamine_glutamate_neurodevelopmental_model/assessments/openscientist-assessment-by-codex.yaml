hypothesis_id: canonical_dopamine_glutamate_neurodevelopmental_model
assessed_at: "2026-07-31T03:20:42Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's overall verdict is reasonable: genetic and synaptic convergence,
  associative-striatal presynaptic dopamine elevation, and substantial
  biological heterogeneity support retaining a broad canonical framework with
  important restrictions. The report nevertheless overstates several causal
  conclusions. A small prospective psychosis-transition study establishes
  temporality but not schizophrenia-specific causality; small and selected PET
  cohorts do not establish that 30% of all patients are dopamine-normal; a
  perineuronal-net review does not demonstrate replicated parvalbumin-cell
  primacy; pharmacological and autoimmune NMDA perturbations do not validate
  endogenous NMDA hypofunction as the primary lesion; and one cortical
  single-nucleus dataset cannot establish excitatory-neuron or mitochondrial
  primacy. Xanomeline-trospium shows that direct D2 antagonism is unnecessary,
  but muscarinic signaling can still influence dopamine release. Failed trials
  of particular glutamate agents likewise do not refute glutamate biology as a
  class.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: broad-canonical-verdict
    statement: >-
      A broad dopamine-glutamate-neurodevelopmental framework remains useful,
      but its component mechanisms and patient coverage are not uniformly
      validated.
    disposition: QUALIFIED
    report_quote: >-
      PARTIALLY SUPPORTED — pathophysiology validated, pharmacological
      predictions fractured
    rationale: >-
      The PARTIALLY_SUPPORTED direction is appropriate, but "pathophysiology
      validated" collapses evidence of different kinds and strengths. Human PET
      supports presynaptic dopamine elevation in a subset, while the endogenous
      NMDA-to-PV chain, C4A-mediated adolescent pruning, and ordering of
      excitatory, inhibitory, and metabolic changes remain inferred or
      model-dependent. A canonical organizing framework can be retained without
      treating every component as established.
    citations:
      - PMID:29301039
      - PMID:40162239
      - PMID:33190236
  - claim_id: associative-striatum-localization
    statement: >-
      Presynaptic dopamine elevation is more consistently localized to
      associative and sensorimotor than limbic striatum.
    disposition: RETAINED
    report_quote: >-
      this effect is driven by the **associative striatum** (g = 0.73, P =
      0.002) and sensorimotor striatum (g = 0.54, P = 0.005), but **not** the
      limbic striatum (g = 0.29, P = 0.09).
    rationale: >-
      The regional meta-analysis directly supports this correction to a simple
      mesolimbic formulation. It should still be expressed as a group-level PET
      result rather than a universal anatomical lesion in every patient.
    citations:
      - PMID:29301039
  - claim_id: dopamine-prospective-causality
    statement: >-
      Higher presynaptic dopamine synthesis before transition supports
      temporality but does not by itself establish dopamine as the cause of
      schizophrenia onset.
    disposition: QUALIFIED
    report_quote: >-
      This is among the strongest evidence supporting a causal role for
      dopamine in psychosis onset, as the elevation is detectable before
      clinical conversion.
    rationale: >-
      The prospective study followed 30 ultra-high-risk participants and
      observed nine transitions. It supports temporal ordering and association,
      but transition was to psychosis rather than a schizophrenia-specific
      endpoint, and an observational biomarker difference cannot exclude a
      shared upstream cause. "Supports a causal role" should be narrowed to
      "supports temporality and predictive association."
    citations:
      - PMID:21768612
  - claim_id: dopamine-normal-fraction
    statement: >-
      Dopamine synthesis is heterogeneous, particularly in
      treatment-resistant schizophrenia, but a 30% dopamine-normal population
      fraction is not established.
    disposition: QUALIFIED
    report_quote: >-
      This establishes that approximately 30% of patients do not fit the
      hyperdopaminergic profile, indicating the model applies to a biologically
      defined subtype, not universally.
    rationale: >-
      Small PET comparisons support lower synthesis in selected
      treatment-resistant groups, and two medication-free cohorts did not
      reproduce a case-control elevation. They do not estimate the prevalence
      of a dopamine-defined biotype in an unselected schizophrenia population.
      The report appears to transfer the approximate prevalence of treatment
      resistance to the prevalence of normal dopamine physiology.
    citations:
      - PMID:23034655
      - PMID:27857125
      - PMID:34789848
  - claim_id: pv-interneuron-replication
    statement: >-
      Perineuronal-net reductions support altered PV-associated circuitry but
      do not establish consistently replicated PV-interneuron loss or causal
      primacy.
    disposition: QUALIFIED
    report_quote: >-
      A systematic review of 7 postmortem studies found PNN density (which
      protects PV interneurons) consistently reduced in schizophrenia (6/7
      studies significant) across DLPFC and amygdala
    rationale: >-
      The cited systematic review concerns perineuronal-net density, not a
      direct meta-analysis of PV-interneuron number, function, or temporal
      primacy. PNN changes are biologically relevant to PV-associated circuits,
      but cannot be restated as replicated PV-cell deficits or proof that PV
      pathology is upstream.
    citations:
      - PMID:39018984
  - claim_id: endogenous-nmda-validation
    statement: >-
      NMDA-antagonist and anti-NMDA-receptor syndromes establish biological
      plausibility and phenocopy, not validation of primary endogenous NMDA
      hypofunction in schizophrenia.
    disposition: REJECTED
    report_quote: >-
      While pathophysiology is validated (ketamine model, MRS glutamate
      studies, gamma oscillation deficits),
    rationale: >-
      Exogenous receptor blockade and receptor-directed autoimmune disease can
      produce schizophrenia-like features, but neither demonstrates that
      endogenous cortical NMDA hypofunction is the initiating lesion in typical
      schizophrenia. MRS glutamate measures and gamma oscillations are not
      direct NMDA-receptor functional assays. The report itself acknowledges
      that primary versus secondary NMDA hypofunction remains unresolved.
    citations:
      - PMID:19198118
      - PMID:38685343
  - claim_id: karxt-d2-independence
    statement: >-
      Xanomeline-trospium efficacy shows that direct D2 antagonism is not
      required, but does not establish a dopamine-independent mechanism.
    disposition: QUALIFIED
    report_quote: >-
      This demonstrates that effective antipsychotic action can be achieved
      through a non-dopaminergic mechanism, fundamentally challenging the claim
      that D2 antagonism is necessary for antipsychotic efficacy.
    rationale: >-
      Placebo-controlled phase 3 evidence supports antipsychotic efficacy
      without direct D2-receptor antagonism, so the D2-necessity claim should be
      removed. "Non-dopaminergic mechanism" is stronger than the evidence:
      muscarinic M4 activation can reduce striatal dopamine release, and the
      report elsewhere recognizes that convergence on dopamine remains
      unresolved. PMID:41506001 is a 52-week open-label extension, not the
      pivotal placebo-controlled efficacy trial.
    citations:
      - PMID:38691387
      - PMID:27618677
      - PMID:41506001
  - claim_id: glutamate-trial-universality
    statement: >-
      Several major glutamate-targeted programs failed phase 3 endpoints, but
      those failures neither cover every glutamate-modulating intervention nor
      refute glutamate pathophysiology as a class.
    disposition: QUALIFIED
    report_quote: >-
      Despite strong pathophysiological rationale for glutamate involvement,
      every glutamate-modulating drug has failed in definitive Phase 3 trials:
    rationale: >-
      Primary trials support negative results for pomaglumetad and the CONNEX
      iclepertin program. The universal class statement is not justified by a
      selected list of targets, agents, populations, and endpoints, and target
      engagement and biological enrichment were not uniform. Trial failure
      qualifies therapeutic prediction; it is not a direct test of every
      endogenous glutamatergic mechanism.
    citations:
      - PMID:25539791
      - PMID:41233083
  - claim_id: excitatory-mitochondrial-primacy
    statement: >-
      A large dorsal-prefrontal single-nucleus dataset prioritizes excitatory
      neurons and mitochondrial-related transcriptional changes, but does not
      establish their causal primacy across schizophrenia.
    disposition: QUALIFIED
    report_quote: >-
      This challenges the model's emphasis on inhibitory (PV) interneuron
      pathology as the primary site of genetic risk, suggesting that excitatory
      neuron dysfunction and bioenergetic failure may be more proximal to
      genetic causation.
    rationale: >-
      The study directly supports cell-type-specific enrichment in the sampled
      cortical region and reports mitochondrial-related downregulated terms.
      Postmortem differential expression is vulnerable to state, treatment, and
      tissue effects, and genetic-risk enrichment depends on region, cell
      taxonomy, and analytic method. The result is a strong lead, not temporal
      proof that excitatory-neuron dysfunction or bioenergetic failure precedes
      PV changes.
    citations:
      - PMID:40162239
  - claim_id: multimodal-classifier-causality
    statement: >-
      A small multimodal classifier does not validate causal
      dopamine-glutamate-GABA interaction.
    disposition: REJECTED
    report_quote: >-
      This empirically validates the model's emphasis on
      dopamine-glutamate-GABA interaction rather than single-neurotransmitter
      models.
    rationale: >-
      The study's sample of 23 patients and predictive combination of imaging
      measures can show that multivariate features classify groups better in
      that dataset. Classification accuracy does not test biochemical
      interaction, directionality, mediation, or causal necessity, and requires
      independent external validation before use as a stable disease
      discriminator.
    citations:
      - PMID:37519478
  - claim_id: search-provenance
    statement: >-
      The claimed 164-paper evidence base cannot be reconstructed from the
      report's exposed citation inventory.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      164 papers were reviewed, primarily sourced through PubMed queries.
    rationale: >-
      The report metadata exposes 47 citations and does not provide the complete
      query history, screening log, or 164-record bibliography. The report can
      be assessed claim by claim, but its search-completeness and paper-count
      claims cannot be independently audited from the deposited artifact.

hypothesis_id: complement_synaptic_pruning_hypothesis
assessed_at: "2026-07-31T03:20:42Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report correctly preserves a partially supported verdict. Human genetics
  links C4 structural variation and predicted C4A expression to schizophrenia
  risk, and experimental mouse and patient-derived systems make a
  complement-related synaptic mechanism plausible. The complete human chain is
  not established: C4A-driven synaptic tagging, the relevant effector pathway,
  an adolescent disease-specific window, in-vivo human synapse loss, downstream
  dopamine changes, and symptom mediation have not been connected in one
  design. The report is particularly useful in identifying disagreement between
  CR3-dependent and CR3-independent mouse paradigms, but overstates that
  disagreement as universal contradiction and treats neurotypical bulk
  developmental expression as refutation of pathological adolescent activity.
  It also misstates the Sekar effect size, overinterprets TSPO, and incorrectly
  claims that no C4A genotype-symptom study exists. Current registry searches
  support the report's dated clinical-translation gap.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-partial-support
    statement: >-
      The C4A hypothesis has a supported genetic and experimental core, but the
      integrated human pruning mechanism remains unresolved.
    disposition: RETAINED
    report_quote: >-
      PARTIALLY SUPPORTED — with significant mechanistic revision required.
    rationale: >-
      The genetic association is robust and C4A overexpression can alter
      synapses in engineered systems. No longitudinal or perturbational human
      study connects predicted C4A expression to complement deposition,
      effector-cell activity, synapse loss, circuit change, dopamine physiology,
      and symptoms. Retaining EMERGING status and a partially supported verdict
      is appropriately calibrated.
    citations:
      - PMID:26814963
      - PMID:33353966
      - PMID:30718903
  - claim_id: c4a-genetic-core
    statement: >-
      Common C4 structural alleles associate with schizophrenia risk in
      proportion to predicted C4A expression.
    disposition: RETAINED
    report_quote: >-
      structurally diverse alleles of C4 genes associate with schizophrenia in
      proportion to their tendency to generate greater C4A expression
    rationale: >-
      The foundational study directly supports this wording across genetically
      inferred C4 structures and brain-expression models. It also localized C4
      to human synapses and established a role for mouse C4 in postnatal
      retinogeniculate refinement. Those additional observations support
      plausibility but do not themselves demonstrate excessive pruning in
      schizophrenia.
    citations:
      - PMID:26814963
  - claim_id: c4a-effect-size
    statement: >-
      The report's numerical characterization of a 1.27 per-unit-expression
      effect and sub-1% heritability contribution is not directly supported.
    disposition: QUALIFIED
    report_quote: >-
      The effect size is moderate for a GWAS locus (OR ~1.27 per unit increase
      in expression), placing it among the largest common-variant effects for
      schizophrenia
    rationale: >-
      Sekar et al. reported relative risks ranging from 1.00 to 1.27 across four
      common C4 structural alleles; 1.27 was not an odds ratio per unit of C4A
      expression. The paper did not estimate C4A's share of total
      schizophrenia heritability. The association is meaningful for a common
      locus, but both quantitative restatements require removal or a directly
      derived analysis.
    citations:
      - PMID:26814963
      - PMID:35396580
  - claim_id: mouse-c4a-overexpression
    statement: >-
      Human C4A overexpression can cause cortical synaptic and behavioral
      changes in mice, without establishing the same causal sequence in humans.
    disposition: QUALIFIED
    report_quote: >-
      C4A overexpression reduced cortical synapse density, increased microglial
      engulfment of synapses, and altered behavior.
    rationale: >-
      These are direct consequences of an engineered mouse perturbation and
      strongly support biological plausibility. Species, expression level,
      developmental context, and the imposed perturbation limit translation to
      naturally occurring human risk alleles and clinical schizophrenia.
    citations:
      - PMID:33353966
  - claim_id: patient-derived-engulfment
    statement: >-
      Patient-derived in-vitro systems show increased synapse elimination, with
      contributions from both neural and microglia-like compartments that are
      not fully explained by C4 risk.
    disposition: QUALIFIED
    report_quote: >-
      C4 risk variants were associated with increased neuronal complement
      deposition and synapse uptake,
    rationale: >-
      The report accurately preserves the key limitation of the reprogrammed
      cellular model. It is patient-derived support for a cellular phenotype,
      not an in-vivo observation of pruning, a developmental time course, or
      proof that C4A mediates disease risk through that phenotype.
    citations:
      - PMID:30718903
  - claim_id: cr3-mechanism-disagreement
    statement: >-
      Recent mouse C4-overexpression paradigms disagree about CR3 requirement,
      but do not establish mutually exclusive universal mechanisms.
    disposition: QUALIFIED
    report_quote: >-
      Two 2025–2026 studies report directly contradictory findings on how C4
      overexpression leads to synaptic loss, representing a critical unresolved
      mechanistic debate:
    rationale: >-
      One study found that CR3 deficiency rescued synaptic and microglial
      effects, while the other observed reduced spine density despite CR3
      deficiency and with C4 mutants lacking C3-convertase activity. This is a
      real conflict over CR3 necessity. The studies use different constructs,
      expression patterns, circuits, ages, and readouts, so parallel or
      context-dependent extracellular and intracellular mechanisms remain
      possible. Neither study identifies the operative human disease pathway.
    citations:
      - PMID:41903141
      - PMID:39227431
  - claim_id: adolescent-timing
    statement: >-
      Neurotypical prefrontal developmental profiles challenge, but do not
      refute, a pathological C4A-specific adolescent window.
    disposition: QUALIFIED
    report_quote: >-
      This directly challenges the hypothesis's claim that complement-mediated
      pruning occurs specifically during the adolescent period coinciding with
      schizophrenia onset.
    rationale: >-
      The human postmortem study found early peaks for bulk C1QB and C3
      transcripts, C4 protein, and CD11b in neurotypical prefrontal cortex. It
      did not separately measure C4A risk-genotype effects, complement
      deposition on synapses, pruning rate, or longitudinal changes in people
      who later developed schizophrenia. It is strong evidence against assuming
      a normal adolescent expression peak, not direct refutation of
      disease-specific activity or a delayed consequence of earlier exposure.
    citations:
      - PMID:33190236
  - claim_id: tspo-microglia-inference
    statement: >-
      Null or decreased TSPO findings qualify a widespread detectable
      microglial-activation model but do not directly test homeostatic or
      complement-mediated synapse remodeling.
    disposition: QUALIFIED
    report_quote: >-
      This challenges any model requiring widespread, detectable microglial
      activation in the schizophrenic brain, though it does not rule out subtle,
      regionally restricted, or phenotypically specific microglial changes.
    rationale: >-
      The report's narrative is appropriately self-qualified. The cited primary
      study shows that TSPO was not microglia-specific, did not track the tested
      activation markers, and was not induced in activated primary human
      microglia. TSPO results therefore qualify broad neuroinflammation claims
      but do not directly test C4A tagging, CR3 signaling, surveillance, or
      synaptic engulfment. The evidence matrix's stronger "Refutes" label for
      microglial activation should not be generalized to the complement-pruning
      mechanism.
    citations:
      - PMID:31699629
  - claim_id: inverse-autoimmune-pleiotropy
    statement: >-
      Opposing C4-allele effects in schizophrenia and systemic autoimmunity
      support C4 biology and sex-sensitive risk, not the synaptic-pruning
      effector chain.
    disposition: QUALIFIED
    report_quote: >-
      This inverse genetic relationship mediated by C4 copy number variation
      links the complement hypothesis to sex differences in disease prevalence
      and provides one of the strongest biological validations of the C4A
      pathway's clinical relevance.
    rationale: >-
      Large genetic datasets support opposing disease associations and stronger
      schizophrenia C4 effects in men. They do not measure brain C4A,
      complement-tagged synapses, microglial behavior, developmental pruning, or
      symptom mediation. The result validates pleiotropic C4 relevance, not the
      proposed neural effector mechanism.
    citations:
      - PMID:32499649
  - claim_id: glial-genetic-primacy
    statement: >-
      One orbitofrontal multi-omic analysis prioritizes glial and endothelial
      genetic effects, but does not establish glial predominance across
      schizophrenia.
    disposition: QUALIFIED
    report_quote: >-
      genetic risk predominantly affected glial and endothelial cells.
    rationale: >-
      The result is valid within the study's region, cohort, and analytic
      framework. A separate large dorsal-prefrontal single-nucleus analysis
      prioritized excitatory intratelencephalic neurons for genetic-risk
      enrichment. These findings may reflect region, assay, and analysis
      differences and should be represented as complementary dataset-specific
      leads rather than settled glial primacy.
    citations:
      - PMID:40053590
      - PMID:40162239
  - claim_id: maternal-immune-amplification
    statement: >-
      Maternal complement associations and a mouse maternal-immune-activation
      model motivate an interaction hypothesis but do not show amplification of
      inherited C4A risk.
    disposition: QUALIFIED
    report_quote: >-
      This gene-environment interaction may amplify the genetic C4A risk.
    rationale: >-
      The mouse study measured offspring C1q after maternal immune activation,
      and the small human study associated maternal C1q-related reactivity with
      later offspring psychosis. Neither stratified by C4A structural allele or
      predicted expression, measured C4A-mediated pruning, or formally tested a
      C4A-by-exposure interaction.
    citations:
      - PMID:28138113
      - PMID:25195065
  - claim_id: c4a-dopamine-gap
    statement: >-
      A direct C4A-to-dopamine parameter link has not been demonstrated in the
      literature located through the assessment date.
    disposition: RETAINED
    report_quote: >-
      No study has linked C4A variants to dopamine changes, making the
      complement → dopamine link entirely speculative.
    rationale: >-
      Targeted PubMed searches for C4/C4A, complement, dopamine, PET, and
      schizophrenia did not identify a study connecting C4A genotype or a
      complement-specific perturbation to a dopamine-system measurement as of
      2026-07-31. General dopamine heterogeneity does not refute the proposed
      link; the edge should remain an explicit missing link rather than a
      curated causal assertion.
  - claim_id: symptom-domain-literature-absence
    statement: >-
      The categorical claim that no C4A genotype-symptom study exists is
      incorrect.
    disposition: REJECTED
    report_quote: >-
      No study has correlated C4A genotype with positive, negative, or cognitive
      symptom severity.
    rationale: >-
      A 2024 schizophrenia/schizoaffective cohort tested C4 structural variation
      against symptom severity, age at onset, functioning, and sex, although
      results were preliminary and not a definitive symptom-mediated causal
      chain. Other studies link C4A expression or protein change to symptom
      measures, and small imaging studies link C4A copy number or genetically
      regulated expression to structural phenotypes. These data are limited and
      correlational, but they invalidate the claimed source-level absence.
    citations:
      - PMID:39084106
      - PMID:29449061
      - PMID:35985087
      - PMID:30026462
      - PMID:36882872
  - claim_id: complement-trial-absence
    statement: >-
      No complement-specific interventional schizophrenia trial was located in
      the registry search through the assessment date.
    disposition: RETAINED
    report_quote: >-
      No registered clinical trials targeting complement components (C4, C3,
      CR3 inhibitors) for schizophrenia prevention or treatment.
    rationale: >-
      ClinicalTrials.gov searches on 2026-07-31 for schizophrenia combined with
      complement, C4, C3, CR3, C1q, ANX005, and complement-inhibitor terms found
      no relevant complement-specific intervention. This is a dated
      translation-gap finding, not negative biological evidence and not a basis
      for assuming that a proposed inhibitor would be safe or efficacious.
  - claim_id: search-provenance

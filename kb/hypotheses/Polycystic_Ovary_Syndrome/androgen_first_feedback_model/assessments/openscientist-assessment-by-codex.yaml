claims:
  - claim_id: overall-partial-support
    statement: >-
      Androgen-sensitive ovarian and neuroendocrine mechanisms are supported,
      but the evidence does not establish a universal androgen-first origin for
      PCOS.
    disposition: RETAINED
    report_quote: >-
      **Verdict: PARTIALLY SUPPORTED**
    rationale: >-
      Human intervention, genetic, cellular, and model-organism studies support
      several component mechanisms. Temporal primacy is not demonstrated
      across heterogeneous PCOS, and metabolic evidence is bidirectional and
      context dependent. The report's overall category is appropriate only
      with these qualifications.
    citations:
      - PMID:28320971
      - PMID:31184707
      - PMID:32574161
      - PMID:42026183
  - claim_id: neuroendocrine-arm-strength
    statement: >-
      Androgen-sensitive neuroendocrine feedback is a credible component of
      PCOS, but it is not independently validated as the initiating mechanism.
    disposition: QUALIFIED
    report_quote: >-
      The **neuroendocrine arm** of the hypothesis is very strongly validated.
    rationale: >-
      Neuron-specific androgen-receptor deletion prevents reproductive and some
      metabolic features in a DHT mouse model, and flutamide can improve
      progesterone feedback sensitivity in selected patients. NK3-receptor
      antagonism demonstrates that tachykinin signaling can lower LH and
      testosterone, not that androgen exposure initiated the disorder.
      DENND1A.V2 experiments support intrinsic theca-cell steroidogenesis in
      vitro but likewise do not establish temporal primacy.
    citations:
      - PMID:28320971
      - PMID:17710731
      - PMID:27459523
      - PMID:31184707
  - claim_id: flutamide-insulin-resistance
    statement: >-
      The cited flutamide trials do not consistently show that androgen
      reduction leaves insulin resistance unchanged.
    disposition: REJECTED
    report_quote: >-
      Flutamide RCTs show no improvement in insulin resistance despite
      significant androgen reduction
    rationale: >-
      A four-week trial in 30 non-obese participants found lower androgens
      without a detected change in insulin resistance. In contrast, the cited
      12-month placebo-controlled trial in 76 overweight or obese participants
      reported improved insulin sensitivity with flutamide versus placebo. The
      report describes that second result as null, so its principal human
      intervention argument against an androgen-to-insulin-resistance effect is
      factually incorrect. Mouse hepatic-AR deletion also supports an
      androgen-sensitive metabolic effect in that model.
    citations:
      - PMID:15697072
      - PMID:16868063
      - PMID:34547140
  - claim_id: transgender-extrapolation
    statement: >-
      Long-term testosterone data outside PCOS weaken a simple universal
      pharmacologic claim but cannot adjudicate PCOS-specific causality.
    disposition: QUALIFIED
    report_quote: >-
      this evidence argues against a simple pharmacological effect of androgens
      on insulin resistance.
    rationale: >-
      The 57-person transmasculine cohort found little change in fasting glucose
      or insulin, but weight, BMI, waist circumference, android fat, and several
      lipid measures worsened. It was a single-center observational cohort
      without a PCOS counterfactual. Differences in developmental exposure,
      ovarian physiology, dose, and background susceptibility prevent using it
      to refute androgen effects in PCOS.
    citations:
      - PMID:42171672
  - claim_id: neuroendocrine-paradox-resolution
    statement: >-
      A central neuroendocrine loop has not been shown to reconcile all mouse
      and human metabolic findings.
    disposition: REJECTED
    report_quote: >-
      Our synthesis resolves this paradox: the metabolic effects operate
      through the **neuroendocrine feedback loop**
    rationale: >-
      No cited experiment tests the proposed mediation from hypothalamic AR
      through LH to metabolic regulation. The argument also depends on the
      erroneous premise that the longer flutamide trial did not improve insulin
      sensitivity. Suggestions that central pathways were incompletely
      antagonized and that the externally controlled HPG axis explains
      transgender findings are post hoc hypotheses, not demonstrated
      resolutions.
    citations:
      - PMID:16868063
      - PMID:28320971
  - claim_id: reproductive-subtype-mapping
    statement: >-
      The androgen-first model may be especially relevant to a reproductive
      cluster, but the cluster does not define a proven androgen-first subtype.
    disposition: QUALIFIED
    report_quote: >-
      The model best explains the lean/reproductive PCOS subtype (21–23% of
      cases) and is less applicable to the metabolic/obese subtype.
    rationale: >-
      Unsupervised clustering identified reproductive and metabolic groups in
      selected NIH-defined, predominantly European-ancestry cohorts. The
      reproductive group was not synonymous with all lean PCOS, the subtype
      GWAS was underpowered and not independently replicated in that paper, and
      cross-sectional clustering cannot assign causal order. The percentage
      should not be generalized as a stable population prevalence.
    citations:
      - PMID:32574161
  - claim_id: insulin-dependent-11oxyandrogens
    statement: >-
      Insulin can modulate 11-oxygenated-androgen biology in specific systems,
      but the evidence does not establish this as a general PCOS causal route.
    disposition: QUALIFIED
    report_quote: >-
      11-oxygenated androgens — now recognized as the most predictive androgens
      for PCOS diagnosis — are produced via insulin-dependent pathways
    rationale: >-
      The severe-insulin-resistance study involved 18 women with rare syndromes
      and distinguished adrenal from ovarian hyperandrogenemia. The AKR1C3
      result used an in-vitro adipocyte model. These findings motivate a
      bidirectional mechanism but do not show that insulin dependence explains
      11-oxygenated-androgen excess across common PCOS or that diagnostic
      discrimination establishes causal importance.
    citations:
      - PMID:35560164
      - PMID:35696182
      - PMID:39815717
  - claim_id: prenatal-two-hit-model
    statement: >-
      Prenatal AMH-androgen interaction is supported in mice but remains a
      developmental hypothesis for human PCOS.
    disposition: QUALIFIED
    report_quote: >-
      This unifies the AMH and androgen pathways mechanistically: AMH acts as a
      co-trigger whose effects are ultimately mediated through androgen
      receptor signaling.
    rationale: >-
      Prenatal-AMH phenotypes required androgen receptor signaling in
      kisspeptin cells in a mouse model. That experiment does not show that AMH
      and testosterone are necessary prenatal hits in humans, nor that this
      sequence initiates the full range of PCOS phenotypes.
    citations:
      - PMID:34529765
  - claim_id: search-provenance
    statement: >-
      The claimed review corpus and evidence-selection process are not
      reproducible from the delivered report.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Papers Reviewed:** 113
    rationale: >-
      The report exposes a much smaller set of citations and does not provide a
      complete search strategy, screening log, deduplicated bibliography, or
      study-level inclusion decisions for all 113 papers. The number should be
      treated as provider metadata, not as independently verified review
      coverage.

hypothesis_id: insulin_hyperinsulinemia_first_model
assessed_at: "2026-07-31T03:10:23Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report appropriately concludes that hyperinsulinemia is a co-driver
  rather than a universal first cause, and it identifies credible ovarian and
  adipose mechanisms. Its evidence audit contains material factual and
  inferential errors: rare INSR receptoropathies are generalized to common
  PCOS, the report incorrectly says PCOS GWAS do not identify insulin genes,
  overlooks an existing insulin-resistance Mendelian-randomization analysis,
  misstates NK3-antagonist trial outcomes, and treats a heterogeneous
  gonadotropin meta-analysis as definitive causal proof. The component
  mechanism remains partially supported after those claims are corrected.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: co-driving-not-universal
    statement: >-
      Hyperinsulinemia can amplify ovarian androgen production and contribute
      to PCOS, but available evidence does not make it the universal initiating
      event.
    disposition: RETAINED
    report_quote: >-
      **Verdict: PARTIALLY SUPPORTED — validated as a co-driving parallel
      pathway, not a universal primary cause.**
    rationale: >-
      Human intervention, rare receptoropathy, cellular, and genetic evidence
      supports a causal contribution from insulin resistance and
      hyperinsulinemia. Neuroendocrine, ovarian, adiposity-related, and
      developmental mechanisms can vary independently, so the narrower
      co-driver conclusion is more defensible than an insulin-first model for
      all PCOS.
    citations:
      - PMID:17559844
      - PMID:25304843
      - PMID:26312838
      - PMID:26416764
      - PMID:42026183
  - claim_id: insr-natural-experiment
    statement: >-
      Rare INSR receptoropathies show that severe hyperinsulinemia can promote
      hyperandrogenism, not that it is sufficient for common PCOS.
    disposition: QUALIFIED
    report_quote: >-
      INSR mutation natural experiments proving hyperinsulinemia alone is
      sufficient to produce severe hyperandrogenism
    rationale: >-
      The cited mechanistic study included three women with pathogenic INSR
      mutations, alongside ten women with PCOS and ten controls. It supports
      insulin regulation of adipose AKR1C3 and hyperandrogenism in extreme
      monogenic insulin resistance. It does not isolate hyperinsulinemia as the
      sole cause, establish the full PCOS phenotype, or justify extrapolation
      from receptoropathy to common polygenic PCOS.
    citations:
      - PMID:26312838
  - claim_id: diazoxide-causal-scope
    statement: >-
      Short-term insulin suppression supports an insulin contribution to
      androgen excess in selected lean PCOS, but not universal temporal
      primacy.
    disposition: QUALIFIED
    report_quote: >-
      diazoxide studies showing even physiological insulin levels contribute to
      androgen excess in lean PCOS women with normal metabolic insulin
      sensitivity
    rationale: >-
      The cited prospective experiment involved nine lean women, eight days of
      diazoxide, and no concurrent randomized control group. Reduced insulin
      was accompanied by lower androgen measures and higher SHBG, supporting a
      contribution under those conditions. The design cannot establish that
      insulin initiated PCOS or generalize the magnitude beyond this selected
      cohort.
    citations:
      - PMID:17559844
  - claim_id: insulin-gwas-absence
    statement: >-
      PCOS genetics does include an INSR locus and cannot be summarized as
      excluding insulin-pathway genes.
    disposition: REJECTED
    report_quote: >-
      GWAS does NOT point to insulin genes
    rationale: >-
      A primary Han Chinese PCOS GWAS identified a genome-wide-significant
      19p13.3 locus containing INSR and reported enrichment involving insulin
      signaling. Subsequent systems-genetics work functionally prioritized the
      INSR region. Newer large-scale genetics supports both metabolic and
      reproductive or hormonal biology. The report's absolute negative claim
      is therefore false, even though no single locus makes insulin the
      universal first cause.
    citations:
      - PMID:22885925
      - PMID:26305227
      - PMID:42026183
  - claim_id: nk3-trial-comparison
    statement: >-
      NK3-receptor-antagonist trials support a neuroendocrine component but do
      not provide the reported insulin-independent 28–52% testosterone
      contrast.
    disposition: REJECTED
    report_quote: >-
      two independent RCTs of NK3R antagonists reducing testosterone 28-52%
      without affecting insulin
    rationale: >-
      In the AZD4901 trial, 52% was the reduction in LH area under the curve;
      testosterone fell 28.7%. The fezolinetant paper reports an absolute
      testosterone change rather than a 52% reduction. Neither trial was
      designed as a mechanistic test showing that insulin was unchanged and
      irrelevant. The trials establish that NK3-receptor perturbation can lower
      gonadotropin or androgen endpoints, not that the pathways are independent.
    citations:
      - PMID:27459523
      - PMID:34000049
  - claim_id: metformin-parallel-proof
    statement: >-
      Average null gonadotropin effects in a heterogeneous metformin
      meta-analysis do not definitively prove parallel causal pathways.
    disposition: REJECTED
    report_quote: >-
      This definitively proves that insulin and neuroendocrine pathways operate
      in parallel
    rationale: >-
      The cited synthesis pooled 51 trials but reported high heterogeneity for
      LH and FSH, sensitivity of the LH result to one study, and no direct
      measurement of GnRH or LH pulse frequency. Circulating gonadotropin
      averages after metformin cannot establish causal independence, especially
      when dose, phenotype, duration, weight change, and assay timing vary.
    citations:
      - PMID:41891336
  - claim_id: low-ir-subtype-causality
    statement: >-
      A cross-sectional lower-HOMA-IR cluster does not identify the largest
      PCOS subtype as neuroendocrine-driven.
    disposition: QUALIFIED
    report_quote: >-
      the largest PCOS subtype (~43% of patients) having low insulin resistance
      but high neuroendocrine markers
    rationale: >-
      The cited single-center clustering study included 975 NIH-defined
      participants and described a 43.3% cluster with lower relative BMI and
      HOMA-IR. Its androgen pattern was mixed, and clustering of contemporaneous
      measurements cannot establish a neuroendocrine driver, causal sequence,
      stable biological subtype, or prevalence outside the sampled population.
    citations:
      - PMID:41180187
  - claim_id: insulin-resistance-mr-absence
    statement: >-
      Mendelian-randomization evidence specifically addressing insulin
      resistance and PCOS existed before the report.
    disposition: REJECTED
    report_quote: >-
      Existing MR studies have focused on BMI, SHBG, and testosterone;
      insulin-specific instruments needed
    rationale: >-
      A 2015 primary GWAS and Mendelian-randomization analysis reported evidence
      that higher insulin resistance causally increases PCOS risk. Instrument
      validity and phenotype definitions still require scrutiny, but the
      report's claim that insulin-specific causal work is absent is incorrect.
      A 2026 large-scale PCOS genetics study also discusses fasting insulin
      among causal risk factors identified by prior work.
    citations:
      - PMID:26416764
      - PMID:42026183
  - claim_id: theca-cell-ontology
    statement: >-
      CL:0002174 should not be used as a precise identifier for ovarian theca
      interna cells.
    disposition: REJECTED
    report_quote: >-
      Ovarian theca interna cells (CL:0002174)
    rationale: >-
      CL:0002174 denotes a follicular cell of the ovary, a broader class.
      CL:0000503 denotes a theca cell. Any more specific theca-interna mapping
      should be confirmed against the current ontology rather than inferred
      from the report.
  - claim_id: search-provenance
    statement: >-
      The claimed review corpus and evidence-selection process are not
      reproducible from the delivered report.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      **Scope:** 147 papers reviewed across 5 investigative iterations
    rationale: >-
      The report does not provide the complete 147-record corpus, executable
      search strategies, a screening log, or study-level inclusion decisions.
      The count is provider metadata and should not be treated as independently
      verified systematic-review coverage.

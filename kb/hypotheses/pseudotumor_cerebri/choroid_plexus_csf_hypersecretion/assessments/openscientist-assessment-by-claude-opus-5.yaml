analyses:
  - analysis_id: evidence-matrix-and-gap-tabulation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual assembly of a 24-row evidence matrix scoring each retrieved paper
      by evidence type, direction toward the seed hypothesis, mechanistic claim
      tested, key finding, disease context, and a provider-assigned confidence
      grade, followed by a seven-entry knowledge-gap table and a five-entry
      discriminating-test list.
    comparison: >-
      Each retrieved paper against the three hormonal arms of the seed
      hypothesis (11-beta-HSD1, androgen, GLP-1) and against five competing or
      complementary models.
    input_data_source_ids:
      - pubmed-literature-corpus
    status_reason: >-
      The report embeds six figure placeholders (arm_evidence_comparison.png,
      expanded_mechanistic_model.png, mechanistic_causal_chain.png,
      evidence_matrix.png, knowledge_gap_matrix.png,
      final_assessment_summary.png) but no openscientist_artifacts directory
      exists; the hypothesis folder contains only openscientist.md and its
      citations sidecar. No code, table, or intermediate output is committed, so
      the tabulation cannot be replayed.
    limitations: >-
      Confidence grades are provider-assigned with no stated rubric, so "Strong
      preclinical" and "Moderate" are not comparable across rows. Two matrix
      rows misdescribe their source: the testosterone rat study is credited with
      a Na+/K+-ATPase finding it attributes to NKCC1, and the exendin-4 study is
      credited with a CSF secretion measurement in rats that it made only in
      cell culture.
  - analysis_id: five-iteration-literature-screen
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      A declared five-iteration autonomous screen of 91 papers, from which the
      cited subset was selected.
    input_data_source_ids:
      - pubmed-literature-corpus
    status_reason: >-
      Neither the 91-paper set nor the iteration boundaries can be recovered
      from the committed material, which lists 41 citations. Nothing records
      which papers were screened out or on what criterion.
claims:
  - claim_id: glp1-arm-strongest-support
    statement: >-
      Of the three hormonal arms, GLP-1 receptor signalling at the choroid
      plexus has the strongest and most direct support, combining receptor
      expression and functional data in choroid plexus with a randomized human
      trial showing rapid, weight-independent ICP reduction.
    disposition: RETAINED
    report_quote: >-
      The GLP-1 receptor agonist pathway represents the most robust evidence
      supporting the choroid plexus hypersecretion model.
    rationale: >-
      Source checking supports this ranking. The rat study demonstrates GLP-1R
      expression in choroid plexus by tissue section and cell culture, shows
      exendin-4 activation blocked by exendin 9-39, and reports that acute
      exendin-4 reduced Na+/K+-dependent adenosine triphosphatase activity in
      cell cultures, with a GLP-1R-mediated ICP reduction in hydrocephalic rats.
      The exenatide RCT abstract supports rapid ICP lowering. The meta-analysis
      independently reports that no association was detected between GLP-1 RAs
      and body mass index, which is a stronger statement of weight independence
      than the report itself extracts.
    citations:
      - PMID:28835515
      - PMID:36907221
      - PMID:40937960
  - claim_id: exendin4-csf-secretion-overstatement
    statement: >-
      The report states that exendin-4 reduces both Na+/K+-ATPase activity and
      CSF secretion in rats.
    disposition: QUALIFIED
    report_quote: >-
      showing that exendin-4 reduces Na⁺/K⁺-ATPase activity and CSF secretion in
      rats, effects blocked by the GLP-1R antagonist exendin 9-39
    rationale: >-
      The cited study measured Na+/K+-dependent ATPase activity in choroid
      plexus cell cultures and measured intracranial pressure, not CSF secretion
      rate, in rats. The antagonist block applies to receptor activation in
      culture. The direction of the finding is right and it remains good support
      for the node, but as written the sentence promotes an in vitro enzyme
      readout and an in vivo pressure readout into a measured rodent secretion
      rate, which the paper does not report.
    citations:
      - PMID:28835515
  - claim_id: androgen-arm-choroid-plexus
    statement: >-
      Human choroid plexus expresses the androgen receptor together with the
      androgen-activating enzyme AKR1C3, and testosterone raises Na+/K+-ATPase
      activity in a rat choroid plexus cell line, giving the androgen arm a
      concrete tissue-level mechanism.
    disposition: RETAINED
    report_quote: >-
      In rat choroid plexus cell lines, testosterone significantly enhanced
      Na⁺/K⁺-ATPase activity, and IIH patients were shown to have a unique
      androgen excess signature with choroid plexus expressing both androgen
      receptor and the androgen-activating enzyme AKR1C3
    rationale: >-
      Verified against the source, which states that human choroid plexus
      expressed the androgen receptor alongside aldoketoreductase type 1C3 and
      that testosterone significantly enhanced Na+/K+-ATPase activity in a rat
      choroid plexus cell line. The same study reports increased serum
      testosterone with increased CSF testosterone and androstenedione in IIH
      women, distinct from PCOS and simple obesity. This is the one arm of the
      seed hypothesis with no representation at all in the disease entry, so it
      is a genuine curation lead rather than a restatement.
    citations:
      - PMID:30753168
  - claim_id: testosterone-nkcc1-misattribution
    statement: >-
      The report attributes the testosterone-driven rise in rat CSF secretion
      rate to increased choroid plexus Na+/K+-ATPase activity.
    disposition: REJECTED
    report_quote: >-
      In vivo, chronic testosterone treatment in lean female rats elevated ICP
      by 55% and CSF secretion rate by 85%, associated with increased choroid
      plexus Na⁺/K⁺-ATPase activity
    rationale: >-
      The cited study reports the ICP and secretion-rate figures correctly, but
      attributes them to increased activity of the choroid plexus
      Na+,K+,2Cl- cotransporter NKCC1, not to Na+/K+-ATPase. The substitution
      matters here because Na+/K+-ATPase is the transporter the seed hypothesis
      names, so the error manufactures agreement between an independent rodent
      result and the seed model. Curated content must cite the NKCC1 finding as
      the paper states it.
    citations:
      - PMID:37328884
  - claim_id: obesity-acts-via-drainage-not-secretion
    statement: >-
      In rodent models, obesity by itself raises ICP through reduced CSF
      drainage capacity rather than through increased secretion, so hypersecretion
      is not established as the route from adiposity to raised pressure.
    disposition: RETAINED
    report_quote: >-
      A pivotal finding that qualifies the entire hypersecretion model: high-fat
      diet (HFD)-fed female Wistar rats showed increased ICP (65%) with
      increased CSF outflow resistance (50%) but *without* altered CSF secretion
      rate or choroid plexus gene expression
    rationale: >-
      Verified verbatim against the source abstract. The companion Zucker-rat
      study reinforces it from the other direction: obese rats showed no change
      in ICP or CSF dynamics, and adjuvant testosterone raised the secretion
      rate without raising ICP because drainage capacity was elevated. Together
      these are the sharpest available qualification of the seed claim that
      hypersecretion is the primary driver, and neither is in the disease entry.
    citations:
      - PMID:37328884
      - PMID:38273331
  - claim_id: no-direct-human-csf-secretion-measurement
    statement: >-
      CSF secretion rate has never been measured directly in human IIH patients,
      so the hypothesis's core physiological claim is untested in the disease it
      is about.
    disposition: RETAINED
    report_quote: >-
      no direct measurement of CSF secretion rate in human IIH patients has ever
      been performed
    rationale: >-
      Consistent with every secretion-rate measurement in the cited corpus,
      which comes from ventriculo-cisternal perfusion or comparable invasive
      rodent preparations. The human evidence in the corpus is pharmacological
      ICP response, tissue expression, and circulating hormone profiling. The
      absence is not backed by a committed search log, so it is recorded as a
      literature-consistent gap rather than a verified negative, but it is the
      right frame for the entry: the secretory arm is a model-system claim
      awaiting human validation.
    citations:
      - PMID:32036786
      - PMID:37328884
      - PMID:38273331
  - claim_id: 11bhsd1-arm-one-sided
    statement: >-
      The report treats the AZD4017 trial's missed primary endpoint as
      materially weakening the 11-beta-HSD1 arm.
    disposition: QUALIFIED
    report_quote: >-
      The 11β-HSD1 arm is the most weakened component of the hypothesis. The
      IIH:DT phase II RCT of AZD4017 (n~30, 12 weeks) did not meet its primary
      endpoint of reducing ICP
    rationale: >-
      The missed endpoint is accurate: lumbar puncture pressure at 12 weeks did
      not differ significantly between arms. But the report omits the parts of
      the same abstract that cut the other way. In vivo biomarkers demonstrated
      significant enzyme inhibition, and the reduction in serum
      cortisol:cortisone ratio correlated significantly with the reduction in
      lumbar puncture pressure. An exploratory within-group analysis found a
      significant fall in the AZD4017 arm alone. Independent work shows elevated
      systemic and adipose 11-beta-HSD1 activity in IIH beyond that mediated by
      obesity, and weight-loss reduction in global activity correlating with ICP
      reduction. A negative trial in 31 women does not make this the "most
      weakened" arm so much as an underpowered one with on-target
      pharmacodynamics.
    citations:
      - PMID:32954315
      - PMID:20826586
      - PMID:35584002
  - claim_id: androgen-csf-compartment-contradiction
    statement: >-
      A 1991 study of pseudotumor cerebri patients found the opposite CSF
      steroid pattern to the modern androgen-excess signature, with decreased
      CSF androstenedione and increased CSF estrone confined to the CSF
      compartment.
    disposition: QUALIFIED
    report_quote: >-
      a 1991 study of PTC patients found the *opposite* CSF steroid pattern:
      decreased CSF androstenedione and increased CSF estrone, confined to the
      CSF compartment
    rationale: >-
      Accurately reported. The source studied five PTC patients of mixed sex
      against twelve controls using radioimmunoassay after celite
      chromatography, found the imbalance confined to CSF with normal plasma
      values, and found no correlation between pressure levels and the steroid
      pattern. The direction genuinely conflicts with the modern finding of
      increased CSF testosterone and androstenedione in IIH women. But the
      authors themselves state their data do not lead to any definitive
      conclusion, and a five-patient mixed-sex RIA study from 1991 is not
      weighted equally against a matched mass-spectrometry cohort. It belongs in
      the entry as an unresolved compartment question, not as a refutation.
    citations:
      - PMID:2061573
      - PMID:30753168
  - claim_id: androgens-modify-onset-not-severity
    statement: >-
      Circulating androgens in IIH women track age at diagnosis rather than BMI,
      disease duration, or severity, so androgens may modify onset rather than
      drive disease activity.
    disposition: RETAINED
    report_quote: >-
      in 51 IIH women, increased testosterone and bioavailable testosterone
      correlated with younger age of diagnosis but not with BMI, disease
      duration, or disease severity
    rationale: >-
      Verified against the source, which reports that increased testosterone,
      bioavailable testosterone and androstenedione were positively related to
      younger age of diagnosis in patients diagnosed after age 25, with no
      correlation to disease duration, waist-to-hip ratio, or BMI, and concludes
      that circulating androgens are associated with earlier onset. This is a
      real constraint on the androgen arm's causal reading and is compatible
      with, not contradicted by, the tissue-level mechanism.
    citations:
      - PMID:23713489
  - claim_id: venous-stenosis-not-purely-secondary
    statement: >-
      A substantial minority of IIH patients have intrinsic venous sinus
      stenosis that does not reverse when pressure is normalized, which the seed
      hypothesis's framing of stenosis as a purely secondary feedback
      consequence does not cover.
    disposition: RETAINED
    report_quote: >-
      However, 37% of patients have *intrinsic* stenosis that does not reverse
      with pressure normalization, representing a primary anatomical contributor
      not explained by the hypersecretion model.
    rationale: >-
      The 63/37 split is verified, though the source is incidental to its own
      question: a 70-patient prospective series about vein of Labbe drainage
      after venous sinus stenting, which records that stenosis was extrinsic in
      63% and intrinsic in 37%. The claim that intrinsic stenosis does not
      reverse comes from the background section of a review, not from a measured
      cohort, so it is a field convention rather than a result. Both facts
      belong on the entry's existing cause-versus-consequence discussion rather
      than being asserted as a new mechanism.
    citations:
      - PMID:30219791
      - PMID:37410913
  - claim_id: inflammatory-arm-addition
    statement: >-
      Inflammatory cytokine signalling should be added as a fourth arm of the
      secretory mechanism, on the strength of a distinct immune signature in IIH
      and direct cytokine stimulation of CSF secretion in rats.
    disposition: QUALIFIED
    report_quote: >-
      A prospective case-control study of 100 IIH patients identified distinct
      inflammatory alterations with a disease-associated immune signature in
      both serum and CSF
    rationale: >-
      The human study is real and reasonably sized, but its abstract reports
      only that distinct inflammatory alterations were observed, with no
      direction, effect size, or analyte named, so it cannot ground a
      mechanistic node. The rodent link is more specific but narrower than the
      report implies: TNF-alpha raised CSF secretion by 137% in control rats
      only and not in high-fat-diet rats, while hydrocortisone raised it in both
      groups. The hydrocortisone result is on-hypothesis, since local
      glucocorticoid regeneration is exactly what the 11-beta-HSD1 arm posits,
      and is worth curating. A standalone inflammatory pathophysiology node is
      premature on this evidence.
    citations:
      - PMID:42214536
      - PMID:32036786
  - claim_id: glymphatic-competing-model
    statement: >-
      A glymphatic and interstitial-fluid dyshomeostasis model competes with the
      hypersecretion model, explaining raised pressure through impaired ISF
      clearance and consequent extramural sinus compression.
    disposition: RETAINED
    report_quote: >-
      A 2026 review proposes a unified disease model where obesity-mediated
      metabolic dysfunction causes impaired glymphatic clearance, leading to
      accumulation of brain interstitial fluid (ISF), increased brain volume,
      extramural compression of dural venous sinuses, and a positive feedback
      loop
    rationale: >-
      Verified against the review, whose stated proposal matches the report's
      summary closely. It is a synthesis rather than a primary result, but human
      imaging in 55 IIH patients gives it a foothold: optic nerve sheath
      dilation was associated with increasing normalized choroid plexus volume
      and with declining glymphatic clearance on DTI-ALPS in the same cohort.
      The disease entry names glymphatic dysfunction only inside the prose of a
      discussion rationale, so this is a genuinely absent alternative worth
      recording as such.
    citations:
      - PMID:41472646
      - PMID:39585390
  - claim_id: ninety-one-paper-evidence-base
    statement: >-
      The report declares an evidence base of 91 papers screened across five
      investigative iterations.
    disposition: REJECTED
    report_quote: >-
      91 papers reviewed across 5 investigative iterations
    rationale: >-
      Not reconstructable from the committed material. The citation sidecar
      lists 41 PMIDs and the report frontmatter records citation_count 41. No
      screening log, iteration boundary, or excluded-paper list exists, and the
      six referenced figures are not committed anywhere under the hypothesis
      directory. The number is a provenance assertion the run cannot support and
      should not be repeated as a measure of coverage.
  - claim_id: status-retain-emerging
    statement: >-
      The hypothesis should keep EMERGING status, with arm-level scope
      annotations rather than a single grade.
    disposition: RETAINED
    report_quote: >-
      Current status **EMERGING** should be **retained** but with refined scope
      annotations
    rationale: >-
      Agreed, and no status change was made. The asymmetry across arms is real,
      but the schema grades a hypothesis, not its arms, and the strongest arm
      still rests on a 16-patient trial plus rodent mechanism with no human
      secretion measurement. The arm-level detail is better carried by evidence
      items and a model-mismatch discussion than by promoting the whole
      hypothesis.

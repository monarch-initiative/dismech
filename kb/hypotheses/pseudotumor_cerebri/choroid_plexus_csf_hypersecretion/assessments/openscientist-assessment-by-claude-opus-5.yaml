source_report: ../openscientist.md
hypothesis_id: choroid_plexus_csf_hypersecretion
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report does real work beyond restating the seed: it separates the
  hypothesis into three hormonal arms and grades them differently, and it
  surfaces the rodent result that most sharply qualifies the seed claim of
  primacy. Checked against the cited primary sources, the GLP-1 arm holds up
  (GLP-1R is expressed on choroid plexus epithelium, exendin-4 lowers
  Na+/K+-ATPase activity in choroid plexus cell culture and lowers ICP in rats,
  exenatide lowers ICP within 2.5 h in a phase II RCT, and a 1,550-patient
  meta-analysis finds no association with BMI). The androgen arm holds up at the
  tissue level (human choroid plexus expresses androgen receptor and AKR1C3;
  testosterone raises Na+/K+-ATPase activity in a rat choroid plexus cell line)
  but not at the level of causal primacy. Two report claims fail source
  checking. The rat testosterone study attributes the raised secretion rate to
  the NKCC1 cotransporter, not to Na+/K+-ATPase as the report states, and the
  report describes the exendin-4 study as measuring CSF secretion in rats when
  what it measured in rats was ICP. The report is also one-sided on 11-beta-HSD1,
  reporting the missed primary endpoint while omitting that the same trial
  demonstrated target engagement whose magnitude correlated with the fall in
  lumbar puncture opening pressure. The declared evidence base of 91 papers
  cannot be reconstructed from a 41-entry citation manifest, and none of the six
  referenced figures is committed.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

claims:
- claim_id: multi-mechanism-reframing
  statement: Hypersecretion is a plausible component rather than an established universal
    initiating mechanism.
  disposition: RETAINED
  report_quote: requires reframing as one component of a multi-mechanism disease model.
  rationale: The clinical trials measure ICP, rodent studies distinguish secretion from
    drainage, and the venous literature supports feedback and anatomical heterogeneity.
    Retaining EMERGING and representing parallel outflow mechanisms is justified.
  citations:
  - PMID:36907221
  - PMID:37328884
  - PMID:38273331
  - PMID:37410913
- claim_id: exenatide-effect-and-alpha
  statement: Exenatide lowers ICP rapidly in a small randomized human trial.
  disposition: QUALIFIED
  report_quote: against a pre-specified alpha of 0.1
  rationale: The report accurately identifies n=16 (15 completers), the acute effects, and the
    prespecified alpha=0.1. The 12-week P=0.058 does not meet a conventional 0.05 threshold.
    Rapid onset argues against mediation solely by weight loss, but ICP reduction does not
    directly measure human choroid plexus secretion or prove that hypersecretion initiated
    disease.
  citations:
  - PMID:36907221
- claim_id: glp1-deficiency-not-established
  statement: Obesity-related endogenous GLP-1 deficiency is upstream of IIH hypersecretion.
  disposition: REJECTED
  report_quote: ↓ GLP-1 signaling
  rationale: Agonist-mediated target engagement and pressure reduction do not demonstrate
    deficient endogenous GLP-1 signaling in untreated IIH. The cited cell and rat study
    establishes inhibition of a secretory pump and reduced ICP after pharmacological agonism.
    The revised YAML removes the seed’s opposite-direction GLP-1 causal claim and places
    agonism on an inhibitory treatment link.
  citations:
  - PMID:28835515
  - PMID:36907221
- claim_id: glp1-meta-analysis
  statement: The meta-analysis supports promising clinical associations without establishing
    secretory causation.
  disposition: QUALIFIED
  report_quote: a 2025 meta-analysis of 1,550 patients showing GLP-1 RAs reduce papilledema
    risk by 75%
  rationale: The pooled risk ratio is a treatment association, not a 75% causal risk reduction
    proven in a randomized population. Predominantly observational studies, comparator
    differences and possible cohort overlap limit inference. A subsequent 2026 synthesis
    likewise grades the largely observational evidence as low-certainty with moderate to
    serious confounding risk.
  citations:
  - PMID:40937960
  - PMID:41246926
  - PMID:41057780
  - PMID:42619634
- claim_id: migraine-population
  statement: Liraglutide improvement in obese migraine is direct support for an IIH secretory
    mechanism.
  disposition: REJECTED
  report_quote: a liraglutide pilot in obese migraine patients showed dramatic headache
    reduction
  rationale: The report names the correct non-IIH population, but then uses it as mechanistic
    support for IIH. An uncontrolled migraine headache response with minimal BMI change cannot
    establish IIH efficacy, ICP lowering, or choroid plexus-mediated secretion inhibition. Keep
    it as external plausibility only; no IIH disease-evidence item was promoted.
  citations:
  - PMID:40525593
- claim_id: androgen-human-compartments
  statement: The modern androgen study evaluated only systemic excess, leaving relevant CSF
    exposure unknown.
  disposition: REJECTED
  report_quote: Whether systemic androgen excess translates to relevant choroid plexus exposure
    is unknown.
  rationale: PMID:30753168 measured both systemic and CSF androgen metabolomes and reported
    increased CSF testosterone and androstenedione. The proposed need for CSF profiling is
    reasonable as replication, not as a measurement never performed. The 1991 five-patient
    mixed-sex study is a discrepant androstenedione finding, not a wholesale refutation of
    testosterone excess or a simple systemic-versus-CSF distinction.
  citations:
  - PMID:30753168
  - PMID:2061573
- claim_id: testosterone-nkcc1
  statement: Chronic testosterone raises CSF secretion in rats through increased Na+/K+-ATPase
    activity.
  disposition: REJECTED
  report_quote: associated with increased choroid plexus Na⁺/K⁺-ATPase activity
  rationale: The cited chronic Wistar-rat study explicitly reports increased NKCC1
    cotransporter activity. Its discussion says the prior cell-line Na+/K+-ATPase finding was
    not replicated in ex vivo choroid plexus. The earlier cell-line result remains valid in its
    own model, but substituting the pump for NKCC1 creates false mechanistic convergence.
  citations:
  - PMID:37328884
  - PMID:30753168
- claim_id: androgen-modifier
  statement: Age-of-onset associations establish that androgens are modifiers rather than
    initiating drivers.
  disposition: QUALIFIED
  report_quote: androgens may be a disease modifier rather than a primary causal driver
  rationale: The observational 51-woman cohort supports association with earlier onset and not
    with disease duration or BMI. It does not exclude a causal initiating role, and the
    abstract does not establish all claimed severity-negative results. Retain the limited
    observational finding without using a null correlation as evidence against every causal
    role.
  citations:
  - PMID:23713489
- claim_id: hsd1-negative-primary
  statement: AZD4017 failed to establish efficacy on the primary randomized ICP comparison.
  disposition: QUALIFIED
  report_quote: did not meet its primary endpoint of reducing ICP
  rationale: 'Correct: the 31-participant trial had between-group mean difference -2.8 cmH2O (95%
    CI -7.1 to 1.5; P=0.2). The report overstates this as no ICP reduction: exploratory within-group
    ICP reduction and biochemical target engagement occurred. Those analyses do not establish efficacy,
    but a small inconclusive trial is not decisive refutation of 11β-HSD1 biology.'
  citations:
  - PMID:32954315
  - PMID:33098644
  - PMID:20826586
  - PMID:35584002
- claim_id: obesity-drainage-model
  statement: Obesity can elevate ICP through impaired drainage without hypersecretion in a
    defined rat paradigm.
  disposition: QUALIFIED
  report_quote: obesity alone increases ICP via impaired CSF drainage, not hypersecretion
  rationale: PMID:37328884 supports this for 21-week HFD-fed female Wistar rats. Another HFD
    study increased secretion, and obese Zucker rats had neither raised ICP nor altered CSF
    dynamics. The report acknowledges both; its generalized executive wording should therefore
    be narrowed. These are complementary model observations, not a universal obesity mechanism
    in humans.
  citations:
  - PMID:37328884
  - PMID:38273331
  - PMID:32036786
- claim_id: compensatory-drainage
  statement: Increased drainage can prevent pressure elevation despite testosterone-driven
    secretion.
  disposition: RETAINED
  report_quote: ICP was *not* increased due to compensatory elevation in CSF drainage capacity
  rationale: The obese Zucker-rat study reports exactly this dissociation. It is consequential
    evidence against treating increased secretion as sufficient for increased pressure in every
    background, and is represented by a FAILS_TO_RECAPITULATE link to the ICP node.
  citations:
  - PMID:38273331
- claim_id: metabolic-phenotype
  statement: IIH can have metabolic abnormalities beyond simple obesity.
  disposition: QUALIFIED
  report_quote: an insulin- and leptin-resistant phenotype
  rationale: The matched 97-patient/43-control cohort supports this metabolic phenotype and
    adipose dysfunction. CSF leptin elevation is independently reported. Neither association
    establishes a unique hormone-to-ICP causal sequence; the phenotype is retained without
    promoting leptin resistance to a demonstrated secretory driver.
  citations:
  - PMID:33848268
  - PMID:18771566
  - PMID:35584002
- claim_id: inflammatory-driver
  statement: Human cytokine associations plus rodent perturbations establish a cytokine-driven
    human secretory pathway.
  disposition: QUALIFIED
  report_quote: Inflammatory cytokine-driven CSF hypersecretion
  rationale: Human case-control cytokine differences are observational, and the abstract does
    not supply all effect directions or a direct secretion measurement. Rat TNF-α and
    hydrocortisone increase secretion, while CCL2 alters outflow; effects are context
    dependent. Retain an explicit research gap and model-specific evidence, not an established
    new human inflammatory-secretory node.
  citations:
  - PMID:42214536
  - PMID:32036786
  - PMID:18771566
- claim_id: intrinsic-stenosis-frequency-cause
  statement: Thirty-seven percent of all IIH patients have primary intrinsic venous stenosis.
  disposition: REJECTED
  report_quote: 37% of IIH patients have intrinsic venous sinus stenosis that is anatomically
    primary
  rationale: The 37% denominator is 26 of 70 patients selected for venous sinus stenting at one
    center, not an unselected IIH population. Nonreversibility distinguishes morphology but
    does not establish temporal primacy. The revised YAML retains intrinsic versus extrinsic
    narrowing without treating the cohort fraction as a population subtype frequency or proof
    of initiation.
  citations:
  - PMID:30219791
  - PMID:37410913
  - PMID:33236688
- claim_id: venous-intervention
  statement: Stenting response supports a modifiable venous component in selected IIH.
  disposition: QUALIFIED
  report_quote: providing therapeutic proof-of-concept for the venous component
  rationale: The clinical literature supports gradient reduction and improvement in selected
    medically refractory patients. It does not establish a universal mechanism, and headache
    response is variable. Formal visual outcomes, complications and recurrence matter;
    comparative randomized evidence is limited.
  citations:
  - PMID:37410913
  - PMID:40372014
  - PMID:41569744
- claim_id: first-gwas
  statement: The consanguineous-family study is the first or only IIH GWAS.
  disposition: REJECTED
  report_quote: First IIH GWAS Identifies Candidate Loci Including CA5A and ESR1
  rationale: The source itself cites the earlier NORDIC IIHTT GWAS, PMID:29608535. Moreover
    only 11 female cases and 11 female controls underwent the reported haplotype/GWAS analysis;
    14 cases/30 controls is the recruited cohort. An exploratory P<0.01 threshold across
    hundreds of thousands of markers and relatedness/age imbalance cannot establish genome-wide
    significant causal genes or therapeutic targets.
  citations:
  - PMID:38528581
  - PMID:29608535
- claim_id: mri-quantity-and-readiness
  statement: REXI and CSF-iDDxI are ready to directly quantify net CSF secretion in human IIH.
  disposition: QUALIFIED
  report_quote: could enable the first direct test of whether IIH patients have elevated CSF
    secretion rates
  rationale: Both are rat proof-of-concept methods. REXI measures trans-barrier water exchange,
    not necessarily net bulk secretion; CSF-iDDxI uses intravenous D2O and exploratory kinetic
    modeling, and the cached report is a preprint. Human feasibility, safety, calibration,
    exchange-versus-net-flux validity and confounding require validation before treating these
    assays as decisive clinical secretion measurements.
  citations:
  - PMID:39593112
  - PMID:41279197
  - PMID:15516623
- claim_id: healthy-atlas-scope
  statement: A human choroid plexus reference dataset is available for future IIH comparisons.
  disposition: QUALIFIED
  report_quote: A healthy human CP single-nucleus atlas exists
  rationale: PMID:39482394 is a choroid plexus tumor heterogeneity study including four
    disease-free and eleven tumor samples. The disease-free subset can be a reference, but the
    whole atlas is not a healthy or IIH dataset. No provider download, sample selection, or
    reanalysis is committed; patient tissue availability and age/postmortem/tumor-context
    confounding require separate assessment.
  citations:
  - PMID:39482394
- claim_id: tissue-acquisition
  statement: Routine IIH CSF diversion yields choroid plexus tissue for molecular profiling.
  disposition: REJECTED
  report_quote: CP tissue from IIH patients undergoing shunt surgery or endoscopic CP
    coagulation
  rationale: Standard shunt placement diverts CSF and does not routinely remove choroid plexus.
    Endoscopic choroid plexus coagulation is not established routine IIH treatment. Tissue
    acquisition cannot be assumed from these procedures; use ethically available postmortem
    material or separately justified model systems and avoid additional clinical intervention
    solely to obtain research tissue.
  citations:
  - PMID:30298346
- claim_id: glymphatic-model
  statement: Glymphatic dysfunction is an established unifying IIH mechanism.
  disposition: QUALIFIED
  report_quote: This model explains the same clinical features
  rationale: The cited publications propose theoretical frameworks. They do not establish a
    causal initiating glymphatic defect in patients; normal secretion in selected rat models
    does not identify the alternative human pathway. Preserve the explicit hypothesis/gap, not
    a canonical causal chain.
  citations:
  - PMID:41472646
  - PMID:29387036
  - PMID:36183631
- claim_id: retinoid-scope
  statement: The report correctly rejects systemic retinoid excess as a universal explanation
    of typical primary IIH.
  disposition: RETAINED
  report_quote: arguing against systemic retinoid excess as a primary driver in typical IIH
  rationale: The report correctly distinguishes secondary hypervitaminosis-A-associated raised
    pressure from typical IIH and cites lower serum ATRA in the IIHTT substudy. This supports
    rejecting the proposed universal retinoid-excess model, but does not resolve all local
    retinoid biology.
  citations:
  - PMID:28017254
  - PMID:24169407
  - PMID:1463588
- claim_id: negative-search-completeness
  statement: Ninety-one-paper screening and exhaustive database absences are independently
    auditable.
  disposition: NEEDS_VERIFICATION
  report_quote: 91 papers reviewed across 5 investigative iterations
  rationale: The repository holds the narrative and 41-item citation sidecar, but no search
    strings, dated query-response logs, full screening list, code, or figures for the
    referenced placeholders. No committed artifacts establish GenCC/ClinGen negative searches
    or a complete absence of IIH choroid plexus profiling. Assessor literature checking
    verifies particular sources, not provider search execution.
  analysis_ids:
  - literature-screening
- claim_id: phase-iii-trial-status
  statement: The cited phase III GLP-1 program is ongoing.
  disposition: QUALIFIED
  report_quote: Multiple ongoing trials (GLP-1 RA phase III, bariatric surgery follow-ups)
  rationale: As of this assessment, the IIH EVOLVE exenatide phase III registry NCT05347147 is
    TERMINATED because the sponsor judged continuation not viable. No confirmatory phase III
    efficacy outcome follows from this program. This is a time-sensitive update to the report
    rather than a refutation of the small phase II trial.
  citations:
  - NCT:05347147
  - PMID:36907221

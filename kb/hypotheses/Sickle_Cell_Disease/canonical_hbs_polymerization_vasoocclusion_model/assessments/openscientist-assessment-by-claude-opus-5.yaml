claims:
  - claim_id: polymerization-is-necessary-proximal-cause
    statement: >-
      HbS polymerization is the necessary and proximal cause of sickle cell
      disease pathophysiology, and near-complete polymerization inhibition by
      HbF reactivation abolishes downstream disease.
    disposition: RETAINED
    report_quote: "The canonical HbS polymerization and vaso-occlusion model is strongly supported as the necessary and proximal cause of sickle cell disease pathophysiology."
    rationale: >-
      Correct, but this is the seed claim restated, so the report supplies no
      new support for it. The decisive citation the report leans on
      (PMID:38661449, exa-cel phase 3) was already curated on the Gene Therapy
      treatment with two verified snippets, and the entry already carries a
      second gene-therapy systematic review (PMID:42400217). No change made.
    citations:
      - PMID:38661449
  - claim_id: double-nucleation-delay-time-kinetics
    statement: >-
      HbS polymerization proceeds by a double nucleation mechanism in which
      homogeneous nucleation seeds polymers and heterogeneous nucleation on
      existing polymer surfaces autocatalytically amplifies fiber growth,
      producing a delay time that is extremely dependent on HbS concentration.
    disposition: RETAINED
    report_quote: "A double nucleation mechanism for the polymerization of sickle hemoglobin is described."
    rationale: >-
      Verified against both cited papers after fetching them. The 1985 abstract
      carries the quoted sentence and states that the mechanism accounts for the
      delay, its high concentration dependence, and the stochastic behaviour of
      slowly polymerizing samples; Ferrone's 2015 reassessment restates the
      delay-time paradigm and links it to capillary transit and to hydroxyurea
      response. The curated entry asserted concentration dependence without
      citing the kinetics behind it, so both were added to the Hemoglobin
      Polymerization node.
    citations:
      - PMID:4020873
      - PMID:25645011
  - claim_id: vaso-occlusion-is-multicellular
    statement: >-
      Vaso-occlusion is a multistep multicellular process in which endothelial
      activation recruits adherent leukocytes that then capture circulating
      sickle erythrocytes, rather than sickled erythrocytes obstructing vessels
      on rheology alone.
    disposition: RETAINED
    report_quote: "Adherent leukocytes — particularly neutrophils — are essential intermediaries that capture sickle RBCs in the microvasculature."
    rationale: >-
      The strongest genuinely additive finding in the report. Frenette's
      paradigm paper carries the proposed model verbatim in its abstract; the
      Berkeley-mouse intravital study independently shows adherent leukocytes
      capturing red cells in venules, with survival correlating with blood flow
      and inversely with adherent-leukocyte number. The curated entry named the
      leukocyte adhesion GO process on its Vaso-Occlusion node but cited nothing
      for it and had no node for the capture step. Added as a new
      pathophysiology node upstream of Vaso-Occlusion.
    citations:
      - PMID:11844991
      - PMID:17932253
  - claim_id: neutrophil-count-independently-predicts-crisis-rate
    statement: >-
      In the Multicenter Study of Hydroxyurea, lower neutrophil counts were
      independently associated with lower painful-crisis rates, and the report
      asserts this association was stronger than the fetal-hemoglobin
      association in multivariable analysis.
    disposition: QUALIFIED
    report_quote: "there was strong evidence of independent association of lower neutrophil counts with lower crisis rates"
    rationale: >-
      The quoted clause is verbatim from the MSH abstract and supports
      independence. The report's added comparative claim that the neutrophil
      association was stronger than the HbF association is an inference: the
      abstract says F-cell counts were associated with crisis rate only in the
      first three months of treatment and that MCV showed an association over
      longer periods, and it explicitly declines to make any statement about
      hydroxyurea's mechanism because the trial was not designed for it. The
      independence claim was curated; the comparative ranking was not.
    citations:
      - PMID:8982148
  - claim_id: soluble-adhesion-molecules-rise-during-crisis-in-patients
    statement: >-
      Plasma P-selectin, E-selectin, ICAM-1 and VCAM-1 are significantly higher
      during vaso-occlusive crisis than at discharge or in steady state in
      patients with sickle cell disease.
    disposition: RETAINED
    report_quote: "Adhesion molecules (P-selectin, E-selectin, ICAM-1, VCAM-1) are significantly elevated during crisis versus discharge and steady state in human SCD patients"
    rationale: >-
      Verified in the cached abstract of a 140-patient longitudinal series with
      three sampling time points. This is the human counterpart of the mouse
      adhesion data and was added alongside them so the new node does not rest
      on model-organism evidence alone. Worth noting what the same paper does
      not show: no significant association between any adhesion-molecule level
      and pain severity.
    citations:
      - PMID:41206783
  - claim_id: hemolysis-vasculopathy-partially-independent-axis
    statement: >-
      Intravascular hemolysis releases cell-free hemoglobin, heme and
      arginase-1, which deplete nitric oxide and activate innate immunity,
      driving a vasculopathy sub-phenotype of pulmonary hypertension, leg
      ulcers, priapism and stroke that is partially autonomous from
      vaso-occlusion.
    disposition: RETAINED
    report_quote: "Intravascular hemolysis releases cell-free hemoglobin, heme, and arginase-1, which scavenge nitric oxide, activate innate immunity via TLR-4, trigger complement activation, and drive a distinct sub-phenotype of pulmonary hypertension, leg ulcers, priapism, and stroke."
    rationale: >-
      Correct and already curated in full. The entry's Chronic Hemolysis node
      carries the arginase and NO-scavenging mechanism with two verified
      snippets from PMID:15998894, its Vaso-Occlusion node carries the
      heme-TLR4 step from PMID:24277079, and PMID:16291595 (the LDH
      sub-phenotype cohort the report cites) is already used twice in the
      biochemical section. No new content to add.
    citations:
      - PMID:16291595
      - PMID:28248201
  - claim_id: gardos-kcc-dehydration-amplification-loop
    statement: >-
      Sickling activates the Gardos channel and the K-Cl cotransporter, causing
      potassium, chloride and water loss that raises mean corpuscular hemoglobin
      concentration and accelerates further polymerization, closing a positive
      feedback loop.
    disposition: RETAINED
    report_quote: "Sickling activates the Ca²⁺-sensitive Gardos channel (hSK4/hIK1) and the K-Cl cotransporter (KCC), causing K⁺/Cl⁻/water loss and generating irreversibly dense cells with elevated mean corpuscular hemoglobin concentration (MCHC)."
    rationale: >-
      Supported by the cached Lew and Bookchin abstract, which describes exactly
      this multitrack dehydration model built on the anion exchanger plus the
      Gardos channel and KCC, and by the dehydration review already cited in the
      entry. The curated entry had cell dehydration only as an environmental
      exposure and as an MCHC input variable in a computational model; the
      mechanism node closing the loop back onto polymerization was missing and
      has been added.
    citations:
      - PMID:15618480
      - PMID:29614632
  - claim_id: voxelotor-withdrawal-caused-by-efficacy-failure
    statement: >-
      Voxelotor's failure to consistently reduce vaso-occlusive crises or organ
      damage is what led to its 2024 market withdrawal.
    disposition: QUALIFIED
    report_quote: "Voxelotor improved hemoglobin levels by partially inhibiting HbS polymerization but failed to consistently reduce vaso-occlusive crises or organ damage, leading to its market withdrawal in 2024."
    rationale: >-
      The efficacy half holds: the cached systematic review states that the HOPE
      trial gave a 51 percent hemoglobin response with reduced hemolytic markers
      while real-world VOC and hospitalization results were inconsistent and not
      conclusive. The causal half does not. PMID:40463219 states the withdrawal
      as a bare fact with no reason attached, PMID:40307078 predates it and
      offers no attribution, and the 2024 withdrawal was driven by a
      postmarketing safety signal rather than by absent efficacy. The curated
      Voxelotor description already attributes it to safety concerns and was
      left as it stands; only the efficacy observation was added as evidence.
    citations:
      - PMID:40307078
      - PMID:40463219
  - claim_id: voxelotor-binds-hemoglobin-at-multiple-sites
    statement: >-
      Voxelotor binds hemoglobin at more sites than the intended alpha-subunit
      N-terminus, with heterogeneous stoichiometry and structural effects.
    disposition: RETAINED
    report_quote: "binds multiple hemoglobin sites and influences protein structure"
    rationale: >-
      Verified in the cached abstract, which reports NMR and mass-spectrometry
      evidence that structure and stoichiometry are far more heterogeneous than
      the one-to-one crystallographic picture, including binding at the beta
      N-terminus, and warns that the same should be assessed for GBT021601. This
      is a real mechanistic caveat on an approved-then-withdrawn drug that the
      entry recorded only as a regulatory fact, so it was added to the Voxelotor
      treatment.
    citations:
      - PMID:40463219
  - claim_id: polymerization-inhibition-threshold-effect
    statement: >-
      There is a threshold of polymerization inhibition above which
      vaso-occlusion is essentially abolished and below which downstream
      inflammatory and adhesive loops run autonomously, inferred from the
      contrast between voxelotor and exa-cel.
    disposition: QUALIFIED
    report_quote: "This suggests a therapeutic threshold effect"
    rationale: >-
      Mechanistically plausible and the most interesting idea in the report, but
      it rests on comparing two different trials with different populations,
      endpoints and follow-up, and the report itself lists the threshold as its
      own Gap 1 with the fraction undefined. Recorded as a knowledge gap with
      the report's own dose-response design as a proposed experiment, not as an
      asserted mechanism.
    citations:
      - PMID:40307078
      - PMID:38661449
  - claim_id: complement-inhibition-data-are-mouse-only
    statement: >-
      Complement activation is a functional driver of vaso-occlusion, but all
      interventional complement-inhibition evidence comes from mouse models and
      human trial data are absent.
    disposition: QUALIFIED
    report_quote: "All complement inhibition data are from mouse models; human trial data are absent"
    rationale: >-
      The mechanism claim is well supported: in Townes SS mice, MASP-2 or MASP-3
      antibody pretreatment reduced plasma Bb, C4d and C5a, cut hepatic NF-kB
      and adhesion-molecule expression, and inhibited microvascular stasis. The
      absence claim overstates the position its own source takes. That paper
      notes eculizumab use in delayed hemolytic transfusion reactions with
      hyperhemolysis, an American Society of Hematology recommendation covering
      that setting, and the CROSSWALK trial of a C5 inhibitor for VOC. So the
      gap is specifically that no completed randomized trial has tested
      complement inhibition for vaso-occlusive crisis, not that human data do
      not exist. Curated as a HUMAN_MODEL_MISMATCH discussion with that
      correction stated.
    citations:
      - PMID:35878790
  - claim_id: inflammation-clinical-heterogeneity-link-unknown
    statement: >-
      Whether the clinical heterogeneity and complication profile of sickle cell
      disease relate to the degree of inflammation is not known.
    disposition: RETAINED
    report_quote: "whether the clinical heterogeneity and complications are related to the degree of inflammation is not known"
    rationale: >-
      Verbatim from the cited review's abstract, which also notes that few
      inflammatory biomarkers currently predict complications while many
      anti-inflammatory therapies exist with widely varying clinical outcomes.
      That is a real prognostic gap sitting on top of mechanism the entry
      already curates, and it was added as a knowledge-gap discussion.
    citations:
      - PMID:39698332
  - claim_id: il1b-blockade-outperforms-p-selectin-blockade-on-organ-damage
    statement: >-
      In murine sickle cell disease, six weeks of IL-1beta blockade reduced
      hepatic fibrosis and hemosiderosis whereas P-selectin blockade did not
      improve overall organ pathology.
    disposition: RETAINED
    report_quote: "IL-1β blockade reduced fibrosis/hemosiderosis; P-selectin did not"
    rationale: >-
      Verified in the cached full text, which reports that IL-1beta blockade
      considerably reduced hepatic fibrosis and, unlike P-selectin blockade,
      remarkably decreased hemosiderosis, while P-selectin blockade reduced
      glomerular congestion without significant overall organ benefit. Real, but
      mouse-only comparative therapeutics rather than a mechanism step the entry
      lacks, and the entry already records that the STAND trial did not confirm
      crizanlizumab benefit. Not integrated.
    citations:
      - PMID:39568425
  - claim_id: structured-databases-not-queried
    statement: >-
      The run did not query GenCC, ClinGen, ClinVar or OMIM, and identified no
      systematic omics dataset or deeply phenotyped prospective cohort.
    disposition: RETAINED
    report_quote: "GenCC, ClinGen, ClinVar, and OMIM were not directly queried."
    rationale: >-
      An honest self-declared limitation and the basis for the data_sources
      block above, where each named database is recorded as cited but not
      accessed. It also bounds what the report can say about genetic modifiers:
      its own Gap 6 relays that most reported modifier associations are
      controversial, which is a literature judgement rather than a database
      check.
    citations:
      - PMID:36400533
  - claim_id: retain-canonical-status
    statement: >-
      The hypothesis should remain CANONICAL, with the description extended to
      acknowledge multicellular vaso-occlusion, the hemolysis-vasculopathy axis
      and the insufficiency of partial polymerization inhibition.
    disposition: RETAINED
    report_quote: "Core claim (polymerization is necessary proximal cause) is unequivocally supported."
    rationale: >-
      Agreed, and no status change was made. The three qualifications the report
      wants added to the description are already written into the hypothesis
      entry's notes field from an earlier pass over this same report, so the
      integration work was in the pathophysiology graph and the discussions
      rather than in the hypothesis prose.
    citations:
      - PMID:38661449

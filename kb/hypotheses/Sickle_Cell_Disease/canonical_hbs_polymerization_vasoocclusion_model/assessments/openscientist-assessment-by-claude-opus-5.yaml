hypothesis_id: canonical_hbs_polymerization_vasoocclusion_model
assessed_at: "2026-09-02T12:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  The seed hypothesis came out of the KB, so most of what this report says about
  the core chain (HBB Glu6Val, HbS polymerization on deoxygenation, sickling,
  vaso-occlusion, hemolysis, end-organ damage) is a restatement rather than new
  support, and I did not treat it as new. What the report does add is three
  qualifications, each of which I could verify against primary sources I fetched
  into references_cache/, and each of which was genuinely thin or absent in the
  curated entry.

  First, the biophysics. The entry asserted concentration-dependent
  polymerization but cited only a dehydration review and a 1985 severity
  correlation for it; the actual kinetic mechanism (double nucleation, an
  autocatalytic delay time that is extremely concentration dependent) had no
  citation on the pathophysiology node at all. Ferrone/Hofrichter/Eaton 1985
  (PMID:4020873) and Ferrone's 40-year reassessment (PMID:25645011) supply it,
  and the quotations the report attributes to them are verbatim.

  Second, the multicellular character of vaso-occlusion. The entry's
  Vaso-Occlusion node carried the GO term for leukocyte adhesion to vascular
  endothelium but no evidence for the step it names, and no node for the
  leukocyte capture event itself. Frenette's multistep paradigm (PMID:11844991),
  the Berkeley-mouse intravital work (PMID:17932253), the MSH neutrophil
  association (PMID:8982148) and a 140-patient soluble-CAM series
  (PMID:41206783) together support adding it as a discrete mechanism node with
  both human and model-organism evidence.

  Third, the dehydration amplification loop. Lew and Bookchin's multitrack model
  (PMID:15618480) makes the Gardos/KCC step explicit; the entry had cell
  dehydration only as an environmental exposure and as an MCHC variable inside a
  computational model, with no pathophysiology node closing the feedback loop
  back onto polymerization.

  Two things I did not accept. The report repeatedly asserts that voxelotor's
  failure to reduce vaso-occlusive crises is what caused its 2024 market
  withdrawal. Neither cited source supports that causal step: PMID:40463219
  states the withdrawal as a bare fact, PMID:40307078 reports only that
  real-world VOC results were inconsistent, and the withdrawal was driven by a
  postmarketing safety signal, which is what the curated Voxelotor description
  already says. The efficacy half is supportable and was curated; the
  attribution was not. The report also frames the polymerization-inhibition
  threshold as a demonstrated effect when the voxelotor/exa-cel contrast is a
  comparison across different trials, populations and endpoints. It is a real
  open question, so it went in as a knowledge gap rather than as an asserted
  mechanism.

  No fabricated identifiers or misquotations were found. Every citation I acted
  on resolved to a real paper whose abstract carried the quoted sentence,
  including the four 2025-2026 PMIDs that were the most likely hallucination
  candidates.

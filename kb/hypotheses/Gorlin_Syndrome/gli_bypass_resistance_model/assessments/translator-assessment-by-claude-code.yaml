hypothesis_id: gli_bypass_resistance_model
assessed_at: "2026-08-02T20:30:00Z"
overall_verdict: UNRESOLVED
summary: >-
  The report does not address the hypothesis it was run against. The GLI bypass
  model is a claim about acquired resistance downstream of SMO - GLI1/GLI2
  activation sustaining Hedgehog output while SMO is inhibited - and neither GLI1
  nor GLI2 nor SMO appears in any returned route. What comes back instead is the
  germline gene-disease list for the syndrome (SUFU, PTCH2, PTCH1), all three of
  which the entry already curates, and whose drug-gene hops are
  pathway-adjacency assertions rather than target engagement: vismodegib's actual
  target is SMO. The run is a clean negative for this hypothesis and a useful
  four-minute check that the entry's gene curation matches consensus resources,
  but it carries no information about resistance.
claims:
  - claim_id: hypothesis-not-addressed
    statement: >-
      No returned route contains GLI1, GLI2 or SMO, so the report bears on the
      germline genetics of the syndrome rather than on the GLI-bypass resistance
      mechanism under assessment.
    disposition: REJECTED
    report_quote: "- Paths: 3"
    rationale: >-
      All three routes run through germline predisposition genes (SUFU, PTCH2,
      PTCH1) reached by gene-to-disease association edges. The hypothesis
      concerns an acquired, tumour-cell-autonomous escape downstream of the drug
      target during SMO-inhibitor therapy. A gene-intermediate two-hop query is
      structurally unable to represent it: resistance effectors are not
      gene-disease association nodes for the syndrome, so no route through GLI1
      or GLI2 can be constructed regardless of what the underlying knowledge
      graphs assert about them. The claim is rejected as not-addressed rather
      than refuted - nothing here is evidence against GLI bypass.
  - claim_id: drug-gene-hops-are-pathway-adjacency
    statement: >-
      The vismodegib-SUFU, vismodegib-PTCH1 and vismodegib-PTCH2 edges reflect
      Hedgehog-pathway co-membership and co-mention, not drug-target binding.
    disposition: QUALIFIED
    report_quote: "SUFU --affects--> Vismodegib"
    rationale: >-
      Vismodegib is a smoothened (SMO) antagonist; it does not bind SUFU, PTCH1
      or PTCH2. The three drug-gene hops are attributed to CTD, a targeted
      text-mining provider, and DGIdb respectively - resources that record
      chemical-gene co-occurrence and curated pathway relationships, which the
      Biolink `affects` predicate then flattens. The direction of the top route
      is itself a tell: it is asserted as SUFU affecting vismodegib rather than
      the reverse. Read as pathway context these edges are unobjectionable; read
      as mechanism of action they are wrong, and the entry's existing
      `target_mechanisms` of SMO Constitutive Activation (INHIBITS) is the
      correct statement.
  - claim_id: gene-disease-consistency-check
    statement: >-
      SUFU, PTCH1 and PTCH2 are correctly returned as the syndrome's genes and
      every one already appears in the entry's `genetic` section.
    disposition: RETAINED
    report_quote: "PTCH1 --causes--> nevoid basal cell carcinoma syndrome"
    rationale: >-
      The gene-disease hops are attributed to ClinGen and Orphanet, and PTCH1,
      PTCH2 and SUFU are the established causal genes for nevoid basal cell
      carcinoma syndrome. Every intermediate matched a curated gene, so the
      honest reading of this run is that the knowledge graph adds nothing beyond
      what the entry already holds - which is worth establishing quickly before
      commissioning a slower literature-based investigation.

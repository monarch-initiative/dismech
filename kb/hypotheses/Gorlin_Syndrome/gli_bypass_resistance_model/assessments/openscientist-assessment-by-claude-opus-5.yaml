    access_status: UNVERIFIABLE
    notes: >-
      The report states "Papers Reviewed: 68" across "5 investigative iterations"
      but records no search engine, query string, date filter, or inclusion rule.
      The citations sidecar lists 24 PMIDs; the report body cites at least two
      more (PMID:8981943 and PMID:41129277, in the causal chain) that the sidecar

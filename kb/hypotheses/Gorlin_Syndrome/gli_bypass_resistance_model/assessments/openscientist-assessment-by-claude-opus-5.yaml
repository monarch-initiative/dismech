schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: gli_bypass_resistance_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  A careful, well-sourced report. I fetched and read 14 of its 26 distinct PMIDs
  and found no fabricated identifier, no wrong-paper citation, and no quotation
  that the cached source failed to bear out. That is unusual and worth recording.

  Its central contribution is not new support for the seed hypothesis, which was
  already curated from PMID:31036756 and needs no restating, but a bound on it.
  The report separates three levels of applicability: SUFU-driven disease, where
  the lesion sits below SMO and primary resistance is predicted from pathway
  topology; sporadic advanced basal cell carcinoma, where roughly half of
  resistant tumors carry acquired SMO mutations; and PTCH1-related Gorlin
  syndrome, where tumors are uniformly suppressed, secondary resistance is rare,
  and the one molecularly characterized resistant tumor escaped through a
  basal-to-squamous lineage transition rather than through GLI convergence. The
  target disease is the third case, so the honest reading is that the hypothesis
  is strongest exactly where Gorlin syndrome is least involved.

  Three things needed correction. The report's headline comparison of resistance
  rates puts Palmeiro's 9.1% next to Gan's 77% as though they measured the same
  quantity; they do not. Palmeiro's 9.1% is the share of treatment interruptions
  attributable to secondary resistance, not the share of Gorlin patients who
  became resistant, and Gan's 77% is the share of locally advanced and metastatic
  basal cell carcinoma patients, a group that is largely not Gorlin. The Gan
  paper carries a far better Gorlin-specific statement in its own text, which I
  used instead. The report also reads Beauchamp's "proposed" and "potential"
  arsenic binding sites as established, and it recommends a hypothesis status,
  PARTIALLY SUPPORTED, that is not a permissible value of
  MechanisticHypothesisStatusEnum.

  One ontology lead is simply wrong: CL:0002559 is "hair follicle cell", not
  "hair follicle infundibulum basal cell" as the report labels it. No term from
  the report was bound.

  The report declares 26 provider artifacts under openscientist_artifacts/, and
  none of that directory is committed. Every figure, evidence matrix, and
  provenance JSON it references is therefore unavailable for inspection.
artifacts:
  - openscientist-assessment-by-claude-opus-5.md

      versioned, the query is not stated, and no response artifact exists in the
      hypothesis directory.
  - data_source_id: openscientist-artifact-bundle
    source_type: LOCAL_FILE
    name: Declared OpenScientist artifact bundle (openscientist_artifacts/)
    access_status: UNVERIFIABLE
    notes: >-
      The report frontmatter declares artifact_count 26 and lists concrete paths

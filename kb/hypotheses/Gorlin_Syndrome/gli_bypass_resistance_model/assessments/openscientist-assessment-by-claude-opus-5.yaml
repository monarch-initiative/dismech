analyses:
  - analysis_id: evidence-matrix-and-confidence-grading
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Manual construction of an 18-row evidence matrix assigning each cited paper
      an evidence type, a direction relative to the seed hypothesis
      (supports / qualifies / competes), a disease context, and a confidence
      grade, plus a companion subtype-applicability ranking.
    comparison: >-
      Each retrieved paper against the seed GLI bypass hypothesis, and the
      hypothesis against three disease strata (SUFU-driven disease, sporadic
      advanced basal cell carcinoma, PTCH1-related Gorlin syndrome).
    input_data_source_ids:
      - report-literature-corpus
    status_reason: >-
      No code, query log, or intermediate table is committed, and the declared
      artifact bundle that would hold the matrix and figures is absent. The
      grading is also not self-consistent with the sources: PMID:30707899 is
      typed "Model organism" although its ciliome mutation load and cilia
      immunostaining are from human naive, Gorlin, and resistant tumors, and
      PMID:30297801 is typed "Model organism + human" although the abstract
      reports only a Ptch1-Trp53 mouse model. Confidence grades are assigned with
      no stated rubric, so "High" on a four-case series (PMID:32796174) is not
      comparable with "High" on a 44-tumor cohort (PMID:25759020).
    limitations: >-
      Because the grades are unrubricked and the two evidence-type errors both
      run in the direction of making competing evidence look weaker than it is,
      the matrix cannot be used to weight evidence during curation. Each row was
      re-derived from the cached source before use.
claims:
  - claim_id: gli-bypass-real-but-not-universal
    statement: >-
      GLI-convergent bypass is a genuine and well-documented route to
      SMO-inhibitor resistance, but it is neither universal nor sufficient to
      account for all resistance in Gorlin syndrome.
    disposition: RETAINED
    report_quote: >-
      the GLI bypass model is a real and well-documented resistance mechanism,
      but it is neither universal nor sufficient to explain all SMO-inhibitor
      resistance in Gorlin syndrome
    rationale: >-
      This is the report's central judgment and it survives source checking. The
      convergent arm is carried by PMID:25759020, PMID:23446420, PMID:24651015,
      and PMID:26677003; the bound on it is carried by PMID:38157930,
      PMID:30707899, and PMID:30297801. All seven were read in the cache. The
      curated entry already stated the convergent arm; the bound is what this
      report adds.
    citations:
      - PMID:25759020
      - PMID:38157930
      - PMID:30707899
  - claim_id: smo-mutations-half-of-resistant-sporadic-bcc
    statement: >-
      Acquired SMO mutations are present in 50% (22 of 44) of resistant basal
      cell carcinomas and sustain Hedgehog signaling despite SMO inhibition.
    disposition: RETAINED
    report_quote: >-
      Atwood et al. (2015) performed comprehensive sequencing of 44 resistant
      BCCs and identified SMO mutations in 50% (22/44) of cases
    rationale: >-
      Confirmed against the cached abstract of PMID:25759020. Already curated as
      evidence on this hypothesis entry; no integration needed. Worth noting that
      the cohort is sporadic advanced basal cell carcinoma, not Gorlin syndrome,
      which the report itself flags.
    citations:
      - PMID:25759020
  - claim_id: apkc-noncanonical-gli-activation
    statement: >-
      Atypical protein kinase C iota/lambda acts below SMO to phosphorylate and
      activate GLI1 and is upregulated in SMO-inhibitor-resistant tumors,
      constituting a non-canonical bypass route.
    disposition: RETAINED
    report_quote: >-
      aPKC-ι/λ directly phosphorylates and activates GLI1, resulting in maximal
      DNA binding and transcriptional activation.
    rationale: >-
      Confirmed against PMID:23446420, which is already cited on this hypothesis
      entry with a verified snippet covering both the phosphorylation and the
      upregulation in resistant tumors. No integration needed.
    citations:
      - PMID:23446420
  - claim_id: sufu-and-mycn-confer-primary-resistance
    statement: >-
      In SHH medulloblastoma, PTCH1-mutant tumors respond to SMO inhibition
      whereas SUFU-mutant and MYCN-amplified tumors are primarily resistant,
      establishing that a lesion below SMO confers primary rather than acquired
      resistance.
    disposition: RETAINED
    report_quote: >-
      PTCH1-mutant tumors were responsive to SMO inhibition, whereas tumors
      harboring SUFU mutations (concentrated in infants) or MYCN amplification
      (concentrated in children >3 years) were primarily resistant.
    rationale: >-
      Confirmed verbatim in the cached abstract of PMID:24651015. This is the
      functional demonstration the curated entry lacked: PMID:26677003, already
      cited, argues non-response from pathway topology, whereas Kool tested it in
      xenografts. Directly relevant to Gorlin syndrome because SUFU carriers are
      the ones who develop SHH medulloblastoma. Integrated as new evidence,
      graded MODEL_ORGANISM because the quoted result is the xenograft assay.
    citations:
      - PMID:24651015
      - PMID:26677003
  - claim_id: gli2-amplification-as-a-bcc-resistance-mechanism
    statement: >-
      GLI2 amplification is a downstream-of-SMO resistance mechanism on a par
      with acquired SMO mutation.
    disposition: QUALIFIED
    report_quote: >-
      identifying focal amplifications of GLI2 and cyclin D1 (Ccnd1) in
      additional resistant models
    rationale: >-
      The mechanism is real but its evidence base is narrower than the seed
      hypothesis text implies. PMID:21123452 found the GLI2 and Ccnd1
      amplifications in murine medulloblastoma allografts, and PMID:24651015
      found MYCN and GLI2 amplification in human SHH medulloblastoma. Neither is
      a human basal cell carcinoma series, and PMID:25759020, which sequenced 44
      resistant human BCCs, attributes resistance to SMO mutation rather than to
      GLI2 amplification. Integrated with the model-system provenance stated in
      the evidence item rather than left as an unattributed clause.
    citations:
      - PMID:21123452
      - PMID:24651015
      - PMID:25759020
  - claim_id: bet-inhibition-overcomes-smo-antagonist-resistance
    statement: >-
      BET bromodomain inhibition suppresses GLI transcription and controls
      Hedgehog-driven tumors that carry lesions rendering them resistant to SMO
      antagonists, including SUFU loss.
    disposition: RETAINED
    report_quote: >-
      the BET inhibitor JQ1 suppressed growth of patient-derived and genetically
      engineered mouse model (GEMM) Hedgehog-driven tumors even when harboring
      genetic lesions rendering them resistant to SMO antagonists, including SUFU
      loss
    rationale: >-
      Confirmed against PMID:24973920, already cited on this hypothesis entry
      with a verified snippet. No integration needed.
    citations:
      - PMID:24973920
  - claim_id: class-i-hdac-inhibition-overcomes-resistance
    statement: >-
      The class I HDAC inhibitor 4SC-202 abrogates GLI activation and Hedgehog
      target-gene expression in both SMO-inhibitor-sensitive and
      SMO-inhibitor-resistant cells.
    disposition: RETAINED
    report_quote: >-
      class I HDAC inhibitors (4SC-202/domatinostat) efficiently block HH/GLI
      signaling and overcome SMO-inhibitor resistance in both sensitive and
      resistant cells
    rationale: >-
      Confirmed against the cached full text of PMID:29055107, which states
      exactly this in its abstract. It is a second, chemically independent
      preclinical demonstration that the convergent GLI node is druggable, and it
      was absent from the entry, which cited only the BET arm. Integrated as new
      IN_VITRO evidence.
    citations:
      - PMID:29055107
  - claim_id: gorlin-tumors-uniformly-suppressed
    statement: >-
      PTCH1-related Gorlin tumors are uniformly suppressed by SMO inhibitors
      while sporadic basal cell carcinomas resist at high rates, so the
      hypothesis applies least well to the most common form of the target
      disease.
    disposition: RETAINED
    report_quote: >-
      sporadic basal cell carcinomas display high resistance rates, whereas
      tumors arising in patients with Gorlin syndrome with germline Patched
      (PTCH1) alterations are uniformly suppressed by inhibitor therapy
    rationale: >-
      Verbatim in the cached abstract of PMID:38157930 and independently
      corroborated by two sources the report did not connect to this point:
      PMID:40492880 reports that its 11 Gorlin patients who stayed on therapy had
      sustained suppression, and PMID:30707899 notes that Gorlin patients show
      significantly less resistance despite carrying hundreds of tumors. The
      curated notes already asserted this; the Gan cohort was added so the claim
      carries clinical evidence rather than a single case report.
    citations:
      - PMID:38157930
      - PMID:40492880
      - PMID:30707899
  - claim_id: nine-versus-seventyseven-percent-resistance-comparison
    statement: >-
      Gorlin patients resist SMO inhibitors at 9.1% against 77% in advanced
      sporadic basal cell carcinoma, a direct differential resistance rate.
    disposition: REJECTED
    report_quote: >-
      By contrast, Palmeiro et al. (2024) in a systematic review of 351 Gorlin
      patients found treatment interruption due to secondary resistance in only
      9.1%
    rationale: >-
      The two numbers do not measure the same quantity and cannot be placed side
      by side. PMID:38867459 states "Treatment interruption predominantly
      occurred due to side effects (69.1%) and secondary resistance (9.1%)", so
      9.1% is the share of treatment interruptions attributable to resistance,
      with interruptions as the denominator, not the share of 351 Gorlin patients
      who became resistant. PMID:40492880's 77% is 10 of 13 locally advanced and
      metastatic basal cell carcinoma patients, a group distinct from that
      paper's own 13 Gorlin patients. The conclusion the report draws happens to
      be right, but the arithmetic offered for it is not, and the curated notes
      had inherited the "~9% vs ~77%" phrasing. Corrected in the disease entry and
      replaced with the Gan cohort's own Gorlin-specific observation.
    citations:
      - PMID:38867459
      - PMID:40492880
  - claim_id: cilia-loss-ras-mapk-pathway-switch
    statement: >-
      Loss of primary cilia in resistant basal cell carcinoma switches dependency
      from Hedgehog to RAS/MAPK signaling, a resistance route that abandons GLI
      rather than sustaining it.
    disposition: QUALIFIED
    report_quote: >-
      Kuonen et al. (2019) demonstrated that loss of primary cilia in resistant
      BCCs drives a switch from Hedgehog pathway dependency to RAS/MAPK pathway
      activation
    rationale: >-
      The mechanism is supported by PMID:30707899, which is human tumor exome and
      immunostaining data plus murine and human cell lines, not the "Model
      organism" the report's evidence matrix records. The qualification the
      report omits is in the same abstract: "Although the resistant BCCs usually
      maintain HH pathway activation", so cilia loss describes a subset, and the
      report's flat statement that this "directly contradicts the universality of
      the GLI convergence model" overstates a minority route into a refutation.
      Integrated with that subset framing explicit.
    citations:
      - PMID:30707899
  - claim_id: wnt-dependent-persister-tolerance
    statement: >-
      Residual basal cell carcinoma cells survive Hedgehog pathway inhibition by
      switching to a WNT-dependent identity that no longer requires the original
      oncogenic driver, an early tolerance phase preceding genetic resistance.
    disposition: QUALIFIED
    report_quote: >-
      Biehs et al. (2018) demonstrated that residual BCC cells survive Hedgehog
      pathway inhibition through a cell identity switch to a WNT-dependent,
      Hedgehog-independent state
    rationale: >-
      Supported by PMID:30297801, but the evidence is a Ptch1-Trp53 mouse model
      treated with vismodegib; the cached abstract reports no human tissue, so
      the report's "Model organism + human" typing is not sourced. The two-phase
      temporal model the report builds on top of it, tolerance preceding genetic
      resistance, is the provider's own inference and is listed in the report's
      own gap table as having no longitudinal support. Integrated as
      MODEL_ORGANISM evidence with the translational caveat stated, and the
      unresolved temporal claim left in the discussion rather than asserted.
    citations:
      - PMID:30297801
  - claim_id: gorlin-resistance-mechanism-largely-unstudied
    statement: >-
      When resistance does arise in PTCH1-related Gorlin syndrome, the only
      molecularly characterized case escaped through a basal-to-squamous
      carcinoma transition, and the general basis of Gorlin resistance remains
      unstudied.
    disposition: RETAINED
    report_quote: >-
      The resistant clone had undergone a basal-to-squamous cell carcinoma
      transition
    rationale: >-
      PMID:38157930 reports a single patient after nearly a decade of suppressive
      therapy and states in the same abstract that "the basis of this resistance
      remains unstudied". The curated entry cited the lineage-transition finding
      but had no discussion recording that the Gorlin-specific mechanism is open.
      This is the report's highest-priority gap and the clearest unmet curation
      need it surfaced; added as a KNOWLEDGE_GAP discussion with the report's
      multi-patient resistance-genomics test as the proposed experiment.
    citations:
      - PMID:38157930
  - claim_id: gli-directed-therapy-clinically-unproven
    statement: >-
      The only clinical test of GLI-directed therapy after SMO-inhibitor failure
      achieved pharmacodynamic GLI1 suppression without meaningful tumor
      response.
    disposition: QUALIFIED
    report_quote: >-
      The combination reduced GLI1 mRNA levels by 75% from baseline (P<0.05),
      demonstrating pharmacodynamic proof of concept for GLI suppression.
    rationale: >-
      The substance is right and important, but two details are off. PMID:26765315
      reports P < .001, not P<0.05, so the report understates its own source. And
      the outcome is stronger than "insufficient": the paper states that best
      overall response was stable disease in three patients and that "none had
      tumor shrinkage". Integrated onto the existing GLI-directed-therapy
      knowledge gap using the paper's own results sentence, which was previously
      supported only by a review listing preclinical agents.
    citations:
      - PMID:26765315
  - claim_id: arsenic-trioxide-binds-gli-zinc-fingers
    statement: >-
      Arsenic trioxide inhibits GLI by binding cysteine residues in the GLI zinc
      finger domains.
    disposition: QUALIFIED
    report_quote: >-
      ATO binds cysteine residues in GLI zinc finger domains
    rationale: >-
      PMID:22391311 is a review chapter and is explicitly tentative: "The proposed
      mechanism of action is through direct binding. Potential binding sites
      include the critical cysteine residues in GLI zinc finger domains." The
      report converts a proposed mechanism with potential sites into a stated
      fact in its evidence matrix. Not integrated; the disease entry makes no
      claim about arsenic's binding site and should not acquire one from a
      review.
    citations:
      - PMID:22391311
  - claim_id: recommended-status-upgrade
    statement: >-
      The hypothesis status should be upgraded from EMERGING to PARTIALLY
      SUPPORTED with mandatory subtype stratification.
    disposition: REJECTED
    report_quote: >-
      We recommend upgrading the hypothesis status from EMERGING to PARTIALLY
      SUPPORTED with mandatory subtype stratification.
    rationale: >-
      Not actionable as written. MechanisticHypothesisStatusEnum permits only
      CANONICAL, ALTERNATIVE, EMERGING, and DEPRECATED; there is no PARTIALLY
      SUPPORTED value, and the enum grades curation maturity rather than evidence
      strength. On the merits the recommendation also points the wrong way for
      this entry: the report's own finding is that the model is weakest in
      PTCH1-related Gorlin syndrome, where the disease entry sits, and that
      Gorlin-specific resistance rests on one patient. Status left at EMERGING.
      The subtype stratification the report asks for is already carried by the
      applies_to_subtypes slot on the sibling hypotheses and by the notes.
    citations:
      - PMID:38157930
  - claim_id: hair-follicle-infundibulum-basal-cell-term
    statement: >-
      CL:0002559 is the cell-type term for hair follicle infundibulum basal cell
      and is a candidate annotation for infundibulocystic basal cell carcinoma.
    disposition: REJECTED
    report_quote: >-
      `CL:0002559` hair follicle infundibulum basal cell
    rationale: >-
      The CURIE resolves but the label is wrong. The repository term cache records
      CL:0002559 as "hair follicle cell", a much broader concept than the
      infundibular basal cell the report names. Binding it would have imported a
      fabricated label into the entry. No term from the report's ontology leads
      was bound; GO:0043408 is likewise absent from the caches. The underlying
      biology, that infundibulocystic tumors are enriched for alterations below
      PTCH1, is real (PMID:32796174) but rests on four cases, which the report
      grades "High" confidence.
    citations:
      - PMID:32796174

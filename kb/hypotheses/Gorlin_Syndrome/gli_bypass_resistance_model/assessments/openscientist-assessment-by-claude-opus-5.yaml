      own provenance. The corpus cannot be reconstructed or re-run.
  - data_source_id: clinicaltrials-search-gli-agents
    source_type: DATABASE
    name: Clinical trial registry search for GLI-directed agents in resistant basal cell carcinoma
    access_status: UNVERIFIABLE
    notes: >-
      The knowledge-gap table asserts two negative search results, "Found only
      PMID 26765315 (n=5, ATO+itraconazole); no trials of BET or HDAC inhibitors
      in resistant BCC" and "No clinical trials found specifically in SUFU-mutant
      BCC/MHIBCC". No registry is named, no query is given, and no search log is
      committed, so these cannot be recorded as SEARCHED_NO_RESULT. Prose is not
      an access record.
  - data_source_id: gencc-clingen-sufu-annotations
    source_type: DATABASE
    name: GenCC / ClinGen curation records for SUFU-BCNS2
    access_status: UNVERIFIABLE
    notes: >-
      The report claims it "Searched for SUFU-BCNS2 annotations; found clinical

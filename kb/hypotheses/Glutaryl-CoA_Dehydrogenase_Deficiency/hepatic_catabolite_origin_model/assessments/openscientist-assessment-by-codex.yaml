hypothesis_id: hepatic_catabolite_origin_model
assessed_at: "2026-09-04T22:31:01+00:00"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Liver-directed GCDH restoration, AASS suppression, and hepatocyte transplantation provide
  strong mouse evidence that hepatic lysine catabolism can materially affect brain metabolite
  burden and neurological outcome. They do not establish that liver is the predominant source
  in patients, identify the transported molecular species, or quantify liver-versus-brain
  contributions.
  The report reaches the right partial-support category but contains a biochemical error about
  GCDH clearing free glutaric acid, misses a directly relevant in-vivo radiotracer study,
  overstates
  arginine evidence, and proposes several incorrect ontology identifiers. The report is a
  literature
  synthesis with no committed provider execution logs, datasets or computational results.
  Proposed
  experiments are recorded as unexecuted. The isotope-routing proposals also require controls
  because injected lysine itself can enter brain.
artifacts:
- openscientist-assessment-by-codex.md
claims:
- claim_id: overall-partial-support
  statement: >-
    The distinctive hepatic-contribution model is partially supported in
    mice, while predominance, transported species, and human relevance remain
    unresolved.
  disposition: RETAINED
  report_quote: >-
    yields a verdict of **PARTIALLY SUPPORTED**
  rationale: >-
    PMID:37075130 causally perturbed the liver in several mouse experiments and changed brain
    metabolites, pathology, and survival. PMID:16573641 and PMID:18348873 show that free peripheral
    GA or 3-OHGA has limited brain entry in other mouse designs. No human compartmental intervention
    or quantitative source partitioning exists, so the report's calibrated overall category
    is appropriate.
  citations:
  - PMID:37075130
  - PMID:16573641
  - PMID:18348873
- claim_id: liver-directed-rescue
  statement: >-
    Liver-directed interventions establish a therapeutically important
    hepatic contribution in the severe Gcdh-knockout mouse model.
  disposition: RETAINED
  report_quote: >-
    reducing hepatic metabolite production benefits the brain
  rationale: >-
    In PMID:37075130, healthy hepatocyte repopulation, liver-specific AAV-Gcdh, and liver-directed
    Aass editing reduced brain metabolite concentrations and protected against high-protein-diet
    lethality and neuropathology. Diseased hepatocytes also restored brain accumulation and
    lethality in Gcdh/Aass double-knockout recipients. These are strong compartmental perturbations,
    although they come from one publication and one mouse program.
  citations:
  - PMID:37075130
- claim_id: free-glutarate-clearance
  statement: >-
    Brain GCDH status is an important design difference, but GCDH does not
    directly convert free glutaric acid entering the brain to crotonyl-CoA.
  disposition: REJECTED
  report_quote: >-
    the brain could enzymatically convert any GA entering from the periphery
    to crotonyl-CoA
  rationale: >-
    GCDH catalyzes oxidation and decarboxylation of glutaryl-CoA, not free glutaric acid.
    The experiments in PMID:37075130 do not identify the exchanged liver-derived molecular
    species. Intact brain GCDH may alter the wider lysine-catabolic state, but the report's
    stated clearance reaction is biochemically incorrect and cannot be used as the demonstrated
    reconciliation of the two mouse studies.
  citations:
  - PMID:37075130
  - PMID:3182847
- claim_id: hepatic-quantitative-predominance
  statement: >-
    Existing experiments show a hepatic contribution but do not show that it
    is quantitatively major or predominant.
  disposition: REJECTED
  report_quote: >-
    Source 1: Hepatic Lysine Catabolism (Quantitatively Major)
  rationale: >-
    PMID:37075130 did not isotope-trace the relevant molecule or partition the fraction of
    the brain pool supplied by each compartment. Global Aass deletion in PMID:32567100 reduced
    metabolites in liver and brain simultaneously and therefore is also non-localizing. The
    report itself later acknowledges that quantitative partitioning has never been performed.
  citations:
  - PMID:37075130
  - PMID:32567100
- claim_id: global-aass-dual-source-inference
  statement: >-
    Global Aass deletion supports substrate reduction but does not by itself
    prove separate active brain and liver sources.
  disposition: QUALIFIED
  report_quote: >-
    This directly supports a dual-source model: both brain and liver actively
    produce GA via the saccharopine pathway.
  rationale: >-
    PMID:32567100 deleted Aass in all tissues, so reduced brain GA could reflect lower local
    production, lower hepatic supply, or both. Direct lysine-dependent GA and 3-OHGA production
    by cultured Gcdh-deficient astrocytes in PMID:25968119 supports local capacity, while
    the liver-repopulation experiments in PMID:37075130 support a hepatic contribution. The
    dual-source synthesis is plausible from the combined evidence, not directly demonstrated
    by the global knockout alone.
  citations:
  - PMID:32567100
  - PMID:25968119
  - PMID:37075130
- claim_id: missed-in-vivo-bbb-study
  statement: >-
    An in-vivo mouse radiotracer study of circulating 3-OHGA existed and is
    directly relevant to the proposed transport gap.
  disposition: REJECTED
  report_quote: >-
    No in vivo BBB transport study for GA or 3-OHGA exists in any species.
  rationale: >-
    PMID:18348873 injected radiolabeled 3-OHGA into wild-type and Gcdh-null mice and measured
    tissue distribution under basal conditions and during a high-protein-diet encephalopathic
    crisis. Brain recovery remained low and was reduced rather than increased during crisis.
    The experiment does not identify the species responsible for PMID:37075130, but it directly
    falsifies the report's literature-absence statement.
  citations:
  - PMID:18348873
- claim_id: crisis-bbb-entry
  statement: >-
    Structural BBB injury during crisis does not establish increased entry of
    circulating GA1 dicarboxylic acids.
  disposition: REJECTED
  report_quote: >-
    Compromised during crisis → more influx
  rationale: >-
    PMID:24468193 documented vascular and tight-junction abnormalities in the diet-induced
    mouse model. However, the directly relevant radiotracer experiment in PMID:18348873 found
    limited circulating 3-OHGA recovery in brain even during an induced crisis. Crisis-dependent
    entry remains a testable possibility for other metabolites, not an evidence-backed determinant
    in the model table.
  citations:
  - PMID:24468193
  - PMID:18348873
- claim_id: arginine-localization
  statement: >-
    Lysine-free, arginine-rich treatment supports substrate restriction but
    does not independently confirm how much brain catabolite is locally
    produced.
  disposition: QUALIFIED
  report_quote: >-
    Human Arginine Neuroprotection Confirms Intracerebral Production Component
  rationale: >-
    PMID:21820344 compared 12 consecutively treated children with 25 historical controls.
    The formula changed lysine intake, arginine intake, plasma lysine, modeled cerebral influx,
    hospitalization, and gastrointestinal transport together. PMID:20923787 likewise proposed
    competition at both the BBB and mitochondrial carriers in mice. The studies support the
    importance of lysine flux and are compatible with local production, but they do not isolate
    compartmental origin.
  citations:
  - PMID:21820344
  - PMID:20923787
- claim_id: ontology-leads
  statement: >-
    Multiple proposed ontology identifiers denote different biology and must
    not be promoted.
  disposition: REJECTED
  report_quote: >-
    **Disease**: OMIM:231670, MONDO:0009280
  rationale: >-
    MONDO:0009280 denotes monosodium glutamate sensitivity; this repository uses MONDO:0009281
    for glutaryl-CoA dehydrogenase deficiency. In the same curation block, GO:0019470 denotes
    trans-4-hydroxy-L-proline catabolism; GO:0033512 is obsolete and refers to lysine catabolism
    via L-saccharopine, not the report's pipecolic-acid label; GO:0015804 is neutral-amino-acid
    transport rather than cationic lysine/arginine transport; and CL:0002543 denotes a vein
    endothelial cell rather than a brain capillary endothelial cell.
- claim_id: search-provenance
  statement: >-
    The claimed review corpus and screening process are not reproducible from
    the delivered report.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    Systematic evaluation of 48 publications (1993–2026)
  rationale: >-
    The frontmatter records 25 citations, while the report does not provide a complete 48-record
    corpus, executable searches, deduplication, or study-level inclusion decisions. Its missed
    PMID:18348873 further limits confidence in the claimed coverage. The number should remain
    provider metadata rather than verified systematic-review provenance.
  citations:
  - PMID:18348873
- claim_id: isotope-routing-does-not-localize-source
  statement: IV labeled lysine followed by labeled brain GA does not by itself prove
    hepatic production.
  disposition: REJECTED
  report_quote: IV ¹³C-lysine → ¹³C-GA in brain would confirm hepatic-to-brain transport
  rationale: Lysine can cross the BBB and be metabolized locally, as supported by
    PMID:20923787 and isolated astrocytes in PMID:25968119. Route of precursor delivery
    does not equal tissue of product formation. A useful design needs
    compartment-specific perturbations, measured precursor enrichment,
    vascular-contamination controls and product time courses. Intracerebroventricular
    delivery can also redistribute outside brain.
  citations:
  - PMID:20923787
  - PMID:25968119
  - PMID:25214427

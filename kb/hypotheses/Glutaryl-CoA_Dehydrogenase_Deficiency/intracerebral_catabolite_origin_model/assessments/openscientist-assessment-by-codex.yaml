schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: intracerebral_catabolite_origin_model
assessed_at: "2026-07-31T03:30:47Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Direct astrocyte production, low brain accumulation in hepatic-only knockout
  and peripheral-loading experiments, and efflux-dominant BBB transport support
  a real intracerebral component. Liver-directed rescue shows that a pure
  intracerebral-only interpretation is incomplete in the severe mouse model.
  The report's partial-support verdict is appropriate, but it overstates direct
  tracing and global-Aass evidence, misses an in-vivo crisis radiotracer study,
  wrongly attributes heterogeneous treatment outcomes to a missing hepatic
  mechanism, and confuses an assessment verdict with the disease hypothesis
  status enum.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-partial-support
    statement: >-
      Intracerebral production and limited efflux are supported components, but
      an exclusive or impermeable-BBB model is not supported.
    disposition: RETAINED
    report_quote: >-
      Verdict: PARTIALLY SUPPORTED — the intracerebral origin model captures a
      real and important component of GA-I pathophysiology
    rationale: >-
      PMID:25968119 directly shows lysine-dependent GA and 3-OHGA production by
      Gcdh-deficient astrocytes. PMID:16573641 found high brain metabolites in
      global knockout mice but low levels after liver-only deficiency or
      peripheral loading, and PMID:20302929 found efflux-dominant transport in
      an in-vitro BBB model. PMID:37075130 independently establishes that the
      liver can materially affect the brain phenotype in mice, requiring the
      exclusive version to be qualified.
    citations:
      - PMID:25968119
      - PMID:16573641
      - PMID:20302929
      - PMID:37075130
  - claim_id: liver-tracing-description
    statement: >-
      The 2023 transplantation experiments provide strong compartmental
      perturbation evidence, not direct molecular tracing of the transported
      catabolite.
    disposition: QUALIFIED
    report_quote: >-
      traced the origin of brain catabolites to the liver
    rationale: >-
      PMID:37075130 used healthy or diseased hepatocyte repopulation and
      liver-directed gene interventions to alter the brain phenotype. It did
      not isotope-label a liver product, and its discussion says the actual
      metabolite crossing the BBB remains to be identified. "Traced" overstates
      the measurement while the broader hepatic-contribution inference remains
      well supported in that model.
    citations:
      - PMID:37075130
  - claim_id: saccharopine-brain-dominance
    statement: >-
      Global Aass deletion supports a role for the saccharopine pathway but
      cannot establish that it is the dominant brain-local source.
    disposition: QUALIFIED
    report_quote: >-
      Saccharopine Pathway Is the Main Source of GA in Brain and Periphery
    rationale: >-
      PMID:32567100 deleted Aass in all tissues, so the 3.8-fold reduction in
      brain GA cannot distinguish reduced local production from reduced
      hepatic supply. The later source cited by the report, PMID:41194801, is a
      review rather than an independent compartment-specific experiment.
      PMID:25968119 establishes astrocyte production capacity, while
      PMID:25214427 found pipecolate to be the major labeled lysine product and
      little saccharopine production in murine brain. Relative pathway flux in
      human brain remains unresolved.
    citations:
      - PMID:32567100
      - PMID:41194801
      - PMID:25968119
      - PMID:25214427
  - claim_id: missed-crisis-radiotracer
    statement: >-
      A directly relevant in-vivo BBB radiotracer experiment under catabolic
      stress was omitted.
    disposition: REJECTED
    report_quote: >-
      Searched for BBB permeability studies under inflammatory/catabolic
      conditions in GA-I; none found.
    rationale: >-
      PMID:18348873 injected radiolabeled 3-OHGA into Gcdh-null mice under
      baseline and high-protein-diet crisis conditions. Brain recovery remained
      low and was reduced during crisis, leading the authors to conclude that
      the BBB appeared intact for this tracer. It does not settle transport of
      every candidate species, but it directly contradicts the claimed search
      result and should materially qualify the crisis-permeability proposal.
    citations:
      - PMID:18348873
  - claim_id: treatment-failure-causal-inference
    statement: >-
      Heterogeneous outcomes after newborn screening do not specifically
      implicate an unaddressed hepatic catabolite source.
    disposition: REJECTED
    report_quote: >-
      The persistent ~1/3 treatment failure rate despite dietary management
      further suggests that the pure intracerebral model incompletely captures
      the disease mechanism.
    rationale: >-
      The NBS meta-analysis PMID:32981931 found movement disorder in 25.3%, not
      one-third, and showed that deviations from maintenance diet and delayed
      emergency treatment increased risk. In a prospective German NBS cohort,
      PMID:29665094 reported movement disorder in 7% with presymptomatic
      guideline-based care, versus much worse outcomes with treatment
      deviations. These outcomes may motivate better therapy, but they do not
      discriminate hepatic from intracerebral origin.
    citations:
      - PMID:32981931
      - PMID:29665094
  - claim_id: systemic-aav-compartment-inference
    statement: >-
      Efficacy of systemic AAV does not itself show that both compartments
      contribute.
    disposition: QUALIFIED
    report_quote: >-
      The fact that liver-directed therapy alone can rescue the brain phenotype
      (Barzi et al.) while systemic approaches also work suggests both
      compartments contribute
    rationale: >-
      Systemic AAV-GCDH in PMID:38983872 restored expression and activity in
      both liver and striatum, so it cannot localize the therapeutic mechanism.
      Liver-specific evidence comes from PMID:37075130 and local-production
      evidence from studies such as PMID:25968119; the systemic experiment adds
      therapeutic support but is not a compartment-discriminating comparison.
    citations:
      - PMID:38983872
      - PMID:37075130
      - PMID:25968119
  - claim_id: arginine-brain-specific-inference
    statement: >-
      Arginine-plus-lysine restriction supports substrate-flux reduction but
      does not isolate a brain-specific causal route.
    disposition: QUALIFIED
    report_quote: >-
      reducing brain lysine import through arginine competition lowers brain GA
      levels.
    rationale: >-
      PMID:20923787 found that low lysine reduced GA in brain, liver, kidney,
      and serum and proposed arginine competition at both the BBB and
      mitochondrial ornithine carriers. Human PMID:21820344 also changed diet,
      plasma lysine, gastrointestinal competition, and modeled cerebral influx
      together. The findings are compatible with local brain production, but
      the report presents a proposed localization as an isolated measurement.
    citations:
      - PMID:20923787
      - PMID:21820344
  - claim_id: invalid-hypothesis-status
    statement: >-
      PARTIALLY_SUPPORTED belongs in an assessment sidecar and is not a valid
      disease-level mechanistic-hypothesis status.
    disposition: REJECTED
    report_quote: "- **Proposed status:** PARTIALLY_SUPPORTED"
    rationale: >-
      The disease schema's MechanisticHypothesisStatusEnum permits CANONICAL,
      ALTERNATIVE, EMERGING, and DEPRECATED. PARTIALLY_SUPPORTED is instead a
      HypothesisAssessmentVerdictEnum value. The report's evidential judgment
      is captured by this assessment YAML; it must not be copied into the
      hypothesis group's status field.
  - claim_id: bbb-ontology
    statement: >-
      GO:0007417 must not be used for blood-brain-barrier maintenance.
    disposition: REJECTED
    report_quote: >-
      Blood-brain barrier maintenance (GO:0007417)
    rationale: >-
      GO:0007417 denotes central nervous system development. It does not
      identify BBB maintenance, so this candidate mapping would encode a
      different biological process.
  - claim_id: search-provenance
    statement: >-
      The claimed corpus and depth-of-review counts are not reproducible from
      the delivered report.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Our analysis of 61 papers (24 assessed in depth)
    rationale: >-
      The frontmatter records 27 citations, and the report does not provide the
      61-record corpus, executable searches, screening log, or study-level
      inclusion decisions. The missed PMID:18348873 is especially relevant to
      a claimed BBB search. The counts should remain provider metadata.
    citations:
      - PMID:18348873

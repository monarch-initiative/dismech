hypothesis_id: residual_blood_meal_glycoconjugate
assessed_at: "2026-07-31T03:07:37Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The residual blood-meal model has no direct modern support and is reasonably
  deprioritized relative to endogenous tick synthesis. The report does not,
  however, experimentally refute it. Its four claimed pillars include two
  material errors: the AGKO mouse extract was explicitly from partially
  blood-fed ticks, and experimental tick infestation increased only
  anti-alpha-gal IgM in three dogs, not IgG/IgM/IgE. Vegetation-collected adult
  ticks are not blood-meal-naive across their lifecycle, and mass spectrometry
  of sheep-fed tick saliva detected alpha-gal glycolipids without determining
  whether they came from host blood or tick synthesis. The functional
  galactosyltransferase study establishes endogenous capacity, but its authors
  explicitly leave endogenous versus host-acquired contribution to AGS open.
  The model is weakly supported and disfavored, not directly falsified; the
  proposed knockout/source-tracing experiment is still needed.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-refutation
    statement: >-
      Residual mammalian glycoconjugates are established not to be the primary
      sensitizing alpha-gal source.
    disposition: REJECTED
    report_quote: "Verdict: REFUTED"
    rationale: >-
      No cited study isolates tick-synthesized from host-acquired alpha-gal
      during sensitization. The available data make an exclusively borrowed
      source unnecessary and leave the residual model without direct support,
      but the decisive galactosyltransferase-knockout/source-controlled
      experiment has not been done. WEAKLY_SUPPORTED_UNRESOLVED is a more
      evidence-calibrated verdict.
    citations:
      - PMID:30242261
      - PMID:34034363
      - PMID:39053323
  - claim_id: four-independent-pillars
    statement: Four independent experiments converge to refute the residual source.
    disposition: REJECTED
    report_quote: four independent and convergent lines of experimental evidence
    rationale: >-
      Endogenous biosynthetic capacity is a genuine independent result.
      Current-stage feeding comparisons are indirect, the TSGE experiment did
      not remove blood-meal material, and the dog experiment neither induced
      all three stated isotypes nor distinguishes the origin of alpha-gal.
      Counting these as four direct refutations overstates both independence
      and mechanistic resolution.
    citations:
      - PMID:30242261
      - PMID:31540167
      - PMID:34034363
      - PMID:38741222
  - claim_id: endogenous-capacity-not-source-share
    statement: >-
      Functional tick galactosyltransferases refute the claim that ticks can
      only acquire alpha-gal, but do not quantify the source of sensitizing
      antigen.
    disposition: QUALIFIED
    report_quote: >-
      This discovery provided the molecular machinery for endogenous tick
      alpha-gal production, directly undermining the premise that ticks must
      acquire alpha-gal from mammalian hosts.
    rationale: >-
      PMID:30242261 directly supports this narrower statement in I. scapularis.
      Its conclusion says further work should determine whether endogenous or
      host-acquired alpha-gal, or both, plays the major role in AGS. The paper
      cannot by itself refute a residual source as a contributor or identify
      the source used in A. americanum sensitization.
    citations:
      - PMID:30242261
  - claim_id: blood-meal-naive-adults
    statement: >-
      The vegetation-collected ticks in the feeding comparison had never taken
      a mammalian blood meal.
    disposition: REJECTED
    report_quote: >-
      alpha-gal was detected in unfed, vegetation-collected ticks that had
      never taken a blood meal, eliminating the possibility that residual
      mammalian glycoconjugates were the source.
    rationale: >-
      PMID:38741222 studied adult H. lusitanicum collected from vegetation,
      not blood-meal-naive larvae reared through a controlled lifecycle. The
      experiment compared those adults with males partially fed on deer and
      measured antibody reactivity in water-soluble extracts. It supports no
      effect of current adult feeding, not elimination of all previous-stage
      mammalian material or direct glycan-source attribution.
    citations:
      - PMID:38741222
  - claim_id: blood-free-tsge
    statement: >-
      The salivary-gland extract that sensitized AGKO mice contained no
      possible mammalian blood-meal material.
    disposition: REJECTED
    report_quote: >-
      ticks raised under controlled conditions without exposure to wild
      mammalian blood meals
    rationale: >-
      PMID:34034363 explicitly describes the inoculum as "partially blood fed
      TSGE." Laboratory rearing excludes an uncontrolled wild exposure, not
      mammalian feeding or blood remnants. The study proves that this extract
      can sensitize AGKO mice; it does not test the residual-versus-endogenous
      source question.
    citations:
      - PMID:34034363
  - claim_id: dog-source-discrimination
    statement: >-
      Tick-induced anti-alpha-gal antibodies in dogs discriminate
      tick-endogenous from residual mammalian alpha-gal.
    disposition: REJECTED
    report_quote: >-
      If the sensitizing antigen were residual mammalian alpha-gal from a prior
      blood meal, dogs should not respond immunologically since this would be
      self-antigen.
    rationale: >-
      In PMID:31540167, cross-sectional dog sera contained IgG, IgM, and IgE,
      but experimental infestation of only three dogs significantly increased
      IgM, not IgG or IgE. The authors propose that salivary context can break
      tolerance. That contextual mechanism would not identify whether the
      alpha-gal carried into that context was synthesized by the tick or
      acquired from a mammal, so the experiment is not source-discriminating.
    citations:
      - PMID:31540167
  - claim_id: saliva-glycolipid-origin
    statement: >-
      Alpha-gal glycolipids detected in tick saliva are shown to be
      tick-synthesized rather than host-derived.
    disposition: REJECTED
    report_quote: >-
      establishing a second class of tick-endogenous alpha-gal antigens
    rationale: >-
      The methods in PMID:39053323 state that "adult ticks were fed on sheep."
      Its discussion says "whether these lipids are derived directly from host
      blood or synthesized by ticks using host precursor lipid molecules is
      inconclusive" and later proposes likely host-blood sourcing. Detection
      and basophil activation establish antigen presence and effector
      recognition, not biosynthetic origin or sensitization.
    citations:
      - PMID:39053323
  - claim_id: absence-of-support
    statement: No modern experiment directly supports the residual blood-meal model.
    disposition: RETAINED
    report_quote: No modern experimental evidence supports the blood-meal hypothesis.
    rationale: >-
      The report identifies a historical proposal but no controlled
      source-tracing or sensitization result favoring residual mammalian
      material. This justifies low priority and DEPRECATED status. Absence of
      direct support should not be relabeled as experimental refutation.
    citations:
      - PMID:25747720
  - claim_id: decisive-test-missing
    statement: >-
      A viable tick galactosyltransferase perturbation combined with controlled
      host blood and sensitization is still required to discriminate sources.
    disposition: RETAINED
    report_quote: >-
      This would provide unequivocal causal evidence for the endogenous model
      and definitively close the blood-meal hypothesis.
    rationale: >-
      The proposed test correctly identifies why the existing evidence cannot
      sustain the report's definitive language. Because simultaneous RNAi in
      PMID:30242261 caused high early feeding mortality, a discriminating
      design must also separate loss of alpha-gal synthesis from impaired tick
      viability and feeding.
    citations:
      - PMID:30242261
  - claim_id: search-provenance
    statement: The claimed review of 46 papers is not auditable from the report artifact.
    disposition: NEEDS_VERIFICATION
    report_quote: 5 iterations, 46 papers reviewed, 7 confirmed findings
    rationale: >-
      The frontmatter exposes 20 citations and no screening log for the full
      asserted set. Review quality should be judged from the committed claims
      and sources rather than the unreconstructable paper count.

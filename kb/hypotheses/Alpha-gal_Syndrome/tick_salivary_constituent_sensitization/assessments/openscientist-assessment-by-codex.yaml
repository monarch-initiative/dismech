hypothesis_id: tick_salivary_constituent_sensitization
assessed_at: "2026-07-31T03:07:37Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is right that ticks can synthesize alpha-gal and that alpha-gal
  material in tick saliva can participate in sensitization. Functional
  galactosyltransferase experiments in Ixodes scapularis, salivary alpha-gal
  detection, and AGKO mouse sensitization provide substantial support for an
  intrinsic salivary route. They do not establish that the sensitizing material
  in a natural human bite is exclusively or predominantly tick-synthesized.
  The report repeatedly converts antigen detection into source attribution:
  its mouse extract came from partially blood-fed ticks, its glycolipid
  mass-spectrometry samples came from sheep-fed ticks and the authors called
  their origin inconclusive, and its vegetation-collected Hyalomma were adults
  rather than blood-meal-naive ticks. The class-switching and salivary-adjuvant
  steps remain unresolved. PARTIALLY_SUPPORTED is appropriate; upgrading the
  integrated source-and-sensitization model to fully supported is not.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-status-recommendation
    statement: >-
      The intrinsic salivary model is partially supported, but the evidence
      does not justify treating its complete antigen-source and sensitization
      chain as supported.
    disposition: QUALIFIED
    report_quote: >-
      PARTIALLY SUPPORTED, trending strongly toward SUPPORTED — recommend
      upgrade from ALTERNATIVE to SUPPORTED in the Knowledge Base.
    rationale: >-
      Tick biosynthetic capacity and salivary alpha-gal are well supported.
      No cited experiment traces the sensitizing alpha-gal in a natural bite
      to tick synthesis while excluding host-blood and microbial sources, and
      the report itself grades IgE class switching as weak/inferred. The
      narrower verdict is therefore PARTIALLY_SUPPORTED without the proposed
      status upgrade.
    citations:
      - PMID:30242261
      - PMID:34034363
      - PMID:39053323
  - claim_id: tick-biosynthetic-capacity
    statement: >-
      Ixodes scapularis possesses functional enzymes that contribute to
      endogenous alpha-gal synthesis.
    disposition: RETAINED
    report_quote: >-
      This finding directly establishes the genetic and enzymatic machinery
      for tick-endogenous alpha-gal production, refuting the hypothesis that
      alpha-gal in ticks is solely derived from blood meal remnants.
    rationale: >-
      Heterologous expression and RNAi in PMID:30242261 support endogenous
      alpha-gal production in I. scapularis. The paper appropriately limits
      the implication: it calls for further studies to determine whether
      endogenous, host-acquired, or both sources have the major role in AGS.
      Thus it refutes an exclusively borrowed source, not every contribution
      from host blood or the source question in Amblyomma americanum.
    citations:
      - PMID:30242261
  - claim_id: convergent-source-attribution
    statement: >-
      Detection, expression, and sensitization studies collectively establish
      that the alpha-gal which sensitizes hosts is an intrinsic tick product.
    disposition: QUALIFIED
    report_quote: >-
      The identification of functional tick galactosyltransferases, direct
      mass spectrometric detection of alpha-gal glycolipids in tick saliva,
      feeding-independent alpha-gal in salivary glands, and robust animal model
      data collectively establish that ticks produce and deliver alpha-gal as
      an intrinsic salivary constituent.
    rationale: >-
      These studies establish biosynthetic capacity, antigen presence, and
      salivary-extract sufficiency in separate systems and species. They do not
      perform source tracing in one sensitization experiment. PMID:39053323
      used saliva from sheep-fed ticks and explicitly says whether the lipids
      came from host blood or tick synthesis is inconclusive. PMID:34034363
      used partially blood-fed salivary-gland extract. Convergence supports the
      model, but not the claimed closure of the source edge.
    citations:
      - PMID:30242261
      - PMID:34034363
      - PMID:38741222
      - PMID:39053323
  - claim_id: blood-free-tsge-sufficiency
    statement: >-
      The AGKO mouse experiment excluded blood-meal remnants and
      tick-associated microorganisms from the sensitizing extract.
    disposition: REJECTED
    report_quote: >-
      This demonstrates that tick salivary components alone — without live
      tick feeding, blood meal remnants, or tick-borne pathogens — are
      sufficient to induce the full spectrum of AGS-like sensitization.
    rationale: >-
      The full text of PMID:34034363 states that the mice received "partially
      blood fed TSGE." It reports neither axenic material nor pathogen or
      endosymbiont screening, and its discussion says salivary alpha-gal could
      be endogenous, microbiome-derived, or induced during feeding. The study
      strongly supports extract sufficiency in AGKO mice, but it does not
      discriminate antigen source.
    citations:
      - PMID:34034363
      - PMID:35493735
  - claim_id: vegetation-ticks-source-test
    statement: >-
      Alpha-gal in vegetation-collected adult Hyalomma is incompatible with
      a residual blood-meal contribution.
    disposition: QUALIFIED
    report_quote: >-
      The presence of alpha-gal in unfed ticks is incompatible with the blood
      meal remnant hypothesis and strongly supports endogenous production.
    rationale: >-
      PMID:38741222 compared 60 adult ticks collected from vegetation with 10
      adult males partially fed on deer and found similar antibody reactivity.
      This supports persistence independent of feeding in the current adult
      stage and is compatible with endogenous production. It is not a
      blood-meal-naive lifecycle experiment, does not chemically trace the
      glycan, and cannot make a residual contribution "incompatible."
    citations:
      - PMID:38741222
  - claim_id: tsetse-generalization
    statement: >-
      Tsetse case reports and galactosyltransferase expression establish that
      other hematophagous arthropods endogenously produce the sensitizing
      alpha-gal.
    disposition: QUALIFIED
    report_quote: >-
      This extends the endogenous production model beyond ticks to other
      hematophagous arthropods, strengthening the generality of the intrinsic
      constituent hypothesis.
    rationale: >-
      PMID:40485140 is a small case series with possible alternative arthropod
      exposures. It detected only trace alpha-gal in whole-body tsetse extract,
      none in midgut protein extract, and galactosyltransferase transcripts.
      The authors call endogenous production putative and request validation.
      The study is a lead, not a demonstrated extension of the causal model.
    citations:
      - PMID:40485140
  - claim_id: immune-cell-study-attribution
    statement: >-
      Human single-cell and cytometry data identify altered circulating immune
      populations in AGS, but the report attributes the primary experiment to
      a review.
    disposition: QUALIFIED
    report_quote: >-
      Kepley et al. (2025) used multiparameter flow cytometry, mass cytometry,
      and RNA sequencing to demonstrate enrichment of unique populations of T
      cells, B cells, invariant natural killer T (iNKT) cells, natural killer B
      (NKB) cells, and mast cell (MC) progenitor cells in AGS patients
    rationale: >-
      PMID:41317280 is a review. The corresponding primary human single-cell,
      flow-cytometry, and mass-cytometry study is PMID:41098729. That study
      supports altered circulating populations and explicitly frames their
      role in sensitization as possible; it does not establish an iNKT/CD1d
      class-switching mechanism.
    citations:
      - PMID:41098729
      - PMID:41317280
  - claim_id: class-switching-gap
    statement: >-
      Direct evidence for the route from salivary alpha-gal and adjuvants to
      alpha-gal-specific IgE class switching remains absent.
    disposition: RETAINED
    report_quote: >-
      No direct experimental evidence links iNKT activation to alpha-gal IgE
      class switching.
    rationale: >-
      This is the defining unresolved downstream edge. Tick-bite histology,
      circulating-cell profiles, and AGKO sensitization establish compatible
      contexts, but they do not identify the antigen-presenting cell, T-cell
      help, B-cell lineage, or salivary adjuvant required for switching.
    citations:
      - PMID:29273488
      - PMID:41098729
  - claim_id: search-provenance
    statement: >-
      The assertion that more than 80 primary papers were reviewed is not
      auditable from the committed report.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Report generated from 5 iterative investigation cycles reviewing 80+
      primary papers.
    rationale: >-
      The report frontmatter exposes 23 citations and no screening log for the
      larger set. The number may describe provider retrieval, but scientific
      assessment can independently reconstruct only the committed claims and
      sources.

source_report: ../openscientist.md
hypothesis_id: tick_associated_microorganism
assessed_at: "2026-07-31T03:07:37Z"
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The report correctly finds no direct positive evidence that a known
  co-transmitted pathogen is the primary alpha-gal sensitizer, and a Polish
  cohort supplies useful negative evidence for its limited pathogen panel.
  Its categorical refutation is not supported. The purported pathogen-free
  salivary extract was not documented as pathogen-screened or axenic and came
  from partially blood-fed ticks; laboratory Amblyomma carry abundant
  endosymbionts. Endogenous tick alpha-gal synthesis and salivary antigen
  detection provide a more direct alternative but do not exclude a microbial
  source or adjuvant contribution. The mass-spectrometry study used sheep-fed
  ticks and did not determine antigen origin, and bite-lesion histology did not
  test microbial independence or directly observe class switching. The broad
  microorganism model has no direct support and is reasonably deprecated, but
  remains formally unresolved until microbiome/endosymbiont perturbation or a
  microorganism-free reconstitution test is performed.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: overall-refutation
    statement: >-
      A tick-associated microorganism is experimentally refuted as the primary
      sensitizing mechanism.
    disposition: QUALIFIED
    report_quote: >-
      REFUTED as primary sensitization mechanism. The DEPRECATED KB status is
      well-justified.
    rationale: >-
      DEPRECATED is reasonable because the model lacks direct positive evidence
      and a tick-intrinsic route is more parsimonious. The experiments cited do
      not exclude the whole model class: the extract was not microbe-free,
      serology covered a limited pathogen panel, and no endosymbiont-depleted
      or microorganism-free sensitization experiment exists.
    citations:
      - PMID:34034363
      - PMID:35382677
      - PMID:35493735
  - claim_id: pathogen-free-tsge
    statement: >-
      The AGKO mouse extract was demonstrated to be free of known pathogens and
      tick-associated microorganisms.
    disposition: REJECTED
    report_quote: >-
      Pathogen-free tick salivary gland extract (TSGE) from
      laboratory-reared *Amblyomma americanum* induces robust alpha-gal IgE
    rationale: >-
      PMID:34034363 does not report pathogen screening or use the term
      pathogen-free; it describes partially blood-fed TSGE. Independent
      microbiome work shows Francisellaceae dominating laboratory-raised A.
      americanum tissues and stages. Extract sufficiency shows that a live
      transmitted infection is unnecessary, but it cannot exclude microbial
      antigens, endosymbiont products, or their adjuvant effects.
    citations:
      - PMID:34034363
      - PMID:35493735
  - claim_id: no-microorganism-necessary
    statement: >-
      Salivary-extract sensitization demonstrates that no co-transmitted
      microorganism or microbial component is necessary.
    disposition: REJECTED
    report_quote: demonstrating that no co-transmitted microorganism is necessary.
    rationale: >-
      The study avoided live tick transmission but did not fractionate or
      deplete microbial material in the salivary-gland extract. It therefore
      tests neither the broad "organism present in the tick" model nor a
      microbial adjuvant mechanism. The report later acknowledges this exact
      formal gap.
    citations:
      - PMID:34034363
      - PMID:35493735
  - claim_id: limited-pathogen-serology
    statement: >-
      Lack of association with selected pathogen markers weighs against those
      organisms but does not refute every tick-associated microorganism.
    disposition: QUALIFIED
    report_quote: >-
      This epidemiological dissociation — strong tick bite association but no
      pathogen association — is a critical refutation.
    rationale: >-
      PMID:35382677 supports no apparent role for the examined Borrelia,
      Anaplasma, tick-borne encephalitis, and related histories in its Polish
      cohort. It did not assay the tick microbiome, endosymbionts, exposure at
      the sensitizing bite, or all microbial candidates; it also reports a
      serum-alpha-gal-IgE correlation with CSF anti-TBEV IgM. This is useful
      negative evidence for a limited panel, not a class-wide refutation.
    citations:
      - PMID:35382677
  - claim_id: endogenous-route-exclusion
    statement: >-
      Endogenous tick biosynthesis and salivary alpha-gal detection eliminate
      the need to consider microbial antigen sources.
    disposition: REJECTED
    report_quote: >-
      This finding eliminates the need to invoke any microbial source: ticks
      themselves produce the sensitizing antigen and deliver it in a form
      capable of activating innate immune cells.
    rationale: >-
      PMID:30242261 establishes endogenous biosynthetic capacity but explicitly
      leaves endogenous, host-acquired, or combined contribution to AGS for
      future study. PMID:39053323 used sheep-fed ticks and calls glycolipid
      origin inconclusive. Demonstrating one possible source does not exclude a
      second source, and basophil activation in already sensitized cells is an
      effector assay rather than a sensitization or source experiment.
    citations:
      - PMID:30242261
      - PMID:39053323
  - claim_id: bite-histology-class-switch
    statement: >-
      Human bite-lesion histology establishes the cellular class-switching
      mechanism and demonstrates microbial independence.
    disposition: REJECTED
    report_quote: >-
      This establishes the cellular mechanism for IgE class-switching to
      alpha-gal at the tick bite site, supporting the salivary constituent
      model and demonstrating no microbial trigger is needed.
    rationale: >-
      PMID:29273488 is a retrospective cohort comparing circulating alpha-gal
      IgE and lesion infiltrates after repeated bites. Basophils, eosinophils,
      and type-2 cytokine-producing T cells provide a compatible context, but
      the study did not observe B-cell class switching, identify the relevant
      antigen-presenting pathway, assay microbes, or perturb a microbial
      trigger.
    citations:
      - PMID:29273488
  - claim_id: helminth-source-inference
    statement: >-
      Helminth-associated sensitization without reported meat allergy proves
      that antigen source is irrelevant and refutes the microorganism model.
    disposition: REJECTED
    report_quote: >-
      This insight is devastating for the microorganism model, which hinges
      entirely on the identity of the antigen source, and confirms that the
      microorganism model was fundamentally asking the wrong question.
    rationale: >-
      Helminth studies support the distinction between sensitization and
      clinical allergy, but differences in exposure route, antigen form,
      population ascertainment, cofactors, and immune context prevent them from
      identifying what sensitizes after a tick bite. They motivate an
      adjuvant/context model; they are not a direct counterfactual test of a
      tick microorganism.
    citations:
      - PMID:33539899
      - PMID:34333031
  - claim_id: formal-endosymbiont-gap
    statement: >-
      Known-pathogen evidence does not formally exclude endosymbionts or other
      tick-associated microorganisms.
    disposition: RETAINED
    report_quote: >-
      refutes known tick-borne pathogens but not all tick-associated
      microorganisms.
    rationale: >-
      This caveat is decisive for calibrating the verdict. PMID:35493735 found
      abundant Francisella-like endosymbionts across laboratory-raised A.
      americanum tissues and stages, and the report identifies no
      endosymbiont-depletion or reconstitution study. It should not be called a
      minor caveat after being used to claim formal refutation.
    citations:
      - PMID:34034363
      - PMID:35493735
  - claim_id: absence-of-positive-evidence
    statement: >-
      No direct experiment shows a co-transmitted microorganism to be the
      primary sensitizer.
    disposition: RETAINED
    report_quote: >-
      No experimental study has ever provided positive evidence that a
      co-transmitted microorganism is the primary sensitizer for AGS.
    rationale: >-
      The report identifies historical proposals, microbial alpha-gal, and
      Anaplasma-dependent modulation of tick alpha-gal, but no primary
      sensitization experiment. This justifies weak support and low curation
      priority. It is absence of supporting evidence, not direct refutation of
      every member of the broad model class.
    citations:
      - PMID:25747720
      - PMID:30242261
  - claim_id: search-provenance
    statement: The claimed review of 51 papers is not auditable from the report artifact.
    disposition: NEEDS_VERIFICATION
    report_quote: "Total literature reviewed: 51 papers."
    rationale: >-
      The frontmatter exposes 24 citations and no screening log for the full
      asserted set. Assessment should rely on the committed claims and sources,
      not the unreconstructable retrieval count.

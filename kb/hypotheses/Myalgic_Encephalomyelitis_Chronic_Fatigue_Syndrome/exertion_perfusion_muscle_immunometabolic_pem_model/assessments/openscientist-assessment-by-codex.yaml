hypothesis_id: exertion_perfusion_muscle_immunometabolic_pem_model
assessed_at: '2026-09-05T00:07:34+00:00'
overall_verdict: PARTIALLY_SUPPORTED
summary: 'The report correctly retains an emerging, heterogeneous neurovascular-muscle-immune hypothesis
  and recognizes conflicting CPET and cytokine evidence. Source-level review finds material errors:
  a missed 2022 sodium MRI pilot and randomized acute pyridostigmine study, a 31% small-fiber-neuropathy
  proportion misreported as approximately 50%, review-as-primary ultrastructural evidence, absent
  healthy EM controls, long-COVID-to-ME/CFS transfer, and cross-sectional/cohort comparisons described
  as temporal or causal tests. Plasma metabolomics, CSF cohorts, TRPM3 assays and mouse ATG13 perturbation
  are informative within their actual scopes. A cited microbiome source is a preprint, and DecodeME
  genetic data already existed. The report supplies a literature synthesis, not auditable provider
  analyses: 29 numbered PMID entries, no search export for the claimed 72-paper corpus, no raw data,
  code or supplied figure files. The disease YAML incorporates valid findings and corrected clinical
  care while preserving uncertainty about intracellular calcium loading, causal ordering and subtype
  boundaries. An omitted 2022 patient serum-vesicle/microglial assay adds in vitro bioactivity evidence
  without establishing mtDNA-specific causality or human brain exposure.'

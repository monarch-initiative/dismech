  - PMID:36494667
  - PMID:35526605
  - PMID:42212259
- claim_id: corpus-audit
  statement: The claimed 72-paper systematic corpus is not auditable.
  disposition: NEEDS_VERIFICATION
  report_quote: After systematic evaluation of 72 primary research papers and reviews
  rationale: The committed citation sidecar has 29 numbered PMIDs. No dated query export,
    eligibility rules, exclusions, duplicate handling or complete 72-paper manifest is
    supplied. The discrepancy does not establish fabrication, but prevents verifying a
    systematic search or claimed seven iterative tests. All 29 cited records were retrieved for
    this assessment.
  citations: []
- claim_id: sodium-mri-absence
  statement: The report falsely states that no ME/CFS sodium MRI study exists.
  disposition: REJECTED
  report_quote: 23Na-MRI, which can quantify tissue sodium content non-invasively, has not been
    applied to ME/CFS.
  rationale: PMID:36494667 was published in 2022, before this June 2026 report. Six female
    cases and six age/BMI/sex-matched controls underwent 3T sodium MRI before and after three
    minutes of plantar flexion with 40-minute recovery imaging. Baseline tissue sodium and
    selected recovery values differed. The proposed MRI experiment therefore extends existing
    pilot work rather than filling a complete absence.
  citations:
  - PMID:36494667
- claim_id: sodium-compartment-limit
  statement: Existing tissue sodium imaging does not prove intracellular calcium overload.
  disposition: QUALIFIED
  report_quote: the ionic homeostasis component (Na+/Ca2+ overload in muscle) is entirely
    theoretical, lacking any direct human measurement in ME/CFS.
  rationale: The sodium MRI pilot is real, but its 2.44-ms echo time emphasizes long-lived
    signal and cannot separate intracellular from extracellular sodium; the authors estimate
    only about 30% of the short-lived component remains. It did not directly measure myocyte
    calcium, NCX reversal or calcium-mediated mitochondrial injury. Correct the absence claim
    without adopting the review's stronger intracellular interpretation.
  citations:
  - PMID:36494667
  - PMID:39727052
- claim_id: sfn-denominator
  statement: Small-fiber neuropathy was present in 31% of the cited ME/CFS cohort.
  disposition: REJECTED
  report_quote: Approximately 50% of patients had objective small fiber neuropathy on skin
    biopsy
  rationale: The 160 ME/CFS biopsies yielded 31%, while approximately 50% refers to background
    POTS/fibromyalgia studies in the introduction. Misattribution changes the apparent strength
    and generality of the upstream mechanism.
  citations:
  - PMID:33577778
- claim_id: icpet-selection
  statement: The low-filling-pressure result is conditioned on cohort selection.
  disposition: QUALIFIED
  report_quote: ME/CFS patients showed significantly lower right atrial pressure
  rationale: Investigators screened 1516 iCPETs and selected patients with RAP below 6.5 mmHg,
    no intrinsic cardiopulmonary disease and available skin biopsies. The 160-versus-36
    contrast cannot estimate the prevalence of low RAP in unselected ME/CFS. Low-flow impaired
    venous return and high-flow impaired extraction are distinct phenotypes.
  citations:
  - PMID:33577778
- claim_id: sfn-causal-bridge
  statement: Skin-fiber loss does not establish shunting as its downstream effect.
  disposition: QUALIFIED
  report_quote: The identification of small fiber neuropathy as an upstream driver
  rationale: Denervation severity did not correlate with exertional measures. Skin biopsy and
    systemic extraction measurements support a proposed neurovascular relationship, not
    demonstrated autonomic denervation, direct capillary shunt imaging or a causal SFN-to-PEM
    chain.
  citations:
  - PMID:33577778
- claim_id: em-source-type
  statement: The purported direct EM citation is a narrative review.
  disposition: QUALIFIED
  report_quote: Human clinical (EM)
  rationale: PMID:39727052 collects and interprets other studies. Direct sources are
    PMID:38338957 for CFS-versus-PCS ultrastructure and PMID:38177128 for paired exercise
    biopsies in long COVID. Labeling the review high-confidence primary human EM obscures their
    methods and limitations.
  citations:
  - PMID:39727052
  - PMID:38338957
  - PMID:38177128
- claim_id: em-controls
  statement: The primary EM study lacks a healthy microscopy comparator.
  disposition: QUALIFIED
  report_quote: Skeletal Muscle Mitochondrial Damage Confirmed by Electron Microscopy
  rationale: PMID:38338957 compared EM samples from 14 CFS and 14 PCS participants. Healthy
    historical controls were used for OXPHOS, not EM. Cristae integrity and morphology differed
    between syndromes, but the study cannot directly establish abnormality versus healthy EM,
    causation by calcium, or absence of PCS pathology. Disease duration, activity and other
    cohort differences remain plausible explanations.
  citations:
  - PMID:38338957
- claim_id: exercise-biopsy-population
  statement: The paired biopsy study is long-COVID evidence with restricted transfer to general
    ME/CFS.
  disposition: QUALIFIED
  report_quote: Biopsies taken one day after exercise showed "simultaneous presence of necroses
    and signs of regeneration,"
  rationale: PMID:38177128 studied 25 people with WHO-defined long COVID and PEM and 21
    recovered controls, not a mixed general ME/CFS cohort. The paired biopsy design provides
    genuine post-exercise evidence, but OXPHOS capacity decreased in both groups;
    disease-specific conclusions depend on other measures and interactions. Neither all long
    COVID nor every ME/CFS subtype can be equated with this sample.
  citations:
  - PMID:38177128
- claim_id: myotube-context
  statement: Cultured-cell persistence does not establish a genetic intrinsic defect.
  disposition: QUALIFIED
  report_quote: This retained dysfunction in cultured cells suggests an intrinsic cellular
    defect rather than a systemic factor
  rationale: Nine CFS and eleven control donor cultures showed reduced glucose-supported
    oxidation but preserved galactose and fatty-acid use. Culture selection, epigenetic memory
    and prior systemic exposure can persist. The study supports a retained substrate-specific
    cellular phenotype, not universal OXPHOS/FAO failure or exclusion of systemic origins.
  citations:
  - PMID:33106563
- claim_id: vascular-context
  statement: FMD and PORH differences do not establish exercising-muscle ischemia.
  disposition: QUALIFIED
  report_quote: This dual impairment — in both conduit artery and microvascular function —
    establishes that vascular dysfunction in ME/CFS is not limited to one vascular bed.
  rationale: The cited paper is by Sandvik and colleagues, not Scherbakov. Thirty-nine RituxME
    participants had lower brachial FMD and skin PORH; these measures did not correlate, and
    rituximab did not improve vascular or clinical outcomes over placebo. Different assay beds
    support vascular abnormalities but not the proposed muscle-perfusion-to-PEM causal link.
  citations:
  - PMID:36730360
- claim_id: rbc-assay-limit
  statement: Erythrocyte stiffness is an ex vivo observation, not direct in vivo obstruction.
  disposition: QUALIFIED
  report_quote: reduced red blood cell deformability would impair oxygen delivery to tissues.
  rationale: PMID:30594919 studied sixteen case-control pairs with a microfluidic device. It
    did not measure patient capillary obstruction, oxygen delivery or delayed PEM. Diagnostic
    use was a proposal, not validated sensitivity/specificity.
  citations:
  - PMID:30594919
- claim_id: purine-time-window
  statement: The seven-day PEM measure is not a serial exercise-provocation experiment.
  disposition: QUALIFIED
  report_quote: increased excretion of urine metabolites within the 7-day response period
    indicated a hypermetabolic event was occurring
  rationale: The 47-case study relates biochemical concentrations to self-reported recent PEM.
    Hypoxanthine was lower with severity. It does not provide a prospective seven-day exercise
    time course, isotopic flux, calorimetry or direct muscle-source tracing; methylhistidine
    and mannitol interpretations are not definitive proof of muscle destruction or barrier
    leakage.
  citations:
  - PMID:31277442
- claim_id: csf-independent-cohorts
  statement: CSF before/after comparisons used independent groups.
  disposition: QUALIFIED
  report_quote: Exercise led to consumption of lipids in ME/CFS and controls while metabolites
    were consumed in ME/CFS but generated in controls
  rationale: PMID:39941050 compared independent non-exercise and post-exercise cohorts, not
    paired lumbar punctures. Post-exercise samples followed two submaximal bouts on consecutive
    days. Concentration differences cannot establish within-person consumption/generation,
    flux, white-matter injury or a causal muscle-to-brain bridge.
  citations:
  - PMID:39941050
- claim_id: naviaux-count
  statement: The Naviaux study had 45 cases, not 84 cases.
  disposition: QUALIFIED
  report_quote: ME/CFS (n=84)
  rationale: 'PMID:27573827 enrolled 84 total subjects: 45 cases and 39 controls. Sex-stratified
    classifiers were derived in a small study; reported diagnostic accuracy is not equivalent to
    prospective independent clinical validation.'
  citations:

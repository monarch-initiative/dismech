- claim_id: metabolite-direction
  statement: Plasma concentration profiles are not direct metabolic shutdown or flux
    measurements.
  disposition: QUALIFIED
  report_quote: Systemic metabolic shutdown (dauer-like response)
  rationale: Reduced abundance of many selected metabolites supports altered metabolic state,
    while dauer is an analogy. The report combines this hypometabolic interpretation with a
    separate hypermetabolic interpretation of PEM without direct flux measurements or a
    longitudinal demonstration of transition. Do not curate a proven
    shutdown-to-hypermetabolism sequence.
  citations:
  - PMID:27573827
  - PMID:31277442
- claim_id: cbfv-referral-scope
  statement: Cerebral flow velocity and specialty-cohort proportions require qualification.
  disposition: QUALIFIED
  report_quote: reduced orthostatic CBFv (92%/88% in Long COVID/ME/CFS)
  rationale: PMID:41576003 is a retrospective autonomic-referral cohort (143 long COVID, 170
    ME/CFS, 73 controls). Flow velocity is not volumetric cerebral flow and its abnormality
    frequency cannot be generalized to unselected populations. It does not demonstrate
    peripheral metabolite amplification into CNS symptoms. A separate 429-case extracranial
    Doppler study directly assessed volumetric flow, including normal HR/BP subgroups.
  citations:
  - PMID:41576003
  - PMID:32140630
- claim_id: central-physiology
  statement: Central activation is a complementary physiological finding, not proof of
    psychiatric causation or central sensitization.
  disposition: QUALIFIED
  report_quote: Central Sensitization / CNS-Primary Model
  rationale: PMID:8423875 demonstrated reduced voluntary activation during a specific maximal
    isometric task with normal peripheral measures in its older CFS cohort. It did not
    establish a disorder of belief, voluntary effort avoidance, nociceptive central
    sensitization or the mechanism of delayed multi-system PEM.
  citations:
  - PMID:8423875
- claim_id: older-muscle-negative
  statement: The older biopsy study also found no significant EM abnormalities.
  disposition: RETAINED
  report_quote: This heterogeneous muscle histology is consistent with the view that peripheral
    muscle pathology is not universal in ME/CFS.
  rationale: PMID:9527150 included 105 biopsies and 41 EM samples. Histometry did not generally
    show expected inactivity changes and EM was negative. Preserve both the negative structural
    result and evidence against reducing the disease to deconditioning; differences in sampling
    and case criteria require further work.
  citations:
  - PMID:9527150
- claim_id: cpet-meta-specificity
  statement: The meta-analysis does not make every CPET parameter a validated PEM test.
  disposition: QUALIFIED
  report_quote: found that ME/CFS patients show significant declines in VO2 and workload at the
    ventilatory threshold on day 2 versus day 1
  rationale: PMID:33327624 reports lower day-two mean measures and highlights a significant
    case-control difference at workload at VT. The -10.8 and -33.0 values are differences
    between groups at the two tests, not universal within-patient declines. Assay specificity
    and generalization need validation. The 84-case/71-control primary study supports impaired
    recovery in its cohort, including matched aerobic-capacity pairs.
  citations:
  - PMID:33327624
  - PMID:38965566
- claim_id: cpet-negative-study
  statement: The 2026 study meaningfully limits universality without negating clinical PEM.
  disposition: RETAINED
  report_quote: a 2026 study failed to replicate the hallmark 2-day CPET decline
  rationale: PMID:42212259 enrolled 58 cases and 25 sedentary controls and required PEM (VAS at
    least 3). It used multiple VT criteria with expert adjudication. No day-two VO2 decline was
    detected, while perceived exertion and chronotropic response differed. The paper mentions
    preliminary symptom-monitoring differences whose full analysis is separate; a negative CPET
    decline is not evidence that patients lack PEM or disability.
  citations:
  - PMID:42212259
- claim_id: immune-dynamic-limit
  statement: The report appropriately preserves negative cytokine evidence.
  disposition: RETAINED
  report_quote: others find no significant post-exercise cytokine differences
  rationale: PMID:10226888 sampled through 24 hours with greater patient fatigue but no group
    immune differences; PMID:24027260 found no clinically significant cytokine upregulation
    after exercise or sleep deprivation. Single-cell platelet changes in PMID:38232699 are
    specific associations, not confirmation of a generalized cytokine cascade.
  citations:
  - PMID:10226888
  - PMID:24027260
  - PMID:38232699
- claim_id: nk-trpm3-scope
  statement: NK-cell calcium experiments do not validate the skeletal-muscle ion hypothesis.
  disposition: QUALIFIED
  report_quote: Impaired TRPM3 ion channel function with reduced Ca2+ signaling has been
    consistently identified in ME/CFS NK cells
  rationale: PMID:42177403 used ten cases and ten controls and found compartment- and
    stimulus-specific calcium effects, including higher mitochondrial influx under one
    condition. PMID:39483457 is a meta-analysis of cytotoxicity, not a TRPM3 perturbation
    study. PMID:31057538 found no NK functional differences in a large biobank cohort. These
    data support research phenotypes, not a universal diagnostic abnormality or muscle
    calcium-overload proof.
  citations:
  - PMID:42177403
  - PMID:39483457
  - PMID:31057538
- claim_id: atg13-model
  statement: ATG13 perturbation is mouse evidence, not an established human ME/CFS cause.
  disposition: QUALIFIED
  report_quote: Impaired autophagy --> mitochondrial dysfunction --> M1 macrophage infiltration
    --> muscle-nerve damage --> PEM
  rationale: PMID:41591477 uses Atg13-depleted mice and macrophage assays. It supports
    autophagy/redox/inflammatory coupling and post-treadmill weakness. It does not establish a
    causal human susceptibility variant, the temporal definition of human PEM or the entire
    perfusion/ion/CNS chain. Curate under an explicitly model-scoped hypothetical mechanism and
    animal model.
  citations:
  - PMID:41591477
- claim_id: genetic-architecture
  statement: ME/CFS genetic data existed before the report.
  disposition: QUALIFIED
  report_quote: No GenCC/ClinGen or Genetic Architecture Data
  rationale: The August 2025 DecodeME preprint reports eight loci in GWAS using up to 15,579
    cases and 259,909 controls of European genetic ancestry. HLA associations in 426 Norwegian
    cases were published in 2020. These sources do not connect each hypothesis node to an
    effector gene, but invalidate a blanket absence of genetic architecture data. DecodeME
    remains a preprint; nearest-gene annotations are not causal assignments.
  citations:
  - DOI:10.1101/2025.08.06.25333109
  - PMID:32210306
- claim_id: curation-database-absence
  statement: Absence of a GenCC or ClinGen entry is not demonstrated by the report.
  disposition: NEEDS_VERIFICATION
  report_quote: There is no GenCC or ClinGen entry for ME/CFS.
  rationale: No versioned database query, identifier mapping, download or search log is
    provided. Mendelian gene-validity resources are also not a comprehensive catalogue of
    complex-trait GWAS. A general web search did not establish the exhaustive database absence,
    so this assertion is not retained as a verified KB fact.
  citations: []
- claim_id: pyridostigmine-omission
  statement: A randomized acute hemodynamic perturbation already existed.
  disposition: REJECTED
  report_quote: All evidence linking the hypothesis's nodes is cross-sectional.
  rationale: PMID:35526605 (2022), registered NCT03674541, randomized 45 patients to 60 mg
    pyridostigmine or placebo between iCPETs separated by 50 minutes. Relative peak VO2,
    cardiac output and filling-pressure responses improved. It directly tests part of the
    neurovascular pathway; it does not establish delayed PEM rescue or the complete molecular
    sequence. The abstract reports an internally inconsistent sign for its treatment-effect
    confidence interval, so this assessment does not reuse that interval.
  citations:
  - PMID:35526605
  - clinicaltrials:NCT03674541
- claim_id: registered-mechanistic-trial
  statement: Registered trials narrow the report's claimed intervention gap.
  disposition: QUALIFIED
  report_quote: No registered clinical trial specifically tests the exertion-perfusion-muscle
    immunometabolic chain.
  rationale: The narrow absence of a trial measuring every proposed node may hold. However,
    NCT03674541 already tested acute neurovascular physiology, and NCT06366724 (LIFT,
    registered before the report) tests pyridostigmine and low-dose naltrexone in ME/CFS with
    OI. The August 2026 LIFT publication is a later protocol, not outcome evidence. As of
    2026-09-04 LIFT is RECRUITING; no efficacy result should be inferred from registration.
  citations:
  - clinicaltrials:NCT03674541
  - clinicaltrials:NCT06366724
  - DOI:10.1186/s13063-026-09943-6
- claim_id: microclot-interpretation
  statement: Extravascular muscle amyloid does not support intravascular capillary plugging.
  disposition: QUALIFIED
  report_quote: fibrin amyloid microclots block capillaries during exercise
  rationale: The report labels the microclot model speculative, appropriately. Its primary
    long-COVID exercise-biopsy source further found deposits outside capillaries, no
    capillary-density difference, and no corresponding lactate evidence for tissue hypoxia.
    These results constrain that particular occlusion explanation without ruling out all
    vascular abnormalities.
  citations:
  - PMID:36043493
  - PMID:38177128
- claim_id: autoantibody-interpretation
  statement: Receptor autoantibody concentration correlations do not demonstrate receptor
    dysfunction.
  disposition: QUALIFIED
  report_quote: autoantibodies against beta2-adrenergic receptors and M3 muscarinic
    acetylcholine receptors cause vasoconstriction and hypoxemia
  rationale: PMID:32247028 is a hypothesis paper. PMID:33889154 correlates sCD26, antibody
    levels and clinical variables in subgroups and could not confirm sCD26 diagnostic
    suitability. Functional receptor assays, target engagement and controlled intervention are
    needed before using the antibody association as a causal vasomotor edge.
  citations:
  - PMID:32247028
  - PMID:33889154
- claim_id: microbiome-source-type
  statement: The microbiome citation is a preprint and does not prove barrier leakage.
  disposition: QUALIFIED
  report_quote: Multiple studies document gut dysbiosis in ME/CFS with reduced
    butyrate-producing bacteria and increased intestinal permeability
  rationale: PMID:40980765 is an ArXiv preprint with thesis-style chapters, not a new
    peer-reviewed multi-study causal confirmation. Peer-reviewed primary studies PMID:36758521
    and PMID:36758522 support altered microbial pathways and butyrate-related measures. Diet,
    IBS, medication, duration and reverse causation matter; microbial/serum associations do not
    establish a gut-leak-to-PEM mechanism.
  citations:
  - PMID:40980765
  - PMID:36758521
  - PMID:36758522
- claim_id: comparative-ranking
  statement: The report does not establish that this is the most comprehensive or best
    explanatory framework.
  disposition: NEEDS_VERIFICATION
  report_quote: The hypothesis remains the most comprehensive integrative framework for PEM
    pathophysiology in the current literature
  rationale: No prespecified comparison, model-fit analysis or head-to-head causal test is
    provided. Broad coverage of many associated findings is not evidence of comparative
    validity; overlapping alternatives and unexplained heterogeneity remain.
  citations: []
- claim_id: subtype-boundaries
  statement: Proposed SFN/CPET/post-infectious subgroups are not validated mechanistic
    boundaries.
  disposition: QUALIFIED
  report_quote: Patients *without* these features may be better explained by the CNS-primary or
    autoimmune models.
  rationale: Lack of a day-two CPET decline or skin biopsy abnormality does not establish CNS
    primacy, autoimmunity or absence of a peripheral mechanism. Studies use different sampling
    frames; prospective joint phenotyping, replication and treatment interaction tests are
    needed to establish clinically useful subgroups.
  citations:
  - PMID:33577778
  - PMID:42212259
  - PMID:8423875
- claim_id: vasodilator-design
  statement: A nonspecific vasodilator is not a selective test of improved muscle oxygen use.
  disposition: QUALIFIED
  report_quote: Vasodilator improves peripheral O2 extraction, reduces purine deregulation
    markers, and attenuates PEM severity.
  rationale: This is a predicted outcome, not a result. Low preload and high-flow impaired
    extraction may respond differently; vasodilation can alter blood pressure, shunting and
    central perfusion. Predefine target engagement, adverse hemodynamic responses, carryover
    and washout, symptom outcomes beyond 24 hours, multiplicity and subgroup interaction tests.
    Improvement would support a pathway only if mediator changes and off-target alternatives
    are addressed.
  citations:
  - PMID:33577778
  - PMID:35526605
- claim_id: temporal-profiling-design
  statement: Dense profiling is useful but temporal correlation alone is insufficient for
    causality.
  disposition: QUALIFIED
  report_quote: Immune activation peaks coincide with or precede PEM symptom peaks at 24-48h
  rationale: The proposed schedule can characterize timing and heterogeneity. It cannot by
    itself prove metabolite-to-immune-to-CNS direction because common causes, feedback,
    circadian effects, activity, medication and selection can confound associations. Use
    prespecified endpoints, matched sampling, within-person models and independent validation;
    interpret mediation cautiously.
  citations:
  - PMID:38232699
  - PMID:10226888
- claim_id: sodium-design
  statement: The proposed sodium study must extend existing work with compartment and task
    controls.
  disposition: QUALIFIED
  report_quote: 23Na-MRI and 31P-MRS of calf muscle before, during, and after sustained
    isometric exercise
  rationale: Build on PMID:36494667 rather than claim first application. Optimize echo time and
    compartment modeling, measure activation and workload, include mobility/activity controls
    and repeated symptom trajectories. Tissue sodium and pH do not directly quantify calcium
    flux or NCX direction; orthogonal tissue assays and perturbation are required.
  citations:
  - PMID:36494667
- claim_id: biopsy-design
  statement: Paired biopsies can test association and injury dynamics without automatically
    proving upstream perfusion causation.
  disposition: QUALIFIED
  report_quote: Exercise-induced mitochondrial respiratory decline correlates with O2
    extraction deficit
  rationale: No provider experiment was executed. Existing paired long-COVID biopsies already
    address part of this question. Match biopsy timing, task load, baseline activity and assay
    normalization; distinguish case-by-time interaction from changes in both groups and control
    injury from the procedure itself. Simultaneous physiology and targeted perturbation are
    needed for direction.
  citations:
  - PMID:38177128
  - PMID:38338957
- claim_id: multimodal-selection
  statement: A single invasive battery risks excluding severe disease and distorting subgroup
    inference.
  disposition: QUALIFIED
  report_quote: Combine iCPET, 2-day standard CPET, muscle biopsy (EM + respirometry),
    metabolomics (blood + urine), single-cell immune profiling, and autonomic testing in a
    single well-powered cohort
  rationale: The nominal n>=100/50 target is not an endpoint-specific power calculation.
    Severity-adapted visits, tolerability, noninvasive options, cumulative exertional burden,
    missingness and recruitment bias must be planned. Unsupervised clusters require stability
    testing and external replication; they are not automatically biological subtypes.
  citations:
  - PMID:33577778
  - PMID:42212259
- claim_id: figure-artifacts
  statement: Four figure placeholders do not constitute available analytical artifacts.
  disposition: NEEDS_VERIFICATION
  report_quote: '{{figure:evidence_matrix.png|caption=Evidence matrix heatmap showing the strength
    and type of evidence supporting each node of the Exertion-Perfusion-Muscle Immunometabolic PEM
    Model}}'
  rationale: The directory contains the report and citation sidecar only. evidence_matrix.png,
    mechanistic_chain.png, plot_1.png and plot_2.png are referenced but not committed; no
    generation code or data is supplied. Their visual content and quantitative construction
    cannot be assessed. The report actually has four distinct placeholder image names, with the
    remaining mechanistic display as an inline text diagram.
  citations: []
- claim_id: peripheral-vesicle-bioassay
  statement: An existing patient serum-vesicle/microglial experiment narrows the
    peripheral-to-CNS evidence gap.
  disposition: QUALIFIED
  report_quote: The mechanism by which peripheral metabolic stress is transduced to CNS
    symptoms (Node 5 to 6) remains largely theoretical.
  rationale: PMID:36153118 (2022) reports exercise-associated increases in patient serum
    vesicle-associated mtDNA and IL-1beta release from cultured human microglia exposed to
    patient preparations. Published figure captions describe pooled donor preparations and
    assay replicates; they do not establish independent donor-level replication. The accessible
    earlier author preprint uses total extracellular-vesicle isolation, commercially purchased
    healthy-control sera without a matched exercise series, and no mtDNA depletion/add-back or
    BBB transport experiment. Those detailed methods are preprint evidence because final full
    methods were inaccessible. The assay supports preparation bioactivity, not mtDNA necessity,
    muscle source, disease-specific exercise response, blood-brain-barrier passage or human
    CNS/PEM causality.
  citations:
  - PMID:36153118
  - DOI:10.21203/rs.3.rs-387687/v1

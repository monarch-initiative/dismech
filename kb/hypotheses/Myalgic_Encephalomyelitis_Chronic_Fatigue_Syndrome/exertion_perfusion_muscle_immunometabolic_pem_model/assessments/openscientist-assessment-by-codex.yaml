claims:
- claim_id: integrated-verdict
  statement: The integrated model remains emerging and partly supported.
  disposition: RETAINED
  report_quote: the hypothesis should maintain EMERGING status.
  rationale: Multiple physiological observations are credible, but they were measured in
    different populations with different assays. A necessary sequential route from muscle
    perfusion through ions, metabolites and immune states to delayed PEM is unproven. Retain
    clinical PEM while qualifying the proposed molecular explanation.
  citations:

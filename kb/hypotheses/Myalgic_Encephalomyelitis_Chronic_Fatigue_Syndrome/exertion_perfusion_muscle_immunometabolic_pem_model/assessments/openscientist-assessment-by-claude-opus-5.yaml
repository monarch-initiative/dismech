hypothesis_id: exertion_perfusion_muscle_immunometabolic_pem_model
assessed_at: "2026-09-02T18:15:08Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's headline verdict is right and its per-node literature survey is
  broadly accurate: every node of the seed model except the ionic one has at
  least one human study behind it, and the sequential ordering between nodes is
  still inferred from cross-sectional data. That much matches what the entry
  already says, so on its own it would have been a restatement of the seed.

  What makes the report worth acting on is a set of citations the entry did not
  have, each carrying a distinct mechanism the curated chain was missing: an
  intrinsic, culture-retained glucose-oxidation defect in ME/CFS skeletal muscle
  cells (PMID:33106563), reduced red blood cell deformability as a
  hemorheological contributor to microcirculatory failure (PMID:30594919), a
  systematic review finding no post-exercise difference in circulating cytokines
  (PMID:26148446), post-exercise cerebrospinal fluid metabolite handling as the
  peripheral-to-central bridge (PMID:39941050), and quantified orthostatic
  cerebral blood flow and small fiber neuropathy prevalence in a 170-patient
  ME/CFS cohort (PMID:41576003). All five were verified against the cached
  sources and promoted.

  The report also gets two consequential things wrong, and one of them had
  already propagated into the disease entry. Its most emphatic knowledge gap
  says 23Na-MRI has never been applied to ME/CFS and that nobody has measured
  intramuscular sodium during or after exercise. Petter et al. 2022 did exactly
  that study, in the exact design the report proposes as its own Priority 3
  experiment: 23Na-MRI of the lower leg in ME/CFS versus matched controls before
  and after plantar flexion exercise, showing higher baseline sodium in all five
  compartments and a larger post-exercise rise in the exercised muscle. The
  report could have caught this from a paper it cites elsewhere, PMID:39727052,
  whose abstract states the MRI finding in one sentence. The curated knowledge
  gap had repeated the report's claim; it has been rewritten, and the sodium
  study promoted as evidence on the muscle node.

  Second, the report attributes roughly 50 percent small fiber neuropathy
  prevalence to the iCPET cohort of PMID:33577778. That paper reports 31 percent
  (49 of 160); the approximately 50 percent figure in its abstract belongs to
  postural orthostatic tachycardia syndrome and fibromyalgia, not to its own
  ME/CFS patients. The same paper also reports that denervation severity did not
  correlate with any exertional measure, which the report's framing of small
  fiber neuropathy as an upstream driver omits.

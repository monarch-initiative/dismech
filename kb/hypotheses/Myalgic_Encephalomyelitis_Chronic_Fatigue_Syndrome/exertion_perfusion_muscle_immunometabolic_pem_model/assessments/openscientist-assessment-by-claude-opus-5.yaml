claims:
  - claim_id: verdict-partially-supported-keep-emerging
    statement: >-
      The exertion-perfusion-muscle immunometabolic model is partially supported
      and should retain EMERGING status, because individual nodes have human
      evidence while the sequential causal ordering does not.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED — the hypothesis should maintain EMERGING status."
    rationale: >-
      Concordant with the curated status and with the primary sources checked
      here. No status change made. On its own this restates the seed hypothesis's
      own framing, which already described an integrated working model rather
      than an established causal chain, so it adds no new support.
    citations:
      - PMID:39240417
      - PMID:33577778
  - claim_id: causal-chain-inferred-not-demonstrated
    statement: >-
      No study has measured the full chain from exertion trigger to delayed
      symptom exacerbation in one cohort; the ordering between nodes is inferred
      from cross-sectional data.
    disposition: RETAINED
    report_quote: "no single study has tested the complete causal chain from exertion trigger through to delayed symptom exacerbation"
    rationale: >-
      Correct and consistent with every source checked. Already curated as the
      open knowledge gap gap_mecfs_pem_causal_ordering with a proposed serial
      exertion-challenge multi-omics experiment, so no new discussion was added.
  - claim_id: ionic-homeostasis-has-no-human-measurement
    statement: >-
      Intramuscular sodium has never been measured in ME/CFS, and 23Na-MRI has
      not been applied to the disease, leaving the model's ionic-homeostasis step
      with no direct human evidence.
    disposition: REJECTED
    report_quote: "23Na-MRI, which can quantify tissue sodium content non-invasively, has not been applied to ME/CFS."
    rationale: >-
      Factually wrong, and it is the report's most consequential error because
      the same assertion is repeated as its Gap 1, its Discriminating Test 2, and
      its Priority 3 follow-up experiment. Petter et al. 2022
      (DOI:10.1186/s12967-022-03616-z) performed 23Na-MRI of the left lower leg
      in six female ME/CFS patients and six matched controls before and after
      three minutes of plantar flexion exercise, reporting higher baseline sodium
      in all five lower leg compartments, a larger post-exercise rise in medial
      gastrocnemius in patients than controls, and an inverse association between
      muscle sodium and handgrip strength. That is the study the report proposes
      as novel. The finding was also available to the report inside a paper it
      cites and quotes elsewhere, PMID:39727052, whose abstract states that an
      MRI study showed elevated intracellular muscle sodium in ME/CFS correlating
      inversely with handgrip strength. Promoted to the muscle node, and the
      curated knowledge gap that had repeated this claim was rewritten.
    citations:
      - DOI:10.1186/s12967-022-03616-z
      - PMID:39727052
  - claim_id: ionic-component-is-entirely-theoretical
    statement: >-
      The ionic component of the seed model is a purely theoretical inference
      from general exercise physiology.
    disposition: REJECTED
    report_quote: "Critically, the ionic homeostasis component (Na+/Ca2+ overload in muscle) is entirely theoretical, lacking any direct human measurement in ME/CFS."
    rationale: >-
      Two errors compound here. The sodium half has a direct human measurement
      (see the preceding claim). The provenance is also wrong: the component is
      not extrapolated from general exercise physiology but comes from a specific
      ME/CFS pathomechanism model, the Wirth and Löhn sodium-proton exchange and
      reverse-mode sodium-calcium exchanger account developed in PMID:38399482
      and PMID:39727052, which the report cites for microvascular claims without
      noticing that it is the source of the ionic step it is calling
      unsubstantiated. The calcium half of the claim does survive: no in vivo
      calcium measurement in ME/CFS muscle exists, and the review it comes from
      says so explicitly.
    citations:
      - PMID:38399482
      - PMID:39727052
      - DOI:10.1186/s12967-022-03616-z
  - claim_id: icpet-two-forms-of-neurovascular-dysregulation
    statement: >-
      Invasive cardiopulmonary exercise testing identifies two forms of
      peripheral neurovascular dysregulation in ME/CFS: depressed cardiac output
      from impaired venous return, and impaired peripheral oxygen extraction.
    disposition: RETAINED
    report_quote: "two types of peripheral neurovascular dysregulation that are biologically plausible contributors to ME/CFS exertional intolerance"
    rationale: >-
      Verified against the cached paper, where the sentence appears essentially
      verbatim. Already curated as evidence on the impaired oxygen extraction
      node, so nothing was added.
    citations:
      - PMID:33577778
  - claim_id: small-fiber-neuropathy-prevalence-fifty-percent
    statement: >-
      Approximately half of the ME/CFS patients in the invasive cardiopulmonary
      exercise testing cohort had biopsy-confirmed small fiber neuropathy.
    disposition: REJECTED
    report_quote: "Approximately 50% of patients had objective small fiber neuropathy on skin biopsy, providing a structural correlate for the neurovascular dysregulation."
    rationale: >-
      The paper reports 31 percent, 49 of 160 biopsies. The approximately 50
      percent figure does appear in its abstract, but it is the reported
      prevalence in postural orthostatic tachycardia syndrome and fibromyalgia
      that motivated the study, not a result in its own ME/CFS cohort. The
      correct number is nearly a third lower. A separate cohort does report 53
      percent (PMID:41576003), so the figure is not implausible, only
      mis-sourced; the entry now carries that cohort's own number with its own
      citation.
    citations:
      - PMID:33577778
      - PMID:41576003
  - claim_id: small-fiber-neuropathy-as-upstream-driver
    statement: >-
      Small fiber neuropathy acts as an upstream driver of impaired oxygen
      extraction by shunting oxygenated blood away from capillary beds.
    disposition: QUALIFIED
    report_quote: "The identification of small fiber neuropathy as an upstream driver"
    rationale: >-
      The shunting account is the cited authors' own proposed mechanism, and it
      is reasonable, but the report presents it as an identification rather than
      a hypothesis and omits the result that cuts against it: in the same paper,
      denervation severity did not correlate with peak oxygen uptake, cardiac
      output, systemic oxygen extraction, or peak right atrial pressure. Left as
      a lead; no causal edge was drawn from small fiber neuropathy in the entry.
    citations:
      - PMID:33577778
  - claim_id: skeletal-muscle-mitochondrial-damage-electron-microscopy
    statement: >-
      Electron microscopy shows mitochondrial damage in ME/CFS skeletal muscle
      with preferential subsarcolemmal localization, together with simultaneous
      necrosis and regeneration in post-exercise biopsies.
    disposition: RETAINED
    report_quote: "damage of mitochondria in skeletal muscle of ME/CFS patients with a preferential subsarcolemmal localization but not in PCS"
    rationale: >-
      Verified verbatim in the cached review. Already curated on the
      exertion-triggered skeletal muscle node, so nothing was added. Worth noting
      that this is review-level reporting of two underlying biopsy studies rather
      than a primary result, which the report does not distinguish.
    citations:
      - PMID:39727052
  - claim_id: intrinsic-glucose-oxidation-defect-in-cultured-muscle
    statement: >-
      Cultured skeletal muscle cells from CFS patients cannot oxidize glucose
      normally while oxidizing galactose and fatty acids normally, placing the
      bioenergetic defect upstream of the TCA cycle and showing it is retained in
      culture away from any systemic factor.
    disposition: RETAINED
    report_quote: "CFS skeletal muscle cells are unable to utilise glucose to the same extent as healthy control cells"
    rationale: >-
      Verified against the cached paper. This is the most useful single addition
      the report makes to the muscle node, because it is the one result that
      separates a cell-autonomous muscle defect from a perfusion-driven one: the
      cells are outside the patient's circulation and still fail. Promoted as
      IN_VITRO evidence. The cohort is nine patients against eleven controls.
    citations:
      - PMID:33106563
  - claim_id: red-blood-cell-deformability-hemorheology
    statement: >-
      Red blood cells from ME/CFS patients are stiffer than those from healthy
      controls, adding a hemorheological contribution to impaired capillary
      oxygen delivery independent of vessel-wall pathology.
    disposition: RETAINED
    report_quote: "RBCs isolated from ME/CFS patients were significantly stiffer than those from healthy controls"
    rationale: >-
      Verified against the cached paper. Genuinely absent from the entry, and it
      supplies a distinct mechanism for the perfusion node, in which the
      transport medium rather than the vessel is impaired. Promoted. Single
      microfluidic study, so it is curated as one line of support rather than an
      established mechanism.
    citations:
      - PMID:30594919
  - claim_id: two-day-cpet-decline-is-subtype-limited
    statement: >-
      Day-2 cardiopulmonary exercise test decline is reproducible in the largest
      cohorts but failed to replicate in a 2026 study, so it characterizes a
      subset of patients rather than the whole ME/CFS population.
    disposition: RETAINED
    report_quote: "This heterogeneity is a crucial caveat: the 2-day CPET decline may characterize a subset of patients rather than the entire ME/CFS population."
    rationale: >-
      Both sides check out. The entry already carried the non-replication
      (PMID:42212259) at hypothesis level but not the positive evidence it
      qualifies, which left a reader with only the negative result; the largest
      2-day study (PMID:38965566, 84 patients against 71 sedentary controls) was
      added alongside it. That study also reports that the abnormality persists
      against controls matched for aerobic capacity, which rules out
      deconditioning as the explanation.
    citations:
      - PMID:38965566
      - PMID:42212259
      - PMID:33327624
  - claim_id: post-exercise-cytokine-activation-inconsistent
    statement: >-
      Circulating cytokines do not differ between patients and controls after
      exercise and do not explain post-exertional fatigue, which undercuts the
      model's metabolite-to-immune-activation bridge.
    disposition: RETAINED
    report_quote: "circulating cytokines do not seem to explain the core characteristic of post-exertional fatigue"
    rationale: >-
      Verified verbatim in the cached systematic review of 38 studies. This is
      the report's most useful negative finding and it bears directly on a node
      the entry states affirmatively. Promoted as REFUTE-direction evidence on the
      delayed amplification node, which previously carried only supporting
      review-level material plus the platelet single-cell result.
    citations:
      - PMID:26148446
  - claim_id: cerebrospinal-fluid-metabolites-as-peripheral-to-central-bridge
    statement: >-
      Post-exercise cerebrospinal fluid metabolite handling differs between
      ME/CFS patients and controls, providing a link from peripheral metabolic
      stress to central nervous system dysfunction.
    disposition: QUALIFIED
    report_quote: "Exercise led to consumption of lipids in ME/CFS and controls while metabolites were consumed in ME/CFS but generated in controls"
    rationale: >-
      The measurement is verified and is a genuinely novel central readout, but
      the design does not support the causal bridge the report builds on it: the
      baseline and post-exercise lumbar punctures were performed in two separate
      cohorts rather than in the same subjects before and after exertion, so the
      contrast is between-group, not within-subject. Promoted with that
      limitation stated in the explanation rather than as a demonstrated link.
    citations:
      - PMID:39941050
  - claim_id: shared-autonomic-phenotype-cerebral-blood-flow
    statement: >-
      Reduced orthostatic cerebral blood flow velocity is present in the large
      majority of ME/CFS and Long COVID patients, alongside widespread autonomic
      failure and small fiber neuropathy.
    disposition: RETAINED
    report_quote: "extensive similarities between Long COVID and ME/CFS, including reduced orthostatic CBFv (92%/88% in Long COVID/ME/CFS)"
    rationale: >-
      Verified against the cached paper. The cerebral hypoperfusion node in the
      entry previously rested on a neuroimaging systematic review with no
      prevalence figure, so this adds quantification from 170 ME/CFS patients and
      a same-cohort small fiber neuropathy rate. Promoted. Retrospective and from
      a single referral autonomic laboratory, which is stated in the explanation.
    citations:
      - PMID:41576003
  - claim_id: hypometabolic-syndrome-supports-the-model
    statement: >-
      Broad metabolomic profiling showing 80 percent of diagnostic metabolites
      decreased supports the model's account of exertional metabolic failure.
    disposition: QUALIFIED
    report_quote: "80% of the diagnostic metabolites decreased, consistent with a hypometabolic syndrome"
    rationale: >-
      The finding is verified, but the report files it as straightforward support
      without reconciling it against the metabolomics result the seed hypothesis
      itself rests on, which reports a hypermetabolic event during the seven-day
      PEM window (PMID:31277442, already curated). Baseline hypometabolism and
      acute post-exertional hypermetabolism are not contradictory if they sit at
      different timescales, but the report asserts neither the tension nor the
      resolution. Not promoted; the entry already carries the PEM-window
      metabolomics, and adding a baseline contrast without the reconciliation
      would import the same ambiguity.
    citations:
      - PMID:27573827
      - PMID:31277442
  - claim_id: atg13-autophagy-model-organism-link
    statement: >-
      Impaired ATG13-driven autophagy causes mitochondrial dysfunction, M1
      macrophage infiltration of muscle vasculature, and muscle-nerve damage, and
      is a candidate mechanistic link to post-exertional malaise.
    disposition: QUALIFIED
    report_quote: "ablation of the atg13 gene resulted in increased infiltration of M1 macrophages into the muscle vasculature"
    rationale: >-
      The mouse result is real and correctly reported, and the authors themselves
      offer the ME/CFS connection. But the connection is theirs, not a
      demonstrated one: hemizygous atg13 deletion is not a validated ME/CFS model,
      the phenotype is exercise-related muscle weakness rather than delayed
      post-exertional symptom exacerbation, and no human ATG13 evidence in ME/CFS
      exists. Not promoted. Adding an autophagy arm to the pathograph on one
      mouse study would put a MODEL_ORGANISM inference on the same footing as the
      human nodes around it.
    citations:
      - PMID:41591477

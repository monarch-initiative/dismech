claims:
- claim_id: organoid-sufficiency
  statement: An epithelial-fibroblast TGF-beta route can operate without immune cells in the tested
    organoid system.
  disposition: RETAINED
  report_quote: can operate without immune cell involvement in vitro
  rationale: Enomoto uses mouse and human lung-derived co-cultures excluding immune cells and perturbs
    epithelial TGF-beta signaling. This establishes conditional in-vitro sufficiency under bleomycin
    stimulation, not that whole-animal or untreated human disease is immune independent. The YAML
    retains the autocrine/paracrine route and a scoped organoid model.
  citations:
  - PMID:37653024
- claim_id: universal-second-hit
  statement: Every telomere-dysfunction mouse model requires an exogenous second hit to develop
    fibrosis.
  disposition: REJECTED
  report_quote: every mouse model requires a second hit
  rationale: TRF1 deletion studies published in 2015 and 2016 produce spontaneous fibrosis without
    bleomycin. Severe shelterin uncapping differs from ordinary attrition, but directly contradicts
    the claim about all telomere dysfunction models. Conditional AT2 Sin3a loss also causes spontaneous
    progressive fibrosis, whereas AT2 ablation alone gives transient remodeling. The Sin3a erratum
    corrects figure alignment, panel labels and the RosaDTA comparator, not the conclusion. A 2026
    tDDR-targeting study further reports spontaneous fibrosis in late-generation telomerase-deficient
    mice. The YAML distinguishes these positive models from TERT and L188Q SFTPC second-hit models.
  citations:
  - PMID:26146081
  - PMID:27699234
  - PMID:32991815
  - PMID:34256008
  - PMID:42587125
- claim_id: tert-is-not-telomere-shortening
  statement: The cited AT2 TERT-knockout experiment directly establishes fibrosis from telomere
    attrition.
  disposition: REJECTED
  report_quote: '[STRONG: MR OR 4.19-12.3, AT2-TERT KO mice]'
  rationale: PMID:31000627 explicitly reports no significant effect on AECII telomere length. TERT
    loss increased senescence and bleomycin susceptibility but did not cause spontaneous fibrosis
    over nine months. These results support epithelial TERT function, including potentially telomere-independent
    effects, and cannot be substituted for demonstrated telomere attrition. TERT can also act differently
    in fibroblasts.
  citations:
  - PMID:31000627
- claim_id: obligatory-cgas-sting-immunity
  statement: AT2 senescence necessarily activates STING and makes recruited immune cells obligatory
    for fibrosis.
  disposition: REJECTED
  report_quote: Immune activation is an obligate consequence of senescence
  rationale: Schuliga demonstrates human cGAS colocalization and senescence effects from RU.521,
    cGAS RNA interference, mtDNA addition and DNase in epithelial cultures. Colocalized expression
    is not itself pathway activation; the study does not establish obligatory STING or universal
    dependence on recruited immune cells. Epithelial-intrinsic innate sensing and immune-cell dependence
    are different propositions. The YAML adds a scoped self-DNA/cGAS amplifier, not an obligatory
    cGAS-STING arrow.
  citations:
  - PMID:34524912
  - PMID:37653024
- claim_id: ccl12-context
  statement: Epithelial CCL12 deletion proves universal in-vivo immune dependence.
  disposition: QUALIFIED
  report_quote: epithelial-derived monocyte chemoattractants are necessary for fibrosis in vivo
  rationale: Epithelial-specific CCL12 deletion protected mice and reduced exudate macrophages in
    the particular bleomycin paradigm. Complete CCL12 deletion was not protective because other
    CCR2 ligands rose. Human anti-CCL2 treatment had not shown response. IRAK-M bone-marrow chimeras
    support recruitment-dependent collagen deposition in a defined injury model. These findings
    support one amplification route rather than refuting every immune-cell-free epithelial route.
  citations:
  - PMID:31922885
  - PMID:32253243
  - PMID:37771586
- claim_id: terc-nk-association
  statement: TERC deficiency shows that telomere dysfunction recruits innate immune cells through
    defined p53 pathways.
  disposition: QUALIFIED
  report_quote: telomere dysfunction itself recruits innate immune cells through both p53-dependent
    and -independent pathways
  rationale: The TERC study associates epithelial senescence and altered differentiation with increased
    NK cells. It separates p53-dependent senescence/apoptosis from p53-independent differentiation,
    but does not establish that both p53 routes causally recruit NK cells or that NK cells are necessary
    for fibrosis. Keep cell-state and immune associations distinct.
  citations:
  - PMID:34831112
- claim_id: exclusive-telomeropathy-subtype
  statement: Short leukocyte telomere frequencies define an exclusive senescence-first IPF subtype.
  disposition: REJECTED
  report_quote: (~25–50% of patients)
  rationale: The quoted quarter of sporadic and half of familial cases comes from a 2018 review
    with assay, threshold and cohort dependence. These are different denominators, not a 25–50%
    validated universal subtype. Blood telomere status does not identify the fraction of disease
    caused by AT2 senescence, and senescence can arise through other stresses. The YAML keeps telomere-associated
    enrichment without excluding senescence mechanisms in other patients.
  citations:
  - PMID:30067250
  - PMID:30320420
  - PMID:32991815
  - PMID:32109549
- claim_id: muc5b-route
  statement: MUC5B overexpression supplies a clearance-related susceptibility route.
  disposition: QUALIFIED
  report_quote: This represents a competing, non-senescence mechanism
  rationale: Muc5b overexpression impairs clearance and increases persistence of bleomycin fibrosis
    in mice, with mucolytic rescue. This supports a distinct candidate route but does not prove
    senescence is absent or that MUC5B and telomere mechanisms define mutually exclusive patients.
    The YAML adds the clearance route with injury-model scope.
  citations:
  - PMID:30560893
- claim_id: muc5b-telomere-literature-gap
  statement: MUC5B and telomere mechanisms have never been studied in combination.
  disposition: REJECTED
  report_quote: The two dominant IPF genetic mechanisms are unstudied in combination.
  rationale: PMID:36690926 tested MUC5B genotype by measured leukocyte telomere length in MESA,
    finding a stronger high-attenuation-area association below the fifth telomere percentile. It
    also discusses prior IPF and chronic-HP studies with no interaction. MESA CT attenuation is
    not confirmed IPF and telomere length is not a direct AT2 senescence assay, so cellular MUC5B-senescence
    crosstalk remains unresolved. The blanket no-relevant-study conclusion and implied novelty of
    any statistical interaction study are incorrect.
  citations:
  - PMID:36690926
  - PMID:30560893
- claim_id: wnt-independence
  statement: Chronic canonical Wnt induces AT2 senescence independently of telomeres.
  disposition: QUALIFIED
  report_quote: Chronic Wnt/β-catenin signaling independently induces AT2 senescence
  rationale: Sustained canonical activation induces senescence in primary AT2 cells, epithelial
    lines and precision-cut slices. The study did not establish telomere independence, as the report
    itself acknowledges later. WNT5A did not induce senescence in this specific assay; this does
    not exclude other WNT5A fibrotic actions. The YAML includes the directly tested canonical route.
  citations:
  - PMID:32109549
  - PMID:34377373
  - PMID:12707032
- claim_id: fao-route
  statement: CPT1a deficiency contributes to senescence and aberrant repair.
  disposition: QUALIFIED
  report_quote: as an independent upstream trigger of AT2 senescence
  rationale: Human FAO expression is reduced; CPT1a inhibition/deletion produces mitochondrial dysfunction,
    low SMAD7, increased TGF-beta signaling and intermediate epithelial states, and amplifies fibrosis
    susceptibility in mice. These data support a metabolic route, not a validated metabolic patient
    subtype or proof of independence from every telomere/aging pathway.
  citations:
  - PMID:39927460
- claim_id: surfactant-upr-heterogeneity
  statement: All cited surfactant variants cause profibrotic TGF-beta secretion through ER stress.
  disposition: REJECTED
  report_quote: SP-A/C variants induce TGF-β1 secretion via ER stress
  rationale: 'Maitra shows variant-specific dependence: SP-A 1 R219W secretion is UPR dependent,
    while SP-C I73T and M71V effects are largely UPR independent. L188Q SFTPC sensitizes mice to
    bleomycin without spontaneous fibrosis in that model. Human UPR/herpesvirus colocalization does
    not establish viral causation. The YAML preserves variant-specific proteostasis and signaling
    routes.'
  citations:
  - PMID:23926107
  - PMID:21670280
  - PMID:18390830
- claim_id: basaloid-lineage
  statement: Senescence necessarily drives the human aberrant basaloid lineage.
  disposition: QUALIFIED
  report_quote: AT2 senescence to aberrant basaloid phenotype
  rationale: Marker coexpression and trajectory inference are insufficient for a universal senescence-to-basaloid
    causal edge. Human AT2 organoids and xenografts demonstrate a basal transition driven by mesenchymal
    signals; KRT5-positive metaplastic basal cells differ from KRT5-negative/KRT17-positive aberrant
    basaloids. The 2026 TGF-beta/SMAD3 perturbation study supports dysplastic repair regulation.
    The YAML removes unsupported direct lineage arrows and retains the experimentally supported
    TGF-beta and FAO routes.
  citations:
  - PMID:32832599
  - PMID:34969962
  - PMID:42182417
- claim_id: early-disease-not-initiation
  statement: Early IPF tissue observations establish the initiating epithelial event.
  disposition: QUALIFIED
  report_quote: AT2 loss is an early event
  rationale: The early cohorts already had diagnosed IPF with preserved lung function; they were
    not healthy individuals prospectively followed into first disease. Cell-state proportions associated
    with later progression support early clinical relevance, not proof of the initiating lesion
    or temporal primacy over all stromal and immune changes.
  citations:
  - PMID:42388797
- claim_id: gdf15-causal-signal
  statement: The cited GDF15 biomarker paper demonstrates a secreted profibrotic causal signal.
  disposition: REJECTED
  report_quote: senescence → secreted profibrotic signal
  rationale: The paper identifies epithelial GDF15 expression and circulating associations with
    severity and survival. TGF-beta-family membership does not establish GDF15-driven fibrosis.
    It is curated as an observational stress biomarker, without a causal GDF15-to-fibroblast edge.
  citations:
  - PMID:31432710
- claim_id: gdf15-validation
  statement: GDF15 lacks any meaningful human IPF biomarker validation.
  disposition: QUALIFIED
  report_quote: GDF15 and other senescence biomarkers have not been validated in large prospective
    IPF cohorts.
  rationale: PMID:31432710 reports human tissue, single-cell source attribution and circulating
    associations in multiple independent cohorts. Additional prospective, treatment-predictive and
    disease-specific validation is still needed, but a blanket lack-of-validation characterization
    misses existing human replication. GDF15 is not an established specific measure of AT2 senescent-cell
    burden.
  citations:
  - PMID:31432710
- claim_id: fibroblast-persistence
  statement: Senescent apoptosis-resistant fibroblasts contribute to persistent fibrosis.
  disposition: RETAINED
  report_quote: fibroblast senescence is an independent persistence mechanism
  rationale: NOX4/NRF2 perturbations, impaired dedifferentiation and conditional BCL-2 expression
    support mesenchymal persistence as a complementary mechanism in experimental systems, with human
    tissue/culture relevance. Independence means a separable experimental contribution, not proof
    that epithelial input is dispensable in every human case.
  citations:
  - PMID:24718857
  - PMID:31962055
  - PMID:41764163
- claim_id: macrophages-can-resolve
  statement: Macrophage-derived signals contribute to SIRT3-associated fibrosis resolution.
  disposition: RETAINED
  report_quote: macrophage-derived signals necessary for SIRT3-mediated resolution
  rationale: The SIRT3 study supports macrophage-secreted products activating fibroblast FoxO3a
    and restoring apoptosis susceptibility. It counters an undifferentiated all-macrophages-profibrotic
    model; the YAML explicitly records this state-dependent resolution function.
  citations:
  - PMID:34386777
- claim_id: endothelial-aging
  statement: Endothelial aging is a proven independent initiating driver in all IPF.
  disposition: QUALIFIED
  report_quote: endothelial cells as independent profibrotic drivers
  rationale: ERG loss causes paracrine fibroblast activation and impaired fibrosis resolution in
    experiments. The male-mouse aging atlas identifies changing capillary-cell states and human
    overlap but does not directly prove a new initiating human lesion or necessity of every inferred
    ligand pathway. The YAML represents an experimentally supported repair modifier.
  citations:
  - PMID:35879310
  - PMID:40769983
- claim_id: senolytic-efficacy
  statement: Small D+Q trials establish efficacy in IPF.
  disposition: QUALIFIED
  report_quote: Senolytics Show Feasibility but Limited Efficacy Evidence in IPF
  rationale: The report appropriately recognizes limited efficacy evidence. The open-label n=14
    physical-function improvements cannot exclude regression, practice or placebo effects. The randomized
    n=12 study found no meaningful between-group functional difference and more nonserious adverse
    events with D+Q, including sleep/anxiety imbalance. Neither establishes FVC benefit or fibrosis
    reversal. The YAML uses actual outcome snippets instead of trial rationale.
  citations:
  - PMID:30616998
  - PMID:36857968
- claim_id: senolytic-target-engagement
  statement: Adipose senolytic target engagement establishes IPF-lung target engagement.
  disposition: QUALIFIED
  report_quote: proved target engagement in humans
  rationale: The report correctly names diabetic kidney disease; the tissue was adipose and skin,
    not IPF lung. Those findings demonstrate activity in a different population/compartment and
    cannot supply missing IPF epithelial or fibroblast target engagement.
  citations:
  - PMID:31542391
- claim_id: mr-causal-scope
  statement: Published MR proves a temporally initiating AT2 mechanism specific to IPF.
  disposition: QUALIFIED
  report_quote: The IPF-specific causal effect (absent for COPD)
  rationale: The reported OR 4.19 and 12.3 are published, instrument-dependent susceptibility estimates
    with uncertainty and ancestry limitations. They support a telomere contribution under MR assumptions,
    not an interventional treatment effect, AT2-specific timing or proof of no effect in every disease
    beyond the COPD comparator. No new MR was run by OpenScientist.
  citations:
  - PMID:33197388
  - PMID:37170112
- claim_id: scarf2-mr
  statement: SCARF2 is a validated telomere-independent causal IPF pathway.
  disposition: QUALIFIED
  report_quote: confirming non-telomere causal pathways also exist
  rationale: The source reports protein/genetic associations and colocalization, but the cellular
    and cohort validation primarily concern COPD. It does not experimentally establish an IPF mechanism;
    mediation MR has assumptions and absence of estimated LTL mediation does not prove all biological
    independence. The source abstract also calls a cohort association inverse while reporting HR>1,
    requiring orientation checks before importing a direction. No SCARF2 causal node was promoted.
  citations:
  - PMID:38958042
- claim_id: epigenetic-age
  statement: Epigenetic-clock associations prove accelerated aging initiates fibrosis.
  disposition: QUALIFIED
  report_quote: establishing an intra-individual correlation between biological aging and fibrosis
    severity
  rationale: Methylation-clock and within-lung severity correlations are observational, with cell-composition
    and disease-effects limitations. They support an aging-associated state, not causal ordering
    or clinical validation of a treatment-selection clock. The finding is retained as context, without
    an initiating methylation arrow.
  citations:
  - PMID:39970931
- claim_id: telomere-meta-analysis
  statement: The telomere meta-analysis independently establishes causality.
  disposition: QUALIFIED
  report_quote: Meta-Analysis Confirms Shorter Telomeres in IPF
  rationale: The six-study synthesis reports shorter telomeres in cases, not a new provider calculation.
    Cross-sectional or mixed observational measurements cannot alone establish causal ordering or
    define a uniform subtype. The estimates complement genetic evidence and should not receive unqualified
    mechanistic causal confidence.
  citations:
  - PMID:41728098
  - PMID:30320420
- claim_id: spatial-localization
  statement: Spatial association in morphologically normal IPF alveoli proves pre-disease cellular
    initiation.
  disposition: QUALIFIED
  report_quote: epithelial abnormalities extend beyond visible fibrotic areas
  rationale: Spatial integration supports heterogeneity within diseased lungs and association with
    histologic regions. Morphologically normal areas of an IPF lung are not healthy pre-disease
    samples. Watanabe additionally tests PAK inhibition in culture and mice; that experimental therapeutic
    lead is distinct from causal inference based solely on spatial colocalization.
  citations:
  - PMID:39846634
  - PMID:40675771
- claim_id: gene-curation-gap
  statement: Absence of an exact IPF-specific ClinGen label means relevant formal curation is lacking.
  disposition: QUALIFIED
  report_quote: No Formal GenCC/ClinGen Curation of Telomere Genes Specifically for IPF
  rationale: 'The report provides literature searching rather than database-query evidence. The
    current repository ClinGen snapshot contains Definitive PARN and RTEL1 telomere-related pulmonary-fibrosis/bone-marrow-failure
    records and broader TERT/TERC syndromic records. Ontology scope matters: lack of the exact IPF
    label is not absence of formal curation. No broad negative database result is accepted.'
- claim_id: transplant-scope
  statement: Telomere-related complications warrant transplant-specific assessment.
  disposition: RETAINED
  report_quote: managing immunosuppression-related myelotoxicity
  rationale: The narrative review appropriately emphasizes hematologic fragility and medication
    toxicity in telomere biology disorders. This is clinically relevant to a subset, not a general
    IPF contraindication to transplant. The 2025 date in report prose differs from the 2026 publication
    record but does not alter the clinical inference.
  citations:
  - PMID:41624889
- claim_id: discriminating-designs
  statement: The proposed experiments cleanly distinguish independent biological mechanisms.
  disposition: QUALIFIED
  report_quote: 'Expected result if immune independence holds:'
  rationale: A global STING knockout changes epithelial and immune compartments and may alter baseline
    senescence, so factorial cell-specific controls, injury burden and pathway engagement are needed.
    Additive and multiplicative statistical interactions answer different scale-dependent questions
    and do not directly prove biological independence. A nominal 200-per-arm senolytic design lacks
    power assumptions, and p16/p21 overexpression requires validation of durable senescence rather
    than mere growth arrest. These are useful proposals, not completed analyses.
  citations:
  - PMID:34524912
  - PMID:31000627
  - PMID:36690926
- claim_id: screening-execution
  statement: The provider completed a reproducible systematic104-paper review.
  disposition: NEEDS_VERIFICATION
  report_quote: systematic evaluation of 104 publications across 5 investigation iterations
  rationale: Only the report and citation sidecar are committed. Forty-one unique PMIDs occur in
    the output body; no screening list or query logs substantiate 104 evaluations or systematic
    completeness. Several missed counterexamples materially change the conclusion.
  analysis_ids:
  - literature-screening
- claim_id: artifact-audit
  statement: The declared22-file artifact bundle substantiates computational outputs.
  disposition: NEEDS_VERIFICATION
  report_quote: 'artifact_count: 22'
  rationale: Every declared provider artifact path is missing in the repository. No manifests, scripts,
    environments or result tables can be inspected or replayed. Missing files are not evidence of
    a failed computation, but prevent a SUCCEEDED status or reliance on generated figures as independent
    evidence.
  analysis_ids:
  - figure-and-matrix-generation
- claim_id: proposed-computation
  statement: Spatial mapping and interaction analysis were performed in this run.
  disposition: REJECTED
  report_quote: Immediate (Computational/Bioinformatic)
  rationale: These sections explicitly propose future computational actions. No downloaded data
    or executable outputs exist, so they are SKIPPED and not linked as successful grounds for biological
    claims.
  analysis_ids:
  - future-spatial-mapping
  - future-muc5b-interaction
  - future-molecular-subtyping

claims:
  - claim_id: overall-verdict-partially-supported
    statement: >-
      The senescence-first model is partially supported and should keep its
      ALTERNATIVE status, subject to three refinements about immune
      independence, upstream trigger multiplicity, and the two-hit requirement.
    disposition: RETAINED
    report_quote: "Verdict: PARTIALLY SUPPORTED — with three critical refinements required."
    rationale: >-
      Consistent with the primary sources I checked and with the curated entry.
      The report explicitly recommends retaining ALTERNATIVE, so no status change
      was made.
    citations:
      - PMID:33197388
      - PMID:31000627
      - PMID:37653024
  - claim_id: immune-independence-is-in-vitro-only
    statement: >-
      The model's immune-independence claim holds only in vitro, because
      senescent alveolar epithelium engages innate immunity through cGAS-STING
      and epithelial-derived monocyte chemoattractants are required for fibrosis
      in vivo.
    disposition: QUALIFIED
    report_quote: "Immune activation is an obligate consequence of senescence"
    rationale: >-
      The direction is right and is already curated on the hypothesis entry as
      PMID:34524912 (SUPPORT, qualifying) and PMID:31922885 (REFUTE). The word
      "obligate" is stronger than either source supports: Schuliga reports cGAS
      immunoreactivity co-localized with p21 in IPF tissue, which is an
      association, and Yang shows epithelial CCL12 is necessary for
      bleomycin-induced fibrosis in mice, which does not establish that
      senescence necessarily activates immunity. Retained as curated; no new
      content added.
    citations:
      - PMID:34524912
      - PMID:31922885
  - claim_id: multiple-upstream-senescence-triggers
    statement: >-
      Telomere attrition is one of several upstream inducers of alveolar type II
      cell senescence, alongside chronic WNT/beta-catenin signaling, endoplasmic
      reticulum stress, and fatty acid oxidation deficiency.
    disposition: RETAINED
    report_quote: "Telomere attrition is one of multiple upstream triggers"
    rationale: >-
      The entry asserted this only in free-text hypothesis notes, with no
      citation and no structural representation. Verified at source for two of
      the named routes and integrated: a new pathophysiology node for chronic
      canonical WNT/beta-catenin reactivation feeding the AT2 senescence node,
      and CPT1a/fatty acid oxidation evidence on that node. Endoplasmic
      reticulum stress was left uncurated here because its cited sources
      (PMID:18390830, PMID:23926107, PMID:21670280) describe a surfactant-mutant
      route that is a different upstream story from senescence and deserves its
      own curation pass rather than a note appended to this one.
    citations:
      - PMID:32109549
      - PMID:39927460
      - PMID:12707032
  - claim_id: wnt-beta-catenin-induces-at2-senescence
    statement: >-
      Chronic, but not acute, canonical WNT/beta-catenin activation is
      sufficient to induce senescence in alveolar type II cells, giving a
      telomere-independent entry point into the senescence node.
    disposition: RETAINED
    report_quote: "chronic WNT/β-catenin signaling induces cellular senescence in lung epithelial cells"
    rationale: >-
      Verified against the cached full text. One caveat the report does not
      flag: the words it quotes are the paper's title, not a finding sentence,
      so the proposed snippet could not be used as curated evidence. I used the
      experimental sentence instead, which additionally records that the
      non-canonical ligand WNT5A did not induce senescence, and paired it with
      Chilosi 2003 for human tissue grounding.
    citations:
      - PMID:32109549
      - PMID:12707032
  - claim_id: fao-cpt1a-deficiency-drives-at2-senescence
    statement: >-
      Loss of CPT1a, the rate-limiting enzyme of fatty acid oxidation, in
      alveolar type II cells promotes senescence and aberrant intermediate
      epithelial states and increases susceptibility to lung fibrosis.
    disposition: RETAINED
    report_quote: "mice with deficiency of CPT1a in AT2 cells show enhanced susceptibility to developing lung fibrosis with an accumulation of epithelial cells expressing markers of intermediate cells, airway secretory cells, and senescence."
    rationale: >-
      The proposed snippet is an exact substring of the cached abstract and the
      attribution is correct. Integrated as MODEL_ORGANISM evidence on the AT2
      senescence node. Note the study also shows this route converges on
      TGF-beta by lowering SMAD7, so it reinforces rather than competes with the
      model's downstream chain.
    citations:
      - PMID:39927460
  - claim_id: two-hit-requirement-not-autonomous-driver
    statement: >-
      No animal model develops fibrosis from telomere dysfunction alone; every
      one requires a second injury, which argues against senescent AT2 cells as
      autonomous fibrotic drivers.
    disposition: RETAINED
    report_quote: "No spontaneous fibrosis occurs from telomere dysfunction alone"
    rationale: >-
      Correct and already curated: the entry's PMID:31000627 evidence quotes the
      SPC-Tert cKO mice not developing fibrosis spontaneously up to nine months,
      and its explanation already names the required second hit. The existing
      injury-versus-senescence ordering discussion carries the open question. No
      change needed.
    citations:
      - PMID:31000627
  - claim_id: telomeropathy-subtype-scope-restriction
    statement: >-
      The model best describes a telomeropathy-associated subtype rather than
      IPF as a whole, since reduced telomere length is found in roughly a
      quarter of sporadic and half of familial cases.
    disposition: RETAINED
    report_quote: "reduced telomere length may be identified in a quarter of patients with sporadic idiopathic pulmonary fibrosis and half of those cases with family aggregation"
    rationale: >-
      The quoted sentence is verbatim in the cached review. The entry already
      stated these figures in hypothesis notes with no citation; the source is
      now attached as an evidence item marked REFUTE, because it contradicts the
      hypothesis as written (that IPF is fundamentally a stem-cell exhaustion
      disease) while remaining fully compatible with a telomeropathy subtype.
    citations:
      - PMID:30067250
  - claim_id: senolytic-evidence-feasibility-not-efficacy
    statement: >-
      Human senolytic data in IPF are limited to two small trials showing
      feasibility, tolerability, and improved physical function without change
      in pulmonary function; no powered efficacy trial exists.
    disposition: RETAINED
    report_quote: "physical function evaluated as 6-min walk distance, 4-m gait speed, and chair-stands time was significantly and clinically-meaningfully improved (p < .05)"
    rationale: >-
      Verified in the cached abstract, including the unchanged pulmonary
      function that the report also reports honestly. The treatment entry cited
      only the later Nambiar pilot, so the first-in-human study was added with a
      snippet that carries both halves of the result.
    citations:
      - PMID:30616998
      - PMID:36857968
  - claim_id: gdf15-epithelial-senescence-biomarker
    statement: >-
      GDF15 is a secreted product of telomere-dysfunctional senescent alveolar
      type II cells whose circulating concentration is elevated in IPF and
      tracks disease severity and survival.
    disposition: RETAINED
    report_quote: "transcriptional profiling of senescent type II alveolar epithelial cells from mice with epithelial-specific telomere dysfunction"
    rationale: >-
      Verified. The abstract carries both the mouse discovery route and the
      human validation across multiple independent cohorts, which is more than
      the report claims for it. Added as a biochemical entry reading out the AT2
      senescence node, with the report's own specificity caveat recorded, since
      GDF15 rises in cancer, heart failure, renal disease, and ageing.
    citations:
      - PMID:31432710
  - claim_id: at2-to-basaloid-transition-driver-unresolved
    statement: >-
      Aberrant basaloid cells arise from human AT2 cells, but the transition is
      driven by fibrotic mesenchymal signalling rather than demonstrably by AT2
      senescence itself.
    disposition: QUALIFIED
    report_quote: "Kathiriya et al. (2022) showed that human AT2 cells transdifferentiate into basal cells via TGF-β1 signaling through alveolar-basal intermediates"
    rationale: >-
      The citation is accurate, but the report files it under support for
      senescence as the initiating event, and the paper does not show that. Its
      driver is TGF-beta1 and anti-BMP signalling from CTHRC1-high pathologic
      fibroblasts, and the transdifferentiation is human-specific, not seen in
      murine AT2 cells. The report's own Knowledge Gap 8 concedes there is no
      direct perturbation evidence that senescence causes the basaloid state.
      Added as evidence on the basaloid node with that framing, plus a knowledge
      gap recording that the entry's senescence-to-basaloid edge is inferred.
    citations:
      - PMID:34969962
      - PMID:32832599
  - claim_id: muc5b-senescence-interaction-unstudied
    statement: >-
      Whether MUC5B overexpression promotes, prevents, or is independent of AT2
      senescence has not been studied, leaving the two leading IPF risk
      mechanisms uncharacterized in combination.
    disposition: RETAINED
    report_quote: "Whether MUC5B overexpression promotes, prevents, or is independent of AT2 senescence is completely unknown."
    rationale: >-
      A genuine and checkable absence, and the most useful gap the report
      surfaced. The entry curates MUC5B genetically and AT2 senescence
      mechanistically without connecting them. Added as a KNOWLEDGE_GAP
      discussion attached to both, with the co-expression and epistasis
      experiments the report proposes. The supporting fact that MUC5B is
      expressed in AT2 cells and honeycomb-cyst epithelium is itself sourced
      (PMID:30560893) and correct.
    citations:
      - PMID:30560893
  - claim_id: scarf2-non-telomere-causal-pathway
    statement: >-
      SCARF2 is a causally protective, telomere-length-independent pathway in
      IPF, demonstrating that non-telomere causal routes exist.
    disposition: QUALIFIED
    report_quote: "Wang et al. (2024) found that SCARF2 protein is causally protective against IPF via proteome-wide MR, with the effect NOT mediated by leukocyte telomere length"
    rationale: >-
      Literally true of the abstract but materially oversold. The paper is
      titled and concluded for chronic obstructive pulmonary disease, its IPF
      odds ratio is 0.9974 (0.9970 to 0.9978) against 0.7431 for COPD, and its
      single-cell and UK Biobank validation steps supported COPD only. Not
      promoted to the entry; a near-null effect from one MR study is not
      curatable as a competing causal pathway.
    citations:
      - PMID:38958042
  - claim_id: multicellular-aging-beyond-at2
    statement: >-
      Endothelial and fibroblast ageing are independent profibrotic drivers, so
      the ageing-fibrosis link in IPF is not confined to alveolar type II cells.
    disposition: QUALIFIED
    report_quote: "Loss of endothelial ERG enhances paracrine fibroblast activation in vitro, and impairs lung fibrosis resolution in young mice in vivo."
    rationale: >-
      The quotation is verbatim in the cached source and the underlying claim is
      well supported across the report's fibroblast and endothelial citations.
      Not integrated: the report itself asks whether this belongs in a separate
      multi-cellular ageing hypothesis, the entry has no endothelial or
      fibroblast senescence nodes to attach it to, and building that
      infrastructure from a hypothesis-scoped report would exceed what this
      review establishes. Recorded here as a lead for a dedicated pass.
    citations:
      - PMID:35879310
      - PMID:24718857
  - claim_id: provider-run-artifact-bundle-missing
    statement: >-
      The run performed a systematic, iterative evidence synthesis over 104
      publications producing 18 confirmed findings and 22 provenance artifacts.
    disposition: NEEDS_VERIFICATION
    report_quote: "Report generated through systematic evaluation of 104 publications across 5 investigation iterations, confirming 18 distinct findings."
    rationale: >-
      Nothing in the repository substantiates the process. The frontmatter lists
      22 files under openscientist_artifacts/, that directory does not exist,
      and every embedded figure reference in the report body is therefore
      dangling. The citations sidecar lists 41 PMIDs, not 104 publications, so
      the paper count cannot be checked either. This does not impugn the
      report's content, which held up on every source check I ran; it means the
      run's own account of itself is unauditable.
    analysis_ids:
      - literature-evidence-synthesis

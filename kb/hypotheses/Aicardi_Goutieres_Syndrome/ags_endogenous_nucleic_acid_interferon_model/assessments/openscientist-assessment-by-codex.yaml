  - claim_id: omics-absence
    statement: >-
      No large public transcriptomic, proteomic, or metabolomic datasets from
      AGS patient tissues are available.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      No large transcriptomic, proteomic, or metabolomic datasets from AGS
      patient tissues (especially brain) are publicly available.
    rationale: >-
      The report says a literature search found no study, but it gives no
      database names, accession searches, query strings, dates, size threshold,
      tissue definition, or negative-result artifact. Absence from 35 exposed
      PubMed citations is not evidence of absence from GEO, SRA, EGA, dbGaP,
      controlled-access repositories, or other data catalogs. Preserve this as
      a search task, not a curated source-level fact.

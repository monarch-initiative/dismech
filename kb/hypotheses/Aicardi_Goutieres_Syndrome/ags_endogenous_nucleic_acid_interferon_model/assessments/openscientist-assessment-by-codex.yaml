claims:
  - claim_id: trex1-cgas-epistasis
    statement: >-
      cGAS is required for the lethal systemic autoimmune phenotype of
      Trex1-null mice.
    disposition: RETAINED
    report_quote: >-
      Trex1-/- mice lacking cGAS are completely protected from lethality,
      exhibit dramatically reduced tissue inflammation, and fail to develop
      autoantibodies
    rationale: >-
      PMID:26223655 directly crossed cGas-null and Trex1-null mice and observed
      protection from lethality, tissue inflammation, autoantibodies, and the
      peripheral interferon signature. PMID:39254994 further localized the
      disease-driving cGAS requirement to conventional dendritic cells in this
      model. This is strong model-organism epistasis for the TREX1 arm, although
      it does not by itself establish every human AGS manifestation.
    citations:
      - PMID:26223655
      - PMID:39254994
  - claim_id: adar1-mda5-interferon
    statement: >-
      ADAR1 Z-RNA-binding defects can cause MDA5-dependent interferon signaling
      and AGS-like encephalopathy in mice.
    disposition: RETAINED
    report_quote: >-
      blocking type I IFN signaling fully reversed ADAR1 Zα-mutant
      encephalopathy in mice, while deleting downstream effectors PKR or ZBP1
      individually did not achieve rescue
    rationale: >-
      PMID:34380029 and PMID:34525338 connect deficient ADAR1 Z-RNA binding and
      reduced editing to MDA5-dependent inflammation in mouse models.
      PMID:41855203 reports reversal of the Zα-mutant encephalopathy after
      blocking type I interferon signaling, whereas individual PKR or ZBP1
      deletion did not reproduce that rescue. Keep the conclusion restricted
      to the studied models and ADAR1 arm.
    citations:
      - PMID:34380029
      - PMID:34525338
      - PMID:41855203
  - claim_id: histone-processing-cgas
    statement: >-
      LSM11 and RNU7-1 histone pre-mRNA-processing defects can enhance
      cGAS-STING signaling through altered chromatin.
    disposition: RETAINED
    report_quote: >-
      Biallelic mutations cause misprocessing of replication-dependent histone
      transcripts, disturbed linker histone stoichiometry, altered nuclear cGAS
      distribution, and enhanced cGAS-STING-mediated IFN signaling
    rationale: >-
      PMID:33230297 identified biallelic LSM11 and RNU7-1 variants, measured
      histone-transcript and linker-histone abnormalities, observed enhanced
      cGAS-STING signaling in patient fibroblasts, and showed that
      linker-histone-depleted chromatin stimulated cGAMP production more
      efficiently in vitro. This supports the subtype-specific extension.
    citations:
      - PMID:33230297
  - claim_id: ifih1-gain-of-function
    statement: >-
      IFIH1 gain-of-function variants demonstrate that increased self-RNA
      sensing can be sufficient for an AGS-spectrum interferonopathy.
    disposition: RETAINED
    report_quote: >-
      Mutant MDA5 proteins bind RNA more avidly, increasing baseline and
      ligand-induced IFN signaling.
    rationale: >-
      PMID:24686847 identified heterozygous IFIH1 variants in people with
      neuroimmunological phenotypes and enhanced interferon signaling, and
      cellular and biochemical assays showed increased RNA avidity and
      gain-of-function signaling. This is direct support for sensor
      hyperactivation as one route into the canonical pathway.
    citations:
      - PMID:24686847
  - claim_id: human-interferon-signature
    statement: >-
      A positive blood interferon-stimulated-gene score is common, but not
      universal, in genetically confirmed AGS.
    disposition: RETAINED
    report_quote: 74 of 82 (90%) AGS patients had positive IFN scores
    rationale: >-
      PMID:24183309 measured a six-gene interferon score in 82
      mutation-confirmed patients and found 74 positive. The report preserves
      the cohort denominator and appropriately recognizes the eight negative
      results. Treat 90% as this cohort's estimate, not a universal prevalence
      constant.
    citations:
      - PMID:24183309
  - claim_id: rnaseh2-neuropathology-scope
    statement: >-
      RNASEH2-related human neuropathology is driven primarily by
      IFN-independent p53/DNA-damage signaling rather than cGAS-mediated
      neuroinflammation.
    disposition: QUALIFIED
    report_quote: >-
      **RNASEH2-related neuropathology is driven primarily by IFN-independent
      p53/DNA damage signaling**, not by cGAS-mediated neuroinflammation
    rationale: >-
      The full text of PMID:34655526 reports deletion of Rnaseh2b throughout
      mouse neural progenitors using Nestin-Cre. The study showed that p53
      deletion rescued cerebellar defects whereas cGAS deletion did not,
      despite cGAS-dependent interferon signaling. Its full-text discussion
      also notes that human AGS variants are generally hypomorphic and that
      prior hypomorphic models differ. The experiment establishes an important
      parallel mechanism in a complete neural inactivation model;
      extrapolating "primarily" to all human RNASEH2 disease is stronger than
      the evidence.
    citations:
      - PMID:34655526
  - claim_id: ifn-negative-mechanism
    statement: >-
      A substantial minority of RNASEH2B disease is driven primarily by
      non-interferon mechanisms.
    disposition: QUALIFIED
    report_quote: >-
      suggests that a substantial minority of RNASEH2B patients may have disease
      driven primarily by non-IFN mechanisms.
    rationale: >-
      PMID:24183309 found negative scores in 7 of 26 RNASEH2B participants and
      showed reasonable within-person repeat consistency. It measured a
      peripheral biomarker, not causal pathway dependence in nervous tissue.
      Genotype, age, disease phase, tissue compartment, and assay threshold can
      separate a blood score from the mechanism of established CNS injury. The
      subgroup is an important stratification lead, not proof of non-IFN
      causation.
    citations:
      - PMID:24183309
      - PMID:25604658
  - claim_id: jak-neurological-inference
    statement: >-
      Limited neurological improvement during JAK inhibition shows that
      IFN-independent pathways contribute to CNS injury across AGS subtypes.
    disposition: QUALIFIED
    report_quote: >-
      These clinical observations strongly suggest that IFN-independent pathways
      contribute to CNS injury across AGS subtypes.
    rationale: >-
      PMID:41871482 is a retrospective comparison of 12 treated and 20 untreated
      patients, with heterogeneous genotypes and outcomes. PMID:38381212 and
      PMID:39748568 are single-patient reports. None randomizes treatment,
      measures a counterfactual developmental course, or establishes CNS drug
      exposure sufficient to suppress the relevant pathway. These observations
      support a mechanistic question and the need for stratified prospective
      studies; they do not isolate IFN-independent causation across subtypes.
    citations:
      - PMID:41871482
      - PMID:38381212
      - PMID:39748568
  - claim_id: rnaseh2b-nonpenetrance-source
    statement: >-
      Adult clinical nonpenetrance for homozygous RNASEH2B p.Ala177Thr
      challenges a deterministic IFN-driven disease model.
    disposition: QUALIFIED
    report_quote: >-
      This incomplete penetrance challenges a deterministic model where loss of
      RNase H2 function inevitably produces IFN-driven disease.
    rationale: >-
      PMID:40812004 recruited patients with an AGS diagnosis; its abstract only
      mentions asymptomatic homozygotes as prior background. The primary report,
      assessor-introduced PMID:36705819, described four clinically asymptomatic
      p.Ala177Thr homozygotes aged 19 to 68 years and measured normal or minimally
      elevated blood interferon signaling in two. Nonpenetrance is therefore
      supported, but it should be cited to the primary source and should not be
      conflated with the separate 2013 IFN-negative cohort.
    citations:
      - PMID:40812004
      - PMID:36705819
  - claim_id: sting-pharmacology-scope
    statement: >-
      Pharmacological convergence across STING-targeting agents independently
      validates cGAS-STING as a therapeutic target in AGS.
    disposition: QUALIFIED
    report_quote: >-
      This pharmacological convergence provides independent, non-genetic
      validation of the cGAS-STING axis as a therapeutic target.
    rationale: >-
      PMID:30566866, PMID:38066431, PMID:39965124, PMID:38507852,
      PMID:38997793, PMID:39875322, and PMID:40319749 report pathway inhibition
      and Trex1-mouse effects. These agents include direct binders, indirect
      trafficking or signalosome interventions, and a multicomponent
      formulation, so they are not equivalent replications. PMID:40619030 tested
      Trex1-null fibroblasts but used Listeria infection, not Trex1 autoimmunity,
      for its in vivo experiment. The collection validates a preclinical target
      in the TREX1 model; it does not establish human efficacy.
    citations:
      - PMID:30566866
      - PMID:38066431
      - PMID:39965124
      - PMID:38507852
      - PMID:38997793
      - PMID:39875322
      - PMID:40319749
      - PMID:40619030
  - claim_id: samhd1-evidence-type
    statement: >-
      SAMHD1 loss causes stalled-fork cytosolic DNA accumulation that induces
      interferon signaling in an in vitro/model system.
    disposition: QUALIFIED
    report_quote: SAMHD1-KO cells accumulate cytosolic DNA from stalled forks
    rationale: >-
      PMID:32720483 summarizes the stalled-fork work and its AGS relevance.
      The primary study is assessor-introduced PMID:29670289, which used human
      cell lines to show that SAMHD1 promotes MRE11-dependent processing and
      limits RECQ1-associated cytosolic DNA and interferon induction. The
      provider's "In vitro/Model" label obscures both source type and system;
      cite the primary paper and retain the mechanism as an in vitro lead.
    citations:
      - PMID:32720483
      - PMID:29670289
  - claim_id: sting-samhd1-disease-mismatch
    statement: >-
      PMID:41929158 establishes which SAMHD1 function drives SAMHD1-deficient
      AGS.
    disposition: REJECTED
    report_quote: described STING-SAMHD1 axis.
    rationale: >-
      PMID:41929158 is a 2026 preprint about nuclear STING promoting replication
      stress through SAMHD1 in progeria and tumor cells with elevated STING.
      It does not study biallelic SAMHD1 deficiency, an AGS patient, or an AGS
      model. It may provide general pathway context, but it cannot substantiate
      the report's AGS-specific question about which SAMHD1 function drives
      disease.
    citations:
      - PMID:41929158
  - claim_id: atad3-mitochondrial-leakage
    statement: >-
      ATAD3 duplications cause mitochondrial nucleic-acid leakage that triggers
      an AGS-like interferonopathy.
    disposition: QUALIFIED
    report_quote: Mitochondrial NA leakage can trigger AGS-like IFN
    rationale: >-
      PMID:40665566 studied nine people with ATAD3 duplications. One had elevated
      CSF neopterin and another elevated CSF interferon-alpha; imaging overlapped
      AGS. The abstract explicitly calls mitochondrial nucleic-acid leakage a
      putative common mechanism. No mitochondrial nucleic-acid species, leakage,
      cGAS engagement, or perturbational rescue was measured.
    citations:
      - PMID:40665566
  - claim_id: microangiopathy-ifn-direction
    statement: >-
      AGS microangiopathy is likely downstream of chronic interferon signaling
      rather than an alternative injury mechanism.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      This is likely downstream of chronic IFN rather than an alternative
      mechanism.
    rationale: >-
      PMID:12365358 summarizes perivascular calcium and microinfarctions from a
      very small neuropathology literature and proposes microangiopathy as
      important. It does not perturb interferon signaling or establish the
      direction IFN-to-microangiopathy. The relationship is plausible but should
      remain an unresolved edge.
    citations:
      - PMID:12365358
  - claim_id: neural-progenitor-ontology
    statement: >-
      CL:0000031 identifies a generic neural progenitor cell.
    disposition: REJECTED
    report_quote: >-
      - **Cell types:** Astrocyte (CL:0000127), Classical dendritic cell
      (CL:0000990), Neural progenitor cell (CL:0000031)
    rationale: >-
      OAK resolves CL:0000031 as "neuroblast (sensu Vertebrata)." The exact
      Cell Ontology class for "neural progenitor cell" is CL:0011020. Do not
      promote the supplied mapping verbatim.
  - claim_id: dendritic-cell-ontology-label
    statement: >-
      CL:0000990 is the Cell Ontology identifier for "Classical dendritic cell."
    disposition: QUALIFIED
    report_quote: >-
      - **Cell types:** Astrocyte (CL:0000127), Classical dendritic cell
      (CL:0000990), Neural progenitor cell (CL:0000031)
    rationale: >-
      OAK resolves CL:0000990 as "conventional dendritic cell." The literature
      commonly uses "classical dendritic cell," including PMID:39254994, but a
      curated ontology lead should preserve the canonical label or explicitly
      record the synonym.
    citations:
      - PMID:39254994
  - claim_id: search-provenance
    statement: >-
      The report systematically reviewed 87 papers and confirmed 11 findings
      across two investigation iterations.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      *Report generated 2026-05-23. Based on systematic review of 87 papers with
      11 confirmed findings across 2 investigation iterations.*
    rationale: >-
      The report metadata and committed citation sidecar expose 35 PMIDs, not
      87 publications. No search strings, screening log, exclusions, source

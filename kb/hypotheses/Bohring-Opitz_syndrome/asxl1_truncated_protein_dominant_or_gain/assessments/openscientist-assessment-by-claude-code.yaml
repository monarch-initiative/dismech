      Query gnomAD v4 constraint and pLoF variants for the canonical ASXL1
      transcript, bin them by amino-acid coordinate, and summarise allele
      frequency by protein region.
    comparison: >-
      Population pLoF distribution against the last-exon window that harbours the
      recurrent clonal-haematopoiesis and myeloid-neoplasia driver alleles.
    input_data_source_ids:

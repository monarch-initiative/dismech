source_report: ../openscientist.md
hypothesis_id: asxl1_truncated_protein_dominant_or_gain
assessed_at: "2026-09-07T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The most productive of the five contested-mechanism screens run for this audit.
  The Bohring-Opitz entry records the variant mechanism as UNKNOWN because BOS
  alleles are last-exon truncations expected to escape nonsense-mediated decay,
  and whether the resulting truncated ASXL1 merely lacks full-length repressive
  function or acts dominantly is unresolved. Both competing hypotheses in the
  entry carried a single evidence item each, drawn from one patient multi-omics
  study that does not discriminate between them. This run supplied real evidence
  for each side.

  For the truncated-protein reading it supplies the two things the entry lacked.
  Truncated ASXL1 is directly detected at protein level by mass spectrometry and
  western blot in cell lines lacking intact ASXL1, and the authors read that as
  evidence the alleles are dominant-negative or gain-of-function. Separately, a
  truncated ASXL1 fragment is sufficient to reproduce neural-crest phenotypes in
  vitro and in ovo, which is a developmental context relevant to BOS rather than
  a myeloid one. Both were promoted.

  For the loss-of-function reading it supplies the counterpart: constitutive
  Asxl1 deletion in mouse produces anophthalmia, microcephaly, cleft palate and
  mandibular malformation, a spectrum overlapping BOS and generated with no
  truncated protein present. Promoted.

  Crucially this does not resolve the question, and the report is explicit that
  it does not: no accessed source demonstrates a stable endogenous truncated
  ASXL1 protein in germline BOS patient tissue, the protein evidence being
  myeloid or heterologous. Its own reading, that the two mechanisms coexist and
  converge on the PR-DUB/Polycomb axis, is the one the entry already encodes by
  leaving the category UNKNOWN. What changed is that both hypotheses are now
  properly evidenced rather than asserted.

  The report is unusually careful about its own weaknesses, flagging a preprint
  source and two snippets as normalization mismatches for curator re-checking.
  Its gnomAD analysis is real and its outputs are committed, but the bundle omits
  the MANIFEST.yaml and code directory its own README lists.

      - ../openscientist_artifacts/kb_hypotheses_Bohring-Opitz_syndrome_asxl1_truncated_protein_dominant_or_gain_openscientist_artifacts_data_gnomad_asxl1_plof_top_hotspot_variants.csv
    status_reason: >-
      The constraint CSV carries the queried values with the source, transcript
      and retrieval date recorded inline, and the execution log includes failed
      attempts rather than only successes. It is PARTIAL rather than SUCCEEDED
      because the analysis script the bundle README names was not delivered, so
      the step from the API to the tables is attested only by the provider.
    limitations: >-
      The bundle README lists a MANIFEST.yaml, a code directory holding the
      GraphQL query and the analysis script, and an env directory; none of the
      three was delivered. The report's own analysis inventory anticipates this,
      instructing the curator to verify bundle presence and paths, which is the
      right instinct and turned out to be necessary.
claims:
  - claim_id: truncated-asxl1-protein-detected
    statement: >-
      Truncated ASXL1 is expressed as a stable protein detectable by mass
      spectrometry and western blot in cells lacking intact ASXL1, which the
      source reads as evidence the alleles are dominant-negative or gain of
      function.
    disposition: RETAINED
    report_quote: >-
      the C-terminally truncated protein was directly detected by both mass
      spectrometry and Western blot, establishing that these alleles are not
      silent nulls but yield a stable protein product
    rationale: >-
      Verified against the fetched record and promoted. This is the protein-level
      evidence the entry lacked, and unlike the ASXL3 case the paralogue problem
      does not arise: this is the same gene and the same terminal-exon allele
      class. The context is myeloid rather than germline, which the report states
      plainly and which the promoted evidence item records, so it supports the
      mechanism being available to BOS alleles without showing that it operates
      in BOS tissue.
    citations:
      - PMID:26700326
  - claim_id: truncated-fragment-sufficient-neural-crest
    statement: >-
      A truncated ASXL1 fragment is sufficient to reproduce neural-crest
      phenotypes in vitro and in ovo, a developmental context relevant to
      Bohring-Opitz syndrome.
    disposition: RETAINED
    report_quote: >-
      the fragment is *sufficient* to drive a developmental defect, which is
      difficult to reconcile with pure loss-of-function
    rationale: >-
      Verified and promoted, and the most BOS-relevant piece of support the run
      produced. Sufficiency of an expressed fragment is a different and stronger
      claim than the correlational patient-cell data the hypothesis previously
      rested on. It remains an expression system rather than an endogenous
      patient allele, so it shows the fragment can drive a phenotype, not that it
      does so at endogenous levels in patients.
    citations:
      - PMID:31006630
  - claim_id: asxl1-null-mice-phenocopy-bos
    statement: >-
      Constitutive Asxl1 deletion in mouse produces anophthalmia, microcephaly,
      cleft palate and mandibular malformation, a spectrum overlapping
      Bohring-Opitz syndrome and arising with no truncated protein present.
    disposition: RETAINED
    report_quote: >-
      they show that LOF is a sufficient and independently supported route to
      BOS-like disease
    rationale: >-
      Verified and promoted to the competing loss-of-function hypothesis, which
      previously carried only a non-discriminating patient multi-omics item. This
      is the mouse counterpart of the whole-gene deletion case that the parallel
      Weaver run supplied, and it plays the same role: it shows the null route
      reaches a BOS-like phenotype without a poison protein, so the presence of a
      truncated protein does not by itself establish that the truncated protein
      is what causes the disease.
    citations:
      - PMID:24218140
      - PMID:24255920
  - claim_id: asxl1-not-lof-constrained
    statement: >-
      ASXL1 is not classically loss-of-function constrained in population data,
      and its pLoF burden concentrates in the last-exon window that harbours the
      somatic clonal-haematopoiesis drivers.
    disposition: QUALIFIED
    report_quote: >-
      a signature of somatic clonal fitness (gain of function) rather than
      tolerated germline nulls
    rationale: >-
      The constraint values are committed and the observation is real. The
      inference is not compelled. The report concedes in its own limitations that
      gnomAD is blood-derived and cannot separate germline nulls from age-related
      clonal haematopoiesis, which is precisely what would have to be separated
      for this argument to run. Qualified also because the analysis behind it is
      only partially auditable. Not promoted.
    analysis_ids:
      - asxl1-gnomad-constraint-positional
  - claim_id: no-endogenous-bos-protein-evidence
    statement: >-
      No accessed source demonstrates a stable endogenous truncated ASXL1 protein
      in germline Bohring-Opitz patient tissue.
    disposition: RETAINED
    report_quote: >-
      no accessed source directly demonstrates a stable endogenous truncated
      ASXL1 protein in germline BOS patient tissue
    rationale: >-
      The report's own most important caveat, stated without prompting, and it
      matches the protein-detection precondition this repository already recorded
      as the first step of the discriminating experiment. An independent search
      arriving at the same missing step is a useful check on the curation even
      though it adds no evidence.
  - claim_id: coexistence-reading
    statement: >-
      Dominant/gain-of-function and loss-of-function mechanisms coexist and
      converge on the PR-DUB and Polycomb chromatin axis, so the truncated-protein
      hypothesis is a partially confirmed contributor rather than the sole
      mechanism.
    disposition: RETAINED
    report_quote: >-
      the seed hypothesis is best treated as a partially confirmed contributor
      rather than the sole disease mechanism
    rationale: >-
      Well supported by the evidence the run assembled for both sides, and it is
      the same conclusion the entry encodes by holding the category at UNKNOWN
      with two live hypotheses. Recorded rather than promoted as a category
      change: convergence on a shared downstream axis is not a finding about what
      the variant does to the gene product, which is what the slot records.
  - claim_id: bundle-manifest-and-code
    statement: >-
      The bundle contains a MANIFEST.yaml with checksums and replay notes, the
      gnomAD query, and the analysis script.
    disposition: REJECTED
    report_quote: >-
      Artifact bundle (MANIFEST + checksums + code/queries/logs + evidence matrix)
    rationale: >-
      None of the three is in the delivered bundle. The data tables and logs are
      present and inspectable, so the analysis is recorded as PARTIAL rather than
      REPORTED_ONLY, but the analysis-run gate cannot be applied. This is the
      same omission seen in every other run in this series, so it reads as a
      provider bundling defect rather than a one-off.

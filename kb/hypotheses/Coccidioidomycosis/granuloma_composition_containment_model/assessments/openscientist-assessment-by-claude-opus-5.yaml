overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's headline reading is right and matches the curated status: the
  chain is supported at both ends (an anti-phagocytic spherule; a Th1/Th17/TNF
  requirement; a containment-versus-cavitation dichotomy) and unmeasured in the
  middle, where the epithelioid and giant-cell steps are transferred from
  tuberculosis rather than observed in Coccidioides tissue. EMERGING is the
  correct status and no change was made.

  Its real contribution is primary literature the entry did not have. Four
  papers were verified against the reference cache and promoted: Drutz and
  Huppert 1983 (PMID:6300253) for the antiphagocytic wall and the 20-30% PMN
  killing figure, which until now rested only on a 2020 review; Gonzalez 2011
  (PMID:21129481) for a secreted fungal factor that suppresses macrophage
  NO and iNOS, the one direct Coccidioides measurement bearing on the granuloma
  interior the seed hypothesis names as unresolved; Shubitz 2008
  (PMID:18852250) for the mouse-strain histopathology that is the strongest
  direct support for organized granuloma equals containment; and Odio 2017
  (PMID:28098554) for the human case series behind the STAT3 association, whose
  KB entry previously carried only mouse evidence.

  Three of its consequential statements do not survive source review. The
  claim that etiology-matched transcriptomics show granuloma programs differing
  by cause rests on a truncated quotation: the sentence in PMID:33276795 ends
  "in sarcoidosis granulomas from lymph nodes and lung", so it compares tissue
  sites within sarcoidosis, not etiologies. The negative search behind knowledge
  gap G6 is wrong - the abstracts of PMID:39611685 and PMID:40704794 are not
  truncated and both report cell-identity conclusions (Spp1-expressing
  monocyte-derived macrophages, PD-L1-positive neutrophils, defective lymphocyte
  responses) that speak directly to the cell-identity component the report says
  is unretrievable. And its candidate ontology term for the epithelioid
  macrophage, CL:0000878, is central nervous system macrophage; the entry
  already uses the correct CL:0002150.

  Provenance is thin. The frontmatter declares two artifacts under
  openscientist_artifacts/ but no such directory is committed, so nothing in
  the run is inspectable. The two GEO accessions are cited, never opened - the
  report says so itself.

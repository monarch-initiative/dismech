claims:
  - claim_id: verdict-partially-supported-bookended-not-bridged
    statement: >-
      The seed chain is supported at both ends - an anti-phagocytic spherule and
      a Th1/Th17/TNF requirement upstream, a containment-versus-cavitation
      dichotomy downstream - while the Coccidioides-specific intermediate steps
      are unmeasured, so the hypothesis is partially supported and should stay
      EMERGING.
    disposition: RETAINED
    report_quote: 'Verdict: PARTIALLY SUPPORTED (bookended, not bridged).'
    rationale: >-
      This matches the curated position and the primary sources I checked. The
      entry's hypothesis description already states the same thing, and the two
      module-conforming edges already carry qualifying explanations saying the
      intermediate step is unresolved. Status left at EMERGING.
    citations:
      - PMID:33262956
      - PMID:37367586
  - claim_id: spherule-antiphagocytic-premise
    statement: >-
      Coccidioides is genuinely resistant to phagocytic clearance: arthroconidia
      carry an antiphagocytic outer wall, only a minority of ingested organisms
      are killed by neutrophils, and the tissue-phase spherule exceeds phagocytic
      capacity.
    disposition: RETAINED
    report_quote: '*Coccidioides* is genuinely anti-phagocytic and resistant to killing (arthroconidial antiphagocytic wall; only 20–30% of ingested organisms killed by PMNs; 30–80 µm spherules exceed phagocytic capacity; spherules actively suppress macrophage NO/iNOS) (PMID 6300253, 21129481).'
    rationale: >-
      Verified against the cached abstract of PMID:6300253, which states the
      antiphagocytic surface and the 20-30% killing figure in those words. The
      entry asserted spherule phagocytosis resistance on the strength of a 2020
      review only, so this is a genuine upgrade in evidence grade and was
      promoted to the Phagocytosis-resistant spherule persistence node. The
      report's size figure differs from the entry's (30-80 versus 20-200
      micrometres) because the sources differ; no size claim was changed.
    citations:
      - PMID:6300253
      - PMID:33262956
  - claim_id: spherules-suppress-macrophage-nitric-oxide
    statement: >-
      Live parasitic-phase Coccidioides cells release a soluble factor that
      suppresses nitric oxide production and iNOS transcription in activated
      macrophages, without phagocytosis being required.
    disposition: QUALIFIED
    report_quote: 'Spherule initials secrete a soluble factor suppressing NO/iNOS in IFN-γ/LPS-activated macrophages; NO not essential for killing'
    rationale: >-
      The suppression itself is verified in the cached abstract of PMID:21129481.
      The qualification is one the report states in its matrix but drops from its
      Executive Judgment, where the same paper becomes the flat assertion that
      "spherules actively suppress macrophage NO/iNOS" as part of the
      anti-phagocytic premise: the same paper found iNOS-deficient macrophages
      kill Coccidioides as well as wild-type ones, so the functional consequence
      of the suppression for containment is unestablished. Promoted with that
      caveat carried in the explanation rather than dropped.
    citations:
      - PMID:21129481
  - claim_id: th1-axis-human-genetic-requirement
    statement: >-
      Human loss-of-function evidence pins containment on the IL-12/IFN-gamma
      and STAT3 axes, identified in a case series of eight patients with
      disseminated coccidioidomycosis.
    disposition: RETAINED
    report_quote: '8 disseminated cases had IL-12/IFN-γ and STAT3 defects'
    rationale: >-
      Verified: PMID:28098554 states it in exactly that form. The entry's STAT3
      genetic record asserted the association but cited only a mouse vaccine
      paper, so this human case series was promoted there. Its companion claim
      about STAT4 (PMID:35149520) is already curated.
    citations:
      - PMID:28098554
      - PMID:35149520
  - claim_id: genetic-evidence-confined-to-disseminated-subtype
    statement: >-
      The human genetic support for the Th1 arm comes from disseminated cases and
      should not be generalized to the common contained infection.
    disposition: RETAINED
    report_quote: 'human genetic support is specific to the **disseminated** subtype (IL-12/IFN-γ/STAT3/STAT4); do not generalize the Th1-defect evidence to common contained infection.'
    rationale: >-
      Correct, and already curated. The STAT4, STAT3, and IL12RB1 records each
      carry an explicit "Subtype scope" note making this restriction, and the
      IL12RB1 note adds that Mendelian defects of this axis explain only a small
      minority of disseminated disease. No change needed.
    citations:
      - PMID:28098554
  - claim_id: organized-granuloma-tracks-containment-in-mouse-strains
    statement: >-
      Across mouse strains of differing susceptibility, well-formed granulomas
      with a macrophage and lymphocyte mantle and few fungal elements accompany
      containment, while overwhelming neutrophils, abundant spherules, and a
      collapse of T cells accompany fatal progression.
    disposition: RETAINED
    report_quote: 'Resistant SW: well-formed granulomas, macrophage/lymphocyte mantle, few fungi; susceptible B6: neutrophils + spherules, few T cells, death'
    rationale: >-
      Verified sentence by sentence against the cached abstract of PMID:18852250.
      This is the strongest direct evidence in the report for the entry's
      Granuloma formation and containment node, whose description asserts exactly
      this correlation but previously cited only reviews and a pleural case
      series. Both arms were promoted as separate evidence items. The
      correlational limit the report records - no architecture was perturbed - is
      real and is carried into the explanations.
    citations:
      - PMID:18852250
  - claim_id: canine-granuloma-t-cell-predominance
    statement: >-
      Coccidioidal granulomas are T-cell predominant, with T cells concentrated
      at the granuloma periphery independent of tissue and organism burden.
    disposition: QUALIFIED
    report_quote: 'T > B lymphocytes; T cells concentrated at granuloma periphery, independent of tissue/burden'
    rationale: >-
      The finding is verified in PMID:20930107, but it is a dog finding and the
      report presents it without the species caveat the source itself insists on.
      That paper reports that human coccidioidal pulmonary granulomas had roughly
      equivalent numbers of T and B lymphocytes, and calls its own canine result
      "unexpected and distinct from the lymphocytic populations in human or mouse
      lesions". Promoted as MODEL_ORGANISM evidence with the divergence stated in
      the explanation, rather than as a general statement about coccidioidal
      granuloma composition.
    citations:
      - PMID:20930107
  - claim_id: intermediate-edges-borrowed-from-tuberculosis
    statement: >-
      The Th1/Th17-to-epithelioid and epithelioid-to-organized-granuloma steps
      are transferred from tuberculosis and other granuloma models and have not
      been measured in Coccidioides tissue.
    disposition: RETAINED
    report_quote: 'borrowed from tuberculosis and other granulomas, not directly measured in Coccidioides.'
    rationale: >-
      The two analogy papers the report leans on are non-Coccidioides, as it
      says: PMID:9306503 is hypersensitivity pneumonitis and PMID:7977642 is a
      PPD-bead granuloma model in which TNF depletion reduced granuloma area by
      40% rather than abolishing it. Neither was promoted, since a
      Coccidioidomycosis entry should not carry bead-granuloma evidence for its
      own edges. The gap is real and was recorded instead as a KNOWLEDGE_GAP
      discussion attached to the two edges it bears on.
    citations:
      - PMID:9306503
      - PMID:7977642
      - PMID:37367586
  - claim_id: tnf-required-to-maintain-containment
    statement: >-
      TNF is required to maintain containment, evidenced by a patient who
      developed disseminated disease on infliximab and improved on withdrawal.
    disposition: QUALIFIED
    report_quote: 'Anti-TNF (infliximab) → disseminated disease; improved on withdrawal'
    rationale: >-
      The case is real, but the sentence the report offers as the supporting
      snippet - that TNF-alpha inhibitors raise the risk of disseminated
      coccidioidomycosis - is background prose in the case report's BACKGROUND
      section, not a finding of the case. Nothing in PMID:33933122 bears on
      whether TNF acts through giant-cell or epithelioid maintenance, which is
      the edge the report labels it against. Not promoted: the entry already
      carries the same exposure with cohort-validated evidence (PMID:38667927),
      which is strictly stronger than a single case, and the report's own gap G7
      concedes the mechanism is unknown.
    citations:
      - PMID:33933122
      - PMID:38667927
  - claim_id: etiology-matched-transcriptomics-refute-tb-analogy
    statement: >-
      Granuloma molecular programs differ markedly by cause despite identical
      histology, undercutting extrapolation from tuberculosis to
      coccidioidomycosis.
    disposition: REJECTED
    report_quote: 'etiology-matched transcriptomics show granuloma molecular programs **differ markedly by cause despite identical histology** (PMID 33276795)'
    rationale: >-
      The quotation is truncated in a way that reverses what it compares. The
      sentence in PMID:33276795 reads "Despite histologic similarities, DEGs and
      pathway enrichment markedly differed in sarcoidosis granulomas from lymph
      nodes and lung" - a comparison of tissue sites within sarcoidosis, not
      across etiologies. The study is sarcoidosis-centred with three
      coccidioidomycosis subjects, reports commonalities as well as divergences,
      and makes no direct coccidioidomycosis-versus-tuberculosis comparison. The
      entry already cites this paper with those bounds recorded explicitly, so no
      change was made and the report's stronger reading was not adopted.
    citations:
      - PMID:33276795
  - claim_id: matched-omics-datasets-not-edge-resolving
    statement: >-
      The single-cell and spatial datasets matched to this disease have no
      edge-resolving analysis in the indexed literature, because the abstracts of
      the dataset papers are truncated and their conclusions could not be
      extracted.
    disposition: REJECTED
    report_quote: 'Searched cocci scRNA-seq/spatial; found dataset papers (PMID 39611685, 40704794) but abstracts truncated; edge-level conclusions not retrievable here'
    rationale: >-
      The premise is false. Both abstracts fetch complete, and both carry
      cell-identity conclusions of exactly the kind the report says are
      unretrievable: PMID:39611685, the publication behind GSE274766 and
      GSE274767, reports monocyte-derived Spp1-expressing macrophages as
      mediators of remodeling and fibrosis with elevated TGF-beta and IL-6
      signalling, alongside neutrophil infiltration and defective lymphocyte
      responses; PMID:40704794 reports PD-L1-positive neutrophils and
      fungal-contact-dependent Spp1-expressing macrophages at 24 hours. Because
      this false negative suppressed the report's most disease-specific
      cell-identity finding, both papers were verified and promoted - the first
      to the hypothesis, which had cited it only as a dataset publication.
    citations:
      - PMID:39611685
      - PMID:40704794
  - claim_id: neutrophil-inflammasome-competing-axis
    statement: >-
      A neutrophil and inflammasome axis competes with the macrophage-centric
      model, since CXCR2-deficient mice are more resistant and caspase-1-deficient
      mice more tolerant at equal fungal burden.
    disposition: RETAINED
    report_quote: 'A competing/parallel axis is underweighted.** Neutrophils and inflammasome-driven regulated cell death shape outcome independent of the macrophage program'
    rationale: >-
      Correct, and already fully curated: the entry carries this as a separate
      ALTERNATIVE hypothesis group, a dedicated Spherule rupture-triggered
      inflammasome activation and neutrophil recruitment node with both
      loss-of-function results, and an edge to cavitary disease. Nothing to add.
    citations:
      - PMID:33106296
      - PMID:42386736
  - claim_id: treg-and-b-cell-maintenance-nodes-missing
    statement: >-
      Regulatory T cells and B-cell or ectopic-lymphoid structures govern the
      contained-versus-injurious granuloma outcome and should be added as
      pathophysiology nodes with comparator-derived support.
    disposition: QUALIFIED
    report_quote: 'Node: *Regulatory T cell* (CL:0000815) as granuloma-maintenance modulator; Edge: `Treg balance → contained vs injurious granuloma` (comparator-derived; PMID 24912188).'
    rationale: >-
      The comparator evidence checks out - PMID:24912188 shows Treg depletion
      exacerbates lung inflammation and enhances granuloma formation, and
      PMID:31094704 shows B-cell depletion causes loss of lymphoid aggregates and
      granulomas with increased lung injury - but both are HLA-DP2 transgenic
      beryllium models, and the report concedes it located no Coccidioides
      counterpart. Adding pathophysiology nodes to a Coccidioidomycosis entry on
      chronic beryllium disease evidence alone would assert a mechanism nobody has
      measured in this infection. Recorded as a KNOWLEDGE_GAP discussion carrying
      the comparator citations instead of as nodes.
    citations:
      - PMID:24912188
      - PMID:31094704
  - claim_id: candidate-ontology-terms
    statement: >-
      Suggested cell-type CURIEs for the epithelioid macrophage and
      multinucleated giant cell compartments of the coccidioidal granuloma.
    disposition: REJECTED
    report_quote: 'epithelioid macrophage (CL:0000878 activated macrophage / epithelioid), multinucleated giant cell (CL:0000647 osteoclast-like / foreign-body giant cell)'
    rationale: >-
      CL:0000878 is central nervous system macrophage, not any kind of
      epithelioid or activated macrophage; the label offered alongside it is
      invented. The entry already binds the correct term, CL:0002150 epithelioid
      macrophage. CL:0000647 is right but is labelled multinucleated giant cell,
      not the osteoclast-like or foreign-body gloss given, and is already bound on
      the same node. GO:0070269 is labelled pyroptotic inflammatory response
      rather than pyroptosis. No binding was taken from this list.
    citations: []
  - claim_id: retain-emerging-status
    statement: >-
      The hypothesis should retain EMERGING status rather than being promoted to
      CANONICAL until the intermediate edges are measured in Coccidioides.
    disposition: RETAINED
    report_quote: '**Retain EMERGING.** The two flagged edges remain PARTIAL; promotion to CANONICAL is not justified until G1/G2 are measured in *Coccidioides*.'
    rationale: >-
      Agreed and no change made. The entry already records status EMERGING with a
      description that gives this same reason. A candidate status change reading
      "retain, no change warranted" is not an integration lead.
    citations:
      - PMID:33262956
      - PMID:37367586

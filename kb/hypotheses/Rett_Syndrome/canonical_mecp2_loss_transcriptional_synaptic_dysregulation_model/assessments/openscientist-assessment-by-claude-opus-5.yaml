hypothesis_id: canonical_mecp2_loss_transcriptional_synaptic_dysregulation_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: SUPPORTED
summary: >-
  I fetched and read 25 of the report's 55 cited papers into references_cache/
  and compared every quotation the report acts on against the cached source.
  Every identifier resolved to a real paper on the stated topic, including the
  five high-numbered 2026 identifiers (PMID:41182667, PMID:41296873,
  PMID:41455590, PMID:41975033, PMID:42159339) that looked like plausible
  fabrication targets. Every quoted sentence I checked was verbatim. That is
  unusual for this provider and worth recording: the failure mode this sweep
  normally finds is absent here.

  The central thesis is the KB seed, so its "support" is largely re-derivation
  and earns no new credit. The report's value is in what it adds around the
  seed, and four of those additions were genuinely missing from the curated
  entry. First, direct human in vivo evidence for the excitation/inhibition
  shift the hypothesis description asserts: paired-pulse TMS in 14 RTT patients
  (PMID:32129908). The entry asserted E/I imbalance in prose while carrying no
  E/I node and no human evidence for it. Second, the adult-reactivation
  reversibility result (PMID:24009314), named in the hypothesis description but
  never cited. Third, non-cell-autonomous glial contributions - microglial
  glutamate release damaging dendrites (PMID:20392956) and oligodendrocyte
  restoration rescuing motor phenotypes (PMID:24285883) - which the entry's
  strictly neuron-intrinsic pathograph had no room for. Fourth, the mechanistic
  substrate for the respiratory node: reduced GABAergic innervation of the
  Koelliker-Fuse nucleus, with bidirectional pharmacological confirmation in
  mouse and rat (PMID:26507912).

  The report's own framing overstates three things. It calls PMID:30929312 a
  large-scale study; it is a narrative review. It reports both LAVENDER
  communication endpoints as statistically significant when the source calls the
  RTT-COMC result nominally significant, and attributes the trial's finding to a
  secondary endpoint paper rather than the primary report already curated here.
  And its bidirectional-dosage citation compared 11 MECP2-duplication
  individuals with 6 male RTT-like individuals, not with classic female RTT.

  Several of the report's proposed curation snippets are unusable as written -
  the one it offers for the Super Elongation Complex finding is a truncated
  title fragment ending in an open parenthesis. I re-derived every snippet from
  the cached abstracts rather than copying the report's.

  No artifact bundle is committed. The report embeds four figure placeholders
  and reports iteration and paper counts that nothing in the repository can
  check.

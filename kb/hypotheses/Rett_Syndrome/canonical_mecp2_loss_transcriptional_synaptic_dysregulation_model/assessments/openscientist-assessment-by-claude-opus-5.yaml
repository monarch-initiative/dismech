    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Autonomous multi-iteration literature retrieval and synthesis, reported as
      five iterations over 136 publications yielding 21 confirmed findings, an
      evidence matrix, a causal-chain diagram, and eight knowledge gaps.
    status_reason: >-
      No committed code, query log, intermediate output, or environment record

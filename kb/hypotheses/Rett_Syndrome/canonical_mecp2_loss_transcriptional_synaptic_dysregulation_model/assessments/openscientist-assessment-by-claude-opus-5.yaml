    limitations: >-
      The report itself notes preprints, conference abstracts, non-English
      literature, and unpublished trial data were likely missed, and that recent
      2020-2026 publications were more heavily sampled than foundational
      2000-2010 work. Beyond that, the template asked explicitly for source-level
      absences such as "no relevant GenCC, ClinGen, trial, omics, or cohort
      evidence found as of the search date", and the report checked none of them:
      every one of its eight knowledge gaps is literature-derived, and no
      negative search against a structured resource is recorded anywhere in the
      run.

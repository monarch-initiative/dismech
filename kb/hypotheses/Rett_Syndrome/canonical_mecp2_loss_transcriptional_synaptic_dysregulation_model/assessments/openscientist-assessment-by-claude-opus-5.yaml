claims:
  - claim_id: canonical-model-supported-with-qualifications
    statement: >-
      The MECP2-loss transcriptional and synaptic dysregulation model is
      supported, but its CANONICAL framing needs annotating with mechanistic
      expansions rather than being left as stated.
    disposition: RETAINED
    report_quote: "**Verdict: SUPPORTED — with major qualifications requiring annotation of CANONICAL status.**"
    rationale: >-
      Concordant with the curated status, which is already CANONICAL and already
      carries a notes block recording the five qualifications. Most of the
      report's supporting material is re-derivation of its own seed and earns no
      new credit on that account; the verdict is retained because the
      qualifications it attaches are individually verifiable, not because the
      central chain was re-confirmed. No status change made.
    citations:
      - PMID:10508514
      - PMID:24009314
      - PMID:37291210
  - claim_id: mecp2-detection-rate-attributed-to-large-scale-studies
    statement: >-
      MECP2 mutations account for approximately 95 percent of typical and 73.2
      percent of atypical Rett syndrome.
    disposition: QUALIFIED
    report_quote: "Large-scale studies have since established that *MECP2* mutations account for ~95% of typical RTT and 73.2% of atypical RTT"
    rationale: >-
      The figures are real and appear verbatim in the RESULTS summary of
      PMID:30929312, but that paper is a narrative review of epilepsy and
      genetics in Rett syndrome, carrying the Review publication type, not a
      large-scale study. The report's evidence matrix compounds this by grading
      the row "Human clinical". If cited in the KB the item must be graded OTHER
      as review-level synthesis. Not promoted, because the entry already carries
      the causal MECP2 claim from the primary discovery paper and from ClinGen.
    citations:
      - PMID:30929312
  - claim_id: adult-mecp2-reactivation-reverses-established-deficits
    statement: >-
      Delayed reactivation of Mecp2 in adult Mecp2-deficient mice of both sexes
      rescues established motor, anxiety, epileptiform, EEG, and thermoregulatory
      deficits.
    disposition: RETAINED
    report_quote: "the delayed reactivation of Mecp2 in both male and female Mecp2-deficient mice rescues established deficits in motor and anxiety-like behavior, epileptiform activity, cortical and hippocampal electroencephalogram patterning and thermoregulation"
    rationale: >-
      Verified verbatim against the cached abstract of PMID:24009314. This
      reversibility result is named in the curated hypothesis description as one
      of the three pillars of the model, yet the entry cited nothing for it.
      Promoted to the mechanistic_hypotheses evidence block as MODEL_ORGANISM.
    citations:
      - PMID:24009314
  - claim_id: mecp2-global-chromatin-dampener-not-gene-specific-repressor
    statement: >-
      MeCP2 is present in neuronal nuclei at near histone-octamer abundance and
      may dampen transcriptional noise genome-wide rather than acting as a
      gene-specific repressor.
    disposition: RETAINED
    report_quote: "may not act as a gene-specific transcriptional repressor in neurons, but might instead dampen transcriptional noise genome-wide in a DNA methylation-dependent manner"
    rationale: >-
      Verified verbatim. This is the report's single most consequential
      qualification, because the curated hypothesis description calls MeCP2
      "predominantly repressor of long, methylated genes". The two statements
      pull in opposite directions on the gene-specific-repressor element while
      agreeing on the chromatin-modifier element, so I recorded it as a REFUTE
      item on the hypothesis rather than softening it into support, and
      separately as a SUPPORT item on the epigenetic-regulation node quoting the
      global chromatin-change result.
    citations:
      - PMID:20188665
  - claim_id: mch-binding-explains-delayed-postnatal-onset
    statement: >-
      MeCP2 binds non-CG methylation that accumulates in neurons after birth, and
      genes acquiring that methylation are preferentially misregulated when MeCP2
      is lost, giving a molecular account of the 6-18 month onset delay.
    disposition: RETAINED
    report_quote: "genes that acquire elevated mCH after birth become preferentially misregulated in mouse models of MeCP2 disorders"
    rationale: >-
      Verified verbatim against PMID:25870282. This supplies the postnatal-timing
      mechanism the curated hypothesis asserts without evidence, and is the
      cleanest new support the report offers for a seed claim. Promoted as
      MODEL_ORGANISM evidence on the hypothesis. The mouse-to-human caveat the
      report raises separately as Gap 6 is real and is recorded in the
      integration rather than asserted away.
    citations:
      - PMID:25870282
  - claim_id: human-tms-excitation-inhibition-imbalance
    statement: >-
      Rett syndrome patients show a measurable in vivo shift toward cortical
      excitation and abolished LTP-like plasticity in primary motor cortex, with
      the plasticity deficit scaling with motor disability.
    disposition: RETAINED
    report_quote: "a significant increase of the excitation index (p = 0.003), as demonstrated by the reduction of short-interval intracortical inhibition and increase of intracortical facilitation, suggesting a shift toward cortical excitation likely due to GABAergic dysfunction"
    rationale: >-
      Verified verbatim against PMID:32129908, a paired-pulse TMS study in 14
      typical RTT patients against 9 epilepsy and 11 healthy controls. The
      curated entry asserted excitatory/inhibitory imbalance in the hypothesis
      prose but had no pathophysiology node for it and no human evidence at all.
      This is the report's most valuable single contribution to the pathograph;
      a new Cortical Excitation/Inhibition Imbalance node was added and grounded
      on it. Note the paper's own hedge - "likely due to GABAergic dysfunction" -
      is preserved in the curated description rather than upgraded.
    citations:
      - PMID:32129908
  - claim_id: non-cell-autonomous-glial-contribution
    statement: >-
      Rett pathogenesis is not neuron-intrinsic: Mecp2-null microglia release
      fivefold more glutamate and damage dendrites and postsynaptic components,
      and restoring MeCP2 in oligodendrocyte lineage cells alone improves
      locomotor and clasping phenotypes in otherwise null mice.
    disposition: RETAINED
    report_quote: "Mecp2-null microglia release 5-fold higher glutamate levels causing dendritic damage via excitotoxicity"
    rationale: >-
      Both legs verified. PMID:20392956 states the fivefold figure and
      establishes causality through four independent blocking experiments;
      PMID:24285883 reports the oligodendrocyte restoration result and is careful
      that lifespan was only mildly prolonged. The curated pathograph was
      strictly neuron-intrinsic, so a Non-Cell-Autonomous Glial Injury node was
      added feeding the existing synapse and spine node. The report's third leg,
      catecholaminergic rescue (PMID:23077217), was not fetched and is not
      promoted.
    citations:
      - PMID:20392956
      - PMID:24285883
  - claim_id: kolliker-fuse-gabaergic-deficit-drives-apnea
    statement: >-
      Reduced GABAergic innervation of the Koelliker-Fuse nucleus underlies
      respiratory dysrhythmia in Rett syndrome, demonstrated bidirectionally by
      boosting GABA in mutant mice and blocking it in healthy rats.
    disposition: RETAINED
    report_quote: "GABAergic terminal projections are markedly reduced in the Kölliker-Fuse nucleus; augmenting GABA in this region reduced apnea in Rett mice, while blocking GABA in healthy rats recapitulated the respiratory disorder"
    rationale: >-
      Verified against PMID:26507912, which reports all three legs - deficient
      GABA perisomatic puncta in KF, reduced breathing irregularity after
      blocking GABA reuptake there, and recapitulation of the phenotype by
      blocking GABA-A receptors in healthy rats. The curated Brainstem
      Respiratory Circuit Dysregulation node cited only a review naming
      ventrolateral medulla and pons; this supplies a specific site, a specific
      transmitter deficit, and a bidirectional perturbation. Promoted as
      MODEL_ORGANISM evidence on that node.
    citations:
      - PMID:26507912
  - claim_id: phase-separation-contested-mouse-model-atypical
    statement: >-
      Whether MeCP2 organizes chromatin by liquid-liquid phase separation is
      unresolved, and the mouse cellular models that generated the supporting
      observations are atypical among mammals because MeCP2 distribution is
      diffuse in most species including humans.
    disposition: RETAINED
    report_quote: "Crucially, the mouse chromocenter organization is atypical among mammals, and MeCP2 distribution is diffuse in most species including humans."
    rationale: >-
      Both sides verified. PMID:32111972 reports MeCP2-driven phase separation of
      nucleosomal arrays in vitro with RTT mutations compromising it;
      PMID:38719804 reports that MeCP2 foci persist when heterochromatin is
      disrupted, fail to show phase-separation hallmarks in live cells, and are
      absent in Mus spretus. The species-atypicality point makes this a
      translational-validity question and not merely a disagreement, so it was
      curated as a HUMAN_MODEL_MISMATCH discussion rather than a CONTROVERSY.
    citations:
      - PMID:32111972
      - PMID:38719804
  - claim_id: prenatal-neurogenesis-disruption-precedes-postnatal-regression
    statement: >-
      MECP2 mutation disrupts chromatin state and neurogenesis prenatally, so
      Rett syndrome is not purely a disorder of postnatal synaptic maturation.
    disposition: QUALIFIED
    report_quote: "This challenges the traditional view that RTT is purely a disorder of postnatal synaptic maturation and suggests that MeCP2 has prenatal roles in chromatin organization during neurogenesis."
    rationale: >-
      The underlying result is real and quoted verbatim from PMID:41182667, a
      hiPSC cerebral-organoid multi-omics study. But it rests on a single
      human-specific point mutation (T203M) in one in vitro system, organoids are
      a fetal-stage proxy rather than a fetal observation, and nothing here
      establishes temporal precedence in human patients. The report's own Gap 2
      concedes this. Curated as a KNOWLEDGE_GAP discussion with the organoid
      evidence attached, not as a pathophysiology node.
    citations:
      - PMID:41182667
  - claim_id: multisystem-tissue-autonomous-pathology
    statement: >-
      Rett pathology includes tissue-autonomous peripheral disease - hepatic
      lipid dysregulation through the MeCP2-NCoR1/HDAC3 axis, and constitutive
      innate-immune activation in patient blood cells - that is not secondary to
      brain pathology.
    disposition: RETAINED
    report_quote: "Liver-specific MeCP2 deficiency causes fatty liver and dyslipidemia independent of neuronal pathology"
    rationale: >-
      Verified. PMID:27288453 reports liver-targeted Mecp2 deletion causing fatty
      liver and dyslipidemia, which is a genuine tissue-autonomy design, and
      PMID:35085773 reports constitutive TLR4-IRAK1-NF-kB activation and NLRP3
      inflammasome assembly in patient PBMCs from the earliest disease stages -
      human evidence, correlated with mutation severity. The curated entry is
      wholly brain-centric and carries no peripheral phenotype to attach these
      to, so this was recorded as a KNOWLEDGE_GAP discussion naming the missing
      layer rather than as a dangling pathophysiology node.
    citations:
      - PMID:27288453
      - PMID:35085773
  - claim_id: mecp2-splicing-and-super-elongation-complex
    statement: >-
      MeCP2's functional repertoire extends beyond methylation-dependent
      repression to mRNA alternative splicing and to transcription elongation via
      the Super Elongation Complex.
    disposition: RETAINED
    report_quote: "This adds a previously unrecognized transcription elongation regulatory function to MeCP2's repertoire, beyond its established roles as methylation-dependent repressor and chromatin modifier."
    rationale: >-
      Both verified. PMID:28211484 reports by mass spectrometry across rat brain,
      mouse neurons, and human cell lines that most MeCP2-associated proteins are
      splicing factors, and that Mecp2 knockdown alters splicing widely in genes
      enriched for synaptic function. PMID:41296873 reports that MeCP2 binds AFF4
      through its transcriptional repression domain and facilitates AFF4 loading
      on synaptic-plasticity genes. Both promoted onto the epigenetic-regulation
      node. Two caveats about how the report presents this. Its own proposed
      snippet - "Loss-of-function mutations in methyl-CpG binding protein 2 (..."
      - is a truncated title fragment that states no finding and could not be
      used, so the snippets I curated were re-derived from the cached abstracts.
      And the two identifiers it offers, PMID:39005382 and PMID:41296873, are the
      bioRxiv preprint and the peer-reviewed version of one study, presented as
      "Sonn et al. (2024/2025)" as though they were two results; only the
      published version is cited in the entry.
    citations:
      - PMID:28211484
      - PMID:41296873
      - PMID:39005382
  - claim_id: lavender-both-communication-endpoints-significant
    statement: >-
      The phase 3 LAVENDER trial showed statistically significant trofinetide
      benefit on both the CSBS-DP-IT Social Composite score and the RTT-COMC.
    disposition: QUALIFIED
    report_quote: "The Phase 3 LAVENDER trial demonstrated statistically significant improvement of trofinetide over placebo on the CSBS-DP-IT Social Composite score (LSM difference = 1.0; 95% CI 0.3–1.7; P = 0.0064; Cohen's d = 0.43) and the RTT-COMC (LSM difference = −0.3; P = 0.0257; d = 0.36)"
    rationale: >-
      Every number checks out against PMID:38232652, but that paper describes the
      RTT-COMC difference as nominally significant, not statistically
      significant, and it is a secondary communication-endpoint analysis rather
      than the trial's primary report. The primary report, PMID:37291210, is
      already curated on the trofinetide treatment entry with its coprimary
      endpoint result. Not promoted: adding a secondary-endpoint paper would
      restate curated content while importing the report's grading error.
    citations:
      - PMID:38232652
      - PMID:37291210
  - claim_id: bidirectional-dosage-sensitivity-mds-versus-rtt
    statement: >-
      MECP2 is bidirectionally dosage sensitive, and duplication syndrome
      produces distinct but overlapping features with Rett, creating a narrow
      therapeutic window for gene replacement.
    disposition: QUALIFIED
    report_quote: "MECP2 duplication syndrome (MDS) produces distinct but overlapping clinical features with RTT ([PMID: 39838601](https://pubmed.ncbi.nlm.nih.gov/39838601/))"
    rationale: >-
      The dosage-sensitivity principle is not in doubt, and the cached abstract
      of PMID:39838601 does state the conversion risk. But the study enrolled 11
      MDS individuals against 6 male RTT-like individuals, so its comparison is
      with male RTT-like disease, not with classic female Rett syndrome; the
      conversion-risk sentence is the paper's stated rationale for seeking
      biomarkers rather than one of its results. Not promoted as evidence. The
      narrow-therapeutic-window point already sits in the curated hypothesis
      notes, and the entry already carries three AAV-MECP2 trials whose dosage
      control is the practical expression of it.
    citations:
      - PMID:39838601

hypothesis_id: ibogaine_alpha3beta4_habenular_model
assessed_at: "2026-08-28T05:05:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The strongest of the three reports on this hypothesis set, and its central
  move is right: the receptor and site premises are solid, the transfer to
  ibogaine is not, and the model is most accurately labelled a model of 18-MC's
  anti-opioid action. It also does something the seed hypothesis did not, which
  is anchor the receptor leg outside iboga pharmacology entirely, using
  CHRNA5/A3/B4 mouse genetics and two chemically unrelated selective
  antagonists. All eleven PMIDs it introduces resolve to real papers. Two are
  mischaracterized in ways that both happen to favour the hypothesis. The
  alcohol AT-1001 study is cited as generalizing support when its own
  conclusion is that the data do not support specific α3β4 involvement in
  alcohol reward, and the dose that reduced alcohol self-administration reduced
  food self-administration too, which contradicts the reinforcer-selectivity
  theme it is enlisted for. The Sherva human genetics paper is credited with an
  opioid-dependence association its abstract does not report. A third problem
  runs the other way and is more interesting: the report declares ibogaine
  non-reinforcer-selective without the temporal qualification that makes the
  claim false for the effect actually under discussion. The provider returned an
  HTML and PDF report bundle under `../openscientist_artifacts/`, which
  `.gitignore` excludes from the repository, so no `artifacts` path is declared
  here; the assessed content is the committed `openscientist.md`.
claims:
  - claim_id: congener-rescoping
    statement: >-
      The hypothesis is best re-scoped as a model of 18-MC's anti-opioid action
      rather than an established explanation for ibogaine.
    disposition: RETAINED
    report_quote: >-
      Partially supported — and best re-scoped as a congener-specific
      (18-MC-anchored) mechanism rather than an established explanation for
      ibogaine
    rationale: >-
      Correct, and reached independently of the seed hypothesis, whose own
      description already names this weakness. Every in vivo habenular
      localization result uses 18-MC; no study has infused ibogaine into MHb or
      IPN. The report converts a caveat into the primary framing, which is the
      right emphasis.
    citations:
      - PMID:16626688
      - PMID:17447255
      - PMID:21040239
  - claim_id: receptor-leg-anchored-outside-iboga
    statement: >-
      CHRNA5/A3/B4 genetics and chemically distinct selective antagonists
      establish α3β4 as causally implicated in opioid dependence and withdrawal,
      independently of iboga pharmacology.
    disposition: RETAINED
    report_quote: >-
      selective α3β4* nACh receptor antagonists, α-conotoxin AuIB and AT-1001,
      attenuated somatic signs of morphine withdrawal in a dose-related manner
    rationale: >-
      Verified, and this is the report's most valuable contribution. Cluster
      overexpression increases somatic morphine-withdrawal signs, α5 and β4
      knockouts decrease them, and two structurally unrelated antagonists
      attenuate them dose-dependently. That converts the receptor from a
      plausible iboga target into an independently supported node. Note the
      endpoint throughout is withdrawal, not self-administration, so it supports
      the receptor leg rather than the seed model's behavioural claim.
    citations:
      - PMID:24750073
  - claim_id: at1001-alcohol-mischaracterized
    statement: >-
      AT-1001 reducing alcohol seeking under yohimbine stress generalizes the
      α3β4 model across reinforcers.
    disposition: REJECTED
    report_quote: >-
      AT-1001 reduces alcohol seeking under yohimbine stress
      ([PMID:25689019](https://pubmed.ncbi.nlm.nih.gov/25689019/))
    rationale: >-
      The source concludes the opposite of what it is cited for. Its own summary
      states that the observations do not support a specific involvement of
      α3β4 nAChRs in mediating alcohol reward or cue-induced relapse, and the
      effect is confined to yohimbine-precipitated stress reinstatement. Worse
      for the report's theme, the dose that reduced alcohol self-administration
      also reduced food self-administration, so this study is a counterexample
      to reinforcer selectivity rather than an instance of it. The paper also
      describes AT-1001 as an α3β4 partial agonist, while the report calls it a
      selective antagonist throughout.
    citations:
      - PMID:25689019
      - PMID:22278092
  - claim_id: sherva-opioid-association-overstated
    statement: >-
      Sherva et al. independently associated the 15q25 cluster with opioid
      dependence phenotypes.
    disposition: REJECTED
    report_quote: >-
      Sherva et al. 2010
      ([PMID:20485328](https://pubmed.ncbi.nlm.nih.gov/20485328/))
      independently associated the 15q25 CHRNA5/A3/B4 cluster with opioid
      dependence phenotypes.
    rationale: >-
      Opioid dependence was tested and formed part of the ascertainment, but the
      associations the abstract reports as significant are for nicotine,
      cocaine, and alcohol dependence, with the strongest signal being CHRNA5
      rs684513 and cocaine dependence. No significant opioid-dependence
      association is reported. The human-genetics support for the opioid arm
      rests on the CHRNA3 protective variants in the other cited paper, not on
      this one.
    citations:
      - PMID:20485328
      - PMID:24750073
  - claim_id: ibogaine-nonselectivity-unqualified
    statement: >-
      Reinforcer selectivity is true for 18-MC and false for ibogaine, so the
      model's hallmark selectivity claim does not transfer.
    disposition: QUALIFIED
    report_quote: >-
      | Reinforcer-selective (spares non-drug reward) | **True for 18-MC, FALSE
      for ibogaine** |
    rationale: >-
      The cited comparison is accurate as far as it goes: ibogaine, unlike
      18-MC, affects responding for water. But the original self-administration
      report distinguishes the two phases explicitly. Ibogaine depressed water
      responding acutely, and there was no aftereffect a day or more later, so
      the authors called the ibogaine-morphine interaction somewhat specific.
      Since the seed hypothesis and this entire hypothesis set concern the
      durable aftereffect rather than the acute one, the flat FALSE is wrong for
      the effect under discussion. The correct statement is that ibogaine is
      non-selective acutely and selective in its aftereffect.
    citations:
      - PMID:11085336
      - PMID:1868880
  - claim_id: noribogaine-potency-mismatch
    statement: >-
      Noribogaine is the weakest α3β4 blocker in the congener series yet
      dominates ibogaine's late pharmacokinetics, which argues against α3β4
      block as the sole mechanism of the persistent effect.
    disposition: RETAINED
    report_quote: >-
      Noribogaine — the long-lived active metabolite that dominates ibogaine's
      pharmacology hours after dosing — is therefore **~7-fold weaker than
      ibogaine and ~4.6-fold weaker than 18-MC** at the target receptor.
    rationale: >-
      The potency ordering is verified against the source and the arithmetic is
      right. This is a clean quantitative argument that the report constructs
      rather than copies, and it is the sharpest internal objection to the
      hypothesis: the molecule present when the durable effect is measured is
      the one least able to drive the proposed mechanism.
    citations:
      - PMID:26022277
      - PMID:38519421
  - claim_id: habenular-mor-parallel
    statement: >-
      Habenular MOR on β4-defined neurons, not α3β4 channel block, may be the
      molecular driver at the same anatomical locus.
    disposition: QUALIFIED
    report_quote: >-
      it validates the anatomical locus but relocates the molecular driver from
      the α3β4 ion channel to the MOR expressed on the same β4-defined neuronal
      population
    rationale: >-
      The underlying results are verified and the parallel is a genuinely good
      catch that neither the seed hypothesis nor the other reports surfaced.
      "Relocates" overstates it, though, and the report's own hedge elsewhere is
      the better reading: in the conditional-knockout study, deleting MOR
      attenuated withdrawal signs precipitated by mecamylamine as well as by
      naloxone, which indicates convergence on a shared β4-neuron population
      rather than displacement of one mechanism by the other. The proposed test,
      18-MC in MHb-MOR conditional knockouts, is well posed either way.
    citations:
      - PMID:31005059
      - PMID:42217817
      - PMID:39270652
  - claim_id: at1001-opioid-sa-gap
    statement: >-
      No opioid self-administration study has been run with a selective α3β4
      antagonist, despite such studies existing for nicotine and cocaine.
    disposition: RETAINED
    report_quote: >-
      **A dedicated opioid self-administration study with AT-1001 was not
      found** — a concrete, tractable gap.
    rationale: >-
      Survives an independent search. The asymmetry is real and striking: the
      selective tool exists, blocks nicotine self-administration with a food
      control, and attenuates morphine withdrawal, but has never been put
      against opioid self-administration, which is the endpoint the hypothesis
      is about. This is the most actionable gap of the three reports because it
      needs no new chemistry.
    citations:
      - PMID:22278092
      - PMID:24750073
      - PMID:26256075
  - claim_id: no-human-18mc-oud-trial
    statement: >-
      There is no human clinical efficacy trial of 18-MC or any selective α3β4
      antagonist for opioid use disorder.
    disposition: RETAINED
    report_quote: >-
      Systematic PubMed searches returned **zero** human 18-MC efficacy or
      phase-1 addiction trials.
    rationale: >-
      Confirmed, and the report's supporting detail is a nice piece of evidence
      for an absence: the only recent human-facing 18-MC development work is an
      antileishmanial program declaring a safety profile compatible with
      first-in-human evaluation for that indication. A compound being taken
      toward first-in-human for a parasitic disease is decent proof that no
      addiction trial preceded it.
    citations:
      - PMID:42038284
  - claim_id: pharmacokinetic-depot-alternative-omitted
    statement: >-
      The alternatives to the α3β4 route are the GDNF, kappa/NMDA, habenular
      MOR, and 5-HT2A mechanisms.
    disposition: QUALIFIED
    report_quote: >-
      the **receptor-level and site-specific premises are solid, but the
      transfer to ibogaine itself is unproven and actively contested.**
    rationale: >-
      As in the GDNF report, every alternative offered is pharmacodynamic, so
      the premise that a pharmacodynamic mechanism is needed to explain
      persistence is never examined. The report cites the one paper that states
      the alternative directly, which notes that both 18-MC and ibogaine are
      sequestered in fat and that 18-MC probably has an active metabolite, but
      does not carry that forward into the alternatives list. Sustained exposure
      from a fat depot competes with all five listed mechanisms for the same
      explanandum and belongs in the table.
    citations:
      - PMID:11085336
      - PMID:9668680
  - claim_id: emerging-status-recommendation
    statement: >-
      The hypothesis should remain EMERGING with an explicit annotation that the
      in vivo evidence is congener-specific to 18-MC.
    disposition: RETAINED
    report_quote: >-
      The hypothesis should remain **EMERGING**, with an explicit annotation
      that the in vivo evidence is congener-specific to 18-MC.
    rationale: >-
      Agreed, and the KB entry already carries both the status and that
      annotation in its description and notes. No amendment is required. The
      report's independent arrival at the same scoping is a mild check that the
      seed was framed honestly rather than to invite confirmation.

claims:
  - claim_id: kappa-necessity-untested
    statement: >-
      Kappa agonism has been shown sufficient in engineered analogs but never
      shown necessary for native ibogaine's anti-opioid effect.
    disposition: RETAINED
    report_quote: >-
      "kappa agonism is *necessary* for native ibogaine's effect" is **untested**
    rationale: >-
      Correct, and the report names the specific missing experiment: a norBNI
      or Oprk1-knockout reversal test of ibogaine in opioid self-administration.
      Worth pairing with a partial result the report did not surface, that a
      kappa antagonist combined with an NMDA agonist has been reported to
      partially reverse several of ibogaine's effects. That is old, non-
      isolating, and from the originating lab, but it is not nothing, and it
      makes the missing edge a replication-and-isolation problem rather than a
      blank.
    citations:
      - PMID:39304653
      - PMID:26302653
      - PMID:9668680
  - claim_id: polarity-paradox
    statement: >-
      The model proposes a kappa agonist to relieve the state whose validated
      treatment is kappa antagonism, and ibogaine's durable antidepressant
      effect compounds the mismatch.
    disposition: QUALIFIED
    report_quote: >-
      the same hyperkatifeia state — **the opposite pharmacological direction**
      from the validated antidepressant class
    rationale: >-
      The observation is genuine and is the sharpest conceptual objection raised
      across the three reports. It is overstated as posed, because both legs are
      weak. On the antidepressant side, the aticaprant phase 2 primary analysis
      set gave a one-sided p=0.044 with an effect size of 0.23; the larger
      effect (0.36) is the full intent-to-treat analysis, and phase 3 is
      pending. On the ibogaine side, see the sample-size claim below. The honest
      statement is a tension between two marginal signals, which still merits
      recording because the directions genuinely conflict.
    citations:
      - PMID:38649428
      - PMID:39019223
      - PMID:19716811
      - PMID:28402682
  - claim_id: noller-sample-size
    statement: >-
      A 12-month observational study of 14 patients found significant reductions
      in drug use and depression.
    disposition: REJECTED
    report_quote: >-
      | [28402682](https://pubmed.ncbi.nlm.nih.gov/28402682/) | Human clinical |
      **Supports + Qualifies** | Durable use/withdrawal/mood | ↓ use (p=0.002),
      ↓ withdrawal (p=0.015), ↓ BDI-II 12mo (p<0.001) | Observational, n=14 |
    rationale: >-
      The denominators differ by endpoint and the report collapses them. In the
      source, the 12-month ASI-Lite and BDI-II results are Friedman tests among
      the 8 participants who completed all interviews; only the acute withdrawal
      result uses all 14. Fourteen were enrolled, four contributed partial data,
      and one died during treatment. Since the durable antidepressant finding is
      load-bearing for the report's central paradox, attaching it to n=14 rather
      than n=8 completers materially inflates the argument.
    citations:
      - PMID:28402682
  - claim_id: mu-antagonism-replication
    statement: >-
      Iboga alkaloids are mu-opioid antagonists, so withdrawal relief cannot be
      agonist substitution.
    disposition: RETAINED
    report_quote: >-
      ibogaine, noribogaine, and 18-MC are **mu-opioid receptor antagonists**
    rationale: >-
      Verified, and the most valuable citation the report adds. This is an
      independent replication study whose stated purpose was to test whether
      ibogaine's detoxification effect is a mu-agonist action, concluding that
      it is not and that the findings justify searching for alternative targets.
      It closes off the substitution explanation directly rather than by
      inference, and it deepens rather than resolves the puzzle: a mu antagonist
      relieving opioid withdrawal is the observation every model here has to
      explain.
    citations:
      - PMID:24204784
      - PMID:26302653
  - claim_id: exposure-limitation
    statement: >-
      Kappa engagement is exposure-limited, because the kappa EC50 and mu Ke sit
      at or above brain concentrations achievable at therapeutic doses, and
      those concentrations are CYP2D6-gated.
    disposition: RETAINED
    report_quote: >-
      **the model is exposure-limited**
    rationale: >-
      A good piece of reasoning the report constructs rather than copies. It
      converts CYP2D6 variability from a safety parameter into a mechanistically
      load-bearing one: on this model, whether the drug engages its proposed
      target at all depends on metabolizer status. That yields a testable
      prediction, that response should stratify by CYP2D6 activity score, and
      the report correctly notes no such pharmacogenomic study exists.
    citations:
      - PMID:38519421
      - PMID:26302653
      - PMID:26807959
  - claim_id: bias-framing-questioned
    statement: >-
      G-protein bias is the mechanism by which a kappa agonist avoids dysphoria.
    disposition: QUALIFIED
    report_quote: >-
      benefit "attributed to factors other than G-protein bias"
    rationale: >-
      Well found, and directly on point rather than borrowed from the mu-bias
      literature: the cited study tested two biased kappa agonists in rhesus
      monkeys and found the milder profile of triazole 1.1 real but attributed
      it to factors other than G-protein bias. This undercuts the explanatory
      device the seed hypothesis leans on hardest. It does not undercut the
      phenotype, since the milder side-effect profile was observed; it undercuts
      the account of why.
    citations:
      - PMID:35513117
  - claim_id: kappa-normalization-reinterpretation
    statement: >-
      Noribogaine's inhibition of dynorphin-driven beta-arrestin recruitment may
      make it act as a functional antagonist in the high-dynorphin state,
      explaining both the anti-opioid and antidepressant effects.
    disposition: RETAINED
    report_quote: >-
      a **KOR-signalling-normalization model**
    rationale: >-
      The best original contribution across the three reports. It is a genuine
      reinterpretation of the same molecular data rather than a new citation,
      it dissolves the paradox the report itself raises, and it is testable: the
      prediction is state-dependence, with the direction of effect differing
      between high-dynorphin and basal conditions. If this hypothesis is
      revised, this is the form to revise it into.
    citations:
      - PMID:26302653
  - claim_id: single-author-hypothesis-paper-as-corroboration
    statement: >-
      A recent conceptual synthesis corroborates the GDNF-plus-plasticity
      competitor.
    disposition: QUALIFIED
    report_quote: >-
      A recent conceptual synthesis
      ([PMID: 41424776](https://pubmed.ncbi.nlm.nih.gov/41424776/)) similarly
      frames ibogaine's action as GDNF induction plus glutamate/dopamine
      modulation
    rationale: >-
      Characterized honestly as a conceptual synthesis, but it carries no
      evidentiary weight and should not be cited as corroboration of anything.
      It is a single-author paper by an independent researcher that describes
      itself as proposing a theoretical framework requiring empirical
      validation. The GDNF competitor is well supported by primary work; citing
      this alongside it adds the appearance of independent agreement without the
      substance.
    citations:
      - PMID:41424776
      - PMID:15659598
  - claim_id: alpha3beta4-sar-correlation
    statement: >-
      18-MC's anti-addictive potency correlates with alpha3beta4 inhibition
      while its opioid activity is low.
    disposition: RETAINED
    report_quote: >-
      "opioid activities were relatively low, and the α3β4 nicotinic
      acetylcholine receptor activities correlated with in vivo antiaddictive
      activities."
    rationale: >-
      Verified verbatim against the SAR source, and the report is right to treat
      it as competing evidence: within a congener series, the property that
      tracks in vivo efficacy is nicotinic, not opioid. It remains correlational
      across a small congener set, which the report's own confidence column
      states.
    citations:
      - PMID:12801235
      - PMID:15178360
  - claim_id: corpus-provenance
    statement: The report reviewed 35 papers across 5 iterations.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      35 papers reviewed
    rationale: >-
      The deposited citation manifest lists 25 unique PMIDs. Reviewing 35 papers
      and citing 25 is entirely plausible, but the claim cannot be reconstructed
      from the deposited provenance, and no search strategy or screening log is
      included. Treat the number as unverified rather than as a coverage
      guarantee.
  - claim_id: emerging-status-recommendation
    statement: >-
      The hypothesis remains EMERGING with the necessity edge as the load-
      bearing gap.
    disposition: RETAINED
    report_quote: >-
      PARTIALLY SUPPORTED, with the central causal claim UNRESOLVED.
    rationale: >-
      Agreed; the KB entry already carries EMERGING and already names the
      sufficiency-versus-necessity distinction in its description. The
      substantive change this report argues for is not to the status but to the
      hypothesis statement, replacing net kappa agonism with the
      state-dependent normalization reading. That is a curation decision to take
      deliberately, not a correction to apply from a single report.

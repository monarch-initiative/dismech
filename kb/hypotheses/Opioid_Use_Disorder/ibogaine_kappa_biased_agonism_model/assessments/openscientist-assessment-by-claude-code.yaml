hypothesis_id: ibogaine_kappa_biased_agonism_model
assessed_at: "2026-08-28T05:30:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The most analytically ambitious of the three reports, and the only one that
  attacks its seed hypothesis on conceptual rather than evidential grounds. Its
  central argument is that the model runs in the wrong pharmacological
  direction: the hyperkatifeia state it claims to relieve is the validated
  indication for kappa ANTAGONISTS, and ibogaine produces a durable
  antidepressant signal that net kappa agonism should not produce. That is a
  real and useful objection, and the report's proposed reconciliation, a
  kappa-signalling-normalization reading in which noribogaine behaves like a
  functional antagonist in the high-dynorphin state, is a better statement of
  the hypothesis than the seed's own. All sixteen new PMIDs resolve and are
  accurately characterized. The problem is that the paradox is built from two
  weak legs presented as firm ones. The ibogaine antidepressant result is n=8
  completers of 14 enrolled in an uncontrolled study with one death, not the
  n=14 the evidence matrix records, and the aticaprant result is a one-sided
  p=0.044 with an effect size of 0.23 in its primary analysis set. A tension
  between two marginal findings is worth recording; it is not the decisive
  conceptual argument the report presents. Two smaller issues: a single-author
  hypothesis paper is used as corroboration, and the stated corpus size exceeds
  the deposited citation manifest.
artifacts:

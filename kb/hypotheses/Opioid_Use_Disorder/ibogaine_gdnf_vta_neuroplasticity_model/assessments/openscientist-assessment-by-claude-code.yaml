hypothesis_id: ibogaine_gdnf_vta_neuroplasticity_model
assessed_at: "2026-08-28T04:40:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  An unusually disciplined report. Every PMID it introduces resolves to a real
  paper that says what the report says it says, and its central judgment is
  correct and well argued: the GDNF/VTA causal chain is established for the
  ethanol reinforcer and is inference for opioids, because the necessity
  experiment has never been run with an opioid reinforcer. It also volunteers
  three findings that weaken the seed hypothesis rather than confirming it,
  which is the behaviour a hypothesis-search report should show and often does
  not. Three corrections matter. First, the report's own highest-priority
  "unverified" gap, the self-amplifying VTA GDNF loop, is not a literature gap
  at all: it was demonstrated in vivo with shRNA knockdown in 2011, so the
  report's search failed rather than the field. Second, the report scores the
  competing kappa model as having no necessity test while citing, in the same
  table, a paper reporting that a kappa antagonist plus an NMDA agonist
  partially reverses ibogaine's effects. Third, the same paper offers a
  pharmacokinetic explanation for durability (sequestration in fat with slow
  release and conversion to noribogaine) that directly competes with the
  induced-plasticity premise, and the report does not engage it. One evidence
  row is mis-graded and the proposed curation snippets are elided and cannot
  be used as written. The provider returned an
  HTML and PDF report bundle under `../openscientist_artifacts/`, which
  `.gitignore` excludes from the repository, so no `artifacts` path is declared
  here; the assessed content is the committed `openscientist.md`. This run also emitted no `openscientist.md.citations.md` sidecar, unlike the two sibling runs, so its citations are checkable only from the report body.
claims:
  - claim_id: ethanol-only-scope
    statement: >-
      The ibogaine to VTA GDNF to Ret/ERK-MAPK causal chain is established for
      ethanol self-administration and is inference when transferred to opioids.
    disposition: RETAINED
    report_quote: >-
      directly and rigorously established, but only for the ethanol reinforcer
    rationale: >-
      Correct and correctly scoped. The sufficiency and necessity pair
      (intra-VTA GDNF microinjection mimics, intra-VTA anti-GDNF antibody
      blocks) is reported only for ethanol, and the MAPK-dependence follow-up
      is also ethanol. Nothing in the retrieved corpus performs either
      manipulation against an opioid reinforcer. The report does not overstate
      the transfer, which is the failure mode this scoping is meant to catch.
    citations:
      - PMID:15659598
      - PMID:18541917
  - claim_id: opioid-necessity-untested
    statement: >-
      The experiment that would discriminate this model from its competitors,
      intra-VTA anti-GDNF blockade of ibogaine's effect on opioid
      self-administration, has never been performed.
    disposition: RETAINED
    report_quote: >-
      intra-VTA anti-GDNF blockade of ibogaine's effect on opioid
      self-administration/relapse — has never been performed
    rationale: >-
      This matches the seed hypothesis's own stated discriminating test and
      survives an independent search. It is the single most useful output of
      the report, because it converts a diffuse "mechanism unclear" into one
      named, runnable experiment.
    citations:
      - PMID:15659598
      - PMID:16626688
      - PMID:39304653
  - claim_id: self-amplifying-loop-unretrievable
    statement: >-
      The self-amplifying VTA GDNF feedback loop that would explain durability
      could not be retrieved and should be treated as a known-unknown.
    disposition: REJECTED
    report_quote: >-
      Multiple queries for a VTA GDNF positive-feedback loop returned no
      retrievable record via this endpoint.
    rationale: >-
      This is a search failure presented as a knowledge gap, and it understates
      the seed hypothesis. The loop was demonstrated in vivo: a single intra-VTA
      recombinant GDNF infusion produces a long-lasting local increase in GDNF
      mRNA and protein requiring de novo transcription and translation, and the
      long-lasting suppression of excessive alcohol consumption is abolished
      both by protein-synthesis inhibition and by shRNA knockdown of VTA GDNF.
      That is a necessity test for the durability mechanism itself, not merely
      a proposal. The report's own curator-verification note points at the right
      lab but the wrong journal, naming Nature Neuroscience 2011 rather than
      Translational Psychiatry 2011. Retrieved, the finding strengthens the
      seed model in the ethanol domain while leaving the opioid gap untouched.
    citations:
      - PMID:22238721
      - PMID:21734280
  - claim_id: kappa-necessity-underweighted
    statement: >-
      The competing kappa model has only partial, analog-class necessity
      evidence for ibogaine's own effect.
    disposition: REJECTED
    report_quote: >-
      | **κ-agonism** | **Yes** (oxa-iboga PMID 39304653) | Partial (analog
      class) |
    rationale: >-
      The report cites PMID:9668680 in the same matrix but reads it only as a
      review-level synthesis. That paper reports the lab's own rat work,
      including that a combination of a kappa antagonist and an NMDA agonist
      partially reverses several of ibogaine's effects. That is a
      loss-of-function test against ibogaine itself, in the opioid domain, which is
      exactly the class of evidence the report says the kappa model lacks. It
      is partial and old and does not isolate kappa from NMDA, but grading it
      as absent understates the strongest competitor to the seed hypothesis.
    citations:
      - PMID:9668680
      - PMID:39304653
      - PMID:26302653
  - claim_id: pharmacokinetic-depot-alternative-omitted
    statement: >-
      Durability of the single-dose effect requires an induced-plasticity
      explanation rather than continued drug exposure.
    disposition: QUALIFIED
    report_quote: >-
      durability sustained by self-amplifying VTA GDNF loop | **Inferred /
      unverified in this search**
    rationale: >-
      The report enumerates four competing mechanisms but all four are
      pharmacodynamic, so it never tests the premise that durability needs a
      plasticity mechanism at all. PMID:9668680 proposes that ibogaine's
      long-term effects may be mediated by slow release from fat tissue, where
      ibogaine is sequestered, and conversion to noribogaine. That is a
      sustained-exposure explanation for the same explanandum and it competes
      with every pharmacodynamic model on the list, including the seed. It is
      not obviously correct, and the human PK data showing rapid ibogaine
      clearance argue against it for the parent compound, but it belongs in the
      alternatives table and is absent.
    citations:
      - PMID:9668680
      - PMID:38519421
      - PMID:1868880
  - claim_id: messer-opioid-bridge
    statement: >-
      Intra-VTA GDNF blocks biochemical adaptations to chronic morphine, and
      chronic morphine lowers VTA phospho-Ret, bridging the model into the
      opioid domain.
    disposition: RETAINED
    report_quote: >-
      | 4 | 10798408 (Messer 2000) | Model organism | **Support (opioid bridge)**
    rationale: >-
      Verified and correctly characterized, including the report's own caveat
      that the endpoints are biochemical and reward-related rather than
      ibogaine-driven self-administration. This is the most valuable citation
      the report adds, because it shows the VTA GDNF pathway is
      opioid-responsive independently of any ibogaine claim.
    citations:
      - PMID:10798408
  - claim_id: glick-1991-opioid-durability
    statement: >-
      A single ibogaine dose durably reduces morphine self-administration in
      rats with an aftereffect outlasting the drug's elimination.
    disposition: RETAINED
    report_quote: >-
      the aftereffect occurred at a time when ibogaine should have been entirely
      eliminated from the body
    rationale: >-
      Verified. The report is right to label this mechanism-agnostic: it
      establishes the phenotype the seed model is trying to explain without
      favouring any mechanism. Worth noting the source also reports marked
      inter-individual variability, with some rats resistant to prolonged
      aftereffects, which the report picks up as a responder-stratification
      lead.
    citations:
      - PMID:1868880
  - claim_id: human-gdnf-biomarker-null
    statement: >-
      The human neurotrophin that tracks opioid craving is BDNF, and serum GDNF
      is unchanged and craving-unassociated in opiate-dependent patients.
    disposition: QUALIFIED
    report_quote: >-
      the human neurotrophic signal that tracks opioid craving is **BDNF, not
      GDNF**
    rationale: >-
      The underlying result is verified and is a genuine negative for the
      GDNF-specific claim in humans. The report's own caveat is the right one
      and should be carried with the finding rather than dropped: serum is not
      VTA tissue, the cohort is 28 males on diacetylmorphine maintenance, and
      the measurement is a cross-sectional baseline rather than a response to
      ibogaine. The seed model predicts a GDNF change after dosing, which this
      study did not test.
    citations:
      - PMID:21890593
  - claim_id: niwa-evidence-type
    statement: PMID:17538232 is model-organism evidence.
    disposition: REJECTED
    report_quote: >-
      | 5 | 17538232 (Niwa 2007) | Model organism | Support (opioid bridge) |
    rationale: >-
      The source is a review article that discusses the authors' Leu-Ile work
      rather than reporting a primary experiment. The substantive claim, that
      Leu-Ile suppresses morphine place preference and sensitization and that
      the effect is absent in GDNF heterozygous mice, is accurately relayed,
      but grading it as model-organism evidence inflates the tier. If this is
      promoted to the disease YAML it needs the primary Leu-Ile paper, not this
      one, and evidence_source OTHER at best in the interim.
    citations:
      - PMID:17538232
  - claim_id: curation-lead-snippets-elided
    statement: >-
      The proposed evidence snippets are usable as curation leads.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      *"Infusion of GDNF into the ventral tegmental area (VTA)... blocks certain
      biochemical adaptations to chronic cocaine or morphine..."*
    rationale: >-
      Useful as leads, unusable as written. Several proposed snippets contain
      ellipses standing in for elided text, so they are not exact substrings of
      the cached source and will fail snippet verification. The source sentence
      here reads "Infusion of GDNF into the ventral tegmental area (VTA), a
      dopaminergic brain region important for addiction, blocks certain
      biochemical adaptations to chronic cocaine or morphine as well as the
      rewarding effects of cocaine." Each lead must be re-quoted against a
      fetched cache entry before promotion.
    citations:
      - PMID:10798408
  - claim_id: clinical-evidence-thinness
    statement: >-
      The clinical evidence base amounts to three RCTs across the iboga
      alkaloids, none of them mechanistic.
    disposition: RETAINED
    report_quote: >-
      Clinical evidence base is thin: essentially 3 RCTs total across iboga
      alkaloids (PMID 42117212), none mechanistic.
    rationale: >-
      Verified against the cited scoping review, which is more informative than
      the report's summary of it. Of the three, one is a cocaine-dependence
      pilot, one is an ascending-dose safety study in healthy volunteers, and
      the third, the only opioid-dependent RCT, found dose-dependent QTc
      prolongation with non-significant reductions in withdrawal symptoms. That
      last detail matters for this hypothesis and should be carried forward: the
      one randomized opioid trial did not demonstrate the withdrawal effect the
      observational literature reports.
    citations:
      - PMID:42117212
  - claim_id: emerging-status-recommendation
    statement: >-
      The hypothesis should remain EMERGING for opioid use disorder and be
      flagged as reinforcer-transferred inference.
    disposition: RETAINED
    report_quote: >-
      For OUD it should remain **EMERGING**, explicitly flagged as
      reinforcer-transferred inference
    rationale: >-
      Agreed, and the KB entry already carries that status and that caveat in
      the hypothesis description. No status change is warranted from this
      report. The corrections above change what the hypothesis competes
      against, not how mature it is.

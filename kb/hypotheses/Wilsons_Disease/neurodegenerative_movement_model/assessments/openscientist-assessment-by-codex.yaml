claims:
  - claim_id: active-neurodegeneration
    statement: >-
      Active structural and axonal brain injury occurs in neurological Wilson
      disease and tracks neurological severity in human cohorts.
    disposition: RETAINED
    report_quote: >-
      Progressive copper-related brain injury in motor control circuits is
      confirmed by longitudinal brain atrophy data
    rationale: >-
      PMID:36165286 found faster longitudinal ventricular-volume expansion in
      neurological presentations and correlation with change in impairment.
      PMID:31179301 summarizes diffuse brain copper elevation, preferential
      putaminal pathology, demyelination, and residual impairment, while
      multiple NfL studies support ongoing axonal injury. These data establish
      that neurodegenerative injury is real, even though they do not quantify
      its causal share of each movement phenotype.
    citations:
      - PMID:36165286
      - PMID:31179301
      - PMID:35114010
      - PMID:33078859
  - claim_id: neurodegeneration-necessary
    statement: Neurodegeneration is necessary for Wilson movement phenotypes.
    disposition: REJECTED
    report_quote: >-
      strongly supported as a *necessary* component of the pathophysiology
      driving movement phenotypes
    rationale: >-
      Atrophy, NfL, pathology, and cross-sectional associations demonstrate
      injury but do not test necessity. The report itself emphasizes large
      treatment-responsive components and functional candidates, which are
      compatible with movement dysfunction before fixed neuronal loss.
      Neither a lesion study nor a human subgroup proven to require structural
      degeneration is presented. "Common and important component" is
      supportable; "necessary" is not.
    citations:
      - PMID:36165286
      - PMID:31179301
  - claim_id: dual-mechanism-synthesis
    statement: >-
      An irreversible-degeneration arm plus a reversible-functional arm is a
      useful organizing model, but their independence, timing, and relative
      contributions are untested.
    disposition: QUALIFIED
    report_quote: >-
      a **dual-mechanism model** — combining irreversible neurodegeneration with
      reversible functional circuit dysfunction — best explains the clinical
      spectrum.
    rationale: >-
      The evidence supports coexistence of structural injury and
      treatment-responsive symptoms. It does not directly classify individual
      deficits into two arms, show that the arms are mechanistically distinct,
      or compare this model against repair, remyelination, edema resolution,
      synaptic plasticity, and mixed cellular recovery. "Best explains" and the
      proposed stage dominance are synthesis-level hypotheses, not results of a
      discriminating study.
    citations:
      - PMID:36165286
      - PMID:31179301
      - PMID:40513300
  - claim_id: transplant-fixed-loss-incompatibility
    statement: >-
      Neurological improvement after liver transplantation is incompatible
      with fixed structural brain loss.
    disposition: REJECTED
    report_quote: outcomes incompatible with fixed structural loss.
    rationale: >-
      PMID:40513300 synthesized heterogeneous case reports and series: among
      survivors beyond one year, most improved, but there were no standardized
      eligibility criteria, randomized counterfactual, or direct measures
      partitioning fixed loss from reversible injury. Improvement after removal
      of the copper source can coexist with residual fixed damage,
      remyelination, compensation, and neuroplasticity. The data refute an
      all-fixed account of symptoms, not the presence of fixed structural loss.
    citations:
      - PMID:40513300
      - PMID:32398357
  - claim_id: d2-receptor-generalization
    statement: >-
      Early D2 receptor dysfunction is broadly shown to be reversible whereas
      late D2 loss is structurally irreversible.
    disposition: QUALIFIED
    report_quote: >-
      This is key evidence for the dual-mechanism model: early D2 loss is
      partially reversible (functional), while late-stage D2 loss with atrophy
      is irreversible (structural).
    rationale: >-
      PMID:8208404 reports PET in one patient and SPECT in two patients before
      and after four months of penicillamine, with improved binding and MRI
      signal. The late comparison is another very small report. These cases
      establish possibility and motivate longitudinal study; they do not define
      general early and late disease states or prove that receptor-binding
      change cleanly separates functional from structural mechanisms.
    citations:
      - PMID:8208404
      - PMID:1532631
  - claim_id: toxic-milk-sufficiency-proof
    statement: >-
      The tx/tx-J comparison proves that neurodegeneration is insufficient for
      a motor phenotype.
    disposition: QUALIFIED
    report_quote: >-
      proving that neurodegeneration alone is insufficient.
    rationale: >-
      PMID:33590415 is a review comparing two toxic-milk strains with different
      Atp7b mutations, genetic backgrounds, systemic phenotypes, progression,
      and reported behavior. The reported dissociation is important
      counterevidence to a simple copper-burden model, but it is not a
      controlled isogenic test of matched regional neuronal loss and therefore
      does not prove insufficiency of neurodegeneration as a category.
    citations:
      - PMID:33590415
  - claim_id: thalamocortical-fmri-cohort
    statement: >-
      A Wilson disease cohort with globus-pallidus metal deposition showed
      thalamocortical hyperconnectivity that explains motor symptoms.
    disposition: REJECTED
    report_quote: >-
      Resting-state fMRI showed that WD patients with metal deposition in the
      globus pallidus (GP) exhibited increased functional connectivity
    rationale: >-
      PMID:35624941 is a single case report of one patient with Wilson disease
      and a seizure syndrome resembling juvenile myoclonic epilepsy. The
      authors compared that patient's fMRI with controls and proposed a lesion
      model for myoclonus and tonic-clonic seizures. It is not a plural-patient
      Wilson cohort and does not establish a general movement-disorder circuit
      mechanism.
    citations:
      - PMID:35624941
  - claim_id: dbs-mechanistic-proof
    statement: DBS response confirms the reversible circuit mechanism in Wilson disease.
    disposition: QUALIFIED
    report_quote: DBS Confirms Modulatable Circuits in WD
    rationale: >-
      PMID:35811746 reports approximately 85% tremor-score improvement in five
      Wilson patients with refractory tremor within a heterogeneous
      retrospective surgical series. DBS can modulate symptoms despite many
      underlying structural diseases; treatment response does not identify
      thalamocortical disinhibition as the causal Wilson mechanism or prove
      that the underlying injury is reversible.
    citations:
      - PMID:35811746
  - claim_id: nlrp3-model-scope
    statement: >-
      NLRP3 inhibition reduces copper-associated neurological injury in a
      toxic-milk mouse model, supporting a preclinical neuroinflammatory
      mechanism.
    disposition: QUALIFIED
    report_quote: Inhibiting NLRP3 prevented copper-induced neuropathology
    rationale: >-
      PMID:33462188 shows NLRP3 activation in TX mouse brain and copper-treated
      primary microglia; genetic or MCC950 blockade reduced cytokines,
      behavioral impairment, and neurodegeneration. This is valuable
      perturbational model evidence. Patient serum cytokines do not demonstrate
      brain NLRP3 activation in humans, so the claim must remain explicitly
      preclinical.
    citations:
      - PMID:33462188
  - claim_id: astrocyte-ontology-mapping
    statement: GO:0007399 is an astrocyte cell-type identifier.
    disposition: REJECTED
    report_quote: Astrocytes (GO:0007399)
    rationale: >-
      The repository's GO adapter labels GO:0007399 as nervous system
      development. Astrocyte is CL:0000127, and cell types should be mapped with
      Cell Ontology identifiers. This curation lead must not be promoted.
  - claim_id: search-provenance
    statement: The assessment corpus comprised 119 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: "**Papers reviewed:** 119"
    rationale: >-
      The report and citation sidecar expose 38 unique PMIDs and no
      reproducible 119-paper screening record. The provider's larger internal
      count may be real, but it is not auditable from the committed artifacts.

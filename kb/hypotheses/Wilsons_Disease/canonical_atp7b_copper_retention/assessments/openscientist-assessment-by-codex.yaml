hypothesis_id: canonical_atp7b_copper_retention
assessed_at: "2026-07-31T03:20:24Z"
overall_verdict: SUPPORTED
summary: >-
  The report reaches the correct overall conclusion: biallelic ATP7B
  dysfunction, impaired biliary copper excretion and ceruloplasmin loading, and
  hepatic copper retention form the established initiating mechanism of Wilson
  disease. Genetic, model-organism, cell-replacement, gene-transfer, chelation,
  and liver-transplant evidence converge on that core. Several refinements are
  nevertheless overstated. A cited Indian cohort does not show ATP7B as the
  sole causal explanation in every clinically diagnosed case, rescue studies
  do not prove formal necessity and sufficiency for every manifestation,
  mixed-species mitochondrial evidence does not establish a principal
  downstream effector, QSM is not element-specific, and one proposed GO mapping
  is wrong. The report is therefore reliable for the canonical core but not for
  all of its downstream rankings and curation leads.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-core
    statement: >-
      ATP7B dysfunction impairs biliary copper handling and drives the
      copper-retention syndrome that defines Wilson disease.
    disposition: RETAINED
    report_quote: >-
      The Canonical ATP7B Copper-Retention Model — that ATP7B loss-of-function
      impairs biliary copper excretion and ceruloplasmin loading, causing
      hepatic copper retention with secondary extrahepatic toxicity — is
      strongly supported by the totality of available evidence.
    rationale: >-
      PMID:12426114 describes ATP7B malfunction and toxic liver and brain copper
      accumulation. In LEC rats, ATP7B gene transfer restored
      holoceruloplasmin and increased fecal copper (PMID:11961729), while normal
      hepatocyte repopulation restored biliary excretion and normalized
      extensively repopulated livers (PMID:11273771). Atp7b-null mice develop
      progressive copper-associated liver injury that improves with chelation
      (PMID:37968102). These are convergent, intervention-linked supports for
      the initiating model.
    citations:
      - PMID:12426114
      - PMID:11961729
      - PMID:11273771
      - PMID:37968102
  - claim_id: sole-causative-gene-every-cohort
    statement: ATP7B was the sole causal explanation in every reported cohort.
    disposition: REJECTED
    report_quote: >-
      with ATP7B as the sole causative gene in every cohort
    rationale: >-
      The cited pan-India study examined 128 clinically diagnosed cases and
      reported genetically confirmed, single-variant, and genetically
      unresolved groups; its abstract also reports gene-burden signals in ANO8,
      LGR4, and CDC7. Whatever the ultimate interpretation of those secondary
      signals, PMID:39535360 cannot support the categorical claim that every
      cohort or every clinically diagnosed case was explained solely by ATP7B.
      Wilson disease remains an ATP7B-defined disorder, but that nosological
      fact does not validate the report's empirical cohort statement.
    citations:
      - PMID:39535360
  - claim_id: formal-necessity-and-sufficiency
    statement: >-
      ATP7B-restoring interventions prove that ATP7B loss is necessary and
      sufficient for the entire Wilson disease phenotype.
    disposition: QUALIFIED
    report_quote: >-
      constitute strong causal evidence that ATP7B loss is both necessary and
      sufficient for the WD phenotype.
    rationale: >-
      Gene transfer and hepatocyte replacement provide strong causal rescue
      evidence for hepatic copper handling in LEC rats, and liver
      transplantation normalizes copper indices in human case series
      (PMID:11961729, PMID:11273771, PMID:17889170). They do not constitute a
      formal loss-and-rescue test of every hepatic, neurological, renal, and
      hematopoietic manifestation in humans. Residual function, penetrance,
      tissue context, and modifiers also affect expression. "Established
      initiating cause" is supported; universal necessity-and-sufficiency
      wording is too broad.
    citations:
      - PMID:11961729
      - PMID:11273771
      - PMID:17889170
      - PMID:39322449
  - claim_id: mitochondrial-principal-effector
    statement: >-
      Mitochondrial dysfunction is an important hepatic downstream mechanism,
      but its dominance over all other copper-injury routes is unquantified.
    disposition: QUALIFIED
    report_quote: >-
      This positions mitochondrial dysfunction as the principal downstream
      effector linking copper accumulation to hepatocyte death.
    rationale: >-
      The 13-study meta-analysis in PMID:41480142 supports hepatic mitochondrial
      copper accumulation, structural injury, oxidative stress, and impaired
      bioenergetics across a heterogeneous mixture of patients and animal
      models. It did not compare mediated fractions of hepatocyte death across
      mitochondrial, lysosomal, proteotoxic, inflammatory, or other routes.
      PMID:24517326 also describes stage-dependent mitochondrial injury, with
      little evidence of oxidative stress early and severe ROS-associated
      damage later. "Central" is supportable in hepatic disease; "principal"
      is not established by comparative causal evidence.
    citations:
      - PMID:41480142
      - PMID:24517326
  - claim_id: free-copper-proximate-species
    statement: >-
      Labile or non-ceruloplasmin-bound copper is clinically important, but it
      is not established as the exclusive proximate toxic species in every
      tissue and disease stage.
    disposition: QUALIFIED
    report_quote: >-
      free (non-ceruloplasmin-bound) copper as the proximate toxic species.
    rationale: >-
      Neurological worsening during some chelation regimens and the different
      copper-handling profile of tetrathiomolybdate make exchangeable copper a
      credible toxicity and treatment variable. The human tracer study
      PMID:38081365 showed reduced intestinal uptake and blood retention after
      short TTM exposure, not a direct comparison of free versus total copper
      toxicity or a demonstration that one circulating fraction mediates all
      organ injury. The report should frame this as a clinically important
      refinement, not a universally proven exclusive species.
    citations:
      - PMID:16606763
      - PMID:38081365
  - claim_id: qsm-iron-causality
    statement: >-
      QSM abnormalities and ferritin correlations suggest altered brain metal
      handling but do not identify iron co-deposition as a causal contributor.
    disposition: QUALIFIED
    report_quote: >-
      suggesting iron co-deposition as a contributing factor to
      neurodegeneration.
    rationale: >-
      PMID:39233127 measured magnetic susceptibility, a composite tissue
      property described by the authors as a surrogate for metal burden. Serum
      ferritin correlated with susceptibility in several regions, whereas
      copper and ceruloplasmin did not. QSM does not chemically distinguish
      copper from iron, and the cross-sectional correlation does not establish
      tissue co-deposition, directionality, or an independent neurodegenerative
      effect.
    citations:
      - PMID:39233127
  - claim_id: penetrance-underdiagnosis
    statement: >-
      Underdiagnosis plausibly contributes to the genotype-to-clinical
      prevalence gap, but its share of that gap is not quantified.
    disposition: QUALIFIED
    report_quote: >-
      This suggests the penetrance gap partly reflects underdiagnosis rather
      than true non-penetrance
    rationale: >-
      The Spanish registry supports mutation-specific reduced penetrance or
      milder expression (PMID:39322449). The Estonian recall study found copper
      abnormalities and reported signs of neurodegeneration in 87% of 17
      recalled high-risk individuals (PMID:39674827), supporting missed
      disease in that setting. A small, selected recall cohort cannot partition
      underdiagnosis from age-dependent, mutation-specific, or true incomplete
      penetrance across populations.
    citations:
      - PMID:39322449
      - PMID:39674827
  - claim_id: ceruloplasmin-go-mapping
    statement: GO:0006534 represents ceruloplasmin biosynthesis.
    disposition: REJECTED
    report_quote: Ceruloplasmin biosynthesis (GO:0006534)
    rationale: >-
      The repository's GO adapter identifies GO:0006534 as obsolete cysteine
      metabolic process, not ceruloplasmin biosynthesis. This proposed
      ontology mapping must not be promoted.
  - claim_id: search-provenance
    statement: The assessment corpus comprised more than 155 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: "**Papers Reviewed:** 155+"
    rationale: >-
      The report and its generated citation sidecar expose 39 unique PMIDs, not
      a reproducible 155-paper corpus, search strategy, screening table, or
      exclusion log. The larger number may reflect provider-internal retrieval,
      but it cannot be audited from the committed artifacts and should not be
      treated as a quality metric.

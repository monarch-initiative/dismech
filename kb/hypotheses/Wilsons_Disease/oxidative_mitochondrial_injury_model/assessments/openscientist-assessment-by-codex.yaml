overall_verdict: SUPPORTED
summary: >-
  The core hepatic model is supported: pathological mitochondrial copper
  accumulation, structural injury, oxidative stress, impaired respiration and
  bioenergetics, and hepatocyte injury recur across human tissue and ATP7B
  models. The report overgrades the evidence when it calls this pathway
  necessary, dominant, and a final common pathway. Its proposed NRF2/GSH shared
  gatekeeper comes from acetaminophen liver injury rather than Wilson disease;
  its partial-antioxidant experiment is in rainbow-trout hepatocytes; and its
  cuproptosis and ferroptosis branches remain model-based and incompletely
  specific. The human immunohistochemistry supports mitochondrial membrane
  injury but is observational in treated noncirrhotic patients, with lower
  8-OHdG and only borderline 4-HNE elevation. The report also proposes three
  incorrect ontology mappings. Retain the canonical oxidative-mitochondrial
  mechanism while separating these untested rankings and cross-disease
  extrapolations.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: hepatic-oxidative-mitochondrial-core
    statement: >-
      Pathological hepatic mitochondrial copper accumulation is associated
      with structural injury, oxidative stress, impaired respiration and
      bioenergetics, and hepatocyte damage in Wilson disease and ATP7B models.
    disposition: RETAINED
    report_quote: >-
      The Oxidative-Mitochondrial Injury Model for Wilson Disease is robustly
      supported by converging evidence across meta-analytic, human clinical,
      animal model, and in vitro studies.
    rationale: >-
      PMID:41480142 synthesizes 13 hepatic human and animal studies and reports
      mitochondrial copper, morphology, oxidative, mtDNA, ATP, and respiratory
      complex abnormalities. PMID:24517326 describes early membrane copper
      accumulation and severe later structural/respiratory injury with ROS and
      membrane disintegration. Blinded pediatric biopsy review found
      mitochondrial abnormalities substantially more common in Wilson disease
      than NAFLD or autoimmune-hepatitis controls (PMID:35603480). These sources
      strongly support the scoped hepatic mechanism.
    citations:
      - PMID:41480142
      - PMID:24517326
      - PMID:35603480
  - claim_id: necessity-dominance-final-common-path
    statement: >-
      Oxidative-mitochondrial injury is necessary, dominant, and the final
      common pathway for copper-mediated hepatocyte death.
    disposition: REJECTED
    report_quote: >-
      oxidative-mitochondrial injury is the dominant but not sole mechanism of
      copper-mediated hepatocellular damage in Wilson Disease.
    rationale: >-
      The meta-analysis establishes recurring abnormalities, not formal
      necessity, comparative dominance, or mediation of all death. It pools
      heterogeneous hepatic endpoints across species and stages and does not
      compare causal fractions attributable to oxidative, lysosomal,
      proteotoxic, inflammatory, necrotic, apoptotic, cuproptotic, or
      ferroptotic routes. PMID:24517326 also reports that oxidative stress does
      not appear prominent early, before severe mitochondrial copper loading.
      "Canonical and well supported" is justified; "dominant/final common
      pathway" is not quantified.
    citations:
      - PMID:41480142
      - PMID:24517326
  - claim_id: human-ihc-causal-validation
    statement: >-
      Human immunohistochemistry directly validates oxidative mitochondrial
      causation in Wilson disease.
    disposition: QUALIFIED
    report_quote: >-
      directly validating the hypothesis at the protein level in human tissue.
    rationale: >-
      PMID:35477108 studied 54 treated, noncirrhotic patients and ten controls.
      COX2, COX4-1, TRX2, and PRDX1 expression was lower, supporting inner
      mitochondrial membrane injury and altered antioxidant proteins.
      8-OHdG was also lower, not higher, and 4-HNE overexpression was only
      borderline (P < 0.07). Cross-sectional expression cannot establish the
      report's ROS-to-lipid-peroxidation-to-mitochondrial-injury direction or
      distinguish primary disease from treatment and downstream effects.
    citations:
      - PMID:35477108
  - claim_id: nrf2-shared-gatekeeper
    statement: >-
      NRF2/GSH failure is the shared upstream gatekeeper that enables both
      oxidative injury and cuproptosis in Wilson disease.
    disposition: REJECTED
    report_quote: NRF2 as the Shared Upstream Gatekeeper
    rationale: >-
      PMID:41866691 is an acetaminophen-overdose drug-induced-liver-injury
      study. It reports that GSH supplementation and NRF2 activation reduced
      oxidative stress, copper accumulation, reported cuproptosis, and DILI.
      It does not study ATP7B deficiency, Wilson tissue, or Wilson genetic
      modifiers. Therapeutic pleiotropy in a different acute injury model
      cannot establish temporal upstream position, necessity, or a shared
      Wilson gatekeeper.
    citations:
      - PMID:41866691
  - claim_id: cuproptosis-active-in-wd
    statement: >-
      The defining cuproptosis sequence is an active cell-death pathway in
      Wilson disease.
    disposition: QUALIFIED
    report_quote: >-
      cuproptosis is not merely a theoretical possibility but an active cell
      death pathway in WD.
    rationale: >-
      PMID:41230834 supplies one ATP7B-null mouse and copper-treated HepG2
      study with selected protein changes, copper toxicity, ionophore
      enhancement, chelator rescue, and hub-gene perturbations. Its abstract
      does not report the defining lipoylated-protein aggregation and
      iron-sulfur-protein-loss sequence established in PMID:35298263. The
      Wilson findings are suggestive model evidence, not yet complete pathway
      confirmation or human evidence.
    citations:
      - PMID:35298263
      - PMID:41230834
  - claim_id: antioxidant-rescue-necessity
    statement: Antioxidant rescue shows that ROS is necessary but insufficient in Wilson hepatocytes.
    disposition: REJECTED
    report_quote: Add as QUALIFIES evidence showing ROS is necessary but not sufficient.
    rationale: >-
      PMID:12927909 exposed primary rainbow-trout hepatocytes to copper.
      Vitamin C reduced apoptosis but not LDH leakage or HSP70 expression,
      supporting at least two responses in that non-mammalian culture system.
      Inhibition of one outcome by one pleiotropic scavenger does not establish
      ROS necessity, and the experiment did not involve ATP7B deficiency or
      Wilson hepatocytes.
    citations:
      - PMID:12927909
  - claim_id: copper-removal-pathway-specificity
    statement: >-
      Methanobactin rescue establishes copper accumulation as an upstream
      driver in Wilson models but does not identify the downstream death route.
    disposition: QUALIFIED
    report_quote: >-
      validates copper as the direct causal agent in hepatocellular injury
    rationale: >-
      Mitochondrial copper depletion by methanobactin reverses impairment,
      liver injury, and mortality in ATP7B-deficient rats (PMID:27322060), and
      later ARBM-101 studies extend copper-removal efficacy. This is strong
      model evidence that excess copper is causal. A copper chelator removes
      the shared upstream exposure and therefore cannot by itself distinguish
      ROS/lipid peroxidation from direct membrane effects, cuproptosis, or
      other copper-dependent routes.
    citations:
      - PMID:27322060
      - PMID:41349253
  - claim_id: ontology-mappings
    statement: >-
      GO:0140623 represents ferroptosis, GO:0034383 represents lipid
      peroxidation, and CL:0000049 represents a megakaryoblast.
    disposition: REJECTED
    report_quote: ferroptosis (GO:0140623 or closest)
    rationale: >-
      In the repository's ontology adapters, GO:0140623 is type I pilus
      assembly, not ferroptosis (GO:0097707); GO:0034383 is low-density
      lipoprotein particle clearance, not lipid peroxidation; and CL:0000049 is
      common myeloid progenitor, not megakaryoblast. These curation leads must
      not be promoted.
  - claim_id: search-provenance
    statement: The assessment corpus comprised 130 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: "**Literature Reviewed:** 130 papers across 5 investigative iterations"
    rationale: >-
      The committed report and citation sidecar expose 30 unique PMIDs and no
      reproducible 130-paper screening table, query log, or exclusion record.
      The provider-internal number cannot be audited from the repository
      artifacts and should not be used as evidence strength.

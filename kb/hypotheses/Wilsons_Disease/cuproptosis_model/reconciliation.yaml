schema_version: '1.0.0'
assessor: codex
hypothesis_id: cuproptosis_model
reconciled_at: '2026-08-29T23:09:16Z'
providers:
- provider: biomni
  source_assessment: assessments/biomni-assessment-by-codex.yaml
  source_report: biomni.md
  contribution_summary: >-
    Direct retrieval of both GEO series and platform annotations, a documented
    representative-probe analysis, and a corrected byte-identical offline replay
    that resolves several expression-direction conflicts.
  limitations: >-
    An audit found that the original gene table overwrote full-platform BH values
    with a second selected-gene correction. The corrected bundle is reproducible
    but Biomni did not attest it, so the analysis is PARTIAL and the raw report's
    q-values are stale. Both inputs are small cross-sectional microarrays; the
    human disease contrast is also confounded by age and transplant-versus-resection sampling.
- provider: openscientist
  source_assessment: assessments/openscientist-assessment-by-codex.yaml
  source_report: openscientist.md
  contribution_summary: >-
    Broad mechanistic and literature synthesis plus reported analyses of the same
    human and mouse GEO accessions, including a useful shared FDX1 direction.
  limitations: >-
    Both reported computations are REPORTED_ONLY and UNVERIFIABLE. No inputs,
    code, environment, probe rule, or outputs establish execution; several gene
    directions or p-values fail a documented reanalysis, and GSE125637 is
    misclassified as RNA-seq.
overall_verdict: WEAKLY_SUPPORTED_UNRESOLVED
summary: >-
  The reports agree descriptively that FDX1/Fdx1 is lower in both deposited
  contrasts, but corrected full-platform testing does not establish adjusted
  significance. The corrected Biomni bundle contradicts OpenScientist's human
  DLD/DLAT directions and mouse Gls/Dlst results, while GEO metadata contradicts
  the RNA-seq label for GSE125637. Only the corrected Biomni bundle has
  inspectable direct computation and replay, and even that run is PARTIAL because
  Biomni did not attest the correction and its raw report retains stale q-values.
  Reuse of the same accessions is not independent computational convergence.
  These cross-sectional expression contrasts do not demonstrate cuproptosis,
  causality, or temporal disease stages.
artifacts:
- reconciliation.md

- claim_id: cross-sectional-interpretation-boundary
  claim_kind: EVIDENCE_QUALITY
  statement: >-
    These cross-sectional expression contrasts do not establish cuproptosis,
    causality, or a temporal Wilson-disease stage model.
  disposition: RETAINED
  rationale: >-
    Neither study is longitudinal and neither expression platform measures the
    defining lipoylated-protein aggregation, iron-sulfur-protein loss, cell
    death, or pathway-specific rescue. Directional gene expression cannot fill
    those causal and temporal gaps. In GSE197406, age and
    transplant-versus-resection sampling are also confounded with disease status.
  provider_support:
  - provider: biomni
    stance: CONCORDANT
    assessment_claim_ids:
    - cross-sectional-causal-limit
    report_quote: >-
      Cross-sectional expression contrasts do not, by themselves, establish
      cuproptosis, causality, or temporal disease stages.
    claim_origin: PROVIDER_INFERENCE
    rationale: >-
      Biomni explicitly states the appropriate interpretation boundary for its
      two expression contrasts.
  - provider: openscientist
    stance: PARTIAL

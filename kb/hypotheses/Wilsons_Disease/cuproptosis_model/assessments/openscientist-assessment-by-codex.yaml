claims:
  - claim_id: foundational-cuproptosis
    statement: >-
      Copper can cause a respiration-dependent regulated cell death through
      binding lipoylated TCA-cycle proteins, aggregation, and iron-sulfur
      protein loss in experimental human-cell systems.
    disposition: RETAINED
    report_quote: Cuproptosis Is a Mechanistically Distinct Cell Death Pathway
    rationale: >-
      PMID:35298263 directly established the distinctive biochemical mechanism
      in human cell lines and separated it experimentally from previously known
      death mechanisms. This is strong external mechanistic grounding, but it
      is not itself evidence that the complete pathway operates in Wilson
      disease tissue.
    citations:
      - PMID:35298263
  - claim_id: wd-specific-direct-evidence
    statement: >-
      One ATP7B-null mouse and copper-treated HepG2 study provides suggestive
      Wilson-context evidence, not a complete direct demonstration of
      cuproptosis.
    disposition: QUALIFIED
    report_quote: >-
      This is currently the only study that directly tests cuproptosis in a
      WD-specific model
    rationale: >-
      PMID:41230834 reports FDX1, DLST, DLAT, and LIAS upregulation, copper
      toxicity intensified by elesclomol, attenuation by tetrathiomolybdate,
      and effects of several hub-gene knockdowns. Its abstract does not report
      the defining lipoylated-DLAT aggregation, insoluble-protein increase,
      iron-sulfur-cluster protein loss, or rescue by a pathway-specific
      perturbation. Copper loading, ionophore enhancement, chelation rescue,
      LDH release, and abundance of pathway-associated proteins are compatible
      with cuproptosis but are not specific for it.
    citations:
      - PMID:41230834
      - PMID:35298263
  - claim_id: stage-dependent-hepatocyte-model
    statement: >-
      Cuproptosis predominates early in metabolically active Wilson
      hepatocytes and is suppressed during progression to cirrhosis.
    disposition: REJECTED
    report_quote: >-
      cuproptosis likely predominates in early-stage, metabolically active
      hepatocytes but becomes suppressed as disease progresses to cirrhosis
    rationale: >-
      Neither transcriptomic dataset is a longitudinal disease-stage series.
      GSE125637 contains four 3-month Atp7b-null and four wild-type mouse liver
      replicates in a metabolic study. GSE197406 contains seven transplant
      livers from patients with acute or chronic liver failure and eight
      resection controls. Comparing nominal gene-level p-values across
      different species, platforms, diets, and endpoints cannot establish a
      temporal peak, predominance, or suppression of a cell-death pathway.
    citations:
      - GEO:GSE125637
      - GEO:GSE197406
    analysis_ids:
      - openscientist-gse197406-expression
      - openscientist-gse125637-expression
  - claim_id: fdx1-post-translational-resolution
    statement: >-
      Post-translational FDX1 stabilization resolves the observed Wilson
      mRNA/protein discrepancy.
    disposition: REJECTED
    report_quote: The resolution lies in post-translational regulation.
    rationale: >-
      PMID:37277863 showed that sorafenib and erastin suppress
      mitochondrial-protease-mediated FDX1 degradation in primary liver-cancer
      cells exposed to copper ionophores. It did not study ATP7B deficiency or
      Wilson liver. Applying that cancer-cell mechanism to unmatched Wilson
      mRNA and protein observations is a testable explanation, not a
      demonstrated resolution.
    citations:
      - PMID:37277863
      - PMID:41230834
    analysis_ids:
      - openscientist-gse197406-expression
      - openscientist-gse125637-expression
  - claim_id: feed-forward-loop-evidence
    statement: >-
      Cross-study FDX1 mRNA/protein discordance is evidence that an integrated
      ROS-GSH-FDX1-cuproptosis feedback loop operates in Wilson disease.
    disposition: REJECTED
    report_quote: >-
      This discordance is itself evidence of the feed-forward amplification
      loop.
    rationale: >-
      Discordant assays from different specimens do not identify the cause of
      discordance and cannot demonstrate a multi-edge feedback circuit. The
      report joins a cancer-cell FDX1-degradation result to small Wilson
      transcriptomic datasets without measuring ROS, GSH, protease activity,
      FDX1 turnover, lipoylated aggregation, or feedback in one Wilson system.
      The loop is a useful proposed experiment, not evidence.
    citations:
      - PMID:37277863
      - GEO:GSE125637
      - GEO:GSE197406
    analysis_ids:
      - openscientist-gse197406-expression
      - openscientist-gse125637-expression
  - claim_id: human-transcriptomic-results
    statement: >-
      The reported GSE197406 selected-gene directions and effect estimates are
      a reproducible characterization of Wilson cirrhotic liver expression.
    disposition: REJECTED
    report_quote: >-
      Analysis of GSE197406 (7 WD cirrhotic livers vs. 8 normal controls,
      Affymetrix U133 Plus 2.0) revealed a paradoxical pattern
    rationale: >-
      An independent checksum-pinned reanalysis confirmed the sample counts and
      log2 matrix but did not reproduce several claims. Both annotated DLD probes
      decrease, whereas the report says DLD increases; all three DLAT probes
      increase, whereas the report says DLAT decreases. Some GLS and PDHA1 values
      resemble individual probes, but no probe-selection rule is given. Negative
      “FC” values also conflate a signed convention with ordinary fold change.
    citations:
      - GEO:GSE197406
    analysis_ids:
      - openscientist-gse197406-expression
  - claim_id: mouse-transcriptomic-results
    statement: >-
      GSE125637 shows the reported Fdx1, Gls, and Dlst decreases and nominal
      p-values in untreated Atp7b-null versus wild-type liver.
    disposition: REJECTED
    report_quote: >-
      Fdx1 DOWN (p=0.039), Gls DOWN (p=0.006), Dlst DOWN (p=0.008) in 3-month
      Atp7b⁻/⁻ mice
    rationale: >-
      Fdx1 direction reproduces, with Welch p=0.0426; the report's approximately
      0.039 value is obtained only with an equal-variance test that it does not
      disclose. Gls does not approach p=0.006 at gene level or for any annotated
      probe. Dlst is positive at gene level, and its highest-expression probe is
      strongly upregulated rather than downregulated. The report gives no rule
      that recovers its Gls or Dlst numbers.
    citations:
      - GEO:GSE125637
    analysis_ids:
      - openscientist-gse125637-expression
  - claim_id: fdx1-expression-direction
    statement: >-
      FDX1/Fdx1 expression is lower in the report's human Wilson and untreated
      Atp7b-null mouse liver contrasts.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Both early mouse WD (GSE125637: Fdx1 Log2FC = −0.227, p = 0.039) and late
      human WD cirrhotic liver (GSE197406: FDX1 FC = −1.12, p = 0.032) show
      significant FDX1 mRNA downregulation.
    rationale: >-
      Independent analyses reproduce the direction in both datasets, so this is
      a useful cross-provider comparison point. The provider's execution remains
      unverified, its effect conventions and probe rules are undisclosed, and its
      exact magnitudes and p-values do not match the prespecified Biomni analysis.
      Directional agreement is not evidence for a temporal stage model or for
      cuproptosis itself.
    citations:
      - GEO:GSE197406
      - GEO:GSE125637
    analysis_ids:
      - openscientist-gse197406-expression
      - openscientist-gse125637-expression
  - claim_id: mouse-platform-characterization
    statement: GSE125637 is mouse RNA-seq.
    disposition: REJECTED
    report_quote: >-
      Mouse RNA-seq vs. human microarray data are not directly comparable at the
      quantitative level
    rationale: >-
      GSE125637 is an Affymetrix Mouse Genome 430 2.0 Array (GPL1261) series.
      Cross-species and cohort differences remain important, but RNA-seq is the
      wrong assay description.
    citations:
      - GEO:GSE125637
    analysis_ids:
      - openscientist-gse125637-expression
  - claim_id: renal-fibrosis-extrapolation
    statement: >-
      Copper-DLAT binding in renal fibrosis is directly applicable evidence for
      Wilson liver fibrosis.
    disposition: REJECTED
    report_quote: directly applicable to WD liver fibrosis.
    rationale: >-
      PMID:39120696 shows mitochondrial copper binding lipoylated DLAT,
      reduced PDH activity, and rescue after copper reduction in fibrotic
      kidney models. It provides valuable non-cancer plausibility for a
      copper-DLAT interaction, but organ, injury context, cell state, and
      outcome differ. It is indirect evidence for Wilson liver and cannot
      substitute for pathway demonstration there.
    citations:
      - PMID:39120696
  - claim_id: exchangeable-copper-threshold
    statement: >-
      A cross-sectional exchangeable-copper severity association supports a
      threshold-dependent cuproptosis activation model.
    disposition: REJECTED
    report_quote: >-
      consistent with a threshold-dependent cuproptosis activation model.
    rationale: >-
      Exchangeable copper can index systemic copper dysregulation and severity,
      but the reported cohort did not measure lipoylated aggregation,
      iron-sulfur proteins, FDX1 dependence, or cell death. A dose-severity
      association is compatible with many copper-toxicity mechanisms and does
      not specifically support a cuproptosis threshold.
    citations:
      - PMID:41952595
  - claim_id: human-hallmark-gap
    statement: >-
      The defining cuproptosis hallmark has not been demonstrated in human
      Wilson disease liver tissue.
    disposition: RETAINED
    report_quote: >-
      No human WD tissue confirmation of lipoylated protein aggregation
    rationale: >-
      The report correctly preserves its most important limitation. The
      Wilson-specific study is model-organism and HepG2 work, while the
      foundational aggregation result is from other cell systems. This gap
      prevents treating cuproptosis as an established human Wilson mechanism.
    citations:
      - PMID:35298263
      - PMID:41230834
  - claim_id: ontology-mappings
    statement: >-
      GO:0018169 represents protein lipoylation and GO:0015037 represents FDX1
      reductase activity.
    disposition: REJECTED
    report_quote: Protein lipoylation (GO:0018169)
    rationale: >-
      The repository's GO adapter labels GO:0018169 as ribosomal S6-glutamic
      acid ligase activity; protein lipoylation is GO:0009249. GO:0015037 has no
      usable label in the configured GO release and should not be promoted as
      an FDX1 activity mapping. The proposed ontology section requires
      independent term validation.
  - claim_id: search-provenance
    statement: The assessment corpus comprised 96 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: "**Papers Reviewed:** 96"
    rationale: >-
      The committed report and citation sidecar expose 20 unique PMIDs and no
      reproducible 96-paper screening record. Provider-internal retrieval may
      account for the number, but the claim cannot be audited from the
      artifacts and should not increase confidence in the verdict.

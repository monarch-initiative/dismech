summary: >-
  Biomni directly retrieved and analyzed two GEO series matrices with their
  official platform annotations, and the corrected primary and offline replay
  tables are byte-identical. The provider report cannot receive a successful
  computational grade, however. An independent audit found that its gene-level
  output overwrote the promised full-platform probe-level BH values with a
  second BH correction over selected genes. Codex removed only that erroneous
  second correction and reran the locked pipeline, but two read-only Biomni
  attestation attempts failed closed: the first used incorrect saved-schema
  assumptions and the second execution wrapper returned no result. The single analysis is therefore
  PARTIAL but REPRODUCIBLE: the corrected bundle is inspectable and rerunnable,
  while the provider's report retains stale q-values and does not attest the
  correction. Corrected directions clarify several OpenScientist conflicts,
  but these small cross-sectional microarrays do not establish cuproptosis,
  causality, or a temporal Wilson-disease stage model.

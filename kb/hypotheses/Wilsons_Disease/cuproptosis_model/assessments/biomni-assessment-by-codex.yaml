analyses:
  - analysis_id: biomni-geo-expression-reanalysis
    status: PARTIAL
    auditability: REPRODUCIBLE
    method: >-
      Direct parsing of the two GEO series matrices and official GPL
      annotations; metadata-derived group assignment; per-probe two-sided
      Welch tests on the deposited log2-like expression scale; BH correction
      over every platform probe; pooled-SD Cohen d; and a primary gene result
      from the probe with the highest global mean before group labels, with all
      annotated probes retained for sensitivity review.
    comparison: >-
      GSE197406 Wilson cirrhotic liver (n=7) versus normal-control liver (n=8),
      and GSE125637 untreated Atp7b-null mouse liver (n=4) versus wild type
      (n=4), excluding the four zinc-treated Atp7b-null samples.
    input_data_source_ids:
      - biomni-gse197406
      - biomni-gpl570
      - biomni-gse125637
      - biomni-gpl1261
    software:
      - software_name: Biomni A1
        software_version: 0.0.8
      - software_name: deep-research-client
        software_version: 0.2.12
      - software_name: Python
        software_version: 3.12.9
      - software_name: requests
        software_version: 2.34.0
      - software_name: NumPy
        software_version: 2.4.4
      - software_name: pandas
        software_version: 3.0.3
      - software_name: SciPy
        software_version: 1.18.1
      - software_name: statsmodels
        software_version: 0.15.0
      - software_name: matplotlib
        software_version: 3.10.9
      - software_name: seaborn
        software_version: 0.13.2
      - software_name: PyYAML
        software_version: 6.0.3
    parameters:
      - transform=none for both deposited log2-like matrices
      - test=two-sided Welch t-test per probe
      - multiplicity=Benjamini-Hochberg over all platform probes
      - effect=case-minus-control log2 mean difference and pooled-SD Cohen d
      - representative_probe=highest all-sample global mean before group labels
      - sensitivity=retain every officially annotated probe per gene
      - gse197406_group_gate=7 Wilson versus 8 controls
      - gse125637_group_gate=4 untreated Atp7b-null versus 4 wild type
      - gse125637_exclusion=4 zinc-treated Atp7b-null samples
      - fallback_used=false
      - audit_correction=remove second BH correction over selected genes
    code_artifacts:
      - ../biomni_artifacts/analysis.py
      - ../biomni_artifacts/download_inputs.py
    environment_artifact: ../biomni_artifacts/environment.txt
    output_artifacts:
      - ../biomni_artifacts/MANIFEST.yaml
      - ../biomni_artifacts/preflight.json
      - ../biomni_artifacts/input_manifest.tsv
      - ../biomni_artifacts/sample_manifest.tsv
      - ../biomni_artifacts/probe_level_results.tsv
      - ../biomni_artifacts/gene_level_results.tsv
      - ../biomni_artifacts/analysis_summary.md
      - ../biomni_artifacts/methods.md
      - ../biomni_artifacts/fdx1_cross_dataset.png
      - ../biomni_artifacts/primary.stdout.txt
      - ../biomni_artifacts/primary.stderr.txt
      - ../biomni_artifacts/replay.stdout.txt
      - ../biomni_artifacts/replay.stderr.txt
      - ../biomni_artifacts/replay/sample_manifest.tsv
      - ../biomni_artifacts/replay/probe_level_results.tsv
      - ../biomni_artifacts/replay/gene_level_results.tsv
      - ../biomni_artifacts/replay/analysis_summary.md
      - ../biomni_artifacts/replay/methods.md
      - ../biomni_artifacts/replay/fdx1_cross_dataset.png
    status_reason: >-
      Biomni generated and executed the original bundle, but an independent
      audit found that build_gene_df applied a second BH correction over the
      selected gene table and overwrote the contractually required
      full-platform probe q-values. Codex removed only that second correction
      and cleanly reran the primary and offline replay analyses; the three key
      tables are byte-identical between those runs. Two subsequent read-only
      Biomni attestation attempts failed: the first on incorrect saved-schema
      assumptions and the second because its execution wrapper returned no
      result. Biomni therefore did not attest the corrected bundle. The
      assessment records PARTIAL rather
      than SUCCEEDED even though the corrected execution record is reproducible.
    limitations: >-
      The canonical Biomni report predates the audit correction and its displayed
      q-values are stale; only directions, effect estimates, and Welch p-values
      are unchanged. The corrected files are independently audited rather than
      provider-attested. Both studies are small, cross-sectional microarrays
      with different species and clinical contexts; the human contrast is also
      confounded by age and transplant-versus-resection sampling. Expression contrasts do not
      measure lipoylated-protein aggregation, iron-sulfur-protein loss, cell
      death, causality, or temporal disease stages. Results also depend on the
      documented annotation and representative-probe rule. The provider-generated
      downloader hardcodes the original local lake path; recovery instead relies
      on the stable URLs and checksums, while analysis.py accepts explicit paths.
claims:
  - claim_id: direct-analysis-no-fallback
    statement: >-
      The run directly analyzed its GEO inputs without substituting literature,
      another provider's output, or model knowledge as a computational fallback.
    disposition: QUALIFIED
    report_quote: "fallback_used: false, direct_analysis_completed: true"
    rationale: >-
      The committed manifest enumerates only the four GEO files as inputs and
      records fallback_used=false. The analysis is qualified because the raw
      report's success attestation applies to the pre-audit bundle; Biomni did
      not return an attestation for the narrowly corrected replay.
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: human-fdx1-direction
    statement: >-
      Under the prespecified representative-probe rule, FDX1 expression is lower
      in GSE197406 Wilson cirrhotic liver than in control liver.
    disposition: QUALIFIED
    report_quote: "| GSE197406 | FDX1 | -0.6315"
    rationale: >-
      The direction and log2 mean difference are unchanged by the audit fix and
      reproduce in the corrected offline replay. The corrected full-platform
      BH q-value is 0.0569, not the stale 0.03584 printed in the report, so this
      supports directional comparison only and not adjusted significance.
    citations:
      - GEO:GSE197406
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: mouse-fdx1-direction
    statement: >-
      Under the prespecified representative-probe rule, Fdx1 expression is lower
      in untreated Atp7b-null mouse liver than in wild-type liver.
    disposition: QUALIFIED
    report_quote: "| GSE125637 | Fdx1 | -0.1855"
    rationale: >-
      The corrected replay preserves the report's direction and log2 mean
      difference. Welch p=0.04257 is nominal, while the corrected full-platform
      BH q=0.1793; this does not substantiate adjusted significance or a temporal
      cuproptosis interpretation.
    citations:
      - GEO:GSE125637
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: human-dlat-direction
    statement: >-
      Under the prespecified representative-probe rule, DLAT expression is
      higher, not lower, in GSE197406 Wilson cirrhotic liver than in controls.
    disposition: QUALIFIED
    report_quote: "| GSE197406 | DLAT | 0.5144"
    rationale: >-
      The positive direction contradicts OpenScientist's reported decrease and
      is unchanged in the corrected replay. Welch p=0.03081 is nominal, but the
      corrected full-platform BH q=0.2173 does not support adjusted significance.
    citations:
      - GEO:GSE197406
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: human-dld-direction
    statement: >-
      Under the prespecified representative-probe rule, DLD has a small negative
      estimate rather than the increase reported by OpenScientist in GSE197406.
    disposition: QUALIFIED
    report_quote: "| GSE197406 | DLD | -0.0549"
    rationale: >-
      The corrected replay gives Welch p=0.6369 and full-platform BH q=0.8622,
      providing no support for a differential-expression claim. The stable
      negative direction nevertheless directly conflicts with the other
      provider's claimed increase.
    citations:
      - GEO:GSE197406
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: mouse-gls-result
    statement: >-
      The prespecified GSE125637 analysis does not reproduce OpenScientist's
      reported strong Gls decrease with p=0.006.
    disposition: QUALIFIED
    report_quote: "| GSE125637 | Gls | -0.1713"
    rationale: >-
      The point estimate is negative, but the corrected replay gives Welch
      p=0.3557 and full-platform BH q=0.5406. The observed data therefore do not
      reproduce the other provider's claimed p-value under the documented rule.
    citations:
      - GEO:GSE125637
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: mouse-dlst-result
    statement: >-
      The prespecified GSE125637 analysis finds Dlst higher, not lower, in
      untreated Atp7b-null mouse liver than in wild-type liver.
    disposition: QUALIFIED
    report_quote: "| GSE125637 | Dlst | 0.5607"
    rationale: >-
      The positive estimate contradicts OpenScientist's reported decrease. It
      reproduces after the correction with Welch p=2.449e-05 and corrected
      full-platform BH q=0.00601, but remains qualified because Biomni did not
      attest the corrected bundle.
    citations:
      - GEO:GSE125637
    analysis_ids:
      - biomni-geo-expression-reanalysis
  - claim_id: cross-sectional-causal-limit
    statement: >-
      These expression contrasts do not establish cuproptosis, causality, or a
      temporal Wilson-disease stage model.
    disposition: RETAINED
    report_quote: >-
      Cross-sectional expression contrasts do not, by themselves, establish
      cuproptosis, causality, or temporal disease stages.
    rationale: >-
      Neither dataset is longitudinal and neither assay measures the defining
      biochemical hallmarks of cuproptosis. This limitation is unaffected by
      the q-value correction and is the appropriate boundary for interpreting
      both the Biomni results and the OpenScientist stage hypothesis.
    citations:
      - GEO:GSE197406
      - GEO:GSE125637

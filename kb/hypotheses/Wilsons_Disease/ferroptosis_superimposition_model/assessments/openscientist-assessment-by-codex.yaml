hypothesis_id: ferroptosis_superimposition_model
assessed_at: "2026-07-31T03:20:24Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  Iron can materially amplify hepatic injury in the iron-loaded LEC rat, and a
  recent Wilson-model study implicates ACSL4/LPCAT3/ALOX15-linked phospholipid
  peroxidation. Those findings support an emerging iron/ferroptosis modifier
  model. They do not establish a general human Wilson mechanism. The report
  incorrectly describes 197 high-liver-copper specimens as 197 confirmed
  Wilson patients and converts the resulting 13 possible iron-overload cases
  into a disease prevalence estimate. It also treats small human oxidative
  stress data as universal ferroptosis prerequisites and model-specific iron
  interventions as proof that iron is necessary for the most severe Wilson
  outcomes. The report's own decisive caveat is correct: without
  ferroptosis-specific rescue, GPX4 evidence, and iron-stratified human
  outcomes, true ferroptosis cannot yet be separated from copper-driven or
  iron-amplified nonspecific oxidative damage.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: lec-rat-iron-modifier
    statement: >-
      Lowering iron protects iron-loaded LEC rats from fulminant hepatitis and
      hepatocarcinogenesis without lowering hepatic copper.
    disposition: RETAINED
    report_quote: >-
      Iron-Deficient Diet Completely Prevents Fulminant Hepatitis and Liver
      Cancer in LEC Rats
    rationale: >-
      PMID:8770863 reports no fulminant-hepatitis deaths and no liver cancer in
      the iron-deficient group versus substantial mortality and universal
      cancer in regular-diet controls. PMID:16737843 independently reports
      lower mortality and malondialdehyde after phlebotomy with no hepatic
      copper difference. These interventions strongly support iron as a
      severity modifier in this unusually copper-and-iron-loaded rat strain.
    citations:
      - PMID:8770863
      - PMID:16737843
  - claim_id: human-necessity-extrapolation
    statement: >-
      Iron is a necessary cofactor for fulminant hepatitis and hepatocellular
      carcinoma across Wilson disease.
    disposition: REJECTED
    report_quote: >-
      iron is a necessary co-factor for the most severe WD outcomes
    rationale: >-
      The intervention evidence is from LEC rats, whose spontaneous hemolysis
      produces marked hepatic iron loading. It supports necessity under the
      tested model and diet conditions, not across human Wilson disease,
      different ATP7B models, neurological disease, or all severe outcomes.
      The report later acknowledges that Atp7b-null mice did not have a
      significant hepatic-iron increase (PMID:20594231), which further limits
      generalization.
    citations:
      - PMID:8770863
      - PMID:16737843
      - PMID:20594231
  - claim_id: human-iron-overload-prevalence
    statement: Eight percent of a 197-patient Wilson cohort had hepatic iron overload.
    disposition: REJECTED
    report_quote: In a study of 197 WD patients
    rationale: >-
      PMID:39733327 identified 197 specimens with liver copper above 250
      micrograms per gram and describes them as patients suspected to have
      Wilson disease; only a ten-person subpopulation was clinically confirmed.
      Thirteen people aged at least 13 had hepatic iron index above 1.0, which
      the paper says "may indicate" secondary iron overload. The design does
      not estimate an 8% prevalence among confirmed Wilson patients, and the
      absence of a copper-iron correlation does not establish an independent
      cause.
    citations:
      - PMID:39733327
  - claim_id: universal-human-prerequisites
    statement: >-
      GSH depletion and lipid peroxidation are universal symptomatic-human
      Wilson ferroptosis prerequisites.
    disposition: REJECTED
    report_quote: >-
      GSH depletion and lipid peroxidation (ferroptosis hallmarks) are
      universally present in symptomatic WD liver
    rationale: >-
      PMID:16940238 studied only 13 affected liver specimens plus two
      asymptomatic carriers. It found reduced GSH/GSSG and increased TBARS in
      those affected specimens, while GPx activity was reduced only in the five
      fulminant cases. These are important oxidative-stress observations, but
      the small selected series cannot establish population universality and
      did not measure GPX4 or ferroptotic cell death. GSH and TBARS are not
      specific to ferroptosis.
    citations:
      - PMID:16940238
  - claim_id: acsl4-pathway-evidence
    statement: >-
      A single Wilson-model quercetin study provides direct but incomplete
      evidence for an ACSL4/LPCAT3/ALOX15-linked ferroptotic process.
    disposition: QUALIFIED
    report_quote: >-
      The specific ferroptosis effector pathway (ACSL4/LPCAT3/ALOX15) has been
      validated in WD animal models.
    rationale: >-
      PMID:41966025 reports in-vivo and in-vitro Wilson models, lipid
      peroxidation and iron/antioxidant readouts, direct quercetin-ACSL4
      interaction, and ACSL4-overexpression experiments. That is meaningful
      pathway evidence. It remains one multi-target intervention study and does
      not report ferrostatin/liproxstatin rescue or GPX4 loss in the abstract.
      It supports an emerging model, not replicated validation or the specific
      human secondary-iron-superimposition chain.
    citations:
      - PMID:41966025
  - claim_id: ceruloplasmin-iron-bridge
    statement: >-
      Reduced ceruloplasmin ferroxidase activity can impair hepatic iron
      release in some ATP7B mouse models, but the bridge is context-dependent.
    disposition: QUALIFIED
    report_quote: >-
      A mechanistic bridge linking ATP7B loss to hepatic iron retention through
      ceruloplasmin ferroxidase deficiency has been established in mouse models.
    rationale: >-
      Six-month tx-J mice in PMID:31011744 had decreased iron in plasma,
      hepatocyte/macrophage iron retention, and decreased membrane
      ceruloplasmin despite high ferroportin, supporting the proposed bridge in
      that model. Atp7b-null mice in PMID:20594231 had very low ceruloplasmin
      oxidase activity but only a nonsignificant hepatic-iron increase. The
      report correctly mentions the conflict later; "established in mouse
      models" should be narrowed to one model and conditions.
    citations:
      - PMID:31011744
      - PMID:20594231
  - claim_id: iron-specific-ferroptosis-gap
    statement: >-
      Existing evidence does not distinguish true iron-dependent ferroptosis
      from copper-driven or iron-amplified nonspecific oxidative injury in
      Wilson disease.
    disposition: RETAINED
    report_quote: >-
      whether the iron-dependent component constitutes true ferroptosis versus
      non-specific iron-catalyzed oxidative damage remains unresolved.
    rationale: >-
      The older LEC experiments predate modern ferroptosis assays, the human
      studies measure nonspecific oxidative endpoints, and copper itself is a
      strong lipid and thiol oxidant in liver fractions (PMID:20603110). The
      quercetin study strengthens the case but does not fill the report's
      stated ferroptosis-specific rescue and human-validation gaps.
    citations:
      - PMID:20603110
      - PMID:41966025
  - claim_id: automatic-curation-edge
    statement: >-
      The ACSL4/LPCAT3/ALOX15 edge is ready for promotion into the disease YAML
      from this report.
    disposition: QUALIFIED
    report_quote: >-
      Add the ACSL4/LPCAT3/ALOX15 ferroptosis pathway as an EMERGING
      mechanistic edge
    rationale: >-
      PMID:41966025 is a strong curation lead, but a provider report and this
      context-only assessment do not themselves establish a disease-YAML edge.
      Promotion requires checking the complete primary paper, choosing the
      precise model scope and causal relation, fetching its reference through
      the normal cache workflow, and validating an exact evidence snippet.
    citations:
      - PMID:41966025
  - claim_id: search-provenance
    statement: The assessment corpus comprised 78 reviewed papers.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      After systematic evaluation of 78 papers across 5 investigative
      iterations
    rationale: >-
      The committed report and citation sidecar expose 24 unique PMIDs and no
      reproducible 78-paper search and screening record. The larger
      provider-internal count cannot be audited from the repository artifact.

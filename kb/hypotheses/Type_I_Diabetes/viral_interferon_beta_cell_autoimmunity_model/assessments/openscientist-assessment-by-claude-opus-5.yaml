schema_version: "1.0"
provider: openscientist
assessor: claude-opus-5
source_report: ../openscientist.md
hypothesis_id: viral_interferon_beta_cell_autoimmunity_model
assessed_at: "2026-09-02T00:00:00Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report's central claim, that viral exposure in a genetically susceptible
  host drives islet interferon signaling which in turn raises beta-cell
  immunogenicity, is well supported at the interferon node and moderately
  supported at the viral node, and the report's own verdict of partially
  supported is the right one. Its most valuable contribution to the knowledge
  base is not the thesis, which came from the seed, but four things the entry
  did not have: iatrogenic interferon-alpha as human proof that sustained
  interferon alone is sufficient, two positive phase 2 trials that test the
  viral and interferon arms interventionally, human tissue evidence that
  enteroviral capsid protein and HLA class I hyperexpression travel together in
  islets, and the observation that the same interferon exposure induces
  protective checkpoint ligands alongside the destructive programs. Three
  claims do not survive source checking. The report reads a co-expressed rat
  islet signature as a timed four-step sequence and calls that the strongest
  evidence for directionality. It attaches an odds ratio of 11.60 to the IFIH1
  risk allele when that figure belongs to a different comparison in the same
  paper and the allele's actual odds ratio is 3.07. It cites a mouse
  interferon-gamma study as the source for an interferon-alpha to PD-L1 edge.
  The report also describes an IFNAR1 knockout as preventing virus-induced
  diabetes when the cited paper reports delay and reduction. No committed
  artifact bundle accompanies the run, and the figures the report references
  were never produced, so every claimed search and count is unverifiable.
claims:
  - claim_id: viral-interferon-core-model
    statement: >-
      Viral exposure in a genetically susceptible host induces islet interferon
      signaling that raises beta-cell antigen presentation and chemokine output,
      bridging innate antiviral responses to adaptive beta-cell autoimmunity;
      supported at every node but short of proven causation.
    disposition: RETAINED
    report_quote: >-
      As of mid-2026, this model is **partially supported** with converging
      evidence across all major nodes of the proposed causal chain
    rationale: >-
      This restates the seed hypothesis, so it is not new support, but the
      report's grading of it is defensible and matches what the primary sources
      show. The interferon node carries genetic, pharmacological, iatrogenic and
      transcriptomic support; the viral node carries epidemiological and tissue
      support but no completed phase 3 antiviral trial. The report's own caveat,
      that the model falls short of supported status for want of that trial, is
      accurate and is why the knowledge base keeps the status at EMERGING.
    citations:
      - PMID:38409439
      - PMID:25574096
      - PMID:37390839
  - claim_id: enterovirus-epidemiologic-association
    statement: >-
      Meta-analysis of controlled observational studies detecting enteroviral
      nucleic acid or protein finds a significant association with islet
      autoimmunity and a stronger one with clinical type 1 diabetes.
    disposition: RETAINED
    report_quote: >-
      The most comprehensive meta-analysis by Isaacs et al. (2023) analyzed 56
      studies (12,077 participants) and found an odds ratio of 2.1 (95% CI
      1.3–3.3) for the association between enteroviruses and islet autoimmunity
    rationale: >-
      Verified against the source. The pooled odds ratio of 2.1 for islet
      autoimmunity and 8.0 for type 1 diabetes are both reported, from 12,077
      participants. The report's phrasing conflates the 60 eligible studies with
      the 56 that entered the meta-analysis, a small slip that does not change
      the figures. Heterogeneity is substantial and the designs are
      observational, which the report acknowledges. Curated onto the hypothesis
      entry with the heterogeneity caveat stated in the explanation.
    citations:
      - PMID:37390839
  - claim_id: islet-enterovirus-persistence
    statement: >-
      Enteroviral RNA in islets of people with recent-onset disease is present
      at very low abundance and cannot be recovered as replication-competent
      virus, consistent with a persisting low-grade rather than acute lytic
      infection.
    disposition: RETAINED
    report_quote: >-
      This finding supports a **persistent low-grade or defective infection
      model** rather than acute lytic infection
    rationale: >-
      Both cited sources support this. The DiViD laparoscopic biopsy study found
      all six living patients enterovirus-positive by RT-qPCR while no
      islet-resident virus could be isolated in permissive cell lines, and the
      authors themselves read this as a slowly replicating persisting virus. The
      nPOD collaborative survey found RT-PCR positive but direct RNA-seq
      negative, and concluded that donors with the disease and donors with islet
      autoantibodies may carry a low-grade pancreatic enterovirus infection.
      This is a mechanism step the disorder entry lacked, so it was curated as a
      new pathophysiology node.
    citations:
      - PMID:34390364
      - PMID:39314969
  - claim_id: vp1-hlai-tissue-colocalization
    statement: >-
      Enteroviral capsid protein positivity in islet cells is associated with
      islet HLA class I hyperexpression across a large organ-donor series,
      including donors in the autoantibody-positive preclinical stage.
    disposition: RETAINED
    report_quote: >-
      Among those assessed for both markers, 73.7% showed both VP1
      immunopositivity and HLA-I hyperexpression
    rationale: >-
      Verified in the 188-donor nPOD study. The 73.7% figure is the proportion
      of donors who have the disease and retain insulin-containing islets, not
      of all donors with the disease, and the report's Executive Judgment
      loosely renders it as a percentage of islets. Across all donor groups
      combined, HLA class I hyperexpression was 45.8% in capsid-positive donors
      versus 16% in capsid-negative ones. The authors state explicitly that
      tissue association cannot demonstrate causality, so the curated edge from
      the persistent infection node to the interferon node carries
      directness INDIRECT.
    citations:
      - PMID:40090995
  - claim_id: iatrogenic-interferon-causation
    statement: >-
      Sustained exogenous interferon-alpha given for chronic hepatitis C
      precipitates autoimmune, insulin-requiring diabetes at roughly ten to
      eighteen times background rate, without any islet viral infection being
      required.
    disposition: RETAINED
    report_quote: >-
      This constitutes **causal human evidence** that exogenous IFN-α is
      sufficient to trigger autoimmune diabetes in susceptible individuals,
      bypassing the need for any enteroviral infection
    rationale: >-
      The strongest human evidence the report surfaced, and absent from the
      entry before this pass. A review of 107 published cases reports the 10 to
      18 fold excess risk, a median onset of four to six months into treatment,
      a fulminant course with high-titre islet autoantibodies, and permanent
      insulin dependence in 105 of 107. The design is a case review rather than
      a controlled cohort, so the risk multiple is an estimate against general
      population rates; the sufficiency claim, however, is carried by the
      temporal pattern and does not depend on the precise multiple. Curated onto
      the interferon node.
    citations:
      - PMID:25574096
  - claim_id: ifnar1-necessity-overstated
    statement: >-
      Type I interferon receptor signaling is required for virus-induced
      autoimmune diabetes, such that knocking out IFNAR1 prevents the disease.
    disposition: QUALIFIED
    report_quote: >-
      This provides **direct genetic proof** that type I IFN receptor signaling
      is required for virus-induced autoimmune diabetes
    rationale: >-
      The experiment is real and important, but the wording overshoots it. The
      cited paper reports that IFNAR1 deficiency significantly delayed the onset
      and frequency of diabetes and greatly reduced insulitis intensity after
      poly I:C, and that Kilham rat virus-induced diabetes was diminished. Delay
      and reduction are not prevention, and the report's own section heading
      says prevents. Requirement in the strict sense is not shown. Curated with
      the delay-and-reduction wording preserved and the overstatement named in
      the evidence explanation.
    citations:
      - PMID:27999109
  - claim_id: antiviral-trial-interventional-support
    statement: >-
      Six months of pleconaril plus ribavirin in children with new-onset disease
      preserved stimulated C-peptide at twelve months, the first interventional
      test of the viral arm.
    disposition: RETAINED
    report_quote: >-
      The primary endpoint was met: C-peptide AUC was significantly higher in
      the treatment group at 12 months
    rationale: >-
      Verified. The DiViD Intervention trial randomised 96 children, met its
      primary endpoint with an average marginal effect of 0.057 and p of 0.037,
      and reports a relative C-peptide decline of 11% on treatment against 24%
      on placebo. This is phase 2 with a modest effect and no replication, and
      the report is candid about that. Curated onto the hypothesis entry with
      the phase and effect size stated.
    citations:
      - PMID:37789144
  - claim_id: jak-inhibition-interventional-support
    statement: >-
      Baricitinib, which blocks the kinases transducing interferon receptor
      signals, preserved stimulated C-peptide over 48 weeks in new-onset
      disease, giving pharmacological support to the interferon node.
    disposition: RETAINED
    report_quote: >-
      By blocking JAK1/JAK2 — the kinases that transduce IFN receptor signals —
      baricitinib directly tests the IFN signaling node of the causal chain.
    rationale: >-
      The BANDIT trial figures check out: median stimulated C-peptide 0.65
      against 0.43 nmol per litre per minute at week 48 in 91 patients, p equal
      to 0.001, with a lower daily insulin dose. The word directly is doing more
      work than the trial supports, since JAK1 and JAK2 transduce many cytokine
      receptors besides the interferon receptors, so the trial supports the
      pathway without isolating type I interferon. Curated with that limit
      stated in the explanation.
    citations:
      - PMID:38055252
  - claim_id: islet-temporal-ordering-overread
    statement: >-
      Single-cell transcriptomics of prediabetic rat islets documents a
      four-step temporal sequence in which interferon-stimulated genes rise
      first, then CXCL10, then MHC class I, then ubiquitin-proteasome genes,
      establishing the direction of the intra-islet causal chain.
    disposition: QUALIFIED
    report_quote: >-
      Single-cell RNA-seq of prediabetic rat islets revealed a temporal
      progression: beta and alpha cell subsets first upregulate IFN-stimulated
      genes, then CXCL10 chemokine, then MHC class I, then ubiquitin-proteasome
      system genes.
    rationale: >-
      The paper reports one co-expressed stress signature whose member
      transcripts, listed as interferon-stimulated genes, chemokines including
      Cxcl10, MHC class I and ubiquitin-proteasome genes, rise together over
      time in an increasing fraction of beta and alpha cells. The report reads
      that list as an ordering, then calls the ordering the strongest evidence
      for directionality. Two further limits are not mentioned: this is a rat
      model, and the inducing virus does not itself infect beta cells, so the
      model does not demonstrate a direct viral-to-islet interferon step. The
      real finding, that Cxcl10-positive islet cells are spatially associated
      with CD8-positive T cell infiltration, is genuine but is already
      represented in the entry as a named intermediate mechanism. Not curated as
      new content.
    citations:
      - PMID:36346618
  - claim_id: ifih1-enterovirus-odds-ratio-misattributed
    statement: >-
      Carriers of the IFIH1 rs1990760 risk allele are more likely to test
      positive for enterovirus RNA, with an odds ratio of 11.60.
    disposition: REJECTED
    report_quote: >-
      This risk allele correlates with enhanced enterovirus detection in blood:
      carriers are more likely to test positive for EV RNA (OR 11.60, 95% CI
      1.89–126.90, p = 0.0065 for autoimmunity)
    rationale: >-
      The number belongs to a different comparison in the same paper. The odds
      ratio of 11.60 is for children with autoimmunity being more likely to test
      positive for enterovirus RNA than children without it. The odds ratio for
      the IFIH1 predisposing allele is 3.07, with a 95% confidence interval of
      1.02 to 8.58 and p of 0.045, which is materially weaker and nearly touches
      unity. The same paper also reports no correlation between the IFIH1
      variant and enteroviral capsid protein in donor islets, which the report
      omits. The directional claim survives; the statistic attached to it does
      not. Curated on the IFIH1 gene entry with the correct odds ratio and the
      null islet result carried alongside as a REFUTE item.
    citations:
      - PMID:35867130
  - claim_id: ifih1-gain-of-function-cell-line-only
    statement: >-
      The IFIH1 rs1990760 risk variant raises basal type I interferon signaling
      and interferon-stimulated gene expression.
    disposition: QUALIFIED
    report_quote: >-
      The IFIH1 rs1990760 risk variant (A946T) increases basal type I IFN
      signaling and IFN-stimulated gene expression
    rationale: >-
      True only in the artificial system. The cited paper found elevated basal
      interferon signaling in cell lines overexpressing the risk variant and
      increased ATPase activity for the recombinant protein, but observed no
      significant change in type I interferon expression or downstream gene
      induction in primary blood mononuclear cells from risk-allele carriers
      infected with coxsackievirus B3. The paper's own conclusion is that a
      deeper understanding of cellular context is needed. The report reports
      only the positive half. Curated with directness INDIRECT and the negative
      primary-cell result stated in the explanation.
    citations:
      - PMID:39373578
  - claim_id: interferon-balance-refinement
    statement: >-
      Interferon exposure induces protective programs on beta cells, notably
      PD-L1 and HLA-E, alongside the pro-autoimmune MHC class I and chemokine
      programs, so outcome depends on which arm predominates.
    disposition: RETAINED
    report_quote: >-
      IFN signaling induces both pro-autoimmune and protective programs
      simultaneously
    rationale: >-
      This is the report's most useful refinement and it is genuinely absent
      from the entry, which previously modelled the interferon node as
      unidirectionally destructive. The multi-omics study of human beta cells
      states directly that beta cells also upregulate the checkpoint proteins
      PDL1 and HLA-E, which may exert a protective role. The clinical
      counterpart holds too: blocking PD-1 or PD-L1 pharmacologically produces
      insulin-dependent diabetes in close to 1% of treated cancer patients.
      What remains unknown is where the crossover between the two arms sits,
      which is why this was curated both as node content and as an open
      knowledge gap rather than as a settled mechanism.
    citations:
      - PMID:32444635
      - PMID:29937434
  - claim_id: pdl1-edge-citation-mismatch
    statement: >-
      An interferon-alpha to PD-L1 upregulation to autoimmune restraint edge is
      supported by the two references the report attaches to it.
    disposition: REJECTED
    report_quote: >-
      **Edge**: `IFN_alpha → PD-L1_upregulation → autoimmune_restraint`
    rationale: >-
      One of the two attached references does not support an interferon-alpha
      edge. It is a mouse islet study of interferon-gamma, the type II
      interferon, showing that PD-L1 induction on endocrine cells depends on
      position within the islet. Wrong interferon type and wrong species for the
      edge as written. The other attached reference, the checkpoint inhibitor
      case series, establishes that PD-1 and PD-L1 blockade causes diabetes in
      people but measures nothing about beta-cell PD-L1 induction by interferon.
      The correct primary source for the edge is the human beta-cell multi-omics
      study, which is what was curated instead.
    citations:
      - PMID:36611907
      - PMID:32444635
  - claim_id: cxcl10-cxcr3-redundancy
    statement: >-
      Blocking the CXCL10-CXCR3 chemokine axis does not halt disease in a virally
      induced mouse model, so chemokine recruitment to islets is functionally
      redundant rather than a required step.
    disposition: RETAINED
    report_quote: >-
      The strongest qualifications are chemokine redundancy (CXCL10/CXCR3
      blockade insufficient in mouse models
    rationale: >-
      Verified, and the only genuine counter-evidence the report surfaced. The
      cited study set out to re-evaluate whether the axis is a pivotal node
      given that both ligand and receptor are abundant in human pancreata, and
      concluded that its data challenge the notion that specific blockade halts
      onset and progression. The disorder entry names CXCL10-mediated lymphocyte
      recruitment as an intermediate mechanism on the interferon to autoimmune
      destruction edge without qualification, so this was curated as a REFUTE
      item on that edge, where a reader of the causal chain will meet it.
    citations:
      - PMID:23434930
  - claim_id: tyk2-beta-cell-node
    statement: >-
      TYK2 loss-of-function variants protect against the disease, and silencing
      TYK2 in human beta cells blunts the interferon response, chemokine output
      and MHC class I induction that follow a viral RNA mimic.
    disposition: RETAINED
    report_quote: >-
      TYK2 loss-of-function polymorphisms protect against T1D; TYK2 silencing
      prevents viral mimic–induced MHC-I expression and beta-cell apoptosis
    rationale: >-
      Verified. Silenced human beta cells exposed to a double-stranded RNA mimic
      showed less type I interferon pathway activation, lower interferon-alpha
      and CXCL10 production, reduced MHC class I, and protection from apoptosis.
      This puts a named susceptibility gene squarely inside the beta cell arm of
      the model. The disorder entry listed TYK2 with an empty evidence block, so
      this was curated there.
    citations:
      - PMID:26239055
  - claim_id: retain-emerging-status
    statement: >-
      The hypothesis status should remain EMERGING, with an upgrade contingent
      on a positive phase 3 antiviral trial or a coxsackievirus B vaccine
      preventing islet autoimmunity.
    disposition: RETAINED
    report_quote: >-
      **Recommended**: Retain EMERGING with annotation
    rationale: >-
      Agreed, and no status field was changed. Two positive phase 2 trials, one
      at each end of the chain, are a real strengthening, but neither has been
      replicated and the vaccine programme has only phase 1 safety and
      immunogenicity data. The report's own scope caveat also argues for
      restraint: it says the model is strongest for fulminant and rapid-onset
      childhood disease and that relevance to slow-onset adult autoimmune
      diabetes is unestablished. The hypothesis notes were extended to record
      the interventional results and the two source misreadings found here.
    citations:
      - PMID:37789144
      - PMID:38055252
      - PMID:38369573

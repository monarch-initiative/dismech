analyses:
  - analysis_id: systematic-literature-screen
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      Reported five-iteration systematic screen of 107 papers reduced to 12
      confirmed findings, rendered as a 26-row evidence matrix and a
      four-tier classification of 21 mechanistic claims.
    input_data_source_ids:
      - pubmed-literature-search
    status_reason: >-
      No code, query log, intermediate result set, environment record, or
      committed output accompanies the run. The evidence matrix and tier
      classification exist only as prose tables inside the report.
    limitations: >-
      The assessor re-derived every consequential row from the cached primary
      literature rather than relying on the matrix, which is how the three
      source misreadings recorded in the claims were found. Three of the 26
      matrix rows carry inaccuracies: the IFIH1 odds ratio, the rat islet
      temporal ordering, and the IFNAR1 prevention wording.
  - analysis_id: report-figure-generation
    status: REPORTED_ONLY
    auditability: UNVERIFIABLE
    method: >-
      The report emits four figure directives for a mechanistic causal chain
      diagram, a balance model diagram, an evidence status classification, and a
      knowledge gap table.
    status_reason: >-
      The directives remain as unexpanded placeholders in the committed report
      and no image files exist in the hypothesis directory, so no figure was
      produced and nothing records whether generation was attempted. Nothing
      depends on them, since the same content appears in the report's ASCII
      chain and prose tables.

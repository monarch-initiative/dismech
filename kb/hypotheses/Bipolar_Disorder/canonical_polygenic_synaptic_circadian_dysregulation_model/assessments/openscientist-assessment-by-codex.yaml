hypothesis_id: canonical_polygenic_synaptic_circadian_dysregulation_model
assessed_at: "2026-07-31T17:46:43Z"
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The broad polygenic and synaptic framework is supported, and selected
  calcium, circadian, neuronal-excitability, and treatment-response findings
  are useful mechanistic leads. The report does not establish that these
  components form one causal chain producing episodic switching, however, and
  several of its headline qualifications are materially unreliable. It missed
  the 2025 PGC4 multi-ancestry GWAS, overinterpreted a two-patient
  calcium-channel-blocker comparison, missed a terminated modern isradipine trial,
  inferred psychotic-BD-I specificity from a transcriptomic comparison that
  did not test the model, misread a state-sensitive dopamine-transporter result
  as a trait marker, misattributed human circadian genotypes to a fibroblast
  study, and proposed two incorrect UBERON mappings. Its stated paper, finding,
  evidence-matrix, and visualization totals are also not supported by the
  delivered artifacts.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: integrative-framework
    statement: >-
      The polygenic, synaptic, calcium, circadian, mitochondrial, and
      fronto-limbic components form a valid integrative framework for bipolar
      disorder.
    disposition: QUALIFIED
    report_quote: >-
      The model is best regarded as a valid integrative framework whose
      strongest evidence comes from GWAS, iPSC functional studies, causal
      animal models, and pharmacological convergence
    rationale: >-
      Large human genetic studies support a highly polygenic architecture and
      synaptic neuronal biology, while induced-neuron and mouse experiments
      support selected component mechanisms. No cited experiment establishes
      that all named components converge in one disease-specific causal chain,
      and the report itself identifies the trigger for switching between manic
      and depressive states as unknown. The framework is therefore useful but
      only partially supported at its integrative and episodic-causation level.
    citations:
      - PMID:39843750
      - PMID:34002096
      - PMID:25403839
      - PMID:26524527
      - PMID:20591414
  - claim_id: pgc3-synaptic-calcium-enrichment
    statement: >-
      The PGC3 GWAS identified 64 bipolar-disorder loci and enrichment in
      synaptic-signaling genes and genes encoding calcium-channel-blocker
      targets.
    disposition: RETAINED
    report_quote: >-
      The PGC3 GWAS of 41,917 BD cases and 371,549 controls identified 64
      associated genomic loci.
    rationale: >-
      PMID:34002096 reports the stated European-ancestry sample, 64 loci,
      synaptic-signaling enrichment, and enrichment among genes encoding
      calcium-channel-blocker targets. This remains valid evidence for the
      pathway-level model even though it was no longer the largest BD GWAS at
      the report's May 2026 evaluation date.
    citations:
      - PMID:34002096
  - claim_id: largest-gwas
    statement: >-
      PMID:34002096 was the largest bipolar-disorder GWAS available in May
      2026.
    disposition: REJECTED
    report_quote: >-
      the largest BD GWAS identifying 64 loci enriched in synaptic signaling
      and calcium channel blocker targets
    rationale: >-
      The report missed the PGC4 study published in January 2025. That
      multi-ancestry analysis included 158,036 cases and 2.8 million controls
      and identified 298 genome-wide-significant loci. PMID:34002096 remains a
      useful earlier study, but calling it the largest in a May 2026 report is
      false and omits a major update to the genetic architecture.
    citations:
      - PMID:34002096
      - PMID:39843750
  - claim_id: multi-ancestry-gwas-absence
    statement: >-
      No large-scale multi-ancestry bipolar-disorder GWAS had been found by May
      2026.
    disposition: REJECTED
    report_quote: >-
      no large-scale multi-ancestry BD GWAS found.
    rationale: >-
      PMID:39843750 is explicitly a multi-ancestry meta-analysis spanning
      European, East Asian, African American, and Latino participants. It was
      published more than a year before this report and is substantially larger
      than PGC3. Earlier European-Asian trans-ancestry studies also existed, so
      the categorical source-absence claim is not defensible.
    citations:
      - PMID:39843750
      - PMID:33263727
      - PMID:22182935
  - claim_id: cacna1c-risk-variant-function
    statement: >-
      The CACNA1C rs1006737 risk genotype is associated with increased CACNA1C
      expression and L-type calcium-current density in induced human neurons.
    disposition: RETAINED
    report_quote: >-
      induced human neurons from over 20 individuals carrying the homozygous
      risk genotype at rs1006737 showed increased L-type VGCC current density
      and increased CACNA1C mRNA expression compared to non-risk genotypes
    rationale: >-
      This accurately summarizes PMID:25403839. The experiment is direct for
      the cellular genotype-to-channel phenotype. Its psychiatric-risk
      haplotype is transdiagnostic, and the induced neurons do not by themselves
      establish a bipolar-specific circuit or mood-switching mechanism.
    citations:
      - PMID:25403839
  - claim_id: cacna1c-knockout-direction
    statement: >-
      Forebrain-glutamatergic Cacna1c knockout provides convergent causal animal
      evidence for the human CACNA1C risk mechanism.
    disposition: QUALIFIED
    report_quote: >-
      Conditional knockout of Cacna1c in forebrain glutamatergic neurons in mice
      further altered behavior and hippocampal plasticity
    rationale: >-
      PMID:39370418 does demonstrate behavioral, dendritic, and presynaptic
      effects of cell-type-restricted Cacna1c deficiency in female mice. The
      perturbation is loss of Cav1.2, whereas PMID:25403839 associates the human
      risk genotype with increased expression and current. The phenotypes are
      also not specific to bipolar disorder. This is gene-function evidence,
      not directionally convergent validation of the human risk edge.
    citations:
      - PMID:39370418
      - PMID:25403839
  - claim_id: ipsc-hyperexcitability
    statement: >-
      Bipolar patient-derived dentate-gyrus-like neurons show hyperexcitability
      that lithium reverses selectively in neurons from clinical lithium
      responders.
    disposition: QUALIFIED
    report_quote: >-
      lithium selectively reversed hyperexcitability in neurons derived from
      lithium-responsive patients but not from lithium-non-responsive patients
    rationale: >-
      PMID:26524527 directly reports this result and is an important
      patient-derived functional model. It supports a cellular endophenotype
      and treatment-response stratification in the sampled lines, not an
      established universal cellular mechanism across heterogeneous bipolar
      disorder or proof that hyperexcitability causes episodic switching.
    citations:
      - PMID:26524527
  - claim_id: clock-vta-causal-chain
    statement: >-
      VTA Clock disruption establishes a CLOCK-to-dopamine-to-mania causal
      chain for human bipolar disorder.
    disposition: QUALIFIED
    report_quote: >-
      This is the most direct causal evidence linking the circadian and
      dopaminergic components of the hypothesis and demonstrates how a single
      circadian gene disruption in a specific brain region can produce the core
      behavioral phenotype.
    rationale: >-
      VTA-specific Clock knockdown in PMID:20591414 increased dopaminergic
      firing and produced hyperactivity and reduced anxiety, but it also
      increased depression-like behavior; the paper calls the result a mixed
      state. It is a targeted mouse perturbation, not evidence that a human
      CLOCK variant causes bipolar mania. Retain it as model-organism
      plausibility, not an established human causal chain.
    citations:
      - PMID:20591414
  - claim_id: calcium-trait-chain
    statement: >-
      Peripheral-cell calcium findings, BCL2 genotype, and a phasic
      mitochondrial model form one of the strongest mechanistic chains from
      genetic variation to bipolar mood-state cycling.
    disposition: QUALIFIED
    report_quote: >-
      This three-level convergence — genetic variant → ER calcium release →
      state-dependent cycling — represents one of the strongest mechanistic
      chains in the hypothesis.
    rationale: >-
      PMID:10418700 found altered calcium handling in platelets and lymphocytes,
      and PMID:21167476 found genotype-associated ER calcium release in 18
      patient lymphoblast lines. Neither connects those peripheral-cell
      findings longitudinally to mood transitions. PMID:28093238 is explicitly
      a proposed mitochondrial model, not a direct test of state switching.
      These sources support plausibility and biomarkers but not the continuous
      causal chain claimed.
    citations:
      - PMID:10418700
      - PMID:21167476
      - PMID:28093238
  - claim_id: akap11-gsk3b-convergence
    statement: >-
      Bipolar exome sequencing independently establishes AKAP11 as a definitive
      bipolar risk gene converging on the GSK3B pathway.
    disposition: QUALIFIED
    report_quote: >-
      identified AKAP11 as a definitive BD risk gene (OR=7.06,
      P=2.83×10⁻⁹), encoding a scaffold protein for GSK-3beta
    rationale: >-
      PMID:35410376 found excess ultra-rare protein-truncating variants in BD,
      but AKAP11 reached the quoted definitive gene-level result after combining
      BipEx with the schizophrenia SCHEMA analysis. The source says AKAP-11
      interacts with GSK3B; interaction is not proof that disease variants act
      through GSK3B or that GSK3B inhibition is lithium's necessary therapeutic
      mechanism. PGC4 later reported broader common-rare convergence, further
      weakening the report's claim of completely distinct architectures.
    citations:
      - PMID:35410376
      - PMID:39843750
  - claim_id: fibroblast-genotype-attribution
    statement: >-
      PMID:32404948 showed that lithium's circadian effects in bipolar
      fibroblasts depend on PER3, RORA, and GSK3B genotype.
    disposition: REJECTED
    report_quote: >-
      lithium's effects on circadian parameters depended on PER3, RORA, and
      GSK3beta genotype
    rationale: >-
      PMID:32404948 studied circadian-period phenotypes and drug responses in 39
      patient fibroblast lines, plus Clock- and Cry-deficient mice. It did not
      report a human PER3, RORA, or GSK3B genotype analysis. Those genes appear
      in the separate review PMID:27003509 as reported pharmacogenetic
      associations. The report conflates two different evidence claims and
      assigns the genotype result to the wrong paper.
    citations:
      - PMID:32404948
      - PMID:27003509
  - claim_id: timeless-rora-update
    statement: >-
      TIMELESS and RORA have stronger bipolar-disorder associations than CLOCK
      and BMAL1 and should be added to the canonical gene nominations.
    disposition: QUALIFIED
    report_quote: >-
      The hypothesis should update its circadian gene nominations to include
      TIMELESS and RORA while retaining the pathway-level claim.
    rationale: >-
      PMID:24716566 reports associations for TIMELESS rs774045 and RORA
      rs782931 in two candidate-gene samples and a combined meta-analysis. A
      single 2014 candidate-gene study does not establish durable gene
      prioritization over CLOCK or ARNTL/BMAL1, and the report does not test
      these nominations against the much larger 2025 multi-ancestry GWAS.
      Retain the variants as historical leads pending modern replication rather
      than promoting a canonical gene-list update.
    citations:
      - PMID:24716566
      - PMID:39843750
  - claim_id: lithium-pi3k-interpretation
    statement: >-
      Lithium-response genomics favors PI3K-Akt and focal-adhesion pathways over
      direct GSK3B and inositol mechanisms, and this is partly explained by a
      PI3K-to-Akt-to-GSK3B cascade.
    disposition: QUALIFIED
    report_quote: >-
      PI3K-Akt/focal adhesion pathways, rather than direct GSK-3beta, are
      enriched in lithium pharmacogenomics, though partially reconcilable
      through the PI3K→Akt→GSK-3beta cascade
    rationale: >-
      PMID:38395906 directly supports focal-adhesion and PI3K-Akt network
      enrichment in lithium response. Its reported negative replication is for
      extracellular-matrix proteins, not a head-to-head rejection of GSK3B or
      inositol pathways. The proposed upstream reconciliation comes from
      separate predominantly preclinical neuroprotection literature and was
      not tested in ConLiGen. Keep the pathway association while separating it
      from both negative and mechanistic inferences.
    citations:
      - PMID:38395906
      - PMID:16179524
  - claim_id: calcium-channel-paradox
    statement: >-
      Dihydropyridine efficacy versus verapamil failure resolves the
      calcium-channel-blocker paradox and shows that the translational gap is a
      drug-class issue rather than a mechanism failure.
    disposition: REJECTED
    report_quote: >-
      The translational gap is a drug-class issue, not a mechanism failure.
    rationale: >-
      PMID:9790159 enrolled 30 people with heterogeneous treatment-refractory
      affective illness. Ten responded to blinded nimodipine versus placebo;
      the decisive verapamil substitution and isradipine transition involved
      only two bipolar patients. PMID:11252650 concluded that support for
      calcium-channel antagonists was limited. This is an interesting
      drug-class lead, but two within-subject observations cannot resolve the
      class question or validate CACNA1C-specific therapy.
    citations:
      - PMID:9790159
      - PMID:11252650
  - claim_id: modern-dhp-trial-absence
    statement: >-
      No modern nimodipine or isradipine bipolar-disorder trial existed by May
      2026.
    disposition: REJECTED
    report_quote: >-
      Searches for "nimodipine bipolar" and "isradipine bipolar" clinical
      trials — confirmed absent.
    rationale: >-
      ClinicalTrials.gov record NCT01784666 is a randomized adjunctive
      isradipine study for bipolar depression begun in 2013. It was terminated
      for poor enrollment after two participants, so it supplies no useful
      efficacy estimate and an adequately powered modern DHP trial remains a
      valid gap. It nevertheless falsifies the report's categorical absence and
      shows that the stated search was incomplete (registry accessed
      2026-07-31).
    citations:
      - clinicaltrials:NCT01784666
  - claim_id: psychotic-bdi-specificity
    statement: >-
      The canonical model best explains psychotic bipolar I disorder and is
      less applicable to non-psychotic bipolar disorder.
    disposition: REJECTED
    report_quote: >-
      The model best explains psychotic BD-I, since transdiagnostic molecular
      overlap is driven by psychosis subtype, not BD diagnosis per se
    rationale: >-
      PMID:33442739 found that a less-pronounced bipolar-schizophrenia cortical
      expression similarity was concentrated among bipolar subjects with
      psychosis. It did not test the report's calcium, circadian, synaptic, or
      lithium-response model, did not establish that the relevant subjects were
      all BD-I, and did not compare the model's explanatory fit across
      subtypes. Psychosis-stratified transcriptomic overlap is a useful
      qualification; model-level psychotic-BD-I specificity is an unsupported
      extrapolation.
    citations:
      - PMID:33442739
  - claim_id: neuroimaging-risk-gene-specificity
    statement: >-
      Structural brain abnormalities attributable to bipolar risk genes are
      shared across the psychosis spectrum.
    disposition: REJECTED
    report_quote: >-
      Structural brain abnormalities attributed to BD risk genes are shared
      across the psychosis spectrum
    rationale: >-
      PMID:23820096 found no corrected association between nine selected risk
      SNPs and the tested structural measures, so it does not attribute those
      abnormalities to the genes. PMID:32646651 found shared morphometric
      patterns across BD, schizophrenia, major depression, and OCD, not a
      psychosis-only spectrum, and noted unresolved medication, comorbidity,
      and risk-factor confounding. General imaging non-specificity is retained;
      the report's genetic attribution and scope are not.
    citations:
      - PMID:23820096
      - PMID:32646651
  - claim_id: lithium-frontolimbic-preservation
    statement: >-
      Lithium preserves fronto-limbic volumes and directly confirms action on
      the circuits named in the hypothesis.
    disposition: QUALIFIED
    report_quote: >-
      This directly confirms that lithium acts on the specific neural circuits
      named in the hypothesis
    rationale: >-
      The systematic review PMID:41672966 found lithium treatment associated
      with larger volumes and higher white-matter integrity, but 78 of 115
      included studies were cross-sectional and only six were randomized.
      Overall risk of bias was substantial and certainty low to moderate.
      Association with circuit measures is a useful lead; preservation,
      mediation, and direct therapeutic action are not established.
    citations:
      - PMID:41672966
  - claim_id: dopamine-transporter-trait
    statement: >-
      Reduced striatal dopamine-transporter binding in current and recently
      remitted mania is a trait-level bipolar-disorder alteration.
    disposition: REJECTED
    report_quote: >-
      This suggests a trait-level alteration in dopaminergic reward circuitry
      supporting the dopaminergic component of the hypothesis.
    rationale: >-
      PMID:36322065 found more extensive reduction during current mania and
      concluded that DAT levels after recently remitted mania approximated
      those of people without bipolar disorder. The remitted group retained a
      left-sided difference but not the right-sided pattern. The source
      therefore supports a state-associated dopaminergic finding, not the
      report's trait-level inference.
    citations:
      - PMID:36322065
  - claim_id: ipsrt-circadian-causality
    statement: >-
      Interpersonal and social rhythm therapy prevents bipolar recurrence via
      circadian stabilization.
    disposition: QUALIFIED
    report_quote: >-
      interpersonal and social rhythm therapy prevents BD recurrence via
      circadian stabilization
    rationale: >-
      In PMID:16143731, acute-phase IPSRT assignment was associated with longer
      survival without recurrence, and increased social-rhythm regularity was
      associated with lower recurrence. IPSRT is a multicomponent
      psychotherapy, the regularity analysis is mediational rather than a
      direct circadian perturbation, and the trial did not begin in euthymia.
      The clinical finding is retained, but the report's preventive and causal
      wording is too strong.
    citations:
      - PMID:16143731
  - claim_id: chronotherapy-prevention-absence
    statement: >-
      No chronotherapy trial had tested recurrence prevention from euthymia by
      May 2026.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      No RCT has investigated chronotherapy for BD episode prevention from
      euthymia
    rationale: >-
      PMID:31917880 supports absence of a bright-light-therapy prevention RCT
      only through its June 2019 search date. The report gives no updated
      registry query, search date, result set, or exclusion criteria to support
      the broader May 2026 claim across all chronotherapy. The gap may be
      reasonable, but it is not reproducibly demonstrated by the cited source.
    citations:
      - PMID:31917880
  - claim_id: biological-process-ontology
    statement: >-
      GO:0007623, GO:0006816, GO:0007268, and GO:0016310 are suitable labels for
      circadian rhythm, calcium ion transport, chemical synaptic transmission,
      and phosphorylation, respectively.
    disposition: RETAINED
    report_quote: >-
      GO:0007623 (circadian rhythm); GO:0006816 (calcium ion transport);
      GO:0007268 (chemical synaptic transmission); GO:0016310 (phosphorylation
      — GSK-3β/PI3K-Akt)
    rationale: >-
      All four identifiers resolve in Gene Ontology with the labels reported.
      This was rechecked on 2026-07-31 with `runoak -i sqlite:obo:go info`.
      Their existence and labels are valid, although any disease-YAML use still
      requires evidence that the particular process is altered in the stated
      node and direction.
  - claim_id: anatomy-ontology
    statement: >-
      UBERON:0001870 denotes anterior cingulate cortex and UBERON:0002637
      denotes ventral striatum.
    disposition: REJECTED
    report_quote: >-
      UBERON:0001870 (ACC); UBERON:0001876 (amygdala); UBERON:0002637 (ventral
      striatum)
    rationale: >-
      UBERON:0001870 is frontal cortex, not anterior cingulate cortex;
      UBERON:0009835 is the exact ACC term. UBERON:0002637 is ventral anterior
      nucleus of thalamus, not ventral striatum; UBERON:0005403 is the exact
      ventral-striatum term. UBERON:0001876 correctly denotes amygdala. The two
      mismatched identifiers must not be promoted. These mappings were
      rechecked on 2026-07-31 with `runoak -i sqlite:obo:uberon info`.
  - claim_id: corpus-and-count-provenance
    statement: >-
      The report reviewed 138 papers, confirmed 30 findings, and evaluated 49
      evidence-matrix entries.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      5 iterations, 30 confirmed findings, 138 papers reviewed, 49 evidence
      matrix entries
    rationale: >-
      The delivered citation sidecar lists 49 PMIDs, the rendered evidence
      matrix has 30 numbered rows, and the report contains 15 numbered key
      findings. No search strings, result exports, screening log, exclusion
      log, or list of the remaining 89 claimed papers is supplied.
      Provider-internal retrieval may explain the larger totals, but the artifacts do
      not make them auditable and two stated counts conflict with the visible
      report structure.
  - claim_id: missing-visualizations
    statement: The provider delivered four generated visualizations with the report.
    disposition: REJECTED
    report_quote: >-
      4 visualizations generated.
    rationale: >-
      The hypothesis directory contains no image artifacts. The report
      references plot_2.png and plot_3.png, but neither file is present. The
      figure placeholders and stated visualization count therefore do not have
      inspectable provenance.

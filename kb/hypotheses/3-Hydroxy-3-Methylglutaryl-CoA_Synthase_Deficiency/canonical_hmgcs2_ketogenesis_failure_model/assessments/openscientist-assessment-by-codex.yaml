assessor: codex
source_report: ../openscientist.md
hypothesis_id: canonical_hmgcs2_ketogenesis_failure_model
assessed_at: "2026-07-31T05:07:18Z"
overall_verdict: SUPPORTED
summary: >-
  The report correctly supports the canonical mechanism: biallelic HMGCS2
  dysfunction impairs the rate-limiting mitochondrial step of hepatic
  ketogenesis and predisposes to hypoketotic metabolic decompensation during
  catabolic stress. Human cohorts, variant-expression assays, and Hmgcs2
  knockout models converge on that core. Several extensions require correction.
  The report double-counts overlapping patient reviews to claim more than 150
  cases, turns 33 of 35 retrospectively tested acute samples into a formal 4HMP
  sensitivity estimate, and generalizes one cohort's first-presentation
  hypoglycemia frequency to all episodes. Mouse acetyl-CoA, ACSL1, and acetate
  findings are useful mechanistic leads but are not yet demonstrated in human
  HMGCS2 deficiency. More seriously, the report says no ClinGen curation exists
  despite a definitive 2018 ClinGen evaluation, and says no patient-liver
  activity study exists despite PMID:9727719. The source report remains a
  useful synthesis, but its database, provenance, and human-translation claims
  must not be promoted without these corrections.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: canonical-ketogenesis-failure
    statement: >-
      Biallelic HMGCS2 dysfunction impairs the rate-limiting mitochondrial step
      of ketogenesis and causes susceptibility to hypoketotic metabolic
      decompensation during fasting or illness.
    disposition: RETAINED
    report_quote: >-
      The core mechanistic claim -- that biallelic HMGCS2 loss-of-function
      blocks the irreversible, rate-limiting step of mitochondrial ketogenesis
      (EC 2.3.3.10), producing hypoketotic metabolic decompensation during
      catabolic stress -- is well-established and not seriously challenged by
      any competing model.
    rationale: >-
      PMID:32952630 functionally tested five patient variants in expression
      systems, including three proteins with no residual activity and one with
      residual activity. PMID:39798988 synthesized 93 reported cases plus two
      new patients, and PMID:40515583 analyzed 59 published and 16 previously
      undescribed patients. These sources support the causal gene, catalytic
      bottleneck, stress dependence, and characteristic inadequate ketogenesis.
      They do not require every crisis to include hypoglycemia.
    citations:
      - PMID:32952630
      - PMID:39798988
      - PMID:40515583
  - claim_id: distinct-patient-count
    statement: >-
      The delivered evidence establishes more than 150 distinct affected
      patients.
    disposition: REJECTED
    report_quote: >-
      confirmed in >150 patients across multiple populations.
    rationale: >-
      PMID:39798988 reviewed 93 reported cases and added two patients.
      PMID:40515583 identified 59 published cases and added 16 undescribed
      patients. The reviews therefore disagree on the published-case
      denominator (93 versus 59), likely because of different inclusion
      criteria, and their published cases substantially overlap. They cannot be
      summed as independent patients. The report supplies no deduplication table
      or other basis for more than 150 distinct people.
    citations:
      - PMID:39798988
      - PMID:40515583
  - claim_id: clinvar-count
    statement: >-
      The exact ClinVar counts in the report are a reproducible measure of
      independent pathogenic variation.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      ClinVar contains 85 pathogenic/likely pathogenic HMGCS2 variants out of
      369 total entries, providing a robust molecular basis.
    rationale: >-
      The report provides neither a ClinVar query nor a dated export, accession
      list, review-status filter, or deduplication rule. ClinVar counts are
      dynamic and submissions are not equivalent to independent variants or
      independent gene-disease evidence. The qualitative molecular support is
      strong, but these exact counts are not auditable from the committed
      artifacts.
  - claim_id: hypoglycemia-frequency
    statement: >-
      Hypoglycemia is frequent but not required during HMGCS2-deficiency
      decompensation; the reported 56.3% value applies to first presentations in
      one cohort, not to all acute episodes.
    disposition: QUALIFIED
    report_quote: >-
      **hypoglycemia is not universal**, occurring in only ~56% of acute
      episodes, with normoglycemia and even severe hyperglycemia documented
    rationale: >-
      PMID:40004108 observed hypoglycemia in 9 of 16 symptomatic Vietnamese
      patients during their first acute episode. It did not estimate the
      frequency across repeated episodes or all populations. PMID:32905056
      confirms a normoglycemic crisis, and PMID:40937626 reports a single
      hyperglycemic presentation. The non-universality conclusion is sound; the
      generalized episode frequency is not.
    citations:
      - PMID:40004108
      - PMID:32905056
      - PMID:40937626
  - claim_id: four-hmp-performance
    statement: >-
      Detection of 4HMP in 33 of 35 retrospectively tested acute samples is a
      useful diagnostic signal but is not a validated 94.3% sensitivity
      estimate.
    disposition: QUALIFIED
    report_quote: >-
      4-Hydroxy-6-methyl-2-pyrone (4HMP) is the most specific urinary biomarker
      (94.3% sensitivity)
    rationale: >-
      PMID:39798988 reports 4HMP in 33 of 35 urine samples taken during acute
      episodes, typically detected retrospectively. That selected,
      disease-ascertained denominator does not establish prospective diagnostic
      sensitivity. PMID:25511235 also found 4HMP in some ketotic comparison
      samples and estimated performance only for a combined adipate-plus-4HMP
      cutoff in eight decompensation samples. Preserve the observed fraction,
      sample phase, and assay context rather than recasting it as sensitivity.
    citations:
      - PMID:39798988
      - PMID:25511235
  - claim_id: acetyl-coa-dual-pathology
    statement: >-
      Acetyl-CoA accumulation, mitochondrial protein hyperacetylation, and
      ACSL1-mediated lipid re-esterification are plausible downstream extensions
      supported primarily by mouse models, not established human HMGCS2D edges.
    disposition: QUALIFIED
    report_quote: >-
      The canonical model should be extended to a **dual-pathology framework**:
      (1) ketone body deficiency causing energy failure in ketone-dependent
      tissues (brain, heart), and (2) acetyl-CoA accumulation causing
      mitochondrial protein hyperacetylation, impaired oxidative capacity, and
      hepatic lipid dysregulation.
    rationale: >-
      PMID:33619377 demonstrated acetyl-CoA accumulation and mitochondrial
      protein hyperacetylation in global Hmgcs2-knockout neonates.
      PMID:35421611 and PMID:40692014 used mouse loss-of-function models for
      steatosis and ACSL1 partitioning; the human component of PMID:40692014 was
      metabolic steatohepatitis rather than inherited HMGCS2 deficiency.
      PMID:40272888 likewise combines human MASLD-MASH flux data with mouse
      Hmgcs2 disruption. These are strong cross-model leads, but no cited
      HMGCS2D patient study measures hepatic acetyl-CoA, acetylomes, or
      ER-localized ACSL1.
    citations:
      - PMID:33619377
      - PMID:35421611
      - PMID:40692014
      - PMID:40272888
  - claim_id: acetate-human-modifier
    statement: >-
      Fasting acetate elevation in adult liver-specific knockout mice does not
      establish acetate production or utilization as a human severity modifier.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      patients with more robust acetate or alternative fuel production may
      tolerate fasting stress better.
    rationale: >-
      PMID:38876267 found higher plasma acetate in inducible
      liver-specific-Hmgcs2-knockout mice that maintained glycemia and body
      temperature during prolonged fasting. The authors raised extrahepatic
      ketogenesis and alternative fuels as possible compensation; they did not
      identify acetate's source, demonstrate its use as the compensating fuel,
      or study germline HMGCS2D patients. The human-modifier edge is a testable
      proposal, not an observed mechanism.
    citations:
      - PMID:38876267
  - claim_id: incomplete-penetrance
    statement: >-
      Asymptomatic people with biallelic variants have been observed, but the
      available pediatric, trigger-dependent cohorts do not establish a
      quantitative penetrance estimate or permanent nonpenetrance.
    disposition: QUALIFIED
    report_quote: >-
      **incomplete penetrance** is well-documented, with asymptomatic biallelic
      carriers identified in multiple families
    rationale: >-
      PMID:40515583 notes asymptomatic individuals in several families, and
      PMID:40004108 reports 3 of 19 patients as asymptomatic at ascertainment.
      HMGCS2D is crisis-triggered and often presents in childhood; an
      asymptomatic sibling can be presymptomatic. PMID:40548098 explicitly says
      its clinically asymptomatic sibling may eventually decompensate.
      Variable expression and incomplete clinical ascertainment are supported;
      durable incomplete penetrance is not yet quantified.
    citations:
      - PMID:40515583
      - PMID:40004108
      - PMID:40548098
  - claim_id: sirt3-clinical-modifier
    statement: >-
      SIRT3-dependent HMGCS2 deacetylation is a biochemical lead, but no cited
      evidence shows that SIRT3 genotype or activity modifies HMGCS2D severity.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      patients with higher SIRT3 activity might extract more residual function
      from hypomorphic HMGCS2 variants.
    rationale: >-
      PMID:28512002 is a cancer-metabolism review. PMID:41960367 studied
      cholangiocarcinoma cell lines, xenografts, tumor samples, and a plasmid
      K310 mutation assay. Those sources support a SIRT3-HMGCS2 regulatory
      interaction in cancer models, not a modifier effect in biallelic HMGCS2
      deficiency. No HMGCS2D cohort was genotyped or stratified by SIRT3.
    citations:
      - PMID:28512002
      - PMID:41960367
  - claim_id: clingen-curation-absence
    statement: >-
      No formal ClinGen gene-disease validity curation exists for HMGCS2
      deficiency.
    disposition: REJECTED
    report_quote: >-
      However, no ClinGen gene-disease validity curation was identified,
      representing a notable curation gap for a well-established Mendelian
      disorder.
    rationale: >-
      The ClinGen Fatty Acid Oxidation Disorders Expert Panel approved a
      definitive HMGCS2–3-hydroxy-3-methylglutaryl-CoA synthase deficiency
      gene-disease validity classification on 2018-05-22, with autosomal
      recessive inheritance. This is not a current gap; it is a missed source.
    citations:
      - CGGV:assertion_b3f49254-4635-4961-83b9-31c7ebc7f159-2018-05-22T160000.000Z
  - claim_id: patient-liver-assay-absence
    statement: >-
      All HMGCS2 activity data come from expression systems or mouse models, and
      no patient liver biopsy or hepatocyte has been assayed directly.
    disposition: REJECTED
    report_quote: >-
      All enzyme activity data come from in vitro expression systems or mouse
      models. No study has measured HMGCS2 activity directly in liver biopsies
      or hepatocytes from HMGCS2D patients.
    rationale: >-
      PMID:9727719 analyzed a patient's liver homogenate, measured total
      HMG-CoA-synthase activity, and used a mitochondrial-HMGCS-specific
      antibody to show absent immunoreactive protein. Total activity was only
      slightly below control because cytoplasmic or other isoenzymes likely
      contributed, so a modern isoenzyme-specific catalytic assay remains
      valuable. The report's broader assertion that all activity evidence comes
      from expression systems or mice is nevertheless false.
    citations:
      - PMID:9727719
      - PMID:32952630
  - claim_id: bicytopenia-spectrum
    statement: >-
      The cited bicytopenia case is a weak phenotype lead because its molecular
      diagnosis rested on a homozygous HMGCS2 variant of uncertain significance.
    disposition: QUALIFIED
    report_quote: >-
      reported a case presenting with hepatosplenomegaly, lymphadenopathy, and
      bicytopenia.
    rationale: >-
      PMID:37931961 reports those findings, but its abstract says whole-exome
      sequencing identified a homozygous missense variant of uncertain
      significance. Without functional evidence, segregation, or another
      definitive diagnostic line, this single case should not establish
      bicytopenia or lymphadenopathy as an expanded HMGCS2D phenotype.
    citations:
      - PMID:37931961
  - claim_id: carnitine-ketone-trial
    statement: >-
      An L-carnitine or ketone-ester pilot is a prospective research proposal,
      not an evidence-backed HMGCS2D treatment recommendation.
    disposition: QUALIFIED
    report_quote: >-
      Open-label pilot in diagnosed HMGCS2D patients comparing standard care
      vs. standard care + daily L-carnitine
    rationale: >-
      PMID:37503004 is the preprint version of the study later published as
      PMID:40692014, so these are not independent sources. The experiments used
      liver-specific knockout mice, metabolic-steatohepatitis liver samples,
      and primary hepatocytes; they did not test L-carnitine in HMGCS2D
      patients. The report supplies no disease-specific efficacy, dosing, or
      safety evidence for either L-carnitine or beta-hydroxybutyrate ester.
      Keep this as a prospective study idea, not treatment guidance.
    citations:
      - PMID:37503004
      - PMID:40692014
  - claim_id: ontology-leads
    statement: >-
      Most proposed CL and GO identifiers resolve, but the cardiomyocyte label
      is not canonical and the OMIM gene entry is misclassified as a disease
      term.
    disposition: QUALIFIED
    report_quote: >-
      - **Cell types:** Hepatocyte (CL:0000182), Renal proximal tubular cell
      (CL:0002306), Cardiomyocyte (CL:0000746) - **Biological processes:**
      Ketone body biosynthetic process (GO:0046951), Protein deacetylation
      (GO:0006476), Fatty acid beta-oxidation (GO:0006635), Lipid homeostasis
      (GO:0055088) - **Disease terms:** HMGCS2 deficiency (OMIM:605911); HMG-CoA
      synthase 2 gene (OMIM:600234)
    rationale: >-
      OAK confirms CL:0000182 "hepatocyte," CL:0002306 "epithelial cell of
      proximal tubule," and CL:0000746 "cardiac muscle cell"; "cardiomyocyte" is
      not the canonical label. All four GO identifiers resolve with the listed
      labels. OMIM:600234 is the HMGCS2 gene entry, not a disease term; use
      hgnc:5008 for the gene. The disease resolves as MONDO:0011614
      "3-hydroxy-3-methylglutaryl-CoA synthase deficiency."
  - claim_id: search-provenance
    statement: >-
      The claimed 41-publication systematic evaluation cannot be reconstructed
      from the delivered report.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      Our systematic evaluation of 41 publications spanning clinical case
      series, systematic reviews, animal models, and in vitro studies confirms
      the core model with high confidence.
    rationale: >-
      The report and citation sidecar expose 28 unique PMIDs and no search
      strings, screening log, exclusion record, or mapping for the other 13
      publications. Moreover, PMID:37503004 is the preprint subsequently
      published as PMID:40692014, leaving only 27 distinct study lineages among
      those identifiers. Individual cited claims remain reviewable; the
      systematic corpus claim is not.

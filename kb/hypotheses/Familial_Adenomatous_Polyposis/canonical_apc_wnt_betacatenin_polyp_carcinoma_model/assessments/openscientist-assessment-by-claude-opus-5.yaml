overall_verdict: SUPPORTED
summary: >-
  The report's central thesis is the seed hypothesis already curated in dismech, so
  restating it produces no new support. Its value is the qualification set, and that
  set holds up on source check. Four distinctive additions verify verbatim against the
  cited abstracts and are genuinely absent from the disorder entry: in vitro
  reconstitution of the beta-catenin destruction complex from purified components
  (PMID:34352208), the just-right co-selection of second APC hits (PMID:12045208), a
  Wnt-independent chromosome-segregation role for APC (PMID:11283620), and the strict
  LGR5+ crypt stem cell requirement for adenoma growth (PMID:19092804). Three further
  qualifications are real but narrower than the report states, and are recorded as
  QUALIFIED: the APC/nuclear beta-catenin discordance comes from one study of
  early-onset sporadic rectal cancer rather than FAP; the 3-to-5-fold modifier effect
  is attributed by its own authors to a locus near Apc or chromosome 18 structural
  variation, not to Mom1/Pla2g2a, whose human orthologue was explicitly not confirmed
  as a modifier; and the ClinGen claim conflates an APC Variant Curation Expert Panel
  with gene-disease validity curation. Two therapeutic and one competing-pathway claim
  were not source-checked and are marked NEEDS_VERIFICATION. The report names no
  dataset and ran no computation of its own; its four figure placeholders were never
  rendered.

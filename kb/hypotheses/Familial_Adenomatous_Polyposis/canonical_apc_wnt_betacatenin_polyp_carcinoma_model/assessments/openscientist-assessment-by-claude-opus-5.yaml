claims:
- claim_id: canonical-apc-wnt-cascade-supported
  statement: >-
    The core causal chain from germline APC loss through biallelic inactivation,
    destruction-complex failure, beta-catenin stabilization and TCF/LEF transcription to
    adenoma initiation is validated by converging evidence types.
  disposition: RETAINED
  report_quote: >-
    The core causal chain — germline APC loss-of-function → biallelic inactivation →
    destruction complex failure → β-catenin stabilization → TCF/LEF-dependent
    transcription of pro-proliferative targets → adenoma initiation — is validated by
    converging lines of evidence
  rationale: >-
    Well supported, but this is the seed hypothesis copied out of the dismech entry, so
    the report supplies no new support for it. Retained as an accurate statement of a
    claim the KB already holds, not as a novel finding. The individual supporting sources
    checked below do add specificity the entry lacked.
  citations:
  - PMID:34352208
  - PMID:19092804
- claim_id: destruction-complex-reconstitution-in-vitro
  statement: >-
    APC's role in the beta-catenin destruction complex has been demonstrated by
    reconstitution from purified human components, with oncogenic APC truncations shown
    to be functionally impaired while still recruiting beta-catenin.
  disposition: RETAINED
  report_quote: >-
    reconstituted the destruction complex in vitro, demonstrating that "AXIN1
    polymerization and APC promote β-catenin capture, phosphorylation, and
    ubiquitylation.
  rationale: >-
    Verified verbatim against the cached abstract of PMID:34352208, which also states
    that "Oncogenic APC truncation variants, although part of the complex, are
    functionally impaired." This is the strongest mechanistic grounding for the
    destruction-complex step and the dismech entry cited nothing for it. Note the report
    misattributes the paper to "Faux et al."; the cached authors are Ranes M, Zaleska M,
    Sakalas S.
  citations:
  - PMID:34352208
- claim_id: just-right-second-hit-selection
  statement: >-
    Second somatic APC hits are co-selected with the germline allele to yield an
    intermediate rather than maximal level of beta-catenin signaling, refining the
    classical two-hit reading of APC inactivation.
  disposition: RETAINED
  report_quote: >-
    second APC hits are not random but are selected to achieve an optimal level of Wnt
    pathway activation.
  rationale: >-
    Verified against PMID:12045208 (133 colorectal adenomas from six FAP patients). The
    abstract's own conclusion is that selection targets "a specific degree of beta-catenin
    signaling optimal for tumor formation, rather than at its constitutive activation".
    The dismech hypothesis notes already assert this qualification but cite nothing for
    it, so the citation is the integratable content.
  citations:
  - PMID:12045208
- claim_id: apc-wnt-independent-chromosomal-instability
  statement: >-
    APC has tumour-suppressive functions outside Wnt regulation, including a role in
    chromosome segregation whose loss produces chromosomal instability.
  disposition: QUALIFIED
  report_quote: >-
    **APC possesses Wnt-independent tumor-suppressive functions** including chromosomal
    instability regulation, DNA replication control, and cytoskeletal regulation
  rationale: >-
    The chromosome-segregation limb verifies verbatim against PMID:11283620, which reports
    that Apc mutant mouse ES cells show extensive chromosome and spindle aberrations, that
    APC accumulates at the kinetochore during mitosis, and that C-terminal APC sequences
    lying outside the beta-catenin regulatory domain contribute to chromosomal instability.
    Qualified because the report bundles "DNA replication control" into the same sentence
    on the strength of PMID:11283620 and PMID:15561772; neither of those two is a
    replication study, and the replication citation the report uses elsewhere
    (PMID:18474248) was not source checked here. Integrate the chromosome-segregation
    claim only.
  citations:
  - PMID:11283620
- claim_id: lgr5-stem-cell-of-origin
  statement: >-
    APC deletion transforms LGR5+ crypt stem cells within days and produces progressively
    growing adenomas, whereas the same deletion in transit-amplifying cells produces
    microadenomas that stall.
  disposition: RETAINED
  report_quote: >-
    definitively showed that "deletion of Apc in these stem cells leads to their
    transformation within days. Transformed stem cells remain located at crypt bottoms,
    while fuelling a growing microadenoma."
  rationale: >-
    Verified verbatim against PMID:19092804, including the negative arm the report
    stresses: when Apc is deleted in short-lived transit-amplifying cells the induced
    microadenomas rapidly stall and large adenomas remain very rare after 30 weeks. This
    is a cell-of-origin restriction, not a general proliferation claim, and the dismech
    entry annotated the initiating node only with the generic "intestinal epithelial cell".
    Model-organism evidence, so it grades as MODEL_ORGANISM on integration.
  citations:
  - PMID:19092804
- claim_id: apc-beta-catenin-nuclear-discordance
  statement: >-
    APC mutation does not reliably predict nuclear beta-catenin localization, challenging
    the assumption that Wnt activation is the invariant output of APC loss.
  disposition: QUALIFIED
  report_quote: >-
    a surprising lack of correlation between APC mutation and β-catenin nuclear
    localization in early-onset sporadic rectal cancer samples. Several factors including
    status of KRAS mutation could not explain this anomaly.
  rationale: >-
    The quote is verbatim from PMID:36586069 and the finding is real, with cell-line
    validation. Qualified on scope: the samples are early-onset sporadic rectal cancers,
    not FAP adenomas, the abstract reports no sample size, and it is a single group's
    immunohistochemistry-plus-Sanger series. The report's Executive Judgment generalizes it
    to "some colorectal cancer contexts", which is fair, but the dismech hypothesis notes
    should not read as if the discordance has been shown in FAP. Right home in the disorder
    entry is a knowledge-gap discussion attached to the Wnt node, not a rewritten edge.
  citations:
  - PMID:36586069
- claim_id: modifier-genes-three-to-fivefold
  statement: >-
    Genetic background modifies adenoma multiplicity in Apc-mutant mice by 3-to-5-fold at
    a constant Apc genotype, with Mom1/Pla2g2a named as the key modifier locus.
  disposition: QUALIFIED
  report_quote: >-
    demonstrated that genetic background variation produces 3–5 fold differences in
    adenoma number in ApcMin/+ mice, even with the identical Apc mutation
  rationale: >-
    The 3-to-5-fold figure verifies against PMID:15710876, but the attribution does not.
    That study's stock was Pla2g2a Mom1-s, and its own conclusion is that "a modifier gene
    close to Apc or structural variation on chromosome 18 modifies polyp numbers in our
    mice" — not Mom1/Pla2g2a, which appears only as background. The same paper states that
    "studies in humans did not confirm PLA2G2A as a major modifier of colorectal cancer
    risk in humans because functional polymorphic variation did not exist", which
    strengthens the report's Gap 4 while undercutting its Mom1 attribution. Integrate as a
    knowledge gap about unidentified human modifiers, not as a Pla2g2a mechanism.
  citations:
  - PMID:15710876
- claim_id: clingen-vcep-gene-disease-curation
  statement: >-
    ClinGen's establishment of an APC Variant Curation Expert Panel represents the highest
    level of formal gene-disease curation for the APC-FAP relationship.
  disposition: QUALIFIED
  report_quote: >-
    This represents the highest level of formal gene-disease curation.
  rationale: >-
    PMID:37800450 verifies for what it actually reports: an InSiGHT/ClinGen Hereditary
    Colorectal Cancer/Polyposis VCEP, APC-specific ACMG/AMP specifications, and pilot
    reclassification of 47% of 58 variants with a 56% reduction in VUS. That is *variant*
    curation. Gene-disease validity is a different ClinGen product, and the report never
    cites it, so the sentence quoted conflates the two. The gene-disease claim is
    independently true — the repository ClinGen snapshot records APC / classic or
    attenuated familial adenomatous polyposis as Definitive (SOP9, Hereditary Cancer Gene
    Curation Expert Panel) — so the fix is to cite the right source for each half rather
    than to drop the claim.
  citations:
  - PMID:37800450
- claim_id: apc-somatic-mosaicism-fifty-percent
  statement: >-
    Postzygotic APC mosaicism is identifiable in up to half of otherwise unexplained
    adenomatous polyposis cases, and detection depends on sequencing method and on
    analysing adenoma rather than leukocyte DNA.
  disposition: RETAINED
  report_quote: >-
    established that "APC somatic (postzygotic) mosaicism can be identified in up to 50%
    of unexplained adenomatous polyposis cases."
  rationale: >-
    Verified verbatim against PMID:40237877, which adds the tissue-sensitivity point the
    report omits: investigation of multiple colorectal adenomas is more sensitive than
    leukocyte DNA. Genuinely absent from the dismech entry, whose genetic notes cover the
    de novo rate but say nothing about mosaicism, and clinically consequential for
    testing strategy and family risk.
  citations:
  - PMID:40237877
- claim_id: crc-onset-timing-genotype-dependent
  statement: >-
    The "colorectal cancer by age 40" figure is genotype dependent, with risk rising near
    age 34 for severe genotypes and near age 49 for attenuated-region genotypes.
  disposition: QUALIFIED
  report_quote: >-
    found the 70-year cumulative CRC incidence in genetically confirmed FAP was 59.3%
    (reflecting screening/surgery effects), with severe genotype risk increasing at age 34
    and attenuated at age 49.
  rationale: >-
    The numbers verify against PMID:37853284 and the genotype labels map correctly onto the
    paper's Genotype-1 (attenuated-FAP-associated regions) and Genotype-2 groups. Qualified
    because the 34-versus-49 inflection is specifically for stage II-IV CRC risk, not for
    CRC of any stage, and the cohort is a Japanese multicentre retrospective registry of
    171 patients. Integrate with those bounds stated.
  citations:
  - PMID:37853284
- claim_id: severe-genotype-codon-1250-1464
  statement: >-
    APC variants in codons 1250-1464 predict earlier diagnosis and denser polyposis than
    variants outside that region.
  disposition: RETAINED
  report_quote: >-
    showed that "probands with a genotype (codon 1250-1464) predicting a severe phenotype
    had a median age at diagnosis of 21.8 (range, 11-49) years compared with 34.4 (range,
    14-57) years among those with mutations outside this region (P < 0.017),"
  rationale: >-
    Verified verbatim against PMID:18433509 (96 unrelated Swedish Polyposis Registry
    families), including the dense-polyposis split of 75% versus 30%. The dismech entry
    asserts exactly this MCR genotype-phenotype correlation in free-text notes on both the
    biochemical and genetic sections with no citation attached, so this is a direct
    substantiation of existing uncited prose.
  citations:
  - PMID:18433509
- claim_id: tankyrase-inhibitor-apc-selectivity
  statement: >-
    Tankyrase inhibitors show APC-mutation-selective activity in preclinical colorectal
    cancer models, offering a direct pharmacological test of the Wnt hypothesis.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    showed that "STP1002 exerted antitumour activity by stabilising AXINs and antagonising
    the Wnt/β-catenin pathway in a subset of APC-mutated CRC cell lines but not in
    inhibitor-resistant cells and APC-wild-type CRC cell lines."
  rationale: >-
    Not source checked by this assessor; PMID:35849876 and PMID:36873622 were not fetched.
    The claim is also two steps from the disorder entry: no tankyrase inhibitor is in
    clinical use for FAP, and the entry's treatments section covers only established
    management. Left out of integration pending verification rather than added as a
    speculative treatment.
  citations:
  - PMID:35849876
  - PMID:36873622
- claim_id: serrated-pathway-apc-independent-wnt
  statement: >-
    Serrated colorectal cancers activate Wnt through RNF43/ZNRF3 rather than APC, showing
    Wnt activation is convergent while APC is not the only gateway.
  disposition: NEEDS_VERIFICATION
  report_quote: >-
    showed that "serrated cancers do not mutate APC" but instead activate Wnt through
    RNF43/ZNRF3 mutations
  rationale: >-
    Not source checked; PMID:27661107 and PMID:22654442 were not fetched. Independently of
    verification, this is a claim about sporadic colorectal cancer routes, not about FAP
    pathophysiology, so it belongs to a colorectal cancer entry rather than to this
    disorder file. Not integrated.
  citations:
  - PMID:27661107
  - PMID:22654442
- claim_id: retain-canonical-status
  statement: >-
    The hypothesis should keep CANONICAL status, with the qualifications recorded as
    boundary conditions rather than as challenges to the core mechanism.
  disposition: RETAINED
  report_quote: >-
    The hypothesis should retain CANONICAL status. The qualifications identified do not
    undermine the core mechanism but rather refine its precision and identify boundary
    conditions important for therapeutic development and patient stratification.
  rationale: >-
    Agreed, and the disorder entry already records status CANONICAL with a qualification
    paragraph. No status change is warranted or made. The verified qualifications are
    integrated as evidence, one new pathophysiology node, and two knowledge-gap discussions
    instead.
  citations:
  - PMID:36586069
  - PMID:11283620

schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: common_ancestry_developmental_state_divergence
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report is well calibrated overall. It separates within-tumor common
  ancestry, normal cell of origin, and MAPK/PI3K timing rather than treating
  them as one conclusion. Human mixed-tumor and multi-omic data support a
  shared ancestor and divergent developmental states, but do not provide
  lineage tracing or establish when pathway lesions arise. The main
  qualification is that failure of one imprinting marker to distinguish PGCs
  from neural stem cells does not show that the entire PGC-like signature is
  nonspecific.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: separated-verdicts
    statement: The three mechanistic questions require separate verdicts.
    disposition: RETAINED
    report_quote: the current literature supports them to very different degrees
    rationale: >-
      Common tumor ancestry, normal-cell ancestry, and pathway-lesion timing
      are different causal questions. The report appropriately prevents
      cross-sectional state resemblance or a shared tumor mutation from
      answering the other two.
    citations:
      - PMID:28078450
      - PMID:35137206
      - PMID:24896186
  - claim_id: mixed-component-ancestry
    statement: Distinct components within at least some mixed intracranial GCTs share a tumor ancestor.
    disposition: RETAINED
    report_quote: Intra-tumor common ancestry + later developmental-state divergence — PARTIALLY SUPPORTED.
    rationale: >-
      Microdissected histologically distinct components with identical somatic
      MAPK/PI3K alterations support within-patient common ancestry, while their
      different methylation states support later divergence. The report
      correctly limits this to partial support rather than universal ancestry
      across patients.
    citations:
      - PMID:28078450
  - claim_id: phylogenetic-strength
    statement: Shared recurrent pathway variants do not by themselves constitute a fully resolved tumor phylogeny.
    disposition: RETAINED
    report_quote: trunk identity is inferred rather than phylogenetically proven
    rationale: >-
      Private passengers, structural breakpoints, and copy-number boundaries
      would provide stronger orthogonal trunk evidence than shared recurrent
      hotspots. This caveat is a material and appropriate limit on the
      common-ancestry conclusion.
    citations:
      - PMID:28078450
  - claim_id: normal-cell-origin
    statement: The normal cell of origin remains unresolved.
    disposition: RETAINED
    report_quote: All PGC-resemblance data are correlative *state* evidence
    rationale: >-
      Methylation and transcriptomic similarity support a PGC-like state but
      are not lineage tracing. Neural-stem-cell imprinting overlap and two
      fetal-brain observations keep misplaced-PGC, endogenous neural
      precursor, and convergent-state models open.
    citations:
      - PMID:28078450
      - PMID:35137206
      - PMID:20582452
      - PMID:41190468
  - claim_id: pgc-signature-nonunique
    statement: The entire PGC-like molecular signature is known not to be PGC-specific.
    disposition: QUALIFIED
    report_quote: PGC signature is not PGC-unique
    rationale: >-
      PMID:20582452 shows that SNRPN hypomethylation, one frequently invoked
      imprinting feature, also occurs in mouse and human neural stem cells.
      That materially weakens a PGC-origin inference but does not establish
      that the broader methylome and transcriptome signatures are wholly
      non-unique. The narrower marker-specific formulation should be used.
    citations:
      - PMID:20582452
      - PMID:28078450
      - PMID:35137206
  - claim_id: pathway-role
    statement: Recurrent MAPK/PI3K alterations may cooperate with tumor state, but their initiating or maintenance role is unresolved.
    disposition: RETAINED
    report_quote: Initiating vs maintenance vs passenger cannot be assigned.
    rationale: >-
      Recurrence and occasional sharing across mixed components establish
      biological plausibility and possible trunk placement, not temporal
      ordering, necessity, or sufficiency. The report also correctly notes
      incomplete prevalence and subtype imbalance.
    citations:
      - PMID:24896186
      - PMID:28078450
      - PMID:26956871

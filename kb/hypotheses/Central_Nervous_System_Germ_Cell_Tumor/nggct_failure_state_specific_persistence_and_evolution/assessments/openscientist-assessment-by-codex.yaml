schema_version: "1.0"
provider: openscientist
assessor: codex
source_report: ../openscientist.md
hypothesis_id: nggct_failure_state_specific_persistence_and_evolution
overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report strongly supports the useful architectural claim that progression
  during therapy, marker-negative growing teratoma syndrome, viable malignant
  progression, and post-treatment relapse should not be pooled. It also
  correctly identifies the absence of an adequately powered
  diagnosis-to-failure molecular series. Its branch mechanisms remain
  hypotheses: cross-sectional common ancestry does not establish
  treatment-selected differentiation states, PGC origin is not established,
  small radiotherapy series do not prove geographic causation, and a
  cross-sectional immune profile does not establish a relapse sanctuary.
artifacts:
  - openscientist-assessment-by-codex.md
claims:
  - claim_id: failure-state-architecture
    statement: NGGCT treatment failures comprise clinically distinct categories that should not be pooled.
    disposition: RETAINED
    report_quote: treatment failure is not one shared resistance mechanism
    rationale: >-
      The pooled prospective-trial and registry analysis separates progression
      during treatment, pathology-defined GTS, and post-treatment relapse, with
      differing timing, marker, and anatomic patterns. This directly supports
      the report's architectural conclusion.
    citations:
      - PMID:35218656
  - claim_id: gts-not-malignant-resistance
    statement: Marker-negative pathology-confirmed GTS is teratomatous persistence or expansion, not viable malignant resistance.
    disposition: RETAINED
    report_quote: GTS is not viable malignant resistant tumor
    rationale: >-
      GTS is defined by enlarging disease with normalized markers and
      teratoma-only pathology. Intracranial cases and pediatric outcome data
      support keeping this state separate from malignant progression, while
      recognizing that incomplete resection, continued growth, or malignant
      transformation can still cause morbidity.
    citations:
      - PMID:35218656
      - PMID:38668041
      - PMID:42488730
      - PMID:37140211
  - claim_id: longitudinal-gap
    statement: Current evidence cannot assign a reproducible molecular cause to each failure branch.
    disposition: RETAINED
    report_quote: no molecular state has been validated as therapy-selected
    rationale: >-
      The cross-sectional subtype study (PMID:38430549), two
      histology-changing cases (PMID:38409885), and one serial CGH case
      (PMID:11005262) do not replace a component-resolved diagnosis-to-failure
      cohort with treatment exposure and durable-responder controls. The
      pre-treatment tumor-blood sequencing in PMID:41675560 is a germline
      comparison, not temporal diagnosis-to-failure tumor sequencing.
    citations:
      - PMID:38430549
      - PMID:38409885
      - PMID:11005262
      - PMID:41675560
  - claim_id: mixed-tumor-state-selection
    statement: Cross-sectional common ancestry proves that differentiation-state selection drives component-level treatment failure.
    disposition: QUALIFIED
    report_quote: state-selection > acquired-clone
    rationale: >-
      Shared mutations and distinct methylation in microdissected components
      support common ancestry and state divergence within mixed tumors.
      However, PMID:28078450 did not compare diagnosis with treatment failure,
      show therapy-dependent enrichment, or exclude later genetic branch events.
      It supplies a candidate route, not a demonstrated failure mechanism.
    citations:
      - PMID:28078450
  - claim_id: pgc-derived-ancestor
    statement: The failure branches arise from an established PGC-derived ancestor with a MAPK/PI3K driver.
    disposition: REJECTED
    report_quote: Common ancestral cell (PGC-derived; MAPK/PI3K driver)
    rationale: >-
      PMID:28078450 supports a PGC-like germinoma methylation state and shared
      pathway variants in some mixed tumors. It neither lineage-traces the
      normal ancestor nor establishes a pathway lesion as the initiating driver.
      The report's own source evidence elsewhere treats both questions as
      unresolved.
    citations:
      - PMID:28078450
      - PMID:20582452
      - PMID:41190468
  - claim_id: radiation-geography
    statement: Radiation-field geography is established as a causal mechanism for the local-relapse branch.
    disposition: QUALIFIED
    report_quote: radiation geography remains viable for the *local* branch
    rationale: >-
      Small retrospective series make inadequate field or dose a plausible
      branch-specific explanation, but counts such as three local failures
      among five focal/WBRT-treated patients do not isolate field geometry from
      protocol, stage, response, and selection differences. It is a competing
      exposure hypothesis requiring dosimetry-resolved analysis.
    citations:
      - PMID:22420971
      - PMID:28695992
      - PMID:35218656
  - claim_id: immune-sanctuary
    statement: A PD-L1-high immune microenvironment is a demonstrated sanctuary mechanism for NGGCT failure.
    disposition: QUALIFIED
    report_quote: microenvironmental-sanctuary branch
    rationale: >-
      Cross-sectional immunohistochemistry shows checkpoint expression and
      relative differences between germinoma and NGGCT, but does not link the
      profile to within-patient treatment failure or establish causality.
      Calling NGGCT simply immune-cold is also reductive: PD-1/PD-L1 were common
      in both groups and T-cell/checkpoint patterns were heterogeneous.
    citations:
      - PMID:39958339
      - PMID:31773448
  - claim_id: emerging-status
    statement: The branch-resolved model should remain emerging.
    disposition: RETAINED
    report_quote: Architecture supported; per-branch causality unresolved.
    rationale: >-
      The report supplies a defensible taxonomy and a useful experimental
      agenda, but no molecular persistence, selection, acquisition, tolerance,
      exposure, or sanctuary route is yet replicated as causal for a defined
      failure branch.

name: Pharmacogenomic Adverse Drug Reactions
display_name: Pharmacogenomic Adverse Drug Reactions (Inherited Determinants of Drug Toxicity)
creation_date: "2026-10-08T00:00:00Z"
description: >-
  A curated union of dismech entries in which a heritable (germline or
  mitochondrial) genetic determinant gates or substantially modifies an adverse
  reaction to a specific drug or drug class. Membership is keyed on that
  pharmacogenomic logic rather than on a shared mechanism, organ, or gene
  family: an HLA class I risk allele presenting a culprit drug to cytotoxic T
  cells (SJS/TEN), a drug-metabolising enzyme deficiency that lets a standard
  dose become toxic (DPYD and fluoropyrimidines, TPMT and thiopurines, NAT2 and
  isoniazid, UGT1A1 and irinotecan), an erythrocyte enzyme deficiency unmasked
  by oxidant drugs (G6PD), a calcium-release-channel variant triggered by
  volatile anaesthetics (malignant hyperthermia), and a mitochondrial rRNA
  variant sensitising the cochlea to aminoglycosides. The members span the skin,
  bone marrow, liver, erythrocyte, skeletal muscle and cochlea and share no
  mechanism or final common pathway; the only thing they have in common is the
  shape of the genotype-drug interaction, which is exactly what makes the family
  worth assembling as an auditable, queryable set. Each pairing is clinically
  actionable: pre-prescription genotyping, dose adjustment, or drug avoidance is
  recommended for every member.
grouping_basis:
- OTHER
grouping_rationale: >-
  Grouped on a shared genotype-drug interaction (a heritable variant is a
  clinically actionable determinant of an adverse drug reaction), not a shared
  mechanism, gene family, pathway, or phenotype — the members are deliberately
  heterogeneous on every one of those axes. This is the pharmacogenomic
  counterpart of the genetic-architecture groupings (Digenic and Oligogenic
  Disorders, Somatic Mosaic Disorders): the organising principle is the kind of
  gene-disease relationship, here a germline RISK_FACTOR or enzyme-deficiency
  determinant of drug toxicity, made explicit and queryable across the KB. The
  criteria are NECESSARY rather than NECESSARY_AND_SUFFICIENT: "a heritable
  variant modifies an adverse drug reaction" is a free-text constraint that no
  single ontology term captures, so it cannot be used to classify non-members
  automatically, and candidate additions are found by manual review rather than
  by the evaluator. The grouping does not assert that its members are otherwise
  related, and it is not a mechanism — the recurrent T-cell-mediated SCAR
  pathway shared by the two HLA members lives in the drug_hypersensitivity_scar
  mechanism module, which they both conform to. Boundary notes: the enzyme- or
  receptor-deficiency disorders (DPYD, TPMT, G6PD, RYR1/CACNA1S, UGT1A1) are
  members because a drug-response determinant is their clinically defining
  feature, not merely a footnote; Dihydropyrimidine Dehydrogenase Deficiency and
  5-Fluorouracil Poisoning are kept as separate members (the inherited enzyme
  disorder versus the fluoropyrimidine-toxicity entry it gates) rather than
  lumped, as are Stevens-Johnson Syndrome and its drug-specific
  Allopurinol-Induced instance.
membership_criteria:
- description: >-
    Every member is a dismech entry whose clinically defining or clinically
    actionable feature is a heritable (germline or mitochondrial) genetic
    determinant that gates or substantially modifies an adverse reaction to a
    specific drug or drug class — an HLA risk allele, a drug-metabolising or
    erythrocyte enzyme deficiency, a calcium-release-channel variant, or a
    mitochondrial rRNA variant. The constraint is the genotype-drug interaction
    itself; it is not captured by any single ontology term, so it is expressed
    as a free-text (OTHER) criterion and used only to audit the listed members,
    not to classify non-members.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      Member carries a curated heritable (germline or mitochondrial) variant
      that is a clinically actionable determinant of an adverse drug reaction
      (RISK_FACTOR HLA allele, or a drug-metabolising/erythrocyte enzyme or
      ion-channel deficiency gating drug toxicity).
members:
- member: Stevens-Johnson Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      HLA class I risk alleles (HLA-B*15:02 and HLA-A*31:01 for carbamazepine
      and other aromatic antiepileptics; HLA-B*58:01 for allopurinol) present
      the culprit drug to drug-specific cytotoxic T cells, driving the
      T-cell-mediated severe cutaneous adverse reaction. The broad,
      multi-culprit SCAR entry; conforms to the drug_hypersensitivity_scar
      module.
- member: Allopurinol-Induced Stevens-Johnson Syndrome/Toxic Epidermal Necrolysis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      HLA-B*58:01 presents allopurinol's metabolite oxypurinol to cytotoxic T
      cells; the drug-specific SCAR instance (allopurinol/oxypurinol culprit),
      with pre-prescription HLA-B*58:01 screening recommended in Asian
      populations. Also conforms to the drug_hypersensitivity_scar module.
- member: Dihydropyrimidine Dehydrogenase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Germline loss-of-function DPYD variants (e.g. DPYD*2A, c.1679T>G,
      HapB3) impair catabolism of fluoropyrimidines (5-fluorouracil,
      capecitabine), so a standard dose becomes severely toxic; the inherited
      enzyme-deficiency disorder behind fluoropyrimidine toxicity, for which
      upfront DPYD genotyping with dose reduction is recommended.
- member: 5-Fluorouracil Poisoning
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The fluoropyrimidine-toxicity entry gated by DPYD activity: reduced
      dihydropyrimidine dehydrogenase lets systemic 5-FU accumulate, producing
      mucositis, myelosuppression and neurotoxicity. Kept distinct from the
      DPYD enzyme-deficiency disorder it is the drug-poisoning counterpart of.
- member: Thiopurine S-methyltransferase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Low-activity TPMT (and NUDT15) alleles shunt thiopurines (azathioprine,
      6-mercaptopurine) toward cytotoxic thioguanine nucleotides, causing
      dose-dependent myelosuppression; CPIC provides genotype-guided starting
      doses.
- member: Glucose-6-Phosphate Dehydrogenase (G6PD) Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      X-linked G6PD deficiency leaves erythrocytes unable to regenerate NADPH,
      so oxidant drugs (primaquine, rasburicase, dapsone, some sulfonamides)
      and fava beans precipitate acute hemolytic anemia; drug avoidance is the
      actionable pharmacogenomic consequence.
- member: Isoniazid Toxicity
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      NAT2 slow-acetylator genotypes prolong isoniazid exposure, raising the
      risk of hepatotoxicity and peripheral neuropathy; a drug-metabolism
      pharmacogenomic determinant of toxicity rather than an HLA or enzyme-null
      disorder.
- member: Malignant hyperthermia of anesthesia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Gain-of-function RYR1 (and CACNA1S) variants cause uncontrolled
      sarcoplasmic calcium release when triggered by volatile anaesthetics and
      succinylcholine, producing a hypermetabolic crisis; the pharmacogenomic
      determinant is a calcium-release-channel variant, and avoidance of
      triggering agents is the action.
- member: Aminoglycoside-Induced Hearing Loss
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The mitochondrial 12S rRNA variant MT-RNR1 m.1555A>G makes the ribosome
      resemble its bacterial target, sensitising cochlear hair cells to
      aminoglycoside ototoxicity even at normal doses; a maternally inherited
      pharmacogenomic determinant for which aminoglycoside avoidance is advised.
- member: Gilbert's Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Reduced UGT1A1 activity (UGT1A1*28) lowers glucuronidation capacity, so
      drugs cleared by this route — notably irinotecan (its active metabolite
      SN-38) and atazanavir — accumulate; the benign unconjugated
      hyperbilirubinemia doubles as a pharmacogenomic risk factor for
      irinotecan toxicity.

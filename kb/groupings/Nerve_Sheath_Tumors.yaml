name: Nerve Sheath Tumors
display_name: Nerve sheath tumours
creation_date: '2026-11-11T20:00:00Z'
description: >-
  Neoplasms arising from the cells that ensheath peripheral nerves. Every member
  curated here binds the Schwann cell as a cell type in its pathophysiology, and
  every member's disease term sits inside the MONDO nerve sheath neoplasm class.
  The group spans the benign end (schwannoma, and its commonest site-specific
  form, acoustic neuroma), the mixed-cellularity neurofibroma, the granular cell
  tumour, and the malignant peripheral nerve sheath tumour that neurofibroma can
  transform into.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
grouping_rationale: >-
  The axis is the cell of origin rather than a gene, a pathway or a clinical
  presentation: these tumours are grouped because they arise from the nerve
  sheath, which is what the MONDO class they all sit under asserts and what
  their shared Schwann cell binding records. The group deliberately excludes the
  tumour-predisposition syndromes that cause several of them - neurofibromatosis
  type 1, NF2-related schwannomatosis, schwannomatosis and
  neurofibromatosis-Noonan syndrome. They are germline syndromes rather than
  nerve sheath neoplasms, and the cancer granularity ladder keeps a
  predisposition syndrome separate from the tumours it predisposes to.

  One of the four is inside the mapped class and is excluded anyway, which is
  worth stating rather than glossing. MONDO makes schwannomatosis
  (MONDO:0008075) a direct subclass of schwannoma, so it is an is-a descendant
  of MONDO:0002547, and the dismech entry binds the Schwann cell six times in
  its pathophysiology - it satisfies both of this grouping's necessary criteria.
  It is left out because MONDO is there classifying a germline syndrome by the
  tumour it produces, and because excluding it keeps it together with
  NF2-related schwannomatosis, which MONDO does not place inside the class.
  Anyone wanting the syndromes grouped should make that a separate grouping
  rather than widening this one.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002547
      label: nerve sheath neoplasm
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept is the MONDO nerve sheath neoplasm class. Each
      member's own disease term was resolved to its ancestors against the local
      MONDO build and MONDO:0002547 was found in every one. The predicate is a
      claim about the concept, not a claim that membership exhausts the class:
      MONDO descendants with no dismech entry are curation gaps, and the two
      descendants dismech does curate without listing them here are accounted
      for - schwannomatosis in grouping_rationale, congenital epulis in notes.
membership_criteria:
- description: >-
    A disorder belongs to the nerve sheath tumours if it is a neoplasm of the
    peripheral nerve sheath: its disease term is an is-a descendant of
    MONDO:0002547 (nerve sheath neoplasm).
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_MAPPING
    description: >-
      Disease term is an is-a descendant of MONDO:0002547 (nerve sheath
      neoplasm). Checked for each member by resolving its own term's ancestors
      against the local MONDO build rather than by expanding the class.
- description: >-
    Every member additionally binds the Schwann cell (CL:0002573) as a cell type
    in its pathophysiology, which is the lineage the group is named for. This is
    recorded as a defining description rather than as machine-evaluable logic
    because the criterion vocabulary has no cell-type predicate, and because
    neurofibroma binds fibroblast, mast cell and macrophage alongside the Schwann
    cell - its mixed cellularity is a feature of the tumour, not a departure from
    the group.
  criteria_semantics: NECESSARY
members:
- member: Schwannoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The benign, usually encapsulated tumour the others are told apart from,
      composed almost entirely of neoplastic Schwann cells. Both hedges are the
      entry's own.
- member: Acoustic Neuroma
  member_type: DISEASE
  display_name: Acoustic neuroma (vestibular schwannoma)
  differentiating_mechanisms:
  - description: >-
      A schwannoma of the vestibulocochlear nerve, and so a site-specific form of
      another member rather than a separate lineage; MONDO places its term
      directly under schwannoma. It is listed in its own right because dismech
      curates it as its own entry, with the hearing and balance consequences that
      the site, not the histology, produces.
- member: Neurofibroma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The mixed-cellularity member: Schwann cells alongside fibroblasts, mast
      cells and macrophages, rather than the almost purely Schwann-cell
      population of a schwannoma. It is also the only member whose malignant
      counterpart is itself a member of this group, which the malignant
      peripheral nerve sheath tumour row records from the other end. Granular
      cell tumour has a malignant form too, but carries it as its own subtype
      rather than as a separate member.
- member: Malignant Peripheral Nerve Sheath Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The only malignant member. Its own entry puts about half of cases in the
      setting of neurofibromatosis type 1, where the usual route is
      transformation of a pre-existing plexiform or atypical neurofibroma, and
      carries the remainder as declared sporadic and radiation-associated
      subtypes. So transformation from a neurofibroma is one route of roughly
      two rather than the majority one, and this is the only member whose own
      entry models arising de novo as a named facet.
- member: Granular Cell Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Granular cell morphology from lysosome accumulation, which no other member
      shows, on the same Schwann-cell lineage. Usually benign and most often of
      the tongue or skin rather than of a named nerve trunk.
notes: >-
  Congenital epulis (MONDO:0015528) is the other curated descendant of the
  mapped class that is not a member, and it is the case that shows the Schwann
  cell criterion doing real work. That entry binds no Schwann cell at all and
  records that the lesion lacks S-100 expression, favouring a non-neural origin.
  MONDO's placement and the histology disagree, and the criterion follows the
  histology.

  Perineurioma (MONDO:0019404) is a live descendant with no dismech entry and
  belongs here once curated, as do its subtypes such as reticular perineurioma
  (MONDO:0015029). The hybrid nerve sheath tumours of the WHO classification are
  deliberately not named as a gap - MONDO has no class for them, so there is no
  term to curate against. In MONDO the phrase occurs only inside the definition
  of 22q-related schwannomatosis.

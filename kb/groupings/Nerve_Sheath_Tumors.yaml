name: Nerve Sheath Tumors
display_name: Nerve sheath tumours
creation_date: '2026-11-11T20:00:00Z'
description: >-
  Neoplasms arising from the cells that ensheath peripheral nerves. Every member
  curated here binds a nerve sheath cell (the Schwann cell, or for perineurioma
  the perineurial cell) as a cell type in its pathophysiology, and every
  member's disease term sits inside the MONDO nerve sheath neoplasm class. The
  group spans the benign end (schwannoma, and its commonest site-specific form,
  acoustic neuroma), the mixed-cellularity neurofibroma, the granular cell
  tumour, perineurioma (the tumour of perineurial cells), the melanin-producing
  malignant melanotic nerve sheath tumour, and the malignant peripheral nerve
  sheath tumour that neurofibroma can transform into.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
grouping_rationale: >-
  The axis is the cell of origin rather than a gene, a pathway or a clinical
  presentation: these tumours are grouped because they arise from the nerve
  sheath, which is what the MONDO class they all sit under asserts and what
  their nerve sheath cell bindings record. The group deliberately excludes the
  tumour-predisposition syndromes that cause several of them; these include
  neurofibromatosis type 1, NF2-related schwannomatosis, schwannomatosis and
  neurofibromatosis-Noonan syndrome. They are germline syndromes rather than
  nerve sheath neoplasms, and the cancer granularity ladder keeps a
  predisposition syndrome separate from the tumours it predisposes to.

  One of these four is inside the mapped class and is excluded anyway, which is
  worth stating rather than glossing. MONDO makes schwannomatosis
  (MONDO:0008075) a direct subclass of schwannoma, so it is an is-a descendant
  of MONDO:0002547, and the dismech entry binds the Schwann cell six times in
  its pathophysiology - it satisfies both of this grouping's necessary criteria.
  It is left out because MONDO is there classifying a germline syndrome by the
  tumour it produces, and because excluding it keeps it together with
  NF2-related schwannomatosis, which MONDO does not place inside the class.
  Anyone wanting the syndromes grouped should make that a separate grouping
  rather than widening this one.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002547
      label: nerve sheath neoplasm
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept is the MONDO nerve sheath neoplasm class. Each
      member's own disease term was resolved to its ancestors against the local
      MONDO build and MONDO:0002547 was found in every one. The predicate is a
      claim about the concept, not a claim that membership exhausts the class:
      MONDO descendants with no dismech entry are curation gaps, and the two
      descendants dismech does curate without listing them here are accounted
      for - schwannomatosis in grouping_rationale, congenital epulis in notes.
membership_criteria:
- description: >-
    A disorder belongs to the nerve sheath tumours if it is a neoplasm of the
    peripheral nerve sheath: its disease term is an is-a descendant of
    MONDO:0002547 (nerve sheath neoplasm).
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_MAPPING
    description: >-
      Disease term is an is-a descendant of MONDO:0002547 (nerve sheath
      neoplasm). Checked for each member by resolving its own term's ancestors
      against the local MONDO build rather than by expanding the class.
- description: >-
    Every member additionally binds a nerve sheath cell as a cell type in its
    pathophysiology: the Schwann cell (CL:0002573), the lineage of every member
    but one, or the perineurial cell (CL:0002576), the specialised lining cell
    of the nerve sheath and the lineage of perineurioma. This is recorded as a
    defining description rather than as machine-evaluable logic because the
    criterion vocabulary has no cell-type predicate, and because neurofibroma
    binds fibroblast, mast cell and macrophage alongside the Schwann cell - its
    mixed cellularity is a feature of the tumour, not a departure from the
    group. The criterion still excludes congenital epulis, which binds neither
    cell (see notes).
  criteria_semantics: NECESSARY
members:
- member: Schwannoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The benign, usually encapsulated tumour the others are told apart from,
      composed almost entirely of neoplastic Schwann cells. Both hedges are the
      entry's own.
- member: Acoustic Neuroma
  member_type: DISEASE
  display_name: Acoustic neuroma (vestibular schwannoma)
  differentiating_mechanisms:
  - description: >-
      A schwannoma of the vestibulocochlear nerve, and so a site-specific form of
      another member rather than a separate lineage; MONDO places its term
      directly under schwannoma. It is listed in its own right because dismech
      curates it as its own entry, with the hearing and balance consequences that
      the site, not the histology, produces.
- member: Neurofibroma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The mixed-cellularity member: Schwann cells alongside fibroblasts, mast
      cells and macrophages, rather than the almost purely Schwann-cell
      population of a schwannoma. The malignant counterpart of neurofibroma is
      itself a member of this group, which the malignant peripheral nerve sheath
      tumour row records from the other end. Granular cell tumour and
      perineurioma have malignant forms too, but carry them as subtypes rather
      than as separate members.
- member: Malignant Peripheral Nerve Sheath Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Its own entry puts about half of cases in the setting of neurofibromatosis
      type 1, where the usual route is transformation of a pre-existing
      plexiform or atypical neurofibroma, and carries the remainder as declared
      sporadic and radiation-associated subtypes. So transformation from a
      neurofibroma is one route of roughly two rather than the majority one. The
      malignant peripheral nerve sheath tumour is one of the two malignant
      members; the other is the malignant melanotic nerve sheath tumour.
- member: Granular Cell Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Granular cell morphology from lysosome accumulation, which no other member
      shows, on the same Schwann-cell lineage. Usually benign and most often of
      the tongue or skin rather than of a named nerve trunk.
- member: Perineurioma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The one member of perineurial rather than Schwann cell lineage, meeting
      the second criterion through the perineurial cell. It has an intraneural
      form, which grows inside a nerve and causes a slowly progressive,
      motor-predominant neuropathy, usually of one nerve and sometimes of a
      plexus, in children and young adults, and a soft tissue form outside
      nerves, with sclerosing and reticular variants. Both forms behave
      benignly, though the soft tissue form rarely recurs. Malignant
      perineurioma is rare, and whether it is a distinct tumour is disputed; the
      entry carries it as a subtype and records it as a malignant peripheral
      nerve sheath tumour with perineurial differentiation, which its sources
      class within that tumour, though MONDO does not place it there.
- member: Malignant Melanotic Nerve Sheath Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A tumour of Schwann cells that make melanin. Formerly called melanotic
      schwannoma, it was renamed and redefined as potentially aggressive in the
      2020 and 2021 WHO classifications, which treat it as a distinct tumour
      rather than a variant of schwannoma; its own entry records frequent
      recurrence and metastasis. MONDO splits the tumour between two classes:
      the entry's term, melanotic neurilemmoma, under schwannoma, and malignant
      melanocytic neoplasm of the peripheral nerve sheath (MONDO:0003863) under
      malignant peripheral nerve sheath tumor; the entry maps the second as a
      close match. The schwannoma entry also lists the tumour, under its former
      name, as the histologic subtype Melanotic/Psammomatous Schwannoma.
notes: >-
  Congenital epulis (MONDO:0015528) is the other curated descendant of the
  mapped class that is not a member, and it is the case that shows the nerve
  sheath cell criterion doing real work. That entry binds no Schwann or
  perineurial cell at all and records that the lesion lacks S-100 expression,
  favouring a non-neural origin. S-100 negativity alone would not set it apart,
  since perineurioma is mostly S-100-negative too; the exclusion rests on the
  cells the entry binds. MONDO's placement and the histology disagree, and the
  criterion follows the histology.

  The hybrid nerve sheath tumours of the WHO classification are deliberately not
  named as a gap - MONDO has no class for them, so there is no term to curate
  against. In MONDO the phrase occurs only inside the definition of 22q-related
  schwannomatosis.

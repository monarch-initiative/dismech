name: FIG4-Related Disorders
display_name: FIG4-related disorders
creation_date: '2026-11-19T00:00:00Z'
description: >-
  The disorders caused by, or associated with, variants in FIG4. FIG4 is the
  phosphoinositide 5-phosphatase that sits with the scaffold VAC14 and the
  kinase PIKFYVE in the complex that makes and turns over
  phosphatidylinositol 3,5-bisphosphate, PI(3,5)P2, on endolysosomal
  membranes. Four named conditions carry FIG4 as their cause in MONDO.
  Yunis-Varon syndrome is a severe, often lethal skeletal dysplasia with
  global central nervous system involvement, caused by two null alleles.
  Charcot-Marie-Tooth disease type 4J is a recessive, early-onset motor and
  sensory neuropathy in which at least one allele is hypomorphic, most often
  p.Ile41Thr. Bilateral parasagittal parieto-occipital polymicrogyria is a
  recessive cortical malformation with epilepsy and psychiatric features,
  described in one consanguineous family homozygous for a missense variant.
  Amyotrophic lateral sclerosis type 11 is the adult motor neuron disease
  associated with heterozygous deleterious FIG4 alleles. The recessive
  conditions are increasingly described as points on one continuum of residual
  FIG4 function rather than as separate diseases.
grouping_basis:
- SHARED_GENE_FAMILY
grouping_rationale: >-
  The axis is a single gene, so SHARED_GENE_FAMILY fits: every member binds
  FIG4 as its causal or risk gene. The knowledge base files the four
  conditions in three different places. Yunis-Varon syndrome and the
  polymicrogyria are their own Disease entries. CMT4J is a subtype row of
  Charcot-Marie-Tooth Disease Type 4, beside the other recessive CMT genes,
  because CMT4 is one clinical neuropathy with many causal genes. ALS11 is a
  subtype row of Amyotrophic Lateral Sclerosis, beside the other ALS loci.
  Each of those placements follows the phenotype. This grouping lets a reader
  who starts from the gene find all four without merging the entries.


  The members are kept separate rather than lumped because they differ in
  genotype class, onset, the organ systems involved, and inheritance. The
  recessive members are ordered by how much FIG4 function survives: two null
  alleles give Yunis-Varon syndrome, while one hypomorphic allele gives CMT4J,
  where disease was originally described as confined to peripheral nerve.
  Later cohorts describe intermediate patients with both central and
  peripheral involvement, and a pediatric cohort of 14 children with biallelic
  variants found a continuous spectrum in which most children had a severe
  neurodevelopmental disorder rather than the classic neuropathy. That cohort
  is the reason to treat the recessive members as a continuum, and the reason
  the boundaries between them are gradients rather than sharp lines.


  ALS11 is included, but it sits apart from that continuum. It is associated
  with a single heterozygous allele, it is adult-onset, and the reports frame
  it as a risk relationship rather than Mendelian causation. It is a member
  because MONDO names it as a FIG4 disease and it shares the gene, not because
  it lies on the recessive severity gradient.
membership_criteria:
- description: >-
    A member is a disease or disease subtype whose entry binds FIG4
    (hgnc:16873) as a causal or risk gene on the member's own row, and which
    MONDO attributes to FIG4. The gene check reads entry-level bindings, so it
    cannot tell a member's subtype row from a sibling row in the same parent
    entry; that half of the criterion is a curator's judgement.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_GENE
    description: FIG4 is bound as a gene in the member's entry.
    gene:
      preferred_term: FIG4
      term:
        id: hgnc:16873
        label: FIG4
members:
- member: Yunis-Varon Syndrome
  member_type: DISEASE
  display_name: Yunis-Varon syndrome
  differentiating_mechanisms:
  - description: >-
      The null end of the recessive FIG4 series. Two null alleles leave no
      FIG4 function, and the result is a skeletal dysplasia (cleidocranial
      dysplasia, digital anomalies) with global central nervous system
      involvement, and is often lethal. No other member has the skeletal
      dysplasia.
    gene:
      preferred_term: FIG4
      term:
        id: hgnc:16873
        label: FIG4
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that homozygosity or compound heterozygosity for null mutations of FIG4 is responsible for YVS, the most severe known human phenotype caused by defective phosphoinositide metabolism."
    explanation: >-
      Places Yunis-Varon syndrome at the null, most severe end of the FIG4
      allelic series.
  - reference: PMID:32268254
    reference_title: "FIG4 mutations leading to parkinsonism and a phenotypical continuum between CMT4J and Yunis Varón syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study extends the phenotypic spectrum of FIG4-related disease to Parkinsonism as a feature and demonstrates new phenotypes on a continuum between CMT4J and Yunis Varón syndrome."
    explanation: >-
      Describes patients whose phenotypes fall between CMT4J and Yunis-Varon
      syndrome, so the line between these two members is a gradient.
- member: Charcot-Marie-Tooth Disease Type 4
  member_type: SUBTYPE
  display_name: Charcot-Marie-Tooth disease type 4J (CMT4J)
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease type 4J
    term:
      id: MONDO:0012640
      label: Charcot-Marie-Tooth disease type 4J
  differentiating_mechanisms:
  - description: >-
      The hypomorphic end of the recessive series. At least one allele keeps
      some function, most often the recurrent p.Ile41Thr missense variant
      paired with a null allele. The core disease is an early-onset motor and
      sensory neuropathy with mixed demyelinating and axonal features. In
      children, p.Ile41Thr homozygotes are the mildest, while compound
      heterozygotes range widely depending on the second allele.
    gene:
      preferred_term: FIG4
      term:
        id: hgnc:16873
        label: FIG4
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, in Charcot-Marie-Tooth disease type 4J (also caused by FIG4 mutations), one of the FIG4 alleles is hypomorphic and disease is limited to the peripheral nervous system."
    explanation: >-
      States the original genotype rule separating CMT4J from Yunis-Varon
      syndrome: one hypomorphic allele, disease confined to peripheral nerve.
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients homozygous for p.Ile41Thr (n = 2; Patients 2 and 8) presented with a milder phenotype and slower disease progression"
    explanation: >-
      In the pediatric cohort, homozygosity for the recurrent hypomorphic
      allele gave the mildest course, consistent with residual function
      setting severity.
- member: Bilateral Parasagittal Parieto-occipital Polymicrogyria
  member_type: DISEASE
  display_name: Bilateral parasagittal parieto-occipital polymicrogyria (FIG4)
  differentiating_mechanisms:
  - description: >-
      A cortical malformation rather than a neuropathy or skeletal dysplasia:
      posterior polymicrogyria with epilepsy and psychiatric features, caused
      by a homozygous missense variant (p.Asp783Val) in one consanguineous
      family. It is the only member defined by a structural brain
      malformation. Polymicrogyria was not seen in any child of the pediatric
      FIG4 cohort, so it is not a common feature of the wider spectrum.
    gene:
      preferred_term: FIG4
      term:
        id: hgnc:16873
        label: FIG4
  evidence:
  - reference: PMID:24598713
    reference_title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study extends the spectrum of phenotypes associated with FIG4 mutations to include cortical malformation associated with seizures and psychiatric manifestations, in addition to the previously described Charcot-Marie-Tooth disease type 4J and Yunis-Varón syndrome."
    explanation: >-
      Adds the cortical malformation to the FIG4 phenotype spectrum alongside
      CMT4J and Yunis-Varon syndrome.
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients showed polymicrogyria or hypoplasia of the corpus callosum and/or cerebellar vermis."
    explanation: >-
      Among the nine cohort children who had brain MRI, none had
      polymicrogyria, so this member's defining feature is not shared across
      the recessive spectrum.
- member: Amyotrophic Lateral Sclerosis
  member_type: SUBTYPE
  display_name: Amyotrophic lateral sclerosis type 11 (ALS11)
  disease_term:
    preferred_term: amyotrophic lateral sclerosis type 11
    term:
      id: MONDO:0012945
      label: amyotrophic lateral sclerosis type 11
  differentiating_mechanisms:
  - description: >-
      The only member associated with a single heterozygous FIG4 allele, and
      the only adult-onset one. It is a motor neuron disease (ALS or primary
      lateral sclerosis), and the association is reported as a risk factor
      rather than Mendelian causation.
    gene:
      preferred_term: FIG4
      term:
        id: hgnc:16873
        label: FIG4
  evidence:
  - reference: PMID:19118816
    reference_title: "Deleterious variants of FIG4, a phosphoinositide phosphatase, in patients with ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for a deleterious allele of FIG4 appears to be a risk factor for ALS and PLS, extending the list of known ALS genes and increasing the clinical spectrum of FIG4-related diseases."
    explanation: >-
      Frames the ALS association as heterozygous risk, which is what sets this
      member apart from the recessive members.
discussions:
- discussion_id: fig4_pediatric_neurodevelopmental_phenotype
  prompt: >-
    Is the neurodevelopmental-dominant form of recessive FIG4 deficiency in
    children a disease in its own right, or a part of CMT4J or Yunis-Varon
    syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    In an international cohort of 14 children with biallelic FIG4 variants,
    eight had a neurodevelopmental-dominant phenotype, often with a movement
    disorder, three had a complex phenotype combining severe neuropathy with
    central involvement, two had a classical CMT-like neuropathy, and one was
    too young to classify. The authors read these as points on one continuum
    rather than as separate syndromes. None of the neurodevelopmental children
    is described with the skeletal dysplasia of Yunis-Varon syndrome, and most
    do not present as a neuropathy, so neither named member fits them well.
    MONDO has no class for this form. Its FIG4 diseases are the four members
    of this grouping. The open question is whether this form should be
    curated as a separate entry, which would first need a MONDO new-term
    request, or recorded on the existing members. The authors' own threshold
    model suggests one reading: a little residual FIG4 activity may be enough
    for peripheral nerve but not for brain development. That model is stated
    as a hypothesis, and the cohort was too small for formal genotype-phenotype
    statistics.
  evidence:
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluating 14 pediatric FIG4 patients revealed a continuous phenotypic spectrum rather than the clinical entities previously described in the literature."
    explanation: >-
      The cohort's main finding: the children do not divide into the named
      FIG4 entities.
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia was most common (5 patients, 35.7%), followed by bradykinesia and gait ataxia (3 patients each, 21.4%)."
    explanation: >-
      Movement disorders, which neither CMT4J nor Yunis-Varon syndrome is
      defined by, were frequent in the cohort.
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe intellectual disability was exclusively observed in patients with homozygous truncating mutations or compound heterozygous variants associated with an overall severe disease course."
    explanation: >-
      Ties the severe central phenotype to the genotypes with the least
      residual function.
  - reference: PMID:42974926
    reference_title: "Clinical Variability and Genotype Driven Outcomes in an International Cohort of 14 Pediatric FIG4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "minimal remaining function may suffice for PI(3,5)P2 synthesis and turnover for peripheral nerve maintenance but be inadequate for normal brain development."
    explanation: >-
      The authors' proposed threshold model for why central and peripheral
      involvement separate. Recorded as their hypothesis, not as an
      established mechanism.
notes: >-
  Four kb/ entries bind FIG4 (hgnc:16873) on a disease or subtype row, and all
  four are members: Yunis-Varon_Syndrome,
  Bilateral_Parasagittal_Parieto-occipital_Polymicrogyria, the CMT4J row of
  Charcot-Marie-Tooth_Disease_Type_4, and the ALS11 row of
  Amyotrophic_Lateral_Sclerosis. These are also the four diseases MONDO links
  to FIG4 with RO:0004003. MONDO has no grouping class for FIG4 disease, so
  this grouping carries no MONDO mapping.


  ClinGen classifies FIG4 as Definitive (autosomal recessive) for
  Charcot-Marie-Tooth disease (MONDO:0015626) and Limited (autosomal
  dominant) for amyotrophic lateral sclerosis type 11 (MONDO:0012945). Those
  grades match the split drawn in grouping_rationale between the recessive
  continuum and the heterozygous risk member.

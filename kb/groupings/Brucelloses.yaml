name: Brucelloses
display_name: The brucelloses (species-specific human Brucella infections)
creation_date: "2026-10-24T00:00:00Z"
description: >-
  The brucelloses are the human diseases caused by the individual Brucella
  species. Every member is the same kind of disease - a zoonotic, facultatively
  intracellular bacterial infection acquired from a livestock reservoir, which
  persists inside host phagocytes, colonizes the reticuloendothelial system and
  produces a relapsing febrile illness treated with prolonged combinations of
  intracellularly active antibiotics. They are nonetheless curated as separate
  Disease entries because each species has its own animal reservoir and
  exposure route, and because the clinical and laboratory picture differs by
  infecting species.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped on the conserved mechanism that every human Brucella infection runs:
  zoonotic acquisition from an animal reservoir, survival and replication
  inside host phagocytes, persistent colonization of the reticuloendothelial
  system, and a therapeutic vulnerability that is a consequence of that niche -
  only antibiotics that accumulate intracellularly are effective, so regimens
  are prolonged combinations of doxycycline with rifampicin or an
  aminoglycoside rather than the cell-wall-active drugs used for most other
  bacterial infections. That gating principle is the
  intracellular_pathogen_persistence module, which every member conforms to.

  The members are deliberately kept as separate Disease entries rather than
  merged, on the two axes design decisions 3e requires. Reservoir and
  transmission differ by species: B. abortus is maintained in cattle and
  reaches humans through bovine tissue, reproductive material, bovine dairy and
  laboratory aerosols, while B. melitensis is maintained in sheep and goats and
  reaches humans mainly through small-ruminant dairy. Presentation differs too:
  a cohort that typed the infecting species by PCR in acute cases found
  distinct clinical and laboratory profiles for the two species rather than one
  being a milder version of the other. First-line therapy is not an axis here -
  brucellosis regimens are recommended at genus level and are shared across the
  members.

  Scope. This grouping covers the species-specific human brucelloses. The
  parent Brucellosis entry is not a member: it is the genus-level clinical
  entity the members are strata of, and it carries the genus-level clinical,
  diagnostic and therapeutic picture. Animal brucellosis - bovine abortion
  disease, ovine epididymitis - is out of scope; it appears in the members only
  as the reservoir that exposes humans.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005683
      label: brucellosis
    mapping_predicate: skos:narrowMatch
    mapping_source: DISMECH
    mapping_justification: >-
      narrowMatch rather than exactMatch: every member is a Brucella infection
      of humans and so sits inside the MONDO brucellosis class, but the class
      also covers genus-level and unspecified human brucellosis, which is
      curated as the separate parent Disease entry Brucellosis and is not a
      member here. The exactMatch on MONDO:0005683 belongs to that entry.
membership_criteria:
- description: >-
    A disease belongs to the brucelloses if it is a human infection caused by a
    named Brucella species AND it conforms to the intracellular-persistence
    mechanism that gates brucellosis therapy - that is, its pathophysiology
    records the phagocyte niche that excludes poorly cell-penetrant
    antibiotics.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: OTHER
      description: >-
        Caused by a named Brucella species (for example Brucella abortus or
        Brucella melitensis), rather than by the genus without species
        attribution.
    - criterion_predicate: CONFORMS_TO_MODULE
      module: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
      description: >-
        Has a pathophysiology node conforming to the intracellular niche that
        excludes beta-lactams, the gating principle behind every brucellosis
        regimen.
members:
- member: Brucella Abortus Brucellosis
  member_type: DISEASE
  display_name: Brucella abortus brucellosis
  differentiating_mechanisms:
  - description: >-
      Maintained in cattle, where infection of reproductive tissue drives
      shedding from aborted material, so human exposure is to bovine tissue,
      reproductive fluids, bovine dairy or laboratory cultures rather than to
      small-ruminant dairy. In acute cases typed by PCR, fatigue, arthralgia
      and sweating were reported in a higher proportion of B. abortus patients
      than of B. melitensis patients.
- member: Brucella Melitensis Brucellosis
  member_type: DISEASE
  display_name: Brucella melitensis brucellosis
  differentiating_mechanisms:
  - description: >-
      Maintained in sheep and goats, with human exposure mainly through
      small-ruminant dairy, fresh milk and household livestock contact. The
      entry carries the osteoarticular, cardiac and genitourinary focal
      complications and the VirB-dependent replicative-vacuole and
      Omp25-dependent immune-evasion mechanisms in species-specific detail,
      and in PCR-typed acute cases depressed eosinophils and raised CRP were
      more frequent than in B. abortus cases.
    module: intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials
references:
- reference: PMID:41260186
  title: The clinical manifestations and laboratory test results of Brucella melitensis and Brucella abortus in acute brucellosis patients.
  findings:
  - statement: >-
      The two curated members produce different clinical and laboratory
      pictures in humans, which is the presentation axis on which they are
      grouped but not merged.
    supporting_text: >-
      Brucella abortus and B. melitensis just result in different clinical
      manifestations and laboratory test results in humans.
notes: >-
  Boundary and evaluation notes.

  How the advisory evaluator reads these criteria. The OTHER leaf ("caused by a
  named Brucella species") is not machine-evaluable, so the conjunction it
  sits in cannot resolve to SATISFIED however complete the members are;
  `just check-groupings` reports the members as UNKNOWN rather than SATISFIED,
  which is the correct three-valued answer and not a defect in the members. The
  CONFORMS_TO_MODULE arm is satisfied by both members. As CLAUDE.md records,
  the module anchor is checked as a foreign key but not used as a membership
  verdict, so a member conforming to intracellular_pathogen_persistence at its
  other node also satisfies that leaf.

  No SUFFICIENT criteria block is provided. "Caused by a named Brucella
  species" is close to definitional, but encoding it as SUFFICIENT would invite
  the classifier to propose animal brucellosis entries and the genus-level
  parent as candidate members, and the boundary this grouping draws excludes
  both. That boundary is recorded in the rationale instead.

  The criteria use an OTHER leaf because CriterionPredicateEnum has no
  infectious-agent predicate. A HAS_INFECTIOUS_AGENT predicate taking an
  NCBITaxon-bound infectious_agent_term would make this criterion checkable
  against each member's infectious_agent block and would generalize to any
  infectious-disease grouping; the Treponematoses grouping records the same
  gap.

  Membership is incomplete by construction. B. suis, B. canis and the marine
  Brucella species cause human disease and would be members once curated; only
  the two species with their own dismech entries are listed, and this file
  should gain a row when another is curated.

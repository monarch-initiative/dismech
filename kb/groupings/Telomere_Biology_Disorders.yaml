name: Telomere Biology Disorders
display_name: Telomere Biology Disorders (short telomere syndromes)
creation_date: "2026-11-05T17:00:00Z"
description: >-
  The telomere biology disorders, also called short telomere syndromes, are
  inherited diseases in which defective telomere maintenance leaves
  constitutionally short telomeres. Short telomeres limit the replicative
  capacity of high-turnover tissues, and the shared result is bone marrow
  failure, the mucocutaneous triad of dyskeratosis congenita (nail dystrophy,
  reticulated skin pigmentation, oral leukoplakia), pulmonary and hepatic
  fibrosis, and cancer predisposition. The lesion can sit in telomerase
  (its components and biogenesis factors), in the shelterin complex that caps
  the telomere, or upstream of telomere synthesis altogether.
grouping_basis:
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on a shared mechanism: every member has a curated pathophysiology
  node in which telomere maintenance (GO:0000723) is disrupted, and four of the
  five conform to the telomere_attrition module. The members stay separate
  entries because they differ in the defective step and in how they are
  curated. Dyskeratosis Congenita is the lumped classic syndrome, with the
  telomerase, shelterin and biogenesis genes as subtypes. The NHP2 and PARN
  autosomal recessive forms, digenic TYMS/ENOSF1 disease and Revesz syndrome
  have their own entries, each for a reason recorded in that entry: a distinct
  biogenesis step, a nucleotide-supply defect rather than a telomere-machinery
  defect, or a severe infantile presentation with exudative retinopathy.


  Three entries that mention telomeres are deliberately not members. Bone
  Marrow Failure Syndrome 6 (MDM4) can show short telomeres, but its curated
  mechanism is constitutive p53 activation, so the telomere finding is
  secondary. POT1 Tumor Predisposition Syndrome is a telomere disorder in the
  opposite direction, with long telomeres and cancer rather than marrow
  failure. Idiopathic Pulmonary Fibrosis is a complex disease in which
  telomere genes explain only a minority of cases.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100137
      label: telomere syndrome
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO defines telomere syndrome (synonym "short telomere syndrome") as
      accelerated aging syndromes often caused by inheritable mutations that
      decrease telomere length, which is this grouping's concept. closeMatch
      rather than exactMatch because MONDO's subclass tree does not follow its
      definition (see consistency).
    consistency:
    - reference: MONDO
      consistent: INCONSISTENT
      notes: >-
        None of the five members' disease terms (MONDO:0015780,
        MONDO:0013519, MONDO:0014600, MONDO:0031057, MONDO:0009990) is a
        descendant of MONDO:0100137 according to OLS hierarchicalAncestors.
        Conversely, MONDO's 35 descendants include primary biliary cholangitis
        1-5, immunodeficiency-centromeric instability-facial anomalies (ICF)
        syndrome 1-4 and familial cirrhosis, which are not short telomere
        syndromes. Its descendants that do belong here are the
        telomere-related pulmonary fibrosis and/or bone marrow failure forms,
        autosomal dominant dyskeratosis congenita 1 and 6, and Coats plus,
        which the KB curates as Dyskeratosis Congenita subtypes or has not yet
        curated.
membership_criteria:
- description: >-
    A member has a curated pathophysiology node in which telomere maintenance
    is disrupted. Stated on the GO process rather than on the
    telomere_attrition module, because digenic dyskeratosis congenita reaches
    telomere shortening through a nucleotide-supply defect and does not
    conform to that module.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_BIOLOGICAL_PROCESS
    description: Telomere maintenance is disrupted.
    biological_processes:
    - preferred_term: telomere maintenance
      term:
        id: GO:0000723
        label: telomere maintenance
members:
- member: Dyskeratosis Congenita
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The classic syndrome, curated as one entry with the telomerase
      component, biogenesis and shelterin genes as subtypes; X-linked DKC1
      (dyskerin) disease is the founding and most common form.
    gene:
      preferred_term: DKC1
      term:
        id: hgnc:2890
        label: DKC1
- member: Dyskeratosis Congenita Autosomal Recessive 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic NHP2 variants impair the H/ACA ribonucleoprotein that
      stabilizes telomerase RNA.
    gene:
      preferred_term: NHP2
      term:
        id: hgnc:14377
        label: NHP2
- member: Dyskeratosis Congenita Autosomal Recessive 6
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic PARN variants impair 3' end maturation of telomerase RNA, so
      less telomerase RNA accumulates.
    gene:
      preferred_term: PARN
      term:
        id: hgnc:8609
        label: PARN
- member: Dyskeratosis Congenita Digenic
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Telomere shortening from a nucleotide-supply defect rather than a
      telomere-machinery defect: a TYMS loss-of-function allele plus an
      ENOSF1 haplotype that silences the other TYMS allele cause severe
      thymidylate synthase deficiency.
    gene:
      preferred_term: TYMS
      term:
        id: hgnc:12441
        label: TYMS
- member: Revesz Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The severe infantile end of the spectrum, from heterozygous TINF2
      (shelterin) variants in a narrow exon 6 window, with bilateral exudative
      retinopathy and early bone marrow failure.
    gene:
      preferred_term: TINF2
      term:
        id: hgnc:11824
        label: TINF2
notes: >-
  Coats plus (cerebroretinal microangiopathy with calcifications and cysts;
  CTC1, STN1) and the telomere-related pulmonary fibrosis and/or bone marrow
  failure forms are short telomere syndromes not yet curated as their own
  entries. Both have open stubs and are candidate members once curated.

name: Antiseizure Medication Embryopathies
display_name: Antiseizure Medication Embryopathies
creation_date: "2026-11-20T00:00:00Z"
description: >-
  The antiseizure medication embryopathies are the recognizable malformation and
  neurodevelopmental syndromes caused by prenatal exposure to an antiseizure
  medication taken by the mother, most often for epilepsy. This grouping collects
  the dismech entries that curate individual drug embryopathies in this class. Its
  members share a convergent clinical picture — minor craniofacial dysmorphism and
  neurodevelopmental impairment recur across the class, which is why the syndromes
  were historically confused and why fetal carbamazepine syndrome was first
  recognized through its overlap with fetal hydantoin syndrome — but they do not
  share a teratogenic mechanism. Fetal valproate syndrome runs through class I
  histone deacetylase inhibition and folate antagonism; fetal carbamazepine
  syndrome runs through reactive arene-oxide metabolite formation, the mechanism it
  shares with phenytoin rather than with valproate. The grouping exists to hold that
  convergent-phenotype / divergent-mechanism relationship explicitly, so the
  individual syndromes can be curated as separate Disease entries without losing the
  clinical family they belong to.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped because these disorders form a conventional clinical class — the
  embryopathies of antiseizure medications — united by a convergent craniofacial
  and neurodevelopmental phenotype, not by a mechanism. SHARED_MECHANISM would be
  wrong: the curated members run through different molecular routes (HDAC
  inhibition and folate antagonism for valproate, reactive arene-oxide metabolites
  for carbamazepine), which is the explicit reason they are kept as separate
  Disease entries rather than merged into one entry with subtypes. The members are
  also kept separate because they differ in the shape and severity of the phenotype
  and in dose-response. This grouping is deliberately narrower than its MONDO
  anchor, which spans all toxic and drug-related embryofetopathies; the non-drug
  teratogen embryopathies (fetal alcohol spectrum disorder) and the
  non-antiseizure drug embryopathies (thalidomide embryopathy) are out of scope
  here by design.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0016677
      label: toxic or drug-related embryofetopathy
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO has no class for "antiseizure medication embryopathy" specifically; the
      nearest class is toxic or drug-related embryofetopathy, under which the member
      syndromes sit. narrowMatch records that this grouping is a proper subset of
      that MONDO class — the antiseizure-medication members only — and must not be
      read as equating the grouping with the whole drug-embryofetopathy class, which
      also contains thalidomide embryopathy and the non-drug teratogen embryopathies.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        Both members bind a MONDO class that is a descendant of MONDO:0016677
        (fetal valproate syndrome MONDO:0012275 and fetal carbamazepine syndrome
        MONDO:0018263 both list it as a parent), so the narrowMatch holds. Other
        descendants of MONDO:0016677 are correctly outside the grouping because they
        are not antiseizure-medication embryopathies or are not yet curated.
membership_criteria:
- description: >-
    A disorder belongs to this grouping if and only if a recognizable malformation
    or neurodevelopmental syndrome in the exposed child is caused by prenatal
    maternal exposure to an antiseizure medication. This is recorded as the group's
    defining description rather than as machine-evaluable logic: dismech has no
    structured slot asserting the drug class of a teratogenic exposure, and the
    exposure identity lives in each member's free-text environmental record and its
    CHEBI-bound pathophysiology node rather than in an enum. The criterion is
    necessary and sufficient by construction — it is the definition of the class —
    and the members are listed explicitly.
  criteria_semantics: NECESSARY_AND_SUFFICIENT
members:
- member: Fetal Valproate Syndrome
  member_type: DISEASE
  display_name: Fetal valproate syndrome (valproic acid; HDAC inhibition and folate antagonism)
  differentiating_mechanisms:
  - description: >-
      Valproate inhibits class I histone deacetylases and antagonizes folate
      receptors and one-carbon metabolism in the embryo, with a transient oxidising
      redox shift as a third candidate branch. Its signature malformation is neural
      tube closure failure (lumbosacral spina bifida), and the neurodevelopmental arm
      — lower IQ and higher autism risk — is the larger part of the burden. Its
      overall major-malformation risk, about 10% and strongly dose-dependent, is the
      highest in the class. None of these mechanistic branches is shared with
      carbamazepine.
- member: Fetal Carbamazepine Syndrome
  member_type: DISEASE
  display_name: Fetal carbamazepine syndrome (carbamazepine; reactive arene-oxide metabolites)
  differentiating_mechanisms:
  - description: >-
      Carbamazepine is oxidized through an arene-oxide pathway to reactive
      intermediates including carbamazepine-10,11-epoxide, which rather than the
      parent drug are the proposed teratogens — the mechanism it shares with
      phenytoin and the reason its phenotype overlaps fetal hydantoin syndrome. Its
      signature features are minor craniofacial defects and fingernail hypoplasia
      with developmental delay, and its overall major-malformation risk, about 5% and
      dose-dependent, is modest and well below valproate's.
notes: >-
  Created to settle the lump/split question raised in issue 16910: fetal
  carbamazepine syndrome is curated as a separate Disease entry from fetal valproate
  syndrome, and this grouping is the structural home for the clinical family they
  share. The grouping currently has two members. Fetal hydantoin syndrome
  (MONDO:0016008, phenytoin) and fetal trimethadione syndrome (MONDO:0016009) are
  the obvious further members and share carbamazepine's arene-oxide mechanism in the
  phenytoin case, but neither is curated in dismech yet; they are left out rather
  than listed as members, because a Grouping unions existing Disease entries. Fetal
  alcohol spectrum disorder and thalidomide embryopathy are deliberately excluded:
  the former is not a drug embryopathy in the antiseizure sense and the latter is a
  different drug class with a cereblon-SALL4 mechanism.

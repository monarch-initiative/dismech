name: Griscelli Syndromes
creation_date: '2026-11-20T00:00:00Z'
description: Griscelli syndrome types 1, 2, and 3 are distinct inherited disorders whose pigmentary
  phenotype converges on defective RAB27A-melanophilin-myosin Va dependent melanosome transport.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: 'The three diseases disrupt different components of the same melanosome-transport
  machinery and share pigment dilution with characteristic hair-shaft pigment clumps. They remain
  separate entries because the same proteins have different functions outside melanocytes: MYO5A
  deficiency can cause primary neurological disease, RAB27A deficiency impairs cytotoxic granule
  exocytosis and predisposes to hemophagocytic lymphohistiocytosis, and MLPH deficiency is typically
  restricted to pigmentation. These differences in affected tissues and clinical consequences
  would be obscured by merging the entries. Neurological or immune involvement is therefore
  not a necessary criterion for this grouping.'
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:214450
      label: Griscelli syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot lists OMIM:214450 (type 1), OMIM:607624
      (type 2), and OMIM:609227 (type 3). The three separately curated members below represent
      this series-level union; OMIMPS:214450 is not interchangeable with the type 1 record OMIM:214450.
  mondo_mappings:
  - term:
      id: MONDO:0018306
      label: Griscelli syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: In the inspected September 2026 MONDO snapshot, MONDO:0018306 has
      exactly the three direct children MONDO:0008962, MONDO:0011872, and MONDO:0012220, corresponding
      to the member entries, and maps exactly to OMIMPS:214450.
membership_criteria:
- description: 'Each member entry describes impaired melanosome transport involving MYO5A, RAB27A,
    or MLPH. The computable criterion checks those disease-level process and gene annotations.
    It is necessary for these curated members, not sufficient to classify another disease or
    diagnose a patient: gene identity does not specify the causal variant, affected isoform,
    or full phenotype. Other pigmentary disorders can share a transport defect without belonging
    to this series.'
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      biological_processes:
      - preferred_term: melanosome transport
        term:
          id: GO:0032402
          label: melanosome transport
        modifier: DECREASED
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: MYO5A
          term:
            id: hgnc:7602
            label: MYO5A
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: RAB27A
          term:
            id: hgnc:9766
            label: RAB27A
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: MLPH
          term:
            id: hgnc:29643
            label: MLPH
  evidence:
  - reference: PMID:12062444
    reference_title: Melanophilin directly links Rab27a and myosin Va through its distinct coiled-coil
      regions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we show that Rab27a, melanophilin, and myosin Va form a ternary complex in the
      human melanocyte cell line HMV-II.
    explanation: The biochemical and human-cell experiments establish the shared complex disrupted
      by the three member diseases.
members:
- member: Griscelli Syndrome Type 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Loss of the myosin Va motor disrupts melanosome transport and can independently
      affect neuronal cargo transport, producing primary neurological involvement. Isoform-specific
      variants can spare the neurological phenotype.
    gene:
      preferred_term: MYO5A
      term:
        id: hgnc:7602
        label: MYO5A
    evidence:
    - reference: PMID:36651988
      reference_title: 'Griscelli syndrome type 1: a novel pathogenic variant, and review of
        literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: characterized by general hypopigmentation, neurological symptoms, motor disability,
        hypotonia, and vision abnormality.
      explanation: The molecularly confirmed type 1 cohort identifies neurological involvement
        alongside pigment dilution.
    - reference: PMID:12897212
      reference_title: Griscelli syndrome restricted to hypopigmentation results from a melanophilin
        defect (GS3) or a MYO5A F-exon deletion (GS1).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: an identical phenotype can result from the deletion of the MYO5A F-exon, an exon
        with a tissue-restricted expression pattern.
      explanation: The pigment-only MYO5A exon-F case prevents treating neurological involvement
        as a necessary condition for all MYO5A-related Griscelli disease.
    - reference: PMID:21151132
      reference_title: Myosin-Va transports the endoplasmic reticulum into the dendritic spines
        of Purkinje neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show here that myosin-Va acts as a point-to-point organelle transporter to
        pull ER as cargo into Purkinje neuron spines.
      explanation: Live imaging in cultured Purkinje neurons establishes a neuronal organelle-transport
        function of myosin Va, providing a mechanism distinct from the shared melanosome defect.
- member: Griscelli Syndrome Type 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: RAB27A deficiency affects both melanosome transport and cytotoxic granule exocytosis.
      The associated immune dysfunction and hemophagocytic syndrome distinguish it from the
      typical MYO5A and MLPH forms.
    gene:
      preferred_term: RAB27A
      term:
        id: hgnc:9766
        label: RAB27A
    evidence:
    - reference: PMID:12058346
      reference_title: Evidence that Griscelli syndrome with neurological involvement is caused
        by mutations in RAB27A, not MYO5A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Most patients with GS display the hemophagocytic syndrome and have mutations
        in RAB27A, which codes for a small GTPase.
      explanation: This study associates the hemophagocytic phenotype with RAB27A-related disease.
    - reference: PMID:10835631
      reference_title: Mutations in RAB27A cause Griscelli syndrome associated with haemophagocytic
        syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: RAB27A-deficient T cells exhibited reduced cytotoxicity and cytolytic granule
        exocytosis, whereas MYO5A-defective T cells did not.
      explanation: Experiments in patient-derived T cells directly distinguish the RAB27A granule-release
        defect from MYO5A-related disease.
- member: Griscelli Syndrome Type 3
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Loss of the melanophilin adaptor interrupts coupling of RAB27A to myosin Va
      in melanocytes. The clinical phenotype is typically restricted to pigment dilution, without
      the primary neurological or immune disease of the other forms.
    gene:
      preferred_term: MLPH
      term:
        id: hgnc:29643
        label: MLPH
    evidence:
    - reference: PMID:30389201
      reference_title: '[Griscelli syndrome type 3: A new case].'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: GS type 3 is an isolated cutaneous form.
      explanation: The type 3 case report and review distinguish the isolated cutaneous form
        from the neurological and immune forms.
notes: MYO5A exon-F deletion can produce a pigment-only phenotype, so primary neurological disease
  is a characteristic differentiator of typical type 1 rather than a universal requirement.
  RAB27A-related neurological involvement can occur in the context of immune disease; neurological
  symptoms alone do not separate types 1 and 2. The grouping follows the three molecular disease
  entries and does not classify patients from pigment dilution alone.

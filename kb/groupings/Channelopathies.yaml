name: Channelopathies
display_name: Channelopathies (Ion Channel Disorders)
creation_date: "2026-10-20T21:12:50Z"
description: >-
  A curated union of dismech disorders caused by dysfunction of an ion channel
  or of a protein that directly regulates one: a pore-forming channel subunit
  (voltage-gated sodium, potassium, calcium and chloride channels, inward
  rectifiers, ligand-gated GABA-A, glycine and glutamate receptors, ryanodine
  receptors, store-operated calcium channels) or an accessory or regulatory
  partner such as a channel beta subunit, KCNE peptide, calmodulin,
  calsequestrin or STIM1. Members span the heart, skeletal muscle, central and
  peripheral nervous system, transporting epithelia and the immune system, and
  each carries a channelopathy_category tag naming its principal organ system.
grouping_basis:
- SHARED_MECHANISM
- SHARED_GENE_FAMILY
grouping_rationale: >-
  Grouped on a shared molecular lesion, ion channel dysfunction, rather than on
  a phenotype or organ system; the organ system is recorded per member by
  channelopathy_category. Two criteria blocks make the grouping checkable. The
  first is NECESSARY: every member must curate, somewhere in its
  pathophysiology, a GO molecular function under ion channel activity
  (GO:0005216) or ion channel regulator activity (GO:0099106), so a member whose
  entry records no channel-level activity is reported as a contradiction. The
  regulator branch is deliberate, because long QT syndrome from KCNE1, SCN4B or
  calmodulin variants and STIM1 deficiency are channelopathies caused by
  proteins that are not pores. The second is NECESSARY_AND_SUFFICIENT and ties
  membership to the channelopathy_category tag, so a newly tagged entry is
  reported as a candidate and the tag and the grouping cannot drift apart.
  Disorders of ion pumps are excluded: the Na+/K+-ATPase disorders
  (ATP1A3-related CAPOS syndrome and alternating hemiplegia of childhood) carry
  a P-type transporter activity, not a channel activity, and are not members.
  Broad umbrella entries whose genes are mostly not channels (Genetic
  Developmental and Epileptic Encephalopathy, Congenital Insensitivity to Pain,
  Familial Atrial Fibrillation) and acquired channel blockade (Local Anesthetic
  Systemic Toxicity) are also left out. The criteria check the entry's own
  curated GO terms; they do not check that the causal genes carry the
  corresponding annotations in GO. Inherited_Arrhythmia_Syndromes overlaps the
  cardiac members but is not nested here: it is defined by conformance to the
  cardiac repolarization module and includes calcium-handling disorders and a
  sick sinus syndrome entry that are not tagged as channelopathies.
membership_criteria:
- description: >-
    Every member curates a GO molecular function under ion channel activity
    (GO:0005216) or ion channel regulator activity (GO:0099106) on at least one
    pathophysiology node.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    operands:
    - criterion_predicate: HAS_MOLECULAR_FUNCTION
      description: Ion channel activity (GO:0005216) or a descendant.
      molecular_functions:
      - preferred_term: monoatomic ion channel activity
        term:
          id: GO:0005216
          label: monoatomic ion channel activity
    - criterion_predicate: HAS_MOLECULAR_FUNCTION
      description: Ion channel regulator activity (GO:0099106) or a descendant.
      molecular_functions:
      - preferred_term: ion channel regulator activity
        term:
          id: GO:0099106
          label: ion channel regulator activity
- description: >-
    A disorder is a member if and only if it carries a channelopathy_category
    classification (cardiac, skeletal muscle, neurological, epithelial or
    immune channelopathy).
  criteria_semantics: NECESSARY_AND_SUFFICIENT
  logic:
    operator: OR
    operands:
    - criterion_predicate: HAS_CLASSIFICATION
      description: Cardiac channelopathy.
      classification: "channelopathy_category:cardiac channelopathy"
    - criterion_predicate: HAS_CLASSIFICATION
      description: Skeletal muscle channelopathy.
      classification: "channelopathy_category:skeletal muscle channelopathy"
    - criterion_predicate: HAS_CLASSIFICATION
      description: Neurological channelopathy.
      classification: "channelopathy_category:neurological channelopathy"
    - criterion_predicate: HAS_CLASSIFICATION
      description: Epithelial channelopathy.
      classification: "channelopathy_category:epithelial channelopathy"
    - criterion_predicate: HAS_CLASSIFICATION
      description: Immune channelopathy.
      classification: "channelopathy_category:immune channelopathy"

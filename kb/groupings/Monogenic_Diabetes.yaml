name: Monogenic Diabetes
display_name: Monogenic diabetes
creation_date: "2026-11-21T00:00:00Z"
description: >-
  Diabetes caused by a pathogenic variant in a single gene, as distinct from the
  autoimmune and polygenic forms. The members are the isolated monogenic
  diabetes diseases (maturity-onset diabetes of the young, permanent and
  transient neonatal diabetes) and the syndromes in which monogenic diabetes is
  a defining feature. Most of the genes act on the pancreatic beta cell, by
  removing a transcription factor, raising the glucose threshold for insulin
  release, holding the K-ATP channel open, misfolding proinsulin, or preventing
  the pancreas from forming.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by aetiology (a single-gene cause) and a shared defining phenotype
  (diabetes), not by a shared mechanism: the genes reach hyperglycaemia by
  different routes, and the route sets the treatment, so the members are kept
  as separate entries. The isolated forms are each one genetically
  heterogeneous entry with a subtype per gene, matching how MONDO and
  GeneReviews divide them; the syndromic forms are their own entries because
  their extra-pancreatic features dominate. Mitochondrial diabetes with
  deafness (MONDO:0010785) is not yet curated and is in the stub queue. Alström
  syndrome is not a member: diabetes is frequent in it but not defining.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0015967
      label: monogenic diabetes
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      This grouping is the monogenic diabetes class. No disease entry holds
      MONDO:0015967 as its disease_term.
membership_criteria:
- description: >-
    Diabetes or hyperglycaemia is a defining feature of the disease. HPO files
    Diabetes mellitus outside Hyperglycemia, so either term satisfies the
    criterion.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    description: The member records hyperglycaemia or diabetes mellitus.
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      description: Hyperglycaemia.
      phenotype_term:
        preferred_term: Hyperglycemia
        term:
          id: HP:0003074
          label: Hyperglycemia
    - criterion_predicate: HAS_PHENOTYPE
      description: Diabetes mellitus, including its neonatal and other subclasses.
      phenotype_term:
        preferred_term: Diabetes mellitus
        term:
          id: HP:0000819
          label: Diabetes mellitus
members:
- member: Maturity-Onset Diabetes of the Young
  member_type: DISEASE
  display_name: Maturity-onset diabetes of the young (MODY)
  differentiating_mechanisms:
  - description: >-
      Autosomal dominant diabetes presenting in adolescence or early adulthood.
      Transcription-factor forms (HNF1A, HNF4A, HNF1B) give progressive
      secretory failure and respond to sulfonylureas; GCK-MODY gives mild,
      stable fasting hyperglycaemia that usually needs no treatment.
- member: Permanent Neonatal Diabetes Mellitus
  member_type: DISEASE
  display_name: Permanent neonatal diabetes mellitus (PNDM)
  differentiating_mechanisms:
  - description: >-
      Insulin-deficient diabetes from the first six months of life that does
      not remit. Activating KCNJ11 and ABCC8 variants are the commonest cause
      and allow transfer from insulin to oral sulfonylureas.
- member: Transient Neonatal Diabetes Mellitus
  member_type: DISEASE
  display_name: Transient neonatal diabetes mellitus (TNDM)
  differentiating_mechanisms:
  - description: >-
      Neonatal diabetes that remits within months and often recurs later.
      Mostly 6q24 imprinting overexpression; milder activating ABCC8 and KCNJ11
      variants account for most of the rest.
- member: Neonatal Diabetes Mellitus With Congenital Hypothyroidism
  member_type: DISEASE
  display_name: Neonatal diabetes with congenital hypothyroidism (GLIS3)
  differentiating_mechanisms:
  - description: >-
      Biallelic GLIS3 loss gives neonatal diabetes together with congenital
      hypothyroidism.
- member: Wolcott-Rallison Syndrome
  member_type: DISEASE
  display_name: Wolcott-Rallison syndrome (EIF2AK3)
  differentiating_mechanisms:
  - description: >-
      Biallelic EIF2AK3 loss gives permanent neonatal diabetes with skeletal
      dysplasia and episodic liver failure.
- member: Wolfram Syndrome
  member_type: DISEASE
  display_name: Wolfram syndrome (WFS1, CISD2)
  differentiating_mechanisms:
  - description: >-
      Childhood-onset insulin-deficient diabetes with optic atrophy and
      progressive neurodegeneration.
- member: Thiamine-Responsive Megaloblastic Anemia Syndrome
  member_type: DISEASE
  display_name: Thiamine-responsive megaloblastic anaemia syndrome (SLC19A2)
  differentiating_mechanisms:
  - description: >-
      Biallelic SLC19A2 loss gives diabetes with megaloblastic anaemia and
      sensorineural hearing loss.
- member: Mitchell-Riley Syndrome
  member_type: DISEASE
  display_name: Mitchell-Riley syndrome (RFX6)
  differentiating_mechanisms:
  - description: >-
      Biallelic RFX6 loss gives neonatal diabetes with intestinal atresia and
      pancreatic hypoplasia.
notes: >-
  Created when the Diabetes_Mellitus umbrella disease entry was retired; its
  monogenic catalogue became the three isolated-form entries listed here. This
  grouping is nested in the Diabetes_Mellitus grouping. Differentiating
  descriptions summarise each member entry and carry no evidence of their own;
  the member entries hold it.

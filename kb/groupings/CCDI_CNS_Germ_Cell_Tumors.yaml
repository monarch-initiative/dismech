name: CCDI CNS Germ Cell Tumors
display_name: CNS Germ Cell Tumors (CCDI Diagnosis Group)
creation_date: "2026-11-14T00:00:00Z"
description: >-
  The entries a Childhood Cancer Data Initiative submission files under the
  diagnosis group CNS Germ Cell Tumors (caDSR CDE 16607972): germ cell tumors
  arising in the brain or spinal cord, most often in the pineal and suprasellar
  regions. CCDI keeps them apart from its Germ Cell Tumors value, which holds
  the gonadal and other extracranial tumors.
grouping_basis:
- CLINICAL_CONVENTION
- SHARED_PHENOTYPE
grouping_rationale: >-
  Lumped by site and lineage: each member is a germ cell tumor of the central
  nervous system. Kept split because the spectrum entry covers germinoma and
  the nongerminomatous tumors, whose management turns on histology and tumor
  markers, while teratoma is curated separately because complete resection is
  central to treating its mature form. Only two entries carry the value so far;
  germinoma has no entry of its own.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0003000
      label: central nervous system germ cell tumor
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The CCDI value is bound by caDSR to NCIT:C5461 (Central Nervous System
      Germ Cell Tumor), the NCIT cross-reference of MONDO:0003000.
membership_criteria:
- description: >-
    A member carries the CCDI diagnosis group CNS Germ Cell Tumors. The value
    is derived from the entry's NCIt concept, so it holds exactly when that
    concept is NCIT:C5461 (Central Nervous System Germ Cell Tumor) or a
    descendant of it.
  criteria_semantics: NECESSARY_AND_SUFFICIENT
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    description: >-
      Assigned on the member entry via
      classifications.ccdi_pediatric_oncology_category.
    classification: "ccdi_pediatric_oncology_category:CNS Germ Cell Tumors"
members:
- member: Central Nervous System Germ Cell Tumor
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The spectrum entry, covering germinoma and the nongerminomatous germ cell
      tumors. Recurrent KIT and RAS signaling alterations and chromosome 12p
      gain are curated here.
- member: Central Nervous System Teratoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A tumor composed of tissues from more than one germ layer. Mature
      teratoma is managed by complete resection; immature, malignant and mixed
      forms are treated with the nongerminomatous group.
notes: >-
  Nested in CCDI Pediatric Oncology Diagnosis Groups.

name: Early-Infantile Developmental and Epileptic Encephalopathies
creation_date: "2026-07-31T23:55:00Z"
description: >-
  Early-infantile developmental and epileptic encephalopathy (EIDEE) is the ILAE
  electroclinical syndrome defined by frequent, drug-resistant seizures beginning
  at or before three months of age, together with an abnormal interictal EEG
  (classically burst-suppression in the Ohtahara and early myoclonic
  encephalopathy presentations) and abnormal neurological examination, in which
  the epileptic activity itself contributes to developmental impairment beyond
  what the underlying aetiology alone would cause. The 2022 ILAE
  classification collapsed the older Ohtahara syndrome and early myoclonic
  encephalopathy labels into this single EIDEE syndrome. This grouping is a
  curated union of the molecularly defined dismech entries whose seizure onset
  falls inside that neonatal-to-three-month window. Members are grouped by the
  ILAE age-at-onset and electroclinical convention, not by a shared molecular
  mechanism: they span potassium-channel loss of function (KCNQ2), sodium-channel
  gain of function (SCN2A), presynaptic vesicle-priming failure (STXBP1), an
  X-linked serine-threonine kinase deficiency (CDKL5), and a recessive
  UDP-glucose dehydrogenase metabolic defect (UGDH).
grouping_basis:
- CLINICAL_CONVENTION
- SHARED_PHENOTYPE
grouping_rationale: >-
  This grouping lumps by the ILAE electroclinical convention that defines EIDEE
  — seizure onset at or before three months of age with an encephalopathic
  course — and is assembled below the level of the MONDO taxonomy so that the
  onset boundary is explicit and auditable. Members are deliberately kept as
  separate Disease entries because their causal mechanisms diverge sharply and
  because the mechanism determines therapy: KCNQ2 loss of function makes
  M-current openers and sodium-channel blockers (carbamazepine, phenytoin)
  rational, SCN2A gain of function responds to the same sodium-channel blockers
  while SCN2A loss of function is worsened by them, CDKL5 deficiency has a
  disease-specific approved therapy (ganaxolone), STXBP1 haploinsufficiency is a
  presynaptic proteostasis/vesicle-priming defect, and UGDH deficiency is a
  recessive metabolic aetiology. Grouping basis is therefore CLINICAL_CONVENTION
  (ILAE age-at-onset/electroclinical nosology) plus the SHARED_PHENOTYPE of
  neonatal-onset drug-resistant seizures, not a shared mechanism.

  Membership is drawn only from entries whose dismech text documents onset within
  the first three months. Several other molecularly defined DEE entries in the
  knowledge base were considered and deliberately excluded on onset grounds:
  CACNA1E-Related DEE (median onset about 4.5 months), SCN8A-Related DEE and
  GNAO1-Related DEE (documented as INFANTILE onset rather than at or before three
  months), and KCNA2-Related DEE (typically infancy to early childhood, with only
  the most severe gain-and-loss-of-function presentations beginning neonatally).
  They remain candidates should their entries later document onset inside the
  window.

  This grouping is intentionally distinct from three neighbouring constructs and
  is not a duplicate of any of them: the Disease entry Genetic Developmental and
  Epileptic Encephalopathy (MONDO:0100062) is the aetiologic umbrella regardless
  of onset age; Childhood-Onset Epilepsy Syndromes is the broader ILAE
  age-at-onset grouping spanning infancy through childhood and including
  self-limited syndromes; and Epilepsy Excitation-Inhibition Imbalance Disorders
  groups by converging pathomechanism irrespective of onset. Onset-window
  convention (here), broad age-at-onset convention, aetiologic class, and
  pathomechanism are four orthogonal axes.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0800491
      label: early-infantile DEE
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0800491 (early-infantile DEE) is the umbrella MONDO class for the
      ILAE early-infantile developmental and epileptic encephalopathy syndrome,
      defined by drug-resistant seizures beginning at or before three months of
      age. This grouping is a curated union of five molecularly defined member
      entries and does not attempt to recapitulate the full set of genetic,
      structural, and metabolic aetiologies that satisfy the syndrome
      definition, so the mapping is asserted as broadMatch.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All five members are developmental and epileptic encephalopathies whose
        entries document seizure onset in the neonatal period or the first
        months of life, consistent with the MONDO:0800491 umbrella class, though
        the grouping covers only a small subset of its aetiologies.
membership_criteria:
- description: >-
    A member is a developmental and epileptic encephalopathy (seizures are a
    defining feature, accompanied by developmental impairment attributable in
    part to the epileptic activity) whose seizure onset is at or before three
    months of age.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - operator: OR
      description: >-
        Seizures are a defining feature of the syndrome. Enumerated as a
        disjunction of the specific seizure phenotypes the member entries
        actually assert, because the membership evaluator matches terms exactly
        and does not apply HPO subsumption — several members annotate only a
        specific seizure semiology (epileptic spasm, tonic seizure, focal-onset
        seizure) rather than the generic Seizure parent.
      operands:
      - criterion_predicate: HAS_PHENOTYPE
        description: Seizure (generic).
        phenotype_term:
          preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
      - criterion_predicate: HAS_PHENOTYPE
        description: Epileptic spasm.
        phenotype_term:
          preferred_term: Epileptic spasm
          term:
            id: HP:0011097
            label: Epileptic spasm
      - criterion_predicate: HAS_PHENOTYPE
        description: Infantile spasms.
        phenotype_term:
          preferred_term: Infantile spasms
          term:
            id: HP:0012469
            label: Infantile spasms
      - criterion_predicate: HAS_PHENOTYPE
        description: Tonic seizure.
        phenotype_term:
          preferred_term: Tonic seizure
          term:
            id: HP:0032792
            label: Tonic seizure
      - criterion_predicate: HAS_PHENOTYPE
        description: Focal-onset seizure.
        phenotype_term:
          preferred_term: Focal-onset seizure
          term:
            id: HP:0007359
            label: Focal-onset seizure
    - operator: OR
      description: >-
        Developmental impairment accompanies the epilepsy, distinguishing a
        developmental and epileptic encephalopathy from a self-limited neonatal
        or infantile epilepsy syndrome. Enumerated as a disjunction because
        members annotate either the generic or the severity-qualified term.
      operands:
      - criterion_predicate: HAS_PHENOTYPE
        description: Global developmental delay.
        phenotype_term:
          preferred_term: Global developmental delay
          term:
            id: HP:0001263
            label: Global developmental delay
      - criterion_predicate: HAS_PHENOTYPE
        description: Severe global developmental delay.
        phenotype_term:
          preferred_term: Severe global developmental delay
          term:
            id: HP:0011344
            label: Severe global developmental delay
    - criterion_predicate: OTHER
      description: >-
        Seizure onset at or before three months of age (the
        neonatal-to-early-infantile window that defines EIDEE under the 2022
        ILAE classification).
        Onset age is not currently expressible as a structured leaf predicate,
        so it is asserted as an OTHER criterion; the advisory evaluator reports
        this leaf as UNKNOWN per member, which is expected.
members:
- member: KCNQ2 Developmental and Epileptic Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      KCNQ2 developmental and epileptic encephalopathy is caused by de novo,
      typically dominant-negative missense variants in KCNQ2 (Kv7.2), which
      reduce the neuronal M-current that normally dampens repetitive firing at
      the axon initial segment. Seizures begin in the first days of life, giving
      this member the earliest and most reliably neonatal onset in the grouping,
      and the loss-of-function M-current mechanism is what makes sodium-channel
      blockers such as carbamazepine effective — the mechanistic mirror image of
      the SCN2A loss-of-function member's drug response.
    gene:
      preferred_term: KCNQ2
      term:
        id: hgnc:6296
        label: KCNQ2
- member: SCN2A-Related Developmental and Epileptic Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      SCN2A-related developmental and epileptic encephalopathy separates by
      variant functional class, and age at onset is the bedside proxy for that
      split: gain-of-function Nav1.2 variants produce the
      neonatal-to-early-infantile presentation that qualifies for this
      grouping and respond to
      sodium-channel blockers, whereas loss-of-function variants present after
      three months and are worsened by the same drugs. It is the only member
      whose grouping membership is defined by a functional subclass rather than
      by the gene as a whole.
    gene:
      preferred_term: SCN2A
      term:
        id: hgnc:10588
        label: SCN2A
- member: STXBP1 Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      STXBP1 encephalopathy is caused by heterozygous loss-of-function variants
      in STXBP1 (Munc18-1) acting through haploinsufficiency and protein
      destabilisation. Unlike the channelopathy members, the primary lesion is
      presynaptic: impaired syntaxin-1 chaperoning and SNARE-complex assembly
      degrade synaptic vesicle docking and priming, so neurotransmitter release
      fails rather than membrane excitability being directly altered. Onset is
      typically in the first months of life.
    gene:
      preferred_term: STXBP1
      term:
        id: hgnc:11444
        label: STXBP1
- member: CDKL5 Deficiency Disorder
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      CDKL5 deficiency disorder is an X-linked encephalopathy caused by loss of
      the CDKL5 serine-threonine kinase, whose substrates regulate dendritic
      arborisation, synapse maturation, and microtubule dynamics. It is the only
      member whose lesion is a signalling kinase rather than an ion channel,
      vesicle protein, or metabolic enzyme, the only X-linked member, and the
      only one with a disorder-specific approved antiseizure therapy
      (ganaxolone). Seizures begin in the first months of life.
    gene:
      preferred_term: CDKL5
      term:
        id: hgnc:11411
        label: CDKL5
- member: UGDH-related developmental and epileptic encephalopathy 84
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      UGDH-related developmental and epileptic encephalopathy 84 is the sole
      autosomal-recessive and sole metabolic member: biallelic loss-of-function
      variants in UGDH deplete UDP-glucuronic acid, the shared precursor for
      glycosaminoglycan and proteoglycan synthesis, so the epileptic
      encephalopathy arises from a biosynthetic-precursor deficit rather than
      from a primary synaptic or channel lesion. Reported onset spans the
      neonatal period to infancy, so only the neonatal-onset end of its
      published spectrum falls inside this grouping's window.
    gene:
      preferred_term: UGDH
      term:
        id: hgnc:12525
        label: UGDH
notes: >-
  Clinical-convention grouping by the ILAE EIDEE onset window (seizures at or
  before three months), kept deliberately distinct from the aetiologic Disease
  entry Genetic Developmental and Epileptic Encephalopathy, from the broader
  Childhood-Onset Epilepsy Syndromes age-at-onset grouping, and from the
  mechanism grouping Epilepsy Excitation-Inhibition Imbalance Disorders. The
  NECESSARY criteria pair two phenotype leaves (Seizure, Global developmental
  delay) with an OTHER onset-age leaf; the advisory evaluator reports the OTHER
  leaf as UNKNOWN per member, which is expected and advisory only. Entries
  excluded on onset grounds (CACNA1E, SCN8A, GNAO1, KCNA2) are named in the
  grouping rationale and remain candidates for later addition.

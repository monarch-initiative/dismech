name: GABA-A Receptor-Related Neurodevelopmental Disorders
display_name: GABA-A Receptor-Related Neurodevelopmental Disorders (GABAAR-NDD)
creation_date: "2026-09-12T00:00:00Z"
description: >-
  The GABA-A receptor-related neurodevelopmental disorders are monogenic
  disorders caused by pathogenic variants in the genes encoding subunits of the
  GABA-A receptor, the ligand-gated chloride channel that mediates fast
  inhibitory synaptic transmission in the CNS. Nineteen subunit genes exist;
  most reported disease-causing variants fall in GABRA1, GABRB2, GABRB3, and
  GABRG2. Both loss- and gain-of-function variants occur, and the functional
  direction matters clinically rather than only mechanistically: benzodiazepines
  and vigabatrin, which potentiate GABA-A signalling, are effective in
  loss-of-function disease but are reported to worsen gain-of-function disease.
  The shared consequence is disturbed excitation-inhibition balance in
  developing cortical networks, presenting as epilepsy — frequently
  drug-resistant — with developmental delay, intellectual disability, and
  movement and ophthalmological involvement.
grouping_basis:
- SHARED_MECHANISM
- SHARED_GENE_FAMILY
grouping_rationale: >-
  Grouped on a shared molecular target and a shared downstream mechanism: every
  member is caused by a variant in a gene encoding a subunit of the same
  receptor complex, and each acts by perturbing GABAergic inhibition and hence
  the excitation-inhibition balance of developing networks. Members are kept as
  separate Disease entries because the subunit involved, the functional
  direction of the variant, the seizure phenotype, and the drug-response profile
  differ between them.

  The criteria are NECESSARY rather than NECESSARY_AND_SUFFICIENT, deliberately.
  Carrying a GABA-A subunit gene is not sufficient for membership, and the
  HAS_GENE predicate cannot see the distinction that matters: it matches any
  entry listing the gene, regardless of `relationship_type`. Reading these
  criteria as sufficient would sweep in three classes of non-member that are
  present in the KB today — contiguous-gene disorders whose interval merely
  spans subunit genes (Angelman syndrome and 15q11q13 microduplication syndrome
  both span GABRB3, GABRA5, and GABRG3, but are driven by UBE3A dosage rather
  than by receptor dysfunction); common epilepsies where a subunit gene is a
  SUSCEPTIBILITY allele of small effect rather than a cause (childhood absence
  epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, epilepsy
  with myoclonic-atonic seizures); and non-epilepsy susceptibility associations
  such as GABRA2 in alcohol use disorder. Membership therefore requires a
  curator to have judged the variant causative, and the criteria audit that
  judgement rather than replace it.

  MONDO has no grouping term for GABA-A receptor-related disease, so no
  mapping is asserted; MONDO:0013166 (GABA aminotransaminase deficiency) is a
  metabolic disorder of GABA catabolism and is not a superclass of this group.
membership_criteria:

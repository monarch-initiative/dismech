- description: >-
    Every member acts through disturbed excitation-inhibition balance — the
    shared downstream mechanism that makes this a mechanistic grouping and not
    merely a gene-family one.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
    description: >-
      Conforms to the excitation-inhibition imbalance node of the epilepsy
      module. Reflects the current membership, in which every member is
      epilepsy-manifesting; a future seizure-free GABA-A subunit disorder would
      require this criterion to be revisited rather than excepted.
members:
- member: GABRB3-Related Developmental and Epileptic Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Beta-3 subunit variants, the arm in which the gain- versus
      loss-of-function split is best characterised. Gain-of-function variants
      increase GABA sensitivity and alter receptor desensitization, and are
      associated with vigabatrin hypersensitivity; loss-of-function variants
      reduce receptor function and impair trafficking. GABRB3 is also the
      subunit gene that falls within the 15q11-q13 imprinted interval, which is
      why contiguous-gene disorders of that region must be excluded from this
      grouping by hand.
    gene:
      preferred_term: GABRB3
      term:
        id: hgnc:4083
        label: GABRB3
- member: GABRG2-Related Epilepsy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Gamma-2 subunit variants act predominantly by impairing receptor assembly
      and trafficking rather than by altering channel gating in an assembled
      receptor, and include a temperature-sensitive trafficking defect that
      underlies the characteristic febrile-seizure presentation and the
      generalised epilepsy with febrile seizures plus phenotype.
    gene:
      preferred_term: GABRG2
      term:
        id: hgnc:4087
        label: GABRG2
notes: >-
  Candidate members identified while curating this grouping but deliberately not
  added without review: Developmental and Epileptic Encephalopathy 1 (GABRA1,
  typed CAUSATIVE) and Generalized Epilepsy with Febrile Seizures Plus (GABRG2
  CAUSATIVE, GABRD RISK_FACTOR). Both satisfy the gene criterion on a causative
  relationship and are strong candidates on the ICD-10-CM GABAAR-NDD proposal's
  own scope, which names GABRA1 among the four principal genes. GABRA1 and
  GABRG2 disease are also curated inside broader entries (Dravet syndrome,
  Epilepsy, Jeavons syndrome) without a relationship type, which would need
  resolving before those are considered.

  Scope note: this grouping covers monogenic subunit disorders. It is not the
  same set as the entries conforming to the epilepsy_excitation_inhibition_imbalance
  module, which is insult-agnostic and far broader.

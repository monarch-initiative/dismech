- description: >-
    Every member acts through disturbed excitation-inhibition balance — the
    shared downstream mechanism that makes this a mechanistic grouping and not
    merely a gene-family one.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
    description: >-
      Conforms to the excitation-inhibition imbalance node of the epilepsy
      module. Reflects the current membership, in which every member is
      epilepsy-manifesting; a future seizure-free GABA-A subunit disorder would
      require this criterion to be revisited rather than excepted.
members:
- member: GABRB3-Related Developmental and Epileptic Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Beta-3 subunit variants, the arm in which the gain- versus
      loss-of-function split is best characterised. Gain-of-function variants
      increase GABA sensitivity and alter receptor desensitization, and are
      associated with vigabatrin hypersensitivity; loss-of-function variants
      reduce receptor function and impair trafficking. GABRB3 is also the
      subunit gene that falls within the 15q11-q13 imprinted interval, which is
      why contiguous-gene disorders of that region must be excluded from this
      grouping by hand.
    gene:
      preferred_term: GABRB3
      term:
        id: hgnc:4083
        label: GABRB3
- member: GABRG2-Related Epilepsy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Gamma-2 subunit variants act predominantly by impairing receptor assembly
      and trafficking rather than by altering channel gating in an assembled
      receptor, and include a temperature-sensitive trafficking defect that
      underlies the characteristic febrile-seizure presentation and the
      generalised epilepsy with febrile seizures plus phenotype.
    gene:
      preferred_term: GABRG2
      term:
        id: hgnc:4087
        label: GABRG2
discussions:
- discussion_id: gabra1_causative_entry_not_yet_a_member
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Developmental and Epileptic Encephalopathy 19 carries GABRA1 typed
    CAUSATIVE and satisfies both of this grouping's NECESSARY criteria. Should
    it be listed as a member, and should the GABRA1 disease curated inside
    broader entries be reached at all?
  rationale: >-
    The entry exists in kb/disorders and is not listed here only because
    membership was scoped to the two subunit-named entries when this grouping
    was created. GABRA1 is one of the four genes the ICD-10-CM GABAAR-NDD
    proposal names as principal, so the omission is a gap rather than a
    boundary decision.

    Three further entries carry GABRA1 with no `relationship_type` at all —
    Epilepsy, Dravet_syndrome, and Jeavons Syndrome. Those are a different
    problem: until each states whether GABRA1 is causative or a susceptibility
    allele for that entity, there is no basis on which to include or exclude
    them, and this grouping's criteria cannot discriminate them (HAS_GENE does
    not read `relationship_type`). Resolving the typing on those entries should
    come before deciding their membership.
- discussion_id: gefsplus_membership_undecided
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Generalized Epilepsy with Febrile Seizures Plus carries GABRG2 typed
    CAUSATIVE (and GABRD as RISK_FACTOR) and satisfies both NECESSARY criteria.
    Is it a member of this grouping, or a syndrome-level entity that overlaps
    it?
  rationale: >-
    GEFS+ is a clinical syndrome defined by its seizure phenotype rather than
    by a gene, and GABRG2 is one of several causes; the existing
    GABRG2-Related Epilepsy member already carries a GEFS+ subtype. Listing
    both could therefore double-count the same GABRG2 biology at two levels of
    granularity, which is a lump/split question about the entries rather than
    about this grouping. Deferred for that reason, not because the criteria
    fail.
notes: >-
  Scope: monogenic GABA-A receptor subunit disorders. This is deliberately not
  the same set as the entries conforming to
  epilepsy_excitation_inhibition_imbalance, which is insult-agnostic and much
  broader. Candidate members that satisfy the criteria but are not listed are
  recorded as OPEN discussions above rather than in prose here; the schema has
  no slot for an explicit deferred- or excluded-member list.

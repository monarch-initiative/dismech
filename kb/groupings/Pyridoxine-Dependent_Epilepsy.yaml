name: Pyridoxine-Dependent Epilepsy
display_name: Pyridoxine-Dependent Epilepsy
creation_date: "2026-10-20T00:00:00Z"
description: >-
  Pyridoxine-dependent epilepsy (PDE) is a clinical category: early-onset
  seizures that resist standard antiseizure medication but respond to
  pharmacologic doses of vitamin B6, with lifelong dependency. The category
  has several genetic causes. Its members here are the two gene-defined
  diseases MONDO places under pyridoxine-dependent epilepsy: ALDH7A1-related
  PDE, in which an accumulating lysine-degradation intermediate inactivates
  pyridoxal 5'-phosphate (PLP), and PLPBP-related PDE, in which loss of the
  PLP homeostasis protein disturbs intracellular PLP.
grouping_basis:
- SHARED_TREATMENT_RESPONSE
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  PDE was defined clinically, by seizure control with pyridoxine and relapse on
  withdrawal, before any gene was known, and the International PDE Consortium
  now uses the name for a category with several genetic causes, writing each
  one as a gene-specific dyad (PDE-ALDH7A1). The members are kept as separate
  Disease entries because their mechanisms differ upstream of the shared PLP
  deficiency: ALDH7A1-related PDE has alpha-AASA/P6C accumulation, a
  diagnostic biomarker, and lysine-reduction adjunct therapy, none of which
  apply to PLPBP-related PDE. Membership follows MONDO:0009945. PNPO deficiency
  (PNPO_Deficiency) is counted as a form of PDE by the Consortium but sits
  beside MONDO:0009945 rather than under it, so it is not listed here while
  that placement is open (dismech issue 14963).
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0009945
      label: pyridoxine-dependent epilepsy
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0009945 is the clinical pyridoxine-dependent epilepsy class whose
      children are the ALDH7A1 (MONDO:0020741) and PLPBP (MONDO:0015005)
      diseases, which are this grouping's members.
membership_criteria:
- description: >-
    A member's causal gene is ALDH7A1 or PLPBP, the two genes MONDO and
    Orphanet (ORPHA:3006) attach to pyridoxine-dependent epilepsy.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    description: ALDH7A1 or PLPBP is the causal locus.
    operands:
    - criterion_predicate: HAS_GENE
      description: Antiquitin (ALDH7A1) deficiency.
      gene:
        preferred_term: ALDH7A1
        term:
          id: hgnc:877
          label: ALDH7A1
    - criterion_predicate: HAS_GENE
      description: PLP homeostasis protein (PLPBP) deficiency.
      gene:
        preferred_term: PLPBP
        term:
          id: hgnc:9457
          label: PLPBP
members:
- member: ALDH7A1-Related Pyridoxine-Dependent Epilepsy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Antiquitin deficiency blocks lysine degradation; the accumulating
      alpha-AASA/P6C inactivates PLP. Raised alpha-AASA is the diagnostic
      biomarker, and lysine restriction with arginine supplementation is used
      alongside pyridoxine.
    gene:
      preferred_term: ALDH7A1
      term:
        id: hgnc:877
        label: ALDH7A1
- member: PLPBP-Related Pyridoxine-Dependent Epilepsy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of the PLP homeostasis protein disturbs intracellular PLP without
      a known accumulating metabolite; seizures respond to pyridoxine or
      pyridoxal 5'-phosphate.
    gene:
      preferred_term: PLPBP
      term:
        id: hgnc:9457
        label: PLPBP

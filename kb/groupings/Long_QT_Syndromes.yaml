name: Long QT Syndromes
display_name: Long QT Syndromes
creation_date: "2026-11-04T00:00:00Z"
description: >-
  The long QT syndromes are disorders in which delayed ventricular
  repolarization prolongs the QT interval and predisposes to torsades de
  pointes, syncope and sudden cardiac death. The group spans the inherited
  non-syndromic forms (familial long QT syndrome and its numbered gene
  types), the recessive cardioauditory forms (Jervell and Lange-Nielsen
  syndrome), multisystem syndromes in which QT prolongation is a defining
  cardiac feature (Timothy syndrome, Andersen-Tawil syndrome), and acquired
  long QT syndrome, in which an environmental stressor such as a drug or an
  electrolyte disturbance prolongs repolarization reversibly.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped on the shared defining phenotype, prolongation of the QT interval,
  following the clinical and MONDO convention that places these disorders
  under long QT syndrome (MONDO:0002442). Members are kept as separate
  entries because they differ in cause (a channel or channel-regulator gene,
  allele dosage, or an acquired exposure), inheritance, and accompanying
  extracardiac features such as deafness, periodic paralysis or syndactyly.
  This grouping cuts across Inherited_Arrhythmia_Syndromes, which groups by
  shared ion-channel mechanism and excludes acquired disease. The phenotype
  criterion is NECESSARY only: QT prolongation also occurs in many conditions
  that are not long QT syndromes, so it does not define membership.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002442
      label: long QT syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      exactMatch: the grouping's members are the DisMech entries bound to
      MONDO:0002442 descendants. Numbered types curated as subtypes of
      Familial Long QT Syndrome are covered through that member rather than
      listed separately.
membership_criteria:
- description: >-
    Every member records prolongation of the QT interval as a phenotype.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_PHENOTYPE
    phenotype_term:
      preferred_term: Prolonged QT interval
      term:
        id: HP:0001657
        label: Prolonged QT interval
    description: Records a prolonged QT interval (or a narrower term such as prolonged QTc).
members:
- member: Familial Long QT Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The inherited non-syndromic root entry, covering the numbered long QT
      types as subtypes. The three major genes reduce repolarizing potassium
      current (KCNQ1, KCNH2) or add persistent late sodium current (SCN5A).
    gene:
      preferred_term: KCNH2
      term:
        id: hgnc:6251
        label: KCNH2
- member: Long QT Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Heterozygous loss of function of KCNQ1, the pore-forming subunit of the
      slow delayed rectifier current (IKs); the most common genotype among
      genotyped patients.
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
- member: Long QT Syndrome 10
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Attributed to SCN4B, the sodium channel beta-4 subunit, on the basis of a
      single family; the entry records the gene-disease relationship as
      disputed.
    gene:
      preferred_term: SCN4B
      term:
        id: hgnc:10592
        label: SCN4B
- member: Long QT Syndrome 14
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A calmodulinopathy: dominant, usually de novo CALM1 missense variants
      impair calcium-dependent inactivation of the L-type calcium current.
    gene:
      preferred_term: CALM1
      term:
        id: hgnc:1442
        label: CALM1
- member: Long QT Syndrome 15
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The CALM2 calmodulinopathy, mechanistically parallel to LQT14 but at a
      second of the three calmodulin genes.
    gene:
      preferred_term: CALM2
      term:
        id: hgnc:1445
        label: CALM2
- member: Jervell and Lange-Nielsen Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic KCNQ1 loss of function, the recessive counterpart of LQT1, with
      congenital sensorineural deafness from loss of IKs in the inner ear.
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
- member: Jervell and Lange-Nielsen Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic loss of KCNE1, the IKs beta subunit, giving the same
      cardioauditory syndrome as JLNS1 from the accessory subunit.
    gene:
      preferred_term: KCNE1
      term:
        id: hgnc:6240
        label: KCNE1
- member: Andersen-Tawil Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of function of the inward rectifier Kir2.1 (KCNJ2) in a multisystem
      syndrome of ventricular arrhythmia, periodic paralysis and dysmorphic
      features.
    gene:
      preferred_term: KCNJ2
      term:
        id: hgnc:6263
        label: KCNJ2
- member: Cardiac Arrhythmia, Ankyrin-B-Related
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Variant-specific ANK2 phenotype with inconsistent QT prolongation; the
      entry records ANK2 as disputed for monogenic long QT syndrome.
    gene:
      preferred_term: ANK2
      term:
        id: hgnc:493
        label: ANK2
- member: Timothy Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Gain of function of the Cav1.2 L-type calcium channel (CACNA1C) causing
      marked QT prolongation with syndactyly, congenital heart disease and
      other multisystem features.
    gene:
      preferred_term: CACNA1C
      term:
        id: hgnc:1390
        label: CACNA1C
notes: >-
  Acquired long QT syndrome (MONDO:1060292) is in scope but has no DisMech
  entry yet; it becomes a member once curated. Long QT syndrome 2, 3, 5, 6, 8,
  9, 11, 12, 13 and 16 have no separate entries; each is a subtype of
  Familial Long QT Syndrome.

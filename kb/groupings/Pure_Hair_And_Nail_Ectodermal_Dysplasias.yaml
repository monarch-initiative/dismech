name: Pure Hair and Nail Ectodermal Dysplasias
display_name: Pure Hair and Nail Ectodermal Dysplasias (Pure HNED)
creation_date: "2026-08-17T00:00:00Z"
description: >-
  A curated grouping of the "pure" hair-and-nail ectodermal dysplasias: the
  subset of ectodermal dysplasias in which the defect is restricted to hair and
  nails (two of the four ectodermal structures), producing hypotrichosis or
  alopecia together with nail dystrophy while sparing teeth and sweat glands.
  The members are genetically and mechanistically distinct disease entities that
  converge on the same restricted hair-follicle and nail-matrix phenotype:
  hair-shaft keratins (KRT85/ECTD4, KRT74/ECTD7) and the hair-follicle
  transcription factor HOXC13 (ECTD9 in MONDO). This is explicitly the
  non-hypohidrotic counterpart of the Hypohidrotic Ectodermal Dysplasias
  grouping.
grouping_basis:
- SHARED_PHENOTYPE
grouping_rationale: >-
  Modeled as a Grouping (not an umbrella Disease with has_subtypes) because the
  "pure hair-nail" ectodermal dysplasias are genuinely distinct diseases with
  different genes, proteins, and proximal mechanisms that only converge
  downstream on a shared, restricted phenotype (hair + nail involvement, teeth
  and sweat glands spared). This follows the multi-gene-family modeling guidance
  in issue #8727: a code such as CURATE_ROOT_WITH_SUBTYPES is a priority hint,
  not a lump-vs-split ruling, and several diseases sharing a downstream endpoint
  do not become one Disease record. The members span structural hair-shaft
  keratins (KRT85, KRT74) and transcriptional regulators of hair-follicle
  differentiation (HOXC13) — there is no single shared molecular lesion,
  so SHARED_PHENOTYPE is the honest grouping basis rather than SHARED_MECHANISM.

  This grouping is deliberately kept distinct from the existing Hypohidrotic
  Ectodermal Dysplasias grouping. Hypohidrotic ectodermal dysplasia perturbs the
  EDA-EDAR-EDARADD-NF-kappaB signaling axis and produces the classic triad of
  hypohidrosis, sparse hair, and hypodontia/oligodontia with conical teeth. The
  pure hair-nail forms, by contrast, spare sweat glands and dentition entirely,
  restricting the phenotype to hypotrichosis/alopecia and nail dystrophy — the
  defining clinical boundary between the two groupings.

  Membership status is THIN: only one member (KRT85-Related Pure Hair-Nail
  Ectodermal Dysplasia, ECTD4) is currently a curated standalone Disease entry.
  The remaining MONDO children of MONDO:0019071 are recorded here as TODO
  members, to be added once standalone Disease entries exist:
  ECTD7 (KRT74, MONDO:0013975), ECTD9 (HOXC13, MONDO:0013976), and
  ECTD6 (MONDO:0013974, no causal gene currently assigned in MONDO). They are
  deliberately NOT listed under members[] until curated, to avoid dangling
  foreign keys.

  NOTE ON NUMBERING (flagged for reviewer): issue #8656 lists the target types
  as ECTD4 (KRT85), ECTD7 (KRT74), ECTD8 (HOXC13), and ECTD9 (HR). This
  disagrees with the current MONDO classification, which places HOXC13 at
  ECTD9 (MONDO:0013976, verified via RO:0004003) and does NOT include an
  HR-associated disorder among the descendants of MONDO:0019071 — HR (hairless)
  variants cause atrichia with papular lesions / congenital atrichia
  (universal alopecia), which MONDO classes separately and which is not a
  "pure hair AND nail" ectodermal dysplasia. This grouping follows the verified
  MONDO hierarchy rather than the issue's ECTD numbering; whether an HR entry
  should ever be admitted is left as a reviewer question.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019071
      label: pure hair and nail ectodermal dysplasia
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      closeMatch: the grouping corresponds to the MONDO pure hair and nail
      ectodermal dysplasia class but is implemented as an explicit curated subset
      of current dismech Disease entries (presently only the KRT85/ECTD4 entry)
      rather than as an automatic ontology closure over every gene-defined
      pure hair-nail subtype. closeMatch keeps the MONDO concept in the curation
      queue while the remaining types are curated.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        The single listed member is the KRT85 (ECTD4) pure hair-nail entry.
        Additional MONDO descendants (ECTD7/KRT74 MONDO:0013975, ECTD9/HOXC13
        MONDO:0013976, ECTD6 MONDO:0013974) should be added only when standalone
        Disease entries are curated.
membership_criteria:
- description: >-
    A member is a "pure" (non-hypohidrotic) ectodermal dysplasia Disease entry
    whose phenotype is restricted to hair and nail appendages: it manifests a
    hair abnormality (hypotrichosis, sparse hair, alopecia, or abnormal hair
    shaft) together with nail dystrophy, arising from a defect in hair-follicle
    differentiation, while sparing sweat glands (no hypohidrosis) and dentition
    (no hypodontia/oligodontia). The sparing of teeth and sweat glands is the
    boundary that distinguishes these entries from the hypohidrotic ectodermal
    dysplasias.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - operator: OR
      description: Has a hair-follicle or hair-shaft phenotype.
      operands:
      - criterion_predicate: HAS_PHENOTYPE
        description: Sparse hair (includes sparse scalp hair).
        phenotype_term:
          preferred_term: Sparse hair
          term:
            id: HP:0008070
            label: Sparse hair
      - criterion_predicate: HAS_PHENOTYPE
        description: Alopecia.
        phenotype_term:
          preferred_term: Alopecia
          term:
            id: HP:0001596
            label: Alopecia
      - criterion_predicate: HAS_PHENOTYPE
        description: Abnormal hair shaft morphology.
        phenotype_term:
          preferred_term: Abnormal hair shaft morphology
          term:
            id: HP:0003328
            label: Abnormal hairshaft morphology
    - criterion_predicate: HAS_PHENOTYPE
      description: Nail dystrophy or other nail-matrix abnormality.
      phenotype_term:
        preferred_term: Abnormal nail morphology
        term:
          id: HP:0001597
          label: Abnormal nail morphology
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: >-
        Defect in hair-follicle differentiation (hair follicle development or a
        descendant process such as keratinization of the hair shaft / nail matrix).
      biological_processes:
      - preferred_term: hair follicle development
        term:
          id: GO:0001942
          label: hair follicle development
members:
- member: KRT85-Related Pure Hair-Nail Ectodermal Dysplasia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Ectodermal dysplasia 4, hair/nail type (ECTD4). Biallelic loss-of-function
      mutations in KRT85 disrupt keratin 85, a type II hair-specific keratin
      expressed in the hair cortex and nail matrix. Loss of this structural
      intermediate-filament protein selectively compromises hair-shaft integrity
      and nail-matrix keratinization, producing hypotrichosis/alopecia and nail
      dystrophy from early childhood with normal sweating and dentition. This is
      the structural-keratin member of the grouping, distinguished from the
      transcription-factor member (HOXC13, ECTD9) and from the second hair-shaft
      keratin ECTD7 (KRT74) by the specific hair-cortex/cuticle keratin affected.
    gene:
      preferred_term: KRT85
      term:
        id: hgnc:6462
        label: KRT85
    phenotype_term:
      preferred_term: Nail dystrophy
      term:
        id: HP:0008404
        label: Nail dystrophy
    biological_processes:
    - preferred_term: hair follicle development
      term:
        id: GO:0001942
        label: hair follicle development
notes: >-
  Exclude hypohidrotic ectodermal dysplasias (EDA/EDAR/EDARADD-related, and
  WNT10A-related HED) and syndromic ectodermal dysplasias (TP63 ectodermal
  dysplasia spectrum, IKBKG-related, cranioectodermal dysplasia): those involve
  sweat-gland and/or tooth defects or additional organ systems and are covered
  by other groupings or standalone entries. A candidate belongs here only if the
  phenotype is genuinely restricted to hair and nails with teeth and sweat glands
  spared. High-value future members, once standalone Disease entries are curated:
  ECTD7 (KRT74, MONDO:0013975) and ECTD9 (HOXC13, MONDO:0013976); ECTD6
  (MONDO:0013974) is a further MONDO child with no causal gene currently
  assigned.

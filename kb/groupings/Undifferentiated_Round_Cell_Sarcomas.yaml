name: Undifferentiated Round Cell Sarcomas
display_name: Undifferentiated round cell sarcomas (URCS)
creation_date: '2026-11-09T17:05:00Z'
description: >-
  Undifferentiated round cell sarcomas are high-grade mesenchymal tumours of
  small to medium round to ovoid cells whose histology shows no line of
  differentiation, so a definitive diagnosis cannot be reached on morphology
  alone and is made molecularly. The group is a diagnostic one before it is a
  mechanistic one: the members share a presentation at the microscope, not a
  driver, a lineage or a pathway. Their drivers are unrelated transcription
  factor fusions and, in one case, an internal tandem duplication, and the
  derived cell of origin is unresolved for most of them.

  Four members are the entities of the World Health Organization's section for
  these tumours, which in the 2020 fifth edition was "undifferentiated small
  round cell sarcomas of bone and soft tissue" and in the 2026 sixth edition
  (STB6) is "undifferentiated spindle and round cell sarcomas", renamed because
  several of the tumours show spindle as well as round cell morphology. The
  other two, desmoplastic small round cell tumour and clear cell sarcoma of the
  kidney, sit in other WHO chapters but are in the same differential; the
  rationale below says how each one gets in.

  Two things make the group worth holding as a unit. The first is that
  molecular testing moves tumours into it and between its members: in a
  real-world sequencing cohort, nineteen of twenty-three tumours whose
  diagnosis sequencing refined had arrived as sarcoma not otherwise specified
  or as undifferentiated round or small cell sarcoma. The second is that the
  members' outcomes differ sharply while their histology does not, so the
  distinction is worth drawing at diagnosis rather than afterwards: in one
  148-patient series the three-year overall survival was 92.2 per cent for
  BCOR::CCNB3 sarcoma against 39.6 per cent for CIC-rearranged sarcoma.
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by diagnostic convention. The members are the tumours a pathologist
  has to separate when a biopsy shows an undifferentiated round cell sarcoma,
  and the group is held together by that shared diagnostic problem rather than
  by a shared mechanism. No mechanism is asserted across the members: CIC::DUX4
  and its variants, BCOR fusions and internal tandem duplication, the NFATC2
  and PATZ1 fusions, EWSR1::WT1, and the EWSR1-ETS fusions of Ewing sarcoma are
  unrelated lesions, and the entries record no shared pathway. SHARED_MECHANISM
  would therefore be the wrong basis even though every member is
  fusion-defined.

  Why Ewing sarcoma is a member. It is in the WHO section in both the fifth and
  the sixth edition, STB6 names it first of the four, and each of the three
  other WHO members in this grouping names Ewing Sarcoma in its own
  differential_diagnoses. It is also the comparator the field measures the
  others against: the CIC survival figure, the BCOR survival figure and the
  CIC-versus-Ewing immunohistochemical panel are all stated as contrasts with
  Ewing sarcoma. A grouping of this differential without it would omit the
  entity the other members are defined against.

  Why desmoplastic small round cell tumour is a member although WHO files it
  elsewhere. The reviewing literature places it inside the undifferentiated
  round cell sarcoma category as one of the more prevalent tumours with round
  cell morphology, and it is one of the mimics tested in the diagnostic series
  this grouping cites. Its own WHO placement is a separate question from
  whether it belongs in this differential.

  Why clear cell sarcoma of the kidney is a member, and on what basis. It
  enters on a shared lesion rather than on the WHO section or on round cell
  morphology: BCOR internal tandem duplication occurs both in sarcoma with
  BCOR genetic alterations and in clear cell sarcoma of the kidney, both show
  strong diffuse nuclear BCOR by immunohistochemistry, and the BCOR sarcoma
  entry names Clear Cell Sarcoma of Kidney in its differential and records the
  overlap in its own scope note. Its membership is the weakest of the six and
  is stated as such rather than left to be inferred.

  What this grouping is not. It is not the WHO section, which holds four
  entities and not these six; it is not a MONDO subtree, for the reason the
  notes record; and it is not a statement that the members are one disease.
  Every member stays a separate Disease entry because the molecular lesion,
  the diagnostic test, the outcome and in several cases the organ of origin
  differ. Membership is by explicit listing.
membership_criteria:
- description: >-
    A member is a Disease entry for a sarcoma. NECESSARY and very far from
    sufficient: it is the one condition of membership that any structured field
    in this knowledge base records, so the audit checks it as a floor rather
    than as a definition. It excludes the non-mesenchymal round cell tumours
    that enter the same differential and are deliberately not members here,
    among them lymphoblastic lymphoma, neuroblastoma and the SMARCB1-deficient
    rhabdoid tumours.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    description: >-
      The entry carries the ICD-O morphology classification value Sarcoma,
      which the audit reads as the keyed tag icdo_morphology:Sarcoma.
    classification: "icdo_morphology:Sarcoma"
- description: >-
    A member is a tumour that presents as an undifferentiated round cell
    sarcoma and whose diagnosis is settled molecularly rather than
    morphologically. NECESSARY and not sufficient, and deliberately carrying no
    machine-checkable logic: the condition is a statement about how a diagnosis
    is reached, and no structured field in this knowledge base records it.
    Encoding a proxy would either admit tumours that are not in this
    differential or exclude members that are, so the condition is stated for a
    reader and audited by hand against the sources cited here.
  criteria_semantics: NECESSARY
  evidence:
  - reference: PMID:39381843
    reference_title: "Nuclear DUX4 immunohistochemistry is a highly sensitive and specific marker for the presence of CIC::DUX4 fusion in CIC-rearranged sarcomas: a study of 48 molecularly confirmed cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Undifferentiated round cell sarcomas (URCS) comprise a category of malignant mesenchymal tumours with histological features that preclude a definitive diagnosis based on histomorphology alone"
    explanation: >-
      States the criterion in the terms this grouping uses, and in the terms
      the field uses: the category is defined by histology being insufficient
      for diagnosis. A framing sentence opening a study of DUX4
      immunohistochemistry rather than that study's own result.
  - reference: PMID:39381843
    reference_title: "Nuclear DUX4 immunohistochemistry is a highly sensitive and specific marker for the presence of CIC::DUX4 fusion in CIC-rearranged sarcomas: a study of 48 molecularly confirmed cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "This group includes more prevalent sarcomas with round-cell morphology such as Ewing sarcoma and desmoplastic small round cell tumour, as well as rare fusion-defined entities such as CIC-rearranged sarcoma (CRS), sarcomas with BCOR genetic alterations and round cell sarcomas, with fusions involving EWSR1 and non-ETS family genes such as NFATC2 and PATZ1"
    explanation: >-
      Names five of this grouping's six members as the content of the
      category, which is the closest any cited source comes to stating the
      membership: Ewing sarcoma, desmoplastic small round cell tumour,
      CIC-rearranged sarcoma, sarcoma with BCOR genetic alterations, and the
      EWSR1-non-ETS group with both its NFATC2 and PATZ1 strata. Clear cell
      sarcoma of the kidney is not in this list and is not justified by it;
      see its member row. Background to this paper rather than its result.
  - reference: PPR:PPR1332161
    reference_title: "Clinical Next-Generation Sequencing in Sarcoma Diagnosis and Classification: A Real-World Cohort Study"
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen of the 23 refined tumors had initially been classified as sarcoma, not otherwise specified, or undifferentiated round/small cell sarcoma"
    explanation: >-
      Measures the traffic into this category rather than asserting it: of the
      tumours whose diagnosis clinical sequencing refined in a 106-patient
      real-world cohort, nineteen of twenty-three had arrived as sarcoma not
      otherwise specified or as undifferentiated round or small cell sarcoma.
      That is the diagnostic instability the second criterion names. Two
      limits are worth stating. This is a **preprint** (Research Square,
      posted 2026, not peer reviewed at the time of curation) and is cited
      here only beside the WHO classification review, never as sole support
      for any claim. And its denominator is the refined subset, not the whole
      cohort, so the figure says what refinement starts from and not how often
      refinement happens.
members:
- member: Ewing Sarcoma
  member_type: DISEASE
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  differentiating_mechanisms:
  - description: >-
      EWSR1-ETS fusions, most often EWSR1::FLI1, and the entity the other WHO
      members of this grouping are defined against. NKX2.2 expression
      separates it from CIC-rearranged sarcoma in the immunohistochemical
      panel that distinguishes the two.
    evidence:
    - reference: PMID:26685084
      reference_title: "CIC-rearranged Sarcomas: A Study of 20 Cases and Comparisons With Ewing Sarcomas."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Distinguishing immunohistochemical features included heterogenous CD99 reactivity, nuclear WT1 expression, and calretinin expression in the CIC-rearranged sarcomas and NKX2.2 expression in the Ewing sarcomas"
      explanation: >-
        The marker that separates this member from CIC-rearranged sarcoma, from
        the cohort study that compared the two directly.
  - description: >-
      Its membership in the WHO section is unchanged across the fifth and
      sixth editions, where it is named first of the four entities.
    evidence:
    - reference: PMID:42839882
      reference_title: "The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "The tumors included in this section are Ewing sarcoma, NFATC2-rearranged sarcoma, sarcomas with BCOR genetic alterations, and CIC-rearranged sarcoma"
      explanation: >-
        The STB6 editors' own statement of the section's content. Expert
        consensus rather than a measurement, hence OTHER, and a synthesis of
        work the editors did not themselves perform.
- member: CIC-Rearranged Sarcoma
  member_type: DISEASE
  disease_term:
    preferred_term: CIC-rearranged sarcoma
    term:
      id: MONDO:0956989
      label: CIC-rearranged sarcoma
  differentiating_mechanisms:
  - description: >-
      A CIC rearrangement, most often CIC::DUX4, producing a chimeric
      transcription factor that activates PEA3 subfamily ETS genes. Strong
      diffuse nuclear ETV4 is the practical diagnostic surrogate and is
      essentially absent from the mimics.
    evidence:
    - reference: PMID:27562494
      reference_title: "ETV4 is a useful marker for the diagnosis of CIC-rearranged undifferentiated round-cell sarcomas: a study of 127 cases including mimicking lesions."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "All CIC-rearranged undifferentiated round-cell sarcomas (on core needle biopsies and open biopsies) were ETV4-positive with a strong diffuse nuclear pattern"
      explanation: >-
        The stain that identifies this member among the group, in a 127-case
        study that included its mimics.
  - description: >-
      The worst outcome of the members, and measured against Ewing sarcoma
      matched for age and stage, which is why separating the two at diagnosis
      matters clinically.
    evidence:
    - reference: PMID:28346326
      reference_title: "Sarcomas With CIC-rearrangements Are a Distinct Pathologic Entity With Aggressive Outcome: A Clinicopathologic and Molecular Study of 115 Cases."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "with a 5-year survival of 43%, which was significantly lower than the 77% 5-year survival in the control Ewing sarcoma group"
      explanation: >-
        The survival gap against a matched Ewing sarcoma control group.
        Follow-up was available for 57 of the 115 patients, so the estimate
        rests on half the cohort.
- member: Sarcoma with BCOR Genetic Alterations
  member_type: DISEASE
  disease_term:
    preferred_term: sarcoma with BCOR genetic alterations
    term:
      id: MONDO:0958159
      label: sarcoma with BCOR genetic alterations
  differentiating_mechanisms:
  - description: >-
      BCOR overexpression, reached either by fusion (BCOR::CCNB3,
      BCOR::MAML3) or by internal tandem duplication. Strong diffuse nuclear
      BCOR immunoreactivity follows whichever lesion is present, which is what
      makes the alterations one entity.
    evidence:
    - reference: PMID:27428733
      reference_title: "BCOR Overexpression Is a Highly Sensitive Marker in Round Cell Sarcomas With BCOR Genetic Abnormalities."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "All SBRCTs with BCOR-MAML3 and BCOR-CCNB3 fusions, as well as most with BCOR ITD (93%), and all CCSKs showed strong and diffuse nuclear BCOR immunoreactivity"
      explanation: >-
        The convergence that defines this member, at protein level, across
        both kinds of lesion. The same sentence is the basis of clear cell
        sarcoma of the kidney's membership below, which is why it appears on
        both rows.
  - description: >-
      The best outcome of the members, and the contrast that makes this
      distinction worth drawing: the same series measured 92.2 per cent
      three-year survival here against 39.6 per cent for CIC-rearranged
      sarcoma.
    evidence:
    - reference: PMID:36791667
      reference_title: "A global collaboRAtive study of CIC-rearranged, BCOR::CCNB3-rearranged and other ultra-rare unclassified undifferentiated small round cell sarcomas (GRACefUl)."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "the 3-year overall survival (OS) was 92.2% (95% CI 71.5-98.0) in BCOR::CCNB3 patients, 39.6% (95% CI 27.7-51.3) in CIC-rearranged sarcomas"
      explanation: >-
        The outcome spread across two members of this grouping, from 148
        patients at 21 reference centres. The two groups differ in age and
        primary site as well as in fusion, so the gap is not attributable to
        the lesion alone.
- member: Round Cell Sarcoma with EWSR1-non-ETS Fusion
  member_type: DISEASE
  disease_term:
    preferred_term: round cell sarcoma with EWSR1-non-ETS fusion
    term:
      id: MONDO:0958160
      label: round cell sarcoma with EWSR1-non-ETS fusion
  differentiating_mechanisms:
  - description: >-
      An EWSR1 fusion to a partner outside the ETS family, in two strata that
      the entry records as separately evidenced: NFATC2 and PATZ1. NKX3-1
      expression marks the NFATC2 stratum and is negative in Ewing sarcoma.
    evidence:
    - reference: PMID:31972596
      reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "NKX3-1 was expressed in 9 of 11 (82%) EWSR1-NFATC2 sarcomas, often diffuse and of moderate or strong intensity"
      explanation: >-
        The marker for this member's NFATC2 stratum. It is not specific to the
        group, since the same study found every mesenchymal chondrosarcoma
        positive, and it covers the NFATC2 stratum only.
  - description: >-
      This member's WHO category no longer exists. STB6 split it, keeping
      NFATC2-rearranged sarcoma in the section and moving PATZ1-rearranged
      sarcoma to tumours of uncertain differentiation in the soft tissue
      chapter. The entry already recorded the category as provisional and its
      two strata as separately evidenced, which STB6 has now acted on; whether
      the dismech entry follows the split is an open question and not settled
      by this grouping.
    evidence:
    - reference: PMID:42839882
      reference_title: "The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "the category round cell sarcomas with EWSR1-non-ETS fusions in the 5th edition has been split into NFATC2-rearranged sarcoma (included in this section)"
      explanation: >-
        The STB6 editors state the split of the category this member's entry
        is built on. Recorded here because a grouping that cites the entry
        should not present its category as current without saying so.
- member: Desmoplastic Small Round Cell Tumor
  member_type: DISEASE
  disease_term:
    preferred_term: desmoplastic small round cell tumor
    term:
      id: MONDO:0019373
      label: desmoplastic small round cell tumor
  differentiating_mechanisms:
  - description: >-
      EWSR1::WT1, a fusion unique among the members, with a desmoplastic
      stroma and a polyphenotypic immunoprofile that no other member shows.
      WHO files it in another chapter; it is a member here because the
      reviewing literature places it in this differential, not because of its
      WHO placement.
    evidence:
    - reference: DOI:10.1158/0008-5472.can-23-3334
      reference_title: "Comprehensive Transcriptomic Analysis of EWSR1::WT1 Targets Identifies CDK4/6 Inhibitors as an Effective Therapy for Desmoplastic Small Round Cell Tumors"
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "Desmoplastic small round cell tumors (DSRCT) are a type of aggressive, pediatric sarcoma characterized by the EWSR1::WT1 fusion oncogene"
      explanation: >-
        States the defining fusion that separates this member from the others.
        A framing sentence in a therapeutic study rather than its own result.
- member: Clear Cell Sarcoma of Kidney
  member_type: DISEASE
  disease_term:
    preferred_term: clear cell sarcoma of kidney
    term:
      id: MONDO:0005006
      label: clear cell sarcoma of kidney
  differentiating_mechanisms:
  - description: >-
      A renal tumour, and the one member that does not enter through the WHO
      section or through round cell morphology. It enters on a shared lesion:
      BCOR internal tandem duplication occurs both here and in sarcoma with
      BCOR genetic alterations, and both show strong diffuse nuclear BCOR. Its
      own morphology is nests and cords of epithelioid cells in a myxoid
      background rather than sheets of round cells, and its clinical identity
      is renal, so this is the weakest membership of the six and is recorded
      as such.
    evidence:
    - reference: PMID:27428733
      reference_title: "BCOR Overexpression Is a Highly Sensitive Marker in Round Cell Sarcomas With BCOR Genetic Abnormalities."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "All SBRCTs with BCOR-MAML3 and BCOR-CCNB3 fusions, as well as most with BCOR ITD (93%), and all CCSKs showed strong and diffuse nuclear BCOR immunoreactivity"
      explanation: >-
        The link this membership rests on: every clear cell sarcoma of the
        kidney tested showed the same BCOR overexpression as the round cell
        sarcomas with BCOR abnormalities. It establishes the shared lesion and
        not a shared histology or a shared clinical course.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020661
      label: undifferentiated round cell sarcoma
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      relatedMatch, which asserts no subsumption either way, because the
      mapping is a cross-reference to the MONDO concept of the same name and
      nothing more. It is deliberately not exactMatch or narrowMatch: not one
      of the six members' primary MONDO terms resolves under MONDO:0020661.
      Checked member by member through OLS hierarchical ancestors on 9
      November 2026, including the three whose dismech entries list
      "undifferentiated small round cell sarcoma" among their parents. So a
      subsumption predicate here would be false for every member, and the
      grouping page must not take the MONDO subtree as its coverage scope.
    consistency:
    - reference: MONDO
      consistent: INCONSISTENT
      notes: >-
        No member's primary MONDO term is a hierarchical descendant of
        MONDO:0020661 (OLS, 9 November 2026): CIC MONDO:0956989, BCOR
        MONDO:0958159, EWSR1-non-ETS MONDO:0958160, desmoplastic small round
        cell tumour MONDO:0019373, clear cell sarcoma of the kidney
        MONDO:0005006 and Ewing sarcoma MONDO:0012817 all resolve elsewhere.
        Recorded as inconsistent so the gap is visible rather than implied by
        a weak predicate; it is a candidate MONDO classification report, not a
        membership error here.
notes: >-
  Naming. The grouping is called undifferentiated round cell sarcomas rather
  than after either WHO edition's section title. The fifth edition called the
  section "undifferentiated small round cell sarcomas of bone and soft
  tissue"; STB6 renamed it "undifferentiated spindle and round cell sarcomas",
  because several of the tumours show spindle as well as round cell
  morphology. Pinning the grouping to one edition's wording would date it, and
  this grouping is not that section in either edition: it holds six members
  where the section holds four, and it omits NFATC2-rearranged sarcoma as a
  separate entity because this knowledge base curates NFATC2 as a stratum of
  the EWSR1-non-ETS entry.

  Membership is by explicit listing and not by ontology closure, for an
  unusually clear reason: no member sits under MONDO's own
  "undifferentiated round cell sarcoma" class (see the mapping justification),
  so closure over that class would return no members at all.

  Tumours deliberately not members. The round cell differential also contains
  non-mesenchymal tumours, which the first membership criterion excludes:
  lymphoblastic lymphoma, neuroblastoma, and the SMARCB1-deficient rhabdoid
  tumours. Alveolar rhabdomyosarcoma and poorly differentiated synovial
  sarcoma are round cell sarcomas and were tested as mimics in two of the
  series cited here, but both have a line of differentiation that morphology
  and immunohistochemistry establish, so neither is undifferentiated in the
  sense the second criterion requires. Mesenchymal chondrosarcoma shares the
  NKX3-1 stain with one member and is not a member either, for the same
  reason.

  Preprint citation. PPR:PPR1332161 is the first preprint cited in this
  family of entries. It carries one measured claim here, the share of
  refined tumours that arrived as sarcoma NOS or undifferentiated round or
  small cell sarcoma, and it is paired on the same criterion with the WHO
  classification review and with a peer-reviewed study of the category, so
  it is never sole support. Its preprint status is stated in the evidence
  item's own explanation rather than only here.
references:
- reference: PMID:39381843
  title: "Nuclear DUX4 immunohistochemistry is a highly sensitive and specific marker for the presence of CIC::DUX4 fusion in CIC-rearranged sarcomas: a study of 48 molecularly confirmed cases."
- reference: PMID:42839882
  title: "The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition."
- reference: PPR:PPR1332161
  title: "Clinical Next-Generation Sequencing in Sarcoma Diagnosis and Classification: A Real-World Cohort Study"

name: Inherited Distal Renal Tubular Acidoses
creation_date: '2026-11-20T21:58:17Z'
description: Shared distal acid-secretion defect; compare SLC4A1 exchange with ATP6V1B1/ATP6V0A4 proton-pump
  defects.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: The four numbered series members share defective distal urinary acidification. Basolateral
  anion exchange and apical proton pumping are different components of the acid-secretion machinery; erythroid
  and inner-ear involvement distinguish members further. The union is scoped to these four curated entities,
  not every acquired or newly discovered genetic cause of distal renal tubular acidosis, and does not
  impose recessive inheritance on every pump-related presentation.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:179800
      label: Distal renal tubular acidosis
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:179800, OMIM:267300, OMIM:602722,
      OMIM:611590. These numbered concepts correspond to this explicit union. The mapping aligns the named
      series with its curated members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates metabolic acidosis and SLC4A1 or ATP6V1B1 or ATP6V0A4. This is a
    necessary disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene
    mentions do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Metabolic acidosis
        term:
          id: HP:0001942
          label: Metabolic acidosis
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: SLC4A1
          term:
            id: hgnc:11027
            label: SLC4A1
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: ATP6V1B1
          term:
            id: hgnc:853
            label: ATP6V1B1
      - criterion_predicate: HAS_GENE
        gene: &id003
          preferred_term: ATP6V0A4
          term:
            id: hgnc:866
            label: ATP6V0A4
members:
- member: Autosomal Dominant Distal Renal Tubular Acidosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Dominant SLC4A1 disease can result from mistargeting of the basolateral anion exchanger
      despite preserved intrinsic transport activity.
    gene:
      preferred_term: SLC4A1
      term:
        id: hgnc:11027
        label: SLC4A1
    evidence:
    - reference: PMID:9312167
      reference_title: Familial distal renal tubular acidosis is associated with mutations in the red
        cell anion exchanger (Band 3, AE1) gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All affected patients in four families with autosomal dominant familial renal tubular acidosis
        (dRTA) were heterozygous for mutations in their red cell HCO3-/Cl- exchanger, band 3 (AE1, SLC4A1)
        genes, and these mutations were not found in any of the nine normal family members studied.
      explanation: The original demonstration that heterozygous SLC4A1 (band 3/AE1) variants segregate
        with autosomal dominant dRTA.
    - reference: PMID:14734552
      reference_title: A novel missense mutation in AE1 causing autosomal dominant distal renal tubular
        acidosis retains normal transport function but is mistargeted in polarized epithelial cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: They confirm that dominant dRTA is associated with non-polarized trafficking of the protein,
        with no significant effect on anion transport function in vitro, which remains an unusual mechanism
        of human disease.
      explanation: Establishes that intrinsic anion-exchange function of the dominant mutant is preserved
        and the lesion is trafficking, which is why the molecular function is bound without a decreased
        modifier.
- member: Renal Tubular Acidosis Distal 4 with Hemolytic Anemia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Recessive SLC4A1 disease combines renal acidification impairment with erythrocyte abnormalities
      and hemolytic anemia.
    gene: *id001
    evidence:
    - reference: PMID:20799361
      reference_title: Hemolytic anemia and distal renal tubular acidosis in two Indian patients homozygous
        for SLC4A1/AE1 mutation A858D.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Familial distal renal tubular acidosis (dRTA) can be caused by mutations in the Cl2/HCO32
        exchanger of the renal Type A intercalated cell, kidney AE1/SLC4A1.
      explanation: This mechanistic passage identifies SLC4A1/AE1 as a collecting-duct intercalated-cell
        exchanger required for distal urinary acidification.
    - reference: PMID:20799361
      reference_title: Hemolytic anemia and distal renal tubular acidosis in two Indian patients homozygous
        for SLC4A1/AE1 mutation A858D.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: AE1 is expressed not only in Type A intercalated cells, but also in late erythroid precursors,
        reticulocytes, and circulating red cells.
      explanation: This supports the same gene product acting in both kidney acidification cells and erythroid
        lineages.
    - reference: PMID:20799361
      reference_title: Hemolytic anemia and distal renal tubular acidosis in two Indian patients homozygous
        for SLC4A1/AE1 mutation A858D.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Distal urinary acidification requires coordinated function of several proteins in the
        Type A intercalated cell of the renal collecting duct: the multi-subunit, vacuolar (v)H+-ATPase
        of the apical membrane, cytoplasmic carbonic anhydrase II, and the SLC4A1/AE1 Cl−/HCO3− exchanger
        (kidney Band 3, kAE1).'
      explanation: This mechanistic passage directly places SLC4A1/AE1 in the distal urinary acidification
        machinery.
- member: Renal Tubular Acidosis, Distal, 2, With Progressive Sensorineural Hearing Loss
  member_type: DISEASE
  differentiating_mechanisms:
  - description: ATP6V1B1 affects the B1 proton-pump subunit, linking renal acid secretion to inner-ear
      acid-base homeostasis.
    gene: *id002
    evidence:
    - reference: PMID:9916796
      reference_title: Mutations in the gene encoding B1 subunit of H+-ATPase cause renal tubular acidosis
        with sensorineural deafness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We demonstrate here that mutations in ATP6B1, encoding the B-subunit of the apical proton
        pump mediating distal nephron acid secretion, cause distal renal tubular acidosis
      explanation: The gene-disease assignment from the study that made it. ATP6B1 is the former symbol
        for ATP6V1B1.
    - reference: PMID:28934385
      reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice, a
        new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The vacuolar (v)H+-ATPase pump is one of the key membrane transporters for acid excretion
        in the α-intercalated cells of the distal nephron, and it is also expressed in the inner ear where
        it functions in endolymph pH homeostasis
      explanation: States both roles of the same pump in one sentence, which is the basis for branching
        here rather than chaining.
- member: Renal Tubular Acidosis, Distal, 3, With or Without Sensorineural Hearing Loss
  member_type: DISEASE
  differentiating_mechanisms:
  - description: ATP6V0A4 affects the a4 proton-pump subunit; hearing involvement is variable and is not
      required for membership.
    gene: *id003
    evidence:
    - reference: PMID:16611712
      reference_title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence
        for early sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Mutations in the ATP6V1B1 and ATP6V0A4 genes, encoding subunits B1 and 4 of apical H(+)
        ATPase, cause recessive forms of distal renal tubular acidosis (dRTA).
      explanation: States the gene-to-pump-to-disease link that this edge asserts.

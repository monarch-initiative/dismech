members:
- member: CCDI Medulloblastoma
  member_type: GROUPING
  differentiating_mechanisms:
  - description: >-
      CCDI value Medulloblastoma. The umbrella medulloblastoma entry and the
      three WHO 2021 molecular groups curated as their own entries
      (WNT-activated, SHH-activated, non-WNT/non-SHH).
- member: CCDI CNS Germ Cell Tumors
  member_type: GROUPING
  differentiating_mechanisms:
  - description: >-
      CCDI value CNS Germ Cell Tumors. The central nervous system germ cell
      tumor spectrum entry and central nervous system teratoma.
- member: Rhabdomyosarcoma
  member_type: GROUPING
  differentiating_mechanisms:
  - description: >-
      CCDI value Rhabdomyosarcoma. The fusion-positive alveolar and
      fusion-negative embryonal histotypes, grouped by myogenic histogenesis.

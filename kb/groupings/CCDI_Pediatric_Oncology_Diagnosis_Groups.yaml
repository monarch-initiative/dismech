    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Glioneuronal and Neuronal Tumors.
      classification: "ccdi_pediatric_oncology_category:Glioneuronal and Neuronal Tumors"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group High-Grade Glioma.
      classification: "ccdi_pediatric_oncology_category:High-Grade Glioma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Low-Grade Gliomas.
      classification: "ccdi_pediatric_oncology_category:Low-Grade Gliomas"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Other Brain Tumors.
      classification: "ccdi_pediatric_oncology_category:Other Brain Tumors"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Neuroblastoma.
      classification: "ccdi_pediatric_oncology_category:Neuroblastoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Retinoblastoma.
      classification: "ccdi_pediatric_oncology_category:Retinoblastoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Liver Tumors.

      classification: "ccdi_pediatric_oncology_category:Other Brain Tumors"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Neuroblastoma.
      classification: "ccdi_pediatric_oncology_category:Neuroblastoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Retinoblastoma.
      classification: "ccdi_pediatric_oncology_category:Retinoblastoma"
    - criterion_predicate: HAS_CLASSIFICATION

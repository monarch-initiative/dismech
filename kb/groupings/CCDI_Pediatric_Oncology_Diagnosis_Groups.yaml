name: CCDI Pediatric Oncology Diagnosis Groups
display_name: CCDI Pediatric Oncology Diagnosis Groups (caDSR CDE 16607972)
creation_date: "2026-11-14T00:00:00Z"
description: >-
  The diagnosis groups under which the NCI Childhood Cancer Data Initiative
  (CCDI) files a pediatric cancer diagnosis: the 31 permissible values of caDSR
  common data element 16607972, Diagnosis Pediatric Oncology Grouping Category.
  The list is flat and mixes histology (medulloblastoma, ependymoma), site
  (renal tumors, liver tumors) and lineage (myeloid leukemia). This grouping
  collects the dismech entries that carry one of those values, so the knowledge
  base can be browsed, and exchanged with a CCDI data submission, along the
  same axis a childhood cancer data commons uses.
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by a data standard, not by biology. A member is here because a case
  of it is filed under a CCDI diagnosis group, recorded on the entry as
  `classifications.ccdi_pediatric_oncology_category`; nothing mechanistic is
  shared across the members, which run from an embryonal brain tumor to a
  histiocytic neoplasm. Membership does not say a disease is restricted to
  children: osteosarcoma and Hodgkin lymphoma are members although most cases
  are adult. The members stay separate Disease entries because each CCDI value
  spans tumors with different drivers, cells of origin and treatment.

  Structure follows the CDE one-to-one and adds no level of its own. A CCDI
  value held by a grouping is nested (medulloblastoma, CNS germ cell tumors,
  rhabdomyosarcoma); the other values are listed as direct members, with the
  value named on each row. The Rhabdomyosarcoma grouping predates this one and
  is grouped by myogenic histogenesis; it is nested here because its members
  are exactly the entries carrying the CCDI Rhabdomyosarcoma value.

  Coverage is a first tranche. The value is computed from each entry's NCIt
  concept by `just ccdi-pediatric-oncology-audit`, which also proposes a value
  for many adult-predominant entries (hepatocellular carcinoma under Liver
  Tumors, small cell lung cancer under Endocrine and Neuroendocrine Tumors).
  Those entries are not tagged and are not members. No MONDO mapping: MONDO has
  no class for a CCDI diagnosis group.
membership_criteria:
- description: >-
    A member carries a CCDI pediatric oncology diagnosis group, a permissible
    value of caDSR CDE 16607972, in its classifications block. The criterion
    lists the values dismech currently assigns.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    operands:
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Medulloblastoma.
      classification: "ccdi_pediatric_oncology_category:Medulloblastoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group CNS Germ Cell Tumors.
      classification: "ccdi_pediatric_oncology_category:CNS Germ Cell Tumors"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Rhabdomyosarcoma.
      classification: "ccdi_pediatric_oncology_category:Rhabdomyosarcoma"

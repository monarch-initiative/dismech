      classification: "ccdi_pediatric_oncology_category:Renal Tumors"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Germ Cell Tumors.
      classification: "ccdi_pediatric_oncology_category:Germ Cell Tumors"
    - criterion_predicate: HAS_CLASSIFICATION

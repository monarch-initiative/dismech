      classification: "ccdi_pediatric_oncology_category:Non-Hodgkin Lymphoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Hodgkin Lymphoma.
      classification: "ccdi_pediatric_oncology_category:Hodgkin Lymphoma"
    - criterion_predicate: HAS_CLASSIFICATION
      description: CCDI diagnosis group Other Hematopoietic Tumors.
      classification: "ccdi_pediatric_oncology_category:Other Hematopoietic Tumors"
    - criterion_predicate: HAS_CLASSIFICATION

notes: >-
  Source: caDSR CDE 16607972 version 1, value domain 16607971, retrieved
  2026-11-14 from the caDSR API; permissible values last revised 2026-01-26.
  Wilms Tumor carries the Renal Tumors value by hand, because NCIt's Wilms
  Tumor concept is independent of site and so is not under Kidney Neoplasm;
  every other value was derived by the audit. See
  docs/ccdi-pediatric-oncology-classification.md.

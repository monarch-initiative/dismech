name: Stuve-Wiedemann Syndromes
creation_date: '2026-11-20T21:58:18Z'
description: Compare LIFR and IL6ST defects in overlapping cytokine receptor signaling.
grouping_basis:
- SHARED_PATHWAY
- SHARED_PHENOTYPE
grouping_rationale: The shared skeletal-autonomic syndrome and overlapping cytokine-receptor signaling
  explain the series. LIFR and the more broadly shared GP130 transducer are not interchangeable receptor
  components, so the extended IL6ST phenotype remains a separate disease. Other allelic IL6ST immune phenotypes
  are outside this union.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:601559
      label: Stuve-Wiedemann syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:601559, OMIM:619751. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates bowing of the long bones and IL6ST or LIFR. This is a necessary disease-annotation
    check, not a patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality,
    and other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Bowing of the long bones
        term:
          id: HP:0006487
          label: Bowing of the long bones
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: IL6ST
          term:
            id: hgnc:6021
            label: IL6ST
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: LIFR
          term:
            id: hgnc:6597
            label: LIFR
members:
- member: IL6ST-Related Stuve-Wiedemann Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Essential loss of IL6ST/GP130 signaling causes an extended Stuve-Wiedemann phenotype
      involving a shared cytokine receptor transducer.
    gene: *id001
    evidence:
    - reference: PMID:31914175
      reference_title: Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant
        and a homozygous intronic splice variant with exon skipping).
      explanation: Names the two allele classes in the delineating series and calls them essential (as
        opposed to cytokine-selective) loss of function.
    - reference: PMID:38133879
      reference_title: The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy
        of Genetic Variants.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Loss of exon 13 in the c.1699+4A>G splice variant abrogates folding of GP130 membrane-proximal
        domain D6 impairing transmembrane signal transmission
      explanation: Gives the structural reason the splice allele is a null rather than a hypomorph, which
        is what places it in the complete-loss class.
- member: LIFR-Related Stuve-Wiedemann Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: LIFR loss disrupts receptor-dependent JAK/STAT3 signaling and produces the classic skeletal
      and autonomic syndrome.
    gene: *id002
    evidence:
    - reference: PMID:14740318
      reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel
        type 2 syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Functional studies indicated that these mutations alter the stability of LIFR messenger
        RNA transcripts, resulting in the absence of the LIFR protein and in the impairment of the JAK/STAT3
        signaling pathway in patient cells.
      explanation: Patient-cell assays show that the alleles are null at the mRNA and protein level, not
        merely mapping hits.
    - reference: PMID:14740318
      reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel
        type 2 syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Stuve-Wiedemann syndrome (SWS) is a severe autosomal recessive condition characterized
        by bowing of the long bones, with cortical thickening, flared metaphyses with coarsened trabecular
        pattern, camptodactyly, respiratory distress, feeding difficulties, and hyperthermic episodes
        responsible for early lethality.
      explanation: Human radiographic signature of the skeletal arm of this node.

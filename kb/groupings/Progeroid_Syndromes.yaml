name: Progeroid_Syndromes
display_name: Progeroid Syndromes
creation_date: "2026-08-31T00:00:00Z"
description: >-
  The progeroid syndromes are hereditary disorders in which a prematurely aged
  appearance is part of the recognized clinical picture. They are grouped here on
  that phenotype and on nosological convention, not on a shared mechanism: the
  members reach the same clinical destination by routes that have nothing in
  common at the molecular level. Hutchinson-Gilford progeria is a lamin A
  processing defect that produces the toxic progerin protein; Nestor-Guillermo
  progeria is a BANF1/BAF DNA-binding defect at the same nuclear envelope but
  through a different protein and with a far milder course; Werner syndrome is
  loss of a RecQ helicase; Cockayne syndrome is failure of transcription-coupled
  nucleotide-excision repair; Fontaine progeroid syndrome is a mitochondrial
  ATP-Mg/Pi carrier defect; and marfanoid-progeroid-lipodystrophy syndrome is a
  C-terminal FBN1 truncation acting through asprosin deficiency and congenital
  lipodystrophy.

  Two members deserve explicit attention because they sit at the edge of the
  concept. Cockayne syndrome is dominated by neurodevelopmental and
  neurodegenerative disease, with the progeroid facies one feature among many.
  Marfanoid-progeroid-lipodystrophy syndrome is arguably a congenital
  lipodystrophy whose progeroid appearance is a consequence of absent adipose
  tissue from birth rather than of accelerated somatic ageing. Both are included
  because MONDO classifies them under progeroid syndrome and both curate the
  defining phenotype, but a curator reading this grouping as a mechanistic class
  will be misled - see grouping_rationale.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped on a shared clinical phenotype and on established nosological
  convention. This is deliberately NOT a shared-mechanism grouping, and the
  distinction matters: an earlier curation stub proposed "progeroid syndrome" as
  a single Disease entry, which fails the one-disease-one-mechanism test because
  the lamin-A, DNA-repair, mitochondrial, and connective-tissue routes have no
  common pathograph to curate. Keeping the members as separate Disease entries
  and drawing an explicit union over them is the correct shape.

  The members do converge downstream on cellular senescence, and several conform
  to the cellular_senescence, genomic_instability_aging, telomere_attrition, and
  inflammaging modules. That convergence is real but it is not a membership
  criterion: only Hutchinson-Gilford progeria and Werner syndrome currently
  declare a cellular_senescence conformance, and requiring one would exclude the
  BANF1, nucleotide-excision-repair, mitochondrial, and fibrillin members whose
  membership is not in doubt. Curators should treat the senescence and hallmarks
  of ageing modules as the natural conformance targets for individual members
  rather than as the definition of this grouping.

  Membership is stated as NECESSARY rather than NECESSARY_AND_SUFFICIENT because
  the criteria do not define the class. A prematurely aged appearance in a
  hereditary disorder is not sufficient: cutis laxa syndromes, the congenital
  generalized lipodystrophies, and several chromosome-breakage syndromes can all
  present an aged appearance without being counted among the progerias, and where
  the line falls is a matter of clinical convention rather than of the criteria
  written here.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0015333
      label: progeroid syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept corresponds to the MONDO progeroid syndrome class. All
      six listed members are is-a descendants of MONDO:0015333. exactMatch records
      the intended conceptual alignment; the many MONDO descendants without
      dismech entries (Wiedemann-Rautenstrauch, mandibuloacral dysplasia
      progeroid syndrome, XFE progeroid syndrome, RECON, Garg-Mishra, and others)
      are curation gaps to be surfaced from this mapping, not evidence that the
      alignment is only a close match.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        Checked against the MONDO:0015333 descendant list recorded on the
        Progeroid_Syndrome curation stub: Hutchinson-Gilford progeria syndrome
        (MONDO:0008310), Nestor-Guillermo progeria syndrome (MONDO:0013523),
        Werner syndrome (MONDO:0010196), Cockayne syndrome (MONDO:0016006),
        Fontaine progeroid syndrome (MONDO:0012853), and progeroid and marfanoid
        aspect-lipodystrophy syndrome (MONDO:0014831) are all present in that
        list.
membership_criteria:
- description: >-
    A disorder belongs to the progeroid syndromes if a prematurely aged
    appearance is part of its recognized clinical picture AND it is a Mendelian
    (germline) disorder. The phenotype criterion is stated at the level of
    HP:0007495 Prematurely aged appearance, whose HPO closure also admits members
    that curate the more specific HP:0005328 Progeroid facial appearance; both
    forms are curated across the members and neither is preferred.
  criteria_semantics: NECESSARY
  notes: >-
    Stated as NECESSARY only. The same two conditions hold of disorders nobody
    counts among the progerias - several congenital lipodystrophies and cutis
    laxa syndromes satisfy both - so they entail nothing about membership in the
    other direction and must not be read as a definition.
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      description: >-
        A prematurely aged appearance, whether curated generally (HP:0007495) or
        as the more specific progeroid facies (HP:0005328, an HPO descendant of
        HP:0007495 and therefore inside this criterion's closure).
      phenotype_term:
        preferred_term: Prematurely aged appearance
        term:
          id: HP:0007495
          label: Prematurely aged appearance
    - criterion_predicate: HAS_INHERITANCE
      description: >-
        Mendelian germline inheritance. Stated at HP:0034345 so that the
        autosomal dominant and autosomal recessive members are both admitted by
        closure; the grouping takes no position on mode beyond excluding acquired
        and somatic-mosaic causes of an aged appearance.
      inheritance_term:
        preferred_term: Mendelian inheritance
        term:
          id: HP:0034345
          label: Mendelian inheritance
members:
- member: Hutchinson-Gilford Progeria Syndrome
  member_type: DISEASE
  display_name: Hutchinson-Gilford progeria syndrome (HGPS)
  disease_term:
    preferred_term: Hutchinson-Gilford progeria syndrome
    term:
      id: MONDO:0008310
      label: Hutchinson-Gilford progeria syndrome
  notes: >-
    The prototype of the group and the only member with a disease-modifying
    approved drug (lonafarnib).
  differentiating_mechanisms:
  - description: >-
      A de novo heterozygous LMNA c.1824C>T synonymous substitution activates a
      cryptic splice donor in exon 11, deleting 50 amino acids including the
      ZMPSTE24 cleavage site. The resulting permanently farnesylated progerin acts
      dominant-negatively on the nuclear lamina. Uniquely among the members, death
      is cardiovascular - accelerated atherosclerosis with myocardial infarction or
      stroke in the early teens - rather than from cancer or neurodegeneration.
    gene:
      preferred_term: LMNA
      term:
        id: hgnc:6636
        label: LMNA
    module: cellular_senescence#Senescence-Associated Cell Cycle Arrest
- member: Nestor-Guillermo progeria syndrome
  member_type: DISEASE
  display_name: Nestor-Guillermo progeria syndrome (NGPS)
  disease_term:
    preferred_term: Nestor-Guillermo progeria syndrome
    term:
      id: MONDO:0013523
      label: Nestor-Guillermo progeria syndrome
  differentiating_mechanisms:
  - description: >-
      Biallelic BANF1 variants, recurrently A12T, impair the DNA-binding surface
      of barrier-to-autointegration factor while leaving the protein folded,
      stable, and able to bind nuclear envelope partners. It reaches the nuclear
      envelope by a different route from HGPS and produces a chronic progeria:
      severe skeletal disease with long survival and, distinctively, no
      cardiovascular impairment, diabetes, or hypertriglyceridemia into the third
      decade.
    gene:
      preferred_term: BANF1
      term:
        id: hgnc:17397
        label: BANF1
- member: Werner Syndrome
  member_type: DISEASE
  display_name: Werner syndrome (adult progeria)
  disease_term:
    preferred_term: Werner syndrome
    term:
      id: MONDO:0010196
      label: Werner syndrome
  differentiating_mechanisms:
  - description: >-
      Biallelic null variants in WRN, a RecQ-family helicase with both helicase
      and exonuclease activity required for replication-fork recovery and telomere
      maintenance. This is the adult-onset member: development is normal through
      the first decade and the aged phenotype assembles over the second and third.
      Cancer predisposition, with a characteristic excess of sarcomas, thyroid
      carcinoma, and melanoma, distinguishes it from the childhood progerias.
    gene:
      preferred_term: WRN
      term:
        id: hgnc:12791
        label: WRN
    module: genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair
- member: Cockayne Syndrome
  member_type: DISEASE
  display_name: Cockayne syndrome
  disease_term:
    preferred_term: Cockayne syndrome
    term:
      id: MONDO:0016006
      label: Cockayne syndrome
  notes: >-
    An edge member. Cockayne syndrome is primarily a neurodevelopmental and
    neurodegenerative disorder; the progeroid facies is one feature of a much
    broader picture, and it is equally at home in a DNA-repair-disorder grouping.
  differentiating_mechanisms:
  - description: >-
      Biallelic ERCC6 (CSB) or ERCC8 (CSA) variants abolish transcription-coupled
      nucleotide-excision repair, so lesions that stall RNA polymerase II are not
      removed. The consequence is neurological rather than neoplastic:
      demyelination, cerebellar atrophy, intracranial calcification, and cachectic
      dwarfism, with cutaneous photosensitivity but - unlike xeroderma pigmentosum,
      which shares the pathway - no marked skin-cancer excess.
    gene:
      preferred_term: ERCC6
      term:
        id: hgnc:3438
        label: ERCC6
- member: Fontaine Progeroid Syndrome
  member_type: DISEASE
  display_name: Fontaine progeroid syndrome
  disease_term:
    preferred_term: Fontaine progeroid syndrome
    term:
      id: MONDO:0012853
      label: Fontaine progeroid syndrome
  differentiating_mechanisms:
  - description: >-
      De novo heterozygous missense variants at SLC25A24 codon 217 perturb a
      mitochondrial inner-membrane ATP-Mg/Pi carrier, giving the only
      bioenergetic route into this grouping. The phenotype is congenital rather
      than progressive - craniosynostosis or craniofacial dysostosis, cutis laxa,
      lipoatrophy, hypertrichosis, and distal phalangeal anomalies present from
      birth - so the aged appearance is established at birth rather than acquired.
    gene:
      preferred_term: SLC25A24
      term:
        id: hgnc:20662
        label: SLC25A24
    module: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
- member: Marfanoid-Progeroid-Lipodystrophy Syndrome
  member_type: DISEASE
  display_name: Marfanoid-progeroid-lipodystrophy syndrome (MPL)
  disease_term:
    preferred_term: progeroid and marfanoid aspect-lipodystrophy syndrome
    term:
      id: MONDO:0014831
      label: progeroid and marfanoid aspect-lipodystrophy syndrome
  notes: >-
    The other edge member, and the one whose membership is most open to
    challenge. Its progeroid appearance follows from congenital absence of
    subcutaneous fat, not from accelerated somatic ageing, so a mechanistically
    drawn grouping would probably exclude it. It is listed because MONDO places
    it under progeroid syndrome and it curates the defining phenotype; a curator
    who disagrees should argue it out here rather than silently dropping it.
  differentiating_mechanisms:
  - description: >-
      C-terminal FBN1 truncating variants remove the profibrillin C-terminus,
      abolishing the cleaved adipokine asprosin. The result is a marfanoid
      skeleton and aortopathy - shared with classical Marfan syndrome - combined
      with congenital generalized lipodystrophy and hypoinsulinemia, which
      classical Marfan syndrome does not have. Neither the ageing hallmarks nor
      genome instability are implicated.
    gene:
      preferred_term: FBN1
      term:
        id: hgnc:3603
        label: FBN1
    module: aortopathy_tgfbeta_dysregulation#Aortic Wall ECM or Contractile Apparatus Defect
notes: >-
  Created from the Progeroid_Syndrome curation stub (MONDO:0015333), which
  recorded entry_type GROUPING and named this grouping as the remaining work.
  The stub is deleted by the same change.

  Known curation gaps, all of them MONDO:0015333 descendants without dismech
  Disease entries: Wiedemann-Rautenstrauch syndrome (MONDO:0009910, POLR3A),
  progeroid facial appearance with hand anomalies (MONDO:0011209),
  mandibular hypoplasia-deafness-progeroid syndrome (MONDO:0014157, POLD1),
  mandibuloacral dysplasia progeroid syndrome (MONDO:0030880), XFE progeroid
  syndrome (MONDO:0012590, ERCC4), RECON progeroid syndrome (MONDO:0957266,
  RECQL1), Garg-Mishra progeroid syndrome (MONDO:0957953), Marbach-Rustad
  progeroid syndrome (MONDO:0859147), achalasia-progeroid syndrome
  (MONDO:0700300), and Fischer-Zirnsak progeroid syndrome (MONDO:0700301). Add
  each as a member when its Disease entry lands. The three Cockayne subtype terms
  and the Cockayne spectrum term are also MONDO:0015333 descendants but are not
  gaps: the Cockayne_Syndrome entry covers them.

  Deliberately excluded despite frequently being called "segmental progeroid" in
  the ageing literature: Bloom syndrome, Rothmund-Thomson syndrome, xeroderma
  pigmentosum, and trichothiodystrophy, all of which have dismech entries. None
  is a MONDO:0015333 descendant, and admitting them would replace the phenotype
  criterion used here with a much broader "any genome-instability syndrome with
  some ageing features" boundary that this grouping is not trying to draw.

  Heyn-Sproul-Jackson syndrome is also excluded. It is a DNMT3A-related
  microcephalic dwarfism sometimes described with progeroid features, but MONDO
  does not classify it under progeroid syndrome and its entry does not curate a
  prematurely aged appearance.

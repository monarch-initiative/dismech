name: Childhood Kidney Tumors
creation_date: '2026-11-13T17:20:00Z'
description: >-
  The renal tumours of childhood, which paediatric oncology works up, stages and treats as one group
  although their cells of origin and their driver lesions are unrelated. Wilms tumour, or
  nephroblastoma, is the most common primary malignant renal tumour of childhood and is the entity
  the others are distinguished from. Clear cell sarcoma of the kidney and rhabdoid tumour of the
  kidney were separated out of the nephroblastoma category on histological grounds and later given
  their own driver lesions, a BCOR internal tandem duplication and SMARCB1 mutation. Congenital
  mesoblastic nephroma is the renal tumour of the neonate and young infant, and accounts for about 5% of paediatric renal tumours. What holds the group
  together is the diagnostic problem and the trial machinery built around it rather than a shared
  mechanism: a renal mass in a child is approached as Wilms tumour until histology and molecular
  findings say otherwise, and the cooperative groups that set treatment registered and reported the
  non-Wilms tumours alongside it - clear cell sarcoma of the kidney on National Wilms Tumor Study
  Group trials, congenital mesoblastic nephroma within the SIOP/GPOH nephroblastoma study.
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by clinical convention, not by mechanism. The four members have four unrelated driver
  lesions - WT1, CTNNB1 and WTX in nephroblastoma arising from nephrogenic rests; a C-terminal
  internal tandem duplication of BCOR in clear cell sarcoma of the kidney; SMARCB1 mutation, and rarely SMARCA4, in rhabdoid tumour; an ETV6-NTRK3 fusion in cellular
  congenital mesoblastic nephroma - and no module
  is shared across them. SHARED_MECHANISM and SHARED_PATHWAY would both be false. The members stay
  separate entries because each is a distinct diagnosis with its own histology, driver, risk
  stratification and prognosis, and because the separations were made in the first place to stop them being treated as one disease. The
  clear cell sarcoma series cited below is the worked case: separating the tumour from
  nephroblastoma is what allowed its own prognostic factors to be measured, and treatment with
  doxorubicin came out as one of the four independent predictors of survival in that series. Rhabdoid tumour of the kidney enters as a SUBTYPE member rather than a
  DISEASE member because dismech curates rhabdoid tumour as one multisite entry: SMARCB1 loss drives
  the renal, extrarenal and central nervous system forms alike, the anatomic site sets the
  nomenclature rather than the mechanism, and splitting the renal form into its own entry to suit this
  grouping would duplicate the shared chromatin-remodelling pathophysiology. Kidney Sarcoma is deliberately not a member even though MONDO:0002930 is the ontology parent of two
  members' terms. The dismech entry and the MONDO class are not the same extension: the entry frames
  the category as roughly 1-3% of adult renal malignancy and explicitly excludes nephroblastoma,
  clear cell sarcoma of the kidney and rhabdoid tumour of the kidney as having their own entries, so
  it covers neither of the two members MONDO files beneath its term. The ground for leaving it out
  is the criterion itself, that its characteristic presentation is adult, and that ground is applied
  consistently: Wilms Tumor is admitted whole despite carrying Childhood and Adult age_group
  subtypes, because its characteristic presentation is childhood and the entry's own Adult row
  describes adult Wilms as rare, where Kidney Sarcoma's centre of gravity is the other way round. The grouping is also incomplete by construction, and
  the gaps are entries dismech does not yet hold rather than concepts excluded on purpose: childhood renal cell carcinoma has no entry and no subtype row, though the translocation-associated
  form is in the stub queue as stubs/Renal_Cell_Carcinoma_Xp11-associated.yaml (MONDO:0010456),
  still UNDECIDED; nephroblastomatosis and cystic partially differentiated nephroblastoma
  appear nowhere in the corpus as entities; angiomyolipoma exists only as a subtype of Perivascular
  Epithelioid Cell Neoplasm, scoped to neither childhood nor the kidney; and paediatric renal
  rhabdomyosarcoma is reachable only through the Renal RMS subtype of Kidney Sarcoma, whose row is
  written about the adult presentation and states that the adult disease behaves far more
  aggressively than the paediatric one. Renal Ewing sarcoma is in the same position and is in any
  case described there as a tumour of adolescents and young adults.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002730
      label: childhood kidney neoplasm
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      closeMatch rather than exactMatch or narrowMatch, because neither subsumption direction holds
      against MONDO's asserted hierarchy. Only one of this grouping's four members, congenital
      mesoblastic nephroma (MONDO:0017043), is inside MONDO:0002730's is_a closure. Clear cell sarcoma
      of the kidney (MONDO:0005006) and rhabdoid tumour of the kidney (MONDO:0002729) reach kidney
      cancer through kidney sarcoma (MONDO:0002930), which carries no age axis, so neither ever
      reaches the childhood class. Wilms tumour (MONDO:0006058) has no kidney ancestor at all - its
      is_a parents run through embryonal neoplasm - and the kidney-sited concept is a separate term, MONDO:0024676 childhood kidney Wilms tumor, which
      is inside the class and which the Wilms Tumor entry already binds on its own Childhood
      subtype. Taking that subtype as the member instead of the entry would raise the count inside
      the class from one of four to two, which is the reason not to do it: it would make the mapping
      look more consistent than the ontology is, while narrowing the member to one age stratum of a
      disease whose characteristic presentation is childhood anyway. In the other direction
      the class holds concepts this grouping does not cover, among them childhood kidney cell
      carcinoma and childhood kidney angiomyolipoma. The concepts are the same; the extensions are
      not, and the difference is a gap in MONDO's hierarchy rather than a scope difference here (see
      notes). Because the mapping is not an exactMatch, the grouping page does not take the MONDO
      subtree as its coverage scope.
membership_criteria:
- description: >-
    A member is a dismech entry, or a named subtype of one, for a primary neoplasm of the kidney whose
    characteristic presentation is in childhood. Both halves are necessary and neither is sufficient:
    a childhood neoplasm at another site is out, and a renal neoplasm that characteristically presents
    in adults is out even where it occasionally occurs in a child. NECESSARY and not sufficient - a
    tumour satisfying both halves is still only a member once dismech curates it and it is listed
    here. No logic tree is given, deliberately. There is no structured field the four members share
    that would be a faithful proxy. The free-text parents slot carries kidney neoplasm on two members,
    kidney sarcoma on the third and nothing on the multisite rhabdoid tumour entry; the icdo_morphology axis reads Embryonal Neoplasm on two of them, Sarcoma on the third and is absent
    from the fourth; and HP:0009726 Renal neoplasm is carried by two of the four, so an automated criterion over it would report the other two as contradictions
    when the real gap is in the annotation, not the membership. Stating a criterion the corpus cannot
    yet evaluate would be worse than stating it in prose and saying so.
  criteria_semantics: NECESSARY
  evidence:
  - reference: PMID:10632483
    reference_title: "Clear cell sarcoma of the kidney: a review of 351 cases from the National Wilms Tumor Study Group Pathology Center."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed 351 cases of clear cell sarcoma of the kidney (CCSK), including 182 cases
    entered on National Wilms Tumor Study Group (NWTSG) trials 1-4 for which clinical follow-up information was available."
    explanation: >-
      The opening sentence of this National Wilms Tumor Study Group Pathology Center review states
      that 182 of its 351 clear cell sarcoma of the kidney cases were entered on NWTSG trials 1 to 4.
      A tumour that is not nephroblastoma was therefore registered and followed on the trials of the Wilms
      tumour study group, which is the clinical convention this grouping records. INDIRECT because
      the sentence establishes an enrolment fact and the criterion is definitional: the membership
      rule follows from the enrolment only by the inference the word therefore marks. The sentence
      makes no claim about shared biology, and the grouping makes none.
  - reference: PMID:29286563
    reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital mesoblastic nephroma (MN) is a rare pediatric renal tumor representing approximately 5% of all pediatric renal tumors."
    explanation: >-
      The first sentence of this study's background places congenital mesoblastic nephroma inside the
      category of paediatric renal tumours and gives its share of them as about 5%. It is the category this grouping is built on, and the sentence states one tumour's share of it,
      which is what makes this a membership-criterion citation rather than a fact about mesoblastic
      nephroma alone. The cooperative-group point in this grouping's description comes from the
      report's title, recorded verbatim in reference_title, and not from this sentence, which does
      not mention SIOP or GPOH. BACKGROUND because the sentence frames the study rather than
      reporting its result, which is the translocation finding.
members:
- member: Wilms Tumor
  member_type: DISEASE
  disease_term:
    preferred_term: Wilms tumor
    term:
      id: MONDO:0006058
      label: Wilms tumor
  differentiating_mechanisms:
  - description: >-
      The embryonal member and the reference point for the group: a tumour of immature kidney arising
      from persistent nephrogenic rests, and the diagnosis a renal mass in a child is assumed to be
      until something displaces it.
    evidence:
    - reference: PMID:37385707
      reference_title: Wilms Tumor.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Wilms tumor (WT), or nephroblastoma, is the most common primary malignant renal tumor of childhood. It is an embryonal tumor that develops from remnants of immature kidney."
      explanation: >-
        This review states both facts the member rests on: that Wilms tumour is the most common
        primary malignant renal tumour of childhood, and that it is an embryonal tumour developing
        from remnants of immature kidney. The first is what makes it the reference point the other
        members are distinguished from; the second is the origin that distinguishes it from them.
        REVIEW_SYNTHESIS because the review is restating established facts rather than reporting its
        own series.
- member: Clear Cell Sarcoma of Kidney
  member_type: DISEASE
  disease_term:
    preferred_term: clear cell sarcoma of kidney
    term:
      id: MONDO:0005006
      label: clear cell sarcoma of kidney
  differentiating_mechanisms:
  - description: >-
      Separated from nephroblastoma on histology, and now by a driver found in no other paediatric
      renal tumour: a C-terminal internal tandem duplication of BCOR. Its epithelioid pattern mimics
      Wilms tumour under the microscope, and the separation is made immunohistochemically before it is
      made molecularly.
    gene:
      preferred_term: BCOR
      term:
        id: hgnc:20893
        label: BCOR
    evidence:
    - reference: PMID:26098867
      reference_title: Consistent in-frame internal tandem duplications of BCOR characterize clear cell sarcoma of the kidney.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified internal tandem duplications in the BCOR gene (BCL6 corepressor) affecting the C terminus in 100% (20/20) of CCSK tumors but in none (0/193) of the other pediatric renal tumors"
      explanation: >-
        The lesion is reported in every one of 20 clear cell sarcomas of the kidney and in none of 193
        other paediatric renal tumours. The denominator is the comparison this grouping is about: the
        separation is stated against the other childhood renal tumours specifically, not against
        tumours in general.
    - reference: PMID:10632483
      reference_title: "Clear cell sarcoma of the kidney: a review of 351 cases from the National Wilms Tumor Study Group Pathology Center."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "all CCSKs were cytokeratin-negative, including epithelioid tumors that mimicked Wilms tumor, and MIC2-negative, including cellular tumors that mimicked primitive neuroectodermal tumor."
      explanation: >-
        Names the mimicry the separation has to survive and the stain that bears on it: the epithelioid
        clear cell sarcomas that mimicked Wilms tumour were all cytokeratin-negative. The sentence
        states only the clear cell sarcoma side, making no claim about nephroblastoma's own
        staining, and the abstract puts such results no higher than helping to exclude other tumours
        in the differential diagnosis, which is the weight this row gives it.
- member: Rhabdoid Tumor
  member_type: SUBTYPE
  display_name: Rhabdoid Tumor of the Kidney
  disease_term:
    preferred_term: rhabdoid tumor of the kidney
    term:
      id: MONDO:0002729
      label: rhabdoid tumor of the kidney
  differentiating_mechanisms:
  - description: >-
      Only the renal subtype of the rhabdoid tumour entry belongs here. The entry is multisite because
      one lesion, biallelic SMARCB1 loss, drives the renal, extrarenal and central nervous system
      forms alike; the site sets the name rather than the mechanism, which is why this grouping takes
      the subtype and not the entry.
    gene:
      preferred_term: SMARCB1
      term:
        id: hgnc:11103
        label: SMARCB1
    evidence:
    - reference: PMID:39088359
      reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "While the central nervous system is the most common site of occurrence, tumors can develop at other sites, including the kidneys and soft tissues throughout the body. The anatomic site of involvement dictates tumor nomenclature and nosology."
      explanation: >-
        States that rhabdoid tumours occur at several sites including the kidney, and that the anatomic site
        dictates nomenclature and nosology. The nomenclature half is what this row rests on: the
        kidney is one site among several, so the renal form is a named part of a spectrum, and only
        that part is a childhood kidney tumour. The nosology half arguably cuts the other way,
        nosology being the classification of diseases, and it is not read here as the source
        agreeing with dismech's decision to curate one multisite entry.
    - reference: PMID:39088359
      reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Irrespective of the site of occurrence, somatic and germline mutations in SMARCB1, and rarely in SMARCA4, underlie the entire spectrum of rhabdoid tumors."
      explanation: >-
        The same genes underlie the spectrum whatever the site, SMARCB1 and rarely SMARCA4, which is the
        reason dismech curates one multisite entry and this grouping takes a subtype of it rather
        than asking for a separate renal entry. The sentence does not compare rhabdoid tumour with
        the other members; that none of their drivers is SMARCB1 is read off their own entries and
        cited on their own rows.
- member: Congenital Mesoblastic Nephroma
  member_type: DISEASE
  disease_term:
    preferred_term: congenital mesoblastic nephroma
    term:
      id: MONDO:0017043
      label: congenital mesoblastic nephroma
  differentiating_mechanisms:
  - description: >-
      The infantile member, and the one that is usually not malignant. Its cellular variant carries an ETV6-NTRK3 fusion, unrelated to any other member's driver, while the
      classical and mixed variants in the cited cohort were all translocation negative.
    gene:
      preferred_term: NTRK3
      term:
        id: hgnc:8033
        label: NTRK3
    evidence:
    - reference: PMID:29286563
      reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "All classical and mixed MN were translocation negative. Seventeen out of 29 (58%) cellular MN harbored the ETV6-NTRK3 translocation."
      explanation: >-
        Both halves of the variant split, in the cohort's own words: every classical and mixed mesoblastic
        nephroma was translocation negative, and 17 of 29 cellular ones carried the ETV6-NTRK3
        translocation. That is the driver distinguishing this member from the other three and,
        within the member, the cellular variant from the classic one. Note what the figures do not
        say. They do not make the fusion definitional for the cellular variant, since 12 of the 29
        cellular tumours did not carry it; and the denominator is the tested subset, because the
        study analysed 79 of its 111 cases by FISH and RT-PCR rather than all of them.
notes: >-
  The MONDO hierarchy does not support this grouping, and the gap is worth reporting upstream rather
  than worked around here. Three of the four members sit outside MONDO:0002730 childhood kidney
  neoplasm. Two of them, clear cell sarcoma of the kidney and rhabdoid tumour of the kidney, reach
  kidney cancer only through MONDO:0002930 kidney sarcoma, which has no age axis, so no path takes
  them to a childhood class even though both are defined in the literature as tumours of childhood.
  The third is the more surprising: MONDO:0006058 Wilms tumor, the canonical nephroblastoma concept
  and the one every clinical source names, has no kidney ancestor at all - its two is_a parents are embryonal neoplasm and malignant mixed neoplasm, and no chain from either
  reaches a kidney term - while a separate term, MONDO:0024676 childhood kidney Wilms tumor, does
  sit under the childhood kidney class. Checked against the local MONDO build on 13
  November 2026.


  Two things follow for a curator. A membership audit over MONDO closure would report three of four
  members as contradictions, which is why the mapping is a closeMatch and the membership criterion
  carries no logic tree. And a dismech entry's disease_term being MONDO:0006058 does not place it
  among kidney neoplasms for any ontology-closure question, so an audit that assumes it does will be
  wrong about Wilms tumour specifically.


  Clear cell sarcoma of the kidney was called the most common renal sarcoma of childhood in the 1985
  series that argued for separating it from nephroblastoma, and the entry quotes that. The claim is
  not repeated here because the grouping makes no claim about relative frequency among its members
  beyond Wilms tumour being the most common, which is sourced on that member.

name: Homocystinuria-Megaloblastic Anemia Disorders
creation_date: '2026-11-20T21:58:17Z'
description: Compare cblE/MTRR, cblG/MTR, and cblD-HC/MMADHC remethylation defects.
grouping_basis:
- SHARED_PATHWAY
- SHARED_PHENOTYPE
grouping_rationale: The shared boundary is inherited methylcobalamin-dependent remethylation failure in
  the cblE, cblG and isolated cblD-HC forms. The distinctions are enzyme reactivation, the catalytic enzyme,
  and cofactor handling. The MMADHC parent also contains cblD-MMA and cblD-MMA/HC; these are explicitly
  excluded. The named subtype and its disease term define that member, while the current offline evaluator
  checks annotations on its broader parent.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:236270
      label: Homocystinuria-megaloblastic anemia
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:236270, OMIM:250940, OMIM:620952.
      These numbered concepts correspond to this explicit union including only the cblD-HC subtype of
      the broader MMADHC entry. The mapping aligns the named series with its curated members, not the
      individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates macrocytic anemia and MTRR or MTR or MMADHC. This is a necessary
    disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene mentions
    do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Macrocytic anemia
        term:
          id: HP:0001972
          label: Macrocytic anemia
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: MTRR
          term:
            id: hgnc:7473
            label: MTRR
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: MTR
          term:
            id: hgnc:7468
            label: MTR
      - criterion_predicate: HAS_GENE
        gene: &id003
          preferred_term: MMADHC
          term:
            id: hgnc:25221
            label: MMADHC
members:
- member: Methylcobalamin Deficiency Type cblE
  member_type: DISEASE
  differentiating_mechanisms:
  - description: MTRR deficiency impairs reductive reactivation of methionine synthase.
    gene: *id001
    evidence:
    - reference: PMID:10484769
      reference_title: Molecular basis for methionine synthase reductase deficiency in patients belonging
        to the cblE complementation group of disorders in folate/cobalamin metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a defect in the MSR enzyme, which is required for the reductive activation of methionine
        synthase (MS)
      explanation: Identifies loss of MTRR/MSR enzyme function as the primary molecular lesion.
- member: Methylcobalamin Deficiency Type cblG
  member_type: DISEASE
  differentiating_mechanisms:
  - description: MTR deficiency affects methionine synthase itself, impairing homocysteine remethylation.
    gene: *id002
    evidence:
    - reference: PMID:41202372
      reference_title: Identification of variants of the MTR gene in patients with the cblG inborn error
        of cobalamin metabolism diagnosed by somatic cell complementation analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The cblG inborn error of vitamin B12 metabolism is associated with pathogenic variants
        in the MTR gene, which encodes methionine synthase.
      explanation: Establishes MTR as the causal gene and methionine synthase as the affected enzyme.
    - reference: PMID:25526710
      reference_title: Clinical onset and course, response to treatment and outcome in 24 patients with
        the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: rare inborn errors of cobalamin metabolism leading to impairment of the remethylation of
        homocysteine to methionine
      explanation: States the metabolic block this node encodes.
- member: MMADHC-related Disorder of Cobalamin Metabolism, cblD Type
  member_type: SUBTYPE
  differentiating_mechanisms:
  - description: 'Only cblD-HC belongs to this union: selective methylcobalamin deficiency impairs remethylation
      without the methylmalonic aciduria of other MMADHC phenotypes.'
    gene: *id003
    evidence:
    - reference: PMID:24722857
      reference_title: Characterization of functional domains of the cblD (MMADHC) gene product.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: 'Previously we have shown that in cblD patients three types of MMADHC mutations exist:
        1) null mutations N-terminal to Met116 cause isolated methylmalonic aciduria (cblD-MMA) due to
        AdoCbl deficiency; 2) null mutations across the C-terminus (p.Y140-R250) cause combined methylmalonic
        aciduria and homocystinuria (cblD-MMA/HC) due to AdoCbl and MeCbl deficiency; 3) missense mutations
        in a conserved C-terminal region (p.D246-L259) cause isolated homocystinuria (cblD-HC) due to
        MeCbl deficiency.'
      explanation: States the full position-to-phenotype map, including this allele class, as the authors'
        prior result that the paper builds on.
    - reference: PMID:15292234
      reference_title: The cblD defect causes either isolated or combined deficiency of methylcobalamin
        and adenosylcobalamin synthesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Two patients presented with isolated homocystinuria
      explanation: The first description of the isolated-homocystinuria form within the cblD complementation
        group, later termed cblD-variant 1.
    - reference: PMID:22156578
      reference_title: Molecular mechanisms leading to three different phenotypes in the cblD defect of
        intracellular cobalamin metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: The cblD defect of intracellular vitamin B(12) metabolism can lead to isolated methylmalonic
        aciduria (cblD-MMA) or homocystinuria (cblD-HC), or combined methylmalonic aciduria and homocystinuria
        (cblD-MMA/HC).
      explanation: Names the three clinical forms that the three subtype rows of this entry correspond
        to; the sentence frames the paper's own fibroblast work.
  display_name: cblD-HC
  disease_term:
    preferred_term: homocystinuria-megaloblastic anemia cblD type
    term:
      id: MONDO:0700297
      label: homocystinuria-megaloblastic anemia cblD type
  notes: Only cblD-HC is included. Parent-level evaluation cannot distinguish the cblD-MMA and cblD-MMA/HC
    siblings; they are excluded from the curated union.

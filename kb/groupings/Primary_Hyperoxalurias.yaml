name: Primary Hyperoxalurias
creation_date: '2026-11-20T20:02:14Z'
description: >-
  Primary hyperoxaluria types 1, 2, and 3 are inherited disorders of glyoxylate
  metabolism that converge on endogenous oxalate overproduction and calcium
  oxalate stone disease.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: >-
  The common endpoint is increased endogenous oxalate production, but the
  initiating reactions and compartments differ: peroxisomal glyoxylate
  transamination in type 1, glyoxylate and hydroxypyruvate reduction in type 2,
  and mitochondrial hydroxyproline catabolism in type 3. These differences
  justify retaining the three existing diseases and their distinct biochemical
  accounts. In particular, the bridge from HOGA1 deficiency to increased
  oxalate remains incompletely resolved and should not be replaced by the
  direct substrate-diversion mechanism established for AGT deficiency.
  Secondary enteric or dietary hyperoxaluria and other kidney-stone disorders
  are outside this inherited metabolic grouping.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:259900
      label: Hyperoxaluria, primary
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: >-
      The January 2026 PS259900 snapshot comprises OMIM:259900 (type 1),
      OMIM:260000 (type 2), and OMIM:613616 (type 3). The three separately
      curated members represent this union; the series is not synonymous
      with the type 1 record that shares its numeric stem.
  mondo_mappings:
  - term:
      id: MONDO:0002474
      label: primary hyperoxaluria
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      In September 2026, MONDO:0002474 has exactly MONDO:0009823,
      MONDO:0009824, and MONDO:0013327 as its direct children, corresponding
      to the three member entries, and maps to PS259900.
membership_criteria:
- description: >-
    Each member entry annotates hyperoxaluria, autosomal recessive inheritance,
    and involvement of AGXT, GRHPR, or HOGA1. This is a necessary audit of
    disease-level annotations, not a sufficient classifier or a diagnostic
    rule for patients. Gene annotations alone do not establish causation,
    variant pathogenicity, or biallelic status; a member can mention another
    series gene as a modifier or comparator.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Hyperoxaluria
        term:
          id: HP:0003159
          label: Hyperoxaluria
    - criterion_predicate: HAS_INHERITANCE
      inheritance_term:
        preferred_term: Autosomal recessive inheritance
        term:
          id: HP:0000007
          label: Autosomal recessive inheritance
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: AGXT
          term:
            id: hgnc:341
            label: AGXT
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: GRHPR
          term:
            id: hgnc:4570
            label: GRHPR
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: HOGA1
          term:
            id: hgnc:25155
            label: HOGA1
  evidence:
  - reference: PMID:22729392
    reference_title: Primary hyperoxaluria type III--a model for studying perturbations in glyoxylate metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Perturbations in glyoxylate metabolism lead to the accumulation of oxalate and give rise to primary hyperoxalurias, recessive disorders characterized by kidney stone disease.
    explanation: The human metabolite study describes the shared biochemical and clinical boundary of the primary hyperoxalurias.
members:
- member: Primary Hyperoxaluria Type 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      AGXT deficiency removes hepatic peroxisomal alanine-glyoxylate
      aminotransferase activity, blocking glyoxylate conversion to glycine
      and diverting glyoxylate toward oxalate.
    gene:
      preferred_term: AGXT
      term:
        id: hgnc:341
        label: AGXT
    evidence:
    - reference: PMID:20301460
      reference_title: Primary Hyperoxaluria Type 1.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Primary hyperoxaluria type 1 (PH1) is caused by deficiency of the liver peroxisomal enzyme alanine-glyoxylate aminotransferase (AGT), which catalyzes the conversion of glyoxylate to glycine.
      explanation: GeneReviews identifies the enzyme, compartment, and reaction that distinguish type 1.
- member: Primary Hyperoxaluria Type 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      GRHPR deficiency impairs glyoxylate reduction to glycolate and
      hydroxypyruvate reduction to D-glycerate. Increased urinary L-glycerate
      accompanies oxalate overexcretion and distinguishes the biochemical
      profile from the other primary hyperoxalurias.
    gene:
      preferred_term: GRHPR
      term:
        id: hgnc:4570
        label: GRHPR
    evidence:
    - reference: PMID:10484776
      reference_title: The gene encoding hydroxypyruvate reductase (GRHPR) is mutated in patients with primary hyperoxaluria type II.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: characterized by a lack of the enzyme that catalyzes the reduction of hydroxypyruvate to D-glycerate, the reduction of glyoxylate to glycolate and the oxidation of D-glycerate to hydroxypyruvate
      explanation: The genetic study identifies the lost enzyme activities in type 2.
    - reference: PMID:10484776
      reference_title: The gene encoding hydroxypyruvate reductase (GRHPR) is mutated in patients with primary hyperoxaluria type II.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The disease is characterized by an elevated urinary excretion of oxalate and L-glycerate.
      explanation: The clinical biochemical profile supports the L-glycerate differentiator.
- member: Primary Hyperoxaluria Type 3
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      HOGA1 deficiency blocks mitochondrial 4-hydroxy-2-oxoglutarate aldolase
      in hydroxyproline catabolism. Accumulated hydroxyproline metabolites
      distinguish this lesion from AGXT and GRHPR deficiency. Cytosolic
      conversion of accumulated substrate to glyoxylate is a proposed bridge
      to oxalate overproduction, not an established universal pathway.
    gene:
      preferred_term: HOGA1
      term:
        id: hgnc:25155
        label: HOGA1
    evidence:
    - reference: PMID:22391140
      reference_title: The enzyme 4-hydroxy-2-oxoglutarate aldolase is deficient in primary hyperoxaluria type 3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: definitive proof that PH Type 3 is due to deficiency of the 4-hydroxy-2-oxoglutarate aldolase enzyme.
      explanation: Biallelic nonsense variants establish loss of enzyme function as the type 3 lesion.
    - reference: PMID:22729392
      reference_title: Primary hyperoxaluria type III--a model for studying perturbations in glyoxylate metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Significant increases in concentrations of 4-hydroxy-2-oxoglutarate and its precursor and derivative 4-hydroxyglutamate and 2,4-dihydroxyglutarate, respectively, were found in all patients as compared to carriers of the corresponding mutations or healthy controls.
      explanation: Human urine measurements establish the characteristic metabolite accumulation; they do not directly prove every downstream reaction to oxalate.
    - reference: PMID:22729392
      reference_title: Primary hyperoxaluria type III--a model for studying perturbations in glyoxylate metabolism.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: We propose that HOGA1 deficiency results in the accumulation of 4-hydroxy-2-oxoglutarate in the mitochondria and its transport into the cytosol where it is converted to glyoxylate by a different cytosolic aldolase.
      explanation: The authors explicitly frame this causal bridge as a proposed model; the grouping preserves that uncertainty.

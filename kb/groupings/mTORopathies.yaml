name: mTORopathies
display_name: mTORopathies (Hereditary mTORC1 Hyperactivation Disorders)
creation_date: "2026-10-23T18:00:00Z"
description: >-
  Hereditary disorders in which a germline variant in a regulator of the mTORC1
  pathway leaves mTORC1 constitutively active. The lost regulators are the TSC
  complex (TSC1, TSC2), PTEN, the GATOR1 complex (DEPDC5, NPRL2, NPRL3), the
  KICSTOR component SZT2, and the Rag GTPase RRAGC. The shared output is
  hamartomatous overgrowth, focal cortical dysplasia and epilepsy. A somatic
  second hit in the lesion is common. mTOR inhibition is an established
  treatment in tuberous sclerosis complex; for the other members its use is
  preclinical or limited to case reports.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PATHWAY
grouping_rationale: >-
  Grouped on a shared signalling lesion rather than on phenotype or organ. The
  members are classified elsewhere as tumour predisposition syndromes (PTEN
  hamartoma tumour syndrome), focal epilepsies (the GATOR1 disorders) or
  developmental and epileptic encephalopathies (SZT2), so no organ-based class
  brings them together. Members stay separate Disease entries because they lose
  different regulators upstream of mTORC1, which sets their spectrum: TSC and
  PTEN disorders are multisystem hamartoma syndromes, while the GATOR1 disorders
  are largely confined to the brain.

  The criterion is NECESSARY, not NECESSARY_AND_SUFFICIENT. The module also
  takes acquired and neoplastic conformers that are not hereditary mTORopathies,
  so conformance alone does not admit a disease. Excluded on that basis:
  lymphangioleiomyomatosis and perivascular epithelioid cell neoplasm
  (TSC-associated neoplasms that also occur sporadically) and the Peutz-Jeghers
  polyp (a lesion). Peutz-Jeghers syndrome (STK11) is left out as a boundary
  case: STK11 acts on mTORC1 through AMPK, but the syndrome is defined by
  polyposis and cancer risk, not by mTORC1-driven cortical or hamartomatous
  disease.

  No MONDO class covers this grouping. MONDO has single diseases on the pathway
  (MONDO:0976294 ragopathy, MONDO:0100572 MTOR-related overgrowth spectrum) but
  no parent. It is proposed as proposal 12 in
  docs/reports/mondo-mechanism-classification-proposal-round-2-2026-10-23.md.
membership_criteria:
- description: >-
    Every member's pathophysiology conforms to the mTORC1 hyperactivation
    module: loss of an upstream negative regulator leaves mTORC1 constitutively
    active.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: mtorc1_hyperactivation
    description: >-
      Conforms to the mtorc1_hyperactivation module at one or more nodes.
      Scoped to the module rather than one node, because some members conform
      only at the downstream hamartoma node.
members:
- member: Tuberous Sclerosis Complex
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The prototype. Loss of the TSC1-TSC2 complex, the GTPase-activating
      protein for RHEB, gives the broadest multisystem hamartoma syndrome:
      cortical tubers, epilepsy, renal angiomyolipoma and pulmonary
      lymphangioleiomyomatosis.
    gene:
      preferred_term: TSC2
      term:
        id: hgnc:12363
        label: TSC2
    module: mtorc1_hyperactivation#Loss of an Upstream mTORC1 Negative Regulator
- member: PTEN Hamartoma Tumor Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      PTEN loss raises PI3K-AKT signalling upstream of the TSC complex, giving
      hamartomas, macrocephaly and raised breast, thyroid and endometrial cancer
      risk.
    gene:
      preferred_term: PTEN
      term:
        id: hgnc:9588
        label: PTEN
    module: mtorc1_hyperactivation#Hamartomatous Overgrowth and Dysplastic Lesion Formation
- member: Cowden Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The adult end of the PTEN hamartoma tumour syndrome spectrum, defined by
      mucocutaneous hamartomas and cancer risk.
    gene:
      preferred_term: PTEN
      term:
        id: hgnc:9588
        label: PTEN
    module: mtorc1_hyperactivation#Hamartomatous Overgrowth and Dysplastic Lesion Formation
- member: Bannayan-Riley-Ruvalcaba Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The paediatric end of the PTEN hamartoma tumour syndrome spectrum:
      macrocephaly, lipomas, intestinal hamartomas and pigmented penile macules.
    gene:
      preferred_term: PTEN
      term:
        id: hgnc:9588
        label: PTEN
    module: mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation
- member: DEPDC5-Related Epilepsy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of the GATOR1 subunit DEPDC5 removes amino-acid restraint on mTORC1.
      Focal epilepsy, often with focal cortical dysplasia from a somatic second
      hit, and largely confined to the brain.
    gene:
      preferred_term: DEPDC5
      term:
        id: hgnc:18423
        label: DEPDC5
    module: mtorc1_hyperactivation#Loss of an Upstream mTORC1 Negative Regulator
- member: Familial Focal Epilepsy With Variable Foci
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The familial focal epilepsy caused by any of the three GATOR1 genes, in
      which affected relatives have seizures arising from different cortical
      regions.
    gene:
      preferred_term: NPRL3
      term:
        id: hgnc:14124
        label: NPRL3
    module: mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation
- member: Familial Sleep-Related Hypermotor Epilepsy
  member_type: SUBTYPE
  display_name: DEPDC5-related sleep-related hypermotor epilepsy
  differentiating_mechanisms:
  - description: >-
      Only the DEPDC5 subtype belongs here. The other subtypes are nicotinic
      acetylcholine receptor (CHRNA4, CHRNB2, CHRNA2) or KCNT1 channelopathies,
      not mTORopathies.
    gene:
      preferred_term: DEPDC5
      term:
        id: hgnc:18423
        label: DEPDC5
    module: mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation
- member: SZT2-Related Developmental and Epileptic Encephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of SZT2, a KICSTOR subunit that docks GATOR1 at the lysosome, gives a
      recessive developmental and epileptic encephalopathy with macrocephaly.
    gene:
      preferred_term: SZT2
      term:
        id: hgnc:29040
        label: SZT2
    module: mtorc1_hyperactivation#Loss of an Upstream mTORC1 Negative Regulator
- member: Long-Olsen-Distelmaier Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Activating RRAGC variants hold the Rag GTPase in its amino-acid-replete
      state, so mTORC1 is active without a nutrient signal. Fetal or infantile
      dilated cardiomyopathy, hepatopathy and malformations of cortical
      development.
    gene:
      preferred_term: RRAGC
      term:
        id: hgnc:19902
        label: RRAGC
    module: mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation
notes: >-
  Candidates not yet in dismech: MTOR-related overgrowth spectrum (Smith-Kingsmore
  syndrome, MONDO:0100572) and ragopathy (MONDO:0976294). Peutz-Jeghers syndrome
  is a boundary case left for a curator to decide; see the rationale.

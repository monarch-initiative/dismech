name: Pseudohypoaldosteronism Type I Disorders
creation_date: '2026-11-20T21:58:17Z'
description: Shared aldosterone resistance with renal NR3C2 versus systemic SCNN1A/B/G epithelial sodium
  channel defects.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_PATHWAY
grouping_rationale: Aldosterone resistance joins receptor-level renal disease with epithelial sodium-channel
  defects affecting multiple tissues. Distinct subunits, inheritance and tissue distribution justify separate
  members. Neither a uniformly severe neonatal course nor one inheritance pattern is imposed; secondary
  transient pseudohypoaldosteronism is excluded.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:177735
      label: Pseudohypoaldosteronism, type I
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:177735, OMIM:264350, OMIM:620125,
      OMIM:620126. These numbered concepts correspond to this explicit union. The mapping aligns the named
      series with its curated members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates hyperkalemia and NR3C2 or SCNN1A or SCNN1B or SCNN1G. This is a necessary
    disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene mentions
    do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Hyperkalemia
        term:
          id: HP:0002153
          label: Hyperkalemia
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: NR3C2
          term:
            id: hgnc:7979
            label: NR3C2
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: SCNN1A
          term:
            id: hgnc:10599
            label: SCNN1A
      - criterion_predicate: HAS_GENE
        gene: &id003
          preferred_term: SCNN1B
          term:
            id: hgnc:10600
            label: SCNN1B
      - criterion_predicate: HAS_GENE
        gene: &id004
          preferred_term: SCNN1G
          term:
            id: hgnc:10602
            label: SCNN1G
members:
- member: Autosomal Dominant Pseudohypoaldosteronism Type 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: NR3C2 mineralocorticoid-receptor deficiency produces the dominant, predominantly renal
      form of aldosterone resistance.
    gene: *id001
    evidence:
    - reference: PMID:16611713
      reference_title: 'Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal
        lethality, and phenotypic expression in adults.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: evidence that haploinsufficiency of MR is sufficient to cause adPHA1
      explanation: Human genetic and functional data show reduced MR dosage alone causes the disease.
    - reference: PMID:16954160
      reference_title: Elucidating the underlying molecular pathogenesis of NR3C2 mutants causing autosomal
        dominant pseudohypoaldosteronism type 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: S818L does not bind aldosterone or activate transcription or translocate into the nucleus.
      explanation: A PHA1A missense mutant abolishes aldosterone binding, nuclear translocation and transactivation.
- member: Pseudohypoaldosteronism Type IB1 Autosomal Recessive
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SCNN1A affects the alpha subunit of epithelial sodium channels and causes recessive systemic
      salt-wasting disease.
    gene: *id002
    evidence:
    - reference: PMID:8589714
      reference_title: Mutations in subunits of the epithelial sodium channel cause salt wasting with
        hyperkalaemic acidosis, pseudohypoaldosteronism type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These mutations are homozygous in affected subjects, co-segregate with the disease, and
        introduce frameshift, premature termination or missense mutations that result in loss of channel
        activity.
      explanation: Recessive PHA1 alleles in the alpha and beta subunits abolish channel activity.
    - reference: PMID:23416952
      reference_title: Five novel mutations in the SCNN1A gene causing autosomal recessive pseudohypoaldosteronism
        type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The α subunit is essential for ENaC function and mutations truncating the pore-forming
        part of the protein leading to systemic PHA1.
      explanation: Truncation of the pore-forming alpha subunit causes systemic PHA1.
- member: Pseudohypoaldosteronism Type IB2 Autosomal Recessive
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SCNN1B affects the beta subunit; demonstrated loss-of-function alleles impair channel
      gating.
    gene: *id003
    evidence:
    - reference: PMID:9118951
      reference_title: A mutation causing pseudohypoaldosteronism type 1 identifies a conserved glycine
        that is involved in the gating of the epithelial sodium channel.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A missense mutation (G37S) of the human ENaC beta subunit that causes loss of ENaC function
        and PHA-1 replaces a glycine that is conserved in the N-terminus of all members of the ENaC gene
        family.
      explanation: A PHA1 beta subunit missense variant causes ENaC loss of function.
    - reference: PMID:9118951
      reference_title: A mutation causing pseudohypoaldosteronism type 1 identifies a conserved glycine
        that is involved in the gating of the epithelial sodium channel.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These results suggest that the decrease in macroscopic Na currents is due to a decrease
        in channel open probability (P(o)), suggesting that mutations of a conserved glycine in the N-terminus
        of ENaC subunits change ENaC channel gating, which would explain the disease pathophysiology.
      explanation: The beta G37S class of variant reduces open probability rather than surface expression.
- member: Pseudohypoaldosteronism Type IB3 Autosomal Recessive
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SCNN1G affects the gamma subunit; splice-disrupting and partially functional alleles
      contribute to variable severity.
    gene: *id004
    evidence:
    - reference: PMID:8640238
      reference_title: A novel splice-site mutation in the gamma subunit of the epithelial sodium channel
        gene in three pseudohypoaldosteronism type 1 families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Abnormal splicing results with the production of two messenger RNAs, one arising from activation
        of an adjacent cryptic splice site and the other from skipping of the downstream exon.
      explanation: The founding SCNN1G splice variant disrupts normal splicing of the gamma subunit transcript.
    - reference: PMID:40969802
      reference_title: 'Case Report: Functional investigation of the γENaC G532S mutation presenting as
        mild PHA-1B3.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This analysis showed that the γG532S mutation reduced, but did not suppress ENaC expression
        and activity.
      explanation: Heterologous expression shows the gamma G532S variant lowers ENaC expression and current.

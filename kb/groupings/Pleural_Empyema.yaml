name: Pleural Empyema
display_name: Pleural empyema (diseases producing pus in the pleural space)
creation_date: "2026-11-28T01:15:46Z"
description: >-
  Pleural empyema is pus, or organisms on Gram stain or culture, in the pleural
  space. It is not caused by one organism: it complicates pneumonia caused by
  streptococci, Staphylococcus aureus, oral anaerobes and Gram-negative
  bacteria, follows thoracic surgery and chest trauma, and arises in chronic
  tuberculous and, rarely, parasitic disease. This grouping collects the dismech
  disease entries that curate pleural empyema (HP:0011919) as part of their own
  disease. The pleural mechanism they share (mesothelial injury, the exudative,
  fibrinopurulent and organising stages, PAI-1-driven loss of fibrinolysis,
  fibrin loculation and peel formation) is modelled once, in the
  parapneumonic_empyema_formation module, rather than in this grouping.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on the shared end state, pus in the pleural space, and on the shared
  pleural cascade that produces it whatever the organism: bacteria or bacterial
  products injure the visceral pleural mesothelium, an exudate forms, and
  bacterial invasion with a procoagulant, anti-fibrinolytic shift lays down
  fibrin that loculates the fluid until it organises into a peel (PMID:26150912).
  The organisms that reach the pleura are diverse and usually mixed: in the
  TORPIDS sequencing study 79% of pleural infections were polymicrobial
  (PMID:35544066).

  The members are kept as separate disease entries because they differ on the
  axes design decision 3e uses to split infections. They differ in agent
  (Mycobacterium tuberculosis; mixed oral anaerobes; Pasteurella multocida;
  Echinococcus larvae), in reservoir and route (human airborne tuberculosis;
  aspiration of the patient's own oral flora; zoonotic Pasteurella from animal
  contact; a sylvatic tapeworm cycle with transdiaphragmatic rupture of a liver
  cyst), in tempo (tuberculous empyema persists for years behind a calcified
  rind, while parapneumonic empyema evolves over days), and in first-line
  therapy (antituberculous chemotherapy; anaerobic-spectrum antibiotics with
  drainage; penicillin for Pasteurella; antiparasitic treatment with surgery).
  Pleural empyema as an organ syndrome spanning unrelated organisms is rule R4
  of design decision 3e, so it is represented as this grouping plus the module
  and not as a Disease entry.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018667
      label: pleural empyema
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      relatedMatch rather than exactMatch. MONDO:0018667 is the disease class
      "pus in the thoracic cavity", whereas the members of this grouping are
      diseases that produce pleural empyema as one of their manifestations.
      Only Tuberculous Empyema is classified under MONDO:0018667; Anaerobic
      Pneumonia, Pasteurellosis and Polycystic Echinococcosis are pneumonia,
      zoonotic and parasitic diseases in which empyema is a complication, so an
      exactMatch would assert a subsumption that does not hold.
membership_criteria:
- description: >-
    A member curates pleural empyema (HP:0011919) as a phenotype of its own
    disease, that is, pus or organisms in the pleural space arising from the
    disease's own infection.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_PHENOTYPE
    description: Has a phenotype bound to HP:0011919 Pleural empyema.
    phenotype_term:
      preferred_term: Pleural empyema
      term:
        id: HP:0011919
        label: Pleural empyema
members:
- member: Tuberculous Empyema
  member_type: DISEASE
  disease_term:
    preferred_term: tuberculous empyema
    term:
      id: MONDO:0005999
      label: tuberculous empyema
  differentiating_mechanisms:
  - description: >-
      Chronic multibacillary Mycobacterium tuberculosis infection of the pleural
      space, walled off by a thick, often calcified rind that can persist for
      years and impairs drug penetration; treated with antituberculous
      chemotherapy rather than pyogenic regimens. The only member MONDO
      classifies under pleural empyema itself.
- member: Anaerobic Pneumonia
  member_type: DISEASE
  disease_term:
    preferred_term: anaerobic pneumonia
    term:
      id: MONDO:0004649
      label: anaerobic pneumonia
  differentiating_mechanisms:
  - description: >-
      Parapneumonic empyema after aspiration of the patient's own oral
      anaerobes (Prevotella, Fusobacterium, Peptostreptococcus, Bacteroides),
      typically polymicrobial and preceded by necrotising pneumonia or lung
      abscess; the member that conforms to the module's bacterial invasion
      step.
    module: parapneumonic_empyema_formation#Bacterial Pleural Invasion and Purulent Progression
- member: Pasteurellosis
  member_type: DISEASE
  disease_term:
    preferred_term: pasteurellosis
    term:
      id: MONDO:0005901
      label: pasteurellosis
  differentiating_mechanisms:
  - description: >-
      Zoonotic Pasteurella multocida infection acquired from animal bites,
      scratches or contact; empyema arises by pleural extension of Pasteurella
      pneumonia, mainly in elderly patients with chronic lung disease or
      malignancy.
- member: Polycystic echinococcosis
  member_type: DISEASE
  disease_term:
    preferred_term: polycystic echinococcosis
    term:
      id: MONDO:0000288
      label: polycystic echinococcosis
  differentiating_mechanisms:
  - description: >-
      Parasitic rather than bacterial: a hepatic Echinococcus vogeli lesion
      that has become an abscess fistulises through the diaphragm into the
      right hemithorax. Recorded from a single case report, so the empyema is a
      rare complication rather than a usual feature of the disease.
references:
- reference: PMID:26150912
  title: "Pneumonia and empyema: causal, casual or unknown."
  findings:
  - statement: >-
      Empyema is defined by pus or bacteria in the pleural space, the shared
      phenotype on which members are grouped.
    supporting_text: >-
      Empyema is defined by the presence of bacteria or pus in the pleural
      space.
  - statement: >-
      The pleural cascade runs through three stages whatever the organism,
      which is why the mechanism is carried by a module rather than by each
      member.
    supporting_text: >-
      The evolution of parapneumonic effusion is divided into three progressive
      stages: (I) exudative stage; (II) fibrinopurulent stage; and (III)
      organizing stage with pleural peel formation
  - statement: >-
      Empyema has non-pneumonic causes as well as pneumonia, so the members are
      not all pneumonias.
    supporting_text: >-
      Other causes of empyema include complications after thoracic surgical
      procedures, trauma, esophageal perforation, thoracentesis and
      subdiaphragmatic infection
- reference: PMID:35544066
  title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
  findings:
  - statement: >-
      Pleural infection is usually polymicrobial, so no single organism
      defines the syndrome.
    supporting_text: >-
      Pleural infection was predominately polymicrobial (192 [79%] of 243
      samples)
notes: >-
  Coverage gap. Most non-tuberculous bacterial empyema has no member entry. The
  Pneumococcal_Pneumonia, Staphylococcus_Aureus_Pneumonia,
  Klebsiella_Pneumonia and Pneumonia_Caused_By_Pseudomonas_Aeruginosa_Infection
  entries do not curate pleural empyema as a phenotype, so they fail the
  necessary criterion and are not listed. Adding an evidenced pleural empyema
  phenotype to those entries would make them members. Actinomycosis mentions
  empyema only inside a quoted snippet and binds no HP:0011919 phenotype.
  Post-surgical and post-traumatic empyema has no disease entry of its own.
  Clinical content that has no home in a grouping record (pleural fluid
  criteria, imaging, the RAPID score, antibiotic, drainage, enzyme and surgical
  treatment, the MIST trials, incidence and mortality) was not carried here;
  the PR that created this grouping records where it went.

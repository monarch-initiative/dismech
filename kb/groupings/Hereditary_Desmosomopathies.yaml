name: Hereditary Desmosomopathies
display_name: Hereditary Desmosomopathies (Inherited Desmosome Disorders)
creation_date: "2026-10-23T18:00:00Z"
description: >-
  Hereditary disorders caused by a germline variant in a gene encoding a
  desmosomal protein: desmoplakin, plakoglobin or a desmoglein. Desmosomes hold
  cells together in tissues under mechanical stress, so their loss shows in the
  skin, hair, oral mucosa and heart. The members range from skin-only
  palmoplantar keratoderma and mucosal blistering to cardiocutaneous syndromes
  that combine woolly hair and keratoderma with arrhythmogenic or dilated
  cardiomyopathy. In those syndromes the skin and hair signs can flag cardiac
  risk.
grouping_basis:
- SHARED_MECHANISM
- SHARED_GENE_FAMILY
grouping_rationale: >-
  Grouped on a shared structure, the desmosome, rather than on the organ
  affected. Dermatology files the skin-only members under keratoderma or
  blistering disorders, and cardiology files the cardiac members under
  arrhythmogenic or dilated cardiomyopathy. Members stay separate Disease entries
  because the gene, its dosage and the inheritance set which tissues are hit:
  heterozygous DSP truncation causes skin-only striate keratoderma, while
  biallelic DSP loss or JUP loss adds cardiomyopathy.

  The criteria restrict the class to hereditary desmosome-gene disorders. The
  desmosomal adhesion module also takes the pemphigus diseases, which are
  autoimmune attacks on desmogleins, and Darier and Hailey-Hailey diseases, which
  are calcium-pump (ATP2A2, ATP2C1) disorders with desmosome loss downstream of
  the calcium defect. The gene criterion keeps those out, and MONDO's
  arrhythmogenic cardiomyopathy classes, which also include non-desmosomal
  genes, are related but not equivalent.

  Both criteria are NECESSARY. The gene list in the second criterion covers the
  desmosomal genes with known Mendelian disease, so it can admit future members
  (PKP2- and DSC2-related arrhythmogenic cardiomyopathy, PKP1 ectodermal
  dysplasia-skin fragility syndrome) once they are curated and conform.

  No MONDO class covers this grouping. It is proposed as proposal 14 in
  docs/reports/mondo-mechanism-classification-proposal-round-2-2026-10-23.md.
membership_criteria:
- description: >-
    Every member's pathophysiology conforms to the desmosomal adhesion failure
    module.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: desmosomal_adhesion_failure
    description: Conforms to the desmosomal_adhesion_failure module at one or more nodes.
- description: >-
    Every member is caused by a germline variant in a desmosomal gene.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    description: Causal gene is a desmosomal plaque protein or desmosomal cadherin.
    operands:
    - criterion_predicate: HAS_GENE
      description: Desmoplakin.
      gene:
        preferred_term: DSP
        term:
          id: hgnc:3052
          label: DSP
    - criterion_predicate: HAS_GENE
      description: Plakoglobin.
      gene:
        preferred_term: JUP
        term:
          id: hgnc:6207
          label: JUP
    - criterion_predicate: HAS_GENE
      description: Plakophilin 1.
      gene:
        preferred_term: PKP1
        term:
          id: hgnc:9023
          label: PKP1
    - criterion_predicate: HAS_GENE
      description: Plakophilin 2.
      gene:
        preferred_term: PKP2
        term:
          id: hgnc:9024
          label: PKP2
    - criterion_predicate: HAS_GENE
      description: Desmoglein 1.
      gene:
        preferred_term: DSG1
        term:
          id: hgnc:3048
          label: DSG1
    - criterion_predicate: HAS_GENE
      description: Desmoglein 2.
      gene:
        preferred_term: DSG2

        preferred_term: DSC2
        term:
          id: hgnc:3036
          label: DSC2
members:
- member: Naxos disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Recessive plakoglobin loss. Arrhythmogenic right ventricular
      cardiomyopathy with woolly hair from birth and diffuse palmoplantar
      keratoderma.
    gene:
      preferred_term: JUP
      term:
        id: hgnc:6207
        label: JUP
    module: desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion
- member: Carvajal Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Recessive desmoplakin loss. Dilated cardiomyopathy, woolly hair and
      palmoplantar keratoderma, with heart failure in childhood or adolescence.
    gene:
      preferred_term: DSP
      term:
        id: hgnc:3052
        label: DSP
    module: desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion
- member: Dilated Cardiomyopathy with Woolly Hair, Keratoderma, and Tooth Agenesis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Dominant, often de novo, missense or in-frame variants in the spectrin
      repeat 6 region of desmoplakin. Progressive cardiomyopathy with woolly
      hair, keratoderma and tooth agenesis.
    gene:
      preferred_term: DSP
      term:
        id: hgnc:3052
        label: DSP
    module: desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage
- member: Skin Fragility-Woolly Hair Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Recessive desmoplakin loss with skin fragility, blistering and
      keratoderma, without the cardiomyopathy of Carvajal syndrome.
    gene:
      preferred_term: DSP
      term:
        id: hgnc:3052
        label: DSP
    module: desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage
- member: Striate Palmoplantar Keratoderma Type 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Dominant DSP haploinsufficiency from truncating variants. Skin-only
      striate keratoderma of the palms and soles.
    gene:
      preferred_term: DSP
      term:
        id: hgnc:3052
        label: DSP
    module: desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade
- member: Dilated Cardiomyopathy 1BB
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Desmoglein-2 deficiency at the cardiomyocyte intercalated disc. The
      dilated, left-dominant or biventricular presentation, without skin or
      hair involvement.
    gene:
      preferred_term: DSG2
      term:
        id: hgnc:3049
        label: DSG2
    module: desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion
- member: Acantholytic Blistering of Oral and Laryngeal Mucosa
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Recessive desmoglein-3 loss. The genetic counterpart of mucosal pemphigus
      vulgaris: the protein the autoantibodies block is absent instead.
    gene:
      preferred_term: DSG3
      term:
        id: hgnc:3050
        label: DSG3
    module: desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion
notes: >-
  Excluded conformers of the module: pemphigus vulgaris, pemphigus foliaceus,
  pemphigus erythematosus and paraneoplastic pemphigus (autoimmune), and Darier
  and Hailey-Hailey diseases (calcium-pump genes). Candidates not yet in dismech:
  PKP2- and DSC2-related arrhythmogenic right ventricular cardiomyopathy, and
  PKP1-related ectodermal dysplasia-skin fragility syndrome.

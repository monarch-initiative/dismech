name: RASopathies
display_name: RASopathies (RAS-MAPK pathway syndromes)
creation_date: "2026-07-14T00:00:00Z"
description: >-
  The RASopathies are a clinically and genetically heterogeneous group of
  developmental disorders caused by germline (or, rarely, mosaic) mutations in
  genes encoding components and regulators of the RAS-MAPK signal transduction
  pathway. Despite distinct causal genes, the members converge on constitutive
  up-regulation of RAS-MAPK (ERK) signaling and share a recognizable
  phenotypic spectrum: distinctive craniofacial features, congenital heart
  defects (frequently pulmonary valve stenosis and hypertrophic
  cardiomyopathy), cutaneous and pigmentary abnormalities, short stature,
  variable neurocognitive involvement, and an increased predisposition to
  specific malignancies.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PATHWAY
grouping_rationale: >-
  Grouped on a shared pathogenic mechanism: every member results from a genetic
  lesion that increases signal throughput of the RAS-MAPK (ERK) cascade,
  whether by gain of function in a positive pathway component (e.g. PTPN11/SHP2,
  HRAS, BRAF, SHOC2) or by loss of function of a negative regulator (e.g. the
  RAS-GAP neurofibromin in NF1). The members are deliberately kept as separate
  Disease entries rather than merged, because they differ in the specific
  mutated gene, the direction of the molecular lesion (activating oncogene-like
  gain of function vs. tumor-suppressor loss of function), the mode and site of
  the mutation, and the resulting phenotypic and tumor-risk profile. This is a
  grouping over distinct entities, not a lumping of them into one disease.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0021060
      label: RASopathy
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept corresponds to the MONDO RASopathy class. exactMatch
      records the intended conceptual alignment; MONDO RASopathy descendants
      without DisMech entries are curation gaps rather than evidence that the
      grouping concept is only a close match.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All 5 listed members are is-a descendants of MONDO:0021060
        (verified against sqlite:obo:mondo): Noonan syndrome
        (MONDO:0018997), Costello syndrome (MONDO:0009026),
        cardiofaciocutaneous syndrome (MONDO:0015280), neurofibromatosis
        type 1 (MONDO:0018975), and Noonan syndrome-like disorder with loose
        anagen hair (MONDO:0011899). Juvenile myelomonocytic leukemia
        (MONDO:0011908) is a RAS-MAPK-driven myeloid neoplasm strongly
        associated with the RASopathies (and predisposed to by NF1 and
        germline CBL/Noonan mutations) but is NOT an is-a descendant of
        MONDO:0021060, so it is discussed in the notes as a related entity
        rather than listed as a formal member. Additional MONDO RASopathy
        descendants without DisMech entries should be surfaced as curation
        gaps from this exact mapping.
membership_criteria:
- description: >-
    A disorder belongs to the RASopathies if it is classified as a RASopathy
    AND its pathophysiology involves increased signalling through the RAS-MAPK
    (ERK) cascade — i.e. a germline lesion that raises RAS-MAPK pathway output,
    whether by gain of function in a positive component or loss of function of
    a negative regulator.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_CLASSIFICATION
      classification: RASopathy
      description: Carries the RASopathy nosology/classification assignment.
    - operator: OR
      description: >-
        Constitutive up-regulation of the MAPK (ERK) cascade downstream of RAS,
        modelled with any of the equivalent RAS-MAPK biological-process terms.
      operands:
      - criterion_predicate: HAS_BIOLOGICAL_PROCESS
        description: Increased signalling through the MAPK cascade.
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
      - criterion_predicate: HAS_BIOLOGICAL_PROCESS
        description: Positive regulation of the MAPK cascade.
        biological_processes:
        - preferred_term: positive regulation of MAPK cascade
          term:
            id: GO:0043410
            label: positive regulation of MAPK cascade
      - criterion_predicate: HAS_BIOLOGICAL_PROCESS
        description: Increased RAS protein signal transduction upstream of MAPK.
        biological_processes:
        - preferred_term: Ras protein signal transduction
          term:
            id: GO:0007265
            label: Ras protein signal transduction
          modifier: INCREASED
members:
- member: Noonan Syndrome
  member_type: DISEASE
  display_name: Noonan syndrome
  differentiating_mechanisms:
  - description: >-
      The prototypical and most common RASopathy. Most often caused by germline
      gain-of-function mutations in PTPN11 (encoding the protein tyrosine
      phosphatase SHP2), a positive regulator of RAS-MAPK signalling, with a
      broad allelic series across other pathway genes (SOS1, RAF1, RIT1, KRAS,
      LZTR1, and others). Distinguished clinically by pulmonary valve stenosis,
      hypertrophic cardiomyopathy, short stature, and a characteristic facial
      gestalt.
    gene:
      preferred_term: PTPN11
      term:
        id: hgnc:9644
        label: PTPN11
    modifier: INCREASED
- member: Costello Syndrome
  member_type: DISEASE
  display_name: Costello syndrome
  differentiating_mechanisms:
  - description: >-
      Caused by germline activating mutations in the proto-oncogene HRAS,
      placing the lesion at the level of the RAS GTPase itself. Distinguished
      by coarse facial features, deep palmar/plantar creases, papillomata, and
      the highest tumor-predisposition risk among the classic RASopathies
      (notably rhabdomyosarcoma, neuroblastoma, and bladder carcinoma).
    gene:
      preferred_term: HRAS
      term:
        id: hgnc:5173
        label: HRAS
    modifier: INCREASED
- member: Cardiofaciocutaneous Syndrome
  member_type: DISEASE
  display_name: Cardiofaciocutaneous syndrome
  differentiating_mechanisms:
  - description: >-
      Most commonly caused by germline mutations in BRAF (with a minority in
      MAP2K1/MAP2K2 or KRAS), placing the lesion at the RAF/MEK kinase tier of
      the cascade. Distinguished by prominent ectodermal and cutaneous
      involvement (sparse curly hair, ichthyosis, keratosis pilaris) and
      generally more severe intellectual disability than Noonan syndrome.
    gene:
      preferred_term: BRAF
      term:
        id: hgnc:1097
        label: BRAF
    modifier: INCREASED
- member: Neurofibromatosis Type 1
  member_type: DISEASE
  display_name: Neurofibromatosis type 1
  differentiating_mechanisms:
  - description: >-
      The tumor-suppressor RASopathy: caused by loss-of-function mutations in
      NF1, encoding the RAS-GAP neurofibromin. Loss of neurofibromin's
      GTPase-activating activity raises RAS-GTP levels and RAS-MAPK output —
      the same pathway endpoint as the gain-of-function members but by an
      opposite (loss-of-negative-regulator) mechanism. Distinguished by
      café-au-lait macules, cutaneous and plexiform neurofibromas, Lisch
      nodules, optic pathway gliomas, and a two-hit tumor-predisposition
      profile.
    gene:
      preferred_term: NF1
      term:
        id: hgnc:7765
        label: NF1
    modifier: INCREASED
- member: Noonan Syndrome-like Disorder with Loose Anagen Hair
  member_type: DISEASE
  display_name: Noonan syndrome-like disorder with loose anagen hair (NS/LAH)
  differentiating_mechanisms:
  - description: >-
      A distinct Noonan-spectrum RASopathy. NSLH1 is caused by the recurrent
      SHOC2 p.Ser2Gly substitution, which introduces an aberrant N-terminal
      myristoylation site and mislocalizes the SHOC2 phosphatase complex,
      dysregulating RAS-MAPK signalling; NSLH2 is caused by PPP1CB mutations.
      Distinguished by the characteristic easily pluckable, slow-growing loose
      anagen hair alongside the shared Noonan-like facies and cardiac features.
    gene:
      preferred_term: SHOC2
      term:
        id: hgnc:15454
        label: SHOC2
    modifier: INCREASED
notes: >-
  Worked example of a RAS-MAPK pathway grouping. Members reference existing
  Disease entries by name and were selected as the germline developmental
  RASopathies currently present in the KB that are also is-a descendants of the
  MONDO RASopathy class. Related RAS-MAPK entities intentionally NOT listed as
  formal members: (1) Juvenile Myelomonocytic Leukemia — a RAS-MAPK-driven
  myeloid neoplasm strongly linked to the RASopathies (predisposed to by NF1
  and by germline Noonan/CBL mutations) but classified in MONDO as a myeloid
  leukemia rather than as an is-a descendant of MONDO:0021060; (2)
  Capillary Malformation-Arteriovenous Malformation Syndrome (RASA1), a
  RAS-GAP disorder whose DisMech entry does not currently carry the RASopathy
  classification. Both are candidate additions once their entries declare the
  RASopathy classification and a RAS-MAPK mechanism node. When the in-flight
  Legius syndrome (SPRED1) and CBL-related disorder (CBL) entries from issue
  #6206 merge, they should be added here as additional members. A future
  refinement could add a CONFORMS_TO_MODULE criterion once a dedicated
  RAS-MAPK dysregulation mechanism module exists.

name: Bent Bone Dysplasia Syndromes
creation_date: '2026-11-20T21:58:18Z'
description: FGFR2-related and LAMA5-related diseases share a skeletal phenotype with distinct receptor
  and matrix mechanisms.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: The shared bent-bone skeletal phenotype supports the clinical union, but the receptor-localization
  and extracellular-matrix lesions are mechanistically distinct. FGFR2 bent bone dysplasia is not grouped
  by a generic gain-of-function FGFR mechanism. Other skeletal dysplasias with bowed bones do not enter
  solely through that finding.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:614592
      label: Bent bone dysplasia syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:614592, OMIM:620076. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates bowing of the long bones and FGFR2 or LAMA5. This is a necessary
    disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene mentions
    do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Bowing of the long bones
        term:
          id: HP:0006487
          label: Bowing of the long bones
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: FGFR2
          term:
            id: hgnc:3689
            label: FGFR2
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: LAMA5
          term:
            id: hgnc:6485
            label: LAMA5
members:
- member: FGFR2-Related Bent Bone Dysplasia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Specific FGFR2 transmembrane-domain variants reduce membrane receptor abundance and canonical
      extracellular FGF responsiveness.
    gene: *id001
    evidence:
    - reference: PMID:22387015
      reference_title: Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical
        FGF signaling.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Four unrelated affected individuals were found to be heterozygous for missense mutations
        that introduce a polar amino acid into the hydrophobic transmembrane domain of FGFR2.
      explanation: Defines the allele class and its position in the receptor.
    - reference: PMID:22387015
      reference_title: Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical
        FGF signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Using diseased chondrocytes and a cell-based assay, we determined that these mutations
        selectively reduced plasma-membrane levels of FGFR2 and markedly diminished the receptor's responsiveness
        to extracellular FGF.
      explanation: The direct demonstration that canonical membrane signaling is reduced, which is why
        this entry is not a member of the FGFR gain-of-function grouping.
- member: LAMA5-Related Bent Bone Dysplasia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Biallelic LAMA5 variants affect a basement-membrane laminin, reducing protein levels
      and disturbing skeletal matrix signaling.
    gene: *id002
    evidence:
    - reference: PMID:33242826
      reference_title: Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway
        and produces a distinct bent bone dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This bent bone dysplasia resulted from biallelic mutations in LAMA5, the gene encoding
        the alpha-5 laminin basement membrane protein.
      explanation: Establishes LAMA5 as the causal gene for this bent-bone dysplasia.
    - reference: PMID:33242826
      reference_title: Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway
        and produces a distinct bent bone dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: At the protein level, studies using primary chondrocytes, fibroblasts and cartilage derived
        from one of the affected individuals (R03-206G), showed statistically significantly decreased
        levels of LAMA5, demonstrating that the mutations in LAMA5 destabilized the protein
      explanation: Direct patient-tissue measurement that the alleles reduce LAMA5 protein, which is the
        mechanism this node asserts.

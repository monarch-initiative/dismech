name: Cerebral Creatine Deficiency Syndromes
creation_date: '2026-11-20T21:58:16Z'
description: Shared cerebral creatine depletion; distinguish GATM/GAMT biosynthesis from SLC6A8 transport.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_PATHWAY
grouping_rationale: The common cerebral creatine-deficiency phenotype joins defects of synthesis and transport.
  The existing gene-defined diseases remain separate because their biochemical signatures, inheritance
  and treatment responses differ. Reduced creatine is a convergent consequence, not proof of a single
  proximal lesion.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:300352
      label: Cerebral creatine deficiency syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:300352, OMIM:612718, OMIM:612736.
      These numbered concepts correspond to this explicit union. The mapping aligns the named series with
      its curated members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates global developmental delay and GATM or SLC6A8 or GAMT. This is a
    necessary disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene
    mentions do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Global developmental delay
        term:
          id: HP:0001263
          label: Global developmental delay
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: GATM
          term:
            id: hgnc:4175
            label: GATM
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: SLC6A8
          term:
            id: hgnc:11055
            label: SLC6A8
      - criterion_predicate: HAS_GENE
        gene: &id003
          preferred_term: GAMT
          term:
            id: hgnc:4136
            label: GAMT
members:
- member: AGAT Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: GATM deficiency blocks the first creatine-biosynthesis step, producing low guanidinoacetate
      as well as low creatine.
    gene: *id001
    evidence:
    - reference: PMID:22386973
      reference_title: Developmental progress and creatine restoration upon long-term creatine supplementation
        of a patient with arginine:glycine amidinotransferase deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: AGAT activity was not detectable in lymphoblasts and RNA analysis revealed a truncated
        mRNA (r.289_484del196) that is degraded via Nonsense Mediated Decay.
      explanation: Patient-derived cultured cells directly demonstrate absent activity and transcript
        loss.
    - reference: PMID:32883247
      reference_title: 'Increased creatine demand during pregnancy in Arginine: Glycine Amidino-Transferase
        deficiency: a case report.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: 'Cr is synthesized in a two-step reaction, where the rate-limiting step is the Arginine:
        Glycine Amidino-Transferase (AGAT) reaction to form guanidinoacetic acid (GAA) from arginine and
        glycine; GAA is quickly converted to Cr by guanidinoacetate methyltransferase (GAMT).'
      explanation: The background pathway supports the inference that loss of the first synthesis step
        reduces guanidinoacetate and creatine production; this passage is not a patient biochemical measurement.
      directness: INDIRECT
      quote_role: BACKGROUND
- member: Creatine Transporter Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SLC6A8 deficiency impairs cellular creatine uptake rather than synthesis and has X-linked
      inheritance.
    gene: *id002
    evidence:
    - reference: PMID:38452609
      reference_title: ClinGen variant curation expert panel recommendations for classification of variants
        in GAMT, GATM and SLC6A8 for cerebral creatine deficiency syndromes.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: After synthesis, creatine is taken up by a sodium-dependent membrane bound creatine transporter
        (CRTR), encoded by SLC6A8, into all organs.
      explanation: ClinGen VCEP review establishes SLC6A8 as the creatine transporter gene.
    - reference: PMID:20301745
      reference_title: Creatine Deficiency Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CRTR deficiency (caused by pathogenic variants in SLC6A8) is inherited in an X-linked manner.
      explanation: GeneReviews explicitly states the X-linked inheritance of SLC6A8-related creatine transporter
        deficiency.
      quote_role: REVIEW_SYNTHESIS
- member: Guanidinoacetate Methyltransferase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: GAMT deficiency blocks the second biosynthetic step, combining cerebral creatine depletion
      with guanidinoacetate accumulation.
    gene: *id003
    evidence:
    - reference: PMID:37465909
      reference_title: Evidence and Recommendation for Guanidinoacetate Methyltransferase Deficiency Newborn
        Screening.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Guanidinoacetate methyltransferase (GAMT) deficiency is an autosomal recessive disorder
        of creatine biosynthesis due to pathogenic variants in the GAMT gene that lead to cerebral creatine
        deficiency and neurotoxic levels of guanidinoacetate.
      explanation: Supports GAMT molecular dysfunction as the initiating defect.
    - reference: PMID:38469086
      reference_title: Long term follow-up in GAMT deficiency - Correlation of therapy regimen, biochemical
        and in vivo brain proton MR spectroscopy data.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cerebral creatine depletion and accumulation of guanidinoacetate (GAA) lead to clinical
        presentation with intellectual disability, seizures, speech disturbances and movement disorders.
      explanation: Confirms cerebral creatine depletion and GAA accumulation as the dual mechanism of
        disease.

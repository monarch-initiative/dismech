name: Autosomal Dominant Hypocalcemias
creation_date: '2026-11-20T21:58:16Z'
description: CASR receptor versus GNA11 downstream signaling provides a compact mechanism-based grouping.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_PATHWAY
grouping_rationale: The two diseases share enhanced calcium-sensing signaling and hypocalcemia, but perturb
  different signaling components. The series label Hypocalcemia is broader in ordinary language than its
  actual two-member enumeration; acquired hypocalcemia, other hypoparathyroid disorders and loss-of-function
  hypercalcemia alleles are outside this union.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:601198
      label: Hypocalcemia
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:601198, OMIM:615361. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates hypocalcemia and CASR or GNA11. This is a necessary disease-annotation
    check, not a patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality,
    and other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Hypocalcemia
        term:
          id: HP:0002901
          label: Hypocalcemia
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: CASR
          term:
            id: hgnc:1514
            label: CASR
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: GNA11
          term:
            id: hgnc:4379
            label: GNA11
members:
- member: Autosomal Dominant Hypocalcemia 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Activating CASR variants alter the calcium-sensing receptor itself, increasing sensitivity
      to extracellular calcium.
    gene: *id001
    evidence:
    - reference: PMID:8813042
      reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations in the
        calcium-sensing receptor.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Analysis of the functional expression of three of the mutant receptors in HEK-293 cells
        demonstrated shifts in the dose-response curves so that the extracellular calcium concentrations
        needed to produce half-maximal increases in total inositol phosphate in the cells were significantly
        (P=0.02 to P<0.001) lower than those required for the wild-type receptor.
      explanation: The direct measurement of the leftward shift in the dose-response curve, which is the
        molecular claim this node makes. Graded IN_VITRO because it is a heterologous expression experiment
        in HEK-293 cells.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
- member: Autosomal Dominant Hypocalcemia 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Activating GNA11 variants affect the downstream G-protein alpha subunit rather than the
      receptor.
    gene: *id002
    evidence:
    - reference: PMID:23802516
      reference_title: Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Missense GNA11 mutations (Arg181Gln and Phe341Leu) were detected in two unrelated patients
        with hypocalcemia; they were therefore identified as having autosomal dominant hypocalcemia type
        2.
      explanation: Identifies the first ADH2 variants.
    - reference: PMID:23802516
      reference_title: Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The autosomal dominant hypocalcemia type 2–associated Gα11 mutants, Gln181 and Leu341,
        resulted in a leftward shift in the concentration–response curves, with significantly lower EC50
        values, as compared with nonmutant Gα11 (Fig.
      explanation: Mutant Galpha11 lowers the calcium concentration needed for a half-maximal response.

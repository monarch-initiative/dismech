name: Blepharocheilodontic Syndromes
creation_date: '2026-11-20T20:33:47Z'
description: The CDH1- and CTNND1-related blepharocheilodontic syndromes share eyelid and
  dental abnormalities through disruption of cadherin-catenin-mediated cell adhesion, with
  variable orofacial clefting.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: The shared adhesion complex and overlapping eyelid, dental, and craniofacial
  phenotype explain the clinical series. The gene-defined diseases remain separate because
  altered E-cadherin can impair adhesive function in a dominant-negative manner, whereas truncating
  CTNND1 alleles reduce functional p120-catenin dosage and cadherin stability. These are different
  perturbations of the same complex. Clinical expression is variable, so clefting is not required
  in every affected person. CDH1-associated hereditary cancer susceptibility and other CTNND1
  disorders are not included solely because they involve the same genes.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:119580
      label: Blepharocheilodontic syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 series contains OMIM:119580, OMIM:617681, represented
      by the separately curated Disease members of this union. The series identifier denotes
      the group rather than its first numbered member.
  mondo_mappings:
  - term:
      id: MONDO:0007339
      label: blepharocheilodontic syndrome
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: The September 2026 MONDO class additionally contains Martinez-Monasterio-Pinheiro
      syndrome, beyond the two numbered CDH1 and CTNND1 members in PS119580. MONDO is therefore
      a broader target than this explicit two-disease union.
membership_criteria:
- description: Each member entry annotates ectropion of lower eyelids together with involvement
    of CDH1 or CTNND1. This is a necessary check of disease-level annotations, not a diagnostic
    rule for an individual or a claim that every patient manifests the finding. Gene annotations
    alone neither establish causation nor include all allelic disorders; the criteria are
    not sufficient to discover membership.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Ectropion of lower eyelids
        term:
          id: HP:0007651
          label: Ectropion of lower eyelids
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: CDH1
          term:
            id: hgnc:1748
            label: CDH1
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: CTNND1
          term:
            id: hgnc:2515
            label: CTNND1
members:
- member: Blepharocheilodontic Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: CDH1 variants directly alter E-cadherin. Dominant-negative impairment of
      adhesion was demonstrated for tested syndrome-associated variants, rather than being
      inferred for every CDH1 allele.
    gene:
      preferred_term: CDH1
      term:
        id: hgnc:1748
        label: CDH1
    evidence:
    - reference: PMID:29348693
      reference_title: Variants in members of the cadherin-catenin complex, CDH1 and CTNND1,
        cause blepharocheilodontic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Functional experiments in zebrafish and human cells showed that the CDH1 variants
        impair the cell adhesion function of the cadherin-catenin complex in a dominant-negative
        manner.
      explanation: Functional experiments support a direct dominant-negative adhesion defect
        in the CDH1 branch.
- member: Blepharocheilodontic Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: CTNND1 truncating variants reduce p120-catenin function or dosage. This distinguishes
      the regulatory catenin branch from the CDH1 structural adhesion-protein branch.
    gene:
      preferred_term: CTNND1
      term:
        id: hgnc:2515
        label: CTNND1
    evidence:
    - reference: PMID:28301459
      reference_title: Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due
        to mutations in CDH1 and CTNND1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified five CDH1 heterozygous missense mutations and three CTNND1 heterozygous
        truncating mutations leading to loss-of-function or haploinsufficiency.
      explanation: The molecular cohort distinguishes truncating CTNND1 alleles from CDH1
        missense alleles.

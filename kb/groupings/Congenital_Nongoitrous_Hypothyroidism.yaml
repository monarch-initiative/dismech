name: Congenital Nongoitrous Hypothyroidism
display_name: Congenital Nongoitrous Hypothyroidism (CHNG series)
creation_date: '2026-10-19T00:00:00Z'
description: 'The CHNG1-9 series groups primary thyroid dysgenesis or thyrotropin resistance, central
  hypothyroidism, and impaired thyroid hormone action in target tissues. It is a historical clinical series
  rather than a single molecular mechanism. CHNG3 adds noncoding repeat-mediated thyroid regulatory dysfunction:
  persistent elevated TSH may coexist with normal free thyroxine, and some adults develop nodular goiter.
  Congenital overt hormone deficiency and lifelong absence of goiter therefore cannot be universal membership
  requirements.'
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: The series connects disorders conventionally described as congenital nongoitrous hypothyroidism,
  despite distinct defects in thyroid development, pituitary drive, thyroid signaling, or peripheral hormone
  response. Clinical convention and the explicit numbered-member union establish the scope. Shared phenotype
  describes the historical organizing pattern, not a necessary finding in every individual. Gene-defined
  subtypes remain in the existing primary and central hypothyroidism entries; CHNG3, TSHB deficiency and
  THRA-related resistance have dedicated disease entries.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0000045
      label: hypothyroidism, congenital, nongoitrous
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: The grouping concept is the MONDO hypothyroidism, congenital, nongoitrous class,
      whose nine direct subclasses are the CHNG series. exactMatch records the intended conceptual alignment;
      a MONDO subclass without a dismech entry is a curation gap rather than evidence that the grouping
      is only a close match.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: 'All nine numbered CHNG concepts have curated coverage: TSHR, PAX8 and NKX2-5 as scoped subtypes
        of Congenital Hypothyroidism; TRHR, TBL1X and IRS4 as scoped subtypes of Central Congenital Hypothyroidism;
        and CHNG3, TSHB deficiency and THRA-related resistance as dedicated entries. The two broader parent
        disease terms are not themselves members of the CHNG union; only their named CHNG subtypes are
        included.'
  omimps_mappings:
  - term:
      id: OMIMPS:275200
      label: Hypothyroidism, congenital, nongoitrous
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot contains CHNG1 through CHNG9. These nine numbered
      entities are represented by the named subtype members and dedicated disease entries, including the
      newly curated CHNG3. ExactMatch aligns this explicit historical clinical family with the series;
      it does not assert one shared causal pathway.
membership_criteria:
- description: Membership is the explicitly enumerated CHNG1-9 series, aligned with MONDO:0000045. The
    SUBTYPE members denote only the named CHNG subtypes of their broader parent entries. This is an enumerated
    clinical convention, not a computable phenotype or gene classifier; no payload-free HAS_MAPPING rule
    is asserted.
- description: The historical nongoitrous label does not exclude adult nodular enlargement in CHNG3. Persistent
    elevated TSH with compensated thyroid hormone production is compatible with CHNG3, and receptor-level
    tissue resistance explains the THRA form.
members:
- member: Congenital Hypothyroidism
  member_type: SUBTYPE
  display_name: Primary forms - TSHR resistance (CHNG1), CHNG2 (PAX8), CHNG5 (NKX2-5)
  differentiating_mechanisms:
  - description: CHNG1. Biallelic TSHR loss of function leaves the thyroid unable to respond to TSH, giving
      a normally placed but small or normal-sized gland with raised TSH - resistance at the receptor rather
      than failure of the drive.
    gene:
      preferred_term: TSHR
      term:
        id: hgnc:12373
        label: TSHR
  - description: CHNG2. Heterozygous PAX8 variants impair the transcription factor that specifies thyroid
      follicular cells, causing thyroid dysgenesis (hypoplasia or ectopy) with variable penetrance.
    gene:
      preferred_term: PAX8
      term:
        id: hgnc:8622
        label: PAX8
  - description: CHNG5. Heterozygous NKX2-5 variants have been reported in thyroid dysgenesis, often alongside
      congenital heart defects; the parent entry types NKX2-5 as a susceptibility gene rather than a fully
      penetrant cause.
    gene:
      preferred_term: NKX2-5
      term:
        id: hgnc:2488
        label: NKX2-5
- member: Central Congenital Hypothyroidism
  member_type: SUBTYPE
  display_name: Central forms - CHNG7 (TRHR), CHNG8 (TBL1X), CHNG9 (IRS4)
  differentiating_mechanisms:
  - description: CHNG7. Biallelic TRHR loss of function removes the pituitary response to hypothalamic
      TRH, so TSH secretion is inadequate and the thyroid is understimulated.
    gene:
      preferred_term: TRHR
      term:
        id: hgnc:12299
        label: TRHR
  - description: CHNG8. X-linked TBL1X variants, a transcriptional corepressor component expressed in
      hypothalamus and pituitary, cause central hypothyroidism, often with hearing loss.
    gene:
      preferred_term: TBL1X
      term:
        id: hgnc:11585
        label: TBL1X
  - description: CHNG9. X-linked IRS4 loss of function, a signalling adaptor in the hypothalamic-pituitary
      axis, causes mild central hypothyroidism.
    gene:
      preferred_term: IRS4
      term:
        id: hgnc:6128
        label: IRS4
- member: Isolated Thyroid-stimulating Hormone Deficiency
  member_type: DISEASE
  display_name: Isolated TSH deficiency (CHNG4, TSHB)
  differentiating_mechanisms:
  - description: 'CHNG4. Biallelic TSHB variants abolish the TSH beta subunit, so the pituitary cannot
      make bioactive TSH while its other hormones are spared. The central-hypothyroidism counterpart to
      TSHR resistance: the same hormone-receptor step, lost on the ligand side.'
    gene:
      preferred_term: TSHB
      term:
        id: hgnc:12372
        label: TSHB
- member: Resistance to Thyroid Hormone Alpha
  member_type: DISEASE
  display_name: Resistance to thyroid hormone alpha (CHNG6, THRA)
  differentiating_mechanisms:
  - description: CHNG6. Heterozygous dominant-negative THRA variants block thyroid hormone action at the
      alpha receptor in tissues that depend on it (bone, gut, heart, brain), giving hypothyroid features
      with near-normal circulating hormone levels. The only member in which hormone production is intact
      and the defect is in the target tissue.
    gene:
      preferred_term: THRA
      term:
        id: hgnc:11796
        label: THRA
- member: Congenital Nongoitrous Hypothyroidism 3
  member_type: DISEASE
  display_name: 'CHNG3: chromosome 15q regulatory repeat-associated thyrotropin resistance'
  differentiating_mechanisms:
  - description: Noncoding repeat lesions activate thyroid regulatory chromatin and increase MIR7-2/MIR1179
      expression. The precise downstream microRNA signaling mechanism remains a working model.
    evidence:
    - reference: PMID:38714869
      reference_title: STR mutations on chromosome 15q cause thyrotropin resistance by activating a primate-specific
        enhancer of MIR7-2/MIR1179.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Fiber-seq and RNA-seq studies revealed that the mutant STR activates a thyroid-specific
        enhancer cluster, leading to haplotype-specific upregulation of the bicistronic MIR7-2/MIR1179
        locus 35 kb downstream and overexpression of its microRNA products in the participants' thyrocytes.
      explanation: Allele-resolved chromatin and RNA measurements in participant thyrocytes connect the
        repeat to enhancer activation and increased microRNA expression.
    - reference: PMID:38714868
      reference_title: Functional variants in a TTTG microsatellite on 15q26.1 cause familial nonautoimmune
        thyroid abnormalities.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Characterization of the noncoding variants with epigenomic data and in vitro experiments
        suggested that the microsatellite is located in a thyroid-specific transcriptional repressor,
        and its activity is disrupted by the variants.
      explanation: Epigenomic analysis and reporter experiments support disruption of thyroid-specific
        repressor activity.
notes: 'CHNG3 is no longer an unresolved-locus curation gap: the 2024 studies identify a noncoding repeat
  mechanism. No universal absence-of-goiter or low-thyroxine rule is imposed. The family remains distinct
  from broader congenital hypothyroidism and from every cause of raised TSH. Six CHNG entities are represented
  as named subtypes within two broader parent entries. The current coverage counter uses those parent
  disease terms, so it counts the three standalone entries and displays the six curated subtypes as apparent
  gaps; that counter is not the curated CHNG member count.'

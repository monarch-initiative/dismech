name: Congenital Nongoitrous Hypothyroidism
display_name: Congenital Nongoitrous Hypothyroidism (CHNG series)
creation_date: "2026-10-19T00:00:00Z"
description: >-
  The congenital nongoitrous hypothyroidisms are the numbered OMIM series
  CHNG1-9, collected in MONDO as hypothyroidism, congenital, nongoitrous. What
  defines the series is a negative finding: thyroid hormone action is deficient
  from birth and the thyroid is not enlarged, because nothing drives
  TSH-dependent thyroid growth: the TSH signal is absent, the gland cannot
  respond to it, or hormone production is intact and the defect lies in the
  target tissues. The members fall into three
  mechanistically unrelated families. In the primary forms the thyroid itself
  fails to develop or to respond to TSH (TSHR, PAX8, NKX2-5). In the central
  forms the hypothalamic-pituitary drive is missing, so TSH is low or
  ineffective (TSHB, TRHR, TBL1X, IRS4). In the resistance form hormone is made
  but the alpha thyroid hormone receptor cannot respond to it (THRA).
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped because MONDO and OMIM group them: this is a transcription of the
  CHNG numbered series, whose organising principle is congenital hypothyroid
  physiology without goitre rather than a shared mechanism. Primary thyroid
  dysgenesis, central hypothyroidism and receptor-level hormone resistance are
  all represented, so SHARED_MECHANISM would overstate what the members have in
  common - hence SHARED_PHENOTYPE plus CLINICAL_CONVENTION. The members are kept
  where they are already curated: the primary forms as gene-defined subtypes of
  Congenital Hypothyroidism, the TRHR, TBL1X and IRS4 forms as subtypes of
  Central Congenital Hypothyroidism, and the TSHB and THRA forms as their own
  Disease entries. The grouping gives the MONDO class a home without forcing a
  single pathograph over three unrelated mechanisms.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0000045
      label: hypothyroidism, congenital, nongoitrous
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept is the MONDO hypothyroidism, congenital, nongoitrous
      class, whose nine direct subclasses are the CHNG series. exactMatch
      records the intended conceptual alignment; a MONDO subclass without a
      dismech entry is a curation gap rather than evidence that the grouping is
      only a close match.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        Eight of the nine MONDO subclasses are curated: MONDO:0010142 (TSHR),
        MONDO:0024264 (CHNG2, PAX8) and MONDO:0009154 (CHNG5, NKX2-5) as
        subtypes of Congenital Hypothyroidism; MONDO:0032819 (CHNG7, TRHR),
        MONDO:0026731 (CHNG8, TBL1X) and MONDO:0026732 (CHNG9, IRS4) as
        subtypes of Central Congenital Hypothyroidism; MONDO:0010139 (CHNG4,
        TSHB) and MONDO:0013757 (CHNG6, THRA) as Disease entries. Both parent
        entries are anchored on broader MONDO classes (congenital
        hypothyroidism, central congenital hypothyroidism), so they are listed
        as SUBTYPE members and only their named CHNG subtypes fall inside this
        grouping. just grouping-mondo-consistency reads a SUBTYPE member's
        parent term, so it reports those two members as outside MONDO:0000045;
        each of their listed CHNG subtypes is a direct subclass of it. The ninth, MONDO:0012360 (congenital nongoitrous
        hypothyroidism 3), is defined by MONDO only as autosomal dominant
        resistance to thyrotropin linked to chromosome region 15q25.3-q26.1,
        with no causal gene identified, so it has no curatable mechanism and is
        recorded here as a gap.
membership_criteria:
- description: >-
    A disorder belongs to this grouping if and only if MONDO places it under
    hypothyroidism, congenital, nongoitrous (MONDO:0000045). The grouping is a
    transcription of the CHNG series, so placement in that class is both
    necessary and sufficient; it is deliberately not extended to congenital
    hypothyroidism without goitre that MONDO files outside this class.
  criteria_semantics: NECESSARY_AND_SUFFICIENT
  logic:
    criterion_predicate: HAS_MAPPING
    description: >-
      The member's disease term, or for a SUBTYPE member the named subtype's
      term, is an is-a descendant of MONDO:0000045 (hypothyroidism, congenital,
      nongoitrous).
- description: >-
    Clinically, every member presents from birth with deficient thyroid
    hormone action and no goitre. This is recorded as the group's defining
    description rather than as machine-evaluable logic: the THRA member has
    near-normal circulating thyroid hormone with tissue-level hypothyroidism,
    and the central members are annotated as central hypothyroidism rather than
    under a common HP class, so no single phenotype term covers every member
    without over- or under-reaching.
members:
- member: Congenital Hypothyroidism
  member_type: SUBTYPE
  display_name: Primary forms - TSHR resistance (CHNG1), CHNG2 (PAX8), CHNG5 (NKX2-5)
  differentiating_mechanisms:
  - description: >-
      CHNG1. Biallelic TSHR loss of function leaves the thyroid unable to
      respond to TSH, giving a normally placed but small or normal-sized gland
      with raised TSH - resistance at the receptor rather than failure of the
      drive.
    gene:
      preferred_term: TSHR
      term:
        id: hgnc:12373
        label: TSHR
  - description: >-
      CHNG2. Heterozygous PAX8 variants impair the transcription factor that
      specifies thyroid follicular cells, causing thyroid dysgenesis
      (hypoplasia or ectopy) with variable penetrance.
    gene:
      preferred_term: PAX8
      term:
        id: hgnc:8622
        label: PAX8
  - description: >-
      CHNG5. Heterozygous NKX2-5 variants have been reported in thyroid
      dysgenesis, often alongside congenital heart defects; the parent entry
      types NKX2-5 as a susceptibility gene rather than a fully penetrant cause.
    gene:
      preferred_term: NKX2-5
      term:
        id: hgnc:2488
        label: NKX2-5
- member: Central Congenital Hypothyroidism
  member_type: SUBTYPE
  display_name: Central forms - CHNG7 (TRHR), CHNG8 (TBL1X), CHNG9 (IRS4)
  differentiating_mechanisms:
  - description: >-
      CHNG7. Biallelic TRHR loss of function removes the pituitary response to
      hypothalamic TRH, so TSH secretion is inadequate and the thyroid is
      understimulated.
    gene:
      preferred_term: TRHR
      term:
        id: hgnc:12299
        label: TRHR
  - description: >-
      CHNG8. X-linked TBL1X variants, a transcriptional corepressor component
      expressed in hypothalamus and pituitary, cause central hypothyroidism,
      often with hearing loss.
    gene:
      preferred_term: TBL1X
      term:
        id: hgnc:11585
        label: TBL1X
  - description: >-
      CHNG9. X-linked IRS4 loss of function, a signalling adaptor in the
      hypothalamic-pituitary axis, causes mild central hypothyroidism.
    gene:
      preferred_term: IRS4
      term:
        id: hgnc:6128
        label: IRS4
- member: Isolated Thyroid-stimulating Hormone Deficiency
  member_type: DISEASE
  display_name: Isolated TSH deficiency (CHNG4, TSHB)
  differentiating_mechanisms:
  - description: >-
      CHNG4. Biallelic TSHB variants abolish the TSH beta subunit, so the
      pituitary cannot make bioactive TSH while its other hormones are spared.
      The central-hypothyroidism counterpart to TSHR resistance: the same
      hormone-receptor step, lost on the ligand side.
    gene:
      preferred_term: TSHB
      term:
        id: hgnc:12372
        label: TSHB
- member: Resistance to Thyroid Hormone Alpha
  member_type: DISEASE
  display_name: Resistance to thyroid hormone alpha (CHNG6, THRA)
  differentiating_mechanisms:
  - description: >-
      CHNG6. Heterozygous dominant-negative THRA variants block thyroid
      hormone action at the alpha receptor in tissues that depend on it
      (bone, gut, heart, brain), giving hypothyroid features with near-normal
      circulating hormone levels. The only member in which hormone production
      is intact and the defect is in the target tissue.
    gene:
      preferred_term: THRA
      term:
        id: hgnc:11796
        label: THRA
notes: >-
  Created to resolve the stub for MONDO:0000045, which no single Disease entry
  could retire because its subclasses are curated across four entries and
  span three unrelated mechanisms. CHNG3 (MONDO:0012360) has no identified
  gene and is not curated; the gap is recorded in the MONDO consistency notes.

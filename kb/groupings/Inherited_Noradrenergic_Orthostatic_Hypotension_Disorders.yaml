name: Inherited Noradrenergic Orthostatic Hypotension Disorders
creation_date: '2026-11-20T21:58:17Z'
description: DBH enzyme deficiency versus CYB561-dependent vesicular electron/cofactor supply.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: A selective noradrenergic failure phenotype joins defects in the synthetic enzyme
  and its vesicular reducing-equivalent supply. The gene-defined diseases remain distinct; the series
  does not encompass common drug-induced, volume-related or neurodegenerative orthostatic hypotension.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:223360
      label: Orthostatic hypotension
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:223360, OMIM:618182. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates orthostatic hypotension due to autonomic dysfunction and CYB561 or
    DBH. This is a necessary disease-annotation check, not a patient diagnostic rule or a sufficient classifier.
    Gene mentions do not establish causality, and other allelic disorders remain excluded by the explicit
    membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Orthostatic hypotension due to autonomic dysfunction
        term:
          id: HP:0004926
          label: Orthostatic hypotension due to autonomic dysfunction
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: CYB561
          term:
            id: hgnc:2571
            label: CYB561
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: DBH
          term:
            id: hgnc:2689
            label: DBH
members:
- member: CYB561-Related Orthostatic Hypotension
  member_type: DISEASE
  differentiating_mechanisms:
  - description: CYB561 deficiency disrupts vesicular ascorbate-dependent support of dopamine beta-hydroxylation
      while measured plasma DBH activity can remain normal.
    gene: *id001
    evidence:
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The CYB561 protein defect leads to a shortage of ascorbate inside the catecholamine secretory
        vesicles leading to a functional dopamine β-hydroxylase deficiency.
      explanation: The authors interpret the combined genetic, clinical and biochemical findings as intravesicular
        ascorbate shortage; this sentence is a mechanistic inference rather than a direct patient-vesicle
        measurement.
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene had no mutations.
      explanation: Normal plasma enzyme activity and negative DBH sequencing distinguish these families
        from primary DBH deficiency; they do not directly assay enzyme turnover inside patient vesicles.
    - reference: PMID:31822578
      reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CYB561 deficiency is characterized by selective sympathetic noradrenergic failure with
        lifelong, disabling OH but with normal sympathetic cholinergic (sweating) and parasympathetic
        (heart rate regulation) functions.
      explanation: Establishes the selectivity, which is what makes the autonomic phenotype mechanistically
        interpretable rather than a general dysautonomia.
- member: Dopamine Beta-Hydroxylase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: DBH deficiency directly removes dopamine beta-hydroxylase enzyme activity and impairs
      norepinephrine synthesis.
    gene: *id002
    evidence:
    - reference: PMID:33034372
      reference_title: Clinical presentation and long-term follow-up of dopamine beta hydroxylase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: DBH enzyme activity in plasma was reported in 18 patients and absent or severely decreased
        in all (Table S1). In three patients, DBH enzyme activity was tested in CSF and also absent there.
      explanation: Loss of enzyme activity in every patient tested.
    - reference: PMID:21209083
      reference_title: Norepinephrine deficiency is caused by combined abnormal mRNA processing and defective
        protein trafficking of dopamine beta-hydroxylase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Here, we show that the IVS1+2T→C mutation results in a non-detectable level of DBH protein
        production and that all three missense mutations tested lead to the DBH protein being trapped
        in the endoplasmic reticulum (ER).
      explanation: In vitro expression shows two routes to loss of function, absent protein for the splice
        allele and endoplasmic reticulum retention for missense alleles.

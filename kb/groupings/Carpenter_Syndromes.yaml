name: Carpenter Syndromes
creation_date: '2026-11-20T20:33:48Z'
description: RAB23- and MEGF8-related Carpenter syndromes share an autosomal recessive craniosynostosis-polysyndactyly
  presentation with overlapping developmental signaling disturbances.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_MECHANISM
grouping_rationale: The craniosynostosis and polysyndactyly syndrome supports the clinical
  grouping, while RAB23 and MEGF8 contribute different developmental-regulatory mechanisms.
  RAB23 is a trafficking GTPase with Hedgehog-regulatory activity; MEGF8 is a multidomain
  membrane protein, and its clinical branch more often includes abnormal left-right patterning.
  The existing entries retain distinct signaling and trafficking routes. Shared Hedgehog involvement
  is not a claim that every suture, limb, and laterality defect is caused by the same pathway
  step. The union excludes other craniosynostosis syndromes and other polydactyly disorders.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:201000
      label: Carpenter syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 series contains OMIM:201000, OMIM:614976, represented
      by the separately curated Disease members of this union. The series identifier denotes
      the group rather than its first numbered member.
  mondo_mappings:
  - term:
      id: MONDO:0019012
      label: Carpenter syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: The September 2026 MONDO direct children match the numbered disease
      concepts in this explicit union; the mapping does not merge their separately curated
      mechanisms.
membership_criteria:
- description: Each member entry annotates craniosynostosis and polydactyly together with
    involvement of RAB23 or MEGF8. This is a necessary check of disease-level annotations,
    not a diagnostic rule for an individual or a claim that every patient manifests the finding.
    Gene annotations alone neither establish causation nor include all allelic disorders;
    the criteria are not sufficient to discover membership.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Craniosynostosis
        term:
          id: HP:0001363
          label: Craniosynostosis
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Polydactyly
        term:
          id: HP:0010442
          label: Polydactyly
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: RAB23
          term:
            id: hgnc:14263
            label: RAB23
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: MEGF8
          term:
            id: hgnc:3233
            label: MEGF8
members:
- member: RAB23-related Carpenter Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: RAB23-related disease involves a vesicle-transport GTPase that negatively
      regulates Hedgehog signaling. The entry preserves its distinct trafficking and cranial-suture
      mechanisms.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    evidence:
    - reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for
        hedgehog signaling in cranial-suture development and obesity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: identified five different mutations (four truncating and one missense) in RAB23,
        which encodes a member of the RAB guanosine triphosphatase (GTPase) family of vesicle
        transport proteins and acts as a negative regulator of hedgehog (HH) signaling
      explanation: The original molecular cohort identifies RAB23 variants and the protein
        context of the type 1 branch.
- member: MEGF8-related Carpenter Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: MEGF8-related disease overlaps the Carpenter phenotype but is frequently
      associated with abnormal left-right patterning. This clinical difference and the distinct
      protein mechanism justify retaining a separate entry.
    gene:
      preferred_term: MEGF8
      term:
        id: hgnc:3233
        label: MEGF8
    evidence:
    - reference: PMID:23063620
      reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome
        subtype associated with defective lateralization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Here, we describe a disorder caused by mutations in multiple epidermal-growth-factor-like-domains
        8 (MEGF8), which exhibits substantial clinical overlap with Carpenter syndrome but
        is frequently associated with abnormal left-right patterning.
      explanation: The original cohort explicitly establishes both clinical overlap and a
        laterality distinction.

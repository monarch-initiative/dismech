name: Intrinsic and Innate Immunity Defect IEIs
display_name: Intrinsic and Innate Immunity Defect IEIs (IUIS Table 6)
creation_date: "2026-08-20T00:00:00Z"
description: >-
  IUIS Table 6 — defects in intrinsic and innate immunity. These inborn errors
  of immunity leave the adaptive compartment broadly intact and instead break a
  pattern-recognition, cytokine-signalling, or cell-intrinsic antimicrobial
  circuit. Their defining feature is narrow susceptibility: a single pathogen
  class — Candida, mycobacteria, herpesviruses, papillomavirus, invasive
  pyogenic bacteria — rather than the broad infection burden of combined or
  antibody deficiency.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: >-
  Grouped on the IUIS Table 6 pattern: a lesion in intrinsic or innate immunity
  producing pathogen-restricted, rather than general, infection susceptibility.
  Members are kept as separate Disease entries because the broken circuit and
  the pathogen it admits differ — the IL-17 axis and Candida in chronic
  mucocutaneous candidiasis, NK-cell development and herpesviruses in MCM10
  deficiency. The grouping is the natural home for the KB's Mendelian
  susceptibility entries, and it is what makes "narrow susceptibility" queryable
  as a class rather than restated per entry. No MONDO mapping: MONDO has no
  grouping class corresponding to IUIS Table 6, and the nearest candidates
  (e.g. immunodeficiency by pathogen) subsume only individual subtables.
membership_criteria:
- description: >-
    A disorder belongs to IUIS Table 6 if it is an inborn error of immunity
    whose primary lesion is in intrinsic or innate immunity — pattern
    recognition, innate cytokine signalling, or a cell-intrinsic antimicrobial
    program — typically producing susceptibility restricted to one pathogen
    class.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    classification: "iuis_category:innate immunity defect"
    description: >-
      Assigned to IUIS Table 6 (defects in intrinsic and innate immunity) via
      classifications.iuis_category on the member Disease entry. Stated in the
      keyed `<slot>:<value>` form so the audit reads the structured
      classifications block.
members:
- member: Chronic Mucocutaneous Candidiasis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Not one gene's disease but a convergent phenotype: every established
      etiology lies somewhere on the IL-17 circuit — the cytokine (IL17F), its
      receptor chains (IL17RA, IL17RC), the receptor-proximal adaptor
      (ACT1/TRAF3IP2), the Th17 master transcription factor (RORC), or STAT1
      gain of function repressing Th17 development. The clearest demonstration
      of the Table 6 logic that one circuit guards one pathogen class, here
      Candida at skin and mucosa.
    gene:
      preferred_term: STAT1
      term:
        id: hgnc:11362
        label: STAT1
- member: Immunodeficiency 80 with or without Congenital Cardiomyopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic variants in MCM10, an essential activator of the CMG DNA
      replicative helicase, produce a profound natural killer cell deficiency
      with absent terminally mature NK cells. Where the other member here loses
      a cytokine circuit, this one loses an innate effector lineage outright
      through a defect in general DNA replication that the NK compartment is
      unusually sensitive to.
    gene:
      preferred_term: MCM10
      term:
        id: hgnc:18043
        label: MCM10
notes: >-
  Created 2026-08-20 to give the IUIS Table 6 disorders a place in the Inborn
  Errors of Immunity tree; both members already carried
  `classifications.iuis_category: innate immunity defect` but were unreachable
  from the umbrella grouping. STAT2 Deficiency is a strong further candidate
  (type I interferon signalling) but does not yet carry an iuis_category
  assignment, so it is deliberately not listed — see the
  `iuis_table6_candidates_pending_assignment` discussion.
discussions:
- discussion_id: iuis_table6_candidates_pending_assignment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which further KB entries belong in IUIS Table 6, and what evidence fixes
    the table assignment for a disease whose susceptibility is narrow but whose
    IUIS placement has not been curated?
  rationale: >-
    `STAT2 Deficiency` is curated in kb/disorders/ with the Table 6 signature —
    a break in type I interferon signal transduction producing susceptibility
    restricted to viral disease — but carries no `classifications.iuis_category`
    assignment, so the NECESSARY criterion above cannot be evaluated for it and
    it cannot be listed here without asserting a table placement the entry does
    not itself record. The general problem is that table assignment is curated
    per entry while grouping membership is curated here, so an entry can be
    mechanistically obvious and still structurally invisible to the audit. The
    gap is bookkeeping, not biology, but leaving it implicit is what let five
    IUIS tables go unrepresented in this tree until 2026-08-20.
  proposed_experiments:
  - experiment_id: backfill_iuis_category_table6_candidates
    name: Backfill iuis_category across candidate IEI entries
    description: >-
      For each kb/disorders/ entry with an IEI phenotype and no
      `classifications.iuis_category`, cite the IUIS 2024 classification
      (PMID:41608114) or a disease-specific source that states the table
      placement, then add the entry to the matching sub-grouping. Candidates
      identified 2026-08-20: STAT2 Deficiency (Table 6), Wiskott-Aldrich
      Syndrome and Ataxia Telangiectasia (Table 2), Aicardi-Goutieres Syndrome,
      Familial Cold Autoinflammatory Syndrome and Proteasome-Associated
      Autoinflammatory Syndrome (Table 7).

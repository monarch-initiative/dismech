name: Disorders of GPI Anchor Biosynthesis
display_name: Disorders of GPI Anchor Biosynthesis (GPIBD)
creation_date: "2026-08-14T00:00:00Z"
description: >-
  The disorders of glycosylphosphatidylinositol (GPI) anchor biosynthesis are a
  group of inborn (and, in one acquired case, somatic) errors of the pathway that
  builds the GPI anchor and attaches it to nascent proteins in the endoplasmic
  reticulum and Golgi. More than 150 human proteins reach the cell surface as
  GPI-anchored proteins; a defect anywhere along the ~30-step PIG/PGAP assembly
  and remodeling pathway therefore reduces or alters cell-surface GPI-anchored
  protein display broadly rather than affecting a single client. The shared
  consequence of the inherited (germline, biallelic) forms is a multisystem
  disorder — classically developmental and epileptic encephalopathy with
  intellectual disability, hypotonia, seizures, and dysmorphism, often with
  hyperphosphatasia (elevated alkaline phosphatase, a biochemical hallmark of the
  Mabry/HPMRS arm that occurs across both assembly-step defects — HPMRS1/PIGV,
  HPMRS2/PIGO — and post-attachment remodeling defects, because the GPI-anchored
  alkaline phosphatase is shed into serum). The single acquired member,
  paroxysmal nocturnal hemoglobinuria, results from a somatic PIGA mutation in a
  hematopoietic stem cell clone rather than germline inheritance; MONDO
  nonetheless classifies it directly under the mapped GPI-anchor-biosynthesis
  parent, so its membership sits squarely within the group.
grouping_basis:
- SHARED_PATHWAY
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on the shared GPI-anchor biosynthetic pathway: each member disrupts a
  distinct step of GPI anchor assembly, transfer, or remodeling, and each
  member's disorder entry annotates GPI anchor biosynthetic process
  (GO:0006506). Members are kept as separate Disease entries because they act at
  different steps and present differently — de-N-acetylation of the first GlcNAc
  intermediate (PIGL, CHIME syndrome), the committed first transfer step of GPI
  synthesis (PIGA, paroxysmal nocturnal hemoglobinuria), and the
  mannosyltransferase / ethanolamine-phosphate-transferase and post-attachment
  remodeling steps (PIGV, PIGO, PGAP2, PGAP3, and others in Mabry syndrome). The
  primary criterion is NECESSARY (every member is a GPI-anchor-biosynthesis
  defect); this grouping is a pathway-based classification and does not attempt
  to recapitulate the full MONDO GPIBD subtype series. The NECESSARY-only
  criterion (GO:0006506) is intentionally not defining: dolichol-phosphate-mannose
  donor lesions such as DPM2- and MPDU1-congenital disorder of
  glycosylation also annotate GPI anchor biosynthetic process and would satisfy
  it, but are deliberately excluded here because their primary lesion is in the
  shared Dol-P-Man supply that also cripples N- and O-glycosylation, placing them
  in the broader glycosylation grouping rather than in a pathway-specific GPI
  group. Intended future members
  and curation gaps include the numbered inherited GPI-deficiency series
  (glycosylphosphatidylinositol biosynthesis defects, GPIBD1..N), e.g.
  GPIBD18/PIGS (MONDO:0029140, DEE95); these can be added once their own Disease
  entries exist, since grouping membership is a foreign key to a curated entry.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0024321
      label: disorder of GPI anchor biosynthesis
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept corresponds to the MONDO "disorder of GPI anchor
      biosynthesis" class (itself an is-a child of disorder of glycosylation).
      exactMatch records the intended conceptual alignment; MONDO descendants
      without DisMech entries (the numbered GPIBD series) are curation gaps
      rather than a reason to downgrade the mapping predicate.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All three members are is-a descendants of MONDO:0024321 in MONDO:
        Mabry syndrome (MONDO:0016596), CHIME syndrome (MONDO:0010221), and
        paroxysmal nocturnal hemoglobinuria (MONDO:0100244). MONDO:0024321 is
        logically defined by disruption of GPI anchor biosynthetic process
        (RO:0004021 some GO:0006506), and inheritance mode is not part of that
        definition, so the ACQUIRED somatic-PIGA clone in PNH classifies under
        the parent without exception — its membership needs no special pleading.
        Additional MONDO GPIBD descendants without DisMech entries should be
        surfaced as curation gaps from this mapping.
membership_criteria:
- description: >-
    A member is caused by a defect in the biosynthesis, transfer, or remodeling
    of the glycosylphosphatidylinositol (GPI) anchor, and accordingly perturbs
    GPI anchor biosynthetic process — the shared, machine-checkable biological
    process across the group.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_BIOLOGICAL_PROCESS
    description: Involves GPI anchor biosynthetic process.
    biological_processes:
    - preferred_term: GPI anchor biosynthetic process
      term:
        id: GO:0006506
        label: GPI anchor biosynthetic process
members:
- member: Mabry Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Mabry syndrome (hyperphosphatasia with mental retardation syndrome, HPMRS)
      is caused by biallelic defects in the
      mannosyltransferase/ethanolamine-phosphate-transferase steps of GPI
      assembly (PIGV, PIGO) and in the
      post-attachment fatty-acid remodeling steps (PGAP2, PGAP3). In both the
      assembly-step (PIGV/PIGO) and remodeling-step (PGAP2/PGAP3) defects the
      GPI-anchored alkaline phosphatase is shed into serum instead of being
      retained at the cell surface, producing the characteristic
      hyperphosphatasia that distinguishes this arm of the group.
    gene:
      preferred_term: PIGV
      term:
        id: hgnc:26031
        label: PIGV
- member: CHIME_syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      CHIME syndrome (colobomas, heart defects, ichthyosiform dermatosis, mental
      retardation, ear anomalies) is caused by biallelic PIGL variants. PIGL
      encodes the de-N-acetylase that removes the acetyl group from
      N-acetylglucosaminyl-phosphatidylinositol, the second step of GPI anchor
      synthesis — an early assembly-step defect, distinct from the remodeling
      defects of Mabry syndrome.
    gene:
      preferred_term: PIGL
      term:
        id: hgnc:8966
        label: PIGL
- member: Paroxysmal Nocturnal Hemoglobinuria
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Paroxysmal nocturnal hemoglobinuria is the ACQUIRED member: a somatic PIGA
      mutation in a hematopoietic stem cell abolishes the committed first step of
      GPI anchor synthesis (transfer of GlcNAc to phosphatidylinositol). The
      resulting loss of GPI-anchored complement regulators CD55 and CD59 on the
      clonal red cells causes complement-mediated intravascular hemolysis.
      Unlike the germline members it is X-linked-somatic and clonal, not
      inherited, and its phenotype is hematologic rather than a developmental
      encephalopathy.
    gene:
      preferred_term: PIGA
      term:
        id: hgnc:8957
        label: PIGA
- member: Multiple Congenital Anomalies-Hypotonia-Seizures Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      MCAHS is the severe developmental-and-epileptic-encephalopathy arm of germline
      inherited GPI deficiency, an umbrella over three subtypes defined by the affected
      GPI-pathway gene: MCAHS1 (PIGN, ethanolamine-phosphate transfer), MCAHS2 (PIGA,
      the committed first GlcNAc-transfer step; X-linked and mechanistically distinct
      from the somatic-PIGA clone of PNH), and MCAHS3 (PIGT, GPI transamidase
      attachment). Unlike the Mabry/HPMRS arm, MCAHS does not show persistent
      hyperphosphatasia (serum alkaline phosphatase is normal, or low in PIGT/MCAHS3),
      and the clinical picture is dominated by multiple congenital anomalies and
      early-onset drug-resistant epileptic encephalopathy rather than the bone-enzyme
      abnormality.

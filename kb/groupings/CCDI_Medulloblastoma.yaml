name: CCDI Medulloblastoma
display_name: Medulloblastoma (CCDI Diagnosis Group)
creation_date: "2026-11-14T00:00:00Z"
description: >-
  The entries a Childhood Cancer Data Initiative submission files under the
  diagnosis group Medulloblastoma (caDSR CDE 16607972). Medulloblastoma is an
  embryonal tumor of the cerebellum. WHO 2021 defines it molecularly, as
  WNT-activated, SHH-activated and non-WNT/non-SHH, and dismech curates each of
  those as its own entry beside an umbrella entry that holds what is common to
  all of them.
grouping_basis:
- CLINICAL_CONVENTION
- SHARED_PHENOTYPE
grouping_rationale: >-
  Lumped because every member is a medulloblastoma: an embryonal cerebellar
  tumor that CCDI, MONDO and NCIt all place under the one diagnosis. Kept split
  because the molecular groups differ in driver, in the progenitor they arise
  from, and in outcome, which is why WHO 2021 names them as separate entities.
  WNT-activated tumors carry CTNNB1 exon 3 mutations and have the best
  prognosis; SHH-activated tumors carry PTCH1, SMO or SUFU loss; non-WNT/non-SHH
  tumors cover the historical Groups 3 and 4. The umbrella entry is a member
  alongside the groups it points at, because it is the entry a medulloblastoma
  with no reported molecular group resolves to.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0007959
      label: medulloblastoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The CCDI value is bound by caDSR to NCIT:C3222 (Medulloblastoma), the
      NCIT cross-reference of MONDO:0007959, and every member's own MONDO term
      is that class or a descendant of it.
membership_criteria:
- description: >-
    A member carries the CCDI diagnosis group Medulloblastoma. The value is
    derived from the entry's NCIt concept, so it holds exactly when that
    concept is NCIT:C3222 (Medulloblastoma) or a descendant of it.
  criteria_semantics: NECESSARY_AND_SUFFICIENT
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    description: >-
      Assigned on the member entry via
      classifications.ccdi_pediatric_oncology_category.
    classification: "ccdi_pediatric_oncology_category:Medulloblastoma"
members:
- member: Medulloblastoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The umbrella entry. It holds the content common to all molecular groups
      and lists them as subtypes, with `curated_in` pointers to the three
      entries below. Groups 3 and 4 are subtype rows here and have no entry of
      their own.
- member: "Medulloblastoma, WNT-Activated"
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      About 10% of medulloblastomas. Driven by CTNNB1 exon 3 mutations, or by
      germline APC mutations, which stabilize beta-catenin and activate WNT
      target genes. Best prognosis of the groups.
    gene:
      preferred_term: CTNNB1
      term:
        id: hgnc:2514
        label: CTNNB1
- member: "Medulloblastoma, SHH-Activated"
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      About 30% of medulloblastomas. Driven by loss of PTCH1 or SUFU,
      activating SMO mutations, or GLI2 or MYCN amplification, all of which
      activate GLI transcription factors. WHO 2021 splits the group by TP53
      status.
    gene:
      preferred_term: PTCH1
      term:
        id: hgnc:9585
        label: PTCH1
- member: "Medulloblastoma, Non-WNT/Non-SHH"
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      About 60% of medulloblastomas, covering the historical transcriptional
      Groups 3 and 4. MYC amplification is common in Group 3, which has the
      highest metastatic rate and the worst prognosis.
    gene:
      preferred_term: MYC
      term:
        id: hgnc:7553
        label: MYC
notes: >-
  Nested in CCDI Pediatric Oncology Diagnosis Groups. The percentages and
  drivers on the member rows restate the subtype descriptions of the umbrella
  Medulloblastoma entry and the member entries; they are not independently
  cited here.

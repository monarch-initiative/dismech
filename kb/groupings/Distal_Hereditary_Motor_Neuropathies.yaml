name: Distal Hereditary Motor Neuropathies
display_name: Distal Hereditary Motor Neuropathies (dHMN / distal SMA)
creation_date: "2026-08-19T00:00:00Z"
description: >-
  A curated union of the dismech Disease entries that make up the distal
  hereditary motor neuropathies (dHMN; also called distal spinal muscular
  atrophy, dSMA, or "spinal CMT") — inherited disorders in which degeneration
  of the distal axons of lower motor neurons produces slowly progressive distal
  weakness and amyotrophy with little or no sensory involvement. The
  degeneration is usually length-dependent, though not invariably so: the
  TRPV4-related forms are scapuloperoneal. The family is defined clinically and
  electrophysiologically rather than molecularly: motor nerve conduction shows a
  motor axonal pattern with chronic neurogenic change on EMG, and sensory
  responses are preserved or only mildly abnormal, which is what separates dHMN
  from the sensorimotor axonal Charcot-Marie-Tooth neuropathies (CMT2) and from
  the proximal, SMN1-related spinal muscular atrophies. Around thirty causative
  genes are known across autosomal dominant, autosomal recessive, and X-linked
  branches, and they converge on a small number of motor-axon housekeeping
  processes (chaperone-mediated protein quality control, axonal transport,
  tRNA charging and RNA metabolism, endoplasmic-reticulum function, and cation
  channels/transporters) — yet the majority of patients remain genetically
  unsolved, so the group is still held together by its phenotype. Reported
  prevalence is approximately 2.1–2.3 per 100,000. Members are kept as separate
  Disease entries because they differ in inheritance, causal gene, age of onset,
  and the presence of respiratory, pyramidal, vocal-cord, or scapuloperoneal
  features.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on a shared clinical-electrophysiological lesion — inherited,
  length-dependent, predominantly motor degeneration of distal lower-motor-neuron
  axons — rather than on a single molecular mechanism, which is deliberately
  heterogeneous across the members (small heat-shock-protein and seipin
  proteostasis failure, dynactin axonal-transport failure, glycyl-tRNA-synthetase
  and IGHMBP2 helicase RNA-handling defects, TRPV4 calcium-channel
  gain of function). The members are lumped because they share a common
  diagnostic frame (pure-motor EMG/NCS pattern, the same differential against
  CMT2 and juvenile ALS, the same genetic-testing panel) and a convergent distal
  motor axonopathy, but kept as separate entries because MONDO itself splits the
  family on inheritance (MONDO:0015362 dominant, MONDO:0015363 recessive) and
  because the individual entries differ in causal gene, onset, and extra-motor
  features.

  Four boundary decisions are recorded deliberately. First, the criteria are
  NECESSARY rather than NECESSARY_AND_SUFFICIENT: distal lower-motor-neuron
  degeneration with distal weakness is entailed by membership, but it is not
  sufficient, since the same picture arises in the sensorimotor axonal
  neuropathies (CMT2), in distal myopathies, and in acquired lower-motor-neuron
  syndromes. Second, no negated sensory leaf is curated, even though "pure
  motor" is the phrase that names the group: many forms of dHMN have minor
  sensory abnormalities, and abnormal sensory conduction with abnormal sural
  nerve biopsy is a common finding in the IGHMBP2 disorders, so a NOT leaf on
  distal sensory impairment would report correctly curated members as
  contradictions rather than police the boundary.
  Third, Charcot-Marie-Tooth Disease Type 2 is intentionally NOT a member even
  though several genes (HSPB1, HSPB8, GARS1, TRPV4) are allelic across both:
  the dismech CMT2 entry is curated as a sensorimotor neuropathy, and admitting
  it would dissolve exactly the boundary this grouping exists to record. The
  allelic overlap is captured instead in the per-member differentiating
  mechanisms and in a curated discussion. Fourth, length-dependence is treated
  as typical rather than criterial: the TRPV4-related scapuloperoneal form is
  admitted despite a shoulder-girdle-involving distribution, because the
  literature places TRPV4 in a continuous allelic series with distal HMN, and
  because the criteria test for distal lower-motor-neuron degeneration with
  distal weakness rather than for a strictly length-dependent gradient.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018894
      label: distal hereditary motor neuropathy
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      exactMatch: this grouping denotes the same concept as the MONDO distal
      hereditary motor neuropathy class, whose exact synonyms ("dHMN", "dSMA",
      "distal spinal muscular atrophy") are the same names this grouping is
      curated under. The mapping relates the two concepts, not their
      enumerated extensions: the grouping is implemented as an explicit curated
      union of current dismech Disease entries rather than as an automatic
      MONDO subtree closure, so its member list is the currently curated subset
      and is expected to grow. Two of the three MONDO children —
      MONDO:0015362 (autosomal dominant) and MONDO:0015363 (autosomal
      recessive) — are curated Disease entries and are listed as members; the
      third, MONDO:0010338 (X-linked distal spinal muscular atrophy type 3,
      ATP7A), is curated as a has_subtypes subtype of Menkes_Disease rather
      than as a standalone entry, so it is not listed here.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        The member list also includes two entries that sit inside the clinical
        dHMN spectrum but are placed differently in MONDO: Spinal Muscular
        Atrophy with Respiratory Distress Type 1 (MONDO:0011436), which is a
        MONDO descendant of the recessive child MONDO:0015363, and
        Scapuloperoneal Spinal Muscular Atrophy (MONDO:0008408), which MONDO
        classifies under spinal muscular atrophy rather than under
        MONDO:0018894 despite TRPV4 being a recognized dHMN gene. The MONDO
        descendant set of MONDO:0018894 should therefore not be treated as an
        exhaustive list of dismech dHMN entries, nor this member list as an
        exhaustive reading of the MONDO subtree.

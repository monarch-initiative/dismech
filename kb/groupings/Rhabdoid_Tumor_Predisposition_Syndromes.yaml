name: Rhabdoid Tumor Predisposition Syndromes
creation_date: '2026-11-20T21:58:18Z'
description: SMARCB1 versus SMARCA4 SWI/SNF subunits and their differing tumor spectra.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: 'The union groups inherited predisposition to rhabdoid tumors through distinct SWI/SNF
  components. A shared tumor-suppressor architecture does not make the gene-specific tumor spectra identical.
  Tumor occurrence is not required in every carrier: the phenotype criterion checks annotations on the
  disease records, not penetrance or a patient diagnosis. Sporadic rhabdoid tumors and unrelated allelic
  syndromes are excluded.'
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:609322
      label: Rhabdoid tumor predisposition syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:609322, OMIM:613325. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates rhabdoid tumor of the kidney and SMARCB1 or SMARCA4. This is a necessary
    disease-annotation check, not a patient diagnostic rule or a sufficient classifier. Gene mentions
    do not establish causality, and other allelic disorders remain excluded by the explicit membership
    boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Rhabdoid tumor of the kidney
        term:
          id: HP:0034402
          label: Rhabdoid tumor of the kidney
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: SMARCB1
          term:
            id: hgnc:11103
            label: SMARCB1
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: SMARCA4
          term:
            id: hgnc:11100
            label: SMARCA4
members:
- member: Rhabdoid Tumor Predisposition Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Germline SMARCB1 alterations predispose to rhabdoid tumors; a somatic second hit completes
      tumor-suppressor inactivation.
    gene: *id001
    evidence:
    - reference: PMID:21108436
      reference_title: Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Germline mutations and deletions of SMARCB1/INI1 in chromosome band 22q11.2 predispose
        patients to rhabdoid tumor and schwannomatosis.
      explanation: Names the germline lesion and the two tumour phenotypes it predisposes to.
    - reference: PMID:21108436
      reference_title: Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The second inactivating event in the tumors from these patients was a deletion (16), copy
        number neutral loss of heterozygosity (CN LOH) (10 tumors), or a frameshift mutation (8).
      explanation: Directly documents the somatic second-hit mechanisms completing biallelic SMARCB1 inactivation
        in human RTPS1 rhabdoid tumors.
- member: Rhabdoid Tumor Predisposition Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SMARCA4 affects the SWI/SNF ATPase subunit; germline predisposition and somatic inactivation
      distinguish this branch, which also includes ovarian small-cell carcinoma susceptibility.
    gene: *id002
    evidence:
    - reference: PMID:20137775
      reference_title: Germline nonsense mutation and somatic inactivation of SMARCA4/BRG1 in a family
        with rhabdoid tumor predisposition syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified inactivation of another member of the SWI/SNF chromatin-remodeling complex,
        its ATPase subunit SMARCA4 (also known as BRG1), due to a SMARCA4/BRG1 germline mutation and loss
        of heterozygosity by uniparental disomy in the tumor cells of two sisters with rhabdoid tumors
        lacking SMARCB1 mutations.
      explanation: The original description of RTPS2, establishing germline SMARCA4 as a rhabdoid predisposition
        gene distinct from SMARCB1.
    - reference: PMID:24658002
      reference_title: Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the
        ovary, hypercalcemic type.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All the familial tumors sequenced harbored either a somatic mutation or loss of the wild-type
        allele.
      explanation: 'Confirms the two-hit pattern: every familial tumour lost its remaining wild-type SMARCA4
        allele.'

name: MYCN Dosage Disorders
display_name: MYCN dosage disorders
creation_date: '2026-11-11T21:40:00Z'
description: >-
  Every curated entry whose mechanism or risk stratification turns on the dose or activity of MYCN. The
  group spans three directions that a gene-centred axis would otherwise hide from each other: somatic
  amplification, germline loss of one copy producing a malformation syndrome, and a germline variant that
  stabilises the protein. What amplification *does* is not uniform either - in some members it is the
  driver, in others only a risk marker - and each member's differentiating_mechanisms says which. Reading
  the directions together is the point of grouping on a gene rather than on a mechanism.
grouping_basis:
- OTHER
grouping_rationale: >-
  The axis is a single gene, and the basis is OTHER for a reason narrower than the one a reader might
  assume. SHARED_GENE_FAMILY does cover a single gene - its own description reads "caused by variants
  in the same gene, gene family, or functionally related set of genes/enzymes", and WT1_Disorders and
  Dystrophinopathies both use it that way. It is wrong here because of the other half of that sentence:
  it asserts that members are *caused by* variants in the gene, and that is false of this group. Ganglioneuroblastoma
  and Ganglioneuroma record MYCN amplification as a BIOMARKER, and Ganglioneuroma's entry says outright
  that no cited source treats it as the initiating lesion. SHARED_MECHANISM is wrong for a different reason:
  the members run the gene in opposite directions.


  Grouping on the gene is worth doing precisely because the mechanisms differ. Amplification driving a
  neuroblastic tumour, amplification used only to assign risk, haploinsufficiency in Feingold syndrome
  and a phosphodegron variant that stops the protein being degraded are four different claims about one
  locus. A reader who wants only the driver cases can take that subset; a reader who wants to know what
  losing MYCN does has nowhere else in the knowledge base to look.


  A member is typed SUBTYPE where the entry's own content scopes MYCN to one named stratum rather than
  to the disease. Three members are typed that way, and the basis differs between them: Feingold syndrome
  and Retinoblastoma record the scoping structurally - a subtype: Type 1 foreign key on the Feingold gene
  record, and the Retinoblastoma binding sitting on the has_subtypes row itself - while Ependymoma records
  it only in prose. See that member's row.
membership_criteria:
- description: >-
    A member's entry structurally binds MYCN (hgnc:7559) as a gene in its own right - in `genetic`, on
    a pathophysiology node, or on a `has_subtypes` row - and the entry's mechanism turns on MYCN dose
    or activity rather than merely mentioning the gene.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_GENE
    description: MYCN is bound as a gene in the member's own entry.
    gene:
      preferred_term: MYCN
      term:
        id: hgnc:7559
        label: MYCN
members:
- member: Neuroblastoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Somatic amplification, recorded as a `SOMATIC_DRIVER`, and the reference case for the whole group.
      It is the only member that also models the amplicon's architecture rather than only its presence.
- member: Ganglioneuroblastoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Amplification recorded as a `BIOMARKER` rather than a driver - the entry uses it to stratify risk,
      not to explain the tumour.
- member: Ganglioneuroma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The benign end of the neuroblastic spectrum, where amplification is likewise a BIOMARKER. Its entry
      goes furthest of any member in denying MYCN a mechanistic role, stating that no cited source treats
      amplification as the initiating lesion and carrying no pathophysiology node for it.
- member: ALK-Related Neuroblastic Tumor Susceptibility
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The only member whose MYCN record is `COOPERATING` rather than causal on its own: the entry models
      somatic MYCN amplification arriving in a neuroblast that already carries a germline lesion, so MYCN
      is the second event rather than the first.
- member: Alveolar Rhabdomyosarcoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Amplification outside the neuroblastic lineage entirely, in a fusion-driven sarcoma, where the entry
      models N-Myc inside a feedback loop with the PAX-FOXO1 fusion rather than as a standalone driver.
- member: Medulloblastoma, SHH-Activated
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Amplification in a central nervous system embryonal tumour whose defining lesion is a different
      pathway, so MYCN is a cooperating amplification within an SHH-driven tumour.
- member: Ependymoma
  member_type: SUBTYPE
  display_name: Spinal ependymoma, MYCN-amplified
  differentiating_mechanisms:
  - description: >-
      Typed SUBTYPE because only the SP-MYCN stratum of ependymoma turns on MYCN, which that entry states
      in the prose of its MYCN Amplification in Spinal Ependymoma node. Unlike the group's other two SUBTYPE
      members, nothing records that scoping structurally: the SP-MYCN has_subtypes row carries no genes,
      and neither the genetic record nor the pathophysiology node carries a subtype foreign key. That
      is a gap in the Ependymoma entry rather than in this grouping, and it is the reason this member's
      typing cannot be checked automatically.
- member: Retinoblastoma
  member_type: SUBTYPE
  display_name: MYCN-Amplified RB1+/+ Retinoblastoma
  differentiating_mechanisms:
  - description: >-
      The one member in which MYCN amplification substitutes for the disease's own defining lesion rather
      than adding to it: the stratum is RB1 wild-type, so amplification is an alternative route into the
      same tumour.
- member: Feingold Syndrome
  member_type: SUBTYPE
  differentiating_mechanisms:
  - description: >-
      The opposite direction, and the group's only loss-of-dose member. A germline loss-of-function variant
      leaves one working copy, and the entry models haploinsufficiency producing a malformation syndrome.
      Typed SUBTYPE because only type 1 is the MYCN form - the entry scopes it with a subtype: Type 1
      key on its gene record, and type 2 is MIR17HG. It is the one member whose entry mentions no tumour
      at all.
  display_name: Feingold syndrome type 1
- member: Megalencephaly-polydactyly Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The third direction, and the group's only gain of dose without amplification. A de novo variant
      disrupting the Thr58 phosphodegron stops the protein being degraded, so the entry models MYCN protein
      accumulation from a constitutional lesion rather than from extra copies. It is not a malformation
      syndrome *instead of* a tumour: that entry carries a Neuroblastoma phenotype under category Neoplasm,
      a downstream edge to it and a treatment row for it, and it is a member of Neuroblastoma_Predisposition_Syndromes.
      The contrast with Feingold syndrome is between the two dosage directions, not between syndrome and
      tumour.
notes: >-
  One entry that binds MYCN is deliberately not a member, and one that was nominated binds it nowhere.


  Esophageal_Atresia binds MYCN twice: as a MYCN-associated Feingold syndrome record with relationship_type
  SUSCEPTIBILITY, and on a Foregut transcription factor dysfunction pathophysiology node that lists MYCN
  alongside SOX2 and FOXF1. So it meets the structural half of the criterion more fully than a reader
  might expect, and the exclusion rests on the second half - the node bundles three transcription factors
  and says nothing about MYCN dose, and oesophageal atresia is itself a manifestation of Feingold syndrome,
  which is a member. Listing it would put a feature of one member beside that member as though the two
  were siblings.


  Wilms_Tumor was nominated by the source report and its entry contains no occurrence of MYCN at all -
  zero, case-insensitively. Whether the literature supports MYCN gain in Wilms tumour is a question for
  that entry; until something is curated there it cannot satisfy this grouping's criterion, and adding
  it would make the criterion false rather than making the grouping more complete. The same is true of
  Small_Cell_Lung_Cancer and of the parent Medulloblastoma entry, both of which mention MYCN in prose
  without binding it and whose biology would qualify if anyone did. They are named here so they are not
  re-nominated as oversights.


  just grouping-nesting-audit reports that Peripheral Neuroblastic Tumors - Neuroblastoma, Ganglioneuroblastoma
  and Ganglioneuroma - sits entirely inside this grouping, and it is deliberately not declared as a nested
  member. That grouping's axis is the INPC pathology classification; this one's is a gene, and the three
  entries make different claims about it: a SOMATIC_DRIVER record in one and a BIOMARKER record in each
  of the other two. Nesting would replace those three differentiating_mechanisms with a single row, which
  would lose exactly the distinction this grouping exists to show.


  The audit also reports Rhabdomyosarcoma as half-contained: Alveolar_Rhabdomyosarcoma is a member and
  Embryonal_Rhabdomyosarcoma is not, because that entry contains no occurrence of MYCN either.

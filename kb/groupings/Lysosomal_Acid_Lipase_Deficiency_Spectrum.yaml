name: Lysosomal Acid Lipase Deficiency Spectrum
creation_date: '2026-11-20T21:58:18Z'
description: Wolman disease and cholesteryl ester storage disease are separately curated LIPA-related
  entities.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
grouping_rationale: Both members affect the same lysosomal neutral-lipid hydrolase. This grouping organizes
  two already-curated clinical entities across a severity continuum; it does not assert distinct genes
  or a sharp molecular boundary. Keeping their existing entries preserves different onset and clinical-course
  descriptions while making the common disease spectrum explicit.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:278000
      label: Lysosomal acid lipase deficiency
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:278000, OMIM:620151. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates hepatomegaly and LIPA. This is a necessary disease-annotation check,
    not a patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality,
    and other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Hepatomegaly
        term:
          id: HP:0002240
          label: Hepatomegaly
    - criterion_predicate: HAS_GENE
      gene: &id001
        preferred_term: LIPA
        term:
          id: hgnc:6617
          label: LIPA
members:
- member: Cholesteryl Ester Storage Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Cholesteryl ester storage disease represents the residual-activity, generally later-presenting
      part of the LIPA deficiency spectrum.
    gene:
      preferred_term: LIPA
      term:
        id: hgnc:6617
        label: LIPA
    evidence:
    - reference: PMID:37028992
      reference_title: Recent insights into lysosomal acid lipase deficiency.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: Lysosomal acid lipase (LAL) is the sole enzyme known to degrade neutral lipids in the lysosome.
        Mutations in the LAL-encoding LIPA gene lead to rare lysosomal lipid storage disorders with complete
        or partial absence of LAL activity
      explanation: Establishes LIPA/LAL deficiency as the primary defect; CESD reflects partial (residual)
        LAL activity.
    - reference: PMID:30866656
      reference_title: Lysosomal Acid Lipase in Lipid Metabolism and Beyond.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: Lysosomal acid lipase (LAL), encoded by the lipase A ( LIPA) gene, hydrolyzes cholesteryl
        esters and triglycerides to generate free fatty acids and cholesterol in the cell.
      explanation: Defines both cholesteryl ester hydrolase and triglyceride lipase activities lost in
        LIPA deficiency.
- member: Wolman Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Wolman disease represents the severe infantile end of the same LIPA deficiency spectrum,
      with markedly reduced or absent enzyme activity.
    gene: *id001
    evidence:
    - reference: PMID:28786388
      reference_title: 'Wolman''s disease and cholesteryl ester storage disorder: the phenotypic spectrum
        of lysosomal acid lipase deficiency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Lysosomal acid lipase deficiency is a rare, autosomal recessive condition caused by mutations
        in the gene encoding lysosomal acid lipase (LIPA) that result in reduced or absent activity of
        this essential enzyme.
      explanation: This review directly connects LIPA mutations to reduced or absent lysosomal acid lipase
        activity.

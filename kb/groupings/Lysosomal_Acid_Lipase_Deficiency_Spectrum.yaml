name: Lysosomal Acid Lipase Deficiency Spectrum
creation_date: '2026-11-20T21:58:18Z'
description: The lysosomal acid lipase deficiency spectrum spans severe infantile Wolman disease and the
  generally later-presenting cholesteryl ester storage disease phenotype.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
grouping_rationale: Both members affect the same lysosomal neutral-lipid hydrolase. This grouping organizes
  two already-curated clinical entities across a severity continuum; it does not assert distinct genes
  or a sharp molecular boundary. Keeping their existing entries preserves different onset and clinical-course
  descriptions while making the common disease spectrum explicit.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:278000
      label: Lysosomal acid lipase deficiency
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:278000 (cholesteryl ester storage
      disease) and OMIM:620151 (Wolman disease). These numbered concepts correspond to this explicit union.
      The mapping aligns the named series with its curated members, not the individual disease record
      sharing the series number.
membership_criteria:
- description: Each member annotates hepatomegaly and LIPA. This is a necessary disease-annotation check,
    not a patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality,
    and other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Hepatomegaly
        term:
          id: HP:0002240
          label: Hepatomegaly
    - criterion_predicate: HAS_GENE
      gene: &id001
        preferred_term: LIPA
        term:
          id: hgnc:6617
          label: LIPA
members:
- member: Cholesteryl Ester Storage Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Cholesteryl ester storage disease represents the generally later-presenting, less severe
      clinical presentation of the same LIPA deficiency spectrum.
    gene:
      preferred_term: LIPA
      term:
        id: hgnc:6617
        label: LIPA
    evidence:
    - reference: PMID:28786388
      reference_title: 'Wolman''s disease and cholesteryl ester storage disorder: the phenotypic spectrum
        of lysosomal acid lipase deficiency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Cholesteryl ester storage disorder arises later in life and is less severe, although the
        two diseases share many common features, including dyslipidaemia and transaminitis.
      explanation: The review directly distinguishes the later-presenting, less severe CESD phenotype
        from Wolman disease.
- member: Wolman Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Wolman disease represents the severe infantile presentation of the LIPA deficiency spectrum.
    gene: *id001
    evidence:
    - reference: PMID:28786388
      reference_title: 'Wolman''s disease and cholesteryl ester storage disorder: the phenotypic spectrum
        of lysosomal acid lipase deficiency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Wolman's disease is a severe disorder that presents during infancy
      explanation: The review directly identifies the severe infantile presentation that distinguishes
        Wolman disease.

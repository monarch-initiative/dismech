name: Neuroblastoma Predisposition Syndromes
creation_date: '2026-10-28T19:45:13Z'
description: >-
  Constitutional conditions, inherited, de novo or mosaic, whose entries record
  a neuroblastic tumour as a phenotype of the condition. Genetic predisposition
  to neuroblastoma is relatively rare, and only occasional patients have a
  syndrome associated with increased risk. The members differ in how central
  the tumour is to the condition. In ALK-related susceptibility the
  neuroblastic tumour is the defining manifestation. In congenital central
  hypoventilation syndrome it is one neural-crest complication of a PHOX2B
  disorder of autonomic control, with a risk that follows PHOX2B genotype. In
  Beckwith-Wiedemann syndrome and Costello syndrome it is one tumour within a
  broader childhood cancer predisposition, led by Wilms tumour and
  hepatoblastoma in the first and by rhabdomyosarcoma in the second, and in
  Beckwith-Wiedemann syndrome it is relatively enriched in the CDKN1C subgroup.
  In Weaver syndrome, an overgrowth syndrome, it is the malignancy most often
  reported. In BARD1-related cancer predisposition the association rests on
  case-control enrichment of rare germline loss-of-function variants among
  neuroblastoma patients, and in the DDX3X neurodevelopmental disorder on a few
  reported individuals whose significance is unresolved. No mechanism is common
  to all members: their genes act through receptor tyrosine kinase activation
  (ALK), a paired-like homeobox regulator of visceral reflex circuits (PHOX2B),
  11p15.5 imprinting and CDKN1C dosage, RAS-MAPK activation (HRAS), PRC2 histone
  methyltransferase deficiency (EZH2), BRCA1-BARD1 homologous recombination
  (BARD1) and DEAD-box RNA helicase function (DDX3X). Two of these routes
  converge: the ALK and Costello syndrome entries both record activated
  RAS-MAPK signalling.
  Seven further members joined once their entries recorded the phenotype.
  PHOX2B-related neuroblastic tumour susceptibility is the predisposition
  concept that congenital central hypoventilation syndrome's tumour risk
  belongs to, curated separately because MONDO files that term as a
  neuroblastoma susceptibility rather than as a ventilatory disorder, so
  those two members overlap in subject. In Noonan syndrome and
  neurofibromatosis type 1 the tumour sits in a broad RASopathy cancer
  spectrum, very rare in the first and disputed in the second. In Li-
  Fraumeni syndrome it is not a classic component tumour, and the reported
  risk attaches to the TP53 p.R337H founder allele rather than to the
  syndrome. In Sotos syndrome it sits behind sacrococcygeal teratoma within
  a low absolute tumour risk, and in Simpson-Golabi-Behmel syndrome type 1
  behind Wilms tumour and hepatoblastoma. In Fanconi anemia it is confined
  to the biallelic BRCA2 and PALB2 subtypes. The routes they add are
  neurofibromin loss and the RAS-pathway genes of Noonan syndrome, TP53
  tumour-suppressor loss, NSD1 and GPC3 haploinsufficiency in overgrowth,
  and failure of DNA interstrand crosslink repair (BRCA2, PALB2), so the
  members still share no common mechanism. Each member's differentiating
  mechanism now carries one quote from that member's own cited source.
grouping_basis:
- SHARED_PHENOTYPE
grouping_rationale: >-
  Grouped on a shared phenotype only: every member's entry records a
  neuroblastic tumour as a phenotype of the condition. It is not grouped on
  mechanism: no pathway is common to all members (ALK and HRAS activation both
  run through RAS-MAPK signalling in their entries), and the grouping asserts
  no shared route to the tumour. Nor is it a transcription of a
  surveillance guideline: membership does not grade the strength of the
  association, which ranges from the principal genetic cause of familial
  neuroblastoma (ALK) to a few reported individuals (DDX3X), and each member's
  differentiating mechanism says where it sits on that range. The members stay
  separate Disease entries because they are distinct diseases with their own
  causal genes or loci. Entries for the tumours themselves, such as Neuroblastoma
  and Ganglioneuroblastoma, describe a tumour rather than a predisposing
  condition and are not members. Common-variant susceptibility loci
  identified by genome-wide association are not syndromes and are out of scope;
  the discussion below records why MONDO's serial-numbered neuroblastoma
  susceptibility terms without a DisMech entry are not listed.
membership_criteria:
- description: >-
    A member is a constitutional (inherited, de novo or mosaic) condition whose
    entry records a neuroblastic tumour as a phenotype of the condition:
    Neuroblastic tumor (HP:0004376) or a descendant, which includes
    Neuroblastoma (HP:0003006) and Ganglioneuroblastoma (HP:0006747). NECESSARY
    and not sufficient. The recorded phenotype is required, but it does not by
    itself make an entry a member: the Neuroblastoma and Ganglioneuroblastoma
    entries describe the tumours themselves rather than a predisposing
    condition. Two features of the HPO hierarchy bear on the audit. HPO's
    definition of Neuroblastic tumor names ganglioneuroma, but its hierarchy
    files Ganglioneuroma (HP:0003005) under Neoplasm of the autonomic nervous
    system (HP:0030450), so an entry recording only ganglioneuroma would not
    satisfy this criterion; no current member does. The closure also contains
    Olfactory esthesioneuroblastoma (HP:0030068), which HPO places under
    Neuroblastoma although it arises from the olfactory epithelium rather than
    the sympathetic nervous system; no member relies on it.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_PHENOTYPE
    description: >-
      Neuroblastic tumor (HP:0004376) or a descendant, such as Neuroblastoma or
      Ganglioneuroblastoma, recorded as a phenotype of the condition.
      Ganglioneuroma (HP:0003005) lies outside this closure.
    phenotype_term:
      preferred_term: Neuroblastic tumor
      term:
        id: HP:0004376
        label: Neuroblastic tumor
  evidence:
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Genetic predisposition to neuroblastoma (NB) is relatively rare. Only 1% to 2% of patients have a family history of NB, 3% to 4% of cases present with bilateral or multifocal primary tumors, and occasional patients have syndromes that are associated with increased NB risk."
    explanation: >-
      The update from the 2023 AACR Childhood Cancer Predisposition Workshop
      opens its abstract by stating that genetic predisposition to neuroblastoma
      is relatively rare. Its next sentence gives the small fractions of
      patients who have a family history of neuroblastoma or who present with
      bilateral or multifocal primary tumours, and states that occasional
      patients have syndromes associated with increased neuroblastoma risk. The
      two sentences source the statement in the grouping's description that
      genetic predisposition to neuroblastoma is relatively rare and that only
      occasional patients have a syndrome associated with increased risk. The
      fractions count patients with a family history and patients with bilateral
      or multifocal tumours, not patients found to carry a germline variant, so
      the rarity statement rests on the first sentence rather than on those
      figures.
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Previously, a germline pathogenic variant (GPV) in PHOX2B was associated with Hirschsprung disease and congenital central hypoventilation syndrome. Recently, certain GPVs were shown to be responsible for congenital central hypoventilation syndrome and NB predisposition."
    explanation: >-
      The same update states that germline pathogenic variants in PHOX2B,
      first associated with Hirschsprung disease and congenital central
      hypoventilation syndrome, include some that are responsible for both
      congenital central hypoventilation syndrome and neuroblastoma
      predisposition. This places the Congenital Central Hypoventilation
      Syndrome member in the class the grouping indexes.
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Also, several groups determined that activating GPVs in ALK accounted for a substantial number of familial NB."
    explanation: >-
      The same update states that activating germline pathogenic variants in
      ALK account for a substantial number of familial neuroblastoma cases, the
      predisposition curated as the ALK-Related Neuroblastic Tumor
      Susceptibility member.
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Finally, there are additional genes and cancer predisposition syndromes in which NB occurs with greater frequency or that have been associated with NB based on genome-wide association studies."
    explanation: >-
      Beyond PHOX2B and ALK, the update names additional cancer predisposition
      syndromes in which neuroblastoma occurs with greater frequency. The
      grouping indexes the DisMech entries in that class but admits members by
      recorded phenotype rather than by strength of association, so it also
      lists the DDX3X neurodevelopmental disorder, whose tumour risk is
      unresolved, and it counts ganglioneuroblastoma as well as neuroblastoma.
      The sentence's second basis, association in genome-wide association
      studies, is out of scope (see the discussion).
members:
- member: ALK-Related Neuroblastic Tumor Susceptibility
  member_type: DISEASE
  disease_term:
    preferred_term: neuroblastoma, susceptibility to, 3
    term:
      id: MONDO:0013083
      label: neuroblastoma, susceptibility to, 3
  differentiating_mechanisms:
  - description: >-
      The neuroblastic tumour is the defining manifestation rather than one
      feature among several. A heterozygous germline activating variant in the
      ALK tyrosine kinase domain predisposes to neuroblastoma,
      ganglioneuroblastoma and ganglioneuroma, with risk highest in infancy, a
      tendency to multifocal and bilateral primary tumours, and incomplete
      penetrance. It is the principal genetic cause of familial neuroblastoma.
      The germline variant is necessary but not sufficient: transformation needs
      a cooperating somatic lesion.
    gene:
      preferred_term: ALK
      term:
        id: hgnc:427
        label: ALK
    evidence:
    - reference: PMID:20301782
      reference_title: "ALK-Related Neuroblastic Tumor Susceptibility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "ALK-related neuroblastic tumor susceptibility is characterized by increased risk for neuroblastic tumors including neuroblastomas, ganglioneuroblastomas, and ganglioneuromas."
      explanation: >-
        The GeneReviews chapter's own one-sentence characterisation of the
        syndrome: an increased risk for neuroblastic tumours, naming
        neuroblastoma, ganglioneuroblastoma and ganglioneuroma. It sources the
        part of this differentiating mechanism that all three tumour types of the
        neuroblastic spectrum occur. That the tumour is the defining manifestation
        rather than one feature among several is a reading of the chapter's scope,
        not of this sentence.
- member: BARD1-related Cancer Predisposition
  member_type: DISEASE
  disease_term:
    preferred_term: BARD1-related cancer predisposition
    term:
      id: MONDO:0700267
      label: BARD1-related cancer predisposition
  differentiating_mechanisms:
  - description: >-
      A homologous-recombination predisposition whose established manifestation
      is female breast cancer. Its neuroblastoma association rests on
      case-control enrichment of rare germline pathogenic or likely pathogenic
      BARD1 variants and BARD1-disrupting copy-number variants in neuroblastoma
      patients, which ClinGen lumps into this gene-disease entity; the entry
      records that absolute childhood penetrance is not reported. Common BARD1
      polymorphisms associated with high-risk neuroblastoma by genome-wide
      association are a separate, polygenic signal and are not what makes this
      entry a member.
    gene:
      preferred_term: BARD1
      term:
        id: hgnc:952
        label: BARD1
    evidence:
    - reference: PMID:37688579
      reference_title: "Germline pathogenic variants in neuroblastoma patients are enriched in BARD1 and predict worse survival."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "BARD1 harbored the most statistically significant enrichment of pathogenic or likely pathogenic variants (OR = 32.30, 95% CI = 6.44 to 310.35)."
      explanation: >-
        In a germline analysis of neuroblastoma patients, BARD1 carried the most
        significant enrichment of pathogenic or likely pathogenic variants of any
        cancer-predisposition gene tested. It sources the distinguishing claim
        that this member's neuroblastoma association rests on case-control
        enrichment of rare germline variants, not on a described tumour spectrum.
        An odds ratio in a case-control comparison is not a penetrance, which is
        why the member's entry records that absolute childhood penetrance is not
        reported.
- member: Beckwith-Wiedemann Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Beckwith-Wiedemann syndrome
    term:
      id: MONDO:0007534
      label: Beckwith-Wiedemann syndrome
  differentiating_mechanisms:
  - description: >-
      An 11p15.5 imprinting disorder, often mosaic, whose embryonal tumour risk
      is led by Wilms tumour and hepatoblastoma. Neuroblastoma is less common;
      it has been reported across all BWS molecular subgroups and is relatively
      enriched in the subgroup with maternal CDKN1C loss-of-function variants
      (the CDKN1C subtype).
    gene:
      preferred_term: CDKN1C
      term:
        id: hgnc:1786
        label: CDKN1C
    evidence:
    - reference: PMID:41126215
      reference_title: "Beckwith-Wiedemann spectrum (BWSp): an update on diagnosis, management, and follow-up from the scientific committee of the Italian BWSp association."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Neuroblastoma (NB) is reported across all BWSp molecular subgroups, but most frequently associated with CDKN1C loss-of-function variants."
      explanation: >-
        The 2025 update from the scientific committee of the Italian BWSp
        association states that neuroblastoma is reported across all BWSp
        molecular subgroups and is most frequently associated with CDKN1C
        loss-of-function variants. It is the committee's synthesis of published
        work, not data of its own. The sentence supports a relative
        enrichment in the CDKN1C subgroup; it does not say what share of all
        BWS neuroblastomas falls in that subgroup.
- member: Congenital Central Hypoventilation Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: central hypoventilation syndrome, congenital
    term:
      id: MONDO:0800031
      label: central hypoventilation syndrome, congenital
  differentiating_mechanisms:
  - description: >-
      A disorder of autonomic control, almost always caused by a de novo
      heterozygous PHOX2B mutation, in which neuroblastic tumours are one of the
      neural-crest complications alongside Hirschsprung disease. The tumour risk
      follows PHOX2B genotype: it is concentrated in carriers of non-polyalanine
      repeat mutations (missense, nonsense or frameshift) and much lower, though
      not absent, with polyalanine repeat expansions, so tumour screening is
      directed by genotype rather than applied to every patient.
    gene:
      preferred_term: PHOX2B
      term:
        id: hgnc:9143
        label: PHOX2B
    evidence:
    - reference: PMID:15657873
      reference_title: "PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "analysis of genotype-phenotype interactions strongly supports the contention that patients with CCHS who develop malignant TSNS will harbor either a missense or a frameshift heterozygous mutation of the PHOX2B gene."
      explanation: >-
        The genotype-phenotype conclusion of the series that established tumour
        prediction in this syndrome: patients with congenital central
        hypoventilation syndrome who develop a malignant tumour of the sympathetic
        nervous system will carry either a missense or a frameshift PHOX2B
        mutation. It sources the distinguishing claim that screening here is
        directed by genotype rather than applied to every patient. It concerns
        malignant tumours, so it does not speak to the differentiated
        ganglioneuromas seen with polyalanine expansions, and the separate
        PHOX2B-Related Neuroblastic Tumor Susceptibility member quotes this
        paper's counts for that contrast.
- member: Costello Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Costello syndrome
    term:
      id: MONDO:0009026
      label: Costello syndrome
  differentiating_mechanisms:
  - description: >-
      A RASopathy caused by heterozygous germline gain-of-function HRAS
      variants, with constitutive RAS-MAPK signalling and a childhood cancer
      predisposition in which rhabdomyosarcoma is the commonest tumour.
      Neuroblastoma is a rarer component that arises in young children, and the
      entry records it as very rare.
    gene:
      preferred_term: HRAS
      term:
        id: hgnc:5173
        label: HRAS
    evidence:
    - reference: PMID:36966234
      reference_title: "Cancer in Costello syndrome: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "The SIR for neuroblastoma was 70 at ages 0-4, after which no more cases were reported."
      explanation: >-
        A systematic review and meta-analysis of cancer in Costello syndrome
        reports a standardised incidence ratio for neuroblastoma of 70 at ages 0
        to 4, with no further cases at older ages. It sources the distinguishing
        claim that neuroblastoma here arises in young children. The age ceiling is
        an absence of reported cases in a published-case review rather than a
        measured fall in risk.
- member: Fanconi_Anemia
  member_type: DISEASE
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  differentiating_mechanisms:
  - description: >-
      A DNA interstrand crosslink repair disorder whose neuroblastoma risk is
      not spread across its complementation groups but confined to the two most
      severe: biallelic BRCA2 (FA-D1) and biallelic PALB2 (FA-N, hgnc:26144),
      which share an early-onset embryonal tumour spectrum. In a series pooling
      published cases with NCI cohort cases, neuroblastoma was the first or only
      cancer in 4 of 66 patients with FANCD1 variants and 1 of 16 with FANCN
      variants, and every neuroblastoma in both genotypes arose before age five.
      The entry records the phenotype twice, scoped to its FA-D1 and FA-N
      subtypes, so the condition is a member through those two subtypes rather
      than across Fanconi anemia as a whole.
    gene:
      preferred_term: BRCA2
      term:
        id: hgnc:1101
        label: BRCA2
    evidence:
    - reference: PMID:34687993
      reference_title: "Genotype-cancer association in patients with Fanconi anemia due to pathogenic variants in FANCD1 (BRCA2) or FANCN (PALB2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Brain tumor, neuroblastoma and Wilms tumor were reported almost exclusively in patients with FANCD1 or FANCN variants (Table 2A)."
      explanation: >-
        A genotype-cancer association study of Fanconi anemia reports that brain
        tumour, neuroblastoma and Wilms tumour were seen almost exclusively in
        patients with FANCD1 or FANCN variants. It is what makes this member's
        risk a property of two subtypes rather than of Fanconi anemia generally,
        which is why the member is listed as a disease with the restriction stated
        here, as Beckwith-Wiedemann syndrome is listed with its CDKN1C enrichment.
        The sentence gives no absolute penetrance for either genotype.
- member: Intellectual Disability X-linked 102
  member_type: DISEASE
  display_name: DDX3X-related neurodevelopmental disorder (intellectual disability, X-linked 102)
  disease_term:
    preferred_term: intellectual disability, X-linked 102
    term:
      id: MONDO:0010497
      label: intellectual disability, X-linked 102
  differentiating_mechanisms:
  - description: >-
      The member with the weakest association. In this DDX3X-related
      neurodevelopmental disorder neuroblastoma has been observed in a few
      individuals, and the entry records that whether germline DDX3X confers a
      real tumour risk is unresolved, because the numbers are small and the
      observations incidental. It is listed because its entry records the
      phenotype.
    gene:
      preferred_term: DDX3X
      term:
        id: hgnc:2745
        label: DDX3X
    evidence:
    - reference: PMID:32852922
      reference_title: "DDX3X-Related Neurodevelopmental Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neuroblastoma has been observed in three individuals."
      explanation: >-
        The GeneReviews chapter records neuroblastoma in three individuals with
        this disorder. It is the whole of the evidence that makes this the member
        with the weakest association: a count of individuals, with no denominator,
        no comparison with population incidence and no statement that the risk is
        raised.
- member: Li-Fraumeni Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Li-Fraumeni syndrome
    term:
      id: MONDO:0018875
      label: Li-Fraumeni syndrome
  differentiating_mechanisms:
  - description: >-
      A TP53 tumour-suppressor predisposition in which neuroblastoma is not one
      of the classic component tumours. The reported risk attaches to one allele
      rather than to the syndrome: p.R337H, a founder variant unusually common
      in southern and southeastern Brazil, was carried by 7 of 83 neuroblastoma
      patients tested there, some 28 to 42 times its frequency in people from
      the same region not selected by cancer diagnosis. Surveillance for
      neuroblastoma is recommended for those carriers rather than for Li-
      Fraumeni syndrome at large.
    gene:
      preferred_term: TP53
      term:
        id: hgnc:11998
        label: TP53
    evidence:
    - reference: PMID:26452166
      reference_title: "Occurrence of Neuroblastoma among TP53 p.R337H Carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Seven out of 83 patients tested (8.4%) were carriers of 337H allele. This frequency is about 28 to 42 times higher than the estimated 0.2 to 0.3% frequency for p.R337H in people not selected by cancer diagnosis from our region ... suggesting that carriers of the p.R337H are at increased risk of developing NB than the general population."
      explanation: >-
        The study tested neuroblastoma patients from the Brazilian region where
        the TP53 p.R337H founder allele is common and found 7 of 83 carried it, a
        frequency it puts at 28 to 42 times the regional background in people not
        selected by cancer diagnosis, and concludes that carriers are at increased
        neuroblastoma risk. It sources this member's distinguishing feature: the
        association runs through one allele in one population, not through Li-
        Fraumeni syndrome as a class. The comparison is with a regional background
        frequency, so it is not a penetrance estimate.
- member: Neurofibromatosis Type 1
  member_type: DISEASE
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  differentiating_mechanisms:
  - description: >-
      The member whose association is actively disputed rather than merely thin.
      Neuroblastic tumours have been reported in children with NF1, including
      eight among the patients of the Italian neuroblastoma registry, 0.2 per
      cent of those registered; but because both conditions are common, the 2017
      AACR predisposition review judges that the co-occurrences may be
      coincidence and that the risk may not be raised enough to warrant
      surveillance. A later AACR surveillance update nonetheless lists
      neuroblastoma among cancers that are rare in NF1 yet develop early in
      childhood at higher frequencies than in the general population. The
      member's own entry records both readings, which is why it is listed here
      on its recorded phenotype and not on an agreed risk.
    gene:
      preferred_term: NF1
      term:
        id: hgnc:7765
        label: NF1
    evidence:
    - reference: PMID:28674118
      reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Given the relative prevalence of NF1 and NB, the reported cases with both diagnoses may be attributed to fortuitous coincidence, so risks for NB may not be increased sufficiently in individuals with NF1 to warrant surveillance (99)."
      explanation: >-
        The 2017 AACR Childhood Cancer Predisposition Workshop review argues that,
        given how common neurofibromatosis type 1 and neuroblastoma each are,
        cases carrying both diagnoses may be coincidental, and that the
        neuroblastoma risk in NF1 may not be raised enough to warrant
        surveillance. It is cited here for the claim this member is distinguished
        by, that the association is unsettled. The member's own entry grades the
        same sentence REFUTE, because there the claim it bears on is that NF1
        predisposes to neuroblastoma; supports is relative to the claim, while the
        evidence type the sentence describes is unchanged.
- member: Noonan Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  differentiating_mechanisms:
  - description: >-
      A genetically heterogeneous RASopathy, most often caused by PTPN11
      variants, whose childhood cancer risk is raised about eight-fold over the
      general population across a broad spectrum that includes neuroblastoma
      alongside myeloid and lymphoblastic leukaemia, rhabdomyosarcoma and
      glioma. Neuroblastoma itself is very rare: one case among the 632 people
      in the combined Noonan syndrome group of a German registry-matching study.
      The 2024 AACR surveillance update judges the absolute risk for non-
      haematological malignancy too low for radiological or laboratory
      surveillance and recommends only that families be taught the signs, and it
      names Costello syndrome as the only RASopathy for which it recommends
      neuroblastoma screening. That is what separates this member from the
      Costello Syndrome member, which shares its pathway.
    gene:
      preferred_term: PTPN11
      term:
        id: hgnc:9644
        label: PTPN11
    evidence:
    - reference: PMID:39196581
      reference_title: "Update on Pediatric Cancer Surveillance Recommendations for Patients with Neurofibromatosis Type 1, Noonan Syndrome, CBL Syndrome, Costello Syndrome, and Related RASopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "The relative childhood cancer risk in NS is estimated to be increased approximately 8-fold over the general population(5). Due to the low baseline cancer risk in children, the high relative risk leads to a moderate absolute cancer risk(5). The spectrum of cancer types is broad and includes myeloid and lymphoblastic leukemia, RMS, NB, and glioma, among others(2,4,5,78-81)."
      explanation: >-
        The 2024 AACR surveillance update puts the relative childhood cancer risk
        in Noonan syndrome at about eight-fold over the general population, notes
        that the low baseline risk in children makes that a moderate absolute
        risk, and lists neuroblastoma in the spectrum of cancer types alongside
        leukaemia, rhabdomyosarcoma and glioma. It places this member in the class
        the grouping indexes and sources the breadth of the spectrum that the
        tumour sits in. It is the update's synthesis of cited work, not data of
        its own, and it gives no neuroblastoma-specific frequency.
- member: PHOX2B-Related Neuroblastic Tumor Susceptibility
  member_type: DISEASE
  disease_term:
    preferred_term: neuroblastoma, susceptibility to, 2
    term:
      id: MONDO:0700041
      label: neuroblastoma, susceptibility to, 2
  differentiating_mechanisms:
  - description: >-
      The tumour-predisposition concept itself, where the Congenital Central
      Hypoventilation Syndrome member is the disorder of autonomic control in
      which neuroblastic tumours are one neural-crest complication. Both members
      are PHOX2B and the two entries overlap in subject; what separates them is
      which concept the entry is about, MONDO filing this term as a
      neuroblastoma susceptibility rather than as a ventilatory disorder. Risk
      is set by variant class rather than by the presence of hypoventilation:
      about 45 per cent for non-polyalanine repeat mutations against about 1 to
      2 per cent for polyalanine expansions, from 6 of 13 patients with a
      missense or frameshift variant against 2 of 161 with an in-frame expansion
      in the original genotyped series.
    gene:
      preferred_term: PHOX2B
      term:
        id: hgnc:9143
        label: PHOX2B
    evidence:
    - reference: PMID:15657873
      reference_title: "PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Indeed, an invasive tumor (neuroblastoma) was diagnosed in 6 (46%) of 13 patients harboring either a missense or a frameshift mutation, whereas a differentiated tumor (ganglioneuroma) was diagnosed in only 2 (1.24%) of 161 patients harboring an in-frame duplication leading to an expansion of +9 alanines in one and +13 in the other."
      explanation: >-
        The genotyped series behind the variant-class split: an invasive
        neuroblastoma in 6 of 13 patients carrying a missense or frameshift PHOX2B
        mutation, against a differentiated ganglioneuroma in 2 of 161 carrying an
        in-frame duplication. It sources the distinguishing claim that this
        member's risk is graded by variant class. The cohort was assembled as
        congenital central hypoventilation syndrome patients, so the figures
        describe tumour risk by PHOX2B genotype within that population rather than
        in carriers ascertained any other way.
- member: Simpson-Golabi-Behmel Syndrome Type 1
  member_type: DISEASE
  disease_term:
    preferred_term: Simpson-Golabi-Behmel syndrome type 1
    term:
      id: MONDO:0020602
      label: Simpson-Golabi-Behmel syndrome type 1
  differentiating_mechanisms:
  - description: >-
      An X-linked overgrowth syndrome caused by GPC3 loss of function whose
      embryonal tumour risk is led by Wilms tumour and hepatoblastoma, each
      reported in about 5 per cent of cases, with every other tumour type in
      under 1 per cent. Neuroblastoma, including adrenal neuroblastoma, sits in
      that tail as individual published cases rather than as a cohort frequency.
      It shares with the Beckwith-Wiedemann Syndrome member both the overgrowth
      phenotype and a Wilms-led spectrum in which neuroblastoma is the rarer
      component, and differs from it in acting through a single X-linked gene
      rather than through 11p15.5 imprinting.
    gene:
      preferred_term: GPC3
      term:
        id: hgnc:4451
        label: GPC3
    evidence:
    - reference: PMID:20301398
      reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Affected individuals are at increased risk for embryonal tumors including Wilms tumor, hepatoblastoma, adrenal neuroblastoma, gonadoblastoma, hepatocellular carcinoma, and medulloblastoma."
      explanation: >-
        The GeneReviews chapter states that affected individuals are at increased
        risk for embryonal tumours and names adrenal neuroblastoma among them,
        which places this member in the class the grouping indexes. The sentence
        lists the tumours without ranking them or giving frequencies; the Wilms-
        led ordering and the under-1-per-cent tail come from the cohort figures
        cited in the member's own entry.
- member: Sotos Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Sotos syndrome
    term:
      id: MONDO:0019349
      label: Sotos syndrome
  differentiating_mechanisms:
  - description: >-
      An overgrowth and intellectual disability syndrome caused by NSD1
      haploinsufficiency, in which neuroblastoma is one of a scatter of tumours
      reported in small numbers: two individuals in the GeneReviews count, and
      one neuroblastoma beside one presacral ganglioneuroma among children with
      confirmed NSD1 mutations in the largest series. GeneReviews gives the
      absolute risk of sacrococcygeal teratoma and neuroblastoma together as
      low, about 1 per cent, and considers it unclear whether such tumours are
      specific to Sotos syndrome or coincidental. Like the Weaver Syndrome
      member it is an overgrowth disorder of a chromatin-modifying gene, but its
      reports are fewer and no figure separates neuroblastoma from
      sacrococcygeal teratoma.
    gene:
      preferred_term: NSD1
      term:
        id: hgnc:14234
        label: NSD1
    evidence:
    - reference: PMID:17825104
      reference_title: "Sotos syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "In the large series of Tatton-Brown, three saccrococcygeal teratomas, one presacral ganglioneuroma one neuroblastoma and one acute lymphocytic leukemia occurred in children with confirmed NSD1 mutation [12]."
      explanation: >-
        A review of Sotos syndrome reports the tumours seen in the largest series
        of children with a confirmed NSD1 mutation: three sacrococcygeal
        teratomas, one presacral ganglioneuroma, one neuroblastoma and one acute
        lymphocytic leukaemia. It sources the small absolute numbers that
        distinguish this member, and shows the neuroblastoma arising in
        molecularly confirmed patients rather than in a clinically defined group.
        It is the review's account of another group's series, not data of its own,
        and the spelling of sacrococcygeal is the source's.
- member: Weaver Syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Weaver syndrome
    term:
      id: MONDO:0010193
      label: Weaver syndrome
  differentiating_mechanisms:
  - description: >-
      An overgrowth and intellectual disability syndrome caused by heterozygous
      germline EZH2 variants that reduce PRC2 histone methyltransferase
      activity. Neuroblastoma is the malignancy most often reported and occurs
      at increased frequency, but the reported cases are few, and no other
      malignancy is known to occur at increased frequency.
    gene:
      preferred_term: EZH2
      term:
        id: hgnc:3527
        label: EZH2
    evidence:
    - reference: PMID:23865096
      reference_title: "EZH2-Related Overgrowth."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neuroblastoma occurs at an increased frequency in individuals with a heterozygous EZH2 pathogenic variant."
      explanation: >-
        The GeneReviews chapter states that neuroblastoma occurs at an increased
        frequency in individuals with a heterozygous EZH2 pathogenic variant. It
        sources the distinguishing claim that the tumour occurs at increased
        frequency here, which separates this member from those whose entries
        record only reported cases. The sentence gives no frequency and no
        denominator.
discussions:
- discussion_id: neuroblastoma_susceptibility_terms_without_entries
  prompt: >-
    Should MONDO's serial-numbered neuroblastoma susceptibility terms that have
    no DisMech entry be curated and added as members?
  kind: CURATION_TODO
  status: OPEN
  rationale: >-
    MONDO files seven neuroblastoma susceptibility terms directly under
    hereditary neoplastic syndrome (MONDO:0015356). Susceptibility to 3
    (MONDO:0013083, ALK) is curated as ALK-Related Neuroblastic Tumor
    Susceptibility and is a member. The other six have no entry, and they are
    not alike. Susceptibility to 2 (MONDO:0700041), which MONDO ties to germline
    mutation in PHOX2B, is a Mendelian predisposition; it is now curated as
    PHOX2B-Related Neuroblastic Tumor Susceptibility and is a member. Susceptibility to 4 to 7 (MONDO:0013084, MONDO:0013085,
    MONDO:0013086 and MONDO:0014774) record no causal gene in MONDO. They
    cross-reference OMIM:613015, OMIM:613016, OMIM:613017 and OMIM:616792, which
    NCBI Gene records as phenotype-only loci at 6p22, 2q35, 1q21.1 and 11p15
    (Gene IDs 100306937, 100306938, 100306939 and 107181289). Those are the
    bands of susceptibility loci found by genome-wide association studies:
    common variation at 6p22 (PMID:18463370), common variation in BARD1 at 2q35
    (PMID:19412175), a common copy-number variant at 1q21.1 (PMID:19536264) and
    common polymorphisms at the LMO1 locus at 11p15.4 (PMID:21124317). A
    susceptibility locus found by association is a risk locus rather than a
    Mendelian predisposition syndrome with its own pathogenic variant class and
    phenotype spectrum, so these four are not
    expected to become Disease entries or members. The 2q35 signal in particular
    is kept apart from the BARD1-related Cancer Predisposition member, which is
    defined by rare loss-of-function variants. Susceptibility to 1
    (MONDO:0009741), which MONDO ties to germline mutation in KIF1B, is
    undecided. A re-analysis of the family in which pheochromocytoma
    predisposition had been reported to segregate with a germline KIF1B variant
    linked that heritability to a germline MAX variant instead, and left the
    KIF1B variant only a possible contributor to the proband's neuroblastoma, so
    that family does not establish germline KIF1B predisposition to
    neuroblastoma. The re-analysis concerns one family and does not revisit
    other reports of KIF1B variants in neuroblastoma. The term should be added
    only if an entry is curated and records a neuroblastic tumour; its curation
    stub records that re-analysis and is marked BLOCKED, with its entry type
    still undecided.
  evidence:
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Previously, a germline pathogenic variant (GPV) in PHOX2B was associated with Hirschsprung disease and congenital central hypoventilation syndrome. Recently, certain GPVs were shown to be responsible for congenital central hypoventilation syndrome and NB predisposition."
    explanation: >-
      The 2023 AACR update states that certain germline pathogenic variants in
      PHOX2B are responsible for congenital central hypoventilation syndrome and
      neuroblastoma predisposition: a predisposition carried by germline
      variants in a single gene, unlike the association-study loci below. The
      quote does not name a MONDO term; matching it to neuroblastoma
      susceptibility term 2 rests on MONDO's own link of that term to germline
      mutation in PHOX2B.
  - reference: PMID:18463370
    reference_title: "Chromosome 6p22 locus associated with clinically aggressive neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "A common genetic variation at chromosome band 6p22 is associated with susceptibility to neuroblastoma."
    explanation: >-
      The study's own conclusion: a case-control genome-wide association study
      with independent replication found that common genetic variation at
      chromosome band 6p22 is associated with neuroblastoma susceptibility.
      MONDO's neuroblastoma susceptibility term 4 cross-references OMIM:613015,
      which NCBI Gene places at the same band. Two steps go beyond the quote:
      matching the term to this signal, which rests on the shared band, and
      reading a common susceptibility variant as a risk locus rather than a
      Mendelian predisposition syndrome. The study design comes from the
      abstract's methods rather than from the quoted conclusion.
  - reference: PMID:19412175
    reference_title: "Common variations in BARD1 influence susceptibility to high-risk neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "These data show that common variation in BARD1 contributes to the etiology of the aggressive and most clinically relevant subset of human neuroblastoma."
    explanation: >-
      The study's own conclusion: common variation in BARD1 contributes to
      high-risk neuroblastoma. Its abstract places the associated SNPs at 2q35
      within the BARD1 locus, the band at which NCBI Gene places OMIM:613016,
      the cross-reference of MONDO's neuroblastoma susceptibility term 5. The
      quote establishes that the 2q35 signal is common variation; matching the
      term to it rests on the shared band.
  - reference: PMID:19536264
    reference_title: "Copy number variation at 1q21.1 associated with neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Here we describe the identification of a common CNV at chromosome 1q21.1 associated with neuroblastoma in the discovery set, which was confirmed in both replication sets."
    explanation: >-
      A genome-wide association study of copy number variation reports a common
      copy number variant at 1q21.1 associated with neuroblastoma, confirmed in
      two replication sets. NCBI Gene places OMIM:613017, the cross-reference
      of MONDO's neuroblastoma susceptibility term 6, at the same band, so
      matching the term to this signal rests on the shared band.
  - reference: PMID:21124317
    reference_title: "Integrative genomics identifies LMO1 as a neuroblastoma oncogene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "These data show that common polymorphisms at the LMO1 locus are strongly associated with susceptibility to developing neuroblastoma, but also may influence the likelihood of further somatic alterations at this locus, leading to malignant progression."
    explanation: >-
      The study's own conclusion: common polymorphisms at the LMO1 locus are
      associated with neuroblastoma susceptibility. Its abstract places LMO1 at
      11p15.4, within the 11p15 band at which NCBI Gene places OMIM:616792, the
      cross-reference of MONDO's neuroblastoma susceptibility term 7, so
      matching the term to this signal rests on the shared band. The second
      clause, on somatic alterations at the locus, is not what the item is
      cited for.
  - reference: PMID:21124317
    reference_title: "Integrative genomics identifies LMO1 as a neuroblastoma oncogene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "We then examined each of the most significant SNPs from the 2q35, 6p22, 11p15.4 susceptibility loci and the 1q21.1 copy number variation. However, we did not find evidence for epistasis (Supplementary Tables 3 and 4), indicating that these susceptibility loci increase disease risk independently."
    explanation: >-
      In the results of an expanded neuroblastoma genome-wide association study,
      the authors examine the most significant SNPs from the 2q35, 6p22 and
      11p15.4 susceptibility loci and the 1q21.1 copy number variation, find no
      epistasis, and conclude that these loci increase disease risk
      independently. The passage is cited for how it treats the four bands: as
      separate risk-raising susceptibility loci, each represented by its most
      significant association SNPs or, at 1q21.1, a copy number variation. They
      are the bands at which NCBI Gene places the OMIM entries that MONDO's
      neuroblastoma susceptibility terms 4 to 7 cross-reference: OMIM:613015 at
      6p22, OMIM:613016 at 2q35, OMIM:613017 at 1q21.1 and OMIM:616792 at 11p15.
      The quote names no MONDO or OMIM term and does not itself say the variants
      are common, and the no-epistasis result says nothing about whether a locus
      is Mendelian, so the support is indirect.
  - reference: PMID:33112832
    reference_title: "Genetic predisposition to neural crest-derived tumors: revisiting the role of KIF1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "In this family, the heritability of PCC is linked to the MAX germline variant and not to the KIF1B germline variant which, however, may have contributed to the occurrence of neuroblastoma (NB) in the proband."
    explanation: >-
      The authors re-analysed the family they had previously described, in which
      pheochromocytoma predisposition segregated with a germline KIF1B variant,
      using a germline multi-gene panel, exome sequencing and tumour DNA
      analysis. Their conclusion links the family's inherited pheochromocytoma
      risk to a germline MAX variant rather than to KIF1B. The MAX variant is
      itself of unknown significance, and the attribution rests mainly on loss
      of the wild-type MAX allele in the bilateral pheochromocytomas of the
      proband's brother, who does not carry the KIF1B variant. For neuroblastoma
      the authors say only that the KIF1B variant may have contributed in the
      proband, so this family does not establish germline KIF1B predisposition
      to neuroblastoma. The finding covers this one family and does not revisit
      other reports of KIF1B variants in neuroblastoma.
notes: >-
  Created as a single index of the constitutional conditions in DisMech that
  record neuroblastic tumours, following the 2023 AACR Childhood Cancer
  Predisposition Workshop update on neuroblastoma predisposition
  (PMID:38860978). MONDO has no class for this union: OLS searches of MONDO on
  28 October 2026 returned no result for "familial neuroblastoma" and only
  MONDO:0700267 BARD1-related cancer predisposition for "hereditary
  neuroblastoma" and for "neuroblastoma predisposition", so no MONDO mapping is
  recorded.
  All six conditions held back when this grouping was created are now
  members. Noonan Syndrome, Neurofibromatosis Type 1, Sotos Syndrome,
  Simpson-Golabi-Behmel Syndrome Type 1 and Fanconi_Anemia each had a
  neuroblastoma phenotype curated with evidence after the grouping was
  written, and Li-Fraumeni Syndrome and PHOX2B-Related Neuroblastic Tumor
  Susceptibility arrived with the entries that record them. Fanconi anemia
  is listed as a disease rather than by subtype, as Beckwith-Wiedemann
  Syndrome is, with its FA-D1 and FA-N restriction recorded in the
  differentiating mechanism. The literature behind these members is still
  uneven, and each differentiating mechanism says where its member sits. The
  2017 AACR workshop paper (PMID:28674118)
  reports neuroblastoma in Li-Fraumeni syndrome mainly with germline TP53
  p.R337H, a variant associated with the high incidence of childhood
  adrenocortical tumours and choroid plexus carcinoma in southern and
  southeastern Brazil (PMID:26452166), and recommends surveillance for those
  carriers although neuroblastoma is not generally considered a classic
  Li-Fraumeni tumour. The same paper says that reported cases of neuroblastoma
  with neurofibromatosis type 1 may be coincidental, with a risk perhaps not
  raised enough to warrant surveillance, and that neuroblastoma may be frequent
  enough to warrant surveillance in perhaps some forms of Noonan syndrome,
  although Costello syndrome is the only RASopathy for which it recommends
  screening. Multiple Endocrine Neoplasia Type 2 binds Ganglioneuroma
  (HP:0003005) for two MEN2B features, its mucosal neuromas and intestinal
  ganglioneuromatosis, and that term lies outside this criterion's closure.

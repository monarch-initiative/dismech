name: Heavy Metal Poisoning
display_name: Heavy metal poisoning (clinical toxicology set)
creation_date: '2026-11-26T00:00:00Z'
description: >-
  Heavy metal poisoning is the clinical-toxicology category of acquired systemic
  poisonings caused by toxic exposure to a heavy metal or metalloid. This
  grouping is a curated union over the already-distinct dismech entries for the
  toxic metals handled as this class - lead, arsenic, mercury, cadmium,
  thallium, iron, and manganese - which are grouped together by long-standing
  clinical and regulatory convention (the "heavy metals" panel and priority
  lists) rather than by any single shared mechanism. They are deliberately kept
  as separate Disease entries because each metal has distinct target organs,
  molecular mechanisms, and antidotal therapy: lead inhibits heme-synthesis
  enzymes, arsenic binds vicinal thiols and poisons pyruvate dehydrogenase,
  mercury is neurotoxic in a manner that depends on its chemical form, cadmium
  accumulates in and injures the renal proximal tubule, thallium enters cells as
  a potassium mimic, iron injures the gut corrosively and the circulation
  oxidatively, and manganese accumulates in the basal ganglia. Cesium is
  evaluated and excluded below.
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  The axis is clinical and nosological convention, not a shared mechanism. In
  clinical toxicology the toxic heavy metals and metalloids are handled as one
  diagnostic and management class - screened on common heavy-metal panels and
  reported together on regulatory priority lists - even though they injure the
  body by unrelated routes and need different antidotes. The members stay
  separate entries because they reach that injury by different routes: lead
  through delta-aminolevulinic acid dehydratase and ferrochelatase inhibition;
  arsenic through vicinal-thiol binding and pyruvate dehydrogenase inhibition,
  with its own methylation toxicokinetics; mercury through organic-methylmercury
  central-nervous-system toxicity; cadmium through metallothionein-mediated
  renal proximal tubular accumulation; thallium through potassium mimicry and
  keratin affinity; iron through direct corrosive gastrointestinal injury and
  non-transferrin-bound oxidative injury; and manganese through basal-ganglia
  accumulation and a levodopa-resistant extrapyramidal syndrome. No single
  Disease entry could assert one causal graph over these divergent chains, and
  the schema carries no subtype discriminator that would scope them within one
  entry, so the explicit union is the correct representation. The members differ
  even in the class of decorporation agent they respond to - thiol chelators for
  lead, arsenic, and mercury, deferoxamine for iron, Prussian blue ion exchange
  for thallium - so being chelatable is not a defining criterion of membership.
  Arsenic is a metalloid but is grouped with the heavy metals by universal
  toxicological convention.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0023305
      label: heavy metal poisoning
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept is the same clinical concept MONDO names "heavy metal
      poisoning", but the two extents diverge, so closeMatch records the
      correspondence without asserting that either subsumes the other.
      exactMatch and narrowMatch would both claim every member descends from
      MONDO:0023305, which most members do not: in the November 2026 OLS MONDO
      hierarchy only thallium poisoning (MONDO:0041996) and iron poisoning
      (MONDO:0800385) are is-a children of MONDO:0023305, while lead poisoning
      (MONDO:0018019), mercury poisoning (MONDO:0018020), cadmium poisoning
      (MONDO:0043523), and manganism (MONDO:0017638) are classified under
      MONDO:0029000 (poisoning), and arsenic poisoning carries no MONDO term in
      its dismech entry. This grouping's membership is the curated union over
      dismech entries and stands on its own rationale rather than recapitulating
      the MONDO hierarchy.
    consistency:
    - reference: MONDO
      consistent: INCONSISTENT
      notes: >-
        Marked INCONSISTENT for a MONDO classification gap, not because the
        members are wrong. The only is-a children of MONDO:0023305 in the
        November 2026 OLS hierarchy are thallium poisoning (MONDO:0041996), iron
        poisoning (MONDO:0800385), and cesium poisoning (MONDO:0800384). The
        classic heavy metals lead, mercury, and cadmium, together with
        manganism, are filed one level up under MONDO:0029000 (poisoning), so
        they are not reachable as descendants of the heavy-metal node even
        though they are core members here. Conversely MONDO places cesium (an
        alkali metal whose toxicity is potassium-channel and radiological) under
        the heavy-metal node, and this grouping excludes it on the grounds given
        in notes. The under-filing of lead, mercury, cadmium, and manganese is a
        candidate MONDO review request.
membership_criteria:
- description: >-
    A disorder belongs to this grouping if it is an acquired systemic poisoning
    whose cause is toxic exposure to a toxic heavy metal or metalloid handled
    within the clinical heavy-metals class. The curated members are lead,
    arsenic, mercury, cadmium, thallium, iron, and manganese. This is a
    nosological grouping by clinical-toxicology convention rather than a single
    mechanistic one, and membership rests on that convention rather than on any
    one source's priority-metals list: the priority-metals review cited here
    names chromium and omits thallium and manganese, which are included here on
    wider toxicological convention.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      Etiology is toxic exposure to a heavy metal or metalloid in the clinical
      heavy-metals class. There is no HAS_EXPOSURE criterion predicate and no
      ontology leaf that denotes this exposure class, so this criterion cannot
      currently be expressed as a bound ontology leaf.
  evidence:
  - reference: PMID:22945569
    reference_title: Heavy metal toxicity and the environment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Because of their high degree of toxicity, arsenic, cadmium, chromium,
      lead, and mercury rank among the priority metals that are of public health
      significance.
    explanation: >-
      States the clinical and regulatory convention that these toxic metals are
      handled as one priority class, which is the basis for grouping them; the
      list is representative of the convention rather than an exhaustive gate.
- description: >-
    Membership does NOT require a shared molecular mechanism, a shared target
    organ, or a shared antidote. Those differ between members by design, and a
    member is not excluded for failing to match another member on them.
  criteria_semantics: NECESSARY
  notes: >-
    Recorded as an explicit non-criterion so that a future audit does not read
    the mechanistic heterogeneity of the members as a contradiction to resolve.
  evidence:
  - reference: PMID:22945569
    reference_title: Heavy metal toxicity and the environment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      each metal is known to have unique features and physic-chemical properties
      that confer to its specific toxicological mechanisms of action
    explanation: >-
      Supports keeping the members as separate entries: the shared category does
      not imply a shared mechanism, which is distinct to each metal.
members:
- member: Lead Poisoning
  member_type: DISEASE
  disease_term:
    preferred_term: lead poisoning
    term:
      id: MONDO:0018019
      label: lead poisoning
  differentiating_mechanisms:
  - description: >-
      Lead inhibits the heme-biosynthetic enzymes, most sensitively the zinc
      metalloenzyme delta-aminolevulinic acid dehydratase (ALAD), and mimics
      divalent cations such as calcium - a mechanism not shared by the other
      members.
    evidence:
    - reference: PMID:3442386
      reference_title: delta-Aminolevulinic acid dehydratase isozymes and lead toxicity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ALAD is a zinc metalloenzyme whose inhibition by lead is the first and
        most sensitive indicator of lead exposure and whose decreased activity
        has been implicated in the pathogenesis of lead poisoning.
      explanation: >-
        Identifies heme-synthesis enzyme inhibition as lead's distinctive
        molecular lesion, separating it from the other heavy metals here.
- member: Arsenic Poisoning
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Arsenic binds vicinal protein thiols and selectively inhibits pyruvate
      dehydrogenase, and its toxicokinetics turn on enzymatic methylation, with
      the trivalent methylated metabolites more toxic than inorganic arsenite.
    evidence:
    - reference: PMID:9806419
      reference_title: Arsenic toxicity is enzyme specific and its affects on ligation are not caused by the direct inhibition of DNA repair enzymes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Only pyruvate dehydrogenase, one of eight purified enzymes examined so
        far, is inhibited by micromolar arsenic.
      explanation: >-
        Pyruvate dehydrogenase inhibition by thiol binding is the enzyme-specific
        lesion that distinguishes arsenic within the grouping.
- member: Mercury Poisoning
  member_type: DISEASE
  disease_term:
    preferred_term: mercury poisoning
    term:
      id: MONDO:0018020
      label: mercury poisoning
  differentiating_mechanisms:
  - description: >-
      Organic methylmercury is a potent central-nervous-system toxicant, which
      gives mercury a neurotropic injury pattern - and, across its elemental,
      inorganic, and organic forms, a form-dependent toxicology - not shared by
      the other members.
    evidence:
    - reference: PMID:27538940
      reference_title: Memantine, a Low-Affinity NMDA Receptor Antagonist, Protects against Methylmercury-Induced Cytotoxicity of Rat Primary Cultured Cortical Neurons, Involvement of Ca(2+) Dyshomeostasis Antagonism, and Indirect Antioxidation Effects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Methylmercury (MeHg) is an extremely dangerous environmental pollutant
        that induces severe toxic effects in the central nervous system.
      explanation: >-
        Supports organic methylmercury central-nervous-system toxicity, the
        distinctive neurotropic injury that sets mercury apart here; quoted from
        the study's background framing, hence quote_role BACKGROUND.
- member: Cadmium Poisoning
  member_type: DISEASE
  disease_term:
    preferred_term: cadmium poisoning
    term:
      id: MONDO:0043523
      label: cadmium poisoning
  differentiating_mechanisms:
  - description: >-
      Cadmium is taken up as a metallothionein complex and accumulates in the
      renal proximal tubule, where chronic exposure produces tubular dysfunction
      - a target-organ pattern distinct from the other members.
    evidence:
    - reference: PMID:20354761
      reference_title: 'Heavy metal poisoning: the effects of cadmium on the kidney.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The kidney is the main organ affected by chronic Cd exposure and
        toxicity. Cd accumulates in the kidney as a result of its preferential
        uptake by receptor-mediated endocytosis of freely filtered and
        metallothionein bound Cd (Cd-MT) in the renal proximal tubule.
      explanation: >-
        Renal proximal tubular accumulation and injury is cadmium's distinctive
        target-organ mechanism within the grouping.
- member: Thallium Poisoning
  member_type: DISEASE
  disease_term:
    preferred_term: thallium poisoning
    term:
      id: MONDO:0041996
      label: thallium poisoning
  differentiating_mechanisms:
  - description: >-
      Thallium enters cells as a potassium mimic on the basis of its similar
      charge and ionic radius, and has an affinity for keratin that underlies
      its characteristic alopecia; Prussian blue is its specific decorporation
      agent. This potassium-mimicry mechanism is unique among the members.
    evidence:
    - reference: PMID:14579545
      reference_title: Thallium toxicity and the role of Prussian blue in therapy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thallium enters cells by a unique process governed by its similarity in
        charge and ionic radius to potassium.
      explanation: >-
        Potassium mimicry at the cell membrane is thallium's distinctive entry
        and toxicity mechanism, separating it from the other heavy metals.
- member: Iron Poisoning
  member_type: DISEASE
  disease_term:
    preferred_term: iron poisoning
    term:
      id: MONDO:0800385
      label: iron poisoning
  differentiating_mechanisms:
  - description: >-
      Iron injures by two routes not shared by the other members: ingested iron
      salts are directly corrosive to the gastrointestinal mucosa, and
      circulating non-transferrin-bound iron is a free, redox-active species
      that drives systemic oxidative injury. Deferoxamine is its specific
      chelator. Both the corrosive gut lesion and a free, redox-active
      circulating metal pool are distinctive to iron here.
    evidence:
    - reference: PMID:3784842
      reference_title: Management of acute iron poisoning.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Iron salts are directly toxic to the gastrointestinal tract causing vomiting, diarrhoea, abdominal pain and occasionally significant blood loss.
      explanation: >-
        States the direct corrosive gastrointestinal toxicity of ingested iron
        salts, one half of iron's distinctive dual-injury mechanism.
    - reference: PMID:6421970
      reference_title: Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Although nontransferrin-bound Fe3+ is thought to initiate the disorder, little is known about how it interferes with blood coagulation.
      explanation: >-
        Identifies non-transferrin-bound iron as the circulating redox-active
        species held responsible for systemic toxicity, the other half of iron's
        distinctive mechanism.
- member: Manganism
  member_type: DISEASE
  disease_term:
    preferred_term: manganese poisoning
    term:
      id: MONDO:0017638
      label: manganese poisoning
  differentiating_mechanisms:
  - description: >-
      Manganese is an essential trace element whose toxicity is a dose-and-route
      problem: inhaled metal bypasses hepatobiliary excretion and concentrates
      in the basal ganglia, above all the globus pallidus, producing a
      levodopa-resistant extrapyramidal syndrome distinct from Parkinson
      disease. Central-nervous-system accumulation with an extrapyramidal
      syndrome is a target-organ pattern not shared by the other members.
    evidence:
    - reference: PMID:40278159
      reference_title: 'Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        DMT1 is ubiquitously expressed, with the highest expression in the basal ganglia, especially in the caudate nucleus, the putamen, and the substantia nigra. This is why these are the preferred manganese accumulation sites in Mn neurotoxicity
      explanation: >-
        Ties manganese's basal-ganglia accumulation to the regional transporter
        distribution, the distinctive central-nervous-system target-organ
        mechanism that separates manganism from the other members.
references:
- reference: PMID:22945569
  title: Heavy metal toxicity and the environment.
- reference: PMID:3442386
  title: delta-Aminolevulinic acid dehydratase isozymes and lead toxicity.
- reference: PMID:9806419
  title: Arsenic toxicity is enzyme specific and its affects on ligation are not caused by the direct inhibition of DNA repair enzymes.
- reference: PMID:27538940
  title: Memantine, a Low-Affinity NMDA Receptor Antagonist, Protects against Methylmercury-Induced Cytotoxicity of Rat Primary Cultured Cortical Neurons, Involvement of Ca(2+) Dyshomeostasis Antagonism, and Indirect Antioxidation Effects.
- reference: PMID:20354761
  title: 'Heavy metal poisoning: the effects of cadmium on the kidney.'
- reference: PMID:14579545
  title: Thallium toxicity and the role of Prussian blue in therapy.
- reference: PMID:3784842
  title: Management of acute iron poisoning.
- reference: PMID:6421970
  title: Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro.
- reference: PMID:40278159
  title: 'Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders.'
notes: >-
  Scope decisions. The grouping is the clinical-toxicology set of toxic heavy
  metals and metalloids, and is the curated union over the dismech entries for
  them: lead, arsenic, mercury, cadmium, thallium, iron, and manganese.

  Iron poisoning (MONDO:0800385) is included: MONDO files it under
  MONDO:0023305, iron is a heavy metal by density, and acute iron overdose is a
  standard clinical-toxicology entity. Its mechanism (direct corrosive injury
  plus non-transferrin-bound oxidative injury, chelated by deferoxamine) differs
  from the others, which is expected rather than disqualifying: the grouping is
  by clinical convention, not by shared mechanism or by a shared class of
  chelator.

  Manganism (MONDO:0017638) is included: manganese is a toxic heavy metal and
  manganese poisoning is a long-recognized occupational metal neurotoxicity.

  Cesium poisoning (MONDO:0800384) is excluded, although MONDO files it under
  MONDO:0023305, because cesium is an alkali metal rather than a heavy metal and
  its toxicity is potassium-channel blockade (chemical cesium) or internal
  irradiation (radiocesium), neither a heavy-metal chemical-toxicity mechanism.
  This exclusion is a deliberate divergence from MONDO, recorded so the concept
  is not re-nominated.

  Arsenic is a metalloid included by toxicological convention. Membership is the
  curated union over dismech entries and is not inferred from the MONDO
  hierarchy; see the mapping consistency note for the MONDO classification gap.

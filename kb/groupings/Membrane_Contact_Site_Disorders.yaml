name: Membrane Contact Site Disorders
display_name: Membrane Contact Site Disorders (Organelle Tether and Lipid-Transfer Disorders)
creation_date: "2026-10-23T16:30:00Z"
description: >-
  Hereditary disorders caused by loss or mis-regulation of a protein that holds
  two organelle membranes together at a membrane contact site, or that moves
  lipids or calcium across one. The contact can join the endoplasmic reticulum
  to mitochondria, the plasma membrane, the Golgi, lipid droplets, peroxisomes or
  endolysosomes. Losing it disturbs lipid supply between organelles, calcium
  transfer into mitochondria, and organelle shape and position. The members are
  overwhelmingly neurological: motor neuron disease, ataxia, chorea,
  leukodystrophy with retinal dystrophy, and neurodevelopmental disorders.
grouping_basis:
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on a shared subcellular mechanism, the failure of communication
  between organelles, rather than on phenotype or on the organelle affected.
  It cuts across organelle-based classes on purpose: ACBD5 deficiency also
  belongs with the peroxisomal disorders, and Wolfram syndrome with the
  mitochondrial and endoplasmic reticulum disorders. Those classes describe
  a failure inside one organelle; this one describes the failure of the
  connection between two. Members stay separate Disease entries because they
  differ in which organelle pair is affected and which function of the contact
  fails: the tether itself, lipid transfer across it, or calcium transfer
  across it.

  The criterion is NECESSARY, not NECESSARY_AND_SUFFICIENT. It characterizes
  every listed member and is for auditing the list. It must not be used to
  close the class: several disorders of contact-site proteins are not yet
  curated (BLTP1, ESYT and ORP family genes) or are curated without a
  conforming node (VPS13B in Cohen syndrome),
  and entries such as MFN2-related Charcot-Marie-Tooth disease are candidates
  whose nodes do not yet conform.

  No MONDO class covers this grouping (OLS search of MONDO for "membrane contact
  site", "organelle contact" and "lipid transfer", 2026-10-23). It is proposed as
  a mechanism-based class in
  docs/reports/mondo-mechanism-classification-proposal-round-2-2026-10-23.md.
membership_criteria:
- description: >-
    Every member's pathophysiology conforms to the membrane contact site
    dysfunction module: a tether or contact-resident protein is lost or
    mis-regulated, with evidence that contact extent, lipid transfer or calcium
    transfer across the contact changes.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: membrane_contact_site_dysfunction
    description: >-
      Conforms to the membrane_contact_site_dysfunction module at one or more
      nodes. Scoped to the module, not one node, because members enter at
      different steps: VAPB and ACBD5 at the tether, VPS13A, XK and CERT1 at
      lipid transfer, wolframin and PDZD8 at calcium transfer, and SNX14 at
      organelle morphology.
members:
- member: ACBD5 Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Peroxisome-ER contact. ACBD5 is the peroxisome-side partner of VAPA and
      VAPB. Loss of the tether lowers plasmalogen synthesis and frees
      peroxisomes to move, alongside a separate defect in very-long-chain
      acyl-CoA capture. Retinal dystrophy with leukodystrophy.
    gene:
      preferred_term: ACBD5
      term:
        id: hgnc:23338
        label: ACBD5
    module: membrane_contact_site_dysfunction#Loss of Organelle Tethering at a Membrane Contact Site
- member: Adult-Onset Proximal Spinal Muscular Atrophy, Autosomal Dominant
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The ER-side tether shared by many contacts. VAPB recruits FFAT-motif
      partners to the ER, so its loss degrades several organelle pairs at once,
      including the ER-mitochondria contact where calcium is handed over. Lower
      motor neuron disease.
    gene:
      preferred_term: VAPB
      term:
        id: hgnc:12649
        label: VAPB
    module: membrane_contact_site_dysfunction#Loss of Organelle Tethering at a Membrane Contact Site
- member: Chorea-acanthocytosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      VPS13A is a bridge-like lipid transfer protein linking the ER to
      mitochondria and lipid droplets. Loss of bulk lipid transfer gives
      striatal neurodegeneration with chorea and red cell acanthocytosis.
    gene:
      preferred_term: VPS13A
      term:
        id: hgnc:1908
        label: VPS13A
    module: membrane_contact_site_dysfunction#Disrupted Non-Vesicular Lipid Transfer Between Organelles
- member: McLeod Neuroacanthocytosis Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      XK partners VPS13A at ER-plasma membrane contacts as a lipid scramblase.
      Its loss phenocopies chorea-acanthocytosis, and the X-linked inheritance
      and Kell antigen loss separate the two clinically.
    gene:
      preferred_term: XK
      term:
        id: hgnc:12811
        label: XK
    module: membrane_contact_site_dysfunction#Disrupted Non-Vesicular Lipid Transfer Between Organelles
- member: Intellectual Disability Autosomal Dominant 34
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The gain-of-function member. Autoregulatory-domain CERT1 variants push
      ceramide transfer from the ER to the Golgi above its regulated level,
      raising sphingomyelin synthesis. Intellectual disability.
    gene:
      preferred_term: CERT1
      term:
        id: hgnc:2205
        label: CERT1
    module: membrane_contact_site_dysfunction#Disrupted Non-Vesicular Lipid Transfer Between Organelles
- member: Wolfram Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Wolframin and CISD2 at mitochondria-associated ER membranes. Loss reduces
      ER-mitochondria contacts and calcium transfer. Diabetes mellitus, optic
      atrophy, diabetes insipidus and deafness.
    gene:
      preferred_term: WFS1
      term:
        id: hgnc:12762
        label: WFS1
    module: membrane_contact_site_dysfunction#Impaired Inter-Organelle Calcium Transfer
  - description: >-
      Wolfram syndrome 2. CISD2 is an outer mitochondrial membrane and ER
      protein at the same contacts, and its loss converges on the reduced
      ER-mitochondria calcium transfer seen with WFS1 loss.
    gene:
      preferred_term: CISD2
      term:
        id: hgnc:24212
        label: CISD2
    module: membrane_contact_site_dysfunction#Impaired Inter-Organelle Calcium Transfer
- member: WFS1-Related Disorder
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The wider WFS1 spectrum, including dominant forms. The dominant and
      recessive arms converge on loss of ER calcium homeostasis and of
      mitochondria-associated membrane integrity.
    gene:
      preferred_term: WFS1
      term:
        id: hgnc:12762
        label: WFS1
    module: membrane_contact_site_dysfunction#Impaired Inter-Organelle Calcium Transfer
- member: Intellectual Developmental Disorder With Autism And Dysmorphic Facies
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      PDZD8 tethers the ER to mitochondria and to late endosomes and lysosomes.
      In neurons its loss stops mitochondria taking up calcium released from
      the ER after synaptic activity. Intellectual disability with autism.
    gene:
      preferred_term: PDZD8
      term:
        id: hgnc:26974
        label: PDZD8
    module: membrane_contact_site_dysfunction#Impaired Inter-Organelle Calcium Transfer
- member: Autosomal Recessive Spinocerebellar Ataxia 20
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      ER-lipid droplet contact. SNX14 sits at ER-lipid droplet contacts and
      promotes droplet growth, and its loss changes droplet morphology and
      fatty acid handling. Cerebellar ataxia with intellectual disability.
    gene:
      preferred_term: SNX14
      term:
        id: hgnc:14977
        label: SNX14
    module: membrane_contact_site_dysfunction#Altered Organelle Morphology, Number and Distribution
notes: >-
  Candidates not yet listed: MFN2-related Charcot-Marie-Tooth disease type 2A
  (MFN2 tethers the ER to mitochondria, but the Charcot-Marie-Tooth_Disease entry
  has no node for the tethering defect); SPG87 in Hereditary_Spastic_Paraplegia
  (its contact-site node already conforms to corticospinal_tract_axonopathy);
  PACS2-related developmental and epileptic encephalopathy; Cohen syndrome
  (VPS13B; Cohen_Syndrome exists but has no conforming node); and the
  uncurated stub Alkuraya-Kucinskas syndrome (BLTP1). Cohen-Gibson syndrome is
  not a candidate despite the similar name: it is caused by EED, a PRC2
  chromatin gene. See
  projects/MEMBRANE_CONTACT_SITES.md.

name: Vitamin D-Dependent Rickets
display_name: Vitamin D-Dependent Rickets (VDDR)
creation_date: "2026-08-19T00:00:00Z"
description: >-
  The vitamin D-dependent rickets (VDDR) are a small series of monogenic
  disorders in which rickets arises because the calcitriol signal fails, while
  dietary vitamin D intake and sunlight exposure are adequate. Each member
  interrupts the vitamin D axis at a different point: hepatic 25-hydroxylation
  (type 1B, CYP2R1), renal 1-alpha-hydroxylation (type 1A, CYP27B1), receptor
  transduction (type 2A, VDR), response-element occupancy downstream of a normal
  receptor (type 2B), or catabolic clearance of the metabolites (type 3, CYP3A4).
  They converge on the calciopenic arm of the defective skeletal mineralization
  module, and they diverge sharply in biochemistry and treatment, which is why
  they are grouped rather than merged.
grouping_basis:
- SHARED_PATHWAY
- SHARED_MECHANISM
grouping_rationale: >-
  Grouped on a shared pathway rather than a shared gene family: the members are
  united by lesions at different points of one signalling axis, not by homology.
  They are deliberately kept as separate Disease entries because the differences
  are diagnostically and therapeutically decisive rather than cosmetic. Calcitriol
  is LOW in types 1A, 1B and 3 but HIGH in types 2A and 2B; 25-hydroxyvitamin D is
  normal in type 1A but low in types 1B and 3; type 1A responds to physiological
  calcitriol, type 1B needs lifelong high-dose vitamin D, and types 2A and 2B do
  not respond to any dose of hormone and require calcium bypass instead. Type 2A
  alone carries alopecia. Merging them into one entry with subtypes would force a
  single causal chain across a synthetic block, a receptor block and a catabolic
  gain of function, which are not the same mechanism.

  The name is a double misnomer that the grouping preserves rather than corrects,
  because it is the term the literature and the ontologies use: "dependent"
  denotes dependence on the active hormone rather than on dietary vitamin D, and
  types 2A and 2B are vitamin D-RESISTANT, the mechanistic inverse of types 1A and
  1B. Curators should read the type number, not the series name.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0024299
      label: vitamin D-dependent rickets
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping concept corresponds to the MONDO vitamin D-dependent rickets
      class. Note that MONDO:0010810 (type 1B) is asserted under
      MONDO:0009924 (type 1) and so falls within this class, even though its label
      stem is "vitamin D hydroxylation-deficient rickets" rather than "vitamin
      D-dependent rickets".
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All five listed members are is-a descendants of MONDO:0024299. The
        intermediate MONDO grouping terms MONDO:0009924 (type 1) and
        MONDO:0019642 (type 2) are not separately curated as DisMech entries;
        they are ontology-internal groupings over the gene-level members listed
        here.
membership_criteria:
- description: >-
    A disorder belongs to the vitamin D-dependent rickets if it produces rickets
    through failure of the calcitriol signal in the presence of adequate vitamin D
    supply: it has a pathophysiology node conforming to the calciopenic arm of the
    defective skeletal mineralization module AND it presents with rickets.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: CONFORMS_TO_MODULE
      module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
      description: >-
        Has a pathophysiology node conforming to the calciopenic trigger arm of
        the defective skeletal mineralization module.
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Rickets
        term:
          id: HP:0002748
          label: Rickets
      description: Presents with rickets.
- description: >-
    A disorder is NOT a vitamin D-dependent rickets if its rickets arises from
    renal phosphate wasting with normal parathyroid hormone (the hypophosphatemic
    rickets, which enter the defective skeletal mineralization module through its
    phosphopenic trigger arm), or from failure to clear a mineralization inhibitor
    (hypophosphatasia, which enters through the inhibitor-excess arm). Every
    member enters through the CALCIOPENIC arm specifically.
  criteria_semantics: NECESSARY
  notes: >-
    Deliberately left as prose with no structured `logic` block. The exclusion is
    arm-level, and `CONFORMS_TO_MODULE` is evaluated on the module STEM only -
    `_eval_leaf` in `src/dismech/groupings.py` splits the reference at "#" and
    discards the node anchor - so a leaf naming
    `defective_skeletal_mineralization#Phosphopenic Substrate Deficiency` is
    indistinguishable from one naming any other node of the same module. Written
    as a `NOT` over that leaf, this criterion evaluated to NOT_SATISFIED for all
    five members, reporting five false contradictions, because every member does
    conform to the module (through a different arm). Restore the structured form
    if and when the evaluator honours the node anchor.
members:
- member: Vitamin D-Dependent Rickets Type 1A
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of renal 1-alpha-hydroxylase (CYP27B1): the last activation step fails,
      so 25-hydroxyvitamin D is normal or high while calcitriol is low. The only
      member in which substrate accumulates behind the block. Corrected by
      physiological calcitriol or alfacalcidol.
    gene:
      preferred_term: CYP27B1
      term:
        id: hgnc:2606
        label: CYP27B1
    module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
- member: Vitamin D-Dependent Rickets Type 1B
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of hepatic 25-hydroxylase (CYP2R1): the first activation step fails, so
      both 25-hydroxyvitamin D and calcitriol are low and the biochemistry mimics
      nutritional deficiency. Inheritance is semidominant, with heterozygotes
      showing a blunted 25-hydroxyvitamin D response. Requires lifelong high-dose
      vitamin D, relapsing on dose reduction.
    gene:
      preferred_term: CYP2R1
      term:
        id: hgnc:20580
        label: CYP2R1
    module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
- member: Vitamin D-Dependent Rickets Type 2A
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Vitamin D receptor resistance (VDR): hormone synthesis is intact and
      calcitriol is ELEVATED, but target tissues cannot respond. The zinc-finger
      alleles bind hormone normally and fail at DNA binding. Uniquely accompanied by
      alopecia, which reflects a hormone-independent role of the receptor in the
      hair follicle and is not corrected by normalizing calcium. Treated by calcium
      bypass, not by more hormone.
    gene:
      preferred_term: VDR
      term:
        id: hgnc:12679
        label: VDR
    phenotype_term:
      preferred_term: Alopecia
      term:
        id: HP:0001596
        label: Alopecia
    module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
- member: Vitamin D-Dependent Rickets Type 2B
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Resistance downstream of a structurally and functionally NORMAL receptor:
      overexpressed hnRNP C1/C2 competes with the VDR-RXR dimer for the vitamin D
      response element. The only member whose lesion is not in a vitamin D pathway
      gene, and the only one with no established causal gene - it satisfies the
      grouping criteria by mechanism rather than by genotype.
    module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
- member: Vitamin D-Dependent Rickets Type 3
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Gain of catabolic function (CYP3A4 p.Ile301Thr): synthesis and reception are
      both intact, and the metabolites are destroyed instead. The only member with a
      dominant, de novo, gain-of-function mechanism, and the only one in which
      supplying more hormone is defeated by the lesion itself rather than merely
      insufficient.
    gene:
      preferred_term: CYP3A4
      term:
        id: hgnc:2637
        label: CYP3A4
    module: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
notes: >-
  Scope boundary. The hereditary HYPOPHOSPHATEMIC rickets (X-linked
  hypophosphatemia, autosomal dominant and recessive forms, hereditary
  hypophosphatemic rickets with hypercalciuria) are NOT members: they reach the
  same mineralization failure through renal phosphate wasting with normal
  parathyroid hormone, and they are vitamin D-resistant in the trivial sense that
  vitamin D was never the problem. Nutritional rickets is likewise not a member -
  it is the common acquired disorder these entities are defined against. All of
  them conform to `defective_skeletal_mineralization`, which is the level at which
  they are genuinely alike.

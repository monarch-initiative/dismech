- member: "CNS Neuroblastoma, FOXR2-Activated"
  member_type: DISEASE
  disease_term:
    preferred_term: CNS neuroblastoma with FOXR2 activation
    term:
      id: MONDO:0859597
      label: cns neuroblastoma with FOXR2 activation
  differentiating_mechanisms:
  - description: >-
      Subgroup IV(a), under ICD-O-3 morphology 9500, by the code rule alone.
      The only member that is a tumour of the central nervous system. The
      subgroup's title does not name it and the group's name speaks of
      peripheral tumours, but the table gives 9500 to subgroup IV(a) with its
      widest site range, C000-C809, and has no row that sends 9500 at
      intracranial sites to group III.
    evidence:
    - reference: url:https://seer.cancer.gov/iccc/iccc3.html
      reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "(a) Neuroblastoma and ganglioneuroblastoma | 9490, 9500 | C000-C809 | 041"
      explanation: >-
        The row that gives morphology 9500 to subgroup IV(a) with the site
        range C000-C809. Graded INDIRECT because the row does not name this
        tumour: that its code is 9500 rests on the cross-reference recorded in
        the Disease Ontology, given in this member's notes.
    - reference: url:https://seer.cancer.gov/iccc/iccc3.html
      reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "(c) Intracranial and intraspinal embryonal tumors | 9470-9474, 9480, 9508 | C000-C809 | 033 9501-9504 | C700-C729 | 033"
      explanation: >-
        The two rows of subgroup III(c), the intracranial and intraspinal
        embryonal tumours: morphology 9501-9504 goes there at sites C700-C729,
        and 9500 is not listed. Read with the group IV rows, this shows that
        the table splits 9501-9504 by site and does not split 9500, which is
        why a neuroblastoma of the central nervous system coded 9500 falls in
        group IV. Graded INDIRECT because the conclusion is read off the rows
        of the two groups together.
  notes: >-
    Neither MONDO (MONDO:0859597) nor the NCI Thesaurus (NCIT:C186547) records
    an ICD-O code on its own term for this tumour. The Disease Ontology does:
    its term CNS neuroblastoma with FOXR2 activation (DOID:0080906) carries
    the cross-reference ICDO:9500/3, and MONDO records DOID:0080906 as an
    exact match of MONDO:0859597. The NCI Thesaurus also lists Neuroblastoma
    (NCIT:C3270), which carries 9500/3, among the parents of NCIT:C186547. All
    of these were read through OLS4 on 10 November 2026. The member therefore
    rests on one ontology cross-reference and on the table's rule (see the
    discussion in this file).

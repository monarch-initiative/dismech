- member: Pheochromocytoma and Paraganglioma
  member_type: DISEASE
  disease_term:
    preferred_term: pheochromocytoma-paraganglioma
    term:
      id: MONDO:0035540
      label: pheochromocytoma-paraganglioma
  differentiating_mechanisms:
  - description: >-
      Subgroup IV(b), under ICD-O-3 morphology 8700, recorded for adrenal
      gland pheochromocytoma, and 8680, recorded for paraganglioma. The
      subgroup's title does not name the tumours: their codes, both in the
      row's list, place them there.
    evidence:
    - reference: url:https://seer.cancer.gov/iccc/iccc3.html
      reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "(b) Other peripheral nervous cell tumors | 8680-8683, 8690-8693, 8700, 9520-9523 | C000-C809 | 042"
      explanation: >-
        The row of subgroup IV(b), which lists morphology 8680-8683, 8690-8693
        and 8700 with the site range C000-C809. Graded INDIRECT because the
        row gives codes and not tumour names: that these codes are
        pheochromocytoma and paraganglioma rests on the ICD-O-3 codes recorded
        in the NCI Thesaurus, given in this member's notes.
  - description: >-
      How much of this entry the group covers depends on the coding edition in
      force when a tumour was registered. Under the ICD-O-3 codes that the NCI
      Thesaurus records, adrenal gland pheochromocytoma is 8700/0 and
      paraganglioma is 8680/1, a benign and a borderline behaviour code. The
      caution on the table keeps benign and borderline tumours out of group
      IV, so only the tumours coded as malignant, 8700/3 and 8680/3, are
      counted, and the group covers the entry in part. Later coding removed
      that limit: ICD-O-3.2 lists paraganglioma, NOS as 8680/3 for cases
      diagnosed in 2021 and after, and SEER tells registrars to report
      pheochromocytoma as 8700/3.
    evidence:
    - reference: url:https://seer.cancer.gov/iccc/iccc3.html
      reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: OTHER
      snippet: "Benign and borderline tumors should only be in III (all sub categories) and X(a)."
      explanation: >-
        The SEER programme's caution that benign and borderline tumours belong
        only in group III and subgroup X(a), so they are not counted in group
        IV. Graded INDIRECT because the sentence states the rule and not the
        tumours it applies to: which pheochromocytomas and paragangliomas are
        benign or borderline rests on the behaviour codes recorded in the NCI
        Thesaurus, given in this member's notes.
    - reference: url:https://seer.cancer.gov/seer-inquiry/inquiry-detail/20210041/
      reference_title: "SEER Inquiry System - Question 20210041 Details"
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: OTHER
      snippet: "Report retroperitoneal paraganglioma based on ICD-O-3.2 histology/behavior that lists paraganglioma, NOS as 8680/3 for cases diagnosed 2021 and forward."
      explanation: >-
        The SEER programme's answer to a registrar's question from 2021:
        ICD-O-3.2 lists paraganglioma, NOS as 8680/3 for cases diagnosed in
        2021 and after, so the tumour is reported with malignant behaviour.
        An instruction from the registry programme and not a study result,
        hence OTHER.
    - reference: url:https://seer.cancer.gov/seer-inquiry/inquiry-detail/20250024/
      reference_title: "SEER Inquiry System - Question 20250024 Details"
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: OTHER
      snippet: "Report pheochromocytoma (8700/3). According to WHO Classification of Endocrine and Neuroendocrine Tumors, 5th edition, patients with pheochromocytomas are currently considered to have a lifelong risk of metastases and therefore conceptually they are all considered ‘malignant.’"
      explanation: >-
        The SEER programme's answer to a registrar's question from 2025, about
        a tumour that the pathologist had called benign: pheochromocytoma is
        reported as 8700/3, and the answer gives the reason, citing the fifth
        edition of the WHO classification. The answer does not say from which
        year of diagnosis the code applies.
  notes: >-
    The NCI Thesaurus records the ICD-O-3 codes 8700/0 for Adrenal Gland
    Pheochromocytoma (NCIT:C3326) and 8680/1 for Paraganglioma (NCIT:C3308),
    and 8700/3 and 8680/3 for Metastatic Adrenal Gland Pheochromocytoma
    (NCIT:C4220) and Metastatic Paraganglioma (NCIT:C8559); all four were read
    through OLS4 on 10 November 2026. MONDO records no ICD-O cross-reference
    on pheochromocytoma-paraganglioma (MONDO:0035540) and records 8680/1 on
    paraganglioma (MONDO:0000448), read the same day. These are the ICD-O-3
    codes; the two SEER answers quoted in the row above give the ICD-O-3.2
    coding, under which the tumours are reported as malignant. The table
    quoted in this file is the ICCC-3 table based on ICD-O-3, and this file
    does not quote a later edition of the table. The entry itself covers
    tumours of every behaviour code.
discussions:
- discussion_id: iccc3_group_iv_cns_neuroblastoma_foxr2_code
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Does a primary coding source give CNS neuroblastoma, FOXR2-activated the
    ICD-O code 9500/3, and do registries in practice count the tumour in
    group IV(a)?
  rationale: >-
    The CNS Neuroblastoma, FOXR2-Activated entry is a member on two grounds:
    the table gives morphology 9500 to subgroup IV(a) with its widest site
    range and has no separate row for intracranial sites, and the Disease
    Ontology records 9500/3 on its term for the tumour (DOID:0080906). Two
    things would make the row firmer. First, the code is read from one
    ontology cross-reference. MONDO and the NCI Thesaurus record no ICD-O
    code on their own terms for the tumour (MONDO:0859597 and NCIT:C186547,
    read through OLS4 on 10 November 2026), and no primary coding source for
    it is held in the reference cache, so the code is recorded in the
    member's notes and not as quoted evidence. Second, the table states a
    rule, and no source read for this grouping reports how registries have
    classified tumours with this diagnosis. A citable coding source, or a
    registry report that names the tumour, would settle both.
notes: >-
  No MONDO mapping is asserted. On 10 November 2026 an OLS search of MONDO
  labels and synonyms for "peripheral nervous cell tumor", "peripheral nervous
  cell tumors" and "peripheral nervous cell" returned no term, and the group
  is a registry category rather than a disease class. In an ICD-O-3 code the
  digit after the slash is the behaviour code: /0 is benign, /1 is uncertain
  whether benign or malignant (borderline) and /3 is malignant. The ICD-O-3
  codes given in this file come from the NCI Thesaurus annotation
  ICD-O-3_Code, from MONDO cross-references and, for one member, from a
  Disease Ontology cross-reference, all read through the OLS4 term API on 10
  November 2026; they are not quoted evidence, because none of the three is
  held in the reference cache. The ICD-O-3.2 codes on the Pheochromocytoma
  and Paraganglioma member are the exception: they are quoted from two cached
  SEER answers. The ganglioneuroma code is among the ICD-O-3 codes: the NCI
  Thesaurus records 9490/0 for Ganglioneuroma (NCIT:C3049), and MONDO records
  the same code as a cross-reference of ganglioneuroma (MONDO:0005033). The
  table gives morphology codes without tumour names, and this file names a
  tumour only for the codes that one of those ontologies records on a term
  cited here; it says nothing about the other codes of the group (8681-8683,
  8690-8693, 9520, 9521 and 9501-9504). Entries for constitutional conditions
  that predispose to these tumours, such as Hereditary
  Pheochromocytoma-Paraganglioma Syndrome and the two neuroblastic tumour
  susceptibility entries, are not members: the registry group classifies
  tumours, not predispositions. The ICCC-3 paper itself (PMID:15712273) is
  cached as an abstract only, which describes the classification without
  listing its groups; the group IV rows are quoted from the SEER page, which
  presents its table as the main classification table from the ICCC-3 and
  cites the paper in a footnote.

name: Neuroblastoma and Other Peripheral Nervous Cell Tumors
display_name: "ICCC-3 group IV: neuroblastoma and other peripheral nervous cell tumors"
creation_date: '2026-11-10T22:46:10Z'
description: >-
  Group IV of the International Classification of Childhood Cancer, third
  edition (ICCC-3), a classification designed for international,
  population-based epidemiological studies and cancer registries. The ICCC-3
  classifies tumours coded according to the International Classification of
  Diseases for Oncology, third edition (ICD-O-3), into 12 main groups, which
  are split into 47 subgroups. Group IV is named "Neuroblastoma and other
  peripheral nervous cell tumors". In the main classification table as the
  SEER programme of the United States National Cancer Institute publishes it,
  subgroup (a), "Neuroblastoma and ganglioneuroblastoma", is ICD-O-3
  morphology 9490 and 9500, and subgroup (b), "Other peripheral nervous cell
  tumors", is morphology 8680-8683, 8690-8693, 8700 and 9520-9523, each with
  the site range C000-C809, the widest the table uses. Subgroup (b) also
  takes morphology 9501-9504 at the sites C000-C699, C739-C768 and C809.
  Five DisMech entries cover tumours that these codes place in the group:
  Neuroblastoma, Ganglioneuroblastoma and CNS Neuroblastoma, FOXR2-Activated
  in subgroup (a), and Olfactory Neuroblastoma and Pheochromocytoma and
  Paraganglioma in subgroup (b).
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by registry convention. The members are the DisMech entries whose
  tumours the ICCC-3 code table assigns to one group, so the grouping records
  which tumours childhood cancer statistics count together. A registry group
  is a coding convention and not a mechanism: this grouping asserts no shared
  driver lesion, pathway or origin among its members, and none of its
  evidence is evidence for one.

  Membership follows the code table and not the group's name. The table lists
  four-digit ICD-O-3 morphology codes, and the SEER page carries a caution
  that benign and borderline tumours belong only in group III and in subgroup
  X(a). Two consequences follow. Ganglioneuroma is not a member, although
  morphology 9490 is in subgroup (a), because the code recorded for it is
  9490/0, a benign one (see notes). Pheochromocytoma and Paraganglioma is a
  member only for the tumours a registry records with malignant behaviour,
  and which tumours those are has changed with the coding edition (see that
  member below).

  CNS Neuroblastoma, FOXR2-Activated is a member by the code rule alone. The
  group's name speaks of peripheral tumours, and this is a tumour of the
  central nervous system. But the table gives morphology 9500 to subgroup
  IV(a) with the site range C000-C809 and has no separate row for
  intracranial sites, so a tumour coded 9500 is counted in this group
  wherever it arises, and 9500/3 is the code the Disease Ontology records
  for this tumour (see that member's notes and the discussion in this file).

  The grouping overlaps the Peripheral Neuroblastic Tumors grouping and cuts
  differently. That grouping follows a pathology classification and holds
  neuroblastoma, ganglioneuroblastoma and ganglioneuroma. This one follows
  the registry table, so it leaves ganglioneuroma out and takes in olfactory
  neuroblastoma, pheochromocytoma and paraganglioma, and the FOXR2-activated
  neuroblastoma of the central nervous system, all of which the rationale of
  that grouping records as non-members. The members stay separate Disease
  entries because the registry group says nothing about their biology,
  treatment or outcome.
membership_criteria:
- description: >-
    A member is a Disease entry for a tumour whose ICD-O-3 morphology code
    the ICCC-3 main classification table assigns to group IV, for the tumours
    registered with malignant behaviour. Stated as NECESSARY only. The
    four-digit ICD-O-3 code is not a structured field of a Disease entry
    (monarch-initiative/dismech issue 7548), so no audit can test every entry
    against the code table: the member list was drawn up from the entries
    whose names mark them as tumours of these kinds and is not offered as
    complete. For the same reason the audit cannot evaluate the criterion and
    reports it as unknown for every member; each member's notes give the code
    and where it was read.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      The tumour's ICD-O-3 morphology code is one that the ICCC-3 main
      classification table assigns to group IV (9490 or 9500 for subgroup
      (a); 8680-8683, 8690-8693, 8700 or 9520-9523, or 9501-9504 at the
      listed sites, for subgroup (b)), with malignant behaviour.
  evidence:
  - reference: PMID:15712273
    reference_title: "International Classification of Childhood Cancer, third edition."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "The ICCC-3 classifies tumors coded according to the ICD-O-3 into 12 main groups, which are split further into 47 subgroups."
    explanation: >-
      The paper that published the classification states how it works: it
      sorts tumours coded with ICD-O-3 into 12 main groups and 47 subgroups.
      This supports the basis of the criterion, that a tumour's group follows
      from its ICD-O-3 code. The abstract does not list the groups; the group
      IV rows are quoted from the SEER table below. A classification and not
      a measurement, hence OTHER.
  - reference: PMID:15712273
    reference_title: "International Classification of Childhood Cancer, third edition."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "The ICCC-3 respects currently existing international standards and was designed for use in international, population-based, epidemiological studies and cancer registries."
    explanation: >-
      The paper's conclusion states what the classification is for:
      population-based epidemiological studies and cancer registries. This is
      the basis for calling the group a registry convention.
  - reference: url:https://seer.cancer.gov/iccc/iccc3.html
    reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "IV. Neuroblastoma and other peripheral nervous cell tumors (a) Neuroblastoma and ganglioneuroblastoma | 9490, 9500 | C000-C809 | 041 (b) Other peripheral nervous cell tumors | 8680-8683, 8690-8693, 8700, 9520-9523 | C000-C809 | 042 9501-9504 | C000-C699, C739-C768, C809 | 042"
    explanation: >-
      The four rows of group IV in the table as SEER publishes it. The columns
      are the site group, the ICD-O-3 histology codes, the ICD-O site codes
      and SEER's recode. Subgroup (a) is morphology 9490 and 9500 with the
      site range C000-C809, the widest the table uses; subgroup (b) is the
      listed morphology codes with the same range, and 9501-9504 at a
      narrower list of sites. The page presents the table as the main
      classification table from the ICCC-3 and cites the 2005 paper in a
      footnote, so the rows restate that paper, hence REVIEW_SYNTHESIS.
  - reference: url:https://seer.cancer.gov/iccc/iccc3.html
    reference_title: "ICCC, Third Edition (ICD-O-3), Main Classification Table - SEER Recodes"
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Benign and borderline tumors should only be in III (all sub categories) and X(a)."
    explanation: >-
      The SEER programme's own caution on its table: benign and borderline
      tumours belong only in group III and subgroup X(a). Group IV therefore
      holds tumours registered with malignant behaviour, which is why the
      criterion adds that condition. The sentence is SEER's instruction for
      its own recode and not part of the reproduced table, hence
      PRIMARY_RESULT.

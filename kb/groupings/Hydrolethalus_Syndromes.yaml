name: Hydrolethalus Syndromes
creation_date: '2026-11-20T20:33:48Z'
description: HYLS1- and KIF7-related hydrolethalus syndromes are severe developmental ciliopathies
  with brain malformations and characteristic limb-patterning abnormalities.
grouping_basis:
- SHARED_PHENOTYPE
- SHARED_MECHANISM
grouping_rationale: 'The shared fetal malformation phenotype and ciliary dysfunction support
  the series. The disorders remain separate because HYLS1 affects centriole structural integrity
  and cilium assembly, whereas KIF7 regulates ciliary Hedgehog signal transduction and GLI
  processing. The grouping does not impose a single direction of Hedgehog change on both diseases.
  Hydrocephalus is not universal in every individual: severe neural-tube or other brain malformations
  can occur. KIF7-related acrocallosal and Joubert phenotypes and milder HYLS1-associated
  presentations are not added on gene identity alone.'
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:236680
      label: Hydrolethalus syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 series contains OMIM:236680, OMIM:614120, represented
      by the separately curated Disease members of this union. The series identifier denotes
      the group rather than its first numbered member.
  mondo_mappings:
  - term:
      id: MONDO:0006037
      label: hydrolethalus syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: The September 2026 MONDO direct children match the numbered disease
      concepts in this explicit union; the mapping does not merge their separately curated
      mechanisms.
membership_criteria:
- description: Each member entry annotates postaxial hand polydactyly together with involvement
    of HYLS1 or KIF7. This is a necessary check of disease-level annotations, not a diagnostic
    rule for an individual or a claim that every patient manifests the finding. Gene annotations
    alone neither establish causation nor include all allelic disorders; the criteria are
    not sufficient to discover membership.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Postaxial hand polydactyly
        term:
          id: HP:0001162
          label: Postaxial hand polydactyly
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: HYLS1
          term:
            id: hgnc:26558
            label: HYLS1
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: KIF7
          term:
            id: hgnc:30497
            label: KIF7
members:
- member: Hydrolethalus Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: HYLS1-related disease affects centriole integrity upstream of tissue-specific
      ciliary assembly and function. The structural mechanism is supported by a disease-variant
      mouse model, rather than assumed to be the same cilium-tip defect as KIF7 disease.
    gene:
      preferred_term: HYLS1
      term:
        id: hgnc:26558
        label: HYLS1
    evidence:
    - reference: PMID:40009365
      reference_title: Centriole structural integrity defects are a crucial feature of hydrolethalus
        syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The HLS disease mutation reduced the centriole localization of HYLS1 and caused
        degeneration of the centriole distal end.
      explanation: Disease-variant experiments demonstrate reduced centriole localization
        and distal-end degeneration.
    - reference: PMID:40009365
      reference_title: Centriole structural integrity defects are a crucial feature of hydrolethalus
        syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These phenotypes arise from a loss of centriole integrity that causes tissue-specific
        defects in cilia assembly and function.
      explanation: The model links centriole integrity to tissue-specific defects in cilia
        assembly and function.
- member: Hydrolethalus Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: KIF7-related disease disturbs ciliary Hedgehog signaling and GLI3 processing.
      The hydrolethalus presentation remains a distinct member despite other allelic KIF7
      syndromes.
    gene:
      preferred_term: KIF7
      term:
        id: hgnc:30497
        label: KIF7
    evidence:
    - reference: PMID:21552264
      reference_title: KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found an increase in the GLI3-FL:GLI3-R ratio in fibroblasts from both cases
        (Fig. 3c,d), indicating a similar biological function of KIF7 in human and mouse to
        ensure normal levels of Gli3-R production.
      explanation: Patient-derived fibroblast immunoblotting supports impaired GLI3 processing
        in the KIF7 branch; this is a cellular functional assay rather than the mixed tissue-and-cell
        summary in the abstract.
notes: KIF7-related acrocallosal syndrome can share postaxial hand polydactyly and KIF7 involvement,
  so these necessary annotation conditions do not distinguish it from hydrolethalus. The explicit
  clinical disease boundary remains essential; the logic does not define a sufficient rule
  for adding other KIF7 disorders.

name: ERCC6-Related Cockayne Spectrum
display_name: ERCC6-related Cockayne spectrum (with or without COFS)
creation_date: '2026-11-18T15:34:42Z'
description: >-
  The disorders caused by biallelic variants in ERCC6, the gene encoding the
  Cockayne syndrome B protein (CSB) that couples nucleotide excision repair to
  transcription. They form one severity and onset continuum. Cockayne syndrome
  type B covers the mild later-onset form (CS III), the classic form (CS I) and
  the severe infantile form (CS II). CS II already shows growth failure and eye
  anomalies at birth and partially overlaps COFS. Cerebrooculofacioskeletal
  syndrome 1 (COFS1), with prenatal-onset microcephaly, congenital cataracts and
  neurogenic arthrogryposis, is the most severe end. MONDO:0100506 treats this
  ERCC6 continuum as a single disease, and ClinGen's Definitive ERCC6
  assertion is made against that term. dismech curates the two parts inside two
  separate disease entries, and this grouping joins them.
grouping_basis:
- SHARED_GENE_FAMILY
grouping_rationale: >-
  The axis is a single gene, and SHARED_GENE_FAMILY fits: every member is
  caused by variants in ERCC6. The grouping exists because the knowledge base
  splits this continuum at a different point from MONDO and ClinGen. dismech
  files ERCC6 Cockayne syndrome as the molecular type B row of
  Cockayne_Syndrome, next to the ERCC8 type A row, because Cockayne syndrome is
  one clinical disease with two causal genes. It files ERCC6 COFS as the COFS1
  row of COFS_Syndrome, next to the ERCC2, ERCC5 and ERCC1 forms, because COFS
  is one prenatal-onset phenotype with four causal genes. Both splits follow
  the phenotype. MONDO:0100506 instead cuts by gene: its definition lumps
  CS type B, COFS1 and de Sanctis-Cacchione syndrome into one ERCC6 spectrum,
  and ClinGen's Definitive ERCC6 assertion is made against that term. Neither
  cut is wrong. The grouping lets a reader who
  starts from the gene find both rows without merging the two disease entries
  or duplicating their content.


  The boundary stops at the neurodevelopmental, progeroid end of ERCC6
  disease. UV-sensitive syndrome 1 is also caused by biallelic ERCC6 variants,
  but it is cutaneous photosensitivity without the growth failure or
  neurodegeneration of Cockayne syndrome. MONDO:0100506 does not include it, and
  MONDO files UV-sensitive syndrome 1 (MONDO:0010909) under UV-sensitive
  syndrome instead, so it is not a member.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100506
      label: Cockayne spectrum with or without cerebrooculofacioskeletal syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO defines this class as the autosomal recessive condition caused by
      ERCC6 variants, and its definition says it lumps Cockayne syndrome
      type 2/B, cerebrooculofacioskeletal syndrome 1 and de Sanctis-Cacchione
      syndrome into one spectrum. That union is the concept curated here, and
      the match rests on that lump sentence. The definition's phenotype
      sentence (growth failure at birth, little or no postnatal neurologic
      development, death usually by age five) describes only the severe
      infantile end, while the type B member also covers the classic and mild
      forms. MONDO
      does not place the members' own terms under this class: MONDO:0019570
      (Cockayne syndrome type 2, defined as Cockayne syndrome caused by ERCC6)
      is a sibling of MONDO:0100506 under MONDO:0016006 Cockayne syndrome, and
      MONDO:0008955 (cerebrooculofacioskeletal syndrome 1) sits under
      MONDO:0008926 COFS syndrome. So an ancestor walk from the members will
      not reach the mapped class. That gap is in MONDO's hierarchy, not in the
      membership. MONDO:0019570 also overlaps heavily with MONDO:0100506, which
      makes it a candidate for an upstream request to place 0019570 and 0008955
      under 0100506.
membership_criteria:
- description: >-
    A member is an ERCC6-caused stratum of Cockayne-spectrum disease: its
    entry binds ERCC6 (hgnc:3438) as a causal gene, on the member's subtype
    row, and the stratum is one MONDO:0100506 places in the ERCC6 spectrum.
    The gene check reads entry-level bindings, so it cannot tell a member row
    from a sibling row; the second half of this criterion is a curator's
    judgement.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_GENE
    description: ERCC6 is bound as a gene in the member's entry.
    gene:
      preferred_term: ERCC6
      term:
        id: hgnc:3438
        label: ERCC6
members:
- member: Cockayne Syndrome
  member_type: SUBTYPE
  display_name: Cockayne syndrome type B (ERCC6/CSB)
  disease_term:
    preferred_term: Cockayne syndrome type B
    term:
      id: MONDO:0019570
      label: Cockayne syndrome type 2
  differentiating_mechanisms:
  - description: >-
      The ERCC6 stratum of Cockayne syndrome takes in all three clinical
      forms: the classic form (CS I), the severe infantile form (CS II) and the
      mild later-onset form (CS III). The letter B names the gene, not a
      severity. Onset ranges from prenatal or neonatal in CS II to after
      normal early development in CS III. Its severe end, CS II, partially
      overlaps COFS, so the boundary with the COFS1 member is a gradient
      rather than a sharp line.
  evidence:
  - reference: PMID:38674442
    reference_title: "Spectrum of ERCC6-Related Cockayne Syndrome (Type B): From Mild to Severe Forms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our work confirms clinical variability also in the ERCC6/CSB type,
      where manifestations may range from severe involvement with prenatal or
      neonatal onset to normal psychomotor development followed by
      progressive ataxia.
    explanation: >-
      In a genetically confirmed ERCC6 cohort, the ERCC6/CSB type spans
      everything from prenatal-onset severe disease to later-onset ataxia
      after normal early development. This is the range the type B row
      covers.
  - reference: PMID:38674442
    reference_title: "Spectrum of ERCC6-Related Cockayne Syndrome (Type B): From Mild to Severe Forms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most severe form (i.e., CS II) partially overlapped with COFS
      syndrome.
    explanation: >-
      In the same ERCC6 cohort, the severe CS II patients partially overlapped
      with COFS. This is why the line between the two members is a gradient.
- member: COFS Syndrome
  member_type: SUBTYPE
  display_name: Cerebrooculofacioskeletal syndrome 1 (ERCC6/CSB)
  disease_term:
    preferred_term: cerebrooculofacioskeletal syndrome 1
    term:
      id: MONDO:0008955
      label: cerebrooculofacioskeletal syndrome 1
  differentiating_mechanisms:
  - description: >-
      The most severe end of the spectrum, with prenatal onset. Microcephaly,
      congenital cataracts and neurogenic arthrogryposis are present at birth.
      Cockayne_Syndrome also records joint contractures, but as an early
      postnatal finding; in COFS1 the contractures are already fixed at birth.
      COFS_Syndrome curates it as the COFS1 row beside the ERCC2, ERCC5 and
      ERCC1 forms.
    phenotype_term:
      preferred_term: Neurogenic arthrogryposis
      term:
        id: HP:0002804
        label: Arthrogryposis multiplex congenita
  evidence:
  - reference: PMID:20456449
    reference_title: "ERCC6 founder mutation identified in Finnish patients with COFS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebro-oculo-facio-skeletal (COFS) syndrome is an autosomal recessive
      disorder characterized by microcephaly, congenital cataracts, facial
      dysmorphism, neurogenic arthrogryposis, growth failure and severe
      psychomotor retardation.
    explanation: >-
      This is the study that found an ERCC6 founder mutation in a Finnish COFS
      pedigree. The quoted sentence gives the congenital phenotype of ERCC6
      COFS.
references:
- reference: CGGV:assertion_e9dbf99e-d648-465c-8aa5-0840e76c0aeb-2022-08-18T100000.000Z
  title: "ERCC6 / Cockayne spectrum with or without cerebrooculofacioskeletal syndrome (Definitive)"
notes: >-
  Three disease entries bind ERCC6 (hgnc:3438) as a causal gene. Two are
  members: Cockayne_Syndrome, through its Cockayne syndrome type B row, and
  COFS_Syndrome, through its COFS1 row. UV-Sensitive_Syndrome binds ERCC6 on
  its UVSS1 row and is left out on purpose, for the reason given in
  grouping_rationale. The nucleotide_excision_repair_deficiency module also
  binds ERCC6, but a mechanism module cannot be a grouping member.


  De Sanctis-Cacchione syndrome is the third disease named in the MONDO:0100506
  definition. It has no kb/ entry yet. It is queued as
  stubs/De_Sanctis-Cacchione_Syndrome.yaml (MONDO:0010217, ERCC6), and should
  be added here as a member once it is curated, if its entry confirms the ERCC6
  cause. Until then this grouping covers two of the three conditions MONDO
  lumps.


  ClinGen classifies ERCC6 as Definitive (autosomal recessive) for
  MONDO:0100506. The cached record is a single classification row; the
  lumping of the three conditions is stated in the MONDO definition, not in
  the ClinGen record. The Cockayne_Syndrome type B row already quotes that
  record.

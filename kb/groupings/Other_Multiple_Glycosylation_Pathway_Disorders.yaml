name: Other Disorders of Multiple Glycosylation Pathways
display_name: Other Disorders of Multiple Glycosylation Pathways
creation_date: "2026-07-06T06:04:18Z"
description: >-
  This grouping collects rare inherited glycosylation disorders in which the
  primary lesion is not a single canonical N-glycan assembly enzyme or Golgi
  processing enzyme, but instead affects nucleotide-sugar precursor supply or
  ER glycoprotein quality control with consequences across multiple glycan or
  glycoprotein pathways, or that disturbs the Golgi ionic and pH environment
  on which several branches depend. Members are the nucleotide-sugar supply
  defects (UGDH, UGP2), the ER glycoprotein quality-control defects (UGGT1,
  EDEM3), the Golgi pH and cation defects (ATP6V0A2, ATP6AP2, CCDC115,
  TMEM199, SLC10A7, TMEM165), and two lesions outside the glycosylation
  machinery that mislocalise or mistarget secretory-pathway proteins (SLC37A4,
  CAMLG).
grouping_basis:
- SHARED_PATHWAY
grouping_rationale: >-
  These entries are kept as separate Disease entries because their proximal
  lesions are distinct: UGDH limits UDP-glucuronic acid supply for
  glycosaminoglycan/proteoglycan and glycolipid production; UGP2 limits
  UDP-glucose-dependent glycogen and protein glycosylation biology in brain;
  and UGGT1 disrupts ER reglucosylation-based quality control of N-linked
  glycoproteins. They are grouped only at the pathway-placement level as
  "other/multiple glycosylation pathway" disorders rather than merged into a
  single disease entity.
membership_criteria:
- description: >-
    A member has a primary lesion in a nucleotide-sugar precursor pathway,
    glycosaminoglycan/proteoglycan biosynthesis, or ER N-glycoprotein quality
    control that affects more than one downstream glycan or glycoprotein client
    class.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    description: >-
      Multiple-pathway glycosylation defects represented by glycoprotein
      biosynthesis generally, glycosaminoglycan biosynthesis, a named
      N- or O-linked branch, or ER folding quality control. The branch-generic
      operand is first because it is the level this grouping actually means: a
      member is here precisely because its lesion is not specific to one branch,
      so requiring a named branch contradicted the grouping's own concept and
      left UGP2-CDG, whose entry correctly declines to name one, NOT_SATISFIED.
    operands:
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: >-
        Impairs glycoprotein biosynthesis without the lesion being specific to a
        named glycosylation branch. Ontology closure makes this subsume the
        N- and O-linked operands below, which are kept because they say which
        branch a member that does name one perturbs.
      biological_processes:
      - preferred_term: protein glycosylation
        term:
          id: GO:0009101
          label: glycoprotein biosynthetic process
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: Impairs glycosaminoglycan biosynthesis.
      biological_processes:
      - preferred_term: glycosaminoglycan biosynthetic process
        term:
          id: GO:0006024
          label: glycosaminoglycan biosynthetic process
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: Impairs protein O-linked glycosylation.
      biological_processes:
      - preferred_term: protein O-linked glycosylation
        term:
          id: GO:0006493
          label: protein O-linked glycosylation
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: Perturbs protein N-linked glycosylation.
      biological_processes:
      - preferred_term: protein N-linked glycosylation
        term:
          id: GO:0006487
          label: protein N-linked glycosylation
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      description: Perturbs ER protein-folding quality control.
      biological_processes:
      - preferred_term: protein folding in endoplasmic reticulum
        term:
          id: GO:0034975
          label: protein folding in endoplasmic reticulum
members:
- member: UGDH-related developmental and epileptic encephalopathy 84
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      UGDH loss reduces conversion of UDP-glucose to UDP-glucuronic acid,
      limiting precursor supply for glycosaminoglycan-rich proteoglycans and
      glycolipids.
    gene:
      preferred_term: UGDH
      term:
        id: hgnc:12525
        label: UGDH
    biological_processes:
    - preferred_term: glycosaminoglycan biosynthetic process
      modifier: DECREASED
      term:
        id: GO:0006024
        label: glycosaminoglycan biosynthetic process
- member: UGP2-related developmental and epileptic encephalopathy 83
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      UGP2 short-isoform loss in brain reduces UDP-glucose production in neural
      stem cells, affecting glycogen metabolism, glycosylation, and ER
      proteostasis.
    gene:
      preferred_term: UGP2
      term:
        id: hgnc:12527
        label: UGP2
    biological_processes:
    - preferred_term: protein N-linked glycosylation
      modifier: ABNORMAL
      term:
        id: GO:0006487
        label: protein N-linked glycosylation
- member: Autosomal Recessive Cutis Laxa Type 2A
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      ATP6V0A2, the Golgi V-ATPase a2 subunit. The lesion is Golgi luminal
      acidification, not a transferase or a nucleotide-sugar pool, and it
      disables N- and O-linked glycosylation together — which is what places it
      here rather than in a branch-specific sibling. The distinguishing
      consequence is defective elastic-fibre assembly, giving cutis laxa beside
      the neuronal migration defect.
    gene:
      preferred_term: ATP6V0A2
      term:
        id: hgnc:18481
        label: ATP6V0A2
- member: Short Stature, Amelogenesis Imperfecta, and Skeletal Dysplasia with Scoliosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      SLC10A7, a Golgi calcium-handling transporter. Like the ATP6V0A2 member the
      proximal lesion is a Golgi luminal condition rather than a glycosylation
      enzyme, but the perturbed variable is calcium rather than pH, and the
      client range extends to glycosaminoglycan synthesis as well as N- and
      O-glycans — hence a skeletal dysplasia with amelogenesis imperfecta.
    gene:
      preferred_term: SLC10A7
      term:
        id: hgnc:23088
        label: SLC10A7
- member: UGGT1-congenital disorder of glycosylation
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      UGGT1 variants impair reglucosylation and ER retention of the
      UDP-glucose:glycoprotein glucosyltransferase quality-control enzyme for
      N-linked glycoproteins.
    gene:
      preferred_term: UGGT1
      term:
        id: hgnc:15663
        label: UGGT1
    biological_processes:
    - preferred_term: protein folding in endoplasmic reticulum
      modifier: ABNORMAL
      term:
        id: GO:0034975
        label: protein folding in endoplasmic reticulum
- member: CCDC115-CDG
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Golgi V-ATPase assembly, so the proximal lesion is Golgi luminal pH rather
      than any glycosyltransferase, and it produces a combined N- and
      O-glycosylation defect. CCDC115 is the human homolog of the yeast
      assembly factor Vma22p and TMEM199 of its partner Vph2p; the two diseases
      share the hepatopathy with abnormal copper metabolism that distinguishes
      them from ATP6V0A2 cutis laxa.
    gene:
      preferred_term: CCDC115
      term:
        id: hgnc:28178
        label: CCDC115
- member: TMEM199-CDG
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      TMEM199 is the human homolog of the yeast V-ATPase assembly factor Vph2p.
      Like CCDC115, its loss disturbs Golgi pH and produces a combined N- and
      O-glycosylation defect presenting in the liver (steatosis,
      hypercholesterolaemia, low ceruloplasmin and copper) that mimics Wilson
      disease, without the encephalopathy of most CDG.
    gene:
      preferred_term: TMEM199
      term:
        id: hgnc:18085
        label: TMEM199
- member: Congenital Disorder of Glycosylation Type IIr
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      ATP6AP2 is an accessory subunit of the V-ATPase that acidifies the
      secretory pathway; its missense variants destabilise the protein and its
      interaction with ATP6AP1, impairing V-ATPase assembly. X-linked, with
      liver disease, immunodeficiency, cutis laxa and psychomotor impairment.
    gene:
      preferred_term: ATP6AP2
      term:
        id: hgnc:18305
        label: ATP6AP2
- member: TMEM165-Congenital Disorder of Glycosylation
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      TMEM165 is not a glycosylation enzyme. It moves Ca2+ and Mn2+ into the
      Golgi lumen in exchange for protons, and the glycosylation defect follows
      from luminal Mn2+ insufficiency, Mn2+ being the cofactor of the
      beta-1,4-galactosyltransferases. Like SLC10A7 the perturbed variable is a
      Golgi cation rather than pH; oral D-galactose partially corrects the
      glycosylation.
    gene:
      preferred_term: TMEM165
      term:
        id: hgnc:30760
        label: TMEM165
- member: Congenital Disorder of Glycosylation, Type IIw
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A recurrent de novo heterozygous truncation removes the C-terminal
      ER-retrieval motif of the glucose-6-phosphate transporter, which then
      leaves the ER for the Golgi: the lesion is the transporter's escape, not
      its loss, which separates this disease from recessive SLC37A4 glycogen
      storage disease type Ib.
    gene:
      preferred_term: SLC37A4
      term:
        id: hgnc:4061
        label: SLC37A4
- member: CAMLG-CDG
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      CAML partners WRB in the ER receptor for tail-anchored protein insertion,
      so the lesion is in membrane-protein targeting rather than in any
      glycosylation enzyme; serum shows combined O-linked and type II N-linked
      abnormalities. Proposed on a single published patient.
    gene:
      preferred_term: CAMLG
      term:
        id: hgnc:1471
        label: CAMLG
- member: EDEM3-Congenital Disorder of Glycosylation
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      EDEM3 is an ER alpha-1,2-mannosidase that trims high-mannose N-glycans to
      mark misfolded glycoproteins for ER-associated degradation, so like UGGT1
      it is an ER glycoprotein quality-control lesion rather than a defect in
      building the glycan; it also shifts the global N-glycan profile.
    gene:
      preferred_term: EDEM3
      term:
        id: hgnc:16787
        label: EDEM3
notes: >-
  This is an auditable work-package subgroup, not an attempt to replace the
  broader Congenital Disorders of Glycosylation grouping or the MONDO hierarchy.

  The Golgi ionic- and pH-environment disorders are held together here: the
  V-ATPase defects (ATP6V0A2, ATP6AP2, and the assembly factors CCDC115 and
  TMEM199) and the Golgi cation defects (SLC10A7, TMEM165). CCDC115-CDG was
  previously listed in Congenital_Disorders_of_Glycosylation; it moved here
  with its assembly-factor partner TMEM199 so that the family is not split
  across two siblings. Its own icimd_category note describes it as a combined
  N- and O-glycosylation defect "arising from disturbed Golgi homeostasis rather
  than from a glycosyltransferase or sugar-nucleotide defect", which is this
  grouping's placement rule.

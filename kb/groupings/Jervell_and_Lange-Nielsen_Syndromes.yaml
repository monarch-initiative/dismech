name: Jervell and Lange-Nielsen Syndromes
creation_date: '2026-11-20T20:02:14Z'
description: >-
  The two gene-defined Jervell and Lange-Nielsen diseases combine congenital
  sensorineural hearing loss with long QT syndrome through loss of the
  KCNQ1-KCNE1 potassium channel complex in the inner ear and heart.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: >-
  The shared cardioauditory phenotype results from disruption of the same
  channel complex in two tissues. The existing diseases remain separate
  because KCNQ1 encodes the pore-forming alpha subunit whereas KCNE1 encodes
  its auxiliary subunit, and their variant mechanisms and clinical risk
  distributions differ. The 186-patient clinical series found KCNE1-associated
  disease had a more benign course, a cohort-level distinction rather than
  a guarantee for an individual. This grouping explicitly joins those
  molecular diseases while preserving their separate causal accounts.
  Long QT syndrome without hearing loss and isolated deafness are outside
  this cardioauditory grouping even when they involve the same genes.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:220400
      label: Jervell and Lange-Nielsen syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: >-
      The January 2026 PS220400 snapshot contains exactly OMIM:220400 (type 1)
      and OMIM:612347 (type 2), represented by the two separately curated
      Disease members. The series is not interchangeable with its first
      member, OMIM:220400.
  mondo_mappings:
  - term:
      id: MONDO:0002441
      label: Jervell and Lange-Nielsen syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The September 2026 MONDO:0002441 class has exactly MONDO:0024540 (type 1)
      and MONDO:0012871 (type 2) as direct children and maps to PS220400.
      These are the two disease concepts in the curated union.
membership_criteria:
- description: >-
    Each member entry has prolonged QT, sensorineural hearing impairment,
    autosomal recessive inheritance, and KCNQ1 or KCNE1 involvement. This is
    a necessary check of disease-level annotations, not a patient diagnostic
    rule: it does not establish pathogenicity, biallelic status, or a causal
    relationship between co-occurring findings. It is not sufficient to
    include every disorder involving one of these genes.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Prolonged QT interval
        term:
          id: HP:0001657
          label: Prolonged QT interval
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Sensorineural hearing impairment
        term:
          id: HP:0000407
          label: Sensorineural hearing impairment
    - criterion_predicate: HAS_INHERITANCE
      inheritance_term:
        preferred_term: Autosomal recessive inheritance
        term:
          id: HP:0000007
          label: Autosomal recessive inheritance
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: KCNE1
          term:
            id: hgnc:6240
            label: KCNE1
  evidence:
  - reference: PMID:16461811
    reference_title: 'The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the long-QT syndrome (LQTS) variant associated with deafness and caused by homozygous or compound heterozygous mutations on the KCNQ1 or on the KCNE1 genes encoding the I(Ks) current
    explanation: The clinical cohort identifies the shared cardioauditory syndrome and biallelic involvement of either channel gene.
members:
- member: Jervell and Lange-Nielsen Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic KCNQ1 loss disrupts the pore-forming channel subunit, affecting
      cardiac repolarization and inner-ear ion homeostasis. The genotype
      boundary matters: KCNQ1 can also cause long QT syndrome without deafness,
      which is not included solely because it shares the gene.
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
    evidence:
    - reference: PMID:9020846
      reference_title: A novel mutation in the potassium channel gene KVLQT1 causes the Jervell and Lange-Nielsen cardioauditory syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: An homozygous deletion-insertion event (1244, -7 +8) in the C-terminal domain of this gene was detected in three affected children of two families.
      explanation: The original families establish biallelic KCNQ1 involvement in the type 1 cardioauditory disorder.
- member: Jervell and Lange-Nielsen Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Biallelic KCNE1 loss affects the auxiliary subunit of the same channel
      complex. Variant functional effects require individual assessment;
      the grouping does not infer that all KCNE1 variants cause this syndrome
      or that all heterozygous carriers have dominant long QT syndrome.
    gene:
      preferred_term: KCNE1
      term:
        id: hgnc:6240
        label: KCNE1
    evidence:
    - reference: PMID:41200805
      reference_title: Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Most dysfunctional variants exhibited loss-of-function properties. We observed no apparent dominant-negative effects when variant and wild-type KCNE1 were coexpressed.
      explanation: The tested variant panel demonstrates predominantly loss-of-function effects and qualifies the recessive mechanism without making a universal claim about every KCNE1 allele.
  - description: >-
      KCNE1-associated disease had a more benign cardiac course than the
      predominantly KCNQ1-associated cases in the 186-patient cohort; this
      difference supports retaining gene-defined entries without treating
      type 2 as risk-free.
    evidence:
    - reference: PMID:16461811
      reference_title: 'The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: mutations on the KCNE1 gene are associated with a more benign course.
      explanation: The cohort reports a gene-associated difference in clinical course within the shared syndrome.
notes: >-
  Phenotype leaves use ontology closure so that the members' prolonged QTc
  and congenital or profound sensorineural hearing terms satisfy their
  common parent criteria. The grouping describes disease entities; absence
  of a finding in an individual cannot be interpreted by this annotation audit.

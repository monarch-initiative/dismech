name: Brucella Species Brucellosis
display_name: Species-defined human brucelloses
creation_date: "2026-10-20T05:00:00Z"
description: >-
  The species-defined human brucelloses are curated entries for human
  brucellosis caused by a named Brucella species whose reservoir, transmission
  setting, diagnostics, and epidemiology differ enough from all-cause
  brucellosis to merit a MONDO child and a separate Disease entry.
grouping_basis:
- SHARED_MECHANISM
- SHARED_TREATMENT_RESPONSE
- CLINICAL_CONVENTION
- OTHER
grouping_rationale: >-
  Grouped as etiologic-species strata of the same intracellular zoonotic
  bacterial disease. Every member is human brucellosis seeded by a named
  Brucella species, funnels through phagocyte uptake and intracellular
  persistence in a Brucella-containing vacuole, and is treated with prolonged
  cell-penetrant combination therapy.

  The members are deliberately kept as separate Disease entries because the
  causative species changes the reservoir and clinical exposure history that
  drive suspicion, diagnosis, and public-health action. B. melitensis
  brucellosis is the small-ruminant/dairy-associated, globally prominent smooth
  Brucella stratum. B. canis brucellosis is maintained in dogs, can arise from
  pet, breeding-dog, occupational, or laboratory exposure, and can be missed by
  human serologic assays designed for smooth Brucella antigens.
membership_criteria:
- description: >-
    A disease belongs to the species-defined brucelloses if it is human
    brucellosis caused by a named Brucella species and carries a curated
    species-specific Disease entry rather than remaining folded into the
    all-cause Brucellosis entry.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      Caused by a named Brucella species with a reservoir, exposure context,
      diagnostic distinction, or epidemiology that warrants species-level
      curation.
members:
- member: Brucella Melitensis Brucellosis
  member_type: DISEASE
  display_name: Brucella melitensis brucellosis
  differentiating_mechanisms:
  - description: >-
      Small-ruminant-associated human brucellosis that predominates in many
      culture-confirmed case series and follows sheep/goat and unpasteurized
      dairy exposure rather than dog contact.
- member: Brucella Canis Brucellosis
  member_type: DISEASE
  display_name: Brucella canis brucellosis
  differentiating_mechanisms:
  - description: >-
      Dog-associated human brucellosis whose rough lipopolysaccharide makes
      smooth-Brucella serology insensitive and whose exposure history centers on
      infected dogs, canine reproductive fluids and tissues, and laboratory
      cultures rather than livestock dairy.
references:
- reference: DOI:10.1017/S0950268824000803
  title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
  findings:
  - statement: >-
      B. melitensis is an epidemiologically dominant species stratum in a
      national culture-confirmed human brucellosis series.
    supporting_text: Brucella melitensis was the dominant species (99.6%).
- reference: PMID:40070936
  title: "Brucellosis in humans caused by Brucella canis: A scoping review."
  findings:
  - statement: >-
      Human B. canis brucellosis is a distinct clinical literature of infections
      linked mostly to dogs and laboratory exposure.
    supporting_text: >-
      A known or suspected source of exposure was reported for 56 cases; 45
      (80%) were linked to dogs and 11 (20%) to laboratory exposure.
notes: >-
  This grouping currently lists the species-defined brucellosis entries that are
  curated on main once Brucella_Canis_Brucellosis lands. Other Brucella species
  children should be added only after they have their own validated Disease
  entries.

  The membership criterion uses an `OTHER` leaf to express a named Brucella
  causative species because `CriterionPredicateEnum` has no infectious-agent
  predicate. The same schema gap is recorded by the Treponematoses and Viral
  Hemorrhagic Fevers groupings.

name: Tyrosinemias
creation_date: '2026-11-18T00:00:00Z'
description: >-
  Hereditary tyrosinemias types I, II, and III, caused by deficiencies of
  distinct enzymes in tyrosine catabolism.
grouping_basis:
- SHARED_PATHWAY
- SHARED_PHENOTYPE
grouping_rationale: >-
  The shared axis is impaired tyrosine catabolism and its biochemical phenotype,
  rather than a single downstream injury mechanism. These diseases remain
  separate entries because FAH, TAT, and HPD deficiencies block different
  steps, produce different metabolite profiles, and have different clinical
  consequences. FAH deficiency produces toxic downstream metabolites with
  hepatorenal injury; TAT deficiency characteristically affects the cornea and
  palmoplantar skin; HPD deficiency has a variable neurological phenotype.
  The explicit union captures the phenotypic series without merging these
  distinct causal chains into one Disease.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0004741
      label: tyrosinemia
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The grouping covers hereditary tyrosinemias types I, II, and III.
      MONDO:0004741 is broader: its September 2026 hierarchy also includes
      MONDO:0018083 (transient tyrosinemia of the newborn), which is outside
      this hereditary series. broadMatch reads from this grouping to the
      broader MONDO class. We therefore do not copy MONDO's exact mapping
      to PS276700 as an exact mapping of this grouping to MONDO.
  omimps_mappings:
  - term:
      id: OMIMPS:276700
      label: Tyrosinemia
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series; MONDO
    mapping_justification: >-
      PS276700 contains OMIM:276700 (type I), OMIM:276600 (type II), and
      OMIM:276710 (type III) in the inspected January 2026 OMIM snapshot.
      Each has a separate Disease entry below. This is an exact mapping to
      their series-level union, not to the individual OMIM:276700 record.
membership_criteria:
- description: >-
    Each member has impaired tyrosine catabolism associated with FAH, TAT,
    or HPD deficiency. The computable audit checks annotation of the pathway
    and one of these genes. These are necessary conditions, not a sufficient
    diagnostic definition: gene identity alone does not distinguish allelic
    diseases, and pathway involvement alone also includes alkaptonuria.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_BIOLOGICAL_PROCESS
      biological_processes:
      - preferred_term: Tyrosine catabolism
        term:
          id: GO:0006572
          label: L-tyrosine catabolic process
        modifier: DECREASED
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: FAH
          term:
            id: hgnc:3579
            label: FAH
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: TAT
          term:
            id: hgnc:11573
            label: TAT
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: HPD
          term:
            id: hgnc:5147
            label: HPD
members:
- member: Tyrosinemia Type I
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      FAH deficiency permits accumulation of fumaryl- and maleylacetoacetate,
      causing hepatorenal and neurological toxicity.
    gene:
      preferred_term: FAH
      term:
        id: hgnc:3579
        label: FAH
    evidence:
    - reference: PMID:38505790
      reference_title: "Decoding hepatorenal tyrosinemia type 1: Unraveling the impact of early detection, NTBC, and the role of liver transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Hepatorenal tyrosinemia type 1 (HT-1) is a rare autosomal recessive disease that results from a deficiency of fumaryl acetoacetate hydrolase (FAH), a critical enzyme in the catabolic pathway for tyrosine.
    - reference: PMID:38505790
      reference_title: "Decoding hepatorenal tyrosinemia type 1: Unraveling the impact of early detection, NTBC, and the role of liver transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This leads to the accumulation of toxic metabolites such as fumaryl and maleylacetoacetate, which can damage the liver, kidneys, and nervous system.
- member: Tyrosinemia Type II
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      TAT deficiency causes the oculocutaneous form, with keratitis and
      palmoplantar hyperkeratosis accompanying elevated tyrosine.
    gene:
      preferred_term: TAT
      term:
        id: hgnc:11573
        label: TAT
    evidence:
    - reference: PMID:1357662
      reference_title: "Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tyrosinemia type II (Richner-Hanhart syndrome, RHS) is a disease of autosomal recessive inheritance characterized by keratitis, palmoplantar hyperkeratosis, mental retardation, and elevated blood tyrosine levels.
    - reference: PMID:1357662
      reference_title: "Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The disease results from deficiency in hepatic tyrosine aminotransferase
- member: Tyrosinemia Type III
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Recessive HPD deficiency blocks the second step of tyrosine catabolism.
      Neurological involvement is variable; tyrosine concentration and enzyme
      deficiency do not reliably predict the clinical phenotype.
    gene:
      preferred_term: HPD
      term:
        id: hgnc:5147
        label: HPD
    evidence:
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tyrosinemia type III (OMIM 276710) is an autosomal recessive disorder caused by the deficiency of 4-hydroxyphenylpyruvate dioxygenase (HPD), the second enzyme in the tyrosine catabolic pathway.
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype.
references:
- reference: PMID:38505790
  title: 'Decoding hepatorenal tyrosinemia type 1: Unraveling the impact of early detection, NTBC, and the role of liver transplantation.'
- reference: PMID:1357662
  title: Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II.
- reference: PMID:10942115
  title: Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III.
notes: >-
  The pathway and gene criterion explains common features of the explicitly
  listed members without inferring membership from a MONDO ancestor or a
  gene list. The criteria
  check curated process and gene annotations; they do not verify the direction
  of process change or establish pathogenicity of individual alleles.
  Transient neonatal hypertyrosinemia and secondary tyrosine elevation are
  outside this hereditary series. Alkaptonuria shares the catabolic pathway
  but has a different enzyme defect (HGD). HPD-associated dominant
  hawkinsinuria is an allelic boundary case, not a type III member.

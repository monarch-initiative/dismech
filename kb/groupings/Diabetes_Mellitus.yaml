name: Diabetes Mellitus
display_name: Diabetes mellitus (etiologic types)
creation_date: "2026-07-25T00:00:00Z"
description: >-
  Diabetes mellitus is a clinically convergent group of etiologically distinct
  disorders that share the defining feature of chronic hyperglycemia arising from
  defects in insulin secretion, insulin action, or both. This grouping is a
  curated union over the mechanistically distinct diabetes Disease entries
  (autoimmune type 1, insulin-resistant type 2, malnutrition-related / "type 5",
  and gestational diabetes) and the nested Monogenic Diabetes grouping. They are
  deliberately kept as separate entries because they differ
  in primary mechanism, genetics, body habitus, ketosis propensity, and
  treatment. They converge downstream on a shared chronic-hyperglycemia-driven
  micro- and macrovascular complication cascade.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped on a shared defining phenotype (chronic hyperglycemia) and long-standing
  clinical convention, NOT on a shared upstream mechanism: the members reach
  hyperglycemia by fundamentally different routes. Type 1 is a T-cell-mediated
  autoimmune destruction of beta cells producing absolute insulin deficiency;
  type 2 is peripheral insulin resistance with progressive beta-cell secretory
  failure and relative insulin deficiency; malnutrition-related (type 5) diabetes
  is insulin deficiency from impaired beta-cell development/function in the
  setting of chronic undernutrition; gestational diabetes is insulin resistance
  of pregnancy outpacing beta-cell compensation; and the monogenic forms are
  single-gene defects, mostly of the beta cell. The members are therefore kept as separate
  Disease entries rather than merged into one; this grouping sits over those
  distinct entities and records why they belong together while remaining
  mechanistically split. The shared downstream chronic-hyperglycemia complication
  cascade (AGE-RAGE / oxidative stress -> endothelial dysfunction -> micro- and
  macrovascular injury) is the convergence point common to all members.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005015
      label: diabetes mellitus
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      This grouping is the diabetes mellitus class. No disease entry holds
      MONDO:0005015 as its disease_term: the umbrella Disease entry that did was
      retired once its type-specific content had moved to the per-type entries
      and its monogenic catalogue to the Monogenic Diabetes grouping's members.
      The grouping is a curated union and stands on its own rationale rather
      than recapitulating the MONDO hierarchy.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All listed members, including those reached through the nested
        Monogenic Diabetes grouping, are is-a descendants of MONDO:0005015.
        MONDO also places diabetic ketoacidosis under diabetes mellitus; it is
        curated as an acute complication (a phenotype of the type entries), not
        as a member.
membership_criteria:
- description: >-
    A disorder belongs to the diabetes mellitus grouping if chronic hyperglycemia
    is a defining, near-universal feature of the disease (whatever the upstream
    route by which insulin secretion or action fails). HPO files Diabetes
    mellitus outside Hyperglycemia, and several syndromic members record only
    the former, so either term satisfies the criterion.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    description: Hyperglycaemia or diabetes mellitus is present in essentially all cases.
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      description: Hyperglycaemia.
      phenotype_term:
        preferred_term: Hyperglycemia
        term:
          id: HP:0003074
          label: Hyperglycemia
      min_frequency: FREQUENT
    - criterion_predicate: HAS_PHENOTYPE
      description: Diabetes mellitus, including its neonatal and other subclasses.
      phenotype_term:
        preferred_term: Diabetes mellitus
        term:
          id: HP:0000819
          label: Diabetes mellitus
      min_frequency: FREQUENT
members:
- member: Type I Diabetes
  member_type: DISEASE
  display_name: Type 1 diabetes mellitus
  differentiating_mechanisms:
  - description: >-
      Genetically susceptible (notably HLA class II) autoimmune, T-cell-mediated
      destruction of insulin-producing pancreatic beta cells, producing ABSOLUTE
      insulin deficiency, islet autoantibodies, lifelong exogenous-insulin
      dependence, and a propensity to diabetic ketoacidosis. Distinguished from
      type 2 by autoimmunity and absolute (rather than relative) insulin loss.
- member: Type 2 Diabetes Mellitus
  member_type: DISEASE
  display_name: Type 2 diabetes mellitus
  differentiating_mechanisms:
  - description: >-
      Peripheral insulin resistance (muscle, liver, adipose) with compensatory
      hyperinsulinemia that eventually fails as beta-cell secretory capacity
      declines, giving RELATIVE insulin deficiency; hepatic glucose overproduction
      and incretin-axis dysfunction contribute. Driven by adiposity, physical
      inactivity, and polygenic susceptibility; typically ketosis-resistant.
      Distinguished from type 1 by insulin resistance and preserved (if
      inadequate) endogenous insulin.
- member: Malnutrition-Related Diabetes Mellitus
  member_type: DISEASE
  display_name: Malnutrition-related diabetes mellitus (type 5)
  differentiating_mechanisms:
  - description: >-
      Insulin deficiency from impaired pancreatic beta-cell development and
      function in the setting of early-life and ongoing chronic undernutrition,
      rather than autoimmunity or insulin resistance. Affected individuals are
      typically lean and present with marked hyperglycemia yet relative
      resistance to ketosis, distinguishing it from type 1. Seen predominantly
      in low-resource settings.
- member: Gestational Diabetes Mellitus
  member_type: DISEASE
  display_name: Gestational diabetes mellitus
  differentiating_mechanisms:
  - description: >-
      Hyperglycaemia first arising or first recognised in pregnancy, when
      pregnancy-induced insulin resistance outpaces beta-cell compensation;
      it usually resolves after delivery but marks a raised later risk of
      type 2 diabetes.
- member: Monogenic Diabetes
  member_type: GROUPING
  display_name: Monogenic diabetes
  differentiating_mechanisms:
  - description: >-
      Single-gene forms: maturity-onset diabetes of the young, permanent and
      transient neonatal diabetes, and the syndromes in which monogenic
      diabetes is defining (Wolfram, Wolcott-Rallison, thiamine-responsive
      megaloblastic anaemia, Mitchell-Riley, NDM-CH). The gene sets the
      mechanism and often the treatment.
notes: >-
  This grouping is how the knowledge base represents diabetes mellitus as a
  whole: there is no umbrella Disease entry. The shared complication cascade is
  the diabetic_vascular_complications module, to which the member entries
  conform. Two MONDO subtypes are not yet curated and sit in the stub queue:
  maternally-inherited diabetes and deafness and lipoatrophic diabetes. See
  docs/curation-notes/diabetes-mellitus-grouping-refactor.md for the refactor
  history.

name: Leukodystrophies
creation_date: "2026-10-16T00:00:00Z"
description: >-
  Heritable disorders of central nervous system white matter whose primary
  pathology lies in glial cells or the myelin sheath, as defined by the 2015
  expert consensus case definition: oligodendrocytes, astrocytes, microglia or
  other non-neuronal cells, with or without peripheral nerve involvement. The
  mechanisms span myelin structural proteins, lysosomal and peroxisomal lipid
  metabolism, astrocyte and microglial dysfunction, ion and water homeostasis,
  and the translational stress response.
grouping_basis:
- CLINICAL_CONVENTION
- SHARED_PHENOTYPE
grouping_rationale: >-
  Membership follows the consensus classification of Vanderver et al. 2015
  (PMID:25649058), which defined leukodystrophy by the cell type primarily
  involved rather than by organelle or by whether the disease progresses. The
  same paper set apart a second class, the genetic leukoencephalopathies:
  heritable disorders with significant white matter abnormality but primary
  neuronal involvement or prominent systemic disease (mitochondrial disorders
  such as MELAS and MNGIE, GM1 and GM2 gangliosidosis, the neuronal ceroid
  lipofuscinoses, the mucopolysaccharidoses). These are deliberately excluded,
  even where MONDO files them under leukodystrophy, as are inherited
  vasculopathies such as CADASIL and COL4A1/2 disease. The grouping is
  therefore narrower than MONDO:0019046, which is why the MONDO mapping is a
  broadMatch. Members remain separate Disease entries because the causal
  mechanisms differ; the hypomyelinating subset is nested as its own grouping
  because it shares a primary failure of myelin formation.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019046
      label: leukodystrophy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO's leukodystrophy class also contains mitochondrial,
      glycosylation and other disorders that the 2015 consensus classifies as
      genetic leukoencephalopathies, so the MONDO class is broader than this
      grouping.
membership_criteria:
- description: >-
    A member is a heritable disorder of CNS white matter whose primary
    pathology is in glia or the myelin sheath, and that is not better
    classified as a genetic leukoencephalopathy (primary neuronal involvement or
    dominant systemic disease) or a primary vasculopathy.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      Meets the Vanderver et al. 2015 consensus case definition of
      leukodystrophy. Modeled as an OTHER leaf because the definition turns on
      which cell type is primarily involved, which no single phenotype or
      module annotation in the member entries records, so the evaluator
      returns UNKNOWN rather than checking it.
  evidence:
  - reference: PMID:25649058
    reference_title: "Case definition and classification of leukodystrophies and leukoencephalopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Leukodystrophies are heritable disorders affecting the white matter of the central nervous system with or without peripheral nervous system involvement. These disorders have in common glial cell or myelin sheath abnormalities."
    explanation: The consensus case definition this grouping's membership follows.
  - reference: PMID:25649058
    reference_title: "Case definition and classification of leukodystrophies and leukoencephalopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Specific features that lead to this classification were strong evidence for primary neuronal involvement and prominent systemic manifestations which overshadowed the white matter abnormalities"
    explanation: The exclusion boundary separating genetic leukoencephalopathies from leukodystrophies.
members:
- member: Hypomyelinating Leukodystrophies
  member_type: GROUPING
  differentiating_mechanisms:
  - description: >-
      The nested hypomyelinating subset: disorders in which CNS myelin is never adequately formed. Pelizaeus-Merzbacher disease, Pelizaeus-Merzbacher-like disease 1 (HLD2), hypomyelination with congenital cataract (HLD5), 4H/POLR-related leukodystrophy, H-ABC (TUBB4A) and HBSL are the members named in the 2015 consensus table; the other numbered hypomyelinating leukodystrophies enter through the same nested grouping. Per-disease mechanisms are recorded on that grouping's member rows.
- member: adrenoleukodystrophy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Peroxisomal very-long-chain fatty acid import defect (ABCD1) causing inflammatory cerebral demyelination and adrenomyeloneuropathy.
    gene:
      preferred_term: ABCD1
      term:
        id: hgnc:61
        label: ABCD1
- member: Hereditary Diffuse Leukoencephalopathy with Spheroids
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Adult-onset microglial disease (CSF1R) with axonal spheroids and pigmented glia; the primary cell is microglia rather than oligodendrocyte.
    gene:
      preferred_term: CSF1R
      term:
        id: hgnc:2433
        label: CSF1R
- member: Aicardi-Goutieres Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Type I interferonopathy from defective nucleic-acid metabolism or sensing, with diffuse white matter disease and calcification; included in the consensus table with a recorded caveat about its microangiopathy.
- member: Alexander Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Astrocytopathy from dominant gain-of-function GFAP variants forming Rosenthal fibres, with secondary myelin loss.
    gene:
      preferred_term: GFAP
      term:
        id: hgnc:4235
        label: GFAP
- member: Adult-Onset Autosomal Dominant Demyelinating Leukodystrophy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      LMNB1 duplication or upstream deletion raising lamin B1 dosage, with adult-onset demyelination and early autonomic failure.
    gene:
      preferred_term: LMNB1
      term:
        id: hgnc:6637
        label: LMNB1
- member: Canavan disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Aspartoacylase deficiency (ASPA) leaving oligodendrocytes without acetate from N-acetylaspartate, with spongiform vacuolation of white matter.
    gene:
      preferred_term: ASPA
      term:
        id: hgnc:756
        label: ASPA
- member: Cerebrotendinous xanthomatosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Sterol 27-hydroxylase deficiency (CYP27A1) with cholestanol deposition in white matter and tendons; treatable with chenodeoxycholic acid.
    gene:
      preferred_term: CYP27A1
      term:
        id: hgnc:2605
        label: CYP27A1
- member: CLCN2-Related Leukoencephalopathy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      ClC-2 chloride channel loss in glia causing intramyelinic oedema.
    gene:
      preferred_term: CLCN2
      term:
        id: hgnc:2020
        label: CLCN2
- member: Leukoencephalopathy With Vanishing White Matter
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      eIF2B deficiency dysregulating the integrated stress response in astrocytes and oligodendrocytes, with stress-provoked white matter rarefaction.
- member: Fucosidosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Lysosomal alpha-L-fucosidase deficiency (FUCA1) with storage and white matter hypomyelination.
    gene:
      preferred_term: FUCA1
      term:
        id: hgnc:4006
        label: FUCA1
- member: Krabbe Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Galactocerebrosidase deficiency (GALC) with psychosine toxicity to oligodendrocytes and globoid cell demyelination.
    gene:
      preferred_term: GALC
      term:
        id: hgnc:4115
        label: GALC
- member: Krabbe Disease Due To Saposin A Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The PSAP saposin A variant of globoid cell leukodystrophy, with normal GALC but loss of its activator protein.
    gene:
      preferred_term: PSAP
      term:
        id: hgnc:9498
        label: PSAP
- member: Metachromatic Leukodystrophy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Arylsulfatase A deficiency (ARSA), or saposin B deficiency, with sulfatide storage and demyelination of CNS and peripheral nerve.
    gene:
      preferred_term: ARSA
      term:
        id: hgnc:713
        label: ARSA
- member: Oculodentodigital Dysplasia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Connexin-43 (GJA1) gap-junction disease in which white matter abnormality accompanies the craniofacial, dental and digital malformations.
    gene:
      preferred_term: GJA1
      term:
        id: hgnc:4274
        label: GJA1
- member: Zellweger Spectrum Disorders
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Peroxisome biogenesis disorders (PEX genes), including Zellweger syndrome, neonatal adrenoleukodystrophy and infantile Refsum disease, with leukodystrophy among multisystem features.
- member: D-Bifunctional Protein Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Single-enzyme peroxisomal beta-oxidation defect (HSD17B4).
    gene:
      preferred_term: HSD17B4
      term:
        id: hgnc:5213
        label: HSD17B4
- member: Sterol Carrier Protein 2 Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Single-enzyme peroxisomal beta-oxidation defect (SCPx, SCP2) with adult-onset leukoencephalopathy.
    gene:
      preferred_term: SCP2
      term:
        id: hgnc:10606
        label: SCP2
- member: Peroxisomal Acyl-CoA Oxidase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Single-enzyme peroxisomal beta-oxidation defect (ACOX1) with neonatal hypotonia, seizures and demyelination.
    gene:
      preferred_term: ACOX1
      term:
        id: hgnc:119
        label: ACOX1
- member: Adult Polyglucosan Body Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Glycogen branching enzyme deficiency (GBE1) with polyglucosan bodies in axons and glia and an adult-onset leukodystrophy with neurogenic bladder.
    gene:
      preferred_term: GBE1
      term:
        id: hgnc:4180
        label: GBE1
- member: Cystic Leukoencephalopathy Without Megalencephaly
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      RNase T2 deficiency (RNASET2) with anterior temporal cysts and multifocal white matter disease mimicking congenital CMV infection.
    gene:
      preferred_term: RNASET2
      term:
        id: hgnc:21686
        label: RNASET2
- member: Salla Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Sialin (SLC17A5) lysosomal free sialic acid transport defect, the slowly progressive end of the sialic acid storage spectrum, with hypomyelination.
    gene:
      preferred_term: SLC17A5
      term:
        id: hgnc:10933
        label: SLC17A5
- member: Free Sialic Acid Storage Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The SLC17A5 sialic acid storage spectrum as a whole, including infantile sialic acid storage disease and the intermediate form.
    gene:
      preferred_term: SLC17A5
      term:
        id: hgnc:10933
        label: SLC17A5
- member: Sjogren-Larsson Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Fatty aldehyde dehydrogenase deficiency (ALDH3A2) with ichthyosis, spastic diplegia and periventricular white matter disease.
    gene:
      preferred_term: ALDH3A2
      term:
        id: hgnc:403
        label: ALDH3A2
- member: PCWH syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      SOX10 truncating variants escaping nonsense-mediated decay, combining central dysmyelinating leukodystrophy with peripheral neuropathy, Waardenburg syndrome and Hirschsprung disease.
    gene:
      preferred_term: SOX10
      term:
        id: hgnc:11190
        label: SOX10
- member: Chromosome 18q Deletion Syndrome
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Contiguous deletion including MBP, whose haploinsufficiency is associated with delayed or deficient myelination.
notes: >-
  Disorders in the consensus table with no dismech entry at the time of
  writing: leukoencephalopathy with brainstem and spinal cord involvement and
  lactate elevation (LBSL, DARS2), leukoencephalopathy with thalamus and
  brainstem involvement and high lactate (LTBL, EARS2), and megalencephalic
  leukoencephalopathy with subcortical cysts (MLC1, HEPACAM); all three
  have stubs in the curation queue. The individual Zellweger-type peroxisome
  biogenesis disorder entries (PBD 3A, 4A, 6A, 11A, 12A) are represented through
  the Zellweger Spectrum Disorders member rather than listed one by one.

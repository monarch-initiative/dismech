name: Atelosteogenesis Syndromes
creation_date: '2026-11-20T20:33:47Z'
description: The three numbered atelosteogenesis disorders share severe short-limb skeletal
  dysplasia, but types I and III are FLNB-related cytoskeletal disorders whereas type II is
  an SLC26A2 sulfate-transport disorder.
grouping_basis:
- SHARED_PHENOTYPE
- CLINICAL_CONVENTION
grouping_rationale: 'The grouping follows the overlapping skeletal phenotype and established
  numbered atelosteogenesis convention. It is not a single-gene or single-proximal-mechanism
  family: FLNB gain-of-function and impaired cartilage matrix sulfation are different lesions.
  Types I and III remain separately curated clinical entities within the same FLNB spectrum
  because severity and survival differ; type II is additionally distinguished by its recessive
  transporter mechanism. Neither universal perinatal lethality nor one inheritance pattern
  defines the union. Larsen syndrome and other FLNB disorders, and diastrophic dysplasia and
  other SLC26A2 disorders, remain outside this named clinical series.'
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:108720
      label: Atelosteogenesis
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 series contains OMIM:108720, OMIM:108721, OMIM:256050,
      represented by the separately curated Disease members of this union. The series identifier
      denotes the group rather than its first numbered member.
  mondo_mappings:
  - term:
      id: MONDO:0000389
      label: atelosteogenesis
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: The September 2026 MONDO direct children match the numbered disease
      concepts in this explicit union; the mapping does not merge their separately curated
      mechanisms.
membership_criteria:
- description: Each member entry annotates rhizomelia together with involvement of FLNB or
    SLC26A2. This is a necessary check of disease-level annotations, not a diagnostic rule
    for an individual or a claim that every patient manifests the finding. Gene annotations
    alone neither establish causation nor include all allelic disorders; the criteria are
    not sufficient to discover membership.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Rhizomelia
        term:
          id: HP:0008905
          label: Rhizomelia
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: FLNB
          term:
            id: hgnc:3755
            label: FLNB
      - criterion_predicate: HAS_GENE
        gene:
          preferred_term: SLC26A2
          term:
            id: hgnc:10994
            label: SLC26A2
members:
- member: Atelosteogenesis Type I
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Type I is the severe, usually perinatally lethal end of the monoallelic FLNB
      gain-of-function spectrum. It is a cytoskeletal disorder rather than a sulfate-transporter
      deficiency.
    gene:
      preferred_term: FLNB
      term:
        id: hgnc:3755
        label: FLNB
    evidence:
    - reference: PMID:20301736
      reference_title: FLNB-Related Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum of
        phenotypic severity ranging from apparently isolated clubfoot to Larsen syndrome (FLNB-LS),
        atelosteogenesis type 3 (FLNB-AO3), and atelosteogenesis type 1 (FLNB-AO1), which
        is perinatal lethal.
      explanation: The clinical spectrum distinguishes FLNB-associated types I and III from
        the transporter-related type II; it also places other FLNB phenotypes outside the
        numbered atelosteogenesis union.
- member: Atelosteogenesis Type II
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Type II results from biallelic SLC26A2 defects that impair sulfate uptake
      and sulfation of cartilage macromolecules. Its shared skeletal appearance does not imply
      the FLNB mechanism of types I and III.
    gene:
      preferred_term: SLC26A2
      term:
        id: hgnc:10994
        label: SLC26A2
    evidence:
    - reference: PMID:8571951
      reference_title: 'Atelosteogenesis type II is caused by mutations in the diastrophic
        dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving
        three chondrodysplasias.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Here, we report that AOII patients also have DTDST mutations, which lead to
        defective uptake of inorganic sulfate and insufficient sulfation of macromolecules
        by patient mesenchymal cells in vitro.
      explanation: Patient-derived cells establish the sulfate-transport and macromolecular-sulfation
        defect in type II.
- member: Atelosteogenesis Type III
  member_type: DISEASE
  differentiating_mechanisms:
  - description: Type III shares monoallelic FLNB gain-of-function with type I but occupies
      a less severe clinical part of that spectrum, with survival beyond the perinatal period
      possible. The grouping preserves the existing clinical split rather than using gene
      identity as the disease boundary.
    gene:
      preferred_term: FLNB
      term:
        id: hgnc:3755
        label: FLNB
    evidence:
    - reference: PMID:20301736
      reference_title: FLNB-Related Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum of
        phenotypic severity ranging from apparently isolated clubfoot to Larsen syndrome (FLNB-LS),
        atelosteogenesis type 3 (FLNB-AO3), and atelosteogenesis type 1 (FLNB-AO1), which
        is perinatal lethal.
      explanation: The source places types I and III at different points of the FLNB severity
        spectrum.

name: Intoxication-Type Inborn Errors of Metabolism
display_name: Intoxication-Type Inborn Errors of Metabolism (Acute Metabolic Decompensation)
creation_date: "2026-08-02T01:01:07Z"
description: >-
  The intoxication-type inborn errors of intermediary metabolism are the group of
  Mendelian metabolic disorders in which a deficient enzyme or transporter causes
  accumulation of an upstream toxic metabolite and/or an energy deficit that is
  clinically silent at baseline and is unmasked by catabolic stress (intercurrent
  illness, fasting, surgery, childbirth, or a protein load). The shared behaviour
  is an acute, potentially reversible metabolic crisis — metabolic acidosis,
  hyperammonemia, and/or hypoglycemia — progressing to acute encephalopathy and
  multiorgan involvement. This is the axis that determines emergency management
  (stop protein, reverse catabolism with glucose, scavenge ammonia, dialyse), and
  it cuts across the substrate-partitioned classes: urea cycle disorders, organic
  acidemias, aminoacidopathies, and selected fatty-acid oxidation defects all
  contribute members.
grouping_basis:
- SHARED_MECHANISM
- SHARED_TREATMENT_RESPONSE
grouping_rationale: >-
  Grouped on a shared final-common pathway rather than a shared substrate: every
  member conforms to the metabolic_intoxication_decompensation module (enzymatic
  block -> toxic metabolite accumulation and energy deficit -> acute metabolic
  decompensation -> acute metabolic encephalopathy). This is deliberately
  orthogonal to the conventional biochemical partition — a curator looking for
  "which disorders behave as an acute reversible intoxication crisis" cannot get
  that answer from the urea-cycle / organic-aciduria / fatty-acid-oxidation split,
  because the answer spans all three. Members are kept as separate Disease entries
  because they differ in the deficient enzyme, the accumulating metabolite, the
  dominant biochemical signature (hyperammonemia vs ketoacidosis vs hypoglycemia),
  and the specific chronic sequelae. The criteria are NECESSARY, not
  NECESSARY_AND_SUFFICIENT: conforming to the module characterizes every member,
  but dismech has not yet curated the full set of intoxication-type disorders, so
  the criteria should be used to audit listed members rather than to close the
  class. Note the deliberate exclusions — the "complex molecule" disorders
  (lysosomal storage, peroxisomal, CDG) do not decompensate acutely and are NOT
  members.

  Naming caveat, recorded rather than hidden: this grouping is NOT strictly
  coextensive with Saudubray group 1, and the display_name deliberately avoids
  claiming so. Saudubray places fatty-acid-oxidation and ketogenesis defects in
  the ENERGY-DEFICIENCY group, yet Carnitine Palmitoyltransferase II Deficiency
  and 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency are members here, and
  TANGO2 Deficiency Disorder fits neither classical group. Membership is therefore
  defined by the shared BEHAVIOUR — a catabolic-stress-triggered acute
  decompensation — rather than by the classical substrate taxonomy, which is why
  the display_name reads "Acute Metabolic Decompensation". If the class is later
  aligned strictly to Saudubray group 1, those three members are the ones to
  reconsider first.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019052
      label: inborn errors of metabolism
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      broadMatch: this grouping is the intoxication-type subset of the MONDO
      inborn-errors-of-metabolism class. MONDO has no term for the
      intoxication/energy-deficiency/complex-molecule axis at all — its metabolic
      subclasses are partitioned by substrate (urea cycle disorder, classic
      organic aciduria, disorder of fatty acid oxidation and ketogenesis), which
      cross-cuts rather than contains this grouping. broadMatch is therefore the
      only honest predicate available.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        MONDO lacks a mechanism-based intoxication-type class; see
        docs/reports/mondo-mechanism-classification-proposal-2026-08-01.md §3.1
        for the proposed new term. The descendant set of MONDO:0019052 is far
        broader than this grouping and must not be treated as a curation-gap list.
membership_criteria:
- description: >-
    Every member is an inborn error of intermediary metabolism whose
    pathophysiology conforms to the metabolic intoxication and acute
    decompensation module — an enzymatic block producing toxic-metabolite
    accumulation and/or energy deficit that is unmasked by catabolic stress.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: metabolic_intoxication_decompensation
    description: >-
      Conforms to the metabolic_intoxication_decompensation module at one or
      more nodes.
members:
- member: Ornithine Carbamoyltransferase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      X-linked OTC deficiency blocks the urea cycle at carbamoyl-phosphate
      condensation with ornithine; the accumulating metabolite is ammonia, and
      the crisis is a pure hyperammonemic encephalopathy with astrocyte glutamine
      osmotic swelling and cerebral edema, without metabolic acidosis.
    gene:
      preferred_term: OTC
      term:
        id: hgnc:8512
        label: OTC
- member: Carbamoyl Phosphate Synthetase I Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Block at the first and rate-limiting urea-cycle step, upstream of OTC, so
      neither citrulline nor orotic acid accumulates — the biochemical signature
      that distinguishes it from OTC deficiency despite an identical
      hyperammonemic crisis.
    gene:
      preferred_term: CPS1
      term:
        id: hgnc:2323
        label: CPS1
- member: Citrullinemia Type I
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Argininosuccinate synthetase deficiency blocks citrulline condensation with
      aspartate, producing massive citrulline accumulation alongside
      hyperammonemia.
    gene:
      preferred_term: ASS1
      term:
        id: hgnc:758
        label: ASS1
- member: Argininosuccinic Aciduria
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Argininosuccinate lyase deficiency accumulates argininosuccinate itself;
      hyperammonemia is typically milder than in proximal urea-cycle blocks, but
      members uniquely develop trichorrhexis nodosa and a hepatic phenotype
      attributed to nitric-oxide deficiency.
    gene:
      preferred_term: ASL
      term:
        id: hgnc:746
        label: ASL
- member: Arginase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The distal urea-cycle block, and the atypical member: arginine accumulation
      dominates and the presentation is a chronic progressive spastic diplegia
      rather than the neonatal hyperammonemic crisis typical of the proximal
      blocks.
    gene:
      preferred_term: ARG1
      term:
        id: hgnc:663
        label: ARG1
- member: Citrin Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A transporter rather than an enzyme defect — loss of the mitochondrial
      aspartate-glutamate carrier starves the urea cycle of aspartate and
      impairs the malate-aspartate shuttle, giving an age-dependent triad of
      neonatal cholestasis, a characteristic protein/fat-craving diet
      preference, and adult-onset citrullinemia type II.
    gene:
      preferred_term: SLC25A13
      term:
        id: hgnc:10983
        label: SLC25A13
- member: Methylmalonic Acidemia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Methylmalonyl-CoA mutase or cobalamin-cofactor deficiency accumulates
      methylmalonic acid and propionyl-CoA; crises are ketoacidotic with
      secondary hyperammonemia, and the characteristic chronic sequelae are
      bilateral globus pallidus injury and tubulointerstitial renal disease.
    gene:
      preferred_term: MMUT
      term:
        id: hgnc:7526
        label: MMUT
- member: Isovaleric Acidemia
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Isovaleryl-CoA dehydrogenase deficiency in leucine catabolism accumulates
      isovaleric acid, giving the pathognomonic "sweaty feet" odour during
      decompensation; glycine and carnitine conjugation provide the detoxification
      route exploited therapeutically.
    gene:
      preferred_term: IVD
      term:
        id: hgnc:6186
        label: IVD
- member: Beta-Ketothiolase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Mitochondrial acetoacetyl-CoA thiolase deficiency impairs both isoleucine
      catabolism and ketone-body utilisation, so decompensation is a severe
      ketoacidotic crisis; ammonia is usually normal, distinguishing it from the
      urea-cycle members.
    gene:
      preferred_term: ACAT1
      term:
        id: hgnc:93
        label: ACAT1
- member: 3-Methylcrotonyl-CoA Carboxylase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A biotin-dependent carboxylase block in leucine catabolism; notable as the
      member with the widest phenotypic range, from newborn-screening-detected
      biochemical-only status to acute Reye-like decompensation.
    gene:
      preferred_term: MCCC1
      term:
        id: hgnc:6936
        label: MCCC1
- member: 3-Methylglutaconic Aciduria Type I
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The only member in which 3-methylglutaconic aciduria reflects a true
      primary leucine-catabolic block (AUH/3-methylglutaconyl-CoA hydratase),
      rather than the secondary 3-MGA excretion seen in mitochondrial membrane
      disorders.
    gene:
      preferred_term: AUH
      term:
        id: hgnc:890
        label: AUH
- member: 3-Hydroxy-3-Methylglutaric Aciduria
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      HMG-CoA lyase sits at the junction of leucine catabolism and ketogenesis, so
      the block produces the distinctive combination of organic aciduria with
      hypoketotic hypoglycemia — the crisis lacks the protective ketone response
      available to the other organic acidemias.
    gene:
      preferred_term: HMGCL
      term:
        id: hgnc:5005
        label: HMGCL
- member: 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A pure ketogenesis defect: fasting cannot generate ketone bodies, so
      decompensation is hypoketotic hypoglycemia with hepatomegaly and no organic
      aciduria between episodes — biochemically silent when well, which makes it
      the hardest member to detect outside a crisis.
    gene:
      preferred_term: HMGCS2
      term:
        id: hgnc:5008
        label: HMGCS2
- member: Maple Syrup Urine Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Branched-chain alpha-ketoacid dehydrogenase deficiency accumulates leucine
      and its ketoacid; leucine itself is the neurotoxin and drives a
      characteristic intramyelinic cerebral edema, so treatment targets leucine
      specifically rather than ammonia or acidosis.
    gene:
      preferred_term: BCKDHA
      term:
        id: hgnc:986
        label: BCKDHA
- member: Holocarboxylase Synthetase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A cofactor-attachment defect rather than a single-enzyme block — failure to
      biotinylate all four biotin-dependent carboxylases produces a multiple
      carboxylase deficiency, and the member is distinctively biotin-responsive.
    gene:
      preferred_term: HLCS
      term:
        id: hgnc:4976
        label: HLCS
- member: Carbonic Anhydrase VA Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Loss of mitochondrial carbonic anhydrase VA starves several
      bicarbonate-dependent carboxylases at once, producing a combined
      hyperammonemia and hyperlactatemia; distinctively, the phenotype is
      limited to early childhood with good long-term outcome after crises are
      survived.
    gene:
      preferred_term: CA5A
      term:
        id: hgnc:1377
        label: CA5A
- member: Carnitine Palmitoyltransferase II Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The fatty-acid-oxidation member: blocked long-chain acyl-carnitine entry
      into the mitochondrion produces an energy deficit rather than a classical
      toxic metabolite, so decompensation is triggered by fasting or prolonged
      exercise and manifests as rhabdomyolysis with myoglobinuria.
    gene:
      preferred_term: CPT2
      term:
        id: hgnc:2330
        label: CPT2
- member: Lysinuric protein intolerance
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      A cationic amino-acid transporter defect, not an enzymatic block: failure of
      basolateral arginine/ornithine/lysine transport secondarily starves the urea
      cycle, so hyperammonemia is postprandial and protein-triggered, accompanied
      by a distinctive pulmonary alveolar proteinosis and immune dysregulation.
    gene:
      preferred_term: SLC7A7
      term:
        id: hgnc:11065
        label: SLC7A7
- member: TANGO2 Deficiency Disorder
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The mechanistic outlier and the most instructive member: TANGO2 is not a
      metabolic enzyme, yet its loss produces stress-triggered crises with
      rhabdomyolysis, hypoglycemia, and encephalopathy that phenocopy the group —
      uniquely accompanied by life-threatening ventricular arrhythmia and QT
      prolongation, which is why it is also a member of the inherited arrhythmia
      class.
    gene:
      preferred_term: TANGO2
      term:
        id: hgnc:25439
        label: TANGO2
notes: >-
  Curated as the dismech-side counterpart of proposed MONDO node #1 in
  docs/reports/mondo-mechanism-classification-proposal-2026-08-01.md. The
  grouping is auditable with `just check-groupings
  kb/groupings/Intoxication-Type_Inborn_Errors_of_Metabolism.yaml`. Members
  conform to the module at different nodes (some at the enzymatic-block node,
  some at the decompensation node), which is why the NECESSARY criterion targets
  the module as a whole rather than a single node.

  A second, GO-based criterion (HAS_BIOLOGICAL_PROCESS over urea cycle /
  amino-acid catabolism / energy generation) was drafted and deliberately
  removed: only 12 of the 19 members annotate one of those module-level GO terms,
  the remaining 7 annotating enzyme-specific terms instead (e.g. GO:0004494
  methylmalonyl-CoA mutase activity). Because the membership evaluator matches a
  criterion against the disease's own GO ids, that criterion would have reported
  7 NOT_SATISFIED violations for diseases that genuinely belong to the class —
  an artifact of annotation granularity, not a real membership problem. Adding
  GO-based criteria here should wait until the member entries are annotated at a
  consistent level.

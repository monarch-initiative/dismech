name: Mendelian Disorders of the Epigenetic Machinery
display_name: Mendelian Disorders of the Epigenetic Machinery (Chromatin Regulator
  Disorders)
creation_date: "2026-10-23T18:00:00Z"
description: >-
  Hereditary disorders caused by a germline variant, usually heterozygous loss of
  function, in a gene encoding a writer, eraser, reader or remodeler of chromatin
  marks or DNA methylation. Because the machinery is dosage sensitive, losing one
  copy disturbs chromatin state across many genes at once. The members share intellectual
  disability, often with growth abnormality (overgrowth or short stature) and characteristic
  facial features, and many carry a disease-specific DNA methylation signature in
  blood.
grouping_basis:
- SHARED_MECHANISM
- SHARED_GENE_FAMILY
grouping_rationale: >-
  Grouped on a shared class of molecular machine rather than on phenotype. Clinically
  these are separate named syndromes (Kabuki, Sotos, Weaver, Rubinstein-Taybi and
  others) recognised by their faces and growth patterns. What unites them is that
  the causal gene writes, erases, reads or remodels chromatin or DNA methylation.
  Members stay separate Disease entries because the specific mark or complex affected
  sets the phenotype: H3K36 methyltransferase loss (NSD1, SETD2) and PRC2 loss (EZH2)
  give overgrowth, while H3K4 methyltransferase loss (KMT2A, KMT2D) gives short stature.

  The criterion is NECESSARY, not NECESSARY_AND_SUFFICIENT. Every listed member conforms
  to the module, but many disorders of the epigenetic machinery are not yet curated,
  so the criterion must not be used to close the class.

  Cornelia de Lange syndrome is a boundary member. NIPBL loads cohesin, which shapes
  chromatin architecture rather than writing a mark, and the syndrome is also the
  founding member of the cohesinopathies. It is kept here because it conforms to the
  module and has a methylation signature, pending a decision on a separate cohesinopathy
  class.

  No MONDO class covers this grouping. It is proposed as proposal 13 in docs/reports/mondo-mechanism-classification-proposal-round-2-2026-10-23.md.
membership_criteria:
- description: >-
    Every member's pathophysiology conforms to the epigenetic machinery neurodevelopmental
    dysregulation module: loss of a chromatin or DNA-methylation regulator disturbs
    the neurodevelopmental transcriptional program.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: CONFORMS_TO_MODULE
    module: epigenetic_machinery_neurodevelopmental_dysregulation
    description: >-
      Conforms to the epigenetic_machinery_neurodevelopmental_dysregulation module
      at one or more nodes.

name: Disorders of Copper Metabolism
display_name: Disorders of Copper Metabolism
creation_date: "2026-08-16T15:30:00Z"
description: >-
  An auditable grouping of distinct DisMech disease entries whose primary
  genetic defect disrupts cellular copper transport, trafficking, or delivery.
  Members span copper overload from failed biliary excretion (ATP7B / Wilson
  disease) and secretory-pathway/trafficking defects that impair copper
  delivery and lower serum copper and ceruloplasmin (AP1S1 / MEDNIK syndrome
  and SLC33A1 / Huppke-Brendel syndrome).
grouping_basis:
- SHARED_PATHWAY
grouping_rationale: >-
  The members are kept as separate Disease entries because their proximal
  mechanisms differ: ATP7B is a copper-transporting P-type ATPase whose loss
  causes hepatic copper overload and toxic systemic accumulation; AP1S1 encodes
  an adaptor-protein-1 (AP-1) complex sigma subunit whose loss disrupts
  intracellular trafficking of copper pumps; and SLC33A1 encodes the ER
  acetyl-CoA transporter AT-1, whose deficiency lowers serum copper and
  ceruloplasmin. A grouping is useful because all three fall in the ICIMD
  "Copper" group (Disorders of trace elements and metals) and converge on
  disrupted copper homeostasis. Iron-primary disorders such as
  aceruloplasminemia (CP / ferroxidase deficiency) are intentionally excluded
  because their proximal lesion is iron export, not copper handling, despite
  the shared ceruloplasmin connection.
membership_criteria:
- description: >-
    A member has a primary genetic defect in a gene required for cellular copper
    transport, trafficking, or delivery.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    operands:
    - criterion_predicate: HAS_GENE
      gene:
        preferred_term: ATP7B
        term:
          id: hgnc:870
          label: ATP7B
      description: ATP7B copper-transporting P-type ATPase defect (Wilson disease).
    - criterion_predicate: HAS_GENE
      gene:
        preferred_term: AP1S1
        term:
          id: hgnc:559
          label: AP1S1
      description: >-
        AP1S1 adaptor-protein-1 complex subunit defect disrupting copper
        trafficking (MEDNIK syndrome).
    - criterion_predicate: HAS_GENE
      gene:
        preferred_term: SLC33A1
        term:
          id: hgnc:95
          label: SLC33A1
      description: >-
        SLC33A1 / AT-1 ER acetyl-CoA transporter defect lowering serum copper
        and ceruloplasmin (Huppke-Brendel syndrome).
members:
- member: Wilson Disease
  member_type: DISEASE
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  differentiating_mechanisms:
  - description: >-
      ATP7B loss impairs biliary copper excretion and ceruloplasmin loading,
      causing hepatic copper overload with toxic systemic (hepatic and
      neurologic) copper accumulation — copper OVERLOAD.
    gene:
      preferred_term: ATP7B
      term:
        id: hgnc:870
        label: ATP7B
- member: MEDNIK syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: MEDNIK syndrome
    term:
      id: MONDO:0012251
      label: MEDNIK syndrome
  differentiating_mechanisms:
  - description: >-
      AP1S1 loss of function disrupts AP-1-dependent intracellular trafficking
      of copper pumps, producing a mixed copper-metabolism and general
      trafficking phenotype (enteropathy, deafness, neuropathy, ichthyosis,
      keratoderma).
    gene:
      preferred_term: AP1S1
      term:
        id: hgnc:559
        label: AP1S1
- member: Huppke-Brendel syndrome
  member_type: DISEASE
  disease_term:
    preferred_term: Huppke-Brendel syndrome
    term:
      id: MONDO:0013772
      label: Huppke-Brendel syndrome
  differentiating_mechanisms:
  - description: >-
      SLC33A1 / AT-1 ER acetyl-CoA transporter deficiency lowers serum copper
      and ceruloplasmin with congenital cataracts, hearing loss, and severe
      developmental delay — a low-copper delivery phenotype.
    gene:
      preferred_term: SLC33A1
      term:
        id: hgnc:95
        label: SLC33A1

name: Chlamydia Trachomatis Infections
display_name: Chlamydia trachomatis infections
creation_date: "2026-11-15T04:00:00Z"
description: >-
  The Chlamydia trachomatis infections are the human diseases caused by
  C. trachomatis lineages that are clinically named and curated separately:
  blinding trachoma caused by ocular A-C strains, inclusion conjunctivitis
  caused by genital D-K strains inoculated onto conjunctiva, and invasive
  lymphogranuloma venereum caused by L1-L3 strains.
grouping_basis:
- SHARED_MECHANISM
- CLINICAL_CONVENTION
- OTHER
grouping_rationale: >-
  Grouped as the curated human infections caused by Chlamydia trachomatis.
  Every current member is seeded by C. trachomatis elementary bodies that enter
  susceptible mucosal epithelial cells, convert to replicative reticulate
  bodies inside an inclusion, amplify by an obligate intracellular
  developmental cycle, and trigger tissue inflammation.

  The members are deliberately kept as separate Disease entries because
  C. trachomatis biovar and tissue tropism change the clinical syndrome and
  public-health response. Trachoma is a chronic ocular disease of endemic
  transmission and recurrent childhood conjunctival infection that can scar the
  tarsal conjunctiva and blind through trichiasis and corneal opacity.
  Inclusion conjunctivitis is an acute or subacute ocular infection caused by
  D-K urogenital strains in adult genital-to-eye or perinatal exposure.
  Lymphogranuloma venereum is an invasive sexually transmitted L1-L3 infection
  with inguinal or anorectal lymphatic disease.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005701
      label: chlamydia trachomatis infectious disease
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      closeMatch rather than exactMatch because the MONDO class is the intended
      species-level C. trachomatis parent but currently carries MONDO:0025598
      pneumonia caused by chlamydia as a descendant. That pneumonia class is
      genus-level in both name and ICD-10-CM xref scope and should not be
      treated as a C. trachomatis grouping member.
membership_criteria:
- description: >-
    A disease belongs to the Chlamydia trachomatis infections if it is a human
    infection caused by C. trachomatis and is split from the other
    C. trachomatis diseases by a clinically named serovar/biovar syndrome,
    tissue tropism, transmission setting, or sequela pattern.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: OTHER
    description: >-
      Caused by C. trachomatis with a named ocular, urogenital, or invasive
      lymphatic syndrome that is curated as its own Disease entry.
members:
- member: Trachoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Endemic ocular infection with C. trachomatis A-C strains whose recurrent
      conjunctival infection in childhood drives chronic inflammation,
      conjunctival scarring, trichiasis, corneal opacity, and infection-related
      blindness.
- member: Inclusion Conjunctivitis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Ocular infection with C. trachomatis D-K urogenital strains, acquired by
      genital-to-eye inoculation in adults or during perinatal exposure in
      neonates, that produces conjunctivitis without the endemic scarring and
      trichiasis pathway that distinguishes trachoma.
- member: Lymphogranuloma Venereum
  member_type: DISEASE
  display_name: Lymphogranuloma venereum
  differentiating_mechanisms:
  - description: >-
      Invasive sexually transmitted infection with C. trachomatis L1-L3 strains
      that breach genital or rectal mucosa and spread to regional lymphatics,
      producing inguinal lymphadenitis or proctocolitis rather than a primary
      ocular syndrome.
references:
- reference: DOI:10.1155/2015/791847
  title: Trachoma and Ocular Chlamydial Infection in  the Era of Genomics
  findings:
  - statement: >-
      Trachoma is a blinding C. trachomatis ocular infection usually caused by
      serovars A, B, and C.
    supporting_text: Trachoma is a blinding disease usually caused by infection with Chlamydia trachomatis (Ct) serovars A, B, and C in the upper tarsal conjunctiva.
- reference: PMID:23692878
  title: >-
    [Purulent keratoconjunctivitis due to Neisseria gonorrhoeae and Chlamydia
    trachomatis coinfection].
  findings:
  - statement: >-
      Inclusion conjunctivitis is caused by the C. trachomatis D-K serovar
      group rather than the ocular trachoma or invasive LGV serovar groups.
    supporting_text: >-
      Inclusion conjunctivitis caused by the serovars D-K of Chlamydia
      trachomatis also affects the sexually active population.
- reference: PMID:24518282
  title: "Lymphogranuloma venereum: an old, forgotten re-emerging systemic disease."
  findings:
  - statement: >-
      LGV is caused by the invasive C. trachomatis L1, L2, and L3 serotypes.
    supporting_text: >-
      The etiological agent of LGV is Chlamydia trachomatis serotypes L1, L2 and
      L3, and current outbreaks are mostly sustained by L2b type.
notes: >-
  This grouping currently lists the validated C. trachomatis Disease entries on
  main. Urogenital C. trachomatis infection should be added as a member only
  after it has its own curated Disease entry. MONDO's pneumonia caused by
  chlamydia descendant is omitted because it is a genus-level Chlamydia
  pneumonia class, not a C. trachomatis infection.

  The membership criterion uses an `OTHER` leaf to express a C. trachomatis
  infectious-agent boundary because `CriterionPredicateEnum` has no
  infectious-agent predicate.

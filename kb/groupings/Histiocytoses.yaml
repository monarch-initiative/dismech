name: Histiocytoses
display_name: Histiocytoses (the MAPK-driven histiocytic and dendritic cell neoplasms)
creation_date: "2026-11-17T19:45:00Z"
description: >-
  The histiocytoses are disorders in which cells of the macrophage and dendritic cell lineage
  accumulate in tissues and organs, which is how the 2016 revised classification cited below
  characterises the class; what that accumulation does to the tissue differs by member and is left
  to each member's own entry. This grouping collects four of them, the ones this knowledge
  base curates as proliferations driven by a somatic lesion of the MAPK pathway: Langerhans cell
  histiocytosis and Erdheim-Chester disease, which the 2016 revised classification placed together
  in one group; Rosai-Dorfman disease, which that classification makes a group of its own; and
  juvenile xanthogranuloma. They look nothing alike at the bedside - a child's solitary yellow
  papule, a destructive bone lesion, massive painless cervical lymphadenopathy, bilateral
  symmetrical sclerosis of the long-bone diaphyses and metaphyses - and until the driver mutations
  were found there was no reason to read them as one kind of disease. What groups them is the
  mechanism underneath: an activating somatic lesion in the MAPK pathway, in a kinase of the cascade
  or in the RAS GTPase above it or at an upstream receptor, arising in a myeloid precursor or in the
  lesional histiocyte itself, which is also what makes the pathway druggable in each of them. How
  far that lesion accounts for every case differs by member: Rosai-Dorfman disease carries one in
  about a third of cases and its entry models the remainder as reactive, so the grouping's claim is
  that each member's entry records such a lesion, not that every case of all four has one.

  Where the 2016 revised classification places juvenile xanthogranuloma is deliberately not
  asserted: its abstract names the five groups without naming this disease or the xanthogranuloma
  family at all.
references:
- reference: PMID:26966089
  title: >-
    Revised classification of histiocytoses and neoplasms of the macrophage-dendritic cell
    lineages.
  findings:
  - statement: >-
      The 2016 revised classification divides the histiocytoses into five groups, one of them
      Rosai-Dorfman disease on its own and one the haemophagocytic group this grouping excludes. Its
      abstract names those five groups without naming juvenile xanthogranuloma, which is why this
      file does not place that member in one.
    supporting_text: >-
      This revised classification system consists of 5 groups of diseases: (1) Langerhans-related,
      (2) cutaneous and mucocutaneous, and (3) malignant histiocytoses as well as (4) Rosai-Dorfman
      disease and (5) hemophagocytic lymphohistiocytosis and macrophage activation syndrome.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PATHWAY
grouping_rationale: >-
  Grouped on a shared mechanism rather than on a shared appearance. Every member's pathophysiology
  records involvement of the MAPK cascade, and in every member that involvement is driven by a
  somatic lesion in the pathway - in one of its kinases, in a RAS GTPase above them, or at an
  upstream receptor: BRAF V600E, MAP2K1 and ARAF in
  Langerhans cell histiocytosis; BRAF V600E and MAP2K1 in Erdheim-Chester disease; MAP2K1, KRAS and
  NRAS in Rosai-Dorfman disease; and CSF1R mutations, CLTC::SYK and TPM3::NTRK1 fusions, BRAF V600E
  and a MAP2K1 deletion in juvenile xanthogranuloma. The members are kept as separate Disease
  entries, and must be, because they differ in the cell the lesion arises in and in what the lesion
  then produces: a CD1a-positive Langerhans-like dendritic cell in one, a foamy CD68-positive
  histiocyte in another, an S100-positive histiocyte showing emperipolesis in a third, a Touton
  giant cell in the fourth. They also differ in age at onset and in which organs are involved, and
  in at least one member the disease resolves without treatment: juvenile xanthogranuloma's entry
  records spontaneous resolution in 57.7% of one series. Nothing cited here states the comparable
  figure for the other three, so this grouping does not claim one way or the other for them.

  Two parts of the wider histiocytosis field are deliberately outside this grouping, so that the
  concept is not re-nominated. The haemophagocytic group of the 2016 classification, which that
  classification pairs with macrophage activation syndrome and which this repository curates more
  narrowly as Hemophagocytic_Lymphohistiocytosis, is a disorder of cytokine-driven immune
  dysregulation, frequently germline, and is not a MAPK-driven proliferation;
  including it would make the shared mechanism false of a member. The malignant histiocytoses are a
  separate case: `MONDO:0004612 malignant histiocytosis` has no entry here, so there is nothing to
  list either way, and whether they would belong is undecided rather than settled - they are
  histiocytic neoplasms, but this grouping's own criterion is the MAPK cascade and nothing here says
  a histiocytic sarcoma satisfies it. Neither omission is a claim that those diseases are unrelated
  to these four.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002637
      label: histiocytosis
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        All four members resolve to is-a descendants of the mapped class, which `just
        grouping-mondo-consistency` reports as 4/4. A broadMatch asserts no subsumption, so that
        audit cannot contradict this mapping whatever the members do; the 4/4 is recorded because it
        happens to hold, not because the predicate requires it.
    mapping_justification: >-
      All four members resolve to is-a descendants of MONDO:0002637, but that class has 46
      descendants and this grouping covers four of them, so the MONDO class is the broader concept
      and the predicate reads broadMatch with the grouping as the subject. It is a cross-reference
      and not the source of membership: the members are listed explicitly, and the residue is of two
      kinds, neither of them evidence that the mapping is only a close match. Some descendants have
      no entry here at all, among them `MONDO:0004612 malignant histiocytosis`,
      `MONDO:0022338 ALK+ histiocytosis` and
      `MONDO:0007725 hereditary progressive mucinous histiocytosis`. Eight curated entries do bind a
      descendant and are deliberately not members: five storage disorders that MONDO files under
      histiocytosis for their foam-cell morphology rather than for any histiocytic neoplasm -
      Niemann-Pick disease types A, B, C and E and chronic neurovisceral acid sphingomyelinase
      deficiency - plus sea-blue histiocyte syndrome, whose own entry calls it a lipid-storage
      histiocytosis, and H syndrome and papular xanthoma.

      Those last two are the edge worth reading. Papular xanthoma binds no MAPK term and fails this
      grouping's criterion outright. H syndrome does not: it carries a pathophysiology node binding
      GO:0000165 MAPK cascade, so it satisfies the criterion and is excluded anyway, because the
      criterion is necessary and not sufficient. Its MAPK activation is TLR-driven in a germline
      disorder rather than a somatic lesion in the pathway, which is the thing this grouping is
      about - and that node's own description says so.
membership_criteria:
- description: >-
    Every member's curated pathophysiology records involvement of the MAPK cascade. This is a
    necessary condition and not a sufficient one - over a hundred entries in this knowledge base bind
    the cascade term, most of them nothing to do with histiocytosis - so it audits the listed members
    rather than discovering new ones. Stated at the level of the cascade rather than of a particular
    kinase, because the
    members enter it at different points - at BRAF, at MAP2K1, at RAS, and in juvenile
    xanthogranuloma at an upstream receptor tyrosine kinase or a kinase fusion - and a criterion
    naming one of those would report the others as contradictions.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_BIOLOGICAL_PROCESS
    biological_processes:
    - preferred_term: MAPK cascade
      term:
        id: GO:0000165
        label: MAPK cascade
    description: >-
      Has a pathophysiology node binding GO:0000165 or a descendant of it. All four members bind the
      cascade term itself; three also bind GO:0070371 ERK1 and ERK2 cascade, which the closure
      covers.
- description: >-
    A disease classified on the ICD-O morphology axis as a histiocytic and dendritic cell neoplasm
    is a member. It is a discovery criterion, stated so that an entry carrying that tag surfaces as
    a candidate addition rather than having to be noticed by hand; it says that carrying the tag is
    enough, not that every member carries it.
  criteria_semantics: SUFFICIENT
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    classification: "icdo_morphology:Histiocytic and Dendritic Cell Neoplasm"
    description: >-
      classifications.icdo_morphology is "Histiocytic and Dendritic Cell Neoplasm". Three members
      carry it - Langerhans cell histiocytosis, Erdheim-Chester disease and Rosai-Dorfman disease -
      and no entry outside this grouping does, so the criterion nominates nobody today and is purely
      forward-looking. Juvenile xanthogranuloma has no classifications block at all, which is a gap
      in that entry rather than a statement that it is not such a neoplasm, and one for that entry's
      own curation to close rather than for a grouping to reach into.
members:
- member: Langerhans Cell Histiocytosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a CD1a and CD207-positive dendritic cell resembling an epidermal
      Langerhans cell, and the driver is most often BRAF V600E. What separates this member is that
      where in haematopoiesis the lesion sits is unsettled. On the misguided-myeloid-differentiation
      model, the mutation is found in circulating and marrow progenitors in high-risk disease and in
      lesional cells alone in low-risk disease. A later study found mutant BRAF outside that
      compartment in low-risk patients and reads the lesion as sitting in one marrow-resident
      progenitor in both risk groups. Neither model is settled, and this row does not pick between
      them.
    gene:
      preferred_term: BRAF
      term:
        id: hgnc:1097
        label: BRAF
    evidence:
    - reference: PMID:24638167
      reference_title: >-
        BRAF-V600E expression in precursor versus differentiated dendritic cells defines clinically
        distinct LCH risk groups.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Strikingly, we found that patients with active, high-risk LCH also carried BRAF-V600E in
        circulating CD11c(+) and CD14(+) fractions and in bone marrow (BM) CD34(+) hematopoietic cell
        progenitors, whereas the mutation was restricted to lesional CD207(+) DC in low-risk LCH
        patients.
      explanation: >-
        The result that distinguishes this member from its siblings - the same driver at two
        different stages of the dendritic cell lineage, which is what the risk groups track.
- member: Erdheim-Chester Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a foamy CD68-positive, CD1a-negative histiocyte, and the disease presents
      as bilateral symmetrical sclerosis of the long-bone diaphyses and metaphyses, with perirenal
      and retroperitoneal infiltration. It co-occurs with Langerhans cell histiocytosis in about 15 per cent
      of patients, which is part of why the 2016 revision put the two in one group.
    gene:
      preferred_term: BRAF
      term:
        id: hgnc:1097
        label: BRAF
    evidence:
    - reference: PMID:32107533
      reference_title: Erdheim-Chester disease.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The discovery of BRAF mutations and of other MAP kinase pathway alterations, as well as the
        co-occurrence of ECD with LCH in 15% of patients with ECD, led to the 2016 revision of the
        classification of histiocytoses in which LCH and ECD belong to the "L" group. Both conditions
        are considered inflammatory myeloid neoplasms.
      explanation: >-
        The sentence that makes this grouping's basis the field's own: the MAPK alterations and the
        co-occurrence are what joined these two, and both are read as inflammatory myeloid
        neoplasms, which is the source's own adjective. The mutations and the 15% figure are
        findings in patients, so the grade is HUMAN_CLINICAL, as the Erdheim-Chester entry grades
        this same sentence in five places; REVIEW_SYNTHESIS records that this paper is restating a
        classification published elsewhere rather than producing it here - its first author was one
        of that classification's authors, so the role is about the document, not about distance from
        the decision.
- member: Rosai-Dorfman Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is an S100-positive histiocyte showing emperipolesis - intact lymphocytes
      inside its cytoplasm - and the presentation is massive painless cervical lymphadenopathy.
      Its driver spectrum is the one that excludes BRAF V600E almost entirely, running instead
      through MAP2K1 and RAS, and a clonal lesion is found in only about a third of cases. Its entry
      models the mutation-negative remainder as a separate reactive arm, which is the only member
      here whose pathophysiology is split that way.
    gene:
      preferred_term: MAP2K1
      term:
        id: hgnc:6840
        label: MAP2K1
    evidence:
    - reference: PMID:28664935
      reference_title: Mutually exclusive recurrent KRAS and MAP2K1 mutations in Rosai-Dorfman disease.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we detected mutually exclusive KRAS and MAP2K1 mutations in one-third of cases of
        Rosai-Dorfman disease suggesting this subgroup are clonal and involve activation of MAPK/ERK
        pathway
      explanation: >-
        Both halves of what differentiates this member - the driver pair, and the fraction of cases
        in which a clonal lesion is found at all.
- member: Juvenile Xanthogranuloma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a lipid-laden histiocyte that forms the Touton giant cell, and the
      typical disease is a solitary cutaneous papule appearing in infancy that resolves without
      treatment. It is the member whose drivers are not confined to the MAPK kinases: the
      extracutaneous series found a targetable kinase alteration in all sixteen children it tested,
      most often a CSF1R mutation or a CLTC::SYK fusion, so the lesion is as often at an upstream
      receptor or in a kinase fusion as in the cascade itself. The under-two age in that series is a
      property of its extracutaneous soft-tissue cases and not a figure for the common cutaneous
      lesion.
    gene:
      preferred_term: CSF1R
      term:
        id: hgnc:2433
        label: CSF1R
    evidence:
    - reference: PMID:39316650
      reference_title: >-
        Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Targetable kinase alterations were detected in 16 of 16 children and 1 of 5 adults.
      explanation: >-
        The sentence the description's all-sixteen claim rests on. Scoped to the extracutaneous
        series, which is what the source reports.
    - reference: PMID:39316650
      reference_title: >-
        Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Alterations included CLTC::SYK fusions in 6 children and CSF1R mutations in 7 others; all
        below 2 years of age with soft tissue tumors.
      explanation: >-
        The driver spectrum that separates this member from the three whose lesions sit in the
        cascade, and the source of the under-two age the description qualifies.
notes: >-
  Four members, and the grouping is not the whole of the field. Three things a reader should take
  from it rather than infer.

  First, membership asserts the shared mechanism and nothing about the strength of the therapeutic
  evidence in each member. All four entries carry a targeted-therapy row, but what stands behind
  them ranges from a reported response rate in a treated series, through two small reports of
  response, down to one row with no evidence block at all. So read each row's own evidence before
  relying on it; three of the four also state a regulatory status in prose that the row's own
  references do not carry.

  Second, the sufficient criterion is satisfied by three members and by no entry outside the
  grouping, which is a fact about the current corpus and not a rule about the field. The ICD-O value
  it reads is behaviour-neutral and covers the malignant histiocytoses as well, so it will need
  re-reading when those are curated.

  Third, ALK-positive histiocytosis is a recognised entity of this family and is not a member,
  because this knowledge base has no entry for it - `MONDO:0022338` is among the mapped class's
  descendants and is unbound here.

name: Histiocytoses
display_name: Histiocytoses (the MAPK-driven histiocytic and dendritic cell neoplasms)
creation_date: "2026-11-17T19:45:00Z"
description: >-
  The histiocytoses are disorders in which cells of the macrophage and dendritic cell lineage
  accumulate in tissues and organs, which is how the 2016 revised classification cited below
  characterises the class; what that accumulation does to the tissue differs by member and is left
  to each member's own entry. This grouping collects five of them, the ones this knowledge base
  curates as being driven by a somatic lesion of the MAPK pathway: Langerhans cell histiocytosis and
  Erdheim-Chester disease, which the 2016 revised classification placed together in one group;
  Rosai-Dorfman disease, which that classification makes a group of its own; juvenile
  xanthogranuloma; and histiocytic sarcoma, whose entry calls its disease malignant where the other
  four entries do not. What the five are called otherwise is left to their own entries, which
  differ: Langerhans cell histiocytosis, Erdheim-Chester disease and juvenile xanthogranuloma each
  frame themselves as clonal neoplasms - though juvenile xanthogranuloma's entry also carries that
  framing's disagreement as an open knowledge gap - and Rosai-Dorfman disease does so only for its
  clonal arm. The display name's "neoplasms" names the ICD-O class this grouping's sufficient
  criterion reads, not a claim about each member. They look nothing alike at the bedside - a child's
  solitary yellow papule, a destructive bone lesion, massive painless cervical lymphadenopathy,
  bilateral symmetrical sclerosis of the long-bone diaphyses and metaphyses, and an adult's
  aggressive mass in skin, soft tissue or lymph node - and until the driver mutations were found
  there was no reason to read them as one kind of disease. What groups them is the mechanism
  underneath: a somatic lesion that drives the MAPK pathway, most often in a kinase of the cascade
  or in the RAS GTPase above it or at an upstream receptor, arising in a myeloid precursor or in the
  lesional histiocyte itself - though three of the five entries decline to settle the cell their
  lesion first arises in - Langerhans cell histiocytosis calls it contested, juvenile
  xanthogranuloma not established, and the sarcoma not settled, that entry also stating somatic
  origin only for single tumours and not for its series, and modelling a secondary arm descending
  from an earlier B-cell clone. That shared lesion is also what makes the pathway druggable in each
  of them. Two qualifications juvenile xanthogranuloma's own entry makes: its CLTC::SYK fusion sits
  on neither of the two cascades that entry's module names, RAS-RAF-MEK-ERK and PI3K-AKT-mTOR, SYK
  being a non-receptor tyrosine kinase, and the sources that entry cites, as it read them,
  characterise the effect of only two of the six alterations it records, and those two only at a
  remove - the fusion as a postulate, and BRAF V600E as the same variant characterised in
  Erdheim-Chester disease. How far that lesion accounts for every case differs by member:
  Rosai-Dorfman disease carries one in about a third of cases and its entry models the remainder as
  reactive, so the grouping's claim is that each member's entry records such a lesion, not that
  every case of all five has one.

  Where the 2016 revised classification places juvenile xanthogranuloma is deliberately not
  asserted: its abstract names the five groups without naming this disease or the xanthogranuloma
  family at all.
references:
- reference: PMID:26966089
  title: >-
    Revised classification of histiocytoses and neoplasms of the macrophage-dendritic cell
    lineages.
  findings:
  - statement: >-
      The 2016 revised classification divides the histiocytoses into five groups, one of them
      Rosai-Dorfman disease on its own and one the haemophagocytic group this grouping excludes. Its
      abstract names those five groups without naming juvenile xanthogranuloma, which is why this
      file does not place that member in one.
    supporting_text: >-
      This revised classification system consists of 5 groups of diseases: (1) Langerhans-related,
      (2) cutaneous and mucocutaneous, and (3) malignant histiocytoses as well as (4) Rosai-Dorfman
      disease and (5) hemophagocytic lymphohistiocytosis and macrophage activation syndrome.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PATHWAY
grouping_rationale: >-
  Grouped on a shared mechanism rather than on a shared appearance. Every member's pathophysiology
  records involvement of the MAPK cascade, and in every member that involvement is driven by a
  somatic lesion in the pathway, most often in one of its kinases, in a RAS GTPase above them, or at
  an upstream receptor - both of the description's qualifications apply here too: the CLTC::SYK
  fusion's position, and that juvenile xanthogranuloma's sources characterise the effect of only two
  of its six alterations, so "driven" is not established for every alteration named below: BRAF
  V600E, MAP2K1 and ARAF in Langerhans cell histiocytosis; BRAF V600E and MAP2K1 in Erdheim-Chester
  disease; MAP2K1, KRAS and NRAS in Rosai-Dorfman disease; CSF1R mutations, CLTC::SYK and
  TPM3::NTRK1 fusions, BRAF V600E and a MAP2K1 deletion in juvenile xanthogranuloma; and KRAS,
  MAP2K1 and BRAF in histiocytic sarcoma, whose entry records all three as somatic drivers. Each
  list gives the somatic drivers in this pathway that the member's own entry curates for the disease
  itself, however that entry records them - Erdheim-Chester disease types its two as somatic but
  leaves the driver status to prose rather than to a relationship type. That leaves out, among
  others, a gene an entry names only in prose (ARAF in Rosai-Dorfman disease), a germline risk
  factor (NF1 in juvenile xanthogranuloma), a driver curated under another disease's association
  (PTPN11, likewise), and genes an entry types as neither driver nor somatic (NF1 and CDKN2A in
  histiocytic sarcoma). The members are kept as separate Disease entries, and must be, because they
  differ in the cell the lesion arises in and in what the lesion then produces: a CD1a-positive
  Langerhans-like dendritic cell in one, a foamy CD68-positive histiocyte in another, an
  S100-positive histiocyte showing emperipolesis in a third, a Touton giant cell in the fourth, and
  in the fifth the cell of a malignant neoplasm, with the morphology and immunophenotype of a mature
  tissue histiocyte, expressing CD163, CD68 and lysozyme. They also differ in age at onset and in
  which organs are involved. Resolving without treatment is not among the differences: three of the
  five entries record it - juvenile xanthogranuloma's in 57.7% of one series, Rosai-Dorfman
  disease's for disease that is often self-limited, and Langerhans cell histiocytosis's for its
  solitary single-system lesion. Only the first gives a figure, and nothing cited here states one
  for Erdheim-Chester disease or the sarcoma.

  One part of the wider histiocytosis field is deliberately outside this grouping, so that the
  concept is not re-nominated; a second was, until this change. The haemophagocytic group of the
  2016 classification, which that classification pairs with macrophage activation syndrome and which
  this repository curates more narrowly as Hemophagocytic_Lymphohistiocytosis, is a disorder of
  cytokine-driven immune dysregulation, frequently germline, and is not driven by a somatic MAPK
  lesion at all; including it would make the shared mechanism false of a member. The malignant
  histiocytoses are no longer a separate case. When this grouping was written, nothing here said a
  histiocytic sarcoma satisfied the MAPK criterion; the entry curated since binds GO:0000165 and
  GO:0070371 on its MAPK/ERK node, so it does, and it is admitted here as the first malignant
  member. `MONDO:0004612 malignant histiocytosis` still has no entry of its own, so the wider class
  remains unlisted; what has changed is that one malignant histiocytosis, as the clinic uses that
  phrase, is now curated and meets the criterion on its own evidence. MONDO places it under neither
  class: `MONDO:0019479` is a descendant of neither `MONDO:0004612` nor `MONDO:0002637`, which is
  why the consistency audit counts it outside the mapped class. Neither the haemophagocytic group's
  exclusion nor the wider malignant-histiocytosis class's absence from the corpus is a claim that
  those diseases are unrelated to these five.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002637
      label: histiocytosis
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        Four of the five members resolve to is-a descendants of the mapped class, which `just
        grouping-mondo-consistency` reports as 4/5; the exception is histiocytic sarcoma, whose
        `MONDO:0019479` is not under `MONDO:0002637`. A broadMatch asserts no subsumption, so that
        audit cannot contradict this mapping whatever the members do, and the figure is recorded
        because it is what the audit measures rather than because the predicate requires it.
    mapping_justification: >-
      Four of the five members resolve to is-a descendants of MONDO:0002637, but that class has 46
      descendants and this grouping covers four of them, so the MONDO class is the broader concept
      and the predicate reads broadMatch with the grouping as the subject. The fifth member sits
      outside the class entirely, which broadMatch permits: the predicate is a cross-reference to a
      broader concept, not an assertion that the grouping's members are contained in it. It is a
      cross-reference and not the source of membership: the members are listed explicitly, and the
      residue is of two kinds, neither of them evidence that the mapping is only a close match. Some
      descendants have no entry here at all, among them `MONDO:0004612 malignant histiocytosis`,
      `MONDO:0022338 ALK+ histiocytosis` and `MONDO:0007725 hereditary progressive mucinous
      histiocytosis`. Eight curated entries do bind a descendant and are deliberately not members:
      five storage disorders that MONDO files under histiocytosis for their foam-cell morphology
      rather than for any histiocytic neoplasm - Niemann-Pick disease types A, B, C and E and
      chronic neurovisceral acid sphingomyelinase deficiency - plus sea-blue histiocyte syndrome,
      whose own entry calls it a lipid-storage histiocytosis, and H syndrome and papular xanthoma.

      Those last two are the edge worth reading. Papular xanthoma binds no MAPK term and fails this
      grouping's criterion outright. H syndrome does not: it carries a pathophysiology node binding
      GO:0000165 MAPK cascade, so it satisfies the criterion and is excluded anyway, because the
      criterion is necessary and not sufficient. Its MAPK activation is TLR-driven in a germline
      disorder rather than a somatic lesion in the pathway, which is the thing this grouping is
      about - and that node's own description says so.
membership_criteria:
- description: >-
    Every member's curated pathophysiology records involvement of the MAPK cascade. This is a
    necessary condition and not a sufficient one - over a hundred entries in this knowledge base bind
    the cascade term, most of them nothing to do with histiocytosis - so it audits the listed members
    rather than discovering new ones. Stated at the level of the cascade rather than of a particular
    kinase, because the
    members enter it at different points - at BRAF, at MAP2K1, at RAS, and in juvenile
    xanthogranuloma at an upstream receptor tyrosine kinase or a kinase fusion - and a criterion
    naming one of those would report the others as contradictions.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_BIOLOGICAL_PROCESS
    biological_processes:
    - preferred_term: MAPK cascade
      term:
        id: GO:0000165
        label: MAPK cascade
    description: >-
      Has a pathophysiology node binding GO:0000165 or a descendant of it. All five members bind the
      cascade term itself; four also bind GO:0070371 ERK1 and ERK2 cascade, which the closure covers
      - juvenile xanthogranuloma is the one that does not.
- description: >-
    A disease classified on the ICD-O morphology axis as a histiocytic and dendritic cell neoplasm
    is a member. It is a discovery criterion, stated so that an entry carrying that tag surfaces as
    a candidate addition rather than having to be noticed by hand; it says that carrying the tag is
    enough, not that every member carries it.
  criteria_semantics: SUFFICIENT
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    classification: "icdo_morphology:Histiocytic and Dendritic Cell Neoplasm"
    description: >-
      classifications.icdo_morphology is "Histiocytic and Dendritic Cell Neoplasm". Three of the
      five members carry it - Langerhans cell histiocytosis, Erdheim-Chester disease and
      Rosai-Dorfman disease - and no entry outside this grouping does, so the criterion nominates
      nobody today and is purely forward-looking. Juvenile xanthogranuloma and histiocytic sarcoma
      have no classifications block at all, which is a gap in those entries rather than a statement
      that they are not such neoplasms, and one for each entry's own curation to close rather than
      for a grouping to reach into.
members:
- member: Langerhans Cell Histiocytosis
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a CD1a and CD207-positive dendritic cell resembling an epidermal
      Langerhans cell, and the driver is most often BRAF V600E. What separates this member is that
      two models compete for where in haematopoiesis the lesion sits, each offered by its own
      authors as a hypothesis, neither settled. On the misguided-myeloid-differentiation model, the
      mutation is found in circulating and marrow progenitors in high-risk disease and in lesional
      cells alone in low-risk disease. A later study found mutant BRAF outside that compartment in
      low-risk patients and reads the lesion as sitting in one marrow-resident progenitor in both
      risk groups. This row does not pick between them.
    gene:
      preferred_term: BRAF
      term:
        id: hgnc:1097
        label: BRAF
    evidence:
    - reference: PMID:24638167
      reference_title: >-
        BRAF-V600E expression in precursor versus differentiated dendritic cells defines clinically
        distinct LCH risk groups.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Strikingly, we found that patients with active, high-risk LCH also carried BRAF-V600E in
        circulating CD11c(+) and CD14(+) fractions and in bone marrow (BM) CD34(+) hematopoietic cell
        progenitors, whereas the mutation was restricted to lesional CD207(+) DC in low-risk LCH
        patients.
      explanation: >-
        The result that distinguishes this member from its siblings - the same driver at two
        different stages of the dendritic cell lineage, which is what the risk groups track.
- member: Erdheim-Chester Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a foamy CD68-positive, CD1a-negative histiocyte, and the disease presents
      as bilateral symmetrical sclerosis of the long-bone diaphyses and metaphyses, with perirenal
      and retroperitoneal infiltration. It co-occurs with Langerhans cell histiocytosis in about 15 per cent
      of patients, which is part of why the 2016 revision put the two in one group.
    gene:
      preferred_term: BRAF
      term:
        id: hgnc:1097
        label: BRAF
    evidence:
    - reference: PMID:32107533
      reference_title: Erdheim-Chester disease.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The discovery of BRAF mutations and of other MAP kinase pathway alterations, as well as the
        co-occurrence of ECD with LCH in 15% of patients with ECD, led to the 2016 revision of the
        classification of histiocytoses in which LCH and ECD belong to the "L" group. Both conditions
        are considered inflammatory myeloid neoplasms.
      explanation: >-
        The sentence that makes this grouping's basis the field's own: the MAPK alterations and the
        co-occurrence are what joined these two, and both are read as inflammatory myeloid
        neoplasms, which is the source's own adjective. The mutations and the 15% figure are
        findings in patients, so the grade is HUMAN_CLINICAL, as the Erdheim-Chester entry grades
        this same sentence in five places; REVIEW_SYNTHESIS records that this paper is restating a
        classification published elsewhere rather than producing it here - its first author was one
        of that classification's authors, so the role is about the document, not about distance from
        the decision.
- member: Rosai-Dorfman Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is an S100-positive histiocyte showing emperipolesis - intact lymphocytes
      inside its cytoplasm - and the presentation is massive painless cervical lymphadenopathy.
      Its driver spectrum is the one that excludes BRAF V600E almost entirely, running instead
      through MAP2K1 and RAS, and a clonal lesion is found in only about a third of cases. Its entry
      models the mutation-negative remainder as a separate reactive arm, which is the only member
      here whose pathophysiology is split that way.
    gene:
      preferred_term: MAP2K1
      term:
        id: hgnc:6840
        label: MAP2K1
    evidence:
    - reference: PMID:28664935
      reference_title: Mutually exclusive recurrent KRAS and MAP2K1 mutations in Rosai-Dorfman disease.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we detected mutually exclusive KRAS and MAP2K1 mutations in one-third of cases of
        Rosai-Dorfman disease suggesting this subgroup are clonal and involve activation of MAPK/ERK
        pathway
      explanation: >-
        Both halves of what differentiates this member - the driver pair, and the fraction of cases
        in which a clonal lesion is found at all.
- member: Juvenile Xanthogranuloma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The lesional cell is a lipid-laden histiocyte that forms the Touton giant cell, and the
      typical disease is a solitary cutaneous papule appearing in infancy that resolves without
      treatment. Rosai-Dorfman disease and histiocytic sarcoma also carry drivers outside the MAPK
      kinases, in the RAS GTPase above them; what is distinctive here is how far outside they reach:
      the extracutaneous series found a targetable kinase alteration in all sixteen children it
      tested, most often a CSF1R mutation or a CLTC::SYK fusion, so the lesion is as often at an
      upstream receptor or in a kinase fusion as in the cascade itself. The under-two age in that
      series is a property of its extracutaneous soft-tissue cases and not a figure for the common
      cutaneous lesion.
    gene:
      preferred_term: CSF1R
      term:
        id: hgnc:2433
        label: CSF1R
    evidence:
    - reference: PMID:39316650
      reference_title: >-
        Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Targetable kinase alterations were detected in 16 of 16 children and 1 of 5 adults.
      explanation: >-
        The sentence the description's all-sixteen claim rests on. Scoped to the extracutaneous
        series, which is what the source reports.
    - reference: PMID:39316650
      reference_title: >-
        Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Alterations included CLTC::SYK fusions in 6 children and CSF1R mutations in 7 others; all
        below 2 years of age with soft tissue tumors.
      explanation: >-
        The driver spectrum that separates this member from the four whose lesions sit in the
        cascade or in the RAS GTPase above it, and the source of the under-two age the description
        qualifies.
- member: Histiocytic Sarcoma
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The malignant member. One thing that sets it apart is that it behaves aggressively. It can
      also arise either de novo or in association with another haematological neoplasm. Its cited
      source records alterations of PI3K/AKT/mTOR, of CDKN2A and of TP53 beside the MAPK ones. Of
      those, only CDKN2A distinguishes this member: it is the one of this member's own genes with a
      genetic row that no other member's entry mentions - other members have such genes too,
      juvenile xanthogranuloma's CSF1R among them. That is why this row's gene slot holds a
      cooperating gene where the other four hold their member's driver: the slot carries the gene of
      the differentiating mechanism, not of the lesion. PI3K/AKT/mTOR is not distinctive - juvenile
      xanthogranuloma's entry models it too - and TP53 is quoted rather than modelled here, and
      absent from the other four entries altogether. All of that is checked across the five entries,
      not stated by the quoted sentence. The de novo or secondary origin is not unique here -
      juvenile xanthogranuloma's entry cites a shared somatic PTPN11 variant as evidence of a clonal
      link to another disease - so what separates this member is the behaviour and CDKN2A, not the
      fact of a second neoplasm.
    gene:
      preferred_term: CDKN2A
      term:
        id: hgnc:1787
        label: CDKN2A
    evidence:
    - reference: PMID:40943476
      reference_title: >-
        Histiocytic Sarcoma: A Review and Update.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinically, HS demonstrates aggressive behavior and can arise de novo or in association with
        other hematological neoplasms.
      explanation: >-
        The behaviour, which the quote states, and the origin, which the row's description is
        careful not to claim as distinctive. That no other member's entry describes its disease as
        aggressive or malignant is checked across the five entries, not stated by this sentence. The
        quote is from the review's abstract.
    - reference: PMID:40943476
      reference_title: >-
        Histiocytic Sarcoma: A Review and Update.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Several genomic alterations have been identified in HS, including mutations involving the
        RAS/MAPK and PI3K/AKT/mTOR signaling pathways, CDKN2A mutations/deletions, and TP53
        mutations.
      explanation: >-
        The genes and pathways reported altered in this disease, CDKN2A among them. The grouping's
        necessary criterion is satisfied by the member's own GO:0000165 node binding rather than by
        this quote, so this is cited for the alterations it lists and not for pathway activity -
        which is also how the member entry grades this sentence, DIRECT for a gene being altered and
        INDIRECT where it is cited for signalling.
notes: >-
  Five members, and the grouping is not the whole of the field. Three things a reader should take
  from it rather than infer.

  First, membership asserts the shared mechanism and nothing about the strength of the therapeutic
  evidence in each member. All five entries carry a targeted-therapy row, but what stands behind
  them ranges from a reported response rate in a treated series, through single-patient responses -
  four on the sarcoma's MEK-inhibitor row, the most of any row resting on single patients, and one
  of those four a response to a BRAF and a MEK inhibitor together, in a tumour its own entry classes
  as histiocytic/dendritic cell sarcoma, which that entry declines to put down to MEK inhibition
  alone - down to two rows with no evidence block at all - Langerhans cell histiocytosis's MEK
  inhibitor therapy and Rosai-Dorfman disease's sirolimus, counting a drug aimed at any arm of the
  pathway, not only the MAPK one. So read each row's own evidence before relying on it; three of the
  five also state a regulatory status in prose that the row's own references do not carry; the
  sarcoma's row states none.

  Second, the sufficient criterion is satisfied by three of the five members and by no entry outside
  the grouping, which is a fact about the current corpus and not a rule about the field. The ICD-O
  value it reads is behaviour-neutral and covers the malignant histiocytoses as well. One of those
  is now curated and is a member - and it is one of the two members that do not carry the tag, so
  the sufficient criterion does not fire for it either. Nothing outside the grouping carries the
  tag, so the criterion still nominates nobody; it will need re-reading as more are curated.

  Third, ALK-positive histiocytosis is a recognised entity of this family and is not a member,
  because this knowledge base has no entry for it - `MONDO:0022338` is among the mapped class's
  descendants and is unbound here.

name: NAD(P)HX Repair Disorders
creation_date: '2026-11-20T21:58:16Z'
description: NAXD and NAXE affect different steps of the same metabolite-repair cycle.
grouping_basis:
- SHARED_PATHWAY
grouping_rationale: 'The common metabolite-repair cycle supports the union; the two enzymes catalyze distinct
  reactions and their phenotypic spectra differ. Early encephalopathy is the historical series presentation,
  not a necessary finding in every affected individual: mitochondrial-isoform NAXD deficiency can spare
  the characteristic neurologic and skin phenotype. A shared gene-level repair-system criterion is therefore
  used without requiring seizures or encephalopathy.'
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:617186
      label: Encephalopathy, progressive, early-onset, with brain edema and/or leukoencephalopathy
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:617186, OMIM:618321. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates NAXD or NAXE. This is a necessary disease-annotation check, not a
    patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality, and
    other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    operands:
    - criterion_predicate: HAS_GENE
      gene: &id001
        preferred_term: NAXD
        term:
          id: hgnc:25576
          label: NAXD
    - criterion_predicate: HAS_GENE
      gene: &id002
        preferred_term: NAXE
        term:
          id: hgnc:18453
          label: NAXE
members:
- member: NAD(P)HX Dehydratase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: NAXD catalyzes dehydration of damaged NAD(P)HX. Isoform-specific defects can predominantly
      affect mitochondria or both mitochondrial and cytosolic repair.
    gene: *id001
    evidence:
    - reference: PMID:30576410
      reference_title: 'NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated
        by febrile illnesses.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Recombinant NAXD protein harbouring two missense variants leading to the amino acid changes
        p.(Gly63Ser) and p.(Arg608Cys) were thermolabile and showed a decrease in Vmax and increase in
        KM for the ATP-dependent NADHX dehydratase activity.
      explanation: Direct enzymological demonstration of loss of function, including the thermolability
        that links the molecular defect to the febrile trigger.
    - reference: PMID:35866541
      reference_title: Clinical and biochemical distinctions for a metabolite repair disorder caused by
        NAXD or NAXE deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The central cofactors NAD(P)H are prone to damage by hydration, resulting in formation
        of redox-inactive derivatives designated NAD(P)HX.
      explanation: Names the damage reaction (hydration) and the product, completing the chemistry the
        previous item begins.
- member: NAD(P)HX Epimerase Deficiency
  member_type: DISEASE
  differentiating_mechanisms:
  - description: NAXE supplies the appropriate epimer for repair by NAXD; its loss disrupts the complementary
      epimerization step.
    gene: *id002
    evidence:
    - reference: PMID:27616477
      reference_title: NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic
        Disorder of Early Childhood.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: NAXE levels were undetectable in fibroblasts from affected individuals of two families.
      explanation: Absent protein in patient cells is the direct demonstration of loss of function.

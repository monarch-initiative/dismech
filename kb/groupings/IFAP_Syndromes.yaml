name: IFAP Syndromes
creation_date: '2026-11-20T21:58:18Z'
description: Compare MBTPS2 protease and SREBF1 substrate defects within regulated proteolysis.
grouping_basis:
- SHARED_PATHWAY
- SHARED_PHENOTYPE
grouping_rationale: The shared follicular skin, hair and ocular phenotype joins different lesions in regulated
  transcription-factor processing. IFAP1 affects site-2 protease, whereas IFAP2 substrate variants impair
  an earlier site-1 cleavage step; the latter is not simply a defect in MBTPS2 cleavage of the same site.
  The union preserves distinct inheritance and excludes other allelic skin or skeletal disorders.
mappings:
  omimps_mappings:
  - term:
      id: OMIMPS:308205
      label: IFAP syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM phenotypic series
    mapping_justification: The January 2026 OMIM snapshot enumerates OMIM:308205, OMIM:619016. These numbered
      concepts correspond to this explicit union. The mapping aligns the named series with its curated
      members, not the individual disease record sharing the series number.
membership_criteria:
- description: Each member annotates photophobia and MBTPS2 or SREBF1. This is a necessary disease-annotation
    check, not a patient diagnostic rule or a sufficient classifier. Gene mentions do not establish causality,
    and other allelic disorders remain excluded by the explicit membership boundary.
  criteria_semantics: NECESSARY
  logic:
    operator: AND
    operands:
    - criterion_predicate: HAS_PHENOTYPE
      phenotype_term:
        preferred_term: Photophobia
        term:
          id: HP:0000613
          label: Photophobia
    - operator: OR
      operands:
      - criterion_predicate: HAS_GENE
        gene: &id001
          preferred_term: MBTPS2
          term:
            id: hgnc:15455
            label: MBTPS2
      - criterion_predicate: HAS_GENE
        gene: &id002
          preferred_term: SREBF1
          term:
            id: hgnc:11289
            label: SREBF1
members:
- member: IFAP Syndrome 1
  member_type: DISEASE
  differentiating_mechanisms:
  - description: MBTPS2 encodes site-2 protease, affecting regulated cleavage of membrane-bound transcription
      factors; the X-linked disease can include BRESHECK features.
    gene: *id001
    evidence:
    - reference: PMID:19361614
      reference_title: IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease
        essential for cholesterol homeostasis and ER stress response.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: provide evidence that missense mutations exchanging highly conserved amino acids of membrane-bound
        transcription factor protease, site 2 (MBTPS2) are associated with this phenotype
      explanation: The gene-disease assertion and the variant class.
    - reference: PMID:33743732
      reference_title: MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The MBTPS2 gene on the X-chromosome encodes the membrane-bound transcription factor protease,
        site-2 (MBTPS2) or site-2 protease (S2P) which cleaves and activates several signaling and regulatory
        proteins from the membrane.
      explanation: 'The intramembrane-cleavage function. Graded OTHER: this is a review''s background
        statement of established biochemistry, not a result the paper reports.'
- member: IFAP Syndrome 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: SREBF1 variants impair site-1 cleavage of the SREBP1 substrate, preventing nuclear translocation
      of its active form.
    gene: *id002
    evidence:
    - reference: PMID:32497488
      reference_title: Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor
        1, Cause Autosomal-Dominant IFAP Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The three detected SREBF1 mutations caused substitution or deletion of residues 527, 528,
        and 530, which are crucial for S1P cleavage.
      explanation: Names the hotspot residues and the function they serve, which is the whole content
        of this node.
    - reference: PMID:32497488
      reference_title: Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor
        1, Cause Autosomal-Dominant IFAP Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In vitro investigation of SREBP1 variants demonstrated impaired S1P cleavage, which prohibited
        nuclear translocation of the transcriptionally active form of SREBP1.
      explanation: Measures the cleavage step directly in the variant proteins, which is this edge rather
        than either node alone.

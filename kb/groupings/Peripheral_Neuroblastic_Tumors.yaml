name: Peripheral Neuroblastic Tumors
creation_date: '2026-10-29T15:42:00Z'
description: >-
  Peripheral neuroblastic tumours are neural crest tumours with neuronal
  differentiation. They have historically been divided into three
  categories, neuroblastoma, ganglioneuroblastoma and ganglioneuroma, which
  represent a spectrum of maturation from neuroblastoma, the most primitive
  form, to ganglioneuroma, the most mature. The International Neuroblastoma
  Pathology Classification (INPC) classifies them by morphologic criteria
  into four categories: neuroblastoma (Schwannian stroma-poor), intermixed
  ganglioneuroblastoma (Schwannian stroma-rich), ganglioneuroma (Schwannian
  stroma-dominant) and nodular ganglioneuroblastoma (composite). The two
  ganglioneuroblastoma categories are the subtypes of one
  Ganglioneuroblastoma entry, so the grouping has three members. The INPC's
  prognostic system, modelled on one proposed by Shimada and colleagues, is
  an age-linked classification dependent on the differentiation grade of the
  neuroblasts, their cellular turnover index and the presence or absence of
  Schwannian stromal development. In the revised INPC, intermixed
  ganglioneuroblastoma and ganglioneuroma are always classified as
  favourable histology; neuroblastoma is classified as favourable or
  unfavourable histology by an age-linked evaluation of its grade of
  neuroblastic differentiation and its mitosis-karyorrhexis index, and
  nodular ganglioneuroblastoma by the characteristics of its neuroblastic
  component. The INPC was designed for prognostic distinction among
  paediatric peripheral neuroblastic tumours and is not applicable to adult
  ones, even though there is no clear consensus on where the two age groups
  separate. Ganglioneuroma is recognized as a benign tumour. In the cited
  immunohistochemistry series that report them separately, neuroblastoma,
  ganglioneuroblastoma and ganglioneuroma all expressed PHOX2B. The marker is
  not confined to the members, since some pheochromocytomas and
  paragangliomas also expressed it, and not every individual tumour of the
  family was positive.
grouping_basis:
- CLINICAL_CONVENTION
grouping_rationale: >-
  Grouped by pathological convention: the members are the categories of one
  classification, the INPC, which national and international cooperative
  studies have used for the pathology evaluation of peripheral neuroblastic
  tumours. PHOX2B immunoreactivity corroborates the grouping without defining
  it. Every member tumour type expressed PHOX2B in the cited
  immunohistochemistry series that report them separately, but the marker is
  not confined to the members and not every tumour of the family was positive,
  so it is not a membership criterion; the series are cited as evidence on the
  members instead. The grouping asserts no shared driver lesion and no
  developmental sequence among its members: the spectrum of maturation is a
  histological ordering, and whether every ganglioneuroma arises by maturation
  of a neuroblastic tumour is unresolved (see the discussion of its origin in
  the Ganglioneuroma entry). The members stay separate Disease entries because
  the categories differ in histology, behaviour and prognostic classification:
  each neuroblastoma is classified as favourable or unfavourable histology by
  an age-linked evaluation of its grade of neuroblastic differentiation and
  its mitosis-karyorrhexis index; intermixed ganglioneuroblastoma is always
  classified as favourable histology, while nodular ganglioneuroblastoma is
  classified by the characteristics of its neuroblastic component; and
  ganglioneuroma, recognized as a benign tumour, is always classified as
  favourable histology. The two ganglioneuroblastoma categories are reached
  through the Ganglioneuroblastoma entry, which records them as subtypes,
  rather than listed as separate members. Membership is by explicit listing,
  not by ontology closure, because MONDO's neuroblastic tumor class also holds
  tumours outside the category, filed beneath neuroblastoma. One is olfactory
  neuroblastoma, which MONDO also files under olfactory nerve neoplasm and
  which one of the PHOX2B series cited here counts among its comparison
  tumours that are not peripheral neuroblastic tumours. Others are cerebral
  and retinal neuroblastoma, which MONDO defines as neuroblastomas arising
  from the cerebral hemispheres and from the retina, and the subclass of
  cerebral neuroblastoma, CNS neuroblastoma with FOXR2 activation, which MONDO
  defines as a central nervous system neuroblastoma. None of these is a
  member. Melanotic neuroectodermal tumour of infancy, which contains
  neuroblast-like cells but is not an INPC category and which MONDO files
  beside neuroblastic tumor rather than beneath it (see notes), is not a
  member; nor are pheochromocytoma and paraganglioma, which one of the cited
  PHOX2B series classes as neural crest tumours with neuroendocrine rather
  than neuronal differentiation. The constitutional conditions that predispose
  to neuroblastic tumours are indexed separately in the Neuroblastoma
  Predisposition Syndromes grouping.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0006316
      label: neuroblastic tumor
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      narrowMatch rather than exactMatch, because this grouping is the
      peripheral, INPC-classified part of MONDO:0006316. The class has exactly
      three direct subclasses, neuroblastoma (MONDO:0005072),
      ganglioneuroblastoma (MONDO:0005035) and ganglioneuroma (MONDO:0005033),
      which are the disease terms of this grouping's three members, and MONDO
      records NCIT:C6963 Neuroblastic Tumor as an exact match. But MONDO
      defines the class as a group of nervous system tumors which display
      neuronal differentiation, with no restriction to peripheral tumours, and
      its subtree also holds tumours that this grouping's members do not
      cover, such as olfactory, cerebral and retinal neuroblastoma, which
      enter the class through neuroblastoma (see notes). Every member's
      disease term still sits inside the class. Because the mapping is not an
      exactMatch, the grouping page does not take the MONDO subtree as its
      coverage scope, so a later entry for one of those tumours is not
      counted as a missing member.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        Each member's primary MONDO term is a direct is_a subclass of
        MONDO:0006316 (OLS, 29 October 2026).
membership_criteria:
- description: >-
    A member is a Disease entry for a category of peripheral neuroblastic
    tumour in the International Neuroblastoma Pathology Classification:
    neuroblastoma (Schwannian stroma-poor; undifferentiated, poorly
    differentiated or differentiating), ganglioneuroblastoma (intermixed,
    Schwannian stroma-rich, or nodular, composite; one entry with the two
    categories as subtypes) or ganglioneuroma (Schwannian stroma-dominant;
    maturing or mature). NECESSARY and not sufficient. The INPC category is
    not a structured field, so the audit checks a proxy that every member
    carries: the entry lists neuroblastic tumor, the MONDO class whose direct
    subclasses are the members' disease terms, among its parents. The proxy
    does not decide membership, since an entry for a tumour outside the INPC
    could list the same parent.
  criteria_semantics: NECESSARY
  logic:
    criterion_predicate: HAS_CLASSIFICATION
    description: >-
      The entry lists neuroblastic tumor among its parents, which the audit
      reads as the keyed tag parents:neuroblastic tumor.
    classification: "parents:neuroblastic tumor"
  evidence:
  - reference: PMID:10421272
    reference_title: "Terminology and morphologic criteria of neuroblastic tumors: recommendations by the International Neuroblastoma Pathology Committee."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The INPC has adopted a prognostic system modeled on one proposed by Shimada et al. It is an age-linked classification dependent on the differentiation grade of the neuroblasts, their cellular turnover index, and the presence or absence of Schwannian stromal development. Based on morphologic criteria defined in this article, NTs were classified into four categories and their subtypes: 1) neuroblastoma (Schwannian stroma-poor), undifferentiated, poorly differentiated, and differentiating; 2) ganglioneuroblastoma, intermixed (Schwannian stroma-rich); 3) ganglioneuroma (Schwannian stroma-dominant), maturing and mature; and 4) ganglioneuroblastoma, nodular (composite Schwannian stroma-richlstroma-dominant and stroma-poor)."
    explanation: >-
      In the results of its abstract, the International Neuroblastoma
      Pathology Committee (abbreviated INPC in this abstract) says it adopted a
      prognostic system modeled on one proposed by Shimada et al., and
      describes that system as an age-linked classification dependent on the
      differentiation grade of the neuroblasts, their cellular turnover index,
      and the presence or absence of Schwannian stromal development. The last
      quoted sentence lists the four categories and their subtypes, based on
      morphologic criteria defined in the article: neuroblastoma (Schwannian
      stroma-poor), undifferentiated, poorly differentiated and
      differentiating; ganglioneuroblastoma, intermixed (Schwannian
      stroma-rich); ganglioneuroma (Schwannian stroma-dominant), maturing and
      mature; and ganglioneuroblastoma, nodular, a composite of stroma-rich or
      stroma-dominant tissue with stroma-poor tissue. One classification of
      neuroblastic tumours therefore covers all three members of this
      grouping, with both ganglioneuroblastoma categories in the
      Ganglioneuroblastoma entry. The abstract gives no criteria for the
      subtypes, and the quote does not say how the cellular turnover index is
      measured. 'stroma-richlstroma-dominant' is a misprint in the PubMed
      abstract itself for stroma-rich/stroma-dominant, the spelling used in
      the abstract of PMID:10421273; the quote keeps the source's spelling.
      The abstract's conclusion says that, using these morphologic criteria,
      the Committee is proposing the International Neuroblastoma Pathology
      Classification.
  - reference: PMID:19530234
    reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "Historically there are three categories in peripheral neuroblastic tumors (pNTs): Neuroblastoma (NB), Ganglioneuroblastoma (GNB), and Ganglioneuroma (GN). These tumor categories represent a spectrum of maturation from the most primitive form, NB to the most mature form, GN. ... The revised INPC has been used by national and international cooperative studies for pathology evaluation of pNTs."
    explanation: >-
      In the introduction of this Children's Cancer Group and Children's
      Oncology Group (CCG/COG) clinicopathological series of ganglioneuroma
      and ganglioneuroblastoma, Okamatsu et al. restate the established
      classification of peripheral neuroblastic tumours rather than a result
      of their own series: the tumours have historically been divided into
      three categories, neuroblastoma, ganglioneuroblastoma and
      ganglioneuroma, which represent a spectrum of maturation from the most
      primitive form, neuroblastoma, to the most mature, ganglioneuroma. They
      add that the revised International Neuroblastoma Pathology
      Classification (INPC) has been used by national and international
      cooperative studies for pathology evaluation of these tumours. The
      three-category scheme is the historical one: the same introduction
      states that the INPC proposed four tumour categories, with intermixed
      and nodular ganglioneuroblastoma separate, and the paper describes
      nodular ganglioneuroblastoma as composed of biologically different
      clones. The spectrum is histological, a gradient of maturation across
      the categories; the passage does not show that a tumour in one category
      develops into another, and whether every ganglioneuroma arises by
      maturation of a neuroblastic tumour is unproven (see the gn_origin
      discussion in the Ganglioneuroma entry). Cooperative-group use of the
      INPC is the clinical convention behind the grouping's
      CLINICAL_CONVENTION basis; tying it to that basis is the curators'
      reading, not a statement of the paper. The convention it documents is a
      shared pathology classification rather than shared study enrolment: the
      same paper notes that tumours of the GN-Mature subtype were not eligible
      for the CCG/COG studies.
  - reference: PMID:41612478
    reference_title: "Pathology of peripheral neuroblastic tumors."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'It should be noted that since INPC is designed for prognostic distinction among "pediatric" pNTs, it is not applicable to "adult" pNTs even though no clear consensus for separating these two age groups.'
    explanation: >-
      A 2026 review of the pathology of peripheral neuroblastic tumours by
      Conces, Shibui and Shimada states that, since the INPC was designed for
      prognostic distinction among paediatric peripheral neuroblastic
      tumours, it is not applicable to adult ones, and that there is no clear
      consensus on the age that separates the two groups. This supports the
      description's caveat that the favourable and unfavourable histology
      rules restated in this grouping are rules for paediatric tumours. The
      same paragraph says adult tumours are still histologically diagnosed as
      neuroblastoma, ganglioneuroblastoma and ganglioneuroma, so the limit
      concerns the INPC's prognostic grouping, not the categories on which
      membership rests. The sentence is the review authors' own statement of
      the classification's scope, with no data or citation attached, so it is
      graded OTHER as an expert statement rather than a study of the INPC in
      adults.
members:
- member: Neuroblastoma
  member_type: DISEASE
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  differentiating_mechanisms:
  - description: >-
      The Schwannian stroma-poor category. The INPC classifies neuroblastoma
      as favourable or unfavourable histology by an age-linked evaluation of
      its grade of neuroblastic differentiation and its mitosis-karyorrhexis
      index, whereas intermixed ganglioneuroblastoma and ganglioneuroma are
      always classified as favourable histology.
    evidence:
    - reference: PMID:19530234
      reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: "NB (Schwannian stroma-poor tumor) is classified into FH or UH depending on age-linked evaluation of grade of neuroblastic differentiation and mitosis-karyorrhexis index (MKI). GNB-Intermixed (Schwannian stroma-rich) and GN (Schwannian stroma-dominant) tumors are always classified into the FH group."
      explanation: >-
        In the introduction of a Children's Cancer Group and Children's
        Oncology Group study of 552 ganglioneuroma and ganglioneuroblastoma
        cases, Okamatsu et al. restate how the International Neuroblastoma
        Pathology Classification (INPC) assigns neuroblastoma, intermixed
        ganglioneuroblastoma and ganglioneuroma to its prognostic groups.
        Neuroblastoma (Schwannian stroma-poor) is classified as Favorable
        Histology (FH) or Unfavorable Histology (UH) by an age-linked
        evaluation of its grade of neuroblastic differentiation and its
        mitosis-karyorrhexis index (MKI), whereas intermixed
        ganglioneuroblastoma (Schwannian stroma-rich) and ganglioneuroma
        (Schwannian stroma-dominant) are always FH. The sentences restate the
        INPC papers rather than reporting a result of this cohort.
  evidence:
  - reference: PMID:28986989
    reference_title: "Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural crest tumours in paediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b immunohistochemistry (IHC) was performed on 159 paediatric tumours, including (group 1) 65 neural crest tumours with neuronal differentiation ... peripheral neuroblastic tumours (pNT) ... 15 neuroblastoma undifferentiated (NB-UD), 10 NB poorly differentiated (NB-PD), 10 NB differentiating (NB-D), 10 ganglioneuroblastoma intermixed (GNBi), 10 GNB nodular (GNBn) and 10 ganglioneuroma (GN); (group 2) 23 neural crest tumours with neuroendocrine differentiation ... pheochromocytoma/paraganglioma (PCC/PG) ... (group 3) 27 other neural crest tumours including one composite rhabdomyosarcoma/neuroblastoma; and (group 4) 44 non-neural crest tumours. ... Phox2b was expressed diffusely in pNT (n = 65 of 65), strongly in NB-UD and NB-PD and with less intensity in NB-D, GNB and GN. ... PCC/PG expressed diffuse Phox2b (n = 23 of 23) and diffuse TH, except for one tumour (n = 22 of 23). ... All other tumours were negative for Phox2b (n = none of 44)."
    explanation: >-
      Warren et al. immunostained 159 paediatric tumours for Phox2b. The 65
      peripheral neuroblastic tumours (pNT) of group 1 included 15
      undifferentiated (NB-UD), 10 poorly differentiated (NB-PD) and 10
      differentiating (NB-D) neuroblastomas, and Phox2b was expressed
      diffusely in all 65: strongly in undifferentiated and poorly
      differentiated neuroblastoma, and with less intensity in differentiating
      neuroblastoma. Every neuroblastoma subtype tested was therefore
      positive. All 23 pheochromocytomas and paragangliomas (PCC/PG, group 2)
      were also diffusely positive, which is why the description says the
      marker is not confined to the members. All other tumours were negative
      (none of 44); the abstract does not say which tumours these 44 are, but
      the count matches the 44 non-neural crest tumours of group 4, and apart
      from the composite rhabdomyosarcoma/neuroblastoma it reports no Phox2b
      result for the group-3 neural crest tumours. This is a single paediatric
      series, so it does not show that every neuroblastoma stains, or that
      adult tumours do. The ellipses on either side of 'peripheral
      neuroblastic tumours (pNT)' and 'pheochromocytoma/paraganglioma
      (PCC/PG)' stand for the square brackets that enclose those labels in the
      abstract and the punctuation after them; the other ellipses skip the
      tyrosine hydroxylase methods sentence, the pNT tyrosine hydroxylase
      result and the sentence on the composite rhabdomyosarcoma/neuroblastoma.
      The tyrosine hydroxylase result in the PCC/PG sentence is outside this
      claim.
  - reference: PMID:23715162
    reference_title: "A study of gata3 and phox2b expression in tumors of the autonomic nervous system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b expression was seen in all neuroblastomas, ganglioneuroblastomas, and ganglioneuromas and in 40% of paragangliomas, but pheochromocytomas and all other tumors were negative."
    explanation: >-
      Nonaka et al. applied anti-Phox2b antibodies to 77 autonomic nervous
      system tumours, 9 of them neuroblastomas, and to their potential
      morphologic mimics. Phox2b expression was seen in every neuroblastoma
      tested, as in every ganglioneuroblastoma and ganglioneuroma, so this
      series, by a different author group from PMID:28986989, agrees that
      neuroblastoma expresses PHOX2B. It disagrees with PMID:28986989 on
      pheochromocytoma and paraganglioma: here 40% of paragangliomas and no
      pheochromocytoma expressed Phox2b, whereas every PCC/PG was diffusely
      positive there. In both series the marker was not confined to the
      members. The neuroblastoma group is 9 tumours, and the abstract gives no
      patient ages or staining intensity and does not say which tumour cells
      stained.
  - reference: PMID:28640941
    reference_title: "PHOX2B reliably distinguishes neuroblastoma among small round blue cell tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "We evaluated 240 cases (133 in whole-tissue sections; 107 in tissue microarrays), including 76 peripheral neuroblastic tumours (median age 2 years; including four adults) and 164 other tumours: 44 Wilms tumours; 20 Ewing sarcomas; 10 each of CIC-rearranged round cell sarcomas, poorly differentiated synovial sarcomas, lymphoblastic lymphomas, alveolar rhabdomyosarcomas, embryonal rhabdomyosarcomas, mesenchymal chondrosarcomas, Merkel cell carcinomas, olfactory neuroblastomas, and melanomas; and five each of NUT midline carcinomas and desmoplastic small round cell tumours. ... PHOX2B positivity was defined as the presence of nuclear immunoreactivity in ≥5% of cells. PHOX2B was positive in 70 (92%) peripheral neuroblastic tumours, including 68 of 72 (94%) paediatric and two of four (50%) adult cases. Furthermore, PHOX2B was consistently negative in all non-peripheral neuroblastic tumours, with staining being absent in 160 cases and limited in four cases. ... PHOX2B negativity in two of four adult neuroblastoma cases raises the possibility that some adult neuroblastomas are of a different lineage than paediatric cases."
    explanation: >-
      Immunohistochemical series of 76 peripheral neuroblastic tumours (median
      age 2 years, four adults) and 164 other tumours, with PHOX2B positivity
      defined as nuclear immunoreactivity in at least 5% of cells. PHOX2B was
      positive in 70 of the 76 peripheral neuroblastic tumours (92%),
      including 68 of 72 paediatric (94%) and two of four adult cases, so the
      marker is not positive in every tumour of the family, and a negative
      stain does not exclude a peripheral neuroblastic tumour. The abstract
      does not report neuroblastoma, ganglioneuroblastoma and ganglioneuroma
      separately and does not say which tumour types the negative paediatric
      cases were, but its conclusion calls the four adult cases neuroblastomas
      and says that the negativity of two of them raises the possibility that
      some adult neuroblastomas are of a different lineage from paediatric
      ones. The authors count the ten olfactory neuroblastomas among the 164
      comparison tumours that are not peripheral neuroblastic tumours, and
      PHOX2B was negative in all 164 at the 5% threshold, which supports
      leaving olfactory neuroblastoma, which MONDO files beneath
      neuroblastoma, out of this member and the grouping. Staining was absent
      in 160 comparison cases and limited in four, and the abstract does not
      say which tumour types the four were, so the olfactory neuroblastomas
      were negative by that threshold, not necessarily free of any staining.
      No pheochromocytoma or paraganglioma was among the comparators, so this
      series does not test the non-member tumours that PMID:28986989 and
      PMID:23715162 found PHOX2B-positive.
- member: Ganglioneuroblastoma
  member_type: DISEASE
  disease_term:
    preferred_term: ganglioneuroblastoma
    term:
      id: MONDO:0005035
      label: ganglioneuroblastoma
  differentiating_mechanisms:
  - description: >-
      Two INPC categories, recorded as the entry's subtypes. In the revised
      INPC, intermixed ganglioneuroblastoma (Schwannian stroma-rich) is always
      classified as favourable histology, while nodular ganglioneuroblastoma,
      a composite of Schwannian stroma-rich or stroma-dominant tissue with
      stroma-poor tissue, is classified as favourable or unfavourable
      histology by the characteristics of its neuroblastic component.
    evidence:
    - reference: PMID:19530234
      reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: "GNB-Intermixed (Schwannian stroma-rich) and GN (Schwannian stroma-dominant) tumors are always classified into the FH group. GNB-Nodular (composite, Schwannian stroma-rich/stroma-dominant and stroma-poor) tumors are classified into the FH or UH group based on the characteristics of the neuroblastic component."
      explanation: >-
        In the introduction to a Children's Cancer Group and Children's
        Oncology Group (CCG/COG) study of 552 ganglioneuroma and
        ganglioneuroblastoma cases, Okamatsu et al. restate the International
        Neuroblastoma Pathology Classification (INPC) rule that separates the
        two ganglioneuroblastoma subtypes. Intermixed tumours (Schwannian
        stroma-rich) are always classified as Favorable Histology (FH).
        Nodular tumours (composite: stroma-rich or stroma-dominant tissue
        together with stroma-poor tissue) are classified as FH or Unfavorable
        Histology (UH) according to the characteristics of their neuroblastic
        component. This directly supports the description's statement that
        the two subtypes differ in how they are assigned to favourable or
        unfavourable histology. The sentences restate the INPC papers rather
        than reporting a result of this cohort; the paper's methods add that
        the 2003 revision split nodular ganglioneuroblastoma into favourable
        and unfavourable subsets, before which every CCG nodular tumour had
        been classified as unfavourable histology.
    - reference: PMID:14601099
      reference_title: "Revision of the International Neuroblastoma Pathology Classification: confirmation of favorable and unfavorable prognostic subsets in ganglioneuroblastoma, nodular."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "The INPC proposes to modify the International Neuroblastoma Pathology Classification by distinguishing the FS and the US among patients with GNBn tumors."
      explanation: >-
        In the conclusion of this 2003 paper by Peuchmaur et al., the
        International Neuroblastoma Pathology Committee (INPC), which reviewed
        the nodular ganglioneuroblastoma (GNBn) slides of 70 patients enrolled
        in Children's Cancer Group studies 3881 and 3891, proposes to modify
        the classification by distinguishing a favourable subset (FS) from an
        unfavourable subset (US) of nodular ganglioneuroblastoma. The
        abstract's background says the original classification placed every
        tumour of this category in the unfavourable histology group, and its
        methods say the subsets were identified by applying the age-linked
        criteria used for conventional neuroblastoma to the neuroblastomatous
        component. This is the change under which nodular
        ganglioneuroblastoma, unlike intermixed ganglioneuroblastoma, is
        classified as favourable or unfavourable histology. The Okamatsu et
        al. series cited above (PMID:19530234) includes these 70 patients.
  evidence:
  - reference: PMID:28986989
    reference_title: "Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural crest tumours in paediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b was expressed diffusely in pNT (n = 65 of 65), strongly in NB-UD and NB-PD and with less intensity in NB-D, GNB and GN."
    explanation: >-
      In Warren et al.'s paediatric immunohistochemistry series, the 65
      peripheral neuroblastic tumours (pNT) included 10 intermixed (GNBi) and
      10 nodular (GNBn) ganglioneuroblastomas. Phox2b was expressed diffusely
      in all 65 pNT, with less intensity in ganglioneuroblastoma (GNB) than in
      undifferentiated (NB-UD) and poorly differentiated (NB-PD)
      neuroblastoma, so both subtypes of this member were positive. Each
      subtype group is 10 tumours, and the abstract does not say which tumour
      cells stained.
  - reference: PMID:23715162
    reference_title: "A study of gata3 and phox2b expression in tumors of the autonomic nervous system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b expression was seen in all neuroblastomas, ganglioneuroblastomas, and ganglioneuromas and in 40% of paragangliomas, but pheochromocytomas and all other tumors were negative."
    explanation: >-
      Nonaka et al.'s series of 77 autonomic nervous system tumours included
      4 ganglioneuroblastomas, and Phox2b expression was seen in every one, as
      in every neuroblastoma and ganglioneuroma. The abstract does not say
      whether the ganglioneuroblastomas were intermixed or nodular, the group
      is 4 tumours, and the paraganglioma and pheochromocytoma results are
      outside this member's claim.
- member: Ganglioneuroma
  member_type: DISEASE
  disease_term:
    preferred_term: ganglioneuroma
    term:
      id: MONDO:0005033
      label: ganglioneuroma
  differentiating_mechanisms:
  - description: >-
      The Schwannian stroma-dominant category. Ganglioneuroma is recognized as
      a benign tumour usually diagnosed in older children and in adults.
      Separately, the INPC always classifies ganglioneuroma as favourable
      histology, as it does intermixed ganglioneuroblastoma; that is a rule of
      a classification designed for paediatric tumours, which is not
      applicable to adult ones (see the description).
    evidence:
    - reference: PMID:19530234
      reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: "GN is recognized as a benign tumor usually diagnosed in older children and in adults (11) (12)."
      explanation: >-
        The introduction states, citing earlier literature (references 11 and
        12), that ganglioneuroma is a benign tumour usually diagnosed in older
        children and in adults, which is what the description states. It
        restates prior work rather than reporting a result of this study's
        CCG/COG cohort, which was drawn from paediatric cooperative-group
        studies and excluded mature ganglioneuroma.
    - reference: PMID:19530234
      reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: "GNB-Intermixed (Schwannian stroma-rich) and GN (Schwannian stroma-dominant) tumors are always classified into the FH group."
      explanation: >-
        Okamatsu et al. restate the International Neuroblastoma Pathology
        Classification (INPC) rule that intermixed ganglioneuroblastoma
        (Schwannian stroma-rich) and ganglioneuroma (Schwannian
        stroma-dominant) tumours are always classified into the Favorable
        Histology (FH) group. The rule is stated for the ganglioneuroma
        category as a whole, and ganglioneuroma shares it with intermixed
        ganglioneuroblastoma; neuroblastoma, by contrast, is classified FH or
        Unfavorable Histology in the same paragraph by an age-linked
        evaluation of its grade of neuroblastic differentiation and
        mitosis-karyorrhexis index. The sentence comes from the introduction
        of a Children's Cancer Group and Children's Oncology Group study of
        552 ganglioneuroma and ganglioneuroblastoma cases and restates the
        INPC papers rather than reporting a result of this cohort.
  evidence:
  - reference: PMID:28986989
    reference_title: "Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural crest tumours in paediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b was expressed diffusely in pNT (n = 65 of 65), strongly in NB-UD and NB-PD and with less intensity in NB-D, GNB and GN."
    explanation: >-
      In Warren et al.'s paediatric immunohistochemistry series, the 65
      peripheral neuroblastic tumours (pNT) included 10 ganglioneuromas (GN).
      Phox2b was expressed diffusely in all 65 pNT, with less intensity in
      ganglioneuroma than in undifferentiated (NB-UD) and poorly
      differentiated (NB-PD) neuroblastoma, so every ganglioneuroma tested was
      positive. The group is 10 tumours from a paediatric series, and the
      abstract does not say which ganglioneuroma cells stained.
  - reference: PMID:23715162
    reference_title: "A study of gata3 and phox2b expression in tumors of the autonomic nervous system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Phox2b expression was seen in all neuroblastomas, ganglioneuroblastomas, and ganglioneuromas and in 40% of paragangliomas, but pheochromocytomas and all other tumors were negative."
    explanation: >-
      Nonaka et al.'s series of 77 autonomic nervous system tumours included
      8 ganglioneuromas, and Phox2b expression was seen in every one, as in
      every neuroblastoma and ganglioneuroblastoma. The ganglioneuroma group
      is 8 tumours, the abstract gives no patient ages or staining intensity,
      and the paraganglioma and pheochromocytoma results are outside this
      member's claim.
notes: >-
  MONDO's neuroblastic tumor (MONDO:0006316) has exactly three direct
  subclasses, the members' disease terms, but the mapping is a narrowMatch
  because the class is broader than this grouping. Its definition, the same as
  that of NCIT Neuroblastic Tumor (NCIT:C6963), describes nervous system
  tumours that display neuronal differentiation, with no restriction to
  peripheral tumours. Its descendants also include olfactory neuroblastoma
  (MONDO:0006329), nasal cavity olfactory neuroblastoma (MONDO:0001129),
  cerebral neuroblastoma (MONDO:0002900) and its subclass cns neuroblastoma
  with FOXR2 activation (MONDO:0859597), and retinal neuroblastoma
  (MONDO:0024340), all filed beneath neuroblastoma, and cutaneous
  ganglioneuroma (MONDO:0002293), beneath ganglioneuroma. None of these is a
  member, and the Neuroblastoma and Ganglioneuroma entries record that they do
  not cover them. MONDO has no class for composite pheochromocytoma: on 29
  October 2026 an OLS search of MONDO for "composite pheochromocytoma"
  returned no term, and no MONDO label or synonym contained "composite"
  together with "pheochromocytoma", "phaeochromocytoma" or "paraganglioma".
  The Ganglioneuroma entry records composite pheochromocytoma-ganglioneuroma
  under its adrenal gland pheochromocytoma differential diagnosis, and it is
  not a member. MONDO files melanotic neuroectodermal tumor (MONDO:0002072)
  beside neuroblastic tumor, under primitive neuroectodermal tumor, rather
  than beneath it, although MONDO defines it by a mixture of
  melanin-containing epithelial cells and smaller neuroblast-like cells (OLS,
  29 October 2026). No HP criterion is used: the members do not record their
  own tumour as a phenotype, and HPO files Ganglioneuroma (HP:0003005) under
  Neoplasm of the autonomic nervous system (HP:0030450) rather than under
  Neuroblastic tumor (HP:0004376). MONDO cross-references the ICD-O morphology
  codes 9500/3 for neuroblastoma, 9490/3 for ganglioneuroblastoma and 9490/0
  for ganglioneuroma.

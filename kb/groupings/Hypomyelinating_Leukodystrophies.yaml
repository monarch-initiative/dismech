name: Hypomyelinating Leukodystrophies
creation_date: "2026-10-16T00:00:00Z"
description: >-
  Heritable leukodystrophies in which central nervous system myelin is never
  adequately deposited, so that MRI shows a permanent, diffuse deficit of
  myelin rather than loss of myelin that was once formed. Pelizaeus-Merzbacher
  disease (PLP1) is the prototype, and Pelizaeus-Merzbacher-like disease 1
  (GJC2) is its autosomal recessive phenocopy. Nystagmus, hypotonia evolving to
  spasticity, ataxia and developmental delay are the shared clinical core.
grouping_basis:
- SHARED_MECHANISM
- SHARED_PHENOTYPE
grouping_rationale: >-
  Grouped because the members share a primary failure of CNS myelin formation
  (hypomyelination), the neuroimaging and pathological category that separates
  them from the demyelinating, vacuolating and astrocytic leukodystrophies in
  the parent Leukodystrophies grouping. The members stay separate Disease
  entries because the causal branches differ widely: a myelin structural
  protein (PLP1), an oligodendrocyte gap-junction protein (GJC2), tubulin
  (TUBB4A), RNA polymerase I and III subunits, aminoacyl-tRNA synthetases
  (DARS1, EPRS1), a mitochondrial chaperonin (HSPD1), proline synthesis
  (PYCR2), endolysosomal tethering (VPS11) and phosphoinositide supply
  (FAM126A). The criterion is NECESSARY, not sufficient: CNS hypomyelination
  is also a feature of many syndromic and metabolic disorders, including the
  mitochondrial disorders MONDO files under this heading, which the 2015
  consensus classifies as genetic leukoencephalopathies rather than
  leukodystrophies.
membership_criteria:
- description: >-
    A member either conforms to the CNS myelin failure module or records CNS
    hypomyelination as a phenotype.
  criteria_semantics: NECESSARY
  logic:
    operator: OR
    operands:
    - criterion_predicate: CONFORMS_TO_MODULE
      module: cns_myelin_failure
      description: Conforms to the CNS myelin failure module at any node.
    - criterion_predicate: HAS_PHENOTYPE
      description: CNS hypomyelination.
      phenotype_term:
        preferred_term: CNS hypomyelination
        term:
          id: HP:0003429
          label: CNS hypomyelination
members:
- member: Pelizaeus-Merzbacher Disease
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      X-linked prototype. PLP1 duplication, missense or null alleles; misfolded PLP1 triggers oligodendrocyte ER stress and death, overdosage disturbs myelin lipid trafficking, and null alleles spare CNS myelin but cause axonopathy.
    gene:
      preferred_term: PLP1
      term:
        id: hgnc:9086
        label: PLP1
- member: Hypomyelinating Leukodystrophy 2
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Autosomal recessive Pelizaeus-Merzbacher-like disease 1. Biallelic loss of the oligodendrocyte gap-junction protein connexin-47 uncouples oligodendrocytes from astrocytes. Clinically close to PMD; distinguished by recessive inheritance and an intact PLP1 locus.
    gene:
      preferred_term: GJC2
      term:
        id: hgnc:17494
        label: GJC2
- member: Hypomyelinating Leukodystrophy 4
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Mitochondrial chaperonin HSP60 deficiency (MitCHAP-60 disease), placing the primary defect in mitochondrial protein folding rather than a myelin structural protein.
    gene:
      preferred_term: HSPD1
      term:
        id: hgnc:5261
        label: HSPD1
- member: Hypomyelinating Leukodystrophy 5
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Hypomyelination with congenital cataract. Hyccin deficiency disturbs the PI4KA complex and phosphoinositide supply to the myelinating membrane; cataract and peripheral neuropathy accompany the CNS hypomyelination.
    gene:
      preferred_term: FAM126A
      term:
        id: hgnc:24587
        label: FAM126A
- member: POLR-Related Leukodystrophy
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      4H leukodystrophy (hypomyelination, hypodontia, hypogonadotropic hypogonadism) from RNA polymerase III (and POLR1C) subunit defects that limit tRNA and small RNA synthesis during myelination.
- member: Hypomyelinating Leukodystrophy 7
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      The POLR3A-specific OMIM phenotype within the 4H spectrum, curated as its own entry alongside the POLR-Related Leukodystrophy umbrella.
    gene:
      preferred_term: POLR3A
      term:
        id: hgnc:30074
        label: POLR3A
- member: TUBB4A-related Neurologic Disorder
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Includes hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC). Dominant-acting beta-tubulin 4A variants disrupt oligodendrocyte microtubules, with additional neuronal (striatal, cerebellar) loss.
    gene:
      preferred_term: TUBB4A
      term:
        id: hgnc:20774
        label: TUBB4A
- member: Hypomyelination with Brain Stem and Spinal Cord Involvement and Leg Spasticity
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      HBSL. Cytoplasmic aspartyl-tRNA synthetase deficiency gives selective hypomyelination of brainstem and spinal cord tracts with predominant leg spasticity.
    gene:
      preferred_term: DARS1
      term:
        id: hgnc:2678
        label: DARS1
- member: Hypomyelinating Leukodystrophy 10
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Mitochondrial pyrroline-5-carboxylate reductase 2 deficiency (proline synthesis) with microcephaly and hypomyelination.
    gene:
      preferred_term: PYCR2
      term:
        id: hgnc:30262
        label: PYCR2
- member: Hypomyelinating Leukodystrophy 12
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Endolysosomal HOPS/CORVET tethering defect (VPS11) impairing vesicle trafficking in myelinating glia.
    gene:
      preferred_term: VPS11
      term:
        id: hgnc:14583
        label: VPS11
- member: Hypomyelinating Leukodystrophy 14
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      UFMylation defect (UFM1 promoter variants) with hypomyelination, microcephaly and epilepsy.
    gene:
      preferred_term: UFM1
      term:
        id: hgnc:20597
        label: UFM1
- member: Hypomyelinating Leukodystrophy 15
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      Bifunctional glutamyl-prolyl-tRNA synthetase deficiency, another aminoacyl-tRNA synthetase cause of hypomyelination.
    gene:
      preferred_term: EPRS1
      term:
        id: hgnc:3418
        label: EPRS1
- member: Hypomyelinating Leukodystrophy 23
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      RNF220 variants with hypomyelination, ataxia, deafness, liver dysfunction and dilated cardiomyopathy.
    gene:
      preferred_term: RNF220
      term:
        id: hgnc:25552
        label: RNF220
- member: Hypomyelinating Leukodystrophy 27
  member_type: DISEASE
  differentiating_mechanisms:
  - description: >-
      RNA polymerase I catalytic subunit (POLR1A) defect, extending the RNA-polymerase cause of hypomyelination beyond Pol III.
    gene:
      preferred_term: POLR1A
      term:
        id: hgnc:17264
        label: POLR1A
notes: >-
  Spastic paraplegia 2 is carried as a subtype of the Pelizaeus-Merzbacher
  Disease entry rather than as a member here. Syndromic disorders with
  hypomyelination that are not classified as leukodystrophies (for example
  Deafness, Dystonia and Cerebral Hypomyelination, and the ELOVL1 ichthyotic
  keratoderma-spasticity-hypomyelination syndrome) are left out, as are the
  mitochondrial and glycosylation disorders that MONDO places under
  hypomyelination.

- reference: PMID:35453527
  reference_title: "Type 2 Diabetes Mellitus as a Risk Factor for Alzheimer's Disease: Review and Meta-Analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "Hazard ratios were reported by nine studies, with a total of 4,229,828 patients showing significantly increased hazard ratios for AD in patients with abnormal glucose metabolism (p = 0.0007)."
  explanation: >-
    Alzheimer-disease-specific pooled hazard ratios across more than four million
    patients, which is what licenses scoping this entry to AD rather than to

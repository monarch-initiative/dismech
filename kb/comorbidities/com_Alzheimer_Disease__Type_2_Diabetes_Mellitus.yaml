- reference: PMID:31430566
  reference_title: "Diabetes mellitus and risks of cognitive impairment and dementia: A systematic review and meta-analysis of 144 prospective studies."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: Diabetes, even prediabetes and changes of diabetes-related biochemical indicators, predicted increased incidence of cognitive impairment and dementia.
  explanation: >-

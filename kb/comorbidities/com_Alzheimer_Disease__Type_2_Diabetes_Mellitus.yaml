name: com_Alzheimer_Disease__Type_2_Diabetes_Mellitus
creation_date: '2026-08-22T00:00:00Z'
curation_status: CURATED
notes: >-
  One of the most heavily replicated comorbidity pairs in the KB's scope, and until
  now unrepresented. The backbone is a meta-analysis of 144 prospective studies
  putting the excess risk of cognitive disorders in diabetes at 1.25- to 1.91-fold,
  with a separate longitudinal meta-analysis confirming the association holds for
  Alzheimer disease specifically rather than only for all-cause dementia.

  Two cautions govern how the effect size may be quoted. First, "diabetes and
  dementia" and "type 2 diabetes and Alzheimer disease" are not interchangeable:
  much of the pooled literature reports all-cause dementia, in which vascular
  dementia is both common and mechanistically closer to diabetes, so an
  all-cause-dementia risk ratio overstates the AD-specific effect. This entry is
  scoped to the AD arm and cites AD-specific pooled analyses for it. Second, the
  risk is graded rather than threshold: prediabetes and continuous glycemic
  indices already carry increased risk, so a binary diabetes/no-diabetes exposure
  understates the relationship.

  Directionality is curated as B_BEFORE_A on the evidenced arm - diabetes exposure
  preceding incident cognitive disorder is what the prospective literature
  measures. The reverse arm is plausible but is NOT established here: this entry
  makes no claim that Alzheimer disease raises incident type 2 diabetes risk, and
  the cellular-aging hypothesis below deliberately stops short of asserting it,
  even though it is the kind of finding that invites that reading.


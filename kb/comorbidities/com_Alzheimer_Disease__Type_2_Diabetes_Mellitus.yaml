- reference: PMID:35453527
  reference_title: "Type 2 Diabetes Mellitus as a Risk Factor for Alzheimer's Disease: Review and Meta-Analysis."
  supports: PARTIAL
  evidence_source: HUMAN_CLINICAL
  snippet: "Risk ratios were reported by five studies with a total of 6628 patients, showing significantly increased risk ratios for AD in patients with abnormal glucose metabolism (p = 0.01) and moderate heterogeneity as expressed by an I2 of 74%."
  explanation: >-
    PARTIAL because the risk-ratio arm rests on a far smaller sample with
    moderate heterogeneity; recorded so the AD-specific estimate is not read as
    uniformly precise across effect measures.

hypotheses:
- description: >-
    Shared accelerated cellular aging, rather than either disease simply causing
    the other, may account for part of the co-occurrence. Cell-type-specific
    plasma proteomic aging clocks show that Alzheimer disease patients carry
    accelerated pancreatic endocrine cell aging, and critically that this is
    present in patients WITHOUT type 2 diabetes, with type 2 diabetes amplifying
    it in a compounding manner. That stratification is what distinguishes this
    from confounding: if the endocrine aging signal in AD were simply undiagnosed
    or comorbid diabetes, it should disappear in the non-diabetic stratum, and it
    does not.

    The same framework produces the converse observation on the other side of the
    pair: myeloid lineage aging predicts incident type 2 diabetes in individuals
    who are still normoglycemic, and pancreatic endocrine cells were among the
    strongest cross-sectional cellular-aging correlates of AD, on a par with
    oligodendrocyte precursor cells and inhibitory neurons.

    Three limits on how far this may be taken. It is cross-sectional in the AD
    arm, so it cannot order the two conditions in time. The protein-to-cell-type
    mapping is probabilistic and bounded by Human Protein Atlas coverage, so
    "pancreatic endocrine cell aging" names an enriched plasma signature, not a
    measured islet state. And an aging signature shared by two diseases is
    equally consistent with a common upstream driver, with reverse causation, and
    with residual confounding by shared risk factors; nothing here adjudicates
    between them.
  evidence:
  - reference: PMID:42297981
    reference_title: Plasma proteomic signatures of cellular aging predict human disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients with AD exhibited accelerated pancreatic endocrine cell aging in the absence of type 2 diabetes, while type 2 diabetes amplified this effect in a compounding manner
    explanation: >-
      The stratified analysis that separates a genuine shared-aging signal from
      confounding by comorbid diabetes, and the single most load-bearing citation
      for this hypothesis.
  - reference: PMID:42297981
    reference_title: Plasma proteomic signatures of cellular aging predict human disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: myeloid lineage aging identified normoglycemic individuals at higher type 2 diabetes risk
    explanation: >-
      The type 2 diabetes arm of the same framework, showing cellular aging
      stratifies diabetes risk before glycemic criteria are met.
  - reference: PMID:42297981
    reference_title: Plasma proteomic signatures of cellular aging predict human disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Accordingly, plasma proteins arise from multiple cellular processes not explicitly disentangled here
    explanation: >-
      PARTIAL: the authors' own concession that a plasma protein assigned to one
      cell type may have several sources, which bounds how literally the
      "pancreatic endocrine cell" attribution may be read.

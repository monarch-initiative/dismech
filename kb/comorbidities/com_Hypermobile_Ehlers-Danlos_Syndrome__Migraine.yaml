hypotheses:
- description: >-
    Hypothesis: migraine in hEDS shares pathophysiology with the broader
    dysautonomia/POTS and MCAS spectrum rather than arising independently --
    autonomic dysregulation of cranial vascular tone and mast-cell-mediated
    neurogenic inflammation are both proposed contributors, on top of any
    direct connective-tissue effect on cranial/cervical vasculature and dural
    structures.
  evidence:
  - reference: PMID:37847487
    reference_title: "Dysautonomia, Hypermobility Spectrum Disorders and Mast Cell Activation Syndrome as Migraine Comorbidities."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Migraine is one of the most common comorbidities of POTS, HSD, and MCAS; conversely, these conditions are also prevalent in patients with migraine, especially in those with multiple systemic symptoms, such as chronic dizziness, lightheadedness, orthostatic intolerance, joint pain, and allergic symptoms."
    explanation: >-
      A dedicated review establishes migraine as bidirectionally comorbid
      with the dysautonomia/hypermobility/MCAS spectrum that hEDS sits
      within, rather than being an isolated, mechanistically unrelated
      comorbidity.
  - reference: PMID:37847487
    reference_title: "Dysautonomia, Hypermobility Spectrum Disorders and Mast Cell Activation Syndrome as Migraine Comorbidities."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Numerous studies indicate a significant overlap and shared pathophysiology in migraine, dysautonomia, HSD, and MCAS."
    explanation: States that the overlap reflects shared pathophysiology rather than coincidental co-occurrence.
  pathophysiology:
  - name: Autonomic and mast-cell-mediated cranial nociceptive sensitization
    description: >-
      Proposed convergent mechanism: autonomic dysregulation of cranial
      vascular tone, combined with mast-cell-mediated neurogenic
      inflammation, sensitizes trigeminovascular nociceptive pathways,
      contributing to migraine in the context of hEDS-associated
      dysautonomia and MCAS.
    biological_processes:
    - preferred_term: sensory perception of pain
      term:
        id: GO:0019233
        label: sensory perception of pain

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005277
  population: >-
    TriNetX research network, retrospective propensity-matched analysis
    (2005-2023), 59,128 matched pairs of EDS patients (excluding Marfan
    syndrome) versus controls.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 19.7
      notes: Migraine prevalence in the EDS cohort.
    - metric_type: OR
      metric_value: 2.5
      metric_ci_lower: 2.4
      metric_ci_upper: 2.6
      p_value: 0.001
      notes: Odds ratio for migraine in EDS versus propensity-matched controls.
    evidence:
    - reference: PMID:41432355
      reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Systemic comorbidities included postural orthostatic tachycardia syndrome (13.2%, OR 899.7, 95% CI 483.8-1673.0, p < 0.001), chronic pain (7.9%, OR 7.0, 95% CI 6.4-7.6, p < 0.001), migraines (19.7%, OR 2.5, 95% CI 2.4-2.6, p < 0.001) and fibromyalgia (9.5%, OR 1.7, 95% CI 1.6-1.8, p < 0.001)."
      explanation: A large propensity-matched cohort quantifies elevated migraine prevalence and odds ratio in EDS patients.

name: com_Hypermobile_Ehlers-Danlos_Syndrome__Migraine
creation_date: '2026-09-18T02:40:05Z'
curation_status: CANDIDATE
notes: >-
  Migraine is one of the most commonly reported comorbidities of hEDS and of
  the associated dysautonomia/POTS and mast cell activation syndrome (MCAS)
  spectrum. A large propensity-matched cohort found migraine in 19.7% of EDS
  patients versus matched controls (OR 2.5), and a dedicated review describes
  migraine as bidirectionally comorbid with POTS, hypermobility spectrum
  disorders, and MCAS. Directionality is UNKNOWN. No ICEES KG signal exists
  for this pair: hEDS (MONDO:0007523) is not a node in the ICEES KG snapshot
  at all (confirmed while curating the hEDS-POTS comorbidity entry).


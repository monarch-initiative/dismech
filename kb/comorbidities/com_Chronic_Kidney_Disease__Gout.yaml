directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Failing renal urate handling is the proximate cause of the hyperuricemia
    that precedes gout. Urate is filtered and then largely reabsorbed by
    transporters in the proximal tubule, and the steady-state serum level is
    set by the net balance of that reabsorption against secretion; when
    excretory capacity falls, serum urate rises until monosodium urate
    supersaturates and deposits in joints. On this account gout in CKD is not a
    coincidental second diagnosis but the articular readout of a renal
    excretory defect.
  evidence:
  - reference: PMID:23318701
    reference_title: The kidney in hyperuricemia and gout.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced renal excretion of urate is the underlying hyperuricemic mechanism in the vast majority of gout patients; most of the genes that affect serum urate level (SUA) encode urate transport"
    explanation: >-
      Identifies impaired renal urate excretion, not overproduction, as the
      dominant mechanism of hyperuricemia in gout, which is what makes kidney
      disease mechanistically upstream.
  - reference: PMID:23318701
    reference_title: The kidney in hyperuricemia and gout.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prevalence of renal comorbidities in gout - hypertension, chronic kidney disease (CKD), and nephrolithiasis - is very high."
    explanation: >-
      Establishes CKD as one of the highly prevalent renal comorbidities of
      gout, corroborating the pairing at the population level.
  pathophysiology:
  - name: Impaired renal urate excretion and hyperuricemia
    description: >-
      Loss of functioning nephrons reduces net urate excretion, raising serum
      urate toward the saturation point at which monosodium urate crystals
      deposit in and around joints.
    biological_processes:
    - preferred_term: urate metabolic process
      term:
        id: GO:0046415
        label: urate metabolic process
    evidence:
    - reference: PMID:23318701
      reference_title: The kidney in hyperuricemia and gout.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "baseline SUA appears to be set by the net balance of absorption and secretion across epithelial cells in the kidney and intestine."
      explanation: >-
        States that the serum urate set point is determined by renal and
        intestinal handling, the process this node represents.
  - name: Serum urate as the graded driver of incident gout in CKD
    description: >-
      Within a CKD population that is already hyperuricemic, the risk of
      developing clinical gout continues to scale with serum urate, indicating
      the urate level and not merely the presence of kidney disease is what
      drives crystal deposition.
    evidence:
    - reference: PMID:41608294
      reference_title: The Incidence and Risk Factors of Gout in Non-dialysis Chronic Kidney Disease Patients With Asymptomatic Hyperuricemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "higher serum urate (per 1 mg/dL; HR, 1.29; 95% CI, 1.14-1.46), lower serum creatinine levels (per 1 mg/dL; HR, 0.81; 95%"
      explanation: >-
        Quantifies the graded, per-unit effect of serum urate on incident gout
        within a CKD cohort, supporting urate as the mediating variable.

- description: >-
    Reverse-direction hypothesis, recorded because it is widely assumed and not
    supported: that hyperuricemia and gout are themselves nephrotoxic, so that
    gout drives incident CKD and lowering urate would protect renal function.
    A 13-year population-based cohort comparing urate-lowering therapy users
    with matched non-users among gout patients found no difference in incident
    CKD. The negative result does not exclude a urate effect on established CKD
    progression, which the cited study did not test, but it does undercut the
    simple causal loop and is why this entry is directed rather than
    BIDIRECTIONAL.
  evidence:
  - reference: PMID:34104091
    reference_title: Urate-lowering Therapy and Chronic Kidney Disease Development in Patients with Gout.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This population-based cohort study indicated that ULT is not associated with lower risk of CKD development."
    explanation: >-
      Removing the hyperuricemia did not reduce incident CKD in gout patients
      (adjusted hazard ratio 0.97, 95% CI 0.88-1.07), arguing against urate as
      a causal driver of new-onset kidney disease.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    771 ambulatory non-dialysis patients with stage 3-5 chronic kidney disease
    and asymptomatic hyperuricemia (serum urate >=7.0 mg/dL) and no prior gout,
    single centre, followed 2010-2023 with a median follow-up of 47 months and
    incident gout confirmed by rheumatology specialists.
  directionality: A_BEFORE_B
  effect_direction: RISK
  mapping_notes: >-
    The cohort is restricted to CKD patients who are already hyperuricemic, so
    the rate is conditioned on the intermediate step of the mechanism and is
    higher than it would be across unselected CKD. Single-centre and
    retrospective, as the authors note.
  statistics:
    metrics:
    - metric_type: INCIDENCE_RATE
      metric_value: 41.9
      notes: >-
        Incident gout per 1,000 person-years; 140 of 771 patients (18.2%) over
        a median 47 months. The denominator is a CKD population followed
        forward with gout excluded at baseline, which is what the directed
        A_BEFORE_B claim requires.
    evidence:
    - reference: PMID:41608294
      reference_title: The Incidence and Risk Factors of Gout in Non-dialysis Chronic Kidney Disease Patients With Asymptomatic Hyperuricemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "gout developed in 140 (18.2%) patients (incidence rate, 41.9 cases per 1,000 person-years). Independent predictors of gout included younger a"
      explanation: >-
        Measures incident gout prospectively within a defined CKD cohort,
        supporting CKD as an antecedent state for gout rather than a
        co-diagnosis.

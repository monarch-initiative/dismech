name: com_Obesity__Gastroesophageal_Reflux_Disease
creation_date: "2026-08-19T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Gastroesophageal_Reflux_Disease.yaml`'s
  `environmental:` block (dismech#8551): that entry listed `Obesity` as an
  "exposure" acting on gastroesophageal reflux disease (GERD), but obesity is
  a first-class `Disease` entry in its own right (`kb/disorders/Obesity.yaml`),
  a body state rather than something external to the organism the patient is
  exposed to. Modeling the relationship as a disease-disease comorbidity
  avoids a near-tautological "exposure" edge that ECTO/XCO can never bind a
  term for. Directionality is A_BEFORE_B: obesity is conventionally modeled as
  an antecedent, modifiable risk state for GERD (raised intra-abdominal
  pressure promoting reflux). The `Hiatal Hernia` entry in the same
  `environmental:` block is left untouched, since no `kb/disorders/` entry for
  hiatal hernia yet exists to migrate it to. Evidence is carried over unchanged
  from the original `environmental:` entry rather than dropped.

disease_a:
  slug: Obesity
  preferred_term: obesity disorder
  term:
    id: MONDO:0011122
    label: obesity disorder

disease_b:
  slug: Gastroesophageal_Reflux_Disease
  preferred_term: gastroesophageal reflux disease
  term:
    id: MONDO:0007186
    label: gastroesophageal reflux disease

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Increasing body mass index raises intra-abdominal and intragastric
    pressure and promotes hiatal hernia formation, mechanically favoring
    gastroesophageal reflux; obesity is a major modifiable risk state for
    GERD.
  evidence:
  - reference: PMID:16952280
    reference_title: "Body mass index and gastroesophageal reflux disease: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrates a positive association between increasing BMI and the presence of GERD"
    explanation: >-
      Meta-analysis of 20 studies. The association held within US studies
      after stratification by country, while European studies were
      heterogeneous. Carried over from the original
      `Gastroesophageal_Reflux_Disease.yaml` `environmental:` entry, in the
      post-dismech#10003 form that entry now carries on `main`.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Meta-analysis of 20 studies comprising 18,346 patients with GERD; the
    quantified estimate is the United States stratum, where the association was
    homogeneous. The European stratum was heterogeneous despite stratification
    and is deliberately not carried as a metric.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 2.15
      metric_ci_lower: 1.89
      metric_ci_upper: 2.45
      notes: >-
        Odds of GERD in obese versus normal-BMI subjects in the US stratum. The
        overweight stratum of the same analysis gives OR 1.57 (1.36-1.80), so
        the two are ordered by BMI category as a dose-response would predict.
    evidence:
    - reference: PMID:16952280
      reference_title: "Body mass index and gastroesophageal reflux disease: a systematic review and meta-analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "1.36-1.80, overweight, OR = 1.57, P value homogeneity = 0.51, 95% CI = 1.89-2.45, obese, OR = 2.15"
      explanation: >-
        Carries both BMI strata of the US estimate. The quote starts mid-clause
        because the abstract prints each confidence interval before its point
        estimate inside a bracketed span; the obese-stratum OR 2.15 (1.89-2.45)
        is the value recorded in the metric above.
    - reference: PMID:16952280
      reference_title: "Body mass index and gastroesophageal reflux disease: a systematic review and meta-analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified 20 studies that included 18,346 patients with GERD."
      explanation: >-
        Establishes the pooled sample behind the effect estimate recorded here.
    - reference: PMID:16952280
      reference_title: "Body mass index and gastroesophageal reflux disease: a systematic review and meta-analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Studies from Europe provided heterogeneous results despite stratification for several factors"
      explanation: >-
        The reason this metric is scoped to the US stratum rather than reported
        as a single pooled figure.

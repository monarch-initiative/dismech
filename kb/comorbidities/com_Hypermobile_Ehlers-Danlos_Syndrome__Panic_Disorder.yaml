name: com_Hypermobile_Ehlers-Danlos_Syndrome__Panic_Disorder
creation_date: '2026-09-24T00:00:00Z'
curation_status: CANDIDATE
notes: >-
  Panic disorder/agoraphobia is the single anxiety disorder most consistently
  and specifically associated with joint hypermobility across a body of
  case-control and cohort literature spanning three decades, largely from one
  research group (Bulbena, Martín-Santos and colleagues, Barcelona). A 1993
  case-control study found panic disorder, agoraphobia, and simple phobia --
  but not generalized anxiety disorder, dysthymic disorder, or major
  depression -- were specifically elevated in joint hypermobility syndrome
  (age- and sex-adjusted OR 10.7). A 1998 case-control study replicated this
  in patients newly diagnosed with panic disorder/agoraphobia (67.7% had
  joint hypermobility syndrome versus 10.1%-12.5% of controls). A 2010
  case-control study replicated the association against three separate
  control groups (psychiatric, fibromyalgia, and healthy). A 2011 prospective
  15-year cohort study established temporal precedence: joint hypermobility
  syndrome assessed at baseline (ages 16-20) predicted a markedly higher
  cumulative incidence of panic/agoraphobia at follow-up (relative risk
  22.3). A 2012 systematic review of 17 studies concluded panic
  disorder/agoraphobia was the anxiety disorder most consistently linked to
  joint hypermobility across the literature. These studies predate the 2017
  hEDS diagnostic criteria and use Beighton-criteria "joint hypermobility
  syndrome" (JHS), the diagnostic predecessor that was folded into the
  hypermobility spectrum disorder/hEDS nosology; they are treated here as the
  closest available literature for the current hEDS diagnosis. Directionality
  is recorded as A_BEFORE_B on the strength of the 2011 prospective cohort,
  in contrast to most other hEDS comorbidity entries in this KB where only
  cross-sectional evidence exists. No ICEES KG signal exists for this pair:
  hEDS (MONDO:0007523) is not a node in the ICEES KG snapshot at all
  (confirmed while curating the hEDS-POTS comorbidity entry).


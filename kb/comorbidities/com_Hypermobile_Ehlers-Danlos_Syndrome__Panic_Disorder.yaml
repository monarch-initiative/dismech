hypotheses:
- description: >-
    Hypothesis (the "neurovisceral phenotype" model, developed substantially
    around this specific pairing): connective-tissue laxity in hEDS is
    accompanied by altered autonomic/interoceptive signaling and heightened
    amygdala and insular cortex reactivity to threat-related stimuli. Because
    panic disorder is itself centrally defined by recurrent, acute
    misinterpretation of interoceptive (bodily) signals as threatening, this
    constitutional interoceptive/autonomic difference is proposed to lower
    the threshold for panic attacks specifically, more than for anxiety
    disorders without a prominent interoceptive-misappraisal component. The
    precise causal chain from connective-tissue collagen abnormality to
    altered central threat processing is not established.
  evidence:
  - reference: PMID:20963520
    reference_title: "Joint hypermobility and anxiety: the state of the art."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "the most significant and important association between joint hypermobility syndrome (JHS) and any other disorder from a clinical point of view is with panic disorder"
    explanation: >-
      A dedicated review of the joint-hypermobility/anxiety literature
      singles out panic disorder as the specific, clinically significant
      association, distinguishing it from anxiety disorders in general.
  - reference: PMID:25713509
    reference_title: "Neurovisceral phenotypes in the expression of psychiatric symptoms."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In a recent functional neuroimaging study of healthy volunteers, hypermobile, compared to non-hypermobile, participants displayed heightened neural reactivity to sad and angry scenes within brain regions implicated in anxious feeling states, notably insular cortex (Mallorqui-Bague et al., 2014)."
    explanation: >-
      The structural/functional neuroimaging correlate proposed to underlie
      the hypermobility-anxiety association generally, and cited here as the
      basis for the panic-specific interoceptive-threshold hypothesis.
    directness: INDIRECT
  - reference: PMID:8464956
    reference_title: "Anxiety disorders in the joint hypermobility syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "DSM-III-R diagnoses of panic disorder, agoraphobia, and simple phobia, but not generalized anxiety disorder, dysthymic disorder, or major depression were found to be highly associated with JHS (age- and sex-adjusted odds ratio = 10.7)."
    explanation: >-
      The founding case-control study establishes that the association is
      specific to panic-spectrum and phobic disorders and explicitly does
      not extend to generalized anxiety disorder or depression, supporting a
      mechanism tied to acute/interoceptive threat response rather than
      anxiety or mood disturbance in general.
    directness: INDIRECT
  pathophysiology:
  - name: Heightened Amygdala and Insular Threat Reactivity
    description: >-
      Functional neuroimaging in hypermobile individuals shows heightened
      amygdala and insular cortex reactivity to threat-related emotional
      stimuli, proposed as the neural substrate underlying the association
      between joint hypermobility and anxiety/panic. A separate, more
      speculative pathway proposed in the same source involves a
      perturbation of autonomic afferent feedback, distinct from
      amygdala/insular reactivity itself and not independently evidenced
      here.
    biological_scale: TISSUE
    locations:
    - preferred_term: amygdala
      term:
        id: UBERON:0001876
        label: amygdala
    - preferred_term: insula
      term:
        id: UBERON:0002022
        label: insula
    downstream:
    - target: Lowered Panic-Attack Threshold via Interoceptive Misappraisal
      causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      description: >-
        Proposed but not mechanistically demonstrated: heightened
        amygdala/insular threat reactivity is proposed to translate into a
        lowered threshold for the acute interoceptive misappraisal that
        defines a panic attack.
    evidence:
    - reference: PMID:25713509
      reference_title: "Neurovisceral phenotypes in the expression of psychiatric symptoms."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "These neuroimaging data implicate the amygdala and insular cortices as the most likely neural substrate underlying the association between of hypermobility, clinical anxiety and psychosomatic disorders."
      explanation: >-
        The review's own synthesis naming the amygdala and insula as the
        proposed neural substrate for the hypermobility-anxiety
        association.
      directness: DIRECT
    - reference: PMID:25713509
      reference_title: "Neurovisceral phenotypes in the expression of psychiatric symptoms."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Speculatively, potential mechanisms that may further account for the mediating role of amygdala between anxiety and hypermobility include heightened susceptibility to the threat of pain and a perturbation of autonomic afferent feedback"
      explanation: >-
        The review's own explicitly speculative extension beyond the
        amygdala/insular neuroimaging finding, naming autonomic afferent
        feedback as a separate proposed mechanism.
      directness: INDIRECT
  - name: Lowered Panic-Attack Threshold via Interoceptive Misappraisal
    description: >-
      Proposed downstream consequence, not directly demonstrated for
      joint-hypermobility carriers specifically: heightened threat
      reactivity in amygdala/insular circuitry is proposed to increase the
      propensity for panic attacks, which are centrally defined by the
      acute misinterpretation of interoceptive (bodily) signals as
      dangerous.
    biological_scale: ORGANISM
    biological_processes:
    - preferred_term: heightened fear response to bodily/interoceptive signals
      term:
        id: GO:0042596
        label: fear response
      modifier: INCREASED
    evidence:
    - reference: PMID:20963520
      reference_title: "Joint hypermobility and anxiety: the state of the art."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "the most significant and important association between joint hypermobility syndrome (JHS) and any other disorder from a clinical point of view is with panic disorder"
      explanation: >-
        Supports panic disorder specifically, rather than anxiety in
        general, as the clinical endpoint of this node; does not itself
        establish the amygdala/insula-to-panic-threshold mechanistic step.
      directness: INDIRECT

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005383
  population: >-
    Case-control study, 114 cases of joint hypermobility syndrome diagnosed
    at a rheumatology outpatient clinic (Hospital del Mar, Barcelona) versus
    59 controls from the same clinic.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: AOR
      metric_value: 10.7
      notes: >-
        Age- and sex-adjusted odds ratio for panic disorder, agoraphobia, and
        simple phobia in JHS versus controls, as reported by the source.
        Generalized anxiety disorder, dysthymic disorder, and major
        depression were explicitly not associated.
    evidence:
    - reference: PMID:8464956
      reference_title: "Anxiety disorders in the joint hypermobility syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DSM-III-R diagnoses of panic disorder, agoraphobia, and simple phobia, but not generalized anxiety disorder, dysthymic disorder, or major depression were found to be highly associated with JHS (age- and sex-adjusted odds ratio = 10.7)."
      explanation: >-
        Directly quantifies the panic/phobic-specific association and its
        adjusted odds ratio.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005383
  population: >-
    Case-control study, 99 newly diagnosed, untreated patients with panic
    disorder, agoraphobia, or both versus 99 psychiatric controls and 64
    medical controls (Spain).
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 67.7
      notes: Prevalence of joint hypermobility syndrome in the panic disorder/agoraphobia group.
    - metric_type: PREVALENCE
      metric_value: 10.1
      notes: Prevalence of joint hypermobility syndrome in the psychiatric control group.
    - metric_type: PREVALENCE
      metric_value: 12.5
      notes: Prevalence of joint hypermobility syndrome in the medical control group.
    evidence:
    - reference: PMID:9812121
      reference_title: "Association between joint hypermobility syndrome and panic disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Joint hypermobility syndrome was found in 67.7% of patients with anxiety disorder but in only 10.1% of psychiatric and 12.5% of medical control subjects."
      explanation: >-
        Direct case-control prevalence comparison; the paper's own "anxiety
        disorder" group here is entirely composed of the panic
        disorder/agoraphobia patients recruited for the study, per its
        method section.
    - reference: PMID:9812121
      reference_title: "Association between joint hypermobility syndrome and panic disorder."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "On the basis of statistical analysis, patients with anxiety disorder were over 16 times more likely than control subjects to have joint laxity."
      explanation: >-
        The paper's own direct characterization of effect size; no single
        precise odds ratio value is given in the abstract, so this is
        recorded as supporting context rather than a numeric metric.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005383
  population: >-
    Case-control study, 55 untreated panic-disorder patients versus matched
    psychiatric, fibromyalgia, and healthy control groups (Spain).
  mapping_notes: >-
    The abstract reports only a qualitative ranking and a within-group
    severity correlation, with no extractable prevalence, odds ratio, or
    confidence interval; recorded as a corroborating case-control replication
    rather than a quantitative metric.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: OTHER
      notes: >-
        No single quantitative metric extractable from the abstract: joint
        hypermobility syndrome was reported as more frequent in the
        panic-disorder group than in each of the three control groups, with
        a significant within-group correlation between hypermobility
        severity and anxiety severity.
    evidence:
    - reference: PMID:20118441
      reference_title: "Association between joint hypermobility syndrome and panic disorder: a case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "JHS was more frequent among panic-disorder than among psychiatric patients, the healthy group, or the fibromyalgia group. In the panic-disorder group, there was a significant correlation between severity of JHS and anxiety."
      explanation: >-
        A third, independent case-control replication against three
        different control populations, plus a severity-severity correlation
        within the panic-disorder group.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005383
  population: >-
    Prospective cohort study, 158 subjects aged 16-20 years recruited from
    the general population of a Spanish rural town, followed for 15 years;
    subjects with anxiety disorders at baseline excluded from follow-up
    analysis.
  mapping_notes: >-
    This is the strongest available signal for this pair: a prospective
    cohort with joint hypermobility syndrome assessed at baseline, before any
    panic/agoraphobia diagnosis, and incident diagnosis assessed 15 years
    later. This is what justifies recording directionality as A_BEFORE_B at
    the entry level rather than UNKNOWN, unlike most cross-sectional
    case-control signals for this and other hEDS comorbidity pairs.
  directionality: A_BEFORE_B
  statistics:
    metrics:
    - metric_type: RR
      metric_value: 22.3
      metric_ci_lower: 4.6
      metric_ci_upper: 108.7
      notes: >-
        Relative risk of incident panic/agoraphobia disorder (as main
        diagnosis) at 15-year follow-up, joint hypermobility syndrome group
        versus non-JHS group. Reported by the source as P<.0001, an upper
        bound not recorded as a point-value p_value here.
    - metric_type: OTHER
      metric_value: 41.4
      notes: Cumulative incidence (not point prevalence) of panic/agoraphobia at 15-year follow-up in the JHS-at-baseline group.
    - metric_type: OTHER
      metric_value: 1.9
      notes: Cumulative incidence (not point prevalence) of panic/agoraphobia at 15-year follow-up in the non-JHS control group.
    evidence:
    - reference: PMID:21762833
      reference_title: "Joint hypermobility syndrome is a risk factor trait for anxiety disorders: a 15-year follow-up cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cumulative incidence of panic/agoraphobia disorder at follow-up, as main diagnosis, was significantly higher for the JHS group (41.4%) than for the control group (1.9%), with a relative risk of 22.3 [95% confidence interval (CI) 4.6-108.7, P<.0001] (Number Needed to Treat [NNT] 3, 95% CI 2.9-2.3)."
      explanation: >-
        The prospective, baseline-to-follow-up quantification of risk,
        establishing temporal precedence of joint hypermobility syndrome
        over incident panic/agoraphobia.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005383
  population: >-

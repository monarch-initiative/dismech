name: com_Hypermobile_Ehlers-Danlos_Syndrome__Mitral_Valve_Prolapse
creation_date: '2026-09-18T02:57:53Z'
curation_status: CANDIDATE
notes: >-
  Mitral valve prolapse (MVP) and aortic root dilation are part of the 2017
  hEDS diagnostic criteria's cardiovascular assessment, and earlier smaller
  studies reported MVP in 6-21% of hEDS/HSD patients, motivating a widely
  held assumption of substantial excess prevalence. A large, well-defined
  Mayo Clinic EDS Clinic cohort (n=568 with echocardiogram data, diagnosed
  per the 2017 criteria) found diagnosed MVP in only 3.5% of hEDS patients
  (6/170) -- similar to a cited general-population prevalence of 2.7% -- and
  explicitly concluded that cardiac defects in hEDS/HSD are similar to the
  general population. This contrasts with an earlier, smaller
  specialty-clinic cohort (Rashed et al., cited within this paper but not
  independently verified here) reporting 7.5% MVP in combined hEDS/HSD,
  which the authors attribute to referral bias toward patients with more
  cardiovascular concerns. This entry records the larger, more recent,
  criteria-consistent cohort as the primary signal, honestly characterized
  as REFUTE for a large comorbidity effect. Directionality is UNKNOWN. No
  ICEES KG signal exists for this pair: hEDS (MONDO:0007523) is not a node
  in the ICEES KG snapshot at all (confirmed while curating the hEDS-POTS
  comorbidity entry).


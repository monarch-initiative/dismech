hypotheses:
- description: >-
    Hypothesis under test: connective-tissue laxity affecting the mitral
    valve leaflets and chordae tendineae in hEDS produces excess MVP
    prevalence relative to the general population, motivating its inclusion
    in the 2017 hEDS diagnostic criteria's cardiovascular workup. The largest
    well-characterized cohort assessed against the current diagnostic
    criteria found MVP prevalence in hEDS similar to the general population,
    arguing against a large mechanistic effect, though the authors note
    smaller/differently-ascertained cohorts have reported higher rates.
  evidence:
  - reference: PMID:38562189
    reference_title: "Cardiac defects of hypermobile Ehlers-Danlos syndrome and hypermobility spectrum disorders: a retrospective cohort study."
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of MVP in patients in this study with hEDS was 3.5% or HSD was 1.8%, similar to the prevalence of MVP in the general population of 2.7%"
    explanation: >-
      The study's own discussion directly compares its finding against the
      general-population MVP prevalence and concludes they are similar,
      arguing against a large connective-tissue-laxity effect on MVP risk.
  pathophysiology:
  - name: Mitral valve connective-tissue laxity (mild, non-excess)
    description: >-
      Laxity of the mitral valve leaflets and chordae tendineae is the
      proposed mechanism for MVP in hEDS, part of the rationale for including
      cardiovascular assessment in the 2017 diagnostic criteria, though the
      largest criteria-consistent cohort found this does not translate into
      a substantially elevated MVP prevalence versus the general population.
    biological_processes:
    - preferred_term: heart valve development
      term:
        id: GO:0003170
        label: heart valve development


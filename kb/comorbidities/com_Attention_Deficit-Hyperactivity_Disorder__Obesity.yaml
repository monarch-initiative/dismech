name: com_Attention_Deficit-Hyperactivity_Disorder__Obesity
creation_date: '2026-11-18T00:00:00Z'
curation_status: CURATED
notes: >-
  The association is established at the population level but is modest and
  strongly age-dependent. Two independent meta-analyses of roughly 700,000
  participants each agree on a small pooled effect (OR 1.20-1.22 overall) that is
  larger in adults (OR 1.37-1.55) than in children (OR 1.13-1.20), and Nigg et al.
  judge the childhood effect unlikely to be of clinical significance. The two
  meta-analyses do not cover the same study set, so they are corroborating rather
  than independent replications.

  Direction is not settled by the observational data, which are mostly
  cross-sectional. The one bidirectional two-sample Mendelian randomization study
  found evidence that higher BMI raises ADHD liability and no consistent evidence
  for the reverse; it is recorded as a B_BEFORE_A signal, while the entry-level
  directionality is left UNKNOWN because a single MR analysis using BMI
  instruments, many of which act through neural pathways, does not by itself
  establish a direction for the clinical comorbidity.

  Medication is the main moderator to keep in view. Cortese et al. found that
  individuals medicated for ADHD were not at higher risk of obesity, and in Nigg
  et al.'s longitudinal sample stimulant use was associated with time-specific
  BMI reductions, so treated and untreated populations should not be pooled
  without stating which is meant.

  This entry was opened from the psychiatric-insulin-resistance multimorbidity
  genomic-SEM study (issue #6399), on which ADHD and obesity both load positively.
  As in the MDD-type 2 diabetes entry, that factor is a property of an
  eight-condition joint model and is not pair-specific evidence; it must not be
  reused for anorexia nervosa or OCD, which load negatively. ADHD-type 2 diabetes
  is a separate follow-up pair not covered here.


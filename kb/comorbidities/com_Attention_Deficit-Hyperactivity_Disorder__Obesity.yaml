- source: LITERATURE
  method: COMPUTATIONAL_INFERENCE
  signal_disorder_a_id: MONDO:0007743
  signal_disorder_b_id: MONDO:0011122
  population: >-
    Bidirectional two-sample Mendelian randomization using GWAS consortium
    summary data for ADHD (N = 55,374) and for BMI in childhood (N = 35,668) and
    adulthood (N = 322,154-500,000), with inverse-variance weighted estimation as
    the main analysis.
  directionality: B_BEFORE_A
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OTHER
      metric_value: 0.324
      metric_ci_lower: 0.198
      metric_ci_upper: 0.449
      p_value: 0.001
      notes: >-
        Inverse-variance weighted beta, expressed as change in ln(odds ratio) of
        ADHD per additional SD unit of BMI; the source reports p < 0.001, recorded
        here at the bound.
    evidence:
    - reference: PMID:31000774
      reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The IVW method indicated a positive causal effect of BMI on ADHD: β = 0.324 (95% CI 0.198 to 0.449, p < 0.001; expressed as change in ln(odds ratio) of ADHD per each additional SD unit of BMI)."
      explanation: Quantifies the genetically instrumented BMI-to-ADHD effect.
    - reference: PMID:31000774
      reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "On the other hand, we did not find consistent evidence for a causal effect of ADHD genetic liability on BMI."
      explanation: The reverse, ADHD-to-BMI, direction was not supported.
  notes: >-
    BMI is a continuous trait rather than the obesity diagnosis, and many BMI
    instruments act through neural pathways; the authors stratified instruments
    by whether they are involved in neurological processes for that reason.

- source: LITERATURE
  method: COMPUTATIONAL_INFERENCE
  signal_disorder_a_id: MONDO:0007743
  signal_disorder_b_id: MONDO:0011122
  population: >-
    Genomic structural equation modeling over GWAS of five psychiatric disorders
    (ADHD, anorexia nervosa, MDD, OCD, schizophrenia) and three
    insulin-resistance-related conditions (metabolic syndrome, obesity, type 2
    diabetes mellitus), N = 9,725-933,970, followed by a multivariate GWAS of the
    resulting latent Psych-IR factor.
  directionality: UNKNOWN
  effect_direction: RISK
  mapping_notes: >-
    This signal is a property of an eight-condition latent factor, not of the
    ADHD-obesity pair in isolation; both members of this pair load positively on
    it.
  statistics:
    evidence:
    - reference: PMID:42435748
      reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Factor analyses identified a latent genetic factor (Psych-IR factor) capturing shared genetics across psychiatric disorders (excluding schizophrenia) and IR-related conditions."
      explanation: >-
        Establishes a shared genetic factor spanning the psychiatric and
        insulin-resistance conditions that include ADHD and obesity.
  notes: >-
    Shared genetic liability of this kind is a common-cause model and does not by
    itself imply a directional effect between ADHD and obesity.

hypotheses:
- description: >-
    Shared genetic liability may account for part of the co-occurrence. ADHD
    shows genome-wide genetic correlation with BMI, waist-to-hip ratio and
    childhood obesity, and ADHD and obesity load positively on the same latent
    Psych-IR genetic factor. Neither result identifies a specific shared locus or
    distinguishes pleiotropy from a causal path; that would need local genetic
    correlation and colocalization for this pair.
  evidence:
  - reference: PMID:30478444
    reference_title: "Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Similarly, genetic correlations related to obesity include significant relationships with body mass index (BMI; rg = 0.26, P = 1.68 × 10−15)"
    explanation: Genome-wide genetic correlation between ADHD and BMI.
  - reference: PMID:30478444
    reference_title: "Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Positive genetic correlations between ADHD and health risk behaviors such as smoking and obesity are consistent with the observed increase in those behaviors among individuals with ADHD"
    explanation: >-
      The GWAS authors read the ADHD-obesity genetic correlation as consistent
      with the clinical comorbidity.
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Positive loadings were observed for ADHD, MDD, and IR-related conditions and negative loadings for AN and OCD."
    explanation: >-
      ADHD and obesity share the sign of the loading on the shared factor, which
      is not a general psychiatric-risk axis given the negative loadings for
      anorexia nervosa and OCD.

- description: >-
    ADHD symptoms may promote weight gain through behavior. Impulsivity is
    proposed to drive disordered eating, including binge eating and choice of
    energy-dense foods; inattention to blunt receptivity to satiety cues and
    disrupt regular eating; and executive dysfunction to undermine sustained diet
    and exercise. Reduced physical activity and abnormal eating patterns are the
    most studied of these routes, while hormonal, metabolic and neurobiological
    appetite-regulation mechanisms have not been evaluated. The only Mendelian
    randomization study did not find consistent support for a genetically
    instrumented ADHD-to-BMI effect, which weighs against this direction as the
    main explanation.
  evidence:
  - reference: PMID:29772309
    reference_title: "Attention deficit/hyperactivity-disorder and obesity: A review and model of current hypotheses explaining their comorbidity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The bulk of current research has focused on reduced physical activity and abnormal eating patterns as possible causes of weight gain in individuals with ADHD. Further research is needed to explore the specific role of executive dysfunctions."
    explanation: >-
      Review identifying the behavioral routes from ADHD to weight gain that have
      been studied, and executive dysfunction as an open question.
  - reference: PMID:29772309
    reference_title: "Attention deficit/hyperactivity-disorder and obesity: A review and model of current hypotheses explaining their comorbidity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "None of the available published studies have evaluated physiological mechanisms such as hormonal and metabolic disorders or inappropriate neurobiological regulation of appetite."
    explanation: Records that physiological mediators of this route are untested.
  - reference: PMID:26780581
    reference_title: "Attention-deficit/hyperactivity disorder (ADHD) and being overweight/obesity: New data and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two of the symptoms central to ADHD, impulsivity and inattention, may increase the risk of obesity through separate, but related, means"
    explanation: >-
      Introduction of the meta-analysis summarizing the proposed symptom-level
      routes; this is the authors' synthesis of prior work, not their result.
  - reference: PMID:31000774
    reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: "On the other hand, we did not find consistent evidence for a causal effect of ADHD genetic liability on BMI."
    explanation: >-
      Genetically instrumented ADHD liability did not consistently raise BMI,
      which counts against ADHD-to-obesity causation as the dominant pathway.

- description: >-
    Higher adiposity may raise the risk of ADHD rather than, or as well as, the
    reverse. Bidirectional Mendelian randomization found a positive effect of BMI
    on ADHD liability. The mechanism is not identified, and because many BMI
    instruments act on neural pathways this result is also compatible with
    pleiotropy through shared neurobiology rather than an effect of adipose
    tissue itself.
  evidence:
  - reference: PMID:31000774
    reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The IVW method indicated a positive causal effect of BMI on ADHD: β = 0.324 (95% CI 0.198 to 0.449, p < 0.001; expressed as change in ln(odds ratio) of ADHD per each additional SD unit of BMI)."
    explanation: Genetically instrumented BMI-to-ADHD effect.
  - reference: PMID:31000774
    reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The results suggested that higher BMI increases the risk of developing ADHD, but not the other way around."
    explanation: The authors' conclusion on direction.

- description: >-
    Treatment and comorbid psychopathology modify the observed association.
    Stimulant medication suppresses appetite and is associated with lower BMI,
    and individuals medicated for ADHD were not at higher risk of obesity, so the
    association is concentrated in untreated individuals. In a large US survey
    the association was confined to adolescent girls and was statistically
    accounted for by covarying depression and conduct disorder, so part of the
    signal in youth may run through those comorbidities.
  evidence:
  - reference: PMID:26315982
    reference_title: "Association Between ADHD and Obesity: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals medicated for ADHD were not at higher risk of obesity."
    explanation: Medication status moderates the association.
  - reference: PMID:26780581
    reference_title: "Attention-deficit/hyperactivity disorder (ADHD) and being overweight/obesity: New data and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, stimulant use was associated with time-specific reductions in BMI"
    explanation: >-
      In the authors' new longitudinal child sample, stimulant use tracked with
      lower BMI at the time points it was used.
  - reference: PMID:26780581
    reference_title: "Attention-deficit/hyperactivity disorder (ADHD) and being overweight/obesity: New data and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the national survey, ADHD was associated with obesity only in adolescent girls but not in children or boys; this effect was statistically accounted for by covarying of depression and conduct disorder."
    explanation: >-
      Comorbid depression and conduct disorder account for the youth
      association in this survey.

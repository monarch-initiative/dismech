literature_evidence:
- reference: PMID:26315982
  reference_title: "Association Between ADHD and Obesity: A Systematic Review and Meta-Analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "A significant association between obesity and ADHD was found for both children (odds ratio=1.20, 95% CI=1.05-1.37) and adults (odds ratio=1.55, 95% CI=1.32-1.81)."
  explanation: >-
    Meta-analysis of 42 studies (728,136 individuals) establishing the
    association in both age groups, with a larger effect in adults.
- reference: PMID:26315982
  reference_title: "Association Between ADHD and Obesity: A Systematic Review and Meta-Analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "The significant association between ADHD and obesity remained when limited to studies 1) reporting odds ratios adjusted for possible confounding factors; 2) diagnosing ADHD by direct interview; and 3) using directly measured height and weight."
  explanation: >-
    The association survives restriction to confounder-adjusted studies,
    interview-based ADHD diagnosis and measured anthropometry, which argues
    against a pure measurement or reporting artefact.
- reference: PMID:26780581
  reference_title: "Attention-deficit/hyperactivity disorder (ADHD) and being overweight/obesity: New data and meta-analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "ADHD has a small overall association with obesity, but this effect is moderate in adults. The effect is likely to be of no clinical significance in children, possible clinical significance in adolescent girls with comorbid disorders, and of clinical relevance by adulthood."
  explanation: >-
    A second, independently assembled meta-analysis (43 studies, 703,937
    participants) agrees on a small overall effect and scopes its clinical
    relevance to adulthood.
- reference: PMID:31000774
  reference_title: "Assessing causality in the association between attention-deficit/hyperactivity disorder and obesity: a Mendelian randomization study."
  supports: SUPPORT
  evidence_source: COMPUTATIONAL
  snippet: "The results suggested that higher BMI increases the risk of developing ADHD, but not the other way around."
  explanation: >-
    Bidirectional Mendelian randomization supports a causal effect of BMI on
    ADHD liability and does not support the reverse direction.
- reference: PMID:30478444
  reference_title: "Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder."
  supports: SUPPORT
  evidence_source: COMPUTATIONAL
  snippet: "Similarly, genetic correlations related to obesity include significant relationships with body mass index (BMI; rg = 0.26, P = 1.68 × 10−15), waist-to-hip ratio (rg = 0.30, P= 1.16 × 10−17), childhood obesity (rg = 0.22, P = 3.29 × 10−6)"
  explanation: >-
    Genome-wide genetic correlations between ADHD and BMI, waist-to-hip ratio
    and childhood obesity indicate shared genetic liability between the pair.
- reference: PMID:42435748
  reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
  supports: SUPPORT
  evidence_source: COMPUTATIONAL
  snippet: "Positive loadings were observed for ADHD, MDD, and IR-related conditions and negative loadings for AN and OCD."
  explanation: >-
    Places ADHD and obesity on the same side of a shared latent genetic factor,
    as part of an eight-condition joint model rather than a pair-specific
    analysis.


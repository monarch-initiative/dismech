name: com_Hirschsprung_Disease__Neuroblastoma
creation_date: '2026-11-16T00:00:00Z'
curation_status: CANDIDATE
notes: >-
  What the cited literature supports here is narrow, and the record is scoped to it. A germline
  PHOX2B missense variant has been reported in a patient who had both Hirschsprung disease and
  neuroblastoma, and PHOX2B variants are separately reported in neuroblastoma without Hirschsprung
  disease and in congenital central hypoventilation syndrome with Hirschsprung disease. That is a
  shared gene plus an individual co-occurrence. It is not a measured association between the two
  diseases, and nothing cited here makes it one.

  No association_signals block is present, and that is deliberate rather than pending. No cached
  ICEES record is keyed on MONDO:0005072 or MONDO:0018309, so there is no EHR cohort statistic
  available to quote. The literature offers three figures that look like co-occurrence rates and
  are not: twenty per cent for Hirschsprung disease and five to ten per cent for neuroblastic
  tumours, each reported of patients with congenital central hypoventilation syndrome but each
  taken from a different external series; forty-five and ten cases in a 188-proband cohort of that
  syndrome; and eleven and six among thirteen carriers of a missense or frameshift PHOX2B variant.
  Every one of those pairs is two marginal proportions measured on patients who have the
  hypoventilation syndrome, joined by the word respectively, so each gives the frequency of
  Hirschsprung disease and the frequency of a tumour separately and neither gives the frequency of
  one given the other. A
  reader wanting a rate for this pair should know that the sources cited do not contain one.

  effect_direction is left unset for the same reason. The slot asserts that one member raises or
  lowers risk of the other, and no cited source estimates a risk in either direction.
  directionality is UNKNOWN: the single patient whose course is described had Hirschsprung disease
  diagnosed neonatally and multifocal neuroblastoma at nine months, which orders the two events in
  that one child and says nothing about the pair in general.

  Why this is a comorbidity record at all, given that MONDO has a combined concept. MONDO:0013082
  Hirschsprung disease-ganglioneuroblastoma syndrome names a single disease covering one such
  combination, and the Ganglioneuroblastoma entry places that concept out of its own scope. Two
  things keep the pair recordable here. The combined MONDO concept is specific to
  ganglioneuroblastoma, whereas the patient cited in this record had neuroblastoma; and the tumour
  histology in the larger cohort was mixed, seven neuroblastoma against one ganglioneuroblastoma
  and two ganglioneuroma, so the co-occurrence is not confined to the histology the combined
  concept names. Whether the broader pairing should eventually be modelled as a disease rather than
  a comorbidity is open.

  The two entries this record joins are asymmetric about each other. The Neuroblastoma entry
  already names Hirschsprung disease once, inside the prose of its PHOX2B genetic record. The
  Hirschsprung disease entry does not mention neuroblastoma, ganglioneuroblastoma or
  ganglioneuroma anywhere, and its own PHOX2B gene record cites that gene only for congenital
  central hypoventilation syndrome. Neither cited source screens an isolated Hirschsprung cohort
  for germline PHOX2B variants, so the gene's role in Hirschsprung disease without a
  hypoventilation syndrome or a tumour is not established by anything quoted here.

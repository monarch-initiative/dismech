literature_evidence:
- reference: PMID:15024693
  reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
  supports: SUPPORT
  directness: DIRECT
  quote_role: PRIMARY_RESULT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    Here, we report on heterozygous missense mutations located in the homeodomain of PHOX2B in both
    a familial case of NB (mutation R100L) and an isolated case of NB associated with HSCR (mutation
    R141G).
  explanation: >-
    The core of the record: a germline PHOX2B variant identified in a patient who had both
    conditions. The same sentence shows the gene also acting in neuroblastoma without Hirschsprung
    disease, which is why the pair is recorded as a shared predisposition rather than as one
    condition causing the other.
- reference: PMID:15024693
  reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
  supports: SUPPORT
  directness: DIRECT
  quote_role: PRIMARY_RESULT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    He received the diagnosis of HSCR in the neonatal period and was treated surgically, with a good
    result. Multifocal tumors, both thoracic and abdominal, were diagnosed at age 9 mo and were
    surgically removed. The histological examination confirmed the diagnosis of multifocal NB.
  explanation: >-
    The only temporal ordering in either cited source, and it covers one child. Hirschsprung disease
    came first, which is the reason directionality is UNKNOWN rather than A_BEFORE_B - a single
    course cannot establish an ordering for the pair.
- reference: PMID:15024693
  reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
  supports: SUPPORT
  quote_role: PRIMARY_RESULT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    The R141G mutation identified in patient 2 is inherited from the healthy mother (fig. 1A and 1C).
  explanation: >-
    The variant in the patient with both conditions came from a parent the paper describes as
    healthy. The paper does not read that as settled incomplete penetrance: it offers three
    explanations for the observation - a tumour developing in adulthood, spontaneous regression, and
    incomplete penetrance - and chooses between none of them. What it bounds is how strongly the
    shared-gene hypothesis below can be worded, whichever explanation holds.
- reference: PMID:15024693
  reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
  supports: NO_EVIDENCE
  quote_role: PRIMARY_RESULT
  evidence_source: HUMAN_CLINICAL
  snippet: It is unfortunate that no tumoral sample for patient 2 was available for study.
  explanation: >-
    No somatic analysis was possible in the patient who had both conditions, so whether a second
    event occurred in his tumour is unknown. Recorded because the loss-of-heterozygosity result in
    the same paper comes from the other, familial patient and must not be read as applying here.
- reference: PMID:15657873
  reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation
    syndrome.
  supports: SUPPORT
  directness: INDIRECT
  quote_role: PRIMARY_RESULT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    Here, we report the clinical and molecular assessments of a cohort of 188 probands with CCHS,
    either isolated or associated with Hirschsprung disease and/or TSNS.
  explanation: >-
    Establishes that the larger cohort behind the figures discussed in this record was recruited for
    congenital central hypoventilation syndrome, with Hirschsprung disease and sympathetic nervous
    system tumours as associated features. INDIRECT because the cohort is defined by a third
    condition: it is why that cohort's proportions are not co-occurrence rates for this pair.
hypotheses:
- description: >-
    A single germline PHOX2B variant predisposing to both conditions is the only mechanism the cited
    sources support, and they support it at the level of the gene rather than of a pathway. The
    first quoted statement below is the citing paper restating work published elsewhere; the second
    is the authors' own, and it is explicit that the molecular mechanism in neuroblastoma was
    unresolved. No cited source
    proposes a shared cell of origin, and none states that the aganglionic enteric precursor becomes
    the tumour, so this record does not assert either.
  evidence:
  - reference: PMID:15024693
    reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation and expression studies in humans showed that PHOX2B is involved in a wide spectrum of
      autonomic nervous system disorders, ranging from dysgenetic malformations (CCHS and HSCR) to
      tumor predisposition (NB)
    explanation: >-
      States the span the hypothesis rests on: one gene reaching both a developmental malformation
      and a tumour predisposition.
  - reference: PMID:15024693
    reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies should enable us to determine whether dominant negative effect or
      haploinsufficiency account for the role of PHOX2B in the development of NB.
    explanation: >-
      The authors state that the mechanism is unsettled, which is why this record names a shared
      gene and declines to name a molecular mechanism.
shared_upstream_hypotheses:
- upstream_disorder:
    slug: PHOX2B-Related_Neuroblastic_Tumor_Susceptibility
    preferred_term: PHOX2B-related neuroblastic tumor susceptibility
    term:
      id: MONDO:0700041
      label: neuroblastoma, susceptibility to, 2
  description: >-
    The PHOX2B predisposition is recorded as a shared antecedent rather than as a path between the
    two members, because that is how the cited sources describe it: the same locus produces the
    hypoventilation and Hirschsprung phenotypes and the tumour predisposition, and the conditions it
    produces are described as allelic - one locus, different alleles, not one genotype. Which allele
    matters: the other source cited here separates the alleles by the kind of tumour and the risk
    it carries. An invasive neuroblastoma occurred in 6 of 13 patients with a missense or frameshift
    variant, against a differentiated ganglioneuroma in 2 of 161 with an in-frame polyalanine
    duplication, so the expansion alleles are not risk-free - the risk is far lower and the tumour
    is differentiated. This repository curates that predisposition as its own disease entry, so it
    is available as an upstream concept rather than only as a gene mentioned in
    prose. What is not supported is any share of the pairing attributable to it - no cited source
    quantifies how much of the co-occurrence PHOX2B explains.
  evidence:
  - reference: PMID:15024693
    reference_title: Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we showed that isolated CCHS and CCHS associated with HSCR (Haddad syndrome),
      whatever the presence or absence of NB, are allelic conditions.
    explanation: >-
      Supports treating the locus as a common antecedent: the conditions with and without the tumour
      are allelic, so one locus spans the set rather than one member causing the other. INDIRECT for
      the same reason as the cohort item above: the sentence is framed on the hypoventilation
      syndrome, and reading it as a statement about this record's pair means dropping that frame.
  - reference: PMID:15657873
    reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation
      syndrome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, frameshift and missense PHOX2B mutations may predispose to neuroblastoma, as
      opposed to mutations leading to polyalanine expansions (table 2).
    explanation: >-
      Sources the allele-specificity claim in the description. DIRECT for that narrow claim, which
      is what this sentence asserts, rather than for the record's pair. The sentence itself is
      hedged - may predispose - although the paper's title and abstract state the genotype-tumour
      link more strongly, so the hedge belongs to the sentence and not to the source.
  - reference: PMID:15657873
    reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation
      syndrome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, an invasive tumor (neuroblastoma) was diagnosed in 6 (46%) of 13 patients harboring
      either a missense or a frameshift mutation, whereas a differentiated tumor (ganglioneuroma)
      was diagnosed in only 2 (1.24%) of 161 patients harboring an in-frame duplication leading to
      an expansion of +9 alanines in one and +13 in the other.
    explanation: >-
      The figures behind the allele contrast, and the reason the description does not say polyalanine
      expansions carry no risk. They carry a much lower one, and the tumour that occurs is
      differentiated rather than invasive.

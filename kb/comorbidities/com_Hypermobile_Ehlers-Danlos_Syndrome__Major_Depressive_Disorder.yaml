directionality: UNKNOWN

hypotheses:
- description: >-
    Hypothesis: depression in hEDS is largely secondary to the disease's
    chronic pain, multisystem symptom burden, disability, and diagnostic
    odyssey, though the same "neurovisceral phenotype" mechanism proposed for
    anxiety (altered interoceptive/autonomic signaling and amygdala/insular
    reactivity) may also predispose to mood symptoms rather than depression
    being purely a reactive consequence of chronic illness.
  evidence:
  - reference: PMID:37761523
    reference_title: "Exploring Comorbidities in Adolescent and Young Adults with Hypermobile Ehlers-Danlos Syndrome with and without a Surgical History: A Preliminary Investigation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over half (59%) of the sample had documented psychiatric comorbidities, with the maximum number of reported psychiatric comorbidities being 4 for one patient. The mean number of psychiatric comorbidities was 1.2 (SD = 1.2). Of the 59% of the total sample of individuals reporting psychiatric comorbidities, 47% reported a diagnosis of anxiety and 30% reported a diagnosis of depression."
    explanation: >-
      A chart-review cohort of adolescent/young adult hEDS patients
      documents a 30% depression diagnosis rate alongside a high overall
      psychiatric comorbidity burden.
  pathophysiology:
  - name: Chronic-pain-associated mood dysregulation
    description: >-
      Sustained chronic pain, multisystem symptom burden, and disability
      from hEDS are proposed to contribute to depressive symptoms, with a
      possible additional contribution from the same altered
      interoceptive/autonomic signaling implicated in hEDS-associated
      anxiety.
    biological_processes:
    - preferred_term: sensory perception of pain
      term:
        id: GO:0019233
        label: sensory perception of pain

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0002009
  population: >-
    TriNetX research network, retrospective propensity-matched analysis
    (2005-2023), 59,128 matched pairs of EDS patients (excluding Marfan
    syndrome) versus controls.
  mapping_notes: >-
    The cohort study reports a broad "depression" diagnostic category rather
    than major depressive disorder specifically; recorded here against MDD
    as the closest existing dismech disorder entry.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 18.7
      notes: Depression (broad diagnostic category) prevalence in the EDS cohort.
    - metric_type: OR
      metric_value: 1.3
      metric_ci_lower: 1.2
      metric_ci_upper: 1.3
      p_value: 0.001
      notes: Odds ratio for depression in EDS versus propensity-matched controls.
    evidence:
    - reference: PMID:41432355
      reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Psychiatric conditions showed heightened prevalence of anxiety (26.1%, OR 1.8, 95% CI 1.7-1.8, p < 0.001) and depression (18.7%, OR 1.3, 95% CI 1.2-1.3, p < 0.001)."
      explanation: A large propensity-matched cohort quantifies elevated depression prevalence and odds ratio in EDS patients.

- source: LITERATURE

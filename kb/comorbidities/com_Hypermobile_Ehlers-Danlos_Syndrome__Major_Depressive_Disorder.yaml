name: com_Hypermobile_Ehlers-Danlos_Syndrome__Major_Depressive_Disorder
creation_date: '2026-09-18T02:40:05Z'
curation_status: CANDIDATE
notes: >-
  Depression is a commonly reported hEDS comorbidity, though less
  specifically studied than the anxiety/panic-disorder association. A large
  propensity-matched cohort found a broad "depression" diagnostic category
  in 18.7% of EDS patients versus matched controls (OR 1.3); this is a
  broader depressive-disorder category rather than a figure specific to
  major depressive disorder (see mapping_notes). A separate chart-review
  cohort of adolescent/young adult hEDS patients found 30% reporting a
  depression diagnosis. Directionality is UNKNOWN. No ICEES KG signal exists
  for this pair: hEDS (MONDO:0007523) is not a node in the ICEES KG
  snapshot at all (confirmed while curating the hEDS-POTS comorbidity
  entry).


name: com_Hyperlipidemia__Peripheral_Artery_Disease
creation_date: "2026-08-19T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Peripheral_Artery_Disease.yaml`'s `environmental:`
  block (dismech#8551): that entry listed `Dyslipidemia` as an "exposure"
  acting on peripheral artery disease (PAD), but dyslipidemia is modeled in
  this KB as the first-class `Disease` entry `Hyperlipidemia`
  (`kb/disorders/Hyperlipidemia.yaml`, MONDO:0021187), not something external
  to the organism the patient is exposed to. Modeling the relationship as a
  disease-disease comorbidity avoids a near-tautological "exposure" edge that
  ECTO/XCO can never bind a term for. Directionality is A_BEFORE_B: LDL
  elevation is a causal antecedent risk state for PAD (Mendelian randomization
  and trial evidence). Evidence is carried over unchanged from the original
  `environmental:` entry rather than dropped.

disease_a:
  slug: Hyperlipidemia
  preferred_term: hyperlipidemia
  term:
    id: MONDO:0021187
    label: hyperlipidemia

disease_b:
  slug: Peripheral_Artery_Disease
  preferred_term: peripheral arterial disease
  term:
    id: MONDO:0005386
    label: peripheral arterial disease

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Elevated LDL cholesterol drives atherosclerotic plaque formation in
    peripheral arteries (see the `atherogenesis` module), and Mendelian
    randomization and trial evidence support a causal, not merely
    associative, role for LDL-cholesterol elevation in the development of
    peripheral artery disease.
  evidence:
  - reference: PMID:33221847
    reference_title: "LDL-Cholesterol versus Glucose in Microvascular and Macrovascular Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDL-cholesterol has a causal effect on risk of peripheral arterial disease"
    explanation: >-
      Review synthesizing Mendelian randomization and trial evidence,
      supporting the LDL fraction specifically and stating the relationship
      causally rather than as an association. Carried over unchanged from the
      original `Peripheral_Artery_Disease.yaml` `environmental:` entry.

  snippet: "In adjusted models, MDD patients (n = 405,397) were at a 64% increased risk for vitiligo (hazard ratio 1.64"
  explanation: >-
    In a large UK primary-care cohort, incident MDD preceded an increased
    hazard of subsequently recorded vitiligo after covariate adjustment.
- reference: PMID:30528503
  reference_title: "Vitiligo and major depressive disorder: A bidirectional population-based cohort study."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "Compared with the referent cohort (n = 6,137,696), patients with vitiligo (n = 7104) that were <30 years of age at diagnosis had a higher risk of developing MDD than patients ≥30 years of age (hazard ratio 1.31, 95% CI 1.14-1.50, P < .0001 vs 1.22, 95% CI 1.08-1.37, P = .001, respectively)."
  explanation: >-
    The reverse analysis also found an increased hazard of subsequently
    recorded MDD after incident vitiligo, with age-stratified estimates.
- reference: PMID:41781039
  reference_title: "Prevalence and comparative risk of mental health disorders in persons with vitiligo: a retrospective matched cohort study using claims data with expert-informed case validation."
  supports: PARTIAL
  evidence_source: HUMAN_CLINICAL
  snippet: "The mental health comorbidity profile was largely comparable to that of atopic dermatitis, whereas more pronounced differences were observed in comparisons with psoriasis."
  explanation: >-
    A dermatologic comparator analysis confirms mental-health burden but
    weakens the specificity of a vitiligo-specific biological explanation.


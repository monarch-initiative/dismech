name: com_Major_Depressive_Disorder__Vitiligo
creation_date: '2026-07-26T08:22:20Z'
curation_status: CANDIDATE
notes: >-
  A large UK primary-care cohort supports a temporal association in both
  directions, but it does not establish a shared mechanism. The mechanistic
  evidence is substantially weaker than the epidemiology: the cross-disease
  transcriptomic study compared separate MDD and vitiligo expression datasets,
  used a small vitiligo discovery set, and nominated MAPK14 under permissive
  hypothesis-generating thresholds. A bidirectional Mendelian-randomization
  study found no significant directional causal effect between generalized
  vitiligo and broad mental-disorder phenotypes, including depression; that
  design does not adjudicate shared pleiotropic genetic liability. Psychosocial
  burden, healthcare surveillance, treatment, nonspecific inflammatory burden,
  shared pleiotropy, and an acquired cell-state-specific pathway therefore
  remain competing explanations.


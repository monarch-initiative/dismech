hypotheses:
- description: >-
    Acquired, cell-context-specific p38-alpha/MAPK14 activation may be a shared
    mediator: stress-linked signaling in serotonergic neurons could contribute
    to depressive phenotypes, while oxidative or inflammatory p38 signaling in
    skin and immune compartments could contribute to melanocyte injury. This is
    a bridge hypothesis, not an established shared pathway; current studies do
    not demonstrate the same MAPK14-dependent state in comorbid humans.
  evidence:
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "These findings primarily serve to generate hypotheses regarding shared mechanisms and prioritize targets for subsequent experimental validation."
    explanation: >-
      The cross-disease transcriptomic reanalysis nominates MAPK14 but explicitly
      frames the result as hypothesis-generating.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "For MDD, the GSE98793 dataset was utilized, which includes 192 whole blood samples: 64 from healthy controls, 128 from patients with MDD, using the GPL570 platform for sequencing. For vitiligo, the GSE65127 and GSE53146 datasets were integrated using the R package ‘sva’ to correct batch effects. The combined datasets included 15 healthy samples and 15 vitiligo samples, using the GPL570 and GPL14951 platforms for sequencing."
    explanation: >-
      The analysis combined separate disease datasets and had only 15 vitiligo
      and 15 healthy samples, rather than paired samples from a comorbid cohort.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Differentially expressed genes (DEGs) between disease and control groups were identified using the R package ‘limma’, applying a threshold of |log2FC| > 0 and P-value < 0.05."
    explanation: >-
      The permissive nonzero fold-change and nominal P-value screen limits the
      specificity of the candidate-gene intersection.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "It should be noted that these ssGSEA scores represent inferred immune signatures from bulk RNA-seq data, rather than direct measurements of actual immune cell abundances."
    explanation: >-
      The immune-cell results are computational enrichment scores rather than
      measured cell abundances.
  - reference: PMID:21835346
    reference_title: "Selective p38α MAPK deletion in serotonergic neurons produces stress resilience in models of depression and addiction."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Social defeat stress produced social avoidance (a model of depression-like behaviors) and reinstatement of cocaine preference (a measure of addiction risk) in wild-type mice, but not in mice having p38α MAPK selectively deleted in serotonin-producing neurons of the dorsal raphe nucleus."
    explanation: >-
      Cell-specific mouse genetics supports p38-alpha involvement in a
      stress-related behavioral model, but it is not human MDD evidence and
      does not connect to vitiligo.
  - reference: PMID:18575770
    reference_title: "Minocycline protects melanocytes against H2O2-induced cell death via JNK and p38 MAPK pathways."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Also, H2O2 treatment activates JNK and p38 MAPK, and executive caspase 3 in B10BR cells."
    explanation: >-
      Oxidative stress activates p38-family signaling in cultured mouse
      melanocytes, but the study is neither MAPK14-specific nor evidence of a
      shared human mechanism.

- description: >-
    A directional causal effect of liability to one disease on the other could
    produce the bidirectional temporal association. Current bidirectional
    Mendelian-randomization evidence found no detectable directional causal
    effect between generalized vitiligo and the study's broad depression
    phenotype, although it cannot exclude weak or subtype-specific effects.
  evidence:
  - reference: DOI:10.1111/exd.14979
    reference_title: "Exploring genetic associations between vitiligo and mental disorders using Mendelian randomization"
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "In our findings, none of the rigorous bidirectional MR analyses uncovered a significant causal association."
    explanation: >-
      The null bidirectional MR result constrains genetically instrumented
      disease-to-disease effects between generalized vitiligo and the broad
      depression phenotype used in that analysis, rather than specifically
      adjudicating clinically defined MDD subgroups.

- description: >-
    Shared pleiotropic genetic liability could independently increase
    susceptibility to both MDD and vitiligo without either disease causing the
    other. Bidirectional Mendelian randomization does not test this common-cause
    model; cross-trait global and local genetic correlation followed by
    locus-level colocalization would be needed to distinguish shared variants
    from directional causality and linkage.

- description: >-
    Psychosocial effects of visible skin disease, healthcare-contact
    surveillance, treatment, and nonspecific chronic inflammatory burden may
    explain some or all of the association without a vitiligo-specific immune
    bridge to MDD.
  evidence:
  - reference: PMID:41781039
    reference_title: "Prevalence and comparative risk of mental health disorders in persons with vitiligo: a retrospective matched cohort study using claims data with expert-informed case validation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In matched comparisons with atopic dermatitis, only a few and inconsistent differences were observed."
    explanation: >-
      Similar mental-health profiles in another visible inflammatory skin
      disease favor nonspecific or psychosocial alternatives that must be tested
      against the shared-immune hypothesis.

name: com_Major_Depressive_Disorder__Vitiligo
creation_date: '2026-07-26T08:22:20Z'
curation_status: CANDIDATE
notes: >-
  A large UK primary-care cohort supports a temporal association in both
  directions, but it does not establish a shared mechanism. The mechanistic
  evidence is substantially weaker than the epidemiology: the cross-disease
  transcriptomic study compared separate MDD and vitiligo expression datasets,
  used a small vitiligo discovery set, and nominated MAPK14 under permissive
  hypothesis-generating thresholds. The authors did check the candidates in
  independent disease-specific GEO datasets, but that discriminatory validation
  did not test a shared cell state or mediator. Patient-derived nonsegmental
  vitiligo keratinocytes show pan-p38 activation, whereas the isoform-specific
  MDD-arm evidence is a mouse serotonergic-neuron model. A confirmatory human
  MDD study found no advantage for the tested losmapimod regimen after a smaller
  prematurely terminated study had favored treatment.
  These compartment-, species-, and assay-specific findings constrain but do
  not refute an acquired bridge. A bidirectional Mendelian-randomization study
  found no significant directional causal effect between generalized vitiligo
  and broad mental-disorder phenotypes, including depression; that design does
  not adjudicate shared pleiotropic genetic liability. Psychosocial burden,
  healthcare surveillance, treatment, nonspecific inflammatory burden, shared
  pleiotropy, parallel tissue-specific p38 use, and an acquired
  cell-state-specific pathway therefore remain competing explanations.


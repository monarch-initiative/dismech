hypotheses:
- description: >-
    Hypothesis: episodic mast cell degranulation releases vasoactive mediators
    such as histamine and prostaglandins that dilate blood vessels, so blood
    pools on standing, venous return falls and the heart speeds up to
    compensate. Mast cell activation would then be one of several routes to
    the POTS phenotype rather than its general cause. This is a proposed
    mechanism listed in reviews; it has not been shown in a cohort with
    consensus-defined MCAS.
  evidence:
  - reference: PMID:26198889
    reference_title: "Postural Tachycardia Syndrome: Beyond Orthostatic Intolerance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "POTS is a \"final common pathway\" for a number of overlapping pathophysiologies, including an autonomic neuropathy in the lower body, hypovolemia, elevated sympathetic tone, mast cell activation, deconditioning, and autoantibodies."
    explanation: >-
      A review that lists mast cell activation as one of several overlapping
      mechanisms that can lead to POTS.
  - reference: PMID:39165715
    reference_title: Evaluation of the relationship between mast cell activation and postural orthostatic tachycardia syndrome in children and adolescents.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Basal serum tryptase levels were not different between groups (3.2±1.3 ng/ml and 3.84±1.78 ng/ml, respectively; p=0.129)"
    explanation: >-
      In 58 children with syncope or presyncope, basal tryptase did not
      differ between the 28 with POTS and the 30 with vasovagal syncope. This
      does not support a general mast cell contribution to POTS, though
      tryptase is an imperfect marker of activation and the same study found
      higher tryptase in patients with mast cell activation symptoms.
  pathophysiology:
  - name: Mast cell mediator-driven vasodilation and venous pooling
    description: >-
      Proposed mechanism: mast cell degranulation releases vasodilatory
      mediators, causing orthostatic venous pooling and compensatory
      tachycardia in a subset of patients.
    biological_processes:
    - preferred_term: mast cell degranulation
      term:
        id: GO:0043303
        label: mast cell degranulation
      modifier: INCREASED


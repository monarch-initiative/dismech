name: com_Mast_Cell_Activation_Syndrome__Postural_Orthostatic_Tachycardia_Syndrome
creation_date: '2026-11-02T16:15:36Z'
curation_status: CANDIDATE
notes: >-
  Mast cell activation syndrome (MCAS) and postural orthostatic tachycardia
  syndrome (POTS) are often reported together, and mast cell activation is
  listed among the overlapping mechanisms that can produce POTS. How common
  MCAS is in POTS depends almost entirely on how MCAS is defined. In one
  record review of 100 young POTS patients, MCAS frequency was 2% under
  consensus-1 criteria, 37% under conservative consensus-2 criteria, and 87%
  under clinical criteria without laboratory support. A 2026 meta-analysis
  found that about a third of POTS patients reported MCAS (36.3%, wide
  confidence interval, high heterogeneity), but those are reported diagnoses,
  not verified ones. A 2025 systematic review found no study at all that
  diagnosed a mast cell activation disorder alongside POTS or EDS using
  prespecified criteria. Biomarker data are also negative so far: basal serum
  tryptase did not differ between children with POTS and those with
  vasovagal syncope, and the maximum possible rate of hereditary
  alpha-tryptasemia in a 250-patient POTS cohort was not higher than in the
  general population (PMID:37918652; hereditary alpha-tryptasemia is a
  tryptase gene trait, not MCAS, so it is noted here rather than recorded as
  a signal). The pair is therefore a widely reported clinical association
  whose prevalence and mechanism are not established under consensus MCAS
  criteria. Directionality is UNKNOWN. No ICEES KG signal is possible,
  because neither MCAS nor POTS is a node in the ICEES KG 8-20-2024
  snapshot.


      reference_title: "Association of postural orthostatic tachycardia syndrome, hypermobility spectrum disorders, and mast cell activation syndrome in young patients; prevalence, overlap and response to therapy depends on the definition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The frequency of MCAS ranged from 2% using consensus-1 criteria, to 37% using conservative consensus-2 criteria, to 87% using clinical criteria."
      explanation: >-
        Shows that the reported MCAS prevalence in POTS ranges from rare to
        nearly universal depending on the diagnostic criteria used.


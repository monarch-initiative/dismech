name: com_Myalgic_Encephalomyelitis_Chronic_Fatigue_Syndrome__Postural_Orthostatic_Tachycardia_Syndrome
creation_date: '2026-11-02T13:25:53Z'
curation_status: CANDIDATE
notes: >-
  Postural orthostatic tachycardia syndrome (POTS) is frequently found in
  people with myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS), and
  orthostatic intolerance is a core feature in several ME/CFS case
  definitions. Reported POTS prevalence in ME/CFS cohorts varies widely with
  the setting and the test used: 27% with a 2-minute active stand against 9%
  in matched controls (UK), 11% with a 20-minute standing test (Australia),
  25% (155/627) with a 10-minute head-up tilt (Netherlands), and 19% in an
  autonomic-laboratory cohort (US). Short tests miss cases, because a
  2-minute tilt misses about half of those who meet heart-rate criteria within
  10 minutes. Against this, a large Dutch cohort found POTS in only 5.7% of
  adults with CFS and in a similar 6.9% of fatigued patients who did not meet
  CFS criteria, so POTS does not appear specific to ME/CFS once the
  comparison group is other fatigued patients rather than healthy controls.
  Both conditions often follow an infection, and both show reduced cerebral
  blood flow on tilt, preload failure and small-fiber neuropathy in autonomic
  laboratory series, so a shared orthostatic-circulatory mechanism is
  plausible but unproven. Directionality is UNKNOWN. No ICEES KG signal is
  possible for this pair, because POTS (MONDO:0011479) is not a node in the
  ICEES KG 8-20-2024 snapshot (recorded when the hEDS-POTS comorbidity entry
  was curated).


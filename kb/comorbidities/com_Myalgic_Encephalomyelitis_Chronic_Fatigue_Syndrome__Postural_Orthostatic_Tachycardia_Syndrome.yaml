hypotheses:
- description: >-
    Hypothesis: ME/CFS and POTS share an orthostatic-circulatory mechanism.
    On standing, inadequate venous return (preload failure), often alongside
    small-fiber autonomic neuropathy, lowers cardiac output and cerebral blood
    flow, and the heart rate rises to compensate. In some patients the
    tachycardia reaches POTS criteria, and in others the cerebral
    hypoperfusion occurs without it. This would explain why POTS is common but
    not universal in ME/CFS. Autonomic-laboratory series show these
    abnormalities in both conditions, but they do not show that one condition
    causes the other, or that the shared findings have a single cause.
  evidence:
  - reference: PMID:41576003
    reference_title: Shared autonomic phenotype of long COVID and myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduced orthostatic CBFv (92%/88% in Long COVID/ME/CFS), mild-to-moderate widespread autonomic failure (95%/89%), presence of SFN (67%/53%), postural tachycardia syndrome (POTS) (22%/19%), neurogenic orthostatic hypotension (15%/15%) and preload failure (96%/92%, assessed in 25/66 Long COVID/ME/CFS)"
    explanation: >-
      In 170 ME/CFS patients tested in an autonomic laboratory, reduced
      orthostatic cerebral blood flow, preload failure and small-fiber
      neuropathy were far more common than POTS itself (19%). This fits a
      shared circulatory mechanism in which POTS is one possible expression.
  - reference: PMID:24601948
    reference_title: "Malfunctioning of the autonomic nervous system in patients with chronic fatigue syndrome: a systematic literature review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The heart rate dynamic response during the head-up tilt test differs between patients with CFS and healthy controls, supporting the increased prevalence of postural orthostatic tachycardia syndrome."
    explanation: >-
      A systematic review of 27 case-control studies concludes that heart-rate
      responses to tilt differ in CFS, which is consistent with a higher POTS
      prevalence in this population.
  pathophysiology:
  - name: Orthostatic preload failure and cerebral hypoperfusion
    description: >-
      Proposed shared mechanism: reduced venous return on standing lowers
      cardiac preload and cerebral blood flow, and a compensatory rise in heart
      rate reaches POTS criteria in a subset of patients.


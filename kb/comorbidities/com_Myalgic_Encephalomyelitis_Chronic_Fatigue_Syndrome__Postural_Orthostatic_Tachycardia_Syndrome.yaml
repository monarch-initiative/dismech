- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0005404
  signal_disorder_b_id: MONDO:0011479
  population: >-
    59 patients with CFS/ME (Fukuda criteria) and 52 age- and sex-matched
    controls with formal autonomic assessment, including a 2-minute active
    stand, at a UK cardiovascular laboratory.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 27.0
      p_value: 0.006
      notes: POTS in 16/59 CFS/ME patients, against 9% (5/52) in controls.
    evidence:
    - reference: PMID:18805903
      reference_title: Postural orthostatic tachycardia syndrome is an under-recognized condition in chronic fatigue syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the CFS/ME group, 27% (16/59) had POTS compared with 9% (5) in the control population (P = 0.006)."
      explanation: >-
        Case-control comparison showing POTS three times as common in CFS/ME
        as in matched healthy controls.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0005404
  signal_disorder_b_id: MONDO:0011479
  population: >-
    306 consecutive patients at an Australian CFS clinic (2009-2012), each
    completing a 20-minute standing test at initial assessment.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 11.0
      notes: POTS in 33/306 CFS patients; no control group.
    evidence:
    - reference: PMID:24206536
      reference_title: Comorbidity of postural orthostatic tachycardia syndrome and chronic fatigue syndrome in an Australian cohort.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Comorbidity of CFS and POTS (CFS-POTS) was observed in 11% (33/306) of patients."
      explanation: >-
        Clinic cohort prevalence of POTS among CFS patients. The CFS-POTS
        patients were younger and had a shorter illness than CFS-only patients.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0005404
  signal_disorder_b_id: MONDO:0011479
  population: >-
    627 consecutive adults meeting ME/CFS study criteria evaluated with a
    10-minute 70-degree head-up tilt at a Dutch cardiology clinic
    (2012-2018), excluding those on medication for orthostatic intolerance.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 24.7
      notes: >-
        155/627 met POTS heart-rate criteria within 10 minutes upright; the
        percentage is computed from the counts the source reports.
    evidence:
    - reference: PMID:30505831
      reference_title: Low Sensitivity of Abbreviated Tilt Table Testing for Diagnosing Postural Tachycardia Syndrome in Adults With ME/CFS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 627 individuals with ME/CFS evaluated during the study period, 155 met criteria for POTS."
      explanation: >-
        The largest tilt-tested ME/CFS series, which also shows that a
        2-minute test would miss 55% of these cases.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0005404
  signal_disorder_b_id: MONDO:0011479
  population: >-
    863 consecutive patients with persistent fatigue screened at a Dutch
    university centre (2013-2014) with an active standing test: 419 meeting
    CFS criteria and 341 fatigued patients who did not.
  mapping_notes: >-
    Recorded as REFUTE because the comparison group is other fatigued
    patients, not healthy controls, and POTS was no more common in CFS. This
    argues against POTS being specific to ME/CFS. It does not argue against
    POTS being more common in ME/CFS than in the general population, which
    this study did not test.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 5.7
      p_value: 0.54
      notes: >-
        POTS in adults with CFS, against 6.9% in non-CFS fatigued adults
        (adolescents 18.2% against 17.4%, P = 0.93).
    evidence:
    - reference: PMID:27696568
      reference_title: Postural orthostatic tachycardia is not a useful diagnostic marker for chronic fatigue syndrome.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "POTS prevalence in adult patients with CFS was 5.7% vs. 6.9% in non-CFS adults (P = 0.54)."
      explanation: >-
        In this large cohort, POTS was uncommon in adults with CFS and no more
        frequent than in other fatigued patients.


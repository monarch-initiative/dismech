hypotheses:
- description: >-
    Hypothesis: in a subgroup of ME/CFS, mast cell activation adds
    mediator-driven symptoms and worsens orthostatic intolerance, and these
    patients may respond to mast cell-directed treatment. The supporting data
    come from one observational cohort and small laboratory studies. Whether
    mast cell activation is a cause, a consequence or a marker of a distinct
    ME/CFS subgroup is unknown.
  evidence:
  - reference: PMID:41300853
    reference_title: The Clinical Relevance of Mast Cell Activation in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ME/CFS patients with Mast Cell Activation Syndrome (MCAS) and OI reported symptom alleviation significantly more often following mast cell-targeted treatment than those without MCAS (p < 0.0001)."
    explanation: >-
      Self-reported treatment response in an observational cohort, consistent
      with mast cell activation contributing to symptoms in this subgroup. It
      was not a controlled trial.
  - reference: PMID:27362406
    reference_title: Novel characterisation of mast cell phenotypes from peripheral blood mononuclear cells in chronic fatigue syndrome/myalgic encephalomyelitis patients.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a significant increase in CD117⁺CD34⁺FCεRI-chymase- mast cell populations in moderate and severe CFS/ME patients compared with healthy controls."
    explanation: >-
      A small study (18 patients, 13 controls) finding more mast cell
      progenitors in patient blood. This shows altered mast cell biology in
      ME/CFS but not mast cell activation or MCAS.
  pathophysiology:
  - name: Mast cell activation contributing to ME/CFS symptoms
    description: >-
      Proposed mechanism: mast cell mediator release adds to symptom burden
      and orthostatic intolerance in a subgroup of ME/CFS patients.
    biological_processes:
    - preferred_term: mast cell degranulation
      term:
        id: GO:0043303
        label: mast cell degranulation
      modifier: INCREASED


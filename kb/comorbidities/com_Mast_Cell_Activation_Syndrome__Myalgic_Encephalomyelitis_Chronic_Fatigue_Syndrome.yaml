name: com_Mast_Cell_Activation_Syndrome__Myalgic_Encephalomyelitis_Chronic_Fatigue_Syndrome
creation_date: '2026-11-02T16:15:36Z'
curation_status: CURATED
notes: >-
  Evidence linking mast cell activation syndrome (MCAS) with myalgic
  encephalomyelitis/chronic fatigue syndrome (ME/CFS) is thin. The main study
  is an Austrian ME/CFS cohort (687 survey responses and a retrospective
  review of 383 patients). In that cohort, up to 25.3% of followed-up patients
  met the authors' criteria for clinically relevant mast cell activation,
  this proportion rose over the disease course, and orthostatic intolerance,
  particularly POTS, was more common in patients with mast cell activation.
  The authors' criteria for clinically relevant mast cell activation are not
  stated in the abstract and may be broader than consensus MCAS criteria.
  Small laboratory studies report altered mast cell progenitor phenotypes in
  peripheral blood of ME/CFS patients, and a five-patient case series reports
  benefit from high-dose oral cromolyn in ME/CFS with MCAS (PMID:41728426).
  No controlled prevalence study using consensus MCAS criteria in ME/CFS was
  found. The overlap may run through POTS, which is common in both
  conditions (see the ME/CFS-POTS and MCAS-POTS comorbidity entries).
  Directionality is UNKNOWN. No ICEES KG signal is possible, because neither
  MCAS nor ME/CFS is a node in the ICEES KG 8-20-2024 snapshot.


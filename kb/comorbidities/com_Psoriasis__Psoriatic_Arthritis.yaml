name: com_Psoriasis__Psoriatic_Arthritis
creation_date: "2026-08-27T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Cutaneous psoriasis and psoriatic arthritis are the paradigm case of a
  directed comorbidity within one disease family: in the large majority of
  patients the skin disease is established first and the musculoskeletal
  disease appears years later, which is what makes psoriasis clinics a
  practical screening population for incident PsA.

  The entry is deliberately curated as a comorbidity rather than folded into
  either disease entry, because the transition is not simply "psoriasis plus
  arthritis". MHC mapping that controls for age at psoriasis onset shows the
  classic psoriasis allele HLA-C*06:02 is *protective* against PsA relative to
  skin-only disease, while amino acid position 97 of HLA-B — the largest
  genetic effect in ankylosing spondylitis — is what distinguishes PsA. So the
  two conditions share an IL-23/IL-17 axis but not a single genetic
  architecture, and PsA sits partly with the spondyloarthritides.

  Not curated here: whether treating psoriasis prevents PsA. The observational
  signal for IL-23 blockade is suggestive but interception trials are ongoing,
  and asserting a preventive effect would go beyond what the cited sources
  claim.


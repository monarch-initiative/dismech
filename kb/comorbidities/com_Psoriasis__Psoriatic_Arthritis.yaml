hypotheses:
- description: >-
    A shared IL-23/IL-17 cytokine axis operating in two different tissue
    compartments: the same pathway that sustains epidermal inflammation in
    psoriatic skin also drives inflammation at the enthesis and adjacent
    synovium, so the skin and joint diseases are two tissue expressions of one
    systemic immune program rather than independent conditions that happen to
    co-occur.
  evidence:
  - reference: PMID:42540001
    reference_title: Does effective therapy of psoriasis prevent the development of psoriatic arthritis?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Converging immunopathogenic insights link skin and joint inflammation through interleukin (IL)-23/IL-17-driven pathways, enthesis-synovium crosstalk, and tissue-resident memory T-cell biology."
    explanation: >-
      States the shared IL-23/IL-17 mechanism and the enthesis-synovium
      compartment linking skin disease to joint disease.
  - reference: PMID:42540001
    reference_title: Does effective therapy of psoriasis prevent the development of psoriatic arthritis?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psoriasis frequently precedes psoriatic arthritis (PsA), delineating a tractable window for disease interception."
    explanation: >-
      Establishes the temporal ordering that this entry records as A_BEFORE_B.
  pathophysiology:
  - name: IL-23/IL-17 axis activation at the enthesis
    description: >-
      IL-23-driven, IL-17-producing cells act at the enthesis and adjacent
      synovium, extending the cytokine program of psoriatic skin into
      musculoskeletal tissue.
    biological_processes:
    - preferred_term: interleukin-23-mediated signaling
      term:
        id: GO:0038155
        label: interleukin-23-mediated signaling pathway
      modifier: INCREASED
    - preferred_term: interleukin-17-mediated signaling
      term:
        id: GO:0097400
        label: interleukin-17-mediated signaling pathway
      modifier: INCREASED
    evidence:
    - reference: PMID:42540001
      reference_title: Does effective therapy of psoriasis prevent the development of psoriatic arthritis?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Converging immunopathogenic insights link skin and joint inflammation through interleukin (IL)-23/IL-17-driven pathways, enthesis-synovium crosstalk, and tissue-resident memory T-cell biology."
      explanation: >-
        Names the IL-23 and IL-17 pathways as the shared mechanism operating at
        the enthesis-synovium interface.

- description: >-
    Mechanical stress at entheseal insertion sites acts as the local trigger
    that converts a systemic psoriatic predisposition into overt joint disease
    — the "deep Koebner" phenomenon, an internal counterpart of the cutaneous
    Koebner response to skin trauma. This offers an explanation for why only a
    minority of psoriasis patients progress, and why progression is entheseal
    and asymmetric rather than symmetrically polyarticular.
  evidence:
  - reference: PMID:21715249
    reference_title: "Psoriatic arthritis: from a dermatological perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The triggering role of physical stress is seen in the \"deep Koebner\" phenomenon, which causes inflammation in the synovial membrane and in enthesis, resulting in peripheral arthritis."
    explanation: >-
      States the deep Koebner mechanism: physical stress at the enthesis and
      synovium producing peripheral arthritis in psoriatic disease.

- description: >-
    The two conditions are not genetically interchangeable. Once age at
    psoriasis onset is controlled for, the canonical psoriasis risk allele
    HLA-C*06:02 is associated with skin-only disease and is protective against
    PsA, while the discriminating signal is amino acid position 97 of HLA-B —
    the same position carrying the largest genetic effect in ankylosing
    spondylitis. PsA is therefore better read as a spondyloarthritis arising on
    a psoriatic background than as a later stage of psoriasis, and the
    comorbidity is partly a shared-susceptibility relationship rather than a
    pure progression.
  evidence:
  - reference: PMID:28821532
    reference_title: Cross-phenotype association mapping of the MHC identifies genetic variants that differentiate psoriatic arthritis from psoriasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA-C*06:02 was protective of PsA compared to PsC (p=9.57×10-66, OR 0.37)."
    explanation: >-
      Shows the principal psoriasis susceptibility allele runs in the opposite
      direction for PsA relative to cutaneous-only psoriasis.
  - reference: PMID:28821532
    reference_title: Cross-phenotype association mapping of the MHC identifies genetic variants that differentiate psoriatic arthritis from psoriasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "amino acid position 97 of HLA-B differentiates PsA from PsC. This amino acid also represents the largest genetic effect for ankylosing spondylitis, thereby refining the genetic overlap of these two spondyloarthropathies."
    explanation: >-
      Identifies the MHC signal specific to joint involvement and ties it to
      the spondyloarthritis susceptibility architecture.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Prospective cohort of 464 psoriasis patients without arthritis at
    enrollment (University of Toronto psoriasis cohort), followed 8 years, with
    PsA ascertained by CASPAR criteria.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: INCIDENCE_RATE
      metric_value: 2.7
      metric_ci_lower: 2.1
      metric_ci_upper: 3.6
      notes: >-
        Incident PsA per 100 psoriasis patients per year. The denominator is a
        psoriasis population followed forward with arthritis excluded at
        baseline, which is what a directed A_BEFORE_B risk signal requires;
        cross-sectional PsA-prevalence-among-psoriasis figures do not establish
        ordering.
    evidence:
    - reference: PMID:26555117
      reference_title: "The Incidence and Risk Factors for Psoriatic Arthritis in Patients With Psoriasis: A Prospective Cohort Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The annual incidence rate of PsA was 2.7 cases (95% confidence interval 2.1-3.6) per 100 psoriasis patients."
      explanation: >-
        Measures incident PsA prospectively in a psoriasis cohort free of
        arthritis at baseline, quantifying the directed risk.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Psoriasis patients with arthralgia but without established PsA — the
    clinically defined at-risk stratum used in interception research.
  directionality: A_BEFORE_B
  effect_direction: RISK
  mapping_notes: >-
    A narrative-review summary figure for an enriched at-risk subgroup, not a
    population rate; it is not comparable with the whole-cohort incidence
    above and is recorded to show how strongly arthralgia concentrates risk.
  statistics:
    metrics:
    - metric_type: OTHER
      metric_value: 20.0
      notes: >-
        Approximate percentage of psoriasis patients with arthralgia who
        progress to PsA within 3 years.
    evidence:
    - reference: PMID:42540001
      reference_title: Does effective therapy of psoriasis prevent the development of psoriatic arthritis?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "progression from psoriasis with arthralgia to PsA occurs in ∼20% of patients within 3 years, typically manifesting with peripheral, synovitis-predominant presentations."
      explanation: >-
        Quantifies short-term progression in the arthralgia-enriched at-risk
        subgroup and describes the phenotype of the transition.

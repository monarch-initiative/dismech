hypotheses:
- description: >-
    Hypothesis: connective-tissue laxity affecting the lower esophageal
    sphincter and diaphragmatic crura, combined with generalized smooth
    muscle/visceral dysmotility and autonomic dysfunction documented across
    the hEDS GI tract, reduces the mechanical and neuromuscular barrier to
    reflux.
  evidence:
  - reference: PMID:41432355
    reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among GI disorders, gastroesophageal reflux disease was most common in EDS (18.4%, OR 1.5, 95% CI 1.4-1.5, p < 0.001), followed by constipation (12.4%, OR 1.8, 95% CI 1.7-1.9, p < 0.001), irritable bowel syndrome (7.3%, OR 2.6, 95% CI 2.5-2.8, p < 0.001) and gastroparesis (4.7%, OR 8.2, 95% CI 7.3-9.2, p < 0.001)."
    explanation: >-
      Establishes GERD as the single most prevalent GI comorbidity in EDS
      within a broader pattern of GI dysmotility disorders, supporting a
      shared connective-tissue/dysmotility mechanism.
  pathophysiology:
  - name: Esophagogastric junction laxity and visceral dysmotility
    description: >-
      Reduced structural integrity of the lower esophageal sphincter and
      diaphragmatic hiatus, together with generalized GI smooth-muscle
      dysmotility, is proposed to lower the barrier to gastroesophageal
      reflux in hEDS.
    biological_processes:
    - preferred_term: gastric acid secretion
      term:
        id: GO:0001696
        label: gastric acid secretion


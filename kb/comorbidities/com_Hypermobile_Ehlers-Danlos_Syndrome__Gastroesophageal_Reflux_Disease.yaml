name: com_Hypermobile_Ehlers-Danlos_Syndrome__Gastroesophageal_Reflux_Disease
creation_date: '2026-09-18T02:57:53Z'
curation_status: CANDIDATE
notes: >-
  Gastroesophageal reflux disease (GERD) was the single most common
  gastrointestinal comorbidity in a large propensity-matched TriNetX cohort
  of EDS patients (18.4% prevalence, OR 1.5 versus matched controls),
  consistent with the well-documented broader pattern of GI dysmotility in
  hEDS (alongside constipation, IBS, and gastroparesis in the same cohort).
  Directionality is UNKNOWN. No ICEES KG signal exists for this pair: hEDS
  (MONDO:0007523) is not a node in the ICEES KG snapshot at all (confirmed
  while curating the hEDS-POTS comorbidity entry).


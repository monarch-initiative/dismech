      reference_title: "Do people with ME/CFS and joint hypermobility represent a disease subgroup? An analysis using registry data."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "JH+ participants were more likely to be female, report Ehlers-Danlos Syndrome (EDS), Postural Orthostatic Tachycardia Syndrome (POTS), and a family history of EDS."
      explanation: >-
        Within ME/CFS, hypermobile participants more often reported EDS and
        POTS, suggesting a hypermobile, dysautonomic subgroup.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005404
  population: >-
    55 young people meeting Fukuda criteria for ME/CFS in a US observational
    cohort, compared by Beighton score of 4 or more.
  mapping_notes: >-
    Recorded as REFUTE for the claim that hypermobile ME/CFS is a distinct

name: com_Hypermobile_Ehlers-Danlos_Syndrome__Myalgic_Encephalomyelitis_Chronic_Fatigue_Syndrome
creation_date: '2026-11-02T13:25:53Z'
curation_status: CURATED
notes: >-
  A clinical overlap between hypermobile Ehlers-Danlos syndrome (hEDS) and
  myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) is widely
  described, and chronic fatigue is a major feature of hEDS. Most of the
  quantitative evidence, however, measures generalized joint hypermobility by
  Beighton score, not clinically diagnosed hEDS. Beighton-defined
  hypermobility is common in the general population and is a much broader
  phenotype than hEDS, and in a chronic-fatigue clinic the Beighton score
  agreed poorly with clinical assessment of joint laxity (kappa about 0.4;
  PMID:34957987).
  With that caveat, two case-control studies found joint hypermobility more
  often in CFS than in controls (20.6% against 4.3% in adults; 60% against 24%
  in children, OR 3.5), and a meta-analysis of functional somatic syndromes
  including CFS found an overall OR of 3.27 while rating most studies fair to
  poor. A Dutch adolescent study found no difference in Beighton score or
  collagen biochemistry between CFS and controls, though CFS patients had
  more extensible skin. In a registry of 815 people with ME/CFS, the 15.5%
  who were hypermobile were more likely to report EDS and POTS and had worse
  quality of life. A US pediatric cohort, by contrast, found no difference in
  ME/CFS presentation by hypermobility status. The only direct hEDS-ME/CFS
  data are a case series of 12 adolescents with CFS and EDS (6 hypermobile
  type), all with orthostatic intolerance. Directionality is UNKNOWN. No
  ICEES KG signal is possible, because hEDS (MONDO:0007523) is not a node in
  the ICEES KG 8-20-2024 snapshot.


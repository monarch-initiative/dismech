    does not address whether hypermobility is more common in ME/CFS.
  directionality: UNKNOWN
  evidence:
  - reference: PMID:34537220
    reference_title: The Presentation of Myalgic Encephalomyelitis/Chronic Fatigue Syndrome Is Not Influenced by the Presence or Absence of Joint Hypermobility.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant difference between the groups in measures of health-related quality of life using a Beighton score cutoff of 4 or a cutoff of 5 to define joint hypermobility."
    explanation: >-
      In this pediatric cohort, hypermobile and non-hypermobile ME/CFS
      patients did not differ in onset, symptoms, comorbidities or quality of
      life.


literature_evidence:
- reference: PMID:26920676
  reference_title: Association of inclusion body myositis with T cell large granular
    lymphocytic leukaemia.
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    Most (22/38; 58%) patients with inclusion body myositis had aberrant
    populations of large granular lymphocytes in their blood meeting standard
    diagnostic criteria for T cell large granular lymphocytic leukaemia. These T
    cell populations were clonal in 20/20 patients and stably present on
    follow-up testing in 15 patients a median of 350 days later.
  explanation: >-
    The primary quantitative basis for the association: a majority of IBM
    patients meet formal T-LGL leukaemia criteria, and the populations are
    clonal and persistent rather than transient reactive expansions.
- reference: PMID:26920676
  reference_title: Association of inclusion body myositis with T cell large granular
    lymphocytic leukaemia.
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    In comparison, 2/15 (14%) age-matched patients with dermatomyositis,
    polymyositis, or necrotizing myopathy, and 0/20 (0%) age-matched healthy
    subjects had large granular lymphocyte expansions
  explanation: >-
    Establishes specificity: the expansion is not a generic feature of
    inflammatory myopathy or of age-matched health, which is what makes the
    association informative rather than incidental.
- reference: PMID:26920676
  reference_title: Association of inclusion body myositis with T cell large granular
    lymphocytic leukaemia.
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    Muscle immunohistochemistry demonstrated invasion of large granular
    lymphocytes into muscle in 15/15 inclusion body myositis patients but in
    only 1/28 patients with dermatomyositis or polymyositis.
  explanation: >-
    Links the circulating leukaemic clone to the muscle lesion itself,
    supporting the reading that this is one cellular process presenting in two
    compartments rather than two independent diseases.
- reference: PMID:26920676
  reference_title: Association of inclusion body myositis with T cell large granular
    lymphocytic leukaemia.
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: >-
    Cross-sectional data suggested more aggressive disease in patients with such
    expansions than without.
  explanation: >-
    Suggests the LGL expansion may mark a more aggressive IBM phenotype, but the
    design is cross-sectional so this is recorded as PARTIAL and no causal or
    prognostic claim is made.
hypotheses:
- description: >-
    Shared clonal cytotoxic T-cell process rather than two independent diseases.
    The leading interpretation is that the LGL population and the
    myofibre-invading cytotoxic T cells are the same clonal, highly
    differentiated, apoptosis-resistant CD8+ effector population, detected in
    blood by flow cytometry and in muscle by immunohistochemistry. On this view
    the "comorbidity" is an artefact of diagnostic boundaries: the clone
    satisfies haematological criteria for T-LGL leukaemia while also producing
    the myositis. The correlation between muscle CD8+/CD57+ infiltration and
    blood LGL burden, and the CD57 positivity of the myofibre-invading cells,
    both support this.
  evidence:
  - reference: PMID:26920676
    reference_title: Association of inclusion body myositis with T cell large granular
      lymphocytic leukaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The extent of CD8+ and CD57+ cells in inclusion body myositis muscle
      correlated with the size of blood large granular lymphocyte populations.
    explanation: >-
      A quantitative link between the blood and muscle compartments, which is
      what distinguishes the shared-clone reading from mere co-occurrence.
  - reference: PMID:31326977
    reference_title: Highly differentiated cytotoxic T cells in inclusion body myositis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diseased muscle-invading T cells are minimally or non-proliferative, in
      accordance with known properties of highly differentiated or terminally
      differentiated T cells
    explanation: >-
      Independently characterises the muscle-invading population as terminally
      differentiated and non-proliferative, consistent with a persistent clone
      and with the observed resistance to antiproliferative immunosuppression.

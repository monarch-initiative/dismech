name: com_Inclusion_Body_Myositis__T_Cell_Large_Granular_Lymphocytic_Leukemia
creation_date: '2026-07-31T00:00:00Z'
curation_status: CURATED
notes: >-
  The inclusion body myositis / T-cell large granular lymphocytic leukaemia
  (T-LGL) overlap is unusual among comorbidities in that it is probably not two
  diseases co-occurring but one clonal cytotoxic T-cell process meeting the
  diagnostic criteria of both. In a prospective screen of 38 IBM patients, 58%
  had blood large granular lymphocyte populations meeting standard diagnostic
  criteria for T-LGL leukaemia, and those populations were clonal in 20 of 20
  tested and stably present on repeat testing a median of 350 days later. The
  same cells invade muscle: LGL invasion was demonstrated in 15 of 15 IBM
  muscle biopsies versus 1 of 28 dermatomyositis or polymyositis biopsies, and
  the extent of CD8+ and CD57+ infiltration in muscle correlated with the size
  of the blood LGL population. This is the empirical basis for the
  `autoimmune_primary` mechanistic hypothesis in the Inclusion_Body_Myositis
  entry, and specifically for its claim that the effector clone is long-lived
  and apoptosis-resistant rather than a conventional activated T-cell response
  - which in turn is the leading explanation for why IBM resists conventional
  immunosuppression.

  Curation caveats. First, direction is left UNKNOWN: the cross-sectional design
  cannot establish whether the clonal expansion precedes the myositis or arises
  from chronic antigenic stimulation within it, and this is exactly the ordering
  question the disorder entry curates as an open CONTROVERSY. Second, the
  association should not be read as IBM causing a haematological malignancy in
  the ordinary sense - the LGL expansion in IBM is generally indolent, and
  recognising it matters clinically mainly to avoid inappropriate
  haematological workup or treatment. Third, the 58% figure comes from a single
  38-patient series at one centre and has not been replicated at scale; the
  broader deep-research literature also reports an approximately 3.9-fold
  increased rate of haematological malignancy in IBM, which is a different and
  much weaker claim than the 58% flow-cytometry overlap.

  Related associations surfaced by the deep research but NOT curated here for
  want of verified primary sources: Sjogren syndrome (~6.2x) and peripheral
  neuropathy (~2.7x). Those warrant their own comorbidity entries once the
  underlying cohort studies are fetched and their statistics quoted directly.

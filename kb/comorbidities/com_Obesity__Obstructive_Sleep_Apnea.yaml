name: com_Obesity__Obstructive_Sleep_Apnea
creation_date: "2026-08-19T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Obstructive_Sleep_Apnea.yaml`'s `environmental:`
  block (dismech#8551): that entry listed `Obesity` as an "exposure" acting on
  obstructive sleep apnea (OSA), but obesity is a first-class `Disease` entry
  in its own right (`kb/disorders/Obesity.yaml`), a body state rather than
  something external to the organism the patient is exposed to. Modeling the
  relationship as a disease-disease comorbidity avoids a near-tautological
  "exposure" edge that ECTO/XCO can never bind a term for. Directionality is
  A_BEFORE_B: weight gain is shown prospectively to precede and predict
  worsening sleep-disordered breathing, and weight loss predicts improvement,
  supporting obesity as a modifiable antecedent risk state for OSA. Evidence
  is carried over unchanged from the original `environmental:` entry rather
  than dropped. The reciprocal arm is deliberately not modeled: OSA also
  promotes weight gain through sleep fragmentation, daytime somnolence and
  leptin resistance, so the real relationship is bidirectional. A_BEFORE_B is
  recorded because the cited prospective cohort measures only the
  weight-to-SDB direction, and the weight-loss finding quoted below is that
  same direction inverted rather than the reverse arm. A B_BEFORE_A record
  would need its own source.

disease_a:
  slug: Obesity
  preferred_term: obesity disorder
  term:
    id: MONDO:0011122
    label: obesity disorder

disease_b:
  slug: Obstructive_Sleep_Apnea
  preferred_term: obstructive sleep apnea syndrome
  term:
    id: MONDO:0007147
    label: obstructive sleep apnea syndrome

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Increased adiposity, particularly upper-airway and visceral fat
    deposition, narrows the pharyngeal airway and increases its
    collapsibility during sleep; weight gain prospectively predicts
    worsening sleep-disordered breathing and weight loss predicts
    improvement, supporting obesity as a modifiable antecedent risk state
    for obstructive sleep apnea.
  evidence:
  - reference: PMID:11122588
    reference_title: "Longitudinal study of moderate weight change and sleep-disordered breathing"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 10% increase in weight predicted a 6-fold (95% CI, 2.2-17.0) increase in the odds of developing moderate-to-severe SDB"
    explanation: >-
      Wisconsin Sleep Cohort, measured prospectively at 4-year intervals. The
      reciprocal finding -- 10% weight loss predicting a 26% AHI reduction --
      is what makes this exposure modifiable rather than merely associated.
      Carried over unchanged from the original
      `Obstructive_Sleep_Apnea.yaml` `environmental:` entry.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Wisconsin Sleep Cohort: 690 randomly selected employed Wisconsin residents
    (mean age 46 at baseline, 56% male), evaluated twice at four-year intervals
    between July 1989 and January 2000.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 6.0
      metric_ci_lower: 2.2
      metric_ci_upper: 17.0
      notes: >-
        Odds of developing moderate-to-severe sleep-disordered breathing (apnea-
        hypopnea index at or above 15 events per hour) per 10% weight gain,
        relative to stable weight. The wide interval is the small cohort, not a
        weak signal. Measured prospectively, so the exposure precedes the
        outcome by design rather than by assumption.
    evidence:
    - reference: PMID:11122588
      reference_title: "Longitudinal study of moderate weight change and sleep-disordered breathing"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A 10% increase in weight predicted a 6-fold (95% CI, 2.2-17.0) increase in the odds of developing moderate-to-severe SDB"
      explanation: >-
        States the effect size recorded in the metric above, in a cohort
        followed forward from a disease-free baseline.

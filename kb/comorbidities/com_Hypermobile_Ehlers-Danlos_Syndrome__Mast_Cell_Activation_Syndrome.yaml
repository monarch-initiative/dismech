hypotheses:
- description: >-
    Popular clinical hypothesis (unconfirmed): connective-tissue laxity in
    hEDS places dermal and perivascular mast cells in mechanically altered
    tissue, and the same generalized autonomic/neuroimmune dysregulation
    implicated in hEDS-associated POTS and anxiety could lower the threshold
    for mast cell mediator release. A rigorous systematic review searching
    for studies that diagnosed both conditions under prespecified criteria
    found none meeting that bar, so this hypothesis remains a clinical
    narrative rather than an evidence-supported mechanism.
  evidence:
  - reference: PMID:40185471
    reference_title: "Prevalence of mast cell activation disorders and hereditary alpha tryptasemia among patients with postural orthostatic tachycardia syndrome and Ehlers-Danlos syndrome: A systematic review."
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "No studies were identified that met our primary criterion of including patients diagnosed with any MCAD or HAT alongside POTS and/or EDS based on our prespecified diagnostic criteria."
    explanation: >-
      A systematic review of four databases found no study diagnosing both
      conditions under prespecified criteria, directly refuting a
      literature-supported basis for this hypothesis at the level of formal
      diagnosis.
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postural orthostatic tachycardia syndrome (POTS), joint hypermobility or hypermobile Ehlers-Danlos syndrome (hEDS), long COVID, idiopathic environmental intolerance (multiple chemical sensitivity), irritable bowel syndrome or multiple food intolerance, bloating, fatigue, headache, brain fog, joint pain, non-episodic symptoms (e.g. chronic urticaria), symptoms isolated to one organ-system (e.g.: skin flushing)"
    explanation: >-
      Current ECNM-AIM-consensus-based clinical guidance explicitly lists
      hEDS among conditions and symptoms judged NOT suggestive of MCAS,
      cautioning against over-attribution.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0100004
  population: >-
    Systematic review of MEDLINE (OVID), EMBASE (OVID), Scopus, and Web of
    Science (200 records screened, 92 full texts reviewed) for studies
    diagnosing a mast cell activation disorder or hereditary
    alpha-tryptasemia alongside a formal POTS and/or EDS diagnosis.
  mapping_notes: >-
    This is the primary, highest-quality signal for this pair, and it is a
    null result under strict criteria, not merely an absence of searching.
    Recorded as REFUTE for a literature-confirmed comorbidity at the level
    of formal diagnosis; it does not rule out under-studied clinical
    co-occurrence, which the review's own conclusion calls for further
    research to clarify.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: OTHER
      notes: >-
        No quantitative prevalence/association metric was computable: zero
        of 92 reviewed full texts met the prespecified diagnostic-criteria
        bar for inclusion.
    evidence:
    - reference: PMID:40185471
      reference_title: "Prevalence of mast cell activation disorders and hereditary alpha tryptasemia among patients with postural orthostatic tachycardia syndrome and Ehlers-Danlos syndrome: A systematic review."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Our review did not find evidence to confirm a relationship between MCADs, HAT, POTS, and EDS."
      explanation: >-
        States the review's overall conclusion: no confirmed relationship
        under strict diagnostic criteria.
    - reference: PMID:40185471
      reference_title: "Prevalence of mast cell activation disorders and hereditary alpha tryptasemia among patients with postural orthostatic tachycardia syndrome and Ehlers-Danlos syndrome: A systematic review."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "it must be mentioned that 1 study revealed an association between mast cell activation syndrome, POTS, and EDS and came close to meeting the full diagnostic criteria for mast cell activation syndrome, unlike other studies"
      explanation: >-
        The review's own qualification: one identified study (a letter, not
        independently quotable here) came closer than any other to meeting
        criteria, so the null result is not absolute. Graded INDIRECT and
        SUPPORT because it is the systematic review's characterization of a
        third-party study, not a directly quoted finding from that study
        itself.


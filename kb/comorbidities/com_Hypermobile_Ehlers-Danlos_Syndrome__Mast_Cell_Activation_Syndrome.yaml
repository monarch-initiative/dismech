name: com_Hypermobile_Ehlers-Danlos_Syndrome__Mast_Cell_Activation_Syndrome
creation_date: '2026-09-18T03:24:13Z'
curation_status: CANDIDATE
notes: >-
  hEDS, POTS, and MCAS are widely described together in patient communities
  and some clinical narrative reviews as a "trifecta," but a 2025 systematic
  review that searched four databases for studies diagnosing any mast cell
  activation disorder (MCAD) or hereditary alpha-tryptasemia alongside a
  formal POTS and/or EDS diagnosis, using prespecified diagnostic criteria,
  found **no studies** meeting that bar -- of 92 full texts reviewed, none
  qualified. The review does note one 2020 letter (cosegregation report,
  Vadas/McGillis et al.) that came close to meeting full MCAS diagnostic
  criteria, closer than any other study identified, but this is explicitly
  characterized as a near-miss rather than a confirming study; that letter
  carries no PubMed abstract and so is not independently quotable here.
  Separately, a 2026 Canadian MCAS practical-approach review explicitly lists
  joint hypermobility or hypermobile Ehlers-Danlos syndrome among the
  conditions and symptoms judged NOT suggestive of MCAS by current ECNM-AIM
  consensus guidance -- a direct clinical caution against over-attributing
  hEDS symptoms to MCAS. This entry therefore records the popular
  association honestly as unconfirmed by rigorous review rather than
  smoothing it into a positive comorbidity signal. Directionality is
  UNKNOWN. No ICEES KG signal exists for this pair: hEDS (MONDO:0007523) is
  not a node in the ICEES KG snapshot at all (confirmed while curating the
  hEDS-POTS comorbidity entry).


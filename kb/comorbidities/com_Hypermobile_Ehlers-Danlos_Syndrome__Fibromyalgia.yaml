name: com_Hypermobile_Ehlers-Danlos_Syndrome__Fibromyalgia
creation_date: '2026-09-18T02:40:05Z'
curation_status: CANDIDATE
notes: >-
  Well-documented comorbidity: a large propensity-matched cohort (59,128
  matched pairs) found fibromyalgia in 9.5% of hEDS/EDS patients versus
  matched controls (OR 1.7). A dedicated systematic review of concomitant
  diagnosis found an even higher clinical overlap (68%-88.9% of hEDS/HSD
  patients also carry a fibromyalgia diagnosis), reflecting shared diagnostic
  features (widespread pain, tenderness, fatigue) as much as a true
  co-occurrence rate. Directionality is UNKNOWN -- both are typically
  lifelong/chronic conditions without an established temporal precedence. No
  ICEES KG signal exists for this pair: hEDS (MONDO:0007523) is not a node in
  the ICEES KG snapshot at all (confirmed while curating the hEDS-POTS
  comorbidity entry), so no ICEES-sourced signal is possible for any hEDS
  pair in the current snapshot.


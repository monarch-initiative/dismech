hypotheses:
- description: >-
    Hypothesis: connective-tissue laxity in hEDS alters mechanoreceptor and
    nociceptor signaling from joints, fascia, and skin, contributing to
    peripheral sensitization; over time this drives central sensitization of
    pain-processing pathways, producing the widespread pain and tenderness
    that defines fibromyalgia. A broader meta-analysis of "functional somatic
    syndromes" (pooling fibromyalgia, chronic fatigue syndrome, and
    functional GI disorders) found a significantly elevated odds of joint
    hypermobility across this syndrome cluster, consistent with a shared
    predisposition rather than fibromyalgia being a distinct, unrelated
    diagnosis.
  evidence:
  - reference: PMID:34237584
    reference_title: "Functional somatic syndromes and joint hypermobility: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis showed a weighted summary effect odds ratio of 3.27 (95% CI: 1.83, 5.84; p < 0.001) of JH in FSS, suggesting greater odds of FSS in individuals with JH than in those without."
    explanation: >-
      A meta-analysis of 10 controlled studies (5 on fibromyalgia
      specifically) finds significantly elevated joint hypermobility in
      functional somatic syndromes including fibromyalgia, consistent with a
      shared predisposition.
  - reference: PMID:36462303
    reference_title: "The concomitant diagnosis of fibromyalgia and connective tissue disorders: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence and severity of a range of objective and patient-reported features were similar between hEDS/HSD and FMS, including joint pain (duration, persistence, SF-36-pain component score); joint swelling; muscle weakness; neurological problems; multidimensional pain inventory-activity; dysautonomia and total autonomic symptoms burden"
    explanation: >-
      Documents extensive symptomatic overlap between hEDS/HSD and
      fibromyalgia beyond diagnostic co-occurrence alone, supporting a shared
      underlying pain/sensitization mechanism rather than coincidental
      comorbidity.
  pathophysiology:
  - name: Central pain sensitization
    description: >-
      Chronic nociceptive input from unstable, hypermobile joints and lax
      connective tissue is proposed to drive central sensitization of pain
      processing, producing the widespread pain and tenderness of
      fibromyalgia.
    biological_processes:
    - preferred_term: sensory perception of pain
      term:
        id: GO:0019233
        label: sensory perception of pain


    evidence:
    - reference: PMID:41432355
      reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Systemic comorbidities included postural orthostatic tachycardia syndrome (13.2%, OR 899.7, 95% CI 483.8-1673.0, p < 0.001), chronic pain (7.9%, OR 7.0, 95% CI 6.4-7.6, p < 0.001), migraines (19.7%, OR 2.5, 95% CI 2.4-2.6, p < 0.001) and fibromyalgia (9.5%, OR 1.7, 95% CI 1.6-1.8, p < 0.001)."
      explanation: A large propensity-matched cohort quantifies elevated fibromyalgia prevalence and odds ratio in EDS patients.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0005546
  population: >-
    Systematic review of 11 observational studies (9 case-control, 2 single
    group) of adults screened for hEDS/HSD/generalized joint hypermobility
    and fibromyalgia.
  mapping_notes: >-
    This concomitant-diagnosis prevalence range (68%-88.9%) is much higher
    than the population-level OR from the large TriNetX cohort above, likely
    reflecting selection into specialty hEDS/HSD clinics and diagnostic
    feature overlap between the two conditions rather than a directly
    comparable population-level co-occurrence rate. Both figures are recorded
    rather than reconciled into one number.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 88.9
      notes: >-
        Upper bound of the reported concomitant-diagnosis prevalence range
        (68%-88.9%) across the reviewed studies.
    evidence:
    - reference: PMID:36462303
      reference_title: "The concomitant diagnosis of fibromyalgia and connective tissue disorders: A systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The prevalence of concomitant diagnosis of hEDS/HSD and FMS ranged from 68%-88.9% and from 8.0 to 64.2% for GJH and FMS."
      explanation: Systematic review of concomitant-diagnosis prevalence in specialty-clinic hEDS/HSD populations.

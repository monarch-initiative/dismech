name: com_Hypermobile_Ehlers-Danlos_Syndrome__Asthma
creation_date: '2026-09-18T02:57:53Z'
curation_status: CANDIDATE
notes: >-
  A 2021 review of respiratory manifestations in EDS/HSD reports that asthma
  (diagnosed by symptoms and variable airflow obstruction) was observed in
  23% of a cohort of 43 EDS patients (mainly classical EDS) and 37% of 51
  joint hypermobility syndrome (JHS) patients, compared to 14% of controls,
  alongside increased serum IgE in a quarter of the EDS group and a fifth of
  the JHS group -- an atopic pattern the review's authors note may reflect
  overlapping polygenic risk between asthma and EDS/hypermobility rather
  than a purely mechanical airway effect. The cited primary cohort was
  mainly classical EDS rather than hEDS specifically, but is combined with a
  JHS cohort that overlaps substantially with current hEDS/HSD
  classification; recorded against hEDS as the numerically dominant
  EDS/hypermobility-spectrum phenotype. Directionality is UNKNOWN. No ICEES
  KG signal exists for this specific hEDS-asthma pair despite the ICEES KG
  snapshot itself being built around an asthma cohort (see association_signals).


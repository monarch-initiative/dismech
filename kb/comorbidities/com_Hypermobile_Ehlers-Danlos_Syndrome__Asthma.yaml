hypotheses:
- description: >-
    Hypothesis: EDS/hypermobility and asthma may share overlapping
    polygenic risk (asthma being itself a polygenic disease), with the
    airway/atopic phenotype further modified by connective-tissue-related
    changes in airway and lung-parenchyma mechanical properties (increased
    distensibility, propensity to airway collapse) documented elsewhere in
    the same EDS respiratory literature, rather than asthma in hEDS being a
    purely mechanical airway phenomenon.
  evidence:
  - reference: PMID:34291699
    reference_title: "A review of respiratory manifestations and their management in Ehlers-Danlos syndromes and hypermobility spectrum disorders."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It has been proposed that asthma, which is a polygenic disease, may have overlapping genes with EDS, with the phenotype modified by genetic and environmental factors."
    explanation: >-
      States the shared-polygenic-risk hypothesis for the EDS/hypermobility
      and asthma association, as distinct from a purely mechanical
      explanation.
  pathophysiology:
  - name: Atopic and airway-mechanical predisposition
    description: >-
      Proposed convergence of shared polygenic atopic/asthma risk with
      connective-tissue-related changes in airway and lung-parenchyma
      mechanics, contributing to increased asthma prevalence in EDS and
      hypermobility spectrum disorders.
    biological_processes:
    - preferred_term: airway smooth muscle contraction
      term:
        id: GO:0006939
        label: smooth muscle contraction


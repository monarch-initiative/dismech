name: com_Hypermobile_Ehlers-Danlos_Syndrome__Endometriosis
creation_date: '2026-09-18T02:57:53Z'
curation_status: CANDIDATE
notes: >-
  Despite a very high prevalence of gynecologic symptoms that clinically
  overlap with endometriosis (menorrhagia 76%, dysmenorrhea 72%, deep/
  intromission dyspareunia 38-43%), a French cohort study of 386 women with
  clinically diagnosed hEDS found endometriosis itself diagnosed in only 6%
  of the cohort -- essentially the same as the general-population range
  (3-6%) and well below rates in women with chronic pain generally. The
  authors explicitly propose that endometriosis may be over-diagnosed in
  hEDS patients because dysmenorrhea and bleeding symptoms mimic it. This
  entry therefore records a symptom overlap without a true excess prevalence
  of the underlying disease, honestly characterized as REFUTE for a genuine
  hEDS-endometriosis comorbidity signal. Directionality is UNKNOWN. No ICEES
  KG signal exists for this pair: hEDS (MONDO:0007523) is not a node in the
  ICEES KG snapshot at all (confirmed while curating the hEDS-POTS
  comorbidity entry).


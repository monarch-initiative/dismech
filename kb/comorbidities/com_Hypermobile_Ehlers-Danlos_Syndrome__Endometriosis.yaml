hypotheses:
- description: >-
    Hypothesis under test: connective-tissue laxity or altered peritoneal/
    uterine tissue mechanics in hEDS predisposes to endometriosis. The
    cited cohort study argues against this -- endometriosis prevalence in
    hEDS matches the general population, and the symptom overlap (chronic
    dysmenorrhea, dyspareunia, bleeding) that prompts clinical suspicion of
    endometriosis is itself attributable to hEDS-related connective-tissue
    and pain mechanisms rather than to true excess endometriosis.
  evidence:
  - reference: PMID:27619482
    reference_title: "Gynecologic symptoms and the influence on reproductive life in 386 women with hypermobility type ehlers-danlos syndrome: a cohort study."
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of endometriosis we found was the same as that for the general population (3–6 %) and much less than in women with chronic pain"
    explanation: >-
      Directly refutes a mechanistic hypothesis of true excess endometriosis
      prevalence in hEDS; the finding is that prevalence matches the general
      population.
  pathophysiology:
  - name: Chronic dysmenorrhea and dyspareunia mimicking endometriosis
    description: >-
      Connective-tissue laxity and generalized chronic-pain mechanisms in
      hEDS produce menorrhagia, dysmenorrhea, and dyspareunia that clinically
      resemble endometriosis and can prompt diagnostic suspicion or surgery,
      without a corresponding excess of confirmed endometriosis.
    biological_processes:
    - preferred_term: sensory perception of pain
      term:
        id: GO:0019233
        label: sensory perception of pain


name: com_Hypermobile_Ehlers-Danlos_Syndrome__Generalized_Anxiety_Disorder
creation_date: '2026-09-18T02:40:05Z'
curation_status: CANDIDATE
notes: >-
  Anxiety is among the most consistently reported hEDS/joint hypermobility
  comorbidities, with the strongest specific literature association being to
  panic disorder/agoraphobia rather than generalized anxiety disorder (GAD)
  specifically. A large propensity-matched cohort found a broad "anxiety"
  diagnostic category in 26.1% of EDS patients versus matched controls (OR
  1.8); this is a broader anxiety-disorder category rather than a
  GAD-specific figure (see mapping_notes). The proposed "neurovisceral
  phenotype" model links hypermobility to anxiety through altered
  interoceptive/autonomic signaling and heightened amygdala/insular
  reactivity, rather than a purely psychological mechanism. Directionality
  is UNKNOWN. No ICEES KG signal exists for this pair: hEDS (MONDO:0007523)
  is not a node in the ICEES KG snapshot at all (confirmed while curating
  the hEDS-POTS comorbidity entry) -- note ICEES does separately carry a
  general "anxiety" node (MONDO:0011918), but that is moot without hEDS
  itself being present.


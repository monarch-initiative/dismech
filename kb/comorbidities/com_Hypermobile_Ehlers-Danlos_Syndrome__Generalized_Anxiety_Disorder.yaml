hypotheses:
- description: >-
    Hypothesis (the "neurovisceral phenotype" model): joint hypermobility is
    associated with altered autonomic reactivity and heightened
    interoceptive sensibility; functional neuroimaging shows hypermobile
    individuals have heightened amygdala and insular cortex reactivity to
    negative emotional stimuli compared to non-hypermobile individuals. This
    constitutional difference in brain-body coupling is proposed to
    predispose to anxiety symptoms, rather than anxiety arising as a purely
    psychological reaction to chronic pain or disability.
  evidence:
  - reference: PMID:25713509
    reference_title: "Neurovisceral phenotypes in the expression of psychiatric symptoms."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In a recent functional neuroimaging study of healthy volunteers, hypermobile, compared to non-hypermobile, participants displayed heightened neural reactivity to sad and angry scenes within brain regions implicated in anxious feeling states, notably insular cortex (Mallorqui-Bague et al., 2014)."
    explanation: >-
      Reports a specific functional neuroimaging finding of heightened
      amygdala/insular reactivity in hypermobile individuals, the structural
      correlate proposed to underlie the hypermobility-anxiety association.
  - reference: PMID:20963520
    reference_title: "Joint hypermobility and anxiety: the state of the art."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "JHS is more prevalent in individuals with panic disorder/agoraphobia, and patients with JHS present with greater prevalence of panic disorder/agoraphobia. In addition, there is an association between JHS severity and severity of anxiety"
    explanation: >-
      A dedicated review of the joint-hypermobility/anxiety literature finds
      the strongest specific association is with panic disorder/agoraphobia,
      and that anxiety severity tracks hypermobility severity -- both
      arguing against a purely coincidental comorbidity.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0001942
  population: >-
    TriNetX research network, retrospective propensity-matched analysis
    (2005-2023), 59,128 matched pairs of EDS patients (excluding Marfan
    syndrome) versus controls.
  mapping_notes: >-
    The cohort study reports a broad "anxiety" diagnostic category rather
    than generalized anxiety disorder specifically; recorded here against
    GAD as the closest existing dismech disorder entry, but the underlying
    ICD/EHR coding likely spans multiple anxiety-disorder subtypes
    (including panic disorder, which the dedicated review below identifies
    as the more specific association).
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 26.1
      notes: Anxiety (broad diagnostic category) prevalence in the EDS cohort.
    - metric_type: OR
      metric_value: 1.8
      metric_ci_lower: 1.7
      metric_ci_upper: 1.8
      p_value: 0.001
      notes: Odds ratio for anxiety in EDS versus propensity-matched controls. Reported by the source as p < 0.001, an upper bound, not a point estimate.
    evidence:
    - reference: PMID:41432355
      reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Psychiatric conditions showed heightened prevalence of anxiety (26.1%, OR 1.8, 95% CI 1.7-1.8, p < 0.001) and depression (18.7%, OR 1.3, 95% CI 1.2-1.3, p < 0.001)."
      explanation: A large propensity-matched cohort quantifies elevated anxiety-disorder prevalence and odds ratio in EDS patients.


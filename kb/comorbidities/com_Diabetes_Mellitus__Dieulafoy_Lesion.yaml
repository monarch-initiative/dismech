name: com_Diabetes_Mellitus__Dieulafoy_Lesion
creation_date: "2026-08-16T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Dieulafoy_Lesion.yaml`'s `environmental:` block
  (dismech#8302, one of the four "environmental block asserts something the
  pathophysiology block cannot receive" instances tracked there): diabetes
  mellitus was listed as an "exposure" with no route to either of the entry's
  two pathophysiology nodes (both describe the congenital vascular anomaly
  itself, not its acquisition or triggering). It is a comorbidity/host-attribute
  state, the same category error #8185 tracks, and is a first-class `Disease`
  entry in its own right (`kb/disorders/Diabetes_Mellitus.yaml`).

  Directionality is UNKNOWN rather than A_BEFORE_B/RISK: the only source is a
  within-case comorbidity proportion from a 101-case systematic review of
  rectal Dieulafoy lesion (mean age 66±17), with no comparison population.
  That is consistent with diabetes simply reflecting the age/comorbidity
  profile of patients who present with GI bleeding, and the source itself
  proposes no mechanism connecting diabetes to submucosal-artery caliber
  persistence or mucosal erosion. Recording an inferred `RISK` direction or a
  mechanistic hypothesis would assert more than the evidence supports (per
  the dismech#8195 review precedent on over-claiming from within-case
  prevalence). The source paper does not specify diabetes type; the generic
  `Diabetes_Mellitus` umbrella entry is used rather than guessing a specific
  type.


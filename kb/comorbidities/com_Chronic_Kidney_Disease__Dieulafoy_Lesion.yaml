association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Systematic review of 101 published adult rectal Dieulafoy's lesion cases
    (MEDLINE, Cochrane, Embase, Scopus), mean age at presentation 66±17
    years; within-case comorbidity proportion, no comparison/control
    population.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 16.0
      notes: >-
        Proportion of the 101-case rectal Dieulafoy lesion series reporting
        chronic kidney disease as a major underlying disorder. Unadjusted for
        age and with no comparison population, so this corroborates
        co-occurrence in an elderly bleeding-presentation cohort rather than
        establishing an elevated risk relative to the general population.
    evidence:
    - reference: PMID:35243119
      reference_title: "Rectal Dieulafoy's lesion: a comprehensive review of patient characteristics, presentation patterns, diagnosis, management, and clinical outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Major underlying disorders were hypertension 29%, diabetes mellitus 21%, and chronic kidney disease 16%."
      explanation: >-
        Reports chronic kidney disease as an underlying comorbidity among a
        systematic review cohort of rectal Dieulafoy lesion cases.

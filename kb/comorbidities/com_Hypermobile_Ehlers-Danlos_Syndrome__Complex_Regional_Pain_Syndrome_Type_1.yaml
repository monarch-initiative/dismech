        not a formal odds ratio computed by the study).
    - metric_type: PREVALENCE
      metric_value: 1.05
      notes: Proportion of EDS patients with a recorded CRPS diagnosis (273/26,053).
    evidence:
    - reference: PMID:42398975
      reference_title: "Association between Ehlers-Danlos syndrome and complex regional pain syndrome: a large nationwide claims database study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proportion of recorded CRPS diagnoses was higher among patients with recorded EDS diagnoses (1.05%; 273/26,053) compared with patients without EDS (0.09%; 51,151/54,158,272), corresponding to an approximately 11-fold higher proportion of recorded CRPS diagnoses among patients with EDS (95% CI 9.89 to 12.51)."
      explanation: >-
        Directly quantifies the large increase in recorded CRPS diagnoses
        among EDS patients in a nationwide claims database.
    - reference: PMID:42398975
      reference_title: "Association between Ehlers-Danlos syndrome and complex regional pain syndrome: a large nationwide claims database study."
      supports: SUPPORT

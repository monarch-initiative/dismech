hypotheses:
- description: >-
    Hypothesis: joint instability and recurrent minor trauma/injury from
    generalized connective-tissue laxity in hEDS provide a recurring
    nociceptive and inflammatory trigger, and altered central pain processing
    (already implicated in hEDS chronic pain generally) predisposes to the
    maladaptive neuroinflammatory and autonomic dysregulation that
    characterizes CRPS following a minor injury or immobilization event.
  evidence:
  - reference: PMID:42398975
    reference_title: "Association between Ehlers-Danlos syndrome and complex regional pain syndrome: a large nationwide claims database study."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Ehlers-Danlos syndrome (EDS) is a genetic connective tissue disorder characterized by joint instability and recurrent injuries, which has been linked to chronic pain syndromes, including complex regional pain syndrome (CRPS)."
    explanation: >-
      States the recurrent-injury/joint-instability framing motivating the
      hypothesized link between hEDS and CRPS.
  pathophysiology:
  - name: Recurrent joint injury and maladaptive pain processing
    description: >-
      Repeated joint subluxation and minor trauma from connective-tissue
      laxity is proposed to act as a recurring peripheral trigger, upon which
      centrally sensitized/maladaptive pain processing produces the
      disproportionate regional pain, vasomotor, and trophic changes
      characteristic of CRPS.
    biological_processes:
    - preferred_term: sensory perception of pain
      term:
        id: GO:0019233
        label: sensory perception of pain


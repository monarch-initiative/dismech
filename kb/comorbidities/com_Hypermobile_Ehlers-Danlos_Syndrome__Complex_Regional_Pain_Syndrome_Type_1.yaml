name: com_Hypermobile_Ehlers-Danlos_Syndrome__Complex_Regional_Pain_Syndrome_Type_1
creation_date: '2026-09-18T02:57:53Z'
curation_status: CANDIDATE
notes: >-
  A large nationwide US commercial-claims study (2017-2022, >54 million
  patients) found an approximately 11-fold higher proportion of recorded CRPS
  diagnoses among patients with a recorded EDS diagnosis compared with
  patients without EDS. The study covers EDS diagnostic coding broadly (ICD-10
  Q79.6x) rather than hEDS specifically, but the great majority of coded EDS
  is hypermobile-type; among the CRPS cases the study identified, 76.8% were
  CRPS type 1, matching this entry's target disorder. Directionality is
  mixed in the underlying data (273 patients had CRPS diagnosed after EDS,
  217 before), consistent with UNKNOWN. No ICEES KG signal exists for this
  pair: hEDS (MONDO:0007523) is not a node in the ICEES KG snapshot at all
  (confirmed while curating the hEDS-POTS comorbidity entry).


    54,235,476 patients; EDS identified by ICD-10-CM Q79.6x (all EDS
    subtypes) and CRPS by ICD-10-CM G90.5x/G56.4x/G57.7x.
  mapping_notes: >-
    The study identifies EDS by ICD-10-CM coding broadly, not specifically
    hEDS, but reports that 76.8% of the co-occurring CRPS cases were CRPS
    type 1, matching this entry's target disorder. Recorded against hEDS as
    the numerically dominant EDS subtype.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 11.0

name: com_Diabetes_Mellitus__Peripheral_Artery_Disease
creation_date: "2026-08-19T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Peripheral_Artery_Disease.yaml`'s `environmental:`
  block (dismech#8551): that entry listed `Diabetes` as an "exposure" acting on
  peripheral artery disease (PAD), but diabetes mellitus is a first-class
  `Disease` entry in its own right (`kb/disorders/Diabetes_Mellitus.yaml`),
  not something external to the organism the patient is exposed to. Modeling
  the relationship here as a disease-disease comorbidity instead makes it
  queryable and avoids a near-tautological "exposure" edge that ECTO/XCO can
  never bind a term for. Directionality is A_BEFORE_B: diabetes is a
  well-established antecedent risk state for atherosclerotic PAD via chronic
  hyperglycemia-driven vascular injury (see the `diabetic_vascular_complications`
  module), not the reverse. Evidence is carried over unchanged from the
  original `environmental:` entry rather than dropped.

  `disease_a` is deliberately the unstratified `Diabetes_Mellitus`
  (MONDO:0005015) rather than `Type_2_Diabetes_Mellitus` (MONDO:0005148). In a
  comorbidity entry `disease_a` is the claim, and the sole supporting citation
  (PMID:23915883) pools "diabetes" across 34 community studies without
  stratifying by type, so a T2DM-specific entry would be pitched above what its
  evidence reaches. Retargeting rather than narrowing was chosen because no
  T2DM-stratified PAD risk estimate was available to cite. If one is added
  later, a separate `com_Type_2_Diabetes_Mellitus__Peripheral_Artery_Disease`
  entry is the right home for it; this entry should stay at the level its
  evidence supports.

disease_a:
  slug: Diabetes_Mellitus
  preferred_term: diabetes mellitus
  term:
    id: MONDO:0005015
    label: diabetes mellitus

disease_b:
  slug: Peripheral_Artery_Disease
  preferred_term: peripheral arterial disease
  term:
    id: MONDO:0005386
    label: peripheral arterial disease

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Chronic hyperglycemia in diabetes drives endothelial dysfunction, oxidative
    stress, and accelerated atherosclerosis in peripheral arteries, making
    diabetes a major risk factor for the development of peripheral artery
    disease (the same final-common vascular-injury cascade captured by the
    `diabetic_vascular_complications` module).
  evidence:
  - reference: PMID:23915883
    reference_title: "Comparison of global estimates of prevalence and risk factors for peripheral artery disease in 2000 and 2010: a systematic review and analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in LMIC, followed by diabetes (1·88"
    explanation: >-
      Meta-analysis across 34 community studies (112,027 participants) rating
      15 risk factors for PAD; diabetes has the second-largest effect after
      smoking. The quote begins mid-sentence and the fragment reads as though
      it were about smoking in low- and middle-income countries: it is not.
      `1·88` is the high-income meta-OR for diabetes, and the low/middle-income
      estimate of 1.47 sits in the bracketed continuation that snippet
      normalization strips, which is why the quote stops where it does. Carried
      over unchanged from the original `Peripheral_Artery_Disease.yaml`
      `environmental:` entry.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Systematic review and meta-analysis of 34 community-based studies
    (112,027 participants) estimating global peripheral artery disease
    prevalence and its risk factors in 2000 and 2010, stratified into
    high-income countries and low- and middle-income countries.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 1.88
      metric_ci_lower: 1.66
      metric_ci_upper: 2.14
      notes: >-
        Meta-OR for diabetes in high-income countries. The low- and
        middle-income estimate from the same analysis is 1.47 (1.29-1.68); the
        high-income value is recorded here because the two are not poolable and
        a single metric slot cannot hold both. Diabetes ranks second of the 15
        risk factors assessed, behind smoking.
    evidence:
    - reference: PMID:23915883
      reference_title: "Comparison of global estimates of prevalence and risk factors for peripheral artery disease in 2000 and 2010: a systematic review and analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in LMIC, followed by diabetes (1·88"
      explanation: >-
        The only exact-quotable fragment carrying the diabetes point estimate:
        the effect sizes are printed inside a bracketed continuation that
        snippet normalization strips, so the quote ends at `1·88`. That value is
        the high-income meta-OR recorded in the metric above, not an LMIC
        smoking figure, despite how the fragment reads in isolation.

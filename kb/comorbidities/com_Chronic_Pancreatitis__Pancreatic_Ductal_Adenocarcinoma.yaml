name: com_Chronic_Pancreatitis__Pancreatic_Ductal_Adenocarcinoma
creation_date: "2026-08-27T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of `kb/disorders/Metastatic_Pancreatic_Adenocarcinoma.yaml`'s
  `environmental:` block (dismech#8296, dismech#8551). That entry listed
  `Chronic pancreatitis` as an exposure, but chronic pancreatitis is a
  first-class `Disease` entry in its own right
  (`kb/disorders/Chronic_Pancreatitis.yaml`) rather than something external to
  the organism acting on it.

  `disease_b` is `Pancreatic_Ductal_Adenocarcinoma`, not the
  `Metastatic_Pancreatic_Adenocarcinoma` entry this row came from. The cohort
  evidence measures incident pancreatic cancer in a chronic pancreatitis
  population without reference to stage at presentation, and nothing cited here
  addresses the metastatic entity specifically. Attaching a directed risk edge
  to the metastatic entry would assert more than the sources support -- the same
  correction the review of dismech#8195 applied to
  `com_Liver_Cirrhosis__Hepatocellular_Carcinoma`.

  The signal below uses the standardized incidence ratio computed after
  excluding the first two years of follow-up, 16.5 rather than the headline
  26.3. The unrestricted figure is inflated by cancers already present when
  pancreatitis was diagnosed, which is reverse causation rather than risk.

disease_a:
  slug: Chronic_Pancreatitis
  preferred_term: chronic pancreatitis
  term:
    id: MONDO:0005003
    label: chronic pancreatitis

disease_b:
  slug: Pancreatic_Ductal_Adenocarcinoma
  preferred_term: pancreatic ductal adenocarcinoma
  term:
    id: MONDO:0005184
    label: pancreatic ductal adenocarcinoma

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Sustained pancreatic inflammation and the fibrotic, regenerative response to
    it provide the context from which pancreatic ductal adenocarcinoma arises,
    in the same way cirrhosis does for hepatocellular carcinoma.
  evidence:
  - reference: PMID:38408777
    reference_title: Management of chronic pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is manifested by abdominal pain, deterioration in quality of life, food maldigestion and malabsorption, diabetes, and an increased risk for pancreatic adenocarcinoma."
    explanation: >-
      Names increased pancreatic adenocarcinoma risk among the established
      consequences of chronic pancreatitis, in a clinical management review.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    International Pancreatitis Study Group multicentre historical cohort, 2015
    subjects with chronic pancreatitis recruited across six countries, mean
    follow-up 7.4 years, with observed pancreatic cancers compared against
    country-specific incidence adjusted for age and sex.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OTHER
      metric_value: 16.5
      notes: >-
        Standardized incidence ratio of pancreatic cancer among subjects with at
        least two years of follow-up, and 14.4 at five years. The unrestricted
        ratio of 26.3 is deliberately not used: excluding early follow-up
        removes cancers that were already present when pancreatitis was
        diagnosed. Metric type is OTHER because the enum has no standardized
        incidence ratio value.
    evidence:
    - reference: PMID:8479461
      reference_title: Pancreatitis and the risk of pancreatic cancer. International Pancreatitis Study Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For subjects with a minimum of two or five years of follow-up, the respective standardized incidence ratios were 16.5 (95 percent confidence interval, 11.1 to 23.7) and 14.4 (95 percent confidence interval, 8.5 to 22.8)."
      explanation: >-
        Measures incident pancreatic cancer forward from a defined chronic
        pancreatitis cohort against expected population rates, which is what a
        directed A_BEFORE_B risk signal requires, and reports the lag-adjusted
        ratios that exclude reverse causation.

hypotheses:
- description: >-
    Hypothesis: the generalized connective-tissue laxity of hEDS extends to
    the vasculature, producing excessive venous compliance and pooling in
    the lower body on standing; the resulting fall in venous return and
    cardiac preload triggers a compensatory sympathetic/tachycardic response
    that manifests as POTS. This is the commonly cited framing for the
    association, but professional-society guidance explicitly states that
    the experimental evidence for the underlying biological mechanism is
    still limited, so the mechanistic step from connective-tissue laxity to
    autonomic dysfunction is not yet established -- only the clinical
    association itself is well documented.
  evidence:
  - reference: PMID:40387691
    reference_title: "AGA Clinical Practice Update on GI Manifestations and Autonomic or Immune Dysfunction in Hypermobile Ehlers-Danlos Syndrome: Expert Review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should be aware of the observed associations between hEDS or HSDs and POTS and/or MCAS and their overlapping gastrointestinal (GI) manifestations; while theoretical explanations exist, experimental evidence of the biological mechanisms that explain relationships is limited and evolving."
    explanation: >-
      An American Gastroenterological Association expert consensus statement
      establishes the hEDS-POTS association as clinically recognized while
      explicitly cautioning that the biological mechanism is unconfirmed --
      the honest epistemic status of the mechanistic hypothesis above.
  - reference: PMID:29519641
    reference_title: "Postural tachycardia syndrome and other forms of orthostatic intolerance in Ehlers-Danlos syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a strong association between several forms of cardiovascular dysfunction, most notably postural tachycardia syndrome, and joint hypermobility or Ehlers-Danlos syndrome."
    explanation: >-
      A literature review of 10 studies concludes that postural tachycardia
      syndrome is the most commonly recognized circulatory disorder
      associated with joint hypermobility and Ehlers-Danlos syndrome.
  pathophysiology:
  - name: Vascular connective tissue laxity and orthostatic venous pooling
    description: >-
      Proposed (not yet experimentally confirmed) mechanism: laxity of the
      collagenous support structures of the venous wall reduces venous tone,
      increasing venous compliance and dependent pooling on standing, which
      lowers cardiac preload and provokes a compensatory tachycardic
      response.
    biological_processes:
    - preferred_term: blood circulation
      term:
        id: GO:0008015
        label: blood circulation

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0011479
  population: >-
    Cross-sectional cohort of 37 participants diagnosed with hypermobility
    spectrum disorder (HSD) or Ehlers-Danlos syndrome (EDS) per the 2017
    Diagnostic Consensus Criteria, split into 23 with spondyloarthritis
    (SpA) + EDS and 14 with EDS-only.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 60.9
      notes: POTS prevalence in the SpA + EDS subgroup (n=23).
    - metric_type: PREVALENCE
      metric_value: 78.6
      notes: POTS prevalence in the EDS-only subgroup (n=14).
    evidence:
    - reference: PMID:42229474
      reference_title: "Comorbidities in Ehlers-Danlos syndromes and hypermobile spectrum disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "POTS (60.9% vs 78.6%) and IBS (60.9% vs 85.7%) occurred at similar frequencies in both groups."
      explanation: >-
        Directly quantifies POTS prevalence in a clinically diagnosed
        EDS/HSD cohort, showing a majority of patients affected in both
        subgroups.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0007523
  signal_disorder_b_id: MONDO:0011479
  population: >-
    Community-based sample of 306 schoolchildren (ages 10-18) from public
    schools in three Colombian cities, screened for joint hyperlaxity by
    Beighton score (not clinically diagnosed hEDS) and for POTS by
    orthostatic vital-sign testing.
  mapping_notes: >-
    This is a general-population screening study, not a clinically diagnosed
    hEDS cohort -- joint hyperlaxity by Beighton score alone is a broader,
    less specific phenotype than hEDS. Recorded as REFUTE for the
    population-level co-occurrence claim to keep the overall association
    balanced rather than overclaiming from the clinically-ascertained cohort
    above; it does not contradict that cohort's finding, since the two study
    an ascertainment-different population.
  directionality: UNKNOWN
  statistics:
    metrics:
    - metric_type: PREVALENCE
      metric_value: 1.2
      p_value: 0.5188
      notes: >-
        Co-occurrence of joint hyperlaxity and POTS in the same child (1 of
        87 hyperlax children, 1.2%), not statistically significant.
    evidence:
    - reference: PMID:35506776
      reference_title: "Prevalence of joint hypermobility, postural orthostatic tachycardia syndrome (POTS), and orthostatic hypotension in school-children."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 87 children with joint hyperlaxi ty, only 1 child had joint hyperlaxity at the same time as postural hypotension (1.2%) (p = 0.6735), and 1 child had joint hyperlaxity and postural orthostatic tachycardia syndrome simultaneously (1.2%) (p = 0.5188)."
      explanation: >-
        Community-level screening study found no statistically significant
        excess co-occurrence of joint hyperlaxity and POTS, in tension with
        the much higher prevalence seen in clinically diagnosed EDS/HSD
        cohorts.


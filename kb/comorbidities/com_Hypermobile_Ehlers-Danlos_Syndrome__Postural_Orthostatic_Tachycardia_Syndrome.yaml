name: com_Hypermobile_Ehlers-Danlos_Syndrome__Postural_Orthostatic_Tachycardia_Syndrome
creation_date: '2026-09-18T02:22:57Z'
curation_status: CANDIDATE
notes: >-
  Widely recognized clinical comorbidity between hypermobile Ehlers-Danlos
  syndrome (hEDS) and postural orthostatic tachycardia syndrome (POTS):
  postural tachycardia syndrome is described as the most commonly recognized
  circulatory disorder among patients with joint hypermobility or
  Ehlers-Danlos syndrome, and a 2025 AGA Clinical Practice Update explicitly
  flags the association for clinicians while noting that the underlying
  biological mechanism remains unconfirmed. A cross-sectional cohort of
  clinically diagnosed EDS/HSD patients found POTS in a majority of
  participants (60.9%-78.6%, depending on subgroup). This contrasts with a
  community-based pediatric study that found no significant excess of POTS
  among children with joint hyperlaxity screened by Beighton score alone
  (not clinically diagnosed hEDS), suggesting the strength of the association
  may depend on how the connective-tissue phenotype is ascertained.
  Directionality is UNKNOWN -- both conditions can present in either temporal
  order and are often diagnosed together during the same clinical workup. No
  ICEES KG signal exists for this pair (searched; see association_signals).


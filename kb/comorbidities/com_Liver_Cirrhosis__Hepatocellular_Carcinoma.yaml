name: com_Liver_Cirrhosis__Hepatocellular_Carcinoma
creation_date: "2026-08-08T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Split out of the former `kb/disorders/Metastatic_HCC.yaml`'s `environmental:` block
  (since folded into `Hepatocellular_Carcinoma`, design decisions §3a)
  (dismech#8185): that entry listed `Cirrhosis` as an "exposure" acting on the
  disease's own "Chronic Liver Disease Substrate" pathophysiology node, but
  cirrhosis is one of the chronic liver injury states that node itself
  enumerates rather than something external to the organism acting on it, and
  it is a first-class `Disease` entry in its own right
  (`kb/disorders/Liver_Cirrhosis.yaml`). Modeling the relationship here as a
  disease-disease comorbidity instead makes it queryable and avoids the
  near-tautological pathograph edge. Directionality is A_BEFORE_B: cirrhosis
  is the premalignant substrate that precedes HCC development, not the
  reverse.

  Side B is `Hepatocellular_Carcinoma`, not `Metastatic_HCC`. The cited
  evidence establishes cirrhosis as the background from which HCC arises and
  measures incident HCC in a cirrhosis cohort; none of it addresses
  *metastatic* HCC specifically, and the relationship between cirrhosis and
  stage at presentation runs the other way if anything, since HCC arising in
  non-cirrhotic liver is not caught by surveillance and tends to present
  larger and later. Attaching a directed RISK edge to the metastatic entity
  would assert more than the sources support (review of dismech#8195).

disease_a:
  slug: Liver_Cirrhosis
  preferred_term: cirrhosis of liver
  term:
    id: MONDO:0005155
    label: cirrhosis of liver

disease_b:
  slug: Hepatocellular_Carcinoma
  preferred_term: hepatocellular carcinoma
  term:
    id: MONDO:0007256
    label: hepatocellular carcinoma

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Cirrhosis provides the premalignant inflammatory and regenerative context
    for most hepatocellular carcinoma: sustained hepatocyte injury and
    regeneration in the cirrhotic liver create the genomic instability and
    proliferative pressure from which HCC arises.
  evidence:
  - reference: PMID:41567639
    reference_title: Identification of novel germline and somatic mutations associated with hepatocellular carcinoma by next-generation sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCC typically arises in patients with chronic liver disease, including hepatitis, cirrhosis, and non-alcoholic fatty liver diseases."
    explanation: >-
      Establishes cirrhosis as one of the chronic liver disease backgrounds
      from which HCC typically arises.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  population: >-
    Brazilian cirrhosis outpatient cohort under six-monthly HCC surveillance
    (n=453; hepatitis C virus and heavy alcohol use the main etiologies),
    Porto Alegre, 2005-2014, 10-year retrospective cohort with Kaplan-Meier
    estimation of incident HCC.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: INCIDENCE_RATE
      metric_value: 2.6
      notes: >-
        Kaplan-Meier cumulative incidence of HCC at 1 year among patients who
        had cirrhosis at cohort entry, expressed as a percentage; 15.4% at 5
        years and 28.8% at 10 years, with 75 of 453 patients (16.6%)
        developing HCC over the study period. Chosen over a within-case
        prevalence figure because the denominator here is the cirrhosis
        population followed forward, which is what a directed A_BEFORE_B risk
        signal requires.
    evidence:
    - reference: PMID:28028370
      reference_title: "Incidence of hepatocellular carcinoma in outpatients with cirrhosis in Brazil: A 10-year retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HCC was diagnosed in 75 patients (16.6%), with an estimated cumulative incidence of 2.6% in the 1st year, 15.4% in the 5th year, and 28.8% in the 10th year."
      explanation: >-
        Measures incident HCC prospectively in a defined cirrhosis cohort,
        supporting cirrhosis as an antecedent risk state for HCC rather than
        merely a frequent co-finding among HCC cases.

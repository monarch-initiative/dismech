name: com_Hypermobile_Ehlers-Danlos_Syndrome__Irritable_Bowel_Syndrome
creation_date: '2026-09-18T02:40:05Z'
curation_status: CANDIDATE
notes: >-
  Gastrointestinal symptoms, particularly reflux, dyspepsia, and irritable
  bowel syndrome (IBS), are among the most consistently reported hEDS
  comorbidities. A large propensity-matched cohort found IBS in 7.3% of
  EDS patients versus matched controls (OR 2.6), and a non-patient
  cross-sectional study of university students found the association between
  EDS-hypermobility type and GI symptoms (particularly postprandial fullness
  and early satiety) even outside a clinical/patient-selected population,
  with the association dependent on autonomic dysfunction rather than pain
  or psychopathology. Directionality is UNKNOWN. No ICEES KG signal exists
  for this pair: hEDS (MONDO:0007523) is not a node in the ICEES KG snapshot
  at all (confirmed while curating the hEDS-POTS comorbidity entry).


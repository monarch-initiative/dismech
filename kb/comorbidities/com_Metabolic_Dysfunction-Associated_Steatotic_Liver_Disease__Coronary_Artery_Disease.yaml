name: com_Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease__Coronary_Artery_Disease
creation_date: "2026-09-01T00:00:00Z"
curation_status: CURATED
notes: >-
  Built for dismech#6352, which handed off a 2026 review (PMID:42430855)
  proposing endothelial dysfunction as a unifying axis between atherosclerosis
  and MASLD. The first pass on that issue (dismech#8300, merged) added the
  hepatic limb — a `Liver Sinusoidal Endothelial Cell Dysfunction and
  Capillarization` node on the MASLD entry — and then stopped, because how the
  two diseases should be joined structurally was an open question. This file is
  the answer that issue's assessment recommended: the disease-disease
  epidemiology belongs in a comorbidity entry, which is the one place in this KB
  that can hold it.

  Two structures were considered and rejected. A `conforms_to` edge from the
  MASLD sinusoidal node to `atherogenesis#Endothelial Dysfunction and
  Subendothelial LDL Retention` would assert a subendothelial LDL retention
  step that the hepatic sinusoid does not have. A generic
  `endothelial_dysfunction` module would be the most faithful reading of the
  review, but endothelial dysfunction is close to universal and the unifying
  claim currently rests on narrative reviews, so that remains a maintainer call
  and is deliberately not built here.

  `disease_b` is `Coronary_Artery_Disease`, not an atherosclerosis entry: there
  is no `kb/disorders/Atherosclerosis.yaml` and there should not be, because
  atherosclerosis is modeled as `kb/modules/atherogenesis.yaml` with
  `Coronary_Artery_Disease` among its conformers. Coronary artery disease is the
  closest disease-level conformer for which coronary-specific measurements
  exist. The issue body's "likely target files" line naming
  `Atherosclerosis.yaml` and `Fatty_Liver_Disease.yaml` is wrong on both counts.

  The signals divide by what was actually measured, because the endpoints are
  not interchangeable. The two coronary-imaging signals measure atherosclerosis
  in the coronary bed, which is `disease_b` itself. The two incident-event
  signals measure a composite of cardiovascular death, myocardial infarction and
  stroke, which is broader than coronary atherosclerosis; they are kept because
  they carry the prospective evidence, and each one's `notes` records the
  endpoint mismatch rather than letting the pooled hazard ratio read as a
  coronary-atherosclerosis quantity. The carotid intima-media thickness arm of
  PMID:34933963 (OR 2.00) is not curated here for the same reason — carotid
  disease has its own entries.

  Directionality is A_BEFORE_B where the design supports it and SAME_TIME where
  the measurement is a prevalence comparison. It is not BIDIRECTIONAL: the
  reviews describe the two conditions as amplifying each other, but nothing
  cited here measures incident MASLD in a coronary artery disease cohort, so the
  reverse arm is unevidenced rather than established.

disease_a:
  slug: Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease
  preferred_term: metabolic dysfunction-associated steatotic liver disease
  term:
    id: MONDO:0013209
    label: metabolic dysfunction-associated steatotic liver disease

disease_b:
  slug: Coronary_Artery_Disease
  preferred_term: coronary atherosclerosis
  term:
    id: MONDO:0021661
    label: coronary atherosclerosis

directionality: A_BEFORE_B
effect_direction: RISK

hypotheses:
- description: >-
    Endothelial dysfunction is the proposed shared lesion. In the arterial wall,
    activated endothelium retains lipoproteins and recruits leukocytes, which is
    the initiating step of the atherogenesis module. In the liver, sinusoidal
    endothelial cells lose the capacity to regulate lipid trafficking and immune
    tolerance, which promotes steatosis, inflammation and fibrosis. The claim of
    this hypothesis is not that either limb is novel — both are separately
    curated — but that they are the same lesion in two vascular beds, and
    therefore that the comorbidity has a mechanistic basis rather than only a
    shared risk-factor profile. The evidence for the unifying step is narrative
    review synthesis, not a measurement, which is why this is recorded as a
    hypothesis.
  evidence:
  - reference: PMID:42430855
    reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emerging evidence identifies endothelial dysfunction as a unifying
      pathogenic axis underlying their crosstalk.
    explanation: >-
      States the unifying claim this hypothesis records. A narrative review
      proposing an axis, so it is graded OTHER and carried as a hypothesis
      rather than as evidence for a causal edge.
  - reference: PMID:42430855
    reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In atherosclerosis, vascular endothelial dysfunction facilitates
      lipoprotein retention, leukocyte recruitment, and plaque formation.
    explanation: >-
      Gives the arterial limb of the shared lesion, which is the content of the
      atherogenesis module's first node.
  pathophysiology:
  - name: Endothelial activation across the arterial and sinusoidal beds
    description: >-
      Activated endothelium with increased leukocyte traffic and lost
      homeostatic regulation, occurring in the arterial intima and in the
      hepatic sinusoid. Curated here as the shared lesion of the pair; the
      bed-specific versions are the `atherogenesis` module's endothelial
      dysfunction node and the MASLD entry's `Liver Sinusoidal Endothelial Cell
      Dysfunction and Capillarization` node.
    biological_processes:
    - preferred_term: endothelial cell activation
      term:
        id: GO:0042118
        label: endothelial cell activation
      modifier: INCREASED
    - preferred_term: leukocyte migration
      term:
        id: GO:0050900
        label: leukocyte migration
      modifier: INCREASED
    - preferred_term: inflammatory response
      term:
        id: GO:0006954
        label: inflammatory response
      modifier: INCREASED
    evidence:
    - reference: PMID:42430855
      reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Similarly, in MASLD, liver sinusoidal endothelial cells lose their
        capacity to regulate lipid trafficking, immune tolerance, and hepatic
        homeostasis, thereby promoting steatosis, inflammation, and fibrosis.
      explanation: >-
        Gives the hepatic limb of the shared lesion, stated in the same review
        that proposes the arterial limb as its counterpart.

- description: >-
    The liver contributes to coronary atherosclerosis rather than only marking
    the metabolic state that accompanies it. The observable consequence is that
    the association survives adjustment for the traditional cardiovascular risk
    factors, and that it scales with liver disease severity — in particular with
    fibrosis stage, which is the histologic feature that tracks outcome in
    MASLD, rather than with steatosis grade. Severity scaling is what
    distinguishes a hepatic contribution from confounding by a shared metabolic
    milieu; it does not identify the mediator.
  evidence:
  - reference: PMID:34555346
    reference_title: 'Non-alcoholic fatty liver disease and risk of fatal and non-fatal cardiovascular events: an updated systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All risks were independent of age, sex, adiposity measures, diabetes, and
      other common cardiometabolic risk factors.
    explanation: >-
      Pooled across 36 longitudinal studies, the association is not accounted
      for by the adiposity and glycemic covariates that would explain it if the
      liver were only a marker.
  - reference: PMID:34555346
    reference_title: 'Non-alcoholic fatty liver disease and risk of fatal and non-fatal cardiovascular events: an updated systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This risk markedly increased across the severity of NAFLD, especially the
      stage of fibrosis (pooled random-effects HR 2·50, 95% CI 1·68-3·72;
      I2=73·84%).
    explanation: >-
      The severity gradient this hypothesis rests on, quantified against
      fibrosis stage.
  - reference: PMID:32321858
    reference_title: 'NAFLD and increased risk of cardiovascular disease: clinical associations, pathophysiological mechanisms and pharmacological implications.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A growing body of evidence also indicates that NAFLD is strongly
      associated with an increased risk of major CVD events and other cardiac
      complications (ie, cardiomyopathy, cardiac valvular calcification and
      cardiac arrhythmias), independently of traditional cardiovascular risk
      factors.
    explanation: >-
      The review's synthesis of the independence finding. Cited for framing
      alongside the meta-analytic estimate, not as a second measurement of it.

- description: >-
    The competing reading: that the association is fully attributable to the
    cardiometabolic antecedents shared by both conditions — obesity, type 2
    diabetes and dyslipidemia — with no liver-specific contribution. This is the
    alternative the severity gradient above is meant to discriminate against,
    and it is recorded because it is the default explanation for any pair of
    conditions that sit downstream of insulin resistance.
  evidence:
  - reference: PMID:42430855
    reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      MASLD not only increases cardiovascular disease incidence but also
      promotes atherosclerosis independently of traditional risk factors,
      including obesity, diabetes, and dyslipidemia.
    explanation: >-
      Names the three shared antecedents this hypothesis proposes as the whole
      explanation and states that the association persists independently of
      them, which is the sense in which the shared-antecedent reading is
      refuted. It refutes the strong form only: obesity and type 2 diabetes
      remain genuine shared antecedents of both conditions.

shared_upstream_hypotheses:
- upstream_disorder:
    slug: Obesity
    preferred_term: obesity disorder
    term:
      id: MONDO:0011122
      label: obesity disorder
  description: >-
    Obesity is a shared antecedent of both members of this pair rather than a
    step on the path between them: adipose insulin resistance is the first node
    of the MASLD entry's canonical chain, and obesity is an established risk
    state for atherosclerotic cardiovascular disease. What the evidence does not
    support is obesity as the complete explanation — the meta-analytic
    association is independent of adiposity measures — so it is recorded here as
    a common upstream contributor whose share of the association is unquantified
    by anything cited in this entry.
  evidence:
  - reference: PMID:34555346
    reference_title: 'Non-alcoholic fatty liver disease and risk of fatal and non-fatal cardiovascular events: an updated systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All risks were independent of age, sex, adiposity measures, diabetes, and
      other common cardiometabolic risk factors.
    explanation: >-
      Bounds the claim: adiposity is upstream of both conditions but does not
      account for the association between them, which is why this is a
      contributor rather than the explanation.

association_signals:
- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0013209
  signal_disorder_b_id: MONDO:0021661
  population: >-
    Meta-analysis of 24 observational studies comparing adults with MASLD
    against controls without it, with coronary plaque extent and morphology
    assessed by computed tomography coronary angiography.
  directionality: SAME_TIME
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 1.54
      metric_ci_lower: 1.23
      metric_ci_upper: 1.93
      notes: >-
        Prevalence of critical coronary stenosis in MASLD versus controls. This
        is the signal that measures disease_b directly rather than a downstream
        event.
    - metric_type: OR
      metric_value: 2.13
      metric_ci_lower: 1.42
      metric_ci_upper: 3.19
      notes: >-
        Prevalence of high-risk plaque features (low-attenuation plaque, napkin
        ring sign, spotty calcification, positive remodelling) — plaque
        morphology rather than plaque burden.
    - metric_type: OR
      metric_value: 2.26
      metric_ci_lower: 1.57
      metric_ci_upper: 3.23
      notes: Coronary artery calcium score above 100.
    evidence:
    - reference: PMID:38396359
      reference_title: 'Increased prevalence of high-risk coronary plaques in metabolic dysfunction associated steatotic liver disease patients: A meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MASLD was associated with an increased prevalence of critical coronary
        stenosis compared with controls (odds ratio [OR] 1.54, 95%CI
        1.23-1.93).
      explanation: >-
        Gives the stenosis odds ratio behind this signal, measured in the
        coronary bed and in a population defined by the current MASLD criteria
        rather than by the older NAFLD definition.
    - reference: PMID:38396359
      reference_title: 'Increased prevalence of high-risk coronary plaques in metabolic dysfunction associated steatotic liver disease patients: A meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An increased risk of 'high-risk' coronary plaques was observed in MASLD
        patients (OR 2.13, 95%CI 1.42-3.19).
      explanation: >-
        Gives the plaque-morphology odds ratio. Relevant to this pair beyond
        burden because high-risk features are what precede rupture, which is the
        atherogenesis module's terminal node.
  notes: >-
    Directionality is SAME_TIME because the included studies compare plaque
    prevalence between groups at imaging; they do not follow MASLD forward to
    incident coronary disease.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0013209
  signal_disorder_b_id: MONDO:0021661
  population: >-
    Meta-analysis of 22 studies of coronary artery calcification within a
    64-study, 172385-participant systematic review of NAFLD and subclinical
    atherosclerosis, with the association holding on stratification by Asian
    versus Western study region.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: OR
      metric_value: 1.26
      metric_ci_lower: 1.04
      metric_ci_upper: 1.52
      notes: >-
        Development or progression of coronary artery calcification — the
        longitudinal outcome, which is what makes this signal A_BEFORE_B.
    - metric_type: OR
      metric_value: 1.21
      metric_ci_lower: 1.12
      metric_ci_upper: 1.32
      notes: >-
        Presence of any coronary calcification. Cross-sectional, so it does not
        itself support the temporal ordering this signal records; kept because
        it is the same publication's estimate of prevalent disease.
    evidence:
    - reference: PMID:34933963
      reference_title: 'Association between non-alcoholic fatty liver disease and subclinical atherosclerosis in Western and Asian cohorts: an updated meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        22 studies assessed the effects of NAFLD on CAC score, with the presence
        of NAFLD associated with the presence of any coronary calcification (OR
        1.21, 95% CI 1.12 to 1.32), and the development/progression of CAC (OR
        1.26, 95% CI 1.04 to 1.52).
      explanation: >-
        Carries both metrics in this signal and separates the cross-sectional
        from the longitudinal outcome, which is the distinction the signal's
        directionality depends on.
    - reference: PMID:34933963
      reference_title: 'Association between non-alcoholic fatty liver disease and subclinical atherosclerosis in Western and Asian cohorts: an updated meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There is a significant positive association between various measures of
        subclinical atherosclerosis and NAFLD, seen across both Western and
        Asian populations.
      explanation: >-
        Supports treating the association as a general one rather than
        population-specific, which matters because MASLD prevalence and severity
        differ substantially between these regions.
  notes: >-
    Exposure is NAFLD by the pre-2023 definition, not MASLD, so the population
    is not identical to disease_a; the definitions overlap heavily but MASLD
    additionally requires a cardiometabolic risk factor. Only the coronary
    calcification arm is curated — the carotid intima-media thickness arm of the
    same review measures a different vascular bed.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0013209
  signal_disorder_b_id: MONDO:0021661
  population: >-
    Meta-analysis of 36 longitudinal observational studies, 5802226 middle-aged
    individuals (mean age 53 years) with 99668 incident fatal and non-fatal
    cardiovascular events over a median 6.5 years of follow-up.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: HR
      metric_value: 1.45
      metric_ci_lower: 1.31
      metric_ci_upper: 1.61
      notes: >-
        Pooled random-effects hazard ratio for fatal or non-fatal
        cardiovascular events; heterogeneity I-squared 86 percent.
    - metric_type: HR
      metric_value: 2.50
      metric_ci_lower: 1.68
      metric_ci_upper: 3.72
      notes: >-
        The same endpoint stratified by liver disease severity, most strongly by
        fibrosis stage. This is the severity gradient the hepatic-contribution
        hypothesis rests on.
    evidence:
    - reference: PMID:34555346
      reference_title: 'Non-alcoholic fatty liver disease and risk of fatal and non-fatal cardiovascular events: an updated systematic review and meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NAFLD was associated with a moderately increased risk of fatal or
        non-fatal CVD events (pooled random-effects HR 1·45, 95% CI 1·31-1·61;
        I2=86·18%).
      explanation: >-
        The prospective pooled estimate behind this signal, measured forward
        from liver status to incident events, which is what a directed
        A_BEFORE_B risk signal requires.
  notes: >-
    The endpoint is a composite of cardiovascular death and non-fatal
    cardiovascular events, which is broader than coronary atherosclerosis — it
    includes stroke. The hazard ratio should not be read as a coronary
    atherosclerosis effect size; the coronary-specific quantities are the
    imaging signals above. Exposure is NAFLD rather than MASLD, as with the
    calcification signal.

- source: LITERATURE
  method: LITERATURE_ASSOCIATION
  signal_disorder_a_id: MONDO:0013209
  signal_disorder_b_id: MONDO:0021661
  population: >-
    Meta-analysis of 36 cohort studies with aggregate data on approximately 18.5
    million individuals (about 25 percent with MASLD, 48 percent women, mean age
    50.2 years) and roughly 515000 fatal or non-fatal cardiovascular events over
    a median 6.9 years, analyzed for a sex difference.
  directionality: A_BEFORE_B
  effect_direction: RISK
  statistics:
    metrics:
    - metric_type: HR
      metric_value: 1.59
      metric_ci_lower: 1.44
      metric_ci_upper: 1.75
      notes: Women; p for the sex difference 0.018.
    - metric_type: HR
      metric_value: 1.37
      metric_ci_lower: 1.27
      metric_ci_upper: 1.48
      notes: Men.
    - metric_type: HR
      metric_value: 2.40
      metric_ci_lower: 1.73
      metric_ci_upper: 3.32
      notes: >-
        Women, with increasing MASLD severity — the same severity gradient the
        2021 pooled analysis found, here strongest in women.
    evidence:
    - reference: PMID:40566760
      reference_title: 'Metabolic dysfunction-associated steatotic liver disease and sex-specific risk of fatal and non-fatal cardiovascular events: A meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MASLD was associated with a higher risk of fatal or non-fatal CVD events
        in women (pooled hazard ratio [HR] 1.59, 95% confidence interval [CI]
        1.44-1.75; I2 = 96.10%) than in men (pooled HR 1.37, 95% CI 1.27-1.48;
        I2 = 96.26%) (p-value for sex difference = 0.018).
      explanation: >-
        Gives both sex-stratified hazard ratios and the test for the difference
        between them, which is what makes this a stratified signal rather than a
        restatement of the pooled estimate.
  notes: >-
    Kept as a separate signal from the 2021 pooled estimate because the
    stratification is the finding: the risk is higher in women, which the
    unstratified hazard ratio conceals. Exposure is MASLD by the current
    criteria. The endpoint is the same composite of fatal and non-fatal
    cardiovascular events, so the same breadth caveat applies.

    The sex split is recorded per metric rather than in `demographics`, whose
    `sex` slot takes a single stratum value and so cannot express one signal
    holding both arms plus the test for the difference between them.

name: com_Gastroesophageal_Reflux_Disease__Irritable_Bowel_Syndrome
creation_date: "2026-08-27T00:00:00Z"
curation_status: CANDIDATE
notes: >-
  Curated from the candidate directional edge K21 -> K58 in
  `projects/COMORBIDITIES.md` (female, phase 1.0, genetic FDR 2.10e-04, GO
  enrichment dominated by cAMP/cGMP phosphodiesterase terms). That Disease
  Trajectories edge is a prioritization pointer, not evidence, and the
  mechanistic and causal content of this entry rests entirely on the
  literature cited below.

  Directionality is A_BEFORE_B on the strength of a two-sample Mendelian
  randomization study that found genetic liability to GERD raises IBS risk with
  no reverse effect. That asymmetry is worth taking seriously precisely because
  the naive expectation for two disorders of gut-brain interaction is a
  symmetric overlap, and the community-survey data below indeed show
  co-occurrence without ordering.

  What this entry does not claim: that the reflux itself inflames the colon.
  Both mechanisms curated here are indirect — a shared central pain-processing
  trait, and an iatrogenic route through acid suppression. A direct
  oesophagus-to-bowel mechanism has not been established, and the entry should
  not be read as asserting one.


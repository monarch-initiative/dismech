name: com_Clonal_Hematopoiesis__Sepsis
creation_date: "2026-11-10T00:00:00Z"
curation_status: CURATED
notes: >-
  Directional association: clonal hematopoiesis precedes and raises the risk
  of serious bacterial infection. The source outcome is serious bacterial
  infection, defined as sepsis or bacterial pneumonia, so the pairing with
  Sepsis covers the larger part of the outcome but not bacterial pneumonia
  without sepsis. The association is graded by driver gene and clone size,
  is specific to bacterial infection (no association with viral infection),
  and also runs the other way within carriers: a serious bacterial infection
  is followed by a higher risk of hematological malignancy. Subtype detail is
  in Clonal_Hematopoiesis.yaml.

disease_a:
  slug: Clonal_Hematopoiesis

disease_b:
  slug: Sepsis

directionality: A_BEFORE_B

association_signals:
- source: LITERATURE
  method: EHR_COHORT_ASSOCIATION
  population: >-
    590,537 participants of UK Biobank, Genomics England and the Alliance for
    Genomic Discovery with linked health records, followed from blood sampling;
    individuals with a prior hematological malignancy excluded. Validated
    cross-sectionally in 889,215 individuals after adding All of Us and Mass
    General Brigham Biobank.
  directionality: A_BEFORE_B
  statistics:
    metrics:
    - metric_type: HR
      metric_value: 1.22
      p_value: 4.66e-29
      notes: >-
        Serious bacterial infection (sepsis or bacterial pneumonia) in CH
        carriers versus non-carriers, Cox model meta-analysed across the
        discovery cohorts.
    - metric_type: RR
      metric_value: 1.84
      p_value: 0.0012
      notes: 28-day mortality after serious bacterial infection in CH carriers.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CH was associated with SBI development (HR = 1.22, P = 4.66 × 10⁻²⁹) and 28-day post-infection mortality (RR = 1.84, P = 0.0012), independent of malignancy and robust to adjustment for inflammatory comorbidities and ancestry."
      explanation: >-
        Reports the hazard of serious bacterial infection and the relative risk
        of 28-day post-infection mortality in CH carriers.
  notes: >-
    Absolute risk is strongly subtype-dependent: about 25% of carriers of a
    large SRSF2 P95 clone developed infection within 10 years, against 9% for
    a large DNMT3A R882 clone.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "finding a significant (FDR < 0.05) association between CH and SBI, which includes sepsis and bacterial pneumonia"
    explanation: Defines the outcome as including sepsis and reports the association.

hypotheses:
- description: >-
    Clonal hematopoiesis impairs host defence against bacteria through altered
    hematopoietic progenitor and myeloid biology. The only current lead is a
    perturbed FLT3/FLT3 ligand axis in carrier plasma without a general
    inflammatory cytokine signature. The causal path is unestablished.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings point toward altered haematopoietic progenitor biology as a potential correlate of clonal expansion, although further mechanistic studies will be required to define causal pathways linking CH subtypes to SBI risk."
    explanation: >-
      The proteomic signal is offered as a correlate only, with the causal
      pathway to infection left open.
  pathophysiology:
  - name: Altered hematopoietic progenitor signalling
    description: >-
      Lower circulating FLT3 ligand and higher FLT3 receptor abundance in CH
      carriers, a possible correlate of impaired antibacterial defence.
    notes: >-
      No GO biological process is bound: the source measured plasma
      FLT3LG/FLT3 abundance, not progenitor differentiation, and GO has no
      FLT3 or FLT3 ligand signalling process (OLS searches "FLT3 signaling
      pathway", "FLT3", "fms-like tyrosine kinase 3 signaling").
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, classical inflammatory cytokines including IL6 and TNF were not significantly altered after correction for multiple testing."
      explanation: >-
        The carrier proteome does not show a general inflammatory cytokine
        rise, pointing away from systemic inflammation as the link.

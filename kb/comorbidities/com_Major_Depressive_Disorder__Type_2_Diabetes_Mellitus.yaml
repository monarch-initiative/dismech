hypotheses:
- description: >-
    Shared pleiotropic genetic liability, rather than either disease causing the
    other, may account for part of the co-occurrence. Genomic SEM across five
    psychiatric and three insulin-resistance-related conditions recovers a single
    latent factor on which MDD and the IR conditions load positively, and the
    multivariate GWAS of that factor implicates insulin binding and Notch
    signaling gene sets, the chr16p11.2 region, BDNF signaling, and lipid
    metabolism, with gene-property signal in cerebellum, cortex, and pituitary
    that is strongest prenatally. This is a cross-condition factor result: it
    does not establish that any specific locus is shared between MDD and type 2
    diabetes, which would require local genetic correlation and colocalization
    for this pair.
  evidence:
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Gene-set associations included insulin binding and Notch-signaling pathways, while gene-property analyses implicated the cerebellum, brain cortex, and pituitary gland, notably during prenatal development."
    explanation: >-
      Names the biological processes and tissues enriched in the shared-factor
      GWAS, including a neurodevelopmental timing signal.
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Enrichment of prioritized genes highlighted the chr16p11.2 region, BDNF-signaling, and lipid metabolism pathways."
    explanation: >-
      Nominates specific candidate loci and pathways for a shared-liability
      mechanism linking the psychiatric and metabolic arms.
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Positive loadings were observed for ADHD, MDD, and IR-related conditions and negative loadings for AN and OCD."
    explanation: >-
      MDD and the IR conditions share the sign of the loading, but the opposite
      loadings for anorexia nervosa and OCD show the factor is not a general
      psychiatric-risk axis, so it cannot be transferred to other pairs unexamined.
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Transcriptome-wide SEM (T-SEM) assessed tissue-specific gene expression associations and identified 499 genes (191 novel), including immune-related genes within the major histocompatibility complex (MHC) region."
    explanation: >-
      Adds an immune arm to the shared-liability hypothesis; MHC signal in a
      psychiatric multivariate GWAS is difficult to fine-map and is reported here
      as a lead rather than an identified mediator.

- description: >-
    Adiposity and obesity-mediated insulin resistance may lie on the causal path
    between the two conditions rather than merely confounding it. Multivariable
    Mendelian randomization conditioning on BMI attenuates the relationship in
    both directions and most strongly from MDD to type 2 diabetes; genetic
    liability to MDD raises the TG:HDL-C insulin-resistance ratio in people
    without diabetes; and among mechanistically clustered type 2 diabetes
    variants it is the body-fat and obesity-mediated insulin-resistance clusters
    that carry the effect on MDD. Consistent with mediation rather than pure
    confounding, the observational depression-to-diabetes estimate is attenuated
    but not abolished by adjustment for adiposity.
  evidence:
  - reference: PMID:40595333
    reference_title: "Evidence of bidirectional relationship between type 2 diabetes and depression; a Mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "MVMR with BMI attenuated the bidirectional relationship between MDD and T2D, particularly from MDD to T2D."
    explanation: >-
      BMI accounts for a substantial share of the genetically instrumented effect
      in both directions.
  - reference: PMID:40595333
    reference_title: "Evidence of bidirectional relationship between type 2 diabetes and depression; a Mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Genetic liability to MDD was also associated with higher TG:HDL-C ratio in individuals without T2D"
    explanation: >-
      Places an insulin-resistance readout downstream of MDD liability before
      diabetes onset, which is what a mediating pathway predicts.
  - reference: PMID:40595333
    reference_title: "Evidence of bidirectional relationship between type 2 diabetes and depression; a Mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "T2D GWAS derived clusters of genetic variants highlighted the importance of specific pathways in the MDD relationship, including variants raising T2D risk via body fat (OR:1.04; 95% CI:1.02, 1.06), obesity mediated insulin resistance (OR:1.06; 95% CI:1.04, 1.09) and residual glycaemic (OR: 1.02; 95% CI:1.00, 1.04) pathways."
    explanation: >-
      Partitions the diabetes-to-MDD effect by mechanism, with the adiposity and
      obesity-mediated insulin-resistance clusters carrying most of it.
  - reference: PMID:19033418
    reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the most-adjusted (all 13 of which adjusted for adiposity) RR was 1.40 (1.21–1.61)"
    explanation: >-
      Residual association after adiposity adjustment argues against adiposity
      being the whole explanation, while the attenuation argues it carries part
      of it.

- description: >-
    Health behavior, pharmacological treatment, and ascertainment may explain part
    of the association without any shared biological mediator. Depression is
    associated with smoking, physical inactivity, and caloric intake, each an
    independent diabetes risk factor; antidepressant exposure is associated with
    elevated rather than reduced diabetes risk, most plausibly through confounding
    by indication; and the diabetes-to-depression direction is not robust to
    excluding short follow-up, so prodromal metabolic disease and
    diagnosis-related surveillance are not excluded.
  evidence:
  - reference: PMID:19033418
    reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Depression is associated with poor health behaviors (i.e., smoking, physical inactivity, caloric intake) that increase risk of type 2 diabetes"
    explanation: >-
      Names a non-biological route from depression to diabetes that competes with
      a shared-mechanism explanation.
  - reference: PMID:19033418
    reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "there is suggestive evidence that antidepressant use is associated with elevated, not lowered, risk of diabetes, possibly an example of confounding by indication"
    explanation: >-
      Treatment exposure tracks with rather than against diabetes risk, so
      treatment and indication cannot be separated in the observational estimates.
  - reference: PMID:19033418
    reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After excluding these studies, diabetes was no longer a significant predictor of depression (RR 1.09, 95% CI 0.96–1.25)"
    explanation: >-
      The weaker direction depends on samples with short follow-up, which is what
      prodromal detection or ascertainment bias would produce.

shared_upstream_hypotheses:
- upstream_disorder:
    slug: Obesity
    preferred_term: obesity disorder
    term:
      id: MONDO:0011122
      label: obesity disorder
  description: >-
    Obesity is the leading candidate for an upstream condition contributing to
    both members of this pair rather than sitting on a single directional path.
    It is one of the three insulin-resistance conditions loading on the shared
    Psych-IR genetic factor alongside MDD, and conditioning on BMI in
    multivariable Mendelian randomization attenuates the MDD-T2DM relationship in
    both directions. Distinguishing an upstream common cause from a mediator here
    needs designs that the current evidence does not supply.
  evidence:
  - reference: PMID:40595333
    reference_title: "Evidence of bidirectional relationship between type 2 diabetes and depression; a Mendelian randomization study."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "MVMR with BMI attenuated the bidirectional relationship between MDD and T2D, particularly from MDD to T2D."
    explanation: >-
      Attenuation in both directions on conditioning is consistent with BMI acting
      upstream of the pair, though it does not distinguish that from mediation.
  - reference: PMID:42435748
    reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Genomic structural equation modeling (SEM) was applied to genome-wide association studies (GWAS) from five psychiatric disorders (attention-deficit/hyperactivity disorder (ADHD), anorexia nervosa (AN), major depressive disorder (MDD), obsessive-compulsive disorder (OCD), schizophrenia) and three IR-related conditions (MetS, obesity, T2DM)"
    explanation: >-
      Obesity enters the shared-factor model as one of the insulin-resistance
      conditions rather than as a covariate, so its liability is part of what the
      factor captures.

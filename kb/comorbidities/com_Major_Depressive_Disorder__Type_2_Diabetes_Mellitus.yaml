literature_evidence:
- reference: PMID:19033418
  reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "The pooled relative risk (RR) for incident depression associated with baseline diabetes was 1.15 (95% CI 1.02-1.30). The RR for incident diabetes associated with baseline depression was 1.60 (1.37-1.88)."
  explanation: >-
    Meta-analysis of prospective cohorts that excluded prevalent cases in each
    direction, establishing both arms of the association and their asymmetry.
- reference: PMID:19033418
  reference_title: "Depression and type 2 diabetes over the lifespan: a meta-analysis."
  supports: PARTIAL
  evidence_source: HUMAN_CLINICAL
  snippet: "Depression is associated with a 60% increased risk of type 2 diabetes. Type 2 diabetes is associated with only modest increased risk of depression."
  explanation: >-
    The authors' own reading of the asymmetry; the diabetes-to-depression arm is
    explicitly characterized as modest rather than established.
- reference: PMID:40595333
  reference_title: "Evidence of bidirectional relationship between type 2 diabetes and depression; a Mendelian randomization study."
  supports: SUPPORT
  evidence_source: COMPUTATIONAL
  snippet: "Our results demonstrated that a doubling in MDD genetic liability was associated with 1.14 higher odds of T2D (95% CI:1.09, 1.19), whilst a doubling in T2D genetic liability associated with 1.02 higher odds of MDD (95% CI:1.01, 1.03)."
  explanation: >-
    Genetically instrumented bidirectional effects support a causal reading of
    both arms and reproduce the epidemiological asymmetry.
- reference: PMID:42435748
  reference_title: "The multivariate genetic architecture of psychiatric and insulin resistance multimorbidity."
  supports: PARTIAL
  evidence_source: COMPUTATIONAL
  snippet: "Positive loadings were observed for ADHD, MDD, and IR-related conditions and negative loadings for AN and OCD."
  explanation: >-
    Places MDD and the insulin-resistance conditions on the same side of a shared
    latent genetic factor, but as part of an eight-condition joint model rather
    than a pair-specific analysis.


name: com_Major_Depressive_Disorder__Type_2_Diabetes_Mellitus
creation_date: '2026-08-14T00:00:00Z'
curation_status: CURATED
notes: >-
  The epidemiology of this pair is asymmetric and the two directions should not
  be quoted as if they were one effect: prospective cohort meta-analysis puts
  incident type 2 diabetes after depression at RR 1.60, but incident depression
  after type 2 diabetes at only RR 1.15, and that weaker direction lost
  significance entirely when short-follow-up samples were excluded. Bidirectional
  Mendelian randomization reproduces the same asymmetry on the genetic-liability
  scale (OR 1.14 vs OR 1.02) and shows that multivariable adjustment for BMI
  attenuates both directions, so adiposity is a candidate mediator rather than a
  nuisance covariate.

  This entry was opened from the psychiatric-insulin-resistance multimorbidity
  genomic-SEM study (issue #6399). Two features of that study constrain how its
  Psych-IR latent factor may be read here. First, the factor is estimated jointly
  over eight conditions, so a positive loading for MDD and for the IR-related
  conditions is evidence of shared liability across the whole set, not evidence of
  MDD-T2DM-specific pleiotropy; locus-level colocalization for this pair
  specifically has not been done. Second, the factor is not a uniform "psychiatric
  risk" axis - anorexia nervosa and obsessive-compulsive disorder load negatively
  and schizophrenia is excluded from it altogether - so it must not be reused to
  assert a positive metabolic comorbidity for those disorders. The remaining
  psychiatric-IR pairs implied by that paper (notably ADHD-obesity and
  ADHD-T2DM, which also load positively) are follow-up curation targets, not
  content that this pairwise entry covers.

  Behavioral, treatment, and surveillance explanations remain live. Depression is
  associated with smoking, physical inactivity, and caloric intake, all
  independent diabetes risk factors, and antidepressant exposure is itself
  associated with elevated rather than lowered diabetes risk, which the source
  meta-analysis reads as probable confounding by indication.


name: Mechanisms of the Epilepsies
creation_date: "2026-09-10T00:00:00Z"
description: >-
  The mechanism modules that upstream epilepsy entries reach on their way to
  recurrent seizures. Epilepsy is not one mechanism: distinct lesions in
  inhibitory-interneuron development, presynaptic vesicle release, postsynaptic
  scaffolding, cortical growth signaling, and repeat-RNA toxicity each drive a
  different route to the same endpoint, and each has its own treatment logic.
  The collection groups those upstream lanes together with the shared
  excitation-inhibition convergence module they feed. Membership records that a
  module is an evidenced route to seizures in at least one curated DisMech
  entry; it does not claim the lanes are exhaustive or mutually exclusive, and
  a single disorder commonly conforms to the convergence module plus one lane.
collection_type: MECHANISTIC_FAMILY
module_members:
- module: epilepsy_excitation_inhibition_imbalance
  framework_terms:
  - Network hyperexcitability
  description: >-
    The convergence point rather than a lane: ion-channel or synaptic
    dysfunction shifts excitation and inhibition toward excitation, producing
    hypersynchronous firing and recurrent seizures. Every other member feeds
    this chain, and it carries by far the most conformers in the KB.
- module: interneuron_specification_tangential_migration_failure
  framework_terms:
  - GABAergic interneuron developmental failure
  description: >-
    The developmental-inhibitory lane: subpallial lineage programs fail, cortical
    GABAergic interneurons are absent or mislocalized, and the resulting
    interneuronopathy produces developmental epilepsy.
- module: synaptic_vesicle_cycle
  framework_terms:
  - Presynaptic vesicle-release synaptopathy
  description: >-
    The presynaptic lane: defects in vesicle docking, priming, calcium-triggered
    fusion, or endocytosis impair neurotransmitter release. It is the module
    behind the STXBP1, SNAP25, STX1B, SYN1, CPLX1, DNM1, and UNC13A entries.
- module: excitatory_synapse_scaffold_disruption
  framework_terms:
  - Postsynaptic scaffold synaptopathy
  description: >-
    The postsynaptic lane: loss of a core postsynaptic-density organizer
    disorganizes the excitatory synapse and perturbs glutamate-receptor
    localization, an excitation-inhibition imbalance route distinct from the
    presynaptic one.
- module: pi3k_akt_mtor_cortical_overgrowth
  framework_terms:
  - mTOR-pathway malformation of cortical development
  description: >-
    The structural lane: constitutive PI3K-AKT-mTOR activation in neural
    progenitors, frequently post-zygotic, produces the epileptogenic cortical
    dysplasia that underlies drug-resistant focal epilepsy and is the rationale
    for mTOR-inhibitor therapy.
- module: fame_pentanucleotide_repeat_rna_toxicity
  framework_terms:
  - Repeat-RNA cortical hyperexcitability
  description: >-
    The repeat-expansion lane: intronic TTTCA-containing pentanucleotide
    expansions across unrelated host genes converge on UUUCA repeat RNA
    toxicity, cerebellocortical dysfunction, and cortical hyperexcitability.
    Included because it is a mechanistically independent route to seizures, not
    because it is pediatric; familial adult myoclonus epilepsy is adult-onset.
evidence:
- reference: PMID:41014440
  reference_title: "Pathophysiological Mechanisms Fostering Developmental and Epileptic Encephalopathies (DEE): a Complex Interplay between Genetics, Inflammation and Neurodegeneration."
  supports: SUPPORT
  evidence_source: OTHER
  snippet: >-
    Furthermore, genetic defects affecting ion currents and cellular osmolarity,
    cytoskeletal structure and integrity of myelinated axons, neuronal
    morphology, and purine metabolism have been found to underlie DEE with
    progressive course.
  explanation: >-
    States the organizing premise of this collection: mechanistically unrelated
    classes of lesion underlie the epileptic encephalopathies, so the mechanism
    layer needs several distinct modules rather than one.
notes: >-
  This is a navigation and framework record, not a mechanism module or disease
  grouping, and it is deliberately not a pediatric-only collection: mechanism
  lanes are shared across ages, and age at onset is a property of the disease
  entries (see the ILAE 2022 age-at-onset groups used in
  research/pediatric_epilepsy_census.md). Membership is limited to modules whose
  own node chain terminates in seizures or in excitation-inhibition imbalance.
  Modules that recur in epilepsy entries for other reasons are excluded on
  purpose: glutamate_excitotoxicity ends in neuronal death rather than
  epileptogenesis, metabolic_intoxication_decompensation ends in acute
  encephalopathy, and epigenetic_machinery_neurodevelopmental_dysregulation and
  congenital_disorder_of_glycosylation are general neurodevelopmental modules in
  which seizures are one output among many. Several lanes the KB curates as
  prose but not yet as modules have no member here; they are enumerated as gaps
  in docs/reports/pediatric-epilepsy-census-2026-09-10.md.

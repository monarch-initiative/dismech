name: Hallmarks of Aging
creation_date: "2026-08-31T19:47:35Z"
description: >-
  The twelve interconnected hallmarks of aging proposed by López-Otín and
  colleagues in the 2023 expansion of the framework, represented by eleven
  DisMech mechanism modules. The inflammaging module intentionally covers both
  altered intercellular communication and chronic inflammation because it
  models their shared systemic inflammatory convergence.
collection_type: PUBLISHED_FRAMEWORK
module_members:
- module: genomic_instability_aging
  framework_terms:
  - Genomic instability
- module: telomere_attrition
  framework_terms:
  - Telomere attrition
- module: epigenetic_alterations
  framework_terms:
  - Epigenetic alterations
- module: loss_of_proteostasis
  framework_terms:
  - Loss of proteostasis
- module: disabled_macroautophagy
  framework_terms:
  - Disabled macroautophagy
- module: deregulated_nutrient_sensing
  framework_terms:
  - Deregulated nutrient-sensing
- module: mitochondrial_dysfunction
  framework_terms:
  - Mitochondrial dysfunction
- module: cellular_senescence
  framework_terms:
  - Cellular senescence
- module: stem_cell_exhaustion
  framework_terms:
  - Stem cell exhaustion
- module: inflammaging
  framework_terms:
  - Altered intercellular communication
  - Chronic inflammation
  description: >-
    The framework separates these as two hallmarks; the DisMech module combines
    them at the chronic sterile inflammation and systemic cytokine-signaling
    convergence point commonly termed inflammaging.
- module: gut_dysbiosis
  framework_terms:
  - Dysbiosis
evidence:
- reference: PMID:36599349
  reference_title: "Hallmarks of aging: An expanding universe."
  supports: SUPPORT
  evidence_source: OTHER
  snippet: >-
    We propose the following twelve hallmarks of aging: genomic instability,
    telomere attrition, epigenetic alterations, loss of proteostasis, disabled
    macroautophagy, deregulated nutrient-sensing, mitochondrial dysfunction,
    cellular senescence, stem cell exhaustion, altered intercellular
    communication, chronic inflammation, and dysbiosis.
  explanation: >-
    Defines the published framework and supplies the labels represented by this
    module collection.
notes: >-
  This is a navigation and framework record, not a mechanism module or disease
  grouping. Membership records which DisMech module represents each published
  hallmark; it does not imply that the modules form one linear causal chain.

name: Hallmarks of Cancer
creation_date: "2026-08-31T23:28:48Z"
description: >-
  The six hallmark capabilities, two emerging hallmarks, and two enabling
  characteristics described by Hanahan and Weinberg in the 2011 framework,
  represented by ten DisMech mechanism modules.
collection_type: PUBLISHED_FRAMEWORK

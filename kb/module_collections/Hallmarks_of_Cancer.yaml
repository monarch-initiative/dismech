evidence:
- reference: PMID:21376230
  reference_title: "Hallmarks of cancer: the next generation."
  supports: SUPPORT
  evidence_source: OTHER
  snippet: >-
    The hallmarks of cancer comprise six biological capabilities acquired
    during the multistep development of human tumors. The hallmarks constitute
    an organizing principle for rationalizing the complexities of neoplastic
    disease.
  explanation: >-
    Defines the published organizing framework whose capabilities and enabling
    characteristics are represented by this collection.
- reference: PMID:35022204
  reference_title: "Hallmarks of Cancer: New Dimensions."
  supports: SUPPORT
  evidence_source: OTHER
  quote_role: REVIEW_SYNTHESIS
  snippet: >-
    Herein, the prospect is raised that phenotypic plasticity and disrupted
    differentiation is a discrete hallmark capability, and that nonmutational
    epigenetic reprogramming and polymorphic microbiomes both constitute
    distinctive enabling characteristics that facilitate the acquisition of
    hallmark capabilities.
  explanation: >-
    Names three of the four dimensions proposed in the 2022 update, which this
    collection deliberately does not yet represent; the notes record the
    specific blocker for each.
- reference: PMID:35022204
  reference_title: "Hallmarks of Cancer: New Dimensions."
  supports: SUPPORT
  evidence_source: OTHER
  quote_role: REVIEW_SYNTHESIS
  snippet: >-
    Additionally, senescent cells, of varying origins, may be added to the
    roster of functionally important cell types in the tumor microenvironment.
  explanation: >-
    The fourth dimension, and the reason neither existing senescence module
    fits it: the paper adds senescent cells as tumor-promoting constituents of
    the microenvironment, not as the tumor-suppressive arrest that the
    cancer-scoped senescence module represents.
notes: >-
  This collection represents the 2011 framework. The additional dimensions
  proposed in the 2022 update are not included until each has a dedicated,
  correctly scoped mechanism module. This is a navigation and framework record,
  not a mechanism module or disease grouping; membership does not imply that
  the modules form one linear causal chain.

  Why each 2022 dimension is still out, checked 2026-10-08 against the module
  directory, so the deferral names a blocker rather than restating a policy.
  Phenotypic plasticity and disrupted differentiation has no module at all;
  the nearest content is scattered across the lineage-specific developmental
  modules, none of which models plasticity as a cancer capability.
  Nonmutational epigenetic reprogramming is not `epigenetic_alterations`,
  which is the aging-hallmark module for age-associated epigenetic drift, nor
  `epigenetic_machinery_neurodevelopmental_dysregulation`, which models
  germline chromatin-machinery lesions in development; a cancer-scoped module
  would be a third thing. Polymorphic microbiomes is not `gut_dysbiosis`,
  which is likewise the aging-hallmark module and is scoped to inflammaging
  rather than to tumor promotion. Senescent cells is the subtlest of the
  four: dismech has two senescence modules, and neither fits. The 2022 paper
  adds senescent cells as tumor-promoting constituents of the
  microenvironment, which is the deleterious SASP arm modelled by
  `cellular_senescence` under the aging framework, whereas the cancer-scoped
  `senescence_tumor_suppression` models the opposite, protective arm.
  Admitting either would misstate the paper, so this collection admits
  neither.

  Each of the four therefore needs a new, cancer-scoped module rather than a
  membership row pointing at an aging module, and that is the work this note
  records.

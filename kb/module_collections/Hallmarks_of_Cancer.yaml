name: Hallmarks of Cancer
creation_date: "2026-08-31T23:28:48Z"
description: >-
  The six hallmark capabilities, two emerging hallmarks, and two enabling
  characteristics described by Hanahan and Weinberg in the 2011 framework,
  represented by ten DisMech mechanism modules.
collection_type: PUBLISHED_FRAMEWORK
module_members:
- module: sustaining_proliferative_signaling
  framework_terms:
  - Sustaining proliferative signaling
- module: evading_growth_suppressors
  framework_terms:
  - Evading growth suppressors
- module: resisting_cell_death
  framework_terms:
  - Resisting cell death
- module: enabling_replicative_immortality
  framework_terms:
  - Enabling replicative immortality
- module: tumor_angiogenesis
  framework_terms:
  - Inducing angiogenesis
- module: invasion_and_metastasis
  framework_terms:
  - Activating invasion and metastasis
- module: deregulated_cellular_energetics
  framework_terms:
  - Reprogramming energy metabolism
- module: immune_checkpoint_blockade
  framework_terms:
  - Evading immune destruction
  description: >-
    Represents checkpoint-mediated tumor immune evasion together with the
    treatment mechanism that reverses it.
- module: genome_instability_mutation
  framework_terms:
  - Genome instability and mutation
- module: tumor_promoting_inflammation
  framework_terms:
  - Tumor-promoting inflammation
evidence:
- reference: PMID:21376230
  reference_title: "Hallmarks of cancer: the next generation."
  supports: SUPPORT
  evidence_source: OTHER
  snippet: >-
    The hallmarks of cancer comprise six biological capabilities acquired
    during the multistep development of human tumors. The hallmarks constitute
    an organizing principle for rationalizing the complexities of neoplastic
    disease.
  explanation: >-
    Defines the published organizing framework whose capabilities and enabling
    characteristics are represented by this collection.
notes: >-
  This collection represents the 2011 framework. The additional dimensions
  proposed in the 2022 update are not included until each has a dedicated,
  correctly scoped mechanism module. This is a navigation and framework record,
  not a mechanism module or disease grouping; membership does not imply that
  the modules form one linear causal chain.

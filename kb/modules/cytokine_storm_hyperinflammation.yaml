name: Cytokine Storm Hyperinflammation Module
description: >-
  A conserved pathophysiology module representing systemic hyperinflammation -
  cytokine storm - the life-threatening state in which host cytokine output
  escapes negative regulation and becomes the proximate cause of organ injury,
  independently of whatever provoked it. A massive or unresolvable immune
  trigger (an overwhelming PAMP burst in sepsis, engineered T-cell engagement of
  tumour antigen in CAR-T cytokine release syndrome, or failed perforin-mediated
  killing that leaves antigen-presenting cells alive and stimulating in
  haemophagocytic lymphohistiocytosis) drives monocytes and macrophages into a
  self-amplifying cytokine loop. IL-6 is the dominant systemic mediator of that
  loop; the resulting storm activates endothelium throughout the vasculature,
  degrading barrier function to produce capillary leak, vasodilatory hypotension
  and consumptive coagulopathy, and terminates in shock and multiorgan
  dysfunction. Conforming disorder nodes substitute the disease-specific trigger
  while preserving the conserved myeloid-amplification, IL-6-storm, and
  endothelial-injury chain. Note the corollary: a disease may conform at the
  trigger node without conforming at the amplifier, because the cytokine axis it
  amplifies through may not be this one. Haemophagocytic lymphohistiocytosis is
  exactly that case - its trigger (failed perforin-mediated killing) is modelled
  here, but its amplification runs through IFN-gamma, which is why the agent
  approved for primary HLH is anti-IFN-gamma (emapalumab) rather than an
  IL-6-axis drug. It therefore conforms at the trigger only, and an IFN-gamma
  amplification arm would be a separate module rather than a widening of this
  one. Carries the IL-6-axis blockade drug pattern:
  tocilizumab uses `target_mechanisms` with INHIBITS against the central
  effector node. Key conformance target:
  `cytokine_storm_hyperinflammation#IL-6-Driven Systemic Cytokine Storm`.
  Deliberately scoped to the myeloid IL-6 / endothelial arm so that it stays
  complementary to, rather than overlapping with, its neighbours: the type I
  interferon arm of innate antiviral defence belongs to
  `innate_antiviral_interferon_response`, the IL-1/inflammasome arm of the same
  storm is modelled separately (currently within
  `gout_urate_crystal_inflammation`), the age-associated low-grade version is
  `inflammaging`, and the downstream coagulation lesion is `thrombogenesis`.
  This module covers acute, systemic, life-threatening hyperinflammation only -
  chronic tissue-restricted inflammation is out of scope by design.
category: Module
creation_date: "2026-08-18T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "cytokine_storm_hyperinflammation#IL-6-Driven Systemic Cytokine Storm"). The
  module defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding cell types, biological
  processes, and causal edges, specialized to their disease context. Key
  disease-specific substitutions at the trigger node: sepsis substitutes an
  overwhelming pathogen-associated molecular pattern load with failure of the
  compensatory anti-inflammatory response; CAR-T cytokine release syndrome
  substitutes engineered T-cell engagement of tumour antigen with consequent
  monocyte activation; primary haemophagocytic lymphohistiocytosis and
  macrophage activation syndrome substitute impaired lymphocyte cytotoxicity
  (PRF1, UNC13D, STX11, STXBP2), in which failure to kill antigen-presenting
  cells removes the normal termination signal for T-cell and macrophage
  activation; severe viral pneumonitis substitutes sustained viral antigen load.
  The distinction that makes this a single module rather than a grouping is that
  all of these converge on unrestrained myeloid cytokine output, not merely on a
  shared clinical picture. Individual cytokines and their receptors are
  described in prose; modules bind GO and CL terms only and do not use chemical
  (CHEBI) or protein term bindings.
pathophysiology:
- name: Uncontrolled Immune Activation Trigger
  description: >-
    An immune stimulus that is either too large to be cleared proportionately or
    cannot be terminated. Three routes converge here. In sepsis, a systemic
    pathogen load presents an overwhelming quantity of pathogen-associated
    molecular patterns. In cytokine release syndrome, adoptively transferred
    engineered T cells engage tumour antigen at high burden and activate
    bystander myeloid cells. In haemophagocytic lymphohistiocytosis, the trigger
    is a defect in the killing machinery itself: impaired perforin- or
    granule-mediated cytotoxicity leaves antigen-presenting cells alive, so the
    activating stimulus is never removed and lymphocyte-macrophage activation
    continues without a termination signal. What is shared is not the stimulus
    but the loss of proportionality between stimulus and response.
  role: trigger
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: T Cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:33264547
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cytokine storm and cytokine release syndrome are life-threatening systemic
      inflammatory syndromes involving elevated levels of circulating cytokines
      and immune-cell hyperactivation that can be triggered by various therapies,
      pathogens, cancers, autoimmune conditions, and monogenic disorders.
    explanation: >-
      Establishes the multiplicity of triggers converging on one systemic
      syndrome, which is precisely what this trigger node abstracts over.
      Evidence source is OTHER because this is a narrative review.
  - reference: PMID:26461150
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Functional impairment or absence of 1 or more of several proteins that
      participate in lymphocyte cytotoxicity underlies the disease.
    explanation: >-
      Supports the impaired-cytotoxicity route into this node, the substitution a
      conforming familial haemophagocytic lymphohistiocytosis entry makes at the
      trigger. Evidence source is OTHER because this is a review.
  - reference: PMID:28555385
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sepsis is a severe clinical syndrome related to the host response to
      infection.
    explanation: >-
      Frames sepsis as a disorder of the host response rather than of the
      pathogen directly, supporting its entry at this trigger node. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Unrestrained Myeloid Cytokine Amplification

- name: Unrestrained Myeloid Cytokine Amplification
  description: >-
    Monocytes and macrophages are the dominant amplifying compartment. Activated
    through pattern-recognition receptors or by contact with activated T cells,
    they produce IL-6, IL-1 and TNF; these cytokines in turn recruit and activate
    further myeloid cells, which produce more cytokine. The loop is
    autoamplifying, so output rises disproportionately to the initiating signal
    rather than tracking it. Experimental depletion of monocytes prevents the
    syndrome, establishing this compartment as necessary rather than merely
    correlated.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Positive Regulation of Interleukin-6 Production
    term:
      id: GO:0032755
      label: positive regulation of interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:28555385
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The severity of infections is due to an activation cascade that will lead
      to an autoamplifying cytokine production: the cytokine storm.
    explanation: >-
      States the autoamplifying character of cytokine production that defines
      this node, and attributes severity to it rather than to the pathogen.
      Evidence source is OTHER because this is a review.
  - reference: PMID:29808007
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Human monocytes were the major source of IL-1 and IL-6 during CRS.
      Accordingly, the syndrome was prevented by monocyte depletion or by
      blocking IL-6 receptor with tocilizumab.
    explanation: >-
      Causal evidence that monocytes are the amplifying source and that removing
      them prevents the syndrome, supporting this node as necessary to the chain.
      Evidence source is MODEL_ORGANISM because the depletion experiments were
      performed in humanized mice.
  downstream:
  - target: IL-6-Driven Systemic Cytokine Storm

- name: IL-6-Driven Systemic Cytokine Storm
  description: >-
    Cytokine production escapes local control and becomes systemic, with IL-6 as
    the dominant circulating mediator acting on distant tissues through both
    classical and trans-signalling. At this point the cytokine response, not the
    inciting trigger, is the proximate cause of illness: fever, acute-phase
    response, and the systemic effects that follow are driven by the mediators
    themselves. This is the disorder-agnostic, rate-limiting step of the module -
    every conforming disease funnels through it whatever its trigger - and it is
    the step at which IL-6-axis blockade acts, making it the key conformance
    target.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Interleukin-6 Production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:29808007
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In humanized mice with high leukemia burden, CAR T cell-mediated clearance
      of cancer triggered high fever and elevated IL-6 levels, which are
      hallmarks of CRS.
    explanation: >-
      Identifies elevated systemic IL-6 with fever as the hallmark of the storm
      state modelled at this node. Evidence source is MODEL_ORGANISM because
      these are humanized mouse experiments.
  - reference: PMID:33264547
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recognition that the immune response to the pathogen, but not the pathogen
      itself, can contribute to multiorgan dysfunction and that similar cytokine
      storm syndromes could occur with no obvious infection led to the
      investigation of immunomodulators and cytokine-directed therapies.
    explanation: >-
      Supports the defining claim of this node - that the immune response rather
      than the trigger causes organ dysfunction - and the therapeutic logic of
      targeting it. Evidence source is OTHER because this is a narrative review.
  downstream:
  - target: Endothelial Activation and Capillary Leak

- name: Endothelial Activation and Capillary Leak
  description: >-
    Circulating cytokines act on vascular endothelium throughout the body. The
    endothelium is both a target and a further source of cytokines, so its
    activation extends the storm. Activated endothelium loses barrier integrity,
    producing capillary leak with interstitial oedema and intravascular volume
    depletion; loses vasomotor tone, producing distributive hypotension; and
    loses thromboresistance, producing microvascular thrombosis and consumptive
    coagulopathy. This is the step that converts a circulating cytokine
    abnormality into distributed tissue hypoperfusion.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Regulation of Vascular Permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28555385
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      New promising therapeutic strategies focusing on the endothelium, as a
      source and a target of cytokines, are described.
    explanation: >-
      Supports the endothelium's dual role as both target and source of
      cytokines, the amplifying property that makes this a distinct effector
      node rather than a passive downstream consequence. Evidence source is
      OTHER because this is a review.
  - reference: PMID:26903338
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Septic shock should be defined as a subset of sepsis in which particularly
      profound circulatory, cellular, and metabolic abnormalities are associated
      with a greater risk of mortality than with sepsis alone.
    explanation: >-
      Consensus definition establishing profound circulatory and cellular
      abnormality as the distinguishing, high-mortality step downstream of the
      systemic response, corresponding to this node. Evidence source is OTHER
      because this is an expert consensus task force report.
  downstream:
  - target: Shock and Multiorgan Dysfunction

- name: Shock and Multiorgan Dysfunction
  description: >-
    The clinical endpoint of the chain: vasodilatory and capillary-leak shock
    with tissue hypoperfusion, progressing to dysfunction of organs remote from
    any site of infection or tumour - acute kidney injury, acute respiratory
    distress, hepatic dysfunction, encephalopathy and disseminated intravascular
    coagulation. Organ failure here is a consequence of the host response, which
    is why it occurs in sterile triggers such as CAR-T cytokine release syndrome
    and familial haemophagocytic lymphohistiocytosis exactly as it does in
    sepsis.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26903338
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sepsis should be defined as life-threatening organ dysfunction caused by a
      dysregulated host response to infection.
    explanation: >-
      The consensus definition places life-threatening organ dysfunction as the
      consequence of a dysregulated host response, exactly the terminal node of
      this module. Evidence source is OTHER because this is an expert consensus
      task force report.
  - reference: PMID:26461150
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Familial hemophagocytic lymphohistiocytosis (FHL) is a rare heritable
      disorder of immune regulation that is typically characterized by sudden
      onset of severe systemic illness.
    explanation: >-
      Documents severe systemic illness as the consequence in a sterile,
      genetically triggered conforming disorder, supporting that this endpoint is
      driven by immune dysregulation rather than by infection. Evidence source is
      OTHER because this is a review.
treatments:
- name: IL-6 Axis Blockade (Tocilizumab)
  description: >-
    Tocilizumab is a humanized monoclonal antibody against the IL-6 receptor
    that blocks both classical and trans IL-6 signalling, interrupting the storm
    at its dominant systemic mediator. It is the established treatment for
    CAR-T-associated cytokine release syndrome. Its limits are as informative as
    its successes and should be preserved by conforming entries rather than
    smoothed over: IL-6 blockade does not address the IL-1-driven component, and
    in the humanized-mouse model it failed to prevent delayed neurotoxicity that
    IL-1 receptor antagonism did prevent - evidence that the storm has parallel
    arms and that this module's IL-6 arm is one of them. Represents the
    IL-6-axis-blockade drug-target design pattern for conforming disorders.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: IL-6-Driven Systemic Cytokine Storm
    treatment_effect: INHIBITS
    description: >-
      Blocking the IL-6 receptor interrupts the dominant systemic mediator of the
      storm at the module's rate-limiting central effector node, preventing
      progression to endothelial activation and shock.
  evidence:
  - reference: PMID:29808007
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Accordingly, the syndrome was prevented by monocyte depletion or by
      blocking IL-6 receptor with tocilizumab.
    explanation: >-
      Demonstrates that IL-6 receptor blockade prevents the syndrome, validating
      the drug target at the central effector node. Evidence source is
      MODEL_ORGANISM because the intervention was tested in humanized mice.
  - reference: PMID:29808007
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, tocilizumab failed to protect mice from delayed lethal
      neurotoxicity, characterized by meningeal inflammation. Instead, the IL-1
      receptor antagonist anakinra abolished both CRS and neurotoxicity,
      resulting in substantially extended leukemia-free survival.
    explanation: >-
      Partial support: IL-6 blockade controls the storm but not the parallel
      IL-1-driven neurotoxicity, which IL-1 receptor antagonism does. Recorded
      as PARTIAL to keep the module honest about the limits of the IL-6 arm and
      to mark the IL-1 arm as a distinct mechanism. Evidence source is
      MODEL_ORGANISM because these are humanized mouse experiments.
  - reference: PMID:33264547
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One of the earliest targeted therapies for abrogation of a cytokine storm
      was the anti–interleukin-6 receptor monoclonal antibody tocilizumab
    explanation: >-
      Establishes anti-IL-6-receptor blockade as the archetypal cytokine-directed
      therapy for this syndrome, supporting the drug-target pattern. Evidence
      source is OTHER because this is a narrative review.

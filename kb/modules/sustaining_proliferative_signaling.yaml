name: Sustaining Proliferative Signaling Module
description: >-
  A conserved mechanism module for the first hallmark of cancer (Hanahan &
  Weinberg): the acquisition of growth-signal autonomy. Normal tissues
  tightly control the production and release of growth-promoting signals;
  cancer cells subvert this control to sustain chronic proliferation. The
  conserved causal chain runs from an oncogenic lesion that constitutively
  engages mitogenic signaling (activating receptor tyrosine kinase
  mutation/amplification, autocrine growth-factor loops, activating
  mutations in RAS/BRAF/PI3K, or loss of negative-feedback brakes such as
  PTEN/NF1) through constitutive RAS-MAPK and PI3K-AKT-mTOR signal output
  to growth-factor-independent cell-cycle entry and uncontrolled
  proliferation. Individual disorder entries declare conformance via
  conforms_to on their pathophysiology nodes, substituting the
  tumor-type-specific driver (e.g., EGFR or ALK in NSCLC, BCR-ABL1 in CML,
  KIT/PDGFRA in GIST, activating BRAF V600E in melanoma) while preserving
  the conserved proliferative-signaling pattern. This is the proliferative
  counterpart to evading_growth_suppressors; together they capture the
  acquisition of autonomous proliferation plus loss of the antiproliferative
  brakes. The chain then carries the hallmark's clinical corollary, which is
  what distinguishes this capability from the others: chronic flux through one
  cascade is also a chronic requirement for it, so the tumour is dependent on
  its driver and the driver is druggable rather than merely diagnostic
  (oncogene addiction), and resistance to inhibiting it is usually a return of
  flux to the same central node rather than a new mechanism. A conforming entry
  should therefore name which route its driver takes - an activating RAS or
  BRAF substitution signals with no ligand, whereas the EGFR kinase-domain
  lesions of lung adenocarcinoma are hyperresponsive to ligand rather than
  ligand-independent - and should record its resistance route as persistence of
  the signal it names.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway
  Activation"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding cell
  types, biological processes, gene products, and causal edges, specialized
  to their tumor context. Key tumor-specific substitutions: NSCLC uses
  activating EGFR mutations or EML4-ALK fusion as the oncogenic driver; CML
  uses the BCR-ABL1 fusion kinase; GIST uses activating KIT/PDGFRA
  mutations; melanoma uses BRAF V600E. The complementary drug-mechanism
  view of RTK-proximal adaptor signaling is captured in
  rtk_grb2_signaling_adaptation. Key conformance target:
  "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway
  Activation". Two further nodes carry the therapeutic content: "Oncogene
  Dependence as a Therapeutic Vulnerability" is where a conforming entry's
  targeted agent and its matching predictive test belong, and "ERK Signal
  Persistence and Adaptive Escape" is where its resistance route belongs. An
  entry conforming to the central node and modelling a targeted therapy but not
  these two is describing the pathway without the reason the pathway is
  curated.
pathophysiology:
- name: Oncogenic Growth-Signal Lesion
  description: >-
    A genetic or epigenetic lesion confers growth-signal autonomy. Common
    routes include activating mutation or amplification of a receptor
    tyrosine kinase (EGFR, ERBB2/HER2, KIT, PDGFRA, MET, ALK, RET),
    establishment of autocrine growth-factor loops in which tumor cells
    produce ligands for their own receptors, constitutively activating
    mutations in downstream transducers (KRAS/NRAS/HRAS, BRAF, PIK3CA), or
    inactivation of negative-feedback regulators (PTEN, NF1, the SPRY/DUSP
    feedback machinery). These routes reduce or remove the normal requirement
    for extrinsic growth-factor stimulation, and they do not all do so to the
    same degree: an activating RAS or BRAF substitution signals with no ligand
    at all, whereas the EGFR kinase-domain lesions of lung adenocarcinoma are
    hyperresponsive to ligand rather than ligand-independent. A conforming entry
    should say which of these its driver is, because the distinction decides
    whether depriving the tumour of ligand is a mechanism at all.
  role: trigger
  biological_processes:
  - preferred_term: Cell Surface Receptor Tyrosine Kinase Signaling
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20602996
    reference_title: "Cell signaling by receptor tyrosine kinases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As our understanding of these details becomes increasingly
      sophisticated, it provides an important context for therapeutically
      countering the effects of pathogenic RTK mutations in cancer and other
      diseases.
    explanation: >-
      Review establishing that pathogenic receptor tyrosine kinase mutations
      drive cancer and are a therapeutic target, supporting the oncogenic
      growth-signal lesion as the trigger of this module. Evidence source is
      OTHER because this is a review article.
  - reference: PMID:15118073
    reference_title: "Activating mutations in the epidermal growth factor receptor underlying responsiveness of non-small-cell lung cancer to gefitinib."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These mutations lead to increased growth factor signaling and confer
      susceptibility to the inhibitor.
    explanation: >-
      A worked instance of this node in human tumours: somatic kinase-domain
      lesions raise mitogenic signal output. The same sentence is the basis of
      the oncogene-dependence node downstream.
  - reference: PMID:15118073
    reference_title: "Activating mutations in the epidermal growth factor receptor underlying responsiveness of non-small-cell lung cancer to gefitinib."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      In vitro, EGFR mutants demonstrated enhanced tyrosine kinase activity in
      response to epidermal growth factor and increased sensitivity to
      inhibition by gefitinib.
    explanation: >-
      Measures the lesion's effect on kinase activity, and carries the caveat
      this node's prose now records: these EGFR mutants are hyperresponsive to
      ligand rather than wholly ligand-independent, so a blanket claim of
      uncoupling from extrinsic stimulation would overstate this route.
  downstream:
  - target: Constitutive Mitogenic Pathway Activation
    description: >-
      The oncogenic lesion drives ligand-independent, constitutive
      activation of downstream proliferative signaling cascades.

- name: Constitutive Mitogenic Pathway Activation
  description: >-
    The oncogenic lesion produces chronic, ligand-independent flux through
    the core mitogenic cascades: the RAS-RAF-MEK-ERK (MAPK) pathway driving
    proliferative gene expression, and the PI3K-AKT-mTOR pathway driving
    growth, metabolism, and survival. This sustained signal output replaces
    the transient, tightly regulated pulses of signaling seen in normal
    growth-factor responses, and is the conserved central node that
    disorder-specific drivers converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: RAS Protein Signal Transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 Cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  - preferred_term: PI3K-AKT Signal Transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg define sustaining proliferative signaling as the
      first hallmark capability, the conserved central effector this module
      models. Evidence source is OTHER because this is a review article.
  - reference: PMID:25435214
    reference_title: "Targeting RAS-ERK signalling in cancer: promises and challenges."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The RAS-RAF-MEK-ERK signalling pathway is hyperactivated in a high
      percentage of tumours, most frequently owing to activating mutations of
      the KRAS, NRAS and BRAF genes.
    explanation: >-
      States this node's claim rather than the hallmark it belongs to: the MAPK
      arm is hyperactivated across tumours, and names the lesions upstream that
      most often do it. Graded OTHER as the source is a review.
  downstream:
  - target: Growth-Factor-Independent Proliferation
    description: >-
      Constitutive mitogenic signaling drives cell-cycle entry independent
      of external growth-factor cues.
  - target: Oncogene Dependence as a Therapeutic Vulnerability
    description: >-
      Chronic flux through one cascade is also a chronic requirement for it,
      which is what makes the driver druggable rather than merely diagnostic.

- name: Growth-Factor-Independent Proliferation
  description: >-
    Sustained mitogenic signaling drives the cell through the G1 restriction
    point and into repeated rounds of division without the normal
    requirement for extrinsic growth factors. The result is autonomous,
    chronic proliferation, the defining phenotype of this hallmark and a
    foundation for tumor growth.
  role: consequence
  biological_processes:
  - preferred_term: Cell Population Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The hallmarks of cancer comprise six biological capabilities acquired
      during the multistep development of human tumors.
    explanation: >-
      Establishes that this node's phenotype is an acquired capability of the
      tumour rather than an incidental consequence of the signal, which is what
      the hallmark framing asserts and what this module exists to model. Graded
      OTHER as the source is a review.
  - reference: PMID:15118073
    reference_title: "Activating mutations in the epidermal growth factor receptor underlying responsiveness of non-small-cell lung cancer to gefitinib."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Somatic mutations were identified in the tyrosine kinase domain of the
      EGFR gene in eight of nine patients with gefitinib-responsive lung cancer,
      as compared with none of the seven patients with no response
    explanation: >-
      Cited for this node by inference rather than directly, hence INDIRECT: the
      measurement is of therapeutic response, and it supports the proliferation
      being driven by the upstream lesion because removing the signal reverses
      it. The citation this replaces quoted a review's framing sentence about
      structural diversity of ligand-mediated RTK activation, which does not
      bear on autonomous proliferation.

- name: Oncogene Dependence as a Therapeutic Vulnerability
  description: >-
    The clinical corollary of this hallmark is not that the tumour proliferates
    but that it has become dependent on the lesion driving it. A cancer cell
    carries many genetic and epigenetic abnormalities, and its growth and
    survival can still often be impaired by inactivating one oncogene - the
    oncogene-addiction phenomenon, and the entire rationale for molecular
    targeted therapy. The worked case is lung adenocarcinoma: EGFR
    kinase-domain mutations were present in eight of nine gefitinib-responsive
    tumours and none of seven non-responders, so the lesion that creates the
    hallmark also selects the patients in whom blocking it works. This node is
    why a conforming entry's targeted therapy belongs on the driver and not
    on the proliferation it causes, and why the matching predictive test is
    part of the mechanism rather than an administrative step.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Cell Surface Receptor Tyrosine Kinase Signaling
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence:
  - reference: PMID:18451130
    reference_title: "Oncogene addiction."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cancer cells contain multiple genetic and epigenetic abnormalities.
      Despite this complexity, their growth and survival can often be impaired
      by the inactivation of a single oncogene.
    explanation: >-
      States the node exactly, including the part that makes it non-obvious -
      genomic complexity does not dilute the dependence. Graded OTHER as the
      source is a review.
  - reference: PMID:15118073
    reference_title: "Activating mutations in the epidermal growth factor receptor underlying responsiveness of non-small-cell lung cancer to gefitinib."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A subgroup of patients with non-small-cell lung cancer have specific
      mutations in the EGFR gene, which correlate with clinical responsiveness
      to the tyrosine kinase inhibitor gefitinib.
    explanation: >-
      The human measurement behind this node, and the one that ties the lesion
      to the response rather than asserting dependence from the pathway
      diagram.
  downstream:
  - target: ERK Signal Persistence and Adaptive Escape
    description: >-
      Dependence is what the tumour escapes from, so the vulnerability and the
      resistance are two states of the same requirement.

- name: ERK Signal Persistence and Adaptive Escape
  description: >-
    Inhibiting the driver rarely fails because the tumour stopped needing the
    pathway. It fails because the pathway is running again: both intrinsic and
    acquired resistance to RAF and MEK inhibitors are usually accompanied by
    ERK signalling persisting in the drug's presence, whether through a second
    lesion, a bypass receptor, or relief of the ERK-dependent negative feedback
    that was holding upstream signalling down before the drug arrived. Read
    that way, resistance is this module's central node reasserting itself
    rather than a new mechanism, which is why single-agent response rates are
    so variable and why combination is the standard answer. A conforming entry
    should record its resistance route as a return of flux to the node it
    names, not as an unrelated event.
  role: adaptive_escape
  biological_processes:
  - preferred_term: ERK1 and ERK2 Cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:25435214
    reference_title: "Targeting RAS-ERK signalling in cancer: promises and challenges."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both intrinsic and acquired resistance to RAF and MEK inhibitors are
      frequently associated with the persistence of ERK signalling in the
      presence of the drug, implying the need for more innovative approaches to
      target the pathway.
    explanation: >-
      States the node's defining claim - that resistance is signal persistence
      rather than loss of dependence - and covers both the intrinsic and the
      acquired route. Graded OTHER as the source is a review.
  - reference: PMID:25435214
    reference_title: "Targeting RAS-ERK signalling in cancer: promises and challenges."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, response rates are highly variable and the efficacy of these
      drugs is primarily limited by the development of resistance.
    explanation: >-
      Supports this node being the dominant limit on the upstream vulnerability
      rather than an occasional complication.
  - reference: PMID:18451130
    reference_title: "Oncogene addiction."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Combination therapy may also be required to prevent the escape of cancers
      from a given state of oncogene addiction.
    explanation: >-
      Ties this node back to the vulnerability it escapes from and states the
      therapeutic consequence conforming entries record as combination regimens.

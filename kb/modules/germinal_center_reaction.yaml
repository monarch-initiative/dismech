  evidence:
  - reference: PMID:22224772
    reference_title: "Germinal centers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      this structure is the site of B cell clonal expansion, somatic
      hypermutation, and affinity-based selection, the combination of which
      results in the production of high-affinity antibodies
    explanation: >-
      Names the three processes this node bundles — clonal expansion, somatic
      hypermutation, and affinity-based selection — and their output,
      high-affinity antibody. Evidence source is OTHER because this is a review.
  - reference: PMID:27653600
    reference_title: "Germinal Center B Cell Dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Germinal centers (GCs) are the site of antibody diversification and
      affinity maturation and as such are vitally important for humoral
      immunity.
    explanation: >-
      Independently identifies the germinal center as the site of antibody
      diversification and affinity maturation and states its necessity for
      humoral immunity, supporting this node as the central effector of the
      chain. Evidence source is OTHER because this is a review.
  - reference: PMID:11007474
    reference_title: "Class switch recombination and hypermutation require activation-induced cytidine deaminase (AID), a potential RNA editing enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that AID may be involved in regulation or catalysis
      of the DNA modification step of both class switching and somatic
      hypermutation.
    explanation: >-
      Establishes in AID-deficient mice that a single enzyme is required for the
      DNA modification step of both class switch recombination and somatic
      hypermutation, which is why this node treats them as one rate-limiting
      step rather than two. Evidence source is MODEL_ORGANISM because the
      finding rests on AID-knockout mice and a B lymphoma line.
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three major abnormalities characterize AID deficiency: (1) the absence of
      immunoglobulin class switch recombination, (2) the lack of immunoglobulin
      somatic hypermutations, and (3) lymph node hyperplasia caused by the
      presence of giant germinal centers.
    explanation: >-
      Human confirmation in HIGM2 patients that loss of AID removes both class
      switch recombination and somatic hypermutation while germinal centers
      persist and enlarge — direct evidence that this node is separable from
      germinal center formation upstream of it. Evidence source is
      HUMAN_CLINICAL because this is a patient mutation series.
  downstream:
  - target: Affinity-Matured Class-Switched B Cell Output

- name: Affinity-Matured Class-Switched B Cell Output
  description: >-
    Selected germinal center B cells exit as two durable populations: long-lived
    plasma cells that home to the bone marrow and secrete affinity-matured,
    class-switched antibody continuously, and memory B cells that persist without
    secreting and mount an accelerated response on re-encounter with antigen.
    These are functionally distinct outputs of the same reaction — one maintains
    a standing serum antibody titre, the other supplies recall capacity — and a
    conformer may lose either selectively, which is why the module keeps them in
    one node rather than collapsing them into the consequence below.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell

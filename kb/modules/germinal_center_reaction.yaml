  - reference: PMID:26187412
    reference_title: "Long-Lived Plasma Cells Are Contained within the CD19(-)CD38(hi)CD138(+) Subset in Human Bone Marrow."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that the CD19(-)CD38(hi)CD138(+) subset was morphologically
      distinct, differentially expressed PC-associated genes, and exclusively
      contained PCs specific for viral antigens to which the subjects had not
      been exposed for more than 40 years.
    explanation: >-
      Identifies a discrete human bone-marrow plasma cell subset carrying
      specificities from exposures decades earlier, establishing the long-lived
      plasma cell as a real, separable output of this node. Evidence source is
      HUMAN_CLINICAL because these are human bone-marrow donors.
  - reference: PMID:25677494
    reference_title: "Memory B cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent advances in tracking antigen-experienced memory B cells have
      revealed the existence of distinct classes of cells that have considerable
      functional differences.
    explanation: >-
      Establishes antigen-experienced memory B cells as a distinct, functionally
      heterogeneous output population alongside plasma cells, supporting the
      memory arm of this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype observed in HIGM2 patients (and in AID-/- mice) demonstrates
      the absolute requirement for AID in several crucial steps of B cell
      terminal differentiation necessary for efficient antibody responses.
    explanation: >-
      Connects the upstream germinal center node to this one: the AID-dependent
      step is required for the terminal B cell differentiation that produces
      efficient antibody responses, supporting the causal edge into this output
      node. Evidence source is HUMAN_CLINICAL because the claim is anchored on
      the HIGM2 patient phenotype.
  downstream:
  - target: Durable Protective Humoral Immunity

- name: Durable Protective Humoral Immunity
  description: >-
    The standing serum and mucosal antibody maintained by long-lived plasma
    cells, together with the recall capacity held by memory B cells, constitutes
    durable protection against reinfection. This is the clinical consequence of
    the chain and the level at which it is measured: antibody titre and immune
    memory are the correlates of protection by which vaccines are judged, so
    vaccine non-response is one readout of this node rather than a mechanism of
    its own. Conformers read this node in the direction their disease takes it —
    absent in antibody deficiency, misdirected in autoantibody-mediated disease.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Immunoglobulin Mediated Immune Response
    term:
      id: GO:0016064
      label: immunoglobulin mediated immune response
  - preferred_term: Humoral Immune Response Mediated by Circulating Immunoglobulin
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
  evidence:
  - reference: PMID:26187412
    reference_title: "Long-Lived Plasma Cells Are Contained within the CD19(-)CD38(hi)CD138(+) Subset in Human Bone Marrow."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our studies define human LLPCs and provide a mechanism for the
      life-long maintenance of anti-viral antibodies in the serum.
    explanation: >-
      States the mechanism by which the upstream plasma cell output sustains
      serum antibody for life, which is the durability claim this consequence
      node makes. Evidence source is HUMAN_CLINICAL because this is a human
      bone-marrow study.
  - reference: PMID:20463105
    reference_title: "Correlates of protection induced by vaccination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the immune system is redundant, almost all current vaccines work
      through antibodies in serum or on mucosa that block infection or
      bacteremia/viremia and thus provide a correlate of protection.
    explanation: >-
      Establishes serum and mucosal antibody as the protective mechanism and the
      measured correlate for nearly all vaccines, supporting this node as the
      protective endpoint of the chain and as the readout vaccine response is
      scored against. Evidence source is OTHER because this is a review.
  - reference: PMID:20463105
    reference_title: "Correlates of protection induced by vaccination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune memory is a critical correlate: effector memory for
      short-incubation diseases and central memory for long-incubation diseases.
    explanation: >-
      Adds immune memory alongside antibody titre as a correlate of protection,
      supporting the memory B cell arm of the upstream node contributing to this
      consequence. Evidence source is OTHER because this is a review.

- ONCOLOGY
creation_date: "2026-09-05T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease; do NOT create a "Germinal
  Center Reaction" Disease entry. Disorder entries reference individual nodes via
  conforms_to (e.g. "germinal_center_reaction#Germinal Center Reaction"). The
  module defines the expected pathophysiology structure; conforming nodes should
  carry the corresponding cell types, biological processes, and causal edges,
  specialized to their disease context and directed with modifiers.
  Disorder-specific substitutions: an antibody-deficiency conformer substitutes
  its own molecular lesion for the generic step and reads the chain in the
  DECREASED direction (CVID at class switch recombination, APDS at B-cell
  maturation, Kabuki syndrome at somatic hypermutation, Specific Antibody
  Deficiency at the switched memory compartment, autosomal agammaglobulinemia at
  the humoral-immunity consequence, where the reaction never starts because no
  naive B cell reaches the follicle); a germinal-center-derived lymphoma
  substitutes the transformed clone and reads it in the dysregulated direction
  (Follicular_Lymphoma at the reaction node and at Tfh help). Explicitly out of
  scope, each to be argued as its own module: immunosenescence (upstream and
  age-driven, and the natural home for the poor-vaccine-response line
  inflammaging currently carries only as a model limitation); iatrogenic B-cell
  depletion (rituximab, transplant immunosuppression); asplenia and
  polysaccharide non-response, which run through T-independent antigens this
  chain does not cover; and waning immunity, which is plasma-cell survival
  kinetics rather than response failure. Vaccine effectiveness is deliberately
  not modelled as a module: it is the outcome of an intervention, and its failure
  modes do not share a causal chain — this module is the conserved process
  underneath the largest of them, and vaccine non-response is one readout of it
  rather than its definition (issue #10924). Mouse knockout data are used for the
  AID requirement and are graded MODEL_ORGANISM; the human requirement rests on
  the HIGM2 patient series. Immunoglobulin isotypes, AID chemistry, and BCL2
  translocation are described in prose only; modules bind GO, CL, and UBERON
  terms and do not use gene (HGNC) or chemical (CHEBI) term bindings.
pathophysiology:
- name: Antigen Capture and Naive B Cell Activation
  description: >-
    Antigen draining into a secondary lymphoid organ is filtered and retained
    rather than passively diffusing through it: subcapsular sinus macrophages and
    follicular dendritic cells display intact, unprocessed antigen to B cells
    following defined migration paths through the follicle. A naive B cell whose
    receptor binds that antigen is activated, internalizes and processes it, and
    presents peptide on MHC class II, becoming competent to solicit T cell help.
    This is the entry point of the reaction; conformers whose B cells never reach
    the follicle (developmental arrest in bone marrow B lymphopoiesis) fail here
    by never starting.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: naive B cell
    term:

  - reference: PMID:20959804
    reference_title: "B cell follicles and antigen encounters of the third kind."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Multiple processes facilitate these encounters, from the filtering
      functions of lymphoid tissues and migration paths of B cells to the
      antigen-presenting properties of macrophages and follicular dendritic
      cells.
    explanation: >-
      Names the components of this node: lymphoid-tissue antigen filtering, B
      cell migration through the follicle, and antigen display by macrophages
      and follicular dendritic cells. Evidence source is OTHER because this is a
      review.
  - reference: PMID:20959804
    reference_title: "B cell follicles and antigen encounters of the third kind."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This Review will discuss how these factors work together in the lymph node
      to ensure efficient and persistent exposure of B cells to diverse forms of
      antigen and thus effective triggering of the humoral response.
    explanation: >-
      Places the antigen-encounter step in the lymph node and identifies it as
      the trigger of the humoral response, supporting this node's role and
      anatomical location. Evidence source is OTHER because this is a review.
  - reference: PMID:31002794
    reference_title: "B Cell Responses: Cell Interaction Dynamics and Decisions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here, we review current understanding of how B cell responses are
      initiated; the different paths to generate short- and long-lived plasma
      cells, germinal center cells, and memory cells; and how each path impacts
      antibody diversity, selectivity, and affinity.
    explanation: >-
      States that B cell response initiation is the upstream step of the paths
      that produce germinal center, plasma, and memory cells, establishing this
      node as the trigger of the chain the module models. Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Cognate T Follicular Helper Cell Help

- name: Cognate T Follicular Helper Cell Help
  description: >-
    An antigen-engaged B cell forms a cognate synapse with a CD4+ T cell that has
    differentiated along the Bcl6-dependent T follicular helper (Tfh) program.
    Tfh cells are the specialized CD4+ subset licensed to deliver follicular
    help, and their help is required both to nucleate a germinal center and to
    sustain the affinity-based selection that runs inside it. This node is the
    amplifier: a numerically small T cell population converts a single
    antigen-binding event into a self-sustaining, iteratively selected B cell
    reaction. Conformers substitute the specific lesion in T-B collaboration
    (costimulation, cytokine, or transcriptional) or, in
    germinal-center-derived lymphoma, a Tfh-containing supportive
    microenvironment that props up the transformed clone.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  biological_processes:
  - preferred_term: T Follicular Helper Cell Differentiation

name: Germinal Center Reaction Module
description: >-
  A conserved pathophysiology module representing the adaptive humoral arm of
  immunity: the T-cell-dependent germinal center reaction that converts a naive,
  low-affinity, IgM-restricted B cell repertoire into affinity-matured,
  class-switched plasma cells and memory B cells. Antigen filtered by secondary
  lymphoid tissue and displayed on macrophages and follicular dendritic cells
  activates naive B cells, which acquire cognate help from Bcl6-dependent T
  follicular helper cells; that help nucleates a germinal center, where
  AID-dependent somatic hypermutation and class switch recombination operate
  under iterative affinity-based selection. The surviving high-affinity clones
  exit as long-lived bone-marrow plasma cells and memory B cells, which together
  sustain durable protective humoral immunity and are the substrate of the
  antibody correlates of protection that vaccines are measured by. The module
  models the reaction itself, not its failure: conforming nodes set direction
  with modifiers, so an immunodeficiency conforms with DECREASED processes
  (Common_Variable_Immunodeficiency, Activated_PI3K-delta_Syndrome,
  Kabuki_Syndrome, Specific_Antibody_Deficiency, Autosomal_Agammaglobulinemia)
  while a germinal-center-derived malignancy conforms in the dysregulated or
  excess direction (Follicular_Lymphoma). Key conformance target: "Germinal
  Center Reaction", the rate-limiting, disorder-agnostic AID-dependent step
  every conformer funnels through. This module is complementary to, and does not
  overlap with, the innate and cellular immunity modules
  (phagocyte_oxidative_burst_failure, complement_dysregulation,
  innate_antiviral_interferon_response, cdc1_tolerogenic_maturation), which
  carry no B-cell maturation chain, and to molecular_mimicry_autoimmunity, whose
  subject is antigen specificity rather than the reaction that matures the
  response. There is no drug-target pattern here: the therapies that act on this
  machinery (B-cell-depleting antibodies, immunoglobulin replacement) either
  deplete the reaction wholesale or bypass it, and belong to the separate
  iatrogenic B-cell depletion mechanism listed as out of scope in notes.
category: Module

    reference_title: "T Follicular Helper Cell Biology: A Decade of Discovery and Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Helping B cells and antibody responses is a major function of CD4+ T
      cells.
    explanation: >-
      Establishes that provision of help to B cells and their antibody responses
      is a principal CD4+ T cell function, the claim this node makes. Evidence
      source is OTHER because this is a review.
  - reference: PMID:31117010
    reference_title: "T Follicular Helper Cell Biology: A Decade of Discovery and Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the requirement of Tfh cells as the specialized subset of CD4+ T cells
      needed for germinal centers (the microanatomical sites of B cell mutation
      and antibody affinity maturation) and related B cell responses
    explanation: >-
      States that Tfh cells are the specialized CD4+ subset required for
      germinal centers, supporting both the Tfh differentiation binding on this
      node and its downstream edge to the germinal center reaction. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Germinal Center Reaction

- name: Germinal Center Reaction
  description: >-
    Helped B cells seed a germinal center, a transient compartment within the
    follicle in which clonal expansion, AID-dependent somatic hypermutation of
    the immunoglobulin variable region, and class switch recombination proceed
    under iterative affinity-based selection. Mutation diversifies the receptor
    repertoire, selection retains the clones whose receptors bind antigen best,
    and switching changes the effector class of the antibody without changing its
    specificity. This is the rate-limiting, disorder-agnostic step every
    conformer funnels through and the module's key conformance target. Loss of
    AID abolishes both switching and hypermutation while leaving the germinal
    center itself enlarged, which is the cleanest demonstration that this node is
    a distinct mechanistic step rather than a synonym for germinal center
    formation.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  biological_processes:
  - preferred_term: Germinal Center B Cell Differentiation
    term:
      id: GO:0002314
      label: germinal center B cell differentiation
  - preferred_term: Somatic Hypermutation of Immunoglobulin Genes
    term:
      id: GO:0016446
      label: somatic hypermutation of immunoglobulin genes
  - preferred_term: Class Switch Recombination
    term:
      id: GO:0045190
      label: isotype switching
  locations:

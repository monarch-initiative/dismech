name: Beta-Adrenergic Receptor Blockade Module
description: 'The drug-mechanism module for beta-adrenergic receptor antagonism: a beta-blocker competitively
  occupies ADRB1 (and ADRB2 for non-selective agents), the occupied receptor fails to engage Gs and
  stimulate adenylyl cyclase, cAMP falls, cAMP-dependent protein kinase activity falls, and three
  tissue arms follow - reduced sinoatrial firing and myocardial contractility, reduced juxtaglomerular
  renin release, and, where ADRB2 is occupied, loss of the relaxant beta-2 tone in airway smooth muscle.
  The therapeutic arms converge on reduced myocardial workload and oxygen consumption; the airway
  arm is the adverse-effect arm and carries an explicit selectivity precondition. The key conformance
  target is `Reduced cAMP-Dependent Protein Kinase Activity`, the step every arm funnels through whichever
  receptor subtype was blocked; a conforming disorder entry substitutes the PKA substrate and tissue
  that matter to it. Carries the beta-blocker drug-target pattern for cardioselective, non-selective
  and multi-mechanism agents. It is the mirror image of `cardiac_camp_pka_calcium_handling`, which
  travels the same cascade in the cAMP-raising direction inside the cardiomyocyte and carries the
  calcium-handling and afterdepolarization chain this module deliberately does not duplicate: that
  module answers what a cAMP rise does to calcium handling, this one answers what receptor blockade
  does across the heart, kidney and airway. It is distinct from `cardiomyopathy_maladaptive_remodeling`,
  which reaches heart failure through structural remodeling rather than through receptor pharmacology,
  and it is the adrenergic counterpart of the mu-opioid receptor pair (`mu_opioid_receptor_agonism`,
  `mu_opioid_receptor_antagonism`) in the GPCR project''s one-module-per-receptor-and-direction scheme.'
category: Module
module_categories:
- PHARMACOLOGY
- TOXICOLOGY
creation_date: '2026-10-21T00:00:00Z'
notes: 'This is a mechanism module, not a specific disease. Do NOT create a "Beta-Adrenergic Receptor
  Blockade" Disease entry. Disorder entries reference individual nodes via conforms_to, for example
  "beta_adrenergic_receptor_blockade#Reduced cAMP-Dependent Protein Kinase Activity".

  Scope. The module opens at the drug-receptor interaction and stops at the organism-level haemodynamic
  outcome. What produced the sympathetic drive being antagonised (neurohormonal activation in heart
  failure, a catecholamine surge, thyrotoxicosis) belongs to the conforming entry, as does the disease-specific
  consequence of lowering that drive. The intracellular calcium-handling chain is deliberately absent:
  a conformer that needs it should also conform to `cardiac_camp_pka_calcium_handling`, whose nodes
  carry it.

  Selectivity is a precondition, not a decoration. The airway arm is reachable only by agents that
  occupy ADRB2. A conforming entry that declares the airway arm should name the agent and its selectivity;
  the cited pharmacovigilance review found no asthma deaths attributable to cardioselective beta-1
  blockers, so a class-wide bronchospasm claim is not supported.

  Ontology bindings. GO has no bronchoconstriction class (searched OLS for "bronchoconstriction" and
  "bronchus smooth muscle contraction", which return CHEBI and CL hits only), so the airway node is
  bound to GO:0044557 relaxation of smooth muscle with modifier DECREASED, which states the loss of
  relaxant tone rather than asserting a contraction term that does not exist. No CHEBI binding appears
  on any node, per the create-module convention that module nodes bind GO and CL terms only; the beta-blockers
  themselves are bound as `therapeutic_agent` on the treatments.

  The ocular arm is deliberately absent. Topical timolol lowers intraocular pressure and would look
  like a fourth tissue arm, but whether that action runs through ciliary-epithelial cAMP is disputed
  - PMID:11502564 argues for a cAMP-independent effect on the ciliary epithelium - so adding it would
  assert a funnelling through this module''s central effector that the literature does not settle.
  Glaucoma is therefore not offered as a conformer here.

  Migraine is absent for a different reason. Beta-blockers are established migraine prophylaxis, but
  how they prevent attacks is not settled, and no step of this module has been shown to be the one
  that does it, so conforming a migraine entry here would assert a mechanism rather than record one.
  The same applies to the other uses of non-selective blockade named on that treatment (portal hypertension,
  thyrotoxicosis): the drug is the same, the mechanism reaching the clinical benefit is not this module''s
  to claim.'
pathophysiology:
- name: Beta-Adrenergic Receptor Antagonist Occupancy
  description: 'A beta-adrenergic receptor antagonist occupies the orthosteric site of ADRB1 (and,
    for non-selective agents, ADRB2), competitively excluding norepinephrine and epinephrine. Occupancy
    is competitive and therefore graded: the fraction of receptors silenced depends on the antagonist
    concentration set against the prevailing catecholamine drive, which is why the same dose has a
    larger effect under sympathetic activation than at rest. The node is the drug action itself, not
    a lesion.'
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: beta-adrenergic receptor activity
    term:
      id: GO:0004939
      label: beta-adrenergic receptor activity
    modifier: DECREASED
  genes:
  - preferred_term: ADRB1
    term:
      id: hgnc:285
      label: ADRB1
  - preferred_term: ADRB2
    term:
      id: hgnc:286
      label: ADRB2
  evidence:
  - reference: PMID:17998992
    reference_title: Antianginal actions of beta-adrenoceptor antagonists.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Beta-adrenoceptor antagonists competitively inhibit the binding of endogenous catecholamines
      to beta1-adrenoceptors in the heart.
    explanation: States the competitive-occupancy mechanism this node describes, and names the receptor
      subtype the cardiac arm depends on.
  - reference: PMID:32473788
    reference_title: Adrenergic receptors and cardiovascular effects of catecholamines.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: β1 adrenoreceptors predominate in the heart, activate the Gs-adenylyl cyclase -cAMP-protein
      kinase A signaling cascade, and induce positive inotropic and chronotropic effects
    explanation: Names the receptor subtype the antagonist displaces agonist from, and what that receptor
      does when agonist-occupied. Quoted for receptor identity; the consequences of blocking it are
      the inference the downstream nodes carry.
  downstream:
  - target: Loss of Gs Coupling and Adenylyl Cyclase Activation
    description: Receptor occupancy without agonist-induced conformational change leaves the receptor
      unable to engage Gs.
- name: Loss of Gs Coupling and Adenylyl Cyclase Activation
  description: 'An antagonist-occupied beta-adrenergic receptor does not adopt the active conformation,
    so it does not catalyse nucleotide exchange on Gs-alpha and does not stimulate adenylyl cyclase.
    Basal and agonist-driven cAMP production both fall, the latter much more than the former. This
    is the step at which receptor-level pharmacology becomes a second-messenger change, and it is
    where the module''s tissue arms diverge: the same loss of Gs coupling plays out differently in
    cardiomyocytes, juxtaglomerular granular cells and airway smooth muscle.'
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adenylate cyclase-activating adrenergic receptor signaling pathway
    term:
      id: GO:0071880
      label: adenylate cyclase-activating adrenergic receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:30422499
    reference_title: Beta 1 Receptors.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: By signaling Gs, a cAMP-dependent pathway is initiated through adenylyl cyclase
    explanation: Names the coupling step the antagonist denies the receptor. StatPearls is cited here
      for textbook receptor pharmacology only, not as a primary source.
  - reference: PMID:22124804
    reference_title: Convergence of major physiological stimuli for renin release on the Gs-alpha/cyclic
      adenosine monophosphate signaling pathway.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: Mice with selective Gs-alpha (Gsα) deficiency in juxtaglomerular granular cells show
      a marked reduction of basal renin secretion, and an almost complete unresponsiveness of renin
      release to furosemide, hydralazine, or isoproterenol.
    explanation: Genetic removal of Gs-alpha from a cell type this module reaches abolishes both basal
      output and the response to a beta-agonist, which is the consequence this node asserts for pharmacological
      loss of Gs coupling.
  downstream:
  - target: Reduced cAMP-Dependent Protein Kinase Activity
    description: Less cAMP leaves the PKA regulatory subunits bound, so fewer catalytic subunits are
      released.
- name: Reduced cAMP-Dependent Protein Kinase Activity
  description: 'Falling cAMP leaves protein kinase A holoenzyme intact, reducing the pool of free
    catalytic subunit and so the phosphorylation of its targets. This is the module''s key conformance
    target: every therapeutic and adverse arm below funnels through it, and a conforming disorder
    entry substitutes the PKA substrate that matters in its tissue rather than re-deriving the receptor
    chain. It is also the point of contact with `cardiac_camp_pka_calcium_handling`, which carries
    the opposite direction of travel.'
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22124804
    reference_title: Convergence of major physiological stimuli for renin release on the Gs-alpha/cyclic
      adenosine monophosphate signaling pathway.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Physiological stimulation of renin secretion and expression relies on the activation
      of regulatory pathways that converge on the cyclic adenosine monophosphate/protein kinase A
      (cAMP/PKA) pathway.
    explanation: Supports treating cAMP/PKA as the convergence point several upstream stimuli share,
      which is what makes it the module's conformance target rather than one arm among many.
  downstream:
  - target: Reduced Sinoatrial and Atrioventricular Nodal Firing
    description: Less PKA-dependent phosphorylation of the cardiac pacemaker and conduction apparatus.
  - target: Reduced Myocardial Contractility
    description: Less PKA-dependent phosphorylation of the contractile and calcium-handling apparatus.
  - target: Reduced Juxtaglomerular Renin Release
    description: Renin exocytosis from granular cells is cAMP/PKA-dependent.
  - target: Loss of Beta-2-Mediated Bronchiolar Smooth Muscle Relaxation
    description: In airway smooth muscle the same cAMP/PKA fall removes a relaxant tone rather than
      a stimulatory one. Reached only by agents that occupy ADRB2.
- name: Reduced Sinoatrial and Atrioventricular Nodal Firing
  description: 'Loss of PKA-dependent phosphorylation slows diastolic depolarization in sinoatrial
    pacemaker cells and slows conduction through the atrioventricular node: negative chronotropy,
    and the rate-control effect in atrial fibrillation. It is also the dose-limiting effect (bradycardia,
    heart block) - one mechanism read two ways depending on the patient.'
  role: effector
  biological_scale: CELLULAR
  biological_processes:

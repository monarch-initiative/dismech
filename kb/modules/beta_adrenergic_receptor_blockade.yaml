  - target: Beta-Adrenergic Receptor Antagonist Occupancy
    treatment_effect: ACTIVATES
    description: The drug occupies both beta-receptor subtypes, so it reaches the airway arm as well
      as the cardiac and renal ones.
  - target: Loss of Beta-2-Mediated Bronchiolar Smooth Muscle Relaxation

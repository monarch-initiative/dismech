- name: Beta Blockade with Additional Pharmacology
  description: 'Agents whose benefit is not exhausted by receptor blockade: carvedilol also blocks
    alpha-1 receptors and directly suppresses spontaneous sarcoplasmic reticulum calcium release.
    Its anti-arrhythmic action is modelled in `cardiac_camp_pka_calcium_handling`, not here.'

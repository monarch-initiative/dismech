- name: Reduced Juxtaglomerular Renin Release
  description: Renin exocytosis from juxtaglomerular granular cells is cAMP/PKA-dependent and carries
    a beta-adrenergic component, so beta-blockade lowers plasma renin activity and with it angiotensin
    II generation and aldosterone release. This is the renal arm of the antihypertensive effect and
    is mechanistically separate from the cardiac arm, which is why a conforming entry may declare
    one without the other.
  role: effector

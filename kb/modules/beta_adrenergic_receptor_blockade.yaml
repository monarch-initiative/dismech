    explanation: Locates the renin-releasing cell population this node names. Stated for receptor
      activation; blockade is the inference.
  downstream:
  - target: Reduced Myocardial Workload and Oxygen Consumption
    description: Lower angiotensin II and aldosterone reduce afterload and volume, lowering cardiac
      work.
- name: Reduced Myocardial Workload and Oxygen Consumption
  description: 'The organism-level outcome the therapeutic indications share: a heart doing less work
    per minute, at a lower blood pressure, with a smaller oxygen requirement at rest and under exertion.
    In angina this raises the ischaemic threshold; in hypertension it lowers blood pressure; in heart
    failure with reduced ejection fraction the benefit is the chronic withdrawal of sympathetic drive
    rather than the acute haemodynamic change, which is why initiation is at low dose and up-titrated.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17998992
    reference_title: Antianginal actions of beta-adrenoceptor antagonists.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: By decreasing heart rate, myocardial contractility and afterload, beta-adrenoceptor antagonists
      reduce myocardial workload and oxygen consumption at rest as well as during periods of exertion
      or stress.
    explanation: States this node directly, and names the three upstream contributions the module
      models.
- name: Loss of Beta-2-Mediated Bronchiolar Smooth Muscle Relaxation
  description: 'Airway smooth muscle holds beta-2 receptors whose cAMP/PKA signal is relaxant, so
    blocking them removes a bronchodilator tone instead of a stimulatory one. The arm is reached only
    by agents that occupy ADRB2 - non-selective blockade, or a cardioselective agent at a dose that
    has lost its selectivity - and it matters only where airway tone is already abnormal. This is
    the adverse-effect arm, and it is a mechanism rather than an idiosyncrasy: the same receptor pharmacology
    that is therapeutic in the heart is harmful in the airway.'
  role: adverse_effect
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: relaxation of smooth muscle

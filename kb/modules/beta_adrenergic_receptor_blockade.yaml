      term:
        id: CHEBI:3127
        label: bisoprolol
    - preferred_term: atenolol
      term:
        id: CHEBI:2904
        label: atenolol
  target_mechanisms:
  - target: Beta-Adrenergic Receptor Antagonist Occupancy
    treatment_effect: ACTIVATES
    description: The drug brings about the receptor occupancy this module opens on, preferentially
      at ADRB1.
- name: Non-Selective Beta Blockade
  description: Antagonists with comparable affinity at ADRB1 and ADRB2. Used where the beta-2 action
    is wanted or tolerable and avoided where it is not. Several of those uses - migraine prophylaxis,
    portal hypertension, thyrotoxicosis - are established clinically without the step of this module
    that delivers them being established, so naming them here is not an offer of a conformance target;
    see the scope notes.

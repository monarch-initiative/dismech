    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Targeted activation of the beta-1 receptor in the heart increases sinoatrial (SA) nodal,
      atrioventricular (AV) nodal, and ventricular muscular firing, thus increasing heart rate and
      contractility.
    explanation: Names the three cardiac sites and the two functions this node reports as reduced.
      Stated for receptor activation; blockade is the inference.
  downstream:
  - target: Reduced Myocardial Workload and Oxygen Consumption
    description: A slower ventricular rate lowers oxygen consumption per minute.
- name: Reduced Myocardial Contractility
  description: 'Loss of PKA-dependent phosphorylation of the contractile and calcium-handling apparatus
    reduces the force and the rate of relaxation of working cardiomyocytes: negative inotropy. In
    heart failure this is the acute cost that up-titration is designed to get past, which is why it
    is a separate node from the nodal effect rather than bundled with it.'

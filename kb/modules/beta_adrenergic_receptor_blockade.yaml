    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: β2 adrenoreceptors are distributed extensively throughout the body, but are expressed
      predominantly in bronchial smooth muscle cells.
    explanation: Locates the beta-2 receptor population this arm depends on, naming the subtype explicitly,
      which is what makes the arm a property of receptor selectivity rather than of the drug class
      as a whole.
  downstream:
  - target: Beta-Blocker-Induced Bronchospasm
    description: Unopposed bronchoconstrictor tone narrows the airway.
- name: Beta-Blocker-Induced Bronchospasm
  description: 'Clinically manifest airway narrowing attributable to beta-2 blockade. The claim is
    deliberately scoped: the hazard is established for non-selective blockade in asthma, while the
    pharmacovigilance and observational record does not show cardioselective beta-1 blockers causing
    asthma death or increased exacerbations. The node therefore asserts a mechanism with a selectivity
    precondition, not a class effect, and a conforming entry should say which agent it means.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:33681344
    reference_title: 'The safety of cardioselective β(1)-blockers in asthma: literature review and
      search of global pharmacovigilance safety reports.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: blocking airway β2-receptors can cause severe and sometimes fatal bronchoconstriction
      in people with asthma
    explanation: States the adverse consequence and attributes it to beta-2 blockade specifically.
  - reference: PMID:33681344
    reference_title: 'The safety of cardioselective β(1)-blockers in asthma: literature review and
      search of global pharmacovigilance safety reports.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Observational data suggest that cardioselective β1-blocker use is not associated with
      increased asthma exacerbations.
    explanation: 'Bounds the node to beta-2 blockade: the same review finds no excess exacerbations
      with beta-1-selective agents, which supports the selectivity precondition rather than a class
      effect.'
  - reference: PMID:17998992
    reference_title: Antianginal actions of beta-adrenoceptor antagonists.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Beta-adrenoceptor antagonists must be used cautiously in patients with diabetes mellitus,
      peripheral vascular disease, heart failure, and asthma or other obstructive airway diseases.
    explanation: Records the clinical caution that follows from this arm.
treatments:
- name: Cardioselective Beta-1 Blockade
  description: Beta-1-selective antagonists, the agents used for rate control, angina and guideline-directed
    heart failure therapy. Selectivity is relative and falls away at high dose, which is what links
    this treatment to the airway arm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

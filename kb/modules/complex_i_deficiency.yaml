name: Complex I Deficiency Module
description: >-
  A conserved mechanism module representing isolated mitochondrial complex I
  (NADH:ubiquinone oxidoreductase) deficiency, the most common
  cause of mitochondrial disease in childhood. Complex I is the largest
  respiratory-chain complex, and two mechanistically distinct lesions converge
  on the same functional failure: loss of a structural subunit or an assembly
  factor prevents the holoenzyme from being *built* (the MC1DN series), while
  loss of a chaperone that exchanges oxidatively damaged subunits prevents an
  assembled holoenzyme from being *repaired* (DNAJC30/arLHON). Either way the
  cell cannot oxidize NADH and transfer electrons to ubiquinone, collapsing
  proton pumping and oxidative ATP synthesis, forcing anaerobic glycolysis
  (lactic acidosis) and producing energy failure in high-demand tissues -
  brain and basal ganglia (Leigh syndrome), retinal ganglion cells and optic
  nerve (optic atrophy/LHON), heart, and skeletal muscle. The module captures
  the gene-agnostic core shared across the many nuclear and mtDNA causes;
  conforming entries substitute the specific gene, the affected biogenesis or
  repair sub-step, and the organ tropism. Key conformance target:
  `complex_i_deficiency#Impaired NADH:Ubiquinone Oxidoreduction and ATP
  Synthesis`. Deliberately complementary to
  `complex_iv_assembly_deficiency` (the same chain one complex downstream, at
  cytochrome c oxidase) and to `mitochondrial_dysfunction` (the aging-hallmark
  module, which covers age-associated bioenergetic decline rather than a
  monogenic respiratory-chain lesion).
category: Module
module_categories:
- METABOLISM
creation_date: "2026-09-21T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "complex_i_deficiency#Impaired NADH:Ubiquinone Oxidoreduction and ATP
  Synthesis").

  Scope decision - assembly AND repair. The trigger node is deliberately
  scoped wider than its complex IV sibling, which is named for assembly
  alone. DNAJC30/arLHON is explicitly NOT an assembly defect: the
  Leber-like_Hereditary_Optic_Neuropathy_Autosomal_Recessive_1 entry states
  that DNAJC30 "services complex I after it has been built" and that the
  disease is one "of impaired repair rather than of impaired construction".
  Naming this module `complex_i_assembly_deficiency` would therefore have
  excluded it, even though MONDO places it under MONDO:0100223. The two
  branches are kept as one trigger node because they converge on a single
  rate-limiting step - a catalytically incompetent complex I - which is the
  module bar.

  Sub-step substitutions: core/accessory structural subunits (NDUFS1-8,
  NDUFV1-2, NDUFA/NDUFB families, NDUFC2); assembly factors (NDUFAF1-8,
  TIMMDC1, FOXRED1, NUBPL, ACAD9); subunit-exchange repair (DNAJC30);
  mtDNA-encoded subunits (MT-ND1-6). Tissue substitutions: basal
  ganglia/brainstem and Leigh syndrome (NDUFS4, NDUFAF4, NDUFC2); retinal
  ganglion cell and optic nerve (DNAJC30, NDUFA12, NDUFS2); heart (NDUFB7,
  ACAD9); skeletal muscle.

  MONDO anchoring: complex I carries the full three-term set that complex IV
  lacks - MONDO:0100133 (pan-form) over MONDO:0100223 (nuclear type) and
  MONDO:0100134 (mitochondrial type). This is recorded in the
  complex_iv_assembly_deficiency module notes (verified 2026-08-01, issue
  #3544).

  Curation guardrail - do NOT create a "Complex I Deficiency" Disease entry
  for this module. Whether the nuclear MC1DN number series should be
  collapsed, covered by a Grouping mapped to MONDO:0100223, or kept
  per-number is an OPEN nosology question under discussion in issue #9864,
  where the ruling is explicitly reserved for a human curator. This module
  takes no position on it: it factors out the shared mechanism and moves no
  entity boundary. A "Mitochondrial Complex I Deficiency" Grouping over this
  module, mirroring "Mitochondrial Complex IV Deficiency", is the natural
  follow-up once #9864 is settled.
pathophysiology:
- name: Complex I Biogenesis or Repair Failure
  description: >-
    Pathogenic variants in a complex I structural subunit, an assembly factor,
    or a subunit-exchange chaperone prevent a catalytically competent
    NADH:ubiquinone oxidoreductase from being assembled or, once assembled,
    from being maintained. Complex I comprises 44 subunits and requires at
    least 14 assembly factors, so a large and genetically heterogeneous set of
    genes converges on this step. Conforming entries substitute either the
    biogenesis branch (the MC1DN series) or the repair branch (DNAJC30).
  role: trigger
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: complex I comprises 44 different subunits with at least 14 assembly factors required for its biosynthesis
    explanation: Establishes the scale of the biogenesis machinery whose failure defines this node.
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Causative mutations were detected in 16 genes, 15 of which had previously been associated with complex I deficiency: three mitochondrial DNA genes encoding complex I subunits, two mitochondrial tRNA genes and nuclear DNA genes encoding six complex I subunits and four assembly factors."
    explanation: Documents the genetic heterogeneity - subunits and assembly factors across both genomes - converging on this biogenesis-failure step.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DNAJC30 is a chaperone protein needed for the efficient exchange of complex I subunits exposed to reactive oxygen species and integral to a mitochondrial complex I repair mechanism
    explanation: Establishes the repair branch of this node - subunit exchange in an already-assembled complex I, mechanistically distinct from an assembly defect.
  downstream:
  - target: Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis
    causal_link_type: DIRECT
    description: >-
      Without a competent holoenzyme, electron entry into the respiratory
      chain at complex I cannot proceed.
- name: Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis
  description: >-
    Loss of functional complex I blocks oxidation of NADH and transfer of
    electrons to ubiquinone, and abolishes the associated proton pumping
    across the inner mitochondrial membrane, reducing the proton-motive force
    and oxidative ATP synthesis. This is the rate-limiting step every
    conforming disorder funnels through, whatever the upstream lesion.
  role: central_effector
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The detected variant resulted in a significant reduction of the NDUFB7 protein and reduced complex I activity.
    explanation: Links a subunit lesion directly to measured loss of complex I catalytic activity, the function this node represents.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we measured reduced turnover of specific complex I N-module subunits and a resultant impairment of complex I function
    explanation: Shows the repair branch converging on the same loss of complex I function as the assembly branch.
  downstream:
  - target: Lactic Acidosis and Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      Failure of oxidative ATP synthesis forces a shift to anaerobic
      glycolysis.
  - target: High-Energy Tissue Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The bioenergetic deficit is most damaging in tissues with high
      oxidative demand.
- name: Lactic Acidosis and Metabolic Decompensation
  description: >-
    The shift to anaerobic glycolysis increases pyruvate-to-lactate
    conversion, elevating lactate in blood and cerebrospinal fluid; metabolic
    stressors can precipitate acute decompensation.
  role: consequence
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: key diagnostic findings are developmental regression, elevated lactate and characteristic neuroimaging abnormalities
    explanation: Documents elevated lactate as a core diagnostic finding in complex I-deficient Leigh syndrome.
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: postpartum hypertrophic cardiomyopathy, lactic acidosis, encephalopathy, and a severe complex I defect with fatal outcome
    explanation: A worked case linking a complex I defect to lactic acidosis and metabolic decompensation.
- name: High-Energy Tissue Dysfunction
  description: >-
    Energy failure manifests in high-demand tissues, producing the
    organ-specific phenotypes of complex I deficiency: subacute necrotizing
    encephalomyelopathy of the basal ganglia and brainstem (Leigh syndrome),
    retinal ganglion cell loss and optic atrophy (including arLHON),
    cardiomyopathy, and myopathy. Conforming entries substitute the dominant
    tissue and its cell types.
  role: consequence
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Leigh syndrome is a progressive neurodegenerative disorder, most commonly observed in paediatric mitochondrial disease, and is often associated with pathogenic variants in complex I structural subunits or assembly factors resulting in isolated respiratory chain complex I deficiency.
    explanation: Establishes the brain/basal-ganglia tropism (Leigh syndrome) as the dominant high-energy-tissue outcome of complex I deficiency.
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mitochondrial complex I deficiency is the most common cause of mitochondrial disease in childhood.
    explanation: Supports the clinical weight of this module's terminal node in paediatric mitochondrial disease.

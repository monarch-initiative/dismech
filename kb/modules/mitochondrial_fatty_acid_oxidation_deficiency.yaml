name: Mitochondrial Fatty Acid Oxidation Deficiency Module
description: >-
  A conserved mechanism module for the mitochondrial fatty acid oxidation
  disorders: inherited or acquired failure of the carnitine cycle (OCTN2,
  CPT1A, CACT, CPT2) or of the beta-oxidation spiral itself (VLCAD, LCHAD and
  trifunctional protein, MCAD, SCAD, the electron-transfer flavoprotein
  system of MADD), and the toxic inhibitions that reproduce it (hypoglycin A
  in ackee poisoning, propofol infusion syndrome, malonyl-CoA in malonic
  aciduria). Whatever the lesion, the chain is the same: long- or
  medium-chain acyl-CoAs cannot be oxidized inside the mitochondrion, so
  when glucose runs short during fasting, intercurrent infection or
  prolonged exercise the liver cannot make ketone bodies and heart and
  skeletal muscle cannot draw on their main oxidative fuel. The result is
  hypoketotic hypoglycemia with hepatic dysfunction in infancy,
  exercise- and fasting-triggered rhabdomyolysis in older patients, and
  cardiomyopathy with arrhythmia in the long-chain defects. Conforming
  entries substitute the enzyme or transporter, the chain length it serves,
  and the organ that dominates the presentation. Key conformance target:
  `mitochondrial_fatty_acid_oxidation_deficiency#Impaired Mitochondrial
  Fatty Acid Beta-Oxidation`. Deliberately complementary to
  `peroxisomal_metabolic_failure`, which covers very-long-chain and
  branched-chain oxidation in the peroxisome (adrenoleukodystrophy,
  Zellweger spectrum) and does not produce hypoketotic hypoglycemia; to
  `metabolic_intoxication_decompensation`, which models a small-molecule
  intoxication behind a catabolic crisis where this module models a fuel
  deficit; and to `mitochondrial_translation_deficiency` and the
  respiratory-chain modules, which sit downstream of acetyl-CoA delivery.
category: Module
module_categories:
- METABOLISM
- TOXICOLOGY
creation_date: "2026-10-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "mitochondrial_fatty_acid_oxidation_deficiency#Impaired Mitochondrial
  Fatty Acid Beta-Oxidation").

  Scope decision - carnitine cycle and beta-oxidation spiral are one trigger
  node. A carnitine transporter, a carnitine palmitoyltransferase, an
  acyl-CoA dehydrogenase and the electron-transfer flavoprotein have nothing
  in common structurally, but each stops the same measurable flux, the
  oxidation of a labelled fatty acid in fibroblasts or lymphocytes, which is
  the module bar. Chain-length specificity (very-long, long, medium, short)
  is a trigger-node substitution, not a module split. The toxic branch is
  kept in the same trigger node because hypoglycin A, propofol and
  malonyl-CoA inhibit the same enzymes; Acute_Ackee_Fruit_Intoxication and
  Propofol_Infusion_Syndrome are the reason this module is tagged TOXICOLOGY.

  What is NOT in scope. Peroxisomal beta-oxidation defects conform to
  peroxisomal_metabolic_failure; they lack the fasting-ketogenesis failure
  that defines this chain. Carnitine biosynthesis defects (BBOX1, TMLHE)
  reach the carnitine cycle only indirectly and conform at the central node
  if at all, with the biosynthetic step recorded in the entry. Ketogenesis
  enzyme defects (HMGCS2, HMGCL) and ketolysis defects are downstream of
  beta-oxidation and are a different module. Carnitine_Palmitoyltransferase_II_Deficiency
  and TANGO2_Deficiency_Disorder already conform to
  metabolic_intoxication_decompensation on the node this module would also
  claim; conforms_to is multivalued, and adding the second anchor there is a
  follow-up not made in the creating PR.

  Toxic-intermediate branch. Long-chain acylcarnitines and 3-hydroxyacyl
  species accumulate in the long-chain defects and are held responsible for
  the arrhythmias of CACT, CPT2 and VLCAD deficiency and for the
  chorioretinopathy and neuropathy of LCHAD and trifunctional protein
  deficiency. That branch is real but gene-specific, and the abstracts
  cited on this module do not state it, so it is deliberately not a module
  node: a conforming LCHAD or TFP entry carries it as its own node with its
  own evidence, as Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency
  already does.

  Curation guardrail - do NOT create a "Fatty Acid Oxidation Disorder"
  Disease entry for this module. The FAODs are a named family of distinct
  enzyme deficiencies, each with its own MONDO term and entry; a Grouping
  over this module is the natural follow-up and is the right home for the
  family concept.
pathophysiology:
- name: Carnitine Cycle or Beta-Oxidation Enzyme Deficiency
  description: >-
    A pathogenic variant in a carnitine-cycle transporter or enzyme (OCTN2,
    CPT1A, CACT, CPT2), in an acyl-CoA dehydrogenase of a given chain-length
    class (VLCAD, MCAD, SCAD), in the trifunctional protein (HADHA, HADHB), or
    in the electron-transfer flavoprotein system that all acyl-CoA
    dehydrogenases feed (ETFA, ETFB, ETFDH), or a toxin that inhibits one of
    these steps, removes one step from the pathway that delivers fatty acids
    to, and processes them through, the mitochondrial beta-oxidation spiral.
    Conforming entries substitute the gene or toxin, the step, and the chain
    length it serves.
  role: trigger
  biological_processes:
  - preferred_term: carnitine shuttle
    term:
      id: GO:0006853
      label: carnitine shuttle
    modifier: DECREASED
  - preferred_term: fatty acid beta-oxidation using acyl-CoA dehydrogenase
    term:
      id: GO:0033539
      label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
    modifier: DECREASED
  evidence:
  - reference: PMID:30401918
    reference_title: "Management and diagnosis of mitochondrial fatty acid oxidation disorders: focus on very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mitochondrial fatty acid oxidation disorders (FAODs) are caused by defects in β-oxidation enzymes, including very long-chain acyl-CoA dehydrogenase (VLCAD), trifunctional protein (TFP), carnitine palmitoyltransferase-2 (CPT2), carnitine-acylcarnitine translocase (CACT) and others."
    explanation: Enumerates the enzyme and carnitine-cycle lesions this trigger node spans.
  - reference: PMID:20195903
    reference_title: "A general introduction to the biochemistry of mitochondrial fatty acid β-oxidation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Inherited defects for most of the FAO enzymes have been identified and characterised and are currently included in neonatal screening programmes."
    explanation: Establishes that nearly every step of the pathway has a known inherited lesion.
  - reference: PMID:10051646
    reference_title: "Mutations in the organic cation/carnitine transporter OCTN2 in primary carnitine deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from patients with primary carnitine deficiency lacked mediated carnitine transport."
    explanation: The carnitine-cycle branch of the trigger, measured directly in patient cells.
  - reference: PMID:9973285
    reference_title: "Clear correlation of genotype with disease phenotype in very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Very-long-chain acyl-CoA dehydrogenase (VLCAD) catalyzes the initial rate-limiting step in mitochondrial fatty acid beta-oxidation."
    explanation: The acyl-CoA dehydrogenase branch, at the rate-limiting first step of the spiral.
  downstream:
  - target: Impaired Mitochondrial Fatty Acid Beta-Oxidation
    causal_link_type: DIRECT
    description: >-
      Whichever step is lost, acyl-CoAs of the affected chain length cannot
      be oxidized inside the mitochondrion.
- name: Impaired Mitochondrial Fatty Acid Beta-Oxidation
  description: >-
    Flux through mitochondrial beta-oxidation falls for the chain lengths the
    lost step serves, reducing acetyl-CoA, NADH and FADH2 production from
    fat. This is the rate-limiting step every conforming disorder funnels
    through, and residual flux, measured as fatty acid oxidation in patient
    cells, tracks clinical severity.
  role: central_effector
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:20195903
    reference_title: "A general introduction to the biochemistry of mitochondrial fatty acid β-oxidation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FAO is a key metabolic pathway for energy homoeostasis in organs such as the liver, heart and skeletal muscle. During fasting, when glucose supply becomes limited, FAO is of particular importance."
    explanation: States the physiological role whose loss this node represents, and names the three organs the consequence nodes follow.
  - reference: PMID:9973285
    reference_title: "Clear correlation of genotype with disease phenotype in very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the severe childhood phenotype have mutations that result in no residual enzyme activity, whereas patients with the milder childhood and adult phenotypes have mutations that may result in residual enzyme activity."
    explanation: Residual oxidative flux at this node predicts severity, which is what makes it the convergence point rather than the upstream gene.
  - reference: PMID:10051646
    reference_title: "Mutations in the organic cation/carnitine transporter OCTN2 in primary carnitine deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary carnitine deficiency is an autosomal recessive disorder of fatty acid oxidation caused by defective carnitine transport."
    explanation: A carnitine-cycle lesion reaching the same functional node as an enzyme lesion.
  downstream:
  - target: Fasting Energy Substrate Failure with Impaired Ketogenesis
    causal_link_type: DIRECT
    description: >-
      Without beta-oxidation the liver cannot supply ketone bodies and
      fat-dependent tissues lose their fasting fuel.
- name: Fasting Energy Substrate Failure with Impaired Ketogenesis
  description: >-
    When glucose becomes limiting, during fasting, infection or prolonged
    exercise, hepatic ketogenesis fails because it depends on beta-oxidation
    for acetyl-CoA, and the tissues that would switch to fatty acids cannot.
    Glucose is consumed faster than it is produced, giving the hypoketotic
    hypoglycemia that is the biochemical signature of the family. This node
    is the catabolic-stress gate; every clinical outcome below it is
    precipitated by the same triggers.
  role: effector
  biological_processes:
  - preferred_term: ketone body biosynthetic process
    term:
      id: GO:0046951
      label: ketone body biosynthetic process
    modifier: DECREASED
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:20195903
    reference_title: "A general introduction to the biochemistry of mitochondrial fatty acid β-oxidation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Furthermore, the liver converts fatty acids into ketone bodies, a process for which FAO is indispensable."
    explanation: The dependency that makes ketogenesis fail downstream of the central node.
  - reference: PMID:11773547
    reference_title: "Long-chain 3-hydroxyacyl-CoA dehydrogenase deficiency: clinical presentation and follow-up of 50 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-nine patients (78%) presented with hypoketotic hypoglycemia, the classical features of a fatty acid oxidation disorder."
    explanation: Hypoketotic hypoglycemia as the presenting feature in a large single-defect cohort.
  - reference: PMID:30401918
    reference_title: "Management and diagnosis of mitochondrial fatty acid oxidation disorders: focus on very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "During prolonged fasting, infection, or exercise, patients with FAODs present with hypoglycemia, rhabdomyolysis, cardiomyopathy, liver dysfunction, and occasionally sudden death."
    explanation: Names the catabolic triggers and the three organ outcomes this gate feeds.
  downstream:
  - target: Hypoketotic Hypoglycemic Crisis with Hepatic Dysfunction
    causal_link_type: DIRECT
    description: >-
      In infancy the hepatic and cerebral consequences of the fuel deficit
      dominate.
  - target: Exercise- and Fasting-Triggered Skeletal Muscle Energy Failure
    causal_link_type: DIRECT
    description: >-
      Working muscle depends on fatty acids once glycogen is spent.
  - target: Myocardial Energy Failure with Cardiomyopathy and Arrhythmia
    causal_link_type: DIRECT
    description: >-
      The myocardium derives most of its ATP from fatty acid oxidation, so
      the long-chain defects injure it even between crises.
- name: Hypoketotic Hypoglycemic Crisis with Hepatic Dysfunction
  description: >-
    The infantile presentation: an acute, often fasting- or
    infection-provoked episode of hypoketotic hypoglycemia with lethargy
    progressing to encephalopathy, hepatomegaly, raised transaminases and
    hyperammonemia in a Reye-like picture. Mortality in an undiagnosed first
    episode is substantial, which is why the family is on newborn screening
    panels; after diagnosis, fasting avoidance largely prevents recurrence.
  role: consequence
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:22989098
    reference_title: "Systemic primary carnitine deficiency: an overview of clinical manifestations, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "typically characterized by episodes of hypoketotic hypoglycemia, hepatomegaly, elevated transaminases, and hyperammonemia in infants; skeletal myopathy, elevated creatine kinase (CK), and cardiomyopathy in childhood; or cardiomyopathy, arrhythmias, or fatigability in adulthood"
    explanation: The age-staged presentation, with the hepatic crisis as the infantile form.
  - reference: PMID:16737882
    reference_title: "The natural history of medium-chain acyl CoA dehydrogenase deficiency in the Netherlands: clinical presentation and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An acute presentation before the diagnosis was made resulted in a mortality of 22% (25/114), whereas 21% (19/89) developed disabilities after the diagnosis."
    explanation: Quantifies the lethality and neurological cost of the undiagnosed crisis in the commonest defect.
  - reference: PMID:20049534
    reference_title: "Fatty acid oxidation disorders: outcome and long-term prognosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The risk of death after diagnosis is very low at any age, with good management."
    explanation: Supports the claim that the crisis is preventable once the fuel deficit is recognised.
- name: Exercise- and Fasting-Triggered Skeletal Muscle Energy Failure
  description: >-
    The later-onset, myopathic presentation: once muscle glycogen is spent
    during prolonged or strenuous exercise, or during fasting, cold or
    infection, fibres that cannot oxidize fatty acids fail energetically,
    producing myalgia, weakness and recurrent rhabdomyolysis with
    myoglobinuria and, in severe attacks, acute kidney injury. This is the
    dominant form of CPT2 deficiency and the adult form of VLCAD deficiency.
  role: consequence
  biological_processes:
  - preferred_term: fatty acid oxidation
    term:
      id: GO:0019395
      label: fatty acid oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:30455135
    reference_title: "Phenotype of carnitine palmitoyltransferase II (CPT II) deficiency: A questionnaire-based survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attacks of myalgia (13/13 patients), weakness (13/13) and rhabdomyolysis (10/13 patients) were most frequently reported."
    explanation: The attack phenotype of this node in a genetically confirmed cohort.
  - reference: PMID:30455135
    reference_title: "Phenotype of carnitine palmitoyltransferase II (CPT II) deficiency: A questionnaire-based survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common triggers were exercise (13/13), fasting (13/13), cold (12/13) and infections (12/13)."
    explanation: The catabolic triggers, identical to those on the upstream gate node.
  - reference: PMID:9973285
    reference_title: "Clear correlation of genotype with disease phenotype in very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an adult form, with isolated skeletal muscle involvement, rhabdomyolysis, and myoglobinuria, usually triggered by exercise or fasting"
    explanation: The same myopathic form reached from a different enzyme, with residual activity.
  - reference: PMID:20049534
    reference_title: "Fatty acid oxidation disorders: outcome and long-term prognosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Approximately 10-20% of patients diagnosed by newborn screening and treated nevertheless suffer episodic rhabdomyolysis."
    explanation: Shows the muscle outcome persists even under treatment, unlike the hepatic crisis.
- name: Myocardial Energy Failure with Cardiomyopathy and Arrhythmia
  description: >-
    The myocardium derives most of its ATP from fatty acid oxidation, so the
    long-chain defects (CACT, CPT2 neonatal form, VLCAD, LCHAD and TFP,
    OCTN2) produce hypertrophic or dilated cardiomyopathy and
    arrhythmias, the main cause of early death in the severe forms. Carnitine
    repletion reverses it in OCTN2 deficiency, and anaplerotic odd-chain
    substrate improves cardiac function in the long-chain enzyme defects.
    Conforming entries record the cardiac phenotype class and whether the
    arrhythmic component is attributed to accumulated acylcarnitines.
  role: consequence
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: fatty acid oxidation
    term:
      id: GO:0019395
      label: fatty acid oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:9973285
    reference_title: "Clear correlation of genotype with disease phenotype in very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a severe childhood form, with early onset, high mortality, and high incidence of cardiomyopathy"
    explanation: Cardiomyopathy as the marker of the null-activity form.
  - reference: PMID:20049534
    reference_title: "Fatty acid oxidation disorders: outcome and long-term prognosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Carnitine-acylcarnitine translocase and early-onset carnitine palmitoyl transferase type II (CPT II) deficiencies have an extremely high neonatal mortality rate."
    explanation: The lethality of the complete long-chain carnitine-cycle block, which is cardiac in the neonatal forms.
  - reference: PMID:22989098
    reference_title: "Systemic primary carnitine deficiency: an overview of clinical manifestations, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Once the diagnosis of CDSP is established in an individual, an echocardiogram, electrocardiogram, CK concentration, liver transaminanses measurement, and pre-prandial blood sugar levels, should be performed for baseline assessment."
    explanation: The cardiac and arrhythmic surveillance built into management reflects the myocardial outcome of a carnitine-cycle lesion.
  - reference: PMID:30401918
    reference_title: "Management and diagnosis of mitochondrial fatty acid oxidation disorders: focus on very-long-chain acyl-CoA dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recently, a double-blind, randomized controlled trial of triheptanoin (seven-carbon fatty acid triglyceride) versus trioctanoin (regular medium-chain triglyceride) was conducted and demonstrated improvement of cardiac functions on triheptanoin."
    explanation: Reversibility of the cardiac outcome by restoring oxidizable substrate, consistent with it being an energy-failure node rather than a structural one.

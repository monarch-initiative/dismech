name: Atherogenesis Module
description: >-
  A conserved pathophysiology module representing the formation of an atheroma
  (atherosclerotic plaque), the lipid-rich intimal lesion that recurs across
  coronary artery disease, ischemic stroke, peripheral artery disease, and
  aortic atherosclerosis. Endothelial dysfunction increases arterial-wall
  permeability and permits retention of apoB-containing lipoproteins (LDL) in the
  subendothelial space - the critical initiating event. Retained, modified LDL
  recruits monocytes that become macrophages and internalize the lipoproteins to
  form foam cells, the hallmark of the fatty streak, amid a self-amplifying
  inflammatory response. Vascular smooth muscle cells switch phenotype, migrate
  into the intima, proliferate, and secrete extracellular matrix, building a
  fibrofatty plaque with a lipid/necrotic core beneath a fibrous cap. Advanced
  plaques may destabilize; cap rupture or endothelial erosion can expose
  thrombogenic material and trigger luminal thrombosis, causing acute ischemic
  events. The
  module captures the shared core across atherosclerotic vascular disorders.
  Conforming disorder branches substitute the disease-specific driver (LDL
  burden and apoB in familial hypercholesterolemia, hyperglycemia/AGEs in
  diabetic atherosclerosis, hypertension-associated endothelial injury,
  smoking) while preserving the core LDL retention -> foam cell ->
  SMC/extracellular-matrix fibrofatty plaque chain. Advanced atheroma,
  rupture/thrombosis, stenosis, and ischemia are optional stage consequences;
  they are not required for every conforming branch.
category: Module
creation_date: "2026-07-16T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a pathological
  structure-formation ("Xogenesis") module. Xogenesis anchor: the terminal
  output is an atheroma / atherosclerotic plaque, an OGMS:0000078 pathological
  anatomical structure produced by an OGMS:0000081 pathological derivation (a new
  intimal lesion); process genus OGMS:0000061 pathological bodily process; site
  UBERON:0001637 artery. MPATH represents the lesion as MPATH:28 (atherosclerosis)
  but has no distinct "atheroma"/"atherosclerotic plaque" continuant class, a
  noted OBO gap. SNOMED "Morphologically abnormal structure" (49755003) is used
  only as an external census/gap guide and is not bound here. Disorder entries
  reference individual nodes via conforms_to (for example, "atherogenesis#Smooth
  Muscle Cell Switching and Fibrofatty Plaque Formation"). The module defines the
  expected pathophysiology structure; conforming nodes in disorder files should
  include the corresponding cell types, biological processes, and causal edges,
  specialized to their disease context. A pathophysiology branch is within scope
  when it explicitly represents formation of an arterial-intimal atheroma through
  (1) retention of apoB-containing lipoprotein in the arterial intima, with
  oxidative or enzymatic modification as a possible specialization, (2)
  monocyte/macrophage foam-cell biology, and (3) vascular-smooth-muscle-cell and
  extracellular-matrix assembly of a fibrofatty plaque. This core three-stage
  chain is the operational necessary-and-sufficient curation boundary for module
  conformance; it is a prose guardrail, not a formal grouping criterion.
  Advanced necrotic core/fibrous cap, rupture or erosion with thrombosis,
  stenosis, and ischemia may be mapped when the disorder explicitly represents
  those later stages, but none is required and none is sufficient alone. Exclude
  hyperlipidemia or vascular risk without an explicit arterial plaque-forming
  branch, foam cells outside arterial atheroma, nonatherosclerotic stenosis,
  dissection or thrombosis, and terminal ischemia without modeled plaque
  formation. Because conformance is node-level, an explicit atherosclerotic
  branch of a mixed-etiology disorder may qualify without asserting that every
  disease mechanism is atherogenic. Familial hypercholesterolemia substitutes a
  high LDL/apoB burden at the retention trigger; diabetic atherosclerosis
  substitutes hyperglycemia and advanced glycation end-products; the terminal
  rupture/thrombosis node feeds the thrombogenesis module. Mechanism nodes bind
  GO, CL, and UBERON terms where appropriate and do not use chemical (CHEBI) or
  disease (MONDO) term bindings, except in the treatments block where the
  therapeutic agent carries an ontology identifier per the treatment schema.
pathophysiology:
- name: Endothelial Dysfunction and Subendothelial LDL Retention
  description: >-
    The proximal trigger of atherogenesis. Endothelial dysfunction - from
    disturbed flow, hypercholesterolemia, hypertension, smoking, or hyperglycemia
    - increases arterial-wall permeability and alters the subendothelial matrix,
    permitting infiltration and retention of apoB-containing lipoproteins (LDL)
    in the intima. Retained LDL is oxidatively and enzymatically modified,
    becoming a pro-inflammatory stimulus. This subendothelial lipoprotein
    retention is the critical initiating event of the plaque; the disease-specific
    driver differs but the retained-LDL trigger is shared.
  role: trigger
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cholesterol homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26844337
    reference_title: "The Role of Lipids and Lipoproteins in Atherosclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      infiltration and retention of apoB containing lipoproteins in the artery
      wall is a critical initiating event that sparks an inflammatory response
      and promotes the development of atherosclerosis.
    explanation: >-
      Identifies subendothelial retention of apoB-containing lipoproteins as the
      critical initiating event of atherosclerosis, the trigger of this module.
      Evidence source is OTHER because this is an authoritative review chapter.
  - reference: PMID:31684100
    reference_title: "The Role of Protein SUMOylation in the Pathogenesis of Atherosclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endothelial cell dysfunction in the walls of blood vessels results in an
      increase in vascular permeability, alteration of the components of the
      extracellular matrix, and retention of LDL in the sub-endothelial space,
      thereby accelerating plaque formation.
    explanation: >-
      Links endothelial dysfunction to increased permeability and subendothelial
      LDL retention accelerating plaque formation, the trigger of this module.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Monocyte Recruitment and Macrophage Foam Cell Formation
- name: Monocyte Recruitment and Macrophage Foam Cell Formation
  description: >-
    Retained, modified LDL and activated endothelium recruit circulating
    monocytes into the intima, where they differentiate into macrophages and
    internalize the lipoproteins through scavenger receptors, becoming
    lipid-laden foam cells - the hallmark of the fatty streak. Foam-cell
    macrophage inflammation amplifies oxidative stress and cytokine secretion,
    driving further LDL oxidation, endothelial activation, and monocyte
    recruitment in a feed-forward loop. This is the amplifying step of
    atherogenesis.
  role: amplifier
  cell_types:
  - preferred_term: foam cell (lipid-laden macrophage)
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: foam cell differentiation
    term:
      id: GO:0090077
      label: foam cell differentiation
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26844337
    reference_title: "The Role of Lipids and Lipoproteins in Atherosclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Internalization of the apoB containing lipoproteins by macrophages promotes
      foam cell formation, which is the hallmark of the fatty streak phase of
      atherosclerosis.
    explanation: >-
      Establishes macrophage internalization of apoB lipoproteins driving foam
      cell formation as the hallmark of the fatty streak, the amplifier of this
      module. Evidence source is OTHER because this is a review chapter.
  - reference: PMID:26844337
    reference_title: "The Role of Lipids and Lipoproteins in Atherosclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Macrophage inflammation results in enhanced oxidative stress and
      cytokine/chemokine secretion, causing more LDL/remnant oxidation,
      endothelial cell activation, monocyte recruitment, and foam cell formation.
    explanation: >-
      Documents the feed-forward inflammatory loop (oxidative stress, cytokine
      secretion, further LDL oxidation, monocyte recruitment) that amplifies
      foam-cell formation. Evidence source is OTHER because this is a review
      chapter.
  downstream:
  - target: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
- name: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
  description: >-
    The rate-limiting central effector of atheroma formation. In the inflamed,
    lipid-rich intima, vascular smooth muscle cells undergo phenotypic switching
    from a contractile to a synthetic/migratory state, migrate into the intima,
    proliferate, and secrete extracellular matrix. Together with foam cells and a
    growing lipid/necrotic core, this builds the organized fibrofatty plaque
    capped by a smooth-muscle- and matrix-rich fibrous cap. This SMC-driven
    plaque assembly is the disorder-agnostic step that converts a fatty streak
    into an atheroma and is the key conformance target of the module.
  role: central_effector
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  biological_processes:
  - preferred_term: smooth muscle cell proliferation
    term:
      id: GO:0048661
      label: positive regulation of smooth muscle cell proliferation
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: "The microenvironment of the atheroma expresses phenotypes of plaque instability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vascular smooth muscle cell phenotypic switching through
      transdifferentiation and stem/progenitor cell activation resulting in the
      promotion of inflammation, calcification, and secretion of extracellular
      matrix, altering fibrous cap structure, and necrotic core growth.
    explanation: >-
      Directly describes smooth muscle cell phenotypic switching driving
      extracellular-matrix secretion, fibrous-cap remodeling, and necrotic-core
      growth, the central effector of plaque formation. Evidence source is OTHER
      because this is a histopathology review.
  downstream:
  - target: Advanced Atheroma with Necrotic Core and Fibrous Cap
- name: Advanced Atheroma with Necrotic Core and Fibrous Cap
  description: >-
    Continued lipid accumulation, foam-cell death, and matrix remodeling enlarge
    the plaque into an advanced atheroma with a soft necrotic lipid core walled
    off by a fibrous cap. Local microenvironmental changes - neovascularization
    from the vasa vasorum, intraplaque hemorrhage, and necrotic-core expansion -
    promote the transition from a stable to an unstable (vulnerable) atheroma.
    This is the mature pathological structure the module produces.
  role: effector
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  locations:
  - preferred_term: artery
    term:
      id: UBERON:0001637
      label: artery
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: "The microenvironment of the atheroma expresses phenotypes of plaque instability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the local arterial microenvironment of a stable atheroma promotes
      destabilizing conditions that result in the transition to an unstable
      atheroma.
    explanation: >-
      Establishes the advanced atheroma and its microenvironment-driven
      transition from stable to unstable plaque, the effector structure of this
      module. Evidence source is OTHER because this is a histopathology review.
  downstream:
  - target: Plaque Rupture, Thrombosis, and Ischemic Events
- name: Plaque Rupture, Thrombosis, and Ischemic Events
  description: >-
    The clinical end state of the module. Fibrous-cap rupture (or endothelial
    erosion) of an unstable atheroma exposes the thrombogenic necrotic core and
    subendothelial matrix to flowing blood, triggering luminal thrombosis (see
    the thrombogenesis module). The resulting thrombotic vascular occlusion causes
    acute ischemic events - acute coronary syndrome, myocardial infarction, and
    ischemic stroke - the consequence of the conserved atherogenesis chain.
  role: consequence
  evidence:
  - reference: PMID:37595697
    reference_title: "The microenvironment of the atheroma expresses phenotypes of plaque instability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are several rupture-associated phenotypes causing thrombotic vascular
      occlusion including simple fibrous cap rupture of an atheroma, fibrous cap
      rupture at site of previous rupture-and-repair of an atheroma, and nodular
      calcification with rupture.
    explanation: >-
      Documents fibrous-cap rupture of the atheroma causing thrombotic vascular
      occlusion, the consequence that links atherogenesis to acute ischemic
      events. Evidence source is OTHER because this is a histopathology review.
  - reference: PMID:37595697
    reference_title: "The microenvironment of the atheroma expresses phenotypes of plaque instability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Destabilization is characterized by several different plaque phenotypes
      that cause major clinical events such as acute coronary syndrome and
      cerebrovascular strokes.
    explanation: >-
      Establishes acute coronary syndrome and stroke as the major clinical events
      caused by atheroma destabilization, the consequence of this module.
      Evidence source is OTHER because this is a review.
  - reference: PMID:37595697
    reference_title: "The microenvironment of the atheroma expresses phenotypes of plaque instability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endothelial erosion without rupture has more recently been shown to be a
      common phenotype to promote thrombosis as well.
    explanation: >-
      Directly supports endothelial erosion as a thrombosis-promoting alternative
      to fibrous-cap rupture in the consequence node. Evidence source is OTHER
      because this is a histopathology review.
treatments:
- name: LDL-Lowering Therapy (Statin)
  description: >-
    Statins (HMG-CoA reductase inhibitors, e.g., atorvastatin) lower circulating
    LDL cholesterol, the apoB-containing lipoprotein retained in the artery wall.
    By reducing the retained-LDL substrate that initiates and fuels the plaque,
    LDL-lowering therapy slows atheroma formation and progression and reduces
    atherosclerotic cardiovascular events. Represents the atherogenesis
    drug-target design pattern for conforming disorders, acting on the LDL-retention
    trigger rather than on the established plaque.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
  target_mechanisms:
  - target: Endothelial Dysfunction and Subendothelial LDL Retention
    treatment_effect: INHIBITS
    description: >-
      Lowering circulating LDL reduces the apoB-lipoprotein substrate retained in
      the subendothelial space, blunting the initiating trigger of plaque
      formation.
  evidence:
  - reference: PMID:30712900
    reference_title: "Efficacy and safety of statin therapy in older people: a meta-analysis of individual participant data from 28 randomised controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statin therapy has been shown to reduce major vascular events and vascular
      mortality in a wide range of individuals
    explanation: >-
      A meta-analysis of randomized statin trials shows that statin therapy
      reduces major vascular events, validating LDL lowering as a
      disease-modifying target. Evidence source is HUMAN_CLINICAL because it
      pools randomized controlled trials.
  - reference: PMID:26844337
    reference_title: "The Role of Lipids and Lipoproteins in Atherosclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      elevated levels of LDL cholesterol and apolipoprotein B (apoB) 100, the
      main structural protein of LDL, are directly associated with risk for
      atherosclerotic cardiovascular events (ASCVE).
    explanation: >-
      Establishes elevated LDL/apoB as directly associated with atherosclerotic
      cardiovascular events, the causal rationale for LDL lowering as the drug
      target. Evidence source is OTHER because this is a review chapter.

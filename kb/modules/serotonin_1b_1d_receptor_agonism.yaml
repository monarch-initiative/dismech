- name: "Presynaptic Inhibition of Trigeminal Neuropeptide Release via 5-HT1D"
  role: effector
  biological_scale: CELLULAR
  description: >-
    Agonist occupancy of 5-HT1D receptors on trigeminal sensory terminals suppresses release of
    calcitonin gene-related peptide and the other vasoactive neuropeptides those terminals discharge
    during an attack. This is the non-vascular half of the class's action, and it is the half the
    later CGRP-directed drugs target further downstream.
  biological_processes:
  - preferred_term: "neuropeptide secretion from presynapse"
    term:
      id: GO:0099539
      label: "neuropeptide secretion from presynapse"
    modifier: DECREASED
  cell_types:
  - preferred_term: "trigeminal sensory neuron"
    term:
      id: CL:4023170
      label: "trigeminal sensory neuron"
  locations:
  - preferred_term: "trigeminal ganglion"
    term:
      id: UBERON:0001675
      label: "trigeminal ganglion"
  genes:
  - preferred_term: "HTR1D"
    term:
      id: hgnc:5289
      label: "HTR1D"
  evidence:
  - reference: PMID:8388188
    reference_title: "The trigeminovascular system and migraine: studies characterizing cerebrovascular and neuropeptide changes seen in humans and cats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Trigeminal ganglion stimulation at a frequency of 5 per second also led to a release into the cranial circulation of calcitonin gene-related peptide (CGRP), with the level rising from 67 +/- 3 to 82 +/- 5 pmol/liter on the side of stimulation. These increases were also markedly antagonized by both sumatriptan and dihydroergotamine."
    explanation: "The mechanistic demonstration: trigeminal stimulation releases CGRP, and sumatriptan blocks that release."
  - reference: PMID:27465216
    reference_title: "The Role of 5-Hydroxytryptamine in the Pathophysiology of Migraine and its Relevance to the Design of Novel Treatments."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "inhibition of the trigeminovascular system responses implicated in migraine (via 5-HT1D/5-HT1F receptors)"
    explanation: "Attributes the trigeminovascular-inhibition arm to 5-HT1D, which is the receptor bound on this node."
  downstream:
  - target: "Interruption of Trigeminovascular Nociceptive Signalling"
- name: "Interruption of Trigeminovascular Nociceptive Signalling"
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The two arms converge: the dilated extracerebral vessels constrict and the trigeminal terminals
    stop discharging neuropeptide, so the trigeminovascular response that sustains the attack is
    interrupted. This is the step the therapeutic endpoint runs through, and it is the key
    conformance target for an entry that models the mechanism rather than the drug.
  evidence:
  - reference: PMID:8388188
    reference_title: "The trigeminovascular system and migraine: studies characterizing cerebrovascular and neuropeptide changes seen in humans and cats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Stimulation of the trigeminal ganglion led to a frequency-dependent increase in cerebral blood flow, with a mean maximum of 43 +/- 9% at a stimulus frequency of 20 per second. There was a marked reduction in these responses by some 50% after administration of either sumatriptan or dihydroergotamine."
    explanation: "Shows the trigeminovascular response itself being halved by the drug, which is the convergent step rather than either arm alone."
  - reference: PMID:8388188
    reference_title: "The trigeminovascular system and migraine: studies characterizing cerebrovascular and neuropeptide changes seen in humans and cats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "In 7 of 8 patients responding to subcutaneous sumatriptan administration, elevated CGRP levels (60 +/- 8 pmol/liter) were normalized, with the headache being relieved (40 +/- 8 pmol/liter)."
    explanation: "The human counterpart, which is a correlation between peptide normalisation and headache relief rather than a demonstration of sequence; graded INDIRECT for that reason."
  downstream:
  - target: "Headache Response and Sustained Pain Freedom"
- name: "Headache Response and Sustained Pain Freedom"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical endpoints the class is prescribed for, and the honest size of them: a majority get
    headache response by two hours, under a third are pain free at two hours, and only a fifth are
    pain free at two hours and stay that way through twenty-four. The attrition between those three
    numbers is part of this node, because a module that recorded only the response rate would
    overstate the class.
  evidence:
  - reference: PMID:11728541
    reference_title: "Oral triptans (serotonin 5-HT(1B/1D) agonists) in acute migraine treatment: a meta-analysis of 53 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Mean results for 100 mg sumatriptan were 59% (95% CI 57-60) for 2 h headache response (improvement from moderate or severe to mild or no pain); 29% (27-30) for 2 h pain free (improvement to no pain); 20% (18-21) for sustained pain free"
    explanation: "The three graded endpoints, pooled across the trial set, including the attrition between them."
  - reference: PMID:11728541
    reference_title: "Oral triptans (serotonin 5-HT(1B/1D) agonists) in acute migraine treatment: a meta-analysis of 53 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "INTERPRETATION: At marketed doses, all oral triptans were effective and well tolerated."
    explanation: "The pooled verdict on the class as a whole rather than on one agent."
- name: "Coronary and Systemic Vasoconstriction Contraindicating Use in Vascular Disease"
  role: adverse_effect
  biological_scale: TISSUE
  description: >-
    The 5-HT1B receptor is not confined to cranial extracerebral vessels, so the constrictor action
    reaches the coronary and other systemic beds. The consequence is a hard contraindication in
    established vascular disease, which excludes a substantial share of the patients who need acute
    treatment and is the clinical gap the non-vasoconstrictor classes were developed to fill.
  biological_processes:
  - preferred_term: "vasoconstriction"
    term:
      id: GO:0042310
      label: "vasoconstriction"
    modifier: INCREASED
  locations:
  - preferred_term: "coronary artery"
    term:
      id: UBERON:0001621
      label: "coronary artery"
  genes:
  - preferred_term: "HTR1B"
    term:
      id: hgnc:5287
      label: "HTR1B"
  evidence:
  - reference: PMID:27465216
    reference_title: "The Role of 5-Hydroxytryptamine in the Pathophysiology of Migraine and its Relevance to the Design of Novel Treatments."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "a number of patients do not respond well to the triptans and are contraindicated in patients with cardiovascular pathologies."
    explanation: "States the contraindication that this node exists to carry."
  - reference: PMID:27465216
    reference_title: "The Role of 5-Hydroxytryptamine in the Pathophysiology of Migraine and its Relevance to the Design of Novel Treatments."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "This mini-review outlines further developments in the design of novel (non-vasoconstrictor) antimigraine treatments acting via 5-HT receptors"
    explanation: "Supports reading the vasoconstrictor liability as the specific problem the successor classes were designed around, rather than as an incidental adverse effect."
- name: "Chest and Central Nervous System Sensations on Triptan Therapy"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    Chest tightness or pressure, and central nervous system effects such as dizziness, paraesthesia
    and somnolence, are the characteristic tolerability cost of the class. Both are
    placebo-subtracted in the pooled data, so the rates are attributable to the drug; the chest rate
    is small in absolute terms and the central one several times larger. No vascular parentage is
    asserted for the chest symptoms: see the module notes.
  evidence:
  - reference: PMID:11728541
    reference_title: "Oral triptans (serotonin 5-HT(1B/1D) agonists) in acute migraine treatment: a meta-analysis of 53 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "placebo-subtracted proportions for patients with at least one adverse event (AE) were 13% (8-18), for at least one central nervous system AE 6% (3-9), and for at least one chest AE 1.9% (1.0-2.7)."
    explanation: "The placebo-subtracted rates for both symptom groups, which is what makes them attributable to the drug rather than to the attack."
- name: "Migraine Progression on Frequent Triptan Use in High-Frequency Headache"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    Frequent use of acute treatment is the most-cited risk factor for episodic migraine becoming
    chronic, but the class-specific picture is narrower than that framing suggests. Triptans were
    associated with progression only in patients already having migraine on ten to fourteen days a
    month, and not in the cohort overall; opioids and barbiturates were associated with progression
    at lower exposure thresholds. This node asserts the conditional finding and no more.
  evidence:
  - reference: PMID:19029522
    reference_title: "Excessive acute migraine medication use and migraine progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Triptans induced migraine progression in those with high frequency of migraine at baseline (10-14 days per month), but not overall."
    explanation: "The exact conditional claim this node makes, including the negative half."
  - reference: PMID:19029522
    reference_title: "Excessive acute migraine medication use and migraine progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "high frequency of headaches seems to be a risk factor for chronic migraine regardless of medication exposure."
    explanation: "Supports attributing the risk primarily to baseline headache frequency rather than to the drug class, which is why this node is scoped to the high-frequency stratum."

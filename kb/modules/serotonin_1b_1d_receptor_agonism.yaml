      label: "HTR1D"
  evidence:
  - reference: PMID:27465216
    reference_title: "The Role of 5-Hydroxytryptamine in the Pathophysiology of Migraine and its Relevance to the Design of Novel Treatments."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "the development of sumatriptan and second generation triptans in the 1990's led to discover that these drugs produce selective cranial extracerebral vasoconstriction (via 5-HT1B receptors) and inhibition of the trigeminovascular system responses implicated in migraine (via 5-HT1D/5-HT1F receptors)."
    explanation: "Establishes that the class acts through 5-HT1B and 5-HT1D, and that the two receptors carry the two separate mechanisms this node feeds."
  - reference: PMID:11728541
    reference_title: "Oral triptans (serotonin 5-HT(1B/1D) agonists) in acute migraine treatment: a meta-analysis of 53 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "The triptans, selective serotonin 5-HT(1B/1D) agonists, are very effective acute migraine drugs with a well- developed scientific rationale."
    explanation: "Names the receptor selectivity that makes this node receptor-specific rather than a generic serotonergic one."
  downstream:

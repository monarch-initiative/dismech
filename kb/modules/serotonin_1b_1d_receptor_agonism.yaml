name: 5-HT1B/1D Receptor Agonism Module
description: "Direct pharmacological activation of 5-HT1B and 5-HT1D serotonin receptors by the triptan class, and the two parallel mechanisms that follow from it: 5-HT1B-mediated constriction of cranial extracerebral vessels, and 5-HT1D-mediated presynaptic inhibition of neuropeptide release from trigeminal sensory neurons. Both arms converge on the key conformance target, \"Interruption of Trigeminovascular Nociceptive Signalling\", which is the step the therapeutic consequence runs through. A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"5-HT1B/1D Receptor Agonist Occupancy\", which represents the drug's receptor occupancy rather than the signalling state it produces; both current conformers do this. The vasoconstrictor arm carries its own adverse branch, and that branch is the reason the non-vasoconstrictor antimigraine classes exist, so it is modelled here rather than treated as incidental. Scope: this module covers agonism at 5-HT1B and 5-HT1D only. CGRP receptor antagonism is a separate module, by the project rule that one receptor family plus one direction of pharmacological action makes one module -- the gepants act on a different receptor in the opposite direction, and their clinical point is precisely that they lack the vasoconstriction this module's adverse branch carries. 5-HT1F agonism (the ditans) is excluded for the same reason."
category: Module
module_categories:
- PHARMACOLOGY
- NEUROSCIENCE
creation_date: '2026-10-24T09:10:00Z'
notes: "Scope decisions recorded for the next curator. The chest and central nervous system sensations node hangs off the trigger rather than off the vasoconstriction node: the pooled trial data establish the rates but report no mechanism, and the conventional coronary attribution for triptan chest symptoms is contested, so no vascular parentage is asserted. The migraine-progression node is deliberately narrow -- the cited review found progression on triptans only in patients already having headache on 10 to 14 days a month and not overall, and the node says so, because a blanket class-chronification claim is not what the source supports. The CGRP-release arm carries two evidence items of different kinds on purpose: the trigeminal-stimulation experiment is the mechanistic one and is model-organism evidence, while the human arm is a correlation between peptide normalisation and headache relief, not a demonstration of sequence. Familial_Hemiplegic_Migraine is not wired as a conformer although it is a migraine entry: its own management is avoidance of vasoconstricting agents, and a disease that withholds a drug class is not an instance of that class's mechanism. Its relation to this module is the adverse branch, not the therapeutic one."
pathophysiology:
- name: "5-HT1B/1D Receptor Agonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A triptan binds and activates 5-HT1B and 5-HT1D receptors. The class is selective for these
    subtypes, and the two receptors sit in different places -- 5-HT1B on the smooth muscle of
    cranial extracerebral vessels, 5-HT1D presynaptically on trigeminal sensory terminals -- which
    is why one drug produces two mechanisms rather than one.
  molecular_functions:
  - preferred_term: "5-HT1B/1D receptor activation by a triptan"
    term:
      id: GO:0001586
      label: "Gi/o-coupled serotonin receptor activity"
    modifier: INCREASED
  locations:

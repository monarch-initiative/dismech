  - target: "Presynaptic Inhibition of Trigeminal Neuropeptide Release via 5-HT1D"
  - target: "Chest and Central Nervous System Sensations on Triptan Therapy"
  - target: "Migraine Progression on Frequent Triptan Use in High-Frequency Headache"
- name: "Cranial Extracerebral Vasoconstriction via 5-HT1B"
  role: effector
  biological_scale: TISSUE
  description: >-
    Agonist occupancy of 5-HT1B receptors on cranial extracerebral vascular smooth muscle constricts
    the dilated meningeal and other extracerebral vessels. The selectivity is for the extracerebral
    bed rather than the cerebral circulation, which is what made the class usable at all; it is not
    absolute, and the residual action elsewhere is this module's adverse branch.

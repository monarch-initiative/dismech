name: Skeletal Muscle Mechanotransduction Failure Module
description: >-
  A conserved module for skeletal muscle losing mass because the mechanical
  signal that maintains it is absent or is not transduced. The chain runs: reduced
  mechanical loading, or a defective Z-disc or costamere mechanosensor, leaves
  load-dependent mTORC1 activation unengaged; myofibrillar protein synthesis
  falls; and the fibre atrophies. The key conformance target is Impaired
  Load-Dependent mTORC1 Activation, where the two entry routes converge. Disuse
  (bed rest, immobilisation, spaceflight) supplies the absent signal. Filamin C,
  BAG3 and the chaperone-assisted selective autophagy (CASA) complex form the
  best-characterised sensor, and loss of the sensor's own function is the second
  route. Ageing muscle that responds weakly to a normal load (sarcopenia)
  conforms at the central effector. The drug-target pattern is restoring the
  signal: progressive resistance training, or neuromuscular electrical
  stimulation where voluntary loading is impossible. Complementary to, not
  overlapping with, deregulated_nutrient_sensing (mTORC1 driven by nutrients
  and growth factors, where the ageing pathology is excess rather than deficient
  mTORC1 activity) and mitochondrial_dysfunction (the bioenergetic arm of muscle
  ageing).
category: Module
creation_date: "2026-10-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease; do not create a disuse-atrophy
  Disease entry from it. Conforming entries substitute their own trigger: disuse
  or inactivity at the first node; a sensor-gene lesion (FLNC, BAG3, HSPB8,
  DNAJB6) at the sensor node; ageing at the central effector. Two cautions apply
  when conforming.
  (1) The mTORC1-to-protein-synthesis link differs between species. In humans,
  acute rapamycin blocks the early contraction-induced rise in muscle protein
  synthesis. In muscle-specific raptor knockout mice, load still raises
  synthesis although hypertrophy is lost. The edge is kept with both items
  attached, and the discrepancy is recorded as a human-model-mismatch
  discussion.
  (2) The Myofibrillar Myopathy CASA node is primarily a protein-quality-control
  failure whose terminal lesion is Z-disc aggregation rather than atrophy. It
  conforms at the sensor node only, because CASA is the tension-induced pathway
  that senses filamin unfolding; it does not inherit the atrophy chain.
  Biomechanics (force, strain, tissue-level stress fields) is not represented;
  the module begins at the cellular sensing of load.
pathophysiology:
- name: Reduced Mechanical Loading of Skeletal Muscle
  description: >-
    Withdrawal of the contractile and weight-bearing load that skeletal muscle
    normally experiences: bed rest, limb immobilisation or suspension, reduced
    step count, spaceflight, or habitual inactivity. In healthy people, absent
    loading alone is sufficient to cause atrophy.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: skeletal muscle organ
    term:
      id: UBERON:0014892
      label: skeletal muscle organ, vertebrate
  evidence:
  - reference: PMID:38895777
    reference_title: "Skeletal muscle immobilisation-induced atrophy: mechanistic insights from human studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In healthy (i.e., non-disease) states, the absence of muscle loading causes muscle atrophy, as is seen in the case of bed rest"
    explanation: States that absence of loading is sufficient for atrophy in otherwise healthy humans.
  downstream:
  - target: Z-Disc and Costamere Mechanosensor Dysfunction
    causal_link_type: DIRECT
    description: Without load there is no input for the mechanosensors to transduce.
    evidence:
    - reference: PMID:42437908
      reference_title: "Integrin-β1/FAK signaling is involved in electrical stimulation to prevent disuse muscular atrophy induced by tail suspension in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, integrin β1 expression was lower in the TS group compared with the control group (p < 0.05)."
      explanation: >-
        Hindlimb unloading by tail suspension lowers expression of the integrin
        mechanosensor in mouse muscle.

- name: Z-Disc and Costamere Mechanosensor Dysfunction
  description: >-
    Myofibers sense load through structures that deform under tension. The best
    characterised is the CASA complex (BAG3 with HSPA8/Hsc70 and HSPB8), which
    recognises mechanically unfolded filamin C at the Z-disc, routes damaged
    filamin to autophagy, drives filamin transcription through YAP/TAZ, and
    positions TSC1/TSC2 to regulate mTORC1. Costamere integrin-FAK signalling and
    a DGKzeta-phosphatidic acid axis are further candidate sensors. Sensing fails
    either because there is no load to sense or because a sensor component is
    lost.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: cellular response to mechanical stimulus
    term:
      id: GO:0071260
      label: cellular response to mechanical stimulus
    modifier: DECREASED
  evidence:
  - reference: PMID:23434281
    reference_title: "Cellular mechanotransduction relies on tension-induced and chaperone-assisted autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we identify chaperone-assisted selective autophagy (CASA) as a tension-induced autophagy pathway essential for mechanotransduction in muscle and immune cells."
    explanation: Identifies CASA as a mechanotransduction pathway in muscle.
  - reference: PMID:23434281
    reference_title: "Cellular mechanotransduction relies on tension-induced and chaperone-assisted autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The CASA complex, comprised of the molecular chaperones Hsc70 and HspB8 and the cochaperone BAG3, senses the mechanical unfolding of the actin-crosslinking protein filamin."
    explanation: Names the sensor components and the mechanical event they detect.
  - reference: PMID:27909410
    reference_title: "Mechanosensitive Molecular Networks Involved in Transducing Resistance Exercise-Signals into Muscle Protein Accretion."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This may e.g. implicate mechanical activation of signaling through a diacylglycerol kinase (DGKζ)-phosphatidic acid (PA) axis or implicate integrin deformation to signal through a Focal adhesion kinase (FAK)-Tuberous Sclerosis Complex 2 (TSC2)-Ras homolog enriched in brain (Rheb) axis."
    explanation: Names the costamere and phosphatidic-acid candidate sensors.
  - reference: PMID:30335577
    reference_title: "Stimuli and sensors that initiate skeletal muscle hypertrophy following resistance exercise."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mechanical signals are the prime hypertrophy stimuli candidates, and a filamin-C-BAG3-dependent regulation of mTORC1, Hippo, and autophagy signaling is a plausible albeit still incompletely characterized hypertrophy sensor."
    explanation: Records filamin C-BAG3 as the leading but incompletely characterised sensor.
  downstream:
  - target: Impaired Load-Dependent mTORC1 Activation
    causal_link_type: DIRECT
    description: >-
      BAG3 binds TSC1 and recruits TSC complexes to the cytoskeleton, relieving
      mTORC1 inhibition in the rest of the cytoplasm so that strain stimulates
      translation.
    evidence:
    - reference: PMID:27756573
      reference_title: "The cochaperone BAG3 coordinates protein synthesis and autophagy under mechanical strain through spatial regulation of mTORC1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we demonstrate that BAG3 coordinates protein synthesis and autophagy through spatial regulation of the mammalian target of rapamycin complex 1 (mTORC1)."
      explanation: Connects the CASA sensor to mTORC1 regulation.
    - reference: PMID:27756573
      reference_title: "The cochaperone BAG3 coordinates protein synthesis and autophagy under mechanical strain through spatial regulation of mTORC1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In human muscle, an exercise-induced association of TSC1 with the cytoskeleton coincides with mTORC1 activation in the cytoplasm."
      explanation: Human muscle biopsy observation consistent with the same mechanism during exercise.

- name: Impaired Load-Dependent mTORC1 Activation
  description: >-
    The rate-limiting node and key conformance target. Mechanical load activates
    mTORC1 in the myofiber, and mTORC1 activity is necessary for load-induced
    hypertrophy and opposes disuse atrophy. When load is absent, the sensor is
    defective, or the fiber responds weakly (ageing), this activation is lost or
    blunted. Human rapamycin data tie mTORC1 to the load-induced rise in
    protein synthesis; a mouse raptor knockout does not (see the module notes
    and discussion).
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: load-induced TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:30509128
    reference_title: "The role of raptor in the mechanical load-induced regulation of mTOR signaling, protein synthesis, and skeletal muscle hypertrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we were able to directly demonstrate that mechanical stimuli can activate signaling by mTORC1, and that mTORC1 is necessary for mechanical load-induced hypertrophy"
    explanation: Genetic evidence that load activates mTORC1 and that hypertrophy requires it.
  - reference: PMID:11715023
    reference_title: "Akt/mTOR pathway is a crucial regulator of skeletal muscle hypertrophy and can prevent muscle atrophy in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Akt/mTOR pathway was upregulated during hypertrophy and downregulated during muscle atrophy."
    explanation: Pathway activity tracks loading direction in vivo.
  - reference: PMID:21798089
    reference_title: "Aging impairs contraction-induced human skeletal muscle mTORC1 signaling and protein synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that aging impairs contraction-induced human skeletal muscle mTORC1 signaling and protein synthesis."
    explanation: Human evidence for the blunted-response route by which ageing muscle reaches this node.
  downstream:
  - target: Reduced Myofibrillar Protein Synthesis
    causal_link_type: DIRECT
    description: >-
      The canonical model: mTORC1 drives translation through S6K1 and 4E-BP1, so
      losing load-dependent activation lowers synthesis. Supported by acute
      rapamycin in human muscle; contradicted by the chronic raptor knockout in
      mice.
    evidence:
    - reference: PMID:30335577
      reference_title: "Stimuli and sensors that initiate skeletal muscle hypertrophy following resistance exercise."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "A large body of work shows that a mammalian target of rapamycin complex 1 (mTORC1)-mediated increase of muscle protein synthesis is the key, but not sole, mechanism by which resistance exercise causes muscle hypertrophy."
      explanation: States the canonical mTORC1-to-synthesis model.
    - reference: PMID:19188252
      reference_title: "Rapamycin administration in humans blocks the contraction-induced increase in skeletal muscle protein synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we show that rapamycin treatment blocks the early (1-2 h) acute contraction-induced increase ( approximately 40%) in human muscle protein synthesis."
      explanation: >-
        Direct human test of the edge: blocking mTORC1 abolishes the early
        load-induced synthesis response.
    - reference: PMID:30509128
      reference_title: "The role of raptor in the mechanical load-induced regulation of mTOR signaling, protein synthesis, and skeletal muscle hypertrophy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "we also obtained multiple lines of evidence that indicate that mTORC1 is not required for a mechanical load-induced increase in the rate of protein synthesis"
      explanation: >-
        In muscle-specific raptor knockout mice, load still raised protein
        synthesis, which refutes mTORC1 being required for this specific step.

- name: Reduced Myofibrillar Protein Synthesis
  description: >-
    Without the loading stimulus, myofibrillar protein synthesis falls in both
    fasted and fed states and responds weakly to feeding. Protein breakdown also
    falls or stays unchanged in humans, by less, so net balance turns negative.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:38895777
    reference_title: "Skeletal muscle immobilisation-induced atrophy: mechanistic insights from human studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "myofibrillar MPS are reproducibly blunted, resulting in a 30–60% decline in overall MPS"
    explanation: Quantifies the synthesis decline across human disuse models.
  - reference: PMID:38895777
    reference_title: "Skeletal muscle immobilisation-induced atrophy: mechanistic insights from human studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "That said: in humans the most likely scenario is decreases in both MPS and MPB, with the latter being of lesser magnitude"
    explanation: Supports synthesis rather than breakdown as the dominant driver in human disuse.
  downstream:
  - target: Skeletal Muscle Fiber Atrophy
    causal_link_type: DIRECT
    description: A sustained negative protein balance shrinks the fiber.
    evidence:
    - reference: PMID:38895777
      reference_title: "Skeletal muscle immobilisation-induced atrophy: mechanistic insights from human studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Periods of skeletal muscle disuse lead to rapid declines in muscle mass (atrophy), which is fundamentally underpinned by an imbalance between muscle protein synthesis (MPS) and muscle protein breakdown (MPB)."
      explanation: States that protein imbalance underlies disuse atrophy.

- name: Skeletal Muscle Fiber Atrophy
  description: >-
    Loss of fiber cross-sectional area and whole-muscle mass, and with it
    strength. In conforming diseases this is usually one input to a broader
    clinical endpoint that also has neural and quality components.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
  evidence:
  - reference: PMID:11715023
    reference_title: "Akt/mTOR pathway is a crucial regulator of skeletal muscle hypertrophy and can prevent muscle atrophy in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, genetic activation of the Akt/mTOR pathway was sufficient to cause hypertrophy and prevent atrophy in vivo, whereas genetic blockade of this pathway blocked hypertrophy in vivo."
    explanation: Shows fiber size follows mTOR pathway activity in vivo, closing the chain to atrophy.

treatments:
- name: Progressive Resistance Training
  description: >-
    Restores the missing input. Progressive loading engages the mechanosensors
    and load-dependent mTORC1 activation. In ageing muscle a higher relative
    intensity is needed for the same synthetic response.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: progressive resistance training
    term:
      id: NCIT:C62739
      label: Exercise Intervention
  target_mechanisms:
  - target: Reduced Mechanical Loading of Skeletal Muscle
    treatment_effect: INHIBITS
    description: Supplies the mechanical load whose absence starts the chain.
  evidence:
  - reference: PMID:19001042
    reference_title: "Age-related differences in the dose-response relationship of muscle protein synthesis to resistance exercise in young and old men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that in the post-absorptive state: (i) MPS is dose dependant on intensity rising to a plateau at 60-90% 1 RM; (ii) older men show anabolic resistance of signalling and MPS to resistance exercise."
    explanation: Supports intensity-dependent restoration of synthesis, blunted with age.
- name: Neuromuscular Electrical Stimulation
  description: >-
    Evokes contraction without voluntary effort, so it can load muscle during
    immobilisation, critical illness, or paralysis, when resistance training is
    impossible.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: neuromuscular electrical stimulation
    term:
      id: NCIT:C93012
      label: Neuromuscular Electrical Stimulation
  target_mechanisms:
  - target: Z-Disc and Costamere Mechanosensor Dysfunction
    treatment_effect: INHIBITS
    description: Re-engages integrin-FAK mechanosignalling in unloaded muscle.
  evidence:
  - reference: PMID:42437908
    reference_title: "Integrin-β1/FAK signaling is involved in electrical stimulation to prevent disuse muscular atrophy induced by tail suspension in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electrical stimulation upregulates the expression of the mechanosensor integrin β1 and enhances the phosphorylation of its downstream effector, FAK, in skeletal muscle."
    explanation: Mouse tail-suspension evidence that stimulation restores mechanosensor signalling.
  - reference: PMID:42437908
    reference_title: "Integrin-β1/FAK signaling is involved in electrical stimulation to prevent disuse muscular atrophy induced by tail suspension in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice in the tail suspension with electrical stimulation (TS + E) group exhibited significantly greater physiological cross-sectional area and muscle strength compared with the tail suspension (TS) group (p < 0.05)."
    explanation: Shows the functional benefit in the same model.

discussions:
- discussion_id: mtorc1_load_induced_synthesis_species_discrepancy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Acute mTORC1 inhibition blocks the load-induced rise in muscle protein
    synthesis in humans, yet mice with muscle-specific raptor deletion still
    raise synthesis under load. Is the mouse result a species difference, or an
    adaptation to chronic loss of mTORC1?
  attaches_to:
  - pathophysiology#Impaired Load-Dependent mTORC1 Activation
  - pathophysiology#Reduced Myofibrillar Protein Synthesis
  rationale: >-
    The two results differ in species and also in design: an acute drug block
    in humans against a chronic genetic deletion in mice. If chronic loss of
    mTORC1 lets another pathway take over synthesis, the human result is the one
    that applies to acute loading, but it may not apply to the long-term
    anabolic deficit in sarcopenia or disuse, where the lesion is chronic. This
    decides whether restoring mTORC1 activity is sufficient to restore synthesis
    in conforming diseases.
  proposed_experiments:
  - experiment_id: acute_vs_chronic_mtorc1_loss_mouse_loading
    name: Acute rapamycin versus chronic raptor deletion in loaded mouse muscle
    description: >-
      In the same mouse loading model, compare load-induced myofibrillar protein
      synthesis after acute rapamycin with that in inducible muscle-specific
      raptor knockouts, sampled at several times after deletion, with ERK1/2
      and other mTORC1-independent translation signals measured alongside.
    would_support:
    - pathophysiology#Impaired Load-Dependent mTORC1 Activation
    supporting_outcome:
    - >-
      Acute rapamycin blocks load-induced synthesis in mice as it does in
      humans, and the synthesis response returns only after prolonged raptor
      deletion, which would locate the discrepancy in compensation rather than
      species.
    refuting_outcome:
    - >-
      Acute rapamycin also fails to block load-induced synthesis in mice, which
      would make the discrepancy a species difference in how synthesis is
      coupled to load.
